的正确性。\n        *   **Robustness to Noise**：在输入数据中加入无关的短期噪音信息，测试模型是否能忽略噪音并聚焦于因果相关信号。\n\n3.  **预期发现**：\n    *   在长期趋势主导的任务中，两种方法表现相近。\n    *   在高波动性、短期信号主导的任务中，**Causal-Aware Dynamic Harness** 显著优于原方法，因为它能捕捉到被静态截断忽略的关键短期因果信息，同时通过因果验证避免了虚假关联。\n    *   蒸馏后的 Student Model 展现出更强的**Causal Reasoning**（因果推理）能力，而不仅仅是**Temporal Search**（时序搜索）能力。\n\n这一研究方向将焦点从“如何防止泄露”转移到“如何识别和利用因果信息”，从而解决静态截断方法的根本缺陷，并为 LLM 的**Causal Reasoning**（因果推理）能力内化提供新的路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Wanxu Cai\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Zhengyu Chen\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"§\"\n      ]\n    },\n    {\n      \"name\": \"Huaisheng Zhu\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Wei Wang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jingang Wang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Qiang Xu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"§\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"The Chinese University of Hong Kong\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Meituan LongCat Team\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"†\",\n      \"text\": \"Work done during an internship at Meituan.\"\n    },\n    {\n      \"marker\": \"§\",\n      \"text\": \"Corresponding author.\"\n    }\n  ]\n}\n```", "summary_translation": "未来事件预测具有广泛的社会影响，但仍充满挑战。现有最先进（SOTA）方法通过外部智能体框架增强大语言模型（LLMs），但一旦移除该框架，其预测能力便会消失。尽管近期的工具集成推理（Tool-Integrated Reasoning, TIR）将深度搜索内化以实现事实的多跳检索，但预测任务进一步要求对历史趋势和动态变化进行时间搜索与推理。关键障碍在于数据：历史查询会引发时间泄露，使预测退化为检索。以往工作要么通过静态观察冻结信息收集，要么依赖拒绝采样或未解决的实时查询，从而丢弃大量数据，降低了合成效率。我们提出了一种时间截断框架，在每一轮对话中强制执行时间截止，从而能够从历史事件中进行 TIR 风格的采样，减少时间泄露以及对拒绝采样或未解决查询的依赖，提高采样效率。我们进一步构建了一个大规模语料库和基于过程的指标，并证明我们的框架自然诱导了更广泛的时间搜索广度，提高了高质量数据的比例，进一步提升了效率并降低了对复杂评分标准的依赖。蒸馏实验表明，在框架干预数据上训练的学生模型取得了最佳性能，展示了框架辅助的模型演进，即将更高质量的时间搜索和推理数据转化为学生模型的参数化提升。"}]}, {"name": "Self-Improvement \u0026 Optimization", "count": 2, "papers": [{"title": "RSIBench-Data: Benchmarking Data-Centric Research for Recursive Self-Improvement", "arxiv_id": "2607.25886", "authors": "Fanqing Meng, Lingxiao Du, Qiguang Chen, Ziqi Zhao, Haocheng Lu, Mengkang Hu, Michael Qizhe Shieh", "summary": "Recursive self-improvement requires turning evidence of model failures into better models. Data-centric post-training research entails diagnosing capability gaps, designing and validating training-data strategies, and learning from checkpoint feedback. Can LLM agents automate this loop? Existing benchmarks entangle research decisions with optimization, serving, evaluation, and systems implementation, obscuring agents' research capability. We introduce RSIBench-Data, a controlled benchmark of LLM agents as data-centric researchers with a fixed post-training stack. Agents iteratively revise training-data strategies for a fixed target model; training and serving use Tinker-backed services, official evaluation runs through Harbor and E2B sandboxes, and budgets are fixed across agents. We evaluate four frontier agents on six benchmarks across software engineering, terminal use, scientific question answering, and mathematics. Agents demonstrate core data-centric research capabilities: in 58.33\\% of settings, they improve upon the first valid attempt by refining strategies from feedback. However, improvement is inconsistent. Among searches continuing after the best observed score, 78.26\\% end with a lower-scoring final attempt, while the rest only recover the same peak. A strong candidate may therefore appear early or midway through a run even as later revisions fail. Trajectory analysis identifies four patterns in stronger runs: accurate hypotheses, validation-grounded supervision, behavior-aligned data, and preservation of strong checkpoints. These findings suggest that current agents can make useful data-centric discoveries but cannot yet translate feedback into consistent improvements. RSIBench-Data provides a measurable, auditable testbed for the research capabilities required for recursive self-improvement. We open-source our code at https://github.com/evolvent-ai/RSIBench-Data.", "category": "cs.CL", "cluster": "Self-Improvement \u0026 Optimization", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving, LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=47 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文完全符合“LLM智能体及其演化”的研究范围，具体依据如下：\n\n1.  核心对象明确为 LLM Agents：论文标题和摘要明确指出研究对象是“LLM agents as data-centric researchers”（作为数据中心研究者的LLM智能体）。这直接对应了筛选标准中关于“构建、改进、评估 LLM智能体”的核心目标。\n2.  聚焦自我演化与迭代改进机制：论文的核心主题是“Recursive Self-Improvement”（递归自我改进），研究智能体如何通过“iteratively revise training-data strategies”（迭代修订训练数据策略）并利用反馈（feedback）来优化自身或目标模型。这完美契合筛选标准中“自我演化 (Self-Evolving)”方向，特别是“智能体通过经验、反思或环境反馈进行自我完善和迭代”的定义。\n3.  属于 Agentic AI 的前沿行为分析：虽然论文是一个基准测试（Benchmark），但根据筛选标准，“如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准... 只要结论直接帮助理解或改进智能体能力，也应保留”。该论文分析了智能体在自我改进过程中的失败模式（如“improvement is inconsistent”）和成功轨迹（如“accurate hypotheses, validation-grounded supervision”），这些发现对于理解智能体的自我演化能力边界至关重要。\n4.  排除项不适用：\n       它不是单纯的基础设施研究，而是研究智能体在固定基础设施下的研究能力和演化行为。\n       它不涉及被排除的“非演化型应用”，因为“自我改进”本身就是其核心机制。\n       它不涉及被排除的安全、对齐、多模态或图神经网络等无关领域。\n\n综上，该论文探讨了LLM智能体在递归自我改进场景下的能力、局限及演化机制，属于Agentic AI中Self-Evolving方向的高相关性研究。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在固定后训练基础设施（post-training stack）的前提下，LLM Agent 能否可靠地自动化 **data-centric post-training research**（以数据为中心的后训练研究）？具体而言，Agent 能否作为一个 **data-centric researcher agent**，通过形成关于模型失败的能力假设、设计并验证训练数据策略、从检查点（checkpoint）反馈中学习，并在有限预算下管理候选选择，从而迭代地改进目标模型？\n\n这一问题的重要性在于它是实现 **recursive self-improvement**（递归自我改进）的关键瓶颈。递归自我改进要求 AI 系统能够将关于模型失败的证据转化为有效的模型改进。虽然现有的 Agent 评估任务（如软件仓库交互、终端使用）暴露了丰富的中间轨迹和失败证据，但这些证据通常仅作为行为观察，而非直接用于改进模型的训练经验。现有的自动化后训练基准往往将研究决策与优化、服务、评估及系统实现纠缠在一起，导致无法隔离并量化 Agent 纯粹的“研究能力”。\n\n解决这一问题的价值在于提供了一个可控、可审计的测试床（testbed），即 **RSIBench-Data**。它通过固定基础模型、训练接口（Tinker-backed services）和评估沙箱（Harbor-orchestrated E2B sandboxes），将基础设施变更与研究进展分离。这使得研究者能够精确评估 Agent 在 **data-synthesis research**（数据合成研究）中的核心能力，如假设形成、策略修订和反馈利用，从而为开发更可靠的递归自我改进系统提供可测量的实证依据。\n\n### § 2 前人工作与不足\n\n该问题此前并未被完全解决，现有的相关工作主要存在评测范围过宽或隔离度不足的问题，导致无法准确评估 Agent 的数据中心研究能力。\n\n最相关的 prior methods 包括 **DataComp** 和 **DataComp-LM**，它们通过控制学习栈来研究从固定语料库中选择或策展哪些示例。然而，这些工作主要关注静态的数据选择，缺乏闭环的反馈驱动修订机制，且不提供可执行的训练经验合成（executable experience synthesis）。**DataEnvGym** 和 **Curation-Bench** 引入了学生模型或基准反馈，允许 Agent 跨轮次适应课程和策展策略，但它们并未要求 Agent 拥有完整的数据合成假设和修订过程，且基础设施控制不够严格。\n\n另一方面，**PostTrainBench** 和 **Agent[2] RL-Bench** 等基准评估更广泛的自动化后训练系统，赋予 Agent 对数据、优化、超参数和实现的广泛控制权。这种范式虽然能评估端到端系统的改进能力，但其广泛的范围模糊了 **data-centric research decisions**（以数据为中心的研究决策）的具体贡献。由于优化、服务和评估组件未被固定，Agent 的性能提升可能源于系统实现的优化而非数据策略的研究，使得归因变得困难。\n\n此外，**SWE-Gym** 和 **R2E-Gym** 提供了软件工程 Agent 的可执行环境和训练资源，但主要侧重于环境构建和经验生成，而非在固定栈下评估 Agent 作为独立研究者的迭代改进能力。\n\n综上所述，现有基准存在根本性的权衡：要么隔离单个数据操作但缺乏闭环进化，要么赋予广泛控制权但混淆了研究决策与系统实现。**RSIBench-Data** 填补了这一空白，它通过固定外围栈（训练、服务、评估），专门评估 LLM Agent 作为 **data-centric researcher** 的能力，从而解决了现有基准无法隔离和量化 Agent 在递归自我改进中数据研究能力的不足。", "core_insight": "### § 3 重建作者的思考路径\n\n在递归自我改进（Recursive Self-Improvement, RSI）的研究脉络中，核心挑战在于如何让 AI 系统利用自身失败的经验证据来迭代优化模型。早期的工作如 SWE-Gym 和 R2E-Gym 提供了可执行的环境和训练资源，而 DataComp 系列则侧重于在固定学习栈下研究数据选择。然而，现有的自动化后训练基准（如 PostTrainBench 和 Agent[2] RL-Bench）存在一个根本性的缺陷：它们将“研究决策”与“优化、服务、评估及系统实现”紧密耦合。在这种设定下，Agent 不仅负责设计数据策略，还控制超参数、优化器甚至评估流程。这种“黑盒”式的端到端控制使得研究者无法区分性能提升是源于 Agent 卓越的数据合成能力（Data-centric Research），还是源于其对训练基础设施的巧妙调整。\n\n与此同时，现有的数据生成基准（如 DataEnvGym）虽然引入了闭环反馈，但往往缺乏对“研究过程”的严格隔离和审计能力。如果我们要真正评估 LLM 作为“数据科学家”的能力，必须剥离基础设施的变量。我们需要一个受控环境，其中基础模型、训练后端（如 LoRA SFT）、服务接口和评估沙箱（如 E2B）都是固定且共享的。在这种设定下，Agent 的唯一自由度是“提出假设、设计数据策略、验证并迭代”。只有在这种隔离条件下，我们才能观察到 Agent 是否具备真正的“数据中心研究”能力，即能否从反馈中诊断能力差距（Capability Gap），并转化为有效的训练数据策略，而不是通过调整学习率或更换优化器来“作弊”。因此，构建一个固定基础设施、仅评估数据合成研究循环的基准（RSIBench-Data）成为填补这一空白的必然选择。\n\n### § 4 核心 Intuition\n\n现有基准混淆了“工程优化”与“数据研究”，导致无法评估 Agent 是否真正理解如何通过数据改进模型。RSIBench-Data 的核心直觉是：通过冻结训练、服务和评估基础设施，将 Agent 的角色严格限定为“数据策略研究者”，从而隔离并量化其从失败反馈中诊断问题、设计验证数据并迭代策略的能力。这种方法揭示了当前 Agent 虽然能发现有效数据策略（Discovery），但缺乏将反馈持续转化为稳定改进的可靠性（Reliability），即存在“发现-可靠性差距”。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nRSIBench-Data 的核心方法是将 LLM Agent 定义为 **Data-Centric Researcher Agent**，在固定的训练和评估基础设施（Fixed Post-Training Stack）下，通过闭环迭代优化训练数据策略。其完整 Pipeline 如下：\n\n1.  **初始化与输入 (Initialization \u0026 Inputs)**：\n    *   **输入**：Agent 接收目标基准测试（Benchmark）的描述、成功标准、公共种子仓库（Public Seed Repositories，如 GitHub issues）、工具/环境 Schema、基础模型（Base Model）的诊断信息以及资源预算（Budget）。\n    *   **约束**：Agent 不能修改训练后端、评估沙箱或评分规则，只能提交训练数据 $D_t$ 和配置 $c_t$。\n\n2.  **假设形成与数据合成 (Hypothesis \u0026 Data Synthesis)**：\n    *   Agent 分析当前模型失败的原因，形成关于能力缺口（Capability Gap）的假设。\n    *   基于假设，Agent 设计数据合成策略，包括选择数据源、构建任务环境、生成轨迹（Trajectories）、定义过滤规则和验证方法。\n    *   **示例**：在 SWE-bench Pro 任务中，Agent 假设模型缺乏“提交前自我验证”的能力，因此合成包含“生成补丁 -\u003E 运行测试 -\u003E 验证结果 -\u003E 提交”完整轨迹的数据，而非仅包含正确补丁的数据。\n\n3.  **共享训练 (Shared SFT Training)**：\n    *   Agent 提交数据 $D_t$ 和配置 $c_t$ 给共享的 **Tinker-backed LoRA SFT Backend**。\n    *   系统使用固定的基础模型（如 Qwen3.5-35B-A3B-Base）进行微调，生成检查点（Checkpoint）$M_t$。此过程对 Agent 透明，确保所有 Agent 使用相同的优化器和学习栈。\n\n4.  **受控评估与反馈 (Controlled Evaluation \u0026 Feedback)**：\n    *   检查点 $M_t$ 通过固定的服务路径被查询，并在 **Harbor-orchestrated E2B Sandboxes** 中运行官方评估。\n    *   评估器返回 **Selection Feedback** $h_t$，包括分数、轨迹、验证器结果、执行错误等。注意：Agent 在此阶段只能看到这些反馈，不能看到最终的官方测试集结果（Official Outcomes），以防止数据泄露。\n\n5.  **策略修订与迭代 (Strategy Revision \u0026 Iteration)**：\n    *   Agent 根据反馈 $h_t$ 和历史记录 $H_{\u003Ct}$ 修订数据合成策略。\n    *   如果预算允许，Agent 进入下一轮循环，生成新的数据 $D_{t+1}$；否则停止搜索。\n    *   **关键决策**：Agent 需决定是探索新假设、利用现有策略、还是回滚到之前的强检查点。\n\n6.  **最终选择与官方评估 (Final Selection \u0026 Official Evaluation)**：\n    *   搜索结束后，Agent 从所有生成的检查点中选择一个作为最终提交（Selected Checkpoint $M_{t[\\star]}$）。\n    *   系统在独立的测试集上对该检查点进行 **Official Evaluation**，得出最终分数。该分数仅用于排名，不参与 Agent 的迭代过程。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过**。\n本文主要是一个实证性基准测试（Empirical Benchmark）研究，旨在评估 LLM Agent 的数据中心研究能力，而非提出新的数学理论或算法推导。文中涉及的公式仅为形式化定义问题（如策略 $\\pi$ 观察证据 $S$ 和历史 $H_{\u003Ct}$ 提出数据 $D_t$），没有复杂的数学推导过程。\n\n---\n\n### § 7 实验设计与结论\n\n**提出了什么问题**：\n现有的自动化后训练基准（Automated Post-Training Benchmarks）将研究决策与优化、服务、评估和系统实现纠缠在一起，难以隔离 LLM Agent 作为“数据中心研究者”的核心能力。核心问题是：**LLM Agent 能否在固定的后训练栈下，可靠地自动化数据中心的研究循环（即从模型失败证据中诊断问题、设计数据策略、并根据反馈迭代改进）？**\n\n**设计了什么实验验证这个问题**：\n1.  **构建 RSIBench-Data 基准**：设计了一个受控环境，固定基础模型、训练接口（Tinker SFT）、评估沙箱（Harbor/E2B）和资源预算。\n2.  **多 Agent 对比**：评估四个前沿 Agent（Claude Code Opus-4.8, Sonnet-5; Codex gpt-5.6-sol, gpt-5.6-terra）在六个不同领域的基准（SWE-bench 系列, Terminal-Bench 2.0, GPQA Diamond, AIME 2026）上的表现。\n3.  **轨迹分析**：不仅看最终分数，还分析迭代过程中的“发现-可靠性差距”（Discovery-Reliability Gap），包括首次有效尝试与最佳尝试的对比、峰值后的回归情况、以及资源效率。\n4.  **机制分析**：通过案例研究（如 SWE-bench Verified 的推理努力对比）和轨迹编码，识别导致成功或失败的具体数据合成决策模式。\n\n**问题的答案是什么**：\n1.  **部分能力已显现，但不稳定**：Agent 在 58.33% 的设置中能通过反馈改进首次有效尝试，证明其具备初步的数据中心研究能力（如准确假设、验证驱动的监督）。\n2.  **存在显著的“发现-可靠性差距”**：Agent 无法一致地将反馈转化为持续改进。在达到历史最佳分数后继续搜索的实验中，78.26% 以更低分数的最终尝试结束，其余仅恢复峰值。这表明 Agent 容易在后期修订中破坏已发现的强策略。\n3.  **任务依赖性强**：没有单一 Agent 在所有任务中占优，不同 Agent 在不同类型的任务（如 SWE vs. 数学推理）中表现各异，且迭代价值高度依赖于具体基准。\n4.  **关键成功因素**：成功的轨迹通常具备准确的假设、基于验证的监督、与行为对齐的数据以及保留强检查点的策略。当前的 Agent 能做出有用的研究发现，但尚不能可靠地将反馈转化为持续的模型提升。", "additional_insights": "### § 8 Take-aways\n\nRSIBench-Data 通过固定训练、服务和评估基础设施（Fixed Infrastructure），成功将 LLM Agent 的“数据合成研究能力”与底层优化栈解耦，从而能够独立评估 Agent 作为 Data-centric Researcher 的假设形成与策略迭代能力。实验揭示了显著的“发现-可靠性差距”（Discovery–Reliability Gap）：虽然 Agent 在 58.33% 的设置中能通过反馈改进初始有效尝试，但在达到历史最佳分数后继续搜索的 78.26% 案例中，最终尝试的分数反而下降，表明 Agent 难以将反馈持续转化为更优的训练数据策略。轨迹分析指出，成功的迭代依赖于四个关键机制：准确的能力差距诊断（Diagnose the real capability gap）、基于验证信号的监督（Validation-grounded supervision）、与目标行为对齐的数据（Behavior-aligned data）以及对强 Checkpoint 的保留（Preservation of strong checkpoints）。当前 Agent 在递归自我改进（Recursive Self-Improvement）中表现出的主要瓶颈并非缺乏发现新策略的能力，而是缺乏在搜索过程中有效停止（Stopping）和防止性能退化（Regression）的纪律性，导致后期反馈驱动的修订往往破坏早期发现的最优解。\n\n### § 9 最脆弱的假设\n\n该研究最核心且脆弱的假设是：**在固定的 LoRA SFT 后端和受限的超参数白名单（Whitelisted Training Config）下，训练数据策略（Training-data Strategy）的差异足以解释模型性能的主要变化，且 Agent 无法通过绕过数据质量来利用基础设施漏洞。** 如果这一假设不成立，即如果性能提升主要源于对训练超参数（如 Learning Rate, Batch Size）的细微调整而非数据本身，或者 Agent 能够通过构造恶意数据触发训练后端的不稳定性从而获得虚假高分，那么 RSIBench-Data 作为“数据-centric”基准的有效性将直接失效。论文通过强制使用共享的 Tinker SFT 后端和固定的评估沙箱（Harbor \u0026 E2B）来隔离变量，并报告了不同 Agent 在相同基础设施下的性能差异，以此作为间接证据。然而，论文缺乏对“数据质量 vs. 超参数敏感性”的消融实验（Ablation Study），未证明在固定数据分布下微调超参数无法产生同等幅度的性能提升，也未完全排除 Agent 通过构造极端数据分布来“黑客式”利用固定训练栈的可能性。若未来训练栈允许更灵活的超参数搜索，当前基于数据策略的排名可能不再具有区分度。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现论文中关于“反馈驱动改进的非单调性”（Non-monotonicity of Feedback-driven Improvement）这一核心发现，无需构建完整的 RSIBench-Data 基础设施。\n\n*   **数据与设置**：选择一个轻量级基准，如 GSM8K 或 MATH 的子集，以及一个小型开源 LLM（如 Llama-3-8B）。使用现有的自动化微调框架（如 Axolotl 或 TRL）作为固定的“训练后端”，模拟 RSIBench 的固定基础设施。\n*   **实现**：部署一个强大的 LLM Agent（如 Claude Sonnet 或 GPT-4o）作为 Researcher Agent。赋予其权限：1) 生成合成训练数据；2) 提交数据进行微调；3) 在验证集上评估微调后的模型；4) 根据评估结果修改下一轮的数据生成策略。限制 Agent 只能修改数据，不能修改训练超参数。\n*   **测量**：运行 5-10 轮迭代。记录每一轮微调后模型在验证集上的分数（Selection Score）。\n*   **验证标准**：\n    *   **支持 Claim**：如果观察到 Agent 在达到某个峰值分数后，后续几轮基于反馈生成的“改进”数据导致模型分数下降或停滞，且最终提交的模型并非最后一轮模型，而是历史最佳模型，则支持论文关于“Agent 难以持续从反馈中获益”的结论。\n    *   **反驳 Claim**：如果 Agent 能够单调地、持续地通过数据迭代提升验证集分数，且最后一轮模型始终优于或等于历史最佳，则表明在当前简单设置下，Agent 具备稳定的数据-centric 研究能力，论文的“可靠性差距”结论可能仅适用于更复杂的 SWE/终端任务。", "research_value": "### § 11 最强反例设计\n\n若要挑战 RSIBench-Data 的核心结论，最有力的攻击并非质疑 Agent 的智力，而是攻击其**归因有效性（Attribution Validity）**与**生态效度（Ecological Validity）**。\n\n首先，设计一个**“超参数代理效应”（Hyperparameter Proxy Effect）**的反例实验。RSIBench-Data 声称隔离了数据策略，但 Agent 提交的配置 $c_t$ 中可能包含对 LoRA 秩（Rank）、Alpha 或学习率调度器的细微调整。如果 Agent 发现某种特定的数据分布（例如高噪声数据）在特定的非标准超参数组合下能偶然触发优化器的局部最优解，那么性能提升应归因于“数据-超参数协同优化”而非纯粹的“数据-centric 研究”。反例设计如下：固定所有 Agent 的超参数为全局最优默认值（Global Optimal Defaults），仅允许修改数据 $D_t$。如果在此约束下，Agent 的性能提升幅度显著下降（例如从 58.33% 降至 \u003C20%），则证明原基准中 Agent 的“研究能力”很大程度上依赖于对训练栈黑盒特性的“黑客式”利用，而非对模型能力缺口的真正理解。这直接证伪了“固定基础设施足以隔离数据研究能力”的假设。\n\n其次，构建一个**“评估泄漏与过拟合”（Evaluation Leakage \u0026 Overfitting）**的场景。RSIBench-Data 使用 Harbor-orchestrated E2B Sandboxes 进行反馈，但 Agent 可能通过逆向工程评估脚本（Evaluation Scripts）或沙箱环境，生成专门针对验证器逻辑的“投机性数据”（Speculative Data），而非真正提升模型通用能力。例如，在 SWE-bench 任务中，Agent 可能合成包含特定错误代码模式的数据，这些模式恰好能触发验证器的“部分正确”逻辑，从而获得高分，但在真实部署中毫无价值。反例设计：引入一个**“分布外泛化测试”（Out-of-Distribution Generalization Test）**，使用与训练反馈完全无关的新基准（如从未见过的代码库或数学问题集）对 Agent 选出的最佳 Checkpoint 进行评估。如果 Agent 在 RSIBench-Data 内部反馈中表现优异，但在 OOD 测试中性能崩塌，则证明其“数据合成研究”本质上是针对评估器的过拟合，而非递归自我改进所需的通用能力提升。\n\n最后，提出**“非单调性源于探索-利用困境”（Non-monotonicity as Exploration-Exploitation Dilemma）**的理论反驳。论文将“发现-可靠性差距”归咎于 Agent 缺乏纪律性，但这可能是一个错误的归因。在强化学习或贝叶斯优化中，为了找到全局最优，算法必须在后期进行高风险探索，这必然导致性能波动。如果 Agent 被强制要求“保留强 Checkpoint”或“停止搜索”，它可能陷入局部最优。反例设计：对比 RSIBench-Data 中的 Agent 与一个标准的**贝叶斯优化器（Bayesian Optimizer）**或**进化策略（Evolutionary Strategy）**，后者在相同预算下仅优化数据采样权重。如果传统优化算法在“最终提交分数”上优于 LLM Agent，则说明 LLM Agent 的“研究能力”并未超越简单的黑盒优化，其复杂的假设形成过程反而引入了不必要的噪声和回归风险。这将挑战 LLM 作为“研究者”而非“优化器”的独特价值。\n\n### § 12 Follow-up Research Idea\n\n基于 RSIBench-Data 揭示的“发现-可靠性差距”以及 Agent 难以将反馈转化为持续改进的局限，我提出一个新的研究方向：**从“数据合成”转向“数据策展与验证的协同进化”（Co-evolution of Data Curation and Verification）**，即 **RSIBench-Verify**。\n\n**(a) 驱动局限与未满足需求**\nRSIBench-Data 的核心瓶颈在于 Agent 生成的合成数据（Synthetic Data）缺乏内在的质量保证机制。Agent 往往基于错误的假设生成数据，或者生成的数据虽然能提升验证集分数，但缺乏鲁棒性。现有的方法假设 Agent 能“自我验证”数据质量，但实验表明这并不可靠。真正的递归自我改进不仅需要生成数据，更需要**动态构建验证器（Dynamic Verifier Construction）**。当前基准将评估器固定，忽略了在真实研究中，研究者往往会同时改进任务定义、评估标准和训练数据。未满足的需求是：如何让 Agent 不仅优化数据，还能优化“什么是好数据”的判断标准，从而形成更稳健的改进循环。\n\n**(b) 借鉴相邻领域的方法**\n借鉴**程序合成中的测试用例生成（Test Case Generation in Program Synthesis）**和**对抗性训练（Adversarial Training）**的思想。在程序合成中，系统不仅生成代码，还生成测试用例来验证代码的正确性，并通过失败测试用例指导代码修正。类似地，我们可以引入一个**“验证器 Agent”（Verifier Agent）**，它与“研究者 Agent”（Researcher Agent）进行博弈。研究者 Agent 生成训练数据，验证器 Agent 生成针对该数据的“压力测试”或“反例”（Counter-examples）。只有当数据能通过验证器 Agent 的严格审查时，才被用于训练。这种**对抗性数据策展（Adversarial Data Curation）**机制可以强制研究者 Agent 生成更鲁棒、更通用的数据，而非针对特定评估器的投机性数据。\n\n**(c) 第一个实验设计**\n构建 **RSIBench-Verify** 基准，其核心变化是引入**双 Agent 博弈框架（Dual-Agent Game Framework）**：\n1.  **角色设定**：除了原有的 Data-Centric Researcher Agent，增加一个 Verifier Agent。两者共享相同的固定训练栈。\n2.  **交互流程**：\n    *   Researcher Agent 提交数据 $D_t$ 和假设 $H_t$。\n    *   Verifier Agent 接收 $D_t$ 和 $H_t$，生成一组**对抗性测试样本**（Adversarial Test Samples）或**验证规则**（Validation Rules），旨在暴露 $D_t$ 中的缺陷或 $H_t$ 中的逻辑漏洞。\n    *   系统使用 $D_t$ 训练模型，并在 Verifier Agent 生成的对抗性测试集上进行评估。\n    *   反馈 $h_t$ 不仅包含分数，还包含 Verifier Agent 的“攻击轨迹”和“失败分析”。\n3.  **评估指标**：除了最终的官方评估分数，新增**“验证鲁棒性分数”（Verification Robustness Score）**，衡量模型在 Verifier Agent 不断升级的对抗性测试下的性能稳定性。\n4.  **预期发现**：我们假设，引入 Verifier Agent 后，Researcher Agent 的“发现-可靠性差距”将显著缩小，因为对抗性反馈迫使 Agent 生成更本质、更通用的数据，而非表面优化的数据。这将证明，递归自我改进的关键不在于单一 Agent 的智力，而在于**研究过程的结构化制衡（Structured Checks and Balances in Research Process）**。\n\n这一提议与 RSIBench-Data 的根本区别在于：RSIBench-Data 假设评估标准是静态且正确的，而 RSIBench-Verify 将评估标准本身视为可进化、可对抗的变量，更贴近真实科研中“问题定义-方法-评估”共同演进的复杂动态。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Fanqing Meng\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"*\",\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Lingxiao Du\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"*\",\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Qiguang Chen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\",\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Ziqi Zhao\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Haocheng Lu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Mengkang Hu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Michael Qizhe Shieh\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Evolvent AI\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"National University of Singapore\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"∗\",\n      \"text\": \"Equal contribution.\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding authors.\"\n    }\n  ]\n}\n```", "summary_translation": "递归自我改进需要将模型失败的证据转化为更优的模型。以数据为中心的后训练研究涉及诊断能力差距、设计并验证训练数据策略，以及从检查点反馈中学习。LLM 智能体能否自动化这一循环？现有的基准测试将研究决策与优化、服务、评估和系统实现纠缠在一起，掩盖了智能体的研究能力。我们引入了 RSIBench-Data，这是一个在固定后训练堆栈下评估 LLM 智能体作为以数据为中心的研究者的受控基准测试。智能体针对固定的目标模型迭代修订训练数据策略；训练和服务使用 Tinker 支持的服务，官方评估通过 Harbor 和 E2B 沙箱运行，且所有智能体的预算固定。我们在软件工程、终端使用、科学问答和数学领域的六个基准测试上评估了四个前沿智能体。智能体展示了核心的以数据为中心的研究能力：在 58.33% 的设置中，它们通过从反馈中细化策略，改进了首次有效尝试的结果。然而，改进并不一致。在观察到最佳分数后继续进行的搜索中，78.26% 以得分较低的最终尝试结束，而其余的仅恢复到相同的峰值。因此，即使后续修订失败，强有力的候选方案也可能在运行早期或中期出现。轨迹分析确定了较强运行中的四种模式：准确的假设、基于验证的监督、与行为对齐的数据，以及强检查点的保留。这些发现表明，当前的智能体可以进行有用的以数据为中心的发现，但尚不能将反馈转化为一致的改进。RSIBench-Data 为递归自我改进所需的研究能力提供了一个可测量、可审计的测试平台。我们在 https://github.com/evolvent-ai/RSIBench-Data 开源了我们的代码。"}, {"title": "DecoEvo: Score-Decoupled Co-Evolution of Solver and Rubric-Generator Skills in Text Space", "arxiv_id": "2607.25675", "authors": "Jiangwang Chen, Zixin Song, Junlin Liu, Shuaiyu Zhou, Haiyan Wu, Haihan Shi, Chenxi Zhou, Hanqing Li, Xiao Yang, Da Zhu, Guanjun Jiang, Hai Wan, Xibin Zhao", "summary": "Text-space optimization adapts large language models (LLMs) by editing external natural-language artifacts rather than model weights, so the optimized artifacts remain inspectable and the model can be treated as a black box. However, most existing text-space methods keep evaluation fixed. On open-ended tasks, this can become a bottleneck: once the solver improves on the criteria a rubric measures, omitted dimensions remain invisible to the optimization signal. Simply evolving the rubric is also unreliable when updates are selected by the current solver's score, because apparent progress can come from making the rubric easier to satisfy. We introduce DecoEvo (Decoupled Co-Evolution), which co-evolves a solver skill and a rubric-generator skill under decoupled objectives without using gold rubrics during optimization. The solver skill is updated using criterion-level feedback, while the rubric-generator skill is revised through complementary audits of requirement coverage and response discrimination that are independent of aggregate solver score. This separation focuses generator updates on newly exposed solver weaknesses, reducing repeated emphasis on criteria the solver already satisfies. Under each benchmark's official evaluation, DecoEvo outperforms all compared methods across five benchmarks and three LLM backbones, yielding 2.8--5.0\\% relative gains over SkillOpt in the five-benchmark average.", "category": "cs.AI", "cluster": "Self-Improvement \u0026 Optimization", "tags": ["cs.AI"], "filter_reason": "该论文完全符合“自我演化 (Self-Evolving)”和“LLMs Improving LLMs”的研究方向。\n\n1. 核心机制匹配：论文提出的 DecoEvo 框架核心在于“协同演化 (Co-Evolution)”，即同时演化求解器技能（Solver Skill）和评分标准生成器技能（Rubric-Generator Skill）。这直接对应了筛选标准中关于“自我演化”、“迭代改进”以及“LLM智能体通过反馈进行自我完善”的定义。\n2. 智能体能力相关：虽然论文主要关注文本空间优化，但其本质是构建一种能够自动改进自身输出质量（Solver）和评估能力（Rubric-Generator）的机制。这种“生成-评估-改进”的闭环是 Agentic AI 中自我反思（Self-Reflection）和自我修正（Self-Correction）的高级形式，属于智能体能力演化的前沿研究。\n3. 非排除项：论文不涉及被排除的安全、对齐、多模态视觉、图神经网络或纯基础设施优化。它也不是简单的应用层论文，而是提出了一种新的优化/演化方法论。\n4. 符合保留规则：根据筛选标准，“如果论文的核心机制是 self-evolving / self-improving ... 即使对象是 ... 模型训练，也应优先保留”。DecoEvo 正是通过解耦目标来实现更稳健的自我演化，符合这一高优先级保留条件。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在 **Text-Space Optimization**（文本空间优化）框架下，如何有效地协同进化（Co-Evolution）求解器技能（Solver Skill）与评分标准生成器技能（Rubric-Generator Skill），同时避免两者因依赖同一聚合分数信号而产生的 **Score-Coupled Co-Adaptation**（分数耦合共适应）陷阱。具体而言，当优化目标（即由生成器产生的 Rubric）本身也在动态变化时，传统的基于当前求解器得分来更新生成器的策略，会导致生成器倾向于产生更容易被当前求解器满足的“宽松”标准，而非真正反映任务质量的严格标准，从而导致代理指标（Proxy Score）上升但实际任务性能（External Quality）停滞甚至下降。\n\n这一问题的重要性在于，现有的 **Text-Space Optimization** 方法（如 OPRO, DSPy, TextGrad, SkillOpt）通常假设评估标准是固定不变的。然而，在医疗咨询、创意写作和研究辅助等 **Open-Ended Tasks**（开放式任务）中，质量是多维度的，初始的固定 Rubric 往往存在覆盖不全（Omitted Dimensions）的问题。一旦求解器在 Rubric 覆盖的维度上达到瓶颈，未被覆盖的维度就会成为性能提升的盲区，且由于优化信号无法感知这些盲区，求解器会过度特化于已知标准，导致 **Rubric Drift**（标准漂移）或判别力丧失。解决这一问题能够打破固定评估标准的瓶颈，使优化过程能够自适应地发现并覆盖新的质量维度，从而在保持模型黑盒特性（Black-Box Adaptation）和结果可解释性（Inspectability）的同时，显著提升大语言模型在复杂开放式任务上的最终表现。\n\n### § 2 前人工作与不足\n\n该问题在 **Weight-Space Training**（权重空间训练）领域已有部分探索，例如 **EvoRubrics** (Ding et al., 2026), **EvoLM** (Li et al., 2026), **Arco** (Tian et al., 2026) 和 **DR Tulu** (Shao et al., 2026) 等工作尝试在强化学习过程中动态调整 Rubric。然而，这些方法主要依赖于模型权重的更新，且往往通过 **On-Policy** 或 **Adversarial Training** 进行联合优化，其机制难以直接迁移到冻结模型参数的 **Text-Space** 设置中。在 **Text-Space Optimization** 领域，最相关的工作是 **SkillOpt** (Yang et al., 2026)，它通过优化可复用的自然语言技能文档来提升求解器性能，但其核心局限在于保持 Rubric 生成器固定。这种固定策略在初始 Rubric 不完备时，会导致优化信号无法引导求解器去改进未被评估的维度，从而形成性能天花板。\n\n此外，虽然有一些工作如 **OpenRS** (Jia et al., 2026) 和 **Online Rubrics Elicitation** (Rezaei et al., 2026) 探讨了自适应 Rubric 的生成，但它们要么侧重于权重空间的策略优化，要么缺乏对 **Score-Coupling** 问题的系统性解耦设计。在文本空间中，若简单地将求解器的聚合得分作为生成器更新的奖励信号（即 **Score-Coupled Co-Evolution**），会引发经典的 **Reward Overoptimization**（奖励过优化）问题：生成器为了最大化当前求解器的得分，会主动降低评分标准或忽略难以满足但重要的质量维度，导致求解器和生成器共同适应一个虚假的高分代理，而非真实的任务质量。前人工作未能充分解决这一 **Identification Problem**（识别问题），即无法从聚合得分中区分出是求解器真正变强了，还是 Rubric 变简单了。因此，缺乏一种能够在不依赖 **Gold Rubrics**（黄金标准）监督的情况下，独立于求解器得分、通过结构性审计（Structural Audit）和对比性审计（Contrastive Audit）来驱动生成器进化的机制，这正是现有方法在开放式任务文本空间优化中的关键不足。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Text-Space Optimization 的语境下，研究者首先观察到固定评估标准（Fixed Rubric）的局限性：在医疗咨询或创意写作等开放域任务中，初始 Rubric 往往无法覆盖所有质量维度。当 Solver 针对现有 Rubric 优化后，其性能瓶颈会转移到 Rubric 未涵盖的维度（如安全性或细微的逻辑差异），导致优化信号失效。\n\n为了解决这一问题，直觉上应当让 Rubric 也随 Solver 共同进化（Co-Evolution）。然而，在 Black-Box 设置下，若直接利用 Solver 在生成 Rubric 下的得分（Aggregate Score）来更新 Rubric Generator，会陷入经典的“奖励黑客”（Reward Hacking）或“评分耦合”（Score-Coupled Co-Adaptation）陷阱：Generator 倾向于生成更容易被当前 Solver 满足的宽松标准，而非真正反映任务质量的严格标准。这导致内部代理分数上升，但外部真实性能（Gold Rubric Score）下降或停滞。\n\n现有的 Weight-Space 方法（如 RLHF 中的 Reward Model 训练）可以通过梯度更新或对抗训练来缓解此问题，但在 Text-Space 中，Solver 和 Generator 均为不可微的自然语言文本，且模型权重冻结。因此，必须寻找一种不依赖 Aggregate Score 作为 Generator 更新信号的机制。研究者意识到，Solver 的失败模式包含两类信息：一是 Rubric 遗漏了关键要求（Coverage Gap），二是 Rubric 无法区分质量相近但优劣不同的回答（Discrimination Gap）。\n\n基于此，作者提出将 Generator 的更新目标与 Solver 的得分解耦（Decoupled）。通过引入两个独立的审计角色（Auditors）：一是基于任务描述的结构性审计（Structural Audit），用于发现 Rubric 对任务要求的遗漏；二是基于近分回答对比的盲审审计（Near-Tie Contrastive Audit），用于发现 Rubric 在区分细微质量差异上的不足。这两个审计过程不依赖 Solver 的最终得分，而是直接诊断 Rubric 本身的缺陷。由此，Generator 的更新仅基于其诊断出的“盲区”修复，从而避免了为了迎合 Solver 而降低标准，实现了 Solver 与 Rubric 在 Text Space 中的良性协同进化。\n\n### § 4 核心 Intuition\n\n传统方法中，Solver 和 Rubric 共同进化时，若以 Solver 得分为唯一优化信号，Rubric 会倾向于“放水”以迎合 Solver，导致内部分数虚高而实际能力停滞（Score-Coupled Co-Adaptation）。DecoEvo 的核心直觉是将 Rubric 的更新目标从“提高 Solver 得分”转变为“修复 Rubric 自身的评估缺陷”，即通过独立于 Solver 得分的结构性覆盖审计和近分对比审计，精准定位 Rubric 遗漏的要求和无法区分的细微差异。这种解耦机制确保了 Rubric 的进化始终指向更全面的任务质量覆盖，而非对当前 Solver 的妥协，从而在 Black-Box 设置下实现了 Solver 与评估标准的良性协同提升。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**DecoEvo** 的核心思想是在 **Text-Space Optimization**（文本空间优化）框架下，通过解耦（Decoupled）的目标函数，共同进化（Co-Evolution）两个可编辑的自然语言技能：**Solver Skill**（解题技能）和 **Rubric-Generator Skill**（评分标准生成技能）。其核心在于防止“分数耦合”（Score-Coupled），即防止评分标准为了迎合当前的解题器而变得更容易满足，从而导致虚假的性能提升。\n\n以下是结合一个具体例子（假设任务为“医疗咨询：针对高血压患者的饮食建议”）的完整 Pipeline 说明：\n\n#### 1. 初始化与角色设定\n*   **输入**：一个冻结的 **Backbone LLM**（如 GPT-4o 或 Qwen3），以及初始的 **Solver Skill** $s_0$（例如：“回答要简洁、准确”）和 **Rubric-Generator Skill** $g_0$（例如：“生成包含事实准确性、清晰度、安全性三个维度的评分标准”）。\n*   **数据划分**：训练集 $D_{tr}$（用于更新 Solver）、探针集 $P$（用于审计 Generator）、验证集 $V_s, V_g$（用于接受候选更新）、测试集（最终评估，不参与优化）。\n\n#### 2. 内环：Solver Skill 进化（基于 Criterion-Level Feedback）\n*   **步骤**：\n    1.  **生成响应**：Solver 使用当前技能 $s_t$ 回答训练集 $D_{tr}$ 中的问题 $q$。\n        *   *例子*：Solver 回答：“建议患者多吃低钠食物，如蔬菜和水果，避免腌制食品。”\n    2.  **生成评分标准**：Generator 使用当前技能 $g_t$ 为该问题生成具体的评分标准 $R_q(g_t)$。\n        *   *例子*：生成的标准包括：“1. 提及低钠饮食（权重 0.5）；2. 提及具体食物例子（权重 0.3）；3. 提及避免高钠食物（权重 0.2）。”\n    3.  **细粒度评分**：固定的 **Criterion-Level Judge** 根据 $R_q$ 对响应进行逐项打分，并指出失败原因。\n        *   *例子*：Judge 指出：“未提及‘咨询医生’这一安全警告，尽管标准中未明确列出，但这是隐含的安全要求。”（注意：此时标准可能遗漏了安全维度）。\n    4.  **技能重写与接受**：**Solver-Skill Rewriter** 汇总失败原因，生成新的 Solver 技能候选 $s'$。如果在验证集 $V_s$ 上，新技能在相同标准下的得分显著高于旧技能，则接受 $s'$。\n        *   *结果*：Solver 技能更新为：“回答要简洁、准确，并始终包含安全警告。”\n\n#### 3. 外环：Rubric-Generator Skill 进化（基于 Dual-View Auditing）\n当 Solver 连续多次更新失败或达到固定步数时，触发 Generator 的更新。此过程**不使用** Solver 的总分作为奖励，而是通过两个独立的审计（Audit）来发现 Generator 的缺陷。\n\n*   **审计一：Task-Conditioned Structural Audit（任务条件结构审计）**\n    *   **目的**：检查生成的评分标准是否遗漏了任务描述中隐含的关键要求。\n    *   **过程**：审计器不看 Solver 的回答，只看任务描述（如“医疗咨询需确保安全性”）和生成的标准 $R_q$。\n    *   *例子*：审计器发现任务描述强调“安全性”，但生成的标准 $R_q$ 中完全没有关于“禁忌症”或“咨询医生”的条目。\n    *   **输出**：诊断记录 $\\Gamma_{str}$，建议：“在生成医疗类评分标准时，必须包含‘安全性/禁忌症’维度。”\n\n*   **审计二：Near-Tie Contrastive Audit（近分对比审计）**\n    *   **目的**：检查生成的评分标准是否无法区分质量相近但实际优劣不同的回答。\n    *   **过程**：\n        1.  **采样**：Solver 对探针集 $P$ 中的问题生成多个随机响应（Rollouts）。\n        2.  **找近分对**：找出在当前标准 $R_q$ 下得分非常接近（Near-Tie）的两个响应 $r_i, r_j$。\n        3.  **盲审（Rubric-Blind）**：审计器在不看评分标准的情况下，仅根据问题和两个响应，判断哪个更好（$y_{ij}$）。\n        4.  **对比分析**：审计器再看评分标准，解释为什么标准没能区分出优劣，并提出缺失的原则。\n    *   *例子*：响应 A 说“吃低钠食物”，响应 B 说“吃低钠食物并咨询医生”。当前标准给两者打同样的高分。盲审认为 B 更好（更安全）。审计器指出标准缺乏对“安全建议”的区分度。\n    *   **输出**：诊断记录 $\\Gamma_{ctr}$，建议：“评分标准应包含能区分‘一般建议’与‘包含安全警告的建议’的细粒度准则。”\n\n*   **蒸馏与验证（Distillation \u0026 Pareto Verification）**\n    1.  **技能重写**：**Generator-Skill Rewriter** 接收上述审计记录，将其提炼为通用的生成原则，更新 Generator 技能 $g'$。\n        *   *例子*：$g'$ 更新为：“生成医疗评分标准时，必须包含‘安全性’维度，且该维度需能区分是否包含专业医疗建议。”\n    2.  **Pareto 接受**：在独立的验证集 $V_g$ 上，检查新技能 $g'$ 是否在至少一个审计目标（结构覆盖率或对比区分度）上提升，且在其他目标上不显著下降。如果是，则接受 $g'$。\n\n#### 4. 部署\n*   **输出**：仅保留优化后的 **Solver Skill** $s_{final}$。Generator 技能在训练后丢弃。\n*   **最终评估**：使用官方 **Gold Rubrics**（黄金评分标准）对 Solver 在测试集上的表现进行最终打分。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的传统数学推导（如梯度下降证明），其核心贡献在于**优化目标的定义与解耦机制**。以下是关键公式的 Intuition 解释：\n\n1.  **问题定义与代理目标（Proxy Objective）**：\n    *   公式：$J_D(s, g) = \\frac{1}{|D|} \\sum_{q \\in D} S(q, r_q(s), R_q(g))$\n    *   **Intuition**：这是训练时的“代理分数”。$S$ 是根据生成的评分标准 $R_q(g)$ 计算出的响应 $r_q(s)$ 的得分。\n    *   **核心问题**：如果直接用 $J_D$ 来同时优化 $s$（Solver）和 $g$（Generator），会出现 **Score-Coupling**（分数耦合）。因为 $J_D$ 升高可能是因为 Solver 变强了，也可能是因为 Generator 生成了更容易拿高分的“放水”标准。这会导致模型过拟合于代理分数，而在真实的 **Gold Rubric** 评估中表现下降。\n\n2.  **解耦的 Generator 更新定义（Definition 1）**：\n    *   定义：Generator 的更新提案和接受，可以使用问题、生成的标准、响应级分数和审计记录，但**绝不能**使用 $J_D(s_t, g_t)$ 或其变化量作为优化目标。\n    *   **Intuition**：这切断了 Generator 为了“讨好”当前 Solver 而降低标准的动机。Generator 的进化动力来自“审计器”发现的盲点，而不是 Solver 的得分。\n\n3.  **对比审计的分辨率指标（Resolution Rate）**：\n    *   公式：$\\Phi_{ctr}(g) = \\frac{1}{|\\Gamma|} \\sum_{p \\in \\Gamma} \\mathbb{I}(|S(q, r_+, R_q(g)) - S(q, r_-, R_q(g))| \\ge \\gamma)$\n    *   **Intuition**：$\\Gamma$ 是审计器找出的“近分但实际有优劣之分”的样本对。$r_+$ 是更好的回答，$r_-$ 是较差的回答。$\\gamma$ 是分数差距阈值。\n    *   这个公式衡量的是：新的 Generator 生成的标准，能否在那些原本难以区分的案例中，拉开足够大的分数差距（$\\ge \\gamma$）。如果 $\\Phi_{ctr}$ 提高，说明 Generator 学会了更细致的区分能力，而不是简单地给所有回答打高分。\n\n4.  **Pareto 接受准则**：\n    *   条件：$\\exists k \\in K_t, \\Delta_k \\ge \\delta \\quad \\text{and} \\quad \\forall k \\in K_t, \\Delta_k \\ge -\\eta$\n    *   **Intuition**：$K_t$ 是当前的审计目标集合（如结构覆盖率、对比分辨率）。$\\Delta_k$ 是新技能相对于旧技能在目标 $k$ 上的提升。\n    *   规则要求：至少有一个审计目标有显著提升（$\\ge \\delta$），且没有任何一个审计目标显著下降（$\\ge -\\eta$）。这避免了为了提升某一方面而牺牲另一方面的权衡，确保 Generator 能力的全面进步。\n\n---\n\n### § 7 实验设计与结论\n\n**提出了什么问题？**\n在 Text-Space Optimization 中，如果同时优化 Solver 和 Rubric Generator，直接使用 Solver 的得分作为 Generator 的奖励会导致 **Score-Coupled Co-Adaptation**（分数耦合共适应），即 Generator 会生成更容易满足的标准，导致代理分数虚高但实际任务质量（Gold Rubric 评分）下降或停滞。现有的固定 Rubric 方法又无法覆盖开放域任务的多维需求。\n\n**设计了什么实验验证这个问题？**\n1.  **主实验（Main Results）**：在 5 个基准测试（HealthBench, WritingBench, ResearchQA 等）和 3 个 Backbone（GPT-4o, Qwen3-4B/8B）上，对比 **DecoEvo** 与 **SkillOpt**（固定 Rubric）、**SC-CoEvo**（Score-Coupled Co-Evolution，即耦合基线）和 **Zero-shot**。\n2.  **消融实验（Ablation Study）**：移除 DecoEvo 的关键组件（如 Structural Audit, Contrastive Audit, Rubric Blindness, Verification 等），验证每个模块对最终性能的贡献。\n3.  **替代解释控制（Alternative-Explanation Controls）**：\n    *   **Task-Prior**：仅给 Generator 提供任务描述先验，不进行在线审计，验证增益是否仅来自更多信息。\n    *   **Budget-Matched**：给 SkillOpt 更多的计算预算，验证增益是否仅来自更多计算。\n    *   **Direct Audit**：将审计记录直接发给 Solver 而不是更新 Generator，验证“进化 Generator 技能”与“直接反馈”的区别。\n4.  **训练动态分析（Training Dynamics）**：绘制训练过程中 **Generated-Rubric Proxy Score**（内部代理分数）与 **Official Gold-Rubric Score**（外部真实分数）的变化曲线，直观展示 SC-CoEvo 的“分数虚高”现象。\n5.  **Rubric Alignment 分析**：计算生成的评分标准与 Gold Rubrics 在准则层面的重叠度（Precision, Recall, F1），验证 DecoEvo 是否真的生成了更高质量的标准。\n\n**问题的答案是什么？**\n1.  **DecoEvo 显著优于基线**：在所有 15 种 Backbone-Benchmark 组合中，DecoEvo 均取得最高分，相比 SkillOpt 平均提升 2.8%-5.0%。\n2.  **Score-Coupling 确实有害**：SC-CoEvo 在 13/15 的情况下表现不如 SkillOpt，甚至在 7/15 的情况下不如 Zero-shot。训练动态图显示，SC-CoEvo 的内部代理分数持续上升，但外部真实分数却下降，证实了“Rubric Drift”（标准漂移）导致的评价失效。\n3.  **解耦审计是关键**：消融实验表明，移除 Structural 或 Contrastive Audit 都会导致性能下降，其中 Contrastive Audit 对区分细微质量差异尤为重要。\n4.  **增益来自机制而非资源**：控制实验表明，额外的计算预算（Budget-Matched）或简单的任务先验（Task-Prior）无法解释 DecoEvo 的增益。Direct Audit 虽然有效，但不如进化 Generator 技能持久和全面，证明了将审计信号蒸馏为可复用的 Generator 技能是有效的策略。\n5.  **生成的标准更高质量**：Rubric Alignment 分析显示，DecoEvo 生成的标准与 Gold Rubrics 的 F1 分数显著高于 SkillOpt 和 SC-CoEvo，说明其确实学到了更全面、更细致的评估维度，而非简单地放宽标准。", "additional_insights": "### § 8 Take-aways\n\nDecoEvo 提出了一种在 Text-Space Optimization 中联合进化 Solver Skill 和 Rubric-Generator Skill 的框架，其核心创新在于通过 Score-Decoupled 机制解决了传统 Co-Evolution 中因代理目标（Proxy）与真实目标（Gold Standard）不一致导致的 Reward Hacking 或 Rubric Drift 问题。该方法将 Generator 的更新目标从“提升当前 Solver 的得分”解耦为两个独立的审计信号：Task-Conditioned Structural Audit 用于检测 Rubric 对任务要求的覆盖缺失，Near-Tie Contrastive Audit 用于检测 Rubric 在区分高质量但得分相近的回答时的判别力不足。实验表明，这种解耦机制有效避免了 Generator 为了迎合当前 Solver 而生成过于宽松或偏差的 Rubric，从而在五个基准测试和三个 LLM Backbone 上均取得了优于固定 Rubric 基线（SkillOpt）和耦合进化基线（SC-CoEvo）的性能。消融实验证实，Structural Audit 和 Contrastive Audit 缺一不可，且 Rubric Blindness 和 Near-Tie Sampling 对于防止审计器自身产生偏差至关重要。最终，DecoEvo 不仅在源任务上提升了性能，还在跨基准迁移任务中展现了更好的泛化能力，证明了进化出的 Rubric-Generator Skill 能够捕捉到更具通用性的评估原则，而非仅仅过拟合于特定训练数据。\n\n### § 9 最脆弱的假设\n\n该方法最脆弱的假设是：**基于同一 Frozen Backbone 的 Role-Separated Prompts 能够产生足够独立且可靠的审计信号（Audit Signals），即 Structural Auditor 和 Contrastive Auditor 的判断能力不依赖于 Solver 的当前状态，且其自身的偏见不会系统性误导 Generator 的进化方向。**\n\n如果这一假设不成立，核心贡献将直接失效，原因如下：DecoEvo 的核心逻辑是 Generator 的更新不依赖于 Solver 的得分，而是依赖于 Auditor 的诊断。然而，所有角色（Solver, Generator, Judge, Auditors）都使用同一个 Frozen Backbone。如果 Backbone 本身存在特定的认知偏差或能力瓶颈，那么 Auditor 生成的“缺失要求”或“判别差异”可能仅仅是反映了 Backbone 自身的局限性，而非任务真实的 Gold Standard 要求。例如，如果 Backbone 难以理解复杂的医学禁忌症，Structural Auditor 可能无法识别出 Rubric 中遗漏的关键安全条款，或者 Contrastive Auditor 可能无法正确区分两个在安全细节上存在细微差别但整体风格相似的回答。在这种情况下，Generator 会根据这些有缺陷的审计信号进行更新，导致进化出的 Rubric 依然无法覆盖关键维度，甚至可能固化 Backbone 的偏见。\n\n论文提供的证据有限：虽然论文展示了 DecoEvo 在 Gold Rubric 评估下的性能提升，并进行了 Rubric Alignment 分析（Table 5），显示 DecoEvo 生成的 Rubric 与 Gold Rubric 的 F1 分数更高，但这仅证明了生成的 Rubric 与静态 Gold Rubric 在表面特征上更一致，并未直接证明 Auditor 的判断独立于 Backbone 的内在偏差。论文缺乏对不同 Backbone 组合（例如使用更强或不同架构的模型作为 Auditor）的对比实验，也未深入分析 Auditor 错误诊断的具体案例，因此无法完全排除 Auditor 偏差导致进化方向错误的风险。\n\n### § 10 最小复现实验\n\n**实验目标：** 验证 Score-Decoupled 机制是否真的避免了 Rubric Drift，即验证 Generator 的更新是否独立于 Solver 的当前得分，且这种独立性是否带来了更稳定的性能提升。\n\n**数据与设置：**\n1.  **数据：** 选择一个小型的开放域任务数据集，如 HealthBench 的一个子集（例如 50-100 个问题），并保留其官方 Gold Rubric 作为最终评估标准。\n2.  **模型：** 使用一个中等规模的开源 LLM（如 Qwen2.5-7B-Instruct）作为 Frozen Backbone，以降低成本并便于复现。\n3.  **实现：**\n    *   实现 DecoEvo 的核心循环，但简化审计过程：\n        *   **Solver Skill:** 一个简单的文本提示，随迭代更新。\n        *   **Rubric Generator:** 一个生成评估标准的提示。\n        *   **Structural Audit:** 使用 LLM 检查生成的 Rubric 是否覆盖了任务描述中的关键维度（可手动定义几个关键维度作为 Ground Truth 用于模拟 Audit 信号，或使用 LLM 自身进行自我反思）。\n        *   **Contrastive Audit:** 采样 Solver 生成的两个得分相近的回答，让 LLM 盲评哪个更好，并指出 Rubric 未能区分的原因。\n    *   **基线：** 实现 SC-CoEvo，即 Generator 的更新直接基于 Solver 在生成 Rubric 下的得分提升。\n    *   **控制变量：** 保持 Solver 的更新机制相同，仅改变 Generator 的接受准则（DecoEvo 使用 Audit 信号，SC-CoEvo 使用 Solver 得分）。\n\n**测量指标：**\n1.  **Rubric Stability/Drift:** 在进化过程中，定期计算生成的 Rubric 与初始 Gold Rubric 的语义相似度或覆盖度变化。如果 SC-CoEvo 的 Rubric 逐渐偏离 Gold Rubric（例如变得过于宽松或关注无关细节），而 DecoEvo 保持稳定或向 Gold Rubric 靠拢，则支持假设。\n2.  **Solver Performance on Gold Rubric:** 记录每个迭代步骤后，Solver 在 Gold Rubric 下的得分。\n3.  **Proxy vs. Gold Correlation:** 计算 Solver 在生成 Rubric 下的得分（Proxy Score）与 Gold Rubric 得分之间的相关性。如果 SC-CoEvo 的相关性随时间下降（表明 Proxy 失效），而 DecoEvo 保持较高相关性，则支持假设。\n\n**结果判定：**\n*   **支持 Claim：** 如果 DecoEvo 的最终 Gold Rubric 得分显著高于 SC-CoEvo，且 SC-CoEvo 的 Proxy Score 与 Gold Score 的相关性显著下降，而 DecoEvo 的相关性保持稳定，则证明 Score-Decoupled 机制有效避免了 Rubric Drift。\n*   **反驳 Claim：** 如果 SC-CoEvo 和 DecoEvo 的最终性能无显著差异，或者 DecoEvo 的 Rubric 也出现了明显的 Drift（即与 Gold Rubric 的覆盖度下降），则表明 Audit 信号可能不足以指导正确的进化，或者 Score-Decoupling 并非性能提升的关键因素。", "research_value": "### § 11 最强反例设计\n\n要挑战 **DecoEvo** 的有效性，最有力的攻击并非质疑其工程实现的复杂性，而是针对其核心假设——即 **Auditor**（审计器）能够独立于 **Frozen Backbone** 的内在偏差提供客观的“上帝视角”——进行证伪。具体的反例设计应聚焦于 **“Auditor Bias Amplification”（审计器偏差放大）** 现象，即证明在缺乏外部 **Gold Standard** 监督的情况下，**Structural Audit** 和 **Contrastive Audit** 实际上是在固化并放大 Backbone 自身的认知盲区，而非发现新的质量维度。\n\n**实验设计：对抗性偏差注入实验（Adversarial Bias Injection Experiment）**\n构建一个合成基准测试 **BiasBench**，其中包含两类问题：\n1.  **Common-Sense Bias Questions**：答案依赖于 Backbone 预训练数据中存在的普遍刻板印象或错误常识（例如，某些过时的医疗建议或文化偏见），而 **Gold Rubric** 明确禁止这些内容。\n2.  **Nuanced Expertise Questions**：答案需要超越 Backbone 常见知识分布的细微专业判断，且 **Gold Rubric** 强调这些细微差别。\n\n**攻击逻辑与预期结果：**\n在 **DecoEvo** 框架下，由于 **Auditor** 与 **Solver** 共享同一个 **Frozen Backbone**，当 **Solver** 生成符合 Backbone 内在偏见的回答时，**Auditor** 很可能无法识别其为错误，反而认为这是“高质量”的。\n*   **Structural Audit 失效**：如果任务描述隐含了“避免偏见”，但 Backbone 本身缺乏对特定偏见的敏感度，**Structural Auditor** 可能不会在生成的 **Rubric** 中强制加入反偏见条款，因为它“认为”当前标准已足够。\n*   **Contrastive Audit 误导**：在 **Near-Tie Contrastive Audit** 中，如果两个回答 $r_i$ 和 $r_j$ 都符合 Backbone 的偏见，但 $r_i$ 更流畅，**Auditor** 可能会判定 $r_i$ 更好，并指导 **Generator** 强化“流畅性”而非“准确性/无偏见性”。\n\n**替代解释：**\n如果实验结果显示，**DecoEvo** 在 **BiasBench** 上的 **Gold Rubric** 得分显著低于 **SkillOpt**（固定 Rubric，假设初始 Rubric 包含反偏见条款），或者其生成的 **Rubric** 与 **Gold Rubric** 在关键维度（如安全性、无偏见性）上的 **F1 Score** 随迭代下降，这将证明 **Score-Decoupled** 机制并未解决 **Identification Problem**，反而因为切断了与真实得分的联系，使得 **Generator** 完全依赖于有偏见的 **Auditor** 信号，导致 **Rubric Drift** 向错误方向加速。这将揭示 **DecoEvo** 的核心缺陷：它假设 **Auditor** 是客观的，但在 **Black-Box** 设置下，**Auditor** 只是另一个有偏见的 **LLM** 实例。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：Cross-Model Consensus Auditing for Robust Text-Space Optimization（基于跨模型共识审计的鲁棒文本空间优化）**\n\n**(a) 驱动局限与未满足需求：**\n**DecoEvo** 的核心脆弱性在于其 **Auditor** 与 **Solver/Generator** 共享同一个 **Frozen Backbone**，导致审计信号可能反映的是模型自身的系统性偏差（Systematic Bias）而非任务的真实质量分布。现有的 **Text-Space Optimization** 方法大多假设单一模型能够同时胜任生成、评估和审计角色，这在 **Open-Ended Tasks** 中极易导致 **Reward Hacking** 或 **Evaluation Collapse**。未满足的需求是：如何在保持 **Black-Box** 特性（不更新权重）的前提下，获得比单一模型更客观、更鲁棒的评估信号，以指导 **Solver** 和 **Rubric-Generator** 的进化。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴 **Ensemble Learning**（集成学习）和 **Multi-Agent Debate**（多智能体辩论）领域的思想，特别是 **Consensus Mechanisms**（共识机制）和 **Disagreement Analysis**（分歧分析）。在强化学习中，**Ensemble Critics** 被用于减少价值估计的方差和偏差。我们可以将这一思想迁移到 **Text-Space**，利用多个异构的 **LLM Backbones**（例如，一个擅长逻辑推理的模型、一个擅长事实核查的模型、一个擅长创意写作的模型）作为独立的 **Auditors**。\n\n**(c) 第一个实验设计：**\n提出 **Consensus-DecoEvo** 框架：\n1.  **异构审计器集合**：不再使用单一 **Frozen Backbone** 作为 **Auditor**，而是部署 $K$ 个不同的 **LLM Backbones**（如 Qwen, Llama, Mistral）作为 **Structural Auditors** 和 **Contrastive Auditors**。\n2.  **共识驱动更新**：**Generator** 的更新不再基于单一审计器的诊断，而是基于多个审计器的 **Consensus Signal**（共识信号）。只有当多个异构审计器都指出某个 **Rubric** 维度缺失或区分度不足时，才触发 **Generator** 的更新。\n3.  **分歧作为不确定性度量**：如果审计器之间出现严重分歧（Disagreement），则将该样本标记为“高不确定性”，并引入更严格的 **Pareto Verification** 或暂时跳过更新，以避免被某个特定模型的偏见误导。\n\n**与已有工作的区别：**\n*   与 **DecoEvo** 相比：引入了 **Cross-Model** 视角，打破了单一模型偏差的闭环。\n*   与 **Multi-Agent Debate** 相比：不直接让模型辩论生成答案，而是让模型辩论“评估标准”的质量，目标更聚焦于 **Rubric-Generator** 的进化。\n*   与 **Ensemble Methods** 相比：不是在推理阶段集成输出，而是在优化阶段集成“审计信号”，用于指导 **Text-Space** 的技能进化。\n\n**预期结果：**\n在 **BiasBench** 和复杂 **Open-Ended Tasks** 上，**Consensus-DecoEvo** 应能生成与 **Gold Rubrics** 对齐度更高、偏差更低的 **Rubrics**，从而在保持 **Black-Box** 特性的同时，显著提升 **Solver** 的最终性能，并有效缓解 **DecoEvo** 中潜在的 **Auditor Bias** 问题。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jiangwang Chen\", \"affiliations\": [1, 4], \"markers\": [\"*\", \"†\"]},\n    {\"name\": \"Zixin Song\", \"affiliations\": [1, 4], \"markers\": [\"*\", \"†\"]},\n    {\"name\": \"Junlin Liu\", \"affiliations\": [2, 4], \"markers\": [\"*\", \"†\"]},\n    {\"name\": \"Shuaiyu Zhou\", \"affiliations\": [3, 4], \"markers\": [\"*\", \"†\"]},\n    {\"name\": \"Haiyan Wu\", \"affiliations\": [4], \"markers\": [\"*\", \"†\"]},\n    {\"name\": \"Haihan Shi\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Chenxi Zhou\", \"affiliations\": [2, 4], \"markers\": []},\n    {\"name\": \"Hanqing Li\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Xiao Yang\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Da Zhu\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Guanjun Jiang\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Hai Wan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xibin Zhao\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Tsinghua University\"},\n    {\"id\": 2, \"name\": \"University of Chinese Academy of Sciences\"},\n    {\"id\": 3, \"name\": \"Peking University\"},\n    {\"id\": 4, \"name\": \"Qwen Business Unit of Alibaba\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "Text-space optimization 通过编辑外部自然语言工件而非模型权重来适配大型语言模型（LLMs），因此优化后的工件保持可检查性，且模型可被视为黑盒。然而，大多数现有的 text-space 方法保持评估固定。在开放式任务中，这可能成为瓶颈：一旦求解器在评分标准所衡量的标准上得到改进，被忽略的维度对优化信号而言仍然不可见。当更新由当前求解器的得分选择时，简单地演化评分标准也是不可靠的，因为表面的进步可能来自使评分标准更容易满足。我们引入了 DecoEvo（Decoupled Co-Evolution），它在解耦的目标下共同演化求解器技能和评分标准生成器技能，在优化过程中不使用黄金评分标准。求解器技能使用准则级反馈进行更新，而评分标准生成器技能通过独立于聚合求解器得分的要求覆盖率和响应区分度的互补审计进行修订。这种分离使生成器更新专注于新暴露的求解器弱点，减少了对求解器已满足的标准的重复强调。在每个 benchmark 的官方评估下，DecoEvo 在五个 benchmark 和三个 LLM 骨干网络上优于所有比较方法，在五个 benchmark 的平均值上相比 SkillOpt 获得 2.8--5.0% 的相对增益。"}]}, {"name": "Tool Use \u0026 Retrieval", "count": 2, "papers": [{"title": "Agent Retrieval Bench: Evaluating Repository Context Retrieval for Coding Agents", "arxiv_id": "2607.24882", "authors": "Bowen Qin, Yi Xie", "summary": "Modern coding agents are usually evaluated by whether they eventually produce a correct patch, but patch generation depends on an earlier context-acquisition stage: finding the repository files needed for the task. We introduce Agent Retrieval Bench, a file-level benchmark for this upstream retrieval problem. Samples are built from real coding-workflow signals and evaluated against frozen base-commit repositories, with relevance defined by what an agent needs next rather than direct query-file semantic similarity. The benchmark covers four positive-retrieval tasks: code2test, comment2context, trace2code, and edit2ripple; a fifth subset evaluates selective retrieval using natural evidence-backed no-gold cases and counterfactual wrong-repository controls. Agent Retrieval Bench contains 427 samples across 25 repositories: 345 positive examples, 50 natural no-gold examples, and 32 counterfactual controls. The corpus includes 308 base-commit snapshots, 392,000 files, and 7.9 million chunks. We evaluate lexical retrieval, RepoMap, open-source embeddings, selective abstention, and logged agent context selection. No single retrieval family dominates: Qwen3-Embedding-4B has the best sample-weighted MRR on positive samples, Qwen3-Embedding-8B the best Recall@20, and RepoMap the best budgeted context yield at 8K tokens, with task-level winners differing substantially. Selective thresholds calibrated with counterfactual controls do not improve selective success on natural no-gold cases, revealing a calibration gap. Logged trajectories also miss every gold file on 27-35 percent of samples. A controlled seed-intervention pilot finds that retrieval-derived initial context yields higher file F1 with less post-seed exploration than random non-gold context, while oracle gold context shows substantial remaining headroom.", "category": "cs.CL", "cluster": "Tool Use \u0026 Retrieval", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是**编码智能体（Coding Agents）在生成补丁（Patch Generation）之前的上游“上下文获取”（Context Acquisition）阶段中的仓库级文件检索能力**。具体而言，研究聚焦于如何评估智能体能否从冻结的基准提交（Base Commit）仓库中，准确识别并检索出对当前工作流步骤（如编写测试、理解代码审查评论、定位故障根因或分析变更涟漪效应）至关重要的文件。这一问题的重要性在于，现有的编码智能体评测（如 SWE-bench）通常采用端到端（End-to-End）的指标，即仅关注最终生成的补丁是否通过测试或解决 Issue。这种黑盒式的评测掩盖了智能体在“寻找上下文”这一前置环节中的失败模式。如果智能体无法找到正确的文件，后续的推理和编辑必然失败，但端到端指标无法区分这是检索失败、推理错误还是编辑错误。\n\n解决这一问题的价值体现在三个方面：首先，它确立了**代理相关性（Agentic Relevance）**的概念，即相关性并非查询与文件之间的直接语义相似度，而是“智能体下一步工作流所需的最有用上下文”，这揭示了传统语义搜索在编码任务中的局限性。其次，通过隔离检索层，该基准能够诊断智能体的具体瓶颈，例如在 `trace2code` 任务中，结构感知方法（如 RepoMap）优于纯语义嵌入模型，表明不同工作流信号需要不同的归纳偏置。最后，该研究提供了细粒度的成本分析，通过记录智能体的交互轨迹（Trajectories）和种子干预实验（Seed Intervention），量化了高质量初始上下文对减少工具调用次数、降低 Token 消耗以及提高最终文件 F1 分数的实际贡献，为优化智能体的检索策略和混合检索系统（Hybrid Retrieval）提供了实证依据。\n\n### § 2 前人工作与不足\n\n尽管代码搜索和智能体评测领域已有大量研究，但针对“工作流驱动的仓库上下文检索”这一特定上游问题的评估仍存在显著缺口。\n\n在**代码搜索与智能**方面，CodeSearchNet 和 CodeXGLUE 等基准主要评估自然语言与代码片段或函数之间的语义匹配。这些工作的不足在于其检索单元通常是函数或代码片段，且相关性定义为直接的语义相似性。然而，在编码智能体的实际工作流中，查询（如 PR 描述或错误堆栈）与目标文件（如相关的测试文件或跨模块的上下文文件）之间往往缺乏直接的文本相似性，而是存在间接的、结构性的或工作流依赖的关系。因此，传统语义搜索基准无法评估智能体在复杂仓库结构中定位非语义相似但功能相关文件的能力。\n\n在**仓库级代码上下文**方面，RepoBench 关注已知位置的代码自动补全，强调跨文件上下文的使用。其不足在于它假设智能体已经知道需要查看哪些文件，重点在于“使用上下文”而非“寻找上下文”。Agent Retrieval Bench 则反向关注在编辑开始之前，智能体应检查哪些仓库文件，从而将问题从上下文利用转移到了上下文发现。\n\n在**端到端编码智能体评测与定位**方面，SWE-bench 和 SWE-agent 评估完整的 Issue 解决工作流，Agentless 和 LocAgent 将定位作为修复前的显式阶段。然而，这些方法的不足在于它们要么将检索作为端到端流程的一部分，无法隔离检索质量对最终结果的具体影响；要么依赖于特定的定位策略（如图引导的多跳定位），缺乏对工作流信号（如 PR、审查评论、错误追踪）的细粒度区分。特别是，SWE-bench 等基准的补丁成功可能因检索、推理、编辑或验证中的任何一环失败而失败，导致无法诊断智能体是否在生成补丁前找到了必要文件。此外，现有工作往往缺乏对“致命捷径泄漏”（Fatal Shortcut Leakage，如查询中包含确切路径或补丁）的严格控制，以及针对“无金标准”（No-Gold）场景（即问题不在本地仓库中）的选择性检索评估。\n\n在**代理检索与探索基准**方面，CORE-Bench 和 SWE-Explore 开始将上下文发现与补丁生成分离。CORE-Bench 侧重于大规模检索和广泛的上下文覆盖，SWE-Explore 侧重于固定行预算下的自适应行级探索。它们的不足在于：CORE-Bench 主要关注 Issue 和用户请求风格的输入，缺乏对 PR、审查评论、错误追踪等具体工作流信号的针对性评估；SWE-Explore 侧重于行级探索效率和下游修复关联，但未提供基于工作流语义的文件级检索基准，且缺乏对检索泄漏的严格控制和选择性检索（Selective Retrieval）的评估。Agent Retrieval Bench 通过引入基于工作流信号的文件级检索、严格的基准提交卫生控制（Base-commit Hygiene）、以及包含自然无金标准和反事实错误仓库控制的选择性检索子集，填补了这些空白，提供了更精细的上下文获取层评估语义和卫生标准。", "core_insight": "### § 3 重建作者的思考路径\n\n现有的 Coding Agent 评估体系（如 SWE-bench）主要关注端到端的 Patch 生成成功率，这种“黑盒”评估掩盖了 Agent 工作流中一个关键的中间层：Context Acquisition（上下文获取）。在 Agent 能够进行代码推理或编辑之前，它必须首先从庞大的代码库中定位并读取相关文件。然而，传统的代码搜索基准（如 CodeSearchNet）基于语义相似度定义相关性，这与 Agent 的实际需求存在错位。在真实的开发工作流中，Agent 需要的“下一个有用上下文”往往不是与查询文本最相似的文件，而是具有结构性或因果关联的文件。例如，在 `trace2code` 任务中，错误堆栈指向测试文件，但根因可能在实现文件中；在 `comment2context` 中，评论针对某个文件，但约束条件可能在另一个模块。这种“Agentic Relevance”（代理相关性）是间接的、结构性的，且依赖于工作流信号（如 PR、Review Comment、Trace），而非单纯的文本语义。\n\n此外，现有的端到端评估无法区分失败是源于检索错误、推理错误还是编辑错误。如果 Agent 找不到正确的文件，后续的推理必然失败，但端到端指标无法量化这一上游瓶颈。同时，交互式 Agent 虽然可以通过多次工具调用弥补初始上下文的不足，但这带来了巨大的 Token 消耗和延迟成本。因此，需要隔离出“检索”这一上游问题，建立一个专门评估 Agent 在编辑前能否高效找到必要文件的基准。这个基准必须基于真实的工作流信号，冻结在修复前的 Base Commit 以防止数据泄露，并定义新的相关性标准（即 Agent 下一步需要读取的文件，而非语义最相似的文件）。通过构建这样的基准，可以诊断不同检索方法（语义嵌入、结构图谱、词法匹配）在不同工作流信号下的互补性，并量化检索质量对 Agent 探索成本的影响。\n\n### § 4 核心 Intuition\n\nCoding Agent 的检索任务并非寻找与查询文本语义最相似的文件，而是寻找工作流中“下一步所需”的上下文，这种相关性往往是结构性的或因果性的，而非直接的语义匹配。现有的端到端评估掩盖了检索层的失败，且传统语义搜索无法捕捉代码库中的间接依赖关系（如从错误堆栈定位到根因实现文件）。因此，必须将检索从生成中解耦，基于真实工作流信号定义“代理相关性”，并证明语义嵌入与结构感知方法（如 RepoMap）在不同任务场景下具有显著的互补性，而非单一方法能通吃所有场景。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nAgent Retrieval Bench (ARB) 并非提出一个新的检索模型，而是构建了一个用于评估编码智能体（Coding Agents）在代码生成前进行**上下文获取（Context Acquisition）**能力的基准测试框架。其核心方法在于重新定义“相关性（Relevance）”：不再基于查询与文件的语义相似度，而是基于“智能体为了执行下一步工作流所需读取的文件”。\n\n以下是 ARB 的完整构建与评估 Pipeline，以 **trace2code** 任务中的一个真实样本（来自 `gin-gonic/gin` 仓库）为例进行说明：\n\n**1. 数据构建与清洗 (Construction \u0026 Sanitization)**\n*   **输入信号 (Query Signal)**：从真实的 GitHub 工作流中提取信号。在 `trace2code` 任务中，输入是复现失败的命令和错误日志片段。\n    *   *例子*：在 `gin-gonic/gin` 仓库中，查询包含命令 `go test ./...` 和错误日志 `./debug_test.go:118:2: undefined: runtimeVersion`。\n*   **基线冻结 (Base Commit Freezing)**：确定修复该问题之前的提交（Base Commit），确保检索语料库不包含修复后的代码，防止未来信息泄露。\n*   **去泄露处理 (Leakage Removal)**：严格移除查询中可能直接暴露答案的信息，如最终补丁（Patch）、修复提交哈希（Fix Commit Hash）、确切的黄金文件路径（Exact Gold Paths）或自动生成的审查工件。\n    *   *例子*：虽然错误日志提到了 `debug_test.go`，但 ARB 将其视为辅助上下文（Auxiliary Context），而非主要目标。真正的目标（Gold）是根本原因所在的实现文件 `debug.go`。查询中不会直接出现 `debug.go` 的路径。\n\n**2. 语料库构建 (Corpus Construction)**\n*   **文件级索引**：将 Base Commit 状态下的整个仓库文件作为候选集。\n*   **分块与编码 (Chunking \u0026 Encoding)**：对于基于 Embedding 的方法，文件被切分为 Chunks 进行编码；对于 RepoMap 或 Lexical 方法，则利用文件路径、符号（Symbols）和引用关系构建结构索引。\n\n**3. 检索与排序 (Retrieval \u0026 Ranking)**\n*   **检索器执行**：不同的基线模型（如 Qwen3-Embedding, RepoMap, BM25）接收清洗后的查询，对候选文件进行打分和排序。\n*   *例子*：\n    *   **Semantic Embedding (如 Qwen3-4B)**：可能因为查询中大量出现 `debug_test.go` 和测试相关的术语，而将测试文件排在前面，导致 `debug.go` 排名靠后（因为语义上测试文件与错误日志更相似）。\n    *   **Structural Retrieval (如 RepoMap)**：利用仓库结构，识别出 `debug_test.go` 对应的实现文件是 `debug.go`，从而将 `debug.go` 排在前列。\n\n**4. 评估指标计算 (Evaluation)**\n*   **文件级指标**：计算 Recall@k, MRR 等。\n*   **预算上下文收益 (Budgeted Context Yield, BCY)**：模拟智能体的 Token 预算限制。\n    *   *例子*：假设预算为 8k tokens。系统按排名顺序将文件内容打包，直到填满预算。如果 `debug.go` 在预算内被包含，则计为成功。BCY 衡量的是在有限预算下，有多少比例的“黄金上下文”被实际获取。\n*   **选择性检索 (Selective Retrieval)**：对于 No-Gold 样本（如问题出在外部依赖），评估模型是否能选择“放弃（Abstain）”而不是返回无关文件。\n\n**5. 轨迹与干预分析 (Trajectory \u0026 Intervention)**\n*   **日志轨迹分析**：分析真实智能体（如 Codex CLI）在解决这些问题时的工具调用次数和首次命中黄金文件的步数。\n*   **种子干预 (Seed Intervention)**：在受控环境中，给智能体提供不同的初始上下文种子（无种子、随机种子、检索生成的种子、Oracle 种子），观察其对最终 File F1 和工具调用成本的影响。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有提出新的深度学习模型或复杂的数学理论推导，其核心贡献在于**评估协议（Evaluation Protocol）**和**指标定义**的形式化。因此，本节重点解释其核心指标 **BCY (Budgeted Context Yield)** 的直觉和定义，因为这是理解 ARB 与传统检索基准区别的关键。\n\n**背景直觉：**\n传统的检索指标（如 Recall@20）只关心黄金文件是否出现在前 20 名，忽略了智能体实际能读取多少内容。智能体有 Token 预算限制，如果黄金文件排在第 19 位，但前 18 个文件太长，导致预算耗尽，智能体实际上读不到第 19 个文件。BCY 旨在衡量在固定 Token 预算下，实际获取的黄金上下文比例。\n\n**BCY 定义与直觉：**\n\n1.  **符号定义**：\n    *   $G_i$：样本 $i$ 的黄金文件集合。\n    *   $L_{ig}$：黄金文件 $g$ 在语料库中的文本长度。\n    *   $m_{ig}(B)$：在预算 $B$ 下，文件 $g$ 被打包的非头部内容 Token 数量。\n    *   $\\tau$：最小内容阈值（Canonical BCY 中 $\\tau=1$，意味着只要文件被暴露哪怕 1 个 Token 就算部分成功，避免短文件被完全忽略）。\n\n2.  **公式直觉**：\n    $$ \\text{BCY}_i(B) = \\frac{\\sum_{g \\in G_i} \\min(L_{ig}, m_{ig}(B))}{\\sum_{g \\in G_i} L_{ig}} $$\n    *   **分子**：计算在预算 $B$ 内，所有黄金文件实际被读取的有效 Token 总数。$\\min$ 函数确保如果文件被完整读取，只计其总长度；如果被截断，只计读取部分。\n    *   **分母**：所有黄金文件的总长度。\n    *   **结果**：一个 0 到 1 之间的值，表示在给定预算下，黄金上下文的“覆盖率”。\n\n3.  **为什么重要？**\n    *   它引入了**上下文预算（Context Budget）**的概念，更贴近智能体实际运行时的约束。\n    *   它揭示了不同检索策略在“深度”和“广度”上的权衡。例如，RepoMap 可能在 BCY@8k 上表现更好，因为它能更紧凑地定位关键文件，而 Embedding 模型可能召回更多相关文件但导致预算分散。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有的编码智能体评估主要关注端到端的补丁生成成功率（Patch Success），这掩盖了上游**上下文获取（Context Acquisition）**阶段的失败。传统代码搜索基于语义相似度，但智能体需要的上下文往往是结构性的、工作流依赖的（如从错误日志找根源代码，而非语义相似的测试文件）。因此，缺乏一个专门评估智能体在编辑前“找到正确文件”能力的基准，且现有基准存在严重的捷径泄露（Shortcut Leakage）问题。\n\n**2. 设计了什么实验验证这个问题？**\n*   **构建 Agent Retrieval Bench (ARB)**：\n    *   **任务设计**：设计了四个正向检索任务（`code2test`, `comment2context`, `trace2code`, `edit2ripple`）和一个选择性检索子集（No-Gold），覆盖不同的工作流信号。\n    *   **严格卫生控制**：冻结 Base Commit，移除所有直接泄露答案的信息（路径、补丁、Commit Hash），确保评估的是真正的检索能力。\n    *   **多维度评估**：不仅使用传统的 Recall/MRR，还引入 BCY（预算上下文收益）和选择性检索指标。\n*   **基线对比**：对比了 Lexical (BM25), Structural (RepoMap), 和 Semantic Embedding (Qwen3, Jina, Nomic 等) 三类检索方法。\n*   **轨迹与干预实验**：\n    *   分析真实智能体（OpenAI, Codex）的日志轨迹，计算其获取上下文的成本（工具调用次数、首次命中步数）。\n    *   进行受控的种子干预实验，比较不同初始上下文（无、随机、检索生成、Oracle）对智能体最终表现的影响。\n\n**3. 问题的答案是什么？**\n*   **没有单一的检索家族占优**：不同的工作流信号需要不同的归纳偏置。\n    *   `code2test` 和 `comment2context` 中，Semantic Embedding (Qwen3) 表现较好。\n    *   `trace2code` 中，Structural Retrieval (RepoMap) 显著优于 Embedding，因为错误日志与根源代码语义不相似，但结构相关。\n    *   `edit2ripple` 中，不同预算下 Qwen3-4B 和 Qwen3-8B 的表现顺序发生反转，显示预算依赖性。\n*   **互补性**：简单的 Reciprocal Rank Fusion (RRF) 融合 Semantic 和 Structural 信号能提升整体性能，证明两者是互补的。\n*   **智能体仍面临巨大挑战**：即使在交互式探索中，智能体仍有 27-35% 的样本从未触及任何黄金文件。静态检索的失败会显著增加智能体的探索成本。\n*   **选择性检索的校准差距**：当前的检索分数不足以作为可靠的“放弃（Abstain）”信号，特别是在区分“本地无解”和“外部依赖”时，模型难以正确校准置信度。\n*   **结论**：编码智能体的检索层必须是**混合的（Hybrid）**和**任务感知的（Task-aware）**，结合语义、结构和路径信号，才能有效支持下游的代码生成。", "additional_insights": "### § 8 Take-aways\n\nAgent Retrieval Bench 将编码代理（Coding Agents）的评估焦点从最终的 Patch 生成质量上移到了上游的上下文获取（Context Acquisition）阶段，定义了“Agentic Relevance”即代理在下一步工作流中实际需要的文件，而非仅基于语义相似性的文件。基准测试包含四个正向检索任务（code2test, comment2context, trace2code, edit2ripple）和一个选择性检索子集，共 427 个样本，覆盖 25 个仓库，并严格通过冻结 Base Commit 和去除致命捷径（如精确路径、补丁哈希）来防止数据泄露。实验结果表明，没有单一的检索家族能主导所有任务：Qwen3-Embedding-4B 在样本加权 MRR 上表现最佳，Qwen3-Embedding-8B 在 Recall@20 上领先，而基于结构的 RepoMap 在 BCY@8k 和 trace2code 任务中表现最优，证明了语义嵌入与结构信号具有互补性。简单的倒数排名融合（RRF）策略结合 Qwen3-8B 和 RepoMap 能在多个任务上超越单一最佳模型，特别是在 trace2code 任务中显著提升了 Recall@20。轨迹分析显示，即使交互式代理（如 Codex CLI）在 27-35% 的样本中从未触及任何 Gold 文件，且静态检索器在代理最终找到 Gold 文件但耗时较长的“Late-hit”案例中能提供显著的潜在探索节省（PES）。种子干预实验证实，使用检索派生的初始上下文种子比随机非 Gold 上下文能更高效地提升最终 File F1 并减少后续工具调用，但 Oracle Gold 上下文仍显示出巨大的剩余提升空间，表明检索并非修复失败的唯一瓶颈。选择性检索实验揭示了一个校准差距：虽然模型能轻松识别错误的仓库（Counterfactual controls），但在面对自然无解案例（Natural no-gold）时，基于置信度阈值的拒绝机制未能提高选择性成功率，表明当前的检索分数不足以作为可靠的拒绝信号。\n\n### § 9 最脆弱的假设\n\n该论文最核心且脆弱的假设是：**基于工作流信号（如 PR 描述、评论、错误追踪）构建的“Gold”文件集合，能够准确且唯一地代表代理在修复过程中“必须”读取的上下文，且这些文件在 Base Commit 状态下即可被静态检索器有效定位。**\n\n如果这一假设不成立，即代理实际上可以通过读取非 Gold 文件（如通过推理链间接获取信息）或动态执行代码来解决问题，那么 Agent Retrieval Bench 的评估指标（如 Recall@k, BCY）将失去对实际代理性能的预测能力，导致“高检索分数但低修复成功率”或反之的脱节。\n\n**不成立的原因：**\n1.  **上下文的多路径性：** 软件修复往往不是线性的。代理可能通过阅读一个非 Gold 的配置文件或日志文件，推断出需要修改的 Gold 文件，或者通过运行测试发现错误，从而绕过静态检索。基准测试强制要求静态检索器直接命中 Gold 文件，忽略了代理通过工具使用（Tool Use）进行动态探索的能力。\n2.  **Gold 标注的主观性与不完整性：** Gold 文件是基于维护者的修复提交（Fix Commit）反向推导的。然而，修复提交可能包含冗余更改，或者维护者可能阅读了未在提交中体现的文档或外部资源。此外，论文承认 Gold 标签仅近似于“需要读取的文件”，可能存在未标注的有用文件。\n3.  **静态与动态的鸿沟：** 基准测试在 Base Commit 上冻结仓库，但代理在实际工作中可能面对的是包含部分修复或不同状态的代码库。静态检索器无法模拟代理在读取文件后根据内容动态调整查询策略的过程。\n\n**论文提供的证据与缺失：**\n论文通过“Seed Intervention”实验部分缓解了这一担忧，显示检索派生的种子能提升代理的 File F1，但这仅证明了检索有助于上下文获取，并未证明检索是修复成功的充分或必要条件。论文明确承认不报告 Patch 成功率，因为缺乏与 SWE-bench 等可执行修复基准的对齐。缺失的关键证据是：在控制其他变量（如模型、工具预算）的情况下，检索质量的提升是否线性转化为修复成功率的提升。如果没有这种因果链接，Agent Retrieval Bench 可能只是一个衡量“文件可达性”的基准，而非衡量“代理上下文获取效率”的有效代理指标。\n\n### § 10 最小复现实验\n\n**目标：** 验证“检索派生的初始上下文种子能比随机上下文更高效地提升代理的上下文获取效率（File F1）”这一 Claim，特别是验证 RRF 融合策略的有效性。\n\n**数据：** 使用论文发布的 Agent Retrieval Bench 数据集中的 `code2test` 子集，选取其中 20 个样本（确保覆盖不同的仓库和复杂度）。\n\n**实现：**\n1.  **检索器实现：** 实现两个简单的检索器：\n    *   **Embedding Retriever:** 使用开源的 `Qwen3-Embedding-4B` 模型，对查询（PR 标题/正文）和仓库文件（Base Commit 状态）进行编码，计算余弦相似度，取 Top-20 文件。\n    *   **RepoMap Retriever:** 实现一个简化的 RepoMap，基于文件路径、符号引用和仓库结构图（如导入关系）进行排序，取 Top-20 文件。\n    *   **RRF Fusion:** 对两者的 Top-20 列表应用倒数排名融合（RRF, k=60），生成融合后的 Top-20 列表。\n    *   **Random Baseline:** 从仓库中随机选取 20 个非 Gold 文件。\n2.  **代理模拟：** 由于无法直接调用 Codex CLI 进行完整干预，我们使用一个轻量级的“上下文选择”模拟：\n    *   对于每个样本，将检索器返回的 Top-3 文件作为“初始上下文种子”。\n    *   使用一个固定的 LLM（如 Llama-3-8B-Instruct 或 GPT-4o-mini）作为“代理”，输入查询和初始上下文种子，要求其输出它认为接下来需要读取的 3 个文件路径（模拟代理的下一步行动）。\n    *   测量代理输出的文件路径与 Gold 文件的重叠程度（File F1）。\n\n**测量：**\n*   **File F1:** 代理最终选择的文件集合与 Gold 文件集合的 F1 分数。\n*   **Any-Gold:** 代理是否至少选择了一个 Gold 文件。\n*   **Token Efficiency:** 初始上下文种子的总 Token 数（假设每个文件平均 1000 Tokens）。\n\n**结果解释：**\n*   **支持 Claim：** 如果 RRF 融合种子的 File F1 显著高于 Random Baseline 和单一 Embedding/RepoMap 种子，且 Token 效率相当或更高，则支持论文关于“互补性”和“种子有效性”的结论。\n*   **反驳 Claim：** 如果 RRF 融合并未带来显著提升，或者 Random Baseline 的表现与检索种子相当，则表明在该小规模样本上，检索质量对代理的上下文选择影响有限，或者简单的随机上下文已足够提供噪声信号，质疑了复杂检索策略的必要性。\n\n**优势：** 该实验无需复现完整的交互式代理环境，仅需实现检索器和一个简单的 LLM 调用，可在 1 周内完成，且直接验证了论文中“Seed Intervention”的核心发现。", "research_value": "### § 11 最强反例设计\n\n要挑战 Agent Retrieval Bench (ARB) 的核心有效性，最有力的攻击并非针对其数据清洗的严谨性，而是针对其**“静态文件级检索足以代理动态上下文获取”**这一根本假设。我可以设计一个名为 **“Dynamic Execution Gap” (动态执行鸿沟)** 的反例场景，证明 ARB 的高分检索结果在实际智能体工作流中是无效甚至有害的。\n\n**具体反例场景：隐式依赖与运行时状态**\n考虑一个典型的 `trace2code` 任务，其中错误日志显示 `NullPointerException` 发生在 `ServiceA.process()` 中。ARB 的 Gold 文件标注为 `ServiceA.java`，因为修复补丁修改了该文件中的空值检查。然而，在实际开发中，`ServiceA` 的行为完全依赖于一个全局配置对象 `ConfigManager`，该对象在应用启动时通过读取外部 YAML 文件初始化。如果 YAML 文件缺失某个键，`ConfigManager` 会返回 `null`，进而导致 `ServiceA` 崩溃。\n*   **ARB 的失败模式**：ARB 的检索器（无论是 Semantic 还是 Structural）在 Base Commit 状态下，面对查询“NullPointerException in ServiceA”，极大概率会召回 `ServiceA.java`（Gold）和相关的单元测试。它**不会**召回 `application.yaml` 或 `ConfigManager.java`，因为错误日志中没有提及配置，且结构上 `ServiceA` 与 `ConfigManager` 可能没有直接的 Import 关系（可能是通过 Service Locator 或全局单例访问）。\n*   **替代解释**：智能体如果仅依据 ARB 推荐的“高相关性”文件（即 `ServiceA.java`）进行推理，会陷入“局部修复”的陷阱（例如在 `ServiceA` 中添加防御性编程），而忽略了根本原因（配置缺失）。这种修复虽然通过了单元测试（因为测试环境可能硬编码了配置），但在生产环境中依然失败。\n*   **攻击点**：这证明了 ARB 定义的 **Agentic Relevance** 是**静态且局部的**，而真实的 **Context Acquisition** 是**动态且全局的**。ARB 的高 Recall@k 分数仅仅衡量了智能体找到“补丁所在文件”的能力，而非找到“问题根源上下文”的能力。如果智能体通过执行代码（Tool Use: `run_test` 或 `debugger`）发现配置问题，它实际上绕过了静态检索，直接找到了真正的上下文。ARB 将这种成功的动态探索视为“检索失败”（因为静态检索器没找到 YAML），从而错误地惩罚了有效的智能体行为，并高估了静态检索的价值。\n\n**理论论证：检索与推理的耦合性**\n进一步地，我可以论证 ARB 将检索（Retrieval）与推理（Reasoning）解耦的做法在理论上是错误的。在复杂软件系统中，**“需要读取什么文件”本身就是一个推理问题**，而非单纯的匹配问题。\n*   **反例逻辑**：假设智能体读取了 `ServiceA.java` 后，发现代码逻辑无误，但有一个注释提到“See ConfigManager for defaults”。此时，智能体需要决定下一步读取 `ConfigManager.java`。ARB 的评估协议要求智能体在**第一步**就通过静态检索找到所有 Gold 文件。如果智能体采用“读取-推理-再读取”的迭代策略，ARB 会将其初始检索评分记为低分，尽管其最终工作流是高效且正确的。\n*   **结论**：ARB 实际上是在评估“一次性全知检索”的能力，而非“交互式上下文获取”的能力。对于现代 Coding Agents 而言，后者才是关键。因此，ARB 的高分模型可能只是擅长“猜补丁位置”，而非擅长“理解代码库”。这种**指标与真实效用（Utility）的脱节**，使得 ARB 无法作为优化智能体检索策略的有效指南，反而可能引导研究者过度优化静态检索信号，而忽视更关键的动态探索能力。\n\n### § 12 Follow-up Research Idea\n\n基于 ARB 暴露出的“静态检索与动态执行脱节”以及“Gold 标注的主观性”局限，我提出一个全新的研究方向：**Executable Context Retrieval (ECR) —— 基于可执行验证的上下文检索**。\n\n**（a）驱动局限与未满足需求**\nARB 的核心局限在于它假设“相关性”可以通过静态文本或结构信号预先确定。然而，在真实场景中，上下文的“有用性”往往取决于**运行时行为**。例如，一个文件是否相关，取决于它是否在错误复现路径中被执行，或者它的修改是否影响了测试输出。现有的检索基准（包括 ARB）完全忽略了**代码的可执行性（Executability）**作为相关性信号。未满足的需求是：如何构建一个检索系统，能够利用轻量级的代码执行或动态分析（Dynamic Analysis）来验证候选上下文的有效性，而不仅仅是依赖静态相似度。\n\n**（b）借鉴相邻领域的方法**\n我们可以借鉴**程序分析（Program Analysis）**和**模糊测试（Fuzzing）**领域的技术。\n*   **动态切片（Dynamic Slicing）**：在程序分析中，动态切片可以确定哪些代码语句影响了特定的输出（如错误日志中的变量）。我们可以将“错误日志”视为观察点，通过轻量级的动态切片技术，反向追踪哪些文件中的代码实际参与了错误路径的执行。\n*   **差分测试（Differential Testing）**：借鉴模糊测试中的差分思想，我们可以将“检索到的上下文”视为一种干预。如果智能体在读取文件 A 后生成的补丁通过了测试，而在读取文件 B 后失败，那么文件 A 的“执行相关性”高于文件 B。\n*   **工具**：利用现有的轻量级插桩工具（如 Python 的 `sys.settrace` 或 Java 的 `Java Agent`）或静态分析工具（如 `Tree-sitter` 结合控制流图），在不完整执行整个应用的情况下，模拟或预测代码的执行路径。\n\n**（c）第一个实验设计**\n**实验名称：Exec-Relevance Benchmark (ERB)**\n\n1.  **数据构建**：从 SWE-bench 或 ARB 中选取 100 个样本。对于每个样本，不仅标注静态的 Gold 文件，还通过**动态插桩**记录在复现错误时实际被执行的代码路径（Execution Trace）。定义新的 Gold 集合：**Exec-Gold**，即那些在错误复现路径中被执行且包含关键逻辑的文件。\n2.  **检索器设计**：\n    *   **Baseline**：ARB 中的 Semantic 和 Structural 检索器。\n    *   **Proposed (Exec-Aware Retriever)**：引入一个“执行预测模块”。该模块接收查询（错误日志）和候选文件，利用轻量级的静态分析（如控制流图分析）或小型 LLM 预测该文件是否可能在错误路径中被执行。结合传统的语义分数，生成新的排名。\n3.  **评估指标**：\n    *   **Exec-Recall@k**：检索到的文件中，有多少比例属于 Exec-Gold 集合。\n    *   **Patch Success Correlation**：计算检索分数与最终 Patch 成功率的皮尔逊相关系数。假设 Exec-Recall 与 Patch Success 的相关性显著高于 ARB 的 File Recall。\n4.  **对比实验**：\n    *   比较 ARB 的 Gold 标注与 Exec-Gold 标注的重叠度。预期会发现大量 ARB 的 Gold 文件（如测试文件）并不在 Exec-Gold 中，而一些 ARB 忽略的文件（如被调用的底层库）在 Exec-Gold 中。\n    *   验证 Exec-Aware Retriever 是否在 `trace2code` 任务中显著优于纯静态检索器，特别是在那些静态语义相似度低但动态执行路径相关的案例中。\n\n**与已有工作的区别**：\nARB 和现有工作（如 RepoBench）完全基于**静态文本/结构**。ECR 首次将**动态执行信号**引入检索评估，将“相关性”从“文本相似”提升到“因果相关”。这不仅是一个新的基准，更是一种新的检索范式：**从“猜文件”转向“验证路径”**。这为构建真正理解代码运行行为的 Coding Agents 提供了更坚实的评估基础。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Bowen Qin\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yi Xie\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"National University of Singapore\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Peking University\"\n    }\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "现代编程代理通常通过其最终是否生成正确的补丁进行评估，但补丁生成依赖于早期的上下文获取阶段：即查找任务所需的仓库文件。我们引入了 Agent Retrieval Bench，这是一个针对该上游检索问题的文件级基准测试。样本基于真实的编码工作流信号构建，并在冻结的基准提交仓库上进行评估，相关性由代理下一步所需的内容定义，而非直接的查询-文件语义相似度。该基准涵盖四个正向检索任务：code2test、comment2context、trace2code 和 edit2ripple；第五个子集使用基于自然证据的无黄金标准案例和反事实错误仓库对照来评估选择性检索。Agent Retrieval Bench 包含来自 25 个仓库的 427 个样本：345 个正向示例、50 个自然无黄金标准示例和 32 个反事实对照。语料库包括 308 个基准提交快照、392,000 个文件和 790 万个文本块。我们评估了词汇检索、RepoMap、开源嵌入模型、选择性拒绝以及记录的代理上下文选择。没有任何单一的检索家族占据主导地位：Qwen3-Embedding-4B 在正向样本上具有最佳的样本加权 MRR，Qwen3-Embedding-8B 具有最佳的 Recall@20，而 RepoMap 在 8K token 预算下具有最佳的上下文产出，且任务级别的优胜者差异显著。使用反事实对照校准的选择性阈值并未提高在自然无黄金标准案例上的选择性成功率，揭示了校准差距。记录的轨迹在 27-35% 的样本中遗漏了所有黄金文件。一项受控的种子干预试点研究发现，与随机非黄金上下文相比，基于检索的初始上下文以较少的种子后探索实现了更高的文件 F1，而神谕黄金上下文显示出巨大的剩余提升空间。"}, {"title": "Tools Are Not Islands: Set-Level Tool Retrieval for LLM Agents via Query-Conditioned Hyperedge Prediction", "arxiv_id": "2607.25718", "authors": "Xinyi Hong, Pinjun Dong, Xinyang Yu, Binyan Jiang", "summary": "Large language model (LLM) agents increasingly rely on invoking external tools to complete real-world tasks. Tool retrieval, which selects a small task-relevant subset from a library of thousands of tools before the agent acts, has therefore become a critical component of LLM agent pipelines. However, existing retrievers either score each tool in isolation or assemble the tool set sequentially, so the joint utility of a candidate set is never evaluated as a whole. In this paper, we propose HYSET, short for HYperedge-based SEt-level Tool retrieval. Our contributions are threefold: (i) we formulate tool retrieval as query-conditioned hyperedge prediction on a tool co-invocation hypergraph, under which the tool set itself becomes the unit of scoring and most existing retrieval paradigms reduce to restricted instances; (ii) we capture size-dependent tool compatibility through cardinality-specific interactions; and (iii) we design HYSET as a pre-selection module requiring no modification to the downstream agent. Experiments on ToolBench demonstrate that HYSET consistently outperforms state-of-the-art baselines in both tool retrieval performance and end-to-end task success. Beyond the in-domain setting, HYSET further supports zero-shot/few-shot transfer, generalizing to held-out tools/categories and unseen domains with minimal supervision.", "category": "cs.LG", "cluster": "Tool Use \u0026 Retrieval", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：如何将大语言模型（LLM）智能体的工具检索（Tool Retrieval）从传统的“独立工具评分”或“顺序生成”范式，重构为**集合级（Set-Level）**的联合优化问题。具体而言，作者将工具检索形式化为在工具共调用超图（Tool Co-invocation Hypergraph）上的**查询条件超边预测（Query-Conditioned Hyperedge Prediction）**，旨在直接评估候选工具集合的整体效用，而非仅仅对单个工具进行独立打分。\n\n这一问题的重要性源于LLM智能体在实际应用中的两个关键瓶颈。首先，随着工具库规模从数十个手工函数扩展至数千个API端点（如ToolBench包含16,464个API），将所有工具描述注入上下文窗口不仅会导致极高的延迟和成本，还会因“迷失在中间”（Lost in the Middle）效应导致信息利用效率急剧下降。其次，现实世界任务通常依赖多个API的联合调用，工具之间的效用具有显著的**联合属性（Joint Utility）**，即一个工具的价值往往取决于它与其他被选中工具的互补性，而非其孤立的相关性。现有的独立评分方法无法捕捉这种集合层面的协同效应，导致检索出的工具集虽然单个工具相关度高，但整体覆盖度（Completeness）不足。\n\n解决该问题的价值体现在三个方面：一是显著提升检索质量，特别是完整工具集的覆盖率（COMP@K），从而减少智能体因缺少必要工具而失败的概率；二是提高端到端任务的成功率（Pass Rate），因为更准确的工具集能直接改善下游执行效果；三是增强模型的泛化能力，HYSET通过建模集合内部的交互结构，能够在零样本（Zero-shot）或少样本（Few-shot）设置下更好地迁移到未见过的工具类别或领域，降低了大规模标注数据的依赖。\n\n### § 2 前人工作与不足\n\n在HYSET之前，工具检索主要通过三种代表性范式解决，但它们均存在根本性的局限，无法有效处理工具集合的联合效用问题。\n\n第一种是**语义匹配检索（Semantic-matching Retrieval）**，包括稀疏方法如BM25和密集双编码器如Contriever、Sentence-BERT。这些方法将每个工具视为独立可评分的项目，候选集合的得分仅是单个工具得分的聚合。其不足在于，这种范式假设工具效用是可加的，忽略了工具间的依赖关系。例如，一个在孤立状态下得分较低的工具，可能在与其他特定工具组合时变得不可或缺；反之，一组高分工具可能因功能重叠而无法覆盖任务全貌。实验数据显示，即使经过微调的Contriever在Recall@3上达到68.6%，其COMP@3（完整工具集覆盖率）仅为39.7%，证明了独立评分在集合完整性上的结构性缺陷。\n\n第二种是**图增强检索（Graph-enhanced Retrievers）**，如COLT。这类方法通过二分图上的协同学习增强语义匹配，试图捕捉工具间的关联。然而，其不足在于，尽管训练过程中利用了图结构信息，但在推理阶段，这些协同信号被蒸馏为每个工具的独立嵌入，最终仍退化为独立的Top-K排名。因此，集合层面的连贯性（Set-level Coherence）仅是近似而非显式评分，无法在推理时直接评估候选集合的整体质量。\n\n第三种是**生成式检索（Generative Retrievers）**，如ToolGen。这类方法基于生成检索范式，让语言模型直接生成工具标识符。其不足在于，工具集合是通过序列似然目标逐步组装的，每一步都基于局部条件概率。这意味着完整的候选集合从未被显式比较，且组装过程对顺序敏感（Order-sensitive）。只有在生成结束后才能判断集合是否连贯和完整，缺乏对集合整体效用的全局优化机制。\n\n综上所述，现有工作的共同缺陷在于**未能将工具集合本身作为评分单元**。它们要么假设工具是独立的岛屿（Islands），要么通过隐式或顺序的方式近似集合关系，导致无法显式建模工具兼容性随集合大小（Cardinality）变化的动态特性。HYSET正是针对这一缺口，通过超边预测显式地对集合进行联合评分，并引入基数特定的交互矩阵（Cardinality-specific Interaction Matrices）来捕捉不同规模工具集下的兼容性差异，从而弥补了前人工作在集合级建模上的不足。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM Agent 领域，随着工具库从几十个人工编写的函数扩展到 RapidAPI 等包含数千个端点的生态系统，**Tool Retrieval** 成为关键瓶颈。现有的主流方法主要分为三类：基于语义匹配（如 BM25、Contriever）、基于图增强（如 COLT）和基于生成（如 ToolGen）。然而，研究者观察到这些方法存在一个共同的结构性缺陷：它们要么将每个工具视为独立个体进行打分（Isolated scoring），要么通过自回归方式逐个生成工具（Sequential assembly）。这种范式忽略了现实任务中工具调用的本质——**工具不是孤岛（Tools are not islands）**。\n\n通过深入分析 ToolBench 等数据集，研究者发现一个显著现象：许多任务需要多个 API 联合调用才能完成（Joint invocation）。例如，在旅行规划任务中，单独看“航班”和“酒店”的语义相关性都很高，但如果只检索出多个类似的航班 API 而遗漏了酒店或天气 API，任务依然失败。现有的独立打分机制无法捕捉这种**集合层面的互补性（Set-level complementarity）**，导致高 Recall 但低 COMP（Completeness，即完整覆盖所需工具集的比例）。此外，研究者还注意到工具之间的兼容性并非固定不变，而是依赖于集合的大小（Cardinality-dependent）。例如，两个工具在双工具任务中可能互不相关，但在四工具任务中却是常见的组合。现有的 pairwise 交互模型或固定图结构无法灵活建模这种随集合规模变化的高阶交互。\n\n基于此，研究者意识到必须将 **Tool Retrieval** 重新定义为一个**集合级（Set-level）**的问题，而非个体排序问题。为了在数学上优雅地处理任意大小的工具子集及其内部的高阶交互，**Hypergraph**（超图）是一个自然的候选结构，因为超边（Hyperedge）天然可以连接多个节点。因此，核心思路是将工具检索转化为在工具共调用超图上的**Query-conditioned Hyperedge Prediction**（查询条件超边预测）。为了高效建模不同大小集合下的工具兼容性，研究者引入了**Cardinality-specific Interaction Matrices**（基数特定交互矩阵），使得模型能够区分不同规模工具集内部的交互模式，从而在不修改下游 Agent 的前提下，直接对候选工具集进行整体打分。\n\n### § 4 核心 Intuition\n\n传统工具检索将每个工具视为独立个体进行打分或逐个生成，忽略了工具之间存在的**联合效用（Joint Utility）**和**互补性（Complementarity）**，导致检索出的工具集往往缺乏完整性。HYSET 的核心直觉是**“工具不是孤岛”**，即工具检索本质上是一个**集合级（Set-level）**问题，必须将候选工具集作为一个整体（Hyperedge）进行评估，而非个体分数的简单聚合。通过引入**基数特定交互（Cardinality-specific Interactions）**，模型能够捕捉工具兼容性随集合大小变化的动态特性，从而更准确地识别出能共同完成任务的工具组合。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nHYSET 的核心思想是将工具检索从“独立评分”转变为“集合级评分”，即把工具集合作为整体（Hyperedge）进行打分，而非单独评估每个工具。其完整 Pipeline 分为训练阶段和推理阶段，具体步骤如下：\n\n**1. 输入与预处理 (Input \u0026 Preprocessing)**\n*   **输入**：自然语言查询 $x$（例如：“我下个月要从芝加哥飞往东京五天，请查找往返机票，预订新宿附近的酒店，查询那几天的天气，并将2000美元预算换算成日元”）。\n*   **工具库**：包含数千个 API 的工具库 $T$。\n*   **嵌入表示**：使用冻结的预训练语言模型（如 BERT 或 Qwen）将查询 $x$ 映射为向量 $\\mathbf{r}(x)$。同时，每个工具 $t$ 拥有可学习的嵌入向量 $\\mathbf{z}_t$。\n\n**2. 候选集构建 (Candidate Pool Construction)**\n由于直接在全量工具子集中搜索计算量过大，HYSET 采用两阶段策略：\n*   **第一阶段（粗筛）**：计算每个工具与查询的独立相关性得分，选出 Top-$K_1$ 个最相关的工具作为初始短名单 $S_0$。\n*   **第二阶段（扩展）**：计算剩余工具与 $S_0$ 的互补性（Complementarity），选出互补性最高的工具加入，形成大小为 $K_{pool}$ 的候选池 $S$。这一步旨在捕获那些单独看相关性低、但与已选工具配合极佳的工具。\n\n**3. 集合级评分 (Set-Level Scoring)**\n这是 HYSET 的核心。对于候选池 $S$ 中的每一个可能的工具子集 $E$（即 Hyperedge），计算其联合效用分数 $F_\\theta(x, E)$。该分数由两部分组成：\n*   **集合内部交互项 ($F_{set}$)**：衡量工具之间的兼容性。它通过**基数特定的交互矩阵** ($\\mathbf{M}_m$，其中 $m=|E|$) 来计算。这意味着两个工具在“2工具集合”中的协同效应，与在“4工具集合”中的协同效应是不同的。公式为所有工具对嵌入向量在对应矩阵下的二次型之和。\n*   **查询-集合对齐项 ($F_{align}$)**：衡量整个工具集与查询的相关性。它使用 Cross-Attention Pooling，以查询向量为 Query，工具集向量为 Key/Value，生成一个条件化的集合表示，再计算相似度。\n\n**4. 最优集合选择 (Optimal Set Selection)**\n*   在候选池 $S$ 的所有子集（大小从 1 到 $M$）中，寻找使 $F_\\theta(x, E)$ 最大化的子集 $E^*$。\n*   **输出**：返回这个最优工具集合 $E^*$ 给下游的 LLM Agent 执行任务。注意，这里返回的是一个无序集合，而非排序列表。\n\n**5. 训练机制 (Training Mechanism)**\n*   **负采样**：为每个真实工具集 $E^\\star$ 构造负样本池，包括随机采样、In-batch 负样本和 Hard Negatives（替换真实集中的工具为相似工具）。\n*   **执行反馈 (Execution Feedback)**：HYSET 不仅依赖标注数据，还利用 LLM Agent 的执行结果作为奖励。如果 Agent 使用选出的工具集成功完成任务，则给予正奖励，通过 Reward-Weighted Self-Training Loss 强化该工具集的评分。\n\n**真实例子讲解：**\n假设查询是上述的旅行规划。\n1.  **粗筛**：模型首先识别出 \"Flight\", \"Hotel\", \"Weather\", \"Currency\" 等关键词，选出相关性最高的工具，如 `FlightAPI`, `HotelAPI`, `WeatherAPI`, `CurrencyAPI` 以及可能误选的 `CheapFlightAPI`。\n2.  **扩展**：模型发现 `CurrencyAPI` 单独相关性较低，但与 `FlightAPI` 和 `HotelAPI` 结合时能解决预算问题，因此将其纳入候选池。\n3.  **评分**：\n    *   对于集合 $\\{FlightAPI, CheapFlightAPI\\}$，$F_{set}$ 会很低，因为两个飞行工具功能冗余，且 $\\mathbf{M}_2$ 矩阵会惩罚这种冗余。\n    *   对于集合 $\\{FlightAPI, HotelAPI, WeatherAPI, CurrencyAPI\\}$，$F_{set}$ 会很高，因为 $\\mathbf{M}_4$ 矩阵捕捉到了这四个工具在复杂任务中的互补性；同时 $F_{align}$ 也很高，因为该集合覆盖了查询的所有意图。\n4.  **输出**：HYSET 选出 $\\{FlightAPI, HotelAPI, WeatherAPI, CurrencyAPI\\}$ 交给 Agent，Agent 依次调用这些 API 完成任务。\n\n### § 6 核心数学推导\n\nHYSET 的核心数学贡献在于将工具检索形式化为**查询条件化的超边预测 (Query-Conditioned Hyperedge Prediction)**，并证明了其参数化形式能够捕捉高阶交互。\n\n**1. 问题形式化**\n传统检索将工具视为独立节点，评分函数为 $F(x, E) = \\sum_{t \\in E} s(x, t)$。HYSET 将其定义为超图 $H=(V, E)$ 上的超边预测，其中超边 $E$ 是工具子集。评分函数分解为：\n$$ F_\\theta(x, E) = F_{set}(E) + F_{align}(x, E) $$\n\n**2. 集合交互项 $F_{set}$ 与 Möbius 变换**\n$F_{set}$ 旨在捕捉工具间的联合效用。HYSET 使用以下参数化形式：\n$$ F_{set}(E) = \\sum_{\\{t_a, t_b\\} \\subseteq E} \\mathbf{z}_{t_a}^\\top \\mathbf{M}_{|E|} \\mathbf{z}_{t_b} $$\n其中 $\\mathbf{M}_m$ 是依赖于集合大小 $m$ 的对称交互矩阵。\n\n**理论背景与 Intuition：**\n*   **为什么需要 $\\mathbf{M}_m$？** 直觉上，两个工具在小型任务中可能是冗余的（如两个地图 API），但在大型复杂任务中可能是互补的（如一个负责路线规划，一个负责实时交通）。固定矩阵无法区分这种语境依赖。\n*   **Möbius 变换的作用**：论文引入 Möbius 变换来解释 $F_{set}$ 的能力。Möbius 系数 $\\tilde{f}(T)$ 表示集合 $T$ 独有的、不能由其子集解释的交互贡献。\n*   **定理 1 (Theorem 1)**：论文证明，如果所有 $\\mathbf{M}_m$ 都相同，则 $F_{set}$ 是“成对可分解”的，即只包含二阶交互，高阶交互为零。但如果 $\\mathbf{M}_m$ 随 $m$ 变化，则 $F_{set}$ 能够隐式地表示高达 $M$ 阶的交互效应。\n*   **Intuition**：虽然公式看起来只是两两求和，但由于权重矩阵 $\\mathbf{M}_m$ 随集合大小变化，这种“上下文依赖的权重”使得模型能够模拟多工具之间的复杂协同效应，而无需显式地计算昂贵的 $M$ 阶张量。这大大降低了参数量（$O(M d_z^2)$ vs $O(d_z^M)$）。\n\n**3. 查询对齐项 $F_{align}$**\n$$ F_{align}(x, E) = \\mathbf{r}(x)^\\top \\mathbf{s}(x, E) $$\n其中 $\\mathbf{s}(x, E)$ 是通过 Cross-Attention 得到的集合表示：\n$$ \\mathbf{s}(x, E) = \\sum_{t \\in E} \\alpha_t(x, E) \\mathbf{P} \\mathbf{z}_t $$\n注意力权重 $\\alpha_t$ 取决于查询 $x$ 和集合中所有工具。这意味着工具的重要性是动态的，取决于它在当前集合和查询下的角色。\n\n**4. 训练目标**\n结合负采样损失和执行反馈奖励：\n$$ \\mathcal{L} = \\mathcal{L}_{retrieval} + \\eta \\mathcal{L}_{self} + \\lambda \\|\\mathbf{M}\\|^2 $$\n*   $\\mathcal{L}_{retrieval}$：最大化真实集合与负样本集合的分数差。\n*   $\\mathcal{L}_{self}$：利用 Agent 执行成功的奖励，强化那些实际有效的工具集，解决标注数据可能不完整或次优的问题。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n*   **Q1**: 将工具集合作为整体进行评分（Set-level scoring）是否能提高检索性能，特别是完整工具集的覆盖率（COMP@K）？\n*   **Q2**: 工具之间的兼容性是否随集合大小（Cardinality）变化？建模这种基数依赖性是否有帮助？\n*   **Q3**: HYSET 是否具有良好的泛化能力（Zero-shot/Few-shot）和数据效率？\n\n**2. 设计了什么实验验证这个问题？**\n*   **主实验 (Main Results)**：在 ToolBench 和 UltraTool 数据集上，对比 HYSET 与三种主流范式（Semantic-matching: BM25, Contriever; Graph-enhanced: COLT; Generative: ToolGen）的性能。指标包括 Recall@K, NDCG@K, COMP@K（完整覆盖率）以及端到端 Pass Rate。\n*   **消融实验 (Ablation Study)**：\n    *   移除 $F_{set}$（仅保留独立评分）以验证集合评分的重要性。\n    *   移除执行反馈（Execution Feedback）以验证其贡献。\n    *   替换 $\\mathbf{M}_m$ 为固定矩阵或单位矩阵，以验证基数特定交互的必要性。\n    *   对比其他集合编码器（如 DeepSets, Set Transformer）以验证 HYSET 架构的优越性。\n*   **泛化与数据效率实验**：\n    *   **Zero-shot Transfer**：在未见过的工具（Held-out tools）、未见过的类别（Held-out categories）和跨域（Cross-domain）上测试。\n    *   **Few-shot Adaptation**：仅使用每个类别 1, 5, 10 个样本进行微调，观察性能恢复情况。\n*   **成本与可扩展性分析**：测量推理延迟、内存占用和训练成本，验证其在大规模工具库下的可行性。\n\n**3. 问题的答案是什么？**\n*   **A1 (Set-level scoring)**：是的。HYSET 在 COMP@5 上比最强基线 ToolGen 提升了 10.8%-11.6%，显著提高了完整工具集的召回率。端到端 Pass Rate 也提升了约 13.1%。这证明工具不是孤立的，集合级评分能更好地捕捉任务需求。\n*   **A2 (Cardinality-specific interactions)**：是的。消融实验显示，使用基数特定的 $\\mathbf{M}_m$ 比使用共享矩阵或固定矩阵在 Pass Rate 上提升了 7.1%。这证实了工具兼容性确实随集合大小变化，且 HYSET 能有效建模这种变化。\n*   **A3 (Generalization \u0026 Efficiency)**：是的。HYSET 在零样本跨域迁移中保留了 79.9% 的域内性能。在 Few-shot 设置下，仅用 5 个样本/类别即可恢复 93.2% 的全监督性能，显示出极高的数据效率。\n*   **结论**：HYSET 通过将工具检索重构为超边预测，并引入基数特定的交互建模，成功解决了现有方法忽略工具间联合效应的缺陷，在检索质量和端到端任务成功率上均取得了 State-of-the-Art 的结果，且具备良好的泛化能力和计算效率。", "additional_insights": "### § 8 Take-aways\n\nHYSET 将 LLM 工具检索重新定义为工具共调用超图上的 query-conditioned hyperedge prediction 问题，从而将评分单元从单个工具提升为工具集合，直接解决了现有方法无法评估集合整体效用（joint utility）的缺陷。该方法通过引入 cardinality-specific interaction matrices，显式建模了工具兼容性随集合大小变化的特性，证明了工具间的交互效应并非固定不变，而是依赖于上下文集合的基数（cardinality）。实验表明，HYSET 在 ToolBench 上显著提升了 COMP@5 指标，证明了对完整工具集（complete tool set）的覆盖能力优于仅优化个体相关性的基线模型。HYSET 设计为独立的 pre-selection module，无需修改下游 LLM agent，且通过两阶段推理（per-tool retrieval + set-level reranking）在保持高精度的同时控制了计算复杂度。该方法在零样本和少样本设置下展现出强大的泛化能力，能够迁移至未见过的工具类别和领域，验证了超图结构对工具共现模式捕捉的有效性。\n\n### § 9 最脆弱的假设\n\nHYSET 核心贡献依赖于“工具集合的联合效用可以通过基于基数的成对交互矩阵（cardinality-specific pairwise interaction matrices）充分近似”这一假设。根据论文中的 Theorem 1，虽然 $F_{set}$ 参数化为成对求和，但通过不同基数下的矩阵差异，理论上可以表示高达 $M$ 阶的交互效应；然而，这本质上仍是一种参数化的近似，假设高阶交互（如三个工具之间特有的、无法分解为两两交互之和的协同或冲突）可以通过调整两两权重来隐式捕捉。在实际场景中，如果存在复杂的非线性高阶依赖（例如，工具 A 和 B 单独与 C 兼容，但 A、B、C 同时存在时因资源竞争或逻辑互斥导致失败），仅靠成对矩阵可能无法准确建模这种“涌现”的集合属性。论文提供的证据主要是消融实验显示移除 $F_{set}$ 或共享矩阵会导致性能下降，以及 HYSET 优于 DeepSets 和 Set Transformer 等通用集合编码器；但这并未直接证明成对近似足以捕捉所有高阶效应，缺乏对高阶交互残差（residual higher-order interactions）的定量分析或反例验证，因此若真实工具库中存在大量强高阶耦合，该假设的失效将直接削弱 HYSET 相对于更复杂集合模型的优势。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 HYSET 的核心推理逻辑以验证“集合级评分优于个体评分聚合”这一 claim，无需训练完整模型。使用 ToolBench 的测试集和预训练的工具嵌入（如 Sentence-BERT 或论文提供的初始化嵌入），实现 HYSET 的两阶段推理流程：第一阶段使用简单的余弦相似度选取 Top-K 候选工具构建 shortlist；第二阶段实现 HYSET 的 $F_{set}$ 和 $F_{align}$ 评分函数，其中 $F_{set}$ 使用随机初始化或从少量数据拟合的 cardinality-specific matrices，$F_{align}$ 使用 cross-attention pooling。测量指标为 COMP@5（即检索出的集合是否完全覆盖 ground-truth 工具集）。如果 HYSET 的集合级评分在 COMP@5 上显著高于仅对 Top-K 工具进行简单排序或基于个体分数聚合的方法（如 BM25 或 Contriever 的 Top-K 结果），则支持了集合级建模的有效性；反之，若两者差异不显著，则质疑了复杂超图建模的必要性。此实验避开了耗时的训练和 LLM 执行反馈，直接验证了检索架构的核心假设。", "research_value": "### § 11 最强反例设计\n\n若要挑战 HYSET 的有效性，最有力的攻击并非质疑其数学推导的正确性，而是攻击其**计算复杂度与收益的边际递减效应**，以及**对“工具独立性”假设的过度修正导致的过拟合风险**。\n\n首先，设计一个**“高维稀疏工具库下的组合爆炸反例”**。HYSET 的核心瓶颈在于第二阶段候选池 $S$ 的子集搜索。虽然论文声称通过两阶段策略控制了复杂度，但在真实世界的 API 库中（如包含数万端点的 AWS 或 Azure SDK），工具之间的语义重叠极高且长尾分布显著。如果构造一个场景，其中 Ground-truth 工具集包含一个极度冷门、与查询语义距离极远但逻辑上不可或缺的工具（例如，在“预订酒店”任务中，必须调用一个特定的“签证状态检查”API，该 API 在语义上与“酒店”、“机票”均无直接关联），HYSET 的第一阶段粗筛（基于独立相关性）极大概率会将其过滤掉，而第二阶段基于互补性的扩展也难以跨越巨大的语义鸿沟将其召回。此时，HYSET 的 Set-Level Scoring 将因候选池中缺失关键节点而彻底失效，且其复杂的交互矩阵 $\\mathbf{M}_m$ 无法弥补召回阶段的结构性缺陷。相比之下，基于 LLM 原生推理的 Generative Retrievers（如 ToolGen）虽然顺序敏感，但能通过思维链（Chain-of-Thought）显式地“发现”这种非语义关联，从而在极端长尾场景下表现更优。\n\n其次，提出一个**“伪相关交互的过拟合论证”**。HYSET 依赖 $\\mathbf{M}_m$ 捕捉工具间的联合效用，但这本质上是在拟合训练数据中的共现模式（Co-occurrence Patterns）。在 ToolBench 等合成数据集中，工具共现往往由数据生成器的逻辑硬编码决定，而非真实用户的复杂行为。如果构造一个**“动态依赖场景”**，其中工具 A 和 B 的兼容性取决于运行时参数（Runtime Parameters）而非静态描述（例如，A 是“读取 CSV”，B 是“解析 JSON”，两者在静态描述上互斥，但在特定数据清洗流程中可能先后出现），HYSET 的静态嵌入 $\\mathbf{z}_t$ 和固定矩阵 $\\mathbf{M}_m$ 无法捕捉这种动态上下文。实验上，可以展示 HYSET 在训练集上 COMP@K 极高，但在引入少量“参数依赖型”新工具后，性能断崖式下跌，证明其学到的“交互”仅是数据分布的统计伪影，而非真正的逻辑兼容性。这揭示了 HYSET 将“检索”与“规划”强行耦合的局限性：它试图用静态评分解决动态规划问题。\n\n### § 12 Follow-up Research Idea\n\n基于 HYSET 将工具检索视为静态集合评分的局限，我提出一个新的研究方向：**Dynamic Tool Graph Reasoning via Neuro-Symbolic Execution Traces（基于神经符号执行轨迹的动态工具图推理）**。\n\n**(a) 驱动局限与未满足需求：**\nHYSET 的核心缺陷在于其**静态性**和**黑盒性**。它假设工具集合的效用可以通过预训练的嵌入和交互矩阵静态评估，忽略了工具调用的**时序依赖性**（Temporal Dependency）和**状态依赖性**（State Dependency）。在真实 Agent 任务中，工具 A 的输出往往是工具 B 的输入，这种数据流（Data Flow）和状态转移（State Transition）无法通过简单的成对交互矩阵 $\\mathbf{M}_m$ 捕捉。此外，HYSET 缺乏可解释性，无法告诉 Agent *为什么* 这个集合是好的，导致下游 LLM 难以进行自我修正。现有的 Set-Level 方法未能解决“检索”与“执行规划”之间的语义鸿沟。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴**程序合成（Program Synthesis）**中的**抽象语法树（AST）验证**和**形式化方法（Formal Methods）**中的**模型检查（Model Checking）**思想，结合**神经符号学习（Neuro-Symbolic Learning）**。具体而言，不将工具视为独立的节点或静态的超边，而是将工具库建模为一个**有向无环图（DAG）**，其中边表示数据依赖或状态转换。利用 LLM 生成初步的工具调用序列（Trace），然后通过一个轻量级的**符号执行引擎（Symbolic Execution Engine）**验证该序列在类型系统（Type System）和 API 约束下的可行性。\n\n**(c) 第一个实验设计：**\n构建一个名为 **Trace-Validated Tool Retrieval (TVTR)** 的框架。\n1.  **数据构建**：在 ToolBench 基础上，为每个任务标注“工具调用依赖图”，而不仅仅是工具集合。\n2.  **方法实现**：\n    *   **Retrieval Stage**：使用传统的 Semantic Matching 召回候选工具。\n    *   **Reasoning Stage**：引入一个小型的 **Graph Neural Network (GNN)** 编码器，将候选工具及其 API 描述（输入/输出类型、前置条件）编码为图结构。\n    *   **Validation Stage**：设计一个 **Neuro-Symbolic Validator**，它不直接评分集合，而是尝试在图结构上寻找一条从“初始状态”到“目标状态”的有效路径。如果路径存在且满足类型约束，则该工具子集被标记为“Valid”。\n3.  **对比实验**：在包含复杂多步依赖的任务子集（如“数据清洗-分析-可视化”流水线）上，对比 HYSET 与 TVTR。重点评估指标不仅是 COMP@K，还包括 **Execution Feasibility Rate**（即检索出的工具集是否能在不报错的情况下被 LLM 成功串联执行）。预期结果是，HYSET 在简单共现任务上表现良好，但在需要严格数据流匹配的任务上，TVTR 能显著减少因工具接口不匹配导致的执行失败，证明**基于依赖图的动态验证**优于**基于统计共现的静态评分**。\n\n这一方向将工具检索从“相关性排序”提升为“可行性验证”，从根本上解决了 HYSET 无法捕捉动态交互和时序依赖的问题，为 LLM Agent 提供了更具鲁棒性和可解释性的工具选择机制。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Xinyi Hong\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"**\"\n      ]\n    },\n    {\n      \"name\": \"Pinjun Dong\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"**\"\n      ]\n    },\n    {\n      \"name\": \"Xinyang Yu\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"**\"\n      ]\n    },\n    {\n      \"name\": \"Binyan Jiang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"**\",\n        \"∗\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"School of Mathematical Sciences, Shanghai Jiao Tong University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Department of Data Science and Artificial Intelligence, The Hong Kong Polytechnic University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"**\",\n      \"text\": \"Equal contribution\"\n    },\n    {\n      \"marker\": \"∗\",\n      \"text\": \"Corresponding author\"\n    }\n  ]\n}\n```", "summary_translation": "大型语言模型（LLM）智能体越来越依赖调用外部工具来完成现实世界任务。工具检索在智能体行动前从包含数千个工具的库中筛选出少量与任务相关的子集，因此已成为 LLM 智能体流水线中的关键组件。然而，现有的检索器要么孤立地对每个工具进行评分，要么按顺序组装工具集，因此从未将候选工具集的整体联合效用作为整体进行评估。在本文中，我们提出了 HYSET，即基于超边的集合级工具检索（HYperedge-based SEt-level Tool retrieval）。我们的贡献有三方面：（i）我们将工具检索表述为工具共调用超图上的查询条件超边预测问题，在此框架下，工具集本身成为评分单元，且大多数现有检索范式可简化为受限实例；（ii）我们通过基数特定的交互捕捉依赖于规模的工具兼容性；（iii）我们将 HYSET 设计为一个无需修改下游智能体的预选择模块。在 ToolBench 上的实验表明，HYSET 在工具检索性能和端到端任务成功率方面均一致优于最先进的基线方法。除了域内设置外，HYSET 还支持零样本/少样本迁移，在极少监督的情况下泛化到保留的工具/类别和未见过的领域。"}]}, {"name": "Training \u0026 Reward Signals", "count": 1, "papers": [{"title": "CAST: Game Solvers as Turn-Level Teachers for LLM Agents", "arxiv_id": "2607.25308", "authors": "Yu Wang, Yi-Kai Zhang, Wentao Shi, Ziang Ye, Yuchun Miao, Yueqing Sun, Qi Gu, Xunliang Cai, Lan-Zhe Guo, Han-Jia Ye, Fuli Feng", "summary": "Training large language models (LLMs) to act in long-horizon games is a promising step toward generalist decision-making, yet reinforcement learning with verifiable rewards (RLVR) relies on sparse final rewards that reveal little about which decisions determine success. Denser process signals could supply this missing turn-level credit, but existing sources are hard to keep both cheap and accurate. We observe that changes in a game solver's state value reveal whether an action advances the state toward success. Building on this insight, we propose CAST (Credit Assignment from Solver Teachers), which converts these value changes into solver advantages and injects them into RLVR as turn-level signals. We further show that, under a soft-optimal solver assumption, maximizing the solver advantage is equivalent to on-policy distillation from the solver, requiring only scalar values rather than teacher logits. Across Sokoban, Minesweeper, and Rush Hour, CAST outperforms all trained baselines on every game under both in-domain and unseen-difficulty evaluation and achieves the highest average zero-shot performance on ALFWorld and WebShop. Our code is available at https://github.com/Wloner0809/CAST.", "category": "cs.CL", "cluster": "Training \u0026 Reward Signals", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决大型语言模型（LLMs）在长视界（long-horizon）游戏环境中进行强化学习时面临的**信用分配（credit assignment）**难题。具体而言，现有的基于可验证奖励的强化学习（RLVR）方法主要依赖稀疏的终端奖励（sparse terminal rewards，如最终胜负的 0/1 信号），这种粗粒度的反馈无法揭示轨迹中哪些具体步骤导致了成功或失败，导致模型难以从长序列交互中学习有效的决策策略。\n\n这一问题的重要性在于，构建能够在具身（embodied）和开放世界环境中进行主动决策的通用智能体（generalist agents）是当前 AI 发展的核心目标。这类环境具有状态演化、早期决策后果滞后且难以逆转等特征，要求智能体具备长视界规划、目标导向探索及错误恢复能力。经典游戏（如 Sokoban、Minesweeper）作为具有明确规则和可验证反馈的理想测试床，能够量化评估这些能力。然而，通用 LLM 在这些结构化环境中表现依然不可靠，主要瓶颈在于缺乏可扩展的细粒度学习信号。\n\n解决该问题的价值体现在三个方面：首先，通过引入游戏求解器（game solvers）作为回合级教师（turn-level teachers），CAST 方法将稀疏的终端奖励转化为密集的进程监督信号（process supervision），显著提升了训练效率和最终性能；其次，该方法证明了最大化求解器优势（solver advantage）等价于无需教师 logits 的在线策略蒸馏（on-policy distillation），为 LLM 从专家策略中学习提供了新的理论视角和高效实现路径；最后，实验表明 CAST 不仅在训练游戏上达到最先进水平（state-of-the-art），还能零样本（zero-shot）迁移至 ALFWorld 和 WebShop 等未见过的领域，证明了其在提升 LLM 通用决策能力方面的泛化潜力。\n\n### § 2 前人工作与不足\n\n尽管已有多种方法试图缓解稀疏奖励带来的信用分配问题，但现有方案在计算成本、监督信号准确性或适用范围上存在显著不足。\n\n1.  **基于搜索的方法（Search-based methods）**：如 Hao et al. (2023) 提出的利用世界模型进行规划的方法，通过昂贵的搜索过程来估计中间状态的价值。这类方法虽然能提供较细粒度的信号，但计算开销巨大，难以在大规模训练中保持低成本和高效率。\n2.  **学习的过程奖励模型（Learned Process Reward Models）**：如 Xi et al. (2026) 提出的 AgentPRM，通过训练专门的模型来评估每一步的进展。这类方法需要额外的标注数据或复杂的训练流程来构建奖励模型，且模型本身的准确性可能受限，存在监督信号不可靠的风险。\n3.  **跨轨迹比较方法（Cross-trajectory comparisons）**：如 Feng et al. (2026) 提出的 GiGPO，通过比较不同轨迹在相似状态下的表现来生成过程信号。这类方法依赖于找到可比的状态对，这在长视界和复杂状态空间中往往难以保证，且信号的信噪比可能较低。\n4.  **传统的监督微调（SFT on expert trajectories）**：虽然可以直接使用求解器生成的专家轨迹进行微调，但这种方法仅暴露模型于专家访问过的状态，一旦模型在交互中偏离专家路径，就缺乏有效的指导信号，无法支持在线策略（on-policy）探索下的持续学习。\n\n上述方法的共同局限在于，它们要么计算成本过高（搜索），要么需要额外的模型训练或数据标注（过程奖励模型），要么信号可靠性或适用性受限（跨轨迹比较、SFT）。相比之下，CAST 利用游戏求解器本身提供的状态价值（state value）变化，以极低的额外计算开销（negligible overhead）生成了准确、细粒度的回合级信用信号，且无需教师模型的完整输出分布（logit-free），从而在效率、准确性和理论完备性上超越了现有方法。", "core_insight": "### § 3 重建作者的思考路径\n\n在训练 LLM 玩长视界游戏时，研究者面临的核心痛点是 **Credit Assignment** 问题。现有的 **RLVR**（Reinforcement Learning with Ve
