中，单次 batch size 极小（$B=8, G=8$）的 policy gradient 具有极高的方差，其对 65,536 维的 gradient sketch 计算 cosine similarity，在统计上极不稳定。由于 Dr.GRPO 的 advantage 不除以 group standard deviation，当组内 reward 方差微小但非零时，梯度幅值可能剧烈波动，此时 cosine similarity 主要被噪声主导，而非真实的泛化方向。为了证实这一点，我会设计一个“Shuffled Transferability”消融实验：在完全相同的训练 pipeline 下，保持 learnability 信号 $L_h$ 和 bandit 探索机制不变，但在计算 transferability $T_h$ 时，故意从其他随机 optimizer step 或随机 harness 中抽取 EMA sketch 进行匹配（即注入完全错乱的 gradient alignment 信号）。如果这个“Shuffled Transferability”版本的 HarnessBandit 在 PinchBench 和 ClawEval 上依然能取得与原版相当的性能（远超 static mixed-batch），就能确凿地证明：性能提升完全归功于“纯 harness batch 避免了 intra-batch gradient interference”加上“learnability 调度过滤了无效更新”，而 transferability 信号本质上是一个不起作用的数学幻象。此外，从真实场景攻击，如果存在一个“Orthogonal Harness”（例如一个是纯文本输出，另一个是结构化 JSON API，底层 representation 完全解耦），强制要求它们的 gradient cosine 对齐，不仅违背多任务学习的异构性本质，还可能迫使 policy 在 representation bottleneck 上做出妥协，导致在需要 harness-specific 深度推理的 held-out 任务上性能可预测地崩溃。\n\n### § 12 Follow-up Research Idea\n\n本文的局限在于将多接口训练视为一个对单一 monolithic policy 进行时序调度的问题，这不可避免地会遇到 representation bottleneck：当不同 harness 的 interface mismatch 本质上是结构性的（如不同的 tool schemas 导致不同的 latent state distributions），强制对齐它们的 gradient direction 或寻找一个共享的 policy subspace，可能会抹杀 harness-specific 的推理模式。基于此未满足的需求，我提出一个全新的 framing：**Interface-Invariant Policy Decomposition via Harness-Conditioned Hypernetworks**。该研究不再通过 bandit 在不同 harness 间做“非此即彼”的时序妥协，而是将策略网络显式解耦为一个 harness-agnostic 的“Reasoning Core”和一组 harness-specific 的“Interface Adapters”，并借鉴 Invariant Risk Minimization (IRM) 的思想，在目标函数中显式惩罚不同 harness 环境下 latent trajectory representations 的分布差异。具体而言，可以借鉴 Hypernetworks 领域的方法，用一个轻量级网络以 harness 的 system prompt 和 tool schema 为输入，动态生成 adapter 的 LoRA 权重。这样，RL 的 gradient 不再需要在同一个参数空间里竞争对齐度，而是自然地路由到 condition-specific 的子空间中。第一个实验将设计一个包含高度异构 harness 的 ClawGym 子集（如纯文本 ReAct 与结构化 OpenClaw），对比三种架构：标准 GRPO（static mix）、HarnessBandit（时序调度）、以及 Hypernetwork-IRM（结构解耦）。核心评测指标不仅是 held-out task 的成功率，更关键的是利用 Centered Kernel Alignment (CKA) 测量不同 harness 下 model 中间层 latent representations 的相似度。如果 Hypernetwork-IRM 在保持更高 CKA（证明学到了 invariant reasoning）的同时，在 out-of-distribution harness 上大幅超越 HarnessBandit，这将证明结构化解耦优于时序调度，从而开启“基于因果不变性的 agentic RL”这一全新研究方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Hongliang Wei\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Xiaobing Tu\", \"affiliations\": [2], \"markers\": [\"*\", \"†\"]},\n    {\"name\": \"Yinggui Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Zhengxi Liu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Rongkun Xue\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jinkui Ren\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Xiantao Zhang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Debin Zhao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiaopeng Fan\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Harbin Institute of Technology\"},\n    {\"id\": 2, \"name\": \"Alibaba Cloud\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution.\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding authors.\"}\n  ]\n}\n```", "summary_translation": "语言模型 agents 正越来越多地通过不同的 harnesses 进行部署，这些 harnesses 在 system prompts、tool schemas、control loops 和 trajectory formats 上各不相同。同一个模型在这些 interfaces 上的表现可能参差不齐，这使得对 harness variation 的 robustness 成为一个重要目标。一种自然的方法是通过多个 harnesses 训练一个 shared policy，但这样做会引入一个 scheduling problem：每个 training step 应该倾向于选择当前能提供有用 learning signal 的 harness，同时产生的 update 也要能惠及其他 harnesses。我们开发了 HarnessBandit，这是一种在每个 optimizer step 选择一个 harness 的 online scheduler。在进行 group-relative policy optimization (GRPO) update 之后，它会观察 learnability——即 batch 上的 mean absolute advantage——以及 transferability——即当前 harness 的 low-dimensional gradient sketch 与剩余 harnesses 的 exponential moving averages 之间的 cosine。这两个信号在经过 pooled sliding-window min-max normalization 后进行融合，并通过 visit-dependent bonus 和 explicit exploration floor 进行采样。我们在 ClawGym 上跨六个 harnesses 训练 Qwen3.5-2B，并在 PinchBench（held-out tasks，in-distribution OpenClaw）和 ClawEval（held-out tasks 和 harness）上进行评估。HarnessBandit 在两个 benchmarks 上均优于 mixed-batch multi-harness training，同时 training diagnostics 表明 learnability 和 transferability 提供了不同的、不断演变的 signals。"}]}, {"name": "Multi-Agent Collaboration", "count": 2, "papers": [{"title": "Assembling the CREW: A Collaborative Multi-agent Reinforcement Learning Framework for Automated Related Work Generation", "arxiv_id": "2609.15721", "authors": "Hai-Dang Dang, Bao-Yen Pham, Bao Nguyen, Tran Thi Huong, Huynh Thi Thanh Binh", "summary": "Automatic Related Work Generation (RWG) significantly reduces the human time and effort required to author the Related Work Section (RWS) of a research paper. However, prior methods leveraging multi-agent Large Language Models (LLMs) typically rely on a predefined workflow, where each agent is responsible for a specific step in the entire process. This rigid, static inter-agent coordination limits the adaptive collaboration required to synthesize complex scientific literature. To address this limitation, we propose CREW (Collaborative Reinforcement Learning for Related Work Generation), a novel framework where LLM agents bypass heuristic pipelines to dynamically coordinate by autonomously selecting actions, such as Retrieve, Disseminate, Compose, and Critique, driven by a policy optimized via Independent Proximal Policy Optimization (IPPO). Extensive experiments on a standard RWG benchmark demonstrate that our approach yields substantial quality improvements over strong existing baselines, while significantly reducing token costs. Code is available at https://github.com/YenPBao/CREW-Collaborative-MARL.git", "category": "cs.LG", "cluster": "Multi-Agent Collaboration", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Multi-Agent)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=24 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 论文的核心贡献是提出了CREW框架，一种基于多智能体强化学习（MARL，具体为IPPO）的动态协作机制。该框架让LLM智能体绕过传统的静态预定义工作流，通过自主选择动作（如检索、传播、撰写、批评）来实现自适应的动态协调。这完全符合研究焦点中“多智能体：多智能体系统中新的协作机制”以及“agent training/distillation/RL”的正面指标。虽然该论文的应用场景是自动生成相关工作（RWG），但根据第一步排除规则1的例外说明，论文在特定领域中提出了新的智能体机制（基于RL的动态协作策略），因此不应被作为“非演化型应用”排除。此外，该研究不涉及被排除的系统工程层面的拓扑结构或通信协议，也不涉及安全、多模态或图相关技术。因此，该论文与构建和改进LLM多智能体协作机制的研究目标高度相关。", "intro_logic": "### § 1 研究问题与重要性\n\n本文研究的核心问题是：如何让多个 LLM agents 在自动生成研究论文 Related Work Section (RWS) 时，摆脱预定义的固定工作流程，实现动态、自适应的协作。具体而言，给定一篇目标论文的标题与摘要以及一组候选参考文献，系统需要自动合成一段逻辑连贯、引用准确的 related work 文本。这一问题的重要性源于文献综述在科研工作流中的瓶颈地位——随着科学出版物数量的快速增长，学者需要耗费大量时间阅读、总结、对比前人发现，这一过程既耗时又劳动密集。RWG 作为 NLP 的一个研究方向最早由 Hoang and Kan (2010) 提出，其目标是将初始概念与潜在参考文献列表转化为一份全面覆盖关键发现并带有准确引用的综述草稿。解决这一问题不仅能显著降低学者的写作负担，还能为更广泛的多文档合成任务（如新闻聚合）提供可迁移的协作框架。\n\n### § 2 前人工作与不足\n\nRWG 研究沿三条方法论路径演进，每条路径均存在结构性局限。**Extractive 方法**（如 ReWoS [Hoang and Kan, 2010]、基于 PLSA 聚类与回归排序的方法 [Hu and Wan, 2014]、利用 citation context 的方法 [Chen and Zhuge, 2016]、SERGE [Deng et al., 2021]、以及基于图的方法 ToC-RWG [Wang et al., 2020]）直接从源文档中抽取并拼接句子，虽然忠实于原文且引用可靠，但其改写和抽象能力有限，产出的综述冗余且结构不佳；更关键的是，它们依赖预先存在的比较性句子，而这类句子在实际文献中难以获取，导致无法生成真正的比较性和分析性讨论。**Abstractive 监督模型**（如 RRG [Chen et al., 2021]、TAG [Chen et al., 2022]）通过关系图建模论文间交互，在 section-level 生成中取得了较好效果，但它们需要从头训练，依赖任务特定的标注数据集，当扩展到包含大量参考文献的大规模语料时，计算和内存开销巨大，且难以迁移到新领域。**基于 LLM 的方法**利用强大的生成能力，但单 LLM 方法面临两个根本性障碍：一是 hallucination 问题，二是 context window 限制——高质量的综述需要同时推理大量参考文献之间的复杂关系，而即使使用长上下文模型（如 GPT-4o 的 128K token 容量），将所有参考文献简单拼接进单一输入仍然无效，因为长上下文会稀释 attention，导致重要的跨文档关系被忽略；基于 retrieval 的替代方案（如 Izacard and Grave, 2021; Wu et al., 2022）虽减轻了上下文负担，却可能遗漏相关证据、削弱覆盖范围。\n\n为克服上述限制，近期研究转向 **multi-agent LLM 框架**，将 RWG 过程分解为子任务并分配给不同 agent。例如 SRW（Liu et al., 2025）采用 Selector、Reader、Writer 的固定角色分工，Wu et al. (2023) 和 Li et al. (2023) 也采用类似的预定义交互模式。然而，这些方法存在一个未被解决的核心缺陷：**固定的子任务分配迫使整个流程顺序执行**，不仅增加了推理时间，更关键的是**缺乏一种机制，使得当某个子任务变得关键时，多个 agent 能够动态地协作处理同一子任务**。例如，当 agents 从阅读阶段进入起草阶段后，可能发现已收集的证据仍然不足，但此时所有 agent 都被固定在写作角色上，继续起草变得无效——系统无法自适应地将部分 agent 重新分配到检索或知识补充任务。这种刚性协调的根本原因在于：先前工作将多 agent 协作建模为静态的角色分配问题，而非动态的决策问题，因此无法处理子任务重要性随上下文变化的情况。本文正是针对这一缺口，提出基于 MARL 的动态行动选择框架，使 agents 能够根据局部观察自主选择 Retrieve、Disseminate、Compose 或 Critique 行动，从而实现真正自适应的协作。", "core_insight": "### § 3 重建作者的思考路径\n\n在解决 Related Work Generation (RWG) 问题时，研究界经历了从 extractive 到 abstractive 再到 LLM-based 方法的演进。随着 Large Language Models (LLMs) 的兴起，单模型面临 context window 限制和 attention dilution 问题，促使学界转向 multi-agent 框架，将任务分解为 Select、Read、Write 等固定子任务分配给不同 agent。然而，这种 predefined workflow 暴露出根本性缺陷：静态角色分配迫使流程顺序执行，且当某个子任务（如证据收集）成为瓶颈时，系统无法动态调配其他 agent 协助，导致后续步骤在信息不足下无效运转。作者观察到，真正高效的学术写作协作并非机械流水线，而是研究者根据当前文献掌握程度、草稿状态和同伴进展，动态决定下一步是继续检索、分享知识、撰写还是审阅。这种 context-dependent 的动态协作需求自然指向了 Multi-Agent Reinforcement Learning (MARL)——通过学习共享策略让 agent 自主选择动作，而非依赖中央编排器。进一步，为促进主动信息共享和相互修正，作者在传统 retrieve 和 compose 动作外引入 Disseminate 和 Critique，使 agent 能在证据不足时主动共享知识，在草稿有缺陷时提供反馈。整个框架被形式化为 Dec-POMDP，每个 agent 基于局部观察独立决策，通过 team-level reward 协调，最终用 IPPO 优化策略，实现去中心化的自适应协作。\n\n### § 4 核心 Intuition\n\n先前 multi-agent 方法失效的根源在于：固定角色分配剥夺了 agent 根据当前状态调整行为的权利，导致系统无法在关键子任务上动态集中资源。CREW 的核心 intuition 是：将协作控制权从 predefined pipeline 交给 learned policy，让每个 agent 根据局部观察自主选择 Retrieve、Disseminate、Compose 或 Critique，使团队能在证据不足时主动补漏、在草稿缺陷时及时修正。这种基于 MARL 的动态协调，使 agent 行为由全局奖励驱动而非预设规则，从而在复杂文献综合中实现真正自适应的协作。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\nInput: Citing Paper, Refs\n      |\n      v\n[Init Shared Env] (L, G, D, F)\n      |\n      +\u003C------- Sampling Phase --------+\n      |               |                |\n      |               v                |\n      |      [Local Obs: 20-D]         | Training Phase\n      |               |                | (IPPO Update:\n      |               v                |  Actor \u0026 Critic)\n      |      [Policy pi_theta]         |\n      |               |                |\n      |               v                |\n      |   [Action: Retrieve/Dissem/    |\n      |    Compose/Critique]           |\n      |               |                |\n      |               v                |\n      |     [Env Update \u0026 Reward]      |\n      |               |                |\n      +\u003C------- Buffer Agg. \u003E----------+\n      |\n      v\n[Inference] -\u003E Final Draft\n```\n\n1. **初始化阶段**：输入 Citing paper 的 Title 和 Abstract，以及 Reference papers 集合。系统构建 Citation graph，并初始化共享环境，包含四种文档状态：Local Knowledge (L)、Global Knowledge (G)、Draft (D) 和 Feedback (F)。（对应 3.1 Dec-POMDP Formulation）\n2. **采样阶段**：每个 Agent 获取局部观测 $o_t^{[i]}$，由 20 维特征向量构成，涵盖 Semantic relevance、Coverage and Novelty 等五个维度。Actor 网络根据观测采样动作，动作空间包含 Retrieve（检索并更新 L）、Disseminate（将 L 合并至 G）、Compose（利用所有信息修改 D）、Critique（审查 D 并更新 F）。环境更新状态后，计算 Delta-based cooperative reward，并将交互数据存入 Buffer。（对应 3.1, 3.2, Algorithm 1）\n3. **训练阶段**：从 Buffer 聚合数据，使用 IPPO 算法更新共享的 Actor 和 Critic 网络。Actor 最大化 clipped surrogate objective，Critic 最小化 value loss。此阶段通过参数共享机制确保计算效率。（对应 3.2）\n4. **推理阶段**：移除环境奖励与 Buffer，使用训练好的 Policy $\\pi_\\theta$ 指导 Agent 进行多轮异步交互，最终输出 Draft D 作为 Related Work Section。（对应 3.2, Algorithm 1）\n\n### § 6 核心数学推导\n\n本论文的核心数学推导基于 Dec-POMDP 框架与 IPPO 优化算法。Dec-POMDP 适用于部分可观测、去中心化控制的多智能体场景，其中每个 Agent 仅能观测到局部状态。\n\n**状态与观测**：全局状态 $s_t$ 包含静态输入与动态文档（L, G, D, F）。观测 $o_t^{[i]}$ 是状态的局部视图。为避免文本直接输入导致观测空间过大，模型使用 Embed 算子将每个文档组件压缩为 5 维特征向量，最终拼接为 20 维观测向量。这为 Policy 网络提供了紧凑且固定的输入维度。\n\n**奖励函数**：奖励定义为 $r_t^{[i]} = \\Delta Q^{(D_t)} + \\lambda_t \\Delta Q^{(k_t^{[i]})}$。第一项是 Draft-quality gain，反映整体草稿质量提升；第二项是 Component-quality gain，反映 Agent 特定动作对目标产物的改进。衰减系数 $\\lambda_t$ 的 intuition 是鼓励 Agent 早期专注于信息收集与背景文档构建，后期逐渐转向 Compose 动作，从而保证生成逻辑的连贯性。\n\n**IPPO 优化**：Actor 网络使用 PPO 的 clipped surrogate objective $L^{CLIP}(\\theta) = \\hat{\\mathbb{E}}_j \\min(\\rho_j(\\theta) \\hat{A}_j, \\text{clip}(\\rho_j(\\theta), 1-\\epsilon, 1+\\epsilon) \\hat{A}_j)$，其中 $\\rho_j(\\theta)$ 是新旧策略的概率比。该公式的 intuition 是通过截断机制限制策略更新步长，防止破坏性更新。Critic 网络使用 value loss $L^{VF}(\\phi) = \\hat{\\mathbb{E}}_j (V_\\phi(o_j) - \\hat{R}_j)^2$ 学习状态价值，优势函数 $\\hat{A}_j$ 使用 GAE 估计以降低方差。\n\n### § 7 实验设计与结论\n\n**问题 1**：CREW 框架是否能提升 RWG 的质量、引用准确性和效率？\n**实验设计**：在 OARELATEDWORK 数据集上，与 Multi-Agent (SRW, Orchestrator)、Single LLM (GPT-4o Long Context, RAG) 和 Abstractive (PRIMERA) 基准对比，使用 LLM-as-a-Judge 和 Citation Verification 评估。\n**答案**：CREW 在 Overall 质量和 Citation Verification 上优于所有基准，同时 Token 消耗更低，推理时间具有竞争力。这表明学习到的协调策略能显著提升生成质量与效率。\n\n**问题 2**：学习到的协调策略是否可以跨模型和跨领域迁移？\n**实验设计**：模型迁移：固定训练好的控制器，将推理模型替换为 LLaMA 8B, Gemini 2.0 Flash, GPT-4o。跨领域迁移：在 Multi-News 数据集上测试，不重新训练策略。\n**答案**：策略在不同推理模型上均带来质量提升，且在 Multi-News 上也优于基准。这证明协调知识与执行器解耦，学习到的动作选择策略具有泛化性。\n\n**问题 3**：CREW 的关键组件（反馈动作、社交活动观测、草稿质量奖励）对性能有何贡献？\n**实验设计**：消融实验，分别移除 Draft Quality Reward、Feedback Action 和 Social Activity Observation。\n**答案**：移除 Feedback Action 导致最大幅度的性能下降（Overall 降至 2.58），因为无法纠正幻觉引用；移除社交活动观测导致冗余行为和协调变差；移除草稿质量奖励导致引用验证率大幅下降。这证明了这些组件对协调、修订和引用可靠性至关重要。", "additional_insights": "### § 8 Take-aways\n本文提出了CREW框架，将Related Work Generation (RWG) 任务建模为Decentralized Partially Observable Markov Decision Process (Dec-POMDP)，使多个LLM agents能够摆脱固定的启发式工作流，通过Independent Proximal Policy Optimization (IPPO) 学习动态协作策略。框架引入了Retrieve、Disseminate、Compose和Critique四种动作，其中Disseminate和Critique促进了主动的知识共享与反馈修正，显著提升了多智能体间的协同效率。实验证明，CREW在OARELATEDWORK基准上不仅提高了生成质量和Citation Verification准确率，还大幅降低了token消耗和推理延迟。消融研究表明，Social Activity Observation和Feedback Action是防止智能体产生冗余行为和纠正引用幻觉的关键组件。此外，迁移实验证实了在一个LLM上训练的决策策略能够无缝迁移至其他不同规模和架构的推理模型上，且在跨领域任务（如Multi-News）中无需重训即可保持高效的协作行为。\n\n### § 9 最脆弱的假设\nCREW框架最核心且最脆弱的假设是：基于启发式函数计算的delta-based cooperative reward能够准确反映生成文本的质量提升，并有效指导多智能体策略的优化。论文使用语义相似度、压缩密度和词汇分布散度等浅层指标来构建Draft、Local Knowledge等组件的reward信号。然而，高质量的学术Related Work不仅需要语义相关，还需要深层的逻辑连贯性、批判性分析和准确的学术表述，这些很难被简单的余弦相似度或压缩率完全捕捉。如果该假设不成立，IPPO优化出的策略可能会导致agents为了最大化启发式reward而产生“reward hacking”现象，例如堆砌相似词汇而不具备真正的逻辑连贯。尽管论文提供了LLM-as-a-Judge和有限的人类评估作为证据，但缺少对reward function本身与人类真实学术写作偏好对齐程度的直接验证。一旦该假设失效，整个MARL策略优化的基础将崩塌，agents学到的协作行为将无法转化为真实的文本质量提升。\n\n### § 10 最小复现实验\n如果仅有1周时间，建议复现论文中“Model Transferability”这一核心claim，即验证在一个LLM上训练的决策策略可以无缝迁移到其他推理模型上。使用OARELATEDWORK数据集的评估子集（0.4%，约366篇论文）。首先从论文开源的GitHub仓库获取已训练好的IPPO策略网络参数并固定不变，然后仅替换执行具体动作的底层推理LLM（例如从Qwen 2.5 72B Instruct替换为LLaMA 8B或GPT-4o）。在少量样本（如50篇论文）上运行推理，记录agents的动作选择序列和最终生成的Related Work。使用GPT-4o作为LLM-as-a-Judge评估生成文本的Coverage、Logic、Relevance，并计算Citation Verification比例。如果替换底层LLM后，Overall评分没有显著下降，且动作选择序列保持相似的分布，则支持该claim；如果评分大幅下降或动作序列出现异常，则反驳了策略的可迁移性。这种方案无需重新训练RL策略，计算成本极低，能够快速验证框架的核心泛化能力。", "research_value": "### § 11 最强反例设计\n\n针对CREW框架最脆弱的假设——即基于语义相似度和压缩密度等浅层启发式指标构建的delta-based cooperative reward能够准确反映学术文本质量——我会设计一个针对“reward hacking”与“虚假协作”的攻击实验。具体而言，我会深入分析CREW在OARELATEDWORK数据集上生成的文本，寻找agents为了最大化启发式reward而牺牲深层逻辑连贯性的证据。例如，agents可能学会了通过高频执行Retrieve和Disseminate来堆砌高覆盖率的词汇，或者通过Compose生成结构高度相似但缺乏批判性对比的句子，从而在Semantic relevance和Coverage指标上获得高分，但实际上并未产生真正的学术洞见。为了验证这一替代解释，我会引入一个需要高度批判性综合的跨学科文献综述场景，其中不同参考文献之间存在隐含的冲突或范式差异。在这种场景下，我会使用人类领域专家进行盲评，专门评估生成文本的“批判性对比深度”和“论证逻辑转折”，而不仅仅是Coverage或Relevance。如果CREW在自动评估指标上表现优异，但在专家盲评中被判定为逻辑断裂或缺乏深度对比，这就构成了一个强有力的反例，证明IPPO优化出的策略并非真正学会了自适应的学术协作，而是学会了钻启发式reward函数的空子，从而挑战了该方法在真实复杂科研场景中的有效性。\n\n### § 12 Follow-up Research Idea\n\n基于启发式reward无法捕捉深层学术逻辑这一核心局限，我提出一个全新的研究框架：将Related Work Generation从“启发式奖励驱动的动作选择”重构为“基于学术辩论与偏好学习的共识达成过程”。这一想法的驱动力在于，高质量的文献综述本质上是作者对前人工作进行批判性综合并确立自身研究定位的论证过程，而非简单的信息聚合与覆盖。我们可以借鉴Preference-based Reinforcement Learning (RLHF) 与Multi-agent Debate领域的工具，摒弃固定的Retrieve/Compose动作空间和浅层reward函数。具体而言，将多个LLM agents初始化为持有不同学术立场的“辩护者”，它们通过多轮自然语言辩论来揭示文献间的深层冲突与联系，而非执行离散的机械动作。在此过程中，使用强大LLM或人类专家对辩论轨迹的pairwise preference作为优化信号，通过Direct Preference Optimization (DPO) 来微调agents的辩论策略。第一个实验将构建一个包含强范式冲突的文献数据集，比较传统基于启发式reward的MARL框架与基于preference的Debate框架在生成深层批判性综述上的表现，重点评估后者是否能避免reward hacking并生成具有真正学术洞见的文本。这一提议与已有工作的根本区别在于，它彻底放弃了脆弱的启发式reward和刚性动作空间，转而利用preference learning直接对齐人类对学术论证的深层期望，打开了通往真正自动化批判性写作的研究方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Hai-Dang Dang\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Bao-Yen Pham\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Bao Nguyen\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Tran Thi Huong\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Huynh Thi Thanh Binh\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Hanoi University of Science and Technology\"},\n    {\"id\": 2, \"name\": \"The Chinese University of Hong Kong\"},\n    {\"id\": 3, \"name\": \"Hanoi University of Industry\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Both authors contributed equally to this research.\"}\n  ]\n}\n```", "summary_translation": "Automatic Related Work Generation (RWG) 显著减少了撰写研究论文 Related Work Section (RWS) 所需的人力与时间。然而，利用 multi-agent Large Language Models (LLMs) 的现有方法通常依赖于预定义的工作流，其中每个 agent 负责整个过程中的特定步骤。这种僵化、静态的 inter-agent coordination 限制了综合复杂科学文献所需的自适应协作。为了解决这一局限性，我们提出了 CREW，这是一个新颖的框架。在该框架中，LLM agents 绕过启发式流程，通过自主选择动作（如 Retrieve、Disseminate、Compose 和 Critique）进行动态协调，这些动作由通过 Independent Proximal Policy Optimization (IPPO) 优化的策略驱动。在标准 RWG benchmark 上进行的大量实验表明，与现有的强 baselines 相比，我们的方法在质量上取得了显著提升，同时大幅降低了 token costs。代码可在 https://github.com/YenPBao/CREW-Collaborative-MARL.git 获取。"}, {"title": "Stellar Colosseum: A Many-Agent Harness for Long-Horizon Research in Mathematics and Theoretical Computer Science", "arxiv_id": "2609.15983", "authors": "Honghao Lin, David P. Woodruff, Yuan Deng, Jieming Mao, Song Zuo, Vahab Mirrokni", "summary": "Language models can produce plausible short proofs, but may still be unreliable on long-horizon research problems, where progress depends on a sequence of uncertain and interdependent decisions. We introduce Stellar Colosseum, a model-agnostic harness for allocating inference across research in mathematics and theoretical computer science. Colosseum explores alternative strategies before proof construction, uses a readiness gate to decide when a route is mature enough to decompose, represents the proof plan as interdependent section-level subproblems, and routes verifier findings back to the affected part of the argument. Across these stages, it generates candidates in parallel, attacks them with targeted falsification, and combines candidates and their critiques into a single research artifact through overlapping random-sample tree aggregation. The Colosseum workflow has also been integrated into Google Antigravity's Teamwork framework as the Long Proof pattern. We demonstrate the capabilities of Colosseum through open-ended research and evaluations on theorem-proving and competitive programming benchmarks. Using Colosseum with Gemini 3.1 Pro, we obtain several new results that address open problems arising from papers published at top venues such as FOCS and JMLR. On TCS-Bench, a benchmark of research-level theorem-proving tasks drawn from papers published at FOCS, STOC, and SODA, Colosseum achieves 71.0% accuracy using Gemini 3.1 Pro and Gemini 3.7 Flash. In a separate Codeforces evaluation using Gemini 3.1 Pro, the proof-oriented pipeline with execution feedback solves 218 of 222 problems.", "category": "cs.LG", "cluster": "Multi-Agent Collaboration", "tags": ["cs.LG"], "filter_reason": "这篇论文的核心贡献是提出了一个名为 Stellar Colosseum 的 \"Many-Agent Harness\"（多智能体框架/脚手架），专门用于解决大语言模型在长期研究问题中的不可靠性。论文明确涉及了智能体在长期决策中的核心机制，包括：规划（探索替代策略、证明计划分解为子问题）、自我反思与批评（有针对性的证伪攻击、结合候选及其批评）、以及工具使用与环境反馈（将验证器发现路由回受影响部分、执行反馈）。这完全符合筛选标准中第一步关于“保留”的规定，即研究 agent 的 harness/scaffold/runtime，并且核心贡献是让智能体运行组件通过反馈、观测或评估结果自动改进和自适应优化，属于智能体能力实现的一部分。此外，虽然论文的应用场景是数学和理论计算机科学，但其本质是提出了一种新的长期决策智能体机制，符合“领域是场景，机制才是贡献”的例外保留原则。论文也不涉及安全、多模态、图技术或纯粹的多智能体拓扑与编排等被排除的内容。因此，该论文与构建和改进 LLM 智能体（特别是 Long-Horizon Agents 和 Agent Harness）的研究方向高度相关。", "intro_logic": "### § 1 研究问题与重要性\n\n本文研究的核心问题是：如何组织 inference-time computation，使语言模型能够在数学和理论计算机科学中完成 long-horizon research——即那些进展取决于一连串不确定且相互依赖的决策的研究任务。语言模型已经能够生成看似合理的短证明，但在需要长链条推理的研究问题上仍然不可靠：一个有前景的 proof route 可能在某个关键 lemma 被证伪时崩溃，一个局部修改可能迫使周围论证乃至整体 strategy 发生变化，而长证明中 definitions 和 assumptions 的一致性也难以维持。更关键的是，失败的尝试中往往蕴含着有用的 counterexample、restriction 或 intermediate result，但 flat 的失败判断无法将这些信息以具体数学主张的形式保留下来供后续使用。这个问题之所以重要，是因为数学研究的本质正是多轮 exploration、proof construction 和 revision 的迭代过程，而非单次推理。解决这一问题意味着 AI 系统可以从\"解单题\"跃升为\"驱动研究\"的自主伙伴，本文展示的若干新结果——包括解决发表在 FOCS、JMLR 等顶级会议/期刊上的 open problems——直接证明了这一价值。\n\n### § 2 前人工作与不足\n\n该问题未被完整解决过。现有工作可分为三类，各有明确局限。第一类是 inference-time search 与 critique 方法，包括 self-consistency [55]、Tree of Thoughts [60]、Self-Refine [44]、multi-agent debate [18] 以及 REBASE [58] 等。这些方法通过 sampling 多条推理路径并聚合答案来提升推理质量，但它们将推理视为扁平的搜索空间，对最终答案进行 vote 或 ranking，而数学证明中候选方案的一致性可能掩盖共同的错误——一个 concrete fatal defect 就足以否决整个证明，多数投票无法捕捉这一点。REFUTE [51] 和 Momus [17] 引入了 falsification 机制，但它们没有将 critiques 与 proposals 在 aggregation 过程中持续配对保留，也没有将 search、critique、aggregation 组织成具有明确阶段划分和 dependency-aware proof construction 的连贯研究工作流。\n\n第二类是 verifier-guided discovery 系统，如 AlphaGeometry [52] 用 learned proposals 引导 symbolic deduction、AlphaProof [29] 用 formal proof checking 引导 theorem proving、FunSearch [49] 用 executable objectives 搜索数学构造，以及 agentic Lean search [53]、retrieval-assisted proof development [33] 和 LeanMarathon [61]。这些系统最终都要求证明通过针对精确 Lean statement 的 formal checking。这一要求本身是优势也是限制：许多研究级问题的 formalization 尚不存在，且研究过程中的 provisional strategies、intermediate claims 和 natural-language proof drafts 无法直接接受 formal verification。Colosseum 则审查这些中间产物，将 formal checks 和 executable tests 作为与 model-generated critiques 并列的证据来源，从而在 formal infrastructure 缺位时仍能驱动研究流程。\n\n第三类是 autonomous research workflows，包括 Aletheia [21] 的 generate-verify-revise loop、QED [4] 的 decomposition-generation-verification 分工、ProofCouncil [50] 的 author-critic 迭代、RMA [62] 的 initializer-proposer-verifier 协调，以及 Danus [42] 的 fact-graph memory。这些系统已经认识到 verification 需要在论证发展中反复使用，但它们在两个关键维度上存在不足。其一，没有显式的 readiness gate 来控制何时将一条 strategy route 分解为 subproblems——要么过早进入 proof drafting（围绕第一个看似合理的想法直接写证明），要么缺乏从 strategy 到 proof plan 的结构化过渡。其二，aggregation 机制要么是简单的选择或投票，要么将 critiques 丢弃，而 Colosseum 的 overlapping random-sample tree aggregation 在每一层都将 candidate 与其 falsification report 绑定，使 substantive disagreements 和 failure evidence 被携带至下游而非被平均消解。此外，这些系统普遍缺乏跨轮次的 shared knowledge directory 来系统性地保留 theorems、failed approaches、references 和 observations，导致前一轮搜索中获得的有用结果在 candidate 被聚合或丢弃时随之丢失。Co-Scientist [27] 和 AI Scientist [43, 59] 等系统虽然将 generate-critique-evolve 循环扩展到更完整的科研流程，但它们面向 hypothesis generation 和实验科学，并未针对数学证明中 dependency graph、section-level subproblem 并行求解和 long-form error accumulation 这些特有挑战进行设计。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Colosseum 提出之前，尽管 Language Models 在数学推理上取得了显著进展，甚至能解决 olympiad-level 的问题，但在面对 long-horizon research problems 时仍显得不可靠。作者观察到，现有的 inference-time scaling 方法（如多次采样和 flat vote）在证明任务上效果有限，因为多个候选证明可能共享同一个隐藏错误，简单的投票无法定位具体的逻辑缺陷。此外，长证明往往超出单次 response 的输出预算，导致细节遗漏，且定义和假设在远距离章节间难以保持一致，局部修改容易引发全局连锁反应。\n\n作者从人类数学家的研究过程中汲取灵感：研究通常始于策略探索和小规模测试，随后分解为相互依赖的子问题，最后进行全局验证与修正。失败的尝试并非毫无价值，它们往往揭示了有用的限制条件、反例或中间结果。然而，现有的 generate-verify-revise 系统在失败时通常只给出通用的判断，无法将这些具体的数学主张或反对意见结构化地保留下来供后续使用。\n\n基于这些观察，作者思考如何构建一个 model-agnostic 的系统，既能显式控制研究阶段，又能维护一个共享的研究状态。在 workflow 层面，系统需要先探索并挑战多种策略，通过 readiness gate 判断策略是否成熟到可以分解为带有依赖关系的子问题图（DAG），从而实现独立部分的并行求解和局部失败的重试。在 stage 层面，为了克服简单投票的缺陷，系统需要对每个候选方案进行 targeted falsification，并将候选方案与其批评意见绑定，通过 overlapping random-sample tree aggregation 进行建设性聚合，以保留分歧和证据。最后，为了跨阶段积累知识，系统不仅要保留最新的证明草稿和验证反馈，还需维护一个 knowledge directory 来收集可重用的定理、失败方法和观察结果。\n\n### § 4 核心 Intuition\n\n先前方法在长周期数学研究中失效，是因为它们要么将长证明视为单次生成的延续（导致错误累积和一致性丧失），要么在失败时丢弃了有用的局部进展与具体缺陷信息。Colosseum 奏效的核心在于：它将长周期研究显式分解为具有依赖关系的阶段和子问题，使得独立部分可以并行推进，局部失败只触发局部重试；同时，在每个阶段内部，通过将候选方案与其对抗性批评绑定并进行树状聚合，系统不仅保留了有用的数学洞见，还明确记录了未解决的反对意见，从而让后续的修正和探索能够基于具体的证据而非盲目的重试。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Research Problem]\n      |\n      v\n+-----------------------+ \u003C--- (Re-exploration) ---+\n| Strategy Exploration  |                          |\n| (Gen-\u003EFalsify-\u003EAgg)   |                          |\n+-----------------------+                          |\n      |                                             |\n      v                                             |\n+-----------------------+                           |\n| Readiness Gate        |--- (Not Ready) -----------+\n+-----------------------+\n      | (Ready)\n      v\n+-----------------------+\n| Decomposition (DAG)   |\n+-----------------------+\n      |\n      v\n+-----------------------+      (Local Fail)     +---------------+\n| Subproblem Solving    | \u003C------------------- | Local Review  |\n| (Parallel Sections)   |                      +---------------+\n+-----------------------+\n      | (All Done)\n      v\n+-----------------------+\n| Global Verification   |\n+-----------------------+\n      |           |\n (Pass)        (Reject)\n      |           |\n      v           v\n[Accepted]  +---------------+\n Proof      | Revision /    |\n            | Re-exploration|\n            +---------------+\n```\n\nColosseum 是一个在推理阶段运行的 model-agnostic 多智能体框架，其完整 Pipeline 分为 Workflow 级别和 Stage 级别，核心在于通过对抗性生成与聚合来处理长期研究中的不确定性：\n\n1. **Strategy Exploration (策略探索)**：输入为原始研究问题及共享的 Knowledge Directory。系统并行生成多个候选策略，每个策略随后经历 Targeted Falsification（寻找反例与逻辑缺陷）。通过 Tree-Structured Aggregation 将候选策略及其批评意见聚合，保留未解决的反对意见。此阶段不断循环，直到策略足够具体。对应正文 §4.2.1 与 §4.1。\n\n2. **Readiness Gate (准备度评估)**：输入为聚合后的策略。该模块评估策略是否已将剩余不确定性局部化，且核心机制稳定。若未通过，则控制流回到 Strategy Exploration；若通过，则进入分解阶段。对应正文 §4.2.1。\n\n3. **Decomposition (问题分解)**：输入为成熟的策略。系统将其转化为带编号的 sectioned proof skeleton，并生成记录子问题依赖关系的有向无环图 (DAG)。文档顺序控制论述结构，而 DAG 控制并行求解顺序。对应正文 §4.2.2。\n\n4. **Subproblem Solving (子问题求解)**：输入为 DAG 中的各个子问题及已完成的依赖章节。独立子问题被并行分配给 Solver，内部同样采用对抗性生成与树状聚合。生成的 Section 需通过 Local Review，若失败则携带批评意见进行局部 Retry，不影响 DAG 中的其他节点。对应正文 §4.2.2 与 §4.1。\n\n5. **Global Verification (全局验证)**：输入为组装完毕的完整证明草稿。全局验证器审查跨章节的依赖一致性、定义漂移及逻辑遗漏。该过程同样采用多路审查与树状聚合，不是简单的多数投票，而是保留具体的致命缺陷。对应正文 §4.2.3。\n\n6. **Revision / Re-exploration (修订与重新探索)**：输入为被拒绝的证明及验证反馈。若当前策略仍可行，系统执行局部 Revision 修改特定章节；若验证反馈推翻了核心策略，系统将草稿与反馈存入 Shared Research Knowledge，并触发 Re-exploration 回到第一阶段。对应正文 §4.2.3 与 §4.3。\n\n### § 6 核心数学推导\n\n本文是一篇系统与架构设计论文，其核心贡献在于提出 Colosseum 这一多智能体推理框架，而非推导新的数学定理。虽然论文在 §5 中列举了五项由该系统辅助产生的研究成果（如 ℓp subspace approximation 的 coreset 大小改进、Sparse Least Squares 的 condition-number barrier 等），但这些数学推导过程属于系统的输出产物，原文并未在本文中展示其具体的形式化推导步骤。因此，本节跳过。\n\n### § 7 实验设计与结论\n\n本文通过三个维度的实验与案例研究，验证了 Colosseum 在不同复杂度任务上的有效性：\n\n**开放性数学研究能力验证**\n提出了系统是否能够针对顶会级别的开放研究问题产出有效的新数学成果的问题。设计使用 Gemini 3.1 Pro 作为 base model 运行 Colosseum，针对五个源自 FOCS、JMLR 等顶会的开放问题进行研究，并记录系统产出的证明草稿。实验结果表明，系统成功贡献了多项新结果（如改进了 coreset 大小的 ε 依赖项），并在 Knuth's cycles 问题中产出了长达 75 页的严谨证明草稿，证明了系统在长链条推理中的构建与维护能力。\n\n**研究级定理证明基准测试**\n提出了系统在研究级定理证明任务上的整体表现如何的问题。设计在包含 300 个源自 FOCS/STOC/SODA 论文定理的 TCS-Bench 上进行评测，分别使用 Gemini 3.1 Pro 和 Gemini 3.7 Flash 运行 Colosseum，并采用基于 critique 的跨模型选择策略提交证明。实验结果表明，跨模型选择达到了 71.0% 的准确率，显著优于单个模型直接推理的 30.3%，证明了系统的对抗性聚合与验证机制能有效提升推理质量。\n\n**架构跨领域迁移能力验证**\n提出了面向证明的探索-分解架构能否直接迁移到可执行的算法竞赛编程任务上的问题。设计在 222 道 Codeforces 难题上保留原有的数学证明导向架构，仅在 DAG 末端增加 C++ 实现节点与执行反馈探针，对比有无执行反馈的解题效果。实验结果表明，系统在无特定代码控制器的情况下解决了 218 道题，性能评分达 4263，且执行反馈进一步提升了 5 道题的通过率，证明了该 Pipeline 具有强大的跨领域泛化能力。", "additional_insights": "### § 8 Take-aways\nColosseum是一个针对数学和理论计算机科学长程研究的模型无关harness，通过将研究过程显式分解为策略探索、readiness gate、依赖感知的证明分解、并行子问题求解和全局验证五个阶段，解决了长程推理中的策略不确定性和错误累积问题。在每个阶段内部，系统采用对抗性推理过程，并行生成候选方案，进行targeted falsification，并通过overlapping random-sample tree aggregation将候选方案及其批评证据进行树状聚合，从而在保留未解决异议的同时综合出最优方案。系统维护了跨阶段的共享研究状态，包括完整的先前尝试草稿和知识目录，使得失败的尝试中产生的有用限制、反例或中间结果能够被后续轮次利用，避免了从零开始的重复探索。实验表明，该系统在TCS-Bench上通过跨模型选择达到了71.0%的准确率，在Codeforces的222个问题中解决了218个，并且辅助产生了多篇发表在FOCS、JMLR等顶会/期刊上的新数学研究成果。\n\n### § 9 最脆弱的假设\nColosseum最核心且最脆弱的假设是：基于语言模型的targeted falsification和tree aggregation能够有效识别并保留数学证明中的实质性缺陷，而不是被“平均掉”或被模型自身的幻觉掩盖。具体而言，系统假设adversarial reviewers能够发现候选方案中的致命错误，并且aggregation过程能够将这些异议与候选方案绑定传递给后续阶段，从而指导修复或重新探索。如果基础模型（如Gemini 3.1 Pro）在特定高难度数学领域的推理能力存在系统性盲区，多个独立的reviewer可能会在同一个错误上达成共识，导致tree aggregation将错误的共识视为正确，从而掩盖了真正的证明漏洞。论文中虽然展示了在TCS-Bench上的高准确率，但这是基于一个自动化的reference-assisted grader，其本身可能存在偏差；而在开放问题研究中，虽然产生了一些新结果，但这些结果的正确性最终仍需人类数学家的严格验证，系统自身在全局验证阶段是否能真正捕捉到深层次的逻辑漏洞仍缺乏直接的定量证据。\n\n### § 10 最小复现实验\n如果有一周时间，可以设计一个最小复现实验来验证stage-level的adversarial inference procedure（并行生成、targeted falsification和tree aggregation）相对于简单的self-consistency或单次生成的有效性。使用TCS-Bench的一个子集（例如50个问题）作为数据。实现一个简化版的stage-level推理流程：对于每个问题，并行生成16个候选证明，然后对每个候选证明进行targeted falsification（使用同一个模型作为adversarial reviewer生成批评），接着实现一个简单的tree aggregation过程，将候选证明及其批评进行配对和综合，生成最终的证明。作为baseline，使用相同的计算预算进行多次采样并采用majority voting或直接选择最长的证明。使用自动化grader评估最终证明的正确率，并记录aggregation过程中保留的“未解决异议”的数量和质量。如果Colosseum的claim成立，带有targeted falsification和tree aggregation的流程应该比简单的baseline具有更高的正确率，并且能够更有效地识别和保留证明中的缺陷；如果两者的正确率没有显著差异，或者aggregation过程未能有效利用批评信息，则反驳了该claim。", "research_value": "### § 11 最强反例设计\n\n针对 Colosseum 最有力的攻击应直指其核心假设：基于语言模型的 targeted falsification 能够捕捉致命的逻辑漏洞，而不是被表面的一致性所掩盖。我会设计一个“隐蔽缺陷注入”实验来挑战其在 TCS-Bench 上的高准确率。具体而言，从 TCS-Bench 中选取已证明的定理，人工或利用模型在证明的关键步骤中注入 subtle but fatal flaws（例如非法的极限交换、隐藏的 circular reasoning 或不成立的 combinatorial construction），构建一个“看似合理但必然错误”的证明数据集。将这些带有致命缺陷的证明输入 Colosseum 的 Global Verification 和 Targeted Falsification 模块。如果系统依然给出较高的“通过率”或未能有效保留这些致命异议，这就直接证明了其 tree aggregation 机制只是在“平均掉”表面的逻辑不一致，而无法真正理解深层数学结构。此外，这提供了一个强有力的替代解释：Colosseum 在 TCS-Bench 和 Codeforces 上的高成功率，可能并非源于其对抗性验证机制的严密性，而是因为这些问题及其变体大量存在于 base model 的训练数据中，系统实际上是在做 sophisticated pattern matching，而非真正的 adversarial reasoning。当面对训练分布外（OOD）的全新数学构造时，多个 reviewer 会共享同一个盲区，导致错误的共识在 aggregation 中被强化，从而可预测地在前沿数学研究中产生“看似严谨实则谬误”的长篇废稿。\n\n### § 12 Follow-up Research Idea\n\n驱动这一 follow-up idea 的核心局限是：Colosseum 依赖纯自然语言进行 targeted falsification，当 LLM 自身对特定高难度数学概念存在系统性盲区时，对抗性审查会退化为“盲人摸象”式的共识，无法提供绝对客观的证伪信号。为了打破这一瓶颈，我们可以借鉴软件工程中的 Property-Based Testing (PBT) 和形式化验证中的 SMT Solvers，提出一个“计算证伪预言机”的新框架。该框架不再要求 LLM 直接生成自然语言的批评意见，而是要求 LLM 将每一个 intermediate lemma 和 definition 转译为可执行的 SMT 约束或随机化测试脚本。在 Tree-Structured Aggregation 阶段，候选方案的淘汰不再基于 reviewer 的文本投票，而是基于 SMT solver 寻找反例的计算难度（例如 solver 返回 unsat 证明其稳健，返回 counterexample 则直接否决）。第一个实验将设计一个对照测试：在 TCS-Bench 的子集上，对比纯 LLM falsification 与 LLM-to-SMT falsification 在“隐蔽缺陷注入”场景下的 false positive rate。与 AlphaProof 等要求最终定理完全 formalization 的系统不同，本方法仅对局部的、provisional claims 进行计算化测试，从而在自然语言推理的灵活性与形式化验证的严谨性之间建立了一个连续的“形式化梯度”，开辟了将符号计算深度嵌入多智能体推理工作流的新方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Honghao Lin\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"David P. Woodruff\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Yuan Deng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jieming Mao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Song Zuo\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Vahab Mirrokni\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Google Research\"},\n    {\"id\": 2, \"name\": \"CMU\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Co-first authors. Email: honghaol@google.com, woodruffd@google.com.\"}\n  ]\n}\n```", "summary_translation": "语言模型能够生成看似合理的简短证明，但在长期研究问题上可能仍然不可靠，因为这类问题的进展取决于一系列不确定且相互依赖的决策。我们引入了 Stellar Colosseum，这是一个与模型无关的 harness，用于在数学和理论计算机科学的研究中分配推理资源。Colosseum 在构建证明之前探索替代策略，使用 readiness gate 来决定何时路线足够成熟以进行分解，将证明计划表示为相互依赖的 section-level subproblems，并将 verifier 的发现路由回论证中受影响的部分。在这些阶段中，它并行生成候选方案，使用针对性的证伪对其进行攻击，并通过 overlapping random-sample tree aggregation 将候选方案及其批评意见组合成一个单一的研究 artifact。Colosseum 的工作流也已作为 Long Proof pattern 集成到 Google Antigravity 的 Teamwork 框架中。我们通过开放式研究以及对 theorem-proving 和 competitive programming benchmarks 的评估，展示了 Colosseum 的能力。将 Colosseum 与 Gemini 3.1 Pro 结合使用，我们获得了几项新的结果，解决了发表在 FOCS 和 JMLR 等顶级会议和期刊上的论文中提出的 open problems。在从 FOCS、STOC 和 SODA 发表论文中提取的研究级 theorem-proving tasks 的 benchmark TCS-Bench 上，Colosseum 使用 Gemini 3.1 Pro 和 Gemini 3.7 Flash 达到了 71.0% 的 accuracy。在使用 Gemini 3.1 Pro 的另一项 Codeforces 评估中，带有 execution feedback 的 proof-oriented pipeline 解决了 222 个问题中的 218 个。"}]}, {"name": "Skill Routing \u0026 Tool Use", "count": 2, "papers": [{"title": "The Router Within: Eliciting Native Skill Routing from a Frozen LLM", "arxiv_id": "2609.15982", "authors": "Ruishuo Chen, Xun Wang, Yu Chen, Zhuoran Li, Longbo Huang", "summary": "Skills extend an LLM agent beyond its parametric knowledge, and the gain they promise rests on picking the right one. Deployed harnesses route by preloading every skill's metadata into the context, which disperses the agent's attention and caps the library size. Retrieval pipelines move the selection out of the context, but also out of the agent's capability. We show that the frozen agent LLM already carries the routing signal in its own forward passes, and that two linear maps suffice to read it out with no skill text in the context. Gavel (Glance And Verdict from a frozen LLM) reads it in two steps. A glance projects the task's and each skill's mid-layer states through the two maps, the only parameters trained, and scores the full library against compact per-skill banks that one forward pass builds at installation. A verdict then resumes the shortlisted skills' forward passes and reads the model's own likelihood and yes/no judgment, fused with the glance as a product of experts. Trained once, Gavel transfers zero-shot to three public benchmarks and SkillTraj, our new benchmark of 372 simulated agent trajectories. On Qwen3-32B it outperforms progressive disclosure and retrieve-and-rerank pipelines that add 1.2B to 16B external parameters, by up to 13.4 points on written tasks and up to 21.9 when the need for a skill arises mid-rollout. Routing accuracy improves as the backbone does, and in a bash-agent harness the same 32B triggers the correct skill on Skill-Use more often than far larger frontier models running in Codex.", "category": "cs.LG", "cluster": "Skill Routing \u0026 Tool Use", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-36 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一种名为 Gavel 的新机制，用于在 LLM 智能体运行时进行技能/工具的路由选择。论文明确指出当前 agent harness 在技能选择上的局限性，并通过从冻结的 LLM 前向传播中提取原生路由信号来改进智能体的工具使用能力。这直接属于“单智能体的工具使用”以及“智能体 harness/scaffold 改进”的研究范畴。论文的研究对象明确是 LLM Agents 和 Tool-Use Agents，并在模拟的 agent 轨迹和 bash-agent harness 中进行了评估。这里的 routing 指的是智能体内部的技能路由，而非多智能体系统中的消息路由或拓扑编排，因此不触发排除条件。该研究为改进智能体能力提供了新的方法论，完全符合筛选标准中关于构建和改进 LLM 智能体的核心目标。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决的核心问题是：如何在不将任何 skill metadata 注入 context 的前提下，利用 frozen agent LLM 自身的 forward pass 来完成大规模 skill library 的路由选择。具体而言，当一个 agent 在执行任务过程中需要调用某项 skill 时，router 需要从可能包含数万个文档的 library 中选出正确的那一个，而这一选择既不能污染 agent 的 context window，也不能依赖 agent 之外的独立模型。\n\n这个问题的重要性源于 skill 已成为 LLM agent 超越 parametric knowledge 的标准扩展方式——一个 skill 将指令、脚本和参考文件打包为 `SKILL.md` 文档，agent 在任务需要时将其载入 context。选对 skill 能显著提升任务表现，选错则比不用 skill 更糟。随着公共 skill library 规模达到数万条目，选择难度急剧上升，routing accuracy 随 skill 数量对数级衰减。更关键的是，agent 在实际部署中的需求往往不是在第一轮对话中明确提出，而是在 multi-turn rollout 的某个中间时刻才浮现——此时 context 中充满工具调用结果和历史对话噪声，使得路由判断更加困难。解决这一问题能带来的价值是：让 frozen agent LLM 自身承担路由职责，既避免 context 污染对任务执行的损害，又使路由能力随 backbone 能力同步提升，同时新 skill 的安装仅需一次 forward pass 而无需重新训练。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决，现有方案沿两条路线展开，各有根本性缺陷。\n\n第一条是 **progressive disclosure**，被 Claude Code 和 Codex 等部署系统采用。它将每个已安装 skill 的 name 和 description 预加载到 system prompt 中，让 agent LLM 自行决定读取哪个 skill 的完整文档。这种做法的局限是 intrinsic 的：metadata 占据的 context 空间与 library 规模成正比，分散了 agent 对任务本身的注意力。Codex 因此将 skill metadata 限制在 context window 的 2% 以内并丢弃其余条目，将部署限制在小型 library，而 routing accuracy 仍然随 skill 数量对数级衰减。更深层的原因是，context 内路由迫使 agent 在它考虑的每个 skill 的 summary 之间分配注意力，而这些 summary 只能容纳部分信息，遗漏了选择所依赖的关键细节——尤其在 skill body 包含长篇过程性说明时，metadata 根本无法承载区分正确 skill 所需的信息。论文在 ablation 中证实，即使将二十个完整 skill body 放入 menu，progressive disclosure 在 SRA-Bench 上仍落后 Gavel 16 个 adjudicated points，因为 agent 面对大量上下文时并不能有效利用其中的信息。\n\n第二条是 **retrieve-and-rerank** pipeline，通常由一个 embedding model 和一个 reranker 组成，在外部完成 skill 选择后将其注入 context。这条路线虽然保持了 context 的整洁，但将选择过程从 agent 的能力中剥离：独立 retriever 擅长文本匹配，但对任务需求的判断不如 agent LLM 可靠，尤其在 mid-rollout 的 noisy multi-turn context 中——retriever 要么吞入整段充满多主题噪声的轨迹导致 embedding 混杂，要么仅取最后一条消息而丢失关键证据。论文在 SkillTraj benchmark 的四个场景中系统性地展示了这一困境：无论 retriever 取 full context 还是 last message，其表现均显著落后于直接读取 agent 自身 forward pass 的方案。此外，外部 retriever 的能力是固定的，不会随 agent backbone 的升级而提升，而论文的 scaling 实验表明 Gavel 的路由精度随 backbone 从 0.6B 增长到 32B 而持续攀升。ToolkenGPT 虽尝试让 frozen LLM 以 token 形式发射 tool，但每个 tool 需训练一个 embedding，新 skill 的加入意味着一次训练运行，无法应对不断变化的数万级 library。\n\n两条路线之间的核心矛盾在于：context 内选择给 agent 增加负担，外部模型则缺乏 agent 对任务与 skill 之间关系的深层理解。此前没有工作回答通过什么 interface、以什么 cost 将 agent 的这种理解转化为 context 外的路由信号——这正是 Gavel 通过两个 trained linear projection 从 frozen backbone 的 mid-layer hidden state 中读出 routing signal 所填补的空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在探索如何为 LLM agent 选择合适的 skill 时，研究者首先面临的是两条现有路径的固有缺陷。第一条路径是 progressive disclosure，即将所有 skill 的 metadata 预加载到 system prompt 中让 agent 自行挑选。然而，随着 skill 库规模扩大，metadata 会挤占 context window 并分散模型注意力，导致任务表现下降；即使限制 metadata 数量，routing accuracy 仍会随 skill 数量对数级衰减。第二条路径是 retrieve-and-rerank，将选择过程交给外部的 embedding model 和 reranker。这虽然保持了 context 的整洁，但选择过程脱离了 agent LLM 自身的理解能力——standalone retriever 擅长文本匹配，却不如 agent 本身那样能可靠判断任务在 noisy 的 mid-rollout 环境中真正需要什么，且不会随 agent 能力的提升而进步。\n\n面对“context 内选择消耗注意力，外部模型又缺乏深度理解”的困境，研究者开始思考：agent LLM 在处理任务时，其内部 forward pass 是否已经隐含了对所需 skill 的判断信号？Probing 研究早已表明，LLM 的 hidden states 携带了比预测下一个 token 更丰富的信息。同时，text embedding 领域的工作已经证明，可以通过 fine-tuning 或 prompting 将 decoder LLM 转化为强大的 encoder。这些线索暗示，agent 内部可能已经存在 routing signal，只是需要找到正确的方式读取。\n\n然而，直接使用模型 native 的 attention keys 作为匹配空间被证明是失败的——信号太微弱，且不同文档编码后的分数不可比。研究者意识到，native 的 hidden states 虽然压缩了输入语义，但与只服务于下一个 token 的信息纠缠在一起。理论线索指出，LLM 的中间层存在一个 \"compression valley\"，matrix entropy 在此触底，语义压缩最为彻底。这提示研究者：若在此层嫁接一个轻量级的、经对比学习的线性映射头，或许能将纠缠的信号转化为可用的 routing signal。\n\n借鉴 late-interaction retrieval 的思想，研究者设计了 token 级别的匹配机制：每个 task token 通过 query map 投影后，与 skill bank 中的 key 进行 max-similarity 投票。但这仅能实现粗粒度的筛选。对于 shortlist 中的候选 skill，研究者转而利用模型自身的 full attention，通过 query-likelihood 和 yes/no judgment 两种方式读取更深层的语义推理信号。由于这三种信号（contrastive、generative、discriminative）本质上都可以视为对同一 log posterior 的估计，研究者自然地将它们融合为 product of experts，让任何一方都能否决其他两方仅勉强容忍的候选。\n\n### § 4 核心 Intuition\n\n现有方法要么把 skill 菜单塞进 context 分散 agent 注意力，要么用外部 retriever 脱离 agent 的理解能力。核心 Intuition 在于：frozen LLM 在处理任务时的 forward pass 中，其中间层 hidden states 已经隐含了对所需 skill 的判断信号，只是与预测下一个 token 的信息纠缠而无法直接读取。通过在模型语义压缩最彻底的中间层嫁接一个轻量级的、对比学习的线性映射头，就能将这个 native routing signal 提取出来，从而在不污染 context、不依赖外部模型的情况下，让 agent 用自身的能力为自己导航。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Skill Library]                                      [Task Context]\n      |                                                     |\n[Install: 1 fwd pass]                          [Frozen LLM decode]\n      |                                                     |\n[Mid-layer ℓ* states]                         [Mid-layer ℓ* states]\n      | (Ws)                                     (Wq) |\n[Key Bank] --(ε-cover)--\u003E [Compressed Bank]           [Query]\n                                    |                    |\n                                    +--------------------+\n                                    | (late-interaction) |\n                                 [Glance: Vote top-k] ---+--\u003E [Shortlist]\n                                    | (g)                |\n                  +-----------------+                    |\n                  |          [Verdict: resume fwd pass]   |\n                  |               [Skill + Task]          |\n                  |                 /      \\              |\n                  |          (L) Likelihood  Judgment (V) |\n                  |                \\      /               |\n                  +-------------------+-------------------+\n                                      |\n                         [Ruling: Product of Experts]\n                                      |\n                              [Selected Skill]\n```\n\nGavel 的完整 pipeline 分为安装、训练和推理三个阶段，核心在于从 frozen LLM 的 forward pass 中提取 routing signal，无需将 skill text 放入 context。\n\n1. **Skill Installation (推理准备阶段，对应 § 3.2, § 3.3)**：输入为 skill document。操作上，通过 frozen LLM 对每个 skill 进行一次 forward pass，提取中间层 $\\ell^*$ 的 hidden states，并通过 key map $W_s$ 映射为 key。随后使用 farthest-first traversal 将这些 key 压缩为 $\\varepsilon$-cover，构建 compressed key bank。输出为每个 skill 的 compressed key bank，这一过程无需训练。\n\n2. **Training (训练阶段，对应 § 3.2, § 3.3, Appendix C)**：输入为 task-skill pairs (SkillRet)。操作上，训练 query map $W_q$ 和 key map $W_s$，使用 multi-positive contrastive loss (InfoNCE)。梯度在 hidden states 处截断，LLM 保持 frozen。压缩后微调 $W_q$。输出为训练好的 $W_q$ 和 $W_s$，参数量仅 7.9M。\n\n3. **Glance (推理阶段，对应 § 3.2)**：输入为 task context 和 compressed key banks。操作上，提取 task token 在中间层 $\\ell^*$ 的 hidden states，通过 $W_q$ 映射为 query。每个 task token 与所有 skill 的 key bank 进行 max-similarity 匹配，投票给 top-k skills，加权求和得到 glance score $g$。输出为 glance score $g$ 和 shortlist。\n\n4. **Verdict (推理阶段，对应 § 3.4)**：输入为 shortlist 中的 skills 和 task context。操作上，恢复 skill 的 installation forward pass，将 task 追加其后。读取两个信号：task 的 mean log-likelihood $L$ (generative) 和 yes/no judgment 的 log-odds $V$ (discriminative)。输出为 likelihood $L$ 和 judgment $V$。\n\n5. **Ruling (推理阶段，对应 § 3.5)**：输入为 $g, L, V$。操作上，将三者视为对同一 log posterior $\\log p(s|x)$ 的不同估计，通过 product of experts 融合 $S = g + \\alpha L + \\gamma V$。输出为最终得分 $S$，选择得分最高的 skill。\n\n### § 6 核心数学推导\n\n论文的核心数学推导主要集中在三个信号的统一以及 key bank 压缩的理论保证上。\n\n**1. 三个信号的统一：Product of Experts (对应 § 3.5)**\n\nGavel 的三个信号 $g$ (glance), $L$ (likelihood), $V$ (judgment) 本质上都是对同一个 log posterior $\\log p(s|x)$ 的估计，但估计方式不同。\n- **Glance score $g$**：通过 contrastive learning 训练得到。最小化 InfoNCE loss 的 score 实际上是在估计 log posterior $\\log p(s|x)$ 与负采样分布 $\\log p_{neg}(s)$ 的比值。因此 $g$ 是一种 contrastive 估计。\n- **Likelihood $L$**：计算在给定 skill 的条件下生成 task 的对数似然 $\\log p(x|s)$。根据 Bayes' rule，$\\log p(s|x) = \\log p(x|s) + \\log p(s) - \\log p(x)$。在 uniform prior 下，$\\log p(s)$ 是常数，因此 $L$ 是一种 generative 估计。\n- **Judgment $V$**：直接询问模型该 skill 是否适用于该 task，得到的是 discriminative 估计。\n\n既然三者都是对同一目标的估计，Product of Experts 提供了自然的融合方式：在概率空间相乘等价于在 log 空间相加。公式 $S = g + \\alpha L + \\gamma V$ 中的 $\\alpha, \\gamma$ 是 exchange rates，用于将 $L$ 和 $V$ 的尺度对齐到 $g$，同时起到 tempering 作用，防止某个过于自信的 expert 主导结果。\n\n**2. Key Bank 压缩的 Distortion Bound (Proposition 1, 对应 § 3.3, Appendix D)**\n\n为了压缩 key bank，Gavel 保留一个子集 $C_s$，使得被丢弃的 key 都在保留 key 的 $\\varepsilon$ 距离内。Proposition 1 证明了压缩后的 max similarity score 最多比压缩前小 $\\varepsilon$，且不会膨胀。\n\n**Intuition**：假设原始 bank 中与 query $q$ 内积最大的 key 是 $d^*$，压缩后覆盖 $d^*$ 的保留 key 是 $c$，即 $\\|d^* - c\\| \\le \\varepsilon$。根据 Cauchy-Schwarz 不等式，$\\langle q, c \\rangle \\ge \\langle q, d^* \\rangle - \\|q\\| \\|c - d^*\\| \\ge \\langle q, d^* \\rangle - \\varepsilon$（因为 $q$ 是单位向量）。这意味着压缩后的 score 有下界保证，且误差可控。\n\n### § 7 实验设计与结论\n\n**问题 1：Gavel 在 written tasks 上的 routing 准确率是否优于现有方法？**\n**实验**：在 SkillRet, SRA-Bench, Eval-Core 三个公开 benchmark 上评测 Hit@1，与 progressive disclosure 和 retrieve-and-rerank (如 Qwen3-Emb-8B + Qwen3-Reranker-8B) 对比。使用 adjudicated Hit@1 (GPT-5.6 作为 judge) 解决 under-annotation 问题。\n**答案**：Gavel 在所有三个 benchmark 上均领先，超过添加了 1.2B-16B 外部参数的 pipeline，且 glance 阶段单独表现也很强。\n\n**问题 2：Gavel 在 mid-rollout (多轮对话中需求突然出现) 场景下表现如何？**\n**实验**：构建 SkillTraj benchmark，包含 372 个模拟 agent trajectories，分为四种场景。评测 Gavel 与其他 pipeline 在 routing point 的表现。\n**答案**：Gavel 在所有四种场景下均领先 8.6 到 21.9 个点。外部 retriever 难以处理 noisy context，而 Gavel 直接读取 agent 内部 forward pass 的状态。\n\n**问题 3：Gavel 在 end-to-end deployment 中是否有效？**\n**实验**：集成到 mini-swe-agent 中，在 Skill-Use benchmark 上测试 trigger rate。训练一个简单的 gate 来决定何时触发 routing。\n**答案**：Qwen3-32B + Gavel 达到 90.9% 的 trigger rate，超过所有在 Codex 中的 open frontier models，也超过 retrieve-and-rerank pipelines。\n\n**问题 4：Gavel 的性能是否随 backbone 能力提升而提升？**\n**实验**：在 SRA-Bench 上使用不同大小和代际的 Qwen backbone 测试 Gavel 和 progressive disclosure。\n**答案**：Gavel 的性能随 backbone 增长而提升，且 0.6B 的 Gavel 已经超过 32B 的 progressive disclosure。", "additional_insights": "### § 8 Take-aways\n本文提出了 Gavel，一种从 frozen LLM 自身 forward passes 中提取 skill routing 信号的方法，避免了现有 progressive disclosure 将 metadata 塞入 context 导致的注意力分散，也避免了 retrieve-and-rerank 引入外部模型而切断 agent 自身判断能力的弊端。Gavel 的核心在于仅训练两个 linear projections（query map 和 key map，共 7.9M 参数）：在 \"glance\" 阶段，利用 mid-layer hidden states 进行 token-level late-interaction 匹配，对整个 skill library 进行粗筛；在 \"verdict\" 阶段，对 shortlist 恢复 forward pass，读取 model 自身的 task likelihood 和 yes/no judgment，最后通过 product of experts 融合三者的打分。为降低存储开销，skill bank 在安装时通过 farthest-first traversal 压缩为 $\\varepsilon$-cover，且在数学上证明了其 score distortion 的上界。实验表明，在 Qwen3-32B 上仅训练一次的 Gavel，在三个公开 benchmark 和本文新建的 SkillTraj（模拟 mid-rollout 路由）上，超越了带有 1.2B 至 16B 外部参数的 pipeline，且 routing accuracy 随 backbone 能力提升而自然提升。在端到端部署的 bash-agent 中，32B 模型配合 Gavel 的 skill 触发率甚至高于运行在 Codex 中的远大 frontier models。\n\n### § 9 最脆弱的假设\nGavel 最核心且失败代价最大的假设是：**frozen LLM 的 mid-layer hidden states 中已经包含了足够丰富且可被线性映射（linear projections）提取的 skill routing 信号**。如果这个假设不成立，即 hidden states 中的 routing 信号与 next-token prediction 的特征深度纠缠以至于线性层无法解耦，那么整个 glance 阶段将退化为随机猜测，后续的 verdict 和 product of experts 也就失去了基础。\n在实际中，这个假设可能不成立的原因在于：LLM 的训练目标是 next-token prediction，并未显式优化其内部表征用于区分“当前任务需要调用哪个外部技能”。特别是当任务需求隐晦（如 mid-rollout 中需要根据 tool evidence 推断），或者 skill 之间的区别在于细微的操作步骤而非宏观主题时，线性可分性可能被破坏。论文为这个假设提供的证据主要是经验性的：Appendix A 展示了 native attention keys 信号太弱，而加上 trained linear maps 后信号变得可用；Appendix B 通过 matrix entropy 验证了在 compression valley 层（约 70% 深度）线性可读性最强。然而，论文缺少在极度跨域或高度专业化的长尾 skill library 上的验证，无法证明这种线性可分性在所有真实复杂场景下都能保持。\n\n### § 10 最小复现实验\n如果有一周时间，最小复现实验应聚焦于验证“**frozen LLM 的 mid-layer states 通过线性映射能提供比现成 dense retriever 更好的 routing 信号**”这一核心 claim。\n**数据**：使用 SkillRet 的公开测试集，截取 500 个 query 和 2000 个 skill 构建一个小型 library。\n**实现**：加载一个中等规模 frozen LLM（如 Qwen3-8B）。提取 query 和 skill 在 mid-layer（如 70% 深度处）的 hidden states。在 SkillRet 训练集中随机抽取 5000 对 query-skill，使用 InfoNCE loss 训练两个简单的线性层（$W_q, W_s$）。在测试时，仅运行 glance 阶段：计算 query token 和 skill token 的 max-similarity 并聚合打分，对 2000 个 skill 排序。\n**测量**：测量该 glance 模块的 Hit@1 和 Recall@10，并与直接使用 Qwen3-Embedding-8B 计算 query 与 skill body 的 cosine similarity 基线进行对比。\n**结果判定**：如果线性映射的 glance 模块在 Hit@1 和 Recall@10 上达到或超过 Qwen3-Embedding-8B 基线，则支持论文的 claim，证明 frozen LLM 内部确实存在可线性提取的强 routing 信号；如果显著低于 embedding 基线，则反驳了该假设，说明脱离了 verdict 阶段的生成式打分，单靠 mid-layer 线性映射不足以支撑有效路由。", "research_value": "### § 11 最强反例设计\n\n要对 Gavel 构成最致命的打击，我会设计一个**“语义解耦的操作性路由”**实验，旨在证明 Gavel 的成功仅仅是因为它充当了一个高度高效的内部 dense retriever，而非真正利用了 agent 对任务与 skill 之间深层逻辑的理解。Gavel 的核心假设是 frozen LLM 的 mid-layer hidden states 已经编码了 skill routing 信号，但这依赖于 LLM 在 pre-training 阶段积累的语义关联。如果正确的 skill 与当前任务在文本语义上完全无关，且其必要性仅存在于多步工具调用后的操作逻辑中，Gavel 将可预测地失败。具体而言，我会构建一个 adversarial skill library，其中每个 skill 的 `SKILL.md` 文档被重写为高度抽象且与目标任务零语义重叠的纯过程性脚本。例如，任务目标是“修复内存泄漏”，但正确的 skill 是一个名为“重启服务 X”的脚本，其文档仅包含重启特定微服务的 bash 命令，完全不提及“内存”或“泄漏”。在这个库中，我会设置大量语义干扰项，例如包含“内存管理”或“垃圾回收”等关键词的错误 skills。在 SkillTraj benchmark 的 mid-rollout 场景下运行此实验，任务上下文中仅包含 OOM (Out of Memory) 的报错日志。由于 frozen LLM 的 mid-layer states 主要捕获 token 级别的语义聚类，其 hidden states 在面对“OOM 报错”时，会不可避免地向包含“内存”语义的干扰项 skill 偏移。即使经过 InfoNCE 训练的 linear projections $W_q$ 和 $W_s$ 能够优化路由，它们也无法跨越 frozen weights 中根本不存在的操作因果链。这将导致 Glance 阶段的 max-similarity 打分将语义干扰项排入 shortlist，而在 Verdict 阶段，由于 frozen LLM 缺乏“重启服务能释放内存”的内在因果推理，其计算出的 task likelihood $L$ 和 yes/no judgment $V$ 也会对正确 skill 给出低分。这个反例不仅会导致 Gavel 的 Hit@1 显著低于能够捕捉长文本因果关系的 retrieve-and-rerank pipeline（假设 reranker 具备足够的推理能力），更从根本上反驳了论文的 core claim：它证明了 Gavel 读取的并非“agent 对任务与 skill 关系的深层理解”，而仅仅是 frozen LLM 表层的 semantic proximity，一旦 skill 的实用性脱离了 pre-training 数据的语义分布，linear projection 便无法提取有效的 routing signal。\n\n### § 12 Follow-up Research Idea\n\n基于 Gavel 依赖 frozen LLM 内在表征的局限，我提出一个全新的研究方向：**Latent Skill Emulation via Representation Engineering**。这个想法的驱动力在于：无论是 progressive disclosure（将 skill 文本塞入 context）还是 Gavel（从 hidden states 中提取路由信号后仍需将 `SKILL.md` 载入 context），都默认 skill 是一种“外部文档”，agent 必须通过阅读它来执行。然而，如果 frozen LLM 的 hidden states 中确实存在某种与 skill 相关的子空间，我们完全可以跳过“阅读文档”这一步，直接在模型内部模拟 skill 的执行。这里可以借鉴 Mechanistic Interpretability 和 Representation Engineering (RepE) 领域的方法。我们不训练用于路由的 linear projection，而是训练一个 lightweight hypernetwork，它以 `SKILL.md` 文档作为输入，输出一个作用于 mid-layer residual stream 的 steering vector。在推理时，当检测到任务需求（可以通过一个简单的 gate），我们直接将对应 skill 的 steering vector 注入 frozen LLM 的 forward pass 中，从而在参数层面“激活”该 skill 的能力，使 LLM 的后续生成行为表现得如同它已经阅读了该 skill，而 context window 中始终保持绝对干净。第一个实验将聚焦于程序性 skill 的内化：选取一组用于操作特定 API 的 skills，使用对比学习训练 hypernetwork 生成 steering vectors，使得注入该 vector 后，frozen LLM 在 zero-shot 下生成正确 API 调用格式的准确率，等同于或高于将完整 `SKILL.md` 放入 context 的 baseline。这个提议与 Gavel 及现有工作的根本区别在于：Gavel 是在 frozen LLM 之外构建一个 router 来“选择”外部知识，而本提议是利用 LLM 的内部表征空间直接“内化”外部知识，将 skill library 从一个文档库转化为一个 latent vector bank，从而彻底消除 agent 执行 skill 时的 context window 读取开销和注意力分散问题。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Ruishuo Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xun Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yu Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhuoran Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Longbo Huang\", \"affiliations\": [1], \"markers\": [\"✉\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"IIIS, Tsinghua University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"✉\", \"text\": \"Correspondence: longbohuang@tsinghua.edu.cn\"}\n  ]\n}\n```", "summary_translation": "技能将 LLM agent 的能力扩展到其参数化知识之外，而它们所承诺的增益取决于能否选择正确的技能。已部署的 harnesses 通过将每个技能的 metadata 预加载到 context 中来进行路由，这会分散 agent 的注意力并限制技能库的大小。Retrieval pipelines 将选择过程移出了 context，但也移出了 agent 的能力范围。我们表明，frozen agent LLM 在其自身的 forward passes 中已经包含了路由信号，并且仅需两个 linear maps 就足以在 context 中没有任何技能文本的情况下将其读出。Gavel (Glance And Verdict from a frozen LLM) 分两步读取该信号。Glance 通过这两个 maps（唯一被训练的参数）投影任务和每个技能的 mid-layer states，并根据安装时由一次 forward pass 构建的紧凑的逐技能库对整个技能库进行评分。随后，Verdict 恢复入围技能的 forward passes，并读取模型自身的 likelihood 和 yes/no 判断，将其与 glance 作为 product of experts 进行融合。经过一次训练后，Gavel 能够 zero-shot 迁移到三个公开 benchmarks 以及 SkillTraj，这是我们包含 372 条模拟 agent 轨迹的新 benchmark。在 Qwen3-32B 上，它优于添加了 1.2B 到 16B 外部参数的 progressive disclosure 和 retrieve-and-rerank pipelines，在书面任务上最高提升 13.4 points，当在 mid-rollout 期间产生技能需求时最高提升 21.9 points。路由准确率随着 backbone 的改进而提升，并且在 bash-agent harness 中，相同的 32B 模型在 Skill-Use 上触发正确技能的频率高于在 Codex 中运行的远大得多的 frontier models。"}, {"title": "Salesforce Koa: An Enterprise Language Model for Agentic Tool Use", "arxiv_id": "2609.15066", "authors": "Zixiang Chen, Sufeng Niu, Yingchi Liu, Wenting Zhao, Akshara Prabhakar, Shubham Mehrotra, Bin Bi, Zhujun Lan, Katherine Tan, Mohammad Ramezanali, Tulika Manoj Awalgaonkar, Monojit Banerjee, Jielin Qiu, Shiva Kumar Pentyala, Zhepeng Cen, Anupam Tripathi, Ali Ziaei, Regunathan Radhakrishnan, Darvish Lee Shadravan, Shelby Heinecke, Sitaram Asur, Silvio Savarese, James Zhu, Phil Mui, Huan Wang", "summary": "We present Salesforce Koa, an enterprise language model built by post-training the open-weight Nemotron-3-Super-120B foundation model with reinforcement learning using Group Relative Policy Optimization (GRPO). Salesforce Koa is trained on public and synthetically generated data, with no customer data, to improve tool use and agentic capabilities while preserving strong general-purpose performance. Its distinctive component is a simulation-to-reward pipeline that expands workflow specifications into persona-conditioned multi-turn tasks with task-resolution rewards grounded in successful tool use for data-dependent requests. For enterprise domains, these specifications are written in Agent Script, Salesforce's declarative language for building Agentforce agents; for public tool-use domains, we synthesize the workflow structure directly. The same simulation and grounded-reward machinery drives GRPO across both. Across public tool-use, agentic-reasoning, and enterprise Customer Relationship Management (CRM) benchmarks, Salesforce Koa improves over its open-weight base, with the clearest gains on multi-turn tool use, and surpasses a strong proprietary baseline while remaining below the strongest frontier models. These results show that specification-driven reinforcement learning is a practical path to specializing open-weight foundation models for enterprise agentic tasks.", "category": "cs.LG", "cluster": "Skill Routing \u0026 Tool Use", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心问题是：能否将开源的 open-weight foundation models 有效地专门化用于企业 agentic tasks——即在组织特定的 schemas、APIs 和 policies 上完成多步骤工作流、调用外部工具、检索结构化信息——同时保持 general-purpose capability 不退化。这一问题之所以重要，是因为企业 AI 系统与通用助手有本质区别：它们必须在与业务应用深度耦合的环境中执行 multi-turn tool use 和 agentic reasoning，而当前许多此类系统依赖专有 frontier models，企业却需要对 deployment、customization、governance 和 cost 的更精细控制权，这是单一外部提供商难以满足的。尽管 Llama、Gemma、Qwen、Mistral 和 Nemotron 等 open-weight 模型已在公开 benchmark 上大幅缩小与专有模型的差距，且权重访问使组织能够进行 domain-specific post-training，但一个关键的空白始终存在：这些模型能否在不牺牲通用能力的前提下，被有效适配到企业特有的工具生态和工作流规范中。解决这一问题带来的价值是双重的——既为企业提供可控、可定制、可治理的 agentic LLM 部署路径，又通过 specification-driven RL 建立起 agent authoring 与 model post-training 之间的直接桥梁，使同一套声明式规范既配置 agent 行为又结构化其训练任务和奖励标准。\n\n### § 2 前人工作与不足\n\n该问题之前未被完整解决。在模型层面，open-weight foundation models 如 Llama、Gemma、Qwen、Mistral 和 Nemotron 虽然在公开 benchmark 上表现接近专有模型，但它们缺乏对企业特定 schemas、APIs 和 policies 的专门适配——这一空白并非因为模型能力不足，而是因为公开训练数据和 benchmark（如 BFCL、Tau2Bench）覆盖的是通用工具调用场景，企业领域的 workflow specification 缺乏对应的训练信号来源。在 post-training 方法层面，supervised fine-tuning 是适配下游任务的标准路径，RLHF、Constitutional AI 和 GRPO 等强化学习方法进一步改进 reasoning 和 decision-making，但绝大多数工作 targeting 的是 general-purpose reasoning over public tools，而非企业应用中需要操作组织特定 schemas 和 policies 的场景——这一缺失的根本原因是：企业 agentic 任务的训练数据难以获取且涉及隐私，而将 agent 的 workflow 结构转化为可执行训练环境并生成 grounded reward 的系统化方法此前并不存在。论文自身的 preliminary SFT study 进一步揭示了 SFT 的方法层面局限：从已经过大量 post-training 的 Nemotron-120B 基座出发，SFT 在 single-turn 和 static agentic 类别上有提升（如 BFCL live parallel 从 75.0% 升至 87.5%），但对 multi-turn tool use 这一企业 agent 最核心的能力几乎没有改善（54.1%→53.2%），表明 imitation-based SFT 在已充分 post-trained 的基座上对长程交互决策的 headroom 极其有限。此外，SFT 与 RL 在 post-training 中并非可干净解耦——正如 Niu et al. [9] 所指出的，二者的交互使得简单的 SFT-then-RL pipeline 难以直接奏效。更关键的是，此前缺乏一种将 declarative agent specification 直接转化为 RL 训练环境和 grounded reward 的机制：Salesforce 的 Agent Script 虽然能声明式地定义 agent 的 routing structure、subagents、typed actions 和 tool scopes，但这些规范此前仅用于 agent 配置，未被用于结构化 model post-training 的 rollout 任务和 resolution criteria。Salesforce Koa 通过 simulation-to-reward pipeline 填补了这一缺口，将同一套 specification 同时驱动 agent authoring 和 RL 训练，使 spec-driven RL 成为专门化 open-weight foundation models 的可行路径。", "core_insight": "### § 3 重建作者的思考路径\n\n企业 AI 系统对 LLM 的要求与通用助手根本不同：它必须调用外部工具、检索结构化信息、完成跨业务应用的多步骤工作流，而这些工具的 schema、API 和策略是组织特定的。开源基础模型（Llama、Gemma、Qwen、Mistral、Nemotron）在公共 benchmark 上已大幅缩小与专有模型的差距，但企业需要的部署控制、定制化、治理和成本管理是单一外部 provider 无法满足的。核心问题因此浮现：能否在保留通用能力的同时，将开源基础模型有效特化为企业 agentic 任务专用？\n\n标准的 post-training 路线是 SFT 适配下游任务，再用 RLHF 或 GRPO 进一步提升推理和决策。但作者在 preliminary SFT study 中观察到一个关键失败模式：在已经经过大量后训练的 Nemotron-120B base 上，SFT 对多轮工具使用几乎没有提升（BFCL multi-turn 54.1%→53.2%），增益集中在单轮和静态 agentic 类别。这暗示行为克隆无法教会 agent 在长 horizon 交互中做出正确决策——它只能模仿表面动作序列，无法学习何时该调用工具、何时该与用户沟通、何时该 defer。与此同时，SFT 与 RL 在 post-training 中并非干净解耦，简单叠加 SFT-then-RL 的收益并非理所当然。\n\n另一方面，现有 RL 工作大多针对通用推理和公共工具，而非企业特定的 schema 和 API。企业领域的 RL 面临一个结构性困难：训练任务和 reward 必须反映真实的工作流结构，但人工标注昂贵且涉及客户数据隐私，而通用合成数据又无法覆盖组织特定的路由逻辑、工具范围和策略约束。APIGen 和 APIGen-MT 提供了合成多轮交互的自动化 pipeline，Tau2Bench 和 BFCL 确立了工具使用评估标准，PivotRL 展示了低计算成本下的 agentic post-training 方法——但这些工作都没有利用企业 agent 本身已有的声明式规范。\n\n关键的洞察在于：Salesforce 的 Agentforce agent 本身就是用 Agent Script 这种声明式语言编写的，一个 specification 已经完整定义了 agent 的路由结构、子 agent、typed actions、工具范围和工作流指令。如果将这个 specification 不仅用于配置 agent，还用于结构化 RL 的 rollout 任务和 resolution criteria，就能直接桥接 agent authoring 与 model post-training。specification 可以被编译为 typed workflow graph，实例化为可执行环境；simulation pipeline 可以将其扩展为 scenario- 和 persona-conditioned 的多轮任务；coverage judge 可以基于 sub-question 的 resolved/not-resolved 判决生成 grounded reward，并强制要求需要客户或系统数据的子问题必须由成功的工具调用支撑。对于没有 Agent Script 的公共工具领域，可以直接合成 workflow structure，复用相同的 simulation 和 reward 机制。这样，RL 就能在真实的工作流结构中学习，而非在抽象的通用任务中。\n\n### § 4 核心 Intuition\n\n企业 agent 的声明式 specification 本身就包含了训练所需的全部结构：工作流路由、工具范围、状态效应和终止条件。将 specification 编译为可执行环境，用 simulation pipeline 扩展为多轮任务，用 coverage judge 生成 grounded reward，就能让 GRPO 在真实工作流中学习 agent 该做什么，而不是在抽象任务中学习通用推理。先前方法失效是因为 SFT 只能模仿表面动作而无法教会长 horizon 决策，通用 RL 又缺乏企业特定的工作流结构和 grounded reward；这个方法奏效是因为 specification 同时定义了 agent 的行为空间和模型的训练信号，使 agent authoring 与 post-training 不再是割裂的两个阶段。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Agent Script / Synth Workflow]\n      |\n      v\n[Typed Workflow Graph] -\u003E [Simulation Pipeline] -\u003E [Persona-conditioned Tasks]\n                                                        |\n                                                        v\n[GRPO Optimization] \u003C- [Grounded Reward] \u003C- [NeMo Gym Online Rollout]\n      |                    ^                 |          |\n      v                    |                 v          |\n[Policy Update]            |          [Coverage Judge]  |\n                           |          (Frozen Helper)   |\n                           |               ^            |\n                           |               |            |\n                           +---------------+------------+\n```\n\nSalesforce Koa 的完整训练 pipeline 包含以下核心步骤：\n\n1. **Spec-driven 环境与任务构建 (Section 2.1)**：\n   - **输入**：企业领域的 Agent Script 规范（定义路由、子代理、工具作用域等）或公开工具领域的合成工作流结构。\n   - **操作**：静态提取将规范编译为 typed workflow graph（包含工具参数 schema、路由条件等）。随后，simulation pipeline 将其扩展为基于场景和 persona 的多轮对话任务。\n   - **输出**：带有 `agent_ref` 和初始上下文的 persona-conditioned RL 训练任务。\n\n2. **在线 Rollout 与 Grounded Reward (Section 2.2)**：\n   - **输入**：RL 训练任务、可训练的 Policy (Nemotron-120B) 以及 Frozen Helper 模型。\n   - **操作**：NeMo Gym 执行 online rollout。Policy 与环境交互，Frozen Helper 扮演 customer simulator、tool emulator 和 coverage judge 三个角色。Coverage judge 根据子问题解决情况与成功工具调用的 grounding 计算覆盖率，并施加 duplicate-call gate。\n   - **输出**：标量 Grounded Reward。\n\n3. **策略优化 (Section 2.3)**：\n   - **输入**：Rollout 生成的完整轨迹与标量奖励。\n   - **操作**：使用 Group Relative Policy Optimization (GRPO) 算法，通过 leave-one-out 基线估计优势，进行单步 on-policy 更新。对格式错误的工具调用施加负向优势作为硬性约束。\n   - **输出**：更新后的 Policy 权重。\n\n4. **单步训练模式 (Appendix F)**：\n   - **输入**：受约束的决策回合（如工具被故意扣留时的对话前缀）。\n   - **操作**：环境动态创建工具缺失的约束状态，要求 Policy 选择与用户沟通而非盲目调用工具。通过 procedural gate 阻止不可逆的副作用，并在恢复回合评估正确性。\n   - **输出**：增强 Policy 在面对限制时的用户沟通与延迟决策能力。\n\n### § 6 核心数学推导\n\n本文的核心数学推导基于 Group Relative Policy Optimization (GRPO) 算法，旨在最大化期望轨迹奖励。由于原文部分公式抽取缺失，以下仅解释可确认的定义与关系，并补充标准理论背景。\n\n**1. 期望轨迹奖励**：\n模型优化的目标是最大化期望奖励 $J(\\theta) = \\mathbb{E}_{x \\sim D} \\mathbb{E}_{\\tau \\sim \\pi_\\theta(\\cdot|x, env)} [R(\\tau)]$。\n- **Intuition**：给定从数据集 $D$ 采样的 prompt $x$，策略 $\\pi_\\theta$ 在环境中生成轨迹 $\\tau$，目标是让所有可能轨迹的奖励 $R(\\tau)$ 的期望最大化。这里不使用单步奖励，而是基于完整多轮交互的最终结果给予奖励。\n\n**2. Leave-one-out 优势估计**：\n对于同一 prompt 采样的一组 $G$ 条轨迹，轨迹 $i$ 的优势 $A_i$ 通过 leave-one-out 基线计算。\n- **Intuition**：GRPO 不使用额外的 value network 来估计基线，而是用同一组其他轨迹的平均奖励作为基线。计算轨迹 $i$ 的优势时，排除 $i$ 自身，用剩余 $G-1$ 条轨迹的奖励均值和标准差进行归一化。这减少了方差，并使得相对表现更好的轨迹获得正优势。\n\n**3. Token-level 截断重要性采样权重**：\n在单步 on-policy 更新中，引入一个 token 级别的权重来纠正训练时与生成时 log-probability 的不匹配。\n- **Intuition**：由于策略在生成一个 batch 后会立即更新，生成时的概率与训练时的概率会有微小偏差。重要性采样权重用于修正这种偏差，保证梯度估计的无偏性，而截断操作则防止极端值导致训练不稳定。\n\n**4. Grounded Reward 计算**：\n奖励由 coverage rate 和 duplicate-call gate 组成。Coverage rate 是被 judge 判定为已解决的子问题比例；若发生连续重复的相同工具调用，奖励直接置零。\n- **Intuition**：通过 gate 机制惩罚无效的重复调用，强制模型在获取数据时依赖成功的、相关的工具调用，而非通过重复尝试或通用事实猜测来“作弊”通过判定。\n\n### § 7 实验设计与结论\n\n**提出了什么问题**：开源基础模型能否在不损失通用能力的前提下，通过强化学习有效特化为企业级 agentic 任务模型？spec-driven RL 是否是一条实用的技术路径？\n\n**设计了什么实验验证这个问题**：研究团队在公开工具调用、agentic reasoning 和企业 CRM 基准上，将 Salesforce Koa 与其开源基座、专有前沿模型进行对比。同时，设计了 scoped SFT-vs-RL 消融实验，从相同的已 RL-post-trained 基座出发，分别评估 SFT-only 和 RL-only 在单轮与多轮任务上的表现差异。\n\n**问题的答案是什么**：Spec-driven RL 能有效提升开源基座在企业 agentic 任务上的表现，尤其在多轮工具调用上提升最明显，并超越了强专有基线 GPT-4.1，但未达到最强前沿模型水平。消融实验表明，RL 在多轮工具使用上显著优于 SFT，而 SFT 在单轮 CRM 任务上更具竞争力。这证实了 spec-driven RL 是特化开源基础模型的有效路径，但从已 RL-post-trained 基座出发的结论可能不适用于 pre-RL checkpoint。", "additional_insights": "### § 8 Take-aways\n\nSalesforce Koa 是基于开源的 Nemotron-3-Super-120B foundation model，通过 GRPO (Group Relative Policy Optimization) 进行 post-training 的企业级语言模型，其核心创新是 specification-driven task construction。该 pipeline 使用 Salesforce 的声明式语言 Agent Script 编写企业工作流规范，将其扩展为基于场景和 persona 的多轮任务，并通过 simulation-to-reward pipeline 生成基于成功工具调用的 task-resolution rewards。对于公共工具使用领域，由于没有 Agent Script 规范，论文直接合成工作流结构生成 typed workflow graph，与企业领域共享相同的模拟和奖励机制。在公共工具使用、agentic-reasoning 和企业 CRM benchmarks 上，Salesforce Koa 相比其开源基线有所提升，特别是在多轮工具使用方面提升最明显，并超越了 GPT-4.1，但仍低于最强的前沿模型如 Claude Opus 4.8 和 GPT-5.5。论文发现，从已经经过 RL post-training 的基线模型出发，RL 在多轮工具使用上显著提升，而 SFT 贡献甚微，但在单轮 CRM 任务上 SFT 表现出竞争力。训练仅使用公开和合成生成的数据，不使用任何客户数据，确保了数据隐私和合规性。奖励设计采用了 gated coverage reward，通过 coverage judge 对子问题进行 resolved/not-resolved 判决，并强制要求需要特定数据的子问题必须由成功的工具调用支持。研究还发现 RL 的稳定性是 scale-dependent 的：在 Super-120B 模型上训练稳定，但在较小的 Nano-30B proxy 模型上训练会在早期达到峰值后崩溃。\n\n### § 9 最脆弱的假设\n\n该论文最关键的假设是：使用 frozen helper model（Nano-30B）同时充当 customer simulator、tool/function emulator 和 coverage judge，能够准确模拟真实环境并生成可靠的 reward 信号。如果这个假设不成立，核心贡献会直接失效，因为整个 GRPO 训练完全依赖于 helper model 生成的 reward，如果 helper 的模拟不准确或 judge 不可靠，会导致 reward hacking 或错误的训练信号，使得模型学到的策略在真实环境中无效。在实际中，这个假设可能不成立的原因是 helper model 需要同时扮演三个角色，其能力可能不足以准确模拟复杂的企业工作流或正确判断任务是否解决，特别是 coverage judge 需要理解复杂的业务逻辑和工具调用结果，如果 judge 本身有系统性偏差，会导致模型学到错误的行为。论文提供的证据包括：helper 是一个独立的推理服务，不被 policy optimization 更新，以避免数据并行协调失败；在 offline evaluation 中使用独立的 LLM judge 来避免 training-time helper 的失败影响最终 benchmark。然而，论文缺少对 helper model 本身准确性的直接评估，例如 coverage judge 与人类判断的一致性，或 tool emulator 与真实工具输出的一致性，这使得无法确认生成的 reward 信号是否真正可靠。\n\n### § 10 最小复现实验\n\n在一周时间内，可以验证 specification-driven task construction 和 gated coverage reward 是否能提升多轮工具使用能力这一核心 claim。使用公开的 Tau2Bench (Airline domain) 作为工具集合和可执行环境，合成多轮交互数据。实现上，使用一个较小的开源模型如 Llama-3-8B 作为 policy，使用另一个 frozen model 如 GPT-4o-mini 作为 helper（customer simulator 和 coverage judge）。实现 Agent Script 的简化版本或直接合成工作流结构，生成 typed workflow graph。实现 gated coverage reward：coverage rate 乘以 duplicate-call gate，并要求需要数据的子问题必须由工具调用支持。使用 GRPO 进行训练。测量指标是在 BFCL multi-turn 子集或 Tau2Bench 上评估模型的准确率，对比基线模型和经过 RL 训练的模型。如果 RL 训练后的模型在多轮工具使用准确率上显著高于基线（例如提升 5 个百分点以上），则支持 specification-driven RL 能提升多轮工具使用的 claim；如果没有提升或下降，则反驳该 claim。同时观察训练过程中 reward 的稳定性，验证 scale-dependent stability 的发现。", "research_value": "### § 11 最强反例设计\n\n如果我要对 Salesforce Koa 提出最有力的攻击，我会设计一个 **“Helper Distribution Shift”** 实验，以挑战其核心假设：即 frozen helper model 能够准确模拟真实环境并生成可靠的 reward 信号。具体而言，我会质疑论文所观察到的 multi-turn tool use 提升是否真正源于模型掌握了企业工作流的 agentic reasoning，还是仅仅因为 policy 过拟合了 frozen Nano-30B helper 的特定行为分布和 judge 偏好。在这个反例实验中，我会保持训练后的 Salesforce Koa policy 不变，但在评估阶段引入 distribution shift：将训练时使用的 frozen Nano-30B helper 替换为具有不同风格、对话习惯或系统性偏差的另一个 LLM（例如 GPT-4o 或经过不同 post-training 的 Llama 变体）来扮演 customer simulator 和 tool emulator，同时使用独立的人类标注或更强的 frontier model 来充当 ground-truth coverage judge。如果 Salesforce Koa 的核心 claim 成立，即它学到了通用的、spec-driven 的多步工具调用与延迟决策能力，那么在替换 simulator 后其任务完成率应该保持相对稳定。然而，我预测其 performance 会出现断崖式下跌。这一结果将提供一种具体的替代解释：policy 在 GRPO 训练中并未学到真正的环境交互逻辑，而是学到了如何“作弊”或迎合 Nano-30B simulator 的特定交互模式（例如利用其特定的 prompt 弱点套取信息，或生成能被 Nano-30B coverage judge 宽松判定的特定格式响应）。这种 reward hacking 现象在真实的企业部署中是可预测且致命的，因为真实用户的表达方式和企业 API 的异常返回模式远比单一 frozen helper 的分布复杂，一旦脱离这个“温室”环境，模型学到的策略将直接失效。\n\n### § 12 Follow-up Research Idea\n\n基于 Salesforce Koa 依赖静态 frozen helper 导致 simulation-to-reality gap 的核心局限，我提出一个非增量的 novel research idea：**Adversarial Co-evolutionary Spec-Driven RL (ACES-RL)**，将 agent post-training 从“静态环境模拟”重构为“动态对抗博弈”。驱动这一想法的未满足需求是：声明式规范本质上是对真实世界的抽象，而用单一 frozen model 将其具象化为训练环境，必然产生可被 policy 利用的 blind spots，导致 reward hacking。为了打破这一局限，我们可以借鉴 Multi-Agent Reinforcement Learning (MARL) 和 Adversarial Inverse Reinforcement Learning (AIRL) 的思想，将原本静态的 helper 升级为一个具有自身 reward function 的 learnable adversary。在这个新 framing 下，Agent Script 不再仅用于生成固定任务，而是定义了 adversary 的 action space 和约束边界：adversary 的目标是在不违反 spec 逻辑的前提下，主动探索和构造最难、最边缘的 customer persona 或 tool emulator 响应，以最小化 policy 的 grounded reward；而 policy 则试图在对抗性环境中最大化任务完成率。两者的 reward 形成零和或非零和博弈，通过轮流更新实现 co-evolution。第一个实验将设计一个 controlled adversarial training setup：在 Tau2Bench (Airline domain) 上，使用两个同架构的较小模型（如 Llama-3-8B）分别初始化 policy 和 adversarial helper。在每轮 GRPO 中，adversary 先通过 gradient descent 生成使当前 policy 失败率最高的对话前缀和工具异常返回，随后 policy 在此对抗分布上进行 RL 更新。我们将评估这种 co-evolved policy 在面对完全 OOD 的真实人类对话测试集时的 robustness 和 recovery 能率，并与 Salesforce Koa 的 frozen-helper baseline 进行对比。这一提议与已有工作的根本区别在于：它摒弃了 LLM-as-a-judge 或 LLM-as-simulator 中模型固定不变的假设，首次将 declarative agent specification 转化为动态对抗博弈的规则约束，从而将模型训练的焦点从“拟合固定环境”转移到“学习对环境扰动的鲁棒性”，为 enterprise agent 的 post-training 打开了一个全新的自适应方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zixiang Chen\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Sufeng Niu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Yingchi Liu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Wenting Zhao\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Akshara Prabhakar\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Shubham Mehrotra\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Bin Bi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhujun Lan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Katherine Tan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Mohammad Ramezanali\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Tulika Manoj Awalgaonkar\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Monojit Banerjee\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jielin Qiu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shiva Kumar Pentyala\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhepeng Cen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Anupam Tripathi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ali Ziaei\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Regunathan Radhakrishnan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Darvish Lee Shadravan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shelby Heinecke\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Sitaram Asur\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Silvio Savarese\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"James Zhu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Phil Mui\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Huan Wang\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Salesforce Agentforce \u0026 AI Research\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution (co-first authors).\"},\n    {\"marker\": \"†\", \"text\": \"Co-corresponding authors.\"}\n  ]\n}\n```", "summary_translation": "我们提出了 Salesforce Koa，这是一个企业级语言模型，通过使用 Group Relative Policy Optimization (GRPO) 的 reinforcement learning 对 open-weight 的 Nemotron-3-Super-120B foundation model 进行 post-training 构建而成。Salesforce Koa 在公开和合成生成的数据上进行训练，不包含任何客户数据，旨在提高 tool use 和 agentic 能力，同时保持强大的通用性能。其独特的组件是一个 simulation-to-reward pipeline，该 pipeline 将 workflow specifications 扩展为 persona-conditioned 的多轮任务，这些任务的 task-resolution rewards 基于针对数据依赖请求的成功 tool use。对于企业领域，这些 specifications 使用 Agent Script 编写，Agent Script 是 Salesforce 用于构建 Agentforce agents 的 declarative language；对于公开的 tool-use 领域，我们直接合成 workflow structure。相同的 simulation 和 grounded-reward machinery 在两者中驱动 GRPO。在公开的 tool-use、agentic-reasoning 和企业 Customer Relationship Management (CRM) benchmarks 上，Salesforce Koa 相比其 open-weight 基础模型有所提升，在多轮 tool use 上的提升最为明显，并超越了一个强大的专有 baseline，但仍低于最强的 frontier models。这些结果表明，specification-driven reinforcement learning 是将 open-weight foundation models 专门化于企业 agentic 任务的一条实用路径。"}]}], "2026-09-14": [{"name": "Embodied \u0026 Domain-Specific Agents", "count": 4, "papers": [{"title": "Agent as Policy for Robotic Manipulation", "arxiv_id": "2609.12541", "authors": "Mengzhao Jia, Yang Lin, Xixin Zhang, Zhihan Zhang, Xiaobai Liu, Meng Jiang", "summary": "We demonstrate that a general-purpose agent can directly drive a physical robot throughout task execution without any task-specific or environment-specific training. We introduce Agent as Policy (AGP), which places task planning and execution under the agent's control. Given a task and a robot interface, the agent interprets visual evidence, writes executable programs, issues motion commands, and revises its actions in response to physical outcomes. This brings the agent's reasoning and programming capabilities into continuous interaction with the physical world. We study AGP across multiple real-world manipulation tasks spanning precision manipulation, dynamic motions, and deformable objects. These include assembly from human videos, block construction from goal images, die reorientation, targeted throwing, and bimanual towel folding. AGP achieves success rates of 100%, 100%, and 80% on three block construction configurations. These findings establish a path for general-purpose agents to act as robotic policies, extending their autonomy to physical manipulation through runtime reasoning, programming, and interaction.", "category": "cs.CL", "cluster": "Embodied \u0026 Domain-Specific Agents", "tags": ["cs.CL"], "filter_reason": "该论文的核心贡献是提出“Agent as Policy (AGP)”框架，将通用LLM智能体直接作为物理机器人操作的控制策略，涉及智能体的规划（任务分解）、工具使用（机器人接口、编程）、自我修正（根据物理结果修订动作）等核心智能体能力。虽然应用场景是机器人操作，但论文的核心机制是智能体在物理世界中的持续推理、编程和交互，属于单智能体（Agentic）方向，且包含自我演化/自我修正元素（根据物理反馈调整行为）。这符合筛选标准中“保留”的条件：核心是关于构建LLM智能体的方法论，且涉及智能体的规划、工具使用、自我反思等能力。同时，该论文不属于被排除的类别（如非演化型应用、非Agentic推理、基础设施、安全、多模态核心、图相关、多智能体拓扑等）。因此，应保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：一个 general-purpose 的 multimodal large language model (MLLM) agent 能否在没有任何 task-specific 或 environment-specific training 的条件下，直接作为 robot policy 驱动物理机器人完成 diverse manipulation tasks？具体而言，作者引入 **Agent as Policy (AGP)** 框架，将 task planning 与 execution 的完整控制权交给 agent——由 agent 自主决定观察什么、如何解释视觉证据、编写何种 executable program、发出何种 motion command，并根据物理执行反馈修正后续动作。这一问题的重要性在于：物理 manipulation 任务本质上要求 agent 能够在 runtime 联合推理当前场景状态、已尝试的运动及其结果，从而灵活调整感知解释方式和动作生成策略。例如，一次失败的 insertion 可能需要 agent 主动获取更近的视角、修正对齐估计或改变接近方向——这种将 perception、motion generation 与 recovery 融为一体的闭环决策能力，是现有方法难以实现的。解决这一问题能够证明 foundation MLLMs 的视觉感知与推理能力足以支撑 zero-shot manipulation，为通用机器人控制开辟一条无需 task-specific training data 的新路径，同时通过 runtime programming 和 persistent experience reuse 降低机器人行为开发的工程成本。\n\n### § 2 前人工作与不足\n\n将 agent 引入机器人控制的研究此前主要沿两条路径展开，但均存在结构性局限。第一条路径是 **program synthesis and refinement**，以 Code as Policies (Liang et al., 2022)、ProgPrompt (Singh et al., 2022)、RoboScript (Chen et al., 2024) 和 RoboCodeX (Mu et al., 2024) 为代表，由 agent 预先生成可执行代码或 computation graph 供机器人运行。这类方法的根本限制在于：生成的 program 必须通过显式规则表达 runtime decisions，而物理环境中的不确定观测和意外结果难以被预先枚举为规则——例如 insertion 失败后需要根据实际偏移量动态调整 approach direction，这要求感知与动作生成在 runtime 紧密耦合，而非依赖预先编写的 if-then 逻辑。第二条路径是 **runtime policy orchestration**，以 SayCan (Ahn et al., 2022)、Inner Monologue (Huang et al., 2022)、RoboClaw (Li et al., 2026a) 和 Harness VLA (Zhang et al., 2026) 为代表，agent 根据任务目标和执行反馈选择和排序已有的 learned skills 或 vision-language-action (VLA) policies。这类方法将 skill selection 与 motion generation 解耦：agent 仅控制\"下一步执行哪个 policy\"，而实际运动能力受限于被调用的 policy 本身能完成的动作范围，agent 无法在 motion 层面根据新物理证据进行细粒度修正。此外，直接学习 visuomotor policies 的方法如 Diffusion Policy (Chi et al., 2023)、RT-2 (Brohan et al., 2023)、OpenVLA (Kim et al., 2024) 和 π₀ (Black et al., 2024) 虽能从 trajectory data 中学习 action generation，但需要大量 task-specific 训练数据，且难以在 unseen 环境中 zero-shot 执行。AGP 的关键区别在于：它不将 agent 的角色限定为 program generator 或 policy orchestrator，而是让 agent 本身在整个 execution loop 中充当 policy，赋予其对 perception、geometry computation、motion planning 和 recovery 的完全自主权，使 reasoning 和 programming 能力与物理世界持续交互——这正是 prior methods 因架构分离而无法实现的核心能力。", "core_insight": "### § 3 重建作者的思考路径\n\n研究的起点是一个清晰的观察：MLLM 驱动的 agent 在数字任务上已经相当成熟，但当它们被引入机器人 manipulation 时，出现了两条路径，且各有结构性缺陷。第一条路径是让 agent 预先生成可执行程序——这类程序本质上是静态的，必须用显式规则编码所有 runtime 决策，但物理世界充满不确定性：插入失败后该换角度还是换视角？抓取滑落后该重新对齐还是重新定位？这些决策依赖于执行时才出现的证据，无法事先穷举。第二条路径是让 agent 编排已有的 learned policies——agent 只能选择\"下一步运行哪个 skill\"，而 motion generation 仍被底层 policy 的能力上界锁死，无法根据当前场景的细微差异调整动作本身。\n\n这两条路径的共同问题是：它们都在 agent 与物理执行之间插入了某种固定中介——要么是预编译的程序，要么是预训练的 policy——而这个中介恰恰切断了\"观察→推理→动作\"的闭环。物理任务的核心难点不在于规划本身，而在于执行过程中需要根据物理反馈联合调整感知解释和动作生成。比如一次失败的插入，可能需要更近的视角、修正的对齐估计、或完全不同的接近方向，这要求决策者能同时看到当前场景、刚才尝试的动作、以及它的物理结果。\n\n由此自然产生一个推论：既然 MLLM 本身已经具备视觉感知、推理和编程能力，而 coding agent 的工具使用、持久工作空间、反馈循环等机制也已成熟，为什么不直接让 agent 在 runtime 持续地做这些事——自己决定观察什么、如何解释证据、编写什么程序、请求什么动作——而不是把它的输出固化成某种中间产物？关键在于把 agent 保持在决策回路中，让它每次收到物理反馈后都能重新评估并调整下一步，而不是把控制权交给一个事先定义好的程序或 policy。\n\n实现上需要解决一个工程问题：如何让 coding agent 与物理机器人对接。答案是构建一个 bridge，暴露校准过的观察（相机图像、深度、机器人状态）、几何查询和运动命令，使 agent 的计算能 ground 在真实的机器人坐标系中。Agent 在 runtime 编写 Python 脚本来处理图像和深度数据、估计物体几何、计算目标 gripper pose，然后通过接口提交运动请求；执行后，新的观察和运动反馈又成为下一步推理的输入。这样，agent 的推理和编程能力就被拉入与物理世界的持续交互中，而无需任何 task-specific 训练。\n\n### § 4 核心 Intuition\n\n先前方法之所以失效，是因为它们都在 agent 与物理执行之间插入了固定中介——预生成的程序无法应对 runtime 不确定性，预训练的 policy 将 motion generation 与推理解耦——从而切断了根据物理反馈闭环调整的能力。AGP 的核心 intuition 是：不要中介，让 agent 自己就是 policy，在 runtime 持续地决定观察什么、如何解释、编写什么程序、请求什么动作，每次物理反馈都直接 inform 下一个决策。这使得感知解释、运动生成和错误恢复的控制权统一留在 agent 手中，而非分散到静态规则或固定 skill 里，从而实现 zero-shot 的灵活适应。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n                AGP Pipeline (§3)\n Task Input ──▶ Prep Agent ──▶ Task Definition\n (Vid/Img/Lan)  (once/type)   (goal, constraints, I)\n                                  ▼\n ┌─────────── Runtime Execution Loop ──────────┐\n │ Execution Agent (MLLM, θ fixed) ◀──────┐    │\n │ u_k ~ π_θ(·|g,I,H_k,W_k), W_k          │    │\n │      ▼                                  │    │\n │ Agent-Robot Bridge (§3.2)               │    │\n │  Robot→Agent: Images, Depth, State      │    │\n │  Agent→Robot: Move, Gripper, Observe    │    │\n │      ▼                                  │    │\n │ Robot Controller (IK, Trajectory)       │    │\n │      ▼                                  │    │\n │ Motion Exec → Feedback + New Obs ───────┘    │\n └──────────────────────────────────────────────┘\n Output: Physical Task Completion (verified)\n```\n\nAGP 的完整 pipeline 分为两个阶段。**Task Preparation** 阶段（§3.1）仅在任务类型首次引入时运行一次：Preparation Agent 读取用户的 task input（video、image 或 language 指令），生成可复用的 Task Definition，其中包含 goal、constraints、completion criteria 以及 robot interface 的访问规则。后续同一类型的任务实例直接加载该定义，跳过准备阶段。\n\n**Runtime Execution Loop** 是 AGP 的核心（§3.1–§3.3）。Execution Agent 是一个参数固定的 MLLM（如 GPT-6 Astra），它接收 Task Definition 和 robot interface 文档，在本地 Workspace $W_k$ 中维护脚本、笔记和观测数据。每一步，agent 根据当前对话历史 $H_k$ 和 workspace 状态 $W_k$，通过策略 $\\pi_\\theta$ 采样一个 tool call $u_k$（公式 1）。该 tool call 可能是获取观测、编写 Python 程序计算几何量、或提交 motion command。\n\n**Agent-Robot Bridge**（§3.2）是 agent 与物理机器人之间的双向接口。Robot→Agent 方向提供 wrist camera 的 RGB-D 图像（640×360）、overhead camera 的 RGB 图像（1920×1080）以及通过 forward kinematics 计算的 end effector pose 和 joint positions。Agent→Robot 方向接受 observation requests 和 action requests，后者包括 `move_ee`（指定 end effector 位姿）、`move_joints`（指定关节角）和 `gripper`（控制夹爪开合）。Robot Controller 使用 Mink 库进行 inverse kinematics 计算，生成满足 workspace 和 motion limits 的 joint trajectory，并通过 motor feedback 跟踪执行。\n\n**Feedback 与 Adaptation**（§3.3）构成回路：motion 执行完成后，bridge 返回 updated state、target errors 和新的观测图像。Agent 利用这些反馈修正估计并调整后续动作——例如插入失败后重新估计对齐偏移并修改接近方向。Motion execution 与 agent inference 独立运行，允许机器人在执行已提交动作的同时 agent 进行推理。整个过程中模型参数 $\\theta$ 保持固定，所有适应通过 session 内的测量更新、程序修改和决策调整实现。\n\n### § 6 核心数学推导\n\n本文没有复杂的数学推导，仅有一个形式化定义（公式 1，§3.1）：\n\n$$u_k \\sim \\pi_\\theta(\\cdot \\mid g, I, H_k, W_k)$$\n\n这个公式的 intuition 是：将 agent 的 tool selection 过程建模为一个条件分布的采样。在每一步 $k$，agent 面对的是一个条件概率问题——给定 task specification $g$（包含 prompt 和参考材料）、robot interface 文档 $I$、截至该步的对话历史与 tool 执行结果 $H_k$、以及当前 workspace 中的脚本和观测文件 $W_k$，从策略 $\\pi_\\theta$ 中采样出下一个 tool call $u_k$。$\\theta$ 是 MLLM 的固定参数，整个执行过程中不更新。这个公式本质上是对 \"agent 即 policy\" 这一核心思想的数学表达：agent 的推理和编程能力直接充当了 robot policy，无需额外训练 action policy。公式中不涉及梯度更新或损失函数，因为 AGP 是一个纯 inference 框架，所有适应发生在 workspace 层面而非模型参数层面。\n\n### § 7 实验设计与结论\n\n**问题 1：通用 agent 能否在 zero-shot 条件下直接驱动物理机器人完成多样化 manipulation 任务？** 论文设计了 5 类任务、8 种 configuration 的 real-world 评测（§4.1.2–§4.2.1）：video guided assembly 测试 long horizon reasoning，image guided block construction 测试视觉关系推断与中间稳定性，die flipping 测试 grasp-dependent reorientation，targeted throwing 测试 timed release 的动态动作，bimanual towel folding 测试 deformable object 的协调操作。每次 trial 从 fresh session 开始，模型权重固定，无 prior task experience 或 simulation rehearsal。**答案：** 8 种 configuration 中 7 种达到 ≥80% 成功率，其中 5 种达到 100%（含三种 block construction 和 die flipping）。Deformable object 的 simultaneous folding 最低（3/5），表明协调动态操作可变形物体仍是难点。\n\n**问题 2：不同 agent 平台、模型和 thinking effort 如何影响性能？** 论文在 two pair assembly 任务上系统比较了 Codex 平台下的 GPT-6 Astra（low/medium/high effort）和 GPT-5.6 Sol/Terra/Luna，以及 Claude Code 平台下的 Claude Opus 5 和 Fable 5.1（§4.2.2，Table 2）。所有 configuration 共享相同的 task references、robot functions 和 trial budgets。**答案：** AGP 框架在 Codex 和 Claude Code 上均能完成 assembly，但模型选择显著影响性能。Astra 在三种 effort level 下均保持 5/5 成功，说明该任务上额外 thinking effort 收益有限。Sol 推理成本更低但执行时间更长。Claude Code 内部 Fable 的成功率（3/5）低于 Opus（5/5），且尽管 token 用量更少，时间和成本反而更高。\n\n**问题 3：积累的 task experience 能否提升重复执行的效率？** 论文对 ring assembly 和 two pair assembly 各执行 5 个 cycle，每个 cycle 从 fresh agent context 开始但可读取和更新前序 cycle 保存的 measurements、procedures、corrections 和 scripts（§4.3.1，Figure 2）。**答案：** 效果因任务而异。Ring assembly 在第一个 cycle 后显著加速并保持稳定，而 two pair assembly 的执行时间波动并回到接近初始值，仅 experience writing 本身变快。这表明积累经验对部分任务有效，但对复杂任务的执行时间改善有限。\n\n**问题 4：大模型积累的经验能否迁移到更小的模型？** 论文将 GPT-6 Astra 在 5 次 two pair assembly 中保存的 geometry、procedures、corrections 和 scripts 以只读方式提供给 GPT-5.6 Terra，与 Terra 无经验基线对比（§4.3.2，Figure 3）。**答案：** 成功率从 1/5 提升至 2/5，成功 trial 的完成时间和 token 用量均下降。这提供了经验跨模型迁移的初步证据，但成功样本量较小，结论强度有限。", "additional_insights": "### § 8 Take-aways\n本文提出了 Agent as Policy (AGP) 框架，直接将通用多模态大语言模型 agent 作为机器人的控制策略，无需进行 task-specific 或 environment-specific 的策略训练。AGP 通过 runtime programming 赋予 agent 完全的自主权，使其能够在执行过程中解释视觉证据、编写可执行 Python 程序、下发运动指令，并基于物理反馈修正后续动作。在真实机器人平台的广泛测试中，AGP 在八个任务配置中的七个达到了至少 80% 的成功率，特别是在 block construction 和 die flipping 任务中实现了 100% 的成功率，证明了 foundation MLLMs 在 zero-shot physical manipulation 中的有效性。然而，该方法在执行效率和成本上存在显著瓶颈，单次成功任务的完成时间在 20.6 到 54.3 分钟之间，且平均推理成本高达 7.46 至 27.41 美元。经验复用实验表明，将先前积累的执行经验（如脚本、测量值）保存并传递给后续的 agent，能够在部分任务中缩短执行时间，甚至能帮助较弱的模型（如 GPT-5.6 Terra）提升成功率并降低 token 消耗。\n\n### § 9 最脆弱的假设\nAGP 方法最核心且最脆弱的假设是：通用大模型具备足够精确的 3D 空间几何感知与数学计算能力，能够仅通过 camera observations 和 depth 数据，在 runtime 编写出可靠的位姿估计算法并生成精确的 motion commands。如果这个假设不成立，agent 编写的程序将会产生错误的坐标变换或逆运动学求解，导致机器人动作失效甚至发生危险碰撞，整个 zero-shot manipulation 的闭环将直接崩溃。在实际场景中，这个假设极易不成立，因为大模型在处理像素到物理坐标系转换、点云配准、以及复杂的奇异值分解（SVD）等几何运算时，极易产生数值幻觉或逻辑错误，且微小的标定误差会被放大到不可接受的程度。论文虽然展示了部分成功案例（如附录 E 中 `fit_head.py` 和 `triangulate.py` 的代码片段），但缺乏对模型生成几何代码准确率的定量统计，且从 simultaneous towel folding 任务仅有 60% 成功率和整体极高的执行时间来看，模型在复杂空间推理和代码调试上消耗了大量资源，这侧面印证了该假设在面临高精度需求时极其脆弱。\n\n### § 10 最小复现实验\n如果有一周时间，可以通过在仿真环境中复现 \"Block construction from goal images\" 任务来验证 AGP 的核心 claim。使用 PyBullet 或 MuJoCo 搭建一个包含若干彩色方块和虚拟机械臂的桌面环境，并配置一个固定视角的 overhead camera 获取 RGB-D 图像。接入 GPT-4o 或 Claude 3.5 Sonnet 等 MLLM，为其提供获取图像、获取机器人状态以及控制末端执行器位姿的 Python API 接口。在实验中，向 agent 提供一张目标金字塔结构的图像，要求其在一个 fresh session 中自主编写代码识别方块位置、规划搭建顺序并调用 API 控制机械臂完成搭建。测量指标包括任务成功率、完成时间以及 tok
