果归因谬误。我们可以设计一个“虚假相关性陷阱（Spurious Correlation Trap）”实验，证明该框架可能将环境噪声或偶然成功错误地固化为“技能”，从而在分布外（Out-of-Distribution, OOD）场景下导致灾难性失败。\n\n具体而言，在 **AppWorld** 或 **WebShop** 环境中构造一类任务，其中某个特定的、与任务目标无关的 API 调用（例如 `check_battery_status` 或 `scroll_to_bottom`）在训练数据中恰好与高奖励轨迹高度共现。由于 **SkillForge** 依赖教师 LLM 从轨迹中归纳技能，且验证机制仅基于统计上的成功率（$\\hat{p}_s$），如果该无关动作在训练集中偶然出现在成功路径中，教师 LLM 可能会将其归纳为一个“必要前置步骤”的技能（例如 `[Always Check System Status Before Action]`）。由于该技能在训练期间被频繁调用且伴随高成功率，其 **Underperformance Score** 会很低，从而通过验证并被保留。\n\n然而，当测试集分布发生轻微偏移（例如，某些任务中检查状态会导致超时或无关副作用），Agent 会因过度依赖该“伪技能”而失败。相比之下，不使用显式技能调用的基线模型（如 Vanilla RL 或 Bulk Injection）虽然效率较低，但不会将这种局部相关性硬编码为全局策略。此外，可以论证 **GRPO** 在优化 `\u003Cskill_call\u003E` 标签时，实际上是在优化一个离散的、稀疏的决策空间，这可能导致策略陷入局部最优，即 Agent 学会“为了调用技能而调用技能”，而非真正理解技能背后的语义逻辑。这种“仪式化行为（Ritualistic Behavior）”在短期指标上表现良好，但缺乏真正的泛化能力，从而挑战了论文关于“技能库包含通用决策原则”的核心主张。\n\n### § 12 Follow-up Research Idea\n\n基于 **SkillForge** 对教师 LLM 归纳能力的高度依赖以及技能验证的滞后性，我提出一个全新的研究方向：**Self-Correcting Skill Topology via Causal Discovery（基于因果发现自修正技能拓扑）**。\n\n**(a) 驱动局限与未满足需求：**\n当前方法将技能视为扁平的、独立的文本单元，依赖外部教师 LLM 进行事后归纳和修订。这不仅计算昂贵，而且容易受到归纳偏差的影响。更重要的是，技能之间往往存在隐含的依赖关系（例如，技能 B 必须在技能 A 之后执行），但 **SkillForge** 并未显式建模这种结构。现有的验证机制是反应式的（Reactive），即在技能表现不佳后才进行修订，缺乏前瞻性的结构约束。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴**因果发现（Causal Discovery）**和**程序合成（Program Synthesis）**领域的思想。不再将技能视为静态文本，而是将其建模为有向无环图（DAG）中的节点，边表示因果依赖或执行顺序。利用**结构因果模型（Structural Causal Models, SCM）**来推断技能之间的因果效应，而非仅仅依赖统计相关性。\n\n**(c) 第一个实验设计：**\n构建一个名为 **CausalSkillNet** 的框架。在训练过程中，不仅记录技能的调用频率和成功率，还记录技能调用的序列上下文。使用轻量级的因果发现算法（如 PC 算法或 NOTEARS）在线推断技能之间的依赖关系，构建一个动态的技能拓扑图。当 Agent 执行任务时，检索器不仅返回 Top-K 技能，还返回一个子图，指导 Agent 按照因果顺序调用技能。\n\n**实验对比：**\n在 **ALFWorld** 上，对比 **SkillForge** 与 **CausalSkillNet**。重点评估在“长尾任务”和“多步依赖任务”上的表现。预期结果是，**CausalSkillNet** 能够更有效地避免“虚假相关性陷阱”，因为它要求技能之间的调用必须有因果支持，而不仅仅是统计共现。此外，该框架可以减少对教师 LLM 的依赖，因为拓扑结构的更新可以通过算法自动完成，而非依赖 LLM 的反思。这将打开一个将 RL 技能学习与因果推理相结合的新研究方向，强调知识的结构化而非仅仅文本化。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Shidong Yang\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Ziyu Ma\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Tongwen Huang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xucong Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Renda Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yiming Hu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yong Wang\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Xiangxiang Chu\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"AMAP, Alibaba Group\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution.\"},\n    {\"marker\": \"†\", \"text\": \"Project lead and corresponding author.\"}\n  ]\n}\n```", "summary_translation": "大型语言模型（LLM）智能体通过强化学习（RL）进行训练，以应对复杂的决策任务。然而，大多数经过RL训练的智能体仍具有阶段性特征，无法在不同阶段间积累可复用的知识。近期的基于技能的方法（如SkillRL）试图通过从原始轨迹中提取技能来解决这一问题，但将技能库视为仅追加的存储库，而未验证所存储的技能是否依然有效。在本文中，我们提出了SkillForge，这是一个支持技能持续演化的框架，使技能能够通过环境交互得到验证和精炼。通过在智能体交互过程中显式化技能的使用，RL可以直接优化环境动作和技能调用决策。SkillForge进一步引入了基于证据的技能验证和多路径技能归纳，使技能库在持续增长的同时保持其质量。在ALFWorld、WebShop和AppWorld上的大量实验表明，SkillForge始终优于SkillRL，证明了持续验证的技能在训练更强LLM智能体方面的有效性。"}, {"title": "ADE: Agentic Data Evolution Framework for Human-Centered Objectives", "arxiv_id": "2608.23719", "authors": "Yang Yu, Yilin Jiang, Zexuan Fei, Yiming Luo, Xingkai Song, Kaiyi Huang, Aimin Zhou, Xin Lin, Fei Tan", "summary": "Aligning large language models to human-centered objectives is difficult when targets are non-executable and context-dependent, limiting reliable verification and scalable supervision. Although synthetic data expands coverage, weak verification shifts the bottleneck from generation to selection. Noisy signals destabilize iterative refinement and can cause silent regressions. We propose Agentic Data Evolution (ADE), a data-centric framework that organizes synthetic supervision as evolving data snapshots. ADE improves data snapshots through a closed-loop Observation-Variation-Selection (OVS) procedure, where a steady-state admission mechanism acts as a quality ratchet that conservatively gates updates for sustained cross-round improvement. We validate these improvements through complementary intrinsic trend tracking and extrinsic post-training evaluation. On DEV300, ADE raises the intrinsic win rate from 50% to 75.81% and the extrinsic win rate from 55.20% to 68.86%, consistent performance gains across diverse benchmarks. Blind expert evaluation further confirms this, with a 66.11% preference for evolved answers. These gains extend across post-training methods, model scales, and tasks beyond the target weakly verifiable educational objectives. Resources are available at https://github.com/ZeroLoss-Lab/Agentic-Data-Evolution.", "category": "cs.CL", "cluster": "Self-Improvement \u0026 Recursive Evolution", "tags": ["cs.CL"], "filter_reason": "该论文符合“自我演化 (Self-Evolving)”和“LLMs Improving LLMs”的研究方向。\n\n1. 核心机制匹配：论文提出了“Agentic Data Evolution (ADE)”框架，其核心是一个基于智能体（Agentic）的闭环迭代过程（Observation-Variation-Selection, OVS）。这完全符合筛选标准中关于“自我演化”的定义，即智能体通过经验、反馈或环境观测进行自我完善和迭代。\n2. Agentic 属性明确：标题和摘要明确使用了“Agentic”一词，且描述中指出该框架利用智能体来组织合成监督数据，并通过“steady-state admission mechanism”作为质量棘轮（quality ratchet）来保守地门控更新。这属于智能体在数据生成和筛选过程中的自主决策与演化能力，而非简单的静态数据处理。\n3. 符合保留规则：根据筛选标准第一步中的保留规则：“如果论文的核心机制是 self-evolving / self-improving / iterative improvement / LLMs improving LLMs... 应优先保留”。ADE 框架正是通过智能体的迭代演化来改进数据快照，进而提升模型性能，属于典型的“LLMs Improving LLMs”或“Agentic Self-Evolution”范畴。\n4. 排除项检查：虽然涉及“Alignment”（对齐），但论文的重点不在于安全对齐（Safety/Alignment）本身，而是利用 Agentic 机制解决对齐过程中数据验证难的问题，属于方法论创新。同时，它不涉及被排除的图技术、纯基础设施或非演化的应用。\n\n综上，该论文研究的是智能体驱动的数据演化机制，属于 Agentic AI 自我演化方向的前沿工作，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文针对的核心研究问题是：在**Human-Centered Objectives**（如价值导向、情感支持、创新创造）等**Weakly Verifiable**（弱可验证）场景下，如何构建高质量、非退化的合成监督数据以对齐大语言模型（LLMs）。与数学推理或代码生成等具有确定性反馈的任务不同，教育辅导等人类中心任务的质量评估高度依赖上下文、领域规范和专业标准，缺乏唯一的**Ground-Truth**答案，导致传统的基于执行结果或确定性规则的验证方法失效。\n\n这一问题的重要性在于，随着LLMs在可执行任务上的性能趋于饱和，对齐技术正转向更复杂、更贴近人类真实需求但难以量化的领域。然而，现有的**Synthetic Data**生成方法在弱验证环境下面临“选择瓶颈”：当候选答案生成变得廉价时，核心挑战从生成转移到了筛选。由于缺乏可靠的自动验证信号，迭代优化过程中容易引入噪声，导致**Silent Regressions**（静默退化），即模型在表面流畅度提升的同时，在 pedagogical appropriateness（教学适宜性）或目标对齐上发生隐性倒退。解决这一问题不仅能提升LLMs在智能教育等高 stakes 场景中的可靠性，更为处理其他非执行性、上下文依赖的人类价值观对齐任务提供了通用的数据演化范式。其价值在于通过**Agentic Data Evolution (ADE)**框架，将监督构建从一次性生成转化为持续的**Data Evolution**过程，利用**Observation–Variation–Selection (OVS)**协议和**Steady-State Admission**机制，在无需人工标注的情况下实现数据质量的持续累积提升，并验证了这种提升能泛化到不同的后训练方法、模型规模及域外任务中。\n\n### § 2 前人工作与不足\n\n该问题此前并未得到充分解决，现有研究主要存在以下不足：\n\n1.  **Generate-then-Filter 方法（如 Self-Instruct, Unnatural Instructions）**：这类方法假设选择信号在候选者之间足够稳定，适用于有明确优劣判定的任务。但在弱验证场景下，单一维度的评分或简单的过滤无法捕捉多维度的**Human-Centered Objectives**（如同时兼顾情感支持和价值导向），且无法处理迭代过程中的累积误差，导致数据分布漂移或质量停滞。\n2.  **Self-Improvement 与 Refinement 方法（如 Self-Refine, Evol-Instruct, STaR）**：这些方法通过重写、批评或迭代推理来改进输出，但通常聚焦于**Instance-Level Reasoning**或局部优化。它们缺乏对数据集整体演化的控制，特别是在弱验证下，单次改进可能引入新的偏差，而后续的迭代会基于这些有偏差的数据继续演化，导致**Non-Regression**（非退化）保障缺失。例如，Iterative Self-Refine 在实验中表现出显著的回归，特别是在**Creative Innovation**维度上，因为缺乏对“何时停止更新”或“何时保留父代”的保守机制。\n3.  **Multi-Agent Orchestration 系统（如 Multi-Agent Debate, Verify-Critique Pairs）**：虽然多智能体系统通过角色专业化增强了生成和评估能力，但它们主要面向**Inference-Time Problem Solving**（推理时问题解决），而非数据层面的迭代非退化更新。在数据合成中，多智能体交互往往是一次性的或生成后过滤的，未能形式化地解决在弱验证信号下，如何确保每一轮数据快照（Snapshot）的更新都是基于比较证据的可靠改进，而非噪声放大。\n\n根本原因在于，现有工作大多将数据合成视为**One-Shot Generation**或简单的**Generate-then-Filter**过程，未将**Weak Verification**作为核心设计约束。它们未能解决在缺乏确定性反馈时，如何区分“真正的改进”与“风格偏好变化”或“噪声波动”的问题。ADE 的创新在于引入了**Elitist Preservation**和**Comparative Selection**，通过**Steady-State Admission**机制作为质量棘轮（Quality Ratchet），仅在比较证据支持明确改进时才提交更新，从而在弱验证环境下实现了数据质量的稳定演化。", "core_insight": "### § 3 重建作者的思考路径\n\n在大型语言模型（LLM）对齐领域，数学推理和代码生成等任务因具备可执行反馈（executable feedback）或确定性验证信号，已通过 Self-Refine、Evol-Instruct 等合成数据方法取得了显著进展。然而，当研究视角转向教育辅导、情感支持或价值观引导等“以人为本”（human-centered）的目标时，研究者面临一个根本性的困境：这些目标具有弱可验证性（weakly verifiable），缺乏唯一的 Ground Truth，且高度依赖上下文、领域规范和专业判断。\n\n现有的合成数据范式在此类任务上遭遇瓶颈。传统的“生成后过滤”（Generate-then-filter）方法假设存在稳定的选择信号，但在弱验证场景下，单一维度的评分往往无法捕捉多维度的权衡（例如，回答可能变得更流畅但失去了教学适宜性）。而基于自我改进（Self-improvement）的迭代方法虽然能生成更多候选，却引入了“静默回归”（silent regressions）的风险：由于缺乏可靠的验证机制，迭代过程中接受的微小修改可能在多轮累积后导致语义漂移或偏离核心教学目标。\n\n研究者观察到，问题的核心已从“如何生成候选”转移到了“如何在不确定性下进行选择”。在弱验证条件下，绝对的评分（absolute scoring）往往噪声过大且不可靠，而相对的比较（comparative selection）更能反映细微的质量差异。然而，简单的比较仍不足以防止退化，因为即使当前候选优于其他变异，它也可能不如父代样本。因此，需要一个机制来保守地控制更新，仅在证据充分时接受改进，否则保留现状。\n\n受进化算法中“观察-变异-选择”（Observation-Variation-Selection, OVS）范式的启发，研究者设想将数据构建视为一个连续的数据演化过程，而非一次性生成。通过引入角色专业化的智能体（Agentic Systems），将批评（Critique）分解为维度特定的证据，将变异（Variation）设计为保守与激进两种策略以平衡探索与利用，并引入精英保留（elitist preservation）的准入机制（Admission Mechanism）作为质量棘轮（quality ratchet），可以确保数据快照在多轮演化中实现非退化的持续改进。这一思路旨在解决弱验证下合成监督信号不稳定和迭代累积误差的问题。\n\n### § 4 核心 Intuition\n\n在缺乏确定性验证信号（weakly verifiable）的任务中，合成数据迭代的主要风险并非生成能力不足，而是选择机制的噪声导致的质量退化（silent regressions）。ADE 的核心直觉是将数据构建重构为受控的演化过程，利用相对比较（comparative selection）替代绝对评分来降低噪声敏感度，并通过精英保留的准入机制（elitist admission）作为“质量棘轮”，确保只有在证据确凿时才接受更新，从而在多轮迭代中实现非退化的累积改进。这种方法将瓶颈从“生成多样性”转移到了“保守且可靠的选择”，使得模型能够在不确定的反馈环境中稳定地向人类中心目标对齐。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法是 **Agentic Data Evolution (ADE)**，这是一个面向弱可验证（weakly verifiable）人类中心目标的数据合成框架。其核心思想是将数据构建从“一次性生成”转变为“跨轮次的数据演化”，通过 **Observation–Variation–Selection (OVS)** 协议，利用角色专业化的 LLM Agent 对数据快照进行迭代优化，并引入 **steady-state admission mechanism**（稳态准入机制）作为质量棘轮，防止模型在迭代中出现静默退化（silent regression）。\n\n以下以教育辅导场景中的一个具体问题为例，展示 ADE 的完整 Pipeline：\n\n**场景背景**：\n*   **初始问题 ($q$)**：“当成年人对未成年人使用不当语言或行为时，可以采取哪些措施来保护未成年人的权益？”\n*   **初始答案 ($a^{(0)}$)**：一个包含8个步骤的通用回答（如立即干预、记录证据、报警等），但缺乏针对学校场景的具体责任界定和情感支持细节。\n\n**Pipeline 步骤详解**：\n\n1.  **Observation (观察与路由)**：\n    *   **Dimension Routing**：系统首先通过 `ROUTE` Agent 判断该问题最核心的评估维度。在此例中，被路由至 **Value Orientation (VO, 价值导向)**，因为涉及道德判断和规范约束。\n    *   **Factorized Critique**：`CRITIQUE` Agent 基于 VO 维度的 rubric（评分标准）对 $a^{(0)}$ 进行批判性分析。它指出当前回答虽然全面，但缺乏对“学校场景”下教师/机构具体责任的明确界定，且语气较为机械，缺乏对未成年人心理状态的细腻关怀（即 Affective Support 不足）。这些批判摘要构成证据集 $C$。\n\n2.  **Variation (变异与生成)**：\n    *   基于证据 $C$，`MUTATE` Agent 生成两个候选子代答案：\n        *   **Conservative Proposer (保守提议者)**：生成 $\\tilde{a}_{CONS}$。它在保留原结构的基础上，微调措辞，增加“确保自身安全”的前提，并补充“通知学校负责部门”的具体步骤，旨在低风险地修复明确弱点。\n        *   **Aggressive Proposer (激进提议者)**：生成 $\\tilde{a}_{AGGR}$。它可能重组回答结构，将“心理支持”前置，并引入更具体的对话示例（如“你可以说：‘没关系，你没有做错任何事’”），以更强地体现情感支持和教育规范。\n    *   此时候选池为 $\\{a^{(0)}, \\tilde{a}_{CONS}, \\tilde{a}_{AGGR}\\}$。\n\n3.  **Selection (选择与准入)**：\n    *   **Comparative Selection (`SELECT`)**：`SELECT` Judge 在 VO 维度下比较三个候选者。假设 $\\tilde{a}_{AGGR}$ 因提供了更具体的心理支持话术而被选为优胜者 $\\hat{a}$。\n    *   **Survivor Admission (`ADMIT`)**：这是防止退化的关键步骤。`ADMIT` Gate 将 $\\hat{a}$ 与父代 $a^{(0)}$ 进行最终对比。\n        *   如果 $\\hat{a}$ 在 VO 上明显更好，且没有在其他通用质量维度（如事实准确性）上退化，则返回 `ACCEPT`。\n        *   如果证据不足或存在风险，则返回 `REJECT`，保留 $a^{(0)}$，并将拒绝理由 $r$ 反馈给下一轮的 `MUTATE`，以避免重复同样的错误。\n    *   **结果**：假设 `ACCEPT`，则 $a^{(1)} = \\hat{a}$ 成为新的快照数据。\n\n4.  **Iteration (迭代演化)**：\n    *   上述过程重复进行（如进行 4 轮演化）。在后续轮次中，如果某次变异被 `ADMIT` 拒绝，拒绝信号 $(a^-, r^-)$ 会传递给 `MUTATE`，促使 Agent 进行自我修正。\n    *   **最终输出**：经过多轮 OVS 演化，得到高质量的数据快照 $D^{(T)}$。例如，Round 4 的答案不仅保留了法律建议，还细化了“预防性教育”和“具体心理安抚话术”，显著提升了教育场景下的适用性和规范性。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过**。\n\n本文主要是一个工程框架与方法论论文，侧重于 Agent 协作协议（OVS）的设计和实验验证，而非提出新的数学理论或复杂的推导公式。文中涉及的符号（如 $D^{(t)}$, $\\Phi$, $\\delta$）主要用于形式化描述数据演化过程和决策逻辑，没有需要深入解释的数学推导过程。\n\n### § 7 实验设计与结论\n\n**RQ1: ADE 是否在弱可验证条件下实现了可靠的跨轮次质量提升？**\n*   **实验设计**：进行 **Intrinsic Validation (内在验证)**。在 held-out 数据集 DEV300 上，使用 LLM-as-a-Judge 对演化不同轮次（Round 0 到 Round 4）的答案进行两两比较，计算胜率（Win Rate）。同时设置基线方法（如 Iterative Self-Refine）进行对比。\n*   **结论**：ADE 的胜率随轮次单调递增（从 50% 提升至 75.81%），且未出现后期惩罚。相比之下，基线方法（如 Iterative Self-Refine）在后续轮次中出现显著退化（regression），证明 ADE 的 OVS 机制和稳态准入有效防止了静默退化。\n\n**RQ2: ADE 的提升是否超越了协议特定的偏好，能泛化到下游任务表现？**\n*   **实验设计**：进行 **Extrinsic Validation (外在验证)**。使用演化后的数据快照 $D^{(t)}$ 对目标模型（Qwen2.5-7B）进行监督微调（SFT），然后在独立基准测试（DEV300, Edu-Values, EduBench）上评估模型性能。同时引入 **Human-Calibrated Validation**，由人类专家盲测比较 $D^{(0)}$ 和 $D^{(4)}$ 的答案。\n*   **结论**：在 DEV300 上，使用 $D^{(4)}$ 训练的模型胜率从 55.20% 提升至 68.86%。在 Edu-Values 和 EduBench 上也取得最佳或次佳成绩。人类专家以 66.11% 的多数票偏好演化后的答案，且与自动 Judge 的一致性较高（Cohen’s $\\kappa$ = 0.7149），证明提升是真实且符合人类价值观的，而非过拟合自动评估信号。\n\n**RQ3: ADE 的收益是否可迁移到不同的后训练方法、模型规模及弱可验证目标之外的任务？**\n*   **实验设计**：\n    1.  **方法迁移**：对比 SFT 与 RL 方法（DPO, PPO, GRPO）在 ADE 演化数据上的表现。\n    2.  **规模迁移**：在 72B 模型上验证演化数据的有效性。\n    3.  **领域迁移**：在强可验证任务（MATH-500, ToxiCN）上测试，看是否因专注于教育目标而损害通用能力。\n*   **结论**：\n    1.  RL 方法（如 GRPO）在 ADE 数据上进一步提升了性能，证明收益不依赖于特定的后训练算法。\n    2.  72B 模型同样受益，证明框架具有规模鲁棒性。\n    3.  在 MATH-500 和 ToxiCN 上，使用 $D^{(4)}$ 训练的模型准确率/F1 值均有小幅提升（+1.20%, +1.18%），表明 ADE 不仅没有导致模型能力窄化，反而可能通过提升整体推理和规范意识带来了正向迁移。", "additional_insights": "### § 8 Take-aways\n\nADE 框架的核心贡献在于将弱可验证（weakly verifiable）目标下的数据合成从“一次性生成”重构为“迭代式数据演化”，通过 Observation–Variation–Selection (OVS) 协议解决合成数据中的选择瓶颈。该方法引入“稳态准入机制”（steady-state admission mechanism）作为质量棘轮，仅在比较证据明确支持改进时才接受更新，从而有效防止了迭代过程中的静默退化（silent regressions）。实验表明，ADE 在内在验证（intrinsic validation）中将 DEV300 基准的胜率从 50% 提升至 75.81%，并在外在验证（extrinsic validation）中实现了 68.86% 的胜率，证明了其改进具有跨轮次的稳定性。消融研究证实，维度特定的批评者（dimension-specific critics）和保守型变异（conservative mutation）是防止语义漂移和保持意图一致性的关键组件。人类校准验证（human-calibrated validation）显示专家对演化后答案的偏好率为 66.11%，且与自动评判器具有高度一致性（Cohen’s κ = 0.7149），表明自动信号并未偏离人类价值观。此外，ADE 的增益不仅限于教育场景，还迁移到了 MATH-500 和 ToxiCN 等强可验证任务中，说明其提升的是模型底层的推理与对齐能力，而非仅针对特定协议的过拟合。\n\n### § 9 最脆弱的假设\n\nADE 最脆弱的假设是：**基于 LLM 的比较评判（comparative judging）在弱可验证目标下能够可靠地识别出“真实改进”而非“风格偏好”或“表面流畅度提升”。** 如果这一假设不成立，即评判器无法区分“更好的教学法”与“更华丽的辞藻”，那么 OVS 协议中的 Selection 和 Admission 步骤将错误地保留低质量或退化的样本，导致数据演化方向偏离人类中心目标。在实际中，这一假设可能失效，因为 LLM 评判器往往存在位置偏差、长度偏好或对复杂教育规范（如 affective support 中的细微情感引导）理解不足的问题，特别是在缺乏明确 ground truth 的情况下，评判信号可能充满噪声。论文提供的证据包括：使用多个开源模型（DeepSeek-V3.2, GLM-5, Kimi-K2.5）进行交叉验证，并选择与人类标注一致性最高的 DeepSeek-V3.2 作为主要评判器；同时通过人类专家盲测（blind expert evaluation）确认了自动评判趋势与人类偏好的一致性。然而，论文缺少对评判器在极端边缘案例（edge cases）或高度文化特定情境下失效模式的深入分析，且人类标注者仅三人，样本量较小，可能不足以完全覆盖所有潜在的评判偏差。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 ADE 的核心机制——**OVS 协议中的“稳态准入”（steady-state admission）对防止退化的作用**，而无需构建完整的多智能体系统。具体方案如下：\n1.  **数据**：从公开的教育对话数据集（如 Edu-Values 或自行构建的小型 K-12 辅导问答对）中选取 50-100 个样本作为初始快照 $D^{(0)}$。\n2.  **实现**：使用一个强大的开源 LLM（如 Qwen2.5-72B-Instruct 或 Llama-3-70B）作为统一的“生成器”和“评判器”。实现简化的 OVS 循环：\n    *   **Variation**：对每个答案生成两个变体（一个保守修改，一个激进重写）。\n    *   **Selection**：使用 LLM-as-a-Judge 比较原始答案与两个变体，选出最佳候选。\n    *   **Admission**：关键步骤，实现一个“准入门控”，仅当评判器明确判定候选答案在特定维度（如价值导向）上优于原始答案时才接受更新，否则保留原始答案。\n    *   **对比基线**：实现一个“无条件更新”基线，即每轮强制用最佳候选替换原始答案，无论评判器是否认为其更好。\n3.  **测量**：运行 3-5 轮演化，使用另一个独立的 LLM 作为外部评判器，计算每轮后数据集相对于 $D^{(0)}$ 的成对偏好胜率（pairwise preference win rate）。\n4.  **结果判定**：如果 ADE 的“稳态准入”策略在后续轮次中保持胜率稳定或上升，而“无条件更新”基线出现胜率下降或波动，则支持了 ADE 防止静默退化的核心 claim。反之，若两者表现无显著差异，则说明在该小规模数据上，准入机制的必要性存疑，或评判器噪声过大掩盖了机制效果。", "research_value": "### § 11 最强反例设计\n\n若要挑战 ADE 框架的有效性，最有力的攻击并非质疑其能否提升表面流畅度，而是证明其**Steady-State Admission**机制在弱可验证（Weakly Verifiable）场景下实际上是在进行**Distributional Narrowing**（分布窄化）而非质量提升，即通过过度保守的筛选消除了必要的多样性，导致模型在“安全但平庸”的局部最优解中停滞，从而丧失了对复杂人类价值观的细微捕捉能力。\n\n具体反例设计如下：构建一个针对**Nuanced Ethical Dilemmas**（细微伦理困境）的测试集，其中“正确”答案并非单一的标准操作程序，而是依赖于特定文化语境或利益相关者视角的权衡（例如，在保护未成年人隐私与报告潜在风险之间的微妙平衡）。在此场景下，ADE 的 `ADMIT` Gate 由于缺乏绝对的 Ground-Truth，倾向于选择那些符合通用安全规范、语气平稳且无明显逻辑漏洞的“最大公约数”答案。\n\n**攻击逻辑**：\n1.  **替代解释**：ADE 在 DEV300 上观察到的胜率提升，可能并非源于对 Human-Centered Objectives 的更好对齐，而是源于对 LLM-as-a-Judge 偏好的过拟合。Judge 模型通常偏好结构清晰、语气中立且无争议的回答。ADE 的保守变异（Conservative Proposer）和严格准入机制恰好强化了这种偏好，过滤掉了那些虽然具有创新性或深度共情（Affective Support）但可能因表述独特而被 Judge 误判为“风险”或“偏离主题”的答案。\n2.  **可预测的失败条件**：当任务要求**Creative Innovation**或**Context-Specific Adaptation**时，ADE 会表现出显著的**Diversity Collapse**。例如，在处理需要打破常规思维框架的教育辅导问题时，ADE 演化后的数据快照 $D^{(T)}$ 将比初始快照 $D^{(0)}$ 具有更低的语义熵（Semantic Entropy）。\n3.  **验证实验**：计算演化前后数据集的**Embedding Diversity**（如使用 Sentence-BERT 计算平均余弦距离的倒数）和**Perplexity on Held-out Human Data**。如果 ADE 有效，多样性应保持稳定或适度增加以覆盖更多细微场景；如果反例成立，多样性将显著下降，且模型在需要非标准解决方案的下游任务（如开放式心理咨询模拟）中的表现将低于基线，尽管其在标准化基准（如 Edu-Values）上的评分更高。这将证明 ADE 的“质量棘轮”实际上是一个“多样性过滤器”，在弱验证环境下牺牲了模型的适应性和创造性以换取评估指标的虚假提升。\n\n### § 12 Follow-up Research Idea\n\n基于 ADE 对**Comparative Judging**可靠性的依赖及其在弱验证信号下的局限性，提出一个新的研究方向：**Adversarial Consensus Alignment via Multi-Perspective Stress Testing**（基于多视角压力测试的对抗性共识对齐）。\n\n**(a) 驱动局限与未满足需求**：\nADE 的核心假设是存在一个稳定的、可被 LLM Judge 识别的“改进”方向。然而，在 Human-Centered Objectives 中，往往不存在单一的“更好”，而是存在多个相互冲突但均合理的价值观视角（例如，效率 vs. 公平，安全 vs. 自由）。ADE 的单一维度路由（Dimension Routing）和二元准入（Accept/Reject）机制无法捕捉这种**Value Pluralism**（价值多元性），导致对齐结果偏向于评判器的默认偏见。现有的方法缺乏一种机制来显式地建模和解决这些内在的价值冲突，而非简单地通过保守筛选来规避风险。\n\n**(b) 借鉴相邻领域的方法**：\n借鉴**Multi-Agent Debate**中的**Persuasion Dynamics**（说服动力学）和**Game Theory**中的**Nash Bargaining Solution**（纳什议价解）。不同于 ADE 的线性演化，我们引入一组代表不同利益相关者（Stakeholders）的 Agent（如“学生视角”、“教师视角”、“家长视角”、“伦理学家视角”），它们不仅生成答案，还对彼此的答案进行基于自身价值观的**Critique**和**Counter-Proposal**。\n\n**(c) 第一个实验设计**：\n构建一个**Value-Conflict Dataset**，包含那些没有唯一正确答案、但需要在不同价值观之间进行权衡的问题（例如：“是否应该为了班级整体纪律而公开批评一名有心理创伤的学生？”）。\n1.  **方法**：设计一个**Consensus Evolution Protocol**。初始阶段，各 Stakeholder Agent 生成各自视角下的最优答案。随后，进入多轮**Cross-Perspective Refinement**，每个 Agent 必须吸收其他视角的合理批评，修改自己的答案，以寻求一个能被所有 Agent 接受的“共识解”（Consensus Solution），或者明确标注出无法调和的冲突点。\n2.  **对比**：将 ADE 生成的单一维度优化答案与本方法生成的共识答案进行对比。\n3.  **评估**：不使用单一的 LLM Judge，而是采用**Human Panel with Diverse Backgrounds**（具有不同背景的人类专家组）进行盲测。评估指标不仅包括“整体满意度”，还包括“Perspective Inclusivity”（视角包容度）和“Conflict Resolution Quality”（冲突解决质量）。\n4.  **预期结果**：预期 ADE 在单一维度（如“规范性”）上得分较高，但在“视角包容度”上得分较低，且人类专家更倾向于认为共识答案在处理复杂伦理困境时更具鲁棒性和可接受性。这将证明，在弱验证且价值多元的场景下，**Consensus Building**（共识构建）比**Iterative Refinement**（迭代优化）是更有效的对齐范式。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Yang Yu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Yilin Jiang\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Zexuan Fei\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yiming Luo\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xingkai Song\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Kaiyi Huang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Aimin Zhou\",\n      \"affiliations\": [\n        1,\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xin Lin\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Fei Tan\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\",\n        \"‡\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"East China Normal University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"The Hong Kong University of Science and Technology (Guangzhou)\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Shanghai Innovation Institute\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal contribution.\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding authors.\"\n    },\n    {\n      \"marker\": \"‡\",\n      \"text\": \"Project lead.\"\n    }\n  ]\n}\n```", "summary_translation": "当目标不可执行且依赖上下文时，将大型语言模型与以人为中心的目標对齐十分困难，这限制了可靠的验证和可扩展的监督。尽管合成数据扩大了覆盖范围，但薄弱的验证将瓶颈从生成转移到了选择。噪声信号会 destabilize 迭代优化，并可能导致静默退化。我们提出了 Agentic Data Evolution (ADE)，这是一个以数据为中心的框架，将合成监督组织为不断演进的数据快照。ADE 通过一个闭环的 Observation-Variation-Selection (OVS) 流程来改进数据快照，其中一种稳态准入机制充当质量棘轮，保守地控制更新以实现持续的跨轮次改进。我们通过互补的内在趋势跟踪和外在训练后评估来验证这些改进。在 DEV300 上，ADE 将内在胜率从 50% 提高到 75.81%，将外在胜率从 55.20% 提高到 68.86%，在多样化的基准测试中表现出一致的性能提升。盲法专家评估进一步证实了这一点，对进化后答案的偏好率为 66.11%。这些增益扩展到目标弱可验证教育目标之外的各种训练后方法、模型规模和任务。资源可在 https://github.com/ZeroLoss-Lab/Agentic-Data-Evolution 获取。"}, {"title": "Recursive Experiential-Working Memory Evolution for Long-Horizon Agent Harnesses", "arxiv_id": "2608.24876", "authors": "Zhaochen Yu, Yingcheng Wu, Zhenfei Yin, Kaiyuan Chen, Zhe Zhao, Mengdi Wang, Shuicheng Yan, Ling Yang", "summary": "Recursive self-improvement (RSI) remains hard in long-horizon tasks, where growing histories obscure the task state and misalign skill invocation. We introduce Recuris, a recursive Experiential-Working Memory architecture for long-horizon agent harnesses, in which Working Memory tracks task progress and guides skill selection from Experiential Memory, grounding skill use in current needs rather than the full history. This coupling also turns execution into structured evidence that localizes failures to specific memory components. Across tasks, a fixed Meta-Agent turns that evidence into localized, validation-gated updates to Skill Memory that reshape execution and yield new evidence, forming a bounded recursive memory-evolution loop. Across four long-horizon benchmarks and ten models, Recuris improves task success in 35 of the 37 completed model-benchmark pairs, carrying frontier models to SOTA-level task success: on tau-bench it adds +17.8 points to GPT-5.6 Sol and +15.6 to Claude Opus 5, taking Opus 5 to 87.9%, and +16.6/+13.5 points on Qwen3.6-27B/35B on SkillFlow. The advantage widens as the interaction horizon grows, to +32.2 points on the longest tasks, and common long-horizon failures fall by up to 80%. These results position recursively evolving memory as a scalable foundation for RSI, enabling agents to continuously transform accumulated experience into increasingly effective long-horizon behavior. Code: https://github.com/Gen-Verse/Recuris", "category": "cs.CL", "cluster": "Self-Improvement \u0026 Recursive Evolution", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving, Long-Horizon Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：在长视界（long-horizon）任务中，如何实现大语言模型（LLM）智能体的**递归自我改进（Recursive Self-Improvement, RSI）**。具体而言，随着交互历史的不断增长，智能体往往难以维持对当前任务状态（task state）的准确理解，导致从经验记忆（Experiential Memory, EM）中检索的技能与当前需求错位，且执行失败难以被精确定位到具体的记忆组件进行修复。现有的智能体框架通常依赖固定的记忆机制或基于最终成败的粗粒度反馈，无法在长序列交互中持续对齐经验与当前执行需求，也无法将执行轨迹转化为结构化的诊断证据以指导记忆系统的局部进化。\n\n这一问题的重要性在于，长视界任务是衡量智能体自主执行能力的终极试金石，而RSI是实现智能体从“一次性工具”向“持续进化系统”转变的关键。如果无法解决状态追踪与技能调用的动态对齐问题，智能体在复杂任务中会迅速陷入“目标迷失”或“技能误用”，导致性能随交互步数增加而急剧下降。此外，若缺乏细粒度的失败归因机制，记忆更新往往沦为对整体记忆的盲目重写，不仅效率低下，还极易引发灾难性遗忘或性能退化。解决这一问题能够带来显著价值：首先，它使智能体能够在不更新基础模型权重的前提下，通过外部记忆控制层的递归进化实现性能的持续跃升，如论文所示，该方法能使前沿模型在长视界基准测试中获得显著提升（如GPT-5.6 Sol提升17.8分）；其次，它提供了一种可扩展的RSI基础架构，将累积的经验转化为日益有效的长期行为，同时通过验证门控（validation-gated）机制确保进化的稳定性与安全性，避免了无约束自我修改带来的风险。\n\n### § 2 前人工作与不足\n\n该问题此前并未得到充分解决，现有的基于记忆的智能体框架（memory-based agent harnesses）在长视界任务中表现出明显的局限性。最相关的先前工作包括**Voyager**、**AWM**、**ExpeL**、**Buffer of Thoughts**以及**Agent Skills**等，这些方法主要关注**存储什么**（what to store），即如何以代码、自然语言工作流或思维模板等形式存储可复用的经验。然而，它们在**何时以及如何调用**（when and how to invoke）这些技能方面存在根本缺陷。例如，许多系统要么将技能作为固定块注入上下文，要么让模型自行决定调用时机，这导致在长交互中，模型往往无法从混杂了过时信息、已完成步骤和执行噪声的全量历史中准确检索出当前所需的技能。即使如**AutoGuide**或**SGDR**等尝试基于执行上下文进行检索，其条件信号也仅是原始观察（raw observation），通过相似度匹配环境当前状态，而非基于智能体已确认的**任务状态（task state）**，因此无法解决“知道该做什么”与“知道何时该做”之间的脱节。\n\n在**工作记忆（Working Memory, WM）**方面，**StateAct**、**ReflAct**、**Magentic-One**和**StructAgent**等方法尝试维护显式的任务状态，但其状态更新往往依赖于模型自身的声明或固定规则，缺乏对工具实际返回结果的严格验证。这导致状态容易受到幻觉或遗漏的影响，使得基于该状态的技能调用不可靠。例如，**StructAgent**虽然引入了验证器，但其验证后的状态仅用于下一步动作决策，并未与程序性记忆（procedural memory）的检索形成闭环耦合。\n\n在**递归自我改进**方面，**Memento**、**EvolveMem**和**MemSkill**等方法尝试通过添加、更新或删除记忆条目来进化智能体，但其更新机制通常基于模型自身对有用性的判断或单一的整体性能指标（如基准测试得分）。这种粗粒度的反馈信号无法揭示失败的具体原因——是技能缺失、状态追踪错误、调用时机不当还是验证逻辑缺陷。因此，诊断单元与修补单元往往不一致，导致修复无效或引入新的错误。例如，**EvolveMem**仅在基准性能提升时接受变更，无法定位具体组件；**Memento**冻结基础模型但仅适应案例库，缺乏对记忆控制层内部组件的细粒度归因与局部修补能力。\n\n综上所述，先前工作的不足在于：1）缺乏将**经验记忆（EM）**与**工作记忆（WM）**紧密耦合的机制，导致技能调用未扎根于当前验证过的任务状态；2）缺乏将执行轨迹转化为**结构化证据（structured evidence）**的能力，使得失败归因依赖于不可靠的最终结果或原始日志，无法实现组件级（component-level）的精准定位；3）记忆进化过程缺乏**验证门控（validation-gated）**和**局部修补（component-specific patching）**机制，导致更新过程不稳定且难以保证不损害已有能力。Recuris通过引入EM-WM耦合、结构化轨迹记录、基于轨迹的失败定位以及验证门控的递归进化循环，系统地解决了这些不足。", "core_insight": "### § 3 重建作者的思考路径\n\n在长视界（Long-Horizon）任务中，LLM Agent 的核心痛点并非缺乏知识，而是**状态追踪的失效**与**经验调用的错位**。现有的 Agent 架构通常依赖两种记忆机制：一是基于对话历史（Chat History）的检索，二是静态的经验库（Experiential Memory, EM）。然而，随着交互轮数增加，对话历史变得冗长且充满噪声，导致 Agent 难以从海量文本中精准定位当前未解决的目标（Unresolved Goals）；同时，静态 EM 往往在任务初期一次性注入，或在模型自行判断时调用，这导致技能（Skill）的调用与当前的实际执行需求脱节——Agent 可能在不需要时检索了无关技能，或在需要时遗漏了关键步骤。\n\n更深层的问题在于**递归自我改进（Recursive Self-Improvement, RSI）的黑盒性**。当 Agent 失败时，传统的改进方法（如 Reflexion 或基于最终奖励的提示优化）只能看到“任务失败”这一粗粒度信号，无法区分失败是源于技能缺失、状态误判、还是调用时机错误。这种归因模糊导致记忆更新往往是全局性的重写或盲目修补，极易引发灾难性遗忘或无效迭代。\n\n因此，一个理想的架构需要解决两个耦合问题：首先，需要一个**动态且可验证的工作记忆（Working Memory, WM）**来实时压缩任务状态，明确“已完成”与“待完成”的边界，并以此作为检索 EM 的精确索引，实现“按需调用”；其次，这种 WM-EM 的耦合必须产生**结构化的执行轨迹（Structured Trace）**，将每一步的状态、调用的技能、执行的动作及环境反馈显式关联。只有当失败可以被精确定位到具体的记忆组件（如“是 WM 漏记了目标”还是“EM 缺少某技能”），RSI 才能从“盲目试错”转变为“组件级精准修补”。Recuris 的提出正是基于这一逻辑：通过 WM 锚定当前状态以指导 EM 检索，并通过验证机制（Checker）确保状态更新的真实性，从而构建一个可诊断、可局部进化的记忆控制层。\n\n### § 4 核心 Intuition\n\n长视界任务失败的本质不是“不知道怎么做”，而是“忘记了现在该做什么”以及“不知道哪一步做错了”。Recuris 的核心直觉是引入**经验记忆（Experiential Memory）与工作记忆（Working Memory）的闭环耦合**：WM 不再是被动的记录者，而是主动的控制器，它通过环境反馈验证当前任务状态，并仅基于此状态从 EM 中检索最相关的技能，从而消除长历史带来的噪声干扰。这种耦合将执行过程转化为**结构化的诊断证据**，使得系统能够精准定位失败根源（如状态误判或技能缺失），进而对记忆组件进行局部、受验证的递归更新，而非全局重写。简言之，通过让记忆“知道现状”并“记录证据”，Agent 实现了从盲目执行到精准自我进化的跨越。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nRecuris 的核心方法是一种**递归的经验-工作记忆演化架构（Recursive Experiential–Working Memory Evolution）**。它不直接修改基础大语言模型（LLM）的权重，而是通过外部化的**记忆控制层（Memory-Control Layer）**来实现递归自我改进（Recursive Self-Improvement, RSI）。该架构包含两个主要循环：任务内的执行循环（Within-Task Execution Loop）和跨任务的演化循环（Cross-Task Evolution Loop）。\n\n**核心组件定义：**\n1.  **Experiential Memory (EM, $E_k$)**：存储可复用的技能（Skills），如工具调用流程或领域知识。\n2.  **Working Memory (WM, $W_k$)**：维护当前任务的紧凑状态（Task State），包括目标、状态（pending/done/blocked）及支持证据。\n3.  **Invocation Policy ($\\rho_k$)**：决定在何时、基于何种状态从 EM 中检索技能。\n4.  **Checker Set ($C_k$)**：验证器，根据环境反馈（Observation）判断 WM 的状态更新是否有效。\n5.  **Meta-Agent**：固定的元智能体，负责分析失败轨迹，定位故障组件，并生成补丁。\n\n**完整 Pipeline 示例：以 $\\tau^2$-Retail 中的“商品换货”任务为例**\n\n假设用户要求将一件商品 A 换为同系列的商品 B。\n\n**阶段一：任务内执行（Within-Task Execution）**\n\n1.  **初始化与状态构建**：\n    *   **输入**：用户指令“我想把商品 A 换成商品 B”。\n    *   **处理**：Recuris 初始化 Working Memory ($w_0$)。WM 记录目标：“执行换货”，状态为 `pending`。\n    *   **输出**：初始状态 $w_0$。\n\n2.  **状态驱动的技能调用（State-Grounded Skill Invocation）**：\n    *   **触发**：Agent 尝试起草一个工具调用（例如 `exchange_item`）。此时触发 **Call-time invocation**。\n    *   **处理**：Invocation Policy ($\\rho$) 根据当前 WM 状态（需要换货）和触发的工具类型，从 EM 中检索对应的“换货技能”（包含正确的参数格式和前置检查逻辑）。\n    *   **关键点**：技能是在动作执行*前*注入上下文的，而不是事后补救。\n\n3.  **执行与证据验证（Evidence-Grounded State Update）**：\n    *   **执行**：Agent 基于检索到的技能生成最终的工具调用并执行。\n    *   **反馈**：环境返回观察结果 $o_t$（例如：工具返回“成功，新商品 ID 为 B_new”）。\n    *   **验证**：Checker ($C$) 检查 $o_t$ 是否支持将 WM 中的目标状态从 `pending` 更新为 `done`。\n    *   **结果**：如果验证通过，WM 更新为 $w_{t+1}$（目标完成）；如果失败（如工具报错），WM 保持 `pending` 或变为 `blocked`，并记录错误证据。\n\n**阶段二：跨任务演化（Cross-Task Evolution）**\n\n假设在多个任务中，Agent 频繁出现“换货时使用了错误的商品 ID”导致失败。\n\n1.  **结构化轨迹记录（Structured Trace Generation）**：\n    *   系统记录结构化轨迹 $\\Gamma$，包含每一步的 $(w_t, E_t, a_t, o_t)$ 以及 Checker 的决策。这比原始对话历史更清晰，能明确区分是“技能缺失”、“状态错误”还是“调用时机错误”。\n\n2.  **故障定位（Trace-Based Failure Localization）**：\n    *   **输入**：失败任务的结构化轨迹 $\\Gamma$。\n    *   **处理**：固定的 Meta-Agent 分析轨迹。它发现 Agent 在调用 `exchange_item` 时，传入的参数是原商品 ID 而非新商品 ID。Meta-Agent 将此故障归因于 **Experiential Memory ($E$)** 中的技能定义不完整（缺少获取新 ID 的步骤）。\n    *   **输出**：诊断结果：故障组件为 $E$，具体问题是“换货技能未包含获取替换项 ID 的逻辑”。\n\n3.  **组件级补丁生成（Component-Specific Patching）**：\n    *   **处理**：Meta-Agent 仅修改 $E$ 中的“换货技能”，添加“先查询可用替换项 ID”的步骤。其他组件（WM 规范、调用策略、Checker）保持不变。\n    *   **输出**：候选补丁 $M_{k+1}$。\n\n4.  **验证门控（Validation-Gated Patch Admission）**：\n    *   **处理**：验证门（Gate）在保留的开发集（Held-out Development Set）上测试 $M_{k+1}$。\n    *   **判断**：如果补丁修复了源任务且未在开发集上造成性能回归（Regression），则接受补丁；否则拒绝。\n    *   **输出**：更新后的 Skill Memory $E_{k+1}$。\n\n5.  **递归循环**：\n    *   新的 $E_{k+1}$ 用于后续任务，产生新的轨迹和证据，形成闭环。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**说明**：本文没有复杂的理论数学推导（如收敛性证明或损失函数优化），其核心贡献在于**架构设计**和**工程化流程**。文中涉及的公式主要用于定义系统状态和更新规则，属于形式化描述而非数学推导。因此，本节跳过传统意义上的数学推导，转而解释核心形式化定义的直觉（Intuition）。\n\n**核心形式化定义及其直觉：**\n\n1.  **记忆控制层定义**：\n    $$ M_k = (E_k, W_k, \\rho_k, C_k) $$\n    *   **直觉**：将 Agent 的记忆能力解耦为四个独立组件。$E$ 是“知识库”，$W$ 是“当前进度条”，$\\rho$ 是“何时查知识库”，$C$ 是“进度条是否真的更新了”。这种解耦使得我们可以单独修复某个组件，而不是重写整个 Agent。\n\n2.  **状态更新规则**：\n    $$ w_{t+1} = K(w_t, \\hat{w}_{t+1}, a_t, o_t, c_t) $$\n    *   **直觉**：$w_{t+1}$ 不是由 LLM 随意生成的，而是由固定内核 $K$ 根据 Checker 的决策 $c_t$ 决定的。只有当环境反馈 $o_t$ 被 Checker 验证为支持状态变更时，WM 才会更新。这防止了 LLM 的幻觉（Hallucination）污染任务状态。\n\n3.  **演化更新规则**：\n    $$ M_{k+1} = M_k \\oplus_{Z_k} \\text{Patch}(Z_k) $$\n    *   **直觉**：$\\oplus_{Z_k}$ 表示只修改被诊断出的故障组件集合 $Z_k$。这是一种“最小化干预”原则，确保自我改进是局部的、可控的，避免牵一发而动全身导致的性能崩溃。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n*   **问题**：在长视界任务（Long-Horizon Tasks）中，现有的 Agent 记忆机制往往随着历史增长而失效，导致目标迷失和技能调用错位。现有的递归自我改进（RSI）方法通常基于最终成败信号进行粗粒度更新，缺乏对失败原因的精准定位，导致改进效率低且不稳定。\n*   **核心 Claim**：通过耦合经验记忆（EM）和工作记忆（WM），并将执行过程转化为结构化证据，可以实现组件级的故障定位和精准的递归记忆演化，从而显著提升长视界任务的成功率。\n\n**2. 设计了什么实验验证这个问题？**\n*   **基准测试（Benchmarks）**：在四个长视界基准上测试，包括 $\\tau^2$-Bench（Retail 和 Airline 场景，强调工具使用和策略约束）、SkillFlow（终身技能发现，强调程序化流程）和 Terminal-Bench 2.1（孤立任务，强调测试时适应）。\n*   **模型覆盖**：从 3B 参数量的开源模型（如 Granite-4.1-3B）到前沿模型（如 GPT-5.6 Sol, Claude Opus 5），验证方法的通用性。\n*   **消融实验（Ablation Studies）**：\n    *   **组件耦合验证**：对比 Base Agent、仅 EM、仅 WM、EM+WM（Recuris）以及模型控制调用（Model-controlled invocation），验证 EM-WM 耦合及状态驱动调用的必要性。\n    *   **故障定位验证**：注入已知故障，对比仅凭结果、原始轨迹和结构化轨迹（$\\Gamma$）进行故障定位的准确率。\n    *   **演化稳定性验证**：测试不同 Meta-Agent 实现（Claude Code vs. DeepSeek Harness）是否收敛到相同结果，以及验证门（Gate）对防止性能回归的作用。\n*   **长视界分析**：按任务长度分位数（Quartiles）分析性能增益，验证方法在更长交互中的可靠性。\n\n**3. 问题的答案是什么？**\n*   **性能显著提升**：Recuris 在 37 个模型-基准组合中的 35 个上提升了任务成功率。对于前沿模型，增益巨大（如 GPT-5.6 Sol 在 $\\tau^2$-Retail 上提升 +17.8 分，Claude Opus 5 提升 +15.6 分）。\n*   **长视界优势扩大**：随着任务交互轮数增加，Recuris 的优势不仅没有衰减，反而扩大（最长任务增益达 +32.2 分）。\n*   **故障定位精准**：结构化轨迹使故障定位准确率从仅凭结果的 13.0% 提升至 64.8%，证明了组件级修复的可行性。\n*   **机制有效性**：消融实验表明，**状态驱动的技能调用（State-Grounded Invocation）**和**证据驱动的状态更新（Evidence-Grounded Update）**是性能增益的关键，而非单纯增加上下文或技能数量。\n*   **递归演化稳定**：演化过程是受控的（Bounded），验证门有效防止了性能回归，且不同 Meta-Agent 实现收敛到相似的修复策略，证明了该方法对具体实现不敏感，具有鲁棒性。\n*   **跨模型迁移**：在一个中等规模模型上演化出的记忆，可以直接迁移并提升其他模型（包括更强的前沿模型）的性能，证明了记忆内容的通用价值。", "additional_insights": "### § 8 Take-aways\n\nRecuris 的核心突破在于将 **Recursive Self-Improvement (RSI)** 的优化目标从模型权重或全局提示词转移到了外部的 **Memory-Control Layer**，通过解耦 **Experiential Memory (EM)** 与 **Working Memory (WM)** 实现了长程任务中的状态感知技能调用。传统的基于历史检索的方法在长对话中容易因噪声累积而失效，而 Recuris 利用 WM 维护经过环境反馈验证的紧凑任务状态（Verified Task State），确保 EM 中的技能仅在特定执行事件（如工具调用前）被精准检索，从而解决了“何时调用”和“调用什么”的对齐问题。这种 **EM–WM Coupling** 不仅提升了单次执行的成功率，更关键的是它生成了结构化的执行轨迹（Structured Trace），使得失败归因可以从模糊的最终结果精确到具体的记忆组件（如技能缺失、状态定义错误或校验器失效）。基于这种可解释的故障定位，固定的 **Meta-Agent** 能够生成针对特定组件的局部补丁（Component-Specific Patching），并通过严格的验证门控（Validation-Gated Admission）防止性能退化，形成了有界的递归进化循环。实验表明，这种机制在 $\\tau^2$-Bench 和 SkillFlow 等长程基准上显著提升了包括 GPT-5.6 Sol 和 Claude Opus 5 在内的前沿模型性能，且增益随交互轮数增加而扩大，证明了记忆进化而非模型缩放是解决长程任务失败的关键。\n\n### § 9 最脆弱的假设\n\nRecuris 最脆弱且代价最高的假设是：**结构化轨迹（Structured Trace）提供的中间证据足以让 Meta-Agent 准确地将失败归因于四个记忆组件（EM, WM, $\\rho$, C）中的某一个，且这种归因具有因果有效性。** 如果这一假设不成立，即 Meta-Agent 无法从轨迹中区分是技能内容错误还是状态更新逻辑错误，那么后续的“组件特异性修补”就会变成随机噪声，甚至可能破坏原本正常的组件，导致递归进化陷入退化或停滞。在实际中，这一假设可能失效的原因在于 LLM 作为诊断器本身的局限性：复杂的长程失败往往由多个组件的交互错误共同导致（例如，错误的状态定义导致检索了错误的技能，而技能本身又是正确的），Meta-Agent 可能错误地将责任归咎于更容易修改的 EM 而非更底层的 WM 或 $\\rho$。论文在 Section 3.4.1 中通过注入已知故障的实验提供了部分证据，显示结构化轨迹将归因准确率从 13.0% 提升至 64.8%，但这仅证明了“可观察性”的提升，并未证明在真实、未注入故障的复杂场景中，Meta-Agent 的归因决策始终优于随机猜测或基于最终结果的粗粒度反馈。如果归因准确率在真实分布中显著低于 64.8%，或者归因错误导致的补丁引入了新的系统性偏差，整个递归进化的基础将不复存在。\n\n### § 10 最小复现实验\n\n在 1 周内，你可以复现 **Section 3.4.1 中的“故障注入与归因”实验**，以验证结构化轨迹是否真的能提升组件级故障定位的准确性，这是 Recuris 递归进化可行性的基石。具体步骤如下：首先，选择一个简单的长程任务环境（如 $\\tau^2$-Retail 的子集或自定义的 API 调用任务），并构建一个包含 EM、WM、$\\rho$ 和 C 的最小化 Recuris 框架。其次，人工注入四种类型的已知故障：1) 在 EM 中插入一个错误参数的技能；2) 在 WM 中定义一个缺失关键状态字段的 schema；3) 在 $\\rho$ 中设置一个错误的触发条件（如永远不触发）；4) 在 C 中设置一个过于严格或宽松的校验器。然后，运行这些故障配置，分别收集三种证据：仅任务结果（Outcome）、原始对话轨迹（Raw Trajectory）和结构化轨迹（Structured Trace，包含状态快照、技能调用事件和校验器决策）。最后，使用一个固定的 LLM Judge（如 GPT-4o 或 Claude Sonnet）作为 Meta-Agent，让它根据每种证据判断故障所在的组件。测量并比较三种证据条件下的归因准确率（Recall/Precision）。如果结构化轨迹的归因准确率显著高于原始轨迹和仅结果（如论文声称的从 13% 提升到 65% 以上），则支持了 Recuris 的核心 claim；如果提升不明显或准确率依然很低，则表明该方法在真实场景中可能无法实现有效的组件级修复，从而反驳了其递归进化的有效性。", "research_value": "### § 11 最强反例设计\n\n要最有力地攻击 Recuris，我会设计一个**“耦合故障归因失效（Coupled Failure Attribution Failure）”**的反例场景，旨在证明其核心假设——即结构化轨迹足以让 Meta-Agent 准确区分组件级故障——在真实复杂系统中是脆弱的。具体而言，我将构建一类**“状态-技能共变错误（State-Skill Covariant Errors）”**任务。在这类任务中，Working Memory (WM) 的状态定义存在细微的逻辑缺陷（例如，将“已支付”状态错误地定义为仅检查订单 ID 存在，而未检查支付金额匹配），而 Experiential Memory (EM) 中的技能恰好利用了这一缺陷（例如，技能逻辑假设只要订单 ID 存在即可执行后续操作，无需再次验证金额）。当环境反馈一个“金额不匹配但订单存在”的异常观察时，WM 的 Checker 可能因定义宽松而错误地更新状态为 `done`，或者 EM 的技能因缺乏二次校验而执行失败。\n\n在这种耦合故障下，结构化轨迹 $\\Gamma$ 会显示：WM 状态更新为 `done`（基于错误的 Checker 逻辑），但后续动作失败（基于错误的 EM 技能逻辑）。Meta-Agent 在分析轨迹时，面临一个经典的**“鸡生蛋还是蛋生鸡”**的归因困境：是 WM 的状态定义太宽松导致错误状态被接受，还是 EM 的技能太脆弱导致在正确状态下仍失败？由于 Recuris 的补丁机制是**组件特异性（Component-Specific）**的，Meta-Agent 必须二选一。如果它错误地归因于 EM 并修补技能（增加金额校验），虽然修复了当前错误，但 WM 的底层逻辑缺陷依然存在，可能在其他未覆盖的场景中引发新的、更隐蔽的错误；反之，如果归因于 WM，修补状态定义可能导致原本依赖该宽松逻辑的其他正确技能失效。\n\n为了验证这一攻击，我将设计一个**“归因鲁棒性压力测试（Attribution Robustness Stress Test）”**实验。首先，人工构造一组具有上述耦合特性的任务实例，其中故障根源明确位于 WM 或 EM 之一，但表现症状在两者间模糊。然后，运行 Recuris 的 Meta-Agent 进行归因和修补。关键指标不是任务成功率，而是**“归因准确率（Attribution Accuracy）”**与**“补丁副作用率（Patch Side-Effect Rate）”**。如果 Meta-Agent 在耦合故障下的归因准确率显著低于独立故障（如论文声称的 64.8%），或者修补一个组件导致其他原本正常的任务性能下降（即验证门控未能完全拦截的隐性回归），则证明 Recuris 的递归进化在复杂依赖关系中是不可靠的。此外，我还可以引入**“对抗性噪声（Adversarial Noise）”**，在结构化轨迹中注入少量无关的中间状态波动，观察 Meta-Agent 是否会被这些噪声误导，从而错误地定位故障组件。如果 Recuris 无法在噪声和耦合故障中保持稳定的归因能力，其“递归自我改进”的长期有效性将受到根本性质疑，因为它可能只是在随机修补中偶然提升了性能，而非真正理解了系统逻辑。\n\n### § 12 Follow-up Research Idea\n\n基于 Recuris 在**组件级归因（Component-Level Attribution）**上的局限性，我提出一个全新的研究方向：**“因果记忆演化（Causal Memory Evolution, CME）”**。Recuris 的核心局限在于它依赖 Meta-Agent 的启发式推理来定位故障，这在组件高度耦合时容易失效。CME 的目标不是简单地修补记忆，而是通过**因果发现（Causal Discovery）**技术，自动构建记忆组件（EM, WM, $\\rho$, C）与任务结果之间的**因果图（Causal Graph）**，从而实现基于因果干预（Causal Intervention）的精准记忆更新。\n\n**(a) 驱动局限与未满足需求：**\nRecuris 假设结构化轨迹提供了足够的证据进行归因，但忽略了组件间的**混杂因素（Confounding Factors）**。在长视界任务中，一个组件的错误可能通过复杂的交互路径影响其他组件，导致相关性不等于因果性。现有的 RSI 方法缺乏对这种因果结构的显式建模，导致修补策略往往是“试错式”的，缺乏理论保证。CME 旨在解决这一根本问题，通过识别真正的因果驱动因素，实现更稳定、更可解释的记忆进化。\n\n**(b) 借鉴相邻领域的方法：**\nCME 将借鉴**因果推断（Causal Inference）**和**程序合成（Program Synthesis）**领域的最新进展。具体而言，利用**结构因果模型（Structural Causal Models, SCM）**来形式化记忆组件之间的依赖关系，并使用**因果发现算法（如 PC 算法或 NOTEARS）**从执行轨迹中自动学习因果图。此外，借鉴**形式化验证（Formal Verification）**中的**反事实推理（Counterfactual Reasoning）**技术，评估不同补丁在假设场景下的潜在影响，从而在应用补丁前预测其副作用。\n\n**(c) 第一个实验设计：**\n第一个实验将构建一个**“因果记忆演化基准（Causal Memory Evolution Benchmark, CME-Bench）”**，包含一系列具有已知因果结构的合成任务。例如，设计一个任务，其中 WM 的状态更新直接因果地影响 EM 的技能检索，而 EM 的技能执行又因果地影响最终结果。然后，对比 Recuris 与 CME 在以下指标上的表现：\n1.  **因果图恢复准确率（Causal Graph Recovery Accuracy）**：CME 能否从轨迹中准确恢复出预设的因果结构？\n2.  **干预有效性（Intervention Effectiveness）**：在识别出因果故障后，CME 生成的补丁是否比 Recuris 的启发式补丁更精准地修复了问题，且副作用更少？\n3.  **样本效率（Sample Efficiency）**：CME 是否能在更少的失败轨迹下收敛到正确的记忆配置，因为它利用了因果结构而非仅依赖统计相关性？\n\n通过这一实验，我们将证明，将因果推理引入记忆演化不仅能提高归因的准确性，还能显著提升递归自我改进的稳定性和效率，为长视界智能体的持续进化提供一个新的理论框架。这与 Recuris 的启发式归因形成鲜明对比，代表了从“基于证据的修补”向“基于因果的理解”的范式转变。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Zhaochen Yu\",\n      \"affiliations\": [\n        1,\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yingcheng Wu\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zhenfei Yin\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Kaiyuan Chen\",\n      \"affiliations\": [],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zhe Zhao\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Mengdi Wang\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Shuicheng Yan\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Ling Yang\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"NUS\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Stanford University\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"University of Oxford\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Princeton University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding authors; Main contact: yangling0818@163.com\"\n    }\n  ]\n}\n```", "summary_translation": "在长视界任务中，递归自我改进（RSI）仍然面临挑战，因为不断增长的交互历史会模糊任务状态并导致技能调用错位。我们提出了 Recuris，一种用于长视界智能体框架的递归经验-工作记忆架构。在该架构中，工作记忆跟踪任务进度，并从经验记忆中指导技能选择，使技能的使用基于当前需求而非完整历史。这种耦合还将执行过程转化为结构化证据，从而将故障定位到特定的记忆组件。跨不同任务，一个固定的元智能体将这些证据转化为对技能记忆的局部化、经验证门控的更新，这些更新重塑执行过程并产生新的证据，形成一个有界的递归记忆演化循环。在四个长视界基准测试和十个模型上，Recuris 在 37 个已完成的模型-基准配对中的 35 个中提高了任务成功率，使前沿模型达到 SOTA 级别的任务成功率：在 tau-bench 上，它为 GPT-5.6 Sol 提升了 17.8 分，为 Claude Opus 5 提升了 15.6 分，使 Opus 5 达到 87.9% 的成功率；在 SkillFlow 上，它为 Qwen3.6-27B/35B 分别提升了 16.6 分和 13.5 分。随着交互视界的增加，优势进一步扩大，在最长的任务中提升了 32.2 分，常见的长视界故障减少了高达 80%。这些结果将递归演化的记忆定位为 RSI 的可扩展基础，使智能体能够持续将积累的经验转化为越来越有效的长视界行为。代码：https://github.com/Gen-Verse/Recuris"}, {"title": "CAFE: Self-Improving Search Agents Need Co-Evolving Feedback", "arxiv_id": "2608.24794", "authors": "Boyang Liu, Senjie Jin, Peixin Wang, Zhangyue Yin, Yibo Wang, Yuhao Zhou, Xinbing Liang, Shizheng Zhu, Yuhui Wang, Jingqi Tong, Zhiheng Xi, Jiazheng Zhang, Clive Bai, Clarenceai, Blaze Chen, Tao Gui, Qi Zhang, Xuanjing Huang", "summary": "Outcome-supervised search agents learn when and how to retrieve evidence, but terminal rewards neither localize intermediate errors nor redirect an ongoing trajectory before those errors compound. Treating corrective feedback as a learned in-trajectory intervention couples the two roles: the agent must decide when to request and use feedback, while the critic must infer useful corrections from outcome-confounded rollouts whose failure patterns shift as the agent improves. We introduce CAFE (Coupled Agent--Feedback Evolution), a framework in which a shared-parameter model alternates between search-agent and critic roles. CAFE initializes feedback-conditioned recovery from trajectories built around the base agent's own failures, then couples online and offline optimization. During online RL, a comparative feedback estimate uses a prompt-level call--skip success gap to shape request returns, while feedback-aware advantage shaping reweights token advantages before and after feedback. Offline, rollout-derived preference optimization learns feedback from matched successful and unsuccessful trajectories. On seven agentic search benchmarks, CAFE outperforms the evaluated RL-based search agents on average, retains its gains across all six out-of-domain benchmarks, and reduces answer-level hallucinations. One-sided ablations show that improving only the agent or only the critic eventually plateaus, whereas alternating the two updates continues to improve performance. These findings suggest that a self-improving search agent needs feedback that co-evolves with the policy it guides.", "category": "cs.AI", "cluster": "Self-Improvement \u0026 Recursive Evolution", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：在长视距（long-horizon）搜索任务中，如何实现 **Agent**（执行搜索策略）与 **Critic**（提供纠正性反馈）的 **Co-evolution**（协同进化），以解决稀疏终端奖励无法定位中间错误且无法在错误累积前重定向轨迹的问题。具体而言，研究旨在解决三个相互交织的挑战：Agent 需学习何时请求干预及如何分配成功信用；Critic 需在无地面真值且受结果混淆（outcome-confounded）的情况下学习有用反馈；以及两者需保持对齐，防止因 Agent 策略更新导致 Critic 失效。\n\n该问题的重要性在于，现有的 **Outcome-supervised search agents** 虽然能学习何时检索，但缺乏对搜索轨迹的 **Introspection**（内省）。在长视距任务中，早期的方向性错误（如错误的地理锚点或约束丢失）会引发 **Error Compounding**（错误累积），而终端奖励无法提供细粒度的 **Credit Assignment**（信用分配）。解决这一问题能带来显著价值：CAFE 框架通过 **In-trajectory intervention**（轨迹内干预）将反馈作为可选动作，不仅提升了搜索性能（在 7 个基准上优于现有 RL 方法），还显著降低了 **Answer-level hallucinations**（答案级幻觉，从 17.6% 降至 12.6%），并证明了单一模型通过交替优化 Agent 和 Critic 能力，能实现比单向优化更持续的 **Sustained gains**（持续增益）。\n\n### § 2 前人工作与不足\n\n该问题此前并未被完全解决，现有方法存在明显的局限性。早期的 **Retrieval-augmented pipelines**（如 Trivedi et al., 2023; Jiang et al., 2023）依赖固定策略或手工触发条件，缺乏自主性。近期的 **Outcome-supervised search agents**（如 Search-R1, R-Search）虽然通过终端奖励学习搜索策略，但其自主性仅面向外部知识获取，缺乏对内部轨迹错误的诊断与纠正能力。\n\n最相关的 **Prior methods** 包括 **Reflexion**、**Self-Refine** 和 **CRITIC**。这些方法通常通过提示（prompted）而非训练（trained）的模型，在轨迹结束后（post hoc）返回自然语言批评。其不足在于：1）反馈是静态的，无法在活跃轨迹中实时重定向搜索；2）反馈生成未与 Agent 策略联合优化，导致 Critic 可能无法适应 Agent 不断变化的失败模式（failure patterns）。\n\n另一类相关工作是 **Self-evolving agents**（如 EvolveSearch, Self-Rewarding, EvoLM），它们通过生成的经验更新策略或监督信号。然而，这些方法通常优化不同的改进循环部分，或者像 **ECHO** 那样仅在轨迹完成后调用 Critic，无法在错误累积前进行干预。此外，现有的细粒度信用分配方法（如基于信息增益或置信度变化）主要提供评估性信号（evaluative signals），而非指导性信号（instructive signals），无法直接纠正当前的搜索漂移。因此，缺乏一种机制能将 **Corrective feedback** 作为可学习的、轨迹内的干预手段，并实现 Agent 与 Critic 的 **Coupled learning**（耦合学习），这正是 CAFE 旨在填补的空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在长程搜索任务中，现有的 Outcome-supervised 方法（如 Search-R1）虽然能优化 Agent 的搜索策略，但面临严重的 Credit Assignment 难题：终端奖励无法定位中间步骤的错误，导致 Agent 在早期出现方向性偏差（如错误的地理锚点）后，后续步骤往往陷入无效循环或幻觉，且这种错误会随轨迹长度指数级放大。\n\n现有的改进方案主要分为两类：一类是引入更细粒度的信号（如 Information Gain 或 Confidence Change），但这些信号仅具有评估性质（Evaluative），缺乏指导性（Instructive），无法在错误发生时实时纠正轨迹；另一类是引入 Self-Reflection 或 Critic 机制（如 Reflexion, CRITIC），但现有工作通常将 Critic 视为静态的、基于 Prompt 的后验反馈，或者在轨迹结束后才介入。这导致两个核心缺陷：首先，静态 Critic 无法适应 Agent 策略演化过程中不断变化的错误分布（Distribution Shift），随着 Agent 能力提升，旧有的 Critic 可能失效或产生误导；其次，Agent 缺乏“何时请求反馈”的决策能力，且由于反馈介入后的成功与无反馈的成功在终端奖励上无异，Agent 难以学习到请求反馈的价值。\n\n因此，研究者意识到，要解决长程搜索中的错误累积问题，必须将反馈机制从“静态后验评估”转变为“动态在线干预”。这要求 Agent 和 Critic 不再是独立的模块，而是一个耦合系统：Agent 需要学习在不确定性高时主动请求反馈，而 Critic 需要针对 Agent 当前策略下的特定失败模式生成针对性指导。由于 Agent 的策略在 RL 过程中不断演化，Critic 也必须随之共同演化（Co-evolution），以保持对当前错误分布的敏感性。这就引出了核心 Idea：构建一个共享参数的框架，通过在线 RL 优化 Agent 的反馈请求与利用能力，同时通过离线 Preference Optimization 利用最新 Rollout 数据更新 Critic，实现 Agent 与 Feedback 的交替迭代优化。\n\n### § 4 核心 Intuition\n\n传统搜索 Agent 的失败往往源于早期错误未被及时纠正，而静态的 Critic 无法适应 Agent 策略演化过程中不断变化的错误分布，导致反馈失效。CAFE 的核心直觉是：Agent 的搜索能力与 Critic 的纠错能力是相互依赖且共同演化的，只有让 Critic 针对 Agent 当前策略下的最新失败模式进行动态调整，才能提供有效的在线干预。通过共享参数模型交替优化 Agent 的反馈请求策略和 Critic 的反馈生成能力，系统能够形成闭环，使反馈始终与 Agent 的能力边界对齐，从而在长程搜索中实现持续的自我改进。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nCAFE (Coupled Agent–Feedback Evolution) 的核心思想是将搜索代理（Agent）与反馈生成器（Critic）统一在一个共享参数的模型中，通过交替优化实现两者的共同进化（Co-evolution）。其完整 Pipeline 包含初始化、在线强化学习（Online RL）和离线偏好优化（Offline RDPO）三个阶段。\n\n**1. 初始化阶段：基于失败轨迹的反馈增强 SFT**\n*   **输入**：基础模型（Base Agent）在搜索任务中产生的失败轨迹（Failed Rollouts）。\n*   **处理**：\n    *   利用教师模型（Teacher Model，如 Kimi-K2.5）定位轨迹中最早出现错误或停滞的转折点。\n    *   保留该错误前的前缀，插入 `\u003Crequest_feedback\u003E` 动作。\n    *   由教师模型生成纠正性反馈（Corrective Feedback）及随后的成功恢复轨迹。\n    *   仅保留最终答案正确的修复轨迹，构建监督微调（SFT）数据集。\n*   **输出**：经过反馈增强 SFT 初始化的共享参数模型，具备初步的请求反馈和生成反馈能力。\n\n**2. 在线优化阶段：代理策略学习（Online Agent Optimization）**\n*   **输入**：当前策略模型生成的轨迹组（Rollout Group），包含请求反馈和不请求反馈的样本。\n*   **处理**：\n    *   **Comparative Feedback Estimate (CFE)**：计算同一 Prompt 下，请求反馈组与不请求反馈组的成功率差距（Success Gap）。若请求反馈能显著提高成功率，则给予正向奖励；若重复请求则给予惩罚。这解决了“何时请求反馈”的问题。\n    *   **Feedback-Aware Advantage Shaping**：在计算 Token 级别的 Advantage 时，对反馈前后的 Token 进行差异化加权。反馈前的错误行为即使最终成功也不应被过度奖励，而反馈后的恢复行为应获得更高权重。这解决了“如何分配信用”的问题。\n    *   使用 GRPO 算法更新模型参数，强化代理在正确时机请求并利用反馈的能力。\n*   **输出**：更新后的代理策略模型（Agent Policy）。\n\n**3. 离线优化阶段：反馈生成器精炼（Offline Feedback Optimization）**\n*   **输入**：最新在线 RL 阶段产生的轨迹，特别是那些“前缀相似但结果不同”的配对轨迹。\n*   **处理**：\n    *   **Rollout-Derived Preference Optimization (RDPO)**：从最新轨迹中挖掘偏好对。选取一个成功恢复的轨迹（Chosen）和一个在相同前缀下失败的轨迹（Rejected）。\n    *   构建偏好数据：相同的上下文（Context）+ 成功的反馈（Chosen Feedback） vs. 相同的上下文 + 失败的反馈（Rejected Feedback）。\n    *   使用 DPO 算法更新模型参数，使 Critic 角色更倾向于生成能导向成功的反馈。\n*   **输出**：更新后的共享模型，其中 Critic 能力得到增强，且与当前 Agent 策略保持对齐。\n\n**4. 迭代循环**\n*   重复步骤 2 和 3，交替进行在线代理学习和离线反馈优化，直到达到预设迭代次数。\n\n**真实案例演示（基于论文 Case Study）：**\n*   **任务**：寻找一条位于科罗拉多州、距离丹佛机场约 218-220 英里、距离芝加哥机场约 1104-1106 英里、长度 0.5-1 英里、宽度 1-3 英尺、海拔增益 150-400 英尺且包含 1800 年代建筑的步道。\n*   **BASE 模型失败路径**：\n    1.  搜索机场距离，得到 Grand Junction 和 Denver 的信息。\n    2.  错误地锚定在 Denver，反复搜索 Denver 附近的步道。\n    3.  多次搜索无果，最终幻觉输出 \"Old Elitch’s Park Trail\"（错误）。\n*   **CAFE 模型成功路径**：\n    1.  **初始搜索**：搜索机场距离，得到 Grand Junction 和 Denver 的信息。\n    2.  **识别困境**：Agent 意识到搜索结果混乱，发出 `\u003Crequest_feedback\u003E`。\n    3.  **Critic 反馈**：Critic 指出 Agent 误读了搜索结果，Grand Junction 才是符合距离条件的地点，建议结合科罗拉多地理位置和步道属性重新搜索。\n    4.  **修正搜索**：Agent 根据反馈，搜索 \"Colorado Rocky Mountains trail... Grand Junction...\"。\n    5.  **获取证据**：检索到 \"Old Kiln Trail\"，其属性完全匹配。\n    6.  **输出答案**：Old Kiln Trail（正确）。\n\n### § 6 核心数学推导\n\nCAFE 的核心数学贡献在于设计了两个关键的奖励塑造机制，以解决稀疏奖励下的信用分配问题。\n\n**1. Comparative Feedback Estimate (CFE) 奖励**\n*   **公式**：\n    $$ r_i^{CFE} = r_i^{task} + \\beta C_i u(x_i) - \\gamma [n_{fb,i} - 1]_+ $$\n*   **Intuition**：\n    *   $r_i^{task}$ 是最终答案是否正确（0 或 1）。\n    *   $u(x_i)$ 是 Prompt 级别的“调用-跳过”成功率差距（Call-Skip Success Gap）。如果请求反馈的轨迹成功率显著高于不请求的，则 $u(x_i) \u003E 0$，给予奖励。这鼓励 Agent 在真正需要帮助时请求反馈。\n    *   $[n_{fb,i} - 1]_+$ 惩罚多次请求反馈的行为，防止 Agent 过度依赖 Critic。\n    *   $\\beta, \\gamma$ 是超参数，控制反馈奖励和重复惩罚的权重。\n*   **理论背景**：传统 RL 中，最终奖励无法区分是 Agent 自己解决还是靠反馈解决。CFE 通过组间比较，将“请求反馈”这一动作的价值显式地量化为对整体成功率的贡献。\n\n**2. Feedback-Aware Advantage Shaping**\n*   **公式**：\n    $$ \\hat{A}_{i,t} = A_i \\cdot (1 + \\lambda \\cdot g_i \\cdot \\mathbb{I}(t \\in T_{i}^{[post]})) - \\lambda \\cdot g_i \\cdot \\mathbb{I}(t \\in T_{i}^{[pre]}) $$\n    （注：论文中具体实现为对 pre-feedback 和 post-feedback 的 Advantage 进行加减调整，此处为简化表达其核心思想）\n*   **Intuition**：\n    *   $A_i$ 是原始的 Group-normalized Advantage。\n    *   $g_i$ 是裁剪后的反馈效用估计。\n    *   对于反馈前的 Token（$T_{i}^{[pre]}$），如果反馈是有益的（$g_i \u003E 0$），则降低其 Advantage，因为这部分行为导致了错误，不应被强化。\n    *   对于反馈后的 Token（$T_{i}^{[post]}$），增加其 Advantage，因为这部分行为是在反馈指导下成功的，应被强化。\n    *   $\\lambda$ 控制塑造强度。\n*   **理论背景**：在标准 RL 中，整个轨迹共享同一个 Advantage，导致错误的前缀和正确的后缀被同等对待。这种 Shaping 方法打破了这种耦合，确保 Agent 学习到“在错误时请求反馈”以及“在反馈后正确执行”，而不是“即使犯错也能靠运气成功”。\n\n**3. 任务更新方向保持定理 (Theorem 1)**\n*   **内容**：证明在 CFE 和 Advantage Shaping 的扰动小于原始任务更新范数时，CAFE 的更新方向与原始任务奖励的更新方向保持正相关。\n*   **Intuition**：确保引入反馈机制不会导致模型偏离解决原始任务的目标，即“学会求助”不会以牺牲“解题能力”为代价。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n*   现有的搜索代理（Search Agents）主要依赖终端奖励（Terminal Rewards）进行优化，无法定位中间错误，也无法在错误累积前进行纠正。\n*   引入反馈机制面临三个挑战：Agent 何时请求反馈？Critic 如何从无标签数据中学习有效反馈？Agent 和 Critic 如何共同进化以避免分布偏移？\n\n**2. 设计了什么实验验证这个问题？**\n*   **主实验（Main Results）**：在 7 个 Agentic SearchQA 基准（2Wiki, HotpotQA, MuSiQue, PopQA, TriviaQA, Bamboogle, NQ）上，对比 CAFE 与 SOTA 的 RL-based 搜索代理（如 Search-R1, R-Search, IGPO）及闭源模型（GPT-5-Mini, Gemini-2.5-Flash）。\n*   **消融实验（Ablation Studies）**：\n    *   **组件消融**：分别移除 CFE 和 Advantage Shaping，验证其对性能的提升。\n    *   **离线优化消融**：对比 RDPO 与仅使用成功轨迹的 SFT（RSFT），验证偏好学习对 Critic 质量的重要性。\n    *   **共同进化消融**：对比“仅更新 Agent”、“仅更新 Critic”与“交替更新（CAFE）”，验证共同进化的必要性。\n*   **泛化性实验**：在 6 个域外（Out-of-Domain）数据集和 BrowseComp-Plus（长程深度研究任务）上测试泛化能力。\n*   **幻觉分析**：统计答案级幻觉率，验证反馈机制对减少幻觉的作用。\n\n**3. 问题的答案是什么？**\n*   **性能提升**：CAFE 在 7B 规模下，平均 EM 和 F1 均优于所有对比的 RL-based 基线，且在 6 个域外数据集上均保持优势。\n*   **共同进化必要性**：仅优化 Agent 或仅优化 Critic 都会导致性能 plateau，而交替优化能持续带来增益。这表明 Agent 和 Critic 的能力是耦合的，必须共同进化。\n*   **减少幻觉**：CAFE 将平均幻觉率从 17.6% 降低到 12.6%，证明反馈机制能有效纠正中间错误，防止错误累积导致最终答案幻觉。\n*   **结论**：自我改进的搜索代理需要与其策略共同进化的反馈机制，而非固定的监督信号。CAFE 通过耦合的 Agent-Critic 学习和精细的信用分配，实现了更鲁棒、更准确的长程搜索。", "additional_insights": "### § 8 Take-aways\n\nCAFE 框架的核心洞察是，在长程搜索任务中，Agent 的策略演化与 Critic 的反馈能力必须通过共享参数模型进行交替优化（Co-evolution），因为静态的 Critic 无法适应 Agent 错误分布的动态漂移。该方法通过引入 Comparative Feedback Estimate (CFE) 机制，利用“请求反馈”与“跳过反馈”轨迹组之间的成功率差异，为 Agent 提供了何时请求干预的细粒度奖励信号。同时，Feedback-aware Advantage Shaping 技术解决了信用分配难题，通过重新加权反馈前后的 Token 优势，防止模型错误地强化导致错误的搜索前缀。在离线阶段，Rollout-Derived Preference Optimization (RDPO) 利用前缀匹配的成对轨迹（成功恢复 vs. 失败）来训练 Critic，从而在无需人工标注的情况下实现反馈质量的迭代提升。实验表明，这种耦合进化不仅显著提升了多跳搜索基准（如 2WikiMultihopQA）的性能，还有效降低了答案层面的幻觉率，证明了动态反馈机制在纠正中间错误方面的有效性。\n\n### § 9 最脆弱的假设\n\n该方法最脆弱的假设是：**基于前缀匹配（Prefix-matched）的成对轨迹能够准确反映反馈（Feedback）本身的质量，即成功与失败的结果差异主要归因于 Critic 生成的反馈内容，而非搜索前缀中未被察觉的细微差异或后续 Agent 的随机性。**\n\n如果这一假设不成立，RDPO 可能会学习到错误的偏好信号。例如，两个轨迹可能拥有高度相似的前缀（Jaccard 相似度高），但其中一个轨迹在反馈前的最后一步实际上已经隐含了足够的信息，而另一个没有，或者 Agent 在接收反馈后的执行能力存在随机波动。在这种情况下，RDPO 会将成功归因于反馈，从而强化一个实际上无效甚至误导性的 Critic 行为。论文通过设置严格的过滤条件（如前缀 Jaccard 相似度 $\\ge 0.7$ 和反馈长度可比性）来缓解这一问题，并假设在共享参数模型中，Agent 的执行能力在相邻迭代间保持相对稳定。然而，论文缺乏对“反馈无关的成功/失败”案例的定量分析，即未能证明在匹配的前缀下，反馈确实是导致结果差异的决定性变量，这使得 RDPO 的优化方向存在潜在的噪声风险。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 **Comparative Feedback Estimate (CFE)** 的核心逻辑，以验证“请求反馈”这一动作本身是否具有可学习的价值信号。\n\n*   **数据**：使用 2WikiMultihopQA 的一个小子集（例如 50-100 个困难样本），这些样本在基线模型（如 Qwen2.5-7B-Instruct）上容易出错。\n*   **实现**：\n    1.  构建一个简单的 Agent，允许其在任意步骤输出 `\u003Crequest_feedback\u003E`。\n    2.  对于每个 Prompt，采样一组轨迹（Rollout Group），其中一部分强制请求反馈（由一个固定的、高质量的 Teacher Model 提供反馈），另一部分强制跳过反馈。\n    3.  计算每个 Prompt 级别的“Call-Skip Success Gap”（即请求反馈组的成功率减去跳过组的成功率）。\n    4.  不训练模型，仅分析这个 Gap 与最终任务成功率的关联性。\n*   **测量**：计算 CFE 估计值（Gap）与轨迹最终是否成功的皮尔逊相关系数；或者，将 CFE 值作为特征，训练一个简单的分类器来预测哪些 Prompt 需要反馈。\n*   **结果判定**：如果 CFE 值与“该 Prompt 确实需要外部干预才能成功”这一事实高度正相关，则支持了 CFE 作为有效奖励信号的理论基础。如果相关性极低或为负，则说明简单的组间成功率差异无法准确反映反馈的效用，CAFE 的核心奖励机制可能建立在噪声之上。此实验无需复现复杂的 RL 训练循环，仅需验证奖励信号的有效性。", "research_value": "### § 11 最强反例设计\n\n若要挑战 CAFE 的有效性，最有力的攻击并非质疑其性能提升，而是质疑其**因果归因的可靠性**，即证明观察到的性能增益并非源于 Agent 与 Critic 的协同进化（Co-evolution），而是源于**数据泄露（Data Leakage）**或**过度拟合特定错误模式（Overfitting to Failure Patterns）**。\n\n具体而言，可以设计一个**“分布外错误模式”（Out-of-Distribution Failure Modes）**的反例实验。CAFE 的初始化阶段依赖于 Teacher Model 对 Base Agent 失败轨迹的修复，而 RDPO 阶段依赖于前缀匹配的轨迹对。如果 Base Agent 的失败主要集中在某一类特定的认知偏差（如地理锚定错误），那么 CAFE 学到的“反馈”可能仅仅是针对这类特定错误的硬编码修正规则，而非通用的推理能力。\n\n**攻击实验设计：**\n构建一个合成基准（Synthetic Benchmark），其中搜索任务的错误类型被严格隔离。例如，一组任务仅包含“事实检索错误”（需要更正实体），另一组仅包含“逻辑推理错误”（需要更正推导链条）。\n1.  **训练阶段**：使用仅包含“事实检索错误”的失败轨迹来训练 CAFE。\n2.  **测试阶段**：在完全由“逻辑推理错误”构成的测试集上评估 CAFE。\n3.  **预期结果**：如果 CAFE 的性能显著下降，甚至低于仅使用 Terminal Reward 的基线模型，则证明 CAFE 并没有学到通用的“何时请求反馈”或“如何生成有用反馈”的能力，而是过拟合了训练数据中特定的错误-反馈映射。这将揭示 CAFE 的“共同进化”实际上是一种**静态的知识蒸馏（Static Knowledge Distillation）**，一旦错误分布发生漂移（Distribution Shift），Critic 的反馈将变得无效甚至有害，因为 Agent 的策略已经适应了特定的反馈格式，而 Critic 无法泛化到新的错误类型。\n\n此外，还可以从**计算效率与边际收益**的角度进行攻击。CAFE 需要交替进行 Online RL 和 Offline RDPO，且每次迭代都需要生成大量的 Rollout 以构建偏好对。可以设计一个实验，对比 CAFE 与简单的**“重试机制”（Retry Mechanism）**或**“多智能体辩论”（Multi-Agent Debate）**在相同计算预算下的性能。如果 CAFE 的增益在扣除额外的计算成本后变得微不足道，或者其增益主要来自于增加了搜索步数（即更长的轨迹）而非更智能的反馈，那么 CAFE 的复杂性就缺乏合理性。这将挑战 CAFE 作为“自我改进”框架的核心主张，暗示其本质上只是一个更昂贵的搜索策略优化器，而非真正的认知能力进化。\n\n### § 12 Follow-up Research Idea\n\n基于 CAFE 在**因果归因**和**分布漂移**方面的局限，提出一个新的研究方向：**Causal Intervention-based Self-Correction (CISC)**，即基于因果干预的自我修正。\n\n**(a) 驱动局限：**\nCAFE 的核心弱点在于它依赖于相关性（Correlation）而非因果性（Causality）来学习反馈。RDPO 假设前缀相似的轨迹中，结果差异是由反馈引起的，但这忽略了潜在混杂变量（Confounding Variables），如搜索环境的随机性或 Agent 内部状态的微小波动。此外，CAFE 的反馈是自然语言形式的，缺乏结构化，难以进行精确的因果分析。现有的方法无法区分“反馈导致了成功”和“反馈与成功同时发生”。\n\n**(b) 借鉴领域：**\n借鉴**因果推断（Causal Inference）**和**程序合成（Program Synthesis）**领域的思想。在因果推断中，我们使用 Do-calculus 来估计干预的效果；在程序合成中，我们使用形式化验证来确保代码的正确性。我们可以将搜索轨迹视为一个可执行的程序，将反馈视为对程序状态的干预（Intervention）。\n\n**(c) 第一个实验：**\n构建一个**结构化搜索环境（Structured Search Environment）**，其中搜索动作和状态是形式化的（如 SQL 查询或逻辑表达式），而非自然语言。\n1.  **方法**：设计一个 Agent，其内部状态是一个显式的信念状态（Belief State）。当 Agent 检测到不确定性时，它不请求自然语言反馈，而是生成一个**因果假设（Causal Hypothesis）**，例如“如果我改变搜索关键词 X，结果 Y 会改变”。\n2.  **干预**：Critic 不生成文本反馈，而是执行一个**反事实干预（Counterfactual Intervention）**，即在模拟环境中修改信念状态或搜索参数，并观察结果变化。\n3.  **学习**：使用**因果发现算法（Causal Discovery Algorithms）**来学习哪些干预真正导致了结果的变化，从而构建一个因果图（Causal Graph）。Agent 根据因果图决定何时以及如何干预自己的搜索过程。\n4.  **评估**：在相同的 Agentic SearchQA 基准上，对比 CISC 与 CAFE 在分布外错误模式下的鲁棒性。预期 CISC 能够更准确地识别错误的根本原因，并生成更通用的修正策略，因为它基于因果结构而非统计相关性。\n\n这个提议与 CAFE 的根本区别在于：CAFE 是**数据驱动的、基于相关性的反馈学习**，而 CISC 是**模型驱动的、基于因果性的干预学习**。CISC 旨在解决 CAFE 无法解决的“反馈有效性归因”问题，并为 Agent 提供更可解释、更鲁棒的自我修正能力。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Boyang Liu\", \"affiliations\": [1, 2], \"markers\": [\"*\", \"‡\"]},\n    {\"name\": \"Senjie Jin\", \"affiliations\": [1, 2], \"markers\": [\"*\", \"‡\"]},\n    {\"name\": \"Peixin Wang\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Zhangyue Yin\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yibo Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yuhao Zhou\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Xinbing Liang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Shizheng Zhu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuhui Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jingqi Tong\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhiheng Xi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiazheng Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Clive Bai\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Clarenceai\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Blaze Chen\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Tao Gui\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Qi Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xuanjing Huang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Fudan University\"},\n    {\"id\": 2, \"name\": \"LLM Department, Tencent\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal Contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding Author\"},\n    {\"marker\": \"‡\", \"text\": \"Project Leader\"}\n  ]\n}\n```", "summary_translation": "结果监督的搜索智能体学习何时以及如何检索证据，但终端奖励既无法定位中间错误，也无法在错误累积之前重定向正在进行的轨迹。将纠正性反馈视为一种学习到的轨迹内干预措施，将这两个角色耦合在一起：智能体必须决定何时请求和使用反馈，而评论家必须从结果混淆的 rollout 中推断出有用的纠正措施，这些 rollout 的失败模式会随着智能体的改进而改变。我们提出了 CAFE（Coupled Agent--Feedback Evolution），这是一个共享参数模型在搜索智能体和评论家角色之间交替的框架。CAFE 从围绕基础智能体自身失败构建的轨迹中初始化反馈条件恢复，然后耦合在线和离线优化。在在线 RL 期间，比较性反馈估计使用提示级别的调用--跳过成功差距来塑造请求回报，而感知反馈的优势塑造则在反馈前后重新加权 token 优势。在离线阶段，基于 rollout 的偏好优化从匹配的成功和不成功轨迹中学习反馈。在七个 agentic 搜索基准测试中，CAFE 平均优于评估的基于 RL 的搜索智能体，在所有六个域外基准测试中保持其增益，并减少答案级别的幻觉。单侧消融实验表明，仅改进智能体或仅改进评论家最终会达到平台期，而交替更新两者则能持续提高性能。这些发现表明，自我改进的搜索智能体需要与其引导的策略共同进化的反馈。"}, {"title": "VideoHarness-RSI: Recursive Harness Self-Improvement for Long-Video Understanding with Frozen Vision-Language Models", "arxiv_id": "2608.24302", "authors": "Guoyang Xu, Hao Chen", "summary": "Long-video understanding depends critically on how a limited model context is constructed from a much longer video. Existing approaches improve this process through compression, retrieval, memory, and agentic evidence acquisition, but these mechanisms are typically introduced as part of a manually designed inference system or optimized together with other components. This makes it difficult to isolate a simpler question: how much can be gained by improving the executable context-construction program alone? We study this question through VIDEOHARNESS-RSI, a controlled baseline for recursively searching executable context constructors around a frozen vision-language model (VLM). An outer-loop proposer uses prior programs, evaluation outcomes, and execution traces to generate candidate harnesses, which are executed and evaluated end to end before successful variants are retained for further search. This makes long-video understanding a controlled instance of automated harness design: the searchable object is executable program structure, while the answering model and interface remain fixed. Starting from uniform sampling, recursive harness search consistently finds room for improvement and surpasses several weaker hand-crafted baselines. Starting instead from a stronger hand-crafted baseline, the same RSI process yields a further improvement. The selected harness also transfers to additional long-video benchmarks without further search. Together, these results establish executable context construction as a distinct optimization layer and provide a reproducible baseline for studying harness discovery and transfer around frozen VLMs.", "category": "cs.AI", "cluster": "Self-Improvement \u0026 Recursive Evolution", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Self-Evolving/Self-Improving)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-39 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文符合“自我演化 (Self-Evolving)”和“智能体构建/改进 (Building/Improving Agents)”的研究范围，具体依据如下：\n\n1.  核心机制符合“自我演化/自动改进”：论文提出的 VIDEOHARNESS-RSI 是一种“递归 harness 自我改进”（Recursive Harness Self-Improvement）机制。它利用外层循环（outer-loop proposer）基于先前的程序、评估结果和执行轨迹（execution traces）来生成候选的 harness（可执行上下文构建程序），并通过端到端执行和评估来保留成功的变体。这完全符合筛选标准中关于“harness/scaffold/runtime... 通过轨迹、反馈、观测或评估结果自动改进、演化或自适应优化”的定义。\n2.  研究对象属于 Agentic 组件：虽然应用场景是长视频理解，但论文的核心贡献并非视频理解算法本身，而是将“可执行上下文构建程序”（executable context-construction program）视为一个可搜索、可优化的对象。在 Agentic AI 的语境下，这种动态构建上下文、管理记忆或检索证据的机制正是智能体（Agent）的核心能力之一（如 Memory, Tool Use, Planning）。论文明确将其定义为“automated harness design”（自动化 harness 设计），属于智能体基础设施的自动化演化。\n3.  符合“LLMs Improving LLMs / Harness Refinement”的正面指标：论文展示了如何通过迭代搜索和改进 harness 来提升冻结模型（Frozen VLM）的性能，这属于“Harness Refinement”和“Iterative Improvement”的范畴。尽管使用了 VLM，但 VLM 在此处是作为被 harness 调用的基础模型（frozen backbone），研究焦点在于 harness 的演化，而非视觉模型本身的训练或多模态感知机制的创新，因此不属于应排除的“多模态与视觉”核心研究。\n4.  非纯应用或非纯基础设施：该论文不是简单地将现有框架应用于视频领域（排除项1），也不是单纯的硬件/部署优化（排除项3），而是提出了一种新的方法论来自动发现和优化智能体的执行环境/逻辑结构。\n\n综上，该论文研究的是智能体执行组件（harness）的自我演化与自动优化，属于 Agentic AI 中关于智能体构建与演化的前沿研究，故判定为保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在冻结底层视觉-语言模型（Frozen Vision-Language Model, VLM）及其接口的前提下，仅通过递归搜索和优化可执行的上下文构建程序（Executable Context-Construction Program，即 Harness），能在多大程度上提升长视频理解（Long-Video Understanding）的性能？这一问题的重要性在于，长视频理解的主要瓶颈并非单纯源于模型推理能力的不足，而是受限于模型有限的上下文窗口（Context Window）与海量视频帧之间的巨大鸿沟。现有的长视频系统通常将压缩、检索、记忆机制与模型推理紧密耦合，导致难以剥离并量化“上下文构建策略”本身的贡献。通过建立 VIDEOHARNESS-RSI 这一受控基线，本文旨在将长视频理解解耦为模型能力与上下文构建能力两个独立层面，从而明确回答：在不修改模型参数或引入复杂代理工作流的情况下，自动化设计的上下文构造器能否发现超越人工设计基线的有效策略。解决该问题的价值在于确立了“可执行上下文构建”作为一个独立的优化层（Optimization Layer），为自动化 Harness 设计提供了可复现的基准，并证明了通过递归自我改进（Recursive Self-Improvement, RSI）发现的上下文策略具有跨基准的迁移能力，从而为理解长视频系统中的证据暴露机制提供了新的视角。\n\n### § 2 前人工作与不足\n\n尽管长视频理解领域已有大量研究，但现有工作未能充分隔离并优化“上下文构建程序”这一单一变量。现有的长视频系统主要依赖自适应压缩（Adaptive Compression）、帧选择（Frame Selection）、检索增强生成（Retrieval-Augmented Generation）以及基于代理的证据获取（Agentic Evidence Acquisition）。例如，LongVU 和 VideoAgent 等系统通过压缩或主动检索来减少输入量，而 WorldMM、Homer 和 VideoSEAL 等系统则引入了多模态记忆、分层推理或规划-检查（Planner-Inspector）架构。然而，这些方法通常同时改变证据表示、检索机制、工具调用、推理工作流甚至底层模型，使得性能提升的来源难以归因。具体而言，现有研究的不足体现在以下几个方面：首先，缺乏对“可执行上下文构建程序”本身的独立优化，大多数系统采用手动设计的推理流程（Manually Designed Inference System），难以通过自动化搜索发现更优的程序结构；其次，现有方法往往将上下文构建与模型推理耦合，导致无法在固定模型下评估不同上下文策略的相对优劣；最后，虽然 ADAS、AFlow 和 Meta-Harness 等工作探索了自动化代理或 Harness 优化，但它们通常针对通用代理设计或特定领域，并未在长视频理解这一具体场景下，将搜索对象严格限制为可执行的上下文构建代码，同时保持下游 VLM 完全冻结。因此，现有工作未能清晰界定在固定模型约束下，仅通过优化上下文构建程序所能达到的性能上限，也未提供一套标准化的协议来评估 Harness 的递归改进及其迁移能力。", "core_insight": "### § 3 重建作者的思考路径\n\n在长视频理解（Long-Video Understanding）领域，现有的主流范式往往陷入一种“黑盒式”的系统优化困境：研究者通常同时调整证据表示（Evidence Representation）、检索机制（Retrieval）、推理工作流（Reasoning Workflow）甚至底层模型（Model），导致无法剥离出“上下文构建程序（Context-Construction Program）”本身的贡献。这种耦合使得我们难以回答一个基础问题：如果冻结视觉语言模型（Frozen VLM）及其接口，仅优化可执行的上下文构建代码（Executable Context-Constructor），性能上限在哪里？\n\n与此同时，自动化智能体设计（Automated Agent Design）和程序合成（Program Synthesis）领域（如 ADAS, AFlow, Meta-Harness）已经证明了通过执行反馈（Execution Feedback）递归搜索代码结构的有效性。然而，这些工作多集中于通用智能体或特定任务，尚未被严格应用于长视频理解的“上下文构建”这一特定子问题。现有的长视频方法（如 WorldMM, Homer, VideoSEAL）虽然引入了记忆（Memory）和规划（Planning），但其核心逻辑往往是手工设计的（Hand-crafted），缺乏对“何种上下文组织策略最优”的系统性搜索。\n\n此外，观察发现，简单的均匀采样（Uniform Sampling）在长视频中表现极差，而复杂的检索（如 CLIP-KNN）或基于字幕的导航（Caption Navigation）在开发集上可能有效，但在测试集上往往泛化性不足或存在过拟合。这暗示了上下文构建中存在未被探索的“组合空间”：单一机制（如仅靠视觉相似度或仅靠文本导航）可能不足，需要一种能够动态组合时间导航（Temporal Navigation）和视觉检索（Visual Retrieval）的策略。\n\n因此，作者设想建立一个受控的实验环境（Controlled Setting），将“上下文构建”抽象为一个可搜索的程序对象（Searchable Object）。通过引入递归自我改进（Recursive Self-Improvement, RSI）机制，利用外层循环（Outer Loop）提出器（Proposer）基于历史执行轨迹（Execution Traces）和评估结果（Evaluation Outcomes）生成候选程序，并在冻结的 VLM 上进行端到端评估。这种方法旨在隔离模型能力与上下文构建能力，验证是否可以通过自动化搜索发现优于手工设计（Hand-crafted Baselines）的上下文构建策略，并探究其可迁移性（Transferability）。\n\n### § 4 核心 Intuition\n\n长视频理解的性能瓶颈不仅在于模型本身的推理能力，更在于系统如何从海量无关帧中构建出高质量的上下文（Context Construction）。现有的手工设计方法往往局限于单一机制（如仅检索或仅压缩），难以发现最优的证据组织策略。本文的核心直觉是：将上下文构建视为一个可执行的程序，通过递归搜索（Recursive Search）在冻结模型周围自动演化出更优的证据检索与打包逻辑，从而在不改变模型参数的前提下，显著提升长视频理解的性能。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**VideoHarness-RSI** 的核心方法是将长视频理解中的“上下文构建”（Context Construction）抽象为一个可执行的程序（Executable Program），并通过递归搜索（Recursive Search）自动优化该程序，而保持底层的 Vision-Language Model (VLM) 冻结不变。\n\n**Pipeline 详解：**\n\n1.  **输入 (Input)**：\n    *   一个长视频 $V_i$ 和一个问题 $q_i$。\n    *   一个冻结的 VLM（如 Qwen3-VL-8B-Instruct）。\n    *   一个初始的 Harness 程序 $H$（例如均匀采样 Uniform-40）。\n\n2.  **外层循环：递归搜索 (Outer Loop: Recursive Harness Search)**：\n    *   **Proposer (提议者)**：使用一个强大的 LLM（如 Claude Opus）作为自动化设计者。它读取当前的最佳 Harness 代码、历史评估分数和执行轨迹（Traces）。\n    *   **Mutation (变异)**：Proposer 生成新的候选 Harness 代码 $H_{cand}$。这些代码修改了如何从视频中提取、检索和打包证据的逻辑（例如，从均匀采样改为基于 Caption 的导航，或结合 CLIP 嵌入的检索）。\n    *   **Evaluation (评估)**：在开发集（Development Set）上端到端执行新 Harness。\n    *   **Selection (选择)**：如果新 Harness 在开发集上的准确率严格高于当前最佳，则保留为新前沿（Frontier）；否则丢弃。此过程迭代进行，直到收敛。\n\n3.  **内层执行：上下文构建 (Inner Execution: Context Construction)**：\n    *   以最终选定的 **EMBEDNAVIGATE-HYBRID** 为例，其内部逻辑分为 Write-Read-Pack 三个阶段：\n        *   **Write (构建索引)**：将视频帧转换为 2fps 的流，提取每帧的 Caption 和 CLIP 图像嵌入（Image Embeddings），构建可寻址的索引。\n        *   **Read (检索证据)**：\n            *   *Navigation Step*：VLM 首先阅读部分 Caption，识别出可能包含答案的时间范围（Temporal Ranges）。\n            *   *Retrieval Step*：在这些时间范围内，结合问题文本与图像嵌入的相似度（CLIP Score）以及时间位置得分，筛选出最相关的帧。\n        *   **Pack (打包上下文)**：将筛选出的最多 $K=40$ 帧按时间顺序排列，格式化后输入给冻结的 VLM。\n\n4.  **输出 (Output)**：\n    *   冻结的 VLM 接收打包好的上下文，生成最终答案。\n    *   系统返回答案及对应的评估指标（准确率、输入 Token 数等）。\n\n**真实例子演示：**\n假设问题是：“视频中绿色杯子出现在哪个时间段？”\n*   **Uniform-40 (基线)**：随机抽取 40 帧。很可能漏掉绿色杯子出现的短暂瞬间，导致 VLM 回答错误。\n*   **EMBEDNAVIGATE-HYBRID (搜索后)**：\n    1.  **Write**：系统预先计算了所有帧的 Caption（如“一个绿色杯子在桌上”）和 CLIP 向量。\n    2.  **Read**：Proposer 生成的代码首先让 VLM 浏览 Caption 索引，定位到包含“green cup”的时间段（例如 10:00-10:05）。然后，在该时间段内，利用 CLIP 相似度进一步筛选出视觉特征最匹配“green cup”的帧。\n    3.  **Pack**：将这 5-10 帧关键帧打包发送给 VLM。\n    4.  **Result**：VLM 看到清晰的绿色杯子图像，正确回答时间段。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过。**\n本文主要贡献在于提出一种受控的自动化 Harness 设计框架（Controlled Automated Harness Design），而非提出新的数学理论或复杂的模型参数优化公式。文中涉及的公式主要用于定义优化目标（最大化开发集准确率）和约束条件（固定上下文大小 $K$），属于工程化定义而非理论推导。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n在长视频理解中，现有的改进方法（如压缩、检索、记忆）通常与模型训练或复杂代理系统耦合，难以分离出“上下文构建程序”本身的贡献。核心问题是：**仅通过递归优化可执行的上下文构建程序（Harness），而不改变底层冻结 VLM，能否显著提升长视频理解性能？这种提升是否具有泛化性？**\n\n**2. 设计了什么实验验证这个问题？**\n*   **受控基线对比**：在 LVBench 数据集上，固定 VLM (Qwen3-VL-8B-Instruct) 和上下文预算 ($K=40$)，对比均匀采样 (Uniform-40)、手工设计的检索方法 (CLIP-KNN, CAPTION-KNN, AKS) 以及通过 RSI 搜索得到的 Harness (EMBEDNAVIGATE-HYBRID, TIMESTAMPED-AKS)。\n*   **递归搜索轨迹分析**：记录从 Uniform-40 开始，经过 5 代搜索，Proposer 如何逐步改进代码（从 Caption 导航到混合嵌入导航），并分析每一步的性能增益和成本变化。\n*   **跨基准迁移测试**：将在 LVBench 上搜索得到的最佳 Harness 直接应用于 Video-MME 和 MLVU 数据集，不进行任何针对新数据集的搜索或微调，以验证其泛化能力。\n*   **机制诊断**：通过事后标注的证据窗口（Evidence Windows），分析不同 Harness 在“证据可见性”（Evidence Visibility）和“推理能力”上的差异，区分是检索到了更多相关帧，还是 VLM 推理能力增强。\n\n**3. 问题的答案是什么？**\n*   **性能提升显著**：递归搜索发现的 Harness (EMBEDNAVIGATE-HYBRID) 在 LVBench 测试集上比均匀采样提升了约 9% 的准确率，且优于大多数手工设计的基线。即使从较强的手工基线 (AKS) 开始搜索，仍能获得进一步提升 (TIMESTAMPED-AKS)。\n*   **机制在于组合策略**：搜索发现，单一的检索（如仅用 Caption 或仅用 Image Embedding）效果有限，而结合“时间导航”（Navigation）和“视觉相似度检索”（Visual Retrieval）的混合策略最有效。这表明上下文构建的关键在于如何组织证据，而不仅仅是暴露更多证据。\n*   **具有泛化性**：在 LVBench 上搜索得到的 Harness 在 Video-MME 和 MLVU 上均优于均匀采样，证明搜索到的上下文构建策略具有跨数据集的迁移能力。\n*   **搜索存在边界**：搜索在早期迭代中迅速收敛，后续变异难以带来显著提升，且在高容量设置下可能出现过拟合开发集的现象，表明开发集反馈与测试集泛化之间存在 Gap。", "additional_insights": "### § 8 Take-aways\n\nVIDEOHARNESS-RSI 将长视频理解中的上下文构建（context construction）从模型训练中解耦，确立为围绕冻结 VLM 的独立可优化层。通过递归搜索可执行的 harness 代码（而非调整模型参数），该方法在保持 Qwen3-VL-8B-Instruct 冻结的前提下，显著提升了 LVBench 上的准确率。搜索过程发现，结合时间导航（temporal navigation）与视觉相似度检索（visual similarity retrieval）的混合策略优于单一通道，且这种改进具有跨基准（Video-MME, MLVU）的直接迁移能力。实验表明，增加上下文容量（capacity）并不等同于提升选择质量（selection quality），有效的证据组织比单纯堆砌帧数更关键。该框架提供了一个可审计的基线，证明了自动化 harness 设计在长视频理解中的有效性与局限性。\n\n### § 9 最脆弱的假设\n\n该方法最脆弱的假设是：**基于开发集（development set）的 harness 搜索能够发现具有泛化能力的上下文构建策略，而非仅仅过拟合于特定问题的证据分布。** 如果这一假设不成立，即搜索到的 harness 仅在开发集上表现优异而在未见数据上失效，那么“递归自我改进”的核心贡献——即通过自动化搜索发现通用优化策略——将直接失效。论文通过以下证据部分支持该假设：在 LVBench 上，搜索得到的 harness 在 held-out 测试集上依然优于基线，且在 Video-MME 和 MLVU 上实现了无搜索直接迁移（direct reuse）。然而，论文也承认了反例：在高容量（high-capacity）搜索协议中，开发集选出的候选者在测试集上表现反而不如均匀采样基线，暴露了搜索-评估差距（search-evaluation gap）。这表明该假设在特定条件下（如上下文预算极大时）可能不成立，且论文未提供足够的理论保证或更广泛的跨模型验证来彻底消除过拟合风险。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现“混合检索优于单一检索”这一核心机制发现，无需复现完整的递归搜索循环。具体方案如下：使用 LVBench 的公开子集（或论文提供的 83 个视频），冻结 Qwen3-VL-8B-Instruct 模型。实现三个简单的 harness：1) UNIFORM-40（均匀采样 40 帧）；2) CLIP-KNN（基于 CLIP 嵌入检索最相关 40 帧）；3) HYBRID（先通过 caption 导航定位时间窗口，再在窗口内结合 CLIP 相似度排序选取 40 帧）。测量指标为 held-out 问题的准确率。如果 HYBRID 的准确率显著高于 UNIFORM-40 和 CLIP-KNN，则支持论文关于“互补导航-检索设计”有效性的 claim；如果 HYBRID 未表现出优势或显著低于基线，则反驳了该特定组合策略的普适性，暗示递归搜索可能发现了过拟合的局部最优解。此实验仅需实现基本的检索和打包逻辑，无需调用 LLM 进行代码生成或迭代搜索。", "research_value": "### § 11 最强反例设计\n\n若要挑战 VIDEOHARNESS-RSI 的核心主张，最有力的攻击并非质疑其性能提升，而是攻击其**“自动化搜索发现的策略具有通用性且优于人工启发式”**这一因果推断。具体的反例设计应聚焦于**“搜索空间的偏差与过拟合”**（Search Space Bias and Overfitting）。\n\n**实验设计：对抗性分布偏移测试（Adversarial Distribution Shift Test）**\n论文声称在 LVBench 上搜索到的 Harness 能迁移到 Video-MME 和 MLVU。然而，这些数据集在视频类型（如新闻、纪录片、电影片段）和提问风格上可能存在隐性相关性。最强的反例是构建一个**“长尾语义-视觉解耦”**的测试集。具体而言，选取那些**Caption 描述与视觉关键帧严重错位**的视频片段（例如，Caption 描述背景环境，而答案隐藏在前景微小物体中，或者 Caption 存在幻觉）。\n*   **攻击逻辑**：VIDEOHARNESS-RSI 搜索出的最佳策略 `EMBEDNAVIGATE-HYBRID` 高度依赖 `Caption Navigation` 来缩小时间窗口。如果测试集中的视频具有“误导性 Caption”或“低信噪比 Caption”，该 Harness 会错误地导航到无关时间段，导致性能断崖式下跌，甚至低于简单的 `Uniform-40` 基线（因为 Uniform 采样至少保留了随机覆盖关键帧的概率）。\n*   **替代解释**：如果在该对抗性测试集上，`EMBEDNAVIGATE-HYBRID` 的表现显著劣于 `Uniform-40` 或纯视觉检索 `CLIP-KNN`，则证明 RSI 发现的并非“更优的上下文构建逻辑”，而是**“对特定数据集 Caption 质量的过拟合”**。这表明自动化搜索并未发现通用的证据暴露机制，而是利用了训练/开发集中 Caption 与答案之间的统计捷径（Statistical Shortcut）。\n\n**理论论证：计算复杂度与边际收益的不可持续性**\n从理论角度，可以论证该方法在**高维连续时间域**中的搜索效率存在根本性缺陷。Harness 的变异（Mutation）是由 LLM 生成的代码片段，这本质上是一个离散的组合优化问题。然而，视频证据的分布是连续的。\n*   **攻击点**：随着视频长度增加（例如从 10 分钟扩展到 2 小时），`Navigation Step` 需要处理的 Caption 序列长度呈线性增长，导致 VLM 在导航阶段的 Token 消耗和推理延迟急剧增加。如果设计一个实验，固定上下文预算 $K$，但不断增加视频长度，观察 `EMBEDNAVIGATE-HYBRID` 的准确率是否随视频长度增加而衰减，而 `Uniform-40` 保持相对稳定（因为均匀采样对长度不敏感），则可以证明该自动化策略在**长尾长视频**场景下缺乏鲁棒性。这挑战了论文关于“上下文构建作为独立优化层”的普适性，暗示其仅在中等长度、高信噪比视频上有效。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“静态程序搜索”到“动态元控制策略学习”（From Static Program Search to Dynamic Meta-Control Policy Learning）**\n\n**（a）驱动局限与未满足需求**\nVIDEOHARNESS-RSI 的核心局限在于其生成的 Harness 是**静态的、确定性的程序**（Static Deterministic Program）。一旦代码生成，对于所有视频和问题的处理逻辑是固定的（例如，总是先读 Caption 再检索）。然而，长视频理解的本质是**非平稳的**（Non-stationary）：不同视频的信息密度、不同问题的推理深度需求差异巨大。静态 Harness 无法根据当前视频的“信息熵”或问题的“复杂度”动态调整证据获取策略。例如，对于简单的事实性问题，复杂的 Navigation 是浪费；对于复杂的因果推理，单一的 Retrieval 可能不足。现有工作未能解决**“如何根据输入动态选择或组合上下文构建策略”**的问题。\n\n**（b）借鉴相邻领域的方法**\n借鉴**强化学习中的元控制**（Meta-Control in Reinforcement Learning）或**多臂老虎机**（Multi-Armed Bandit, MAB）框架。具体而言，引入一个轻量级的**策略路由器**（Policy Router），其目标不是生成代码，而是从一组预定义的、经过验证的 Harness 原型（如 Uniform, CLIP-KNN, Caption-Nav, Hybrid）中，为每个 $(V_i, q_i)$ 对动态选择最优的上下文构建路径。这类似于**混合专家模型**（Mixture of Experts, MoE）中的门控网络（Gating Network），但作用于推理时的上下文构建阶段。\n\n**（c）第一个实验设计**\n1.  **构建 Harness 库**：首先复现 VIDEOHARNESS-RSI 搜索出的前 5 个最佳 Harness（包括 `EMBEDNAVIGATE-HYBRID` 及其变体），以及几个强基线（`Uniform-40`, `AKS`），形成一个“策略池”（Strategy Pool）。\n2.  **训练路由器**：设计一个小型的 Transformer 或 MLP 作为 Router。输入为视频的元数据（如帧数、平均 CLIP 嵌入方差）和问题的嵌入。输出为策略池中的索引。\n3.  **对比实验**：在 LVBench 和 Video-MME 上，对比以下三种方法：\n    *   **Static Best**：始终使用 RSI 搜索到的最佳 Harness (`EMBEDNAVIGATE-HYBRID`)。\n    *   **Random Selection**：随机从策略池中选择一个 Harness。\n    *   **Dynamic Meta-Control**：使用训练好的 Router 动态选择 Harness。\n4.  **预期结果与意义**：如果 Dynamic Meta-Control 在保持平均准确率不低于 Static Best 的同时，显著降低了**平均 Token 消耗**（因为简单问题可能只需 Uniform 采样，无需昂贵的 Navigation），则证明了**“动态策略选择”**优于**“静态程序优化”**。这将把研究焦点从“寻找一个万能 Harness”转移到“构建一个自适应的上下文构建生态系统”，为长视频理解提供更高效、更鲁棒的解决方案。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Guoyang Xu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Hao Chen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Tencent\"\n    }\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "长视频理解的关键在于如何从更长的视频中构建有限的模型上下文。现有方法通过压缩、检索、记忆和智能体证据获取来改进这一过程，但这些机制通常作为手动设计的推理系统的一部分引入，或与其他组件一起进行优化。这使得难以隔离一个更简单的问题：仅通过改进可执行的上下文构建程序能获得多少收益？我们通过 VIDEOHARNESS-RSI 研究了这一问题，这是一个围绕冻结的视觉语言模型（VLM）递归搜索可执行上下文构建器的受控基线。外部循环提议器利用先验程序、评估结果和执行轨迹生成候选 harness，这些 harness 在执行和端到端评估后，成功的变体被保留用于进一步搜索。这使得长视频理解成为自动化 harness 设计的受控实例：可搜索对象是可执行程序结构，而回答模型和接口保持不变。从均匀采样开始，递归 harness 搜索 consistently 发现改进空间，并超越了几个较弱的手工基线。从更强的手工基线开始，相同的 RSI 过程带来了进一步的改进。所选 harness 无需进一步搜索即可迁移到其他长视频基准测试。这些结果共同确立了可执行上下文构建作为一个独立的优化层，并为研究围绕冻结 VLM 的 harness 发现和迁移提供了可复现的基线。"}]}, {"name": "Code \u0026 Scientific Reproduction", "count": 4, "papers": [{"title": "DeepRepoQA: Code Repository Question Answering with Deep Agent Exploration", "arxiv_id": "2608.24221", "authors": "Weihan Peng, Yuling Shi, Yingwei Ma, Longfei Yun, Beijun Shen, Xiaodong Gu", "summary": "Answering developer questions about a software repository is a critical yet under-explored problem in software engineering. While existing repository understanding methods have advanced the field, they predominantly rely on surface-level code retrieval and lack the ability for deep reasoning over multiple files, complex software architectures, and grounding answers in long-range code dependencies. To address these limitations, we propose DeepRepoQA, a novel question answering (QA) framework for repository-level code understanding. DeepRepoQA builds on an agentic framework where LLM agents find answers through a systematic tree search over the repository structure. A Monte-Carlo Tree Search (MCTS) mechanism is employed to empower agents to dynamically search, navigate, and inspect code, enabling effective multi-hop reasoning over long-range code dependencies. Comprehensive experiments on the SWE-QA benchmark demonstrate substantial performance gains over strong baselines, validating the effectiveness of systematic MCTS-guided exploration for multi-hop repository reasoning.", "category": "cs.CL", "cluster": "Code \u0026 Scientific Reproduction", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=36 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文符合研究范围，核心依据如下：\n\n1.  核心对象为 LLM 智能体 (LLM Agents)：论文明确提出了 \"DeepRepoQA\" 框架，并指出其构建于 \"agentic framework\" 之上，使用 \"LLM agents\" 来执行任务。这直接对应了筛选标准中关于 \"构建 LLM 智能体\" 的核心目标。\n2.  涉及智能体的规划与推理机制 (Planning \u0026 Reasoning)：论文的核心贡献在于引入蒙特卡洛树搜索 (MCTS) 机制，赋予智能体在代码仓库结构中进行动态搜索、导航和检查的能力。这属于单智能体方向中的 \"规划 (Planning)\" 和 \"工具使用/环境交互 (Tool Use/Interaction)\" 范畴。MCTS 在此处作为智能体的决策和探索策略，旨在解决长程依赖和多跳推理问题，是智能体能力实现的关键部分。\n3.  非纯应用或非纯基础设施：虽然应用场景是软件工程中的代码问答，但论文的重点不在于解决某个具体的业务问题，而在于提出一种新的智能体探索框架（MCTS-guided exploration）来增强 LLM 在复杂环境（代码仓库）中的推理能力。这符合 \"保留\" 标准中关于 \"研究 agent 的 harness / scaffold ... 并且核心贡献是让这些智能体运行组件通过轨迹、反馈、观测或评估结果自动改进、演化或自适应优化\" 的精神（此处体现为通过结构化搜索策略优化智能体的推理路径）。\n4.  排除项检查：\n       不涉及多智能体拓扑或通信协议。\n       不涉及安全、对齐或可解释性。\n       不涉及图神经网络或知识图谱（尽管代码仓库有结构，但论文强调的是基于 MCTS 的搜索代理行为，而非图推理算法本身）。\n       不是简单的非演化型应用，因为它提出了新的智能体行为机制（MCTS 引导的探索）。\n\n综上，该论文研究的是如何通过特定的规划/搜索机制（MCTS）来增强 LLM 智能体在复杂环境中的推理和探索能力，属于 \"单智能体 (Agentic)\" 方向下的规划与工具使用研究，因此判定为符合。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是**代码仓库级问答（Code Repository Question Answering, Repo-level QA）**，即如何使大型语言模型（LLMs）能够针对软件仓库中复杂的、跨文件的架构性问题提供准确且基于证据的回答。这一问题之所以关键，是因为在现代软件开发中，开发者经常需要导航庞大的互联代码库，追踪跨越多个文件的依赖关系，并综合架构知识以解决复杂问题或理解系统行为。然而，现有的仓库理解方法大多局限于函数级（function-level）或片段级（snippet-level）的理解，缺乏对长程代码依赖（long-range code dependencies）和复杂软件架构的深度推理能力。\n\n解决这一问题的价值在于填补了从“代码补全/生成”到“深度代码理解”之间的空白。传统的检索增强生成（RAG）方法通常只能检索局部代码片段，无法处理需要多跳推理（multi-hop reasoning）的问题，例如解释某个设计决策的原因或追踪特定功能的调用链。通过引入系统化的探索机制，DEEPREPOQA 能够将仓库问答从简单的检索任务转化为结构化的搜索与验证过程，从而显著提升回答的正确性（Correctness）、完整性（Completeness）和推理深度（Reasoning）。这不仅有助于自动化软件维护和问题解决，也为构建更智能的软件开发助手（如 Cursor、Tongyi Lingma 等）提供了更可靠的底层推理框架，特别是在处理需要跨文件证据合成的复杂工程问题时。\n\n### § 2 前人工作与不足\n\n尽管代码问答领域已有大量研究，但针对**仓库级深度推理**的问题仍未得到充分解决。现有的相关工作主要可以分为三类，且均存在显著不足：\n\n1.  **基于检索增强生成（RAG）的方法**：如 **Repocoder** (Zhang et al., 2023) 和 **LongCodeZip** (Shi et al., 2025)。这些方法通常将代码分割为函数块或滑动窗口片段，通过语义相似度检索相关上下文。\n    *   **不足**：它们主要依赖表面层的代码检索（surface-level code retrieval），缺乏对代码结构（如类继承、模块依赖）的显式建模。当答案需要结合分散在不同文件中的证据或遵循跨文件的调用链时，RAG 方法容易引入无关噪声或遗漏关键代码段，导致推理断裂。它们无法进行多跳推理，因为检索过程是静态且单向的，缺乏根据中间结果动态调整搜索策略的能力。\n\n2.  **基于 ReAct 风格的单路径 Agent 方法**：如 **SWE-agent** (Yang et al., 2024) 和 **OpenHands** (Wang et al., 2025b)。这些系统引入了推理与行动交替的机制，允许模型执行工具调用（如查看文件、运行命令）来逐步解决问题。\n    *   **不足**：尽管它们支持多步交互，但其核心设计是**单路径（single-path）**的。这意味着 Agent 沿着一条轨迹线性执行，如果早期步骤选择了错误的探索方向（例如检索了错误的文件或函数），后续步骤很难回溯或纠正，导致“检索偏差”（retrieval bias）或陷入无效探索。此外，单路径设计限制了探索的广度，容易错过位于非主路径上的关键证据，且在平衡探索（exploration）与利用（exploitation）方面存在挑战，难以保证在复杂仓库中找到全局最优的证据组合。\n\n3.  **基于图结构或静态分析的方法**：如 **RepoGraph** (Ouyang et al., 2024)。这些方法通过构建代码图来建模跨文件关系。\n    *   **不足**：虽然它们能捕捉结构信息，但通常侧重于代码合成或修改任务，而非开放式的问答推理。它们缺乏灵活的、基于自然语言查询的动态探索能力，难以适应多样化的、非结构化的开发者问题。\n\n综上所述，现有方法要么缺乏深度推理能力（RAG），要么缺乏系统化的探索与纠错机制（ReAct Agents），要么缺乏灵活性（静态图方法）。DEEPREPOQA 的创新之处在于将仓库问答建模为**蒙特卡洛树搜索（Monte-Carlo Tree Search, MCTS）**问题，通过多 Agent 协作（Perception, Planning, Execution, Evaluation）实现多路径探索与动态反馈，从而克服了单路径 Agent 的局限性和 RAG 的浅层检索缺陷。", "core_insight": "### § 3 重建作者的思考路径\n\n在深入代码仓库级问答（Repository-level QA）这一领域时，研究者首先观察到现有方法的根本局限性：传统的 RAG 方法（如滑动窗口或函数分块）仅能进行浅层的局部检索，无法处理跨越多个文件、依赖复杂调用链的深层推理问题；而基于 ReAct 的单路径 Agent（如 SWE-agent, OpenHands）虽然引入了交互能力，但其“线性执行”的特性导致探索过程极易陷入局部最优或错误轨迹，一旦初始检索偏差，后续步骤往往无法自我纠正，且缺乏对搜索空间的系统性权衡（Exploration vs. Exploitation）。\n\n与此同时，软件工程中的代码理解本质上是一个在巨大状态空间中寻找证据路径的过程，这与强化学习或规划问题中的树搜索结构高度同构。研究者意识到，LLM 在代码导航中表现出的“幻觉”和“迷失”，部分源于缺乏对搜索路径的全局视野和回溯机制。现有的 Agent 框架通常将每一步视为独立的决策，忽略了兄弟节点（Sibling nodes）之间的信息互补性，也未能利用历史失败路径来指导当前探索。\n\n因此，一个自然的推论是：如果将代码仓库问答重构为一个规划问题，并引入蒙特卡洛树搜索（MCTS）作为核心引擎，或许能解决上述痛点。MCTS 固有的选择（Selection）、扩展（Expansion）、模拟（Simulation）和回溯（Backpropagation）机制，天然适合处理多跳推理中的不确定性。通过让 LLM 充当 MCTS 中的评估器（Evaluation Agent）和规划器（Planning Agent），系统可以在不依赖昂贵 rollout 的情况下，利用 LLM 的反馈价值（Value）来动态调整搜索方向，优先探索高潜力的代码路径，同时通过回溯机制避免在死胡同中浪费计算资源。这种将“结构化搜索算法”与“LLM 语义理解能力”结合的直觉，构成了 DEEPREPOQA 的核心思想。\n\n### § 4 核心 Intuition\n\n现有单路径 Agent 在代码仓库问答中失效，是因为它们缺乏对搜索空间的系统性探索与纠错能力，容易因初始检索偏差而陷入不可逆的错误轨迹。DEEPREPOQA 的核心直觉是将代码理解重构为基于蒙特卡洛树搜索（MCTS）的规划问题，利用 LLM 作为价值评估器，在搜索树中动态平衡探索与利用。通过多路径并行探索与基于反馈的回溯机制，系统能够自动规避低效路径，聚焦于包含关键证据的高价值代码区域，从而实现跨文件的深层多跳推理。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**DEEPREPOQA** 的核心方法是将代码仓库问答（Repository-level Code QA）重构为一个基于 **Monte-Carlo Tree Search (MCTS)** 的规划问题。它不再依赖单一的检索增强生成（RAG）或单路径的 ReAct 代理，而是通过四个专业化 Agent 的协作，在代码库的结构树上进行系统性的“搜索-验证”循环。\n\n**完整 Pipeline 流程（以问题：“Sphinx 如何实现 autodoc 扩展？”为例）：**\n\n1.  **仓库解析与表示 (Repository Parsing \u0026 Representation)**：\n    *   **预处理**：系统首先使用 Tree-sitter 解析仓库，构建抽象语法树（AST），提取类、函数、代码片段等元素，并建立索引。\n    *   **双重索引**：建立基于名称的结构索引（用于 `FindClass`, `FindFunction`）和基于语义嵌入的向量索引（用于 `SemanticSearch`）。\n\n2.  **MCTS 初始化与选择 (Selection)**：\n    *   **输入**：用户问题 \"How does Sphinx implement the autodoc extension?\"。\n    *   **状态**：初始根节点。\n    *   **动作**：MCTS 根据 UCT (Upper Confidence Bound) 公式选择最有潜力的节点进行扩展。初始时，所有分支未被探索，系统选择根节点开始第一轮模拟。\n\n3.  **感知 (Perception Agent)**：\n    *   **任务**：分析当前搜索状态。\n    *   **执行**：感知 Agent 检查从根节点到当前节点的路径以及兄弟节点的尝试。例如，它发现之前的分支已经探索了 `sphinx/ext/autodoc/__init__.py` 并找到了 `Documenter` 类，但尚未分析标准的入口点 `setup()` 函数。\n    *   **输出**：生成一份情境报告（Situational Report），指出 `setup()` 是关键缺失信息，引导后续规划。\n\n4.  **规划 (Planning Agent)**：\n    *   **任务**：基于情境报告生成候选动作。\n    *   **执行**：规划 Agent 提出多个候选动作以扩展搜索树，例如：\n        1.  `FindFunction(name=\"setup\", file_pattern=\"sphinx/ext/autodoc/*\")`\n        2.  `SemanticSearch(query=\"autodoc directive registration\")`\n        3.  `ViewCode(file=\"sphinx/ext/autodoc/__init__.py\")`\n    *   **输出**：选择其中一个动作（如 `FindFunction`）作为当前节点的新子节点。\n\n5.  **执行 (Execution Agent)**：\n    *   **任务**：执行规划的动作并获取证据。\n    *   **执行**：执行 Agent 调用 `FindFunction`，在索引中定位 `setup` 函数。\n    *   **证据策展 (Evidence Curation)**：对原始输出进行过滤，去重、去除样板代码，提取包含 `app.add_directive('automodule', ...)` 的关键代码片段。\n    *   **输出**：结构化的观察结果（Observation），即具体的代码片段及其文件位置。\n\n6.  **评估 (Evaluation Agent)**：\n    *   **任务**：评估动作的价值并反馈。\n    *   **执行**：评估 Agent 判断该代码片段是否有助于回答问题。由于找到了 `automodule` 指令的注册入口，它给予高价值评分（如 95/100），并建议下一步检查 `AutomoduleDirective` 类的实现。\n    *   **反向传播 (Back-propagation)**：将该价值分数沿路径回溯更新父节点的 Q 值和访问计数，使该路径在后续迭代中更可能被选中。\n\n7.  **迭代与终止 (Iteration \u0026 Termination)**：\n    *   **循环**：重复步骤 2-6，直到达到最大迭代次数或选择 `Finish` 动作。\n    *   **终止**：当 `Finish` 动作被选中时，系统从最佳轨迹中提取所有引用的代码片段。\n\n8.  **答案合成 (Answer Synthesis)**：\n    *   **输出**：LLM 根据收集到的证据（如 `setup` 函数注册指令、`AutomoduleDirective` 类的实现细节）生成最终答案，并附带具体的代码引用（File:Line），确保答案可追溯且 grounded。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过**。\n\n本文主要贡献在于系统架构设计（Agentic Framework + MCTS）和工程实现，而非提出新的数学理论或复杂的推导公式。文中涉及的唯一数学公式是 MCTS 中标准的 **UCT (Upper Confidence Bound for Trees)** 公式，用于平衡探索（Exploration）与利用（Exploitation）：\n\n$$ UCT(s, a) = Q(s, a) + c \\sqrt{\\frac{\\ln N(s)}{N(s, a)}} $$\n\n*   **Intuition**：\n    *   $Q(s, a)$：代表“利用”，即该动作的历史平均价值。值越高，说明该路径越可能通向正确答案。\n    *   $c \\sqrt{\\frac{\\ln N(s)}{N(s, a)}}$：代表“探索”，即对该动作的不确定性奖励。访问次数 $N(s, a)$ 越少，该项越大，鼓励算法尝试未充分探索的路径。\n    *   **整体含义**：算法倾向于选择那些既有高历史价值，又未被充分探索的节点，从而避免陷入局部最优或过早收敛。\n\n由于该公式是 MCTS 的标准组成部分，并非本文的创新点，且本文重点在于如何将 LLM 代理集成到这一框架中，因此不进行深入的数学推导分析。\n\n---\n\n### § 7 实验设计与结论\n\n**RQ1: DEEPREPOQA 在仓库级代码问答中的有效性如何？**\n*   **实验设计**：在 **SWE-QA** 基准测试上，对比 DEEPREPOQA 与多种基线方法，包括直接提示（Direct Prompting）、RAG 方法（Function Chunking, Sliding Window）、Agent 方法（SWE-agent, OpenHands）以及商业工具（Cursor, Tongyi Lingma）。使用多个 LLM 后端（GPT-5.1, Kimi K2, Qwen3-Coder, GLM-4.6）进行评估，指标包括 Correctness, Completeness, Relevance, Clarity, Reasoning。\n*   **结论**：DEEPREPOQA 在所有开源模型中表现最佳，并在 GPT-5.1 后端下超越或持平商业工具。特别是在 Correctness 和 Reasoning 维度上显著提升，证明了 MCTS 引导的多跳推理优于单路径检索或简单 Agent。\n\n**RQ2: 各个组件对整体性能的贡献程度如何？**\n*   **实验设计**：进行消融实验（Ablation Study），分别移除 MCTS 框架（退化为贪婪搜索）、Perception Agent、Evaluation Agent 和 Semantic Search，观察性能变化。\n*   **结论**：所有组件均不可或缺。移除 **Evaluation Agent** 导致性能下降最大（-3.50 分），表明价值估计对引导搜索路径至关重要；移除 **MCTS** 导致性能显著下降（-2.27 分），证明系统性探索优于贪婪策略。\n\n**RQ3: 探索迭代次数对性能有何影响？**\n*   **实验设计**：改变 MCTS 的最大节点扩展数（5, 10, 15, 20, 30），观察整体得分及各维度得分的变化。\n*   **结论**：增加迭代次数能稳步提升性能，但在 20-30 节点间收益递减并趋于平稳。这表明存在一个计算成本与性能的最佳平衡点，且 MCTS 需要一定的迭代次数才能充分发挥优势。\n\n**RQ4: DEEPREPOQA 的效率如何？**\n*   **实验设计**：统计各方法在相同迭代次数下的 Token 消耗（Input/Output Tokens）。\n*   **结论**：DEEPREPOQA 的 Token 消耗与 SOTA Agent 和商业工具相当，甚至在某些情况下输入 Token 更少，同时实现了更高的准确率，证明了其高效性。\n\n**RQ5: DEEPREPOQA 在不同类型问题上的表现如何？**\n*   **实验设计**：将 SWE-QA 中的问题分类为 What, Where, How, Why 等类型，分别评估性能。\n*   **结论**：DEEPREPOQA 在所有类型上均表现强劲，尤其在 **Why**（设计原理）和 **How**（实现机制）类问题上得分最高，表明其擅长处理需要深度推理和跨文件依赖分析的问题。", "additional_insights": "### § 8 Take-aways\n\nDEEPREPOQA 将代码仓库问答重构为基于 Monte-Carlo Tree Search (MCTS) 的规划问题，通过系统性的树搜索替代了传统 ReAct 代理的单路径线性推理，从而有效解决了跨文件长程依赖的深层推理难题。该方法引入了四个专用代理（Perception, Planning, Execution, Evaluation），其中 Evaluatio
