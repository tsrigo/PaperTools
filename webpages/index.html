n-level interpretability, and LLM-based methods, which typically generate static scripts upfront and cannot adapt to evolving circuit states. We present SynAct, an adaptive closed-loop LLM reasoning--acting agent that iteratively diagnoses live synthesis reports and reasons over the current circuit state, retrieved tool knowledge, and historical optimization experience to issue targeted commands. SynAct focuses on improving timing, particularly worst negative slack (WNS), while maintaining balanced area and power trade-offs. Experiments on a commercial synthesis tool across 14 designs show that SynAct reduces average WNS to 27% of that from bootstrap synthesis.", "category": "cs.AI", "cluster": "Domain-Specific Agentic Optimization", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-12 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文符合“构建、改进、评估、训练或演化 LLM智能体”的研究范围，具体依据如下：\n\n1.  核心对象明确为 LLM Agent：论文标题和摘要明确指出 SynAct 是一个 \"LLM reasoning-acting agent\"（LLM 推理-行动智能体）。它不仅仅是一个静态的代码生成器，而是一个具备感知（诊断实时综合报告）、记忆（检索工具知识和历史优化经验）、规划（推理当前电路状态）和行动（发出针对性命令）能力的智能体。\n\n2.  符合“单智能体”与“自我演化/自适应”方向：\n       单智能体能力：论文详细描述了智能体的核心机制，包括 Tool Use（使用综合工具）、Memory（利用历史优化经验）、Self-Reflection/Diagnosis（诊断实时报告）和 Planning（推理决策）。这完全契合筛选标准中关于单智能体规划、记忆、工具使用和反思的定义。\n       自适应/闭环演化：摘要强调该智能体是 \"adaptive closed-loop\"（自适应闭环）的，能够 \"iteratively diagnoses\"（迭代诊断）并 \"adapt to evolving circuit states\"（适应不断变化的电路状态）。这种基于环境反馈进行迭代决策和优化的机制，属于智能体在长期决策场景下的自我完善和自适应行为，符合“自我演化”或“持续改进”的智能体研究范畴。\n\n3.  非单纯的应用层论文：虽然应用场景是电子设计自动化（EDA/逻辑综合），但论文的核心贡献在于提出了一种新的 Agent 架构和方法论（SynAct），即如何让 LLM 在复杂、高维、动态变化的环境中通过闭环反馈进行有效决策。这不仅仅是将 LLM 作为工具解决领域问题，而是研究了智能体在特定复杂环境下的行为机制和适应能力，符合“领域是场景，机制才是贡献”的保留原则。\n\n4.  排除项检查：\n       不涉及多智能体拓扑或通信协议。\n       不涉及安全、对齐、可解释性（这里的 interpretability 是指决策层面的可解释性，而非模型内部机制的可解释性研究，且主要服务于 Agent 的决策优化）。\n       不涉及图神经网络或知识图谱作为核心推理结构（虽然可能用到知识检索，但核心是 LLM Agent 的闭环控制）。\n\n综上所述，该论文研究了一种具有自适应、闭环反馈能力的 LLM 智能体架构，旨在解决复杂环境下的长期决策问题，完全符合 Agentic AI 的研究重点。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：如何在商业逻辑综合（Logic Synthesis）工具中，实现一种能够适应电路状态动态变化、具备高维度决策能力且可解释的自动化优化代理（Agent），以显著提升时序（Timing）、面积（Area）和功耗（Power，即 PPA）指标。逻辑综合是将 RTL 设计转化为门级网表的关键步骤，其结果对优化命令的选择和顺序高度敏感。由于商业综合工具提供了庞大的命令空间和复杂的配置参数，传统的合成调优（Synthesis Tuning）变成了一个高维、高成本的设计空间探索挑战。\n\n这一问题的重要性在于，时序违规（Timing Violations）是芯片设计中的关键瓶颈，一旦违反往往需要重新调整流程并进行额外的布局布线（Place-and-Route）迭代，从而大幅延长设计周期。现有的自动化方法要么局限于固定的动作空间，缺乏对当前电路状态的细粒度理解；要么基于大语言模型（LLM）生成静态脚本，无法根据中间反馈进行自适应调整。解决这一问题能够带来显著价值：SynAct 通过闭环的推理-行动机制，能够实时诊断电路状态并检索相关知识，从而在保持面积和功耗平衡的同时，将平均最差负余量（Worst Negative Slack, WNS）降低至初始综合结果的 27%，极大地提高了综合效率和质量，减少了人工调优的需求。\n\n### § 2 前人工作与不足\n\n该问题此前主要通过两类范式进行探索，但均存在显著局限。第一类是自动化搜索方法，如基于强化学习（RL）、贝叶斯优化（BO）、蒙特卡洛树搜索（MCTS）和上下文多臂老虎机（Contextual Bandits，如 CBTune [8]）的方法。这些方法通常将综合调优视为在固定动作空间（如 ABC 工具中的 AIG 级操作序列）上的组合搜索。虽然它们在特定工具上有效，但其主要不足在于：1）动作空间固定且有限，难以覆盖商业工具中丰富且上下文相关的命令词汇；2）依赖黑盒奖励信号，缺乏决策与当前电路状态之间的高层可解释性；3）无法利用工具文档中的语义知识，导致在复杂商业工具上的泛化能力差。\n\n第二类是基于 LLM 的方法，如 ChatEDA [9]、ChipNeMo [10] 和 ChatLS [11]。这些方法利用 LLM 从用户意图和工具文档中直接生成 Tcl 脚本或命令序列，避免了固定动作空间的限制。然而，它们的主要不足在于采用“一次性”（One-shot）生成策略，即预先生成完整的静态脚本。这种非自适应的方法无法在命令执行后根据更新的电路状态（如新的时序报告）进行调整，导致后续命令可能基于过时的电路信息，从而产生次优结果。此外，纯 LLM 推理缺乏对历史优化经验的有效复用，且在处理海量工具文档时容易因信息过载而产生推理错误。SynAct 正是针对这些不足，提出了结合 GraphRAG 进行场景相关知识检索和基于 GrammarVAE 潜在空间的贝叶斯优化来复用历史经验的闭环自适应代理，从而克服了静态脚本的僵化和黑盒搜索的低效。", "core_insight": "### § 3 重建作者的思考路径\n\n在逻辑综合（Logic Synthesis）领域，传统的自动化优化方法（如基于强化学习 RL、贝叶斯优化 BO 或蒙特卡洛树搜索 MCTS 的方法）通常将问题建模为在固定动作空间（Fixed Action Space）上的黑盒搜索。然而，商业综合工具（如 Design Compiler 或 AltiSyn）的命令空间极其庞大且参数复杂，固定动作空间难以覆盖所有优化场景，且这些方法缺乏对电路状态（Circuit State）的可解释性诊断能力，导致决策与当前电路瓶颈脱节。\n\n与此同时，随着大语言模型（LLM）在电子设计自动化（EDA）中的应用兴起，出现了如 ChatEDA、ChatLS 等工作。这些方法利用 LLM 的生成能力，直接从用户意图和工具文档中生成 Tcl 脚本。但这种“一次性生成”（One-shot Generation）或静态脚本模式存在致命缺陷：综合过程是一个状态依赖的过程，前一个命令的执行会改变电路的中间表示（IR）和时序报告（Timing Reports），而静态脚本无法根据执行后的实时反馈（Feedback）进行动态调整，导致后续命令可能基于过时的电路状态，从而产生次优结果甚至破坏之前的优化成果。\n\n作者观察到，商业综合工具支持交互式会话（Interactive Session），允许在每次命令执行后获取更新的 PPA 报告。这暗示了将综合优化视为一个闭环（Closed-loop）的马尔可夫决策过程（MDP）的可能性。然而，直接让 LLM 在每一步进行推理面临两个挑战：一是工具文档冗长，LLM 容易因信息过载（Information Overload）而产生幻觉或检索无关知识；二是 LLM 缺乏对历史优化经验（Historical Experience）的系统性复用，导致在长视界（Long-horizon）探索中效率低下，容易重复尝试无效命令。\n\n因此，作者构思了一个自适应的闭环代理（Adaptive Closed-loop Agent），即 SynAct。该代理不再一次性生成脚本，而是迭代地执行“诊断-推理-行动-观察”循环。为了解决信息过载，作者引入了基于图结构的检索增强生成（GraphRAG），将场景、命令和变量结构化，实现精准的知识检索；为了解决经验复用问题，作者结合语法变分自编码器（GrammarVAE）和贝叶斯优化（BO），在潜在空间（Latent Space）中利用历史反馈指导探索。这种设计旨在结合 LLM 的语义理解能力、RAG 的精准知识 grounding 以及 BO 的高效探索能力，实现针对当前电路状态的动态优化。\n\n### § 4 核心 Intuition\n\n传统方法要么受限于固定动作空间的黑盒搜索，要么受限于无法适应电路状态变化的静态脚本生成，导致优化效果受限。SynAct 的核心直觉是将逻辑综合视为一个**状态依赖的闭环交互过程**，通过 LLM 代理实时诊断当前电路的时序瓶颈，并结合检索到的精准工具知识和历史优化经验，动态生成并执行针对性的优化命令。这种方法通过**迭代反馈（Iterative Feedback）**和**情境感知（Context-awareness）**，解决了静态脚本无法适应电路演化以及黑盒搜索缺乏可解释性的问题，从而在保持面积和功耗平衡的同时，显著改善时序性能（WNS）。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nSynAct 的核心方法是一个基于大语言模型（LLM）的自适应闭环代理（Adaptive Closed-loop LLM Agent），旨在通过迭代诊断和优化来改进逻辑综合（Logic Synthesis）中的 PPA（Performance, Power, Area）指标，特别是最差负时序裕量（WNS）。其完整 Pipeline 如下：\n\n1.  **初始化与 Bootstrap Synthesis**：\n    *   **输入**：RTL 设计代码、用户优化请求（如优先优化 WNS）、工具手册及环境变量。\n    *   **处理**：首先执行标准的 Bootstrap Synthesis，建立初始电路状态（Initial Circuit State），生成初始的 PPA 报告（包括时序、面积、功耗等）。\n    *   **输出**：初始 Netlist 和基准 PPA 指标。\n\n2.  **迭代优化循环（Iterative Optimization Loop）**：\n    该循环包含三个主要阶段，直到满足终止条件或达到最大迭代次数：\n\n    *   **阶段一：分析代理诊断（Analysis Agent Diagnosis）**\n        *   **Preprobe**：Analysis Agent 解析当前的原始报告日志，识别性能瓶颈。如果信息不足，它会主动生成 `analyze_*` 命令（如 `analyze_clock_timing`）进行探测，以获取更细粒度的电路状态信息。\n        *   **Postprobe**：结合探测结果，Agent 生成结构化的诊断报告，包括瓶颈总结、违规路径、模块假设及建议策略。\n        *   **输出**：结构化的诊断信息（Diagnosis），作为下一步的输入。\n\n    *   **阶段二：优化代理生成候选命令（Optimization Agent Candidate Generation）**\n        *   **知识检索（GraphRAG）**：利用多层 GraphRAG 模块，根据诊断信息检索与当前场景相关的工具文档片段。GraphRAG 构建了场景（Scenarios）、命令（Commands）和变量（Variables）之间的图谱关系，确保检索到的知识具有上下文相关性。\n        *   **经验复用（BO-Guided Experience Refinement）**：利用 GrammarVAE 将历史有效命令编码到潜在空间（Latent Space），并通过贝叶斯优化（Bayesian Optimization, BO）在该空间中搜索，解码出具有潜力的新命令种子（BO-seeded candidates）。\n        *   **命令生成**：Optimization Agent 结合诊断信息、GraphRAG 检索到的文档和 BO 种子，生成一组候选命令（Candidates），并为每个命令提供推理依据（Rationale）。\n        *   **输出**：一组候选合成命令（Candidate Commands）。\n\n    *   **阶段三：候选选择与执行（Candidate Selection \u0026 Execution）**\n        *   **安全过滤**：移除那些可能导致 WNS 恶化超过阈值或奖励低于基准的候选命令。\n        *   **评分与选择**：对剩余候选命令进行评分，评分函数综合考虑了奖励（Reward）、探索强度（Exploration）和重复惩罚（Redundancy Avoidance）。选择得分最高的安全命令。\n        *   **执行**：在综合工具中执行选定的命令，更新电路状态，并生成新的 PPA 报告。\n        *   **输出**：更新后的 Netlist 和新的 PPA 报告，作为下一轮迭代的输入。\n\n3.  **终止与输出**：\n    *   当满足优化目标或迭代预算耗尽时，循环结束。\n    *   **最终输出**：优化后的 Netlist 及最终的 PPA 指标。\n\n**真实例子讲解（以 `arm9` 设计为例，参考 Fig. 5）：**\n*   **输入**：`arm9` RTL 代码，目标优化 WNS。\n*   **Bootstrap**：初始 WNS 为 -20.85 ps。\n*   **Iteration 1**：\n    *   **诊断**：识别出关键路径违规。\n    *   **生成**：BO 引导生成增量时序优化命令 `optimize -mode timing -map_effort high -incremental`。\n    *   **执行**：WNS 改善至 -8.50 ps。\n*   **Iteration 2**：\n    *   **诊断**：基于新报告，继续保守优化。\n    *   **生成**：再次使用类似的增量优化命令。\n    *   **执行**：WNS 改善至 -6.26 ps。\n*   **Iteration 3**：\n    *   **诊断**：GraphRAG 检索到针对特定关键路径的 `tdopt` 策略。\n    *   **生成**：生成 `tdopt -flat -resyn2 -area 1.000000`。\n    *   **执行**：WNS 改善至 -4.03 ps。\n*   **Iteration 4 \u0026 5**：\n    *   **诊断与生成**：分别尝试寄存器重定时（`retime_register`）和相位分配（`phase_assign`）。\n    *   **执行**：最终 WNS 达到 -3.70 ps。\n*   **输出**：优化后的 `arm9` Netlist，WNS 显著降低。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的理论数学推导，其核心在于工程实现和算法组合。但涉及两个关键的数学/算法概念，简要说明如下：\n\n1.  **马尔可夫决策过程（MDP）建模**：\n    *   将综合优化建模为 MDP $M = (X, A, F, R)$。\n    *   $X$ 是状态空间（当前 Netlist 和 PPA 报告）。\n    *   $A$ 是动作空间（可执行的合成命令）。\n    *   $F$ 是转移函数（由综合工具实现）。\n    *   $R$ 是奖励函数，用于量化 PPA 指标的改善程度。\n    *   **Intuition**：这为代理的决策提供了形式化框架，使得每一步优化都可以被视为在状态空间中寻找最优动作的过程。\n\n2.  **奖励函数（Reward Function）**：\n    *   公式：$r(C) = \\prod_{i} (1 - \\frac{\\log(1 + err_i)}{\\log(1 + target_i)})^{w_i}$\n    *   $err_i$ 是当前指标与目标值的误差。\n    *   $w_i$ 是各指标的权重，主要优化目标（如 WNS）权重更高。\n    *   **Intuition**：该函数将多个 PPA 指标（时序、面积、功耗）聚合为一个标量奖励。使用对数函数压缩大误差的影响，避免单一指标的极端值主导奖励。权重机制允许用户指定优化优先级。\n\n3.  **贝叶斯优化中的 UCB 采集函数**：\n    *   公式：$z_{next} = \\arg \\max_{z \\in P} [\\mu(z) + \\kappa_{acq} \\sigma(z)]$\n    *   $\\mu(z)$ 是代理模型预测的平均奖励（利用已知高奖励区域）。\n    *   $\\sigma(z)$ 是局部不确定性估计（鼓励探索未知区域）。\n    *   **Intuition**：在 GrammarVAE 的潜在空间中，BO 通过平衡“利用”（Exploitation）和“探索”（Exploration）来选择下一个潜在点 $z_{next}$，从而高效地搜索离散命令空间。\n\n### § 7 实验设计与结论\n\n**提出了什么问题**：\n现有的逻辑综合优化方法主要分为两类：基于自动搜索的方法（如 RL, BO）受限于固定动作空间且缺乏可解释性；基于 LLM 的方法（如 ChatLS）通常生成静态脚本，无法适应电路状态的动态变化。如何结合 LLM 的推理能力和闭环反馈机制，实现自适应、高效的综合优化？\n\n**设计了什么实验验证这个问题**：\n1.  **基线对比**：将 SynAct 与两种代表性基线方法对比：\n    *   **ChatLS**：基于 LLM 的一次性脚本生成方法（代表非自适应 LLM 方法）。\n    *   **CBTune**：基于上下文多臂老虎机（Contextual Bandit）的方法（代表固定动作空间的自动搜索方法）。\n2.  **评估指标**：在 14 个开源 RTL 设计上，主要评估 WNS 的改善程度（Ratio Avg.），同时监控 TNS、面积和功耗的变化，以验证 PPA 平衡性。\n3.  **消融实验**：\n    *   **w/o BO**：移除贝叶斯优化引导的经验复用模块，验证 BO 对探索效率的贡献。\n    *   **Vanilla RAG / w/o RAG**：替换或移除 GraphRAG 模块，验证结构化知识检索对决策准确性的贡献。\n4.  **泛化性测试**：使用不同的 LLM（DeepSeek V3.1 vs. GPT-5.2）验证框架的通用性。\n5.  **轨迹分析**：分析不同迭代次数下的优化轨迹，验证迭代反馈的有效性。\n\n**问题的答案是什么**：\n1.  **SynAct 显著优于基线**：SynAct 将平均 WNS 降低至 Bootstrap 合成的 27.03%，远优于 ChatLS（71.73%）和 CBTune（66.67%）。在两个设计上实现了时序闭合（WNS \u003E= 0）。\n2.  **PPA 平衡性良好**：在大幅改善时序的同时，SynAct 保持了面积和功耗与 Bootstrap 水平相当（面积 99.28%，动态功耗 98.92%），证明了其在多目标优化中的平衡能力。\n3.  **模块有效性验证**：消融实验表明，BO 模块显著提升了探索效率（WNS Ratio Avg. 从 27.0% 升至 37.5% 当移除 BO），GraphRAG 提供了比扁平检索更丰富的上下文知识（WNS Ratio Avg. 从 27.0% 升至 28.6% 当使用 Vanilla RAG）。\n4.  **LLM 泛化性**：SynAct 框架在不同 LLM 上均表现良好，更强的 LLM（如 GPT-5.2）能进一步提升性能（WNS Ratio Avg. 降至 20.37%），证明框架本身的有效性不依赖于特定 LLM。\n5.  **迭代反馈至关重要**：优化轨迹显示，随着迭代进行，SynAct 能利用反馈逐步改善 WNS，证明了闭环自适应机制的优势。", "additional_insights": "### § 8 Take-aways\n\nSynAct 提出了一种基于大语言模型（LLM）的闭环代理架构，通过迭代诊断实时综合报告（synthesis reports）并生成针对性命令，解决了传统静态脚本生成无法适应电路状态动态变化的问题。该方法引入了多层 GraphRAG 模块，将工具文档中的场景、命令和变量构建为结构化知识图谱，从而在检索时提供比传统向量检索更精准的上下文相关指令，有效缓解了信息过载导致的推理错误。为了克服纯 LLM 推理缺乏历史经验复用的缺陷，SynAct 结合 GrammarVAE 将离散的综合命令编码到连续潜在空间，并利用贝叶斯优化（Bayesian Optimization, BO）在该空间内引导探索，实现了基于历史反馈的高效经验复用。在 14 个开源设计上的实验表明，SynAct 将平均最差负余量（WNS）降低至初始综合结果的 27%，显著优于 ChatLS 和 CBTune 等基线方法，同时在面积和功耗上保持了良好的平衡。尽管候选评估占据了大部分运行时间，但 SynAct 通过并行评估和信任区域更新机制，在优化质量与计算成本之间取得了有效平衡，并展示了在不同 LLM 后端（如 DeepSeek 和 GPT）上的泛化能力。\n\n### § 9 最脆弱的假设\n\nSynAct 核心贡献最脆弱的假设是：**GrammarVAE 编码后的潜在空间（latent space）具有语义局部性，即语法结构相似的综合命令在潜在空间中距离较近，且其对应的综合奖励（reward）变化也是平滑且可预测的。** 如果这一假设不成立，贝叶斯优化（BO）所依赖的代理模型（surrogate model）将无法准确估计未探索区域的期望奖励和不确定性，导致 BO 引导的探索方向失效，甚至误导 LLM 生成无效或有害的命令。在实际中，综合命令的效果往往对微小的参数变化极度敏感（例如，`-effort high` 与 `-effort medium` 可能导致完全不同的优化路径和结果），这种非线性的“悬崖效应”可能破坏潜在空间的平滑性假设。论文在 Section VI-E 中通过对比潜在空间中“近邻”命令对与“远邻”命令对的奖励差异（$\\Delta_r$）提供了初步证据，显示近邻对的平均奖励差异更小（0.188 vs 0.238），但这仅证明了统计上的相关性，并未证明 BO 代理模型能够准确拟合这种复杂的非线性映射关系，特别是在高维潜在空间中，这种局部平滑性可能不足以支撑全局有效的优化轨迹。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现并验证 **GrammarVAE 潜在空间的局部性假设及其对 BO 引导效果的影响**，无需复现完整的 SynAct 闭环系统。具体步骤如下：首先，收集一组已执行的综合命令及其对应的 WNS 奖励数据（可从论文公开代码或类似数据集获取，或使用少量设计手动生成）；其次，使用预训练的 GrammarVAE 模型将这些命令编码为潜在向量，并计算向量间的欧氏距离；然后，分析潜在距离与奖励差异之间的相关性，验证“距离近则奖励相似”的假设是否成立；最后，在一个简化的 BO 框架下，仅使用 GrammarVAE 编码和 RBF 代理模型，模拟 BO 的采样过程，观察其推荐的命令是否在真实执行中确实带来了奖励提升。如果潜在距离与奖励差异的相关性较弱，或者 BO 推荐的命令在实际执行中并未显著优于随机采样，则反驳了该假设，表明当前潜在空间表示不足以支持有效的 BO 引导。", "research_value": "### § 11 最强反例设计\n\n若要挑战 SynAct 的有效性，最有力的攻击并非质疑其最终优化结果，而是攻击其**“闭环自适应”带来的计算开销与收益之间的边际递减效应，以及 GraphRAG 在动态电路状态下的知识过时问题**。\n\n首先，设计一个**“高维参数敏感型”反例场景**。SynAct 的核心优势在于通过 LLM 推理和 GraphRAG 检索来生成命令。然而，商业综合工具（如 Design Compiler）中的许多高级命令（如 `compile_ultra` 或 `set_max_delay` 的细粒度约束）对参数极其敏感，且效果具有高度的非线性和不可预测性（即“悬崖效应”）。可以构造一个包含大量深亚阈值漏电敏感模块和复杂时钟树结构的 RTL 设计。在此场景下，SynAct 的 Analysis Agent 可能正确识别出时序瓶颈，但 GraphRAG 检索到的“最佳实践”文档往往是静态的、基于旧版本工具或通用场景的。由于电路状态在每次迭代后发生剧烈变化（Netlist 结构重组），之前有效的命令序列可能在新状态下完全失效甚至有害。如果 SynAct 依赖的 GrammarVAE 潜在空间无法捕捉这种动态的、上下文相关的语义漂移，BO 引导的探索将陷入局部最优，导致其生成的候选命令质量低于随机搜索或基于简单启发式的规则引擎。此时，SynAct 的“推理”过程不仅没有提供价值，反而因为 LLM 的幻觉和 RAG 的噪声引入了错误的优化方向，导致最终 WNS 改善不如基线方法 CBTune（后者虽然动作空间固定，但通过大量试错能覆盖更多随机可能性）。\n\n其次，提出一个**“计算效率悖论”的反例**。SynAct 声称通过闭环反馈实现自适应优化，但每一次迭代都涉及 LLM 推理、GraphRAG 检索、BO 采样和综合工具执行。在真实的芯片设计流程中，时间就是金钱。可以设计一个实验，对比 SynAct 与一个**“预训练策略网络 + 快速仿真”**的方法。假设存在一个轻量级的强化学习代理，它不依赖昂贵的 LLM 推理，而是基于历史数据训练出的策略网络，能够在毫秒级时间内生成命令序列。如果 SynAct 需要 10 次迭代（每次耗时数分钟）才能达到 WNS -5ps，而轻量级 RL 代理只需 1 次迭代（耗时几秒）就能达到 WNS -6ps，那么 SynAct 的“自适应”优势就被其高昂的计算成本所抵消。特别是在大规模 SoC 设计中，这种时间开销是不可接受的。因此，反例的核心论点是：SynAct 的“智能”是以牺牲工程实用性为代价的，其在小规模开源设计上的成功无法推广到对时间敏感的商业场景。\n\n最后，攻击**GraphRAG 的知识一致性假设**。GraphRAG 假设工具文档中的场景、命令和变量之间存在稳定的图谱关系。然而，商业综合工具的文档往往存在歧义、过时或相互矛盾的情况。可以构造一个场景，其中两个看似相关的命令在文档中被描述为互补，但在实际执行中却相互冲突（例如，一个命令优化面积，另一个命令优化时序，但两者在特定电路结构下会导致死锁或无限循环）。如果 SynAct 的 Analysis Agent 无法识别这种深层的语义冲突，仅依赖图谱的结构相似度进行检索，它可能会生成一组在语法上正确但在语义上自相矛盾的候选命令。这将导致综合工具报错或产生未定义行为，从而证明 SynAct 缺乏对工具内部逻辑的深层理解，仅停留在表面文本匹配层面。\n\n### § 12 Follow-up Research Idea\n\n基于 SynAct 在**计算效率**和**动态知识适应性**方面的局限，提出一个全新的研究方向：**“神经符号协同的实时综合优化代理”（Neuro-Symbolic Real-Time Synthesis Agent, NS-RTSA）**。\n\n**(a) 驱动局限与未满足需求：**\nSynAct 的核心瓶颈在于 LLM 推理和 GraphRAG 检索的高延迟，以及静态知识图谱无法实时反映电路状态的动态变化。现有的方法要么过于依赖昂贵的 LLM 推理（如 SynAct），要么缺乏对复杂电路状态的细粒度理解（如传统 RL）。未满足的需求是：如何在保持高优化质量的同时，实现**毫秒级**的决策响应，并能够**实时感知**电路结构的微小变化，从而在大规模 SoC 设计中实现真正的在线自适应优化。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴**神经符号人工智能（Neuro-Symbolic AI）**和**图神经网络（GNN）**在程序合成和电路验证中的应用。具体来说，结合**符号逻辑推理**（用于保证命令的语法正确性和语义一致性）和**神经网络预测**（用于快速评估命令的潜在效果）。此外，借鉴**在线学习（Online Learning）**和**元学习（Meta-Learning）**技术，使代理能够从每次迭代的反馈中快速适应新的电路状态，而不是依赖静态的知识图谱。\n\n**(c) 第一个实验设计：**\n1.  **构建神经符号架构**：\n    *   **符号层**：使用形式化方法（如 SMT Solver）对综合命令进行语法和语义验证，确保生成的命令不会导致工具错误或死锁。这解决了 SynAct 中 GraphRAG 可能检索到冲突命令的问题。\n    *   **神经层**：训练一个轻量级的 GNN 模型，将当前 Netlist 表示为图结构，并预测不同命令对 PPA 指标的即时影响。该模型通过元学习初始化，能够快速适应新的电路设计。\n2.  **实时反馈循环**：\n    *   在每次迭代中，GNN 模型快速生成一组候选命令，并由符号层进行过滤。\n    *   执行选定的命令后，将新的电路状态和 PPA 变化反馈给 GNN 模型，进行在线微调（Online Fine-tuning），使其能够捕捉电路状态的动态变化。\n3.  **对比实验**：\n    *   在相同的 14 个开源 RTL 设计上，对比 NS-RTSA 与 SynAct、ChatLS 和 CBTune 的性能。\n    *   **关键指标**：除了 WNS、面积和功耗外，重点评估**决策延迟**（Decision Latency）和**收敛速度**（Convergence Speed）。\n    *   **预期结果**：NS-RTSA 应在保持与 SynAct 相当的优化质量的同时，将决策延迟降低 1-2 个数量级，并在大规模设计上展现出更好的可扩展性。\n\n**与已有工作的区别：**\nSynAct 依赖 LLM 的通用推理能力和静态知识图谱，而 NS-RTSA 依赖专用的神经符号模型和在线学习能力。SynAct 是“慢思考”的，适合离线优化；NS-RTSA 是“快思考”的，适合在线自适应优化。NS-RTSA 不依赖外部文档检索，而是通过 GNN 直接从电路结构中学习优化策略，从而避免了知识过时和语义冲突的问题。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Fangzhou Liu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Peiyi Han\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jiawei Liu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yuan Pu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zhuolun He\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Rongliang Fu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Tsung-Yi Ho\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Bei Yu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Dept. of Computer Science and Engineering, The Chinese University of Hong Kong\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding authors (e-mail: byu@cse.cuhk.edu.hk; rlfu@cse.cuhk.edu.hk).\"\n    }\n  ]\n}\n```", "summary_translation": "逻辑综合将 RTL 设计转换为门级网表，其中 PPA 结果对优化命令的选择高度敏感，使得综合调优具有高维性和高昂成本。先前的方法分为两类：自动化方法在固定的动作空间中进行黑盒搜索，决策层面的可解释性有限；基于 LLM 的方法通常预先生成静态脚本，无法适应不断变化的电路状态。我们提出了 SynAct，一种自适应闭环 LLM 推理-行动智能体，它迭代诊断实时综合报告，并结合当前电路状态、检索到的工具知识以及历史优化经验进行推理，以发出针对性命令。SynAct 专注于改善时序，特别是最差负余量（WNS），同时保持面积和功耗的平衡权衡。在商业综合工具上对 14 个设计的实验表明，SynAct 将平均 WNS 降低至 bootstrap 综合结果的 27%。"}, {"title": "SynWeaver: Website-Prior Task and Trajectory Co-Synthesis for Web Agents", "arxiv_id": "2608.12429", "authors": "Ruitao Wang, Yuwen Hao, Menglin Yang", "summary": "Web agents often struggle to generalize to unseen websites because they lack website-specific supervision. Recent exploration-based data synthesis methods reduce manual annotation, but they still face two key limitations: they often fail to cover the full functionality of a website, and without sufficient website prior knowledge, they tend to propose hallucinated tasks, which in turn limits the diversity and efficiency of downstream trajectory synthesis. We present \\textbf{SynWeaver}, a website-prior task-trajectory co-synthesis framework designed to address these challenges. SynWeaver first performs structured website exploration and constructs a website map that covers a broad set of functionally distinct page states and executable interactions on the target website. It then derives page-level and transition-level supervision from this map to train a UI-aware model with website-specific priors, enabling more grounded task proposals. Finally, SynWeaver performs collaborative task-trajectory synthesis, jointly updating the task and execution trajectory when they become inconsistent, and then verifies and repairs the collected results to produce executable, semantically aligned supervision. Experiments on WebArena and WebVoyager demonstrate that SynWeaver consistently outperforms strong synthesis baselines and yields more effective supervision for both in-domain and out-of-domain generalization.", "category": "cs.AI", "cluster": "Domain-Specific Agentic Optimization", "tags": ["cs.AI"], "filter_reason": "该论文符合研究范围，核心依据如下：\n\n1.  研究对象明确为 LLM 智能体 (Web Agents)：论文标题和摘要明确指出研究对象是“Web Agents”，属于 Agentic AI 中的具身/环境交互智能体范畴。\n2.  核心贡献在于智能体能力的构建与改进 (构建/训练)：论文提出的 SynWeaver 框架旨在解决 Web 智能体泛化能力差、缺乏特定网站监督数据的问题。它通过“任务-轨迹协同合成”（Task and Trajectory Co-Synthesis）来生成高质量的监督数据，用于训练 UI 感知模型。这直接对应筛选标准中“构建、改进、训练 LLM 智能体”的目标。\n3.  涉及智能体核心机制 (规划/执行/自我修正)：摘要中提到的“collaborative task-trajectory synthesis”（协同任务-轨迹合成）、“jointly updating the task and execution trajectory”（联合更新任务和执行轨迹）以及“verifies and repairs”（验证和修复），体现了智能体在规划（Task）和执行（Trajectory）层面的闭环优化机制。这属于智能体内部逻辑的改进，而非单纯的基础设施或应用层调用。\n4.  非排除项：虽然涉及数据合成，但其目的是为智能体提供训练数据以增强其能力（泛化性、减少幻觉），而非单纯的数据工程；也不涉及多智能体拓扑、通信协议或安全/对齐等排除领域。\n\n综上，该论文通过改进数据合成机制来提升 Web 智能体的规划与执行能力，属于“构建和改进 LLM 智能体”的前沿研究，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\nWeb agents 在未见过的网站（unseen websites）上泛化能力较差，核心原因在于缺乏针对特定网站的监督信号（website-specific supervision）。虽然现有的基于探索的数据合成方法（exploration-based data synthesis）减少了人工标注成本，但仍面临两个关键局限：一是探索过程往往无法覆盖网站的全部功能，导致数据多样性不足；二是由于缺乏充分的网站先验知识（website prior knowledge），模型容易提出幻觉任务（hallucinated tasks），进而限制了下游轨迹合成（trajectory synthesis）的多样性和效率。SynWeaver 旨在解决这一“任务-轨迹”联合合成中的对齐与覆盖问题。其重要性在于，它通过构建结构化的网站地图（website map）并学习 UI 先验，实现了更 grounded 的任务提议和更高效的协同优化。解决这一问题不仅能显著降低高质量训练数据的获取成本，还能通过注入目标网站的结构化知识，大幅提升 Web agents 在域内（in-domain）和域外（out-of-domain）场景下的泛化性能与执行成功率。\n\n### § 2 前人工作与不足\n\n该问题此前已有多种尝试，主要分为利用外部资源（如教程）和直接从网站交互中挖掘任务两类。在直接交互挖掘领域，代表性工作包括 NNetNav、OS-Genesis 和 SynthAgent。NNetNav 通过多步 LLM 探索来缓解任务不可执行的问题，但代价是产生了大量冗余交互，效率低下。OS-Genesis 采用随机游走（random-walk）策略采样动作，虽然高效但往往短视，缺乏足够的网站特定知识，导致提出的任务在当前页面看似合理，却在后续交互中变得不可行。SynthAgent 引入了执行中的任务 refinement 和执行后的轨迹 refinement，部分缓解了初始任务不可行的问题。然而，这些方法的核心不足在于任务与轨迹的优化是解耦的（decoupled）：SynthAgent 往往为了适应已收集的轨迹而重写任务，导致任务描述变得像程序化指令而非自然的用户请求，且这种解耦无法可靠地修复执行时的失败，降低了数据效率和任务-轨迹的语义对齐。此外，随机游走或简单的功能分类探索难以保证对网站功能拓扑的全面覆盖，导致合成数据的多样性受限。SynWeaver 指出，缺乏显式的网站先验（explicit website priors）和协同优化机制（collaborative refinement）是现有方法无法同时实现高覆盖率、高执行可行性和自然任务表达的根本原因。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Web Agent 数据合成领域，研究者面临的核心矛盾是：手动标注成本过高，而现有的自动化合成方法（如基于随机游走或 LLM 引导的探索）往往产生低质量数据。早期的探索方法（如 OS-Genesis, NNetNav）主要依赖“反向任务合成”（Reverse Task Synthesis），即从交互轨迹反推任务。然而，这种方法的致命缺陷在于“缺乏网站先验知识”（Lack of Website Priors）。模型仅基于局部页面状态或短序列进行推理，容易提出在当前页面看似合理、但在后续交互中不可执行的任务（Hallucinated Tasks），或者生成的任务描述过于像操作手册而非自然用户请求。\n\n为了解决“任务不可执行”和“覆盖不全”的问题，研究者意识到必须引入更结构化的网站知识。在移动端 GUI Agent 领域，基于图结构的系统探索（如 DroidBot, KG-RAG）已被证明能有效覆盖功能状态。作者推测，将这种**结构化网站探索**（Structured Website Exploration）引入 Web 领域，构建一个包含功能 distinct 状态和可执行转换的“网站地图”（Website Map），可以解决随机探索的冗余和覆盖不足问题。\n\n有了网站地图后，下一步是如何利用它。直接让 LLM 基于地图生成任务仍可能缺乏对 UI 细节的理解。因此，作者思考：能否从地图中提取监督信号（如页面描述、元素功能、状态转换），微调一个**UI-aware 模型**（UI-aware Model），使其内化网站特定的交互先验？这样，任务生成就不再是盲目的猜测，而是基于对网站功能拓扑的理解。\n\n最后，针对任务与轨迹不一致的问题，现有的 SynthAgent 等方法采用“解耦优化”（Decoupled Refinement），即先优化任务再优化轨迹，或反之。这导致任务被强行扭曲以适配轨迹，失去了自然性。作者意识到，任务意图（Intent）和执行轨迹（Execution）是相互依赖的。如果执行受阻，可能是任务描述不清，也可能是轨迹步骤错误。因此，必须采用**协同合成**（Collaborative Synthesis），在检测到不一致时，联合更新任务描述和轨迹前缀，从而在保持任务自然性的同时确保可执行性。这一思考路径从“探索覆盖”到“先验学习”再到“协同优化”，构成了 SynWeaver 的完整逻辑闭环。\n\n### § 4 核心 Intuition\n\n现有 Web Agent 数据合成方法失败的核心原因在于**缺乏对网站全局功能结构的理解**，导致生成的任务要么不可执行，要么覆盖片面。SynWeaver 的核心直觉是：通过构建结构化的**Website Map** 并从中学习 **Website-specific UI Priors**，可以让模型“懂”网站的交互逻辑，从而提出更 grounded 的任务。在此基础上，通过 **Task-Trajectory Collaborative Synthesis** 联合优化任务意图与执行轨迹，解决了传统解耦方法中任务被扭曲为操作手册的问题，实现了高质量、高多样性且语义对齐的数据合成。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nSynWeaver 的核心方法是一个基于 **Website-Prior**（网站先验知识）的 **Task-Trajectory Co-Synthesis**（任务-轨迹协同合成）框架。其目标是解决现有 Web Agent 数据合成方法中任务幻觉（Hallucination）和轨迹不可执行的问题。\n\n**完整 Pipeline 流程：**\n\n1.  **Website Map Construction（网站地图构建）：**\n    *   **输入：** 目标网站的 Seed URL。\n    *   **处理：** 使用基于 **DFS**（深度优先搜索）的爬虫进行结构化探索。不同于随机游走，它通过 **State Processor** 进行状态去重（Progressive State Comparison）和重复触发检测（Duplicate-trigger Detection），只保留功能上独特的页面状态（States）和可执行的交互转换（Transitions）。\n    *   **输出：** 一个包含功能拓扑结构的网站地图 $G=(S, T)$，其中节点是页面状态（截图+Accessibility Tree），边是交互动作。\n\n2.  **Website-Prior Learning（网站先验学习）：**\n    *   **输入：** 网站地图 $G$ 中的状态和转换数据。\n    *   **处理：** 利用 Teacher Model 生成五种监督信号：\n        *   **Page-level:** Page Description（页面描述）, Page QA（页面问答）。\n        *   **Transition-level:** Element Description（元素功能描述）, Forward Transition Description（正向状态变化预测）, Inverse Transition Description（逆向动作推断）。\n    *   **训练：** 使用这些数据通过 **LoRA** 微调基础多模态模型，得到 **UI-aware Model ($M_{ui}$)**，使其具备特定网站的 UI 先验知识。\n\n3.  **Task-Trajectory Collaborative Synthesis（任务-轨迹协同合成）：**\n    *   **输入：** 网站地图中的转换三元组 $(s, op, s')$ 和 $M_{ui}$。\n    *   **处理：**\n        *   **Reverse Task Synthesis:** $M_{ui}$ 根据转换三元组反向推断出一个高层任务 $x_0$。\n        *   **Collaborative Refinement:** Teacher Model ($M_1$) 在线执行任务。当遇到执行停滞或意图不一致时，触发协同优化：\n            *   **Task-only Mode:** 仅修改任务描述以匹配当前轨迹。\n            *   **Joint Mode:** 同时修改任务描述和轨迹前缀（删除冗余步骤、重排序、更新推理），确保语义一致性和可执行性。\n    *   **Post-Verification:** 对生成的轨迹进行启发式验证（终止有效性、轨迹有效性、一致性）。若失败，则进入重建阶段（Reconstruction），由更强的 Teacher ($M_2$) 修复或丢弃。\n    *   **输出：** 经过验证的、语义对齐且可执行的 Task-Trajectory 对集合 $D$。\n\n**真实例子讲解：**\n\n假设目标网站是 **Amazon**，我们要合成一个关于“查找特定商品评论”的数据。\n\n1.  **地图构建：** 爬虫访问 Amazon 首页，点击“Electronics”，进入“Headphones”列表页，点击某款耳机进入详情页，点击“Reviews”标签。系统记录这些状态和点击动作，构建出从首页到评论区的功能路径。\n2.  **先验学习：** 模型学习到“点击 Reviews 标签”会导致页面从商品详情变为评论列表，且该按钮的功能是“查看用户评价”。\n3.  **协同合成：**\n    *   **初始任务：** $M_{ui}$ 观察到“点击 Reviews”这一转换，生成初始任务：“Find the reviews for Sony WH-1000XM5 headphones.”\n    *   **执行与冲突：** Agent 开始执行，但在评论页发现没有“1-star”评论（假设该商品全是好评），Agent 陷入停滞或发出 STOP 信号。\n    *   **协同优化（Joint Mode）：** 系统检测到冲突。Teacher Model 介入，发现原任务要求“1-star”但实际不存在。它修改任务为：“Find the first 5-star review for Sony WH-1000XM5 headphones and summarize its key points.” 同时，它删除了之前无效的搜索步骤，保留有效的导航步骤，并更新推理逻辑。\n    *   **验证：** Agent 继续执行，成功找到五星评论并总结。Post-Verification 确认轨迹有效且以 `none` 动作正确终止。\n    *   **最终数据：** 得到一条高质量数据：任务“查找并总结 Sony WH-1000XM5 的第一条五星评论”，轨迹包含导航、点击、滚动、提取文本等步骤。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n本文没有复杂的理论数学推导，其核心贡献在于工程框架设计和数据合成策略。文中仅定义了基本的概率生成过程：\n\n*   **Task Synthesis:** $x \\sim p_\\theta(x | h[c])$，即从部分上下文 $h[c]$（如页面状态或探索前缀）生成任务指令 $x$。\n*   **Trajectory Synthesis:** $a_t \\sim \\pi(a | o_t, x, h_{\u003Ct})$，即在任务 $x$ 和当前观察 $o_t$ 下生成动作 $a_t$。\n\n**Intuition:** 这两个公式表明，SynWeaver 将任务和轨迹视为耦合的生成过程，而非独立生成。核心难点不在于公式本身，而在于如何通过 **Collaborative Refinement** 机制，在生成过程中动态调整 $x$ 和 $h$，使得 $p(x|h)$ 和 $\\pi(a|x, h)$ 保持一致，从而避免传统方法中任务与轨迹脱节的问题。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有的 Web Agent 数据合成方法（如随机游走、基于教程的方法）存在两个主要缺陷：一是缺乏网站特定的先验知识，导致生成的任务容易幻觉或不可执行；二是任务与轨迹的优化是解耦的，导致数据效率低且语义不一致。\n\n**2. 设计了什么实验验证这个问题？**\n*   **主实验（Main Results）：** 在 **WebArena**（In-domain）和 **WebVoyager**（Out-of-domain）基准上，对比 SynWeaver 与 SOTA 基线（NNetNav, OS-Genesis, SynthAgent）。使用相同的模型 backbone（Qwen3-VL-8B, InternVL3-8B）和训练设置，仅改变合成数据。\n*   **消融实验（Ablation Study）：** 移除关键组件以验证其贡献：\n    *   `-Map`: 用随机游走替代结构化网站地图。\n    *   `-CR`: 用解耦优化替代协同优化（Collaborative Refinement）。\n    *   `-WP`: 用通用模型替代网站先验模型。\n    *   `-PV`: 移除后验证（Post-Verification）。\n*   **多样性与质量分析：** 使用 **NovelSum** 指标评估任务多样性；通过 UI 知识测试评估先验学习的效果；通过对比协同优化与解耦优化的保留率（Retention）和成本，评估数据效率。\n\n**3. 问题的答案是什么？**\n*   **性能提升：** SynWeaver 在 WebArena 上取得了最高的整体成功率（Qwen3-VL-8B 上达到 19.91%，优于 SynthAgent 的 16.81%），在 WebVoyager 上也显著优于基线（27.06% vs 22.42%）。\n*   **组件有效性：** 消融实验证明，结构化地图（+4.42% SR）、协同优化（+4.87% SR）和网站先验（+2.21% SR）都对性能有显著贡献。\n*   **数据效率与多样性：** SynWeaver 仅使用 822 条验证后的轨迹（少于基线的 1000 条），就实现了更好的性能，证明了数据质量优于数量。同时，其生成的任务在 NovelSum 指标上最高，表明任务多样性更好。\n*   **成本效益：** 协同优化提高了轨迹保留率（99.52% vs 90.59%），降低了合成成本（$0.085 vs $0.091），证明了其经济效率。\n\n**结论：** SynWeaver 通过引入网站先验和任务-轨迹协同合成，有效解决了 Web Agent 数据合成中的幻觉和效率问题，实现了更高质量、更高多样性和更高效率的监督数据生成，从而提升了 Agent 的泛化能力。", "additional_insights": "### § 8 Take-aways\n\nSynWeaver 的核心创新在于将网站结构探索（Website Map Construction）与任务-轨迹合成（Task-Trajectory Co-Synthesis）解耦并协同，通过构建覆盖功能状态空间的 Website Map 来提供显式的 Website Prior，从而解决现有探索方法因缺乏全局知识导致的任务幻觉和覆盖不全问题。该方法利用深度优先搜索（DFS）构建包含功能独立状态和可执行转换的图结构，并从中提取页面级（Page-level）和转换级（Transition-level）的监督信号，用于微调 UI-aware 模型，使其具备基于网站特定先验的任务生成能力。在合成阶段，SynWeaver 采用协作式任务-轨迹联合优化（Collaborative Refinement），当检测到意图与执行不一致时，同时修正任务描述和执行前缀，避免了传统解耦方法中任务被强行适配轨迹而导致的指令僵化或数据浪费。实验表明，仅使用 822 对经过验证的高质量任务-轨迹数据，SynWeaver 在 WebArena 和 WebVoyager 基准上均显著优于 SynthAgent 等强基线，证明了结构化先验和联合优化在提升数据效率和泛化性能方面的有效性。\n\n### § 9 最脆弱的假设\n\nSynWeaver 最脆弱的假设是：**目标网站的交互状态空间可以通过自动化的 DFS 爬虫被完整且准确地建模为有限的、功能独立的状态图（Website Map），且该图足以覆盖下游任务所需的关键交互路径。** 如果这一假设不成立，例如网站包含大量动态生成的内容、复杂的反爬虫机制（如 CAPTCHA、动态 Token 验证）、或状态空间无限大（如无限滚动、个性化推荐流），DFS 探索将陷入死循环、被阻断或产生大量冗余噪声，导致构建的 Website Map 失真或覆盖严重不足。一旦 Map 失真，基于此生成的 UI Prior 将包含错误信息，进而导致任务生成模型产生幻觉或无法生成可执行任务，整个框架的“先验引导”优势将彻底失效。论文在 Limitations 部分承认了强反爬虫机制和动态认证管道会降低可靠性，但在实验部分主要依赖 WebArena 这种受控、自托管的环境，缺乏在真实、高动态、强防护商业网站（如大型电商或社交媒体）上的大规模鲁棒性验证，因此该假设在开放互联网环境下的普适性证据尚显薄弱。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 **Website Map 构建对任务多样性和质量的影响** 这一核心 claim，无需复现完整的合成和微调流程。具体方案如下：\n1.  **数据**：选取 WebArena 中的一个简单网站（如 Shopping 或 Reddit），使用论文提供的 DFS 爬虫代码（或简化版）构建 Website Map，同时使用随机游走（Random Walk）策略生成同等数量的交互轨迹作为基线。\n2.  **实现**：从两种探索策略生成的状态/转换中，分别采样 100 个转换三元组（State, Action, Next State）。使用一个强大的 LLM（如 GPT-4o 或 Gemini-Pro）作为 Teacher，针对每个三元组生成一个高层任务描述（High-Level Task）。\n3.  **测量**：\n    *   **多样性**：计算两组生成任务的语义嵌入余弦距离分布，或使用 NovelSum 指标衡量集合新颖性。\n    *   **可执行性/合理性**：人工或通过 LLM 评估生成任务是否在当前网站功能范围内（非幻觉），以及任务描述是否自然（非步骤堆砌）。\n4.  **结果判定**：如果 DFS 构建的 Map 生成的任务在多样性指标上显著高于随机游走，且幻觉率显著更低，则支持了“结构化探索优于随机探索”的核心论点；反之，若两者差异不大或 DFS 因陷入局部循环导致多样性更低，则反驳了该假设的有效性。此实验隔离了“探索策略”这一变量，直接验证了 SynWeaver 第一阶段的核心贡献。", "research_value": "### § 11 最强反例设计\n\n若要挑战 SynWeaver 的有效性，最有力的攻击并非针对其算法逻辑，而是针对其核心假设——即“静态的 Website Map 足以表征动态 Web 应用的功能空间”。我会设计一个基于 **State Explosion 与 Semantic Drift** 的反例实验，具体场景为 **高度动态的 SaaS 平台（如 Jira 或 Salesforce）** 或 **个性化推荐驱动的电商首页**。\n\n**实验设计：**\n1.  **场景选择**：选取一个具有复杂权限系统（RBAC）和动态内容加载（Infinite Scroll / AJAX）的网站。例如，一个项目管理工具，其中“新建任务”按钮的可见性取决于用户角色，且任务列表根据筛选条件动态渲染。\n2.  **Map 构建对比**：使用 SynWeaver 的 DFS 爬虫构建 Website Map。由于 DFS 是确定性的，它只能捕获特定用户角色下的特定状态路径。\n3.  **攻击点 1：状态空间覆盖不足（Coverage Gap）**。引入一个“未见过的用户角色”或“动态筛选组合”。由于 Map 是在特定 Seed URL 和默认状态下构建的，它无法包含所有可能的 UI 状态。当 Agent 尝试执行一个需要特定权限或特定筛选状态的任务时，$M_{ui}$ 缺乏对应的 UI Prior，导致生成的任务描述基于错误的 UI 假设（例如，假设“删除”按钮始终存在，但实际上因权限不足而隐藏）。\n4.  **攻击点 2：协同优化的“幻觉固化”（Hallucination Solidification）**。在 Collaborative Refinement 阶段，当 Agent 遇到因 Map 缺失导致的执行失败时，Joint Mode 会同时修改任务和轨迹。由于缺乏正确的 UI Prior，Teacher Model 可能会“合理化”失败，将任务修改为一个在当前错误状态下可执行的、但语义上完全偏离用户意图的任务（例如，将“删除项目”修改为“查看项目详情”，因为删除按钮不可见）。\n5.  **结果判定**：如果 SynWeaver 生成的数据在“未见过的状态组合”上表现出极高的 **Semantic Drift**（任务描述与原始用户意图的语义距离过大），且这种漂移是由于 Map 的静态性导致的，那么这就证明了 SynWeaver 的“高质量数据”实际上是“过拟合于探索路径的数据”，而非真正泛化的监督信号。这将直接反驳其“提升泛化能力”的核心主张，表明其在开放、动态 Web 环境下的鲁棒性远低于在受控基准（如 WebArena）上的表现。\n\n### § 12 Follow-up Research Idea\n\n基于 SynWeaver 依赖静态 Website Map 的局限，我提出一个新的研究方向：**Dynamic State-Aware Task Synthesis via Causal UI Reasoning（基于因果 UI 推理的动态状态感知任务合成）**。\n\n**（a）驱动局限与未满足需求：**\nSynWeaver 的核心缺陷在于将 Web 界面视为静态的图结构，忽略了 UI 状态之间的 **Causal Dependencies**（因果依赖关系）。在真实世界中，UI 元素的出现、消失或可用性往往由深层的业务逻辑（如用户登录状态、购物车内容、时间戳）决定，而非简单的页面跳转。现有的方法无法区分“因为路径未探索到”和“因为条件不满足”导致的 UI 差异，导致合成的任务缺乏对动态上下文的敏感性。我们需要一种能够理解 UI 状态变化背后因果机制的合成方法，而不仅仅是记忆状态转换。\n\n**（b）借鉴相邻领域的方法：**\n借鉴 **Causal Inference in Reinforcement Learning** 和 **Program Synthesis** 的思想。具体而言，引入 **Structural Causal Models (SCMs)** 来建模 UI 状态与底层应用状态（Application State）之间的因果关系。同时，借鉴 **Formal Verification** 中的 **Model Checking** 技术，将 UI 状态视为系统状态，验证任务执行路径在给定约束下的可行性。\n\n**（c）第一个实验设计：**\n1.  **构建 Causal UI Graph**：不同于 SynWeaver 的静态 Map，我们构建一个 **Causal UI Graph**，其中节点不仅是页面截图，还包括提取的 **Application State Variables**（如 `user_role`, `cart_items`, `filter_active`）。边不仅表示动作，还标注了动作对状态变量的因果影响（例如，`click(\"add_to_cart\")` 导致 `cart_items += 1`）。\n2.  **Counterfactual Task Generation**：利用 SCM 生成 **Counterfactual Tasks**（反事实任务）。例如，生成任务：“如果用户是管理员，如何删除该任务？” 和 “如果用户是普通成员，如何请求删除该任务？”。这要求模型理解权限状态对 UI 可用性的因果影响。\n3.  **验证指标**：在动态 SaaS 平台上，评估合成任务在 **State Perturbation**（状态扰动，如随机改变用户角色或筛选条件）下的执行成功率。对比 SynWeaver，预期新方法在状态扰动下的性能下降幅度显著更小，证明其生成的任务具有更强的 **Causal Robustness**（因果鲁棒性），而非仅仅依赖于特定的探索路径。\n\n这一方向将 Web Agent 数据合成从“路径记忆”提升到“因果理解”，为解决动态、个性化 Web 环境下的泛化问题提供新的理论框架。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Ruitao Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yuwen Hao\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Menglin Yang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Hong Kong University of Science and Technology (Guangzhou)\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding author.\"\n    }\n  ]\n}\n```", "summary_translation": "Web agents 往往难以泛化到未见过的网站，因为它们缺乏针对特定网站的监督。近期的基于探索的数据合成方法减少了人工标注的需求，但仍面临两个关键局限：它们通常无法覆盖网站的完整功能，且在缺乏足够的网站先验知识时，倾向于提出幻觉任务，这反过来限制了下游轨迹合成的多样性和效率。我们提出了 **SynWeaver**，这是一个网站先验任务-轨迹协同合成框架，旨在解决这些挑战。SynWeaver 首先执行结构化的网站探索，并构建一个网站地图，该地图覆盖了目标网站上广泛的功能性不同页面状态和可执行交互。然后，它从该地图中推导出页面级和转换级的监督信号，以训练一个具有网站特定先验的 UI-aware 模型，从而实现更可靠的任务提议。最后，SynWeaver 执行协同的任务-轨迹合成，当任务与执行轨迹不一致时联合更新二者，并对收集到的结果进行验证和修复，以生成可执行且语义对齐的监督数据。在 WebArena 和 WebVoyager 上的实验表明，SynWeaver 始终优于强大的合成基线方法，并为域内和域外泛化提供了更有效的监督。"}]}, {"name": "Benchmarks \u0026 Credit Assignment", "count": 2, "papers": [{"title": "DiG-bench: Discovery in Games", "arxiv_id": "2608.12593", "authors": "Ruairidh M. Battleday, Kai Sandbrink, Jimi Cullen-Drohan, Zihan Yan, Timothy Muller, Clare Maguire, Ales Kubicek, Fraser Greenlee-Scott, Sukrit Sumant, Tri Dao, Jürgen Schmidhuber, Michal Valko, Joshua Tenenbaum, Thomas L. Griffiths, Zeb Kurth-Nelson, James C. R. Whittington", "summary": "Discovery---formulating novel generalizations---is a central part of the scientific process. Despite its importance, there is a gap in the current AI benchmark landscape, with few benchmarks directly probing the capacity for discovering new knowledge with experimentation in controlled environments where the objective is unknown. To address this gap, we release a new benchmark: DiG-bench (Discovery in Games). DiG-bench consists of a set of 70 independent games. Each game is encoded as a short string and has unique transformation rules that must be discovered through interaction and experimentation. The levels of the game present a series of challenges to test whether the rules have been discovered, where the win conditions for each level are also unknown. We provide games at seven tiers of difficulty for AI agents. The lowest tier is routinely solvable by multiple models, while the highest tier challenges the best models in agentic harnesses. All 70 games were solved by at least one human on first attempt. A subset of 21 games is released publicly, and the remainder is held private for secure evaluation.", "category": "cs.LG", "cluster": "Benchmarks \u0026 Credit Assignment", "tags": ["cs.LG"], "filter_reason": "该论文符合筛选标准，主要依据如下：\n\n1.  核心研究对象明确为 LLM Agents：摘要中明确指出该基准用于测试“AI agents”的能力，并特别提到最高难度层级挑战的是“best models in agentic harnesses”（处于智能体框架中的最佳模型）。这表明论文的研究对象不是单纯的LLM推理能力，而是具备交互、实验和长期决策能力的智能体。\n2.  涉及智能体的核心能力（探索与发现）：论文提出的“Discovery in Games”任务要求智能体在目标未知的情况下，通过“interaction and experimentation”（交互与实验）来发现规则。这直接对应了智能体研究中的探索（Exploration）、工具使用/环境交互以及长期决策（Long-Horizon Decision-Making）能力。\n3.  属于评估基准类保留项：根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准... 只要结论直接帮助理解或改进智能体能力，也应保留”。DiG-bench 旨在填补当前AI基准在“通过实验发现新知识”这一能力上的空白，直接服务于评估和改进智能体的自主发现能力，因此属于强相关的评估基准论文。\n4.  非排除项：虽然涉及游戏，但其核心不是游戏引擎开发或简单的游戏AI策略，而是评估智能体在未知环境下的科学发现能力；也不涉及多智能体拓扑、安全对齐或纯基础设施优化。\n\n综上，该论文通过构建新的基准来评估LLM智能体的自主发现和实验能力，符合“评估 LLM智能体”的研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：如何构建一个受控的基准测试（benchmark），以隔离并精确评估人工智能系统通过主动实验（active experimentation）发现新知识（discovery）的能力，特别是当环境规则和目标均未知时。这一问题的提出基于对“发现”的严格定义，即发现不仅仅是模式识别，而是通过交互找出先前未解释的规律，并利用这些规律压缩观测数据、推理新状态。\n\n该问题的重要性在于，尽管发现新知识是科学进步的核心驱动力，且当前AI在结构生物学、化学和数学等领域的应用潜力巨大，但现有的AI基准测试存在显著缺口。目前的评测体系要么混淆了视觉感知与抽象推理，要么仅测试被动的规则归纳（rule induction）而缺乏主动实验环节，要么将发现过程与先验科学知识或特定领域知识纠缠在一起。因此，缺乏一个能够纯粹衡量“主动发现”能力的针对性基准。解决这一问题具有多重价值：首先，它能为评估AI在科学发现中的真实潜力提供标准化的度量工具，有助于加速从AI研究到实际科学应用的转化；其次，通过揭示当前前沿模型（frontier models）在发现能力上的瓶颈，可以指导模型架构和训练方法的改进；最后，由于自主递归自我改进（autonomous recursive self-improvement）依赖于这种发现能力，对其进行严格评估也是确保AI安全、防止潜在滥用风险的关键环节。\n\n### § 2 前人工作与不足\n\n在DiG-bench之前，已有多种基准测试试图评估AI的推理或发现能力，但它们均存在不同程度的局限性，无法单独或共同构成对“主动发现”能力的完整评估。\n\n首先，以ARC-AGI-3 [1]为代表的基准测试虽然要求代理在无指令环境下探索并发现规则，但其环境基于二维网格的视觉表示，这引入了视觉感知（visual perception）和空间推理（spatial reasoning）作为混淆变量（confounds）。这意味着模型的性能差异可能源于视觉处理能力的强弱，而非纯粹的抽象发现能力。此外，ARC-AGI-3更侧重于步骤效率（step efficiency），而非发现过程本身的深度。其他如BALROG [20]和AI GameStore [26]等基准也涉及游戏机制的推导，但同样包含视觉感知、长期规划或导航等额外挑战，使得难以将性能差异归因于单一因素。\n\n其次，ARC-AGI-1/2 [6, 8]、Bongard-LOGO [19]和IOLBench [14]等基准主要测试从固定演示中归纳规则（rule induction from fixed demonstrations）。这类任务虽然能清晰隔离规则抽象能力，但完全缺乏“主动选择下一步尝试什么”（choosing what to try next）的能力评估。代理只需被动观察输入-输出对，无需进行假设生成或实验设计，因此无法衡量主动实验在发现过程中的作用。\n\n最后，DiscoveryWorld [15]、ScienceWorld [22]和SciGym [9]等基准将发现置于科学实验的语境中，要求代理设计实验或模拟生物系统。然而，这些环境往往依赖于先验的科学知识（prior scientific knowledge）或提供“发现菜单”（menu of discoveries），使得代理可以利用训练数据中的领域知识而非纯粹的通用发现机制来解决问题。例如，DiscoveryWorld基于小学科学课程，SciGym模拟生物系统，这些都引入了领域特定的先验，使得评估结果难以泛化到完全未知的抽象系统。\n\n综上所述，现有工作要么因视觉混淆而无法隔离抽象发现，要么因缺乏主动实验环节而无法评估探索策略，要么因依赖领域先验而无法测试通用发现能力。DiG-bench通过纯文本、无先验、需主动实验且规则隐藏的游戏环境，填补了这一空白，旨在精确映射AI在孤立条件下的发现能力表面。", "core_insight": "### § 3 重建作者的思考路径\n\n在评估大型语言模型（LLM）的推理与发现能力时，现有的基准测试存在明显的局限性。以 ARC-AGI 系列为例，虽然其旨在测试抽象推理，但严重依赖视觉感知和空间网格操作，这引入了视觉混淆变量（visuospatial confounds），使得难以区分模型是真正理解了规则，还是仅仅利用了视觉模式匹配。另一方面，如 Bongard-LOGO 或 IOLBench 等基准主要关注从固定演示中进行规则归纳（rule induction），缺乏主动实验（active experimentation）的环节，无法评估模型在未知环境中通过试错来探索因果机制的能力。此外，像 DiscoveryWorld 这样的环境虽然涉及实验，但往往依赖于先验的科学知识或预设的发现菜单，未能隔离出纯粹的“发现”过程。\n\n因此，研究者需要一个能够剥离感知负担、专注于纯逻辑与规则发现的基准。文本字符串（text-based strings）是 LLM 的自然领域，且能避免视觉混淆。然而，简单的文本类比任务缺乏交互性。游戏（Games）作为一种受控的交互环境，提供了完美的测试床：规则隐藏、目标未知、状态有限。通过设计一系列基于短字符串变换的游戏，研究者可以构建一个部分可观测马尔可夫决策过程（POMDP），其中核心挑战在于通过交互（interaction）和实验（experimentation）来推断隐藏的动力学规则。为了进一步促进发现，引入“创意模式”（creative mode）作为沙盒环境，允许模型在无惩罚的情况下进行假设检验。这种设计旨在直接测量模型在缺乏先验知识的情况下，通过主动探索构建内部模型并压缩观察数据的能力，从而填补当前 AI 基准在“主动发现”（active discovery）方面的空白。\n\n### § 4 核心 Intuition\n\n这篇论文的核心直觉在于，真正的科学发现能力不应被视觉感知或先验知识所混淆，而应通过纯文本交互环境中的主动实验来隔离测量。通过设计规则隐藏且目标未知的短字符串游戏，并引入无惩罚的沙盒模式（creative mode），模型必须通过试错和假设检验来推断隐藏的动力学规则，而非依赖模式匹配或记忆。这种设计使得“发现规则”本身成为唯一的瓶颈，从而能够精确评估 LLM 在未知环境中构建因果模型和进行归纳推理的内在能力。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nDiG-bench 的核心方法并非提出一种新的 AI 算法，而是构建了一个用于评估 AI **Discovery**（发现/归纳新规则）能力的基准测试平台。其 Pipeline 是一个基于文本的交互式循环，旨在隔离视觉感知干扰，纯粹测试模型在未知规则下的主动实验与推理能力。\n\n以下以论文中提到的 **Game P-21** 为例，展示完整的交互 Pipeline：\n\n1.  **初始化与输入 (Initialization \u0026 Input)**：\n    *   **环境状态**：游戏开始时，Agent 接收初始观察（Observation），通常是一个简短的 Unicode 字符串。例如在 P-21 中，初始状态可能显示为 `_____~__@v_n__~_vv____n___~__vvv___`，其中 `@` 代表玩家，`v` 代表障碍，`n` 代表道具，`~` 代表特殊地形。\n    *   **元数据**：Agent 同时接收当前关卡（Level）、剩余生命（Lives）、剩余步数（Steps Remaining）以及合法动作列表（Legal Actions，如 `[\"1\", \"2\", \"3\", \"/\"]`）。\n    *   **约束**：Agent 不知道游戏规则（如“站在 `~` 上可以三倍延长桥梁”），也不知道胜利条件（如“到达 `g`”）。\n\n2.  **推理与动作选择 (Reasoning \u0026 Action Selection)**：\n    *   **Basic Harness 模式**：LLM 基于当前的 Observation 和历史交互记录（History），在 Context Window 内进行推理。模型需要假设某个动作的效果，并选择执行。\n    *   **Agentic Harness 模式**：Agent 可能调用外部工具（如 Python 脚本或 MCP Server）来管理状态或进行更复杂的逻辑规划，但最终仍需通过 API 提交单个字符动作。\n    *   **示例动作**：在 P-21 的 Level 3 中，Agent 发现普通桥梁无法跨越 `vvv`（三重障碍）。它选择动作 `/` 进入 **Creative Mode**（创意模式/沙盒模式）。\n\n3.  **环境反馈与状态转移 (Environment Feedback \u0026 State Transition)**：\n    *   **执行动作**：Agent 提交动作 `/`。\n    *   **状态更新**：游戏引擎根据隐藏规则更新状态。在 Creative Mode 中，步数限制放宽，允许 Agent 进行低成本试错。\n    *   **新观察**：Agent 收到新的 Observation。例如，Agent 尝试站在 `~` 上并激活 `n`，观察到生成的桥梁长度变为原来的三倍。\n\n4.  **假设验证与迭代 (Hypothesis Testing \u0026 Iteration)**：\n    *   **归纳规则**：Agent 通过多次在 Creative Mode 中的实验，归纳出规则：“站在 `~` 上 + 激活 `n` = 三倍长度桥梁”。\n    *   **应用规则**：Agent 退出 Creative Mode（再次输入 `/`），回到 Survival Mode。它携带 `~` 移动到障碍前，站在 `~` 上激活 `n`，成功跨越 `vvv` 到达目标 `g`。\n    *   **胜利判定**：如果 Agent 在步数耗尽前到达目标状态，Level 通关；否则失去一条生命或重置关卡。\n\n5.  **输出与评估 (Output \u0026 Evaluation)**：\n    *   **最终输出**：Agent 完成所有 Level 或耗尽所有生命。\n    *   **评估指标**：主要指标是 **Games Won**（获胜游戏比例）。DiG-bench 不惩罚探索过程中的低效步数（只要不超过上限），以鼓励真正的 Discovery 而非单纯的 Step Efficiency。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过**。\n\n本文是一篇基准测试（Benchmark）论文，而非提出新算法或理论模型的论文。因此，文中没有核心的数学推导过程。其理论基础建立在 **Partially Observable Markov Decision Process (POMDP)** 框架之上，即 Agent 在部分可观察的环境中，通过动作序列最大化累积奖励（此处为通关）。论文的重点在于实验设计、规则归纳的难度分级以及模型性能的实证分析，而非数学证明。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n当前的 AI 基准测试（如 ARC-AGI, Bongard-LOGO）要么混淆了视觉感知与逻辑推理，要么缺乏主动实验（Active Experimentation）环节，无法准确衡量 AI 在未知环境中通过试错发现新规律（Discovery）的能力。现有的 Agentic Harness（智能体框架）是否真的能提升这种发现能力？\n\n**2. 设计了什么实验验证这个问题？**\n*   **构建 DiG-bench**：设计了 70 个纯文本、规则隐藏、目标未知的游戏，分为 7 个难度层级（Tier 1-7）。引入 **Creative Mode** 允许 Agent 进行无惩罚的沙盒实验。\n*   **对比实验组**：\n    *   **模型对比**：测试了 Gemini 3.1 Pro, Opus 5, GPT-5.5, DeepSeek V4 等前沿模型。\n    *   **Harness 对比**：对比 **Basic Harness**（原生 LLM 推理）与 **Agentic Harness**（如 Claude Code, Prime Agent, Codex）在最高难度层级（Tier 6-7）的表现。\n    *   **人类基线**：邀请人类玩家首次尝试所有游戏，确立人类可解性基线。\n    *   **规则已知对照**：给 Gemini 3.1 Pro 提供游戏的自然语言规则描述，测试“已知规则”对性能的提升幅度，以验证瓶颈是否在于“发现规则”。\n    *   **跨基准对比**：将 5 个 ARC-AGI-3 游戏转化为文本格式，测试模型在去除视觉干扰后的表现。\n\n**3. 问题的答案是什么？**\n*   **Discovery 是主要瓶颈**：当给模型提供规则时，Gemini 3.1 Pro 的胜率从 26% (18/70) 飙升至 99% (69/70)，且几乎不再使用 Creative Mode。这证明当前模型的主要困难在于**发现规则**，而非规划或执行。\n*   **Agentic Harness 未带来显著提升**：在最高难度层级，使用复杂的 Agentic Harness（如 Prime Agent, Claude Code）并未比 Basic Harness 取得更好的成绩。这表明现有的工具链和框架并未有效增强模型的 Discovery 能力。\n*   **人类与模型效率相当**：在已通关的关卡中，人类和 Gemini 3.1 Pro 的平均步数无显著差异（人类 49±78 步 vs Gemini 46±63 步），说明模型在发现规则后，执行效率已接近人类。\n*   **视觉并非核心障碍**：在去除视觉干扰的文本版 ARC 游戏中，Gemini 的表现优于或等于人类，暗示原 ARC 基准的部分难度来源于视觉感知而非抽象推理。\n*   **结论**：DiG-bench 成功隔离了 Discovery 能力，揭示了当前前沿 LLM 在主动实验和规则归纳方面仍存在巨大差距，且现有的 Agentic 框架尚未解决这一根本问题。", "additional_insights": "### § 8 Take-aways\n\nDiG-bench 通过剥离视觉感知和空间推理等混淆变量，构建了一个纯文本交互的 **POMDP** 环境，旨在孤立评估 AI 模型在未知目标下的主动 **discovery** 能力。基准测试包含 70 个由人类专家手工设计的游戏，分为 7 个难度层级，所有游戏均被证实人类可在首次尝试中解决，从而确立了任务的可行性上限。实验结果显示，当前最先进的大语言模型（如 Opus 5）在 **basic harness** 下仅能解决约 71% 的游戏，且在最高难度层级表现显著下降，表明现有模型在复杂规则归纳上仍存在瓶颈。引入 **agentic harness**（如 Prime Agent, Claude Code）并未带来性能提升，暗示当前的工具调用和代码执行框架并未增强模型的核心发现能力。关键证据在于，当向 Gemini 3.1 Pro 提供自然语言描述的 **ground-truth rules** 时，其胜率从 26% 飙升至 99%，这强有力地证明了模型的主要障碍在于 **rule induction** 而非规划或执行。此外，模型在 **creative mode** 中的探索行为与规则获取高度相关，且一旦知晓规则，探索需求几乎消失，进一步验证了该基准对 **active experimentation** 能力的针对性测量。\n\n### § 9 最脆弱的假设\n\n该研究最核心的假设是：纯文本字符串表示的游戏环境能够完全剥离 **visuospatial confounds**，从而纯粹地测量 **discovery** 能力，且这种能力具有向更广泛科学发现场景迁移的有效性。如果这一假设不成立，即文本表示本身引入了新的认知偏差（例如对特定符号模式的过度拟合）或无法涵盖真实科学发现中必要的多维状态空间推理，那么 DiG-bench 的评估结果将失去其作为通用 **discovery** 基准的代表性。论文通过对比 ARC-AGI-3 的视觉版本与文本移植版本来支持这一假设，发现模型在文本版本中表现更好且人类优势消失，以此论证视觉感知是 ARC 的主要难点而非发现能力。然而，这一证据存在缺陷：它仅证明了移除视觉降低了难度，并未证明文本环境足以模拟真实科学发现中复杂的、非线性的、多变量耦合的系统动力学。如果真实世界的 **scientific discovery** 严重依赖于对高维连续状态空间的直觉或几何理解，而不仅仅是离散符号的逻辑归纳，那么 DiG-bench 的高分可能仅反映模型在符号逻辑上的插值能力，而非真正的泛化发现能力，导致其核心贡献——即作为 AI 科学发现能力的代理指标——失效。\n\n### § 10 最小复现实验\n\n在 1 周内，可以利用 DiG-bench 公开的 21 个游戏（P-1 至 P-21）和提供的 API，复现并验证“**agentic harness** 无法提升发现能力”这一关键 claim。具体步骤如下：首先，选择两个具有代表性的模型（如 Gemini 3.1 Pro 和 Claude Opus 5），分别在 **basic harness** 和 **agentic harness**（如使用简单的 Python 脚本作为 agent 框架，而非复杂的商业产品）下运行这 21 个游戏。其次，测量并记录每个模型在每个层级下的胜率、平均步数以及进入 **creative mode** 的频率。最后，对比两种 harness 下的性能差异。如果 **agentic harness** 下的胜率没有显著高于 **basic harness**，且模型在 agent 模式下并未表现出更有效的假设检验策略（例如更少的无效探索步数），则支持了论文关于当前 agent 框架对 **discovery** 帮助有限的结论。反之，如果精心设计的轻量级 agent 框架能显著提升胜率，则反驳了论文中关于现有 harness 无效的断言，暗示问题可能出在商业 harness 的实现细节而非架构本身。此实验无需复现整个基准系统，仅需利用公开接口和标准 LLM API 即可完成。", "research_value": "### § 11 最强反例设计\n\n若要挑战 DiG-bench 的有效性，最有力的攻击并非质疑其实验数据的准确性，而是攻击其核心假设：**纯文本符号交互足以剥离所有混淆变量，从而纯粹地测量“发现”能力。** 这一假设忽略了 LLM 的预训练分布特性，即模型对特定符号模式（如 ASCII 艺术、代码片段、数学公式）具有极强的先验归纳偏置（inductive bias）。\n\n**反例设计：符号先验污染实验（Symbolic Prior Contamination Experiment）**\n\n1.  **替代解释**：DiG-bench 中模型的高胜率并非源于通用的 **active experimentation** 和 **rule induction** 能力，而是源于模型在预训练数据中见过类似符号组合的“伪规则”。例如，`@` 代表玩家、`v` 代表障碍、`~` 代表特殊地形，这些符号在编程、游戏开发文档或 ASCII 艺术中频繁出现，模型可能通过 **pattern matching** 而非逻辑推理来猜测规则。\n2.  **具体实验**：\n    *   **构造混淆集**：设计一组新的游戏（DiG-bench-Obfuscated），其底层逻辑规则与 DiG-bench 完全同构（isomorphic），但使用完全随机、无意义的 Unicode 字符集（如 `🦄`, `🌵`, `🧊` 或生僻的 CJK 扩展字符）替换原有符号，并打乱字符在字符串中的空间布局（例如，不再使用网格状字符串，而是使用无序的 JSON 对象或随机排列的列表）。\n    *   **控制变量**：确保新游戏在逻辑复杂度、状态空间大小和规则数量上与 DiG-bench 的 Tier 6-7 游戏完全一致。\n    *   **预期结果**：如果 DiG-bench 的结论成立，模型在 DiG-bench-Obfuscated 上的表现应与原版相当，因为 **discovery** 能力应独立于符号表示。然而，如果模型性能断崖式下跌（例如从 71% 降至 \u003C10%），则证明模型严重依赖符号先验（symbolic priors），DiG-bench 测量的实际上是“对常见符号隐喻的熟悉度”，而非通用的科学发现能力。\n3.  **理论论证**：从 **Information Theory** 角度看，DiG-bench 的文本表示并未真正消除 **visuospatial confounds**，而是将其转化为 **syntactic confounds**。LLM 本质上是基于 token 的预测引擎，其对 token 序列的敏感性远高于对抽象逻辑结构的敏感性。因此，DiG-bench 可能只是测试了模型在特定符号空间内的 **interpolation** 能力，而非 **extrapolation** 或真正的 **discovery**。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从符号归纳到因果结构学习：基于干预的抽象状态空间发现（Intervention-based Abstract State Space Discovery）**\n\n**(a) 驱动局限与未满足需求**\nDiG-bench 的核心局限在于其环境是离散、低维且符号化的，这无法模拟真实科学发现中常见的**高维连续状态空间**和**非线性动力学**。真实世界的 **scientific discovery** 往往涉及对潜在变量（latent variables）的识别和对因果机制（causal mechanisms）的建模，而不仅仅是表面符号规则的归纳。当前基准无法评估 AI 在缺乏明确符号映射时，如何通过主动干预（intervention）构建环境的内部因果图（causal graph）。\n\n**(b) 借鉴相邻领域的方法**\n借鉴 **Causal Representation Learning (CRL)** 和 **Active Inference** 领域的最新进展。具体而言，引入 **Structural Causal Models (SCM)** 作为评估框架，而非简单的规则匹配。同时，借鉴 **Reinforcement Learning** 中的 **Curiosity-driven Exploration** 机制，但将其目标从最大化奖励改为最大化 **Information Gain** 关于潜在因果结构的熵减。\n\n**(c) 第一个实验设计：Causal-DiG Benchmark**\n1.  **环境构建**：创建一个基于物理引擎的连续状态环境（如 2D 刚体动力学模拟），其中隐藏的物理参数（如摩擦系数、弹性模量、引力方向）构成“规则”。Agent 接收的是高维传感器数据（如像素或点云），而非符号字符串。\n2.  **任务定义**：Agent 的目标不是通关，而是通过主动实验（如施加不同力、改变初始条件）来推断出环境的 **SCM**。评估指标不再是 **Games Won**，而是推断出的因果图与真实因果图的 **F1 Score** 或 **Shannon Mutual Information**。\n3.  **对比基线**：\n    *   **Baseline 1**：DiG-bench 中的 LLM Agent（通过 API 接入物理引擎，将传感器数据转换为文本描述）。\n    *   **Baseline 2**：基于 **Variational Autoencoder (VAE)** 的表征学习模型，结合 **Do-calculus** 进行因果发现。\n    *   **Baseline 3**：人类科学家（通过界面操作并记录假设）。\n4.  **预期发现**：该实验将揭示 LLM 在处理连续、高维、非符号化数据时的 **discovery** 瓶颈。如果 LLM 无法有效构建因果图，而基于表征学习的方法表现更好，则证明当前的 **LLM-centric** 发现范式存在根本性局限，需要向 **Hybrid Neuro-Symbolic** 或 **Causal-First** 架构演进。这将打开一个全新的研究方向：**Causal Discovery in High-Dimensional Latent Spaces**，直接关联到 AI 在材料科学、气候建模等真实科学领域的应用潜力。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Ruairidh M. Battleday\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Kai Sandbrink\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jimi Cullen-Drohan\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zihan Yan\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Timothy Muller\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Clare Maguire\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Ales Kubicek\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Fraser Greenlee-Scott\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Sukrit Sumant\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Tri Dao\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jürgen Schmidhuber\",\n      \"affiliations\": [\n        5,\n        6\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Michal Valko\",\n      \"affiliations\": [\n        7\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Joshua Tenenbaum\",\n      \"affiliations\": [\n        8\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Thomas L. Griffiths\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zeb Kurth-Nelson\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"James C.R. Whittington\",\n      \"affiliations\": [\n        1,\n        3\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Thinking About Thinking\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Independent\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"University of Oxford\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Princeton University\"\n    },\n    {\n      \"id\": 5,\n      \"name\": \"King Abdullah University of Science and Technology\"\n    },\n    {\n      \"id\": 6,\n      \"name\": \"Swiss AI Lab\"\n    },\n    {\n      \"id\": 7,\n      \"name\": \"Inria\"\n    },\n    {\n      \"id\": 8,\n      \"name\": \"Massachusetts Institute of Technology\"\n    }\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "发现——即构建新颖的泛化规律——是科学过程的核心组成部分。尽管其重要性不言而喻，但当前的 AI 基准测试领域仍存在空白，鲜有基准测试直接探究在目标未知的受控环境中通过实验发现新知识的能力。为填补这一空白，我们发布了一个新的基准测试：DiG-bench（Discovery in Games）。DiG-bench 由 70 个独立的游戏组成。每个游戏被编码为一个短字符串，并具有独特的变换规则，这些规则必须通过交互和实验来发现。游戏的关卡呈现一系列挑战，以测试规则是否已被发现，其中每个关卡的获胜条件也是未知的。我们为 AI 智能体提供了七个难度层级的游戏。最低层级可被多个模型常规解决，而最高层级则对智能体框架中的最佳模型构成挑战。所有 70 个游戏均至少被一名人类在首次尝试中解决。其中 21 个游戏作为子集公开发布，其余部分则保留为私有，用于安全评估。"}, {"title": "Teach the Magnitude, Not the Direction: Verifier-Bounded Credit Assignment for Multi-Turn Multi-step LLM Agents", "arxiv_id": "2608.13179", "authors": "Zechuan Wang, Siyuan Lu, Hongxuan Zhang, Linjian Mo, Chenyi Zhuang, Leilei Gan", "summary": "Reinforcement learning with verifiable rewards (RLVR) offers a verifier-bounded performance ceiling for training multi-turn tool-use agents, yet its trajectory-level credit assignment conflates heterogeneous per-turn outcomes into a single reward signal. On-policy distillation provides dense per-token supervision but is either teacher-bounded or prone to gradient concentration collapse. We introduce $\\textbf{CrEST}$, a hierarchical credit assignment framework that retains RL's verifier-bounded ceiling while incorporating dense token-level signals from a privileged self-teacher. $\\textbf{CrEST}$ resolves credit at two levels: turn-segmented verified advantages address inter-turn dilution, while entropy-gated self-teacher modulation refines intra-turn token contributions. Experiments on BFCL V3 and WildToolBench show that $\\textbf{CrEST}$ consistently outperforms both RL and distillation baselines across two model scales, with the largest gains on long-trajectory and strict session-level metrics. Our work demonstrates that the teacher's role in policy optimization can be reduced from determining update directions to modulating update magnitudes, unlocking dense credit assignment without sacrificing the verifier-bounded ceiling.", "category": "cs.AI", "cluster": "Benchmarks \u0026 Credit Assignment", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文针对多轮多步（multi-turn multi-step）LLM Agent训练中的**信用分配（credit assignment）**难题，提出了一个核心研究问题：如何设计一种训练方法，既能保持强化学习（RL）中由验证器决定的性能上限（verifier-bounded ceiling），又能提供细粒度的Token级信号以解决长轨迹中的信用稀释问题？\n\n这一问题的重要性源于当前Agent训练范式的根本性矛盾。随着LLM从单轮问答向自主Agent演进，任务结构变为包含多个独立回合（turns）的会话，每个回合又包含多步执行。现有的主流范式存在两极分化且均存在缺陷：\n1.  **基于验证奖励的强化学习（RLVR）**：虽然其性能上限仅取决于奖励质量（verifier-bounded），不受教师模型能力限制，但其标准的轨迹级（trajectory-level）奖励信号会将不同回合的异质结果（成功或失败）混合。在多轮会话中，这导致严重的**跨回合信用稀释（inter-turn dilution）**，即失败回合的Token被错误地强化，导致WildToolBench等基准上的Session Accuracy极低（\u003C15%）。\n2.  **On-policy Distillation (OPD/OPSD)**：虽然提供了密集的Token级监督，解决了细粒度信用分配问题，但其性能上限受限于教师模型（teacher-bounded）。特别是On-policy Self-Distillation (OPSD)，由于缺乏对梯度集中的控制，极易在训练初期发生**梯度集中崩溃（gradient concentration collapse）**，且学生模型无法超越教师模型的分布。\n\n解决这一问题的价值在于打破了“性能上限”与“训练信号密度”之间的权衡。通过提出CREST框架，本文证明了可以将教师模型的角色从“决定更新方向”降级为“调制更新幅度（magnitude）”。这不仅保留了RL的verifier-bounded优势，允许模型超越教师能力，还通过熵门控（entropy-gated）机制解决了OPSD的不稳定性，从而在长轨迹和严格的多轮指标上实现了显著的性能提升。\n\n### § 2 前人工作与不足\n\n该问题此前并未被完全解决，现有的相关工作主要分布在RL改进和蒸馏方法两个领域，但均存在关键不足：\n\n1.  **RL-based Methods (GRPO, MT-GRPO, EnvTuning)**：\n    *   **GRPO**：使用单一的轨迹级奖励，无法区分多轮中不同回合的贡献，导致信用分配病态（ill-posed）。\n    *   **MT-GRPO**：虽然尝试在Agent步（step）级别计算优势，但仍缺乏**步内Token级（intra-step token-level）**的信用分配，将每个步内的所有Token视为同等重要，无法区分高价值的决策Token和低熵的格式Token。\n    *   **EnvTuning**：尽管引入了细粒度的过程奖励，但最终仍聚合为单一的轨迹级优势，未能解决跨回合的信用稀释问题。\n    *   **不足根源**：这些方法本质上仍依赖于稀疏或粗粒度的奖励信号，无法在保持verifier-bounded的同时提供足够的梯度分辨率。\n\n2.  **Distillation-based Methods (OPD, OPSD)**：\n    *   **OPD**：需要同家族、Tokenizer匹配的外部教师模型，这在实践中约束极强，且性能受限于教师（teacher-bounded）。\n    *   **OPSD**：使用学生自身作为教师（基于特权信息如Ground Truth），消除了外部依赖。然而，现有研究（如Zhao et al., 2026; Brown, 2026）指出，OPSD在没有每Token KL裁剪的情况下会在约100步内崩溃，因为梯度集中在少数低熵格式Token上。即使稳定下来，其性能天花板仍由教师分布决定，学生无法超越教师。\n    *   **Hybrid Methods (SDAR, RLSD)**：尝试结合RL的方向和蒸馏的密度信号，但缺乏对梯度集中的原则性控制，或未针对多轮特有的跨回合结构进行设计。\n    *   **不足根源**：蒸馏方法将教师信号直接作为优势（Advantage）或主要优化目标，导致**方向（direction）**由教师决定，从而引入了teacher-bounded限制。此外，缺乏对Token不确定性（entropy）的门控机制，导致梯度分布不均。\n\n**为什么X（即CREST提出的分层信用分配）之前没有被考虑？**\n之前的工作未能清晰地将信用分配问题分解为**跨回合（inter-turn）**和**回合内（intra-turn）**两个互补层级。RL方法忽略了回合内的Token差异，而蒸馏方法忽略了跨回合的奖励隔离，并错误地将教师信号用于确定梯度方向。CREST的创新在于形式化了这一分层结构，并证明了只需让教师信号调制幅度（magnitude）而非方向（direction），即可同时获得verifier-bounded的上限和密集的Token级监督，这一设计空间在之前的文献中未被探索。", "core_insight": "### § 3 重建作者的思考路径\n\n在研究多轮多步（Multi-turn Multi-step）LLM Agent的训练时，我们首先观察到现有的两种主流范式存在明显的局限性。一方面，基于强化学习的方法（如RLVR、GRPO）虽然拥有由Verifier决定的性能上限（Verifier-bounded ceiling），但其信用分配（Credit Assignment）是轨迹级别（Trajectory-level）的。在多轮会话中，不同Turn的结果是异构的（有的成功，有的失败），但标准RL会将整个轨迹的奖励广播给所有Token，导致失败Turn中的Token被错误地正向强化，或者成功Turn中的关键决策被稀释。另一方面，基于蒸馏的方法（如OPD、OPSD）提供了密集的Token级别监督，解决了细粒度的信用分配问题，但它们受限于教师模型的性能上限（Teacher-bounded ceiling），且OPSD容易因为梯度集中在低熵的格式Token上而导致训练崩溃（Gradient Concentration Collapse）。\n\n这就引出了一个核心矛盾：我们既想要RL的Verifier-bounded性能上限（即不依赖外部强教师，且能超越当前策略），又想要蒸馏方法的密集Token级别信号来解决多轮场景下的信用分配难题。现有的混合方法（如SDAR、RLSD）要么缺乏对梯度集中的原则性控制，要么没有解决多轮特有的跨Turn信用稀释问题。\n\n进一步分析发现，蒸馏方法失效的根本原因在于教师信号同时决定了梯度的方向（Direction）和大小（Magnitude）。如果教师信号主导了方向，模型就会收敛到教师的分布，从而被Teacher-bounded。然而，如果我们只利用教师信号来调节梯度的大小（Magnitude），而让梯度的方向完全由Verifier奖励决定，是否就能打破这个天花板？同时，为了防止梯度集中在无意义的格式Token上，我们需要一种机制来识别哪些Token是真正具有信息量的（即高不确定性/高Surprisal的内容Token）。\n\n基于此，我们设想了一个分层（Hierarchical）的信用分配框架：在粗粒度上，通过Turn-segmented的Verifier奖励来解决跨Turn的信用稀释，确保每个Turn的梯度方向正确；在细粒度上，利用Self-Teacher的信号，但仅作为幅度调制因子（Magnitude Modulator），并通过熵门控（Entropy Gate）来抑制格式Token、放大内容Token的梯度贡献。这样，Verifier决定了“往哪走”（Direction），而Teacher只决定“走多快”（Magnitude），从而在保持Verifier-bounded上限的同时，实现了密集的信用分配。\n\n### § 4 核心 Intuition\n\n这篇论文的核心直觉在于将强化学习中的梯度更新解耦为“方向”和“幅度”两个独立维度，并分别由不同的信号源控制。传统的蒸馏方法之所以受限于教师性能上限，是因为教师信号同时决定了更新的方向和大小，导致学生模型无法超越教师；而传统的强化学习虽然方向正确（由Verifier决定），但缺乏细粒度的幅度调节，导致在多轮多步场景中信用分配模糊。CREST通过让Verifier独占梯度方向（确保性能上限由环境反馈决定，而非教师），仅利用Self-Teacher信号在熵门控的约束下调节梯度幅度（聚焦于高不确定性的关键内容Token），从而在不牺牲Verifier-bounded性能上限的前提下，实现了高效且稳定的密集信用分配。简而言之，就是“让Verifier教方向，让Teacher教幅度”，既避免了Teacher-bounded的天花板，又解决了RL中信用稀释和梯度集中的问题。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法是 **CREST** (Hierarchical **Cr**edit Assignment via **E**ntropy-Gated **S**elf-**T**eacher)，一种用于多轮多步 LLM Agent 训练的层次化信用分配框架。其核心思想是将传统的轨迹级奖励分解为两个层级的信号：**Turn-Level**（轮次级）解决跨轮次的奖励稀释问题，**Token-Level**（Token级）解决轮次内关键决策与格式噪声的混淆问题。\n\n**完整 Pipeline 示例：**\n\n假设一个 Agent 需要执行一个包含两个 Turn 的任务：\n*   **Turn 1**: 查询航班信息（成功）。\n*   **Turn 2**: 预订酒店（失败，因为参数错误）。\n\n**1. 输入与 Rollout 生成 (Input \u0026 Rollout)**\n*   **输入**: 用户的多轮对话历史 $x$。\n*   **处理**: 策略模型 $\\pi_\\theta$ 采样生成 $G$ 组 Rollout（例如 $G=16$）。每个 Rollout 包含多个 Turn 的完整交互序列。\n*   **环境反馈**: 环境 Verifier 对每个 Turn 独立打分。在示例中，Turn 1 获得正奖励 $R_1 \u003E 0$，Turn 2 获得负奖励 $R_2 \u003C 0$。\n\n**2. Inter-turn Credit Assignment (轮次级信用分配)**\n*   **目标**: 确定每个 Turn 的整体梯度方向（正或负），避免成功 Turn 的奖励被失败 Turn 稀释。\n*   **计算**: 对于每个 Turn $k$，计算组内相对优势 $A^{[turn]}_k$。\n    *   公式：$A^{[turn]}_k = \\frac{R_k - \\mu_k}{\\sigma_k + \\epsilon}$，其中 $\\mu_k, \\sigma_k$ 是该 Turn 在 $G$ 组 Rollout 中的均值和标准差。\n    *   **结果**: Turn 1 的所有 Token 共享一个正的优势值 $A^{[turn]}_1 \u003E 0$；Turn 2 的所有 Token 共享一个负的优势值 $A^{[turn]}_2 \u003C 0$。这确保了失败 Turn 的 Token 会被抑制，成功 Turn 的 Token 会被增强。\n\n**3. Intra-turn Credit Assignment (Token级信用分配)**\n*   **目标**: 在同一个 Turn 内，区分“高价值决策 Token”（如函数名、关键参数）和“低价值格式 Token”（如标点、JSON 括号），防止梯度集中在格式上。\n*   **Self-Teacher 信号**: 使用同一个模型，但输入包含 Ground Truth 的上下文作为 **Privileged Self-Teacher**，计算 Teacher 与 Student 在 Token $t$ 上的分布差异 $\\Delta_t$。\n*   **Entropy Gate (熵门控)**: 计算 Student 生成 Token $t$ 的 Surprisal $u_t = -\\log \\pi_\\theta(y_t|h_t)$。\n    *   **Intuition**: 如果模型对某个 Token 很确定（低熵，如标点），说明它不需要太多学习；如果模型不确定（高熵，如关键参数选择），说明这是需要重点优化的地方。\n    *   **调制因子 $\\phi_t$**: 结合 Teacher 偏好和 Entropy Gate，计算调制因子 $\\phi_t \\in [1, 1+\\lambda\\epsilon]$。\n        *   如果 Teacher 认为该 Token 好，且 Student 不确定（高熵），$\\phi_t$ 会放大梯度。\n        *   如果 Student 很确定（低熵，格式 Token），$\\phi_t$ 接近 1，不放大梯度。\n        *   **Direction Gate**: 如果 Teacher 的判断与 Verifier 的奖励方向相反，直接屏蔽 Teacher 信号（$\\phi_t=1$），确保梯度方向由 Verifier 决定。\n\n**4. 最终优势计算与更新 (Final Advantage \u0026 Update)**\n*   **组合**: 每个 Token $t$ 的最终优势 $A_t = A^{[turn]}_k \\times \\phi_t$。\n    *   在示例中，Turn 1 的关键参数 Token 会获得 $A^{[turn]}_1 \\times (\\text{large } \\phi_t)$，梯度极大增强。\n    *   Turn 1 的格式 Token 获得 $A^{[turn]}_1 \\times 1$，正常增强。\n    *   Turn 2 的所有 Token 获得 $A^{[turn]}_2 \\times \\phi_t$，由于 $A^{[turn]}_2 \u003C 0$，梯度为负，抑制错误行为。\n*   **输出**: 使用标准的 Policy Gradient 更新模型参数 $\\theta$。\n\n**总结**: CREST 的 Pipeline 核心在于 **Decoupling Direction and Magnitude**。Verifier 决定“往哪走”（Direction），Self-Teacher 决定“走多快”（Magnitude），且仅在高不确定性 Token 上加速。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文的核心数学推导集中在证明 CREST 方法如何保持 **Verifier-Bounded Ceiling**（验证器有界上限），即模型性能不会超过 Verifier 定义的极限，同时利用 Teacher 信号优化训练效率。主要涉及三个性质（P1, P2, P3）的证明。\n\n**理论背景与 Intuition：**\n传统 RL 中，优势函数 $A$ 直接决定梯度方向。在 Distillation 中，Teacher 的分布差异直接作为目标，可能导致模型性能受限于 Teacher（Teacher-Bounded）。CREST 将优势分解为 $A_t = A^{[turn]}_t \\cdot \\phi_t$。我们需要证明 $\\phi_t$ 只改变梯度的大小（Magnitude），不改变方向（Direction）。\n\n**核心公式与推导：**\n\n1.  **结构化优势函数 (Structured Advantage)**:\n    $$ A_t = A^{[turn]}_t \\cdot \\phi_t $$\n    其中 $A^{[turn]}_t$ 是 Turn 级优势，$\\phi_t = 1 + \\lambda_{eff}^t (w_t - 1)$ 是调制因子。\n\n2.  **性质 P1: Direction Preservation (方向保持)**\n    *   **命题**: $\\text{sign}(A_t) = \\text{sign}(A^{[turn]}_t)$。\n    *   **推导 Intuition**: 只要证明 $\\phi_t \u003E 0$ 恒成立即可。\n        *   $\\phi_t$ 的构造中，$w_t$ 是通过 $\\text{clip}(\\exp(\\dots), 1-\\epsilon, 1+\\epsilon)$ 得到的，且 $\\lambda_{eff}^t \\ge 0$。\n        *   论文证明 $\\phi_t \\in [1, 1+\\lambda\\epsilon]$，因此 $\\phi_t$ 始终为正。\n        *   **结论**: 乘法因子为正，不改变 $A^{[turn]}_t$ 的符号。这意味着梯度的上升/下降方向完全由 Verifier 奖励决定，Teacher 无法“带偏”模型去优化错误的方向。\n\n3.  **性质 P2: Absolute Perturbation Bound (绝对扰动界)**\n    *   **命题**: Teacher 引入的梯度扰动是有界的。\n    *   **推导 Intuition**: 比较 CREST 梯度 $\\nabla J_{CREST}$ 和仅使用 Turn 级优势的梯度 $\\nabla J_{Turn}$。\n        *   差值 $\\|\\nabla J_{CREST} - \\nabla J_{Turn}\\| \\le \\lambda \\epsilon \\sum_t \\|g_t\\|$，其中 $g_t$ 是基础梯度项。\n        *   **结论**: Teacher 的影响被限制在一个小范围内（由 $\\lambda$ 和 $\\epsilon$ 控制）。这保证了模型不会过度依赖 Teacher 而偏离 Verifier 定义的优化路径。\n\n4.  **性质 P3: Sign-Consistent Amplification (符号一致放大)**\n    *   **命题**: 当 Teacher 信号激活时，$\\phi_t \\ge 1$。\n    *   **推导 Intuition**:\n        *   只有当 Teacher 偏好与 Verifier 方向一致时（Direction Gate 开启），$\\lambda_{eff}^t \u003E 0$。\n        *   此时 $w_t \\ge 1$（因为 $\\Delta_t$ 与 $A^{[turn]}_t$ 同号，指数函数后截断在 $[1, 1+\\epsilon]$）。\n        *   因此 $\\phi_t = 1 + \\text{positive} \\cdot \\text{positive} \\ge 1$。\n        *   **结论**: Teacher 只能“放大”正确方向的梯度，不能“缩小”或“反转”它。这是一种安全的增强机制。\n\n**总结**: 数学推导的核心在于通过构造 $\\phi_t$ 的有界性和正定性，从理论上保证了 **Verifier 主导方向，Teacher 辅助幅度** 的设计原则，从而避免了 Distillation 常见的 Teacher-Bounded 问题。\n\n### § 7 实验设计与结论\n\n**提出了什么问题？**\n在多轮多步 LLM Agent 训练中，现有的 RL 方法存在 **Inter-turn Reward Dilution**（跨轮次奖励稀释，导致失败 Turn 的 Token 被错误强化）和 **Intra-turn Token Uniformity**（轮次内所有 Token 同等对待，导致梯度集中在低价值格式 Token 上）的问题。同时，现有的 Distillation 方法存在 **Teacher-Bounded Ceiling**（性能受限于 Teacher）和 **Gradient Concentration Collapse**（梯度崩溃）的问题。如何设计一种方法，既能保持 RL 的 Verifier-Bounded 高性能上限，又能提供 Dense Token-Level 信号以解决信用分配难题？\n\n**设计了什么实验验证这个问题？**\n1.  **基准对比实验 (Main Results)**:\n    *   **数据集**: BFCL V3 (多轮函数调用) 和 WildToolBench (真实世界多轮交互)。\n    *   **基线**: GRPO (标准 RL), MT-GRPO (Turn级 RL), EnvTuning (细粒度奖励 RL), OPD (外部 Teacher Distillation), OPSD (Self-Distillation)。\n    *   **验证点**: 比较 CREST 与这些基线在平均准确率、Session Accuracy (严格的多轮指标) 上的表现，特别是在长轨迹和严格指标上的增益。\n\n2.  **训练动态分析 (Training Dynamics)**:\n    *   **指标**: Rollout Accuracy 随训练步数的变化，以及 Top-p% Token 的梯度占比。\n    *   **验证点**: 观察 CREST 是否比 GRPO 收敛更快，是否比 OPSD 有更高的性能上限，以及 Entropy Gate 是否有效缓解了梯度集中问题（对比 OPSD 的极端集中）。\n\n3.  **消融实验 (Ablation Studies)**:\n    *   **层次分解消融**: 分别测试 \"Inter-turn only\" (仅 Turn 级优势) 和 \"Intra-turn only\" (仅 Token 级调制) 的效果。\n    *   **门控机制消融**: 分别移除 Direction Gate 和 Entropy Gate。\n    *   **验证点**: 证明两个层次是互补的（缺一不可），以及两个 Gate 对于保持 Verifier-Bounded 和防止梯度崩溃的必要性。\n\n**问题的答案是什么？**\n1.  **CREST 显著优于所有基线**: 在 BFCL V3 和 WildToolBench 上，CREST 在两个模型规模 (4B, 8B) 下均取得了最高准确率。特别是在长轨迹 (Long Context) 和严格的多轮 Session Accuracy 上，增益最大，证明了层次化信用分配的有效性。\n2.  **RL 优于 Distillation，但 CREST 结合了两者优点**: 实验显示 RL 基线通常优于 Distillation 基线（验证了 Teacher-Bounded 问题）。CREST 通过仅使用 Teacher 调制幅度，成功突破了 OPSD 的性能上限，同时保持了 RL 的 Verifier-Bounded 特性。\n3.  **两个层次互补且必要**: 消融实验表明，单独的 Inter-turn 或 Intra-turn 改进都无法达到完整 CREST 的性能。Inter-turn 解决了跨轮次稀释，Intra-turn 解决了轮次内噪声。移除 Direction Gate 会导致性能下降至 Teacher-Bounded 水平，移除 Entropy Gate 会导致梯度集中和性能下降。\n4.  **梯度分布更合理**: 训练动态分析显示，CREST 的梯度分布介于 GRPO (过于分散) 和 OPSD (过于集中) 之间，Entropy Gate 成功将梯度预算重新分配给高不确定性的内容 Token，提高了训练效率和稳定性。", "additional_insights": "### § 8 Take-aways\n\nCREST 提出了一种分层信用分配框架，通过解耦梯度方向（由 Verifier 决定）和梯度幅度（由 Self-Teacher 调制），在保持 RL 的 Verifier-bounded 性能上限的同时，解决了多轮多步 Agent 训练中的信用稀释问题。该方法在 Turn 级别使用独立的 Verified Reward 计算 Advantage，避免了传统 RL 中因单条轨迹平均奖励导致的成功与失败 Turn 信号混淆；在 Token 级别引入 Entropy-gated Self-Teacher 信号，仅对高不确定性且与 Verifier 方向一致的 Content Token 进行梯度放大，从而抑制了低熵 Format Token 的梯度集中崩溃。实验表明，CREST 在 BFCL V3 和 WildToolBench 上显著优于 GRPO、MT-GRPO 及 OPSD 等基线，特别是在长轨迹和严格的 Session-level 指标上，证明了“仅教幅度不教方向”的策略能有效利用密集监督信号而不牺牲探索上限。消融实验证实，Inter-turn 分割和 Intra-turn 调制是互补的，单独使用任一机制均无法达到完整 CREST 的性能，且 Direction Gate 对于防止 Teacher 信号覆盖 Verifier 信号至关重要。\n\n### § 9 最脆弱的假设\n\nCREST 的核心假设是：**Turn 级别的 Verified Reward 能够独立、准确地反映每个 Turn 的贡献，且 Turn 之间的状态依赖足够弱，使得独立计算 Advantage 不会破坏跨 Turn 的长期策略一致性。** 如果这一假设不成立，例如在高度耦合的多轮任务中，当前 Turn 的“失败”可能是为了后续 Turn 的“成功”所必需的策略性探索（即局部负奖励对应全局正收益），那么 CREST 的 Turn-segmented Advantage 会错误地惩罚这些关键步骤，导致策略退化。论文在 Limitations 部分承认该方法假设 Turn 结构固定且奖励可局部验证，并未直接扩展到强耦合或终端奖励主导的场景。虽然论文在 WildToolBench 上展示了 Session Accuracy 的提升，但该基准主要评估动作正确性和参数准确性，可能未充分覆盖需要复杂跨 Turn 状态推理或牺牲局部利益以换取全局最优的极端耦合案例。若在实际应用中遇到此类强耦合任务，CREST 的独立 Turn 信用分配机制可能失效，甚至不如传统的 Trajectory-level RL。\n\n### § 10 最小复现实验\n\n在 1 周内，可以使用 **BFCL V3** 的公开数据子集（如 100 个 Multi-turn Base 样本）和开源模型 **Qwen3-4B-Instruct**，复现 CREST 的核心组件：**Turn-segmented Advantage 计算** 与 **Entropy-gated Token Reweighting**。具体实现上，无需从头训练完整模型，而是利用预训练模型生成 Rollouts，手动计算不同信用分配策略下的梯度分布差异。测量指标包括：1) **Gradient Concentration**：计算 Top-5% Token 捕获的梯度比例，验证 CREST 是否比 OPSD 更分散且比 GRPO 更集中；2) **Direction Preservation**：检查经过 Teacher 调制后的 Token Advantage 符号是否与原始 Verified Reward 符号一致，验证 P1 性质。如果实验显示 CREST 的梯度分布确实处于 GRPO（均匀）和 OPSD（极端集中）之间，且符号保持率接近 100%，则支持其“解耦方向与幅度”的核心 claim；反之，若符号翻转频繁或梯度分布无改善，则反驳该方法的有效性。此实验无需完整训练循环，仅需前向传播和梯度分析，可在单卡 GPU 上快速完成。", "research_value": "### § 11 最强反例设计\n\n若要挑战 CREST 的有效性，最有力的攻击并非针对其数学推导的严密性，而是针对其核心假设——**Turn 级奖励的独立性与局部最优性**——在复杂多步推理中的失效。具体而言，可以设计一个“**战略性牺牲（Strategic Sacrifice）**”场景作为反例：在某些高耦合的多轮任务中，当前 Turn 的“失败”或“低分”是达成全局最优解的必要步骤。例如，在一个多轮代码调试任务中，Agent 在 Turn 1 故意生成一个包含特定错误模式的代码片段（导致 Verifier 给出负奖励 $R_1 \u003C 0$），以便在 Turn 2 中利用该错误触发特定的调试工具或获取关键上下文信息，从而在 Turn 3 完美修复问题。\n\n在这种场景下，CREST 的 **Inter-turn Credit Assignment** 机制会错误地将 Turn 1 的所有 Token 标记为负优势（Negative Advantage），从而抑制这种“以退为进”的策略探索。由于 CREST 强制要求梯度方向由 Verifier 决定，且 Turn 级优势独立计算，模型无法学习到“局部负奖励对应全局正收益”的长期依赖关系。相比之下，传统的 **Trajectory-level RL**（如 GRPO）虽然存在信用稀释，但其奖励信号是全局的，至少保留了这种长期策略的可能性。因此，反例实验可以构建一个合成基准（Synthetic Benchmark），其中包含大量此类“必要失败”的样本，预期结果是 CREST 的性能显著低于 Trajectory-level RL，甚至低于随机基线，因为它系统地惩罚了正确的探索行为。此外，还可以从理论角度攻击 **Entropy Gate** 的局限性：在高度确定性的格式 Token（如 JSON 括号）中，虽然熵低，但如果这些格式错误导致解析失败，其实际影响可能远大于高熵但语义正确的内容 Token。CREST 假设“低熵=低价值”，这在格式敏感型任务中可能导致对关键结构错误的忽视，从而引发 **Format Collapse**，即模型过度优化语义而忽略结构完整性，最终导致 Verifier 无法解析输出，奖励信号完全丢失。\n\n### § 12 Follow-up Research Idea\n\n基于 CREST 在强耦合任务中因 **Turn-segmented Advantage** 而失效的局限，以及其依赖 **Privileged Self-Teacher** 可能引入的分布偏移问题，提出一个新的研究方向：**Causal Credit Assignment via Counterfactual Rollouts (CCACR)**。\n\n**(a) 驱动局限与需求：**\nCREST 的核心缺陷在于其信用分配是**条件独立的（Conditionally Independent）**，即假设 Turn $k$ 的价值仅取决于其自身的奖励，而忽略了其对后续 Turn 的因果影响。在多轮 Agent 中，信用分配本质上是一个**因果推断（Causal Inference）**问题：我们需要估计每个 Token 或 Turn 对最终 Session 成功的**因果效应（Causal Effect）**，而非仅仅是相关性。现有的 RL 方法通过轨迹级奖励隐式处理因果，但方差极大；CREST 通过分解奖励降低方差，但引入了偏差（Bias）。我们需要一种方法，既能保持低方差，又能无偏地估计跨 Turn 的因果贡献。\n\n**(b) 借鉴领域与方法：**\n借鉴**因果机器学习（Causal ML）**中的**反事实推理（Counterfactual Reasoning）**和**干预（Intervention）**概念。具体而言，引入 **Do-calculus** 的思想，将 Agent 的生成过程视为一个结构因果模型（Structural Causal Model, SCM）。对于每个 Turn $k$，我们不仅观察其实际奖励 $R_k$，还通过**反事实 Rollout** 估计其**处理效应（Treatment Effect）**：即如果 Turn $k$ 的输出被替换为另一个候选输出（Counterfactual Output），后续 Turn 的奖励分布会发生什么变化？这可以通过在训练过程中，对关键 Turn 进行**随机干预（Random Intervention）**，生成多个平行宇宙（Parallel Universes）的 Rollout 来实现。\n\n**(c) 第一个实验设计：**\n构建一个名为 **CausalToolBench** 的新基准，专门设计具有强因果依赖的多轮任务（如：Turn 1 的选择决定了 Turn 2 可用的工具集，或 Turn 1 的错误会累积并在 Turn 3 爆发）。实验对比 CREST 与 CCACR 在该基准上的表现。\n1.  **方法实现**：在 CCACR 中，对于每个 Turn $k$，采样 $M$ 个反事实输出，并重新运行后续 Turn 的生成过程，计算这些反事实轨迹的平均奖励变化 $\\Delta R_{k \\to T}$。将这个 $\\Delta R_{k \\to T}$ 作为 Turn $k$ 的**因果优势（Causal Advantage）**，替代 CREST 中的 $A^{[turn]}_k$。\n2.  **验证指标**：除了 Session Accuracy，还引入 **Causal Attribution Score**，衡量模型对关键决策步骤的识别能力。预期结果是，CCACR 在 CausalToolBench 上显著优于 CREST，因为它能正确奖励那些“局部看似失败但全局必要”的 Turn，而 CREST 会错误地惩罚它们。\n3.  **区分已有工作**：与 CREST 不同，CCACR 不依赖 Self-Teacher 来调制幅度，而是通过反事实干预直接估计因果效应，从而从根本上解决了 **Inter-turn Dilution** 和 **Strategic Sacrifice** 问题，同时避免了 Teacher-Bounded 的限制。这是一个从“相关性信用分配”到“因果性信用分配”的范式转变。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Zechuan Wang\",\n      \"affiliations\": [\n        1,\n        3\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Siyuan Lu\",\n      \"affiliations\": [\n        1,\n        2,\n        3,\n        4\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Hongxuan Zhang\",\n      \"affiliations\": [\n        3,\n        5\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Linjian Mo\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Chenyi Zhuang\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Leilei Gan\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Zhejiang University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Shanghai Innovation Institute\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"AWorld Team, Inclusion AI\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Westlake University\"\n    },\n    {\n      \"id\": 5,\n      \"name\": \"Nanjing University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal contributions. Work was done during Zechuan and Siyuan’s internship in Ant Group.\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding Authors.\"\n    }\n  ]\n}\n```", "summary_translation": "可验证奖励强化学习（RLVR）为多轮工具使用智能体的训练提供了由验证器界定的性能上限，但其轨迹级的信用分配将异构的每轮结果混淆为单一的奖励信号。策略内蒸馏提供了密集的逐 token 监督，但要么受限于教师模型，要么容易陷入梯度集中崩溃。我们提出了 $\\textbf{CrEST}$，一种分层信用分配框架，它在保留 RL 的验证器界定上限的同时，融合了来自特权自教师的密集 token 级信号。$\\textbf{CrEST}$ 在两个层级上解决信用分配问题：分段验证优势解决了轮间稀释，而熵门控自教师调制则细化了轮内 token 的贡献。在 BFCL V3 和 WildToolBench 上的实验表明，$\\textbf{CrEST}$ 在两种模型规模下均一致优于 RL 和蒸馏基线，在长轨迹和严格的会话级指标上增益最大。我们的工作表明，教师在策略优化中的作用可以从确定更新方向降低为调节更新幅度，从而在不牺牲验证器界定上限的情况下实现密集信用分配。"}]}], "2026-08-13": [{"name": "Agent Evolution, Skills \u0026 Reflection", "count": 3, "papers": [{"title": "Self-Evolving Embodied Agents via Skill-Harness Evolution", "arxiv_id": "2608.11350", "authors": "Peidong Wang, Zhiming Ma, Ying Chang, Xufang Luo, Xiaocui Yang, Shi Feng, Yuqing Yang, Dongsheng Li", "summary": "Embodied agents are increasingly built as systems around foundation models, where performance depends not only on model weights but also on the skills, context, action interfaces, and execution harness surrounding the model. While supervised fine-tuning and reinforcement learning can adapt agents to new environments, they require additional data, rewards, and training runs; meanwhile, many train-free code-centric approaches rely on programmable robot APIs that may be unavailable in fixed-interface settings. We propose SHAPER, a self-evolving framework for train-free embodied adaptation that keeps model parameters frozen and improves the non-parametric agent system by evolving reusable skills and a context-code harness through target-environment rollouts. In SHAPER, the same frozen model can serve as both planner and optimizer, refining its external skills and context-code harness without parameter updates. We evaluate SHAPER on VLABench and ESI-Bench, covering embodied agents with different low-level action interfaces, and compare against pure execution, supervised fine-tuning, and test-time-scaling baselines such as verifier-free selection and voting. Our results suggest that skill-and-harness optimization is a practical route to self-evolving embodied agents when model training is expensive, unavailable, or undesirable.", "category": "cs.CL", "cluster": "Agent Evolution, Skills \u0026 Reflection", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在模型参数冻结（frozen model parameters）且无法或不宜进行额外训练（train-free）的约束下，如何使具身智能体（embodied agents）自适应地适应新的目标环境？传统的具身智能体适应方法主要依赖监督微调（Supervised Fine-Tuning, SFT）或强化学习（Reinforcement Learning, RL），这些方法需要访问模型权重、任务特定的演示数据或奖励信号，并消耗大量的计算资源进行参数更新。然而，在实际部署中，模型权重可能不可用，交互数据稀缺，或者重新训练的成本过高。此外，现有的免训练（train-free）方法多依赖于可编程的机器人 API 来生成或修复低级控制代码，但在许多具身环境中，这些接口可能缺失、不完整或难以暴露，智能体只能通过固定的动作空间（fixed action space）进行交互。因此，如何在保持模型参数不变的前提下，通过优化模型外部的非参数化组件（如可复用技能 reusable skills 和上下文代码 harness）来提升智能体性能，是一个亟待解决的关键问题。\n\n解决这一问题具有重要的理论与实践价值。首先，它提供了一种轻量级、低成本的适应途径，使得强大的预训练视觉语言模型（VLM）或视觉语言动作模型（VLA）能够在不重新训练的情况下，通过演化外部的程序化指导（procedural guidance）和上下文构建逻辑来适应新环境。其次，这种方法解耦了模型参数与系统组件，使得智能体的行为不仅由模型权重决定，还由可优化的外部工件（artifacts）塑造，从而提高了系统的可解释性和可维护性。最后，通过演化技能（skills）和上下文代码 harness，智能体能够积累跨任务的通用知识，并在面对分布偏移（distribution shift）时表现出更好的泛化能力，为构建自演化（self-evolving）的具身智能系统提供了可行的技术路线。\n\n### § 2 前人工作与不足\n\n尽管已有大量研究致力于具身智能体的适应与优化，但现有方法在免训练场景下仍存在显著不足。\n\n在参数更新方面，SFT 和 RL 方法（如 Open X-Embodiment, DROID, VLA-RL 等）虽然能显著提升性能，但它们严重依赖额外的数据、奖励信号和模型权重的可访问性，且在数据稀缺或模型闭源时无法应用。\n\n在免训练适应方面，近期的工作主要聚焦于代码生成与 API 调用。例如，Code as Policies (Liang et al., 2023) 和 ASPIRE (Lu et al., 2026) 等方法让语言模型编写或修复调用机器人特定 API 的程序。这些方法在拥有完整可编程接口、调试钩子和执行监控器的环境中表现良好，但其关键假设是底层控制接口是可编程且暴露的。在许多实际具身环境中，智能体只能通过固定的、受限的动作接口（fixed action interfaces）与环境交互，无法直接生成低级控制代码，导致这类方法失效。\n\n另一类免训练方法侧重于测试时缩放（Test-Time Scaling, TTS），如 MG-Select (Jang et al., 2025) 和 VOTE (Lin et al., 2025)，它们通过增加推理时的采样和聚合来提升性能。然而，本文实验表明，在具身任务中，单纯的推理时采样往往无法带来显著的性能提升，甚至可能低于直接执行，且其计算成本随部署次数线性增长，不具备长期复用的经济性。\n\n此外，针对模型外部工件优化的研究也各有侧重。SkillOpt (Yang et al., 2026) 和 EmbodiSkill (Ju et al., 2026) 专注于优化自然语言技能（skills），但通常固定执行 harness，忽略了上下文构建对性能的影响；AutoHarness (Lou et al., 2026) 则专注于合成代码 harness，但未协同优化可复用的程序化指导（skills）。这些方法未能同时考虑技能与上下文 harness 的联合演化，限制了智能体在复杂环境中的适应潜力。\n\n综上所述，现有工作要么依赖参数更新，要么依赖特定的可编程接口，要么仅优化单一的外部组件，缺乏一种在固定动作接口下，通过联合演化可复用技能和上下文代码 harness 来实现免训练适应的系统性框架。SHAPER 正是为了填补这一空白，通过利用目标环境的 rollout 反馈，同时优化技能和 harness，从而在保持模型冻结的情况下实现智能体的自演化适应。", "core_insight": "### § 3 重建作者的思考路径\n\n在具身智能（Embodied AI）领域，基于大模型（Foundation Models）的代理系统正逐渐取代孤立的策略网络。然而，现有的适应新环境的方法主要依赖参数更新，如监督微调（SFT）或强化学习（RL）。这些方法虽然有效，但存在显著瓶颈：它们需要昂贵的计算资源、大量的任务特定数据（demonstrations）或奖励信号，且在模型权重不可用（如闭源模型）或交互数据稀缺时无法应用。\n\n与此同时，另一类“免训练”（Train-free）方法试图通过外部组件来增强代理能力。早期的工作如 Voyager 或 Code-as-Policies 主要依赖生成可执行的机器人代码或调用特定的 API。然而，这种方法高度依赖于环境是否暴露了可编程接口（programmable APIs）和调试钩子。在许多实际或模拟环境中，动作接口是固定的（fixed-interface），或者底层控制逻辑是黑盒，代理无法直接生成底层控制代码，只能发出高层指令。这就留下了一个空白：当无法修改模型参数，且无法生成底层控制代码时，如何系统地适应环境？\n\n作者观察到，具身代理的性能不仅取决于模型权重，还严重依赖于“非参数化”组件，即可复用的技能（skills，如自然语言指导、任务分解策略）和上下文构建器（context-code harness，即决定向模型呈现哪些观察、历史动作和反馈的代码逻辑）。现有的免训练方法要么只优化技能（如 SkillOpt），要么只优化代码 harness（如 AutoHarness），且往往局限于文本游戏或特定 API 环境。\n\n因此，作者推断：如果我们将具身代理解耦为冻结的规划器（planner）、执行器（executor）以及外部的技能（skill）和 harness，那么适应过程可以转化为对这两个外部文本/代码工件的优化。关键在于，如何利用少量的环境 rollout 反馈，让同一个冻结的大模型既作为规划器执行任务，又作为优化器（optimizer）反思并改进这些外部工件。通过这种“自我进化”（self-evolving）机制，代理可以在不更新任何参数、不依赖底层 API 的情况下，通过优化高层的程序性指导（procedural guidance）和上下文构建逻辑来适应新的具身环境。\n\n### § 4 核心 Intuition\n\n具身代理的失败往往不是因为模型“不懂”物理世界，而是因为其接收到的上下文信息杂乱无章，或缺乏针对特定执行器接口的高效操作策略。SHAPER 的核心直觉是：与其昂贵地重新训练模型权重，不如将模型视为一个固定的推理引擎，通过进化其外部的“操作手册”（skill）和“信息过滤器”（harness）来适应环境。这种方法奏效的关键在于，它利用模型自身的推理能力，从失败的轨迹中提取文本梯度，自动修正那些导致重复错误、信息丢失或指令不匹配的外部逻辑，从而在冻结参数的情况下实现性能的显著提升。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nSHAPER 的核心方法是一种 **Train-Free Embodied Adaptation**（免训练具身适应）框架。它不更新基础模型（Foundation Model）的参数，而是通过进化两个非参数化组件——**Skill**（技能，即文本化的程序性指导）和 **Context-Code Harness**（上下文代码框架，即构建输入上下文的 Python 代码）——来提升 Agent 在目标环境中的表现。\n\n**完整 Pipeline 流程如下：**\n\n1.  **系统分解与初始化 (System Factorization \u0026 Initialization)**：\n    *   将具身 Agent 分解为四个部分：冻结的 VLM Planner ($M_\\theta$)、冻结的 Executor ($A_\\phi$)、可复用的 Skill ($s$) 和 Context-Code Harness ($h$)。\n    *   初始状态下，使用种子 Skill ($s_0$) 和种子 Harness ($h_0$)。Planner 根据任务指令 $g$、当前观测 $o_t$ 和历史轨迹 $\\tau_{\u003Ct}$，结合 $s$ 和 $h$ 构建的上下文，生成高层子目标或动作指令。\n\n2.  **环境交互与轨迹收集 (Environment Interaction \u0026 Rollout)**：\n    *   Agent 在目标环境的小批量任务集 $D_{tr}$ 上执行 rollout。\n    *   记录每一步的观测、动作、执行结果以及最终的任务奖励 $R$。\n\n3.  **分层文本诊断 (Hierarchical Textual Diagnosis)**：\n    *   **Round-level Judging**：针对每一步（Round），比较执行前后的观测和 Planner 的响应，生成局部批评（如“子目标错误”、“无进展”、“执行器不匹配”）。这避免了让优化器处理冗长的视觉轨迹。\n    *   **Episode Summarization**：结合元数据（命令、执行长度、错误）、终端上下文、Round 级批评和最终结果，生成紧凑的文本摘要。\n    *   **Textual Gradient Formation**：聚合所有 Batch 的摘要和统计信息，形成指导优化的“文本梯度” $\\Gamma(c)$，揭示跨回合的模式（如无效重复、指令漂移、上下文有害等）。\n\n4.  **两阶段技能-框架进化 (Two-Stage Skill-Harness Evolution)**：\n    *   使用同一个冻结的 VLM 作为 **Optimizer**，基于当前的候选项、文本梯度和优化历史，提出新的 Skill 和 Harness 候选。\n    *   **Stage 1: Skill Evolution**：固定 Harness，优化 Skill。Optimizer 生成新的文本指导策略（如更精确的命令格式、失败恢复规则）。\n    *   **Stage 2: Harness Evolution**：固定进化后的 Skill，优化 Harness。Optimizer 生成新的 Python 代码 `build_context`，用于更智能地筛选和格式化历史观测（如保留关键证据帧、压缩冗余历史）。\n    *   **Sandboxed Validation**：生成的 Harness 代码必须在沙箱中验证（无非法导入、无文件 I/O、超时限制），无效候选被拒绝。\n\n5.  **选择与迭代 (Selection \u0026 Iteration)**：\n    *   在固定的验证集 $D_{val}$ 上评估所有有效候选项。\n    *   保留 Top-K 表现最好的候选项进入下一轮优化。\n    *   重复上述过程若干轮，最终输出得分最高的 Skill-Harness 对 $(s^\\star, h^\\star)$。\n\n**真实例子讲解：VLABench 中的“取书”任务**\n\n*   **输入**：指令 “Fetch the Landmark Cases in Property Law book for tomorrow’s class.”，当前观测为书架视角。\n*   **初始状态 (Seed Agent)**：\n    *   *Skill*：通用指令，要求 Planner 检查场景并生成子任务。\n    *   *Harness*：简单拼接所有历史文本和最近5张图像。\n    *   *执行*：Planner 发出“抓取书”指令。VLA 执行后，书被部分拉出但仍卡在架子上。Planner 看到书还在视野中，误以为任务未完成或状态未变，重复发出相同的“抓取”指令。\n    *   *结果*：陷入死循环，直到步数耗尽，任务失败。\n*   **SHAPER 进化过程**：\n    *   *诊断*：Judger 指出“重复执行无进展”，Summarizer 指出“缺乏对执行状态的细粒度判断”。\n    *   *Skill 进化*：Optimizer 修改 Skill，要求 Planner 将意图路由到标准命令，并强制分类上一步尝试为“成功/失败/部分成功/停滞”。如果停滞，必须改变命令形式。\n    *   *Harness 进化*：Optimizer 修改 Harness，压缩旧历史，突出当前执行计数和停滞检测。\n*   **进化后状态 (SHAPER)**：\n    *   *执行*：Planner 检测到书仍有重叠（停滞），根据新 Skill 切换命令为“拿起（pick-up）”而非“抓取（retrieve）”。\n    *   *结果*：成功取出书籍，任务完成。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的理论数学推导，其核心在于将具身适应问题形式化为一个**非参数优化问题**。\n\n**核心公式与 Intuition：**\n\n1.  **Agent 操作定义**：\n    $$ y_t = M_\\theta(h(s, o_t, \\tau_{\u003Ct}, g)), \\quad a_t = A_\\phi(y_t) $$\n    *   *Intuition*：Agent 的动作 $a_t$ 由冻结的 Planner $M_\\theta$ 和 Executor $A_\\phi$ 决定。Planner 的输入是由 Harness $h$ 和 Skill $s$ 共同构建的上下文。SHAPER 的目标是优化 $s$ 和 $h$，而不是 $\\theta$ 或 $\\phi$。\n\n2.  **优化目标**：\n    $$ \\max_{c=(s,h)} J(c) = \\mathbb{E}_{g \\sim D} [R(\\tau)] $$\n    *   *Intuition*：目标是找到一组 Skill 和 Harness ($c$)，使得在任务分布 $D$ 上的期望奖励 $R$ 最大化。由于无法通过反向传播更新参数，SHAPER 使用基于 Rollout 反馈的启发式搜索（Beam Search）来近似求解这个最大化问题。\n\n3.  **文本梯度**：\n    $$ \\Gamma(c) = \\text{Summarize}(\\{ \\text{Critique}_i, \\text{Metadata}_i \\}_{i \\in \\text{Batch}}) $$\n    *   *Intuition*：传统的梯度是数值向量，这里的“梯度”是文本。它通过诊断工具从失败的轨迹中提取出可操作的错误模式（如“重复”、“上下文缺失”），指导 LLM Optimizer 如何修改代码和文本。\n\n### § 7 实验设计与结论\n\n**提出了什么问题？**\n当具身 Agent 的基础模型参数无法更新（由于成本、权限或数据稀缺）时，如何有效地适应新的目标环境？现有的免训练方法（如 Test-Time Scaling）或代码生成方法在固定接口或复杂推理任务中表现如何？\n\n**设计了什么实验验证这个问题？**\n1.  **基准选择**：选择了两个具有不同低级动作接口的具身环境：\n    *   **VLABench**：测试高层 VLM Planner 与底层 VLA Actor 的协作，涉及长程推理和常识。\n    *   **ESI-Bench**：测试主动感知和空间智能，涉及通过固定 API 进行探索。\n2.  **基线对比**：\n    *   **Executor-level**：直接执行 VLA，以及在相同数据上进行 SFT（监督微调）。\n    *   **Test-Time Scaling (TTS)**：MG-Select 和 VOTE（投票机制），这些方法通过增加推理时的采样量来提升性能。\n    *   **Agent-system adaptation**：Seed Agent（无进化）、仅 Skill 进化、仅 Harness 进化、以及完整的 SHAPER（Skill + Harness 进化）。\n3.  **评估指标**：任务成功率（VLABench）和准确率（ESI-Bench），并在分布外（Out-of-Distribution）场景（如未见过的目标类别、未见过的任务形式）下测试泛化能力。\n\n**问题的答案是什么？**\n1.  **Skill-Harness 进化优于参数更新和 TTS**：SHAPER 在 VLABench 上将成功率从 Seed Agent 的 28.25% 提升至 34.50%，显著高于 SFT（24.00%）和 TTS 基线（~22-24%）。在 ESI-Bench 上，SHAPER 的宏观准确率（42.9%）甚至超过了已发布的 GPT-5 Passive Single-view 参考结果（40.3%），且无需更新参数。\n2.  **Skill 和 Harness 的互补性**：Skill 进化主要解决了“做什么”和“如何判断状态”的问题（如避免重复命令），贡献了最大的性能提升；Harness 进化主要解决了“看什么”和“如何记忆”的问题（如保留关键视觉证据），在特定任务（如镜面反射、空间关系）上带来了显著增益。两者结合效果最佳。\n3.  **高效的免训练适应**：SHAPER 的优化成本极低（每次进化约 $2-3 美元 API 费用），且进化后的 Skill 和 Harness 可复用于所有后续任务，无需每轮推理都进行昂贵的采样或搜索。这证明了通过优化非参数化组件（Skill 和 Harness）是实现具身 Agent 自进化的实用路径。", "additional_insights": "### § 8 Take-aways\n\nSHAPER 提出了一种无需更新模型参数（train-free）的具身智能体自适应框架，其核心思想是将优化目标从神经网络权重转移至模型外部的非参数化组件，即可复用技能（reusable skills）和上下文代码执行器（context-code harness）。该方法利用冻结的视觉语言模型（VLM）同时扮演规划器（planner）和优化器（optimizer）的双重角色，通过目标环境中的少量 rollout 轨迹生成文本梯度（textual gradient），进而迭代优化技能描述和上下文构建逻辑。在 VLABench 和 ESI-Bench 上的实验表明，SHAPER 在保持模型参数冻结的情况下，显著提升了智能体在分布外（out-of-distribution）场景下的成功率，其性能超越了直接执行、监督微调（SFT）以及基于测试时缩放（Test-Time-Scaling, TTS）的基线方法。SHAPER 的关键优势在于其“一次性优化、多次复用”的特性，优化产生的技能和执行器成本极低（约 2-3 美元 API 费用），且推理阶段无需像 TTS 方法那样进行昂贵的采样或投票，从而实现了高效且可泛化的自适应。\n\n### § 9 最脆弱的假设\n\nSHAPER 最脆弱的假设是：**冻结的 VLM 具备足够的元认知能力（meta-cognitive capability），能够仅凭文本形式的 rollout 反馈（textual gradient）准确诊断失败原因，并生成在语法和逻辑上均正确、且能显著提升性能的 Python 上下文构建代码（harness code）。**\n\n如果这一假设不成立，即模型无法从失败的轨迹中提炼出有效的改进策略，或者生成的代码存在运行时错误且无法通过沙箱验证，整个自我进化循环将陷入停滞或产生退化（degradation）的工件。在实际中，这一假设可能失效的原因包括：1) 具身环境中的失败原因往往具有多模态复杂性（如视觉遮挡、物理动力学误差），仅靠文本摘要可能丢失关键因果信息，导致优化器产生错误的归因；2) LLM 生成复杂、无 bug 的 Python 代码（特别是涉及图像处理、状态压缩等逻辑的 harness）的能力有限，容易生成看似合理但实际无效或错误的代码。\n\n论文为这一假设提供的证据主要依赖于实验结果中 SHAPER 相对于 Seed Agent 的显著提升，以及附录中展示的优化前后 Skill 和 Harness 的具体代码对比，证明了模型确实生成了更精细的逻辑（如证据感知记忆、actor-aware 命令适配）。然而，论文缺乏对“优化失败案例”的深入分析，即未展示当模型无法正确诊断或生成无效代码时，系统是如何处理或退化的，也未提供消融实验来量化“文本诊断质量”对最终性能的影响，这使得该假设的鲁棒性存疑。\n\n### § 10 最小复现实验\n\n如果只有一周时间，可以复现 SHAPER 在 **VLABench** 上的 **Skill Evolution** 部分，以验证“文本技能优化能否在不改变模型参数和执行器的情况下提升性能”这一核心 claim。\n\n**具体方案：**\n1.  **数据与环境**：使用 VLABench 的官方环境，选取一个特定的任务类别（如 Semantic Understanding 中的 C1 split），使用 15 个训练 episode 和 24 个验证 episode。\n2.  **实现**：\n    *   冻结一个开源 VLM（如 Qwen2.5-VL-7B 或 LLaVA-1.5）作为 Planner。\n    *   使用 VLABench 提供的官方 VLA actor（如 $\\pi_0$）作为 Executor。\n    *   实现 SHAPER 的 **Skill Evolution** 流程：定义一个初始的 Seed Skill（通用提示词），运行训练 episode，收集轨迹和结果。\n    *   实现一个简单的 **Textual Diagnosis** 模块：使用另一个 LLM 实例（或同一模型的不同 prompt）对失败轨迹进行文本总结，生成“文本梯度”。\n    *   实现 **Skill Optimizer**：根据文本梯度，让 LLM 生成新的 Skill 提示词。\n    *   在验证集上评估新 Skill 的性能，迭代 2-3 轮。\n3.  **测量**：比较 Seed Skill 与经过 2-3 轮进化后的 Skill 在验证集上的成功率（Success Rate）。\n4.  **结果判定**：\n    *   **支持 Claim**：如果进化后的 Skill 在验证集上的成功率显著高于 Seed Skill（例如提升 \u003E5%），则证明文本技能优化是有效的，且无需更新模型参数。\n    *   **反驳 Claim**：如果进化后的 Skill 性能无提升或下降，或者生成的 Skill 导致执行器频繁报错，则说明仅靠文本反馈优化技能在复杂具身任务中可能不足，或诊断模块存在缺陷。\n\n此方案避开了复杂的 Harness 代码生成和沙箱验证，专注于验证 SHAPER 最核心的“通过文本反馈优化外部知识”的机制，实现成本低且能直接验证论文的主要贡献之一。", "research_value": "### § 11 最强反例设计\n\n要挑战 SHAPER 的有效性，最有力的反例设计应聚焦于**“文本梯度的信息瓶颈”与“代码生成的脆弱性”在长程、高动态环境中的耦合失效**。具体而言，可以设计一个名为 **“Causal Ambiguity in Dynamic Clutter”** 的实验场景。\n\n**实验设计：**\n构建一个包含大量视觉相似物体（如不同颜色的同款马克杯）且环境状态随时间动态变化（如灯光闪烁、物体被其他移动物体短暂遮挡）的具身任务。任务要求智能体根据复杂的逻辑条件（例如：“拿起那个在红色书本左侧、且未被阴影覆盖的蓝色杯子”）执行操作。\n\n**攻击逻辑：**\n1.  **诊断失效（Diagnosis Failure）**：SHAPER 依赖 `Hierarchical Textual Diagnosis` 生成 `Textual Gradient`。在动态遮挡或光照变化导致执行失败时，视觉观测 $o_t$ 的变化可能极其细微或具有欺骗性。LLM 作为 `Judger` 很难仅凭文本摘要区分失败原因是“感知错误（没看到杯子）”、“规划错误（选错了杯子）”还是“执行错误（抓取力度不对）”。如果 `Textual Gradient` 错误地将“感知遮挡”归因为“指令模糊”，Optimizer 可能会生成更冗长、更复杂的 Skill 描述，反而增加了 Planner 的认知负荷，导致性能退化。\n2.  **代码脆弱性（Code Fragility）**：SHAPER 的 `Harness Evolution` 生成 Python 代码来构建上下文。在动态环境中，有效的 Harness 可能需要复杂的时序逻辑（如“如果连续3帧遮挡，则回溯到上一帧清晰图像”）。LLM 生成的代码极易出现边界条件错误（如索引越界、状态机死锁）。虽然论文提到了 `Sandboxed Validation`，但沙箱只能验证语法和运行时错误，无法验证逻辑正确性。如果生成的 Harness 逻辑上“看似合理”但实际过滤掉了关键帧（例如错误地认为遮挡帧是冗余噪声），Planner 将基于错误的上下文做出决策，且这种错误难以通过简单的 `Round-level Judging` 发现，因为每一步的局部动作可能都是合法的，只是整体策略偏离了目标。\n3.  **替代解释**：SHAPER 在 VLABench 上的提升可能并非源于“自演化”，而是源于**“提示词工程的空间搜索”**。VLABench 的任务相对静态且结构化，LLM 通过随机搜索找到了更有效的 Prompt 组合。而在高动态、因果模糊的真实场景中，这种基于文本反馈的启发式搜索将陷入局部最优，甚至发散，证明该方法缺乏对物理世界因果结构的真正理解，仅是在优化“语言-动作”映射的表面相关性。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“文本梯度”到“符号-神经混合演化”：基于可微分程序合成的具身智能体自演化 (Differentiable Program Synthesis for Self-Evolving Embodied Agents)**\n\n**(a) 驱动局限与未满足需求：**\nSHAPER 的核心局限在于其优化信号是**离散的、非可微的文本**（Textual Gradient），且优化对象是**黑盒代码**（Python Harness）。这导致优化过程缺乏精确的方向性，且生成的代码难以保证逻辑一致性。此外，SHAPER 假设 LLM 具备足够的元认知能力来诊断失败，但这在复杂物理交互中往往不可靠。我们需要一种方法，能够将具身智能体的行为误差转化为更精确、可计算的信号，并直接优化可执行的、结构化的程序逻辑，而非依赖 LLM 的“直觉”生成代码。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴 **Neuro-Symbolic AI** 和 **Differentiable Programming** 领域的思想。具体而言，引入 **Program Synthesis with Differentiable Losses**（如 DeepCoder 或 Gato 的变体）和 **Causal Inf
