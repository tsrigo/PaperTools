### § 10 最小复现实验\n如果有一周时间，最小复现实验应聚焦于验证“adversarial objects 伪装完全生效，且模型从不根据运动修正外观先验”这一独立于物理引擎执行的 claim。无需部署 Genesis simulator 或 RL humanoid controller，直接从 HuggingFace 下载的 ReactHuman 数据集中提取 40 个包含 adversarial objects（如 foam anvil, steel apple）的场景，截取其 0.6s 的多视角观察帧。将这些图像输入给 2-3 个代表性 MLLMs（如 GPT-4o, Claude 3.5 Sonnet），使用论文提供的 JSON schema 要求模型输出 intent 和 keyframes。测量两个指标：一是模型在 free-form intent 中是否提及对物体材质或重量的怀疑，二是模型输出的动作分类是否与物体的视觉外观先验一致而忽略真实物理属性。如果超过 90% 的决策遵循外观先验且 0% 的输出提及材质怀疑，则强力支持论文 claim；反之，若有超过 20% 的案例显示模型通过观察异常的下落速度或反弹轨迹而输出怀疑论调或改变动作，则反驳了“对于当前 MLLMs，眼见即为实”的结论，表明模型具备一定的运动学修正能力。", "research_value": "### § 11 最强反例设计\n如果我要对 ReactHuman 发起最致命的攻击，我将设计一个“Spatial-Debiased Closed-Loop Interception”实验，直接挑战其核心评估协议的有效性，并提出一个具体的替代解释：ReactHuman 报告的高安全违规率（特别是 392 次“freezing in place”）并非源于 MLLMs 缺乏 reactive safety 认知，而是其固有的 3D spatial grounding 能力缺陷与论文设定的 deterministic mapping rule 相互作用的系统性伪影。我会选取论文中表现最差的几个模型，在完全相同的危险场景下将评估协议从“连续 3D keyframe 输出”替换为“离散空间语义动作选择”（例如，提供“向左前方迈一步并双手前伸”等预计算的安全 primitives 供模型选择，从而剥离 3D 坐标生成误差）。如果在这种剥离了精确空间坐标生成要求的协议下，模型的安全违规率显著下降且“freezing in place”现象大幅减少，这就直接证明了原 benchmark 的高失败率主要归咎于 MLLM 的空间坐标输出瓶颈，而非对物理危险的认知和反应决策缺陷。进一步地，我会引入一个闭环追踪实验，给模型提供连续 10 帧的物体下落轨迹而非单帧 freeze-and-predict，如果 interception 精度从米级误差骤降至厘米级，这将证明原论文的开环协议人为放大了模型的物理预测误差，从而彻底瓦解“模型因误判危险而失败”的核心结论。\n\n### § 12 Follow-up Research Idea\n基于 ReactHuman 暴露出的 MLLMs 将速度感知为二元状态、盲信外观先验且开环预测误差极大的局限，我提出一个全新的研究框架：“Kinematic-Anchored Active Hypothesis Testing for Embodied Perception”。该想法的驱动需求是：当前的 MLLMs 缺乏一种将视觉外观与动态物理运动学特征解耦，并在两者冲突时主动收集信息以修正先验的闭环机制。我们可以借鉴认知科学中的 Predictive Coding 框架与机器人学中的 Active Perception 理论，将具身决策从单次开环预测重构为一个多步的、以不确定性量化为核心的主动探索过程。在这个新框架下，模型首先基于视觉外观生成一个物理属性的 prior hypothesis，但在观察到前 0.2 秒的运动学特征（如异常的下落加速度）后，必须计算该观测与 prior 的冲突度（Surprise）；如果冲突度超过阈值，模型不应直接输出最终的 catch/dodge 动作，而是输出一个旨在最大化信息增益的“epistemic action”（如调整视角、伸出试探性肢体或推迟决策以获取更多帧）。第一个实验将聚焦于 ReactHuman 中的 adversarial objects 场景：在 0.6 秒的观察窗口内，强制模型在 0.3 秒时输出一个中间状态——对物体真实物理属性的 posterior probability 以及一个信息收集动作，而非最终拦截计划。我们将测量模型是否能在最终动作决策前，通过这种主动推迟决策或调整观测策略，成功识别出 foam anvil 和 steel apple 的真实属性，并对比这种闭环主动假设检验框架与原开环协议在最终安全违规率上的差异。这一提议从根本上改变了 reactive decision-making 的范式：从“眼见即为实的一次性猜测”转变为“运动学驱动的贝叶斯信念更新”，开辟了将认识论不确定性直接嵌入具身物理推理的新方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yizhan Li\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Jianxin You\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Mengyang Xiong\", \"affiliations\": [3, 2], \"markers\": []},\n    {\"name\": \"Yinhuan Chen\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Zicheng Zhao\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Dekun Wu\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Dongqing Zhang\", \"affiliations\": [5], \"markers\": []},\n    {\"name\": \"Bang Liu\", \"affiliations\": [1, 2], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Université de Montréal\"},\n    {\"id\": 2, \"name\": \"Mila – Quebec AI Institute\"},\n    {\"id\": 3, \"name\": \"McGill University\"},\n    {\"id\": 4, \"name\": \"McMaster University\"},\n    {\"id\": 5, \"name\": \"Meta Platforms\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "对突发物理危险（接住滑落的盘子、躲避掉落的刀子）做出反应，既是对 embodied intelligence 的一项有意义的测试，也是将 multimodal large language models (MLLMs) 部署为家庭机器人决策核心的硬性要求。然而，现有的评估方法要么通过对视频进行 question answering 来被动地探究 intuitive physics，要么针对诸如 navigation 和 rearrangement 等刻意的 long-horizon 任务；没有一种方法能衡量模型能否将物理理解转化为即时的、安全关键的行动。我们引入了 ReactHuman，这是第一个用于类人反应性决策的 physics-grounded benchmark，其中被评估的 MLLM 作为面对突发家庭危险的模拟 humanoid 的大脑；它涵盖 17 个事件家族和超过 1,000 个 bit-for-bit reproducible scenes，这些场景具有从 240 Hz rigid-body simulation 导出的精确且无需标注的 ground truth，包括外观与其物理属性相矛盾的对抗性物体（泡沫铁砧、钢制苹果）。我们进一步设计了一个 five-metric suite，沿着三个轴对每个反应进行评分：合理的、安全的和 physically grounded。我们物理执行每一个提交的计划，使得决策具有可观察的后果。借助这个 harness，我们评估了七个具有代表性的 MLLMs。结果表明，reactive safety 远未得到解决：模型在处理大约三分之一的危险时出现失误，它们基于固定的倾向而非观察到的场景采取行动，信任外观胜过运动，并且即使选择的行动是正确的，也会在米尺度上错过拦截点；这些失败都不会随着 model scale 的扩大而减少。因此，ReactHuman 提供了细粒度的诊断和可扩展的训练信号，以迈向 physically grounded 且具备安全意识的 embodied agents。该 benchmark 可在此处找到：https://huggingface.co/datasets/Alan123/reacthuman-benchmark-scaled"}]}], "2026-09-10": [{"name": "Embodied \u0026 GUI Agents", "count": 3, "papers": [{"title": "JarvisGUI: Towards Cross-Device GUI Agents with Dynamic Task Composition", "arxiv_id": "2609.10451", "authors": "Zixiang Chen, Yuheng Lu, Zihao Cheng, Zeming Liu, Jizeng Bai, Ziye Huang, Zhiyin Lin, Zihan Li, Yuhang Guo, Yunhong Wang, Haifeng Wang", "summary": "Real-world GUI usage frequently involves workflows that span multiple devices and platforms, requiring the transfer of intermediate results, maintenance of shared state, and coordination across heterogeneous environments. However, existing GUI benchmarks overwhelmingly evaluate agents on single-device, statically defined tasks, thus leaving such cross-device capabilities largely unexamined, resulting in an overly optimistic assessment of agents' readiness for real-world usage. We introduce JarvisGUI, a dynamic benchmark that evaluates GUI agents on cross-device workflows requiring coordinated interaction across heterogeneous platforms, including Android, Windows, and Ubuntu. Specifically, JarvisGUI formulates GUI tasks as input-output transformations under a lightweight type system, which allows us to automatically compose multi-step, cross-device workflows and dynamically evaluate agent performance within a unified framework. By evaluating agents in virtual environments spanning multiple operating systems, JarvisGUI reveals that state-of-the-art open-source GUI agents struggle with the state-transfer awareness, cross-platform contextual reasoning, and long-horizon dependency management required for real-world workflows, exposing a critical capability gap invisible to existing benchmarks.", "category": "cs.AI", "cluster": "Embodied \u0026 GUI Agents", "tags": ["cs.AI"], "filter_reason": "论文的核心贡献是提出了 JarvisGUI，一个用于评估跨设备 GUI 智能体能力的动态基准测试。根据筛选标准第一步中的保留规则，“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents / Multi-Agent LLMs，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留”。GUI 智能体属于典型的 Tool-Use Agent 和 Embodied Agent，且论文重点评估了智能体在跨设备工作流中的“长视野依赖管理”和“跨平台上下文推理”等核心 Agentic 能力。此外，重要校准中也明确指出“不要只因为论文是 benchmark、evaluation、behavior analysis... 就排除”。因此，该论文属于对 LLM 智能体能力的评估与失败机制诊断，符合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：当前GUI agents能否胜任跨设备协同工作流——即在Android、Windows、Ubuntu等异构平台之间传输信息、维护共享状态并协调多步操作以完成端到端任务。这一问题之所以重要，是因为真实用户的数字活动天然跨越多个设备：HCI研究（Brudy et al., 2018; Raptis et al., 2016）表明67.5%的用户拥有两台以上设备，37%的多设备使用场景涉及单任务内的顺序设备切换，且用户明确表达了对cross-device continuity的强烈需求。然而，现有GUI agent benchmark几乎全部采用single-device假设，将每个任务限制在一个操作系统或平台内，导致对agent真实部署能力的评估过于乐观。JarvisGUI通过构建一个动态的、可组合的cross-device评测框架，揭示了当前state-of-the-art开源agent在state-transfer awareness、cross-platform contextual reasoning和long-horizon dependency management方面的关键能力缺口——这些缺口在现有单设备benchmark中完全不可见。解决这一问题不仅能为GUI agent的real-world deployment提供更真实的评估标准，还能为未来agent的跨平台协调能力研究指明方向。\n\n### § 2 前人工作与不足\n\n该问题此前未被系统性地解决。现有GUI agent benchmark沿着从静态单步grounding任务（如ScreenSpot (Cheng et al., 2024)、ScreenSpot-Pro (Li et al., 2025)）到多步交互任务（如AITW (Rawles et al., 2023)、GUI Odyssey (Lu et al., 2025a)）再到虚拟环境动态评测（如OSWorld (Xie et al., 2024)、OmniBench (Bu et al., 2025)）的路径演进，但它们共享一个根本性的设计假设：每个任务被限定在单一设备或平台上执行。这一假设并非偶然遗漏，而是源于两个结构性原因：其一，现有GUI agent的推理架构（包括UI-TARS-2、AutoGLM等端到端agent）在其官方实现中均定义为单active GUI环境的交互循环，每步仅接收一个平台的screenshot，这使得多设备同时观测在工程上无法直接支持；其二，cross-device任务的标注成本极高——跨平台工作流涉及文件传输路径、中间状态追踪和异构evaluation criteria，手工标注难以规模化。\n\n最接近的工作是CRAB (Xu et al., 2025)，它首次认识到cross-device任务执行的重要性，但存在三个关键不足：首先，其cross-device任务仅包含18个，规模受限根本上是由于手工标注的瓶颈未被突破；其次，CRAB没有建模真实的文件和数据跨设备传输机制，无法评估端到端的cross-device workflow；最后，它缺乏类型化的任务组合框架，无法自动生成和验证可扩展的跨设备任务图。JarvisGUI通过引入基于slot typing的atomic task建模框架和hierarchical type system，实现了任务间数据流validity的自动检查和大规模自动组合，同时通过Docker虚拟化和unified action/observation space屏蔽了底层平台异构性，从而在工程上解决了可复现性、高吞吐并行执行和多设备协作的三角难题。", "core_insight": "### § 3 重建作者的思考路径\n\n从已有背景出发，一个认真研究 GUI agents 的研究者会注意到一个明显的张力：一方面，MLLMs 驱动的 GUI agents 在单设备 benchmark（如 AndroidControl、OSWorld、ScreenSpot）上的表现持续提升，reinforcement learning 和大规模 GUI grounding 数据的引入让 coordinate prediction 和 action execution 变得越来越可靠；另一方面，HCI 研究早已记录了真实数字工作流的一个基本特征——用户 routinely 跨设备操作，67.5% 的用户拥有两台以上设备，37% 的多设备使用案例涉及单任务内的顺序设备切换。这个 gap 意味着现有 benchmark 可能正在测量一个与真实部署条件脱节的能力维度。\n\n进一步审视现有 benchmark 的设计假设，会发现它们几乎全部建立在\"单设备、静态定义任务\"的范式上。CRAB 是唯一意识到跨设备重要性的工作，但它只有 18 个手工标注的跨设备任务，且没有建模真实的文件和数据传输——这不足以支撑系统性评估。更关键的是，这种单设备假设掩盖了一类独特的失败模式：agent 在单个设备上可以正确执行 atomic actions，但在需要将一个设备的输出作为另一个设备的输入时，会丧失对中间状态的追踪能力。这种 failure mode 在现有 benchmark 中根本不可见。\n\n从技术层面推演，跨设备 GUI 交互引入了三个单设备场景不存在的挑战：第一，**state-transfer awareness**——agent 需要仅凭在一个设备上的执行历史，推断另一个设备上的环境状态（例如文件是否已到达、位于哪个路径）；第二，**cross-platform contextual reasoning**——隐式指令需要被正确路由到目标平台（\"C 盘\"暗示 Windows，\"回到电脑\"指代先前操作的设备），这要求 agent 维护跨设备的上下文记忆；第三，**long-horizon dependency management**——跨设备任务通常构成严格顺序的 critical path，任何中间步骤的失败都会使后续规划失效。这些挑战在单设备 benchmark 中无法被自然触发。\n\n那么如何系统性地构造和评估这类任务？一个直觉的路径是：如果将每个 GUI 任务视为一个 input-output transformation——接受某些 typed slots 作为输入，产生某些 typed slots 作为输出——那么跨设备工作流就可以被建模为这些 transformations 的有向组合。关键在于引入一个轻量级的 type system：当 output slot 的类型是 input slot 类型的 subtype 时（例如 `xlsx_file ⪯ ordinary_file`），数据流就被允许。这个 type discipline 既保证了组合的语义一致性，又使得任务生成可以自动化——通过 sampling-based procedure 不断连接兼容的 slots，就能大规模生成 well-typed 的跨设备任务图。同时，由于每个 atomic task 都附带 parameterized evaluator，组合后的任务可以通过检查最终环境状态来动态评估，绕过了中间步骤的脆弱性。\n\n环境层面，要支撑这种评估需要解决异构平台的统一控制问题。Android、Windows、Ubuntu 三种操作系统各有不同的交互原语和观察方式，需要一个 platform-agnostic 的 abstraction layer 来屏蔽底层差异。同时，为了支持跨设备文件传输，还需要引入一个共享的网络存储服务作为设备间的数据桥梁。而当前 GUI agents 的推理范式——每步只处理一个 active platform 的 screenshot——与跨设备场景的多设备观察需求存在冲突，这促使作者采用 Planner-Grounder 架构：一个 centralized planner 接收所有平台的 screenshots 并决定下一步在哪个平台执行什么高层动作，再委托特定平台的 grounding agent 完成 coordinate prediction。\n\n### § 4 核心 Intuition\n\n跨设备 GUI 任务的真正瓶颈不在于单设备上的操作能力，而在于 agent 能否在异构设备之间正确传递和追踪状态。这篇论文的核心 intuition 是：**如果将 GUI 任务建模为带类型约束的 input-output transformations，并用 subtype compatibility 来约束设备间的数据流，就可以把\"跨设备协调\"这个模糊的难题转化为一个可自动组合、可自动验证的 typed task graph 问题**。type system 充当了跨设备数据传递的\"契约\"——它确保上游任务的输出能被下游任务正确消费，而 dynamic evaluation 通过直接检查最终环境状态绕过了中间步骤的不可靠性，使得整个 benchmark 既能大规模自动生成，又能严格评估。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Human Annotated Atomic Tasks]\n   |\n   v\n[Type System \u0026 Graph Composition] -\u003E [Composed Task Graph]\n   |                                        |\n   |                                        v\n   |                          [Value Propagation \u0026 Rewriting]\n   |                                        |\n   |                                        v\n   |                          [LLM-as-a-Judge Filtering]\n   |                                        |\n   |                                        v\n   |                          [JarvisGUI Benchmark Tasks]\n   |                                        |\n   v                                        v\n[Evaluation Execution Layer] \u003C------- [Planner-Grounder Architecture]\n   |                                        |\n   | (Docker: Android/Win/Ubuntu)           | (Planner -\u003E Grounder)\n   v                                        v\n[Automated Scoring (Evaluators)] \u003C--- [Agent Actions]\n```\n\nJarvisGUI 的构建与评测 pipeline 包含以下步骤：\n\n- **Template Task Annotation** (§ 4.2)：输入为人工经验，输出为带有文本占位符（如 `{{input_slot_name}}`）的原子任务模板及其参数化 Python 评估器。这些任务与具体输入解耦，支持运行时动态实例化。\n- **Type System \u0026 Graph Composition** (§ 4.1, Algorithm A.5)：输入为原子任务集与层级类型系统，通过子类型兼容性（subtype relation $\\preceq$）采样并连接任务的输入输出槽位。若连接的任务处于不同平台，则自动插入辅助文件传输任务。输出为有向任务图。\n- **Value Propagation \u0026 Rewriting** (§ 4.2)：输入为有向任务图，沿有向边将上游任务的具体输出值传播至下游任务的输入槽位，动态实例化任务描述与评估函数。随后使用 Qwen3-32B 重写合并后的指令，输出为连贯的复合任务。\n- **LLM-as-a-Judge Filtering** (§ 4.2, Table 5)：输入为自动生成的复合任务，使用 Qwen3-30B-A3B 从 Task realism、Task coherence 和 Evaluability 三个维度进行 1-5 分打分。输出为三项均满分的最终高质量任务集。\n- **Evaluation Execution Layer** (§ 3.2)：输入为高质量任务配置文件，解析后动态分配 Docker 容器与计算资源，进行预执行初始化（如上传文件）。输出为隔离且可复现的跨设备虚拟环境。\n- **Planner-Grounder Architecture** (§ 5.1, Table 4)：推理阶段，输入为多设备实时截图与用户指令。Planner（Qwen3-VL-Plus）执行高层推理，决定下一步的目标平台与抽象动作；Grounder（如 UI-TARS, HOLO2 等 baseline）接收目标平台的单设备截图与动作指令，预测精确坐标。输出为可执行的 GUI 动作。\n- **Automated Scoring** (§ 3.1, § 5.1)：评测阶段，输入为任务执行完毕后的最终环境状态。通过确定性的评估函数 $\\phi$ 检查可观测产物（如文件内容、DOM 元素），输出为 Total Task Success Rate (TSR) 和 Sub-task Success Rate (SSR) 指标。\n\n### § 6 核心数学推导\n\n本文未涉及深度的数学推导，而是采用形式化建模来严格定义任务与环境。以下是核心公式的 intuition：\n\n任务被定义为元组 $T = (I, O, D, \\Phi, P)$，其中 $I$ 和 $O$ 分别为输入输出槽位，$D$ 为自然语言模板，$\\Phi$ 为评估函数，$P$ 为目标平台。这明确了任务的静态规格与动态组件的边界。\n\n在任务执行的状态转移过程中，Agent 维护内部记忆 $M_{i-1}$，结合当前观察 $s_i$ 与指令 $D$ 生成动作 $a_i$。在异构环境中，状态 $s_i$ 可由多平台观察拼接而成，允许 Agent 在单步推理中联合考虑多个设备。\n\n任务图的全局成功判定公式为 $\\text{Success}(G) \\iff \\forall v \\in V, \\forall \\phi \\in \\Phi_v, \\phi(s_{\\text{final}}[v]) = 1$。这意味着只有当任务图中所有节点的所有评估函数在最终状态上都返回 1 时，复合任务才算成功。这体现了跨设备工作流中严格的逻辑依赖与脆弱的关键路径。\n\n### § 7 实验设计与结论\n\n**提出了什么问题**：当前 GUI agents 在跨设备工作流中的实际能力如何？现有的单设备 benchmark 是否掩盖了其在真实场景下的瓶颈？\n\n**设计了什么实验验证这个问题**：在 JarvisGUI 上评测了 6 个主流开源 GUI agents。实验分为 Atomic Tasks（评估单平台变参数执行鲁棒性）与 Multi-Tasks（评估复杂规划能力，细分为单设备依赖 SW、多设备独立 MI、多设备依赖 MD）。推理采用 Planner-Grounder 架构以适配现有的单平台交互范式，并使用 TSR 与 SSR 指标进行自动化评测。\n\n**问题的答案是什么**：实验揭示了跨设备能力的巨大鸿沟。在多设备依赖（MD）任务中，agents 的成功率极低，甚至接近于 0。主要瓶颈在于状态推断困难、长程关键路径脆弱、多设备上下文导致的视觉与认知过载，以及逻辑依赖管理能力不足。此外，由于预训练数据分布的差异，agents 在 Windows 上的表现普遍弱于 Ubuntu 和 Android。这证明现有单设备 benchmark 确实给出了过于乐观的评估。", "additional_insights": "### § 8 Take-aways\n\nJarvisGUI 是首个系统评估 GUI agent 跨设备协作能力的 benchmark，覆盖 Android、Windows、Ubuntu 三种异构平台，核心创新在于将 GUI 任务建模为带类型约束的 input-output transformation，通过 hierarchical type system 和 sampling-based composition 自动生成可验证的跨设备工作流。实验揭示了一个被现有 single-device benchmark 掩盖的严重能力缺陷：当前最强的开源 GUI agent（如 UI-TARS-1.5、HOLO2、Qwen3-VL）在 multi-device dependent (MD) 任务上的 TSR 几乎为零，即便在 multi-device independent (MI) 任务上也显著低于 single-device 表现，主要瓶颈在于 state-transfer awareness（无法从一台设备的历史执行记录推断另一台设备的当前状态）、cross-platform contextual reasoning（无法将隐式指令正确路由到目标平台）以及 long-horizon dependency management（子任务数≥4 时成功率趋近于零）。论文还发现 platform bias：agent 在 Ubuntu 和 Android 上的 atomic task 表现优于 Windows，这归因于预训练数据中 Windows GUI 交互数据的相对稀缺。在方法论层面，论文证明了 slot-typing + type compatibility 约束可以在大规模下自动生成结构合法的跨设备任务，配合 LLM-as-a-judge 三维过滤（authenticity、rationality、evaluability）可将任务质量控制在可接受范围内（人工一致率 92%，Cohen's Kappa ≈ 0.92）。\n\n### § 9 最脆弱的假设\n\n论文最脆弱的核心假设是：**两阶段 Planner-Grounder 架构（用通用 VL model Qwen3-VL-Plus 作为 centralized planner，用被评估的 specialized GUI agent 作为 single-device grounder）能够公平地度量 GUI agent 本身的跨设备能力，而非度量 planner+grounder 系统的整体性能。** 这个假设一旦不成立，论文关于\"GUI agent 缺乏跨设备能力\"的核心结论就会发生根本性的归因错误——性能下降可能主要来自外部 planner 的协调失败，而非被评估 agent 的能力缺陷。\n\n在实际中这个假设很可能不成立。论文自己承认，当前 GUI agent 的推理实现仅支持 single active platform，因此被迫引入外部 planner 来处理平台选择和高层规划。但 planner 承担的恰恰是跨设备任务中最困难的认知工作：多屏视觉整合、平台路由推理、跨设备状态追踪。当 planner 将指令错误路由到错误平台、或无法从历史记录推断目标设备状态时，grounder 收到的已经是错误的高层指令，其失败不能归因于 grounding 能力不足。论文在 Appendix D.1 中提供的 failure mode 分析显示 67.4% 的失败属于\"context loss between tasks\"，但这一分析停留在系统层面，没有进一步区分是 planner 丢失了上下文还是 grounder 无法执行正确的单设备操作。Appendix A.7 中更换 planner（Kimi K2.6）后 Multi-Overall 从 8.0 升至 11.3，这恰恰说明 planner 选择对结果有显著影响，但论文没有进行 planner 错误与 grounder 错误的分离归因实验，也没有报告 planner 单独在跨设备规划任务上的准确率作为 baseline。缺少这一证据意味着论文无法排除\"瓶颈主要在 planner 而非 GUI agent\"这一替代解释。\n\n### § 10 最小复现实验\n\n在一周时间内，最值得复现的是论文的 **type system + sampling-based task composition + LLM-as-a-judge filtering** 这条数据生成管线，因为它不依赖完整的跨设备虚拟环境，却能验证论文方法论贡献的核心 claim：自动组合的跨设备任务在结构合法性、语义连贯性和可评估性上达到可用水平。\n\n具体方案：定义一个简化 type system，包含约 8 种类型（ordinary_file、image_file、png_file、text_file、csv_sheet、xlsx_sheet、docx_document、plain_text）及其 subtype 偏序关系（如 png_file ⪯ image_file ⪯ ordinary_file）。手动编写 30 个 atomic task template，每个包含 input/output slot 声明、带 {{placeholder}} 的自然语言指令模板、以及参数化 Python evaluator 函数，覆盖 Android/Windows/Ubuntu 三平台。实现 Algorithm 1 的采样组合逻辑，生成 100 个 composed task graph，其中跨平台边自动插入 file-transfer auxiliary task。然后用 Qwen3-32B（或任意可用的大模型）作为 judge，对每个组合任务按 authenticity、rationality、evaluability 三维打分（1-5），仅保留全 5 分的任务。最后随机抽取 50 个通过过滤的任务进行人工审查，计算与 LLM judge 的 Cohen's Kappa。\n\n测量三个指标：(1) type system 通过率——组合任务中满足类型约束的比例，论文隐含声称\"绝大多数情况下\"合法，预期 \u003E90%；(2) LLM judge 通过率——全 5 分任务占比，这直接反映自动组合的质量；(3) 人工-LLM 一致率——Cohen's Kappa，论文报告 0.92。如果 type system 通过率低于 70% 或 LLM judge 通过率低于 20%，说明自动组合的质量不足以支撑 benchmark 构建，反驳了 slot-typing framework 的可扩展性 claim；如果 Cohen's Kappa 低于 0.7，说明 LLM judge 不可靠，整个质量控控环节存疑。反之，三项指标接近论文报告值则支持其方法论的核心有效性。整个实验仅需 Python 脚本 + LLM API 调用，无需 Docker/KVM/虚拟机环境。", "research_value": "### § 11 最强反例设计\n\n如果我反对这篇论文，我会设计一个“Oracle Planner”对照实验来攻击其核心归因逻辑。论文声称当前 GUI agent 缺乏 state-transfer awareness 和 cross-platform contextual reasoning 能力，但这实际上可能是外部 centralized planner 的能力瓶颈被错误地归因到了 GUI agent 身上。具体而言，我会构建一个由人类专家或完美规则驱动的 Oracle Planner，它能够 100% 正确地进行平台路由、跨设备状态追踪，并将完美的高层指令传递给被评估的 GUI agent。如果在 Oracle Planner 的加持下，当前 state-of-the-art GUI agent 在 multi-device dependent (MD) 任务上的 Task Success Rate (TSR) 从接近 0 大幅跃升至显著水平，那么论文关于“GUI agent 缺乏跨设备能力”的核心结论将被彻底推翻。这将证明性能崩溃的真正原因是 Qwen3-VL-Plus 作为 planner 在多屏视觉整合和状态推断上的失败，而非 GUI agent 本身的 grounding 缺陷。进一步地，我可以分析在 Oracle Planner 场景下 agent 失败的真正原因，如果发现失败主要源于单设备内的 long-horizon dependency management 而非跨设备协调，那么 JarvisGUI 所揭示的“能力缺口”就只是一个伪命题，其实质仍然是单设备长程任务的固有难题。\n\n### § 12 Follow-up Research Idea\n\n驱动这个想法的局限是：当前 GUI agent 的推理架构被工程化地限制在 single active platform，导致跨设备协作被迫退化为“外部 Planner + 单设备 Grounder”的拼凑架构，这不仅引发了严重的归因谬误，也阻碍了 agent 原生学习跨设备状态同步的潜力。借鉴分布式系统中的 shared memory 机制和 robotics 中的 Vision-Language-Action (VLA) 统一感知控制范式，我提出构建一个“原生多设备 VLA 模型”。其核心是放弃 centralized planner 的显式调度，转而训练一个单一的 VLA 模型，使其能够同时接收并融合来自多个异构平台（如 Android、Windows、Ubuntu）的实时 screenshots，并在一个 unified action space 中直接输出带有 device routing header 的操作指令。这不再是任务调度问题，而是多屏联合感知与控制问题。第一个实验将构建一个多屏输入的联合训练数据集，将不同设备的 GUI 轨迹在时间轴上对齐，输入为多屏拼接图像，输出为带设备标识的 action。在 JarvisGUI 的 MD 任务上，对比该原生多设备 VLA 模型与论文中 Planner-Grounder 架构的表现，重点观测该模型是否能在无显式路由指令的情况下，隐式学会 cross-platform contextual reasoning 和 state-transfer awareness，从而彻底消除外部 planner 带来的归因混淆，并探索端到端模型在跨设备工作流上的 scaling laws。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zixiang Chen\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Yuheng Lu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Zihao Cheng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zeming Liu\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Jizeng Bai\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ziye Huang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhiyin Lin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zihan Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuhang Guo\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yunhong Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Haifeng Wang\", \"affiliations\": [3], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Beihang University\"},\n    {\"id\": 2, \"name\": \"Beijing Institute of Technology\"},\n    {\"id\": 3, \"name\": \"Baidu Inc.\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author: Zeming Liu.\"}\n  ]\n}\n```", "summary_translation": "真实世界的 GUI 使用经常涉及跨越多个设备和平台的 workflows，需要传递中间结果、维护共享状态以及跨异构环境进行协调。然而，现有的 GUI benchmarks 绝大多数在单设备、静态定义的任务上评估 agents，从而使得这种跨设备能力在很大程度上未被检验，导致对 agents 应用于真实世界的准备程度做出了过于乐观的评估。我们引入了 JarvisGUI，这是一个动态的 benchmark，用于在需要跨异构平台（包括 Android、Windows 和 Ubuntu）进行协调交互的跨设备 workflows 上评估 GUI agents。具体而言，JarvisGUI 将 GUI 任务表述为轻量级 type system 下的 input-output transformations，这使得我们能够自动组合多步、跨设备的 workflows，并在统一框架内动态评估 agent 性能。通过在跨越多个操作系统的虚拟环境中评估 agents，JarvisGUI 揭示了最先进的开源 GUI agents 难以应对真实世界 workflows 所需的 state-transfer awareness、cross-platform contextual reasoning 和 long-horizon dependency management，暴露了现有 benchmarks 无法察觉的关键能力差距。"}, {"title": "Show-Harness: Just a VLM Agent Can Play Robots", "arxiv_id": "2609.10522", "authors": "Yanzhe Chen, Zechen Bai, Zhijun Cao, Wenzheng Zeng, Kevin Qinghong Lin, Yiqi Lin, Guoqiang Liang, Kevin Yuchen Ma, Qiming Huang, Mike Zheng Shou", "summary": "Foundation vision-language models (VLMs) exhibit broad intelligence about the world, yet translating this intelligence into robot control remains challenging. We present Show-Harness, an Embodied Harness that enables VLMs to \"play\" robots through a compact semantic interface linking intent to action. Show-Harness exposes discrete semantic action units that VLMs can naturally reason over, while embodiment-specific interpreters deterministically ground them into local robot actions, keeping the VLM directly responsible for fine-grained physical decisions. Through the same interface, Show-Harness demonstrates the feasibility of (1) directly unlocking closed-source frontier VLMs for zero-shot robot control, and (2) adapting small-scale open-source VLMs for low-cost deployment with just a few GPU-hours of fine-tuning. We further develop GUMI (GUI Manipulation Interface), which extends the same semantic action space to GUI-based demonstration collection, allowing humans and agents to \"play\" robots across embodiments without specialized teleoperation hardware. Extensive experiments show that Show-Harness-equipped VLM agents generalize robustly across tasks, embodiments, and environments, outperforming representative agentic and VLA paradigms. These results suggest that the right interface can unlock substantial embodied capability from foundation VLMs, without requiring additional model capacity or costly embodiment-specific pretraining.", "category": "cs.AI", "cluster": "Embodied \u0026 GUI Agents", "tags": ["cs.AI"], "filter_reason": "这篇论文提出了 Show-Harness，一个专门为具身智能体设计的 Embodied Harness 框架。其核心贡献在于设计了一种紧凑的语义接口，将 VLM 的意图与具体的机器人动作连接起来，使得 VLM 能够直接负责细粒度的物理决策并实现零样本控制或低成本微调。这完全符合第一步筛选标准中关于“构建 LLM 智能体的方法论或新框架”以及“研究 agent 的 harness / scaffold / runtime ... 适用于 embodied agent”的保留规则。虽然论文涉及视觉语言模型（VLM），但 VLM 在此作为智能体的大脑被使用，研究的核心是 Agent Harness 的设计与构建，而非单纯的多模态视觉理解，因此不触发多模态排除规则。该研究属于单智能体（具身智能体）的架构和工具使用设计范畴，与你的研究焦点高度契合。", "intro_logic": "### § 1 研究问题与重要性\n论文提出的核心研究问题是：如何设计一个合适的 interface，将 foundation vision–language models (VLMs) 已具备的广泛世界知识直接转化为细粒度的物理机器人控制，而无需额外的模型容量或昂贵的 embodiment-specific pretraining。这个问题至关重要，因为尽管 VLMs 已经掌握了物体识别、空间关系推理和长视距目标分解等能力，但将这些语义智能映射为具体的机器人行为仍是一个未解难题。现有的 Vision–Language–Action (VLA) 范式通常将 VLMs 微调以回归特定 embodiment 的连续动作，这不仅将广泛的语义知识压缩为不透明的 pixel-to-actuation mapping，还导致模型在面对新任务、新环境或新机器人时需要反复适应。解决这一问题能够释放 VLMs 中潜藏的具身能力，提供一条可扩展的路径：既能通过 zero-shot 方式直接利用闭源前沿 VLMs，又能通过少量 GPU 小时的微调适配小型开源 VLMs 以实现低成本部署，从而跨越数字智能与物理交互之间的鸿沟。\n\n### § 2 前人工作与不足\n该问题此前未被完美解决，主要存在两条技术路线及其固有局限。第一条路线是将 foundation models 作为 low-level policies（如 $\\pi_{0.5}$、GR00T、RT-2、OpenVLA 等 VLA 模型），它们通过回归、diffusion 或 flow matching 预测连续动作块或离散 motor tokens。这类方法以牺牲语义来换取控制力：将模型重新拟合到 embodiment-specific 的 motor signals 上，导致其广泛的预训练知识坍缩为不透明的 sensorimotor mapping，且通常需要为新的任务族或机器人本体收集全新的机器人轨迹。第二条路线是将 foundation models 作为 intermediate decision makers（如 PaLM-E、VoxPoser、ReKep、RoboPoint 等）或纳入 agentic architectures（如 Code as Policies、Inner Monologue、SayCan 等）。这些系统让 VLM 生成 subgoals、keypoints、affordance targets 或程序代码，然后交由下游控制器或预定义技能库执行。这种方法虽然保留了语义，但放弃了物理控制的直接性：模型指定意图却无法掌控其物理实现过程，且每种中间表示都高度依赖精心工程化的、系统特定的 grounding pipeline。在现有的 agentic 系统中，interface design 虽是核心问题，但主流方案通常将整个 skills、controllers 或 VLAs 作为不透明的可调用原语暴露给模型——即模型只决定“做什么”，而由黑盒执行器决定“怎么做”。这种设计削弱了 semantic intent 与 physical execution 之间的直接联系，使得 VLM 无法对细粒度的物理决策负责。Show-Harness 正是针对这一缺口，提出暴露“怎么做”本身：通过细粒度、确定性的 semantic action units，让 VLM 在闭环中保持对物理决策的直接掌控，同时避免了 VLA 范式的语义坍缩和分层系统的物理失控。", "core_insight": "### § 3 重建作者的思考路径\n\n在探索如何将 Foundation VLMs 的智能转化为机器人控制时，研究者们面临着两条传统路径的固有缺陷。第一条路径是 Vision–Language–Action (VLA) models，试图通过微调让 VLM 直接回归特定 embodiment 的连续低级动作。这种做法将 VLM 广泛的语义知识压缩成了不透明的 pixel-to-actuation mapping，不仅丧失了模型原有的泛化能力，还要求针对每个新任务或新机器人收集大量轨迹数据进行重新适应。第二条路径是 Hierarchical and programmatic systems，让 VLM 输出高层子目标或基于控制 API 的代码，然后交由下游控制器执行。这虽然保留了语义，但切断了 VLM 与物理执行的直接联系，模型只决定“做什么”而不知道“怎么做”，难以在闭环中处理细粒度的空间调整和错误恢复。\n\n面对这一困境，作者可能从数字世界的 Agent 中获得了灵感。在 GUI 或游戏环境中，Foundation models 展现出了惊人的零样本操作能力，其核心在于它们拥有简单、离散且可解释的接口（如键盘按键或鼠标点击）。然而，真实世界的机器人操作缺乏这样统一且易于操作的接口，其控制通常是高维且高度依赖特定 embodiment 的。作者由此推论：如果能在物理世界中构建一个类似的“离散语义接口”，既能让 VLM 像理解文字或游戏按键一样自然推理，又足够细粒度以实现直接的物理控制，那么就能在不破坏模型原有语义知识的前提下，将其直接接入物理闭环。通过将动作空间定义为离散的语义单元（如 MV_FWD、GRASP），并把特定机器人的物理映射交由一个确定性的 interpreter 处理，VLM 就能像“玩”游戏一样“玩”机器人，从而绕过 VLA 的重新训练陷阱和传统分层架构的脱节问题。\n\n### § 4 核心 Intuition\n\n先前方法要么把 VLM 拉低到连续动作回归（丧失语义泛化性），要么把 VLM 抬高到只做高层规划（脱离物理闭环）。这篇论文的核心 Intuition 是：通过设计一个离散的、语义化的动作空间（如“向前移动”、“抓取”），让 VLM 像玩电子游戏或操作 GUI 一样直接“玩”机器人。这个接口既保留了 VLM 原生的语义推理能力，又足够细粒度以实现闭环物理控制，同时通过一个简单的确定性解释器将语义动作映射到不同机器人的低级控制，从而解耦了模型与 embodiment。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\nLanguage ℓ ▼\n┌────────────┐◄── feedback\n│Perception  │ MultiView/Proprio\n└──────┬─────┘\n  c_t ▼\n┌────────────┐\n│Reasoning   │ Plan/Chunk/Step\n└──────┬─────┘\n  ctx ▼\n┌────────────┐ ZS:Frontier/FT:LoRA\n│VLM(3.2)    │ a_t∈A\n└──────┬─────┘\n       ▼\n┌────────────┐ Hist/Recovery\n│Action(3.3) │→g_E(3.2)→u_t\n│            │→Robot+Env\n└──────┬─────┘\n       └── loop ──┐\n```\n\n**Pipeline 步骤说明：**\n\n1. **Perception (Sec 3.3)**：输入为语言指令 ℓ、多视角观测 $o_t = (I_t, p_t)$（含 multi-view 图像与 proprioception）及交互历史 $h_t$。**Multi-View Guidance** 插件指导 VLM 区分全局视角与腕部视角的用途；**Proprioception** 插件将机器人夹爪高度、接触状态等转为文本反馈。输出为 reasoning-refined context $c_t$。\n\n2. **Reasoning (Sec 3.3)**：输入为 $c_t$。**Subtask Planning** 将任务分解为带视觉可检验完成条件的有序子任务；**Situated Planning** 延迟不确定决策至执行中证据出现时再规划；**Action Chunking** 在目标较远时允许开环执行短动作序列以减少模型调用；**Adaptive Step** 根据目标可见性动态切换粗/细步长；**Visual Prompt** 在语言难以指定交互区域时用视觉标记标注 affordance。输出为进一步精炼的决策上下文。\n\n3. **VLM Core (Sec 3.2, 3.4)**：输入为精炼后的上下文。VLM 从 semantic action space $\\mathcal{A}$ 中选择一个离散语义动作单元 $a_t$（如 MV_FWD、ROTATE_CW、GRASP 等）。支持两种模式：**ZS mode** 直接使用 frontier VLM（如 Gemini-3.1 Pro）进行 zero-shot 控制；**FT mode** 对小型开源 VLM（如 Qwen3.5-2B）用 LoRA 微调，通过 VLM 原生词表预测动作 token，无需专用 action head。\n\n4. **Action (Sec 3.3)**：输入为 $a_t$。**Action History** 携带最近五步动作作为轻量时序记忆，防止相反方向动作振荡；**Failure Recovery** 检测空抓取并触发重试（重置夹爪、回滚至抓取子任务）。\n\n5. **Interpreter $g_E$ (Sec 3.2)**：输入为 $a_t$ 和 interpreter 内部 setpoint state $s_t$。确定性地将语义单元映射为 6-DoF Cartesian pose 更新：平移动作沿 $R_E$ 映射后的方向移动 $\\sigma_t$ 距离，旋转动作绕指定轴旋转 $\\theta_t$ 角度，投影 $\\Pi_E$ 强制 workspace 安全约束。不同 embodiment（Franka 用 impedance control，AgileX 用逆运动学）实现同一语义空间，模型侧接口不变。\n\n6. **Robot + Env**：执行 $u_t$ 后产生新观测 $o_{t+1}$ 和执行状态，通过 feedback 回路返回 Perception 阶段，形成闭环 perception–reasoning–action 循环。\n\n**数据收集（GUMI, Sec 4）**：GUMI 是基于 GUI 的数据采集接口，将同一 semantic action space 暴露为键盘控件。人类可通过键盘\"玩\"机器人，frontier VLM 可通过浏览器界面自主采集，两者共享同一动作空间。每步记录执行前观测与语义动作对 $(o_t, a_t)$，因 interpreter 确定性映射，同一条 demonstration 可同时训练 semantic-action policy 和 continuous-control policy。支持跨 embodiment 复用和 human–agent 混合采集。\n\n---\n\n### § 6 核心数学推导\n\n论文的形式化围绕三个核心方程和一个 pose 更新公式展开，数学上简洁但设计意图明确。\n\n**Eq. 1 — 上下文精炼**：$c_t = \\mathcal{P}(o_t, h_t)$。其中 $\\mathcal{P}$ 是可配置的 reasoning plugins 集合，$o_t$ 是当前观测，$h_t$ 是交互历史。Intuition：原始传感器流不直接喂给 VLM，而是先经插件组过滤、结构化，生成 VLM 可自然推理的文本-图像上下文。\n\n**Eq. 2 — 语义动作选择**：$a_t \\sim \\text{VLM}(c_t)$，其中 $a_t \\in \\mathcal{A}$。VLM 在精炼上下文条件下从离散语义动作空间中选择一个单元。Intuition：将机器人控制 reformulate 为 VLM 擅长的离散选择问题，而非连续回归。\n\n**Eq. 3 — Embodiment grounding**：$u_t = g_E(a_t, s_t)$。Interpreter $g_E$ 将语义动作和当前 setpoint state 确定性地映射为可执行控制 $u_t$。Intuition：语义决策与物理执行解耦——VLM 负责\"做什么方向的运动\"，interpreter 负责\"在这个具体机器人上执行多少\"。\n\n**Eq. 4 — Pose 更新**：Setpoint $s_t = (\\mathbf{x}_t, Q_t)$，其中 $\\mathbf{x}_t \\in \\mathbb{R}^3$ 为位置，$Q_t \\in SO(3)$ 为朝向。平移时 $\\mathbf{x}_{t+1} = \\mathbf{x}_t + \\sigma_t \\cdot R_E \\cdot \\mathbf{d}_a$；旋转时 $Q_{t+1} = \\exp(\\theta_t [\\mathbf{r}_a]_\\times) \\cdot Q_t$。这里 $\\mathbf{d}_a$ 和 $\\mathbf{r}_a$ 分别编码平移和旋转方向（旋转时 $\\mathbf{d}_a = 0$，平移时 $\\mathbf{r}_a = 0$，否则 $\\mathbf{r}_a \\in \\{\\pm\\mathbf{e}_x, \\pm\\mathbf{e}_y, \\pm\\mathbf{e}_z\\}$），$[\\cdot]_\\times$ 是 skew-symmetric matrix 算子，$\\sigma_t$ 和 $\\theta_t$ 是校准后的平移/旋转步长，$R_E$ 将语义方向映射到 embodiment $E$ 的运动坐标系，$\\Pi_E$ 投影施加 workspace 和单步限位。Intuition：每个语义单元引发一个小而有界的 6-DoF pose 增量，通过 $R_E$ 实现跨 embodiment 的方向对齐，通过 $\\Pi_E$ 保证安全。\n\n**Eq. 5 — 微调损失**：$\\mathcal{L} = -\\sum \\log P(a_t \\mid \\ell, o, h; \\mathcal{P}_{\\min})$。在 minimal decision context（指令 $\\ell$、观测 $o$、短历史 $h$）下，最小化目标动作单元的 token-level cross-entropy。Intuition：语义动作通过 VLM 原生词表预测，无需专用 action head 或 special tokens，因此可用少量数据做 LoRA 低秩适配，同时保留预训练知识。\n\n---\n\n### § 7 实验设计与结论\n\n**问题 1：Show-Harness 能否在任务、环境和 embodiment 三个维度上实现泛化？**\n\n实验设计：在 Franka 7-DoF 单臂和 AgileX 6-DoF 双臂两个真实机器人平台上构建 10 个 pick-and-place 任务（5 种物体 × 2 种容器），其中 teddy bear 和 chess piece 在微调中未出现（OOD）。Cross-environment 测试背景、光照、视角、干扰物变化及 sim-to-real 迁移（仅用模拟数据训练、真实机器人评测）。Cross-embodiment 测试 Franka↔AgileX 迁移。对比三类 baseline：VLA（$\\pi_{0.5}$、GR00T）、VLA-centric agent（H-VLA、G-VLA）、Code-as-policy agent（CaP-X、RATS）。\n\n答案：ZS mode（Gemini-3.1 Pro）在 cross-task 平均成功率 89%，FT mode（Qwen3.5-2B）达 86%，均大幅领先所有 baseline（最高 57%）。Cross-environment 中 ZS 达 100%、FT 达 88%；sim-to-real 中 FT 用纯模拟数据达 65%，而 VLA baseline 完全失败（0%）。Cross-embodiment 中 ZS 和 FT 分别达 93% 和 87%，证明同一 semantic interface 可跨机器人迁移。\n\n**问题 2：Show-Harness 能否适应训练中未见过的新物理和语义需求？**\n\n实验设计：物理适应性方面，测试 fine-grained control（将 interpreter 步长从 2cm 降至 1cm，不做重训练）、action composition（组合两个正交平移为对角移动）、rotation extrapolation（训练仅含 0°/45°，测试未见过的 90° 朝向）、workspace shift（从核心 25% 扩展到边界 90% 区域）、multi-arm coordination（双臂协作清理桌面和传递物体）。语义适应性方面，测试 reasoning-intensive 任务（杯子下找方块、拼字母\"SHOW\"）和 video in-context learning（从人类或机器人演示视频学习放置顺序）。\n\n答案：物理适应性上，仅改 interpreter 步长即可将 fine-grained 任务成功率从 60% 提升至 82%（ZS），而 $\\pi_{0.5}$ 需额外精细训练才达 62%。Rotation extrapolation 中 FT 在未见 90° 朝向上达 70%，$\\pi_{0.5}$ 仅 20%。Workspace shift 中 Show-Harness 仅轻微下降，$\\pi_{0.5}$ 急剧退化。双臂 joint policy 消除碰撞并大幅提升成功率。语义适应性上，ZS with Situated Planning 在推理任务达 85%，$\\pi_{0.5}$ 仅 0–5%。Video in-context learning 中 ZS 在有演示时 20/20 成功，无演示时仅 20%。\n\n**问题 3：哪些组件对性能有贡献？接口设计的关键因素是什么？**\n\n实验设计：Ablation 逐项移除 9 个 harness plugins（leave-one-out），在 Franka 上用 ZS mode 评测 5 个 Plate 任务。另测试不同 frontier VLM backbone（Gemini、GPT、Claude）和 thinking effort 级别、不同 fine-tuned backbone 规模（0.8B–9B）、以及 action-space representation 的 2×2 设计（语义名/任意符号 × 有/无 convention 说明）。\n\n答案：每个 plugin 均有贡献——Multi-View Guidance 对小物体精确对齐最关键；Proprioception 在视觉信号模糊时提供可靠高度和接触信息；Subtask Planning 防止\"拖拽不抬起\"行为；Action Chunking 选择性使用可减少 19% 模型调用而不降成功率；Adaptive Step 平衡精度与效率；Visual Prompt 将 handle-aware grasping 从 40% 提升至 85%；Situated Planning 将 hidden-object search 从 35% 提升至 85%；Action History 防止方向振荡；Failure Recovery 将成功率从 72% 拉回 96%。Backbone 规模方面，2B 在精度与响应速度间取得最佳平衡。Action-space representation 方面，explicit convention 是 grounding 的主要来源，语义名作为有用先验；仅用任意符号且无 convention 时，模型无法从视觉变化推断动作效果（成功率仅 5%）。", "additional_insights": "### § 8 Take-aways\nShow-Harness 提出了一种 model-agnostic 的 Embodied Harness，通过将 robot control 转化为离散的 semantic action units（如 MV_FWD、GRASP），让 foundation VLMs 能够直接“玩”机器人。这些语义动作单元由 embodiment-specific interpreters 确定性地映射为底层局部物理运动，从而在保持 VLM 直接负责细粒度物理决策的同时，隔离了 embodiment-specific 的底层控制。该框架证明了无需额外模型容量或昂贵的 embodiment-specific pretraining，仅靠合适的 semantic interface 即可解锁 closed-source frontier VLMs 的 zero-shot 控制能力，并通过少量 GPU-hours 的 fine-tuning 适配 small-scale open-source VLMs。此外，基于该语义动作空间开发的 GUMI 接口，允许人类和 agents 在无需 specialized teleoperation hardware 的情况下，通过 GUI 跨 embodiment 收集 demonstrations。实验表明，配备 Show-Harness 的 VLM agents 在跨任务、跨环境和跨 embodiment 的泛化性上均优于代表性的 VLA 和 agentic paradigms。\n\n### § 9 最脆弱的假设\n该方法最脆弱的核心假设是：foundation VLMs 能够仅凭 2D 多视角图像和文本反馈，可靠且精确地推理出细粒度的空间关系，并通过逐步输出离散的 incremental steps（如 2cm 的 MV_FWD）完成精准的物理操作，而无需 continuous action regression 或精确的 3D 坐标映射。在实际中，这个假设极易不成立，因为 VLMs 的核心训练数据是基于互联网图文的语义理解，而非精确的几何或深度感知；当面对需要极高空间精度的任务（如 peg insertion 或抓取小尺寸 chess piece）时，VLM 极易在“稍微偏左还是偏右”的判断上产生振荡，或因深度估计失败导致抓取落空。论文为该假设提供的证据存在局限：虽然实验显示 zero-shot 和 fine-tuned 模式成功率较高，但 Ablation Studies 明确承认“errors concentrate on fine-grained grasping and placement”，且必须依赖 wrist view 提供近距离视觉证据和 Proprioception 提供高度/接触状态才能维持稳定。这意味着 VLM 的空间推理能力实际上被降级为了 2D 像素对齐问题，一旦脱离 wrist view 的近距离视野或遇到复杂 3D 几何遮挡，该假设将直接失效。\n\n### § 10 最小复现实验\n在 1 周时间内，可以设计一个最小复现实验来验证“frontier VLMs 能够通过 semantic action interface 实现 zero-shot robot control”这一核心 claim。使用 RoboSuite 或 ManiSkill 等标准机器人模拟器，构建一个简单的 block pick-and-place 任务。无需复现完整的 harness plugins，只需实现一个基础的 perception-action loop：捕获全局视角和 wrist 视角的 2D 图像，结合任务指令和离散动作词表（MV_FWD, MV_BACK, MV_LEFT, MV_RIGHT, MV_UP, MV_DOWN, GRASP, RELEASE, DONE），通过 API 调用 Gemini-3.1 Pro 或 GPT-4o，并将返回的单一动作 token 映射为模拟器中 end-effector 的 2cm 增量运动。测量指标包括 10 次随机初始化试验中的成功率、完成单次 episode 的平均步数以及动作振荡频率（连续输出相反动作的次数）。如果 VLM 在无 fine-tuning 的情况下能够达到 50% 以上的成功率并合理规划步骤，则支持了该 claim；若 VLM 陷入无限振荡、无法在 2D 图像中正确对齐夹爪与物体导致成功率低于 10%，则直接反驳了 frontier VLMs 仅凭原生语义推理即可驱动细粒度物理操作的核心假设。", "research_value": "### § 11 最强反例设计\n我会设计一个“Tight-Tolerance 3D Occluded Insertion”任务作为最强反例，直接攻击论文中“VLMs 能够仅凭 2D 多视角图像可靠推理细粒度空间关系”的核心假设。具体而言，在模拟器中构建一个需要精确 3D 深度对齐且存在严重视觉遮挡的插孔或 USB 插入任务，并刻意移除 wrist view 的近距离视野辅助，仅保留容易产生深度歧义的全局俯视视角。在这个设置下，VLM 将被迫从 2D 像素中推断未知的 3D 几何间隙，这超出了其基于互联网图文训练的语义理解能力。我预测 VLM 会在接触孔洞前陷入严重的动作振荡，或者在接触后因缺乏 force feedback 而无法判断插入深度，导致成功率断崖式下跌至接近 0%。这个反例提供了一个强有力的替代解释：Show-Harness 在常规任务上的成功，并非源于 VLM 真正掌握了细粒度的物理空间推理，而是因为 embodiment-specific interpreters 隐式地吸收了控制复杂性（例如 GRASP 可能包含自动对齐，MV_FWD 可能具有较大的容错边界）。一旦任务要求超出 interpreter 的确定性补偿范围且缺乏近距离视觉降级辅助，VLM 的“语义智能”将无法转化为物理控制力，暴露出离散语义动作在连续接触富集任务中的根本性缺陷。\n\n### § 12 Follow-up Research Idea\n基于 Show-Harness 依赖人工预定义且固定的 semantic action units 这一核心局限，我提出一个非增量的 follow-up idea：“Semantic Action Units 的逆向映射：从人类视频中自动发现任务特定的动作动词”。该想法的驱动需求在于，固定的动作词表（如 MV_FWD, GRASP）隐含假设了所有任务和 embodiment 都能被一套通用的离散动词覆盖，这导致其在面对非拟人化运动学或需要复杂连续形变的任务（如穿针引线、布料折叠）时必然失效。为解决这一问题，可以借鉴计算机视觉中 egocentric video action segmentation 与 hierarchical reinforcement learning 的方法，将动作空间的设计从“人工先验”转变为“数据驱动的语义发现”。第一个实验可以设计为“Action Vocabulary Auto-Discovery”：向 VLM 输入一段人类执行特定复杂任务的 egocentric 视频，要求 VLM 不仅理解任务目标，还要自动输出一组最能描述该任务关键状态转换的离散 semantic verbs（如 PINCH_COLLAR, FLIP_SLEEVE），随后利用大语言模型将这些自动发现的动词与特定机器人的底层 motor primitives 动态绑定，并在模拟器中测试这种自动生成的动作词表是否能比人工预定义的通用词表取得更高的任务成功率。与 Show-Harness 及现有 VLA 范式不同，本提议不再将动作词表视为固定的工程接口，而是将其视为一种可学习的、随任务和 embodiment 动态演化的语义 abstraction，从而将研究焦点从“VLM 如何在固定接口下推理”转移到“如何为 VLM 自动构建最合适的推理接口”。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yanzhe Chen\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Zechen Bai\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Zhijun Cao\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Wenzheng Zeng\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Kevin Qinghong Lin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yiqi Lin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Guoqiang Liang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Kevin Yuchen Ma\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Qiming Huang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Mike Zheng Shou\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Show Lab, NUS\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "基础 vision-language models (VLMs) 展现出关于世界的广泛智能，然而将这种智能转化为 robot control 仍然具有挑战性。我们提出了 Show-Harness，这是一种 Embodied Harness，它通过一个将意图与动作联系起来的紧凑 semantic interface，使 VLMs 能够“玩”机器人。Show-Harness 暴露出离散的 semantic action units，VLMs 可以自然地对其进行推理，而 embodiment-specific interpreters 则确定性地将它们 ground 到 local robot actions 中，从而使 VLM 直接负责细粒度的物理决策。通过同一 interface，Show-Harness 展示了以下两点的可行性：(1) 直接解锁 closed-source frontier VLMs 用于 zero-shot robot control，以及 (2) 仅需几个 GPU-hours 的 fine-tuning 即可调整 small-scale open-source VLMs 用于低成本部署。我们进一步开发了 GUMI (GUI Manipulation Interface)，它将相同的 semantic action space 扩展到基于 GUI 的 demonstration collection，允许人类和 agents 跨 embodiments “玩”机器人，而无需专门的 teleoperation hardware。大量实验表明，配备 Show-Harness 的 VLM agents 在任务、embodiments 和环境中均能稳健地泛化，优于具有代表性的 agentic 和 VLA paradigms。这些结果表明，正确的 interface 可以从基础 VLMs 中解锁大量的 embodied capability，而无需额外的模型容量或昂贵的 embodiment-specific pretraining。"}, {"title": "Can AI Agents Detect and Repair Artifact Drift in Network Experiments?", "arxiv_id": "2609.09849", "authors": "Tianzhu Zhang, Weichen Tao, Changgang Zheng, Yusheng Zheng, Long Chen, Xiaoyi Fan, Meikang Qiu", "summary": "In recent years, AI agents have evolved into capable assistants that carry out multi-step tasks in digital environments. The network systems community is beginning to explore these capabilities in operational and experimental settings. However, an agent operating in network systems should not be judged solely by whether it completes the immediate task. The experiment record it modifies must also remain trustworthy. We call this property artifact integrity: the record's claims must remain supported by the available evidence, confined to the scope established by that evidence, and traceable through the artifacts that encode their support. To make this property measurable, we introduce NetArtifactBench, which tests whether AI agents can repair inconsistent records derived from public network-system artifacts while preserving claims that remain supported. The benchmark contains 52 instances with injected inconsistencies ranging from direct contradictions to unstated relations spread across several artifacts. We evaluate 23 agent configurations across three general-purpose AI agent runtimes using deterministic scoring. The average contract pass rate is 65.3 % across 5,980 outputs, but no agent runtime exceeds 30 % when repair requires recovering implicit relations and propagating changes across artifacts. These results reveal a sharp boundary between local correction and complete record-level repair. Therefore, we argue that artifact integrity should become a first-class design and evaluation requirement for AI agents operating on network systems.", "category": "cs.AI", "cluster": "Embodied \u0026 GUI Agents", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了一个名为 NetArtifactBench 的评估基准，用于测试和评估 AI 智能体在多步任务中检测和修复不一致记录的能力。论文评估了多种智能体配置和运行时，揭示了智能体在局部纠正与完整记录级修复之间的能力边界和失败模式。根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。” 尽管该论文的应用场景设定在网络系统领域，但其本质是对通用 AI 智能体在复杂长程任务中行为能力的评估与诊断，直接有助于理解智能体的能力局限性，符合研究焦点中关于智能体评估的要求。因此，应予保留。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的研究问题是：当 AI agents 在网络实验中执行修复任务时，能否不仅完成即时操作目标，还能检测并修复 *artifact drift*——即实验记录与其底层证据之间的不一致——同时保留仍然有证据支持的 claims，从而使整个实验记录维持 *artifact integrity*。具体而言，记录中的每一条 claim 必须被可用证据支持、被证据确立的 scope 所约束，并通过编码该支持的 artifacts 保持可追溯。这个问题之所以重要，是因为 LLM-powered agents 正从静态网络自动化扩展到解释异构证据、通过工具作用于网络、并修改记录其行为与结果的 artifacts；当 agent 将一个实验的发现带入下一个实验时，该记录成为指导未来行动的状态的一部分，一个 unsupported claim 可能塑造新的假设、配置或测量，将局部不一致沿整条研究线传播。现有评估以 outcome 为中心，只能判断 agent 是否达成请求结果，无法揭示其修改的 artifacts 是否仍忠实于底层证据，因此 artifact integrity 在网络系统 AI agents 的评估中构成一个缺失维度。解决该问题使 record-level 的修复失败变得可测量、可比较，并为未来 autonomous networking 中 agent 的可信部署提供必要的评估基础。\n\n### § 2 前人工作与不足\n\n该问题此前未被解决。在网络领域，NetConfEval 和 VPP 评估 LLM 的配置生成与纠正能力，NetAssistant、LLexus、OSS-GPT、Confucius 和 ArachNet 支持多步诊断、运营和 Internet measurement 工作流，专用 benchmark 如 Cornetto 检查配置修复与回归、NIKA 重放动态事件、NetAgentBench 通过确定性状态机评估多轮配置——但这些工作的评估单元始终是即时配置、事件或工作流结果，而非 repair 是否恢复了 experiment record 内部的关系。网络外的 SWE-bench 评估仓库编辑是否解决软件 issue，FEVER 测试文本证据是否支持或反驳 claim，Artisan 评估复现已发表结果的脚本，ArtifactCopilot 自动化 artifact 执行的环境设置与恢复，它们分别针对 issue resolution、claim classification、result reproduction 和 successful execution，均不评估 repair 是否使整个网络实验记录保持 coherent、traceable 且不损害 supported claims。这一缺口并非简单的\"prior work 没有考虑 record-level consistency\"，而是因为 artifact integrity 作为跨 artifacts 的 record-level 属性此前未被显式形式化：现有 benchmark 将 correctness 视为 file-local checks 的集合，而 claim、evidence、scope、provenance 与 experimental phase 之间的关系需要被建模为图结构——即 Claim–Evidence–Scope Model——才能被确定性评测，这一概念框架以及与之配套的 machine-auditable scoring contract 在 prior work 中均不存在，导致即使 agent 产生了 residual inconsistency、unsupported replacement、support damage、lost traceability 或 invalid package 等失败，现有评估也无法检测。", "core_insight": "### § 3 重建作者的思考路径\n\n随着 LLM 驱动的 AI agents 逐渐介入网络系统的运营与实验，网络自动化正从静态过程转向 intent-driven 和闭环控制。研究者自然会关注这些 agent 能否准确完成诊断、配置等任务，现有的 benchmark（如 NetAgentBench、Cornetto）也确实在衡量任务结果的正确性。然而，当一个 agent 在执行任务时，它会修改配置、日志和报告，这些文件共同构成了网络实验记录。如果仅仅关注任务是否完成，我们可能会忽略一个关键问题：agent 修改后的记录是否仍然忠实于底层的证据？借鉴科学 artifact 的 research-object models 和数据库 provenance 理论，实验记录本质上是一个由 claims、evidence、scope constraints 和 provenance relations 构成的图。如果 agent 只是在局部文件中纠正了某个矛盾，而没有在整个图中传播这一更改，就会产生“artifact drift”——记录内部不一致或声明失去了证据支持。通过观察 agent 在实际操作中的表现，可以发现它们经常犯五种错误：留下 residual inconsistency、用无支持的声明替换原声明、造成 support damage、丢失 traceability 以及返回 invalid package。这些 failure modes 表明，agent 能够进行局部修正，却无法维护记录级别的全局一致性。因此，评估 AI agents 在网络系统中的表现，必须引入一个新的维度：artifact integrity，即不仅要求修复直接矛盾，还要确保所有声明有证据支持、受范围限制且可追溯。\n\n### § 4 核心 Intuition\n\n网络实验记录并非孤立文件的堆砌，而是一张由 claims、evidence、scope 与 provenance 交织而成的图。现有的 AI agent 评估只盯着局部任务的成败，却忽略了 agent 修改后整张图的一致性与可追溯性，导致 artifact drift。要让 agent 真正可靠，就必须将 artifact integrity 作为首要评估标准，强制它们在修复局部错误时，跨 artifact 传播更改并保留有证据支持的 claims，从而维护整个实验记录的图结构完整性。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+-----------------------+   +-----------------------+\n| Public Repositories   |   | Hidden Oracle        |\n| (Batfish, Zeek, P4C,  |   | Annotations           |\n|  Open vSwitch)        |   +-----------+-----------+\n+----------+------------+               |\n           |                            |\n+----------v------------+               |\n| Instance Builder      |               |\n| (Assemble package,    |               |\n|  Inject mutation)     |               |\n+----------+------------+               |\n           |                            |\n+----------v------------+               |\n| Frozen Instance       |               |\n| Package + Contract    |               |\n+----------+------------+               |\n           |                            |\n+----------v------------+               |\n| Agent Runtime         |               |\n| (Codex/Cursor/Open)   |               |\n| (Fresh Workspace)     |               |\n+----------+------------+               |\n           |                            |\n+----------v------------+               |\n| Returned Repair       |               |\n+----------+------------+               |\n           |                            |\n+----------v------------+               |\n| Deterministic Scorer  |\u003C--------------+\n| (Check obligations)   |\n+----------+------------+\n           |\n+----------v------------+\n| Metrics \u0026 Contract    |\n| Pass/Fail Decision    |\n+-----------------------+\n```\n\n本论文属于基准测试论文，无模型训练阶段，核心 pipeline 包含数据准备、Agent 推理与确定性评测三个阶段：\n\n1. **Instance Construction (Section 4.1)**: 输入为公开网络系统仓库（如 Batfish, Zeek 等）的测试、追踪和状态数据。具体操作是将这些源数据组装成连贯的 experiment package，随后注入受控的 inconsistency (declared mutation) 以破坏特定的 claim-evidence 关系，同时保留原本有效的 claims。经过验证后，实例被冻结。输出为 Frozen Instance Package 和公开的 Task Contract。此阶段确立了评测的基准真值。\n\n2. **Isolated Agent Execution (Section 4.2, 5)**: 输入为 Frozen Instance Package 和 Task Contract。在推理阶段，AI agent runtime（如 Codex, Cursor, OpenCode）在每次执行时获得一个全新的工作空间。Agent 需识别被破坏的关系，在受影响的多个 artifacts 间传播修正，保留仍有证据支持的 claims，并返回可解析、可溯源的 artifacts。输出为 Returned Repair。\n\n3. **Contract Evaluation (Section 4.2)**: 输入为 Returned Repair 以及不暴露给 Agent 的 Hidden Oracle Annotations。在评测阶段，Deterministic scorer 严格检查输出是否满足所有 contract 义务，包括 diagnosis、repair completion、label decisions、preservation、parseability 和 traceability。输出为 Recall、Repair、Label 等细粒度 metrics 以及最终的 Contract pass/fail 决定。\n\n### § 6 核心数学推导\n\n论文在 Section 3 (Claim–Evidence–Scope Model) 中提出了形式化的 artifact integrity 判定条件。虽然原文的具体数学公式因图片省略而无法完整呈现，但基于正文描述，其核心逻辑推导如下：\n\n对于给定的 claim $c$，令 $P_c[+]$ 表示支持该 claim 的所有有效公共支持路径集合，$ctx(p)$ 表示路径 $p$ 有效时的条件上下文，$scope_{eff}(c)$ 表示应用了显式且一致的局限性后 claim 所声称的有效范围。Claim $c$ 满足 artifact integrity 的充要条件是：必须存在至少一条路径 $p \\in P_c[+]$，使得 $ctx(p)$ 能够完全覆盖 $scope_{eff}(c)$。\n\n**Intuition**: 这个模型将实验记录视为一个由 claims、evidence、scope 和 provenance 构成的图。一个 claim 是否“成立”，不取决于单条证据的表面匹配，而取决于是否存在一条从 evidence 到 claim 的逻辑通路，且这条通路的前提条件（如查询范围、实验阶段）必须大于或等于 claim 自身声明的适用范围。这从数学上杜绝了 agent 将局部证据过度泛化为全局结论的失败模式。\n\n### § 7 实验设计与结论\n\n**提出了什么问题**：论文围绕 AI agent 修复网络实验记录的能力提出了三个研究问题：RQ1 探究当前 general-purpose AI agents 能在多大程度上恢复 artifact integrity；RQ2 探究当任务在 artifacts 之间施加越来越复杂的关系时，修复可靠性如何变化；RQ3 探究当前的 artifact-integrity 修复在哪些具体方面仍然不可靠。\n\n**设计了什么实验验证这个问题**：研究者构建了 23 个 agent configurations（基于 Codex CLI, Cursor Agent, OpenCode 三种 runtime），在 NetArtifactBench 的 52 个 instances 上进行测试。每个配置在每个 instance 上独立执行 5 次，共产生 5,980 个 evaluable outputs。评测采用 deterministic scoring，不仅统计总体的 contract pass rate，还按 5 个 structural tiers（从直接矛盾修正到跨 artifact 隐式关系推断）分层分析，并详细追踪了 partial contract completion、failure flags 以及 run-to-run instability 等细粒度指标。\n\n**问题的答案是什么**：对于 RQ1，总体 contract pass rate 为 65.3%，但不同 runtime 差异显著，说明现有 agents 无法可靠地恢复 artifact integrity。对于 RQ2，随着 structural tier 从 1 升至 5，所有 runtime 的 pass rate 均急剧下降（例如 Codex 从 98.9% 跌至 26.3%），揭示了 agents 在处理跨 artifact 的隐式关系和协同变更时存在严重能力瓶颈。对于 RQ3，实验发现 agents 经常只完成部分修复义务而无法通过完整 contract，且同一配置在多次执行中表现出 run-to-run instability，证明局部的正确性并不能保证实验记录的完整性与可审计性。", "additional_insights": "### § 8 Take-aways\n本文提出了 artifact integrity 的概念，指出 AI agents 在网络实验中的评估不应仅局限于任务是否完成，还应包括其修改的实验记录是否始终有证据支撑、受限于证据范围且可追溯。为量化这一属性，作者引入了 NetArtifactBench，包含 52 个源自真实网络工具（Batfish, Zeek, P4C, Open vSwitch）的测试实例，要求 agent 在修复注入的不一致性时必须保留仍受支持的声明。通过对 23 种 agent configurations 进行 5,980 次评估，发现平均 contract pass rate 仅为 65.3%，且在需要恢复隐含关系和跨 artifact 传播修改的复杂任务（Tier 4-5）中，成功率骤降至 30% 以下。论文总结了五种主要的修复失败模式，包括 residual inconsistency、unsupported replacement、support damage、lost traceability 和 invalid package，揭示了局部修正与完整记录级修复之间的严格界限。作者据此主张，artifact integrity 必须成为网络系统 AI agent 的一级设计和评估要求。\n\n### § 9 最脆弱的假设\n本文最核心且失败代价最大的假设是：通过 deterministic scoring 和严格的格式匹配（如 exact preservation of required public claim identifiers）能够准确衡量 agent 是否恢复了 artifact integrity。这个假设在实际中极易不成立，因为 LLM 生成的自然语言或结构化输出往往具有语义等价但表述不同的特性。如果 agent 以不同的有效格式或措辞正确修复了 claim-evidence 关系，但未使用预期的精确标识符或结构，deterministic scorer 会将其误判为失败。这会导致论文严重低估 agent 的真实推理和修复能力。论文中提到“human-readable audit report must be present, but its prose is not scored”，且在 Future work 中承认需要研究“more permissive semantic evaluation”，这实际上暗示了当前基于精确匹配的评估方法存在局限。如果该假设不成立，论文得出“agents 无法可靠恢复 artifact integrity”的结论可能只是“agents 无法稳定生成符合极其严格的机器解析协议的输出”，而非其本质上缺乏跨 artifact 的逻辑推理能力。\n\n### § 10 最小复现实验\n在一周时间内，可以设计一个最小实验来验证论文中“AI agents 在处理跨 artifact 隐含关系（Tier 5）时修复能力急剧下降”这一核心发现。从 NetArtifactBench 的公开仓库中提取 2-3 个 Tier 5 的实例（例如涉及 programmable data-plane metadata 的 join 任务），这些实例自带 public package 和 task contract。无需复现完整的自动化评分系统，直接使用当前主流的 agent runtime（如 Cursor Agent 配合 Claude Sonnet 5 或 Codex CLI 配合 GPT-5.5）对这些实例进行 10 次独立修复尝试。收集返回的 repaired package 后，人工审查这些输出是否成功推断出未明确声明的跨表关系、是否在所有相关文件中传播了修改，以及是否保留了受保护的声明。如果超过 70% 的输出在跨 artifact 推理时出现 unsupported replacement 或 lost traceability，则支持论文的 claim；如果 agent 能够通过语义推理正确修复逻辑关系，仅仅是因为输出格式不符合 deterministic scorer 的严格要求而被判错，则反驳了论文关于 agent 缺乏深层修复能力的结论，并暴露出其评估方法的局限性。", "research_value": "### § 11 最强反例设计\n如果我要对这篇论文发起最强有力的攻击，我会直接针对其 deterministic scoring 机制构建一个“语义等价但格式偏离”的反例实验，以此提出对核心结果的替代解释：论文观测到的 Tier 4-5 任务低于 30% 的成功率并非源于 AI agents 缺乏跨 artifact 的深层逻辑推理能力，而是由于评估系统对自然语言和结构化输出的刚性格式惩罚。具体而言，我会从 NetArtifactBench 的 Tier 5 实例中提取需要恢复隐含跨表关系的任务，让主流 agent runtime（如 GPT-5.5 或 Claude Sonnet 5）生成修复后的 package。接着，我不使用论文的 deterministic scorer，而是引入一个“语义图同构”评估层：将 agent 输出的 claims、evidence 和 scope 提取为一个异构图，仅检验其逻辑拓扑结构是否与标准答案等价，而不要求保留特定的 public claim identifiers 或精确的 prose 措辞。我预测，在放宽 exact string matching 的限制后，只要 agent 能够以语义等价的方式重建 Claim–Evidence–Scope Model，其 Tier 5 的逻辑修复成功率将跃升至 70% 以上。在真实世界的网络实验场景中，人类工程师在维护实验记录时极少使用完全一致的标识符或机器可解析的僵化格式，而是依赖上下文语义来维持 artifact integrity。如果这个反例成立，就证明了论文的 benchmark 实际上是在测量“LLM 输出对严格机器解析协议的服从度”，而非“agent 恢复 artifact drift 的认知能力”，从而彻底推翻其关于 agents 无法可靠进行 record-level repair 的结论。\n\n### § 12 Follow-up Research Idea\n基于论文在评估机制上的根本局限，我提出一个非增量的 follow-up 研究方向：从“事后静态修复”转向“运行时溯源约束生成”，即构建 Provenance-Constrained Agent Generation 框架。该想法的驱动局限在于，当前 NetArtifactBench 将 artifact integrity 视为一种需要被事后修复的静态属性，这本质上陷入了“先破坏再测量”的范式陷阱，且不可避免地受到评估系统格式偏好的干扰；真实需求是防止 agent 在执行多步网络实验时引入 drift。为解决这一问题，我们可以借鉴软件工程中的 Formal Methods 与 Knowledge Representation 领域的 Description Logics，将 Claim–Evidence–Scope Model 从一个事后评测标准转化为 agent 运行时的前置约束。具体做法是，在 agent runtime 中嵌入一个轻量级的 provenance tracker，每当 agent 调用网络工具（如 Batfish 或 Zeek）并试图生成新的 claim 或修改 artifact 时，系统实时构建一个基于 RDF/SPARQL 的逻辑图，并通过 formal verification 验证该新 claim 是否在当前 evidence 的 scope 闭包内。第一个实验将设计一个动态网络诊断任务：控制组使用标准的 generate-then-validate agent，实验组使用 provenance-constrained agent，在任务执行中途注入网络拓扑变更。我们将不再测量最终 package 的格式合规率，而是对比两组在任务执行过程中产生 unsupported claims 的累积速率，以及在面对突发状态变更时 scope 追溯链断裂的频率。这一提议彻底区别于现有工作，因为它不再追求构建更庞大的事后 benchmark，而是将 artifact integrity 编码为 agent 推理过程中的硬性逻辑约束，从而在根本上消除 artifact drift 的产生机制。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Tianzhu Zhang\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Yusheng Zheng\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Weichen Tao\", \"affiliations\": [3], \"markers\": [\"*\"]},\n    {\"name\": \"Long Chen\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Changgang Zheng\", \"affiliations\": [5], \"markers\": [\"*\"]},\n    {\"name\": \"Xiaoyi Fan\", \"affiliations\": [6], \"markers\": []},\n    {\"name\": \"Meikang Qiu\", \"affiliations\": [7], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Nokia Bell Labs\"},\n    {\"id\": 2, \"name\": \"University of California, Santa Cruz\"},\n    {\"id\": 3, \"name\": \"Telecom Paris\"},\n    {\"id\": 4, \"name\": \"The University of Hong Kong\"},\n    {\"id\": 5, \"name\": \"Nanjing University\"},\n    {\"id\": 6, \"name\": \"Tsinghua University\"},\n    {\"id\": 7, \"name\": \"Augusta University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution.\"}\n  ]\n}\n```", "summary_translation": "近年来，AI agents 已经发展成为能够在数字环境中执行多步任务的得力助手。网络系统社区正开始在运维和实验环境中探索这些能力。然而，对于在网络系统中运行的 agent，不应仅仅根据其是否完成了即时任务来评判。其修改的实验记录也必须保持可信。我们将这一属性称为 artifact integrity：记录中的声明必须保持有可用证据的支持，限制在该证据所确立的范围内，并且能够通过编码其支持依据的 artifacts 进行追溯。为了使这一属性可衡量，我们引入了 NetArtifactBench，用于测试 AI agents 是否能够修复源自公共网络系统 artifacts 的不一致记录，同时保留仍有证据支持的声明。该 benchmark 包含 52 个实例，其中注入了从直接矛盾到分布在多个 artifacts 中的未声明关系等不一致情况。我们使用确定性评分评估了跨三个通用 AI agent runtimes 的 23 种 agent configurations。在 5,980 个输出中，平均 contract pass rate 为 65.3%，但当修复需要恢复隐式关系并在 artifacts 之间传播更改时，没有任何 agent runtime 超过 30%。这些结果揭示了局部修正与完整的记录级修复之间的明显界限。因此，我们认为 artifact integrity 应成为在网络系统上运行的 AI agents 的一等设计和评估要求。"}]}, {"name": "RL \u0026 Optimization for Agents", "count": 3, "papers": [{"title": "SocialRL: Refining LLMs' Social Intelligence through Multi-turn Reinforcement Learning and Reward Design", "arxiv_id": "2609.09764", "authors": "Jianing Wang, Xintao Wang, Aili Chen, Jie Shi, Hongcheng Guo, Jun Gao, Wenxuan Zhao, Chengkun Lang, Yuanli Guo, Yanghua Xiao", "summary": "Social intelligence enables agents to read social context, infer intent, and adapt over sustained dialogue. As language models become autonomous collaborators, it is central to building effective and trustworthy human-AI interaction. Existing reinforcement learning methods optimize single-turn utterances and sparse outcome rewards, producing short-sighted policies that struggle to manage goal-relationship tensions across multi-turn interactions. We propose SocialRL, a multi-turn reinforcement learning framework addressing both challenges. First, we apply multi-turn reinforcement learning using PPO that propagates delayed outcome rewards back to each turn, enabling long-horizon planning. Second, we design six process reward dimensions capturing the goal-relationship trade-off, including goal advancement, relational attunement, contextual coherence, etc. A reward model dynamically generates fine-grained scoring criteria for each dimension, while a stage-aware weight schedule prioritizes relationship-building in early turns, goal advancement mid-way, and balanced closure late. Across multiple social-dialogue benchmarks, SocialRL improves Goal Achievement by an average of 9.2 percentage points over the corresponding Base models. These results demonstrate the effectiveness of SocialRL across synthetic and real social scenes, as well as standard and challenging social scenarios.", "category": "cs.CL", "cluster": "RL \u0026 Optimization for Agents", "tags": ["cs.CL"], "filter_reason": "这篇论文提出了 SocialRL，一个多轮强化学习框架，旨在通过 PPO 和精心设计的过程奖励机制来提升 LLM 的社交智能。论文的核心贡献在于解决智能体在长期多轮交互中的策略优化问题，特别是通过传播延迟奖励来实现长期规划，并动态调整目标推进与关系建立之间的权衡。\n\n这符合筛选标准中第一步的“保留”规则：论文研究了 agent training/RL，并且摘要明确指向了智能体能力（\"agents\", \"autonomous collaborators\", \"long-horizon planning\"）。它属于通过训练方法改进 LLM 智能体在复杂交互环境中的能力，契合“单智能体”方向中的规划和自我适应，以及智能体训练的前沿研究。虽然摘要中提到了 \"trustworthy human-AI interaction\"，但这只是研究背景，论文的实质贡献是强化学习框架和奖励设计机制，而非纯粹的安全或对齐研究，因此不触发安全相关的排除规则。综上所述，该论文与构建和改进 LLM 智能体的研究目标高度相关。", "intro_logic": "### § 1 研究问题与重要性\n\n本文解决的核心问题是：如何让 LLM 在多轮社交对话中同时优化**目标达成**（goal achievement）与**关系维护**（relationship maintenance），而非顾此失彼。社交对话具有一个根本性张力——agent 既要推进自身的私有社交目标（如请求帮助、谈判条件），又不能损害与对话方的信任与好感。这一张力贯穿整个对话：每一轮话语都会同时改变目标进度和关系质量，且二者的相对重要性随对话阶段动态变化——早期需要建立 rapport，中期需要推进 goal，晚期需要平衡收尾与关系保全。该问题之所以重要，是因为 LLM 正从信息系统转变为自主协作 agent，社交智能直接决定 AI 能否与人类进行深度协作并获得信任。现有 RL 方法要么优化单轮话语的局部流畅性，要么依赖对话结束时的稀疏 outcome reward，二者都无法为 agent 提供 long-horizon planning 所需的密集过程信号，导致策略短视——要么为维持关系而放弃目标，要么为达成目标而损害关系。SocialRL 通过 multi-turn trajectory optimization 和 multi-dimensional dynamic process reward 同时解决这两个缺陷，在四个 benchmark 上将 Goal Achievement 平均提升 9.2 个百分点，且不牺牲 Relationship Change。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决。现有方法可分为三类，各有结构性缺陷。**单轮强化学习方法**以 Sotopia-RL（使用 GRPO）为代表，将每轮话语独立优化，忽略了社交对话的顺序依赖性——早期轮次的妥协或坚持会塑造后续谈判、修复或失败的状态分布，单轮优化无法捕捉这种累积效应。**结果奖励训练方法**以 ArCHer 为代表，使用 macro-level value function 学习高层回报，但 10–20 轮对话中仅靠最终 outcome score 无法为中间轮次如何管理 goal-relationship tradeoff 提供直接监督，导致 value estimation 方差过高且缺乏过程级梯度信号。**非在线方法**包括 BC（行为克隆，受限于 expert trajectory 的数据覆盖）、SDPO（segment-level preference optimization，使用静态偏好对无法适应开放式对话中动态变化的目标优先级）、ARIA（intention-space reward aggregation，仍是事后归因而非在线优化）和 SAVOIR（通过 Shapley value 归因多轮结果到单轮，但 post-hoc attribution 无法替代在线 value learning）。这些方法之所以未考虑 multi-turn trajectory optimization 与 dense process reward 的结合，根本原因在于社交对话的奖励具有**延迟性**和**强状态依赖性**：同一 turn index 可能对应谈判、修复、妥协或失败等截然不同的对话状态，GRPO 的 group-level baseline 无法区分这些状态，而 PPO 的 state-dependent value baseline 可以。论文在 Appendix A 中从理论上证明，GRPO 的 baseline mismatch 项 $\\Delta_M = \\sum_{m=1}^{M} \\mathbb{E}[\\|U_m\\|^2 \\delta V_m^2]$ 随对话轮数 $M$ 线性增长，导致 gradient SNR 持续下降，而 PPO 仅累积 intrinsic per-turn variance，不引入额外的 baseline mismatch。此外，没有任何前人方法显式建模社交对话质量的**阶段依赖结构**——即 goal 与 relation 的相对权重应在对话早期、中期、晚期动态调整，这一设计基于 Bales 的 Interaction Process Analysis 和 Knapp 的 relational stage model，是 SocialRL 独有的贡献。", "core_insight": "### § 3 重建作者的思考路径\n\n从社交对话的 sequential 特性出发，作者观察到 meaningful outcomes（goal achievement 和 relationship quality）只在对话结束时显现，这天然适合 RL 的 delayed feedback 框架。然而，现有 RL 方法存在根本缺陷：Single-turn RL（如 SotopiaRL）将每轮 utterance 独立优化，忽略早期行动对后续社交结果的累积影响，产生 locally fluent 但 globally short-sighted 的策略；Outcome reward training（如 ArCHer）虽用最终分数指导学习，但 sparse feedback 无法为 10-20 轮的中间社交行为提供有效监督。更深层的问题在于，社交对话的 reward 是 delayed 且 strongly state-dependent 的——相同 turn index 可能对应 negotiation、repair、compromise 或 failure 等截然不同的状态。作者从理论分析中发现，GRPO 的 group-level baseline 在这种状态下与 state-dependent value 产生 mismatch，在长 horizon 下累积额外方差，而 PPO 的 state-only baseline 天然适配这种状态依赖性。在 reward 设计上，作者借鉴 goal-setting theory、relationship maintenance theory 和 conversation analysis，认识到社交质量需分解为 goal-side（goal advancement, strategic positioning）、relationship-side（relational attunement, persona consistency）及 enabling conditions（contextual coherence, turn quality）等多维度。同时，Bales's Interaction Process Analysis 和 Knapp's relational stage model 揭示这些维度的相对重要性随对话阶段演变：早期建立关系，中期推进目标，晚期平衡收尾。这些线索共同指向一个方案：以 PPO 优化完整多轮轨迹，辅以 dense、multi-dimensional process rewards 和 stage-aware weight schedule，让 agent 在每一轮都能获得具体的社交行为指导。\n\n### § 4 核心 Intuition\n\n社交对话的核心矛盾是 goal pursuit 与 relationship management 之间的动态张力，而现有方法要么只优化单轮导致短视，要么只依赖最终结果导致 sparse feedback，都无法指导中间轮次如何平衡这一张力。SocialRL 的核心 Intuition 是：将多轮对话作为完整轨迹用 PPO 优化以实现 long-horizon planning，同时为每一轮提供 dense、multi-dimensional process rewards——这些 reward 分解出 goal 和 relationship 的具体维度，并根据对话阶段动态调整权重，让 agent 在每一轮都明确\"此刻该优先推进目标还是维护关系\"。", "methodology": "§ 5 具体方法与完整 Pipeline\n\n```text\n[Multi-turn Dialogue Trajectory]\n         |\n         v\n+----------------+  utterance/turn  +----------------+\n| PPO Policy Net |-----------------\u003E| Reward Model   |\n| (online train) |                  | 6 Process Dims:|\n+----------------+                  | Goal(2) Rel(2) |\n         ^                          | Enabling(2)    |\n         |                          +----------------+\n         | PPO update                       |\n         |                    dynamic criteria\n         |                    + stage weights\n         |                             |\n         |                             v\n         |                    +----------------+\n         |\u003C--- turn rewards ---| Weighted Turn  |\n         |                    | Reward          |\n         |                    +----------------+\n         v\n+----------------+\n| Value Network  |\n| (turn returns) |\n+----------------+\n```\n\n**节点 1 — PPO Policy Net（在线策略网络）**\n将完整多轮对话轨迹作为优化单元，使用 PPO 进行在线训练。Policy 在每一轮生成 utterance，Value Network 从 turn-level reward 序列中估计 returns，使策略能在完整对话 horizon 上同时优化 goal pursuit 与 relationship maintenance，而非孤立优化单轮响应。\n\n**节点 2 — Reward Model（六维过程奖励模型）**\n将 goal-relationship trade-off 分解为六个 process reward 维度：\n- **Goal side**：goal advancement（目标推进度）、strategic positioning（策略定位）\n- **Relationship side**：relational attunement（关系协调度）、persona consistency（人设一致性）\n- **Enabling conditions**：contextual coherence（上下文连贯性）、turn quality（轮次质量）\n\nReward model 在每轮对话后为每个维度动态生成 context-specific scoring criteria（细粒度评分标准），而非使用固定 rubric。\n\n**节点 3 — Stage-aware Weight Schedule（阶段感知权重调度）**\n根据对话阶段动态调整六个维度的相对权重，基于 Bales's Interaction Process Analysis 和 Knapp's relational stage model：\n- **早期轮次**：优先 relationship-building（关系建立）\n- **中期轮次**：优先 goal advancement（目标推进）\n- **晚期轮次**：balanced closure（平衡收尾与关系保全）\n\n加权后输出每轮的 weighted turn-level reward，作为 Value Network 的输入信号。\n\n**节点 4 — Value Network 与 PPO Update**\nValue Network 基于 turn-level reward 序列估计各轮 return，PPO 利用 policy loss 和 value loss 同时更新 policy 和 value network。Delayed outcome rewards 通过 value estimation 传播回每一轮，为中间社交行为提供密集的过程级梯度信号。\n\n§ 7 实验设计与结论\n\n**核心问题**：SocialRL 能否在多轮社交对话中同时提升 Goal Achievement 和 Relationship Change，且优于单轮 RL 和 outcome reward 方法？\n\n**实验设计**：\n- **Benchmark**：在 SOTOPIA、SOTOPIA-π、AgentSense 三个社交对话 benchmark 上进行大规模实验，覆盖合成与真实社交场景、标准与高难度社交场景。将 [0, 10] 的 SOTOPIA-All 和 SOTOPIA-Hard 分数对齐到百分点单位。\n- **Base model**：Qwen2.5-7B（据 Figure 1），opponent model 为 GPT-5.5。\n- **对比方法**：Behavior Cloning、Single-turn RL（如 SotopiaRL）、Outcome-only reward（如 ArCHer）。\n- **评估指标**：Goal Achievement（目标达成率）和 Relationship Change（关系变化值）。\n\n**结论**：\n- SocialRL 在四个 benchmark 上将 Goal Achievement 平均提升 **9.2 个百分点**，且不牺牲 Relationship Change。\n- 在 SOTOPIA-π 上（据 Figure 1），Goal success 从 52.5 提升至 63.3（+10.8%），Rel. change 从 45.8 提升至 51.6（+5.8 x100），证明多轮轨迹优化与多维过程奖励能同时改善目标推进与关系维护。\n- 在 OOD benchmark AgentSense 上（据 Figure 1），Goal success 达 71.7%，Rel. change 达 58.9，表明 SocialRL 的社交智能可迁移至未见过的社交场景。\n\n**注**：论文正文截取部分未提供完整的 ablation 实验细节、六维 reward 各维度的独立贡献分析，以及 stage-aware weight schedule 的消融结果。上述结论基于摘要、引言和 Figure 1 中可确认的数据。", "additional_insights": "### § 8 Take-aways\nSocialRL 提出了一个多轮强化学习框架，通过 PPO 将延迟的 outcome rewards 传播回每一轮，解决了现有单轮 RL 或仅依赖 outcome reward 方法在长程社交对话中的短视问题。该框架设计了六个维度的 process rewards（goal advancement, strategic positioning, relational attunement, persona consistency, contextual coherence, turn quality），以细粒度地捕捉社交对话中目标推进与关系维护之间的权衡。通过引入 stage-aware weight schedule，模型能够在对话早期侧重关系建立，中期侧重目标推进，晚期侧重平衡收尾。实验表明，在 SOTOPIA-π 等四个基准上，SocialRL 相比 Base models 在 Goal Achievement 上平均提升了 9.2 个百分点，且未牺牲 Relationship Change。理论分析与消融实验证明，在多轮社交对话中，PPO 的 state-dependent baseline 比 GRPO 的 group-level baseline 更能有效减少梯度方差，从而更适合延迟且强状态依赖的社交奖励。\n\n### § 9 最脆弱的假设\nSocialRL 最核心且失败代价最大的假设是：LLM-based reward model 能够动态生成 context-specific 的 rubric，并对每一轮对话的六个社交维度做出准确且一致的 pass/fail 判断。如果这个假设不成立，整个多轮 RL 训练的优化方向就会偏移，模型不仅无法学会长程社交策略，反而可能因为错误的 reward 信号而产生 over-compromise 或生硬推进目标等行为。在实际中，社交对话的评估高度主观且依赖微妙的上下文线索（如隐性拒绝、讽刺、面子维护），LLM-as-a-judge 在处理这些复杂社交张力时极易产生幻觉或刻板判断。论文虽然提供了 human alignment evaluation，但仅基于 100 条轨迹和 497 条 turn-level 记录，且报告的高相关性（0.816）可能掩盖了在特定困难场景（如 SOTOPIA-Hard 中的高冲突情境）下 reward model 失效的风险。论文缺少对 reward model 在极端冲突或高度模糊对话中鲁棒性的系统分析，如果 reward model 在这些场景下给出系统性偏差的分数，核心贡献将直接失效。\n\n### § 10 最小复现实验\n在一周时间内，可以设计一个最小复现实验来验证“多维度 process reward 设计的有效性及其与人类判断的对齐度”，而无需复现完整的 RL 训练流程。首先，从 SOTOPIA-π 测试集中抽取 50 个包含目标冲突或关系张力的多轮对话轨迹。然后，实现论文中的 Process Reward Model (PRM) prompt（Figure 4），使用 Qwen3.5-35B 作为 reward model，对这 50 个轨迹的每一轮生成 rubric 并计算六个维度的 pass rate。接着，邀请 3 位人类标注者对相同的 turn-level 行为进行盲评，使用相同的 rubric 维度进行打分。测量 PRM 分数与人类评分之间的 Spearman 或 Pearson 相关系数，重点关注 relational attunement 和 strategic positioning 这两个最主观的维度。如果整体相关性显著高于 0.7，且在困难场景下未出现系统性偏差，则支持了论文的 claim；如果相关性低于 0.5 或在某些维度上严重偏离人类判断，则反驳了该 claim，表明 RL 训练可能建立在不可靠的奖励信号之上。", "research_value": "### § 11 最强反例设计\n针对 SocialRL 最致命的结构性缺陷在于其硬编码的 stage-aware weight schedule 与真实社交互动中非线性动态的冲突。我会设计一个“突发危机与非线性社交轨迹”实验场景来挑战其有效性。在这个场景中，对话初期（如 turn 1-2）就爆发了高强度冲突或面临紧急止损需求，agent 必须立即强硬推进 goal（如阻止对方违约或终止危险行为）而根本无暇进行 rapport-building。由于 SocialRL 在早期轮次强制赋予 relational attunement 更高权重，它会系统性地惩罚这种正确的紧急干预策略，导致模型在危机时刻表现出不合时宜的妥协或拖延，产生可预测的灾难性失败。此外，对于论文声称的 9.2 个百分点的 Goal Achievement 提升，我会提出一种替代解释：这种提升并非源于 long-horizon planning 能力的增强，而是由于 PPO 优化使得模型学会了针对 LLM-based reward model 的 reward hacking。具体而言，模型可能只是在话语中堆砌符合六个维度 rubric 的结构化套话（如过度显性化表达策略意图或机械性地复述对方情感），这在由同类 LLM 评判的 benchmark 上能获得高分，但在真实人类评估中会显得极度虚伪。通过引入人类对“突发危机”场景的盲评，可以证明 SocialRL 在非标准对话流中的表现甚至不如未微调的 base model，从而推翻其普遍适用性的 claim。\n\n### § 12 Follow-up Research Idea\n驱动这一 follow-up idea 的核心局限是：SocialRL 依赖一个静态的、外部定义的六维度 rubric 和启发式的 stage-aware weight schedule，这假设了社交智能可以被一套普适的规则和固定的阶段所刻画。然而，真实的社交智能高度个性化——不同对话者对“直率”与“委婉”的偏好截然不同，且社交目标与关系的权衡边界因人而异。我们可以借鉴 Inverse Reinforcement Learning (IRL) 与 Theory of Mind (ToM) 建模，提出一个全新的 framing：Theory-of-Mind-Guided Adaptive Reward Learning。该框架不再使用固定的 process reward model，而是训练 agent 在多轮对话中在线推断对话伙伴的隐式社交价值函数。Agent 内部维护一个 ToM 模块，根据对方的即时反馈（如语气变化、接受或抗拒的微表情文本特征）动态更新对对方偏好的信念，并利用 IRL 技术从这些交互中推导出一个 personalized、trajectory-specific 的 reward function。第一个实验将设计一个多轮谈判任务，其中 user agent 被赋予隐藏的、截然不同的人格特征（如“高度敏感型”与“结果导向型”）。我们将比较 SocialRL（固定 rubric）与新方法在跨人格适应度上的表现，核心指标不再是固定的 benchmark 分数，而是 agent 能否在对话前 3 轮内准确识别对方人格并动态重构自身 reward 权重，从而在未见过的分布外人格上取得更高的谈判成功率与关系维护度。这与已有工作的根本区别在于：将社交 RL 的优化目标从“拟合外部评判标准”转变为“在线推断并适应交互对象的内在动机”。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jianing Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xintao Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Aili Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jie Shi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hongcheng Guo\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jun Gao\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Wenxuan Zhao\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Chengkun Lang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yuanli Guo\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yanghua Xiao\", \"affiliations\": [1], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Fudan University\"},\n    {\"id\": 2, \"name\": \"Hello Group\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "社交智能使智能体能够读取社交语境、推断意图，并在持续对话中进行适应。随着语言模型成为自主协作者，它对于构建有效且值得信赖的人机交互至关重要。现有的 reinforcement learning 方法优化单轮话语和稀疏的 outcome rewards，产生短视的策略，难以在多轮交互中管理目标与关系之间的张力。我们提出了 SocialRL，这是一个解决上述两个挑战的多轮 reinforcement learning 框架。首先，我们使用 PPO 应用多轮 reinforcement learning，将延迟的 outcome rewards 传播回每一轮，从而实现 long-horizon planning。其次，我们设计了六个 process reward 维度来捕捉目标与关系的权衡，包括 goal advancement、relational attunement、contextual coherence 等。reward model 为每个维度动态生成细粒度的评分标准，而 stage-aware weight schedule 在早期轮次优先建立关系，中期优先 goal advancement，并在后期实现平衡收尾。在多个 social-dialogue benchmarks 上，SocialRL 相对于相应的 Base models 将 Goal Achievement 平均提高了 9.2 个百分点。这些结果证明了 SocialRL 在合成与真实社交场景，以及标准与具有挑战性的社交场景中的有效性。"}, {"title": "BRACE: Anchored Bellman-Residual Correction for Stale Critics in Asynchronous RL", "arxiv_id": "2609.09783", "authors": "Guanqun Zhao, Zijun Xie, Binbin Zheng, Jiafeng Lu, Enlei Gong, Zeyu Chen", "summary": "Asynchronous reinforcement learning has become the standard way to scale training for language models, but the resulting policy lag biases the critic toward the stale behavior policy. Existing work on asynchronous LLM training corrects the actor and leaves this bias unaddressed, while the off-policy value correction of classical RL does not carry over to long-horizon agentic tasks, since a short correction horizon leaves the regression target free of the reward and a long one lets the product of importance ratios drift exponentially with the trajectory length. We propose BRACE, an anchored Bellman-residual correction for stale value models. BRACE bounds the correction horizon to a prefix of policy tokens and anchors a constant-weight Monte-Carlo tail beyond it, which separates policy correction from reward propagation. BRACE improves mean@1 on BrowseComp-Plus by $2.4\\%$ over the strongest baseline, runs $2.46\\times$ faster per step than synchronous training, and remains stable $50$ updates off-policy.", "category": "cs.AI", "cluster": "RL \u0026 Optimization for Agents", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了一种名为 BRACE 的异步强化学习校正方法，专门用于解决大语言模型在异步训练中由于策略滞后导致的 critic 偏差问题。论文摘要明确指出，经典的离线强化学习价值校正方法无法直接应用于“长程智能体任务”（long-horizon agentic tasks），并针对这一痛点提出了分离策略校正与奖励传播的新机制。根据筛选标准第一步中的“保留”规则，如果论文研究 agent training/distillation/RL，并且摘要明确指向 Agentic / LLM Agents，应予以保留。该研究属于“训练或演化 LLM智能体”的范畴，且针对的是长程智能体场景，符合核心目标中关于智能体训练和演化的研究焦点，因此判断为符合要求。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决的核心问题是异步强化学习 中由于 policy lag 导致的 critic 偏向 stale behavior policy 的 bias。在异步训练 LLM 时，rollout 生成与 policy 优化解耦执行，导致生成 trajectory 的 behavior policy $\\mu$ 滞后于正在更新的 target policy $\\pi$。这种 asynchrony 使得 critic 的 regression target 建立在由 $\\mu$ 采样的 stale trajectories 上，导致 critic 收敛到 stale policy 的 value function $V^\\mu$ 而非当前 policy 的 value function $V^\\pi$。由于 advantage 是通过减去该预测值计算的，critic 的 bias 会直接传递到 actor 的更新中，且该 bias 是 position-dependent 的——在 response 开头最大，因为 suffix 的 mismatch 会随剩余步数累积。这个问题在长 horizon agentic tasks 中尤为严重，因为同步训练会因等待最慢的 trajectory 而效率低下，异步执行成为必要，但由此引入的 off-policy 问题会严重 degrade 训练质量与稳定性。解决 critic-side bias 能显著提升异步 RL 在长 horizon 任务上的性能，同时保留异步训练的速度优势——BRACE 在 BrowseComp-Plus 上将 mean@1 提升 2.4%，每步速度比同步训练快 2.46×，且在 staleness 高达 50 个版本时仍保持稳定。\n\n### § 2 前人工作与不足\n\n该问题之前未被直接解决。现有工作主要分三类：group-relative optimization（如 GRPO）不拟合 value function，在长 horizon 下因 credit assignment 退化而不可用；actor-side corrections（如 PPO-EWMA、AReaL、KPop、IcePop）通过 asymmetric clipping、truncated importance ratios 或 token masking 作用于 actor 的 trust region，但全部 leave the critic's regression target unchanged，critic 仍通过 ordinary regression 拟合 stale trajectories；V-trace 作为经典 RL 中的标准 off-policy value correction，使用 truncated importance weights 纠正 $\\mu$ 与 $\\pi$ 之间的 lag。V-trace 的失败源于其设计假设与 LLM agentic RL 的实际条件不兼容：它针对 dense rewards 和 short segments 设计，而 agentic RL 只有 terminal reward $R$ 且 trajectory 极长。具体而言，V-trace 面临一个无法同时满足的矛盾——short correction window（$s+n \\leq T$）将 terminal residual $\\delta_T V$ 排除在 window 之外，使 regression target 完全独立于 reward，无法传播 reward 信号；而 long window（$n = T-s+1$）虽能覆盖 terminal reward，却使 importance ratio 的乘积 $\\gamma^{T-s}\\Pi_T$ 随 trajectory length 指数级 drift，要么将 reward 系数 suppress 到零，要么使其爆炸，target 因此对剩余 trajectory 长度极度敏感。这一矛盾的根本原因是 V-trace 试图用同一个 window 同时完成 policy correction 和 reward propagation，而两者对 window length 的需求在 sparse reward 与长 horizon 下是互斥的。BRACE 通过 decoupling 这两个功能解决该不足：用 $k$-capped correction horizon 将 importance correction 限制在 $k$ 个 policy token 内，用 anchored Monte-Carlo tail 以常数权重将 terminal reward 直接传递到每个 position，从而在不依赖 trajectory length 的前提下同时实现 policy correction 与 reward propagation。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Asynchronous RL 训练 LLM 的场景中，behavior policy $\\mu$ 滞后于 target policy $\\pi$ 会引发 off-policy 问题。此前社区的主流应对方案均聚焦于 actor 侧，例如通过 asymmetric clipping、truncated importance ratios 或 decoupled objectives 来重塑 trust region，以防止梯度更新方向偏离过远。然而，这些手段完全忽略了 critic 侧的 regression target 依然是由 stale policy $\\mu$ 采样的轨迹构建的。从理论上看，由于 critic 的回归目标本质上是基于 $\\mu$ 的 Bellman 期望算子 $T_\\mu$ 的混合，随着训练收敛，critic 必然拟合到 $V^\\mu$ 而非 $V^\\pi$。这种偏差直接污染了 advantage 的估计，且由于 sparse reward 仅在轨迹末端给出，早期决策位置的 bias 会随着剩余步数累积而变得极大。\n\n面对这种 critic-side bias，最自然的想法是引入经典 RL 中的 V-trace 等 off-policy value correction 机制。V-trace 通过 truncated importance weights 来纠正 $\\mu$ 与 $\\pi$ 之间的分布差异。但在 long-horizon agentic tasks 中，这会陷入一个致命的两难困境：如果 correction window 较短，terminal reward 被排除在窗口之外，回归目标将完全失去 reward 信号；如果将窗口拉长以覆盖 terminal reward，importance ratio 的连乘积会随轨迹长度呈指数级 drift，导致方差爆炸或信号衰减。更糟糕的是，这两个失败在位置上高度耦合——bias 最严重的早期位置恰恰需要最长的覆盖窗口，也最容易发生乘积失控。\n\n要打破这一僵局，必须认识到 policy correction 与 reward propagation 实际上不需要共享同一个时间窗口。Importance weighting 的作用是纠正局部动作分布的偏移，这种偏移在近期 token 上最为显著且可控；而 terminal reward 需要无损地传递到所有位置以提供学习信号。因此，作者提出将 correction horizon 限制在 $k$ 个 token 内，以严格 bounds importance ratio 的连乘积，而在 $k$ 之外，放弃逐 token 的加权，转而使用一个 constant weight 的 Monte-Carlo tail 直接将真实回报锚定到当前状态。这种解耦设计既切断了方差爆炸的源头，又保证了 reward 信号的完整传播。\n\n### § 4 核心 Intuition\n\n在异步 RL 中，critic 的 bias 源于用 stale policy 的轨迹估计当前 policy 的 value，而经典 V-trace 在 sparse reward 的长序列任务中会陷入“短窗口丢失 reward 信号，长窗口 importance ratio 乘积爆炸”的死结。BRACE 的核心 Intuition 是将 policy correction 与 reward propagation 彻底解耦：仅在近期 $k$ 个 token 上施加 importance correction 以控制方差，而在远期直接用 Monte-Carlo return 作为 anchor，确保 terminal reward 无衰减地传递给所有位置。这种“局部纠正 + 远端锚定”的设计，既切断了指数级 drift 的根源，又恢复了 credit assignment 的准确性。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n  Stale Traj (μ): {a_t, R, log μ}\n      │\n      ▼\n  Importance Weights: w_t, ρ_t=min(ρ̄,w_t), c_t=λ·min(c̄,w_t)\n      │\n      ▼\n  Bellman Residuals: δ_tV = ρ_t(r_t + γV_φ(s_{t+1}) - V_φ(s_t))\n      │\n      ├──── k-Capped Horizon (j=min(s+k,T), Π_k=∏c_i) ─────┐\n      ▼                                                    ▼\n  Corrected Window (≤k步)           Monte-Carlo Tail\n  Σ γ^{t-s} Π δ_tV                 Π_k·(γ^{T-s}R - γ^{j-s}V_φ(s_j))\n      │                                    │\n      └──────────────┬─────────────────────┘\n                     ▼\n            BRACE Target V_targ(s_s)\n                     │\n          ┌──────────┴──────────┐\n          ▼                     ▼\n    Critic Update          Actor Update\n    clipped MSE            Â_s = r_s + γV_targ(s_{s+1}) - V_φ(s_s)\n    vs V_targ              PPO clipped objective\n```\n\n**Pipeline 步骤说明：**\n\n1. **输入：Stale Trajectories**——异步 rollout worker 用 behavior policy $\\mu$（若干版本前的 actor 参数）采样得到轨迹，包含 policy tokens $\\{a_t\\}$、terminal reward $R$、以及 $\\log\\mu(a_t|s_t)$。由于异步执行，$\\mu$ 与当前 target policy $\\pi_\\theta$ 之间存在 version gap（§3.1, Figure 1）。\n\n2. **Importance Weights**——对每个 policy token 计算 $w_t = \\exp(\\log\\pi_\\theta(a_t|s_t) - \\log\\mu(a_t|s_t))$，再分别截断为 $\\rho_t = \\min(\\bar\\rho, w_t)$（用于 residual 的 target policy 纠偏）和 $c_t = \\lambda\\min(\\bar{c}, w_t)$（用于 trace product 的衰减权重）。截断保证权重有界（§4, Algorithm 1 行 3–4）。\n\n3. **Bellman Residuals**——用截断后的 $\\rho_t$ 加权 TD error：$\\delta_t V = \\rho_t(r_t + \\gamma V_\\phi(s_{t+1}) - V_\\phi(s_t))$。在 sparse reward 设定下，仅 $\\delta_T V$ 携带 terminal reward $R$（§3.2, Algorithm 1 行 5）。\n\n4. **k-Capped Correction Horizon**——对每个起始位置 $s$，设 $j = \\min(s+k, T)$，将 importance product $\\Pi_k(s) = \\prod_{i=s}^{j-1} c_i$ 截断至最多 $k$ 个因子。这一步将 correction 的累积长度与 trajectory 长度 $T$ 解耦：无论轨迹多长，product 最多 $k$ 项，其幅度不再随 $T$ 指数漂移（§4.1, eq. 17）。\n\n5. **Corrected Window + Monte-Carlo Tail**——窗口部分（$t \\in [s, j)$）保留 per-token importance weighting，提供 policy correction；尾部（$t \\geq j$）放弃 per-token weight，改用常数权重 $\\Pi_k(s)$，使残差 telescoping 后直接塌缩为 realized return $\\Pi_k(s)(\\gamma^{T-s} R - \\gamma^{j-s} V_\\phi(s_j))$。这保证 terminal reward 始终进入 target，且其系数 $\\gamma^{T-s}\\Pi_k(s)$ 不随 $T$ 衰减（§4.2, eq. 21–23）。\n\n6. **BRACE Target**——将窗口和尾部组合：$V_{\\text{targ}}(s_s) = V_\\phi(s_s) + \\sum_{t=s}^{j-1}\\gamma^{t-s}\\Pi_{t-s}(s)\\delta_tV + \\Pi_k(s)(\\gamma^{T-s}R - \\gamma^{j-s}V_\\phi(s_j))$。等价地，这是一个 corrected $k$-step window 加上一个 anchored Monte-Carlo return（§4.3, eq. 25–26, Algorithm 1 行 7–8）。\n\n7. **Critic Update**——最小化 clipped squared error：$L_V = \\frac{1}{2|D|}\\sum_t \\max((V_\\phi - V_{\\text{targ}})^2, (V_\\phi^{\\text{clip}} - V_{\\text{targ}})^2)$，其中 $V_\\phi^{\\text{clip}}$ 将 critic 预测限制在更新前值的 $\\pm\\epsilon_v$ 范围内，防止 target 移动过快导致不稳定（§4.3, eq. 27, Algorithm 1 行 10–12）。\n\n8. **Actor Update**——用 BRACE target 构造 advantage $\\hat{A}_s = r_s + \\gamma V_{\\text{targ}}(s_{s+1}) - V_\\phi(s_s)$，再套用标准 PPO clipped surrogate objective 更新 actor。Actor 侧不做任何额外 correction——所有纠偏都在 critic target 中完成（§4.3, eq. 28, Algorithm 1 行 13–14）。\n\n---\n\n### § 6 核心数学推导\n\n本文的数学推导围绕三个递进环节展开：**为什么普通回归会拟合 stale policy 的 value**、**为什么经典 V-trace correction 在长轨迹 sparse reward 下失效**、**BRACE 如何同时解决这两个问题**。\n\n**环节一：Critic 收敛到 $V^\\mu_\\gamma$（Proposition 1, §3.1）**\n\n普通 GAE target 是 $n$-step returns 的几何混合。在 behavior policy $\\mu$ 采样数据上做精确回归时，每个 $n$-step return 的条件期望等于 $\\mu$ 的 Bellman 期望算子 $T_\\mu$ 的 $n$ 次幂作用于 $V$。几何混合后得到 $T_\\mu^\\lambda[V]$，其不动点恰为 $V^\\mu_\\gamma$——stale policy 的 value function。Intuition：回归 target 完全由 $\\mu$ 采样的轨迹构建，critic 学到的是\"如果继续按 $\\mu$ 行动，未来回报是多少\"，而非\"按当前 $\\pi$ 行动是多少\"。在 $\\gamma=\\lambda=1$ 的极端情形下，target telescoping 后直接等于 $R$，critic 收敛到 $V^\\mu(s_t) = E_\\mu[R|s_t]$，$V$ 完全消失。\n\n由此产生的 bias 为 $b(s_t) = V^\\pi_\\gamma(s_t) - V^\\mu_\\gamma(s_t)$，它在 response 开头最大、向终端递减——因为早期决策的 suffix 最长，mismatch 累积最多（Figure 2a）。\n\n**环节二：V-trace 的两难（§3.2, Appendix B）**\n\nV-trace 用截断 importance ratio 纠正 off-policy bias，但在 LLM agentic 场景下存在结构性缺陷：\n\n- **短窗口（$s+n \\leq T$）**：sparse reward 使 $r_t=0$（$t\u003CT$），terminal reward 仅出现在 $\\delta_T V$ 中，而 $\\delta_T V$ 在窗口之外。target 退化为仅关于 $V$ 自身的条件 $V(s_s) = E[\\gamma V(s_{s+1})]$，不含 reward 项——critic 学不到任何 reward 信号（eq. 9–11）。\n\n- **长窗口（$n = T-s+1$）**：terminal reward 进入 target，系数为 $\\gamma^{T-s}\\Pi_T$，其中 $\\Pi_T = \\prod_{i=s}^{T-1} c_i$。展开 $\\log(\\gamma^{T-s}\\Pi_T) = (T-s)\\log(\\gamma\\lambda) + \\sum \\log\\min(\\bar c, \\pi/\\mu)$。对于精确 importance ratio，$E_\\mu[w_t]=1$ 使 $\\min(\\bar c, w_t) \\leq w_t$，由 Jensen 不等式得漂移 $m \\leq 0$——系数随 $T-s$ 指数衰减。要保持系数接近 1，需要 $|m| = O(1/(T-s))$，即近似 on-policy，而这正是异步执行所破坏的（eq. 12–14, Appendix B.2）。\n\n核心矛盾：**coverage 需要 $n \\geq T-s+1$（长窗口触及 reward），control 需要 $n = O(1)$（短窗口控制 product 方差），单一窗口无法同时满足**。\n\n**环节三：BRACE 的分离策略（§4.1–4.2, Appendix C）**\n\nBRACE 将 correction 和 reward propagation 解耦：\n\n- **k-capped horizon**：product 截断至 $k$ 个因子，与 $T$ 无关。每个 residual（含 $\\delta_T V$）的权重幅度不再随轨迹长度增长。截断后的 fixed point 为 $V^{\\pi_{\\bar\\rho}}_\\gamma$，随 $\\bar\\rho \\to \\infty$ 趋近 $V^\\pi_\\gamma$（eq. 18）。\n\n- **Monte-Carlo tail**：位置 $j$ 之后所有 residual 携带相同常数权重 $\\Pi_k(s)$。经 telescoping，尾部塌缩为 $\\Pi_k(s)(\\gamma^{T-s}R - \\gamma^{j-s}V_\\phi(s_j))$——terminal reward 的系数恰好是 $\\gamma^{T-s}\\Pi_k(s)$，与窗口内一致，不随 $T$ 衰减（eq. 22–23, Appendix C.1）。\n\n若尾部改用 per-token weight，则 telescoping 被破坏，每个 $V(s_t)$ 留下非零系数，符号交替，净贡献 $O(1)$ 但总方差以 $O(\\sqrt{T-s-k})$ 增长——注入噪声。常数权重消除了这一波动项（Appendix C.1 的 summation-by-parts 推导）。\n\n最终，$k$ 在 bias 与 variance 之间权衡（小 $k$ 偏向 $V^\\mu_\\gamma$ 但权重紧致，大 $k$ 偏向 $V^\\pi_\\gamma$ 但 product 更随机），取代了 V-trace 中 coverage-versus-control 的不可调和冲突（Appendix C.2）。\n\n---\n\n### § 7 实验设计与结论\n\n**问题 1：BRACE 是否能有效纠正异步 RL 中的 critic-side bias，并在长轨迹 agentic 任务上优于现有 actor-side correction？**\n\n实验设计：在四个长轨迹任务（Search-R1 多轮检索推理、BrowseComp-Plus 深度搜索、DAPO-Math 数学推理、GSM8K-Tool 多轮工具调用）上，将 BRACE 与五个 baseline（PPO、PPO-EWMA、AReaL、KPop、IcePop，均只纠正 actor）对比。所有方法运行在相同的全异步 VeRL pipeline 中，共享模型、数据顺序和 step budget，BRACE 仅替换 critic 的 regression target（§5, Table 3）。\n\n答案：BRACE 在 16 项指标中取得 13 项最佳，在 BrowseComp-Plus 上 mean@1 从 0.245 提升至 0.269（+2.4%）。在 Search-R1 的 in-domain NQ 上相对 PPO 提升 0.119，远超 out-of-domain 的 0.014–0.055，说明 correction 在 credit 需要传播最远处收益最大（§5.1, Table 1）。\n\n**问题 2：性能提升是否确实来自 critic bias 的减少，而非 actor objective 的副作用？**\n\n实验设计：在训练过程中追踪两个诊断量——value bias gap $\\hat{g}_\\pi$（critic 到 $V^\\pi$ 的距离）和 policy separation $\\hat{b}$（$V^\\pi$ 与 $V^\\mu$ 的差距），分别对应 eq. 7 的两个分量（§3.1, Figure 4a–b）。\n\n答案：在 Search-R1 上，BRACE 从 step 130 起保持最低 $\\hat{g}_\\pi$（约 0.07 vs baseline 的 0.08–0.10）；在 DAPO-Math 上，PPO 的 $\\hat{b}$ 漂移至 0.06–0.08 而 BRACE 维持在 0.02 附近。这证实增益来自 critic target 的纠偏，而非 actor 侧的 gradient reweighting（§5.1）。\n\n**问题 3：k-cap 和 Monte-Carlo tail 各自是否不可或缺？**\n\n实验设计：两组 ablation——移除 k-cap（$k\\to\\infty$，让 importance product 累积整个剩余 horizon）和移除 MC tail（保留 per-token weight 到终端），在 Search-R1 上对比训练曲线（§5.2, Figure 4c）。\n\n答案：无 k-cap 的变体从前 100 步起落后，最终在 0.33 附近停滞（BRACE 达 0.39）——product 要么衰减至零要么被少数轨迹主导。无 MC tail 的变体接近 BRACE 但后半程明显不稳定，最终低约 0.01——telescoping 被破坏后 $O(\\sqrt{T-s-k})$ 噪声注入 label。两个组件分别解决 coverage-control 冲突和方差控制，缺一不可。\n\n**问题 4：BRACE 对 staleness 和超参数的鲁棒性如何？**\n\n实验设计：在 Search-R1 上 sweep staleness $S$ 从 5 到 50（§5.3, Figure 4d）；在 BrowseComp-Plus 上 sweep $k$ 从 10 到 100（Figure 4e）；在 DAPO-Math 上 sweep $\\bar\\rho$ 和 $\\bar{c}$（Appendix F, Table 4）。\n\n答案：质量在 $S=5$ 到 $S=15$ 间下降（0.39→0.35），但 $S=15$ 到 $S=50$ 间几乎饱和（0.29–0.31）——staleness 仅通过有界权重 $\\rho_t, c_t$ 影响 target，多数 token 被 clip 后进一步增大 version gap 不再改变 label。$k=20$ 与 $k=100$ 差距不超过 0.01，$k=10$ 明显落后——窗口只需覆盖 bias 集中的近端区域。$\\bar\\rho$ 在 1.2–2.0 间平坦，$\\bar{c}$ 对质量更敏感因为增大 $\\bar{c}$ 会引入更长的 ratio product，重现 k-cap 旨在防止的累积。\n\n**问题 5：异步训练的效率优势是否被 BRACE 的额外计算抵消？**\n\n实验设计：在 BrowseComp-Plus（32k response、并行检索调用）上测量同步 PPO、异步 PPO 和 BRACE 的 per-step 时间和 throughput（§5.4, Table 2）。\n\n答案：异步 PPO 相对同步加速 2.49×（219s vs 546s per step），BRACE 仅增加 1.5% step time（222s），保留 2.46× 加速。anchored tail 需要 rollout 超出 k-cap 窗口，但开销为常数因子，不随训练增长。", "additional_insights": "### § 8 Take-aways\nAsynchronous RL 中，policy lag 会导致 critic 拟合 stale behavior policy $\\mu$ 的 value function $V^\\mu$，而非 target policy $\\pi$ 的 $V^\\pi$，这是 critic-side bias 的根源。传统的 off-policy value correction（如 V-trace）在 long-horizon agentic tasks 中面临两难：短窗口无法覆盖 sparse terminal reward，长窗口会导致 importance ratio 乘积随轨迹长度指数级漂移。BRACE 通过引入 $k$-capped correction horizon，将 importance correction 限制在 $k$ 个 policy tokens 内，成功解耦了 policy correction 与 reward propagation。同时，BRACE 引入 anchored Monte-Carlo tail，在 $k$ 窗口之外使用常数权重直接传递 terminal reward，避免了 telescoping 被破坏带来的方差爆炸。实验表明，BRACE 在四个 long-horizon agentic tasks 的 16 个指标中取得 13 个最优，在 BrowseComp-Plus 上比最强 baseline 提升 2.4% mean@1，且每步速度比 synchronous training 快 2.46 倍，在 50 步 off-policy 的 staleness 下仍保持稳定。\n\n### § 9 最脆弱的假设\nBRACE 的核心假设是：在 sparse reward 场景下，critic bias 主要集中在 response 的近端（near horizon），因此将 importance correction 限制在 $k$ 个 tokens 内即可纠正主要偏差，而超出 $k$ 的部分可以安全地通过常数权重的 Monte-Carlo tail 折叠为 realized return。如果这个假设不成立，例如 critic bias 在整个轨迹上均匀分布，或者任务需要 dense reward 信号来指导中间步骤，那么 $k$-capped 窗口将无法捕捉主要的 bias，而 Monte-Carlo tail 会因为完全依赖未加权的 realized return 而引入极大的方差（相当于退化为高方差的 REINFORCE 估计），导致核心贡献失效。论文中 Figure 2a 提供了部分证据，显示 gap $b(s_t)$ 在 response 开头最大并向 terminal state 递减，但这仅基于特定的检索增强任务，对于其他类型的 long-horizon 任务（如长链条逻辑推理），bias 的分布可能完全不同，论文并未对此提供更广泛的验证。\n\n### § 10 最小复现实验\n在 1 周时间内，可以使用一个较小的 LLM（如 Qwen2.5-0.5B）在多轮工具调用的 GSM8K 变体上验证 BRACE 的核心 claim：即 $k$-capped correction horizon 能够在保持 reward 信号的同时控制方差。实现一个简化的 asynchronous RL 训练循环，人为引入固定的 staleness（如 $S=10$），并对比三种 critic target：Vanilla GAE（拟合 $V^\\mu$）、Uncapped V-trace（全窗口 importance correction）和 BRACE（$k=20$）。测量训练过程中 critic target 对 terminal reward 的依赖系数 $\\beta$（按公式 15 将 ta
