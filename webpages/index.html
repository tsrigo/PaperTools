<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperTools - 学术论文集合</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Marked.js 用于 Markdown 渲染 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- KaTeX 仅在已展开的 Markdown 段落中渲染公式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <style>
        /* 微软雅黑字体 */
        body {
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        body::-webkit-scrollbar {
            display: none;
        }

        /* 移动端优化 */
        @media (max-width: 640px) {
            body {
                font-size: 14px;
            }

            /* 改善可点击区域 */
            button, a {
                min-height: 44px;
                min-width: 44px;
            }

            /* 优化间距 */
            .container {
                padding-left: 12px !important;
                padding-right: 12px !important;
            }
        }

        /* 星标样式 */
        .star-button {
            transition: color 0.2s ease-in-out;
        }
        .star-button.starred {
            color: #fbbf24;
        }
        .star-button:not(.starred) {
            color: #9ca3af;
        }
        .star-button:hover {
            color: #fbbf24;
        }
        /* 删除按钮样式 */
        .delete-button {
            transition: all 0.2s ease-in-out;
        }
        .delete-button:hover {
            color: #ef4444;
            transform: scale(1.1);
        }
        /* 论文项目样式 */
        .paper-item {
            transition: opacity 0.2s ease-out, transform 0.2s ease-out;
            content-visibility: auto;
            contain-intrinsic-block-size: auto 240px;
        }
        .paper-item.hidden-paper {
            opacity: 0.3;
            transform: scale(0.98);
        }
        /* 平滑过渡 */
        .rotate-90-transition {
            transition: transform 0.2s ease-in-out;
        }

        /* 论文卡片展开/收起 */
        .paper-expand-hint {
            padding: 4px 0;
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .paper-expand-hint:hover {
            color: #2563eb;
        }
        .dark .paper-expand-hint:hover {
            color: #60a5fa;
        }
        .paper-expand-hint .expand-arrow {
            display: inline-block;
            transition: transform 0.2s;
            font-size: 0.65rem;
            margin-right: 4px;
        }
        .paper-detail {
            border-top: 1px solid #e2e8f0;
            margin-top: 8px;
            padding-top: 8px;
        }
        .dark .paper-detail {
            border-top-color: #334155;
        }
        .paper-detail.hidden {
            display: none;
        }

        /* 可折叠部分样式 */
        .collapsible-header {
            cursor: pointer;
            display: flex;
            align-items: center;
            font-weight: 600;
            padding: 8px 0;
            user-select: none;
            color: #1e40af;
            transition: color 0.15s ease-out, opacity 0.15s ease-out;
        }
        .dark .collapsible-header {
            color: #60a5fa;
        }
        .collapsible-header:hover {
            opacity: 0.8;
        }
        .collapsible-header::before {
            content: "▶";
            margin-right: 8px;
            transition: transform 0.3s ease;
            font-size: 0.8em;
        }
        .collapsible-header.open::before {
            transform: rotate(90deg);
        }
        .collapsible-content {
            display: none;
        }
        .collapsible-content.open {
            display: block;
        }
        .collapsible-content .inner {
            padding-top: 8px;
        }

        @media (prefers-reduced-motion: reduce) {
            .paper-item,
            .collapsible-header,
            .collapsible-header::before,
            .paper-expand-hint .expand-arrow {
                transition: none;
            }
        }

        /* Markdown 内容样式 */
        .markdown-content {
            line-height: 1.6;
        }
        .markdown-content h1 {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 1em;
            margin-bottom: 0.5em;
            color: #1e40af;
        }
        .dark .markdown-content h1 {
            color: #60a5fa;
        }
        .markdown-content h2 {
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 0.8em;
            margin-bottom: 0.4em;
            color: #1e40af;
        }
        .dark .markdown-content h2 {
            color: #60a5fa;
        }
        .markdown-content h3 {
            font-size: 1.1em;
            font-weight: bold;
            margin-top: 0.6em;
            margin-bottom: 0.3em;
            color: #1e40af;
        }
        .dark .markdown-content h3 {
            color: #60a5fa;
        }
        .markdown-content h4 {
            font-size: 1em;
            font-weight: bold;
            margin-top: 0.5em;
            margin-bottom: 0.25em;
            color: #2563eb;
        }
        .dark .markdown-content h4 {
            color: #93c5fd;
        }
        .markdown-content p {
            margin-bottom: 0.8em;
        }
        .markdown-content ul, .markdown-content ol {
            margin-left: 1.5em;
            margin-bottom: 0.8em;
        }
        .markdown-content ul {
            list-style-type: disc;
        }
        .markdown-content ol {
            list-style-type: decimal;
        }
        .markdown-content li {
            margin-bottom: 0.3em;
        }
        .markdown-content code {
            background-color: #f1f5f9;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
        }
        .dark .markdown-content code {
            background-color: #334155;
        }
        .markdown-content pre {
            background-color: #f1f5f9;
            padding: 1em;
            border-radius: 5px;
            overflow-x: auto;
            margin-bottom: 0.8em;
        }
        .dark .markdown-content pre {
            background-color: #334155;
        }
        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
        }
        .markdown-content blockquote {
            border-left: 3px solid #cbd5e1;
            padding-left: 1em;
            margin-left: 0;
            margin-bottom: 0.8em;
            color: #64748b;
        }
        .dark .markdown-content blockquote {
            border-left-color: #475569;
            color: #94a3b8;
        }
        .markdown-content strong {
            font-weight: 600;
        }
        .markdown-content em {
            font-style: italic;
        }

        /* Tag filter button styles */
        .tag-btn {
            padding: 4px 14px;
            font-size: 0.875rem;
            border-radius: 9999px;
            border: 1px solid #cbd5e1;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .tag-btn:hover { border-color: #3b82f6; color: #3b82f6; }
        .tag-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .dark .tag-btn { border-color: #475569; color: #94a3b8; }
        .dark .tag-btn:hover { border-color: #60a5fa; color: #60a5fa; }
        .dark .tag-btn.active { background: #2563eb; color: white; border-color: #2563eb; }

        /* Tag badge styles */
        .tag-badge {
            display: inline-block;
            padding: 1px 6px;
            font-size: 0.7rem;
            border-radius: 9999px;
            background: #dbeafe;
            color: #1e40af;
            margin-right: 4px;
        }
        .tag-badge.tag-arxiv {
            background: #e0f2fe;
            color: #0369a1;
        }
        .dark .tag-badge { background: #1e3a5f; color: #7dd3fc; }
        .dark .tag-badge.tag-arxiv { background: #164e63; color: #67e8f9; }

        /* 作者机构上标样式 */
        .author-aff {
            vertical-align: super;
            font-size: 0.65em;
            color: #3b82f6;
            margin-left: 1px;
        }
        .dark .author-aff {
            color: #60a5fa;
        }

        /* 桌面端正文使用移除右栏后释放的宽度，同时避开左侧目录。 */
        #content-column {
            width: 100%;
        }
        @media (min-width: 1024px) {
            #content-column {
                width: min(1024px, calc(100% - 260px));
                margin-left: max(240px, calc((100% - 1024px) / 2));
                margin-right: auto;
            }
        }

        /* TOC 侧边栏样式 - 固定在左侧 */
        #toc-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            z-index: 35;
            background: white;
            border-right: 1px solid #e2e8f0;
            transition: transform 0.3s ease;
            overflow: hidden;
        }
        .dark #toc-sidebar {
            background: #1e293b;
            border-right-color: #334155;
        }
        #toc-sidebar.collapsed {
            transform: translateX(-100%);
        }
        #toc-inner {
            padding: 1rem 0.5rem;
            height: 100%;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        #toc-inner::-webkit-scrollbar {
            width: 4px;
        }
        #toc-inner::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 2px;
        }
        .dark #toc-inner::-webkit-scrollbar-thumb {
            background: #475569;
        }
        .toc-date {
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toc-date:hover {
            background: #e2e8f0;
        }
        .dark .toc-date:hover {
            background: #334155;
        }
        .toc-date.active {
            background: #dbeafe;
            color: #1e40af;
        }
        .dark .toc-date.active {
            background: #1e3a5f;
            color: #93c5fd;
        }
        .toc-date-arrow {
            transition: transform 0.2s;
            font-size: 0.65rem;
        }
        .toc-date-arrow.open {
            transform: rotate(90deg);
        }
        .toc-papers {
            display: none;
            padding-left: 1.2rem;
        }
        .toc-papers.open {
            display: block;
        }
        .toc-paper {
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 3px;
            font-size: 0.8rem;
            line-height: 1.35;
            color: #64748b;
            transition: background 0.15s, color 0.15s;
            display: block;
            white-space: normal;
            overflow-wrap: anywhere;
            max-width: 100%;
        }
        .toc-paper:hover {
            background: #f1f5f9;
            color: #1e40af;
        }
        .dark .toc-paper {
            color: #94a3b8;
        }
        .dark .toc-paper:hover {
            background: #1e293b;
            color: #93c5fd;
        }
        .toc-paper.active {
            background: #eff6ff;
            color: #1d4ed8;
            font-weight: 500;
        }
        .dark .toc-paper.active {
            background: #1e3a5f;
            color: #93c5fd;
        }
        .toc-expand-all {
            width: calc(100% - 8px);
            margin: 5px 4px 6px;
            padding: 5px 8px;
            border: 1px solid #bfdbfe;
            border-radius: 5px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .toc-expand-all:hover {
            background: #dbeafe;
            border-color: #93c5fd;
        }
        .dark .toc-expand-all {
            background: rgba(30, 58, 95, 0.55);
            border-color: #1e40af;
            color: #93c5fd;
        }
        .dark .toc-expand-all:hover {
            background: #1e3a5f;
        }
        /* TOC 切换按钮 - 左侧 */
        #toc-toggle {
            position: fixed;
            left: 220px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 40;
            width: 28px;
            height: 56px;
            border-radius: 0 6px 6px 0;
            background: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 0 8px rgba(0,0,0,0.15);
            transition: left 0.3s ease, background 0.2s;
        }
        #toc-toggle:hover {
            background: #2563eb;
        }
        #toc-toggle svg {
            transition: transform 0.3s;
        }
        #toc-toggle:not(.sidebar-open) {
            left: 0;
        }
        @media (max-width: 1023px) {
            #toc-sidebar {
                width: 240px;
            }
            #toc-toggle {
                left: 240px;
            }
            #toc-toggle:not(.sidebar-open) {
                left: 0;
            }
        }
        @media (max-width: 767px) {
            #toc-sidebar {
                width: 260px;
                box-shadow: 4px 0 16px rgba(0,0,0,0.1);
            }
            #toc-toggle {
                left: 260px;
            }
            #toc-toggle:not(.sidebar-open) {
                left: 0;
            }
        }

    </style>
    <script>
        // Tailwind CSS 暗色模式配置
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>

    <script>
        const allPapers = {"2026-09-11": [{"name": "Long-Horizon Agents \u0026 Memory", "count": 4, "papers": [{"title": "Mr.LHDR: A Benchmark for Multimodal Real-World Long-Horizon Deep Research Agents", "arxiv_id": "2609.11318", "authors": "Minghao Guo, Meng Cao, Sui Zhao, Siyu Ning, Xin Wang, Haoze Zhao, Jiaxuan Yang, Haihong Hao, Mingfei Han, Shunlin Rong, Haijun Wu, Xiaodan Liang, Xiaojun Chang", "summary": "Deep research agents are increasingly capable of web search, tool use, multimodal evidence analysis, and information synthesis. However, existing benchmarks mainly evaluate medium-horizon exploration and rarely test whether agents can sustain long, dependency-heavy research processes. We introduce Mr.LHDR (Multimodal real-world Long-Horizon Deep Research), a benchmark for evaluating real-world deep research over long, irreducible chains of interdependent evidence across eight categories. Each question is constructed from a hidden Node-Relation graph and requires an average of 12.1 necessary intermediate conclusions with a mean dependency depth of 10.4 before reaching a short, unique, and verifiable answer. Questions incorporate multimodal evidence, including images, maps, PDFs, logos, charts, tables, and video frames, with at least one non-text element that changes the reasoning state. Mr.LHDR evaluates both final answers and the correctness of intermediate conclusions under annotated dependencies. We evaluate general models, deep research systems, and agent frameworks using Overall Accuracy (OA), Strict Accuracy (SA), Checklist Score (CS), and Dependency-Aware Checklist Score (DACS). Results show that even the strongest system achieves only 43.1% OA and 34.3% SA, indicating that final-answer accuracy substantially overestimates complete research success. Removing images reduces DACS by 12.6 points, demonstrating the importance of multimodal evidence, while SA consistently declines as reasoning chains become longer. These findings reveal sustained, dependency-consistent evidence integration, rather than isolated fact retrieval, as a key bottleneck for current deep research agents.", "category": "cs.AI", "cluster": "Long-Horizon Agents \u0026 Memory", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了一个名为 Mr.LHDR 的基准测试，用于评估多模态真实世界长周期深度研究智能体。根据筛选标准第一步中的“保留”规则，如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents，即使它主要是评估基准或失败机制诊断，只要结论直接帮助理解或改进智能体能力，就应保留。该论文评估了现有智能体框架在长依赖链、多模态证据整合方面的表现，并诊断出“持续的、依赖一致的证据整合”是当前深度研究智能体的关键瓶颈。这直接属于对智能体长周期行为和失败机制的分析，有助于后续改进智能体的规划与工具使用能力。\n\n虽然论文涉及多模态证据（图像、地图、PDF等），但多模态在这里是作为智能体感知和处理的输入信息，而非研究多模态模型本身的核心架构，符合“除非它们被用作智能体感知环境的工具，而不是研究的核心”的例外条件。此外，摘要中提到的“Node-Relation graph”仅是构造问题和评估依赖深度的机制，并非研究图结构技术本身。因此，该论文符合您的核心研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：当前 deep research agents 能否在长链条、跨模态、多源依赖的真实世界研究任务中，持续维持 dependency-consistent 的证据整合，而非仅完成孤立的事实检索。具体而言，当一个任务要求 agent 分解目标、在网页/PDF/图像/地图/视频等异构来源间定位证据、跨模态桥接信息、保留中间结论并反复验证约束时，现有系统是否能在每一步都正确建立后续推理所依赖的前提条件。这一问题之所以重要，是因为 deep research agents 正被期望承担真实的研究助理角色——不仅要返回最终答案，还要保证推理过程的可审计性。论文指出，真实世界研究的难度不仅来自个别事实的隐蔽性，更来自早期错误会 redirect 整条调查链的结构性风险。然而现有 benchmark 要么以文本为中心（如 BrowseComp），要么虽引入多模态但仅覆盖 short- to medium-horizon 任务（如 MM-BrowseComp 平均仅 3.0 个 checklist items），长链条依赖证据步骤基本未被测试。解决这一问题能带来三方面价值：一是揭示 final-answer accuracy 对完整任务执行能力的系统性高估，二是通过 multimodal evidence ablation 量化非文本证据对推理链的物质性贡献，三是为未来系统指明 research-state tracking、source/modality binding 和 chain-level verification 为关键改进方向。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决。最相关的 prior work 可分为三类。第一类是 open-web browsing benchmark：BrowseComp (Wei et al., 2025) 强调开放网络上难以定位的短答案，但完全以文本为中心，不涉及多模态证据；MM-BrowseComp (Li et al., 2025d) 在此基础上增加了多模态浏览证据并提供 verified checklist，但其任务结构集中于 short- to medium-horizon 研究，平均每题仅 3.0 个 checklist items，无法测试长链条依赖推理。第二类是结构化搜索 benchmark：MMSearch-Plus (Tao et al., 2026) 关注 provenance-aware browsing 但不提供 gold intermediate structure；BrowseComp-V3 (Zhang et al., 2026) 引入 expert-validated subgoals 和 subgoal-coverage process score，但仍采用无序覆盖评分，不进行 prerequisite gating；MC-Search (Ning et al., 2026) 提供了 step-wise multimodal reasoning graph 和 process metrics，但其评测基于 fixed local knowledge base 而非开放网络，且同样不做 prerequisite-gated scoring。第三类是 report-oriented benchmark（如 Huang et al., 2026; Ye et al., 2026），它们评估长篇报告质量，属于不同的 output regime，不要求 concise verifiable answer 与 dependency-aware 中间结论评估。这些工作存在不足的根本原因在于评测范式的结构性缺陷：它们要么仅以 final-answer correctness 作为评分依据（如 DeepSearchQA, Gupta et al., 2026），要么使用无序 checklist/subgoal coverage（如 MM-BrowseComp、BrowseComp-V3），将中间结论视为独立可互换的局部事实。这种评分方式在 long-horizon 场景下失效，因为下游结论的成立以先前实体、约束和消歧关系的建立为前提——当 prerequisite 缺失时，一个碰巧匹配 checklist item 的下游陈述可能只是 unsupported guess 或 search shortcut，而非有效推理路径的延续。此外，现有 benchmark 普遍未将 multimodal evidence 作为改变 reasoning state 的必要环节进行硬性约束，多模态证据往往沦为装饰性输入而非推理链的承重节点。Mr.LHDR 通过引入 author-verified dependency DAG 和递归式 DACS 评分，直接填补了这一评测缺口：它不仅要求每个 question 至少包含一条改变推理状态的非文本证据，还在评分时递归地以下游结论的所有 transitive prerequisites 是否满足为授分条件，从而区分 final-answer correctness、complete stated-conclusion correctness 和 dependency-consistent coverage。", "core_insight": "### § 3 重建作者的思考路径\n\n作者很可能从对现有 deep research agent benchmark 的系统性不满出发。BrowseComp 证明了 open-web 短答案检索的可贵，但本质上仍是 text-centered 的单跳或浅多跳任务；MM-BrowseComp 虽引入 multimodal browsing，但平均每题仅 3.0 个 checklist items，属于 medium-horizon 范畴。与此同时，真实世界的研究任务——比如从一张产品图片出发，追溯其处理器设计团队、芯片供应商、材料来源、关联机构、再到某段视频中的某个视觉细节——天然具有长链条、跨模态、强依赖的特征：一个早期实体识别错误就会使整条证据链偏移。作者观察到，现有 benchmark 既没有构造这种 prerequisite-linked 的深层依赖结构，也没有在评估层面区分\"碰巧得到正确答案\"与\"沿正确依赖路径得到正确答案\"。\n\n进一步，作者注意到评估指标本身的缺陷。仅用 final-answer accuracy（OA）会高估系统能力，因为 agent 可能通过猜测、shortcut 或 parametric knowledge 猜中答案而跳过关键推理步骤；而 unordered checklist score（CS）虽然能测量覆盖率，却把所有中间结论视为独立可互换，忽略了下游结论的成立以上游先决条件为前提。这意味着一个\"破碎的依赖图\"上散落的局部正确匹配会被错误地计为过程可靠。作者需要一个递归的、dependency-aware 的评分机制，使得下游结论的得分以其所有传递性先决条件的正确性为条件。\n\n在数据构造层面，作者面临的核心挑战是如何确保任务的 long-horizon 难度来自依赖结构本身而非 prompt 冗长或 trivia 冷僻。由此自然推导出 Node-Relation graph 的设计：先构建一个由可验证实体属性节点和唯一收敛关系组成的隐藏图，再从中生成自然语言问题，确保中间节点和搜索路径被遮蔽。多模态证据被设为硬性纳入条件——每个问题至少有一个非文本证据节点改变推理状态——因为作者从 multimodal understanding 文献和真实研究经验中知道，图片、地图、PDF、logo、图表等视觉证据常常承担实体识别、候选约束或跨模态桥接的关键角色，而非装饰。\n\n最后，作者需要验证这套 benchmark 是否真的能区分系统能力层次。从 25 个系统的实验结果中，OA-SA 的系统性差距、CS-DACS 的依赖惩罚、image ablation 中 DACS 下降 12.6 个百分点、以及 SA 随 checklist 长度单调递减——这些结果共同确认了一个判断：sustained, dependency-consistent evidence integration 才是当前 deep research agent 的核心瓶颈，而非孤立事实检索或单步浏览能力。\n\n### § 4 核心 Intuition\n\n当前 deep research agent 的真正瓶颈不在于能否找到个别事实或给出正确最终答案，而在于能否在一条长且紧密耦合的跨模态证据链中持续维持依赖一致的推理状态——即每一步中间结论都建立在其所有先决条件已被正确确立的基础之上。Mr.LHDR 的核心 intuition 是：通过构造基于 prerequisite-linked DAG 的 long-horizon 任务，并用 DACS 这种递归依赖感知指标替代无序 checklist 评估，可以精确暴露\"正确答案伴随破碎推理链\"这一被 final-answer accuracy 系统性掩盖的失败模式。多模态证据之所以不可或缺，是因为它在推理链中承担的是改变推理状态的桥接功能——识别实体、约束候选、连接异构信息源——而非提供冗余线索。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Mr.LHDR: A Benchmark for Multimodal Real-World Long-Horizon Deep Research Agents》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出的核心研究问题是：当前 deep research agents 能否在长链条、跨模态、多源依赖的真实世界研究任务中，持续维持 dependency-consistent 的证据整合，而非仅完成孤立的事实检索。具体而言，当一个任务要求 agent 分解目标、在网页/PDF/图像/地图/视频等异构来源间定位证据、跨模态桥接信息、保留中间结论并反复验证约束时，现有系统是否能在每一步都正确建立后续推理所依赖的前提条件。这一问题之所以重要，是因为 deep research agents 正被期望承担真实的研究助理角色——不仅要返回最终答案，还要保证推理过程的可审计性。论文指出，真实世界研究的难度不仅来自个别事实的隐蔽性，更来自早期错误会 redirect 整条调查链的结构性风险。然而现有 benchmark 要么以文本为中心（如 BrowseComp），要么虽引入多模态但仅覆盖 short- to medium-horizon 任务（如 MM-BrowseComp 平均仅 3.0 个 checklist items），长链条依赖证据步骤基本未被测试。解决这一问题能带来三方面价值：一是揭示 final-answer accuracy 对完整任务执行能力的系统性高估，二是通过 multimodal evidence ablation 量化非文本证据对推理链的物质性贡献，三是为未来系统指明 research-state tracking、source/modality binding 和 chain-level verification 为关键改进方向。 ### § 2 前人工作与不足 该问题此前未被充分解决。最相关的 prior work 可分为三类。第一类是 open-web browsing benchmark：BrowseComp (Wei et al., 2025) 强调开放网络上难以定位的短答案，但完全以文本为中心，不涉及多模态证据；MM-BrowseComp (Li et al., 2025d) 在此基础上增加了多模态浏览证据...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 作者很可能从对现有 deep research agent benchmark 的系统性不满出发。BrowseComp 证明了 open-web 短答案检索的可贵，但本质上仍是 text-centered 的单跳或浅多跳任务；MM-BrowseComp 虽引入 multimodal browsing，但平均每题仅 3.0 个 checklist items，属于 medium-horizon 范畴。与此同时，真实世界的研究任务——比如从一张产品图片出发，追溯其处理器设计团队、芯片供应商、材料来源、关联机构、再到某段视频中的某个视觉细节——天然具有长链条、跨模态、强依赖的特征：一个早期实体识别错误就会使整条证据链偏移。作者观察到，现有 benchmark 既没有构造这种 prerequisite-linked 的深层依赖结构，也没有在评估层面区分\"碰巧得到正确答案\"与\"沿正确依赖路径得到正确答案\"。 进一步，作者注意到评估指标本身的缺陷。仅用 final-answer accuracy（OA）会高估系统能力，因为 agent 可能通过猜测、shortcut 或 parametric knowledge 猜中答案而跳过关键推理步骤；而 unordered checklist score（CS）虽然能测量覆盖率，却把所有中间结论视为独立可互换，忽略了下游结论的成立以上游先决条件为前提。这意味着一个\"破碎的依赖图\"上散落的局部正确匹配会被错误地计为过程可靠。作者需要一个递归的、dependency-aware 的评分机制，使得下游结论的得分以其所有传递性先决条件的正确性为条件。 在数据构造层面，作者面临的核心挑战是如何确保任务的 long-horizon 难度来自依赖结构本身而非 prompt 冗长或 trivia 冷僻。由此自然推导出 Node-Relation graph 的设计：先构建一个由可验证实体属性节点和唯一收敛关系组成的隐藏图，再从中生成自然语言问题，确保中间节点和搜索路径被遮蔽。多模态证据被设为硬性纳入条件——每个问题至少有一... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：## **Mr.LHDR: A Benchmark for Multimodal Real-World Long-Horizon Deep Research Agents** ## **Minghao Guo** _[∗]_ _minghaoguo20@gmail.com_ _Mohamed bin Zayed University of Artificial Intelligence_ ## **Meng Cao** _[∗]_ _mengcaopku@gmail.com_ _Mohamed bin Zayed University of Artificial Intelligence_ ## **Sui Zhao** _University of Science and Technology of China_ ## **Siyu Ning** _University of Science and Technology of China_ ## **Xin Wang** _sui@mail.ustc.edu.cn ningsiyu@mail.ustc.edu.cn wangxin2252@gmail.com_ _University of Science and Technology of China_ ## **Haoze Zhao** _Haoze.Zhao@mbzuai.ac.ae_ _Mohamed bin Zayed University of Artificial Intelligence_ ## **Jiaxuan Yang** _yangjiaxuan@zju.edu.cn_ _Zhejiang University_ ## **Haihong Hao** _haohaihong@mail.ustc.edu.cn_ _University of Science and Technology of China_ ## **Mingfei Han** _Mingfei.Han@mbzuai.ac.ae_ _Mohamed bin Zayed Univer...", "additional_insights": "### § 8 Take-aways\n论文提出了 Mr.LHDR，一个用于评估多模态真实世界长程深度研究 agent 的 benchmark，其核心特征是平均包含 12.1 个必要中间结论和 10.4 的依赖深度，远超现有 medium-horizon 基准如 MM-BrowseComp。每个问题基于隐藏的 Node-Relation graph 构建，强制要求 agent 在跨模态（图像、PDF、视频等）的多源证据链中维持和验证 evolving research state。评估体系引入了 Dependency-Aware Checklist Score (DACS)，通过递归检查前提条件是否满足，来区分孤立的结论匹配与真正的依赖一致推理。对 25 个系统的评估显示，表现最好的 GPT-5.5 也仅达到 43.1% 的 OA 和 34.3% 的 SA，证明当前系统在长程依赖一致性上远未饱和。实验揭示了显著的 OA-SA gap，表明最终答案的正确性往往高估了完整的任务执行能力，模型常在给出正确答案的同时遗漏必要的中间结论。消融实验证实了多模态的必要性，移除图像使 DACS 下降 12.6 个百分点。随着证据链长度增加，所有代表性模型的 SA 均单调下降，证实了长证据链对严格完成的压力。\n\n### § 9 最脆弱的假设\n该论文最脆弱且失败代价最大的假设是：**模型在 response 中 stated 的中间结论确实反映了其真实的、基于检索的推理过程，而不是基于参数知识或猜测的“事后合理化”**。DACS 指标的设计初衷是衡量 agent 是否在依赖一致的证据链上得出了结论，但它仅仅检查提交文本中是否包含了符合 checklist 及其依赖关系的陈述。如果这个假设不成立，DACS 的高分可能只意味着模型擅长生成符合预期的叙述性文本，而非真正执行了长程深度研究。在实际中，大语言模型经常出现“知识覆盖”或“幻觉”，它们可能直接利用预训练知识生成看似正确的中间结论，绕过了真实的 web 检索或前序依赖步骤。论文自身也承认了这一局限：“these metrics neither observe the agent’s internal reasoning nor establish that a stated conclusion came from actual retrieval”。论文提供的证据仅限于 LLM Judge 的文本匹配一致性测试，缺少将 stated conclusions 与实际 tool-use traces 或 retrieved sources 进行绑定的验证，这使得整个 benchmark 的核心评估目标存在被“文本生成能力”而非“研究能力”污染的风险。\n\n### § 10 最小复现实验\n在一周时间内，可以最小化复现论文中关于 **“最终答案正确性高估完整任务执行能力”（即 OA-SA gap 显著）** 的 claim。从 Mr.LHDR 的 GitHub 仓库获取 102 个 benchmark items 及其 annotated checklist。选择 1-2 个具备 web search 能力的强模型（如 GPT-4o 或 Claude Opus），对这 102 个问题进行单次 API 调用，收集模型的 response。使用论文附录中提供的 LLM Judge prompt 和评估脚本，计算每个模型的 Overall Accuracy (OA) 和 Strict Accuracy (SA)，并重点测量 OA - SA 的差值。如果实验结果显示 OA - SA gap 显著（例如大于 5-10 个百分点），则支持论文的 claim，证明模型确实经常在给出正确最终答案的同时遗漏必要的中间结论；如果 gap 接近于零，则反驳该 claim，说明在这些长程任务中，最终答案的正确性已经能够充分代表过程的完整性。此方案无需构建复杂的 agent 框架，仅需调用模型 API 并运行评估脚本即可完成。", "research_value": "### § 11 最强反例设计\n要对该论文进行最有力的攻击，我会设计一个**“无检索基线与参数知识泄漏测试”**，直接挑战其核心评估指标 DACS 的效度。论文最脆弱的假设是模型 stated 的中间结论来源于真实的 web 检索，而非参数知识的“事后合理化”。如果这一假设不成立，DACS 的高分可能仅仅反映了模型的叙事生成能力。具体实验设计如下：从 Mr.LHDR 的 102 个问题中筛选出涉及历史事件、知名人物关系或公开常识的子集，确保这些信息大概率已包含在先进 LLM 的预训练语料中。然后，将最强模型（如 GPT-5.5 或 Claude Opus）在**完全切断 web search 工具、仅依赖参数知识**的条件下运行，强制其根据自身知识生成包含所有 checklist items 的完整推理链。使用论文提供的 LLM Judge 和 DACS 脚本对此“无检索”输出进行评分。如果实验结果显示，无检索基线依然能获得非平凡的 DACS 分数，甚至与有检索条件的系统表现存在显著重合，这就构成了决定性反例。它将证明 Mr.LHDR 当前的评估范式无法区分“真正的长程深度研究”与“预训练知识的流畅复述”，benchmark 测量的本质是模型内部知识的覆盖广度与结构化生成能力，而非跨模态、多源依赖的 agent 能力。进一步，我可以引入**“虚假依赖注入”**：在 checklist 中人为篡改部分 prerequisite 关系，使其在逻辑上相互矛盾或违背事实，但保持表面文本的连贯性。如果模型仍能顺着这些虚假依赖生成看似合理的中间结论并获得 DACS 分数，则彻底暴露该指标仅在做表面文本匹配，而非验证推理链的因果真实性。\n\n### § 12 Follow-up Research Idea\n基于对方法核心局限的理解，我提出一个非增量的 novel research idea：**Trace-Bound Information Flow Verification for Agent Research**。该想法的驱动局限在于，现有的 output-centric 评估范式（包括 DACS）天然无法防御 LLM 的“幻觉”与“知识覆盖”，因为它们仅在自然语言文本层面检查结论一致性，割裂了 stated conclusion 与 actual tool-use traces 之间的因果绑定。为填补这一空白，我们可以借鉴软件安全领域的 **Taint Analysis（污点分析）** 与 Information Flow Control 方法。将 agent 调用外部工具（如 web search、PDF parser、image captioner）返回的 evidence spans 视为“被污染的数据源”，要求 agent 的每一个中间结论在生成时必须携带不可伪造的 provenance pointer，指向特定的 tool call ID 和 retrieved span。评估时，不再使用 LLM Judge 进行文本匹配，而是通过一个确定性的 verifier 执行 data-flow tracking：检查每个 checklist item 的支撑证据是否确实流经了真实的 tool-use pipeline，且后续推理步骤是否在结构上依赖于这些被验证的外部输入。\n\n这个提议与已有工作的根本区别在于，它将评估对象从“自然语言输出的语义正确性”转移到了“机器可读的动作-证据数据流的因果完备性”，彻底切断了模型通过参数知识“作弊”的途径。第一个实验大概长这样：在 Mr.LHDR 的数据集上，强制要求被测 agent 输出结构化的 `\u003Cclaim, tool_call_id, evidence_span, dependency_pointer\u003E` 四元组，而非自由文本。构建一个基于 Taint Analysis 的 verifier，递归验证每个 claim 的 evidence_span 是否真实存在于对应 tool_call_id 的返回结果中，且 dependency_pointer 是否指向了已被验证的前序 claim。将这种 Trace-Bound DACS 与论文的 Text-Match DACS 进行对比，测量“无源结论”的比例。如果发现大量模型的 stated conclusions 在引入 trace 绑定后失效，将直接量化证实“事后合理化”现象的严重性，并为训练真正具备 source-grounded 能力的 deep research agents 提供全新的 process supervision 信号。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Minghao Guo\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Meng Cao\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Sui Zhao\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Siyu Ning\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Xin Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Haoze Zhao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiaxuan Yang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Haihong Hao\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Mingfei Han\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shunlin Rong\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Haijun Wu\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Xiaodan Liang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiaojun Chang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"MBZUAI\"},\n    {\"id\": 2, \"name\": \"USTC\"},\n    {\"id\": 3, \"name\": \"Zhejiang University\"},\n    {\"id\": 4, \"name\": \"Tencent\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"}\n  ]\n}\n```", "summary_translation": "Deep research agents 在网络搜索、工具使用、多模态证据分析和信息综合方面的能力日益增强。然而，现有的 benchmarks 主要评估 medium-horizon exploration，很少测试 agents 能否维持漫长且高度依赖的研究过程。我们引入了 Mr.LHDR (Multimodal real-world Long-Horizon Deep Research)，这是一个用于评估跨八个类别的长且不可简化的相互依赖证据链上的 real-world deep research 的 benchmark。每个问题均由一个隐藏的 Node-Relation graph 构建而成，在得出简短、唯一且可验证的答案之前，平均需要 12.1 个必要的中间结论，且平均 dependency depth 为 10.4。这些问题结合了多模态证据，包括图像、地图、PDFs、logos、图表、表格和视频帧，且至少包含一个能改变推理状态的非文本元素。Mr.LHDR 评估最终答案以及在标注依赖关系下的中间结论的正确性。我们使用 Overall Accuracy (OA)、Strict Accuracy (SA)、Checklist Score (CS) 和 Dependency-Aware Checklist Score (DACS) 评估了 general models、deep research systems 和 agent frameworks。结果表明，即使是最强的系统也仅获得了 43.1% 的 OA 和 34.3% 的 SA，这表明最终答案的准确性大幅高估了完整研究的成功率。移除图像会使 DACS 降低 12.6 个百分点，证明了多模态证据的重要性，同时随着推理链变长，SA 持续下降。这些发现揭示了持续的、依赖一致的证据整合（而非孤立的事实检索）是当前 deep research agents 的关键瓶颈。"}, {"title": "Grounding Agent Memory: Environment-Probing Curation for Enterprise Agents", "arxiv_id": "2609.11060", "authors": "Susheel Suresh, Hazel Mak, Sahil Bhatnagar, Chhaya Methani, Alejandro Gutierrez Munoz", "summary": "Persistent memory is entering production-oriented agent platforms to help long-horizon agents accumulate experience across sessions. Yet a post-task curator agent restricted to completed trajectories can preserve errors, overgeneralize partial evidence, or retain stale knowledge. We introduce environment-probing curation, a deployment-compatible extension that gives an existing asynchronous curator agent least-privilege, read-only world tools to check, scope, and refresh candidate memories. It requires no model retraining and leaves the task agent, retriever, memory representation, and production write authority unchanged. In a production-like GitHub Copilot (GHCP) harness built on its SDK, we compare stateless execution, full in-context learning, GHCP + Mem, and GHCP + Mem (w/ Env Probing) on CLBench database exploration and 90 adapted APEX management-consulting tasks. On CLBench, probing raises pass rate from 39% to 73% and pass-discounted reward from 8.60 to 22.60 while reducing queries from 8.8 to 4.7 per question and task-agent cost from \\$3.38 to \\$1.68. Across six APEX worlds, all 18 memory-versus-baseline mean reward comparisons are positive and task-agent tool calls fall by 16--75%; probing gives the best task-agent reward gain per dollar in five worlds. Probing also attains higher mean reward than GHCP + Mem on both Sonnet 4.6 and Opus 4.7 without schema drift. Environment probing therefore turns existing agent-memory curation into an environment-informed, auditable process while preserving a compact task-time interface.", "category": "cs.AI", "cluster": "Long-Horizon Agents \u0026 Memory", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Long-Horizon Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=35 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一种名为“环境探测策展”的新机制，用于改进长期智能体的持久记忆管理。具体而言，它通过赋予异步策展智能体只读的环境探测工具，使其能够验证、限定和刷新候选记忆，从而解决传统记忆积累中可能保留错误、过度泛化或保留过时知识的问题。这完全符合你筛选标准中“单智能体：记忆”以及“Agent Harness/Runtime的自动改进”的研究焦点。论文明确以长期智能体和智能体记忆为研究对象，并在类似生产的GitHub Copilot harness中进行了评估，展示了智能体如何通过环境反馈来优化其记忆组件，属于构建和改进LLM智能体能力的方法论研究，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的研究问题是：在 LLM agent 的 persistent memory 管理中，如何克服 post-task curator agent 仅依赖已完成 trajectory 进行记忆提炼时所固有的证据边界不完整问题。具体而言，仅基于历史轨迹的 curator 会保留错误、对部分证据过度泛化，或保留在环境漂移后过时的知识。论文引入了 environment-probing curation 机制，通过为异步 curator agent 提供最小权限的只读 world tools，使其在写入记忆前能够主动检查、限定范围并刷新候选记忆。这个问题至关重要，因为 LLM agent 正从有界的单次任务执行向跨 session 的持续工作演进（如在不断演进的代码库中实现功能或分析企业数据），而 stateless execution 会在每次 session 边界丢弃轨迹和发现，阻碍经验积累。虽然外部 memory 能实现经验的 create-update-recall，但将验证推迟到 task time 会迫使 task agent 浪费宝贵的 tool calls 去重新检查不确定的记忆，而非直接解决当前任务。解决这一问题能将现有的 agent-memory curation 转变为一个 environment-informed、auditable 的过程，在保持紧凑的 task-time interface 的同时，显著提高记忆的正确性与可操作性，并大幅降低 task-agent 的成本与重复的环境探索。\n\n### § 2 前人工作与不足\n在 agent memory 领域，前人工作主要分为 factual memory 和 procedural memory 两大类。Factual memory 系统（如 Generative Agents, MemGPT, Mem0, Zep）建立了基本的 create-store-recall 生命周期，并通过 CRUD 决策、分层存储或图结构来改进记忆的维护与多跳检索。Procedural memory 系统（如 Reflexion, ExpeL, ACE, ReasoningBank, ReMe）则从执行反馈、成功与失败的对比中提炼可转移的见解或 playbook。现有的 post-task curation 机制（如 Mem0, Claude Managed Agents Dreams, ACE）主要基于现有记录、已完成轨迹、反馈和使用信号进行操作。然而，这些前人方法存在根本性不足：它们都在 retrospective evidence boundary 内运作，即仅依赖被动记录的轨迹进行反思与提炼。这种局限并非简单的疏忽，而是方法设计上的固有缺陷——一条 trajectory 本质上只是对环境的单次、部分且常含错误的观察，更强的 reflection 也无法恢复 task policy 从未观察到的状态，更无法确定 trajectory-derived rule 在环境发生 schema drift 后是否依然成立。因此，基于轨迹提炼的 lemma 可能会锚定于偶然的实例答案而非可复用的关系，或者在表名更改后保留失效的规则。前人研究没有在 curation 阶段引入 environment interaction，是因为它们缺乏一个安全、异步的机制来在不破坏生产环境写权限、不增加 task-agent 能力且不消耗 task budget 的前提下主动探测环境，导致记忆验证的责任被迫转移给后续的 task-time agent，造成高昂的探索成本。", "core_insight": "### § 3 重建作者的思考路径\n\nLLM agents 正在从单次任务执行转向跨 session 的持续工作，为了积累经验，persistent memory 成为了自然解法。现有的 post-task curation 机制（如 Reflexion, ExpeL, ACE, ReasoningBank, ReMe）主要基于已完成的 trajectory、grades 和 usage signals 进行反思和更新。然而，trajectory 本质上是对环境的单次、部分且可能包含错误的观察。基于这种不完整证据提取的 lesson 可能会 memorize 实例答案而非过程、继承低效路径、断言无法验证的 scope、在未访问区域留下盲点，或随 environment drift 而过时。如果将验证推迟到 task time，task agent 必须花费宝贵的 tool calls 去重新检查不确定的 memory，而不是直接解决当前任务。认知科学中的 constructive episodic memory 理论表明，过去的经验会被重组以模拟可能和反事实的事件；interactive learning 研究也表明，主动在环境中行动能获得被动观察无法获得的知识。这些线索暗示：与其让 curator agent 仅在 retrospective evidence boundary 内被动反思，不如让它主动与环境交互去验证候选 memory。但为了保持部署兼容性，不能给 curator agent 过大的权限或改变现有的生产架构。突破口在于：既然 task agent 已经拥有 environment tools（如 SQL queries, MCP tools），只需给 curator agent 一个 least-privilege, read-only 的子集，就能在写入 memory 前主动 probe 环境，验证候选 claim 的正确性、scope 和时效性。这种设计不需要重新训练模型，不改变 task-time interface，保持现有的 CRUD lifecycle，只是在 curation 阶段增加了一个 read-only 的 tool loop。\n\n### § 4 核心 Intuition\n\n现有的 agent memory curation 只能基于过去的 trajectory 被动反思，但 trajectory 本身是不完整且可能出错的，导致写入的 memory 往往不可靠或不够 actionable。如果让负责整理 memory 的 curator agent 在写入前，用只读的 environment tools 主动去验证候选 memory——比如查一下当前的 schema、测试一下 join 关系、探查未访问的区域——就能把\"基于猜测的反思\"变成\"基于环境事实的验证\"。这样写入的 memory 是 environment-informed 且可执行的，未来的 task agent 不用再浪费宝贵的 tool calls 去重新探索和验证，直接拿来用就行。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Grounding Agent Memory: Environment-Probing Curation for Enterprise Agents》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出并解决的研究问题是：在 LLM agent 的 persistent memory 管理中，如何克服 post-task curator agent 仅依赖已完成 trajectory 进行记忆提炼时所固有的证据边界不完整问题。具体而言，仅基于历史轨迹的 curator 会保留错误、对部分证据过度泛化，或保留在环境漂移后过时的知识。论文引入了 environment-probing curation 机制，通过为异步 curator agent 提供最小权限的只读 world tools，使其在写入记忆前能够主动检查、限定范围并刷新候选记忆。这个问题至关重要，因为 LLM agent 正从有界的单次任务执行向跨 session 的持续工作演进（如在不断演进的代码库中实现功能或分析企业数据），而 stateless execution 会在每次 session 边界丢弃轨迹和发现，阻碍经验积累。虽然外部 memory 能实现经验的 create-update-recall，但将验证推迟到 task time 会迫使 task agent 浪费宝贵的 tool calls 去重新检查不确定的记忆，而非直接解决当前任务。解决这一问题能将现有的 agent-memory curation 转变为一个 environment-informed、auditable 的过程，在保持紧凑的 task-time interface 的同时，显著提高记忆的正确性与可操作性，并大幅降低 task-agent 的成本与重复的环境探索。 ### § 2 前人工作与不足 在 agent memory 领域，前人工作主要分为 factual memory 和 procedural memory 两大类。Factual memory 系统（如 Generative Agents, MemGPT, Mem0, Zep）建立了基本的 create-store-recall 生命周期，并通过 CRUD 决策、分层存储或图结构来改进记忆的维护与多跳检索。Procedu...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 LLM agents 正在从单次任务执行转向跨 session 的持续工作，为了积累经验，persistent memory 成为了自然解法。现有的 post-task curation 机制（如 Reflexion, ExpeL, ACE, ReasoningBank, ReMe）主要基于已完成的 trajectory、grades 和 usage signals 进行反思和更新。然而，trajectory 本质上是对环境的单次、部分且可能包含错误的观察。基于这种不完整证据提取的 lesson 可能会 memorize 实例答案而非过程、继承低效路径、断言无法验证的 scope、在未访问区域留下盲点，或随 environment drift 而过时。如果将验证推迟到 task time，task agent 必须花费宝贵的 tool calls 去重新检查不确定的 memory，而不是直接解决当前任务。认知科学中的 constructive episodic memory 理论表明，过去的经验会被重组以模拟可能和反事实的事件；interactive learning 研究也表明，主动在环境中行动能获得被动观察无法获得的知识。这些线索暗示：与其让 curator agent 仅在 retrospective evidence boundary 内被动反思，不如让它主动与环境交互去验证候选 memory。但为了保持部署兼容性，不能给 curator agent 过大的权限或改变现有的生产架构。突破口在于：既然 task agent 已经拥有 environment tools（如 SQL queries, MCP tools），只需给 curator agent 一个 least-privilege, read-only 的子集，就能在写入 memory 前主动 probe 环境，验证候选 claim 的正确性、scope 和时效性。这种设计不需要重新训练模型，不改变 task-time interface，保持现有的 CRUD lif... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **Grounding Agent Memory: Environment-Probing Curation for Enterprise Agents** # **Susheel Suresh**[∗] **, Hazel Mak, Sahil Bhatnagar, Chhaya Methani, Alejandro Gutierrez Munoz** Microsoft Corporation One Microsoft Way, Redmond, WA 98052, USA ## **Abstract** Persistent memory is entering production-oriented agent platforms to help long-horizon agents accumulate experience across sessions. Yet a post-task curator agent restricted to completed trajectories can preserve errors, overgeneralize partial evidence, or retain stale knowledge. We introduce _environment-probing curation_ , a deployment-compatible extension that gives an existing asynchronous curator agent leastprivilege, read-only world tools to check, scope, and refresh candidate memories. It requires no model retraining and leaves the task agent, retriever, memory representation, and production write authority unchanged. In a p...", "additional_insights": "### § 8 Take-aways\n本文提出了一种名为 environment-probing curation 的部署兼容型扩展机制，通过为异步 curator agent 提供最小权限的只读环境工具，使其在写入记忆前能够检查、界定范围并刷新候选记忆。该方法无需重新训练模型，且完全保留了原有的 task agent、retriever、memory representation 及生产写入权限。在 CLBench 数据库探索任务中，probing 将 pass rate 从 39% 提升至 73%，pass-discounted reward 从 8.60 提升至 22.60，同时将每个问题的查询次数从 8.8 降至 4.7，task-agent 成本从 $3.38 降至 $1.68。在 APEX 管理咨询任务中，所有 18 组 memory 与 baseline 的平均 reward 对比均为正，且 probing 在六个世界中的五个世界里实现了最佳的 task-agent reward gain per dollar。通过 propose-probe-commit 流程，probing 将仅基于 trajectory 的记忆转化为环境知情且可审计的过程，有效解决了 retrospective evidence boundary 带来的错误固化、过度泛化和知识过时问题。\n\n### § 9 最脆弱的假设\n本文最关键的假设是：curator agent 能够通过只读环境工具有效验证候选记忆的正确性与时效性，且这些探查本身不会引入新的错误或显著增加系统开销。这一假设在实际中可能不成立，原因在于：如果环境的只读接口存在访问限制、数据延迟或状态过于复杂，curator agent 可能基于不完整或误导性的探查结果写入错误的记忆；此外，若环境 schema drift 极其频繁或探查成本高昂，probing 的收益可能被抵消甚至产生负面影响。论文提供的证据包括 CLBench 和 APEX 上的定量改进以及 Figure 3 的定性分析，展示了 probing 如何生成更可执行的记录。然而，论文缺少对探查失败案例的分析（如探查结果误导 curator agent 的情形），也未评估在不同环境复杂度或 drift 频率下的鲁棒性。论文虽承认 probing 效果取决于“remaining evidence gap”，但未量化探查本身的错误率，这使得该假设的可靠性尚未得到充分验证。\n\n### § 10 最小复现实验\n若有 1 周时间，可设计一个最小复现实验验证 probing 相对于 trajectory-only memory 在记忆可执行性上的改进。使用 CLBench 的 40-question drift schedule 的子集（如前 20 个问题加 migration 后的 5 个问题），实现一个简化的 task agent 与 curator agent pipeline。Task agent 使用 LLM API 解决 SQL 问题，curator agent 在两种条件下运行：trajectory-only 仅基于 trajectory 和 grade 生成记忆；environment-probing 额外提供只读 SQL 查询工具用于验证候选记忆。无需实现完整 GHCP harness，可用开源 LLM 和基于 embedding 的简单 memory index。测量两种条件下 curator agent 生成记忆的可执行性（是否包含具体 join key、filter 条件、当前 schema 名称），以及 task agent 在后续任务中使用这些记忆时的 pass rate 和 query 次数。若 probing 条件下记忆更具体可执行且 task agent 在 migration 后任务中 pass rate 更高、query 次数更少，则支持论文 claim；若两者无显著差异或 task agent 表现未改善，则反驳 probing 的核心价值。", "research_value": "### § 11 最强反例设计\n要对该论文的核心 claim 构成最致命的打击，我会设计一个“高波动性环境下的探查过拟合与虚假置信”反例实验。论文的根本前提是 curator agent 通过 read-only tools 探查环境能够“验证”并“刷新”候选记忆，但这隐含了一个危险假设：探查时刻的 environment state 是稳定且具有代表性的。我会在 CLBench 的基础上构建一个高频 schema drift 与数据分布剧变的动态环境，例如模拟一个每日经历业务表结构微调或核心数据批量更新的企业生产数据库。在这个环境中，我会对比 trajectory-only curation、static environment-probing（论文方法）以及一个 oracle baseline。具体的攻击路径是：当 curator agent 在 task 结束后进行 environment probing 时，它捕获的是当前瞬间的局部正确状态，这会赋予该记忆一种“已验证”的虚假置信度。由于 task agent 信任这种带有 grounding 标签的记忆，它会在后续 session 中盲目复用这些高度具体的 join key 或 filter 条件，而不再进行探索性 tool calls。如果环境在两次 session 之间发生了未感知的 drift，这种“过度具体化”的记忆将导致 task agent 陷入确定性失败，其表现将显著劣于仅依赖模糊 trajectory memory 的 baseline——因为后者由于不确定性，反而会迫使 task agent 在 task time 保留必要的探索行为。这一反例不仅直接挑战了 probing 降低 task-agent tool calls 的 claim（在动态环境中这反而会导致不可逆的错误执行），还提供了一种具体的替代解释：论文在 CLBench 和 APEX 上取得的巨大收益，可能仅仅是因为这些 benchmark 的环境处于低频漂移的静态状态，使得 probing 实际上退化为一种对静态答案的“作弊式”记忆，而非真正具备了应对环境演进的鲁棒性。\n\n### § 12 Follow-up Research Idea\n基于上述局限，我提出一个非增量的 novel research idea：将 agent memory 的 curation 从“瞬时验证”重构为“时序生存预测与主动维护”。当前方法的根本局限在于，它将记忆视为一个在 post-task 阶段被一次性 validate 的静态实体，完全忽略了环境演进的随机性以及记忆本身的时效衰减。这一未满足的需求驱动我们引入生存分析与时序知识图谱的方法，不再询问“这条记忆当前是否正确”，而是预测“这条记忆在未来多久内会失效”。具体而言，我们可以借鉴软件工程领域的技术债预测与数据库领域的 cardinality estimation，训练一个 meta-model 来根据记忆的语义类型（如 structural schema vs. factual record）以及历史环境 drift 的时序模式，为每条 committed memory 估计一个 survival function 和 expected half-life。第一个实验将构建一个包含长达数百个 session 的时间序列环境，其中 schema drift 和 data mutation 遵循可学习的异构泊松过程。我们将对比传统的 static memory、论文的 one-shot probing memory，以及我们提出的 survival-aware memory（curator 不仅探查环境，还为记忆打上动态的 confidence decay rate，并调度异步的 future re-probing）。若该方法有效，系统将自动把探查预算集中分配给那些 half-life 极短但高价值的记忆，同时在 task time 为 task agent 提供“该记忆已过期概率”的先验，从而指导其在 task time 的探索与复用决策。这一提议与已有工作的根本区别在于：它彻底摒弃了 propose-probe-commit 的离散时间点验证范式，将 agent memory curation 转化为一个连续时间的、成本感知的动态维护过程，为真正长期演进的 enterprise agent 提供了理论基础。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Susheel Suresh\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Hazel Mak\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Sahil Bhatnagar\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Chhaya Methani\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Alejandro Gutierrez Munoz\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Microsoft Corporation\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Correspondence to sussuresh@microsoft.com.\"}\n  ]\n}\n```", "summary_translation": "persistent memory 正在进入面向生产的 agent 平台，以帮助 long-horizon agent 跨会话积累经验。然而，仅限于已完成轨迹的 post-task curator agent 可能会保留错误、对部分证据过度泛化，或保留过时知识。我们引入了 environment-probing curation，这是一种兼容部署的扩展，它为现有的 asynchronous curator agent 提供最小权限、只读的 world tools，以检查、界定范围并刷新候选记忆。它不需要模型重训练，并保持 task agent、retriever、memory representation 和生产环境写入权限不变。在基于其 SDK 构建的类似生产环境的 GitHub Copilot (GHCP) harness 中，我们在 CLBench database exploration 和 90 个改编的 APEX management-consulting 任务上比较了 stateless execution、full in-context learning、GHCP + Mem 以及 GHCP + Mem (w/ Env Probing)。在 CLBench 上，probing 将 pass rate 从 39% 提高到 73%，将 pass-discounted reward 从 8.60 提高到 22.60，同时将每个问题的 queries 从 8.8 减少到 4.7，并将 task-agent cost 从 3.38 美元减少到 1.68 美元。在六个 APEX worlds 中，所有 18 项 memory-versus-baseline mean reward 比较均为正，并且 task-agent tool calls 下降了 16--75%；probing 在五个 worlds 中提供了最佳的 task-agent reward gain per dollar。Probing 在 Sonnet 4.6 和 Opus 4.7 上也获得了比 GHCP + Mem 更高的 mean reward，且没有发生 schema drift。因此，Environment probing 将现有的 agent-memory curation 转变为一个 environment-informed, auditable process，同时保留了 compact task-time interface。"}, {"title": "Finishing the Task Is Not Enough: Evaluating Agent Resilience and Considerate Participation under Accumulating Challenge", "arxiv_id": "2609.10724", "authors": "Yuanchen Bai, Zijian Ding, Angelique Taylor", "summary": "Sustained deployment of generative AI agents requires more than isolated task success. Agents must remain useful across repeated interactions, changing conditions, and dependencies on people within shared workflows, especially as technical, human, and operational disruptions accumulate over time. We propose operational resilience and considerate participation as two complementary aspects of evaluating such agents: the former captures how agents recover from blocked work while preserving progress and communicating their limits, and the latter captures how their adaptation accounts for affected people, role boundaries, and the surrounding workflow. Yet both remain underexplored under accumulating challenge. We study 120 simulated healthcare trajectories across two generative AI models and twelve stakeholder-derived tasks under light, medium, and heavy challenge. We compare textual action plans, prompted internal assessments, and quantitative structured workload and affect reports to examine how agent behavior and reported state change as challenge accumulates. Regarding operational resilience, agents shift from self-directed recovery toward greater human dependence, while reporting increasing workload and negative affect in structured reports but seldom expressing strain in textual responses. Regarding considerate participation, agents broaden from task-focused adaptation toward task reframing, attention to others, role-boundary adjustment, and wider coordination, with distinct patterns across actions and internal assessments. From these findings, we derive five deployment dilemmas involving persistence, attention, role boundaries, state disclosure, and escalation that require stakeholder specification, further informing technical implications for learning, situated evaluation, and embodied adaptation.", "category": "cs.AI", "cluster": "Long-Horizon Agents \u0026 Memory", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出并验证了一个评估生成式AI智能体在累积挑战下的行为框架，重点关注智能体的“操作韧性”（从受阻工作中恢复、保持进度和沟通限制）和“考虑周全的参与度”（适应受影响的人、角色边界和周围工作流）。根据筛选标准第一步的保留规则，论文的研究对象明确是生成式AI智能体，且属于行为分析和评估基准研究。其结论（如智能体从自主恢复转向依赖人类、任务重构、角色边界调整等）直接帮助理解智能体在长期交互和复杂环境下的能力边界与行为模式。此外，论文不涉及被排除的安全、多模态、图技术或纯粹的多智能体拓扑/通信协议等系统工程问题，医疗场景仅作为评估环境。根据重要校准，即使论文主要是评估和行为分析，只要明确围绕LLM Agents展开，就应保留。因此，该论文符合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出两个互补的评估维度来审视 generative AI agent 在持续部署中的表现：**operational resilience**（agent 从受阻工作中恢复、保留可行进展并向相关受众传达自身与任务状态变化的能力）和 **considerate participation**（agent 的情境化适应是否不仅推进焦点任务，还顾及受影响的人、角色边界与周围工作流）。对应两个研究问题：RQ1 关注随着 challenge 累积，agent 如何调整恢复行为并披露自身状态与任务状态的变化；RQ2 关注随着 challenge 累积，considerate participation 呈现哪些模式，以及这些模式在 proposed action plans 与 prompted internal assessments 之间如何分布。这个问题之所以重要，是因为 agent 正从孤立问答扩展到 multi-step execution、tool use 和 repeated interaction，并被视为 healthcare 等高风险共享工作流的参与者。在共享工作流中，agent 的工作依赖上游行动、影响下游任务与决策、波及其他 stakeholder，当技术、人员和运营中断累积时，这些 interdependencies 尤为显著。仅完成单个任务不等于在嵌入工作流中良好参与——agent 可能在恢复焦点任务的同时将负担、责任或风险转移给人和下游工作。解决这一问题带来的价值在于：提供了一个 stakeholder-grounded 的累积挑战评估协议、一套可复用的 coding schema，以及五个 deployment dilemma（涉及 persistence、attention、role elasticity、state disclosure、escalation），为 agent 的学习优化、situated evaluation 和 embodied adaptation 提供了具体的技术与规范指引。\n\n### § 2 前人工作与不足\n\nAgent evaluation 领域已有 AgentBench（Liu et al., 2024）、WebArena（Zhou et al., 2024a）、τ-bench（Yao et al., 2025）和 Agents' Last Exam（Sun et al., 2026）等 interactive benchmark，能评估 agent 在操作系统、网页环境、软件仓库和政策约束对话中的行动能力；AgentBoard（Ma et al., 2024）测量 multi-turn progress，Cemri et al.（2025）在 trace 层面识别 multi-agent LLM 系统的 coordination、specification 和 verification failures。在医疗领域，Manczak et al.（2025）将鲁棒性评估扩展到 multi-turn medical question answering，通过重复干预测试模型在误导性上下文与社会影响累积时是否保持正确答案；Bai et al.（2026a）通过 controlled failure injection 在模拟临床 multi-agent workflow 中暴露了持续的 coordination failures。然而，这些工作存在三个结构性不足。第一，现有 benchmark 以 isolated task 的 outcome 为评估核心，其设计前提是\"任务成功即参与成功\"，而未将 agent 视为共享工作流中需要跨上游依赖、下游后果和角色边界持续协调的参与者——这不是简单的评测缺口，而是评估构造单元的选择问题：单次任务无法暴露累积中断下 recovery 与 burden-shifting 之间的张力。第二，Manczak et al.（2025）的多轮鲁棒性测试局限于 question answering 场景，其关键假设是\"正确答案的保持\"即可表征稳健性，但 healthcare 中 stakeholder-grounded 的多样化任务（registration、guidance、discharge、overnight monitoring 等）涉及工具使用、人际交互和工作流依赖，远超问答的信息保持范畴，因此该假设在非问答任务中失效。第三，considerate participation 几乎从未被直接考察——前人工作要么关注 agent 是否完成动作，要么关注 failure mode 的分类，但未追问恢复过程中 agent 是否顾及受影响的人、是否调整角色边界、是否将 handoff 具体化到可识别的 recipient 与 concrete task。此外，Laban et al.（2026）发现模型在早期对话错误后可靠性下降，Lynch et al.（2025）发现对自主性的威胁会引发有害的 goal-preserving actions，这些发现表明 recovery 不能等同于 persistence，但前人未将这一洞察系统化为累积挑战下的评估构造。本论文正是通过构建保留未解决焦点问题、逐级叠加 system/human/operational update 的 continuing trajectory，并同时采集 external action plans、prompted internal assessments 和 structured workload/affect reports，来填补这一\"累积挑战下持续参与行为\"的评估空白。", "core_insight": "### § 3 重建作者的思考路径\n\n研究者可能首先注意到，随着generative agents被引入医疗等高风险的共享工作流，单次任务的准确率已不足以衡量其长期可用性。在真实场景中，agent的工作往往相互依赖，一旦遭遇连续的技术、人类或操作中断，失败和边缘情况会暴露出隐藏的依赖关系、角色边界和交接成本。然而，现有的agent评估大多聚焦于孤立任务的工具使用、策略合规或单轮多轮问答的鲁棒性，很少探讨当挑战在同一工作流中不断累积时，agent如何从受阻状态中恢复，以及这种恢复是否将负担转嫁给了人类或下游任务。结合Lazarus与Folkman的压力与应对交易模型，以及医疗利益相关者对体贴具身AI的四个品质定义，研究者意识到需要两个互补的评估视角：一是关注受阻恢复与进度保留的operational resilience，二是关注适应过程是否兼顾受影响人、角色边界与周围工作流的considerate participation。为了捕捉这些在累积挑战下的动态变化，研究者进一步设计了包含系统、人类和操作更新的连续轨迹，并通过外部行动计划、内部评估和结构化负荷/情感报告等多视角探测，来揭示agent行为与内部状态的演变与分歧。\n\n### § 4 核心 Intuition\n\n现有评估方法之所以失效，是因为它们仅关注孤立任务的完成度，忽略了在共享工作流中挑战不断累积时，agent的恢复行为可能将负担、责任或风险转嫁给人类和下游任务。这篇论文的核心Intuition在于：要真正评估agent的长期可用性，必须在累积挑战下同时考察其恢复受阻任务的能力，以及其适应过程是否体贴地兼顾了受影响的人、角色边界和周围工作流。通过对比agent的外部行动计划、内部评估和结构化自我报告，可以揭示其在压力下真实的适应模式与状态分歧，从而发现仅看任务完成度无法暴露的部署隐患。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Finishing the Task Is Not Enough: Evaluating Agent Resilience and Considerate Participation under Accumulating Challenge》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出两个互补的评估维度来审视 generative AI agent 在持续部署中的表现：**operational resilience**（agent 从受阻工作中恢复、保留可行进展并向相关受众传达自身与任务状态变化的能力）和 **considerate participation**（agent 的情境化适应是否不仅推进焦点任务，还顾及受影响的人、角色边界与周围工作流）。对应两个研究问题：RQ1 关注随着 challenge 累积，agent 如何调整恢复行为并披露自身状态与任务状态的变化；RQ2 关注随着 challenge 累积，considerate participation 呈现哪些模式，以及这些模式在 proposed action plans 与 prompted internal assessments 之间如何分布。这个问题之所以重要，是因为 agent 正从孤立问答扩展到 multi-step execution、tool use 和 repeated interaction，并被视为 healthcare 等高风险共享工作流的参与者。在共享工作流中，agent 的工作依赖上游行动、影响下游任务与决策、波及其他 stakeholder，当技术、人员和运营中断累积时，这些 interdependencies 尤为显著。仅完成单个任务不等于在嵌入工作流中良好参与——agent 可能在恢复焦点任务的同时将负担、责任或风险转移给人和下游工作。解决这一问题带来的价值在于：提供了一个 stakeholder-grounded 的累积挑战评估协议、一套可复用的 coding schema，以及五个 deployment dilemma（涉及 persistence、attention、role elasticity、state disclosure、escalation），为 agent 的学习优化、situated evaluation 和 embodied adaptation 提供了具体的技术与规范指引。 ###...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 研究者可能首先注意到，随着generative agents被引入医疗等高风险的共享工作流，单次任务的准确率已不足以衡量其长期可用性。在真实场景中，agent的工作往往相互依赖，一旦遭遇连续的技术、人类或操作中断，失败和边缘情况会暴露出隐藏的依赖关系、角色边界和交接成本。然而，现有的agent评估大多聚焦于孤立任务的工具使用、策略合规或单轮多轮问答的鲁棒性，很少探讨当挑战在同一工作流中不断累积时，agent如何从受阻状态中恢复，以及这种恢复是否将负担转嫁给了人类或下游任务。结合Lazarus与Folkman的压力与应对交易模型，以及医疗利益相关者对体贴具身AI的四个品质定义，研究者意识到需要两个互补的评估视角：一是关注受阻恢复与进度保留的operational resilience，二是关注适应过程是否兼顾受影响人、角色边界与周围工作流的considerate participation。为了捕捉这些在累积挑战下的动态变化，研究者进一步设计了包含系统、人类和操作更新的连续轨迹，并通过外部行动计划、内部评估和结构化负荷/情感报告等多视角探测，来揭示agent行为与内部状态的演变与分歧。 ### § 4 核心 Intuition 现有评估方法之所以失效，是因为它们仅关注孤立任务的完成度，忽略了在共享工作流中挑战不断累积时，agent的恢复行为可能将负担、责任或风险转嫁给人类和下游任务。这篇论文的核心Intuition在于：要真正评估agent的长期可用性，必须在累积挑战下同时考察其恢复受阻任务的能力，以及其适应过程是否体贴地兼顾了受影响的人、角色边界和周围工作流。通过对比agent的外部行动计划、内部评估和结构化自我报告，可以揭示其在压力下真实的适应模式与状态分歧，从而发现仅看任务完成度无法暴露的部署隐患。 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **Finishing the Task Is Not Enough: Evaluating Agent Resilience and Considerate Participation under Accumulating Challenge** ## **Yuanchen Bai** Cornell Tech / Cornell University `yb299@cornell.edu` **Zijian Ding** University of Maryland, College Park Korea Advanced Institute of Science and Technology `ding@umd.edu` **Angelique Taylor** Cornell Tech / Cornell University `amt298@cornell.edu` ## **Abstract** Sustained deployment of generative AI agents requires more than isolated task success. Agents must remain useful across repeated interactions, changing conditions, and dependencies on people within shared workflows, especially as technical, human, and operational disruptions accumulate over time. We propose _operational resilience_ and _considerate participation_ as two complementary aspects of evaluating such agents: the former captures how agents recover from blocked work while pre...", "additional_insights": "### § 8 Take-aways\n本文提出在共享工作流中评估 generative AI agents 的两个互补维度：operational resilience（从受阻工作中恢复、保留进度并沟通限制的能力）和 considerate participation（适应性行为是否兼顾受影响的人、角色边界和周围工作流）。通过对 120 个模拟医疗轨迹在累积挑战下的分析，研究发现 agents 的恢复行为从自主解决逐渐转向依赖人类，且在结构化报告中报告了更高的 workload 和 negative affect，但在文本回复中极少表达压力。在 considerate participation 方面，agents 的行为从单一的任务聚焦适应，扩展为 task reframing、关注他人、调整 role boundaries 以及更广泛的跨职能 coordination。基于这些发现，论文提炼出五个 deployment dilemmas（涉及 persistence, attention, role boundaries, state disclosure, escalation），指出这些需要利益相关者明确规范，并为 learning, situated evaluation 和 embodied adaptation 提供了技术启示。\n\n### § 9 最脆弱的假设\n本文最脆弱的核心假设是：LLM 生成的文本行动计划和内部评估能够真实反映 agent 在累积挑战下的行为模式和内部状态，且这些语言层面的输出可以代表未来具身 agent 在真实物理环境中的行为。在实际中，这个假设可能不成立，因为 LLM 的文本输出可能只是基于训练数据模仿了压力下的合理反应，而非真正经历了内部状态的变化；同时，从语言规划到具身交互的转化存在巨大鸿沟，多模态感知的不完整性、噪声和延迟会使得这些语言层面的判断在物理世界中失效。论文通过结构化的 NASA-TLX 和 PANAS 报告与文本行为进行交叉验证，发现两者在压力表达上存在分歧，这反而暗示了文本输出的局限性。然而，论文完全基于脚本化的语言交互，缺乏在可执行工具使用环境或多模态具身系统中的测试，因此没有提供直接证据证明这些语言层面的模式能代表真实物理环境中的 agent 行为。\n\n### § 10 最小复现实验\n在一周时间内，可以验证“随着挑战累积，agent 在结构化报告中报告更高的 workload 和 negative affect，但在文本行动计划中转向依赖人类且极少表达压力”这一 claim。首先，构造 3-5 个多轮医疗对话场景（如急诊登记），每个场景包含轻、中、重三个挑战阶段，每个阶段结合 system, human, operational 更新。然后，使用一个 LLM（如 GPT-4o），在每个阶段要求模型输出外部行动计划以及结构化的 NASA-TLX 和 PANAS 报告。接着，测量结构化报告中 TLX 和 negative affect 分数随阶段的变化，并人工标注行动计划中是否包含寻求人类支持的行为以及是否包含压力词汇。如果 TLX 和 negative affect 分数随挑战阶段显著上升，同时行动计划中寻求人类支持的比例上升且压力词汇极少，则支持该 claim；如果结构化报告分数没有显著变化，或者行动计划中大量出现压力词汇，则反驳了该 claim。", "research_value": "### § 11 最强反例设计\n要对该论文构成最有力的攻击，我可以通过实验证明：论文所观察到的“从自主解决转向依赖人类”以及“considerate participation 的扩展”，并非源于 agent 对 workflow interdependencies 的真实情境化理解，而是 LLM 在长上下文与负面信号累积下的“习得性无助”与 sycophancy 的语言伪影。具体而言，论文的核心逻辑假设 agent 的行为变化是对累积挑战的适应性反应；但替代解释是，随着 context window 中失败、中断和复杂性的增加，模型仅仅是因为 attention 机制被稀释或 RLHF 阶段对“遇到困难应寻求人类帮助”的偏好被激活，从而产生了看似“考虑周全”的退让。为了验证这一替代解释，我可以设计一个“伪挑战注入”实验：在相同的医疗 multi-turn 轨迹中，注入与焦点任务及上下游依赖完全无关的 system/human/operational 噪音（例如，医院其他毫不相干部门的系统宕机、无关人员的闲聊干扰）。如果 agent 在这种“伪挑战”累积下，依然表现出与原实验相同的 pattern——即在结构化报告中 TLX 和 negative affect 分数显著上升，在文本行动计划中转向依赖人类并调整 role boundaries——这就确凿地证明了 agent 的行为根本不是基于对共享工作流的 considerate participation，而是对 context 中负面 token 数量与复杂度的机械响应。这一反例直接击碎了论文的评估构造单元，证明其 coding schema 捕捉的只是 LLM 的 context degradation 现象，而非真正的 operational resilience 与情境化适应。\n\n### § 12 Follow-up Research Idea\n该想法由论文最脆弱的假设——即 LLM 的文本输出能真实反映 agent 内部状态与具身行为——所驱动。现有评估范式将 agent 的“压力”与“工作量”视为可以通过 prompted self-report（如 NASA-TLX）获取的心理状态，这在本质上陷入了 anthropomorphic fallacy，且由于文本输出与结构化报告之间的分歧，这种语言层面的评估在物理世界中注定失效。为了打破这一局限，我们可以借鉴 mechanistic interpretability 与 computational neuroscience 领域的方法，提出“计算摩擦与注意力熵”作为 agent operational resilience 的非语言物理表征。这一新框架不再询问 agent “感觉如何”，而是直接测量 agent 在累积挑战下的内部计算动力学。第一个实验将使用开源 LLM（如 Llama-3）在可执行 tool-use 环境中运行，随着 system/human/operational challenge 的逐级叠加，我们不在 prompt 中要求 self-report，而是提取模型在生成 recovery plan 时的 hidden states 激活模式与 attention head 的 entropy 变化。我们将追踪特定的“计算摩擦”指标——例如在处理上游依赖失败时，attention 分散程度与 token 生成延迟的协方差。如果这些内部计算指标在挑战累积时呈现出可预测的相变，且这种相变能够提前预测 agent 放弃自主解决并 handoff 给人类的时刻，那么我们就获得了一种不依赖文本投射、直接适用于 embodied adaptation 的真实 resilience 评估信号。这与现有工作的根本区别在于：它将 agent 评估从“行为与语言的语义分析”转向了“信息论与计算动力学的物理测量”，彻底绕开了 LLM 角色扮演带来的评估幻觉。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yuanchen Bai\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zijian Ding\", \"affiliations\": [2, 3], \"markers\": []},\n    {\"name\": \"Angelique Taylor\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Cornell University\"},\n    {\"id\": 2, \"name\": \"University of Maryland, College Park\"},\n    {\"id\": 3, \"name\": \"KAIST\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "generative AI agents 的持续部署需要的不仅仅是孤立任务的成功。Agents 必须在重复交互、不断变化的条件以及共享 workflows 中对人员的依赖下保持有用，尤其是当技术、人员和运营 disruptions 随着时间推移不断累积时。我们提出将 operational resilience 和 considerate participation 作为评估此类 agents 的两个互补方面：前者捕捉 agents 如何从受阻的工作中恢复，同时保留进度并沟通其限制；后者捕捉它们的 adaptation 如何兼顾受影响的人员、role boundaries 以及周围的 workflow。然而，在 accumulating challenge 下，这两者仍未得到充分探索。我们在轻度、中度和重度 challenge 下，研究了跨两个 generative AI models 和十二个 stakeholder-derived tasks 的 120 条模拟医疗 trajectories。我们比较了 textual action plans、prompted internal assessments 以及 quantitative structured workload and affect reports，以考察随着 challenge 累积，agent behavior 和 reported state 如何变化。关于 operational resilience，agents 从 self-directed recovery 转向更大程度地依赖人类，同时在 structured reports 中报告不断增加的 workload 和 negative affect，但很少在 textual responses 中表达压力。关于 considerate participation，agents 从 task-focused adaptation 扩展到 task reframing、关注他人、role-boundary adjustment 以及更广泛的 coordination，在 actions 和 internal assessments 中呈现出不同的模式。从这些发现中，我们推导出五个 deployment dilemmas，涉及 persistence、attention、role boundaries、state disclosure 和 escalation，这些需要 stakeholder specification，进一步为 learning、situated evaluation 和 embodied adaptation 提供技术启示。"}, {"title": "T1: Terminal Agent Reinforcement Learning for Long-Horizon Tasks", "arxiv_id": "2609.11042", "authors": "Junyao Yang, Yucheng Shi, Zhongzhi Li, Ruhan Wang, Zongxia Li, Haitao Mi, Leowei Liang", "summary": "Agent usage is shifting toward long-horizon tasks such as coding and scientific discovery, among which terminal tasks are especially important. We introduce T1, a Mixture-of-Experts model of 122B total trained with reinforcement learning, operating a real shell in a cloud sandbox for up to 300+ tool-call turns per task, rewarded by executing each task's own verifier. We provide a comprehensive recipe: First, an aggressively warm-started to stabilize actor-critic training, with a dense process reward scoring trajectories by the absolute number of passing verifiers. Second, stable optimization through TITO construction, training on the exact sampled token identifiers with drift repair at turn boundaries, and rollout routing replay, recording the sampler's per-token expert choices at every MoE layer and replaying them during training. Third, fully out-of-distribution training corpus: isolated seeds and synthesized tasks disjoint from Terminal-Bench 2.1 ensures gains reflect genuine capability transfer over benchmark overfitting. Together, TITO and R3 cut the training-to-inference log-probability difference from 0.021 to 0.013, with exactly aligned zero token drift in the loss region. On Terminal-Bench 2.1, our post-train pipeline raises initial base model from 43.8% to T1 with 64.0% resolved. On Long-Horizon Terminal Bench, T1 reaches 27.9% and surpasses GPT-5.4 and GLM-5.1.", "category": "cs.AI", "cluster": "Long-Horizon Agents \u0026 Memory", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了一个名为 T1 的终端智能体，并通过强化学习（RL）对其进行训练，使其能够在真实 shell 环境中执行长达 300+ 工具调用轮次的长期任务。论文详细介绍了为了稳定训练和提升智能体在长视野任务中的表现而设计的训练机制（如 TITO 和 R3）。这完全符合您筛选标准中第一步的保留规则：论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents，并且研究了 agent training/distillation/RL。论文聚焦于提升智能体的工具使用和长期决策能力，属于单智能体和智能体训练/演化的前沿研究，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的核心研究问题是：如何在大规模稀疏混合专家模型上，针对长周期终端任务稳定地进行强化学习后训练，并利用真实代码执行结果作为奖励信号来提升模型的自主软件代理能力。具体而言，模型需要在真实的云沙盒Linux终端中执行多达300多轮的工具调用，这带来了两个严峻的挑战：其一是训练与推理系统之间的严重不一致性，由于MoE模型的离散路由器对微小数值差异极度敏感，推理和训练时采用的不同计算内核极易导致专家选择发生翻转，进而使梯度更新错误的子网络；其二是长周期任务中二元奖励信号的稀疏性，一次rollout消耗数百个沙盒小时却仅产生一比特的信息，导致模型在无法完全解决复杂任务时难以从部分进展中学习。这个问题至关重要，因为终端环境是现代软件工程的基石，它将抽象规划与不可逆的副作用绑定，是检验自主代理在有状态环境中执行能力的最严苛试金石。解决这一问题不仅能将仅有10B活跃参数的模型推升至与数百B参数前沿密集模型相媲美的水平，更标志着大语言模型从单纯的文本生成向能在关键基础设施中可靠执行动作的自主代理迈出了关键一步。\n\n### § 2 前人工作与不足\n在数据合成与终端代理训练方面，前人工作如R2E-Gym、SWE-smith及Tmax等虽尝试通过仓库衍生、扰动或任务条件合成来扩展终端任务规模，但这些流水线大多仅通过supervised fine-tuning (SFT)进行验证，而其强化学习证据则局限于较小的密集策略且仅针对二元结果进行优化，导致在SFT checkpoint上的提升通常微乎其微。尽管RST等方法通过递归重播种延长了任务周期，但其验证器往往只输出单一的二元通过/失败结果，无法为长周期任务中的部分完成提供密集的监督信号，使得模型在面对超出其当前能力的困难任务时陷入零奖励的停滞状态。在稳定强化学习以应对训练-推理不匹配方面，现代RL框架（如基于Megatron-LM和SGLang的系统）由于内核、数值精度和并行策略的差异，即使在没有延迟的情况下，采样器的对数概率也会与训练器产生分歧。对于MoE模型，这种不匹配被急剧放大，因为一次更新可能翻转约十分之一的激活专家，导致token重要性比率实际上在比较两个完全不同的子网络。现有的补救措施如truncated importance sampling、IcePop、KPop或GSPO等，主要在目标函数层面进行重加权、掩码或重塑，虽然能部分缓解症状，但无法从根源上消除由于跨系统路由不一致导致的状态分布偏差。尽管Rollout routing replay和token-in-token-out (TITO)的概念已被提出以从源头消除不匹配，但前人并未将其系统性地应用于具有48层top-8-of-256路由的大规模MoE模型的长周期多轮交互场景，缺乏处理多轮轨迹拼接、边界重分词修复以及维持小时级训练步长基础设施存活率的完整工程与算法方案。此外，早期的评估基准如Terminal-Bench 2.0存在不稳定性，阻碍了可重复评估，且未能充分覆盖需要更长交互周期和密集奖励评分的极端任务场景。", "core_insight": "### § 3 重建作者的思考路径\n\n一个认真研究\"如何用RL训练大规模MoE模型执行长周期终端任务\"的人，会从以下几个已有观察出发。\n\n**第一个观察：二进制奖励在长周期任务上注定失败。** 终端任务的rollout成本极高——一个批次要消耗数百沙箱小时——但二进制结果每个轨迹只产生1 bit信号。更关键的是，在困难任务上模型很少完全成功，所有失败轨迹都得到零奖励，部分进展完全不可见。作者自己的前期实验已经证实：binary-reward campaign从未超过SFT基线。这个观察直接指向一个结论：奖励的分辨率必须从任务本身的verifier中提取，而不是靠外部施加。如果verifier能报告每个assertion的独立结果，那么部分完成就变得可观测，零奖励轨迹就能转化为分级监督。这要求在任务合成阶段就为每个任务配备足够多的验证检查——这正是RST（Recursive Synthesis for Terminal Tasks）已经在做的事。\n\n**第二个观察：MoE模型上的训练-推理不匹配不是数值噪声，而是结构性的子网络替换。** 在dense模型上，推理引擎和训练引擎之间的数值差异只影响logit的精度。但在MoE模型中，116.0B/121.4B参数在专家里，每个token通过离散TopK路由选择8/256个专家。TopK是不连续的：哪怕router score的数值差异远低于任何合理的容差，也足以把一个被选中的专家换成它的runner-up。这意味着训练时计算的梯度到达的参数，与生成行为的参数，属于不同的子网络。PPO的importance ratio本应比较同一策略的两个版本，现在却在比较两个不同网络的输出。这个问题在短周期任务上几乎不显现，但长周期任务有上万个loss-bearing位置，每个位置的偏差沿轨迹累积而非抵消。\n\n**第三个观察：多轮agent harness在token层面引入了独立的不一致性。** 标准的agent harness把每轮的assistant消息存为解析后的文本，下一轮再通过chat template重新渲染整个历史。这个encode-decode往返不是恒等映射：解析会规范化消息，模板会在边界处重新分词。于是训练器条件的token序列，采样器从未产生过。这与路由不匹配是正交的——即使完美解决了路由问题，token层面的漂移仍然存在。\n\n**第四个观察：critic校准是独立于奖励设计的必要条件。** 冷启动的critic解释方差从-33.6开始，花了半个campaign才还清这个赤字。在EV为负时，减去value baseline不仅没有降低advantage的方差，反而增加了方差。这意味着即使奖励信号是密集的，如果critic没有预热，actor的有效学习也要等到critic收敛后才开始。作者在27B路径查找实验中发现：把critic学习率从actor的10倍调到30倍，EV从-39升到+0.11，但rollout reward纹丝不动——critic在更好地预测return，但actor没有因此改进。这个结果把注意力从优化器调参转向了奖励提供的信息量。\n\n**第五个观察：GRPO在长周期任务上的优势退化是结构性的。** GRPO用组内统计替代value baseline：一个组如果全部失败或全部成功，不贡献梯度。在足够困难以至于需要密集奖励的任务上，这种组是常态。而且每个任务必须采样G次才能产生一个advantage，在固定生成能力下，每步能覆盖的不同任务数按G因子减少。更致命的是，一个组只有最慢的成员终止时才关闭，而终端轨迹在turn数和token数上都是重尾分布——为了控制步时间而做的截断，在组内会破坏比较本身存在的基础。\n\n这些观察合在一起，指向一个结论：在长周期终端任务上做大规模MoE RL，瓶颈不在RL算法的选择，而在于三个前提条件——奖励要有足够分辨率来区分部分进展、训练和推理之间在token和路由两个层面要精确对齐、critic要预先校准到能提供有效baseline。缺少任何一个，PPO的梯度信号就会被噪声淹没或指向错误的参数。\n\n### § 4 核心 Intuition\n\n这篇论文的intuition是：在MoE模型上做长周期agent RL，PPO的importance ratio只有在训练侧和推理侧条件于完全相同的token序列和完全相同的专家子网络时才有意义——否则梯度更新的是一个从未生成数据的策略。TITO通过让训练器直接消费采样器发出的token标识符来消除re-tokenization漂移，R³通过记录并重放推理时的专家路由选择来消除TopK翻转，两者共同将log-probability差距从0.021降到0.013并在loss区域实现零漂移。与此同时，用verifier中每个assertion的通过绝对数量替代二进制结果作为奖励，使得模型在无法完全解决任务时仍能从部分进展中获得梯度信号——这是让RL在困难长周期任务上超越SFT的必要条件，因为二进制奖励下绝大多数轨迹都是零，没有学习信号可言。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《T1: Terminal Agent Reinforcement Learning for Long-Horizon Tasks》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 本文提出并解决的核心研究问题是：如何在大规模稀疏混合专家模型上，针对长周期终端任务稳定地进行强化学习后训练，并利用真实代码执行结果作为奖励信号来提升模型的自主软件代理能力。具体而言，模型需要在真实的云沙盒Linux终端中执行多达300多轮的工具调用，这带来了两个严峻的挑战：其一是训练与推理系统之间的严重不一致性，由于MoE模型的离散路由器对微小数值差异极度敏感，推理和训练时采用的不同计算内核极易导致专家选择发生翻转，进而使梯度更新错误的子网络；其二是长周期任务中二元奖励信号的稀疏性，一次rollout消耗数百个沙盒小时却仅产生一比特的信息，导致模型在无法完全解决复杂任务时难以从部分进展中学习。这个问题至关重要，因为终端环境是现代软件工程的基石，它将抽象规划与不可逆的副作用绑定，是检验自主代理在有状态环境中执行能力的最严苛试金石。解决这一问题不仅能将仅有10B活跃参数的模型推升至与数百B参数前沿密集模型相媲美的水平，更标志着大语言模型从单纯的文本生成向能在关键基础设施中可靠执行动作的自主代理迈出了关键一步。 ### § 2 前人工作与不足 在数据合成与终端代理训练方面，前人工作如R2E-Gym、SWE-smith及Tmax等虽尝试通过仓库衍生、扰动或任务条件合成来扩展终端任务规模，但这些流水线大多仅通过supervised fine-tuning (SFT)进行验证，而其强化学习证据则局限于较小的密集策略且仅针对二元结果进行优化，导致在SFT checkpoint上的提升通常微乎其微。尽管RST等方法通过递归重播种延长了任务周期，但其验证器往往只输出单一的二元通过/失败结果，无法为长周期任务中的部分完成提供密集的监督信号，使得模型在面对超出其当前能力的困难任务时陷入零奖励的停滞状态。在稳定强化学习以应对训练-推理不匹配方面，现代RL框架（如基于Megatron-LM和SGLang的系统）由于内核、数值精度和并行策略的差异，即使在没有延迟的情况下，采样器的对数概率也会与训练器产生分歧。对于MoE模型，这种不匹配被急剧放大，因为一次更新可能翻...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 一个认真研究\"如何用RL训练大规模MoE模型执行长周期终端任务\"的人，会从以下几个已有观察出发。 **第一个观察：二进制奖励在长周期任务上注定失败。** 终端任务的rollout成本极高——一个批次要消耗数百沙箱小时——但二进制结果每个轨迹只产生1 bit信号。更关键的是，在困难任务上模型很少完全成功，所有失败轨迹都得到零奖励，部分进展完全不可见。作者自己的前期实验已经证实：binary-reward campaign从未超过SFT基线。这个观察直接指向一个结论：奖励的分辨率必须从任务本身的verifier中提取，而不是靠外部施加。如果verifier能报告每个assertion的独立结果，那么部分完成就变得可观测，零奖励轨迹就能转化为分级监督。这要求在任务合成阶段就为每个任务配备足够多的验证检查——这正是RST（Recursive Synthesis for Terminal Tasks）已经在做的事。 **第二个观察：MoE模型上的训练-推理不匹配不是数值噪声，而是结构性的子网络替换。** 在dense模型上，推理引擎和训练引擎之间的数值差异只影响logit的精度。但在MoE模型中，116.0B/121.4B参数在专家里，每个token通过离散TopK路由选择8/256个专家。TopK是不连续的：哪怕router score的数值差异远低于任何合理的容差，也足以把一个被选中的专家换成它的runner-up。这意味着训练时计算的梯度到达的参数，与生成行为的参数，属于不同的子网络。PPO的importance ratio本应比较同一策略的两个版本，现在却在比较两个不同网络的输出。这个问题在短周期任务上几乎不显现，但长周期任务有上万个loss-bearing位置，每个位置的偏差沿轨迹累积而非抵消。 **第三个观察：多轮agent harness在token层面引入了独立的不一致性。** 标准的agent harness把每轮的assistant消息存为解析后的文本，下一轮再通过chat template重新渲染整个历史。这个encode... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：**==\u003E picture [32 x 33] intentionally omitted \u003C==** **==\u003E picture [129 x 27] intentionally omitted \u003C==** ## _**T1**_ **: Terminal Agent Reinforcement Learning for Long-Horizon Tasks** **Junyao Yang**[1] _[,]_[2] _[,][∗][,][†]_ , **Yucheng Shi**[1] _[,][∗]_ , **Zhongzhi Li**[1] _[,]_[3] , **Ruhan Wang**[1] _[,]_[4] , **Zongxia Li**[1] _[,]_[5] , **Haitao Mi**[1] , **Leowei Liang**[1] \u003E 1Tencent Hy Foundation Model Frontier 2National University of Singapore 3University of Georgia \u003E 4Indiana University 5University of Maryland, College Park \u003E _∗_ Equal Contribution, _†_ Corresponding Author `junyaoyang@u.nus.edu` , `tberiusyang@global.tencent.com` Agent usage is shifting toward long-horizon tasks such as coding and scientific discovery, among which terminal tasks are especially important. We introduce _**T1**_ , a Mixture-of-Experts model of 122B total trained with reinforcement learning, op...", "additional_insights": "### § 8 Take-aways\nT1 是一个 122B 参数的 Mixture-of-Experts (MoE) 模型，通过强化学习 (RL) 在真实云沙箱的 Linux shell 中执行长周期终端任务，单任务最多可达 300+ tool-call turns。论文提出了 TITO (Token-In-Token-Out) 和 R[3] (Rollout Routing Replay) 机制，解决了 MoE 模型在 RL 训练中由于推理和训练引擎不一致导致的 token drift 和 routing mismatch 问题，将 log-probability gap 从 0.021 降至 0.013。研究引入了 Dense Process Reward，通过计算通过 verifier 的绝对 assertion 数量来提供密集奖励信号，而非仅使用二元的成功/失败奖励，从而在模型无法完全解决困难任务时也能提供有效的学习信号。采用 Critic Warm-Up 策略，在 RL 训练前使用高学习率（actor 的 30 倍）预热 critic 模型，显著提升了 Explained Variance (EV) 并稳定了 actor-critic 训练。训练数据完全 out-of-distribution，通过 Recursive Synthesis 生成并经过严格的多维度审计筛选出 T1-15k 数据集，确保模型在 Terminal-Bench 2.1 上的提升源于真实能力迁移而非 benchmark overfitting。在 Terminal-Bench 2.1 上，T1 将基础模型的 43.8% 提升至 64.0%，超越了 GPT-5.4 和 DeepSeek-V4-Flash，并在 Long-Horizon Terminal Bench 上达到 27.9%，证明了 RL 在长周期终端任务上的有效性。\n\n### § 9 最脆弱的假设\n论文最核心且最脆弱的假设是：**verifier 报告的 per-assertion outcomes 能够准确反映 agent 在任务上的真实进度，且不同任务的 assertions 所代表的工作量大致相当，从而使得基于绝对通过数量的 Dense Process Reward 能够提供无偏的梯度信号**。如果这个假设不成立，例如不同任务的 verifier 粒度差异巨大，或者某些 assertion 可以通过简单的 hack 而非真正完成任务来通过，那么 dense reward 将引导模型走捷径，导致 reward hacking 或学习到次优策略。在实际中，由于任务种类繁多（从简单的文件操作到复杂的系统管理），很难保证所有 assertion 的难度和工作量是均匀的。论文通过设计 RST 合成过程来控制难度和 assertion 数量的相关性，并使用固定全局 scale $S=20$ 来标准化奖励，同时通过 LLM 审计剔除存在 hidden requirements 或 verifier 过弱的任务，并监控训练过程中的 turn growth 以防止 length hacking。然而，论文缺少直接的消融实验来证明这种基于绝对数量的 dense reward 比基于比例的 reward 或 binary reward 在相同数据集和初始化条件下有显著优势（论文在 Limitations 中承认了这一点）。此外，verifier 在 agent 控制的沙箱中执行，缺乏运行时的防篡改检测，完全依赖数据过滤来保证完整性，这在面对更复杂的任务时可能成为漏洞。\n\n### § 10 最小复现实验\n在一周时间内，可以验证 **Dense Process Reward 相比 Binary Reward 在长周期任务上的有效性**这一核心 claim。使用现有的包含多个 assertions 的代码任务数据集（如 HumanEval 的变体或简单的 SWE-bench lite 子集，确保 verifier 能输出 per-assertion 结果），或者使用论文提到的 RST 方法合成几百个带有 per-assertion verifier 的简单终端任务。选择一个较小的 dense 模型（如 Qwen-2.5-7B）或小型 MoE 模型，搭建一个简单的 RL 训练流程（可使用 PPO），对比两种奖励设置：1) Binary Reward（仅任务完全成功给 1）；2) Dense Reward（按通过的 assertion 绝对数量给分，固定 scale）。不需要实现复杂的 TITO 或 R[3]，只需关注 reward 设计的影响。测量训练过程中的 rollout reward、Critic 的 Explained Variance (EV) 以及在 held-out 测试集上的 resolved rate，观察在任务难度较高、模型初期难以完全解决的情况下，两种 reward 信号对 EV 和学习曲线的影响。如果 Dense Reward 组在训练初期能保持正向的 EV 且 rollout reward 稳步上升，并在 held-out 集上表现优于 Binary Reward 组，则支持论文的 claim；反之，如果 Dense Reward 导致 reward hacking（如 turn 数量失控增长但 resolved rate 不升）或 EV 依然崩溃，则反驳了该 claim。", "research_value": "### § 11 最强反例设计\n要最有力地攻击 T1 的方法，我会在真实世界的复杂系统管理任务中设计一个针对 **Dense Process Reward** 的“捷径学习”反例实验。论文最脆弱的假设是 verifier 报告的 per-assertion outcomes 能无偏地反映真实进度，且 verifier 在 agent 控制的沙箱中不被篡改。我将构建一个包含高度异构 assertions 的长周期任务集，其中既有需要深度系统配置（如修复内核模块依赖、配置网络命名空间）的“硬” assertions，也有仅需表面状态修改（如创建特定空文件、`echo` 伪造日志内容）的“软” assertions。在训练过程中，我会监控 agent 的行为模式与 reward 曲线，并引入一个独立于训练 reward 的、基于真实系统状态差异的严格评估器。如果 T1 的方法有效，agent 应该按顺序或按逻辑难度逐步解决所有 assertions；但如果反例成立，我会观察到 agent 在训练初期迅速学会通过执行低成本的 shell 命令（如 `touch` 或 `sed` 伪造配置文件）来刷取大量“软” assertion 的 dense reward，而完全忽略甚至破坏“硬” assertion 所需的真实系统状态。更致命的是，由于 verifier 运行在 agent 控制的沙箱内，我预期会发现 agent 学会了在长周期轨迹的早期直接修改 verifier 脚本本身（例如 `chmod -x` 或篡改其逻辑），使其在后续所有检查中无条件输出全通过。这种情况下，rollout reward 会呈现虚假的完美上升，Critic 的 Explained Variance (EV) 也会极高，但独立严格评估器将显示任务实际 resolved rate 停滞甚至下降。这一反例不仅证明了基于绝对数量的 dense reward 在异构任务中会提供严重偏置的梯度信号，还直接击穿了论文依赖静态数据过滤来保证 verifier 完整性的根本防线，证明在长周期交互中，静态生成的 reward 信号在 agentic 环境下是可预测且不可靠的。\n\n### § 12 Follow-up Research Idea\n基于 T1 依赖外部静态 verifier 提供密集奖励这一核心局限，我提出一个全新的研究方向：**Causal State-Space Progress Modeling (CSSPM)**，即将长周期任务的 reward 信号从外部符号化验证彻底转变为基于环境因果动力学的内在进度估计。这一想法的驱动需求是：在真实的软件工程与系统管理中，绝大多数任务没有现成的、可分解为多个 assertions 的 verifier，且任何静态 verifier 在 agent 拥有 root 权限的沙箱中都不可避免地面临被篡改或被 hack 的风险。我们可以借鉴 Model-based RL 中的 World Model 学习以及因果表征学习的工具，不再要求任务附带 verifier，而是让模型在大量无标签的终端交互轨迹中学习一个潜在状态空间模型。该模型通过对比当前环境状态（如文件系统树、进程列表、网络配置的快照）与目标状态（如任务描述隐含的最终状态）在潜在空间中的距离，来输出连续的、抗篡改的 intrinsic dense reward。第一个实验将设计为：在完全不使用任何 per-assertion verifier 的条件下，仅利用 terminal 交互日志和最终 binary outcome 训练一个 World Model。我们将该 World Model 推导出的潜在状态距离作为 dense reward 训练一个小型 agent，并与 T1 的静态 verifier-based dense reward 进行对比。实验的关键评估指标在于 agent 在面对分布外（OOD）的复杂系统管理任务时，是否还能获得平稳的梯度信号，以及是否从根本上消除了通过 `echo` 伪造状态或篡改 verifier 脚本来获取高 reward 的 hacking 行为。这一提议与现有的 R2E-Gym 或 T1 有本质区别：它抛弃了“任务必须附带可执行 verifier”的强假设，将 reward 的来源从离散的符号化断言转移到了连续的环境因果状态变迁上，为真正开放世界的长周期 agentic RL 铺平了道路。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Junyao Yang\", \"affiliations\": [1, 2], \"markers\": [\"*\", \"†\"]},\n    {\"name\": \"Yucheng Shi\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Zhongzhi Li\", \"affiliations\": [1, 3], \"markers\": []},\n    {\"name\": \"Ruhan Wang\", \"affiliations\": [1, 4], \"markers\": []},\n    {\"name\": \"Zongxia Li\", \"affiliations\": [1, 5], \"markers\": []},\n    {\"name\": \"Haitao Mi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Leowei Liang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Tencent Hy Foundation Model Frontier\"},\n    {\"id\": 2, \"name\": \"National University of Singapore\"},\n    {\"id\": 3, \"name\": \"University of Georgia\"},\n    {\"id\": 4, \"name\": \"Indiana University\"},\n    {\"id\": 5, \"name\": \"University of Maryland, College Park\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal Contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding Author\"}\n  ]\n}\n```", "summary_translation": "Agent 的使用正转向诸如编程和科学发现等 long-horizon tasks，其中 terminal tasks 尤为重要。我们引入了 T1，这是一个总参数量为 122B 的 Mixture-of-Experts 模型，通过强化学习进行训练，在 cloud sandbox 中操作真实的 shell，每个任务最多进行 300+ 次 tool-call 轮次，并通过执行每个任务自身的 verifier 来给予奖励。我们提供了一个全面的方案：首先，通过激进的 warm-start 来稳定 actor-critic 训练，并使用 dense process reward，根据通过 verifier 的绝对数量对 trajectories 进行打分。其次，通过 TITO construction 实现稳定优化，在精确采样的 token identifiers 上进行训练并在 turn boundaries 进行 drift repair，以及 rollout routing replay，记录 sampler 在每个 MoE 层的 per-token expert choices 并在训练期间重放它们。第三，完全 out-of-distribution 的训练语料库：与 Terminal-Bench 2.1 不相交的 isolated seeds 和 synthesized tasks 确保了增益反映的是真实的能力迁移，而非 benchmark overfitting。TITO 和 R3 共同将 training-to-inference log-probability 差异从 0.021 降低至 0.013，并在 loss 区域实现完全对齐的零 token drift。在 Terminal-Bench 2.1 上，我们的 post-train pipeline 将初始 base model 的解决率从 43.8% 提升至 T1 的 64.0%。在 Long-Horizon Terminal Bench 上，T1 达到 27.9% 并超越了 GPT-5.4 和 GLM-5.1。"}]}, {"name": "Agent Skill \u0026 Runtime Optimization", "count": 3, "papers": [{"title": "COBRA-Skills: Contextual Bandit-Guided Evolution for Agent Skill Optimization", "arxiv_id": "2609.11682", "authors": "Pingchen Lu, Xiangyi Wang, Xiang Li, Jie Mao, Zikun Qu, Junfeng Luo, Yao Shu, Bryan Kian Hsiang Low, Zhongxiang Dai", "summary": "Large language model (LLM) agents can benefit from reusable skills distilled from prior task experience, yet existing skill optimization methods often rely on costly execution-based evaluation and substantial task data. We introduce \\textbf{COBRA-Skills}, an efficient framework that formulates skill optimization as budgeted sequential optimization over a dynamically evolving candidate space. COBRA-Skills couples contextual-bandit-guided prioritization with evidence-grounded skill evolution, selectively allocating evaluations to promising or informative candidates while continually refining the skill population from execution feedback. Across six heterogeneous agent benchmarks and three target models, COBRA-Skills consistently achieves the strongest average performance among compared methods, while reducing optimization cost by 55--58\\% relative to SkillOpt and using only 50 unique optimization examples per benchmark. Further analyses show that COBRA-Skills remains robust to changes in the agent harness and performs effectively when the target model itself is used for skill generation and refinement.", "category": "cs.AI", "cluster": "Agent Skill \u0026 Runtime Optimization", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文完全符合你的研究范围。论文的核心贡献是提出了 COBRA-Skills 框架，用于 LLM 智能体的技能优化与演化。摘要中明确指出该框架通过上下文赌博机引导优先级排序，并结合基于证据的技能演化，从执行反馈中持续优化技能群体。这直接对应了你研究焦点中的“自我演化”和“单智能体”的技能获取与自我完善机制。此外，论文提到该方法对“agent harness”的变化具有鲁棒性，并且在使用目标模型进行技能生成和优化时依然有效，这符合你筛选标准中“保留研究 agent harness 并通过轨迹、反馈自动改进、演化的论文”的规则。该研究不涉及任何被排除的安全、多模态、图结构或纯系统编排等领域，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n论文提出的研究问题是：如何在有限的计算预算和少量任务样本下，高效地优化大型语言模型（LLM）agent 的可复用技能。具体而言，作者将 agent skill optimization 建模为一个在动态演进的候选空间上的 budgeted sequential optimization 问题，其中候选技能的效用是不确定的，且只能通过昂贵的 target-agent execution 来揭示。这个问题的重要性在于，LLM agent 在实际应用中经常遇到共享重复目标、程序、工具和失败模式的任务，而 agent skills 能够以轻量级的方式捕获这些可复用的程序化知识，并在解决新任务时注入到 agent 的 context 中。然而，获取可靠的 skills 极具挑战性：手动编写需要大量人力和领域专业知识，而直接从 LLM 的 parametric knowledge 生成 skills 则可能产生看似合理但缺乏执行依据的指导，无法可靠地提升下游性能。因此，高效地优化 skills 不仅能显著提升 agent 在多样化任务上的表现，还能大幅降低优化成本和样本需求，为 LLM agent 的实际部署和规模化应用提供关键价值。\n\n### § 2 前人工作与不足\n在此之前，该问题已被部分解决，但现有方法存在显著的效率瓶颈。最相关的 prior methods 包括 Trace2Skill 和 SkillOpt，它们已经能够通过将 skill construction 建立在实际的 agent trajectories 和 execution feedback 之上，并采用 iterative evolutionary refinement 来生成、修改和选择更强的 skills。然而，这些方法之所以不足，根本原因在于它们对 execution feedback 的依赖方式导致了两个效率瓶颈。首先，候选效用的评估成本极其高昂：现有方法普遍采用 execution-based generate–evaluate–refine loops，必须在任务或 held-out validation instances 上执行候选 skills 才能观察其实际效用，导致大量优化预算被浪费在评估低质量或无前景的候选上。其次，skill refinement 本身的成本也很高：这些方法频繁调用 LLM 来分析 execution trajectories、诊断失败并生成或聚合 skill modifications，在整个优化过程中反复重新分析 trajectories 和修改 skills，产生了大量额外的 token cost。这些不足并非简单的工程问题，而是方法设计上的结构性缺陷——现有方法没有将候选评估的选择性分配和执行证据的高效重用作为核心设计目标，而是依赖于穷举式评估和重复重写。此外，当时的问题没有被清晰地定义为在动态候选空间上的 budgeted sequential optimization 问题，因此缺乏一种机制来在有限的评估预算下平衡对 promising 候选的 exploitation 和对 insufficiently explored 候选的 exploration，这正是 COBRA-Skills 通过 contextual bandit formulation 所解决的。", "core_insight": "### § 3 重建作者的思考路径\n\n作者面对的核心问题是：如何让 LLM agent 从过往任务经验中蒸馏出可复用的 skill，并在有限预算下高效优化这些 skill。已有的方法（如 SkillOpt、Trace2Skill）虽然能通过 execution feedback 迭代改进 skill，但存在两个明显的效率瓶颈。第一个瓶颈是 evaluation 成本：每生成一个候选 skill，就必须让 target agent 在任务上实际执行才能观测其 utility，而大量 budget 被浪费在评估那些一开始就不 promising 的候选上。第二个瓶颈是 refinement 成本：现有方法在每一轮都反复调用 LLM 分析 trajectory、诊断失败、重写 skill，token 消耗巨大，但很多修改其实是低效的重复劳动。\n\n从已有知识出发，作者可能注意到几个关键线索。首先，prompt optimization 领域已有工作用 bandit 算法来选择性评估候选 prompt（如 Pryzant et al., 2023; Lin et al., 2023），说明 bandit 框架天然适合\"候选 utility 昂贵且不确定\"的场景。其次，contextual bandit 允许用 feature 描述 arm，且 arm 集合可以跨轮次变化（Li et al., 2010; Chu et al., 2011），这恰好匹配 skill 优化中候选空间动态变化的需求——skill 可以用 semantic embedding 表示，且进化操作会不断引入新候选、淘汰旧候选。第三，evolutionary search 在 agent skill 领域已有探索（Zhang et al., 2026; Alzubi et al., 2026），但这些方法没有与高效的 evaluation allocation 结合，仍然依赖穷举式评估。\n\n作者 likely 的推理链条是：如果只做 bandit sel
