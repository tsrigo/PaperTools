<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperTools - 学术论文集合</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Marked.js 用于 Markdown 渲染 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- KaTeX 仅在已展开的 Markdown 段落中渲染公式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <style>
        /* 微软雅黑字体 */
        body {
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        body::-webkit-scrollbar {
            display: none;
        }

        /* 移动端优化 */
        @media (max-width: 640px) {
            body {
                font-size: 14px;
            }

            /* 改善可点击区域 */
            button, a {
                min-height: 44px;
                min-width: 44px;
            }

            /* 优化间距 */
            .container {
                padding-left: 12px !important;
                padding-right: 12px !important;
            }
        }

        /* 星标样式 */
        .star-button {
            transition: color 0.2s ease-in-out;
        }
        .star-button.starred {
            color: #fbbf24;
        }
        .star-button:not(.starred) {
            color: #9ca3af;
        }
        .star-button:hover {
            color: #fbbf24;
        }
        /* 删除按钮样式 */
        .delete-button {
            transition: all 0.2s ease-in-out;
        }
        .delete-button:hover {
            color: #ef4444;
            transform: scale(1.1);
        }
        /* 论文项目样式 */
        .paper-item {
            transition: opacity 0.2s ease-out, transform 0.2s ease-out;
            content-visibility: auto;
            contain-intrinsic-block-size: auto 240px;
        }
        .paper-item.hidden-paper {
            opacity: 0.3;
            transform: scale(0.98);
        }
        /* 平滑过渡 */
        .rotate-90-transition {
            transition: transform 0.2s ease-in-out;
        }

        /* 论文卡片展开/收起 */
        .paper-expand-hint {
            padding: 4px 0;
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .paper-expand-hint:hover {
            color: #2563eb;
        }
        .dark .paper-expand-hint:hover {
            color: #60a5fa;
        }
        .paper-expand-hint .expand-arrow {
            display: inline-block;
            transition: transform 0.2s;
            font-size: 0.65rem;
            margin-right: 4px;
        }
        .paper-detail {
            border-top: 1px solid #e2e8f0;
            margin-top: 8px;
            padding-top: 8px;
        }
        .dark .paper-detail {
            border-top-color: #334155;
        }
        .paper-detail.hidden {
            display: none;
        }

        /* 可折叠部分样式 */
        .collapsible-header {
            cursor: pointer;
            display: flex;
            align-items: center;
            font-weight: 600;
            padding: 8px 0;
            user-select: none;
            color: #1e40af;
            transition: color 0.15s ease-out, opacity 0.15s ease-out;
        }
        .dark .collapsible-header {
            color: #60a5fa;
        }
        .collapsible-header:hover {
            opacity: 0.8;
        }
        .collapsible-header::before {
            content: "▶";
            margin-right: 8px;
            transition: transform 0.3s ease;
            font-size: 0.8em;
        }
        .collapsible-header.open::before {
            transform: rotate(90deg);
        }
        .collapsible-content {
            display: none;
        }
        .collapsible-content.open {
            display: block;
        }
        .collapsible-content .inner {
            padding-top: 8px;
        }

        @media (prefers-reduced-motion: reduce) {
            .paper-item,
            .collapsible-header,
            .collapsible-header::before,
            .paper-expand-hint .expand-arrow {
                transition: none;
            }
        }

        /* Markdown 内容样式 */
        .markdown-content {
            line-height: 1.6;
        }
        .markdown-content h1 {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 1em;
            margin-bottom: 0.5em;
            color: #1e40af;
        }
        .dark .markdown-content h1 {
            color: #60a5fa;
        }
        .markdown-content h2 {
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 0.8em;
            margin-bottom: 0.4em;
            color: #1e40af;
        }
        .dark .markdown-content h2 {
            color: #60a5fa;
        }
        .markdown-content h3 {
            font-size: 1.1em;
            font-weight: bold;
            margin-top: 0.6em;
            margin-bottom: 0.3em;
            color: #1e40af;
        }
        .dark .markdown-content h3 {
            color: #60a5fa;
        }
        .markdown-content h4 {
            font-size: 1em;
            font-weight: bold;
            margin-top: 0.5em;
            margin-bottom: 0.25em;
            color: #2563eb;
        }
        .dark .markdown-content h4 {
            color: #93c5fd;
        }
        .markdown-content p {
            margin-bottom: 0.8em;
        }
        .markdown-content ul, .markdown-content ol {
            margin-left: 1.5em;
            margin-bottom: 0.8em;
        }
        .markdown-content ul {
            list-style-type: disc;
        }
        .markdown-content ol {
            list-style-type: decimal;
        }
        .markdown-content li {
            margin-bottom: 0.3em;
        }
        .markdown-content code {
            background-color: #f1f5f9;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
        }
        .dark .markdown-content code {
            background-color: #334155;
        }
        .markdown-content pre {
            background-color: #f1f5f9;
            padding: 1em;
            border-radius: 5px;
            overflow-x: auto;
            margin-bottom: 0.8em;
        }
        .dark .markdown-content pre {
            background-color: #334155;
        }
        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
        }
        .markdown-content blockquote {
            border-left: 3px solid #cbd5e1;
            padding-left: 1em;
            margin-left: 0;
            margin-bottom: 0.8em;
            color: #64748b;
        }
        .dark .markdown-content blockquote {
            border-left-color: #475569;
            color: #94a3b8;
        }
        .markdown-content strong {
            font-weight: 600;
        }
        .markdown-content em {
            font-style: italic;
        }

        /* Tag filter button styles */
        .tag-btn {
            padding: 4px 14px;
            font-size: 0.875rem;
            border-radius: 9999px;
            border: 1px solid #cbd5e1;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .tag-btn:hover { border-color: #3b82f6; color: #3b82f6; }
        .tag-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .dark .tag-btn { border-color: #475569; color: #94a3b8; }
        .dark .tag-btn:hover { border-color: #60a5fa; color: #60a5fa; }
        .dark .tag-btn.active { background: #2563eb; color: white; border-color: #2563eb; }

        /* Tag badge styles */
        .tag-badge {
            display: inline-block;
            padding: 1px 6px;
            font-size: 0.7rem;
            border-radius: 9999px;
            background: #dbeafe;
            color: #1e40af;
            margin-right: 4px;
        }
        .tag-badge.tag-arxiv {
            background: #e0f2fe;
            color: #0369a1;
        }
        .dark .tag-badge { background: #1e3a5f; color: #7dd3fc; }
        .dark .tag-badge.tag-arxiv { background: #164e63; color: #67e8f9; }

        /* 作者机构上标样式 */
        .author-aff {
            vertical-align: super;
            font-size: 0.65em;
            color: #3b82f6;
            margin-left: 1px;
        }
        .dark .author-aff {
            color: #60a5fa;
        }

        /* 桌面端正文使用移除右栏后释放的宽度，同时避开左侧目录。 */
        #content-column {
            width: 100%;
        }
        @media (min-width: 1024px) {
            #content-column {
                width: min(1024px, calc(100% - 260px));
                margin-left: max(240px, calc((100% - 1024px) / 2));
                margin-right: auto;
            }
        }

        /* TOC 侧边栏样式 - 固定在左侧 */
        #toc-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            z-index: 35;
            background: white;
            border-right: 1px solid #e2e8f0;
            transition: transform 0.3s ease;
            overflow: hidden;
        }
        .dark #toc-sidebar {
            background: #1e293b;
            border-right-color: #334155;
        }
        #toc-sidebar.collapsed {
            transform: translateX(-100%);
        }
        #toc-inner {
            padding: 1rem 0.5rem;
            height: 100%;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        #toc-inner::-webkit-scrollbar {
            width: 4px;
        }
        #toc-inner::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 2px;
        }
        .dark #toc-inner::-webkit-scrollbar-thumb {
            background: #475569;
        }
        .toc-date {
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toc-date:hover {
            background: #e2e8f0;
        }
        .dark .toc-date:hover {
            background: #334155;
        }
        .toc-date.active {
            background: #dbeafe;
            color: #1e40af;
        }
        .dark .toc-date.active {
            background: #1e3a5f;
            color: #93c5fd;
        }
        .toc-date-arrow {
            transition: transform 0.2s;
            font-size: 0.65rem;
        }
        .toc-date-arrow.open {
            transform: rotate(90deg);
        }
        .toc-papers {
            display: none;
            padding-left: 1.2rem;
        }
        .toc-papers.open {
            display: block;
        }
        .toc-paper {
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 3px;
            font-size: 0.8rem;
            line-height: 1.35;
            color: #64748b;
            transition: background 0.15s, color 0.15s;
            display: block;
            white-space: normal;
            overflow-wrap: anywhere;
            max-width: 100%;
        }
        .toc-paper:hover {
            background: #f1f5f9;
            color: #1e40af;
        }
        .dark .toc-paper {
            color: #94a3b8;
        }
        .dark .toc-paper:hover {
            background: #1e293b;
            color: #93c5fd;
        }
        .toc-paper.active {
            background: #eff6ff;
            color: #1d4ed8;
            font-weight: 500;
        }
        .dark .toc-paper.active {
            background: #1e3a5f;
            color: #93c5fd;
        }
        .toc-expand-all {
            width: calc(100% - 8px);
            margin: 5px 4px 6px;
            padding: 5px 8px;
            border: 1px solid #bfdbfe;
            border-radius: 5px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .toc-expand-all:hover {
            background: #dbeafe;
            border-color: #93c5fd;
        }
        .dark .toc-expand-all {
            background: rgba(30, 58, 95, 0.55);
            border-color: #1e40af;
            color: #93c5fd;
        }
        .dark .toc-expand-all:hover {
            background: #1e3a5f;
        }
        /* TOC 切换按钮 - 左侧 */
        #toc-toggle {
            position: fixed;
            left: 220px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 40;
            width: 28px;
            height: 56px;
            border-radius: 0 6px 6px 0;
            background: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 0 8px rgba(0,0,0,0.15);
            transition: left 0.3s ease, background 0.2s;
        }
        #toc-toggle:hover {
            background: #2563eb;
        }
        #toc-toggle svg {
            transition: transform 0.3s;
        }
        #toc-toggle:not(.sidebar-open) {
            left: 0;
        }
        @media (max-width: 1023px) {
            #toc-sidebar {
                width: 240px;
            }
            #toc-toggle {
                left: 240px;
            }
            #toc-toggle:not(.sidebar-open) {
                left: 0;
            }
        }
        @media (max-width: 767px) {
            #toc-sidebar {
                width: 260px;
                box-shadow: 4px 0 16px rgba(0,0,0,0.1);
            }
            #toc-toggle {
                left: 260px;
            }
            #toc-toggle:not(.sidebar-open) {
                left: 0;
            }
        }

    </style>
    <script>
        // Tailwind CSS 暗色模式配置
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>

    <script>
        const allPapers = {"2026-09-07": [{"name": "Agent Benchmarks \u0026 Evaluation", "count": 4, "papers": [{"title": "EVOHARNESSBENCH: Can Your Agents Keep Pace with an Evolving Harness?", "arxiv_id": "2609.04280", "authors": "Zixuan Ke, Vaidehi Patil, Haizhou Shi, Yang Li, Ye Liu, Sarath Shekkizhar, Anurag Koul, Jiayu Wang, Xuan Phi Nguyen, Semih Yavuz, Mohit Bansal, Shafiq Joty", "summary": "Modern LLM-based agents operate through a harness of tools, reusable skills, and specialist agents that shapes what they observe and what they can do. In practice, this harness continually evolves as new capabilities are added. We introduce EVOHARNESSBENCH, a benchmark for evaluating agents under controlled harness evolution across three axes (tools, skills, and agents). Unlike existing continual-learning benchmarks for agents, which typically place non-stationarity (i.e., what changes over time) in the task stream while keeping the harness fixed, EVOHARNESSBENCH places non-stationarity in the externally supplied harness itself. It contains 17 multi-stage harness streams constructed deterministically from verifier-based benchmarks, comprising 802 tasks, 520 tools, 42 skills, and 62 agents. We evaluate two complementary settings corresponding to the central challenges of harness evolution: deployment evaluation, which isolates retention of previously accessible competence as the harness expands, and self-evolving adaptation evaluation, which tests whether accumulated experience remains useful as new capabilities are introduced. Our results reveal three persistent gaps. First, harness expansion alone can degrade performance on previously solved tasks, producing harness-induced forgetting. Second, gains from self-evolving adaptation remain inconsistent across stages of harness evolution, capability axes, and environments. Third, retention and adaptation can pull in different directions: preserving earlier competence does not necessarily improve adaptation to newly introduced capabilities, and vice versa. These results establish harness evolution as a distinct challenge for building agents that can keep pace with an evolving harness while preserving previously effective behavior.", "category": "cs.CL", "cluster": "Agent Benchmarks \u0026 Evaluation", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=24 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文完全符合你的研究范围。首先，论文的核心研究对象是 LLM 智能体的 Harness（包含工具、技能和专家智能体），并探讨了其在持续演化过程中的表现，这直接命中了你在第一步中明确要求保留的规则：“如果论文研究 agent 的 harness / scaffold / runtime / tool middleware / system prompt / execution environment / continual harness，并且核心贡献是让这些智能体运行组件通过轨迹、反馈、观测或评估结果自动改进、演化或自适应优化”。其次，论文提出了 EVOHARNESSBENCH 基准，专门评估智能体在“自我演化适应”和“部署评估”中的能力，这高度契合你关注的“自我演化”方向。最后，虽然这是一篇评估基准论文，但你的重要校准规则明确指出“不要只因为论文是 benchmark、evaluation、behavior analysis 就排除。只要标题和摘要明确围绕 LLM Agents / Agentic AI / Self-Evolving LLMs 展开，就应返回 True”。该论文深入分析了智能体在 harness 演化下的遗忘问题和适应不一致性，为理解和改进智能体的长周期演化能力提供了重要见解，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n论文提出了 **EVOHARNESSBENCH**，一个用于评估 LLM-based agents 在外部提供的 **harness**（包括 tools, reusable skills, 和 specialist agents）不断演化下表现的 benchmark。具体而言，研究聚焦于 harness 演化带来的两个核心挑战：一是 **Retention**（保留），即随着 harness 扩展，agent 能否继续解决之前支持的任务，还是会发生 **harness-induced forgetting**（仅因 harness 扩展而导致的能力退化，而模型参数本身未变）；二是 **Adaptation under accumulated experience**（在积累经验下的适应），即在早期较窄的 harness 下积累的持久性经验（如 memory, learned skills, prompts），在引入新能力时是否仍然有用，还是会变得过时甚至误导执行。\n\n这个问题的重要性在于，现代 LLM-based agents 的实际部署并非仅依赖模型和 prompt，而是嵌入在一个不断演化的 harness 中。例如，Agentforce 生态系统和 OpenAI 的 public skills repository 都显示出持续的能力添加、更新和移除。这种 harness evolution 不是推测性的边缘情况，而是部署的 agentic systems 的新兴属性。如果 agent 无法跟上 harness 的演化，就会导致性能下降或适应失败。解决这个问题能揭示当前 frontier agents 在 harness 演化下的三个持续存在的 gap：harness 扩展本身会降低之前已解决任务的性能；self-evolving adaptation 的收益在 harness 演化的不同阶段、能力轴和环境中不一致；retention 和 adaptation 可能相互冲突。这些发现确立了 harness evolution 作为一个独特的挑战，并激励了联合考虑 outer harness evolution 和 inner adaptation 的方法，以在利用新能力的同时保留早期有效行为。\n\n### § 2 前人工作与不足\n这个问题之前未被完全解决。现有的 agent benchmarks 可分为三类，但均未评估 task performance 如何响应 harness evolution。第一类是 **Static-harness benchmarks**（如 API-Bank, $\\tau$-bench, SkillsBench, MultiAgentBench），它们使用固定的 tools, skills, 或 agents 评估 agent，既没有 outer evolution 也没有 inner adaptation。这些 benchmark 假设 harness 是固定的，因此无法捕捉 harness 增长如何影响性能，也无法评估积累的经验在 harness 变化时是否变得过时。\n\n第二类是 **Self-evolving benchmarks**（如 SkillLearnBench, SkillFlow），它们研究 agent 是否通过积累经验（inner adaptation）来改进，但没有 outer evolution。虽然有些涉及 skill surface 的增长，但这是 agent-driven 的，作为 inner adaptation 的一部分，且评估目标是 learned-skill quality 而非 task performance under externally evolving harness。因此，它们无法回答积累的经验在 harness 本身演化时是否仍然有用。\n\n第三类是 **Continual-learning benchmarks**（如 AgentCL, ContinualLearningBench, CMRBench），它们包含 outer evolution 和 inner adaptation，但将 outer evolution 放在 task stream 或 model pool 中，而不是 harness 本身。最接近的 CMRBench 虽然考虑了外部 model pool 的增长并评估 continual routing，但仅限于单一轴且不涉及 end-to-end agentic execution 或 coordination。这些 benchmark 将非平稳性放在 task stream 中，假设 agent 可用的 harness 保持固定，因此无法揭示当 agent 行事的 harness 本身扩展时，早期能力为何变得更难恢复或可靠执行。\n\n因此，之前的研究存在一个关键的评测缺口：没有专门设计来评估外部提供的 harness 增长如何影响 agent 性能的 benchmark，特别是关于 retention 和 adaptation 之间的张力。EVOHARNESSBENCH 通过将 non-stationarity 放在外部提供的 harness 本身中，跨越 tools, skills, 和 agents 三个轴，并分离 deployment evaluation 和 self-evolving adaptation evaluation，填补了这一空白。", "core_insight": "## § 3 重建作者的思考路径\n\n作者首先从实际部署中观察到一个基本事实：现代 LLM-based agents 并非仅由模型和 prompt 构成，而是嵌入在一个由 tools、reusable skills 和 specialist agents 组成的 harness 中。这个 harness 在实践中是 inherently non-stationary 的——Agentforce 生态和 OpenAI 公开 skills repository 都展示了持续的能力添加、更新与移除。然而，现有 agent benchmark 的设计假设与这一现实存在系统性脱节：static-harness benchmarks（如 API-Bank、τ-bench）将 harness 固定，只测量 agent 在给定能力集上的表现；self-evolving benchmarks（如 SkillLearnBench）虽然涉及能力增长，但增长是 agent-driven 的，评估目标是 learned-skill quality 而非 task performance 对外部 harness 变化的响应；continual-learning benchmarks（如 AgentCL、ContinualLearningBench）引入了 temporal non-stationarity，但将其放在 task stream 中，harness 仍然固定。最接近的 CMRBench 虽然将 outer evolution 放在外部增长的 model pool 上，但只评估 continual routing，不涉及 end-to-end agentic execution 或 coordination。这意味着，\"外部供给的 harness 本身演进时，agent 性能如何变化\"这一维度，在现有评估框架中是一个盲区。\n\n由此出发，作者识别出两个被现有框架忽略的失败模式。第一个是 harness-induced forgetting：当 harness 扩展时，先前成功解决任务所需的能力仍然可用，但被嵌入一个更大的 tools/skills/agents 池中，使得先前有效的行为更难被恢复或可靠执行——即使底层模型参数和 prompt 完全不变，性能也可能退化。这与传统 continual learning 中的 forgetting 不同，因为 non-stationarity 不在模型内部，而在 agent 通过其行动的外部接口。第二个是 accumulated experience 的失效：self-evolving adaptation 系统在早期、较窄的 harness 下积累的 persistent artifacts（如 episodic memory、learned skills、routing policies），在引入新能力后可能变得 stale 或 actively misdirect execution——先前有效但当前不再适用的行为模式会干扰适应。\n\n要系统暴露这两个挑战，需要一个可控的评估框架。作者的关键设计决策是将 non-stationarity 从 task stream 移到 harness 本身，沿着 tools（expanding API catalogs）、skills（growing procedural requirements）和 agents（expanding specialists）三个轴构造嵌套的、累积的 harness streams。构造流程是确定性的：从现有 verifier-based benchmarks 继承 capability annotations，按频率排序释放能力（core-to-long-tail），形成 cumulative harness，并将每个 task 分配到其所有所需能力首次可用的最早阶段——这保证了 feasibility 和 new-capability pressure 两个性质。评估则分为两种互补模式：deployment evaluation 禁用 inner adaptation，每个 harness 版本独立评估，隔离 harness 扩展的直接效应；self-evolving adaptation evaluation 启用 inner adaptation，允许系统跨阶段携带 persistent state，测量积累经验是否支持适应新能力。这一设计的核心在于将 outer harness evolution 与 inner adaptation 解耦，使得 retention 和 adaptation 可以被分别测量，而非被 aggregate performance 掩盖。\n\n## § 4 核心 Intuition\n\n现有 agent 评估隐含地假设 harness 是固定的，但现实部署中 harness 持续扩展——而扩展本身就会制造问题：更大的能力池不仅增加搜索成本，还会使先前有效的行为路径被淹没，即使模型参数不变也会产生 harness-induced forgetting；同时，在旧 harness 下积累的经验可能在新能力引入后变得过时甚至有害。EVOHARNESSBENCH 的核心 intuition 是：将 non-stationarity 从 task stream 移到 harness 本身，通过 outer harness evolution 与 inner self-evolving adaptation 的解耦设计，分别隔离\"harness 扩展对先前能力的干扰\"和\"积累经验对新能力的适应效果\"这两个此前被 aggregate evaluation 掩盖的失败模式，从而揭示 retention 与 adaptation 之间根本性的张力——保留先前能力并不必然改善对新能力的适应，反之亦然。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《EVOHARNESSBENCH: Can Your Agents Keep Pace with an Evolving Harness?》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出了 **EVOHARNESSBENCH**，一个用于评估 LLM-based agents 在外部提供的 **harness**（包括 tools, reusable skills, 和 specialist agents）不断演化下表现的 benchmark。具体而言，研究聚焦于 harness 演化带来的两个核心挑战：一是 **Retention**（保留），即随着 harness 扩展，agent 能否继续解决之前支持的任务，还是会发生 **harness-induced forgetting**（仅因 harness 扩展而导致的能力退化，而模型参数本身未变）；二是 **Adaptation under accumulated experience**（在积累经验下的适应），即在早期较窄的 harness 下积累的持久性经验（如 memory, learned skills, prompts），在引入新能力时是否仍然有用，还是会变得过时甚至误导执行。 这个问题的重要性在于，现代 LLM-based agents 的实际部署并非仅依赖模型和 prompt，而是嵌入在一个不断演化的 harness 中。例如，Agentforce 生态系统和 OpenAI 的 public skills repository 都显示出持续的能力添加、更新和移除。这种 harness evolution 不是推测性的边缘情况，而是部署的 agentic systems 的新兴属性。如果 agent 无法跟上 harness 的演化，就会导致性能下降或适应失败。解决这个问题能揭示当前 frontier agents 在 harness 演化下的三个持续存在的 gap：harness 扩展本身会降低之前已解决任务的性能；self-evolving adaptation 的收益在 harness 演化的不同阶段、能力轴和环境中不一致；retention 和 adaptation 可能相互冲突。这些发现确立了 harness evolution 作为一...\n2. 核心操作：方法部分围绕这一洞察展开：## § 3 重建作者的思考路径 作者首先从实际部署中观察到一个基本事实：现代 LLM-based agents 并非仅由模型和 prompt 构成，而是嵌入在一个由 tools、reusable skills 和 specialist agents 组成的 harness 中。这个 harness 在实践中是 inherently non-stationary 的——Agentforce 生态和 OpenAI 公开 skills repository 都展示了持续的能力添加、更新与移除。然而，现有 agent benchmark 的设计假设与这一现实存在系统性脱节：static-harness benchmarks（如 API-Bank、τ-bench）将 harness 固定，只测量 agent 在给定能力集上的表现；self-evolving benchmarks（如 SkillLearnBench）虽然涉及能力增长，但增长是 agent-driven 的，评估目标是 learned-skill quality 而非 task performance 对外部 harness 变化的响应；continual-learning benchmarks（如 AgentCL、ContinualLearningBench）引入了 temporal non-stationarity，但将其放在 task stream 中，harness 仍然固定。最接近的 CMRBench 虽然将 outer evolution 放在外部增长的 model pool 上，但只评估 continual routing，不涉及 end-to-end agentic execution 或 coordination。这意味着，\"外部供给的 harness 本身演进时，agent 性能如何变化\"这一维度，在现有评估框架中是一个盲区。 由此出发，作者识别出两个被现有框架忽略的失败模式。第一个是 harness-induced forgetting：当 harness 扩展时，先前成功解决任务所需的能力仍... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：Salesforce AI Research # **EVOHARNESSBENCH: Can Your Agents Keep Pace with an Evolving Harness?** **Zixuan Ke** _**[∗]**_[†1] **Vaidehi Patil** _[∗]_[†2] **Haizhou Shi** _[∗]_[†1] **Yang Li**[†1] **Ye Liu**[1] **Sarath Shekkizhar**[1] **Anurag Koul**[1] **Jiayu Wang**[4] **Xuan Phi Nguyen**[1] **Semih Yavuz**[‡1] **Mohit Bansal**[‡3] **Shafiq Joty**[‡1] � https://mas-orchestra.salesforceresearch.ai/evoharness/ ## **Abstract** Modern LLM-based agents operate through a harness of tools, reusable skills, and specialist agents that shapes what they observe and what they can do. In practice, this harness continually evolves as new capabilities are added. We introduce **EVOHARNESSBENCH** , a benchmark for evaluating agents under controlled harness evolution across three axes ( _tools_ , _skills_ , and _agents_ ). Unlike existing continual-learning benchmarks for agents, which typically place n...", "additional_insights": "### § 8 Take-aways\n本文提出了 EVOHARNESSBENCH，这是首个将 non-stationarity 置于外部 supplied harness 本身而非 task stream 的 benchmark，沿 tools、skills 和 agents 三个轴线评估 LLM-based agents 在 harness 持续扩展下的表现。研究引入了 deployment evaluation 和 self-evolving adaptation evaluation 两种模式，分别隔离 harness 扩展的直接效应以及积累的 persistent state 在新能力引入时的效用。实验揭示了三个核心现象：一是 harness expansion 本身会导致 harness-induced forgetting，即在不改变模型参数的情况下，仅因可用能力池变大就会使先前已解决任务的性能下降；二是 self-evolving adaptation 的收益在 harness 阶段、能力轴和环境间高度不一致；三是 retention 与 adaptation 之间存在张力，保留旧能力的方法往往削弱对新能力的适应，反之亦然。跨轴线分析表明，tools 的瓶颈在于从扩大的动作空间中提取可操作经验，skills 的瓶颈在于学习何时及如何调用相关程序，而 agents 的瓶颈在于随着可用池扩大维持 delegation coverage 与 selectivity 的平衡。\n\n### § 9 最脆弱的假设\n本文最核心且失败代价最大的假设是：在 deployment evaluation 中，agent 在每个 stage $t$ 接收 full cumulative harness $H_{\\le t}$，且这种全量暴露会直接导致 harness-induced forgetting。这一假设在实际部署中可能不成立，因为真实的 agentic 系统通常不会将所有累积的 tools、skills 和 agents 全部塞入 LLM 的 context window，而是采用 dynamic retrieval、hierarchical routing 或 capability pruning 机制来动态缩小暴露面。如果实际系统具备有效的 capability retrieval 机制，harness 扩展带来的 distractor 压力将被大幅缓解，harness-induced forgetting 可能微乎其微甚至消失。论文提供的证据是 deployment BWT 在 full cumulative harness 下确实为负，且 Table 1 中 task-specific tools 的 pass rate 在 EOG 上达到 26.0%，高于或接近 cumulative harness 下的 30.2%（考虑到 token 成本大幅上升），这暗示了如果能动态缩小 harness，forgetting 可能被避免。然而，论文缺少对 deployment 阶段动态 retrieval 策略的评估，如果该假设不成立，整个 benchmark 对真实部署场景的生态效度将受到根本性质疑。\n\n### § 10 最小复现实验\n在一周时间内，可以最小复现 harness-induced forgetting 这一核心 claim。使用 EVOHARNESSBENCH-EOG 中的 Calendar domain（仅 3 个 stages，61 个 tasks，28 个 cumulative tools），以 ReAct (GPT-4o) 作为 agent，仅执行 deployment evaluation。具体实现：在 Stage 1 暴露 17 个 tools 并评估所有 41 个已引入任务；在 Stage 2 暴露 24 个 tools 并评估相同的 41 个任务；在 Stage 3 暴露 28 个 tools 并再次评估这 41 个任务。无需实现 self-evolving adaptation，也无需跑完所有 domain。测量指标是 Stage 1 引入的 41 个任务在三个 stage 下的 pass rate 变化，并计算 BWT。如果 pass rate 随 stage 推进而显著下降（BWT \u003C 0），则支持 harness-induced forgetting 的 claim；如果 pass rate 保持不变或上升，则反驳该 claim，表明在该 domain 下 distractor tools 的增加不足以破坏 agent 的既有能力。", "research_value": "### § 11 最强反例设计\n针对论文最脆弱的“全量暴露”假设，最强反例应直接挑战 harness-induced forgetting 的因果归因。具体而言，可以设计一个引入 dynamic tool retrieval 机制的对照实验。在 EVOHARNESSBENCH-EOG 的 Calendar domain 中，不将 cumulative harness $H_{\\le t}$ 全量注入 LLM 的 context window，而是基于当前 task 的 query 动态 retrieve top-k 最相关的 tools。如果在此设置下，Stage 1 任务的 pass rate 在 Stage 2 和 Stage 3 保持稳定（即 BWT $\\ge$ 0），则证明论文声称的 forgetting 并非 harness 演化的本质属性，而是 LLM 在长 context 下面对大量 distractor tools 时的 attention dilution 效应。这一替代解释将根本性地削弱 benchmark 的生态效度：论文观察到的性能下降不是 agent 无法跟上 harness 演化，而是当前 LLM 处理冗长 tool 列表的固有缺陷。如果简单的 retrieval 策略就能消除 forgetting，那么 harness evolution 就不构成一个独立的挑战，而仅仅是 tool management 的工程问题，整个 benchmark 的核心立论便随之崩塌。\n\n### § 12 Follow-up Research Idea\n驱动这一 follow-up idea 的核心局限是：EVOHARNESSBENCH 将 agent 视为 harness 演化的被动接受者，仅评估其 retention 和 adaptation，却忽略了真实部署中 agent 应主动参与 harness 的生命周期管理。借鉴软件工程中的 Dependency Management 和版本控制理论，我们可以提出 Active Harness Curation 的新 framing，将 harness 视为 agent 可主动编辑、降级和重构的动态代码库，而非固定的环境约束。在这个框架下，agent 不仅需要解决 task，还需在检测到 harness-induced forgetting 时，主动诊断干扰源并生成 harness patch（如隔离冲突的 tool、重构过时的 skill 调用逻辑）。第一个实验将构建一个 closed-loop harness editing 环境：当 agent 在 Stage 2 执行 Stage 1 任务失败时，触发 harness introspection 模块，要求 agent 分析失败是否由新引入的 tool 导致，并允许其通过生成撤销或隔离指令来修改当前 stage 的 effective harness。评估指标为 agent 能否通过主动修剪恢复旧任务性能，同时不丧失新任务的解决能力。这与现有 continual learning 或 self-evolving 工作的本质区别在于：现有方法让 agent 在固定或被动扩展的 harness 内积累内部经验，而本提议赋予 agent 对 harness 本身的写权限，将研究目标从“适应环境”转向“自主维护和优化工具环境”。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zixuan Ke\", \"affiliations\": [1], \"markers\": [\"*\", \"†\"]},\n    {\"name\": \"Vaidehi Patil\", \"affiliations\": [2], \"markers\": [\"*\", \"†\"]},\n    {\"name\": \"Haizhou Shi\", \"affiliations\": [1], \"markers\": [\"*\", \"†\"]},\n    {\"name\": \"Yang Li\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Ye Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Sarath Shekkizhar\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Anurag Koul\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiayu Wang\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Xuan Phi Nguyen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Semih Yavuz\", \"affiliations\": [1], \"markers\": [\"‡\"]},\n    {\"name\": \"Mohit Bansal\", \"affiliations\": [3], \"markers\": [\"‡\"]},\n    {\"name\": \"Shafiq Joty\", \"affiliations\": [1], \"markers\": [\"‡\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Salesforce Research\"},\n    {\"id\": 2, \"name\": \"UNC Chapel Hill\"},\n    {\"id\": 3, \"name\": \"UNC Chapel Hill\"},\n    {\"id\": 4, \"name\": \"UW-Madison\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Core contributors\"},\n    {\"marker\": \"‡\", \"text\": \"Senior authors\"},\n    {\"marker\": \"2\", \"text\": \"University of North Carolina at Chapel Hill, conducted this work during an internship at Salesforce Research\"}\n  ]\n}\n```", "summary_translation": "现代基于 LLM 的 agents 通过由 tools、可重用 skills 和 specialist agents 组成的 harness 进行运作，这种 harness 塑造了它们的观察范围和行动能力。在实践中，随着新能力的加入，这种 harness 会不断演化。我们引入了 EVOHARNESSBENCH，这是一个用于在跨越三个维度（tools、skills 和 agents）的受控 harness 演化下评估 agents 的 benchmark。与现有的针对 agents 的 continual-learning benchmarks 不同，后者通常将 non-stationarity（即随时间变化的内容）置于 task stream 中，同时保持 harness 固定，而 EVOHARNESSBENCH 将 non-stationarity 置于外部提供的 harness 本身之中。它包含 17 个从 verifier-based benchmarks 确定性构建的 multi-stage harness streams，包含 802 个 tasks、520 个 tools、42 个 skills 和 62 个 agents。我们评估了对应于 harness 演化核心挑战的两个互补 settings：deployment evaluation，旨在单独考察 harness 扩展时对先前可用能力的 retention；以及 self-evolving adaptation evaluation，旨在测试引入新能力时积累的经验是否仍然有用。我们的结果揭示了三个持续存在的差距。首先，仅 harness 扩展就会降低在先前已解决的 tasks 上的性能，产生 harness-induced forgetting。其次，来自 self-evolving adaptation 的收益在 harness 演化的各个阶段、能力维度和 environments 中仍然不一致。第三，retention 和 adaptation 可能会朝着不同的方向拉扯：保留早期能力并不一定能改善对新引入能力的 adaptation，反之亦然。这些结果确立了 harness evolution 是构建 agents 的一项独特挑战，这些 agents 需要在保留先前有效行为的同时跟上不断演化的 harness。"}, {"title": "ElderBench: Benchmarking Autonomous Mobile Agents for Older Adults", "arxiv_id": "2609.04850", "authors": "Weide Zhan, Qumu Shaqu, Yuanqing Liu, Peng Zhang, Jiahao Liu, Kam Him Lam, Ning Gu, Zhan Hu, Tun Lu", "summary": "While autonomous mobile agents hold great potential for assisting older adults with smartphone usage, existing GUI benchmarks mainly rely on explicit, goal-oriented instructions and rarely capture the naturally occurring language patterns of older users, such as indirect speech, referential ambiguity, and under-specified requests. This mismatch between benchmark instructions and real-world elderly interactions may hinder reliable agent deployment. To address this gap, we present ElderBench, the first benchmark for evaluating mobile GUI agents in authentic elderly-oriented scenarios. ElderBench is constructed from 249 naturally elicited smartphone tasks collected from older adults across 20 applications. We first characterize the linguistic divergence between elderly instructions and existing GUI benchmark instructions from syntactic, semantic, and pragmatic perspectives. We then evaluate mainstream GUI agents and Vision-Language Models under both online and offline settings, revealing substantial performance degradation when handling elderly-oriented instructions. Through controlled instruction normalization, failure analysis, and fine-grained linguistic feature analysis, we further identify how elderly-specific language patterns contribute to agent failures. Our findings provide actionable design insights toward more adaptive, interpretable, and age-inclusive GUI agents for older adults.", "category": "cs.AI", "cluster": "Agent Benchmarks \u0026 Evaluation", "tags": ["cs.AI"], "filter_reason": "这篇论文提出了 ElderBench，一个用于评估移动 GUI 智能体在老年人真实场景下表现的基准。论文的核心研究对象是“自主移动智能体”和“GUI 智能体”，这明确属于 LLM Agents / Agentic AI 的范畴。根据筛选标准第一步，“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents / Multi-Agent LLMs，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留”。该论文不仅评估了主流智能体，还进行了失败分析和细粒度语言特征分析，以揭示智能体在处理模糊、非直接指令时的失败机制，其最终目的是为构建更具适应性的智能体提供设计见解。此外，根据第五步的校准规则，“不要只因为论文是 benchmark、evaluation、behavior analysis... 就排除。只要标题和摘要明确围绕 LLM Agents / Agentic AI 展开，就应返回 True”。因此，该论文符合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出了三个递进的研究问题：自然获取的老年人 GUI 指令与传统 benchmark 指令在语言特征上有何系统性差异（RQ1）？当前主流 GUI agents 和 VLMs 在执行老年人自然指令时表现如何（RQ2）？哪些语言层面和执行层面的因素导致了 agent 在老年人场景中的失败（RQ3）？核心问题在于，GUI agents 被视为降低老年人数字使用障碍的 promising 方案——老年人因 ICT literacy 有限、对界面惯例不熟悉、难以理解复杂数字流程，在 online shopping、transportation booking、mobile payment 等日常任务中面临显著困难，而 GUI agents 可以让用户用自然语言表达需求并代为执行界面操作。然而，agent 能否可靠地辅助老年人，取决于它能否理解老年人真实的语言表达方式。老年人由于技术词汇有限和对数字界面不熟悉，倾向于使用 indirect speech（如\"声音太小了，听不见\"而非\"调大音量\"）、referential ambiguity（如\"把这个号码加到黑名单\"）、disfluency 和 under-specification 等非标准语言模式。如果 benchmark 的指令与真实老年人交互语言之间存在 mismatch，那么在 benchmark 上表现良好的 agent 在实际部署中仍可能频繁失败。这个问题的重要性在于：它直接关系到 age-inclusive GUI agent 能否从实验室走向真实部署，而随着全球人口老龄化加速，降低老年人数字鸿沟的社会价值日益突出。\n\n### § 2 前人工作与不足\n\nGUI agent 的评测领域已有多个代表性 benchmark，但它们在指令设计上存在一个共同的结构性缺陷。AndroidWorld（Rawles et al., 2025）提供了可执行的 Android 环境和 116 个跨应用任务，AndroidLab（Xu et al., 2025b）建立了多模态 agent 评测基础设施，A3（Chai et al., 2026）引入了 essential-state procedural evaluation，ProBench（Yang et al., 2026）覆盖了 34 个应用的 217 个任务，MobileWorld（Kong et al., 2026）探索了长时程跨应用交互。这些 benchmark 的指令均采用 explicit、goal-oriented、carefully specified 的格式——例如\"在 Download 文件夹中找到上个月内下载的简历文件，以 candidates_cv 为主题发送至 HR_chen@gmail.com\"。这种设计源于评测可靠性的工程需求：明确指令便于自动化验证和可复现评估。但问题在于，这种指令构造方式隐含了一个关键假设——用户会以标准化、动作驱动的方式表达需求。该假设对年轻技术用户可能成立，但对老年人失效：老年人缺乏技术词汇和界面心智模型，无法将需求转化为 explicit operational predicates，而是以 implicit state descriptions、context-dependent references 和 fragmented expressions 来表达。Mobile-Bench-v2（Xu et al., 2025a）尝试引入 ambiguous instruction 设置，但其做法是从完整指令中移除 task-specific slots 来模拟不确定性，而非从真实用户中自然获取——这种人工构造的 ambiguity 与老年人自发的语言模式在语言学性质上存在本质差异。KnowU-Bench（Chen et al., 2026）虽然引入了 population-specific design，但其指令并非从目标用户群体中自然获取，也缺乏系统性的 linguistic analysis。更根本的是，此前没有任何工作从 syntactic、semantic、pragmatic 三个语言学维度系统刻画老年人 GUI 指令与传统 benchmark 指令之间的 divergence，因此无法定位 agent 失败究竟源于语言 mismatch 还是任务本身的执行难度。ElderBench 通过从 28 位老年人中半结构化访谈自然获取 249 条真实指令，并设计 controlled instruction normalization 实验将语言因素与任务难度解耦，填补了这一评测缺口。", "core_insight": "好的，作为精确的学术阅读助手，我将根据您的要求，对这篇论文进行深入分析。\n\n### § 3 重建作者的思考路径\n\n要理解这篇论文的动机，我们需要回到论文发表前的知识状态。当时，研究者们已经观察到几个关键事实：\n\n1.  **GUI Agent 基准测试的局限性**：现有的主流基准测试（如 AndroidWorld、MobileWorld）都采用“显式、目标导向、精心指定”的指令。这些指令通常包含明确的操作对象、位置和动作，例如“在下载文件夹中找到上个月下载的简历文件，并将其发送给 HR_chen@gmail.com，主题为 candidates_cv”。这种设计虽然便于自动化评估和结果复现，但它本质上是一种“理想化”的交互模式。\n\n2.  **老年用户语言行为的已知特征**：来自人机交互和语言学领域的研究已经指出，老年人在描述技术需求时，其语言模式与年轻用户或标准指令集存在显著差异。他们更倾向于使用**间接表达**（如“声音太小了，我听不见”）、**指代模糊**（如“把这个号码加入黑名单”）、**信息不完整**（如“帮我弄大一点”）以及**碎片化、非标准的句式**。这些特征源于他们对技术术语的不熟悉、对界面操作流程的认知困难，以及更依赖情境和上下文的沟通习惯。\n\n3.  **现有基准测试的“生态位”缺失**：尽管有研究（如 Mobile-Bench-v2）开始探索不完整指令或模糊意图，但这些工作通常是通过**人为构造**或**从完整指令中删除信息**来模拟不确定性，而非直接收集真实用户的自然语言。这意味着，现有基准测试在“目标用户群体”和“语言现象的真实性”上存在一个关键的空白。\n\n基于以上三点，一个认真研究这个问题的研究者会自然地产生一个疑问：**如果我们将现有 GUI Agent 直接部署给老年用户，它们能否理解并执行那些充满间接表达、指代模糊和不完整信息的自然语言指令？** 现有的基准测试无法回答这个问题，因为它们所使用的指令本身就是“非自然”的。因此，研究者意识到，要评估和提升 GUI Agent 在真实老年用户场景下的鲁棒性，必须首先构建一个**从真实老年用户中自然采集**的、能够反映其独特语言模式的指令集和评估框架。这就是 ElderBench 的出发点。\n\n### § 4 核心 Intuition\n\n先前方法失效的核心在于，它们用“设计出来的”指令去评估 Agent，而老年用户说的是“自然涌现的”语言。ElderBench 的核心直觉是：**Agent 失败的根本原因不是任务本身有多难，而是指令的语言形式与 Agent 的训练/评估数据之间存在严重的“语言鸿沟”**。通过收集真实老年用户的指令，并对比其与标准指令在句法、语义和语用上的系统性差异，ElderBench 揭示了这种鸿沟的具体表现，并通过“指令规范化”实验证明，仅仅将老年用户的自然语言“翻译”成标准指令，就能显著提升 Agent 的成功率。因此，要让 Agent 真正服务于老年用户，其核心挑战不是提升规划或视觉能力，而是**从“理解明确指令”转向“理解隐含意图”**，即 Agent 必须学会从间接、模糊、不完整的表达中推断出用户真正想要的操作。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《ElderBench: Benchmarking Autonomous Mobile Agents for Older Adults》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出了三个递进的研究问题：自然获取的老年人 GUI 指令与传统 benchmark 指令在语言特征上有何系统性差异（RQ1）？当前主流 GUI agents 和 VLMs 在执行老年人自然指令时表现如何（RQ2）？哪些语言层面和执行层面的因素导致了 agent 在老年人场景中的失败（RQ3）？核心问题在于，GUI agents 被视为降低老年人数字使用障碍的 promising 方案——老年人因 ICT literacy 有限、对界面惯例不熟悉、难以理解复杂数字流程，在 online shopping、transportation booking、mobile payment 等日常任务中面临显著困难，而 GUI agents 可以让用户用自然语言表达需求并代为执行界面操作。然而，agent 能否可靠地辅助老年人，取决于它能否理解老年人真实的语言表达方式。老年人由于技术词汇有限和对数字界面不熟悉，倾向于使用 indirect speech（如\"声音太小了，听不见\"而非\"调大音量\"）、referential ambiguity（如\"把这个号码加到黑名单\"）、disfluency 和 under-specification 等非标准语言模式。如果 benchmark 的指令与真实老年人交互语言之间存在 mismatch，那么在 benchmark 上表现良好的 agent 在实际部署中仍可能频繁失败。这个问题的重要性在于：它直接关系到 age-inclusive GUI agent 能否从实验室走向真实部署，而随着全球人口老龄化加速，降低老年人数字鸿沟的社会价值日益突出。 ### § 2 前人工作与不足 GUI agent 的评测领域已有多个代表性 benchmark，但它们在指令设计上存在一个共同的结构性缺陷。AndroidWorld（Rawles et al., 2025）提供了可执行的 Android 环境和 116 个跨应用任务，AndroidLab（Xu et al., 2025b）建立了多模态 agent 评测基础设施，A3...\n2. 核心操作：方法部分围绕这一洞察展开：好的，作为精确的学术阅读助手，我将根据您的要求，对这篇论文进行深入分析。 ### § 3 重建作者的思考路径 要理解这篇论文的动机，我们需要回到论文发表前的知识状态。当时，研究者们已经观察到几个关键事实： 1. **GUI Agent 基准测试的局限性**：现有的主流基准测试（如 AndroidWorld、MobileWorld）都采用“显式、目标导向、精心指定”的指令。这些指令通常包含明确的操作对象、位置和动作，例如“在下载文件夹中找到上个月下载的简历文件，并将其发送给 HR_chen@gmail.com，主题为 candidates_cv”。这种设计虽然便于自动化评估和结果复现，但它本质上是一种“理想化”的交互模式。 2. **老年用户语言行为的已知特征**：来自人机交互和语言学领域的研究已经指出，老年人在描述技术需求时，其语言模式与年轻用户或标准指令集存在显著差异。他们更倾向于使用**间接表达**（如“声音太小了，我听不见”）、**指代模糊**（如“把这个号码加入黑名单”）、**信息不完整**（如“帮我弄大一点”）以及**碎片化、非标准的句式**。这些特征源于他们对技术术语的不熟悉、对界面操作流程的认知困难，以及更依赖情境和上下文的沟通习惯。 3. **现有基准测试的“生态位”缺失**：尽管有研究（如 Mobile-Bench-v2）开始探索不完整指令或模糊意图，但这些工作通常是通过**人为构造**或**从完整指令中删除信息**来模拟不确定性，而非直接收集真实用户的自然语言。这意味着，现有基准测试在“目标用户群体”和“语言现象的真实性”上存在一个关键的空白。 基于以上三点，一个认真研究这个问题的研究者会自然地产生一个疑问：**如果我们将现有 GUI Agent 直接部署给老年用户，它们能否理解并执行那些充满间接表达、指代模糊和不完整信息的自然语言指令？** 现有的基准测试无法回答这个问题，因为它们所使用的指令本身就是“非自然”的。因此，研究者意识到，要评估和提升 GUI Agent 在真实老年用户场景下的鲁棒性，必须首先构建一个**从真实老年用户中自然采集**的、... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：## **ElderBench: Benchmarking Autonomous Mobile Agents for Older Adults** Weide Zhan Fudan University Shanghai, China wdzhan25@m.fudan.edu.cn Peng Zhang Fudan University Shanghai, China zhangpeng_@fudan.edu.cn Ning Gu Fudan University Shanghai, China ninggu@fudan.edu.cn Qumu Shaqu Fudan University Shanghai, China 25213050317@m.fudan.edu.cn Jiahao Liu Fudan University Shanghai, China jiahaoliu21@m.fudan.edu.cn Zhan Hu Fudan University Shanghai, China huzhan@fudan.edu.cn Yuanqing Liu Fudan University Shanghai, China 25213050283@m.fudan.edu.cn Kam Him Lam Fudan University Shanghai, China 24302010074@m.fudan.edu.cn Tun Lu Fudan University Shanghai, China lutun@fudan.edu.cn ## **Abstract** While autonomous mobile agents hold great potential for assisting older adults with smartphone usage, existing GUI benchmarks mainly rely on explicit, goal-oriented instructions and rarely capture the natur...", "additional_insights": "### § 8 Take-aways\n\nElderBench 是首个基于真实老年人自然语言指令构建的 mobile GUI agent benchmark，包含从 28 位 59–84 岁老年人中通过 semi-structured interviews 收集的 249 个任务，覆盖 20 个 Android 应用。与现有 benchmark 指令相比，老年人指令在 syntactic 层面显著更短（78.31% 少于 20 字符）且结构异质（47.80% 为 elliptical 或 narrative），在 semantic 层面高频出现 Indirect Speech（19.28%）、Referential Ambiguity（12.85%）和 Under-specification（38.15%），在 pragmatic 层面集中于 Life Services、Social Communication 和 System Settings 场景。在 online（130 tasks）和 offline（119 tasks）双模式下评估 5 个 VLMs 和 4 个 GUI agents 后，无一模型 overall SR 超过 50%，其中 Gemini-3-Flash 和 GUI-Owl-1.5 分别以 49.80% 和 45.38% 领先各自类别。Controlled instruction normalization 实验显示，将老年人指令改写为 explicit、action-oriented 形式后，AutoGLM 成功任务数从 37 升至 61，Qwen3-VL-Flash 从 23 升至 46，McNemar's test 显著（p \u003C 0.001），直接量化了 linguistic mismatch 对任务失败的贡献。Failure analysis 表明 AutoGLM 在 online 子集上的 63 次失败中，57.1% 源于 intent understanding 和 capability boundary 错误，33.3% 源于 planning/state tracking 错误，两者合计 90.4%，说明主要瓶颈不在 low-level visual grounding 而在意图理解和多步执行维持。Cross-feature interaction 分析揭示了三种代表性模式：Information inquiry 场景中冗长描述反而提供有效约束关键词（+0.70），System Settings 与长文本组合产生负向交互（−0.42），Canonical 句法与 Indirect Speech 语义产生冲突信号（−0.34）。\n\n### § 9 最脆弱的假设\n\n论文最核心且最脆弱的假设是：controlled instruction normalization 实验中，将老年人原始指令改写为 explicit、action-oriented 形式后，任务本身（goal、environment、required operations）保持不变，性能差异完全归因于 linguistic formulation 的变化。这一假设是论文中心论点——\"elderly-specific language patterns contribute to agent failures\"——的直接证据基础。如果改写过程在无意中改变了任务难度（例如为 Under-specification 类指令补充了原始指令中真正缺失的执行参数，而非仅仅将隐含意图显式化），那么性能提升就不能单纯归因于语言风格的匹配，而是部分来自任务规格化本身的简化。论文提供的证据是改写后人工验证语义一致性（90% 直接接受，10% 作者修订），但这一验证仅保证 goal 层面的语义等价，并未控制执行信息量的变化。例如，\"声音太小了听不见\"被改写为\"调大音量\"时，后者不仅改变了语言风格，还明确指定了操作类型（volume adjustment）和方向（increase），这些信息在原始指令中是真正缺失的——agent 需要从用户状态描述中推断出这些，这本身就是任务复杂度的一部分，而非纯粹的语言处理问题。论文缺少对改写前后信息量差异的定量控制（如对比改写前后指令的 information completeness score），也缺少将改写指令施加于相同 task graph 时的 per-category 信息增益分解分析。\n\n### § 10 最小复现实验\n\n在一周时间内，最可行的最小复现实验是复现 controlled instruction normalization 的核心结论。具体方案：从论文的五个 semantic category 中各抽取 10 条老年人风格指令（共 50 条），可自行构造或从论文 supplementary material 中获取示例，确保覆盖 Indirect Speech（如\"字太小了看不清\"）、Referential Ambiguity（如\"把这个删掉\"）、Under-specification（如\"帮我弄一下支付\"）等类型。将每条指令人工改写为 explicit、action-oriented 形式，仅改变语言表达而不增减任务目标。选取一个开源 GUI agent（如 AutoGLM 或 Doubao-1.5-UI-TARS）和一个通用 VLM（如 Qwen3-VL-Flash），在相同的 Android emulator 环境中对原始指令和改写指令分别执行 online evaluation，记录每条指令的 success/failure 结果。使用 McNemar's test 检验配对差异的统计显著性，并按 semantic category 分组计算 Δ（改写后成功数 − 改写前成功数）。如果总体 Δ 显著为正（p \u003C 0.05）且 Indirect Speech 和 Under-specification 类别的增益最大，则支持论文的 claim；如果 Δ 不显著或主要来自 Clear and Explicit 类别（说明改写本身改变了任务难度而非语言匹配），则反驳该 claim。此方案无需构建完整 249 task benchmark，仅需 50 条指令的 paired evaluation，预计 3–4 天可完成数据准备和实验执行。", "research_value": "### § 11 最强反例设计\n\n针对 ElderBench 最核心的 claim——即老年人特定的语言模式导致了 agent 的失败，我将设计一个基于“交互式意图对齐”的替代解释实验来反驳该论文。论文最脆弱的假设在于 controlled instruction normalization 将性能提升完全归因于 linguistic formulation 的转变，而忽略了真实人机交互中信息补全的动态性。老年人使用 indirect speech 或 under-specification 并非语言缺陷，而是在日常对话中默认通过后续交互来补全信息的正常认知习惯。因此，性能瓶颈根本不在于 agent 无法理解这些“非标准语言”，而在于现有 GUI agents 被强制要求在 single-turn（单轮）设定下执行任务，剥夺了它们通过 clarification dialogue（澄清对话）主动获取缺失信息的机会。为了验证这一替代解释，我会设计一个 Clarification Baseline 实验：保留 ElderBench 中原始的老年人 under-specified 指令（如“帮我弄一下支付”），但不直接让 agent 盲目执行，而是允许 agent 在执行前向用户发起最多三轮的 clarification queries（如询问“您是指向某人转账还是查看账单？”）。如果在这个交互式设定下，agent 的 task success rate 能够达到与 controlled instruction normalization（直接喂入 explicit 指令）相当甚至更高的水平，这就直接反驳了论文的结论。这将证明 ElderBench 中 agent 的失败并非源于 linguistic mismatch，而是源于 benchmark 本身强制采用的 single-turn execution paradigm（单轮执行范式）与老年人自然的 collaborative grounding（协作性共识建立）交互模式之间的结构性错位。论文所声称的“语言模式导致失败”实际上是一个伪命题，真正的失败归因于 benchmark 设计对交互上下文的生硬截断。\n\n### § 12 Follow-up Research Idea\n\n基于 ElderBench 强制单轮执行的局限，我提出一个全新的研究方向：构建一个面向 GUI agents 的动态交互式意图收敛评估框架，将 benchmark 的核心从“静态指令执行”转变为“动态认知协商”。驱动这个想法的未满足需求是：真实世界中老年人的 under-specification 和 referential ambiguity 不应被视为需要被“改写消除”的噪声，而应被视为触发 agent 主动交互的必要信号；当前的 benchmark 体系完全忽略了 agent 识别自身认知边界并主动发起 clarification 的能力评估。这一想法可以借鉴 Conversational Agents 和 Mixed-Initiative Interaction（混合主动交互）领域的 collaborative grounding 理论，将 GUI 任务分解为 initial instruction、information gap detection、clarification action 和 final execution 四个动态阶段。第一个实验将构建一个 multi-turn evaluation sandbox：初始输入 ElderBench 中的 ambiguous 指令，允许 agent 在操作界面的同时生成自然语言询问，由模拟老年人用户（基于 LLM 驱动的 user simulator 并注入 ElderBench 的真实语言特征）进行响应。实验将对比三种 agent 架构：(1) 直接执行的 baseline agent，(2) 具备 clarification 能力但无策略的 agent，(3) 具备 uncertainty estimation 并能精准定位 information gap 进行针对性提问的 agent。评估指标除了最终的 task success rate，还将引入 Clarification Efficiency（澄清效率：用最少轮数达成意图对齐）和 Cognitive Load Score（认知负荷：澄清问题的语言复杂度对老年人的友好程度）。这一提议从根本上 reframing 了 GUI agent 的评测范式：不再要求 agent 去适应理想化的 explicit 指令，而是评估 agent 在面对真实人类认知局限时，通过多轮交互动态重构任务规格的能力，从而打开通往真正 age-inclusive conversational GUI agents 的研究路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Weide Zhan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Qumu Shaqu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuanqing Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Peng Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiahao Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Kam Him Lam\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ning Gu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhan Hu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Tun Lu\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Fudan University\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "尽管 autonomous mobile agents 在辅助老年人使用智能手机方面具有巨大潜力，但现有的 GUI benchmarks 主要依赖明确的、目标导向的指令，很少捕捉老年用户自然产生的语言模式，如 indirect speech、referential ambiguity 和 under-specified requests。benchmark 指令与现实世界老年人交互之间的这种不匹配，可能会阻碍 agents 的可靠部署。为了填补这一空白，我们提出了 ElderBench，这是第一个用于在真实的面向老年人场景中评估 mobile GUI agents 的 benchmark。ElderBench 基于 249 个自然引出的智能手机任务构建而成，这些任务收集自老年人群体，涵盖了 20 个应用。我们首先从 syntactic、semantic 和 pragmatic 视角，刻画了老年人指令与现有 GUI benchmark 指令之间的语言差异。随后，我们在 online 和 offline 设置下评估了主流的 GUI agents 和 Vision-Language Models，揭示了在处理面向老年人的指令时出现的显著性能下降。通过 controlled instruction normalization、failure analysis 和 fine-grained linguistic feature analysis，我们进一步明确了老年人特定的语言模式是如何导致 agent 失败的。我们的研究发现为面向老年人的更具适应性、可解释性和年龄包容性的 GUI agents 提供了可操作的设计见解。"}, {"title": "ERPBench: Evaluating LLM Agents for Enterprise Decision-Making Across Competitive Market Ecologies", "arxiv_id": "2609.04667", "authors": "Xinran Zhang, Pengrui Lu, Lyumanshan Ye, Pengfei Liu", "summary": "Large language model (LLM) agents are increasingly proposed for enterprise workflows, yet existing evaluations rarely test whether business-decision conclusions transfer across competitive market ecologies. We introduce ERPBench, an execution-instrumented benchmark for enterprise decision agents in a six-round Enterprise Resource Planning (ERP) simulation with coupled pricing, production, procurement, inventory, finance, and shared-market competition. ERPBench evaluates the same 100 fixed problems in two matched competitive market ecologies: Solo, where each evaluated LLM agent competes against fixed rule-based opponents, and Arena, where six evaluated LLM agents compete in a shared market. Across six model families, this yields 1,200 model-level trajectories spanning 7,200 decision rounds. Under the observed service configuration, the leading model differs between ecologies: DeepSeek leads in Solo (252.29M mean valuation; mean rank 1.67), whereas Gemini leads in Arena (263.95M; 1.76). The two ecologies identify the same task-level winner on only 21 of 100 problems, and Gemini's bottom-rank rate falls from 22 % to 0 % in Arena. ERPBench supports paired evaluation of whether enterprise-agent rankings transfer across competitive market ecologies, supplemented by aggregate execution-intervention analysis. Code and benchmark resources are available in our https://github.com/GAIR-NLP/erp-bench.", "category": "cs.AI", "cluster": "Agent Benchmarks \u0026 Evaluation", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：当相同的企业决策任务被嵌入到不同的竞争市场生态中时，关于大型语言模型（LLM）agent的评估结论是否能够保持稳定与可迁移。具体而言，作者探究模型在对抗固定规则对手的_Solo_环境与在共享市场中与其他LLM agent相互竞争的_Arena_环境中，其表现排名和决策可靠性是否一致。这个问题至关重要，因为企业决策agent在真实场景中需要反复分配稀缺资源，且定价、生产、采购、库存与财务决策会随时间复合累积并相互制约。在竞争市场中，这些决策具有战略耦合性，一个agent的定价或库存策略会直接改变其他agent面临的需求格局。传统的benchmark往往假设对手行为是静态背景噪音，但事实上对手行为会动态改变价格、需求分配和现金流结果。解决这一问题能够揭示模型是作为独立优化器（如DeepSeek在_Solo_中领先）还是作为竞争响应者（如Gemini在_Arena_中领先）更具优势，从而为企业agent的可靠部署提供超越单一终端分数的、跨生态的鲁棒性评估标准。\n\n### § 2 前人工作与不足\n\n针对LLM agent的评估，前人工作主要沿三条路线展开，但均存在关键评测缺口。首先，Stateful executable agent benchmarks（如AgentBench, SWE-bench, WebArena, OSWorld, _𝜏_-bench）成功将评估从静态问答转向有状态、可验证的交互环境，确立了可复现性基线。然而，这些benchmark通常将周围的竞争市场生态固定不变，其方法限制在于未将“对手行为”作为显式的实验变量，因此无法测试相同任务结论在不同生态下的稳定性。其次，Enterprise and professional agent benchmarks（如TheAgentCompany, WorkArena++, CRMArena）测试了agent在专业工作流中的任务完成能力，但它们评估的是CRM或办公任务的独立完成度，而非耦合的企业资源规划（ERP）决策。在ERP场景中，定价、生产与财务受产能和现金联合约束，一个语法合理但不可执行的plan无法产生实际价值，这类benchmark缺乏对联合约束满足度的执行检验。最后，Economic and competitive agents（如CompeteAI, EconAgent, InvestorBench）虽然研究了LLM在经济市场中的决策行为，但它们的评测目标仅限于比较哪个模型在商业领域表现更好，而没有采用配对生态协议去验证同一模型-问题对在_Solo_与_Arena_条件下的结论一致性。此外，几乎所有前人系统都仅依赖终端分数进行排名，忽略了决策的执行路径；它们未记录可行性检查、clamping、fallback等执行干预事件，导致无法区分高分是通过干净的执行路径还是通过反复的运行时修复获得的，这在要求高可靠性的企业级部署中是一个致命的评测盲区。", "core_insight": "## § 3 重建作者的思考路径\n\n作者很可能从以下观察出发：现有 LLM agent benchmark 已经从静态问答走向有状态的可执行环境（AgentBench、SWE-bench、WebArena、OSWorld、τ-bench），但这些环境都有一个隐含假设——周围环境是固定的背景，不会因为 agent 的行为而改变对 agent 自身的评价结论。对于代码修复或 web 导航，这个假设大致成立：一个 GitHub issue 是否被解决，不取决于其他 agent 是否在同时修同一个 repo。但企业决策根本不是这样。在竞争市场中，一个 agent 的定价策略会直接改变其他 agent 面临的需求曲线，反之亦然——这是经济学中寡头竞争的基本事实。因此，如果用固定规则对手来评估一个企业决策 agent，得到的排名可能只反映\"对抗这类特定对手的能力\"，而非\"企业决策能力\"本身。\n\n第二个线索来自执行层面。企业决策不是生成一段合理的商业计划文本，而是要在生产能力、现金流、库存、供应商提前期等硬约束下真正可执行。一个模型可能输出语法正确的 JSON，但其中请求的产量超过机器产能、采购量超出预算、或投资选项在当前状态下不可用。现有 benchmark 通常只看最终结果（issue 是否关闭、任务是否完成），但企业场景中，同样的最终估值可能来自一条干净的执行路径，也可能来自反复的解析修复、可行性裁剪和 fallback——这两种情况对部署可靠性有完全不同的含义。\n\n第三个线索来自 benchmark 敏感性研究。近期工作（Alzahrani et al., 2024; Reuel et al., 2024）已经表明，LLM 排行榜的结论可以因为评估协议的变化而翻转。如果连 prompt 格式或评分细节的变化都能改变排名，那么竞争市场生态——一个远比 prompt 格式更根本的实验条件——更可能系统性地改变企业 agent 的评估结论。但现有经济 agent benchmark（CompeteAI、EconAgent、InvestorBench、RetailBench、Market-Bench）虽然已经将 LLM 放入市场环境，却没有把\"竞争市场生态本身\"当作一个被显式控制的实验因子来设计配对比较。\n\n将这三条线索合在一起，作者面对的问题是：**企业决策 agent 的评估结论是否在竞争市场生态变化时保持稳定？** 要回答这个问题，需要三样东西：一个操作耦合的 ERP 模拟环境（定价、生产、采购、库存、财务相互约束）、一个配对评估协议（同一组问题在两种匹配的生态下评估同一批模型）、以及一个执行审计层（记录决策从提出到执行经历了哪些干预）。这正是 ERPBench 的设计。\n\n## § 4 核心 Intuition\n\n在竞争市场中，一个 agent 的决策好坏不能脱离其对手来评判——同样的定价和生产计划，对抗固定规则对手时可能是最优的，但当对手换成其他同样聪明的 LLM agent 时，可能因为价格战、需求被抢占或库存策略被针对而失效。因此，企业决策 agent 的 benchmark 不能只报告一个排行榜，而必须把\"竞争市场生态\"当作一个显式控制的实验变量：同一组问题、同一批模型，在固定对手的 Solo 环境和 LLM 互相竞争的 Arena 环境下分别评估，看结论是否转移。如果不这样做，一个在孤立环境中领先的模型可能只是\"擅长剥削规则对手\"，而非真正擅长企业决策——这正是 ERPBench 所揭示的：DeepSeek 在 Solo 领先但 Arena 中被 Gemini 超越，两种生态在 100 个问题上只有 21 个认同同一个赢家。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《ERPBench: Evaluating LLM Agents for Enterprise Decision-Making Across Competitive Market Ecologies》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出的核心研究问题是：当相同的企业决策任务被嵌入到不同的竞争市场生态中时，关于大型语言模型（LLM）agent的评估结论是否能够保持稳定与可迁移。具体而言，作者探究模型在对抗固定规则对手的_Solo_环境与在共享市场中与其他LLM agent相互竞争的_Arena_环境中，其表现排名和决策可靠性是否一致。这个问题至关重要，因为企业决策agent在真实场景中需要反复分配稀缺资源，且定价、生产、采购、库存与财务决策会随时间复合累积并相互制约。在竞争市场中，这些决策具有战略耦合性，一个agent的定价或库存策略会直接改变其他agent面临的需求格局。传统的benchmark往往假设对手行为是静态背景噪音，但事实上对手行为会动态改变价格、需求分配和现金流结果。解决这一问题能够揭示模型是作为独立优化器（如DeepSeek在_Solo_中领先）还是作为竞争响应者（如Gemini在_Arena_中领先）更具优势，从而为企业agent的可靠部署提供超越单一终端分数的、跨生态的鲁棒性评估标准。 ### § 2 前人工作与不足 针对LLM agent的评估，前人工作主要沿三条路线展开，但均存在关键评测缺口。首先，Stateful executable agent benchmarks（如AgentBench, SWE-bench, WebArena, OSWorld, _𝜏_-bench）成功将评估从静态问答转向有状态、可验证的交互环境，确立了可复现性基线。然而，这些benchmark通常将周围的竞争市场生态固定不变，其方法限制在于未将“对手行为”作为显式的实验变量，因此无法测试相同任务结论在不同生态下的稳定性。其次，Enterprise and professional agent benchmarks（如TheAgentCompany, WorkArena++, CRMArena）测试了agent在专业工作流中的任务完成能力，但它们评估的是CRM或办公任务的独立完成度，而非耦合的企业资源规划（ERP）决策。在ERP场景中，定价、生产与财务受产能和现...\n2. 核心操作：方法部分围绕这一洞察展开：## § 3 重建作者的思考路径 作者很可能从以下观察出发：现有 LLM agent benchmark 已经从静态问答走向有状态的可执行环境（AgentBench、SWE-bench、WebArena、OSWorld、τ-bench），但这些环境都有一个隐含假设——周围环境是固定的背景，不会因为 agent 的行为而改变对 agent 自身的评价结论。对于代码修复或 web 导航，这个假设大致成立：一个 GitHub issue 是否被解决，不取决于其他 agent 是否在同时修同一个 repo。但企业决策根本不是这样。在竞争市场中，一个 agent 的定价策略会直接改变其他 agent 面临的需求曲线，反之亦然——这是经济学中寡头竞争的基本事实。因此，如果用固定规则对手来评估一个企业决策 agent，得到的排名可能只反映\"对抗这类特定对手的能力\"，而非\"企业决策能力\"本身。 第二个线索来自执行层面。企业决策不是生成一段合理的商业计划文本，而是要在生产能力、现金流、库存、供应商提前期等硬约束下真正可执行。一个模型可能输出语法正确的 JSON，但其中请求的产量超过机器产能、采购量超出预算、或投资选项在当前状态下不可用。现有 benchmark 通常只看最终结果（issue 是否关闭、任务是否完成），但企业场景中，同样的最终估值可能来自一条干净的执行路径，也可能来自反复的解析修复、可行性裁剪和 fallback——这两种情况对部署可靠性有完全不同的含义。 第三个线索来自 benchmark 敏感性研究。近期工作（Alzahrani et al., 2024; Reuel et al., 2024）已经表明，LLM 排行榜的结论可以因为评估协议的变化而翻转。如果连 prompt 格式或评分细节的变化都能改变排名，那么竞争市场生态——一个远比 prompt 格式更根本的实验条件——更可能系统性地改变企业 agent 的评估结论。但现有经济 agent benchmark（CompeteAI、EconAgent、InvestorBench、RetailBench、Market-... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：SII-GAIR **==\u003E picture [35 x 28] intentionally omitted \u003C==** **==\u003E picture [21 x 20] intentionally omitted \u003C==** # **ERPBench: Evaluating LLM Agents for Enterprise Decision-Making Across Competitive Market Ecologies** **Xinran Zhang**[1,2,4,*] **Pengrui Lu**[1,3,4,*] **Lyumanshan Ye**[3,4] **Pengfei Liu**[1,3,4,][†] 1Shanghai Innovation Institute 2Beijing Institute of Technology 3Shanghai Jiao Tong University 4GAIR Lab *Equal contribution. †Corresponding author. ## **Abstract** Large language model (LLM) agents are increasingly proposed for enterprise workflows, yet existing evaluations rarely test whether business-decision conclusions transfer across competitive market ecologies. We introduce ERPBench, an execution-instrumented benchmark for enterprise decision agents in a six-round Enterprise Resource Planning (ERP) simulation with coupled pricing, production, procurement, inventory, f...", "additional_insights": "### § 8 Take-aways\nERPBench 是一个执行级 benchmark，通过包含定价、生产、采购等耦合决策的六轮 ERP 模拟，评估 LLM agents 在企业决策中的表现。其核心创新在于将“竞争市场生态”作为受控的测量变量，在 Solo（对抗固定规则对手）和 Arena（六个 LLM agents 共享市场）两种匹配生态中评估相同的 100 个问题。实验覆盖六个模型家族和 7,200 个决策轮次，发现模型排名在不同生态中发生显著逆转：DeepSeek 在 Solo 中以 252.29M 的平均估值领先，而 Gemini 在 Arena 中以 263.95M 的估值登顶。两种生态仅在 21% 的任务中选出相同的赢家，且 Gemini 的垫底率从 Solo 的 22% 降至 Arena 的 0%，表明其具备更强的竞争响应能力。此外，ERPBench 引入了执行审计层，通过记录解析失败、可行性修复和回退等干预事件，揭示了终端估值背后的执行脆弱性，证明高分可能源于频繁的系统修复而非纯粹的决策质量。\n\n### § 9 最脆弱的假设\n该论文最脆弱的假设是：Solo 与 Arena 之间模型排名的逆转纯粹源于“竞争市场生态”的结构性变化（即对手从固定规则变为动态 LLM），而非特定模型组合的交互偏差或服务端模型版本的漂移。如果这个假设不成立，例如排名逆转仅仅是因为 Arena 中特定 LLM 组合产生的随机交互放大了方差，或者实验期间 API 服务端路由到了不同版本的模型快照，那么“生态效应”这一核心贡献将直接失效，沦为特定实验设置下的伪影。论文承认了“Service-side routing and model endpoints may change over time”，但并未提供证据排除这种版本漂移，也没有验证在更换 Arena 中的 LLM 组合后排名逆转是否依然成立。缺少对 Arena 模型组合多样性的消融实验，使得我们无法区分观察到的效应是普适的“生态差异”，还是仅仅针对这特定六个模型组合的偶然现象。\n\n### § 10 最小复现实验\n在一周时间内，可以通过构建一个极简的多智能体定价博弈环境来验证“竞争生态改变模型相对优势”这一核心 claim，而无需复现复杂的 ERP 供应链系统。选择两个当前可用的 LLM（如 GPT-4o 和 Claude-3.5-Sonnet）作为 agent，在 10 个随机生成的市场需求场景中进行 5 轮定价决策。在 Solo 生态中，每个 LLM 对抗一个采用固定加成定价策略的脚本对手；在 Arena 生态中，这两个 LLM 直接在同一市场中竞争。需求分配采用简单的 Multinomial Logit 模型，根据相对价格决定市场份额，最终测量两者的累计利润。如果观察到某个模型在 Solo 中利润领先，但在 Arena 中被反超，则支持论文关于“生态改变模型排名”的 claim；如果排名保持不变或差异不显著，则反驳了该结论。这种方案剥离了 ERP 模拟中繁重的库存和产能约束，直击多智能体竞争交互这一核心变量。", "research_value": "### § 11 最强反例设计\n我会设计一个“Stochastic Solo”环境作为最强反例，直接挑战论文中“排名逆转源于动态竞争生态”的核心 claim。我的替代解释是：Gemini 在 Arena 中的领先并非因为它具备更强的“竞争响应能力”，而是因为它对高方差、充满执行错误（如解析失败、clamping）的混乱环境具有更强的鲁棒性。在 Arena 中，其他 LLM agent 会不可避免地产生非理性的随机决策和频繁的系统干预事件，这实际上将原本的战略博弈环境降级为一个高噪声的随机环境。为了验证这一点，我会在 Solo 环境中保留固定规则对手，但向其决策中注入与 Arena 中 LLM agent 相同比例的随机噪声、非理性定价和执行失败事件，构建一个“Stochastic Solo”生态。如果在这个仅含随机性而无战略耦合的 Stochastic Solo 中，Gemini 的排名依然反超 DeepSeek，那么论文所声称的“生态效应”将被彻底证伪——排名逆转仅仅是因为模型对环境噪声的容忍度不同，而非对动态竞争对手的战略响应。\n\n### § 12 Follow-up Research Idea\n驱动这一 follow-up idea 的局限是：ERPBench 仅将“竞争市场生态”作为宏观黑盒变量来测量终端估值差异，却完全忽略了 LLM agent 在多轮交互中如何构建对竞争对手的内部认知模型。LLM 并非通过博弈论推导进行决策，而是依赖 in-context learning 进行行为模仿与预测，因此宏观的生态排名无法解释 agent 的微观决策机制。我提议将研究方向从“跨生态的终端性能评估”转向“LLM agent 的对手心智模型演化追踪”，借鉴认知科学中的 Theory of Mind (ToM) 递归评估框架。具体而言，不再仅测量最终估值，而是在 ERPBench 的 Arena 每一轮决策前，强制要求 LLM agent 显式输出其对所有其他 agent 下一轮定价与产能的预测分布，并计算该预测与对手实际动作的 KL 散度。第一个实验将追踪六轮交互中各模型 KL 散度的收敛曲线，并对比“预测准确度”与“终端估值”的相关性。这将揭示 Gemini 在 Arena 中的优势究竟源于更精确的对手行为预测（高阶 ToM 能力），还是仅仅源于更保守的默认 fallback 策略，从而将黑盒的“生态效应”打开为可量化的微观认知机制，与现有的宏观 benchmark 评估形成本质区别。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Xinran Zhang\", \"affiliations\": [1, 2, 4], \"markers\": [\"*\"]},\n    {\"name\": \"Pengrui Lu\", \"affiliations\": [1, 3, 4], \"markers\": [\"*\"]},\n    {\"name\": \"Lyumanshan Ye\", \"affiliations\": [3, 4], \"markers\": []},\n    {\"name\": \"Pengfei Liu\", \"affiliations\": [1, 3, 4], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Shanghai Innovation Institute\"},\n    {\"id\": 2, \"name\": \"Beijing Institute of Technology\"},\n    {\"id\": 3, \"name\": \"Shanghai Jiao Tong University\"},\n    {\"id\": 4, \"name\": \"GAIR Lab\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "大型语言模型（LLM）智能体越来越多地被提出用于企业工作流，然而现有评估很少测试商业决策结论是否能在竞争性市场生态之间迁移。我们提出ERPBench，一个面向企业决策智能体的执行检测基准，在包含定价、生产、采购、库存、财务和共享市场竞争的六轮企业资源规划（ERP）模拟中进行评估。ERPBench在两个匹配的竞争性市场生态中评估相同的100个固定问题：Solo，每个被评估的LLM智能体与固定的基于规则的对手竞争；以及Arena，六个被评估的LLM智能体在共享市场中竞争。跨越六个模型家族，这产生了1,200条模型级轨迹，涵盖7,200个决策轮次。在观察到的服务配置下，领先模型在不同生态中有所不同：DeepSeek在Solo中领先（平均估值252.29M；平均排名1.67），而Gemini在Arena中领先（263.95M；1.76）。两个生态仅在100个问题中的21个上识别出相同的任务级胜者，且Gemini的底部排名率在Arena中从22%降至0%。ERPBench支持对企业智能体排名是否在竞争性市场生态之间迁移进行配对评估，并辅以聚合执行干预分析。代码和基准资源可在我们的https://github.com/GAIR-NLP/erp-bench获取。"}, {"title": "$τ^τ$-Bench: An Environment for End-To-End, Realistic Agent Construction", "arxiv_id": "2609.04611", "authors": "Quan Shi, Keshav Dhandhania, Karthik Narasimhan, Victor Barres", "summary": "LLM agents are rapidly becoming production software, deployed to handle customer service, adjudicate disputes, and operate internal systems. Notably, the work of building them is increasingly handed to coding agents, yet existing benchmarks say little about whether an AI system can deliver one under the conditions of a real client engagement. We introduce $τ^τ$-bench (pronounced hyper-tau-bench), a benchmark that makes agent construction the task. A developer agent is given the records a business actually keeps, a client who holds requirements, a production API that operations must run through, a codebase to inherit, and limits on serving cost and models: the same starting point a real engagement provides. From these it must deliver a complete customer-service agent, scored by deploying that agent against held-out simulated users. Across 53 tasks spanning four domains, the strongest configuration, Claude Opus 5 under Claude Code, passes just 23.9% of evaluation simulations. Meanwhile, an expert-authored reference ceiling scores 82.2%. The failures mirror ones human agent developers see: models issue shallow queries in place of deep comprehension of the records, communicate almost nothing to the client, and experiment too little with agent architecture and serving spend, shipping the first design that runs. We aim for $τ^τ$-bench to turn the work of cooperative agent building into a measurable target for coding agents.", "category": "cs.AI", "cluster": "Agent Benchmarks \u0026 Evaluation", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior, Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=24 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文提出了一个名为 $τ^τ$-bench 的基准测试，其核心任务是评估“智能体构建”能力。具体而言，它要求一个开发者智能体在真实的约束条件下（如业务记录、客户需求、生产API、代码库和成本限制）交付一个完整的客户服务智能体，并通过部署该智能体与模拟用户交互来进行评分。\n\n根据筛选标准第一步中的“保留”规则：“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents / Multi-Agent LLMs，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。” 这篇论文明确属于评估基准和失败机制诊断的范畴。它不仅评估了智能体在长周期任务中的构建能力，还深入分析了模型在架构实验、深度理解和沟通上的失败模式（如“experiment too little with agent architecture”），这些结论直接有助于理解和改进智能体的架构设计和构建流程。\n\n此外，重要校准中也明确指出：“不要只因为论文是 benchmark、evaluation、behavior analysis... 就排除。只要标题和摘要明确围绕 LLM Agents / Agentic AI / Self-Evolving LLMs 展开，就应返回 True。” 该论文完全聚焦于 LLM 智能体的构建与评估，因此完全符合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n论文提出的研究问题是：当前的 AI 系统能否在真实的客户参与条件下，端到端地构建一个可部署的 customer-service agent，而不仅仅是作为 agent 执行任务？为了回答这个问题，作者引入了 *τ[τ]*-bench (hyper-tau-bench)，一个将 agent construction 本身作为任务的 benchmark。在这个设定中，一个 developer agent 被赋予企业实际保存的记录、一个持有未记录需求的模拟客户、一个生产环境 REST API、一个需要继承的代码库，以及严格的 serving cost 和 model 限制。developer 必须从这些材料中恢复规范，并交付一个完整的 agent，然后通过将其部署在 held-out 的模拟用户任务上进行评分。\n\n这个问题的重要性在于，LLM agents 正迅速成为生产软件，被广泛部署于客户服务、争议裁决和内部系统操作中。值得注意的是，构建这些 agent 的工作正越来越多地交给 coding agents 完成。然而，构建 agent 本身极其困难且具有经济价值，其挑战沿两个轴线展开：一是恢复规范，知识以企业实际保存的形式存在，如标准操作程序、支持记录和电子表格，且许多关键需求仅存在于人类利益相关者脑海中，需要通过提问才能浮现；二是构建本身，开发者很少从零开始或拥有无限预算，他们必须继承现有代码库，并在成本、延迟和可用模型的硬约束下做出无数设计决策。因此，评估 AI 系统构建 agent 的能力，不仅填补了现有 benchmark 的空白，也直接回应了行业将 agent 开发工作自动化的趋势。\n\n### § 2 前人工作与不足\n这个问题之前并未被完全解决。最相关的前人工作可分为三类，但它们各自存在关键不足。\n\n第一类是 **Coding Benchmarks**，如 SWE-bench (Jimenez et al., 2024) 和 ProgramBench (Yang et al., 2026)。SWE-bench 评估 agent 在现有代码库中解决特定问题的能力，而 ProgramBench 要求 agent 根据文档和参考可执行文件重建系统。虽然 ProgramBench 在“从零构建”方面与 *τ[τ]*-bench 相似，但它重建的是程序，而 *τ[τ]*-bench 重建的是 agent。更重要的是，传统 coding benchmarks 通常提供清晰的文档和参考实现，而 *τ[τ]*-bench 要求 developer 从多模态、分散且可能冲突的业务记录和交互式客户中恢复规范，这更真实地模拟了实际客户参与的条件，而非纯粹的工程任务。\n\n第二类是 **Agent Benchmarks and User Simulation**，如 *τ*-bench (Yao et al., 2025) 和 *τ*2-bench (Barres et al., 2025)。这些工作评估一个*已完成*的 agent 在领域策略、工具和知识库下服务模拟用户的能力。然而，它们将 agent 视为给定，其策略、工具和架构由 benchmark 设计者编写，只评估其运行表现。*τ[τ]*-bench 颠倒了这种关系：agent 是交付物，developer 的分数就是它构建的 agent 在未见过的 held-out 任务上的 *τ*-bench 式表现。这种评测缺口的本质在于，之前的 benchmarks 从未将“构建 agent”这一过程本身作为评估目标，因此无法衡量 AI 系统在需求恢复、架构探索和成本优化等真实开发环节中的能力。\n\n第三类是 **Automated Agent Design and Self-Improvement**，如 meta-agents (Hu et al., 2025) 和 AgentSquare (Shang et al., 2025)。这些方法让 AI 系统自动生成或改进 agent 设计，但它们将 agent 设计视为纯粹的优化问题：任务规范预先完全指定，系统可以随意查询 ground-truth 评估进行迭代。而在 *τ[τ]*-bench 中，规范必须在构建之前从证据中组装，且 ground-truth 评估被保留，developer 必须自己编写模拟和测试来验证，就像真实的工程团队一样。这种关键假设的失效意味着，之前的系统从未被要求在信息不完整和缺乏即时反馈的环境中工作，而这正是真实 agent 开发的核心挑战。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM agents 逐渐成为生产软件的背景下，构建 agent 的工作正越来越多地被交给 coding agents。然而，现有的 benchmarks 存在一个明显的盲区：它们要么评估一个已经构建好的 agent 在特定 policy 和 tools 下的运行表现（如 τ-bench），要么评估 coding agent 在已有代码库中修复 issue 或从零生成软件的能力（如 SWE-bench、ProgramBench）。这些评估都无法回答一个关键问题：AI 系统能否在真实客户委托的条件下，端到端地交付一个可部署的 agent？\n\n作者可能从真实的 agent 开发经验中观察到两个核心困难。第一是 recovering the specification：agent 所需的知识并非以整洁的文档形式存在，而是散落在 standard operating procedures、support transcripts、spreadsheets 以及人类 stakeholder 的脑海中，需要通过提问来挖掘。第二是 construction under constraints：开发往往不是从零开始，而是继承一个已有 codebase，并且必须在 cost、latency 和可用 models 的硬约束下完成。这两点恰恰是现有 benchmarks 完全忽略的。\n\n与此同时，automated agent design 领域的现有工作（如 meta-agents、workflow optimization）虽然让 AI 系统自动生成 agent 架构，但它们假设任务已被完全 specification 化，且可以随意查询 ground-truth evaluation。这与真实开发流程严重脱节：在现实中，specification 必须先从证据中组装，而 ground truth 是被保留的，开发者必须自己编写 simulations 和 tests 来获取反馈。\n\n将这些线索串联起来，作者自然推导出：如果要让 AI 系统真正胜任构建 agent 的工作，需要一个 benchmark 将 agent construction 本身作为任务，并忠实再现真实委托的全部条件——散落且冲突的业务记录、可被询问的 client、可能存在缺陷的 client REST API、继承的 codebase、以及 serving cost 和 model menu 的限制。评估方式也应反转 τ-bench 的逻辑：不再评估给定 agent 的运行，而是将 developer 构建的 agent 部署到 held-out simulated users 上，以其行为正确性作为 developer 的得分。\n\n### § 4 核心 Intuition\n\n现有 benchmarks 要么评估 agent 的运行表现，要么评估代码生成能力，但都未触及\"在真实约束下从散落证据中恢复需求并交付可部署 agent\"这一完整过程。τ[τ]-bench 的核心 Intuition 是：将 agent construction 本身作为评估对象，通过忠实模拟真实客户委托的全部条件——多模态业务记录、需被询问的 client、有缺陷的 API、继承的 codebase、以及 cost 和 model 约束——迫使 developer agent 展现出 recovering specification、exploring design space、running experiments 和 validating against ground truth 的综合能力。让先前方法失效的根本原因是它们要么假设 specification 已给定，要么假设 ground-truth evaluation 可随意查询，而真实开发中这两者都必须由开发者自行组装和构造。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《$τ^τ$-Bench: An Environment for End-To-End, Realistic Agent Construction》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出的研究问题是：当前的 AI 系统能否在真实的客户参与条件下，端到端地构建一个可部署的 customer-service agent，而不仅仅是作为 agent 执行任务？为了回答这个问题，作者引入了 *τ[τ]*-bench (hyper-tau-bench)，一个将 agent construction 本身作为任务的 benchmark。在这个设定中，一个 developer agent 被赋予企业实际保存的记录、一个持有未记录需求的模拟客户、一个生产环境 REST API、一个需要继承的代码库，以及严格的 serving cost 和 model 限制。developer 必须从这些材料中恢复规范，并交付一个完整的 agent，然后通过将其部署在 held-out 的模拟用户任务上进行评分。 这个问题的重要性在于，LLM agents 正迅速成为生产软件，被广泛部署于客户服务、争议裁决和内部系统操作中。值得注意的是，构建这些 agent 的工作正越来越多地交给 coding agents 完成。然而，构建 agent 本身极其困难且具有经济价值，其挑战沿两个轴线展开：一是恢复规范，知识以企业实际保存的形式存在，如标准操作程序、支持记录和电子表格，且许多关键需求仅存在于人类利益相关者脑海中，需要通过提问才能浮现；二是构建本身，开发者很少从零开始或拥有无限预算，他们必须继承现有代码库，并在成本、延迟和可用模型的硬约束下做出无数设计决策。因此，评估 AI 系统构建 agent 的能力，不仅填补了现有 benchmark 的空白，也直接回应了行业将 agent 开发工作自动化的趋势。 ### § 2 前人工作与不足 这个问题之前并未被完全解决。最相关的前人工作可分为三类，但它们各自存在关键不足。 第一类是 **Coding Benchmarks**，如 SWE-bench (Jimenez et al., 2024) 和 ProgramBench (Yang et al., 2026)。SWE-bench 评估 agent 在现有...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在 LLM agents 逐渐成为生产软件的背景下，构建 agent 的工作正越来越多地被交给 coding agents。然而，现有的 benchmarks 存在一个明显的盲区：它们要么评估一个已经构建好的 agent 在特定 policy 和 tools 下的运行表现（如 τ-bench），要么评估 coding agent 在已有代码库中修复 issue 或从零生成软件的能力（如 SWE-bench、ProgramBench）。这些评估都无法回答一个关键问题：AI 系统能否在真实客户委托的条件下，端到端地交付一个可部署的 agent？ 作者可能从真实的 agent 开发经验中观察到两个核心困难。第一是 recovering the specification：agent 所需的知识并非以整洁的文档形式存在，而是散落在 standard operating procedures、support transcripts、spreadsheets 以及人类 stakeholder 的脑海中，需要通过提问来挖掘。第二是 construction under constraints：开发往往不是从零开始，而是继承一个已有 codebase，并且必须在 cost、latency 和可用 models 的硬约束下完成。这两点恰恰是现有 benchmarks 完全忽略的。 与此同时，automated agent design 领域的现有工作（如 meta-agents、workflow optimization）虽然让 AI 系统自动生成 agent 架构，但它们假设任务已被完全 specification 化，且可以随意查询 ground-truth evaluation。这与真实开发流程严重脱节：在现实中，specification 必须先从证据中组装，而 ground truth 是被保留的，开发者必须自己编写 simulations 和 tests 来获取反馈。 将这些线索串联起来，作者自然推导出：如果要让 AI 系统真正胜任构建 a... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：Preprint ## _τ[τ]_ -BENCH: AN ENVIRONMENT FOR END-TO-END, REALISTIC AGENT CONSTRUCTION ## **Quan Shi, Keshav Dhandhania, Karthik Narasimhan, Victor Barres** Sierra, Princeton University _{_ benshi _}_ @stanford.edu ## ABSTRACT LLM agents are rapidly becoming production software, deployed to handle customer service, adjudicate disputes, and operate internal systems. Notably, the work of building them is increasingly handed to coding agents, yet existing benchmarks say little about whether an AI system can deliver one under the conditions of a real client engagement. We introduce _τ[τ]_ -bench (pronounced _hyper-taubench_ ), a benchmark that makes agent construction the task. A developer agent is given the records a business actually keeps, a client who holds requirements, a production API that operations must run through, a codebase to inherit, and limits on serving cost and models: the s...", "additional_insights": "### § 8 Take-aways\n\n论文提出了 $\\tau\\tau$-bench，一个将 agent construction 本身作为任务的 benchmark，要求 developer agent 从企业实际保存的散乱记录（手册、邮件、截图、录音等）和一个可交互的 simulated client 中恢复 specification，在 cost、latency 和 model 限制下构建完整的 customer-service agent，最终通过 held-out simulated users 评估。实验覆盖 53 个任务横跨 airline、retail、telecom、banking 四个领域，最强的配置 Claude Opus 5 + Claude Code 仅通过 23.9% 的评估，而专家构建的 reference ceiling 达到 82.2%，说明当前 AI 系统能构建可运行的 agent 但远未达到可部署水平。失败模式集中在五个方面：用 keyword grep 替代深度阅读 corpus 导致大量 policy 遗漏；几乎不向 client 提问（仅占 0.3% 的 tool calls），错过仅靠一次提问就能获得的需求；倾向于完全重写 inherited code 而非诊断和复用；对 client API 的 quiet defects（如 pagination cursor 丢失、post-commit timeout）缺乏发现和 mitigation 能力；在 budget 管理上两端失衡——要么超支导致 score 归零，要么大量预算闲置不购买更强 model。开发者构建的 agent 架构高度趋同（92% 为 single LLM tool loop），几乎不探索 design space，而一个简单的 architecture hint（route by intent）就能将 telecom 分数从 31% 提升到 67%。cheating 尝试普遍存在（17–42% 的 run 有 flagged 行为），但因 ground truth 数据未进入 runtime 而全部失败。\n\n### § 9 最脆弱的假设\n\n最关键的假设是：**从企业记录和 client 交互中恢复出的 specification 可以被 ground-truth evaluation 完整验证，即每个 policy fact 都被 planted 在至少一个 artifact 中或由 client 持有，且 corpus 经过 mutual consistency audit。** 这个假设是整个 benchmark 可 grading 的基石——如果它不成立，developer agent 的失败可能不是因为能力不足，而是因为任务本身存在不可恢复的 ambiguity 或矛盾，此时 score 的下降无法归因于 construction 能力的缺陷。在实际场景中，这个假设几乎必然不成立：真实企业的记录存在未文档化的隐性知识、相互矛盾且无人能裁决的 policy 版本、以及随业务变化而漂移的需求，论文自己在 Limitations 中也承认\"noticing that the specification has holes is part of the job we do not measure\"。论文为这个假设提供的证据是 construction 过程的 machine-checkable 设计——每个 fact 的 presence 在其 assigned carrier 中被自动验证，corpus 经三名 human auditor 审查——但这仅保证了 benchmark 内部的 closed-world consistency，并未提供证据表明这种 controlled realism 能泛化到真实 engagement 中 developer 面临的 open-world ambiguity。如果这个假设在实际中不成立，$\\tau\\tau$-bench 测量的就不是\"构建 agent 的能力\"而是\"在完美信息下实现 specification 的能力\"，核心贡献从评估 agent construction 退化为评估 conventional software engineering。\n\n### § 10 最小复现实验\n\n用一周时间，可以验证论文中最具独立性的 claim：**developer agent 用 keyword grep 替代深度阅读 corpus 导致大量 policy 遗漏。** 具体方案：取 $\\tau$-bench 公开的 airline 或 retail domain policy，将其分解为 atomic facts 后用论文的 transformation pipeline 生成一个小型 corpus（约 100-200 个 artifacts，混合 documents、email threads 和 transcripts），然后直接测试一个 frontier model（如 Claude Sonnet 5）在两种条件下的 fact recovery rate：条件 A 允许自由 grep 搜索，条件 B 强制要求逐文件阅读（通过 system prompt 指令和 tool 限制）。测量指标是 recovered facts 占 total facts 的比例，以及 grep 条件下被打开的文件数占 corpus 总文件数的比例。如果 grep 条件下 fact recovery 显著低于 forced-reading 条件（例如差距超过 20 个百分点），且打开文件比例低于 10%，则支持论文的 claim；如果两者 recovery rate 接近，或 grep 条件下模型通过迭代搜索策略达到了高覆盖率，则反驳该 claim。这个实验不需要完整的 $\\tau\\tau$-bench harness、不需要 agent construction 全流程、不需要 simulated user evaluation，只需 corpus 生成和 fact-level 的 recall 测量，但能直接检验论文分析中最核心的失败模式诊断。", "research_value": "### § 11 最强反例设计\n\n如果我要对这篇论文提出最有力的攻击，我会针对其 **closed-world consistency assumption** 设计一个“对抗性 ambiguity”实验，以证明该 benchmark 测量的并非“agent construction 能力”，而是“在完美信息下的信息检索与代码组装能力”。具体而言，$\\tau^\\tau$-bench 假设每个 policy fact 都被明确 planted 在至少一个 artifact 中或由 client 持有，且 corpus 经过 mutual consistency audit。然而，真实企业环境的核心特征不是信息分散，而是信息**矛盾**与**未定义**。我的反例实验会在 corpus 中故意注入相互冲突的 policy 版本（例如，一份旧手册规定退款需 3 天，一封近期内部邮件暗示需 5 天，而 client 对此也含糊其辞），并在 held-out evaluation 中引入一个需要处理这种边界冲突的 user task。在这个设定下，一个遵循真实工程最佳实践的 developer agent 应当识别出这种 ambiguity，向 client 提出澄清请求，或者在代码中实现 graceful degradation 与 fallback 机制。但是，由于 $\\tau^\\tau$-bench 的 ground-truth evaluation 绑定了一个特定的“正确”解释，任何试图协商 specification 或实现防御性编程的 agent 都会因为偏离“标准答案”而被惩罚；相反，那些盲目 grep 到某个 artifact 并机械实现它的 agent 反而可能碰巧得分。这就提出了一个致命的替代解释：当前 Claude Opus 5 仅获得 23.9% 的分数，并非因为模型不擅长构建 agent，而是因为 benchmark 强迫模型去解决一个人为构造的“寻宝游戏”，这种对 specification 的静态固化系统性地惩罚了真实世界中稳健的工程实践，使得该 benchmark 的有效性在面对 open-world ambiguity 时会可预测地崩溃。\n\n### § 12 Follow-up Research Idea\n\n基于上述局限，我提出一个非增量的 novel research idea：将 benchmark 的目标从“一次性交付符合静态 spec 的 agent”转变为“**持续协商与自适应的 agent co-evolution**”。驱动这个想法的局限是，$\\tau^\\tau$-bench 将 specification 视为可被完全恢复的静态实体，而真实开发中 spec 是动态漂移且充满 holes 的，正如论文自己承认的“noticing that the specification has holes is part of the job we do not measure”。为了填补这一空白，我们可以借鉴 **Active Learning** 和 **Cooperative Game Theory** 中的机制设计，构建一个“Specification Negotiation Environment”。在这个环境中，corpus 包含故意留出的 ambiguity 和 logical gaps，simulated client 不再是被动持有答案的响应者，而是具有隐藏 utility function 的博弈方；developer agent 的任务不再是单纯交付代码，而是要在有限的交互预算内，通过提出最小化信息增益的澄清问题来主动**塑造** specification，并交付一个能够处理未定义边缘情况的 robust agent。第一个实验将设计一个两阶段的 evaluation：阶段一中，developer agent 面对充满冲突的 airline refund policy，必须通过多轮对话与 client 协商出一份补全的 spec；阶段二中，held-out users 会故意触发这些原本 ambiguous 的边缘场景。评估指标不再是 task pass rate，而是“client utility satisfaction”与“agent fallback robustness”的帕累托最优。这与已有工作（如 $\\tau^\\tau$-bench 或 meta-agents）的根本区别在于：它不再评估 agent 对完美 spec 的逼近度，而是评估 AI 系统在信息不完备下进行需求工程与防御性架构设计的元能力，从而真正将“cooperative agent building”转化为一个动态的、可测量的研究目标。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Quan Shi\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Keshav Dhandhania\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Karthik Narasimhan\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Victor Barres\", \"affiliations\": [1, 2], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Sierra\"},\n    {\"id\": 2, \"name\": \"Princeton University\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "LLM agents 正在迅速成为生产软件，被部署用于处理客户服务、裁决争议以及操作内部系统。值得注意的是，构建它们的工作正越来越多地交给 coding agents，然而现有的 benchmarks 很少说明 AI 系统能否在真实的客户合作条件下交付一个 agent。我们引入了 $τ^τ$-bench（发音为 hyper-tau-bench），这是一个将 agent 构建作为任务的 benchmark。developer agent 会获得企业实际保存的记录、持有需求的 client、操作必须通过的 production API、要继承的 codebase，以及对 serving cost 和 models 的限制：这与真实合作提供的起点相同。基于这些，它必须交付一个完整的 customer-service agent，其评分方式是将该 agent 部署以应对 held-out simulated users。在跨越四个领域的 53 个任务中，最强的配置，即 Claude Code 下的 Claude Opus 5，仅通过了 23.9% 的 evaluation simulations。同时，由专家编写的 reference ceiling 得分为 82.2%。这些失败反映了人类 agent 开发者所遇到的问题：models 发出浅层查询以代替对记录的深入理解，几乎不与 client 沟通，并且在 agent architecture 和 serving spend 上实验太少，直接交付第一个能运行的设计。我们希望 $τ^τ$-bench 能将 cooperative agent 构建的工作转化为 coding agents 的可衡量目标。"}]}, {"name": "Agent Training \u0026 RL", "count": 3, "papers": [{"title": "SiLR: Structure-Preserving Admission and Process Reward for LLM Tool Agents", "arxiv_id": "2609.04629", "authors": "Chenyu Zhou, Qiliang Jiang, Shuning Wu, Xu Zhou", "summary": "A runtime gate for an LLM tool agent is usually cast as a filter. In a ReAct loop a rejected proposal is followed by another at the same state, so the gate is a search operator over the proposal stream whose admission criterion shapes which trajectories are reachable. We study post-violation recovery admission, where progress must be admitted while the system is still in violation, and identify the scalar projection trap: an aggregate-score gate accepts a locally improving proposal and commits the trajectory to a plateau. SiLR instead shadow-executes each proposal and admits it under a product order over the branch-level violation state (overloaded-branch support and per-branch severity). We prove that no scalar surrogate is sound for this order, so the failure is representational, not a matter of threshold tuning. On mined Gym-ANM scenarios, SiLR recovers 21/21 multi-action episodes against 0/21 for terminal and 9/21 for the best scalar gate, significant across the full 24-scenario benchmark. The terminal-versus-structured dichotomy holds across three model families and in CityLearn. Because admission rests on deterministic simulation, the LLM lies outside the trust boundary: a magnitude-redistribution attack that defeats both scalar and support-only baselines is contained only by the full per-branch predicate. With two constraint families active, every tested scalar projection admits physically unsafe actions; support-only admits the largest fraction (63.2% of 42,410; product order 0). In the hardest dual-family traces, scalar gates recover only through that unsafe class. Reused as a GRPO process reward, it outperforms its count projection in every mined scenario and is the only tested reward whose ungated policy exceeds the untrained base (0.844 vs. 0.778). Scalar projection loses the violation geometry at both design points; only the full product order is structurally sufficient.", "category": "cs.LG", "cluster": "Agent Training \u0026 RL", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 论文的核心贡献是针对 LLM 工具智能体提出了一种新的运行时准入门机制，用于 ReAct 循环中的提案过滤和恢复，并进一步将其用作 GRPO 的过程奖励来训练智能体。这直接符合筛选标准中关于“单智能体（工具使用、规划）”、“Agent Harness/Runtime”以及“Agent Training”的研究焦点。虽然摘要中提到了“unsafe actions”和“attack”，但这些是在物理环境（如电网和城市能耗模拟）中评估智能体行为边界和运行时机制鲁棒性的场景，核心对象仍是智能体能力本身，而非纯粹的 AI 安全或对齐研究。因此，该论文应予保留。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的核心问题是 LLM tool agent 在关键基础设施控制中的 **post-violation recovery admission**（违规后恢复准入）问题。现有的 runtime enforcement systems 通常假设系统初始处于 safe set 内，gate 的作用是作为 filter 阻止不安全动作以维持安全状态。然而，在电力调度等实际场景中，系统可能一开始就处于 constraint violation 状态，需要执行多个动作才能逐步恢复。此时，gate 的职责发生反转：它必须判断一个虽然无法立即消除所有违规、但能向恢复方向取得进展的动作是否应该被准入。该问题在结构上不同于传统的 runtime prevention，且此前的 ru
