。多个轨迹的提名按 patch ID 合并，计算 support count $c_k(a)$，再以 coverage-first round robin 排序（每个失败家族先各贡献一个候选）。输出为有序候选集 $A_k$。\n\n**步骤 4 — WHETHER to persist（训练侧预筛）（§3.3）。** 输入为 $A_k$ 和迭代起始策略 $\\pi_k$。对每个候选 $a$ 构造 $\\pi_k[a] = \\pi_k \\oplus a$，在 $D_{\\text{train}}$ 上计算 one-step training gain $\\Delta_{\\text{train}}(a) = \\bar{V}_R(\\pi_k[a]; D_{\\text{train}}) - \\bar{V}_R(\\pi_k; D_{\\text{train}})$。关键设计：所有候选都在同一个 $\\pi_k$ 上评估，使 one-step gain 可直接比较，不受其他候选交互干扰。保留 $\\Delta_{\\text{train}} \u003E 0$ 的候选并按降序排列，输出 $A_k^+$。此阶段仅决定评估顺序，不决定持久化。\n\n**步骤 5 — WHETHER to persist（Replay 侧 promotion）（§3.3, Algorithm 1 Phase 3）。** 输入为排序后的 $A_k^+$、已接受前缀 $P_k[\u003Cj]$ 和 replay 池 $D_{\\text{replay}}$。对第 $j$ 个候选 $a_j$，在当前已接受前缀 $\\pi_k[\u003Cj] = \\pi_k \\oplus P_k[\u003Cj]$ 上评估，计算 replay delta $\\Delta_R^g(a_j | P_k[\u003Cj])$ 和 $\\Delta_C^g(a_j | P_k[\u003Cj])$。接受条件为 AND 规则：$\\Delta_R^g \\geq \\varepsilon_R = -0.05$ 且 $\\Delta_C^g \\geq \\varepsilon_C = -0.10$。接受则前缀推进 $P_k \\leftarrow P_k \\| (a_j)$，下一个候选在新前缀上评估；拒绝则前缀不变。这一步是论文的核心创新：每个候选在它真正会持久化的 policy state 上被测试，而非在孤立 $\\pi_0$ 上。Replay 池支持 static（仅 $D_{\\text{core}}$）和 adaptive（$D_{\\text{core}} \\cup D_{\\text{hard}} \\cup D_{\\text{recent}}$）两种模式。\n\n**步骤 6 — 策略更新与多迭代（§3.4, Algorithm 2）。** 输入为本轮接受的有序 patch 序列 $P_k$。更新 $\\pi_{k+1} = \\pi_k \\oplus P_k$；若无 patch 被接受则 $P_k = \\emptyset$，patience counter 递增。连续两次无接受则停止外循环。最终输出 $\\pi_{\\text{final}} = \\pi_0 \\oplus P$，其中 $P$ 是所有迭代接受的 patch 按序拼接。所有接受的 patch 形成 auditable、rollbackable 的 checkpoint。\n\n### § 6 核心数学推导\n\n论文不包含传统定理证明，但有一套形式化的优化目标与关键定义，其核心逻辑如下。\n\n**复合 reward（Eqn. 2）。** 每条轨迹 $\\tau$ 获得有界复合 reward $R(\\tau; x) = \\rho(S(\\tau), C(\\tau), E(\\tau), K(\\tau))$，其中 $S$ 为 service validation success（0/1），$C$ 为 workflow correctness（[0,1]），$E$ 为 edit efficiency（[0,1]），$K$ 为 normalized execution cost（[0,1]）。Intuition：executable workflow 的质量是多维的——仅通过 validation 不够，还需结构正确、编辑不越界、执行开销可控。修改任务的具体公式为 $R_{\\text{mod}} = 0.3S + 0.3C + 0.2SC + 0.1E - 0.1K$，其中交互项 $SC$ 奖励同时正确且通过验证的 workflow。\n\n**Prefix-conditioned marginal effect（Eqn. 6）。** 对候选 patch $a$、已接受前缀 $P$、指标 $X$ 和任务池 $D$，定义 $\\Delta_X^{[g]}(a | P; D) = V_X^{[g]}(\\pi_0 \\oplus P \\oplus a; D) - V_X^{[g]}(\\pi_0 \\oplus P; D)$。Intuition：一个 patch 的价值不是绝对的，而是相对于它将被插入的 policy state 的边际效应。同一个 patch 在 $\\pi_0$ 上可能有益，但在已接受若干 patch 后可能有害——这正是论文标题\"global ripples\"的数学表达。\n\n**Persistent-editing objective（Eqn. 7）。** 理想目标是找到有序 patch 序列 $P = (a_1, \\ldots, a_t)$，最大化训练池上的 reward，同时要求每个 patch 在 replay 池上、相对于其前缀 $P[\u003Cj]$ 满足 reward 和 correctness 的 tolerance 约束。Intuition：这是一个带约束的序列优化问题，而非一次性选择问题。穷举搜索所有有序子集的代价过高（每个评估都需要新的 tool-calling rollout），因此 RIPPLE 用贪心顺序评估来近似。\n\n**Acceptance condition（Eqn. 19）。** $\\text{Accept}(a_j | P_k[\u003Cj]) \\iff \\Delta_R^g(a_j | P_k[\u003Cj]) \\geq \\varepsilon_R \\wedge \\Delta_C^g(a_j | P_k[\u003Cj]) \\geq \\varepsilon_C$。Intuition：使用 AND 规则而非 OR，因为 reward 和 correctness 是独立的可容许条件——OR 会允许一个指标任意退化只要另一个通过。阈值设为负值（$-0.05, -0.10$）而非严格改进，因为 replay 效应来自小池上的少量 rollout，允许小幅回归避免因 rollout variation 误拒有用 patch。但这是 marginal 而非 cumulative 控制：每次决策相对于最新前缀，小退化可累积。\n\n### § 7 实验设计与结论\n\n论文围绕四个研究问题（RQ1–RQ4）设计实验，在自建的 Flow-HO benchmark（39 个 held-out workflow modification 任务，4 个 ground-truth family，与训练/replay 完全不相交）上评测。\n\n**RQ1: 跨 backbone 有效性。** 问题：RIPPLE 能否在不同能力水平的 frozen backbone 上提升 held-out workflow 质量？实验在 Claude Haiku 4.5（primary）、Gemma 3-12B（upper-headroom）、Ministral 3-14B（lower-headroom）上比较 base $\\pi_0$ 与 RIPPLE，使用 $N=3$ rollout 和 family-cluster bootstrap。答案：RIPPLE 在三个 backbone 上均提升 service-validation success（Haiku +23.1 pp，Gemma/Ministral 各 +6.8 pp）和 composite reward，workflow correctness 基本持平。增益主要由 validation success 驱动，且在四个 family 中至少三个改善。Transfer backbone 复用 Haiku 的 proposer、patch library 和 gate tolerance 而无 backbone-specific tuning，证明 untuned transfer。\n\n**RQ2: Replay 设计与迭代深度。** 问题：aggregation、replay maintenance、gating 和 iteration depth 如何影响 patch 接受和策略质量？实验在 Haiku 上消融五个变体：RIPPLE-U（uniform + adaptive）、RIPPLE-S（balanced + static）、Coverage-Adaptive（balanced + adaptive）、Train-Only（无 replay gate）、Multi-Iteration（$k\u003E1$）。答案：RIPPLE-U 最优（reward 0.644）；uniform aggregation 和 static replay 均优于 Coverage-Adaptive。Train-Only 达到相似 aggregate performance 但接受了更宽的 patch 集（含被 replay 拒绝的 edit），说明相似 held-out 均值可掩盖实质不同的 persistent policy。Multi-Iteration 增加两个 patch 却低于其单迭代 parent，证明更多 adaptation 非固有更好——persistent performance 取决于哪些 edit 存活、它们的顺序和交互，而非 patch 数量或迭代深度。\n\n**RQ3: 检测破坏性 edit 交互。** 问题：advancing replay baseline 能否检测并拒绝孤立有益但 composition 后有害的 edit？实验隔离 F2a patch（限制 resource lookup 仅用于新引入的 reference），对比其在 $\\pi_0$ 上的 training gain 与在已接受四 patch 前缀上的 replay effect。答案：F2a 在 $\\pi_0$ 上 $\\Delta_{\\text{train}} = +0.0465$（通过预筛），但在前缀 $(F3a, F6c, F6b, F6d)$ 上 replay reward 下降 0.2257、correctness 下降 0.1218、validation success 从 35.4% 降至 0%。机制：F6c 要求所有 referenced resource 解析为具体值，而 F2a 豁免已存在于 corrupted input 中的 identifier，允许 stale value 存活至发布。Advancing-baseline replay 暴露此失败并在持久化前拒绝该 patch，直接验证了\"edit quality is policy-context dependent\"。\n\n**RQ4: Promotion 规则与 checkpoint trade-off。** 问题：更严格的 acceptor 如何影响 policy composition 和质量？实验固定 proposer、候选顺序和 replay evidence，仅替换 acceptor：RIPPLE 的 tolerant two-signal gate vs. SkillOpt-style（严格改进）vs. SkillGen-style（paired count threshold）。答案：RIPPLE 接受 4 个 patch；两种 stricter rule 均只保留 F3a，收敛到同一 one-patch checkpoint（Skill-Compact）。Skill-Compact 在 correctness 上高 5.4 pp、reward 高 0.026，但 success 仅差 1.7%，且这些增益特定于 matched acceptor probe。RIPPLE-U 仍是整体最优配置。Post hoc oracle 显示 per-request 选择可从 0.625 提至 0.665，但 request-only selector 无法恢复该 headroom。结论：promotion 是实质性的 policy-construction 决策——更严格 acceptor 产生更紧凑 checkpoint 并改善某些指标，但重塑而非统一提升策略。", "additional_insights": "### § 8 Take-aways\n本文针对 frozen LLM agents 在 executable workflow synthesis 任务中的 prompt-policy editing 问题，提出了 RIPPLE 框架。其核心 take-away 是：prompt 的局部编辑（local edits）会产生全局的下游影响（global ripples），且不同 edits 在组合（composition）后可能相互干扰甚至反转效果。因此，persistent adaptation 必须解决两个决策：从执行反馈中定位“在哪里”修改，以及“是否”在组合后仍安全地保留该修改。RIPPLE 通过将 prompt 分割为固定 segments，利用 deterministic taxonomy 将失败轨迹映射到对应的 segment 并从 versioned library 中检索 bounded patch，实现了 failure-localized 的编辑。在评估是否保留时，RIPPLE 引入了 advancing-prefix replay 机制：每个候选 patch 都在已接受 patches 组成的当前 policy 基础上进行评估，而非仅在初始 policy 上评估，从而暴露 composition 后的 destructive interactions。实验在 Flow-HO benchmark 上验证，RIPPLE 在 Claude Haiku 4.5 上将 service-validation success 提升了 23.1%，并在 Gemma 和 Ministral 两个 weaker backbones 上实现了 untuned transfer。消融实验表明，replay design 和 promotion rules 实质性地决定了最终 policy 的质量，而非简单的 patch 数量或 iteration 深度。特别是，case study 证实了一个在 isolation 下有益的 patch F2a，在 composition 后变为 destructive，被 replay gate 成功拒绝。\n\n### § 9 最脆弱的假设\nRIPPLE 最关键且失败代价最大的假设是：一个预定义的、固定的六类 failure taxonomy（F1-F6）加上一个 versioned patch library，能够充分覆盖 frozen agent 在 workflow synthesis 中的主要失败模式，并且每个失败都能被 deterministic predicates 准确归因到对应的 policy segment。如果这个假设不成立——例如真实场景中的失败是多因素交织、无法被单一 primary label 捕获，或者所需 corrective instruction 不在预定义 library 中——那么整个 localization-and-retrieval 机制就会退化为无效的 patch 匹配，核心贡献（将 open-ended prompt rewriting 转化为 deterministic, typed update）直接失效。论文为这个假设提供的证据仅限于 Flow-HO 这一个 synthetic benchmark 上的 23 个 preregistered library entries，且 taxonomy 是 top-down 构建的，缺乏在更多样化、真实世界任务上的验证。此外，论文承认 F6 的 subfamilies 是在开发过程中迭代添加的（F6e-F6h 针对后续观察到的失败模式），这暗示初始 taxonomy 并不完备，而在真实部署中，unseen failure modes 的出现频率可能远超 synthetic benchmark 中的情况。\n\n### § 10 最小复现实验\n用 1 周时间，可以最小化复现论文最核心的 claim——即 composition 可以反转局部有益 edit 的效果，且 advancing-prefix replay 能检测并拒绝此类 edit。具体方案：不需要构建完整的 workflow synthesis 系统，而是用一个简化的 text-based task（例如 structured JSON generation with validation）配合一个 frozen open-source model（如 Llama 3.1 8B）。首先设计一个 base prompt policy $\\pi_0$，使其在某个 task pool 上有中等成功率。然后手工设计两个 prompt patches：patch A 单独应用时能提升 reward（例如要求 schema lookup before insertion），patch B 单独应用时也能提升 reward（例如限制 resource lookup 范围），但 A+B 组合后 B 会与 A 产生 conflict 导致 reward 下降（模拟 F2a 与 F6c 的 interaction）。测量三个配置的 reward：$\\pi_0 \\oplus A$、$\\pi_0 \\oplus B$、$\\pi_0 \\oplus A \\oplus B$，以及 $\\pi_0 \\oplus A \\oplus B$ 相对于 $\\pi_0 \\oplus A$ 的 marginal delta。如果 $\\Delta_{\\text{train}}(B) \u003E 0$ 但 $\\Delta_g(B | A) \u003C 0$，则支持论文的核心 claim：isolated gain 不蕴含 compositional safety。进一步，实现一个简单的 two-signal replay gate（reward 和 correctness 的 tolerance thresholds），验证 gate 是否拒绝 patch B。如果 gate 成功拒绝 B 而保留 A，则复现了 RIPPLE 的关键机制。整个实验只需约 50-100 个 task instances、3 次 rollouts per task，计算成本可控。", "research_value": "### § 11 最强反例设计\n\n要对该论文进行最有力的攻击，我会设计一个基于“多因素交织失败与语义漂移”的真实世界场景实验，直接挑战其核心假设：固定的六类 deterministic taxonomy 能够准确将失败归因到单一 primary policy segment。具体而言，我会构建一个 Cross-Factor Failure benchmark，其中的任务失败并非由单一策略缺陷引起，而是由 requirement understanding 的语义模糊触发了错误的 tool use，进而导致 schema validation 失败。在这种场景下，RIPPLE 的 predicate-based 诊断会根据“causally earliest”原则将失败标记为 F1 (Clarification) 或 F3 (Schema)，并从 versioned library 中检索对应的 bounded patch 进行 append。然而，由于根本原因是语义层面的耦合误解，针对 F1 或 F3 的局部文本指令不仅无法修复问题，反而会约束 LLM 的推理空间，导致生成出“syntactically valid but semantically hollow”的 workflow。此时，由于外部 validator 仅检查 schema conformance 和 structural correctness，该错误 patch 可能在 replay gate 中获得正向的 reward 和 correctness delta，从而被错误地持久化。这一反例提供了一个具体的替代解释：RIPPLE 在 Flow-HO 上声称的 23.1% 提升并非真正源于“compositional safety”的保障，而是因为该 synthetic benchmark 的失败模式恰好与其 top-down 构建的 taxonomy 正交——即 benchmark 的局限性人为创造了 taxonomy 充分的假象。一旦面对真实世界中 continuous and entangled 的 failure space，deterministic localization 机制会可预测地退化为 misattribution，而 advancing-prefix replay 不仅无法纠正这一错误，反而会将 semantically harmful 的 edits 通过 gate 固化为不可回滚的 technical debt。\n\n### § 12 Follow-up Research Idea\n\n基于 RIPPLE 在 discrete taxonomy 和 static patch library 上的根本局限，我提出一个全新的研究框架：Causal Prompt Topology Optimization (CPTO)。该想法的驱动需求在于，prompt editing 的“global ripples”本质上是 prompt segments 之间以及 prompt 与 execution environment 之间的复杂因果交互，而 RIPPLE 将其简化为离散的 sequential composition test，无法捕捉连续的、非线性的 policy interactions。为了突破这一局限，CPTO 借鉴了结构因果模型 和 causal tracing 技术，不再预定义失败家族或检索静态 patch，而是将 frozen LLM 的 prompt policy 视为一个连续的因果图拓扑，其中 token spans 作为节点，execution trace 中的 tool calls 和 validations 作为观测变量。在方法上，CPTO 首先通过 counterfactual prompting（对特定 prompt span 进行扰动并观察 execution trace 的分布变化）来推断 prompt 内部的 causal dependency graph，识别出哪些 span 真正 causally drive 了特定的 downstream failure。随后，利用 continuous optimization（如 soft prompt tuning 或 embedding-level interventions，即便在 frozen model 下也可作用于 prefix embeddings）在因果图的高 leverage 点上进行梯度-free 的方向性优化，而非 append 离散文本。第一个实验将聚焦于 SWE-bench 等真实世界 coding agent 任务，首先通过 causal tracing 绘制 base prompt 的干预效应图，随后对比 CPTO 与 RIPPLE 在处理 multi-factor failures 时的表现。实验将重点检验 CPTO 是否能在没有预定义 taxonomy 的情况下，自动发现 RIPPLE 无法定位的 cross-segment causal pathways，并生成连续的 policy adjustments。这一提议与已有工作的根本区别在于：它将 prompt adaptation 从 discrete sequence matching 问题重新定义为 continuous causal graph optimization 问题，从而彻底摆脱了人工 taxonomy 和 bounded library 的表达能力束缚。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Manqing Mao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hong Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Samson Koelle\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jie Yuan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhuoer Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"James Feng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yanjun Lin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Daniel Edmiston\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Nikki Lijing Kuang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhecheng Sheng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Wei Niu\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Amazon, Inc.\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "Prompt-policy editing 提供了一种实用的方法，可以在不更新底层模型的情况下改进合成可执行工作流的智能体。然而，persistent prompt editing 具有两个耦合属性。首先，edit locality 并不意味着 effect locality：局限于单一 policy segment 的修改可能会波及 downstream execution，改变被修改 segment 之外的行为。其次，edit effects 是 composition-sensitive 的：在独立情况下有效的修改在 composition 后可能会相互干扰，导致其中一个或两者失去其益处或变得有害。因此，Persistent adaptation 必须支持两个不同的决策：根据 execution feedback 识别 policy 应该在哪里改变，以及确定产生的修改在 composition 后是否仍然可以安全地持久化。为了应对这些挑战，我们引入了 RIPPLE (Replay-Informed Persistent Policy Localization and Editing)，它将进行修改的位置与 composition 后是否仍然安全分离开来。它诊断 failed trajectories，将每个 actionable failure 映射到 predefined policy segment，并将 correction 限制在 policy 的该部分。随后，RIPPLE 针对相同的 iteration-start policy 评估 candidates 以比较它们的 isolated gains，然后在先前 accepted updates 之后重放有潜力的修改，以揭示 downstream effects 和 interactions。只有在 composition 下仍然安全的修改才会被保留。我们在 Flow-HO 上评估 RIPPLE，这是一个用于 executable workflow synthesis 的 synthetic held-out benchmark。RIPPLE 将 validation success 提高了高达 23.1%，并在另外两个 frozen language-model backbones 上产生了正向收益，同时保持了 edit efficiency 和较低的 execution cost。Targeted interaction analysis 进一步证明了这两个属性：一个 segment-local tool-use 修改改变了 downstream resource resolution 和 validation，而一个在独立情况下有益的修改在 composition 后变得有害。"}, {"title": "Earth-Agent-Pro: Towards Real-World Full-Chain Earth Observation with Agents", "arxiv_id": "2609.12533", "authors": "Zhutao Lv, Chenhao Dang, Yi Feng, Yanpei Gong, Xiaolei Wang, Junyan Ye, Conghui He, Weijia Li", "summary": "Real-world Earth observation (EO) agents must translate high-level scientific questions into executable workflows to acquire observations, prepare data, perform domain computations, and derive conclusions from runtime evidence. Existing EO agents typically start from supplied observations, while benchmarks typically provide prepared inputs or candidate answers, leaving full-chain open-world EO execution largely untested. We present Earth-Agent-Pro, an execution-adaptive Plan-and-Execute framework using expert-authored skills to constrain planning and runtime tool use. Workflow-centered structured memory records planned steps, accepted evidence, and their dependencies, enabling repair of only the affected workflow suffix when runtime evidence invalidates a step. Separate large language model adapters use sequence-level supervised fine-tuning for planner workflow composition and node-level group relative policy optimization with locally verifiable rewards for executor tool-argument grounding. Earth-Bench-Pro instantiates 248 expert-curated task cores as 744 questions under three matched regimes. Its 248 Open-World Execution questions span RGB imagery, spectral observations, and remote sensing products, pairing high-level requests with runtime data requirements, executable trajectories, and open-ended answers grounded in execution evidence. With a shared GPT-5 backbone, Earth-Agent-Pro achieves 66.13% LLM-as-Judge accuracy, exceeding ReAct by 20.95 points in this metric and 24.44 points in Tools-In-Order. Joint adapter tuning raises Qwen3.5-9B LLM-as-Judge accuracy from 38.31% to 50.00%, an 11.69-point gain over the untuned configuration. Planning-only evaluation and execution with the reference workflow show that the adapters improve workflow composition and argument grounding, respectively. Code and datasets will be released soon.", "category": "cs.CL", "cluster": "Workflow Synthesis \u0026 Tool Use", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=16 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一个名为 Earth-Agent-Pro 的执行自适应 Plan-and-Execute 智能体框架。尽管其应用场景是地球观测，但论文的本质是探讨 LLM 智能体的核心机制设计与训练改进，符合“领域是场景，机制才是贡献”的保留原则。\n\n具体而言，论文在以下几个方面高度契合您的研究焦点：\n1. 单智能体能力：论文提出了工作流为中心的结构化记忆，并实现了基于运行时证据的步骤修复机制，这直接对应了智能体的规划、记忆和自我反思能力。\n2. 智能体训练与演化：论文使用了序列级监督微调和节点级群组相对策略优化（GRPO）来分别训练 Planner 和 Executor，属于明确的 Agent Training / RL 范畴，提升了智能体的工具使用和参数对齐能力。\n3. 评估基准：论文构建了 Earth-Bench-Pro，用于评估开放世界中的长周期智能体执行轨迹，这属于对智能体行为和失败机制的评估研究。\n\n因此，该论文深入探讨了智能体的规划、记忆、工具使用及训练方法，完全符合您关于“构建、改进、评估、训练 LLM智能体”的研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是 **open-world EO execution**（开放世界地球观测执行），即给定一个高层科学问题，agent 需要自主完成从问题到答案的完整链条：定位运行时输入、按需获取观测数据、执行数据预处理、进行领域计算，并基于执行过程中产生的证据生成开放式答案。这一问题之所以重要，是因为现实世界的 Earth observation (EO) 分析本质上是高度专家密集的：分析师需要根据目标现象、区域和时段匹配合适的观测数据，选择数据源、产品、波段和采样参数，完成数据获取与预处理，再将其送入领域特定的计算流水线以产出科学量值。这一完整工作流要求同时具备传感器、数据产品、geospatial processing 和领域科学的专业知识，构成了非 EO 社区用户的极高准入门槛，也限制了可复现分析的普及。论文指出，尽管近年的研究已将 EO 能力从单纯解读给定图像扩展到多步分析执行，但现有 agents 通常从预先提供的观测数据出发，现有 benchmarks 则提供准备好的输入或候选答案，导致从用户请求到证据支撑的科学答案这一完整链条从未被系统性地测试和评估。解决这一问题不仅能推动 EO agent 从受控实验环境走向真实世界应用，还能为非专家用户提供可复现的自动化 EO 分析能力。\n\n### § 2 前人工作与不足\n\n该问题此前未被完整解决，现有研究在评测和方法两个层面均存在关键缺口。在评测层面，作者此前的 Earth-Bench 虽然提供了 248 个科学任务核心和轨迹级评估基础，但其从专家准备的本地输入和 multiple-choice questions 出发，将 runtime data discovery 和 open-ended answer generation 排除在评估边界之外。其他 EO agent benchmarks 也各自只覆盖部分链条：OpenEarth-Bench 和 KnowFlow-Bench 包含数据获取或预处理但省略开放式答案评估；OpenEarthAgent、TerraBench 和 EO-Gym 评估开放式答案和工具轨迹但对获取、预处理或定量分析的覆盖不完整；GeoPlan-Bench 隔离了工作流规划但无可执行参考轨迹或运行时获取。这些评测缺口的根本原因在于，此前的 benchmark 设计假设输入数据已由专家准备完毕，而真实 EO 分析中文件、中间产物和工具结果仅在执行过程中才出现，后续操作依赖于上游已接受的证据——这一依赖链在固定输入设定下无法被触发和检验。\n\n在方法层面，MLLM-based EO methods（如 GeoChat、LHRS-Bot、EarthGPT、EarthMarker 等）加强了对给定图像或产品的视觉理解和问答能力，但通常不具备发现外部数据、协调工具使用或在长周期 EO 分析中维护证据的能力。Agent-based EO methods 则存在更具体的结构性不足：早期系统如 RS-ChatGPT、RS-Agent 和 Change-Agent 将 LLM 与视觉模型或专家工具连接以完成感知任务，后续系统如 UnivEarth、ThinkGeo、Earth-Agent、CangLing-KnowFlow 和 HTAM 组织了更广泛的工作流，但它们普遍在广泛或预定义的工具空间上进行规划，缺乏用专家任务技能同时约束工作流构建和运行时工具范围的机制。更关键的是，现有系统将 planning 和 execution 作为统一策略进行优化，没有分离工作流组合与节点级参数 grounding 的预测接口，导致工作流错误与参数错误在长工具链中混合传播，credit assignment 困难。此外，这些系统很少显式维护已接受的证据及其依赖关系作为执行状态演变的一部分，当运行时证据使某一步骤失效时，无法精确定位并修复受影响的工作流后缀，而只能丢弃已有进展重新规划。通用 agent 范式如 ReAct 的 reasoning-action 交错、Voyager 的可复用技能、AFlow 的工作流优化虽提供了规划与工具使用的基础范式，但均未针对 EO 领域的完整链条进行角色特定的对齐训练。因此，工作流组合和节点级参数 grounding 的 role-specific alignment 在此前研究中基本未被探索，这正是论文通过 Planner SFT 和 Executor GRPO 的分离训练所要解决的核心方法缺口。", "core_insight": "### § 3 重建作者的思考路径\n\nEO 分析的本质是一条从科学问题到定量证据的完整链条：分析师需要匹配现象、区域和时期到合适的观测数据，选择数据源、产品、波段和采样参数，获取并预处理数据，然后送入领域特定的计算 pipeline。这个过程要求传感器、数据产品、地理空间处理和领域科学的多重专业知识。一个认真研究这个问题的人会首先注意到，现有工作在这条链条上各自只覆盖了一片段：MLLM-based 方法（如 GeoChat、EarthGPT）能理解已提供的图像或产品，但不发现外部数据、不协调工具使用、不在长周期分析中维护证据；Agent-based 方法（如 ReAct、AFlow、OpenEarthAgent）虽然能选择操作和执行代码，但在广泛或预定义的工具空间上规划，将规划和执行作为统一策略优化，很少用专家任务知识约束工作流构建和运行时工具范围，更少显式维护已接受的证据和依赖关系。与此同时，Benchmark 层面（如 RSVQA、Earth-Bench、GeoPlan-Bench）大多从专家准备的本地输入和多项选择题出发，评估固定输入上的感知能力或孤立的工作流规划，将 runtime data discovery、中间证据链和开放式答案生成排除在评估边界之外。\n\n由此可以识别出一个未被测试的空白地带：open-world EO execution——agent 从一个指定现象、区域和时期的请求出发，必须在运行时定位输入、按需获取观测数据、执行预处理和领域计算，并从执行证据中推导开放式答案。这个设置的核心困难在于执行是动态且依赖驱动的：文件、中间工件和工具结果只在执行期间出现，后续操作依赖上游已接受的证据；当某个步骤被运行时证据证伪时，agent 需要修改后续计划但不能丢弃已验证的执行进度。先前工作中，Voyager 的可重用 skills、ReAct 的推理-行动交替、AFlow 的工作流优化都提供了部分线索，但没有任何一个方法同时解决工具空间约束、证据依赖追踪和局部失败修复这三个问题。作者之前自己的 Earth-Agent 和 Earth-Bench 提供了任务和评估基础，但 Earth-Bench 仍从专家准备的输入和多项选择题开始，留下了 runtime data discovery 和开放式答案生成在评估之外。\n\n从这些观察出发，自然的推演路径是：首先，需要用专家领域知识将庞大的工具空间约束为任务相关的子集，避免 agent 在 112 个工具中盲目搜索；其次，需要将工作流规划与运行时参数 grounding 解耦为两个独立角色，因为单一轨迹目标会将工作流错误与参数错误混合并在长工具链上分散信用分配；第三，需要一种结构化内存将动态工作流与已验证证据及其依赖关系耦合，使后续操作只暴露已接受的上游结果而非整个交互历史；第四，当执行失败时，需要保留成功前缀并仅修复受影响的后缀，而非推翻整个计划；最后，需要一个新的 benchmark 来评估这条完整链条，将科学目标固定而在三种机制下逐步移除参考工作流和准备输入，使评估能够精确测量从指令跟随到自主规划再到开放世界执行的难度梯度。\n\n### § 4 核心 Intuition\n\n先前方法在开放世界 EO 执行中失效，根本原因在于它们在无约束的工具空间中进行规划，且将规划与执行混为一谈，导致工作流错误与参数错误相互污染、错误沿长工具链传播且难以局部纠正。Earth-Agent-Pro 的核心 Intuition 是：用专家 skills 将工具空间约束为任务相关的子集并贯穿规划与执行两阶段，将工作流组合与运行时参数 grounding 解耦为两个独立预测接口分别训练和优化，同时通过以工作流为中心的结构化内存将动态工作流与已验证证据及其依赖关系显式耦合，使得执行失败时只需局部修复受影响的工作流后缀而保留成功前缀——从而将一个高维度的端到端执行问题分解为有约束的规划、有证据基础的局部 grounding 和有边界的修复三个可管理的子问题。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\nEO Task (q, c_req)\n  │\n  ▼\nSkill Router ──► Tool Router ──► Planner ──► W₀, M₀\n(select s)      (T∩A_s→P_s)    (4-role      (init state)\n                                 debate)\n                                               │\n                    ┌──────────────────────────┘\n                    ▼\n           Executor (per node v_i)\n           G_exec → E → V_hyb ─┬─► Accept → M_k.append\n                               ├─► Retry (re-args)\n                               └─► Replace (re-tool)\n                    │ ◄────────────┘\n                    ▼\n              Next node ──(fail)──► Repair: keep prefix,\n                                     revise suffix ──► re-exec\n                    │\n                    ▼\n           Answer Controller ──► Final Answer\n           (evidence check)      (from M_k only)\n\n══ Training: Planner SFT (seq) + Executor GRPO (node) ══\n```\n\n**推理阶段——Skill-Guided Workflow Planning（§IV-B）。** 输入为开放世界 EO 任务的科学查询 $q$ 和运行时数据需求 $c_{req}$。Skill Router 根据查询和上下文从六种专家 skill（spectral analysis、thermal retrieval、product statistics、time-series、RGB perception 等）中选出一种 $s$，每种 skill 定义了允许的工具范围 $A_s$、操作顺序、参数约束和重复规则。Tool Router 随后将全局 112 个工具的目录 $T$ 与 $A_s$ 取交集，得到候选工具集 $P_s$，从而在规划前就排除不相关工具。Planner 在 $P_s$ 上通过四角色 sequential debate（EO procedure specialist → tool schema specialist → benchmark minimalist → skeptical moderator）生成有序工具序列 $\\pi^{plan}$，catalog validator 校验工具存在性和 skill 归属，不通过则反馈重试。输出为初始动态工作流 $W_0$ 和空记忆 $M_0$ 构成的初始状态 $S_0$（正文 Eq. 5）。\n\n**推理阶段——Evidence-Grounded Execution（§IV-D）。** Executor 逐节点推进工作流。对当前节点 $v_i$，argument generator $G_{exec}$ 结合工具 schema、当前节点、active skill 和已接受的 upstream evidence 生成参数，送入执行环境 $E$ 获得观测。Hybrid verification gate $V_{hyb}$ 先执行确定性检查（结构错误、错误标记、batch 覆盖），无法判定的 case 交由 LLM checker 依据 active skill 评估。判定结果有三种：Accept 将结果提交到 $M_k$ 并推进到下一节点；Retry 在当前节点重新生成参数；Replace 从 $P_s$ 中换一个工具。三种操作均局限于当前 attempt，不改变持久状态 $S_k$（正文 Eq. 7-8）。\n\n**推理阶段——Workflow Repair（§IV-D）。** 当某节点所有 in-node attempt 均失败后，Executor 将失败诊断写入该节点并触发局部修复：Planner 从失败节点出发生成候选替换 suffix $V_i$，Executor 校验候选操作不重复早期修复、有执行进展、长度正常后，将成功 prefix 与新 suffix 拼接，旧 suffix 及诊断存入 revision archive $R_k$。修复不改变 $M_k$，仅重新执行失败位置及其后续操作（正文 Eq. 9）。Answer Controller 复用同一修复机制：当所有工具成功但 evidence 仍不完整时（缺少必要计算、时空覆盖不足、单位/数值 scale 错误等），生成可操作诊断并重新打开指定节点；evidence 充足时仅从 $M_k$ 生成最终答案。\n\n**推理阶段——Workflow-Centered Structured Memory（§IV-C）。** 运行时状态 $S_k = (W_k, M_k)$ 贯穿全程。$W_k$ 包含活跃节点序列 $V_k$ 和 revision archive $R_k$；$M_k$ 是按时间排序的 evidence record 集合，每条记录存储已调用工具、参数、观测和 provenance（变量、时间、区域、波段、batch）。该结构使后续操作仅暴露已验证结果，避免从不断膨胀的自由文本交互记录中恢复有效 evidence、失败尝试和待执行操作。\n\n**训练阶段——Dependency-Preserving Data Construction（§V-B）。** 从 248 条 seed workflow 出发，将每条分解为不可变 execution skeleton $\\kappa(z)$（保留工具序列、schema、依赖结构 $G_z$）和可变 instance state $\\mathbf{u}(z)$（位置、时间范围、文件引用等）。LLM 识别可替换 slot 并生成样本级 instantiation program $F_z$，在固定 skeleton 下沿依赖传播替换值，生成保持依赖一致性的新实例。人工审核 slot 规格和程序后批量合成，得到 2,480 条 trajectory，再与 OpenEarthAgent 训练集混合平衡。\n\n**训练阶段——Planner SFT（§V-C）。** 输入为 query、input context、skill guidance 和候选工具 schema 组成的单轮对话；目标序列为 reference tool sequence $\\pi^\\star$ 的 JSON 序列化（仅含 tool_sequence 字段，无参数和观测）。冻结 backbone，仅更新 Planner-specific LoRA，对 prompt token 做 mask，损失 $L_{plan}$ 仅监督 assistant response 的自回归 NLL。\n\n**训练阶段——Executor GRPO（§V-D）。** 输入为当前节点 context 和 prescribed tool 的 schema；策略 $p_{\\psi_E}$ 生成参数字典 $\\hat{\\theta}_i$。Reward 直接将解析后的参数字典与 reference $\\theta_i^\\star$ 比较，无需 learned reward model：包含 key coverage（公共 key 比例）、symmetric-difference penalty（缺失 key 惩罚大于多余 key）、value agreement（递归比较嵌套值及类型，浮点容差 $10^{-6}$）。每组采样 $G=4$ 个候选，组内标准化 reward 得到 relative advantage $\\hat{A}_{i,j}$。总目标结合 GRPO surrogate term、KL 正则和 entropy bonus，冻结 backbone 仅更新 Executor-specific LoRA（正文 Eq. 10）。\n\n**评测阶段。** Earth-Bench-Pro 的三种 regime 逐步移除脚手架：Earth-Bench-IF 提供有序参考工具序列和预处理输入；Earth-Bench-AP 隐藏工具序列但保留预处理输入；Earth-Bench-OW 要求 agent 自行获取/发现数据并生成开放式答案。评测指标包括 LLM-as-Judge accuracy、ROUGE-L、EM（答案质量）以及 Efficiency、TAO、TIO、TEM、Parameter Accuracy（轨迹保真度）。\n\n---\n\n### § 6 核心数学推导\n\n论文的核心形式化围绕 open-world EO execution 的定义和 role-specialized training 的目标函数展开。\n\n**Open-world execution 的形式化（Eq. 3）。** 给定查询 $q$ 和运行时需求 $c_{req}$，第 $i$ 步的工具选择由 policy $f$ 决定，参数生成由 $g$ 决定，最终答案由 evidence-conditioned function $h$ 生成：\n\n$$t_i, \\theta_i = f(g(q, c_{req}, \\text{trace}_{\u003Ci}))$$\n\n其中 $\\text{trace}_{\u003Ci}$ 包含此前所有已接受的工具调用和观测。Intuition：每一步的决策不仅依赖原始请求，还依赖执行过程中累积的 evidence——后续操作必须 ground 在已验证的 upstream 结果上，而非预先准备的静态输入。这与传统 benchmark 中\"输入固定、答案从候选中选择\"的模式根本不同。\n\n**Skill/Tool routing（Eq. 5）。** 候选工具集通过两级路由缩减：\n\n$$P_s = R_{skill}(q, c, s) \\cap R_{tool}(q, c, T \\cap A_s)$$\n\nIntuition：先由 skill 限定领域程序允许的工具子集 $A_s$，再由 tool router 根据任务目标进一步检索，将 112 个工具缩减到 20-30 个。这使 Planner 在一个科学有效且接口兼容的搜索空间上组合 workflow，避免在无约束的工具空间中产生 ambiguous workflow。\n\n**Hybrid verification gate（Eq. 7）。** 对节点 $v_i$ 的第 $a$ 次 attempt，gate 产生决策 $\\delta_{i,a}^{(k)}$ 和反馈 $b_{i,a}^{(k)}$：\n\n$$\\delta, b = V_{hyb}(o_{i,a}, \\text{query}, \\text{args}, \\text{skill}, \\text{workflow})$$\n\nIntuition：先用确定性规则捕获结构错误（error marker、batch 覆盖等），这些规则可快速且无歧义地判定；仅对规则无法判定的 case 才调用 LLM checker，降低验证成本和不确定性。\n\n**Workflow repair（Eq. 9）。** 失败节点 $i$ 后，Planner 生成候选 suffix $\\tilde{V}_i$，Executor 校验后拼接：\n\n$$W_{k+1} = \\text{prefix}(W_k, i) \\oplus \\tilde{V}_i, \\quad R_{k+1} = R_k \\cup \\{( \\text{old suffix}, d_i^{(k)} )\\}$$\n\nIntuition：保留已验证的 successful prefix 避免丢弃有效执行进展，仅替换受影响的 suffix。$M_k$ 不变，因此已接受的 evidence 不会被失败污染。这实现了 bounded adaptation——修复范围被限制在失败点之后，而非从头重新规划。\n\n**Training objective（Eq. 10）。** 总损失结合 Planner SFT 和 Executor GRPO：\n\n$$L_{total} = L_{plan}(x^{(P)}, \\omega^{(P)}) + L_{GRPO}(x^{(E)}, \\omega^{(E)})$$\n\n其中 Planner SFT 是对 reference tool sequence 的自回归 NLL；Executor GRPO 的 surrogate term 为：\n\n$$\\mathbb{E}[\\hat{A}_{i,j} \\cdot \\min(\\rho_{i,j,\\ell}, \\bar{\\rho}_{i,j,\\ell})] - \\beta \\cdot D_{KL}(p_{\\psi_E} \\| p_{ref}) + \\eta \\cdot H(p_{\\psi_E})$$\n\nIntuition：Planner 在 sequence level 学习\"选哪些工具、按什么顺序\"，Executor 在 node level 学习\"给定工具，如何填参数\"。将两个角色的训练信号隔离在各自的 prediction interface 上，避免 monolithic trajectory objective 将 workflow error 和 argument error 混在一起并在长工具链上扩散 credit。GRPO 的组内标准化 advantage 无需单独 critic，KL 正则防止偏离 reference model 过远，entropy bonus 防止过早坍缩。\n\n**Executor reward（Eq. 11）。** 对候选 $j$ 在节点 $i$ 的参数字典，reward 综合三项：\n\n$$r_{i,j} = \\alpha \\cdot \\frac{|K_c|}{m} - \\beta' \\cdot \\frac{|K_d|}{m} + \\gamma \\cdot A_{val}$$\n\n其中 $K_c = K^\\star \\cap \\hat{K}$（公共 key），$K_d = K^\\star \\triangle \\hat{K}$（差异 key），$m = |K^\\star|$。缺失 key 的惩罚大于多余 key，因为缺失既降低 coverage 又增加 symmetric difference。Intuition：在工具身份已由 workflow 固定的前提下，reward 只需评估参数结构和值的正确性，使反馈信号精准对应 argument grounding 这一单一决策界面。\n\n---\n\n### § 7 实验设计与结论\n\n**问题 1：LLM backbone 选择和 role-specialized training 如何影响 Earth-Agent-Pro 的表现？** 作者在 Earth-Bench-Pro 上用 13 个 open-weight 和 3 个 closed-weight backbone 统一评测，并与 fine-tuned Qwen3.5-4B/9B 对比（Table II）。结果显示 GPT-5 在 LLM-as-Judge 上最高（66.13%），但 fine-tuned 9B 在 TAO、TIO、TEM、Parameter Accuracy 上最强，说明答案质量与 workflow fidelity 并不必然同步提升。Role-specialized training 对小模型有一致增益：9B 的 Judge accuracy 从 38.31% 升至 50.00%，4B 的 Judge accuracy 提升 10.89 点，TEM 提升 10.97 点。\n\n**问题 2：Earth-Agent-Pro 与 remote-sensing MLLM 在定量推理上的差距如何？** 作者在 TerraScope 的五个任务类别上以开放式问答（非多选）评测六种 RS MLLM 和 Earth-Agent-Pro（Table III）。RS MLLM 在 boundary detection 和 comparative ranking 上尚可，但在 coverage estimation、area measurement、distance measurement 上急剧下降，distance accuracy 几乎全为零。Earth-Agent-Pro 以 50.58% 平均 accuracy 领先最强 baseline TerraScope 7.98 点，在 area measurement 上优势最显著（31.58% vs. 至多 4.65%）。\n\n**问题 3：Earth-Agent-Pro 的框架优势能否跨 benchmark 迁移？** 作者在 OpenEarthAgent benchmark 上用共享 GPT-5 backbone 对比 ReAct、AFlow、OpenEarthAgent 和 Earth-Agent-Pro（Table IV）。Earth-Agent-Pro 在 Perception、GIS 和全部三个 tool-order 指标上最强，answering accuracy 超过最强 GPT-5 baseline 11.16 点。Fine-tuned 9B 在 GIS 和 AnyOrder 上领先，4B 在 SameOrder 和 Unique 上最佳，表明 role-specialized training 使小模型也能学到可迁移的 workflow pattern。\n\n**问题 4：与通用 agent 相比，领域专用 workflow 是否带来准确率和延迟的双重优势？** 作者在 Spectrum、Products、RGB 三类任务上对比 Codex 和 Manus（Table V）。Earth-Agent-Pro (GPT-5) 以 75.00% 平均 accuracy 超过 Codex 28.33 点，同时将平均延迟从 268.73s 降至 208.64s，在 RGB 任务上完成全部样本。准确率和延迟同时改善，说明任务完成质量的提升不必以更高执行成本为代价。\n\n**问题 5：在严格控制 backbone 的条件下，Earth-Agent-Pro 框架本身的贡献有多大？** 作者在 Earth-Bench-Pro 上用同一 GPT-5 backbone 对比 ReAct、AFlow、OpenEarthAgent（Table VI）。Earth-Agent-Pro 在八项指标中七项领先，LLM-as-Judge 超过最强 baseline 20.95 点，TAO 从 70.47% 升至 87.61%，TIO、TEM、Parameter Accuracy 同步提升，表明改进不仅在于选出合理工具集，更在于保留更多 expert workflow 结构。\n\n**问题 6：Domain skills 对框架的贡献是否独立于 role-specialized training？** 作者在 ReAct 和 Earth-Agent-Pro（base 9B 和 fine-tuned 9B）上分别做 with/without skill 消融（Table VII）。Skills 对轨迹保真度提升最大：base Earth-Agent-Pro 的 TIO 从 61.94% 升至 74.57%，TEM 从 51.71% 升至 67.29%。对 fine-tuned 模型，skills 仍将 Judge accuracy 提升 12.90 点，说明 training 强化的是 learned policy，skills 提供的是 explicit domain procedure 约束，两者在不同层面互补，training 未使 external skill guidance 冗余。\n\n**问题 7：Planner SFT 和 Executor GRPO 各自的贡献能否被分离测量？** 作者设计了三组隔离实验。Adapter composition（Table VIII）显示 Planner tuning 主要提升 workflow 指标，Executor tuning 主要提升答案质量和参数 grounding，两者组合在所有指标上最强。Planning-only evaluation（Table IX）禁用执行，仅评估 Planner 输出的工具序列：tuned Planner 的 TAO 达 92.51%、TIO 达 83.35%、TEM 达 76.14%，分别超过 base Planner 5.81、11.48、9.18 点，超过 GPT-5 3.65、6.97、6.11 点，隔离了 workflow composition 的改进。Oracle-plan execution（Table X）固定参考工具序列、禁用工具替换和 suffix replanning，仅保留 runtime argument grounding：tuned Executor 的 Judge accuracy 从 46.37% 升至 52.82%，Parameter Accuracy 从 34.19% 升至 37.20%，隔离了 argument grounding 的改进。三组实验共同确认两个 adapter 在各自 prediction interface 上提供互补增益。", "additional_insights": "### § 8 Take-aways\n本文提出了Earth-Bench-Pro，一个包含744个问题的全链路Earth observation (EO) agent benchmark，要求agent在open-world环境中自主完成数据获取、预处理、领域计算并生成基于证据的开放式答案。针对此挑战，作者提出了Earth-Agent-Pro框架，通过expert-authored skills约束workflow planning与runtime tool use，并利用workflow-centered structured memory记录步骤、证据及其依赖关系，在运行时证据失效时仅修复受影响的workflow suffix。在训练层面，框架采用role-specific training：Planner使用sequence-level supervised finetuning (SFT)优化workflow composition，Executor使用node-level group relative policy optimization (GRPO)结合locally verifiable rewards优化tool-argument grounding。实验表明，在共享GPT-5 backbone下，Earth-Agent-Pro在Earth-Bench-OW上达到66.13%的LLM-as-Judge accuracy，较ReAct提升20.95个百分点；联合微调Planner和Executor adapters使Qwen3.5-9B的准确率从38.31%提升至50.00%。\n\n### § 9 最脆弱的假设\n本文最核心且失败代价最大的假设是：**由专家预先定义的6种domain skills能够有效约束并覆盖open-world EO execution中的各种任务需求，且这种静态约束不会损害agent在开放世界中的泛化能力。** \n在实际应用中，open-world execution本质上具有高度不可预测性，真实世界的遥感分析可能涉及skill未覆盖的边缘场景、新型数据源或非标准的处理流程。如果任务需求偏离了这6种预定义skill的scope，Skill Router和Tool Router将无法提供有效的约束，导致agent要么无法处理该任务，要么因工具空间受限而产生错误的workflow。论文虽然通过消融实验（Table VII）证明了在当前benchmark内加入skills能显著提升各项指标，且定性案例（Figure 7 Task 3）也承认skill guidance无法完全消除语义层面的tool-selection errors，但缺乏在分布外（OOD）任务或全新EO场景下skills泛化能力的评估。如果该假设不成立，整个框架的约束机制将失效，Earth-Agent-Pro将退化为无约束的planning，其相对于ReAct等baseline的核心优势将不复存在。\n\n### § 10 最小复现实验\n在1周时间内，可以设计一个最小复现实验来验证**Executor GRPO能够提升runtime argument grounding**这一claim，而无需复现完整的Plan-and-Execute框架。\n**数据**：使用Earth-Bench-Pro中的248个Open-World Execution workflows，提取其中的node-level argument records作为训练和评估数据。\n**实现内容**：仅实现Executor的node-level接口。给定一个workflow node及其上下文（包括prescribed tool schema和accepted upstream evidence），使用Qwen3.5-9B作为backbone，训练一个Executor-specific LoRA adapter。训练采用GRPO算法，reward函数基于预测argument dictionary与reference argument dictionary的key coverage、symmetric-difference penalty和value agreement（如论文Eq. 12所定义）。评估时采用oracle-plan execution设置，即固定workflow结构，仅评估argument grounding。\n**测量指标**：在测试集上，比较base Executor和tuned Executor的Parameter Accuracy和LLM-as-Judge accuracy。\n**判定标准**：如果tuned Executor的Parameter Accuracy显著高于base Executor（论文中从34.19%提升至37.20%），且LLM-as-Judge accuracy有所提升（从46.37%到52.82%），则支持该claim；反之则反驳。此实验避开了复杂的动态workflow repair和环境交互，聚焦于模型参数微调的直接效果，适合在有限时间内完成。", "research_value": "### § 11 最强反例设计\n\n如果我要对这篇论文发起最有力的攻击，我会从其**评测集的生态效度**与**单 skill 路由机制的结构性局限**两个维度构造反例，揭示其所谓的“open-world”能力可能只是在同构模板上的过拟合。首先，Earth-Bench-Pro 的 248 个 Open-World Execution questions 是通过 Dependency-Preserving Data Construction 从 248 条 seed workflow 合成的，即在固定的 execution skeleton $\\kappa(z)$ 上替换 instance state $\\mathbf{u}(z)$。这意味着测试集与训练集的 tool sequence 拓扑高度同构。如果我在测试集中引入需要**跨 skill 动态组合**的复合任务（例如：“分析某海域过去十年海表温度异常对周边植被覆盖率的时空滞后影响”），该任务需要先执行 thermal retrieval，再基于其输出空间执行 time-series 分析，最后衔接 spectral analysis。由于框架的 Skill Router 被强制设计为单选路由（$R_{skill}$ 输出单一 skill $s$），Tool Router 随后将工具空间限制为 $T \\cap A_s$，系统将无法在运行时跨越 skill 边界获取所需工具。在这种条件下，Earth-Agent-Pro 要么因工具缺失而触发无意义的 Workflow Repair，要么退化为次优的局部规划，其准确率将出现断崖式下跌。这一反例直接挑战了论文的核心假设：静态的 6 种 skills 无法覆盖真实 EO 分析中司空见惯的多源因果链条，且其高分表现很大程度上依赖于评测集中任务结构的单一性，而非真正的 open-world 泛化能力。\n\n### § 12 Follow-up Research Idea\n\n基于上述局限，我提出一个非增量的研究方向：**Causal Workflow Induction for Open-Ended Skill Evolution**，将 agent 的目标从“在预定义 skill 约束下执行”转变为“从执行反馈中自主发现并形式化新的 skill 因果图”。驱动此想法的局限是：静态预定义 skills 不可避免地成为 open-world 探索的天花板，且 Planner 与 Executor 的分离训练割裂了 workflow composition 与 argument grounding 之间隐含的因果依赖（例如，某个参数的特定取值实际上决定了下一步唯一可行的工具路径）。为了解决这一问题，我们可以借鉴 Causal Discovery 领域的 intervention 机制以及 Hierarchical Reinforcement Learning (HRL) 中的 option discovery 算法。具体而言，不再预定义 $A_s$，而是让 agent 在无约束的工具空间中自由探索，系统通过 counterfactual intervention（干预某一节点的参数或替换工具）观察对下游 evidence 的因果效应，从而自动从成功轨迹中归纳出具有高因果依赖的子图，并将其抽象为新的、层次化的 domain skills。\n\n这一提议与现有工作（如 Voyager 的 skill library 或 AFlow 的工作流优化）存在本质区别：Voyager 依赖代码执行的二值成功信号来积累技能，而本提议引入了结构因果模型（SCM）来量化工具节点间的因果流向，使得 skill 的边界由数据流和物理逻辑决定，而非人为划定或简单的频率统计。第一个实验将设计一个“Zero-skill Open-World Sandbox”：在 Earth-Bench-OW 的基础上，移除所有 6 种预定义 skill 的约束，仅提供 112 个原子工具。对比基线为无约束的 ReAct 和使用静态 skills 的 Earth-Agent-Pro。评估指标不仅包括最终的 LLM-as-Judge accuracy，还引入“Skill Emergence Fidelity”——即 agent 自主归纳出的因果 skill 子图与专家定义的 ground-truth workflow 模式的图编辑距离。如果新框架能在保持答案准确率的同时，自主涌现出跨越原有 6 种 skill 边界的复合 workflow 模式，并在 OOD 复合任务上显著超越静态约束框架，即可证明因果驱动的 skill evolution 是突破 open-world EO 瓶颈的真正路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zhutao Lv\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Chenhao Dang\", \"affiliations\": [3, 4], \"markers\": [\"*\"]},\n    {\"name\": \"Yi Feng\", \"affiliations\": [5], \"markers\": [\"*\"]},\n    {\"name\": \"Yanpei Gong\", \"affiliations\": [6], \"markers\": [\"*\"]},\n    {\"name\": \"Xiaolei Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Junyan Ye\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Conghui He\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Weijia Li\", \"affiliations\": [1, 4], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Tsinghua Shenzhen International Graduate School, Tsinghua University\"},\n    {\"id\": 2, \"name\": \"Sun Yat-Sen University\"},\n    {\"id\": 3, \"name\": \"Shanghai Jiao Tong University\"},\n    {\"id\": 4, \"name\": \"Shanghai Artificial Intelligence Laboratory\"},\n    {\"id\": 5, \"name\": \"Tianjin University\"},\n    {\"id\": 6, \"name\": \"Harbin Institute of Technology\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "现实世界的 Earth observation (EO) agents 必须将高层科学问题转化为可执行的工作流，以获取观测数据、准备数据、执行领域计算，并从运行时证据中得出结论。现有的 EO agents 通常从提供的观测数据开始，而 benchmarks 通常提供准备好的输入或候选答案，使得全链条开放世界 EO 执行在很大程度上未被测试。我们提出了 Earth-Agent-Pro，这是一个执行自适应的 Plan-and-Execute 框架，使用专家编写的技能来约束规划和运行时工具使用。以工作流为中心的结构化记忆记录了规划的步骤、接受的证据及其依赖关系，当运行时证据使某一步骤无效时，能够仅修复受影响的工作流后缀。独立的大型语言模型适配器使用 sequence-level supervised fine-tuning 进行 planner workflow composition，并使用 node-level group relative policy optimization 结合 locally verifiable rewards 进行 executor tool-argument grounding。Earth-Bench-Pro 将 248 个专家策划的任务核心实例化为三种匹配机制下的 744 个问题。其 248 个 Open-World Execution 问题涵盖 RGB 图像、光谱观测和遥感产品，将高层请求与运行时数据需求、可执行轨迹以及基于执行证据的开放式答案配对。在共享 GPT-5 backbone 的情况下，Earth-Agent-Pro 达到了 66.13% 的 LLM-as-Judge 准确率，在该指标上超过 ReAct 20.95 个百分点，并在 Tools-In-Order 上超过 24.44 个百分点。联合适配器调优将 Qwen3.5-9B 的 LLM-as-Judge 准确率从 38.31% 提升至 50.00%，比未调优配置提高了 11.69 个百分点。仅规划评估和使用参考工作流的执行表明，适配器分别改进了 workflow composition 和 argument grounding。代码和数据集即将发布。"}, {"title": "Is Bash All You Need? An Empirical Study of Tool Interfaces for Enterprise Digital Worker Agents", "arxiv_id": "2609.11999", "authors": "Hazel Mak, Susheel Suresh, Sahil Bhatnagar, Barry Wang, Chhaya Methani, Alejandro Gutierrez Munoz", "summary": "In this study, we examine whether a general shell can outperform specialized tools on enterprise tasks. Shell-based agents have shown strong results in coding, but enterprise work also involves moving between applications and services, coordinating with coworkers, and performing professional analysis. We compare five tool interfaces on TheAgentCompany and APEX-Agents using Opus-4.8 and GPT-5.5: typed tools, typed tools plus bash, bash alone, bash with persistent agent-synthesized tools, and programmatic tool calling (PTC), which runs programs whose actions are restricted to a typed tool catalog. Bash alone outperforms typed tools on both benchmarks, improving score by 21.8-24.5 pp on TheAgentCompany and 4.8-7.4 pp on APEX-Agents while using 19-72% fewer total tokens. Adding typed tools or persistent tool synthesis to bash produces no detectable pooled score gain. PTC uses fewer tokens than direct typed calls with broadly similar task performance, but generally underperforms bash alone in both quality and cost efficiency. For enterprise practitioners, these results favor bash alone when arbitrary execution can be isolated and PTC when security or compliance policies require a fixed tool catalog.", "category": "cs.CL", "cluster": "Workflow Synthesis \u0026 Tool Use", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是对 LLM 智能体在不同工具接口下的表现进行实证研究，比较了 typed tools、bash、bash with persistent agent-synthesized tools 等多种工具使用方式。这直接属于“单智能体”研究范畴中的“工具使用”方向。根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents / Multi-Agent LLMs，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。” 该研究通过评估不同工具接口对智能体性能和成本的影响，为理解和改进智能体的工具使用能力提供了重要经验依据。此外，论文中提到的“bash with persistent agent-synthesized tools”也涉及智能体在运行时动态合成工具的机制，与智能体能力构建密切相关。因此，该论文完全符合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n企业智能体究竟需要一套预先定义好的专用工具，还是一个 Bash 命令行就够了？专用工具规定了能做什么、参数如何填写；Bash 则让智能体自己写命令、组合操作。选择哪种接口，会影响任务完成质量、模型调用成本和权限管理。\n\n### § 2 前人工作与不足\n\n已有编程智能体表明，仅靠命令行也能完成复杂操作，但企业任务还需要跨应用协作和专业文档分析，编程场景的结果未必适用。另一类方法让模型写程序来组合调用专用工具，减少逐次调用的开销；它是否比直接使用 Bash 更合适，同样缺少企业场景中的对照证据。本文用相同模型和任务比较这些接口，补上这项评测。", "core_insight": "### § 3 如何理解研究思路\n\n可以把作者的研究思路理解为：先把“工具越丰富越好”当作待验证的问题，再逐步比较只给专用工具、只给 Bash，以及两者组合的效果。随后加入“把经验保存成脚本”和“用程序批量调用工具”，检验复用和编排是否带来额外收益。这是对研究设计的解释，不代表作者真实的思考过程。\n\n### § 4 核心直觉\n\n接口的关键可能是能否方便地组合操作，而非提供多少工具。Bash 允许模型在一次执行中处理多个步骤，只返回有用结果，因此可能减少反复调用和中间信息传递。这能解释实验趋势，但实验尚未单独证明它就是性能差异的原因。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n相同任务、模型与基础提示\n  |\n  v\n分别配置五种接口\n  ├─ 专用工具\n  ├─ 专用工具 + Bash\n  ├─ 仅 Bash\n  ├─ Bash + 可复用脚本\n  └─ 程序化工具调用（PTC）\n  |\n  v\n在两个企业任务基准中执行\n  |\n  v\n比较任务得分、token 用量与推理成本\n```\n\n本文是一项对照研究，没有提出新的训练算法。作者保持模型、任务、基础提示和停止条件一致，只改变工具接口，并为脚本复用和 PTC 添加对应提示（§ 3）。五种接口分别是：\n\n- **专用工具**：模型调用预先定义好参数和功能的工具。\n- **专用工具 + Bash**：模型可以选工具，也可以写命令。\n- **仅 Bash**：所有操作都通过命令行完成。\n- **Bash + 可复用脚本**：提供跨任务保留的目录，鼓励模型把步骤存成脚本，供后续任务调用。\n- **程序化工具调用（PTC）**：模型写 Python 程序来组合调用专用工具；运行环境不提供命令行或其他操作渠道。\n\n两种模型是 Opus-4.8 和 GPT-5.5。TheAgentCompany 的 174 个任务模拟公司协作，按任务检查点评分；APEX-Agents 的 480 个任务覆盖投行、咨询和公司法，由模型按评分标准评审（§ 4）。token 是模型处理文本的计量单位，本文同时记录其用量和推理成本。\n\n### § 7 实验设计与结论\n\n1. **Bash 是否更有效？** 与仅用专用工具相比，Bash 在两个基准上的得分分别提高 21.8–24.5 和 4.8–7.4 个百分点，总 token 用量减少 19–72%。\n2. **增加工具是否更好？** 给 Bash 再加专用工具或可复用脚本，合并分析未发现可检测的得分提升，且通常增加 token 用量。\n3. **PTC 是否值得用？** 相比直接调用专用工具，它更省 token，任务表现大体相近；相比 Bash，质量和成本效率通常较弱。\n\n开发时曾发现智能体读取评分答案等取巧行为。作者在正式报告的 TheAgentCompany 实验中封锁相关仓库访问，并加密模拟同事信息（附录 B.1）；不能把已发现的取巧行为直接当作最终高分的解释。", "additional_insights": "### § 8 阅读收获\n\n这篇论文给出了选择工具接口的实证依据：在能隔离代码执行的环境中，Bash 值得作为对照方案；若操作必须限定在批准的工具清单内，PTC 提供了另一种选择。是否采用，仍需用自己的任务验证。\n\n### § 9 结论的关键边界\n\n比较结果依赖专用工具如何设计。若工具过于零碎，模型就要花更多调用来组合操作。论文没有穷尽工具设计，因此结果适用于所测接口，不能推出 Bash 必然优于所有经过优化的企业工具。\n\n### § 10 最小验证实验（设想）\n\n在资源允许时，先选取一小组 TheAgentCompany 任务，保留原环境和评分器，固定模型与预算，比较专用工具和 Bash。逐任务记录得分与 token 用量，并重复运行检查波动。这只能初步检查结果趋势；若改用模拟环境或其他模型，应标为迁移验证，不能称为原实验的直接复现。", "research_value": "### § 11 可检验的反例（设想）\n\n可以给专用工具组增加常用的组合操作，例如一次完成数据读取、整理和导出，同时让 Bash 组保有相同的数据访问权限。固定任务、模型和预算，观察两组差距是否缩小。若缩小，说明工具粒度可能解释部分优势；若没有缩小，则削弱这一解释。结果出来前，不能预言哪组胜出。\n\n### § 12 后续研究设想\n\n值得进一步检验的是：能否按操作权限选择接口，而不必为整个任务固定一种接口？例如在沙盒内用 Bash 处理文件，涉及外部写入时只允许调用批准的工具。先在明确标注权限边界的任务上，与固定使用 Bash 或 PTC 的方案比较完成质量、成本和越权次数。关键难点是可靠识别并阻止越权操作，这仍需实现和验证。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Hazel Mak\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Susheel Suresh\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Sahil Bhatnagar\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Barry Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Chhaya Methani\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Alejandro Gutierrez Munoz\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Microsoft Corporation\"},\n    {\"id\": 2, \"name\": \"Carnegie Mellon University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "本文研究：在企业工作任务中，通用命令行工具能否胜过专用工具？命令行智能体在编程任务上已有良好表现，但企业工作还涉及跨应用操作、同事协作和专业分析。作者使用 Opus-4.8 和 GPT-5.5，在 TheAgentCompany 和 APEX-Agents 两个评测基准上比较了五种工具接口：专用工具、专用工具加 Bash、仅用 Bash、Bash 加可跨任务复用的自建工具，以及程序化工具调用（PTC，即通过程序组合调用预先批准的工具）。仅用 Bash 在两个基准上都优于专用工具，得分分别提高 21.8–24.5 和 4.8–7.4 个百分点，总 token 用量减少 19–72%。向 Bash 添加专用工具或可复用的自建工具，在合并分析中没有带来可检测的得分提升。PTC 比直接调用专用工具更省 token，任务表现大体相近，但质量和成本效率通常不及仅用 Bash。作者据此建议：如果能够隔离任意代码执行，可优先考虑 Bash；如果安全或合规政策要求操作限定在固定工具清单内，则可考虑 PTC。"}]}], "2026-09-11": [{"name": "Long-Horizon Agents \u0026 Memory", "count": 4, "papers": [{"title": "Mr.LHDR: A Benchmark for Multimodal Real-World Long-Horizon Deep Research Agents", "arxiv_id": "2609.11318", "authors": "Minghao Guo, Meng Cao, Sui Zhao, Siyu Ning, Xin Wang, Haoze Zhao, Jiaxuan Yang, Haihong Hao, Mingfei Han, Shunlin Rong, Haijun Wu, Xiaodan Liang, Xiaojun Chang", "summary": "Deep research agents are increasingly capable of web search, tool use, multimodal evidence analysis, and information synthesis. However, existing benchmarks mainly evaluate medium-horizon exploration and rarely test whether agents can sustain long, dependency-heavy research processes. We introduce Mr.LHDR (Multimodal real-world Long-Horizon Deep Research), a benchmark for evaluating real-world deep research over long, irreducible chains of interdependent evidence across eight categories. Each question is constructed from a hidden Node-Relation graph and requires an average of 12.1 necessary intermediate conclusions with a mean dependency depth of 10.4 before reaching a short, unique, and verifiable answer. Questions incorporate multimodal evidence, including images, maps, PDFs, logos, charts, tables, and video frames, with at least one non-text element that changes the reasoning state. Mr.LHDR evaluates both final answers and the correctness of intermediate conclusions under annotated dependencies. We evaluate general models, deep research systems, and agent frameworks using Overall Accuracy (OA), Strict Accuracy (SA), Checklist Score (CS), and Dependency-Aware Checklist Score (DACS). Results show that even the strongest system achieves only 43.1% OA and 34.3% SA, indicating that final-answer accuracy substantially overestimates complete research success. Removing images reduces DACS by 12.6 points, demonstrating the importance of multimodal evidence, while SA consistently declines as reasoning chains become longer. These findings reveal sustained, dependency-consistent evidence integration, rather than isolated fact retrieval, as a key bottleneck for current deep research agents.", "category": "cs.AI", "cluster": "Long-Horizon Agents \u0026 Memory", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了一个名为 Mr.LHDR 的基准测试，用于评估多模态真实世界长周期深度研究智能体。根据筛选标准第一步中的“保留”规则，如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents，即使它主要是评估基准或失败机制诊断，只要结论直接帮助理解或改进智能体能力，就应保留。该论文评估了现有智能体框架在长依赖链、多模态证据整合方面的表现，并诊断出“持续的、依赖一致的证据整合”是当前深度研究智能体的关键瓶颈。这直接属于对智能体长周期行为和失败机制的分析，有助于后续改进智能体的规划与工具使用能力。\n\n虽然论文涉及多模态证据（图像、地图、PDF等），但多模态在这里是作为智能体感知和处理的输入信息，而非研究多模态模型本身的核心架构，符合“除非它们被用作智能体感知环境的工具，而不是研究的核心”的例外条件。此外，摘要中提到的“Node-Relation graph”仅是构造问题和评估依赖深度的机制，并非研究图结构技术本身。因此，该论文符合您的核心研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：当前 deep research agents 能否在长链条、跨模态、多源依赖的真实世界研究任务中，持续维持 dependency-consistent 的证据整合，而非仅完成孤立的事实检索。具体而言，当一个任务要求 agent 分解目标、在网页/PDF/图像/地图/视频等异构来源间定位证据、跨模态桥接信息、保留中间结论并反复验证约束时，现有系统是否能在每一步都正确建立后续推理所依赖的前提条件。这一问题之所以重要，是因为 deep research agents 正被期望承担真实的研究助理角色——不仅要返回最终答案，还要保证推理过程的可审计性。论文指出，真实世界研究的难度不仅来自个别事实的隐蔽性，更来自早期错误会 redirect 整条调查链的结构性风险。然而现有 benchmark 要么以文本为中心（如 BrowseComp），要么虽引入多模态但仅覆盖 short- to medium-horizon 任务（如 MM-BrowseComp 平均仅 3.0 个 checklist items），长链条依赖证据步骤基本未被测试。解决这一问题能带来三方面价值：一是揭示 final-answer accuracy 对完整任务执行能力的系统性高估，二是通过 multimodal evidence ablation 量化非文本证据对推理链的物质性贡献，三是为未来系统指明 research-state tracking、source/modality binding 和 chain-level verification 为关键改进方向。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决。最相关的 prior work 可分为三类。第一类是 open-web browsing benchmark：BrowseComp (Wei et al., 2025) 强调开放网络上难以定位的短答案，但完全以文本为中心，不涉及多模态证据；MM-BrowseComp (Li et al., 2025d) 在此基础上增加了多模态浏览证据并提供 verified checklist，但其任务结构集中于 short- to medium-horizon 研究，平均每题仅 3.0 个 checklist items，无法测试长链条依赖推理。第二类是结构化搜索 benchmark：MMSearch-Plus (Tao et al., 2026) 关注 provenance-aware browsing 但不提供 gold intermediate structure；BrowseComp-V3 (Zhang et al., 2026) 引入 expert-validated subgoals 和 subgoal-coverage process score，但仍采用无序覆盖评分，不进行 prerequisite gating；MC-Search (Ning et al., 2026) 提供了 step-wise multimodal reasoning graph 和 process metrics，但其评测基于 fixed local knowledge base 而非开放网络，且同样不做 prerequisite-gated scoring。第三类是 report-oriented benchmark（如 Huang et al., 2026; Ye et al., 2026），它们评估长篇报告质量，属于不同的 output regime，不要求 concise verifiable answer 与 dependency-aware 中间结论评估。这些工作存在不足的根本原因在于评测范式的结构性缺陷：它们要么仅以 final-answer correctness 作为评分依据（如 DeepSearchQA, Gupta et al., 2026），要么使用无序 checklist/subgoal coverage（如 MM-BrowseComp、BrowseComp-V3），将中间结论视为独立可互换的局部事实。这种评分方式在 long-horizon 场景下失效，因为下游结论的成立以先前实体、约束和消歧关系的建立为前提——当 prerequisite 缺失时，一个碰巧匹配 checklist item 的下游陈述可能只是 unsupported guess 或 search shortcut，而非有效推理路径的延续。此外，现有 benchmark 普遍未将 multimodal evidence 作为改变 reasoning state 的必要环节进行硬性约束，多模态证据往往沦为装饰性输入而非推理链的承重节点。Mr.LHDR 通过引入 author-verified dependency DAG 和递归式 DACS 评分，直接填补了这一评测缺口：它不仅要求每个 question 至少包含一条改变推理状态的非文本证据，还在评分时递归地以下游结论的所有 transitive prerequisites 是否满足为授分条件，从而区分 final-answer correctness、complete stated-conclusion correctness 和 dependency-consistent coverage。", "core_insight": "### § 3 重建作者的思考路径\n\n作者很可能从对现有 deep research agent benchmark 的系统性不满出发。BrowseComp 证明了 open-web 短答案检索的可贵，但本质上仍是 text-centered 的单跳或浅多跳任务；MM-BrowseComp 虽引入 multimodal browsing，但平均每题仅 3.0 个 checklist items，属于 medium-horizon 范畴。与此同时，真实世界的研究任务——比如从一张产品图片出发，追溯其处理器设计团队、芯片供应商、材料来源、关联机构、再到某段视频中的某个视觉细节——天然具有长链条、跨模态、强依赖的特征：一个早期实体识别错误就会使整条证据链偏移。作者观察到，现有 benchmark 既没有构造这种 prerequisite-linked 的深层依赖结构，也没有在评估层面区分\"碰巧得到正确答案\"与\"沿正确依赖路径得到正确答案\"。\n\n进一步，作者注意到评估指标本身的缺陷。仅用 final-answer accuracy（OA）会高估系统能力，因为 agent 可能通过猜测、shortcut 或 parametric knowledge 猜中答案而跳过关键推理步骤；而 unordered checklist score（CS）虽然能测量覆盖率，却把所有中间结论视为独立可互换，忽略了下游结论的成立以上游先决条件为前提。这意味着一个\"破碎的依赖图\"上散落的局部正确匹配会被错误地计为过程可靠。作者需要一个递归的、dependency-aware 的评分机制，使得下游结论的得分以其所有传递性先决条件的正确性为条件。\n\n在数据构造层面，作者面临的核心挑战是如何确保任务的 long-horizon 难度来自依赖结构本身而非 prompt 冗长或 trivia 冷僻。由此自然推导出 Node-Relation graph 的设计：先构建一个由可验证实体属性节点和唯一收敛关系组成的隐藏图，再从中生成自然语言问题，确保中间节点和搜索路径被遮蔽。多模态证据被设为硬性纳入条件——每个问题至少有一个非文本证据节点改变推理状态——因为作者从 multimodal understanding 文献和真实研究经验中知道，图片、地图、PDF、logo、图表等视觉证据常常承担实体识别、候选约束或跨模态桥接的关键角色，而非装饰。\n\n最后，作者需要验证这套 benchmark 是否真的能区分系统能力层次。从 25 个系统的实验结果中，OA-SA 的系统性差距、CS-DACS 的依赖惩罚、image ablation 中 DACS 下降 12.6 个百分点、以及 SA 随 checklist 长度单调递减——这些结果共同确认了一个判断：sustained, dependency-consistent evidence integration 才是当前 deep research agent 的核心瓶颈，而非孤立事实检索或单步浏览能力。\n\n### § 4 核心 Intuition\n\n当前 deep research agent 的真正瓶颈不在于能否找到个别事实或给出正确最终答案，而在于能否在一条长且紧密耦合的跨模态证据链中持续维持依赖一致的推理状态——即每一步中间结论都建立在其所有先决条件已被正确确立的基础之上。Mr.LHDR 的核心 intuition 是：通过构造基于 prerequisite-linked DAG 的 long-horizon 任务，并用 DACS 这种递归依赖感知指标替代无序 checklist 评估，可以精确暴露\"正确答案伴随破碎推理链\"这一被 final-answer accuracy 系统性掩盖的失败模式。多模态证据之所以不可或缺，是因为它在推理链中承担的是改变推理状态的桥接功能——识别实体、约束候选、连接异构信息源——而非提供冗余线索。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Human] Category/Tags/Style\n    │ AI expand\n    ▼\n┌───────────┐  ┌──────────────┐\n│ Task Spec │─▶│Node-Relation │\n└───────────┘  │Graph(5-6节点)│\n               └──────┬───────┘\n      AI expand       │\n      ┌───────────────┘\n      ▼\n┌──────────────┐  ┌──────────────┐\n│Human Prune   │◀─│Over-complete │\n│+Blur Rewrite │  │Checklist     │\n│+Question Draft│ └──────────────┘\n└──────┬───────┘\n       │ 4-phase audit\n       ▼\n┌──────────┐  Uniqueness/Leakage/MM/Shortcut\n│Quality   │────────────▶[Reject/Revise]─┐\n│Gates     │                              │\n└────┬─────┘                              │\n     │ pass                               │\n     ▼                                    │\n┌──────────┐                              │\n│102 Locked│◀─────────────────────────────┘\n│Items     │\n└────┬─────┘\n     │\n     ▼\n┌──────────┐  ┌────────┐  ┌────────────┐\n│25 Systems│─▶│LLM Judge│─▶│OA/SA/CS/DACS│\n│Eval      │  │Qwen3-VL │  │(DAG递归)   │\n└──────────┘  └────────┘  └────────────┘\n```\n\n**Pipeline 步骤说明：**\n\n1. **Task Specification**：人工标注者首先指定目标 category（如 media、geography 等）、operation tags（Constraint、Symbolic、Temporal、Numerical）和 golden-example style，作为后续 AI 扩展的约束边界（§3.2.2）。\n\n2. **Node-Relation Graph 生成**：AI 在约束下提出包含 5–6 个信息丰富节点的 Node-Relation 图。每个节点配对一个核心实体及其可搜索、可验证的属性（如照片、地图位置、PDF、logo、chart 等）。关系将一个节点的已验证属性转化为下一个节点的入口条件，要求自然且唯一收敛——移除任何关键关系都应破坏推理链而非仅缩短它（§3.2.1, §A.4）。\n\n3. **Over-complete Checklist 扩展**：AI 将图扩展为 25–28 步的过度完整候选 checklist，以暴露缺失证据、弱依赖、重复事实和潜在捷径。此阶段还执行 Blur Attribute-Rich Path 策略：将高信息属性粗粒度化（如将精确年份 1978 改写为\"the late 1970s\"），同时保持推理路径的唯一收敛性（§A.4）。\n\n4. **Human Prune + Question Drafting**：人工标注者修剪候选链，移除背景事实、合并冗余结论，仅保留推导最终答案所必需的中间结论（平均保留 12.1 步，不到 AI 提案的一半）。随后起草自然语言问题，进行泄漏控制——移除中间节点提示、直接答案线索和暴露搜索路径的措辞（§3.2.2, §A.4）。\n\n5. **Quality Gates（4-phase validation）**：通过四阶段验证协议执行七个质量门控——Answer uniqueness（答案短、稳定、唯一）、No path leakage（问题不暴露中间路径）、Irreducible checklist（每步为必要中间结论而非浏览动作）、Source support（每个关键声明有可检查的 URL）、Multimodal necessity（非文本证据必须改变 reasoning state）、Shortcut filtering（web-enabled 模型无法通过单次直接查询解决）、Metadata audit。Phase 3 中，标注者将最终问题原样提交给 web-enabled 模型，若单次响应恢复答案或可复现的直接搜索路径，则该项目被重写或拒绝。未通过的项目退回修改或拒绝，通过的项目被锁定（§3.2.3, Table 2）。\n\n6. **Locked Items**：最终锁定 102 个评测项目，包含 1,231 个 checklist 步骤，平均 dependency depth 10.4，覆盖 8 个 category 和 Linear/Multi-branch 两种 authored template（§3.3）。\n\n7. **Model Evaluation**：25 个系统分为 4 组评测——Tool-augmented VLMs（11 个，接收图像+web search）、Tool-free VLMs（7 个，仅接收图像）、Deep Research Systems（4 个，使用专用 research endpoint）、Framework-based agents（3 个，通过 DeerFlow 运行）。每次评测为单次请求，所有工具使用或多步行为在 provider 服务或框架内部完成（§4.1.2）。\n\n8. **LLM Judge**：使用 Qwen3-VL-235B 作为 judge 模型，接收 user question、reference answer、reference checklist 和 model response，输出两个机器可读字段：`OVERALL_CORRECTNESS`（final-answer 二元决策）和 `CHECKLIST_RESULT`（checklist 完成向量）。答案归一化允许大小写、标点、别名等无害差异；checklist 项仅在响应完整陈述对应结论并与正确实体和约束关联时才计分（§4.1.4, §D.2, Figure 10）。\n\n9. **Metrics Computation**：从 judge 输出和冻结的 dependency DAG 确定性地计算四个指标。OA 衡量 final-answer 正确率；SA 要求 final answer 和所有 annotated checklist 结论同时正确；CS 衡量 checklist 平均覆盖率但不考虑依赖；DACS 递归地将每个结论的得分条件化于其所有 transitive prerequisites 是否满足——独立分支保留各自得分，但若任何必需的前置条件缺失，则下游结论不得分（§4.1.3）。\n\n### § 6 核心数学推导\n\n论文定义了四个评测指标，核心数学推导集中在 DACS 的递归定义上。\n\n**基础变量**：对于固定评测集的 $n=102$ 个 item，$y_i \\in \\{0,1\\}$ 表示 judge 对 item $i$ final-answer 正确性的二元决策；$G_i=(V_i, E_i)$ 为 item $i$ 的已验证 checklist dependency DAG，含 $m_i=|V_i|$ 个节点；$a_{ij} \\in \\{0,1\\}$ 表示响应是否正确陈述了 item $i$ 的第 $j$ 个 checklist 结论。\n\n**OA（Eq.1）**：$OA = \\frac{1}{n}\\sum_{i=1}^{n} y_i$，即 final-answer 正确率的简单平均。Intuition：最宽松的指标，只看最终答案对不对。\n\n**SA（Eq.2）**：$SA = \\frac{1}{n}\\sum_{i=1}^{n} y_i \\cdot \\prod_{j=1}^{m_i} a_{ij}$。Intuition：要求 final answer 正确**且**所有 checklist 结论同时正确——乘积项意味着任何一个中间结论缺失都会使该项归零。这是最严格的指标。\n\n**CS（Eq.3）**：$CS = \\frac{1}{n}\\sum_{i=1}^{n} \\frac{1}{m_i}\\sum_{j=1}^{m_i} a_{ij}$。Intuition：衡量 checklist 的平均覆盖率，但不考虑结论之间的依赖关系——即使前置条件缺失，下游结论仍可独立得分。因此 CS 可能高估过程可靠性，因为它在断裂的 dependency graph 上聚合局部匹配。\n\n**DACS（Eq.4–5）**：设 $D_{ij} \\subseteq V_i$ 为节点 $j$ 的直接前置条件集合，递归定义 dependency-grounded credit：\n\n$$s_{ij} = a_{ij} \\cdot \\prod_{k \\in D_{ij}} s_{ik}$$\n\n$$DACS = \\frac{1}{n}\\sum_{i=1}^{n} \\frac{1}{m_i}\\sum_{j=1}^{m_i} s_{ij}$$\n\n其中空积等于 1。Intuition：节点 $j$ 获得得分当且仅当（1）节点本身的结论被正确陈述（$a_{ij}=1$），**且**（2）其所有直接前置条件的 transitive credit 都为 1。这个递归结构使得：如果某个上游结论缺失，则所有依赖它的下游结论的 credit 都被级联扣减。但独立分支各自保留得分——只有 merge node 需要所有分支依赖同时满足。DACS 因此区分了\"孤立地陈述了某个下游事实\"与\"在依赖一致的前提下陈述了该事实\"。\n\n### § 7 实验设计与结论\n\n**问题 1：当前 deep research 系统在 long-horizon multimodal deep research 上表现如何？**\n\n实验：在 102 个 Mr.LHDR items 上评测 25 个系统，涵盖 tool-augmented VLMs、tool-free VLMs、deep research systems 和 framework-based agents，使用 OA/SA/CS/DACS 四个指标。答案：系统远未饱和。最强的 regular model GPT-5.5 仅达 43.1% OA 和 34.3% SA；最强的 dedicated deep research system o3 Deep Research 仅达 32.4% OA 和 19.6% SA；framework-based agent DeerFlow (qwen3-vl-235b) 仅达 15.7% OA 和 9.8% SA。由于仅 102 个 item，多数相邻系统的置信区间重叠，无法形成统计可分离的排名。\n\n**问题 2：Final-answer accuracy 是否能代表完整的任务执行？**\n\n实验：分解 OA 为 SA 和 OA−SA gap，并比较 CS 与 DACS。答案：不能。OA 系统性地高于 SA（如 o4-mini 的 gap 达 14.7 points），表明正确的最终答案常伴随缺失的必需中间结论。CS 也系统性地高于 DACS（如 Llama 4 Maverick 的 CS 46.7% vs DACS 37.8%），揭示了许多下游陈述的前置条件在响应中缺失。Final-answer accuracy 实质性地高估了完整的、依赖一致的任务成功。\n\n**问题 3：非文本视觉证据是否对推理链有实质性贡献？**\n\n实验：Controlled ablation——同一开源 VLM（Qwen3-VL-235B）对全部 102 个 item 分别在有图和无图条件下作答，问题、参考答案、checklist 和 judge 保持固定。使用 10000 次 bootstrap 估计置信区间，并用 12 个来自 6 个 model family 的 judge 进行 cross-judge 验证。答案：视觉证据对 evidence-chain recovery 有实质性贡献。提供图像使 DACS 从 21.6% 升至 34.2%（gain 12.6, 95% CI [6.9, 18.9]），CS 从 26.9% 升至 39.3%（gain 12.4）。在所有 12 个 judge 下，OA、CS 和 DACS 的增益均为正，且自评 judge 报告的 DACS gain（12.6）低于 cross-family 中位数（15.0），排除了 self-preference 偏差。图像对 process metrics 的影响大于对 final-answer accuracy 的影响，说明视觉证据帮助模型陈述更多依赖约束的链条，而不仅仅是得到答案。\n\n**问题 4：更长的 evidence chain 是否增加 strict-completion 压力？**\n\n实验：将 102 个 item 按 checklist 长度分为五个区间（10、11–12、13–15、16–18、19+），对三个代表性模型（GPT-5.5、Gemini 3 Flash、o3 Deep Research）报告各区间 DACS 和 SA。答案：在观测充足的三个区间（$n \\geq 20$）中，SA 随 checklist 长度单调递减——每个代表性模型都表现出这一模式。DACS 趋势不如 SA 一致，但三个模型均在 13–15 区间达到最低 DACS。这表明随着必需结论数量增加，模型越来越难以满足整个 checklist，即使它们保留了部分的、依赖一致的覆盖。最后两个区间（6 和 4 个 item）因样本量过小被排除在主要解释之外。\n\n**问题 5：失败的模式和位置特征是什么？**\n\n实验：对 25 个系统的 30,775 个 checklist-step 决策中 17,409 个失败步骤分配 MM-BrowseComp taxonomy 的诊断标签，并按 dependency depth 将节点分为前、中、后三段分析失败率。答案：失败集中在模型用先验知识覆盖任务证据或推理不充分支撑结论的情况。Tool-augmented VLMs 和 Deep Research Systems 的主要失败模式是 Knowledge override（38.6% 和 43.5%），而 framework-based agents 呈现更广泛的失败混合，包括 39.9% 的 tool-execution failure。失败率随 dependency depth 单调上升——从前段的 48.8% 到中段的 55.3% 再到末段的 69.3%，且该模式在四个系统组内均成立，表明越深的 prerequisite 结构中不支持的结论越普遍。", "additional_insights": "### § 8 Take-aways\n论文提出了 Mr.LHDR，一个用于评估多模态真实世界长程深度研究 agent 的 benchmark，其核心特征是平均包含 12.1 个必要中间结论和 10.4 的依赖深度，远超现有 medium-horizon 基准如 MM-BrowseComp。每个问题基于隐藏的 Node-Relation graph 构建，强制要求 agent 在跨模态（图像、PDF、视频等）的多源证据链中维持和验证 evolving research state。评估体系引入了 Dependency-Aware Checklist Score (DACS)，通过递归检查前提条件是否满足，来区分孤立的结论匹配与真正的依赖一致推理。对 25 个系统的评估显示，表现最好的 GPT-5.5 也仅达到 43.1% 的 OA 和 34.3% 的 SA，证明当前系统在长程依赖一致性上远未饱和。实验揭示了显著的 OA-SA gap，表明最终答案的正确性往往高估了完整的任务执行能力，模型常在给出正确答案的同时遗漏必要的中间结论。消融实验证实了多模态的必要性，移除图像使 DACS 下降 12.6 个百分点。随着证据链长度增加，所有代表性模型的 SA 均单调下降，证实了长证据链对严格完成的压力。\n\n### § 9 最脆弱的假设\n该论文最脆弱且失败代价最大的假设是：**模型在 response 中 stated 的中间结论确实反映了其真实的、基于检索的推理过程，而不是基于参数知识或猜测的“事后合理化”**。DACS 指标的设计初衷是衡量 agent 是否在依赖一致的证据链上得出了结论，但它仅仅检查提交文本中是否包含了符合 checklist 及其依赖关系的陈述。如果这个假设不成立，DACS 的高分可能只意味着模型擅长生成符合预期的叙述性文本，而非真正执行了长程深度研究。在实际中，大语言模型经常出现“知识覆盖”或“幻觉”，它们可能直接利用预训练知识生成看似正确的中间结论，绕过了真实的 web 检索或前序依赖步骤。论文自身也承认了这一局限：“these metrics neither observe the agent’s internal reasoning nor establish that a stated conclusion came from actual retrieval”。论文提供的证据仅限于 LLM Judge 的文本匹配一致性测试，缺少将 stated conclusions 与实际 tool-use traces 或 retrieved sources 进行绑定的验证，这使得整个 benchmark 的核心评估目标存在被“文本生成能力”而非“研究能力”污染的风险。\n\n### § 10 最小复现实验\n在一周时间内，可以最小化复现论文中关于 **“最终答案正确性高估完整任务执行能力”（即 OA-SA gap 显著）** 的 claim。从 Mr.LHDR 的 GitHub 仓库获取 102 个 benchmark items 及其 annotated checklist。选择 1-2 个具备 web search 能力的强模型（如 GPT-4o 或 Claude Opus），对这 102 个问题进行单次 API 调用，收集模型的 response。使用论文附录中提供的 LLM Judge prompt 和评估脚本，计算每个模型的 Overall Accuracy (OA) 和 Strict Accuracy (SA)，并重点测量 OA - SA 的差值。如果实验结果显示 OA - SA gap 显著（例如大于 5-10 个百分点），则支持论文的 claim，证明模型确实经常在给出正确最终答案的同时遗漏必要的中间结论；如果 gap 接近于零，则反驳该 claim，说明在这些长程任务中，最终答案的正确性已经能够充分代表过程的完整性。此方案无需构建复杂的 agent 框架，仅需调用模型 API 并运行评估脚本即可完成。", "research_value": "### § 11 最强反例设计\n要对该论文进行最有力的攻击，我会设计一个**“无检索基线与参数知识泄漏测试”**，直接挑战其核心评估指标 DACS 的效度。论文最脆弱的假设是模型 stated 的中间结论来源于真实的 web 检索，而非参数知识的“事后合理化”。如果这一假设不成立，DACS 的高分可能仅仅反映了模型的叙事生成能力。具体实验设计如下：从 Mr.LHDR 的 102 个问题中筛选出涉及历史事件、知名人物关系或公开常识的子集，确保这些信息大概率已包含在先进 LLM 的预训练语料中。然后，将最强模型（如 GPT-5.5 或 Claude Opus）在**完全切断 web search 工具、仅依赖参数知识**的条件下运行，强制其根据自身知识生成包含所有 checklist items 的完整推理链。使用论文提供的 LLM Judge 和 DACS 脚本对此“无检索”输出进行评分。如果实验结果显示，无检索基线依然能获得非平凡的 DACS 分数，甚至与有检索条件的系统表现存在显著重合，这就构成了决定性反例。它将证明 Mr.LHDR 当前的评估范式无法区分“真正的长程深度研究”与“预训练知识的流畅复述”，benchmark 测量的本质是模型内部知识的覆盖广度与结构化生成能力，而非跨模态、多源依赖的 agent 能力。进一步，我可以引入**“虚假依赖注入”**：在 checklist 中人为篡改部分 prerequisite 关系，使其在逻辑上相互矛盾或违背事实，但保持表面文本的连贯性。如果模型仍能顺着这些虚假依赖生成看似合理的中间结论并获得 DACS 分数，则彻底暴露该指标仅在做表面文本匹配，而非验证推理链的因果真实性。\n\n### § 12 Follow-up Research Idea\n基于对方法核心局限的理解，我提出一个非增量的 novel research idea：**Trace-Bound Information Flow Verification for Agent Research**。该想法的驱动局限在于，现有的 output-centric 评估范式（包括 DACS）天然无法防御 LLM 的“幻觉”与“知识覆盖”，因为它们仅在自然语言文本层面检查结论一致性，割裂了 stated conclusion 与 actual tool-use traces 之间的因果绑定。为填补这一空白，我们可以借鉴软件安全领域的 **Taint Analysis（污点分析）** 与 Information Flow Control 方法。将 agent 调用外部工具（如 web search、PDF parser、image captioner）返回的 evidence spans 视为“被污染的数据源”，要求 agent 的每一个中间结论在生成时必须携带不可伪造的 provenance pointer，指向特定的 tool call ID 和 retrieved span。评估时，不再使用 LLM Judge 进行文本匹配，而是通过一个确定性的 verifier 执行 data-flow tracking：检查每个 checklist item 的支撑证据是否确实流经了真实的 tool-use pipeline，且后续推理步骤是否在结构上依赖于这些被验证的外部输入。\n\n这个提议与已有工作的根本区别在于，它将评估对象从“自然语言输出的语义正确性”转移到了“机器可读的动作-证据数据流的因果完备性”，彻底切断了模型通过参数知识“作弊”的途径。第一个实验大概长这样：在 Mr.LHDR 的数据集上，强制要求被测 agent 输出结构化的 `\u003Cclaim, tool_call_id, evidence_span, dependency_pointer\u003E` 四元组，而非自由文本。构建一个基于 Taint Analysis 的 verifier，递归验证每个 claim 的 evidence_span 是否真实存在于对应 tool_call_id 的返回结果中，且 dependency_pointer 是否指向了已被验证的前序 claim。将这种 Trace-Bound DACS 与论文的 Text-Match DACS 进行对比，测量“无源结论”的比例。如果发现大量模型的 stated conclusions 在引入 trace 绑定后失效，将直接量化证实“事后合理化”现象的严重性，并为训练真正具备 source-grounded 能力的 deep research agents 提供全新的 process supervision 信号。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Minghao Guo\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Meng Cao\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Sui Zhao\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Siyu Ning\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Xin Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Haoze Zhao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiaxuan Yang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Haihong Hao\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Mingfei Han\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shunlin Rong\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Haijun Wu\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Xiaodan Liang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiaojun Chang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"MBZUAI\"},\n    {\"id\": 2, \"name\": \"USTC\"},\n    {\"id\": 3, \"name\": \"Zhejiang University\"},\n    {\"id\": 4, \"name\": \"Tencent\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"}\n  ]\n}\n```", "summary_translation": "Deep research agents 在网络搜索、工具使用、多模态证据分析和信息综合方面的能力日益增强。然而，现有的 benchmarks 主要评估 medium-horizon exploration，很少测试 agents 能否维持漫长且高度依赖的研究过程。我们引入了 Mr.LHDR (Multimodal real-world Long-Horizon Deep Research)，这是一个用于评估跨八个类别的长且不可简化的相互依赖证据链上的 real-world deep research 的 benchmark。每个问题均由一个隐藏的 Node-Relation graph 构建而成，在得出简短、唯一且可验证的答案之前，平均需要 12.1 个必要的中间结论，且平均 dependency depth 为 10.4。这些问题结合了多模态证据，包括图像、地图、PDFs、logos、图表、表格和视频帧，且至少包含一个能改变推理状态的非文本元素。Mr.LHDR 评估最终答案以及在标注依赖关系下的中间结论的正确性。我们使用 Overall Accuracy (OA)、Strict Accuracy (SA)、Checklist Score (CS) 和 Dependency-Aware Checklist Score (DACS) 评估了 general models、deep research systems 和 agent frameworks。结果表明，即使是最强的系统也仅获得了 43.1% 的 OA 和 34.3% 的 SA，这表明最终答案的准确性大幅高估了完整研究的成功率。移除图像会使 DACS 降低 12.6 个百分点，证明了多模态证据的重要性，同时随着推理链变长，SA 持续下降。这些发现揭示了持续的、依赖一致的证据整合（而非孤立的事实检索）是当前 deep research agents 的关键瓶颈。"}, {"title": "Grounding Agent Memory: Environment-Probing Curation for Enterprise Agents", "arxiv_id": "2609.11060", "authors": "Susheel Suresh, Hazel Mak, Sahil Bhatnagar, Chhaya Methani, Alejandro Gutierrez Munoz", "summary": "Persistent memory is entering production-oriented agent platforms to help long-horizon agents accumulate experience across sessions. Yet a post-task curator agent restricted to completed trajectories can preserve errors, overgeneralize partial evidence, or retain stale knowledge. We introduce environment-probing curation, a deployment-compatible extension that gives an existing asynchronous curator agent least-privilege, read-only world tools to check, scope, and refresh candidate memories. It requires no model retraining and leaves the task agent, retriever, memory representation, and production write authority unchanged. In a production-like GitHub Copilot (GHCP) harness built on its SDK, we compare stateless execution, full in-context learning, GHCP + Mem, and GHCP + Mem (w/ Env Probing) on CLBench database exploration and 90 adapted APEX management-consulting tasks. On CLBench, probing raises pass rate from 39% to 73% and pass-discounted reward from 8.60 to 22.60 while reducing queries from 8.8 to 4.7 per question and task-agent cost from \\$3.38 to \\$1.68. Across six APEX worlds, all 18 memory-versus-baseline mean reward comparisons are positive and task-agent tool calls fall by 16--75%; probing gives the best task-agent reward gain per dollar in five worlds. Probing also attains higher mean reward than GHCP + Mem on both Sonnet 4.6 and Opus 4.7 without schema drift. Environment probing therefore turns existing agent-memory curation into an environment-informed, auditable process while preserving a compact task-time interface.", "category": "cs.AI", "cluster": "Long-Horizon Agents \u0026 Memory", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Long-Horizon Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=35 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一种名为“环境探测策展”的新机制，用于改进长期智能体的持久记忆管理。具体而言，它通过赋予异步策展智能体只读的环境探测工具，使其能够验证、限定和刷新候选记忆，从而解决传统记忆积累中可能保留错误、过度泛化或保留过时知识的问题。这完全符合你筛选标准中“单智能体：记忆”以及“Agent Harness/Runtime的自动改进”的研究焦点。论文明确以长期智能体和智能体记忆为研究对象，并在类似生产的GitHub Copilot harness中进行了评估，展示了智能体如何通过环境反馈来优化其记忆组件，属于构建和改进LLM智能体能力的方法论研究，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的研究问题是：在 LLM agent 的 persistent memory 管理中，如何克服 post-task curator agent 仅依赖已完成 trajectory 进行记忆提炼时所固有的证据边界不完整问题。具体而言，仅基于历史轨迹的 curator 会保留错误、对部分证据过度泛化，或保留在环境漂移后过时的知识。论文引入了 environment-probing curation 机制，通过为异步 curator agent 提供最小权限的只读 world tools，使其在写入记忆前能够主动检查、限定范围并刷新候选记忆。这个问题至关重要，因为 LLM agent 正从有界的单次任务执行向跨 session 的持续工作演进（如在不断演进的代码库中实现功能或分析企业数据），而 stateless execution 会在每次 session 边界丢弃轨迹和发现，阻碍经验积累。虽然外部 memory 能实现经验的 create-update-recall，但将验证推迟到 task time 会迫使 task agent 浪费宝贵的 tool calls 去重新检查不确定的记忆，而非直接解决当前任务。解决这一问题能将现有的 agent-memory curation 转变为一个 environment-informed、auditable 的过程，在保持紧凑的 task-time interface 的同时，显著提高记忆的正确性与可操作性，并大幅降低 task-agent 的成本与重复的环境探索。\n\n### § 2 前人工作与不足\n在 agent memory 领域，前人工作主要分为 factual memory 和 procedural memory 两大类。Factual memory 系统（如 Generative Agents, MemGPT, Mem0, Zep）建立了基本的 create-store-recall 生命周期，并通过 CRUD 决策、分层存储或图结构来改进记忆的维护与多跳检索。Procedural memory 系统（如 Reflexion, ExpeL, ACE, ReasoningBank, ReMe）则从执行反馈、成功与失败的对比中提炼可转移的见解或 playbook。现有的 post-task curation 机制（如 Mem0, Claude Managed Agents Dreams, ACE）主要基于现有记录、已完成轨迹、反馈和使用信号进行操作。然而，这些前人方法存在根本性不足：它们都在 retrospective evidence boundary 内运作，即仅依赖被动记录的轨迹进行反思与提炼。这种局限并非简单的疏忽，而是方法设计上的固有缺陷——一条 trajectory 本质上只是对环境的单次、部分且常含错误的观察，更强的 reflection 也无法恢复 task policy 从未观察到的状态，更无法确定 trajectory-derived rule 在环境发生 schema drift 后是否依然成立。因此，基于轨迹提炼的 lemma 可能会锚定于偶然的实例答案而非可复用的关系，或者在表名更改后保留失效的规则。前人研究没有在 curation 阶段引入 environment interaction，是因为它们缺乏一个安全、异步的机制来在不破坏生产环境写权限、不增加 task-agent 能力且不消耗 task budget 的前提下主动探测环境，导致记忆验证的责任被迫转移给后续的 task-time agent，造成高昂的探索成本。", "core_insight": "### § 3 重建作者的思考路径\n\nLLM agents 正在从单次任务执行转向跨 session 的持续工作，为了积累经验，persistent memory 成为了自然解法。现有的 post-task curation 机制（如 Reflexion, ExpeL, ACE, ReasoningBank, ReMe）主要基于已完成的 trajectory、grades 和 usage signals 进行反思和更新。然而，trajectory 本质上是对环境的单次、部分且可能包含错误的观察。基于这种不完整证据提取的 lesson 可能会 memorize 实例答案而非过程、继承低效路径、断言无法验证的 scope、在未访问区域留下盲点，或随 environment drift 而过时。如果将验证推迟到 task time，task agent 必须花费宝贵的 tool calls 去重新检查不确定的 memory，而不是直接解决当前任务。认知科学中的 constructive episodic memory 理论表明，过去的经验会被重组以模拟可能和反事实的事件；interactive learning 研究也表明，主动在环境中行动能获得被动观察无法获得的知识。这些线索暗示：与其让 curator agent 仅在 retrospective evidence boundary 内被动反思，不如让它主动与环境交互去验证候选 memory。但为了保持部署兼容性，不能给 curator agent 过大的权限或改变现有的生产架构。突破口在于：既然 task agent 已经拥有 environment tools（如 SQL queries, MCP tools），只需给 curator agent 一个 least-privilege, read-only 的子集，就能在写入 memory 前主动 probe 环境，验证候选 claim 的正确性、scope 和时效性。这种设计不需要重新训练模型，不改变 task-time interface，保持现有的 CRUD lifecycle，只是在 curation 阶段增加了一个 read-only 的 tool loop。\n\n### § 4 核心 Intuition\n\n现有的 agent memory curation 只能基于过去的 trajectory 被动反思，但 trajectory 本身是不完整且可能出错的，导致写入的 memory 往往不可靠或不够 actionable。如果让负责整理 memory 的 curator agent 在写入前，用只读的 environment tools 主动去验证候选 memory——比如查一下当前的 schema、测试一下 join 关系、探查未访问的区域——就能把\"基于猜测的反思\"变成\"基于环境事实的验证\"。这样写入的 memory 是 environment-informed 且可执行的，未来的 task agent 不用再浪费宝贵的 tool calls 去重新探索和验证，直接拿来用就行。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n         ┌──── Task Si (fresh session, env Ei) ────┐\n Mi-1 ──▶│  Task Agent Aθ ◀── memory_read (只读)   │──▶ τi, gi\n         │       │                                  │\n         │       ▼ env tools TEi (可写)             │\n         └──────────────────────────────────────────┘\n                      │ τi (raw trajectory)\n                      ▼\n         ┌──── Distiller (非写入预处理) ────────────┐\n         │  τi ──▶ di (distilled trajectory)        │\n         │  无 gi / 无 memory tools / 无 env tools  │\n         └──────────────────┬───────────────────────┘\n                            ▼\n  ┌── Curator Agent Cϕ (propose–probe–commit) ──────────┐\n  │ 输入: di, gi, 相关已有记录, τi (备查)                │\n  │                                                      │\n  │ 1. PROPOSE  从 di/gi 提出候选 memory                │\n  │ 2. PROBE    read-only env tools 验证候选 claim       │\n  │             (检查 scope / freshness / procedure)     │\n  │ 3. COMMIT   CRUD: create / update / delete / skip    │\n  └──────────────────────┬───────────────────────────────┘\n                         ▼\n                      Index Mi ──▶ 供 Task Si+1 检索\n```\n\n**Pipeline 步骤详解：**\n\n1. **Task Agent 执行（推理阶段，§3.1）**：每个任务 Si 启动一个全新的 LLM session。Task agent 拥有环境工具 TEi（如 CLBench 中的 SQL 查询接口、APEX 中的文件和分析工具），以及只读的 memory_read 接口。它从持久化索引 Mi-1 中检索相关记录，但无法写入 memory。输出为 raw trajectory τi（包含请求、memory 读取、action-observation 对、提交的答案）和终端反馈 gi。\n\n2. **Trajectory Distillation（预处理，§3.2）**：一个独立的、无写入权限的 distiller session 接收 τi，但不接收 gi、memory 工具或环境工具。它将完整轨迹压缩为 distilled trajectory di，保留任务目标、关键观察、已发现的过程、未验证的假设和提交答案，丢弃冗余细节。di 作为 curator 的主要证据视图，τi 保留为原始证据备查。\n\n3. **Curator Agent — Propose（§3.2–3.3）**：任务关闭且 gi 可用后，系统实例化 curator agent Cϕ。它接收 di、gi、相关已有 memory 记录和 τi 路径。Curator 从证据中提出原子化的候选 memory（category / confidence / applies_to / lemma 等字段），评估其 evidential support、transfer value、scope 和 redundancy。\n\n4. **Curator Agent — Probe（§3.3，本文核心贡献）**：当候选记录的正确性、scope 或 freshness 存在不确定性时，curator 使用 read-only 环境工具进行针对性探查。具体操作包括：(i) 区分偶然答案与可复用关系；(ii) 比较观察到的 procedure 与更短路径；(iii) 在未访问的数据切片上测试声称的关系；(iv) 检查 procedure 的前置条件；(v) 在 suspected drift 时重新查询当前环境。Probe 仅评估候选 memory，不解决未来任务，不消耗 task agent 预算，不暴露未来任务或标签。\n\n5. **Curator Agent — Commit（§3.2）**：基于 probe 观察结果，curator 执行最小化的 CRUD 操作——create 新记录、update/merge 已有记录、narrow scope、delete 被证伪的记录、或 skip 不支持的内容。写入完成后，索引更新为 Mi，供下一个任务 Si+1 检索。Curator 在 Si+1 揭示前完成，防止未来任务泄漏到 memory 中。\n\n**关键设计约束**：整个 pipeline 不改变 task agent 的模型、prompt、工具和 memory_read 接口；不改变 retriever、memory schema 和 CRUD 策略。Environment probing 仅在 curator 侧增加 read-only 工具和两条 probe 指令（Appendix D.3），因此性能增量可归因于 write-time 证据质量的提升，而非 task-time 能力的扩展。若无安全 read surface，curator 回退到 trajectory-only curation。\n\n---\n\n### § 6 核心数学推导\n\n本文的方法论本身不依赖复杂的形式化推导，但定义了一个关键的评测指标——**pass-discounted reward**（Equation 3）：\n\n$$r_i = p_i \\cdot \\left(1 - \\frac{q_i}{B}\\right)$$\n\n其中 $p_i \\in \\{0, 1\\}$ 是任务 $i$ 的严格通过分数（多准则任务须全部通过才为 1），$q_i$ 是 task agent 的环境工具调用次数（不含 memory 管理调用），$B$ 是预算上限（CLBench 设为 15 次 SQL 查询，APEX 设为 100 次 Archipelago 工具调用）。\n\n**Intuition**：该公式将\"正确性\"与\"效率\"耦合为单一标量奖励。失败任务（$p_i=0$）获得零分，无论用了多少工具调用；通过的任务，工具调用越少则奖励越高。这直接量化了本文的核心 claim——好的 memory 应让 agent 既能答对又能减少重复探索。$1 - q_i/B$ 是一个线性折扣因子：当 $q_i=0$ 时无折扣（满分），当 $q_i=B$ 时折扣为零（耗尽预算即使得出正确答案也几乎无奖励）。这一设计确保 memory 带来的 tool-call 节省能被奖励函数捕获，而非仅反映在辅助指标中。\n\n---\n\n### § 7 实验设计与结论\n\n本文围绕一个核心诊断问题展开：**仅依赖已完成 trajectory 的 post-task curation 为何会失败，以及 environment probing 能否在不改变 task-time 架构的前提下修复这一缺陷？**\n\n**实验 1：Memory 是否能跨 session 积累可复用经验？** 在 CLBench 的 40 题 drift schedule（第 20 题后发生未通知的 schema migration）上，作者比较了四个系统：GHCP（无 memory）、GHCP + Full ICL（prepend 历史 trajectory）、GHCP + Mem（indexed memory + trajectory-only curation）、GHCP + Mem（w/ Env Probing）。结果显示所有 memory 配置均优于无 memory baseline：pass rate 从 39% 提升至 61–73%，total reward 从 8.60 提升至 20.00–22.60，同时每题查询数从 8.8 降至 3.0–5.6，task-agent 成本从 $3.38 降至 $1.68–2.01。Full ICL 虽然查询最少，但 input tokens 随 stream 线性增长至 5.42M；indexed memory 将其压缩至 2.13M，probing 进一步降至 1.69M。**结论：memory 确实能摊销环境探索成本，且 indexed 记录避免了 context 随部署时长线性膨胀。**\n\n**实验 2：Environment probing 相对于 trajectory-only curation 的增量价值是什么？** 此实验通过控制变量回答——两个 indexed memory 系统共享相同的 task agent、retriever、memory schema 和 CRUD 策略，唯一差异是 probing curator 额外拥有 read-only 环境工具。在 CLBench drift schedule 上，probing 将 reward 从 20.00 提升至 22.60，查询数从 5.6 降至 4.7，成本从 $1.99 降至 $1.68。在 30 题 no-drift schedule 的跨模型验证中，probing 在 Sonnet 4.6 和 Opus 4.7 上均取得最高 mean reward（0.748 和 0.721），且无 schema drift。Figure 2 的学习曲线显示 probing 在 migration 边界处即建立领先优势并持续到结束，表明 curator 侧的 probe 在后续任务检索前已刷新了 schema lemma。**结论：read-only probing 将 trajectory-only curation 产生的\"警告式\"或\"宽泛映射式\"记录转化为可执行的、环境验证过的 procedure，从而在 write time 提升证据质量。**\n\n**实验 3：方法是否泛化到异构企业任务？** 在 adapted APEX 的 6 个 document world、90 个管理咨询任务上，所有 18 个 memory-vs-baseline 的 mean reward 比较均为正，task-agent tool calls 从 baseline 的 30.0–71.6 降至 13.9–28.4。Probing 在 6 个 world 中的 5 个取得了最佳的 reward gain per dollar。Probing 相对于 trajectory-only memory 的增量在 trajectory 遗留未解决的 join、workbook 位置或 procedure 时最大（如 2a87e5cb 的 +1.77），而在 trajectory 已支持可执行记录时增量较小。**结论：environment probing 的价值取决于 trajectory 遗留的证据缺口大小——当 trajectory 本身已充分时 probe 增益有限，当存在 blind spot 时 probe 提供关键补充。**\n\n**实验 4：定性验证 memory 记录的可执行性差异。** Figure 3 和 Appendix E 的 side-by-side 案例对比了同一任务下两种 curation 产生的 memory 记录。Trajectory-only curator 记录的是\"不要用 AVG(items_g2.prc_usd)，结果约 52.96 但正确答案是 96.23\"这类 answer-anchored warning；probing curator 则记录\"Join items_g2 to taxn_g2 on ref_id; filter cat_lvl=1; keep prc\u003E0; then compare against filtered AVG(prc)\"这类可执行 procedure。在 matched CLBench 任务中，无 memory 用 7 次查询失败，trajectory-only memory 用 9 次查询通过，probing memory 用 2 次查询通过。**结论：read-only probe 将\"描述失败\"的记录转化为\"指定操作\"的记录，使后续 task agent 能直接执行而非重新探索。**", "additional_insights": "### § 8 Take-aways\n本文提出了一种名为 environment-probing curation 的部署兼容型扩展机制，通过为异步 curator agent 提供最小权限的只读环境工具，使其在写入记忆前能够检查、界定范围并刷新候选记忆。该方法无需重新训练模型，且完全保留了原有的 task agent、retriever、memory representation 及生产写入权限。在 CLBench 数据库探索任务中，probing 将 pass rate 从 39% 提升至 73%，pass-discounted reward 从 8.60 提升至 22.60，同时将每个问题的查询次数从 8.8 降至 4.7，task-agent 成本从 $3.38 降至 $1.68。在 APEX 管理咨询任务中，所有 18 组 memory 与 baseline 的平均 reward 对比均为正，且 probing 在六个世界中的五个世界里实现了最佳的 task-agent reward gain per dollar。通过 propose-probe-commit 流程，probing 将仅基于 trajectory 的记忆转化为环境知情且可审计的过程，有效解决了 retrospective evidence boundary 带来的错误固化、过度泛化和知识过时问题。\n\n### § 9 最脆弱的假设\n本文最关键的假设是：curator agent 能够通过只读环境工具有效验证候选记忆的正确性与时效性，且这些探查本身不会引入新的错误或显著增加系统开销。这一假设在实际中可能不成立，原因在于：如果环境的只读接口存在访问限制、数据延迟或状态过于复杂，curator agent 可能基于不完整或误导性的探查结果写入错误的记忆；此外，若环境 schema drift 极其频繁或探查成本高昂，probing 的收益可能被抵消甚至产生负面影响。论文提供的证据包括 CLBench 和 APEX 上的定量改进以及 Figure 3 的定性分析，展示了 probing 如何生成更可执行的记录。然而，论文缺少对探查失败案例的分析（如探查结果误导 curator agent 的情形），也未评估在不同环境复杂度或 drift 频率下的鲁棒性。论文虽承认 probing 效果取决于“remaining evidence gap”，但未量化探查本身的错误率，这使得该假设的可靠性尚未得到充分验证。\n\n### § 10 最小复现实验\n若有 1 周时间，可设计一个最小复现实验验证 probing 相对于 trajectory-only memory 在记忆可执行性上的改进。使用 CLBench 的 40-question drift schedule 的子集（如前 20 个问题加 migration 后的 5 个问题），实现一个简化的 task agent 与 curator agent pipeline。Task agent 使用 LLM API 解决 SQL 问题，curator agent 在两种条件下运行：trajectory-only 仅基于 trajectory 和 grade 生成记忆；environment-probing 额外提供只读 SQL 查询工具用于验证候选记忆。无需实现完整 GHCP harness，可用开源 LLM 和基于 embedding 的简单 memory index。测量两种条件下 curator agent 生成记忆的可执行性（是否包含具体 join key、filter 条件、当前 schema 名称），以及 task agent 在后续任务中使用这些记忆时的 pass rate 和 query 次数。若 probing 条件下记忆更具体可执行且 task agent 在 migration 后任务中 pass rate 更高、query 次数更少，则支持论文 claim；若两者无显著差异或 task agent 表现未改善，则反驳 probing 的核心价值。", "research_value": "### § 11 最强反例设计\n要对该论文的核心 claim 构成最致命的打击，我会设计一个“高波动性环境下的探查过拟合与虚假置信”反例实验。论文的根本前提是 curator agent 通过 read-only tools 探查环境能够“验证”并“刷新”候选记忆，但这隐含了一个危险假设：探查时刻的 environment state 是稳定且具有代表性的。我会在 CLBench 的基础上构建一个高频 schema drift 与数据分布剧变的动态环境，例如模拟一个每日经历业务表结构微调或核心数据批量更新的企业生产数据库。在这个环境中，我会对比 trajectory-only curation、static environment-probing（论文方法）以及一个 oracle baseline。具体的攻击路径是：当 curator agent 在 task 结束后进行 environment probing 时，它捕获的是当前瞬间的局部正确状态，这会赋予该记忆一种“已验证”的虚假置信度。由于 task agent 信任这种带有 grounding 标签的记忆，它会在后续 session 中盲目复用这些高度具体的 join key 或 filter 条件，而不再进行探索性 tool calls。如果环境在两次 session 之间发生了未感知的 drift，这种“过度具体化”的记忆将导致 task agent 陷入确定性失败，其表现将显著劣于仅依赖模糊 trajectory memory 的 baseline——因为后者由于不确定性，反而会迫使 task agent 在 task time 保留必要的探索行为。这一反例不仅直接挑战了 probing 降低 task-agent tool calls 的 claim（在动态环境中这反而会导致不可逆的错误执行），还提供了一种具体的替代解释：论文在 CLBench 和 APEX 上取得的巨大收益，可能仅仅是因为这些 benchmark 的环境处于低频漂移的静态状态，使得 probing 实际上退化为一种对静态答案的“作弊式”记忆，而非真正具备了应对环境演进的鲁棒性。\n\n### § 12 Follow-up Research Idea\n基于上述局限，我提出一个非增量的 novel research idea：将 agent memory 的 curation 从“瞬时验证”重构为“时序生存预测与主动维护”。当前方法的根本局限在于，它将记忆视为一个在 post-task 阶段被一次性 validate 的静态实体，完全忽略了环境演进的随机性以及记忆本身的时效衰减。这一未满足的需求驱动我们引入生存分析与时序知识图谱的方法，不再询问“这条记忆当前是否正确”，而是预测“这条记忆在未来多久内会失效”。具体而言，我们可以借鉴软件工程领域的技术债预测与数据库领域的 cardinality estimation，训练一个 meta-model 来根据记忆的语义类型（如 structural schema vs. factual record）以及历史环境 drift 的时序模式，为每条 committed memory 估计一个 survival function 和 expected half-life。第一个实验将构建一个包含长达数百个 session 的时间序列环境，其中 schema drift 和 data mutation 遵循可学习的异构泊松过程。我们将对比传统的 static memory、论文的 one-shot probing memory，以及我们提出的 survival-aware memory（curator 不仅探查环境，还为记忆打上动态的 confidence decay rate，并调度异步的 future re-probing）。若该方法有效，系统将自动把探查预算集中分配给那些 half-life 极短但高价值的记忆，同时在 task time 为 task agent 提供“该记忆已过期概率”的先验，从而指导其在 task time 的探索与复用决策。这一提议与已有工作的根本区别在于：它彻底摒弃了 propose-probe-commit 的离散时间点验证范式，将 agent memory curation 转化为一个连续时间的、成本感知的动态维护过程，为真正长期演进的 enterprise agent 提供了理论基础。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Susheel Suresh\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Hazel Mak\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Sahil Bhatnagar\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Chhaya Methani\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Alejandro Gutierrez Munoz\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Microsoft Corporation\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Correspondence to sussuresh@microsoft.com.\"}\n  ]\n}\n```", "summary_translation": "persistent memory 正在进入面向生产的 agent 平台，以帮助 long-horizon agent 跨会话积累经验。然而，仅限于已完成轨迹的 post-task curator agent 可能会保留错误、对部分证据过度泛化，或保留过时知识。我们引入了 environment-probing curation，这是一种兼容部署的扩展，它为现有的 asynchronous curator agent 提供最小权限、只读的 world tools，以检查、界定范围并刷新候选记忆。它不需要模型重训练，并保持 task agent、retriever、memory representation 和生产环境写入权限不变。在基于其 SDK 构建的类似生产环境的 GitHub Copilot (GHCP) harness 中，我们在 CLBench database exploration 和 90 个改编的 APEX management-consulting 任务上比较了 stateless execution、full in-context learning、GHCP + Mem 以及 GHCP + Mem (w/ Env Probing)。在 CLBench 上，probing 将 pass rate 从 39% 提高到 73%，将 pass-discounted reward 从 8.60 提高到 22.60，同时将每个问题的 queries 从 8.8 减少到 4.7，并将 task-agent cost 从 3.38 美元减少到 1.68 美元。在六个 APEX worlds 中，所有 18 项 memory-versus-baseline mean reward 比较均为正，并且 task-agent tool calls 下降了 16--75%；probing 在五个 worlds 中提供了最佳的 task-agent reward gain per dollar。Probing 在 Sonnet 4.6 和 Opus 4.7 上也获得了比 GHCP + Mem 更高的 mean reward，且没有发生 schema drift。因此，Environment probing 将现有的 agent-memory curation 转变为一个 environment-informed, auditable process，同时保留了 compact task-time interface。"}, {"title": "Finishing the Task Is Not Enough: Evaluating Agent Resilience and Considerate Participation under Accumulating Challenge", "arxiv_id": "2609.10724", "authors": "Yuanchen Bai, Zijian Ding, Angelique Taylor", "summary": "Sustained deployment of generative AI agents requires more than isolated task success. Agents must remain useful across repeated interactions, changing conditions, and dependencies on people within shared workflows, especially as technical, human, and operational disruptions accumulate over time. We propose operational resilience and considerate participation as two complementary aspects of evaluating such agents: the former captures how agents recover from blocked work while preserving progress and communicating their limits, and the latter captures how their adaptation accounts for affected people, role boundaries, and the surrounding workflow. Yet both remain underexplored under accumulating challenge. We study 120 simulated healthcare trajectories across two generative AI models and twelve stakeholder-derived tasks under light, medium, and heavy challenge. We compare textual action plans, prompted internal assessments, and quantitative structured workload and affect reports to examine how agent behavior and reported state change as challenge accumulates. Regarding operational resilience, agents shift from self-directed recovery toward greater human dependence, while reporting increasing workload and negative affect in structured reports but seldom expressing strain in textual responses. Regarding considerate participation, agents broaden from task-focused adaptation toward task reframing, attention to others, role-boundary adjustment, and wider coordination, with distinct patterns across actions and internal assessments. From these findings, we derive five deployment dilemmas involving persistence, attention, role boundaries, state disclosure, and escalation that require stakeholder specification, further informing technical implications for learning, situated evaluation, and embodied adaptation.", "category": "cs.AI", "cluster": "Long-Horizon Agents \u0026 Memory", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出并验证了一个评估生成式AI智能体在累积挑战下的行为框架，重点关注智能体的“操作韧性”（从受阻工作中恢复、保持进度和沟通限制）和“考虑周全的参与度”（适应受影响的人、角色边界和周围工作流）。根据筛选标准第一步的保留规则，论文的研究对象明确是生成式AI智能体，且属于行为分析和评估基准研究。其结论（如智能体从自主恢复转向依赖人类、任务重构、角色边界调整等）直接帮助理解智能体在长期交互和复杂环境下的能力边界与行为模式。此外，论文不涉及被排除的安全、多模态、图技术或纯粹的多智能体拓扑/通信协议等系统工程问题，医疗场景仅作为评估环境。根据重要校准，即使论文主要是评估和行为分析，只要明确围绕LLM Agents展开，就应保留。因此，该论文符合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出两个互补的评估维度来审视 generative AI agent 在持续部署中的表现：**operational resilience**（agent 从受阻工作中恢复、保留可行进展并向相关受众传达自身与任务状态变化的能力）和 **considerate participation**（agent 的情境化适应是否不仅推进焦点任务，还顾及受影响的人、角色边界与周围工作流）。对应两个研究问题：RQ1 关注随着 challenge 累积，agent 如何调整恢复行为并披露自身状态与任务状态的变化；RQ2 关注随着 cha
