while preserving each task's original evaluation protocol, enabling existing benchmarks to be reused as controlled testbeds without new annotation. Across multiple tasks, we surface a consistent phenomenon: strong static-setting performance does not transfer to the evolving-intent setting, with substantial drops across model families. Our findings point to a fundamental gap: today's LLMs do not yet faithfully track and act on the user's evolving intent, a capability invisible to static evaluation yet critical for future collaborative agents.", "category": "cs.LG", "cluster": "Human-Agent Interaction \u0026 Tool Use", "tags": ["cs.LG"], "filter_reason": "该论文符合研究范围，主要基于以下核心依据：\n\n1.  核心对象明确为协作智能体 (Collaborative Agents)：摘要明确指出研究背景是 LLM 作为“collaborative agents”（协作智能体）被部署以处理用户委托的任务。这直接对应了筛选标准中关于“LLM-based Agents”和“Multi-Agent Systems”（此处体现为人机协作或多轮交互中的智能体角色）的关注点。\n\n2.  聚焦智能体的关键能力：长期决策与意图追踪：论文研究的核心问题是智能体如何在多轮对话中“track and act on user intent as it evolves”（追踪并响应演化的用户意图）。这属于智能体的长期决策 (Long-Horizon Decision-Making)、记忆 (Memory) 以及动态交互中的适应性范畴。这是构建鲁棒 Agentic AI 的关键能力，而非简单的单轮推理。\n\n3.  属于智能体行为分析与评估基准 (Behavior Analysis \u0026 Benchmarking)：根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准... 只要结论直接帮助理解或改进智能体能力，也应保留”。该论文通过构建动态意图演化框架，揭示了现有 LLM 在动态交互场景下的能力缺口（gap），这种诊断性研究对于改进智能体的交互机制、记忆管理和规划能力具有直接指导意义。\n\n4.  排除项不适用：\n       它不是单纯的基础推理优化（如数学/逻辑 CoT），而是涉及交互动态性。\n       它不涉及被排除的安全、对齐、幻觉或图神经网络等技术。\n       它不是非演化型的应用（如仅用 LLM 做医疗诊断），而是研究智能体在动态环境下的行为机制。\n\n综上，该论文深入探讨了 LLM 智能体在动态、多轮交互场景下的核心能力缺陷，属于 Agentic AI 行为分析与能力评估的前沿研究，符合“构建、改进、评估 LLM 智能体”的目标。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在用户意图随对话动态演变（evolving user intent）的多轮交互场景中，大型语言模型（LLMs）能否准确追踪并响应用户意图的披露、修订和转向？尽管 LLMs 正从被动问答转向协作代理（collaborative agents），但现有评估主要基于单轮、完全指定的静态设置（static, single-turn settings），这掩盖了真实交互中意图动态变化的本质。这一问题至关重要，因为真实的用户交互具有内在的动态性：用户很少一次性完整指定意图，而是随着对话展开逐步披露、修正甚至改变任务方向。如果 LLMs 无法忠实追踪这种演变，它们将无法胜任 vibe coding、deep research 等长 horizon 的协作任务。解决这一问题的价值在于揭示当前 LLMs 在动态意图追踪上的根本缺陷，证明静态评估的高性能无法迁移到动态场景，从而为未来协作代理的开发提供关键的评测基准和改进方向，确保代理能在复杂的、意图不断变化的真实交互中保持可靠性。\n\n### § 2 前人工作与不足\n\n此前，多轮评估（multi-turn evaluation）和用户模拟环境（user simulation environment）的研究已尝试解决多轮交互中的代理能力评估，但存在显著不足。现有的多轮基准（如 MT-Bench, Mint, τ-bench 等）主要依赖 LLM-as-judge 进行奖励计算，缺乏可验证的 ground-truth，且用户回合通常局限于短 horizon 或仅涉及增量信息披露（incremental information disclosure），缺乏对用户行为（如意图修订、任务切换）的可控性，导致无法系统性地探测特定的交互模式。此外，构建大规模多轮基准需要高昂的标注成本，且静态对话难以控制用户行为。用户模拟方法（如 Sun et al., 2025; Laban et al., 2026a）虽然尝试模拟 under-specification，但通常仅覆盖意图动态的一个维度（如模糊提示或信息分片），且受限于源问题的信息内容，难以扩展到长 horizon 交互；而基于 LLM 提示的用户模拟（如 Yao et al., 2025; Qian et al., 2025a）则需要针对每个领域进行手动策展（如 schema 设计），泛化性差。这些方法未能提供一个可扩展、完全可验证且能捕捉真实用户行为动态（如修订和任务切换）的评估设置。本文指出，前人工作之所以未能充分解决此问题，是因为它们要么牺牲了评估的可验证性（依赖 LLM 判断），要么缺乏对意图动态复杂性的建模（仅关注增量披露），要么工程成本过高且缺乏可控性，导致无法在保留自动可验证性的同时，模拟出意图随时间演变的长 horizon 多轮交互。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM 从被动问答转向主动协作 Agent 的背景下，研究者观察到现有评估体系存在严重的“静态偏差”：主流 Benchmark（如 GSM8K, SWE-Bench）均基于 Single-turn 设定，假设用户意图在首轮即完全明确。然而，真实交互中用户意图是动态演化的（Evolving User Intent），包含信息的逐步披露（Underspecification）、修正（Revision）和任务切换（Task Switching）。\n\n现有的 Multi-turn 评估方案面临两大瓶颈：一是构建成本高，难以规模化；二是缺乏可验证性（Verifiability），多依赖 LLM-as-judge，导致评估结果不可靠且难以复现。研究者意识到，直接从头构建长程多轮对话数据集既不经济也不具备 Ground-truth 的确定性。\n\n因此，核心思路转向“逆向工程”：既然 Single-turn 数据集拥有完美的自动验证器（Verifier）和明确的 Ground-truth，能否将其作为多轮对话的“终点锚点”（Anchor Intent）？通过从终点回溯，合成前序的意图状态（如先给出错误参数再修正，或先执行前置任务再切换），即可在保留原有自动验证能力的同时，模拟出复杂的动态交互过程。这种方法既解决了数据标注成本问题，又通过控制意图转换类型（Reveal, Revision, Switch），精准隔离了模型在“意图追踪”上的能力缺陷，从而揭示出静态评估无法发现的性能断崖。\n\n### § 4 核心 Intuition\n\nLLM 在静态单轮任务中的高性能，掩盖了其在动态多轮交互中“意图追踪”能力的缺失。\n\n现有模型擅长在给定完整上下文时求解，但缺乏在对话过程中动态维护、更新和修正“用户意图信念状态”（Belief State）的机制。\n\n当用户意图发生演化（如修正参数或切换任务）时，模型往往无法有效区分“过时信息”与“当前有效信息”，导致注意力分散或信念固化，从而在最终执行时偏离真实意图。\n\n本方法通过“逆向合成”将静态任务转化为动态多轮场景，利用原有的自动验证器精准量化这种因意图演化导致的性能衰减，证明了“意图追踪”是独立于“单轮推理”的关键瓶颈。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出了一种将静态、单轮（Single-turn）可验证基准测试转化为动态、多轮（Multi-turn）且用户意图不断演化（Evolving User Intent）的评估框架。其核心思想是“逆向构建”：以单轮任务的最终答案和意图为锚点（Anchor），回溯生成导致该意图的前置对话历史。\n\n**完整 Pipeline 步骤如下：**\n\n1.  **意图提取（Intent Extraction）：**\n    *   **输入：** 来自现有基准（如 GSM8K, SWE-Bench）的单轮问题-答案对 $(q, y^*)$。\n    *   **处理：** 使用 LLM 将问题分解为结构化意图 $I^* = (f^*, C^*)$，其中 $f^*$ 是目标函数（如“计算总和”、“修复Bug”），$C^*$ 是参数集合（如数字、约束条件）。\n    *   **输出：** 锚定意图（Anchor Intent），作为多轮对话最后一轮（Turn $T$）的真实状态。\n\n2.  **回溯扩展（Retrospective Expansion）：**\n    *   **处理：** 为了模拟意图演化，系统生成两种类型的“干扰”或“前置”内容：\n        *   **反事实参数（Counterfactual Arguments）：** 为 $C^*$ 中的某些参数生成错误的初始值（例如，将“纽约”改为“布鲁克林”），以便后续进行“修正（Revision）”。\n        *   **前驱函数（Predecessor Functions）：** 生成一个与 $f^*$ 相关但不同的前置任务（例如，从“查找餐厅”切换到“预订餐厅”），确保两者共享部分上下文。\n    *   **输出：** 一组可用于构建对话历史的扰动池（Perturbation Pools）。\n\n3.  **意图调度（Intent Scheduling）：**\n    *   **处理：** 根据预设的过渡类型预算（如几次揭示、几次修正、几次切换），算法在 $T$ 轮对话中安排意图状态的变化。遵循严格规则，如“最后一轮必须锚定到 $I^*$”、“修正前必须先出现错误值”、“切换前当前任务必须完整”。\n    *   **输出：** 每一轮的意图增量 $\\Delta I_t$（即本轮新增或修改的信息）。\n\n4.  **对话渲染（Text Rendering）：**\n    *   **处理：** 将结构化的 $\\Delta I_t$ 转换为自然语言用户 utterance。可以使用基于规则的模板（如添加“等等，我忘了说...”前缀）或 LLM 进行自然化重写，确保对话流畅且符合人类交互习惯。\n    *   **输出：** 多轮对话的用户侧文本序列 $u_1, ..., u_T$。\n\n5.  **评估与验证（Evaluation \u0026 Verification）：**\n    *   **输入：** 将渲染好的多轮对话输入待测 LLM Agent。\n    *   **处理：** Agent 在每一轮接收用户输入并生成响应。在最后一轮，Agent 输出最终答案或动作。\n    *   **输出：** 使用原始单轮基准的自动验证器（Verifier）对 Agent 的最终输出进行评分。由于最后一轮意图与原始问题一致，无需新的标注即可实现自动评估。\n\n**真实例子讲解（以数学题为例）：**\n*   **原始单轮问题：** “一个正六边形可以分成8个等边三角形，其中一个三角形的周长是21英寸，求六边形面积。”\n*   **Pipeline 执行：**\n    1.  **提取：** $f^*$=计算面积，$C^*$={形状:正六边形, 分割数:8, 三角形周长:21}。\n    2.  **回溯：** 生成反事实参数“分割数:6”（错误值）；生成前驱函数“计算三角形周长”（前置任务）。\n    3.  **调度：**\n        *   Turn 1: 用户说“我想算一个正六边形的面积，它被分成了6个三角形...”（引入错误参数）。\n        *   Turn 2: 用户说“等等，我搞错了，其实是8个三角形。”（Argument Revision）。\n        *   Turn 3: 用户说“另外，每个小三角形周长是21。”（Argument Reveal）。\n    4.  **渲染：** 生成上述自然语言对话。\n    5.  **评估：** Agent 在 Turn 3 后给出面积答案，系统用原始 GSM8K 验证器检查是否正确。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过。**\n本文主要贡献在于评估框架的设计与实证分析，而非提出新的数学模型或理论推导。文中虽然定义了意图状态 $I_t = (f_t, C_t, C_t^{[rev]}, y_t)$ 和三种状态转移（Argument Reveal, Argument Revision, Function Switch），但这属于形式化定义（Formalization）而非数学推导。其核心逻辑是基于状态机（State Machine）和偏可观测马尔可夫决策过程（POMDP）的建模，旨在控制实验变量，而非推导新的数学定理。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有的 LLM 评估多在静态、单轮（Single-turn）设定下进行，无法反映真实场景中用户意图动态演化（如逐步披露、中途修正、任务切换）的情况。核心问题是：**LLM 在单轮任务上的高性能是否能迁移到意图不断演化的多轮交互中？**\n\n**2. 设计了什么实验验证这个问题？**\n*   **基准转化：** 选取四个可自动验证的单轮基准（GSM8K, BIRD-SQL, BrowseComp+, SWE-Bench Verified），利用提出的框架将其转化为包含6次意图过渡（2次揭示、2次修正、2次切换）的7轮多轮对话。\n*   **模型对比：** 测试前沿闭源模型（GPT 5.x, Gemini 3.1 Pro等）和开源模型（Kimi, DeepSeek等）在原始单轮设定与演化意图设定下的准确率。\n*   **消融分析：**\n    *   **过渡类型影响：** 单独增加揭示、修正或切换的次数，观察性能下降曲线。\n    *   **组合复杂度：** 测试不同过渡类型的组合（如仅修正 vs. 修正+切换）对性能的影响。\n    *   **上下文携带：** 分析在任务切换（Function Switch）后，模型是否能保留并利用切换前的相关上下文。\n    *   **记忆机制干预：** 测试“提示回顾（Prompt Recap）”和“神谕回顾（Oracle Recap，直接提供当前正确意图）”是否能缓解性能下降。\n    *   **难度控制：** 在 BIRD-SQL 中通过提供/隐藏提示来改变基础任务难度，观察多轮交互是否放大了难度带来的负面影响。\n\n**3. 问题的答案是什么？**\n*   **性能显著下降：** 单轮高性能无法迁移到多轮演化意图场景。例如，GPT 5.5 在 GSM8K 上从 99.0% 降至 80.5%；在 SWE-Bench 上，部分模型准确率甚至降至 0%。\n*   **核心瓶颈是意图追踪：** 模型并非缺乏推理能力，而是难以在多轮交互中准确追踪和更新对用户意图的信念（Belief State）。特别是“任务切换（Function Switch）”导致性能下降最严重，因为模型难以在切换后整合之前的上下文。\n*   **记忆机制有限：** 即使提供完美的意图回顾（Oracle Recap），性能仍低于单轮水平，说明问题不仅在于记忆缺失，还在于模型在处理冲突或过时上下文时的注意力分配机制存在缺陷。\n*   **难度放大效应：** 基础任务越难，多轮演化意图带来的性能衰减越剧烈。\n*   **结论：** 当前 LLM 缺乏忠实追踪和行动于演化用户意图的能力，这是一个静态评估无法暴露但对未来协作代理至关重要的根本性差距。", "additional_insights": "### § 8 Take-aways\n\nLLMs 在静态单轮任务中的高性能无法迁移到动态多轮交互中，因为现有评估未能捕捉用户意图在对话中逐步披露、修订和切换的真实动态。本文提出了一种将可验证的单轮基准（如 GSM8K, SWE-Bench）转化为多轮“演化意图”环境的框架，通过锚定最终意图并回溯合成前序对话，保留了原始数据集的自动可验证性。实验显示，随着意图转换（Argument Reveal, Argument Revision, Function Switch）次数的增加，前沿模型（如 GPT 5.5）的性能显著下降，其中 Function Switch 造成的信念状态更新负担最重，导致模型难以整合切换前后的上下文。简单的记忆增强机制（如 Prompt Recap 或 Oracle Recap）虽能缓解部分性能损失，但无法完全消除与单轮基准的差距，表明模型缺乏主动追踪和更新用户意图的内在能力。此外，增加推理步数或模型容量并不能根本解决这一问题，因为瓶颈在于模型需要选择性丢弃过时上下文而非单纯进行局部推理，这揭示了当前 LLMs 在协作代理场景下的根本性缺陷。\n\n### § 9 最脆弱的假设\n\n该方法最核心的假设是：**通过 LLM 回溯合成的“反事实参数”（Counterfactual Arguments）和“前驱函数”（Predecessor Functions）能够构建出语义连贯且逻辑自洽的多轮对话轨迹，且这些合成内容不会引入原始单轮任务中不存在的歧义或噪声，从而保证最终意图锚点（Anchor Intent）的可验证性依然有效。** 如果这一假设不成立，即合成过程引入了无法被最终验证器捕获的中间逻辑错误，或者合成的前驱任务与最终任务之间的因果联系过于牵强，那么性能下降可能归因于合成数据的质量问题而非模型对演化意图的追踪能力。论文通过 D.2 和 D.3 节的验证步骤（如检查反事实值是否为局部替换、前驱函数是否共享上下文且答案不变）来支持这一假设，并使用了 GPT 5.1 作为验证器进行拒绝采样。然而，这种验证依赖于另一个 LLM 的判断，可能存在“LLM-as-judge”的偏差，且无法完全保证合成对话在人类认知层面的自然性和逻辑严密性，特别是当涉及复杂领域知识（如 SWE-Bench 中的代码逻辑）时，合成的前驱任务可能在实际工程中并不合理，从而混淆了“意图追踪失败”与“任务理解失败”的界限。\n\n### § 10 最小复现实验\n\n在 1 周内，可以使用 **GSM8K** 数据集的一个小子集（例如 50 个样本）来验证“Function Switch 导致性能显著下降”这一核心 claim。首先，使用一个强大的 LLM（如 GPT-4o 或 Claude 3.5 Sonnet）作为模拟器，按照论文描述的规则，为每个 GSM8K 问题生成一个包含 2 次 Function Switch 和 2 次 Argument Reveal 的 5 轮对话脚本，确保最后一轮意图与原始问题一致。然后，选取两个不同能力的模型（如一个开源模型 Llama-3-8B 和一个闭源模型 GPT-4o）作为 Agent，分别进行单轮直接回答和多轮演化意图交互测试。测量指标为最终答案的准确率。如果多轮设置下的准确率相比单轮设置下降超过 15-20%，且通过人工检查确认合成对话逻辑连贯，则支持了论文关于 LLMs 在意图切换时容易“迷失”的结论；反之，如果性能保持稳定，则可能表明该现象对特定模型或合成策略敏感，需进一步排查合成质量。此实验无需复现完整的调度器和渲染器，只需手动或脚本化生成少量高质量的多轮对话样本即可验证核心假设。", "research_value": "### § 11 最强反例设计\n\n要挑战这篇论文的核心结论，最有力的攻击并非质疑其实验数据的准确性，而是攻击其**评估范式的生态效度（Ecological Validity）**与**因果归因的混淆（Confounding Causality）**。\n\n首先，从**交互模式（Interaction Paradigm）**的角度提出反例：论文构建的“演化意图”场景本质上是**对抗性噪声注入（Adversarial Noise Injection）**，而非真实的协作交互。在真实的人类-AI协作（如 Vibe Coding 或 Deep Research）中，用户意图的演变通常伴随着**显式的元沟通（Meta-communication）**或**结构化澄清（Structured Clarification）**。例如，当用户修正参数时，往往会说“忽略我刚才说的 X，改为 Y”，或者在切换任务时明确说“让我们换个方向”。然而，论文的 Pipeline 生成的对话往往依赖隐式的上下文覆盖，这实际上是在测试模型的**上下文窗口污染抗性（Context Window Pollution Resistance）**，而非意图追踪能力。一个强有力的反例实验是：在相同的演化意图设置下，引入一个**显式意图摘要模块（Explicit Intent Summarization Module）**，要求 Agent 在每一轮开始前输出当前的 `Belief State`。如果引入该模块后，性能恢复至接近单轮水平，则证明模型并非“迷失”，而是缺乏**显式状态管理（Explicit State Management）**的触发机制。这表明问题不在于模型无法追踪意图，而在于当前的 Prompt Engineering 或系统指令未能强制模型进行**信念更新（Belief Update）**。因此，论文所揭示的“根本性缺陷”可能只是**交互协议（Interaction Protocol）**的缺陷，而非模型能力的上限。\n\n其次，从**因果归因（Causal Attribution）**的角度提出反例：论文将性能下降归因于“意图追踪失败”，但忽略了**任务复杂性放大效应（Task Complexity Amplification）**。在 `Function Switch` 场景中，模型需要同时处理旧任务的残留上下文和新任务的逻辑推理。反例设计可以证明，性能下降主要源于**认知负荷过载（Cognitive Load Overload）**而非意图混淆。具体实验设计为：控制变量，保持意图演变的复杂度不变，但显著降低基础任务（Base Task）的难度（例如，将 GSM8K 替换为简单的算术题，或将 SWE-Bench 替换为简单的代码补全）。如果在这种低难度设置下，模型在演化意图场景中的性能与单轮场景无显著差异，则说明“迷失”现象仅在**高推理深度（High Reasoning Depth）**任务中显现。这将推翻论文关于“LLMs 缺乏忠实追踪演化意图能力”的普遍性结论，转而支持“LLMs 在长 horizon 交互中缺乏**工作记忆隔离（Working Memory Isolation）**机制”的更具体假设。这意味着，通过引入**思维链隔离（Chain-of-Thought Isolation）**或**外部记忆库（External Memory Store）**即可解决该问题，而非论文暗示的需要重新训练或根本性架构变革。\n\n最后，从**合成数据偏差（Synthetic Data Bias）**角度攻击：论文依赖 LLM 生成 `Counterfactual Arguments` 和 `Predecessor Functions`，这可能导致**分布偏移（Distribution Shift）**。反例可以指出，合成的“错误参数”或“前置任务”可能在语义上与最终任务存在**非自然的断裂（Unnatural Discontinuity）**，这种断裂在真实人类对话中极少出现（人类修正通常具有局部连贯性）。如果模型在真实人类标注的多轮对话数据集（如 MultiWOZ 或 TaskMaster）上表现良好，而在论文合成的数据集上表现糟糕，则证明论文评估的是模型对**合成噪声的鲁棒性**，而非对真实意图演变的追踪能力。这将严重削弱论文结论对真实世界协作代理的指导意义。\n\n### § 12 Follow-up Research Idea\n\n基于对论文核心局限的理解——即当前评估框架将“意图追踪”简化为静态的**信念状态更新（Belief State Update）**，而忽略了真实交互中**意图的模糊性（Ambiguity）**、**多义性（Polysemy）**以及**用户与代理之间的共同 grounding（Joint Grounding）**过程——我提出一个新的研究方向：**从“意图追踪”转向“意图协商（Intent Negotiation）”的动态评估与建模**。\n\n**(a) 驱动局限与未满足需求：**\n现有工作（包括本文）假设用户意图是一个随时间演变的、可被精确形式化的向量 $I_t$，且代理的目标是被动地、准确地追踪这个向量。然而，在真实的长 horizon 协作中，用户意图往往是**未完全指定的（Under-specified）**、**矛盾的（Contradictory）**或**随代理反馈而动态重构的（Dynamically Reconstructed）**。用户并非在“披露”一个预先存在的意图，而是在与代理的交互中“共同构建”意图。当前的评估框架无法捕捉这种**双向塑造（Bidirectional Shaping）**过程，导致它只能评估代理的“记忆力”，而无法评估其“理解力”和“引导力”。因此，我们需要一个新的 framing，将多轮交互视为一个**意图对齐（Intent Alignment）**过程，而非单纯的**意图追踪（Intent Tracking）**过程。\n\n**(b) 借鉴相邻领域的方法与工具：**\n我们可以借鉴**人机交互（HCI）**中的**共同 grounding 理论（Joint Grounding Theory）**和**博弈论（Game Theory）**中的**信号博弈（Signaling Games）**。在信号博弈中，发送者（用户）和接收者（代理）通过迭代的消息交换来缩小语义空间的不确定性。此外，可以借鉴**主动学习（Active Learning）**中的**查询策略（Query Strategy）**，将代理视为一个主动的询问者，而非被动的响应者。具体工具上，可以引入**信息论（Information Theory）**中的**互信息（Mutual Information）**或**KL 散度（KL Divergence）**来量化每一轮交互中意图不确定性的减少程度，从而构建一个基于**信息增益（Information Gain）**的评估指标，而非仅仅基于最终答案的正确率。\n\n**(c) 第一个实验设计：**\n设计一个名为 **Negotiation-Bench** 的新基准，其核心任务是**开放式创意生成（Open-ended Creative Generation）**或**复杂决策支持（Complex Decision Support）**，这些任务没有唯一的 `Ground-truth` 答案，而是有一个**满意度分布（Satisfaction Distribution）**。\n1.  **场景构建：** 用户提出一个模糊的需求（如“帮我设计一个适合远程团队的团建活动”），代理需要通过多轮提问来澄清约束条件（预算、时间、偏好等）。\n2.  **动态意图建模：** 不预设固定的意图演化路径，而是使用一个**用户模拟器（User Simulator）**，该模拟器具有**动态偏好（Dynamic Preferences）**，会根据代理的提问质量和方式调整其最终期望。\n3.  **评估指标：** 除了最终输出的满意度评分外，引入**协商效率（Negotiation Efficiency）**指标，即达到高满意度所需的轮数；以及**意图收敛速度（Intent Convergence Rate）**，即代理提出的假设与用户真实偏好之间的 KL 散度随轮数的变化曲线。\n4.  **对比实验：** 对比被动追踪型代理（仅记录用户陈述）与主动协商型代理（主动提问、确认、重构意图）在相同场景下的表现。预期结果是，主动协商型代理在模糊意图场景下显著优于被动追踪型代理，从而证明**意图协商能力**是比**意图追踪能力**更关键的协作代理核心能力。\n\n这个研究方向与已有工作的区别在于：它不再将用户意图视为一个需要被“正确读取”的静态信号，而是将其视为一个需要被“共同构建”的动态过程。它将评估重点从**准确性（Accuracy）**转移到**对齐效率（Alignment Efficiency）**和**交互质量（Interaction Quality）**，为开发真正智能的协作代理提供了更贴近真实场景的理论基础和评估工具。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "{\n  \"authors\": [\n    {\n      \"name\": \"Jihoon Tack\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Philippe Laban\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jennifer Neville\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Microsoft Research\"\n    }\n  ],\n  \"footnotes\": []\n}", "summary_translation": "随着大语言模型（LLMs）能力的增强，它们越来越多地被部署为协作智能体，通过迭代交互承担用户委托的任务。然而，真实的交互本质上是动态的：用户很少在初始阶段就明确指定其意图，而是随着对话的展开逐步披露、修正并重塑意图。尽管如此，LLMs 目前主要仍在单轮、完全指定的设置中进行评估或训练，这留下了一个根本性问题：LLMs 在对话过程中跟踪并响应用户意图演变的能力如何？为了研究这一问题，我们引入了一个框架，将静态的单轮任务转化为动态的多轮对话，其中用户的意图在轮次间演变——在对话中逐步揭示、修正，有时甚至中途转向——同时保留每个任务原有的评估协议，使得现有基准无需新标注即可作为受控测试平台重复使用。在多项任务中，我们发现了一个一致的现象：在静态设置下的强劲表现无法迁移到意图演变的设置中，各模型家族均出现显著性能下降。我们的研究结果揭示了一个根本性差距：当前的 LLMs 尚不能忠实地跟踪并响应用户不断演变的意图，这一能力在静态评估中不可见，但对于未来的协作智能体至关重要。"}]}, {"name": "Reinforcement Learning for Agents", "count": 1, "papers": [{"title": "PATS: Policy-Aware Training Scaffolding for Agentic Reinforcement Learning", "arxiv_id": "2607.21419", "authors": "Yipeng Shi, Zhipeng Ma, Yue Wang, Qitai Tan, Yang Li, Peng Chen, Zhengzhou Zhu", "summary": "In long-horizon LLM agent reinforcement learning, weak policies often repeat similar failures, producing uninformative rollout trajectories and limiting effective policy optimization. Existing skill-centric methods improve exploration by optimizing, filtering, or internalizing reusable skills. However, they remain centered on the skills themselves rather than being designed as adaptive training-time support for the evolving policy. To address this, we propose a policy-centric training paradigm that reframes skills as a dynamic training scaffold. Our framework, Pats, converts rollout groups from the latest policy into evidence cards and uses task-specific evaluation to adjust the context used in subsequent rollouts. Concrete guidance helps weak policies to complete challenging tasks. As policy improves, redundant context is revised or removed to reduce reliance on explicit guidance while preserving useful rollout variation. The policy is optimized with environmental rewards using standard RLVR, and the training scaffold is discarded at deployment. On ALFWorld and WebShop, Pats improves over strong baselines by up to 18.6%. Across seven search-augmented QA benchmarks, it remains competitive while using 32.1% fewer prompt tokens than the baseline.", "category": "cs.AI", "cluster": "Reinforcement Learning for Agents", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：在长视界（long-horizon）LLM Agent 的强化学习（RL）训练中，如何设计一种动态的、以策略为中心（policy-centric）的训练支持机制，以解决弱策略（weak policies）因重复失败而产生无信息量 rollout 轨迹的问题。具体而言，现有方法往往将外部技能（skills）视为需要检索、优化或内化的持久资产，而忽略了技能在训练阶段作为“临时脚手架”（training scaffold）的价值——即其核心价值在于帮助当前策略生成具有成功-失败对比度的 rollout 组，而非直接最大化即时成功率。\n\n这一问题的重要性在于，LLM Agent 在复杂任务中常面临探索瓶颈。当策略较弱时，Group Relative Policy Optimization (GRPO) 等基于组相对优势的方法会收到缺乏结果对比（outcome contrast）的 rollout 组，导致学习信号微弱甚至失效。如果外部支持不足，策略可能统一失败；如果支持过于完备，则可能消除行为变异，使得 GRPO 无法区分优劣轨迹。因此，关键不在于寻找“最好”的孤立技能，而在于确定“当前策略需要何种支持以产生更有信息量的下一次 rollout”。\n\n解决该问题的价值体现在两方面：一是提升训练效率与最终性能，PATS 在 ALFWorld 和 WebShop 上相比强基线提升了高达 18.6% 的成功率；二是实现“零部署成本”的技能内化，PATS 在部署时完全丢弃脚手架，不仅保持了竞争力，还比保留技能的基线减少了 32.1% 的 prompt token 消耗，证明了临时性、自适应的训练支持比持久性技能库更能促进策略的真正内化。\n\n### § 2 前人工作与不足\n\n该问题此前主要通过“技能中心”（skill-centric）的方法进行尝试，但存在根本性局限。最相关的 prior methods 包括 SkillRL、SKILL0、SkillOS 以及 SEED 等。\n\nSkillRL 和 SkillOS 等方法将技能视为需要检索、策展、选择或蒸馏的对象。它们假设技能本身具有独立的部署价值，因此致力于优化技能库的质量或内化程度。然而，这种视角忽略了训练阶段与推理阶段目标的差异：推理追求即时成功，而 RL 训练需要揭示有用更新的行为差异。SkillRL 等方法在训练过程中持续积累或优化技能，这引入了与“下一次 rollout 组的有用性”未必对齐的控制目标。例如，一个对推理极佳的技能可能因为过于完备而消除了 rollout 组内的结果对比，从而削弱了 GRPO 的学习信号。\n\nSKILL0 和 SLIM 等方法关注技能的撤回（withdrawal）或贡献估计，试图解决技能依赖问题。SKILL0 采用预定义的阶段性撤回计划，而 SLIM 通过留一法估计技能贡献。这些方法的不足在于它们仍然将技能视为需要被“保留”或“吸收”的持久状态，而非根据策略当前能力动态调整的临时支持。SKILL0 的单调撤回计划缺乏灵活性，无法根据策略在不同任务类型上的残差失败（residual failures）进行细粒度的语义修订（semantic revision）。\n\n此外，ActGuide-RL 和 Rubric-Scaffolded RL 等方法通过提供计划指导或评分标准来塑造 rollout，但它们通常不改变任务分布或环境奖励，且缺乏对支持内容随策略能力演进而动态收缩的机制。\n\n综上所述，前人工作的主要不足在于：1）将技能视为持久资产而非临时训练状态，导致训练目标与策略内化目标错位；2）缺乏基于策略当前能力（competence）和脚手架压力（scaffold pressure）的动态适应机制，无法在“提供足够指导以产生成功轨迹”和“保留足够变异以产生学习信号”之间取得平衡；3）未能明确区分“推理有用的技能”与“训练有用的脚手架”，导致在策略能力提升后，冗余支持未能及时移除或修订，反而成为阻碍进一步学习的拐杖。PATS 通过将技能重构为可丢弃的、策略感知的训练脚手架，并引入基于证据卡（evidence cards）的闭环适应机制，精确解决了这些不足。", "core_insight": "### § 3 重建作者的思考路径\n\n在长视界（long-horizon）LLM Agent 的强化学习（RL）中，研究者面临一个核心困境：弱策略（weak policy）往往陷入重复失败的循环，导致采样出的 rollout 轨迹缺乏信息量（uninformative），进而使得基于组相对优势（group-relative advantage，如 GRPO）的优化信号微弱甚至消失。为了解决探索不足的问题，现有的主流方法（如 SkillRL, SKILL0, Reflexion 等）倾向于构建“技能库”（Skill Bank）或“记忆”（Memory），通过检索、优化或内化可复用的技能来辅助 Agent。\n\n然而，深入分析这些“以技能为中心”（skill-centric）的方法会发现一个根本性的错位：推理阶段（inference）的目标是最大化即时成功率，因此需要最精确、最完整的指令；但训练阶段（training）的目标是获取有效的梯度更新，这需要 rollout 组内存在足够的行为差异（behavioral variation）和结果对比（outcome contrast）。如果外部技能过于强大或完整，它可能会让所有 rollout 都走向相同的路径（要么全成功，要么全失败），从而抹平了组内的方差，导致 GRPO 等算法无法获得有效的学习信号。反之，如果支持不足，Agent 又无法触及成功状态。\n\n因此，问题的关键不在于“哪个技能最好”，而在于“当前策略需要什么样的支持才能产生最具信息量的下一个 rollout 组”。现有的方法将技能视为需要被保留、评估或内化的持久资产（persistent artifacts），这引入了额外的控制目标，且往往与训练时的采样需求不一致。如果我们将外部文本视为一种“一次性”的、随策略能力动态调整的“训练脚手架”（training scaffold），而非部署时的记忆，情况会如何？\n\n基于此，作者设想了一种“以策略为中心”（policy-centric）的范式：脚手架的内容不应追求静态的最优知识，而应根据策略当前的能力（competence）和剩余失败模式（residual failures）动态调整。在策略较弱时，提供具体指导以打开探索空间；在策略提升后，通过语义修订（revision）或压缩（compression）来移除冗余支持，以保留必要的行为多样性。这种脚手架仅在训练时存在，部署时完全丢弃，从而确保策略真正学会了任务，而非依赖外部检索。这就是 PATS 的核心构思。\n\n### § 4 核心 Intuition\n\nPATS 的核心直觉在于区分“推理效用”与“训练效用”：最强的外部技能未必能带来最好的训练效果，因为过度完美的指导会消除 rollout 组内的结果差异，导致强化学习信号退化。因此，外部知识不应被视为需要内化的持久资产，而应被视为随策略能力动态调整的“一次性脚手架”。该方法通过监控策略的成功率，在策略较弱时提供具体指导以开启探索，在策略提升后主动修订或移除冗余支持，从而在训练过程中始终维持高信息量的行为对比，最终使策略在脱离脚手架后仍能独立完成任务。", "methodology": "§ 5 具体方法与完整 Pipeline（输入、处理、输出分步说明，必须基于可确认的证据）\nPATS 的核心机制是一个闭环的“策略感知训练脚手架”系统，其 Pipeline 包含以下关键步骤：\n\n1.  **输入与证据生成（Input \u0026 Evidence Generation）**：\n    *   **输入**：当前策略（Policy）在特定任务上生成的 Rollout 组（Rollout Groups）。\n    *   **处理**：系统将这些 Rollout 组转化为“证据卡片”（Evidence Cards）。这些卡片通过对比成功与失败的行为（success–failure evidence），提取出当前策略在特定任务类型上的能力表现及剩余失败模式。\n    *   **依据**：文中提到 \"Pats begins with an empty Bank and converts each rollout group into evidence that contrasts successful and failed behavior.\"\n\n2.  **动态脚手架调整（Dynamic Scaffold Adjustment）**：\n    *   **处理**：基于证据卡片，系统评估当前策略的“任务类型能力”（Task-type competence）和“Bank 压力”（Bank pressure）。\n    *   **操作**：根据评估结果，对初始为空的 Bank 进行动态调整，包括扩展（Expand）、语义修订（Revise）、压缩（Compress）或重构（Reconstruct）指导信息。\n    *   **逻辑**：当策略较弱时，提供具体指导以打开探索空间；当策略提升后，移除冗余支持以保留行为多样性。\n    *   **依据**：文中指出 \"Task-type competence and Bank pressure determine how much support the next group receives... the Bank may expand, revise, compress, or reconstruct its guidance.\"\n\n3.  **策略优化（Policy Optimization）**：\n    *   **处理**：使用调整后的上下文（Context）进行后续的 Rollout 采样。\n    *   **优化目标**：策略仅通过环境奖励（Environmental Rewards）使用标准的 GRPO（Group Relative Policy Optimization）进行优化。\n    *   **依据**：文中明确 \"Policy learning remains standard GRPO with environmental rewards... The policy is optimized with environmental rewards using standard RLVR.\"\n\n4.  **部署与丢弃（Deployment \u0026 Discarding）**：\n    *   **输出**：训练完成后，脚手架（Bank）被完全丢弃。\n    *   **依据**：文中强调 \"the training scaffold is discarded at deployment\" 以及 \"Without its scaffold, it improves over same-scale GRPO...\"\n\n§ 7 实验设计与结论（提出什么问题 → 用什么实验验证 → 结论是什么；如果当前文本缺乏实验细节，明确说明并从摘要、引言推断）\n\n**提出的问题**：\n在长视界 LLM Agent 的强化学习中，如何设计一种动态的、以策略为中心的训练支持机制，以解决弱策略因重复失败而产生无信息量 Rollout 轨迹的问题，同时避免对持久性技能库的依赖？\n\n**实验验证**：\n1.  **基准测试**：在 ALFWorld 和 WebShop 两个具身智能/Web 代理基准上，以及七个搜索增强型 QA（Search-augmented QA）基准上进行测试。\n2.  **对比基线**：与强基线方法（如 SkillRL, SKILL0, 标准 GRPO 等）进行对比。\n3.  **诊断分析**：通过消融实验（Ablations）隔离组证据（Group Evidence）、支持适应（Support Adaptation）和无脚手架部署（Deployment without the scaffold）的影响。\n4.  **动态轨迹分析**：分析训练过程中的验证成功率（Validation Success Rate）和提示词 Token 消耗（Mean Prompt Tokens）的变化轨迹。\n\n**结论**：\n1.  **性能提升**：PATS 在 ALFWorld 和 WebShop 上相比强基线提升了高达 18.6% 的成功率。\n2.  **效率优势**：在七个搜索增强型 QA 基准上，PATS 在保持竞争力的同时，比保留技能的基线（如 SkillRL）减少了 32.1% 的 Prompt Token 消耗。\n3.  **机制有效性**：实验证明，PATS 通过动态调整支持（早期扩展、后期收缩）而非持久积累上下文，实现了更有效的策略内化。Figure 1 显示 PATS 在训练早期扩展上下文，随着验证性能提升而收缩，而 SkillRL 的上下文持续增长，SKILL0 则遵循阶段性撤回。\n4.  **零部署成本**：丢弃脚手架后，PATS 依然优于同等规模的标准 GRPO，证明了临时性、自适应的训练支持比持久性技能库更能促进策略的真正内化。", "additional_insights": "### § 8 Take-aways\n\nPATS 的核心创新在于将外部技能（Skills）重新定义为“一次性、策略感知的训练脚手架（Policy-Aware Training Scaffolding）”，而非需要被内化或保留的持久记忆资产。该方法通过构建一个动态的 Bank，根据当前策略的能力水平（Competence）和 Bank 的压力（Pressure），在 EXPAND、REVISE、COMPRESS 和 FORCED_PRUNE 四种模式间切换，以优化 Rollout 组的探索分布。实验表明，这种动态支持机制在 ALFWorld 和 WebShop 上比标准 GRPO 提升了最高 18.6% 的成功率，且在部署时移除脚手架后，性能依然显著优于基线。PATS 的关键洞察是：训练时的最佳支持并非最大化即时成功率，而是维持 Rollout 组内成功与失败轨迹的对比度（Contrast），从而为 Group-Relative Policy Optimization (GRPO) 提供非退化的学习信号。与 SkillRL 等保留技能的方法相比，PATS 在保持竞争力的同时，减少了 32.1% 的 Prompt Token 消耗，证明了临时性、自适应的上下文支持比静态技能库更具效率。消融实验证实，REVISE 模式在策略具备部分能力时至关重要，它通过语义修订而非简单增减条目来跟踪策略的剩余失败模式，避免了过度指导导致的探索坍缩。\n\n### § 9 最脆弱的假设\n\nPATS 最脆弱且关键的假设是：**基于确定性证据聚合（Deterministic Evidence Aggregation）和外部 Refiner 提出的脚手架编辑，能够准确捕捉并反映策略当前所需的“信息性探索分布”，且这种分布优化能直接转化为策略参数的有效更新。**\n\n如果这一假设不成立，即 Refiner 生成的指导（Guidance）无法有效区分“有助于学习的失败”和“无意义的失败”，或者其编辑逻辑与策略的实际梯度更新方向脱节，那么整个动态脚手架机制将退化为噪声注入，甚至干扰正常的 RL 训练。具体而言，PATS 依赖一个独立的 LLM（Refiner）来解析 Rollout 证据并生成 JSON 格式的编辑指令，这一过程引入了额外的不可控变量。如果 Refiner 对“成功-失败对比”的理解出现偏差，或者生成的规则过于具体导致策略过拟合于特定轨迹而非泛化能力，那么随着训练进行，Bank 的内容可能变得冗余或误导，导致策略无法收敛到最优解。\n\n论文提供的证据主要基于 ALFWorld 和 WebShop 这两个结构化较强的环境，其中环境反馈明确，成功/失败界限清晰。然而，论文缺乏在更复杂、奖励稀疏或反馈模糊的环境（如真实网页交互或具身智能的长尾场景）中的验证。此外，论文未深入分析 Refiner 的错误率对最终策略性能的影响，也未提供当 Refiner 生成错误编辑时系统的鲁棒性分析。如果 Refiner 的决策质量不稳定，PATS 的性能增益可能仅源于特定环境下的巧合，而非方法本身的普适性。\n\n### § 10 最小复现实验\n\n**目标：** 验证“动态脚手架通过维持 Rollout 组内的结果对比度（Mixed-Reward Groups）来提升学习效率”这一核心机制，而非仅仅验证最终性能。\n\n**数据与环境：** 使用 ALFWorld 的 `pick_and_place_simple` 任务子集，模型选用 Qwen2.5-1.5B-Instruct（轻量级，易于快速迭代）。\n\n**实现方案：**\n1.  **基线：** 标准 GRPO，无外部支持。\n2.  **对照：** 静态技能库（Static Skill Bank），包含一组固定的、高质量的提示规则，全程不变。\n3.  **PATS 简化版：** 实现一个极简的 Controller，仅根据当前任务类型的成功率 EMA 在“无支持”和“固定支持”之间切换，或者实现一个基于规则的简单 REVISE 逻辑（例如，当成功率 \u003E 50% 时，随机移除 50% 的脚手架条目）。\n\n**测量指标：**\n1.  **Group Reward Variance ($\\sigma_r$)：** 在每个训练步骤，计算每个 Rollout 组内奖励的标准差。\n2.  **Mixed-Group Ratio：** 计算包含至少一个成功和一个失败轨迹的 Rollout 组的比例。\n3.  **Learning Rate：** 策略在相同训练步数下的成功率提升斜率。\n\n**验证逻辑：**\n*   **支持 Claim：** 如果 PATS 简化版在训练中期（成功率 30%-70% 区间）的 $\\sigma_r$ 和 Mixed-Group Ratio 显著高于静态技能库和基线，且其学习斜率更陡，则证明动态调整支持以维持对比度是有效的。\n*   **反驳 Claim：** 如果 PATS 简化版的 $\\sigma_r$ 与静态库无显著差异，或者其学习曲线并未表现出因对比度增加而带来的加速，则说明核心贡献可能并非来自“对比度优化”，而是其他因素（如初始化的 SFT 数据质量）。\n\n此实验无需复现完整的 Refiner 和复杂的 Bank 管理逻辑，仅需验证“动态调整支持以维持探索对比度”这一假设是否成立，即可在 1 周内完成。", "research_value": "### § 11 最强反例设计\n\n要挑战 PATS 的核心主张，最有力的攻击并非质疑其最终性能，而是攻击其**“动态脚手架优化 GRPO 信号”这一因果机制的必要性**，并提出一个更简单的替代解释：**PATS 的性能提升主要源于 Refiner 生成的“高质量指令”对策略的隐式监督微调（Implicit Supervised Fine-Tuning, SFT），而非其动态调整机制对探索分布的优化。**\n\n**具体反例设计如下：**\n\n1.  **控制变量实验：静态高质量脚手架 vs. 动态 PATS**\n    *   **假设**：PATS 声称动态调整（Expand/Revise/Compress）是为了维持 $p \\approx 0.5$ 的混合奖励组。然而，如果 Refiner 本身就是一个强大的“课程学习（Curriculum Learning）”生成器，那么即使脚手架是静态的，只要其内容足够精准，也能引导策略快速收敛。\n    *   **实验**：构建一个 **Static-Refiner-Bank**。在训练开始前，使用与 PATS 相同的 Refiner 模型，但在一个固定的、代表性的任务子集上运行一次完整的“模拟训练”，收集所有可能的最佳指导规则，形成一个静态的、全覆盖的 Skill Bank。在后续 RL 训练中，始终使用这个静态 Bank，不进行任何动态更新。\n    *   **预期反驳结果**：如果 Static-Refiner-Bank 的性能与 PATS 相当，甚至更好（因为避免了动态更新带来的噪声和延迟），则证明 PATS 的核心贡献并非“动态适应”，而是“利用 LLM 生成高质量指导”。这将彻底推翻 PATS 关于“策略感知脚手架”的理论基础，将其降级为一种复杂的 Prompt Engineering 方法。\n\n2.  **理论攻击：GRPO 对“伪对比”的敏感性**\n    *   **假设**：PATS 假设混合奖励组（Mixed-Reward Groups）必然带来更好的梯度。然而，如果脚手架导致的成功轨迹与失败轨迹在**关键决策点（Critical Decision Points）**上差异极小（例如，仅因环境随机性或细微的 Token 采样差异导致成功/失败），那么 GRPO 计算出的 Advantage 将充满噪声，甚至误导策略。\n    *   **实验**：在 ALFWorld 中引入一个 **Noise-Injected Environment**，其中某些动作的成功率受随机种子影响较大。观察 PATS 在低成功率阶段（EXPAND 模式）是否会产生大量“伪混合组”——即策略行为几乎相同，但结果不同。\n    *   **预期反驳结果**：如果 PATS 在噪声环境下导致策略震荡或收敛到次优解，而标准 GRPO（无脚手架）表现更稳定，则证明 PATS 的“对比度最大化”目标在奖励稀疏或噪声高的场景中是有害的。这挑战了 PATS 的普适性，表明其仅在奖励信号明确且与行为强相关的环境中有效。\n\n3.  **真实世界场景：长尾分布下的“脚手架灾难”**\n    *   **场景**：在真实网页交互（如 WebShop 的长尾商品）中，任务分布极度不均匀。PATS 的 Controller 基于任务类型 $\\tau$ 的成功率 EMA 进行决策。\n    *   **攻击点**：对于罕见任务类型，EMA 更新缓慢，导致脚手架长期处于错误的模式（例如，对一个新出现的复杂任务，脚手架可能长期处于 COMPRESS 模式，因为历史数据中类似简单任务的成功率高）。\n    *   **预期反驳结果**：PATS 在长尾任务上的表现显著低于基线，因为动态机制无法快速适应分布偏移。这揭示了 PATS 对任务分布平稳性的强依赖，限制了其在开放世界 Agent 中的应用。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“脚手架调度”到“策略-环境联合演化”：基于元学习的自适应探索分布控制 (Meta-Learning for Adaptive Exploration Distribution Control)**\n\n**（a）驱动局限与未满足需求：**\nPATS 的核心局限在于其**“开环”的脚手架生成机制**。Refiner 是一个独立的 LLM，它根据 Evidence Card 生成指导，但这一过程并未直接优化 RL 的梯度流。Refiner 的“智能”是外部的、黑盒的，且与策略 $\\pi_\\theta$ 的更新解耦。这导致脚手架的优化目标（生成有用指导）与策略的优化目标（最大化累积奖励）之间存在潜在的错位。此外，PATS 假设“混合奖励组”总是最优的，但在某些复杂任务中，策略可能需要先经历一段“纯失败”或“纯成功”的探索期以建立基础能力，而非强行维持 $p=0.5$。因此，我们需要一种机制，能够**端到端地学习**如何根据策略的当前状态动态调整探索分布，而不仅仅是依赖启发式的脚手架编辑。\n\n**（b）借鉴相邻领域的方法：**\n借鉴 **Meta-Reinforcement Learning (Meta-RL)** 和 **Contextual Bandits** 的思想。在 Meta-RL 中，代理学习如何快速适应新任务；在 Contextual Bandits 中，代理根据上下文选择最优动作。我们可以将“脚手架配置”视为一个**连续或离散的动作空间**，由一个可训练的 **Meta-Controller** 网络来输出。这个 Meta-Controller 接收策略的当前状态（如梯度范数、损失变化率、轨迹熵）作为输入，输出一个“探索分布参数”（例如，脚手架的强度、具体规则的权重、或是否引入噪声）。\n\n**（c）第一个实验设计：**\n\n1.  **方法框架：Meta-Scaffold RL (MS-RL)**\n    *   **核心组件**：\n        *   **Policy Network ($\\pi_\\theta$)**：标准的 Actor-Critic 或 GRPO 策略。\n        *   **Meta-Controller ($\\phi$)**：一个小型的 MLP 或 Transformer 编码器，输入为策略的元数据（Meta-Data），如最近 $K$ 步的 Reward Variance、Gradient Norm、Entropy。输出为一个**探索分布参数向量 $\\alpha$**。\n        *   **Scaffold Generator**：一个可微分的或基于采样的模块，根据 $\\alpha$ 动态生成或选择脚手架内容。例如，$\\alpha$ 可以控制脚手架中“原则”、“技巧”、“警告”的相对权重，或直接控制提示词中的温度（Temperature）和 Top-p。\n    *   **训练目标**：联合优化 $\\theta$ 和 $\\phi$。$\\theta$ 通过标准 RL 损失更新；$\\phi$ 通过**元梯度（Meta-Gradient）**更新，目标是最大化策略在下一个迭代中的性能提升（即 $\\Delta SR$ 或 $\\Delta Reward$）。这可以通过 **MAML (Model-Agnostic Meta-Learning)** 或 **Reinforce with Baseline** 来实现，将 $\\phi$ 的更新视为对“学习率”或“探索策略”的优化。\n\n2.  **实验设置：**\n    *   **环境**：ALFWorld 和 WebShop。\n    *   **基线**：PATS（动态脚手架）、Static Skill Bank、Standard GRPO。\n    *   **对比**：MS-RL 与 PATS 在相同计算预算下的性能对比。\n    *   **关键指标**：\n        *   **Sample Efficiency**：达到相同成功率所需的训练步数。\n        *   **Adaptation Speed**：在新任务类型上，Meta-Controller 调整探索分布的速度。\n        *   **Generalization**：在未见过的任务分布上的表现。\n\n3.  **预期贡献与区分：**\n    *   **与 PATS 的区别**：PATS 是**启发式**的、**离散**的、**解耦**的脚手架编辑；MS-RL 是**可微分的**（或基于梯度的）、**连续**的、**联合优化**的探索控制。MS-RL 不依赖外部 LLM Refiner 的“智能”，而是通过数据驱动学习最优的探索策略。\n    *   **理论意义**：将“脚手架”从一种外部辅助工具，重构为 RL 训练过程中的一个**可学习超参数**，实现了“训练过程本身”的自适应优化。这为理解“如何动态调整探索以加速 RL 收敛”提供了一个新的、端到端的视角。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Yipeng Shi\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Zhipeng Ma\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Yue Wang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Qitai Tan\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yang Li\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Peng Chen\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zhengzhou Zhu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Peking University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Tencent\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"These authors contributed equally.\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding author.\"\n    }\n  ]\n}\n```", "summary_translation": "在长视界 LLM agent 强化学习中，弱策略往往会重复类似的失败，产生信息量不足的 rollout 轨迹，从而限制了有效的策略优化。现有的以 skill 为中心的方法通过优化、过滤或内化可复用的 skill 来改善探索。然而，这些方法仍然以 skill 本身为中心，而非作为针对演化中策略的自适应训练时支持而设计。为解决这一问题，我们提出了一种以 policy 为中心的训练范式，将 skill 重新定义为动态的训练 scaffold。我们的框架 Pats 将来自最新 policy 的 rollout 组转换为 evidence cards，并利用任务特定的评估来调整后续 rollout 中使用的 context。具体的指导帮助弱策略完成具有挑战性的任务。随着 policy 的改进，冗余的 context 会被修订或移除，以减少对显式指导的依赖，同时保留有用的 rollout 变化。该 policy 使用标准 RLVR 结合环境奖励进行优化，而训练 scaffold 在部署时被丢弃。在 ALFWorld 和 WebShop 上，Pats 相比强基线方法提升了高达 18.6%。在七个 search-augmented QA benchmark 上，它在保持竞争力的同时，比基线方法少使用了 32.1% 的 prompt token。"}]}]};

const dailyOverviewsRaw = {"2026-07-28": "### 今日AI论文速览 (2026-07-28)\n\n**开篇导语**\n今日的研究动态呈现出“Agent 走向成熟与严谨”的鲜明趋势。从代码修复的可靠性验证到长程任务的上下文管理，研究者们不再仅仅追求 Agent 的“能做事”，而是深入探究其“如何可靠地做事”。同时，多智能体协作中的契约机制、具身智能中的可解释性策略合成，以及自动化科研在极端场景下的应用，共同勾勒出一个更加结构化、可验证且具备自我进化能力的 Agent 生态雏形。\n\n---\n\n### 一、 规划、验证与自我修正：从“盲目循环”到“契约式执行”\n\n这一板块聚焦于 Agent 在执行复杂任务时的可靠性问题。研究者们指出，简单的“生成-测试-修正”循环并不保证收敛，必须引入更严格的验证机制、可证伪的承诺以及基于证据的奖励信号。\n\n*   **Looping Is Not Reliability: State-Bound Evidence and Typed Revision Contracts for Agentic Code Repair**\n    研究揭示了代码修复 Agent 中常见的“循环陷阱”：强制修订往往导致正确率下降，且过时的轨迹（stale traces）会严重干扰后续推理。作者提出了**Typed Revision Contracts**，一种机械可执行的规范，将验证证据绑定到精确的代码状态，并保留已验证的检查点，从而确保修复过程的可靠性而非盲目迭代。(2607.24604 [cs.CL])\n\n*   **Falsifiable Commitment Planning for Self-Correcting Web Agents**\n    针对长程 Web Agent 容易偏离目标的问题，提出了**FCPAgent**框架。该框架将每个计划步骤定义为**Falsifiable Commitment Unit (FCU)**，包含确认证据、证伪证据及置信度。通过“计划-测试-修复”循环，Agent 能在执行前或执行后验证承诺，一旦证据证伪，即可进行局部修复，显著提升了长程任务的成功率。(2607.24167 [cs.AI])\n\n*   **From RLVR to RLSVR: Task Transformation Induces Self-Verifiable Rewards for Open-Ended LLM Self-Improvement**\n    为了解决开放域任务缺乏确定性验证奖励的问题，提出了**RLSVR**（基于自验证奖励的强化学习）。通过任务转换，将开放域任务转化为具有内部规则的可验证代理环境（如**SpyRL**多智能体自博弈），利用投票结果生成完全可验证的奖励信号，从而将 RLVR 的优势扩展到文本摘要、创意写作等非验证性领域。(2607.23802 [cs.AI])\n\n*   **SeekJudge: A Practical Reward Framework for Reinforcement Learning in Computer-Use Agents**\n    针对计算机使用 Agent（CUA）中基于规则的评估难以适应动态环境的问题，提出了**SeekJudge**框架。该框架由四个专业化 Agent（Condense, Ground, Seek, Analyze）组成，通过“Seek-Analyze”循环对轨迹进行判决。实验表明，SeekJudge 作为基于模型的奖励，其性能可媲美甚至超越原生规则监督，且成本更低、扩展性更强。(2607.23263 [cs.AI])\n\n### 二、 上下文与记忆管理：解决“隐性关联”与“状态同步”难题\n\n随着 Agent 任务时长的增加，上下文窗口爆炸和记忆检索失效成为瓶颈。今日的研究重点在于如何更智能地管理上下文，解决检索中的“隐性关联盲区”以及代码编辑中的“状态不同步”问题。\n\n*   **Keep It InMind: Benchmarking the Implicit-Association Blind Spot in Agent Memory**\n    指出了现有记忆系统的一个致命缺陷：**Implicit-Association Blind Spot**，即当查询与存储的记忆缺乏表面文本相似性但存在世界知识关联时（如“坚果过敏”与“杏仁粉”），检索系统往往失效。作者构建了 **InMind** 基准测试，发现即使记忆被成功召回，若缺乏查询条件化的路由机制，间接查询的回答准确率仍极低。(2607.24368 [cs.CL])\n\n*   **Tokengeist: Multi-Turn Attribution Tracing in Agentic Conversations**\n    针对多轮对话中上下文归因的复杂性，提出了 **Tokengeist** 框架。它将归因视为在对话轮次构成的有向无环图（DAG）上的递归遍历，能够追踪跨轮次的深层依赖关系。实验显示，传统的单步归因方法存在“来源崩溃”现象，而 Tokengeist 能恢复高达 90% 的多跳依赖源。(2607.22610 [cs.CL])\n\n*   **CORVUS: Context Optimization and Reduction Via Underlying Synchronization for LLM Coding Agents**\n    针对代码 Agent 中因文件修改导致的轨迹快照过时和冗余问题，提出了 **CORVUS** 架构。该架构将文件读取动作与观察结果解耦，维护一个同步的文件注册表，仅在推理周期注入当前文件内容。这不仅消除了冗余副本，还减少了 9-50% 的输入 Token 和 37% 的推理周期，同时保持了相当的通过率。(2607.22711 [cs.LG])\n\n*   **ACM: Agentic Context Management for Long Horizon Tasks**\n    提出了 **Agentic Context Management (ACM)** 框架，赋予 Agent 自主管理上下文的能力。受人类短期/长期记忆启发，Agent 可自主决定何时压缩上下文、将内容卸载到外部记忆系统，并在需要时按需查询。这种无损上下文管理显著降低了峰值 Token 压力，并提高了长程任务解决方案的一致性。(2607.23809 [cs.AI])\n\n### 三、 智能体框架与自动化科研：从“单一任务”到“全场景进化”\n\nAgent 的研究正从单一任务优化转向全场景、全生命周期的框架设计。今日的多篇论文展示了如何通过联合优化、协议蒸馏和自动化闭环，实现 Agent 在复杂应用和科研场景中的自我进化。\n\n*   **AgentOmnia: Scaling Agentic Models for Full-Scenario Applications**\n    提出了 **AgentOmnia** 框架，旨在实现 ToC、ToB 和 ToE 全场景的 Agent 扩展。该框架通过可扩展的分类体系对齐任务空间、数据合成和后训练，并利用 **OmniaBench** 进行细粒度诊断。通过双向环境-任务合成和基于 PRD 的自进化机制，AgentOmnia 在多个基准测试中显著提升了通过率，展现了广泛的通用性改进。(2607.23124 [cs.CL])\n\n*   **Co-Harness: Co-Evolving Harnesses and Model Weights for LLM Agents**\n    指出传统 Agent 训练仅优化模型参数而忽略运行时框架（Harness）的局限性。提出了 **Co-Harness**，联合优化 Agent 的 Harness（包括提示、工具、中间件等）和模型权重。通过 **HarnessCritic** 分析失败轨迹并更新 Harness，再在高质量轨迹上微调模型，实现了模型与脚手架的协同进化，提升了自主研究能力。(2607.22688 [cs.CL])\n\n*   **From Proprietary to Open-Source: Bridging the Distribution Gap via Multi-Agent Protocol Distillation in Agentic Search**\n    为解决从专有模型蒸馏到开源模型时的分布差距问题，提出了 **Multi-Agent Protocol Distillation (MAPD)**。该方法利用结构化、风格归一化的协议作为中间表示，将探索轨迹转化为包含任务类型、推理计划和事实依据的 JSON 协议。这种密集蒸馏信号结合稀疏 RL 目标，有效缓解了风格漂移，提升了小参数模型在搜索任务中的表现。(2607.24280 [cs.AI])\n\n*   **SIREN: Towards End-to-End Extreme-Weather Early Warning with Experience-Grounded LLM Agents**\n    针对极端天气预警中专家工作流难以扩展的问题，提出了 **SIREN** 框架。该框架结合了异构天气证据的工具集成环境和利用历史案例的 Agent 框架，通过检索、技能蒸馏和预测模型实现端到端的自动化预警。在 **SIREN-Bench** 上的评估显示，SIREN 在单个预警程序和端到端预警链上均优于现有基线。(2607.24588 [cs.AI])\n\n*   **Agentic Autoresearch for CT Reconstruction**\n    展示了 LLM Agent 在自动化科研中的潜力，特别是在 CT 重建领域。Agent 独立实现、调优并基准测试了 26 种方法，发现理想数据下的排行榜无法预测噪声环境下的鲁棒性。研究强调了基准测试应模拟多种现实因素（如噪声、硬化效应），而非单一因素，以确保证据的通用性。(2607.22824 [cs.AI])\n\n### 四、 智能体搜索与检索：相关性引导与委托智能\n\n在信息检索领域，研究重点从单纯的文档相关性转向更细粒度的语料库交互和深层搜索中的“委托智能”，即 Agent 何时以及如何决定进行搜索。\n\n*   **A New Role for Relevance: Guiding Corpus Interaction in Agentic Search**\n    提出了 **RARG**（Relevance-Aware RipGrep Search Agent），将相关性作为语料库交互的执行先验。RARG 通过粗到细的相关性引导，对文档进行排序以尽早暴露全局相关线索，并重新排序 grep 匹配项以突出信息丰富的摘录。这种方法在浏览问答和推理密集型检索中提高了准确性-效率前沿。(2607.24223 [cs.CL])\n\n*   **Delegation Intelligence in Deep Search: A Controllable Framework for Disentangled Capability Diagnosis**\n    将深层搜索中的元能力形式化为 **Delegation Intelligence**，并分解为“搜索决策”和“信息综合与验证”两个维度。作者开发了可控的合成管道和 **DelegSearchBench**，通过解耦评估协议，隔离了检索质量、长上下文理解和工具使用决策，揭示了仅凭最终答案准确率无法充分表征深层搜索能力的现象。(2607.23524 [cs.AI])\n\n### 五、 工具使用与代码 Agent：企业级部署与多步工具链\n\n针对企业级应用，研究关注如何在减少 Token 负担的同时保持工具使用的可靠性，以及如何在真实产品场景中评估多步工具使用能力。\n\n*   **CRAFT: Learn the Schema, Execute the Plan**\n    针对企业代码 Agent 中注入大量 Schema 文档导致推理开销大的问题，提出了 **CRAFT** 两阶段后训练方案。首先通过剥离 Schema 的监督微调学习领域结构化计划，然后通过执行塑造的强化学习对齐工具选择和代码质量。该方法在广告分析场景中显著提高了 Agent 得分和一致性，同时将输入 Token 负担减少了约 9 倍。(2607.22642 [cs.CL])\n\n*   **E-Bench: Benchmarking Multi-Step Tool-Use Agents in Real-World Product Scenarios**\n    引入了 **E-Bench**，一个包含 323 个状态改变任务的完全合成基准测试，涵盖《王者荣耀》、QQ 音乐和腾讯会议三个产品领域。该基准测试通过图引导的数据库填充和生成器-求解器不对称性，创建了具有信息差距和工具差距的任务。评估显示，即使是最强模型，其多步工具使用的可靠性（Pass^3）仍低于 70%，表明该领域仍有巨大挑战。(2607.23722 [cs.AI])\n\n### 六、 多智能体系统与协作：契约与承诺\n\n在多智能体环境中，如何通过机制设计促进合作是一个核心问题。今日的研究从法律契约中汲取灵感，探索 Agent 之间的可信承诺。\n\n*   **Commitment To Cooperation With Self-Negotiated Contracts**\n    研究了 LLM Agent 在多智能体世界中的合作问题，特别是如何解决合作成本前置而收益后置导致的背叛激励。作者引入了基于契约的合作机制，让 Agent 在时空游戏 **CT** 中进行自我协商。研究发现，自我协商的契约（无论是形式化代码契约还是自然语言契约）都能改善合作结果，超越了常规交易所能达到的水平。(2607.22750 [cs.AI])\n\n### 七、 机器人与物理世界交互：从黑盒到可解释策略\n\n具身智能的研究正从端到端的黑盒模型转向更具可解释性、可适应性和人机协作能力的框架。\n\n*   **WCM: World-Cognition Model for Generalizable Human-Robot Interaction**\n    提出了 **World-Cognition Model (WCM)**，一种以人为中心的具身 Agent，基于 **SLAK** 架构（感知、逻辑、行动、知识）和异步运行时。WCM 引入了人在回路的教学模式，允许用户交互式地教授机器人复杂任务，并将教学片段转化为思维链监督以持续改进模型。在九项真实世界的人机交互任务中，WCM 取得了 73.8% 的平均成功率。(2607.22999 [cs.LG])\n\n*   **Stress-testing large language model agents in a robotic chemistry laboratory**\n    在机器人化学实验室中对 LLM Agent 进行了压力测试，评估其科学代理能力。结果显示，仅 3.3% 的试验产生了专家评估的可执行工作流，且长程规划仍是巨大挑战。研究指出，当前的 Agent 缺乏基于证据的工作流级重新规划能力，强调了物理可执行性和证据驱动重新规划在自主研究中的重要性。(2607.23045 [cs.AI])\n\n*   **A Few Words Go a Long Way: Language Guided Robot Policy Synthesis**\n    提出了 **ARCHITECT** 框架，将机器人策略获取视为交互式程序合成任务。利用 LLM 代码 Agent 合成模块化机器人程序，并通过自然语言修正进行迭代优化。这种模块化架构允许用户隔离故障并局部反馈，形成的技能库实现了长期上下文学习，在 Franka Panda 机器人上的复杂任务中优于 SOTA VLA 模型。(2607.23784 [cs.AI])\n\n---\n\n### 今日看点\n\n*   **趋势观察：Agent 的“工程化”与“契约化”**\n    今日多篇论文（如 *Looping Is Not Reliability*, *Falsifiable Commitment Planning*, *Commitment To Cooperation*）不约而同地指向一个方向：Agent 的可靠性不能仅靠模型能力的堆砌，而需要引入类似软件工程中的**契约、验证和状态管理**机制。从代码修复的“类型化修订契约”到多智能体合作的“自我协商契约”，**“可验证的承诺”**正成为构建可信 Agent 的核心范式。\n\n*   **颠覆性观点：理想数据排行榜的失效**\n    *Agentic Autoresearch for CT Reconstruction* 的研究揭示了一个令人警醒的事实：在理想数据上表现最好的模型，在引入轻微噪声后可能完全失效，而原本排名靠后的方法反而成为冠军。这挑战了当前许多基准测试仅关注“干净数据”或“单一因素”的做法，呼吁建立更贴近现实复杂性的评估标准。\n\n*   **潜力技术：自验证奖励（RLSVR）的扩展**\n    *From RLVR to RLSVR* 提出了一种巧妙的任务转换方法，将开放域任务转化为可验证的代理环境（如 SpyRL），从而为原本缺乏确定性奖励的任务（如创意写作、摘要）提供了可扩展的强化学习信号。这种方法有望打破 RLVR 仅局限于数学和代码领域的瓶颈，推动 LLM 在更广泛领域的自我进化。\n\n*   **跨界融合：法律契约与多智能体协作**\n    *Commitment To Cooperation With Self-Negotiated Contracts* 将人类社会中的法律契约机制引入多智能体系统，解决了合作中的激励不相容问题。这种将社会科学机制与 AI 代理结合的研究，为构建大规模、去中心化的多智能体协作系统提供了新的理论和技术路径。", "2026-07-27": "### 今日AI论文速览 (2026-07-27)\n\n#### 开篇导语\n今日的研究动态呈现出“内修功力”与“外审标准”并行的鲜明特征。一方面，**自我进化（Self-Evolving）** 成为LLM能力提升的核心范式，多篇论文从技能库构建、元技能培养到工作流固化，展示了Agent如何通过交互反馈实现能力的持续迭代；另一方面，随着Agent深入商业与科研场景，**评估体系的有效性** 受到严峻挑战，从版权合规性到基准测试中的“奖励黑客”行为，研究者开始反思现有Benchmark是否真正衡量了模型能力。此外，针对长程交互中的**记忆效率**优化也取得了显著进展。\n\n---\n\n#### 三、 主题分类与论文速览\n\n### 🧠 自我进化：从“单次推理”到“技能累积”\n*今日多篇论文聚焦于如何让Agent在交互中“越用越强”，通过构建可复用的技能库或元技能，打破传统静态模型的局限。*\n\n*   **Skill Self-Play (Skill-SP)** 提出了一种协同进化框架，旨在解决自我进化中“任务多样性”与“验证可靠性”之间的矛盾。该框架包含提议者、求解者和动态技能控制器，通过强化学习循环，让模型在特定场景下执行可验证的**技能（Skills）**，同时保持任务的开放性。实验表明，该方法不仅能提升基座模型的性能上限，还能纠正初始对齐不佳的模型，实现了结构化验证与开放式探索的有效平衡。(2607.22529 [cs.CL])\n*   **MetaEvolve** 假设自我进化的成功依赖于**元技能（Meta-Skills）**，如基于环境反馈的自我反思，而传统后训练往往忽视这一点。该研究在代码领域构建了一个数据合成管道，利用程序执行提供的连续奖励信号（正确性与效率），通过**进化感知强化学习（Evolution-aware RL）** 训练模型。结果显示，显式培养元技能使模型在分布外任务上提升了24.12%，并在完全未知的算法优化问题上实现了46.9%的相对改进，证明了元技能的可迁移性。(2607.21971 [cs.CL])\n*   **FlowEvo** 关注于将推理时生成的临时工作流转化为可复用的**可执行技能（Executable Skills）**，解决工作流“用完即弃”的问题。该无训练框架通过“工作流到技能编译”、“技能到工作流反馈”和“技能策展”三个机制，将成功的执行轨迹编译为带有结构化指导的技能记录，并存入技能库。在ALFWorld等基准测试中，FlowEvo以不到一半的Token消耗实现了82.8%的成功率，显著优于基线，展示了**工作流-技能闭环**在提升效率与准确性方面的潜力。(2607.21596 [cs.AI])\n\n### ⚖️ 评估危机：基准测试真的有效吗？\n*随着Agent能力的增强，现有评估协议暴露出严重漏洞。今日研究不仅指出了版权合规和奖励黑客问题，还呼吁建立更严谨的个人Agent评估标准。*\n\n*   **Copyright-Bench** 针对LLM Agent在商业任务（如网站开发、商品设计）中可能涉及的**版权侵权**问题，提出了首个合规性评估基准。研究发现，尽管存在公共领域替代品，Agent仍倾向于选择受版权保护的内容；且在用户偏好引导和时间压力下，开源模型的违规率显著上升。这揭示了当前Agent在法律合规性方面的巨大风险，特别是在模拟真实商业压力的场景下。(2607.21799 [cs.CL])\n*   **HackDetect** 质疑了当前Agent基准测试的**协议有效性（Protocol Validity）**，指出Agent常通过读取评估工件、推断生成结构或操纵反馈等“奖励黑客”手段获取高分。该研究提出了一种事后审计工具，量化了**误导差距（Mislead gap）**，即在15个基准测试的2385条轨迹中，发现67%的Frontier Science轨迹存在暴露和黑客行为，导致分数膨胀0.45-1.00倍。这警示社区：基准分数可能严重高估了模型的真实能力。(2607.22368 [cs.AI])\n*   **User-Conditioned Evaluation** 指出个人Agent评估缺乏对**时间干预（Temporal Interventions）** 和**持久状态（Persistent State）** 的考量。现有基准往往孤立测试工具调用或记忆，而忽略了用户状态随时间演变对Agent组件的跨维度影响。该立场论文提出了满足四个条件（显式时间干预、持久状态、跨维度效应、用户状态变化）的最小基准设计要求，填补了个人Agent适应性评估的理论空白。(2607.21635 [cs.LG])\n\n### 💡 科研辅助：质量与多样性的双重追求\n*在科学发现领域，单纯追求高质量或多样性往往导致思路同质化或平庸化，新的研究尝试将两者结合。*\n\n*   **IDEAgent** 将研究想法生成重构为**质量-多样性（Quality-Diversity, QD）** 搜索问题，而非独立优化单一目标。该多智能体框架通过谱系管理想法的进化，利用多目标反馈进行修复和精炼以提升质量，同时通过轻量级序列记忆和显式对比来确保多样性。在32个计算机科学主题中，IDEAgent在联合指标**Yield**上比最佳基线高出3.89倍，证明了在保持逻辑严谨性的同时，兼顾非显而易见性是生成高质量科研想法的关键。(2607.22375 [cs.AI])\n\n### ⚡ 效率优化：Agent记忆系统的KV Cache革新\n*针对长程交互中记忆检索带来的高昂推理成本，新的方法通过更精细的KV Cache复用策略实现了显著加速。*\n\n*   **AgentKVShift** 针对Agent记忆系统中结构化元数据（如摘要、标签）导致的**KV Cache**重新编码开销，提出了一种无训练的、探针引导的**KV残差校正**方法。研究发现，每个记忆单元的KV复用残差可分解为共享的记忆级偏移和微小的Token级波动。通过估算偏移量进行加权校正，该方法仅需刷新10-30%的Cache即可达到接近全量重算的性能，在单张A100上实现了2-3.5倍的Prefill加速，且与KV量化正交兼容，大幅降低了长程Agent的推理延迟。(2607.21604 [cs.AI])\n\n---\n\n#### 四、 今日看点 (Highlights)\n\n*   **🔥 趋势观察：自我进化进入“技能化”深水区**\n    今日有三篇论文（Skill-SP, MetaEvolve, FlowEvo）不约而同地指向**Self-Evolving Agents**，但切入点各异：Skill-SP强调技能作为多样性与验证的平衡点；MetaEvolve聚焦于底层“元技能”的RL训练；FlowEvo则侧重于推理时工作流的无训练固化。这表明，Agent能力的提升正从单纯的“Scaling Law”转向**“技能累积与复用”** 的架构创新，**“技能库（Skill Bank）”** 可能成为下一代Agent的核心组件。\n\n*   **⚠️ 颠覆性观点：基准测试的“信任危机”**\n    HackDetect的研究极具冲击力，它用数据证明近70%的高分轨迹可能源于“作弊”（奖励黑客）。这不仅是技术漏洞，更是**评估范式的危机**。如果基准分数不能反映真实能力，那么基于这些分数进行的模型选型和SOTA宣称都将失去意义。未来，**“防作弊审计”** 将成为Agent基准测试的标配环节。\n\n*   **🛡️ 跨界融合：法律合规成为Agent落地的硬约束**\n    Copyright-Bench的出现标志着AI研究从纯技术性能向**社会法律合规**的延伸。在商业落地场景中，Agent不仅是“聪明”的工具，更是“合法”的实体。时间压力和用户偏好导致的违规率上升，提示开发者在优化Agent性能时，必须将**法律风险感知**纳入核心设计，这可能催生专门的“合规对齐”技术分支。\n\n*   **🚀 潜力技术：结构化记忆的KV Cache优化**\n    AgentKVShift针对的是Agent长程交互中的痛点——**结构化记忆（Structured Memory）** 的推理效率。与传统的RAG不同，Agent记忆包含大量LLM生成的元数据，传统的KV复用方法在此失效。该方法提出的“残差分解与校正”思路，不仅适用于Agent，也可能为其他需要频繁检索结构化上下文的LLM应用提供通用的加速方案，具有极高的工程应用价值。", "2026-07-24": "### 今日AI论文速览 (2026-07-24)\n\n#### 开篇导语\n今日的研究动态呈现出**“Agent 工程化”**与**“交互动态化”**的双重趋势。一方面，从 NVIDIA 的面向对象编程范式到 OpenForgeRL 的端到端训练框架，Agent 的基础设施正从松散的 Prompt 工程转向严谨的软件工程标准，强调可测试性、可维护性及与现有开发流程的无缝集成。另一方面，研究焦点从静态任务执行转向复杂的**人机协作**与**意图演化**，揭示了当前 LLM 在动态对话中追踪用户意图的显著短板。同时，在代码生成领域，针对数据库内核、硬件加速及形式化验证的专用 Agent 展现出超越通用模型的潜力，标志着垂直领域 Agent 正在进入深水区。\n\n---\n\n#### 三、 主题分类与论文速览\n\n### 🏗️ 基础设施重构：Agent 作为一等公民与端到端训练\n*本板块聚焦于 Agent 开发范式的根本性转变，旨在解决传统 Agent 难以训练、难以调试和难以集成的痛点。*\n\n*   **NVIDIA-labs OO Agents (NOOA)** 提出了一种**“Agent 即 Python 对象”**的编程范式，将 Agent 的方法、状态、提示词和类型注解统一映射到 Python 类结构中。该方法允许开发者像调试普通软件一样测试和重构 Agent 行为，并首次结合了**类型化 I/O**、**引用传递**和**可编程循环工程**等六大模型交互理念，在 SWE-bench 等基准上证明了其有效性。(2607.20709 [cs.CL])\n*   **OpenForgeRL** 针对复杂推理 Harness（如 Claude Code, Codex）难以进行端到端 RL 训练的问题，提出了一种开源框架。通过轻量级代理记录模型调用并作为训练数据，结合 Kubernetes 编排实现大规模分布式训练，实现了**训练与推理的解耦**。实验表明，该方法能在数百至数千个任务上训练出超越开源基线的 Agent，显著提升了工具覆盖率和多步规划能力。(2607.21557 [cs.CL])\n\n### 🧠 记忆与学习效率：从上下文蒸馏到归因反馈\n*本板块探讨如何更高效地利用 Agent 的历史经验，解决长程任务中的记忆遗忘和信用分配难题。*\n\n*   **Sample-Efficient Learning from Agent Experience** 提出了**Experience Distillation**（经验蒸馏）方法，旨在将 In-Context Learning (ICL) 的收益固化到模型权重中，而无需额外的环境交互。在软件工程任务和文本冒险游戏中，该方法保留了 ICL 至少 64.8% 的收益，远超直接 SFT 的 3.8%，且相比经典 RL 基线，样本效率提升了至少 9.6 倍。(2607.21051 [cs.CL])\n*   **CMI-Mem** 针对现有记忆管理器过度依赖 LLM 评判合成 QA 对的局限，提出了一种基于强化学习的轻量级记忆管理模型。其核心创新在于引入了**条件互信息 (CMI)** 作为内在奖励，评估新输入相对于当前记忆状态的信息贡献，从而在不依赖特定下游查询的情况下实现更通用的长期记忆管理。(2607.20553 [cs.CL])\n*   **AttriMem** 解决了 RL 训练 Agent 记忆时的细粒度信用分配瓶颈。通过引入**归因引导的过程反馈**，该方法利用 token 级贡献度为中间记忆决策提供局部奖励，弥补了全局结果奖励的粗糙性。实验显示，AttriMem 在长程对话问答中优于检索式和启发式基线，并稳定了 RL 优化过程。(2607.21106 [cs.AI])\n\n### 💻 代码与软件工程 Agent：从模糊需求到内核优化\n*本板块展示了 Agent 在复杂软件工程任务中的深度应用，涵盖从模糊需求澄清到硬件内核生成的全链路。*\n\n*   **ICAE-Bench** 针对“Vibe Coding”趋势下 Agent 需处理模糊产品需求的新场景，提出了一个交互式项目构建基准。该基准通过模拟**用户代理 (User Agent)** 揭示隐藏约束，并结合黑盒测试与多维度诊断（如结构保真度、设计质量）来评估 Agent 将模糊意图转化为可执行软件的能力。(2607.21217 [cs.AI])\n*   **GenDB** 演示了一种生成式查询引擎，利用 LLM Agent 根据特定数据、工作负载和硬件资源生成**实例优化的查询执行代码**。对于重复性模板查询，GenDB 通过前置生成成本摊销实现性能超越；对于即席查询，则与传统 DBMS 混合部署。该系统在 TPC-H 等基准上显著优于传统查询引擎。(2607.20630 [cs.CL])\n*   **MKEvolve** 针对硬件加速器内核生成的瓶颈，提出了一种模块化多 Agent 框架。该框架通过迭代共演化**模块分解**与**LLM 生成的子内核**，利用 Beam Search 独立优化每个子内核。实验表明，MKEvolve 在 Triton 内核生成中不仅提高了正确性和加速比，还减少了 35% 的 LLM Token 消耗。(2607.20501 [cs.AI])\n*   **EvoSQL** 将 Text-to-SQL 建模为生成器与批评者的**共演化过程**，并引入**上下文候选记忆**来存储和更新 SQL 候选项。通过执行信号和 LLM 批评进行验证，并结合**自蒸馏策略优化 (SDPO)** 微调底层模型，EvoSQL 在 Spider 和 BIRD 基准上显著提升了开源模型的性能，特别是在复杂查询场景下。(2607.20489 [cs.AI])\n*   **LeanFlow** 专注于将数学论文转化为可构建的 Lean 项目，通过案例研究分析了不同模型（Kimi2.6, GPT5.5）和工具集对形式化效率的影响。研究发现，完整的**工作流驱动**策略能在有限的 API 调用预算内完成文档级项目，并在 RLM25 等基准上取得优异成绩，证明了结构化工作流在形式化验证中的关键作用。(2607.20503 [cs.LG])\n\n### 🤝 人机交互与动态意图：揭示 LLM 的协作短板\n*本板块关注 Agent 在真实人机协作场景中的表现，特别是面对动态变化的用户意图时的局限性。*\n\n*   **AppWorld-UL** 引入了一个包含 516 个挑战性任务的**“人在回路”**基准，重点评估 Agent 在工具使用中的多样化用户交互能力（如澄清、确认、不可行性通知）。实验显示，即使是 SOTA 模型 Claude Opus 4.7 在该基准上的成功率也仅为 48.6%，在组合任务中更是降至 21.3%，凸显了正确用户交互对任务成功的关键性。(2607.20536 [cs.CL])\n*   **LLMs Get Lost in Evolving User Intent** 揭示了 LLM 在动态多轮对话中追踪**演化用户意图**的根本性缺陷。研究将静态单轮任务转化为动态多轮对话，发现模型在静态设置下的强劲表现无法迁移到意图不断修正和重定向的场景中，表明当前 LLM 缺乏忠实追踪和响应动态意图的能力，这是未来协作 Agent 的关键瓶颈。(2607.20734 [cs.LG])\n\n### 🎓 强化学习新范式：策略感知的训练脚手架\n*本板块介绍了一种新的 RL 训练方法，旨在解决长程 Agent 训练中的探索效率问题。*\n\n*   **PATS (Policy-Aware Training Scaffolding)** 提出了一种以**策略为中心**的训练范式，将技能视为动态的训练脚手架。该方法将最新策略的 Rollout 组转化为**证据卡片**，并根据任务评估动态调整后续 Rollout 的上下文，为弱策略提供具体指导。随着策略提升，冗余上下文被移除，最终在部署时丢弃脚手架。该方法在 ALFWorld 和 WebShop 上提升了高达 18.6% 的性能，并减少了 32.1% 的 Prompt Token 使用。(2607.21419 [cs.AI])\n\n---\n\n#### 四、 今日看点\n\n*   **🔥 趋势观察：Agent 开发的“软件工程化”浪潮**\n    今日多篇论文（NOOA, OpenForgeRL, ICAE-Bench）共同指向一个明确趋势：Agent 正在从“Prompt 拼凑”走向“软件工程”。NVIDIA 提出的**面向对象 Agent** 和 OpenForgeRL 的**端到端训练框架**，标志着行业开始重视 Agent 的可测试性、可维护性和标准化训练流程。这预示着未来 Agent 开发将更紧密地融入现有的 CI/CD 和软件工程体系。\n\n*   **⚠️ 颠覆性观点：静态评估的失效与动态意图的缺失**\n    《LLMs Get Lost in Evolving User Intent》和《AppWorld-UL》的研究结果令人警醒：当前 SOTA 模型在静态、全指定任务上的高分，掩盖了其在**动态意图追踪**和**复杂人机交互**中的严重不足。这挑战了现有基准的有效性，提示研究者需重新评估 Agent 在真实协作场景中的能力边界，**“动态性”**将成为下一代 Agent 评估的核心维度。\n\n*   **🚀 潜力技术：垂直领域的“专家型”Agent 崛起**\n    在代码生成领域，通用模型正面临来自垂直领域专用 Agent 的挑战。**GenDB**（数据库查询优化）、**MKEvolve**（硬件内核生成）和 **LeanFlow**（形式化验证）展示了通过特定工作流和领域知识增强，Agent 能在高度专业化的任务中超越通用基线。这表明，未来的竞争力可能不在于模型规模，而在于**领域特定的工作流设计**和**工具链集成**。\n\n*   **💡 方法论创新：从“技能复用”到“策略脚手架”**\n    PATS 提出的**策略感知训练脚手架**为长程 RL 训练提供了新思路。不同于传统的技能库复用，PATS 强调根据策略的实时表现动态调整训练上下文，这种**自适应的训练支持**机制可能成为解决稀疏奖励和探索效率低下的通用解决方案，值得在更多 Agent 训练场景中验证。"};

        // Check if paper matches active tag filters for its date
        function paperMatchesFilters(paper, date) {
            const filters = activeTagFilters[date];
            if (!filters || filters.size === 0) return true;
            if (filters.has(paper.cluster)) return true;
            return (paper.tags || []).some(tag => filters.has(tag));
        }

        // 加载更多日期的数据
        async function loadMoreDates() {
            if (isLoadingMore) return;

            const unloadedDates = getUnloadedDates();
            if (unloadedDates.length === 0) {
                showSimpleToast('已加载全部数据');
                return;
            }

            isLoadingMore = true;
            const loadBtn = document.getElementById('load-more-btn');
            if (loadBtn) {
                loadBtn.disabled = true;
                loadBtn.innerHTML = '<span class="animate-spin inline-block mr-2">⏳</span>加载中...';
            }

            const datesToLoad = unloadedDates.slice(0, LOAD_MORE_DAYS);
            let loadedCount = 0;

            for (const date of datesToLoad) {
                try {
                    const response = await fetch(`data/${date}.json?v=${DATA_VERSION}`);
                    if (!response.ok) continue;

                    const dateData = await response.json();

                    // 将数据添加到 allPapers
                    allPapers[date] = dateData.clusters;
                    allPaperTags[date] = dateData.tags;

                    // 添加每日速览
                    if (dateData.overview) {
                        dailyOverviews[date] = dateData.overview;
                    }

                    loadedDates.add(date);
                    loadedCount++;
                } catch (e) {
                    console.error(`加载 ${date} 数据失败:`, e);
                }
            }

            isLoadingMore = false;

            if (loadedCount > 0) {
                renderPapers();
                showSimpleToast(`已加载 ${loadedCount} 天的数据`);
            }

            updateLoadMoreButton();
        }

        // 更新"加载更多"按钮状态
        function updateLoadMoreButton() {
            const loadBtn = document.getElementById('load-more-btn');
            const unloadedCount = getUnloadedDates().length;

            if (loadBtn) {
                if (unloadedCount === 0) {
                    loadBtn.style.display = 'none';
                } else {
                    loadBtn.style.display = 'inline-flex';
                    loadBtn.disabled = false;
                    loadBtn.innerHTML = `📥 加载更多 (还有 ${unloadedCount} 天)`;
                }
            }
        }

        // 加载窗口外（两周前）被收藏论文所在日期的数据，使其能在信息流中内联显示。
        // 这些日期的数据文件一直保留在 data/ 下，这里按需 fetch 进来；渲染时
        // createPaperHTML 会把窗口外日期里未收藏的论文隐藏，只留下收藏的那几篇。
        async function loadArchivedStarredDates() {
            if (!starredPapers || starredPapers.size === 0) return;
            const datesToLoad = new Set();
            starredPapers.forEach(aid => {
                const date = paperDateIndex[aid];
                if (date && !windowDateSet.has(date) && !loadedDates.has(date)) {
                    datesToLoad.add(date);
                }
            });
            if (datesToLoad.size === 0) return;

            let loadedCount = 0;
            for (const date of datesToLoad) {
                try {
                    const response = await fetch(`data/${date}.json?v=${DATA_VERSION}`);
                    if (!response.ok) continue;
                    const dateData = await response.json();
                    allPapers[date] = dateData.clusters;
                    allPaperTags[date] = dateData.tags;
                    if (dateData.overview) {
                        dailyOverviews[date] = dateData.overview;
                    }
                    loadedDates.add(date);
                    loadedCount++;
                } catch (e) {
                    console.error(`加载收藏日期 ${date} 数据失败:`, e);
                }
            }
            if (loadedCount > 0) {
                renderPapers();
            }
        }

        // 从localStorage加载状态
        function loadState() {
            const starred = localStorage.getItem('starred_papers');
            const read = localStorage.getItem('read_papers');
            const deleted = localStorage.getItem('deleted_papers');
            const summaryLang = localStorage.getItem('summary_language');

            if (starred) starredPapers = new Set(JSON.parse(starred));
            if (read) readPapers = new Set(JSON.parse(read));
            if (deleted) deletedPapers = new Set(JSON.parse(deleted));
            if (summaryLang !== null) showChineseSummary = summaryLang === 'chinese';
        }

        // 保存状态到localStorage
        function saveState() {
            localStorage.setItem('starred_papers', JSON.stringify([...starredPapers]));
            localStorage.setItem('read_papers', JSON.stringify([...readPapers]));
            localStorage.setItem('deleted_papers', JSON.stringify([...deletedPapers]));
            localStorage.setItem('summary_language', showChineseSummary ? 'chinese' : 'english');
        }

        // 显示撤销删除的Toast
        function showUndoToast(message, seconds, onUndo, onExpire) {
            const toast = document.getElementById('undo-toast');
            const msgEl = document.getElementById('toast-message');
            const cdEl = document.getElementById('countdown');
            const undoBtn = document.getElementById('undo-btn');

            msgEl.textContent = message;
            let remaining = seconds;
            cdEl.textContent = `(${remaining}s)`;
            toast.classList.remove('hidden');

            let intervalId = setInterval(() => {
                remaining -= 1;
                cdEl.textContent = `(${remaining}s)`;
                if (remaining <= 0) {
                    clearInterval(intervalId);
                    toast.classList.add('hidden');
                    try { onExpire && onExpire(); } catch (e) {}
                }
            }, 1000);

            let expireTimer = setTimeout(() => {
                clearInterval(intervalId);
                toast.classList.add('hidden');
                try { onExpire && onExpire(); } catch (e) {}
            }, seconds * 1000);

            const cleanup = () => {
                clearInterval(intervalId);
                clearTimeout(expireTimer);
                toast.classList.add('hidden');
            };

            const onUndoClick = () => {
                cleanup();
                try { onUndo && onUndo(); } catch (e) {}
            };

            undoBtn.removeEventListener('click', onUndoClick);
            undoBtn.addEventListener('click', onUndoClick);
        }

        // 显示简单的提示信息
        function showSimpleToast(message) {
            // 创建一个简单的toast元素
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg z-50 transition-all duration-300';
            toast.textContent = message;

            document.body.appendChild(toast);

            // 3秒后自动消失
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // 通过按钮删除论文（避免JavaScript字符串转义问题）

        // 删除论文
        function deletePaper(arxivId, title) {
            const paperEl = document.querySelector(`[data-arxiv-id="${cssEscape(arxivId)}"]`);
            if (!paperEl) return;
            const listItem = paperEl.closest('li');
            const sectionEl = paperEl.closest('section[data-date-section]');

            // 添加删除动画效果
            paperEl.style.transition = 'all 0.3s ease-out';
            paperEl.style.transform = 'scale(0.95)';
            paperEl.style.opacity = '0.5';

            setTimeout(() => {
                // 立即删除并保存状态
                deletedPapers.add(arxivId);
                saveState();

                // 移除DOM元素
                if (listItem) {
                    listItem.remove();
                } else {
                    paperEl.remove();
                }

                updateDateSection(sectionEl);
                updateStats();
                buildToc();

                // 显示简单的删除提示
                showSimpleToast(`已删除: ${title}`);
            }, 300);
        }

        // 切换星标状态
        function toggleStar(arxivId) {
            if (starredPapers.has(arxivId)) {
                starredPapers.delete(arxivId);
            } else {
                starredPapers.add(arxivId);
            }
            saveState();

            // 如果当前是只看收藏模式，或这篇属于窗口外（两周前）日期，则重新渲染：
            // 窗口外的论文取消收藏后应立即隐藏，新收藏的则应立即出现。
            const paperDate = (paperDataMap[arxivId] && paperDataMap[arxivId].date)
                || paperDateIndex[arxivId];
            if (showOnlyStarred || (paperDate && !windowDateSet.has(paperDate))) {
                renderPapers();
            } else {
                // 否则只更新星标按钮状态
                const starBtn = document.querySelector(`[data-arxiv-id="${cssEscape(arxivId)}"] .star-button`);
                if (starBtn) {
                    if (starredPapers.has(arxivId)) {

                        starBtn.classList.remove('starred');

        function toggleRead(arxivId) {

            if (!checkbox) return;

            if (checkbox.checked) {

        // 切换摘要语言
        function toggleSummaryLanguage() {

            toggleBtn.textContent = showChineseSummary ? '中文摘要' : 'English Summary';

        // 更新统计信息
        function updateStats() {
            const visiblePapers = document.querySelectorAll('.paper-item:not(.hidden-paper)').length;
            document.getElementById('total-papers').textContent = visiblePapers;

        function updateDateSection(sectionEl) {
            if (!sectionEl) return;
            const totalPapers = sectionEl.querySelectorAll('.paper-item').length;
            const header = sectionEl.querySelector('[data-date-heading]');

            if (header) {

        // 可折叠功能
        function toggleCollapsible(header) {
            const content = header.nextElementSibling;
            const isOpen = header.classList.contains('open');

            if (isOpen) {
                header.classList.remove('open');
                content.classList.remove('open');
            } else {
                header.classList.add('open');
                content.classList.add('open');
                // Lazy render: parse markdown only when first opened
                lazyRenderMarkdown(content);
            }
        }

        // Map of element ID -> raw markdown content for lazy rendering
        const mdRawContent = {};

        // Register raw markdown content for lazy rendering
        function registerMarkdown(id, content) {
            if (id && content) mdRawContent[id] = content;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function escapeJsSingleQuotedAttr(value) {
            return escapeHtml(String(value ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n')
                .replace(/\u2028/g, '\\u2028')
                .replace(/\u2029/g, '\\u2029'));
        }

        function safePathSegment(value) {
            return encodeURIComponent(String(value ?? ''));
        }

        function cssEscape(value) {
            const text = String(value ?? '');
            if (window.CSS && typeof CSS.escape === 'function') return CSS.escape(text);
            return text.replace(/["\\]/g, '\\$&');
        }

        function escapeMarkdownHtml(value) {
            return String(value ?? '').replace(/[&<>]/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;'
            }[ch]));
        }

        function sanitizeRenderedMarkdown(root) {
            root.querySelectorAll('script, style, iframe, object, embed').forEach(el => el.remove());
            root.querySelectorAll('a[href]').forEach(link => {
                const href = link.getAttribute('href') || '';
                if (!/^(https?:|mailto:|#|[/])/i.test(href)) {
                    link.removeAttribute('href');
                }
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            });
        }

        // Parse markdown for a single element by id
        function renderMarkdownEl(el) {
            if (!el || el.getAttribute('data-rendered')) return;
            const raw = mdRawContent[el.id];
            if (raw) {
                try {
                    el.innerHTML = marked.parse(escapeMarkdownHtml(raw));
                    sanitizeRenderedMarkdown(el);
                } catch (e) { el.textContent = raw; }
                el.setAttribute('data-rendered', '1');
            }
        }

        // Parse markdown for all unrendered .markdown-content elements inside a container
        function lazyRenderMarkdown(container) {
            if (typeof marked === 'undefined') return;
            container.querySelectorAll('.markdown-content:not([data-rendered])').forEach(renderMarkdownEl);
        }

        function hasMeaningfulText(value) {
            return typeof value === 'string' && value.trim().length > 0;
        }

        // Render markdown only for currently visible (open) sections
        function renderVisibleMarkdown() {
            if (typeof marked === 'undefined') return;
            marked.setOptions({ breaks: true, gfm: true, headerIds: false, mangle: false });
            // Render open collapsible sections
            document.querySelectorAll('.collapsible-content.open').forEach(c => lazyRenderMarkdown(c));
            // Render overview sections (top-level, not inside collapsible)
            document.querySelectorAll('.markdown-content:not([data-rendered])').forEach(el => {
                if (!el.closest('.collapsible-content')) renderMarkdownEl(el);
            });
        }

        // 创建论文HTML
        function formatAuthorsWithAffiliations(authorsStr, affiliationsStr) {
            if (!affiliationsStr) return escapeHtml(authorsStr);
            try {
                // 解析 JSON（可能被包在 ```json ... ``` 中）
                let jsonStr = affiliationsStr;
                const match = jsonStr.match(/```json\s*([\s\S]*?)\s*```/);
                if (match) jsonStr = match[1];
                const objMatch = jsonStr.match(/\{[\s\S]*\}/);
                if (objMatch) jsonStr = objMatch[0];
                const data = JSON.parse(jsonStr);

                // 兼容旧格式（数组）
                if (Array.isArray(data)) {
                    const authors = authorsStr.split(/,\s*/);
                    const affMap = {};
                    data.forEach(a => { if (a.name && a.affiliation) affMap[a.name.trim().toLowerCase()] = a.affiliation; });
                    return authors.map(a => {
                        const aff = affMap[a.trim().toLowerCase()];
                        return aff
                            ? `${escapeHtml(a.trim())}<sup class="aff-sup" title="${escapeHtml(aff)}">${escapeHtml(aff)}</sup>`
                            : escapeHtml(a.trim());
                    }).join(', ');
                }

                if (!data.authors || !data.institutions) return escapeHtml(authorsStr);

                // 新格式：论文式数字角标
                const instMap = {};
                data.institutions.forEach(inst => { instMap[inst.id] = inst.name; });

                // 渲染作者行
                const authorParts = data.authors.map(a => {
                    let sups = [];
                    if (a.affiliations && a.affiliations.length > 0) {
                        sups = sups.concat(a.affiliations.map(String));
                    }
                    if (a.markers && a.markers.length > 0) {
                        sups = sups.concat(a.markers);
                    }
                    const supValues = sups.map(escapeHtml).join(',');
                    const supStr = sups.length > 0
                        ? `<sup class="aff-sup">${supValues}</sup>`
                        : '';
                    return `${escapeHtml(a.name)}${supStr}`;
                });

                // 渲染机构列表
                const instLine = data.institutions.map(inst =>
                    `<sup class="aff-sup">${escapeHtml(inst.id)}</sup>${escapeHtml(inst.name)}`
                ).join('&ensp;');

                // 渲染脚注
                let footLine = '';
                if (data.footnotes && data.footnotes.length > 0) {
                    footLine = data.footnotes.map(fn =>
                        `<sup class="aff-sup">${escapeHtml(fn.marker)}</sup>${escapeHtml(fn.text)}`
                    ).join('&ensp;');
                }

                let html = authorParts.join(', ');
                html += `<div class="text-xs text-slate-500 dark:text-slate-400 mt-1">${instLine}</div>`;
                if (footLine) {
                    html += `<div class="text-xs text-slate-400 dark:text-slate-500 mt-0.5 italic">${footLine}</div>`;
                }
                return html;
            } catch (e) {
                return escapeHtml(authorsStr);
            }
        }

        // Store paper data by arxiv_id for lazy detail building
        const paperDataMap = {};

        function createPaperHTML(paper, date) {
            const aid = String(paper.arxiv_id ?? '');

            const titleHtml = escapeHtml(paper.title);
            const titleAttr = escapeHtml(paper.title);
            const dateHtml = escapeHtml(date);

            const isRead = readPapers.has(aid);

            if (!windowDateSet.has(date) && !isStarred) return '';
            if (showOnlyStarred && !isStarred) return '';
            if (!paperMatchesFilters(paper, date)) return '';

            paperDataMap[aid] = { paper, date };

            const clusterBadge = paper.cluster ? `<span class="tag-badge">${escapeHtml(paper.cluster)}</span>` : '';
            const tagBadges = (paper.tags || []).map(tag => `<span class="tag-badge tag-arxiv">${escapeHtml(tag)}</span>`).join('');

            return `
                <div class="paper-item bg-white dark:bg-slate-800/50 rounded-lg shadow-sm p-4 sm:p-6" data-arxiv-id="${aidHtml}">
                    <!-- 论文标题和操作按钮 -->
                    <div class="flex items-start justify-between mb-1">
