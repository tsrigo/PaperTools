stortion 的惩罚项，确保压缩后的低秩表示能够最大程度地保持目标行为效果，这构成了 DPC 的核心逻辑。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 在于：评估 agent 轨迹多样性的标准不应停留在数据语义或参数梯度层面，而应深入到模型在固定交互历史下的“决策表示变化”这一行为空间。通过在 behavior quotient geometry 中识别并降权那些引起等效决策变化的冗余轨迹更新，并在低秩压缩时显式惩罚对决策表示的扭曲，单个固定秩的 LoRA 便能突破容量瓶颈，有效吸收真正多样的 agent 行为。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n┌─────────────────────────────────────────────────────────────┐\n│                     BQ-LoRA Training Loop                    │\n│                                                             │\n│  Trajectories {τ₁..τ_N}                                     │\n│         │                                                   │\n│         ▼                                                   │\n│  ┌──────────────┐    Behavior Map Φ_T    ┌───────────────┐  │\n│  │ Compute task │───► (normalized ──────►│ Behavior      │  │\n│  │ directions   │    decision reprs)     │ Quotient      │  │\n│  │ U_i = -∇_X ℓ│                        │ Manifold M_T  │  │\n│  └──────────────┘                        └───────┬───────┘  │\n│         │                                       │          │\n│         │    Quotient tangent distances          │          │\n│         │    \u0026 Gaussian affinities ρ_i           │          │\n│         ▼                                       ▼          │\n│  ┌──────────────┐                        ┌───────────────┐  │\n│  │ BQB: Reweight│  w_i ∝ ρ_i^(-α)       │ DPC: Intrinsic│  │\n│  │ trajectories │──► U_BQ = Σ w_i·U_i ──►│ Projection    │  │\n│  │ by behavior  │                        │ onto T_X R_r  │  │\n│  │ density      │                        │ (tangent space│  │\n│  └──────────────┘                        │  of rank-r    │  │\n│                                           │  manifold)    │  │\n│                                           └───────┬───────┘  │\n│                                                   │          │\n│                                    Affine Target   │          │\n│                                    T_l = X_l +     ▼          │\n│                                    η·Proj(U_BQ,l)  │          │\n│                                           ┌───────────────┐  │\n│                                           │ DPC: Fixed-   │  │\n│                                           │ Rank Refactor │  │\n│                                           │ min‖Z-T‖²_F +  │  │\n│                                           │ γ‖DΦ_T(Z-T)‖² │  │\n│                                           └───────┬───────┘  │\n│                                                   │          │\n│                                    Compressed X⁺  │          │\n│                                    = s·B⁺A⁺       ▼          │\n│                                           ┌───────────────┐  │\n│                                           │ Updated LoRA  │  │\n│                                           │ Factors B⁺,A⁺│  │\n│                                           │ (rank ≤ r_l)  │  │\n│                                           └───────┬───────┘  │\n│                                                   │          │\n│                              ┌────────────────────┘          │\n│                              ▼                               │\n│                     (repeat for next batch)                  │\n│                                                             │\n│  Inference: single fixed-rank adapter deployed directly     │\n└─────────────────────────────────────────────────────────────┘\n```\n\n**Pipeline 步骤详解：**\n\n1. **输入与任务方向计算（§4.1）**：输入为 N 条 agent trajectories $\\mathcal{T}=\\{\\tau_i\\}_{i=1}^N$，每条轨迹包含任务 $x_i$、交互历史 $h_{ik}$、agent 输出 $y_{ik}$ 和环境反馈 $o_{ik}$。对每条轨迹计算 task direction $\\mathbf{U}_i = -\\nabla_{\\mathbf{X}} \\ell_i(\\mathbf{X})$，即在 effective-update space 中对任务损失求负梯度。当前模型参数为 LoRA effective update $\\mathbf{X} = (\\mathbf{X}_l)_{l=1}^L$，其中 $\\mathbf{X}_l = s_l \\mathbf{B}_l \\mathbf{A}_l$，rank 受限于 $r_l$。\n\n2. **Behavior Quotient Geometry 构建（§4.3）**：在固定的 reference decision histories 上，构造 behavior map $\\Phi_{\\mathcal{T}}(\\mathbf{X})$，它将 effective update 映射到所有 reference decision 的归一化表示向量。具体地，对每个 decision $a_{ik}$ 的每个生成位置 $t$，取前缀 $h_{ik,t}$（包含已记录的 reasoning 和先前 decision tokens），提取 final hidden representation $f_{\\mathbf{X}}(h_{ik,t})$，对所有位置、decision 和轨迹取平方响应的均值。两个 effective update 在此 map 下产生相同输出即定义为 behaviorally equivalent，形成 quotient manifold $\\mathcal{M}_{\\mathcal{T}} = \\mathcal{O}/\\sim_{\\mathcal{T}}$。Quotient tangent space 识别出在 reference decisions 上具有相同一阶响应的方向，即差异落在 $\\ker D\\Phi_{\\mathcal{T}}(\\mathbf{X})$ 中的方向对。\n\n3. **BQB: Trajectory Update Balancing（§4.3）**：将每条轨迹的 task direction $\\mathbf{U}_i$ 映射到 quotient tangent space，得到 behavior response $D\\Phi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{U}_i]$。通过 quotient metric 计算两两方向间的距离——该距离可直接从 behavior responses 计算，使用 Jacobian-vector products 而无需显式构造 quotient 坐标。基于这些距离，用 Gaussian affinities 累积每个方向周围的 overlap，得到 local density $\\rho_i$。权重设为 $w_i \\propto \\rho_i^{-\\alpha}$（$\\alpha \\in [0,1]$），归一化后 $\\sum_i w_i = N$。$\\alpha=0$ 退化为均匀加权；$\\alpha\u003E0$ 时，behaviorally redundant 的轨迹（高 $\\rho_i$）权重降低，distinct behavioral changes 获得更大相对影响。加权聚合得到 balanced direction $\\mathbf{U}_{BQ} = \\frac{1}{N}\\sum_i w_i \\mathbf{U}_i$。\n\n4. **DPC: Intrinsic Update Projection（§4.4）**：balanced direction $\\mathbf{U}_{BQ}$ 存在于 effective-update space 中，但 LoRA 通过 low-rank factors 改变权重，该方向可能包含 factors 无法一阶实现的部分。对每层 $l$，在 rank-$r_l$ 矩阵流形 $\\mathcal{R}_{r_l}$ 上，当前 iterate 的 tangent space 为 $T_{\\mathbf{X}_l}\\mathcal{R}_{r_l} = \\{\\mathbf{B}_l \\dot{\\mathbf{A}}_l + \\dot{\\mathbf{B}}_l \\mathbf{A}_l\\}$。用 Frobenius 正交投影将 $\\mathbf{U}_{BQ,l}$ 投影到该 tangent space，投影算子依赖 $\\mathbf{X}_l$ 的列空间和行空间（$\\mathbf{P}_l\\mathbf{P}_l^\\top$ 和 $\\mathbf{Q}_l\\mathbf{Q}_l^\\top$），因此对等价 LoRA factorization 不变。投影后乘以学习率 $\\eta$ 得到 affine target $\\mathbf{T}_l = \\mathbf{X}_l + \\eta \\cdot \\text{Proj}_{\\mathbf{X}_l}(\\mathbf{U}_{BQ,l})$。此时 $\\text{rank}(\\mathbf{T}_l) \\leq 2r_l$，可能超出 rank budget。\n\n5. **DPC: Fixed-Rank Refactorization（§4.4）**：当 $\\text{rank}(\\mathbf{T}_l) \u003E r_l$ 时，需在 rank 约束下压缩 target。候选集 $\\mathcal{C}(\\mathbf{T})$ 要求每层 $\\text{rank}(\\mathbf{Z}_l) \\leq r_l$ 且列空间和行空间被限制在 $\\mathbf{T}_l$ 的列空间和行空间内。优化目标联合最小化两项：第一项 $\\|\\mathbf{Z}_l - \\mathbf{T}_l\\|_F^2$ 衡量 effective-weight approximation error；第二项 $\\gamma\\|D\\Phi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{Z} - \\mathbf{T}]\\|^2$ 衡量将 target 替换为 candidate 后引入的 first-order decision distortion，使用与 BQB 相同的 behavior geometry。系数 $\\gamma \u003E 0$ 控制两者间的 tradeoff。由于列/行空间约束，优化可通过大小至多 $2r_l \\times 2r_l$ 的 core 矩阵完成。压缩后 refactorize 为 $\\mathbf{X}_l^+ = s_l \\mathbf{B}_l^+ \\mathbf{A}_l^+$，满足原始 rank budget。\n\n6. **迭代与推理（§4.2, §5）**：上述 BQB → DPC 两阶段在训练中反复执行。推理时直接部署单个 fixed-rank LoRA adapter，无需 adapter routing 或多 adapter 协调。评测在 AppWorld（多步 API 交互任务）和 BrowseComp-Plus（深度搜索任务）上进行，测量 task accuracy/recall 和 interaction counts。\n\n### § 6 核心数学推导\n\n本文的数学核心建立在 **quotient manifold** 理论之上，以下逐步解释关键推导。\n\n**背景：Quotient Manifold（§3）**\n\n给定光滑流形 $\\mathcal{M}$ 和等价关系 $\\sim$，将等价的点归为同一 equivalence class $[x]$，所有 class 构成 quotient set $\\mathcal{M}/\\sim$。若 canonical projection $\\pi: \\mathcal{M} \\to \\mathcal{M}/\\sim$ 是光滑 submersion（即 $D\\pi(x)$ 处处满秩），则 $\\mathcal{M}/\\sim$ 成为 quotient manifold。每个 $x$ 处的 vertical space $V_x = \\ker D\\pi(x)$ 包含\"沿等价类内部移动\"的切方向——这些方向在 quotient 空间中不可区分。两个切向量 $\\mathbf{u}, \\mathbf{v} \\in T_x\\mathcal{M}$ 在 quotient tangent space 中代表同一向量，当且仅当 $\\mathbf{u} - \\mathbf{v} \\in V_x$。\n\n**Intuition**：想象你站在一个山坡上（total space），只关心海拔高度（quotient space）。沿等高线走（vertical direction）不改变海拔，所以这些方向在\"海拔空间\"中是看不见的。Quotient geometry 就是把\"看不见的差异\"除掉，只保留可区分的变化。\n\n**Behavior Map 与等价关系（§4.3）**\n\n定义 behavior map $\\Phi_{\\mathcal{T}}: \\mathcal{W} \\to \\mathbb{R}^{d_{\\text{hid}}}$，将 effective update $\\mathbf{X}$ 映射为所有 reference decision positions 上归一化的表示响应。等价关系定义为：$\\mathbf{X} \\sim_{\\mathcal{T}} \\mathbf{X}'$ 当且仅当 $\\Phi_{\\mathcal{T}}(\\mathbf{X}) = \\Phi_{\\mathcal{T}}(\\mathbf{X}')$。\n\n**Intuition**：两条轨迹可能在参数空间中梯度差异很大，但如果它们在所有参考决策点上引起的 hidden representation 变化相同，那么对 agent 行为而言它们是等价的。参数空间的距离会高估行为多样性，因为它包含了\"在参考决策上不可见\"的成分。\n\n**Quotient Tangent Distance（§4.3）**\n\n在当前 iterate $\\mathbf{X}$ 处，quotient tangent space 中的距离通过 behavior response 直接计算：\n\n$$g(D\\pi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{u}], D\\pi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{v}]) = \\langle D\\Phi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{u}], D\\Phi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{v}] \\rangle$$\n\n**Intuition**：两个更新方向的 quotient 距离就是它们的一阶 behavior response 的内积。如果两个方向在所有参考决策上引起相同的一阶表示变化，它们的 quotient 距离为零——无论参数空间中差多远。这使得距离计算可通过 Jacobian-vector products 完成，无需显式构造 quotient 坐标。\n\n**Gaussian Affinity 加权（§4.3）**\n\n每条轨迹的 local density 通过 Gaussian affinities 计算：\n\n$$\\rho_i = \\frac{1}{N} \\sum_{j=1}^{N} \\exp\\left(-\\frac{g(D\\pi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{U}_i], D\\pi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{U}_j])}{2\\sigma_{\\mathcal{T}}^2}\\right)$$\n\n权重 $w_i \\propto \\rho_i^{-\\alpha}$，归一化 $\\frac{1}{N}\\sum_i w_i = 1$。\n\n**Intuition**：$\\rho_i$ 衡量有多少其他轨迹在 behavior quotient space 中靠近 $\\mathbf{U}_i$。$\\rho_i$ 大意味着该行为变化被大量轨迹重复代表。取 $\\rho_i^{-\\alpha}$ 作为权重，就是在降低冗余行为的贡献、提升独特行为的贡献。$\\alpha$ 控制校正强度：$\\alpha=0$ 不校正，$\\alpha=1$ 在组间 overlap 足够小时近似等化各组的总贡献。\n\n**Tangent Space Projection（§4.4）**\n\nrank-$r$ 矩阵流形 $\\mathcal{R}_r$ 在 $\\mathbf{X}_l$ 处的 tangent space 为 $T_{\\mathbf{X}_l}\\mathcal{R}_{r_l} = \\{\\mathbf{B}_l \\dot{\\mathbf{A}}_l + \\dot{\\mathbf{B}}_l \\mathbf{A}_l\\}$。Frobenius 正交投影为：\n\n$$\\text{Proj}_{\\mathbf{X}_l}(\\mathbf{U}_{BQ,l}) = \\mathbf{P}_l \\mathbf{P}_l^\\top \\mathbf{U}_{BQ,l} + \\mathbf{U}_{BQ,l} \\mathbf{Q}_l \\mathbf{Q}_l^\\top - \\mathbf{P}_l \\mathbf{P}_l^\\top \\mathbf{U}_{BQ,l} \\mathbf{Q}_l \\mathbf{Q}_l^\\top$$\n\n其中 $\\mathbf{P}_l$ 和 $\\mathbf{Q}_l$ 分别张成 $\\text{col}(\\mathbf{X}_l)$ 和 $\\text{col}(\\mathbf{X}_l^\\top)$。\n\n**Intuition**：第一项保留可通过当前列空间实现的部分，第二项保留可通过当前行空间实现的部分，第三项减去两者共享的部分（避免重复计算）。该投影只依赖 $\\mathbf{X}_l$ 的列空间和行空间，不依赖具体的 factorization $(\\mathbf{B}_l, \\mathbf{A}_l)$，因此对等价 factorization 不变——不同的 $(\\mathbf{B}, \\mathbf{A})$ 只要乘积相同，投影结果就相同。\n\n**Fixed-Rank Refactorization 目标（§4.4）**\n\n$$\\min_{\\mathbf{Z} \\in \\mathcal{C}(\\mathbf{T})} \\sum_l \\|\\mathbf{Z}_l - \\mathbf{T}_l\\|_F^2 + \\gamma \\|D\\Phi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{Z} - \\mathbf{T}]\\|^2$$\n\n**Intuition**：第一项是标准的低秩近似——在 Frobenius 范数下逼近 target。但等量的 weight error 在不同方向上引起的 decision distortion 不同，因为 behavior map 对某些残差方向更敏感。第二项用与 BQB 相同的 behavior geometry 来惩罚 decision distortion，确保压缩保留了对参考决策最重要的部分。$\\gamma$ 控制两者 tradeoff：$\\gamma$ 小偏重 weight 逼近，$\\gamma$ 大偏重 decision 保持。候选集限制在 target 的列/行空间内，使优化可在 $2r_l \\times 2r_l$ 的 core 上完成，计算高效。\n\n### § 7 实验设计与结论\n\n**问题 1：单个 fixed-rank LoRA 能否有效学习 diverse agent behaviors，同时避免 multi-adapter 的存储和 routing 开销？**\n\n实验设计：在 AppWorld（多步 API 交互）和 BrowseComp-Plus（深度搜索）两个 benchmark 上，使用 Qwen3.5-4B 和 9B 两种 backbone，将 BQ-LoRA 与七种 baseline 对比：Base（无适配）、Full FT（全参数微调）、标准 LoRA、LoRA-S（quotient manifold 上的单 adapter 优化）、MoRAgent（多角色 LoRA）、DART（推理/工具使用分离 LoRA）、TopoCurate（语义拓扑轨迹筛选）。测量 task accuracy/recall 和 interaction counts（步数/搜索次数）。\n\n答案：BQ-LoRA 在八项性能指标的平均上超过最强 baseline MoRAgent 2.14（4B）和 2.12（9B）个百分点，同时在所有设置下取得最低 interaction counts。这表明行为级冗余平衡和 decision-preserving 压缩使单个 fixed-rank adapter 能有效覆盖 diverse behaviors，同时提升任务性能和交互效率。\n\n**问题 2：BQB 和 DPC 两个模块各自的贡献是什么？两者是否互补？**\n\n实验设计：Ablation study 在 AppWorld（TGC 指标）和 BrowseComp-Plus（accuracy）上移除各模块：BQ-LoRA w/o BQB（仅 DPC）、BQ-LoRA w/o DPC（仅 BQB），与完整方法和标准 LoRA 对比。\n\n答案：移除 BQB 在 Test-C 上分别下降 3.57（4B）和 3.83（9B）个百分点，在 BrowseComp-Plus 上也下降，支持按 decision representation 效果平衡轨迹更新的价值；Test-C 下降大于 Test-N，说明平衡的收益因评测设置而异。移除 DPC 在全部八项设置中均下降，平均下降 3.64（4B）和 3.57（9B）个百分点，支持在 rank 约束压缩时保持 decision changes 的重要性。完整方法在八项中七项领先；两个 partial variant 均在所有设置上超过标准 LoRA，表明各模块独立有效且互补。保留 DPC 的平均性能高于仅保留 BQB，说明 decision-preserving 压缩的贡献略大于行为平衡。\n\n**问题 3：超参数 $\\alpha$（平衡指数）和 $\\gamma$（压缩系数）如何影响性能？**\n\n实验设计：固定一个超参数为 1，扫描另一个：$\\alpha \\in \\{0, 0.25, 0.5, 0.75, 1\\}$，$\\gamma \\in \\{0.1, 0.3, 0.5, 0.8, 1, 3, 10\\}$。报告八项性能指标的平均值。\n\n答案：$\\alpha$ 方面，4B 在 $\\alpha=0.75$ 处最优、9B 在 $\\alpha=1$ 处最优，两者均优于 $\\alpha=0$（均匀加权），验证了 density-based balancing 的必要性；4B 曲线在高端趋平而 9B 持续上升，表明更大模型可承受更激进的冗余抑制。$\\gamma$ 方面，两种 backbone 均在 $\\gamma=0.8$ 处最优，附近值仍有竞争力；性能在两端（过小偏重 weight 逼近、过大偏重 decision 保持）均下降，支持 weight fidelity 与 decision preservation 之间存在中间最优 tradeoff，该模式在跨越两个数量级的 $\\gamma$ 扫描中一致。", "additional_insights": "### § 8 Take-aways\nBQ-LoRA 提出了一种基于单一 fixed-rank LoRA adapter 学习 diverse agent behaviors 的框架，避免了 multi-adapter 设计带来的存储与 routing 开销。其核心模块 Behavior Quotient Balancing (BQB) 通过比较不同 trajectory updates 对 reference decision representations 的 first-order effects 来识别 behavioral equivalence，并根据 quotient tangent space 中的 local density 对更新方向进行 reweight，从而抑制冗余行为并提升独特行为的贡献。另一个模块 Decision Preserving Compression (DPC) 将平衡后的梯度投影到 fixed-rank tangent space，并在压缩回原始 rank budget 时联合控制 weight approximation error 与 first-order decision distortion，确保 rank reduction 不会破坏预期的决策变化。在 AppWorld 和 BrowseComp-Plus 上的实验表明，该方法在性能上超越了 multi-LoRA 和 trajectory curation baselines，同时显著降低了 agent 完成任务所需的 interaction counts。\n\n### § 9 最脆弱的假设\nBQ-LoRA 最脆弱且失败代价最大的假设是：不同 trajectory updates 在固定 reference histories 上对 normalized decision representations 产生的 first-order effects 相同，就意味着它们在行为上是等价且冗余的。这个假设在实际多步交互的 agent 环境中极易不成立，因为 agent 的状态空间是动态且广阔的。两个在当前 reference histories 上产生相同一阶响应的更新，在模型偏离参考点进入未见过的 states 后，可能会引发截然不同的后续行为。BQB 仅依赖局部 quotient tangent space 的 first-order approximation，忽略了高阶交互和长期轨迹的分布偏移。论文虽然通过 ablation study 证明了移除 BQB 会导致性能下降（尤其在 Test-C 上），但并未提供证据表明这些被 down-weighted 的“等价”更新在多步 rollout 中不会产生分歧，也缺少对 first-order approximation 在动态环境全局有效性的验证。如果这个局部等价假设失效，BQB 可能会错误地抑制对未来决策至关重要的更新，导致核心贡献直接崩塌。\n\n### § 10 最小复现实验\n在一周时间内，可以针对 BQB 模块的核心 claim 进行最小复现实验：验证基于 first-order decision effects 对 trajectory updates 进行 reweighting 是否能减少 behavioral redundancy 并提升效率。使用 AppWorld 数据集收集的一小批成功 trajectories，并选择较小的 backbone（如 Qwen3.5-4B）以降低算力需求。实现一个简化版的 BQB：在标准 LoRA 训练的每个 batch 中，计算各 trajectory 的 task gradient，利用 Jacobian-vector products 评估它们在固定 reference histories 上对 decision representations 的 first-order effects，计算 pairwise quotient distances 并通过 Gaussian affinities 分配非均匀 weights，最后以这些 weights 聚合梯度进行更新。测量指标为 AppWorld Test-N 子集上的 task accuracy 和 average interaction steps，并与采用 uniform weighting 的标准 LoRA 进行对比。如果 reweighted LoRA 在保持或提高 accuracy 的同时显著降低了 average interaction steps，则支持论文关于减少冗余行为能提升 agent 效率的 claim；若性能下降或交互步数反而增加，则反驳了该 claim，说明 first-order reweighting 可能错误抑制了关键行为更新。", "research_value": "### § 11 最强反例设计\n\n最有力的攻击应针对 BQB 的核心假设：first-order decision effects on fixed reference histories 足以判定 behavioral equivalence。我设计一个基于 **branching MDP with asymmetric coverage** 的反例场景。\n\n考虑一个 multi-step agent task，其 trajectory tree 在第二步产生两个互斥的分支：Branch A（占训练轨迹的 80%）要求 agent 调用 search API 后执行 summarize，Branch B（占 20%）要求直接调用 compute API 后执行 format。假设 reference decision histories 主要从 Branch A 的成功轨迹中采样（因为它们数量占优且成功率更高），那么 reference histories 对 Branch B 的 decision positions 覆盖极低。现在有两条 trajectory updates：$U_1$ 来自 Branch A 的轨迹，主要强化 search→summarize 的决策路径；$U_2$ 来自 Branch B 的轨迹，强化 compute→format 的决策路径。由于 reference histories 几乎不包含 compute 和 format 的 decision positions，$U_2$ 在这些 positions 上的 first-order behavior response 接近零——不是因为 $U_2$ 不重要，而是因为 reference set 对 $U_2$ 的作用域存在系统性盲区。结果是 $U_1$ 和 $U_2$ 在 quotient tangent space 中的距离极小，BQB 判定它们 behaviorally equivalent，将 $U_2$ 的权重压低。但 $U_2$ 携带的是 Branch B 独有的、不可被 $U_1$ 替代的行为信息。在部署时，当 agent 遇到需要 Branch B 路径的任务时，由于该行为在训练中被 down-weight 甚至忽略，agent 会 fallback 到 Branch A 的策略，导致任务失败或 interaction count 暴增。\n\n这个反例的杀伤力在于它不需要构造极端分布——只要训练数据中不同行为模式的频率不均匀（这在真实 agent trajectories 中是常态），reference set 就会自然偏向高频模式，而 BQB 的 density-based reweighting 会系统性地放大这种偏向，将低频但行为上不可替代的 updates 判定为冗余。论文的 ablation study 中 Test-C 下降大于 Test-N 的现象实际上已经暗示了这个问题：Test-C 包含 compositionally novel tasks，更需要低频行为的覆盖，而移除 BQB 反而缓解了对这些行为的抑制。论文将此解释为\"平衡收益因评测设置而异\"，但更合理的替代解释是 BQB 在 Test-C 上产生了 negative transfer——它主动伤害了对 novel compositions 至关重要的低频行为学习。要验证这一替代解释，只需在 Test-C 上比较 BQ-LoRA 与 uniform-weighting baseline 在低频行为子任务上的 per-task breakdown：如果 BQ-LoRA 在高频子任务上提升但在低频子任务上显著退化，则证明 BQB 的收益来自牺牲行为覆盖而非消除真正冗余。\n\n### § 12 Follow-up Research Idea\n\n**Trajectory-Distributional Behavioral Equivalence via Optimal Transport**\n\nBQ-LoRA 的根本局限在于它将 behavioral equivalence 定义为局部、一阶、基于固定参考点的性质。但 agent 的行为本质上是 trajectory-level 的：一个 update 的真正行为效应不是它在某个 decision position 上引起的 hidden representation 变化，而是它如何改变 agent 在整个 task 上的 trajectory distribution。两个在参考点上 first-order equivalent 的 updates 可能在 rollout 中诱导截然不同的 trajectory distributions——因为多步交互中，早期决策的微小差异会通过 environment dynamics compound 成完全不同的 state visitation 和 action sequence。这个 gap 不是可以通过增加参考点或引入高阶展开来弥合的，因为问题的本质是 distributional 而非 local。\n\n我提议将 behavioral equivalence 从 decision representation level 提升到 trajectory distribution level，用 **Wasserstein distance between induced trajectory distributions** 作为 behavioral metric。具体地，给定当前 policy $\\pi_\\mathbf{X}$ 和一个 update direction $\\mathbf{U}$，定义 perturbed policy $\\pi_{\\mathbf{X}+\\epsilon\\mathbf{U}}$，从两者各采样一组 trajectories，计算两组 trajectory distributions 之间的 Wasserstein-$k$ 距离作为 $\\mathbf{U}$ 的 behavioral signature。两个 updates $\\mathbf{U}_i, \\mathbf{U}_j$ 在 trajectory-distributional sense 下 equivalent 当且仅当它们各自诱导的 trajectory distribution shifts 相同。这个 equivalence relation 自然形成 quotient manifold，但其 vertical space 包含的是\"不改变 trajectory distribution\"的 parameter directions——这比\"不改变 reference decision representations\"严格得多，也正确得多。\n\n这个 framing 与已有工作的区别是根本性的。BQ-LoRA 和 LoRA-S 都在 parameter 或 representation space 中定义 equivalence；trajectory curation 方法（如 TopoCurate）在 semantic content space 中定义相似性；而本提议在 **trajectory distribution space** 中定义 equivalence，使用 OT 作为几何结构。这连接到 imitation learning 中的 behavioral distance literature（如 GAIL 的 discriminator-induced distance）和 RL 中的 policy distance metrics（如 Wasserstein policy gradient methods），但将其应用于 parameter-efficient fine-tuning 的 quotient construction 是全新的。关键的技术挑战是 trajectory distribution 的高维性和不可枚举性，但可以借鉴 diffusion-based trajectory models 或 trajectory VAE 将 trajectories 嵌入到低维 latent space，在 latent space 中计算 Wasserstein distance 作为 surrogate。另一个可借鉴的工具是 sliced Wasserstein distance，它通过随机投影将高维 OT 降为一维 OT 的期望，计算效率高且 sample complexity 友好。\n\n第一个实验应在一个人工构造的 branching MDP 上进行，该 MDP 具有明确的两个 trajectory modes 且 reference decision histories 只覆盖其中一个 mode。比较三种方法：(1) 标准 LoRA with uniform weighting，(2) BQ-LoRA（first-order decision representation equivalence），(3) OT-BQ（trajectory-distributional equivalence via sliced Wasserstein on trajectory embeddings）。关键测量不是 aggregate accuracy，而是 **per-mode coverage**：agent 在两个 mode 上的各自成功率。预期结果是 BQ-LoRA 在 covered mode 上与 OT-BQ 持平但在 uncovered mode 上显著退化，而 OT-BQ 在两个 mode 上均保持均衡覆盖——因为 trajectory-level Wasserstein distance 能检测到 $U_2$ 对 uncovered mode 的 trajectory distribution 有不可替代的 shift effect，即使它在 reference decision representations 上的 first-order response 为零。如果这个预期成立，它将直接证明 trajectory-distributional equivalence 是比 first-order decision representation equivalence 更正确的行为抽象，并开启 \"distributional PEFT\" 这一新方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Pengyang Zhou\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Xiaobin Tu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Zhengxi Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Rongkun Xue\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Haochen Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Miancan Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ziyuan Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yinggui Wang\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Jinkui Ren\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiantao Zhang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Alibaba Cloud\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution.\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author: wyinggui@gmail.com\"}\n  ]\n}\n```", "summary_translation": "基于 LLM 的 agents 依赖异构交互能力来完成复杂任务。现有方法通常将这些能力分布在多个 LoRA adapters 中，这增加了 adapter 的存储需求，并在推理过程中引入了路由开销。单个 LoRA 避免了这种开销，但在固定的 rank budget 下从多样的 agent trajectories 中学习带来了两个挑战。首先，具有不同交互痕迹和参数梯度的 trajectories 可能会在 decision distributions 中引起等效的变化，导致重复更新过度强调冗余的行为变化。其次，聚合的更新可能会超出 adapter 的 rank budget，并且在 weight space 中对其进行近似可能会扭曲其旨在产生的 decision changes。我们提出了 BQ-LoRA，这是一个通过局部 behavior quotient manifold 来组织 trajectory updates 的 low-rank adaptation 框架。它包含两个模块，即 behavior quotient balancing (BQB) 和 decision preserving compression (DPC)。BQB 从 decision distributions 中构建 quotient manifold，并根据它们在 quotient tangent space 中的局部密度重新加权 trajectory update directions。DPC 将平衡后的梯度投影到 intrinsic fixed rank tangent space 上，并通过联合控制 effective weight error 和 distortion of decision distributions 来重构由此产生的目标。在 AppWorld 和 BrowseComp-Plus 上的实验将 BQ-LoRA 与标准 LoRA 和最近的 low-rank adaptation 方法进行了比较，同时单独的 ablations 评估了这两个组件的互补贡献。"}, {"title": "Granularity-Adaptive Credit Assignment for Long-Horizon LLM Agent Reinforcement Learning", "arxiv_id": "2609.12424", "authors": "Taoran Liang, Yang Liu, Shang Luo, Yingguang Yang, Rongrong Zhang, Yingzong Min, Yulin Huang, Jianshen Zhang, Yongzhi Qi, Kefu Xu, Congjing Ran, Bin Chong", "summary": "Reinforcement learning is now the standard way to train large language model agents on long-horizon tasks, where dozens of interdependent actions precede a single sparse reward. Critic-free, group-relative methods such as GRPO suit this regime, but they broadcast one trajectory-level scalar to every step and cannot say which decision drove the outcome. GiGPO recovers a step-level signal by grouping time steps that share an anchor state, yet it merges the step- and episode-level estimates under one fixed weight, spending the same resolution on a pivotal branching decision as on a routine, near-deterministic transition. We argue that the right resolution is state-dependent, and propose GACA, a critic-free estimator whose granularity follows an uncertainty-based criticality proxy. GACA scores every step by the negative log-likelihood its own rollout already records, then blends the two advantages with a per-step weight that grows with that score, so the gradient places more weight on the fine-grained signal at above-average NLL and on the episode-level signal below it. We derive an exact risk decomposition for the implemented mixture and show that sufficiently small modulation improves on fixed mixing under positive directional alignment. A separate conditional result bounds local action-value variation using expected NLL, while an error-projection analysis characterizes when mixing adds value beyond scalar uncertainty reweighting. On ALFWorld and WebShop, GACA improves task success over GRPO and GiGPO at both 1.5B and 7B scales.", "category": "cs.LG", "cluster": "Agent Training \u0026 Adaptation", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-12 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文的核心是提出一种新的信用分配方法（GACA），用于改进长周期任务中LLM智能体的强化学习训练。这直接属于“构建、改进、评估、训练或演化LLM智能体”的研究范畴，具体对应“单智能体”方向中的智能体训练与强化学习。论文明确以LLM Agent为研究对象，聚焦于通过更精细的信用分配提升智能体在长周期任务中的学习效果，属于方法论创新，而非单纯的应用或基础设施。同时，论文不涉及安全、多模态、图技术或多智能体拓扑编排等排除项。因此，完全符合筛选标准。", "intro_logic": "### § 1 研究问题与重要性\n\n本文解决的核心问题是 long-horizon LLM agent 强化学习中的 credit assignment 粒度自适应问题。在 long-horizon 任务中，agent 需要执行数十个相互依赖的动作后才获得一个 sparse reward，而现有的 critic-free group-relative 方法（如 GRPO）将一个 trajectory-level 的 scalar reward 均匀广播到每一步，无法区分哪一步决策真正驱动了最终结果。GiGPO 虽然通过 anchor-state grouping 恢复了 step-level advantage，但以固定权重混合 step-level 和 episode-level 信号，对所有步骤施加相同的分辨率——无论该步骤是关键的 branching decision 还是 near-deterministic 的常规过渡。本文提出 GACA，一种 critic-free 的 advantage estimator，根据每一步的 policy uncertainty 动态调整 credit assignment 的粒度：在 policy 不确定的关键步骤信任 fine-grained step-level signal，在 confident 的常规步骤回退到 low-variance episode-level signal。这个问题的重要性在于，long-horizon trajectory 中步骤的 criticality 本质上是不均匀的，错误的 credit 分配会直接降低 sample efficiency 和最终策略质量，而 GACA 在不引入 critic、不增加 rollout、不增加显著计算开销的前提下，在 ALFWorld 和 WebShop 上将任务成功率显著提升。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决。最直接的前人工作是 GRPO（Shao et al., 2024）和 GiGPO（Feng et al., 2026）。GRPO 用 group-relative 的 episode-level advantage 替代 learned value function，避免了训练 critic 的成本和不稳定性，但它将整个 trajectory 的 return 标准化后广播给每一个 token，对决定性的早期选择和常规的后续步骤赋予完全相同的 credit——这是方法本身的结构性限制，因为 trajectory-level scalar 在设计上就无法区分步骤间的因果贡献。GiGPO 在此基础上前进了一步：它将共享相同 anchor observation 的 time steps 跨 rollout 重新分组，在 step-group 内计算 group-relative advantage，从而在不增加 rollout 成本的前提下恢复了 step-level 信号，并以固定权重 $w$ 将 step-level 和 episode-level advantage 线性组合。然而，GiGPO 的关键不足在于其 granularity 是 uniform 的：所有步骤获得相同的 step-level advantage 权重，无论该步骤是否是真正的 decision point。这一限制并非工程疏忽，而是因为 GiGPO 将 credit 分配的分辨率视为全局常数，而非 state-dependent 的属性。实际上，long-horizon trajectory 中只有少数步骤是 policy 不确定且影响结果的 branching decision，大多数步骤是 near-deterministic 的过渡，其 step-level advantage 主要是 estimation noise；固定权重将这些 noise 以全强度注入 gradient，同时在真正需要 fine-grained signal 的关键步骤上 under-use 它。这种 asymmetry 在 token level 已有文献记录（Wang et al., 2026; Cui et al., 2025 表明 high-entropy minority tokens 驱动了大部分 policy improvement），但 GiGPO 未能在 step level 利用这一洞察。GACA 的关键贡献在于认识到 policy 自身的 NLL 已经记录了每一步的不确定性，该信息在 rollout 中免费获取，可以作为 criticality score 来 per-step 动态调整混合权重，从而将分辨率从全局常数转变为 state-dependent 的连续变量。", "core_insight": "### § 3 重建作者的思考路径\n\n长程 LLM agent 的 RL 训练面临一个核心困难：任务只在几十步交互后给出一个 sparse 的 terminal reward，而 critic-free 方法如 GRPO 虽然避开了训练 value function 的不稳定性，却只能将这一个 trajectory-level 的 scalar 广播到每一步，无法区分哪一步决策真正导致了成功或失败。GiGPO 部分解决了这个问题：它观察到同一 group 的不同 rollout 中，如果某些步骤面对相同的 anchor state，就可以将这些步骤重新分组，在组内计算 step-level 的 group-relative advantage，从而以零额外 rollout 成本恢复细粒度信号。但 GiGPO 用一个固定权重将 step-level 和 episode-level 两个 estimator 混合，对所有步骤施加相同的分辨率——无论该步骤是一个真正的不确定决策点，还是一个近乎确定性的过渡动作。\n\n从经验上看，长程轨迹本身就不是均匀的：少数步骤是 policy 犹豫、选择影响结局的 branching decision，多数步骤则是走向已选目标之类的 near-deterministic continuation。对 routine step 施加 step-level advantage，注入的主要是估计噪声；而对 pivotal step 却没有加大细粒度信号的权重，恰恰浪费了 step-level estimator 最有价值的地方。这一不对称性在 LLM reasoning 的 RL 中已有先例：少数高 entropy token 驱动了大部分 policy improvement。如果 token 层面的不确定性能够标识学习的关键位置，那么在 agent 的 step 层面，policy 的不确定性理应也能标识哪些步骤的 credit 值得更细粒度的分配。\n\n关键在于，policy 的不确定性信号几乎免费可得：rollout 过程中已经记录了每个被采样 token 的 log-probability，其 mean per-token NLL 就是 Shannon entropy 的无偏估计的长度归一化版本。既然 credit assignment 的理想分辨率是 state 的属性而非全局常数，就可以用这个 NLL 作为 per-step 的 criticality score，动态调节 step-level 与 episode-level advantage 的混合权重——在 policy 不确定时信任细粒度信号，在 policy 自信时退回低方差的 episode-level 估计。从理论上看，高 NLL 意味着同一 anchor state 下不同 rollout 采样的 canonical action 分歧更大，局部 action-value variance 更高，episode-level estimator 作为单一 scalar 无法分辨这些分支，其误差也更大；因此 error-optimal 的 step weight 应随 NLL 递增，而 state-adaptive mixing 只要 per-state 最优权重不全相等，就严格优于任何固定常数。\n\n### § 4 核心 Intuition\n\n长程轨迹中不同步骤的\"关键性\"天然不同：policy 不确定的步骤是真正的决策分叉点，需要细粒度的 step-level credit 来区分好坏选择；policy 自信的步骤则是例行延续，低方差的 episode-level credit 已经足够可靠。既然 policy 自己的 NLL 已经在 rollout 中免费记录了这种不确定性，就可以用它作为 per-step 权重，动态地在 step-level 和 episode-level advantage 之间插值——让 credit 的分辨率跟随 state 而非保持全局常数。先前方法失效的根源正是 GiGPO 用固定权重对待所有步骤，在噪声大的 routine step 上浪费了细粒度信号，在真正关键的 pivotal step 上又给得不够。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n          Group Rollout (G trajectories / task)\n          │\n    ┌─────┼──────────────┬──────────────┐\n    ▼     ▼              ▼              \n  {R_τ}  Anchor      Token Log-Probs   \n    │     States         │              \n    ▼     │              ▼              \n  A_E    │           H_t (NLL, Eq.4)    \n (Eq.2)  │              │              \n    │     ▼              ▼              \n    │  A_S_t         c_t (Eq.5)         \n    │  (Eq.3)        criticality        \n    │     │              │              \n    │     │              ▼              \n    │     │           λ_t (Eq.7)        \n    │     │           mixing weight     \n    │     │              │              \n    └──┬──┴──────────────┘              \n       ▼                                \n  A_GACA = λ_t·w·A_S + (1−λ_t)·A_E      \n       │  (Eq.8)                        \n       ▼                                \n  Clipped Surrogate → Policy Update     \n       │  (Eq.1, PPO-style)             \n       ▼                                \n  Updated π_θ                           \n```\n\n**训练阶段**（推理与评测不涉及 advantage 计算，仅用训练好的 policy 正常 rollout）：\n\n1. **Group Rollout**：对每个 task 采样 G=8 条 trajectories，记录每步的 state、action、reward、per-token log-probability。这是所有后续计算的共享输入（§ 2.1, § 4.1）。\n\n2. **Episode-level Advantage $A^E$**：对同一 prompt group 内所有 trajectories 的 return $R_\\tau$ 做组内标准化（减均值、除标准差），得到每条 trajectory 一个 scalar，广播到该 trajectory 的所有 step（Eq. 2）。这是 GRPO 的原始信号，无法区分哪一步导致了成功或失败。\n\n3. **Anchor-state Step-grouping 与 $A^S_t$**：将不同 trajectories 中共享相同 anchor observation 的 step 归入同一 step-group，在组内对 discounted step return $\\hat{g}_t$ 做标准化，得到 step-level advantage（Eq. 3）。Singleton group 回退到 prompt-group 归一化（Appendix D）。此步骤继承自 GiGPO，GACA 不做修改。\n\n4. **NLL Proxy $H_t$**：从 rollout 已记录的 per-token log-probability 计算每个 step 的 mean per-token negative log-likelihood（Eq. 4）。无需额外 forward pass，成本为零（§ 3.1, Table 5）。\n\n5. **Criticality Score $c_t$**：将 $H_t$ 除以该 trajectory 的 $H_t$ 均值，得到归一化分数（Eq. 5）。$c_t \u003E 1$ 表示该 step 的 policy 不确定性高于 trajectory 平均水平。可选地与 reward-change 信号融合（Eq. 6, $\\alpha_c \u003C 1$），但实验表明纯 entropy（$\\alpha_c = 1$）效果最好（§ 4.3）。\n\n6. **Per-step Mixing Weight $\\lambda_t$**：通过分段线性、clamped 到 [0,1] 的函数（Eq. 7），将 $c_t$ 映射为 $\\lambda_t$。以 $\\lambda_0 = 0.5$ 为基准，$c_t \u003E 1$ 时 $\\lambda_t$ 向上推（更多 step-level 信号），$c_t \u003C 1$ 时向下拉（更多 episode-level 信号）。调制强度由 $\\alpha_\\lambda, \\beta_\\lambda$ 控制（§ 3.2, Figure 3）。\n\n7. **Mixed Advantage $A^{\\text{GACA}}_t$**：凸组合两个 estimator（Eq. 8）：$A^{\\text{GACA}}_t = \\lambda_t w A^S_t + (1 - \\lambda_t) A^E$。在 policy 不确定的 pivotal step 信任 fine-grained step signal，在 routine step 回退到 low-variance episode signal。$\\lambda_t$ 在单次 update 内固定（由 old-policy 量计算）。\n\n8. **Policy Update**：将 $A^{\\text{GACA}}_t$ 广播到该 step 的所有 token，代入 PPO clipped surrogate（Eq. 1），配合 KL penalty 更新 policy。GACA 仅替换 advantage 计算步骤，其余训练循环与 GRPO/GiGPO 完全一致（Algorithm 1）。\n\n---\n\n### § 6 核心数学推导\n\n论文的理论分析围绕三个命题展开，核心逻辑链为：**高 NLL → action 分歧大 → local action-value variance 大 → step-level estimator 更可靠 → 最优权重向 step-level 倾斜 → adaptive 优于 fixed**。\n\n**Proposition 1：Expected NLL certifies local criticality**\n\n直觉：如果 policy 在某个 anchor state $z$ 处很不确定（高 NLL），那么多次访问该 state 时采样的 actions 会更分散。用 collision probability $D_z = \\Pr[U \\neq U']$（两次独立访问采到不同 canonical action 的概率）衡量分歧程度，用 $C_z = \\text{Var}[Q_z(U)]$ 衡量 local action-value variance。\n\n证明的关键技巧在于建立 entropy 与 collision probability 的下界关系。传统做法用 Pinsker inequality 将 KL divergence 转为 TV distance，但只在 entropy 接近最大值（near-uniform）的极窄区间内有效。论文转而利用 largest atom $p_z^{\\max}$：entropy 越高，$p_z^{\\max}$ 越小（通过严格递减函数 $F_K^{-1}$），而 collision probability $\\sum_u p_z(u)^2 \\leq p_z^{\\max}$，因此 $D_z = 1 - \\sum_u p_z(u)^2 \\geq 1 - F_K^{-1}(H(U|Z=z))$。这个 bound 在远超 near-uniform 的实际 entropy 范围内仍然有效（Appendix B.1 给出校准：$K_z=10$, $H=1$ nat 时，此法 certify $D_z \\geq 0.217$，Pinsker certify 0）。\n\n再由 $2C_z = D_z \\cdot \\kappa_z$（不同 canonical action 的 value 差异 $\\kappa_z \\geq \\kappa_0 \u003E 0$），得到 $C_z$ 的下界也随 NLL 递增。注意这是**单边证书**：高 NLL 保证 branching，低 NLL 只是未能 certify。\n\n**Proposition 3：MSE-optimal mixing weight**\n\n直觉：两个 estimator 各有误差。Step-level estimator $A^S$ 的误差来自 step return 的观测噪声 $\\sigma_z^2$（variance，无 bias）；episode-level estimator $A^E$ 的误差来自 shrinkage factor $\\eta_z$（一个 scalar 无法区分 branching，产生 bias）加上独立噪声 $\\tau_z^2$。两者的 conditional MSE 分别为：\n\n$$M_S(z) = \\frac{\\sigma_z^2}{m_z - 1}, \\quad M_E(z) = \\tau_z^2 + \\eta_z^2 \\cdot \\frac{m_z}{m_z - 1} \\cdot C_z$$\n\n混合 estimator 的 risk $R_z(\\lambda) = \\lambda^2 M_S + (1-\\lambda)^2 M_E$ 是严格凸二次函数，最优解为 $\\lambda_z^\\star = M_E / (M_E + M_S)$。关键结论：$\\lambda_z^\\star$ 关于 $C_z$ 和 $m_z$ 非递减——local criticality 越大（episode estimator 的 bias 越严重），或 anchor group 越大（step estimator 的 variance 越小），最优权重越应倾向 step-level。将 Proposition 1 的 $C_z$ 下界代入，得到 $\\lambda_z^\\star$ 的下界 $\\tilde{\\lambda}_z(h_z)$ 也随 expected NLL 递增。Eq. 7 的 monotone gate 实现的正是追踪这个 certified floor。\n\n**Proposition 2：State-adaptive mixing dominates fixed mixing**\n\n直觉最简洁：将 risk 在最优点展开，$R_z(\\lambda) - R_z(\\lambda_z^\\star) = (M_E + M_S)(\\lambda - \\lambda_z^\\star)^2$。对固定权重 $\\lambda_0$ 取期望：\n\n$$\\mathbb{E}_Z[R_Z(\\lambda_0)] - \\mathbb{E}_Z[R_Z(\\lambda_Z^\\star)] = \\mathbb{E}_Z[(M_E + M_S)(\\lambda_0 - \\lambda_Z^\\star)^2] \\geq 0$$\n\n等号成立当且仅当 $\\lambda_Z^\\star$ 几乎处处为常数。只要不同 state 的最优权重不同（这在 long-horizon 任务中是常态），adaptive 就严格优于任何 fixed weight。这是 § 4.3 中 $\\lambda_0$ sweep 实验直接测试的预测。\n\n---\n\n### § 7 实验设计与结论\n\n论文围绕两个核心问题设计实验：\n\n**问题一：Granularity-adaptive credit assignment 是否能提升 long-horizon agent RL 的性能？**\n\n实验设计：在 ALFWorld（文本家务任务，horizon ≤ 50）和 WebShop（网页购物，horizon ≤ 15）两个 benchmark 上，使用 Qwen2.5-1.5B 和 7B backbone，将 GACA 与 GRPO（纯 episode-level）和 GiGPO（固定权重的 two-level）在完全相同的 rollout budget、训练 epoch 和 normalization convention 下比较。所有方法共享 PPO clipped surrogate，唯一差异是 advantage estimator。报告 128 个 held-out task 的 success rate，3 个 random seed 取均值。\n\n答案：GACA 在全部四个 setting 下均为最优。相对 GiGPO，1.5B 上 ALFWorld +10.2、WebShop +13.6；7B 上 +2.4 和 +8.4。训练曲线显示 GACA 在前 30 epoch 内即与 baseline 分离，以约一半的 epoch 达到 GiGPO 的峰值，说明 adaptive weight 同时提升了 sample efficiency 和 final performance。增益在更弱的 policy（1.5B \u003E 7B）和更短的 horizon（WebShop \u003E ALFWorld）上更大，与机制预测一致：弱 policy 在更多 step 上不确定，短 horizon 将 outcome 集中于少数 branching decision。\n\n**问题二：性能提升是否来自 criticality-adaptive granularity 本身，而非更好的常数权重或仅仅引入了变化的权重？**\n\n实验设计：在 ALFWorld 1.5B 上进行 ablation grid，每次只变一个设计选择，其余保持 default，统一训练和 selection protocol。\n\n三组关键对照：\n- **Criticality score**：纯 entropy（96.88）\u003E uniform/固定权重（93.05）\u003E random permutation（88.54）。Random permutation 保持了权重的完整 multiset，仅打乱分配——结果比不 adapt 还差，证明增益来自权重**放在哪里**而非**是否变化**。\n- **Fixed mixing weight $\\lambda_0$ sweep**（adaptation off）：曲线凹，峰值在 $\\lambda_0 = 0.5$（93.05），两端（纯 episode 85.94、纯 step 84.60）均差。Adaptive rule 比最佳常数高 3.83 点，正是 Proposition 2 预测的方向。\n- **Modulation strength**：从无调制到 $\\alpha_\\lambda = \\beta_\\lambda = 0.5$ 增益 3.83 点，但推到 1.0 反而回退 1.44 点——因为 NLL 是单样本估计、噪声大，过强调制将噪声放大到权重中，且 clamp 过早触发使最不确定的 step 塌缩到同一权重。\n\n答案：性能提升可被精确归因于 criticality-adaptive granularity。Diagnostics 进一步确认机制运行在 intended range：criticality score 标准差 0.31（ALFWorld）/ 0.27（WebShop），mixing weight 均值被 construction pin 在 $\\lambda_0 = 0.50$，不到 1% 的 step 触发 clamp，86%/79% 的 step 落在 non-singleton anchor group 中获得真实 within-group contrast。GACA 的 per-iteration 额外开销仅 0.09 秒（总 iteration 约 6 分钟），peak memory 不变。", "additional_insights": "### § 8 Take-aways\n本文提出了一种名为 GACA（Granularity-Adaptive Credit Assignment）的 critic-free advantage estimator，用于解决长序列 LLM agent 强化学习中的 credit assignment 问题。与 GRPO 将单一 trajectory-level 标量广播到所有步骤、或 GiGPO 使用固定权重混合 step-level 与 episode-level advantage 不同，GACA 根据每一步的 policy uncertainty 动态调整混合权重。具体而言，GACA 利用 rollout 中已记录的 mean per-token negative log-likelihood (NLL) 作为 criticality score，在 policy 不确定的关键决策点赋予 step-level advantage 更高的权重，而在近确定性的常规转移中回退到低方差的 episode-level advantage。理论层面，论文证明了更高的 anchor-conditional expected NLL 能保证 local action-value variance 有更大的 lower bound，从而证明 state-adaptive mixing 在 per-state optima 不同时严格优于任何固定权重。实验表明，在 ALFWorld 和 WebShop 上，GACA 在 1.5B 和 7B 规模下均显著超越了 GRPO 和 GiGPO，且消融实验证实收益来源于将权重正确放置在关键步骤上，而非仅仅引入了变化的权重。此外，该机制几乎不产生额外计算开销（每次迭代仅增加 0.09 秒），且不引入额外参数或 critic 网络。\n\n### § 9 最脆弱的假设\nGACA 最核心且最脆弱的假设是：**policy 的 uncertainty（以 mean per-token NLL 衡量）是 step criticality 的可靠代理，即高 NLL 必然对应于对 episode return 影响巨大的 branching decision**。在实际的 LLM agent 交互中，这一假设极易不成立：policy 可能在某一步表现出高 uncertainty，仅仅是因为它缺乏相关知识或处于探索初期的随机状态，而非该步骤是决定任务成败的关键分水岭；反之，一个真正 pivotal 的步骤可能已经被 policy 学得很好，此时 NLL 极低，但 GACA 会错误地将其视为 routine step 并剥夺其 fine-grained 的 step-level signal。论文自身也承认了这一脱节，并试图通过引入 reward-change term $\\Delta_t$ 进行融合修正，但消融实验（Table 2）却表明引入 reward-change 反而降低了性能，最终默认设置退回到纯 entropy 驱动。论文仅通过 Proposition 1 提供了理论上的 lower bound 证明，但缺乏直接的实证数据表明高 NLL 步骤在 ALFWorld/WebShop 中确实对应高 local action-value variance，这使得核心机制在面对更复杂、uncertainty 与 criticality 不对齐的真实任务时面临直接失效的风险。\n\n### § 10 最小复现实验\n若有一周时间，最小复现实验应聚焦于验证“**收益来源于权重的正确放置，而非权重本身的变化**”这一核心 claim。使用 ALFWorld benchmark 和 Qwen2.5-1.5B-Instruct 模型，基于已有的 GiGPO 框架实现三个变体进行对比：一是固定权重基线（$\\lambda_0=0.5$，无 modulation），二是完整的 GACA（基于 NLL 的 adaptive modulation），三是 Random permutation 控制（保持 GACA 计算出的 per-step 权重集合，但随机打乱其分配给各步的顺序）。训练 50 个 epochs 并在 128 个 held-out 评估任务上测量 success rate。如果完整 GACA 的 success rate 显著高于固定权重基线，且 Random permutation 变体的表现不仅低于 GACA，甚至低于固定权重基线，则强有力地支持了论文的 claim；如果 Random permutation 表现与完整 GACA 相当，则反驳了 criticality-adaptive granularity 的有效性，说明性能提升仅仅来自于引入了 advantage magnitude 的方差扰动。", "research_value": "### § 11 最强反例设计\n\n要构建对 GACA 最致命的反例，我们需要直接攻击其最脆弱的假设：**policy 的 NLL 与 step 的实际 causal criticality 之间存在系统性脱节**。具体而言，我会在一个“policy 高度自信但错误，或高度困惑但无关紧要”的 long-horizon agent 任务上设计实验。例如，引入一个多阶段 reasoning 与 tool-use 交织的 benchmark（如修改版的 SciBench 或带有 deceptive traps 的 ALFWorld 变体）：在任务早期，agent 需要做一个反直觉但决定全局成败的 branching decision（例如，忽略看似最相关的工具而选择一个冷门工具），此时 well-pretrained LLM 的 policy 在该步的 NLL 极低（因为预训练分布使其对该错误选择极度自信）；而在任务后期，agent 需要执行一系列繁琐的文本生成与格式化操作，这些步骤对最终 return 几乎无影响，但由于涉及生僻 token 组合，policy 的 NLL 极高。在这种分布下，GACA 的机制会完全倒置：它在真正关键的早期 branching decision 处因低 NLL 而回退到 low-variance 的 episode-level advantage $A^E$，剥夺了该步亟需的 fine-grained step-level signal 以纠正其“自信的错误”；同时，它在无关紧要的后期 routine 步骤处因高 NLL 而过度放大 step-level advantage $A^S$，将大量 estimation noise 注入 gradient。这一反例不仅提供了对原文结果的替代解释——即 GACA 在 ALFWorld 和 WebShop 上的成功仅仅是因为这些 benchmark 恰好满足“高 NLL 等价于高 criticality”的分布，而非其具有普适的 credit assignment 能力——而且精确识别了方法可预测地失效的条件：当 LLM 的 prior knowledge 与 task 的 optimal action distribution 产生错位时，NLL 作为 criticality proxy 会系统性地抑制探索并放大噪声。\n\n### § 12 Follow-up Research Idea\n\n基于 GACA 将 policy uncertainty 作为 criticality proxy 的根本局限，我提出一种全新的 framing：**Causal Influence-Adaptive Credit Assignment (CIACA)**，将 credit assignment 的粒度从“policy 内部的不确定性”转向“action 对未来 trajectory 的因果扰动能力”。这一想法的驱动需求是：真正的 step criticality 不应由 policy 是否困惑来定义，而应由该 step 的 action 能在多大程度上改变后续 state distribution 及 final return 来定义；NLL 是一个 myopic 且 policy-dependent 的代理，当 policy 本身存在 bias 时，NLL 会彻底失效。\n\n为实现这一目标，我们可以借鉴因果推断领域的 **Counterfactual State Divergence** 工具。具体而言，在 group rollout 中，当我们对处于同一 anchor state $z$ 的 step 分配 step-level advantage 时，不再看其 NLL，而是计算该 step 采取不同 canonical action 后，后续 $k$ 步的 observation embedding 的方差或 Wasserstein 距离。如果不同的 action 导致后续 state 迅速发散，说明该 step 具有高 causal leverage，应赋予更高的 step-level signal 权重；如果不同 action 导致后续 state 依然收敛于同一子空间，说明该 step 是 near-deterministic transition，应回退到 episode-level signal。这种方法无需引入 critic，仅利用 rollout 中已生成的 observation 序列计算 counterfactual state divergence。\n\n第一个实验将设计一个“NLL 与 causal influence 解耦”的 diagnostic environment：例如一个迷宫导航任务，其中某些路口只有一条通道（低 causal influence），但由于文本描述复杂导致 policy 难以理解（高 NLL）；而另一些路口有多条通道但文本描述极简（高 causal influence，低 NLL）。我们将对比 GACA（NLL-driven）与 CIACA（Causal-driven）在 sample efficiency 和 final success rate 上的表现。如果 CIACA 能够在 policy prior 与 task structure 错位的场景下依然保持高效的 credit assignment，而 GACA 出现显著的性能崩塌，即可证明从 policy uncertainty 到 environment causal influence 的范式转移是解决 long-horizon credit assignment 的更优路径。这与现有工作的根本区别在于：GACA 和 GiGPO 都在 policy 的输出分布上做文章，而 CIACA 首次将 credit resolution 的自适应权重建立在 environment dynamics 的反事实发散度上。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Taoran Liang\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Yang Liu\", \"affiliations\": [3], \"markers\": [\"*\"]},\n    {\"name\": \"Shang Luo\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yingguang Yang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Rongrong Zhang\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Yingzong Min\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Yulin Huang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Jianshen Zhang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Yongzhi Qi\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Kefu Xu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Congjing Ran\", \"affiliations\": [5], \"markers\": []},\n    {\"name\": \"Bin Chong\", \"affiliations\": [2], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Nankai University\"},\n    {\"id\": 2, \"name\": \"Peking University\"},\n    {\"id\": 3, \"name\": \"Supply Chain Tech Team Y, JD.com\"},\n    {\"id\": 4, \"name\": \"Shanghai Waybot Technology Co., Ltd.\"},\n    {\"id\": 5, \"name\": \"Wuhan University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "Reinforcement learning 现在是训练 large language model agents 处理 long-horizon tasks 的标准方法，在这些任务中，数十个相互依赖的动作之后才会产生一个单一的 sparse reward。诸如 GRPO 之类的 Critic-free, group-relative methods 适用于这种场景，但它们将一个 trajectory-level scalar 广播到每一步，无法说明是哪个决策导致了最终结果。GiGPO 通过对共享同一 anchor state 的 time steps 进行分组来恢复 step-level signal，但它在一个 fixed weight 下合并了 step-level 和 episode-level estimates，在 pivotal branching decision 和 routine, near-deterministic transition 上花费了相同的 resolution。我们认为正确的 resolution 应当是 state-dependent 的，并提出 GACA，一种 granularity 遵循 uncertainty-based criticality proxy 的 critic-free estimator。GACA 根据其自身 rollout 已记录的 negative log-likelihood 对每一步进行评分，然后使用一个随该评分增长的 per-step weight 融合这两个 advantages，使得 gradient 在 above-average NLL 时将更多权重置于 fine-grained signal 上，而在低于平均 NLL 时将更多权重置于 episode-level signal 上。我们为所实现的 mixture 推导出了 exact risk decomposition，并证明在 positive directional alignment 下，sufficiently small modulation 优于 fixed mixing。一个单独的 conditional result 使用 expected NLL 界定了 local action-value variation，而 error-projection analysis 则刻画了 mixing 何时能在 scalar uncertainty reweighting 之外增加价值。在 ALFWorld 和 WebShop 上，GACA 在 1.5B 和 7B scales 上的 task success 均优于 GRPO 和 GiGPO。"}, {"title": "From Collaboration to Capability: Internalizing Routed LLM Experts into Compact Reasoners", "arxiv_id": "2609.12578", "authors": "Frank Nie, Shuyao Wang, Ethan B. Liu", "summary": "A compact controller can coordinate stronger experts by selecting whom to consult, formulating requests, and integrating their responses. We study whether learning from both the controller's decisions and the experts' reasoning and code improves its generation after expert removal. We introduce \\textsc{Rivet} for \\emph{collaboration internalization}: expert-augmented reinforcement learning applies a shared outcome signal to controller decisions and returned expert spans, and verified trajectory internalization consolidates complete successful interactions through format-aware supervised training. The deployed controller generates reasoning, code, and interaction structure with local Python execution and no external LLM. Across seven competition-mathematics benchmarks, RIVET-1.7B and RIVET-4B achieve average accuracies of $28.25\\%$ and $44.16\\%$; Stage~II improves RIVET-4B's accuracy after expert removal by $6.49$ points, and GPQA-Diamond results provide evidence of generalization to scientific reasoning. Ablations show gains from ordinary trajectory supervision and additional format weighting, supporting the effectiveness of training on the content and structure of verified collaborations.", "category": "cs.AI", "cluster": "Agent Training \u0026 Adaptation", "tags": ["cs.AI"], "filter_reason": "该论文的核心贡献是提出一种将多专家协作内化到紧凑推理器中的方法（Rivet），通过专家增强的强化学习和格式感知的监督训练，使模型在移除外部专家后仍能保持甚至提升推理能力。这直接涉及“自我演化”机制——模型从协作轨迹中学习并改进自身能力，属于“LLMs Improving LLMs”和“Self-Improving”的前沿方向。同时，论文的研究对象明确是智能体（控制器作为智能体，协调专家），且涉及多智能体协作的内化，而非仅讨论拓扑或通信协议。因此，它完全符合我的研究焦点：构建和改进LLM智能体，特别是自我演化机制。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：一个 compact controller（小型语言模型）在通过 routing 协调更强的 LLM experts 完成任务后，能否通过学习其自身的控制决策以及 experts 返回的 reasoning 和 code，在移除外部 experts 的情况下，独立生成高质量的推理与代码？这一问题被作者定义为 collaboration internalization。其重要性在于，当前小型模型虽能通过调用外部大模型显著提升任务表现，但在实际部署中长期依赖外部 LLM 会带来高昂的计算成本、延迟以及系统复杂性。如果 controller 能够将协作过程中从 experts 获得的推理能力和代码生成能力内化到自身参数中，就能在无外部 LLM 的部署环境下独立运行，同时保持接近协作时的性能水平。这对于在资源受限场景下部署具备 tool-integrated reasoning 能力的高效模型具有显著的实际价值。\n\n### § 2 前人工作与不足\n\n该问题此前未被直接解决。现有研究主要分为三条路线，各自存在关键不足。第一，Tool-integrated reasoning 和 agentic reinforcement learning 方法（如 ReTool、ToRL、TRICE）主要训练 policy 与功能性工具（如 Python 执行器）的交互，但未将其他 LLMs 视为可选择的任务解决监督来源，因此无法内化 expert 的推理内容。第二，Model routing 和 multi-agent orchestration 系统（如 RouteLLM、Router-R1、ToolOrchestra）虽然能选择和组合不同 LLMs 以优化推理质量或成本，但它们将外部模型视为黑盒工具：Router-R1 在 RL 训练中明确将 routed-model 的输出从 training loss 中 mask 掉，ToolOrchestra 仅通过 outcome 和 efficiency rewards 协调模型，两者均未将 expert 返回的 reasoning 和 code 纳入 controller 的直接训练目标，导致 controller 只学会了\"何时调用谁\"，却未学会\"如何生成专家的推理\"。第三，Distillation 方法（如 Agent Distillation、On-policy distillation、SOD）虽能转移推理能力，但通常使用单一 teacher 或独立生成的轨迹进行训练，未在 controller 自身求解过程中产生的协作轨迹上同时训练 control decisions 和 expert content 的顺序关系。根本原因在于，同时更新协作交互的两侧面临两个未被前人明确界定和解决的挑战：一是需要为外部生成的 spans 分配学习信号，而传统 RL 仅更新 controller tokens；二是需要将请求、expert 响应和后续决策作为完整交互进行整合，而现有 distillation 方法缺乏对这种 sequential relationship 的结构化监督。", "core_insight": "### § 3 重建作者的思考路径\n\n在 RIVET 之前，利用外部 LLM experts 增强小型 controller 模型的推理能力通常依赖于 model routing 或 multi-agent orchestration。这些方法在 inference 阶段虽然有效，但一旦移除外部 experts，controller 的性能会急剧下降，因为它只学会了“何时以及向谁求助”，却没有学会“如何像 expert 那样推理和写代码”。传统的 agent distillation 或 on-policy distillation 虽然能转移推理行为，但往往只关注 teacher 生成的轨迹，而忽略了 controller 在交互过程中的主动决策（如选择 expert、生成请求）与 expert 返回内容之间的序列依赖关系。\n\n作者观察到，一个 collaborative trajectory 实际上包含两个紧密相连的监督信号源：controller 的 control decisions 和 expert 返回的 expert content。如果在 RL 训练中只更新 controller tokens，那么 expert 返回的高质量推理和代码就游离于训练目标之外，造成信息浪费；同时，稀疏的 final-answer reward 在长轨迹上容易导致 policy entropy collapse。为了解决这一问题，作者想到在 GRPO 阶段，将同一个 trajectory outcome advantage 同时分配给 controller tokens 和 expert tokens。这不仅让 controller 学习路由和决策，还通过 advantage-weighted online distillation 将 expert 的推理和代码能力转移给 controller。\n\n然而，仅靠 RL 阶段的更新还不足以在部署时完全摆脱外部 experts，因为 rollout 仍然依赖外部模型。为了实现真正的 internalization，作者进一步提出在 RL 阶段后冻结 policy，收集那些成功、完整且符合协议的交互轨迹。随后，通过 format-aware supervised fine-tuning，将这些轨迹中的请求、expert 的推理与代码以及后续的 controller 决策全部作为 controller 的预测目标，而将 Python 执行结果保留为环境观察。通过对 tool-call 结构施加额外权重，确保 controller 能准确生成交互格式。这样，部署时 controller 就能在同一个 decoding stream 中自主生成推理、代码和交互结构，仅需 local Python 执行，彻底摆脱对外部 LLM 的依赖。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 是：不要只让 controller 学习“如何调用 expert”，还要让它学习“expert 是如何思考和写代码的”。通过在 RL 阶段将 outcome reward 同时分配给 controller 的决策和 expert 的输出，并在 SFT 阶段将完整的成功交互（包括 expert 的推理和代码）作为 controller 的预测目标，就能将 expert 的能力内化到 controller 自身。这样，部署时移除外部 expert 后，controller 依然能独立生成高质量的推理和代码，仅依赖本地 Python 执行。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n Problem x\n    │\n    ▼\n Controller πθ ──calls──► Frozen Experts E (3 models)\n    │                           │\n    ▼                           │\n Collaborative Trajectories ◄──┘\n    │\n    ├─ Stage I: Expert-augmented GRPO\n    │  shared advantage A_i on ctrl+expert tokens\n    │      │\n    │      ▼\n    │   C_RL ──freeze──► Collect verified traces D_ver\n    │                         │\n    │                    Stage II: Format-aware SFT\n    │                    L = L_CE + λ_fmt·L_fmt\n    │                         │\n    │                         ▼\n    │                      C_int (no external LLM)\n    │                         │\n    │                    Local Python only\n    │                         ▼\n    │                    Final Answer\n    │\n    └─ C_RL + Experts = collaborative mode (reference)\n```\n\n**Stage I：Expert-augmented GRPO（§3.3）**\n\n输入为问题 $x$，controller $\\pi_\\theta$ 从 base model $M_0$ 初始化。在 rollout 过程中，controller 可以独立推理，也可以从统一工具集 $U$ 中调用工具——每个 frozen expert 暴露两个工具：`think`（返回推理）和 `code_interpreter`（请求 expert 生成代码并在 sandbox 中执行后返回反馈）。三个 frozen expert 分别是 Qwen3.5-9B、Qwen3-8B 和 Qwen2.5-Coder-7B-Instruct。每个问题采样 $G=8$ 条轨迹，轨迹结束时给出基于最终答案正确性的 sparse reward。关键创新在于：计算 group-relative advantage $A_i$ 后，该标量 advantage 被广播到轨迹中的所有 trainable token——不仅包括 controller 生成的 token（mask $m^{ctrl}$），也包括 expert 返回的推理和代码 token（mask $m^{exp}$），而 Python 执行输出作为环境观测被 mask 掉。对 expert-origin token，其 teacher-forced likelihood 是在 pre-update controller 下计算的，而非在 frozen expert 下，因此这一项本质上是 advantage-weighted online distillation，而非对 expert policy 的 importance sampling。输出为 Stage-I controller $C_{RL}$。此阶段同时从成功和失败轨迹中学习。\n\n**Stage II：Verified Trajectory Internalization（§3.4）**\n\n输入为冻结的 $C_{RL}$ 和训练集。冻结 $C_{RL}$ 后，对每个训练问题用相同的工具集生成 8 条协作轨迹，经过严格过滤：仅保留完整、协议合规、最终答案正确且可解析、Python 执行有效、无严重重复或退化调用循环的轨迹。当多条轨迹满足条件时，优先选择工具调用更少的候选。去重和人工审查后，每个问题最多保留 2 条轨迹，最终得到 $D_{ver}$（4B 版 12,000 条，1.7B 版 10,000 条）。训练时，supervised sequence 将 controller 的请求、expert 返回的推理和代码、以及最终答案都作为 prediction target（$m^{sft}=1$），而问题 token 和 Python 执行输出作为上下文（$m^{sft}=0$）。缺失或自由格式的 instruction 被替换为固定的 tool-specific 模板。Loss 由两部分组成：masked next-token cross-entropy $L_{CE}$ 和对 tool-call format token（分隔符、工具标识符、必需参数字段）施加额外权重的 $L_{fmt}$，组合为 $L = L_{CE} + \\lambda_{fmt} \\cdot L_{fmt}$。输出为 internalized controller $C_{int}$。\n\n**推理与评测（§3.4, §4.1）**\n\n两种推理模式：collaborative mode 中 $C_{RL}$ 使用 expert-backed 工具，作为 expert-assisted 参考；internalized mode 中 $C_{int}$ 不调用任何外部 LLM，仅由本地 Python sandbox 执行 controller 自身生成的代码，这是主要部署设置。expert-removal diagnostic 则在 $C_{RL}$ 上禁用外部 expert 但保留本地 Python，与 $C_{int}$ 对比以衡量 Stage II 的增益。评测覆盖七个竞赛数学 benchmark（AIME 2024–2026、HMMT 2025、BeyondAIME、IMO-AnswerBench、APEX 2025）和 GPQA-Diamond 科学推理 benchmark。\n\n### § 6 核心数学推导\n\n论文的核心数学推导集中在 Stage I 的 Expert-augmented GRPO 和 Stage II 的 format-aware SFT 损失函数上。\n\n**Outcome-based reward（Eq. 1）。** 对每个问题采样 $G$ 条轨迹 $\\{\\tau_i\\}_{i=1}^G$，对轨迹 $\\tau_i$ 的最终答案 $\\hat{y}_i$ 给出 reward $R_i$。这是一个 0/1 sparse reward——仅当最终答案正确时为正，没有对工具调用的 intrinsic bonus。Intuition：工具调用本身不获得直接奖励，其价值只能通过整条轨迹的最终结果来体现，这避免了 controller 学会无意义地频繁调用工具。\n\n**Group-relative advantage（Eq. 2）。** $A_i = (R_i - \\mu_G) / \\sigma_G$，其中 $\\mu_G$ 和 $\\sigma_G$ 是同一问题 $G$ 条轨迹 reward 的均值和标准差。Intuition：不使用绝对 reward 值，而是衡量某条轨迹相对于同组其他轨迹的优劣。如果一个问题大部分轨迹都答对，单条正确轨迹的 advantage 接近零；如果大部分都答错，一条正确轨迹获得大正 advantage。这自然地分配 credit，无需 value function。\n\n**Dual-clipped surrogate 与 Stage I loss（Eq. 3–6）。** 使用 PPO 的 clipped surrogate $s(\\rho, A) = \\min(\\rho A, \\text{clip}(\\rho, 1-\\epsilon, 1+\\epsilon)A)$，并加上 dual-clip 机制（参数 $c=3$）防止 advantage 为负时 ratio 过大导致的不稳定更新。关键设计在训练 mask：$m^{train}_{i,t} = m^{ctrl}_{i,t} + m^{exp}_{i,t}$，即 controller token 和 expert token 都参与 loss，而 Python 执行输出被排除。Loss 对所有 trainable token 做 token-mean normalization，不附加 KL 项。对 expert-origin token，分母中的 teacher-forced likelihood 是在 pre-update controller 下计算的——这意味着 loss 项 $\\rho \\cdot A$ 中的 $\\rho = \\pi_\\theta(y_{i,t}|h_{i,t}) / \\pi_{\\theta_{old}}(y_{i,t}|h_{i,t})$ 衡量的是 controller 对 expert 生成内容的似然变化，而非 expert policy 的 importance sampling。Intuition：当一条轨迹最终成功（$A_i \u003E 0$），controller 被鼓励提高生成类似 expert 推理和代码的概率；当失败（$A_i \u003C 0$），则降低。这实现了在 controller 自身参数空间中的 advantage-weighted distillation。\n\n**Stage II format-aware loss（Eq. 7–9）。** $L_{CE}$ 是标准 masked next-token cross-entropy，对 controller span、tool-call 结构、expert 推理/代码和最终答案计算 loss，对问题 token 和执行输出 mask 掉。$L_{fmt}$ 对 tool-call format token 的位置集合 $\\Omega_{fmt}$ 额外加权。组合 loss $L = L_{CE} + \\lambda_{fmt} \\cdot L_{fmt}$。Intuition：普通 SFT 让 controller 学会生成完整交互序列的内容，而 format weighting 确保工具调用的结构标记（如 JSON 分隔符、工具名、参数字段）被准确生成——这些 token 虽少但对维持 Python 执行接口至关重要。$\\lambda_{fmt}=0.5$ 在实验中表现最优。\n\n### § 7 实验设计与结论\n\n论文围绕四个核心问题设计实验：\n\n**问题 1：移除外部 expert 后，controller 性能下降多少？Stage II 能否恢复？** 设计了 expert-removal diagnostic：将 Stage-I controller $C_{RL}$ 在禁用外部 expert 但保留本地 Python 的条件下评测，与 Stage-II controller $C_{int}$ 在相同接口下对比。结果显示 $C_{RL}$ 移除 expert 后平均数学准确率从 46.22% 降至 37.67%，存在 8.55 个百分点的差距；Stage II 将其提升至 44.16%，恢复了 6.49 个百分点。这表明 supervised internalization 能有效将协作中获得的推理和代码能力内化到独立生成中。\n\n**问题 2：Stage II 的哪些训练选择有效？** 设计了三组 ablation：普通 SFT（$\\lambda_{fmt}=0$）将准确率从 37.67% 提升至 40.90%（+3.23），加入 format weighting $\\lambda_{fmt}=0.5$ 进一步提升至 44.16%（+3.26），而更强的 $\\lambda_{fmt}=1.0$ 降至 42.64%。此外，一个全程不使用外部 expert 的变体仅达 38.16%，比完整 RIVET 低 6.00 个百分点。结论是：对完整成功交互的轨迹监督和对 tool-call 结构的适度加权都贡献了显著增益，且 expert 协作阶段产生的训练信号不可替代。另一个 ablation 比较了包含/不包含 expert-span loss 的 controller entropy 变化，显示包含 expert-span 更新能维持更高的 policy entropy，缓解过早收敛。\n\n**问题 3：协作策略如何影响最终内化性能？** 比较了三种 Stage-I expert 选择策略：learned routing（RIVET 默认）、仅用 Qwen3.5-9B、随机选择。每种策略各自完成两阶段训练后评测。Learned routing 在 Stage I 协作模式下达 46.22%，Stage II 内化后达 44.16%，均优于另两种策略（Qwen3.5-9B only 为 44.41%/42.08%，random 为 41.57%/39.03%）。结论是异构 expert 的学习性路由不仅提升了协作时性能，也通过更优的 Stage-II 初始化和训练轨迹提升了内化后性能。\n\n**问题 4：内化能力是否泛化到竞赛数学之外？** 在 GPQA-Diamond 科学推理 benchmark 上评测。RIVET-1.7B 达 44.95%，在 1.7–3B 组排名第一；RIVET-4B 达 61.62%，在 4–32B 组与 AEPO-8B 并列第一，且超过 ReTool-32B（46.97%）。两个模型均在无外部 LLM、仅本地 Python 的条件下取得这些结果，提供了从竞赛数学训练到科学推理的泛化证据。\n\n此外，论文还设计了 instance-level 的 retention/internalization 分析（Table 6），衡量 Stage II 保留了多少 Stage I 已能独立解决的案例（74.68–84.55%），以及恢复了多少原本依赖 expert 才能解决的案例（46.43–55.56%）；routing 分布分析（Figure 4）显示 controller 在不同 benchmark 上呈现差异化的 expert 和工具选择模式；call-budget 分析（Figure 5）表明 GPQA-Diamond 上一次 expert 调用即获得大部分增益，而 AIME 系列在更高预算下持续受益。", "additional_insights": "### § 8 Take-aways\nRIVET 提出了一种两阶段框架，将外部 LLM experts 的推理与代码生成能力内化到 compact controller 中。Stage I 采用 expert-augmented GRPO，将共享的 outcome advantage 同时分配给 controller decisions 和返回的 expert spans，使 controller 在 RL 过程中直接从专家输出中学习。Stage II 通过 verified trajectory internalization，利用 format-aware SFT 将完整且正确的协作轨迹整合进 controller，其中专家的 reasoning 和 code 成为预测目标，而 Python 执行结果保留为环境观察。部署时，内化后的 controller 无需外部 LLM，仅依靠本地 Python sandbox 即可独立生成推理、代码及交互结构。实验表明，RIVET-4B 在七个竞赛数学基准上达到 44.16% 的平均准确率，Stage II 在移除专家后带来了 6.49 个百分点的提升，并在 GPQA-Diamond 上证明了向科学推理的泛化能力。\n\n### § 9 最脆弱的假设\nRIVET 的核心假设是：compact controller 能够通过在协作轨迹上训练，直接内化并独立复现 heterogeneous experts 在特定上下文中生成的 reasoning 和 code，即使两者之间存在显著的 capability gap。如果这个假设不成立，controller 在部署时可能只是学会了专家的交互格式和表面模式，而无法生成真正有效的推理步骤，导致内化后的准确率大幅下降。在实际中，当 expert model（如 Qwen3.5-9B）的能力远超 controller（如 Qwen3-1.7B）时，直接将专家 token 纳入 student model 的 loss 计算可能面临分布不匹配和表征瓶颈，使得 student 难以吸收超出其容量的知识。论文提供的证据是 Stage II SFT 带来了 6.49 个百分点的准确率提升，且 ablation study 显示包含 expert spans 的训练维持了更高的 policy entropy。然而，论文缺少对内化后生成内容深度的定性分析，未证明 controller 是真正掌握了推理逻辑还是依赖于记忆化的模式匹配，也未探讨当使用能力差距更大的专家（如 70B 模型）时该假设是否依然有效。\n\n### § 10 最小复现实验\n在一周时间内，可以设计一个最小复现实验来验证 Stage II 中 format-aware SFT 对内化效果的贡献。使用 ToRL 数据集的一个子集（如 2000 个问题），利用一个较强的开源模型（如 Qwen2.5-7B-Instruct）作为 expert 生成带有 Python 工具调用的协作轨迹，筛选出答案正确且执行有效的轨迹作为训练数据。选择 Qwen3-1.7B 作为 base model，直接在这些筛选出的轨迹上进行 SFT，跳过计算成本高昂的 Stage I GRPO。实现两组对比：一组使用普通的 cross-entropy loss（$\\lambda_{fmt} = 0$），另一组使用 RIVET 的 format-aware loss（$\\lambda_{fmt} = 0.5$）。在 AIME 2024 测试集上评估两个模型在无外部 LLM、仅使用本地 Python sandbox 条件下的 Mean@8 准确率。如果 format-aware SFT 模型的准确率显著高于普通 SFT 模型，则支持论文关于 format weighting 能有效提升内化后独立推理能力的 claim；如果两者表现无异或普通 SFT 更好，则反驳该 claim。", "research_value": "### § 11 最强反例设计\n\n对 RIVET 最有力的攻击应直指其核心假设：compact controller 能够真正内化并独立复现远超其容量的大模型推理逻辑。我设计了一个基于“极端 capability gap 与分布外组合泛化”的反例实验，旨在证明 Stage II 带来的 6.49 个百分点提升并非源于“推理能力的内化”，而是源于对 expert 输出模式的“表面化模板记忆”。具体而言，将原论文中 7B-9B 级别的 experts 替换为一个 70B 级别的强推理模型（如 Qwen2.5-72B-Instruct），该模型倾向于生成高度抽象、多步嵌套的复杂 Python 代码来解决竞赛数学题。保持 controller 为 1.7B，完整执行 Stage I 和 Stage II。在 AIME 2024 上评估后，引入一个“结构扰动测试集”：对原测试题进行微小的语义保持变换（例如将物理情境从“两车相向”改为“两船相向”，但底层方程结构完全一致），使得正确解答需要重新组合而非直接套用先前的代码模板。如果 RIVET 的内化机制真正掌握了推理逻辑，controller 应能在结构扰动测试集上保持与原测试集相近的准确率；然而，如果 controller 仅是学会了根据特定问题特征映射到记忆中的 expert 代码骨架，它在扰动集上的性能将出现断崖式下跌。进一步的理论论证在于分析 controller 生成 token 的 semantic entropy：如果内化的是表面模式，当面临超出其表征瓶颈的 70B 模型代码时，controller 在关键计算步骤上的 token 级别不确定性将异常升高，且其生成的代码在抽象语法树（AST）结构上将与 expert 的高度同质化，但在变量状态追踪上出现隐性错误。这一反例直接挑战了论文的结论，提供了具体的替代解释：所谓的“内化”可能只是小型模型在容量极限下对高频成功轨迹的格式化拟合，而非对推理能力的真正吸收。\n\n### § 12 Follow-up Research Idea\n\n基于 RIVET 仅在过滤后的成功轨迹上训练、从而丧失了错误恢复能力的局限，我提出一个全新的研究方向：**Failure-Aware Internalization: Learning Self-Correction Dynamics from Expert Search Trees**。该想法的驱动需求在于，真实世界中的独立部署不仅需要生成正确的推理，更需要在本地代码执行失败或逻辑陷入死胡同时具备 self-correction 能力；RIVET 的 Stage II 严格过滤了退化或失败的轨迹，导致 internalized controller 只学会了“完美执行计划”，却从未学习 expert 在面对复杂问题时如何进行探索、试错与策略回溯。\n\n为解决这一问题，可以借鉴相邻领域 **Monte Carlo Tree Search (MCTS)** 中的 backpropagation 机制与 **Process Reward Models (PRMs)** 的细粒度评估逻辑。不再将 expert 视为单向的 token 生成器，而是将其建模为一个在推理状态空间中进行搜索的 agent。具体而言，在 Stage I 的协作轨迹收集阶段，不仅记录最终成功的轨迹，还刻意保留 expert 在 Python 执行报错后进行的代码修正、逻辑重构等“状态转移”片段。在 Stage II 的 internalization 阶段，设计一个基于状态转移的 contrastive learning 目标：将 expert 的“错误状态 -\u003E 修正状态”对作为正样本，将“错误状态 -\u003E 退化/重复状态”对作为负样本，训练 controller 在 latent space 中预测并生成修正动作，而非仅仅进行 next-token prediction。\n\n第一个实验将设计一个“错误注入评测协议”。使用 RIVET 的 1.7B controller 作为 baseline，与我的 Failure-Aware Internalization 模型对比。在推理阶段，当 controller 生成第一版代码后，人为注入一个语法或轻微逻辑错误（模拟环境噪声或自身失误），观察模型能否在后续生成中识别并修正。预期结果是，RIVET 模型由于只见过完美轨迹，遇到执行报错后会陷入重复生成或直接放弃；而我的模型由于内化了 expert 的搜索与回溯动态，能够利用本地 Python 的报错信息进行有效的 self-correction，从而在具有干扰的数学推理任务上展现出显著更高的鲁棒性。这一提议彻底改变了 RIVET 的训练范式，将目标从“模仿专家的正确答案”转移到“内化专家的问题求解动态过程”。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Frank Nie\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Shuyao Wang\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Ethan B. Liu\", \"affiliations\": [1], \"markers\": [\"*\", \"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Shandong University\"},\n    {\"id\": 2, \"name\": \"Zhejiang University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "紧凑的 controller 可以通过选择咨询对象、制定请求并整合其响应来协调更强的 experts。我们研究了在移除 experts 之后，同时从 controller 的决策以及 experts 的推理和代码中进行学习，是否能提升其生成能力。我们引入了 Rivet 用于 collaboration internalization：expert-augmented reinforcement learning 将共享的 outcome signal 应用于 controller 决策和返回的 expert spans，而 verified trajectory internalization 通过 format-aware supervised training 巩固完整的成功交互。部署的 controller 生成推理、代码和交互结构，具有本地 Python 执行能力且无需外部 LLM。在七个竞赛数学 benchmarks 上，RIVET-1.7B 和 RIVET-4B 取得了 28.25% 和 44.16% 的平均准确率；Stage II 在移除 experts 后将 RIVET-4B 的准确率提升了 6.49 个百分点，并且 GPQA-Diamond 的结果为向科学推理的泛化提供了证据。Ablations 显示了来自 ordinary trajectory supervision 和 additional format weighting 的增益，支持了在已验证协作的内容和结构上进行训练的有效性。"}]}, {"name": "Memory \u0026 Experience Management", "count": 3, "papers": [{"title": "LifeMem: Enabling Lifelong Experience Reuse for LLM Agents", "arxiv_id": "2609.12655", "authors": "Yuli Qiu, Yutong Li, Wei Su, Zeming Liu, Wanxiang Che, Heyan Huang, Haifeng Wang, Yuang Guo", "summary": "Large language model agents are expected to continuously adapt to new tasks and environments over their lifetime by reusing past experience. However, existing memory-based agents struggle to transfer reusable experience across environments and suffer from catastrophic forgetting as experience accumulated. To address these challenges, we propose LifeMem, a lifelong learning framework that enables agents to transfer knowledge across multiple environments. During learning, LifeMem clusters accumulated interaction trajectories based on underlying workflows to extract reusable skills. When solving a new task at inference time, the agent recalls relevant skills and trajectories to guide actions. To validate our method, we conduct experiments across 10 environments and over 13k tasks with 2k newly annotated interaction trajectories. Results show that LifeMem enables effective experience reuse in lifelong learning, achieving both reduced forgetting on learned tasks and superior cross-task transfer. Further analysis reveals that task streaming impacts learning, while consolidating structurally similar trajectories within memory boosts performance.", "category": "cs.CL", "cluster": "Memory \u0026 Experience Management", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文研究的核心问题是：LLM agents 在 lifelong learning 场景下，如何跨异构环境持续积累并复用经验，同时避免 catastrophic forgetting。具体而言，在 inter-environment setting 中，agent 依次遇到来自不同环境的任务序列，这些环境具有不同的 action space 和 observation space（如 embodied action、tool utilization、web search、data analysis、web browsing），agent 需要将过去交互中积累的 trajectories 转化为可迁移的经验，用于指导新任务的求解，同时不丧失对先前已学任务的记忆。这一问题的重要性在于，AGI 的实现要求 autonomous agents 能在其生命周期内持续适应多样化和不断演变的环境，而无需依赖环境特定的重新设计。现有 LLM agents 虽然在单一环境内已展现出较强的 task-solving 能力，但跨环境泛化仍是一个未解决的瓶颈。解决该问题能够带来两方面的价值：一是减少 agent 在学习新任务后对旧任务的遗忘，二是实现对未见领域（unseen domains）的有效 zero-shot cross-task transfer，从而为 agent 部署后的持续进化提供实用的 memory 管理与经验复用机制。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决。现有工作可分为两大类，各自存在结构性局限。**Internal-memory-based methods**（如 Yao et al., 2023; Qiao and Mahdavi, 2024）通过在预定义环境的 trajectories 上 fine-tune 模型来内化经验，但这种方式将知识固化于模型参数中，不仅限制了跨环境泛化，还带来高昂的训练成本，难以适应持续增长的任务流。**External-memory-based methods**（如 Xiang et al., 2024）维护外部经验数据库并检索相关 trajectories 以支持 in-context learning，但在跨异构环境场景下暴露出两个关键缺陷。第一类是 **trajectory-only retrieval** 方法，以 Synapse（Zheng et al., 2024）为代表，它抽象当前状态并检索语义相关的 raw trajectories 作为 in-context exemplars。然而，不同环境的 action space 往往不兼容，直接检索 raw trajectory 无法桥接这种 mismatch，导致检索到的经验无法有效指导动作生成；更严重的是，随着数据库增长，语义检索的准确性下降，早期环境的经验被淹没，引发 catastrophic forgetting。第二类是 **generic trajectory abstraction** 方法，以 ExpeL（Zhao et al., 2024a）和 AutoSkill（Yang et al., 2026）为代表，它们试图从 raw trajectories 中蒸馏 high-level skills 或 insights 以指导后续执行。但这些方法在无组织的全局经验池上直接进行抽象，不相关环境的 trajectories 被混入同一蒸馏过程，引入严重的跨环境噪声，导致生成的 skills 过于粗糙、缺乏代表性，无法精确指导新任务。Hermes 同样存在这一问题。这些不足的根本原因在于：先前方法要么仅依赖表面语义相似性组织经验，要么在无结构化的经验池上进行全局抽象，均未按底层 workflow 结构对 trajectories 进行聚类。而跨环境场景下，不同环境虽 action space 不同，却可能共享相同的底层执行逻辑——如果不先按 workflow 将结构相似的 trajectories 归入同一 cluster 再进行局部 skill 蒸馏，就无法避免跨环境噪声污染，也无法生成既具代表性又可迁移的 skills。", "core_insight": "### § 3 重建作者的思考路径\n\nLifelong learning 的核心诉求是让 LLM agent 在生命周期内持续适应新环境，而 inter-environment setting 带来的根本困难在于：不同环境拥有不同的 action space 和 observation space，使得在一个环境中积累的交互轨迹无法直接迁移到另一个环境。研究者首先观察到，现有的 external-memory-based 方法依赖语义相似性检索原始轨迹，但这种检索在跨环境场景下会失效——语义相似的轨迹可能来自完全不同的 action space，导致检索结果不仅无法指导行动，反而引入干扰。更严重的是，随着经验库不断增长，检索准确性持续下降，早期环境的经验被淹没，引发 catastrophic forgetting。\n\n面对这一问题，一个自然的思路是将原始轨迹抽象为 high-level skills，使其脱离具体的 action space 细节。然而，已有的 skill abstraction 方法（如 AutoSkill、ExpeL）在无组织的全局 memory pool 上直接提取技能，不同环境的异构轨迹被混合在一起，导致蒸馏出的技能被跨环境噪声污染，丧失代表性和可迁移性。研究者由此意识到，问题的症结不在于是否抽象，而在于在什么结构上抽象：如果能在蒸馏之前先将轨迹按底层执行逻辑组织起来，就能在每个结构化分组内部获得干净的、一致的技能。\n\n进一步的经验观察支持了这一判断：不同环境的任务虽然在表面语义和 action space 上差异巨大，但底层 workflow 往往共享相似的执行模式——例如 web search 和 fact verification 都遵循\"检索-定位-提取-回答\"的逻辑链条，embodied action 和 tool utilization 都涉及\"感知-规划-操作\"的循环。这意味着，如果按 workflow 而非语义相似性来组织 memory，就能将跨环境但逻辑同构的轨迹归入同一 cluster，从而在 cluster 内部蒸馏出真正 environment-invariant 的技能。同时，为了防止 cluster 随经验积累而变得过于异构，还需要一种自适应机制来监测 cluster 内部的结构多样性，并在必要时进行细粒度分区。\n\n最后，在推理阶段，研究者认识到单纯依赖抽象技能或单纯依赖原始轨迹都不够：技能提供跨环境的逻辑指导，但缺乏具体环境下的行为格式示范；原始轨迹提供精确的 action grounding，但无法跨环境迁移。因此，将两者结合——检索同环境的轨迹作为 behavioral exemplar，同时激活关联 cluster 的抽象技能作为 macro-guidance——才能同时实现精确的行为对齐和鲁棒的知识迁移。\n\n### § 4 核心 Intuition\n\n跨环境经验重用失败的根源在于：不同环境的 action space 不兼容，但底层执行逻辑是共享的。因此，不应在无组织的 memory pool 上直接检索或全局抽象，而应先将轨迹按底层 workflow 聚类，再在每个结构化 cluster 内局部蒸馏出 environment-invariant 的技能。推理时同时激活同环境的原始轨迹（提供 action format 示范）和跨环境的抽象技能（提供执行逻辑指导），从而既避免了 action space 干扰，又实现了知识迁移。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n                   LifeMem Pipeline\n================================================\n\n[初始 Trajectories]\n      │  LLM识别workflow模式\n      ▼\n┌───────────┐      ┌──────────────────┐\n│Memory Init│─────▶│Workflow Clusters │\n│  (§4.1)   │      │  {c1,...,cM}     │\n└───────────┘      └────────┬─────────┘\n                            │\n[新 Trajectory ξ]           │\n      │ top-k检索+LLM判定   │\n      ▼                     │\n┌───────────┐  加入/新建    │\n│Workflow   │──cluster─────▶│\n│Clustering │               ▼\n│  (§4.2)   │    ┌────────────────┐\n└─────┬─────┘    │Adaptive        │\n      │n\u003EL\u0026R\u003Cτ   │Partitioning    │\n      │触发分裂   └───────┬────────┘\n      ▼                  │\n┌───────────┐  LLM抽象   │\n│Skill      │◀───────────┘\n│Distillation│──▶Skills {s1,...,sM}\n│  (§4.2)   │   (env-invariant)\n└───────────┘\n\n══════════ Inference (§4.3) ══════════\n\n[新 Task T]\n   │\n   ├──▶top-k检索──▶Env-aligned\n   │                Trajectories\n   │                     │\n   │                     ▼\n   │              关联 Clusters Cξ\n   │                     │\n   │                     ▼\n   │              激活 Skills Sξ\n   │                     │\n   ▼                     ▼\n┌──────────────────────────┐\n│LLM Agent                 │──▶Action\n│输入: Trajs + Skills      │\n└──────────────────────────┘\n```\n\nLifeMem 的 pipeline 分为三个阶段：**Memory Initialization**、**Memory Evolution** 和 **Inference with Memory**。\n\n**Memory Initialization（§4.1）**：输入为一组初始 trajectories $\\{\\xi_0, \\ldots, \\xi_N\\}$，LLM 识别它们共有的 workflow 模式，将其划分为若干 workflow-level clusters $C = \\{c_1, \\ldots, c_M\\}$，并为每个 cluster 生成一句简洁描述 $d_i$，构成初始 memory。此处的关键设计是按底层 action workflow 而非表面 semantic similarity 进行分区，避免跨环境检索干扰。\n\n**Memory Evolution（§4.2）**：当新 trajectory $\\xi$ 到达时，系统首先从 memory 中检索 top-$k$ 相关 trajectories 并收集其所属 clusters $C_\\xi$，然后由 LLM 判定 $\\xi$ 应加入某个现有 cluster 还是创建新 cluster。随着经验积累，单个 cluster 可能涵盖异质行为，此时引入基于 Mean Resultant Length (MRL) 的 geometric diversity constraint：当 cluster 内 trajectory 数量 $n \u003E L$ 且方向集中度 $R \u003C \\tau_{mrl}$ 时，将该 cluster 分裂为更细粒度的 sub-clusters。在 cluster 结构稳定后，**Skill Distillation** 模块对每个 cluster $c_i$ 通过 LLM prompting 函数 $f(\\cdot)$ 抽象出 environment-invariant 的高层 skill $s_i$，捕获共享约束、逻辑依赖和泛化执行原则，与底层环境细节解耦。最终 memory 形成层次结构 $M = \\{(c_i, d_i, s_i)\\}$。\n\n**Inference with Memory（§4.3）**：面对新 task，系统采用 dual-tier 机制：第一层从 memory 中检索 top-$k$ 条与当前环境 $E$ 对齐的 historical trajectories，提供具体的 environment-aligned 操作范例；第二层根据这些 trajectories 关联的 workflow clusters 激活对应的 abstracted skills，提供跨环境可迁移的执行逻辑。Agent 最终以 $M_{act} = (\\{\\xi^{[j]}\\}_{j=0}^{k-1}, S_\\xi)$ 为条件生成 action $a_t \\sim P_\\theta(\\cdot | o_t, g, M_{act})$，同时受益于精确的行为示范和可迁移的 skill 抽象。\n\n### § 6 核心数学推导\n\n本文的核心数学内容集中在 §4.2 的 **Adaptive Partitioning** 机制中，使用了方向统计学中的 Mean Resultant Length (MRL)。\n\n**背景与 intuition**：当一个 workflow cluster 积累了大量 trajectories 后，可能开始包含异质行为，导致 skill 抽象的代表性下降。需要一个量化指标来判断 cluster 内部是否已经过于\"分散\"，从而决定是否需要分裂。MRL 正是衡量一组单位向量集中程度的经典统计量。\n\n**具体推导**：给定 cluster $c$ 包含 $n$ 条 trajectories，首先将每条 trajectory 的 embedding 归一化为单位向量 $\\mathbf{x}_i$（$\\|\\mathbf{x}_i\\| = 1$）。方向集中度定义为所有单位向量的均值向量的模长：\n\n$$R = \\left\\| \\frac{1}{n} \\sum_{i=1}^{n} \\mathbf{x}_i \\right\\|$$\n\n**Intuition**：如果 cluster 内所有 trajectories 的 embedding 方向高度一致（即 workflow 高度相似），则向量求和后几乎不抵消，$R \\to 1$，表示高冗余；如果 trajectories 行为多样、embedding 方向分散，则向量求和时大量抵消，$R$ 值降低，表示行为多样性高。\n\n**分裂条件**：当且仅当同时满足两个约束时才触发分裂——体量阈值 $n \u003E L$（cluster 足够大）和多样性约束 $R \u003C \\tau_{mrl}$（行为确实发散）。这确保分裂仅在真实行为分歧时发生，避免过度碎片化。论文实验中取 $L = 50$，$\\tau_{mrl} = 0.95$。\n\n此外，memory 的形式化定义为 $M = \\{(c_i, d_i, s_i)\\}$，其中 skill 映射 $s_i = f(c_i)$ 通过 LLM prompting 实现；推理时的 activated memory 为 $M_{act} = (\\{\\xi^{[j]}\\}_{j=0}^{k-1}, S_\\xi)$，action 生成服从 $a_t \\sim P_\\theta(\\cdot | o_t, g, M_{act})$。这些是功能性定义而非推导型公式。\n\n### § 7 实验设计与结论\n\n**问题 1：LifeMem 在跨环境 lifelong learning 中是否优于现有 memory-based 方法？**\n论文在 5 类 agent 场景（embodied action、tool utilization、web search、data analysis、web browsing）的 10 个环境、13k+ tasks 上，以 GPT-4o-mini、Deepseek-v3.2-exp、Qwen3-32b 为 backbone，对比 ReAct（memory-free）、Synapse（trajectory 检索）、ExpeL（insight 蒸馏）、AutoSkill（global skill 蒸馏）四个 baseline，评测 Overall Performance 和 Backward Transfer 两个指标。**答案**：LifeMem 在所有模型上均取得最高 Overall Performance（如 GPT-4o-mini 从 28.84 提升至 44.13），且是唯一在所有模型上实现正向 Backward Transfer 的方法（+5.66、+3.11、+6.68），表明其既减少了 catastrophic forgetting 又实现了有效的 cross-task transfer。\n\n**问题 2：Trajectories 和 skills 各自对性能的贡献如何？**\n通过 ablation study（Table 3），分别测试仅提供 trajectories、仅提供 skills、以及两者联合的配置。**答案**：两者均提供正向贡献——trajectories 提供原始操作格式示范，skills 提供宏观执行指导，联合配置最优。即使仅用 GPT-4o-mini 抽取 skills，LifeMem 仍大幅超过 baseline，且超过 GPT-4.1 的 vanilla 性能，证明核心增益来自经验复用机制而非更强的 LLM。\n\n**问题 3：LifeMem 能否实现 zero-shot 跨任务迁移？**\n在两个场景中测试：同一环境下的未见任务形式（HotpotQA 环境评测 FEVER 事实验证）和相似任务形式下的未见环境（$\\tau$-bench retail 迁移至 airline）。**答案**：LifeMem 在两个场景上均实现显著提升（FEVER 上 GPT-4o-mini 提升 22.5%，airline 上提升 18.8%），而 baseline 方法因 semantic shift 或 domain gap 出现性能下降甚至负迁移，验证了 environment-invariant skills 的跨域泛化能力。\n\n**问题 4：Task streaming 策略如何影响经验复用？**\n对比 similarity（同类任务顺序学习）、random（完全打乱）、buffer-based（随机流经小型缓存稳定后提交）三种 task stream。**答案**：Similarity stream 最优，因为结构相似任务的连续学习减少了检索干扰；但 buffer-based 策略可恢复 random stream 下大部分性能退化（GPT-4o-mini 恢复 44.7%，Deepseek 恢复 64.9%），表明 LifeMem 在非结构化真实场景中仍具鲁棒性。\n\n**问题 5：仅升级检索组件能否弥补 baseline 与 LifeMem 的差距？**\n在 Synapse 上替换更强的 embedding 模型和加入 re-ranking 机制。**答案**：升级 embedding 仅带来边际提升，re-ranking 反而严重损害性能，因为现成 re-ranking 模型优化的是文本相关性而非 agent trajectory 间的行为逻辑对齐。这验证了 LifeMem 层次化 skill 抽象的架构必要性——问题不在检索精度，而在 memory 的组织方式。", "additional_insights": "### § 8 Take-aways\n\nLifeMem 针对 LLM agent 在 inter-environment lifelong learning 中的 experience reuse 问题，提出将异构环境的 interaction trajectory 按 underlying workflow 聚类而非按 surface semantic similarity 检索，再从每个 workflow cluster 中局部蒸馏 environment-invariant skill，形成 trajectory + skill 的双层 memory 结构。该方法的核心洞察是：跨环境经验复用的瓶颈不在 retrieval 精度（Table 7 证明换更强 embedding 或加 re-ranking 反而有害），而在于 memory 的组织方式——unstructured memory pool 会导致 cross-environment noise 污染蒸馏出的 skill。实验在 10 个环境、13k+ 任务上验证，LifeMem 在三个 backbone 上均取得最优 overall performance 和唯一为正的 backward transfer 值，说明结构化 memory 同时缓解了 catastrophic forgetting 并促进了正向迁移。Ablation（Table 3）揭示 env-aligned trajectory 提供动作格式示范，abstracted skill 提供宏观策略指导，两者互补缺一不可；且用弱模型（GPT-4o-mini）蒸馏 skill 仍能显著超越强模型（GPT-4.1）的 vanilla 表现，说明增益来自经验复用机制本身而非蒸馏模型的能力。Zero-shot transfer 实验（Table 4）表明 skill 层在 unseen task formulation 和 unseen environment 下均有效，而 raw trajectory retrieval 在这些场景下反而有害。Task stream 分析（Table 5）指出 similarity-based 顺序最优，但 buffer-based 策略可在 random stream 下恢复 44.7%–64.9% 的性能退化，提供了实际部署的鲁棒性保障。\n\n### § 9 最脆弱的假设\n\nLifeMem 最核心且失败代价最大的假设是：LLM 能够可靠地按 underlying functional workflow 而非 surface semantic similarity 将来自异构环境的 trajectory 聚类到正确的 cluster 中。整个框架的 skill distillation、cross-environment transfer、forgetting 缓解全部依赖这一步聚类结果的正确性——如果 LLM 将语义相似但 workflow 不同的 trajectory 归入同一 cluster，蒸馏出的 skill 就会被 cross-environment noise 污染，方法直接退化为论文所批评的 \"generic trajectory abstraction\" 基线。\n\n这个假设在实际中可能不成立的原因有三：第一，LLM 在判断 workflow alignment 时需要理解 trajectory 的 action-observation 序列背后的功能逻辑，但不同环境的 action space 和 observation format 差异巨大（如 AlfWorld 的离散文本动作 vs. Mind2Web 的 HTML 元素操作），LLM 可能退化为依赖 task description 的语义相似度来判断；第二，论文用 GPT-5-mini 做聚类分配（§5.4），这是一个轻量模型，其推理能力是否足以胜任跨域 workflow 识别存疑；第三，当两个环境的 workflow 部分重叠但存在关键差异时（例如 HotpotQA 和 FEVER 都用 Wikipedia search 但验证逻辑不同），硬性归入同一 cluster 会丢失关键区分。\n\n论文提供的证据是 Appendix I 中人工评估的 91% workflow purity，但这个证据有三个缺口：仅基于 sampled cluster 而非全量评估；annotator 判断 \"dominant workflow\" 本身带有主观性；且实验环境是研究者精心挑选的 5 类场景，可能天然存在 workflow 重叠，不能代表真实部署中环境高度异构的情形。论文缺少对聚类错误如何传播到下游 skill 质量和最终任务表现的 sensitivity analysis。\n\n### § 10 最小复现实验\n\n在一周时间内，可以验证 LifeMem 最关键的 claim：**按 workflow 聚类后蒸馏的 skill 比直接从 unorganized memory pool 全局蒸馏的 skill 更具代表性和迁移性**。具体方案如下：\n\n选取两个环境——HotpotQA（web search）和 APIBank（tool utilization），各收集 50 条成功 trajectory（可用 GPT-4o-mini 在 ReAct 框架下生成）。然后构建三种 skill 来源：（A）AutoSkill 式全局蒸馏，将全部 100 条 trajectory 喂给 LLM 提取 3–5 条 skill；（B）LifeMem 式分簇蒸馏，先用 LLM 将 trajectory 按 workflow 分为 2–4 个 cluster，再从每个 cluster 分别蒸馏 skill；（C）随机分簇蒸馏作为 control，将 trajectory 随机分成相同数量的 cluster 后分别蒸馏。在 FEVER（unseen task formulation，与 HotpotQA 共享 Wikipedia 环境但任务逻辑不同）上用 GPT-4o-mini 测试三种 skill 的 zero-shot transfer 效果，每组 50 个 test instance。\n\n测量指标为 Exact Match accuracy。如果 B 显著优于 A 和 C，则支持 LifeMem 的核心 claim——结构化聚类是 skill 质量的关键，而非蒸馏过程本身。如果 A 与 B 无显著差异，则说明在环境数量少时聚类收益有限，LifeMem 的优势可能需要更多环境才能体现。如果 C 与 B 相当甚至更优，则直接反驳聚类需基于 workflow alignment 的假设，说明任意分簇即可获得蒸馏收益。这个实验无需实现 memory evolution、MRL 约束或 FAISS 检索，只需 LLM prompt 调用和简单统计检验，可在 3–4 天内完成数据收集和实验。", "research_value": "### § 11 最强反例设计\n\n要构建对 LifeMem 最致命的反例，我会设计一个包含**同构 action space 但异构 decision logic** 的跨环境实验场景，直接攻击其最脆弱的假设：LLM 能力基于 functional workflow 而非 surface semantic similarity 进行聚类。具体而言，选取两个 Web browsing 环境（如 WebArena 中的电商购物与航班预订），它们共享完全一致的 action space（click, type, scroll）和高度相似的 observation format（HTML DOM 树），但底层决策逻辑完全不同：电商购物需要比价和筛选规格，而航班预订需要权衡时间中转。在这个场景下，由于 trajectories 的 action-observation 序列在文本和结构上高度相似，LLM 在 Workflow Clustering 阶段会不可避免地将两者归入同一 cluster。更严重的是，由于两者的 embedding 方向高度一致，Adaptive Partitioning 中的 Mean Resultant Length (MRL) 约束会测得极高的 $R$ 值（趋近于 1），从而判定该 cluster 内部高度集中，**永远不会触发分裂机制**。这导致后续的 Skill Distillation 在这个混合了异质决策逻辑的 cluster 上进行，蒸馏出的 environment-invariant skill 将沦为无信息量的通用操作（如“使用搜索栏并点击按钮”），完全丧失对特定任务求解的指导能力。如果在这个反例实验中观察到 LifeMem 的性能退化到与 ExpeL 等 generic trajectory abstraction 基线无异，甚至因引入误导性 skill 而低于纯 trajectory retrieval 的 Synapse 基线，就能提供强有力的替代解释：LifeMem 在原论文 5 类场景中的成功，并非源于其声称的“按底层 workflow 聚类”，而是因为原论文选取的环境（embodied action、tool utilization 等）在 action space 和 observation format 上天然存在巨大的表面差异，使得聚类实际上是被 surface format 驱动的，掩盖了其在同构异质环境下的结构性缺陷。\n\n### § 12 Follow-up Research Idea\n\n基于 LifeMem 依赖 LLM 语义聚类且 skill 静态蒸馏的局限，我提出一个全新的研究方向：**基于因果工作流图的组合式技能发现**。这个想法的驱动力在于：LifeMem 将“workflow”作为一个模糊的语言学概念交由 LLM 隐式判断，导致其在同构异质场景下失效，且蒸馏出的自然语言 skill 无法保证在未见环境中的精确执行。为解决这一未满足的需求，我们可以借鉴图论中的**子图同构**与因果发现方法，将经验复用从“语义匹配”重构为“结构因果匹配”。具体而言，不再使用 LLM 进行文本聚类，而是将每条 trajectory 转化为一个**有向无环图 (DAG)**，节点表示环境状态或工具返回的 observation，边表示带前置条件的 action。随后，利用图神经网络 (GNN) 和子图同构算法，在异构环境的 trajectories 中提取频繁出现的、具有因果依赖的公共子图作为“可执行技能原语”。这些原语不是自然语言描述，而是带有状态前置条件和动作接口的参数化图结构。\n\n这个提议与已有工作（如 ExpeL 或 LifeMem）的根本区别在于，它彻底剥离了对 LLM 模糊推理能力的依赖，将跨环境迁移的粒度从粗粒度的整条 trajectory 或静态文本 skill，细化为严格基于因果逻辑的图结构匹配，从而能够精确区分“表面相似但因果逻辑不同”的 workflows。第一个实验将设计一个“同构异质”验证场景：在两个共享相同 API 接口但决策树不同的 tool utilization 环境中（例如，一个按价格排序筛选股票，一个按市值排序筛选加密货币），对比传统 LLM 聚类蒸馏与因果图同构提取的 skill 在 zero-shot transfer 下的表现。我们预期，当任务要求 agent 在未见环境中执行需要特定因果依赖的多步操作时，基于图结构匹配的 skill 原语能显著降低 action hallucination，而 LifeMem 式的自然语言 skill 将因无法约束执行逻辑而频繁失败。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yuli Qiu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yutong Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Wei Su\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zeming Liu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Wanxiang Che\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Heyan Huang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Haifeng Wang\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Yuhang Guo\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Beijing Institute of Technology\"},\n    {\"id\": 2, \"name\": \"Beihang University\"},\n    {\"id\": 3, \"name\": \"Harbin Institute of Technology\"},\n    {\"id\": 4, \"name\": \"Baidu Inc.\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"†\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "大语言模型 agents 预期将在其生命周期内通过重用过去的经验来持续适应新任务和环境。然而，现有的 memory-based agents 难以跨环境迁移可重用的经验，并且随着经验的积累会遭受 catastrophic forgetting。为了解决这些挑战，我们提出了 LifeMem，这是一个 lifelong learning 框架，使 agents 能够跨多个环境迁移知识。在学习过程中，LifeMem 基于底层 workflows 对积累的 interaction trajectories 进行聚类，以提取可重用的 skills。在 inference time 解决新任务时，agent 会回忆相关的 skills 和 trajectories 以指导行动。为了验证我们的方法，我们在 10 个环境和超过 13k 个任务上进行了实验，并使用了 2k 个新标注的 interaction trajectories。结果表明，LifeMem 在 lifelong learning 中实现了有效的经验重用，既减少了对已学任务的 forgetting，又实现了更优的 cross-task transfer。进一步分析表明，task streaming 会影响学习，而在 memory 中整合结构相似的 trajectories 能够提升性能。"}, {"title": "CueMem: Cue-Guided Context Reconstruction for Long-Term Conversational Memory", "arxiv_id": "2609.12354", "authors": "Changjian Wang, Rongzhen Li, Weili Guan, Shuming Shi, Quan Lu, Ning Jiang", "summary": "Long-term conversational agents must answer user queries by recalling information from extended dialogue histories, yet directly using the full history is costly and often unreliable, while compressed memory units may lose fine-grained evidence needed for question answering. Motivated by the reconstructive view of autobiographical memory, we propose CueMem, a cue-guided framework that treats extracted memory records as retrieval cues rather than self-contained evidence and reconstructs query-relevant dialogue context from their source turns. During memory construction, CueMem extracts fine-grained memory cues from dialogue turns and links each cue to its source turn. At query time, it retrieves query-relevant cues, maps them to source-turn anchors, and expands from these anchors over a turn graph that captures temporal proximity and semantic relatedness, reconstructing a compact evidence context from the original dialogue for LLM answer generation. Experiments on LoCoMo and LongMemEval show that CueMem consistently outperforms representative long-term memory baselines. Further analyses show that graph-based context reconstruction helps recover supporting dialogue evidence while reducing query-time input tokens and latency compared with the full-history LLM setting. These results highlight retrieval cues as an effective alternative to self-contained memory evidence for long-term conversational question answering.", "category": "cs.CL", "cluster": "Memory \u0026 Experience Management", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-60 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了CueMem，一个针对长期对话智能体的记忆重构框架。论文明确以“长期对话智能体”为研究对象，聚焦于改进智能体的核心能力之一——记忆机制。它通过将记忆记录作为检索线索而非自包含证据，并在查询时重构相关的对话上下文，有效解决了长期记忆中信息丢失和成本过高的问题。这完全符合筛选标准中第一步“保留”规则所明确的“研究对象明确是 LLM Agents”且“结论直接帮助理解或改进智能体能力”的要求，同时也命中了第二步正面指标中的“Memory”和“Long-Horizon Decision-Making”。虽然摘要中提到了利用“turn graph”来捕捉对话轮次的时间和语义关系，但这仅是作为记忆上下文重构的辅助数据结构，并非研究知识图谱、图神经网络或图推理等被明确排除的图核心技术。因此，该论文属于单智能体记忆机制的前沿研究，符合本次筛选范围。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的研究问题是：在长期对话场景中，对话代理如何高效且准确地从极长的对话历史中回忆并利用信息来回答用户查询。这个问题至关重要，因为在真实世界的人机交互中，对话往往是多轮且长程的，而直接将完整的交互历史输入给 Large Language Models (LLMs) 会面临 context length 限制、噪声干扰、“lost-in-the-middle”现象以及高昂的 inference latency 等严重瓶颈。解决这一问题能够使对话代理在不受上下文窗口物理限制的情况下，维持连贯的个性化交互并精准回应用户基于历史语境的复杂提问，从而推动 conversational agents 向真正具备长期记忆能力的实用系统迈进。\n\n### § 2 前人工作与不足\n在 CueMem 之前，长期对话记忆问题已被广泛探索，主要方法包括 Naive RAG 以及更结构化的记忆系统如 MemoryOS、Mem0、A-Mem 和 LightMem。这些 prior systems 通常通过分段、压缩、摘要或显著信息提取，将对话历史转化为可检索的 memory units，并以此作为生成回答的直接上下文。然而，这些方法存在根本性缺陷：它们将检索到的 memory units 视为 self-contained evidence，但这些压缩或去语境化的片段往往会丢失问答所需的细粒节证据。更关键的是，基于向量的索引倾向于将多个语义信号纠缠在单一的 dense representation 中（例如将目的地、预算和酒店偏好合并为一个“旅行规划”记忆单元），当用户查询仅针对某一细粒度属性时，相关语义信号被混合信号稀释，导致检索精度大幅下降。这种设计未能采纳认知科学中关于自传体记忆的重构视角——即记忆的提取应由精细的 cues 引导并从更广泛的知识库中重构，而非仅仅依赖静态的压缩片段。因此，前人方法由于在记忆单元粒度与查询粒度之间存在 mismatch，且过度依赖压缩记忆作为直接证据，无法在动态长对话中提供高保真的支撑性上下文。", "core_insight": "### § 3 重建作者的思考路径\n\n在长期对话场景中，LLM agents 面临着如何有效利用历史信息的挑战。直接输入 full history 会受限于 context window 并引发 lost-in-the-middle 问题及高昂的推理延迟。为了解决这一问题，现有的 RAG 和 memory systems 通常将对话历史切分、总结或提取为 memory units 进行检索。然而，这种做法存在明显的失败模式：压缩后的 memory units 丢失了 fine-grained 的细节，且单一的 dense representation 往往将多个语义信号纠缠在一起（例如将目的地、预算和偏好混为一谈），导致针对特定细节的检索精度下降。更重要的是，这些系统将检索到的压缩片段直接作为 self-contained evidence 喂给 LLM，脱离了原始的对话上下文。面对这一瓶颈，研究者开始从认知科学中寻找灵感。Autobiographical memory 理论指出，人类的记忆并非完美存储的记录，而是在线索引导下从更广泛的知识库中重构出来的。这一理论线索提示了一种全新的解法：不要把记忆当作压缩的证据，而应将其视为检索线索。如果我们将对话拆解为细粒度的 memory cues，并让这些线索指向其原始的对话轮次，那么在查询时，就可以先通过精准的线索检索定位到原始对话锚点，再围绕这些锚点重构出包含足够上下文的证据集。这种思路既避免了压缩带来的信息丢失，又规避了全量历史输入的噪声问题。\n\n### § 4 核心 Intuition\n\n现有的长期对话记忆系统试图将冗长的对话压缩成独立的 memory units 作为直接证据，但这不可避免地丢失了细粒度细节并因语义纠缠降低了检索精度。CueMem 的核心直觉在于，记忆不应是自包含的证据，而应是引导我们回到原始对话的检索线索。通过提取细粒度的 memory cues 定位到原始对话轮次，并沿着时间与语义的图结构向外扩展重构出完整的上下文，系统既保留了原始对话的丰富细节，又避免了全量历史带来的噪声与高延迟。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Offline Stage]\nDialogue History D ─────\u003E Memory Cue Extraction ─────\u003E Cue Set C\n                              │           │              │\n                              │           └─────────────┼──\u003E Turn Graph G\n
