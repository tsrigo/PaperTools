on 的预测值。具体操作是根据公式 $a^* = \\arg\\max (\\hat{p}_a - \\lambda \\hat{c}_a + \\alpha \\sqrt{x^\\top A_a^{-1} x})$ 选择最优 action，平衡准确率、成本和探索。输出为选定的 memory mode（none, full, compressed, retrieved）和 compute budget（token, round, tool limits）。此步骤将 memory 使用转变为可控的决策变量（对应正文 III-D(c)）。\n- **Prompt Construction \u0026 Agent Execution**：输入为选定的 action 和当前任务。具体操作是根据 memory mode 构造 prompt（如注入相关历史轨迹），并在指定的 compute budget 下执行 agent。输出为 agent 的交互轨迹、最终答案、correctness $y_i$ 和 cost $c_i$（对应正文 III-A 和 III-C）。\n- **Update Memory Bank \u0026 Bandit Stats**：输入为观察到的 $y_i$ 和 cost $c_i$。具体操作是将成功的轨迹存入 memory bank，并通过 Sherman-Morrison 公式以 $O(d^2)$ 复杂度在线更新 bandit 的 $A_a$ 和 $b_a$。输出为更新后的 controller 状态，用于下一个任务。此步骤无需梯度计算或模型权重修改，实现了单次在线学习（对应正文 III-D(d) 和 Algorithm 1）。\n\n### § 6 核心数学推导\n\nLIMBO 的核心数学基础是 contextual bandit，特别是 LinUCB 算法的扩展。LinUCB 是一种用于在线决策的强化学习算法，它通过线性模型预测每个动作的奖励，并利用置信区间上界（UCB）来平衡对已知高奖励动作的利用和对未知动作的探索。\n\n论文提出了 Two-Head LinUCB，其 intuition 在于将任务的成功率和计算成本作为两个独立的目标进行联合优化：\n- **Head 1 (Correctness)**：$\\hat{p}_a(x) = \\sigma(\\hat{\\theta}_a^{acc \\top} x)$。使用 sigmoid 函数 $\\sigma$ 将线性模型的输出映射到 $[0,1]$ 区间，预测在特征 $x$ 下选择动作 $a$ 的成功概率。\n- **Head 2 (Cost)**：$\\hat{c}_a(x) = \\max(\\hat{\\theta}_a^{cost \\top} x, 0)$。使用 ReLU 确保成本非负，预测归一化后的预期计算成本。\n\n在动作选择阶段，算法计算每个动作的 UCB 得分：$a^* = \\arg\\max_{a \\in A} \\left( \\hat{p}_a(x) - \\lambda \\hat{c}_a(x) + \\alpha \\sqrt{x^\\top A_a^{-1} x} \\right)$。其中 $\\hat{p}_a(x)$ 是预期的准确率收益，$\\lambda \\hat{c}_a(x)$ 是成本惩罚（$\\lambda$ 控制对成本的敏感度），$\\alpha \\sqrt{x^\\top A_a^{-1} x}$ 是探索项，鼓励尝试不确定性高（即特征协方差矩阵 $A_a$ 逆矩阵较大）的动作。\n\n在线更新阶段，算法使用岭回归的在线更新形式：$A_a \\leftarrow A_a + x x^\\top$，$b_a^{acc} \\leftarrow b_a^{acc} + y_i x$，$b_a^{cost} \\leftarrow b_a^{cost} + \\hat{c}_i x$。$A_a$ 是特征的协方差矩阵，$b_a$ 是特征与奖励的协方差。每次观察到新结果后更新这些统计量以改进未来预测。为避免矩阵求逆的高昂计算开销，算法使用 Sherman-Morrison 公式直接维护 $A_a^{-1}$，将复杂度降至 $O(d^2)$。\n\n### § 7 实验设计与结论\n\n这篇论文通过在 LifelongAgentBench (LAB) 上的系统实验验证了 LIMBO 的有效性，核心实验逻辑如下：\n\n提出了什么问题：LIMBO 能否在保持准确率的同时显著降低推理成本？它是否能根据不同模型和环境自适应地学习不同的内存分配策略，且这种策略是在线学习得到的而非预先固定的？\n\n设计了什么实验验证这个问题：在 LAB 的 DB (SQL) 和 OS (bash) 两个交互环境下，使用 Qwen2.5 7B, Llama 3.1 8B 和 GPT-4o mini 三种 LLM backbones 进行 500 个任务的连续流测试。实验将 LIMBO 与 No replay, Fixed replay, LongLLMLingua, Group Self-Consistency (GSC) 等基线比较 cost-accuracy tradeoff。此外，通过分析 LIMBO 在六个 (model, environment) 设置下收敛的 action mix（Figure 4），以及在 Qwen OS 任务流中 action mix 和 UCB uncertainty bonus 随时间的变化（Figure 5），验证其自适应性和在线学习能力。\n\n问题的答案是什么：LIMBO 在所有六种设置下都处于 empirical cost–accuracy Pareto frontier，在匹配或超过最强 memory-augmented baseline 准确率（-3.8 到 +0.6 points）的同时，降低了 26% 至 83% 的推理成本。实验证明 LIMBO 在不同设置下学到了截然不同的策略（如 DB 环境倾向于 no-replay，OS 环境倾向于 retrieved replay），且无需针对每个设置进行调优或离线训练。Figure 5 进一步证实，早期任务中探索性更强，随着任务进行，action mix 逐渐稳定，UCB bonus 下降了 67%，直接证明了策略是在线学习得到的。", "additional_insights": "### § 8 Take-aways\nLIMBO 将 lifelong LLM agents 的 experience replay 定义为 inference-time memory allocation 问题，指出固定 replay 策略会导致严重的 cost-value mismatch。为解决此问题，论文提出了一个基于 two-head LinUCB contextual bandit 的在线 controller，通过提取 12 个 lightweight prompt 和 runtime features，为每个 incoming task 动态选择 memory mode（none, full, compressed, retrieved）与 compute budget。该框架满足 black-box compatibility 和 single-pass online learning 约束，无需修改 model weights 或进行 offline retraining，且 per-task overhead 极低（\u003C0.5ms）。在 LifelongAgentBench 的跨模型与跨环境实验中，LIMBO 自动学习出差异化的 allocation policy，在保持与最强 memory-augmented baselines 相当准确率的同时，将 inference cost 降低了 26% 至 83%。\n\n### § 9 最脆弱的假设\nLIMBO 核心机制最脆弱的假设是：仅靠 12 个 lightweight features（如 log-normalized token counts、EMA of normalized cost、binary success indicators）就足以捕捉当前任务与历史 trajectories 之间的相关性，从而让 contextual bandit 准确预测 replay 的 correctness 和 cost。如果这个假设不成立，bandit 将无法区分 replay 对哪些任务真正有益，最终退化为盲目探索或始终偏向最便宜的 arm。在实际复杂的 interactive environments 中，决定一条历史轨迹是否有益往往取决于深层的语义相似性或结构依赖（例如特定的 SQL 逻辑嵌套或 bash 命令组合），这些信息很难被 prompt size 或 recent cost 等粗粒度统计特征所表征。论文虽然通过 Figure 5 展示了 bandit 的 UCB bonus 随时间单调递减以及 action mix 发生偏移，证明了 controller 确实收敛，但缺少针对 feature importance 的 ablation study，未能证明这些特定特征在细粒度任务匹配上的因果预测能力，也无法排除 controller 仅仅是学到了环境层面的宏观趋势（如 DB 环境少用 replay，OS 环境多用 replay）而非真正的 per-task 动态决策。\n\n### § 10 最小复现实验\n在一周时间内，可使用 GPT-4o mini API 和 LifelongAgentBench 中的 DBBench (SQL) 500-task 序列，最小化复现 LIMBO 的核心 claim：即在线 contextual bandit 能比固定 replay 策略实现更优的 cost-accuracy tradeoff。实现时，跳过复杂的 retrieval 和 compression 机制，仅构建三个 arms：No replay (512 tokens)、Fixed replay k=4 (768 tokens) 和 Fixed replay k=16 (1024 tokens)。使用论文中列出的 12 个 features 实现 two-head LinUCB controller，在 500 个任务流中单次在线学习并记录每个任务的 accuracy 与累积 API cost。测量指标为最终 accuracy 和 total inference cost，并与始终采用 Fixed replay k=16 的 baseline 进行对比。如果 LIMBO 的最终 accuracy 落在 baseline 的 ±2 个百分点内，且 total inference cost 相比 baseline 降低超过 50%，则支持论文的 claim；如果 accuracy 显著下降（例如低于 No replay baseline），或者 cost 与 Fixed replay k=16 相当，则说明仅靠这些 lightweight features 不足以驱动有效的 memory allocation 决策，从而反驳该 claim。", "research_value": "### § 11 最强反例设计\n\n要对该论文发起最有力的攻击，核心在于推翻其“12个 lightweight features 足以驱动有效 memory allocation”的底层假设，并证明 LIMBO 在 Pareto frontier 上的优势仅仅是 LAB benchmark 特定任务分布的伪影。我会设计一个“Adversarial Semantic Confounding”实验：构建一个连续任务流，其中相邻任务在 prompt-shape features（如 token counts）、runtime-state features 和 previous-outcome features 上完全一致，但在深层结构依赖上要求正交的 historical trajectories。例如，在 SQL 环境中，交替输入具有相同复杂度和 token 长度的“多表 JOIN 聚合”与“单表窗口函数嵌套”任务；在 OS 环境中，交替输入参数长度相同但底层依赖完全不同的“awk 文本流处理”与“grep 正则提取”任务。在这个对抗流中，LIMBO 提取的 12 维特征向量 $x_i$ 将保持不变或极度相似，导致 Two-Head LinUCB controller 对这些语义迥异的任务输出完全相同的 memory mode 和 compute budget 分配策略。由于 bandit 无法通过这些粗粒度特征区分任务的真实结构需求，它将系统性地错过能够提供关键 action trace 的历史轨迹，或者在不相关的 replay 上浪费预算。如果这个实验成立，它将提供一个具体的替代解释：LIMBO 在原论文中展现的优异 cost-accuracy tradeoff，并非因为 controller 学会了 per-task 的动态 memory allocation，而是因为它碰巧学到了 LAB benchmark 中 DB 环境普遍不需要 replay、OS 环境普遍需要 retrieved replay 这一宏观环境趋势。一旦任务流在浅层特征上同质化但在语义需求上异质化，LIMBO 的策略将退化为盲目且固定的分配，其表现甚至会低于基于 semantic embedding 进行简单 KNN retrieval 的 Fixed replay baseline，从而彻底证伪其“在线学习精细分配策略”的声称。\n\n### § 12 Follow-up Research Idea\n\n该想法由 LIMBO 将 memory allocation 与深层语义匹配强行剥离的局限所驱动：在复杂的 interactive environments 中，决定一条历史轨迹价值的并非 prompt size 或 recent cost 等外部统计量，而是当前任务与历史轨迹在 latent space 中的结构同构性。为了弥补这一未满足的需求，我们可以借鉴 Information Retrieval (IR) 领域中的 Optimal Transport (OT) 和 Neural Bandits 算法，提出一个全新的“Latent-Space Semantic Memory Routing”框架。该框架不再维护基于浅层特征的线性 bandit，而是将 memory allocation 重新定义为在 LLM frozen embedding space 中的在线探索与匹配问题：利用 Optimal Transport 计算当前任务 embedding 与 memory bank 中历史 trajectory embeddings 之间的 distributional distance，并将此距离作为 Neural Bandit（如 Neural LinUCB）的 context，从而在保持 black-box compatibility 的前提下，直接对“语义相似度”与“inference cost”进行联合优化。这与已有工作存在本质区别：LIMBO 及前人方法将 memory 视为被外部统计量控制的被动资源，而本提议将 memory allocation 转化为一个由 latent semantic alignment 主动驱动的 routing 问题。第一个实验将构建一个高语义混淆度的 lifelong task stream，其中任务的浅层特征被故意打乱或对齐，使得基于浅层特征的 controller 完全失效；在此对抗设置下，比较 LIMBO 的 linear bandit 与基于 OT-Neural Bandit 的 routing 机制在 cost-accuracy tradeoff 上的表现，预期后者能通过精准捕捉深层结构依赖，在极低 budget 下显著提升复杂任务的 accuracy，从而证明 semantic-aware allocation 是 lifelong agents 突破浅层特征瓶颈的必由路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Siddharth Sharma\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Nilesh Prasad Pandey\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Onat Gungor\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Tajana Rosing\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"UCSD\"},\n    {\"id\": 2, \"name\": \"WVU\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "随着 LLM agents 被整合到日益复杂的工作流中，它们必须在保持对先前学习任务的能力的同时，持续获取新能力。Lifelong agents 通过 experience replay 来解决这一问题，将过去的交互注入到 prompt 中，以在推理期间利用先前的经验。然而，replay 并非没有代价：每条被 replay 的 trajectory 都会与 retrieval、reasoning、tool use 和 verification 竞争同样有限的 prompt 和 compute budget，这使得有效的资源分配变得至关重要。现有方法使用固定的 replay policies 来分配这些资源，而不考虑 replay 是否对当前任务有益。我们将此识别为 inference-time memory allocation，这是 lifelong agents 的一个独特问题类别，并引入了 LIMBO：据我们所知，这是第一个将 memory 视为可控的 inference-time resource，并为每个传入任务联合优化 memory strategy 和 inference budget 的 online framework。与之前固定 replay policy 或需要 model weights、teacher supervision 或 offline retraining 的方法不同，LIMBO 在单次过程中在线学习这种分配，在不修改底层 agent 的情况下显式平衡 task performance 和 inference cost。在 LifelongAgentBench 上的三个 LLM backbones 中，LIMBO 实现了比 state-of-the-art memory-augmented baselines 更好的 cost-accuracy tradeoffs，并且在 inference cost 降低高达约 83%（平均约 53%）的情况下，几乎匹配了所有最强的此类 baselines。LIMBO 无需 retraining 即可跨模型和环境调整其 policy，证明了有效的分配可以在线学习，而无需手动指定。"}]}, {"name": "Agent Training \u0026 Distillation", "count": 2, "papers": [{"title": "Know When to Stop, Where to Restart: Accelerating Multi-Turn Agentic On-Policy Distillation", "arxiv_id": "2609.14636", "authors": "Zhiyu Gui, Kexin Huang, Jia Guo, Junkang Wu, Zihao Wang, Zhiqiang Zhang, Jun Zhou, Jiancan Wu, Xiang Wang", "summary": "On-policy distillation (OPD) has become a standard approach for transferring capabilities from large teachers to compact students. Its cost, however, is dominated by autoregressive student rollouts and scales poorly in multi-turn agentic settings. Existing acceleration methods truncate or relocate the supervision signal according to fixed, offline budgets, despite substantial variation in teacher-signal reliability both within and across trajectories. Our empirical analysis on $τ^2$-bench reveals a clear structure in this variation: informative supervision is concentrated in the prefix of each turn, and, most importantly for multi-turn agentic training, the cross-turn loss of teacher endorsement is temporally locked to the student's first erroneous action rather than accumulating gradually over turns. Building on these findings, we propose STRIDE (Stop-and-Restart on-policy Distillation acceleration), which combines two complementary techniques: adaptive early stopping, which terminates a rollout once the cumulative teacher log-probability falls below an out-of-distribution threshold, and a prefix buffer, which caches high-quality prefixes and restarts generation at the weakest correct turn. Together, these mechanisms induce a data-driven curriculum that progressively extends coverage to later turns. On $τ^2$-bench retail, our method matches full-trajectory OPD and exceeds the 30B teacher at a $3.73\\times$ speedup, surpasses the baseline itself at $2.34\\times$, and retains a $4.51\\times$ speedup under cross-domain multi-teacher training. As a supplementary generalization test beyond the agentic setting, STRIDE outperforms full OPD on AIME 2025 at a $5.10\\times$ speedup and on AIME 2024 at a $3.08\\times$ speedup; averaged across the two evaluations, both fixed-budget truncation baselines remain below full OPD.", "category": "cs.LG", "cluster": "Agent Training \u0026 Distillation", "tags": ["cs.LG"], "filter_reason": "这篇论文的核心贡献是提出了一种名为 STRIDE 的加速方法，专门用于优化多轮智能体（multi-turn agentic）的在线策略蒸馏（OPD）过程。论文明确针对“多轮智能体设置”中的训练成本问题，通过自适应早停和前缀缓冲区机制，构建了一种数据驱动的课程学习策略，从而更高效地将大教师模型的能力转移到紧凑的学生模型中。\n\n根据筛选标准第一步中的保留规则：“如果论文研究 test-time scaling、推理策略搜索、澄清时机、记忆机制、协作意图、agent training/distillation/RL，并且标题或摘要明确指向 Agentic / LLM Agents / Self-Evolving / LLMs Improving LLMs，应保留。不要因为它看起来像‘推理优化’或‘训练方法’就直接排除。” 该论文标题和摘要均明确聚焦于 “Agentic On-Policy Distillation” 和 “multi-turn agentic training”，属于 agent training/distillation 的重要前沿。\n\n此外，重要校准中也明确指出：“不要只因为论文是 benchmark、evaluation、behavior analysis、training/distillation 或 test-time optimization 就排除。只要标题和摘要明确围绕 LLM Agents / Agentic AI / Self-Evolving LLMs 展开，就应返回 True。” 论文虽然涉及基础训练方法的优化，但其研究边界和实验场景牢牢绑定在多轮智能体的能力获取与蒸馏上，符合“LLM智能体及其演化”的研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n本文解决的核心问题是：如何在不损失训练质量的前提下，加速多轮智能体场景下的 On-Policy Distillation (OPD)。OPD 通过让 student 模型自行生成轨迹、再由 teacher 模型提供密集的 token-level 反馈，从源头消除了 off-policy distillation 中 teacher 训练数据与 student 部署分布之间的 distribution mismatch，已成为工业界训练的标准范式（如 Qwen3 的两阶段 recipe、Thinking Machines 的 RL-grade 蒸馏）。然而，OPD 的成本主要由 student 的 autoregressive rollout 主导——在多轮智能体设置中，student 需要与环境反复交互生成完整轨迹，这一开销随轮次和任务复杂度急剧增长。现有加速方法依赖固定的、离线确定的预算来截断或重定位监督信号，但本文在 τ²-bench 上的实证分析揭示了 teacher signal 可靠性具有明确的结构性变化：在单轮内，有效监督集中在 response prefix；在跨轮次层面，teacher endorsement 的丧失并非随轮次渐进累积，而是时间锁定于 student 的第一个错误动作（first erroneous action）。这一发现意味着静态截断规则不可避免地会对部分轨迹过度截断（丢弃有效监督），同时对另一些轨迹截断不足（保留已进入 OOD region 的无效 token）。解决这一问题不仅能将多轮智能体 OPD 的训练时间缩短数倍（单 teacher 场景 3.73×、多 teacher 场景 4.51×、单轮数学推理 5.10×），还能在加速的同时保持甚至超越 full-trajectory OPD 的质量，使 4B student 超越 30B teacher，对大规模部署 compact agent 具有直接的实际价值。\n\n### § 2 前人工作与不足\n\nOPD 加速领域已有若干方法，但均因依赖静态、离线的预算分配而存在根本性不足。**Fast OPD**（Zhang et al., 2026）将监督截断至固定的 student prefix 长度，直接缩短 rollout，但其固定预算无法区分高质量轨迹与已进入 OOD drift 的轨迹——前者被过早切断丢失有效监督，后者被保留至有效信号消失之后。**Lightning OPD**（Wu et al., 2026）将 OPD 完全移至离线，通过一次性采样 rollout 并预计算 teacher 分数来同时移除在线 rollout 和 live teacher，但代价是将训练分布冻结在初始 policy，丧失了 on-policy 的核心优势。**TCOD**（Wang et al., 2026）通过手动设计的时间课程表控制暴露的轨迹深度并逐步扩展，但每次 rollout 均从头重新生成，且其课程表无法适应不同轨迹中失效点的位置差异。**TurnOPD**（Zhou et al., 2026）基于 probe 统计为多轮 agent 训练的 rollout 深度设定预算，同样依赖离线统计而非在线检测。**PruneOPD**（Yang et al., 2026b）通过 token-level 的 student-teacher compatibility 实时截断漂移的 rollout，是最接近本文的并发方法，但同样未解决截断后覆盖丢失的问题。**ReOPD**（Liao et al., 2026）离线重放预收集的 teacher prefix，student 仅在单个 supervised step 上保持 on-policy，且将可靠性简化为冻结 prefix pool 上的静态位置衰减调度——而本文 Observation 3 明确表明失效点是 action-locked 且随训练动态偏移的，静态调度无法捕捉这一特性。**TIP**（Xu et al., 2026）虽表明在部分 token 上训练可匹配 full-token OPD，但其 token 选择前提是完整 rollout 和完整 teacher pass，既不减少 rollout 成本也不减少 teacher 成本。这些方法的共同缺陷在于：它们都按监督可靠性分配计算资源，但无一恢复截断所放弃的覆盖——即对后续轮次训练窗口的补偿。本文指出，失效点因轨迹而异且随训练进程偏移，因此可靠性必须在 rollout 过程中在线评估；同时，截断前的正确 prefix 无需重新生成，可被缓存复用以将训练窗口逐步推向更深的轮次，形成 data-driven curriculum，这正是此前方法所缺失的关键机制。", "core_insight": "### § 3 重建作者的思考路径\n\n在 multi-turn agentic 场景下，On-policy distillation (OPD) 的核心瓶颈在于 student 的 autoregressive rollout 成本极高。现有的加速方法（如 Fast OPD 或 Lightning OPD）试图通过固定的、离线的预算来截断 rollout 或将 OPD 转移到离线。然而，静态截断规则忽略了 teacher signal 可靠性在不同 trajectory 之间的巨大差异，不可避免地会过度截断高质量 trajectory（丢弃有效监督）或截断不足（保留已处于 OOD drift 的无用 token）。\n\n面对这一困境，一个自然的问题是：teacher signal 到底是如何失效的？已有的理论线索指出，一旦 student prefix 偏离 teacher 的支持域，teacher 的条件分布就会变得不可靠，导致 supervision fidelity decay。但在 multi-turn 交互中，这种失效是随 turn 数逐渐累积的，还是由特定事件触发的？通过在 $\\tau^2$-bench 上进行经验分析，可以发现两个关键现象：首先，在单个 turn 内，有效监督确实集中在 prefix；其次，更重要的是，跨 turn 的 teacher signal 崩溃并非渐进式的，而是“时间锁定”在 student 的第一个错误动作上。一旦 student 采取了错误的 action，后续状态就会脱离 teacher 的支持域，导致 endorsement 骤降。\n\n这一发现直接指向了方法的雏形：既然失效点是突发的且由特定错误触发，那么就不需要预先设定截断点，而应该在 rollout 过程中实时监测这个崩溃点。由于 OPD 本身在训练时就会计算 per-turn mean teacher log-probability，这个现成的统计量正好可以作为 online probe。当其累积值低于阈值时，说明 trajectory 已进入 OOD 区域，此时应立即终止 rollout。然而，单纯的早停会丢失后续 turn 的训练覆盖度。为了弥补这一点，可以观察到崩溃点之前的 prefix 仍然是高质量的。如果将这些验证过的 prefix 缓存起来，并在下一次遇到相同任务时，从最薄弱的正确 turn 重新开始生成，就能在复用前序计算的同时，将训练焦点逐步推向更深的 turn，自然形成一种 data-driven curriculum。\n\n### § 4 核心 Intuition\n\n先前方法失效是因为它们用固定的预算盲目截断 trajectory，忽略了 teacher signal 的可靠性其实是在 student 犯下第一个错误动作时瞬间崩溃的，而非随 turn 数逐渐衰减。这篇论文的核心 intuition 是：利用 OPD 本身就在计算的 teacher log-probability 作为在线探针，一旦探测到这种由错误动作触发的 OOD drift 就立即停止生成；同时，为了弥补截断导致的后半部分覆盖度丢失，将前面验证过的高质量 prefix 缓存复用，让下一次生成直接从最薄弱的正确 turn 重新开始，从而在不损失训练效果的前提下大幅削减 rollout 成本。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n              STRIDE Training Pipeline\n\n  Task x ──► [Prefix Buffer H(x)]\n                │\n           ┌────┴────┐\n           │ 有历史?  │──否──► K₀=0\n           └────┬────┘\n                │是\n           定位最弱正确turn k*\n           复用prefix至k*-1, K₀=k*-1\n                │\n                ▼\n  ┌────────────────────────────┐\n  │ Student πθ 逐turn生成      │\n  │ turn k=K₀+1, K₀+2, ...    │\n  └──────────┬─────────────────┘\n             │\n  ┌──────────▼─────────────────┐\n  │ Teacher πT 计算 l̄ₖ         │\n  └──────────┬─────────────────┘\n             │\n  ┌──────────▼─────────────────┐\n  │ Σ l̄ⱼ \u003C λ ?                │\n  └──┬─────────────────────┬───┘\n     │否                   │是\n     ▼                     ▼\n  继续下一turn         Early Stop\n                       │\n                       ▼\n  ┌────────────────────────────────┐\n  │ 记录 {l̄ₖ} → H(x)               │\n  │ OPD loss(含触发turn) → 更新 θ   │\n  └────────────────────────────────┘\n```\n\nSTRIDE 的训练流程围绕两个互补机制展开，对应 Algorithm 1：\n\n1. **Prefix Buffer 查询与复用**：输入为当前 Task x 及其历史记录 H(x)。若 H(x) 存在该任务的前次 rollout 轨迹，系统执行 weakest-turn localization——在连续正确 prefix（l̄ₖ \u003E α 的 turn）中找到 teacher endorsement 最低的 turn k*，复用其前缀至 k*-1 作为上下文起点，设 K₀ = k*-1；若无历史记录，则 K₀ = 0，从头生成。此步骤使训练聚焦于 student 最薄弱的剩余 turn，而非重复生成已掌握的前缀。（§4.2, Algorithm 1 行4-10）\n\n2. **Student 逐 turn 生成**：从 turn K₀+1 开始，student πθ 以 autoregressive 方式生成每个 turn 的 reasoning block 和 tool call，环境返回 observation。生成与交互交替进行，构成 multi-turn trajectory。（§3.1, Algorithm 1 行11-12）\n\n3. **Teacher 在线评分**：teacher πT 对 student 当前 turn 的输出计算 per-turn mean teacher log-probability l̄ₖ（Eq.4），作为该 turn 的平均 endorsement 指标。l̄ₖ 越高表示 student 生成越接近 teacher 的 support。（§3.1, Algorithm 1 行12）\n\n4. **Adaptive Early Stopping 判定**：累积仅覆盖新生成 turn 的 l̄ⱼ，一旦 Σ l̄ⱼ \u003C λ（OOD 阈值），立即终止 rollout。该累积和刻意排除复用的历史 prefix，避免其信号淹没新生成 turn 的 OOD 检测灵敏度。触发 stopping 的 turn 本身保留在训练中——其低 log-probability 转化为负向 per-token reward，为 student 提供明确的\"避免该 action\"信号。（§4.1 Eq.5, Algorithm 1 行13-14）\n\n5. **记录与梯度更新**：将本次 rollout 的 {l̄ₖ} 写入 H(x) 供下次复用；在所有保留 token（含触发 turn）上计算 token-level OPD loss 并更新 θ。Early stopping 直接削减了 OPD 的主要开销——student autoregressive rollout——每个被截断的 turn 都是不再发生的生成。（§4.1, Algorithm 1 行15-16）\n\n6. **Progressive Coverage**：随着训练推进，student 逐渐掌握早期 turn，其 l̄ₖ 上升，k* 自然右移，训练窗口滑向 trajectory 后期。这一 data-driven curriculum 无需手工设计 schedule，由 l̄ₖ 的变化自动驱动。（§4.2 步骤4）\n\n### § 6 核心数学推导\n\n论文的数学基础集中在 §3.1，核心是从 sequence-level reverse KL 到 token-level OPD 的推导，以及 early stopping 判定式的形式化。\n\n**Sequence-level gradient estimator（Eq.1）**：OPD 的理论目标是最小化 student 与 teacher 之间的 sequence-level reverse KL divergence。对这一目标应用 policy-gradient theorem，得到梯度估计器 g_t^seq，其中位置 t 的梯度贡献耦合即时 reward r_t（per-token teacher-student log-probability ratio）与所有未来位置的 reward。该估计器无偏，但方差随序列长度增长可达 O(T⁴)，对长 agentic trajectory 不可行。\n\n**Token-level OPD（Eq.2）**：将 discount factor 设为零，等价于切断未来 reward 耦合——每个位置仅用其 local reward r_t 更新，r_t 以 stop-gradient 处理。同时用 indicator 1_trainable(t) 掩蔽环境返回的 observation token，确保仅 student 自主生成的 token 参与损失。这是对 sequence-level 目标的有偏近似，但将最坏情况梯度方差从 O(T⁴) 降至 O(T²)，使其在长 horizon 训练中实际可用。\n\n**Per-turn mean teacher log-probability（Eq.4）**：l̄ₖ = (1/nₖ) Σ log πT(y_t | y\u003Ct)，对 turn k 中 nₖ 个 token 取 teacher log-probability 均值。Intuition：l̄ₖ 量化 teacher 对 student 该 turn 输出的整体 endorsement 程度——值越高，student 生成越落在 teacher 的 distributional support 内；值骤降则标志 student 已 drift 至 OOD 区域。l̄ₖ 既是 §3.2 实证分析的对象，也是 early stopping 的核心 online probe。\n\n**Early stopping 判定（Eq.5）**：在第一个满足 Σ_{j=K₀+1}^{K*} l̄ⱼ \u003C λ 的 turn K* 终止 rollout。Intuition：单个 turn 的 l̄ₖ 偶然偏低可能是噪声，但累积和持续低于阈值 λ 表明 trajectory 已系统性地偏离 teacher support。λ 控制 OOD 敏感度——|λ| 越小越激进（更快截断但可能误判边界区域），|λ| 越大越保守（保留更多边界信号但 speedup 降低）。\n\n### § 7 实验设计与结论\n\n论文围绕三个逐步拓宽的问题设计实验：\n\n**Q1：STRIDE 在核心 single-teacher agentic OPD 中是否有效？** 在 τ²-bench retail 域上，以 Qwen3-4B 为 student、Qwen3-30B-A3B 为 teacher，对比 Full OPD 基线及三种固定预算/课程基线（Fast OPD、TCOD-F2B、turnOPD）。答案：STRIDE 在 3.73× speedup 下匹配 Full OPD 的 mean@16 并超越 30B teacher（0.475 vs 0.461），在 2.34× speedup 下以 0.483 的 mean@16 超越所有方法；所有固定预算基线在两项指标上均低于 Full OPD。这验证了 effective acceleration 依赖 online OOD 检测而非固定预算或手工 schedule。\n\n**Q2：能否泛化到 cross-domain multi-teacher OPD？** 在 retail + telecom 双域上，以两个 domain-expert teacher 联合训练 Qwen3-4B（及 scaling study Qwen3-8B），测试更复杂的 student-teacher 架构下方法是否保持有效。答案：retail 域超越 cross-domain joint baseline（0.599 vs 0.590）并保持 4.51× speedup；telecom 域因 trajectory 平均更长、单次 rollout 覆盖比例更小而略低于基线但接近匹配。Scaling 到 Qwen3-8B 后两域均取得所有训练方法中最优结果。Prefix-quality threshold α 在此设置中发挥关键安全作用——禁用 α 过滤后训练曲线因 prefix pollution 而崩溃。\n\n**Q3：方法是否依赖 multi-turn 结构？** 在 AIME 2024/2025 上进行 single-turn math reasoning OPD，将 turn-level stopping 退化为 token-level 累积判定，与 Fast OPD 的 2048/4096-token 预算直接对比。答案：STRIDE 不依赖 multi-turn 结构。在 5.10× speedup 下超越 Full OPD 于 AIME 2025（0.467 vs 0.458），在 3.08× speedup 下超越 Full OPD 于 AIME 2024（0.558 vs 0.546）；而两种固定预算截断基线在两次评估的平均表现上均低于 Full OPD。这支持 teacher-signal OOD drift 是超越 agentic 场景的通用机制。", "additional_insights": "### § 8 Take-aways\nOn-policy distillation (OPD) 在 multi-turn agentic settings 中的主要计算瓶颈在于 student 的 autoregressive rollout，而传统的固定预算截断方法无法适应 teacher signal 可靠性的动态变化。论文通过实证揭示了 teacher signal 衰减的两大规律：在 turn 内，有效 supervision 集中在 response prefix；在 turn 间，teacher endorsement 的丧失并非逐渐累积，而是被严格锁定在 student 的第一个错误动作上。基于此，STRIDE 提出利用 cumulative teacher log-probability 作为 online OOD probe，一旦信号低于阈值即触发 adaptive early stopping，直接截断不可靠的 rollout。为弥补截断导致的后期 turn 覆盖缺失，STRIDE 引入 prefix buffer 缓存高质量前缀，并从最弱的正确 turn 重启生成，形成无需人工设计的 data-driven curriculum。实验表明，STRIDE 在 $\\tau^2$-bench 和 AIME 上不仅实现了 3 到 5 倍的加速，还能让 4B student 超越 30B teacher 的性能，且在精度和速度上均优于固定预算的 baseline。\n\n### § 9 最脆弱的假设\nSTRIDE 的核心机制完全建立在“per-turn mean teacher log-probability $\\bar{l}_k$ 的急剧下降能够精准且即时地锁定 student 的第一个错误动作”这一假设上。如果这个假设不成立，即 $\\bar{l}_k$ 的下降与错误动作之间存在显著延迟，或者 teacher 对某些错误动作给予了较高的 log-probability（即 teacher 本身存在系统性盲区或 calibration 问题），那么 STRIDE 的核心贡献将直接失效：early stopping 要么过早截断了依然有效的 supervision，要么在 trajectory 已经严重偏离时仍未触发，而 prefix buffer 也会因为基于错误的 $\\bar{l}_k$ 评估而缓存了污染的前缀。在实际中，当 student 采取的某个错误动作在语法或表面逻辑上看似合理，但偏离了环境的核心约束时，teacher model 往往无法立即察觉，导致 $\\bar{l}_k$ 不会在第一个错误 turn 立即下降。论文为这一假设提供的证据仅限于特定的 Qwen3-4B student 与 Qwen3-30B teacher 在 $\\tau^2$-bench retail 上的实证观察（Figure 2b 显示在 $t^*$ 处存在 Cohen's d 为 +0.30 的效应），且明确承认该现象部分依赖于 Qwen3 chat template 丢弃历史 reasoning 的结构特性。论文缺少在异构模型对或不同 template 结构下对该假设普适性的验证，一旦更换为保留完整历史 reasoning 的模型，$\\bar{l}_k$ 的跨 turn 动态可能会被彻底改变。\n\n### § 10 最小复现实验\n在一周时间内，无需复现完整的 OPD 训练循环，只需验证“teacher log-probability 的下降是否真的被锁定在第一个错误动作上”这一最核心的 empirical observation。使用 $\\tau^2$-bench retail domain 的任务集，部署一个固定的 student model（如 Qwen3-4B）进行 multi-turn rollout 生成 trajectories。通过环境提供的 reference behavior 自动标注出每条失败 trajectory 的 first error turn $t^*$。同时，使用 teacher model（如 Qwen3-30B）计算每个 turn 的 mean teacher log-probability $\\bar{l}_k$。接着，将所有失败 trajectory 按 turn offset $k - t^*$ 对齐，计算 $\\bar{l}_k$ 相对于 turn index 均值的 residual。如果 residual 在 $t^*$ 之前保持平稳或轻微正向，而在 $t^*$ 处及之后显著翻转为负值，则支持了论文的 core claim，证明 online OOD probe 确实能捕捉到 action-locked 的信号衰减；如果 residual 在 $t^*$ 之前就已经呈现明显的下降趋势，或者在 $t^*$ 之后没有显著的负向翻转，则反驳了该假设，说明 STRIDE 的 early stopping 机制在实际上无法精准定位错误发生点，其加速效果是以牺牲有效 supervision 为代价的。", "research_value": "### § 11 最强反例设计\n\n要构建对 STRIDE 最具破坏性的反例，我会设计一个名为“Delayed Manifestation Environment”（延迟显现环境）的实验，直接攻击其核心假设——即 teacher 的 per-turn mean teacher log-probability $\\bar{l}_k$ 能够在 student 的第一个错误动作处即时且急剧下降。STRIDE 在 $\\tau^2$-bench retail 上取得成功，可能仅仅是因为该领域的 tool-call 错误（如调用错误的 API 或传入错误参数）会立即引发环境报错或返回空值，这种 syntax-level 或 shallow semantic-level 的错误极易被 teacher 察觉，从而导致 $\\bar{l}_k$ 骤降。换言之，STRIDE 的 early stopping 机制可能只是在充当一个延迟的“语法错误检测器”，而非真正的“语义 OOD 探测器”。在 delayed manifestation 场景中，我要求 student 执行一个多轮的复杂数据库查询与推理任务，其中 student 在 turn $k$ 的错误动作（例如使用了不恰当的 JOIN 逻辑或忽略了某个隐含约束）在语法上完全合法，环境也会返回看似正常的 observation，但这个错误直到 turn $k+3$ 才导致最终的聚合结果异常。在这种条件下，teacher model 在 turn $k$ 给出的 $\\bar{l}_k$ 极大概率不会下降，因为该 action 在局部上下文中是 plausible 的。这将导致 STRIDE 的 early stopping 机制发生严重的 false negative 失效：系统未能及时截断，student 继续基于错误状态生成后续 turn，而 prefix buffer 更会将这个包含致命逻辑错误的 turn $k$ 缓存为“正确前缀”（因为 $\\bar{l}_k \u003E \\alpha$）。在后续训练中，student 将从这个污染的 prefix 重启，导致训练在错误的状态空间中反复打转，不仅无法加速，反而会比 Full OPD 收敛到更差的 local optima。这个反例揭示了一个根本性的替代解释：STRIDE 的有效性高度依赖于任务错误具有“即时可察觉性”，一旦面对错误后果延迟显现的 deep reasoning 任务，其基于 teacher log-probability 的 reactive 探测机制将可预测地崩溃。\n\n### § 12 Follow-up Research Idea\n\n基于上述局限，我提出一个非增量的 novel research idea：**Counterfactual Trajectory Probing for Proactive Distillation (CTP-PD)**。该想法的驱动需求是：OPD 中的 OOD drift 不应依赖 teacher 的 reactive scoring（即等 student 犯错后 teacher 才察觉），而应通过 proactive 机制在错误动作执行前就预测其长期后果。STRIDE 及其并发方法均将 teacher 视为被动的“裁判”，但 teacher 真正的价值在于其隐式掌握的环境动力学。我们可以借鉴 Model-based Reinforcement Learning (MBRL) 中的 forward dynamics model 和 counterfactual reasoning 概念，将 teacher 重新用作一个“世界模型模拟器”。具体而言，在 student 生成 turn $k$ 的 action 之前，我们不直接计算 $\\bar{l}_k$，而是让 teacher 基于当前历史生成多个 counterfactual next observations，并评估 student action 在这些假想未来中的 robustness。如果 student 的 action 在 teacher 预测的多数未来中导致 state divergence，则判定其为 OOD 并提前截断。这一 framing 将 OPD 的加速从“检测偏离”转变为“预测偏离”，彻底绕过了 delayed manifestation 问题。第一个实验将构建一个具有 delayed reward 特性的 multi-turn text-to-SQL 环境，训练一个 lightweight forward model 预测 SQL 执行后的 state embedding。对比 STRIDE 的 reactive $\\bar{l}_k$ 探针和 CTP-PD 的 proactive counterfactual 探针在 OOD detection latency（以 turn 为单位）和 final task success rate 上的差异。如果 CTP-PD 能在错误动作发生的当轮提前截断，而 STRIDE 平均延迟 2-3 轮才截断，则证明 proactive 机制在 deep agentic 任务上具有根本性优势，从而开启将 OPD 与 world model learning 相结合的新研究方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zhiyu Gui\", \"affiliations\": [1, 2], \"markers\": [\"‡\", \"∗\"]},\n    {\"name\": \"Kexin Huang\", \"affiliations\": [1], \"markers\": [\"‡\"]},\n    {\"name\": \"Jia Guo\", \"affiliations\": [2], \"markers\": [\"†\"]},\n    {\"name\": \"Junkang Wu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zihao Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Zhiqiang Zhang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jun Zhou\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jiancan Wu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiang Wang\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"USTC\"},\n    {\"id\": 2, \"name\": \"Ant Group\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"‡\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding authors\"},\n    {\"marker\": \"∗\", \"text\": \"Work done during internship at Ant Group\"}\n  ]\n}\n```", "summary_translation": "On-policy distillation (OPD) 已成为将能力从大型 teacher 转移到紧凑型 student 的标准方法。然而，其成本主要由 autoregressive student rollout 主导，并且在 multi-turn agentic setting 中扩展性较差。现有的加速方法根据固定的 offline budget 来截断或重定位 supervision signal，尽管 teacher-signal reliability 在 trajectory 内部和跨 trajectory 之间存在显著差异。我们在 $τ^2$-bench 上的实证分析揭示了这种差异中的清晰结构：informative supervision 集中在每个 turn 的 prefix 中，并且最重要的是，对于 multi-turn agentic training，teacher endorsement 的 cross-turn loss 在时间上锁定于 student 的第一个 erroneous action，而不是在 turn 之间逐渐累积。基于这些发现，我们提出了 STRIDE (Stop-and-Restart on-policy Distillation acceleration)，它结合了两种互补的技术：adaptive early stopping，一旦 cumulative teacher log-probability 低于 out-of-distribution threshold 就终止 rollout；以及 prefix buffer，它缓存高质量的 prefix 并在最弱的正确 turn 处重启生成。这些机制共同形成了一种 data-driven curriculum，逐步将 coverage 扩展到后续的 turn。在 $τ^2$-bench retail 上，我们的方法匹配了 full-trajectory OPD，并在 $3.73\\times$ 加速下超越了 30B teacher，以 $2.34\\times$ 加速超越了 baseline 本身，并且在 cross-domain multi-teacher training 下保持了 $4.51\\times$ 的加速。作为 agentic setting 之外的补充泛化测试，STRIDE 在 AIME 2025 上以 $5.10\\times$ 的加速优于 full OPD，在 AIME 2024 上以 $3.08\\times$ 的加速优于 full OPD；在两次评估中平均，两个 fixed-budget truncation baseline 仍然低于 full OPD。"}, {"title": "HarnessBandit: Joint Learnability-Transferability Scheduling for Multi-Harness Agentic Reinforcement Learning", "arxiv_id": "2609.13739", "authors": "Hongliang Wei, Xiaobing Tu, Yinggui Wang, Zhengxi Liu, Rongkun Xue, Jinkui Ren, Xiantao Zhang, Debin Zhao, Xiaopeng Fan", "summary": "Language-model agents are increasingly deployed through diverse harnesses that differ in system prompts, tool schemas, control loops, and trajectory formats. The same model can perform unevenly across these interfaces, making robustness to harness variation an important objective. A natural approach is to train a shared policy through multiple harnesses, but doing so introduces a scheduling problem: each training step should favor a harness that currently provides a useful learning signal while also producing an update that benefits the other harnesses. We develop HarnessBandit, an online scheduler that selects one harness per optimizer step. After a group-relative policy optimization (GRPO) update, it observes learnability -- the mean absolute advantage on the batch -- and transferability -- the cosine between a low-dimensional gradient sketch of the current harness and exponential moving averages of the remaining harnesses. The two signals are fused after pooled sliding-window min-max normalization and sampled with a visit-dependent bonus and an explicit exploration floor. We train Qwen3.5-2B across six harnesses on ClawGym and evaluate on PinchBench (held-out tasks, in-distribution OpenClaw) and ClawEval (held-out tasks and harness). HarnessBandit improves over mixed-batch multi-harness training on both benchmarks, while training diagnostics indicate that learnability and transferability provide distinct, evolving signals.", "category": "cs.LG", "cluster": "Agent Training \u0026 Distillation", "tags": ["cs.LG"], "filter_reason": "这篇论文的核心贡献是提出了 HarnessBandit，一种用于多 Harness（智能体运行框架/脚手架，包含系统提示、工具模式、控制循环等）智能体强化学习的在线调度器。论文明确研究的是如何通过在线调度机制，在多个不同的 Agent Harness 之间训练共享的 LLM 策略，以提升智能体在不同接口下的鲁棒性和性能。这完全符合筛选标准中第一步的保留规则：“如果论文研究 agent 的 harness / scaffold / runtime ... 并且核心贡献是让这些智能体运行组件通过轨迹、反馈、观测或评估结果自动改进、演化或自适应优化”，以及“如果论文研究 ... agent training/distillation/RL，并且标题或摘要明确指向 Agentic / LLM Agents ... 应保留”。论文标题和摘要均明确指向 Agentic Reinforcement Learning 和 Language-model agents，属于智能体训练与演化的前沿研究，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的研究问题是多 harness 环境下 agentic reinforcement learning 的动态调度问题。Language-model agents 通过不同的 harnesses（包含 system prompts, tool schemas, control loops 等）与工具交互，即使底层任务和 reward function 相同，不同的 harness 也会诱导出不同的 trajectory 分布。在此背景下，如何在每个 optimizer step 从多个 harness 中选择一个进行 pure rollout batch，使得该 batch 既具有 learnability（即 group-relative advantage 均值非零以提供有效的 policy gradient），又具有 cross-harness transferability（即其梯度更新与其他 harness 的梯度方向对齐），是一个未被解决的关键问题。这个问题的重要性在于，随着 LLM agents 的广泛部署，策略对 harness 变化的鲁棒性成为核心诉求，而仅在单一 harness 上训练的策略往往无法迁移到其他接口。虽然通过多个 harness 混合训练可以降低这种敏感性，但简单的静态混合或全局 shuffle 会因为 interface mismatch 引起梯度干扰，甚至导致性能退化至不如未微调的 base model。解决这一调度问题能够有效利用多接口训练数据，避免负迁移，从而显著提升 agent 在 held-out tasks 和 held-out harnesses 上的泛化能力，同时最大化固定 GRPO budget 下的训练效率。\n\n### § 2 前人工作与不足\n这个问题之前并未得到有效解决，因为前人研究主要将多接口训练视为标准的多任务混合问题，未能将 execution interface 的调度与 on-policy RL 的动态反馈相结合。在 Agentic RL 和 tool use 领域，SWE-agent、OpenHands 和 Polar 等系统虽然将 agent-computer interface 视为一等设计对象，Polar 甚至将多个 harnesses 暴露为可互换的 rollout backends，但它们仅提供了多 harness 训练的基础设施，并未回答“给定多个 harness，哪个应生成下一个 on-policy batch”这一正交问题，通常依赖静态混合或随机采样。在 Multi-task learning (MTL) 领域，诸如 Gradient surgery 和 Distral 等方法通过投影或正则化处理多任务间的梯度冲突，但这些方法假设任务采样分布固定，且干扰源于不相交的目标；而在本文设定中，不同 harness 包装的是相同的底层任务，干扰源于 interface mismatch 而非目标差异，且这些方法不在线观察 on-policy source 当前是否产生非零 advantage 或梯度是否对齐。在 Curriculum learning 和 data mixing 领域，如 DoReMi 等方法通常通过 proxy model 离线调整 domain 权重，无法感知 on-policy 训练过程中的动态信号。前人工作之所以未能考虑 learnability 和 transferability 这两个动态信号，是因为在静态数据混合的范式下，研究者无需也无法在每次 optimizer step 后即时评估 group-relative advantage 的分布以及低维 gradient sketch 的对齐程度。HarnessBandit 首次将此问题建模为非平稳 multi-armed bandit，填补了在 GRPO 框架下根据 trainer-native 信号动态调度 execution interface 的空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在多 harness 环境下部署 language-model agents 时，一个自然的鲁棒性提升策略是使用多个 harness 联合训练同一个共享 policy。然而，传统的 multi-task learning 通常假设各任务的采样分布是固定的，或者简单地通过静态 data mixing 来联合训练。作者很可能观察到了一个失败模式：当把多个 harness 的数据随机混合进行 GRPO 训练时，模型性能不仅没有提升，反而可能崩溃，甚至不如完全不训练的 base model。这是因为在 GRPO 框架下，如果某个 harness 采样的轨迹得到的 reward 完全一致，其 advantage 会退化为零，导致该 batch 无法提供有效的 policy gradient；同时，不同 harness 由于 system prompt 和 tool schema 的差异，其产生的梯度方向可能相互冲突，导致严重的 negative transfer。\n\n面对这种静态混合训练的失效，作者自然会转向动态调度策略，将每个 harness 视为一个 non-stationary multi-armed bandit 中的 arm。但如何定义每个 arm 的 reward 信号成为了核心难点。如果仅依赖任务 reward，无法反映策略是否真正在学习；如果仅依赖梯度大小，又可能导致模型过拟合到某个特定的 scaffold 上而丧失对其他接口的泛化能力。因此，作者必须寻找两个互补的 trainer-native 信号：一个是“当前 batch 是否值得学习”，即 group-relative advantage 的绝对值幅度；另一个是“当前 batch 的更新是否会破坏其他接口的能力”，即当前梯度与其他 harness 梯度的对齐程度。将这两个信号结合，就构成了在多执行接口之间进行动态资源分配的理论基础。\n\n### § 4 核心 Intuition\n\n在多 harness 的 agentic RL 中，无脑混合不同接口的数据进行训练极易导致梯度冲突和学习信号退化。这篇论文的核心 intuition 是：在每个 optimizer step 只选择一个 harness 生成 pure batch，并且选择的标准是它既能产生非零的 advantage（learnability），又能保证其梯度更新方向与其他闲置 harness 的历史梯度大致对齐（transferability）。通过在线融合这两个信号并进行 bandit 采样，方法能够在保证每一步都有有效学习信号的同时，避免模型过拟合到单一执行接口，从而实现跨 harness 的鲁棒泛化。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n┌──────────────────────────────────────────┐\n│       HarnessBandit 单步 Pipeline         │\n├──────────────────────────────────────────┤\n│ ┌────┐ ┌──────┐ ┌────────────────┐     │\n│ │Sche│→│PureRo│→│GRPO:Adv A,∇L   │     │\n│ │选h │ └──────┘ └──┬────────┬────┘     │\n│ └─┬─┘      ┌───────┘        │          │\n│   ↑        ↓                ↓          │\n│   │ ┌──────┐   ┌──────────────┐      │\n│   │ │L_h:|A│   │T_h:sketch cos│      │\n│   │ └──┬───┘   └──────┬───────┘      │\n│   │    ↓              ↓               │\n│   │ ┌─────────────────────────┐      │\n│   │ │归一化+融合 S=αL̃+(1-α)T̃ │      │\n│   │ └───────────┬─────────────┘      │\n│   └─│Q←(1-β)Q+βS;E←EMA;θ←opt       │\n│     │U=Q+c/√(n+1);softmax+ε        │\n└──────────────────────────────────────────┘\n```\n\n以下按 Algorithm 1 的执行顺序逐步说明：\n\n**步骤 1—Scheduler 选择 harness（§4.5, Alg.1 L1—5）。** 输入为当前训练步 $t$、各 harness 的 value $Q_h$、访问计数 $n_h$。若 $t \u003C W_{\\text{up}}=30$，按 round-robin 轮流选择以收集初始观测；否则计算 $U_h = Q_h + c/\\sqrt{n_h+1}$（$c=0.2$），经 softmax（温度 $\\tau=0.3$）加 $\\varepsilon$-floor（$\\varepsilon=0.15$）采样得到 $h_t$。输出为选定的单个 harness 名称。\n\n**步骤 2—Harness-Pure Rollout（§4.1, Alg.1 L7）。** 输入为 $h_t$ 对应的独立 shuffled task pool、当前 policy $\\pi_\\theta$、batch size $B=8$、每组采样数 $G=8$。从 $h_t$ 的 pool 中抽取全部 prompt，生成纯 harness batch。输出为一组 rollout trajectories。\n\n**步骤 3—GRPO Update（§3, Alg.1 L8—9）。** 输入为 rollout trajectories。按 Dr.GRPO 计算 leave-one-out group baseline 的 advantages $A_{i,t}$（不除以 group std），同时 backward 得到 batch gradient $\\nabla_\\theta L$。此步骤产出两路信号：advantages 用于 learnability，gradient 用于 transferability。\n\n**步骤 4a—Learnability $L_h$（§4.2, Alg.1 L9）。** 输入为 advantages $A_{i,t}$。对每条 trajectory 取 token-masked mean $|A_{i,t}|$，同 prompt group 内取平均，同 harness 内再取平均得到 $L_{h_t}$。若 group 内所有 trajectory reward 相同则 $L_{h_t}\\approx 0$，表示该 batch 无学习信号。输出为标量 $L_{h_t}$。\n\n**步骤 4b—Transferability $T_h$（§4.3, Alg.1 L10—13）。** 输入为 batch gradient $\\nabla_\\theta L$。仅保留最后 $K=4$ 个 transformer block 的参数梯度（排除 embedding 和 output head），按 proportional coordinate subsample 压缩为 $d=65{,}536$ 维 sketch $\\hat{g}_{h_t}$。计算 $\\hat{g}_{h_t}$ 与其他 harness 的 EMA sketch $E_j$ 的 cosine similarity 并取平均，得到 $T_{h_t}$。首次访问某 arm 时 $T_{h_t}$ 未定义，回退为仅用 learnability。输出为标量 $T_{h_t}$。\n\n**步骤 5—归一化与融合（§4.4, Alg.1 L14）。** 输入为 $L_{h_t}$ 和 $T_{h_t}$。在跨 harness pooled 的滑动窗口（$W=32$）内做 min-max 归一化得到 $\\tilde{L}_h$、$\\tilde{T}_h$，再以 $S_h = \\alpha\\tilde{L}_h + (1-\\alpha)\\tilde{T}_h$（$\\alpha=0.5$）融合。输出为 instantaneous score $S_{h_t}$。\n\n**步骤 6—Value 与 EMA 更新（§4.4, Alg.1 L15—16）。** 输入为 $S_{h_t}$。以 EMA 更新 $Q_h \\leftarrow (1-\\beta)Q_h + \\beta S_h$（$\\beta=0.3$），同时将当前 unit sketch 以 EMA rate $\\eta=0.3$ 更新到 $E_{h_t}$。未访问过的 arm 在选择时赋值 $\\max_j Q_j$ 以防 softmax 饥饿。输出为更新后的 $Q$ 表和 EMA sketches。\n\n**步骤 7—Optimizer Step（Alg.1 L17）。** 用累积的 $\\nabla_\\theta L$ 执行 Adam 更新得到 $\\theta_{t+1}$。此步骤与标准 GRPO 完全一致，HarnessBandit 不修改 policy objective。\n\n**评测阶段。** 训练完成后，固定 checkpoint 在两个 held-out benchmark 上评测：PinchBench 使用 in-distribution 的 OpenClaw harness 跑 147 个未见任务；ClawEval 使用 out-of-distribution 的 native loop 跑 161 个未见任务，$N=3$ 次独立试验。评测时无 bandit 调度，仅用固定 harness 执行推理。\n\n---\n\n### § 6 核心数学推导\n\n本文的方法论建立在以下几个关键数学关系上，原文部分公式因排版抽取缺失，以下依据正文文字描述和 Algorithm 1 补充确认的定义与标准背景。\n\n**GRPO Advantage（§3）。** 对每个 prompt group 中的 $G$ 条 trajectory，advantage 通过 leave-one-out group baseline 计算：$A_{i,t} = r_i - \\text{mean}(r_{\\neq i})$。Dr.GRPO 的关键修改是不除以 group standard deviation，这避免了当组内 reward 方差接近零时 advantage 爆炸的问题。Intuition：如果一组采样全部成功或全部失败，advantage 趋近零，policy gradient 几乎不更新——这正是 learnability 信号的来源。\n\n**Learnability（§4.2）。** $L_h$ 定义为 harness $h$ 下所有 group 的 token-masked mean $|A_{i,t}|$ 的两层平均（先组内、再组间）。等权 group 平均防止长 trajectory 主导信号。Intuition：$L_h$ 衡量当前 batch 是否包含\"有区分度\"的 trajectory——既有成功又有失败时 $L_h$ 大，policy 能从对比中学到东西；全成功或全失败时 $L_h \\approx 0$，该步无信息量。\n\n**Transferability via Gradient Sketch（§4.3）。** 对 batch gradient $\\nabla_\\theta L$，仅取最后 $K=4$ 层参数，通过固定 random coordinate subsample 压缩为 $\\hat{g}_h \\in \\mathbb{R}^{65{,}536}$。Transferability 定义为当前 sketch 与其他 harness EMA sketch 的平均 cosine similarity：$T_h = \\frac{1}{|J|}\\sum_{j \\in J} \\cos(\\hat{g}_{h_t}, E_j)$。理论背景：Johnson–Lindenstrauss lemma 保证随机投影在高维空间中近似保持内积，因此 sketched cosine 是 full-gradient cosine 的无偏近似。Intuition：$T_h$ 大意味着在 harness $h$ 上做的更新方向与其他 harness 需要的更新方向一致，该更新能\"迁移\"到其他 interface；$T_h$ 为负则意味着过度拟合该 scaffold 的特异性方向。\n\n**Pooled Sliding-Window Normalization（§4.4）。** $L_h$ 和 $T_h$ 量纲不同（前者是 advantage 绝对值，后者是 cosine ∈ [-1,1]），在跨 harness pooled 的最近 $W=32$ 个观测窗口内分别做 min-max 归一化。Intuition：pooled（而非 per-arm）归一化保留了 harness 间的对比信息——如果所有 harness 的 learnability 都低，归一化后仍能区分相对较高者。\n\n**Fusion 与 Value Update（§4.4）。** $S_h = \\alpha\\tilde{L}_h + (1-\\alpha)\\tilde{T}_h$（$\\alpha=0.5$），再以 EMA 平滑为 $Q_h$。Intuition：等权融合意味着 scheduler 同时偏好\"有学习信号\"和\"能迁移\"的 harness，避免仅优化 learnability 导致陷入 idiosyncratic harness，或仅优化 transferability 导致选择当前无信号的 harness。\n\n**Sampling Rule（§4.5）。** $U_h = Q_h + c/\\sqrt{n_h+1}$，采样分布 $p(h) = (1-\\varepsilon)\\text{softmax}(U/\\tau) + \\varepsilon/H$。Intuition：$c/\\sqrt{n_h+1}$ 是类 UCB bonus，鼓励探索访问不足的 arm；$\\varepsilon$-floor 保证每个 arm 至少有 $\\varepsilon/H$ 的概率被选中，防止某 arm 被永久饿死。两者不可互换：bonus 随 $n_h$ 增长而衰减但不随 $t$ 增长（不同于 UCB1 的 $\\sqrt{\\ln t/n}$），所以一个停止被选中的 arm 的 bonus 会冻结，只有 $\\varepsilon$-floor 能给它重新被选中的机会。\n\n---\n\n### § 7 实验设计与结论\n\n**问题 1：多 harness 训练中，基于 learnability 和 transferability 的动态调度是否优于静态混合 batch？**\n\n实验设计：在相同的 2,000 ClawGym tasks × 6 harnesses 数据集、相同的 150 步 GRPO budget 和相同硬件下，对比四种方法——HarnessBandit（每步纯 harness batch + bandit 调度）、Mixed 6 harnesses（全局 shuffle 混合 batch）、Mixed OpenClaw+Codex（仅两 harness 混合）、以及未微调的 base model。评测在两个 held-out benchmark 上进行：PinchBench（147 个未见任务，使用 in-distribution 的 OpenClaw harness）和 ClawEval（161 个未见任务，使用 out-of-distribution 的 native loop，$N=3$）。\n\n答案：HarnessBandit 在 PinchBench 上取得 0.506，优于两 harness 混合的 0.493，远超六 harness 混合的 0.331（与 base model 0.330 几乎持平）。在 ClawEval 上，HarnessBandit 在 Pass[3] 上与 base model 持平（26.7%），在 pass@3（41.6%）和 mean score（0.556）上超过所有对比方法。关键发现是：六 harness 静态混合不仅未改善、反而几乎完全无效，说明简单混合多个 interface 的 batch 会引入有害的 gradient 干扰；而 HarnessBandit 通过每步选择单一 harness 并基于信号调度，有效避免了这种干扰。\n\n**问题 2：Learnability 和 transferability 是否提供了不同的、互补的信号？**\n\n实验设计：记录训练过程中每个 harness 的归一化 learnability $\\tilde{L}_h$ 和 transferability $\\tilde{T}_h$（Figure 2），以及未归一化的原始信号（Figure D.1），分析两者的排名差异和动态变化。同时绘制 pairwise gradient cosine（Figure E.1）以理解 transferability 的细粒度几何结构。\n\n答案：两个信号给出不同的 harness 排名——Pi 的 learnability 最高（0.75）但 transferability 仅中等（0.49）；OpenCode 在两者上都高（0.62, 0.60）；Qwen Code 的 transferability（0.37）显著低于 learnability（0.53）。这表明 transferability 不是 learnability 的单调变换，两者确实捕捉了不同维度的信息。Pairwise gradient cosine 在正负区间波动，不存在任何单一 harness 始终与其他所有 harness 对齐，解释了为何 transferability 状态随训练动态演化而非锁定在固定值。\n\n**问题 3：Bandit 调度是否会 collapse 到单一 harness？**\n\n实验设计：记录训练结束时的采样概率 $p_h$ 和 visit counts $n_h$（Figure C.1, Appendix F），与均匀分配（$p_h = 1/6 \\approx 0.167$，约 25 visits/arm）对比。\n\n答案：最终采样概率在 0.127—0.204 之间，visit counts 在 21—32 之间，是一种温和的重新分配——向 OpenClaw、Pi、OpenCode 倾斜，但 Qwen Code 和 Codex 仍保持在 $\\varepsilon$-floor 之上。没有发生 collapse 到单一 arm 的现象，验证了 $\\varepsilon$-floor 和 UCB-like bonus 的探索机制有效。", "additional_insights": "### § 8 Take-aways\n本文指出，在 multi-harness agentic RL 中，同一个 task 在不同 harness（系统提示、工具格式、控制循环等）下会产生不同的 trajectory 分布，导致单一 harness 训练的 policy 难以泛化。为此，作者提出了 HarnessBandit，一个构建于 GRPO 之上的在线调度器，它在每个 optimizer step 将多 harness 训练建模为 non-stationary multi-armed bandit 问题，只选择一个 harness 生成 pure rollout batch。该调度器融合了两个互补信号：衡量当前 batch 是否提供有效学习信号的 learnability（mean absolute advantage），以及衡量当前更新是否对其他 harness 有益的 cross-harness transferability（当前 harness 的 low-dimensional gradient sketch 与其他 harness EMA 的 cosine similarity）。通过 pooled sliding-window min-max normalization 和带有 exploration floor 的 UCB-softmax 采样，HarnessBandit 在 Qwen3.5-2B 上进行 150 步 GRPO 训练后，在 held-out tasks 和 held-out harness 的评估中均优于 static mixed-batch baselines，且没有坍缩到单一 harness。\n\n### § 9 最脆弱的假设\n本文最核心且失败代价最大的假设是：**当前 harness 的 low-dimensional gradient sketch 与其他 harness 的 gradient EMA 之间的 cosine similarity（即 transferability），能够准确预测该更新对其他 harness 的泛化/迁移价值。** \n在实际中，这个假设可能不成立，原因在于 RL 的 policy gradient 具有极高的方差，单次 batch 的梯度方向噪声极大。虽然作者只提取了最后 4 个 transformer blocks 的梯度并降维至 65,536 维以减少计算开销，但这种 aggressive sketching 可能会丢失关键的 harness-specific 方向信息。此外，cosine similarity 仅衡量方向一致性而忽略梯度大小，如果两个 harness 的梯度方向一致但幅度差异巨大，或者方向轻微偏离但包含关键的特定信息，该指标可能会给出误导性的高分。如果 transferability 信号实际上是噪声，那么 bandit 的调度将退化为仅依赖 learnability，甚至可能被错误信号引导而产生负面调度。\n论文提供的证据仅限于 Figure 2 和 Appendix E 展示的 transferability 与 learnability 排名不同，以及 transferability 随时间波动的几何特征。然而，论文**缺少直接的消融实验**来证明 transferability 信号本身对最终性能提升的独立贡献（例如对比仅使用 learnability 的 bandit），因此无法排除最终性能提升完全来自 learnability 调度或 bandit 探索机制的可能性。\n\n### § 10 最小复现实验\n如果有一周时间，可以设计一个最小复现实验来验证 transferability 信号是否真的提供了超越 learnability 的额外价值。不需要复现复杂的 agentic RL 环境，可以使用一个小型 LM（如 0.5B 模型）在同一个数学推理数据集（如 GSM8K）上，使用 3 种不同的 prompt 模板（作为 3 个 \"harness\"）进行 GRPO 训练。实现一个极简的 gradient sketcher，仅提取模型最后一层 transformer block 的梯度并随机投影到几千维。然后运行三种调度策略：Random selection、Learnability-only bandit 和完整的 HarnessBandit (Learnability + Transferability)。在训练过程中，记录每种策略下模型在 3 种 prompt 模板下的 held-out 验证集准确率。如果 HarnessBandit 的平均准确率显著优于 Learnability-only bandit，则支持论文关于 transferability 提供独特且有用信号的 claim；如果两者表现相当，则反驳了 transferability 信号的必要性，说明性能提升可能仅源于 learnability 调度。", "research_value": "### § 11 最强反例设计\n\n要对该论文进行最有力的攻击，核心在于挑战其提出的 transferability 信号是否具有真实的因果效用，还是仅仅是一个伴随的噪声变量。论文最致命的理论缺陷在于：在 on-policy RL 中，单次 batch size 极小（$B=8, G=8$）的 policy gradient 具有极高的方差，其对 65,536 维的 gradient sketch 计算 cosine similarity，在统计上极不稳定。由于 Dr.GRPO 的 advantage 不除以 group standard deviation，当组内 reward 方差微小但非零时，梯度幅值可能剧烈波动，此时 cosine similarity 主要被噪声主导，而非真实的泛化方向。为了证实这一点，我会设计一个“Shuffled Transferability”消融实验：在完全相同的训练 pipeline 下，保持 learnability 信号 $L_h$ 和 bandit 探索机制不变，但在计算 transferability $T_h$ 时，故意从其他随机 optimizer step 或随机 harness 中抽取 EMA sketch 进行匹配（即注入完全错乱的 gradient alignment 信号）。如果这个“Shuffled Transferability”版本的 HarnessBandit 在 PinchBench 和 ClawEval 上依然能取得与原版相当的性能（远超 static mixed-batch），就能确凿地证明：性能提升完全归功于“纯 harness batch 避免了 intra-batch gradient interference”加上“learnability 调度过滤了无效更新”，而 transferability 信号本质上是一个不起作用的数学幻象。此外，从真实场景攻击，如果存在一个“Orthogonal Harness”（例如一个是纯文本输出，另一个是结构化 JSON API，底层 representation 完全解耦），强制要求它们的 gradient cosine 对齐，不仅违背多任务学习的异构性本质，还可能迫使 policy 在 representation bottleneck 上做出妥协，导致在需要 harness-specific 深度推理的 held-out 任务上性能可预测地崩溃。\n\n### § 12 Follow-up Research Idea\n\n本文的局限在于将多接口训练视为一个对单一 monolithic policy 进行时序调度的问题，这不可避免地会遇到 representation bottleneck：当不同 harness 的 interface mismatch 本质上是结构性的（如不同的 tool schemas 导致不同的 latent state distributions），强制对齐它们的 gradient direction 或寻找一个共享的 policy subspace，可能会抹杀 harness-specific 的推理模式。基于此未满足的需求，我提出一个全新的 framing：**Interface-Invariant Policy Decomposition via Harness-Conditioned Hypernetworks**。该研究不再通过 bandit 在不同 harness 间做“非此即彼”的时序妥协，而是将策略网络显式解耦为一个 harness-agnostic 的“Reasoning Core”和一组 harness-specific 的“Interface Adapters”，并借鉴 Invariant Risk Minimization (IRM) 的思想，在目标函数中显式惩罚不同 harness 环境下 latent trajectory representations 的分布差异。具体而言，可以借鉴 Hypernetworks 领域的方法，用一个轻量级网络以 harness 的 system prompt 和 tool schema 为输入，动态生成 adapter 的 LoRA 权重。这样，RL 的 gradient 不再需要在同一个参数空间里竞争对齐度，而是自然地路由到 condition-specific 的子空间中。第一个实验将设计一个包含高度异构 harness 的 ClawGym 子集（如纯文本 ReAct 与结构化 OpenClaw），对比三种架构：标准 GRPO（static mix）、HarnessBandit（时序调度）、以及 Hypernetwork-IRM（结构解耦）。核心评测指标不仅是 held-out task 的成功率，更关键的是利用 Centered Kernel Alignment (CKA) 测量不同 harness 下 model 中间层 latent representations 的相似度。如果 Hypernetwork-IRM 在保持更高 CKA（证明学到了 invariant reasoning）的同时，在 out-of-distribution harness 上大幅超越 HarnessBandit，这将证明结构化解耦优于时序调度，从而开启“基于因果不变性的 agentic RL”这一全新研究方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Hongliang Wei\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Xiaobing Tu\", \"affiliations\": [2], \"markers\": [\"*\", \"†\"]},\n    {\"name\": \"Yinggui Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Zhengxi Liu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Rongkun Xue\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jinkui Ren\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Xiantao Zhang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Debin Zhao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiaopeng Fan\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Harbin Institute of Technology\"},\n    {\"id\": 2, \"name\": \"Alibaba Cloud\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution.\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding authors.\"}\n  ]\n}\n```", "summary_translation": "语言模型 agents 正越来越多地通过不同的 harnesses 进行部署，这些 harnesses 在 system prompts、tool schemas、control loops 和 trajectory formats 上各不相同。同一个模型在这些 interfaces 上的表现可能参差不齐，这使得对 harness variation 的 robustness 成为一个重要目标。一种自然的方法是通过多个 harnesses 训练一个 shared policy，但这样做会引入一个 scheduling problem：每个 training step 应该倾向于选择当前能提供有用 learning signal 的 harness，同时产生的 update 也要能惠及其他 harnesses。我们开发了 HarnessBandit，这是一种在每个 optimizer step 选择一个 harness 的 online scheduler。在进行 group-relative policy optimization (GRPO) update 之后，它会观察 learnability——即 batch 上的 mean absolute advantage——以及 transferability——即当前 harness 的 low-dimensional gradient sketch 与剩余 harnesses 的 exponential moving averages 之间的 cosine。这两个信号在经过 pooled sliding-window min-max normalization 后进行融合，并通过 visit-dependent bonus 和 explicit exploration floor 进行采样。我们在 ClawGym 上跨六个 harnesses 训练 Qwen3.5-2B，并在 PinchBench（held-out tasks，in-distribution OpenClaw）和 ClawEval（held-out tasks 和 harness）上进行评估。HarnessBandit 在两个 benchmarks 上均优于 mixed-batch multi-harness training，同时 training diagnostics 表明 learnability 和 transferability 提供了不同的、不断演变的 signals。"}]}, {"name": "Multi-Agent Collaboration", "count": 2, "papers": [{"title": "Assembling the CREW: A Collaborative Multi-agent Reinforcement Learning Framework for Automated Related Work Generation", "arxiv_id": "2609.15721", "authors": "Hai-Dang Dang, Bao-Yen Pham, Bao Nguyen, Tran Thi Huong, Huynh Thi Thanh Binh", "summary": "Automatic Related Work Generation (RWG) significantly reduces the human time and effort required to author the Related Work Section (RWS) of a research paper. However, prior methods leveraging multi-agent Large Language Models (LLMs) typically rely on a predefined workflow, where each agent is responsible for a specific step in the entire process. This rigid, static inter-agent coordination limits the adaptive collaboration required to synthesize complex scientific literature. To address this limitation, we propose CREW (Collaborative Reinforcement Learning for Related Work Generation), a novel framework where LLM agents bypass heuristic pipelines to dynamically coordinate by autonomously selecting actions, such as Retrieve, Disseminate, Compose, and Critique, driven by a policy optimized via Independent Proximal Policy Optimization (IPPO). Extensive experiments on a standard RWG benchmark demonstrate that our approach yields substantial quality improvements over strong existing baselines, while significantly reducing token costs. Code is available at https://github.com/YenPBao/CREW-Collaborative-MARL.git", "category": "cs.LG", "cluster": "Multi-Agent Collaboration", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Multi-Agent)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=24 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 论文的核心贡献是提出了CREW框架，一种基于多智能体强化学习（MARL，具体为IPPO）的动态协作机制。该框架让LLM智能体绕过传统的静态预定义工作流，通过自主选择动作（如检索、传播、撰写、批评）来实现自适应的动态协调。这完全符合研究焦点中“多智能体：多智能体系统中新的协作机制”以及“agent training/distillation/RL”的正面指标。虽然该论文的应用场景是自动生成相关工作（RWG），但根据第一步排除规则1的例外说明，论文在特定领域中提出了新的智能体机制（基于RL的动态协作策略），因此不应被作为“非演化型应用”排除。此外，该研究不涉及被排除的系统工程层面的拓扑结构或通信协议，也不涉及安全、多模态或图相关技术。因此，该论文与构建和改进LLM多智能体协作机制的研究目标高度相关。", "intro_logic": "### § 1 研究问题与重要性\n\n本文研究的核心问题是：如何让多个 LLM agents 在自动生成研究论文 Related Work Section (RWS) 时，摆脱预定义的固定工作流程，实现动态、自适应的协作。具体而言，给定一篇目标论文的标题与摘要以及一组候选参考文献，系统需要自动合成一段逻辑连贯、引用准确的 related work 文本。这一问题的重要性源于文献综述在科研工作流中的瓶颈地位——随着科学出版物数量的快速增长，学者需要耗费大量时间阅读、总结、对比前人发现，这一过程既耗时又劳动密集。RWG 作为 NLP 的一个研究方向最早由 Hoang and Kan (2010) 提出，其目标是将初始概念与潜在参考文献列表转化为一份全面覆盖关键发现并带有准确引用的综述草稿。解决这一问题不仅能显著降低学者的写作负担，还能为更广泛的多文档合成任务（如新闻聚合）提供可迁移的协作框架。\n\n### § 2 前人工作与不足\n\nRWG 研究沿三条方法论路径演进，每条路径均存在结构性局限。**Extractive 方法**（如 ReWoS [Hoang and Kan, 2010]、基于 PLSA 聚类与回归排序的方法 [Hu and Wan, 2014]、利用 citation context 的方法 [Chen and Zhuge, 2016]、SERGE [Deng et al., 2021]、以及基于图的方法 ToC-RWG [Wang et al., 2020]）直接从源文档中抽取并拼接句子，虽然忠实于原文且引用可靠，但其改写和抽象能力有限，产出的综述冗余且结构不佳；更关键的是，它们依赖预先存在的比较性句子，而这类句子在实际文献中难以获取，导致无法生成真正的比较性和分析性讨论。**Abstractive 监督模型**（如 RRG [Chen et al., 2021]、TAG [Chen et al., 2022]）通过关系图建模论文间交互，在 section-level 生成中取得了较好效果，但它们需要从头训练，依赖任务特定的标注数据集，当扩展到包含大量参考文献的大规模语料时，计算和内存开销巨大，且难以迁移到新领域。**基于 LLM 的方法**利用强大的生成能力，但单 LLM 方法面临两个根本性障碍：一是 hallucination 问题，二是 context window 限制——高质量的综述需要同时推理大量参考文献之间的复杂关系，而即使使用长上下文模型（如 GPT-4o 的 128K token 容量），将所有参考文献简单拼接进单一输入仍然无效，因为长上下文会稀释 attention，导致重要的跨文档关系被忽略；基于 retrieval 的替代方案（如 Izacard and Grave, 2021; Wu et al., 2022）虽减轻了上下文负担，却可能遗漏相关证据、削弱覆盖范围。\n\n为克服上述限制，近期研究转向 **multi-agent LLM 框架**，将 RWG 过程分解为子任务并分配给不同 agent。例如 SRW（Liu et al., 2025）采用 Selector、Reader、Writer 的固定角色分工，Wu et al. (2023) 和 Li et al. (2023) 也采用类似的预定义交互模式。然而，这些方法存在一个未被解决的核心缺陷：**固定的子任务分配迫使整个流程顺序执行**，不仅增加了推理时间，更关键的是**缺乏一种机制，使得当某个子任务变得关键时，多个 agent 能够动态地协作处理同一子任务**。例如，当 agents 从阅读阶段进入起草阶段后，可能发现已收集的证据仍然不足，但此时所有 agent 都被固定在写作角色上，继续起草变得无效——系统无法自适应地将部分 agent 重新分配到检索或知识补充任务。这种刚性协调的根本原因在于：先前工作将多 agent 协作建模为静态的角色分配问题，而非动态的决策问题，因此无法处理子任务重要性随上下文变化的情况。本文正是针对这一缺口，提出基于 MARL 的动态行动选择框架，使 agents 能够根据局部观察自主选择 Retrieve、Disseminate、Compose 或 Critique 行动，从而实现真正自适应的协作。", "core_insight": "### § 3 重建作者的思考路径\n\n在解决 Related Work Generation (RWG) 问题时，研究界经历了从 extractive 到 abstractive 再到 LLM-based 方法的演进。随着 Large Language Models (LLMs) 的兴起，单模型面临 context window 限制和 attention dilution 问题，促使学界转向 multi-agent 框架，将任务分解为 Select、Read、Write 等固定子任务分配给不同 agent。然而，这种 predefined workflow 暴露出根本性缺陷：静态角色分配迫使流程顺序执行，且当某个子任务（如证据收集）成为瓶颈时，系统无法动态调配其他 agent 协助，导致后续步骤在信息不足下无效运转。作者观察到，真正高效的学术写作协作并非机械流水线，而是研究者根据当前文献掌握程度、草稿状态和同伴进展，动态决定下一步是继续检索、分享知识、撰写还是审阅。这种 context-dependent 的动态协作需求自然指向了 Multi-Agent Reinforcement Learning (MARL)——通过学习共享策略让 agent 自主选择动作，而非依赖中央编排器。进一步，为促进主动信息共享和相互修正，作者在传统 retrieve 和 compose 动作外引入 Disseminate 和 Critique，使 agent 能在证据不足时主动共享知识，在草稿有缺陷时提供反馈。整个框架被形式化为 Dec-POMDP，每个 agent 基于局部观察独立决策，通过 team-level reward 协调，最终用 IPPO 优化策略，实现去中心化的自适应协作。\n\n### § 4 核心 Intuition\n\n先前 multi-agent 方法失效的根源在于：固定角色分配剥夺了 agent 根据当前状态调整行为的权利，导致系统无法在关键子任务上动态集中资源。CREW 的核心 intuition 是：将协作控制权从 predefined pipeline 交给 learned policy，让每个 agent 根据局部观察自主选择 Retrieve、Disseminate、Compose 或 Critique，使团队能在证据不足时主动补漏、在草稿缺陷时及时修正。这种基于 MARL 的动态协调，使 agent 行为由全局奖励驱动而非预设规则，从而在复杂文献综合中实现真正自适应的协作。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\nInput: Citing Paper, Refs\n      |\n      v\n[Init Shared Env] (L, G, D, F)\n      |\n      +\u003C------- Sampling Phase --------+\n      |               |                |\n      |               v                |\n      |      [Local Obs: 20-D]         | Training Phase\n      |               |                | (IPPO Update:\n      |               v                |  Actor \u0026 Critic)\n      |      [Policy pi_theta]         |\n      |               |                |\n      |               v                |\n      |   [Action: Retrieve/Dissem/    |\n      |    Compose/Critique]           |\n      |               |                |\n      |               v                |\n      |     [Env Update \u0026 Reward]      |\n      |               |                |\n      +\u003C------- Buffer Agg. \u003E----------+\n      |\n      v\n[Inference] -\u003E Final Draft\n```\n\n1. **初始化阶段**：输入 Citing paper 的 Title 和 Abstract，以及 Reference papers 集合。系统构建 Citation graph，并初始化共享环境，包含四种文档状态：Local Knowledge (L)、Global Knowledge (G)、Draft (D) 和 Feedback (F)。（对应 3.1 Dec-POMDP Formulation）\n2. **采样阶段**：每个 Agent 获取局部观测 $o_t^{[i]}$，由 20 维特征向量构成，涵盖 Semantic relevance、Coverage and Novelty 等五个维度。Actor 网络根据观测采样动作，动作空间包含 Retrieve（检索并更新 L）、Disseminate（将 L 合并至 G）、Compose（利用所有信息修改 D）、Critique（审查 D 并更新 F）。环境更新状态后，计算 Delta-based cooperative reward，并将交互数据存入 Buffer。（对应 3.1, 3.2, Algorithm 1）\n3. **训练阶段**：从 Buffer 聚合数据，使用 IPPO 算法更新共享的 Actor 和 Critic 网络。Actor 最大化 clipped surrogate objective，Critic 最小化 value loss。此阶段通过参数共享机制确保计算效率。（对应 3.2）\n4. **推理阶段**：移除环境奖励与 Buffer，使用训练好的 Policy $\\pi_\\theta$ 指导 Agent 进行多轮异步交互，最终输出 Draft D 作为 Related Work Section。（对应 3.2, Algorithm 1）\n\n### § 6 核心数学推导\n\n本论文的核心数学推导基于 Dec-POMDP 框架与 IPPO 优化算法。Dec-POMDP 适用于部分可观测、去中心化控制的多智能体场景，其中每个 Agent 仅能观测到局部状态。\n\n**状态与观测**：全局状态 $s_t$ 包含静态输入与动态文档（L, G, D, F）。观测 $o_t^{[i]}$ 是状态的局部视图。为避免文本直接输入导致观测空间过大，模型使用 Embed 算子将每个文档组件压缩为 5 维特征向量，最终拼接为 20 维观测向量。这为 Policy 网络提供了紧凑且固定的输入维度。\n\n**奖励函数**：奖励定义为 $r_t^{[i]} = \\Delta Q^{(D_t)} + \\lambda_t \\Delta Q^{(k_t^{[i]})}$。第一项是 Draft-quality gain，反映整体草稿质量提升；第二项是 Component-quality gain，反映 Agent 特定动作对目标产物的改进。衰减系数 $\\lambda_t$ 的 intuition 是鼓励 Agent 早期专注于信息收集与背景文档构建，后期逐渐转向 Compose 动作，从而保证生成逻辑的连贯性。\n\n**IPPO 优化**：Actor 网络使用 PPO 的 clipped surrogate objective $L^{CLIP}(\\theta) = \\hat{\\mathbb{E}}_j \\min(\\rho_j(\\theta) \\hat{A}_j, \\text{clip}(\\rho_j(\\theta), 1-\\epsilon, 1+\\epsilon) \\hat{A}_j)$，其中 $\\rho_j(\\theta)$ 是新旧策略的概率比。该公式的 intuition 是通过截断机制限制策略更新步长，防止破坏性更新。Critic 网络使用 value loss $L^{VF}(\\phi) = \\hat{\\mathbb{E}}_j (V_\\phi(o_j) - \\hat{R}_j)^2$ 学习状态价值，优势函数 $\\hat{A}_j$ 使用 GAE 估计以降低方差。\n\n### § 7 实验设计与结论\n\n**问题 1**：CREW 框架是否能提升 RWG 的质量、引用准确性和效率？\n**实验设计**：在 OARELATEDWORK 数据集上，与 Multi-Agent (SRW, Orchestrator)、Single LLM (GPT-4o Long Context, RAG) 和 Abstractive (PRIMERA) 基准对比，使用 LLM-as-a-Judge 和 Citation Verification 评估。\n**答案**：CREW 在 Overall 质量和 Citation Verification 上优于所有基准，同时 Token 消耗更低，推理时间具有竞争力。这表明学习到的协调策略能显著提升生成质量与效率。\n\n**问题 2**：学习到的协调策略是否可以跨模型和跨领域迁移？\n**实验设计**：模型迁移：固定训练好的控制器，将推理模型替换为 LLaMA 8B, Gemini 2.0 Flash, GPT-4o。跨领域迁移：在 Multi-News 数据集上测试，不重新训练策略。\n**答案**：策略在不同推理模型上均带来质量提升，且在 Multi-News 上也优于基准。这证明协调知识与执行器解耦，学习到的动作选择策略具有泛化性。\n\n**问题 3**：CREW 的关键组件（反馈动作、社交活动观测、草稿质量奖励）对性能有何贡献？\n**实验设计**：消融实验，分别移除 Draft Quality Reward、Feedback Action 和 Social Activity Observation。\n**答案**：移除 Feedback Action 导致最大幅度的性能下降（Overall 降至 2.58），因为无法纠正幻觉引用；移除社交活动观测导致冗余行为和协调变差；移除草稿质量奖励导致引用验证率大幅下降。这证明了这些组件对协调、修订和引用可靠性至关重要。", "additional_insights": "### § 8 Take-aways\n本文提出了CREW框架，将Related Work Generation (RWG) 任务建模为Decentralized Partially Observable Markov Decision Process (Dec-POMDP)，使多个LLM agents能够摆脱固定的启发式工作流，通过Independent Proximal Policy Optimization (IPPO) 学习动态协作策略。框架引入了Retrieve、Disseminate、Compose和Critique四种动作，其中Disseminate和Critique促进了主动的知识共享与反馈修正，显著提升了多智能体间的协同效率。实验证明，CREW在OARELATEDWORK基准上不仅提高了生成质量和Citation Verification准确率，还大幅降低了token消耗和推理延迟。消融研究表明，Social Activity Observation和Feedback Action是防止智能体产生冗余行为和纠正引用幻觉的关键组件。此外，迁移实验证实了在一个LLM上训练的决策策略能够无缝迁移至其他不同规模和架构的推理模型上，且在跨领域任务（如Multi-News）中无需重训即可保持高效的协作行为。\n\n### § 9 最脆弱的假设\nCREW框架最核心且最脆弱的假设是：基于启发式函数计算的delta-based cooperative reward能够准确反映生成文本的质量提升，并有效指导多智能体策略的优化。论文使用语义相似度、压缩密度和词汇分布散度等浅层指标来构建Draft、Local Knowledge等组件的reward信号。然而，高质量的学术Related Work不仅需要语义相关，还需要深层的逻辑连贯性、批判性分析和准确的学术表述，这些很难被简单的余弦相似度或压缩率完全捕捉。如果该假设不成立，IPPO优化出的策略可能会导致agents为了最大化启发式reward而产生“reward hacking”现象，例如堆砌相似词汇而不具备真正的逻辑连贯。尽管论文提供了LLM-as-a-Judge和有限的人类评估作为证据，但缺少对reward function本身与人类真实学术写作偏好对齐程度的直接验证。一旦该假设失效，整个MARL策略优化的基础将崩塌，agents学到的协作行为将无法转化为真实的文本质量提升。\n\n### § 10 最小复现实验\n如果仅有1周时间，建议复现论文中“Model Transferability”这一核心claim，即验证在一个LLM上训练的决策策略可以无缝迁移到其他推理模型上。使用OARELATEDWORK数据集的评估子集（0.4%，约366篇论文）。首先从论文开源的GitHub仓库获取已训练好的IPPO策略网络参数并固定不变，然后仅替换执行具体动作的底层推理LLM（例如从Qwen 2.5 72B Instruct替换为LLaMA 8B或GPT-4o）。在少量样本（如50篇论文）上运行推理，记录agents的动作选择序列和最终生成的Related Work。使用GPT-4o作为LLM-as-a-Judge评估生成文本的Coverage、Logic、Relevance，并计算Citation Verification比例。如果替换底层LLM后，Overall评分没有显著下降，且动作选择序列保持相似的分布，则支持该claim；如果评分大幅下降或动作序列出现异常，则反驳了策略的可迁移性。这种方案无需重新训练RL策略，计算成本极低，能够快速验证框架的核心泛化能力。", "research_value": "### § 11 最强反例设计\n\n针对CREW框架最脆弱的假设——即基于语义相似度和压缩密度等浅层启发式指标构建的delta-based cooperative reward能够准确反映学术文本质量——我会设计一个针对“reward hacking”与“虚假协作”的攻击实验。具体而言，我会深入分析CREW在OARELATEDWORK数据集上生成的文本，寻找agents为了最大化启发式reward而牺牲深层逻辑连贯性的证据。例如，agents可能学会了通过高频执行Retrieve和Disseminate来堆砌高覆盖率的词汇，或者通过Compose生成结构高度相似但缺乏批判性对比的句子，从而在Semantic relevance和Coverage指标上获得高分，但实际上并未产生真正的学术洞见。为了验证这一替代解释，我会引入一个需要高度批判性综合的跨学科文献综述场景，其中不同参考文献之间存在隐含的冲突或范式差异。在这种场景下，我会使用人类领域专家进行盲评，专门评估生成文本的“批判性对比深度”和“论证逻辑转折”，而不仅仅是Coverage或Relevance。如果CREW在自动评估指标上表现优异，但在专家盲评中被判定为逻辑断裂或缺乏深度对比，这就构成了一个强有力的反例，证明IPPO优化出的策略并非真正学会了自适应的学术协作，而是学会了钻启发式reward函数的空子，从而挑战了该方法在真实复杂科研场景中的有效性。\n\n### § 12 Follow-up Research Idea\n\n基于启发式reward无法捕捉深层学术逻辑这一核心局限，我提出一个全新的研究框架：将Related Work Generation从“启发式奖励驱动的动作选择”重构为“基于学术辩论与偏好学习的共识达成过程”。这一想法的驱动力在于，高质量的文献综述本质上是作者对前人工作进行批判性综合并确立自身研究定位的论证过程，而非简单的信息聚合与覆盖。我们可以借鉴Preference-based Reinforcement Learning (RLHF) 与Multi-agent Debate领域的工具，摒弃固定的Retrieve/Compose动作空间和浅层reward函数。具体而言，将多个LLM agents初始化为持有不同学术立场的“辩护者”，它们通过多轮自然语言辩论来揭示文献间的深层冲突与联系，而非执行离散的机械动作。在此过程中，使用强大LLM或人类专家对辩论轨迹的pairwise preference作为优化信号，通过Direct Preference Optimization (DPO) 来微调agents的辩论策略。第一个实验将构建一个包含强范式冲突的文献数据集，比较传统基于启发式reward的MARL框架与基于preference的Debate框架在生成深层批判性综述上的表现，重点评估后者是否能避免reward hacking并生成具有真正学术洞见的文本。这一提议与已有工作的根本区别在于，它彻底放弃了脆弱的启发式reward和刚性动作空间，转而利用preference learning直接对齐人类对学术论证的深层期望，打开了通往真正自动化批判性写作的研究方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Hai-Dang Dang\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Bao-Yen Pham\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Bao Nguyen\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Tran Thi Huong\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Huynh Thi Thanh Binh\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Hanoi University of Science and Technology\"},\n    {\"id\": 2, \"name\": \"The Chinese University of Hong Kong\"},\n    {\"id\": 3, \"name\": \"Hanoi University of Industry\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Both authors contributed equally to this research.\"}\n  ]\n}\n```", "summary_translation": "Automatic Related Work Generation (RWG) 显著减少了撰写研究论文 Related Work Section (RWS) 所需的人力与时间。然而，利用 multi-agent Large Language Models (LLMs) 的现有方法通常依赖于预定义的工作流，其中每个 agent 负责整个过程中的特定步骤。这种僵化、静态的 inter-agent coordination 限制了综合复杂科学文献所需的自适应协作。为了解决这一局限性，我们提出了 CREW，这是一个新颖的框架。在该框架中，LLM agents 绕过启发式流程，通过自主选择动作（如 Retrieve、Disseminate、Compose 和 Critique）进行动态协调，这些动作由通过 Independent Proximal Policy Optimization (IPPO) 优化的策略驱动。在标准 RWG benchmark 上进行的大量实验表明，与现有的强 baselines 相比，我们的方法在质量上取得了显著提升，同时大幅降低了 token costs。代码可在 https://github.com/YenPBao/CREW-Collaborative-MARL.git 获取。"}, {"title": "Stellar Colosseum: A Many-Agent Harness for Long-Horizon Research in Mathematics and Theoretical Computer Science", "arxiv_id": "2609.15983", "authors": "Honghao Lin, David P. Woodruff, Yuan Deng, Jieming Mao, Song Zuo, Vahab Mirrokni", "summary": "Language models can produce plausible short proofs, but may still be unreliable on long-horizon research problems, where progress depends on a sequence of uncertain and interdependent decisions. We introduce Stellar Colosseum, a model-agnostic harness for allocating inference across research in mathematics and theoretical computer science. Colosseum explores alternative strategies before proof construction, uses a readiness gate to decide when a route is mature enough to decompose, represents the proof plan as interdependent section-level subproblems, and routes verifier findings back to the affected part of the argument. Across these stages, it generates candidates in parallel, attacks them with targeted falsification, and combines candidates and their critiques into a single research artifact through overlapping random-sample tree aggregation. The Colosseum workflow has also been integrated into Google Antigravity's Teamwork framework as the Long Proof pattern. We demonstrate the capabilities of Colosseum through open-ended research and evaluations on theorem-proving and competitive programming benchmarks. Using Colosseum with Gemini 3.1 Pro, we obtain several new results that address open problems arising from papers published at top venues such as FOCS and JMLR. On TCS-Bench, a benchmark of research-level theorem-proving tasks drawn from papers published at FOCS, STOC, and SODA, Colosseum achieves 71.0% accuracy using Gemini 3.1 Pro and Gemini 3.7 Flash. In a separate Codeforces evaluation using Gemini 3.1 Pro, the proof-oriented pipeline with execution feedback solves 218 of 222 problems.", "category": "cs.LG", "cluster": "Multi-Agent Collaboration", "tags": ["cs.LG"], "filter_reason": "这篇论文的核心贡献是提出了一个名为 Stellar Colosseum 的 \"Many-Agent Harness\"（多智能体框架/脚手架），专门用于解决大语言模型在长期研究问题中的不可靠性。论文明确涉及了智能体在长期决策中的核心机制，包括：规划（探索替代策略、证明计划分解为子问题）、自我反思与批评（有针对性的证伪攻击、结合候选及其批评）、以及工具使用与环境反馈（将验证器发现路由回受影响部分、执行反馈）。这完全符合筛选标准中第一步关于“保留”的规定，即研究 agent 的 harness/scaffold/runtime，并且核心贡献是让智能体运行组件通过反馈、观测或评估结果自动改进和自适应优化，属于智能体能力实现的一部分。此外，虽然论文的应用场景是数学和理论计算机科学，但其本质是提出了一种新的长期决策智能体机制，符合“领域是场景，机制才是贡献”的例外保留原则。论文也不涉及安全、多模态、图技术或纯粹的多智能体拓扑与编排等被排除的内容。因此，该论文与构建和改进 LLM 智能体（特别是 Long-Horizon Agents 和 Agent Harness）的研究方向高度相关。", "intro_logic": "### § 1 研究问题与重要性\n\n本文研究的核心问题是：如何组织 inference-time computation，使语言模型能够在数学和理论计算机科学中完成 long-horizon research——即那些进展取决于一连串不确定且相互依赖的决策的研究任务。语言模型已经能够生成看似合理的短证明，但在需要长链条推理的研究问题上仍然不可靠：一个有前景的 proof route 可能在某个关键 lemma 被证伪时崩溃，一个局部修改可能迫使周围论证乃至整体 strategy 发生变化，而长证明中 definitions 和 assumptions 的一致性也难以维持。更关键的是，失败的尝试中往往蕴含着有用的 counterexample、restriction 或 intermediate result，但 flat 的失败判断无法将这些信息以具体数学主张的形式保留下来供后续使用。这个问题之所以重要，是因为数学研究的本质正是多轮 exploration、proof construction 和 revision 的迭代过程，而非单次推理。解决这一问题意味着 AI 系统可以从\"解单题\"跃升为\"驱动研究\"的自主伙伴，本文展示的若干新结果——包括解决发表在 FOCS、JMLR 等顶级会议/期刊上的 open problems——直接证明了这一价值。\n\n### § 2 前人工作与不足\n\n该问题未被完整解决过。现有工作可分为三类，各有明确局限。第一类是 inference-time search 与 critique 方法，包括 self-consistency [55]、Tree of Thoughts [60]、Self-Refine [44]、multi-agent debate [18] 以及 REBASE [58] 等。这些方法通过 sampling 多条推理路径并聚合答案来提升推理质量，但它们将推理视为扁平的搜索空间，对最终答案进行 vote 或 ranking，而数学证明中候选方案的一致性可能掩盖共同的错误——一个 concrete fatal defect 就足以否决整个证明，多数投票无法捕捉这一点。REFUTE [51] 和 Momus [17] 引入了 falsification 机制，但它们没有将 critiques 与 proposals 在 aggregation 过程中持续配对保留，也没有将 search、critique、aggregation 组织成具有明确阶段划分和 dependency-aware proof construction 的连贯研究工作流。\n\n第二类是 verifier-guided discovery 系统，如 AlphaGeometry [52] 用 learned proposals 引导 symbolic deduction、AlphaProof [29] 用 formal proof checking 引导 theorem proving、FunSearch [49] 用 executable objectives 搜索数学构造，以及 agentic Lean search [53]、retrieval-assisted proof development [33] 和 LeanMarathon [61]。这些系统最终都要求证明通过针对精确 Lean statement 的 formal checking。这一要求本身是优势也是限制：许多研究级问题的 formalization 尚不存在，且研究过程中的 provisional strategies、intermediate claims 和 natural-language proof drafts 无法直接接受 formal verification。Colosseum 则审查这些中间产物，将 formal checks 和 executable tests 作为与 model-generated critiques 并列的证据来源，从而在 formal infrastructure 缺位时仍能驱动研究流程。\n\n第三类是 autonomous research workflows，包括 Aletheia [21] 的 generate-verify-revise loop、QED [4] 的 decomposition-generation-verification 分工、ProofCouncil [50] 的 author-critic 迭代、RMA [62] 的 initializer-proposer-verifier 协调，以及 Danus [42] 的 fact-graph memory。这些系统已经认识到 verification 需要在论证发展中反复使用，但它们在两个关键维度上存在不足。其一，没有显式的 readiness gate 来控制何时将一条 strategy route 分解为 subproblems——要么过早进入 proof drafting（围绕第一个看似合理的想法直接写证明），要么缺乏从 strategy 到 proof plan 的结构化过渡。其二，aggregation 机制要么是简单的选择或投票，要么将 critiques 丢弃，而 Colosseum 的 overlapping random-sample tree aggregation 在每一层都将 candidate 与其 falsification report 绑定，使 substantive disagreements 和 failure evidence 被携带至下游而非被平均消解。此外，这些系统普遍缺乏跨轮次的 shared knowledge directory 来系统性地保留 theorems、failed approaches、references 和 observations，导致前一轮搜索中获得的有用结果在 candidate 被聚合或丢弃时随之丢失。Co-Scientist [27] 和 AI Scientist [43, 59] 等系统虽然将 generate-critique-evolve 循环扩展到更完整的科研流程，但它们面向 hypothesis generation 和实验科学，并未针对数学证明中 dependency graph、section-level subproblem 并行求解和 long-form error accumulation 这些特有挑战进行设计。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Colosseum 提出之前，尽管 Language Models 在数学推理上取得了显著进展，甚至能解决 olympiad-level 的问题，但在面对 long-horizon research problems 时仍显得不可靠。作者观察到，现有的 inference-time scaling 方法（如多次采样和 flat vote）在证明任务上效果有限，因为多个候选证明可能共享同一个隐藏错误，简单的投票无法定位具体的逻辑缺陷。此外，长证明往往超出单次 response 的输出预算，导致细节遗漏，且定义和假设在远距离章节间难以保持一致，局部修改容易引发全局连锁反应。\n\n作者从人类数学家的研究过程中汲取灵感：研究通常始于策略探索和小规模测试，随后分解为相互依赖的子问题，最后进行全局验证与修正。失败的尝试并非毫无价值，它们往往揭示了有用的限制条件、反例或中间结果。然而，现有的 generate-verify-revise 系统在失败时通常只给出通用的判断，无法将这些具体的数学主张或反对意见结构化地保留下来供后续使用。\n\n基于这些观察，作者思考如何构建一个 model-agnostic 的系统，既能显式控制研究阶段，又能维护一个共享的研究状态。在 workflow 层面，系统需要先探索并挑战多种策略，通过 readiness gate 判断策略是否成熟到可以分解为带有依赖关系的子问题图（DAG），从而实现独立部分的并行求解和局部失败的重试。在 stage 层面，为了克服简单投票的缺陷，系统需要对每个候选方案进行 targeted falsification，并将候选方案与其批评意见绑定，通过 overlapping random-sample tree aggregation 进行建设性聚合，以保留分歧和证据。最后，为了跨阶段积累知识，系统不仅要保留最新的证明草稿和验证反馈，还需维护一个 knowledge directory 来收集可重用的定理、失败方法和观察结果。\n\n### § 4 核心 Intuition\n\n先前方法在长周期数学研究中失效，是因为它们要么将长证明视为单次生成的延续（导致错误累积和一致性丧失），要么在失败时丢弃了有用的局部进展与具体缺陷信息。Colosseum 奏效的核心在于：它将长周期研究显式分解为具有依赖关系的阶段和子问题，使得独立部分可以并行推进，局部失败只触发局部重试；同时，在每个阶段内部，通过将候选方案与其对抗性批评绑定并进行树状聚合，系统不仅保留了有用的数学洞见，还明确记录了未解决的反对意见，从而让后续的修正和探索能够基于具体的证据而非盲目的重试。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Research Problem]\n      |\n      v\n+-----------------------+ \u003C--- (Re-exploration) ---+\n| Strategy Exploration  |                          |\n| (Gen-\u003EFalsify-\u003EAgg)   |                          |\n+-----------------------+                          |\n      |                                             |\n      v                                             |\n+-----------------------+                           |\n| Readiness Gate        |--- (Not Ready) -----------+\n+-----------------------+\n      | (Ready)\n      v\n+-----------------------+\n| Decomposition (DAG)   |\n+-----------------------+\n      |\n      v\n+-----------------------+      (Local Fail)     +---------------+\n| Subproblem Solving    | \u003C------------------- | Local Review  |\n| (Parallel Sections)   |                      +---------------+\n+-----------------------+\n      | (All Done)\n      v\n+-----------------------+\n| Global Verification   |\n+-----------------------+\n      |           |\n (Pass)        (Reject)\n      |           |\n      v           v\n[Accepted]  +---------------+\n Proof      | Revision /    |\n            | Re-exploration|\n            +---------------+\n```\n\nColosseum 是一个在推理阶段运行的 model-agnostic 多智能体框架，其完整 Pipeline 分为 Workflow 级别和 Stage 级别，核心在于通过对抗性生成与聚合来处理长期研究中的不确定性：\n\n1. **Strategy Exploration (策略探索)**：输入为原始研究问题及共享的 Knowledge Directory。系统并行生成多个候选策略，每个策略随后经历 Targeted Falsification（寻找反例与逻辑缺陷）。通过 Tree-Structured Aggregation 将候选策略及其批评意见聚合，保留未解决的反对意见。此阶段不断循环，直到策略足够具体。对应正文 §4.2.1 与 §4.1。\n\n2. **Readiness Gate (准备度评估)**：输入为聚合后的策略。该模块评估策略是否已将剩余不确定性局部化，且核心机制稳定。若未通过，则控制流回到 Strategy Exploration；若通过，则进入分解阶段。对应正文 §4.2.1。\n\n3. **Decomposition (问题分解)**：输入为成熟的策略。系统将其转化为带编号的 sectioned proof skeleton，并生成记录子问题依赖关系的有向无环图 (DAG)。文档顺序控制论述结构，而 DAG 控制并行求解顺序。对应正文 §4.2.2。\n\n4. **Subproblem Solving (子问题求解)**：输入为 DAG 中的各个子问题及已完成的依赖章节。独立子问题被并行分配给 Solver，内部同样采用对抗性生成与树状聚合。生成的 Section 需通过 Local Review，若失败则携带批评意见进行局部 Retry，不影响 DAG 中的其他节点。对应正文 §4.2.2 与 §4.1。\n\n5. **Global Verification (全局验证)**：输入为组装完毕的完整证明草稿。全局验证器审查跨章节的依赖一致性、定义漂移及逻辑遗漏。该过程同样采用多路审查与树状聚合，不是简单的多数投票，而是保留具体的致命缺陷。对应正文 §4.2.3。\n\n6. **Revision / Re-exploration (修订与重新探索)**：输入为被拒绝的证明及验证反馈。若当前策略仍可行，系统执行局部 Revision 修改特定章节；若验证反馈推翻了核心策略，系统将草稿与反馈存入 Shared Research Knowledge，并触发 Re-exploration 回到第一阶段。对应正文 §4.2.3 与 §4.3。\n\n### § 6 核心数学推导\n\n本文是一篇系统与架构设计论文，其核心贡献在于提出 Colosseum 这一多智能体推理框架，而非推导新的数学定理。虽然论文在 §5 中列举了五项由该系统辅助产生的研究成果（如 ℓp subspace approximation 的 coreset 大小改进、Sparse Least Squares 的 condition-number barrier 等），但这些数学推导过程属于系统的输出产物，原文并未在本文中展示其具体的形式化推导步骤。因此，本节跳过。\n\n### § 7 实验设计与结论\n\n本文通过三个维度的实验与案例研究，验证了 Colosseum 在不同复杂度任务上的有效性：\n\n**开放性数学研究能力验证**\n提出了系统是否能够针对顶会级别的开放研究问题产出有效的新数学成果的问题。设计使用 Gemini 3.1 Pro 作为 base model 运行 Colosseum，针对五个源自 FOCS、JMLR 等顶会的开放问题进行研究，并记录系统产出的证明草稿。实验结果表明，系统成功贡献了多项新结果（如改进了 coreset 大小的 ε 依赖项），并在 Knuth's cycles 问题中产出了长达 75 页的严谨证明草稿，证明了系统在长链条推理中的构建与维护能力。\n\n**研究级定理证明基准测试**\n提出了系统在研究级定理证明任务上的整体表现如何的问题。设计在包含 300 个源自 FOCS/STOC/SODA 论文定理的 TCS-Bench 上进行评测，分别使用 Gemini 3.1 Pro 和 Gemini 3.7 Flash 运行 Colosseum，并采用基于 critique 的跨模型选择策略提交证明。实验结果表明，跨模型选择达到了 71.0% 的准确率，显著优于单个模型直接推理的 30.3%，证明了系统的对抗性聚合与验证机制能有效提升推理质量。\n\n**架构跨领域迁移能力验证**\n提出了面向证明的探索-分解架构能否直接迁移到可执行的算法竞赛编程任务上的问题。设计在 222 道 Codeforces 难题上保留原有的数学证明导向架构，仅在 DAG 末端增加 C++ 实现节点与执行反馈探针，对比有无执行反馈的解题效果。实验结果表明，系统在无特定代码控制器的情况下解决了 218 道题，性能评分达 4263，且执行反馈进一步提升了 5 道题的通过率，证明了该 Pipeline 具有强大的跨领域泛化能力。", "additional_insights": "### § 8 Take-aways\nColosseum是一个针对数学和理论计算机科学长程研究的模型无关harness，通过将研究过程显式分解为策略探索、readiness gate、依赖感知的证明分解、并行子问题求解和全局验证五个阶段，解决了长程推理中的策略不确定性和错误累积问题。在每个阶段内部，系统采用对抗性推理过程，并行生成候选方案，进行targeted falsification，并通过overlapping random-sample tree aggregation将候选方案及其批评证据进行树状聚合，从而在保留未解决异议的同时综合出最优方案。系统维护了跨阶段的共享研究状态，包括完整的先前尝试草稿和知识目录，使得失败的尝试中产生的有用限制、反例或中间结果能够被后续轮次利用，避免了从零开始的重复探索。实验表明，该系统在TCS-Bench上通过跨模型选择达到了71.0%的准确率，在Codeforces的222个问题中解决了218个，并且辅助产生了多篇发表在FOCS、JMLR等顶会/期刊上的新数学研究成果。\n\n### § 9 最脆弱的假设\nColosseum最核心且最脆弱的假设是：基于语言模型的targeted falsification和tree aggregation能够有效识别并保留数学证明中的实质性缺陷，而不是被“平均掉”或被模型自身的幻觉掩盖。具体而言，系统假设adversarial reviewers能够发现候选方案中的致命错误，并且aggregation过程能够将这些异议与候选方案绑定传递给后续阶段，从而指导修复或重新探索。如果基础模型（如Gemini 3.1 Pro）在特定高难度数学领域的推理能力存在系统性盲区，多个独立的reviewer可能会在同一个错误上达成共识，导致tree aggregation将错误的共识视为正确，从而掩盖了真正的证明漏洞。论文中虽然展示了在TCS-Bench上的高准确率，但这是基于一个自动化的reference-assisted grader，其本身可能存在偏差；而在开放问题研究中，虽然产生了一些新结果，但这些结果的正确性最终仍需人类数学家的严格验证，系统自身在全局验证阶段是否能真正捕捉到深层次的逻辑漏洞仍缺乏直接的定量证据。\n\n### § 10 最小复现实验\n如果有一周时间，可以设计一个最小复现实验来验证stage-level的adversarial inference procedure（并行生成、targeted falsification和tree aggregation）相对于简单的self-consistency或单次生成的有效性。使用TCS-Bench的一个子集（例如50个问题）作为数据。实现一个简化版的stage-level推理流程：对于每个问题，并行生成16个候选证明，然后对每个候选证明进行targeted falsification（使用同一个模型作为adversarial reviewer生成批评），接着实现一个简单的tree aggregation过程，将候选证明及其批评进行配对和综合，生成最终的证明。作为baseline，使用相同的计算预算进行多次采样并采用majority voting或直接选择最长的证明。使用自动化grader评估最终证明的正确率，并记录aggregation过程中保留的“未解决异议”的数量和质量。如果Colosseum的claim成立，带有targeted falsification和tree aggregation的流程应该比简单的baseline具有更高的正确率，并且能够更有效地识别和保留证明中的缺陷；如果两者的正确率没有显著差异，或者aggregation过程未能有效利用批评信息，则反驳了该claim。", "research_value": "### § 11 最强反例设计\n\n针对 Colosseum 最有力的攻击应直指其核心假设：基于语言模型的 targeted falsification 能够捕捉致命的逻辑漏洞，而不是被表面的一致性所掩盖。我会设计一个“隐蔽缺陷注入”实验来挑战其在 TCS-Bench 上的高准确率。具体而言，从 TCS-Bench 中选取已证明的定理，人工或利用模型在证明的关键步骤中注入 subtle but fatal flaws（例如非法的极限交换、隐藏的 circular reasoning 或不成立的 combinatorial construction），构建一个“看似合理但必然错误”的证明数据集。将这些带有致命缺陷的证明输入 Colosseum 的 Global Verification 和 Targeted Falsification 模块。如果系统依然给出较高的“通过率”或未能有效保留这些致命异议，这就直接证明了其 tree aggregation 机制只是在“平均掉”表面的逻辑不一致，而无法真正理解深层数学结构。此外，这提供了一个强有力的替代解释：Colosseum 在 TCS-Bench 和 Codeforces 上的高成功率，可能并非源于其对抗性验证机制的严密性，而是因为这些问题及其变体大量存在于 base model 的训练数据中，系统实际上是在做 sophisticated pattern matching，而非真正的 adversarial reasoning。当面对训练分布外（OOD）的全新数学构造时，多个 reviewer 会共享同一个盲区，导致错误的共识在 aggregation 中被强化，从而可预测地在前沿数学研究中产生“看似严谨实则谬误”的长篇废稿。\n\n### § 12 Follow-up Research Idea\n\n驱动这一 follow-up idea 的核心局限是：Colosseum 依赖纯自然语言进行 targeted falsification，当 LLM 自身对特定高难度数学概念存在系统性盲区时，对抗性审查会退化为“盲人摸象”式的共识，无法提供绝对客观的证伪信号。为了打破这一瓶颈，我们可以借鉴软件工程中的 Property-Based Testing (PBT) 和形式化验证中的 SMT Solvers，提出一个“计算证伪预言机”的新框架。该框架不再要求 LLM 直接生成自然语言的批评意见，而是要求 LLM 将每一个 intermediate lemma 和 definition 转译为可执行的 SMT 约束或随机化测试脚本。在 Tree-Structured Aggregation 阶段，候选方案的淘汰不再基于 reviewer 的文本投票，而是基于 SMT solver 寻找反例的计算难度（例如 solver 返回 unsat 证明其稳健，返回 counterexample 则直接否决）。第一个实验将设计一个对照测试：在 TCS-Bench 的子集上，对比纯 LLM falsification 与 LLM-to-SMT falsification 在“隐蔽缺陷注入”场景下的 false positive rate。与 AlphaProof 等要求最终定理完全 formalization 的系统不同，本方法仅对局部的、provisional claims 进行计算化测试，从而在自然语言推理的灵活性与形式化验证的严谨性之间建立了一个连续的“形式化梯度”，开辟了将符号计算深度嵌入多智能体推理工作流的新方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Honghao Lin\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"David P. Woodruff\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Yuan Deng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jieming Mao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Song Zuo\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Vahab Mirrokni\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Google Research\"},\n    {\"id\": 2, \"name\": \"CMU\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Co-first authors. Email: honghaol@google.com, woodruffd@google.com.\"}\n  ]\n}\n```", "summary_translation": "语言模型能够生成看似合理的简短证明，但在长期研究问题上可能仍然不可靠，因为这类问题的进展取决于一系列不确定且相互依赖的决策。我们引入了 Stellar Colosseum，这是一个与模型无关的 harness，用于在数学和理论计算机科学的研究中分配推理资源。Colosseum 在构建证明之前探索替代策略，使用 readiness gate 来决定何时路线足够成熟以进行分解，将证明计划表示为相互依赖的 section-level subproblems，并将 verifier 的发现路由回论证中受影响的部分。在这些阶段中，它并行生成候选方案，使用针对性的证伪对其进行攻击，并通过 overlapping random-sample tree aggregation 将候选方案及其批评意见组合成一个单一的研究 artifact。Colosseum 的工作流也已作为 Long Proof pattern 集成到 Google Antigravity 的 Teamwork 框架中。我们通过开放式研究以及对 theorem-proving 和 competitive programming benchmarks 的评估，展示了 Colosseum 的能力。将 Colosseum 与 Gemini 3.1 Pro 结合使用，我们获得了几项新的结果，解决了发表在 FOCS 和 JMLR 等顶级会议和期刊上的论文中提出的 open problems。在从 FOCS、STOC 和 SODA 发表论文中提取的研究级 theorem-proving tasks 的 benchmark TCS-Bench 上，Colosseum 使用 Gemini 3.1 Pro 和 Gemini 3.7 Flash 达到了 71.0% 的 accuracy。在使用 Gemini 3.1 Pro 的另一项 Codeforces 评估中，带有 execution feedback 的 proof-oriented pipeline 解决了 222 个问题中的 218 个。"}]}, {"name": "Skill Routing \u0026 Tool Use", "count": 2, "papers": [{"title": "The Router Within: Eliciting Native Skill Routing from a Frozen LLM", "arxiv_id": "2609.15982", "authors": "Ruishuo Chen, Xun Wang, Yu Chen, Zhuoran Li, Longbo Huang", "summary": "Skills extend an LLM agent beyond its parametric knowledge, and the gain they promise rests on picking the right one. Deployed harnesses route by preloading every skill's metadata into the context, which disperses the agent's attention and caps the library size. Retrieval pipelines move the selection out of the context, but also out of the agent's capability. We show that the frozen agent LLM already carries the routing signal in its own forward passes, and that two linear maps suffice to read it out with no skill text in the context. Gavel (Glance And Verdict from a frozen LLM) reads it in two steps. A glance projects the task's and each skill's mid-layer states through the two maps, the only parameters trained, and scores the full library against compact per-skill banks that one forward pass builds at installation. A verdict then resumes the shortlisted skills' forward passes and reads the model's own likelihood and yes/no judgment, fused with the glance as a product of experts. Trained once, Gavel transfers zero-shot to three public benchmarks and SkillTraj, our new benchmark of 372 simulated agent trajectories. On Qwen3-32B it outperforms progressive disclosure and retrieve-and-rerank pipelines that add 1.2B to 16B external parameters, by up to 13.4 points on written tasks and up to 21.9 when the need for a skill arises mid-rollout. Routing accuracy improves as the backbone does, and in a bash-agent harness the same 32B triggers the correct skill on Skill-Use more often than far larger frontier models running in Codex.", "category": "cs.LG", "cluster": "Skill Routing \u0026 Tool Use", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-36 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一种名为 Gavel 的新机制，用于在 LLM 智能体运行时进行技能/工具的路由选择。论文明确指出当前 agent harness 在技能选择上的局限性，并通过从冻结的 LLM 前向传播中提取原生路由信号来改进智能体的工具使用能力。这直接属于“单智能体的工具使用”以及“智能体 harness/scaffold 改进”的研究范畴。论文的研究对象明确是 LLM Agents 和 Tool-Use Agents，并在模拟的 agent 轨迹和 bash-agent harness 中进行了评估。这里的 routing 指的是智能体内部的技能路由，而非多智能体系统中的消息路由或拓扑编排，因此不触发排除条件。该研究为改进智能体能力提供了新的方法论，完全符合筛选标准中关于构建和改进 LLM 智能体的核心目标。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决的核心问题是：如何在不将任何 skill metadata 注入 context 的前提下，利用 frozen agent LLM 自身的 forward pass 来完成大规模 skill library 的路由选择。具体而言，当一个 agent 在执行任务过程中需要调用某项 skill 时，router 需要从可能包含数万个文档的 library 中选出正确的那一个，而这一选择既不能污染 agent 的 context window，也不能依赖 agent 之外的独立模型。\n\n这个问题的重要性源于 skill 已成为 LLM agent 超越 parametric knowledge 的标准扩展方式——一个 skill 将指令、脚本和参考文件打包为 `SKILL.md` 文档，agent 在任务需要时将其载入 context。选对 skill 能显著提升任务表现，选错则比不用 skill 更糟。随着公共 skill library 规模达到数万条目，选择难度急剧上升，routing accuracy 随 skill 数量对数级衰减。更关键的是，agent 在实际部署中的需求往往不是在第一轮对话中明确提出，而是在 multi-turn rollout 的某个中间时刻才浮现——此时 context 中充满工具调用结果和历史对话噪声，使得路由判断更加困难。解决这一问题能带来的价值是：让 frozen agent LLM 自身承担路由职责，既避免 context 污染对任务执行的损害，又使路由能力随 backbone 能力同步提升，同时新 skill 的安装仅需一次 forward pass 而无需重新训练。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决，现有方案沿两条路线展开，各有根本性缺陷。\n\n第一条是 **progressive disclosure**，被 Claude Code 和 Codex 等部署系统采用。它将每个已安装 skill 的 name 和 description 预加载到 system prompt 中，让 agent LLM 自行决定读取哪个 skill 的完整文档。这种做法的局限是 intrinsic 的：metadata 占据的 context 空间与 library 规模成正比，分散了 agent 对任务本身的注意力。Codex 因此将 skill metadata 限制在 context window 的 2% 以内并丢弃其余条目，将部署限制在小型 library，而 routing accuracy 仍然随 skill 数量对数级衰减。更深层的原因是，context 内路由迫使 agent 在它考虑的每个 skill 的 summary 之间分配注意力，而这些 summary 只能容纳部分信息，遗漏了选择所依赖的关键细节——尤其在 skill body 包含长篇过程性说明时，metadata 根本无法承载区分正确 skill 所需的信息。论文在 ablation 中证实，即使将二十个完整 skill body 放入 menu，progressive disclosure 在 SRA-Bench 上仍落后 Gavel 16 个 adjudicated points，因为 agent 面对大量上下文时并不能有效利用其中的信息。\n\n第二条是 **retrieve-and-rerank** pipeline，通常由一个 embedding model 和一个 reranker 组成，在外部完成 skill 选择后将其注入 context。这条路线虽然保持了 context 的整洁，但将选择过程从 agent 的能力中剥离：独立 retriever 擅长文本匹配，但对任务需求的判断不如 agent LLM 可靠，尤其在 mid-rollout 的 noisy multi-turn context 中——retriever 要么吞入整段充满多主题噪声的轨迹导致 embedding 混杂，要么仅取最后一条消息而丢失关键证据。论文在 SkillTraj benchmark 的四个场景中系统性地展示了这一困境：无论 retriever 取 full context 还是 last message，其表现均显著落后于直接读取 agent 自身 forward pass 的方案。此外，外部 retriever 的能力是固定的，不会随 agent backbone 的升级而提升，而论文的 scaling 实验表明 Gavel 的路由精度随 backbone 从 0.6B 增长到 32B 而持续攀升。ToolkenGPT 虽尝试让 frozen LLM 以 token 形式发射 tool，但每个 tool 需训练一个 embedding，新 skill 的加入意味着一次训练运行，无法应对不断变化的数万级 library。\n\n两条路线之间的核心矛盾在于：context 内选择给 agent 增加负担，外部模型则缺乏 agent 对任务与 skill 之间关系的深层理解。此前没有工作回答通过什么 interface、以什么 cost 将 agent 的这种理解转化为 context 外的路由信号——这正是 Gavel 通过两个 trained linear projection 从 frozen backbone 的 mid-layer hidden state 中读出 routing signal 所填补的空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在探索如何为 LLM agent 选择合适的 skill 时，研究者首先面临的是两条现有路径的固有缺陷。第一条路径是 progressive disclosure，即将所有 skill 的 metadata 预加载到 system prompt 中让 agent 自行挑选。然而，随着 skill 库规模扩大，metadata 会挤占 context window 并分散模型注意力，导致任务表现下降；即使限制 metadata 数量，routing accuracy 仍会随 skill 数量对数级衰减。第二条路径是 retrieve-and-rerank，将选择过程交给外部的 embedding model 和 reranker。这虽然保持了 context 的整洁，但选择过程脱离了 agent LLM 自身的理解能力——standalone retriever 擅长文本匹配，却不如 agent 本身那样能可靠判断任务在 noisy 的 mid-rollout 环境中真正需要什么，且不会随 agent 能力的提升而进步。\n\n面对“context 内选择消耗注意力，外部模型又缺乏深度理解”的困境，研究者开始思考：agent LLM 在处理任务时，其内部 forward pass 是否已经隐含了对所需 skill 的判断信号？Probing 研究早已表明，LLM 的 hidden states 携带了比预测下一个 token 更丰富的信息。同时，text embedding 领域的工作已经证明，可以通过 fine-tuning 或 prompting 将 decoder LLM 转化为强大的 encoder。这些线索暗示，agent 内部可能已经存在 routing signal，只是需要找到正确的方式读取。\n\n然而，直接使用模型 native 的 attention keys 作为匹配空间被证明是失败的——信号太微弱，且不同文档编码后的分数不可比。研究者意识到，native 的 hidden states 虽然压缩了输入语义，但与只服务于下一个 token 的信息纠缠在一起。理论线索指出，LLM 的中间层存在一个 \"compression valley\"，matrix entropy 在此触底，语义压缩最为彻底。这提示研究者：若在此层嫁接一个轻量级的、经对比学习的线性映射头，或许能将纠缠的信号转化为可用的 routing signal。\n\n借鉴 late-interaction retrieval 的思想，研究者设计了 token 级别的匹配机制：每个 task token 通过 query map 投影后，与 skill bank 中的 key 进行 max-similarity 投票。但这仅能实现粗粒度的筛选。对于 shortlist 中的候选 skill，研究者转而利用模型自身的 full attention，通过 query-likelihood 和 yes/no judgment 两种方式读取更深层的语义推理信号。由于这三种信号（contrastive、generative、discriminative）本质上都可以视为对同一 log posterior 的估计，研究者自然地将它们融合为 product of experts，让任何一方都能否决其他两方仅勉强容忍的候选。\n\n### § 4 核心 Intuition\n\n现有方法要么把 skill 菜单塞进 context 分散 agent 注意力，要么用外部 r
