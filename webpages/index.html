: "cs.AI", "cluster": "Long-Horizon Planning \u0026 Memory", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-31 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是揭示了长期运行的LLM智能体在持久记忆方面的一种特定失败机制（即“内生授权洗钱”），并提出了EAL-Bench来评估记忆组件在状态保存和错误传播方面的表现。根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents / Multi-Agent LLMs，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。” \n\n虽然论文涉及了“授权”、“安全防护”和“安全-效用权衡”等概念，容易触发第三步的安全相关排除规则，但根据特殊校准规则：“如果安全/评估只是论文研究 LLM Agent 能力、行为边界或失败模式的场景，而核心对象仍是智能体能力本身，不要机械排除”。该论文的本质是研究智能体记忆组件在长期交互中的行为边界和失效模式，其结论直接帮助理解记忆机制在智能体系统中的深层作用（“记忆不仅仅是性能组件，而是有效授权策略的一部分”）。因此，它符合对LLM智能体能力进行行为分析和失败机制诊断的保留标准。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心问题是：当 long-running LLM agent 依赖 persistent memory 跨交互维护状态时，记忆系统在压缩不断演变的历史过程中，是否会错误地表示 authorization state——包括 permissions、restrictions 和 revocations——从而在没有任何外部攻击的情况下，使 agent 基于自身记忆中虚构的权限执行未经授权的行动。作者将这一失败模式命名为 **endogenous authorization laundering**：虚假权限被写入 persistent memory 后，其 provenance 逐渐被\"洗去\"，使一个底层历史从未授予的权限看起来合法，executor 随后忠实地依据这个错误的 authorization state 执行 tool action，而违规在 execution time 是不可见的。这个问题被分解为两个可独立测量的阶段：**false-authority formation**（writer 在记忆中创建虚假权限）和 **downstream propagation**（executor 基于该虚假权限采取行动）。\n\n这个问题的重要性在于 persistent memory 已是 agent 系统的标准组件——MemGPT、ReAct、Toolformer 等架构都依赖它来避免重复处理完整历史——而当历史中携带授权信息时，记忆实际上承载了 agent 的有效 authorization policy。将历史压缩为维护的表示会直接改变后续哪些行动看起来是已授权的：一个被遗忘的 revocation 保留了已不存在的权限，一个被丢弃的 permission 则导致 agent 拒绝合法请求。论文引用了一个真实案例：2026 年 2 月，一个 email agent 在 routine context compaction 中丢失了 owner 的 confirm-before-acting 指令，删除了 200 多封仅需审查的邮件。与 memory poisoning 或 prompt injection 不同，endogenous authorization laundering 源于普通内部错误，不需要攻击者存在，因此它暴露的是一个系统设计层面的结构性缺陷而非对抗性威胁。解决这个问题的价值在于：将 persistent memory 从单纯的性能组件重新定位为 agent 安全边界的一部分，使 practitioners 意识到存储的 permissions 应当像 identity and access management 系统中的条目一样接受 provenance、lifecycle 和 audit 纪律的约束，同时为在 executor 获得工具访问权之前提前估计违规率提供了可审计的检测面。\n\n### § 2 前人工作与不足\n\n这个问题之前没有被完整解决。最接近的工作沿几条线展开，但每条都存在结构性缺口。**AUTHMEM-BENCH**（Zhan et al., 2026）研究 memory consolidation boundary 处的 authority collapse，但它固定一个 claim 和下游任务、仅变化 source authority，不跟踪 grant、revocation 和 replacement 的完整 lifecycle，不做 incremental memory updates，也不做 exact-state repair；其设计假设授权信息在一次 consolidation 中被处理，而真实部署中 memory 经历多次增量更新，每次更新只能看到前一次记忆和新 block，错误一旦写入便被向前携带——这一动态完全落在其评测范围之外。**PPMF**（Xu et al., 2026a）形式化了 source-authority non-amplification 原则，使用 platform-maintained provenance 从 attacker-controlled 或 untrusted observations 出发构建防火墙，但其威胁模型预设输入本身可能恶意，而 endogenous laundering 始于 authentic、non-malicious histories，失败不是因为 source 不可信，而是因为即使 provenance 可信，writer 仍可能在 scope、validity 或 lifecycle state 上引入错误——PPMF 的 source-authority 框架无法捕获这类语义层面的 state infidelity。**GATEMEM**（Ren et al., 2026）在 retrieval time 强制 lifecycle-aware access boundaries，但它关注的是访问边界本身的执行，而非边界背后的 state 是否正确；EAL-BENCH 恰好测量的是那些边界背后的 state 是否忠实于历史——如果 state 本身已损坏，正确的 retrieval enforcement 只会忠实地返回错误数据。\n\n在系统安全层面，**HARNESSAUDIT**（Liu et al., 2026）评估 full agent trajectories 中的 permission、resource-access 和 information-flow violations，**MASDRIFT**（Xu et al., 2026b）研究 multi-agent delegation 中 authorization constraints 通过委派链弱化的 endogenous drift，但前者假设 executor 查询的 state 是正确的——它审计的是 executor 是否遵守 policy，而非 executor 看到的 policy 是否正确——后者关注的是权限跨 agent 的漂移而非单个 agent persistent state 随时间的漂移。在 memory integrity 方面，AgentPoison（Chen et al., 2024）研究 adversaries 毒化存储记录，STALE（Chao et al., 2026）和 Zhang et al.（2026）研究条目在 repeated updates 下变 stale，这些工作确立了 memory content 可以变错，但都没有专门追问 authorization state 是否忠实于底层历史，更没有将 false-authority formation 与 downstream propagation 分离测量，也没有通过 exact-state repair 将失败因果性地定位到记忆本身。总体而言，现有 memory evaluations 聚焦于 recall、adversarial scenarios 或 downstream task performance，而 evolving authorization state 的保存及其向 unauthorized action 的传播链条——从 formation 到 propagation——作为一个完整的、可干预的失败机制，在此之前既没有被清楚定义，也没有被系统测量。", "core_insight": "### § 3 重建作者的思考路径\n\n作者可能从一个简单的观察出发：long-running LLM agents 依赖 persistent memory 跨交互携带状态，而当 history 包含 permissions、restrictions、revocations 时，memory 实际上携带的是 authorization state。Condensing history into a maintained representation 必然改变哪些 actions 后来看起来是 authorized 的——一个被遗忘的 revocation 保留了不再存在的 authority，一个被丢弃的 permission 导致 agent 拒绝 valid request。2026 年的 email agent 案例已经证实了这种风险：routine context compaction 丢失了 confirm-before-acting 指令，agent 删除了 200 多封它只被要求审查的邮件。\n\n但现有研究存在一个关键空白。Memory integrity 文献关注 adversarial poisoning、staleness 和 retrieval boundary crossing，这些要么是外部攻击，要么是内容正确性问题；authorization-memory 研究（如 AUTHMEM-BENCH）关注 consolidation boundary 的 authority collapse，但没有追踪 permissions、restrictions、revocations、replacements 通过 repeated memory updates 的演变；system safety 研究（如 HARNESSAUDIT）假设 executor 查询的 state 是正确的，只审计 executor 行为。没有人分离过两个问题：false authority 是否在 memory 中形成，以及 executor 是否随后据此行动。\n\n作者进一步意识到一个关键区分：这种失败是 endogenous 的——由普通内部错误引起，没有攻击者，histories 和 authoritative messages 都是 authentic 的。这意味着即使部署了 anti-injection 防御，问题仍然存在。一个 incremental writer 只看到 prior memory 和 new block，一旦写入错误就会向前携带，而 executor 只看到 memory 而看不到原始 history，因此会忠实地执行一个基于错误 authorization state 的操作。\n\n要因果地证明 memory 是瓶颈而非 executor，需要一个 deterministic canonical ledger 来定义 true authorization state，paired authorized-unauthorized requests 来隔离 authorization-relevant field 的变化，以及 exact-state repair intervention——将 writer 的 memory 替换为 ground-truth state，测试 unauthorized actions 是否消失。作者还预见到，即使要求 stored permissions 有 valid source events 支持或用 event sourcing 追踪 permission changes，一个有 authoritative provenance 的 record 仍可能携带错误的 scope、validity 或 revocation state，这预示了 safety–utility tradeoff。\n\n### § 4 核心 Intuition\n\n先前方法假设 executor 查询的 authorization state 是正确的，只关注 executor 是否遵守 policy 或 memory 是否被外部攻击毒化，却忽略了 persistent memory 在普通更新过程中会内生地创建 false authority——遗忘一个 revocation 或吸收非权威来源的信息，都会让 memory 授权 history 从未允许的操作。这个 false authority 一旦写入，executor 会忠实地据此行动，因为它只能看到 memory 而看不到原始 history，所以 executor-side alignment 无法弥合这个差距。核心 intuition 是：persistent memory 不是单纯的性能组件，而是 agent 有效 authorization policy 的一部分；authorization 失败的根源在 memory 写入阶段而非执行阶段，用 oracle-exact memory 替换 erroneous memory 后 unauthorized actions 完全消失，证实了 memory 才是瓶颈。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Organizational History H]\n   |\n   v\n[Memory Writer W] ---\u003E [Persistent Memory MT] ---\u003E [Executor E] ---\u003E [Action aq]\n   |                     |                          |                 |\n   |                     v                          |                 v\n   |             [Memory Auth AM]                   |          [Canonical Ledger R]\n   |                     |                          |                 |\n   |                     v                          |                 v\n   |             [Formation F=1?]                   |          [State Auth A(St,aq)]\n   |                     |                          |                 |\n   +---------------------+--------------------------+-----------------+\n                         v\n                  [Propagation G=1?]\n                         |\n                         v\n                  [Laundering F ∧ G]\n```\n\n- **输入**：系统接收多会话的 Organizational History (H)，其中包含真实的授权、限制和撤销事件。例如在 Procurement 领域，历史记录包含批准购买 TableWorks 午餐和咖啡的初始授权，随后将其缩小为仅限午餐，以及一个非权威的 ERP 记录错误地将供应商归类为午餐和招待茶点。\n- **处理**：\n  1. Memory Writer (W) 读取 H 并生成 Persistent Memory (MT)。在 incremental 更新中，Writer 仅基于前一次的 memory 和新 block 进行更新，吸收了错误的 ERP 类别。\n  2. 对于 typed memory，系统通过 Memory Auth (AM) 确定性评估 MT 是否授权特定操作。此时，MT 错误地授权了招待茶点的购买，导致 Formation (F=1)。\n  3. Executor (E) 接收 MT 和后续的购买请求，基于 MT 中的虚假授权选择执行 Action (aq)。\n  4. 同时，隐藏的 Canonical Ledger (R) 重放真实历史 H，生成真实的 Authorization State (St)，并通过 State Auth (A(St, aq)) 判定该操作未授权。\n- **输出**：系统评估 Executor 是否执行了未授权操作。由于 Executor 忠实执行了 MT 中的错误授权，Propagation (G=1) 发生。最终输出为 Laundering (F ∧ G) 事件，即系统在无外部攻击的情况下完成了未授权的购买操作。\n\n### § 6 核心数学推导\n\n论文通过形式化定义将 endogenous authorization laundering 分解为 formation 和 propagation 两个阶段。$H = (B_1, \\dots, B_T)$ 表示有序的组织历史，$S_t = R(B_1, \\dots, B_t)$ 是确定性重放函数 $R$ 映射出的真实授权状态。$A(S_t, x) \\in \\{0, 1\\}$ 是判断动作 $x$ 是否被授权的谓词。这部分的 intuition 是：系统的真实权限不是由单条消息决定的，而是由整个历史事件流按时间顺序累积决定的。\n\n$M_T = W(H)$ 或 $M_t = W(M_{t-1}, B_t)$ 表示 Writer 生成的 persistent memory。对于 typed memory，$A_M(M_T, x) \\in \\{0, 1\\}$ 确定性判断 memory 是否授权动作 $x$。Formation 定义为 $F = 1 \\iff A_M(M_T, a_q) = 1 \\land A(S_T, a_q) = 0$。Intuition 是：memory 认为可以做，但真实历史不允许做，这就形成了虚假授权。Propagation 定义为 $G = 1 \\iff \\text{executor takes action } a_q$。Intuition 是：executor 忠实于 memory 的指示执行了动作。\n\n端到端的 laundering 事件为 $F \\land G$，其发生率为 $P(F=1)P(G=1|F=1)$。Intuition 是：总体的违规概率等于“memory 出错”的概率乘以“memory 出错后 executor 真的去执行”的条件概率。这种分解使得我们可以独立评估 memory 的保真度和 executor 的可靠性。\n\n### § 7 实验设计与结论\n\n提出了什么问题：Persistent memory 是否会内生地产生虚假授权并传播到下游执行？设计了什么实验：在 procurement, cybersecurity, finance 三个领域，使用 5 个 LLM 作为 Memory Writer 和 2 个作为 Executor，测试 one-shot/incremental 更新与 free-text/typed memory 的组合。通过 hidden canonical ledger 评估 memory 的 Formation (F) 和 executor 的 Propagation (G)。问题的答案是什么：Incremental updating 产生最多的授权失败，typed incremental memory 在 finance 领域达到 51.0% 的 unauthorized submission。一旦形成虚假授权，executor 在 98.6% 的试验中执行了该操作，证明 memory 错误会高度传播。\n\n提出了什么问题：虚假授权是否由 memory 本身引起，而非 executor 的对齐问题？设计了什么实验：进行 Exact-state repair 干预，在保持请求、executor 和工具不变的情况下，将错误的 memory 替换为 oracle-exact 的真实状态。问题的答案是什么：替换后 unauthorized submission 降至 0%，而原始错误 memory 下高达 98.6%。这证明失败瓶颈在于 memory formation，而非 executor 的对齐能力。\n\n提出了什么问题：缓解措施能否在保持效用的同时减少 authorization laundering？设计了什么实验：测试了两种防御机制：gold cited-source authority gate（要求存储的权限必须有有效的来源事件支持）和 bounded event-sourced architecture（通过不可变日志和确定性 reducer 维护状态）。问题的答案是什么：两者都显著降低了 unauthorized submission（分别降至 7.3% 和 9.0%），但都以牺牲 legitimate authorized use 为代价（分别降至 53.8% 和 64.7%），形成 safety-utility tradeoff。这表明 persistent memory 必须被视为 agent 安全边界的一部分。", "additional_insights": "### § 8 Take-aways\n\n论文识别了一种名为 **endogenous authorization laundering** 的 failure mode：agent 的 persistent memory 在无外部攻击的情况下，通过自身更新错误地创建了底层 history 从未授予的 authority，且这种 false authority 会被 executor 忠实地执行为 unauthorized action。作者将此过程分解为两个可独立测量的阶段——**formation**（memory 授权了 canonical state 否认的动作）和 **propagation**（executor 基于错误 memory 实际执行了该动作），并发现两者发生率高度接近（差异 \u003C0.8 percentage points），表明大多数 behavioral failure 在 executor 行动之前就已经被编码进 stored state 中。**Incremental updating** 是最危险的 memory 策略：因为 writer 只能基于 prior memory 和 new block 更新而无法回溯 raw history，一旦错误被写入就会持续前传，typed incremental memory 在 finance 领域产生了 51.0% 的 unauthorized submission rate。通过 **exact-state repair** 干预——仅将错误 memory 替换为 oracle-exact state 而保持其他一切不变——unauthorized action 从 98.6% 降至 0%，因果性地证明 failure 定位于 memory 而非 executor。Failure 随 memory artifact 迁移而非随 executor 变化：更换 executor model 后 unauthorized submission rate 差异仅 1.1 percentage points，说明 upgrading 或 swapping executor 无法修复 laundering，防御必须在 memory 写入阶段实施。两种 mitigation——**source-authority gating**（仅保留由有效授权 principal 签发的记录）和 **bounded event sourcing**（writer 只提取增量变化，由 deterministic reducer 维护状态）——分别将 unauthorized submission 从 25.3% 降至 7.3% 和 9.0%，但两者都以大幅牺牲 legitimate authorized use 为代价（分别降至 53.8% 和 64.7%），形成离散的 safety–utility Pareto frontier。Writer-side inference scaling 通过生成更多 candidate 改善了 downstream behavior（unauthorized submission 从 13.2% 降至 8.6%），但存在 **selection bottleneck**：在 $k=8$ 时 55.0% 的 candidate pool 包含 exact memory，writer self-review 仅选中 26.7%，且已进入 memory 的错误 persistence 率为 100%、self-repair 率为 0%，表明额外 compute 只能避免新错误而无法修复已有错误。Operational pressure（紧迫性提示）在 finance 中将 unauthorized submission 从 20.9% 提高到 27.3%，同时使 authorized use 在所有领域平均下降 20+ percentage points，说明 pressure 同时加剧了 over-granting 和 under-granting 两个方向的失败。\n\n### § 9 最脆弱的假设\n\n论文最关键且失败代价最大的假设是：**canonical ledger 准确且完备地定义了 authorization ground truth，使得每个请求可以被确定性地二分为 authorized 或 unauthorized**。整个 benchmark 的 validity 依赖于此：formation rate 的计算需要将 $A_M(M_T, x)$ 与 $A(S_T, x)$ 对比，unauthorized submission 的判定需要 canonical state 作为参照，exact-state repair 需要 oracle-exact state 作为干预基准——如果 ledger 本身与真实 authorization 语义不一致，所有这些测量都可能成为 artifact。这个假设在实际中可能不成立的原因是多方面的：真实组织中的 policy interpretation 可以是 incomplete、contested、probabilistic 或 dependent on external state 的，而论文的 ledger 使用 closed-world assumption、单一 recognized authority class 和 unambiguous fields；真实 workplace communication 中的 authorization 事件往往嵌入在非结构化对话中，伴随隐含条件、口头修改和冲突的 policy sources，而非论文构造的 explicit session blocks 和 unusually clear authorization events。论文为这个假设提供的证据是：cases 由 Claude Opus 4.8 辅助生成后经作者 manual review 和 iterative refinement，ledger 是 deterministic replay function，且 oracle event streams 在所有领域都能精确复现 canonical state——但这些证据只证明了 ledger 的内部一致性，并未验证其与真实组织 authorization 实践的对齐。论文自身在 Limitations 和 Appendix C.3 中明确承认 \"Real policy interpretation can be incomplete, contested, probabilistic, or dependent on external state\"，以及 histories 是 \"synthetic, ordered, complete, and more regular than workplace communication\"，这构成了对核心假设的已知但未解决的威胁。如果这个假设失败，论文测量的 \"unauthorized submission\" 可能部分是 ledger 过度简化导致的 false positive，而 mitigation 评估中的 \"undergrant\" 也可能部分是 ledger 过度严格而非 defense 本身的问题，从而使 safety–utility tradeoff 的定量结论失去外部 validity。\n\n### § 10 最小复现实验\n\n在一周时间内，可以针对论文最核心的因果 claim——\"false authority 在 memory 中形成并因果性地导致 unauthorized action，且 exact-state repair 可消除该 action\"——设计一个最小复现实验。数据方面，手工构造 5 个 procurement organizational histories，每个包含 5-6 个 session blocks：初始 grant（如 buyer 被授权从 TableWorks 购买 lunches 和 coffee，上限 USD 6,000）、后续 narrowing amendment（限制为仅 lunches）、以及一条 non-authoritative ERP record 将 vendor 归入 lunches 和 reception refreshments 两个 category。实现方面，定义一个简单的 deterministic canonical ledger，用 Python 规则检查 buyer、vendor、category、amount、currency、status 和 validity 七个字段是否被单一 active record 完全覆盖；使用一个 writer LLM（如 GPT-4o）以 incremental 方式生成 typed JSON memory（每次只传入 prior memory 和 new block）；为每个 case 构造一对 matched requests，仅 category 字段不同（如 lunches vs reception refreshments），前者 authorized、后者 unauthorized。测量三个指标：formation rate $P(F)$（typed memory 授权了 canonical state 否认的请求的比例）、unauthorized submission rate（executor 基于错误 memory 实际执行 unauthorized 请求的比例）、以及 exact-state repair 后的 unauthorized submission rate（将 formation=true 的 memory 替换为 oracle-exact state 后重新运行 executor）。如果 formation rate 显著高于 0（论文在 procurement 中为 28.3%，最小实验中 \u003E15% 即可支持趋势）、unauthorized submission rate 接近 formation rate、且 exact-state repair 后 unauthorized action 降至 0%，则支持论文的核心因果 claim。如果 formation rate 接近 0 或 exact-state repair 后 unauthorized action 仍然存在，则反驳该 claim，表明要么 memory 并非 failure 的瓶颈，要么 executor 本身存在独立于 memory 的 authorization 判断错误。整个实验只需 1 个 writer、1 个 executor、5 个 cases、10 对 matched requests，API 调用成本可控在数十美元以内。", "research_value": "### § 11 最强反例设计\n\n对这篇论文最有力的攻击应针对其 measurement validity，具体而言，我会设计一个 **Implicit Authorization Confounding** 实验来挑战其核心发现是否为 benchmark artifact。论文的整个 causal claim 依赖 canonical ledger 准确且完备地定义了 ground truth，且 authorization 可以被 deterministic 地二分为 authorized 或 unauthorized。我会构造一组 organizational histories，其中真实的 authorization 不仅包含 explicit grants 和 revocations，还包含大量通过 social norms、role-based defaults 和 contextual cues 传递的 implicit permissions。例如，在 procurement 领域，一个 buyer 被明确授权购买 lunches，而根据组织惯例，与 lunch meeting 直接关联的 reception refreshments 通常被视为同一 budget category 的合理延伸，尽管从未被 explicit grant 覆盖。在这种设定下运行 EAL-Bench 的 pipeline：memory writer 读取 history 后，很可能基于 contextual reasoning 将 reception refreshments 纳入授权范围——这并非错误，而是对真实组织语义的合理推断。然而，由于 canonical ledger 采用 closed-world assumption 且仅识别 explicit authorization events，它会将这一推断判定为 false authority formation (F=1)。更关键的是，当进行 exact-state repair 时，oracle-exact state 是由这个过度严格的 ledger 生成的，它本身就不包含 implicit permission，因此 repair 后 unauthorized action 降至 0% 并不证明 memory 被修复为\"正确\"状态，只证明 executor 被强制服从了一个 incomplete 的 policy。这个反例直接动摇了论文的因果归因：如果 ledger 的 ground truth 与真实 authorization 语义不对齐，那么论文测量的 high formation rate 和 propagation rate 可能主要反映的是 ledger 的 false negative rate 而非 memory 的 infidelity，而 safety-utility tradeoff 中的 \"undergrant\" 也可能是 defense 在正确地保留 implicit permission 却被 ledger 错误地惩罚。为了使这个反例具有说服力，我会在三个领域中各构造 20 个包含 implicit authorization 的 cases，并邀请 domain experts 独立标注每个 case 的真实 authorization status，然后比较 expert judgment 与 canonical ledger 的一致率；如果一致率显著低于 100%（例如低于 80%），则论文中所有依赖 ledger 的定量结论——formation rate、propagation rate、exact-state repair 效果、safety-utility frontier——都需要被重新审视，因为它们测量的可能不是 memory 的 failure，而是 benchmark 自身 representation gap 的投影。\n\n### § 12 Follow-up Research Idea\n\n这个 idea 由论文最根本的未满足需求驱动：论文将 authorization state 视为一个可以被 deterministic replay 精确复现的 ground truth，并试图通过 gating 或 event sourcing 强制 memory 忠实于这个 ground truth，但真实组织中的 authorization 本质上是 ambiguous、contested 和 context-dependent 的，binary 的 authorized/unauthorized 判定无法捕获这种不确定性，而论文的 mitigation 正是因为采用 binary gating 才陷入 safety-utility tradeoff。我提议将 framing 从 **exact state preservation** 转向 **probabilistic authorization state estimation under uncertainty**：不要求 memory 精确匹配 ground truth，而是让 memory writer 维护一个对 authorization state 的 calibrated belief distribution，并让 executor 根据 uncertainty 做出 risk-aware decisions——例如当 P(authorized) 处于 ambiguous zone 时 trigger clarification action 而非盲目执行或盲目拒绝。这个 framing 借鉴了 robotics 和 control theory 中的 Bayesian state estimation 与 active inference：在那些领域中，系统状态从来不是精确已知的，agent 通过 sensor model 和 transition model 维护 belief distribution，并通过选择 actions 来主动减少 uncertainty。将这一框架迁移到 agent memory 中，authorization state 成为 latent variable，memory writer 的任务从\"存储正确答案\"变为\"维护 calibrated posterior\"，executor 的任务从\"服从 memory\"变为\"基于 posterior 和 risk tolerance 选择 execute、reject 或 defer\"。第一个实验将构造一组包含 explicit grants、implicit modifications 和 conflicting policy sources 的 organizational histories，训练或 prompt memory writer 输出每个 pending request 的 P(authorized) 及其 uncertainty estimate，executor 设定两个 threshold（execute threshold 和 reject threshold），介于两者之间的请求触发 human-in-the-loop clarification。核心测量指标是 calibration error（Brier score 或 ECE，衡量 predicted probability 与实际 authorization outcome 的对齐程度）以及一个 joint metric 同时惩罚 unauthorized action 和 unjustified rejection。与论文的 binary approach 对比，我预期 probabilistic approach 能在 Pareto frontier 上取得显著改善，因为 ambiguous cases 被路由到 clarification 而非被错误地 binary classify，从而同时降低 unauthorized submission 和 legitimate use 的损失。这个提议与已有工作的根本区别在于：论文及所有前人工作（AUTHMEM-BENCH、PPMF、GATEMEM）都假设 authorization 是 deterministic 的、目标是 exact match，而这个 idea 将 authorization 视为 latent variable、目标是 calibrated belief 和 uncertainty-aware action selection，这打开了一个全新的研究方向——agent memory 不再是 state 的 mirror，而是 state 的 approximate posterior，而 agent safety 不再是 compliance with stored policy，而是 rational action under authorization uncertainty。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Tommaso Cerruti\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Mika Okamoto\", \"affiliations\": [2], \"markers\": [\"†\"]},\n    {\"name\": \"Ansel Kaplan Erol\", \"affiliations\": [2], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"ETH Zurich\"},\n    {\"id\": 2, \"name\": \"Georgia Institute of Technology\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Correspondence: tcerruti@ethz.ch\"},\n    {\"marker\": \"†\", \"text\": \"Supervisory role on this work, conducted as part of the EleutherAI SOAR program; see the author-contribution statement in the Acknowledgements.\"}\n  ]\n}\n```", "summary_translation": "长期运行的 LLM agents 依赖 persistent memory 在交互间传递状态，包括权限、限制和撤销。当 memory 错误表示这种不断演变的 authorization state 时，agent 自身的记录可能会授予底层历史记录从未允许过的权限，从而在没有外部攻击的情况下导致 misaligned behavior。我们将这种失败称为 endogenous authorization laundering，其中写入 memory 的虚假权限随着其来源被洗去，会导致未授权操作。随后我们引入了 EAL-Bench，它衡量 persistent memory 保存不断演变的 authorization state 的准确度，以及错误是否会传播到下游的未授权操作。我们在采购、网络安全和金融领域评估了五个作为 memory writers 的 LLM 和两个作为 executors 的 LLM。我们发现，在增量 memory 更新下，writers 为高达 50.2% 的未授权请求创建了虚假权限；一旦出现虚假权限，executors 在 98.6% 的试验中会据此采取行动。两种安全防护措施——要求存储的权限由有效的源事件支持，以及通过 bounded event sourcing 跟踪权限更改——大幅减少了 laundering，但两者也都拒绝了更多合法操作，暴露了 safety-utility tradeoff。因此，persistent memory 不仅仅是一个性能组件，而是 LLM agent 有效 authorization policy 的一部分。"}, {"title": "Act More, Decide Less: Skill-Guided Adaptive Action Chunking for Long-Horizon LLM Agents", "arxiv_id": "2609.02042", "authors": "Yanting Yang, Can Jin, Jinman Zhao, Jiahao Wu, Yang Zhou, Zhepeng Wang, Zhendong Wang, Mu Zhou, Dimitris N. Metaxas", "summary": "Large language model (LLM) agents for long-horizon interactive tasks typically follow a ReAct-style protocol, issuing one primitive action per LLM round. While this enables frequent replanning, it is inefficient for long-horizon tasks where many rounds are spent on routine action sequences. A natural alternative is to let the agent emit variable-length action chunks. However, naively training such policies with standard reinforcement learning fails: the agent either collapses to single-action behavior or over-commits to excessively long sequences. Both failures share a common root cause: the inability to learn chunk boundaries. We propose SPACE, which addresses this challenge by distilling chunk-boundary supervision from trajectory-induced programmatic skills. We induce two-level programmatic skills from successful trajectories, where subskill boundaries serve as direct chunk-boundary supervision. This temporal structure is then distilled into a primitive-chunk policy via hybrid on-/off-policy optimization with chunk-aware credit assignment. Experiments on ALFWorld and ScienceWorld show that SPACE improves success rates by 7.0%-31.3% over the strongest baseline in each setting while reducing average LLM decision rounds by up to 78.9%.", "category": "cs.LG", "cluster": "Long-Horizon Planning \u0026 Memory", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文研究的核心问题是：在 long-horizon interactive tasks 中，LLM agent 如何学习生成 variable-length action chunks，而非每轮仅输出一个 primitive action。当前主流的 ReAct-style protocol 要求 agent 在每个 LLM round 中推理、执行一个 primitive action、观察环境反馈，再决定下一步。这种细粒度交互在 short-horizon 任务中有利于频繁 replanning，但在 long-horizon 场景中会导致大量 LLM 决策轮次浪费在 routine action sequences 上，同时容易引发 short-sighted behavior、compounding errors 以及 repetitive loops。一个自然的替代方案是扩展 action space，允许 policy 在每轮输出可变长度的 action sequence。然而，作者发现直接用 standard RL objectives（如 GRPO）训练 variable-length policy 会失败：policy 要么 collapse 回 single-action behavior，要么 over-commit 到过长的 action sequence 而不提升 success rate。两种失败模式的共同根源在于，在 sparse terminal rewards 下，RL signal 不携带任何关于 chunk boundaries 应该放在哪里的信息——policy 无法区分哪些 actions 应该被组合在一起、open-loop execution 应该持续多长、何时应该暂停以获取新的 observation。因此，真正的挑战不是让 agent 能够输出多个 actions，而是 learning action chunk boundaries。解决这个问题能显著提升 long-horizon LLM agent 的 success–efficiency trade-off：减少 LLM decision rounds 意味着更低的推理成本和更快的响应，同时保持甚至提高任务成功率，这对于将 LLM agent 部署到真实的多步骤交互场景中具有直接的工程价值。\n\n### § 2 前人工作与不足\n\n该问题之前并未被直接解决。现有工作可分为三条线索，每条都有明确的局限。第一条是 RL for LLM agents 方向，包括 RLOO、GRPO、GiGPO 以及 Archer 等方法。这些方法在 credit assignment 上做了改进——hierarchical credit assignment、leave-one-out estimation、group-based advantages、turn-level reward shaping——但它们全部 operate within the ReAct-style single-action-per-round paradigm，从未触及 temporal granularity of acting 这一维度。它们优化的是\"每轮一个 action\"框架下的 sample efficiency 和 credit assignment 质量，而非 action chunking 本身。第二条是 action chunking in decision making，起源于 options framework，在 imitation learning 中由 ACT 推广，近期在 online RL 中由 Q-chunking 和 SEAR 扩展。但这些工作主要面向 continuous-control settings，使用 fixed-length chunks，其 chunk granularity 不随 textual context 变化。在 LLM agent 的 discrete textual primitive actions 场景中，合适的 chunk 长度随上下文持续变化——\"go to fridge, open fridge, take apple\"是一个自然 chunk，而\"go to fridge\"单独出现时可能就是完整的决策单元——fixed-length chunks 在此不适用，且 chunk boundaries 必须从 interaction histories 中推断，而非预设。第三条是 skill abstractions and skill-augmented learning，包括 SkillAct、Voyager、CodeAct、ASI 等。这些方法将 skills 作为 prompt-time guidance 或 executable code library 使用，在 inference 时依赖 skill library 的检索和调用。它们虽然提供了结构化的、可参数化的 skill 表示，但从未将 skill 的内部 temporal structure 作为 chunk-boundary supervision 来训练一个 flat multi-action policy。具体而言，ASI 能从 trajectories 中 induce programmatic skills，但 skills 在其框架中是 runtime tool 而非 training-time teacher；SkillRL 将 skills 整合进 RL training，但仍然停留在 single-action-per-round 的决策粒度。本文的关键创新在于识别出 programmatic skills 的 subskill boundaries 天然定义了 chunk boundaries，并将这一结构作为 off-policy distillation signal 蒸馏到一个不依赖 skill library 的 primitive-chunk policy 中——这一连接在 prior work 中从未被建立。", "core_insight": "### § 3 重建作者的思考路径\n\n在长程交互任务中，LLM agents 普遍采用 ReAct-style 的单步交互协议，每轮推理只输出一个 primitive action。这种细粒度的交互虽然允许频繁 replanning，但在长程任务中暴露出明显的局限性：大量决策轮次被消耗在常规的动作序列上，容易引发短视行为、误差累积，甚至使 agent 陷入重复无效的循环。一个自然的改进方向是引入 action chunking，允许 agent 每轮输出变长的动作序列，从而减少 LLM 调用次数并实现时间维度上的抽象。这一思路在 robotics 和 RL 领域已有成熟的基础，例如 options framework 和 ACT 等方法。\n\n然而，当作者尝试用标准 RL 目标（如 GRPO）直接训练变长动作策略时，观察到了两种典型的 failure mode：策略要么 collapse 回单步动作行为，要么 over-commit 到过长的动作序列。这两种失败的共同根源在于，在稀疏 terminal reward 下，RL signal 本身不携带任何关于 chunk boundary 应该放置在哪里的信息。policy 无法判断哪些动作应当被组合在一起、开环执行应该持续多久、何时应当暂停以获取新的环境观测。因此，核心挑战并非如何让模型输出多个动作，而是如何让它学会动作 chunk 的边界。\n\n既然 RL reward 无法提供边界监督，作者转向寻找其他结构化信号。先前工作表明，复杂的 agent 行为通常可以分解为结构化的、可参数化的 programmatic skills。如果从成功轨迹中诱导出两级 skill 结构——composite skill 及其有序的 subskill 调用序列——那么每个 subskill 的边界天然标记了一个 action chunk 的结束和下一个的开始。这种从轨迹中提取的 temporal structure 恰好提供了 terminal reward 无法给出的 chunk-boundary supervision。由此，作者形成了将 skill 结构作为训练时 teacher、通过蒸馏将边界知识迁移到 flat multi-action policy 的核心思路。\n\n### § 4 核心 Intuition\n\n在稀疏 terminal reward 下，标准 RL 无法告诉 policy 应该在哪里切分 action chunk，导致变长动作策略要么退化为单步动作，要么盲目输出过长序列。然而，成功轨迹中蕴含的 programmatic skill 结构天然定义了有意义的动作边界——每个 subskill 的结束就是一个 chunk 的结束。因此，只需在训练时将这种 skill 的边界结构作为监督信号蒸馏给 policy，就能让它在部署时自主生成长度合理、语义连贯的 action chunk，而无需依赖 skill library。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Act More, Decide Less: Skill-Guided Adaptive Action Chunking for Long-Horizon LLM Agents》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 本文研究的核心问题是：在 long-horizon interactive tasks 中，LLM agent 如何学习生成 variable-length action chunks，而非每轮仅输出一个 primitive action。当前主流的 ReAct-style protocol 要求 agent 在每个 LLM round 中推理、执行一个 primitive action、观察环境反馈，再决定下一步。这种细粒度交互在 short-horizon 任务中有利于频繁 replanning，但在 long-horizon 场景中会导致大量 LLM 决策轮次浪费在 routine action sequences 上，同时容易引发 short-sighted behavior、compounding errors 以及 repetitive loops。一个自然的替代方案是扩展 action space，允许 policy 在每轮输出可变长度的 action sequence。然而，作者发现直接用 standard RL objectives（如 GRPO）训练 variable-length policy 会失败：policy 要么 collapse 回 single-action behavior，要么 over-commit 到过长的 action sequence 而不提升 success rate。两种失败模式的共同根源在于，在 sparse terminal rewards 下，RL signal 不携带任何关于 chunk boundaries 应该放在哪里的信息——policy 无法区分哪些 actions 应该被组合在一起、open-loop execution 应该持续多长、何时应该暂停以获取新的 observation。因此，真正的挑战不是让 agent 能够输出多个 actions，而是 learning action chunk boundaries。解决这个问题能显著提升 long-horizon L...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在长程交互任务中，LLM agents 普遍采用 ReAct-style 的单步交互协议，每轮推理只输出一个 primitive action。这种细粒度的交互虽然允许频繁 replanning，但在长程任务中暴露出明显的局限性：大量决策轮次被消耗在常规的动作序列上，容易引发短视行为、误差累积，甚至使 agent 陷入重复无效的循环。一个自然的改进方向是引入 action chunking，允许 agent 每轮输出变长的动作序列，从而减少 LLM 调用次数并实现时间维度上的抽象。这一思路在 robotics 和 RL 领域已有成熟的基础，例如 options framework 和 ACT 等方法。 然而，当作者尝试用标准 RL 目标（如 GRPO）直接训练变长动作策略时，观察到了两种典型的 failure mode：策略要么 collapse 回单步动作行为，要么 over-commit 到过长的动作序列。这两种失败的共同根源在于，在稀疏 terminal reward 下，RL signal 本身不携带任何关于 chunk boundary 应该放置在哪里的信息。policy 无法判断哪些动作应当被组合在一起、开环执行应该持续多久、何时应当暂停以获取新的环境观测。因此，核心挑战并非如何让模型输出多个动作，而是如何让它学会动作 chunk 的边界。 既然 RL reward 无法提供边界监督，作者转向寻找其他结构化信号。先前工作表明，复杂的 agent 行为通常可以分解为结构化的、可参数化的 programmatic skills。如果从成功轨迹中诱导出两级 skill 结构——composite skill 及其有序的 subskill 调用序列——那么每个 subskill 的边界天然标记了一个 action chunk 的结束和下一个的开始。这种从轨迹中提取的 temporal structure 恰好提供了 terminal reward 无法给出的 chunk-boundary supervision。由此，作者形成了将... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **Act More, Decide Less: Skill-Guided Adaptive Action Chunking for Long-Horizon LLM Agents** **Yanting Yang[1]**[*] **, Can Jin[1]**[*] **, Jinman Zhao[2] , Jiahao Wu[3] , Yang Zhou[1] , Zhepeng Wang[4]** , **Zhendong Wang[5]** , **Mu Zhou[1]** , **Dimitris N. Metaxas[1]** 1Rutgers University, 2University of Toronto, 3The Hong Kong Polytechnic University, 4Amazon, 5Microsoft ## **Abstract** Large language model (LLM) agents for longhorizon interactive tasks typically follow a ReAct-style protocol, issuing one primitive action per LLM round. While this enables frequent replanning, it is inefficient for longhorizon tasks where many rounds are spent on routine action sequences. A natural alternative is to let the agent emit variable-length action chunks. However, naively training such policies with standard reinforcement learning fails: the agent either collapses to single-action behavior...", "additional_insights": "### § 8 Take-aways\n长程交互任务中的 LLM agents 通常遵循 ReAct-style 的单步 action 协议，这在长序列任务中效率低下；而直接使用标准 RL 训练 variable-length action chunks 会失败，因为 sparse terminal rewards 无法提供关于 chunk boundaries 位置的监督信号，导致 policy 退化为单步动作或过度承诺于无效的长序列。为了解决 chunk boundary 的学习问题，本文提出了 SPACE 框架，从成功的 trajectories 中提取 two-level programmatic skills（包含 composite skills 和 subskills），利用 subskill boundaries 作为天然的 chunk boundary 监督信号。在训练阶段，SPACE 采用 hybrid rollouts 策略，结合 primitive-chunk mode 的 on-policy 学习与 skill-augmented mode 展开后的 off-policy distillation，并引入 chunk-aware two-level advantages 进行 credit assignment。在部署时，学到的 policy 能够直接生成 variable-length primitive action chunks，完全脱离 skill library 的依赖。在 ALFWorld 和 ScienceWorld 上的实验表明，SPACE 相比最强 baseline 将 success rate 提升了 7.0%–31.3%，同时将 LLM decision rounds 减少了最高 78.9%，并且展现出更快的收敛速度和更高的 rollout efficiency。\n\n### § 9 最脆弱的假设\nSPACE 最核心且失败代价最大的假设是：**从成功 trajectories 中诱导出的 programmatic subskill boundaries，代表了在未知状态下最优或至少高度可靠的 action chunk 切分点**。这个假设在实际环境中极易不成立：成功的 trajectories 往往包含大量冗余探索、无效尝试或特定状态下的条件反射动作，从中大模型诱导出的 subskills 可能继承这些噪声，导致切分出的 chunk boundaries 并非基于任务的内在逻辑，而是拟合了某次特定成功路径的偶然结构。如果这些 boundaries 在 unseen splits 或环境动态变化时不再适用，agent 盲目执行这些长 chunk 会跳过关键的中间 observation，导致 compounding errors 且无法及时 replan，比单步行动更危险。论文虽然展示了 SPACE 在 unseen splits 上的性能提升，并通过 Figure 3 证明了 chunk 长度没有退化，但并未提供直接的定量证据（如人工标注的 ground-truth boundaries 对比）来证明诱导出的 boundaries 在语义和逻辑上真正匹配了最优的 subtask 切分点，也缺乏在高度随机或动态环境中的验证来证明这些固定 boundaries 的鲁棒性。\n\n### § 10 最小复现实验\n如果有一周时间，最小复现实验应聚焦于验证论文中最核心的 claim：**naive multi-action RL 会失败，而引入 skill-boundary supervision 能学到有意义的 chunk 长度**。使用 ALFWorld 环境中的 `pick_heat_then_place_in_recep` 任务类型，基于 Qwen3-4B 模型。首先实现一个允许输出 1-6 个 primitive actions 的 multi-action GRPO baseline，训练约 50 步；然后实现一个极简版的 SPACE：手动编写 3-4 个确定性的 subskills（如 `find_object`, `heat_object`, `place_object`），在训练时强制让一部分 rollouts 调用这些 skills 并展开为 off-policy 数据进行 distillation。实验中测量两个关键指标：average primitive actions per LLM round 和 success rate。如果实验结果显示 naive multi-action GRPO 的平均 actions per round 迅速坍缩为 1 或膨胀至 5-6 且 success rate 极低，而引入手动 skill boundaries 的简化版 SPACE 能够稳定在 3-4 个 actions per round 并获得显著更高的 success rate，则支持论文的核心 claim；反之，若 naive GRPO 也能自发学到合理的 chunk 长度，或 skill boundaries 的引入未能改善 chunk 分布，则反驳了该方法的必要性。", "research_value": "### § 11 最强反例设计\n\n我会设计一个引入“环境动态执行时扰动”的实验来直接挑战 SPACE 的核心假设：即从成功 trajectories 中诱导出的 subskill boundaries 代表了可靠的 action chunk 切分点。论文所验证的 ALFWorld 和 ScienceWorld 本质上是高度确定性的文本环境，其效率提升可能仅仅是因为 agent 在可预测环境中盲目跳过了中间 observations，而非真正学会了鲁棒的 chunking 策略。具体反例实验设计为：在 ALFWorld 的 `pick_heat_then_place_in_recep` 任务中引入 20% 的执行时状态扰动概率（例如，当 agent 执行 `go to fridge, open fridge, take apple` 这一 chunk 时，环境随机判定 fridge 已被锁死，或 apple 被随机移至另一位置）。在此扰动环境下对比 SPACE 与标准 ReAct baseline 的 success rate 和 compounding errors。如果实验结果显示 SPACE 的 success rate 发生断崖式下跌且显著低于 ReAct baseline，即可证明其学到的 chunk boundaries 是极其脆弱的启发式规则。这提供了一个强有力的替代解释：SPACE 所谓的“效率提升”实际上是以牺牲对环境不确定性的感知能力为代价的，在需要 mid-chunk replanning 的非确定性真实世界中，open-loop execution 长序列会导致不可逆的错误累积，其失败代价远大于单步行动的冗余成本。\n\n### § 12 Follow-up Research Idea\n\n本提议旨在解决 SPACE 依赖离线静态 skill boundaries 且在动态环境中极易失效的核心局限。（a）真实的 action chunk boundaries 不应是历史成功轨迹的固有结构，而应是由 agent 在当前状态下的“认知不确定性”动态决定的——当 agent 对后续状态的预测充满信心时，应自动拉长 chunk；当预测遇到分歧或环境反馈异常时，应立即截断 chunk 并重新规划。（b）为实现这一目标，可借鉴 Model-based RL 中的 World Models 以及 Active Inference 领域的 epistemic uncertainty quantification 工具，将 LLM 的 next-observation prediction 能力转化为内部的 uncertainty estimator。（c）第一个实验将构建一个“预测误差驱动的自适应分块”框架：训练一个辅助的 forward dynamics model 来预测下一个 textual observation，在 RL 训练阶段，policy 生成 primitive actions 的同时，dynamics model 实时计算预测置信度；当预测误差低于阈值时给予 policy 继续 open-loop execution 的 reward，一旦预测误差越界则强制触发 LLM decision round 并给予惩罚。该实验将在前述带有执行时扰动的 ALFWorld 环境中进行，验证动态 boundary 是否能在保持高效率的同时显著优于 SPACE 的静态 boundary。此提议彻底区别于 SPACE 的离线 skill distillation 范式，也不同于 ACT 等方法的 fixed-length chunks，它将 action chunking 从一个“模式记忆”问题重新定义为基于实时环境可预测性的“主动中断”问题，为 LLM agent 在高随机性真实世界中的部署开辟了新方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yanting Yang\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Can Jin\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Jinman Zhao\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jiahao Wu\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Yang Zhou\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhepeng Wang\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Zhendong Wang\", \"affiliations\": [5], \"markers\": []},\n    {\"name\": \"Mu Zhou\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Dimitris N. Metaxas\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Rutgers University\"},\n    {\"id\": 2, \"name\": \"University of Toronto\"},\n    {\"id\": 3, \"name\": \"The Hong Kong Polytechnic University\"},\n    {\"id\": 4, \"name\": \"Amazon\"},\n    {\"id\": 5, \"name\": \"Microsoft\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution. Correspondence: jiahao.wu@connect.polyu.hk, dnm@cs.rutgers.edu\"}\n  ]\n}\n```", "summary_translation": "用于 long-horizon interactive tasks 的大型语言模型 (LLM) 智能体通常遵循 ReAct-style protocol，在每个 LLM round 中发出一个 primitive action。虽然这使得频繁的 replanning 成为可能，但对于许多 rounds 都花费在 routine action sequences 上的 long-horizon tasks 而言，这是低效的。一种自然的替代方案是让智能体发出 variable-length action chunks。然而，使用 standard reinforcement learning 朴素地训练此类 policies 会失败：智能体要么退化为 single-action behavior，要么过度执行过长的 sequences。这两种失败都有一个共同的根源：无法学习 chunk boundaries。我们提出了 SPACE，它通过从 trajectory-induced programmatic skills 中蒸馏 chunk-boundary supervision 来应对这一挑战。我们从成功的 trajectories 中诱导出 two-level programmatic skills，其中 subskill boundaries 作为直接的 chunk-boundary supervision。然后，通过带有 chunk-aware credit assignment 的 hybrid on-/off-policy optimization，将这种 temporal structure 蒸馏到 primitive-chunk policy 中。在 ALFWorld 和 ScienceWorld 上的实验表明，与每种设置下最强的 baseline 相比，SPACE 将 success rates 提高了 7.0%-31.3%，同时将 average LLM decision rounds 减少了高达 78.9%。"}]}, {"name": "Tool Use, Skills \u0026 Code Generation", "count": 5, "papers": [{"title": "PaperCompiler: Faithful Paper-to-Code Generation via Repository-Level Specification Compilation", "arxiv_id": "2609.02272", "authors": "Yunhao Liu, Hong Phuc Pham, Jaehong Yoon", "summary": "Faithfully translating research papers into repository-level implementations remains challenging because papers often describe methods at a high level, leave implementation assumptions implicit, and require generated repositories to preserve method logic, evaluation protocols, and cross-file consistency. Despite recent advances in paper-to-code agents, their intermediate outputs are often presented as free-form plans or summaries that downstream coding agents may ignore, reinterpret, or compress, leading to algorithmic simplification and inconsistent repository structure. To address these challenges, we introduce PaperCompiler, a paper-to-code generation framework that compiles paper-grounded evidence into explicit repository-level implementation specifications. PaperCompiler grounds implementation-relevant evidence while preserving source provenance and distinguishing paper-supported, inferred, externally delegated, and unresolved information. The resulting specifications encode non-degradation requirements, ownership assignments, cross-file dependencies, and file-level constraints. Repository generation proceeds under these compiled specifications while retaining flexibility over local engineering choices not fixed by the paper. PaperCompiler outperforms strong baselines on Paper2CodeBench, achieving a 13.8% relative improvement in reference-based fidelity (from 3.64 to 4.15) and reducing high-severity evaluator critiques (from 13.2% to 6.1%).", "category": "cs.CL", "cluster": "Tool Use, Skills \u0026 Code Generation", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-54 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了 PaperCompiler，一个用于改进 paper-to-code 生成过程的框架。论文明确指出其研究对象是 \"paper-to-code agents\" 和 \"downstream coding agents\"，属于 LLM 智能体（特别是 Coding Agent）的范畴。该框架通过将自由形式的计划编译为明确的仓库级实现规范，解决了现有智能体在长程代码生成中容易忽略或误解中间计划的失败机制。这直接对应于改进 LLM 智能体的规划与执行能力，符合“构建LLM智能体的方法论或新框架”以及“研究对象明确是 LLM Agents 且结论直接帮助改进智能体能力”的保留标准。论文不涉及任何被排除的领域（如安全、多模态、图技术或纯系统工程编排），因此完全符合您的核心研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决的核心问题是：如何将机器学习研究论文忠实地翻译为 repository-level 的代码实现。这一任务的难点在于论文通常以 high-level 方式描述方法，将大量 implementation-critical details（如数据预处理、模型初始化、evaluation conventions）留作隐含假设，而目标 repository 不仅需要恢复这些决策，还必须在多文件之间保持 method logic、evaluation protocols 和 cross-file consistency 的完整一致。这一问题对于研究的 reproducibility 和实际采用至关重要，尤其是在 official code 不可用或不完整的情况下，研究者往往需要仅凭论文文本重建可运行的实验系统。随着 code-capable LLMs 的进步，自动化 paper-to-code 生成已成为可能，但现有系统在将论文信息转化为多文件代码的过程中，普遍存在信息丢失和语义漂移的问题，导致生成的 repository 表面完整却在算法层面发生退化。解决这一问题不仅能提升论文复现的效率和准确性，还能为 research automation 提供更可靠的基础设施。\n\n### § 2 前人工作与不足\n\nPaper-to-code 生成此前已被多个系统探索。PaperCoder 将 repository synthesis 分解为 planning、analysis 和 coding 三个阶段；AutoP2C 在此基础上引入 multimodal evidence extraction 和 iterative debugging；AutoReproduce 则利用 paper lineage 检索 implicit knowledge 并通过 generated tests 进行 refinement；DeepCode 结合了 blueprints、retrieval、memory 和 iterative correction。此外，general-purpose 的 software-engineering agents 如 ChatDEV、MetaGPT、SWE-agent 和 OpenHands 能够协调 repository-level 开发，但并非为恢复 paper-specific 的方法论约束而设计。\n\n这些系统的共同瓶颈在于：它们在阶段之间传递 paper-derived knowledge 时，使用的是 free-form plans、summaries 或 reasoning traces。这种 intermediate representation 的根本缺陷在于它没有将实现需求显式绑定到负责实现它们的 repository components 上——即缺乏 explicit ownership assignment。具体而言，当一个 free-form summary 描述了\"需要枚举所有 valid partitions 并为每个 partition 构造 basis element\"这一算法要求时，下游 coding agent 并不知道这一要求应由哪个文件负责实现，也不清楚它与其他文件之间的 artifact flow 关系。这为下游 agent 提供了忽略、压缩或重新解释关键细节的空间，导致 algorithmic simplification（如仅返回 trivial partition 而丢弃大部分 basis elements）和 cross-file inconsistency（如 producer-consumer 之间的 schema 不匹配）。论文中的 case study（Universal Neural Functionals）清晰地展示了这一问题：PaperCoder 生成的代码虽然结构上看似连通，但 partition-generation logic 仅返回单一候选，使 basis family 退化为单个元素。\n\n这一不足并非简单的工程疏忽，而是方法层面的结构性缺陷：free-form intermediates 无法表达 non-degradation requirements（即哪些简化是被禁止的）、无法定义 file-level constraints（即每个文件必须满足的具体接口和语义约束）、也无法维护 cross-file dependency graph（即 artifact 的 producer-consumer 关系）。因此，即使增加 generation budget 或引入更多 evidence source（如 AutoP2C 的 multimodal input 或 AutoReproduce 的 paper lineage），也无法从根本上解决信息在 propagation 过程中被弱化的问题。论文通过 ablation study 进一步证实，Requirement Reconciliation（建立 method-level obligations 并标记 forbidden substitutions）和 File-Level Contracting（将全局约束 localize 为每个文件的实现契约）是性能提升最关键的两个组件，而去除 Context Slicing 虽然在 reference-free 评估中偶尔因提供更广上下文而获益，但在 reference-based 评估中仍导致 fidelity 下降，说明问题不在于信息量的多寡，而在于信息是否被结构化地约束到正确的实现位置。", "core_insight": "### § 3 重建作者的思考路径\n\n研究者观察到，尽管 LLM 驱动的 multi-agent 系统能够处理 repository-level 的软件开发，但将 ML 论文转化为代码时常常出现 algorithmic degradation 或 cross-file inconsistency。分析现有的 paper-to-code 工作流（如 PaperCoder 的 planning-analysis-coding 分离，或 AutoP2C 的多模态提取），可以发现一个共同的瓶颈：系统各阶段之间传递的中间产物是 free-form plans 或 summaries。这种非结构化的信息传递方式没有明确指定哪个文件负责实现哪个具体需求，使得下游的 coding agents 在面对缺失细节时倾向于采用通用的近似实现，从而丢失了论文特有的方法逻辑。从软件工程的经验来看，解决需求在传递过程中被弱化或误解问题的有效手段是引入显式的 specification 和 contract。如果将这一机制应用到 paper-to-code 任务中，把论文中的实现证据提取出来，并编译成一种不仅记录“要做什么”，还明确“在哪个文件做”、“不能怎么简化”以及“与其他文件如何交互”的结构化规范，那么代码生成就不再依赖于对自由文本摘要的正确解读，而是受制于硬性的工程约束。这就自然引出了将 repository generation 视为 specification compilation 的思路。\n\n### § 4 核心 Intuition\n\n先前方法失效的根源在于，它们用自由文本摘要来传递论文信息，这给了下游代码生成器随意解释和简化的空间。PaperCompiler 的核心直觉是：不要让代码生成器去“理解”论文该做什么，而是直接给它下达一份精确的“工程合同”——明确每个文件必须实现什么功能、不能做哪些简化、以及它与其他文件的接口是什么。通过将论文中的关键证据编译成这种带有明确 ownership 和 non-degradation 约束的 file-level specifications，代码生成就被限制在了一个无法轻易偏离原方法的框架内。", "methodology": "§ 5 具体方法与完整 Pipeline\n```text\n[Paper Text]\n     |\n     v\n+---------------------+\n| 1. Paper Grounding  | ---\u003E Implementation Blueprint\n+---------------------+      \u0026 Source Evidence\n     |\n     v\n+-----------------------------+\n| 2. Specification Compilation| ---\u003E Ownership, Cross-file Deps,\n+-----------------------------+      File-level Specs (Non-degradation)\n     |\n     v\n+-----------------------------------+\n| 3. Constraint-Guided Repo Gen     | ---\u003E Generated Repository\n+-----------------------------------+      (Interfaces \u0026 Consistency)\n```\nPaperCompiler 框架由三个核心阶段组成，将论文文本逐步转化为具有跨文件一致性的 repository-level 代码实现：\n1. Paper Grounding：该阶段从论文中提取与实现相关的证据，构建 implementation blueprint，同时保留支持这些证据的 source provenance。它将信息区分为 paper-supported、inferred、externally delegated 和 unresolved，确保后续阶段能够明确区分哪些是有论文依据的，哪些是推断或未解决的。\n2. Specification Compilation：该阶段将前一阶段提取的 grounded evidence 调和为显式的 implementation requirements。它将这些需求组织成 repository-level 的 ownership assignments（明确哪个文件负责实现哪个需求）、cross-file dependencies（跨文件依赖关系）以及 localized file specifications（文件级规范）。此外，规范中还包含 non-degradation requirements，以防止在代码生成过程中发生方法层面的退化或简化。\n3. Constraint-Guided Repository Generation：在编译好的 specifications 指导下，该阶段生成具体的代码文件。生成过程严格遵循 file-level constraints 和跨文件接口，同时保留对论文未明确的 local engineering choices 的灵活性。通过这种方式，paper-grounded requirements 被直接传递到具体的实现位置，避免了在 repository 构建过程中被弱化或重新解释。\n\n§ 7 实验设计与结论\n提出问题：PaperCompiler 能否有效提升 paper-to-code 生成的 fidelity，并减少算法层面的退化和跨文件不一致？\n实验验证：研究者在 Paper2CodeBench 和 Paper2CodeExtra (P2C-Ex) 数据集的 90 篇论文上进行了评估，对比了 PaperCoder、AutoP2C 和 AutoReproduce 等强基线。评估指标包括 reference-free evaluation、P2C-Ex 评估以及 reference-based fidelity（与作者官方代码对比）。此外，还进行了 evaluator-error analysis 以统计高严重性错误率。\n结论：实验结果表明，PaperCompiler 在所有匹配设置下均取得了一致的提升：reference-free evaluation 提升了 4.7%（4.562 → 4.777），P2C-Ex 提升了 4.3%（4.535 → 4.728），reference-based fidelity 提升了 13.8%（3.647 → 4.152）。当生成的 repository 与作者实现进行对比时，提升最为显著，说明 PaperCompiler 不仅在表面完整度上有所改善，更在 paper-specific 的实现细节上提高了忠实度。同时，高严重性失败率从 13.2% 降至 6.1%，进一步证明了其在防止算法退化方面的有效性。", "additional_insights": "### § 8 Take-aways\nPaperCompiler 是一个 paper-to-code 生成框架，通过将论文中的证据编译为 repository-level 的 implementation specifications，解决了现有方法在生成代码时丢失或弱化论文特定细节的问题。现有的 paper-to-code agents 通常使用 free-form plans 或 summaries 传递信息，导致下游 coding agents 忽略、重新解释或压缩关键算法细节，从而引发 algorithmic simplification 和 cross-file inconsistency。PaperCompiler 包含三个阶段：Paper Grounding 提取结构化实现蓝图并保留原始证据；Specification Compilation 将证据调和为明确的实现需求、分配 ownership 和 cross-file dependencies，并生成 file-level constraints；Constraint-Guided Repository Generation 在约束下生成代码，保持接口和跨文件一致性。通过引入 non-degradation requirements 和明确的 ownership assignments，PaperCompiler 防止了方法级逻辑的退化，并确保了跨文件 artifact 流的语义一致性。在 Paper2CodeBench 上的评估表明，PaperCompiler 在 reference-based fidelity 上实现了 13.8% 的相对提升（3.64 -\u003E 4.15），并将 high-severity evaluator critiques 从 13.2% 降至 6.1%。消融实验证明，Requirement Reconciliation 和 File-Level Contracting 是最关键的组件，而 Context Slicing 则在保护文件生成免受关键依赖缺失影响方面发挥作用。\n\n### § 9 最脆弱的假设\nPaperCompiler 最核心且最脆弱的假设是：LLM 能够准确地将论文中的自然语言描述和算法细节提取、调和并转化为精确的、可执行的 file-level specifications，且这些 specifications 能够被下游的 coding agent 忠实地执行而不发生语义漂移。在实际中，这个假设可能不成立，因为论文中的实现细节往往是隐式的、高度依赖上下文的，或者涉及复杂的数学公式。LLM 在进行 Requirement Reconciliation 时，可能会因为对论文理解的偏差而产生错误的 contracts，或者在 Ownership-Guided Architecture Synthesis 中做出不合理的文件分配。此外，即使 specifications 是正确的，下游的 coding agent 在 Constraint-Guided Repository Generation 阶段仍可能因为 LLM 本身的局限性（如长上下文遗忘、指令遵循能力不足）而偏离这些约束。论文虽然通过 case study（如 Universal Neural Functionals）展示了 PaperCompiler 能够保留 partition-to-basis construction rule，但也承认在 SEABO 案例中，尽管 specifications 保留了预期的 topology，最终生成的代码在 external-protocol 和 runner integration 上仍然失败（如 fallback to dummy dataset, NotImplementedError）。这表明 LLM 在执行 file-level specifications 时并非完全可靠，且论文缺少对 Specification Compilation 阶段本身准确性的定量评估，仅仅通过最终代码的 fidelity 来间接证明。\n\n### § 10 最小复现实验\n如果有一周时间，可以设计一个最小复现实验来验证 PaperCompiler 的核心 claim：即 explicit file-level specifications 能够防止 algorithmic degradation。从 Paper2CodeBench 中选取 5 篇包含明确且容易退化的算法细节的论文（如特定的数据预处理步骤、loss function 计算方式或模型架构变体）。不需要复现完整的 PaperCompiler pipeline，而是手动模拟 Specification Compilation 阶段：对于每篇论文，人工提取关键的 non-degradation requirements 并编写 file-level contracts。然后使用相同的 LLM（如 o3-mini）在两种条件下生成代码：条件 1 仅提供论文的 Markdown 文本（模拟 baseline 的 free-form planning）；条件 2 提供论文文本加上人工编写的 file-level contracts（模拟 PaperCompiler 的核心机制）。使用 reference-based evaluation 协议，将生成的代码与作者提供的官方代码进行对比，重点检查那些被标记为 non-degradation requirements 的算法细节是否在生成的代码中得到了保留，计算两种条件下关键算法细节的保留率。如果条件 2 的保留率显著高于条件 1，则支持了 PaperCompiler 的核心 claim；如果保留率没有显著差异，或者 LLM 在条件 2 下仍然大量偏离 contracts，则反驳了该 claim，说明问题可能在于 LLM 的指令遵循能力而非信息的传递方式。", "research_value": "### § 11 最强反例设计\n要最有力地攻击 PaperCompiler，我并不会质疑“结构化约束”在理论上的优越性，而是会挑战其性能提升的**替代解释**以及其在**错误传播上的脆弱性**。首先，PaperCompiler 在 Paper2CodeBench 上的 13.8% fidelity 提升可能并非源于 ownership assignments 和 non-degradation requirements 的结构化逻辑，而是仅仅因为 Specification Compilation 阶段迫使 LLM 对论文进行了多次 multi-pass reasoning 和 context reorganization，这种额外的 compute budget 和 token-level attention 本身就能减少信息遗漏。为了验证这一替代解释，我会设计一个“Sham Specifications”对照实验：保留 PaperCompiler 的三阶段 pipeline 结构，但在 Specification Compilation 阶段，让 LLM 生成与真实实现需求无关的 free-form detailed summaries（如单纯复述论文背景或无关的数学推导），且保持与真实 specifications 相当的 token 长度。如果这个 Sham 组在 reference-based fidelity 上也能获得接近 10% 的提升，就说明 PaperCompiler 的核心贡献被高估了，其性能增益主要来自 intermediate reasoning 的深度而非 specification 的结构化约束。其次，针对其最脆弱的假设——即 LLM 能生成正确的 file-level constraints，我会设计一个“Error Injection and Propagation”实验来展示方法可预测的灾难性失败。从 Paper2CodeBench 中选取 10 篇依赖复杂外部库或包含隐式数学定义的论文，在 Specification Compilation 阶段，人工故意引入微小的但合理的 specification 偏差（例如将某个 tensor dimension 的依赖关系错误分配给 producer 文件）。由于 PaperCompiler 的 Constraint-Guided Repository Generation 强制下游 agent 忠实执行这些 constraints，这种微小的上游错误会被系统性地放大并“锁死”在整个 repository 中。相比于 baseline 中 free-form planning 允许下游 agent 凭借 code prior 进行局部自我纠正，PaperCompiler 可能会表现出更严重的 cross-file schema collapse。这一反例将直接挑战论文的核心主张：在 LLM 自身理解能力受限的真实场景下，强制的 explicit file-level constraints 不仅无法防止 algorithmic degradation，反而会剥夺系统的自我修复能力，将单点理解错误固化为全局性的架构失败。\n\n### § 12 Follow-up Research Idea\n基于 PaperCompiler 静态且单向的 specification-to-code 编译过程的局限，我提出一个全新的研究方向：**Executable Specification Co-evolution (可执行规约协同演化)**。驱动这一想法的核心局限是：PaperCompiler 假设论文的 implementation intent 可以在 coding 前被完美提取并固化为静态 constraints，但在真实学术复现中，paper-derived specifications 与实际代码之间往往存在不可调和的张力（例如论文忽略了 batch size 对 memory 的限制，或隐式依赖了特定 library 的 side effect），强行让 code 忠实于有缺陷的 static specification 会导致“忠于论文但无法运行”的死代码。为了解决这一未满足的需求，我们可以借鉴 Formal Verification 领域中的 Counterexample-guided inductive synthesis (CEGIS) 以及 Software Engineering 中的 Runtime Assertion Checking，将 paper-to-code 生成重新 framing 为一个双向对齐问题：不是让代码单方面服从 specifications，而是让 specifications 与 executable code 在 runtime feedback 中共同演化。具体而言，可以将 PaperCompiler 提取的 non-degradation requirements 自动转化为 runtime assertions 或 property-based tests，作为生成的 repository 的内置验证层。当代码在 dry-run 或 minimal execution 阶段触发 assertion failure 时，系统不仅修改代码，更关键的是将 runtime trace（如 shape mismatch 或 NaN propagation）反馈给 Specification Compilation agent，触发其对 file-level constraints 的回溯修正——例如将“必须枚举所有 partitions”的绝对约束降级为“在 memory budget 内枚举最大可能 partitions”的 contextual constraint。第一个实验将构建一个包含 20 篇官方代码与论文文本存在已知轻微出入的论文集合（这在现实中极为常见），对比静态约束系统（如 PaperCompiler）与 Co-evolution 系统在生成可运行且语义保真代码上的表现。如果 Co-evolution 能够在保持核心 algorithmic fidelity 的同时，通过动态修正 specifications 解决那些因论文理想化描述而导致的 runtime 崩溃，这就证明了在 paper-to-code 任务中，runtime-grounded feedback 比静态文本推理更能逼近研究的真实意图。这一提议与现有的 iterative debugging（如 AutoP2C）有本质区别：后者是用执行错误来修复代码以匹配固定的论文文本，而本提议是用执行错误来修正对论文的理解，实现 paper intent 与 code reality 的双向动态对齐。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yunhao Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hong Phuc Pham\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jaehong Yoon\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"NTU Singapore\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"†\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "忠实地将研究论文转化为 repository-level implementations 仍然具有挑战性，因为论文通常在较高层面上描述方法，隐含实现假设，并要求生成的 repositories 保持方法逻辑、evaluation protocols 和 cross-file consistency。尽管 paper-to-code agents 最近取得了进展，但它们的中间输出通常以 free-form plans 或 summaries 的形式呈现，downstream coding agents 可能会忽略、重新解释或压缩这些输出，导致算法简化和不一致的 repository structure。为了应对这些挑战，我们引入了 PaperCompiler，这是一个 paper-to-code generation framework，它将 paper-grounded evidence 编译为显式的 repository-level implementation specifications。PaperCompiler 锚定与实现相关的证据，同时保留 source provenance，并区分 paper-supported、inferred、externally delegated 和 unresolved information。生成的 specifications 编码了 non-degradation requirements、ownership assignments、cross-file dependencies 和 file-level constraints。Repository generation 在这些 compiled specifications 下进行，同时对论文未固定的 local engineering choices 保持灵活性。PaperCompiler 在 Paper2CodeBench 上优于 strong baselines，在 reference-based fidelity 上实现了 13.8% 的相对提升（从 3.64 提升至 4.15），并减少了 high-severity evaluator critiques（从 13.2% 降至 6.1%）。"}, {"title": "Repo-To-Skill: Distilling GitHub Repositories Into AI4AI Skills", "arxiv_id": "2609.02749", "authors": "Jianlyu Chen, Yuyang Hu, Hongjin Qian, Jiawei Liu, Wenqing Wei, Xiaolong Chen, Defu Lian, Zhicheng Dou, Chaozhuo Li, Qiwei Ye, Zheng Liu", "summary": "Autonomous agents are beginning to carry out machine-learning (ML) research end to end. These agents combine a model backbone with a harness for planning, execution, memory, and verification, but this architecture still leaves domain-specific know-how outside the agent. We call this missing layer operational knowledge, the know-how that separates knowing a method from making it work. That knowledge is not absent from the field. It appears in repositories and papers, but in forms written for human readers and too large to load during a task. Once distilled into compact, verified skills, this knowledge can be reused across tasks rather than rediscovered during each run. We present DisCo, a skill-powered research agent that creates skills and uses them during research. Its distillation runs in two complementary forms: task-agnostic, condensing the field's widely used repositories into reusable skills, and task-oriented, producing the skills a concrete task calls for. The former, applied across the open ecosystem, yields the AREX-Skill Library, with 5,000+ verified skills distilled from 1,000 widely used ML repositories and organized into 20 areas and 178 capability families. With the GPT-5.5 backbone, research harness, and downstream execution budget held fixed, the skill-equipped research agent scores 134.3% higher on MLE-bench, 34.4% higher on PaperBench, 9.2% higher on FrontierCS, and 14.0% higher on PassNet than the same agent without skills. These gains come from adding distilled operating context under that fixed setup.", "category": "cs.CL", "cluster": "Tool Use, Skills \u0026 Code Generation", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是提出了一个名为 DisCo 的技能驱动型研究智能体框架，该框架能够从大型GitHub代码库中自动蒸馏出紧凑、经过验证的“技能”，并在执行研究任务时动态创建和使用这些技能。这直接对应了筛选标准中“单智能体”方向的“工具使用”和“技能获取”，以及智能体运行组件的自动改进与自适应优化。论文明确探讨了智能体的规划、执行、记忆和验证架构，并通过技能库的引入显著提升了智能体在多个长期科研基准上的表现。尽管其应用场景是机器学习研究，但其本质贡献是提出了一种新的智能体技能获取和演化机制，而非仅仅将LLM作为工具解决特定领域问题，因此完全符合“构建、改进、演化LLM智能体”的研究范围。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的核心研究问题是：如何为自主机器学习研究代理构建缺失的“operational knowledge”层，使其能够自动且大规模地从declarative sources（如代码库和论文）中提取、验证并复用领域特定的操作知识。当前的自主代理通常由LLM backbone和harness（负责编排、记忆和验证）两部分组成，但这两者均不携带特定领域的实操诀窍。Backbone的先验知识广泛但固定，harness控制流程但不提供领域内容。这导致代理在执行任务时必须通过trial-and-error来推断包行为、API用法和配置，不仅消耗大量执行预算，且这些发现在跨任务时无法被保留和复用。解决这个问题至关重要，因为ML研究是专业知识密集型的，成功取决于知道使用哪些方法、何时使用以及如何正确配置。将散落在repositories和papers中的知识蒸馏为紧凑、可验证的skills，能够将无指导的试错转化为有指导的执行，显著提升代理在复杂任务上的表现，减少资源浪费，并实现知识跨任务的累积与复用。\n\n### § 2 前人工作与不足\n在自主ML研究领域，前人工作如AI Scientist、Agent Laboratory和MLAgentbench主要通过强化模型backbone或改进harness（如propose-run-evaluate循环、多代理竞争、树搜索等）来提升代理能力。然而，这些系统将每个任务孤立处理，代理在每次任务中都需要重新学习库、配置和启动程序，无法跨任务摊销学习成本。在技能获取方面，Voyager、Agent Workflow Memory和ExpeL等系统尝试从交互轨迹中自动提取可复用知识，如可执行代码、工作流或自然语言见解。但这些方法存在关键缺陷：它们主要从交互轨迹中派生自由形式的知识，难以验证技能质量，也难以归因失败原因。此外，现有的Agent Skills规范（如SKILL.md）虽然提供了可移植的技能载体，但大规模分析显示其编写存在不一致性，难以大规模创建高质量技能。前人工作未能解决的核心问题是：如何从静态、版本特定的ML artifacts中自动提取operational knowledge，并将其作为独立于模型和harness的知识层进行系统化构建、验证和复用。这不仅是方法本身的限制，也是因为之前的问题没有被清楚定义为“operational knowledge的缺失”，而是被笼统地归因于模型能力或harness设计的不足。", "core_insight": "### § 3 重建作者的思考路径\n\nAutonomous ML research agents 的进展主要来自更强的 LLM backbone 和更精细的 harness 工程，但作者观察到这些 agents 在实际 ML 研究任务中仍频繁陷入 trial-and-error 的泥潭——错误配置运行、误用 package API、选择不当的实验设置——即使 backbone 推理能力足够，也往往在耗尽 budget 后才暴露问题。这种失败模式指向一个被忽视的缺口：agents 缺乏将领域方法转化为可执行操作的 know-how，即知道\"用什么方法\"却不清楚\"如何正确使用它\"。现有改进路径无法填补这一缺口：backbone 的 prior 广泛但固定，harness 控制流程但不携带 domain content；而从 agent experience 中提取可重用知识的方法（如 Voyager、ExpeL）因依赖 interaction traces 而难以验证和归因。与此同时，作者注意到这种 operational knowledge 实际上大量存在于 repositories 和 papers 中，只是以人类读者为目标、且体量过大而无法在任务期间直接加载。Agent Skills specification 的出现提供了一个关键线索：skills 作为以 SKILL.md 为中心的 artifact，可通过 progressive disclosure 让 agent 持有大量知识却只加载当前所需部分。由此，作者将问题重构为如何自动且大规模地将 declarative sources 蒸馏为 compact、verified、agent-facing 的 operational knowledge，并在不改变 model 和 harness 的前提下作为独立的知识层注入 agent，从而将 unguided trial-and-error 转化为 skill-guided execution。\n\n### § 4 核心 Intuition\n\n先前的 autonomous research agents 之所以在复杂 ML 任务中频繁失败，是因为它们每次都必须在有限 budget 内通过 trial-and-error 重新发现那些散落在 repositories 和 papers 中的 domain-specific operational knowledge——即\"知道一个方法\"与\"让它实际起作用\"之间的 know-how。DisCo 的核心直觉是：如果能在任务执行之前，将这些 declarative sources 自动蒸馏成紧凑、经过验证、可按需加载的 skills，并作为 operating context 提供给 agent，那么 agent 就可以直接站在已有领域知识的基础上进行有效执行，而不必重复试错。关键在于 skills 通过 progressive disclosure 让 agent 能持有数千个 skills 却只读取任务所需的少数几个，从而在不改变 model backbone 和 harness 的前提下，以独立的知识层补全了 agent 缺失的 operational knowledge。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Repo-To-Skill: Distilling GitHub Repositories Into AI4AI Skills》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出并解决的核心研究问题是：如何为自主机器学习研究代理构建缺失的“operational knowledge”层，使其能够自动且大规模地从declarative sources（如代码库和论文）中提取、验证并复用领域特定的操作知识。当前的自主代理通常由LLM backbone和harness（负责编排、记忆和验证）两部分组成，但这两者均不携带特定领域的实操诀窍。Backbone的先验知识广泛但固定，harness控制流程但不提供领域内容。这导致代理在执行任务时必须通过trial-and-error来推断包行为、API用法和配置，不仅消耗大量执行预算，且这些发现在跨任务时无法被保留和复用。解决这个问题至关重要，因为ML研究是专业知识密集型的，成功取决于知道使用哪些方法、何时使用以及如何正确配置。将散落在repositories和papers中的知识蒸馏为紧凑、可验证的skills，能够将无指导的试错转化为有指导的执行，显著提升代理在复杂任务上的表现，减少资源浪费，并实现知识跨任务的累积与复用。 ### § 2 前人工作与不足 在自主ML研究领域，前人工作如AI Scientist、Agent Laboratory和MLAgentbench主要通过强化模型backbone或改进harness（如propose-run-evaluate循环、多代理竞争、树搜索等）来提升代理能力。然而，这些系统将每个任务孤立处理，代理在每次任务中都需要重新学习库、配置和启动程序，无法跨任务摊销学习成本。在技能获取方面，Voyager、Agent Workflow Memory和ExpeL等系统尝试从交互轨迹中自动提取可复用知识，如可执行代码、工作流或自然语言见解。但这些方法存在关键缺陷：它们主要从交互轨迹中派生自由形式的知识，难以验证技能质量，也难以归因失败原因。此外，现有的Agent Skills规范（如SKILL.md）虽然提供了可移植的技能载体，但大规模分析显示其编写存在不一致性，难以大规模创建高质量技能。前人工作未能解决的核心问题是：如何从静态、版...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 Autonomous ML research agents 的进展主要来自更强的 LLM backbone 和更精细的 harness 工程，但作者观察到这些 agents 在实际 ML 研究任务中仍频繁陷入 trial-and-error 的泥潭——错误配置运行、误用 package API、选择不当的实验设置——即使 backbone 推理能力足够，也往往在耗尽 budget 后才暴露问题。这种失败模式指向一个被忽视的缺口：agents 缺乏将领域方法转化为可执行操作的 know-how，即知道\"用什么方法\"却不清楚\"如何正确使用它\"。现有改进路径无法填补这一缺口：backbone 的 prior 广泛但固定，harness 控制流程但不携带 domain content；而从 agent experience 中提取可重用知识的方法（如 Voyager、ExpeL）因依赖 interaction traces 而难以验证和归因。与此同时，作者注意到这种 operational knowledge 实际上大量存在于 repositories 和 papers 中，只是以人类读者为目标、且体量过大而无法在任务期间直接加载。Agent Skills specification 的出现提供了一个关键线索：skills 作为以 SKILL.md 为中心的 artifact，可通过 progressive disclosure 让 agent 持有大量知识却只加载当前所需部分。由此，作者将问题重构为如何自动且大规模地将 declarative sources 蒸馏为 compact、verified、agent-facing 的 operational knowledge，并在不改变 model 和 harness 的前提下作为独立的知识层注入 agent，从而将 unguided trial-and-error 转化为 skill-guided execution。 ### § 4 核心 Intuition 先前的 autonomous... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：## **Repo-To-Skill: Distilling GitHub Repositories Into AI4AI Skills** **Jianlyu Chen**[1] _[,]_[2] _[†‡]_ **, Yuyang Hu**[1] _[,]_[3] _[†‡]_ **, Hongjin Qian**[1] _[†]_ **, Jiawei Liu**[2] _[†]_ **, Wenqing Wei**[1] _[,]_[2] _[†‡]_ **, Xiaolong Chen**[2] **Defu Lian**[2] _[∗]_ **, Zhicheng Dou**[3] _[∗]_ **, Chaozhuo Li**[1] **, Qiwei Ye**[1] **, Zheng Liu**[1] _[,]_[4] _[∗]_ \u003E 1Beijing Academy of Artificial Intelligence, 2University of Science and Technology of China, \u003E 3Renmin University of China, 4Hong Kong Polytechnic University \u003E _†_ Equal Contribution, _‡_ Work done during an internship at BAAI, _∗_ Corresponding authors Autonomous agents are beginning to carry out machine-learning (ML) research end to end. These agents combine a model backbone with a harness for planning, execution, memory, and verification, but this architecture still leaves domain-specific know-how outside the...", "additional_insights": "### § 8 Take-aways\n\n论文将 autonomous ML research agent 的架构从传统的 \"model + harness\" 二元结构扩展为三元结构，新增的第三层是 operational knowledge——即区分\"知道一个方法\"与\"能让它跑通\"的领域专有 know-how。这层知识以 skill 为载体，每个 skill 由三层组成：SKILL.md 作为知识接口提供使用策略，references/ 作为知识基底存放深层文档，scripts/ 作为执行接口封装可调用代码，三者共同实现 progressive disclosure，使 agent 能持有数千个 skill 但仅加载当前任务所需的少数几个。DisCo agent 通过两种互补的 distillation 形式生产 skill：task-agnostic distillation 从 1,000 个常用 ML repository 中预先蒸馏出 5,000+ 个可复用 skill，构成 AREX-Skill Library；task-oriented distillation 在给定具体任务时按需搜索证据并生成该任务所需的 skill。所有 skill 必须通过 verification 阶段（assertion-backed cases、native checks、static gates）才能进入 library，未解决的 gap 被记录在 construction record 中而非隐藏。在固定 GPT-5.5 backbone、Codex harness 和 matched running budget 的条件下，skill-equipped agent 在 MLE-bench 上提升 134.3%（High 难度任务从 13.33% 升至 62.22%），在 PaperBench 上提升 34.4%，在 FrontierCS 上提升 9.2%，在 PassNet 上提升 14.0%。增益在高难度任务和低 baseline 任务上最为显著，表明 skill 的价值在于引导 agent 避开无效的 trial-and-error 探索，直接进入解空间的可行区域。论文还发现 skill 增益与额外 token 消耗基本不相关（Spearman's ρ ≈ 0.01），说明提升来自知识本身而非单纯的资源扩展。PaperBench 上有 2/20 个任务出现回退，论文将其归因于 retrieval precision failure——当任务依赖狭窄的 idiosyncratic 实现选择时，检索到的 skill 可能将 agent 引离其本可自行发现的正确路径。\n\n### § 9 最脆弱的假设\n\n论文最脆弱的核心假设是：task-oriented distillation 中，construction 阶段产出的 skill 包含的是可跨任务复用的 operational knowledge，而非对特定 benchmark 任务的隐式 partial solution。这一假设在 MLE-bench 实验中面临最大风险。在 MLE-bench 的 task-oriented distillation 中，DisCo 对每个 competition 执行 web search、task decomposition 和 diagnostic trials，产出 descriptive skill graph，随后在 running 阶段让 Codex 基于 skill 完成提交。论文明确将 construction budget（≤24 GPU-hours）与 running budget（≤24 GPU-hours）分离，并声称 \"the one-time construction budget is separate and is not counted in either run-time condition\"。但问题在于：construction 阶段的 diagnostic trials 本质上是在实际 competition 上进行的探索性实验，agent 在此过程中积累的 task-specific insight（如哪个 pretrained model 更适合该数据集、哪种 preprocessing 策略有效）被编码进 skill，而 no-skill baseline 在 running 阶段需要从零开始获取这些 insight。这意味着 skill-equipped agent 实际上获得了双倍的有效探索时间，而非仅仅获得了\"operational knowledge\"。论文提供的反驳证据是：skill 被设计为 descriptive only（不含可执行脚本），且排除了 competition-specific content。但 descriptive skill 仍然可以记录\"对该 competition 有效的建模选择\"，这本质上是一种 task-specific 的 partial solution 伪装成 operational knowledge。论文缺少一个关键对照实验：用相同总预算（48 GPU-hours）运行 no-skill agent，看其是否能通过更长的探索时间达到类似性能。如果 no-skill agent 在 48 GPU-hours 下也能接近 72.89% 的 Any-Medal score，则 skill 的增益主要来自额外计算而非知识复用，核心 claim 将被严重削弱。FrontierCS 和 PassNet 的结果部分缓解了这一担忧——它们使用的是 benchmark-level shared skill graph 而非 per-task skill，增益仍然存在（+9.2% 和 +14.0%），但幅度远小于 MLE-bench 的 +134.3%，这恰恰暗示 MLE-bench 的大幅增益中可能有相当部分来自 per-task construction 的额外探索而非纯知识复用。\n\n### § 10 最小复现实验\n\n在一周时间内，最可行的最小实验是验证论文在 FrontierCS 上的核心 claim：一个 benchmark-level 的 shared skill graph 能否在不改变 model 和 harness 的条件下提升 agent 在 open-ended CS 问题上的表现。选择 FrontierCS 而非 MLE-bench 的原因是：FrontierCS 使用单个共享 skill graph，避免了 per-task distillation 的额外预算争议，且其 skill graph 结构简单（9 个节点、42 条有向边），可以手动构建。具体方案如下：从 FrontierCS Agent Track 的 188 个任务中抽取 20 个任务作为评估集。手动编写一个简化的 recovery-oriented skill graph，包含一个 entry skill（作为 recovery router）和 3-4 个 component skill，覆盖论文中提到的核心模块：modeling/method selection、implementation、validation/checker construction、plateau escape。每个 skill 用 SKILL.md 格式编写，包含 activation conditions、procedures 和 rejection criteria，不附带 scripts（与论文的 descriptive-only 设计一致）。使用 GPT-4o 或 Claude 3.5 Sonnet 作为 backbone（GPT-5.5 不可用时的合理替代），搭配一个简单的 coding agent harness（如 SWE-agent 或直接用 API 调用循环），在 with-skill 和 without-skill 两种条件下各运行 20 个任务，每个任务限制 2 小时预算。测量每个任务的 best score（与 FrontierCS 的 retained score 定义一致），计算 paired difference 的均值和 95% bootstrap confidence interval。如果 with-skill 条件的均值提升 ≥3 分且 confidence interval 不跨零，则支持论文的 claim；如果提升 \u003C1 分或 confidence interval 跨零，则反驳 claim。关键控制变量是：两种条件使用相同的 backbone、相同的 harness、相同的 per-task budget，且 skill graph 在所有任务间共享不修改——这确保唯一变量是 operational knowledge 的有无。", "research_value": "### § 11 最强反例设计\n\n要对该论文的核心 claim 构成最致命的打击，我会在 MLE-bench 上设计一个“计算预算对齐与对抗性分布偏移”的联合反例实验。论文最大的防御盾牌是将 construction budget 与 running budget 物理隔离，从而声称增益纯粹来自 operational knowledge 而非额外计算；而其最脆弱的实证软肋在于，distilled skill 本质上是对“主流常规做法”的提取，这在常规任务上是助力，但在需要反直觉解法的任务上则是毒药。首先，我会在完全对齐的总预算下运行 no-skill baseline：给予 no-skill agent 48 GPU-hours（等同于 skill-equipped agent 的 24h construction + 24h running），如果其 Any-Medal score 能够逼近或达到 72.89%，则直接证明论文在 MLE-bench 上的 134.3% 巨大增益主要是“双倍探索时间”的产物，而非知识复用。其次，为了击穿“skill 引导 agent 进入解空间可行区域”这一核心假设，我会从 MLE-bench 中筛选或构造一批“对抗性任务”：这些任务的底层数据分布或评估指标经过特殊设计，使得标准的 ML pipeline（如标准归一化、常规 pretrained model 微调、传统 loss function）会遭遇灾难性失败或陷入局部最优，而真正的解法需要违背常规的 operational knowledge（例如保留极端异常值、使用非标准的 asymmetric loss、或反向冻结特定层）。在这批对抗性任务上对比 with-skill 和 without-skill agent 的表现，如果 with-skill agent 因为过度依赖检索到的 descriptive skill graph，在错误的解空间内死磕（即 skill 锁死了探索方向）而导致成功率显著低于从零开始探索的 no-skill agent，就能确凿证明 distilled skill 在“非标准前沿研究”场景下不仅无益，反而会可预测地引发系统性失败。这一反例直接挑战了方法的泛化边界：它只能解决“已知如何做”的任务，却可能扼杀解决“未知如何做”任务所需的探索能力。\n\n### § 12 Follow-up Research Idea\n\n基于该论文将 operational knowledge 静态化为 SKILL.md 的局限，我提出一个全新的研究方向：**Environment-Driven Skill Co-evolution（环境驱动的技能协同进化）**。该想法的驱动局限在于：当前的 distillation 过程假设 ML 生态系统是静态的，但真实的 libraries（如 PyTorch, HuggingFace）版本迭代极快，API 的 deprecation 和 breaking changes 会使静态 skill 中的 scripts/ 迅速失效；更深层的问题是，静态 skill 无法捕获 agent 在特定硬件环境或数据分布下产生的“隐性环境依赖”。为了解决这个问题，我们可以借鉴编译器优化中的 Adaptive Query Optimization 和软件工程中的 Continuous Integration (CI) 理念，将 skill 从“静态文档”重构为“带有执行反馈环路的可执行状态机”。具体而言，不再单纯依赖 LLM 从 repo 中一次性提取 skill，而是赋予 agent 一种“skill patching”机制：当 agent 在执行任务时遇到 API 失败或环境不匹配，它不仅需要修复当前代码，还必须触发一个 backward pass，利用执行环境的错误 traceback 和系统状态自动更新底层 skill 的 scripts/ 和 SKILL.md 中的 constraints。第一个实验将设计一个“API Drift Stress-test”：构建一个包含 50 个核心 ML 任务的 benchmark，但在执行环境中故意注入模拟的“未来版本 API 变更”（如修改函数签名、改变默认参数行为）。对比三种 agent：(1) 无 skill 的 baseline，(2) 使用论文中静态 AREX-Skill Library 的 agent，(3) 具备 Skill Co-evolution 能力的 agent。测量指标不仅是任务成功率，还包括“跨任务的知识修复摊销率”——即第 1 个任务修复的 API 适配能否自动沉淀为 skill 更新，从而让第 2 到第 50 个任务零成本通过。这一提议与 Voyager 等基于轨迹的技能提取有本质区别：后者仅记录成功经验，而本提议强调在 non-stationary environment 中对 skill 进行失败驱动的持续维护，将 operational knowledge 从“被蒸馏的静态产物”转变为“与环境共同进化的活体资产”。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jianlyu Chen\", \"affiliations\": [1, 2], \"markers\": [\"†\", \"‡\"]},\n    {\"name\": \"Yuyang Hu\", \"affiliations\": [1, 3], \"markers\": [\"†\", \"‡\"]},\n    {\"name\": \"Hongjin Qian\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Jiawei Liu\", \"affiliations\": [2], \"markers\": [\"†\"]},\n    {\"name\": \"Wenqing Wei\", \"affiliations\": [1, 2], \"markers\": [\"†\", \"‡\"]},\n    {\"name\": \"Xiaolong Chen\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Defu Lian\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Zhicheng Dou\", \"affiliations\": [3], \"markers\": [\"*\"]},\n    {\"name\": \"Chaozhuo Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Qiwei Ye\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zheng Liu\", \"affiliations\": [1, 4], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"BAAI\"},\n    {\"id\": 2, \"name\": \"USTC\"},\n    {\"id\": 3, \"name\": \"RUC\"},\n    {\"id\": 4, \"name\": \"PolyU\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"†\", \"text\": \"Equal Contribution\"},\n    {\"marker\": \"‡\", \"text\": \"Work done during an internship at BAAI\"},\n    {\"marker\": \"*\", \"text\": \"Corresponding authors\"}\n  ]\n}\n```", "summary_translation": "自主智能体正开始端到端地开展机器学习（ML）研究。这些智能体将 model backbone 与用于规划、执行、记忆和验证的 harness 结合起来，但这种架构仍然将特定领域的 know-how 置于智能体之外。我们将这一缺失的层称为 operational knowledge，即区分了解一种方法与使其发挥作用的 know-how。这种知识在该领域并不缺席。它出现在 repositories 和论文中，但形式是为人类读者编写的，且过于庞大，无法在任务期间加载。一旦被蒸馏为紧凑且经过验证的 skills，这种知识就可以跨任务重用，而不是在每次运行期间重新发现。我们提出了 DisCo，一个由 skill 驱动的研究型智能体，它能够创建 skills 并在研究过程中使用它们。其蒸馏以两种互补的形式运行：task-agnostic，将领域内广泛使用的 repositories 浓缩为可重用的 skills；以及 task-oriented，生成具体任务所需的 skills。前者应用于整个开源生态系统，生成了 AREX-Skill Library，其中包含从 1,000 个广泛使用的 ML repositories 中蒸馏出的 5,000 多个经过验证的 skills，并被组织为 20 个领域和 178 个 capability families。在 GPT-5.5 backbone、research harness 和下游执行预算保持固定的条件下，配备 skills 的研究型智能体在 MLE-bench 上的得分比没有 skills 的同一智能体高出 134.3%，在 PaperBench 上高出 34.4%，在 FrontierCS 上高出 9.2%，在 PassNet 上高出 14.0%。这些提升来自于在该固定设置下添加了蒸馏后的 operating context。"}, {"title": "Post-Training Language Models for Gold-Medal Performance in Coding Competitions", "arxiv_id": "2609.02849", "authors": "Aleksander Ficek, Sean Narenthiran, Mehrzad Samadi, Somshubra Majumdar, Boris Ginsburg", "summary": "Competitive programming has become a key test of large language model reasoning, with international competitions such as IOI and ICPC representing its most challenging settings. We present an end-to-end specialization pipeline combining large-scale problem curation, synthetic reasoning traces, supervised fine-tuning (SFT), and reinforcement learning (RL). Using 22,000 curated problems, we train Nemotron-3-Nano-CC (30B-A3B) with SFT and RL and Nemotron-3-Ultra-CC (550B-A55B) with SFT alone. We further introduce GenCorrect, a feedback-driven test-time compute strategy that iteratively generates, evaluates, and refines diverse solutions. On IOI 2025, Nano-CC improves from 130 points to 291 after post-training and to 468 with GenCorrect, exceeding the gold threshold of 438.3 while Ultra-CC reaches 502. Guided by these results, we develop a competition-specific Ultra-CC system and evaluate it prospectively during IOI 2026. Under the same time, internet-access, and submission constraints as human contestants, it scores 535.4 out of 600, exceeding both the gold threshold of 361.12 and the top human score of 498.27. To our knowledge, this is the first AI system to outscore the highest-scoring human contestant on an IOI problem set.", "category": "cs.CL", "cluster": "Tool Use, Skills \u0026 Code Generation", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是提出了一种端到端的模型特化流水线（结合SFT和RL）以及一种名为GenCorrect的反馈驱动测试时计算策略。GenCorrect通过迭代地生成、评估和精炼多样化的解决方案来实现自我修正和迭代改进。根据筛选标准，如果论文研究 test-time scaling、推理策略搜索，并且核心机制是 self-improving / iterative improvement / LLMs improving LLMs，即使对象是 test-time reasoning 或模型训练，也应优先保留。论文中的后训练方法和GenCorrect策略明确体现了“LLMs Improving LLMs”和“迭代改进”的演化机制，符合研究焦点中关于自我演化和测试时优化的保留条件。因此，尽管摘要未频繁直接使用“Agent”一词，但其核心机制属于智能体自我完善和演化的相关前沿，应予保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文解决的核心问题是：如何构建一个端到端的 competitive programming 专用化 pipeline，使 large language models (LLMs) 在 IOI 和 ICPC 等国际顶级编程竞赛中达到金牌甚至超越人类冠军的水平，同时保持系统的可复现性与组件可分析性。具体而言，作者希望厘清 synthetic reasoning data、supervised fine-tuning (SFT)、reinforcement learning (RL)、model scale 与 test-time compute 各自对竞赛性能的边际贡献，并在此基础上构建一个能在真实竞赛约束（相同时间、相同提交限制、无互联网访问）下运行的完整系统。这个问题的重要性在于，competitive programming 已成为评估 LLM reasoning 能力的关键 benchmark——它要求模型综合新算法、处理复杂约束、在严格的时间和内存限制下通过 hidden tests，因此其表现是模型推理与编码能力的强指标。然而，此前达到金牌水平的系统（如 OpenAI 的 o1-ioi/o3、Google DeepMind 的 Gemini）大多是封闭的、依赖专用模型，或将训练数据、post-training、model scale 与 inference-time compute 的变更混在一起，导致各组件的贡献难以剥离。解决这一问题不仅能推动可复现的 reasoning 研究生态，还能为如何高效地将通用 base model 专用化到高难度推理任务提供方法论指导。作者最终在 IOI 2026 上实现了 535.4/600 的成绩，超越金牌阈值 361.12 和人类最高分 498.27，据称是首个在 IOI problem set 上超越人类最高分选手的 AI 系统。\n\n### § 2 前人工作与不足\n\nCompetitive programming 作为 LLM 评测领域的相关工作经历了从基础方法到金牌级系统的演进。AlphaCode (Li et al., 2022) 首次将 domain-specific training 与 large-scale sampling、filtering 及 behavioral clustering 结合，确立了\"生成-筛选\"范式；AlphaCode 2 (Leblond et al., 2023) 在此基础上引入更强的模型、额外 fine-tuning 和 learned reranking。LiveCodeBench 与 LiveCodeBench Pro (Jain et al., 2024; Zheng et al., 2025) 则提供了时间分离和 olympiad 级别的评测基准。近期，多个系统报告了 medal-level 表现：OpenAI 的 o1-ioi 结合 coding-focused RL 与手工设计的 inference pipeline 在 IOI 2024 上达到金牌，o3 在官方提交限制下超越金牌阈值 (OpenAI et al., 2025)；Google DeepMind 的 Gemini 在 ICPC 2025 World Finals 达到金牌水平 (Lin \u0026 Cheng, 2025)；在 open-weight 方面，GenCluster (Samadi et al., 2026) 首次用开源模型通过 large-scale generation 和 selection 实现 IOI 金牌，DeepSeek-V3.2-Speciale (DeepSeek-AI, 2025) 在 IOI 2025 和 ICPC 2025 上报告金牌，Nemotron-Cascade 2 (Yang et al., 2026) 以仅 3B active parameters 达到金牌级表现。\n\n然而，这些前人工作存在几个关键不足。首先，多数金牌级系统是封闭的或依赖专用模型，且将 training data、post-training、model scale 和 inference-time compute 的改进捆绑在一起，使得各组件的独立贡献无法被分析——这不是简单的\"没有考虑\"，而是因为这些系统以工程目标为导向追求最高分，缺乏 controlled ablation 的学术动机。其次，OpenAI 的 o1-ioi 使用了 hand-engineered inference pipeline，其方法细节未完全公开，难以复现和扩展。第三，在 test-time compute 方面，此前的工作如 o1-ioi 和 GenCluster 将问题按 subtask 拆分后分别处理，需要大量 per-subtask generations，而本文的 GenCorrect 将所有 subtasks 同时提供给模型让其自主决策，显著减少了每题所需的 generation 数量。第四，在 self-correction 方面，Huang et al. (2024) 已证明没有 external feedback 的 self-correction 是不可靠的，但此前的 iterative refinement 方法（如 AlphaCodium (Ridnik et al., 2024)）未充分利用 execution-grounded feedback 来指导后续生成。最后，此前没有系统在 IOI 的真实竞赛环境下（相同时间、提交平台和互联网限制）与人类选手进行 prospective 比较——已有的 IOI 结果多为 retrospective evaluation，在问题公开后用不受限的 compute 和时间运行，无法反映真实的竞赛条件下的相对表现。本文通过在 IOI 2026 竞赛期间进行 live evaluation，填补了这一评测缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n从已有背景出发，作者面对的是一个工程与科学交织的问题：竞赛编程已被确立为评估 LLM reasoning 的严苛 benchmark，IOI 和 ICPC 代表了最困难的设置，但现有系统（AlphaCode、o1-ioi、GenCluster、DeepSeek-V3.2-Speciale）往往是封闭的或混合了多种改进因素——训练数据、post-training、模型规模、inference-time compute——使得各组件的贡献难以隔离。作者可能从 AlphaCode 的经验中确认，大规模采样结合 behavior-based clustering 和过滤是竞赛编程的基础范式，但 IOI 的 subtask 评分体系和 50 次提交限制意味着单纯增加采样量效率有限——每次提交都必须携带信息增量。\n\n与此同时，OpenCodeReasoning 已证明 synthetic reasoning traces 对竞赛编程有效，DeepSeek-R1 和 DAPO 确立了使用 verifiable rewards 的可扩展 RL recipe。但作者很可能注意到一个关键的失败模式：RL 在长达 255K tokens 的轨迹和稀疏 binary reward 下面临严重的 long-horizon credit-assignment 问题——一个 problem 只有在 rollout group 同时包含成功和失败解时才提供相对学习信号，这意味着 RL 只能触及 model frontier 附近的能力，收益远不如 SFT。此外，Huang et al. (2024) 已表明 self-correction 在没有外部 feedback 时不可靠，这促使作者将 execution-grounded feedback 纳入 test-time refinement 而非依赖模型自我批评。\n\n从 GenCluster 和 Nemotron-Cascade 2 的工作中，作者可能进一步观察到 test-time compute 的扩展可以比扩展模型参数更有效，但如何将 evaluator feedback 系统性地融入迭代修正过程——而非仅做一次性的大规模生成和选择——仍是一个未充分探索的方向。IOI 的 subtask 评分天然提供了一个结构化的 feedback signal：每轮提交后，模型可以知道哪些 subtask 已解决、哪些仍有 gap，从而在下一轮中针对性地改进。这比 ICPC 的 binary feedback 提供了更丰富的 refinement 信号。\n\n基于这些观察，作者的思考路径逐渐成形：首先通过大规模 problem curation 和 synthetic reasoning traces 的 SFT 建立强大的 base capability，然后尝试用 executable-reward RL 进一步提升但预期收益有限。关键创新在 test-time compute：设计一个闭环策略 GenCorrect，每轮生成大量候选解，通过 token-shingle clustering 选择多样化的子集提交，利用 evaluator 的 subtask feedback 累积最佳成绩并指导下一轮生成，从而在有限提交预算内最大化信息增益。作者还可能从初步实验中注意到一个重要的 scaling 现象：更强的 base model 在 Score@1 上优势微小，但在 Score@200 和迭代修正中优势会显著放大——这暗示对于竞赛部署，用有限 SFT 适应最强的 base model 比对小模型进行大量 post-training 更有效，因为 test-time compute 的收益与 model capability 呈超线性关系。\n\n### § 4 核心 Intuition\n\n竞赛编程的金牌级性能来自 SFT 建立的基础能力与 feedback-driven test-time compute 的协同：SFT 通过 distill 强 teacher 的 reasoning traces 提供最大的单样本提升，而 GenCorrect 通过闭环迭代将 200 次并行采样的信息浓缩到 50 次提交中，利用 evaluator 的 subtask feedback 逐步定位并填补 gap。关键洞察是，更强的 base model 在单样本上优势微小，但在并行采样和迭代修正中优势会显著放大——因此用有限 SFT 适应强模型比大量 post-training 小模型更有效，因为 test-time compute 的收益与 model capability 呈超线性关系。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Post-Training Language Models for Gold-Medal Performance in Coding Competitions》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 本文解决的核心问题是：如何构建一个端到端的 competitive programming 专用化 pipeline，使 large language models (LLMs) 在 IOI 和 ICPC 等国际顶级编程竞赛中达到金牌甚至超越人类冠军的水平，同时保持系统的可复现性与组件可分析性。具体而言，作者希望厘清 synthetic reasoning data、supervised fine-tuning (SFT)、reinforcement learning (RL)、model scale 与 test-time compute 各自对竞赛性能的边际贡献，并在此基础上构建一个能在真实竞赛约束（相同时间、相同提交限制、无互联网访问）下运行的完整系统。这个问题的重要性在于，competitive programming 已成为评估 LLM reasoning 能力的关键 benchmark——它要求模型综合新算法、处理复杂约束、在严格的时间和内存限制下通过 hidden tests，因此其表现是模型推理与编码能力的强指标。然而，此前达到金牌水平的系统（如 OpenAI 的 o1-ioi/o3、Google DeepMind 的 Gemini）大多是封闭的、依赖专用模型，或将训练数据、post-training、model scale 与 inference-time compute 的变更混在一起，导致各组件的贡献难以剥离。解决这一问题不仅能推动可复现的 reasoning 研究生态，还能为如何高效地将通用 base model 专用化到高难度推理任务提供方法论指导。作者最终在 IOI 2026 上实现了 535.4/600 的成绩，超越金牌阈值 361.12 和人类最高分 498.27，据称是首个在 IOI problem set 上超越人类最高分选手的 AI 系统。 ### § 2 前人工作与不足 Competitive programming 作为 LLM 评测领域的相关工作经历了从基础方法到金牌级系统的演进。AlphaC...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 从已有背景出发，作者面对的是一个工程与科学交织的问题：竞赛编程已被确立为评估 LLM reasoning 的严苛 benchmark，IOI 和 ICPC 代表了最困难的设置，但现有系统（AlphaCode、o1-ioi、GenCluster、DeepSeek-V3.2-Speciale）往往是封闭的或混合了多种改进因素——训练数据、post-training、模型规模、inference-time compute——使得各组件的贡献难以隔离。作者可能从 AlphaCode 的经验中确认，大规模采样结合 behavior-based clustering 和过滤是竞赛编程的基础范式，但 IOI 的 subtask 评分体系和 50 次提交限制意味着单纯增加采样量效率有限——每次提交都必须携带信息增量。 与此同时，OpenCodeReasoning 已证明 synthetic reasoning traces 对竞赛编程有效，DeepSeek-R1 和 DAPO 确立了使用 verifiable rewards 的可扩展 RL recipe。但作者很可能注意到一个关键的失败模式：RL 在长达 255K tokens 的轨迹和稀疏 binary reward 下面临严重的 long-horizon credit-assignment 问题——一个 problem 只有在 rollout group 同时包含成功和失败解时才提供相对学习信号，这意味着 RL 只能触及 model frontier 附近的能力，收益远不如 SFT。此外，Huang et al. (2024) 已表明 self-correction 在没有外部 feedback 时不可靠，这促使作者将 execution-grounded feedback 纳入 test-time refinement 而非依赖模型自我批评。 从 GenCluster 和 Nemotron-Cascade 2 的工作中，作者可能进一步观察到 test-time compute 的扩展可以比扩展... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：2026-9-3 **==\u003E picture [91 x 20] intentionally omitted \u003C==** ## **Post-Training Language Models for Gold-Medal Performance in Coding Competitions** **Aleksander Ficek**[∗] **, Sean Narenthiran**[∗] **, Mehrzad Samadi, Somshubra Majumdar, Boris Ginsburg** **Abstract.** Competitive programming has become a key test of large language model reasoning, with international competitions such as IOI and ICPC representing its most challenging settings. We present an end-to-end specialization pipeline combining large-scale problem curation, synthetic reasoning traces, supervised fine-tuning (SFT), and reinforcement learning (RL). Using 22,000 curated problems, we train Nemotron-3-Nano-CC (30B-A3B) with SFT and RL and Nemotron-3-Ultra-CC (550B-A55B) with SFT alone. We further introduce GenCorrect, a feedback-driven test-time compute strategy that iteratively generates, evaluates, and refines diverse...", "additional_insights": "### § 8 Take-aways\n本文提出了一套端到端的竞赛编程模型特化流水线，结合了大规模问题筛选、合成推理轨迹、SFT、RL以及迭代式的测试时计算策略。在训练阶段，SFT贡献了最显著的单样本性能提升，而基于可执行奖励的RL仅带来边际增益，主要作用于模型能力前沿附近的问题。在推理阶段，GenCorrect通过大规模并行采样、基于行为特征的聚类筛选以及利用评估器subtask分数反馈进行迭代精炼，能够将性能进一步大幅推高，甚至使仅含3B活跃参数的小模型达到IOI金牌水平。在IOI 2026真实比赛环境下，结合GLM-5.2的SFT数据、最后一轮1000候选解的执行基础选择策略以及NVFP4量化，Competition Ultra-CC以535.4分超越人类最高分，成为首个在IOI赛题上击败人类冠军的AI系统。\n\n### § 9 最脆弱的假设\n本文最核心且脆弱的假设是：模型能够有效利用GenCorrect提供的subtask分数反馈及历史候选解作为上下文，准确定位代码缺陷并生成实质上更优的修正解法。如果模型缺乏根据稀疏的执行反馈进行有效自我纠正的能力，GenCorrect的迭代过程将退化为单纯的多次随机采样，无法实现跨轮次的性能累积。在实际中，竞赛编程的subtask分数仅指示哪些测试用例未通过，并不提供具体的错误位置或算法逻辑缺陷，模型极易陷入表面修改或无法将测试失败与深层算法错误建立因果联系。论文中ICPC 2025的实验结果侧面印证了这一风险：由于ICPC仅提供二元反馈，模型比在提供subtask分数的IOI上更快达到性能饱和，表明反馈质量直接决定了迭代精炼的上限。尽管论文展示了分数随轮次上升的曲线，但缺少对模型具体如何利用反馈进行错误归因的深入分析，也未验证在反馈被刻意污染或随机化时性能是否会崩溃，这使得“反馈驱动精炼”的核心机制缺乏严格的因果证据支撑。\n\n### § 10 最小复现实验\n在一周时间内，可以设计一个最小实验来验证GenCorrect中“评估器反馈驱动迭代精炼”的有效性。使用LiveCodeBench Pro中带有subtask划分的50个问题作为数据集，选用一个中等规模的开源基础模型（如Qwen2.5-Coder-7B-Instruct）以避免复杂的部署成本。实现一个简化版的GenCorrect流程：第一轮仅根据问题陈述生成200个解，聚类选出10个提交并记录subtask分数；第二轮将问题陈述、前一轮的10个候选解及其分数、当前最高分作为上下文输入模型，生成200个新解并再次提交，重复此过程3轮。测量指标为各问题在3轮迭代后的最高累计subtask得分。作为对照，设置一个“无反馈基线”，即在总生成量相同（600个解）的情况下，不提供任何历史解和分数反馈，仅进行独立并行采样并取最优解。如果“反馈迭代”组的平均得分显著高于“无反馈基线”，则支持论文关于GenCorrect能有效利用反馈进行精炼的claim；若两者得分无显著差异，则反驳了反馈机制的核心作用，证明性能提升仅源于采样规模的扩大。", "research_value": "### § 11 最强反例设计\n为了有力地反驳本文的核心 claim，我会设计一个“毒化反馈与计算量解耦”的对照实验，旨在证明 GenCorrect 的性能提升仅仅源于 test-time compute 的增加，而非模型真正利用 subtask 分数进行了有效的自我纠正。具体而言，在相同的总生成预算下（例如每题 600 个候选解），我会在迭代精炼阶段向模型注入随机化或刻意颠倒的 subtask 分数反馈。如果在这种“毒化反馈”条件下，模型的性能曲线依然随轮次上升，或者最终得分与真实反馈组无显著差异，这将直接证明模型并未建立“测试失败与算法错误”之间的因果联系，所谓的迭代精炼退化为了一种昂贵的变体采样。此外，针对需要深层算法重构的难题（如动态规划状态转移错误或图论连通性逻辑缺陷），我会分析模型在迭代过程中的代码 diff。若实验显示模型仅停留在表面修改（如调整边界条件、重命名变量）而无法触及核心算法逻辑，且在 2-3 轮后性能出现断崖式饱和，则可预测该方法在缺乏细粒度调试信息的真实复杂工程场景中会彻底失效，从而推翻其作为通用推理增强机制的普适性。\n\n### § 12 Follow-up Research Idea\n本文的核心局限在于，稀疏的 subtask 分数无法为 LLM 提供建立“测试失败与深层算法错误”之间因果联系所需的细粒度信息，导致 self-correction 极易陷入表面修改。这一未满足的需求驱动了一个全新的研究方向：从“基于执行分数的迭代精炼”转向“基于形式化反例引导的因果纠错”。我们可以借鉴形式化验证与符号执行领域的工具（如 Z3 solver 或 KLEE），将其与 LLM 的推理过程深度融合。具体而言，当模型生成的代码未通过 hidden tests 时，系统不直接返回二元或 subtask 分数，而是利用符号执行器自动生成一个最小化的反例输入，并提取出导致失败的精确变量状态与执行路径约束。第一个实验可以设计为：在 LiveCodeBench Pro 的复杂算法题上，对比标准 GenCorrect 与“Symbolic-Guided Correct”。后者在每轮迭代中，将符号执行器生成的最小反例及路径约束作为上下文注入模型，引导其进行因果归因。该实验将验证，提供可解释的因果反例是否能打破单纯增加采样量带来的性能瓶颈，从而将 LLM 的代码修正从盲目的随机搜索转变为有针对性的逻辑修复，这与现有的基于执行结果的黑盒反馈机制形成了本质区别。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Aleksander Ficek\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Sean Narenthiran\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Mehrzad Samadi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Somshubra Majumdar\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Boris Ginsburg\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"NVIDIA\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution.\"},\n    {\"marker\": \"†\", \"text\": \"Our system was not an official IOI contestant and the run was not supervised by IOI. Therefore, its score was not included in the official rankings and the evaluation is reported as an unofficial, unsupervised benchmark.\"},\n    {\"marker\": \"‡\", \"text\": \"https://github.com/NVIDIA-NeMo/Skills\"}\n  ]\n}\n```", "summary_translation": "竞赛编程已成为大语言模型推理的关键测试，而 IOI 和 ICPC 等国际竞
