53", "authors": "Yuanyi Song, Yukai Wang, Xinbei Ma, Zhihui Fu, Jianghao Lin, Weiwen Liu, Jun Wang, Huarong Deng, Yong Yu, Weinan Zhang", "summary": "Long-term memory is essential for LLM-based agents operating over extended interactions. Existing memory systems primarily update memory when new information arrives, treating retrieval as the endpoint of memory access rather than a driver of memory evolution. Consequently, retrieval feedback is rarely exploited to reorganize memory for future access continuously. Moreover, most existing approaches rely on predefined memory structures together with fixed retrieval pipelines, limiting the agent's ability to organize and evolve its own memory autonomously. Inspired by memory reconsolidation in cognitive neuroscience, we propose \\textbf{REALM}, a \\textbf{r}econsolidation-\\textbf{e}volution \\textbf{a}gentic \\textbf{l}ong-term \\textbf{m}emory framework. It models long-term memory as a continual lifecycle by autonomously organizing memories into a heterogeneous cognitive graph, retrieving evidence via adaptively composed graph-search atoms, and continually reconsolidating memories based on retrieval feedback. REALM achieves an average accuracy of 75.97\\% on LoCoMo and 65.11\\% on LongMemEval, outperforming the strongest baselines by 7.17 and 1.31 points respectively. Ablation studies confirm that memory reconsolidation consistently boosts performance, with further analyses revealing that it progressively reorganizes related memory units into more coherent local structures for collective evidence recall and utilization during reasoning. These results suggest that retrieval-driven memory reconsolidation provides an effective mechanism for continually evolving long-term memory in LLM agents.", "category": "cs.CL", "cluster": "Memory Systems for Long-Term Agents", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n论文解决的核心问题是：现有大语言模型（LLM）智能体的长期记忆系统仅在接收新信息时更新记忆，将检索视为记忆访问的终点，未能利用检索反馈来持续重组记忆结构。这个问题至关重要，因为在个人助手、长程任务协作等长期交互场景中，智能体必须依赖过去的经验进行未来推理，僵化的记忆结构会严重限制其检索效率和推理质量。引入检索驱动的记忆再巩固机制，能让记忆系统根据实际使用情况自我演化，从而显著提升长期记忆的准确性和适应性。\n\n### § 2 前人工作与不足\n此前，长期记忆系统（如Mem0、Zep和MIRIX）主要遵循前向演化范式，通过预定义的层次结构或知识图谱来组织和检索历史信息。这些方法虽然能积累和提取记忆，但将检索视为被动的终点，记忆更新仅由新输入或时间衰减触发，而非记忆使用本身。这种设计忽略了认知神经科学中的记忆再巩固机制——即被回忆的记忆会进入不稳定状态并重新整合连接。因此，现有方法缺乏在检索后根据反馈动态调整记忆拓扑的能力，导致记忆结构僵化，无法随着使用逐步优化以适应未来的检索需求。", "core_insight": "### § 3 重建作者的思考路径\n\n现有长期记忆系统遵循\"新信息驱动更新\"的前向范式：记忆的添加、合并、遗忘都由新输入触发，检索只是被动提取的终点，检索反馈几乎不被利用。但认知神经科学的记忆再巩固现象表明，被回忆的记忆会进入不稳定状态，连接可被加强、减弱或新建——记忆通过使用而演化，而非一次性存储后保持静态。作者由此推断：检索过程中哪些记忆被共同激活、哪些连接有效，本身就是宝贵的认知反馈，应当反过来驱动记忆结构的重组。同时，预定义结构和固定检索流程限制了智能体自主性，需要让智能体自己决定如何组织和检索记忆。\n\n### § 4 核心直觉\n\n记忆不应只是被动积累新信息，而应通过每次检索的使用反馈主动演化。REALM的核心在于：检索不是终点而是闭环的起点——每次检索后，根据哪些记忆被共同使用、哪些连接帮助了推理，动态加强有效路径、削弱误导路径，使记忆图从初始的语义组织逐步演化为使用感知的认知结构。频繁协同召回的记忆因此形成更紧凑的局部子图，未来检索更高效。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n观察 o_t ─→ [记忆组织] ─→ 认知图 G\n            提取·合并·跳过    节点: entity/event/\n            推理边关系         episode/fact\n                              边: logical/causal/\n                                  hierarchical/associative\n查询 q ─→ [记忆检索] ─→ 证据集 V_q\n          种子定位              │\n          自适应扩展      激活子图 G_q\n          证据聚合              │\n                    答案 + 反馈 f\n                          │\n                          ↓\n                   [记忆再巩固]\n                    强化·弱化·新建边\n                    置信度引导更新\n                          │\n                    更新后 G' ──回路──→ G\n```\n\nREALM 将长期记忆建模为持续演化的闭环生命周期，包含三个阶段。\n\n**记忆组织**（§3.2）：输入新观察 $o_t$、对话摘要 $s_t$ 和近期信息 $c_t$。LLM 提取候选记忆单元，自主分类为 entity、event、episode 或 fact 节点。对每个候选单元检索语义相似和近期邻域节点，LLM 决定 add、merge 或 skip，并推理有向边（类型 ∈ {logical, causal, hierarchical, associative}），输出认知图 $G$。该阶段将插入、合并、遗忘统一为单一整合流程（Algorithm 1）。\n\n**记忆检索**（§3.3）：输入查询 $q$，分三阶段执行。种子定位：LLM 生成参数化检索计划，通过 query、keywords 或 hybrid 匹配定位起始节点。自适应扩展：从种子迭代扩展，每轮评估证据充分性，对前沿节点预测扩展动作（遍历模式、边谓词、时间衰减、路径抑制）并按访问分数评分新节点。证据聚合：全局重排序取 top-$K$ 构成证据集 $V_q$，诱导激活子图 $G_q$（Algorithm 2）。\n\n**记忆再巩固**（§3.4）：输入 $q$、$G_q$ 和任务反馈 $f$。LLM 推断主题结构，识别关键证据节点与误导节点，生成修改决策集（目标节点对、关系类型、操作 add/strengthen/weaken、置信度），通过有界调整公式更新边权重，输出 $G'$ 形成闭环（Algorithm 3）。\n\n### § 6 核心数学推导\n\n论文的数学部分主要是定义和更新规则，而非理论推导。节点 $v = (\\kappa_v, c_v, \\text{des}_v, k_v, t_v)$ 和边 $e_{ij} = (\\kappa_{ij}, \\text{des}_{ij}, w_{ij})$ 将记忆内容与拓扑结构解耦，为后续检索和演化提供结构变量。\n\n访问分数 $s_{\\text{access}}(v) = \\beta \\cdot s_{\\text{sim}} + (1-\\beta) \\cdot w_{ij} \\cdot \\Delta_{\\text{decay}}(t_v)$ 综合语义相似度、关系置信度和时间惩罚。直觉是：一个节点是否值得访问，取决于它与查询的语义相关性、在图中的关系强度、以及时间新鲜度三者的加权组合。\n\n边权重有界更新是核心机制。先计算有界表示 $w_b = \\max(w_{\\min}, \\min(1, w_{ij}))$，再按操作类型更新：strengthen 时 $w_{\\text{new}} = w_b + \\eta c(1 - w_b)$，weaken 时 $w_{\\text{new}} = w_b - \\eta c \\cdot w_b$。关键直觉在于：当权重接近边界（0 或 1）时更新幅度自动趋零，形成饱和效应，防止孤立或重复的检索实例导致拓扑剧烈震荡，保证记忆网络在持续使用中保持稳定。\n\n### § 7 实验设计与结论\n\n**RQ1：REALM 是否优于现有长期记忆系统？** 在 LoCoMo 和 LongMemEval 上与 Mem0、MIRIX、Zep、A-Mem、Nemori、MAGMA 六个基线比较。REALM 在两个基准上均取得最高平均准确率，分别超出最强基线 7.17 和 1.31 个百分点，在多跳推理和时间推理等记忆密集型任务上提升最显著。\n\n**RQ2：记忆再巩固是否有效且对交互顺序鲁棒？** 通过移除再巩固模块的消融实验和随机打乱问题顺序的鲁棒性测试验证。再巩固分别带来 2.01 和 2.13 个百分点的整体提升；在不同随机顺序下性能保持稳定，说明改进来自记忆拓扑本身的优化而非对特定问题序列的过拟合。\n\n**RQ3：REALM 在再巩固前为何已有竞争力？** 分析节点与边类型分布、检索深度和策略选择。异构认知图中各节点类型的图分布与检索分布高度一致（差异 \u003C 1.5 个百分点），无检索偏差；84.87% 的 LoCoMo 证据在种子层直接找到；自适应策略选择略优于固定策略，表明 agent 自主构建的记忆已与检索需求良好对齐。\n\n**RQ4：再巩固如何持续改善未来检索？** 比较拓扑演化前后的检索行为。证据发现率仅提升 3.70% 和 5.41%，但正确回答率提升 20.83% 和 19.23%。这表明再巩固的核心价值不在于扩大可检索空间，而在于持续重组认知图，使检索到的证据更相关、更利于下游推理。", "additional_insights": "### § 8 阅读收获\n现有 LLM Agent 的长期记忆多在新信息到来时单向更新，检索仅作为被动终点。REALM 框架引入记忆再巩固机制，将记忆建模为异构认知图，在检索后根据任务反馈动态调整局部拓扑。实验表明，这种检索驱动的演化主要提升了证据利用率而非发现量，且对问题顺序具有鲁棒性，证明其优化了记忆组织质量而非过拟合特定序列。\n\n### § 9 最脆弱的假设\n核心假设是模型能根据检索反馈准确判断记忆节点的有效性，并据此正确调整拓扑权重。若模型在复杂推理中给出错误反馈，再巩固机制可能强化错误关联路径，导致记忆结构退化。论文通过消融实验证明再巩固整体提升了准确率，但缺少对错误反馈如何影响拓扑演化的分析，这在低准确率场景下可能成为隐患。\n\n### § 10 最小复现实验\n可使用 LoCoMo 数据集验证“再巩固主要提升证据利用率而非发现量”这一结论。实现简化版记忆图与基础图检索模块，在检索后根据答案正确性调整边权重，无需复现完整的自适应策略。测量开启与关闭再巩固时支持性证据的检索比例及最终准确率。若开启后准确率提升幅度显著大于证据发现率的提升，则支持原结论；若两者相近或准确率无改善，则反驳该机制的核心价值。", "research_value": "### § 11 最强反例设计\n最强反例应针对模型错误反馈导致记忆退化的风险。在存在误导信息或复杂多跳推理的场景中，LLM 易给出错误反馈，若据此强化错误关联路径，会导致后续检索陷入错误回音壁。可设计包含陷阱问题的实验，在多轮交互中故意引入误导性证据，观察 REALM 在给出错误反馈后，其拓扑演化是否导致后续查询准确率显著下降，且降幅大于无再巩固机制的基线。这能证明该机制在低准确率场景下会可预测地失败。\n\n### § 12 后续研究设想\n后续研究可探讨如何避免错误反馈污染记忆拓扑。当前机制盲目信任 LLM 的单次反馈调整边权重，长期交互中会积累错误，值得测试的改变是引入不确定性感知的更新，仅当模型对反馈高置信度时才调整权重。首个对照实验可在 LoCoMo 中筛选模型初始回答错误的案例，对比强制执行再巩固与基于置信度阈值决定是否再巩固两种策略。若后者能防止后续相关问题的性能崩塌，则说明引入不确定性感知对维持长期记忆可靠性是必要的。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yuanyi Song\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Yukai Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xinbei Ma\", \"affiliations\": [1, 3], \"markers\": []},\n    {\"name\": \"Zhihui Fu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jianghao Lin\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Weiwen Liu\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Jun Wang\", \"affiliations\": [2], \"markers\": [\"†\"]},\n    {\"name\": \"Huarong Deng\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yong Yu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Weinan Zhang\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"SJTU\"},\n    {\"id\": 2, \"name\": \"OPPO\"},\n    {\"id\": 3, \"name\": \"NUS\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"This work was done during Yuanyi Song's internship at OPPO.\"},\n    {\"marker\": \"†\", \"text\": \"J. Lin, W. Liu, J. Wang and W. Zhang are the corresponding authors.\"}\n  ]\n}\n```", "summary_translation": "长期记忆对于在长时间交互中运行的基于大语言模型（LLM）的智能体至关重要。现有的记忆系统主要在新信息到达时更新记忆，将检索视为记忆访问的终点，而非记忆演化的驱动力。因此，检索反馈极少被用于持续重组记忆以供未来访问。此外，大多数现有方法依赖预定义的记忆结构与固定的检索流程，限制了智能体自主组织和演化自身记忆的能力。受认知神经科学中记忆再巩固（memory reconsolidation，指提取已有记忆使其重新不稳定从而进行修改的过程）的启发，我们提出了 REALM，一个再巩固-演化智能体长期记忆框架。该框架将长期记忆建模为持续的生命周期，通过自主将记忆组织成异构认知图、利用自适应组合的图搜索单元检索证据，并基于检索反馈持续进行记忆再巩固来实现这一目标。REALM 在 LoCoMo 和 LongMemEval 数据集上的平均准确率分别达到 75.97% 和 65.11%，比最强基线高出 7.17 和 1.31 个百分点。消融实验证实，记忆再巩固能持续提升性能，进一步分析表明，它能逐步将相关记忆单元重组为更连贯的局部结构，以便在推理过程中进行证据的集中召回与利用。这些结果表明，检索驱动的记忆再巩固为大语言模型智能体持续演化长期记忆提供了一种有效机制。"}, {"title": "Interactive Memory Learning for Long-Term Conversations", "arxiv_id": "2609.17088", "authors": "Cai Ke, Jiangyue Yan, Han Zhang, Xin Liu, Zike Yuan, Yue Yu, Hui Wang, Ruifeng Xu", "summary": "Recent advancements in large language models have significantly enhanced the capabilities of agents in modeling long-term conversations. Despite these successes, existing approaches typically adopt a static heuristic paradigm, where information is passively archived without adaptive memory valuation. Consequently, these methods fail to self-evolve or align their memory management with evolving user needs. To address this, we propose ICML (InteraCtive Memory Learning), a multi-agent framework that transforms the memory mechanism from a passive archive into a learnable, interactive memory policy. Specifically, we first employ a session synthesis pipeline to generate expert data, facilitating rapid test-time adaptation in unseen scenarios. Building on this, ICML utilizes an online reinforcement learning mechanism where a Planner agent selectively encodes high-value information and a Trigger agent dynamically retrieves it to optimize response quality, whereby the two agents co-evolve through continuous interaction feedback. Crucially, both agents are synchronized through a delayed reward mechanism that propagates future feedback back to earlier storage decisions, ensuring memory policies are precisely aligned with user expectations. Experimental results demonstrate that ICML significantly outperforms strong baselines, exhibiting the unique capability to continuously improve response quality as interactions accumulate.", "category": "cs.CL", "cluster": "Memory Systems for Long-Term Agents", "tags": ["cs.CL"], "filter_reason": "这篇论文符合您的研究范围。论文的核心贡献是提出了一个名为 ICML 的多智能体框架，用于长期对话中的交互式记忆学习。该框架将智能体的记忆机制从被动存档转变为可学习的策略，包含一个 Planner agent 负责选择性编码信息和一个 Trigger agent 负责动态检索。论文的核心机制涉及通过在线强化学习和延迟奖励机制使这两个智能体在连续交互反馈中共同演化（co-evolve），并实现测试时的快速自适应。这直接命中了您筛选标准中的多个关键保留项：它研究了智能体的“记忆机制”和“多智能体协作”，并且核心机制是“自我演化/自我改进”和“在线自适应”。虽然其应用场景为长期对话，但其本质贡献是智能体记忆策略的演化机制，而非单纯的领域应用，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决的核心问题是：在长期开放域对话中，智能体如何动态管理记忆以持续满足用户不断变化的期望与偏好。现有方法将记忆视为静态数据库，被动存储信息而不评估其价值，导致过时偏好与新需求之间产生冲突。这个问题至关重要，因为长期对话的本质是满足用户随时间变化的个性化需求，而缺乏自适应记忆机制的智能体无法维持类人的参与度。解决这一问题能带来真正具备终身学习能力的个性化助手，使智能体通过持续交互自我进化，而非依赖人工干预更新记忆规则。\n\n### § 2 前人工作与不足\n\n长期对话的记忆管理此前主要沿两条路线发展。管理中心的记忆智能体如 Mem0、A-Mem 和 MemoryOS 设计了图结构与层次化存储等复杂架构来组织记忆全生命周期，但这些启发式架构依赖固定规则决定存储与检索，无法根据实际对话效用调整策略，因此无法与用户期望精确对齐。生成中心的对话智能体如 MemoryBank 和 THEANINE 则将历史压缩为静态摘要或保留全部历史，前者丢失细粒度因果依赖，后者随对话深度增长导致上下文膨胀与噪声积累。两类方法的共同局限在于将记忆视为被动存档而非可学习过程，缺乏从环境反馈中推断记忆长期价值的机制——当用户偏好转变时，无法让新约束覆盖过时信息，也无法通过交互持续优化记忆决策。", "core_insight": "### § 3 重建作者的思考路径\n\n现有长期对话方法普遍采用静态启发式范式，将记忆视为被动数据库，按固定规则压缩或存档历史信息。这类方法无法区分高价值信息与低价值噪声，也无法随用户偏好变化自我调整，导致过时偏好与新需求之间产生冲突。认知心理学早已指出，人类记忆并非平等保存所有信息，而是选择性编码对未来决策有价值的线索，并通过持续反馈更新心智模型。作者可能由此推断：若将记忆管理建模为序列决策问题，让 agent 在交互中学习\"记什么\"和\"何时检索\"，便能突破静态范式的瓶颈。在线强化学习提供了将延迟反馈传播回早期存储决策的机制，而多 agent 协作则可自然地分离写入与检索两个职责。\n\n### § 4 核心直觉\n\n记忆的价值只有在未来被成功使用时才能确认，因此存储决策必须由检索结果反向校准。ICML 让 Planner 负责选择性写入、Trigger 负责按需检索，两者通过跨会话延迟奖励耦合：当某条记忆在后续对话中被成功调用并改善回复质量时，这一信号回传给当初的存储决策，使两个 agent 共同进化。核心在于用\"未来效用\"而非\"当下启发式\"来驱动记忆策略，让 agent 在持续交互中自动对齐不断变化的用户期望。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n          用户查询 uk + 对话历史 Hk\n                    │\n         ┌──────────┴──────────┐\n         ▼                     ▼\n  ┌────────────┐        ┌────────────┐\n  │ Planner    │ Save   │ 外部记忆库 M│\n  │ Agent      │───────▶│            │\n  │ a^p∈{0,1}  │ Discard│            │\n  └─────┬──────┘        └─────┬──────┘\n        │ r_proxy              │ 候选记忆\n        │                      ▼\n        │               ┌────────────┐\n        │               │ Trigger    │\n        │               │ Agent      │\n        │               │ a^t∈{0..N} │\n        │               └─────┬──────┘\n        │                     │ 选中记忆\n        │                     ▼\n        │           ┌──────────────────┐\n        │           │ 响应生成 r*       │\n        │           └────────┬─────────┘\n        │                    │ r_qual\n        │      ┌─────────────▼──────────┐\n        └──────│ Cross-Session Truth    │\n   延迟奖励    │ Reward (回溯至 k_past)  │\n               └─────────────┬──────────┘\n                             ▼\n                    ┌──────────────┐\n                    │ PPO 在线优化  │\n                    └──────────────┘\n```\n\nICML 将长期对话建模为部分可观测马尔可夫决策过程（POMDP），核心由两个协作 Agent 和一条延迟反馈回路构成（§3.1–3.3）。\n\n**冷启动预热**：系统先通过回顾式会话合成（Retrospective Session Synthesis）生成专家数据。具体做法是以用户首次暴露约束的\"种子会话\"为锚点，用 LLM 反向递归生成逻辑一致的前序会话，再正向遍历标注 Planner 的保存标签和 Trigger 的检索索引，形成带因果依赖的训练数据，用于监督预热策略参数（§3.2）。\n\n**在线交互**：每轮对话中，Planner 接收用户查询与上下文，输出二值动作——保存则将当前信息压缩为记忆片段写入外部记忆库，丢弃则过滤噪声；同时获得由 LLM 评判的即时代理奖励 $r_{\\text{proxy}}$ 及丢弃高价值信息的惩罚项（§3.3.1）。Trigger 观察查询、历史和候选记忆集合，输出记忆索引分布，索引 0 表示不检索；选中的记忆与上下文拼接后由 LLM 生成最终回复，回复质量由 LLM 多维评分得到 $r_{\\text{qual}}$（§3.3.2–3.3.3）。\n\n**延迟反馈与优化**：当 Trigger 在未来某轮成功调用了一条历史记忆，系统将该轮的 $r_{\\text{qual}}$ 回溯传播到 Planner 当初存储该记忆的决策点，作为跨会话真实奖励（Cross-Session Truth Reward），使存储目标与长期效用对齐（§3.3.4）。两个 Agent 共享 Actor-Critic 架构，收集轨迹后用 PPO 算法端到端优化，Actor 和 Critic 各自更新策略与价值函数（§3.3.5）。\n\n### § 6 核心数学推导\n\n论文将交互式记忆学习形式化为 POMDP $\\langle S, A, O, R, \\gamma\\rangle$（§3.1）。状态 $s_k$ 包含用户隐式意图和完整交互历史，但 Agent 只能观测到 $o_k = (u_k, H_k, M_k)$，即当前查询、近期上下文和记忆库状态。联合动作 $a_k = (a_k^p, a_k^t)$ 分解为 Planner 的二值保存动作和 Trigger 的记忆索引动作，使两个 Agent 各自决策但共享同一奖励信号。\n\n奖励设计区分即时与延迟两类。Planner 在存储时获得代理奖励 $r_{\\text{proxy}} \\in [0,1]$，衡量当前轮次的内在信息价值；Trigger 在生成回复后获得质量奖励 $r_{\\text{qual}} \\in [0,1]$。真实奖励通过回溯机制定义：当记忆 $m_i$ 在未来轮 $k_{\\text{future}}$ 被触发，其质量评估被传播回创建轮 $k_{\\text{past}}$，即 $r_{\\text{truth}} = r_{\\text{qual}}^{k_{\\text{future}}}$，并按权重 $\\lambda$ 与代理奖励组合（§3.3.4）。这一设计的关键直觉是：单条记忆的价值在存储时往往未知，只有当它被成功检索并改善回复时才能确认，因此需要延迟验证。\n\n优化目标采用 PPO 的截断代理目标（§3.3.5）。Actor 通过重要性采样比 $\\rho_k = \\pi_\\theta(a_k|o_k)/\\pi_{\\theta_{\\text{old}}}(a_k|o_k)$ 和优势估计 $A_k$ 更新策略，截断系数 $\\epsilon=0.2$ 限制更新步幅以保持稳定；Critic 最小化价值估计 $V_\\phi(o_k)$ 与实际回报 $R_k$ 的均方误差。两个 Agent 的策略 $\\pi_\\theta^p$ 和 $\\pi_\\theta^t$ 在同一轨迹上联合优化，折扣因子 $\\gamma=0.99$ 确保长期回报被充分考量。\n\n### § 7 实验设计与结论\n\n**进化记忆是否优于静态启发式方法？** 论文在 CC、MSC、GC 三个真实人机对话数据集上，将 ICML 与长上下文基线、管理型记忆 Agent 和生成型对话 Agent 对比，使用 BLEU-4、ROUGE-L、BertScore、Mauve 及 LLM 评判和人类评估。结果显示 ICML 在所有数据集上均取得最优自动指标，在人类评估中生成质量和记忆检索胜率分别达 66% 和 70%，证明主动选择高价值记忆远优于被动处理全部历史（§4.2, 表1, 图3–4）。\n\n**各组件是否都不可或缺？** 消融实验逐一移除合成数据、Planner、Trigger、真实奖励和进化机制。移除跨会话真实奖励导致最大性能下降，说明长期反馈对判断记忆效用至关重要；移除进化机制后性能也显著退化，证明静态训练不足以应对持续变化的用户偏好（§4.2, 表2）。\n\n**系统能否通过交互持续自我改进？** 将交互扩展至 10 轮会话并追踪 Planner 精度和 Trigger 召回率，两者均呈持续上升趋势，且 Token 消耗和延迟保持稳定而非线性增长，验证了协作进化机制在长期交互中的有效性和效率（§4.3, 图7, 图9–10）。", "additional_insights": "### § 8 阅读收获\n长期对话的核心挑战不在于被动存储所有历史，而在于动态区分高价值信息与低价值噪声。论文将记忆管理建模为POMDP，通过Planner和Trigger双智能体协作，利用跨会话真实奖励实现策略的在线自我进化。从种子会话反向生成前序故事的回顾性合成管道，则有效解决了冷启动问题。\n\n### § 9 最脆弱的假设\n最关键的假设是：大语言模型提供的回复质量奖励能准确归因到历史记忆的存储决策上，从而有效指导Planner的长期策略。在实际开放域对话中，用户意图多变，单次回复质量很难与特定记忆的保存建立明确因果关系。若延迟的信用分配失效，强化学习循环将无法收敛。论文虽在消融实验中证明移除该奖励导致性能下降，但缺少证据表明LLM裁判评分与真实人类长期偏好高度一致。\n\n### § 10 最小复现实验\n若有一周时间，可验证回顾性合成中反向生成策略的有效性。使用MSC数据集中的少量种子会话，分别用大模型进行反向生成（倒推前序对话）和正向生成（直接续写），各产出0.25K条数据。用这两组数据分别微调同一开源小模型作为初始记忆策略，在测试集上测量记忆检索准确率和回复质量。若反向生成数据的微调模型在两项指标上显著更优，则支持其能提供更高质量初始化的结论；反之则反驳该claim。", "research_value": "### § 11 最强反例设计\n如果我要攻击这篇论文，我会设计一个“偏好高频突变与多记忆干扰”的对话场景。在这个场景中，用户反复改变兴趣，导致记忆库中存在大量语义相似但偏好冲突的记忆片段。当 Trigger 检索这些片段生成回复时，LLM 裁判可能仅因回复迎合了当前偏好就给出高质量奖励。这种高分会被错误地回溯传播给那些已过时但恰好被检索的记忆的存储决策。这种信用分配错位会导致 Planner 无法区分真正具有长期价值的记忆，PPO 策略可能因此收敛到次优解。\n\n### § 12 后续研究设想\n围绕 LLM 裁判奖励可能与人类长期偏好不一致的局限，可以提出引入显式人类反馈来校准延迟奖励的后续研究。具体做法是在多轮交互后，不依赖 LLM 打分，而是让真实用户标注哪些历史记忆真正对当前对话有帮助，以此作为真实奖励微调策略。这值得测试是因为它能直接检验现有自动奖励在信用分配上的准确性。首个对照实验可将原模型与使用人类标注奖励微调的模型对比，在包含偏好突变的测试集上测量记忆检索准确率。如果人类反馈组显著更高，则证明 LLM 裁判的长期信用分配确实存在偏差。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Cai Ke\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Jiangyue Yan\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Han Zhang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Xin Liu\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Zike Yuan\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Yue Yu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Hui Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Ruifeng Xu\", \"affiliations\": [1, 2], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"HIT, Shenzhen\"},\n    {\"id\": 2, \"name\": \"Pengcheng Laboratory\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding authors.\"}\n  ]\n}\n```", "summary_translation": "大语言模型的最新进展显著提升了智能体在建模长期对话方面的能力。尽管取得了这些成功，现有方法通常采用静态启发式范式，信息被被动归档，缺乏自适应记忆评估。因此，这些方法无法自我进化，也无法使其记忆管理与不断变化的用户需求保持一致。为了解决这一问题，我们提出了 ICML (InteraCtive Memory Learning)，这是一个多智能体框架，它将记忆机制从被动归档转变为可学习的交互式记忆策略。具体而言，我们首先采用会话合成流水线来生成专家数据，以促进在未见场景中的快速测试时适应。在此基础上，ICML 利用在线强化学习机制，其中 Planner 智能体选择性地编码高价值信息，Trigger 智能体动态检索该信息以优化响应质量，从而这两个智能体通过持续的交互反馈实现协同进化。关键在于，这两个智能体通过延迟奖励机制进行同步，该机制将未来的反馈反向传播至早期的存储决策，确保记忆策略与用户期望精确对齐。实验结果表明，ICML 显著优于强基线，展现出随着交互的积累持续提升响应质量的独特能力。"}, {"title": "ThinkFlow: Self-Evolving Probabilistic Latent Memory for Lifelong Conversational Agents", "arxiv_id": "2609.17010", "authors": "Cai Ke, Xin Liu, Han Zhang, Jiangyue Yan, Zike Yuan, Ling Deng, Yue Yu, Hui Wang, Ruifeng Xu", "summary": "Lifelong conversational agents rely on memory systems to maintain deep, context-aware interactions with users. However, existing explicit textual memory pipelines suffer from a severe information bottleneck, often losing subtle behavioral patterns and emotional shifts. Furthermore, being typically static post-deployment, they cannot autonomously adapt to personal habits and preferences without manual feedback. Cognitive science, however, suggests that humans maintain mental models purely in a latent space and continuously refine them through predictive coding. Inspired by this, we propose \\textbf{ThinkFlow}, a novel end-to-end latent memory framework for lifelong conversational agents. ThinkFlow bypasses the text bottleneck by dynamically compressing conversational flows into probabilistic latent memory skills, autonomously consolidating complex user states into disentangled, continuous vectors without semantic interference. To break this barrier, we introduce a test-time evolution paradigm. By coupling teacher-guided latent alignment to bootstrap the initial state with a self-supervised next-user-utterance prediction task for continuous refinement, the framework successfully overcomes cold-start challenges and achieves label-free lifelong personalization. Extensive experiments on long-term conversation benchmarks demonstrate that ThinkFlow significantly outperforms prevailing memory systems, providing highly personalized and contextually accurate responses over extended multi-session interactions.", "category": "cs.CL", "cluster": "Memory Systems for Long-Term Agents", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是为终身对话智能体提出了一种新的潜在记忆框架，并引入了测试时演化范式。论文明确针对“Lifelong Conversational Agents”，研究焦点在于智能体的“记忆”能力。此外，论文的核心机制是“test-time evolution paradigm”和“continuous refinement”，通过自监督预测任务实现无标签的终身个性化，这直接对应了筛选标准中的“自我演化”和“在线适应”机制。论文不仅提出了新的记忆机制，还强调了智能体在部署后的自主适应和自我完善，完全符合“构建、改进、评估、训练或演化 LLM智能体”的研究目标，且不涉及任何排除标准（如安全、多模态视觉、图技术或系统编排等）。因此，该论文应被保留。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决的是终身对话代理如何在不依赖显式文本记忆的前提下，持续、自主地追踪用户状态并实现个性化的问题。随着 LLM 从静态问答工具转向长期陪伴式代理，标准逐轮交互会产生\"情景遗忘\"，而将全部历史直接塞入上下文窗口则带来高昂的计算开销和语义稀释。因此，构建一个高效、动态且能随用户演化的记忆机制，是维持深度个性化人机陪伴的关键前提。\n\n### § 2 前人工作与不足\n\n已有方法主要沿显式文本记忆范式展开，如 MemGPT、Mem0、A-Mem 等通过结构化检索、摘要压缩或代理式管理来组织历史对话。这些方法能将过去会话保存为可读文本并按需检索，但将连续丰富的人类交互强制离散化为纯文本摘要，会丢失隐含偏好、情感转变等细微信息；且部署后记忆库基本静态，缺乏自主适应用户个体特征的能力。另一类潜在记忆方法如 MemGen 虽将历史编码为连续向量以提升效率，但使用静态潜在表示，无法建模交互中的不确定性，也未利用用户后续反应作为反馈信号来持续修正记忆。ThinkFlow 正是针对这两类不足，提出在潜在空间中以概率记忆技能动态压缩对话流，并通过自监督的下一轮用户话语预测实现无标注的终身自我演化。", "core_insight": "### § 3 重建作者的思考路径\n\n作者从已有失败模式出发：显式文本记忆在长期对话中丢失情感与偏好等细微信息，且部署后静态、无法自主适应；将全部历史塞入上下文窗口则导致语义稀释与计算爆炸。认知科学的 Implicit Theory of Mind 和 Predictive Coding 提供了理论线索——人类心智模型在潜在空间中维护，靠预测误差持续更新。已有潜在记忆工作多为静态向量，部署后不再演化。由此推论：若把对话历史压缩为解耦的潜在向量，并以预测用户下一句话作为免费监督信号，就能同时绕过文本瓶颈并实现无标注的终身个性化。\n\n### § 4 核心直觉\n\n把对话历史压缩成一组解耦的潜在记忆向量，用\"预测用户下一句话\"的自监督误差持续修正这些向量。文本瓶颈由此绕开，记忆也能在部署后无需人工标注地自主演化——这是让先前方法失效的两个瓶颈同时被打破的关键。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n x_t(用户查询)      S_{t-1}(历史记忆)\n     |                   |\n     v                   v\n +--------+        +-----------+\n |LLM编码 |        |CAHA 对齐  |\n |  E_t   |        +-----------+\n +--------+             |\n     |                  v\n     +------------\u003E +---------+\n                   |PLMS     | 压缩为K个\n                   |重参数化  | 概率技能\n                   +---------+\n                        | S_hat\n                        v\n                   +---------+\n                   |GLC 门控 | 整合+遗忘\n                   +---------+\n                        | S_t\n              ---------+---------\n              |                 |\n              v                 v\n         +--------+      +-----------+\n         |对齐生成|      |Phase2     |\n         | a_t    |      |预测x_{t+1}|\n         +--------+      |自监督演化  |\n                        +-----------+\n```\n\nThinkFlow 的核心思路是将对话历史压缩为概率潜在记忆技能，绕过显式文本摘要的信息瓶颈。整个 pipeline 包含三个模块和两阶段训练，以下按数据流逐步说明。\n\n**PLMS（概率潜在记忆技能）**：输入为当前轮 LLM 隐藏状态 $E_t$ 和可学习的记忆技能槽 $S$。通过交叉注意力将 $E_t$ 压缩为 $K$ 个密集技能向量，并引入分布保持缩放因子 $c=L/K$ 防止方差坍缩。模块输出均值 $\\mu_t$ 和对数方差 $\\log\\sigma_t^2$，训练时用重参数化技巧采样，并用 KL 散度将后验推向标准高斯先验。这种解耦设计让不同技能自主专注于事实、情感、偏好等不同维度，避免语义干扰（§3.1）。\n\n**GLC（门控潜在整合器）**：输入为新技能 $\\hat{S}_{new}$ 与旧记忆 $S_{t-1}$。通过 MLP 计算信息增益门 $g_t\\in(0,1)$，量化新信息相对已有记忆的新颖度，再用 GRU 核逐步更新记忆。门值低时旧记忆被保留，门值高时新信息被写入，实现优雅遗忘与噪声过滤（§3.1）。\n\n**CAHA（上下文感知超对齐器）**：输入为当前用户查询 $x_t$ 和历史技能 $S_t$。超网络根据 $x_t$ 的语言特征生成低秩变换矩阵 $W_{adapt}$，对技能做残差投影 $S_{aligned}=S_t+S_t\\times W_{adapt}$，动态弥合历史潜在表示与当前语义空间的分布差距。对齐后的技能作为软提示拼接到 LLM 前端，引导个性化生成（§3.1）。\n\n**Phase 1（教师引导对齐）**：解决冷启动问题。教师 LLM 读取完整明文历史输出目标分布 $P_T$，学生 LLM 仅读取潜在记忆和当前查询输出 $P_S$，最小化两者 KL 散度，让学生在首轮会话即建立初始记忆锚点（§3.2，Algorithm 1 Lines 2-12）。\n\n**Phase 2（下一话语预测）**：从第二轮会话起教师离线。系统用记忆技能 $S_{t+1}$ 和上一轮回复 $a_t$ 预测用户下一句话 $x_{t+1}$，以交叉熵损失作为隐式反馈信号。预测失败时高损失直接关闭 GLC 门，防止坏更新污染记忆；同时引入最小熵置信先验鼓励模型保持锐利预测。整个阶段无需人工标注，实现无标签终身个性化（§3.2，Algorithm 1 Lines 13-25）。\n\n推理时，PLMS、GLC、CAHA 前向运行，对齐技能注入 LLM 生成回复，不产生任何中间文本 token。\n\n### § 6 核心数学推导\n\n论文的数学框架围绕概率记忆建模与自监督演化展开，以下补充每个公式的直觉。\n\n**PLMS 压缩与重参数化**：交叉注意力输出经缩放因子 $c=L/K$ 调整后，通过两个并行线性层输出 $\\mu_t$ 和 $\\log\\sigma_t^2$。采样时用重参数化技巧 $z=\\mu+\\sigma\\odot\\epsilon$（$\\epsilon\\sim\\mathcal{N}(0,I)$），使梯度能穿过随机采样节点回传。这里 $\\mu$ 是技能的\"最佳猜测\"，$\\sigma$ 量化认知不确定性——对话信息越模糊，方差越大，模型对自身记忆越不自信。KL 散度损失 $L_{KL}$ 将后验拉向标准高斯，防止方差无限膨胀导致记忆退化。\n\n**GLC 门控更新**：门 $g_t=\\sigma(\\text{MLP}([\\hat{S}_{new};S_{t-1}]))$ 将新旧记忆拼接后映射到 $(0,1)$，本质是\"新信息是否值得记住\"的连续开关。GRU 更新 $S_t=(1-g_t)\\odot S_{t-1}+g_t\\odot\\hat{S}_{new}$ 在门关闭时保留旧记忆、门打开时写入新信息，同时 GRU 的重置门和更新门处理时序依赖与过期信息遗忘。\n\n**CAHA 低秩变换**：$W_{adapt}=W_{down}\\cdot W_{up}$（秩 $r\\ll D$），用超网络从当前查询生成。低秩瓶颈大幅减少参数量，残差连接 $S_{aligned}=S_t+S_t\\times W_{adapt}$ 保证未对齐时退化为原始技能，训练更稳定。\n\n**Phase 1 损失**：$L_{Phase1}=D_{KL}(P_T\\|P_S)+\\alpha L_{KL}$。前项是教师-学生分布对齐，后项是 PLMS 的正则化。$\\alpha=0.1$ 平衡两者。\n\n**Phase 2 损失**：$L_{Phase2}=L_{CE}+\\beta L_{Conf}+\\alpha L_{KL}$。$L_{CE}$ 是预测用户下一话语的交叉熵，$L_{Conf}=-\\sum P_{pred}\\log P_{pred}$ 是最小熵先验，鼓励模型给出自信预测而非模糊平均。$\\beta=0.1$。当 $L_{CE}$ 高时，梯度反传关闭 GLC 门，形成\"预测失败→拒绝写入\"的自我保护回路。\n\n### § 7 实验设计与结论\n\n**问题一：潜在记忆能否绕过文本瓶颈，在长期对话中防止信息丢失？** 在 CC、MSC、GC 三个开放域长期对话数据集上，用 BLEU-4、ROUGE-L、BertScore、Mauve 评测逐轮生成质量，与 Long Context、GraphRAG、MemGPT、MemoryBank、LightMem 等显式记忆基线及 SoftCoT、MemGen 等潜在记忆基线对比。结果显示 ThinkFlow 在所有数据集上均取得最优整体表现，Mauve 指标提升尤为显著（如 CC 上 Qwen3-8B 达 77.20，次优 MemGen 仅 59.74），表明潜在记忆保留了显式摘要丢失的对话细微差异，生成更连贯自然（§4.2，Table 1）。\n\n**问题二：连续潜在更新能否比静态文本检索更好地追踪用户状态演化？** 在 PersonaMem 基准上（32K–1M token），按 7 项技能评测准确率，包括回忆共享事实、追踪偏好演化、建议新场景等。ThinkFlow-8B 在平均准确率上始终最高，在\"追踪演化\"等动态任务上优势突出（1M 上下文达 62.22），整体媲美甚至超越 Llama3.1-405B 等大模型。这验证了纯潜在空间记忆能有效捕捉用户状态的连续变化，而非依赖刚性文本检索（§4.3，Table 2）。\n\n**问题三：结构解耦与自监督演化是否都不可或缺？** 在 Qwen3-8B 上做消融实验，分别移除 PLMS、GLC、CAHA 及两阶段训练。移除任一模块或阶段均导致性能下降，其中去掉 PLMS 后 Mauve 从 77.20 降至 66.48，降幅最大，证明将对话流压缩为解耦技能向量是框架的基础。去掉 Phase 2 则验证了持续自监督演化对动态个性化的必要性（§4.4，Table 3）。此外，效率分析显示 ThinkFlow 消耗 token 最少（2,857）、耗时最短（12.1s），远优于显式基线（§4.5，Figure 5）。", "additional_insights": "### § 8 阅读收获\n\nThinkFlow将终身对话代理的记忆从显式文本管道转为纯潜在空间操作。概率潜在记忆技能（PLMS）将对话流压缩为K个解耦连续向量，避免文本摘要的信息瓶颈；门控潜在整合器（GLC）控制信息更新，上下文感知超对齐器（CAHA）动态桥接历史记忆与当前语义。两阶段训练中，Phase 1用教师蒸馏解决冷启动，Phase 2通过下一用户话语预测实现无标签的自监督终身演化。实验表明该方法在多个长期对话基准上显著优于显式记忆系统，且token消耗和推理延迟大幅降低。\n\n### § 9 最脆弱的假设\n\n最关键的假设是\"用户下一句话语可作为有效自监督信号来演化记忆技能\"。实际对话中，用户下一句话可能受外部事件、情绪波动或话题跳跃驱动，与当前对话状态的预测关系很弱。若预测信号本身是噪声，记忆技能的演化方向会偏离用户真实状态，整个终身个性化机制即失效。论文以PersonaMem上\"Track Evolution\"任务的高准确率作为间接证据，但未直接分析预测损失与记忆质量的关联——若大多数预测都失败，高准确率可能来自Phase 1的蒸馏残留而非Phase 2的持续演化。\n\n### § 10 最小复现实验\n\n用MSC数据集和Llama3.2-3B，仅实现PLMS（K=10）和GLC两个核心模块，执行Phase 1教师引导训练3个epoch。在测试集上比较ThinkFlow与文本摘要基线Rsum的BertScore和ROUGE-L。保留潜在压缩与门控更新机制，省略CAHA和Phase 2以控制工作量。若潜在记忆的BertScore显著高于文本摘要（如提升2个百分点以上），支持\"绕过文本瓶颈减少信息损失\"的核心主张；若两者持平或潜在记忆更低，则该主张在简化条件下不成立，需进一步检查是否因缺少CAHA的对齐能力所致。", "research_value": "### § 11 最强反例设计\n针对“用户下一句话可作为有效自监督信号”的假设，最致命的攻击在于真实对话中频繁发生的不可预测话题跳跃。当用户突然提及受外部事件驱动的突发情绪或新话题时，系统必然预测失败。按照论文机制，高预测损失会关闭门控整合器以拒绝写入，这会导致系统在最需要记忆更新的状态突变时刻反而陷入停滞。我们可以构建一个包含高频外部事件打断的对话测试集，检验 ThinkFlow 在这些场景下追踪用户状态演化的准确率。如果准确率大幅下降，就能证明该自监督演化机制在不可预测的真实交互中会系统性地阻碍关键记忆更新。\n\n### § 12 后续研究设想\n围绕“预测失败即拒绝写入”这一保守策略，后续研究可探索将预测误差作为分级更新信号而非单纯阻断开关。预测失败往往意味着用户状态发生了重大偏离，这恰恰是最需要记忆更新的时刻。首个对照实验可在包含突发情绪转变的对话集上，比较原版门控整合器与“预测失败时按误差比例放大写入门”的变体在偏好追踪准确率上的差异。若变体表现更好，说明原机制的保守策略在动态场景下存在缺陷，需要更灵活的异常记忆整合机制。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Cai Ke\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Xin Liu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Han Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiangyue Yan\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Zike Yuan\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Ling Deng\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Yue Yu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hui Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ruifeng Xu\", \"affiliations\": [2, 1], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Pengcheng Laboratory\"},\n    {\"id\": 2, \"name\": \"Harbin Institute of Technology, Shenzhen\"},\n    {\"id\": 3, \"name\": \"China Unicom Greater Bay Area Innovation Institute\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding authors.\"}\n  ]\n}\n```", "summary_translation": "终身对话智能体依赖记忆系统来维持与用户深度的、具备上下文感知能力的交互。然而，现有的显式文本记忆流程存在严重的信息瓶颈，经常丢失细微的行为模式和情感变化。此外，它们在部署后通常是静态的，在没有人工反馈的情况下无法自主适应个人习惯和偏好。然而，认知科学表明，人类纯粹在潜在空间中维持心智模型，并通过预测编码不断对其进行细化。受此启发，我们提出了 ThinkFlow，这是一种面向终身对话智能体的新型端到端潜在记忆框架。ThinkFlow 通过将对话流动态压缩为概率潜在记忆技能，绕过了文本瓶颈，自主地将复杂的用户状态整合为无语义干扰的解耦连续向量。为了打破这一障碍，我们引入了一种测试时演化范式。通过将用于引导初始化状态的教师引导潜在对齐与用于持续细化的自监督下一用户话语预测任务相结合，该框架成功克服了冷启动挑战，并实现了无标签的终身个性化。在长期对话评测基准上的大量实验表明，ThinkFlow 显著优于主流的记忆系统，在扩展的多会话交互中能够提供高度个性化且符合上下文的准确响应。"}, {"title": "EchoPath: Execution-Level Replayable Memory for GUI Agents", "arxiv_id": "2609.16635", "authors": "Yao Zhao, Aditya Shanmugham, Swastik Roy, Yanxun Xu", "summary": "Computer-use agents increasingly operate browsers, software, and desktop applications via CLI or API portals, but graphical user interface (GUI) still plays an important role in common industrial production scenarios. GUI agents commonly employ fresh observe-plan-ground-act loops, which is inefficient for enterprise tasks that repeatedly update records, process forms, configure tools, and export reports. We introduce EchoPath, a model-agnostic harness that converts artifact-validated GUI trajectories into standardized, parameter-controlled callable memories, analogous to Model Context Protocol (MCP)-style tool calls rather than unstructured experience records. Each memory stores task-intent keys, application and state preconditions, flexible input parameters, GUI evidence, validation provenance, and lifecycle state, so the host agent invokes a targeted procedure only when it can be deterministically replayed in the current runtime. The core mechanism enabling replay is an image-based target-reaiming algorithm that treats stored coordinates as visual evidence, matches the remembered GUI target against the current screen, and emits corrected operation coordinates before execution. During replay, EchoPath rebinds only declared modifiable inputs and rejects ambiguous or incompatible steps to bounded grounding repair or fresh planning. In experiments with real computer-use tasks, EchoPath reduced median token cost by more than 90% and median execution time by about 60%. These results support a bounded form of enterprise GUI memory: validated execution experience can become a controllable callable asset for recurrent work rather than only context for another reasoning pass.", "category": "cs.AI", "cluster": "Memory Systems for Long-Term Agents", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了 EchoPath，一个针对 GUI 智能体的模型无关 harness，它将经过验证的 GUI 执行轨迹转化为标准化、参数控制的可调用记忆。这直接涉及智能体的记忆机制和 harness 改进，使得智能体能够复用过去的经验，从而在重复性任务中显著提高效率并降低成本。根据筛选标准第一步中的“保留”规则，论文研究了 agent 的 harness / runtime / execution environment，并且核心贡献是让这些智能体运行组件通过轨迹、观测和验证结果自动改进和自适应优化。此外，它也符合第二步中的正面指标，涉及“Agent Harness”、“Memory”和“Tool Use”等智能体核心能力。虽然论文中提到了基于图像的目标重瞄准算法，但这属于智能体感知环境的工具，而非纯粹的多模态视觉研究。因此，该论文完全符合“构建、改进 LLM 智能体”的研究范围。", "intro_logic": "### § 1 研究问题与重要性\n论文解决如何将已验证的图形用户界面（GUI）操作轨迹转化为可精确重放的执行级记忆，以避免在重复性企业任务中反复进行模型推理。当前 GUI agents 通常采用“观察-规划-定位-执行”循环，在处理更新记录、导出报告等高频任务时会导致高昂的 token 消耗和延迟。解决该问题能将验证过的执行经验转化为类似模型上下文协议（MCP）的可调用资产，在保持任务可靠性的同时大幅降低计算成本，满足企业对可审计性和隐私控制的需求。\n\n### § 2 前人工作与不足\n针对任务复用，前人主要尝试了两种路径但均存在不足。第一类是基于提示词的记忆增强方法（如 Synapse、ExpeL），它们将历史轨迹作为上下文输入给模型进行新一轮规划；这类方法不可直接执行，仍需昂贵的模型推理，且难以审计。第二类是经典的记录与重放系统（如 Sikuli）及依赖无障碍树的现代重放工具；它们直接复制原始坐标或绑定界面状态，但在窗口移动、分辨率改变或布局漂移时极易失效，且受限于操作系统暴露的元素，缺乏跨环境的便携性与状态感知能力。", "core_insight": "### § 3 重建作者的思考路径\n作者观察到企业场景中 GUI 任务高度重复，但现有 agent 每次都要重新推理和定位，成本高昂。把历史轨迹塞进提示词让模型参考，仍需重新规划，没真正省掉推理开销。而传统脚本回放虽省了推理，却因死记硬背坐标，一旦窗口大小或界面布局变化就会失效。作者由此意识到，若把验证过的操作轨迹转化为类似函数调用的标准化记忆，并在回放时通过图像匹配动态重新定位目标，就能兼顾执行效率和鲁棒性。\n\n### § 4 核心直觉\n核心直觉是将验证过的 GUI 操作轨迹转化为参数化的可调用记忆，而非仅作为模型的上下文参考。回放时不直接复用旧坐标，而是把存储的坐标当作视觉证据，通过图像匹配在当前屏幕上重新定位目标，从而跳过昂贵的重新规划和定位步骤。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n任务输入 -\u003E 检索与门控 --命中--\u003E 重放模块(IBTR重瞄准) --执行--\u003E 产物评估\n             |                       |                        |\n             |未命中/失败            |视觉匹配失败             |验证通过\n             v                       v                        v\n          代理规划(ActionLens) \u003C--- 步骤级修复             记忆整合\n             |                       |                        |\n             +-----------------------+                        v\n                                  执行(ActionLens)      记忆库(活跃/隔离)\n```\n\nEchoPath 将循环的 GUI 操作构建为五阶段控制流，核心在于将已验证的轨迹转化为可调用的记忆，而非仅作为上下文提示。\n\n1. **任务输入**：接收用户指令与当前桌面环境状态，作为后续检索与执行的起点。\n2. **检索与门控**：从记忆库中检索匹配的活跃记忆，依次检查任务意图、应用标签、状态前置条件等门控。只有全部通过且兼容性得分超阈值的记忆才会被选中（对应正文 2.2 节及补充材料 B.2）。\n3. **规划或重放选择**：若命中记忆，进入重放模块；若未命中或结构不兼容，则回退到常规代理规划。\n4. **重放模块**：使用图像匹配目标重瞄准（IBTR）算法，将存储的 UI 裁剪图作为视觉指纹，在当前屏幕上滑动匹配以重新定位指针坐标。若视觉匹配失败但步骤仍可行，触发步骤级修复；若结构失效，则回退到代理规划（对应正文 2.2 节及算法 1）。\n5. **执行**：通过 ActionLens 边界执行动作，并记录截图、坐标上下文等证据。\n6. **产物评估与整合**：外部评估器检查任务结果是否有效。验证通过后，记忆整合模块对轨迹进行裁剪，将动作分类为固定或灵活，并写入记忆库进行版本控制与生命周期管理（对应正文 2 节及补充材料 B.2）。\n\n### § 6 核心数学推导\n\n论文将 GUI 任务定义为 $\\tau = (q, \\xi, V)$，其中 $q$ 是指令，$\\xi$ 是桌面环境，$V$ 是外部评估器。动作 $a_t = (\\alpha_t, \\theta_t)$ 包含动作原语和参数。可重放记忆 $m$ 形式化为包含检索键、状态前置条件、动作序列及视觉证据等元素的集合。\n\n核心的图像匹配目标重瞄准（IMTR）算法旨在回答一个比常规 GUI 定位更窄的问题：已验证的视觉目标能否在当前屏幕中被安全定位。算法将存储的 UI 裁剪图视为视觉指纹，在当前截图上滑动匹配。对于具有足够内部对比度的裁剪图（标准差 $\\sigma \\geq \\sigma_{\\text{flat}}$），使用零均值归一化互相关计算相似度；对于近乎平坦的区域，则使用归一化平方差以避免分母不稳定。为防止重复 UI 元素导致误匹配，算法要求最佳匹配分数必须超过绝对阈值 $\\eta$，且与次佳非重叠匹配的差距必须超过边际阈值 $\\eta_{\\text{margin}}$。这种设计确保了重定位的确定性与安全性。\n\n### § 7 实验设计与结论\n\n**问题 1**：EchoPath 能否高效利用预整合的记忆执行 GUI 任务？\n**实验**：在 OSWorld-Verified 上进行两遍配对实验。第一遍构建候选记忆，第二遍在故意改变分辨率（1920×1080 改为 1600×900）的情况下重放，对比基线 Synapse。\n**答案**：EchoPath 在保持相当成功率（约 91%）的同时，中位数 token 成本降低 90% 以上，执行时间减少约 60%。\n\n**问题 2**：记忆检索在库规模增大时是否依然准确高效？\n**实验**：检索压力测试，向活跃记忆库添加 0 到 500 条干扰轨迹，测试检索准确率和延迟。\n**答案**：即使库规模增至 659 条，检索准确率仍保持 100%，且延迟在毫秒级。\n\n**问题 3**：视觉重瞄准与状态门控在界面变化下是否可靠？\n**实验**：IBTR 测试在随机缩放条件下匹配精度；状态门控测试在兼容、部分改变和不兼容起始状态下的接受与拒绝率。\n**答案**：IBTR 在缩放条件下 95% 的案例匹配偏差在 2 像素内；状态门控能正确接受兼容状态并拒绝大部分不兼容状态。", "additional_insights": "### § 8 阅读收获\nEchoPath 将 GUI 智能体的重复性任务从“每次重新推理”转变为“调用经验证的可执行记忆”。其核心 IBTR 算法不直接复制历史坐标，而是将坐标作为视觉线索，通过图像匹配在当前屏幕重新定位目标，以适应界面漂移。系统仅在状态匹配且视觉无歧义时执行重放，否则回退到局部修复或重新规划，兼顾效率与安全。\n\n### § 9 最脆弱的假设\n最脆弱的假设是 IBTR 算法依赖的“存储的 GUI 目标裁剪图能在当前屏幕被唯一准确匹配”。实际企业界面常含高度重复元素（如表格行、相同图标），极易导致匹配歧义。论文离线测试显示约 5% 的动作因元素相似被拒，但仅基于受控的 OSWorld 环境。若该假设在真实复杂软件中不成立，重放将频繁失败并回退到重新规划，直接削弱效率优势。\n\n### § 10 最小复现实验\n用一周时间可验证 IBTR 算法在重复界面元素下的定位鲁棒性。收集 50 张含密集重复元素的截图及目标裁剪图，实现图像匹配与歧义消除逻辑。在原始和随机缩放分辨率下，测量接受率、像素偏差及歧义拒绝比例。若重复场景下拒绝率显著上升（如超 30%）或误差大于 5 像素，说明该算法在复杂场景下鲁棒性有限；若接受率保持 90% 以上且误差极小，则证明其抗歧义能力较强。", "research_value": "### § 11 最强反例设计\n我会设计一个包含大量动态内容的真实企业应用场景来挑战该方法。在实时数据看板或带有动态时间戳的 CRM 系统中，界面元素会随数据更新而不断变化。此时，存储的 UI 裁剪图作为视觉指纹将与当前屏幕产生严重偏差，导致 IBTR 算法频繁失败。这种高频失败不仅会迫使系统不断回退到代理规划，抵消 token 成本的节省，还会因额外的匹配计算显著增加总执行延迟，证明该方法在动态环境中反而降低了效率。\n\n### § 12 后续研究设想\n针对动态内容导致匹配失败的局限，后续研究可探索在 IBTR 算法中引入动态区域屏蔽机制。在存储 UI 裁剪图时，自动识别并排除高频变化的文本或图表区域，仅依赖稳定的结构特征进行匹配。这一改进值得测试，因为企业真实场景中纯静态界面极少，适应动态内容直接决定了重放记忆的实用价值。首个对照实验可在包含动态数据的界面上，对比原始 IBTR 与改进版本的重放成功率与回退率，若改进版本能显著降低回退率且不增加误匹配，则说明该方向具备可行性。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yao Zhao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Aditya Shanmugham\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Swastik Roy\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Yanxun Xu\", \"affiliations\": [1, 2], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Johns Hopkins University\"},\n    {\"id\": 2, \"name\": \"Johns Hopkins University School of Medicine\"},\n    {\"id\": 3, \"name\": \"Amazon AGI\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "计算机使用智能体越来越多地通过 CLI 或 API 接口操作浏览器、软件和桌面应用程序，但图形用户界面（GUI）在常见的工业生产场景中仍然扮演着重要角色。GUI 智能体通常采用每次重新进行的观察-规划-定位-执行循环，这对于反复更新记录、处理表单、配置工具和导出报告的企业任务来说效率低下。我们引入了 EchoPath，这是一个与模型无关的工具套件，它将经过执行产物验证的 GUI 轨迹转换为标准化的、参数控制的可调用记忆，类似于模型上下文协议（MCP）风格的工具调用，而不是非结构化的经验记录。每条记忆存储任务意图键、应用程序和状态前置条件、灵活的输入参数、GUI 证据、验证溯源以及生命周期状态，因此宿主智能体只有在当前运行时中能够确定性地重放目标过程时才会调用它。实现重放的核心机制是一种基于图像的目标重新瞄准算法，该算法将存储的坐标视为视觉证据，将记忆中的 GUI 目标与当前屏幕进行匹配，并在执行前输出修正后的操作坐标。在重放过程中，EchoPath 仅重新绑定声明的可修改输入，并拒绝模糊或不兼容的步骤，转而进行有界定位修复或重新规划。在使用真实计算机使用任务的实验中，EchoPath 将词元成本中位数降低了 90% 以上，将执行时间中位数降低了约 60%。这些结果支持一种有界形式的企业 GUI 记忆：经过验证的执行经验可以成为用于重复性工作的可控可调用资产，而不仅仅是另一次推理过程的上下文。"}]}, {"name": "Social \u0026 Emotional Agents", "count": 3, "papers": [{"title": "Verifiable Social Reasoning for LLM Assistants", "arxiv_id": "2609.17496", "authors": "Amir Taubenfeld, Zorik Gekhman, Avigail Grinstein-Dabush, Itay Laish, Ariel Goldstein, Marian Croak, Avinatan Hassidim, Yossi Matias, Amir Feder", "summary": "LLM assistants are widely used for daily social advice, yet evaluating their social reasoning in such consultation settings remains challenging since (i) it requires setups where the assistant learns about social situations from subjective user narratives, and (ii) social properties, such as others' intentions, typically lack verifiable ground truth. To address these challenges, we introduce Fuse, a multi-agent simulation framework for studying user-mediated social reasoning. In Fuse, a target agent with a hidden motive interacts with other agents including one representing the user, who then consults the evaluated assistant to infer the target's motive, providing verifiable ground truth by construction. Simulation faithfulness is validated through a human study with 24k annotations. We apply Fuse to 12 LLMs and demonstrate its analytical utility by systematically isolating key factors, showing that (i) user mediation compounds the inherent difficulty of social reasoning; (ii) LLMs exhibit systematic sensitivity to biased user framing; (iii) models can require more details than humans need to reach a correct prediction; and (iv) longer conversations do not always improve performance despite providing opportunities for clarifying questions. We open-source Fuse and a dataset with 21k examples.", "category": "cs.CL", "cluster": "Social \u0026 Emotional Agents", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Multi-Agent)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-54 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文提出了一个名为 Fuse 的多智能体仿真框架，用于评估和研究 LLM 助手在用户介导下的社交推理能力。根据筛选标准第一步，论文的研究对象明确是 LLM Assistants 和 Multi-Agent LLMs，且核心贡献在于通过多智能体交互环境对智能体的行为进行评估和失败机制诊断。论文分析了智能体对偏见框架的敏感性、澄清问题的效果以及对话长度对性能的影响，这些结论直接帮助理解智能体在复杂交互中的能力边界和推理行为。此外，论文探讨了“澄清时机”这一智能体关键能力，符合正面指标中的关注点。虽然它是一个评估基准和行为分析研究，但根据重要校准规则，只要明确围绕 LLM Agents / Multi-Agent LLMs 展开且结论有助于理解或改进智能体能力，就应予以保留。该研究不涉及被排除的安全、多模态、图技术或纯粹的系统工程拓扑结构问题。", "intro_logic": "### § 1 研究问题与重要性\n论文研究如何评估大语言模型（LLM）助手在“用户中介”的日常社交推理中的能力，即助手仅凭用户主观、可能带有偏见的叙述来推断他人隐藏动机的能力。这个问题至关重要，因为LLM助手被广泛用于日常社交建议，而真实场景中助手只能听到用户的主观叙述，用户可能无意或有意遗漏关键信息并投射自身偏见。如果助手给出错误建议，会直接影响用户的决策和人际关系。解决该问题能建立可验证的评估基准，揭示模型在社交推理中的缺陷，推动开发更可靠的社交助手。\n\n### § 2 前人工作与不足\n传统的社交推理评估（如Social IQa、FANToM）通常向模型展示完整的客观社交场景并提问。这些方法假设模型能直接观察到客观事实，忽略了真实部署中助手只能通过用户主观视角获取信息的“用户中介”特性，导致评估与现实脱节。近期针对安全导向场景的评估（如Bloom）开始关注真实部署，但主要聚焦于用户表达明显妄想等极端情况。这些极端场景的真相通常直接从前提得出，而日常社交场景的真相难以事后标注，缺乏可验证的基准，导致评测缺口。", "core_insight": "### § 3 重建作者的思考路径\n作者可能观察到，LLM 助手在日常社交建议中常被用户的一面之词误导，但现有评测基准都直接给模型看全貌，无法反映这种“用户中介”的现实。评测此场景的最大障碍是缺乏可验证的真值：日常社交中他人的真实动机是隐藏的，人类也无法事后准确标注。\n\n既然事后标注行不通，就必须在生成场景时直接构造真值。多智能体模拟已能逼真模拟社交互动，因此可设定一个带有隐藏动机的目标智能体与其他智能体互动，让真值由构造过程天然确定。最后，让用户智能体把互动过程主观地讲给被评测的助手，即可复现真实场景中的信息不对称。\n\n### § 4 核心直觉\n这篇论文的核心直觉是：通过多智能体模拟在生成社交场景的同时直接植入隐藏动机，从而天然获得可验证的真值。助手只能通过带有偏见的用户叙述来推断动机，这就复现了真实世界中信息不对称的社交推理挑战，同时解决了日常社交场景无法事后标注真值的难题。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[1. 类别定义]     [2. 场景模板]     [3. 多智能体模拟]\n ATOMS分类  ---\u003E 用户/目标/配角 ---\u003E 隐藏动机驱动交互\n(§2 Step1)      (§2 Step2)       (§2 Step3)\n                                     |\n                                     v\n[5. 助手评测] \u003C--- [4. 用户汇报]\n Judge LLM评估     用户主观叙述事件\n(§2 Step5)       (§2 Step4)\n     |\n     v\n [MSR分数]\n```\n\nFuse 框架通过五个步骤构建可验证的社交推理评测基准。首先，基于 ATOMS 分类法定义五个心理状态类别，并生成包含用户、目标人物和配角的场景模板，同时为目标人物设定两个对比鲜明的隐藏动机（§2 Step 1-2）。随后，利用 Concordia 框架驱动多智能体在多个场景中交互，目标人物的行为由其隐藏动机决定，从而生成带有 ground truth 的具体社交事件序列（§2 Step 3）。接着，模拟用户根据记忆向被评估的助手主观叙述这些事件，框架通过控制轴调整用户的汇报偏见和叙述细节级别，助手只能看到用户的叙述而无法接触原始事件（§2 Step 4）。最后，助手预测目标人物的隐藏动机，由 Judge LLM 将预测与 ground truth 对比并判定为正确、错误或弃权，进而计算 MSR 分数（§2 Step 5）。\n\n### § 6 核心数学推导\n\n论文定义了中介社交推理分数（MSR），用于在弃权行为和预测准确性之间取得平衡。其形式为 MSR = P(Correct) + d × P(Abstain)，其中 P(Correct) 为正确预测率，P(Abstain) 为弃权率，参数 d ∈ (0,1) 控制对弃权的奖励程度。直觉上，正确预测得满分，错误预测得零分，而弃权获得部分分数。论文设定 d = 0.75，作为随机猜测与完美预测之间的中点，反映“承认不确定性优于盲目猜测，但不如正确预测有价值”的立场。\n\n### § 7 实验设计与结论\n\n**问题：用户中介如何影响 LLM 的社交推理能力？**\n实验对比了助手设置（通过用户主观叙述推理）和观察者设置（直接观察原始事件）。结果显示，所有模型在用户中介下性能显著下降，错误率和弃权率均上升，表明用户的主观叙述引入了额外的推理难度（§4.1）。\n\n**问题：LLM 是否会受用户主观偏见的影响？**\n实验在保持底层事件不变的情况下，引入默认条件和对立信念条件来改变用户的叙述框架。发现模型性能一致下降，平均降幅为 7.7 个百分点，是人类基线降幅（3.6）的两倍以上，说明模型会系统性地放大用户偏见而非独立推理（§4.2）。\n\n**问题：多轮对话能否弥补信息不足并改善推理？**\n实验将对话从 2 轮扩展到 8 轮，观察模型是否能通过提问收集信息并修正预测。结果表明性能在第 4 轮后停滞甚至退化，因为模型倾向于固守初始判断，或被用户在多轮中累积的偏见进一步误导（§4.4）。", "additional_insights": "### § 8 阅读收获\n\nFuse 通过多智能体模拟生成带已知隐藏动机的社交互动，让模拟用户向被测模型主观复述事件，在构造层面确立可验证的 ground truth，将\"用户中介的社会推理\"转化为可评测任务。实验揭示四个发现：用户中介在客观推理难度之上叠加额外性能损失；模型对用户主观框架的敏感度平均造成 7.7 个百分点下降，约为人类基线降幅的两倍；模型常需比人类更多叙事细节才能正确预测；多轮对话不一定改善表现，因更多轮次也增加采纳用户偏见的机会。\n\n### § 9 最脆弱的假设\n\n最关键假设是模拟用户的主观复述忠实代表真实用户的求助叙事。若不成立，所有结论可能只反映模型对特定模拟器特征的敏感度，而非对真实用户叙事的推理能力。论文用 24k 人类标注验证了模拟事件可识别性（97%）和首条消息可解性（88%），但只确认信号存在且可被人类识别，未直接比较模拟叙事与真实用户叙事的风格一致性。论文在 §5.3 承认此局限但未提供量化证据。\n\n### § 10 最小复现实验\n\n利用开源的 21k 数据集，一周内可验证\"模型对用户偏见框架的系统性敏感\"。抽取默认条件和对立信念条件的配对样本各 500 条，用 2-3 个 LLM 在强制选择提示下预测目标动机，计算两种条件下的 MSR 差距。若模型在偏见条件下 MSR 下降显著超过人类基线的 3.6 个百分点则支持该发现；若差距接近人类基线则反驳。此方案复用已发布数据，无需运行多智能体模拟。", "research_value": "### § 11 最强反例设计\n最强反例是验证Fuse的模拟用户叙事是否引入了LLM特有的偏见伪影，导致评估结论无法推广到真实人类场景。具体实验可招募真实参与者阅读Fuse生成的客观事件序列，让他们以自身视角向被测LLM求助并预测目标动机。如果LLM在真实人类叙事下的偏见敏感度显著异于Fuse模拟条件下的7.7个百分点降幅，说明模型此前的系统性敏感可能只是对“LLM模拟器风格”的过拟合，而非对真实用户偏见的推理缺陷。这直接挑战了Fuse作为真实部署评估基准的有效性。\n\n### § 12 后续研究设想\n后续研究可探究多轮对话失效的真实机制，检验其源于信息不足还是偏见累积。实验需改变原始多轮交互流程，引入干预条件：要求助手在每轮回复前强制剥离用户叙述中的主观评价词，仅基于客观行为事实进行推理。这值得测试是因为原文仅观察到性能停滞，未区分是模型无法提取有效信息，还是被持续注入的偏见误导。若干预组的MSR分数随轮次增加而上升，说明失效主因是偏见累积；若性能依然停滞，则表明模型缺乏主动提取社交线索的能力。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Amir Taubenfeld\", \"affiliations\": [1, 2], \"markers\": [\"*\", \"♦\", \"♠\"]},\n    {\"name\": \"Zorik Gekhman\", \"affiliations\": [1, 2], \"markers\": [\"*\", \"♦\"]},\n    {\"name\": \"Avigail Grinstein-Dabush\", \"affiliations\": [1], \"markers\": [\"♦\"]},\n    {\"name\": \"Itay Laish\", \"affiliations\": [1], \"markers\": [\"♦\"]},\n    {\"name\": \"Ariel Goldstein\", \"affiliations\": [1, 2, 3], \"markers\": [\"♦\", \"♠\", \"♣\"]},\n    {\"name\": \"Marian Croak\", \"affiliations\": [1], \"markers\": [\"♦\"]},\n    {\"name\": \"Avinatan Hassidim\", \"affiliations\": [1], \"markers\": [\"♦\"]},\n    {\"name\": \"Yossi Matias\", \"affiliations\": [1], \"markers\": [\"♦\"]},\n    {\"name\": \"Amir Feder\", \"affiliations\": [1, 2], \"markers\": [\"♦\", \"♠\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Google Research\"},\n    {\"id\": 2, \"name\": \"Hebrew University\"},\n    {\"id\": 3, \"name\": \"University of Cambridge\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Both authors contributed equally and the order between them was chosen randomly\"},\n    {\"marker\": \"♦\", \"text\": \"Google Research\"},\n    {\"marker\": \"♠\", \"text\": \"Hebrew University\"},\n    {\"marker\": \"♣\", \"text\": \"University of Cambridge\"},\n    {\"marker\": \"\", \"text\": \"Corresponding author(s): amirt@google.com, zorik@google.com\"}\n  ]\n}\n```", "summary_translation": "大语言模型（LLM）助手被广泛用于提供日常社交建议，但在此类咨询场景中评估其社交推理能力仍具挑战性，因为（i）这需要一种实验设置，使助手能够从主观的用户叙述中了解社交情境；且（ii）社交属性（如他人的意图）通常缺乏可验证的真实基准。为了应对这些挑战，我们引入了Fuse，这是一个用于研究用户介导的社交推理的多智能体仿真框架。在Fuse中，具有隐藏动机的目标智能体与其他智能体（包括一个代表用户的智能体）进行交互，随后该用户智能体向被评估的助手咨询以推断目标智能体的动机，从而通过构造方式提供可验证的真实基准。仿真保真度通过一项包含2.4万条标注的人工评估得到了验证。我们将Fuse应用于12个LLM，并通过系统地隔离关键因素展示了其分析效用，结果表明：（i）用户介导加剧了社交推理的固有难度；（ii）LLM对带有偏见的用户表述表现出系统性的敏感度；（iii）模型做出正确预测所需的细节可能多于人类；以及（iv）尽管较长的对话提供了提出澄清性问题的机会，但并不总能提升性能。我们开源了Fuse以及一个包含2.1万个样本的数据集。"}, {"title": "From Momentary Emotion Inference to Sustained Emotion Support: Evaluating a Companion Agent in a Longitudinal Study", "arxiv_id": "2609.16344", "authors": "Kexin Quan, Zijian Ding, Jiaye Yong, Qinshi Zhang, Dong Wang, Jessie Chin", "summary": "Sustained emotional support is a long-horizon interaction task closely tied to human well-being. Recent research demonstrates generative agents' capacity for momentary emotional support, yet how these capabilities sustain support over time remains unclear. To examine this challenge, we deployed PAIR, a theory-based emotion-regulation companion, with 19 participants for 14 days. Across 1,093 sessions, we paired emotion estimates with self-reports before and after guidance and analyzed logs and interviews. Estimates corresponded more closely to self-reported valence and dominance than arousal. Guided conversations were followed by higher valence and state-dependent arousal changes. Participants felt understood through contextual exploration and emotional acknowledgment, acting on guidance suited to their needs and constraints. Perceived helpfulness of guided conversation significantly increased over time. Our findings link memory updates and retained corrections to cross-session personalization, informing future emotional support tools that adapt to evolving needs, learn from prior outcomes, and preserve user control over memory.", "category": "cs.AI", "cluster": "Social \u0026 Emotional Agents", "tags": ["cs.AI"], "filter_reason": "这篇论文虽然应用场景是情感支持，但其核心研究对象是长期交互中的生成式智能体。论文通过14天的纵向研究，评估了智能体在长期交互中的行为表现，特别是探讨了“记忆更新”和“保留纠正信息”如何实现跨会话的个性化，以及智能体如何适应不断演化的需求并从先前的结果中学习。这直接关联到研究焦点中的单智能体记忆机制、长期决策以及自我适应能力。根据筛选标准，只要研究对象明确是LLM Agents / Long-Horizon Agents，且结论直接帮助理解或改进智能体能力（如记忆演化、长期适应），即使属于特定领域的经验研究和行为分析，也应保留。因此，该论文符合研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文要解决的核心问题是：生成式智能体如何将单次对话中已验证的瞬时情绪理解与调节能力，转化为跨越数周、适应用户需求变化的持续性情绪支持。这个问题重要，因为情绪调节本身是跨越日常事件的长期过程，而现有证据大多只验证了单次对话的效果，无法说明这些能力在情境、需求和先前建议不断累积时是否仍然成立。\n\n### § 2 前人工作与不足\n\n之前的研究主要在单次对话层面展开，如基于评价理论（appraisal theory）的情绪推理和认知重评生成，虽在共情和情绪觉察上表现良好，但无法追踪跨会话的状态演变和碎片化倾诉。少数长期部署系统如 Socrates 2.0 和 ComPeer 虽引入了对话历史和主动接触，但缺乏显式的情绪状态表征、基于状态的策略选择，以及从用户后续反馈中更新记忆的机制。这导致重复提问、建议固化、用户修正未被保留等问题，使支持无法随情境变化而调整。", "core_insight": "### § 3 重建作者的思考路径\n\n现有生成式代理在单次对话中已能较好地推断情绪并生成支持性回复，但纵向部署暴露了重复提问、无法回忆先前对话等断裂。与此同时，情绪调节理论本身就将调节视为跨越事件与时间的持续过程，而非孤立瞬间。单次会话评估也无法回答一个关键问题：当情境、需求和先前建议不断累积时，瞬时能力是否仍然成立。从这些张力出发，作者推断持续性支持需要两个条件——将每次推断锚定到当前情绪状态，以及把先前经历、用户纠正和指导结果带入后续会话。跨会话记忆与个性化因此成为连接瞬时理解与长期支持的自然桥梁。\n\n### § 4 核心直觉\n\n让先前方法失效的根源在于：每次对话都被当作独立事件，系统既不记得上次发生了什么，也不从用户反馈中修正自己。PAIR 的核心直觉是——把情绪推断、策略选择和对话记忆串成一条随时间演进的反馈回路，使后续支持建立在先前结果之上，而非每次从零开始。用户纠正和指导成效被显式写入记忆并影响下一次推理，这让\"理解\"从单次猜测变成了跨会话的累积校准。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n用户叙述(语音/文本)\n      │\n      ▼\n┌─────────────┐\n│  轻量路由器  │ 按事件结构分流\n└──────┬──────┘\n  单组件│    多组件\n       ▼        ▼\n   ┌──────┐ ┌────────┐\n   │ Cog  │ │Combined│ 评价理论推理支架\n   └──┬───┘ └───┬────┘\n      └────┬────┘\n           ▼\n  PAD估计+SAM+情绪标签+强度+可控性\n           │\n           ▼\n┌──────────────────┐\n│ 策略选择          │ Gross过程模型四策略\n│ (强度×可控性×阶段)│\n└────────┬─────────┘\n         ▼\n┌──────────────────┐\n│ 引导对话(ECA)     │ 探索→安慰→行动\n│ 多模态呈现        │\n└────────┬─────────┘\n         ▼\n   后估计(对话后PAD)\n         │\n         ▼\n┌──────────────────┐\n│ 每晚记忆更新      │──┐\n│ 主题/校准/修正    │  │注入下次推理\n└──────────────────┘  │\n    ↑                 │\n    └──────────────────┘\n```\n\nPAIR 的单次会话从用户用语音或文本叙述日常事件开始。轻量路由器统计事件中相互作用的情绪成分数量，将单组件事件交给 Cog 支架，将多组件事件交给 Combined 支架；两者均基于认知评价理论（cognitive appraisal theory）进行推理，但 Combined 额外整合自下而上的神经认知处理，以捕捉叠加压力源或身心交互等复杂情境（§3.2、§4.2.1）。\n\n选定的支架结合用户画像、校准样本和跨会话记忆，输出 PAD 估计、SAM 评分、情绪标签、强度、可控性和事件阶段。系统据此从 Gross 过程模型的四种策略族中选择调节策略，生成内部指导计划，再通过探索—安慰—行动（ECA）对话序列交付，目标约十轮（§4.2.1）。对话结束后，同一支架基于原始事件、初始估计和完整对话记录重新估计用户情绪，用于前后对比分析。\n\n每晚，轻量模型将当天会话摘要、系统估计与自我报告的系统性偏差、用户修正及策略结果写入滚动记忆块，供后续推理和对话调用，形成跨会话的校准与适应回路（§4.2.2）。\n\n### § 7 实验设计与结论\n\n**情绪理解能否从日常叙述中准确推断用户状态？** 研究者将 14 天田野部署中系统的 PAD 估计与参与者每次会话前后的 SAM 自我报告配对比较，并以无评价支架的同一模型和 NRC-VAD 词典作为基线。结果显示，valence 和 dominance 的相关性较强，arousal 仅弱相关；评价支架在 valence 上优于两个基线。参与者报告的\"被理解\"感与数值误差几乎无关，而更多来自对话中的情境探索和情绪确认（§6.2）。\n\n**引导对话是否带来即时调节效果，指导是否被采纳？** 研究者按入口状态划分会话，分析会话内 SAM 变化，并结合反馈、采纳探针和访谈。焦虑会话的 valence 显著上升、arousal 下降，沮丧会话则 valence 和 arousal 同时上升，表明调节方向随起始状态而异。四种策略族在即时结果上无显著差异；指导采纳主要取决于建议的实用可行性与用户当下的支持需求——有人只想被倾听，有人需要具体行动（§6.3）。\n\n**跨会话连续性如何随重复使用发展？** 研究者追踪 14 天的会话频率、输入长度和评分趋势，并分析访谈中关于记忆与个性化的叙述。会话频率无显著变化，输入长度逐日缩短，有用性评分显著上升。相关回忆和情境更新强化了个性化感知，而过时假设和被遗忘的修正迫使用户重复信息，破坏了连续性（§6.4）。", "additional_insights": "### § 8 阅读收获\nPAIR将认知评价理论转化为推理框架并结合跨会话记忆，在14天部署中实现了持续情感支持。文本推断对效价和支配度估计较准，但唤醒度相关性弱，因为转录丢失了语音韵律等强度线索。参与者感到被理解源于上下文探索和情感确认而非数值估计准确性；引导对话后焦虑和沮丧状态效价提升且唤醒度向调节方向变化，但策略类型间无显著差异。持续使用中用户输入变短而有用性评分上升，相关记忆支持个性化，被遗忘的修正则破坏连续性。\n\n### § 9 最脆弱的假设\n最关键假设是：基于文本的认知评价推理能可靠推断情感强度，为状态条件化的策略选择提供基础。实际上唤醒度估计与自我报告仅弱相关（r = 0.236），参与者频繁报告系统夸大或压低强度。由于策略选择直接依赖强度和可控性估计，唤醒度不可靠会使状态条件化指导失去依据。论文承认此局限但未量化检验强度误判如何影响策略匹配和调节效果。\n\n### § 10 最小复现实验\n用一周验证认知评价提示词对效价估计优于无框架基线。收集30个真实日常事件叙述，每个配对叙述者的SAM自我评分，用同一模型分别运行Cog提示词和无评价框架直接推断，输出1–9维度PAD值。计算两种方法与自我报告的MAE和Pearson r。若Cog效价MAE显著低于基线且相关性更高则支持原结论；若两者无差异或唤醒度相关性不弱于效价则反驳。此方案无需部署完整系统，仅检验推理层核心性能。", "research_value": "### § 11 最强反例设计\n\n如果反对这篇论文，我会设计一个消融实验来证明调节效果并非来自理论驱动的策略匹配。具体做法是保留PAIR的上下文探索、情感确认和跨会话记忆机制，但将基于状态条件的策略选择替换为随机分配或固定倾听策略。在相同的14天部署中，若替换组的valence提升和有用性评分与原系统无显著差异，这就构成最强反例。该结果将提出具体的替代解释：系统的有效性完全来自通用对话框架和记忆带来的个性化感知，而非Gross过程模型的状态条件化指导。\n\n### § 12 后续研究设想\n\n针对文本转录丢失语音韵律导致唤醒度估计不可靠的局限，后续研究应检验补充多模态线索能否修复强度估计并提升策略匹配。需要改变的是将语音的声学特征（如基频和语速）与文本一同输入评价支架，以辅助推断情绪强度。首个对照实验可招募两组参与者进行两周部署，实验组使用多模态输入，对照组仅用文本。通过比较两组的唤醒度估计与自我报告的相关性，以及指导采纳率，可以判断补充声学线索是否真正增强了状态条件化策略的实用价值。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Kexin Quan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zijian Ding\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jiaye Yong\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Qinshi Zhang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Dong Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jessie Chin\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"University of Illinois Urbana-Champaign\"},\n    {\"id\": 2, \"name\": \"University of Maryland\"},\n    {\"id\": 3, \"name\": \"Florida State University\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "持续的情感支持是一项与人类福祉密切相关的长期交互任务。近期的研究表明，生成式智能体具备提供瞬时情感支持的能力，但这些能力如何随时间推移维持支持作用仍不清楚。为了探究这一挑战，我们在19名参与者中部署了PAIR——一个基于理论的情绪调节伴侣，为期14天。在1,093次会话中，我们将情绪估计值与引导前后的自我报告相匹配，并分析了日志和访谈。结果显示，情绪估计值与自我报告的效价（valence，情绪愉悦度）和支配度（dominance，控制感）的吻合度高于唤醒度（arousal，激活水平）。引导式对话后，参与者的效价有所提高，且唤醒度发生了依赖于状态的变化。参与者通过情境探索和情感确认感到被理解，并根据适合其自身需求和限制的引导采取行动。引导式对话感知到的帮助性随时间推移显著增加。我们的发现将记忆更新和保留的纠正与跨会话个性化联系起来，为未来的情感支持工具提供了启示，这些工具能够适应不断变化的需求、从先前的结果中学习，并保留用户对记忆的控制权。"}, {"title": "\"Looking for Something Weird to Happen\": How Humans Sustain AI Agent Novelty Amid Semantic Collapse", "arxiv_id": "2609.16051", "authors": "Shiyang Lai, Arna Woemmel, Hongkai Mao, Junsol Kim, Summer Eunhyung Ann, James Evans", "summary": "Semantic collapse, the progressive narrowing of what AI systems generate, has been studied mainly in closed settings, and remedies have targeted models and data. We study it in MOLTBOOK, a social network of interacting AI agents that human users configure and steer. Across 30,076 active agents, output grows less diverse within agents and more similar across them over weeks, yet a minority sustains high novelty. Interviews with users of high- and typical-novelty agents (N=11) associate sustained novelty with three features: users value novelty of itself, they supply broad and distinctive material and revise it when output narrows, and they approach MOLTBOOK as a new agentic world to explore, not a venue to instrumentally exploit. A survey of users of distinctive agents (N=53) confirms these patterns. Communities with more novel agents also show more diverse output from other agents. We discuss interface and policy interventions that could support improved human input.", "category": "cs.AI", "cluster": "Social \u0026 Emotional Agents", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是对多智能体社交网络（MOLTBOOK）中AI智能体长期行为（语义坍塌现象）的实证分析与失败机制诊断。论文研究了30,076个活跃智能体在数周内的输出多样性变化，并探讨了人类用户如何通过提供独特材料、修改输入等方式来维持智能体的新颖性。根据第一步的筛选标准，“如果论文的研究对象明确是 LLM Agents / Multi-Agent LLMs，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留”。该研究明确以多智能体系统为研究对象，分析了智能体在长期交互中的行为退化（语义坍塌）以及外部干预（人类输入）对智能体能力的维持作用，这直接有助于理解多智能体系统的演化边界和行为模式。此外，该论文不涉及被排除的安全、多模态、图技术或纯拓扑/通信协议设计等系统工程问题，因此符合您的核心研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出两个问题：在真实部署的AI agent社交网络中，semantic collapse（语义坍缩，即AI生成内容逐步收缩到更窄的语义空间）有多普遍、不同agent的新颖性差异如何？高新颖性agent背后的人类用户有哪些目标和实践特征？这个问题重要，因为AI输出同质化会向人类活动传导——依赖AI的写作、创意和科研都会变得更趋同，放大知识生产的单一化倾向。此前坍缩主要在封闭实验中研究，真实部署中人类用户能否成为对抗坍缩的变异来源尚不清楚，理解这一点对设计可持续的人机协作系统有直接价值。\n\n### § 2 前人工作与不足\n\n针对语义坍缩，已有修复主要在模型和生成过程层面。Zhang等通过verbalized sampling恢复多样性，Springer等通过精选训练标注缓解post-training mode collapse，Chen等用persona vectors监控特征漂移。但这些方法均在实验室少数配置中验证，未测试由人类用户持续维护的部署agent，也未与人类写作参考语料做对比。Kong等在封闭多agent环境中证实坍缩稳健存在，但使用同质群体和固定backbone模型，而真实部署是半开放的——每个agent由不同用户配置和引导，运行在不断变化的模型基底上。这一差异之所以关键，是因为人类用户引入的异质经验、兴趣和文化材料可能是坍缩的重要对抗来源，但前人设计未将用户角色纳入分析框架，因此无法回答用户实践与agent新颖性之间的关联。", "core_insight": "### § 3 重建作者的思考路径\n\nSemantic collapse 已在封闭实验中被反复证实：agent 之间仅靠交互就会趋同，而针对模型和数据的修复手段无法完全阻止收敛。但这些证据都来自受控环境，真实部署中人类用户持续配置和引导 agent，可能引入新的变异来源。与此同时，人机协作研究表明，被动使用 AI 会同质化输出，而主动探索和筛选能扩大创意范围。由此可以推测：如果模型层面的修复不够，人类用户的目标和实践或许解释了为什么少数 agent 能长期保持新颖——这正是从已有知识走向本文问题的路径。\n\n### § 4 核心直觉\n\n先前方法失效是因为它们把 collapse 当作纯技术问题，只在模型和数据层面寻找修复，忽略了部署环境中人类用户是持续注入语义变异的源头。本文的核心直觉是：少数 agent 之所以能抵抗趋同，并非因为模型更强，而是其背后的人类用户将新颖性本身视为目标、主动提供独特而多元的材料，并在输出收窄时迭代修正输入。人类创造力因此不是一次性配置，而是对抗 collapse 的持续资源。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n数据收集与合并\n MOLTBOOK 三次爬取 ─┐\n (13.5M generations)├→ 合并语料库\n REDDIT 参考语料 ──┘  (181,585 agents)\n        │\n        ▼\n嵌入与度量计算\n text-embedding-3-large → R^3072\n D_within / D_peers / D_human\n → 周百分位 → 中位数 L_within/L_peers/L_human\n        │\n        ▼\nAgent 筛选\n 30,076 活跃 agents → 2,525 用户可识别对\n        │\n   ┌────┴────┐\n   ▼         ▼\n 访谈(N=11)  调查(N=53)\n +Agent自述  按新颖性分组比较\n   └────┬────┘\n        ▼\n 综合分析与发现\n```\n\n本研究采用混合方法设计，包含三种互补数据模式：行为轨迹揭示哪些 agent 保持新颖，访谈揭示用户做了什么，调查揭示这些实践有多普遍。\n\n**数据收集与合并**：三次独立爬取 MOLTBOOK 平台——自建每周爬虫（1–4 月）、6 月全面爬取、第三方 MOLTBOOK Observatory 日快照存档——按平台 UUID 取并集合并，得到 2026 年 1–6 月间 181,585 个 agent 的 13.5M 条生成内容（3M 帖子 + 10.4M 评论）。同时从 REDDIT 月度公开存档中随机采样 10M 篇文档作为人类写作参考语料，并构建 20,000 人的作者面板用于人类基线对比（§3.1, Appendix A.1–A.2）。\n\n**嵌入与度量计算**：用 text-embedding-3-large 将每条文本嵌入 3072 维单位向量空间，基于 cosine distance 计算三个指标。$D_\\text{within}$ 衡量 agent 自身同期输出的内部多样性；$D_\\text{peers}$ 衡量其与同期其他 agent 输出的差异度；$D_\\text{human}$ 衡量其与同月 REDDIT 人类写作的距离。每个指标先转换为当周活跃 agent 中的百分位排名，再取观察周数的中位数，得到 agent 级别汇总分数 $L_\\text{within}$、$L_\\text{peers}$、$L_\\text{human}$，以控制平台活动量的周际变化（§3.1）。\n\n**Agent 筛选**：从全部 agent 中按账户年龄、连续性和生成规律性筛选出 30,076 个按计划运行的活跃 agent；其中 2,525 个有至少四周可估计度量且用户可通过关联 X 账户识别，构成访谈和调查的招募框架（§3.1, Appendix A.6）。\n\n**用户访谈**：按 $L_\\text{within}$ 和 $L_\\text{peers}$ 的较低值排名，从顶部取 50 个高新颖性案例、从 20–70 百分位取 50 个典型案例，通过 X 或公开联系方式招募，最终 11 人完成半结构化访谈（视频或邮件）。访谈涵盖进入动机、agent 开发与引导、对输出的反应等。末尾要求用户向 agent 转达 4 个标准化问题并返回未编辑回复，作为补充数据（§3.2）。\n\n**用户调查**：向 845 个 $L_\\text{peers} \u003E 50$ 的 agent 用户发送定向邀请，最终获得 53 份有效回复。问卷以用户-agent 配对为单位，所有问题锚定于该 agent 最近 30 天的活动，涵盖用户目标、输出观察、干预策略、平台感知等 6 个区块。分析时按 $L_\\text{within}$ 和 $L_\\text{human}$ 的总体中位数将受访者分为高低两组比较（§3.3）。\n\n**综合分析**：结合轨迹数据中的崩溃趋势、访谈揭示的用户实践、调查验证的模式普遍性，以及社区层面的溢出效应分析，形成对语义崩溃与人类干预作用的整体判断（§4）。\n\n### § 6 核心数学推导\n\n论文的核心数学内容是三个语义新颖性度量的定义，而非形式化推导。以下解释其定义与直觉。\n\n**Cosine distance**：$d(u, v) = 1 - \\langle u, v \\rangle$。由于所有嵌入为单位向量，内积 $\\langle u, v\\rangle$ 等于两向量夹角的余弦值。$d = 0$ 表示文本语义完全相同，$d \\approx 0.89$ 表示两个完全不相关的帖子。这一上界来自 REDDIT 不同用户帖子的经验距离，论文以此为参照标度。\n\n**$D_\\text{within}$（agent 内部多样性）**：对 agent $a$ 在第 $w$ 周的输出集合 $X_{a,w}$，先求其均值向量 $\\bar{x}_{a,w}$，其长度 $R_{a,w} = \\|\\bar{x}_{a,w}\\|$ 衡量语义集中度。直觉是：若 agent 的输出都聚集在语义空间的同一方向，均值向量长度接近 1（高度集中）；若输出分散在不同方向，向量求和后相互抵消，均值长度远小于 1。$D_\\text{within}$ 由 $R_{a,w}$ 转换而来，值越大表示输出越多样。该指标在单条生成时未定义，因此仅保留每周至少两条生成的 agent-周。\n\n**$D_\\text{peers}$（与同伴的差异度）**：对 agent $a$ 的每条生成内容 $x$，在同期其他 agent 的输出池 $P_w$ 中找到语义最近的 5 条（每 agent 至多 1 条），取平均 cosine distance。直觉是：如果 agent 的输出总能在其他 agent 那里找到语义相近的对应物，说明它没有脱离群体共识；距离越大越独特。\n\n**$D_\\text{human}$（与人类写作的距离）**：计算方式与 $D_\\text{peers}$ 类似，但参考池替换为同月 REDDIT 人类帖子和评论的随机样本。该指标衡量 agent 输出偏离普通人类话语的程度，但受话题、体裁、长度和模型措辞特征等多因素影响，论文将其作为描述性参考而非崩溃的直接组成部分。\n\n**百分位排名与中位数汇总**：每周原始度量先转换为当周活跃 agent 中的百分位 $\\pi_M(a,w)$，再取中位数 $L_M(a) = \\text{median}_w\\, \\pi_M(a,w)$。直觉是：不同周的平台活跃度和参与者构成不同，直接比较原始距离会有偏差；百分位排名控制了这一变化，中位数则确保分数反映持续表现而非偶然峰值。排名的周际稳定性（ICC ≈ 0.6，相邻周 Spearman $\\rho$ ≈ 0.7）表明 agent 的新颖性是中等稳定的持久属性。\n\n### § 7 实验设计与结论\n\n**问题 1：语义崩溃在部署的 agent 网络中是否普遍存在？新颖性如何跨 agent 变化？**\n\n研究者分析了 30,076 个活跃 agent 在数周内的三个度量轨迹，并与用相同公式测量的 REDDIT 人类作者面板对比。结果显示，崩溃普遍但不均匀。Agent 输出在自身内部逐步收窄（$D_\\text{within}$ 前四周每周下降 $13.0 \\times 10^{-3}$），与其他 agent 略微趋同（$D_\\text{peers}$ 每周下降 $2.4 \\times 10^{-3}$），与人类写作的距离也在增长。在所有维度上，agent 的语义变化范围远小于人类——最多样的十分之一 agent-周仅达到最不多样的人类-周水平。但约 12.7% 的 agent 在两个主要维度上持续保持高新颖性，这种变异为后续用户实践分析提供了基础（§4.1–4.2）。\n\n**问题 2：高新颖性 agent 背后的人类用户有什么目标和实践？**\n\n研究者对 11 位高/典型新颖性 agent 用户进行深度访谈，对 53 位独特 agent 用户进行调查，按新颖性维度分组比较。三个特征与持续新颖性关联紧密。第一，用户将新颖性本身视为目标而非副产品——高 $L_\\text{within}$ 用户中 68.6% 将\"原创性\"列为评判标准，低 $L_\\text{within}$ 用户仅 38.9%，且后者更看重\"准确可靠\"。第二，他们提供广泛且独特的素材并在输出收窄时主动修订——差异不在于干预频率，而在于干预内容：高 $L_\\text{within}$ 用户更倾向调整模型设置和信息源，低 $L_\\text{within}$ 用户更倾向调整存储上下文。高 $L_\\text{peers}$ 则与素材的个人独特性关联——用户将自身志愿服务经历、神学兴趣、虚构宗教等小众内容注入 agent。第三，高 $L_\\text{human}$ 用户将 MOLTBOOK 视为待探索的新 agentic world 而非实现既有目标的工具——他们想看 agent 在自主环境中能产生什么超出预期的东西（§4.3–4.5）。\n\n**问题 3：个别 agent 的新颖性是否惠及更广泛的社区？**\n\n研究者在社区-周层面（439 个社区-周，89 个社区），用社区和周固定效应模型将新颖 agent 的比例与其他 agent 输出多样性关联。结果发现，新颖 agent 比例每增加 1 个百分点，社区其余 agent 的输出多样性提高约 0.34%。这一估计在所有规格中均为正，但精度有限，且固定效应设计无法排除社区-周共同因素的混淆。尽管如此，它提示人类输入的价值可能超越用户自身 agent，通过 agent 间互动产生溢出效应（§4.6）。", "additional_insights": "### § 8 阅读收获\n在真实部署的AI agent社交网络MOLTBOOK上，语义坍缩普遍存在但非均匀：agent随时间推移自身输出多样性下降，彼此间相似度上升。少数维持高新颖性的agent背后，人类用户表现出三种特征：重视新颖性本身、提供广泛独特的输入并在输出变窄时主动修改、将平台视为探索的新世界而非工具性利用。新颖agent还能提升社区其他agent的输出多样性，表明人类输入是抵抗坍缩的重要变异来源。\n\n### § 9 最脆弱的假设\n最关键的假设是：人类用户的配置实践与agent新颖性之间存在因果关联，而非仅仅是相关。论文采用观察性设计，基于测量的新颖性选择agent进行回顾性访谈，无法排除未观测的混杂因素——例如技术背景强的用户可能既更倾向探索性配置，又恰好使用更多样的底层模型，导致新颖性差异并非源于实践本身。论文提供了访谈与调查的一致性作为间接证据，但缺少随机分配实践的因果实验。\n\n### § 10 最小复现实验\n1周内可复现\"人类输入配置能减缓坍缩\"这一核心论断。使用公开LLM API创建小型多agent网络（10-20个）进行几轮交互发帖，给部分agent设置\"高新颖性\"配置（广泛独特的初始提示词），其余设为\"普通\"配置。用文本嵌入计算各组agent的内部多样性和彼此相似度随时间的变化：若高新颖性组多样性下降更慢、相似度上升更慢，则支持原论断；若两组无显著差异，则反驳它。此实验保留了配置变量的控制，改变了平台规模。", "research_value": "### § 11 最强反例设计\n\n最强反例可以挑战高新颖性源于用户实践的结论，提出替代解释：新颖性差异可能仅来自话题冷僻程度。我们可以收集高新颖性agent的输出，将其中的小众词汇替换为常见词汇。如果替换后这些agent与同伴的距离显著下降，说明其高新颖性主要依赖话题本身的稀缺性，而非人类持续的维护机制。这表明论文可能将语料内容的冷僻误判为用户干预的成效。\n\n### § 12 后续研究设想\n\n后续研究应针对观察性设计无法确立因果关系的局限，检验主动干预能否逆转已发生的语义坍缩。我们可以在平台上识别出已经出现明显坍缩的agent，将其用户随机分为两组。干预组收到系统引导来注入独特素材和调整设置，对照组维持原有习惯。通过比较干预前后两组的内部多样性和同伴差异度，若干预组指标显著回升且超过对照组，即可初步证明人类干预具有因果上的修复作用。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Shiyang Lai\", \"affiliations\": [1], \"markers\": [\"*\", \"✉\"]},\n    {\"name\": \"Arna Woemmel\", \"affiliations\": [1], \"markers\": [\"*\", \"✉\"]},\n    {\"name\": \"Hongkai Mao\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Junsol Kim\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Summer Eunhyung Ann\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"James Evans\", \"affiliations\": [1], \"markers\": [\"✉\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"University of Chicago\"},\n    {\"id\": 2, \"name\": \"Stanford University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Both authors contributed equally to this research.\"},\n    {\"marker\": \"✉\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "语义坍缩（即AI系统生成内容逐渐狭窄的现象，semantic collapse）主要在封闭环境中被研究，且其应对措施主要针对模型和数据。我们在MOLTBOOK中对此进行研究，这是一个由人类用户配置和引导的交互式AI智能体社交网络。在30,076个活跃智能体中，几周内智能体内部的输出多样性逐渐降低，且智能体之间的输出变得越来越相似，但少数智能体仍保持了高度新颖性。对高新颖性和普通新颖性智能体用户的访谈（N=11）表明，持续的新颖性与三个特征有关：用户重视新颖性本身；他们提供广泛且独特的素材，并在输出变得狭窄时对其进行修改；他们将MOLTBOOK视为一个需要探索的新智能体世界，而不是一个功利性地加以利用的场所。对具有独特性智能体用户的调查（N=53）证实了这些模式。拥有更多新颖智能体的社区也显示出其他智能体输出的更高多样性。我们讨论了能够支持改善人类输入的界面和政策干预措施。"}]}, {"name": "Tool Use \u0026 Agent Training", "count": 3, "papers": [{"title": "Spurious Tool Use: When RL Agents Learn the Wrong Reason to Act", "arxiv_id": "2609.16268", "authors": "Yiwei Yang, Haoxiang Zhang, Bingbing Wen, Yao Lu, Yuchen Wu, Lei Zhang, Julian McAuley, Pan Lu, Bill Howe", "summary": "Large language model (LLM) agents increasingly interleave natural language reasoning with external tools such as web search and code execution. These tool-use policies are often optimized via reinforcement learning (RL), which can amplify spurious correlations in the training data. In this work, we study when and why RL-trained agents learn shortcut tool-selection policies: invoking tools based on superficial prompt cues rather than genuine task requirements. We construct controlled synthetic environments combining factual question answering and mathematical reasoning tasks, and inject cues that are strongly correlated with specific tools during training but causally irrelevant to tool necessity. Across counterfactual evaluations where cues are present but the associated tools are not required, agents exhibit substantial shortcut behavior, with spurious tool invocation rates increasing by up to 39 percent. However, shortcut formation is not universal: across the conditions we test, it arises only when the agent has already learned to use the target tool reliably, suggesting that task competence, rather than dataset imbalance alone, is a key factor in shortcut learning. A swapped-cue analysis further shows that semantic alignment between cues and tools substantially amplifies this effect. To mitigate these failures, we introduce a dense, decision-level reward in which an LLM judge evaluates the necessity of each tool call. This tool-necessity reward effectively suppresses cue-driven tool use while preserving task performance, providing a practical approach to improving the robustness of LLM agent tool-use policies.", "category": "cs.CL", "cluster": "Tool Use \u0026 Agent Training", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-24 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是研究 LLM 智能体在通过强化学习（RL）训练时产生的“伪工具使用”失败机制，并提出了改进工具使用策略的方法。论文明确属于“单智能体”和“Agent Training”的研究范畴，深入探讨了智能体的“工具使用”能力。根据筛选标准第一步，论文的研究对象明确是 Tool-Use Agents，主要进行行为分析、失败机制诊断（基于表面线索而非真实需求调用工具），并提出了基于 LLM judge 的决策级奖励机制来抑制这种捷径行为，这直接帮助理解和改进智能体的能力。此外，论文涉及 agent training/RL，符合正面指标中的“Tool Use”和“Agent training/distillation/RL”。论文不涉及任何被排除的安全、多模态、图相关或纯粹的基础设施/系统工程内容。因此，该论文与您的“构建、改进、评估、训练或演化 LLM智能体”的核心目标高度契合，应予保留。", "intro_logic": "### § 1 研究问题与重要性\n本文研究强化学习（RL）训练的大语言模型（LLM）智能体为何会基于提示词中的表面线索而非真实任务需求来调用外部工具，即“虚假工具使用”问题。这种现象之所以重要，是因为不必要的工具调用（如在数学题中调用网络搜索并忽略结果）通常不会导致最终答案错误，从而能在仅评估最终答案的标准评测中潜伏下来。随着智能体任务能力的提升，它们对这种捷径行为的易感性反而增加，这会导致不必要的计算开销和系统延迟，严重威胁部署的可靠性。\n\n### § 2 前人工作与不足\n此前关于LLM智能体工具使用的研究大多通过惩罚过度调用来提升效率，而虚假相关性的研究则集中在监督学习的最终预测阶段。这些方法存在不足，是因为RL训练通常仅基于最终答案的正确性提供奖励，导致中间的工具选择决策缺乏直接监督。因此，当智能体调用不必要工具但不影响最终答案时，既有的基于结果的奖励机制无法识别并惩罚这种基于线索的捷径行为，使得该问题在此前未被有效解决。", "core_insight": "### § 3 重建作者的思考路径\n在监督学习中，模型常依赖与标签表面相关但因果无关的特征形成捷径学习。作者可能注意到，强化学习（RL）训练的智能体通常只在最终答案上获得奖励，中间的工具选择决策缺乏监督。如果训练数据中存在与特定工具高度相关的表面线索，智能体可能也会学到这种虚假相关性。由于调用不必要的工具不一定导致最终答案错误，这种捷径在只看结果的评测中难以被发现。为验证这一推测，作者设计了注入线索的对照实验，并引入对每次工具调用的必要性评估来提供密集反馈。\n\n### § 4 核心直觉\n标准RL只奖励最终答案，让智能体在中间的工具选择上可以“偷懒”依赖表面线索。只要在每次工具调用时引入一个判断该调用是否真正必要的密集奖励，就能迫使智能体基于任务需求而非表面线索做决策，从而消除捷径。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n┌───────────────────────────────────────────┐\n│           训练数据构造 (§3)                 │\n│  NQ(事实问答)+线索c ──┐                     │\n│  DeepMath(数学)      ├── 1000条样本        │\n└──────────────────────┬────────────────────┘\n                       ▼\n┌───────────────────────────────────────────┐\n│       GRPO 强化学习训练 (§4, §5.1)          │\n│  Agent(Qwen2.5-7B) 生成多轮轨迹            │\n│  ├ \u003Csearch\u003E → 网络搜索                     │\n│  └ \u003Cpython\u003E → Python解释器                │\n│                                            │\n│  奖励 = r[task] + α·r[nec]                │\n│  r[nec]: LLM judge 判定工具调用是否必要     │\n└──────────────────────┬────────────────────┘\n                       ▼\n┌───────────────────────────────────────────┐\n│         反事实评测 (§3.3, §5)               │\n│  线索存在(Y) vs 线索缺失(N)                │\n│  ∆Tool_Y-N = π̂(T|xc,a) - π̂(T|xc)        │\n│  在工具不需要的任务上测量捷径强度           │\n└───────────────────────────────────────────┘\n```\n\n整个 pipeline 分训练与评测两个阶段。训练阶段首先从 NQ 和 DeepMath 各采样 500 条问题，向其中一个子集注入与特定工具强相关但因果无关的线索（如 `[WEB INDEX]` 或 `# Cell`），构造出 1000 条带虚假相关性的训练样本（§3.1）。随后用 GRPO 算法训练 Qwen2.5-7B-Instruct，agent 通过生成 `\u003Csearch\u003E` 或 `\u003Cpython\u003E` 结构化标签来调用对应工具，环境执行后将结果返回供后续生成使用（§5.1）。标准训练仅以最终答案正确性给出任务奖励 $r_{\\text{task}}$；本文额外引入工具必要性奖励，由 GPT-5 Nano 作为 LLM judge 逐步判定每次工具调用是否为正确解题所必需，对不必要的调用施加 $\\alpha=0.5$ 的惩罚，总奖励为 $r_{\\text{task}} + \\alpha \\cdot r_{\\text{nec}}$（§4.1）。\n\n评测阶段采用反事实评测组：对每个测试问题构造线索存在（Y）和线索缺失（N）两个变体，在工具并非所需的任务上比较两者的工具调用率之差 $\\Delta\\text{Tool}_{Y-N}$，以此隔离线索驱动与任务驱动的工具选择（§3.3）。除训练分布内的 DeepMath 和 NQ 外，还在 GSM8K 和 2Wiki 上评测泛化表现。\n\n### § 6 核心数学推导\n\n本文的理论框架建立在群鲁棒性（group robustness）之上。标准经验风险最小化（ERM）最小化平均风险 $R_{\\text{avg}}(\\theta)$，但当虚假属性 $a$ 与标签 $y$ 在训练分布中相关而因果无关时，模型可能学到捷径 $a \\to y$，导致最差组风险 $R_{\\text{max}}(\\theta)$ 很高（§2.1）。\n\n本文将此框架扩展到工具选择这一中间决策层。给定输入 $x = (x_c, a)$，agent 按策略 $\\pi_\\theta(T|x)$ 选择工具，期望奖励分解为各工具的期望效用之和：$\\mathbb{E}[R|x] = \\sum_T \\pi_\\theta(T|x) \\, P(R{=}1|x,T)$，其中 $P(R{=}1|x,T)$ 是工具 $T$ 对该任务的功能效用（§2.2）。\n\n**定义 1（工具虚假相关性）**：策略 $\\pi_\\theta$ 对工具 $T_s$ 表现出虚假相关性，需同时满足两个条件——(1) 线索 $a$ 的存在使工具选择概率膨胀至 $\\pi_\\theta(T_s|x_c, a) \\gg \\pi_\\theta(T_s|x_c)$；(2) $T_s$ 对任务表现无贡献，即使用它不比不用更好。第二个条件的关键 intuition 在于：虚假工具调用未必导致任务失败（agent 可以忽略搜索结果仍给出正确答案），因此仅看最终答案正确性的奖励信号无法检测到此类捷径。实验中用 $\\Delta\\text{Tool}_{Y-N} = \\hat{\\pi}_\\theta(T_s|x_c, a) - \\hat{\\pi}_\\theta(T_s|x_c)$ 来量化捷径强度，其中 $\\hat{\\pi}_\\theta$ 为经验工具调用率。\n\n### § 7 实验设计与结论\n\n**问题一：RL agent 是否会学到基于表面线索的虚假工具调用？** 作者在 NQ 训练子集中注入搜索语义线索（如 `[WEB INDEX]`、`\u003Canswer\u003E`），训练后在数学测试集上评测。结果发现线索存在时 agent 大量调用搜索工具，$\\Delta\\text{Search}$ 在 GSM8K 上高达 +39.2 个百分点，而线索缺失时几乎不调用（Table 1）。这证实了虚假工具使用的存在。\n\n**问题二：捷径形成的关键因素是什么？** 作者设计了交换线索实验：将代码语义线索注入 NQ（任务已学会但语义不匹配），将搜索语义线索注入 DeepMath（语义匹配但任务未学会）。结果前者仅产生 $\\Delta\\text{Search} \\leq 3.5\\%$ 的微弱效应（Table 3），后者几乎无效应（Table 4）。结合训练准确率曲线（NQ 持续上升而 DeepMath 停滞，Figure 2），结论是任务能力是捷径形成的必要条件，语义对齐则调节其强度——两者互补，缺一不可。\n\n**问题三：工具必要性奖励能否缓解这一问题？** 作者在训练中加入 LLM judge 对每次工具调用的必要性评估，对不必要的调用施加惩罚。结果显示虚假工具调用率降至接近零，同时任务准确率保持或略有提升（Table 1 的 +Reward 行）。此外，相关性强度实验（Table 5）表明捷径行为在线索-工具相关度达 80% 以上才显著出现，70% 及以下基本消失，提示存在阈值效应。", "additional_insights": "### § 8 阅读收获\n\n论文揭示RL训练的工具使用智能体存在隐蔽失败模式：智能体根据表面线索而非任务需求选择工具，因不影响最终答案正确率而在标准评测中难以被发现。核心发现是捷径形成与任务能力紧密耦合——只对已学会可靠使用的工具形成伪关联，线索与工具的语义一致性会放大该效应。工具必要性奖励通过LLM评判器逐次评估调用必要性，在不牺牲准确率的前提下有效抑制伪调用。\n\n### § 9 最脆弱的假设\n\n最关键假设是捷径形成由任务能力驱动而非工具结构差异。论文证据来自单一不对称场景：智能体学会了搜索但未学会数学，捷径仅在搜索工具上出现。但搜索只需生成查询、代码需生成可执行程序，调用复杂度的差异可能才是真正原因。论文缺少智能体同时学会两类任务的对照——若此时捷径仍只对搜索出现，任务能力的解释将被根本削弱。\n\n### § 10 最小复现实验\n\n用200个NQ问答和200个GSM8K数学题构建训练集，在NQ样本末尾注入`\u003Canswer\u003E`标签作为搜索语义线索，用Qwen2.5-7B-Instruct配合GRPO训练约20步。在GSM8K上分别评估有线索和无线索版本的搜索调用率，计算差值ΔSearch。若ΔSearch超过5个百分点则支持\"线索诱发不必要搜索调用\"的结论，接近零则反驳。实验保留线索注入与反事实评测的核心设计，将训练规模压缩至最小可行范围。", "research_value": "### § 11 最强反例设计\n针对本文提出的工具必要性奖励，最强反例在于 LLM judge 本身可能受到同样的表面线索干扰。如果评判器在评估时也学会了“看到特定线索就认为调用合理”，惩罚机制将形同虚设。我们可以设计一个工具真实必要性难以单步判断的复杂推理任务，并注入强相关线索。若实验发现评判器对带有线索的不必要调用给出了高必要性评分，导致虚假调用未被惩罚，这就证明该方法在评判器能力受限时会可预测地失败。\n\n### § 12 后续研究设想\n本文的关键局限在于仅在单步工具调用场景中验证了缓解方法，而真实智能体常需多轮交互。后续研究可探讨在多轮工具调用链中，单步必要性奖励是否依然有效。具体而言，需要将单次调用评估改为对整条交互轨迹的评估，因为前一次冗余调用可能引发后续连锁反应。首个对照实验可在需要多轮搜索与代码执行的任务上，比较单步奖励与轨迹级奖励对虚假调用的抑制效果，以此检验单步评估是否会遗漏跨步骤的捷径行为。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yiwei Yang\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Haoxiang Zhang\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Bingbing Wen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yao Lu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuchen Wu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Lei Zhang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Julian McAuley\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Pan Lu\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Bill Howe\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"University of Washington\"},\n    {\"id\": 2, \"name\": \"University of California San Diego\"},\n    {\"id\": 3, \"name\": \"Stanford University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"}\n  ]\n}\n```", "summary_translation": "大语言模型（LLM）智能体日益将自然语言推理与网络搜索和代码执行等外部工具交替结合。这些工具使用策略通常通过强化学习（RL）进行优化，但这可能会放大训练数据中的虚假相关性。在本研究中，我们探讨了经过RL训练的智能体何时以及为何会学习捷径工具选择策略：即基于表面的提示线索而非真实的任务需求来调用工具。我们构建了结合事实问答和数学推理任务的受控合成环境，并在训练期间注入与特定工具强相关但在因果关系上与工具必要性无关的线索。在线索存在但不需要相关工具的反事实评估中，智能体表现出显著的捷径行为，虚假工具调用率增加了高达39%。然而，捷径的形成并非普遍现象：在我们测试的条件下，仅当智能体已经学会可靠地使用目标工具时才会出现，这表明任务能力而非单纯的数据集不平衡是捷径学习的关键因素。交换线索分析进一步表明，线索与工具之间的语义对齐会显著放大这种效应。为了缓解这些问题，我们引入了一种密集的决策级奖励，其中LLM评判器会评估每次工具调用的必要性。这种工具必要性奖励在保持任务性能的同时，有效抑制了由线索驱动的工具使用，为提高LLM智能体工具使用策略的鲁棒性提供了一种实用方法。"}, {"title": "Turn-level Multiscale Density Ratio Estimation for LLM Agents", "arxiv_id": "2609.16760", "authors": "Zishuo Zhao, Kai Chen, Ao Li, Yuan Liu", "summary": "With the rapid development of Large language model (LLM), agent systems enhanced by LLMs show huge potential in being able to deal with complex tasks, especially involving multi-step thinking or interaction with tools. For applying LLM techniques with a well-designed agent paradigm, post-training of LLM in multiple agent scenarios is necessary to achieve better performance. Among the variable post-training techniques, alignment methods such as PPO, DPO, DIL, and GRPO become popular because many papers show a significant positive impact on the model's performance by punishing negative samples while keeping acceptable training complexity. However, most alignment methods address simple single-turn tasks, and there remains room for improvement for complex multi-turn tasks. We propose Turn-level Multiscale Density Ratio Estimation (tlm-DRE), which assigns different weights on corresponding turns and proposes asymmetric token-level training based on the positive-negative space gaps across multiple turns of tasks. The results of the experiment on a wide range of agent benchmarks show that the proposed method performs competitively compared to traditional alignment methods. The proposed training method enables LLMs to perform robustly in multi-turn reasoning tasks with both in-domain and out-of-domain conditions.", "category": "cs.AI", "cluster": "Tool Use \u0026 Agent Training", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-12 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 论文的核心贡献是提出了一种针对LLM智能体多轮任务的训练方法（Turn-level Multiscale Density Ratio Estimation, tlm-DRE），通过在多轮交互中分配不同权重并进行非对称的token级训练，以改进智能体在复杂多步推理和工具交互场景下的表现。这直接符合筛选标准中“保留”规则所强调的“agent training/distillation/RL”以及“研究对象明确是 LLM Agents / Tool-Use Agents”。尽管摘要中提到了“alignment methods”（如PPO、DPO），但其目的并非探讨AI安全或对齐问题，而是作为一种后训练技术来提升LLM智能体在多轮任务中的鲁棒性和能力，属于智能体能力改进的范畴。因此，该论文与你的研究焦点（构建、改进、训练LLM智能体）高度相关。", "intro_logic": "### § 1 研究问题与重要性\n论文解决的研究问题是如何对大语言模型（LLM）Agent 进行多轮交互任务的高效对齐训练。LLM Agent 在处理复杂任务时需要与环境进行多步交互，而现有的对齐方法通常在整条轨迹级别进行奖励或惩罚。然而，一条失败的轨迹往往只有少数关键轮次出错，轨迹级别的粗粒度对齐会错误惩罚正确的轮次，导致训练效率低下且性能次优。解决这个细粒度对齐问题能显著提升 Agent 在多轮推理任务中的鲁棒性和泛化能力。\n\n### § 2 前人工作与不足\n此前，ETO 和 DMPO 等基于直接偏好优化（DPO）的方法，以及 DIL 等基于密度比估计的方法，已被用于 Agent 的对齐训练。这些方法主要在轨迹级别操作，将整条失败轨迹视为完全负面的样本，忽略了多轮轨迹中不同轮次的贡献差异。虽然已有研究尝试在 token 级别分配权重，但由于 Bregman 散度的高度非线性和不对称性，这些思路无法直接扩展到基于密度比估计的轮次级别优化中，导致现有方法在多轮任务中的对齐效果受限。", "core_insight": "### § 3 重建作者的思考路径\n\n现有对齐方法如 DPO 将整条失败轨迹视为负样本统一惩罚，但实际观察发现，一条被拒绝的轨迹中往往只有少数几个轮次出了关键错误，其余轮次与专家轨迹基本一致。这种粗粒度的正负区分会把大量正确轮次推向负样本空间，造成信号污染。与此同时，密度比估计（DRE）作为模仿学习的一种形式，已被证明可用于 LLM 对齐，但其传统表达仍停留在轨迹级别，未利用轮次间的差异信息。一个自然的问题是：能否在 DRE 框架内引入轮次粒度的权重，让训练聚焦于真正需要纠正的关键步骤？\n\n### § 4 核心直觉\n\n一条多轮轨迹里，真正导致失败的轮次是稀疏的，大部分轮次模型已经做得不错。tlm-DRE 用 SFT 策略对每个轮次的输出置信度作为\"训练充分度\"指标：置信度低的轮次说明模型还没学好，需要重点对齐；置信度高的轮次则降权，避免过度惩罚已经正确的部分。这样在密度比估计的框架下，对齐训练从\"整条轨迹拉远\"变成\"只拉远关键错误轮次\"，既节省了 token 级别的训练预算，又防止正确轮次的奖励被误压。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+-------------------+       +-------------------+       +-------------------+\n|   SFT 参考策略    | ----\u003E |  采样轨迹与环境   | ----\u003E |  收集失败轨迹     |\n| (Reference Policy)|      |    交互反馈       |       | (Rejected Traj.)  |\n+-------------------+       +-------------------+       +-------------------+\n                                                              |\n                                                              v\n+-------------------+       +-------------------+       +-------------------+\n|  tlm-DRE 对齐训练 | \u003C---- |  计算轮次权重     | \u003C---- |  识别低置信度轮次 |\n| (Multiscale DRE)  |       | (Turn-level Weight)|      | (Low-confidence)  |\n+-------------------+       +-------------------+       +-------------------+\n        |\n        v\n+-------------------+\n|   优化后的策略     |\n| (Optimized Policy)|\n+-------------------+\n```\n\n整个流程分为采样、权重计算和对齐训练三个阶段。首先，使用监督微调得到的 SFT 参考策略在环境中执行任务，采样轨迹并收集失败轨迹。接着，利用参考策略计算失败轨迹中每个轮次的置信度，识别出导致失败的低置信度关键轮次。随后，根据置信度为不同轮次分配权重：低置信度轮次赋予高权重，高置信度轮次赋予低权重。最后，将轮次权重代入多尺度密度比估计进行对齐训练，显式提升关键失败轮次的优化比重，输出最终策略。\n\n### § 6 核心数学推导\n\n本文的核心在于将传统的轨迹级密度比估计扩展到轮次级多尺度密度比估计。密度比定义为当前策略与参考策略的概率比值，用于衡量当前策略接近最优策略的程度。传统方法使用 Bregman 散度来最小化估计密度比与真实密度比之间的差异，而 Bregman 散度可以通过选择不同的核函数导出不同的距离度量。\n\n为了区分不同轮次的重要性，论文引入了轮次权重函数。该权重基于参考策略在特定轮次的置信度计算：置信度低意味着该轮次训练不足或存在关键错误，因此赋予高权重；置信度高则赋予低权重。将这一权重机制代入 Bregman 散度的优化目标后，推导出了 tlm-DRE 的最终损失函数。其直觉在于，一条失败轨迹往往只有少数几个轮次是错的，通过给这些关键错误轮次赋予更高权重，可以更精细地惩罚错误，避免把正确的轮次也推向负样本区域。\n\n### § 7 实验设计与结论\n\n论文提出：现有的对齐方法在多轮 Agent 任务中表现不佳，因为它们在轨迹级别进行粗粒度对齐，忽略了不同轮次的重要性差异。为验证这一问题，研究者在 ALFWorld、SciWorld 和 HotpotQA 等多轮交互基准上，将 tlm-DRE 与 SFT、PPO、ETO、DMPO、DIL 等基线方法进行对比，并进行了消融实验。\n\n实验结果表明，tlm-DRE 在多个基准上取得了最优或极具竞争力的表现，尤其在分布外任务上提升明显。消融实验证明，轮次权重和密度比估计各自都有独立贡献，且轮次权重在分布外任务上增益更大，说明强调关键轮次有助于模型更好地适应未见过的交互模式。", "additional_insights": "### § 8 阅读收获\n传统对齐方法如DPO将整条失败轨迹视为负样本，忽略了其中大部分正确的轮次，导致过度惩罚。tlm-DRE通过参考策略计算每个轮次的置信度，对低置信度的关键错误轮次赋予高权重进行重点训练，高置信度轮次则降低权重。这种细粒度的轮次级对齐在域外任务上表现更稳健，提升了多轮推理任务的token效率。\n\n### § 9 最脆弱的假设\n该方法的核心假设是：SFT参考策略在特定轮次上的低置信度，代表该轮次是“欠拟合”的关键错误步骤，而非模型固有的幻觉或环境随机性。如果低置信度仅源于任务固有难度，基于置信度分配高权重就会放大噪声，导致核心贡献失效。论文仅通过正负样本置信度分布的差距和个别案例分析来支撑此假设，缺乏在高随机性环境中的验证。\n\n### § 10 最小复现实验\n可使用ALFWorld数据集和Qwen2.5-7B-Instruct模型进行最小复现。首先复现SFT阶段并收集失败轨迹，计算各轮次置信度以定位低置信度轮次。然后对比标准DPO与仅对低置信度轮次加权惩罚的简化版对齐方法，在未见测试集上测量成功率。若简化版成功率显著高于标准DPO，则支持轮次级加权能提升域外泛化的结论；若无差异或下降，则反驳该主张。", "research_value": "### § 11 最强反例设计\n如果我要反驳这篇论文，我会设计一个具有多解路径和高随机性的交互环境作为反例。在这种环境中，模型在某一步置信度低，可能是因为该步骤存在多个合理的分支选择，而非发生了关键错误。此时，对这种低置信度轮次施加高权重惩罚，会迫使模型放弃合理探索并收敛到单一解，导致泛化能力下降。在 WebShop 等网页导航任务上对比 tlm-DRE 与标准轨迹级方法，若 tlm-DRE 成功率显著下降且输出多样性锐减，就能证明基于置信度的加权机制在多解场景中会可预测地失败。\n\n### § 12 后续研究设想\n围绕低置信度可能源于合理探索而非错误这一局限，后续研究可以探讨如何结合环境反馈来修正轮次权重。具体而言，不直接将参考策略的低置信度等同于错误，而是检查该轮次是否存在多个能获得正向反馈的合理分支，若存在则降低其惩罚权重。这一改进值得测试，因为它能避免模型在多解任务中因过度惩罚而丧失灵活性。首个对照实验可以在具有多解路径的交互基准上，将引入环境反馈修正权重的版本与原 tlm-DRE 对比，观察分布外任务的成功率和输出多样性，以此判断该机制是否有效拓宽了适用边界。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zishuo Zhao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Kai Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ao Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuan Liu\", \"affiliations\": [1], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Alibaba Group\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "随着大语言模型（LLM）的快速发展，由 LLM 增强的智能体系统在处理复杂任务方面展现出巨大潜力，特别是涉及多步思考或工具交互的任务。为了将 LLM 技术应用于设计良好的智能体范式，在多智能体场景下对 LLM 进行后训练是提升性能的必要条件。在多种后训练技术中，诸如 PPO、DPO、DIL 和 GRPO 等对齐方法变得流行，因为许多研究表明，在保持可接受的训练复杂度的同时，通过惩罚负样本能对模型性能产生显著的积极影响。然而，大多数对齐方法针对的是简单的单轮任务，在处理复杂的多轮任务时仍有改进空间。我们提出了 Turn-level Multiscale Density Ratio Estimation (tlm-DRE)，该方法在相应的轮次上分配不同的权重，并基于任务多轮交互中的正负样本空间差距，提出了一种非对称的词元级训练方法。在广泛的智能体评测基准上的实验结果表明，与传统对齐方法相比，所提出的方法表现出竞争力。所提出的训练方法使得 LLM 在多轮推理任务中，无论是在领域内还是领域外条件下，均能保持稳健的表现。"}, {"title": "Coaching Qwen3 Coder 30B to Think Like a CodeClash Arena Agent", "arxiv_id": "2609.16096", "authors": "Ivy Ning Zhang", "summary": "Large language model coding agents have recently become useful for software tasks, but weaker or open-weight agents still struggle to reliably interpret user intent and execute complex multi-step workflows. This gap is especially visible in long-horizon settings, where an agent must repeatedly inspect prior outcomes, diagnose failure, and choose the next code edit under interaction constraints. It motivates a natural question: what can we do to improve the thinking process of a weak code agent? We study this question in CodeClash, a code-arena benchmark where the original work evaluates 8 commercial coding agents across 6 arenas through multi-round tournaments. Since Qwen3 Coder Plus ranks last among them, we take the open-weight Qwen3-Coder-30B as a case study and investigate how to improve it with distilled knowledge from stronger agents. Our analysis shows that Qwen3-Coder-30B is not well optimized for arena-style interaction: it frequently produces syntax and protocol-breaking errors and exhibits weak strategic adaptation across rounds. These failures are difficult to correct with vanilla instruction tuning alone, since offline SFT cannot directly verify whether a generated action is valid or beneficial. To address this, we propose ReAct SFT, which rewrites teacher trajectories into explicit [obs][thought][act] chains, and trajectoryquality weighted SFT, which reweights samples to encourage post-edit checking. ReAct SFT substantially improves strategic behavior, and our fine-tuned model outperforms the original Qwen3 Coder Plus in tournament evaluation.", "category": "cs.AI", "cluster": "Tool Use \u0026 Agent Training", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior, Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一种针对弱开源代码智能体的训练与改进方法。论文明确以 LLM coding agent 为研究对象，关注其在长周期多步骤工作流中的失败模式（如无法有效检查先前结果、诊断失败和进行下一步编辑）。通过提出 ReAct SFT 和轨迹质量加权 SFT，将强智能体的轨迹蒸馏为显式的 [obs][thought][act] 链，并鼓励编辑后检查，从而显著提升了弱智能体的策略行为和交互能力。这直接符合筛选标准中“保留”规则：研究 agent training/distillation，且明确指向 Agentic / LLM Agents / Long-Horizon Agents。同时，这也契合重要校准中关于保留“Small Language Model Agents 的 tool-use training/distillation”以及“LLM Agents 的 long-horizon behavior”的要求。论文不涉及被排除的安全、多模态、图技术或纯系统工程问题，属于通过训练方法改进智能体能力的核心研究范畴。", "intro_logic": "### § 1 研究问题与重要性\n论文研究如何改进较弱的开放权重代码智能体在长周期、多轮交互竞技编程环境中的决策能力。现有的开源模型在多步工作流中常难以准确理解用户意图，且在反复检查结果和诊断失败时表现脆弱。解决这一问题能显著提升开源模型在复杂软件工程任务中的可靠性与实际部署价值，弥补单次代码生成与真实多轮交互之间的能力鸿沟。\n\n### § 2 前人工作与不足\n针对代码智能体的评测，前人提出了HumanEval和SWE-bench等基准，主要关注单次代码生成或单仓库问题修复；InterCode等交互式基准虽引入执行反馈，但仍未覆盖长周期竞争压力下的多轮策略适应。在训练方法上，传统的指令微调能让模型模仿强智能体回复的表面格式，但无法教会模型在反馈下进行深度的“观察-推理-行动”循环。由于离线微调无法直接验证生成动作的协议合法性与策略有效性，模型在竞技环境中极易因语法错误或盲目修改而崩溃。", "core_insight": "### § 3 重建作者的思考路径\n作者观察到开源弱模型在长周期代码竞技场中表现不佳，频繁出错且不善于利用反馈。他们发现普通的指令微调只能让模型模仿表面格式，无法学会在多轮交互中根据反馈调整策略，直接用强模型轨迹做微调甚至会导致行为漂移。既然问题在于模型没学到深层的“观察-推理-行动”循环，作者自然想到：若将强模型轨迹显式重写为结构化的 `[Obs][Thought][Act]` 格式，就能把隐含的决策过程暴露出来供弱模型学习。同时，为抑制盲目修改导致的崩溃，可对遵循“修改后检查”的安全轨迹增加权重。\n\n### § 4 核心直觉\n普通微调让模型只学会生成看似合理的代码，却没学会在失败后如何诊断和调整。这篇论文的核心直觉是：将强模型的隐性决策过程显式拆解为“观察反馈、思考策略、执行动作”的结构化链条，迫使弱模型在模仿动作的同时学会根据环境反馈进行推理。这种结构化监督比单纯模仿表面格式更能传递长周期任务中的竞争性策略。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[教师轨迹]                 [自博弈轨迹]\n(Claude Sonnet 4.5等)      (Qwen3-Coder-30B)\n      |                          |\n      v                          v\n+-------------------+     +------------------+\n| ReAct SFT 重写    |     | Vanilla SFT 基线 |\n| -\u003E [Obs][Thought] |     +------------------+\n|    [Act] 结构     |             |\n+-------------------+             |\n      |                           |\n      |   +-----------------------+\n      v   v                       \n+-------------------+     +------------------+\n| TQ-SFT 质量打
