iliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Shilin Yan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ekko He\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zicheng Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zijian Zou\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Guannan Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuwei Wu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Zhi Gao\", \"affiliations\": [2], \"markers\": [\"†\"]},\n    {\"name\": \"Hongwei Xue\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Accio Team, Alibaba Group\"},\n    {\"id\": 2, \"name\": \"Beijing Institute of Technology\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding authors. This work was done during Xintong Zhang's internship at the Accio Team, Alibaba Group.\"}\n  ]\n}\n```", "summary_translation": "Video deep research 通过联合理解视频内容和从开放 Web 检索外部知识来回答复杂问题。然而，多样化的问题和视频需要不同的 tool-use 策略，不恰当的 tool calls 会产生错误的结果。不确定的 grounding 和 retrieval 也使得不必要的交互成本高昂且容易出错，增加了 latency 和 reasoning 错误。为了应对这些挑战，我们提出了 AdaVDR，这是一个具有 adaptive tool invocation 和 reflection 能力的 adaptive video deep research agent。AdaVDR 根据任务及其能力选择 tools，并且仅在不可靠的 intermediate results 需要纠正时才进行回溯。为了实现这些能力，我们开发了一个 video deep research data construction pipeline。我们首先在多样化的视频中发现与 retrieval 相关的 events 和 entities，并通过 grounding 和 external retrieval 获取详细信息，以构建高质量的 QA pairs。对于每个 QA，task-specific prompts 将信息获取过程组织成 tool-use trajectory，允许不同的问题和视频类型遵循不同的 grounding 和 retrieval 策略。我们进一步引入了 model-conditioned tool necessity filtering，它根据 target model 的 video understanding 和 internal knowledge 评估 tool calls，移除模型可以绕过的 tools 或 tool chains。这生成了为 target model 的 video understanding 能力和知识量身定制的 trajectories。使用该 pipeline，我们构建了 training data 和 VDR-EE，这是一个涵盖 entity-centric 和 event-centric 问题的 benchmark。我们执行 supervised fine-tuning，随后进行带有 redundancy-aware reward 的 reinforcement learning，以加强 adaptive tool invocation 和 reflection。实验表明，我们的方法在 VDR-EE 上评估的 open-source models 中表现最佳，并在 VideoDR 上比其 base models 有显著提升。"}]}, {"name": "Agent Benchmarking \u0026 Evaluation", "count": 3, "papers": [{"title": "Skill Issue: Are Skills Language-Invariant in LLMs?", "arxiv_id": "2608.25832", "authors": "Bobby Cheng, Adam Gaber, Zhengyuan Liu, Catherine Arnett, Omer Goldman, Cheston Tan, Leshem Choshen", "summary": "Large language models access knowledge inconsistently across languages, but to what extent do they differ in their skill sets when interacting with different languages? This work quantifies cross-lingual skill inconsistency orthogonally from knowledge and general benchmark performance. We do this via multilingual self-play: two instances of the same model compete in a text-based game, each interacting through a different language interface. Since the model, opponent, rules, state space, and available actions remain fixed, this setting isolates the effect of language on the model's realized behavior. We build a multilingual extension to TextArena and evaluate three open-weight models across eight languages and six games covering spatial reasoning, imperfect information, resource allocation, and repeated interaction. We find that the same model can exhibit markedly different playing strength across languages, with systematic variation in win--loss margins, invalid actions, and strategic tendencies. Detailed analyses reveal language-specific failures in spatial reasoning, card-conditioned decisions, and optimal move selection. In some settings, changing only the intermediate reasoning language recovers much of the lost performance, suggesting that language can affect different stages of the decision process. These results show that skill discrepancies are a measurable major roadblock in the development of truly multilingual models. Better understanding these discrepancies can help us design models that perform more equitably across languages.", "category": "cs.CL", "cluster": "Agent Benchmarking \u0026 Evaluation", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是通过多语言自我博弈在基于文本的游戏中评估LLM的跨语言技能一致性。论文构建了TextArena的多语言扩展，将LLM作为游戏智能体进行多步决策和交互，并详细诊断了智能体在不同语言接口下的失败机制、行为边界和策略差异。根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents / Multi-Agent LLMs，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。” 该研究明确以文本游戏中的LLM智能体为研究对象，属于行为分析和评估基准范畴，其结论有助于深入理解智能体在多语言环境下的能力边界，因此符合研究范围。", "intro_logic": "### § 1 研究与问题重要性\n\n论文提出的核心研究问题是：同一个 LLM 在通过不同语言接口交互时，是否会展现出不同的 skill sets——即除了已知的 cross-lingual knowledge inconsistency 之外，模型在 reasoning、planning 和 decision-making 等行为能力上是否也因语言而异。作者将这一现象命名为 cross-lingual skill inconsistency，并强调它必须与 knowledge accessibility 和 overall benchmark performance 正交分离。为回答这一问题，作者设计了一个 multilingual self-play 实验范式：同一模型的两个实例在相同的 text-based game 环境中对弈，各自通过不同语言的接口接收 observation 并输出 action，而 board states、cards、numerical information、action spaces 和 game rules 全部保持固定。这一设置将语言对模型行为的影响从知识储备和任务难度中隔离出来，使得胜负差异只能归因于语言接口对 skill 表达的调节作用。\n\n这个问题的重要性在于，LLMs 正快速走向 multilingual，但其在不同语言下的表现不平等已被广泛记录。如果模型在某些语言中不仅检索不到相同的知识，连推理和决策能力本身也发生退化，那么 multilingual 模型就无法被视为 language-agnostic 系统，其在全球范围内的公平部署和可靠性也就无从保障。更关键的是，此前的 cross-lingual inconsistency 研究几乎全部聚焦于 knowledge 层面——即模型对同一问题的翻译给出不同的事实性回答——而 skill 层面的不一致是否独立存在、如何量化、在决策过程的哪个阶段产生，至今缺乏系统性的实证研究。解决这一问题不仅能揭示 multilingual LLMs 的一个此前被忽视的重大瓶颈，还能为设计跨语言表现更均衡的模型提供明确的改进方向，例如通过 reasoning language 的切换来恢复部分丧失的能力。\n\n### § 2 前人工作与不足\n\n该问题此前并未被直接解决，相关研究分布在三个方向上，但各自存在结构性局限。第一，cross-lingual knowledge inconsistency 研究如 X-FACTR (Jiang et al., 2020) 和 cross-lingual consistency of factual knowledge (Qi et al., 2023) 已经揭示模型对同一输入的翻译会给出不同的事实性回答，Ifergan et al. (2024) 和 Goldman et al. (2025) 进一步将原因归结为 cross-lingual transfer 不足和 factual compartmentalization——即一种语言中习得的信息在另一种语言中可能不可检索。但这类工作的评测对象是静态的 factual recall，无法回答模型在多轮交互中是否表达了等价的 behavioral policy。knowledge 的可及性与 skill 的可执行性是两个正交维度：一个模型可能知道某条最优策略却无法通过特定语言接口将其检索并执行，而此前没有任何工作将这两者分离测量。\n\n第二，multilingual benchmarks 如 XCOPA (Ponti et al., 2020b)、Belebele (Bandarkar et al., 2024)、Global MMLU (Singh et al., 2024) 和 BenchMAX (Huang et al., 2025) 评估了模型在多语言下的 accuracy，但它们全部采用 fixed inputs 和 predefined answers 的静态评测范式。这种范式只能揭示模型在不同语言下是否给出正确答案，却无法检测模型在 evolving interaction 中是否维持了相同的策略、风险偏好和空间推理能力。换言之，静态 benchmark 缺失的是对 interactive skill consistency 的评测能力——它无法区分模型是\"理解了等价的输入\"还是\"在等价输入下表现出了等价的行为\"。\n\n第三，cross-lingual skill transfer 研究 (Hu et al., 2020; Malkin et al., 2022; Shaham et al., 2024; Turc et al., 2021) 考察的是在一种语言中通过 fine-tuning 习得的任务能力能否 zero-shot 迁移到其他语言。但这一范式关注的是 skill 的跨语言获取，而非一个已固定模型在不同语言接口下对已有 skill 的访问与表达差异。两者的区别在于：transfer 研究问的是\"用语言 A 训练的技能能否在语言 B 中使用\"，而本文问的是\"同一个模型已经具备的技能，在语言 A 和语言 B 下能否被同等程度地调用和执行\"。\n\n在 interactive evaluation 方面，TextArena (Guertler et al., 2025)、τ²-bench (Barres et al., 2025)、SmartPlay (Wu et al., 2024)、GameBench (Costarelli et al., 2024) 和 GTbench (Duan et al., 2024) 等基准确实提供了多轮交互环境来评估 LLMs 的 planning、spatial reasoning 和 strategic decision-making。但这些工具全部在单一或固定的语言接口下运行，用于比较不同模型、prompting methods 或 agent architectures，从未被用于研究同一模型内部 language-conditioned 的行为变异。因此，此前既缺乏一个能将语言效应从知识和任务难度中正交隔离的实验范式，也缺乏一个支持 multilingual 接口的交互式评测平台——这正是本文通过构建 Multilingual TextArena 并设计 controlled self-play 实验所填补的空白。", "core_insight": "### § 3 重建作者的思考路径\n\n一个认真研究多语言 LLM 的研究者，首先面对的是已有文献中反复出现的事实：同一模型在不同语言下表现不平等。但几乎所有先前工作都将这种不平等归因于 *knowledge accessibility*——模型在一种语言下学到的 factual knowledge，在另一种语言下可能无法检索，即所谓的 factual compartmentalization。Ifergan et al. (2024) 甚至发现看似跨语言一致的知识往往是分别存储而非共享的。这条线索引出一个自然但未被回答的问题：如果 *知识* 的跨语言访问是不一致的，那么 *技能*（reasoning、planning、decision-making）是否也因语言而异？这个问题之所以难以回答，是因为传统的 multilingual benchmark 中，语言变化往往伴随着任务内容、文化语境或输入复杂度的变化，无法将语言本身的影响与任务难度变化分离；而且静态 benchmark 只能告诉你 accuracy 数字变了，无法揭示模型在 evolving interaction 中是否表达了等效的 policy。\n\n研究者的下一步关键观察是：text-based competitive games 提供了一个独特的实验载体。这类游戏的核心信息——board states、cards、numerical values、legal actions、rules——本质上是非语言的、abstract 的，但模型与环境的交互必须通过自然语言接口。这意味着可以保持游戏的所有结构性要素固定，仅改变语言接口，从而将语言对行为的影响正交地隔离出来。而 self-play 设计进一步强化了这个隔离：让同一模型的两个实例对弈，每个实例通过不同语言接口接收 observation 并提交 action，模型、对手、规则、状态空间、动作空间全部固定。如果 skills 是 language-invariant 的，两个实例的 playing strength 应当相等，胜负随机分布；任何系统性的 win-loss margin 偏差都纯粹来自语言对 skill expression 的影响。先前关于 cross-lingual skill transfer 的工作（Malkin et al., 2022; Turc et al., 2021）已经暗示 source language 会影响 zero-shot transfer，但那些工作关注的是 skill 的 *acquisition*，而非 skill 在已习得后的 *access and expression*。同时，self-translation 和 question-alignment 方法（Zhu et al., 2024; Etxaniz et al., 2024）改善多语言性能的经验事实，暗示语言效应可能发生在推理过程的某个可干预阶段，这为后续将 interface language 与 reasoning language 分离的实验提供了动机。TextArena（Guertler et al., 2025）作为已有的开源游戏平台，恰好提供了扩展为多语言接口的基础设施。\n\n### § 4 核心 Intuition\n\n同一个模型在完全相同的 abstract game 中对弈自身——board、cards、rules、actions、对手全部固定，唯一变量是交互语言——任何系统性的胜负偏差都只能归因于语言对 skill expression 的影响，而非 knowledge 或 task difficulty。这个 setting 把一个先前被 knowledge inconsistency 文献掩盖的现象暴露出来：模型可能\"拥有\"某个 skill，但在特定语言接口下无法可靠地\"表达\"它。进一步将 interface language 与 intermediate reasoning language 分离，可以定位语言效应究竟发生在 state interpretation、reasoning 还是 action selection 阶段——如果仅切换推理语言就能恢复性能，说明 skill 本身并未丢失，只是某些语言接口阻断了通向它的路径。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Skill Issue: Are Skills Language-Invariant in LLMs?》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究与问题重要性 论文提出的核心研究问题是：同一个 LLM 在通过不同语言接口交互时，是否会展现出不同的 skill sets——即除了已知的 cross-lingual knowledge inconsistency 之外，模型在 reasoning、planning 和 decision-making 等行为能力上是否也因语言而异。作者将这一现象命名为 cross-lingual skill inconsistency，并强调它必须与 knowledge accessibility 和 overall benchmark performance 正交分离。为回答这一问题，作者设计了一个 multilingual self-play 实验范式：同一模型的两个实例在相同的 text-based game 环境中对弈，各自通过不同语言的接口接收 observation 并输出 action，而 board states、cards、numerical information、action spaces 和 game rules 全部保持固定。这一设置将语言对模型行为的影响从知识储备和任务难度中隔离出来，使得胜负差异只能归因于语言接口对 skill 表达的调节作用。 这个问题的重要性在于，LLMs 正快速走向 multilingual，但其在不同语言下的表现不平等已被广泛记录。如果模型在某些语言中不仅检索不到相同的知识，连推理和决策能力本身也发生退化，那么 multilingual 模型就无法被视为 language-agnostic 系统，其在全球范围内的公平部署和可靠性也就无从保障。更关键的是，此前的 cross-lingual inconsistency 研究几乎全部聚焦于 knowledge 层面——即模型对同一问题的翻译给出不同的事实性回答——而 skill 层面的不一致是否独立存在、如何量化、在决策过程的哪个阶段产生，至今缺乏系统性的实证研究。解决这一问题不仅能揭示 multilingual LLMs 的一个此前被忽视的重大瓶颈，还能为设计跨语言...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 一个认真研究多语言 LLM 的研究者，首先面对的是已有文献中反复出现的事实：同一模型在不同语言下表现不平等。但几乎所有先前工作都将这种不平等归因于 *knowledge accessibility*——模型在一种语言下学到的 factual knowledge，在另一种语言下可能无法检索，即所谓的 factual compartmentalization。Ifergan et al. (2024) 甚至发现看似跨语言一致的知识往往是分别存储而非共享的。这条线索引出一个自然但未被回答的问题：如果 *知识* 的跨语言访问是不一致的，那么 *技能*（reasoning、planning、decision-making）是否也因语言而异？这个问题之所以难以回答，是因为传统的 multilingual benchmark 中，语言变化往往伴随着任务内容、文化语境或输入复杂度的变化，无法将语言本身的影响与任务难度变化分离；而且静态 benchmark 只能告诉你 accuracy 数字变了，无法揭示模型在 evolving interaction 中是否表达了等效的 policy。 研究者的下一步关键观察是：text-based competitive games 提供了一个独特的实验载体。这类游戏的核心信息——board states、cards、numerical values、legal actions、rules——本质上是非语言的、abstract 的，但模型与环境的交互必须通过自然语言接口。这意味着可以保持游戏的所有结构性要素固定，仅改变语言接口，从而将语言对行为的影响正交地隔离出来。而 self-play 设计进一步强化了这个隔离：让同一模型的两个实例对弈，每个实例通过不同语言接口接收 observation 并提交 action，模型、对手、规则、状态空间、动作空间全部固定。如果 skills 是 language-invariant 的，两个实例的 playing strength 应当相等，胜负随机分布；任何系统性的 win-... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：**CoLab Lab** 2026-08-19 **==\u003E picture [18 x 18] intentionally omitted \u003C==** ## **Skill Issue: Are Skills Language-Invariant in LLMs?** **Bobby Cheng**[N] _[,][†]_ , **Adam Gaber**[B] , **Zhengyuan Liu**[N] , **Catherine Arnett**[K] , **Omer Goldman**[R] , **Cheston Tan**[N] , **Leshem Choshen**[B] _[,]_[Q] _[,][∗]_ NA*STAR, BWeizmann Institute of Science, QMIT-IBM Watson AI Lab, RUniversity of Cambridge, KEleutherAI **Large language models access knowledge inconsistently across languages, but to what extent do they differ in their skill sets when interacting with different languages? This work quantifies** _**cross-lingual skill inconsistency**_ **orthogonally from knowledge and general benchmark performance. We do this via multilingual self-play: two instances of the same model compete in a text-based game, each interacting through a different language interface. Since the model, oppon...", "additional_insights": "### § 8 Take-aways\n\n同一 LLM 在不同语言接口下表现出显著且系统性的 skill 差异，即使游戏规则、棋盘状态、动作空间完全固定：英语接口在 Gemma、Qwen、Ministral 三个模型上均最强，希伯来语均最弱，Qwen 的语言层级最为陡峭（英语对希伯来语 mean margin 达 +0.38）。语言影响的不仅是知识检索，还渗透到空间推理——非拉丁字母语言（Arabic、Hebrew）在 TicTacToe 中对角线失败比例显著高于英语（Gemma 中 45.3% vs 36.7%），game log 显示模型频繁将 cell 序列误标为 column 或 diagonal；策略行为也随语言漂移——Kuhn Poker 中 Qwen 持最弱牌 J 的 bluffing 率跨语言变化超过两倍（23.3%–47.4%），Gemma 对中间牌 Q 的 betting 率从 Malay 的 41.6% 到 Hebrew 的 63.3%；已知策略的获取同样不稳定——Nim 的 Nim-sum 最优策略在 Qwen 的 Hebrew/Arabic 接口下 mention 数和首手机执行率分别骤降至 4.0% 和 10.5%，而英语下达 80.8%。将环境接口语言与中间推理语言分离后，用更强语言推理可恢复大量性能：TicTacToe 中德语接口固定、切换为英语推理后 margin 从 −0.22 升至 +0.20，恢复 89.4% 的可达 gap，说明语言敏感性至少部分产生于推理阶段而非状态解读。静态 multilingual benchmark（Global MMLU、Belebele）与 self-play 语言强度排名正相关（r=0.71–0.92），但 benchmark 均分不预测跨语言一致性——Gemma 的 Global MMLU 均分最低但 spread 最小，Qwen 均分最高但 spread 最大，二者是正交维度。Web data availability（FineWeb-2 词数）与语言强度正相关（r 均值 0.79），但 script 共享性（Malay 受益于拉丁字母 cross-lingual transfer 而 Hebrew 不能）和模型特异性（Chinese 可用文本量约为英语 1/20 但在 Qwen/Ministral 上接近英语水平，在 Gemma 上接近零）共同表明数据量、书写系统和模型训练配方各自只解释了部分变异。\n\n### § 9 最脆弱的假设\n\n论文最核心也最脆弱的假设是：multilingual self-play 中观察到的 win-loss margin 差异反映的是语言对 model skill 表达的因果效应，而非翻译不等价、tokenizer artifact 或 prompt 格式偏置所导致的 confound。这个假设一旦不成立，\"skills are not language-invariant\"这一核心 claim 就会退化为\"翻译质量不随语言不变\"或\"tokenization 效率不随语言不变\"，两者都是已知现象，不构成新贡献。该假设在实际中可能不成立的原因有三层：第一，即使经过 native speaker 验证，不同语言的规则描述在语义粒度、歧义性、指令直接性上难以完全等价，系统性偏向某些语言的翻译会直接制造 win-rate 差异；第二，论文刻意保留了语言无关的 action token（如 [check]、[bet]、[0 3]），但这些英文 token 对非英语接口构成额外的 code-switching 负担，且该负担与语言本身的 skill 容量无关；第三，tokenizer 对不同语言的 fertility 差异巨大，同样的棋盘 observation 在 Hebrew 或 Arabic 中可能消耗更多 token，压缩了 reasoning budget 或分散了 attention，这是 tokenization artifact 而非 skill 差异。论文为该假设提供的证据包括：Tier A 语言经 native speaker 手动验证、back-translation fidelity 检查、同语言对局的对角线接近零（内部一致性）、以及 reasoning language 切换实验中性能恢复的方向性。但论文缺少的关键证据是：没有对\"翻译等价性\"做定量 ablation（例如对比同一语言下高质量翻译与低质量翻译的 win-rate 差异），没有分析 per-language 的 token-level context length 或 attention 分布来排除 tokenization confound，也没有测试将 action token 本地化后差异是否缩小。Figure 2 对角线接近零只能排除 player-role 偏置，无法排除系统性翻译偏差。\n\n### § 10 最小复现实验\n\n一周内可验证论文最关键的 claim——\"语言接口因果地影响 skill 表达，且部分效应产生于推理阶段\"——而无需复现全部 518,400 局。选取 language hierarchy 最陡峭的 Qwen3-4B 和规则最简单的 TicTacToe，仅对比英语与希伯来语两种差异最大的语言。第一步，用 TextArena 的 TicTacToe 环境跑 English vs Hebrew 的 self-play，每个 role assignment 各 100 局共 200 局，测量 role-pooled win-loss margin 和 defeat type 分布（row/column/diagonal 百分比）。预期支持性结果：希伯来语 margin 显著为负，且 diagonal defeat 比例明显高于英语。第二步，做核心 ablation——固定希伯来语接口但通过 language-conditioned reasoning prompt 要求模型用英语推理，再跑 200 局。如果 margin 显著向英语 ceiling 回升（论文报告 TicTacToe 中德语接口+英语推理恢复 89.4%），则支持\"语言敏感性部分源于推理阶段\"的 claim；如果 margin 不变，则要么推理语言不是主因，要么翻译等价性或 tokenization 才是真正的 confound，这会削弱论文的因果解读。第三步，手动检查 20 局希伯来语对局的 game log，确认失败是否源于规则误解或 action format 错误而非空间推理失误——如果大量失败是 format/规则层面的，则翻译等价性假设受到直接挑战。整个实验约需 600 局对局，单卡 H200 数小时即可完成，不依赖完整的多语言翻译 pipeline 或全部 8 种语言。", "research_value": "### § 11 最强反例设计\n\n我会设计一个基于 tokenization efficiency 与 context budget 耗竭的替代解释实验，直接攻击论文中“win-loss margin 差异反映 skill 表达退化”的核心因果 claim。具体而言，论文刻意保留了英文 action token（如 `[check]`、`[bet]`），这迫使非英语接口进行 code-switching，同时非拉丁字母语言（如 Hebrew、Arabic）的 tokenizer fertility 差异会消耗更多 token，从而在固定 context window 下压缩了模型的 reasoning budget。为了验证性能下降是否仅仅因为“context budget 不足”而非“skill 丧失”，我会在英语接口上人为制造 token 通胀：将英语的 observation 和 action space 通过一个低效的映射函数（例如将每个单词扩展为无意义的冗长 token 序列，或使用 BPE 贪婪切分导致的极差 fertility），使得其 token 长度与 Hebrew 接口完全对齐。如果在这种“伪低效英语”下，模型的 TicTacToe diagonal defeat 比例和 Kuhn Poker bluffing 率与 Hebrew 接口的表现趋于一致，那么论文观察到的 cross-lingual skill inconsistency 就完全退化为 tokenization artifact 和 context window 压缩的副产品。此外，我会进行 action token 本地化实验：将 `[check]` 等替换为纯 Hebrew 词汇，消除 code-switching 负担。如果性能显著回升，说明先前的差异源于格式摩擦而非深层 reasoning 能力的语言依赖性。这一反例直接将论文的“认知/技能退化”降维打击为“工程/分词器局限”，证明其观察到的现象只是已知的 tokenization inefficiency 在交互式任务中的另一种表现形式。\n\n### § 12 Follow-up Research Idea\n\n基于论文在行为学评测上无法彻底剥离 tokenization artifact 与 translation fidelity 的局限，我提出一个全新的研究框架：**Cross-Lingual Activation Patching for Skill Representation Disentanglement**。这一想法的核心驱动力在于，行为层面的 win-rate 无法区分模型是“缺乏该 skill”还是“无法在特定语言上下文中激活该 skill”，我们需要从 black-box behavioral evaluation 转向 mechanistic interpretability，直接在模型内部定位和操控 skill representations。借鉴 mechanistic interpretability 领域的 causal tracing 和 activation patching 技术，我们可以绕过翻译和 token 长度等表层干扰，直接探究多语言在 latent space 中的技能共享机制。第一个实验将聚焦于 Nim 游戏中的 Nim-sum 策略：首先在英语接口下运行模型，通过 causal mediation analysis 精确定位负责执行 XOR 运算和 Nim-sum 计算的 attention heads 或 MLP layers。随后，在模型表现极差的 Hebrew 接口下运行同一局游戏，在生成 action 的关键推理步上，将英语 context 中提取的对应 activations 强制 patch 到 Hebrew 的 forward pass 中。如果 patching 后模型在 Hebrew 接口下成功输出了最优动作，这将直接证明 skill 本身是 language-invariant 的，瓶颈仅在于 cross-lingual activation gating 失败；如果 patching 无效，则证明不同语言在模型内部形成了完全正交的 skill circuits。这一框架将研究目标从“量化行为差异”转变为“绘制多语言技能的内部神经拓扑图”，彻底绕过了翻译等价性和 context budget 的干扰，为构建真正 language-agnostic 的 reasoning engine 提供机制级别的指导。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Bobby Cheng\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Adam Gaber\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Zhengyuan Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Catherine Arnett\", \"affiliations\": [5], \"markers\": []},\n    {\"name\": \"Omer Goldman\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Cheston Tan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Leshem Choshen\", \"affiliations\": [2, 3], \"markers\": [\"∗\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"A*STAR\"},\n    {\"id\": 2, \"name\": \"Weizmann Institute of Science\"},\n    {\"id\": 3, \"name\": \"MIT-IBM Watson AI Lab\"},\n    {\"id\": 4, \"name\": \"University of Cambridge\"},\n    {\"id\": 5, \"name\": \"EleutherAI\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"†\", \"text\": \"Corresponding author: bobbycxy1994@gmail.com\"},\n    {\"marker\": \"∗\", \"text\": \"Corresponding author: leshem.choshen@weizmann.ac.il\"}\n  ]\n}\n```", "summary_translation": "大语言模型在不同语言间获取知识的能力不一致，但在与不同语言交互时，它们的 skill sets 在多大程度上存在差异？本工作从与知识和 general benchmark 性能正交的角度量化了跨语言技能不一致性。我们通过 multilingual self-play 实现这一点：同一模型的两个实例在一个基于文本的游戏中竞争，各自通过不同的语言接口进行交互。由于模型、对手、规则、state space 和可用动作保持固定，这一设置隔离了语言对模型实际行为的影响。我们为 TextArena 构建了一个多语言扩展，并在涵盖空间推理、不完全信息、资源分配和重复交互的八种语言和六款游戏中评估了三个 open-weight 模型。我们发现，同一模型在不同语言下会表现出显著不同的 playing strength，并且在 win--loss margins、无效动作和战略倾向上存在系统性变化。详细分析揭示了在空间推理、card-conditioned decisions 和 optimal move selection 中特定语言的失败。在某些设置中，仅改变 intermediate reasoning language 就能恢复大部分丢失的性能，这表明语言会影响决策过程的不同阶段。这些结果表明，技能差异是开发真正多语言模型过程中一个可衡量的主要障碍。更好地理解这些差异有助于我们设计在不同语言间表现更公平的模型。"}, {"title": "TraceML: An Empirical Analysis of Human-Agent Planning in Machine Learning Development", "arxiv_id": "2608.26086", "authors": "Jiarui Yan, Weiwei Sun, Sijie Li, Wenhan Li, Yiming Yang", "summary": "Large language models write correct code for isolated problems but remain far weaker at autonomous machine-learning development, where an agent must revise data pipelines, models, and validation over hours of feedback, and on most competitions still finishes below strong human competitors. Outcome-based benchmarks record this gap but not its cause, because they grade the final submission and discard the development process behind it. We introduce TraceML, which pairs human and agent work on the same competitions under one version-level schema: 4,465 human Kaggle trajectories across 134 competitions, seven of which are also worked by two agent scaffolds, giving 430 paired human and 207 agent trajectories. Every code version carries its score, its timestamp, and labels for the action taken, its intent, the edit size, and the score effect. Read this way, the gap becomes concrete. Experts alternate data work, validation, model changes, and ensembling, and return to approaches they had set aside. Each agent scaffold instead collapses into a narrow loop: Codex spends its steps re-weighting ensembles and tuning submissions, MLEvolve mutates its model in place, and neither pivots at the human rate nor reopens abandoned work. A short planning prompt distilled from human practice moves the behaviors it names toward the human profile and lifts scores, but the effort profile stays agent-shaped: instruction closes only the part of the gap that reduces to instructions. We release the corpus, the schema, the labelers, and the extraction pipeline at https://huggingface.co/datasets/jerryyan/TraceML.", "category": "cs.LG", "cluster": "Agent Benchmarking \u0026 Evaluation", "tags": ["cs.LG"], "filter_reason": "这篇论文的核心贡献是引入 TraceML，对人类和 LLM 智能体在机器学习开发中的规划行为进行实证分析。论文明确以 LLM Agents（如基于 Codex 和 MLEvolve 的智能体支架）为研究对象，深入诊断了它们在长程决策和反馈迭代中的失败机制（如陷入狭窄循环、缺乏人类那样的回溯和重新审视能力），并测试了从人类实践中提炼的规划提示词来尝试改进智能体的行为。根据筛选标准第一步，“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留”。此外，重要校准中也明确指出“不要只因为论文是 benchmark、evaluation、behavior analysis 就排除”。因此，该论文符合您的核心研究范围。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的核心研究问题是：在长期的自主机器学习开发中，LLM agents 与人类专家在开发过程上究竟存在哪些具体的行为差异，以及这些差异如何导致 agents 在最终表现上落后于人类。尽管 LLMs 在解决孤立的代码任务时表现优异，但在需要数小时迭代、根据反馈修改数据流水线和模型的 Kaggle 风格竞赛中，agents 依然难以匹敌顶尖人类选手。这个问题至关重要，因为现有的 outcome-based benchmarks 仅记录最终提交的分数，掩盖了导致分数差距的开发过程。解决这一问题不仅能将模糊的“agents 表现较差”转化为具体的、可改进的设计缺陷（如缺乏记忆或控制机制），还能为未来的 agent 架构优化提供明确的诊断方向。通过构建 TraceML 这一过程级数据集，研究者能够将人类与 agent 的开发轨迹在统一的 version-level schema 下进行对齐分析，从而揭示 agents 在探索、验证、模型切换和集成等环节中的行为模式缺陷，并验证了通过提取人类实践经验的 planning prompt 能否弥补这些行为鸿沟。\n\n### § 2 前人工作与不足\n在 TraceML 之前，该问题并未得到充分解决，主要受限于评测维度的缺失与数据表示的不统一。现有的 ML-agent benchmarks，如 MLE-bench、MLAgentBench 和 AIRA，主要在真实的 Kaggle 竞赛或受限环境中评估 agents，但它们仅将 agents 与其他 agents 或 leaderboard 排名进行对比，完全缺乏任务对齐的人类开发轨迹作为参照系。虽然 RE-Bench 和 HCAST 等基准引入了时间预算匹配的人类基线来校准 agent 能力，但 RE-Bench 仅覆盖了 7 个定制环境且缺乏完整代码，HCAST 则未针对 Kaggle 风格的 ML 工程提供共享的版本级中间决策表示。这些前人工作之所以存在不足，是因为它们将评估局限于最终的 outcome-based 结果，忽略了开发过程中的 intermediate versions、代码变更及其 score effects。这种评测缺口导致研究者无法判断两个得分相同的 run 中，哪一个经过了严谨的实验，哪一个只是盲目调参。此外，像 Tree of Thoughts 和 Reflexion 这样的 agent 框架虽然在抽象规划领域提升了多步推理的深思熟虑程度，但并未在真实的、长达数小时的 ML 开发场景中验证其行为模式。TraceML 正是为了填补这一空白，通过提取 134 个竞赛中的 4,465 条人类 Kaggle 轨迹，并将其与 agent 的 CLI commits 或 tree-search journals 统一映射为带有细粒度 action 和 intent 标注的 version-level 序列，首次实现了人类与 agent 在过程级别的可比对分析。", "core_insight": "### § 3 重建作者的思考路径\n\n一个认真研究\"为什么 LLM agent 在 ML 开发中不如人类\"的人，起点必然是一个经验观察：LLM 在 isolated coding task 上已经很强，但在 Kaggle 这样的 long-horizon ML 任务上，agent 能在单次 run 内稳步进步，却仍然在大多数竞赛中低于人类强竞争者，且从额外工作时间中获益不如人类。接下来会碰到一个测量层面的瓶颈：现有的 ML-agent benchmark——MLE-bench、MLAgentBench、AIRA——全部是 outcome-based 的，只给最终提交打分。两个 run 分数相同，在 benchmark 上看起来一模一样，但一个可能是精心实验后的结果，另一个可能是盲目调参碰运气碰出来的。要回答\"agent 的工作流在哪里偏离了专家\"，这是一个关于 process 的问题，而现有 benchmark 恰恰丢弃了 process。\n\n一旦意识到需要 process-level data，下一个问题是：数据从哪来，怎么让人类和 agent 可比？人类在 Kaggle 上留下的是跨越数周的公开 notebook 保存历史；agent 留下的是数小时内的 CLI working directory 或 tree-search journal。两者在源头上完全不同构。但如果我们把两边都抽象为\"有序的代码版本序列，每个版本带分数、时间戳和动作标签\"，就可以在同一 schema 下并排阅读。这个抽象不是显然的——人类的 Kaggle save-version 和 agent 的 submission-producing commit / search node 并不是同一类型的事件，需要显式对齐 unit、measurement 和 observability。\n\n在相关工作层面，RE-Bench 是最接近的参照：它用时间预算匹配的人类基线揭示了 final score 隐藏的 scaling pattern，但只在 7 个定制环境上、且只提供 partial code。HCAST 在人类校准的任务尝试上评估自主性，但不覆盖 Kaggle 风格的 ML 工程，也没有共享的 version-level 中间决策表示。没有人同时提供 scored intermediate versions 的完整代码和 task-matched 的人类开发轨迹。这就是 TraceML 要填补的空白。\n\n有了数据之后，分析框架的自然推演是：不能只看\"做了什么\"（coarse action mix），还要看\"什么时候换方向\"（pivot）、\"是否回到被搁置的工作\"（revisit / return）、\"集成的质量\"（ensembling 的实质内容而非名义）。这些行为维度不是随意选取的——它们是从\"人类专家如何在数小时反馈中迭代修订 data pipeline、model 和 validation\"这一经验问题中自然生发出的诊断轴。最后，如果这些诊断能定位到具体的行为差距，那么一个自然的 probe 就是：把人类实践蒸馏成一段 planning prompt，看哪些差距能被指令弥补、哪些不能。能被指令弥补的部分说明问题在 prompt 层面；不能被弥补的部分——比如 agent 从不回溯被放弃的工作线——则指向 agent 本身的设计缺陷（memory、control），而非 model 能力。\n\n### § 4 核心 Intuition\n\n最终分数告诉你 agent 比人类差，但不告诉你差在哪里。如果你把人类和 agent 的每一次代码修改都还原为\"改了什么、为什么改、改了多少、分数怎么变\"，就会发现人类专家在数据、验证、模型和集成之间灵活切换并回溯被搁置的方案，而 agent 要么卡在一个狭窄的循环里反复微调已有方案，要么无收益地频繁换方向，且从不重新打开被放弃的工作线。这个 process-level 的并排对比把模糊的\"agent 更弱\"变成了具体的设计缺陷——缺记忆、缺控制——并精确标出了 prompt 指令能触及的边界和必须改变 agent 架构才能跨越的边界。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Human-Agent Gaps (§4)] ----\u003E [Planning Skill Prompt]\n (Pivot, Revisit, Ensemble)   (Anti-loop, Human-prior, \n                              Self-check, Task-prior)\n        |                            |\n        |                            v\n        |                     [Harness Arm] --------+\n        |                            |             |\n        +----------------------\u003E [Baseline Arm]    |\n                                     |             |\n                                     v             v\n                              [Codex CLI Agent (12h budget)]\n                                     |\n                                     v\n                           [Agent Trajectory (Code/Scores)]\n                                     |\n                                     v\n                           [TraceML Extraction \u0026 Labeling]\n                                     |\n                                     v\n                           [Behavioral \u0026 Score Evaluation]\n```\n\n基于上述 Pipeline，以 `commonlit` 比赛为例，完整流程如下：\n\n- **输入**：从 §4 的实证分析中提取的 Human-Agent 行为差异。例如，发现 Codex 在开发过程中陷入不断 re-weighting ensemble 的 mono-loop，且极少 pivot 或 revisit 被放弃的方案。\n- **处理**：\n  1. 将这些行为差距转化为约 1000 token 的 Planning Skill Prompt。该 prompt 包含禁止 mono-loop 的 anti-loop constraints、要求尽早建立 K-fold 和 ensemble 的 human-prior practices，以及每 30-60 分钟的 periodic self-checks。\n  2. 在相同的 12 小时预算下，将此 Skill 注入 Codex CLI Agent 的 Harness Arm 中，并与仅使用标准 task prompt 的 Baseline Arm 进行对比。\n  3. Agent 运行结束后，将其产生的 commits 或 search journals 输入 TraceML 的 Extraction \u0026 Labeling pipeline，统一转化为 version-level 的带标签轨迹。\n- **输出**：生成 Behavioral \u0026 Score Evaluation 报告。在 `commonlit` 例子中，Harness Arm 的 re-weighting 行为显著下降，small early edits 上升，最终 RMSE 分数从 baseline 的 0.510 提升至 0.505。但评估也发现，Agent 的工作模式切换节奏依然呈 \"agent-shaped\"，未完全达到人类的灵活度。\n\n### § 6 核心数学推导\n\n本文是一篇实证分析论文，核心在于通过数据驱动的方法对比人类与 Agent 的开发轨迹，并未提出新的数学模型或进行形式化的数学推导。论文中使用的数学工具（如 PCA, Jensen-Shannon divergence, Spearman correlation, Bootstrap CI 等）均为标准的统计分析方法，用于量化和验证行为差异，因此本节跳过。\n\n### § 7 实验设计与结论\n\n这篇论文通过两个层次的实验设计来验证其 claims：\n\n**提出了什么问题** → Agent 在 ML 开发中的分数低于人类，这究竟是因为什么具体的行为差异？如果我们将这些差异提炼为指令注入 Agent，能否缩小差距并提升表现？\n\n**设计了什么实验验证这个问题** → \n首先，在 7 个 Kaggle 比赛上，使用统一的 version-level schema 对比 430 条人类轨迹与 Codex/MLEvolve 的 Agent 轨迹，从 action profile、pivot rate、revisit 行为和 ensemble 策略四个维度定位具体差距。其次，基于发现的差距构建 Planning Harness，在严格控制 12 小时预算和相同后端模型的条件下，对比 Baseline Arm、Harness Arm 及两个 Ablation Arm（仅注入单块内容 vs 仅保留注入频率无内容），评估行为特征转移和最终分数变化。\n\n**问题的答案是什么** → \nAgent 的核心问题不在于基础能力，而在于过程控制：Codex 陷入局部调优的 mono-loop，MLEvolve 陷入无效的频繁 pivot，两者都缺乏记忆和方向控制。Planning Harness 能成功将明确命名的行为（如 re-weighting 下降、early edits 上升）推向人类水平，并在 7 个比赛中的 5 个显著提升分数。然而，指令无法改变 Agent 整体工作模式切换的僵化节奏，这证明 instruction 只能弥补可被明确表述的差距，更深层的缺陷需要从 Agent 的架构设计（如引入 memory 和 controller）上解决。", "additional_insights": "### § 8 Take-aways\n本文提出了 TraceML，一个包含 4,465 条人类和 207 条 agent 的 version-level 机器学习开发轨迹数据集，通过统一的 schema 将 Kaggle 公开 notebook 历史与 agent 的 CLI commits 或 tree-search journals 对齐。基于此数据集的 process-level 分析表明，人类专家在 data、validation、model 和 ensembling 之间广泛交替，并经常重访被搁置的方法；而 agent 陷入了狭窄的局部循环：Codex 耗费大量步骤 re-weighting ensembles 和微调 submission，MLEvolve 则专注于 in-place 的 model mutations。两者都缺乏人类那样改变方向的 pivot 能力以及重访废弃工作的 memory 能力。虽然从人类实践中提炼的 planning prompt 能将部分 agent 行为拉回人类模式并提升分数，但 agent 的 effort profile 依然保持 agent-shaped，证明指令只能弥补可还原为指令的差距，真正的解决需要重构 agent 本身的 memory 和 control 机制。\n\n### § 9 最脆弱的假设\n本文最核心且失败代价最大的假设是：**Kaggle 上的公开 notebook 保存历史能够准确代表人类真实的 ML 开发过程**。论文基于这一假设构建了人类行为的 reference distribution，并以此量化 human-agent gap。然而在实际中，Kaggle 参与者通常在本地或私有环境中进行大量探索、失败和调试，仅在平台上保存关键版本或清理后的 write-up，这意味着公开轨迹可能只是真实开发过程的“冰山一角”。如果人类在未记录的私有实验中同样存在大量局部微调或盲目试错，那么论文中得出的“人类广泛交替探索且极少陷入 mono-loop”的结论将被严重高估。论文在 §3.3 和 Appendix G 中承认了 off-platform work 的存在，但仅通过限制人类为 scored, submitted versions 来对齐事件类型，并未提供任何证据证明公开 notebook 的保存频率和内容能无偏地反映真实开发节奏。一旦此假设不成立，整个 human-agent gap 的量化基础及其衍生的行为诊断将失去参照系。\n\n### § 10 最小复现实验\n在一周时间内，可以最小化复现论文中关于 **agent 陷入狭窄局部优化循环且缺乏 pivot 行为** 的发现。从 MLE-bench 中选择一个 Kaggle 竞赛（如 `commonlitreadabilityprize`），使用 OpenAI API 驱动一个简单的 ReAct agent 或直接运行 Codex CLI，设定 4 小时预算完成任务，并记录所有产生 submission 的代码版本。不需要复现完整的 TraceML 自动标注系统，可手动或借助 LLM 对相邻代码版本的 diff 进行分类，将其划分为局部优化（如 `change_weights`、`postprocess_change`、`epoch_change`）和 pivot（如 `pretrained_swap`、`feature_selection`、改变 validation scheme）。测量 agent 轨迹中 pivot 行为所占的百分比。如果 pivot 比例极低（例如低于 10%）且步骤高度集中在某单一动作上，则支持论文的 claim；如果 agent 展现出频繁的 backbone 切换或特征工程重组，则反驳了该结论。此方案无需构建复杂的数据集 pipeline，即可验证 agent 行为模式这一核心观察。", "research_value": "### § 11 最强反例设计\n如果我要对这篇论文发起最有力的攻击，我将从其参照系的根本有效性切入，提出一个具体的替代解释：TraceML 所观测到的“human-agent behavioral gap”并非源于 agent 缺乏人类的高级规划能力，而是源于**Kaggle 公开 notebook 历史与 agent 运行日志在数据生成机制上的系统性偏差**。Kaggle 上的公开轨迹是人类在数天或数周的开发后，经过高度筛选、清理并仅保留“有效路径”的展示性 artifact，而 agent 的 CLI commits 则是包含所有死胡同、盲目试错和局部微调的完整原始日志。这种比较等同于将人类的“精修后回忆录”与 agent 的“实时监控录像”进行对齐。为了验证这一替代解释，我会设计一个实验：招募 10 名 Kaggle 专家级选手，在严格匹配 TraceML 中 agent 的 12 小时预算内，从零开发一个竞赛模型，并强制要求使用本地 IDE telemetry 记录每一次代码保存和运行（包括失败的 run 和微小的 parameter tweaks），而非依赖 Kaggle 平台的主动 commit。随后，使用 TraceML 的 version-level schema 提取这些“未修饰”的人类轨迹。如果实验结果显示，在时间压力和未过滤的记录下，人类专家同样表现出极高比例的局部微调、陷入短暂的 mono-loop，且 pivot rate 显著低于 TraceML 中基于公开 notebook 提取的 baseline，那么论文中关于“人类广泛交替探索且极少陷入局部循环”的核心结论将被彻底推翻。进一步地，我会设计一个 ablation 实验来攻击 Planning Harness 的有效性：将注入的“Human-prior Planning Prompt”替换为一个仅包含强制任务切换指令的“Stochastic Perturbation Prompt”（例如硬性规定每 30 分钟必须随机改变一次 action type）。如果这个没有任何人类经验先验的随机扰动 prompt 也能达到与 Harness Arm 相当的分数提升和 re-weighting 行为下降，这就证明 Harness 的成功仅仅是因为打破了 agent 的局部死循环，而非真正转移了人类的 planning skill，从而使得论文关于“提炼人类实践指令能弥补行为鸿沟”的 claim 失效。\n\n### § 12 Follow-up Research Idea\n基于论文在 § 8 中得出的结论——即 instruction-level 的干预无法改变 agent 整体工作模式切换的僵化节奏，真正的解决需要重构 agent 的 memory 和 control 机制——我们可以提出一个全新的研究方向：**将 ML 开发过程建模为基于 Bayesian Optimization (BO) 的动态资源分配问题，并引入一个非 LLM 的统计控制器来接管 strategic planning**。这个想法的核心驱动力在于，当前 LLM agents 在 ML 开发中的失败本质上是将“战术执行”（写代码）和“战略规划”（决定何时 pivot、何时 ensemble）耦合在同一个 LLM context 中，导致 LLM 的语义偏好（如倾向于修改熟悉的代码）覆盖了最优的探索-利用权衡。我们可以借鉴 AutoML 与 Multi-armed bandit 领域的成熟工具，将 ML 开发中的不同 action（如 feature engineering、model architecture swap、hyperparameter tuning、ensembling）建模为不同的 arms，而将 LLM agent 降级为执行特定 arm 的战术引擎。在这个新 framing 下，系统的 control 不再依赖 LLM 的自然语言推理，而是由一个外部的 BO controller 根据历史 trajectory 的 score gradient 和 variance 来计算 acquisition function，从而决定下一步分配给哪个 action arm。第一个实验将设计一个 contextual bandit 模型，其 context 包含当前 run 的 elapsed time、current best score 和 score plateau duration。我们将这个 BO-controlled agent 与论文中的 Baseline Arm 和 Harness Arm 在相同的 7 个 Kaggle 竞赛上进行对比。实验将重点考察 BO controller 是否能在 score 停滞时自动触发 exploration（如强制 pivot 到新的 model architecture），并在发现高潜力路径时自动增加 exploitation 预算，从而生成一个真正具备动态节奏的 effort profile，彻底打破 LLM 固有的 agent-shaped 行为模式。这与现有的 ML-agent 框架截然不同，因为它剥离了 LLM 在 long-horizon planning 上的不可靠性，将战略决策权交还给具有严格数学最优性保证的统计模型。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jiarui Yan\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Weiwei Sun\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Sijie Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Wenhan Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yiming Yang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"CMU\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author: jerryy2@cs.cmu.edu\"}\n  ]\n}\n```", "summary_translation": "大型语言模型能够为孤立问题编写正确的代码，但在自主机器学习开发方面仍然弱得多。在这种开发中，agent 必须在数小时的反馈过程中修改 data pipelines、models 和 validation，并且在大多数竞赛中仍然落后于强大的人类竞争对手。Outcome-based benchmarks 记录了这一差距，但没有记录其原因，因为它们只对最终提交进行评分，而丢弃了其背后的开发过程。我们引入了 TraceML，它在一个 version-level schema 下将人类和 agent 在相同竞赛上的工作配对：涵盖 134 个竞赛的 4,465 条人类 Kaggle trajectories，其中七个竞赛也由两个 agent scaffolds 完成，产生了 430 条配对的人类 trajectories 和 207 条 agent trajectories。每个代码版本都带有其 score、timestamp，以及针对所采取的 action、其 intent、edit size 和 score effect 的 labels。这样解读，差距变得具体了。专家交替进行 data work、validation、model changes 和 ensembling，并重新审视他们之前搁置的方法。相反，每个 agent scaffold 都会陷入一个狭窄的循环：Codex 将其步骤花在重新加权 ensembles 和调整 submissions 上，MLEvolve 则原地修改其 model，两者都没有以人类的速度进行 pivot，也没有重新开启被放弃的工作。从人类实践中提炼出的简短 planning prompt 将其指明的行为推向人类模式并提高了 scores，但 effort profile 仍然保持 agent 形态：instruction 只弥合了可以归结为 instructions 的那部分差距。我们在 https://huggingface.co/datasets/jerryyan/TraceML 发布了 corpus、schema、labelers 和 extraction pipeline。"}, {"title": "VisDocAgentBench: Benchmarking Agents for Visually Rich Document Retrieval", "arxiv_id": "2608.17889", "authors": "Lexiang Hu, Yanzhao Zhang, Mingxin Li, Dingkun Long, Yikang Li, Fuwei Zhang, Yisen Wang, Zhouchen Lin", "summary": "Visually rich documents encode relevance through language, layout, structured visual elements, and corpus context, yet retrieval is typically evaluated by one-shot query--page matching. Agentic-search benchmarks usually score downstream question answering or report generation, leaving document ranking under iterative evidence acquisition underexplored. We introduce VisDocAgentBench, a closed-corpus benchmark comparing static and agentic retrieval under a shared ranked-output contract. It contains 2,375 pages from 100 documents and 120 unique-target queries balanced across direct, one-bridge, and two-bridge evidence structures. Relation-preserving construction yields semantic, relational, and visual queries, followed by full-document review and hard-negative validation. A strong late-interaction visual retriever reaches 97.50% Recall@1 on direct items but 2.50% on two-bridge items, exposing the limits of query--target matching when relevance depends on corpus context. Agents recover much of this loss, but planner choice and retrieval representation remain decisive. Every planner performs better with visual retrieval, whose best R@1 reaches 67.50% versus 37.50% for OCR-text. Ablations identify iterative search and page inspection as consequential capabilities, and providing the complete support context improves ranking on both routes. Trace analysis localizes the remaining losses to target discovery, candidate examination, and evidence-role integration. These findings motivate retrieval agents that combine modality-preserving discovery with evidence-directed verification.", "category": "cs.AI", "cluster": "Agent Benchmarking \u0026 Evaluation", "tags": ["cs.AI"], "filter_reason": "论文的核心贡献是提出了一个名为 VisDocAgentBench 的评估基准，用于研究和评估检索智能体在视觉丰富文档检索任务中的表现。摘要中明确指出了该研究关注智能体的迭代搜索、页面检查能力，以及规划器选择对智能体检索效果的影响，并进行了轨迹分析以定位智能体在目标发现、候选检查和证据角色整合上的失败模式。根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents / Multi-Agent LLMs，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。”此外，虽然论文涉及视觉文档，但视觉元素在此作为智能体感知和检索的环境，而非单纯研究多模态视觉模型本身。因此，该论文属于对 LLM 智能体能力的评估与行为分析，符合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：在视觉富文本文档的封闭语料库中，当查询的相关性不仅依赖目标页面本身的局部信息，还依赖散布在语料库其他页面中的上下文证据时，静态 one-shot 检索与具备迭代搜索和页面检查能力的 agentic 检索各自能达到怎样的文档排序性能。具体而言，作者构建了 VisDocAgentBench，包含 2,375 个页面图像和 120 个查询，查询被均衡地划分为 direct、one-bridge 和 two-bridge 三种证据结构，以系统性地测试检索系统在需要零、一、或两个跨页面语义桥接时的表现。这个问题的重要性在于，视觉富文档（如科学论文）是一种设计过的信息载体，其语义由语言、二维布局、表格、图表、公式等共同编码，识别一个目标页面往往既需要阅读其局部文本-布局组合，又需要将其与语料库中其他位置的定义、结果或条件相关联。然而，现有检索评估几乎全部采用 one-shot query–page matching 协议，无法暴露当相关性分布于多个页面时检索系统的真实瓶颈。解决这一问题能够为社区提供一个区分局部匹配能力与语料库上下文推理能力的诊断工具，并通过受控的 ablation 和 trace 分析，精确定位剩余失败发生在 target discovery、candidate examination 还是 evidence-role integration 阶段，从而推动将 modality-preserving 表示与 evidence-directed 搜索策略联合开发。\n\n### § 2 前人工作与不足\n\n该问题此前未被直接解决，存在一个明确的评测缺口。在视觉检索方面，以 CLIP (Radford et al., 2021)、LiT (Zhai et al., 2022) 和 sigmoid loss (Zhai et al., 2023) 为代表的大规模 vision–language pretraining 通过 dual-encoder 和对比目标实现了可扩展的 open-vocabulary 图像匹配，后续的 instruction-aware 和统一表示方法如 UniIR (Wei et al., 2024)、VLM2Vec (Jiang et al., 2025b)、MM-Embed (Lin et al., 2025) 和 MegaPairs (Zhou et al., 2025) 进一步拓宽了跨任务、跨媒体的查询表达力。但这些方法的标准协议是编码一次请求并独立排序候选，无法处理需要跨页面证据积累的查询。在视觉富文档检索方面，ColPali (Faysse et al., 2025) 引入了 token-level late interaction，MMDocIR (Dong et al., 2025)、MIRACL-VISION (Osmulski et al., 2025) 和 IRPAPERS (Shorten et al., 2026) 分别建立了 page-level、multilingual 和 large-corpus 的检索 benchmark，Argus-Retriever (Abdallah et al., 2026) 和 ReAlign (Yang et al., 2026) 则通过 region-aware 或 reasoning-guided 对齐改进表示。这些工作建立了视觉文档检索的表示挑战，但全部在 fixed-query ranking 协议下评估，没有测试系统能否在产出最终排序之前迭代搜索和检查语料库。在 agentic search 方面，ReAct (Yao et al., 2023)、WebGPT (Nakano et al., 2022)、Search-R1 (Jin et al., 2025) 和 MMSearch (Jiang et al., 2025a) 展示了 query reformulation 和迭代证据积累的能力，但它们的检索动作服务于生成答案或任务结果，ranking trajectory 本身仅被间接测量。面向视觉的 agentic benchmark 如 VisualWebArena (Koh et al., 2024)、VistaHop (He et al., 2026)、MM-BrowseComp (Li et al., 2025) 和 DeepImageSearch (Deng et al., 2026) 支持迭代交互，但主要针对自然图像或个人视觉历史，而非封闭视觉文档语料库上的排序端点。文档理解方向的 benchmark 如 DocVQA (Mathew et al., 2021)、MMLongBench-Doc (Ma et al., 2024)、M3DocRAG (Cho et al., 2024) 和 Document Haystacks (Chen et al., 2024) 将检索作为 QA 的支撑环节，不直接评估文档排序质量。因此，agentic search 与视觉富文档排序的交叉领域此前是空白的：既没有 benchmark 在共享的 ranked-output contract 下同时评估静态检索器和 tool-using agent，也没有 benchmark 通过结构化的证据路径设计来分离局部匹配能力与语料库上下文推理能力。VisDocAgentBench 正是填补这一缺口，通过 relation-preserving 的证据路径构造和 full-document 审查，将 corpus-grounded 的证据结构与用于求解它的检索范式分离开来。", "core_insight": "### § 3 重建作者的思考路径\n\n在构思 VisDocAgentBench 之前，作者可能首先注意到视觉富文档检索领域的一个根本性张力：一方面，以 ColPali 为代表的 late-interaction visual retriever 在直接的 query-page matching 上表现优异，能够有效利用页面的语言、layout 和 structured visual elements；另一方面，文档作为设计过的信息载体，其相关性往往不是局部可见的，而是分布在 corpus 的多个页面中——例如某个概念在 A 页定义，在 B 页被引用，在 C 页以特定图表呈现。这种跨页的 compositional relevance 是静态单次检索无法触及的。\n\n随后，作者可能观察到 agentic search 的兴起：Language-model agents 能够通过 iterative retrieval、tool use 和 evidence accumulation 来处理复杂任务。然而，现有的 agentic visual-search benchmarks 要么聚焦于自然图像，要么将检索作为 QA 或 report generation 的中间步骤，从未直接评估 agent 在封闭视觉文档语料库中的 final document ranking 能力。这留下了一个关键的评估空白：我们不知道 agent 的迭代搜索和检查能力是否能弥补静态检索器在分布式证据上的失败。\n\n基于这些观察，作者可能推演：如果构造一个包含不同证据路径深度（direct、one-bridge、two-bridge）的 benchmark，就能精确量化静态检索在跨页推理上的退化程度，同时检验 agent 能否通过 modality-preserving 的视觉搜索和 evidence-directed 的页面检查来恢复这种损失。关键在于，检索的相关性必须依赖于 corpus context，而非仅靠 target-local evidence 即可判定。\n\n### § 4 核心 Intuition\n\n静态检索器在直接匹配上近乎完美，但一旦相关性依赖于分布在语料库多页中的证据链，其性能便急剧崩溃，因为 query-page matching 无法捕获跨页的语义和关系依赖。Agent 通过迭代搜索和视觉检查能够恢复大部分损失，但前提是检索过程必须保留视觉模态的完整表示——而非降级为 OCR text——并让 planner 基于已观察的证据来引导后续搜索和最终排序。核心 insight 是：视觉文档的 compositional relevance 要求将检索从一次性的 modality-agnostic 匹配，转变为 modality-preserving 的发现与 evidence-directed 的验证相交织的迭代过程。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《VisDocAgentBench: Benchmarking Agents for Visually Rich Document Retrieval》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出的核心研究问题是：在视觉富文本文档的封闭语料库中，当查询的相关性不仅依赖目标页面本身的局部信息，还依赖散布在语料库其他页面中的上下文证据时，静态 one-shot 检索与具备迭代搜索和页面检查能力的 agentic 检索各自能达到怎样的文档排序性能。具体而言，作者构建了 VisDocAgentBench，包含 2,375 个页面图像和 120 个查询，查询被均衡地划分为 direct、one-bridge 和 two-bridge 三种证据结构，以系统性地测试检索系统在需要零、一、或两个跨页面语义桥接时的表现。这个问题的重要性在于，视觉富文档（如科学论文）是一种设计过的信息载体，其语义由语言、二维布局、表格、图表、公式等共同编码，识别一个目标页面往往既需要阅读其局部文本-布局组合，又需要将其与语料库中其他位置的定义、结果或条件相关联。然而，现有检索评估几乎全部采用 one-shot query–page matching 协议，无法暴露当相关性分布于多个页面时检索系统的真实瓶颈。解决这一问题能够为社区提供一个区分局部匹配能力与语料库上下文推理能力的诊断工具，并通过受控的 ablation 和 trace 分析，精确定位剩余失败发生在 target discovery、candidate examination 还是 evidence-role integration 阶段，从而推动将 modality-preserving 表示与 evidence-directed 搜索策略联合开发。 ### § 2 前人工作与不足 该问题此前未被直接解决，存在一个明确的评测缺口。在视觉检索方面，以 CLIP (Radford et al., 2021)、LiT (Zhai et al., 2022) 和 sigmoid loss (Zhai et al., 2023) 为代表的大规模 vision–language pretraining 通过 dual-encoder 和对比目标实现了可扩展的 open-vocabulary 图像匹配，后续...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在构思 VisDocAgentBench 之前，作者可能首先注意到视觉富文档检索领域的一个根本性张力：一方面，以 ColPali 为代表的 late-interaction visual retriever 在直接的 query-page matching 上表现优异，能够有效利用页面的语言、layout 和 structured visual elements；另一方面，文档作为设计过的信息载体，其相关性往往不是局部可见的，而是分布在 corpus 的多个页面中——例如某个概念在 A 页定义，在 B 页被引用，在 C 页以特定图表呈现。这种跨页的 compositional relevance 是静态单次检索无法触及的。 随后，作者可能观察到 agentic search 的兴起：Language-model agents 能够通过 iterative retrieval、tool use 和 evidence accumulation 来处理复杂任务。然而，现有的 agentic visual-search benchmarks 要么聚焦于自然图像，要么将检索作为 QA 或 report generation 的中间步骤，从未直接评估 agent 在封闭视觉文档语料库中的 final document ranking 能力。这留下了一个关键的评估空白：我们不知道 agent 的迭代搜索和检查能力是否能弥补静态检索器在分布式证据上的失败。 基于这些观察，作者可能推演：如果构造一个包含不同证据路径深度（direct、one-bridge、two-bridge）的 benchmark，就能精确量化静态检索在跨页推理上的退化程度，同时检验 agent 能否通过 modality-preserving 的视觉搜索和 evidence-directed 的页面检查来恢复这种损失。关键在于，检索的相关性必须依赖于 corpus context，而非仅靠 target-local evidence 即可判定。 ### § 4 核心 Intuiti... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：## **VisDocAgentBench: Benchmarking Agents for Visually Rich Document Retrieval** **Lexiang Hu**[1] _[,][†]_ , **Yanzhao Zhang** , **Mingxin Li** , **Dingkun Long** , **Yikang Li**[1] , **Fuwei Zhang** , **Yisen Wang**[1] , **Zhouchen Lin**[1] \u003E 1State Key Lab of General AI, School of Intelligence Science and Technology, Peking University Visually rich documents encode relevance through language, layout, structured visual elements, and corpus context, yet retrieval is typically evaluated by one-shot query–page matching. Agentic-search benchmarks usually score downstream question answering or report generation, leaving document ranking under iterative evidence acquisition underexplored. We introduce VisDocAgentBench, a closed-corpus benchmark comparing static and agentic retrieval under a shared ranked-output contract. It contains 2,375 pages from 100 documents and 120 unique-target queri...", "additional_insights": "### § 8 Take-aways\nVisDocAgentBench 是首个在 closed-corpus 中直接评估 agentic visual-document retrieval 最终 ranking 的 benchmark，通过 direct、one-bridge 和 two-bridge 三种 evidence structure 量化了 corpus context 对相关性的影响。即使是强大的 late-interaction visual retriever，在依赖跨页证据的 two-bridge 查询上 Recall@1 也会从 97.50% 骤降至 2.50%，证明单次 query-page matching 无法解决分布式证据问题。Agentic search 能显著恢复 static retrieval 的性能损失，但不同 planner 间差异巨大，表明仅提供工具访问不足以保证可靠的检索。视觉检索路线全面优于 OCR-text 路线，因为全页视觉表示保留了 OCR 索引在候选发现阶段可能丢弃的 layout 和结构化视觉证据。消融实验证实 iterative search 和 page inspection 是 agent 的关键能力，而提供完整的 support context 能进一步提升长路径查询的排序表现。Trace 分析将剩余的检索失败归因于 target discovery、candidate examination 和 evidence-role integration，指明了未来多模态检索 agent 的改进方向。\n\n### § 9 最脆弱的假设\n论文最脆弱且失败代价最大的假设是：通过 VLM 自动提取并验证的跨页 semantic alignments 能够构建出逻辑严密且人类可解的 evidence paths，同时这些 paths 能够被自然语言 query 准确表达而不泄露答案。在实际中，这个假设极易不成立：VLM 提取的跨页概念对齐可能存在“伪连接”或过于宽泛的语义重叠，导致所谓的 two-bridge 路径缺乏真正的推理必要性；更严重的是，在 query authoring 阶段，为了隐藏 semantic bridge 并使用 generic referents 替代具体概念，极易导致 query 变得晦涩或充满歧义。如果 query 语言不自然，agent 的检索失败将不是因为缺乏跨页推理能力，而是因为无法理解这种人为构造的生硬意图。论文虽然提供了 full-document review 和 hard-negative validation 作为证据，但缺少对最终 query 的人类可解性测试，没有证明人类专家在自然状态下能够顺畅理解并完成这些 two-bridge 查询。如果该假设不成立，整个 benchmark 测量的将不是 agent 的跨页推理能力，而是它们猜测生硬 query 构造意图的能力，核心贡献将直接失效。\n\n### § 10 最小复现实验\n如果只有 1 周时间，最小复现实验应验证“static retriever 在 multi-bridge 查询上失效，而 iterative agentic search 能恢复性能”这一核心 claim。使用论文开源的 VisDocAgentBench 的 120 个 queries 和 2,375 页语料库。首先，使用 Qwen3-VL-Embedding-8B 对所有页面进行 embedding，计算 query 与页面的 cosine similarity，复现 static visual retrieval baseline。接着，实现一个极简的 2-step agent：第一步用初始 query 检索 top-30 页面；第二步让一个多模态大模型（如 GPT-4o）阅读这 30 个页面的图像，提取关键概念并重新生成 search query，随后进行第二次检索获取 top-10 结果。测量 static baseline 和 2-step agent 在 L1 (direct) 和 L3 (two-bridge) 查询上的 Recall@1。如果 static baseline 在 L1 上 R@1 很高而在 L3 上极低，且 2-step agent 在 L3 上的 R@1 显著提升，则支持论文 claim；若 2-step agent 无改善或 static baseline 在 L3 上已表现良好，则反驳了 agentic interaction 解决分布式证据的必要性。这个方案无需复现复杂的 12-step planner 和完整的工具调用系统，却能有效检验核心逻辑。", "research_value": "### § 11 最强反例设计\n如果我要对这篇论文发起最有力的攻击，我会设计一个“Artificial Obfuscation Control”实验，直接挑战其核心假设：即 agentic search 的性能恢复源于跨页面的 evidence integration 能力。具体而言，我会从 VisDocAgentBench 的 direct (L1) 查询中抽取一个子集，并人为对这些 query 进行“生硬化”处理——使用与构造 two-bridge (L3) 查询时相同的 generic referents 替换掉 L1 query 中的具体概念，但完全不引入任何真实的跨页面 semantic bridge。例如，将直接查询“展示ResNet50在ImageNet上准确率的图表”修改为“展示某种残差网络在某个大型视觉数据集上性能的图表”，此时目标页面仍然在语料库中且无需跨页推理，但 query 本身变得高度模糊。如果实验结果显示，agentic search 在这些“虚假的 L3”查询上获得了与真实 L3 查询相似的性能提升，那么这就提供了一个致命的替代解释：agent 的收益并非来自跨页面的证据积累与推理，而是仅仅因为 LLM planner 擅长“解码”这种不自然的、过度泛化的 query 表达，并通过 iterative search 进行试错式的语义猜测。这将证明 VisDocAgentBench 测量的不是系统的 corpus context reasoning 能力，而是对生硬 query authoring 的容错率。此外，我会引入一个“Distractor Corpus Expansion”真实世界场景，将原本 100 篇文档的封闭语料库扩充至 1,000 篇包含大量相似术语但无关结论的科学论文。在这种高噪声环境下，agentic search 的迭代搜索会遭遇 combinatorial explosion，planner 极易陷入由表面语义相似但逻辑无关的 hard negatives 构成的推理循环。我预测在这种条件下，agentic search 的性能不仅无法恢复，甚至会因为 hallucination 和无效的工具调用而降至 static retriever 之下，从而彻底推翻 agentic paradigm 在真实、开放、高噪声文档检索中的根本有效性。\n\n### § 12 Follow-up Research Idea\n驱动这一想法的局限是 VisDocAgentBench 固有的“静态意图假设”：它强迫一个复杂的、多跳的 information need 被压缩在一个单一的初始 query 中，导致 agent 只能盲目猜测隐藏的 semantic bridge，这在真实场景中极不自然。我提议将范式从“autonomous bridge guessing”转变为“Proactive Evidence Scaffolding for Interactive Document Retrieval”，将 agent 的目标从直接产出 ranking 转变为识别用户 query 中的 epistemic gaps 并主动发起 clarifying interaction。我们可以借鉴 Interactive Information Retrieval (IIR) 中的 uncertainty sampling 和 Visual Question Answering (VQA) 中的 conversational grounding 技术，让 agent 在检索过程中不仅返回文档，而是动态生成基于视觉和文本的 clarifying questions（例如：“您指的‘性能提升’是图 2 中的 accuracy 还是表 3 中的 efficiency？”）。第一个实验将构建一个交互式检索环境，使用 VisDocAgentBench 的 two-bridge 查询作为初始输入，但赋予 agent 一个最多 3 轮的 clarification budget。Agent 必须基于当前检索到的 ambiguous candidates 提出结构化问题，由模拟的用户 oracle（拥有 ground-truth evidence path 信息）进行回答，随后 agent 再输出最终 ranking。我们将测量这种 interactive scaffolding 在最终 Recall@1 上的表现以及 interaction cost，并将其与原始的 autonomous 12-step planner 进行对比。这一提议与现有的 agentic search 和 multi-turn VQA 有着本质区别：它不假设初始 query 是完美的，也不旨在直接生成最终答案，而是将多跳文档检索重新定义为一种 collaborative intent reduction process，其中 agent 的核心价值在于通过 modality-preserving 的证据展示来主动降低意图的不确定性，而非在信息真空中进行孤立的推理。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Lexiang Hu\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Yanzhao Zhang\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Mingxin Li\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Dingkun Long\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Yikang Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Fuwei Zhang\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Yisen Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhouchen Lin\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Peking University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"†\", \"text\": \"Work done during internship at Token Foundry, Alibaba Group.\"}\n  ]\n}\n```", "summary_translation": "视觉丰富的文档通过语言、布局、结构化视觉元素和语料库上下文来编码相关性，然而检索通常通过单次 query--page matching 进行评估。Agentic-search benchmarks 通常对下游 question answering 或 report generation 进行评分，导致在迭代证据获取下的文档排序仍未得到充分探索。我们引入了 VisDocAgentBench，这是一个 closed-corpus benchmark，旨在共享的 ranked-output contract 下比较 static 和 agentic retrieval。它包含来自 100 份文档的 2,375 页以及 120 个 unique-target queries，这些查询在 direct、one-bridge 和 two-bridge 证据结构之间保持平衡。Relation-preserving construction 产生 semantic、relational 和 visual queries，随后进行 full-document review 和 hard-negative validation。一个强大的 late-interaction visual retriever 在 direct items 上达到 97.50% 的 Recall@1，但在 two-bridge items 上仅为 2.50%，这暴露了当相关性依赖于语料库上下文时 query--target matching 的局限性。Agents 恢复了大部分损失，但 planner 的选择和 retrieval representation 仍然是决定性的。每个 planner 在 visual retrieval 下表现更好，其最佳 R@1 达到 67.50%，而 OCR-text 为 37.50%。Ablations 确认 iterative search 和 page inspection 是关键能力，并且提供完整的支持上下文改善了两种路径上的排序。Trace analysis 将剩余的损失定位到 target discovery、candidate examination 和 evidence-role integration。这些发现推动了将 modality-preserving discovery 与 evidence-directed verification 相结合的 retrieval agents 的发展。"}]}, {"name": "Agent Efficiency \u0026 Cost", "count": 2, "papers": [{"title": "AsymSpec: Context-Asymmetric Speculative Decoding for Agentic LLMs", "arxiv_id": "2608.26004", "authors": "Sheng Liang, Yongyue Zhang, Nathanael Brian, Hang Lv, Hao Wang, Chen Zhang, Yong Liu", "summary": "Agentic LLM pipelines face escalating inference costs as context accumulates across retrieval, tool use, and multi-turn interactions. To control latency, deployments routinely compress inputs, but this degrades task accuracy. Speculative decoding (SD) accelerates generation losslessly, yet it assumes the drafter and verifier share an identical context, preventing SD from resolving the accuracy-overhead trade-off. We propose AsymSpec, an asymmetric speculative decoding framework that breaks this symmetry: a lightweight drafter reads the full input while the large verifier operates on the compressed view. The drafter steers the verifier via a contrastive $δ$-fusion of logits, modulated by a divergence-aware acceptance gate that preserves verification stability and high draft acceptance rates. Evaluated across four agentic capabilities and two end-to-end agent benchmarks, AsymSpec reaches $\\approx 90\\%$ of full-context accuracy on average, delivering $1.3$--$1.7\\times$ throughput speedups at $0.2$--$0.3\\times$ the compute cost on isolated text capabilities. These results show that asymmetric context access yields substantial gains precisely when compression discards critical reasoning signals.", "category": "cs.CL", "cluster": "Agent Efficiency \u0026 Cost", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agentic LLMs, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决的核心问题是：agentic LLM pipelines 中 context 累积导致的 inference cost 与 task accuracy 之间的刚性 trade-off。在 retrieval、tool use、multi-turn dialogue 等 agentic 场景下，retrieved passages、tool observations 和 interaction histories 不断累积，forward pass 成为 dominant latency bottleneck，context length 成为 inference overhead 的主要驱动因素。生产部署通常通过 compress context（如 RAG pipeline 对 retrieved passages 做 summarization、tool-use agent 仅传 API signature 而非完整文档、multimodal workflow 用 short captions 替代 raw images）来控制 latency，但 compression 系统性地丢弃了 task accuracy 所依赖的 fine-grained details。这就形成了一个刚性困境：要么承受 full-context generation 的高 latency，要么接受 compression 导致的显著 accuracy 下降。Speculative decoding (SD) 虽然能 lossless 加速 generation，但其 foundational constraint 要求 drafter 和 verifier 处理相同的 input tokens——一旦 verifier 被压缩，SD 只能加速压缩后的模型，无法恢复 compression 移除的信息。论文提出的 ASYMSPEC 通过打破这种 context symmetry 来解决该问题：轻量级 drafter 读取 full input 以重建被丢弃的信息，大型 verifier 仅在 compressed view 上运行以保持效率，两者通过 contrastive δ-fusion 和 Context-Divergence Acceptance (CDA) gate 耦合。这一方案的价值在于开辟了一个此前不可达的 operating point——以 compressed cost 实现近 ceiling accuracy，且 accuracy gain 随 compression severity 单调增长，为从业者提供了明确的生产部署决策依据。该问题的重要性在于 agentic pipeline 已成为现代 LLM 部署的主流形态，而 context 累积引起的 inference overhead 是生产环境中最普遍且最关键的瓶颈之一。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决，现有工作在各自维度上存在结构性限制。**Standard speculative decoding**（Leviathan et al., 2023; Chen et al., 2023）及其改进工作 EAGLE（Li et al., 2024c）、Medusa（Cai et al., 2024）、TriForce（Sun et al., 2024）、MagicDec（Sadhukhan et al., 2025）均要求 drafter 和 verifier 处理相同 input tokens。这一 symmetry 并非工程疏忽，而是 SD 通过 rejection sampling 保持 target distribution 的理论保证所要求的——SD 加速的是固定的 target distribution，不改变 target model 所见内容。因此 SD 要么让两个模型都承受 full-context cost，要么都继承 compression loss，无法利用 long-context decoding 中固有的 compute asymmetry（per-step latency 由大型 verifier 主导，轻量级 drafter 的额外 forward pass 开销可忽略）。**Context compression 方法**（LLMLingua（Jiang et al., 2024）、Gist Tokens（Mu et al., 2023）、ICAE（Ge et al., 2024）、StreamingLLM（Xiao et al., 2024）、SnapKV（Li et al., 2024a））将 accuracy degradation 视为 compression 的不可避免代价，未探索通过 decoding-time 机制恢复被丢弃信息的可能性。**Speculative Contrastive Decoding (SCD)**（Yuan et al., 2023）将 contrastive logit fusion 引入 speculative loop，但其 logit differences 衡量的是 model-capacity gap（expert vs. amateur），且 expert 和 amateur 在同一 shared context 上操作——当两者都读取 compressed view 时，contrastive fusion 无法恢复 compression 诱导的信息损失。论文实验证实 SCD 在所有测试 cell 中均处于或低于 Floor 水平（LongBench mean 43.8 vs. Floor 45.0），证明 single-context contrastive fusion 在 compression recovery 场景下根本无效。**RAPID**（Chen et al., 2025）虽然探索了 asymmetric configuration，但采用 inverse design——retrieval-truncated drafter 引导 full-context verifier，优先保持 full-context fidelity 但代价是 full-context latency（1.01× FLOPs），处于与 ASYMSPEC 相反的 trade-off 点。**Multimodal SD 方法**（SpecVLM、Spec-LLaVA、ViSpec、MASSV）专注于 visual-token prefill 加速或保持两个模型在同一 modality 内，未利用 asymmetric context access 来改变 efficiency operating point。**Agent-oriented speculation**（Ye et al., 2025; Nichols et al., 2025; Hua et al., 2024）在 action sequence、tool invocation 或 plan 级别进行 speculation，这些 action- 和 request-level 机制与 token-level decoding engine 正交，无法解决 compression 导致的 token-level accuracy loss。总体而言，前人工作未解决该问题的根本原因是：SD 的 distribution preservation 保证强制 context symmetry，contrastive decoding 的 subtractive principle 未被扩展到 cross-context 场景以隔离 context-gain signal，而 compression 方法将 accuracy loss 视为不可逆。ASYMSPEC 的关键创新在于认识到同一 drafter 在 full 和 compressed context 上的两次 forward pass 之差（δ = a − b）可以 cancel drafter 自身的 context-independent preferences，从而隔离出纯粹的 context-induced information gain——这一 signal isolation 机制在 prior work 中从未被提出或验证。", "core_insight": "### § 3 重建作者的思考路径\n\n作者可能首先观察到，在 Agentic LLMs 的实际部署中，随着 retrieval、tool use 和 multi-turn interactions 的进行，context 累积导致的 inference latency 成为了主要瓶颈。工业界常规的解决方案是进行 context compression（如 RAG 总结、仅保留 API signatures），但这会系统性地丢弃细粒度信息，迫使系统在 accuracy 与 overhead 之间做出 rigid trade-off。\n\n接着，作者会审视现有的无损加速方案 Speculative decoding (SD)。SD 通过 lightweight drafter 提议 token、large verifier 并行验证来加速生成。然而，SD 存在一个根本性的对称约束：drafter 和 verifier 必须处理相同的 input tokens。这意味着，如果为了降低延迟而压缩了 verifier 的输入，drafter 也只能看到压缩后的视图，SD 仅仅加速了压缩后的模型，无法恢复因 compression 而丢失的推理信号。\n\n在此基础上，一个关键的结构性洞察是 compute asymmetry：在 SD 的每一步推理中，延迟主要由 large verifier 的 forward pass 主导，而 lightweight drafter 的额外前向传播开销可以忽略不计。如果只压缩 verifier 的输入，就能获得绝大部分的延迟收益，而让 drafter 读取 full input 的代价极低。但标准 SD 的对称性约束阻碍了这一潜力的挖掘。\n\n为了将 drafter 看到的完整信息传递给 verifier，作者借鉴了 Contrastive decoding 的思想。传统 Contrastive decoding 通过减去 amateur model 的 logits 来放大 expert model 的信号。受此启发，作者提出让同一个 drafter 分别处理 full context 和 compressed context，将得到的 logits 相减得到 $\\delta$。这一操作能够消除 drafter 自身的 context-independent preferences（即 capacity bias），精准隔离出由 uncompressed input 带来的 information gain。\n\n最后，为了在严重压缩下维持验证的稳定性，作者发现当 full 和 compressed views 差异过大时，固定的 acceptance threshold 会过度拒绝 drafts。因此，引入了 Context-Divergence Acceptance (CDA) gate，根据两者的 divergence 程度动态放松阈值，确保在信息增益最大的位置放宽接受标准，从而在严重压缩下仍能维持高 draft acceptance rate。\n\n### § 4 核心 Intuition\n\nSpeculative decoding 的延迟瓶颈在于大型 verifier，而轻量级 drafter 的计算开销微乎其微。打破标准 SD 中 drafter 与 verifier 必须读取相同 context 的对称性，让 verifier 仅处理压缩 context 以维持高吞吐，同时让 drafter 读取完整 context 以捕获被丢弃的细节。通过让同一个 drafter 分别处理完整与压缩 context 并相减其输出 logits，可以提取出纯粹由额外 context 带来的信息增益，再将该增益注入 verifier，从而在不增加 verifier 计算负担的前提下恢复其推理精度。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《AsymSpec: Context-Asymmetric Speculative Decoding for Agentic LLMs》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文解决的核心问题是：agentic LLM pipelines 中 context 累积导致的 inference cost 与 task accuracy 之间的刚性 trade-off。在 retrieval、tool use、multi-turn dialogue 等 agentic 场景下，retrieved passages、tool observations 和 interaction histories 不断累积，forward pass 成为 dominant latency bottleneck，context length 成为 inference overhead 的主要驱动因素。生产部署通常通过 compress context（如 RAG pipeline 对 retrieved passages 做 summarization、tool-use agent 仅传 API signature 而非完整文档、multimodal workflow 用 short captions 替代 raw images）来控制 latency，但 compression 系统性地丢弃了 task accuracy 所依赖的 fine-grained details。这就形成了一个刚性困境：要么承受 full-context generation 的高 latency，要么接受 compression 导致的显著 accuracy 下降。Speculative decoding (SD) 虽然能 lossless 加速 generation，但其 foundational constraint 要求 drafter 和 verifier 处理相同的 input tokens——一旦 verifier 被压缩，SD 只能加速压缩后的模型，无法恢复 compression 移除的信息。论文提出的 ASYMSPEC 通过打破这种 context symmetry 来解决该问题：轻量级 drafter 读取 full input 以...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 作者可能首先观察到，在 Agentic LLMs 的实际部署中，随着 retrieval、tool use 和 multi-turn interactions 的进行，context 累积导致的 inference latency 成为了主要瓶颈。工业界常规的解决方案是进行 context compression（如 RAG 总结、仅保留 API signatures），但这会系统性地丢弃细粒度信息，迫使系统在 accuracy 与 overhead 之间做出 rigid trade-off。 接着，作者会审视现有的无损加速方案 Speculative decoding (SD)。SD 通过 lightweight drafter 提议 token、large verifier 并行验证来加速生成。然而，SD 存在一个根本性的对称约束：drafter 和 verifier 必须处理相同的 input tokens。这意味着，如果为了降低延迟而压缩了 verifier 的输入，drafter 也只能看到压缩后的视图，SD 仅仅加速了压缩后的模型，无法恢复因 compression 而丢失的推理信号。 在此基础上，一个关键的结构性洞察是 compute asymmetry：在 SD 的每一步推理中，延迟主要由 large verifier 的 forward pass 主导，而 lightweight drafter 的额外前向传播开销可以忽略不计。如果只压缩 verifier 的输入，就能获得绝大部分的延迟收益，而让 drafter 读取 full input 的代价极低。但标准 SD 的对称性约束阻碍了这一潜力的挖掘。 为了将 drafter 看到的完整信息传递给 verifier，作者借鉴了 Contrastive decoding 的思想。传统 Contrastive decoding 通过减去 amateur model 的 logits 来放大 expert model 的信号。受此启发，作者提出让同一个 drafter 分别... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：## **AsymSpec: Context-Asymmetric Speculative Decoding for Agentic LLMs** **Sheng Liang[1] , Yongyue Zhang[1] , Nathanael Brian[1] , Hang Lv[2] , Hao Wang[2]** , **Chen Zhang[1]** , **Yong Liu[1]** , 1Huawei Technologies Co., Ltd. 2University of Science and Technology of China ## **Abstract** Agentic LLM pipelines face escalating inference costs as context accumulates across retrieval, tool use, and multi-turn interactions. To control latency, deployments routinely compress inputs, but this degrades task accuracy. Speculative decoding (SD) accelerates generation losslessly, yet it assumes the drafter and verifier share an identical context, preventing SD from resolving the accuracy–overhead trade-off. We propose ASYMSPEC, an asymmetric speculative decoding framework that breaks this symmetry: a lightweight drafter reads the full input while the large verifier operates on the compressed v...", "additional_insights": "## § 8 Take-aways\n\nAsymSpec 的核心创新在于打破了 speculative decoding 中 drafter 与 verifier 必须共享相同 context 的对称约束：verifier 仅处理压缩后的 context 以获得低延迟，而 lightweight drafter 读取完整 context 并通过 contrastive δ-fusion 将被压缩丢弃的信息重新注入 verifier 的 logits 中。δ 信号定义为同一 drafter 在 full context 与 compressed context 两次 forward pass 的 logits 之差（δ = a − b），这一同模型跨 context 的减法操作消除了 drafter 自身的 capacity bias，仅保留 context-induced 的信息增益。Context-Divergence Acceptance (CDA) gate 使用 Jensen-Shannon divergence 度量 full 与 compressed view 之间的分歧程度，并据此动态调节 acceptance threshold（γ_eff = γ · exp(−D_i)），在 context 分歧大的位置放松接受条件以避免过度拒绝有用的 draft tokens，同时利用 JSD 的严格上界保证 γ_eff ∈ [γ/2, γ] 无需引入额外超参数。实验表明 AsymSpec 在四个 agentic capability 和两个 end-to-end agent benchmark 上平均恢复约 90% 的 full-context accuracy，在文本任务上仅需 0.2–0.3× 的 FLOPs 并获得 1.3–1.7× 的 throughput 加速。精度恢复与压缩严重程度单调相关：在 near-lossless 压缩场景（如 MultiChallenge，Ceiling–Floor gap 仅 3.0 points）中 AsymSpec 几乎不产生干预，而在重度压缩场景（如 LongBench 500-token truncation）中可恢复 Floor–Ceiling gap 的三分之二以上。框架天然支持 cross-modal 扩展：vision-language drafter 处理原始图像，text-only verifier 仅读取 caption，δ 信号在共享的 output vocabulary 空间中计算，使得 text-only verifier 无需 multimodal 基础设施即可获得视觉推理能力。消融实验证明 same-model cross-context δ（a − b）显著优于 raw augmented logits（a only，差 2.8 F1）和 SCD-style 跨模型对比（t − b，差 11.7 F1），确认了信息增益的提取依赖于同一模型在两个 context view 上的减法操作而非通用的 logit fusion。Drafter 容量存在下限：≤0.6B 的模型无法可靠提取 context-gain 信号，≥1.7B 是实际最低要求。Cross-family 实验（Qwen–Llama 配对）表明 δ-fusion 在异构模型间可行但恢复程度因模型对而异，需要显式的 vocabulary alignment。\n\n## § 9 最脆弱的假设\n\n整个框架最关键的假设是：**lightweight drafter 在 full context 与 compressed context 上的 logits 之差 δ = a − b，能够忠实地编码 verifier 所需但被压缩丢弃的推理信号，且这些信号可以通过 logit 空间的加性注入有效传递给 verifier。** 这一假设是 δ-fusion 机制的理论基石——如果 δ 捕捉的不是\"context-gain\"而是 drafter 自身在小模型容量限制下产生的噪声或与 verifier 需求无关的偏好，那么将 δ 注入 verifier logits 不仅无法恢复精度，还可能引入系统性偏差。\n\n该假设在实际中可能不成立的原因有三层。第一，drafter 的容量瓶颈：4B 模型在 LongBench 上的 drafter-alone accuracy 仅为 54.6 F1（vs. 32B verifier 的 65.5 Ceiling），意味着 drafter 本身对 full context 的理解就是不完整的。如果被压缩丢弃的信息恰好是 drafter 自身也无法正确推理的部分（例如 multi-hop reasoning 中的跨段落证据关联），那么 δ 中不会包含有用的 steering 信号。论文在 §5.1 承认了这一结构性残余 gap（0.9–9.7 points），但将其归因于 \"verifier remains input-constrained\"，实际上同样可能源于 drafter 的 capacity 不足。第二，logit 空间的信息瓶颈：δ 是 vocabulary 维度的向量，它只能编码 next-token distribution 的偏移，无法传递结构化的推理链或跨 token 的依赖关系。如果压缩丢失的信息需要 verifier 在其 attention 层面重新建立 token 间的关联（而非简单的 token preference 调整），那么 logit-level steering 在原理上就无法恢复。第三，δ 的 bias-cancellation 假设依赖于 drafter 在 full 和 compressed context 上的 context-independent preferences 完全相同——但压缩可能改变 drafter 的 positional encoding 行为或 attention pattern，使得 a 和 b 的非 context 部分并不完全对齐，δ 中残留的 noise 会被 β = 1.0 的 fusion 权重放大。\n\n论文提供的支持证据包括 Table 6 的消融（same-model δ 优于替代方案）和 Table 2 的 truncation sweep（恢复随压缩严重度单调递增），以及 §6.3 的 token-level case study 展示了 δ-fusion 成功将 free-text 格式纠正为 structured schema。然而，这些证据均来自 drafter 容量充足（4B）且压缩方式相对温和的场景。论文缺少的关键证据是：在 drafter 容量接近下限（1.7B）且压缩极度激进（如 question-only compression，Table 17 中 Floor 仅 29.5）时，δ 信号的信噪比是否仍然足够——Table 17 显示该场景下 recovery 为 70%，但未报告 δ 的分布特征或 acceptance rate 变化，无法判断恢复是来自 δ-fusion 还是 CDA gate 的单独作用。\n\n## § 10 最小复现实验\n\n在一周时间内，最值得复现的核心 claim 是：**same-model cross-context δ（a − b）显著优于 raw augmented logits（a only）和 SCD-style 跨模型对比（t − b），且这一优势在压缩诱导信息丢失时才显现。** 这一 claim 是 AsymSpec 区别于已有 contrastive decoding 方法的根本所在，且可以在不实现完整 speculative decoding loop 的情况下验证。\n\n具体方案：使用 LongBench 的 hotpotQA 子集（200 个样本），以 truncation 至 1500 tokens 作为压缩方式（Table 2 中 Floor 32.6、Ceiling 65.5，gap 足够大）。选择 Qwen3-4B 作为 drafter、Qwen3-32B 作为 verifier（若算力受限可降至 Qwen3-1.7B drafter + Qwen3-4B verifier，但需注意 drafter ≥1.7B 的下限）。对每个样本执行三次 forward pass：drafter on full context 得到 logits a，drafter on truncated context 得到 logits b，verifier on truncated context 得到 logits t。然后比较三种 fusion 策略的 greedy decoding 输出：(1) AsymSpec 方式 argmax(t + β·(a − b))，(2) raw-augmented 方式 argmax(t + β·a)，(3) SCD-style 方式 argmax((1+β)·t − β·b)，β = 1.0。同时设置 Floor（verifier on truncated，argmax(t)）和 Ceiling（verifier on full context）作为参考。测量指标为 per-subset F1（LongBench 官方 metric）。\n\n预期结果：若论文 claim 成立，AsymSpec 方式（a − b）的 F1 应显著高于 raw-augmented（a only）约 3 points 并高于 SCD-style（t − b）约 12 points（参照 Table 6 的 59.7 vs. 56.9 vs. 48.0）。若三种 fusion 策略表现接近或 SCD-style 反而更优，则说明 same-model cross-context δ 的优势不成立，AsymSpec 的核心贡献将受到质疑。此实验无需实现 CDA gate、speculative loop 或 vLLM 修改，仅需标准 model forward pass + logit arithmetic，可在单张 GPU 上一天内完成数据收集。", "research_value": "### § 11 最强反例设计\n\n要构造对 AsymSpec 最具破坏性的反例，核心在于攻击其理论基石：即 logit 空间的加性偏移 $\\delta = a - b$ 能够等价于被压缩掉的复杂推理链。我设计了一个基于“深层多跳推理”与“激进语义压缩”交织的实验场景，旨在证明 AsymSpec 的精度恢复 merely 来自于 surface-level 的 lexical hinting（表层词汇提示），而非真正的 reasoning recovery。具体实验设计如下：选用 MuSiQue 或 2WikiMultihopQA 等强依赖跨段落实体关联的 multi-hop benchmark，采用“语义级激进截断”——不仅限制 token 数量至 500 tokens，而是使用强力的 LLM compressor 将中间推理桥接段落完全 summarization 掉，仅保留首尾段落。在此设置下，对比 AsymSpec 与一个“Lexical Oracle”基线：该基线不使用 drafter，而是直接将 full context 中的 named entities（通过 NER 提取）作为 hint 拼接到 verifier 的 prompt 末尾。如果 AsymSpec 的核心 claim（$\\delta$ 恢复了推理信号）成立，它应当在 multi-hop 的第二跳及之后的推理步骤中表现出显著的 accuracy 提升；反之，如果 AsymSpec 的 F1 表现仅仅与 Lexical Oracle 持平，且在“推理深度”指标（如 hop-wise accuracy）上未超过 Floor，则构成致命反例。这一结果将提供具体的替代解释：$\\delta$ 信号并非编码了“推理路径”，而仅仅是放大了 full context 中出现的 high-frequency entity tokens 的 logit 分布，本质上是一种昂贵的隐式 RAG，在需要 synthesizing 跨 token 依赖关系的场景下会可预测地失效。此外，通过测量该极端压缩场景下 $\\delta$ 向量的 entropy，预计会发现其呈现高度 peaked 分布（集中于少数实体词），从而在理论上证伪“$\\delta$ 忠实编码推理信号”的假设。\n\n### § 12 Follow-up Research Idea\n\n驱动这一 follow-up 研究的核心局限是：AsymSpec 将 context recovery 降维至 output vocabulary 空间的 logit arithmetic，这种 1D vector 加性操作在原理上无法重建被 compression 摧毁的 intra-context attention linkages（上下文内部的注意力关联）。当压缩丢弃了连接证据 A 与证据 B 的中间段落时，verifier 需要的不是 next-token preference 的微调，而是在其 self-attention 矩阵中重新建立 A 与 B 的 representation-level binding。为满足这一未被触及的需求，我提议借鉴 representation engineering 与 KV-cache manipulation 领域的工具，提出 **Context-Asymmetric Representation Steering (CARS)** 的新框架。CARS 不再进行 logit fusion，而是让 lightweight drafter 在处理 full context 时，提取其对应于被压缩段落的 KV-cache states，并通过一个轻量级的 cross-attention projector 将这些 representation states 动态注入 verifier 的中间层（而非 output 层）。这一框架将 context asymmetry 的耦合点从“输出分布矫正”前移至“计算图内部的状态注入”，从根本上绕过了 logit space 的信息瓶颈。第一个实验将聚焦于验证“表征注入”与“逻辑注入”在信息保真度上的差异：在 LongBench 的 multi-hop 子集上，对比 AsymSpec（logit-level $\\delta$-fusion）与 CARS（layer-wise KV injection）在恢复“被掩盖实体间关系”上的表现。实验将采用 probing classifier 挂载在 verifier 的中间层，检测在两种干预下，verifier 是否能在其 hidden states 中线性分离出被压缩丢弃的 multi-hop chain。若 CARS 的 probing accuracy 显著高于 AsymSpec，则证明真正的 context recovery 必须在 representation 层面而非 logit 层面发生，从而开启“跨上下文表征迁移”这一全新的研究方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Sheng Liang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yongyue Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Nathanael Brian\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hang Lv\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Hao Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Chen Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yong Liu\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Huawei Technologies Co., Ltd.\"},\n    {\"id\": 2, \"name\": \"University of Science and Technology of China\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "随着上下文在检索、工具使用和多轮交互中不断累积，Agentic LLM pipelines 面临着不断攀升的推理成本。为了控制延迟，部署通常会压缩输入，但这会降低任务准确率。Speculative decoding (SD) 能够无损地加速生成，然而它假设 drafter 和 verifier 共享相同的上下文，从而使得 SD 无法解决准确率与开销之间的权衡。我们提出了 AsymSpec，这是一个打破这种对称性的非对称 speculative decoding 框架：轻量级 drafter 读取完整输入，而大型 verifier 在压缩视图上运行。drafter 通过对比性的 logits $δ$-fusion 引导 verifier，该过程由 divergence-aware acceptance gate 进行调节，以保持验证稳定性和高 draft acceptance rates。在四个 agentic capabilities 和两个 end-to-end agent benchmarks 上的评估表明，AsymSpec 平均达到了约 90% 的 full-context accuracy，在 isolated text capabilities 上以 $0.2$--$0.3\\times$ 的计算成本实现了 $1.3$--$1.7\\times$ 的吞吐量加速。这些结果表明，恰恰在压缩丢弃关键推理信号时，非对称上下文访问能够带来显著的收益。"}, {"title": "Can your AI agent be cheaper? Investigating the effects of task specifications on token spend in agentic coding tasks", "arxiv_id": "2608.25399", "authors": "Jakub Smékal", "summary": "Agentic coding workflows are now widely deployed in real-world systems. With long-horizon reasoning and tool use, token usage has become an important consideration for both cost and efficiency. Two engineers using AI will solve the same problem differently. How the specification of a task shapes an agent's token spend, and whether that spend can be predicted in advance, are open questions. Here, we study the effects of different task specifications on agentic token spend with the Kimi K3 model at three thinking efforts. Across $2,700$ runs, we show that reducing a full task specification to a bare user story raises token spend by $29.7\\%$, while run-to-run variance remains unaffected by any prompt changes. We show that prompt-sensitivity is task-dependent, running from $13\\%$ to $115\\%$. We fit a simple predictor that can price a full distribution of task specifications and thinking effort configurations from a single cheap probe on an unseen task within $36\\%$, improving over prior work in predicting token spend. Our work provides initial results quantifying the effects of task specification on agentic token spend and introduces a method that can be used to systematically evaluate the cost of AI coding workflows.", "category": "cs.AI", "cluster": "Agent Efficiency \u0026 Cost", "tags": ["cs.AI"], "filter_reason": "论文的核心研究对象是 Agentic coding workflows（涉及 long-horizon reasoning 和 tool use 的 LLM 智能体）。虽然该论文主要是一项经验研究和评估，探讨任务规范如何影响智能体的 token 消耗和运行差异，但根据第一步的筛选标准，“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留”。此外，重要校准中也明确指出“不要只因为论文是 benchmark、evaluation、behavior analysis 就排除”。该研究揭示了 prompt 和任务规范对智能体行为的具体影响，有助于更好地理解和配置 coding agent，因此完全符合您的核心研究范围。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的核心研究问题是：在 agentic coding workflows 中，task specification（任务规范）的详细程度如何影响 AI agent 的 token spend（token 消耗），以及这种消耗能否在执行前被准确预测。随着模型能力的提升，agent 能够在极少人工干预下进行长程自主推理与工具调用，导致 token usage 成为决定系统部署成本与效率的核心因素。然而，由于 agentic token 消耗不仅绝对值巨大且具有高度随机性（同一 prompt 的两次运行消耗可能相差 30 倍），不同工程师对同一任务的描述差异将直接导致截然不同的成本。解决这一问题具有显著的工程与经济价值：它不仅量化了任务规范对 token 消耗的具体影响，还提出了一种通过单次低成本 probe 预测未见任务全配置成本分布的方法，帮助从业者在部署前系统性评估并优化 AI coding workflows 的成本。\n\n### § 2 前人工作与不足\n该问题此前未被完整解决，主要原因是前人研究在变量控制上存在盲区，将 prompt 和 model 视为孤立的变量。最相关的研究是 Bai et al. [4]，他们在 SWE-bench Verified 上评估了八个前沿模型，发现同一任务的 token 消耗差异可达 30 倍，且高消耗并不必然带来高准确率；但该研究固定了每个任务的 problem statement，仅变化模型，因此无法揭示任务规范细节的增减如何影响成本。另一类研究 [17, 18] 虽然变化了 prompt，但仅改变其表面形式而保持语义不变，且缺乏重复采样与成本维度的考量，无法反映实际工程中任务相关信息量变化带来的成本差异。此外，关于任务描述内容的研究 [5, 13] 探讨了 bug report 中哪些元素最受重视或与更高解决率相关，但未量化输入 prompt 变化对 token 消耗的影响；而关于 thinking effort 的研究 [3] 将推理预算视为优化对象，却默认 query 是固定的，忽略了任务描述方式与推理预算之间的交互作用。因此，在固定模型的情况下，任务描述细节水平的变化如何影响 token 成本及其 run-to-run variance（运行间方差），此前一直存在评测缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n在本文之前，agentic coding 的 token spend 研究沿两条独立线索展开。第一条线索以 Bai et al. [4] 为代表，固定每个 task 的 problem statement、只变 model，发现同一 prompt 的多次运行之间 token 消耗可相差 30 倍，且更高 spend 并不 reliably 买来 correctness。这条线索将 stochasticity 归因于 model 和 serving stack，却把 prompt 当作常量。第二条线索来自 prompt robustness 文献 [17, 18]，它们变 prompt 但只变 surface form（paraphrase），保持 task-relevant information 不变，且不关心 cost outcome。两条线索之间留下了一个空白：**task description 中实际信息量的多寡如何影响 token spend**，没有人系统测量过。\n\n与此同时，软件工程领域的经验研究提供了方向性线索。Bettenburg et al. [5] 发现 bug report 中最有价值的元素（fix suggestion、reproduction script、localization）恰恰是最难提供的；Khatib et al. [13] 将这一发现迁移到 AI agent 上，确认这些元素与更高的 resolution odds 相关。但这些工作关注的是 solve rate，而非 token cost——它们回答了\"什么信息有用\"，却没有回答\"什么信息昂贵\"。一个自然的问题是：如果给 agent 更多信息能提高成功率，那省略这些信息是否会让 agent 花更多 token 去自行发现，从而推高 cost？\n\nThinking effort 文献 [3] 提供了第三个线索。这类工作将 reasoning budget 视为待优化的量，但默认 query 是给定的。作者可能注意到一个未被检验的假设：**thinking budget 的购买力取决于 task 被如何描述**。如果 prompt 已经包含了 localization 和 acceptance scenarios，模型不需要花 turn 去探索；如果 prompt 只有一个 bare user story，模型必须用 reasoning 来弥补信息缺口。这意味着 specification detail 和 thinking effort 之间可能存在 substitute 关系——而这个交互效应在固定 prompt 的 benchmark 中完全不可见。\n\n最后，成本结构本身提供了一个实践线索。在 high cache hit rate 的 serving stack 中，output tokens 虽然只占 processed tokens 的 2.7%，却占 dollars 的 51.1%。这意味着 input-side 的优化（如 prompt compression）触及的 cost 份额很小，而减少 turns 才是主要杠杆。如果 prompt 的详细程度主要影响 turns 而非 input length，那么 prompt design 就是一个被低估的 cost lever。\n\n将这些线索拼合：作者需要固定 model、系统性地改变 task specification 的信息量（而非 surface form），在多个 thinking effort 下重复运行，同时记录 cost 和 solve rate。进一步，如果不同任务之间 cost 对 prompt 的响应模式（shape）有共享结构，那么从少量已知任务学习 shape、再用一次 cheap probe 校准新任务的 level，就能预测未见任务的全分布 cost——这正是 Bai et al. [4] 用 model self-estimation 失败做到的事情。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 intuition 是两步分解。**第一步**：specification detail 和 thinking effort 是 substitutes，但仅在 thinking scarce 时成立——prompt 省略的信息由 model reasoning 弥补，低 effort 下这笔 reasoning 直接体现为额外 turns 和 cost；高 effort 下模型本就大量推理，prompt 给不给这些信息几乎不影响 cost。**第二步**：一个未见任务的 cost 分布可以分解为 shared shape（哪些 configuration 相对昂贵，可从其他任务学习）乘以 task-specific level（该任务整体多贵，用一次 cheap probe 运行校准）。先前方法失效是因为它们要么固定 prompt 只变 model、要么只变 surface form 不变 information，从未将 task specification 的信息量作为变量来定价；这个方法奏效是因为它抓住了\"prompt 移动 mean 但不移动 variance\"这一结构，使得 shape 可迁移、level 可探测。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+-------------------+      +-----------------------+      +-------------------+\n| SWE-bench Tasks(5)| ---\u003E | Spec Generator (12)   | ---\u003E | Execution Grid    |\n+-------------------+      | - 10 Spec Variations  |      | 12 specs x 3 eff  |\n                           | - 2 Anchors(raw/oracle|      | x 15 repeats      |\n                           +-----------------------+      +---------+---------+\n                                                                     |\n                                                                     v\n+-------------------+      +-----------------------+      +-------------------+\n| Held-out Task (1) | ---\u003E | Probe Run (k=1)       |      | Run Results       |\n+-------------------+      | (Full Spec, Low Eff)  |      | (Cost, Turns)     |\n                           +-----------+-----------+      +---------+---------+\n                                       |                            |\n                                       v                            v\n                           +-----------------------+      +-------------------+\n                           | Shared Shape (from 4) | \u003C--- | Prediction Model  |\n                           +-----------+-----------+      +---------+---------+\n                                       |                            |\n                                       +-------------+--------------|\n                                                     v\n                                          +-----------------------+\n                                          | Predicted Cost Dist.  |\n                                          +-----------------------+\n```\n\n本论文的完整 pipeline 旨在探究 task specification 对 agentic token spend 的影响，并构建成本预测模型。以真实任务 `xarray-7393` 为例，整个流程的输入、处理与输出如下：\n\n- **输入**：选取 SWE-bench Verified 中的 5 个 agentic coding 任务（如 `xarray-7393` 修复 `stack` 操作中 coordinate dtype 丢失的 bug）。\n- **处理**：\n  1. **Spec Generator (12)**：基于 GitHub Spec Kit 模板，将原始 issue 转化为 12 种不同细节水平的 task specifications。例如，包含所有 8 个部分的 `full spec`，仅保留 header 和 user story 的 `minimal`，以及直接提供失败测试输出的 `raw` anchor。\n  2. **Execution Grid**：将 12 种 specs 与 3 种 thinking efforts (low, high, max) 组合，每种配置重复 15 次，共产生 2700 次运行。使用 Kimi K3 模型在 mini-swe-agent scaffold 下执行，记录每次运行的 cost、tokens、turns 和 solve rate。这些结果汇入 **Run Results**。\n  3. **Prediction Model**：采用留一法交叉验证。将 `xarray-7393` 作为 Held-out Task，用其余 4 个任务的 Run Results 拟合出跨配置的 **Shared Shape**（即哪些配置相对更昂贵）。随后，对 `xarray-7393` 执行 1 次低成本的 **Probe Run**（使用 `full spec` 与 `low effort`，花费 0.11 USD），以确定该任务的基准 cost level。\n- **输出**：**Prediction Model** 结合 Probe Run 的 level 与其他 4 个任务学到的 Shared Shape，输出 `xarray-7393` 在其余 32 种未测试配置下的 **Predicted Cost Dist.**（预测成本分布）。\n\n### § 6 核心数学推导\n\n论文的核心数学推导集中在成本预测模型上。该模型旨在用一次廉价的 probe run 预测未见任务在所有配置下的成本。\n\n设 $y_{tbe}$ 为任务 $t$ 在 specification $b$ 和 thinking effort $e$ 下的平均 log cost。$y_{\\bar{t}}$ 是任务 $t$ 在所有配置下的平均 log cost。模型将成本分解为“任务固有水平”和“配置相对形状”两部分：\n\n1. **Shared Shape 计算**：从 4 个训练任务 $T'$ 中学习配置 $(b, e)$ 的相对成本偏移：\n   $$ \\text{shape}_{be} = \\frac{1}{|T'|} \\sum_{t \\in T'} (y_{tbe} - y_{\\bar{t}}) $$\n   *Intuition*：这个公式衡量了特定配置（如使用 `minimal` spec 与 `max` effort）相对于该任务平均成本的增加或减少。通过在多个任务上取平均，提取出一种跨任务通用的“配置价格表”。\n\n2. **Level 估计**：对未见任务 $h$，在固定配置 $(b_0, e_0)$ 下进行 $k$ 次 probe runs，得到 log costs $z_1, \\ldots, z_k$，其基准水平估计为：\n   $$ \\hat{y}_h = \\frac{1}{k} \\sum_{i=1}^k z_i $$\n   *Intuition*：用单次或少数几次实测成本的均值，来代表这个未知任务的整体难度和基础消耗。\n\n3. **成本预测**：结合上述两部分，预测任务 $h$ 在任意配置 $(b, e)$ 下的成本：\n   $$ \\hat{y}_{hbe} = \\hat{y}_h + \\text{shape}_{be} $$\n   *Intuition*：总成本等于任务的基准难度加上该特定配置带来的额外开销。这种“水平+形状”的加性模型使得仅需一次极低成本的探测，就能勾勒出整个任务的成本曲面。\n\n### § 7 实验设计与结论\n\n这篇论文通过严密的实验设计回答了关于 agentic coding 成本控制的核心问题：\n\n**问题 1：Task specification 的变化在多大程度上影响 agentic token spend 和 run-to-run variance？**\n**实验设计**：构造 12 种不同细节水平的 task specifications，在 3 种 thinking efforts 下运行 2700 次，测量 cost 和 turns，并计算同一配置多次运行间的方差。\n**问题答案**：Prompt 显著影响平均 token spend。将完整 spec 缩减为 bare user story 会使 cost 增加 29.7%，turns 增加 16.4%。然而，prompt 变化不影响 run-to-run variance，重复运行的方差（约 ×1.34）是由 cost 水平本身决定的，与任务描述无关。\n\n**问题 2：Task specification 与 thinking effort 如何交互影响成本？**\n**实验设计**：比较在不同 thinking efforts (low, high, max) 下，spec 变化对 cost 和 turns 影响的幅度变化。\n**问题答案**：Prompt leverage 随 thinking effort 升高而减小。在 low effort 下，最贵与最便宜 spec 的 cost 比率为 ×2.13，而在 max effort 下降至 ×1.61。这表明 specification detail 和 thinking effort 是替代关系，但仅在 thinking 稀缺时成立；当模型推理能力充足时，prompt 细节的影响减弱。\n\n**问题 3：能否通过低成本测量预测未见任务在所有配置下的 token spend？**\n**实验设计**：采用留一法交叉验证，用 4 个任务学习 shared shape，对第 5 个未见任务进行 1 次 probe run (0.11 USD)，预测其 32 种未测试配置的 cost，并与无 probe 的基线对比。\n**问题答案**：可以。无 probe 时预测误差高达 161%，而仅用 1 次 0.11 USD 的 probe run 就将误差降至 36%，且 67% 的配置预测值落在实际值 ±50% 范围内。这证明了通过极低成本的探测即可有效校准未知任务的成本曲线。", "additional_insights": "### § 8 Take-aways\n任务规范的详细程度显著影响 agentic coding 的平均 token 消耗：将完整规范缩减为纯 user story 会使成本增加 29.7%，且在所有测试任务上方向一致。任务规范的变化不影响 run-to-run variance：相同配置的重复运行具有 1.34 倍的几何标准差，且没有任何规范变体能缩小或扩大这一方差。Prompt 对成本的敏感性强依赖于具体任务：相同的规范缩减在不同任务上导致的成本增加幅度从 13% 到 115% 不等。Thinking effort 与 specification detail 存在替代效应，但仅在 thinking effort 较低时显著；在 max effort 下，模型自身的推理能力弥补了 prompt 信息的缺失，导致 prompt 对成本的影响缩小。在 96.3% 的 cache hit rate 下，output tokens 仅占处理总 token 的 2.7%，却占总成本的 51.1%，因此减少 agent turns 比压缩 input prompt 更能有效降低成本。通过在未见任务上运行一次成本仅 $0.11 的 probe（full spec + low effort），结合从其他任务学到的 cost shape，可以将该任务所有配置下的成本预测误差从无 probe 时的 161% 降至 36%。\n\n### § 9 最脆弱的假设\n该论文的核心贡献之一是“通过单次 probe 运行结合从其他任务学到的 cost shape，可以预测未见任务的成本分布”。这个预测模型建立在一个关键假设上：不同任务之间共享相同的 cost shape（即不同 specification 和 thinking effort 配置之间的相对成本比例是跨任务不变的）。如果这个假设不成立，即不同任务的 prompt 敏感性差异极大且无规律，那么从四个任务学到的 cost shape 将无法准确泛化到第五个未见任务，导致预测器失效。在实际中，这个假设很容易不成立，因为任务的复杂度、代码库的熟悉度、bug 的定位难度等都会导致 agent 对 prompt 信息的依赖程度截然不同。例如，有些任务可能只要给出 raw test output 就能快速定位，而有些任务则需要详细的 functional requirements 才能理解上下文。论文提供的证据仅仅是基于 5 个 SWE-bench Verified 任务的留一法交叉验证，样本量极小。论文在 Discussion 中也承认，当前方法忽略了任务特定的 prompt 敏感性，这是未来工作。如果任务数量增加，或者任务类型更加多样化，这种共享 cost shape 的假设很可能会崩溃，导致预测误差远超 36%。\n\n### § 10 最小复现实验\n在1周时间内，可以复现“任务规范缩减对 token 消耗的影响”这一核心发现，而不需要复现完整的预测模型。从 SWE-bench Verified 中选取 2-3 个任务。为每个任务构建 3 种规范变体：full spec（包含所有 8 个部分）、minimal（仅 header 和 user story）、raw（原始失败测试输出）。使用 mini-swe-agent 框架和任意一个支持 reasoning effort 设置的 LLM（如 Kimi K3 或 OpenAI o1），在 low thinking effort 下运行每个配置，每个配置重复 5-10 次。记录每次运行的 token 消耗（特别是 output tokens）和 agent turns。如果 minimal 变体的平均 token 消耗和 turns 显著高于 full spec（例如增加 20% 以上），且 raw 变体的成本与 full spec 相当或更低，则支持论文的 claim；如果不同变体之间的成本没有显著差异，或者差异方向不一致，则反驳了该 claim。这个实验不需要构建完整的 10 种变体和 3 种 thinking effort，也不需要训练预测模型，只需验证最核心的 prompt 影响趋势。", "research_value": "### § 11 最强反例设计\n\n要对该论文的核心贡献构成最有力的攻击，我会针对其“不同任务之间共享相同的 cost shape”这一最脆弱的假设设计反例，核心逻辑是引入具有极端异质性的 information bottleneck（信息瓶颈）任务。论文的预测模型基于 5 个 SWE-bench Verified 任务，这些任务可能恰好属于相似的复杂度分布，从而掩盖了任务结构性差异对 prompt 敏感性的决定性作用。我会设计一个对照实验，从 SWE-bench 中选取两类截然不同的任务：一类是“Needle-in-a-haystack”型（bug 隐藏在极少触发的边缘代码路径中，需要大量 repo exploration 才能定位），另一类是“Algorithmic complexity”型（bug 位置显而易见，但修复逻辑极度复杂，需要深度推理）。对于这两类任务，我分别应用论文的 spec 变体（如 `minimal` 和 `raw`）。在“Needle-in-a-haystack”任务中，`minimal` spec 会剥夺关键线索，导致 agent 陷入盲目搜索，exploration cost 呈指数级爆炸；而在“Algorithmic complexity”任务中，由于 bug 位置明确，`minimal` spec 对 exploration cost 的影响微乎其微，反而可能因为缺乏边界条件而增加 reasoning cost。这种异质性意味着，这两类任务的 cost shape（即配置间的相对成本比例）不仅不会“共享”，反而会呈现完全相反的斜率。如果我用“Algorithmic complexity”任务集拟合 shared shape，并尝试通过单次 probe 预测“Needle-in-a-haysta
