产生负迁移。论文在 HotpotQA 全维基百科检索压力测试中的表现揭示了这一风险：在检索空间极大、噪声更高的环境下，ExRole 并未表现出优势，甚至略逊于部分基线。这表明，当检索系统的特性（如从受限的支持文档集合变为全量维基百科）发生根本性变化时，基于前一个分布诱导出的角色行为统计特征（如 Search rate, Evidence hit rate）可能不再与最终效用强相关。论文虽然提供了 Split Isolation 审计以证明训练集和验证集在任务标识符上的隔离，但缺乏对“角色泛化性”在异构检索环境下的鲁棒性分析，也未提供动态更新角色库的机制来应对分布漂移，这使得该方法在开放域复杂任务中的长期有效性存疑。\n\n### § 10 最小复现实验\n\n在 1 周时间内，可以复现 **Role-Agent-Turn Disentanglement** 实验的核心部分，以验证“诱导角色是否捕捉到了超越固定智能体身份的可转移行为倾向”这一关键 Claim，而无需复现完整的 LoRA Routing 和强化学习训练流程。\n\n**具体方案：**\n1.  **数据与模型**：使用 MuSiQue 数据集的一个小样本子集（如 50-100 个验证集问题），加载一个预训练的 LLM（如 Qwen2.5-7B）作为基座。\n2.  **实现**：\n    *   首先，手动定义或从少量轨迹中简单聚类出 3 个典型角色指令（如 Researcher, Analyst, Verifier），对应不同的 Prompt 模板。\n    *   设计一个固定的 Round-Robin 调度器，让 3 个智能体轮流发言。\n    *   进行正交实验：保持角色指令不变，但随机打乱角色与智能体 ID 的绑定关系（例如，让 Agent 1 执行 Verifier 指令，Agent 2 执行 Researcher 指令等），并记录每个智能体在不同角色下的行为分布（如搜索次数、答案生成时机）。\n3.  **测量**：计算每个智能体在不同角色下的行为特征向量（如 Action Log Loss 或 Jensen-Shannon Distance），并比较“同一角色不同智能体”之间的行为相似度与“不同角色同一智能体”之间的行为差异。\n4.  **结果判定**：如果“同一角色不同智能体”的行为分布高度相似（低 JS Distance），而“不同角色”之间的行为分布显著不同（高 JS Distance），则支持 ExRole 的核心 Claim，即角色确实编码了可转移的行为倾向，而非仅仅依赖于智能体 ID 或轮次位置。反之，如果行为主要随智能体 ID 或轮次变化，则反驳了该 Claim。此实验仅需推理阶段代码，无需训练，可在短时间内完成。", "research_value": "### § 11 最强反例设计\n\n要彻底挑战 ExRole 的有效性，最有力的攻击并非质疑其性能提升，而是证明其核心机制——**Role-Conditioned Sparse LoRA Routing** 和 **Turn-Aligned Credit**——是“伪因果”的，即性能提升完全归因于 **Prompt Engineering** 的显式指令引导，而非参数层面的动态路由或细粒度信用分配。\n\n**具体反例设计：The \"Frozen-Router\" Ablation (冻结路由器消融实验)**\n\n1.  **实验设置**：\n    *   保留 ExRole 完整的 **Offline Induction** 流程，生成相同的角色原型（Prototypes）、可读指令（Instructions）和 Token 标记（Markers）。\n    *   保留 **Turn-Aligned GRPO** 优化目标。\n    *   **关键修改**：在 **Online Execution** 阶段，完全移除 **Sparse LoRA Router** 的动态选择机制。取而代之的是，将所有 Agent 共享同一组固定的、未经路由选择的 LoRA 参数（即退化为标准的 **Shared LoRA** 或甚至直接使用 Base Model 加上统一的 Prompt 前缀）。\n    *   或者更激进地，使用一个 **Random Router**，即 Router 随机选择 LoRA Rank Slots，完全切断角色特征 $\\mathbf{v}_{z_q}$ 与参数激活之间的相关性。\n\n2.  **预期结果与攻击逻辑**：\n    *   如果 ExRole 声称的“参数层面的角色专业化”是有效的，那么移除动态路由或引入随机路由应导致性能显著下降，因为模型失去了根据角色激活特定参数子集的能力。\n    *   **攻击点**：如果 **Frozen-Router** 或 **Random-Router** 变体在 MuSiQue 和 2WikiMultiHopQA 上的性能与完整的 ExRole-Routed 几乎无差异（例如差异 \u003C 1%），则证明：\n        *   **LoRA Routing 是冗余的**：模型并不需要动态激活不同的参数路径来执行不同角色；共享参数足以处理所有角色行为。\n        *   **性能提升源于 Prompt**：真正的增益来自于将历史轨迹归纳出的“行为统计特征”转化为显式的自然语言指令（如 \"Researcher\"）注入 Prompt。这本质上是一种高级的 **In-Context Learning** 或 **Prompt Optimization**，而非论文声称的“可执行角色（Executable Roles）”或“参数绑定”。\n        *   **Credit Assignment 的误导性**：如果路由是随机的，那么 **Turn-Aligned Credit** 分配给特定 LoRA Slots 的信号就是噪声。如果性能依然好，说明 **GRPO** 的全局优势（Group Advantage）足以驱动策略优化，细粒度的局部信用分配并未提供额外的梯度信号价值。\n\n3.  **理论论证**：\n    *   从 **Information Bottleneck** 理论来看，如果角色信息 $\\xi_t$ 已经通过 Prompt 中的 Token $\\chi_k$ 充分传递给了 LLM 的注意力机制，那么 LLM 内部的自注意力层（Self-Attention）已经能够根据上下文动态调整激活模式。额外的、外部的 **LoRA Router** 可能引入了不必要的归纳偏置（Inductive Bias），限制了模型的表达能力，或者仅仅是重复了注意力机制已经完成的工作。如果实验显示 **Shared LoRA + Role Prompt** 优于 **Routed LoRA + Role Prompt**，则直接证伪了“路由必要性”这一核心贡献。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：Dynamic Role Emergence via Meta-Learning of Interaction Protocols (基于交互协议元学习的动态角色涌现)**\n\n**(a) 驱动局限与未满足需求**\nExRole 的核心局限在于其 **Offline Induction** 阶段的静态性。角色原型（Prototypes）是从历史轨迹中一次性聚类生成的，假设协作模式是固定的（如 Researcher-Analyst-Verifier）。然而，在真实世界的复杂任务中，协作结构是高度动态且任务依赖的。例如，在某些多跳问答中，可能需要两个 \"Researcher\" 并行搜索不同方面，而在其他任务中，可能需要一个 \"Debater\" 角色来挑战初步结论。ExRole 的静态角色库无法适应这种 **Structural Plasticity**，且在分布外（OOD）任务中表现不佳（如 HotpotQA 压力测试所示）。此外，ExRole 将角色视为预定义的离散类别，忽略了角色之间可能存在的连续谱系和动态转换。\n\n**(b) 借鉴相邻领域的方法**\n借鉴 **Meta-Learning**（特别是 **MAML** 或 **Reptile**）和 **Graph Neural Networks (GNNs)** 在动态图结构学习中的应用。\n*   **Meta-Learning**：允许模型在少量样本（Few-Shot）上快速适应新的协作结构，而不是依赖固定的离线聚类。\n*   **GNNs**：将多智能体交互建模为动态图，其中节点是 Agent，边是信息流。GNN 可以学习节点嵌入（即角色），这些嵌入是上下文相关的，而非固定的。\n\n**(c) 第一个实验设计**\n1.  **新框架：Meta-Role**\n    *   不再离线聚类角色，而是训练一个 **Meta-Role Encoder**，它接收当前任务 $x$ 和初始交互片段 $H_{1:k}$，输出一个 **Continuous Role Embedding** $\\mathbf{r}_t$。\n    *   这个嵌入不是离散的 ID，而是一个向量，用于条件化 **LoRA Adapter** 的权重（通过 **Hypernetwork** 生成 LoRA 参数，而非路由选择）。\n    *   引入 **Dynamic Role Switching**：Agent 可以在交互过程中根据当前状态和团队反馈，动态更新其角色嵌入，实现从 \"Searcher\" 到 \"Synthesizer\" 的平滑过渡，而非硬切换。\n\n2.  **实验设置**：\n    *   **数据集**：使用 **MuSiQue** 和 **2WikiMultiHopQA**，但引入 **Task-Shift** 设置：训练集和测试集来自不同的子领域（如训练集为历史类问题，测试集为科学类问题），以测试角色泛化能力。\n    *   **基线**：ExRole（静态角色）、Manual Roles、以及一个 **Dynamic Prompting** 基线（使用 LLM 自我反思生成角色描述）。\n    *   **评估指标**：除了 EM/F1，还引入 **Role Adaptation Speed**（达到稳定性能所需的交互轮次）和 **Cross-Domain Generalization Gap**（训练域与测试域的性能差异）。\n\n3.  **预期结果与创新点**：\n    *   如果 **Meta-Role** 能在未见过的任务类型上快速收敛到有效的协作模式，且性能优于静态 ExRole，则证明 **Dynamic Role Emergence** 是比 **Static Role Induction** 更鲁棒的范式。\n    *   创新点在于将角色从“预定义的离散标签”转变为“上下文感知的连续控制变量”，并通过 **Hypernetwork** 实现参数级的动态生成，而非稀疏路由。这解决了 ExRole 在 OOD 场景下的失效问题，并为多智能体系统提供了真正的 **Structural Adaptability**。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Zhou Liu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"**\"\n      ]\n    },\n    {\n      \"name\": \"Chaoyang Han\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"**\"\n      ]\n    },\n    {\n      \"name\": \"Zewei Pan\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"**\"\n      ]\n    },\n    {\n      \"name\": \"Zeli Su\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"**\"\n      ]\n    },\n    {\n      \"name\": \"Wentao Zhang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"[∗]\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Peking University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Shanghai Jiao Tong University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"**\",\n      \"text\": \"Equal contribution\"\n    },\n    {\n      \"marker\": \"[∗]\",\n      \"text\": \"Corresponding author\"\n    }\n  ]\n}\n```", "summary_translation": "角色为组织语言模型智能体提供了可解释的接口，然而大多数多智能体系统将它们视为与学习行为和参数更新脱节的手写提示标签。我们认为，一个有用的角色应当是一个可执行的控制变量：它应总结能够预测未来效用的行为，指导后续交互，并识别负责该行为的可训练容量。我们引入了 ExRole，这是一个轨迹到角色的框架，它从前缀局部团队轨迹中学习具有未来感知能力的角色原型，将其解析为可读指令和与 token 对齐的角色标记，并可选择性地路由共享 LoRA 秩槽位，同时分配与轮次对齐的信用。在 MuSiQue 和 2WikiMultiHopQA 数据集上，ExRole 分别比单智能体搜索提高了 15.0/14.4 和 13.5/16.1 个 EM/F1 点。与最强的非 ExRole 对照组相比，相应的增益仍保持在 11.5/11.6 和 7.7/9.7 个点。在这两个基准测试中，受控结果一致表明，轨迹诱导的角色条件优于无角色、手动、随机和打乱的替代方案。Role-Agent-Turn 干预进一步表明，诱导出的角色捕捉到了超越固定智能体身份或轮次位置的可迁移行为专业化。"}]}], "2026-08-12": [{"name": "Self-Evolving Agents \u0026 Skill Management", "count": 6, "papers": [{"title": "Dual-Loop Self-Evolution via Verifiable Emotion Feedback for Multi-Turn Empathetic Dialogue", "arxiv_id": "2608.10626", "authors": "Yi Wei, Shuo Jiang, Huaixia Dou, Jie Zhu, Junhui Li, Lifan Guo, Feng Chen, Chi Zhang", "summary": "Large language models have demonstrated conversational capabilities, yet empathetic competence remains challenging. Empathetic support is inherently multi-turn and path-dependent: users disclose concerns gradually, emotions evolve over time, and early responses shape trust and receptivity. Reinforcement learning with verifiable emotion rewards provides scalable supervision for long-horizon interactions. However, existing methods evolve the dialogue policy while keeping its training interaction distribution fixed, creating a mismatch between policy competence and training experience. We introduce a dual-loop self-evolution framework driven by verifiable emotion feedback. With the user simulator and verifier frozen, the inner loop optimizes the multi-turn policy using continuous emotion rewards, while the outer loop uses the same outcomes to estimate policy-relative interaction utility and adapt experience. To obtain estimates from sparse, stochastic rollouts, the framework holds the scenario and interaction state constant within each group and prioritizes conditions whose group pass rates lie near the policy's competence boundary. A hierarchical controller shares evidence across support intents, while uncertainty-guided exploration and uniform rehearsal prevent premature exclusion. The resulting distribution generates trajectories, closing both loops without increasing the rollout budget. On SAGE, our framework raises Qwen3-8B Overall from 53.87 to 79.24 and outperforms protocol-matched uniform emotion-reward reinforcement learning by 7.23 points.", "category": "cs.CL", "cluster": "Self-Evolving Agents \u0026 Skill Management", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=23 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文完全符合“自我演化 (Self-Evolving)”和“单智能体/多智能体交互中的长期决策”的研究方向。\n\n1. 核心机制匹配：论文标题和摘要明确提出了“Dual-Loop Self-Evolution”（双环自我演化）框架。这直接对应筛选标准中关于“自我演化”的定义，即智能体通过经验、反馈（此处为可验证的情感反馈）进行自我完善和迭代。\n2. 智能体能力与长期决策：论文关注的是“Multi-Turn Empathetic Dialogue”（多轮共情对话），这属于典型的 Long-Horizon Decision-Making（长期决策）场景。摘要中提到“emotions evolve over time”（情感随时间演化）和“path-dependent”（路径依赖），表明研究重点在于智能体在复杂交互环境中的策略优化，而非简单的单次问答。\n3. 方法论创新：论文不仅使用了强化学习（RL），还设计了内外双环机制：内环优化策略，外环根据策略能力边界自适应调整训练经验分布（adapt experience）。这种“LLMs improving LLMs”或“Agent improving its own training distribution”的机制，正是“自我演化”方向的前沿内容。\n4. 排除项检查：\n   - 虽然涉及“Dialogue”（对话），但其核心贡献是演化机制（Self-Evolution Framework），而非仅仅将LLM应用于对话领域（非单纯的应用型论文）。\n   - 不涉及被排除的“安全/对齐”（虽然情感反馈可能涉及用户体验，但核心是能力演化而非安全防御）、“图技术”或“纯基础设施”。\n   - 虽然涉及用户模拟器（User Simulator），但这通常被视为智能体训练环境的一部分，且论文重点在于智能体策略的演化，而非多智能体拓扑或通信协议。\n\n综上，该论文在方法论上提出了新的自我演化框架，用于提升LLM智能体在长期交互中的能力，高度契合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n本文针对多轮共情对话（Multi-Turn Empathetic Dialogue）中**课程-策略错位（Curriculum–Policy Misalignment）**这一核心挑战，提出并解决了一个关键问题：在基于可验证情感奖励（Verifiable Emotion Rewards）的强化学习（RL）训练中，如何动态调整交互分布以匹配策略能力的演化。现有的方法通常将训练交互分布视为固定不变的外部条件，导致随着对话策略（Dialogue Policy）能力的提升，其训练经验分配未能同步适应，从而造成策略当前能力与训练实践内容之间的不匹配。\n\n这一问题的重要性在于，共情支持本质上是一个长视界（Long-Horizon）且路径依赖（Path-Dependent）的过程。用户的情感状态和信息披露是随时间演化的，早期的回复会深刻影响后续的信任建立和信息接收度。如果训练分布固定，策略可能在已掌握的场景上浪费昂贵的多轮交互预算（Rollout Budget），或在当前无法处理的困难场景上反复失败，导致学习效率低下。解决这一问题能够显著提升模型在复杂多轮交互中的情感恢复能力，使模型从单纯模仿局部合理的回复，进化为能够理解并引导用户情感轨迹的长期支持者。通过引入双环自演化框架，该方法在不增加额外 rollout 预算的前提下，实现了训练经验的高效利用，大幅提升了模型在 SAGE 等基准测试中的整体表现，证明了动态课程对齐对于提升 LLM 共情能力的巨大价值。\n\n### § 2 前人工作与不足\n\n尽管已有研究在共情对话和自适应课程学习方面取得了进展，但现有方法仍存在显著不足。\n\n首先，传统的**离线增强（Offline Augmentation）**方法（如 Zheng et al. 2023; Ye et al. 2025）虽然能增加数据覆盖范围，但一旦生成，数据分布即固定不变，无法反映策略能力的实时变化，导致训练后期数据利用率低。\n\n其次，基于**用户模拟（User Simulation）**的交互式方法（如 Yoon et al. 2024; Dou et al. 2025）提供了可扩展的交互环境，但现有工作（如 Wang et al. 2026b 提出的 RLVER）通常保持交互分布固定。这意味着无论策略是否已掌握某个场景，该场景获得的 rollout 预算是相同的。这种静态分配忽略了交互难度是相对于策略能力而言的动态属性，导致“课程-策略错位”。\n\n再者，**自适应课程学习（Adaptive Curriculum Learning）**和**重放方法（Replay Methods）**（如 Graves et al. 2017; Schaul et al. 2016; Jiang et al. 2021）虽然认识到训练效用依赖于学习者，但现有公式主要针对稀疏、随机结果的多轮角色扮演交互设计不足。它们往往难以直接从长视界、高方差的交互结果中稳健地估计策略相对效用。\n\n最后，**自博弈（Self-Play）**方法（如 Chen et al. 2024; Dai et al. 2026）通过同时演化助手和模拟用户来适应难度，但在共情对话中存在致命缺陷：模拟器既参与轨迹生成又参与结果形成。无约束的适配器演化可能导致用户模拟器变得任意抗拒、过度接受或与原始人设不一致（Simulator Drift）。这使得奖励变化混淆了助手改进和模拟器漂移，导致信用分配（Credit Assignment）模糊，评估目标成为移动靶标。因此，现有方法要么因分布固定而效率低下，要么因模拟器漂移而失去评估的可靠性，未能有效解决在保持角色扮演的忠实性前提下，动态对齐训练分布与策略能力的问题。", "core_insight": "### § 3 重建作者的思考路径\n\n在深入多轮共情对话（Multi-Turn Empathetic Dialogue）的研究时，研究者首先观察到大型语言模型（LLMs）虽然具备基础对话能力，但在提供长期情感支持时表现不佳。共情支持具有内在的**路径依赖性（Path-dependent）**：用户的情绪和信息披露是随时间演化的，早期的回复会直接影响用户的信任度和后续互动的走向。因此，仅仅模仿局部合理的回复是不够的，模型需要学习如何在完整的轨迹（Trajectory）中影响用户的情绪演变。\n\n为了解决长视界（Long-horizon）优化问题，现有的工作引入了基于可验证情绪奖励（Verifiable Emotion Rewards）的强化学习（RL）。这种方法通过用户模拟器（User Simulator）生成交互，并利用情绪验证器（Emotion Verifier）提供轨迹级别的监督信号。然而，研究者发现现有的RL方法存在一个根本性的缺陷：**课程-策略错位（Curriculum–Policy Misalignment）**。具体来说，现有的方法通常将训练交互分布（Interaction Distribution）视为固定不变的外部条件。随着策略（Policy）能力的提升，某些交互场景可能变得过于简单（冗余）或过于困难（无效），但训练预算（Rollout Budget）仍然均匀分配给所有场景。这种静态的课程设置无法适应策略能力的动态变化，导致训练效率低下。\n\n研究者进一步思考了可能的解决方案。简单的“由易到难”预设课程（Static Curriculum）无法应对策略能力的动态边界；而完全自由的自我对弈（Self-play）虽然能同时进化策略和模拟器，但在共情对话中会导致模拟器角色漂移（Simulator Drift），使得奖励信号不再反映真实的共情能力，而是反映了模拟器的不一致性，从而破坏了信用分配（Credit Assignment）。\n\n因此，研究者需要一个既能动态调整训练分布，又能保持评估标准稳定的框架。他们意识到，交互的难度并非场景的固有属性，而是相对于当前策略能力而言的。如果能在保持用户模拟器角色（Persona）和隐藏需求（Hidden Need）冻结的前提下，动态调整交互状态（Interaction State，如披露意愿、情绪激活度、信任度），就可以构建一个可控的交互空间。通过监测策略在不同交互状态下的表现（如通过率），可以估计出哪些状态处于策略能力的“边界”附近，从而优先分配训练资源。这就引出了**双环自进化（Dual-Loop Self-Evolution）**的核心思想：内环利用连续的情绪奖励优化策略，外环利用分组结果（Group Outcomes）估计策略相对效用（Policy-Relative Utility），并据此自适应地调整交互分布，实现策略与训练经验的协同进化。\n\n### § 4 核心 Intuition\n\n现有强化学习方法在共情对话中效率低下的核心原因在于**训练分布的静态性与策略能力的动态性之间的错位**：随着模型变强，原本具有学习价值的交互场景变得冗余或无效，但训练资源仍被均匀浪费在这些场景上。\n\n本文提出的双环自进化框架通过**冻结用户模拟器的核心角色**，仅动态调整可控的**交互状态（Interaction States）**，构建了一个稳定的评估基准。\n\n其核心直觉是**“在能力边界处学习”**：外环通过监测策略在不同交互状态下的通过率，识别出那些策略既未完全掌握也未完全失败的“边界条件”，并将训练资源优先分配给这些最具信息量的场景，从而在不增加 rollout 预算的情况下，实现策略与训练经验的高效协同进化。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出了一种**Dual-Loop Self-Evolution**（双循环自进化）框架，旨在解决多轮共情对话中策略能力（Policy Competence）与训练经验分布（Training Interaction Distribution）不匹配的问题。其核心思想是：在保持用户模拟器（User Simulator）和验证器（Verifier）冻结的前提下，通过内循环优化对话策略，通过外循环动态调整训练数据的采样分布，使训练经验始终聚焦于策略当前能力的“边界”区域。\n\n以下是结合一个真实场景的完整 Pipeline 说明：\n\n**场景设定**：\n假设有一个情感支持场景 $x$：用户因工作被否定而感到沮丧（Support Intent: Support）。我们需要决定用户以何种状态 $z$ 参与对话。\n\n**Step 1: 构建可控交互空间 (Controllable Interaction Space)**\n系统首先定义交互状态 $z$，由三个维度组成：\n1.  **Disclosure Readiness**（披露意愿）：例如 \"Delayed\"（延迟披露，用户起初不愿多说）。\n2.  **Emotional Activation**（情绪激活度）：例如 \"High\"（高激活，用户表现出强烈的负面情绪）。\n3.  **Relational Trust**（关系信任度）：例如 \"Skepticism\"（怀疑，用户不轻易接受建议）。\n组合后得到一个具体的交互状态 $z = (\\text{Delayed}, \\text{High}, \\text{Skepticism})$。这个状态被转化为自然语言指令注入到 User Simulator 中，但不对 Assistant 可见。\n\n**Step 2: 内循环 - 策略优化 (Inner Loop: Policy Optimization)**\n1.  **采样与环境构建**：控制器根据当前的分布 $p_t(z|c)$ 采样一个状态 $z$。在本例中，假设采样到了上述的 $z$。\n2.  **轨迹生成 (Rollout)**：Assistant Policy $\\pi_\\theta$ 与 User Simulator $U$ 进行多轮对话。由于环境 $(x, z)$ 固定，一组 $K$ 条轨迹（Group）共享相同的用户行为模式。\n3.  **连续奖励计算**：对话结束后，Emotion Verifier 评估整个轨迹，给出一个连续的情绪得分 $R(\\tau)$（例如 0-100 分）。\n4.  **策略更新**：使用 GRPO (Group Relative Policy Optimization) 算法，基于组内相对优势（Group-relative advantages）更新 Policy $\\pi_\\theta$。这一步只关心“如何更好地回应”，不改变数据分布。\n\n**Step 3: 外循环 - 经验分布自适应 (Outer Loop: Distribution Adaptation)**\n1.  **阈值化反馈 (Thresholded Feedback)**：控制器不直接使用连续分数，而是设定一个阈值 $\\eta$（例如 60 分）。计算该组轨迹的通过率 $p_m$（即得分 $\\ge \\eta$ 的比例）。\n    *   *Intuition*：如果通过率接近 0.5，说明该条件对当前策略既不太简单也不太难，处于“能力边界”，最具学习价值。\n2.  **稳健效用估计 (Robust Utility Estimation)**：\n    *   由于某些状态 $(c, z)$ 采样次数少，直接统计不可靠。系统使用**分层共享先验 (Hierarchical Sharing)**：利用其他 Support Intent 下相同状态 $z$ 的历史数据作为先验，平滑当前单元的估计值 $\\hat{p}_{c,z}$。\n    *   计算分配分数 $A_{c,z}$：结合“边界接近度” $B_{c,z}$（衡量是否接近 0.5 通过率）和“不确定性奖励” $U_{c,z}$（鼓励探索采样少的状态）。\n3.  **分布更新**：根据 $A_{c,z}$ 更新下一阶段的采样分布 $p_{t+1}(z|c)$。\n    *   *结果*：如果状态 $z=(\\text{Delayed}, \\text{High}, \\text{Skepticism})$ 的通过率接近 0.5，它在下一轮被采样的概率会增加；如果策略已经完全掌握（通过率 $\\approx 1$）或完全无法应对（通过率 $\\approx 0$），其采样概率会降低，从而将有限的 Rollout 预算集中在最有价值的交互模式上。\n\n**Step 4: 闭环迭代**\n更新后的分布 $p_{t+1}$ 用于生成下一批训练数据，再次进入内循环优化策略。如此循环，直到训练结束。\n\n---\n\n### § 6 核心数学推导\n\n本文的核心数学贡献在于如何将稀疏、随机的多轮对话结果转化为稳健的、策略相关的交互效用估计，并据此调整采样分布。以下是关键公式的直觉解释：\n\n**1. 策略优化目标 (Inner Loop Objective)**\n虽然文中未展开详细推导，但基于 GRPO，其核心是利用组内相对优势：\n$$ A_k = R(\\tau_k) - \\frac{1}{K}\\sum_{j=1}^K R(\\tau_j) $$\n*   **Intuition**：不依赖绝对分数，而是看当前轨迹在相同环境下的相对表现。这消除了环境难度带来的偏差，专注于策略本身的改进。\n\n**2. 稳健通过率估计 (Stabilized Pass Rate Estimation)**\n为了估计单元 $m=(c, z)$ 的通过率 $\\hat{p}_{c,z}$，公式如下：\n$$ \\hat{p}_{c,z} = \\frac{S_{c,z} + \\alpha \\cdot \\hat{p}_{[-c],z}}{N_{c,z} + \\alpha} $$\n其中：\n*   $S_{c,z}$：当前单元 $(c, z)$ 的累计通过次数。\n*   $N_{c,z}$：当前单元的总采样组数。\n*   $\\hat{p}_{[-c],z}$：**Leave-one-intent prior**，即排除当前 Intent $c$ 后，其他所有 Intent 在相同状态 $z$ 下的平均通过率。\n*   $\\alpha$：先验强度系数。\n\n*   **Intuition**：\n    *   当 $N_{c,z}$ 很大时，$\\hat{p}_{c,z}$ 主要由自身历史数据决定。\n    *   当 $N_{c,z}$ 很小时（数据稀疏），$\\hat{p}_{c,z}$ 会向 $\\hat{p}_{[-c],z}$ 靠拢。\n    *   **为什么有效？** 不同的 Support Intent（如 Support vs. Repair）可能在相同的交互状态（如 High Activation）下表现出相似的用户行为模式。通过共享状态 $z$ 的信息，解决了长尾分布下某些单元数据不足导致的估计偏差问题。\n\n**3. 分配分数计算 (Allocation Score)**\n$$ A_{c,z} = B_{c,z} + \\beta \\cdot U_{c,z} + A_{min} $$\n其中：\n*   $B_{c,z} = 1 - 2|\\hat{p}_{c,z} - 0.5|$：**边界接近度**。当 $\\hat{p}_{c,z} = 0.5$ 时，$B_{c,z}=1$（最大价值）；当 $\\hat{p}_{c,z}=0$ 或 $1$ 时，$B_{c,z}=-1$（最小价值）。\n*   $U_{c,z} = \\sqrt{\\frac{\\ln N}{N_{c,z}}}$：**不确定性奖励**（源自 UCB1 算法思想）。$N$ 是总采样数，$N_{c,z}$ 是当前单元采样数。采样越少，$U_{c,z}$ 越大。\n\n*   **Intuition**：\n    *   **Exploitation (利用)**：$B_{c,z}$ 确保系统优先选择那些策略“半懂不懂”的条件，因为这里的学习梯度最丰富。\n    *   **Exploration (探索)**：$U_{c,z}$ 确保那些还没被充分采样的条件有机会被尝试，防止过早排除潜在的高价值区域。\n    *   **Uniform Rehearsal (均匀复习)**：$A_{min}$ 保证没有任何状态被永久移除，防止策略遗忘。\n\n**4. 分布采样 (Sampling Distribution)**\n$$ p_{t+1}(z|c) \\propto \\exp(A_{c,z} / \\gamma) $$\n*   **Intuition**：使用 Softmax 将分配分数转化为概率分布。温度参数 $\\gamma$ 控制探索与利用的平衡。\n\n---\n\n### § 7 实验设计与结论\n\n**提出了什么问题？**\n现有的多轮共情对话强化学习方法（如 RLVER）通常使用固定的交互分布或简单的难度排序。这导致**Curriculum-Policy Misalignment**（课程-策略错位）：随着策略能力的提升，原本具有挑战性的交互变得过于简单，而原本简单的交互变得冗余，导致昂贵的 Rollout 预算被浪费在低信息量的样本上。\n\n**设计了什么实验验证这个问题？**\n1.  **基线对比 (Main Results)**：\n    *   对比 **RLVER**（均匀采样情绪奖励 RL）、**Interaction State Only**（仅增加状态空间但不自适应分配）、**VCRL**（基于方差优先）与 **Ours**（双循环自进化）。\n    *   所有方法在相同的 Qwen3-8B 初始化、相同的 Rollout 预算、相同的模拟器/验证器下进行公平比较。\n    *   评估指标包括 SAGE（多轮情绪恢复）、ESConv（策略准确性、多样性）、ESC-Eval（多维度质量）、EIBench（泛化能力）以及人工评估。\n\n2.  **消融实验 (Ablations)**：\n    *   **Scenario-only allocation**：验证“分层共享”（Intent-State Factorization）的必要性，证明仅基于场景 ID 统计会导致证据碎片化。\n    *   **No hierarchical sharing**：验证跨 Intent 共享状态先验的重要性。\n    *   **No uncertainty bonus / No uniform rehearsal**：验证探索机制和防止遗忘机制的作用。\n    *   **Variance-gated pass-rate controller**：对比基于原始奖励方差与基于阈值通过率的区别，证明后者更稳定。\n\n3.  **交互空间验证 (Validating Interaction-State Space)**：\n    *   通过人工和自动 Judge 验证，确保不同的交互状态 $z$ 确实导致了可观察的用户行为差异，且未改变原始场景的核心语义（Persona/Event/Need）。\n\n**问题的答案是什么？**\n1.  **性能显著提升**：在 SAGE 基准上，Ours 将 Qwen3-8B 的 Overall 分数从 53.87（基线）提升至 79.24，比均匀采样的 RLVER 高出 7.23 分（相对提升 10%）。\n2.  **效率与鲁棒性**：在相同的 Rollout 预算下，Ours 的最弱单次运行（78.11）仍优于 RLVER 的最强单次运行（73.76），证明了方法的鲁棒性。\n3.  **泛化能力增强**：在 ESConv、ESC-Eval 和 EIBench 上均取得最佳或接近最佳结果，表明自适应分配不仅提高了情绪恢复能力，还改善了策略的多样性、流畅度和泛化性。\n4.  **核心机制有效**：消融实验证实，**分层证据共享**和**基于边界优先级的分配**是性能增益的关键来源。单纯增加状态空间而不进行自适应分配（Interaction State Only）反而会导致性能下降，证明了“能力对齐”的重要性。", "additional_insights": "### § 8 Take-aways\n\n1. 现有的基于可验证情感奖励（Verifiable Emotion Rewards）的强化学习方法存在“课程-策略错位”（Curriculum-Policy Misalignment）问题，即策略能力随训练动态演进，但训练交互分布保持静态，导致计算资源浪费在已掌握或当前无法学习的样本上。\n2. 本文提出了一种双环自演化框架（Dual-Loop Self-Evolution），在保持用户模拟器（User Simulator）和验证器（Verifier）冻结的前提下，通过内环优化对话策略，外环根据策略相对交互效用（Policy-Relative Interaction Utility）动态调整交互状态分布。\n3. 外环通过构建一个由披露准备度（Disclosure Readiness）、情感激活度（Emotional Activation）和关系信任度（Relational Trust）组成的可控交互空间（Interaction Space），将稀疏的随机 rollout 结果转化为稳定的组通过率（Group Pass Rate），并据此重新分配后续的训练经验。\n4. 实验表明，该方法在 SAGE 基准上将 Qwen3-8B 的整体得分从 53.87 提升至 79.24，相比均匀情感奖励 RL 提升了 7.23 分，且无需增加 rollout 预算，证明了自适应经验分配在长程多轮共情对话中的有效性。\n\n### § 9 最脆弱的假设\n\n该方法最核心的假设是：**离散化的交互状态（Interaction States）能够准确且独立地控制用户模拟器的行为表现，同时不破坏原始场景的语义完整性（Persona/Event/Need Preservation）。**\n\n如果这一假设不成立，即交互状态标签无法在对话中产生可区分的行为差异，或者强行注入这些状态导致用户角色崩坏（例如为了体现“高信任度”而违背用户原本“多疑”的人设），那么外环基于这些状态计算的“策略相对效用”将失去意义，导致错误的课程分配。\n\n论文在 Section 4.5 提供了部分证据：通过人工和自动评估，发现 92.5% 的轨迹保留了原始人设，且行为可恢复性（Behavioral Separability）在三个维度上分别达到了 86.7%、92.5% 和 82.5%。然而，这一证据仅基于 120 条轨迹的小样本审计，且依赖于特定的 Prompt 工程（Behavioral Clauses）。在实际大规模训练中，LLM 模拟器对复杂组合状态（如“延迟披露+高激活+低信任”）的遵循能力可能存在长尾失效，且这种失效可能具有隐蔽性，难以被简单的通过率指标捕捉，从而污染外环的效用估计。\n\n### § 10 最小复现实验\n\n**目标：** 验证“交互状态空间”是否真的能产生可区分且稳定的用户行为差异，这是外环自适应分配的基础。\n\n**数据：** 使用论文提供的 SAGE 训练集中的 50 个典型场景（覆盖 8 种支持意图）。\n\n**实现：**\n1.  复现论文中定义的 24 种交互状态（3 披露 x 2 激活 x 4 信任），将其转化为具体的 Prompt 指令（Behavioral Clauses）。\n2.  使用一个固定的基座模型（如 Qwen3-8B 或 Llama-3-8B）作为用户模拟器（User Simulator），冻结其参数。\n3.  对于每个场景，分别使用 24 种不同的交互状态 Prompt 进行单次 rollout，记录生成的对话轨迹。\n\n**测量：**\n1.  **行为可区分性：** 使用另一个独立的 LLM Judge（如 GPT-4o 或 Qwen-Max），仅输入对话内容，盲测其能否正确识别出该对话对应的交互状态标签（特别是三个维度的具体级别）。计算准确率（Accuracy）和宏平均 F1 分数。\n2.  **语义一致性：** 人工或自动检查生成的对话是否偏离了原始场景的核心事件和人设（例如，是否出现了原场景未提及的危机，或人设性格突变）。\n\n**结果判定：**\n*   **支持 Claim：** 如果 Judge 识别准确率显著高于随机猜测（\u003E60%），且语义一致性保持较高水平（\u003E90%），则说明交互状态空间是有效的，外环的效用估计有可靠基础。\n*   **反驳 Claim：** 如果识别准确率接近随机水平，或者大量轨迹出现人设崩坏，则说明当前的离散化状态设计无法有效控制模拟器行为，外环的自适应分配将基于噪声，核心贡献失效。", "research_value": "### § 11 最强反例设计\n\n要挑战这篇论文的核心贡献，最有力的攻击并非质疑其性能提升，而是攻击其**因果归因的有效性**，即证明性能提升并非源于“动态课程对齐”，而是源于**交互状态注入带来的隐式提示增强（Implicit Prompting Enhancement）**或**模拟器行为的非自然平滑**。\n\n**反例实验设计：控制变量下的“静态高价值”对比**\n\n1.  **替代解释假设**：论文声称通过动态调整分布 $p_t(z|c)$ 聚焦于“能力边界”提升了效率。然而，一个更简单的解释是：引入离散化的交互状态 $z$（如 Disclosure Readiness, Emotional Activation）本身就在 Prompt 中为 User Simulator 提供了更丰富的上下文约束，使得生成的对话轨迹比原始无状态（Stateless）或均匀采样（Uniform）的轨迹更具结构性和可预测性。这种结构性的增强可能直接提高了 Verifier 的评分稳定性，从而让任何 RL 算法（包括静态的 RLVER）都能更容易地收敛，而无需复杂的动态分配。\n\n2.  **具体实验步骤**：\n    *   **构建基线 \"Static-TopK\"**：不使用论文中的动态外环控制器。首先，在训练初期使用均匀分布采样所有可能的交互状态 $z$，收集大量轨迹。\n    *   **离线筛选**：计算每个状态 $z$ 在初始策略下的平均通过率或方差，筛选出那些在初始阶段就表现出“高方差”或“中等难度”的 Top-K 个状态。\n    *   **静态训练**：在后续的所有 RL 训练步骤中，**固定**使用这 Top-K 个状态进行采样，不再进行任何分布更新。\n    *   **对比**：将 \"Static-TopK\" 与论文的 \"Dual-Loop Self-Evolution\" 在相同的 Rollout 预算下进行对比。\n\n3.  **预期结果与攻击逻辑**：\n    *   如果 \"Static-TopK\" 的性能与 \"Dual-Loop\" 相当，甚至略优（因为避免了动态分布更新带来的方差噪声），则证明**动态性（Dynamism）并非关键**，关键在于**选择了正确的状态子集**。这将削弱论文关于“自演化”和“实时对齐”的理论价值，将其降级为一个简单的“数据筛选”技巧。\n    *   进一步，如果 \"Static-TopK\" 的性能显著优于原始的 \"Uniform RLVER\"，但低于 \"Dual-Loop\"，则说明动态调整确实有增益，但增益可能很小，且主要来源于**探索新状态**而非**对齐能力边界**。此时，可以引入第二个反例：**\"Random-Walk Distribution\"**，即外环随机改变分布，但不基于效用估计。如果随机分布也能带来类似的性能提升，说明 RL 过程对分布的具体形状不敏感，只要分布不是完全均匀的，就能通过增加多样性来提升性能，从而彻底否定“基于效用的自适应分配”的必要性。\n\n4.  **理论论证：模拟器漂移的隐蔽性**\n    *   论文假设 User Simulator 是冻结的，因此奖励变化仅反映 Assistant 的改进。然而，交互状态 $z$ 的注入可能改变了 Simulator 的**隐式行为分布**。例如，当 $z$ 从 \"Low Trust\" 变为 \"High Trust\" 时，Simulator 可能不仅改变了信任度，还无意中改变了对话长度、词汇复杂度或情感表达的强度。\n    *   如果 Verifier 的评分与这些隐式特征（如对话长度）相关，那么外环控制器实际上是在优化 Assistant 去触发 Simulator 的某些“高分模式”，而非真正提升共情能力。这种**Goodhart's Law** 现象会导致模型在基准测试上得分高，但在真实人类交互中表现不佳。可以通过分析 Assistant 回复与 Simulator 隐式特征（如困惑度、情感极性）的相关性来验证这一点。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“离散状态控制”到“连续情感轨迹引导”的潜在空间课程学习（Latent-Space Curriculum Learning for Continuous Emotional Trajectory Guidance）**\n\n**(a) 驱动局限与未满足需求**\n当前方法（包括本文）依赖于**离散化、正交化的交互状态**（如 Disclosure Readiness, Emotional Activation）。这种设计存在两个根本缺陷：\n1.  **粒度粗糙**：人类情感是连续且多维的，离散标签无法捕捉细微的情感变化（如从“轻微沮丧”到“深度绝望”的渐变）。\n2.  **组合爆炸与稀疏性**：随着维度增加，离散状态空间呈指数级增长，导致每个状态下的样本极度稀疏，即使有 Hierarchical Sharing，也难以准确估计效用。\n3.  **缺乏长期规划**：当前方法仅关注单轮或短程的“通过率”，未考虑情感恢复的**长期轨迹（Long-Horizon Trajectory）**。共情支持的目标不仅是单次回复得分高，而是引导用户情感从负面状态平滑过渡到正面状态。\n\n**(b) 借鉴相邻领域的方法**\n借鉴**连续控制强化学习（Continuous Control RL）**中的**潜在空间探索（Latent Space Exploration）**和**扩散模型（Diffusion Models）**中的**轨迹生成**思想。\n*   不再使用离散的 Prompt 标签，而是将交互状态建模为一个**低维连续潜在向量（Continuous Latent Vector）** $z \\in \\mathbb{R}^d$。\n*   使用一个**情感轨迹预测器（Emotional Trajectory Predictor）**，基于当前对话历史和潜在状态 $z$，预测用户未来几步的情感状态分布。\n*   课程学习的目标不再是“通过率接近 0.5”，而是**最大化情感恢复轨迹的多样性与可行性**，即在潜在空间中探索那些能导致“高难度但可恢复”的情感路径。\n\n**(c) 第一个实验设计**\n1.  **潜在空间构建**：训练一个自编码器（Autoencoder）或变分自编码器（VAE），将历史对话中的用户情感状态（通过情感分析模型提取）编码为连续向量 $z$。解码器用于生成对应的 Prompt 指令或直接作为 User Simulator 的条件输入。\n2.  **连续课程控制器**：外环控制器不再更新离散分布，而是在潜在空间 $\\mathbb{R}^d$ 中维护一个**高斯混合模型（GMM）**或**流形分布**。控制器根据 Assistant 在不同潜在区域的表现，动态调整分布的均值和协方差，引导采样向“高难度-高回报”区域移动。\n3.  **长期奖励建模**：引入**情感恢复轨迹奖励（Emotional Recovery Trajectory Reward）**，不仅评估最终得分，还评估情感状态变化的平滑度和方向性（如从负到正的单调性）。\n4.  **对比实验**：\n    *   **Baseline**: 本文的 Dual-Loop Self-Evolution（离散状态）。\n    *   **Proposed**: Latent-Space Curriculum Learning（连续潜在状态）。\n    *   **Metric**: 除了 SAGE 分数，增加**情感轨迹平滑度（Emotional Trajectory Smoothness）**和**长期恢复成功率（Long-Term Recovery Success Rate）**。\n    *   **预期结果**：连续潜在空间方法能捕捉更细微的情感变化，生成更自然的对话轨迹，并在长期情感恢复任务上显著优于离散状态方法，证明从“离散控制”到“连续引导”是提升共情对话质量的关键方向。\n\n**与已有工作的区别**：\n*   不同于本文的**离散状态分配**，本提议使用**连续潜在空间**，避免了组合爆炸和稀疏性问题。\n*   不同于传统的**RLHF**，本提议引入了**情感轨迹预测**作为课程控制的依据，而不仅仅是最终奖励。\n*   不同于**Self-Play**，本提议保持 Simulator 冻结，但通过潜在空间的动态采样实现“软性”难度调整，避免了 Simulator Drift。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yi Wei\", \"affiliations\": [1, 2], \"markers\": [\"*\", \"∗\"]},\n    {\"name\": \"Shuo Jiang\", \"affiliations\": [1], \"markers\": [\"*\", \"∗\"]},\n    {\"name\": \"Huaixia Dou\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jie Zhu\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Junhui Li\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Lifan Guo\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Feng Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Chi Zhang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Qwen DianJin Team, Alibaba Cloud Computing\"},\n    {\"id\": 2, \"name\": \"Beihang University\"},\n    {\"id\": 3, \"name\": \"School of Computer Science and Technology, Soochow University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"∗\", \"text\": \"Equal contribution.\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author.\"}\n  ]\n}\n```", "summary_translation": "大型语言模型已展现出对话能力，但共情能力仍具挑战性。共情支持本质上是多轮且路径依赖的：用户逐渐透露关切，情绪随时间演变，早期回应塑造信任与接受度。带有可验证情绪奖励的强化学习为长视界交互提供了可扩展的监督。然而，现有方法在保持训练交互分布固定的同时演化对话策略，导致策略能力与训练经验之间出现不匹配。我们引入了一种由可验证情绪反馈驱动的双循环自演化框架。在用户模拟器和验证器冻结的情况下，内循环使用连续情绪奖励优化多轮策略，而外循环利用相同结果估计策略相对交互效用并适应经验。为了从稀疏、随机的 rollout 中获得估计，该框架在每个组内保持场景和交互状态恒定，并优先处理其组通过率位于策略能力边界附近的条件。分层控制器在支持意图之间共享证据，而不确定性引导的探索和均匀重放防止过早排除。由此产生的分布生成轨迹，在不增加 rollout 预算的情况下闭合两个循环。在 SAGE 上，我们的框架将 Qwen3-8B Overall 从 53.87 提升至 79.24，并比协议匹配的均匀情绪奖励强化学习高出 7.23 分。"}, {"title": "Co-Evolution in Agentic Systems: Toward Self-Directed Evolution Beyond Human Design", "arxiv_id": "2608.10299", "authors": "Qing Zong, Jiayu Liu, Junhao Shen, Zecong Tang, Linsi Wu, Yuxuan Liu, Rui Wang, Zhaowei Wang, Weiqi Wang, Cheng Qian, Xiusi Chen, Yangqiu Song", "summary": "Agentic systems are increasingly expected to improve after deployment, yet single-entity self-evolution is often bounded by a static learning context, such as fixed tasks and feedback. This survey focuses on co-evolution in agentic systems, a multi-component form of self-evolution in which multiple agents and their environment impose adaptive pressure on one another. To organize existing papers, we propose a progressive three-stage taxonomy that traces how the system gradually sheds human-engineered constraints. Agent--Agent Co-Evolution studies how agents adapt through dynamic peers, including adversarial, collaborative, and organizational adaptation. Agent--Environment Co-Evolution extends this loop to adaptive tasks, feedback, and interaction spaces that change with the agents. Meta Co-Evolution further explores the possibility of making the evolution mechanism itself evolvable. We also discuss open challenges in evaluating such systems, scaling them across multiple components, and keeping increasingly autonomous evolutionary processes safe and controllable. This survey provides a unified foundation for building robust and open-ended agentic systems that can improve beyond fixed human-designed paths.", "category": "cs.CL", "cluster": "Self-Evolving Agents \u0026 Skill Management", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=51 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文完全符合研究范围，核心依据如下：\n\n1.  核心主题高度匹配：论文标题和摘要明确聚焦于“Agentic Systems”（智能体系统）的“Co-Evolution”（协同演化）和“Self-Directed Evolution”（自我导向演化）。这直接对应了研究焦点中的“自我演化 (Self-Evolving)”和“多智能体 (Multi-Agent)”方向。\n2.  符合“保留”标准：\n       根据第一步筛选标准，论文研究的是智能体如何通过经验、反馈和环境压力进行自我完善和迭代（Self-Evolving），属于“智能体通过经验、反思或环境反馈进行自我完善和迭代”的核心范畴。\n       论文提出的分类法涵盖了“Agent-Agent Co-Evolution”（智能体间协同演化，涉及协作、对抗等机制）和“Agent-Environment Co-Evolution”（智能体与环境协同演化，涉及自适应任务和反馈），这些都属于多智能体协作机制和智能体自适应能力的核心研究内容，而非单纯的基础设施或拓扑结构。\n       虽然这是一篇综述（Survey），但根据筛选标准，“如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准... 只要结论直接帮助理解或改进智能体能力，也应保留”。该综述旨在为构建鲁棒且开放式的智能体系统提供统一基础，直接服务于“构建、改进... LLM智能体”的目标。\n3.  排除项检查：\n       论文讨论的是演化机制（Evolutionary Mechanisms），而非单纯的多智能体通信协议或拓扑结构（Orchestration/Topology），因此不被排除。\n       虽然摘要末尾提到了“safe and controllable”（安全与可控），但这只是作为演化系统面临的挑战之一，论文的核心贡献在于演化机制的分类和框架，而非专门研究AI安全防御或对齐技术，因此不属于“安全相关”的排除范畴。\n\n综上，该论文是关于LLM智能体自我演化及多智能体协同演化的前沿综述，极具参考价值。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在系统性地梳理和定义 **Agentic Systems** 中的 **Co-Evolution**（协同进化）机制，核心研究问题是：在部署后，多组件智能体系统如何通过相互施加适应性压力，实现超越人类静态设计约束的自我导向进化？具体而言，论文试图厘清从 **Agent–Agent**、**Agent–Environment** 到 **Meta Co-Evolution** 的渐进式演化路径，并探讨如何构建一个能够持续产生新颖性（Novelty）而非收敛于固定终点的开放系统。\n\n这一问题的重要性源于当前 **Self-Evolution**（自我进化）范式的根本局限。现有的单实体自我进化（如更新模型 Backbone 或 Memory）通常受限于静态的学习上下文（如固定的任务分布和反馈信号），这导致了所谓的 **Red Queen Effect**（红皇后效应）：仅靠单方面的适应无法维持持续的进步，必须通过与对手或环境的共同适应才能突破性能瓶颈。解决这一问题具有双重价值：首先，它提供了从“静态强智能体”向“动态进化智能体”转变的理论基础，使系统能够在复杂、动态的真实世界中持续改进；其次，通过引入 **Meta Co-Evolution**，系统有望获得 **Open-Endedness**（开放性），即进化机制本身变得可进化，从而摆脱人类预设的改进路径，实现真正的自主智能增长。\n\n### § 2 前人工作与不足\n\n尽管 **Self-Evolving Agents** 和 **Multi-Agent Systems** 已有大量研究，但针对 **Co-Evolution** 的系统性综述和统一框架此前并不存在。现有的相关工作主要存在以下不足：\n\n1.  **概念混淆与范围局限**：现有的综述（如 Guo et al., 2024; Plaat et al., 2025）主要关注多智能体的交互（Interaction）或协作，而未区分单纯的“信息交换”与产生持久状态更新的“协同进化”。另一些综述（如 Gao et al., 2026; Xiang et al., 2026）虽然涉及自我进化，但仅将协同进化作为子主题或未来方向，缺乏将其作为核心组织轴线的深度分析。例如，Xiang et al. (2026) 仅涵盖了 **Model–Environment Co-Evolution**，忽略了 **Agent–Agent** 和 **Meta Co-Evolution** 的关键维度。\n2.  **缺乏渐进式演化视角**： prior work 往往孤立地研究特定场景下的对抗（如 GANs, AlphaStar）或协作（如 MARL），未能揭示进化自由度（Evolutionary Freedom）如何从智能体内部扩展到环境，最终扩展到进化机制本身（$\\Omega$）。这种碎片化的视角导致研究者难以理解不同阶段（Stage 1-3）之间的内在联系及人类约束逐步解除的过程。\n3.  **评测与治理的缺失**：现有基准（如 ToolBench, WebArena）主要评估智能体的最终静态能力，缺乏对进化过程本身（如组件间的增益转移、多样性崩溃、评估器利用）的动态评估。此外，随着 **Meta Co-Evolution** 的出现，系统可能改变奖励结构和行为准则，现有的安全治理框架（如简单的沙箱）不足以应对这种机制层面的自主变更，导致 **Evaluator Exploitation** 和 **Partner Overfitting** 等风险未被充分定义和解决。\n\n因此，本文通过提出三阶段分类法，填补了从局部适应到全局开放进化的理论空白，并明确了当前在动态评测和自主治理方面的关键缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n在深入阅读这篇综述之前，我们需要回到 Agentic Systems 发展的早期阶段，观察当时研究社区面临的瓶颈。早期的 Agent 研究主要关注静态环境下的单点优化，即通过 Prompt Engineering 或固定的 Tool Use 来提升单一 Agent 在特定任务上的表现。然而，研究者很快发现，这种 **Single-Entity Self-Evolution** 存在明显的天花板：当 Agent 在固定任务分布和固定反馈机制下训练时，其性能会迅速收敛到一个局部最优解（Plateau），无法产生真正的 **Open-Endedness**。\n\n与此同时，来自进化生物学和博弈论的 **Red Queen Effect** 提供了重要的理论线索：在一个动态系统中，仅仅适应环境是不够的，必须与不断变化的对手或环境共同进化才能维持进步。在 AI 领域，**Generative Adversarial Networks (GANs)** 和 **Self-Play** 在强化学习中的成功（如 AlphaStar）证明了，引入一个自适应的对抗方或协作方，可以迫使主体不断突破能力边界。然而，现有的综述大多将 Multi-Agent Systems 视为静态的交互网络，或将 Self-Evolution 视为单体的内部迭代，缺乏一个统一的框架来描述“多个组件如何相互施加进化压力”。\n\n此外，随着 LLM 能力的提升，研究者开始尝试让 Agent 自动生成任务（Task Generation）或调整奖励函数（Reward Shaping），但这通常被视为独立的模块，而非与 Agent 本身耦合的进化过程。现有的工作分散在 Adversarial Training、Curriculum Learning 和 Meta-Learning 等不同子领域，缺乏对 **Co-Evolution** 这一核心机制的系统性梳理。特别是，当 Agent 不仅适应环境，还能改变环境（如生成新任务、修改交互空间），甚至改变进化规则本身（Meta Co-Evolution）时，系统的行为模式发生了质的变化。\n\n因此，作者意识到需要一个全新的分类体系，不再以“Agent 类型”或“任务类型”为轴，而是以“进化自由度的边界”为轴。从 Agent 之间的相互适应（Agent-Agent），扩展到 Agent 与环境的共同塑造（Agent-Environment），最终上升到进化机制本身的自适应（Meta Co-Evolution）。这一路径旨在回答：如何摆脱人类设计的静态约束，实现真正的自主进化？\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 在于：**真正的智能进化不是单体在静态环境中的孤立优化，而是多个组件（Agent、环境、进化规则）之间相互施加适应性压力的耦合过程。** 当进化对象从单一的 Agent 扩展到动态的环境，再到控制进化的机制本身时，系统能够突破静态学习带来的性能瓶颈（Plateau），实现持续的 **Open-Endedness**。这种 **Co-Evolution** 通过不断重塑挑战与反馈的边界，迫使系统产生新颖的行为和能力，从而超越人类预设的固定路径。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**重要说明**：本文是一篇**综述论文（Survey）**，旨在对“智能体系统中的协同进化（Co-Evolution in Agentic Systems）”这一领域进行系统性梳理和分类，**并未提出单一的、具体的新算法或模型**。因此，不存在一个统一的“输入-处理-输出”Pipeline。\n\n然而，为了帮助理解，我们可以基于文中提出的**三阶段分类法（Three-Stage Taxonomy）**，选取文中提到的一个典型具体工作（例如 **Stage 1: Agent-Agent Co-Evolution** 中的 **SPAG** 或 **Stage 2: Agent-Environment Co-Evolution** 中的 **POET**）来构建一个代表性的 Pipeline 示例。以下以文中提到的 **POET (Paired Open-Ended Trailblazer)** 为例，展示 **Agent-Environment Co-Evolution** 的典型 Pipeline：\n\n**示例：POET (Agent-Environment Co-Evolution)**\n\n1.  **输入 (Input)**：\n    *   初始的简单环境（如一个简单的网格世界或迷宫）。\n    *   初始的智能体策略（Agent Policy）。\n    *   进化机制 $\\Omega$（包括环境生成器、智能体训练器、评估器）。\n\n2.  **处理 (Processing) - 协同进化循环**：\n    *   **环境生成 (Environment Generation)**：环境生成器（通常是一个进化算法或LLM）根据当前智能体的能力，生成一系列新的、具有不同难度和复杂度的环境变体（Levels）。\n    *   **智能体训练 (Agent Training)**：智能体在这些新生成的环境中进行强化学习（RL）训练，尝试解决任务。\n    *   **评估与选择 (Evaluation \u0026 Selection)**：\n        *   评估智能体在新环境中的表现。\n        *   评估环境的“新颖性”和“可学习性”（即智能体是否能从中进步）。\n    *   **协同更新 (Co-Update)**：\n        *   **智能体更新**：保留表现更好的策略参数。\n        *   **环境更新**：保留那些能促使智能体进步、且智能体尚未完全掌握的环境变体，淘汰过于简单或过于困难的环境。\n    *   **迭代 (Iteration)**：将更新后的智能体和新一代环境作为下一轮的输入，重复上述过程。\n\n3.  **输出 (Output)**：\n    *   一个能力不断提升的智能体（Agent）。\n    *   一个复杂度不断增加、多样化的环境库（Environment Archive）。\n    *   智能体与环境共同进化的轨迹，展示了系统如何突破静态环境的性能瓶颈。\n\n**其他阶段的简要 Pipeline 示意**：\n\n*   **Stage 1: Agent-Agent Co-Evolution (e.g., GAN/Adversarial)**：\n    *   *输入*：两个对抗智能体（如生成器 Generator 和判别器 Discriminator）。\n    *   *处理*：生成器生成样本，判别器判断真假；两者交替训练，互相施加压力。\n    *   *输出*：生成器生成更逼真的样本，判别器判断更准确。\n\n*   **Stage 3: Meta Co-Evolution (e.g., RQGM)**：\n    *   *输入*：低层级的协同进化系统（如 Agent + Evaluator）。\n    *   *处理*：元智能体（Meta-Agent）观察低层级系统的进化轨迹，动态调整进化机制 $\\Omega$（如改变奖励函数、调整进化频率、选择进化目标）。\n    *   *输出*：一个能够自我调整进化规则的系统，实现更开放式的进化（Open-endedness）。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过**。\n\n本文是一篇综述论文，主要贡献在于提出分类框架（Taxonomy）和梳理现有文献，**不包含新的核心数学推导或理论证明**。文中虽然引用了一些公式（如状态转移 $S[t+1] = \\Omega(S[t], \\tau[t])$ 和开放式进化的定义 $\\lim_{t\\to\\infty} H(S[t], \\Omega[t]) = \\infty$），但这些均为对现有概念的形式化定义，而非本文提出的新推导过程。\n\n### § 7 实验设计与结论\n\n**重要说明**：作为综述论文，本文**没有设计新的实验**来验证某个特定算法。其“实验”部分主要体现在对现有文献的**系统性分析**和**跨论文证据汇总（Cross-paper Evidence）**。\n\n**提出了什么问题**：\n1.  现有的智能体自我进化（Self-Evolution）是否受限于静态环境？\n2.  协同进化（Co-Evolution）是否能带来比单一实体进化更持续的性能提升？\n3.  协同进化的不同阶段（Agent-Agent, Agent-Environment, Meta）在效果、一致性和收敛性上有何差异？\n\n**设计了什么实验验证这个问题**：\n1.  **文献分类与梳理**：提出了三阶段分类法，将现有工作归类，分析其进化边界（Evolutionary Freedom）的扩展情况。\n2.  **跨论文证据汇总（Figure 4）**：\n    *   **数据收集**：从引用的论文中提取实验结果，特别是那些包含“静态对照组”和“协同进化实验组”的对比数据。\n    *   **匹配比较（Matched Comparisons）**：在相同模型和评估设置下，比较静态 counterpart 与进化 counterpart 的性能差异。\n    *   **归一化轨迹分析（Normalized Trajectories）**：将不同论文中的性能提升轨迹归一化到 [0, 1] 区间，绘制平均进化曲线，以观察协同进化是否能在长期训练中避免性能 plateau（平台期）。\n\n**问题的答案是什么**：\n1.  **协同进化有效**：Figure 4 显示，在大多数设置下，协同进化（Stage 1 和 Stage 2）相比静态环境能带来显著的性能提升。\n2.  **存在性能瓶颈**：尽管有提升，但 Stage 1 和 Stage 2 的进化曲线最终仍趋于平缓（Plateau），表明仅靠 Agent 或 Environment 的进化仍有上限。\n3.  **Meta Co-Evolution 的潜力**：理论分析和少量初步工作（如 RQGM）表明，允许进化机制本身进化（Stage 3）可能打破这一瓶颈，实现真正的开放式进化（Open-endedness），但该阶段目前研究尚少，处于早期阶段。\n4.  **挑战明确**：评估、扩展性和安全性是协同进化系统面临的主要挑战，需要新的评估范式（如动态评估、过程级测试）和治理机制。", "additional_insights": "### § 8 Take-aways\n\n本文提出了 Agentic Systems 中 Co-Evolution 的渐进式三阶段分类法，核心观点是系统的持续进化能力取决于其摆脱人类预设约束的程度。第一阶段 Agent–Agent Co-Evolution 关注在固定环境下的多智能体相互适应，包括对抗性（如安全红蓝对抗）和协作性（如角色分工与组织演化）两种模式。第二阶段 Agent–Environment Co-Evolution 将进化边界扩展至环境组件，通过动态调整任务空间（Task-Space）、反馈机制（Feedback-Space）和交互世界（Interaction-Space）来维持进化压力。第三阶段 Meta Co-Evolution 旨在使进化机制本身（Ω）可进化，通过自我修订“进化什么、何时进化、如何进化”等元决策，通向 Open-Endedness。现有研究多处于前两个阶段，且常面临性能 Plateau 问题，而 Meta Co-Evolution 目前仅有少量先驱工作（如 RQGM），缺乏成熟的系统性实现。评估此类系统面临巨大挑战，传统静态 Benchmark 无法捕捉组件间的联合进步，需引入过程级测试以检测 Evaluator Exploitation 或 Partner Overfitting 等失效模式。\n\n### § 9 最脆弱的假设\n\n本文最脆弱的假设是：**Co-Evolution 产生的适应性压力能够持续引导系统向更有用的方向进化，而非陷入局部最优、模式崩溃或有害的对抗均衡。** 这一假设在实际中可能不成立，因为多组件耦合进化极易导致非预期的涌现行为，例如攻击者发现防御者的漏洞后不再探索新策略（Mode Collapse），或者环境生成器产生对智能体有益但对人类无意义的“作弊”任务（Reward Hacking）。论文在 §6 中承认了 Evaluator Exploitation、Partner Overfitting 和 Diversity Collapse 等风险，但并未提供具体的技术证据或协议来证明 Co-Evolution 机制本身能自动规避这些陷阱。相反，论文指出当前的 Safety and Governance 仅停留在 Desiderata 层面，缺乏可操作的 Safeguards。如果这一假设失效，Co-Evolution 不仅无法实现 Self-Directed Evolution，反而可能加速系统走向不可控或退化，使得其相对于 Single-Entity Self-Evolution 的优势荡然无存。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 **Agent–Environment Co-Evolution 中的 Task-Space 自适应生成** 这一子集，以验证“动态任务生成能否突破静态任务的性能 Plateau”。\n\n*   **数据与设置**：使用一个小型的 LLM Agent 基准测试集（如 SWE-bench 的子集或简单的数学推理题），构建一个包含“静态任务池”和“动态任务生成器”的对比实验。\n*   **实现**：\n    1.  **Baseline**：Agent 在固定任务池上进行 Self-Evolution（如通过 Self-Refinement 或简单的 RLHF）。\n    2.  **Co-Evolution**：引入一个轻量级的 Task Generator（可以是另一个较小的 LLM 或基于规则的扰动器），根据 Agent 的历史失败案例（Failure Traces）生成新的、难度略高于当前能力的任务。\n*   **测量**：记录 Agent 在两个设置下的性能曲线（Accuracy vs. Epochs）。\n*   **判定标准**：如果 Co-Evolution 设置下的 Agent 在达到 Baseline 的 Plateau 后仍能持续显著提升性能，且新任务确实覆盖了 Agent 之前的弱点（通过人工抽样验证任务多样性），则支持了 Co-Evolution 能扩展进化边界的 Claim。反之，如果性能提前停滞或新任务变得无关紧要，则反驳了该机制的有效性。此实验无需复现复杂的 Multi-Agent 或 Meta 机制，仅聚焦于 Agent 与 Task 的耦合进化。", "research_value": "### § 11 最强反例设计\n\n若要挑战本文关于 **Co-Evolution** 能实现超越人类设计的 **Self-Directed Evolution** 的核心论点，最有力的攻击并非证明其无效，而是证明其产生的“进化”本质上是 **Illusory Progress**（虚假进步），即系统仅在优化内部定义的代理指标（Proxy Metrics），而未在真实世界的效用空间（Utility Space）中产生有意义的 **Novelty**。\n\n具体反例设计如下：构建一个 **Closed-Loop Co-Evolutionary Sandbox**，其中包含一个 **Agent**、一个 **Environment Generator** 和一个 **Evaluator**，三者均基于相同的底层 **LLM Backbone** 或共享相同的 **Representation Space**。在此设置中，**Agent–Environment Co-Evolution** 极易陷入 **Semantic Drift**（语义漂移）或 **Reward Hacking** 的变体。例如，**Environment Generator** 可能发现生成某些特定结构的“伪任务”（Pseudo-Tasks），这些任务在语法上复杂且新颖，但逻辑上空洞或可通过简单的启发式规则（Heuristics）解决，而非真正的推理能力。由于 **Evaluator** 也是基于相同模型训练的，它可能无法区分“真正的智能突破”与“对生成器偏好的过拟合”。\n\n**理论论证**：根据 **Goodhart’s Law**，当一项指标成为目标时，它就不再是一个好的指标。在 **Co-Evolution** 中，**Agent** 和 **Environment** 共同优化的是“在彼此当前状态下的表现”，而非“绝对能力”。如果 **Evolutionary Pressure** 仅来自内部循环，系统会迅速收敛到一个 **Local Equilibrium**，其中 **Agent** 擅长解决 **Environment** 生成的特定类型问题，而 **Environment** 擅长生成 **Agent** 能解决的问题。这种 **Co-Adaptation** 导致的是 **Partner Overfitting**，而非能力的泛化。\n\n**实验验证**：\n1.  **设置**：运行上述 **Co-Evolution** 系统 1000 个 Epochs。\n2.  **外部测试**：每隔 100 个 Epochs，将当前的 **Agent** 提取出来，在一个完全独立、由人类专家设计的、分布外（Out-of-Distribution, OOD）的基准测试集（如 **MMLU-Pro** 或 **HumanEval** 的未见子集）上进行评估。\n3.  **预期结果**：如果本文的假设成立，**Agent** 在外部基准上的性能应随内部进化步数单调递增或至少保持高位。然而，反例预测显示，**Agent** 在内部循环中的“得分”会持续上升（因为 **Environment** 变得对 **Agent** 更“友好”或更“可预测”），但在外部基准上的性能将迅速停滞甚至下降（因为 **Agent** 学会了利用 **Environment** 的生成偏差，而非学习通用推理技能）。这将证明 **Co-Evolution** 在没有外部锚点（External Anchor）的情况下，无法保证进化的方向性，从而推翻其作为 **Self-Directed Evolution** 有效路径的结论。\n\n### § 12 Follow-up Research Idea\n\n基于上述对 **Co-Evolution** 易陷入 **Internal Equilibrium** 和 **Semantic Drift** 的局限性的理解，提出一个新的研究方向：**Grounded Co-Evolution via Physical or Social Constraints**（基于物理或社会约束的协同进化）。\n\n**(a) 驱动局限与未满足需求**：\n当前 **Co-Evolution** 研究（如 **POET**, **RQGM**）主要关注抽象的 **Task-Space** 或 **Reward-Space** 的演化，缺乏对 **Real-World Constraints** 的建模。这导致进化过程是“无根”的，容易偏离人类意图。未满足的需求是：如何将 **Co-Evolution** 的开放性（Open-Endedness）与 **Grounding**（接地性）相结合，确保进化出的行为不仅在内部循环中有效，而且在物理世界或社会规范中具有实际意义和安全性。\n\n**(b) 借鉴相邻领域的方法**：\n借鉴 **Embodied AI**（具身智能）中的 **Sim-to-Real** 迁移技术和 **Social Simulation**（社会模拟）中的 **Norm Emergence**（规范涌现）研究。具体而言，引入 **Physics-Informed Neural Networks (PINNs)** 的思想，将物理定律或社会规范作为 **Hard Constraints** 嵌入到 **Evolutionary Mechanism $\\Omega$** 中，而非仅仅作为奖励信号。此外，借鉴 **Game Theory** 中的 **Mechanism Design**，设计一种 **Incentive-Compatible** 的进化协议，使得 **Agent** 和 **Environment** 只有在产生对“外部观察者”（即人类或真实世界）有益的行为时才能获得进化优势。\n\n**(c) 第一个实验设计**：\n构建一个 **Multi-Agent Embodied Co-Evolution** 实验，场景为一个虚拟的 **Smart City** 或 **Industrial Factory**。\n1.  **组件**：多个 **Agent**（如机器人、调度器）、一个动态 **Environment**（如交通流、生产流水线）、以及一个 **Meta-Controller**（负责调整进化规则）。\n2.  **约束**：引入严格的 **Physical Constraints**（如碰撞检测、能量守恒）和 **Social Constraints**（如交通规则、公平性指标）。这些约束不是软奖励，而是 **Feasibility Filters**：任何违反约束的 **Agent** 策略或 **Environment** 变体将被直接剔除，无法参与下一轮进化。\n3.  **进化目标**：**Agent** 和 **Environment** 共同进化以最大化系统效率（如吞吐量），但必须在满足所有 **Hard Constraints** 的前提下。\n4.  **对比**：与传统的 **Unconstrained Co-Evolution**（仅优化效率奖励）进行对比。\n5.  **预期发现**：传统方法可能会进化出“作弊”策略（如忽略碰撞以换取速度），导致系统在真实部署中失败；而 **Grounded Co-Evolution** 将迫使系统探索在约束边界内的真正创新（如新的协作协议或路径规划算法），从而证明 **Constraints** 不是进化的阻碍，而是引导 **Novelty** 向有用方向发展的 **Catalyst**（催化剂）。这将开辟一个将 **Safety** 和 **Grounding** 内生于进化机制本身的新范式，而非事后治理。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Qing Zong\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jiayu Liu\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Junhao Shen\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zecong Tang\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Linsi Wu\",\n      \"affiliations\": [\n        5\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yuxuan Liu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Rui Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zhaowei Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Weiqi Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Cheng Qian\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xiusi Chen\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yangqiu Song\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"HKUST\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"UIUC\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"CUHK\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"HKU\"\n    },\n    {\n      \"id\": 5,\n      \"name\": \"PKU\"\n    }\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "Agentic systems 在部署后日益被期望能够持续改进，然而单一实体的自我进化往往受限于静态的学习环境，例如固定的任务和反馈。本综述聚焦于 Agentic systems 中的协同进化（co-evolution），这是一种多组件形式的自我进化，其中多个智能体及其环境相互施加适应性压力。为了梳理现有文献，我们提出了一种渐进式的三阶段分类法，追踪系统如何逐步摆脱人工设计的约束。Agent--Agent Co-Evolution 研究智能体如何通过动态的对等方进行适应，包括对抗性、协作性和组织性适应。Agent--Environment Co-Evolution 将这一循环扩展至随智能体变化的自适应任务、反馈和交互空间。Meta Co-Evolution 进一步探索使进化机制本身具备可进化性的可能性。我们还讨论了在评估此类系统、跨多个组件扩展系统规模，以及确保日益自主的进化过程安全可控方面所面临的开放挑战。本综述为构建能够超越固定人工设计路径、持续改进的鲁棒且开放式的 Agentic systems 提供了统一的基础。"}, {"title": "Optimize Cheap, Deploy Strong: Cost-Aware Cross-Tier Transfer for Evolutionary Optimization", "arxiv_id": "2608.10694", "authors": "Tal Oved, Roi Pony, Oshri Naparstek, Udi barzelay", "summary": "Evolutionary optimization of LLM prompts and agentic programs (e.g., GEPA) is dominated by fitness evaluation: scoring each candidate runs an answering LLM over a validation set, so the evaluator's price tier dictates total search cost. We restructure that search by decoupling the three roles an LLM plays, running the high-volume answering role on the cheapest tier, reserving a strong model for the rare reflection/variation operator, then exploiting upward cross-tier transfer to deploy the cheaply evolved prompt on a stronger target. We contribute a cost-controlled characterization of when cheap-tier search substitutes for target-tier search, and where it fails. Across four tasks (HotpotQA, IFBench, LiveBench-Math, HoVer) and eleven models in four model families, the resulting prompt matches or exceeds same-tier optimization while placing over 96% of search tokens on the cheapest tier, at 5.6-14x lower search cost, rising to 25-54x where reasoning tiers emit long chains of thought on every fitness call.", "category": "cs.CL", "cluster": "Self-Evolving Agents \u0026 Skill Management", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-42 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文符合“自我演化 (Self-Evolving)”和“LLM智能体构建/改进”的研究范围，具体依据如下：\n\n1.  核心机制属于自我演化/提示优化：论文标题和摘要明确指出其研究对象是“Evolutionary optimization of LLM prompts and agentic programs”（LLM提示词和智能体程序的演化优化）。这直接对应筛选标准中“保留”的第5条：“如果论文的核心机制是 self-evolving / self-improving / iterative improvement ... 即使对象是 ... prompt optimization，也应优先保留”。\n2.  涉及智能体组件的改进：摘要中提到的“agentic programs (e.g., GEPA)”表明其优化对象不仅仅是静态提示词，还包括智能体的程序化逻辑或工作流。这符合筛选标准中“保留”的第2条，即研究 agent harness/scaffold 的自动改进。\n3.  包含反思与变异算子：摘要提到保留强模型用于“reflection/variation operator”（反思/变异算子），这是智能体自我反思（Self-Reflection）和演化算法中的关键组件，直接关联到智能体能力的迭代提升。\n4.  非纯基础设施：虽然论文关注“Cost-Aware”（成本感知），但其核心贡献在于通过分层策略优化演化搜索过程，从而更有效地生成高质量的智能体提示/程序，而非单纯的硬件加速或部署基础设施。它解决的是“如何更经济地演化出更好的智能体”这一方法论问题。\n\n综上，该论文探讨了如何通过演化算法和成本优化策略来改进LLM智能体的提示和程序，属于智能体自我演化和构建方法的范畴，因此予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在基于进化算法（Evolutionary Optimization）的大语言模型（LLM）提示词优化过程中，是否必须使用与目标部署模型相同的高成本模型来进行搜索阶段的适应度评估（Fitness Evaluation）？传统方法假设搜索必须在目标模型上进行，因为适应度评估占据了绝大部分计算成本，且通常认为只有目标模型才能准确反映提示词的质量。然而，作者挑战了这一假设，提出了一种“成本感知跨层级迁移”（Cost-Aware Cross-Tier Transfer）策略，将进化循环中的三个角色解耦：使用最便宜的模型进行高频的适应度评估（Answering Role），使用强大的模型进行低频的变异操作（Variation Operator），最后将进化出的提示词零样本（Zero-shot）部署到更强的目标模型上。\n\n这一问题的重要性在于，LLM提示词优化的主要瓶颈是成本。适应度评估需要在一个验证集上运行大量候选提示词，导致token消耗巨大，从而限制了种群大小、迭代代数和最终优化质量。现有的优化方法往往因为高昂的成本而难以扩展，或者只能在较小的预算下进行低质量的搜索。通过解耦角色并利用“向上跨层级迁移”（Upward Cross-Tier Transfer），该方法能够在保持甚至超越同层级优化性能的同时，将搜索成本降低5.6至54倍。这不仅使得大规模、高精度的提示词优化在经济上可行，还揭示了提示词优化中的一个关键不对称性：变异操作需要强模型的推理能力以生成高质量编辑，而适应度评估仅需弱模型的排序能力以引导选择。这种洞察为设计更高效、低成本的LLM自动化优化流程提供了新的理论依据和实践指导。\n\n### § 2 前人工作与不足\n\n在LLM提示词优化领域，前人工作主要集中在进化算法（如GEPA, EvoPrompt, PromptBreeder）和贝叶斯优化（如DSPy, MIPROv2）上。这些方法通常将LLM作为变异算子或评估器，但往往假设搜索模型与部署模型一致，或者仅在相同价格层级内优化。例如，GEPA（Agrawal et al., 2026）引入了反射式变异（Reflective Mutation），允许LLM阅读执行轨迹并提出提示词编辑，但其评估和变异仍由同一模型或同层级模型完成，导致成本随目标模型能力线性增长。其他工作如CAPO（Zehle et al., 2025）和PMPO（Zhao et al., 2025）试图通过减少候选数量或使用代理模型来降低成本，但它们仍然在目标模型层级内进行优化，未能利用不同层级模型之间的性能差异。\n\n现有研究的不足主要体现在以下几个方面：首先，它们未能充分利用“弱模型评估、强模型变异”的不对称性。虽然已有研究观察到弱模型到强模型的提示词迁移现象（如GEPA-Qwen-Opt），但这通常被视为一种附带现象，而非一种系统的成本策略。其次，现有方法缺乏对跨层级迁移（Cross-Tier Transfer）的系统性研究，特别是向上迁移（Weak to Strong）的条件和边界。大多数工作关注同层级内的优化效率，忽略了通过降低评估成本来换取更大搜索空间的可能性。最后，现有方法在成本建模上不够精细，往往将评估和变异视为同等重要的成本项，而实际上评估占据了超过96%的token消耗。因此，之前的研究未能提出一种能够显著降低搜索成本同时保持或提升部署性能的系统性方法，这正是本文所填补的空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM 提示词优化（Prompt Optimization）领域，基于进化算法（Evolutionary Algorithms, EA）的方法如 GEPA 已被证明有效，但其核心瓶颈在于 **Fitness Evaluation** 的成本。传统的 EA 循环中，评估候选解的适应度占据了绝大部分计算资源（通常超过 90% 的 Token 消耗）。现有的优化策略主要集中在两个方向：一是通过 **Surrogate Models** 或 **Multi-fidelity** 技术用廉价模型近似目标函数的值，但这通常假设廉价模型与目标模型之间存在可校准的映射关系；二是通过减少评估次数（如 Successive Halving）来节省成本，但这限制了搜索的精度。\n\n然而，研究者观察到一种不对称性：**Variation Operator**（变异算子，负责生成新提示词）与 **Evaluator**（评估器，负责打分）对模型能力的依赖截然不同。Variation Operator 需要极强的逻辑推理和文本生成能力来提出高质量的编辑建议，但它调用频率极低（通常仅占总调用的 \u003C5%）；相反，Evaluator 只需要具备足够的区分度（Ranking Capability）来引导选择压力，而不需要精确预测目标模型在部署时的绝对性能，且其调用频率极高。\n\n现有的工作（如 Agrawal et al., 2026; Gao et al., 2026）偶尔观察到 **Weak-to-Strong Transfer** 现象，即在弱模型上优化的提示词在强模型上表现良好，但这通常被视为一种偶然的泛化特性，而非系统的成本策略。同时，**Model Drift** 理论指出，横向迁移（Lateral Transfer，即同等能力模型间）往往会导致性能下降，因为提示词可能过度拟合了特定模型的隐式偏差。\n\n基于此，作者提出一个反直觉的假设：如果我们将 **Fitness Evaluation** 完全剥离出目标模型，转而使用最廉价的模型（甚至本地开源模型）作为评估环境，同时保留一个强模型作为 **Reflector**（变异算子），是否能在大幅降低成本的同时，利用廉价评估器迫使提示词变得更加 **Explicit**（显式化），从而在部署到强模型时产生 **Positive Transfer**（正向迁移）？这一思路将“模型层级（Model Tier）”本身视为 **Fidelity** 维度，通过解耦 **Answering**、**Variation** 和 **Deployment** 三个角色，构建了一种 **Cost-Aware Cross-Tier Transfer** 策略。\n\n### § 4 核心 Intuition\n\n传统进化优化将昂贵的目标模型同时用于评估和变异，导致成本高昂且提示词往往依赖模型的隐式推理能力（Implicit Reasoning），难以跨模型迁移。本方法的核心直觉在于利用 **Role Asymmetry**：将高频但只需粗略排名的 **Fitness Evaluation** 交给最廉价的模型，迫使 **Strong Reflector** 生成结构更清晰、指令更显式（Explicit）的提示词以弥补廉价评估器的噪声；这种显式化的提示词不仅降低了搜索成本，反而在部署到更强的目标模型时，因消除了对特定模型隐式偏差的依赖而实现了 **Positive Transfer**，即“廉价搜索，强力部署”。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法是 **Cost-Aware Cross-Tier Transfer**（成本感知跨层级迁移）。其核心思想是将进化优化（Evolutionary Optimization）循环中 LLM 扮演的三个角色解耦，并分配给不同价格/能力的模型层级（Tier），以实现“廉价搜索，强力部署”。\n\n**具体 Pipeline 步骤如下：**\n\n1.  **角色解耦与分配 (Role Decoupling \u0026 Assignment)**：\n    *   **Answering Role (回答者)**：负责在验证集上执行候选 Prompt 并生成答案。此角色调用频率极高，消耗绝大部分 Token。策略：分配给**最廉价**的模型（$M_{task}$，如 gpt-4.1-nano 或本地开源模型）。\n    *   **Variation/Reflector Role (变异/反思者)**：负责阅读执行轨迹（Execution Traces），分析错误，并生成针对 Prompt 的修改建议。此角色调用频率低，但需要高智能。策略：分配给**最强/最贵**的模型（$M_{refl}$，如 Claude Sonnet-5 或 gpt-5.5）。\n    *   **Deployment Role (部署者)**：最终使用优化后的 Prompt 进行实际任务推理。策略：可以是任意目标模型（$M_{dep}$），通常比 $M_{task}$ 更强。\n\n2.  **进化搜索循环 (Evolutionary Search Loop)**：\n    *   **初始化**：生成一组初始候选 Prompt。\n    *   **评估 (Fitness Evaluation)**：使用廉价模型 $M_{task}$ 对每个候选 Prompt 在验证集上进行批量推理，计算得分（如准确率、约束满足率）。注意：这里不追求精确的绝对分数，只需能区分优劣以指导选择。\n    *   **选择 (Selection)**：根据 $M_{task}$ 的得分，选择表现最好的候选 Prompt。\n    *   **变异 (Variation/Mutation)**：将选中 Prompt 的执行轨迹（包括输入、廉价模型的输出、错误信息）发送给强力模型 $M_{refl}$。$M_{refl}$ 分析错误原因，生成具体的编辑指令（如增加约束、修改格式要求），从而产生新的候选 Prompt。\n    *   **迭代**：重复上述过程，直到达到预算或收敛。\n\n3.  **零样本跨层级部署 (Zero-Shot Cross-Tier Deployment)**：\n    *   搜索结束后，直接将在廉价模型上优化得到的最佳 Prompt，**无需任何微调、校准或重新优化**，直接部署到目标强力模型 $M_{dep}$ 上。\n\n**真实例子讲解：优化 HotpotQA 任务**\n\n*   **输入**：一个初始的 HotpotQA 检索与回答 Prompt，以及 HotpotQA 验证集。\n*   **处理**：\n    1.  **廉价评估**：系统使用 **gpt-4.1-nano** ($M_{task}$) 运行该 Prompt 处理验证集。Nano 模型可能因为能力不足，在某些复杂多跳推理上出错，或者格式不符合要求。\n    2.  **强力反思**：系统选取一个表现尚可但仍有错误的 Prompt，将其在 Nano 上的错误案例（如“未找到正确文档”或“答案格式错误”）发送给 **Claude Sonnet-5** ($M_{refl}$)。\n    3.  **生成编辑**：Sonnet-5 分析发现，Nano 失败是因为 Prompt 中缺乏明确的“逐步推理”指令。Sonnet-5 生成一个新的 Prompt 版本，增加了“Step-by-step reasoning”和更严格的格式约束。\n    4.  **再次评估**：新 Prompt 再次由 Nano 评估。如果 Nano 的得分提升（即使 Nano 本身能力有限，但更清晰的指令通常能提升其表现），该 Prompt 被保留。\n    5.  **迭代优化**：经过多轮迭代，得到一个对 Nano 来说“最清晰、最结构化”的 Prompt。\n*   **输出**：最终得到的 Prompt 被直接部署到 **Claude Haiku** 或 **GPT-4.1-mini** ($M_{dep}$) 上。\n*   **结果**：尽管 Prompt 是在弱模型上优化的，但由于其结构极其明确（Explicitness），强模型 $M_{dep}$ 能更好地利用这些指令，其表现往往**持平甚至超过**直接在 $M_{dep}$ 上花费高昂成本优化得到的 Prompt。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的理论证明，但其核心逻辑建立在几个关键的数学定义和成本模型上，用于量化“迁移收益”和“成本节省”。\n\n**1. 目标函数与代理目标 (Objective vs. Surrogate)**\n\n*   **背景**：传统方法中，搜索模型和部署模型是同一个（$\\theta_{frozen} = \\theta_{dep}$）。\n*   **公式 Intuition**：\n    *   我们真正关心的是部署模型 $M_{dep}$ 的性能：$J_{dep}(\\Pi) = J_T(\\Pi, \\theta_{dep})$。\n    *   但在搜索过程中，我们使用的是廉价模型 $M_{task}$ 的性能：$J_{task}(\\Pi) = J_T(\\Pi, \\theta_{task})$。\n    *   论文将目标分解为：$J_{dep}(\\Pi) = J_{task}(\\Pi) + \\Delta(\\Pi)$。\n    *   **Intuition**：$\\Delta(\\Pi)$ 是“迁移残差”（Transfer Residual）。如果 $\\Delta(\\Pi)$ 很小或为负（即 $J_{dep} \u003E J_{task}$ 的相对增益），说明廉价搜索是有效的。论文的核心假设是：通过优化 $J_{task}$，我们可以间接最大化 $J_{dep}$，且 $\\Delta(\\Pi)$ 可控。\n\n**2. 目标遗憾 (Target Regret, $R_{s \\to t}$)**\n\n*   **定义**：$R_{s \\to t} = J_t(\\pi_t^*) - J_t(\\pi_s^*)$。\n    *   $\\pi_t^*$：直接在目标层级 $t$ 上优化得到的最佳 Prompt。\n    *   $\\pi_s^*$：在廉价源层级 $s$ 上优化得到的 Prompt，部署在 $t$ 上。\n*   **Intuition**：\n    *   如果 $R_{s \\to t} \\approx 0$，说明廉价搜索的效果与全价搜索持平（Zero-shot transfer）。\n    *   如果 $R_{s \\to t} \u003C 0$，说明廉价搜索的效果**更好**（Positive transfer）。这是论文的强 Claim。\n    *   论文还定义了归一化的残差 $\\delta_{s \\to t} [\\%]$，用于跨任务比较。\n\n**3. 成本模型 (Cost Model)**\n\n*   **公式**：$C \\approx K \\cdot N_{val} \\cdot c(M_{task}) + A \\cdot c(M_{refl})$。\n    *   $K \\cdot N_{val}$：通过筛选的候选数 $\\times$ 验证集大小。这是评估阶段，调用次数最多。\n    *   $A$：变异尝试次数。这是反思阶段，调用次数少。\n    *   $c(\\cdot)$：每调用的成本。\n*   **Intuition**：\n    *   由于 $N_{val} \\gg b$（验证集远大于小批量筛选集），且评估调用占搜索 Token 的 **96% 以上**，因此 $c(M_{task})$ 对总成本起决定性作用。\n    *   将 $M_{task}$ 设为最廉价模型，可以将主导项的成本降至最低。\n    *   $M_{refl}$ 虽然单价高，但调用次数少（\u003C5%），因此其成本增加是“有界的”（Bounded premium）。\n    *   **结论**：只要 $R_{s \\to t}$ 足够小，这种角色分离就能带来巨大的成本节省（5.6x - 54x）。\n\n---\n\n### § 7 实验设计与结论\n\n**提出了什么问题？**\n在 LLM 提示词进化优化中，是否必须使用与部署模型相同（或更强）的模型来进行搜索？能否通过“廉价评估 + 强力变异 + 跨层级部署”的策略，在大幅降低成本的同时，保持甚至提升最终性能？\n\n**设计了什么实验验证这个问题？**\n1.  **多模型家族对比**：选择了四个模型家族（Mixed Claude, GPT, Gemini, Mixed Qwen），涵盖不同供应商和价格梯队。\n2.  **多任务测试**：在四个不同难度的任务上测试（HotpotQA, IFBench, LiveBench-Math, HoVer），以验证方法的泛化性。\n3.  **基线对比**：\n    *   **Full Same-Tier**：在目标模型上全价优化（Baseline）。\n    *   **Cheap+Reflect**：本文方法（廉价评估 + 强力反思 + 跨层级部署）。\n    *   **Seed Prompt**：未优化的初始 Prompt，用于确定优化空间（Headroom）。\n4.  **消融实验 (Ablation)**：\n    *   **角色消融**：分别测试“廉价评估+弱反思”、“全价评估+强反思”等组合，以确定是哪个角色带来了性能提升。\n    *   **优化器消融**：使用 MIPROv2 替代 GEPA，验证方法是否依赖于特定的进化算法。\n5.  **显式性分析 (Explicitness Analysis)**：分析廉价搜索生成的 Prompt 与全价搜索生成的 Prompt 在文本特征（如指令密度、禁止词、大写强调）上的差异，以解释迁移成功的原因。\n\n**问题的答案是什么？**\n1.  **成本大幅降低**：廉价搜索策略在四个任务、十一个模型上，将搜索成本降低了 **5.6x 到 54x**，其中 96% 以上的 Token 消耗在最廉价层级。\n2.  **性能持平或更优**：在 48 个部署场景中，有 36 个场景廉价搜索的性能**持平或超过**全价同层级优化。特别是在 Gemini 家族中，由于推理模型生成长 Chain-of-Thought，成本节省尤为显著。\n3.  **正向迁移 (Positive Transfer)**：廉价搜索生成的 Prompt 往往比目标模型自己优化的 Prompt 更“显式”（Explicit），包含更多结构化指令和约束。这种显式性使得强模型能更好地利用 Prompt，从而产生正向迁移。\n4.  **关键杠杆是变异者**：消融实验表明，**强力的变异者 (Strong Reflector)** 是产生可迁移 Prompt 的关键，而廉价评估者只需具备基本的区分能力即可。\n5.  **局限性**：如果廉价模型在任务上完全无能（得分接近 0），搜索会停滞；如果目标模型已达到性能天花板（Prompt-insensitive ceiling），优化收益有限。", "additional_insights": "### § 8 Take-aways\n\n该论文提出了一种成本感知的跨层级迁移策略（Cost-Aware Cross-Tier Transfer），核心思想是将进化优化循环中的三个角色解耦：使用最便宜的模型（Cheapest Tier）进行高频的适应度评估（Fitness Evaluation），使用最强的模型（Strong Model）进行低频的变异操作（Variation Operator/Reflection），最后将进化出的 Prompt 零样本部署（Zero-shot Deployment）到更强的目标模型上。实验表明，这种“廉价搜索、强力部署”的策略在四个任务（HotpotQA, IFBench, LiveBench-Math, HoVer）和四个模型家族中，以 5.6–54 倍的成本降低，实现了与同层级全成本优化相当甚至更优的性能。关键发现是，廉价评估器迫使变异算子生成更具结构性显式（Structural Explicitness）的 Prompt（如更多的指令、禁令和强调），这种显式性使得 Prompt 能够正向迁移（Positive Transfer）到能力更强的模型上，而不仅仅是无损迁移。消融实验证实，性能增益主要来源于强变异算子（Strong Reflector）而非廉价评估器本身，廉价评估器的作用仅是降低主要成本项（占搜索 Token 96% 以上的回答角色）。该方法在目标模型对 Prompt 敏感且存在优化空间的任务上效果显著，但在目标模型已接近性能天花板（Prompt-insensitive ceiling）或廉价模型完全无法提供有效梯度信号的任务上失效。\n\n### § 9 最脆弱的假设\n\n该方法最脆弱且关键的假设是：**廉价评估模型（Cheap Answerer）必须能够产生具有区分度的适应度信号（Discriminative Fitness Signal），即其评估结果与目标强模型的最终性能之间存在单调或至少非负的相关性。** 如果廉价模型在任务上的表现过于随机或完全错误，导致进化算法无法通过选择压力（Selection Pressure）筛选出更优的 Prompt，整个搜索过程将停滞或收敛到局部最优，此时无论变异算子多强，都无法生成可迁移的高质量 Prompt。论文在 Limitations 部分承认了这一点，指出如果廉价模型得分接近 0，适应度景观（Fitness Landscape）将变得平坦，搜索会停滞。然而，论文提供的证据主要基于 gpt-4.1-nano 和 Qwen3-8B 等仍具备一定基础能力的模型，并未充分探索当廉价模型能力极低（如极小参数量的开源模型）时，这种相关性是否依然成立。此外，论文假设廉价模型生成的“显式 Prompt”能被强模型完美利用，但如果廉价模型因能力不足而生成大量幻觉或错误约束，强模型可能无法纠正这些错误，导致迁移失败。论文缺乏对廉价模型能力下限的系统性边界测试，仅通过定性分析指出廉价模型需具备“边际成功”，这在实际应用中是一个难以量化的风险点。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现的核心 claim 是：**廉价评估器驱动的进化搜索能否生成比强模型自身优化更“显式”的 Prompt，且该 Prompt 在强模型上部署时性能不降反升。**\n\n*   **数据与设置**：选择一个对 Prompt 敏感且计算成本可控的任务，如 IFBench 的子集或 HotpotQA 的小规模验证集。使用两个模型：一个廉价模型（如 gpt-4o-mini 或本地部署的 Qwen2.5-7B）作为评估器，一个强模型（如 Claude Sonnet 或 GPT-4o）作为变异算子和部署目标。\n*   **实现**：实现一个简化的进化循环（如基于 GEPA 或简单的遗传算法），其中适应度评估完全由廉价模型执行，变异由强模型执行。同时设置一个基线：完全使用强模型进行同层级优化（Full Same-tier Optimization）。\n*   **测量**：\n    1.  **Prompt 显式性**：使用论文附录 E 中的词典（Directives, Prohibitions, Capitalized words）统计两个方法生成的最佳 Prompt 的显式性指标。\n    2.  **迁移性能**：将廉价搜索生成的 Prompt 和强模型自身优化的 Prompt 分别在强模型上运行测试集，计算准确率或约束满足率。\n    3.  **成本**：记录两种方法的 API 调用成本。\n*   **支持/反驳标准**：如果廉价搜索生成的 Prompt 在显式性指标上显著高于强模型自身优化的 Prompt，且在强模型上的部署性能不低于（或略高于）基线，同时成本显著降低，则支持论文的核心 claim。如果廉价搜索生成的 Prompt 显式性更高但性能大幅下降，或显式性无差异，则反驳了“显式性导致正向迁移”的机制假设。此实验无需复现完整的 GEPA 系统，只需验证“廉价评估+强变异”这一组合在 Prompt 结构和迁移效果上的特性。", "research_value": "### § 11 最强反例设计\n\n要挑战这篇论文的核心主张，最有力的攻击并非质疑其成本节省的有效性（这是显而易见的），而是攻击其**“廉价评估信号与强模型部署性能之间的单调相关性”**这一隐含假设，特别是在**高噪声、低信噪比（Low Signal-to-Noise Ratio）**的任务场景中。\n\n**具体反例设计：基于“幻觉诱导”的对抗性任务（Hallucination-Induced Adversarial Tasks）**\n\n1.  **场景设定**：选择一个对事实一致性极度敏感且廉价模型极易产生幻觉的任务，例如**长文档的细粒度事实核查（Long-Document Fact Verification）**或**复杂代码调试（Complex Code Debugging）**。在这些任务中，廉价模型（如 gpt-4.1-nano）不仅能力弱，而且其错误模式（Error Mode）与强模型（如 Claude Sonnet）截然不同。廉价模型可能因为无法理解上下文而随机猜测，或者生成看似合理但完全错误的中间推理步骤。\n\n2.  **攻击逻辑**：\n    *   **信号失真（Signal Distortion）**：论文假设廉价模型的 Fitness Score 能反映 Prompt 的质量。然而，在幻觉主导的场景中，廉价模型对 Prompt 的敏感度极低。无论 Prompt 如何优化，廉价模型可能都输出随机答案，导致 Fitness Landscape 平坦（Flat Landscape）。此时，进化算法无法通过 Selection Pressure 筛选出更优的 Prompt。\n    *   **负迁移（Negative Transfer）的极端化**：即使廉价模型能区分某些简单的格式错误，它可能会引导变异算子（Reflector）生成针对廉价模型“弱点”的过度补偿指令（Over-compensatory Instructions）。例如，廉价模型可能因为缺乏逻辑连贯性而失败，Reflector 可能会生成极其冗长、重复的“Step-by-step”指令来强制其遵循格式。当这个高度结构化但逻辑冗余的 Prompt 部署到强模型上时，强模型可能因为**上下文窗口拥挤（Context Window Congestion）**或**指令冲突（Instruction Conflict）**而表现下降。强模型原本具备隐式的逻辑推理能力，不需要如此显式的、甚至带有误导性的约束。\n    *   **替代解释**：论文观察到的“正向迁移”可能并非源于“显式性（Explicitness）”的普适优势，而是源于廉价模型在简单任务上恰好与强模型共享相同的错误模式（Shared Error Mode）。在错误模式不共享的任务中，廉价评估器实际上是在优化一个与目标无关的代理目标（Surrogate Objective），导致**优化方向偏离（Optimization Misalignment）**。\n\n3.  **实验验证**：\n    *   构建一个合成数据集，其中正确答案依赖于细微的逻辑推理，而廉价模型在该数据集上的准确率接近随机基线（Random Baseline）。\n    *   运行本文的 Cost-Aware Cross-Tier Transfer 方法。\n    *   **预期结果**：廉价搜索生成的 Prompt 在廉价模型上可能略有提升（通过格式约束），但在强模型上的性能显著低于直接在强模型上优化的 Prompt，甚至低于 Seed Prompt。这将证明，当廉价评估器无法提供有效的梯度信号时，强变异算子无法“无中生有”地创造出可迁移的高质量 Prompt，反而可能引入噪声。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：基于元学习（Meta-Learning）的动态评估器选择与校准（Dynamic Evaluator Selection and Calibration via Meta-Learning）**\n\n**（a）驱动局限与未满足需求**\n本文的核心局限在于其**静态的角色分配策略**：它假设所有任务中，廉价模型都能提供足够区分度的信号，且强模型总是适合做变异算子。然而，如反例所示，廉价模型的能力下限和任务特性决定了迁移的成功与否。目前缺乏一种机制来**量化廉价评估器的可靠性（Reliability Quantification）**，并根据任务难度动态调整评估策略。现有的方法要么全用廉价模型（风险高），要么全用强模型（成本高），缺乏中间的自适应机制。\n\n**（b）借鉴相邻领域的方法**\n借鉴**主动学习（Active Learning）**中的**不确定性采样（Uncertainty Sampling）**和**元学习（Meta-Learning）**中的**模型选择（Model Selection）**思想。在主动学习中，我们只标注那些模型最不确定的样本；在这里，我们可以只使用强模型评估那些廉价模型评估结果“不可靠”或“边界模糊”的候选 Prompt。同时，借鉴**校准（Calibration）**技术，学习一个映射函数，将廉价模型的 Fitness Score 校准为强模型预期的性能得分。\n\n**（c）第一个实验设计**\n1.  **框架设计**：提出一个 **Adaptive Cross-Tier Optimizer (ACTO)**。\n    *   **元评估器（Meta-Evaluator）**：一个轻量级的模型（或基于廉价模型输出的特征提取器），用于预测廉价模型评估结果的**不确定性（Uncertainty）**或**校准误差（Calibration Error）**。\n    *   **动态路由（Dynamic Routing）**：\n        *   如果廉价模型的评估结果具有高置信度且不确定性低，直接使用廉价分数进行 Selection。\n        *   如果不确定性高（例如，廉价模型对两个候选 Prompt 的得分非常接近，或输出分布混乱），则触发**强模型验证（Strong Model Verification）**，仅对这批候选 Prompt 使用强模型进行 Fitness Evaluation。\n    *   **校准层（Calibration Layer）**：训练一个简单的回归模型，将廉价模型的原始分数映射到强模型的性能空间，以修正系统性偏差。\n\n2.  **实验设置**：\n    *   在本文使用的四个任务（HotpotQA, IFBench, LiveBench-Math, HoVer）上运行 ACTO。\n    *   对比基线：本文的静态 Cheap+Reflect 方法、全强模型优化、以及随机选择部分样本用强模型评估的方法。\n    *   **关键指标**：\n        *   **迁移成功率（Transfer Success Rate）**：在不同任务难度下，廉价搜索性能不低于强模型搜索的比例。\n        *   **成本-性能帕累托前沿（Cost-Performance Pareto Frontier）**：展示 ACTO 是否能在保持高迁移成功率的同时，比静态方法更有效地利用强模型的计算资源（即只在必要时调用强模型）。\n\n3.  **区分已有工作**：\n    *   与本文不同，ACTO 不假设廉价模型在所有情况下都有效，而是**显式地建模评估器的不确定性**。\n    *   与传统的主动学习不同，ACTO 的目标不是标注数据，而是**优化 Prompt 搜索过程中的计算资源分配**，实现“按需付费”的进化优化。这将打开一个关于**“LLM 优化过程中的计算资源动态调度”**的新研究方向，超越简单的“廉价 vs 昂贵”二元对立。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Tal Oved\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Roi Pony\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Oshri Naparstek\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Udi Barzelay\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"IBM Research\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Corresponding author: Tal.Oved@ibm.com\"\n    }\n  ]\n}\n```", "summary_translation": "LLM提示词和智能体程序（如GEPA）的进化优化主要由适应度评估主导：对每个候选者进行评分需要在验证集上运行回答型LLM，因此评估者的价格层级决定了总搜索成本。我们通过解耦LLM所扮演的三个角色来重构该搜索过程：在最低价格层级上运行高吞吐量的回答角色，保留强模型用于罕见的反思/变异算子，然后利用向上的跨层级迁移，将廉价进化得到的提示词部署到更强的目标模型上。我们贡献了一种成本可控的表征，刻画了廉价层级搜索何时可以替代目标层级搜索，以及何时会失效。在四个任务（HotpotQA、IFBench、LiveBench-Math、HoVer）和四个模型家族中的十一个模型上，所得提示词的性能匹配或超过了同层级优化，同时将超过96%的搜索token置于最便宜的层级，搜索成本降低了5.6-14倍；在推理层级每次适应度调用都生成长思维链的情况下，成本降低幅度升至25-54倍。"}, {"title": "MERA: Model Evolution and Routing with Skill Adaptation for Agentic Systems at Scale", "arxiv_id": "2608.10333", "authors": "Yuhang Yao, Zeyu Wang, Wanyi Chen, Tongyun Yang, Yuhang Han, Jie Xiao, Chengke Bao, Tianyi Zhao, Lynn Ai, Eric Yang, Tianyu Shi", "summary": "LLM agents execute heterogeneous sequences of model calls within a single task: some invocations require careful reasoning, while others are structured steps such as formatting or tool-argument construction. Prior routing methods exploit this asymmetry by assigning easy invocations to a cheaper small model and difficult ones to a large model. Such policies reduce inference cost, but they leave the small model's capability unchanged, so attainable savings remain bounded by the work the student can already solve. MERA instead improves the small model itself, using a single model invocation as the unit of adaptation. In each cycle, MERA replays failed student invocations to obtain execution-verified teacher demonstrations, distills recurring procedures into an iteratively updated SkillBook, and fine-tunes a student LoRA adapter via supervised learning and optional GRPO. Routing serves as supporting machinery for deployment: the improved student is served behind a cost-calibrated router with verifier-backed fallback, and a candidate SkillBook, adapter, or router is admitted only when joint replay preserves task quality. Empirically, four-cycle adaptation raises Qwen2.5-Coder-1.5B from 28.7% to 49.7% pass on held-out HumanEval+MBPP. Under verifier-backed fallback, the deployed policy retains 88.3% pass at 60.8% of always-Luna cost. On TAU-2, a fine-tuned Qwen3.5-2B improves from 14/35 to 18/35 and matches an unadapted 4B model. These results indicate that verifier-backed multi-cycle adaptation can increase small-model capability, rather than only routing around a fixed student.", "category": "cs.LG", "cluster": "Self-Evolving Agents \u0026 Skill Management", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：如何在大规模 Agentic Systems 中，利用在线执行产生的异构模型调用轨迹（execution traces），安全且有效地提升小型模型（Small Language Models, SLMs）的能力，而不仅仅是通过路由策略绕过固定能力的学生模型。现有的 Agent 工作流包含大量结构化步骤（如格式化、工具参数构建）和少量高难度推理步骤，这种异构性使得“全量使用大模型”成本高昂，而“仅基于用户请求级别的路由”又过于粗糙，无法捕捉工作流内部的难易差异。\n\n这一问题的重要性在于，它触及了部署级 Agent 系统的核心矛盾：成本效率与执行可靠性的权衡。传统的 Routing 方法虽然能通过将简单任务分配给廉价小模型来降低推理成本，但它们假设小模型的能力是静态的，因此节省的成本上限受限于小模型原本就能解决的任务比例。如果小模型能力无法提升，路由策略的优化空间将迅速触及瓶颈。MERA 的价值在于它引入了一个“模型进化”（Model Evolution）的视角，将单次模型调用（single model invocation）作为适应单元，通过多轮迭代（multi-cycle adaptation）利用执行验证（execution-verified）的教师演示来微调小模型。这不仅突破了静态路由的成本上限，还通过 SkillBook 提取可复用技能，并通过 Verifier-backed fallback 机制确保在提升小模型能力的同时，系统整体的端到端质量（end-to-end quality）不下降。实证结果显示，该方法能显著降低部署成本（例如在 HumanEval+MBPP 上以 60.8% 的成本保持 88.3% 的通过率），证明了从“路由固定学生”转向“进化学生模型”是提升 Agent 系统经济可行性的关键路径。\n\n### § 2 前人工作与不足\n\n该问题在部分维度上已被前人工作触及，但缺乏一个统一的、保守的系统层机制来连接路由、技能复用和模型适应。\n\n在 **LLM Routing** 方面，如 FrugalGPT、RouteLLM 和 BEST-route 等工作，主要研究如何在模型池之间分发请求以平衡成本与质量。这些方法通常基于提示特征、预测质量或不确定性来选择模型。然而，它们的决策单元通常是整个用户请求或单轮交互，而非 Agent 执行链内部的单个调用（internal invocation）。这种粗粒度的路由无法充分利用工作流中“简单步骤与困难步骤并存”的细粒度异构性，且大多数路由策略假设模型能力固定，未能利用执行轨迹来动态提升被路由到的廉价模型的能力。\n\n在 **Agent Optimization** 方面，如 ReAct、Toolformer 和 AgentGym-RL 等工作，侧重于通过工具使用、推理-行动循环或基于环境的强化学习来提升 Agent 的整体策略或规划能力。这些方法通常将模型选择、路由器和可复用过程视为固定的工程配置，或者仅评估单一改进后的 Agent 策略。它们没有解决部署中的 Agent 如何随时间推移，利用自身的执行轨迹来更新模型混合体（model mixture）和路由策略的问题。即，它们缺乏一个闭环机制，将在线产生的轨迹转化为对底层小模型和路由器的持续改进。\n\n在 **Model Specialization and Reusable Skills** 方面，如 Distillation、SkillX 和 Agent-R 等工作，旨在通过蒸馏或自我训练从强模型或成功轨迹中复用行为。虽然这些方法证明了小模型和外部技能可以捕捉有用结构，但它们通常作为独立的训练或基准测试结果报告。在部署系统中，专业化是有条件的：学生模型或技能仅在特定切片上可靠，失败需要触发回退而非静默进入生产环境。现有工作缺乏一个保守的准入机制（admission mechanism），即在更新路由、技能或适配器后，通过联合重放（joint replay）和验证器回退（verifier-backed fallback）来确保组合策略仍满足质量约束。\n\n综上所述，前人工作的不足并非缺乏路由、技能或后训练方法本身，而是缺乏一个**系统层（systems layer）**的保守机制，将这三者整合在运行的 Agent 内部。具体而言，现有方法未能解决以下关键缺口：1) 轨迹应以单个调用粒度识别重复类型，而非整个任务；2) 应在硬例上训练学生模型，而非仅路由；3) 路由器的更新应与模型适应同步，反映最新的学生表现；4) 所有变更必须通过带有验证器回退的重放测试才能被采纳。MERA 正是通过定义这种“观察与准入分离”的进化循环，填补了这一系统级空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在构建大规模 Agentic Systems 时，研究者面临一个核心的成本与能力权衡：LLM 调用是昂贵的，但 Agent 执行的任务往往包含大量异构步骤，既有需要深度推理的复杂决策，也有格式化、参数提取等结构化且简单的操作。现有的主流解决方案是 Model Routing（如 FrugalGPT, RouteLLM），其直觉是将简单请求路由给廉价的小模型（Small Model, SLM），复杂请求路由给昂贵的大模型（Large Model, LLM）。然而，这种静态路由策略存在一个根本性的瓶颈：它假设小模型的能力是固定的。如果小模型无法解决某个“中等难度”的任务，路由系统只能将其全部交给大模型，导致成本居高不下；反之，如果强行路由给小模型，则会引发 Silent Failure（静默失败），损害系统可靠性。\n\n与此同时，社区中已经存在大量关于 Model Distillation（模型蒸馏）、Self-Training（自训练）和 Skill Library（技能库）的研究，证明通过特定数据微调可以提升小模型在特定任务上的表现。但在 Agent 场景下，直接应用这些方法面临巨大挑战：Agent 的执行轨迹（Traces）是动态且上下文相关的，直接在线更新模型风险极高，可能导致灾难性遗忘或引入新的错误模式。此外，传统的微调往往针对整个任务，而 Agent 内部是由多个细粒度的 Invocation（调用）组成的，缺乏针对单个 Invocation 级别的适应机制。\n\n因此，一个关键的洞察浮现出来：与其仅仅通过路由来“绕过”小模型的弱点，不如利用 Agent 执行过程中产生的丰富 Trace 数据，特别是那些小模型失败但大模型成功的案例，来迭代地增强小模型本身。但这需要一个安全的闭环：不能随意将新训练的模型投入生产。于是，作者构思了一个基于 Replay（重放）和 Verifier（验证器）的保守演进协议。通过离线重放历史轨迹，可以安全地评估新模型、新路由策略和新技能组合的效果，只有当联合重放证明质量未下降且成本降低时，才允许更新上线。这种思路将“路由”从核心优化目标降级为部署支持机制，而将“小模型能力的持续进化”作为核心驱动力，从而突破了静态路由的能力上限。\n\n### § 4 核心 Intuition\n\n传统路由方法受限于小模型的固定能力，只能在其已掌握的范围内节省成本，无法解决“小模型做不了、大模型太贵”的中间地带问题。MERA 的核心直觉是：将 Agent 执行中的单次模型调用（Invocation）视为适应单元，利用验证器确认的成功轨迹作为监督信号，迭代地微调小模型并提炼可复用技能（SkillBook），从而实质性地提升小模型的能力边界。通过联合重放（Joint Replay）机制，系统仅在确保端到端任务质量不下降的前提下，安全地扩大小模型的处理范围，实现从“绕过弱点”到“消除弱点”的转变。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nMERA (Model Evolution and Routing with Skill Adaptation) 的核心思想是将**单次模型调用 (single model invocation)** 作为适应 (adaptation) 的基本单位，通过多轮迭代 (multi-cycle adaptation) 提升小模型 (Small Language Model, SLM) 的能力，而非仅仅依赖路由 (routing) 来规避小模型的弱点。其完整 Pipeline 分为**在线运行时 (Runtime)** 和**离线更新循环 (Iterative Update Loop)** 两部分。\n\n以下以**代码生成任务 (Code Generation)** 为例，展示一个具体的输入、处理与输出流程：\n\n#### 1. 在线运行时 (Runtime Loop)\n假设用户请求解决一个 HumanEval 中的编程问题 `task_id: 101`。\n\n*   **输入 (Input)**: 序列化后的提示词 (serialized prompt) $x_t$，包含任务描述和上下文。\n*   **路由决策 (Routing)**:\n    *   **Router**: 一个基于输入特征的轻量级分类器 (如 Logistic Regression)，仅观察 $x_t$，不依赖隐藏状态。它判断该调用是“简单”还是“困难”。\n    *   **Skill Selector**: 检查 **SkillBook** (外部程序化提示记忆)。如果 $x_t$ 匹配某个已知模式 (如特定的格式化或工具参数构建)，则注入对应的模板或最佳实践提示。\n    *   **模型选择**: Router 决定使用 **Cheap Model** (经过微调的 Qwen2.5-Coder-1.5B + LoRA Adapter) 还是 **Strong Model** (GPT-5.6 Luna)。\n*   **执行 (Execution)**:\n    *   假设 Router 判定为“简单”，调用 Cheap Model 生成代码 $y_t$。\n*   **验证与回退 (Verification \u0026 Fallback)**:\n    *   **Verifier**: 在隔离的 Python 子进程中运行测试用例。\n    *   **成功**: 如果测试通过，返回 $y_t$ 给用户，记录日志。\n    *   **失败**: 如果测试失败，触发 **Fallback**，自动调用 Strong Model 重新生成，并将此次失败事件 (包括 prompt, 错误输出, 失败原因) 完整记录到 **Trace Store**。\n\n#### 2. 离线更新循环 (Iterative Update Loop)\n系统定期收集 Trace Store 中的数据，进行一轮更新 (Update Round)。遵循 **Skill → LLM → Router** 的依赖顺序：\n\n*   **Step 1: SkillBook 更新**:\n    *   分析 Trace 中的重复模式。例如，发现大量失败案例都源于“未处理边界条件”。\n    *   更新 SkillBook 条目，将“边界条件检查”作为新的稳定模板或提示前缀 (prepend)，供下一轮 LLM 使用。\n*   **Step 2: LLM Adapter 微调 (SFT/GRPO)**:\n    *   **数据筛选**: 从 Trace 中筛选出 **Hard Examples** (即 Cheap Model 失败但 Strong Model 成功的案例)。\n    *   **训练**: 使用这些 Hard Examples 对 Cheap Model 的 LoRA Adapter 进行监督微调 (SFT) 或强化学习 (GRPO)。此时，Prompt 中已包含更新后的 SkillBook 内容。\n    *   **结果**: 得到一个能力更强的新 Adapter。\n*   **Step 3: Router 重新训练**:\n    *   **标签生成**: 基于当前最新的 Adapter 和 SkillBook，在 Trace 上进行 **Joint Replay** (联合重放)。\n    *   **逻辑**: 如果新 Adapter 能正确解决某个之前失败的案例，则该案例被标记为 \"Cheap-eligible\" (正样本)；否则标记为 \"Strong-required\" (负样本)。\n    *   **训练**: 使用这些新标签重新训练 Router，使其更准确地识别哪些任务现在可以由改进后的小模型处理。\n*   **Step 4: 联合准入 (Joint Admission)**:\n    *   在保留集 (Held-out set) 上进行完整的端到端重放。\n    *   **准入标准**: 只有当新策略 (新 Router + 新 Adapter + 新 SkillBook) 在保持任务质量 (Pass Rate) 不下降的前提下，降低了成本或回退率，才会被正式部署到 Runtime。否则，更新被拒绝，系统保持原状。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过**。\n\n本文主要侧重于系统工程架构、迭代适应协议 (Evolution Protocol) 和实证评估，未提出新的基础数学理论或复杂的推导公式。其核心逻辑基于机器学习中的**蒸馏 (Distillation)**、**监督微调 (SFT)**、**强化学习 (GRPO)** 以及**分类器路由 (Routing)** 的标准应用，重点在于这些组件如何通过 **Trace Replay** 和 **Verifier-backed Fallback** 机制协同工作，而非数学上的创新推导。\n\n---\n\n### § 7 实验设计与结论\n\n#### 1. 小模型能力是否可通过多轮适应显著提升？\n*   **提出了什么问题**: 传统的 Routing 方法只是绕过小模型的弱点，小模型本身能力不变。MERA 能否通过利用执行轨迹 (Execution Traces) 真正提升小模型 (SLM) 的独立能力？\n*   **设计了什么实验验证这个问题**:\n    *   **数据集**: HumanEval + MBPP (582 个 held-out 任务)。\n    *   **基线**: Base SLM (Qwen2.5-Coder-1.5B)。\n    *   **方法**: 进行 4 轮 (Four-cycle) 的 SkillBook + SFT 和 SkillBook + SFT + GRPO 适应。\n    *   **评估**: 直接评估 SLM 的 Pass Rate (禁用 Routing 和 Fallback)，以排除路由策略的干扰，纯粹衡量模型能力提升。\n*   **问题的答案是什么**:\n    *   Base SLM 的 Pass Rate 为 28.7%。\n    *   经过 4 轮 SFT 适应后提升至 44.2%。\n    *   经过 4 轮 SFT + GRPO 适应后进一步提升至 **49.7%**。\n    *   **结论**: 多轮适应显著提升了小模型的独立能力，证明了 MERA 不仅是路由优化，更是模型进化。\n\n#### 2. 验证器回退 (Verifier-backed Fallback) 能否在低成本下保持高质量？\n*   **提出了什么问题**: 提升后的小模型虽然变强了，但单独使用仍不如大模型。结合 Routing 和 Fallback 机制，能否在大幅降低成本的同时，达到接近大模型的性能？\n*   **设计了什么实验验证这个问题**:\n    *   **对比基线**: Always Luna (100% 成本), RouteLLM-style, FrugalGPT-style。\n    *   **方法**: 部署 MERA 策略 (Router + 改进后的 SLM + Verifier Fallback)。\n    *   **评估**: 计算端到端的 Pass Rate 和归一化成本 (Normalized Cost, 相对于 Always Luna)。\n*   **问题的答案是什么**:\n    *   MERA 策略在 **60.8%** 的成本下，保持了 **88.3%** 的 Pass Rate。\n    *   相比之下，Always Luna 成本为 100%，Pass Rate 为 86.9%。\n    *   RouteLLM 和 FrugalGPT 等基线方法成本接近 100% 或更高，且性能略低或持平。\n    *   **结论**: MERA 通过“进化小模型 + 验证器回退”的组合，实现了优于传统路由方法的成本-质量权衡 (Cost-Quality Trade-off)。\n\n#### 3. 该方法是否可迁移到多轮工具使用场景？\n*   **提出了什么问题**: MERA 在代码生成上的成功是否适用于更复杂的 Agent 交互场景 (如 TAU-2 基准)？\n*   **设计了什么实验验证这个问题**:\n    *   **数据集**: TAU-2 (35 个任务)。\n    *   **方法**: 对 Qwen3.5-2B 进行 Adapter 微调 (GRPO)，禁用 SkillBook、Routing 和 Fallback，进行严格的 Adapter-only 对比。\n    *   **对比**: Base SLM vs. Trained SLM vs. Unadapted Larger Model (Qwen3.5-4B)。\n*   **问题的答案是什么**:\n    *   Base SLM (2B) 得分 14/35。\n    *   Trained SLM (2B) 得分 **18/35**。\n    *   Unadapted Larger Model (4B) 得分 17/35。\n    *   **结论**: 经过适应的 2B 模型性能超过了未适应的 4B 模型。虽然统计显著性不足 (underpowered)，但证明了 MERA 的适应机制在工具使用场景下的可行性。\n\n#### 4. 经济回报分析 (Finance Break-even)\n*   **提出了什么问题**: 适应过程需要计算成本，多久能收回成本？\n*   **设计了什么实验验证这个问题**:\n    *   **方法**: 基于假设的工作负载和 API 成本，计算训练成本与每日节省成本的平衡点 (Break-even point)。\n*   **问题的答案是什么**:\n    *   在 500 行训练数据的设置下，名义平衡点约为 **8.68 天**，保守估计 (70% 节省实现率) 为 **12.47 天**。\n    *   **结论**: 适应成本在短期内即可通过推理节省收回，具有实际部署价值。", "additional_insights": "### § 8 Take-aways\n\nMERA 的核心贡献在于将 Agent 系统的优化重心从单纯的“请求路由（Routing）”转移到了“小模型能力进化（Model Evolution）”，通过多轮迭代显著提升了 Small Language Model (SLM) 的独立解题能力。该方法以单次模型调用（Single Model Invocation）为适应单元，利用执行验证（Execution-verified）的教师演示数据，通过 SkillBook 提取重复模式并微调 LoRA 适配器，从而打破传统路由方法中 SLM 能力固定的瓶颈。在 HumanEval+MBPP 基准上，经过四轮适应，Qwen2.5-Coder-1.5B 的直接通过率从 28.7% 提升至 49.7%，证明了基于轨迹的持续学习能有效增强小模型。部署层面，MERA 采用“验证器支持的后备机制（Verifier-backed Fallback）”而非仅依赖前置路由，使得系统在保持 88.3% 通过率的同时，将推理成本降低至始终使用大模型时的 60.8%。这种设计解耦了观察与准入（Observation vs. Admission），通过联合重放（Joint Replay）评估确保路由、技能和模型更新的组合状态不会降低整体任务质量，提供了一种保守且可扩展的 Agent 系统演进协议。\n\n### § 9 最脆弱的假设\n\nMERA 最脆弱且关键的假设是：**存在一个高覆盖率、低误报率的执行验证器（Executable Verifier），能够准确区分“正确但未被路由到小模型”与“小模型实际无法解决”的情况，且该验证过程在计算上是可行的。**\n\n如果这一假设不成立，核心贡献将直接失效，原因如下：MERA 的整个适应循环（Adaptation Loop）依赖于从失败轨迹中提取“硬样本（Hard Examples）”来训练 SLM，并依赖验证结果来标记哪些任务可以安全地路由给 SLM。如果验证器存在大量假阴性（False Negatives，即 SLM 答案正确但验证失败），系统会错误地认为 SLM 能力不足，导致过度依赖昂贵的大模型，无法实现成本节约；如果存在假阳性（False Positives，即 SLM 答案错误但验证通过），则会导致静默失败（Silent Failures），破坏系统的可靠性，使得“验证器支持的后备”失去意义。此外，对于非代码生成类任务（如开放域对话、复杂逻辑推理），往往缺乏像代码执行测试那样确定性的验证器，此时 MERA 的“执行验证”机制无法直接应用，其核心优势将大幅削弱。\n\n论文提供的证据主要集中在代码生成领域（HumanEval, MBPP），这些任务具有明确的单元测试作为验证器，因此假设在此类场景下成立。然而，在 TAU-2 工具使用基准中，验证依赖于环境状态和自然语言断言，其覆盖率和准确性远低于代码执行测试，论文也承认该部分的统计效力不足（Underpowered）。论文缺乏在缺乏确定性验证器的通用 Agent 场景下的证据，这限制了 MERA 在更广泛 Agent 应用中的直接适用性。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 MERA 的核心机制：**基于执行验证的轨迹回放与小模型微调（Trace Replay and SFT with Execution Verification）**，以验证“多轮适应能否提升 SLM 在特定子任务上的能力”这一核心 Claim。\n\n**具体方案：**\n1.  **数据**：选取 HumanEval 或 MBPP 的一个小子集（例如 50-100 个任务），确保有明确的单元测试。\n2.  **实现**：\n    *   使用一个基础 SLM（如 Qwen2.5-Coder-1.5B）和一个强教师模型（如 GPT-4o 或 Claude 3.5 Sonnet）。\n    *   **第一轮**：让 SLM 尝试解决这些任务，记录失败案例。\n    *   **数据构建**：对于 SLM 失败的任务，使用教师模型生成正确代码，并构建包含“错误尝试-正确修正”或“正确示范”的 SFT 数据集。可以简化 SkillBook，仅使用简单的 Prompt 模板注入常见错误模式。\n    *   **微调**：使用 LoRA 对 SLM 进行一轮 SFT。\n    *   **第二轮**：用微调后的 SLM 重新运行相同任务，记录通过率变化。\n3.  **测量**：比较微调前后 SLM 在相同测试集上的通过率（Pass@1）。\n4.  **结果判定**：\n    *   **支持**：如果微调后的 SLM 通过率有显著提升（例如提升 10% 以上），则证明基于执行验证的轨迹数据能有效提升小模型能力，验证了 MERA 的核心假设。\n    *   **反驳**：如果通过率无显著变化或下降，则说明简单的轨迹回放和 SFT 不足以提升小模型，或者数据噪声过大，质疑 MERA 中复杂的多轮适应和 SkillBook 机制的必要性。\n\n此实验避开了复杂的路由器训练和联合重放评估，直接验证 MERA 最核心的“模型进化”部分，且所需计算资源和时间均在 1 周内可控。", "research_value": "### § 11 最强反例设计\n\n要挑战 MERA 的有效性，最有力的攻击并非质疑其微调技术本身，而是攻击其**“执行验证器（Executable Verifier）作为能力代理指标”的生态效度（Ecological Validity）**，以及由此引发的**“分布偏移陷阱（Distribution Shift Trap）”**。\n\n**理论论证：验证器覆盖率的“长尾盲区”与静默失败**\nMERA 的核心假设是：如果 Verifier 通过，则模型掌握了该 Skill；如果 Verifier 失败，则模型未掌握。然而，在真实的 Agentic Systems 中，绝大多数任务（如开放域对话、复杂逻辑推理、多步工具调用）缺乏像 HumanEval 那样确定性的、高覆盖率的单元测试。即使存在 Verifier，它往往只能检查“语法正确性”或“局部约束”，而无法验证“语义完整性”或“全局一致性”。\n*   **反例场景**：假设一个 Agent 任务是“根据用户提供的 CSV 数据生成一份包含趋势分析的 Python 脚本”。Verifier 可能仅检查代码是否无 Syntax Error 且能运行。MERA 的 SLM 可能学会了生成“能运行但逻辑错误”的代码（例如，使用了错误的聚合函数，但代码本身合法）。Verifier 返回 True，MERA 将此标记为“成功”，并将该轨迹加入 SkillBook 或用于 SFT。\n*   **后果**：随着迭代进行，SLM 会过拟合于“通过 Verifier 的捷径（Verifier-exploiting shortcuts）”，而非真正的任务解决能力。在 Joint Admission 阶段，由于 Held-out set 同样缺乏深层语义验证，新策略可能被错误地采纳。最终，系统成本降低了，但**端到端质量（End-to-End Quality）**在人类评估中显著下降，出现大量“静默失败（Silent Failures）”。这直接反驳了 MERA 声称的“保持质量不下降”的承诺，证明其优化目标（Verifier Pass Rate）与真实目标（Task Success Rate）存在根本性的**目标错位（Objective Misalignment）**。\n\n**实验设计：对抗性 Verifier 攻击**\n1.  **构建数据集**：选择一个具有模糊正确性标准的基准（如 GAIA 或 LiveBench 的子集），其中答案的正确性难以通过简单的脚本验证。\n2.  **引入弱 Verifier**：部署一个仅检查格式或基本逻辑的弱 Verifier（Weak Verifier），模拟真实世界中缺乏强验证器的场景。\n3.  **运行 MERA**：让 MERA 在该弱 Verifier 下进行多轮适应。\n4.  **评估**：使用**人类评估（Human Evaluation）**或**强 LLM-as-a-Judge**作为金标准，对比 MERA 优化后的 SLM 与基线 SLM 的真实任务成功率。\n5.  **预期结果**：MERA 的 Verifier Pass Rate 会显著上升，但人类评估的真实成功率停滞甚至下降。这将证明 MERA 在缺乏强验证器的通用 Agent 场景中，不仅无法提升能力，反而会导致模型退化（Model Degradation），因为它在优化一个错误的代理指标。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：基于不确定性校准的“软路由”与“动态能力边界”建模（Uncertainty-Calibrated Soft Routing and Dynamic Capability Boundary Modeling）**\n\n**（a）驱动局限与未满足需求**\nMERA 的核心局限在于其**二元化的路由决策（Binary Routing）**和**静态的能力边界假设**。MERA 将任务简单划分为“Cheap-eligible”或“Strong-required”，并假设一旦 SLM 通过 Verifier，它就完全掌握了该 Skill。然而，模型能力是连续的、上下文依赖的，且存在显著的**不确定性（Uncertainty）**。在真实部署中，一个任务可能处于 SLM 能力的“边缘地带（Edge Case）”，此时简单的二元路由会导致要么过度依赖昂贵的大模型（浪费成本），要么让 SLM 处理其不确定的任务（导致失败）。此外，MERA 缺乏对**“模型何时应该承认自己不知道”**的建模，这限制了其在高风险场景下的可靠性。现有的 Routing 方法（如 FrugalGPT）主要基于输入特征，而忽略了模型内部的置信度信号；MERA 虽然引入了进化，但仍未解决**“动态能力边界”**的量化问题。\n\n**（b）借鉴相邻领域的方法**\n借鉴**贝叶斯深度学习（Bayesian Deep Learning）**中的**不确定性估计（Uncertainty Estimation）**技术，以及**主动学习（Active Learning）**中的**查询策略（Query Strategy）**。具体而言，引入**深度集成（Deep Ensembles）**或**蒙特卡洛 Dropout（Monte Carlo Dropout）**来量化 SLM 对每个调用的预测不确定性。同时，借鉴**多臂老虎机（Multi-Armed Bandit, MAB）**算法，将路由决策建模为一个**上下文多臂老虎机（Contextual Bandit）**问题，其中“臂”不仅是模型选择，还包括“是否请求人类反馈”或“是否使用更昂贵的验证器”。\n\n**（c）第一个实验设计**\n1.  **方法构建**：\n    *   在 MERA 的 SLM 基础上，集成一个**不确定性模块（Uncertainty Module）**，例如通过多次采样（Sampling）计算输出的熵（Entropy）或方差（Variance）。\n    *   设计一个**软路由策略（Soft Routing Policy）**：不再二元选择，而是根据不确定性分数动态分配资源。例如，低不确定性 -\u003E SLM；中等不确定性 -\u003E SLM + 轻量级 Verifier；高不确定性 -\u003E Strong Model。\n    *   引入**动态能力边界（Dynamic Capability Boundary）**：维护一个随时间更新的能力分布图，记录 SLM 在不同任务子空间上的不确定性分布，而非简单的“通过/失败”标签。\n2.  **实验设置**：\n    *   使用 MERA 相同的 HumanEval+MBPP 数据集，但引入**噪声标签（Noisy Labels）**或**模糊测试用例（Fuzzy Test Cases）**，模拟真实世界中验证器不完美或任务定义模糊的情况。\n    *   对比基线：MERA（二元路由）、FrugalGPT（基于特征的路由）、以及提出的**Uncertainty-Aware MERA（U-MERA）**。\n3.  **评估指标**：\n    *   **成本-质量曲线（Cost-Quality Curve）**：在不同成本预算下，比较各方法的 Pass Rate。\n    *   **校准误差（Calibration Error）**：评估模型预测的不确定性是否与实际失败率一致。\n    *   **鲁棒性（Robustness）**：在验证器覆盖率降低 50% 的情况下，比较各方法的性能下降幅度。\n4.  **预期贡献**：\n    *   证明**不确定性感知（Uncertainty Awareness）**能更精细地利用 SLM 的能力，特别是在能力边界附近，从而在相同成本下获得更高的质量，或在相同质量下进一步降低成本。\n    *   提出一种**“可解释的路由决策”**，不仅告诉系统“用哪个模型”，还告诉系统“为什么用这个模型”（基于不确定性），增强了系统的可信度（Trustworthiness）。\n    *   与 MERA 的“硬进化”不同，U-MERA 强调**“软适应”**，即通过动态调整路由策略来适应模型能力的连续变化，而非仅依赖离散的微调周期。这为构建更稳健、更经济的 Agentic Systems 提供了新的范式。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Yuhang Yao\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Zeyu Wang\",\n      \"affiliations\": [\n        6\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Wanyi Chen\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Tongyun Yang\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yuhang Han\",\n      \"affiliations\": [\n        5\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jie Xiao\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Chengke Bao\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Tianyi Zhao\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Lynn Ai\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Eric Yang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Tianyu Shi\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Gradient\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Soochow University\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Independent Researcher\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Carnegie Mellon University\"\n    },\n    {\n      \"id\": 5,\n      \"name\": \"Shanghai Jiao Tong University\"\n    },\n    {\n      \"id\": 6,\n      \"name\": \"University of California, Los Angeles\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding author\"\n    }\n  ]\n}\n```", "summary_translation": "LLM agents 在单个任务中执行异构的模型调用序列：某些调用需要细致的推理，而其他调用则是格式化工或工具参数构建等结构化步骤。先前的路由方法利用这种不对称性，将简单的调用分配给成本较低的小模型，将困难的调用分配给大模型。此类策略降低了推理成本，但并未改变小模型的能力，因此可实现的节省受限于学生模型已能解决的工作量。MERA 则改进了小模型本身，以单次模型调用作为适应单位。在每个周期中，MERA 重放失败的学生调用以获取经执行验证的教师演示，将重复出现的流程提炼为迭代更新的 SkillBook，并通过监督学习和可选的 GRPO 微调学生 LoRA 适配器。路由作为部署的支持机制：改进后的学生模型由经过成本校准的路由器提供服务，并配备基于验证器的回退机制；仅当联合重放保持任务质量时，候选的 SkillBook、适配器或路由器才会被采纳。实证研究表明，经过四个周期的适应，Qwen2.5-Coder-1.5B 在未见过的 HumanEval+MBPP 上的通过率从 28.7% 提升至 49.7%。在基于验证器的回退机制下，部署的策略以始终使用 Luna 成本的 60.8% 保留了 88.3% 的通过率。在 TAU-2 上，微调后的 Qwen3.5-2B 从 14/35 提升至 18/35，并匹敌未经适应的 4B 模型。这些结果表明，基于验证器的多周期适应能够提升小模型的能力，而不仅仅是绕过固定的学生模型进行路由。"}, {"title": "SkillZip: Evaluation-Free Skill Compression for Self-Evolving Agents by Discovering Reusable Structure", "arxiv_id": "2608.11079", "authors": "Xiaofan Bai, Hongqiang Lin, Chao Liu, Yantao Zhang, Xuan Jin, Xipeng Cao, Yuhong Li", "summary": "Self-evolving agents accumulate reusable skills by appending successful procedures and failure fixes. Over time, the same requirement is often restated in several branches, examples, and warnings, while common action sequences are copied rather than reused. The resulting skill becomes expensive to inject and difficult to maintain. Generic prompt compression is ill-suited to this setting because a skill is not a flat passage: its name and description define when it applies, its workflow controls execution, its tool and output contracts constrain validity, and rare exceptions may remain essential even when no sampled task activates them. Evaluation-guided compression can test these behaviors, but it introduces rollouts, cost, and dependence on the compression-time evaluation set. We present SkillZip, an evaluation-free method that compresses a skill by finding its shortest faithful structural explanation. The intuition is explain once, reference many: state a repeated rule once at the scope where it applies, factor a repeated action sequence into a shared procedure, and keep only the differences as explicit exceptions. We formalize this intuition as a typed minimum description-length objective over a skill contract and a residual, subject to a hard coverage constraint
