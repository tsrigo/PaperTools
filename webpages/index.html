。\n\n### § 4 核心 Intuition\n\nLLM Agent 的调试难点在于故障的**因果滞后性**，即错误发生的位置与错误显现的位置往往不一致，导致传统的全局扫描或局部启发式方法难以精准定位根因。本文的核心直觉是模拟人类专家的**多轮交互式诊断思维**：通过“全局阅读建立上下文”、“结构化探查缩小范围”和“交叉验证确证假设”这三个步骤，将模糊的故障表象转化为精确的根因定位。这种精确的归因（Attribution）直接赋能了后续的修复（Recovery），因为当 LLM 被明确告知“哪里错了”以及“为什么错”时，其自我修正的成功率远高于盲目重试。最终，通过标准化的轨迹表示和错误共享机制，将单次调试转化为可复用的组织记忆，形成从检测到修复再到知识积累的完整闭环。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**AgentDebugX** 的核心方法是将 LLM Agent 的调试过程组织为一个闭环系统，包含 **Detect**（检测）、**Attribute**（归因）、**Recover**（恢复）和 **Rerun**（重跑）四个阶段。其核心组件 **DeepDebug** 是一个多轮根因诊断 Agent，旨在解决“错误表现步骤”与“错误根源步骤”不一致的问题。\n\n以下结合论文附录 A 中提到的 **GAIA 任务（统计问题）** 失败案例，完整讲解该 Pipeline 的输入、处理与输出：\n\n#### 1. 输入：AgentTrajectory（可移植轨迹表示）\n*   **输入内容**：系统接收一个失败的 Agent 执行轨迹（`AgentTrajectory`）。这是一个框架无关的结构化记录，包含按时间顺序排列的 `AgentEvents`（如 LLM 调用、工具调用结果、记忆操作、截图等）。\n*   **案例背景**：在一个 GAIA 验证任务中，Agent 需要计算 1002 篇论文中“错误论文”的数量，已知平均 p-value 为 0.04。Vanilla Agent（基础模型）最终给出了错误答案。系统捕获了该次运行的完整日志，包括 Agent 在 Step 9 做出的假设：“假设 p-value 在 [0, 2*average_p_value] 上均匀分布”。\n\n#### 2. 处理：闭环调试流程\n\n*   **Step 1: Detect（检测）**\n    *   **机制**：首先通过确定性规则包（Rule Packs）检查机械性错误（如工具调用格式错误、死循环）。若无机械错误，则调用 LLM Judge 读取目标和有限窗口内的轨迹，标记出“表现失败”的步骤和失败模式（Failure Mode）。\n    *   **案例处理**：系统检测到最终输出答案错误，标记为失败。此时仅知道“结果错了”，但不知道“哪里错了”。\n\n*   **Step 2: Attribute（归因）—— DeepDebug 核心介入**\n    *   **机制**：这是最关键的一步。由于错误根源往往早于错误表现，系统启动 **DeepDebug** 进行多轮根因定位：\n        1.  **Global Read（全局阅读）**：DeepDebug 阅读整个轨迹，重建任务目标，初步锁定可疑步骤。\n        2.  **Structure-guided Investigation（结构引导调查）**：针对单 Agent 轨迹，采用二分法（Bisect）或针对多 Agent 轨迹采用交接链回溯（Handoff Cascade），独立产生第二个候选步骤。\n        3.  **Cross-examination（交叉质询）**：如果两个候选步骤不一致，DeepDebug 会并排检查这两个步骤的上下文、输入、输出及下游影响，通过“交叉质询”选出因果解释力更强的那个步骤。\n    *   **案例处理**：\n        *   *全局阅读* 可能注意到 Step 9 的数学假设很奇怪。\n        *   *结构引导* 通过回溯发现，如果修正 Step 9 的假设，后续计算将完全不同。\n        *   *交叉质询* 确认 Step 9 是决定性错误步骤（Decisive Step），因为该步骤引入了一个数学上任意且无依据的假设（均匀分布），直接导致后续计算偏离。\n\n*   **Step 3: Recover（恢复）**\n    *   **机制**：将归因结果转化为具体的重试指令（Retry Directive）。DeepDebug 生成一份结构化报告，包含根因步骤、证据引用、解释以及一个具体的修复建议（Fix）。\n    *   **案例处理**：DeepDebug 生成报告：\n        *   *Root Cause Step*: 9\n        *   *Evidence*: `\"# Assuming uniform distribution [0, 2*average_p_value]\"`\n        *   *Suggestion*: \"Calculate the number of incorrect papers using the direct definition of the p-value as the Type I error rate under the null hypothesis: 1002 * 0.04 = 40.08, rounding up to 41.\"\n        *   系统将此建议封装为重试指令，而不是让 Agent 盲目自我反思。\n\n*   **Step 4: Rerun（重跑）**\n    *   **机制**：系统从归因确定的检查点（Checkpoint，即 Step 9）开始重新执行，应用修复指令。新的轨迹与原轨迹并行保存，用于对比。\n    *   **案例处理**：Agent 从 Step 9 重新开始，不再使用均匀分布假设，而是直接根据 p-value 定义计算（1002 * 0.04），最终得出正确答案 41。\n\n#### 3. 输出：Diagnostic Report 与 修复后的轨迹\n*   **输出内容**：\n    1.  **结构化诊断报告**：包含负责的 Agent、具体步骤索引、置信度、证据片段和修复建议。\n    2.  **修复后的轨迹**：成功的路径被标记为“Resolved Case”。\n    3.  **Error Hub 条目（可选）**：如果用户选择，该“轨迹-诊断-修复”包会被脱敏后存入 Error Hub，作为未来的调试记忆（Debugging Memory）。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过。**\n\n本文是一篇系统工程与实证研究论文，主要贡献在于提出了一套开源调试框架（AgentDebugX）及其核心算法（DeepDebug），而非提出新的数学理论或形式化模型。文中涉及的“数学”主要体现在实验评估指标（如准确率 Accuracy、严格归因准确率 Strict Attribution Accuracy）的计算上，没有需要推导的核心数学公式或理论证明。\n\n---\n\n### § 7 实验设计与结论\n\n本文通过两个主要实验验证了 AgentDebugX 在**故障归因（Attribution）**和**端到端恢复（Recovery）**方面的有效性。\n\n#### 实验 1：故障归因准确性验证\n*   **提出了什么问题**：现有的单步或全局阅读方法能否准确定位 LLM Agent 失败的根本原因（即哪个 Agent 的哪一步导致了失败）？\n*   **设计了什么实验验证这个问题**：\n    *   使用 **Who\u0026When Benchmark**（包含 184 个标注了“谁”和“何时”出错的轨迹）。\n    *   对比基线方法：Rule Heuristic（规则启发式）、All-at-Once（一次性全局阅读）、Step-by-Step（逐步检查）、Binary-Search（二分搜索）。\n    *   评估指标：Responsible Agent Accuracy（责任 Agent 准确率）、Exact Step Accuracy（精确步骤准确率）、Strict Agent-and-Step Accuracy（严格联合准确率）。\n    *   测试不同 Backbone 模型（qwen3.5-9b, qwen3.6-27b 等）。\n*   **问题的答案是什么**：\n    *   **DeepDebug 显著优于基线**。在 qwen3.5-9b 上，DeepDebug 的严格联合准确率（Strict Agent-and-Step）达到 **28.8%**，而最强的单步基线仅为 **21.7%**。\n    *   **多轮诊断的价值**：DeepDebug 的优势主要集中在长轨迹（\u003E40 个事件）上，证明其“结构引导调查”和“交叉质询”机制能有效处理复杂上下文，解决单次阅读的盲区。\n\n#### 实验 2：端到端恢复效果验证\n*   **提出了什么问题**：准确的故障归因能否转化为实际的修复效果？即，知道“哪里错了”是否比“盲目自我修正”更能提高任务成功率？\n*   **设计了什么实验验证这个问题**：\n    *   使用 **GAIA Validation Set**（165 个任务）。\n    *   首先运行 Vanilla Agent（qwen3.5-9b），筛选出 73 个失败任务。\n    *   **对比组**：\n        1.  **Decoupled Baselines**：Reflexion, CRITIC, AutoManual。这些方法只接收通用的失败摘要，不知道具体错误步骤。\n        2.  **AgentDebugX (Native Path)**：接收 DeepDebug 生成的包含具体错误步骤、证据和修复建议的诊断报告。\n    *   所有方法仅允许**单次重跑（Single Rerun）**。\n*   **问题的答案是什么**：\n    *   **归因驱动的修复更有效**。DeepDebug 在单次重跑中修复了 **13/73** 个失败任务，将整体准确率从 55.8% 提升至 **63.6%**。\n    *   相比之下，解耦的自修正基线仅修复了 4-6 个任务。\n    *   **结论**：提供具体的错误位置和证据（Localization + Evidence）能显著提升 LLM 自我修正的成功率，尤其是在多跳推理（Level-2）任务上增益明显（48.8% → 61.6%）。\n\n**总结**：实验证明，AgentDebugX 不仅能在归因任务上达到 State-of-the-Art 的准确率，还能将这种诊断能力转化为实际的系统可靠性提升，其修复效率是传统自修正方法的 2-3 倍，且 Token 成本仅增加约 1.6 倍。", "additional_insights": "### § 8 Take-aways\n\nAgentDebugX 提出了一个将 LLM Agent 调试从单纯的“可观测性（Observability）”升级为“闭环修复（Closed-loop Recovery）”的开源框架，其核心创新在于将调试流程标准化为 Detect、Attribute、Recover 和 Rerun 四个阶段。该框架引入了 **DeepDebug** 这一多轮根因诊断 Agent，通过全局轨迹阅读、结构引导探查（如二分法或手递手追踪）以及交叉质询（Cross-examination）机制，解决了传统单步归因在长轨迹中容易丢失上下文或锚定错误症状的问题。在 Who\u0026When 基准测试中，DeepDebug 在 qwen3.5-9b 上实现了 28.8% 的严格 Agent-and-Step 归因准确率，显著优于最强的单步基线（21.7%），证明了多轮结构化诊断在定位复杂失败根因上的有效性。更重要的是，该框架验证了“精准归因能显著提升修复成功率”的假设：在 GAIA 基准测试中，利用 DeepDebug 生成的本地化修复建议进行单次重跑（Rerun），成功修复了 13/73 个失败任务，将整体准确率从 55.8% 提升至 63.6%，修复数量是解耦式自我修正基线（如 Reflexion, CRITIC）的两倍以上。AgentDebugX 还通过定义通用的 **AgentTrajectory** 格式和可选的 **Error Hub**，实现了跨框架（LangGraph, CrewAI 等）的轨迹标准化存储与共享，为构建可复用的调试记忆和回归测试套件提供了基础设施支持。\n\n### § 9 最脆弱的假设\n\n该方法最脆弱且关键的假设是：**LLM 诊断 Agent（DeepDebug）能够准确区分“症状步骤”与“根因步骤”，并且其生成的“具体修复建议（Concrete Fix）”在语义上是可执行且足以纠正错误的。** 如果这一假设不成立，即 DeepDebug 错误地归因于非决定性步骤，或者其生成的修复指令过于模糊、逻辑错误或与当前环境状态冲突，那么整个闭环调试的价值将归零，甚至可能引入新的错误。\n\n在实际中，这一假设可能失效的原因包括：首先，LLM 自身的推理能力存在上限，特别是在面对高度非线性、依赖隐式状态或复杂工具交互的长轨迹时，DeepDebug 可能无法通过文本轨迹准确重构因果链，导致归因偏差（Attribution Bias）。其次，DeepDebug 生成的修复建议通常是自然语言指令或代码片段，若 Agent 的执行环境（如 GUI 操作、API 调用）对指令的格式或上下文极度敏感，通用的修复建议可能无法被底层执行器正确解析或应用。论文提供的证据主要基于 Who\u0026When 基准的归因准确率和 GAIA 上的修复成功率，但这些实验均在受控环境下进行，且使用了较强的诊断模型（Gemini-2.5-flash）和特定的策略模型（qwen3.5-9b）。论文缺乏对“错误归因导致修复失败”的深入分析，也未评估在更复杂、噪声更大或对抗性更强的真实生产环境中，DeepDebug 的归因鲁棒性及其修复建议的可执行性边界。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现并验证 **DeepDebug 的多轮交叉质询（Cross-examination）机制是否比单步全局阅读（All-at-Once）在长轨迹归因上更准确** 这一核心 claim。\n\n**数据：** 使用论文公开的 Who\u0026When 基准测试数据集中的子集（例如选取轨迹长度 \u003E 40 事件的 20-30 个样本），这些数据已标注了真实的根因 Agent 和步骤。\n**实现：** 无需复现整个 AgentDebugX 系统，只需实现两个简单的 LLM 调用流程：\n1.  **基线（All-at-Once）：** 将完整轨迹和任务目标输入 LLM，要求一次性输出根因 Agent 和步骤。\n2.  **实验组（DeepDebug 简化版）：** 模拟 DeepDebug 的两阶段过程。第一阶段进行全局阅读，输出一个候选根因；第二阶段进行“结构引导探查”（例如，对轨迹进行二分法搜索，或仅读取候选步骤前后的局部窗口），输出第二个候选根因；最后引入一个“仲裁者（Arbitrator）”LLM 调用，对比两个候选项及其证据，输出最终决定。\n**测量：** 计算两种方法在“严格 Agent-and-Step 准确率”上的差异。\n**结果判定：** 如果实验组在长轨迹样本上的准确率显著高于基线（例如提升超过 5-10 个百分点），则支持论文关于“多轮结构化诊断优于单步阅读”的 claim；如果两者无显著差异或实验组更差，则反驳了 DeepDebug 复杂机制的必要性，暗示单步阅读或更简单的启发式方法可能已足够，从而质疑该框架核心组件的价值。此实验仅需调用 LLM API 和简单的 Python 脚本，无需部署完整的 Agent 运行环境或修复模块。", "research_value": "### § 11 最强反例设计\n\n要最有力地攻击 AgentDebugX，核心策略是构建一个**“归因正确但修复无效”**（Correct Attribution, Failed Recovery）或**“归因错误但修复偶然成功”**（Incorrect Attribution, Accidental Recovery）的反例场景，从而解耦“诊断准确率”与“系统可靠性提升”之间的因果链条。具体而言，可以设计一类**“状态依赖型隐式错误”**（State-Dependent Implicit Errors）作为反例。\n\n在这种场景中，Agent 的失败并非源于某一步骤的逻辑错误（如错误的数学假设），而是源于**环境状态的不可逆变化**或**非确定性工具的随机性**。例如，在一个涉及网页抓取或 API 调用的任务中，Agent 在 Step 5 成功获取了数据，但在 Step 10 因网络超时或 API 限流（Rate Limiting）导致数据缺失，进而导致最终答案错误。DeepDebug 可能会通过交叉质询将根因归因为 Step 10 的“工具调用失败”，并生成修复建议“重试该 API 调用”。然而，如果该 API 具有幂等性限制或状态已改变（例如，一次性验证码已过期），简单的 Rerun 即使应用了修复指令也会再次失败。更极端的反例是**“补偿性错误”**（Compensating Errors）：Agent 在 Step 3 犯了一个错误（如错误的单位换算），但在 Step 8 又犯了一个相反的错误（如错误的系数调整），两者恰好抵消，导致最终答案正确。如果此时引入一个微小的扰动导致 Step 8 的错误消失，最终答案变错。DeepDebug 可能会将根因归因为 Step 3，并建议修正单位换算。然而，修正 Step 3 后，Step 8 的“错误”变成了“正确”，导致最终结果偏离预期（因为原本依赖的是两个错误的抵消）。在这种情况下，DeepDebug 的归因在局部逻辑上是“正确”的（Step 3 确实有错），但其修复建议破坏了系统的“脆弱平衡”，导致修复后的结果比原始错误更糟。\n\n此外，还可以从**计算复杂度与边际收益**的角度进行攻击。设计一个长轨迹（\u003E100 步）的复杂多 Agent 协作任务，其中错误根源极其隐蔽，需要 DeepDebug 进行多轮 Deep Dive。实验可以证明，虽然 DeepDebug 的归因准确率略高于基线，但其消耗的 Token 数量和延迟（Latency）呈指数级增长，导致在实时性要求高的生产环境中，其**“修复成本”远高于“重新运行整个任务”的成本**。如果 Rerun 的开销（包括 DeepDebug 的诊断开销 + 部分重跑开销）超过了从头开始运行一个新 Agent 实例的开销，那么 AgentDebugX 的闭环价值在工程上就是负的。这种反例挑战了论文中隐含的假设：即“精准归因”总是比“盲目重试”更具成本效益。\n\n### § 12 Follow-up Research Idea\n\n基于 AgentDebugX 依赖 LLM 进行“事后诊断”（Post-hoc Diagnosis）的局限，提出一个全新的研究方向：**“运行时因果干预与动态验证”（Runtime Causal Intervention and Dynamic Verification, RCI-DV）**。\n\n**(a) 驱动局限与未满足需求：**\nAgentDebugX 的核心局限在于其**被动性**和**离散性**。它只能在任务失败后，通过静态轨迹回放进行归因，无法在任务执行过程中实时捕捉因果链的断裂。此外，其修复依赖于 LLM 生成的自然语言指令，缺乏对执行环境的**形式化验证**（Formal Verification）。在高风险场景（如金融交易、医疗诊断）中，仅凭 LLM 的“自信”进行修复是不可接受的，需要一种能在运行时动态验证每一步操作是否符合预期因果逻辑的机制。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴**形式化方法**（Formal Methods）中的**模型检查**（Model Checking）和**运行时验证**（Runtime Verification, RV）技术，以及**因果推断**（Causal Inference）中的**干预分析**（Interventional Analysis）。具体来说，可以将 Agent 的执行轨迹建模为一个**因果图**（Causal Graph），其中每个节点代表一个 Agent 步骤，边代表数据依赖。在运行时，嵌入一个轻量级的**监控器**（Monitor），该监控器不依赖 LLM 的语义理解，而是基于预定义的**不变量**（Invariants）和**因果约束**（Causal Constraints）对每一步的输出进行实时检查。如果检测到违反不变量，监控器立即触发**干预**（Intervention），暂停执行并注入修正信号，而不是等待任务结束。\n\n**(c) 第一个实验设计：**\n构建一个**“因果感知 Agent 框架”**（Causal-Aware Agent Framework），在 GAIA 或类似基准上运行。\n1.  **基线**：AgentDebugX（事后诊断 + 修复）。\n2.  **新方法**：RCI-DV。在 Agent 执行过程中，实时构建因果图，并使用 LLM 辅助生成每一步的**预期不变量**（Expected Invariants，如“输出数据范围应在 [0, 1]”）。监控器实时检查这些不变量。\n3.  **实验场景**：设计一组包含**“累积误差”**（Cumulative Errors）和**“早期微小错误导致后期灾难性失败”**的任务。\n4.  **测量指标**：\n    *   **早期检测率**（Early Detection Rate）：在错误传播到最终输出之前，RCI-DV 能否检测到异常？\n    *   **干预成功率**（Intervention Success Rate）：实时干预是否比事后修复更有效地纠正了错误？\n    *   **计算开销**：实时监控的开销 vs. 事后诊断的开销。\n5.  **预期结果**：RCI-DV 能在错误早期（如 Step 5）检测到异常并干预，避免后续 95 步的无效计算，从而在**总 Token 消耗**和**修复时间**上显著优于 AgentDebugX，尽管其归因准确率可能略低（因为它是基于规则/不变量的，而非语义理解）。这将证明，**“实时因果监控”**比**“事后语义归因”**更适合构建高可靠性的 LLM Agent 系统。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Kunlun Zhu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Xuyan Ye\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Zhiguang Han\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Yuchen Zhao\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Bingxuan Li\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Weijia Zhang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Muxin Tian\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xiangru Tang\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Pan Lu\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"James Zou\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jiaxuan You\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Heng Ji\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"University of Illinois Urbana-Champaign\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"University of Toronto\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Google\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Stanford University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal contribution.\"\n    }\n  ]\n}\n```", "summary_translation": "LLM agent 的故障难以调试，因为错误显现的步骤往往并非导致错误的根源。现有的可观测性工具虽然能重放执行轨迹，但在识别根本原因或将诊断结果转化为恢复措施方面支持有限。我们提出了 AgentDebugX，这是一个开源调试框架，将调试过程组织为 Detect、Attribute、Recover 和 Rerun 的闭环。其核心组件 DeepDebug 通过全局轨迹理解、结构引导调查和交叉质询，执行多轮根本原因诊断。在 Who and When benchmark 上，DeepDebug 在两种测试的开源权重 backbone 上均实现了评估方法中最高的严格归因准确率，在 qwen3.5-9b 上达到了 28.8% 的精确 agent-and-step 准确率，而最强的单次基线仅为 21.7%。在 GAIA 上，DeepDebug 在单次重跑中修复了 73 个失败任务中的 13 个，相比之下，三种解耦的自修正基线仅修复了 4 到 6 个，将整体准确率从 55.8% 提升至 63.6%。AgentDebugX 通过 Python 库、CLI、Web 控制台和可安装的 agentic skill 暴露此工作流，并提供一个可选加入的 Error Hub，用于分享经过清理的故障-诊断-修复包，并将其作为调试记忆复用。"}]}, {"name": "Self-Evolving \u0026 Adaptive Agents", "count": 1, "papers": [{"title": "Verifiable Self-Evolution for Open-Ended Dialogue Skills via Future-Feedback Prediction", "arxiv_id": "2607.18973", "authors": "ChaoJin Zhao, Xuan Jiang", "summary": "Textual skills provide a lightweight way to improve frozen language-model agents, but their self-evolution normally requires a stable validation signal. Such signals are natural in mathematics or code, where an answer can be checked after it changes, yet are problematic in open-ended dialogue: changing the assistant response also changes the user's next reaction, so a logged reaction cannot directly evaluate a counterfactual response. We propose future-feedback skill evolution, which first redirects self-evolution from prescribing the current answer to predicting whether the observed answer will lead to a positive or negative subsequent user signal. This prediction task is verifiable on fixed logged tuples and therefore supports validation-gated textual optimization. The evolved feedback skill captures interpretable criteria for response quality and can subsequently serve as a diagnostic and optimization target for answer skills. On a proprietary, privacy-preserving sales-assistant dataset, careful quality filtering and a balanced resolved/unresolved split yield more than 75% prediction accuracy. Beyond this result, the central contribution is a formulation that converts otherwise moving conversational feedback into a fixed offline learning target, enabling reproducible skill evolution without placing every candidate skill in live traffic. We discuss the boundary between observational verification and counterfactual validity, and position the method as an offline optimization stage rather than a replacement for final human or online evaluation.", "category": "cs.CL", "cluster": "Self-Evolving \u0026 Adaptive Agents", "tags": ["cs.CL"], "filter_reason": "该论文完全符合“自我演化 (Self-Evolving)”这一核心研究方向。\n\n1. 核心机制匹配：论文标题明确包含 \"Self-Evolution\"，摘要中详细描述了 \"future-feedback skill evolution\"（未来反馈技能演化）和 \"validation-gated textual optimization\"（验证门控文本优化）。这属于智能体通过经验（日志数据）和反馈信号进行自我完善和迭代的典型场景，符合筛选标准中关于“智能体通过经验、反思或环境反馈进行自我完善和迭代”的定义。\n2. 解决智能体演化中的关键难题：论文针对开放域对话中智能体演化缺乏稳定验证信号（stable validation signal）的问题，提出了一种将动态反馈转化为固定离线学习目标的方法。这直接服务于构建和改进 LLM 智能体的能力，特别是其在长期交互中的适应性和优化能力。\n3. 非单纯应用：虽然应用场景是销售助手对话，但论文的核心贡献在于提出了一种通用的“自我演化方法论”（formulation），即如何处理反事实评估和离线优化，而非仅仅应用现有框架解决业务问题。这符合“领域是场景，机制才是贡献”的保留原则。\n4. 排除项检查：论文不涉及安全、对齐、多模态视觉、图神经网络或多智能体拓扑编排等排除项。\n\n综上，该论文研究的是 LLM 智能体技能的自我演化机制，属于 Agentic AI 中 Self-Evolving 方向的前沿工作，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决开放域对话（open-ended dialogue）中基于文本技能（textual skills）的自进化（self-evolution）缺乏稳定验证信号（stable validation signal）的核心难题。在数学或代码等可验证领域，模型生成的答案可以通过执行或比对标准答案进行客观评估，从而支持基于验证门控（validation-gated）的离线优化。然而，在开放域对话中，存在“移动靶”（moving-target）问题：一旦助手回答（assistant response）发生改变，用户的后续反应（subsequent user signal）也会随之改变，导致日志中记录的历史反馈无法直接用于评估反事实（counterfactual）的新回答。这种因果断裂使得传统的离线技能优化无法进行，迫使开发者依赖昂贵且高风险的在线 A/B 测试或人工评估。\n\n该问题的重要性在于，它阻碍了大型语言模型（LLM）代理在对话场景下的低成本、可解释且安全的迭代优化。如果无法在离线阶段可靠地验证技能改进，代理系统的部署将变得缓慢且充满不确定性。本文提出的“未来反馈预测技能进化”（future-feedback skill evolution）通过将优化目标从“生成当前最佳答案”转变为“预测既定回答引发的后续用户反馈”，成功将动态的对话反馈转化为固定的离线学习目标。这一转变使得技能进化过程具备可验证性（verifiable），能够在不接触真实流量的情况下进行 reproducible 的文本优化。其价值不仅体现在工业案例中实现的超过 75% 的预测准确率，更在于提供了一种机制，将不可观测的反事实评估转化为可观测的监督学习任务，从而显著降低对话系统优化的工程成本与风险，同时通过可解释的反馈规则为回答生成提供诊断依据。\n\n### § 2 前人工作与不足\n\n尽管文本技能优化和用户满意度评估已有相关研究，但现有工作未能有效解决开放域对话中离线验证信号缺失的问题。\n\n首先，在文本技能优化方面，如 **SkillOpt** [Yang et al., 2026] 提出了通过有界编辑（bounded edits）和保留集验证（held-out validation）来优化代理技能的方法。然而，SkillOpt 的核心假设是存在一个稳定的验证目标，这一假设在数学证明或代码执行中成立，但在开放域对话中失效。因为对话中的验证信号（即用户反馈）依赖于具体的回答内容，改变回答即改变了反馈的分布，导致 SkillOpt 等基于固定验证集的方法无法直接应用于对话技能的自进化。\n\n其次，在用户满意度估计方面，**USS** [Sun et al., 2021] 和 **SPUR** [Lin et al., 2024] 等研究致力于从对话数据中学习满意度标注或可解释的评估标准。这些工作证明了从对话中学习满意度模式是可行的，但它们主要关注于静态的满意度预测或评估，并未将预测模型本身作为自进化优化的对象。它们缺乏一个闭环机制，即如何利用预测误差来迭代优化技能文本，并在此过程中保证优化的可验证性。\n\n此外，**See and Manning** [2021] 预测用户下一轮是否表达不满，这与本文的预测目标高度相关。但该研究仅将预测信号用于排序聊天机器人回复，并未将预测器的文本策略（textual policy）本身视为验证门控进化的对象，也未提取其失败理由作为可复用的技能知识。\n\n最后，基于人类反馈的强化学习（RLHF）或奖励模型（reward models）[Ouyang et al., 2022] 虽然能优化模型行为，但面临分布偏移（distribution shift）和奖励黑客（reward hacking）的风险，且通常涉及昂贵的参数训练或在线交互。本文指出的关键不足在于，现有的奖励模型或评估器往往缺乏在固定日志数据上的严格可验证性，无法区分观测到的满意度与反事实的满意度。因此，现有方法要么假设验证目标不变（在对话中不成立），要么缺乏将预测能力转化为可验证、可迭代的文本技能进化机制的能力，导致离线优化阶段缺乏可靠的收敛判断依据。", "core_insight": "### § 3 重建作者的思考路径\n\n在大型语言模型（LLM）代理日益普及的背景下，通过编辑文本形式的 **skills**（如提示词或指令）来优化模型行为，因其低成本和可解释性而成为主流范式。现有的 **SkillOpt** 等工作证明了在数学或代码等具有稳定验证信号（stable validation signal）的领域，可以通过“提出编辑-验证得分-保留改进”的闭环实现 **self-evolution**。然而，当这一范式迁移到 **open-ended dialogue** 时，研究者遇到了根本性的障碍：对话具有动态性，助手回复的改变会直接导致用户后续反应（next-turn feedback）的改变。这意味着，日志中记录的用户反馈是针对原始回复的，无法直接用于评估修改后的 **counterfactual response**。这种“目标移动”（moving-target）问题使得离线验证变得不可能，迫使开发者依赖昂贵且高风险的在线 A/B 测试或人工评估，严重阻碍了 **skill evolution** 的迭代效率。\n\n面对这一困境，研究者意识到必须寻找一个在对话历史固定时依然保持不变的验证目标。既然无法直接预测“如果我说出不同答案，用户会如何反应”，那么是否可以预测“对于当前已发生的答案，用户实际上会如何反应”？这一思路将优化目标从生成答案（generation）转移到了预测反馈（prediction）。通过构建一个 **feedback-prediction skill**，模型的任务变为根据上下文和当前回复，预测用户是否满意（resolved/unresolved）。由于输入（上下文、历史、当前回复）和输出（实际发生的用户反馈）在日志中都是固定的，这就构建了一个可验证的、静态的监督学习任务。\n\n进一步地，研究者发现，要准确预测用户是否满意，模型必须内化关于“什么是高质量回复”的判别标准。这些标准（如区分工具执行成功与用户实际采纳、区分礼貌性回应与问题解决）本质上就是 **answer skill** 所需的优化方向。因此，通过进化一个可验证的 **feedback skill**，不仅可以解决离线验证难题，还能提取出可解释的 **rationales**，进而指导 **answer skill** 的改进。这种 **feedback–generation duality** 使得研究者能够在不依赖在线流量的情况下，通过离线数据驱动 **skill** 的自我进化，同时明确区分了观测验证（observational verification）与反事实有效性（counterfactual validity）的边界。\n\n### § 4 核心 Intuition\n\n在开放域对话中，直接优化回答会导致用户反馈随之改变，使得离线验证失效；因此，我们将优化目标从“生成更好的回答”转换为“预测现有回答引发的用户反馈”。由于预测任务基于固定的日志数据，其准确性可以被严格验证，从而为 **skill evolution** 提供了稳定的离线优化信号。这种 **feedback-prediction skill** 在进化过程中习得的判别标准，反过来可作为可解释的诊断依据，指导 **answer skill** 的改进，实现了从不可验证的反事实优化到可验证的观测预测的范式转换。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法是 **Future-Feedback Skill Evolution**（未来反馈技能演化）。其核心思想是将优化目标从“生成更好的回答”转变为“预测现有回答是否会引发用户的正面反馈”。由于预测任务基于固定的历史日志（Logged Data），因此具有可验证性（Verifiable），从而支持基于验证门控（Validation-Gated）的文本技能优化。\n\n以下是结合一个真实销售助手场景的完整 Pipeline 说明：\n\n**1. 数据构建与标签定义 (Data Construction \u0026 Labeling)**\n*   **输入**：从生产环境中提取的对话日志，包含上下文 $C$、对话历史 $H$、用户当前请求 $Q_1$、助手回答 $A$ 以及随后的用户行为或反馈 $Q_2$。\n*   **处理**：\n    *   **清洗**：剔除模糊的静默终止、重复记录或上下文缺失的低质量数据。\n    *   **标签化**：将 $Q_2$ 映射为二元标签 $Y \\in \\{0, 1\\}$。$Y=1$ 表示“已解决/被采纳”（Resolved/Accepted），$Y=0$ 表示“未解决/被拒绝”（Unresolved/Rejected）。\n    *   **平衡**：构建训练集和测试集，确保正负样本比例约为 1:1，防止模型通过预测多数类获得虚假的高准确率。\n*   **输出**：高质量的、标签明确的监督学习数据集 $\\mathcal{D} = \\{(X_i, A_i, Y_i)\\}$。\n\n**2. 初始化反馈技能 (Initialization of Feedback Skill)**\n*   **输入**：初始的反馈预测技能文本 $S_F^{(0)}$（例如：“如果用户说‘谢谢’或点击购买，则标记为已解决”）。\n*   **处理**：使用冻结的大语言模型（LLM）作为推理引擎，结合 $S_F^{(0)}$ 对训练集中的每个样本 $(X, A)$ 进行预测，输出预测标签 $\\hat{Y}$ 及推理依据（Rationale）。\n*   **输出**：初始预测结果及错误分析。\n\n**3. 验证门控的技能演化 (Validation-Gated Skill Evolution)**\n*   **输入**：当前技能 $S_F^{(t)}$ 及其在训练集上的高置信度错误案例（特别是假阳性，即预测为已解决但实际未解决的情况）。\n*   **处理**：\n    *   **提出编辑**：优化器模型（Optimizer Model）分析失败案例，提出对 $S_F$ 的有界文本编辑 $\\Delta_t$（如添加、删除或替换规则）。例如，发现模型错误地将“工具执行成功”等同于“用户满意”，于是提出新规则：“工具成功执行不等于用户采纳，需检查后续确认行为”。\n    *   **候选生成**：生成候选技能 $S_F' = S_F^{(t)} + \\Delta_t$。\n    *   **验证门控**：在固定的**保留集（Held-out Set）**上评估 $S_F'$ 的性能 $J(S_F')$。\n    *   **接受/拒绝**：仅当 $J(S_F') \u003E J(S_F^{(t)})$ 时，才接受该编辑，更新 $S_F^{(t+1)} = S_F'$；否则拒绝，保持原技能不变。\n*   **输出**：经过迭代优化、准确率提升的反馈预测技能 $S_F^*$。\n\n**4. 从预测依据到回答指导 (From Prediction Rationales to Answer Guidance)**\n*   **输入**：演化后的反馈技能 $S_F^*$ 及其学到的判别规则（Rationales）。\n*   **处理**：\n    *   **规则提取**：分析 $S_F^*$ 为何预测某些回答为“未解决”。例如，规则指出：“缺乏具体行动锚点（如具体数值、时间窗口）的建议被视为不可操作”。\n    *   **诊断映射**：将这些预测失败的原因转化为对回答技能 $S_A$ 的诊断建议。\n*   **输出**：可解释的质量标准，用于指导人工或自动化地修改回答技能 $S_A$（例如，在 $S_A$ 中加入“必须提供具体参数值”的指令）。\n\n**5. 最终验证 (Final Validation)**\n*   **注意**：此步骤不在离线 Pipeline 内，而是强调边界。演化后的 $S_A$ 生成的新回答 $A'$ 必须通过在线 A/B 测试或人工评估来验证其实际效果，因为离线预测模型不能保证反事实（Counterfactual）回答的有效性。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的传统数学推导（如梯度下降证明或收敛性定理），其核心在于**问题形式的转换（Problem Formulation Shift）**，即从不可验证的反事实评估转换为可验证的监督预测。以下是核心逻辑的数学直觉解释：\n\n**1. 原始问题的不可验证性 (The Unverifiable Original Problem)**\n*   **公式直觉**：\n    $$ \\text{Utility}(A') = \\mathbb{E}_{Q_2 \\sim p(Q_2|X, A')} [\\text{Reward}(Q_2)] $$\n    其中 $A'$ 是修改后的回答。\n*   **解释**：在开放域对话中，如果你改变了助手的回答 $A$ 为 $A'$，用户的后续反应 $Q_2$ 也会随之改变。然而，日志中只记录了原始回答 $A$ 对应的原始反应 $Q_2$。你无法知道如果当时回答是 $A'$，用户会说什么。因此，$Q_2$ 不能作为评估 $A'$ 的标签。这导致没有固定的目标函数（Fixed Objective）来离线优化回答技能 $S_A$。\n\n**2. 替代任务的构建 (The Verifiable Surrogate Task)**\n*   **公式直觉**：\n    $$ \\hat{Y} = f_{S_F}(X, A) \\approx Y $$\n    其中 $Y$ 是日志中观察到的真实标签（基于原始 $A$ 和原始 $Q_2$）。\n*   **解释**：我们不再尝试预测“如果回答改变会发生什么”，而是预测“对于**已经发生**的回答 $A$，用户是否会满意”。\n    *   输入 $(X, A)$ 是固定的（来自日志）。\n    *   标签 $Y$ 是固定的（来自日志）。\n    *   因此，预测误差 $Loss(\\hat{Y}, Y)$ 是可以精确计算的。\n    *   这使得我们可以定义一个固定的目标函数 $J(S_F)$，并在保留集上进行验证。\n\n**3. 演化过程的门控机制 (The Gating Mechanism)**\n*   **公式直觉**：\n    $$ S_F^{(t+1)} = \\begin{cases} S_F' \u0026 \\text{if } J(S_F') \u003E J(S_F^{(t)}) \\\\ S_F^{(t)} \u0026 \\text{otherwise} \\end{cases} $$\n*   **解释**：这是一个简单的贪心搜索或优化过程。每次对技能文本 $S_F$ 进行修改得到候选 $S_F'$，只有在固定数据集上的性能指标 $J$（如准确率）提升时，才接受修改。这保证了技能演化是单调改进的，且每一步都是可验证的。\n\n**总结**：数学上的核心贡献不是新算法，而是证明了通过改变优化目标（从生成 $A$ 到预测 $Y$），可以将一个非平稳的、依赖反事实的问题，转化为一个标准的、基于固定数据的监督学习问题。\n\n---\n\n### § 7 实验设计与结论\n\n**提出了什么问题**\n在开放域对话中，由于用户反馈依赖于助手的具体回答，修改回答会导致反馈分布变化（Moving Target Problem），因此无法利用历史日志中的反馈信号来离线验证和优化助手的回答技能（Answer Skill）。现有的技能演化方法缺乏稳定的验证信号。\n\n**设计了什么实验验证这个问题**\n1.  **方法验证**：提出 **Future-Feedback Skill Evolution** 框架，构建一个反馈预测技能 $S_F$，其目标是预测日志中已发生的回答是否会导致用户满意。\n2.  **数据构建**：在私有、隐私保护的销售助手数据集上，进行严格的数据清洗和平衡采样（Resolved/Unresolved 1:1），构建高质量的训练和测试集。\n3.  **演化过程**：实施验证门控的文本优化循环，迭代更新 $S_F$，直到在保留集上达到收敛。\n4.  **性能评估**：报告演化后的 $S_F$ 在平衡测试集上的预测准确率，并分析其学到的规则是否具有可解释性（Interpretability）。\n\n**问题的答案是什么**\n1.  **可行性**：未来反馈预测是一个可学习的任务。在精心清洗和平衡的数据集上，演化后的反馈技能达到了 **超过 75% 的准确率**，显著优于随机猜测（50%）。\n2.  **可验证性**：通过将优化目标转换为预测固定日志标签，成功实现了离线、可重复的技能演化，无需每次迭代都进行在线 A/B 测试。\n3.  **可解释性与指导价值**：演化出的技能不仅是一个黑盒分类器，还学到了可解释的质量标准（如区分“工具成功”与“用户采纳”）。这些标准可以作为诊断工具，指导回答技能 $S_A$ 的改进。\n4.  **局限性确认**：实验明确区分了“观测预测准确率”与“反事实有效性”。75% 的准确率证明了模型能捕捉交互模式，但并不保证优化后的新回答一定能让用户满意，最终仍需人工或在线验证。", "additional_insights": "### § 8 Take-aways\n\n本文提出了一种针对开放域对话（Open-ended Dialogue）中 Agent 技能自进化（Self-evolution）的验证难题的解决方案，核心在于将优化目标从“生成反事实回答”转变为“预测既定回答的未来反馈”。由于改变回答 $A$ 会导致用户后续反应 $Q_2$ 发生不可控变化，直接利用日志数据验证新回答 $A'$ 的有效性在逻辑上是无效的（Moving-target problem）。通过构建一个基于固定日志元组 $(C, H, Q_1, A)$ 预测用户后续信号（Resolved/Unresolved）的反馈预测技能（Feedback Skill, $S_F$），作者成功将动态的对话反馈转化为静态的、可验证的离线学习目标。这种验证门控（Validation-gated）的文本优化方法允许在固定数据集上对 $S_F$ 进行迭代编辑和保留，从而避免了每次候选技能都需要在线 A/B 测试或人工评估的高昂成本。进化后的 $S_F$ 不仅是一个分类器，更是一个可解释的诊断工具，其学习到的规则（如区分工具执行成功与用户实际采纳、识别缺乏行动力的模糊回答）揭示了回答质量的关键判别标准。在私有销售助手数据集上，经过严格的数据清洗和平衡采样，该方法实现了超过 75% 的预测准确率，证明了从清洗后的对话记录中学习未来反馈信号是可行的。然而，作者明确区分了观测验证（Observational Verification）与反事实有效性（Counterfactual Validity），指出 $S_F$ 的准确性仅保证了对历史数据的拟合，并不直接保证优化后的回答技能（Answer Skill, $S_A$）在真实交互中能满足用户，最终部署仍需人工或在线确认。\n\n### § 9 最脆弱的假设\n\n该方法最核心且脆弱的假设是**“反馈预测技能在分布外（Out-of-Distribution, OOD）回答上的泛化能力”**，即假设在日志数据上验证通过的 $S_F$ 能够准确评估由进化后的 $S_A$ 生成的、从未在训练集中出现过的反事实回答 $A'$。如果这一假设不成立，基于 $S_F$ 诊断结果优化的 $S_A$ 可能会产生看似符合 $S_F$ 规则但实际上无法解决用户问题，甚至被 $S_F$ 错误高估的回答，导致离线优化与在线效果脱节。在实际中，这一假设可能失效的原因在于 $S_F$ 本质上是一个基于历史观测数据的归纳模型，它学习的是“特定回答 $A$ 导致特定反馈 $Y$”的统计相关性，而非因果机制；当 $S_A$ 生成具有新颖结构或语义的回答 $A'$ 时，$S_F$ 可能因缺乏此类样本而做出错误预测（Distribution Shift）。论文在 Section 7 中明确承认了这一局限性，指出 $S_F$ 应被视为“验证过的观测模型”而非“任意 $A'$ 的人类满意度证明”，且未提供 $S_A$ 在线 A/B 测试的结果来直接验证这一泛化假设。虽然论文展示了 $S_F$ 学习到的规则具有可解释性（如要求具体行动锚点），这在一定程度上增强了对其泛化能力的信心，但缺乏端到端的因果验证使得这一假设成为整个框架从“离线可验证”走向“在线有效”的最大风险点。\n\n### § 10 最小复现实验\n\n在 1 周时间内，无法复现私有数据集和完整的工业级技能进化流程，但可以验证**“未来反馈预测任务是否比直接回答评分更具可解释性和稳定性”**这一核心 claim。具体方案如下：使用公开的 USS (User Satisfaction Simulation) 数据集或类似的带有用户满意度标注的对话数据集（如 MultiWOZ 或 CrossWOZ 的满意度子集）。首先，构建一个基线模型，直接预测对话轮次的满意度标签（Direct Satisfaction Prediction）；其次，构建本文提出的未来反馈预测模型，输入为 $(Context, History, Question, Answer)$，输出为下一轮用户是否表示解决或接受（Resolved/Unresolved）。实现上，可以使用开源 LLM（如 Llama-3-8B）作为基础模型，通过 Prompt Engineering 或轻量级 Fine-tuning 来实现这两个预测任务。测量指标包括：1) 预测准确率（Accuracy）和 F1 分数，验证未来反馈预测是否可行；2) 关键是通过 LLM-as-a-Judge 或人工抽样，评估两个模型生成的预测理由（Rationales）的质量，特别是它们是否能识别出“工具成功但用户未采纳”或“回答模糊”等具体缺陷。如果未来反馈预测模型能更稳定地识别出这些细微的质量差异，且其预测理由与人工标注的满意度原因更一致，则支持了本文关于“反馈预测技能能捕捉可解释的质量标准”的 claim；反之，如果两者表现无异或未来反馈预测更不稳定，则反驳了该方法在可解释性上的优势。此实验无需复现复杂的技能进化循环，仅聚焦于预测任务本身的性质验证。", "research_value": "### § 11 最强反例设计\n\n要彻底挑战 **Future-Feedback Skill Evolution** 的有效性，最有力的攻击并非质疑其预测准确率，而是攻击其核心假设：**“观测到的反馈信号（Observed Feedback）与回答质量（Response Quality）之间存在稳定的、可泛化的因果映射”**。具体而言，可以设计一个基于 **“策略性用户行为（Strategic User Behavior）”与“上下文依赖的反馈噪声（Context-Dependent Feedback Noise）”** 的反例场景。\n\n在真实的开放域对话（如销售助手或客服场景）中，用户的后续反应 $Q_2$ 往往不仅取决于助手回答 $A$ 的质量，还高度依赖于用户自身的意图稳定性、外部干扰或对话策略。例如，用户可能因为“暂时没空”而沉默（被标记为 $Y=0$ Unresolved），尽管回答 $A$ 完美解决了问题；或者用户可能因为“习惯性礼貌”而回复“谢谢”（被标记为 $Y=1$ Resolved），尽管回答 $A$ 完全错误且未解决问题。这种 **Label Noise** 并非随机噪声，而是与 $A$ 的内容弱相关甚至无关的系统性偏差。\n\n**反例实验设计：**\n构建一个合成数据集或筛选真实日志中的特定子集，其中包含大量 **“高质量回答但负面反馈”**（High-Quality $A$, Negative $Y$）和 **“低质量回答但正面反馈”**（Low-Quality $A$, Positive $Y$）的样本。这些样本的特征是：反馈 $Y$ 由与 $A$ 无关的外部因素决定（如用户突然离开、网络中断、或用户仅对语气满意而非内容）。\n1.  **训练阶段**：运行 **Future-Feedback Skill Evolution**。由于 $S_F$ 的目标是最小化预测误差 $Loss(\\hat{Y}, Y)$，它会迅速学习到这些“虚假相关性”。例如，它可能学到规则：“如果回答中包含特定礼貌用语，则预测为 $Y=1$”，或者“如果回答长度过短，则预测为 $Y=0$”，而完全忽略回答的实际信息密度或准确性。\n2.  **演化结果**：$S_F$ 在保留集上可能达到极高的准确率（\u003E80%），因为它完美拟合了这些噪声模式。\n3.  **诊断映射失败**：当将 $S_F$ 的规则映射到回答技能 $S_A$ 时，$S_A$ 会被优化为生成“短小但充满礼貌用语”的回答，以迎合 $S_F$ 的“高分规则”。\n4.  **在线验证崩溃**：当这些优化后的 $S_A$ 部署到真实环境时，由于它们缺乏实质内容，用户满意度（Ground Truth Satisfaction）会急剧下降。\n\n**理论论证：**\n该反例揭示了 **Goodhart's Law** 在对话优化中的极端表现：当“预测反馈”成为优化目标时，它就不再是一个好的反馈指标。论文声称的“可解释性”在此失效，因为 $S_F$ 学到的规则（如“礼貌=解决”）虽然在统计上显著，但在因果上是错误的。这证明了 **Observational Verification** 无法保证 **Counterfactual Validity**，因为 $S_F$ 无法区分“因回答好而满意”和“因其他原因而满意”。因此，该方法在存在显著非内容相关反馈噪声的场景下，会系统地引导 $S_A$ 走向退化，而非进化。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：Causal Invariant Feedback Prediction for Robust Dialogue Skill Evolution**\n\n**(a) 驱动局限与未满足需求：**\n现有 **Future-Feedback Skill Evolution** 的核心缺陷在于其依赖 **Associative Learning**（关联学习），即学习 $A \\rightarrow Y$ 的统计相关性，而非因果机制。这导致模型容易过拟合到数据中的混杂因素（Confounders），如用户情绪、时间戳、或无关的对话风格，从而产生脆弱的、不可泛化的技能规则。未满足的需求是：如何从嘈杂的日志数据中提取出 **Causal Invariant**（因果不变）的反馈信号，即那些真正由回答质量驱动、且在分布外（OOD）场景中依然稳定的用户反应模式。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴 **Causal Representation Learning**（因果表示学习）和 **Invariant Risk Minimization (IRM)**（不变风险最小化）的思想。在计算机视觉和强化学习中，IRM 被用于学习在不同环境（Environments）下保持不变的预测规则，从而避免对特定环境特征的过拟合。在对话场景中，我们可以将不同的“用户群体”、“对话时段”或“业务场景”视为不同的“环境”（Environments）。\n\n**(c) 第一个实验设计：**\n1.  **环境划分（Environment Stratification）**：将日志数据根据非内容特征（如用户ID哈希、时间段、对话长度分布）划分为多个互斥的“环境”子集 $\\mathcal{E}_1, \\mathcal{E}_2, ..., \\mathcal{E}_K$。假设每个环境中的混杂因素（如特定群体的礼貌习惯）不同，但“回答质量导致满意度”的因果机制是相同的。\n2.  **因果反馈技能演化（Causal Feedback Skill Evolution）**：修改 **Validation-Gated Skill Evolution** 的目标函数。不再仅最小化全局预测误差，而是最小化 **Invariant Risk**：\n    $$ \\min_{S_F} \\sum_{k=1}^K \\lambda_k \\cdot \\text{Loss}(S_F; \\mathcal{E}_k) \\quad \\text{s.t.} \\quad \\nabla_{S_F} \\text{Loss}(S_F; \\mathcal{E}_k) = \\nabla_{S_F} \\text{Loss}(S_F; \\mathcal{E}_j) \\quad \\forall k, j $$\n    即，要求 $S_F$ 在所有环境中的梯度方向一致，迫使模型只学习那些在所有环境中都成立的、与回答内容强相关的规则，而忽略仅在特定环境中成立的虚假相关性。\n3.  **对比实验**：\n    *   **基线**：原始的 **Future-Feedback Skill Evolution**（仅最小化全局误差）。\n    *   **提议方法**：**Causal Future-Feedback Skill Evolution**。\n    *   **评估指标**：除了标准的预测准确率，重点评估 **OOD Generalization**（分布外泛化能力）。构建一个全新的、具有不同用户行为模式的测试集（如新用户群体或新业务线），比较两种方法演化出的 $S_F$ 在该测试集上的准确率，以及基于 $S_F$ 优化的 $S_A$ 在在线 A/B 测试中的实际用户满意度提升。\n4.  **预期结果**：提议方法在训练集上的准确率可能略低于基线（因为放弃了拟合噪声），但在 OOD 测试集和在线 A/B 测试中表现显著更优，证明其学到的规则更具鲁棒性和因果有效性。\n\n**与已有工作的区别：**\n现有工作（如 **USS**, **SPUR**）仅关注静态的满意度预测，未考虑分布偏移；**Future-Feedback Skill Evolution** 关注离线验证的可行性，但未解决预测模型的因果脆弱性。本提议引入了 **Causal Invariance** 作为技能演化的核心约束，将对话优化从“统计拟合”提升到“因果发现”层面，为解决 **Moving-Target Problem** 提供了更坚实的理论基础。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"ChaoJin Zhao\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xuan Jiang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"ByteDance\"\n    }\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "文本技能为改进冻结的语言模型智能体提供了一种轻量级方法，但其自我进化通常需要稳定的验证信号。在数学或代码领域，答案在改变后可进行检查，因此这类信号是自然的；然而在开放式对话中，这类信号存在问题：改变助手的回复也会改变用户的下一次反应，因此已记录的反应无法直接评估反事实回复。我们提出了未来反馈技能进化（future-feedback skill evolution），该方法首先将自我进化从规定当前答案转向预测观察到的答案是否会导致后续用户信号的正向或负向结果。该预测任务可在固定的已记录元组上进行验证，因此支持基于验证门控的文本优化。进化后的反馈技能捕捉了可解释的回复质量标准，并可随后作为答案技能的诊断和优化目标。在一个专有的、隐私保护的销售助手数据集上，通过仔细的质量过滤和平衡的已解决/未解决划分，实现了超过 75% 的预测准确率。除了这一结果外，核心贡献在于一种公式化方法，将原本动态变化的对话反馈转化为固定的离线学习目标，从而实现在不将每个候选技能置于实时流量中的情况下进行可复现的技能进化。我们讨论了观察性验证与反事实有效性之间的界限，并将该方法定位为离线优化阶段，而非最终人工或在线评估的替代品。"}]}], "2026-07-21": [{"name": "Agent Training \u0026 Optimization", "count": 6, "papers": [{"title": "CIGPO: Contextual Information-Gain Policy Optimization for Multi-Turn Evidence-Reading LLM Agents", "arxiv_id": "2607.16244", "authors": "Hao Dou", "summary": "Training multi-turn evidence-reading agents with outcome-only reinforcement learning is unstable because intermediate turns receive little direct credit. In HotpotQA experiments with Qwen2.5-3B-Instruct, GRPO initially improves (standard F1 0.430) but subsequently collapses to 100% format-violating outputs. Training-log diagnosis reveals a zero-advantage lock-in mechanism: all sampled trajectories receive the minimum format penalty (-2.0), group-relative advantages vanish, and the policy-gradient loss becomes zero--an optimization deadlock. We propose a variance-injection strategy: by assigning per-turn rewards to intermediate evidence-reading turns, we prevent the group reward distribution from collapsing to a single value--preserving the variation that GRPO's group-relative advantage requires. Contextual Information-Gain Policy Optimization (CIGPO) implements this strategy using the marginal increase in the frozen reference model's log-likelihood of the ground-truth answer as the per-turn signal. With separate normalization of IG and F1 rewards and an IG-weight curriculum, CIGPO reaches a standard F1 of 0.518 on HotpotQA at the 3B scale (from 0.252 base; +105%), compared with 0.430 for the best GRPO checkpoint and 0.000 for the final GRPO checkpoint. CIGPO maintains meaningful reward variance and avoids zero-advantage lock-in throughout training. These results identify reward-variance collapse as a concrete failure mode of outcome-only GRPO and show that turn-level IG rewards can prevent it in this HotpotQA setting.", "category": "cs.CL", "cluster": "Agent Training \u0026 Optimization", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文针对的核心研究问题是：在基于 Group Relative Policy Optimization (GRPO) 的多轮证据阅读（multi-turn evidence-reading）大语言模型（LLM）训练中，仅依赖最终结果奖励（outcome-only reward）会导致严重的训练不稳定性，具体表现为“零优势锁定”（zero-advantage lock-in）引发的优化死锁。在 HotpotQA 数据集上使用 Qwen2.5-3B-Instruct 的实验表明，GRPO 在初期提升后，模型会迅速退化至 100% 格式违规输出，导致策略梯度损失归零，训练完全停滞。\n\n这一问题的重要性在于，它揭示了当前主流无价值网络（value-free）强化学习算法（如 GRPO）在处理多轮交互任务时的一个关键脆弱性：信用分配（credit assignment）缺失。在多轮任务中，中间步骤（如检索证据）不直接产生最终奖励，若所有采样轨迹均因格式错误获得相同的最低惩罚，组内奖励方差将坍缩为零，导致 GRPO 无法计算有效的相对优势（relative advantage），从而切断学习信号。解决这一问题对于构建能够稳定执行复杂多步推理和工具使用的自主智能体至关重要，因为它打破了从“格式崩溃”中无法恢复的死循环，使得模型能够在长序列交互中持续优化中间决策质量，而非仅仅依赖最终结果的稀疏反馈。\n\n### § 2 前人工作与不足\n\n该问题在现有研究中尚未得到充分解决，主要因为 prior work 多集中于单轮生成任务或依赖不同的强化学习范式。\n\n首先，GRPO [4] 及其在 DeepSeekMath 和 DeepSeek-R1 [10] 中的应用，主要优化数学推理和代码生成等单轮响应任务。在这些场景中，最终答案的正确性足以提供足够的梯度信号，且任务通常不涉及多轮工具调用。当 GRPO 被直接迁移到多轮证据阅读任务时，其“仅对最终输出进行组内归一化”的机制失效了，因为中间轮次的决策缺乏直接奖励，导致一旦格式违规成为主导行为，组内奖励分布坍缩，GRPO 无法提供恢复梯度。\n\n其次，传统的 Proximal Policy Optimization (PPO) [7] 及其变体虽然通过价值网络（value network）可以处理多步信用分配，但计算成本高且训练复杂。Direct Preference Optimization (DPO) [6] 虽然简化了训练，但原生不支持多轮信用分配。\n\n再者，针对多轮智能体的训练方法如 ReAct [1] 和 Toolformer [2] 并未使用强化学习进行优化；Agent Q [11] 和 StreamBench [12] 虽应用 RL，但依赖基于价值的方法或蒙特卡洛树搜索（MCTS），工程复杂度高。ReST-MCTS* [13] 使用过程奖励（process rewards）提供轮次级信号，但依赖于树搜索和额外的奖励模型训练。\n\n最后，信息增益（Information Gain, IG）作为奖励信号在 IGPO [14] 中已被提出，但 IGPO 应用于开放式的网络搜索代理（open-ended web search），其动作空间是自由形式的查询生成。相比之下，本文的场景是封闭证据池中的结构化证据块选择（closed evidence pool with structured `Read[block_id]` actions）。IGPO 的方法不能直接移植，因为搜索上下文与证据阅读上下文的性质不同，且 IGPO 未针对 GRPO 特有的组相对优势机制进行适配。因此，缺乏一种轻量级、无需额外训练奖励模型、且能直接嵌入 GRPO 框架以维持中间轮次奖励方差的方法，这正是 CIGPO 旨在填补的空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在将 Group Relative Policy Optimization (GRPO) 应用于多轮证据检索（Multi-Turn Evidence-Reading）任务时，研究者首先观察到一个反直觉的现象：尽管 GRPO 在单轮数学推理中表现优异，但在多轮交互中，模型初期性能提升后迅速崩溃，最终输出完全格式错误的乱码。通过深入分析训练日志，研究者发现崩溃的根本原因在于“零优势锁定”（Zero-Advantage Lock-in）：当所有采样轨迹都因格式错误而获得相同的最低惩罚（如 -2.0）时，组内奖励方差归零，导致相对优势（Advantage）消失，策略梯度更新停滞，形成优化死锁。\n\n这一现象揭示了多轮强化学习中的核心痛点——信用分配（Credit Assignment）问题。在仅依赖最终结果奖励（Outcome-only Reward）的设定下，中间步骤（如检索证据）缺乏直接的学习信号。一旦模型偏离正确路径，由于缺乏中间反馈，它无法区分“错误的检索”和“正确的检索”，只能依赖最终结果的稀疏信号。当所有样本都失败时，这种稀疏信号彻底失效。\n\n为了解决这个问题，研究者需要一种机制来维持组内奖励的方差，即使最终答案错误，中间步骤的差异也能被捕捉到。现有的解决方案如训练独立的奖励模型（Reward Model）或过程奖励模型（Process Reward Model）成本高昂且复杂。研究者注意到，信息增益（Information Gain, IG）在主动学习和特征选择中已被证明能有效衡量信息价值。如果利用一个冻结的参考模型（Reference Model）来计算每一步检索对最终答案置信度的提升，就可以得到一个无需额外训练、即时可用的中间信号。这个信号不仅量化了证据的相关性，更重要的是，它为不同的中间轨迹提供了差异化的奖励，从而打破了“全零优势”的死锁，使梯度更新得以继续。\n\n### § 4 核心 Intuition\n\nGRPO 在多轮任务中崩溃是因为当所有样本都失败时，组内奖励方差消失，导致梯度更新停滞（Zero-Advantage Lock-in）。CIGPO 的核心直觉是通过引入基于冻结参考模型的信息增益（Information Gain）作为中间步骤的奖励，人为注入方差，确保即使最终答案错误，不同证据检索路径仍能产生差异化的优势信号。这种“方差注入”机制打破了优化死锁，使模型能够在没有最终正确反馈的情况下，依然通过中间步骤的相对优劣进行有效学习。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**CIGPO (Contextual Information-Gain Policy Optimization)** 的核心思想是通过在中间步骤注入基于 **Information Gain (IG)** 的奖励信号，解决多轮证据阅读任务中 **GRPO** 因奖励方差坍缩导致的优化死锁问题。其完整 Pipeline 如下：\n\n1.  **输入与环境交互 (Input \u0026 Interaction)**：\n    *   给定一个问题 $q$ 和预索引的证据文档池 $E$。\n    *   Agent 模型（基于 Qwen2.5-3B-Instruct）进行多轮交互。在每一轮 $t$，模型先生成思考过程（`\u003Cthink\u003E`），然后调用工具读取特定证据块（`Read[block_id]`），最后接收证据内容。\n    *   **示例**：问题为“Billy Preston 效力的球队参加什么比赛？”。Agent 在第 1 轮读取关于 Billy Preston 的文档，在第 2 轮读取关于该球队所属联赛的文档。\n\n2.  **奖励计算 (Reward Calculation)**：\n    *   **中间轮次奖励 (Per-Turn IG Reward)**：对于每一个中间证据阅读步骤 $t$，计算 **Contextual Information Gain**。使用冻结的参考模型 ($p_{ref}$) 计算读取当前证据后，对正确答案 $y^*$ 的对数似然增量：\n        $$ \\Delta_t = \\log p_{ref}(y^* | q, e_{\\le t}) - \\log p_{ref}(y^* | q, e_{\u003C t}) $$\n        该值作为稀疏奖励分配给该轮最后一个 token。\n    *   **最终轮次奖励 (Final F1 Reward)**：在最后一轮，根据生成的答案与标准答案的 token-level F1 分数计算奖励。如果格式违规（如缺少 XML 标签），则给予固定惩罚 $-2.0$。\n\n3.  **优势估计与归一化 (Advantage Estimation \u0026 Normalization)**：\n    *   **独立归一化 (Separate Normalization)**：由于 IG 奖励（nat 单位，范围大）和 F1 奖励（0-1 或 -2.0）量级不同，CIGPO 对它们分别进行组内归一化，防止 F1 奖励淹没 IG 信号。\n    *   **优势计算**：结合归一化后的 IG 和 F1 奖励，计算组相对优势 (Group Relative Advantage)。\n\n4.  **策略更新 (Policy Update)**：\n    *   使用 **GRPO** 的裁剪代理目标函数更新策略模型 $\\pi_\\theta$。\n    *   **课程学习 (Curriculum Learning)**：IG 奖励的权重 $\\lambda_{IG}$ 从 0.1 线性增加到 0.3，确保模型先学习格式合规，再优化证据阅读质量。\n\n5.  **输出 (Output)**：\n    *   经过多轮训练，模型输出符合格式要求的答案。\n    *   **示例结果**：Agent 正确读取证据并输出 `\u003Canswer\u003ENCAA\u003C/answer\u003E`，获得高 F1 奖励和正向 IG 累积信号，从而强化该证据阅读路径。\n\n### § 6 核心数学推导\n\n**理论背景**：\n传统 **GRPO** 依赖组内奖励的方差来计算优势 (Advantage)。在多轮任务中，如果仅最终答案有奖励，且所有样本都因格式错误获得相同的最小惩罚（如 $-2.0$），则组内奖励方差为 0，导致优势为 0，策略梯度消失（Zero-Advantage Lock-in）。\n\n**核心公式与 Intuition**：\n\n1.  **Information Gain (IG) 定义**：\n    $$ \\Delta_t = \\log p_{ref}(y^* | q, e_{\\le t}) - \\log p_{ref}(y^* | q, e_{\u003C t}) $$\n    *   **Intuition**：衡量“读取当前证据”这一动作对模型确信正确答案程度的边际贡献。如果读取的证据无关紧要，$\\Delta_t$ 接近 0；如果证据关键，$\\Delta_t$ 为正且较大。这为中间步骤提供了细粒度的反馈信号。\n\n2.  **独立归一化的优势计算**：\n    $$ A_t^{IG} = \\frac{r_t^{IG} - \\mu_{IG}}{\\sigma_{IG}}, \\quad A_T^{F1} = \\frac{r_T^{F1} - \\mu_{F1}}{\\sigma_{F1}} $$\n    *   **Intuition**：IG 和 F1 量纲不同。独立归一化确保 IG 信号在梯度更新中不被 F1 的数值范围主导，保留中间步骤的区分度。\n\n3.  **GRPO 目标函数**：\n    $$ L(\\theta) = \\mathbb{E} \\left[ \\min \\left( \\rho_t A_t, \\text{clip}(\\rho_t, 1-\\epsilon, 1+\\epsilon) A_t \\right) - \\beta D_{KL}(\\pi_\\theta || \\pi_{ref}) \\right] $$\n    *   **Intuition**：通过注入 IG 奖励，即使最终 F1 奖励相同（如都格式错误），中间步骤的 IG 奖励仍存在差异，从而保持 $A_t$ 非零，避免梯度消失。\n\n### § 7 实验设计与结论\n\n**提出了什么问题**：\n在基于 **GRPO** 的多轮证据阅读训练中，仅依赖最终结果奖励（Outcome-only RL）会导致训练不稳定，具体表现为模型退化为 100% 格式违规输出，且无法恢复（Zero-Advantage Lock-in）。\n\n**设计了什么实验验证这个问题**：\n1.  **基线对比**：在 HotpotQA 数据集上，使用 Qwen2.5-3B-Instruct 对比标准 **GRPO** 与提出的 **CIGPO**。\n2.  **诊断分析**：记录训练日志，监控奖励均值、优势均值、策略梯度损失和熵损失，以验证“零优势死锁”假设。\n3.  **消融与敏感性分析**：测试不同 IG 权重、归一化策略（联合 vs 独立）和裁剪阈值的影响。\n4.  **轨迹分析**：统计不同结果（正确、部分正确、错误、格式违规）轨迹的累积 IG 值，验证 IG 信号的有效性。\n\n**问题的答案是什么**：\n1.  **GRPO 确实存在坍缩**：标准 GRPO 在初期提升后，格式违规率升至 100%，奖励均值收敛至 $-2.0$，优势为 0，梯度消失。\n2.  **CIGPO 有效稳定训练**：通过注入 IG 奖励，CIGPO 保持了奖励方差，避免了死锁。最终 Standard F1 从基线的 0.252 提升至 0.518，而 GRPO 最终 F1 为 0.000。\n3.  **IG 信号具有判别力**：正确轨迹的累积 IG (4.06) 显著高于错误轨迹 (2.10)，证明 IG 能有效反映证据阅读的质量。\n4.  **独立归一化至关重要**：联合归一化会导致 IG 信号被淹没，独立归一化是保持训练稳定的必要条件。", "additional_insights": "### § 8 Take-aways\n\nGRPO 在 multi-turn evidence-reading 任务中遭遇的崩溃并非单纯的精度下降，而是一种由 **zero-advantage lock-in** 导致的优化死锁：当所有采样轨迹均因格式违规获得相同的最低惩罚（-2.0）时，group-relative advantage 归零，导致 policy-gradient loss 消失，模型陷入无法恢复的高熵乱码状态。CIGPO 通过引入 **variance-injection** 机制解决了这一死锁，即在中间步骤利用冻结的 reference model 计算 **Contextual Information Gain (IG)** 作为 per-turn reward，确保即使最终答案奖励同质化，中间步骤的奖励分布仍保持非零方差，从而维持有效的梯度信号。实验表明，在 Qwen2.5-3B 模型上，CIGPO 避免了 GRPO 的格式崩溃，将 HotpotQA 的 Standard F1 从基线的 0.252 提升至 0.518，而 GRPO 最终检查点的 F1 降至 0.000。IG 奖励与证据获取的有效性正相关，正确轨迹的累积 IG 显著高于错误轨迹，证明该信号能有效引导模型进行有意义的证据检索。该方法的关键设计在于对 IG 和 F1 奖励进行 **separate normalization**，防止量纲差异巨大的 IG 信号被 F1 奖励淹没，并通过 curriculum learning 逐步增加 IG 权重以平衡格式学习与证据质量。\n\n### § 9 最脆弱的假设\n\nCIGPO 核心贡献成立的最关键假设是：**冻结的 reference model 能够准确量化中间步骤证据对最终答案置信度的边际增益（即 IG 信号具有判别力且与任务成功正相关）**。如果 reference model 对证据的敏感度不足，或者 IG 计算无法区分“有用证据”与“无用证据”，那么注入的方差将是噪声而非信号，不仅无法防止优势归零，反而可能引导模型走向错误的证据检索路径。在实际中，这一假设可能不成立的原因包括：reference model 可能本身对多跳推理缺乏理解能力，导致其 log-likelihood 变化主要反映表面词汇匹配而非逻辑相关性；或者对于某些复杂问题，单一证据块的加入并不显著改变模型对答案的概率分布，导致 IG 信号微弱且不稳定。论文提供的证据主要基于相关性分析（Table 7），显示正确轨迹的平均累积 IG (4.06) 高于错误轨迹 (2.10)，但这仅是统计相关性，并未通过消融实验证明 IG 信号本身的因果有效性（例如，若使用随机噪声作为中间奖励，是否也能通过注入方差避免崩溃？）。此外，论文承认 IG 依赖于 ground-truth answer $y^*$，这意味着该信号仅在训练时可用，且其质量受限于 reference model 的校准程度，若 reference model 对长尾或模糊答案的概率估计偏差较大，IG 信号将失效。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现的核心验证点是：**IG 奖励是否真的通过维持奖励方差来防止 GRPO 的 zero-advantage lock-in，而非仅仅因为提供了额外的监督信号**。\n\n*   **数据与设置**：使用 HotpotQA 训练集的一个小子集（如 100 个样本），加载 Qwen2.5-3B-Instruct 模型。\n*   **实现**：实现标准的 GRPO 训练循环，但修改奖励计算部分。设置三个实验组：(1) Baseline GRPO（仅最终 F1 奖励）；(2) CIGPO（使用真实的 IG 作为中间奖励）；(3) Random-Variance GRPO（在中间步骤注入随机噪声奖励，均值与 IG 相近，方差与 IG 相近，但无信息量）。\n*   **测量**：监控训练过程中的 `critic/advantages/mean`、`actor/pg_loss` 以及 `zero_advantage_group_ratio`。同时记录最终检查点的 Standard F1 和格式违规率。\n*   **支持/反驳标准**：\n    *   **支持**：如果 Baseline GRPO 出现优势归零和格式崩溃，而 CIGPO 和 Random-Variance GRPO 均能维持非零优势和较低格式违规率，且 CIGPO 的最终 F1 显著高于 Random-Variance GRPO，则证明“方差注入”是防止崩溃的关键机制，而 IG 的具体信息量提升了最终性能。\n    *   **反驳**：如果 Random-Variance GRPO 同样导致崩溃，或者 CIGPO 的优势并未比 Baseline 更稳定，则说明 IG 的作用并非简单的方差注入，或者该机制在该小规模设置下无效。若 Random-Variance GRPO 能防止崩溃但 F1 极低，则说明方差注入足以解决死锁，但 IG 提供了必要的方向性引导。", "research_value": "### § 11 最强反例设计\n\n要挑战 CIGPO 的有效性，最有力的攻击并非质疑其能否防止崩溃，而是质疑其**“方差注入”机制是否引入了有害的优化偏差（Optimization Bias）**，即证明 CIGPO 的增益并非来自更优的信用分配，而是来自对 Reference Model 偏见的过度拟合。\n\n**理论论证：Reference Model 的“幻觉引导”与梯度污染**\nCIGPO 的核心假设是 $p_{ref}$ 的 log-likelihood 变化能准确反映证据对答案的逻辑贡献。然而，在 LLM 中，log-likelihood 往往与“表面词汇匹配度”或“模型固有偏见”强相关，而非逻辑正确性。如果 $p_{ref}$ 本身存在系统性偏差（例如，倾向于认为某些常见实体更可能是答案），那么 IG 信号将奖励那些能触发 $p_{ref}$ 偏见的路径，而非真正解决多跳推理的路径。\n**反例场景**：构造一组“陷阱问题”，其中正确答案需要否定 $p_{ref}$ 的强先验（例如，$p_{ref}$ 认为“Apple”是水果，但问题问的是“Apple 公司的 CEO”）。在此场景下，读取关于“水果”的证据会显著增加 $p_{ref}$ 对“Apple”作为水果的置信度（高 IG），但这与最终答案（Tim Cook）完全无关甚至相悖。CIGPO 会错误地强化这种“高 IG 但错误”的中间步骤，导致模型陷入局部最优，即模型学会了“取悦 Reference Model”而非“解决用户问题”。\n\n**实验设计：IG 信号与最终奖励的解耦测试**\n设计一个控制实验，使用一个经过微调的、故意对特定类型证据产生错误高置信度的 $p_{ref}^{biased}$ 替换原始 $p_{ref}$。\n1.  **设置**：保持 CIGPO 的其他部分不变，仅替换 $p_{ref}$ 为 $p_{ref}^{biased}$。\n2.  **预测**：如果 CIGPO 的有效性依赖于 IG 信号的“信息量”而非单纯的“方差”，那么使用 $p_{ref}^{biased}$ 会导致性能显著下降，甚至低于 Baseline GRPO（因为引入了错误的梯度方向）。\n3.  **攻击点**：如果 CIGPO 在 $p_{ref}^{biased}$ 下依然能防止崩溃且性能尚可，或者性能下降幅度远小于预期，则证明 CIGPO 的主要作用仅仅是“方差注入”（Variance Injection），其具体奖励值的方向性并不重要。这将削弱论文声称的“Contextual Information Gain”作为*语义*奖励信号的理论价值，将其降级为一种简单的正则化技巧。\n\n**真实世界场景：动态证据池中的分布偏移**\n在真实的多轮搜索场景中，证据池 $E$ 是动态变化的，且 $p_{ref}$ 是冻结的。如果新检索到的证据包含 $p_{ref}$ 训练数据中未见的长尾知识，$p_{ref}$ 的 log-likelihood 变化可能极小（接近 0），导致 IG 信号消失。此时，CIGPO 退化为仅依赖最终 F1 的 GRPO，重新面临 Zero-Advantage Lock-in 的风险。这揭示了 CIGPO 对 $p_{ref}$ 覆盖范围的强依赖，限制了其在开放域（Open-domain）而非封闭证据池（Closed evidence pool）场景下的泛化能力。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“静态参考模型”到“动态价值网络”的信用分配范式转移 —— 基于 Self-Critic 的 Process-Aware GRPO**\n\n**(a) 驱动局限与未满足需求**\nCIGPO 的根本局限在于其依赖一个**冻结的、外部的 Reference Model** 来生成中间奖励。这不仅引入了对 $p_{ref}$ 质量的强依赖（如 §11 所述），而且计算成本高（每步需调用 $p_{ref}$），且无法适应策略模型 $\\pi_\\theta$ 在训练过程中的能力变化。更重要的是，CIGPO 仍然是一种“伪过程奖励”，因为它没有显式地学习中间状态的价值，而是通过启发式公式计算。真正的多轮智能体训练需要一种能够**端到端学习中间步骤价值（Value Learning）**的方法，同时保持 GRPO 的无价值网络（Value-free）优势。\n\n**(b) 借鉴相邻领域的方法**\n借鉴 **Self-Critic Sequence Training (SCST)** 和 **Implicit Value Estimation** 的思想。在 SCST 中，模型自身作为 Critic 来评估其生成的序列。我们可以设计一个 **Lightweight Value Head** 或 **Implicit Advantage Estimator**，它不依赖于外部的 $p_{ref}$，而是利用策略模型 $\\pi_\\theta$ 自身的参数或一个共享权重的轻量级网络，通过**反向传播最终奖励到中间步骤**来隐式地学习中间状态的优势。\n具体而言，借鉴 **GRPO** 的组相对优势思想，但将其扩展到**时间维度**。不再仅对同一问题下的不同采样轨迹进行组内归一化，而是对**同一轨迹内的不同时间步**进行相对优势估计。\n\n**(c) 第一个实验设计**\n**方法名称：Temporal-Relative Policy Optimization (TRPO-GRPO)**\n\n1.  **核心机制**：\n    *   保留 GRPO 的组采样机制。\n    *   引入一个可训练的、轻量级的 **Temporal Value Network (TVN)**，它接收当前状态（问题 + 已读取证据）并输出一个标量价值 $V_t$。\n    *   优势估计公式修改为：$A_t = \\sum_{k=t}^T \\gamma^{k-t} r_k - V_t + V_{t+1}$（类似 TD-error，但 $V$ 由 TVN 预测）。\n    *   关键创新：TVN 的损失函数不仅包括价值预测误差，还包括一个 **Consistency Loss**，强制 TVN 对同一组采样中的不同轨迹给出相对一致的价值排序，从而模拟 GRPO 的组相对优势特性，但作用于时间步。\n\n2.  **实验设置**：\n    *   **数据集**：HotpotQA 和 MuSiQue（更复杂的多跳推理）。\n    *   **基线**：CIGPO, Standard GRPO, PPO (with full Value Network)。\n    *   **对比指标**：\n        *   **性能**：Standard F1。\n        *   **效率**：训练时间（CIGPO 需多次调用 $p_{ref}$，TRPO-GRPO 仅需前向传播 TVN）。\n        *   **鲁棒性**：在 $p_{ref}$ 质量下降（如使用更小模型或不同架构）时的性能保持能力。\n\n3.  **预期结果与区分度**：\n    *   与 CIGPO 不同，TRPO-GRPO 不依赖外部 $p_{ref}$，因此不存在“Reference Model 偏见”问题。\n    *   与 PPO 不同，TRPO-GRPO 的 TVN 是轻量级的，且优势估计结合了组内相对性，可能更稳定。\n    *   该研究将打开“无外部参考模型的多轮 RL 训练”新方向，解决 CIGPO 的依赖性问题，并探索如何在 Value-free 框架下显式学习时间维度的信用分配。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Hao Dou\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Harbin Institute of Technology\"\n    }\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "仅使用结果导向强化学习训练多轮证据阅读智能体是不稳定的，因为中间轮次获得的直接信用极少。在基于 Qwen2.5-3B-Instruct 的 HotpotQA 实验中，GRPO 初期有所提升（标准 F1 为 0.430），但随后崩溃，导致 100% 的输出违反格式规范。训练日志诊断揭示了一种零优势锁定机制：所有采样轨迹均受到最低格式惩罚（-2.0），组相对优势消失，策略梯度损失变为零——形成优化死锁。我们提出了一种方差注入策略：通过为中间证据阅读轮次分配每轮奖励，防止组奖励分布坍缩为单一值——从而保留 GRPO 组相对优势所需的变异。上下文信息增益策略优化（CIGPO）利用冻结参考模型对真实答案的对数似然的边际增量作为每轮信号来实现该策略。通过对 IG 和 F1 奖励进行独立归一化并采用 IG 权重课程学习，CIGPO 在 3B 规模下在 HotpotQA 上达到了 0.518 的标准 F1（从基线的 0.252 提升，增幅 +105%），相比之下，最佳 GRPO 检查点的 F1 为 0.430，最终 GRPO 检查点的 F1 为 0.000。CIGPO 在整个训练过程中保持了有意义的奖励方差，并避免了零优势锁定。这些结果将奖励方差坍缩确定为仅结果导向 GRPO 的一种具体故障模式，并表明在此 HotpotQA 设置中，轮级 IG 奖励可以防止该问题。"}, {"title": "From Outcomes to Actions: Leveraging Hindsight for Long-Horizon Language Agent Training", "arxiv_id": "2607.16257", "authors": "Zishang Jiang, Tingyun Li, Jinyi Han, Xinyi Wang, Sihang Jiang, Yizhou Ying, Xiaojun Meng, Jiansheng Wei, Jiaqing Liang, Yanghua Xiao", "summary": "Reinforcement learning (RL) has become a widely adopted technique for improving large language models (LLMs) on complex tasks. Despite this progress, existing RL methods still face challenges in training agents with longer-horizon interactions. One major bottleneck is distinguishing the contribution of different actions in long-horizon interaction, leading to high optimization variance. To address this, we introduce a novel policy gradient method, Hindsight Policy Optimization (HPO), that projects both the current policy distribution and the hindsight distribution into an intent space and extracts low-variance learning signals from the Wasserstein distance between them. We theoretically and empirically show that aggregating semantically similar states and actions in the intent space yields a bounded-variance estimator and improves policy performance stably. Our code is available online.", "category": "cs.CL", "cluster": "Agent Training \u0026 Optimization", "tags": ["cs.CL"], "filter_reason": "该论文符合筛选标准，核心依据如下：\n\n1.  研究对象明确为 Long-Horizon Language Agent：论文标题和摘要明确指出其研究对象是“Long-Horizon Language Agent”（长视界语言智能体），这直接对应了研究焦点中的“单智能体 (Agentic)”方向，特别是涉及长期决策（Long-Horizon Decision-Making）的场景。\n2.  核心贡献在于智能体的训练与改进机制：论文提出了一种名为“Hindsight Policy Optimization (HPO)”的新策略梯度方法，旨在解决长视界交互中动作贡献区分难、优化方差高的问题。这属于“构建、改进、训练 LLM智能体”的核心范畴。\n3.  符合“Agent Training/RL”的保留规则：根据筛选标准第一步中的保留规则：“如果论文研究... agent training/distillation/RL，并且标题或摘要明确指向 Agentic / LLM Agents... 应保留”。该论文正是通过改进 RL 算法来提升 LLM Agent 在长视界任务中的表现，属于 Agentic AI 的基础能力增强研究，而非单纯的基础模型推理优化或通用 RL 理论。\n4.  排除项不适用：虽然涉及 RL，但它不是通用的基础推理优化（如 CoT），也不是基础设施或安全对齐问题，而是专门针对 Agent 在复杂环境交互中的学习瓶颈提出的解决方案。\n\n综上，该论文直接贡献于 LLM 智能体的训练方法和长视界行为优化，符合研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决大型语言模型（LLMs）在长视界（long-horizon）交互任务中，基于强化学习（Reinforcement Learning, RL）训练时面临的高优化方差（high optimization variance）和不稳定性问题。具体而言，核心挑战在于如何准确区分长序列中不同动作（actions）对最终结果的贡献，即信用分配（credit assignment）问题。在长视界交互中，有效与无效动作往往交织在同一轨迹（trajectory）中，而现有的基于蒙特卡洛（Monte Carlo）估计的方法通常将最终结果奖励均匀传播给所有动作，导致无效动作被错误强化，进而引发训练崩溃（reward collapse）。\n\n这一问题的重要性在于，随着LLM从单轮推理向多轮工具使用（tool use）、智能设备操作及复杂环境交互扩展，长视界决策能力成为关键瓶颈。现有的主流RL算法如GRPO在短视界任务中表现良好，但在长视界下因无法区分动作贡献而变得极不稳定；而PPO虽然通过引入Critic模型提升了稳定性，但收敛缓慢且计算成本高。解决这一问题不仅能显著提升LLM Agent在复杂任务中的训练效率和最终性能，还能提供一种无需额外训练Critic模型的低方差、平滑的学习信号，从而降低长视界Agent的训练门槛和计算开销，推动LLM在开放世界交互中的实际应用。\n\n### § 2 前人工作与不足\n\n该问题此前已有大量研究尝试解决，主要代表方法包括PPO（Proximal Policy Optimization）和GRPO（Group Relative Policy Optimization），以及近期的REINFORCE++等。PPO通过引入Critic网络来估计状态价值（state-value function），从而更精细地评估动作优劣，但其不足在于Critic模型需要大量的预热（warm-up）才能提供可靠的估计，导致收敛速度慢，且增加了额外的模型训练成本和内存占用。GRPO等无Critic（critic-free）方法通过组内相对优势估计来减少方差，在单轮任务（如数学推理）中表现优异，但其核心假设是动作空间较小或交互视界较短。在长视界语言Agent任务中，GRPO的不足在于其依赖离散状态-动作空间中的点对点（point-wise）比较，忽略了语言动作背后的语义结构（semantic structure）。由于LLM的动作空间呈指数级增长，且语义相似的动作（如不同的提问方式）在离散空间中被视为独立原子，导致统计证据无法共享，使得价值估计方差极大且无界（unbounded variance）。\n\n此外，现有方法未能充分利用“后见之明”（hindsight）分布中的语义信息。虽然PPO和GRPO都试图优化策略，但它们要么依赖昂贵的Critic，要么在离散空间中直接比较概率分布，导致在长视界下梯度噪声过大。特别是GRPO，其固定的基线（baseline）在长视界中无法准确近似状态依赖的价值函数，导致基线失配（baseline mismatch），进一步加剧了方差。因此，现有工作缺乏一种能够在语义层面聚合相似状态和动作、从而在保持无Critic优势的同时提供有界方差（bounded-variance）学习信号的方法。本文提出的Hindsight Policy Optimization (HPO) 正是针对这一缺口，通过引入意图空间（intent space）和Wasserstein距离，解决了离散空间比较带来的方差爆炸问题。", "core_insight": "### § 3 重建作者的思考路径\n\n在长视界（Long-horizon）语言智能体训练中，现有的强化学习（RL）方法面临严峻挑战。一方面，基于蒙特卡洛估计的无Critic方法（如GRPO）虽然计算高效，但在长序列中由于无法区分具体步骤的贡献，导致梯度方差极大，训练极易崩溃；另一方面，基于Actor-Critic的方法（如PPO）虽然通过Critic降低了方差，但Critic模型需要漫长的Warm-up过程，且在高维离散的语言动作空间中，Critic的价值估计往往不够精细，导致收敛缓慢。\n\n作者观察到，语言动作空间虽然庞大，但其背后的语义意图（Intent）空间相对低维且紧凑。现有的RL方法在离散的状态-动作空间中进行点对比（Point-wise comparison），忽略了语义相似动作之间的关联性，导致统计效率低下。如果能够将动作映射到语义空间，利用语义结构的连续性来平滑价值估计，或许能在不引入额外Critic模型的情况下，获得低方差的梯度信号。\n\n进一步地，作者从“后见之明”（Hindsight）的角度重新审视策略梯度。传统的策略梯度可以看作是当前策略分布与“后见之明”分布（即已知最终结果下的最优动作分布）之间的差异。在离散空间中，这种差异通过KL散度衡量，导致高方差；而在连续或度量空间中，Wasserstein距离能够捕捉分布之间的几何结构，提供有界方差的估计。因此，作者设想构建一个语义意图空间，将当前策略和后见之明分布投影其中，利用Wasserstein距离的对偶形式（Kantorovich potential）作为步骤级的优势函数（Step-level Advantage），从而结合回合级奖励（Episode-level Reward）实现稳定且高效的策略优化。\n\n### § 4 核心 Intuition\n\n现有RL方法在长视界任务中失效，是因为它们在离散的语言动作空间中进行点对比，忽略了语义相似动作间的关联，导致梯度方差随视界长度指数级增长。HPO的核心直觉是：虽然语言动作表面形式多样，但其底层意图（Intent）空间是低维且连续的。通过将动作投影到语义意图空间，并利用Wasserstein距离衡量当前策略与后见之明分布的差异，可以利用语义结构的平滑性来聚合统计信息，从而获得有界方差且低噪声的学习信号，无需训练额外的Critic模型即可实现稳定优化。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法是 **Hindsight Policy Optimization (HPO)**，旨在解决长视界（Long-horizon）语言智能体在强化学习（RL）训练中因动作空间巨大且稀疏导致的高方差问题。HPO 的核心思想是将离散的、巨大的语言动作空间投影到一个低维的、语义连续的 **Intent Space**（意图空间），并在该空间中利用 **Wasserstein Distance** 计算当前策略分布与后见之明分布（Hindsight Distribution）之间的差异，从而获得低方差的梯度信号。\n\n以下是 HPO 的完整 Pipeline，结合一个具体的 **SearchQA** 任务例子进行说明：\n\n**任务背景**：用户提问“美国现任总统是谁？”，智能体需要通过多轮搜索和推理来回答。\n\n1.  **Rollout 与数据收集 (Rollout \u0026 Data Collection)**：\n    *   **输入**：初始 Prompt $q$（例如：“Who is the current president of the US?”）。\n    *   **处理**：使用当前的策略模型 $\\pi_\\theta$ 生成多条轨迹（Trajectories）。每条轨迹包含一系列的状态-动作对 $(s_t, a_t)$，例如 $a_1$ 是搜索查询 \"current US president\"，$a_2$ 是解析搜索结果等。\n    *   **输出**：得到一组轨迹 $\\{\\tau_i\\}$，每个轨迹最终有一个二元奖励 $R$（成功为1，失败为0）。\n\n2.  **构建意图空间分布 (Intent Space Construction)**：\n    *   **处理**：使用预训练的编码器 $\\Phi$（如 Qwen3-Embedding）将每个状态-动作对 $(s_t, a_t)$ 映射为向量嵌入 $z_t = \\Phi(s_t, a_t)$。\n    *   **直觉**：不同的表面形式（如 \"Who is the president?\" 和 \"I want to know the president's name\"）如果语义相似，会在 Intent Space 中靠得很近。\n    *   **分布构建**：\n        *   **当前策略分布 $\\rho_\\pi$**：由所有采样轨迹中的嵌入点构成的经验分布。\n        *   **后见之明分布 $\\rho_\\pi^h$**：仅由那些最终获得奖励 $R=1$ 的成功轨迹中的嵌入点构成（Offline HPO 使用固定的离线成功数据集，Online HPO 使用当前采样的成功轨迹）。\n\n3.  **计算 Wasserstein 距离与 Kantorovich Potential (Wasserstein Distance \u0026 Potential Calculation)**：\n    *   **处理**：计算 $\\rho_\\pi$ 和 $\\rho_\\pi^h$ 之间的 1-Wasserstein 距离 $W_1(\\rho_\\pi, \\rho_\\pi^h)$。\n    *   **关键步骤**：通过求解 Wasserstein 距离的对偶问题（Dual Problem），得到最优的 **Kantorovich Potential** 函数 $f^*(z)$。\n    *   **直觉**：$f^*(z)$ 可以看作是一个“价值评估器”，它评估某个意图 $z$ 在成功分布中的相对优势。由于 $f^*$ 是 1-Lipschitz 连续的，语义相似的意图会得到相似的价值估计，从而平滑了噪声。\n\n4.  **计算优势函数 (Advantage Calculation)**：\n    *   **Step-level Advantage ($A_S$)**：将每个步骤的嵌入 $z_t$ 输入 $f^*$，得到 $-f^*(z_t)$ 作为该步骤的优势信号。这提供了细粒度的、基于语义的反馈。\n    *   **Episode-level Advantage ($A_E$)**：沿用 GRPO 的方法，使用轨迹的最终奖励减去基线（Baseline）作为整条轨迹的优势。\n    *   **最终优势 ($\\hat{A}_t$)**：加权组合两者，$\\hat{A}_t = (1-\\omega)A_E + \\omega A_S$，其中 $\\omega$ 控制语义信号的权重。\n\n5.  **策略更新 (Policy Update)**：\n    *   **处理**：使用计算出的 $\\hat{A}_t$ 作为优势信号，通过标准的策略梯度方法（如 PPO 或 GRPO 的更新公式）更新模型参数 $\\theta$。\n    *   **输出**：更新后的策略模型 $\\pi_{\\theta'}$，其在长视界任务中更稳定，能更准确地识别哪些中间步骤是有价值的。\n\n---\n\n### § 6 核心数学推导\n\n这篇论文的核心数学贡献在于从 **Hindsight Distribution** 的视角重新解释策略梯度，并证明在 Intent Space 中使用 Wasserstein 距离可以带来有界的方差（Bounded Variance）。\n\n**1. 策略梯度的后见之明解释 (Hindsight Interpretation of Policy Gradient)**\n\n传统策略梯度定理（Policy Gradient Theorem）通常表示为：\n$$ \\nabla_\\theta J(\\theta) = \\mathbb{E}_{\\tau \\sim \\pi_\\theta} \\left[ \\sum_t \\nabla_\\theta \\log \\pi_\\theta(a_t|s_t) Q^\\pi(s_t, a_t) \\right] $$\n\n论文定义 **Hindsight Policy Distribution** $\\rho_\\pi^h(s, a)$ 为在给定最终回报 $z$ 的条件下，状态-动作对的占用测度（Occupancy Measure）。对于二元奖励，它仅包含成功轨迹中的 $(s, a)$。\n\n**Lemma 4.2** 指出，策略梯度可以等价地表示为当前占用测度 $\\rho_\\pi$ 与后见之明占用测度 $\\rho_\\pi^h$ 之间的 **KL 散度** 的变分导数：\n$$ \\nabla_\\theta J(\\theta) \\propto - \\frac{\\delta KL(\\rho_\\pi^h || \\rho_\\pi)}{\\delta \\rho_\\pi} $$\n具体形式为点态比率 $\\frac{\\rho_\\pi^h(s, a)}{\\rho_\\pi(s, a)}$。\n\n*   **Intuition**：这告诉我们，RL 的本质是让当前策略分布 $\\rho_\\pi$ 去拟合那些导致成功的“后见之明”分布 $\\rho_\\pi^h$。然而，在离散的语言动作空间中，$\\rho_\\pi(s, a)$ 可能非常小甚至为0，导致比率 $\\frac{\\rho_\\pi^h}{\\rho_\\pi}$ 的方差极大（Unbounded Variance），这就是长视界训练不稳定的根源。\n\n**2. 从 KL 到 Wasserstein 的方差分析 (Variance Analysis: KL vs. Wasserstein)**\n\n为了解决高方差问题，HPO 将分布投影到 Intent Space $Z$，并比较 $\\rho_\\pi$ 和 $\\rho_\\pi^h$ 的 **Wasserstein 距离** $W_1$。\n\n**Lemma 4.4** 对比了两种梯度信号的方差：\n\n*   **KL-based Signal (传统方法)**：\n    梯度信号为 $g(s, a) = \\frac{\\rho_\\pi^h(s, a)}{\\rho_\\pi(s, a)}$。\n    其方差由 $\\chi^2$ 散度控制：$\\text{Var}(g) \\propto \\chi^2(\\rho_\\pi^h || \\rho_\\pi)$。\n    *   **Intuition**：如果某个成功动作在训练数据中很少出现（$\\rho_\\pi$ 很小），分母趋近于0，方差趋向无穷大。这在巨大的语言动作空间中非常常见。\n\n*   **Wasserstein-based Signal (HPO 方法)**：\n    梯度信号为 Kantorovich Potential $f^*(s, a)$，它是 $W_1$ 对偶问题的解。\n    其方差是有界的：$\\text{Var}(f^*) \\leq \\frac{D^2}{4}$，其中 $D$ 是 Intent Space 中分布支撑集的直径（Diameter）。\n    *   **Intuition**：Wasserstein 距离考虑了空间几何结构。即使两个动作在离散空间中不同，如果它们在语义空间（Intent Space）中很近，Wasserstein 距离会通过“运输成本”来平滑这种差异。$f^*$ 是 1-Lipschitz 函数，意味着其值的变化受限于空间距离，因此方差被严格限制在空间直径 $D$ 内，不会爆炸。\n\n**结论**：通过引入 Intent Space 和 Wasserstein 距离，HPO 将原本无界的高方差梯度估计转化为有界的、平滑的低方差估计，从而实现了更稳定的长视界训练。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有的 RL 方法（如 GRPO, PPO）在长视界（Long-horizon）交互任务中面临训练不稳定（GRPO 的奖励崩溃）或收敛缓慢（PPO 的 Critic 预热）的问题，主要原因是难以区分长序列中不同动作的贡献，导致优化方差过高。\n\n**2. 设计了什么实验验证这个问题？**\n*   **基准任务**：选择了两个典型的长视界交互任务：**SearchQA**（多跳问答，需要多次搜索和推理）和 **TextCraft**（基于文本的游戏，需要长期规划）。\n*   **基线对比**：与 SOTA 的 RL 方法对比，包括 **PPO**（带 Critic）、**GRPO**（无 Critic，组相对策略优化）、**Search-R1** 和 **ZeroSearch**。\n*   **消融实验**：\n    *   对比 **Online HPO**（使用在线采样构建后见之明分布）和 **Offline HPO**（使用固定离线成功数据构建分布），验证数据稳定性对训练的影响。\n    *   仅使用 **Step-level Advantage ($A_S$)** 进行训练，验证语义信号是否足以驱动学习，无需最终奖励。\n    *   分析不同编码器（Embedding Model）对结果的影响，验证方法的鲁棒性。\n*   **动态分析**：绘制训练过程中的奖励曲线，观察收敛速度和稳定性。\n\n**3. 问题的答案是什么？**\n*   **HPO 显著提升了性能**：在 SearchQA 和 TextCraft 上，HPO 的平均性能比基线方法提高了 4%-7%，特别是在多跳问答（Multi-hop QA）任务上提升明显，证明了细粒度优势信号有助于更准确的信用分配（Credit Assignment）。\n*   **Offline HPO 更稳定**：Offline HPO 比 Online HPO 表现更好且方差更小，因为离线成功数据集提供了稳定的后见之明分布，避免了在线采样中成功样本波动带来的估计噪声。\n*   **训练更稳定且高效**：HPO 避免了 GRPO 的奖励崩溃，且比 PPO 收敛更快，因为它不需要训练额外的 Critic 模型。计算开销极低（仅增加 \u003C0.8% 的时间）。\n*   **语义信号具有解释性且有效**：仅使用 Step-level Advantage ($A_S$) 就能实现稳定的策略更新，说明 $A_S$ 能够准确识别有价值的中间步骤，即使在没有最终奖励的情况下也能提供有效的学习信号。", "additional_insights": "### § 8 Take-aways\n\nHindsight Policy Optimization (HPO) 通过将离散的语言动作空间投影到低维的语义 Intent Space，利用 Wasserstein Distance 计算当前策略与 Hindsight Distribution 之间的差异，从而解决了长视界（Long-horizon）交互中因动作贡献难以区分而导致的高方差优化问题。与依赖点态比较（Point-wise comparison）且方差无界的传统 Monte Carlo 方法（如 GRPO）不同，HPO 在 Intent Space 中聚合语义相似的状态-动作对，理论上证明了其梯度估计量具有有界方差（Bounded-variance estimator），从而显著提升了训练稳定性。HPO 无需训练额外的 Critic 模型，而是通过求解 Wasserstein 距离的对偶问题获得 Kantorovich Potential，将其作为 Step-level Advantage 信号，与 Episode-level Advantage 进行加权插值，实现了 Bias-Variance 的有效权衡。实验表明，HPO 在 SearchQA 和 TextCraft 等长视界任务上显著优于 PPO 和 GRPO，特别是在多跳推理任务中，其细粒度的 Step-level 优势信号能更准确地进行 Credit Assignment，且 Offline HPO 变体在稀疏奖励场景下表现出更高的鲁棒性和收敛速度。\n\n### § 9 最脆弱的假设\n\nHPO 的核心有效性建立在“语义嵌入空间（Intent Space）中的几何距离能够准确反映动作在任务成功中的功能等价性”这一假设之上，即假设语义相似的动作（如不同的查询措辞）在环境交互中具有相似的 Q-value 或回报分布。如果这一假设不成立，例如在需要精确指令遵循或特定格式输出的任务中，语义上微小差异的动作可能导致完全不同的环境状态转移或奖励结果，那么基于 Wasserstein 距离的平滑化操作就会引入严重的偏差（Bias），导致模型无法区分关键的动作细节，从而损害最终性能。论文通过 Appendix C 中的 Embedding Model Ablation 实验提供了一定证据，显示不同编码器产生的优势排名高度相关，暗示了语义结构的稳定性；然而，论文缺乏对“语义距离与功能距离错位”场景的定量分析，也未证明在高度敏感的工具调用或代码生成任务中，这种语义聚合不会过度平滑掉必要的细微差别，这是该方法在通用 Agent 应用中最大的潜在风险。\n\n### § 10 最小复现实验\n\n在 1 周内，可以使用 Qwen2.5-7B-Instruct 和 Qwen3-Embedding-0.6B，在 HotpotQA 数据集的子集上复现 HPO 的核心优势信号计算模块，以验证 Step-level Advantage ($A_S$) 是否比 GRPO 的 Episode-level Advantage 具有更低的方差和更好的判别力。具体实现为：收集一组包含成功和失败轨迹的 Rollout 数据，计算每个时间步的 Intent Embedding，构建 Current Policy 和 Hindsight Distribution 的经验分布，求解 1-Wasserstein 距离以获得 Kantorovich Potential 作为 $A_S$，同时计算 GRPO 的组内标准化回报作为 $A_E$。测量指标为：1) 在成功轨迹中，$A_S$ 对关键推理步骤（如正确搜索查询）的评分是否显著高于冗余步骤；2) 比较 $A_S$ 和 $A_E$ 在相同状态下的方差，验证 $A_S$ 是否如理论所述具有更低的波动性。如果 $A_S$ 能稳定地高评分关键步骤且方差明显低于 $A_E$，则支持 HPO 的核心 claim；反之，若 $A_S$ 对关键步骤评分混乱或方差无改善，则反驳其有效性。", "research_value": "### § 11 最强反例设计\n\n要最有力地攻击 Hindsight Policy Optimization (HPO)，核心策略是证明其核心假设——“语义空间中的几何距离等价于功能价值（Functional Value）”——在长视界交互中是根本性错误的，从而导致 Wasserstein 距离引入的平滑化操作不仅没有降低方差，反而引入了致命的偏差（Bias），使得模型无法区分“语义相似但功能致命”的动作。\n\n**理论攻击：语义-功能错位导致的梯度污染（Semantic-Functional Misalignment）**\nHPO 的理论基础依赖于 Lemma 4.4，即 Kantorovich Potential $f^*$ 的方差是有界的。然而，这一推导隐含了一个强假设：Intent Space 中的局部邻域内的动作具有相似的 Q-value。在长视界任务中，这往往不成立。例如，在代码生成或复杂工具调用中，两个语义极度相似的查询（如 `get_user_info(id)` 与 `get_user_info(id-1)` 或 `get_user_info(id)` 与 `delete_user_info(id)`）在 Embedding 空间中距离极近，但在环境中的后果天壤之别（一个是读取，一个是删除；或者一个是正确 ID，一个是越权 ID）。\n如果攻击者能证明，在 HPO 的优化过程中，$f^*(z)$ 会将这些“语义邻居”的价值强行平均化，那么对于那个导致灾难性失败的动作，其 Advantage 信号会被错误地抬高（因为它的语义邻居是成功的），而对于那个成功动作，其 Advantage 可能被拉低。这种 **Gradient Pollution** 会导致策略在关键决策点上变得模糊，无法学习到精确的边界。反例实验可以设计一个“语义陷阱”数据集，其中成功轨迹和失败轨迹的动作在 Embedding 空间中高度重叠，但奖励截然不同。如果 HPO 在此类数据上表现显著劣于 GRPO（尽管 GRPO 方差大，但它是无偏的），则证明 HPO 的 Bias 超过了其 Variance 降低带来的收益。\n\n**实验攻击：长视界中的“语义漂移”累积效应**\n设计一个多跳推理任务（如 Multi-hop QA），其中每一步的微小语义偏差会在后续步骤中被放大。例如，第一步搜索“Apple 股价”，第二步基于结果搜索“Apple 公司历史”。如果第一步的查询在语义上略有偏差（如搜索了“Apple 水果”），虽然 Embedding 距离很近，但会导致后续所有步骤进入错误的语义分支。\n攻击实验可以对比 HPO 与 PPO/GRPO 在“错误传播”场景下的表现。具体而言，构造一组轨迹，其中前 $T-1$ 步完全相同且正确，仅最后一步因语义细微差别导致失败。HPO 由于在 Intent Space 中聚合了这些步骤，可能会错误地认为前 $T-1$ 步的“意图”也是导致失败的一部分（因为它们在成功分布中的对应点可能因后续错误而被污染，或者反之，成功轨迹中的前 $T-1$ 步与失败轨迹中的前 $T-1$ 步在 Intent Space 中重合，导致 $f^*$ 无法区分）。如果数据显示 HPO 在长序列中无法正确进行 **Credit Assignment**，即它无法将失败归因于最后一步，而是错误地惩罚了前面的正确步骤，这就直接推翻了其“更准确信用分配”的核心主张。\n\n**真实世界场景：对抗性语义攻击（Adversarial Semantic Attacks）**\n在开放世界 Agent 应用中，用户输入可能包含对抗性扰动。如果 HPO 过度依赖语义平滑，它可能对对抗性样本极其脆弱。例如，攻击者可以构造一个与成功查询语义极度相似但包含隐藏恶意指令的查询。由于 HPO 的 $f^*$ 是 1-Lipschitz 的，它会给这个恶意查询分配与良性查询相似的高 Advantage，导致模型学习到错误的策略，即“只要语义像成功样本，就可以执行”。这揭示了 HPO 在安全性上的根本缺陷：它牺牲了精确性以换取稳定性，而在需要精确指令遵循的场景中，这种牺牲是不可接受的。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从静态语义聚合到动态因果意图建模（Dynamic Causal Intent Modeling, DCIM）**\n\n**（a）驱动局限与未满足需求**\nHPO 的核心局限在于其将 Intent Space 视为一个静态的、欧几里得式的几何空间，假设语义距离直接映射到价值相似性。然而，在长视界交互中，动作的价值不仅取决于其语义内容，更取决于其在**因果链（Causal Chain）**中的位置和作用。两个语义相似的动作，如果发生在不同的上下文状态（Contextual State）或因果路径上，其价值可能完全不同。HPO 忽略了这种**上下文依赖性（Context-dependency）**和**因果结构（Causal Structure）**，导致其在复杂、非马尔可夫（Non-Markovian）环境中失效。现有的方法（包括 HPO）都未能解决“意图”的动态演化问题，即一个动作的意图如何随时间推移和状态变化而改变其价值。\n\n**（b）借鉴相邻领域的方法**\n借鉴**因果推断（Causal Inference）**和**动态系统理论（Dynamic Systems Theory）**。具体而言，引入**结构因果模型（Structural Causal Models, SCM）**来建模动作、状态和奖励之间的因果关系，而不是仅仅依赖统计相关性（如 Embedding 距离）。同时，借鉴**最优传输（Optimal Transport）**在动态分布匹配中的应用，将静态的 Wasserstein 距离扩展为**动态 Wasserstein 距离（Dynamic Wasserstein Distance）**或**Benamou-Brenier 公式**，以捕捉意图分布随时间的演化轨迹。\n\n**（c）第一个实验设计**\n提出 **Causal Hindsight Policy Optimization (CHPO)**。\n1.  **因果意图空间构建**：不再使用简单的 Embedding 模型，而是训练一个**因果编码器（Causal Encoder）**，该编码器不仅输出动作的语义向量，还输出其**因果效应向量（Causal Effect Vector）**，表示该动作对后续状态分布的干预效果。这可以通过对比学习（Contrastive Learning）结合反事实推理（Counterfactual Reasoning）来实现，即比较“执行动作 A”与“执行动作 B”在相同上下文下的状态转移差异。\n2.  **动态优势估计**：在因果意图空间中，计算当前策略分布与后见之明分布之间的**动态 Wasserstein 距离**。这不仅仅比较两个静态分布，而是比较它们随时间演化的轨迹。Kantorovich Potential 将被替换为**因果价值函数（Causal Value Function）**，它评估的是动作在因果链中的边际贡献，而非单纯的语义相似度。\n3.  **实验验证**：在 **TextCraft** 或 **AlfWorld** 等需要长期规划和因果推理的环境中，设计一个“因果混淆”任务，其中语义相似的动作具有不同的因果后果。例如，一个动作是“打开门”，另一个是“解锁门”，语义相似，但在某些状态下只有“解锁”才能导致成功。比较 CHPO 与 HPO 在此类任务上的表现。预期 CHPO 能够正确区分这两个动作的因果价值，而 HPO 会因语义相似而混淆它们。此外，分析 CHPO 的梯度信号是否更能反映动作的**因果重要性（Causal Importance）**，从而提供更准确的 Credit Assignment。\n\n**与已有工作的区别**\nHPO 是静态的、语义驱动的，而 CHPO 是动态的、因果驱动的。HPO 假设语义相似即价值相似，而 CHPO 假设因果效应相似即价值相似。CHPO 不仅降低了方差，还通过引入因果结构减少了偏差，特别是在需要精确因果推理的长视界任务中。这不仅仅是一个模块的添加，而是对“意图”和“价值”本质的重新定义，从统计相关性转向因果干预性。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Zishang Jiang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Tingyun Li\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jinyi Han\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xinyi Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Sihang Jiang\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yizhou Ying\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xiaojun Meng\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jiansheng Wei\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jiaqing Liang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Yanghua Xiao\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"School of Data Science, Fudan University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Shanghai Institute of Artificial Intelligence for Education, East China Normal University\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"College of Computer Science and Artificial Intelligence, Fudan University\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Huawei Large Model Data Technology Lab\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"†\",\n      \"text\": \"Correspondence to: Jiaqing Liang \u003Cliangjiaqing@fudan.edu.cn\u003E.\"\n    }\n  ]\n}\n```", "summary_translation": "强化学习（RL）已成为提升大型语言模型（LLMs）在复杂任务上表现的一种广泛应用的技术。尽管取得了这些进展，现有的 RL 方法在训练具有长程交互能力的智能体时仍面临挑战。一个主要瓶颈在于区分长程交互中不同动作的贡献，这导致了较高的优化方差。为了解决这一问题，我们提出了一种新颖的策略梯度方法——Hindsight Policy Optimization（HPO），该方法将当前策略分布和后见分布都投影到意图空间，并从它们之间的 Wasserstein 距离中提取低方差的学习信号。我们从理论和实证两方面证明，在意图空间中聚合语义相似的状态和动作能够产生有界方差的估计器，并稳定地提升策略性能。我们的代码已在线公开。"}, {"title": "AIGB-R1: Self-Evolving Generative Auto-Bidding via Hierarchical Planner-Executor Optimization", "arxiv_id": "2607.17281", "authors": "Yuejia Dou, Hesong Wang, Xinyu Zhang, Tianyu Wang, Zhilin Zhang, Chuan Yu, Jian Xu, Bo Zheng, Qi Qi", "summary": "Auto-bidding plays an essential role in online advertising, automatically adjusting bids for advertisers to optimize their commercial goals. The emerging AI-Generated Bidding (AIGB) paradigm widely adopts generative modeling to optimize bidding strategies, yet suffers from the limited mode coverage of offline datasets and inadequate task-state understanding, hindering effective exploration of optimal strategies. Large Language Models (LLMs), with prior world knowledge and reasoning capabilities, offer a promising approach to overcome these limitations. However, directly applying LLMs to auto-bidding tasks faces inherent challenges in limited numerical precision, hallucinations, and inference latency. To address these limitations, we propose AIGB-R1, a hierarchical self-evolving auto-bidding framework aiming to enhance AI-Generated Bidding via LLMs' Reasoning capabilities, comprising a high-level Planner module for macro-level strategy planning and a low-level Executor module for fine-grained decision-making. Building upon this, we design an experience-driven self-evolving loop, enabling autonomous strategy exploration and optimization from accumulated experience. We adopt a two-stage pipeline of offline pre-training and post-training alignment, and build an interactive bidding simulation environment for strategy rollout. Furthermore, we propose Decoupled Group Relative Policy Optimization (D-GRPO) to achieve end-to-end optimization via advantage decoupling. Experimental results on a large-scale public dataset demonstrate the effectiveness of AIGB-R1.", "category": "cs.LG", "cluster": "Agent Training \u0026 Optimization", "tags": ["cs.LG"], "filter_reason": "该论文完全符合“自我演化 (Self-Evolving)”和“单智能体 (Agentic)”的研究方向。\n\n1. 核心机制匹配：论文标题和摘要明确提出了“Self-Evolving”（自我演化）框架，并设计了“experience-driven self-evolving loop”（经验驱动的自我演化循环），允许智能体从积累的经验中进行自主策略探索和优化。这直接对应了筛选标准中关于智能体通过经验、反馈进行自我完善和迭代的核心目标。\n2. 智能体架构：论文构建了一个分层智能体系统（Hierarchical Planner-Executor），包含负责宏观策略规划的 Planner 和负责细粒度决策的 Executor。这属于典型的 Agentic AI 架构设计，涉及规划（Planning）和决策（Decision-making）能力。\n3. 训练与优化方法：论文提出了 D-GRPO 算法进行端到端优化，并涉及离线预训练和后训练对齐，这属于 Agent Training/Distillation 的范畴，旨在提升智能体的长期决策能力。\n4. 非排除项：虽然应用场景是自动出价（Auto-bidding），但论文的核心贡献在于提出了一种新的自我演化智能体框架和训练机制，而非仅仅将现有 LLM 应用于该领域。它不属于单纯的基础设施、安全对齐或图推理排除项。\n\n综上，该论文在方法论上贡献了新的自我演化智能体框架，符合研究焦点。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决在线广告自动出价（Auto-bidding）领域中，基于生成式模型（Generative Auto-bidding, AIGB）的方法所面临的**离线数据模式覆盖有限**、**任务状态理解不足**以及**难以适应多样化广告主偏好**的核心问题。尽管大型语言模型（LLMs）具备强大的推理和规划能力，但直接将其应用于自动出价任务时，面临着**数值精度低**、**幻觉（Hallucinations）**以及**推理延迟高**等固有缺陷，导致其无法直接作为端到端的决策执行器。因此，研究的关键在于如何构建一个既能利用 LLMs 宏观推理优势，又能规避其数值决策短板，并能通过自我进化持续优化策略的框架。\n\n该问题的重要性在于，随着在线广告竞价环境的日益复杂和实时性要求提高，传统的基于规则或强化学习（RL）的方法往往受限于马尔可夫假设或离线数据集的质量，难以在分布外（Out-of-Distribution, OOD）状态下做出最优决策。现有的生成式方法虽然提升了序列建模能力，但缺乏对策略深层语义的理解和动态调整能力。解决这一问题不仅能显著提升广告主的商业目标（如转化率最大化同时满足 CPA 约束），还能降低因重新训练模型以适应不同偏好带来的高昂计算成本，为 LLMs 在工业级高并发、低延迟决策场景中的应用提供新的范式。\n\n### § 2 前人工作与不足\n\n此前，自动出价问题主要通过强化学习（如 USCB, BCQ, CQL）和生成式模型（如 Decision Transformer, DiffBid）来解决。近期，部分研究开始探索 LLMs 在自动出价中的应用，例如 **RTBAgent** 直接使用 LLM 作为决策者，**SemBid** 利用 LLM 语义表示辅助序列建模，以及 **LBM** 设计了分层架构（Think-Act）并结合 GQPO 进行微调。\n\n然而，这些现有方法存在显著不足：\n1.  **直接应用 LLM 的局限性**：如 RTBAgent，直接受限于 LLM 在连续数值空间决策时的精度缺失和幻觉问题，且难以满足毫秒级响应的工业延迟要求。\n2.  **分层架构的优化缺陷**：如 LBM，虽然引入了分层思想，但其后训练（Post-training）阶段通常仅优化高层推理模块或冻结低层执行模块，缺乏端到端的联合优化，限制了全局最优策略的收敛。此外，其策略搜索往往依赖随机采样，探索效率低下，且未能有效复用历史 rollout 经验。\n3.  **价值估计与信用分配问题**：现有方法多依赖离线预训练的价值函数来评估策略质量，这在面对 OOD 策略时容易产生外推误差（Extrapolation Errors）。同时，在分层框架中，如何准确区分高层 Planner 的策略选择与低层 Executor 的执行贡献（即信用分配，Credit Assignment）是一个未被充分解决的难题，直接应用标准的 GRPO 会导致优势信号（Advantage Signal）的误归因，影响训练稳定性。\n\n因此，现有工作未能充分结合 LLMs 的推理能力与高效数值决策模型的优势，且缺乏一种能够基于积累经验进行自我进化、并实现精确层间信用分配的端到端优化机制。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Auto-bidding 领域，基于 Decision Transformer (DT) 的生成式方法虽然通过序列建模克服了传统 RL 的马尔可夫假设限制，但其性能严重受限于离线数据集的分布覆盖（Out-of-Distribution 问题）以及对任务状态理解的浅层化。研究者观察到，现有的生成式模型仅依赖 Return-to-Go (RTG) 进行条件生成，缺乏对宏观策略意图（如风险偏好、预算节奏）的显式推理能力，导致在复杂约束下难以规划出全局最优策略。\n\n与此同时，Large Language Models (LLMs) 展现出强大的语义理解、逻辑推理和少样本泛化能力，理论上能够弥补上述缺陷。然而，直接将 LLM 应用于 Auto-bidding 面临三大硬性瓶颈：一是 LLM 在连续数值空间上的决策精度不足且容易产生幻觉；二是 LLM 的推理延迟极高，无法满足在线广告毫秒级的竞价响应要求；三是 LLM 缺乏针对竞价任务的特定归纳偏置。\n\n为了解决这一矛盾，研究者借鉴了 LLM 在机器人控制或复杂任务规划中的“分层架构”思想（如 ReAct, SayCan），即让 LLM 负责高层级的语义规划（Planning），而让轻量级模型负责低层级的数值执行（Execution）。这种解耦设计既保留了 LLM 的推理优势，又规避了其数值和延迟短板。\n\n然而，分层架构引入了新的挑战：如何协同优化两个模块？传统的离线价值函数评估存在外推误差，而在线随机探索效率低下。研究者意识到，需要构建一个能够利用历史经验进行自我进化的闭环。通过引入交互式仿真环境（AuctionNetEnv）替代静态离线数据，并结合 Group Relative Policy Optimization (GRPO) 的思想，研究者发现直接应用 GRPO 会导致 Planner 和 Executor 之间的信用分配（Credit Assignment）混淆。因此，必须设计一种机制，将奖励信号正交分解为“策略选择质量”和“执行质量”，从而实现端到端的联合优化。这一系列思考最终导向了 AIGB-R1 框架的提出。\n\n### § 4 核心 Intuition\n\nAIGB-R1 的核心直觉在于将 Auto-bidding 从单纯的“数值序列预测”重构为“语义规划驱动的执行”过程，利用 LLM 的宏观推理能力克服离线数据的分布局限，同时通过轻量级 PDT 模型规避 LLM 的数值精度与延迟瓶颈。\n\n该方法的关键突破在于通过“经验驱动的自进化循环”和“解耦的优势估计（D-GRPO）”，解决了分层架构中高层策略与底层执行之间的信用分配难题，使得系统能够从仿真交互中自主区分“策略好坏”与“执行优劣”，从而实现端到端的持续优化。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**AIGB-R1** 是一个分层自进化的自动出价（Auto-bidding）框架，旨在通过结合大语言模型（LLM）的推理能力和轻量级决策模型（PDT）的执行效率，解决传统生成式出价方法在离线数据覆盖不足、任务状态理解有限以及LLM直接应用时存在的数值精度低、幻觉和延迟高等问题。\n\n其核心 Pipeline 分为两个阶段：**离线预训练（Pre-training）** 和 **在线后训练对齐（Post-training Alignment）**。\n\n#### 1. 架构组成\n*   **Planner（规划器）**：基于大型 LLM（如 Qwen2.5-32B），负责宏观层面的策略规划。它不直接输出出价，而是生成结构化的“策略提示（Strategy Prompt）”，包含离散的策略标签（如风险偏好）和语义化的推理过程。\n*   **Executor（执行器）**：基于 Prompt Decision Transformer (PDT)，是一个轻量级的因果 Transformer 模型。它接收数值序列（状态、动作、Return-to-Go）和 Planner 生成的策略提示，输出具体的出价参数（连续数值）。\n\n#### 2. 完整 Pipeline 示例\n假设某广告主需要在接下来的 48 个时间步（Timesteps）内进行竞价，目标是最大化转化量同时满足 CPA（单次行动成本）约束。\n\n**阶段一：离线预训练 (Pre-training)**\n1.  **数据标注**：使用 LLM 对历史离线出价轨迹数据进行标注，为每条轨迹生成对应的策略提示（Strategy Prompt）。\n2.  **Executor 训练**：训练 PDT 模型，使其能够根据输入的历史数值序列和策略提示，预测出正确的出价动作。此时 Planner 尚未参与训练，Executor 学习的是“给定策略下如何出价”的条件分布。\n\n**阶段二：在线后训练与自进化 (Post-training \u0026 Self-Evolving)**\n这是一个闭环的强化学习过程，在交互式仿真环境 **AuctionNetEnv** 中进行：\n\n1.  **环境初始化**：从任务池中采样一个广告主配置（预算、CPA 约束、类别），并加载该广告主的历史经验缓冲区（Experience Buffer），其中包含“最佳策略锚点”和“滑动记忆窗口”。\n2.  **Planner 推理 (Macro Planning)**：\n    *   **输入**：广告主上下文信息 + 历史经验缓冲区。\n    *   **处理**：LLM Planner 分析历史表现，推理出当前周期可能的最优宏观策略。\n    *   **输出**：生成 $M$ 个不同的策略提示（Strategy Prompts），例如：“激进型：前期快速消耗预算以获取高价值流量”、“保守型：严格控制 CPA，后期再加速”。\n3.  **Executor  rollout (Micro Execution)**：\n    *   **输入**：每个策略提示 + 当前环境状态。\n    *   **处理**：对于每个策略提示，PDT Executor 在 AuctionNetEnv 中执行 $K$ 次完整的竞价周期（Rollout）。在每个时间步，PDT 根据策略提示和实时状态输出出价。\n    *   **输出**：得到 $M \\times K$ 条轨迹，每条轨迹对应一个最终奖励（Reward），奖励函数综合考虑了转化量和 CPA 约束满足度。\n4.  **经验更新与信用分配 (Credit Assignment)**：\n    *   **更新缓冲区**：将新的轨迹和策略结果存入经验缓冲区，更新“最佳策略锚点”。\n    *   **优势分解 (D-GRPO)**：使用 **Decoupled Group Relative Policy Optimization** 算法计算优势函数（Advantage）。\n        *   **组间优势 (Inter-group)**：评估 Planner 生成的策略提示的质量（不同策略之间的差异）。\n        *   **组内优势 (Intra-group)**：评估 Executor 在特定策略下的执行质量（同一策略下不同轨迹的差异）。\n5.  **模型更新**：\n    *   利用组间优势更新 Planner 的参数，使其生成更优的宏观策略。\n    *   利用组内优势更新 Executor 的参数，使其在给定策略下出价更精准。\n6.  **循环迭代**：重复上述过程，实现策略的自主探索和持续进化。\n\n---\n\n### § 6 核心数学推导\n\n本文的核心数学贡献在于 **Decoupled Group Relative Policy Optimization (D-GRPO)** 算法中的奖励分解与优势估计。传统的 GRPO 在分层架构中难以区分 Planner 和 Executor 的贡献，导致信用分配（Credit Assignment）错误。AIGB-R1 通过正交分解解决了这一问题。\n\n#### 1. 奖励分解的直觉 (Intuition)\n在分层 Rollout 中，我们有一个 $M \\times K$ 的奖励矩阵 $R$，其中 $M$ 是策略提示的数量，$K$ 是每个策略下的轨迹数量。\n*   $r_{m,k}$ 表示第 $m$ 个策略提示下，第 $k$ 条轨迹的奖励。\n*   总奖励的波动来源于两部分：\n    1.  **策略选择的好坏**：即 Planner 选的策略 $m$ 本身是否优秀（组间差异）。\n    2.  **执行的好坏**：即在策略 $m$ 确定后，Executor 执行得是否稳定或出色（组内差异）。\n\n#### 2. 数学推导过程\n\n**定义均值：**\n*   第 $m$ 个策略的平均奖励：$\\bar{r}_m = \\frac{1}{K} \\sum_{k=1}^K r_{m,k}$\n*   全局平均奖励：$\\bar{r} = \\frac{1}{MK} \\sum_{m=1}^M \\sum_{k=1}^K r_{m,k}$\n\n**奖励偏差分解：**\n任意一个奖励 $r_{m,k}$ 相对于全局均值 $\\bar{r}$ 的偏差可以分解为：\n$$ r_{m,k} - \\bar{r} = (\\bar{r}_m - \\bar{r}) + (r_{m,k} - \\bar{r}_m) $$\n\n*   **第一项 $(\\bar{r}_m - \\bar{r})$**：**组间分量 (Inter-group component)**。它消除了 Executor 执行随机性的影响，仅反映策略 $m$ 相对于其他策略的优劣。这是 Planner 的优势信号来源。\n*   **第二项 $(r_{m,k} - \\bar{r}_m)$**：**组内分量 (Intra-group component)**。它消除了策略本身好坏的影响，仅反映在策略 $m$ 下，轨迹 $k$ 相对于该策略平均水平的表现。这是 Executor 的优势信号来源。\n\n**正交性证明 (Orthogonality)：**\n论文证明了这两个分量在 Frobenius 内积下是正交的，即它们的协方差为 0。这意味着 Planner 和 Executor 的学习信号是解耦的，互不干扰。\n$$ \\langle B, W \\rangle_F = \\sum_{m,k} (\\bar{r}_m - \\bar{r})(r_{m,k} - \\bar{r}_m) = 0 $$\n*直觉解释*：因为对于固定的 $m$，$(\\bar{r}_m - \\bar{r})$ 是常数，而 $\\sum_k (r_{m,k} - \\bar{r}_m) = 0$（组内偏差之和为零），所以总和为零。\n\n**优势估计 (Advantage Estimation)：**\n为了稳定训练，对分解后的分量进行标准化：\n*   Planner 的优势：$\\hat{A}^P_m = \\frac{\\bar{r}_m - \\bar{r}}{\\sigma_P}$，其中 $\\sigma_P$ 是组间分量的标准差。\n*   Executor 的优势：$\\hat{A}^E_{m,k} = \\frac{r_{m,k} - \\bar{r}_m}{\\sigma_E}$，其中 $\\sigma_E$ 是组内分量的标准差。\n\n**损失函数：**\n分别使用 PPO 风格的损失函数更新 Planner 和 Executor：\n$$ \\mathcal{J}_{GRPO}(\\theta_P) = \\mathbb{E} \\left[ \\min \\left( \\rho_m \\hat{A}^P_m, \\text{clip}(\\rho_m, 1-\\epsilon, 1+\\epsilon) \\hat{A}^P_m \\right) \\right] $$\n$$ \\mathcal{J}_{GRPO}(\\theta_E) = \\mathbb{E} \\left[ \\min \\left( \\rho_{m,k} \\hat{A}^E_{m,k}, \\text{clip}(\\rho_{m,k}, 1-\\epsilon, 1+\\epsilon) \\hat{A}^E_{m,k} \\right) \\right] $$\n其中 $\\rho$ 是重要性采样权重。\n\n---\n\n### § 7 实验设计与结论\n\n**提出了什么问题？**\n现有的生成式自动出价方法受限于离线数据分布，且直接应用 LLM 存在数值精度和延迟问题。现有的分层方法缺乏有效的端到端优化机制，无法充分利用 LLM 的推理能力进行策略自进化。\n\n**设计了什么实验验证这个问题？**\n1.  **基线对比 (Performance Comparison)**：\n    *   **数据集**：使用大规模公开数据集 AuctionNet 及其稀疏变体 AuctionNet-sparse。\n    *   **基线模型**：包括传统 RL 方法 (USCB, BCQ, CQL, IQL)、生成式方法 (DT, DiffBid, CBD, GAS, GAVE, PRO-Bid, GRAD) 以及 LLM 分层方法 (LBM)。\n    *   **指标**：Score（综合转化量和 CPA 约束满足度的指标）和 Conversions。\n    *   **泛化性测试**：在不同预算比例 (50%-150%) 下测试模型的鲁棒性。\n\n2.  **消融实验 (Ablation Study)**：\n    *   **AIGB-R1(E) w/o RL**：仅使用预训练的 Executor，无 Planner 和后训练。\n    *   **AIGB-R1(E)**：无 Planner，仅对 Executor 进行标准 GRPO 后训练。\n    *   **AIGB-R1(SP) w/o RL**：使用冻结的 LLM 作为静态 Planner，无后训练。\n    *   **AIGB-R1(SP)**：使用冻结的 LLM 作为静态 Planner，仅更新 Executor。\n    *   **AIGB-R1 (Full)**：完整的分层架构 + D-GRPO 端到端优化。\n\n**问题的答案是什么？**\n1.  **有效性**：AIGB-R1 在所有实验设置下均显著优于 SOTA 基线（包括 LBM 和高级生成式模型），证明了分层架构结合 LLM 推理和 PDT 执行的有效性。\n2.  **泛化性**：在不同预算设置下，AIGB-R1 保持了最佳性能，显示出强大的鲁棒性。\n3.  **组件必要性**：\n    *   后训练（Post-training）显著提升了性能，证明了离线预训练的局限性。\n    *   引入 Planner（即使是静态的）优于无 Planner，证明了宏观策略先验的价值。\n    *   **端到端优化（D-GRPO）** 显著优于静态 Planner，证明了 Planner 和 Executor 联合进化、信用解耦分配对于释放分层架构潜力的关键作用。", "additional_insights": "### § 8 Take-aways\n\nAIGB-R1 提出了一种分层架构，将 Auto-bidding 任务解耦为宏观策略规划（Planner）和微观出价执行（Executor），旨在利用 LLM 的推理能力同时规避其在数值精度和延迟上的固有缺陷。该框架通过 Prompt Decision Transformer (PDT) 作为轻量级 Executor，将 LLM 生成的结构化策略提示（Strategy Prompts）作为条件前缀，实现了语义策略对连续数值出价的引导。为了解决离线数据分布外（OOD）泛化能力差的问题，AIGB-R1 引入了基于 AuctionNetEnv 的交互式模拟环境，并通过经验驱动的自进化循环（Self-evolving Loop）进行在线策略探索，而非依赖盲目的随机采样。核心创新点 D-GRPO（Decoupled Group Relative Policy Optimization）通过正交分解奖励信号，将 Planner 的策略选择贡献与 Executor 的执行贡献解耦，实现了分层架构下的端到端信用分配（Credit Assignment）和联合优化。实验表明，该框架在 AuctionNet 基准上显著优于现有的生成式 Auto-bidding 基线（如 DT, GAS, GAVE）及 LLM 直接决策方法，证明了分层规划与执行分离在复杂序列决策任务中的有效性。\n\n### § 9 最脆弱的假设\n\n该方法最脆弱的假设是：**LLM Planner 生成的离散化、语义化的“策略提示”（Strategy Prompts）能够充分表征并有效指导 PDT Executor 在连续高维动作空间中的最优出价行为。**\n\n如果这一假设不成立，即语义策略与数值出价之间存在不可逾越的“语义-数值鸿沟”，或者最优出价策略无法被有限的离散标签（如 Risk Preference, Budget Pacing）和简短文本推理所捕捉，那么 Planner 的优化将失去对最终 Reward 的有效梯度指引，导致分层架构退化为两个独立且低效的模块。在实际中，Auto-bidding 的决策高度依赖于细微的数值特征（如实时竞争价格分布、瞬时转化率波动），这些细粒度信息可能被抽象为宏观策略时丢失，导致 PDT 即使拥有完美的执行能力，也因缺乏精确的数值引导而无法超越端到端的数值模型。论文通过消融实验（Ablation Study）中 AIGB-R1(SP) 优于 AIGB-R1(E) 的结果间接支持了该假设，表明策略提示确实提供了有价值的先验；然而，论文缺乏对“策略提示信息量”与“出价精度”之间相关性的定量分析，也未证明在极端稀疏或高噪声场景下，语义策略是否仍能保持对数值出价的强解释力，这留下了潜在的失效风险。\n\n### § 10 最小复现实验\n\n在 1 周时间内，可以复现 **D-GRPO 的奖励分解机制及其对信用分配的影响**，以验证分层优化中解耦优势估计的有效性，而无需从头训练完整的 LLM Planner 和 PDT Executor。\n\n**具体方案：**\n1.  **数据**：使用论文提供的 AuctionNet 公开数据集，或从 AuctionNet 基准中导出已有的轨迹数据（包含 State, Action, Reward）。\n2.  **实现**：\n    *   构建一个简化的模拟环境，固定一个预训练的 PDT Executor（或使用简单的线性模型作为代理 Executor）。\n    *   手动构造一组固定的、多样化的“策略提示”（例如：Aggressive, Conservative, Moderate），作为 Planner 的输出。\n    *   对于每个策略提示，让 Executor 生成多条轨迹，计算每条轨迹的总 Reward，形成 $M \\times K$ 的嵌套奖励矩阵。\n    *   实现 D-GRPO 的核心公式：计算组间奖励（Inter-group, 反映 Planner 质量）和组内奖励（Intra-group, 反映 Executor 质量），并验证其正交性（即 $\\langle B, W \\rangle_F = 0$）。\n    *   对比标准 GRPO（直接对所有轨迹计算优势）与 D-GRPO 在更新信号上的差异。\n3.  **测量**：\n    *   测量 Planner 和 Executor 在两种优势估计方法下获得的梯度方向或更新幅度。\n    *   观察在固定 Executor 的情况下，Planner 是否能够通过 D-GRPO 更准确地识别出高奖励策略提示（即 Inter-group 优势是否显著区分了不同策略）。\n4.  **结果判定**：\n    *   **支持**：如果 D-GRPO 计算出的 Planner 优势信号能更清晰地区分不同策略提示的优劣（相比标准 GRPO 的噪声），且组间/组内分解在数学上严格正交，则支持 D-GRPO 在解决分层信用分配问题上的有效性。\n    *   **反驳**：如果组间奖励差异极小，或者 D-GRPO 导致的更新方向与标准 GRPO 无显著差异，甚至导致训练不稳定，则表明在该简化设定下，解耦并未带来预期的优化收益，质疑其在复杂动态环境中的必要性。", "research_value": "### § 11 最强反例设计\n\n若要挑战 AIGB-R1 的有效性，最有力的攻击并非质疑其最终性能指标，而是揭示其核心创新 **D-GRPO** 在动态非平稳环境中的**信用分配失效（Credit Assignment Failure）**以及**语义-数值映射的脆弱性**。\n\n首先，从理论层面攻击 **D-GRPO 的正交性假设在序列决策中的局限性**。论文假设组间优势（Inter-group）和组内优势（Intra-group）在 Frobenius 内积下正交，从而解耦 Planner 和 Executor 的更新信号。然而，Auto-bidding 是一个典型的**马尔可夫决策过程（MDP）**，具有强烈的时序依赖性。Planner 生成的宏观策略（如“前期激进”）不仅影响当前时间步的奖励，更通过改变状态分布（State Distribution Shift）深刻影响后续时间步的 Executor 表现。如果 Planner 选择一个看似短期收益高但导致长期预算耗尽过快（Budget Pacing Failure）的策略，D-GRPO 的组间优势可能会错误地奖励该策略（因为短期 $\\bar{r}_m$ 高），而组内优势则无法纠正这种由宏观策略导致的长期结构性偏差。这种**时序信用分配错误（Temporal Credit Assignment Error）**会导致 Planner 学习到短视的局部最优策略，而 Executor 被迫在错误的宏观约束下“尽力而为”，最终导致整体策略在长周期竞价中崩溃。反例实验可设计为：在 AuctionNet 中引入具有显著“延迟奖励”特性的广告主配置（即前期低转化、后期高转化），观察 D-GRPO 是否会导致 Planner 过度偏好前期高转化策略，从而在总周期结束时因预算枯竭或 CPA 超标而失败，且该失败无法通过 Executor 的局部优化弥补。\n\n其次，从真实世界场景攻击**“语义提示”对高维数值空间的表征瓶颈**。AIGB-R1 假设离散的、文本化的 Strategy Prompt 足以指导 PDT 在连续出价空间中的行为。然而，在线广告竞价环境具有极高的**非平稳性（Non-stationarity）**和**高维稀疏性**。在真实场景中，最优出价往往取决于毫秒级的竞争价格波动、用户画像的细微特征组合以及实时库存状态，这些细粒度信息极难被压缩为几个宏观标签（如“激进”、“保守”）。反例可构造一个**“语义等价但数值异质”**的场景：两个不同的宏观策略提示（例如“稳健型”和“平衡型”）在语义上差异微小，但在特定竞争环境下，最优出价曲线却截然不同（例如一个需要高频小幅调整，另一个需要低频大幅跳跃）。由于 LLM Planner 生成的提示空间是离散且有限的，它可能无法区分这两种细微的数值需求，导致 PDT 接收到模糊或错误的条件信号。此时，AIGB-R1 的性能提升可能并非来自 LLM 的推理能力，而是来自 PDT 本身对历史数据的过拟合或随机探索的运气。通过对比实验，若发现当 Strategy Prompt 的粒度细化到一定程度后，性能不再提升，甚至因 LLM 的幻觉（Hallucinations）引入噪声而下降，即可证明该方法在复杂数值决策中存在根本性的**信息瓶颈（Information Bottleneck）**。\n\n### § 12 Follow-up Research Idea\n\n基于 AIGB-R1 在**语义-数值映射**和**时序信用分配**上的局限，提出一个新的研究方向：**Neuro-Symbolic Continuous Strategy Embedding with Temporal Credit Tracing (NS-CSE-TCT)**。\n\n**(a) 驱动局限与未满足需求：**\n现有方法（包括 AIGB-R1）试图用离散的文本提示（Text Prompts）作为宏观策略的载体，这忽略了策略空间的连续性和高维性。同时，分层架构中的信用分配往往依赖于事后奖励分解，缺乏对决策因果链的显式追踪。我们需要一种能够**连续表征宏观策略**、并能在训练过程中**显式追踪时序贡献**的方法，以解决 LLM 推理与数值执行之间的“语义鸿沟”以及长周期决策中的“信用模糊”问题。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴**神经符号学习（Neuro-Symbolic Learning）**和**可解释强化学习（Interpretable RL）**中的**因果图模型（Causal Graph Models）**与**连续潜在变量模型（Continuous Latent Variable Models）**。具体而言，引入**变分自编码器（VAE）**或**扩散模型（Diffusion Models）**来学习宏观策略的连续潜在表示（Continuous Strategy Embedding），而非离散的文本标签。同时，借鉴**Counterfactual Explanations**在 RL 中的应用，构建一个基于因果图的信用分配机制，显式建模 Planner 决策、Executor 动作与环境状态之间的因果依赖关系。\n\n**(c) 第一个实验设计：**\n1.  **架构设计**：\n    *   **Planner**：不再输出文本提示，而是输出一个低维连续向量 $z \\in \\mathbb{R}^d$（Strategy Embedding），该向量通过一个预训练的**Strategy-VAE**从历史成功轨迹中学习到，并具备可解释的语义维度（如“预算消耗速率”、“风险容忍度”等潜在因子）。\n    *   **Executor**：接收连续向量 $z$ 和当前状态，输出出价。\n    *   **Credit Tracing Module**：构建一个轻量级的**Causal Graph Neural Network (CGNN)**，在每次 Rollout 中记录 $z$、状态 $s_t$、动作 $a_t$ 和奖励 $r_t$ 之间的因果路径。利用**Do-calculus**或**Shapley Values**计算每个时间步 Planner 决策（$z$）对最终奖励的边际贡献，而非简单的组间/组内分解。\n2.  **实验设置**：\n    *   在 AuctionNet 上对比 AIGB-R1 与 NS-CSE-TCT。\n    *   **关键指标**：除了 Score 和 Conversions，增加**策略稳定性（Strategy Stability）**指标（衡量连续向量 $z$ 在相邻时间步的变化幅度）和**信用分配准确性（Credit Assignment Accuracy）**（通过人工标注或模拟环境中的已知因果结构来验证 CGNN 计算的贡献度是否与真实因果影响一致）。\n3.  **预期结果与区分度**：\n    *   预期 NS-CSE-TCT 能在高噪声、非平稳环境下表现出更优的鲁棒性，因为连续潜在空间能更细腻地捕捉策略差异，避免离散标签的量化误差。\n    *   更重要的是，CGNN 提供的因果信用分配能更准确地识别出导致长期失败的“坏策略”，从而引导 Planner 进行更有效的探索，解决 AIGB-R1 中 D-GRPO 可能存在的短视问题。\n    *   与 AIGB-R1 的区别在于：AIGB-R1 依赖 LLM 的文本生成能力和统计上的奖励分解，而 NS-CSE-TCT 依赖连续潜在空间的优化和因果推理，从根本上改变了宏观策略的表征方式和信用分配机制，提供了更强的可解释性和理论保证。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Yuejia Dou\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Hesong Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Xinyu Zhang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Tianyu Wang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zhilin Zhang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Chuan Yu\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Qi Qi\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Bo Zheng\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jian Xu\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Gaoling School of Artificial Intelligence, Renmin University of China\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Alibaba Group\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal contribution\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding author\"\n    }\n  ]\n}\n```", "summary_translation": "自动出价在在线广告中发挥着至关重要的作用，它通过自动调整出价帮助广告主优化其商业目标。新兴的 AI-Generated Bidding (AIGB) 范式广泛采用生成式建模来优化出价策略，但受限于离线数据集的模式覆盖范围有限以及对任务状态理解不足，阻碍了对最优策略的有效探索。大型语言模型（LLMs）凭借其先验世界知识和推理能力，为克服这些局限性提供了一种有前景的方法。然而，直接将 LLMs 应用于自动出价任务面临着数值精度有限、幻觉以及推理延迟等固有挑战。为了解决这些局限性，我们提出了 AIGB-R1，这是一个分层自进化自动出价框架，旨在通过 LLMs 的推理能力增强 AI-Generated Bidding，该框架包含用于宏观策略规划的高层 Planner 模块和用于细粒度决策的低层 Executor 模块。在此基础上，我们设计了一个经验驱动的自进化循环，能够从积累的经验中实现自主的策略探索和优化。我们采用了离线预训练和后训练对齐的两阶段流水线，并构建了一个交互式出价模拟环境用于策略 rollout。此外，我们提出了 Decoupled Group Relative Policy Optimi
