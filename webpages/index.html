<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperTools - 学术论文集合</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Marked.js 用于 Markdown 渲染 -->
    <script src="assets/marked-15.0.12.min.js"></script>
    <!-- KaTeX 仅在已展开的 Markdown 段落中渲染公式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <style>
        /* 微软雅黑字体 */
        body {
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        body::-webkit-scrollbar {
            display: none;
        }

        /* 移动端优化 */
        @media (max-width: 640px) {
            body {
                font-size: 14px;
            }

            /* 改善可点击区域 */
            button, a {
                min-height: 44px;
                min-width: 44px;
            }

            /* 优化间距 */
            .container {
                padding-left: 12px !important;
                padding-right: 12px !important;
            }
        }

        /* 星标样式 */
        .star-button {
            transition: color 0.2s ease-in-out;
        }
        .star-button.starred {
            color: #fbbf24;
        }
        .star-button:not(.starred) {
            color: #9ca3af;
        }
        .star-button:hover {
            color: #fbbf24;
        }
        /* 删除按钮样式 */
        .delete-button {
            transition: all 0.2s ease-in-out;
        }
        .delete-button:hover {
            color: #ef4444;
            transform: scale(1.1);
        }
        /* 论文项目样式 */
        .paper-item {
            transition: opacity 0.2s ease-out, transform 0.2s ease-out;
            content-visibility: auto;
            contain-intrinsic-block-size: auto 240px;
        }
        .paper-item.hidden-paper {
            opacity: 0.3;
            transform: scale(0.98);
        }
        /* 平滑过渡 */
        .rotate-90-transition {
            transition: transform 0.2s ease-in-out;
        }

        /* 论文卡片展开/收起 */
        .paper-expand-hint {
            padding: 4px 0;
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .paper-expand-hint:hover {
            color: #2563eb;
        }
        .dark .paper-expand-hint:hover {
            color: #60a5fa;
        }
        .paper-expand-hint .expand-arrow {
            display: inline-block;
            transition: transform 0.2s;
            font-size: 0.65rem;
            margin-right: 4px;
        }
        .paper-detail {
            border-top: 1px solid #e2e8f0;
            margin-top: 8px;
            padding-top: 8px;
        }
        .dark .paper-detail {
            border-top-color: #334155;
        }
        .paper-detail.hidden {
            display: none;
        }

        /* 可折叠部分样式 */
        .collapsible-header {
            cursor: pointer;
            display: flex;
            align-items: center;
            font-weight: 600;
            padding: 8px 0;
            user-select: none;
            color: #1e40af;
            transition: color 0.15s ease-out, opacity 0.15s ease-out;
        }
        .dark .collapsible-header {
            color: #60a5fa;
        }
        .collapsible-header:hover {
            opacity: 0.8;
        }
        .collapsible-header::before {
            content: "▶";
            margin-right: 8px;
            transition: transform 0.3s ease;
            font-size: 0.8em;
        }
        .collapsible-header.open::before {
            transform: rotate(90deg);
        }
        .collapsible-content {
            display: none;
        }
        .collapsible-content.open {
            display: block;
        }
        .collapsible-content .inner {
            padding-top: 8px;
        }

        @media (prefers-reduced-motion: reduce) {
            .paper-item,
            .collapsible-header,
            .collapsible-header::before,
            .paper-expand-hint .expand-arrow {
                transition: none;
            }
        }

        /* Markdown 内容样式 */
        .markdown-content {
            line-height: 1.6;
        }
        .markdown-content h1 {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 1em;
            margin-bottom: 0.5em;
            color: #1e40af;
        }
        .dark .markdown-content h1 {
            color: #60a5fa;
        }
        .markdown-content h2 {
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 0.8em;
            margin-bottom: 0.4em;
            color: #1e40af;
        }
        .dark .markdown-content h2 {
            color: #60a5fa;
        }
        .markdown-content h3 {
            font-size: 1.1em;
            font-weight: bold;
            margin-top: 0.6em;
            margin-bottom: 0.3em;
            color: #1e40af;
        }
        .dark .markdown-content h3 {
            color: #60a5fa;
        }
        .markdown-content h4 {
            font-size: 1em;
            font-weight: bold;
            margin-top: 0.5em;
            margin-bottom: 0.25em;
            color: #2563eb;
        }
        .dark .markdown-content h4 {
            color: #93c5fd;
        }
        .markdown-content p {
            margin-bottom: 0.8em;
        }
        .markdown-content ul, .markdown-content ol {
            margin-left: 1.5em;
            margin-bottom: 0.8em;
        }
        .markdown-content ul {
            list-style-type: disc;
        }
        .markdown-content ol {
            list-style-type: decimal;
        }
        .markdown-content li {
            margin-bottom: 0.3em;
        }
        .markdown-content code {
            background-color: #f1f5f9;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
        }
        .dark .markdown-content code {
            background-color: #334155;
        }
        .markdown-content pre {
            background-color: #f1f5f9;
            padding: 1em;
            border-radius: 5px;
            overflow-x: auto;
            margin-bottom: 0.8em;
        }
        .dark .markdown-content pre {
            background-color: #334155;
        }
        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
        }
        .markdown-content blockquote {
            border-left: 3px solid #cbd5e1;
            padding-left: 1em;
            margin-left: 0;
            margin-bottom: 0.8em;
            color: #64748b;
        }
        .dark .markdown-content blockquote {
            border-left-color: #475569;
            color: #94a3b8;
        }
        .markdown-content strong {
            font-weight: 600;
        }
        .markdown-content em {
            font-style: italic;
        }

        /* Tag filter button styles */
        .tag-btn {
            padding: 4px 14px;
            font-size: 0.875rem;
            border-radius: 9999px;
            border: 1px solid #cbd5e1;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .tag-btn:hover { border-color: #3b82f6; color: #3b82f6; }
        .tag-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .dark .tag-btn { border-color: #475569; color: #94a3b8; }
        .dark .tag-btn:hover { border-color: #60a5fa; color: #60a5fa; }
        .dark .tag-btn.active { background: #2563eb; color: white; border-color: #2563eb; }

        /* Tag badge styles */
        .tag-badge {
            display: inline-block;
            padding: 1px 6px;
            font-size: 0.7rem;
            border-radius: 9999px;
            background: #dbeafe;
            color: #1e40af;
            margin-right: 4px;
        }
        .tag-badge.tag-arxiv {
            background: #e0f2fe;
            color: #0369a1;
        }
        .dark .tag-badge { background: #1e3a5f; color: #7dd3fc; }
        .dark .tag-badge.tag-arxiv { background: #164e63; color: #67e8f9; }

        /* 作者机构上标样式 */
        .author-aff {
            vertical-align: super;
            font-size: 0.65em;
            color: #3b82f6;
            margin-left: 1px;
        }
        .dark .author-aff {
            color: #60a5fa;
        }

        /* 桌面端正文使用移除右栏后释放的宽度，同时避开左侧目录。 */
        #content-column {
            width: 100%;
        }
        @media (min-width: 1024px) {
            #content-column {
                width: min(1024px, calc(100% - 260px));
                margin-left: max(240px, calc((100% - 1024px) / 2));
                margin-right: auto;
            }
        }

        /* TOC 侧边栏样式 - 固定在左侧 */
        #toc-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            z-index: 35;
            background: white;
            border-right: 1px solid #e2e8f0;
            transition: transform 0.3s ease;
            overflow: hidden;
        }
        .dark #toc-sidebar {
            background: #1e293b;
            border-right-color: #334155;
        }
        #toc-sidebar.collapsed {
            transform: translateX(-100%);
        }
        #toc-inner {
            padding: 1rem 0.5rem;
            height: 100%;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        #toc-inner::-webkit-scrollbar {
            width: 4px;
        }
        #toc-inner::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 2px;
        }
        .dark #toc-inner::-webkit-scrollbar-thumb {
            background: #475569;
        }
        .toc-date {
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toc-date:hover {
            background: #e2e8f0;
        }
        .dark .toc-date:hover {
            background: #334155;
        }
        .toc-date.active {
            background: #dbeafe;
            color: #1e40af;
        }
        .dark .toc-date.active {
            background: #1e3a5f;
            color: #93c5fd;
        }
        .toc-date-arrow {
            transition: transform 0.2s;
            font-size: 0.65rem;
        }
        .toc-date-arrow.open {
            transform: rotate(90deg);
        }
        .toc-papers {
            display: none;
            padding-left: 1.2rem;
        }
        .toc-papers.open {
            display: block;
        }
        .toc-paper {
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 3px;
            font-size: 0.8rem;
            line-height: 1.35;
            color: #64748b;
            transition: background 0.15s, color 0.15s;
            display: block;
            white-space: normal;
            overflow-wrap: anywhere;
            max-width: 100%;
        }
        .toc-paper:hover {
            background: #f1f5f9;
            color: #1e40af;
        }
        .dark .toc-paper {
            color: #94a3b8;
        }
        .dark .toc-paper:hover {
            background: #1e293b;
            color: #93c5fd;
        }
        .toc-paper.active {
            background: #eff6ff;
            color: #1d4ed8;
            font-weight: 500;
        }
        .dark .toc-paper.active {
            background: #1e3a5f;
            color: #93c5fd;
        }
        .toc-expand-all {
            width: calc(100% - 8px);
            margin: 5px 4px 6px;
            padding: 5px 8px;
            border: 1px solid #bfdbfe;
            border-radius: 5px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .toc-expand-all:hover {
            background: #dbeafe;
            border-color: #93c5fd;
        }
        .dark .toc-expand-all {
            background: rgba(30, 58, 95, 0.55);
            border-color: #1e40af;
            color: #93c5fd;
        }
        .dark .toc-expand-all:hover {
            background: #1e3a5f;
        }
        /* TOC 切换按钮 - 左侧 */
        #toc-toggle {
            position: fixed;
            left: 220px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 40;
            width: 28px;
            height: 56px;
            border-radius: 0 6px 6px 0;
            background: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 0 8px rgba(0,0,0,0.15);
            transition: left 0.3s ease, background 0.2s;
        }
        #toc-toggle:hover {
            background: #2563eb;
        }
        #toc-toggle svg {
            transition: transform 0.3s;
        }
        #toc-toggle:not(.sidebar-open) {
            left: 0;
        }
        @media (max-width: 1023px) {
            #toc-sidebar {
                width: 240px;
            }
            #toc-toggle {
                left: 240px;
            }
            #toc-toggle:not(.sidebar-open) {
                left: 0;
            }
        }
        @media (max-width: 767px) {
            #toc-sidebar {
                width: 260px;
                box-shadow: 4px 0 16px rgba(0,0,0,0.1);
            }
            #toc-toggle {
                left: 260px;
            }
            #toc-toggle:not(.sidebar-open) {
                left: 0;
            }
        }

    </style>
    <script>
        // Tailwind CSS 暗色模式配置
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 font-sans text-slate-800 dark:text-slate-200">

            <span id="toast-message" class="text-sm sm:text-base">已删除</span>

    <!-- TOC 切换按钮 -->
    <button id="toc-toggle" class="hidden lg:flex sidebar-open" onclick="toggleTocSidebar()" title="切换目录">

    <div class="flex mx-auto max-w-none">

    <div id="content-column" class="p-3 sm:p-4 lg:p-6">

        <header class="mb-4 sm:mb-6">

                    </button>

                    </button>

                    <button id="summary-toggle" class="px-2.5 py-1.5 sm:px-3 sm:py-2 text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 rounded-md hover:bg-slate-200 dark:hover:bg-slate-600 focus:outline-none transition-colors whitespace-nowrap">

        </header>

        <!-- 主要内容区域 -->
        <main class="space-y-6 sm:space-y-8" id="main-content">

    <!-- 左侧 TOC 侧边栏（固定定位） -->

        <div id="toc-inner">
            <div class="flex items-center justify-between mb-2 px-2">
                <span class="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">目录</span>

    <script>
        const allPapers = {"2026-09-15": [{"name": "Agent Memory \u0026 Inference Optimization", "count": 2, "papers": [{"title": "AgentKV: Phase-Aware KV Eviction for Agentic LLMs", "arxiv_id": "2609.14872", "authors": "Taowen Tony Liu, Jeffrey T. H. Wong, Can Xiao, Bowen Yang, Hao Mark Chen, Yiren Zhao", "summary": "Agentic serving can consume orders of magnitude more tokens than chatbot workloads, stressing both KV-cache capacity and decode-time bandwidth. Most KV-eviction methods score cached keys against representative queries drawn from the most recent tokens, assuming future attention resembles recent attention. We show that agentic generation violates this assumption: future queries form a mixture over think, act, tool, and others phases, and principal-angle analysis shows these components occupy measurably different query subspaces, so recency representatives systematically undervalue keys that upcoming phases will need. We propose AGENTKV, which maintains a small query buffer per phase and scores cached keys against their union. We further implement AGENTKV in a persistent multi-turn serving path that carries compressed KV state across turns and compacts retained KV pages online. Across two models, six task domains, and three KV budgets each, AGENTKV improves task score by 5.5 points on average over R-KV and 5.3 over Tri-attention. Relative to upstream full-KV SGLang, AGENTKV improves output-token throughput by up to 1.80x. Code: https://github.com/LiuTaowen-Tony/agentkv.", "category": "cs.LG", "cluster": "Agent Memory \u0026 Inference Optimization", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic LLMs)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的核心问题是：在多轮 agentic LLMs 推理场景下，如何有效进行 KV-cache eviction 以缓解显存容量与 decode-time 带宽瓶颈，同时避免因 eviction 策略不当导致的任务质量下降。随着 LLMs 从单轮对话转向工具增强的 agentic workloads，token 消耗量急剧增加（可达传统 chatbot 的 1000 倍），这使得 KV-cache 成为限制 serving throughput 和 latency 的主要瓶颈。现有的 KV-cache 压缩方法通常基于“近期注意力可预测未来注意力”的假设，利用最近的 queries 作为代表来评估 cached keys 的重要性。然而，论文指出 agentic generation 违背了这一平稳性假设：agent 的轨迹在 think、act、tool 和 others 四个阶段间交替，且通过 principal-angle analysis 证明这些阶段的 queries 占据着显著不同的 subspaces。因此，基于 recency 的 eviction 策略会系统性地低估未来阶段所需的关键 keys。解决这一问题不仅能显著提升多轮 agent 任务的质量，还能通过物理层面的 KV-page compaction 与 allocator-level reuse，将压缩后的 KV state 转化为实际的 serving concurrency 提升和 throughput 增长（最高达 1.80×），对降低长周期 agent 的部署成本具有重大工程价值。\n\n### § 2 前人工作与不足\n在 KV-cache eviction 领域，前人研究多采用 query-centric 框架，即通过一小部分 representative queries 来估计 cached keys 的重要性并保留 top-B tokens。代表性方法包括基于累积注意力保留 heavy hitters 的 H2O、利用 attention sinks 与 sliding window 的 StreamingLLM、基于近期 observation window 选择 informative tokens 的 SnapKV，以及引入 redundancy penalty 的 R-KV。这些方法在单轮或平稳生成的假设下表现良好，但在 agentic 场景中存在根本性缺陷。它们之所以未能考虑 phase structure，是因为其底层逻辑将未来的 query distribution $p(q)$ 假设为一个平稳过程，并用最近窗口的经验分布 $p_{recent}(q)$ 来近似它。这种假设在单轮 chatbot 中成立，但在多轮 agent 轨迹中，query distribution 会在不同 semantic phases 间发生非平稳的转移。由于不同阶段的 queries 在几何表示上占据不同的 subspaces，recency representatives 只能覆盖当前阶段的 query 分布，导致对未来阶段（如从 think 转向 tool）至关重要的 keys 被错误地 evict。此外，在系统实现层面，先前的 KV-eviction 方法通常缺乏针对 persistent multi-turn inference 的 serving path 设计。它们没有实现在跨轮次工具调用中维持压缩状态、在线 compact retained KV pages 并将释放的显存交还 allocator 的机制，导致逻辑上的 cache 压缩无法转化为实际的 decode-time 内存流量减少或并发度提升。", "core_insight": "### § 3 重建作者的思考路径\n\n在 agentic LLMs 兴起之初，研究者们发现其多轮交互与工具调用特性导致 token 消耗量比传统 chatbot 高出几个数量级，这给 KV-cache 容量和 decode-time bandwidth 带来了巨大压力。为了缓解这一瓶颈，社区提出了许多 query-centric 的 KV-cache eviction 方法，如 H2O、SnapKV 和 R-KV。这些方法的核心逻辑是：利用最近的 representative queries 去评估 cached keys 的重要性，其隐含假设是未来的 attention 分布与最近的分布相似，即 query 分布是 stationary 的。\n\n然而，当将这些方法应用于 agentic workloads 时，作者观察到了潜在的失败模式。Agentic 轨迹并非单一的平稳过程，而是由 think、act、tool 和 others 等语义阶段交替构成的。如果当前处于 think 阶段，基于 recency 的 eviction 策略会主要保留对当前推理有用的 keys，而可能丢弃了接下来 act 或 tool 阶段所依赖的上下文信息（如工具描述或历史观测结果）。这意味着 recency representatives 系统性地低估了未来阶段所需的 keys。\n\n为了验证这一直觉，作者从表示空间的几何结构入手。借鉴已有关于 hidden states 中 phase 可线性检测的研究，作者推测不同阶段的 query vectors 也会占据不同的 subspaces。通过 t-SNE 可视化和 principal-angle analysis，作者证实了不同 agentic phases 之间的 query subspaces 确实存在显著差异，而同一 phase 在不同步骤间的 query 方向则更为对齐。这一理论线索直接证明了 agentic 场景下 query 分布的非平稳性及 phase 结构。\n\n基于上述观察与验证，作者自然地推导出了改进方案：既然未来 queries 是一个跨阶段的 mixture，那么 representative queries 也应该覆盖这个 mixture，而不是仅局限于最近的窗口。因此，为每个 phase 维护一个独立的 query buffer，并在 eviction 时用这些 buffers 的并集来给所有 cached keys 打分，就能无偏地估计 keys 在未来各阶段中的重要性，从而保留真正有用的全局上下文。\n\n### § 4 核心 Intuition\n\n现有的 KV eviction 方法假设未来的 attention 模式与最近的相似，但在 agentic LLMs 中，模型会在 think、act、tool 等不同阶段间切换，且这些阶段的 query 分布在几何上占据不同的 subspaces。因此，仅用最近的 queries 评估 KV entries 会系统性地丢弃未来阶段所需的关键信息。AGENTKV 的核心直觉是：为每个 phase 维护一组代表性的 queries，并用它们的并集来评估所有 cached keys，从而确保保留的 KV cache 能够覆盖未来所有可能阶段的 attention 需求。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Token \u0026 Query] -\u003E (Phase Parser, Alg.1) -\u003E [Phase Label]\n                                                |\n                                                v\n                               (Push to Phase FIFO Buffer)\n                                                |\n                                                v\n                             (Compression Event? Every 128 tok)\n                                         /            \\\n                                       No             Yes\n                                       /                \\\n                                      v                  v\n                             [Normal Decode]    (Concat Buffers \u0026 Score Keys, Alg.2)\n                                                         |\n                                                         v\n                                               (Keep Top-B \u0026 Evict Rest)\n                                                         |\n                                                         v\n                                               (Physical Compaction, Alg.3)\n                                                         |\n                                                         v\n                                             [Persistent KV State]\n```\n\nAGENTKV 的完整推理与压缩 Pipeline 包含以下步骤：\n\n1. **Phase Parsing \u0026 Buffering**：输入是当前生成的 token 及其对应的 query vector。系统通过基于 chat-template markers 的 deterministic parser（Algorithm 1）判定当前 token 所属的 agentic phase（think, act, tool, others），并将该 query 推入对应 phase 的 FIFO buffer 中。此过程无需模型内部的 classifier，仅依赖 tokenizer-visible 的结构标记（对应正文 §3.3 与 Algorithm 1）。\n2. **Compression Trigger**：在 decode 阶段，每生成 128 个 tokens 触发一次 compression event。若未达到触发阈值，模型继续正常 decode；若触发，则进入打分与驱逐流程（对应正文 §4.1 与 Algorithm 2）。\n3. **Phase-Aware Scoring**：触发压缩时，系统合并四个 phase buffer 中的 recent queries 形成代表集 $Q_e$。随后计算所有 candidate keys 对 $Q_e$ 的 average attention mass，以此作为 key 的重要性分数。这种基于 phase mixture 的打分机制避免了 recency bias 导致的跨 phase 关键信息丢失（对应正文 §3.3 与 Algorithm 2）。\n4. **Eviction \u0026 Compaction**：结合 protected indices（如 attention sinks），系统保留分数最高的 top-B 个 keys 并驱逐其余 keys。随后执行物理 compaction（Algorithm 3），将保留的 KV entries 写入新的连续 slots，释放旧 pages 给 allocator。这一步确保了逻辑上的 eviction 能转化为实际的 memory traffic 减少和并发度提升，并维持跨轮次的 persistent KV state（对应正文 §3.4 与 Algorithm 3）。\n\n### § 6 核心数学推导\n\n本论文的核心理论分析在于证明 agentic 场景下 query distribution 的 phase structure，以及 recency-based eviction 产生的估计偏差。\n\n首先是 **Query-centric 重要性评估**。Query-centric 方法通过计算 candidate key $i$ 在代表性 query 集 $Q$ 下的平均注意力权重来评估其重要性：\n$$A_i = \\frac{1}{|Q|} \\sum_{q \\in Q} \\text{softmax}(q^\\top K)_i$$\n**Intuition**：在 attention 机制中，query $q$ 和 key $k$ 的点积决定了注意力分配。为了预测某个 key $i$ 在未来是否重要，我们用一组历史 representative queries $Q$ 来模拟未来的 queries。如果 key $i$ 在这些 queries 下获得了较高的平均注意力 $A_i$，说明它是个“heavy hitter”，应该被保留。\n\n从概率视角看，这等价于在估计的未来 query 分布 $\\hat{p}(q)$ 下计算期望注意力：\n$$\\mathbb{E}_{q \\sim \\hat{p}(q)} [\\text{softmax}(q^\\top K)_i]$$\n**Intuition**：Recency-based 方法假设 $\\hat{p}(q)$ 等于最近 queries 的经验分布。但论文指出，agentic 场景下的真实分布 $p(q)$ 是不同 phase 的 mixture。用单峰的 recency 分布去近似多峰的 phase mixture 分布，会系统性地低估非当前 phase 的 keys 的重要性。\n\n为了验证 phase structure 的存在，论文使用了 **Principal Angle Analysis**。对于某个 phase span $s$，将其 query vectors 堆叠成矩阵 $X_s$ 并进行 SVD：$X_s = U_s \\Sigma_s V_s^\\top$。提取前 $k$ 个右奇异向量 $V_{s,k}$ 作为该 span 主方向的 orthonormal basis。比较 span $s$ 和 $t$ 的子空间重叠度时，计算 $V_{s,k}^\\top V_{t,k}$ 的奇异值：\n$$\\sigma_i(V_{s,k}^\\top V_{t,k})$$\n**Intuition**：SVD 提取了 query 矩阵的主要能量方向。两个子空间基向量的内积矩阵的奇异值，衡量了它们在不同方向上的对齐程度。奇异值越接近 1，说明两个 phase 的 query 方向越重合（夹角接近 0）；越接近 0，说明方向越正交（夹角接近 90 度）。实验表明，不同 phase 间的 principal angle 显著大于同 phase 内的 angle，证明了不同 phase 占据不同的 query subspaces。\n\n最后是 **Utility Coverage** 评估。定义 token $i$ 的 future utility 为 $U_i = \\sum_{j \u003E i_{\\text{comp}}} a_{j,i}$。对于 phase $\\phi$，其 utility coverage 定义为：\n$$UC_\\phi = \\frac{\\sum_{i \\in R_\\phi \\cap \\phi} U_i}{\\sum_{i \\in K_\\phi} U_i}$$\n**Intuition**：$U_i$ 是一个离线计算的 oracle 指标，统计了 token $i$ 在压缩点之后被所有未来 query 关注的总和。$UC_\\phi$ 衡量了某种保留策略 $R_\\phi$ 为 phase $\\phi$ 保留了多少比例的未来注意力信息。实验发现，recency 方法对 tool phase 的 $UC$ 极低，而 AGENTKV 的 multi-phase representatives 显著提升了这一指标。\n\n### § 7 实验设计与结论\n\n**问题1：Agentic 推理中，不同 phase 的 query 是否占据不同的 subspaces，导致 recency-based eviction 存在 bias？**\n**实验设计**：作者通过 principal angle analysis 量化了不同 layer 和 head 上各 phase 的 query subspaces 夹角，并通过 offline utility-coverage diagnostic 测量了 recency 和 multi-phase representatives 对各 phase 未来注意力信息的保留比例。\n**实验结论**：不同 phase 的 query subspaces 确实存在显著几何差异。Recency representatives 会系统性地低估 tool 等 non-recent phase 的 keys，而 AGENTKV 的 multi-phase representatives 能显著恢复这些被忽略的 utility。\n\n**问题2：AGENTKV 相比现有 KV eviction 方法能否提升多轮 agentic 任务的质量？**\n**实验设计**：在 BFCL 和 $\\tau^2$-bench 上，使用 Qwen3-32B 和 Qwen3-8B，在三种 KV budget 下端到端对比 AGENTKV, R-KV 和 Tri-attention 的任务准确率。\n**实验结论**：AGENTKV 在 multi_turn 等需要跨 phase 长程依赖的任务上提升最明显，平均任务得分比 R-KV 提升 5.5 分，比 Tri-attention 提升 5.3 分。在仅需近期 tool response 的任务（如 airline）中，不同方法差异较小。\n\n**问题3：AGENTKV 的性能提升是否真正来源于 phase-aware 机制，而非 serving path 的工程优化？**\n**实验设计**：进行 Matched recent-query ablation。在完全相同的 serving path、pooling 机制和 KV budget 下，仅将 AGENTKV 的 phase buffers 替换为等量的 recent queries。\n**实验结论**：在排除了系统工程优化的干扰后，phase-aware representatives 依然平均提升了 4.2 分，证明了 phase mixture 建模本身对跨阶段状态保留的有效性。\n\n**问题4：AGENTKV 能否在实际 serving 系统中转化为吞吐量收益？**\n**实验设计**：在 H100 NVL 和 RTX A6000 上，对比 AGENTKV 实现与 upstream full-KV SGLang 的 output-token throughput，并在统一 serving path 下对比不同 eviction policy 的吞吐量。\n**实验结论**：通过在线 compaction 和 allocator-level reuse，AGENTKV 将逻辑上的 cache 压缩转化为实际的 memory traffic 减少和并发度提升。在 32k/1k 的 prompt/generation 设置下，最高实现了 1.80x 的吞吐量提升，且在相同 budget 下始终优于其他共享 path 的 policy。", "additional_insights": "### § 8 Take-aways\nAgentic workloads 违背了 recency-based KV eviction 的平稳性假设，因为未来的 queries 会在 think, act, tool 和 others 四个 phases 之间切换，而这些 phases 占据着几何上可区分的 query subspaces。AGENTKV 通过为每个 phase 维护独立的 FIFO query buffer，并根据这些 phase-aware representatives 的并集对 cached keys 进行评分，从而纠正了 recency bias。该方法在 persistent multi-turn serving path 中实现了 online KV-page compaction 与 allocator-level reuse，将逻辑上的 eviction 转化为物理内存的节省与并发度的提升。实验表明，AGENTKV 在中间 KV budgets 下显著提高了 task utility coverage 和 end-to-end accuracy，同时相对于 full-KV SGLang 将 output-token throughput 最高提升了 1.80 倍。\n\n### § 9 最脆弱的假设\n最脆弱且失败代价最大的假设是：不同 agentic phases（think, act, tool, others）的 query vectors 占据着几何上可区分的 subspaces。如果这个假设不成立，例如在某些高度交织的复杂推理任务中，模型在同一 phase 内频繁混合使用不同功能，或者 attention heads 实际上是按语法/语义功能而非 phase label 进行划分的，那么基于 phase mixture 的评分将退化为带有噪声的 recency 评分，核心贡献直接失效。在实际部署中，该假设还隐含了对确定性 phase parsing 的依赖，这在自定义 agent 框架或非标准 tool-call 格式中可能不成立。论文为该假设提供了 principal-angle analysis（显示 inter-phase angles 显著大于 intra-phase angles）和 t-SNE 可视化作为几何证据，并通过 utility-coverage 诊断证明了 multi-phase representatives 确实能恢复 recency 遗漏的 tool utility。然而，论文缺少证据证明这种 subspace separation 在更广泛的 model architectures 或 phase boundaries 模糊的极端复杂任务中依然稳健。\n\n### § 10 最小复现实验\n如果有 1 周时间，可以通过一个纯离线的 utility-coverage 分析来最小化复现其核心动机，无需构建复杂的 persistent serving path。使用 Qwen3-8B 模型在 BFCL multi_turn_base 数据集（200 个 instances）上运行标准的 multi-turn agent generation，并记录所有 layers 和 heads 的 query vectors 与 attention weights。利用论文的 Algorithm 1 将 tokens 解析为四个 phases，并在几个代表性的 (layer, head) 对上计算 principal angles，比较 intra-phase 与 inter-phase 的 span pairs。接着，在每个 compression event 处，分别使用 recency representatives（最后 32 个 queries）和 multi-phase representatives（每个 phase 8 个 queries）计算各 phase 的 utility coverage $UC_\\phi$。如果实验结果显示 inter-phase principal angles 显著大于 intra-phase angles，且 multi-phase representatives 的 tool phase utility coverage 相比 recency 有显著提升（如论文中从 0.04 提升至 0.17），则支持其“phase structure 存在且 recency 存在 bias”的 claim；若两者 angles 相近或 utility coverage 无显著差异，则直接反驳其核心前提。", "research_value": "### § 11 最强反例设计\n要对该论文进行最有力的攻击，核心在于挑战其根本假设：即性能提升源于“不同 agentic phases 占据几何上可区分的 query subspaces”。我设计了一个“Random-Partition Ablation”实验结合“Phase-Blurred Task”来提出替代解释。具体而言，在完全相同的 serving path 和 KV budget 下，我将废弃论文基于 chat-template markers 的 deterministic phase parser，转而将最近的 query window 随机均分为四个等大的 FIFO buffers，并使用这些随机分组的 representatives 的并集进行 key scoring。如果这个 Random-Partition 变体能够取得与 AGENTKV 相当的 task accuracy 和 utility coverage，那么论文的核心理论便被推翻：性能提升的真正来源并非“phase-aware”的语义结构，而仅仅是因为从更宽广的历史窗口中采样 queries 增加了 representative set 的 diversity，从而缓解了纯 recency 造成的 attention collapse。此外，我会在 ReAct 或复杂代码生成等 phase boundaries 极度模糊的真实场景中测试该方法。在这些场景下，模型在同一生成片段内高频交织 think 和 act 功能，且不依赖标准的 tool-call markers。由于缺乏明确的 tokenizer-visible 结构标记，Algorithm 1 将退化为将所有 tokens 归入单一 phase，此时 AGENTKV 将完全退化为标准的 recency-based eviction，而其维护多 phase buffer 的额外开销将变得毫无意义。这一反例不仅提供了“diversity sampling 替代解释”，还精准识别了方法在非标准 agentic 框架中可预测失效的条件。\n\n### § 12 Follow-up Research Idea\n基于 AGENTKV 依赖确定性 phase parsing 且将 query distribution 视为离散静态 mixture 的局限，我提出一个全新的研究方向：**Latent-Intent-Aware KV Eviction via Continuous State Tracking**。该想法驱动的核心局限是，真实 agentic workloads 中的 query distribution 演化是连续且高度动态的，硬性将其划分为 think/act/tool 等离散 bins 不仅需要脆弱的 chat-template 依赖，还忽略了同一 phase 内部不同推理深度的 subspace 漂移。为了解决这一未满足的需求，我们可以借鉴相邻领域——如 Reinforcement Learning 中的 Partially Observable Markov Decision Processes (POMDPs) 或在线聚类算法——来构建一个轻量级的 latent state tracker。具体而言，不再使用规则解析器打标签，而是用一个极小的 recurrent network (如 lightweight GRU 或 Linear Attention) 在 decode 阶段实时吸收历史 query vectors，输出一个 continuous latent intent state，并基于该 state 预测未来的 query distribution $\\hat{p}(q)$，进而动态调整 KV-cache eviction 的 scoring weights。第一个实验将设计一个 “Implicit-ReAct Benchmark”，强制模型在不使用任何特殊 tokens 的情况下进行隐式工具调用与推理交织。我们将对比 full-KV、SnapKV (recency)、AGENTKV (discrete phase) 与提出的 Latent-Intent 方法在 utility coverage 和端到端准确率上的表现。区别于现有所有基于硬性规则或近期窗口的 query-centric 方法，本提议将 KV-cache 管理从“对历史静态特征的聚类”重构为“对未来 attention 意图的连续预测”，彻底打破对显式 prompt 结构的依赖，为无边界、长周期 agentic serving 开辟新路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Taowen Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jeffrey T. H. Wong\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Can Xiao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Bowen Yang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Hao Mark Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yiren Zhao\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Imperial College London\"},\n    {\"id\": 2, \"name\": \"Columbia University\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "Agentic serving 消耗的 tokens 比 chatbot workloads 多出数个数量级，给 KV-cache capacity 和 decode-time bandwidth 都带来了压力。大多数 KV-eviction methods 使用从最近的 tokens 中提取的 representative queries 对缓存的 keys 进行评分，假设 future attention 类似于 recent attention。我们表明，agentic generation 违背了这一假设：future queries 由 think, act, tool 及其他 phases 混合而成，并且 principal-angle analysis 表明这些组件占据了明显不同的 query subspaces，因此 recency representatives 会系统性地低估 upcoming phases 将需要的 keys。我们提出了 AGENTKV，它为每个 phase 维护一个小的 query buffer，并根据它们的并集对缓存的 keys 进行评分。我们进一步在一个 persistent multi-turn serving path 中实现了 AGENTKV，该路径在多轮之间携带压缩的 KV state，并在线压缩保留的 KV pages。在两个模型、六个任务领域以及各自的三个 KV budgets 上，AGENTKV 相比 R-KV 平均将 task score 提高了 5.5 分，相比 Tri-attention 提高了 5.3 分。相对于 upstream full-KV SGLang，AGENTKV 将 output-token throughput 最多提高了 1.80 倍。代码：https://github.com/LiuTaowen-Tony/agentkv。"}, {"title": "LIMBO: Lifelong Inference-Time Memory and Budget Optimization for LLM Agents", "arxiv_id": "2609.14138", "authors": "Siddharth Sharma, Nilesh Prasad Pandey, Onat Gungor, Tajana Rosing", "summary": "As LLM agents become integrated into increasingly complex workflows, they must continually acquire new capabilities while retaining competence on previously learned tasks. Lifelong agents address this through experience replay, injecting past interactions into the prompt to leverage prior experience during inference. However, replay is not free: every replayed trajectory competes with retrieval, reasoning, tool use, and verification for the same limited prompt and compute budget, making effective resource allocation essential. Existing approaches allocate these resources using fixed replay policies, regardless of whether replay is beneficial for the current task. We identify this as inference-time memory allocation, a distinct problem class for lifelong agents, and introduce LIMBO: the first online framework to our knowledge that treats memory as a controllable inference-time resource and jointly optimizes memory strategy and inference budget for each incoming task. Unlike prior approaches that fix the replay policy or require model weights, teacher supervision, or offline retraining, LIMBO learns this allocation online in a single pass, explicitly balancing task performance and inference cost without modifying the underlying agent. Across three LLM backbones on LifelongAgentBench, LIMBO achieves better cost-accuracy tradeoffs than state-of-the-art memory-augmented baselines and nearly matches all strongest such baselines at up to ~83% lower inference cost (~53% on average). LIMBO adapts its policy across models and environments without retraining, demonstrating that effective allocation can be learned online rather than manually specified.", "category": "cs.LG", "cluster": "Agent Memory \u0026 Inference Optimization", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的研究问题是：Lifelong LLM agents 在处理连续任务流时，如何将 experience replay（将历史交互轨迹注入 prompt）作为一种可控的 inference-time 资源，针对每个新任务动态且联合地优化 memory strategy 和 inference budget。这个问题至关重要，因为随着 agent 积累经验，replay buffer 会随任务数呈 $O(t)$ 增长，导致 token 消耗和 inference overhead 激增。在有限的 context length 和 computational budget 下，replay 会与 retrieval、reasoning、tool use 和 verification 竞争资源。如果采用固定的 replay 策略，会导致严重的 cost-value mismatch：在 replay 价值不大的任务上浪费计算资源，或在急需历史经验的任务上预算不足。解决这一问题能带来巨大的工程与经济价值，它使得 agent 能够在不修改底层模型权重、无需离线训练或教师监督的情况下，以极低的 inference cost（最高降低约 83%）实现与最强 memory-augmented baselines 相当的准确率，从而推动 lifelong agents 在实际复杂工作流中的高效部署。\n\n### § 2 前人工作与不足\n在此之前，该问题并未得到充分解决。经典的 lifelong learning 方法（如基于 regularization 和 experience replay）主要针对静态监督学习环境，未扩展至交互式 LLM agents，且缺乏自适应 inference-time budget allocation 的机制。在 benchmark 方面，WebArena 和 AgentBench 等仅评估静态孤立任务，缺乏 sequential skill transfer 协议；虽然 LifelongAgentBench (LAB) 填补了这一评测缺口，但其原生的 Group Self-Consistency (GSC) 稳定器通过投票提升性能，却大幅增加了 token cost，与效率目标背道而驰。在 replay 机制本身，LongLLMLingua 采用 prompt compression 减少 token，但 token 级压缩会破坏交互环境所需的结构化 action traces；SuRe 利用 dual LoRA adapters 计算的 surprise scores 进行 replay 选择，但这要求访问模型权重，无法应用于 black-box LLMs；MemRL 和 ATLAS 等方法改进了 memory representation 或 retrieval，但未在统一框架下显式优化 replay 的 inference-time cost。这些前人工作的核心不足在于，它们将 replay 视为固定的预处理步骤或单纯改进 memory 的存储与检索，而没有将“何时进行 replay 以及分配多少 compute budget”定义为一个明确的 inference-time memory allocation 问题。由于缺乏一个能够在单次在线过程中学习这种分配、且兼容 black-box 模型的轻量级控制框架，前人方法无法根据当前任务、模型能力和部署成本动态平衡 accuracy 与 cost。", "core_insight": "### § 3 重建作者的思考路径\n\n研究者首先注意到，lifelong LLM agents 依赖 experience replay 来避免 catastrophic forgetting 并复用过去的能力，但这种机制并非免费。随着任务流的推进，replay buffer 不断增长，注入 prompt 的 token 数量呈 $O(t)$ 线性增加，直接导致 inference cost 暴涨。经验观察进一步揭示了一个 cost-value mismatch 现象：在许多任务上，固定增加 replay 的数量（例如从 $k=8$ 增加到 $k=16$）只能带来边际递减的 accuracy 提升，却伴随着数倍的 cost 增长。这说明历史轨迹的价值高度依赖于当前的 task、model 和 environment，uniform replay 策略在资源分配上极其低效。\n\n面对这一效率瓶颈，研究者审视了现有的改进路径。Prompt compression（如 LongLLMLingua）虽然能减少 token 开销，但容易破坏交互环境所需的结构化 action traces；retrieval-based 策略提高了相关性，却引入了额外的选择成本并挤占了有限的 context capacity；而基于 surprise score 的选择方法（如 SuRe）则需要访问模型权重，无法适用于 black-box LLMs。更重要的是，这些方法都将 replay 视为一个固定的预处理步骤，没有从根本上解决“何时 replay 才值得其 cost”的问题。\n\n既然 memory、retrieval、reasoning 和 tool use 都在竞争有限的 inference-time budget，研究者意识到 memory 的使用本质上是一个动态的资源分配问题。这个分配决策必须满足严苛的现实约束：不能依赖模型权重、必须在线单次学习、开销需远小于 LLM 推理本身，且必须显式权衡 accuracy 与 cost。在已有的机器学习工具中，contextual bandit 完美契合这些需求：它无需梯度更新，通过单次 scalar reward 在线学习，且能根据上下文特征平衡 exploration 与 exploitation。因此，将 memory mode 和 compute budget 的联合选择建模为 contextual bandit 问题，让 controller 在每个任务开始前根据 prompt 特征和 runtime 状态动态决策，成为了顺理成章的突破口。\n\n### § 4 核心 Intuition\n\n先前方法失效的原因在于将 experience replay 视为固定的预处理步骤，盲目注入历史轨迹，导致在不需要 replay 的任务上浪费计算资源，而在需要 replay 的任务上可能预算不足或格式被破坏。LIMBO 的核心 intuition 是：将 memory 视为一种可控的 inference-time 资源，而非固定的输入。在每次任务开始前，根据当前任务的 prompt 特征和近期的运行状态，动态决定是否注入历史轨迹、注入多少以及分配多少计算预算，从而在 accuracy 和 cost 之间取得最优平衡。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\nTask Stream (T_i)\n   │\n   ▼\n[Feature Extraction] ──\u003E x_i (12维: prompt-shape, runtime, prev-outcome)\n   │\n   ▼\n[Two-Head LinUCB Controller]\n   ├──\u003E Head 1: 预测 correctness (p_a)\n   └──\u003E Head 2: 预测 cost (c_a)\n   │\n   ▼ (Action Selection: argmax(p - λc + α*UCB))\n[Replay \u0026 Budget Action (a*)] (none/full/compressed/retrieved + token/round/tool)\n   │\n   ▼\n[Prompt Construction \u0026 Agent Execution]\n   │\n   ▼\nObserve: Correctness (y_i) \u0026 Cost (c_i)\n   │\n   ├──────────────────────┐\n   ▼                      ▼\n[Update Memory Bank]   [Update Bandit Stats] (Sherman-Morrison)\n```\n\nLIMBO 的推理与在线学习过程高度耦合，具体步骤如下：\n\n- **Feature Extraction**：输入为当前任务 $T_i$ 及其 prompt、retrieval state 和 recent runtime statistics。具体操作是提取 12 个轻量级特征，分为 prompt-shape features（如 log-normalized token counts）、runtime-state features（如 EMA of normalized cost）和 previous-outcome features（如上一任务是否成功）。输出为特征向量 $x_i$。此步骤在 LLM 调用前完成，满足黑盒兼容性（对应正文 III-D(a)）。\n- **Two-Head LinUCB Controller**：输入为特征向量 $x_i$。具体操作是使用 LinUCB 算法，为每个候选 action 维护 precision matrix $A_a$ 和两个参数向量 $b_a^{acc}, b_a^{cost}$，分别预测 correctness probability 和 normalized expected cost。输出为各 action 的预测值（对应正文 III-D(b)）。\n- **Action Selection**：输入为各 action 的预测值。具体操作是根据公式 $a^* = \\arg\\max (\\hat{p}_a - \\lambda \\hat{c}_a + \\alpha \\sqrt{x^\\top A_a^{-1} x})$ 选择最优 action，平衡准确率、成本和探索。输出为选定的 memory mode（none, full, compressed, retrieved）和 compute budget（token, round, tool limits）。此步骤将 memory 使用转变为可控的决策变量（对应正文 III-D(c)）。\n- **Prompt Construction \u0026 Agent Execution**：输入为选定的 action 和当前任务。具体操作是根据 memory mode 构造 prompt（如注入相关历史轨迹），并在指定的 compute budget 下执行 agent。输出为 agent 的交互轨迹、最终答案、correctness $y_i$ 和 cost $c_i$（对应正文 III-A 和 III-C）。\n- **Update Memory Bank \u0026 Bandit Stats**：输入为观察到的 $y_i$ 和 cost $c_i$。具体操作是将成功的轨迹存入 memory bank，并通过 Sherman-Morrison 公式以 $O(d^2)$ 复杂度在线更新 bandit 的 $A_a$ 和 $b_a$。输出为更新后的 controller 状态，用于下一个任务。此步骤无需梯度计算或模型权重修改，实现了单次在线学习（对应正文 III-D(d) 和 Algorithm 1）。\n\n### § 6 核心数学推导\n\nLIMBO 的核心数学基础是 contextual bandit，特别是 LinUCB 算法的扩展。LinUCB 是一种用于在线决策的强化学习算法，它通过线性模型预测每个动作的奖励，并利用置信区间上界（UCB）来平衡对已知高奖励动作的利用和对未知动作的探索。\n\n论文提出了 Two-Head LinUCB，其 intuition 在于将任务的成功率和计算成本作为两个独立的目标进行联合优化：\n- **Head 1 (Correctness)**：$\\hat{p}_a(x) = \\sigma(\\hat{\\theta}_a^{acc \\top} x)$。使用 sigmoid 函数 $\\sigma$ 将线性模型的输出映射到 $[0,1]$ 区间，预测在特征 $x$ 下选择动作 $a$ 的成功概率。\n- **Head 2 (Cost)**：$\\hat{c}_a(x) = \\max(\\hat{\\theta}_a^{cost \\top} x, 0)$。使用 ReLU 确保成本非负，预测归一化后的预期计算成本。\n\n在动作选择阶段，算法计算每个动作的 UCB 得分：$a^* = \\arg\\max_{a \\in A} \\left( \\hat{p}_a(x) - \\lambda \\hat{c}_a(x) + \\alpha \\sqrt{x^\\top A_a^{-1} x} \\right)$。其中 $\\hat{p}_a(x)$ 是预期的准确率收益，$\\lambda \\hat{c}_a(x)$ 是成本惩罚（$\\lambda$ 控制对成本的敏感度），$\\alpha \\sqrt{x^\\top A_a^{-1} x}$ 是探索项，鼓励尝试不确定性高（即特征协方差矩阵 $A_a$ 逆矩阵较大）的动作。\n\n在线更新阶段，算法使用岭回归的在线更新形式：$A_a \\leftarrow A_a + x x^\\top$，$b_a^{acc} \\leftarrow b_a^{acc} + y_i x$，$b_a^{cost} \\leftarrow b_a^{cost} + \\hat{c}_i x$。$A_a$ 是特征的协方差矩阵，$b_a$ 是特征与奖励的协方差。每次观察到新结果后更新这些统计量以改进未来预测。为避免矩阵求逆的高昂计算开销，算法使用 Sherman-Morrison 公式直接维护 $A_a^{-1}$，将复杂度降至 $O(d^2)$。\n\n### § 7 实验设计与结论\n\n这篇论文通过在 LifelongAgentBench (LAB) 上的系统实验验证了 LIMBO 的有效性，核心实验逻辑如下：\n\n提出了什么问题：LIMBO 能否在保持准确率的同时显著降低推理成本？它是否能根据不同模型和环境自适应地学习不同的内存分配策略，且这种策略是在线学习得到的而非预先固定的？\n\n设计了什么实验验证这个问题：在 LAB 的 DB (SQL) 和 OS (bash) 两个交互环境下，使用 Qwen2.5 7B, Llama 3.1 8B 和 GPT-4o mini 三种 LLM backbones 进行 500 个任务的连续流测试。实验将 LIMBO 与 No replay, Fixed replay, LongLLMLingua, Group Self-Consistency (GSC) 等基线比较 cost-accuracy tradeoff。此外，通过分析 LIMBO 在六个 (model, environment) 设置下收敛的 action mix（Figure 4），以及在 Qwen OS 任务流中 action mix 和 UCB uncertainty bonus 随时间的变化（Figure 5），验证其自适应性和在线学习能力。\n\n问题的答案是什么：LIMBO 在所有六种设置下都处于 empirical cost–accuracy Pareto frontier，在匹配或超过最强 memory-augmented baseline 准确率（-3.8 到 +0.6 points）的同时，降低了 26% 至 83% 的推理成本。实验证明 LIMBO 在不同设置下学到了截然不同的策略（如 DB 环境倾向于 no-replay，OS 环境倾向于 retrieved replay），且无需针对每个设置进行调优或离线训练。Figure 5 进一步证实，早期任务中探索性更强，随着任务进行，action mix 逐渐稳定，UCB bonus 下降了 67%，直接证明了策略是在线学习得到的。", "additional_insights": "### § 8 Take-aways\nLIMBO 将 lifelong LLM agents 的 experience replay 定义为 inference-time memory allocation 问题，指出固定 replay 策略会导致严重的 cost-value mismatch。为解决此问题，论文提出了一个基于 two-head LinUCB contextual bandit 的在线 controller，通过提取 12 个 lightweight prompt 和 runtime features，为每个 incoming task 动态选择 memory mode（none, full, compressed, retrieved）与 compute budget。该框架满足 black-box compatibility 和 single-pass online learning 约束，无需修改 model weights 或进行 offline retraining，且 per-task overhead 极低（\u003C0.5ms）。在 LifelongAgentBench 的跨模型与跨环境实验中，LIMBO 自动学习出差异化的 allocation policy，在保持与最强 memory-augmented baselines 相当准确率的同时，将 inference cost 降低了 26% 至 83%。\n\n### § 9 最脆弱的假设\nLIMBO 核心机制最脆弱的假设是：仅靠 12 个 lightweight features（如 log-normalized token counts、EMA of normalized cost、binary success indicators）就足以捕捉当前任务与历史 trajectories 之间的相关性，从而让 contextual bandit 准确预测 replay 的 correctness 和 cost。如果这个假设不成立，bandit 将无法区分 replay 对哪些任务真正有益，最终退化为盲目探索或始终偏向最便宜的 arm。在实际复杂的 interactive environments 中，决定一条历史轨迹是否有益往往取决于深层的语义相似性或结构依赖（例如特定的 SQL 逻辑嵌套或 bash 命令组合），这些信息很难被 prompt size 或 recent cost 等粗粒度统计特征所表征。论文虽然通过 Figure 5 展示了 bandit 的 UCB bonus 随时间单调递减以及 action mix 发生偏移，证明了 controller 确实收敛，但缺少针对 feature importance 的 ablation study，未能证明这些特定特征在细粒度任务匹配上的因果预测能力，也无法排除 controller 仅仅是学到了环境层面的宏观趋势（如 DB 环境少用 replay，OS 环境多用 replay）而非真正的 per-task 动态决策。\n\n### § 10 最小复现实验\n在一周时间内，可使用 GPT-4o mini API 和 LifelongAgentBench 中的 DBBench (SQL) 500-task 序列，最小化复现 LIMBO 的核心 claim：即在线 contextual bandit 能比固定 replay 策略实现更优的 cost-accuracy tradeoff。实现时，跳过复杂的 retrieval 和 compression 机制，仅构建三个 arms：No replay (512 tokens)、Fixed replay k=4 (768 tokens) 和 Fixed replay k=16 (1024 tokens)。使用论文中列出的 12 个 features 实现 two-head LinUCB controller，在 500 个任务流中单次在线学习并记录每个任务的 accuracy 与累积 API cost。测量指标为最终 accuracy 和 total inference cost，并与始终采用 Fixed replay k=16 的 baseline 进行对比。如果 LIMBO 的最终 accuracy 落在 baseline 的 ±2 个百分点内，且 total inference cost 相比 baseline 降低超过 50%，则支持论文的 claim；如果 accuracy 显著下降（例如低于 No replay baseline），或者 cost 与 Fixed replay k=16 相当，则说明仅靠这些 lightweight features 不足以驱动有效的 memory allocation 决策，从而反驳该 claim。", "research_value": "### § 11 最强反例设计\n\n要对该论文发起最有力的攻击，核心在于推翻其“12个 lightweight features 足以驱动有效 memory allocation”的底层假设，并证明 LIMBO 在 Pareto frontier 上的优势仅仅是 LAB benchmark 特定任务分布的伪影。我会设计一个“Adversarial Semantic Confounding”实验：构建一个连续任务流，其中相邻任务在 prompt-shape features（如 token counts）、runtime-state features 和 previous-outcome features 上完全一致，但在深层结构依赖上要求正交的 historical trajectories。例如，在 SQL 环境中，交替输入具有相同复杂度和 token 长度的“多表 JOIN 聚合”与“单表窗口函数嵌套”任务；在 OS 环境中，交替输入参数长度相同但底层依赖完全不同的“awk 文本流处理”与“grep 正则提取”任务。在这个对抗流中，LIMBO 提取的 12 维特征向量 $x_i$ 将保持不变或极度相似，导致 Two-Head LinUCB controller 对这些语义迥异的任务输出完全相同的 memory mode 和 compute budget 分配策略。由于 bandit 无法通过这些粗粒度特征区分任务的真实结构需求，它将系统性地错过能够提供关键 action trace 的历史轨迹，或者在不相关的 replay 上浪费预算。如果这个实验成立，它将提供一个具体的替代解释：LIMBO 在原论文中展现的优异 cost-accuracy tradeoff，并非因为 controller 学会了 per-task 的动态 memory allocation，而是因为它碰巧学到了 LAB benchmark 中 DB 环境普遍不需要 replay、OS 环境普遍需要 retrieved replay 这一宏观环境趋势。一旦任务流在浅层特征上同质化但在语义需求上异质化，LIMBO 的策略将退化为盲目且固定的分配，其表现甚至会低于基于 semantic embedding 进行简单 KNN retrieval 的 Fixed replay baseline，从而彻底证伪其“在线学习精细分配策略”的声称。\n\n### § 12 Follow-up Research Idea\n\n该想法由 LIMBO 将 memory allocation 与深层语义匹配强行剥离的局限所驱动：在复杂的 interactive environments 中，决定一条历史轨迹价值的并非 prompt size 或 recent cost 等外部统计量，而是当前任务与历史轨迹在 latent space 中的结构同构性。为了弥补这一未满足的需求，我们可以借鉴 Information Retrieval (IR) 领域中的 Optimal Transport (OT) 和 Neural Bandits 算法，提出一个全新的“Latent-Space Semantic Memory Routing”框架。该框架不再维护基于浅层特征的线性 bandit，而是将 memory allocation 重新定义为在 LLM frozen embedding space 中的在线探索与匹配问题：利用 Optimal Transport 计算当前任务 embedding 与 memory bank 中历史 trajectory embeddings 之间的 distributional distance，并将此距离作为 Neural Bandit（如 Neural LinUCB）的 context，从而在保持 black-box compatibility 的前提下，直接对“语义相似度”与“inference cost”进行联合优化。这与已有工作存在本质区别：LIMBO 及前人方法将 memory 视为被外部统计量控制的被动资源，而本提议将 memory allocation 转化为一个由 latent semantic alignment 主动驱动的 routing 问题。第一个实验将构建一个高语义混淆度的 lifelong task stream，其中任务的浅层特征被故意打乱或对齐，使得基于浅层特征的 controller 完全失效；在此对抗设置下，比较 LIMBO 的 linear bandit 与基于 OT-Neural Bandit 的 routing 机制在 cost-accuracy tradeoff 上的表现，预期后者能通过精准捕捉深层结构依赖，在极低 budget 下显著提升复杂任务的 accuracy，从而证明 semantic-aware allocation 是 lifelong agents 突破浅层特征瓶颈的必由路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Siddharth Sharma\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Nilesh Prasad Pandey\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Onat Gungor\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Tajana Rosing\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"UCSD\"},\n    {\"id\": 2, \"name\": \"WVU\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "随着 LLM agents 被整合到日益复杂的工作流中，它们必须在保持对先前学习任务的能力的同时，持续获取新能力。Lifelong agents 通过 experience replay 来解决这一问题，将过去的交互注入到 prompt 中，以在推理期间利用先前的经验。然而，replay 并非没有代价：每条被 replay 的 trajectory 都会与 retrieval、reasoning、tool use 和 verification 竞争同样有限的 prompt 和 compute budget，这使得有效的资源分配变得至关重要。现有方法使用固定的 replay policies 来分配这些资源，而不考虑 replay 是否对当前任务有益。我们将此识别为 inference-time memory allocation，这是 lifelong agents 的一个独特问题类别，并引入了 LIMBO：据我们所知，这是第一个将 memory 视为可控的 inference-time resource，并为每个传入任务联合优化 memory strategy 和 inference budget 的 online framework。与之前固定 replay policy 或需要 model weights、teacher supervision 或 offline retraining 的方法不同，LIMBO 在单次过程中在线学习这种分配，在不修改底层 agent 的情况下显式平衡 task performance 和 inference cost。在 LifelongAgentBench 上的三个 LLM backbones 中，LIMBO 实现了比 state-of-the-art memory-augmented baselines 更好的 cost-accuracy tradeoffs，并且在 inference cost 降低高达约 83%（平均约 53%）的情况下，几乎匹配了所有最强的此类 baselines。LIMBO 无需 retraining 即可跨模型和环境调整其 policy，证明了有效的分配可以在线学习，而无需手动指定。"}]}, {"name": "Agent Training \u0026 Distillation", "count": 2, "papers": [{"title": "Know When to Stop, Where to Restart: Accelerating Multi-Turn Agentic On-Policy Distillation", "arxiv_id": "2609.14636", "authors": "Zhiyu Gui, Kexin Huang, Jia Guo, Junkang Wu, Zihao Wang, Zhiqiang Zhang, Jun Zhou, Jiancan Wu, Xiang Wang", "summary": "On-policy distillation (OPD) has become a standard approach for transferring capabilities from large teachers to compact students. Its cost, however, is dominated by autoregressive student rollouts and scales poorly in multi-turn agentic settings. Existing acceleration methods truncate or relocate the supervision signal according to fixed, offline budgets, despite substantial variation in teacher-signal reliability both within and across trajectories. Our empirical analysis on $τ^2$-bench reveals a clear structure in this variation: informative supervision is concentrated in the prefix of each turn, and, most importantly for multi-turn agentic training, the cross-turn loss of teacher endorsement is temporally locked to the student's first erroneous action rather than accumulating gradually over turns. Building on these findings, we propose STRIDE (Stop-and-Restart on-policy Distillation acceleration), which combines two complementary techniques: adaptive early stopping, which terminates a rollout once the cumulative teacher log-probability falls below an out-of-distribution threshold, and a prefix buffer, which caches high-quality prefixes and restarts generation at the weakest correct turn. Together, these mechanisms induce a data-driven curriculum that progressively extends coverage to later turns. On $τ^2$-bench retail, our method matches full-trajectory OPD and exceeds the 30B teacher at a $3.73\\times$ speedup, surpasses the baseline itself at $2.34\\times$, and retains a $4.51\\times$ speedup under cross-domain multi-teacher training. As a supplementary generalization test beyond the agentic setting, STRIDE outperforms full OPD on AIME 2025 at a $5.10\\times$ speedup and on AIME 2024 at a $3.08\\times$ speedup; averaged across the two evaluations, both fixed-budget truncation baselines remain below full OPD.", "category": "cs.LG", "cluster": "Agent Training \u0026 Distillation", "tags": ["cs.LG"], "filter_reason": "这篇论文的核心贡献是提出了一种名为 STRIDE 的加速方法，专门用于优化多轮智能体（multi-turn agentic）的在线策略蒸馏（OPD）过程。论文明确针对“多轮智能体设置”中的训练成本问题，通过自适应早停和前缀缓冲区机制，构建了一种数据驱动的课程学习策略，从而更高效地将大教师模型的能力转移到紧凑的学生模型中。\n\n根据筛选标准第一步中的保留规则：“如果论文研究 test-time scaling、推理策略搜索、澄清时机、记忆机制、协作意图、agent training/distillation/RL，并且标题或摘要明确指向 Agentic / LLM Agents / Self-Evolving / LLMs Improving LLMs，应保留。不要因为它看起来像‘推理优化’或‘训练方法’就直接排除。” 该论文标题和摘要均明确聚焦于 “Agentic On-Policy Distillation” 和 “multi-turn agentic training”，属于 agent training/distillation 的重要前沿。\n\n此外，重要校准中也明确指出：“不要只因为论文是 benchmark、evaluation、behavior analysis、training/distillation 或 test-time optimization 就排除。只要标题和摘要明确围绕 LLM Agents / Agentic AI / Self-Evolving LLMs 展开，就应返回 True。” 论文虽然涉及基础训练方法的优化，但其研究边界和实验场景牢牢绑定在多轮智能体的能力获取与蒸馏上，符合“LLM智能体及其演化”的研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n本文解决的核心问题是：如何在不损失训练质量的前提下，加速多轮智能体场景下的 On-Policy Distillation (OPD)。OPD 通过让 student 模型自行生成轨迹、再由 teacher 模型提供密集的 token-level 反馈，从源头消除了 off-policy distillation 中 teacher 训练数据与 student 部署分布之间的 distribution mismatch，已成为工业界训练的标准范式（如 Qwen3 的两阶段 recipe、Thinking Machines 的 RL-grade 蒸馏）。然而，OPD 的成本主要由 student 的 autoregressive rollout 主导——在多轮智能体设置中，student 需要与环境反复交互生成完整轨迹，这一开销随轮次和任务复杂度急剧增长。现有加速方法依赖固定的、离线确定的预算来截断或重定位监督信号，但本文在 τ²-bench 上的实证分析揭示了 teacher signal 可靠性具有明确的结构性变化：在单轮内，有效监督集中在 response prefix；在跨轮次层面，teacher endorsement 的丧失并非随轮次渐进累积，而是时间锁定于 student 的第一个错误动作（first erroneous action）。这一发现意味着静态截断规则不可避免地会对部分轨迹过度截断（丢弃有效监督），同时对另一些轨迹截断不足（保留已进入 OOD region 的无效 token）。解决这一问题不仅能将多轮智能体 OPD 的训练时间缩短数倍（单 teacher 场景 3.73×、多 teacher 场景 4.51×、单轮数学推理 5.10×），还能在加速的同时保持甚至超越 full-trajectory OPD 的质量，使 4B student 超越 30B teacher，对大规模部署 compact agent 具有直接的实际价值。\n\n### § 2 前人工作与不足\n\nOPD 加速领域已有若干方法，但均因依赖静态、离线的预算分配而存在根本性不足。**Fast OPD**（Zhang et al., 2026）将监督截断至固定的 student prefix 长度，直接缩短 rollout，但其固定预算无法区分高质量轨迹与已进入 OOD drift 的轨迹——前者被过早切断丢失有效监督，后者被保留至有效信号消失之后。**Lightning OPD**（Wu et al., 2026）将 OPD 完全移至离线，通过一次性采样 rollout 并预计算 teacher 分数来同时移除在线 rollout 和 live teacher，但代价是将训练分布冻结在初始 policy，丧失了 on-policy 的核心优势。**TCOD**（Wang et al., 2026）通过手动设计的时间课程表控制暴露的轨迹深度并逐步扩展，但每次 rollout 均从头重新生成，且其课程表无法适应不同轨迹中失效点的位置差异。**TurnOPD**（Zhou et al., 2026）基于 probe 统计为多轮 agent 训练的 rollout 深度设定预算，同样依赖离线统计而非在线检测。**PruneOPD**（Yang et al., 2026b）通过 token-level 的 student-teacher compatibility 实时截断漂移的 rollout，是最接近本文的并发方法，但同样未解决截断后覆盖丢失的问题。**ReOPD**（Liao et al., 2026）离线重放预收集的 teacher prefix，student 仅在单个 supervised step 上保持 on-policy，且将可靠性简化为冻结 prefix pool 上的静态位置衰减调度——而本文 Observation 3 明确表明失效点是 action-locked 且随训练动态偏移的，静态调度无法捕捉这一特性。**TIP**（Xu et al., 2026）虽表明在部分 token 上训练可匹配 full-token OPD，但其 token 选择前提是完整 rollout 和完整 teacher pass，既不减少 rollout 成本也不减少 teacher 成本。这些方法的共同缺陷在于：它们都按监督可靠性分配计算资源，但无一恢复截断所放弃的覆盖——即对后续轮次训练窗口的补偿。本文指出，失效点因轨迹而异且随训练进程偏移，因此可靠性必须在 rollout 过程中在线评估；同时，截断前的正确 prefix 无需重新生成，可被缓存复用以将训练窗口逐步推向更深的轮次，形成 data-driven curriculum，这正是此前方法所缺失的关键机制。", "core_insight": "### § 3 重建作者的思考路径\n\n在 multi-turn agentic 场景下，On-policy distillation (OPD) 的核心瓶颈在于 student 的 autoregressive rollout 成本极高。现有的加速方法（如 Fast OPD 或 Lightning OPD）试图通过固定的、离线的预算来截断 rollout 或将 OPD 转移到离线。然而，静态截断规则忽略了 teacher signal 可靠性在不同 trajectory 之间的巨大差异，不可避免地会过度截断高质量 trajectory（丢弃有效监督）或截断不足（保留已处于 OOD drift 的无用 token）。\n\n面对这一困境，一个自然的问题是：teacher signal 到底是如何失效的？已有的理论线索指出，一旦 student prefix 偏离 teacher 的支持域，teacher 的条件分布就会变得不可靠，导致 supervision fidelity decay。但在 multi-turn 交互中，这种失效是随 turn 数逐渐累积的，还是由特定事件触发的？通过在 $\\tau^2$-bench 上进行经验分析，可以发现两个关键现象：首先，在单个 turn 内，有效监督确实集中在 prefix；其次，更重要的是，跨 turn 的 teacher signal 崩溃并非渐进式的，而是“时间锁定”在 student 的第一个错误动作上。一旦 student 采取了错误的 action，后续状态就会脱离 teacher 的支持域，导致 endorsement 骤降。\n\n这一发现直接指向了方法的雏形：既然失效点是突发的且由特定错误触发，那么就不需要预先设定截断点，而应该在 rollout 过程中实时监测这个崩溃点。由于 OPD 本身在训练时就会计算 per-turn mean teacher log-probability，这个现成的统计量正好可以作为 online probe。当其累积值低于阈值时，说明 trajectory 已进入 OOD 区域，此时应立即终止 rollout。然而，单纯的早停会丢失后续 turn 的训练覆盖度。为了弥补这一点，可以观察到崩溃点之前的 prefix 仍然是高质量的。如果将这些验证过的 prefix 缓存起来，并在下一次遇到相同任务时，从最薄弱的正确 turn 重新开始生成，就能在复用前序计算的同时，将训练焦点逐步推向更深的 turn，自然形成一种 data-driven curriculum。\n\n### § 4 核心 Intuition\n\n先前方法失效是因为它们用固定的预算盲目截断 trajectory，忽略了 teacher signal 的可靠性其实是在 student 犯下第一个错误动作时瞬间崩溃的，而非随 turn 数逐渐衰减。这篇论文的核心 intuition 是：利用 OPD 本身就在计算的 teacher log-probability 作为在线探针，一旦探测到这种由错误动作触发的 OOD drift 就立即停止生成；同时，为了弥补截断导致的后半部分覆盖度丢失，将前面验证过的高质量 prefix 缓存复用，让下一次生成直接从最薄弱的正确 turn 重新开始，从而在不损失训练效果的前提下大幅削减 rollout 成本。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n              STRIDE Training Pipeline\n\n  Task x ──► [Prefix Buffer H(x)]\n                │\n           ┌────┴────┐\n           │ 有历史?  │──否──► K₀=0\n           └────┬────┘\n                │是\n           定位最弱正确turn k*\n           复用prefix至k*-1, K₀=k*-1\n                │\n                ▼\n  ┌────────────────────────────┐\n  │ Student πθ 逐turn生成      │\n  │ turn k=K₀+1, K₀+2, ...    │\n  └──────────┬─────────────────┘\n             │\n  ┌──────────▼─────────────────┐\n  │ Teacher πT 计算 l̄ₖ         │\n  └──────────┬─────────────────┘\n             │\n  ┌──────────▼─────────────────┐\n  │ Σ l̄ⱼ \u003C λ ?                │\n  └──┬─────────────────────┬───┘\n     │否                   │是\n     ▼                     ▼\n  继续下一turn         Early Stop\n                       │\n                       ▼\n  ┌────────────────────────────────┐\n  │ 记录 {l̄ₖ} → H(x)               │\n  │ OPD loss(含触发turn) → 更新 θ   │\n  └────────────────────────────────┘\n```\n\nSTRIDE 的训练流程围绕两个互补机制展开，对应 Algorithm 1：\n\n1. **Prefix Buffer 查询与复用**：输入为当前 Task x 及其历史记录 H(x)。若 H(x) 存在该任务的前次 rollout 轨迹，系统执行 weakest-turn localization——在连续正确 prefix（l̄ₖ \u003E α 的 turn）中找到 teacher endorsement 最低的 turn k*，复用其前缀至 k*-1 作为上下文起点，设 K₀ = k*-1；若无历史记录，则 K₀ = 0，从头生成。此步骤使训练聚焦于 student 最薄弱的剩余 turn，而非重复生成已掌握的前缀。（§4.2, Algorithm 1 行4-10）\n\n2. **Student 逐 turn 生成**：从 turn K₀+1 开始，student πθ 以 autoregressive 方式生成每个 turn 的 reasoning block 和 tool call，环境返回 observation。生成与交互交替进行，构成 multi-turn trajectory。（§3.1, Algorithm 1 行11-12）\n\n3. **Teacher 在线评分**：teacher πT 对 student 当前 turn 的输出计算 per-turn mean teacher log-probability l̄ₖ（Eq.4），作为该 turn 的平均 endorsement 指标。l̄ₖ 越高表示 student 生成越接近 teacher 的 support。（§3.1, Algorithm 1 行12）\n\n4. **Adaptive Early Stopping 判定**：累积仅覆盖新生成 turn 的 l̄ⱼ，一旦 Σ l̄ⱼ \u003C λ（OOD 阈值），立即终止 rollout。该累积和刻意排除复用的历史 prefix，避免其信号淹没新生成 turn 的 OOD 检测灵敏度。触发 stopping 的 turn 本身保留在训练中——其低 log-probability 转化为负向 per-token reward，为 student 提供明确的\"避免该 action\"信号。（§4.1 Eq.5, Algorithm 1 行13-14）\n\n5. **记录与梯度更新**：将本次 rollout 的 {l̄ₖ} 写入 H(x) 供下次复用；在所有保留 token（含触发 turn）上计算 token-level OPD loss 并更新 θ。Early stopping 直接削减了 OPD 的主要开销——student autoregressive rollout——每个被截断的 turn 都是不再发生的生成。（§4.1, Algorithm 1 行15-16）\n\n6. **Progressive Coverage**：随着训练推进，student 逐渐掌握早期 turn，其 l̄ₖ 上升，k* 自然右移，训练窗口滑向 trajectory 后期。这一 data-driven curriculum 无需手工设计 schedule，由 l̄ₖ 的变化自动驱动。（§4.2 步骤4）\n\n### § 6 核心数学推导\n\n论文的数学基础集中在 §3.1，核心是从 sequence-level reverse KL 到 token-level OPD 的推导，以及 early stopping 判定式的形式化。\n\n**Sequence-level gradient estimator（Eq.1）**：OPD 的理论目标是最小化 student 与 teacher 之间的 sequence-level reverse KL divergence。对这一目标应用 policy-gradient theorem，得到梯度估计器 g_t^seq，其中位置 t 的梯度贡献耦合即时 reward r_t（per-token teacher-student log-probability ratio）与所有未来位置的 reward。该估计器无偏，但方差随序列长度增长可达 O(T⁴)，对长 agentic trajectory 不可行。\n\n**Token-level OPD（Eq.2）**：将 discount factor 设为零，等价于切断未来 reward 耦合——每个位置仅用其 local reward r_t 更新，r_t 以 stop-gradient 处理。同时用 indicator 1_trainable(t) 掩蔽环境返回的 observation token，确保仅 student 自主生成的 token 参与损失。这是对 sequence-level 目标的有偏近似，但将最坏情况梯度方差从 O(T⁴) 降至 O(T²)，使其在长 horizon 训练中实际可用。\n\n**Per-turn mean teacher log-probability（Eq.4）**：l̄ₖ = (1/nₖ) Σ log πT(y_t | y\u003Ct)，对 turn k 中 nₖ 个 token 取 teacher log-probability 均值。Intuition：l̄ₖ 量化 teacher 对 student 该 turn 输出的整体 endorsement 程度——值越高，student 生成越落在 teacher 的 distributional support 内；值骤降则标志 student 已 drift 至 OOD 区域。l̄ₖ 既是 §3.2 实证分析的对象，也是 early stopping 的核心 online probe。\n\n**Early stopping 判定（Eq.5）**：在第一个满足 Σ_{j=K₀+1}^{K*} l̄ⱼ \u003C λ 的 turn K* 终止 rollout。Intuition：单个 turn 的 l̄ₖ 偶然偏低可能是噪声，但累积和持续低于阈值 λ 表明 trajectory 已系统性地偏离 teacher support。λ 控制 OOD 敏感度——|λ| 越小越激进（更快截断但可能误判边界区域），|λ| 越大越保守（保留更多边界信号但 speedup 降低）。\n\n### § 7 实验设计与结论\n\n论文围绕三个逐步拓宽的问题设计实验：\n\n**Q1：STRIDE 在核心 single-teacher agentic OPD 中是否有效？** 在 τ²-bench retail 域上，以 Qwen3-4B 为 student、Qwen3-30B-A3B 为 teacher，对比 Full OPD 基线及三种固定预算/课程基线（Fast OPD、TCOD-F2B、turnOPD）。答案：STRIDE 在 3.73× speedup 下匹配 Full OPD 的 mean@16 并超越 30B teacher（0.475 vs 0.461），在 2.34× speedup 下以 0.483 的 mean@16 超越所有方法；所有固定预算基线在两项指标上均低于 Full OPD。这验证了 effective acceleration 依赖 online OOD 检测而非固定预算或手工 schedule。\n\n**Q2：能否泛化到 cross-domain multi-teacher OPD？** 在 retail + telecom 双域上，以两个 domain-expert teacher 联合训练 Qwen3-4B（及 scaling study Qwen3-8B），测试更复杂的 student-teacher 架构下方法是否保持有效。答案：retail 域超越 cross-domain joint baseline（0.599 vs 0.590）并保持 4.51× speedup；telecom 域因 trajectory 平均更长、单次 rollout 覆盖比例更小而略低于基线但接近匹配。Scaling 到 Qwen3-8B 后两域均取得所有训练方法中最优结果。Prefix-quality threshold α 在此设置中发挥关键安全作用——禁用 α 过滤后训练曲线因 prefix pollution 而崩溃。\n\n**Q3：方法是否依赖 multi-turn 结构？** 在 AIME 2024/2025 上进行 single-turn math reasoning OPD，将 turn-level stopping 退化为 token-level 累积判定，与 Fast OPD 的 2048/4096-token 预算直接对比。答案：STRIDE 不依赖 multi-turn 结构。在 5.10× speedup 下超越 Full OPD 于 AIME 2025（0.467 vs 0.458），在 3.08× speedup 下超越 Full OPD 于 AIME 2024（0.558 vs 0.546）；而两种固定预算截断基线在两次评估的平均表现上均低于 Full OPD。这支持 teacher-signal OOD drift 是超越 agentic 场景的通用机制。", "additional_insights": "### § 8 Take-aways\nOn-policy distillation (OPD) 在 multi-turn agentic settings 中的主要计算瓶颈在于 student 的 autoregressive rollout，而传统的固定预算截断方法无法适应 teacher signal 可靠性的动态变化。论文通过实证揭示了 teacher signal 衰减的两大规律：在 turn 内，有效 supervision 集中在 response prefix；在 turn 间，teacher endorsement 的丧失并非逐渐累积，而是被严格锁定在 student 的第一个错误动作上。基于此，STRIDE 提出利用 cumulative teacher log-probability 作为 online OOD probe，一旦信号低于阈值即触发 adaptive early stopping，直接截断不可靠的 rollout。为弥补截断导致的后期 turn 覆盖缺失，STRIDE 引入 prefix buffer 缓存高质量前缀，并从最弱的正确 turn 重启生成，形成无需人工设计的 data-driven curriculum。实验表明，STRIDE 在 $\\tau^2$-bench 和 AIME 上不仅实现了 3 到 5 倍的加速，还能让 4B student 超越 30B teacher 的性能，且在精度和速度上均优于固定预算的 baseline。\n\n### § 9 最脆弱的假设\nSTRIDE 的核心机制完全建立在“per-turn mean teacher log-probability $\\bar{l}_k$ 的急剧下降能够精准且即时地锁定 student 的第一个错误动作”这一假设上。如果这个假设不成立，即 $\\bar{l}_k$ 的下降与错误动作之间存在显著延迟，或者 teacher 对某些错误动作给予了较高的 log-probability（即 teacher 本身存在系统性盲区或 calibration 问题），那么 STRIDE 的核心贡献将直接失效：early stopping 要么过早截断了依然有效的 supervision，要么在 trajectory 已经严重偏离时仍未触发，而 prefix buffer 也会因为基于错误的 $\\bar{l}_k$ 评估而缓存了污染的前缀。在实际中，当 student 采取的某个错误动作在语法或表面逻辑上看似合理，但偏离了环境的核心约束时，teacher model 往往无法立即察觉，导致 $\\bar{l}_k$ 不会在第一个错误 turn 立即下降。论文为这一假设提供的证据仅限于特定的 Qwen3-4B student 与 Qwen3-30B teacher 在 $\\tau^2$-bench retail 上的实证观察（Figure 2b 显示在 $t^*$ 处存在 Cohen's d 为 +0.30 的效应），且明确承认该现象部分依赖于 Qwen3 chat template 丢弃历史 reasoning 的结构特性。论文缺少在异构模型对或不同 template 结构下对该假设普适性的验证，一旦更换为保留完整历史 reasoning 的模型，$\\bar{l}_k$ 的跨 turn 动态可能会被彻底改变。\n\n### § 10 最小复现实验\n在一周时间内，无需复现完整的 OPD 训练循环，只需验证“teacher log-probability 的下降是否真的被锁定在第一个错误动作上”这一最核心的 empirical observation。使用 $\\tau^2$-bench retail domain 的任务集，部署一个固定的 student model（如 Qwen3-4B）进行 multi-turn rollout 生成 trajectories。通过环境提供的 reference behavior 自动标注出每条失败 trajectory 的 first error turn $t^*$。同时，使用 teacher model（如 Qwen3-30B）计算每个 turn 的 mean teacher log-probability $\\bar{l}_k$。接着，将所有失败 trajectory 按 turn offset $k - t^*$ 对齐，计算 $\\bar{l}_k$ 相对于 turn index 均值的 residual。如果 residual 在 $t^*$ 之前保持平稳或轻微正向，而在 $t^*$ 处及之后显著翻转为负值，则支持了论文的 core claim，证明 online OOD probe 确实能捕捉到 action-locked 的信号衰减；如果 residual 在 $t^*$ 之前就已经呈现明显的下降趋势，或者在 $t^*$ 之后没有显著的负向翻转，则反驳了该假设，说明 STRIDE 的 early stopping 机制在实际上无法精准定位错误发生点，其加速效果是以牺牲有效 supervision 为代价的。", "research_value": "### § 11 最强反例设计\n\n要构建对 STRIDE 最具破坏性的反例，我会设计一个名为“Delayed Manifestation Environment”（延迟显现环境）的实验，直接攻击其核心假设——即 teacher 的 per-turn mean teacher log-probability $\\bar{l}_k$ 能够在 student 的第一个错误动作处即时且急剧下降。STRIDE 在 $\\tau^2$-bench retail 上取得成功，可能仅仅是因为该领域的 tool-call 错误（如调用错误的 API 或传入错误参数）会立即引发环境报错或返回空值，这种 syntax-level 或 shallow semantic-level 的错误极易被 teacher 察觉，从而导致 $\\bar{l}_k$ 骤降。换言之，STRIDE 的 early stopping 机制可能只是在充当一个延迟的“语法错误检测器”，而非真正的“语义 OOD 探测器”。在 delayed manifestation 场景中，我要求 student 执行一个多轮的复杂数据库查询与推理任务，其中 student 在 turn $k$ 的错误动作（例如使用了不恰当的 JOIN 逻辑或忽略了某个隐含约束）在语法上完全合法，环境也会返回看似正常的 observation，但这个错误直到 turn $k+3$ 才导致最终的聚合结果异常。在这种条件下，teacher model 在 turn $k$ 给出的 $\\bar{l}_k$ 极大概率不会下降，因为该 action 在局部上下文中是 plausible 的。这将导致 STRIDE 的 early stopping 机制发生严重的 false negative 失效：系统未能及时截断，student 继续基于错误状态生成后续 turn，而 prefix buffer 更会将这个包含致命逻辑错误的 turn $k$ 缓存为“正确前缀”（因为 $\\bar{l}_k \u003E \\alpha$）。在后续训练中，student 将从这个污染的 prefix 重启，导致训练在错误的状态空间中反复打转，不仅无法加速，反而会比 Full OPD 收敛到更差的 local optima。这个反例揭示了一个根本性的替代解释：STRIDE 的有效性高度依赖于任务错误具有“即时可察觉性”，一旦面对错误后果延迟显现的 deep reasoning 任务，其基于 teacher log-probability 的 reactive 探测机制将可预测地崩溃。\n\n### § 12 Follow-up Research Idea\n\n基于上述局限，我提出一个非增量的 novel research idea：**Counterfactual Trajectory Probing for Proactive Distillation (CTP-PD)**。该想法的驱动需求是：OPD 中的 OOD drift 不应依赖 teacher 的 reactive scoring（即等 student 犯错后 teacher 才察觉），而应通过 proactive 机制在错误动作执行前就预测其长期后果。STRIDE 及其并发方法均将 teacher 视为被动的“裁判”，但 teacher 真正的价值在于其隐式掌握的环境动力学。我们可以借鉴 Model-based Reinforcement Learning (MBRL) 中的 forward dynamics model 和 counterfactual reasoning 概念，将 teacher 重新用作一个“世界模型模拟器”。具体而言，在 student 生成 turn $k$ 的 action 之前，我们不直接计算 $\\bar{l}_k$，而是让 teacher 基于当前历史生成多个 counterfactual next observations，并评估 student action 在这些假想未来中的 robustness。如果 student 的 action 在 teacher 预测的多数未来中导致 state divergence，则判定其为 OOD 并提前截断。这一 framing 将 OPD 的加速从“检测偏离”转变为“预测偏离”，彻底绕过了 delayed manifestation 问题。第一个实验将构建一个具有 delayed reward 特性的 multi-turn text-to-SQL 环境，训练一个 lightweight forward model 预测 SQL 执行后的 state embedding。对比 STRIDE 的 reactive $\\bar{l}_k$ 探针和 CTP-PD 的 proactive counterfactual 探针在 OOD detection latency（以 turn 为单位）和 final task success rate 上的差异。如果 CTP-PD 能在错误动作发生的当轮提前截断，而 STRIDE 平均延迟 2-3 轮才截断，则证明 proactive 机制在 deep agentic 任务上具有根本性优势，从而开启将 OPD 与 world model learning 相结合的新研究方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zhiyu Gui\", \"affiliations\": [1, 2], \"markers\": [\"‡\", \"∗\"]},\n    {\"name\": \"Kexin Huang\", \"affiliations\": [1], \"markers\": [\"‡\"]},\n    {\"name\": \"Jia Guo\", \"affiliations\": [2], \"markers\": [\"†\"]},\n    {\"name\": \"Junkang Wu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zihao Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Zhiqiang Zhang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jun Zhou\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jiancan Wu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiang Wang\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"USTC\"},\n    {\"id\": 2, \"name\": \"Ant Group\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"‡\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding authors\"},\n    {\"marker\": \"∗\", \"text\": \"Work done during internship at Ant Group\"}\n  ]\n}\n```", "summary_translation": "On-policy distillation (OPD) 已成为将能力从大型 teacher 转移到紧凑型 student 的标准方法。然而，其成本主要由 autoregressive student rollout 主导，并且在 multi-turn agentic setting 中扩展性较差。现有的加速方法根据固定的 offline budget 来截断或重定位 supervision signal，尽管 teacher-signal reliability 在 trajectory 内部和跨 trajectory 之间存在显著差异。我们在 $τ^2$-bench 上的实证分析揭示了这种差异中的清晰结构：informative supervision 集中在每个 turn 的 prefix 中，并且最重要的是，对于 multi-turn agentic training，teacher endorsement 的 cross-turn loss 在时间上锁定于 student 的第一个 erroneous action，而不是在 turn 之间逐渐累积。基于这些发现，我们提出了 STRIDE (Stop-and-Restart on-policy Distillation acceleration)，它结合了两种互补的技术：adaptive early stopping，一旦 cumulative teacher log-probability 低于 out-of-distribution threshold 就终止 rollout；以及 prefix buffer，它缓存高质量的 prefix 并在最弱的正确 turn 处重启生成。这些机制共同形成了一种 data-driven curriculum，逐步将 coverage 扩展到后续的 turn。在 $τ^2$-bench retail 上，我们的方法匹配了 full-trajectory OPD，并在 $3.73\\times$ 加速下超越了 30B teacher，以 $2.34\\times$ 加速超越了 baseline 本身，并且在 cross-domain multi-teacher training 下保持了 $4.51\\times$ 的加速。作为 agentic setting 之外的补充泛化测试，STRIDE 在 AIME 2025 上以 $5.10\\times$ 的加速优于 full OPD，在 AIME 2024 上以 $3.08\\times$ 的加速优于 full OPD；在两次评估中平均，两个 fixed-budget truncation baseline 仍然低于 full OPD。"}, {"title": "HarnessBandit: Joint Learnability-Transferability Scheduling for Multi-Harness Agentic Reinforcement Learning", "arxiv_id": "2609.13739", "authors": "Hongliang Wei, Xiaobing Tu, Yinggui Wang, Zhengxi Liu, Rongkun Xue, Jinkui Ren, Xiantao Zhang, Debin Zhao, Xiaopeng Fan", "summary": "Language-model agents are increasingly deployed through diverse harnesses that differ in system prompts, tool schemas, control loops, and trajectory formats. The same model can perform unevenly across these interfaces, making robustness to harness variation an important objective. A natural approach is to train a shared policy through multiple harnesses, but doing so introduces a scheduling problem: each training step should favor a harness that currently provides a useful learning signal while also producing an update that benefits the other harnesses. We develop HarnessBandit, an online scheduler that selects one harness per optimizer step. After a group-relative policy optimization (GRPO) update, it observes learnability -- the mean absolute advantage on the batch -- and transferability -- the cosine between a low-dimensional gradient sketch of the current harness and exponential moving averages of the remaining harnesses. The two signals are fused after pooled sliding-window min-max normalization and sampled with a visit-dependent bonus and an explicit exploration floor. We train Qwen3.5-2B across six harnesses on ClawGym and evaluate on PinchBench (held-out tasks, in-distribution OpenClaw) and ClawEval (held-out tasks and harness). HarnessBandit improves over mixed-batch multi-harness training on both benchmarks, while training diagnostics indicate that learnability and transferability provide distinct, evolving signals.", "category": "cs.LG", "cluster": "Agent Training \u0026 Distillation", "tags": ["cs.LG"], "filter_reason": "这篇论文的核心贡献是提出了 HarnessBandit，一种用于多 Harness（智能体运行框架/脚手架，包含系统提示、工具模式、控制循环等）智能体强化学习的在线调度器。论文明确研究的是如何通过在线调度机制，在多个不同的 Agent Harness 之间训练共享的 LLM 策略，以提升智能体在不同接口下的鲁棒性和性能。这完全符合筛选标准中第一步的保留规则：“如果论文研究 agent 的 harness / scaffold / runtime ... 并且核心贡献是让这些智能体运行组件通过轨迹、反馈、观测或评估结果自动改进、演化或自适应优化”，以及“如果论文研究 ... agent training/distillation/RL，并且标题或摘要明确指向 Agentic / LLM Agents ... 应保留”。论文标题和摘要均明确指向 Agentic Reinforcement Learning 和 Language-model agents，属于智能体训练与演化的前沿研究，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的研究问题是多 harness 环境下 agentic reinforcement learning 的动态调度问题。Language-model agents 通过不同的 harnesses（包含 system prompts, tool schemas, control loops 等）与工具交互，即使底层任务和 reward function 相同，不同的 harness 也会诱导出不同的 trajectory 分布。在此背景下，如何在每个 optimizer step 从多个 harness 中选择一个进行 pure rollout batch，使得该 batch 既具有 learnability（即 group-relative advantage 均值非零以提供有效的 policy gradient），又具有 cross-harness transferability（即其梯度更新与其他 harness 的梯度方向对齐），是一个未被解决的关键问题。这个问题的重要性在于，随着 LLM agents 的广泛部署，策略对 harness 变化的鲁棒性成为核心诉求，而仅在单一 harness 上训练的策略往往无法迁移到其他接口。虽然通过多个 harness 混合训练可以降低这种敏感性，但简单的静态混合或全局 shuffle 会因为 interface mismatch 引起梯度干扰，甚至导致性能退化至不如未微调的 base model。解决这一调度问题能够有效利用多接口训练数据，避免负迁移，从而显著提升 agent 在 held-out tasks 和 held-out harnesses 上的泛化能力，同时最大化固定 GRPO budget 下的训练效率。\n\n### § 2 前人工作与不足\n这个问题之前并未得到有效解决，因为前人研究主要将多接口训练视为标准的多任务混合问题，未能将 execution interface 的调度与 on-policy RL 的动态反馈相结合。在 Agentic RL 和 tool use 领域，SWE-agent、OpenHands 和 Polar 等系统虽然将 agent-computer interface 视为一等设计对象，Polar 甚至将多个 harnesses 暴露为可互换的 rollout backends，但它们仅提供了多 harness 训练的基础设施，并未回答“给定多个 harness，哪个应生成下一个 on-policy batch”这一正交问题，通常依赖静态混合或随机采样。在 Multi-task learning (MTL) 领域，诸如 Gradient surgery 和 Distral 等方法通过投影或正则化处理多任务间的梯度冲突，但这些方法假设任务采样分布固定，且干扰源于不相交的目标；而在本文设定中，不同 harness 包装的是相同的底层任务，干扰源于 interface mismatch 而非目标差异，且这些方法不在线观察 on-policy source 当前是否产生非零 advantage 或梯度是否对齐。在 Curriculum learning 和 data mixing 领域，如 DoReMi 等方法通常通过 proxy model 离线调整 domain 权重，无法感知 on-policy 训练过程中的动态信号。前人工作之所以未能考虑 learnability 和 transferability 这两个动态信号，是因为在静态数据混合的范式下，研究者无需也无法在每次 optimizer step 后即时评估 group-relative advantage 的分布以及低维 gradient sketch 的对齐程度。HarnessBandit 首次将此问题建模为非平稳 multi-armed bandit，填补了在 GRPO 框架下根据 trainer-native 信号动态调度 execution interface 的空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在多 harness 环境下部署 language-model agents 时，一个自然的鲁棒性提升策略是使用多个 harness 联合训练同一个共享 policy。然而，传统的 multi-task learning 通常假设各任务的采样分布是固定的，或者简单地通过静态 data mixing 来联合训练。作者很可能观察到了一个失败模式：当把多个 harness 的数据随机混合进行 GRPO 训练时，模型性能不仅没有提升，反而可能崩溃，甚至不如完全不训练的 base model。这是因为在 GRPO 框架下，如果某个 harness 采样的轨迹得到的 reward 完全一致，其 advantage 会退化为零，导致该 batch 无法提供有效的 policy gradient；同时，不同 harness 由于 system prompt 和 tool schema 的差异，其产生的梯度方向可能相互冲突，导致严重的 negative transfer。\n\n面对这种静态混合训练的失效，作者自然会转向动态调度策略，将每个 harness 视为一个 non-stationary multi-armed bandit 中的 arm。但如何定义每个 arm 的 reward 信号成为了核心难点。如果仅依赖任务 reward，无法反映策略是否真正在学习；如果仅依赖梯度大小，又可能导致模型过拟合到某个特定的 scaffold 上而丧失对其他接口的泛化能力。因此，作者必须寻找两个互补的 trainer-native 信号：一个是“当前 batch 是否值得学习”，即 group-relative advantage 的绝对值幅度；另一个是“当前 batch 的更新是否会破坏其他接口的能力”，即当前梯度与其他 harness 梯度的对齐程度。将这两个信号结合，就构成了在多执行接口之间进行动态资源分配的理论基础。\n\n### § 4 核心 Intuition\n\n在多 harness 的 agentic RL 中，无脑混合不同接口的数据进行训练极易导致梯度冲突和学习信号退化。这篇论文的核心 intuition 是：在每个 optimizer step 只选择一个 harness 生成 pure batch，并且选择的标准是它既能产生非零的 advantage（learnability），又能保证其梯度更新方向与其他闲置 harness 的历史梯度大致对齐（transferability）。通过在线融合这两个信号并进行 bandit 采样，方法能够在保证每一步都有有效学习信号的同时，避免模型过拟合到单一执行接口，从而实现跨 harness 的鲁棒泛化。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n┌──────────────────────────────────────────┐\n│       HarnessBandit 单步 Pipeline         │\n├──────────────────────────────────────────┤\n│ ┌────┐ ┌──────┐ ┌────────────────┐     │\n│ │Sche│→│PureRo│→│GRPO:Adv A,∇L   │     │\n│ │选h │ └──────┘ └──┬────────┬────┘     │\n│ └─┬─┘      ┌───────┘        │          │\n│   ↑        ↓                ↓          │\n│   │ ┌──────┐   ┌──────────────┐      │\n│   │ │L_h:|A│   │T_h:sketch cos│      │\n│   │ └──┬───┘   └──────┬───────┘      │\n│   │    ↓              ↓               │\n│   │ ┌─────────────────────────┐      │\n│   │ │归一化+融合 S=αL̃+(1-α)T̃ │      │\n│   │ └───────────┬─────────────┘      │\n│   └─│Q←(1-β)Q+βS;E←EMA;θ←opt       │\n│     │U=Q+c/√(n+1);softmax+ε        │\n└──────────────────────────────────────────┘\n```\n\n以下按 Algorithm 1 的执行顺序逐步说明：\n\n**步骤 1—Scheduler 选择 harness（§4.5, Alg.1 L1—5）。** 输入为当前训练步 $t$、各 harness 的 value $Q_h$、访问计数 $n_h$。若 $t \u003C W_{\\text{up}}=30$，按 round-robin 轮流选择以收集初始观测；否则计算 $U_h = Q_h + c/\\sqrt{n_h+1}$（$c=0.2$），经 softmax（温度 $\\tau=0.3$）加 $\\varepsilon$-floor（$\\varepsilon=0.15$）采样得到 $h_t$。输出为选定的单个 harness 名称。\n\n**步骤 2—Harness-Pure Rollout（§4.1, Alg.1 L7）。** 输入为 $h_t$ 对应的独立 shuffled task pool、当前 policy $\\pi_\\theta$、batch size $B=8$、每组采样数 $G=8$。从 $h_t$ 的 pool 中抽取全部 prompt，生成纯 harness batch。输出为一组 rollout trajectories。\n\n**步骤 3—GRPO Update（§3, Alg.1 L8—9）。** 输入为 rollout trajectories。按 Dr.GRPO 计算 leave-one-out group baseline 的 advantages $A_{i,t}$（不除以 group std），同时 backward 得到 batch gradient $\\nabla_\\theta L$。此步骤产出两路信号：advantages 用于 learnability，gradient 用于 transferability。\n\n**步骤 4a—Learnability $L_h$（§4.2, Alg.1 L9）。** 输入为 advantages $A_{i,t}$。对每条 trajectory 取 token-masked mean $|A_{i,t}|$，同 prompt group 内取平均，同 harness 内再取平均得到 $L_{h_t}$。若 group 内所有 trajectory reward 相同则 $L_{h_t}\\approx 0$，表示该 batch 无学习信号。输出为标量 $L_{h_t}$。\n\n**步骤 4b—Transferability $T_h$（§4.3, Alg.1 L10—13）。** 输入为 batch gradient $\\nabla_\\theta L$。仅保留最后 $K=4$ 个 transformer block 的参数梯度（排除 embedding 和 output head），按 proportional coordinate subsample 压缩为 $d=65{,}536$ 维 sketch $\\hat{g}_{h_t}$。计算 $\\hat{g}_{h_t}$ 与其他 harness 的 EMA sketch $E_j$ 的 cosine similarity 并取平均，得到 $T_{h_t}$。首次访问某 arm 时 $T_{h_t}$ 未定义，回退为仅用 learnability。输出为标量 $T_{h_t}$。\n\n**步骤 5—归一化与融合（§4.4, Alg.1 L14）。** 输入为 $L_{h_t}$ 和 $T_{h_t}$。在跨 harness pooled 的滑动窗口（$W=32$）内做 min-max 归一化得到 $\\tilde{L}_h$、$\\tilde{T}_h$，再以 $S_h = \\alpha\\tilde{L}_h + (1-\\alpha)\\tilde{T}_h$（$\\alpha=0.5$）融合。输出为 instantaneous score $S_{h_t}$。\n\n**步骤 6—Value 与 EMA 更新（§4.4, Alg.1 L15—16）。** 输入为 $S_{h_t}$。以 EMA 更新 $Q_h \\leftarrow (1-\\beta)Q_h + \\beta S_h$（$\\beta=0.3$），同时将当前 unit sketch 以 EMA rate $\\eta=0.3$ 更新到 $E_{h_t}$。未访问过的 arm 在选择时赋值 $\\max_j Q_j$ 以防 softmax 饥饿。输出为更新后的 $Q$ 表和 EMA sketches。\n\n**步骤 7—Optimizer Step（Alg.1 L17）。** 用累积的 $\\nabla_\\theta L$ 执行 Adam 更新得到 $\\theta_{t+1}$。此步骤与标准 GRPO 完全一致，HarnessBandit 不修改 policy objective。\n\n**评测阶段。** 训练完成后，固定 checkpoint 在两个 held-out benchmark 上评测：PinchBench 使用 in-distribution 的 OpenClaw harness 跑 147 个未见任务；ClawEval 使用 out-of-distribution 的 native loop 跑 161 个未见任务，$N=3$ 次独立试验。评测时无 bandit 调度，仅用固定 harness 执行推理。\n\n---\n\n### § 6 核心数学推导\n\n本文的方法论建立在以下几个关键数学关系上，原文部分公式因排版抽取缺失，以下依据正文文字描述和 Algorithm 1 补充确认的定义与标准背景。\n\n**GRPO Advantage（§3）。** 对每个 prompt group 中的 $G$ 条 trajectory，advantage 通过 leave-one-out group baseline 计算：$A_{i,t} = r_i - \\text{mean}(r_{\\neq i})$。Dr.GRPO 的关键修改是不除以 group standard deviation，这避免了当组内 reward 方差接近零时 advantage 爆炸的问题。Intuition：如果一组采样全部成功或全部失败，advantage 趋近零，policy gradient 几乎不更新——这正是 learnability 信号的来源。\n\n**Learnability（§4.2）。** $L_h$ 定义为 harness $h$ 下所有 group 的 token-masked mean $|A_{i,t}|$ 的两层平均（先组内、再组间）。等权 group 平均防止长 trajectory 主导信号。Intuition：$L_h$ 衡量当前 batch 是否包含\"有区分度\"的 trajectory——既有成功又有失败时 $L_h$ 大，policy 能从对比中学到东西；全成功或全失败时 $L_h \\approx 0$，该步无信息量。\n\n**Transferability via Gradient Sketch（§4.3）。** 对 batch gradient $\\nabla_\\theta L$，仅取最后 $K=4$ 层参数，通过固定 random coordinate subsample 压缩为 $\\hat{g}_h \\in \\mathbb{R}^{65{,}536}$。Transferability 定义为当前 sketch 与其他 harness EMA sketch 的平均 cosine similarity：$T_h = \\frac{1}{|J|}\\sum_{j \\in J} \\cos(\\hat{g}_{h_t}, E_j)$。理论背景：Johnson–Lindenstrauss lemma 保证随机投影在高维空间中近似保持内积，因此 sketched cosine 是 full-gradient cosine 的无偏近似。Intuition：$T_h$ 大意味着在 harness $h$ 上做的更新方向与其他 harness 需要的更新方向一致，该更新能\"迁移\"到其他 interface；$T_h$ 为负则意味着过度拟合该 scaffold 的特异性方向。\n\n**Pooled Sliding-Window Normalization（§4.4）。** $L_h$ 和 $T_h$ 量纲不同（前者是 advantage 绝对值，后者是 cosine ∈ [-1,1]），在跨 harness pooled 的最近 $W=32$ 个观测窗口内分别做 min-max 归一化。Intuition：pooled（而非 per-arm）归一化保留了 harness 间的对比信息——如果所有 harness 的 learnability 都低，归一化后仍能区分相对较高者。\n\n**Fusion 与 Value Update（§4.4）。** $S_h = \\alpha\\tilde{L}_h + (1-\\alpha)\\tilde{T}_h$（$\\alpha=0.5$），再以 EMA 平滑为 $Q_h$。Intuition：等权融合意味着 scheduler 同时偏好\"有学习信号\"和\"能迁移\"的 harness，避免仅优化 learnability 导致陷入 idiosyncratic harness，或仅优化 transferability 导致选择当前无信号的 harness。\n\n**Sampling Rule（§4.5）。** $U_h = Q_h + c/\\sqrt{n_h+1}$，采样分布 $p(h) = (1-\\varepsilon)\\text{softmax}(U/\\tau) + \\varepsilon/H$。Intuition：$c/\\sqrt{n_h+1}$ 是类 UCB bonus，鼓励探索访问不足的 arm；$\\varepsilon$-floor 保证每个 arm 至少有 $\\varepsilon/H$ 的概率被选中，防止某 arm 被永久饿死。两者不可互换：bonus 随 $n_h$ 增长而衰减但不随 $t$ 增长（不同于 UCB1 的 $\\sqrt{\\ln t/n}$），所以一个停止被选中的 arm 的 bonus 会冻结，只有 $\\varepsilon$-floor 能给它重新被选中的机会。\n\n---\n\n### § 7 实验设计与结论\n\n**问题 1：多 harness 训练中，基于 learnability 和 transferability 的动态调度是否优于静态混合 batch？**\n\n实验设计：在相同的 2,000 ClawGym tasks × 6 harnesses 数据集、相同的 150 步 GRPO budget 和相同硬件下，对比四种方法——HarnessBandit（每步纯 harness batch + bandit 调度）、Mixed 6 harnesses（全局 shuffle 混合 batch）、Mixed OpenClaw+Codex（仅两 harness 混合）、以及未微调的 base model。评测在两个 held-out benchmark 上进行：PinchBench（147 个未见任务，使用 in-distribution 的 OpenClaw harness）和 ClawEval（161 个未见任务，使用 out-of-distribution 的 native loop，$N=3$）。\n\n答案：HarnessBandit 在 PinchBench 上取得 0.506，优于两 harness 混合的 0.493，远超六 harness 混合的 0.331（与 base model 0.330 几乎持平）。在 ClawEval 上，HarnessBandit 在 Pass[3] 上与 base model 持平（26.7%），在 pass@3（41.6%）和 mean score（0.556）上超过所有对比方法。关键发现是：六 harness 静态混合不仅未改善、反而几乎完全无效，说明简单混合多个 interface 的 batch 会引入有害的 gradient 干扰；而 HarnessBandit 通过每步选择单一 harness 并基于信号调度，有效避免了这种干扰。\n\n**问题 2：Learnability 和 transferability 是否提供了不同的、互补的信号？**\n\n实验设计：记录训练过程中每个 harness 的归一化 learnability $\\tilde{L}_h$ 和 transferability $\\tilde{T}_h$（Figure 2），以及未归一化的原始信号（Figure D.1），分析两者的排名差异和动态变化。同时绘制 pairwise gradient cosine（Figure E.1）以理解 transferability 的细粒度几何结构。\n\n答案：两个信号给出不同的 harness 排名——Pi 的 learnability 最高（0.75）但 transferability 仅中等（0.49）；OpenCode 在两者上都高（0.62, 0.60）；Qwen Code 的 transferability（0.37）显著低于 learnability（0.53）。这表明 transferability 不是 learnability 的单调变换，两者确实捕捉了不同维度的信息。Pairwise gradient cosine 在正负区间波动，不存在任何单一 harness 始终与其他所有 harness 对齐，解释了为何 transferability 状态随训练动态演化而非锁定在固定值。\n\n**问题 3：Bandit 调度是否会 collapse 到单一 harness？**\n\n实验设计：记录训练结束时的采样概率 $p_h$ 和 visit counts $n_h$（Figure C.1, Appendix F），与均匀分配（$p_h = 1/6 \\approx 0.167$，约 25 visits/arm）对比。\n\n答案：最终采样概率在 0.127—0.204 之间，visit counts 在 21—32 之间，是一种温和的重新分配——向 OpenClaw、Pi、OpenCode 倾斜，但 Qwen Code 和 Codex 仍保持在 $\\varepsilon$-floor 之上。没有发生 collapse 到单一 arm 的现象，验证了 $\\varepsilon$-floor 和 UCB-like bonus 的探索机制有效。", "additional_insights": "### § 8 Take-aways\n本文指出，在 multi-harness agentic RL 中，同一个 task 在不同 harness（系统提示、工具格式、控制循环等）下会产生不同的 trajectory 分布，导致单一 harness 训练的 policy 难以泛化。为此，作者提出了 HarnessBandit，一个构建于 GRPO 之上的在线调度器，它在每个 optimizer step 将多 harness 训练建模为 non-stationary multi-armed bandit 问题，只选择一个 harness 生成 pure rollout batch。该调度器融合了两个互补信号：衡量当前 batch 是否提供有效学习信号的 learnability（mean absolute advantage），以及衡量当前更新是否对其他 harness 有益的 cross-harness transferability（当前 harness 的 low-dimensional gradient sketch 与其他 harness EMA 的 cosine similarity）。通过 pooled sliding-window min-max normalization 和带有 exploration floor 的 UCB-softmax 采样，HarnessBandit 在 Qwen3.5-2B 上进行 150 步 GRPO 训练后，在 held-out tasks 和 held-out harness 的评估中均优于 static mixed-batch baselines，且没有坍缩到单一 harness。\n\n### § 9 最脆弱的假设\n本文最核心且失败代价最大的假设是：**当前 harness 的 low-dimensional gradient sketch 与其他 harness 的 gradient EMA 之间的 cosine similarity（即 transferability），能够准确预测该更新对其他 harness 的泛化/迁移价值。** \n在实际中，这个假设可能不成立，原因在于 RL 的 policy gradient 具有极高的方差，单次 batch 的梯度方向噪声极大。虽然作者只提取了最后 4 个 transformer blocks 的梯度并降维至 65,536 维以减少计算开销，但这种 aggressive sketching 可能会丢失关键的 harness-specific 方向信息。此外，cosine similarity 仅衡量方向一致性而忽略梯度大小，如果两个 harness 的梯度方向一致但幅度差异巨大，或者方向轻微偏离但包含关键的特定信息，该指标可能会给出误导性的高分。如果 transferability 信号实际上是噪声，那么 bandit 的调度将退化为仅依赖 learnability，甚至可能被错误信号引导而产生负面调度。\n论文提供的证据仅限于 Figure 2 和 Appendix E 展示的 transferability 与 learnability 排名不同，以及 transferability 随时间波动的几何特征。然而，论文**缺少直接的消融实验**来证明 transferability 信号本身对最终性能提升的独立贡献（例如对比仅使用 learnability 的 bandit），因此无法排除最终性能提升完全来自 learnability 调度或 bandit 探索机制的可能性。\n\n### § 10 最小复现实验\n如果有一周时间，可以设计一个最小复现实验来验证 transferability 信号是否真的提供了超越 learnability 的额外价值。不需要复现复杂的 agentic RL 环境，可以使用一个小型 LM（如 0.5B 模型）在同一个数学推理数据集（如 GSM8K）上，使用 3 种不同的 prompt 模板（作为 3 个 \"harness\"）进行 GRPO 训练。实现一个极简的 gradient sketcher，仅提取模型最后一层 transformer block 的梯度并随机投影到几千维。然后运行三种调度策略：Random selection、Learnability-only bandit 和完整的 HarnessBandit (Learnability + Transferability)。在训练过程中，记录每种策略下模型在 3 种 prompt 模板下的 held-out 验证集准确率。如果 HarnessBandit 的平均准确率显著优于 Learnability-only bandit，则支持论文关于 transferability 提供独特且有用信号的 claim；如果两者表现相当，则反驳了 transferability 信号的必要性，说明性能提升可能仅源于 learnability 调度。", "research_value": "### § 11 最强反例设计\n\n要对该论文进行最有力的攻击，核心在于挑战其提出的 transferability 信号是否具有真实的因果效用，还是仅仅是一个伴随的噪声变量。论文最致命的理论缺陷在于：在 on-policy RL
