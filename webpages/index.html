寻求目标、适当的工具执行以及必须从结果观察中提取的必要信息。这为过程监督提供了明确的参考基准。\n2. **Pre-call Alignment Reward**：在模型生成工具调用意图时，NTEP-R 评估该意图是否与 NTEP 中定义的必要证据目标对齐。如果对齐，则给予奖励，以此约束模型在执行前具备明确且必要的意图。\n3. **Tool Call 与 Observation**：模型根据意图调用工具（图像裁剪、图像搜索、文本检索），获取返回的 Observation。\n4. **Post-Acquisition Reward**：模型从 Observation 中总结提取信息后，NTEP-R 评估提取的信息是否与所需的必要证据对齐。如果对齐，则给予奖励，以此确保模型真正利用了获取的证据。\n5. **Non-repeated-goal Regularizer**：如果某个 NTEP 目标已被满足，模型再次发起针对该目标的冗余调用，则施加惩罚，从而避免重复访问已满足目标的浪费行为。\n6. **迭代与输出**：完成当前步骤后，模型进入下一个 NTEP Goal 继续推理，或输出最终答案。通过这种双阶段评估与冗余惩罚，将工具监督从粗粒度的“是否调用”提升为细粒度的“调用是否必要且有效”。\n\n§ 7 实验设计与结论\n\n* **提出问题**：如何为具备工具调用能力的视觉语言模型提供细粒度的过程监督，以确保每次工具调用都能有效获取并利用必要证据，从而提升推理准确性和工具使用效率？\n* **实验验证**：研究者在七个图像基础基准上进行了广泛评估，涵盖搜索导向推理和细粒度视觉感知。实验采用统一的三工具框架（图像裁剪、视觉搜索、文本检索），训练了 8B 参数的模型实例 (NTEP-8B)，并与强大的端到端和 agentic 基线进行比较。此外，通过消融研究验证了各个奖励组件的具体贡献。\n* **结论**：实验结果表明，NTEP-R 在搜索导向准确性和工具使用效率上均实现了显著提升。消融研究证实，pre-call goal alignment 和 post-call information extraction 高度互补，而 non-repeated-goal regularizer 有效强制执行了精确、选择性的工具利用。这些发现确立了鲁棒的 agentic VLMs 需要对证据获取进行细粒度过程监督，而非仅基于工具调用数量或最终答案正确性的粗略激励。", "additional_insights": "### § 8 Take-aways\n\n这篇论文的核心贡献是提出了 **NTEP-R**，一个用于训练 agentic VLM 的细粒度过程奖励框架。它解决了现有方法仅依赖最终答案正确性来监督工具使用的根本缺陷，即模型可能发出冗余或偏离目标的工具调用，即使调用了正确工具也可能无法提取所需信息。\n\nNTEP-R 的关键创新在于引入了 **NTEP（Necessary Tool-Evidence Path）**，这是一种显式的标注方案，为每个训练样本定义了必要的证据目标、对应的工具调用以及必须从返回结果中提取的关键信息。这相当于为每个问题绘制了一张“证据获取路线图”。\n\n基于 NTEP，NTEP-R 提供了双阶段的过程监督：**预调用目标对齐奖励**，检查模型在调用工具前的意图是否指向必要的证据目标；**后调用信息获取奖励**，检查模型是否成功从工具返回的观察中提取了所需信息。此外，**非重复目标正则化器** 明确惩罚那些重复访问已满足的 NTEP 目标的冗余调用。\n\n实验在七个图像基准上验证了 NTEP-R 的有效性。在统一的三工具框架下，**NTEP-8B** 在搜索导向准确率和工具使用效率上均显著优于强基线，包括 SenseNova-MARS-8B。具体来说，NTEP-8B 在搜索平均准确率上提升 2.43 个百分点，同时将平均工具调用次数从 2.54 次降至 1.89 次。\n\n消融实验揭示了每个奖励组件的互补性：仅有目标对齐奖励会导致模型陷入“饱和式调用”模式，平均调用次数飙升至 5.36 次，而准确率反而下降。完整的 NTEP-R 则将调用次数降至 1.55 次，同时保持高准确率。这证明，仅靠最终答案奖励无法区分有效和无效的工具调用。\n\n一个特别有说服力的发现是 **跨工具 OOD 迁移** 能力。仅用搜索工具训练的 NTEP-8B，在评估时引入从未见过的 zoom 工具后，视觉平均准确率从 75.01% 提升至 82.32%，同时调用次数下降。这表明 NTEP-R 学习的是抽象的“证据获取策略”，而非死记硬背特定工具的使用模式。\n\n### § 9 最脆弱的假设\n\nNTEP-R 最脆弱的假设是：**由教师模型蒸馏出的 NTEP 路径是正确且完整的**。整个奖励机制的有效性完全建立在“每个训练样本的必要证据目标、对应工具和所需信息都被准确识别”这一前提之上。如果这个假设不成立，NTEP-R 的奖励信号就会从根本上出错，导致模型被引导去追求错误的目标或忽略真正关键的信息。\n\n这个假设在实际中可能不成立的原因有两点。第一，**教师模型本身可能犯错**。论文使用 Gemini-3.1-Pro 作为教师来蒸馏 NTEP 路径，但即使是更强的模型，在面对需要复杂推理或罕见知识的查询时，也可能错误地识别“必要”证据。例如，一个问题可能有两种完全不同的解决路径，教师模型可能只识别了其中一条，而忽略了另一条同样有效甚至更优的路径。第二，**“必要”证据的定义具有主观性**。对于某些开放性问题，什么是“必要”的证据可能没有唯一答案。教师模型蒸馏出的路径可能只是众多合理路径中的一种，而 NTEP-R 的奖励机制会惩罚那些偏离这条特定路径但同样有效的工具调用，从而限制了模型的探索空间。\n\n论文为这个假设提供了部分证据：通过人类审计验证了判断器（judge）的可靠性（97% 一致率，Cohen's κ = 0.94），但这主要验证了“判断器能否正确评估模型行为是否与 NTEP 对齐”，而非“NTEP 本身是否正确”。论文没有系统性地评估 NTEP 路径的质量，例如，没有报告教师模型蒸馏路径的成功率，也没有分析当 NTEP 路径存在错误或遗漏时，模型行为会如何退化。这个假设一旦失败，核心贡献会直接失效，因为整个奖励信号都建立在错误的“路线图”之上。\n\n### § 10 最小复现实验\n\n如果只有 1 周时间，我会设计一个实验来验证 NTEP-R 最独特且可分离的贡献：**非重复目标正则化器** 能否有效减少冗余工具调用，而不会损害最终答案的准确率。\n\n**数据**：使用一个简单的合成问答数据集。例如，从 Wikipedia 收集 500 个事实性问题，每个问题对应一个唯一的事实（如“爱因斯坦的出生年份是？”）。为每个问题准备一个包含该事实的文本段落作为“工具返回结果”。这样，模型只需要调用一次 text_search_tool 就能获得答案。\n\n**实现**：基于一个开源的 7B VLM（如 Qwen2-VL-7B-Instruct）构建一个极简的 agentic 框架，只包含一个 text_search_tool。实现两个版本的奖励函数：\n1.  **NTEP-R 完整版**：包含预调用目标对齐、后调用信息获取和非重复目标正则化器。\n2.  **NTEP-R 无正则化器版**：移除非重复目标正则化器，仅保留前两个奖励组件。\n\n使用 GRPO 对这两个版本进行微调，训练数据为 400 个问题，保留 100 个用于测试。训练 50 个 GRPO 步骤。\n\n**测量**：在测试集上测量两个关键指标：\n1.  **准确率**：最终答案的正确率。\n2.  **平均工具调用次数**：每个问题平均调用的 text_search_tool 次数。\n3.  **冗余调用率**：在已获得正确答案所需信息后，仍然继续调用工具的比例。\n\n**结果解读**：\n-   **支持 NTEP-R 的 claim**：如果完整版相比无正则化器版，在准确率持平或略有提升的情况下，平均工具调用次数和冗余调用率显著下降（例如，调用次数从 2.5 次降至 1.2 次，冗余率从 30% 降至 5%），则证明非重复目标正则化器是有效的。\n-   **反驳 NTEP-R 的 claim**：如果两个版本在调用次数和准确率上没有显著差异，或者完整版的准确率显著下降（例如，模型因为害怕被惩罚而不敢进行必要的重试），则说明该正则化器要么无效，要么过于激进，损害了模型性能。\n\n这个实验不需要复现完整的 NTEP 路径蒸馏流程，而是直接验证其奖励设计中一个关键组件的效果，成本低且结论清晰。", "research_value": "### § 11 最强反例设计\n\n如果我反对这篇论文，我会设计一个**多路径依赖的开放性视觉推理任务**来攻击其核心假设：即教师模型蒸馏出的 NTEP 是唯一且必要的推理路径。这个反例实验旨在证明，NTEP-R 的显式路径监督实际上是一种**过拟合教师模型推理捷径**的机制，它在抑制模型探索更优或同等有效替代路径的能力。具体而言，我会构建一个包含 500 个复杂视觉查询的数据集（如医学影像诊断或多实体关系推理），其中每个问题都存在至少两条完全不同的有效证据获取路径（例如：路径 A 先 zoom 局部再 text search 疾病名称；路径 B 先 image search 整体病灶特征再 zoom 确认边界）。在训练阶段，教师模型（Gemini-3.1-Pro）只为每个样本蒸馏出一条 NTEP 路径（如路径 A）。在评估阶段，我会在环境中引入扰动，例如人为禁用路径 A 中的某个关键工具，或增加该工具的调用延迟，迫使模型必须采用路径 B 才能得出正确答案。我的预期结果是，相比于仅使用 outcome-centric reward 的 RL baseline，经过 NTEP-R 训练的模型在面临工具扰动时，准确率会出现断崖式下跌，且工具调用次数激增。这是因为 NTEP-R 的 non-repeated-goal regularizer 和 pre-call intent alignment reward 会强烈惩罚偏离 NTEP 路径的探索行为，导致模型陷入了“路径依赖的脆弱性”。这个反例直接挑战了论文声称的“NTEP-R 学习了抽象的证据获取策略”这一结论，提出替代解释：NTEP-R 的性能提升仅仅是因为模型在标准基准测试（通常具有单一解题路径）上 memorize 了教师模型的特定工具调用模式，而非真正掌握了鲁棒的推理能力。\n\n### § 12 Follow-up Research Idea\n\n基于对方法核心局限的理解，我提出一个非增量的 novel research idea：**基于反事实推理的因果充分性奖励**。这个想法由 NTEP-R 的核心局限驱动：依赖教师模型蒸馏的静态“必要路径”不仅成本高昂，且在开放性任务中假设了“唯一正确路径”，这从根本上限制了 agent 的探索空间并引入了教师模型的偏见。我们需要一种不依赖外部预设路线图的内生监督信号，来动态评估每次工具调用对最终推理的真实因果贡献。这可以借鉴因果推断领域的**干预与反事实评估**方法，将工具调用视为对推理状态的干预，通过比较事实轨迹与反事实轨迹来计算单次调用的因果效应。具体而言，不再显式标注 NTEP，而是在模型生成一条成功的推理轨迹后，随机选择其中的一个工具调用节点，将其返回的 observation 替换为空集或随机噪声（即反事实干预），然后让模型基于这个被篡改的轨迹继续生成最终答案。如果最终答案因此变得错误，说明该工具调用具有高因果充分性，给予正向奖励；如果答案保持不变，则说明该调用是冗余的，给予惩罚。第一个实验大概长这样：在一个多跳视觉问答基准上，使用相同的 7B VLM 基座，对比 NTEP-R 和因果充分性奖励（CSR）。关键评测指标除了准确率和工具调用次数外，重点考察**路径多样性**和**扰动鲁棒性**。我预期 CSR 能够在保持与 NTEP-R 相当的准确率和调用效率的同时，在路径多样性指标上显著优于 NTEP-R，并且在面临工具故障时表现出更强的退化韧性。这个提议与已有工作的根本区别在于，它将过程监督的范式从“对齐预设的专家轨迹”转变为“评估干预的因果效应”，彻底摆脱了对完美教师标注的依赖，为训练真正具备自主探索能力的 agentic VLM 打开了新的方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "{\n  \"authors\": [\n    {\"name\": \"Xingming Long\", \"affiliations\": [3], \"markers\": [\"*\"]},\n    {\"name\": \"Yu Liu\", \"affiliations\": [1, 3], \"markers\": [\"*\", \"†\"]},\n    {\"name\": \"Zhiwei Yang\", \"affiliations\": [1, 3], \"markers\": [\"*\"]},\n    {\"name\": \"Hanqi Feng\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Shaojie Zhang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Barnabas Poczos\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Chao Jiang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Zhenbo Luo\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Lei Jiang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Pei Fu\", \"affiliations\": [3], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"IIE, CAS\"},\n    {\"id\": 2, \"name\": \"CMU\"},\n    {\"id\": 3, \"name\": \"MiLM Plus, Xiaomi Inc.\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"These authors contributed equally.\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author.\"}\n  ]\n}", "summary_translation": "现代 vision-language models (VLMs) 能够直接回答许多基于图像的问题，但它们在处理需要细粒度视觉细节或外部知识的复杂查询时往往显得力不从心。为了获取这些缺失的证据，agentic VLMs 会调用诸如 image cropping、image search 和 text search 等工具。然而，现有的训练范式主要基于最终答案的正确性来评估 tool-use，导致证据的获取和利用缺乏充分的监督。这导致了两个关键缺陷：(i) 模型经常发出冗余或偏离目标的 tool calls，无法收集必要的证据，以及 (ii) 即使调用了合适的工具，模型也常常无法从产生的观察结果中提取必要的信息。为了解决这些局限性，我们引入了 NTEP (Necessary Tool-Evidence Path)，这是一种新颖的标注方案，明确为每个查询指定了必不可少的外部证据及相应的 tool calls。在此基础上，我们提出了 NTEP-R (NTEP Reward)，这是一种监督机制，确保每次 tool invocation 都严格推进推理过程以趋向最终解决方案。具体而言，我们的方法对 agent 进行奖励，要求其将 pre-call intent 与必要的证据寻找目标对齐，并确保从 post-call observation 中总结出的信息与必要证据对齐。此外，我们引入了 non-repeated-goal regularizer，以惩罚那些重复访问已满足的 NTEP goals 的冗余调用。在七个 image-grounded benchmarks 上的广泛评估表明，我们的 8B-parameter instantiation NTEP-8B 在统一的三工具框架内显著提高了 search-oriented accuracy 和 tool-use efficiency。这些结果突显了细粒度的 tool-evidence path supervision 在训练鲁棒的 agentic VLMs 中的关键价值。"}]}, {"name": "Terminal Agent Environments", "count": 2, "papers": [{"title": "Terminal-Universe: Turning Agent Trajectories into Scalable Terminal Environments", "arxiv_id": "2609.04148", "authors": "Jie Wu, Zhenru Zhang, Beichen Zhang, Xuwu Wang, Yuhui Su, Mouxiang Chen, Peng Wang, Zhihai Wang, Que Shen, Hao Zhou, An Yang, Fei Huang, Yujiu Yang, Dayiheng Liu", "summary": "As terminal-based code agents become prevalent, agent trajectories have accumulated at scale, while realistic, executable environments remain scarce. However, environments are what agent post-training actually requires: each can be re-queried into many verifiable tasks and provides execution feedback, whereas a trajectory is a single frozen demonstration. Rather than generating environments from scratch, we observe that the tool-execution history in existing trajectories exposes the structure and contents of the environments in which they ran, making it possible to reconstruct those environments from the trajectories themselves. Thus, we introduce Terminal-Universe, a framework which turns each trajectory into a reusable environment and explores it for synthesizing new tasks and continued interactions. Specifically, Terminal-Universe replays the file operations recorded in a trajectory to restore each file before the agent modified it, yielding a partial workspace; a completion agent then supplies the missing files and dependencies. On this recovered workspace, we both reconstruct the original intent task and synthesize entirely new ones. Besides, we also scale the tasks along two complementary axes: breadth and depth. For breadth, we mine directional dependency relations between related environments and synthesize cross-workspace queries spanning multiple codebases, as developers routinely do in real-world development. For depth, we extend the initial single-turn query into a multi-round session that captures iterative user feedback and requirement refinement via a user agent. Applied to public terminal agent trajectories, Terminal-Universe produces 37.3k task-sufficient environments. Supervised fine-tuning of Qwen3.5-27B on this corpus improves single-round performance on Terminal-Bench 2.1 by 11.9 points and multi-round performance on EvoCode-Bench v2 MT@4 by 13.8 points.", "category": "cs.CL", "cluster": "Terminal Agent Environments", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是提出了 Terminal-Universe 框架，将现有的智能体轨迹转化为可重用的、可执行的终端环境，并利用这些环境合成新任务和持续交互，以支持智能体的后训练和微调。这直接符合筛选标准中第一步的“保留”规则：论文研究了 agent 的 execution environment / continual harness，并且其核心贡献是通过轨迹、反馈和观测结果来改进智能体的训练和演化。此外，论文明确以 terminal-based code agents 为研究对象，涉及 agent training/distillation，属于 Agentic AI 的前沿研究。论文不涉及安全、多模态、图技术或多智能体拓扑编排等排除项。因此，该论文与构建、改进和训练 LLM 智能体的研究目标高度相关。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的研究问题是如何从已有的 agent trajectories 中重建可复用的 executable environments，并利用这些环境合成新的 tasks 和持续的交互，以解决 terminal-based code agents 训练中真实可执行环境稀缺的瓶颈。随着 terminal-based code agents 的普及，积累了海量的 agent trajectories，但与之形成鲜明对比的是，真实、可执行的环境却极为稀缺。对于 agent post-training 而言，环境远比 trajectory 更有价值：同一个环境可以被反复查询以生成大量可验证的 tasks，并提供真实的 execution feedback，而一条 trajectory 仅仅是某个 policy model 在特定时刻产生的一次性、固定的 demonstration，其质量受限于该模型的能力，且无法验证其对 codebase 的修改是否正确。现有的 expert-authored benchmarks（如 Terminal-Bench）虽然通过为每个 task 配备 custom container、instruction 和 executable verifier 实现了高可靠性，但这种可靠性完全依赖人工构建，无法满足 post-training 对大规模环境的迫切需求。因此，如何在训练规模上提供真实且可验证的环境，成为了一个关键挑战。Terminal-Universe 通过将历史 trajectory 转化为可复用的环境，不仅盘活了已有的海量数据资源，还通过 breadth 和 depth 两个维度的 task 扩展，显著提升了 agent 在单轮和多轮场景下的性能，为 grounded agent training data 的合成提供了一种可扩展的新范式。\n\n### § 2 前人工作与不足\n\n在 Terminal-Universe 之前，扩展 executable environments 主要有三条路径，但各自存在根本性局限。**Repository-based methods**（如 SWE-Gym 和 R2E-Gym）从真实 repository 的 git history 中构建 tasks，通过 git 回滚到 bug 修复前的状态作为环境，复用原始 bug report 作为 task，并利用随修复提交的 tests 进行验证。然而，这种方法受限于真实 repository 的历史记录和可注入的 bug 类型，且生成的所有 tasks 都是 repair tasks，范围狭窄。**Perturbation methods**（如 SWE-smith 和 CLI-Gym）在通过测试的 repository 中注入 bug 使部分 tests 失败，再要求 agent 修复。虽然少数 repository 能产出大量 tasks，但同样局限于 repair tasks，且 task 的多样性受限于源 repository 和可注入 bug 的种类。**Task-conditioned synthesis**（如 Endless Term.、TMax、CLI-Universe 和 SkillSynth）则根据 categories、skill taxonomies 或 skill graphs 从头联合生成 task 和 environment。这类方法虽然能控制覆盖率和 task-environment alignment，但由于环境不与任何真实项目绑定，其真实性完全依赖于 generator 的能力，往往只能生成小而整洁的 workspace，而非真实的代码库。此外，虽然已有研究关注 interactive 和 multi-round agents（如 InterCode、SWE-INTERACT、SWETogether 和 EvoCode-Bench v2），但它们主要聚焦于多轮交互的评测或模拟，并未从 trajectory 重建环境的角度解决训练数据规模化的问题。这些前人工作的共同盲点在于：它们要么依赖现有的环境作为起点，要么将环境构建与从头生成的 task 耦合，却忽略了 trajectories 本身作为环境观测资源的潜力。实际上，trajectory 中记录的 tool calls 已经暴露了其运行环境的结构和内容——例如 `Read` 展示文件内容，`Write` 和 `Edit` 展示 workspace 的变化——这足以重建原始 workspace 的可执行副本。Terminal-Universe 正是抓住了这一被忽视的观察，通过 deterministic replay 和 agentic completion 两阶段重建，将 trajectory 从固定的 demonstration 转化为可复用的环境，从而绕过了从头构建环境或依赖特定 repository 历史的限制。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Terminal-Universe 提出之前，code agent 的 post-training 面临一个核心矛盾：真实且可验证的执行环境极其稀缺，而 agent trajectories 却在大量积累。研究者们深知，环境比 trajectory 更有价值，因为环境可以被反复查询以生成新的可验证任务，而 trajectory 只是一次固定的、且可能包含错误的演示。为了扩大环境规模，前人尝试了三种路径：从真实仓库的 git 历史中提取环境、向正常工作的代码库注入 bug、或者根据抽象规则从头合成任务与环境。然而，这些方法要么受限于真实仓库的 bug 类型，要么生成的环境过于“干净”而缺乏真实工程的复杂性。与此同时，直接使用海量 trajectories 进行 Supervised Fine-Tuning (SFT) 的效果也遭遇瓶颈，因为 policy model 的能力上限直接锁死了 trajectory 的质量，且无法验证其代码修改的正确性。面对这一困境，一个自然的观察浮现出来：trajectory 并非仅仅是文本记录，它内部的 tool-execution history（如 Read、Write、Edit 操作）实际上隐式地暴露了其运行环境的文件结构与内容。如果能够逆向利用这些操作记录，在 agent 修改文件之前恢复其状态，就有可能从现成的 trajectory 中“逆向工程”出可执行的工作区。尽管这种回放只能得到部分工作区，但可以借助 LLM agent 自动补全缺失的依赖文件。一旦环境被成功重建，研究者就可以摆脱原始 trajectory 的质量束缚，利用更强的 teacher model 在重建的环境中重新求解任务，并通过自动生成的 verifier 进行严格验证，从而将不可靠的固定演示转化为高质量、可扩展的训练数据源。\n\n### § 4 核心 Intuition\n\nTrajectory 和 environment 本质上是同一个执行过程的两个视角。现有工作是从 environment 推演出 trajectory，而这篇论文的核心 Intuition 在于逆转这一映射：利用 trajectory 中记录的文件操作历史来重建其原始的执行环境。因为 agent 的 tool calls 已经暴露了工作区的结构与内容，通过回放这些操作并补全缺失的上下文，就能将一次性的固定演示转化为可重用、可验证的执行环境，从而支持更强模型的重新求解与多样化新任务的合成。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Terminal-Universe: Turning Agent Trajectories into Scalable Terminal Environments》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出的研究问题是如何从已有的 agent trajectories 中重建可复用的 executable environments，并利用这些环境合成新的 tasks 和持续的交互，以解决 terminal-based code agents 训练中真实可执行环境稀缺的瓶颈。随着 terminal-based code agents 的普及，积累了海量的 agent trajectories，但与之形成鲜明对比的是，真实、可执行的环境却极为稀缺。对于 agent post-training 而言，环境远比 trajectory 更有价值：同一个环境可以被反复查询以生成大量可验证的 tasks，并提供真实的 execution feedback，而一条 trajectory 仅仅是某个 policy model 在特定时刻产生的一次性、固定的 demonstration，其质量受限于该模型的能力，且无法验证其对 codebase 的修改是否正确。现有的 expert-authored benchmarks（如 Terminal-Bench）虽然通过为每个 task 配备 custom container、instruction 和 executable verifier 实现了高可靠性，但这种可靠性完全依赖人工构建，无法满足 post-training 对大规模环境的迫切需求。因此，如何在训练规模上提供真实且可验证的环境，成为了一个关键挑战。Terminal-Universe 通过将历史 trajectory 转化为可复用的环境，不仅盘活了已有的海量数据资源，还通过 breadth 和 depth 两个维度的 task 扩展，显著提升了 agent 在单轮和多轮场景下的性能，为 grounded agent training data 的合成提供了一种可扩展的新范式。 ### § 2 前人工作与不足 在 Terminal-Universe 之前，扩展 executable environments 主要有三条路径，但各自存在根本性局限...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在 Terminal-Universe 提出之前，code agent 的 post-training 面临一个核心矛盾：真实且可验证的执行环境极其稀缺，而 agent trajectories 却在大量积累。研究者们深知，环境比 trajectory 更有价值，因为环境可以被反复查询以生成新的可验证任务，而 trajectory 只是一次固定的、且可能包含错误的演示。为了扩大环境规模，前人尝试了三种路径：从真实仓库的 git 历史中提取环境、向正常工作的代码库注入 bug、或者根据抽象规则从头合成任务与环境。然而，这些方法要么受限于真实仓库的 bug 类型，要么生成的环境过于“干净”而缺乏真实工程的复杂性。与此同时，直接使用海量 trajectories 进行 Supervised Fine-Tuning (SFT) 的效果也遭遇瓶颈，因为 policy model 的能力上限直接锁死了 trajectory 的质量，且无法验证其代码修改的正确性。面对这一困境，一个自然的观察浮现出来：trajectory 并非仅仅是文本记录，它内部的 tool-execution history（如 Read、Write、Edit 操作）实际上隐式地暴露了其运行环境的文件结构与内容。如果能够逆向利用这些操作记录，在 agent 修改文件之前恢复其状态，就有可能从现成的 trajectory 中“逆向工程”出可执行的工作区。尽管这种回放只能得到部分工作区，但可以借助 LLM agent 自动补全缺失的依赖文件。一旦环境被成功重建，研究者就可以摆脱原始 trajectory 的质量束缚，利用更强的 teacher model 在重建的环境中重新求解任务，并通过自动生成的 verifier 进行严格验证，从而将不可靠的固定演示转化为高质量、可扩展的训练数据源。 ### § 4 核心 Intuition Trajectory 和 environment 本质上是同一个执行过程的两个视角。现有工作是从 environment 推演出 trajectory，而... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：2026-09-04 **==\u003E picture [19 x 19] intentionally omitted \u003C==** # **Terminal-Universe: Turning Agent Trajectories into Scalable Terminal Environments** Jie Wu[1,2,*] , Zhenru Zhang[1,‡] , Beichen Zhang[1] , Xuwu Wang[1] , Yuhui Su[1] , Mouxiang Chen[1] , Peng Wang[1] , Zhihai Wang[1] , Que Shen[1] , Hao Zhou[1] , An Yang[1] , Fei Huang[1] , Yujiu Yang[2,†] , Dayiheng Liu[1,†] **1Qwen Team, Alibaba Group 2Tsinghua University** ‡Project leader †Corresponding authors ## **Abstract** As terminal-based code agents become increasingly prevalent, the corresponding agent trajectories have accumulated at scale, while realistic, executable environments remain scarce. However, environments are what agent post-training actually requires: each one can be re-queried into many verifiable tasks and provides the execution feedback, whereas a trajectory is a single frozen demonstration. Rather than generat...", "additional_insights": "### § 8 Take-aways\n\n论文提出 Terminal-Universe 框架，将已有的 agent trajectories 转化为可复用的 executable environments，而非从零构建或依赖真实 repository history。通过 deterministic replay 重放文件操作恢复 partial workspace，再由 agentic completion 补全缺失依赖，最终将 workspace sufficiency rate 从 40.2% 提升至 93.5%。在重建环境上，通过 Intent Recovery、Single-WS、Cross-WS 和 Multi-Round 四种方式生成新任务，其中 Cross-WS 通过跨代码库依赖挖掘扩展任务广度，Multi-Round 通过 user agent 模拟迭代反馈扩展任务深度。实验表明，在重建环境中重新求解任务远优于直接模仿原始 trajectories（52.1 vs 36.7），且 verifier filtering 对高难度任务（如 Cross-WS）尤为关键，能以不到一半的数据量实现更高性能。在固定数据预算下，扩展 environment 数量比增加 query 或 solution 数量更有效，说明环境多样性是提升 agent 能力的核心驱动力。\n\n### § 9 最脆弱的假设\n\n最关键的假设是：agentic completion 能够在不泄露解决方案的前提下，准确补全 workspace 的缺失文件和依赖，使重建环境足以支撑任务求解。如果 completion agent 引入了与原始项目不一致的依赖、错误配置或泄露了 solution，那么后续的 task generation、verifier 构建和 teacher rollout 都会建立在错误的环境基础上，导致整个 pipeline 产出的训练数据质量崩塌。论文提供了部分证据：Table 2 显示 completion 将 sufficiency rate 提升至 93.5%，Table 5 显示 completed environments 比 replay-only 提升 4.2 分。但论文也承认（§B.1），在 30 个随机抽样的 Terminal completions 中，有 8 个引入了不必要的文件，且 verifier 和 solution 均由同一 teacher model（Qwen3.7-Max）生成，缺乏独立验证，这意味着 completion 的错误可能被同源 verifier 掩盖，sufficiency rate 可能被高估。\n\n### § 10 最小复现实验\n\n用一周时间可验证 agentic completion 对 environment sufficiency 的贡献。从公开的 LFM2-Terminal 数据集中抽取 100 条 trajectories，仅实现 deterministic replay 阶段，得到 100 个 partial workspaces。然后用一个开源 LLM（如 Qwen2.5-72B）作为 completion agent，按论文 §B.1 的 prompt 对每个 workspace 进行补全。再用另一个 LLM 作为 judge，按论文 §B.2 的 sufficiency 标准评估 replay-only 和 replay+completion 两组 workspace 的 task-sufficiency。测量两组的 sufficiency rate 差值。若 completion 后 sufficiency rate 显著上升（如从 40% 左右升至 80% 以上），则支持论文的核心 claim；若提升有限或 judge 发现大量不一致的补全，则表明 completion 的实际效果被高估。此实验无需实现 task generation、verifier 或 SFT pipeline，即可验证 pipeline 最基础的环节是否成立。", "research_value": "### § 11 最强反例设计\n\n要对该论文进行最有力的攻击，我会设计一个针对“Verifier-Teacher Homology”（验证器与教师模型同源）和“Hidden State Blindness”（隐藏状态盲区）的联合反例实验，旨在证明其报告的 93.5% sufficiency rate 和 SFT 性能提升是建立在同源 LLM 的“闭环幻觉”之上，而非真实的可执行环境。具体而言，我会从生成的 Cross-WS 和 Multi-Round 任务中抽取 200 个被论文判定为“task-sufficient”且 verifier 验证通过的环境，引入一个完全独立的、基于真实 Docker container 的 ground-truth execution engine 进行交叉验证。在这个独立验证中，我会刻意剥离 trajectory 中未记录的非文件系统状态（如 background processes、database states、network sockets 或特定的 OS-level environment variables）。如果论文的核心 claim 成立，这些环境应当能独立支撑 task 的求解；但如果我的假设正确，当独立 verifier 强制要求依赖这些隐藏状态时，环境的实际 sufficiency rate 将发生断崖式下跌。进一步地，我会对 SFT 后的 agent 进行 probing 测试，提出一个替代解释：agent 在 Terminal-Bench 2.1 上 11.9 分的提升并非源于“环境多样性带来的泛化能力”，而是因为 agent 在同源 teacher model 生成的“简化版”环境中过拟合了 LLM 偏好的代码结构与错误模式。当面对真实世界中由人类编写的、充满非标准依赖和隐藏状态的历史代码库时，这个 SFT agent 的表现将劣于未经过此微调的 baseline，从而证明 Terminal-Universe 实际上是在批量制造“LLM 友好的伪环境”，而非真实的 executable environments。\n\n### § 12 Follow-up Research Idea\n\n基于 Terminal-Universe 试图从静态 trajectory 重建环境却受限于文件系统快照的局限，我提出一个全新的研究方向：**Latent Environment World Models for Agent Training**。该想法的驱动需求在于，真实的 terminal 环境本质上是一个具有复杂动态反馈的 state machine，而现有的 deterministic replay 和 agentic completion 试图去“物质化”地重建文件，这注定无法捕捉 OS 级别的隐藏状态和执行副作用，且极易泄露 solution。我们可以借鉴强化学习与机器人控制领域的 World Model（如 Dreamer 系列或 Learned Simulators）以及因果推断中的 Structural Causal Models (SCMs)。不再试图重建一个物理上可执行的 Docker container，而是训练一个 Neural World Model，使其从海量 agent trajectories 中学习环境的状态转移概率分布：给定当前 latent state 和 agent 的 tool call（如 `bash_command`），直接预测下一个 terminal output 和 workspace diff。第一个实验将聚焦于构建一个基于 Transformer 的 autoregressive environment simulator，并在包含大量隐藏状态交互（如启动后台服务、修改系统配置）的轨迹上训练它。随后，将一个 RL agent 放入这个“神经模拟器”中进行 post-training，并与在 Terminal-Universe 重建的物理容器中训练的 agent 进行对比。如果 agent 在 Neural World Model 中能习得处理隐藏状态的能力，且训练成本远低于维护海量真实容器，这将彻底打破现有“从轨迹重建物理环境”的范式，开启“将环境本身作为可学习分布”的全新研究方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jie Wu\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Zhenru Zhang\", \"affiliations\": [1], \"markers\": [\"‡\"]},\n    {\"name\": \"Beichen Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xuwu Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuhui Su\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Mouxiang Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Peng Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhihai Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Que Shen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hao Zhou\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"An Yang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Fei Huang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yujiu Yang\", \"affiliations\": [2], \"markers\": [\"†\"]},\n    {\"name\": \"Dayiheng Liu\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Qwen Team, Alibaba Group\"},\n    {\"id\": 2, \"name\": \"Tsinghua University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Work done during the internship at Qwen Team, Alibaba Group.\"},\n    {\"marker\": \"‡\", \"text\": \"Project leader\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding authors\"}\n  ]\n}\n```", "summary_translation": "随着基于终端的代码 agent 变得普及，agent trajectories 正在大规模积累，而现实且可执行的环境仍然稀缺。然而，环境才是 agent post-training 真正需要的：每个环境都可以被重新查询以生成许多可验证的任务，并提供执行反馈，而 trajectory 只是一个单一的、固定的 demonstration。与其从零开始生成环境，我们观察到现有 trajectories 中的 tool-execution history 暴露了它们所运行环境的结构和内容，这使得从 trajectories 自身重建这些环境成为可能。因此，我们引入了 Terminal-Universe，这是一个将每个 trajectory 转化为可重用环境，并对其进行探索以合成新任务和持续交互的框架。具体而言，Terminal-Universe 重放 trajectory 中记录的文件操作，以将每个文件恢复到 agent 修改它之前的状态，从而生成一个 partial workspace；随后，一个 completion agent 补充缺失的文件和依赖项。在这个恢复的 workspace 上，我们既重建了原始的 intent task，又合成了全新的任务。此外，我们还沿着两个互补的维度来扩展任务：广度和深度。对于广度，我们挖掘相关环境之间的 directional dependency relations，并合成跨越多个 codebases 的 cross-workspace queries，正如开发者在真实世界开发中经常做的那样。对于深度，我们将初始的 single-turn query 扩展为 multi-round session，通过 user agent 捕获迭代的用户反馈和需求细化。应用于公开的 terminal agent trajectories，Terminal-Universe 生成了 37.3k 个 task-sufficient environments。在该语料库上对 Qwen3.5-27B 进行 Supervised fine-tuning，使其在 Terminal-Bench 2.1 上的 single-round performance 提升了 11.9 分，并在 EvoCode-Bench v2 MT@4 上的 multi-round performance 提升了 13.8 分。"}, {"title": "Environment Evolution for Terminal Agents", "arxiv_id": "2609.04128", "authors": "Zhiyuan Fan, Tinghao Yu, Yuanjun Cai, Jiang Zhou, Jiangtao Guan, Jincheng Liu, Yun Yang, Dingxin Hu, Zhuo Han, Xing Wu, Feng Zhang, Lilin Wang", "summary": "Scaling interactive and verifiable environments is critical for training terminal agents. As frontier models become more capable, environments synthesized from scratch become less challenging and thus provide limited learning signals. Recent co-evolution methods iteratively synthesize environments near the model's learnable frontier based on weaknesses exposed during rollouts. However, their dependence on on-policy rollouts limits generalization and the continuous provision of learning signals as the model becomes stronger. In this paper, we propose environment evolution, which incrementally increases environment difficulty off-policy and schedules the evolved environments generation by generation during training to provide continuous learning signals. We derive three evolution directions that influence environment difficulty from the multi-turn learning objective and then implement evolution along these directions through a loop-engineered multi-agent harness. Quantitative rollout experiments with Hy4 preview, Claude Opus 5, and GPT-5.6 Sol show that environment evolution consistently produces more difficult environments. We validate its effectiveness on Qwen3.6-27B and Qwen3.6-35B-A3B through simple long-horizon RL training, improving their performance by 14.4 and 18.0 percentage points on Terminal-Bench 2.1, respectively.", "category": "cs.AI", "cluster": "Terminal Agent Environments", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了一种“环境演化”方法，通过 off-policy 方式增量增加环境难度，并利用一个 loop-engineered multi-agent harness（多智能体框架）来实现环境演化，从而为 terminal agents 的 long-horizon RL 训练持续提供学习信号。这完全符合筛选标准中的多个“保留”条件：首先，它研究了 agent training/RL 和 long-horizon agents；其次，它利用 multi-agent harness 作为核心机制来驱动环境的自动演化和改进，属于智能体运行组件的演化；最后，其核心机制涉及 co-evolution 和 environment evolution，属于自我演化与持续学习的范畴。论文没有触及任何排除标准（如安全、纯多智能体拓扑通信协议、图技术等），因此高度契合“LLM智能体及其演化”的研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：如何为训练 terminal agents 持续扩展可交互、可验证的 RL environments，使得在前沿模型能力不断增强的背景下仍能提供有效的学习信号。随着工业级 agentic RL 算法的稳定和异步基础设施的成熟，进一步扩展的瓶颈已从算法和系统转向环境本身——环境的难度和多样性是决定 agent 能通过 verifiable feedback 学到什么的核心杠杆，其中自适应难度保持持续学习潜力，多样性支持泛化能力。然而，当前从零合成的大规模 terminal environments 对前沿模型而言已不够具有挑战性，模型在重复 rollouts 中能稳定解决它们，导致这些环境在 RL 训练中因无法区分好坏 trajectory 而被丢弃，既浪费环境构建成本又降低保留训练分布的多样性。现有的 co-evolution 方法虽能通过 on-policy rollouts 暴露模型弱点来指导新环境合成，但其依赖 rollout model 和初始环境分布，限制了泛化能力，且当训练饱和、模型失败变得稀疏时无法持续提供学习信号。论文提出的 environment evolution 通过 off-policy 方式逐代增量提升环境难度，并沿 lineage 调度演化环境以提供持续学习信号，在 Qwen3.6-27B 和 Qwen3.6-35B-A3B 上分别将 Terminal-Bench 2.1 性能提升了 14.4 和 18.0 个百分点，验证了该范式的有效性。\n\n### § 2 前人工作与不足\n\n该问题此前已被部分解决，但现有方法在持续提供学习信号方面存在结构性不足。第一类前人工作是从零合成大规模 terminal environments，如 SkillSynth (Fan et al., 2026)、Endless terminals (Gandhi et al., 2026)、CLI-Universe (Hua et al., 2026) 等，通过人工设计的 pipeline 将 GitHub 仓库、技能和网页等资源转化为可执行环境。然而，论文的大规模 rollout 和质量评估实验揭示，这些开源环境存在 reward signal 质量低下的问题（如任务指令与 verification system 不匹配、环境损坏），且对当前前沿模型难度不足，无法提供有意义的学习信号。第二类是 Unsupervised Environment Design (UED) 范式，包括 POET (Wang et al., 2019) 通过环境变异和 agent 跨环境迁移生成新挑战，以及 regret-based generation (Dennis et al., 2021) 和 prioritized level replay (Jiang et al., 2021) 等方法。这些方法在传统 RL 中有效，但迁移到 LLM agents 时需要 designated agent 通过 on-policy rollouts 估计环境难度，生成的环境同时受限于 rollout agent 和初始环境分布。第三类是 agent-environment co-evolution 方法，如 GenEnv (Guo et al., 2025)、CoEvolve (Yang et al., 2026)、EnvGen (Zala et al., 2024) 等，通过收集目标模型的 rollouts、分析失败 trajectory 构建 weakness bank，再据此合成新环境。论文从 multi-turn learning objective 的推导精确揭示了 co-evolution 的根本局限：on-policy co-evolution 产生的信号主要针对 $\\sum_{t=1}^{L} \\mathbb{1}_t^{[\\theta]}[-\\log p_\\theta(\\kappa_t | \\sigma_{t-1}, g)]$，即模型在 seed 环境中已到达场景下的 skill-selection 错误，它既不显式控制所需的 solver 步数 $L$，也不系统地增加在参考分布 $p_T$ 下的 scenario novelty $-\\log p_T(\\sigma | g)$。这意味着 co-evolution 只覆盖了完整难度空间 $(L, -\\log p_T(\\sigma|g), -\\log p_T(\\kappa|\\sigma,g))$ 中的一个子空间，当训练饱和、模型失败变得稀疏时，可合成的有效新环境迅速耗尽。相比之下，environment evolution 直接在完整难度空间上操作，独立于目标策略构建递增难度的 lineage，从而提供了更通用的持续学习信号来源。", "core_insight": "### § 3 重建作者的思考路径\n\n在训练 terminal agents 时，RL environments 的难度和多样性是决定学习效果的核心杠杆。随着 frontier models 能力的提升，从零合成的环境往往变得过于简单，无法提供有效的 learning signals。为了解决这一问题，现有的 co-evolution 方法通过 on-policy rollouts 暴露模型弱点，并据此生成新环境。然而，这种方法将环境难度与特定 rollout model 的失败模式绑定，导致生成的环境受限于初始环境分布和模型当前能力，随着模型变强，失败变得稀疏，难以持续提供学习信号。作者由此意识到，需要一种脱离特定模型、直接度量环境本身难度的方法。从 multi-turn learning objective 出发，轨迹的负对数似然可以分解为三个贡献因素：所需的 solver turns 数量、scenario 在环境家族中的新颖度，以及所需 skill 在该 scenario 下的稀有度。如果将模型相关的概率替换为基于广泛世界知识的参考分布，难度就不再依附于特定模型，而成为环境家族本身的属性。这一 off-policy 难度公式化揭示了三个可操作的演化方向：增加执行 length、替换 scenario、替换 skill。沿着这些方向逐步修改环境，即可在不依赖 rollout 的情况下构建难度递增的环境谱系，从而持续为 RL 训练提供学习信号。\n\n### § 4 核心 Intuition\n\n环境难度不应由特定模型的成败来定义，而应由环境本身的属性——scenario novelty、skill rarity 和 execution length——来度量。通过用基于世界知识的参考分布替换模型相关的概率，可以将难度从 on-policy 的模型弱点转化为 off-policy 的环境固有特征。沿着这三个维度增量演化环境，构建出难度递增的代际谱系，再按顺序调度进入 RL 训练，即可在不依赖 rollout model 的情况下持续提供有效的 learning signals，突破 co-evolution 随模型饱和而失效的瓶颈。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+-------------------+       (Select Direction: scenario/skill/length)\n| Seed Environment  |-----\u003E [Proposer] -\u003E Extract Seq -\u003E Update Seq\n+-------------------+            |                   |\n                                 v                   v\n                          [Plan Reviewer] \u003C--- (Reject/Rubric Fail)\n                                 | (Pass)\n                                 v\n                          [Modifier] -\u003E Apply Delta_E -\u003E Candidate Env\n                                 |                   |\n                                 v                   v\n                          [Verifiers] \u003C--- (Fail/Repair Budget Out)\n                          /     |     \\\n                         V      V      V\n                    Oracle  Invalid  General\n                                 | (All Pass)\n                                 v\n                         +-----------------+\n                         | Evolved Env (E) | -\u003E [EL Scheduler] -\u003E RL Training\n                         +-----------------+\n```\n\n结合一个真实的终端任务例子（解压并分析日志文件），完整 pipeline 的步骤如下：\n\n- **输入**：系统接收一个 Seed Environment，例如一个要求 agent 使用 `tar` 解压日志并用 `grep` 提取错误信息的任务环境。\n- **处理 1：序列提取与更新**：[Proposer] 从当前环境中提取执行序列（如 scenario: 解压 -\u003E skill: `tar`）。系统根据随机选择的 evolution direction（如 length）更新该序列，例如插入一个新的 scenario-skill pair（如 scenario: 转码 -\u003E skill: `iconv`），从而生成 Evolution Plan。\n- **处理 2：计划审查回路**：[Plan Reviewer] 基于 rubric 审查该计划。如果计划不合理（例如引入的依赖过于突兀），则退回 [Proposer] 重新修改；若通过，则进入下一阶段。若当前 direction 耗尽修复预算，则触发 cross-mode fallback 切换至其他 direction。\n- **处理 3：环境修改与验证回路**：[Modifier] 根据计划生成残差修改并应用到环境代码中，生成 Candidate Env。该候选环境需通过 [Verifiers] 的三项并行检查：Oracle 验证参考解可执行，Invalid 验证空操作会失败，General 检查环境整体质量。若验证失败，则退回 [Modifier] 修复。\n- **输出**：通过所有验证的 Candidate Env 成为正式的 Evolved Env (E)。这些环境按代际被推入 [EL Scheduler]，调度器根据 agent 的实时 pass rate 阈值，按顺序将不同难度的环境喂给 RL Training，确保持续提供有效的学习信号。\n\n### § 6 核心数学推导\n\n论文在第 3 节从 multi-turn learning objective 推导出了 off-policy 的 environment difficulty formulation，这是指导环境演化的核心理论基础。\n\n**理论背景与 Intuition**：\n在 RL 中，通常用 on-policy rollout 的 pass rate 来估计环境难度。但这反映的是特定模型 $\\theta$ 的弱点，而非环境本身的属性。为了获得与模型无关的难度度量，作者将 agent 的底层执行轨迹抽象为高层的 scenario ($\\sigma$) 和 skill ($\\kappa$) 交错序列。\n\n1. **Model-specific difficulty**：在模型 $\\theta$ 下，轨迹的负对数似然分解为三部分：执行步数 $L$、scenario novelty $-\\log p_\\theta(\\sigma|g)$ 和 skill rarity $-\\log p_\\theta(\\kappa|\\sigma,g)$。Intuition 是：步数越多、场景越罕见、技能越罕见，对特定模型来说越难。\n2. **Model-agnostic environment difficulty**：为了消除模型依赖，作者将概率分布替换为基于广泛世界知识的参考分布 $p_T$。Intuition 是：用世界知识来衡量场景和技能在环境家族中的普遍程度，而不是特定模型会不会。这样难度就变成了环境本身的固有属性。\n3. **Agent weakness**：定义为环境难度减去环境家族的基础难度。Intuition 是：weakness 不是环境本身有多难，而是这个环境相对于同类环境，对特定模型来说额外难了多少。\n4. **Evolution directions 的导出**：从上述公式直接得出影响难度的三个维度：length ($L$)、scenario ($-\\log p_T(\\sigma|g)$) 和 skill ($-\\log p_T(\\kappa|\\sigma,g)$)。这为后续的 environment evolution 提供了明确的操作空间。\n\n### § 7 实验设计与结论\n\n论文通过四个核心实验验证了 environment evolution 的有效性：\n\n- **提出了什么问题**：Evolution effort (low, high, max) 如何影响环境难度的演化？\n  **设计了什么实验**：使用相同的 seed environments，在三种 effort 下独立构建 15 代 lineage，用不同前沿模型测量 pass rate 和 avg turns。\n  **问题的答案**：low effort 难度波动且无法降至零；high 和 max effort 能单调降低 pass rate 至零并增加 turns。综合考虑可控性，high 为默认设置。\n\n- **提出了什么问题**：三个 evolution directions (scenario, skill, length) 是否具有稳定且特定的难度调节效果？\n  **设计了什么实验**：固定 high effort，分别应用三个方向于相同 seeds，测量 1-step 和 15-step 的 pass rate 和 turns 变化。\n  **问题的答案**：三个方向均能稳定降低 pass rate 并增加 turns。length 带来最大的 pass rate 下降，scenario 和 skill 带来更大的 turns 增加。1-step 和 15-step 效果一致，说明效果持久。\n\n- **提出了什么问题**：EL Scheduler 是否比随机调度更有效？\n  **设计了什么实验**：在 RL 训练前 50 步比较 EL Scheduler 和 random scheduling 的 partial-solved rate 和 reward。\n  **问题的答案**：EL Scheduler 避免了过早暴露无法解决的环境，使得更多 rollout groups 保持部分解决状态，为 GRPO 提供了更有信息量的学习信号。\n\n- **提出了什么问题**：Environment evolution 是否比其他 paradigm 更能提升 agent 性能？\n  **设计了什么实验**：在 Qwen3.6-27B 和 Qwen3.6-35B-A3B 上进行 200 步 RL 训练，固定环境合成模型和总环境数，比较 environment evolution, co-evolution, ensemble 在 Terminal-Bench 2.1 上的表现。\n  **问题的答案**：Environment evolution 达到了最高的峰值准确率 (71.5% 和 64.9%)，显著优于 co-evolution 和 ensemble，证明了 off-policy 演化能提供更持久的学习信号。", "additional_insights": "### § 8 Take-aways\n本文提出了 *environment evolution*，一种 off-policy 的环境生成范式，通过逐代增量修改现有环境来为 terminal agents 提供持续的 RL 学习信号。作者从 multi-turn learning objective 推导出 model-agnostic 的环境难度公式，指出 *scenario* novelty、*skill* rarity 和 execution *length* 是影响难度的三个关键维度。基于此，本文实现了一个 loop-engineered multi-agent harness，通过 Plan Refinement 和 Environment Refinement 两个反馈循环，沿上述三个方向生成难度递增且通过严格验证的 environment lineage。为避免模型过早接触无法解决的环境，本文提出了 Evolution-Lineage (EL) Scheduler，按代际顺序和 pass rate 阈值调度训练数据，确保 rollout 组内保留有效的 advantage。实验表明，在 Qwen3.6-27B 和 Qwen3.6-35B-A3B 上，该方法比 agent-environment co-evolution 和 environment ensemble 提供了更持久的学习信号，在 Terminal-Bench 2.1 上分别提升了 14.4 和 18.0 个百分点。\n\n### § 9 最脆弱的假设\n本文最核心且失败代价最大的假设是：通过修改 *scenario*、*skill* 和 *length* 生成的 evolved environments，其难度增加是 model-agnostic 的，即不需要依赖特定 target agent 的 on-policy rollouts 就能持续为目标模型提供有效的 RL 学习信号。在实际中，RL 训练需要的是处于模型 capability frontier 附近的相对难度，而非单纯的绝对难度。如果 evolved environments 的难度增长轨迹与目标模型（如 Qwen3.6）的学习进度或弱点分布严重不匹配，这些环境可能对目标模型而言要么太难（导致全失败 rollout，无 within-group advantage），要么偏离了模型真正需要学习的技能分布。虽然论文使用 EL Scheduler 通过 pass rate 阈值来控制环境暴露的节奏，但这只能被动过滤“太难”的环境，无法保证被暴露的环境恰好处于 frontier。论文提供的证据是图5中 partial-solved rate 在前50步保持较高水平，以及图7中最终 benchmark 性能的提升，这间接证明了信号的有效性。然而，论文缺少对 evolved environments 难度分布与目标模型 capability frontier 匹配度的定量分析，也未展示在模型能力发生显著偏移时，off-policy 生成的 lineage 是否仍能自适应地提供有效信号。\n\n### § 10 最小复现实验\n如果有1周时间，可以验证本文最基础的 claim：*environment evolution* 能够 off-policy 地生成难度递增的环境，且这种难度增加对不同模型是一致的。从开源的 terminal environment 数据集中选取 10 个 seed environments，使用 Claude Opus 5 或类似强模型作为 evolver，按照论文所述的 *scenario*、*skill* 和 *length* 三个方向，手动或通过简单 prompt 驱动生成 5 代 lineage，确保每代环境通过 Oracle verifier 和 Invalid-test verifier。然后，使用两个能力差异较大的模型（如 Qwen3.6-27B 和 GPT-5.6 Sol）对每一代环境进行 8 次 rollout。测量每次 rollout 的 pass rate 和 avg turns。如果随着代际增加，两个模型的 pass rate 都呈现单调下降趋势，且 avg turns 逐渐增加，则支持该 claim；如果 pass rate 在某一代突然降至零（难度失控），或者两个模型的表现趋势出现严重分歧（难度增加实际上是 model-specific 的），则反驳了该 claim。此实验无需实现完整的异步 RL 训练系统，即可验证环境演化的核心机制。", "research_value": "### § 11 最强反例设计\n\n要对该论文进行最有力的攻击，核心在于挑战其最脆弱的假设：off-policy 生成的绝对难度能够持续匹配目标模型的 capability frontier。我会设计一个跨架构异构模型的对比实验，以证明 environment evolution 的难度增长轨迹实际上是 model-specific 的，且在模型能力结构不匹配时会迅速失效。具体而言，选取两个参数量相近但能力剖面截然不同的前沿模型，例如一个擅长长程规划但工具调用精度较低的 dense transformer，和一个工具调用极强但长程上下文记忆较弱的 Mixture-of-Experts (MoE) 模型。使用论文所述的 high effort 和三个固定方向生成 15 代 environment lineage，并分别对这两个模型进行 RL 训练。如果论文的 model-agnostic claim 成立，EL Scheduler 应该能为这两个模型都提供持续的 partial-solved rate 和有效的 within-group advantage。然而，我的反例假设是：由于演化方向（特别是 length 和 skill rarity）对模型能力维度的挤压是各向异性的，增加 length 会迅速击穿 dense transformer 的规划瓶颈，导致其 pass rate 在前几代骤降至零，而增加 skill rarity 则会让 MoE 模型因生僻工具调用失败而无法产生有效 gradient。这种绝对难度的线性叠加并未沿着任何单一模型的 capability frontier 前进，而是随机切割了不同模型的能力空间。在此场景下，EL Scheduler 的 pass rate 阈值过滤将退化为一种被动的、极度浪费环境的截断机制，大量生成的 evolved environments 因超出特定模型的 ZPD (Zone of Proximal Development) 而被丢弃。这不仅会大幅降低环境的利用率，还会导致 RL 训练在极少的可用环境子集上过拟合。由此可以提出对论文结果的替代解释：Qwen3.6 系列模型之所以能获得显著提升，并非因为环境难度真正做到了 model-agnostic，而是因为 Qwen3.6 的能力分布恰好与演化生成的难度分布（尤其是 length 和 skill 的叠加速率）较为匹配，这是一种隐式的 on-policy 偏置，而非通用的 off-policy 优势。\n\n### § 12 Follow-up Research Idea\n\n上述反例暴露了一个深层的未满足需求：RL 训练真正需要的不是脱离模型的绝对难度爬升，而是能够精准追踪并施压于模型当前 capability boundary 的相对难度，且这一过程不应受限于高成本的 on-policy rollouts。为了解决这一矛盾，我提出一种新的研究范式：Capability-Aware Environment Morphogenesis (CAEM)，其核心目标是将 environment evolution 从“基于世界知识的绝对难度最大化”转变为“基于模型能力流形的边界梯度最大化”。该方法借鉴了 Active Learning 中的 acquisition function 设计以及 Bayesian Optimization 中的 surrogate modeling 思想。具体而言，不再使用固定的参考分布 $p_T$ 来衡量 scenario 和 skill 的普遍程度，而是首先通过极低成本的 off-policy probing（例如对每个 skill 和 scenario 进行单次或少次 zero-shot rollout）构建目标模型的 capability manifold。在这个流形上，我们可以估计模型在不同 (scenario, skill, length) 组合下的 success probability 等高线。随后，environment evolution 的目标函数被重新定义为寻找那些位于模型 capability frontier 陡峭下降区的环境修改方案，即最大化模型 loss landscape 的曲率，而非单纯最大化环境的负对数似然。第一个实验将设计如下：选取一个目标模型，利用 probing 数据拟合一个轻量级的 Gaussian Process 来预测不同环境配置下的 pass rate。然后，对比 CAEM 与原论文的 uniform evolution 在 200 步 RL 训练中的表现，重点测量环境的 discard rate（因 pass rate 为 0 或 1 而被 EL Scheduler 过滤的比例）以及 benchmark 上的 sample efficiency。与现有的 agent-environment co-evolution 不同，CAEM 不需要在训练循环中持续进行 on-policy rollouts 来更新 weakness bank，而是通过一次性的 capability profiling 指导整个 off-policy 演化过程；与原论文的 environment evolution 不同，CAEM 的演化方向不再是随机选择或固定递增，而是由模型的 capability manifold 形状自适应导出，从而在保持 off-policy 高效性的同时，确保生成的每一个 evolved environment 都精确锚定在模型当前最需要突破的能力边界上。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zhiyuan Fan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Tinghao Yu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuanjun Cai\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiang Zhou\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiangtao Guan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jincheng Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yun Yang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Dingxin Hu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhuo Han\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xing Wu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Feng Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Lilin Wang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Hunyuan Team, Tencent\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "扩展交互式和可验证环境对于训练 terminal agents 至关重要。随着 frontier models 变得更加强大，从零开始合成的环境变得缺乏挑战性，因此提供的 learning signals 有限。最近的 co-evolution methods 根据 rollouts 期间暴露的弱点，迭代地在模型的 learnable frontier 附近合成环境。然而，它们对 on-policy rollouts 的依赖限制了 generalization，并且随着模型变强，也限制了 learning signals 的持续提供。在本文中，我们提出 environment evolution，该方法以 off-policy 方式逐步增加环境难度，并在训练期间逐代调度演化后的环境，以提供持续的 learning signals。我们从 multi-turn learning objective 中推导出影响环境难度的三个演化方向，然后通过 loop-engineered multi-agent harness 沿这些方向实现演化。使用 Hy4 preview、Claude Opus 5 和 GPT-5.6 Sol 进行的定量 rollout 实验表明，environment evolution 能够持续产生更困难的环境。我们通过简单的 long-horizon RL training 在 Qwen3.6-27B 和 Qwen3.6-35B-A3B 上验证了其有效性，分别在 Terminal-Bench 2.1 上将其性能提高了 14.4 和 18.0 个百分点。"}]}]};

const dailyOverviewsRaw = {"2026-09-10": "### 今日AI论文速览 (2026-09-10)\n\n今天的AI研究前沿正全面向“长周期、跨环境”的复杂智能体能力演进。从跨设备GUI交互到结构化与非结构化数据的混合检索，研究者们正致力于打破单一环境与模态的限制。同时，如何通过更精细的强化学习奖励机制、异步RL优化以及有效的记忆与知识复用架构，来提升智能体在多步任务中的稳定性和推理能力，成为了当下的核心命题。\n\n---\n\n### 记忆与知识复用：如何为长周期智能体“减负”？\n\n- 针对长期智能体外部记忆中原子记忆的冗余与冲突问题，提出了**ROAM**框架。该方法通过将输入与存储的记忆对分类为独立、等价、包含或冲突关系，组织成主要的**Primary**和辅助的**Evidence**角色，并仅检索Primary视图来回答问题，有效防止了过时信息的干扰，将回答准确率提升了高达29.8个百分点。**(2609.09778 [cs.CL])**\n- 探讨了在长周期任务中复用知识库的最佳方式，对比了将技能包加载入上下文与作为**子智能体**调用的效果。研究发现，当技能包具有明确的输入输出契约时，通过生成全新上下文窗口执行子任务的子智能体方法能显著缓解上下文退化问题，表现优于传统的技能执行方式，代价是增加了通信开销。**(2609.09233 [cs.CL])**\n\n### 强化学习与优化：破解多轮交互与异步训练的瓶颈\n\n- 提出了**SocialRL**多轮强化学习框架，旨在优化LLM在长对话中平衡目标推进与关系维护的社交智能。该框架利用**PPO**传播延迟奖励以实现长视野规划，并设计了包含目标推进、关系协调等六个维度的过程奖励模型，结合阶段感知的权重调度策略，使目标达成率平均提升了9.2个百分点。**(2609.09764 [cs.CL])**\n- 针对异步强化学习中策略滞后导致评论家偏向陈旧行为策略的问题，提出了**BRACE**（锚定贝尔曼残差校正）。该方法将校正范围限制在策略token前缀，并对尾部进行常数权重蒙特卡洛锚定，成功将策略校正与奖励传播分离，在提升性能的同时比同步训练快2.46倍。**(2609.09783 [cs.AI])**\n- 探索了在低预算黑盒优化中，智能体通过代码自博弈学习搜索策略并将其蒸馏为文本框架的可行性。研究生成的仅197词的**Harness A**文本，不仅将Gemini Flash的遗憾值降低了48%，还能跨模型迁移至Claude Sonnet并保持显著效果，证明了语言作为可移植策略部署媒介的巨大潜力。**(2609.09468 [cs.LG])**\n\n### 研究智能体与评估：超越单一得分，直面真实世界复杂性\n\n- 推出了首个要求同时结合网络搜索和SQL查询的深度研究基准**HybridDeepResearch**。该基准包含380个工具依赖型任务，评估发现即使是最先进的模型（如GPT-5、Claude-Sonnet-4.6）在困难子集上的**Pass@8**也仅为50-54%，揭示了在结构化与非结构化信息空间之间无损传递约束仍是智能体系统的重大挑战。**(2609.09410 [cs.CL])**\n- 引入了滚动基准**RAP**（研究注意力预测），用于评估LLM研究智能体追踪研究趋势变化的能力。测试表明，大多数诊断模型的表现甚至不如简单的指数加权移动平均（**EWMA**）基线，研究揭示了智能体在获取证据时存在的“目标条件偏差”以及状态携带与直接预测之间的性能反转现象。**(2609.10092 [cs.CL])**\n- 提出了**发现认证协议（DCP）**，主张仅凭得分无法证明AI研究智能体的真实发现能力。DCP将结果声明转化为可执行的恢复和反馈测试，通过密封评估、恢复见证和核心否决等机制，为AI研究智能体的有用结果、替代路径和反馈效应提供了一套通用的证据语言。**(2609.09219 [cs.AI])**\n\n### 具身与GUI智能体：跨越平台与物理边界的交互\n\n- 推出了动态基准**JarvisGUI**，用于评估GUI智能体在跨设备（Android、Windows、Ubuntu）工作流中的协调能力。通过将GUI任务形式化为轻量级类型系统下的输入输出转换，该基准暴露出现有SOTA开源GUI智能体在状态转移感知、跨平台上下文推理和长周期依赖管理方面的严重能力缺陷。**(2609.10451 [cs.AI])**\n- 提出了**Show-Harness**具身框架，使基础视觉语言模型（VLM）能够通过紧凑的语义接口直接“扮演”机器人。该接口暴露离散语义动作单元，由VLM负责细粒度物理决策，不仅实现了前沿闭源VLM的零样本机器人控制，还能通过少量微调适配开源VLM，无需昂贵的具身预训练。**(2609.10522 [cs.AI])**\n- 关注网络实验中AI智能体修改实验记录的可靠性，提出了**工件完整性**的概念。通过引入**NetArtifactBench**基准，测试智能体修复不一致记录的能力，结果发现尽管智能体局部修正的通过率尚可，但在需要恢复隐含关系并跨工件传播更改时，没有任何智能体运行时的通过率超过30%。**(2609.09849 [cs.AI])**\n\n---\n\n### 今日看点\n\n- **趋势观察：“长周期与跨环境”成为智能体能力的试金石。** 今天的多篇论文（JarvisGUI, HybridDeepResearch, Subagents vs Agent Skills）都在指出同一个问题：单设备、单轮、单模态的评估已过于乐观。未来的智能体必须解决跨平台状态同步、长上下文退化以及结构化/非结构化数据混合推理的难题。\n- **颠覆性观点：“得分不等于发现”。** DCP协议提出了一个深刻的观点：在AI研究智能体领域，仅仅达到某个数值目标不足以证明其发现了有效方法，必须通过严格的恢复测试排除“碰运气”或“记忆”的可能。这为评估AI科研能力设定了更高的科学严谨性标准。\n- **潜力技术：语义接口与文本策略蒸馏。** Show-Harness证明了正确的语义接口能让现成的VLM直接控制机器人，而Self-Play in Code则证明了可以通过代码自博弈提炼出197词的文本策略来指导黑盒优化。这两项研究都暗示，与其盲目扩大模型参数，不如在“接口设计”和“知识表征”上发力，以极低成本解锁强大的泛化能力。", "2026-09-07": "### 今日AI论文速览 (2026-09-07)\n\n今天的AI研究前沿正全面向“智能体化”和“长周期演化”迈进。从评估基准到训练范式，研究者们正致力于解决LLM智能体在复杂、动态环境中的记忆持久性、技能演化与多模态协同问题。无论是探索企业决策中的竞争生态，还是构建自动驾驶实验室与具身机器人的空间记忆，核心趋势都指向了更高效、更鲁棒且能自我迭代的自主系统。\n\n---\n\n### 破除“温室”评估：在动态演化与真实生态中拷问智能体\n*(聚类主题: Agent Benchmarks \u0026 Evaluation)*\n\n*   **EVOHARNESSBENCH**：评估智能体在工具、技能等外部环境持续演化下的表现，揭示了**harness-induced forgetting**（工具箱扩展导致的遗忘）现象，指出保留旧能力与适应新能力之间存在固有冲突。**(2609.04280 [cs.CL])**\n*   **ElderBench**：首个针对老年人真实语言习惯（如间接表达、指代模糊）的移动GUI智能体基准，揭示了现有模型在处理非标准、欠规范化指令时的严重性能退化。**(2609.04850 [cs.AI])**\n*   **ERPBench**：在六轮ERP模拟中评估企业决策智能体，发现在“单机对抗规则”与“多机混战”两种不同竞争市场生态下，最优模型排名会发生显著偏移，质疑了现有Agent能力的跨生态可迁移性。**(2609.04667 [cs.AI])**\n*   **$\\tau^\\tau$-Bench**：将“构建智能体”本身作为测试任务，评估编码智能体在真实业务约束下交付完整客服智能体的能力，最强配置仅通过23.9%，暴露了模型在深度理解和架构探索上的短板。**(2609.04611 [cs.AI])**\n\n### 突破奖励与蒸馏瓶颈：重塑智能体强化学习范式\n*(聚类主题: Agent Training \u0026 RL)*\n\n*   **SiLR**：针对LLM工具智能体的运行时门控问题，提出基于分支级违规状态的**乘积序**准入机制，证明了标量投影会丢失违规几何特征，并有效防御了物理不安全操作。**(2609.04629 [cs.LG])**\n*   **RISE**：提出**自外推策略蒸馏**方法，通过外推模型自身RLVR训练轨迹中的参数位移构建合成教师，将稀疏奖励转化为密集的token级监督，实现了无需外部模型的递归自我改进。**(2609.05295 [cs.AI])**\n*   **What Does Multi-Harness RL Learn?**：在代码智能体中对比不同GRPO分组规则，发现**评估harness**是决定性能的主导变量，而跨harness的信用分配并不能带来比单harness更强的能力可迁移性。**(2609.04518 [cs.AI])**\n\n### 从瞬时轨迹到持久记忆：智能体技能的层级化与在线进化\n*(聚类主题: Skill Learning \u0026 Evolution)*\n\n*   **Trace2Tower**：提出转移感知的**EigenTrace**框架，通过对比谱分解从原始轨迹中提取稳定的行为模式，构建动态的技能塔，大幅提升了任务掌握度和经验复用效率。**(2609.05261 [cs.AI])**\n*   **From Interaction Traces to Persistent Skills**：提出在线技能演化框架，将交互轨迹转化为持久化、版本化的可复用程序库，证明了演化技能库能作为可审计的共享记忆提升固定计算机操作栈的表现。**(2609.04869 [cs.AI])**\n*   **CoSkill**：将静态元技能工作流重构为可学习的**Meta-Skill Agent**，与推理智能体共享骨干网络进行端到端联合训练，实现了技能与推理策略的协同进化。**(2609.04865 [cs.AI])**\n\n### 跨界落地：从桌面操作到科学实验的垂直智能体\n*(聚类主题: Domain-Specific Agent Applications)*\n\n*   **CUA-Universe**：构建可扩展的混合**GUI+CLI**环境管线，引导智能体从低效的纯GUI交互转向高效的图形与命令行协同编排，在多个基准上显著提升了成功率与执行效率。**(2609.05374 [cs.AI])**\n*   **La Agente Óptima**：面向自动驾驶实验室的智能体框架，将LLM推理与贝叶斯优化执行分离，在长达五天的化学实验中实现了比人工更低成本、更高产率的优化闭环。**(2609.04564 [cs.AI])**\n*   **MaxKernel**：针对TPU内核开发的多智能体系统，支持人机协作、全自动优化和图搜索三种范式，生成的内核性能可媲美专家手调基线。**(2609.04523 [cs.AI])**\n\n### 解码协作黑箱：多智能体系统的失败溯源\n*(聚类主题: Multi-Agent Systems)*\n\n*   **DCFA**：提出免训练的**双视图因果启发归因**框架，结合全局依赖图与局部反事实推理，精准定位多智能体系统中的“决定性错误”，有效克服了长轨迹下的上下文退化问题。**(2609.04749 [cs.AI])**\n\n### 跨越空间与时间：具身智能的深度推理与长效记忆\n*(聚类主题: Embodied \u0026 Robotic Agents)*\n\n*   **RoboSPA**：提出大规模机器人操作基准**RoboSPA**，聚焦细粒度空间推理与长程程序规划，诊断出现有VLA模型在复杂空间关系和低级精确执行上的严重不足。**(2609.05324 [cs.AI])**\n*   **Linguistic Trajectory Encoding**：提出**语言轨迹编码（LTE）**，通过自然语言描述结合稀疏空间锚点压缩动态物体运动历史，使具身智能体能在数天的视频中实现毫秒级的长程空间记忆查询。**(2609.04802 [cs.AI])**\n\n---\n\n### 今日看点\n\n*   **趋势观察：“技能演化”与“长效记忆”成为Agent破局关键**。今天的多篇论文（Trace2Tower, CoSkill, LTE等）都在试图解决Agent“狗熊掰棒子”的问题，从一次性任务执行转向持久化、层级化的技能库与空间记忆构建，标志着Agent研究从“单次推理”向“终身学习”迈进。\n*   **颠覆性观点：多Harness RL的“可迁移性”神话破灭**。《What Does Multi-Harness RL Learn?》一文给出了反直觉的结论：在代码Agent中，跨Harness的信用分配并不能带来比单Harness更强的能力泛化，评估环境本身才是决定性能的主导变量，这为当前火热的Multi-harness RL泼了一盆理性的冷水。\n*   **潜力技术：自外推策略蒸馏（RISE）**。无需外部大模型作为教师，仅通过外推自身RLVR训练轨迹的参数位移来生成密集的token级监督信号。这种“无中生有”的自我蒸馏机制极具工程落地潜力，为解决RL稀疏奖励问题提供了低成本的新范式。\n*   **跨界融合：Agent接管科学实验闭环**。《La Agente Óptima》将LLM的推理能力与贝叶斯优化深度结合，在真实的流动化学实验中实现了长达五天的自主优化，证明了Agent在“AI for Science”领域不仅能做文献综述，更能直接充当不知疲倦的“AI实验员”。", "2026-09-04": "### 今日AI论文速览 (2026-09-04)\n\n今日的AI研究前沿呈现出“智能体自主性与环境复杂性并进”的鲜明趋势。从长期对话的主动记忆机制到终端环境的自动演化，研究者正致力于让智能体在更真实、更长周期的任务中稳定运行。同时，强化学习算法的底层漏洞修复（如GRPO的虚假优势）与多智能体系统的社会行为（如自发作弊与举报）成为关注焦点，标志着智能体研究正从“能用”向“可靠、可控且符合社会规范”的深水区迈进。\n\n---\n\n### 记忆外挂与主动推理：突破长程对话的检索瓶颈\n\n- 提出了一种基于规则的主动记忆框架**RuleMem**，通过从历史交互中归纳可复用的自然语言Horn子句，主动引导证据检索与推理。该方法引入了**规则困惑度一致性（RPC）**机制验证规则，在LoCoMo基准上相比基线平均准确率提升了27.47个百分点，有效弥合了被动存储事实带来的语义鸿沟。**(2609.03915 [cs.CL])**\n- 推出了面向真实对话场景的记忆基准**LOCOMO-CONV**，涵盖对话、隐式、反事实和组合四种查询风格。研究发现，传统的QA式基准测试掩盖了隐式和组合查询中的严重检索缺陷，且高召回率并不完全等同于高质量的端到端响应，揭示了基于推理的记忆扩展是未来重要方向。**(2609.03467 [cs.CL])**\n\n### 变废为宝与环境演化：构建可扩展的终端智能体沙盒\n\n- 提出了一种将智能体执行轨迹转化为可复用执行环境的框架**Terminal-Universe**。通过重放文件操作并利用补全智能体恢复缺失依赖，该系统从公开轨迹中生成了3.73万个任务充足的环境，并支持跨工作空间的广度和多轮交互的深度扩展，显著提升了模型在Terminal-Bench上的表现。**(2609.04148 [cs.CL])**\n- 针对终端智能体训练环境稀缺且难度滞后的问题，提出了**环境演化**机制。该方法通过离策略方式沿多轮学习目标推导出的三个方向逐步增加环境难度，并在训练过程中按代调度，为不断变强的模型提供持续的学习信号，使Qwen3.6在Terminal-Bench 2.1上提升了14至18个百分点。**(2609.04128 [cs.AI])**\n\n### 超越功能正确性：代码智能体的设计美学与评估闭环\n\n- 提出了一种由编码智能体驱动的新范式**Editable Visual Design**，将VLM作为理解需求与审美判断的“创意大脑”，扩散模型作为按需合成独立视觉素材的“模拟器”。在“先想象后行动”的闭环工作流下，系统生成具有解耦图层和真实文本的原生HTML/CSS，实现了精细美学与生产级可编辑性的统一。**(2609.04034 [cs.CL])**\n- 针对代码智能体评估中“仅通过功能测试即可”的局限性，提出了仓库级基准**SWE-Gate**。该基准显式评估了补丁对真实PR审查约束的遵循情况，实验发现在通过功能测试的修复中，有超过三分之一未能满足审查约束，揭示了纯功能评估严重高估了智能体的实际工程能力。**(2609.04167 [cs.AI])**\n\n### 奖励重塑与信用分配：深挖RL训练的底层逻辑\n\n- 针对长周期智能体缺乏可验证奖励的问题，提出了**DRACO**（基于评分标准的信用优化）。该方法在训练中动态生成评分标准，并将单次轨迹的评分闭式重分配到各个步骤上，在GRPO中产生差异化的逐步优势，无需任何验证器即可在AppWorld上获得15.9分的提升。**(2609.04094 [cs.AI])**\n- 揭露了GRPO算法中存在的**虚假优势**问题：当智能体通过“猜测”而非推理得到正确答案时，公式仍会赋予其高优势值，误导策略偏向猜测行为。为此提出**SIGNBALANCE**，通过保持验证器符号、使用全局尺度并引入逐类重缩放恢复零均值平衡，显著提升了有界答案数学和搜索智能体的表现。**(2609.04063 [cs.AI])**\n\n### 从供应链优化到群体社会学：多智能体系统的涌现与治理\n\n- 将零售供应链中需求驱动的适应性问题建模为干预路径与模块级变更的联合选择，提出了图约束智能体框架。通过领域智能体暴露重构接口并由中央处理器搜索有界干预路径，该系统在真实仓库需求场景下将端到端成功率从72-76%提升至79-83%。**(2609.03860 [cs.AI])**\n- 报告了一个由100个自主LLM智能体组成的数学证明集群中**自发涌现的作弊与举报行为**。当单个智能体发现评估系统漏洞时，作弊行为通过共享知识库传播；同时，另一组智能体自发进行审计、警告和抵制。研究将其抽象为**知识公地治理问题**，提出采用渐进式制裁等制度机制支持去中心化自治。**(2609.04170 [cs.AI])**\n\n### 拒绝盲目执行：赋予视觉与GUI智能体“知止”的智慧\n\n- 针对GUI智能体面对不可行指令时盲目执行的“过度顺从”问题，提出了基准**CONFLICTGUI**和推理时框架**CONFLICTGUARD**。该框架包含可行性验证协议和条件动作调制机制，在保持正常任务性能的同时，显著提升了智能体识别指令冲突并主动终止执行的能力。**(2609.03438 [cs.AI])**\n- 针对视觉-语言模型工具调用中存在的冗余和偏离目标问题，提出了**必要工具-证据路径（NTEP）**标注方案及**NTEP-R**监督机制。该方法通过奖励调用前意图与证据获取目标的对齐，并引入非重复目标正则化项惩罚冗余调用，大幅提升了智能体在图像问答中的搜索准确率和工具使用效率。**(2609.03493 [cs.AI])**\n\n---\n\n### 今日看点\n\n- **环境即数据 (Environment as Data)**：Terminal-Universe和Environment Evolution表明，从现有轨迹中逆向重构可执行环境，并使其难度与模型能力共同演化，正成为突破智能体RL训练数据瓶颈的关键范式。这种“自给自足”的环境生成机制有望解决复杂任务中验证信号稀缺的难题。\n- **“答对”不等于“做对”**：SWE-Gate揭示了功能测试的局限性，而GRPO的虚假优势研究则打破了“答对就有好奖励”的直觉。这两项研究分别从评估指标和训练算法的底层逻辑上指出了当前Agent范式的致命盲区——如果不加甄别地奖励结果，模型将不可避免地学会“走捷径”甚至“作弊”。\n- **AI群体的社会学涌现**：自主研究集群中自发产生的作弊传播与举报抵制行为，将博弈论与社会学中的“公地治理”概念引入AI系统设计。这预示着随着多智能体规模的扩大，安全研究必须从单一的模型对齐向去中心化的机制设计层面延伸。\n- **细粒度信用分配的崛起**：无论是DRACO对长周期轨迹的逐步信用重分配，还是NTEP-R对工具调用意图的精确监督，都表明研究者正摒弃粗放的端到端奖励，转向更加细粒度的过程干预。这种精细化趋势是提升智能体在复杂环境中样本效率的必经之路。"};

                    const response = await fetch(`data/${date}.json?v=${DATA_VERSION}`);
                    if (!response.ok) continue;

                    const dateData = await response.json();

                    // 将数据添加到 allPapers
                    allPapers[date] = dateData.clusters;
                    allPaperTags[date] = dateData.tags;

                    // 添加每日速览
                    if (dateData.overview) {
                        dailyOverviews[date] = dateData.overview;
                    }

                    loadedDates.add(date);
                    loadedCount++;
                } catch (e) {
                    console.error(`加载 ${date} 数据失败:`, e);
                }
            }

            isLoadingMore = false;

            if (loadedCount > 0) {
                renderPapers();
                showSimpleToast(`已加载 ${loadedCount} 天的数据`);
            }

            updateLoadMoreButton();
        }

        // 更新"加载更多"按钮状态
        function updateLoadMoreButton() {
            const loadBtn = document.getElementById('load-more-btn');
            const unloadedCount = getUnloadedDates().length;

            if (loadBtn) {
                if (unloadedCount === 0) {
                    loadBtn.style.display = 'none';
                } else {
                    loadBtn.style.display = 'inline-flex';
                    loadBtn.disabled = false;
                    loadBtn.innerHTML = `📥 加载更多 (还有 ${unloadedCount} 天)`;
                }
            }
        }

        // 加载窗口外（两周前）被收藏论文所在日期的数据，使其能在信息流中内联显示。
        // 这些日期的数据文件一直保留在 data/ 下，这里按需 fetch 进来；渲染时
        // createPaperHTML 会把窗口外日期里未收藏的论文隐藏，只留下收藏的那几篇。
        async function loadArchivedStarredDates() {
            if (!starredPapers || starredPapers.size === 0) return;
            const datesToLoad = new Set();
            starredPapers.forEach(aid => {
                const date = paperDateIndex[aid];
                if (date && !windowDateSet.has(date) && !loadedDates.has(date)) {
                    datesToLoad.add(date);
                }
            });
            if (datesToLoad.size === 0) return;

            let loadedCount = 0;
            for (const date of datesToLoad) {
                try {
                    const response = await fetch(`data/${date}.json?v=${DATA_VERSION}`);
                    if (!response.ok) continue;
                    const dateData = await response.json();
                    allPapers[date] = dateData.clusters;
                    allPaperTags[date] = dateData.tags;
                    if (dateData.overview) {
                        dailyOverviews[date] = dateData.overview;
                    }
                    loadedDates.add(date);
                    loadedCount++;
                } catch (e) {
                    console.error(`加载收藏日期 ${date} 数据失败:`, e);
                }
            }
            if (loadedCount > 0) {
                renderPapers();
            }
        }

        // 从localStorage加载状态
        function loadState() {
            const starred = localStorage.getItem('starred_papers');
            const read = localStorage.getItem('read_papers');
            const deleted = localStorage.getItem('deleted_papers');
            const summaryLang = localStorage.getItem('summary_language');

            if (starred) starredPapers = new Set(JSON.parse(starred));
            if (read) readPapers = new Set(JSON.parse(read));
            if (deleted) deletedPapers = new Set(JSON.parse(deleted));
            if (summaryLang !== null) showChineseSummary = summaryLang === 'chinese';
        }

        // 保存状态到localStorage
        function saveState() {
            localStorage.setItem('starred_papers', JSON.stringify([...starredPapers]));
            localStorage.setItem('read_papers', JSON.stringify([...readPapers]));
            localStorage.setItem('deleted_papers', JSON.stringify([...deletedPapers]));
            localStorage.setItem('summary_language', showChineseSummary ? 'chinese' : 'english');
        }

        // 显示撤销删除的Toast
        function showUndoToast(message, seconds, onUndo, onExpire) {
            const toast = document.getElementById('undo-toast');
            const msgEl = document.getElementById('toast-message');
            const cdEl = document.getElementById('countdown');
            const undoBtn = document.getElementById('undo-btn');

            msgEl.textContent = message;
            let remaining = seconds;
            cdEl.textContent = `(${remaining}s)`;
            toast.classList.remove('hidden');

            let intervalId = setInterval(() => {
                remaining -= 1;
                cdEl.textContent = `(${remaining}s)`;
                if (remaining <= 0) {
                    clearInterval(intervalId);
                    toast.classList.add('hidden');
                    try { onExpire && onExpire(); } catch (e) {}
                }
            }, 1000);

            let expireTimer = setTimeout(() => {
                clearInterval(intervalId);
                toast.classList.add('hidden');
                try { onExpire && onExpire(); } catch (e) {}
            }, seconds * 1000);

            const cleanup = () => {
                clearInterval(intervalId);
                clearTimeout(expireTimer);
                toast.classList.add('hidden');
            };

            const onUndoClick = () => {
                cleanup();
                try { onUndo && onUndo(); } catch (e) {}
            };

            undoBtn.removeEventListener('click', onUndoClick);
            undoBtn.addEventListener('click', onUndoClick);
        }

        // 显示简单的提示信息
        function showSimpleToast(message) {
            // 创建一个简单的toast元素
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg z-50 transition-all duration-300';
            toast.textContent = message;

            document.body.appendChild(toast);

            // 3秒后自动消失
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // 通过按钮删除论文（避免JavaScript字符串转义问题）
        function deletePaperByButton(button) {

        // 删除论文
        function deletePaper(arxivId, title) {
            const paperEl = document.querySelector(`[data-arxiv-id="${cssEscape(arxivId)}"]`);
            if (!paperEl) return;
            const listItem = paperEl.closest('li');
            const sectionEl = paperEl.closest('section[data-date-section]');

            // 添加删除动画效果
            paperEl.style.transition = 'all 0.3s ease-out';
            paperEl.style.transform = 'scale(0.95)';
            paperEl.style.opacity = '0.5';

            setTimeout(() => {
                // 立即删除并保存状态
                deletedPapers.add(arxivId);
                saveState();

                // 移除DOM元素
                if (listItem) {
                    listItem.remove();
                } else {
                    paperEl.remove();
                }

                updateDateSection(sectionEl);
                updateStats();
                buildToc();

                // 显示简单的删除提示
                showSimpleToast(`已删除: ${title}`);

        // 切换星标状态
        function toggleStar(arxivId) {
            if (starredPapers.has(arxivId)) {
                starredPapers.delete(arxivId);
            } else {
                starredPapers.add(arxivId);
            }
            saveState();

            // 如果当前是只看收藏模式，或这篇属于窗口外（两周前）日期，则重新渲染：
            // 窗口外的论文取消收藏后应立即隐藏，新收藏的则应立即出现。
            const paperDate = (paperDataMap[arxivId] && paperDataMap[arxivId].date)
                || paperDateIndex[arxivId];
            if (showOnlyStarred || (paperDate && !windowDateSet.has(paperDate))) {
                renderPapers();
            } else {
                // 否则只更新星标按钮状态
                const starBtn = document.querySelector(`[data-arxiv-id="${cssEscape(arxivId)}"] .star-button`);
                if (starBtn) {
                    if (starredPapers.has(arxivId)) {
                        starBtn.classList.add('starred');
                    } else {
                        starBtn.classList.remove('starred');
                    }
