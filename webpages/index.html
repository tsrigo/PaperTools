rality）**，抑或仅仅是针对搜索子块统计特性的**过拟合捷径（Overfitting Shortcuts）**。\n\n**实验反例设计：非平稳噪声与复杂构造下的“机制崩溃”测试**\nSeisEvo 的核心假设是 LLM 发现的算子（如 Evo-POCS 的倾角一致性校正）捕捉了地震波的通用物理规律。然而，LLM 在代码生成中极易利用数据中的统计偏差。\n*   **具体场景**：构建一个包含**强散射介质（Strong Scattering Media）**和**非平稳噪声（Non-stationary Noise）**的合成数据集，以及一个具有复杂断层和褶皱的野外数据集（如 Marmousi II 或真实复杂构造区数据）。这些场景的特点是局部倾角（Dip）在极短距离内剧烈变化，且噪声水平随深度或位置显著波动。\n*   **攻击逻辑**：\n    1.  **倾角一致性失效**：Evo-POCS 依赖局部相位系数 $c_d(u)$ 来估计倾角。在强散射或断层附近，局部连续性假设（Local Coherence Assumption）被破坏，相位估计将变得极不稳定。如果 SeisEvo 发现的机制仅在平滑构造下有效，那么在这些复杂场景下，其 SNR 提升应显著低于经典 POCS，甚至出现伪影（Artifacts）。\n    2.  **噪声敏感性**：Evo-MSSA 的可靠性分组依赖于残差估计。如果噪声是非平稳的，基于全局或局部平均的噪声尺度估计（如 MP 定律）将失效，导致错误的秩选择。\n*   **预期结果**：如果 SeisEvo 的算法在这些极端场景下性能大幅下降，而经典算法（因其更保守的假设）表现更稳健，则证明 SeisEvo 发现的并非“通用物理机制”，而是针对搜索数据中“平滑、平稳”统计特性的**数据捷径（Data Shortcut）**。这将直接否定其“白盒算法具有物理合法性”的核心主张。\n\n**理论反例论证：LLM 的“参数幻觉”与约束逃逸**\n*   **论点**：SeisEvo 声称通过“硬门控（Hard Gate）”和“参数溯源（Parameter Provenance）”防止 Agent 发现非法或过拟合的参数。然而，LLM 具有极强的**模式匹配（Pattern Matching）**能力，而非真正的因果推理。\n*   **攻击逻辑**：Agent 可能发现一种机制，该机制在数学上看似合法（如通过掩码 $M$ 保护观测数据），但在数值实现上依赖于搜索子块的特定频率带宽或采样率。例如，Agent 可能引入一个依赖于特定 FFT 长度的归一化因子，该因子在搜索数据上恰好优化了 SNR，但在不同尺寸的数据块上会导致数值发散或性能下降。\n*   **验证方法**：对 Evo-POCS 和 Evo-MSSA 的代码进行**符号执行（Symbolic Execution）**或**形式化验证（Formal Verification）**，检查其参数是否隐式依赖于输入数据的维度、采样率或特定统计矩。如果发现此类依赖，则证明其“白盒”性质是脆弱的，不具备真正的可移植性。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“程序进化”到“物理约束下的神经符号发现”（Physics-Constrained Neuro-Symbolic Discovery）**\n\n**（a）驱动局限与未满足需求**\nSeisEvo 的核心局限在于其搜索空间受限于**离散的程序结构（Discrete Program Structure）**和**预定义的组件集合（Pre-defined Component Set）**。LLM 只能组合现有的算子（如阈值、投影），难以发现全新的、连续的数学形式或复杂的非线性映射。此外，SeisEvo 的“白盒”输出虽然可解释，但其表达能力有限，无法捕捉地震数据中高度非线性的复杂关系（如各向异性、多波干涉）。现有的深度学习黑盒模型虽能捕捉这些关系，但缺乏可解释性。因此，存在一个未满足的需求：**如何自动发现既具有深度学习表达能力，又具备严格物理可解释性的混合算子？**\n\n**（b）借鉴相邻领域的方法**\n借鉴**神经符号学习（Neuro-Symbolic Learning）**和**可微分编程（Differentiable Programming）**领域的思想。具体而言，结合 **Program Synthesis** 与 **Differentiable Physics-Informed Neural Networks (PINNs)**。\n*   **核心思想**：不再搜索固定的代码片段，而是搜索一个**可微分的计算图（Differentiable Computational Graph）**，其中节点可以是神经网络层，也可以是物理算子（如傅里叶变换、SVD）。\n*   **工具**：使用 **Gymnasium** 或 **Ray** 进行大规模并行搜索，结合 **JAX** 或 **PyTorch** 的可微分特性，允许对算子结构进行梯度引导的优化。\n\n**（c）第一个实验设计：发现“自适应物理先验”的混合算子**\n*   **目标**：在地震数据重建任务中，自动发现一个混合算子，该算子包含一个**数据驱动的神经网络模块**（用于估计局部物理参数，如倾角、噪声水平）和一个**物理约束的算子模块**（如基于估计参数的自适应 POCS 或 MSSA）。\n*   **实验步骤**：\n    1.  **定义搜索空间**：允许 Agent 生成包含神经网络层（如 CNN、Transformer）和物理算子（如 FFT、SVD、Thresholding）的混合代码。\n    2.  **约束机制**：引入**物理一致性损失（Physics Consistency Loss）**，强制神经网络输出的参数（如倾角）必须满足地震波方程的近似解或局部连续性约束。\n    3.  **进化过程**：LLM Agent 生成混合代码，框架通过可微分执行计算梯度，并结合进化算法进行结构搜索。\n    4.  **验证**：在复杂构造数据上测试，比较该混合算子与纯深度学习模型（如 U-Net）和 SeisEvo 发现的纯物理算子。\n*   **预期贡献**：该方法将超越 SeisEvo 的“离散程序进化”，实现**连续参数与离散结构的联合优化**，发现既具有深度学习表达能力，又具备物理可解释性的新型重建算子。这将打开一个全新的研究方向：**自动发现物理信息嵌入的深度学习架构（Auto-Discovery of Physics-Embedded Deep Learning Architectures）**。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Yingjie Xu\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Siwei Yu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Jianwei Ma\",\n      \"affiliations\": [\n        1,\n        3\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"School of Mathematics and Center of Geophysics, Harbin Institute of Technology\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Department of Mathematics, National University of Singapore\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"School of Earth and Space Sciences, Peking University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Corresponding author: siweiyu@hit.edu.cn\"\n    }\n  ]\n}\n```", "summary_translation": "经典地震数据重建依赖于人工设计的结构先验和迭代算子，其耦合的设计空间远大于人工试错所能系统探索的范围。深度学习方法将重建规则编码在学到的权重中，而不是编码在可以检查和修改的显式算子中。我们提出了 SeisEvo（地震算法进化），它不优化单一的重建结果，而是搜索产生该结果的算法。从经典的重建算法开始，由 LLM 驱动的多智能体搜索仅修改用户开放编辑的组件，而不规定要发现的机制。违反任务物理约束的候选方案被直接拒绝，其余方案通过执行进行评分。输出既不是智能体系统也不是神经网络，而是一个独立的白盒算法，在推理时不需要智能体或神经网络。对于无附加噪声的插值，搜索发现了一种残差门控、相位对齐的倾角一致性投影；Evo-POCS 在缺失率从 30% 到 70% 的情况下，平均将信噪比（SNR）提高了 3.49 dB，优于经典 POCS。对于同时插值和去噪，它发现了一种可靠性分组奇异值收缩；Evo-MSSA 将平均重建信噪比提高了 7 dB 以上，优于经典 MSSA，并提高了 3 dB 以上，优于更强的秩降低基线。这两种算子在搜索期间未使用的数据上保留了其增益。据我们所知，这是首次将地震重建算子的设计表述为受约束的、LLM 驱动的程序进化任务。因此，智能体算法进化可以补充深度学习，发现显式的、可检查的和可部署的地震处理算法。"}]}, {"name": "Tool Use, Skill Selection \u0026 Planning", "count": 4, "papers": [{"title": "DART-SD: Diamond-topology Aware Retrieval and Tuning for Self-Distillation of Multi-Turn Tool-Calling Agents", "arxiv_id": "2608.18524", "authors": "Hangrui Xu, Jiarui Wang, Yang Yang, Chuanbo Zhu, Fangda Chen, Ziqi Wu, Jingming Cai, Yan Song", "summary": "Equipping Large Language Models (LLMs) with multi-turn tool-calling capabilities is essential for building autonomous agents. However, progress is fundamentally limited by the reliance on full-length trajectory imitation. For tasks involving multiple order-independent sub-goals, the optimal solution space forms a vast combinatorial diamond lattice. Forcing this rich topology into monolithic trajectories causes a severe topological collapse, indiscriminately penalizing valid alternative explorations and severely degrading policy diversity. To address this, we propose DART-SD (Diamond-topology Aware Retrieval and Tuning for Self-Distillation), a novel framework that shifts the paradigm from global forcing to topology-guided localized correction. DART-SD first models the execution process as a converging Interaction-State Transition Graph (ISTG), faithfully capturing the inherent diamond topology of successful and failed exploratory paths. During autonomous rollouts, the framework identifies the Critical Topological Breakpoint (CTB) and retrieves success-supported recovery references. Finally, we introduce a progressive self-distillation paradigm through CTB-guided localized supervision, ensuring that the training loss is calculated exclusively on the generated recovery steps while strictly protecting the valid reasoning prefix from destructive gradient updates. Experiments on complex multi-turn tool-calling benchmarks demonstrate that DART-SD significantly outperforms traditional full-trajectory baselines.", "category": "cs.CL", "cluster": "Tool Use, Skill Selection \u0026 Planning", "tags": ["cs.CL"], "filter_reason": "该论文完全符合“LLM智能体及其演化”的研究范围，具体依据如下：\n\n1.  核心对象明确为LLM智能体：论文标题和摘要明确指出研究对象是“Multi-Turn Tool-Calling Agents”（多轮工具调用智能体）。工具使用（Tool Use）是Agentic AI的核心能力之一，且多轮交互涉及长期决策和状态管理，属于典型的智能体研究范畴。\n2.  涉及智能体的训练与自我改进（Self-Evolving/Training）：论文提出了一种名为 DART-SD 的框架，核心机制是“Self-Distillation”（自蒸馏）和“Localized Correction”（局部修正）。这属于通过经验（rollouts）和反馈（success-supported recovery references）来改进智能体策略的方法，符合“构建、改进、训练 LLM智能体”的目标。\n3.  非纯系统工程或拓扑结构研究：虽然摘要中提到了“Diamond-topology”（菱形拓扑）和“Interaction-State Transition Graph”（交互状态转换图），但这并非研究多智能体系统的通信拓扑或编排协议（排除标准3），而是用于建模单个智能体在解决复杂任务时的执行路径空间（combinatorial diamond lattice）。其目的是为了解决传统全轨迹模仿学习中的“拓扑崩溃”问题，从而优化智能体的训练效率和策略多样性。这是一种针对智能体训练算法的创新，而非基础设施或通信协议的研究。\n4.  符合正面指标：论文涉及 Tool Use、Self-Distillation（一种自我改进/演化机制）、Agent Training 以及 Long-Horizon Decision-Making（通过多轮工具调用体现）。\n\n综上，该论文提出了一种新的训练框架来改进具备工具使用能力的LLM智能体，属于智能体构建与改进的核心前沿研究，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决多轮工具调用（Multi-Turn Tool-Calling）智能体在蒸馏过程中面临的**拓扑坍缩（Topological Collapse）**问题。在涉及多个顺序无关子目标的任务中，最优解空间本质上是一个巨大的组合**菱形晶格（Diamond Lattice）**，即不同的执行路径可以在共享的中间状态处交汇。然而，现有的主流蒸馏范式（如基于行为克隆的 SFT 或全局强制模仿）将这一丰富的图结构强行压缩为单一的线性轨迹。这种“全局强制（Global Forcing）”策略不仅抹杀了有效的替代探索路径，还导致模型无法区分致命错误与无害的探索行为，从而严重损害了策略的多样性（Policy Diversity）和推理效率。\n\n该问题的重要性在于，它是阻碍小型开源模型从前沿大模型中有效继承复杂规划能力的根本瓶颈。传统的线性视角忽略了状态转移的固有图结构，导致**信用分配（Credit Assignment）**出现短视偏差，任意惩罚了有效的探索步骤。解决这一问题能够带来显著价值：首先，它允许模型保留并学习有效的推理前缀，避免梯度更新对已掌握知识的破坏；其次，通过识别**关键拓扑断点（Critical Topological Breakpoint, CTB）**并进行局部修正，模型能够以更少的工具调用次数实现更高的任务成功率，甚至发现比教师模型更优的捷径；最后，这种方法提升了模型在未见领域（Out-of-Domain）的泛化能力，证明了其学习的是可迁移的结构化知识而非简单的轨迹记忆。\n\n### § 2 前人工作与不足\n\n尽管已有大量研究致力于智能体蒸馏，但现有方法在处理多轮交互的拓扑复杂性时均存在显著不足。\n\n1.  **基于蒸馏的范式（Distillation-Based Paradigms）：** 如 **SFT**、**SCoRe-SFT** 和 **OPSD** 等方法，主要依赖完整专家轨迹的行为克隆或动态滚动蒸馏。它们的不足在于采用了**全局损失（Global Loss）**，即对轨迹中的每一个 token 或步骤都施加监督。这种“一刀切”的监督方式会覆盖学生模型自身产生的有效探索步骤，导致模型仅仅是在记忆冗余轨迹，而非提取任务的核心逻辑骨架。此外，传统的后见之明（Hindsight）方法如 **HINT-SD** 仍将多轮交互视为严格的线性序列，无法处理顺序无关子目标带来的路径交汇问题，导致模型混淆致命错误与无害探索。\n\n2.  **基于强化学习的范式（Reinforcement Learning Paradigms）：** 如 **FTRL-GRPO**、**ToolRL** 和 **MatchTIR** 等方法，试图通过环境反馈或细粒度奖励来优化策略。然而，这些方法面临严重的**信用误分配（Credit Misassignment）**问题。由于奖励通常稀疏地分布在终端或均匀地分布在所有中间步骤，模型难以准确识别哪些中间步骤是有效的，哪些是导致失败的根源。例如，**MatchTIR** 虽然通过二分匹配提供了回合级奖励，但其根本假设仍是多轮交互为刚性线性序列，忽略了探索过程中的固有拓扑结构。因此，这些方法往往会无意中惩罚失败轨迹中的有效步骤，限制了策略的多样性。\n\n前人工作未能充分考虑**交互状态拓扑（Interaction-State Topology）**，主要是因为传统方法将工具调用过程简化为孤立的线性轨迹集合，缺乏对状态转移图结构的显式建模。这种简化使得它们无法区分“信息获取”与“无用探索”，也无法在共享中间状态处进行有效的路径对齐。本文提出的 **DART-SD** 通过构建**交互状态转移图（ISTG）**，将节点定义为累积交互状态而非瞬时动作，从而显式地捕捉了菱形拓扑结构，从根本上解决了上述线性假设带来的局限性。", "core_insight": "### § 3 重建作者的思考路径\n\n在构建多轮工具调用（Multi-Turn Tool-Calling）Agent 时，研究者首先观察到，现有的主流训练范式——无论是基于行为克隆（Behavior Cloning, BC）的监督微调（SFT），还是基于稀疏奖励的强化学习（RL，如 GRPO）——在处理长程任务时均存在严重的性能瓶颈。SFT 试图通过全局轨迹模仿来强制学生模型复现教师模型的路径，但这导致了“拓扑坍缩”（Topological Collapse）：对于包含多个顺序无关子目标的任务，最优解空间本质上是一个巨大的组合菱形晶格（Diamond Lattice），而非单一线性路径。SFT 将这种丰富的拓扑结构强行压平为单一轨迹，不仅抹杀了有效的替代探索路径，还导致模型死记硬背冗余步骤，而非掌握核心逻辑骨架。\n\n与此同时，研究者发现 RL 方法虽然引入了环境反馈，但面临着严重的信用分配（Credit Assignment）难题。由于奖励通常稀疏且均匀分布在所有中间步骤，RL 往往错误地惩罚那些在失败轨迹中实际上是有效的中间步骤（Valid Steps），或者无法区分致命错误与无害的探索。现有的 hindsight-based 方法（如 HINT-SD）虽然尝试进行事后修正，但仍将多轮交互视为严格的线性序列，忽略了状态转移中固有的图结构（Graph Structure）。\n\n进一步的观察表明，工具调用的本质是信息获取（Information Acquisition）。不同的工具调用序列如果获取了相同的信息原子（Information Atoms），在语义上应被视为等价状态。然而，现有方法缺乏一种机制来抽象这种“信息状态”，导致模型无法识别不同路径在中间状态的汇合点（Convergence Points）。因此，研究者意识到，必须从“线性轨迹模仿”转向“拓扑感知的局部修正”。关键在于构建一个能够捕捉成功与失败路径中状态转移关系的图结构，从而识别出学生模型偏离成功区域的确切断点（Breakpoint），并仅在该断点之后进行针对性的恢复训练，同时保护此前已掌握的有效前缀（Valid Prefix）不被破坏性梯度更新所覆盖。这一思路直接导向了基于交互状态转移图（ISTG）和关键拓扑断点（CTB）的自蒸馏框架。\n\n### § 4 核心 Intuition\n\n多轮工具调用的最优解空间并非单一线性路径，而是由顺序无关的子目标构成的“菱形拓扑”（Diamond Topology），传统的全局轨迹模仿或均匀奖励分配会错误地惩罚有效的替代探索，导致“拓扑坍缩”。DART-SD 的核心直觉是将执行过程抽象为基于信息获取的“交互状态转移图”（ISTG），从而在图结构中精确定位学生模型首次偏离成功可达区域的“关键拓扑断点”（CTB）。通过仅在 CTB 之后进行局部化的恢复监督，并严格保护此前已生成的有效推理前缀，该方法实现了从“全局强制模仿”到“拓扑引导的局部修正”的范式转变，使模型能够高效学习可复用的工具使用策略而非死记硬背特定轨迹。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**DART-SD** (Diamond-topology Aware Retrieval and Tuning for Self-Distillation) 的核心思想是将多轮工具调用（Multi-Turn Tool-Calling）的执行过程从线性的轨迹模仿（Linear Trajectory Imitation）转变为基于拓扑结构的局部修正（Topology-Aware Localized Correction）。其完整 Pipeline 包含以下关键步骤：\n\n1.  **构建交互状态转移图 (ISTG Construction)**：\n    *   **输入**：Teacher 模型（如 Qwen3.6-27B）在训练集上生成的成功和失败轨迹。\n    *   **处理**：\n        *   **信息原子抽象 (Information Atom Abstraction)**：将工具响应中的有用事实规范化为“信息原子”（Information Atoms）。语义等效的响应映射为同一原子，无信息量的响应映射为空集。\n        *   **节点定义**：定义交互状态 $X_t = (I_t, U_t)$，其中 $I_t$ 是累积的信息原子集合，$U_t$ 是自上一个主节点以来的无用操作多重集。\n        *   **图构建**：构建有向多重图 **ISTG**。主节点（Main Nodes）代表获取新信息的步骤，辅助节点（Auxiliary Nodes）代表无用探索。由于子目标顺序无关，不同路径会在相同的信息状态汇合，形成“菱形拓扑”（Diamond Topology）。\n    *   **输出**：一个包含成功和失败路径的结构化图 **ISTG**，捕捉了任务的状态空间拓扑。\n\n2.  **学生自主 rollout 与 CTB 识别 (Student Rollout \u0026 CTB Identification)**：\n    *   **输入**：当前 Student 模型（如 Qwen3-4B）在测试任务上的自主生成轨迹。\n    *   **处理**：\n        *   **状态投影 (State Projection)**：将 Student 的每一步状态映射到 ISTG 中。\n        *   **成功可达区域 (Success-Reachable Region)**：定义基于 Teacher 成功轨迹的预算过滤区域 $R^+_x$。\n        *   **关键拓扑断点 (Critical Topological Breakpoint, CTB)**：找到 Student 轨迹中第一个无法投影到 $R^+_x$ 中的状态。该点之前的前缀被视为“有效前缀”（Valid Prefix），该点即为需要修正的断点。\n    *   **输出**：标记了 CTB 位置的失败轨迹，以及 CTB 之前的有效前缀。\n\n3.  **基于 CTB 的局部监督与恢复生成 (CTB-Guided Localized Supervision)**：\n    *   **输入**：Student 的有效前缀、CTB 位置、从 ISTG 中检索到的成功参考轨迹（Privileged References）。\n    *   **处理**：\n        *   **上下文增强**：将 Student 前缀与检索到的 Teacher 参考轨迹结合，作为增强上下文。\n        *   **恢复生成**：模型基于此上下文生成从 CTB 开始的恢复步骤（Recovery Steps）。\n        *   **局部损失计算**：仅对 CTB 之后生成的助手响应 token 计算损失（Masked Causal Language Modeling）。有效前缀、用户消息、工具观测值和最终答案均被掩码（Masked），不参与梯度更新。\n    *   **输出**：经过局部修正的训练样本，用于更新 Student 模型。\n\n4.  **渐进式自蒸馏 (Progressive Self-Distillation)**：\n    *   **输入**：更新后的 Student 模型。\n    *   **处理**：重复上述 rollout、CTB 识别和局部监督过程。随着模型能力提升，CTB 位置会逐渐后移（即有效前缀变长），模型逐步掌握更复杂的工具使用行为。\n    *   **输出**：最终训练好的、具备高效多轮工具调用能力的 Agent。\n\n**真实例子讲解：**\n假设任务是“查询北京今天的天气并计算摄氏度转华氏度”。\n1.  **ISTG 构建**：Teacher 可能先查天气再计算，也可能先定义公式再查天气。ISTG 会将“获取北京天气数据”和“获取转换公式”作为两个独立的信息原子。无论顺序如何，只要都获取了这两个原子，就汇聚到同一个主节点。\n2.  **Student Rollout**：Student 先查了天气（有效），然后错误地调用了“查询上海天气”（无效/偏离）。\n3.  **CTB 识别**：系统检测到“查询上海天气”这一步无法投影到成功可达区域（因为成功路径不需要上海天气），因此“查询上海天气”之前的状态是 CTB。\n4.  **局部监督**：保留“查询北京天气”的前缀。检索 ISTG 中从“已获取北京天气”状态出发的成功路径（例如直接调用计算器）。让 Student 基于此生成正确的下一步（调用计算器）。仅对“调用计算器”这一步计算损失，不惩罚之前正确的“查询北京天气”。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文的核心数学推导主要围绕 **ISTG 的状态定义**、**成功可达区域的投影规则** 以及 **CTB 的判定** 展开。以下是面向数学基础较弱读者的直觉解释：\n\n1.  **信息原子映射 $\\alpha_x$**：\n    *   **公式直觉**：$\\alpha_x(e) \\in K_x \\cup \\{\\emptyset\\}$。\n    *   **解释**：这是一个函数，把工具调用 $e$ 的响应映射为一个“信息原子”或空集。它的目的是去重和抽象。比如，无论工具返回的是 JSON 还是纯文本，只要包含“北京气温 20 度”这个事实，就映射为同一个原子 $k_1$。如果返回错误，映射为空。这确保了不同形式的相同信息在图中汇聚到同一点，形成菱形拓扑。\n\n2.  **交互状态 $X_t$**：\n    *   **公式直觉**：$X_t = (I_t, U_t)$，其中 $I_t = \\bigcup_{i=1}^t \\Delta I_i$。\n    *   **解释**：状态由两部分组成：$I_t$ 是到目前为止收集到的所有有用信息的集合（并集），$U_t$ 是最近一次获取新信息后执行的无用操作列表。这种定义区分了“获取知识”和“无效探索”，使得模型能识别出哪些步骤是推进任务的，哪些是浪费时间的。\n\n3.  **成功可达区域 $R^+_x$**：\n    *   **公式直觉**：$R^+_x = \\{v \\in V_x \\mid \\text{type}(v) \\in \\{\\text{main, aux}\\} \\land r_\\tau(v) \\le B_x\\}$。\n    *   **解释**：这是图中所有“离成功不远”的节点集合。$r_\\tau(v)$ 是从节点 $v$ 到成功终点的剩余步数，$B_x$ 是一个预算上限。只有那些在 Teacher 成功轨迹中出现过，且剩余步数在预算内的节点，才被认为是“安全”的、可恢复的状态。\n\n4.  **类型特定投影 $\\rho_t$**：\n    *   **公式直觉**：对于主节点，$\\rho_t = 1$ 如果存在 Teacher 主节点 $v$ 使得 $I(v) \\subseteq I_t^s$ 且 $v \\in R^+_x$。\n    *   **解释**：判断 Student 当前状态是否“合法”。对于主节点，只要 Student 收集的信息集合包含了某个成功 Teacher 节点的信息集合，且该 Teacher 节点在成功可达区域内，就认为 Student 是合法的。这允许 Student 以不同的顺序或额外的步骤获取信息，只要核心信息一致即可。\n\n5.  **CTB 定义 $t_C$**：\n    *   **公式直觉**：$t_C = \\min \\{t \\mid \\rho_t = 0\\}$。\n    *   **解释**：CTB 是第一个“非法”状态出现的时间点。在此之前，Student 都在成功可达区域内（$\\rho_t=1$）；在此之后，Student 偏离了成功路径（$\\rho_t=0$）。这个点就是我们需要进行局部修正的起点。\n\n6.  **局部损失 $\\mathcal{L}$**：\n    *   **公式直觉**：$\\mathcal{L} = -\\sum_{i=1}^L m_i \\log P(y_i | y_{\u003Ci})$，其中 $m_i=1$ 仅当 token $y_i$ 属于 CTB 后的助手响应。\n    *   **解释**：损失函数只关注 CTB 之后的部分。$m_i$ 是一个掩码，CTB 之前的 token 掩码为 0，不参与梯度更新。这保护了 Student 已经掌握的正确推理前缀，避免被全局损失“污染”。\n\n### § 7 实验设计与结论\n\n**提出了什么问题？**\n现有的 Agent 蒸馏方法（如 SFT、RL）将多轮工具调用视为线性轨迹，导致“拓扑坍缩”（Topological Collapse），即惩罚了有效的替代探索路径，且存在信用分配错误（Credit Misassignment），无法有效利用 Teacher 的结构化知识。\n\n**设计了什么实验验证这个问题？**\n1.  **基准对比实验**：在 FTRL（域内）和 BFCL、ToolHop、$\\tau$-bench、RoTBench（域外）五个基准上，对比 DART-SD 与 SFT、SCoRe-SFT、OPSD、FTRL-GRPO、ToolRL、MatchTIR 等基线方法。使用 Qwen3-4B 和 Qwen3-8B 作为 Student 模型。\n2.  **能力蒸馏有效性分析**：比较 Student、DART-SD 和 Teacher 的性能，验证小模型是否能超越大 Teacher。\n3.  **工具调用长度分析**：追踪 DART-SD 在迭代过程中成功轨迹的平均工具调用长度，并与 Golden Reference 对比，验证是否学会了更高效的策略。\n4.  **CTB 位置偏移分析**：统计失败轨迹中 CTB 的平均位置随迭代次数的变化，验证模型能力边界是否逐步扩展。\n5.  **组件消融实验**：逐步移除 Self-Distillation、CTB-guided Localized Supervision、Progressive Self-Distillation 和 ISTG，评估各组件的贡献。\n6.  **通用能力保持实验**：在 IFEval、AIME、MMLU 等通用基准上测试，验证 DART-SD 是否损害了模型的通用推理能力。\n\n**问题的答案是什么？**\n1.  **性能优越**：DART-SD 在所有基准上均显著优于 SFT 和 RL 基线，且在域外基准上表现出良好的泛化能力。\n2.  **小模型超越大 Teacher**：Qwen3-8B Student 经过 DART-SD 训练后，在 FTRL、ToolHop 和 $\\tau$-bench 上超越了 Qwen3.6-27B Teacher，证明其提取了可复用的结构化知识而非简单模仿。\n3.  **效率提升**：DART-SD 生成的成功轨迹平均工具调用长度从 4.23 降至 3.55，甚至短于 Golden Reference（4.02），证明其学会了更高效的工具使用策略。\n4.  **能力渐进扩展**：CTB 位置从 Iter1 的 0.348 移至 Iter5 的 1.452，表明模型逐步掌握了更长的有效前缀，能力边界不断扩展。\n5.  **组件必要性**：消融实验证明，ISTG、CTB 局部监督和渐进式蒸馏都是提升性能的关键组件。\n6.  **通用能力保持**：DART-SD 在通用基准上优于 Base 和 SFT，证明拓扑感知的局部监督不会损害模型的通用推理和指令遵循能力。", "additional_insights": "### § 8 Take-aways\n\nDART-SD 的核心洞察在于多轮工具调用（Multi-Turn Tool-Calling）的最优解空间并非线性序列，而是由顺序无关的子目标构成的“菱形拓扑”（Diamond Topology），传统的全轨迹模仿（Full-Trajectory Imitation）会导致严重的拓扑坍缩（Topological Collapse），错误地惩罚了有效的探索路径。为了解决这一问题，该方法引入了交互状态转移图（Interaction-State Transition Graph, ISTG），通过将工具响应抽象为信息原子（Information Atoms）来构建状态节点，从而在图结构中显式地捕捉成功与失败路径的收敛与发散关系。在训练过程中，DART-SD 不再对整条轨迹进行全局监督，而是通过投影学生模型的状态到经验可达区域（Empirical Success-Reachable Region），精准定位关键拓扑断点（Critical Topological Breakpoint, CTB）。基于 CTB，模型仅对断点后的恢复步骤（Recovery Steps）进行局部监督（Localized Supervision），严格保护断点前已验证有效的推理前缀（Valid Reasoning Prefix）免受破坏性梯度更新的影响。这种渐进式自蒸馏（Progressive Self-Distillation）范式使得学生模型能够逐步扩展其能力边界，不仅显著提升了在 FTRL、BFCL 等基准上的性能，还意外地生成了比黄金参考路径更短、更高效的工具调用序列。\n\n### § 9 最脆弱的假设\n\n该方法最脆弱且关键的假设是：**基于信息原子（Information Atoms）的语义等价性映射能够准确且无歧义地识别出不同工具调用路径下的“相同”中间状态，从而正确构建 ISTG 的菱形结构。**\n\n如果这一假设不成立，ISTG 将无法正确合并语义相同但表面形式不同的路径，导致图结构碎片化或错误连接，进而使得 CTB 的定位失效。在实际中，这一假设可能因以下原因失效：首先，工具响应的语义等价性判断高度依赖于任务特定的上下文，对于复杂或非结构化数据，自动化的原子提取（Atom Extraction）可能无法区分细微但关键的语义差异，或者错误地将不同信息合并为同一原子；其次，某些工具调用可能具有副作用（Side Effects）或状态依赖性，这些无法仅通过累积的信息原子集合（Information Set）来完全表征，导致状态投影（State Projection）出现偏差。论文中提供的证据主要依赖于在 FTRL 数据集上的实验结果，该数据集具有可验证的反馈和相对结构化的任务环境，这有利于原子提取的准确性。然而，论文缺乏对原子提取错误率（Atom Extraction Error Rate）的定量分析，也未在高度非结构化或具有强副作用的工具环境中验证 ISTG 构建的鲁棒性，因此该假设在更广泛的真实世界场景中的有效性仍存疑。\n\n### § 10 最小复现实验\n\n在 1 周时间内，可以复现并验证 **CTB 定位与局部监督对保留有效前缀的有效性**，无需完整复现 ISTG 构建和渐进式蒸馏循环。\n\n**具体方案：**\n1.  **数据准备**：选取 FTRL 数据集中的一小部分（例如 50-100 个任务）的失败学生轨迹（Failed Student Rollouts）和对应的成功教师轨迹（Successful Teacher Trajectories）。\n2.  **实现核心逻辑**：\n    *   简化 ISTG 构建：不实现复杂的原子提取，而是直接使用教师轨迹中的工具调用序列作为“成功路径”的参考。\n    *   实现 CTB 定位：对于每条失败的学生轨迹，通过最长公共前缀（Longest Common Prefix, LCP）或简单的状态匹配（如工具名称和参数值的模糊匹配）找到学生轨迹与任何成功教师轨迹分叉的第一个点，即简化的 CTB。\n    *   实现局部监督：构建训练样本时，保留 CTB 之前的学生前缀，将 CTB 之后的部分替换为从成功教师轨迹中检索到的对应后缀（或仅使用教师轨迹的后缀作为参考生成目标）。在计算 Loss 时，仅对 CTB 之后的 token 计算损失，对前缀部分 Mask 掉。\n3.  **测量指标**：\n    *   对比基线：标准 SFT（全轨迹监督） vs. 局部监督（CTB-guided Localized Supervision）。\n    *   测量：在验证集上，统计模型在失败轨迹中“有效前缀长度”的保留情况（即模型在重新生成时，CTB 之前的步骤是否与原始失败轨迹中正确的步骤一致），以及最终的任务解决率（Solve-F1）。\n4.  **结果判定**：\n    *   **支持 Claim**：如果局部监督方法在保持或提升 Solve-F1 的同时，显著提高了有效前缀的保留率（即模型没有“遗忘”或“覆盖”之前正确的步骤），则证明局部监督确实保护了有效探索。\n    *   **反驳 Claim**：如果局部监督导致前缀保留率下降，或者 Solve-F1 没有显著优于甚至低于标准 SFT，则说明简单的 CTB 定位或局部监督策略不足以解决拓扑坍缩问题，或者 CTB 的定位本身存在严重偏差。", "research_value": "### § 11 最强反例设计\n\n要挑战 **DART-SD** 的有效性，最有力的攻击并非质疑其性能提升，而是攻击其核心假设——即“基于信息原子（Information Atoms）的状态等价性”在复杂、非结构化或具有副作用（Side Effects）的工具调用场景中是可靠且可计算的。\n\n**理论攻击：状态空间的“语义碎片化”与投影偏差**\nDART-SD 的有效性高度依赖于 **ISTG** 能够正确地将语义等效但表面形式不同的工具响应映射到同一个节点（即形成菱形拓扑的汇聚点）。然而，在真实世界的 API 交互中，工具响应往往包含大量噪声、动态变化的元数据（如时间戳、Session ID）或细微的语义差异（例如，一个 API 返回“北京今日气温 20°C”，另一个返回“北京当前温度：20度”）。如果 **Information Atom Abstraction** 模块无法完美处理这种语义对齐，ISTG 将发生“碎片化”（Fragmentation），即本应汇聚的路径被错误地分裂为多个独立节点。\n*   **反例场景**：考虑一个需要多步推理的任务，其中中间步骤的工具响应包含非确定性的辅助信息（如“查询结果已缓存，耗时 0.5s” vs “查询结果实时获取，耗时 0.8s”）。如果原子提取器未能忽略这些无关差异，Student 模型生成的合法路径可能因为微小的格式差异而无法投影到 Teacher 的 **Success-Reachable Region** $R^+_x$ 中。\n*   **后果**：这会导致 **CTB** 被错误地定位在实际上正确的步骤上（False Positive CTB）。随后，**Localized Supervision** 会强行覆盖 Student 原本正确的推理前缀，用 Teacher 的路径进行“修正”。这不仅没有保护有效探索，反而引入了“教师偏差”（Teacher Bias），导致模型学习到的是对特定格式或噪声的鲁棒性，而非真正的逻辑结构。这种“过度修正”（Over-correction）在长尾分布或高噪声数据集中会显著降低模型的泛化能力，甚至导致性能低于简单的 **SFT** 基线。\n\n**实验攻击：在“强副作用”工具环境中的失效**\n设计一个包含“状态依赖型”工具（State-Dependent Tools）的实验环境，例如数据库事务操作或文件写入。在这些场景中，工具调用的顺序不仅影响信息获取，还改变环境状态（Side Effects）。\n*   **具体设计**：构建一个任务，要求 Agent 先“创建文件 A”，再“读取文件 A 的内容”。如果 Agent 先尝试“读取文件 A”（失败），再“创建文件 A”，最后“读取文件 A”（成功）。在 DART-SD 的框架下，如果原子提取器仅关注“获取了文件内容”这一事实，它可能将“先创建后读取”和“先读取失败再创建再读取”视为在信息获取上等效的路径，从而在 ISTG 中汇聚。\n*   **攻击点**：然而，这两种路径在环境状态上是完全不同的。前者是高效路径，后者包含无效探索。如果 DART-SD 错误地将后者视为与前者拓扑等效，并允许 Student 通过局部监督“恢复”，它可能无法学习到“避免无效探索”的策略，因为局部监督只关注 CTB 之后的恢复，而忽略了 CTB 之前的无效步骤对整体效率的影响。更严重的是，如果工具具有不可逆的副作用（如“删除文件”），错误的拓扑对齐可能导致模型学习到危险的操作序列。通过对比 DART-SD 与基于 **Reinforcement Learning** 的方法（如 **ToolRL**）在此类环境中的表现，可以证明 DART-SD 因忽略状态副作用而导致的策略退化。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“静态拓扑对齐”到“动态因果干预”——基于反事实推理的 Agent 蒸馏（Counterfactual-Causal Distillation for Agents, CCD-Agent）**\n\n**（a）驱动局限与未满足需求**\nDART-SD 的核心局限在于其 **ISTG** 构建依赖于对工具响应的静态语义抽象（Information Atoms），这本质上是一种“相关性”匹配，而非“因果性”理解。它假设只要信息原子相同，状态就等效，忽略了工具调用之间的**因果依赖关系**（Causal Dependencies）和**反事实敏感性**（Counterfactual Sensitivity）。例如，在某些任务中，步骤 A 的成功执行是步骤 B 可行的必要条件，而不仅仅是信息上的前置。DART-SD 无法区分“因为 A 所以 B”和“虽然 A 发生了，但 B 是独立发生的”。此外，DART-SD 的 **CTB** 定位是确定性的，缺乏对“如果这一步不同，结果会如何”的反事实探索能力，导致模型只能模仿 Teacher 的路径，而无法发现更优的、Teacher 未曾探索过的因果路径。\n\n**（b）借鉴相邻领域的方法**\n借鉴**因果推断**（Causal Inference）中的**结构因果模型**（Structural Causal Models, SCM）和**反事实推理**（Counterfactual Reasoning）技术，以及**强化学习**中的**离线策略评估**（Off-Policy Evaluation）方法。\n*   **核心思想**：不再将工具调用轨迹视为简单的信息原子序列，而是构建一个**因果图**（Causal Graph），其中节点代表工具调用，边代表因果依赖关系（即一个工具的输出是否是另一个工具输入的必要条件）。\n*   **新方法**：引入**反事实干预**（Counterfactual Intervention）机制。在蒸馏过程中，不仅识别 CTB，还生成“反事实轨迹”（Counterfactual Trajectories），即假设在 CTB 处采取了不同的行动，预测其结果。通过比较实际轨迹与反事实轨迹的奖励差异，模型可以学习到哪些步骤是“因果关键”（Causally Critical），哪些是“冗余”（Redundant）。\n\n**（c）第一个实验设计**\n1.  **数据集构建**：使用 **ToolBench** 或 **FTRL** 数据集，但增加一个“因果扰动”模块。对于每个任务，人工或自动标注工具调用之间的因果依赖关系（例如，“查询天气”是“计算温差”的必要条件，但“查询新闻”不是）。\n2.  **方法实现**：\n    *   构建**因果感知状态图**（Causal-Aware State Graph, CASG），节点不仅包含信息原子，还包含因果依赖标记。\n    *   在 Student Rollout 中，当检测到 CTB 时，不仅检索 Teacher 的成功路径，还生成一组反事实路径（例如，交换两个顺序无关但因果独立的步骤）。\n    *   使用**因果损失函数**（Causal Loss），不仅惩罚与 Teacher 路径的偏差，还奖励那些在反事实推理中被证明为“高效且鲁棒”的路径。\n3.  **评估指标**：\n    *   **因果鲁棒性**（Causal Robustness）：在工具响应被轻微扰动（如添加噪声、改变顺序）的情况下，模型保持任务成功的能力。\n    *   **反事实发现率**（Counterfactual Discovery Rate）：模型发现并采用比 Teacher 更优（更短、更稳定）路径的频率。\n    *   **对比基线**：DART-SD、SFT、以及传统的 RL 方法。\n4.  **预期结果**：CCD-Agent 在因果依赖复杂的任务中表现出更高的鲁棒性，并且能够发现 DART-SD 无法发现的、基于因果逻辑的更优路径，证明从“拓扑对齐”到“因果理解”的范式转变是必要的。\n\n**与已有工作的区别**：\nDART-SD 关注的是**拓扑结构**（Topology）和**信息等价性**（Information Equivalence），旨在解决路径汇聚问题。而 CCD-Agent 关注的是**因果结构**（Causal Structure）和**反事实敏感性**（Counterfactual Sensitivity），旨在解决路径依赖和策略鲁棒性问题。DART-SD 是“模仿者”，CCD-Agent 是“理解者”。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Hangrui Xu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"⋆\"\n      ]\n    },\n    {\n      \"name\": \"Jiarui Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"⋆\"\n      ]\n    },\n    {\n      \"name\": \"Yang Yang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"⋆\",\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Chuanbo Zhu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Fangda Chen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Ziqi Wu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jingming Cai\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yan Song\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"ByteDance\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"University of Science and Technology of China\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"⋆\",\n      \"text\": \"Equal contribution\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding author\"\n    }\n  ]\n}\n```", "summary_translation": "赋予大型语言模型（LLMs）多轮工具调用能力对于构建自主智能体至关重要。然而，进展从根本上受到对全长轨迹模仿的依赖的限制。对于涉及多个顺序无关子目标的任务，最优解空间形成一个巨大的组合钻石晶格。将这种丰富的拓扑结构强制纳入单一轨迹会导致严重的拓扑坍缩，不加区分地惩罚有效的替代探索，并严重降低策略多样性。为了解决这一问题，我们提出了 DART-SD（Diamond-topology Aware Retrieval and Tuning for Self-Distillation），这是一种新颖的框架，将范式从全局强制转变为拓扑引导的局部校正。DART-SD 首先将执行过程建模为收敛的 Interaction-State Transition Graph（ISTG），忠实地捕捉成功和失败探索路径固有的钻石拓扑结构。在自主 rollout 过程中，该框架识别 Critical Topological Breakpoint（CTB）并检索成功支持的恢复参考。最后，我们通过 CTB 引导的局部监督引入渐进式自蒸馏范式，确保训练损失仅针对生成的恢复步骤计算，同时严格保护有效的推理前缀免受破坏性梯度更新的影响。在复杂的多轮工具调用基准测试上的实验表明，DART-SD 显著优于传统的完整轨迹基线。"}, {"title": "Looped Language Models Improve Compositional Tool Calling", "arxiv_id": "2608.18171", "authors": "Andrei Cristian Popescu, Haitz Sáez de Ocáriz Borde, Pietro Liò", "summary": "Looped language models have shown promising results on reasoning benchmarks, yet their potential for agentic tool use remains largely unexplored. We study this question in compositional tool-calling settings, where models must coordinate multiple API calls, maintain intermediate state, and preserve dependencies across tool interactions. We evaluate native and retrofitted looped language models on API-Bank, BFCL, and NESTful, comparing looped and non-looped models trained under matched supervised fine-tuning recipes and varying recurrent depth at inference time. In controlled experiments, recurrent computation generally benefits compositional and dependency-aware tool use, while providing smaller and more model-dependent gains on isolated API invocation. Accuracy on multi-step tool use generally increases with recurrent depth; adaptive inference, however, achieves a more favorable compute-performance trade-off by allocating additional computation only when needed. Our results suggest that looped language models are a promising architecture for agentic systems that require reliable planning, coordination, and execution of compositional tool use workflows.", "category": "cs.LG", "cluster": "Tool Use, Skill Selection \u0026 Planning", "tags": ["cs.LG"], "filter_reason": "该论文完全符合研究范围，具体依据如下：\n\n1.  核心对象明确为 LLM 智能体能力：论文标题和摘要明确指出研究对象是“compositional tool calling”（组合工具调用），这是 LLM 智能体（Agentic AI）的核心能力之一（Tool Use）。摘要中多次使用 \"agentic tool use\"、\"agentic systems\" 等术语，直接对应筛选标准中的核心范式。\n2.  涉及智能体的规划与执行机制：论文研究模型如何“coordinate multiple API calls”（协调多个 API 调用）、“maintain intermediate state”（维护中间状态）以及“preserve dependencies”（保持依赖关系）。这属于单智能体方向中的“规划（Planning）”和“长期决策（Long-Horizon Decision-Making）”范畴，旨在解决智能体在复杂工作流中的执行可靠性问题。\n3.  符合“推理策略/测试时扩展”的保留规则：论文探讨的是“Looped Language Models”（循环语言模型）在推理时的表现，特别是通过调整“recurrent depth at inference time”（推理时的循环深度）和“adaptive inference”（自适应推理）来优化性能。根据筛选标准第四步和重要校准部分，“test-time scaling”、“推理策略搜索”以及明确指向 Agentic 的推理优化应予以保留。虽然它涉及模型架构（Looped LLM），但其核心贡献在于验证该架构如何提升智能体的工具使用能力，而非单纯的底层基础设施优化。\n4.  非排除项：论文不涉及安全、对齐、多模态视觉、图神经网络或多智能体拓扑编排等排除领域。它不是简单地将 LLM 应用于某个垂直领域，而是研究智能体基础能力（工具调用）的改进方法。\n\n综上，该论文通过研究循环架构在推理时的自适应机制，直接提升了 LLM 智能体在组合工具使用场景下的规划与执行能力，属于构建和改进 LLM 智能体的前沿研究，故判定为符合。", "intro_logic": "### § 1 研究问题与重要性\n\n本研究旨在探究 **Looped Language Models**（循环语言模型）在 **Compositional Tool Calling**（组合式工具调用）场景下的有效性，特别是其通过迭代式 **Latent Computation**（隐式计算）增强多步决策、状态维护及依赖关系追踪的能力。传统 **Autoregressive Language Models** 通常依赖单次前向传播生成输出，而在复杂的 **Agentic Systems**（智能体系统）中，任务往往要求模型协调多个 **API Calls**，维持中间状态，并处理工具交互间的顺序或并行依赖。尽管循环架构在算法推理基准上表现优异，但其在 **Tool Use** 尤其是需要结构化多步决策的 **Compositional Tool Use** 中的潜力尚未被充分探索。\n\n该问题的重要性在于，可靠的工具使用不仅仅是生成单个合理的函数调用，更要求模型构建并保留跨多个决策的结构化动作序列。现有的 **Pretrained Language Models** 在处理孤立调用时表现尚可，但在面对需要 **Dependency-Aware Execution**（依赖感知执行）和复杂工作流协调的任务时，往往缺乏足够的推理深度。解决这一问题能够揭示 **Recurrent Depth**（循环深度）如何作为一种机制来强化结构化决策，从而为构建需要可靠规划、协调和执行组合式工具工作流的智能体系统提供更具潜力的架构基础。此外，研究 **Adaptive Inference**（自适应推理）在其中的作用，有助于在计算成本与性能之间找到更优的权衡，这对于实际部署中的资源效率至关重要。\n\n### § 2 前人工作与不足\n\n在工具使用领域，先前的研究主要集中在通过外部策略增强模型能力，而非改变模型内部的计算架构。例如，**ReAct** [Yao et al., 2023] 展示了模型可以交错推理与工具执行，**Toolformer** [Schick et al., 2023] 让模型从自监督标注中学习 API 使用，而 **Chameleon** [Lu et al., 2023] 和 **Gorilla** [Patil et al., 2023] 则通过显式规划、任务分解或从大型工具集合中检索相关 API 来改进组合式工具使用。近期工作如 [Kim et al., 2024] 构建了依赖感知的执行图以调度函数调用。然而，这些方法主要依赖于外部的 **Planning**、**Retrieval** 或 **Execution Strategies**，并未深入探讨模型内部通过增加测试时计算（Test-time Computation）来增强内在推理能力的潜力。\n\n在模型架构方面，**Looped Transformers** 或 **Recurrent Depth** 架构（如 **Universal Transformer** [Dehghani et al., 2019]、**Deep Equilibrium Models** [Bai et al., 2019] 以及近期的 **Ouro** [Zhu et al., 2025] 和 **Retrofitted Recurrence** [McLeish et al., 2025]）已被证明在算法推理、长度泛化和隐式测试时缩放方面具有优势。这些模型通过重复应用共享的 Transformer 块来增加有效深度，从而在不增加参数量的情况下增加推理时的计算量。尽管这些模型在推理基准上表现出色，但其优势是否以及如何迁移到 **Tool-Use Settings** 尚不清楚。\n\n现有研究的不足在于：首先，大多数工具使用研究假设模型通过单次前向传播即可做出最佳决策，忽略了复杂组合任务可能需要迭代式 **Latent Refinement**（隐式细化）来纠正语义错误或绑定依赖关系。其次，虽然循环模型在推理任务中有效，但缺乏在 **Compositional Tool Calling** 这一特定且更具挑战性的场景下的系统性评估，特别是关于 **Recurrent Depth** 对多步依赖追踪的具体贡献。最后，现有工作未充分探索 **Adaptive Computation** 在工具调用中的效率优势，即如何根据任务难度动态分配计算资源，以在保持性能的同时降低平均计算成本。因此，本研究填补了这一空白，通过控制实验隔离了循环计算对组合式工具使用的具体影响，并验证了其在依赖感知任务中的独特价值。", "core_insight": "### § 3 重建作者的思考路径\n\n在 agentic systems 的发展中，语言模型（LLMs）作为决策核心，其核心瓶颈已从“能否调用工具”转向“能否可靠地执行复杂的工作流”。现有的主流方法主要依赖外部策略，如 ReAct 框架中的显式思维链（Chain-of-Thought）或专门的规划模块，通过生成额外的自然语言 token 来分解任务、维护状态和协调依赖。然而，这种基于 token 的推理存在明显的局限性：它增加了序列长度，导致推理延迟高、计算成本高，且容易在长序列中丢失早期的上下文信息或产生幻觉。与此同时，学术界在算法推理和长度泛化领域发现，Looped Transformers（循环 Transformer）或具有 Recurrent Depth 的架构，通过在推理时重复应用共享的 Transformer 块来迭代精炼隐式表示（Latent Representations），能够在不增加参数量的情况下显著提升模型的推理能力。这种“Latent Reasoning”机制允许模型在内部进行多次“思考”，而无需输出中间步骤。\n\n基于此，研究者开始思考：如果显式的文本推理（Explicit Reasoning）能解决复杂工具调用的协调问题，那么隐式的迭代计算（Iterative Computation）是否也能在内部完成类似的“规划”和“状态维护”？特别是对于 Compositional Tool Calling，模型需要处理多个 API 调用之间的依赖关系（Dependencies）和并行结构，这本质上是一个需要多步决策和状态跟踪的结构化预测问题。传统的单次前向传播（Single Forward Pass）可能不足以捕捉这种复杂的结构约束，而 Looped Models 提供的额外计算深度可能恰好弥补了这一缺陷。此外，Looped Models 天然支持 Adaptive Inference（自适应推理），即根据任务难度动态分配计算资源，这为解决 agentic 系统中计算效率与性能之间的权衡提供了新的可能性。因此，作者假设：将 Looped Language Models 应用于工具调用场景，特别是那些需要多步协调和依赖管理的 Compositional 任务，能够通过隐式的迭代精炼显著提升模型的结构化决策能力，同时通过自适应机制优化计算效率。\n\n### § 4 核心 Intuition\n\n传统 LLM 在单次前向传播中难以同时兼顾多个工具调用的结构约束与依赖关系，导致在复杂工作流中容易出错。Looped Language Models 通过在生成每个 token 前迭代精炼隐式表示，为模型提供了在内部“反复推敲”调用结构、修正依赖绑定和协调并行任务的机会，从而在不增加参数量的情况下增强了结构化决策能力。这种机制特别适用于需要维护中间状态和追踪输出-输入依赖的 Compositional Tool Calling 场景，使得模型能够像人类规划者一样，在最终输出前逐步完善其行动序列。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文的核心方法并非提出一种全新的训练算法，而是评估 **Looped Language Models**（循环语言模型）在 **Compositional Tool Calling**（组合式工具调用）任务中的表现。其核心思想是利用 **Recurrent Depth**（循环深度）在推理阶段增加计算量，通过迭代 refinement（细化）隐式表示（latent representations），从而提升模型处理多步、依赖性强工具调用的能力。\n\n以下是基于论文中 **NESTful** 基准测试的一个真实例子（Figure 5 和 Figure 6 的综合场景）来讲解完整的 Pipeline：\n\n**场景背景**：\n用户请求：“计算能整除 100 的最大 2 的幂次，然后计算该幂次的 2 的幂。”\n可用工具：`highest_power_of_two(x)` 和 `calculate_power_of_two(num)`。\n这是一个典型的 **Nested/Dependent Tool Use** 任务，因为第二个调用的参数依赖于第一个调用的输出。\n\n**Pipeline 步骤**：\n\n1.  **输入编码 (Input Encoding)**：\n    *   模型接收用户查询 `x` 和工具定义（Tool Definitions）。\n    *   初始隐藏状态 $h^{(0)}$ 被生成。对于 **Looped Transformer**（如 Ouro 或 Retrofit 模型），这个状态将进入一个共享的 Transformer 块进行迭代处理，而不是像标准 Transformer 那样通过堆叠不同的层。\n\n2.  **迭代隐式推理 (Iterative Latent Computation)**：\n    *   模型不直接生成最终文本，而是先进行 $T$ 次循环迭代（Recurrent Iterations）。\n    *   在每次迭代 $t$，共享块更新隐藏状态：$h^{(t)} = F_\\theta(h^{(t-1)})$。\n    *   **关键机制**：随着迭代次数增加，模型在“思维”层面逐步修正对工具选择、参数绑定和依赖关系的理解。\n    *   *例子中的变化*：\n        *   **Depth 1 (浅层)**：模型可能只生成一个错误的调用，或者遗漏了依赖关系。例如，它可能直接输出 `calculate_power_of_two(num=100)`，忽略了需要先求最大幂次，或者生成了不在工具列表中的幻觉函数。\n        *   **Depth 2 (中层)**：模型可能识别出需要两个调用，但顺序错误或参数引用无效。例如，它可能先调用 `calculate_power_of_two`，或者使用了错误的变量名 `$var_2.result$`。\n        *   **Depth 3/4 (深层)**：模型收敛到正确的结构。它首先调用 `highest_power_of_two(x=100)` 并将结果绑定到 `$var1`，然后调用 `calculate_power_of_two(num=$var1.output_0$)`。\n\n3.  **自适应或固定深度退出 (Exit Strategy)**：\n    *   **Fixed-Depth Inference**：模型强制执行预设的迭代次数（如 4 次），然后输出最终预测。\n    *   **Adaptive Inference**（仅 Ouro 模型支持）：模型在每个 token 生成时计算一个 **Halting Probability**（停止概率）。如果累积置信度超过阈值 $q$，模型提前退出循环。这实现了 **Compute-Performance Trade-off**，即简单任务少算，复杂任务多算。\n\n4.  **结构化输出解码 (Structured Output Decoding)**：\n    *   在最后一次迭代（或自适应退出点），模型通过输出头 $g_\\theta$ 生成最终的 token 序列。\n    *   输出被解析为结构化的工具调用序列 $C_x$ 和依赖图 $E_x$。\n    *   *最终输出*：\n        ```json\n        [\n          {\"name\": \"highest_power_of_two\", \"arguments\": {\"x\": 100}, \"output\": \"$var1\"},\n          {\"name\": \"calculate_power_of_two\", \"arguments\": {\"num\": \"$var1.output_0\"}, \"output\": \"$var2\"}\n        ]\n        ```\n\n5.  **执行与验证 (Execution \u0026 Evaluation)**：\n    *   系统根据依赖图 $E_x$ 执行工具调用。\n    *   在 NESTful 中，评估器检查最终答案是否正确（Win Rate）；在 BFCL 中，检查 AST（抽象语法树）是否匹配。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文主要是一篇实证研究（Empirical Study），侧重于评估现有架构（Looped Transformers）在特定任务上的表现，而非提出新的理论推导。因此，没有复杂的原创性数学证明。但为了帮助理解，这里解释其核心公式的 **Intuition**：\n\n1.  **Looped Transformer 的状态更新**：\n    $$h^{(t)} = F_\\theta(h^{(t-1)})$$\n    *   **Intuition**：标准 Transformer 像是一条流水线，数据流过不同的层（Layer 1 -\u003E Layer 2 ...）。Looped Transformer 像是一个“思考循环”，数据在同一个“思考模块” $F_\\theta$ 中反复循环。每次循环，模型都在细化它对当前上下文的理解。$t$ 越大，模型“思考”得越久，计算量越大，但参数量不变。\n\n2.  **自适应退出的概率分布**（Ouro 模型特有）：\n    $$p_\\phi(t | x) = \\lambda^{(t)}(x) \\prod_{j\u003Ct} (1 - \\lambda^{(j)}(x))$$\n    *   **Intuition**：这是一个几何分布的变体。$\\lambda^{(t)}(x)$ 是模型在第 $t$ 步决定“我已经想清楚了，可以输出了”的概率。\n    *   如果 $\\lambda$ 很小，模型倾向于继续循环（深入思考）；如果 $\\lambda$ 很大，模型倾向于停止。\n    *   这个公式允许模型根据问题的难易程度动态分配计算资源：简单问题（如单工具调用）可能 $\\lambda$ 很快变大，1-2 次迭代就退出；复杂问题（如嵌套依赖）$\\lambda$ 保持较小，直到 3-4 次迭代才退出。\n\n3.  **训练目标**（Retrofit 模型）：\n    $$\\mathcal{L} = \\mathcal{L}_{CE} + \\beta \\cdot D_{KL}(p_{\\theta[r]} || p_{\\theta_0})$$\n    *   **Intuition**：Retrofit 模型是将预训练好的标准 Transformer 改造为 Loop 结构。\n    *   $\\mathcal{L}_{CE}$ 是标准的交叉熵损失，确保模型能正确预测下一个 token。\n    *   $D_{KL}$ 是 KL 散度正则化项，用于约束改造后的模型不要偏离原始预训练模型 $p_{\\theta_0}$ 的行为太远。这保证了在增加循环深度的同时，模型不会“忘记”它原本学到的知识。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n*   **核心问题**：Looped Language Models（通过增加推理时的循环深度来增加计算量）是否能提升 **Compositional Tool Calling**（组合式工具调用）的性能？\n*   **子问题**：\n    *   这种提升是普遍存在的，还是仅针对特定类型的工具调用（如单调用 vs. 多调用/依赖调用）？\n    *   增加循环深度（Recurrent Depth）是否总是带来收益？\n    *   **Adaptive Inference**（自适应推理）是否能比固定深度推理提供更好的 **Compute-Performance Trade-off**（计算-性能权衡）？\n    *   原生 Loop 模型（Native, 如 Ouro）与改造后的 Loop 模型（Retrofitted, 如 Llama/OLMo 改造版）表现有何差异？\n\n**2. 设计了什么实验验证这个问题？**\n*   **模型对比**：\n    *   **Native Looped**：Ouro-1.4B/2.6B vs. 同等规模的 Qwen3/Llama 标准 Transformer。\n    *   **Retrofitted Looped**：将 Llama-3.2-1B 和 OLMo-2-1B 改造为 Loop 结构，并与它们的非循环父模型对比（控制变量：相同的预训练家族和微调数据）。\n*   **基准测试（Benchmarks）**：\n    *   **API-Bank**：主要评估单工具调用（Single-call），侧重 API 选择和参数生成。\n    *   **BFCL v3**：评估从简单单调用到并行多调用（Parallel/Parallel-Multiple）的能力，但不涉及输出依赖。\n    *   **NESTful**：评估嵌套、依赖性的工具调用（Nested/Dependent），即后续调用的参数依赖前序调用的输出。\n*   **推理策略**：\n    *   **Fixed-Depth**：固定循环次数（1, 2, 4, 8 次），观察性能随深度的变化。\n    *   **Adaptive**：使用 Ouro 的自适应退出门控，观察在不同置信度阈值下的性能与平均循环深度的关系。\n*   **定性分析**：通过可视化不同深度下的中间预测结果，分析模型是如何逐步修正错误（如幻觉函数、错误依赖）的。\n\n**3. 问题的答案是什么？**\n*   **Looped 模型显著提升组合式工具调用性能**：在需要多步协调和依赖追踪的任务（BFCL 的 Parallel 类别和 NESTful）上，Looped 模型显著优于非 Loop 基线。而在简单的单工具调用（API-Bank 和 BFCL Simple）上，提升较小或不一致。\n*   **性能随循环深度增加而提升**：在 BFCL 和 NESTful 上，增加循环深度（Recurrent Depth）通常能提高准确率，直到达到饱和点。这表明额外的计算量被用于细化复杂的依赖关系。\n*   **自适应推理更优**：Adaptive Inference 能够在保持高准确率的同时，显著减少平均循环次数（即减少计算量），实现了更好的 **Compute-Performance Trade-off**。它只在必要时（复杂任务）分配更多计算资源。\n*   **原生模型优于改造模型**：原生训练的 Loop 模型（Ouro）在深层嵌套任务上表现远优于 Retrofit 模型。这表明 **Pretraining** 阶段对循环结构的适应至关重要，仅靠微调（SFT）难以完全发挥 Loop 架构在复杂推理上的潜力。\n*   **结论**：Looped Language Models 是构建需要可靠规划、协调和执行组合式工具工作流的 **Agentic Systems** 的有前景的架构。", "additional_insights": "### § 8 Take-aways\n\nLooped Language Models (LLMs) 通过增加推理时的迭代计算（recurrent depth）而非参数数量，显著提升了模型在 Compositional Tool Calling 任务中的表现，特别是在需要维护中间状态和依赖关系的复杂工作流中。实验表明，这种架构优势主要体现在多步调用（Multi-call）和依赖感知（Dependency-aware）任务上，而在简单的单步 API 调用（如 API-Bank 中的孤立调用）上增益有限且高度依赖模型基座。增加 Recurrent Depth 通常能线性提升多步工具使用的准确率，但存在饱和点；引入 Adaptive Inference（自适应推理）机制，根据 token 难度动态分配迭代次数，能在保持性能的同时优化 Compute-Performance Trade-off。定性分析揭示，迭代计算不仅修正格式错误，更能逐步纠正函数选择、参数绑定以及输出到输入的依赖关系（Output-to-Input Dependencies），表明 Latent Refinement 有助于模型构建更稳健的结构化决策序列。然而，Retrofitted Loop Models（将现有 Transformer 改造为循环结构）在深层嵌套工作流上的表现仍显著弱于 Native Loop Models（如 Ouro），暗示预训练阶段对表示空间的塑造对循环推理的有效性至关重要。\n\n### § 9 最脆弱的假设\n\n该研究最核心的假设是：**Looped Architecture 带来的性能提升主要归因于推理时的迭代计算（Test-time Computation），而非训练过程中引入的特定正则化或数据分布偏差。** 如果这一假设不成立，即性能提升实际上是因为 Loop 模型的训练目标（如 Ouro 的联合优化损失或 Retrofit 的 KL 正则化）无意中引入了更强的归纳偏置，那么“通过增加推理计算来换取性能”的核心论点将失效，因为这种增益无法通过简单的推理深度调整来灵活控制，且可能无法泛化到其他训练范式。\n\n论文通过 Fixed-Depth Inference 实验试图验证此假设，即在保持模型参数冻结的情况下，仅改变推理时的迭代次数（Recurrent Depth），观察到准确率随深度增加而提升。然而，这一证据存在脆弱性：首先，Retrofitted 模型在训练时使用了随机采样的深度分布（Poisson-lognormal），这可能导致模型在特定深度上表现更好并非因为“迭代本身”有效，而是因为训练分布与推理深度的匹配度；其次，Native Ouro 模型在预训练阶段就联合优化了 Halting Gate，其表示空间可能已经针对迭代过程进行了特化，使得非循环基线模型（即使经过相同的 SFT）在结构上就处于劣势。论文缺乏一个关键的对照实验：使用完全相同的训练数据和优化器，但在训练时强制所有模型使用相同的固定深度（例如深度为1），然后仅在推理时增加深度，以彻底排除训练阶段“深度感知”带来的偏差。如果缺乏这种严格的隔离，我们难以确定增益是来自“思考时间”还是“训练时的深度正则化”。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 **Adaptive Inference 在计算效率上的优势** 这一具体 Claim，无需从头预训练或微调大型模型。\n\n**数据与实现：** 使用论文中提到的 BFCL v3 或 NESTful 的公开测试集（或其中一个小子集，如 100 个样本）。加载一个已发布的 Looped Model 检查点（如 Ouro-1.4B 或 Ouro-2.6B，若可用；若不可用，可使用论文提供的 Retrofitted Llama-3.2-1B 检查点，但需注意其无自适应门控，需模拟或仅测试固定深度对比）。如果无法获取 Ouro 的自适应门控，可以简化实验为：**验证“固定深度增加是否带来边际收益递减”**。实现一个简单的推理脚本，对同一批输入，分别以 Recurrent Depth = 1, 2, 4, 8 进行推理，记录每个 token 的生成时间和最终的 AST Accuracy 或 Win Rate。\n\n**测量与结果判定：** 测量每个深度下的平均准确率（Accuracy/Win Rate）和总推理时间（或 FLOPs 估算）。\n*   **支持 Claim：** 如果准确率随深度增加而提升，但提升幅度在深度 4 或 8 后趋于饱和（Marginal Gain \u003C 1%），同时推理成本线性增加，则支持“存在最优计算点”的结论，进而佐证自适应推理的必要性。\n*   **反驳 Claim：** 如果准确率随深度线性持续增长且无饱和迹象，或者深度 1 的表现已经接近深度 8，则说明该模型或任务对迭代计算不敏感，自适应推理的价值存疑。\n\n此实验避开了复杂的训练过程，直接验证了论文中关于“计算-性能权衡”的核心观察，且所需资源仅为单张 GPU 和少量推理时间。", "research_value": "### § 11 最强反例设计\n\n若要挑战 **Looped Language Models** 在 **Compositional Tool Calling** 中的有效性，最有力的攻击并非质疑其准确率提升，而是质疑其**计算效率的边际收益**以及**错误模式的不可控性**。具体而言，可以设计一个基于 **Error Propagation in Latent Space**（隐空间误差传播）的反例实验。\n\n**核心论点**：Looped 架构假设迭代能“细化”表示，但在缺乏外部反馈（如工具执行结果）的纯生成阶段，错误的 **Latent Representation** 可能会在循环中被放大而非修正，导致模型陷入“自信的错误”（Confident Hallucination），且这种错误比标准 Transformer 更难通过简单的后处理纠正。\n\n**实验设计：对抗性依赖注入与误差放大测试**\n1.  **构造对抗性数据集**：在 **NESTful** 或 **BFCL** 基础上，构建一类“陷阱”任务。这些任务包含看似合理但逻辑上互斥的工具依赖链。例如，要求调用 `get_weather(city)` 获取温度，然后调用 `convert_temp(temp, unit='C')`，但故意在工具定义中混淆 `unit` 参数的默认值或类型约束，使得模型必须在极深的推理层级才能发现类型不匹配。\n2.  **对比基线**：\n    *   **Looped Model (Fixed Depth 8)**：强制模型进行 8 次迭代。\n    *   **Standard Transformer + Self-Correction**：使用同等参数的标准 Transformer，但允许其在生成后进行一次“自我反思”步骤（即生成初步调用，模拟执行，若失败则重新生成）。\n    *   **Looped Model (Adaptive)**：使用自适应退出。\n3.  **测量指标**：\n    *   **Error Amplification Rate**：统计在 Depth 1 时产生错误，但在 Depth 8 时错误变得更严重（如从参数错误变为完全错误的函数调用）的比例。\n    *   **Compute-Error Trade-off**：绘制“每单位 FLOPs 的正确率增益”。如果 Looped 模型需要 4 倍于标准模型的 FLOPs 才能达到相同的准确率，且其错误模式更具破坏性（如导致系统崩溃而非简单报错），则证明其效率低下。\n4.  **预期反驳结果**：如果数据显示，随着 **Recurrent Depth** 增加，模型在复杂依赖任务上的错误率并未显著下降，或者下降幅度远小于计算成本的线性增长，且错误类型从“随机猜测”转变为“系统性逻辑谬误”，则说明 **Latent Refinement** 在无反馈闭环中是无效的。这将证明，对于 **Compositional Tool Use**，外部的 **ReAct-style** 交互（即真正的工具执行反馈）比内部的 **Looped Computation** 更关键，而 Looped 模型只是用昂贵的计算换取了微弱的、甚至有害的“伪推理”。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：Feedback-Driven Adaptive Looping (FDAL) —— 将工具执行反馈整合进循环退出的动态门控机制**\n\n**(a) 驱动局限与未满足需求**\n当前 **Looped Language Models** 的核心局限在于其 **Adaptive Inference** 完全依赖于模型内部的 **Halting Probability**，这是一种基于统计置信度的“盲猜”。在 **Compositional Tool Calling** 中，模型往往无法仅凭内部表示准确判断何时“想清楚了”，因为工具调用的正确性高度依赖于外部 API 的语义约束和运行时状态。现有的 **Test-time Computation** 是静态或半静态的，缺乏与 **Tool Execution Environment** 的实时交互。这导致模型要么在简单任务上过度计算（浪费资源），要么在复杂任务上因过早退出而失败。\n\n**(b) 借鉴相邻领域的方法**\n借鉴 **Reinforcement Learning from Human Feedback (RLHF)** 中的奖励建模思想，以及 **Active Learning** 中的不确定性采样策略。具体而言，引入一个轻量级的 **Verifier Model** 或 **Static Analyzer**，作为循环退出的外部信号源。这类似于 **Chain-of-Thought (CoT)** 中的自我验证步骤，但将其集成到 **Looped Architecture** 的迭代过程中，形成一种 **Closed-Loop Reasoning** 机制。\n\n**(c) 第一个实验设计**\n1.  **架构修改**：在 **Ouro** 或 **Retrofitted Loop Model** 的每次迭代后，不直接依赖内部的 $\\lambda^{(t)}$，而是将当前的 **Latent State** 或生成的 **Partial Tool Call Sequence** 输入到一个独立的、经过微调的 **Syntax/Logic Verifier**（可以是小型 LLM 或规则引擎）。\n2.  **动态门控策略**：\n    *   如果 Verifier 检测到明显的语法错误或逻辑矛盾（如参数类型不匹配），强制模型继续循环（Override Halting）。\n    *   如果 Verifier 确认当前序列在静态分析下是合法的，且内部置信度超过阈值，则允许退出。\n    *   如果 Verifier 无法确定（高不确定性），则根据任务复杂度动态调整剩余迭代次数。\n3.  **实验对比**：\n    *   **Baseline**：原生 **Adaptive Inference**（仅内部置信度）。\n    *   **Proposed**：**Feedback-Driven Adaptive Looping (FDAL)**。\n    *   **Task**：在 **NESTful** 基准上，特别关注那些需要多步依赖且容易出错的样本。\n4.  **预期成果**：证明引入外部 **Verification Feedback** 可以显著降低 **False Positive** 的过早退出率，同时在简单任务上保持低计算成本。这将开辟一个新的研究方向：**Hybrid Internal-External Reasoning Architectures**，即结合内部 **Latent Refinement** 和外部 **Symbolic Verification** 的混合推理范式，解决纯神经方法在结构化任务中的可靠性问题。这与现有工作不同，因为它不再将 **Looped Model** 视为一个黑盒推理器，而是将其作为一个可被外部信号动态调控的 **Reasoning Engine**。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Andrei Cristian Popescu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Haitz Sáez de Ocáriz Borde\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Pietro Liò\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"University of Cambridge\"\n    }\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "Looped language models 在推理基准测试中展现出令人鼓舞的结果，但其在智能体工具使用方面的潜力尚未得到充分探索。我们在组合式工具调用设置下研究了这一问题，在该设置中，模型必须协调多个 API 调用、维护中间状态，并在工具交互中保持依赖关系。我们在 API-Bank、BFCL 和 NESTful 上评估了原生和改造后的 looped language models，比较了在匹配的 supervised fine-tuning 方案下训练的 looped 和 non-looped 模型，以及在推理时变化的 recurrent depth。在受控实验中，recurrent computation 通常有利于组合式和依赖感知的工具使用，而在孤立的 API 调用上提供的增益较小且更依赖于模型。多步工具使用的准确率通常随 recurrent depth 的增加而提高；然而，adaptive inference 通过仅在需要时分配额外计算，实现了更有利的计算-性能权衡。我们的结果表明，looped language models 是一种有前景的架构，适用于需要可靠规划、协调和执行组合式工具使用工作流的智能体系统。"}, {"title": "SkillGate: Training In-Policy Skill Selection in Long-Horizon Agents", "arxiv_id": "2608.18852", "authors": "Qingyao Li, Wenxiang Jiao, Shuai Shao, Kangning Zhang, Yuan Lu, Yi Guo, Weiwen Liu, Weinan Zhang, Yong Yu", "summary": "Agent frameworks increasingly package procedural knowledge as skills: instruction files an agent reads on demand, while public libraries now hold thousands of them. Which skill to read has thus become a decision the policy itself makes in the middle of an episode, yet no existing signal trains it. We show that the default remedy, outcome-rewarded RL over the candidate slate, cannot teach it, for a structural reason we identify and name selector credit starvation: under a broadcast, sequence-level advantage, the few tokens that name the chosen skill carry a vanishing share of the loss, and the credit they inherit is increasingly wrong-signed as trajectories lengthen. A correct choice is punished whenever the execution after it fails, even though the choice itself is among the most valuable decisions in the trajectory. Auditing a completed run's own training artifacts confirms all three properties, each worsening monotonically with horizon. SkillGate removes the failure by construction: it partitions the token support into two disjoint credit channels, outcome credit reaching only execution tokens, and a separate action-local advantage reaching exactly the skill-naming tokens, positive only when a trajectory's single read is the correct one. On five agentic benchmarks under a 16-candidate slate, SkillGate lifts a 9B policy from 40.8% to 53.2% trial success, well ahead of the identical budget spent on outcome reward alone, while cutting exposure to misleading candidates by two thirds and reading fewer skills.", "category": "cs.AI", "cluster": "Tool Use, Skill Selection \u0026 Planning", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Long-Horizon Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文针对的核心研究问题是：在长视界（long-horizon）Agent任务中，如何有效训练策略网络（policy）在Episode中间进行**In-Policy Skill Selection**（策略内技能选择）。具体而言，当Agent面对包含数千个候选技能的库时，它必须仅凭技能名称和简短描述，在任务执行过程中决定读取哪个技能文件（SKILL.md）。这一决策发生在轨迹（trajectory）的早期，且直接决定了后续执行的质量。\n\n该问题的重要性在于，现有的主流训练范式——基于结果奖励的强化学习（outcome-rewarded RL）——在解决此问题时存在结构性缺陷，作者将其命名为**Selector Credit Starvation**（选择器信用饥饿）。在传统的策略梯度更新中，整个轨迹共享同一个序列级优势（sequence-level advantage）。由于命名技能的Token数量极少（通常仅占轨迹总Token的0.14%），其梯度贡献被严重稀释（dilution）；更严重的是，由于优势信号基于最终任务结果，若后续执行失败，即使早期的技能选择是正确的，该选择也会受到负向惩罚（wrong-signed credit）。随着轨迹长度增加，这种“正确选择被惩罚”的概率单调上升，导致模型无法学会正确的选择行为。\n\n解决这一问题的价值体现在三个方面：首先，它打破了单纯依赖模型规模（scale）或通用能力来解决技能选择的瓶颈，证明了选择能力需要专门的训练信号；其次，SkillGate方法通过分离信用通道，显著提升了任务成功率（在9B模型上从40.8%提升至53.2%），同时减少了对误导性技能（misleading candidates）的暴露，并降低了整体Token消耗；最后，该方法提供了一种通用的设计原则，即当轨迹中包含性质不同的决策时，应通过分离Token支持集（token support）来避免信号干扰，而非依赖单一广播优势。\n\n### § 2 前人工作与不足\n\n尽管技能选择是Agent框架中的关键环节，但现有工作未能有效解决**In-Policy Skill Selection**的训练难题，主要原因在于对信用分配（credit assignment）机制的忽视或处理不当。\n\n1.  **基于检索或路由的外部方法（External Routing/Retrieval）**：如**SkillRet**、**SkillRouter**、**SkillSight**等工作，侧重于在Agent执行前通过检索或重排序（reranking）来筛选技能。这些方法将选择问题外化为一个独立的检索任务，而非Agent策略的一部分。它们的不足在于，它们假设选择可以在执行前完全确定，或者依赖外部组件，无法捕捉Agent在动态交互中基于上下文做出的即时决策能力。此外，**SkillReducer**和**Capability Pages**试图通过重写技能表示来改善路由，但这并未解决策略网络内部如何从梯度中学习选择的问题。\n\n2.  **基于结果奖励的联合优化方法（Outcome-Only RL）**：如**SkillRL**、**Skill1**、**SkillRise**等工作，尝试在任务奖励下联合优化技能构建和使用。然而，这些方法通常将技能选择视为轨迹的一部分，使用统一的结果奖励进行更新。正如本文所指出的，这种方法存在根本性的**Selector Credit Starvation**问题：由于选择Token的梯度份额随轨迹长度稀释，且信号符号常因后续执行失败而错误，导致模型无法有效学习选择。例如，**SkillRL (outcome only)** 在实验中虽然增加了技能读取频率，但同时也增加了对误导性技能的暴露，表明其并未学会真正的判别能力，而是倾向于“多读”以碰运气。\n\n3.  **监督学习与偏好学习（Supervised/Preference Learning）**：如**Selection BC**（行为克隆）和**SelSkill-DPO**（直接偏好优化），通过教师强制或偏好对来训练选择。这些方法的不足在于，它们依赖于高质量的选择标注数据，且往往只优化了选择动作本身，而未与执行过程进行有效的联合优化。实验显示，**Selection BC** 虽然提高了选择准确率，但下游任务成功率提升有限，说明单纯的选择优化不足以提升整体Agent性能，且缺乏对执行反馈的利用。\n\n4.  **细粒度信用分配方法（Fine-grained Credit Assignment）**：如**Turn-PPO**、**GEAR**、**TACO**等工作，试图通过回合级（turn-level）或Token级的重新加权来改善信用分配。然而，这些方法通常关注于推理步骤或工具调用的整体贡献，并未专门针对**Skill Identity Tokens**（技能标识Token）进行隔离。它们未能解决选择决策与执行决策在证据来源上的本质差异：选择的正确性仅取决于候选列表（slate），而执行的正确性取决于任务结果。将两者混合在一个优势信号中，必然导致信号污染。\n\n综上所述，前人工作要么将选择外化，要么在联合优化中忽视了选择Token的信用饥饿问题，要么缺乏对选择与执行信号分离的理论洞察。本文提出的**SkillGate**通过构造两个不相交的信用通道（disjoint credit channels）——任务通道（task channel）仅更新执行Token，选择器通道（selector channel）仅更新技能命名Token——从根本上解决了这一结构性缺陷。", "core_insight": "### § 3 重建作者的思考路径\n\n在长程 Agent 任务中，LLM 通常通过调用外部工具或读取技能文件（Skills）来弥补程序性知识的不足。现有的主流训练范式是 Outcome-rewarded RL（如 GRPO 或 PPO），即根据任务最终的成功与否，将单一的 Advantage 信号广播到整个轨迹的所有 Token 上。然而，随着轨迹长度的增加，这种“广播式”信用分配（Credit Assignment）暴露出严重的结构性缺陷。\n\n首先，从梯度贡献的角度看，决定“读取哪个技能”的 Token（即 Skill Identity Tokens）在数千个执行 Token 中占比极小（通常低于 0.2%）。在均匀广播 Advantage 的机制下，这些关键决策 Token 所获得的梯度权重被严重稀释（Dilution），导致模型难以从稀疏的最终奖励中学习到正确的选择策略。\n\n其次，更致命的是信号符号的错误（Wrong-signed Credit）。在长程任务中，即使 Agent 正确选择了技能（Correct Choice），后续的执行过程（Execution）仍可能因推理错误或环境噪声而失败。由于 Outcome Reward 是全局的，执行失败会导致整个轨迹获得负 Advantage，从而惩罚了原本正确的技能选择。这种“因执行失败而惩罚正确选择”的现象，随着轨迹变长而愈发严重，导致模型陷入“Selector Credit Starvation”——即选择器既缺乏足够的信号强度，又经常接收到误导性的负向信号。\n\n现有的解决方案要么依赖外部路由器（Router）进行预筛选，要么通过监督学习（BC/DPO）强制模型读取特定技能，但这些方法往往割裂了选择与执行的联合优化，或无法在 In-policy 的动态决策中有效工作。因此，研究者意识到，必须将“选择哪个技能”这一决策与“如何执行任务”这一过程在信用分配上解耦。既然 Outcome Reward 无法准确反映选择的质量，就需要引入一个与执行结果无关、仅基于选择本身正确性的局部信号（Action-local Advantage），并严格限制该信号只作用于技能名称 Token，从而构建一个独立于执行噪声的选择信用通道。\n\n### § 4 核心 Intuition\n\nSkillGate 的核心直觉在于：**技能选择（Selection）与任务执行（Execution）是两种性质截然不同的决策，不应共享同一个基于最终结果的信用信号。**\n\n传统 RL 将任务成败的奖励广播给所有 Token，导致关键的“技能选择”Token 既因数量稀少而被梯度稀释，又常因后续执行失败而被错误惩罚（即 Selector Credit Starvation）。SkillGate 通过构造两个互斥的信用通道来解决这一问题：执行通道仅接收基于任务结果的 Outcome Advantage，而选择通道仅接收基于“是否选中唯一正确技能”的局部 Advantage。这种解耦确保了技能选择的学习不受执行噪声的干扰，使模型能够纯粹地从“选对”这一行为中获得正向反馈，从而在长程任务中实现精准的技能路由。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nSkillGate 的核心方法是通过**Credit Partitioning（信用分配分区）**，将长程 Agent 轨迹中的 Token 支持集划分为两个互斥的信用通道：**Task Channel（任务通道）**和 **Selector Channel（选择器通道）**。这种方法旨在解决传统 Outcome-rewarded RL 中存在的 **Selector Credit Starvation（选择器信用饥饿）**问题，即技能选择决策因 Token 占比极小且受后续执行结果干扰，导致梯度信号微弱且符号错误。\n\n以下结合一个具体的“代码修复”任务例子，讲解 SkillGate 的完整 Pipeline：\n\n**1. 输入阶段 (Input \u0026 Slate Construction)**\n*   **场景**：Agent 需要修复一个 Python 脚本中的日期解析错误。\n*   **Skill Slate（技能候选集）**：系统提示词中包含 16 个候选技能（$K=16$）。其中包含 1 个 **Oracle Skill**（正确技能，如 `date-parser-fix`），5 个 **Misleading Skills**（误导性技能，如 `date-formatter`，名称相似但功能不同），以及 10 个无关或相关 bystander 技能。\n*   **初始状态**：Agent 仅看到技能的名称和一行描述，尚未读取任何技能的具体内容（Body）。\n\n**2. 推理与动作生成 (Rollout \u0026 Action Generation)**\n*   **推理过程**：Agent 根据任务描述和候选技能列表进行推理。\n*   **关键动作**：Agent 决定调用 `read` 工具。假设 Agent 正确选择了 Oracle Skill，生成的 Token 序列中包含工具调用：\n    `read(\"/skills/date-parser-fix/SKILL.md\")`\n*   **Token 划分**：\n    *   **Identity Span（身份跨度）**：`date-parser-fix` 这几个 Token 被标记为 **Selection Tokens**。\n    *   **Call Span（调用跨度）**：整个 `read(...)` 调用被标记为 **Read Action**。\n    *   **Execution Tokens（执行 Token）**：读取技能后，Agent 生成的后续代码修复逻辑、其他工具调用等所有 Token。\n\n**3. 信用分配与掩码处理 (Credit Assignment \u0026 Masking)**\n这是 SkillGate 的核心创新，发生在训练更新阶段：\n\n*   **Task Channel（任务通道）处理**：\n    *   **目标**：优化执行能力。\n    *   **操作**：计算基于任务最终结果（Success/Fail）的 Group-normalised Advantage $A_{task}$。\n    *   **关键掩码**：**完全移除** `read` 工具调用的所有 Token（包括 wrapper 和 identity span）。这意味着，无论任务最终成功与否，$A_{task}$ **不会**更新 `date-parser-fix` 这几个选择 Token。只有后续的执行 Token 接收此梯度。\n    *   **直觉**：防止“执行失败”惩罚“正确的选择”。如果 Agent 选对了技能但代码写错了，Task Channel 只惩罚代码部分，不惩罚选择部分。\n\n*   **Selector Channel（选择器通道）处理**：\n    *   **目标**：优化选择能力。\n    *   **操作**：计算 Action-local Advantage $A_{sel}$。\n    *   **Utility 规则**：\n        *   如果轨迹中**仅读取了一次**技能，且该技能是 **Oracle**，则 Utility = 1。\n        *   如果读取了错误技能、多次读取或未读取，则 Utility = 0。\n        *   $A_{sel}$ 是在 Prompt Group（同一任务的多条轨迹）内对 Utility 进行中心化（Centering）得到的。\n    *   **关键掩码**：梯度**仅**作用于 **Identity Span**（即 `date-parser-fix`）。\n    *   **直觉**：只要选对了且只选了一次，就给予正向强化，不受后续执行结果影响。这解决了“信用饥饿”，因为选择 Token 获得了独立且明确的信号。\n\n**4. 优化更新 (Optimization)**\n*   **联合损失函数**：\n    $$ L = L_{task} + \\lambda L_{sel} + L_{KL} $$\n    *   $L_{task}$：基于 $A_{task}$ 和 Execution Tokens 的 GRPO 损失。\n    *   $L_{sel}$：基于 $A_{sel}$ 和 Selection Tokens 的 GRPO 损失。\n    *   $\\lambda$：平衡系数（实验中设为 0.20）。\n*   **权重归一化**：确保两个通道的总 Token 权重在 Batch 级别相等（$N_{task} = N_{sel} = N$），防止因选择 Token 数量少而导致梯度被稀释。\n\n**5. 输出 (Output)**\n*   **行为改变**：经过训练，Agent 在面对类似任务时，更倾向于**一次性**准确选择 Oracle Skill，减少了对 Misleading Skills 的试探性读取（Exposure 降低 2/3），且总读取次数减少。\n*   **性能提升**：在 9B 模型上，Trial Success 从 40.8% 提升至 53.2%。\n\n---\n\n### § 6 核心数学推导\n\nSkillGate 的核心数学贡献在于重新定义了 Policy Gradient 中的 Advantage 分配机制，特别是针对 **Selection Tokens** 的局部信用分配。以下是核心公式及其直觉解释：\n\n#### 1. 选择器优势函数 (Selector Advantage)\n\n$$ A_{sel}(a) = u(a) - \\frac{\\sum_{a' \\in A(G)} u(a')}{|A(G)|} $$\n\n*   **符号说明**：\n    *   $a$：单个 Read Action（读取动作）。\n    *   $u(a)$：动作效用函数。定义为：若轨迹 $\\tau_a$ 中**仅有一次**读取且为 Oracle Skill，则 $u(a)=1$，否则 $u(a)=0$。\n    *   $A(G)$：Prompt Group $G$ 中所有 Read Actions 的集合。\n    *   $|A(G)|$：Group 中 Read Actions 的总数。\n\n*   **Intuition（直觉）**：\n    *   **局部性 (Action-local)**：传统的 RL 使用整个轨迹的回报 $R(\\tau)$ 作为 Advantage，这会导致选择 Token 的梯度被数千个执行 Token 稀释（Credit Starvation）。SkillGate 将 Advantage 限制在单个动作 $a$ 上。\n    *   **中心化 (Centering)**：减去 Group 内的平均效用，使得 $\\sum A_{sel}(a) = 0$。这消除了对“是否应该读取技能”的整体偏差，只关注“**哪个**技能被选中”的相对优劣。\n    *   **无方差归一化**：公式中未除以标准差 $\\sigma$，因为动作数量少，除以标准差会放大噪声。\n\n#### 2. 任务优势函数 (Task Advantage)\n\n$$ A_{task}(\\tau) = \\frac{R(\\tau) - \\mu_G}{\\sigma_G + \\epsilon} $$\n\n*   **符号说明**：\n    *   $R(\\tau)$：轨迹 $\\tau$ 的最终任务得分（0 或 1）。\n    *   $\\mu_G, \\sigma_G$：Group $G$ 内所有轨迹得分的均值和标准差。\n    *   $\\epsilon$：平滑常数。\n\n*   **Intuition（直觉）**：\n    *   这是标准的 GRPO (Group Relative Policy Optimization) 优势估计。\n    *   **关键约束**：在计算 Loss 时，$A_{task}$ **仅**作用于 **Execution Tokens**（即排除 Read Call 的所有 Token）。\n    *   **直觉**：任务结果只反映执行质量，不反映选择质量。通过掩码隔离，防止执行失败错误地惩罚正确的选择。\n\n#### 3. 联合损失函数 (Joint Loss)\n\n$$ L(\\theta) = -\\mathbb{E}_{\\tau \\sim \\pi_{rollout}} \\left[ \\sum_{t \\in \\mathcal{T}_{exec}} w_t^{task} \\ell_{clip}(r_t, A_{task}) + \\lambda \\sum_{t \\in \\mathcal{T}_{sel}} w_t^{sel} \\ell_{clip}(r_t, A_{sel}) \\right] + \\beta L_{KL} $$\n\n*   **符号说明**：\n    *   $\\mathcal{T}_{exec}$：Execution Tokens 集合。\n    *   $\\mathcal{T}_{sel}$：Selection Tokens（Identity Spans）集合。\n    *   $w_t^{task}, w_t^{sel}$：Token 权重。SkillGate 强制 $\\sum w_t^{task} = \\sum w_t^{sel} = N$（Batch 总权重），确保两个通道的学习率相当。\n    *   $\\ell_{clip}$：PPO/GRPO 的裁剪损失函数。\n    *   $\\lambda$：Selector 通道的系数。\n\n*   **Intuition（直觉）**：\n    *   **互斥支持集 (Disjoint Support)**：$\\mathcal{T}_{exec} \\cap \\mathcal{T}_{sel} = \\emptyset$。这是 SkillGate 的理论基石，确保两个决策（选择 vs 执行）由独立的信号驱动，互不干扰。\n    *   **长度不变性 (Length-invariant)**：通过权重归一化，选择决策的梯度贡献不再随轨迹长度增加而稀释。无论轨迹多长，选择 Token 的总权重固定，解决了 **Share** 问题。\n    *   **符号正确性 (Correct Sign)**：$A_{sel}$ 仅取决于选择是否正确，与执行结果无关。解决了 **Sign** 问题（即正确选择因执行失败而被惩罚的问题）。\n\n---\n\n### § 7 实验设计与结论\n\n**提出了什么问题？**\n在长程 Agent 任务中，现有的 Outcome-rewarded RL 无法有效训练 **In-policy Skill Selection（策略内技能选择）**。作者诊断出根本原因是 **Selector Credit Starvation（选择器信用饥饿）**，表现为三个特征：\n1.  **Share（份额稀释）**：选择 Token 在总 Loss 中的占比随轨迹长度增加而急剧下降（从 ~0.14% 降至更低）。\n2.  **Sign（符号错误）**：近 40% 的正确选择因后续执行失败而收到负梯度（被惩罚）。\n3.  **Value（高价值）**：尽管信号微弱且错误，但正确选择技能对任务成功率的贡献高达 +11.2%。\n\n**设计了什么实验验证这个问题？**\n1.  **离线审计 (Offline Audit)**：\n    *   对已训练的 **SkillRL (outcome only)** 模型的 12,800 条轨迹进行回溯分析。\n    *   按轨迹长度分层，计算选择 Token 的 Loss 权重份额、优势函数符号分布（正/负）以及组内信噪比。\n    *   **目的**：量化验证 Credit Starvation 的三个特征及其随长度恶化的趋势。\n\n2.  **主要对比实验 (Main Results)**：\n    *   **基线**：Untrained Backbones, Frontier Models (API), Supervised Selection (BC, DPO), RL with Outcome Reward (SkillRL, Skill1)。\n    *   **方法**：SkillGate vs. SkillRL (outcome only)（控制变量：相同初始化、数据、步数、超参数，仅梯度分配不同）。\n    *   **指标**：Trial Success (%) 和 Read Behavior (Oracle/Misleading Exposure, Reads/Trial)。\n    *   **目的**：验证 SkillGate 是否能通过分离信用通道提升任务成功率和选择准确性。\n\n3.  **消融实验 (Ablation Study)**：\n    *   测试 5 种不同的信用放置策略：Nowhere (Baseline), Group-level regret, Trajectory bonus, Action credit (first oracle read), SkillGate (only read if oracle)。\n    *   **目的**：确定 SkillGate 设计中哪些组件（如 Single-read constraint, Identity-token targeting）是关键。\n\n4.  **外部选择器对比 (External Selector)**：\n    *   对比 Frozen SFT Executor + External Router (SFT-9B, Qwen-27B, Reranker) vs. SkillGate (In-policy)。\n    *   **目的**：验证 In-policy 训练是否优于外挂 Router，以及 SkillGate 是否达到了接近 Oracle-only 的上限。\n\n**问题的答案是什么？**\n1.  **诊断确认**：离线审计证实，Outcome-only RL 中，选择 Token 的梯度份额随长度稀释 7 倍，且长轨迹中正确选择被惩罚的概率超过 50%（Coin-flip line），而正确选择的价值始终很高。\n2.  **方法有效性**：SkillGate 在 5 个 Benchmark 上将 9B 模型的 Trial Success 从 40.8% 提升至 53.2%，显著优于 Outcome-only RL (47.0%) 和 Supervised Selection。\n3.  **行为改善**：SkillGate 将 Oracle 读取率提升至 83.9%，同时将 Misleading 技能暴露率降低至 21.8%（降低 2/3），且平均读取技能数更少（1.11 vs 1.88），证明其学会了**精准选择**而非**盲目多读**。\n4.  **设计关键**：消融实验表明，仅将信用放在 Identity Tokens 上（Action credit）不够，必须结合 **Single-read constraint**（仅当且仅当读取一次且为 Oracle 时给予正反馈）才能最大化性能。\n5.  **In-policy 优势**：SkillGate 的性能超过了外挂的大型 Router (Qwen-27B)，证明在策略内部直接训练选择能力比依赖外部路由更有效，且能更好地与执行能力协同。", "additional_insights": "### § 8 Take-aways\n\nSkillGate 揭示了长程 Agent 训练中存在的 **selector credit starvation** 结构性缺陷：在基于 Outcome Reward 的 RL 中，决定读取哪个 Skill 的少量 Token 因梯度稀释（Share 极低）和执行失败导致的错误符号（Sign 错误）而无法有效学习，尽管该决策对任务成功至关重要（Value 高）。为解决此问题，SkillGate 将策略梯度更新中的 Token 支持集划分为两个互斥的信用通道：**Task Channel** 仅对执行 Token 广播序列级优势（Advantage），并完全剔除 Read Call 以避免结果反馈污染选择信号；**Selector Channel** 仅对 Skill 命名 Token 应用动作局部优势（Action-local Advantage），该优势仅当轨迹中仅读取且正确读取 Oracle Skill 时为正，否则为零或负。这种设计通过 **length-invariant reweighting** 确保选择决策的权重不随轨迹长度稀释，并通过 **single-oracle utility** 强制模型进行精确的单次选择而非盲目多读。实验表明，在 9B 参数规模下，SkillGate 将任务成功率从 40.8% 提升至 53.2%，显著优于同等预算下的 Outcome-only RL 及监督学习基线，同时减少了 2/3 的误导性 Skill 暴露并降低了整体 Token 消耗。\n\n### § 9 最脆弱的假设\n\nSkillGate 核心贡献成立的最关键假设是：**存在一个明确且唯一的“Oracle Skill”（金标准技能），且该技能在训练阶段是已知并可用于构建 Selector Channel 的奖励信号。**\n\n如果这一假设不成立，即在实际部署或开放域场景中，不存在预先定义的、针对每个任务的唯一正确 Skill，或者无法在训练时获知哪个 Skill 是“正确”的，那么 SkillGate 的 **Selector Channel** 将无法计算其核心的 **action-local advantage**。该方法的奖励函数 $U(a)$ 严格依赖于判断读取的动作是否指向了预定义的 Oracle Skill（$s^\\star$）。若没有这个 Ground Truth，Selector Channel 将退化为无信号状态（$A_{sel} \\equiv 0$），导致选择能力无法通过该通道进行优化，整个方法将退化为仅对执行部分进行优化的普通 RL，从而失去其解决“选择难”问题的核心优势。\n\n论文提供的证据主要局限于受控的实验环境：训练数据中的 491 个任务均配有专门编写并验证过的 Oracle Skill，且评估时的 Oracle 与训练时 disjoint 但依然来自已知库。论文并未提供在完全开放域、无预定义 Oracle 或需从海量未标注 Skill 库中自动发现正确 Skill 的场景下的有效性证据。虽然论文提到“training tasks whose correct skill is known”是局限性之一，但这恰恰证实了该方法对“已知正确 Skill”这一假设的强依赖。若假设失效，核心贡献（即通过分离信用通道解决选择问题）将直接失效，因为选择信号本身无法生成。\n\n### § 10 最小复现实验\n\n**目标：** 验证 **selector credit starvation** 现象的存在性，即证明在 Outcome-only RL 中，Skill 选择 Token 的梯度信号确实存在稀释和符号错误，且与轨迹长度相关。\n\n**数据：** 使用论文提供的训练轨迹日志（或复现一个简化的 Agent 环境，如使用 10-20 个简单任务，每个任务有 1 个正确 Skill 和 3 个干扰 Skill，运行 100 步 GRPO 训练）。\n\n**实现：**\n1.  复现标准的 Outcome-only RL 训练流程（如 SkillRL baseline），记录每一步的 Rollout 轨迹。\n2.  在训练结束后，离线审计这些轨迹：\n    *   定位每个轨迹中 Skill 选择的 Token Span（Identity Span）。\n    *   计算该 Span 在总 Loss 中的权重占比（Share）。\n    *   计算该 Span 继承的 Advantage 符号（Sign），并与该选择是否正确（是否读取了 Oracle）进行比对，统计“正确选择但获得负 Advantage”的比例。\n    *   按轨迹长度（Token 数）分桶，观察 Share 和 Sign Error Rate 随长度的变化趋势。\n\n**测量：**\n*   **Share：** Skill 选择 Token 的 Loss 权重占比随轨迹长度的衰减曲线。\n*   **Sign Error Rate：** 正确选择 Skill 的轨迹中，其选择 Token 获得负 Advantage 的比例随轨迹长度的变化。\n*   **Value：** 对比正确选择与错误选择在同一 Prompt Group 中的任务成功率差异。\n\n**结果判定：**\n*   **支持 Claim：** 如果观察到 Share 随轨迹长度单调递减（如从 0.5% 降至 0.05%），且 Sign Error Rate 随长度增加而上升（如在长轨迹中超过 50% 的正确选择被惩罚），同时正确选择带来的成功率增益（Value）保持显著（如 +10% 以上），则复现了 **selector credit starvation**，支持了 SkillGate 提出的动机。\n*   **反驳 Claim：** 如果 Share 不随长度显著变化，或 Sign Error Rate 始终很低（即正确选择几乎总是获得正 Advantage），则说明在特定设置下 Credit Starvation 不严重，SkillGate 的必要性存疑。\n\n此实验无需复现 SkillGate 的双通道训练，仅需审计标准 RL 的训练日志，即可验证其核心问题诊断，耗时短且计算成本低。", "research_value": "### § 11 最强反例设计\n\n若要挑战 SkillGate 的有效性，最有力的攻击并非质疑其数学推导，而是攻击其核心假设在**动态环境（Dynamic Environments）**下的脆弱性，即“Oracle Skill 的静态正确性”假设。SkillGate 的 Selector Channel 依赖于一个二元效用函数 $u(a)$，该函数仅在轨迹中**仅读取一次**且为**预定义 Oracle** 时赋予正奖励。这一设计隐含了一个强假设：对于任何给定任务，存在一个唯一的、静态的、且足以解决该任务的最佳技能（Oracle Skill），且该技能在训练时是已知的 Ground Truth。\n\n**反例场景：多技能协同与技能演化（Multi-Skill Synergy \u0026 Skill Evolution）**\n在真实的长视界 Agent 任务中，许多复杂问题无法通过单一技能解决，而是需要**Skill Composition（技能组合）**或**Sequential Skill Retrieval（顺序技能检索）**。例如，一个“数据分析”任务可能需要先读取 `data-cleaning` 技能，再读取 `visualization` 技能。\n1.  **理论攻击**：SkillGate 的 $u(a)$ 规则惩罚“多次读取”。如果 Agent 正确读取了第一个必要技能，但随后发现需要第二个技能，SkillGate 会将整个轨迹的 Selector Advantage 设为负（或零，取决于具体实现中的“仅一次”约束），从而惩罚了正确的探索行为。这会导致模型学习到“只读一个技能”的捷径（Shortcut Learning），而非真正的判别能力。在需要多步推理的任务中，SkillGate 可能会迫使 Agent 选择一个“大而全”但效率低下的通用技能，或者完全放弃读取，导致性能上限被人为压低。\n2.  **实验攻击**：设计一个 Benchmark，其中 50% 的任务需要读取两个互补的技能才能成功（例如，先读取 `auth-module` 再读取 `api-client`），而另外 50% 只需要一个。在 SkillGate 训练下，模型在单技能任务上表现优异，但在双技能任务上表现显著低于基线（如 Outcome-only RL），因为 Outcome-only RL 允许通过试错发现多技能路径，而 SkillGate 的稀疏且严格的奖励信号抑制了这种探索。这将证明 SkillGate 的改进仅局限于“单技能检索”这一子集，而非通用的 In-Policy Skill Selection。\n\n**替代解释：奖励黑客（Reward Hacking）**\n另一个攻击角度是，SkillGate 的提升可能并非源于更好的“选择能力”，而是源于**行为约束（Behavioral Constraint）**。通过强制“仅读取一次”，SkillGate 实际上减少了 Agent 的搜索空间，降低了因读取错误技能导致的上下文污染（Context Pollution）。Outcome-only RL 性能较差可能是因为 Agent 读取了过多无关技能，导致 Context Window 拥挤或注意力分散，而非选择能力本身不足。如果引入一个基线，该基线在 Outcome-only RL 的基础上仅增加“限制最大读取次数为 1”的约束（而不改变信用分配），其性能可能接近甚至超过 SkillGate。这将表明，SkillGate 的核心贡献是“限制探索”而非“优化选择信号”，其复杂的 Credit Partitioning 机制是多余的。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“静态 Oracle 匹配”到“动态技能合成”的信用分配（Credit Assignment for Dynamic Skill Composition）**\n\n**（a）驱动局限与未满足需求**\nSkillGate 的核心局限在于其假设技能选择是一个**离散的单点决策（Discrete Point Decision）**，且存在唯一的 Ground Truth Oracle。然而，在开放域 Agent 应用中，技能往往是模块化的，任务解决依赖于**技能图（Skill Graph）**中的路径搜索。现有的 In-Policy 训练方法无法处理“部分正确”的技能序列（例如，读取了正确的第一步技能，但第二步错误）。我们需要一种新的训练范式，能够支持**Sequential Skill Selection（顺序技能选择）**，并为技能序列中的每一步提供细粒度的、与执行结果解耦的信用信号，同时允许模型在运行时动态构建技能组合。\n\n**（b）借鉴相邻领域的方法**\n借鉴**Hierarchical Reinforcement Learning (HRL)** 中的 **Option-Critic Architecture** 和 **Program Synthesis** 中的 **Execution Tracing**。\n1.  **Option-Critic**：将技能视为“Option”，引入一个高层策略（Manager）负责技能选择，低层策略（Worker）负责执行。但不同于传统 HRL，我们关注的是如何训练 Manager 的信用分配。\n2.  **Execution Tracing**：借鉴编译器或调试器中的**因果追踪（Causal Tracing）**技术。在执行阶段，记录每个技能调用对最终输出的贡献度（例如，通过梯度归因或干预分析），从而为技能序列中的每个节点分配“局部效用”，而非仅依赖最终的二元成功/失败。\n\n**（c）第一个实验设计**\n**方法名称：SkillChain-RL（基于技能链的强化学习）**\n\n1.  **环境构建**：创建一个需要多步技能调用的合成任务环境（如“Web Scraping \u0026 Data Processing”）。任务要求 Agent 依次调用 `fetch-page` -\u003E `parse-html` -\u003E `clean-data` -\u003E `save-csv`。每个步骤都有多个候选技能（包括正确、误导性、无关技能）。\n2.  **信用分配机制**：\n    *   不再使用单一的 $A_{sel}$，而是为每个技能调用步骤 $t$ 计算 **Step-Local Advantage** $A_{sel}^{(t)}$。\n    *   引入**中间验证器（Intermediate Verifier）**：在每个技能执行后，使用一个轻量级的判别模型（或基于规则的检查器）评估当前状态是否“进展正确”（例如，`parse-html` 后是否成功提取了结构化数据）。\n    *   $A_{sel}^{(t)}$ 基于该中间验证器的反馈，而非最终任务结果。这解决了长程任务中信用稀释和符号错误的问题，同时允许多步选择。\n3.  **对比实验**：\n    *   **Baseline 1**：SkillGate（强制单步选择，无法处理多步）。\n    *   **Baseline 2**：Outcome-only RL（信用稀释严重）。\n    *   **Proposed**：SkillChain-RL。\n4.  **预期结果**：SkillChain-RL 在多步任务上的成功率显著高于 SkillGate（后者因强制单步而失败）和 Outcome-only RL（后者因信用饥饿而收敛缓慢）。同时，分析显示 SkillChain-RL 能够学习到正确的技能依赖关系（例如，先 fetch 再 parse），而不仅仅是匹配单个 Oracle。\n\n**与已有工作的区别**：\nSkillGate 关注的是**单点选择**的信用隔离，假设选择是静态的。SkillChain-RL 关注的是**序列选择**的信用分解，假设选择是动态的、组合的。它不依赖预定义的单一 Oracle，而是通过中间验证器构建动态的信用信号，从而扩展到更复杂的、需要技能合成的 Agent 任务。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Qingyao Li\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Wenxiang Jiao\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"�\"\n      ]\n    },\n    {\n      \"name\": \"Shuai Shao\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Kangning Zhang\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Yuan Lu\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"�\"\n      ]\n    },\n    {\n      \"name\": \"Yi Guo\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Weiwen Liu\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"�\"\n      ]\n    },\n    {\n      \"name\": \"Weinan Zhang\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"�\"\n      ]\n    },\n    {\n      \"name\": \"Yong Yu\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"�\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Shanghai Jiao Tong University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Xiaohongshu Inc.\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"†\",\n      \"text\": \"Work done during internship at Xiaohongshu Inc.\"\n    },\n    {\n      \"marker\": \"�\",\n      \"text\": \"Corresponding authors\"\n    }\n  ]\n}\n```", "summary_translation": "Agent 框架越来越多地将程序性知识封装为 skills：agent 按需读取的 instruction 文件，而公共库现在已包含数千个此类文件。因此，读取哪个 skill 已成为 policy 在 episode 中途自行做出的决策，然而目前没有任何现有信号对其进行训练。我们证明，默认的补救措施——即在候选 slate 上进行基于 outcome reward 的 RL——无法教会这一能力，原因在于我们识别并命名为 selector credit starvation 的结构性问题：在广播式、序列级 advantage 下，命名所选 skill 的少数 tokens 在 loss 中所占份额趋于消失，且随着轨迹变长，它们继承的 credit 符号错误率越来越高。只要后续执行失败，即使该选择本身是轨迹中最有价值的决策之一，正确的选择也会受到惩罚。对已完成运行的训练工件进行审计证实了这三种特性，且每种特性均随 horizon 单调恶化。SkillGate 通过设计消除了这一失败：它将 token 支持集划分为两个不相交的 credit 通道，outcome credit 仅到达 execution tokens，而独立的 action-local advantage 仅到达 skill-naming tokens，且仅当轨迹中的单次读取为正确选择时才为正。在五个 agentic benchmarks 上使用 16 个候选 slate 的实验中，SkillGate 将 9B policy 的 trial success 从 40.8% 提升至 53.2%，显著优于同等预算下仅使用 outcome reward 的效果，同时将暴露于误导性候选项的比例减少了三分之二，并减少了 skill 的读取次数。"}, {"title": "Competence, Not Accuracy: A Diagnostic for Reference-Free Judge Gates in Skill Optimization", "arxiv_id": "2608.18719", "authors": "Chenle Chen, Yangbo Wei, Chao Yao, Shaoqiang Lu, Junhong Qian, Chen Wu, Lei He", "summary": "Text-space skill optimization adapts a frozen agent by evolving a natural-language skill document, accepting each candidate through a validation gate. Existing gates rely on verifiable rewards, confining these methods to tasks with an automatic verifier. Replacing the verifier with an LLM-judge gate would lift that restriction, but whether such a gate carries usable signal is untested. We ask a prior question: can we tell, before placing a judge in the loop, whether its scores separate correct from incorrect answers at all? We formalize a reference-free judge as a latent solver -- its verdict rests on agreement with whatever it would itself conclude, so its capacity to evaluate is bounded by its capacity to solve. The model yields a closed-form bound on discriminability (ROC-AUC) in the judge's competence $c$ and answer-space size $k$, a necessary condition $c \u003E 1/k$, and the result that the marginal AUC is confounded by item difficulty while a within-question estimator is not. A non-intervening probe records judge scores on genuine optimization runs without altering any decision. We find discriminability at chance where competence sits near the floor and usable above it; that a judge's benchmark accuracy overstates the competence that matters; and, in a closed-loop study, that the screen predicts which kind of gating error occurs. The result is a cheap pre-deployment diagnostic for judge gates.", "category": "cs.AI", "cluster": "Tool Use, Skill Selection \u0026 Planning", "tags": ["cs.AI"], "filter_reason": "该论文符合“自我演化 (Self-Evolving)”和“构建/改进 LLM 智能体”的研究范围。\n\n1.  核心对象与机制匹配：论文明确研究的是“Text-space skill optimization”（文本空间技能优化），即通过演化自然语言技能文档（natural-language skill document）来适应冻结的智能体（frozen agent）。这属于典型的 Self-Evolving 机制，即智能体通过迭代优化其内部表示（技能/提示/记忆）来改进性能，而非重新训练模型权重。\n2.  解决智能体演化的关键瓶颈：论文的核心贡献是提出了一种针对“LLM-judge gate”（LLM裁判门控）的诊断方法。在自我演化或在线学习（Online Adaptation）的智能体系统中，如何有效评估候选技能或行为以决定其是否被保留（validation gate）是一个核心问题。现有方法依赖自动验证器（verifier），限制了适用范围；而引入 LLM 作为裁判是扩展智能体演化能力的关键方向。该论文通过理论分析和实证研究，解决了在缺乏自动验证器的情况下，如何判断 LLM 裁判是否具备有效指导智能体演化的能力（discriminability）。\n3.  符合保留标准：根据筛选标准，“如果论文的核心机制是 self-evolving / self-improving ... 即使对象是 ... 模型训练，也应优先保留”。此外，该论文直接服务于“构建、改进 ... LLM 智能体”的目标，特别是为智能体的技能获取（Skill Acquisition）和自我完善（Self-Improvement）提供了关键的评估基础设施（diagnostic for judge gates）。它不是单纯的基础推理优化，而是专门针对 Agentic 演化循环中的反馈机制进行优化。\n\n因此，尽管论文涉及理论推导和诊断工具，但其应用场景和核心贡献紧密围绕 LLM 智能体的自我演化机制，属于强相关论文。", "intro_logic": "### § 1 研究问题与重要性\n\n本文核心解决的研究问题是：在 **Text-space skill optimization**（文本空间技能优化）中，当缺乏自动验证器（verifier）时，如何在使用 **LLM-judge gate**（大语言模型裁判门控）之前，诊断其评分信号是否具备区分正确答案与错误答案的能力（即 **discriminability**）。具体而言，作者旨在回答“裁判门控何时能替代验证器门控，何时会失效”这一前置问题，并建立裁判的 **competence**（能力）与其评分 **discriminability**（区分度，以 ROC-AUC 衡量）之间的理论界限。\n\n这一问题的重要性在于，现有的技能优化方法（如 SkillOpt）严重依赖 **verifiable rewards**（可验证奖励，如精确匹配或代码执行结果），这限制了其应用范围仅限于具有客观标准答案的任务。为了将此类优化范式扩展至开放域生成任务（如写作、对话、设计推理），必须引入 **reference-free judge**（无参考裁判）作为门控信号。然而，LLM 裁判已知存在偏见且易被博弈（gameable），若直接将其接入优化循环，可能引发 **reward hacking**（奖励黑客攻击）或导致优化方向偏离。因此，在部署前缺乏一种低成本、非侵入式的诊断工具来评估裁判信号的可靠性，是一个关键的安全与效能瓶颈。\n\n解决该问题的价值体现在三个方面：首先，理论上，作者将无参考裁判建模为 **latent solver**（潜在求解器），推导出区分度的闭式上界，证明了裁判能力必须高于随机猜测底线（$c \u003E 1/k$）是产生有效区分信号的必要条件，并揭示了边际 AUC 受题目难度混淆（difficulty confounding）的影响，提出了 **within-question AUC** 作为更稳健的估计量。其次，方法上，提出了一种 **non-intervening probe**（非侵入式探针），在不改变优化动态的前提下记录裁判评分，实现了部署前的安全审计。最后，实证上，该诊断工具能预测门控错误的类型：未能通过筛查的裁判会导致有害的 **false-accept**（假接受，即引入退化），而通过筛查的裁判虽可能保守（**false-reject**），但不会引入有害更新。这为在缺乏自动验证器的场景下安全使用 LLM 裁判提供了可操作的预部署筛选标准。\n\n### § 2 前人工作与不足\n\n该问题在现有文献中并未被直接解决，主要因为相关研究要么局限于可验证任务，要么假设裁判信号天然可用，缺乏对裁判信号有效性的前置诊断机制。\n\n最相关的 **prior methods** 包括基于验证器的技能优化系统（如 **SkillOpt** [Yang et al., 2026], **EvoSkill** [Alzubi et al., 2026]）以及基于 LLM 裁判的强化学习后训练方法（如 **RULER** [Corbitt et al., 2025]）。\n\n**SkillOpt** 等技能优化系统通过进化自然语言技能文档来适应新领域，其核心机制是 **validation-gated updates**（验证门控更新）。这些系统已经能够高效地在冻结权重的情况下优化代理行为，但其关键假设是存在一个 **verifiable signal**（可验证信号，如精确匹配或程序化评分器）。这一假设限制了其应用范围，使其无法处理没有客观标准答案的开放域任务。虽然这些系统展示了技能进化的有效性，但它们没有探讨当验证器缺失时，用 LLM 裁判替代是否可行，也没有提供评估裁判信号质量的工具。\n\n**RULER** 等基于 LLM 裁判的优化方法在 **weight space**（权重空间）的强化学习中，利用 LLM 裁判提供偏好信号以扩展优化范围。这些工作已经证明了在缺乏可验证奖励时，LLM 裁判可以提供学习信号。然而，它们存在两个主要不足：第一，它们操作于权重空间，而本文关注的是 **text-space skill optimization**，其中优化对象是持久化的文本文档，且权重冻结，两者的优化动态和信号需求不同；第二，也是更关键的，这些工作通常假设 LLM 裁判提供的信号是“可用”的，并未深入刻画在什么条件下这一假设成立。它们缺乏对裁判 **competence**（能力）与 **discriminability**（区分度）之间关系的理论分析，也未提供在部署前诊断裁判信号是否可靠的方法。\n\n此外，现有的 LLM 裁判可靠性研究（如 [Zheng et al., 2023]）主要关注裁判的系统性偏见（如位置偏见、长度偏见）和可博弈性，但缺乏任务依赖的视角。本文指出，裁判评估答案的能力受限于其求解答案的能力（**judge-as-latent-solver** 模型），这一界限而非通用偏见，才是解释裁判门控在特定任务（如数学 vs. 事实问答）上失效的关键。现有工作未考虑这一 **solve/grade context gap**（求解/评分上下文差距）以及基准测试中的 **censoring convention**（审查惯例，如仅统计收敛样本）对能力估计的乐观偏差，导致直接引用基准准确率作为裁判能力的代理指标是不准确的。因此，缺乏一种能够剥离难度混淆、基准污染和评分偏差，从而准确估计裁判在特定任务上真实区分能力的诊断框架，是现有研究的主要缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Text-space skill optimization 领域，现有的优化器（如 SkillOpt）依赖于一个核心假设：存在一个可验证的奖励信号（verifiable reward），例如精确匹配或代码执行结果，作为 validation gate 来决定是否接受新的 skill document。然而，这一假设将应用范围限制在了具有客观标准答案的任务上，无法扩展到写作、对话等 open-ended generation 场景。为了突破这一限制，一个自然的想法是用 LLM-judge 替代传统的 verifier，利用其评分作为 gate 信号。\n\n然而，直接将 LLM-judge 引入优化循环存在显著风险。已知 LLM judges 存在系统性偏差（bias）且容易被 gameable，如果在优化循环中直接使用，可能会引发 reward hacking，导致模型退化。因此，在部署之前，必须回答一个前置问题：在特定任务上，该 judge 的评分是否真的具有区分正确与错误答案的能力（discriminability）？\n\n现有的评估方法通常依赖 benchmark accuracy，但这往往高估了模型在 grading context 下的真实能力，因为 benchmark 可能受到数据污染（contamination）或评分惯例（如 censoring non-convergent episodes）的影响。此外，传统的 AUC 计算可能受到题目难度（item difficulty）的混淆，导致虚假的高区分度。\n\n基于此，作者提出将 reference-free judge 建模为 latent solver：由于没有 gold answer 作为参考，judge 必须通过内部重新求解（implicit re-solving）来评估候选答案。这意味着 judge 的评估能力受限于其解题能力（competence）。由此推导出一个理论界限：只有当 judge 的 competence 高于随机猜测的底线（chance floor, $1/k$）时，其评分才可能具有区分度。基于这一理论洞察，作者设计了一种 non-intervening probe，在不干扰优化过程的前提下，测量 judge 在真实优化轨迹上的 discriminability，并开发了一套去污染、去混淆的 competence 评估协议，从而在部署前筛选出可靠的 judge gate。\n\n### § 4 核心 Intuition\n\nReference-free judge 在没有标准答案的情况下，本质上是通过“内部重新求解”来评估候选答案，因此其评估能力（discriminability）严格受限于其自身的解题能力（competence）。如果 judge 的解题能力仅略高于随机猜测（即接近 chance floor $1/k$），其评分信号将退化为噪声，无法有效区分正确与错误答案。因此，在部署 judge gate 之前，必须通过去污染和去混淆的方法准确测量其真实 competence，确保其高于随机底线，否则优化过程将因噪声信号而失效甚至退化。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出了一种**非干预式探针（Non-Intervening Probe）**方法，用于在部署 LLM Judge 作为 Skill Optimization 的验证门控（Validation Gate）之前，诊断其是否具备区分正确与错误答案的能力（Discriminability）。该方法的核心在于不改变现有的优化流程，而是并行记录 Judge 的评分，从而在真实分布下评估其信号质量。\n\n以下是结合一个具体场景（例如：优化一个用于回答研究生级科学问题 GPQA 的 Agent Skill）的完整 Pipeline 说明：\n\n**1. 背景与输入设置**\n*   **场景**：使用 SkillOpt 优化器，目标模型为 Haiku，候选 Skill 文档正在通过进化算法迭代。\n*   **输入**：\n    *   **Question ($q$)**：一个具体的科学问题。\n    *   **Candidate Answer ($a$)**：由当前候选 Skill 生成的答案。\n    *   **Gold Answer ($a^*$)**：标准答案（仅用于离线评估，Judge 不可见）。\n    *   **Verifier Label ($y$)**：由传统验证器给出的二元标签（$y=1$ 表示正确，$y=0$ 表示错误）。\n    *   **Judge Model**：例如 Claude Sonnet，作为待评估的参考自由（Reference-Free）裁判。\n\n**2. 非干预式探针执行（Non-Intervening Probe Execution）**\n*   **并行评分**：在优化器运行过程中，对于每一个生成的候选答案 $a$，系统不仅计算传统的可验证奖励（如精确匹配），还同时调用 Judge 模型对 $(q, a)$ 进行评分，得到分数 $s$。\n*   **关键约束**：Judge 的分数 $s$ **不参与**任何接受/拒绝（Accept/Reject）决策。优化器依然仅依据传统验证器的信号来更新 Skill。这确保了收集到的数据分布 $(s_i, y_i)$ 是由验证器门控诱导的真实分布，而非被 Judge 的选择压力扭曲后的分布。\n*   **数据收集**：记录每个 Episode 的三元组 $(s_i, y_i, q_i)$，形成数据集 $D$。\n\n**3. 离线诊断与指标计算（Offline Diagnostics）**\n*   **计算判别力（Discriminability）**：\n    *   **Marginal AUC**：计算所有正样本（$y=1$）和负样本（$y=0$）之间的 Mann-Whitney 统计量，即 Judge 分数区分正确与错误答案的概率。\n    *   **Within-Question AUC ($AUC_w$)**：为了解决题目难度（Item Difficulty）带来的混淆（Confounding），仅在**同一道题目**内部配对正负样本计算 AUC。这消除了因简单题多、难题少导致的虚假高 AUC。\n*   **计算能力（Competence）**：\n    *   **Closed-Book Self-Solve Accuracy ($\\hat{c}_{solve}$)**：让 Judge 在不看候选答案的情况下独立解题，计算其准确率。这是 Judge 在评分上下文中的真实能力下限。\n    *   **去污染处理**：使用领域匹配但曝光度低的代理基准（Proxy Benchmark $B'$）或基于 AUC 的反转估计（Inversion Estimate $\\hat{c}_{AUC}$）来校正因记忆效应（Memorization）导致的基准分数虚高。\n\n**4. 部署决策（Deployment Screen）**\n*   **阈值判断**：根据理论推导，Judge 的判别力有上限，且必须满足必要条件 $c \u003E 1/k$（$k$ 为答案空间大小，如多选题 $k=4$）。\n*   **输出结论**：\n    *   如果 $\\hat{c}_{solve}$ 接近或低于 $1/k$，则预测 $AUC \\approx 0.5$（随机猜测），**拒绝部署**该 Judge 作为门控。\n    *   如果 $\\hat{c}_{solve}$ 显著高于 $1/k$ 且 $AUC_w$ 显著大于 0.5，则**允许部署**，但仍需监控其是否会导致过度拒绝（Over-rejection）。\n\n---\n\n### § 6 核心数学推导\n\n这篇论文的核心贡献在于建立了一个将 Judge 的**能力（Competence, $c$）**与其**判别力（Discriminability, AUC）**联系起来的封闭形式（Closed-Form）理论模型。\n\n**1. 理论背景与直觉**\n*   **核心假设：Judge 作为潜在求解器（Judge-as-Latent-Solver）**。\n    *   直觉：在没有标准答案（Reference-Free）的情况下，Judge 要判断一个答案 $a$ 是否正确，本质上必须先在内部“重新解决”这个问题，得出它认为的正确答案 $\\hat{a}$。\n    *   如果 Judge 自己解不出题（能力低），它就无法区分候选答案是对是错，因为它的判断标准（$\\hat{a}$）本身就是随机的。\n*   **模型假设**：\n    *   (A1) **隐式重解**：Judge 生成内部解 $\\hat{a}$，其正确的概率为 $c$（Competence）。\n    *   (A2) **误差分散**：如果 Judge 解错了，它的错误答案均匀分布在其余 $k-1$ 个错误选项中。\n    *   (A3) **一致性评分**：Judge 的评分 $s$ 仅取决于候选答案 $a$ 是否等于其内部解 $\\hat{a}$（即 $s = \\mathbb{I}[a = \\hat{a}]$）。\n\n**2. 核心公式推导：Proposition 1**\n*   **目标**：推导 ROC-AUC 与 $c$ 和 $k$ 的关系。\n*   **定义**：\n    *   $TPR$ (True Positive Rate)：当答案正确 ($y=1, a=a^*$) 时，Judge 给出高分的概率。\n        *   直觉：只有当 Judge 内部解 $\\hat{a}$ 也等于 $a^*$ 时，它才会给高分。\n        *   公式：$TPR = P(\\hat{a} = a^*) = c$。\n    *   $FPR$ (False Positive Rate)：当答案错误 ($y=0, a \\neq a^*$) 时，Judge 错误地给出高分的概率。\n        *   直觉：Judge 给高分意味着 $\\hat{a} = a$。由于 $a$ 是某个特定的错误答案，而 Judge 的错误解均匀分布在 $k-1$ 个错误选项中，且 Judge 解错的概率是 $1-c$。\n        *   公式：$FPR = P(\\hat{a} = a | a \\neq a^*) = \\frac{1-c}{k-1}$。\n*   **AUC 计算**：\n    *   对于二元评分，$AUC = \\frac{1}{2}(1 + TPR - FPR)$。\n    *   代入得：\n        $$ AUC = \\frac{1}{2} \\left( 1 + c - \\frac{1-c}{k-1} \\right) = \\frac{1}{2} + \\frac{ck - 1}{2(k-1)} $$\n*   **Intuition**：\n    *   公式中的关键项是 $ck - 1$。\n    *   如果 $ck \u003E 1$（即 $c \u003E 1/k$），AUC \u003E 0.5，Judge 有判别力。\n    *   如果 $ck \u003C 1$（即 $c \u003C 1/k$），AUC \u003C 0.5，Judge 的评分甚至与真实情况负相关（有害）。\n    *   如果 $c = 1/k$，AUC = 0.5，Judge 相当于随机猜测。\n\n**3. 重要推论与修正**\n*   **Corollary 1 (Chance-Floor Threshold)**：\n    *   必要条件：$c \u003E 1/k$。这是 Judge 能发挥作用的最低门槛。例如，四选一选择题 ($k=4$)，Judge 的准确率必须超过 25% 才有用。\n*   **Remark 2 (Difficulty Confounding)**：\n    *   问题：如果简单题多，Judge 在简单题上表现好，整体 AUC 会被虚高。\n    *   解决：引入 **Within-Question AUC ($AUC_w$)**。\n    *   直觉：只在同一道题的正负样本间比较，消除了题目难度分布不均的影响。$AUC_w$ 对难度异质性是不变的（Invariant）。\n*   **Corollary 3 (AUC-Inversion)**：\n    *   可以通过观测到的 AUC 反推 Judge 的有效能力 $c$：\n        $$ \\hat{c}_{AUC} = \\frac{(k-1)(2 \\cdot AUC - 1) + 1}{k} $$\n    *   这提供了一个不依赖于解题路径（避免记忆污染）的能力估计器。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n在 Text-Space Skill Optimization 中，如果将传统的可验证奖励（Verifiable Reward）替换为 LLM Judge 评分，Judge 的评分信号是否可靠？具体来说，Judge 的评分能否有效区分正确和错误的答案（Discriminability）？这种判别力与 Judge 自身的解题能力（Competence）有何关系？现有的基准测试准确率（Benchmark Accuracy）是否能真实反映其作为 Judge 的能力？\n\n**2. 设计了什么实验验证这个问题？**\n*   **判别力评估实验**：\n    *   使用 SkillOpt 在三个不同难度的任务上运行：研究级数学（Research Math, MCQ）、事实性问答（Factual QA, Free-text）、研究生科学（GPQA-Diamond, MCQ）。\n    *   部署 **Non-Intervening Probe**，记录 Judge（Claude Sonnet 等）的评分和真实标签。\n    *   计算 **Marginal AUC** 和 **Within-Question AUC ($AUC_w$)**，以分离题目难度带来的混淆。\n*   **理论边界验证实验**：\n    *   独立测量 Judge 的 **Closed-Book Self-Solve Accuracy ($\\hat{c}_{solve}$)**。\n    *   将观测到的 $AUC_w$ 与根据 Proposition 1 预测的理论上限 $U(c)$ 进行对比，验证 $AUC \\le U(c)$ 是否成立。\n*   **能力差距分解实验**：\n    *   对比 Judge 的公开基准准确率（Headline Accuracy）与去污染后的真实能力（通过 Proxy Benchmark 和 AUC Inversion 估计）。\n    *   分解差距来源：审查偏差（Censoring/Survivorship Bias）、基准曝光（Exposure/Memorization）、解题/评分上下文差异（Solve/Grade Gap）。\n*   **闭环安全性实验（Closed-Loop Study）**：\n    *   小规模测试：让通过诊断的 Judge 和未通过诊断的 Judge 实际控制 Skill 的接受/拒绝。\n    *   对比最终 Skill 的性能以及错误类型（False Accept vs. False Reject）。\n\n**3. 问题的答案是什么？**\n*   **判别力高度依赖任务与能力**：Judge 的判别力在不同任务间差异巨大。在数学任务上，由于 Judge 能力接近随机猜测底线（$1/k$），判别力崩溃至随机水平（AUC $\\approx$ 0.5）；在事实性 QA 上，判别力可用（AUC $\\approx$ 0.7-0.8）。\n*   **理论边界成立**：观测到的判别力始终低于或等于由 Judge 能力预测的理论上限。当能力接近底线时，判别力确实如预测般崩溃。\n*   **基准准确率严重高估真实能力**：Judge 的公开基准准确率远高于其作为 Judge 时的真实能力。主要原因包括：\n    *   **审查偏差**：忽略未收敛的答案会人为提高准确率（幸存者偏差）。\n    *   **记忆污染**：对基准数据的过度曝光。\n    *   **上下文差异**：独立解题比基于候选答案评分更难。\n*   **诊断可预测闭环风险**：\n    *   **未通过诊断的 Judge**：在闭环中会导致有害的接受（Harmful Acceptance），即接受退化的 Skill，性能甚至不如随机门控。\n    *   **通过诊断的 Judge**：虽然可能因保守而导致过度拒绝（Over-rejection），但不会引入有害的接受，保证了优化的安全性。\n*   **结论**：在部署 LLM Judge 作为门控前，必须使用非干预式探针评估其去污染后的真实能力。只有当能力显著高于随机底线（$c \u003E 1/k$）时，Judge 才具备基本的判别力，否则应拒绝部署。", "additional_insights": "### § 8 Take-aways\n\n本文提出了一种针对 Text-space Skill Optimization 中 Reference-free Judge Gate 的预部署诊断方法，核心观点是 Judge 的判别能力（Discriminability）受限于其解题能力（Competence），而非其 Benchmark 上的表面准确率。理论推导表明，在无参考标准（Reference-free）且无外部证据的情况下，Judge 必须通过“隐式重解”（Implicit Re-solving）来评估答案，这导致其 ROC-AUC 存在一个由解题能力 $c$ 和答案空间大小 $k$ 决定的闭式上界，且 $c \u003E 1/k$ 是产生任何判别力的必要条件。实验发现，Judge 的 Benchmark 准确率往往因幸存者偏差（Censoring）、数据泄露（Exposure）以及解题/评分上下文差异（Solve/Grade Gap）而被高估，真实的解题能力远低于 headline accuracy。通过非干预探针（Non-intervening Probe）在真实优化过程中记录 Judge 评分，研究发现当 Judge 的真实能力接近随机猜测底线（Chance Floor, $1/k$）时，其判别力会崩溃至随机水平，且这种崩溃在不同模型家族中具有普适性。在闭环实验中，未能通过该诊断（即能力低于底线）的 Judge 会导致有害的接受错误（False Acceptance），甚至表现比随机门控更差，而通过诊断的 Judge 虽可能过度拒绝（Over-rejection），但不会引入回归错误。因此，该方法提供了一个低成本、无需修改优化逻辑的筛选机制，用于在部署前识别出无法提供有效信号的 Judge。\n\n### § 9 最脆弱的假设\n\n该方法最脆弱且代价最大的假设是 **(A1) Implicit Re-solving**，即假设 Reference-free Judge 在没有金标准答案的情况下，其评分完全依赖于其内部生成的隐式解 $\\hat{a}$ 与候选答案 $a$ 的一致性（$s = \\mathbb{I}[a = \\hat{a}]$）。如果这一假设不成立，例如 Judge 能够利用题目中的局部线索、格式特征、长度启发式或外部知识进行“部分验证”而不必完全重解题，那么 Judge 的判别力将不再受限于其整体解题能力 $c$，理论推导出的 $c \u003E 1/k$ 必要条件及 AUC 上界将失效，导致诊断结果出现假阴性（即误判一个实际上可用的 Judge 为无用）。论文在 Section 3.1 中承认了这一点，指出当存在 Rubric、外部证据或廉价局部检查时，验证比生成容易，(A1) 会低估 Judge 的能力。然而，论文并未提供强有力的证据来证明在所选任务（如 Research Math, Factual QA）中，Judge *确实* 无法利用任何非重解策略进行有效区分；它仅通过实验观察到能力与判别力的相关性来间接支持该假设。如果 Judge 实际上采用了混合策略（部分重解+部分启发式），那么基于纯重解模型推导出的“能力底线”可能过于保守，从而错误地排除了那些虽然解题能力低但具备特定判别技巧的 Judge。\n\n### § 10 最小复现实验\n\n在 1 周内，你可以复现 **Section 4.3 中关于闭式上界（Closed-form Bound）的验证实验**，以检验“判别力受限于解题能力”这一核心 Claim。\n\n1.  **数据与设置**：选择一个公开的多选题数据集（如 MMLU 的子集或 GPQA-Diamond 的少量样本），确保答案空间大小 $k$ 已知（例如 $k=4$ 或 $k=5$）。使用两个不同能力的 LLM 作为 Judge（例如一个强模型如 Claude Sonnet，一个弱模型如 Llama-3-8B）。\n2.  **实现**：\n    *   **获取解题能力 ($\\hat{c}_{solve}$)**：让 Judge 在 Closed-book 模式下直接回答这些题目，计算其准确率（Empty-inclusive，即未输出答案视为错误）。\n    *   **获取判别力 (AUC)**：构建一个小型的“伪优化”场景。对于每个题目，收集一组正确答案（来自金标准）和一组错误答案（来自弱模型生成的错误回答或人工构造的干扰项）。让 Judge 对每个（题目，答案）对进行评分（例如使用 Likert scale 或生成式评分）。\n    *   **计算指标**：计算 Judge 评分区分正确与错误答案的 ROC-AUC。同时计算理论预测的上界 $U(c) = \\frac{1}{2} + \\frac{ck - 1}{2(k-1)}$。\n3.  **测量与验证**：\n    *   **支持 Claim**：如果观测到的 AUC 始终低于或接近理论预测的上界 $U(\\hat{c}_{solve})$，且当 $\\hat{c}_{solve} \\approx 1/k$ 时 AUC $\\approx 0.5$，则支持了理论模型。\n    *   **反驳 Claim**：如果观测到的 AUC 显著高于理论预测的上界（例如超过 0.1 的差距），则表明 Judge 可能利用了非重解策略（如格式、长度或局部线索），暗示 (A1) 假设在该任务上不成立，诊断方法可能过于保守。\n4.  **优势**：此实验无需复现复杂的 SkillOpt 优化循环，仅需静态的评分和解题数据，即可验证核心理论关系。", "research_value": "### § 11 最强反例设计\n\n要挑战这篇论文的核心论点，最有力的攻击并非质疑其数学推导的正确性，而是攻击其**核心假设 (A1) Implicit Re-solving** 在现实 LLM 行为中的普适性，特别是针对**结构化推理任务**或**可分解验证任务**。\n\n**反例场景：多步数学证明或代码调试中的“局部一致性检查”**\n\n论文假设 Judge 必须生成一个完整的内部解 $\\hat{a}$ 并与候选答案 $a$ 进行全量比对（$s = \\mathbb{I}[a = \\hat{a}]$）。然而，在许多高价值任务中，LLM 具备**局部验证能力（Local Verification Capability）**，无需完全重解即可判断答案的错误。\n\n**具体攻击实验设计：**\n\n1.  **构造数据集**：选择一个具有明确中间步骤的任务，如 **Multi-step Math Proofs** 或 **Code Debugging**。\n2.  **构造“低能力但高判别力”的 Judge**：\n    *   使用一个在整体解题准确率（Competence $c$）上低于随机底线 $1/k$ 的弱模型（例如，一个经过微调但推理能力受损的小模型，或者一个被故意注入噪声的模型）。\n    *   然而，该模型保留了**语法检查**、**基本逻辑一致性**或**格式合规性**的能力。\n3.  **构造候选答案分布**：\n    *   **正样本**：正确的完整证明/代码。\n    *   **负样本**：包含明显逻辑谬误、语法错误或格式错误的错误答案。\n4.  **预期结果与理论冲突**：\n    *   根据论文理论，由于 $c \u003C 1/k$，预测 $AUC \\le 0.5$，即 Judge 无法区分正负样本。\n    *   **实际观察**：Judge 可能通过检测负样本中的明显错误（如“除以零”、“逻辑矛盾”）而给予低分，即使它无法独立生成正确答案。此时，$AUC$ 可能显著高于 0.5（例如 0.7），因为 Judge 利用了**启发式线索（Heuristic Cues）**而非**隐式重解（Implicit Re-solving）**。\n5.  **结论**：这证明了 $c \u003E 1/k$ 并非判别力的**必要条件**，而是**充分条件**（在纯重解假设下）。论文的“Chance-Floor Threshold”过于保守，会错误地拒绝那些虽然解题能力差但具备有效**错误检测能力（Error Detection Capability）**的 Judge。这将导致在开放域任务中，大量可用的轻量级 Judge 被误杀，限制了方法的实用性。\n\n此外，还可以攻击 **Within-Question AUC ($AUC_w$)** 的稳健性。如果题目难度分布极度偏斜（例如，90% 的题目对 Judge 来说都是“不可能”的，只有 10% 是“容易”的），$AUC_w$ 可能会因为样本量不足而产生高方差估计，导致诊断结果不稳定。论文未充分讨论在**极端难度分布**下，$AUC_w$ 的统计功效（Statistical Power）是否足以支持可靠的部署决策。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“能力阈值”到“判别力校准”：基于不确定性感知的动态 Judge 门控（Uncertainty-Aware Dynamic Judge Gating）**\n\n**（a）驱动局限与未满足需求：**\n当前论文将 Judge 视为一个**静态的二元门控器**：要么通过诊断（$c \u003E 1/k$）并部署，要么拒绝。这种“一刀切”的方法忽略了两个关键事实：\n1.  **判别力是任务依赖的**：同一个 Judge 在不同难度或不同子任务上的 $AUC$ 可能波动巨大。\n2.  **Judge 的不确定性是可利用的信号**：LLM 在评分时往往能输出置信度（Confidence）或熵（En
