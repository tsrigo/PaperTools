经表现得相当自然，无论是 cascaded 还是 end-to-end 架构，都有大量的 benchmark 去评估它们的 reasoning、paralinguistics 或 full-duplex turn-taking。然而，真实的人类交流大多是 multiparty conversations（多人对话）。如果直接把现有的 voice agent 丢进一个多人的讨论组里，它们往往会表现得像个“局外人”——不知道什么时候该接话，什么时候该闭嘴，甚至分不清谁在跟谁说话。\n\n作者进一步思考：为什么多人场景这么难？在双人对话中，一方说完另一方接话是默认的 implicit cue；但在多人场景中，turn-taking 的可能性呈指数级增长。Agent 不仅需要理解对话的语义内容，还必须具备 turn-taking awareness，即通过 acoustic cues（如声纹特征）和 contextual cues（如对话规则）来判断当前是否轮到自己。现有的 multiparty benchmark 大多只关注 passive understanding（如听录音做摘要），或者仅限于 text modality，完全没有评估 agent 作为 active participant 在 audio modality 下的行为。\n\n为了填补这一空白，作者需要设计一个客观、可自动评估的 benchmark。难点在于：如何在一个多人的音频流中精确控制 turn-taking 的 ground truth？作者想到了使用合成音频（如 ElevenLabs），这样可以完全消除背景噪音和语音重叠的干扰，专注于测试核心的 multiparty 能力。通过设计“Discussion”和“Turn-based Game”两种场景，可以分别测试 explicit turn-taking（被直接点名）、implicit turn-taking（根据游戏规则推断该不该说话）以及 negative turn-taking（不该说话时保持沉默）。此外，为了确保任务不能被 text-only LLM 轻易破解，作者还设计了必须依赖声学特征才能回答的 understanding tasks（如“谁说了什么”）。这条路径自然地将作者引向了 MP-Bench 的设计：一个通过受控的多人音频场景，同时评估 voice agent 理解能力与行为决策的 benchmark。\n\n### § 4 核心 Intuition\n\n现有的 voice agent 之所以在多人对话中崩溃，是因为它们无法从纯音频流中准确恢复 speaker attribution（说话人身份与话语的对应关系），从而无法判断当前对话的指向和轮次。只要给模型提供完美的 speaker diarization（说话人分离）文本，即使是 text LLM 也能在多人 turn-taking 上达到近乎满分；但一旦要求模型直接从音频中自行推断谁在说话、是否轮到自己，实时语音模型的表现就会骤降至随机猜测的水平。因此，MP-Bench 的核心直觉是：通过构造必须依赖声学特征才能解开的多人交互场景，将“音频模态下的说话人归属与轮次推断”这一被掩盖的根本性缺陷暴露出来。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n┌─ Speaker Curation ─┐  ┌─ Scenario Design ──┐\n│ 12 voices          │  │ Discussion(83 topics)│\n│ gender × pitch     │  │ Turn-based Game(3)   │\n└───────┬────────────┘  └──────────┬──────────┘\n        └──────────┬───────────────┘\n                   ▼\n       ┌─ LLM Dialogue Generation ─┐\n       │ + addressee + coreference │\n       └─────────────┬─────────────┘\n                     ▼\n       ┌─ Dialogue Instance Filtering ─┐\n       │ Rule: 每人被提及 ≥ 1 次       │\n       │ LLM验证: 无标签→失败          │\n       │         匿名标签→成功         │\n       └─────────────┬─────────────────┘\n            ┌────────┴────────┐\n            ▼                 ▼\n   ┌─ Understanding ─┐ ┌─ Behavior ─────┐\n   │ 4类QA(Spk×Cont) │ │ Explicit       │\n   │ (Discussion)    │ │ Implicit       │\n   └───────┬─────────┘ │ Negative       │\n           │           └───────┬────────┘\n           ▼                   ▼\n   ┌─ Voice Agent Evaluation ──────────┐\n   │ Stream Audio → Agent → ASR        │\n   │ NeMo Parakeet (word timestamps)   │\n   └───────────────┬───────────────────┘\n                   ▼\n   ┌─ LLM-as-a-Judge (GPT-5) ──────────┐\n   │ Understanding Acc.                │\n   │ Turn-Taking Acc. / Approp. Acc.   │\n   │ Response Latency                  │\n   └───────────────────────────────────┘\n```\n\n**Speaker Curation（§4.1）**：从 ElevenLabs 库中精选 12 个声学特征高度可区分的 voice，按 gender（male/female）× pitch（high/medium/low）两个维度分类。同一对话中不允许出现同 gender 同 pitch 的组合，以确保 speaker separability。输出为 valid speaker combinations，供后续对话生成使用。\n\n**Scenario Design（§3.1, §4.2）**：定义两个场景。Discussion 场景围绕 83 个 factual topics 构建三方辩论，最终由某位说话人显式呼叫 AI Assistant 裁决谁正确。Turn-based Game 场景将四名参与者分为两组（Leader + Follower），核心规则为对方 Leader 发言后己方 Follower 必须回应，涵盖 Word Chain、Increasing Number、Decreasing Number 三种变体。\n\n**LLM Dialogue Generation（§4.2）**：将随机采样的 topic 与 valid speaker combination 填入 prompt template，由 LLM 生成对话内容。Discussion 场景额外生成 addressee（每轮说话对象）和 coreference（代词指代关系）两类 metadata，用于后续 QA 构造。Turn-based Game 场景不生成这些 metadata。\n\n**Dialogue Instance Filtering（§4.2.3）**：分两步过滤。首先用规则验证每位参与者在对话中被提及至少一次。然后用 LLM 在两种条件下测试：(a) 仅提供原始文本无说话人标签——LLM 应无法恢复说话人身份；(b) 提供匿名标签（Speaker1, Speaker2...）——LLM 应能成功映射所有说话人姓名。仅保留 (a) 失败且 (b) 成功的实例。这一过滤确保任务必须依赖音频 modality 中的声学线索，不能仅凭 transcript 解决。\n\n**Task Generation（§4.3）**：从过滤后的对话实例生成两类任务。Understanding tasks 仅来自 Discussion 场景，将信息分为 speaker-related attributes 与 content-related details，交叉组合为 4 类 QA（Spk→Cont、Cont→Spk、Cont→Cont、Spk→Spk），同样经过 LLM 过滤确保不可仅凭文本回答。Behavior tasks 中，Discussion 场景在对话末尾追加一轮显式呼叫 agent 的发言（explicit turn-taking）；Turn-based Game 场景追加若干轮游戏进程，agent 需根据角色判断是否该发言（implicit/negative turn-taking）。\n\n**Voice Agent Evaluation（§3.3.1）**：将合成的 multiparty 音频流式输入被测 voice agent，用 NeMo Parakeet streaming ASR 对 agent 的语音输出进行转录并提取 word-level timestamps。若任何生成词的起始时间晚于输入音频结束时间，则判定 agent 已响应，无需额外 VAD 模块。\n\n**LLM-as-a-Judge（§3.3.2–3.3.4）**：使用 GPT-5 作为 judge 评估转录文本。Understanding tasks 评估答案正确性，并单独报告 speaker name accuracy（与 33.3% 随机基线对比）。Behavior tasks 评估 turn-taking accuracy（是否在正确时机发言/沉默）和 appropriateness accuracy（turn-taking 正确且内容符合规则）。对 realtime agent 额外计算 response latency（输入音频结束至首个生成词起始的时间差）。\n\n---\n\n### § 6 核心数学推导\n\n本文为 benchmark 论文，不包含形式化数学推导。文中涉及的唯一量化关系是随机基线的定义：speaker name accuracy 的随机基线为 1/3 ≈ 33.3%（3 位人类说话人等概率猜测），Turn-based Game 的 turn-taking accuracy 随机基线为 50%（发言/沉默二选一）。这些基线用于判断模型表现是否显著优于随机，不涉及数学证明。跳过本节。\n\n---\n\n### § 7 实验设计与结论\n\n**问题 1：当前 voice agents 在 multiparty 对话中的理解和行为能力如何？**\n\n实验设计：在 MP-Bench 上评测 12 个 voice agents，包括 10 个 realtime 系统（GPT-Realtime、Gemini Live 系列、Moshi、Freeze-Omni 等）、2 个 non-realtime 系统（Qwen3-Omni、Gemini-3.1-Pro），以及 2 个 text LLM baseline（ASR-only 和 SpkD-ASR 配置）。比较 understanding accuracy、turn-taking accuracy、appropriateness accuracy 和 response latency。\n\n答案：Realtime voice agents 的 multiparty comprehension 停留在或低于 33%，turn-taking 接近随机水平。Non-realtime agents 在理解任务上显著优于 realtime（Gemini-3.1-Pro 达 73.3% overall accuracy），但在 implicit/negative turn-taking 上同样崩溃至随机水平。配备完美 speaker diarization 的 text LLM baseline（SpkD-ASR）在两项任务上均接近完美，证明任务本身可解，瓶颈在于从音频中恢复 speaker attribution。\n\n**问题 2：Behavioral tasks 是否比 understanding tasks 更容易？**\n\n实验设计：对比同一批模型在 Discussion 场景下 behavioral tasks 与 understanding tasks 的表现，并比较 text LLM 在 ASR-only 与 SpkD-ASR 两种配置下的性能差距变化。\n\n答案：几乎所有模型在 behavioral tasks 上的得分显著高于 understanding tasks。Text LLM 的 ASR-only 与 SpkD-ASR 差距从 understanding 的 66.67% 缩小到 behavioral appropriateness 的 14.06%，表明强大的 LLM 即使在缺乏 speaker identification 的情况下也能利用语言先验生成看似合理的回应。\n\n**问题 3：Multiparty 场景下的失败是否源于游戏规则理解的不足？**\n\n实验设计（Ablation §6.1）：构建 single-speaker 变体——一位人类说话人介绍规则并与 agent 直接对玩，游戏机制完全不变。用 50 个合成对话测试 GPT-Realtime 和 Gemini-2.5 Live。\n\n答案：Single-speaker 设定下两模型分别达到 76.0% 和 68.0% turn-taking accuracy，远超 50% 随机基线；appropriateness accuracy 分别为 74.0% 和 63.0%，远高于 multiparty 版本的 28.13% 和 20.00%。结合 text LLM baseline 的证据（ASR-only 49.22% vs SpkD-ASR 98.44%），失败根源在于从音频中恢复 speaker attribution，而非规则理解或 instruction following 能力不足。\n\n**问题 4：能否通过 prompting 缓解 multiparty 能力缺陷？**\n\n实验设计（Ablation §6.2）：对 5 个 realtime 模型分别使用 default system prompt 和 multiparty-aware prompt（额外告知\"对话中可能存在多位说话人\"），比较两者表现。\n\n答案：Multiparty-aware prompt 在 Discussion 场景带来一定提升，但在 Turn-based Game 场景表现停滞或退化——turn-taking accuracy 仍接近 50% 随机基线，而 appropriateness accuracy 下降，因为模型在发言时更频繁地偏离游戏规则。简单的 prompting 干预无法从根本上解决 multiparty 感知缺陷。\n\n**问题 5：LLM judge 的评估是否与人类判断一致？**\n\n实验设计（§7）：招募 13 名研究生标注者，对 280 条 behavior tasks（Discussion 场景）进行独立评分，计算 inter-annotator agreement（Krippendorff's α）和 LLM judge 与人类多数投票的一致性（Cohen's κ）。此外用 3 个不同模型家族的 LLM judge 重新评测 720 条样本以验证跨模型一致性。\n\n答案：Krippendorff's α = 0.745，Cohen's κ = 0.646，表明 LLM-as-a-judge 与人类评估具有实质性一致。跨 judge 一致性方面，3 个额外 judge 与 GPT-5 的 κ 分别为 0.78、0.77、0.83，且未出现系统性排名翻转。\n\n**问题 6：当声学条件更困难时，multiparty 能力缺陷是否持续存在？**\n\n实验设计（Appendix D）：对表现最强的 realtime 模型 Covo-Audio 使用声学特征刻意相似的 voice 组合进行 ablation，排除涉及 pitch 描述的问题以避免歧义。\n\n答案：当 voice 可区分性降低时，依赖声学归因的能力急剧崩溃：understanding accuracy 从 40% 降至 4%，speaker name accuracy 从 45% 降至 0%，Discussion appropriateness 从 75% 降至 45%。Turn-based turn-taking 始终在 50% 基线附近。这表明论文报告的负面发现在更困难的声学条件下不仅持续存在，理解能力方面甚至更加严重。", "additional_insights": "### § 8 Take-aways\n\nMP-Bench 是首个将 voice agent 作为多方对话积极参与者进行评估的 benchmark，填补了现有评估仅覆盖 dyadic interaction 和被动音频理解的空白。其设计通过两个场景和三类 turn-taking 条件，将评估分解为理解能力与行为能力两个维度，并利用合成音频实现客观可重复的 ground truth。对 12 个 voice agent 的评估揭示了一个严峻现状：当前最先进的 realtime voice agent 在多方理解上不超过 33% 随机基线，在 implicit 和 negative turn-taking 上接近 50% 随机概率，表明多方场景下的 turn-taking awareness 是一项根本性缺失能力。强大的 LLM 语言先验使 agent 在 explicit behavioral task 上尚可生成合理响应，但在需要精细声学归因的理解任务上性能崩溃。Non-realtime agent 在理解上显著优于 realtime agent，但两者在 implicit turn-taking 上均接近随机，说明该缺陷与延迟约束正交，源于多方动态本身的复杂性。Ablation 进一步证明，失败并非源于 game-rule instruction following 能力不足，也无法通过 multiparty-aware prompting trivially 解决。人类评估与 LLM judge 的高度一致性（Cohen's κ = 0.646）验证了评估框架的可靠性。\n\n### § 9 最脆弱的假设\n\n论文最关键的假设是：**使用声学特征高度可区分的合成语音，能够将多方对话的核心认知能力与 speaker diarization 的声学处理难度解耦，从而纯粹测量 agent 的 multiparty awareness。** 如果这一假设不成立——即模型表现差并非因为缺乏\"多方意识\"这一更高层认知能力，而是因为即使在\"理想\"声学条件下也无法从音频流中完成基本的 speaker attribution——那么 benchmark 测量的就不是多方对话理解能力，而仅仅是 streaming 架构下声学处理的工程缺陷，核心 claim 的表述将从根本上被削弱。\n\n论文自身提供了部分支持该假设的证据：text LLM 在配备 oracle speaker labels（SpkD-ASR）时 turn-taking accuracy 接近 98%，而在仅有 ASR transcript 时降至 49%，证明任务在逻辑上可解，瓶颈在于从音频恢复 speaker attribution。然而，论文在 Section 6.1 的 ablation 中也承认 \"the deficit lies in recovering speaker attribution from audio rather than in reasoning about turns\"，这实际上自我削弱了核心 claim——问题可能根本不在\"多方意识\"这一认知层面，而在于当前 realtime 架构无法在 streaming 模式下进行有效的 speaker diarization。更关键的是，论文缺少一个直接证据：没有展示 agent 在被显式提供 diarization 结果后能否在 implicit turn-taking 上显著提升，如果能，则说明缺失的仅是声学前端而非多方推理能力。此外，合成音频完全排除了 overlap speech（0% vs. AMI 的 24.5%）、背景噪声和长停顿，在这种高度简化条件下 agent 仍然失败，意味着真实场景下的表现可能更差，但也使得\"多方动态复杂性\"这一归因缺乏直接验证——因为即使在最简单的多方条件下模型就已崩溃，无法区分是\"多方\"还是\"任何非 dyadic 的声学条件\"导致了失败。\n\n### § 10 最小复现实验\n\n在一周时间内，最具验证价值且成本最低的实验是复现论文 Table 3 中 Turn-based Game 场景的核心发现：**realtime voice agent 的 turn-taking accuracy 接近 50% 随机基线，而配备 oracle speaker labels 的 text LLM 接近 100%。** 具体方案如下：使用论文 GitHub 仓库中公开的 Turn-based Game 样本（或手动构造 20-30 个简短多方对话音频，用 ElevenLabs 或任何 TTS 生成 3 个声学差异明显的说话人，内容包含规则介绍、角色分配和 2-3 轮游戏交互），将音频流式输入 1-2 个 realtime voice agent（如 GPT-Realtime API 或开源的 Ultravox），通过 ASR word-level timestamp 检测 agent 是否在 input audio 结束后产生响应，计算 turn-taking accuracy。同时，将相同对话的 transcript 配备 anonymized speaker labels 输入给一个 text LLM（如 GPT-4o），询问 agent 是否应该在该时刻响应，计算相同指标。\n\n测量结果若显示 realtime agent 的 TT Acc. 在 45-55% 范围内而 text LLM with speaker labels 在 90% 以上，则支持论文核心 claim——即多方 turn-taking 的瓶颈在于从音频中恢复和利用 speaker attribution，而非任务本身的逻辑难度。若 realtime agent 显著高于 60%，则表明某些模型已具备基本多方 turn-taking 能力，论文的\"普遍性失败\"结论需收窄；若 text LLM with speaker labels 也表现不佳，则说明任务设计本身可能存在歧义，benchmark 的有效性受到质疑。整个实验仅需少量样本、两个现成 API 和一个简单的 timestamp 检测脚本，无需复现完整的 927 任务集或 LLM-as-a-judge pipeline。", "research_value": "### § 11 最强反例设计\n\n对这篇论文最有力的攻击在于挑战其核心归因：模型在 MP-Bench 上的失败究竟是由于缺乏高阶的“multiparty awareness”，还是仅仅因为当前 streaming voice agent 普遍采用的基于静音片段的 dyadic endpointing 机制在多方场景下产生了系统性 false alarm。现有 realtime voice agent 的架构通常依赖简单的 voice activity detection (VAD) 来判断轮次结束，在 dyadic 交互中，对方语音的停止即是明确的发言邀请；但在多方对话中，Speaker A 的停顿往往意味着 Speaker B 将要接话，而当前 agent 的 endpointing 模块会错误地将 A 的停顿识别为对自己的 turn-yielding 信号，从而在 B 说话前抢先发声或陷入状态混乱。这种由于声学端点检测错误导致的 turn-taking 失败，被论文错误地归因为“无法从音频中恢复 speaker attribution”的认知缺陷。为了验证这一替代解释，可以设计一个 Inter-speaker Gap Ablation 实验：选取 MP-Bench 中 Turn-based Game 的音频样本，利用 ElevenLabs 重新合成两个变体——变体 A 保持多方对话中说话人之间紧凑的接话间隔（模拟自然对话，间隔约 200ms），变体 B 在每次说话人切换时强制插入 2 秒的绝对静音期。如果 realtime voice agent 在变体 B 中的 turn-taking accuracy 显著回升（例如从 50% 提升至 75% 以上），则证明模型根本不需要具备 speaker attribution 能力，它只是需要一个“干净”的声学边界来避免 endpointing 抢占；反之，若模型在变体 B 中依然失败，才能确凿证明 speaker attribution 是不可绕过的认知瓶颈。此外，若引入一个前置的独立 streaming speaker diarization 模块（如 Pyannote.audio）将实时 speaker label 作为文本流注入 agent，而 agent 的 turn-taking 表现依然没有显著改善，这将彻底推翻论文关于“配备完美 speaker diarization 即可解决问题”的假设，证明失败源于更深层的 streaming 架构对多方状态的持续追踪能力缺失，而非单纯的声学归因。\n\n### § 12 Follow-up Research Idea\n\n基于 MP-Bench 暴露出的核心局限——即合成音频完全排除了 overlap speech 和 backchanneling，且将 turn-taking 简化为非黑即白的“发言/沉默”二元决策——我们可以提出一个全新的研究方向：**Continuous Affiliative Dynamics Tracking for Full-Duplex Voice Agents**。这一想法的驱动需求在于，真实的多方对话并非离散的轮次交接，而是充满连续的声学重叠与 affiliative signals（如“yeah”、“uh-huh”等 backchannels），voice agent 若要真正融入群体，不仅需要判断“何时说话”，更需要学会“如何在他人说话时进行非抢占式的声学协同”。我们可以借鉴计算社会语言学和音乐信息检索（MIR）领域的多轨源分离与节拍对齐方法，将多方对话建模为连续的声学状态空间，而非离散的 token 序列。第一个实验将构建一个 Full-Duplex Multiparty Overlap Benchmark：利用真实的多方对话语料库（如 AMI corpus），提取包含大量 overlap speech 和 backchannel 的片段，并训练一个基于 diffusion 的全双工 voice agent，使其能够在主说话人发言的间隙或特定 prosodic cue（如 pitch drop）处，实时生成极短的 affiliative backchannel 而不抢占 floor。评估指标将从 turn-taking accuracy 转向 Floor Holding Integrity（主说话人是否因 agent 的插话而中断）和 Affiliative Appropriateness（agent 的 backchannel 是否在 prosody 和语义上与当前语境对齐）。这一提议与 MP-Bench 及现有工作的根本区别在于，它将 voice agent 的角色从“被动的轮次抢占者”转变为“主动的声学协调者”，首次将评估范式从离散的 turn-taking 推进到连续的 conversational dynamics 对齐。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yi-Jen Shih\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Shih-Yun Shan Kuan\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Guan-Ting Lin\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Kai-Wei Chang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Siddhant Arora\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Shu-wen Yang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Abdelrahman Mohamed\", \"affiliations\": [5], \"markers\": []},\n    {\"name\": \"Shinji Watanabe\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Hung-yi Lee\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"David Harwath\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"UT Austin\"},\n    {\"id\": 2, \"name\": \"NTU\"},\n    {\"id\": 3, \"name\": \"MIT\"},\n    {\"id\": 4, \"name\": \"CMU\"},\n    {\"id\": 5, \"name\": \"Meta AI\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"}\n  ]\n}\n```", "summary_translation": "对话式 voice agents 取得了显著进展，通过 cascaded 和 end-to-end 架构提供了日益自然的人机交互。然而，尽管最近的 benchmarks 广泛评估了 dyadic interactions 和 passive audio comprehension，它们在很大程度上忽略了一个普遍的现实世界场景：multi-party conversations。由于对话复杂性呈指数级增加，在这些环境中评估 agents 比 dyadic interactions 从根本上更具挑战性。为了使 voice agents 无缝融入人类 group dynamics，它们不仅必须生成符合语境的响应，还必须展示对 open turn-taking 的细致理解。为了填补这一空白，我们引入了 Multiparty Bench (MP-Bench)，这是第一个专门设计用于客观评估 conversational speech systems 作为 multi-party contexts 中积极参与者的 benchmark。MP-Bench 沿着两个主要维度评估 agent 行为：turn-taking awareness 和 response appropriateness。此外，我们纳入了 comprehension-based question-answering 任务作为补充评估。通过 benchmarking 12 个 voice agents，我们发现 real-time voice agents 在 multiparty comprehension 上停留在或低于 22%，并且在 multiparty turn-taking 上保持接近随机水平，这暴露了 real-time voice agents 在 multiparty scenario 下的一个开放挑战。"}, {"title": "VRL-Bench: Benchmarking agents on computer control tasks under finite trial budgets", "arxiv_id": "2609.12404", "authors": "Yu Bai, Yukai Miao, Dawei Wang, Li Chen, Yanyu Ren, Yuqian Shi, Dan Li, Ying Xiong, Chengqiu Tan, Run Zhou, Li Li", "summary": "Learning from trial and error is a promising way to improve language agents on complex tasks such as computer control. Reflexion introduced verbal reinforcement learning, which turns failed trials into text that guides later attempts without updating model parameters. We introduce VRL-Bench, a harness for fair evaluation of trial-and-error learning under finite trial budgets. Across three models on MiniWoB and WebShop, we evaluate updates from several prominent verbal-memory methods spanning Reflexion and later work: each improves observed success over memory-free retry in some settings but reduces it in others. Replay experiments show that using reflection can reduce success rates, revealing a trade-off between exploiting experience and continued exploration. We propose VEX$^2$, a verbal exploration--exploitation scheduler that uses a language model to jointly select policies and allocate the remaining trial budget. VEX$^2$ is the only evaluated update to achieve positive observed success-rate gains over retry in all six settings.", "category": "cs.AI", "cluster": "Agent Evaluation \u0026 Benchmarking", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文的核心研究对象是LLM智能体在计算机控制任务中的试错学习（trial-and-error learning），属于自我演化（Self-Evolving）方向。论文提出了VRL-Bench基准框架，用于评估有限试验预算下智能体的口头强化学习（verbal reinforcement learning）方法，并进一步提出了VEX^2调度器，通过语言模型联合选择策略和分配试验预算，实现了探索与利用的平衡。这直接涉及智能体的自我反思、经验利用和持续改进机制，符合“自我演化”和“智能体能力改进”的核心关注点。论文并非简单的领域应用，而是聚焦于智能体学习机制的设计与评估，因此应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的核心研究问题是：在有限的完整尝试预算下，基于语言模型的智能体通过试错学习（trial-and-error learning，如 verbal reinforcement learning）所积累的失败记忆，是否真的能可靠地超越无记忆的简单重试？这个问题至关重要，因为当前主流的 verbal memory 方法（如 REFLEXION）默认假设将失败经验转化为文本反馈能够持续提升后续尝试的成功率，但在有限的预算约束下，不完整的失败记忆可能会锚定智能体走向错误路径，从而剥夺了其通过全新探索发现替代方案的机会。解决这一问题不仅能揭示现有记忆更新方法在跨尝试学习中的真实效能与局限，还能为智能体在不可逆的计算机控制任务中如何平衡经验利用与持续探索提供理论依据。通过提出 VRL-BENCH 评测框架和 VEX[2] 调度器，该研究填补了试错学习公平评估的空白，证明了盲目使用反思记忆可能带来负面效果，并提供了一种利用语言模型动态分配剩余预算以实现正向收益的可行路径。\n\n### § 2 前人工作与不足\n在试错学习与记忆更新领域，REFLEXION 首次引入了 verbal reinforcement learning，通过在失败后生成反思文本并在环境重置后指导后续尝试，实现了不更新模型参数的跨尝试学习。后续工作如 Dynamic Cheatsheet 和 ACE 进一步扩展了记忆机制，分别通过跨查询的累积替换表和跨任务的在线 playbook 来复用经验；而 LATS 则采用 Monte Carlo Tree Search (MCTS) 在推理阶段进行搜索。然而，这些前人工作存在显著的评测缺口与机制局限。首先，REFLEXION 及其后续方法在评估时未能将“跨尝试学习的增益”与“单纯增加尝试机会的增益”严格分离，其比较往往未在统一的有限预算和交互限制下进行，导致无法确认失败记忆本身是否真正带来了正向价值。其次，这些方法在机制上忽略了 exploration-exploitation (EE) trade-off，错误地假设失败衍生的记忆总是有益的，而未考虑到在有限预算下，不完整的反思可能会阻碍智能体探索其他成功路径。此外，Dynamic Cheatsheet 和 ACE 原本设计用于跨查询或跨任务的经验积累，其经验生命周期与 REFLEXION 式的单任务内试错场景不匹配，需要经过严格的适应性改造才能进行公平比较。最后，LATS 的搜索机制依赖于中间状态的恢复与额外分支的评估，这在计算机控制任务中由于无法进行状态回滚而难以直接应用。这些不足共同导致了现有方法在有限预算下的试错学习中表现不稳定，甚至在某些设置下反而降低成功率。", "core_insight": "### § 3 重建作者的思考路径\n\nREFLEXION 提出将失败 trial 转为文本反思、在 reset 后指导后续尝试，其直觉是 failure-derived memory 能改善 later attempts。但一个被忽视的 baseline 是 memory-free retry：同一个 fixed-parameter agent 在 reset 后重新尝试，虽然不携带任何跨 trial 文本，却并不必然重复同一条轨迹——模型采样本身会带来变化。LATS 的报告已经显示 repeated ReAct 与 REFLEXION 在 WebShop 上表现相近，这暗示 failure-derived memory 的增益可能并不稳定。一个自然的问题是：在有限 trial budget 下，这些 verbal memory 方法究竟是在真正学习，还是仅仅获得了更多尝试机会？\n\n要回答这个问题，需要分离\"跨 trial 学习\"与\"额外尝试\"这两个因素。作者构建 VRL-BENCH，强制所有条件共享相同的第一次 trial ($T_1$)，匹配 trial 和 interaction budget，仅保留各方法自身的 update 机制。在这个公平框架下评估 REFLEXION、DC-Cu* 和 ACE*，结果反直觉：没有一种现有 update 在所有设置下都能稳定优于 retry——REFLEXION 在 GLM-4.7-FlashX 上两个环境都低于 retry，DC-Cu* 在三个 MiniWoB 设置上全部低于 retry。\n\n为什么 failure memory 有时有害？一个失败轨迹并不唯一确定修复方向。不完整的反思可能将 agent 锚定到错误路线，而 fresh rollout 本可以发现替代方案。作者回顾 REFLEXION 的 AlfWorld 和 HotPotQA 实验，引入 replay exposure 干预：保持 reflection writer 不变，仅控制反思是否暴露给后续 Actor。结果显示 full replay 的早期优势可能消失——HotPotQA 上 full replay 最终低于 no replay，AlfWorld 上 interior schedule ($\\varepsilon=0.25$) 反而最优。更重要的是，不同 schedule 恢复的是不同的失败案例子集，它们的 union 远大于任何单一 schedule。这揭示了一个经验性的 exploration-exploitation (EE) trade-off：利用失败反馈与保留替代探索路径之间存在张力。\n\n既然问题被定位为跨 trial 的 EE 决策——哪些 failure-supported policy 值得利用、哪些替代方案值得保留——而 language model 已经具备从失败历史中提取语义 policy 和做规划的能力，那么自然的下一步就是让 language model 担任这个 scheduler，根据失败历史和剩余 budget 联合决定 policy 选择和 trial 分配，而非无差别地 replay 所有反思。\n\n### § 4 核心 Intuition\n\n现有 verbal memory 方法将所有失败反思无差别地传递给后续每一次 trial，这在有限 budget 下会过度利用一条可能错误的失败解释，锚定 agent 的探索方向，挤占本可发现替代成功路径的尝试机会。VEX² 的核心直觉是：跨 trial 的 exploration-exploitation 权衡本身应该被显式调度——让 language model 根据失败历史和剩余 trial budget，判断哪些 policy 选择已被证据支持值得利用、哪些替代方向值得探索，并将有限的 trial budget 分配到这些 policy 上，而不是盲目 replay 全部反思或盲目 retry。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n          VEX[2] Inter-Trial Pipeline\n\n[Task x, Rules ρ, Budget T]\n            │\n            ▼\n    ┌───────────────┐\n    │  Actor (θ固定) │──▶ Trial t: A-O trace τ_t\n    └───────────────┘            │\n            ▲                    ▼\n            │              ┌──────────┐\n            │              │ Y_t = 1? │──Yes──▶ STOP ✓\n            │              └────┬─────┘\n            │                   │No\n            │                   ▼\n            │              ┌──────────┐\n            │              │ η_t = 1? │──No──┐\n            │              │Eligible? │      │\n            │              └────┬─────┘      │\n            │              Yes │            │\n            │                  ▼            │\n            │           ┌───────────┐       │\n            │           │F_t ← F_{t-1}      │\n            │           │  +(t, τ_t)│       │\n            │           └─────┬─────┘       │\n            │                 │             │\n            │                 ▼             │\n            │    ┌────────────────────┐     │\n            │    │  Scheduler LM S_θ   │◀────┘\n            │    │ In: x, ρ, F_t, R_t  │ R_t=T-t\n            │    └────────┬───────────┘\n            │             │\n            │             ▼\n            │    ┌────────────────────┐\n            │    │ Policy Tree +      │\n            │    │ Allocation a_t +   │\n            │    │ Next-trial Guidance│\n            │    └────────┬───────────┘\n            │             │ (verbatim)\n            └─────────────┘\n                  │\n            t \u003C T?┤No──▶ STOP ✗\n                 Yes\n                  └──▶ 下一次 Trial\n```\n\nVEX[2] 的完整 pipeline 是一个 inter-trial 循环，核心在于用语言模型充当 exploration–exploitation scheduler，在有限 trial 预算下联合决策\"下一步试什么策略\"和\"剩余预算如何分配\"。以下按步骤说明：\n\n**步骤 1：Actor 执行 Trial t。** Actor 接收任务描述 $x$、公共环境规则 $\\rho$ 以及上一步 scheduler 生成的指导文本 $D_{t-1}$（首次 trial 无此输入），在环境中执行一个 complete trial，产出 action–observation trace $\\tau_t$ 和终端结果 $Y_t$。Actor 的模型参数 $\\theta$ 全程不变。对应正文 § 5 及 Algorithm 1 的第 3 行。\n\n**步骤 2：成功判定与终止。** 若 $Y_t = 1$（成功），立即停止，返回 SUCCESS。这是 early stopping 机制，避免浪费剩余 trial 预算。对应 Algorithm 1 第 4–6 行。\n\n**步骤 3：失败 eligibility 检查。** 若 trial 失败，harness 检查 eligibility bit $\\eta_t$：当且仅当该 trial 的 benchmark-visible record 中包含至少一个已执行的 A–O pair 时 $\\eta_t = 1$。零 dispatch 的 protocol failure 虽然消耗一次 trial 预算，但不扩展失败历史。对应 Appendix D.4 及 Algorithm 1 第 8–10 行。\n\n**步骤 4：更新失败历史 $\\mathcal{F}_t$。** 若 eligible，将 $(t, \\tau_t)$ 追加到有序失败历史 $\\mathcal{F}_t$。该历史仅包含 eligible failure 的 benchmark-visible A–O trace，排除成功轨迹、未执行候选和模型虚构结果。对应 Algorithm 1 第 9 行及 Appendix F.2 的 input schema。\n\n**步骤 5：Scheduler LM 生成联合决策。** 当 $t \u003C T$ 时，scheduler 模型 $S_\\theta$ 接收四个输入：任务 $x$、规则 $\\rho$、有序失败历史 $\\mathcal{F}_t$、剩余预算 $R_t = T - t$。模型在**一次调用**中生成一个完整响应，包含三个部分：(1) **Semantic Policy Tree**——一棵语义决策树，其叶节点代表从新观测出发的完整 observation-conditioned policy，而非可回溯的 A–O 状态树；(2) **Advisory Allocation** $\\mathbf{a}_t$——为每个 policy leaf 分配整数配额，要求 $\\sum_{p \\in P_t} a_t(p) = R_t$，表达哪些替代策略现在追、留到以后、或放弃；(3) **Next-trial Guidance**——选定一个 policy 指导紧接的下一次 trial。对应正文 § 5 的公式 $S_\\theta(x, \\rho, \\mathcal{F}_t, R_t) \\to D_t$ 及 Appendix F.2–F.3。\n\n**步骤 6：完整响应原样传递给 Actor。** Scheduler 的完整响应**不经 runtime 解析或修复**，原样作为下一次 Actor 的上下文输入。Runtime 仅负责执行 trial 和 interaction limit 的硬约束。对应 Algorithm 1 第 13 行及 Appendix F.1。\n\n**步骤 7：循环或终止。** 若 $t \u003C T$，回到步骤 1 执行下一次 trial；若预算耗尽，返回 FAILURE。每次失败后即使历史未变（如 protocol failure），只要还有剩余预算，scheduler 都会被重新调用，但此时面对的是更小的 $R_t$ 和不变的 $\\mathcal{F}_t$。对应 Algorithm 1 第 11–16 行。\n\n**一个具体例子**（正文 § 5 及 Appendix F, `sample_0017`）：在 WebShop 中，$T_1$ 尝试购买产品 `B07VLKYJNH` 并选择了正确的选项 MN4，但购买失败（reward 0.6667）。VEX[2] 的 scheduler 识别出\"MN4 选项选择正确\"这一 supported decision，同时将\"更换产品 identity\"作为 NEXT policy 分配 3 次 trial，将\"重新检查当前产品选项\"作为 RESERVE 分配 2 次，将\"重复相同购买\"PARK 分配 0 次。$T_2$ 时 Actor 在新产品 `B077PR9TL4` 上选择 MN4 并购买成功。相比之下，REFLEXION 在 $T_2$–$T_6$ 中反复尝试同一产品或丢失 MN4 选项，最终未解决。\n\n### § 6 核心数学推导\n\n本文没有复杂的定理证明或数学推导，其形式化内容集中在 Appendix A 中的定义和目标函数表述。以下解释这些定义的 intuition。\n\n**有限预算目标。** 对于任务实例 $m$，设 $T_\\star^{(m)} = \\min\\{t \\leq T : Y_t^{(m)} = 1\\}$ 为首次成功的 trial 编号，若六次 trial 内未成功则 $T_\\star^{(m)} = T + 1$。优化目标为 $J_T^{(m)} = \\Pr[T_\\star^{(m)} \\leq T]$，即在 $T$ 次 complete trial 内成功的概率。这个目标直接体现了\"有限预算\"的核心约束：agent 只有 $T$ 次完整尝试机会，而非无限重试。SR@$T$ 是该目标的频率估计量。\n\n**Scheduler 的映射关系。** $S_\\theta(x, \\rho, \\mathcal{F}_t, R_t) \\to D_t$ 定义了 scheduler 的输入输出：将任务、规则、失败历史和剩余预算映射为一个决策对象 $D_t$。这不是一个训练目标，而是一个推理时的条件生成规约。关键在于 $R_t$ 作为状态坐标而非简单循环计数器——两个 run 即使有相同的更新输入，若 $R_t$ 不同，scheduler 也可以生成不同的策略分配。\n\n**Allocation 约束。** $\\sum_{p \\in P_t} a_t(p) = R_t$ 要求所有 policy leaf 的配额之和恰好等于剩余 trial 数。这个等式约束的 intuition 是：scheduler 必须对剩余的每一次 trial 都做出明确的分配决定，不能含糊地\"保留\"未分配的 trial。配额为 0 的 PARK leaf 被明确排除在执行计划之外，避免 agent 浪费宝贵的 trial 去重复已失败的策略。\n\n**评测指标。** SR@$T$ 衡量在 $T$ 次 trial 内解决的任务比例；RR@$T$（recovery rate）仅在共享 $T_1$ 失败的子集上计算，衡量\"额外恢复\"了多少失败案例；censored AvgT@$T$ 将未解决案例的首次成功 trial 记为 $T+1$，同时惩罚低成功率和慢成功。Appendix D.9 给出了 AvgT@6 差异的分解公式：$\\Delta\\text{AvgT} = \\underbrace{\\text{recovery contribution}}_{\\text{终端结果差异}} + \\underbrace{\\text{both-success timing}}_{\\text{共同成功案例的快慢差异}}$，该分解表明 VEX[2] 的 AvgT@6 改善主要来自恢复更多失败案例，而非加速已可解案例的完成。\n\n### § 7 实验设计与结论\n\n本文围绕三个递进的问题设计实验：\n\n**问题 1：现有的 verbal memory update 方法在有限 trial 预算下是否能可靠地优于无记忆重试？**\n\n实验设计：构建 VRL-BENCH 评测框架，在 MiniWoB（640 cases）和 WebShop（100 goals）上，用三个模型（DeepSeek-V4-Flash、GPT-5.4 nano、GLM-4.7-FlashX）比较 memory-free retry 与三种现有更新方法（REFLEXION、DC-Cu$_\\ast$、ACE$_\\ast$）。所有条件共享相同的 $T_1$、trial 预算（$T=6$）和 interaction limit，使用 paired bootstrap interval 和 exact sign/McNemar test 进行推断。\n\n答案：**不能。** 每种现有更新在某些 setting 下优于 retry，但在其他 setting 下低于 retry。REFLEXION 在 DeepSeek 和 GPT 上提升 SR@6，但在 GLM 上两个环境均下降。DC-Cu$_\\ast$ 在三个 MiniWoB setting 上全部低于 retry。ACE$_\\ast$ 虽然在五个 setting 上为正，但在 GLM WebShop 上从 50% 降至 45%。没有任何一种现有更新能在全部六个 setting 上一致优于 retry。\n\n**问题 2：Reflection 的早期优势是否在更多 trial 中持续？使用 reflection 是否可能降低成功率？**\n\n实验设计：在 REFLEXION 原始的 AlfWorld（134 环境）和 HotPotQA（100 问题）上设计 replay-exposure sweep。固定 reflection writer，引入 withholding probability $\\varepsilon \\in \\{0, .25, .50, .75, 1\\}$，控制已写入的 reflection 以概率 $1-\\varepsilon$ 出现在下一次 Actor 上下文中。$\\varepsilon=0$ 为 full replay，$\\varepsilon=1$ 为无记忆续行。共记录 3,324 个 episode。\n\n答案：**不持续，使用 reflection 确实可以降低成功率。** 在 HotPotQA 上，full replay 在 $T_2$–$T_4$ 领先 no replay 1–2 个百分点，但在 $T_5$ 反超为 49% vs 50%。在 AlfWorld 上，full replay 在 $T_3$ 达到 76.1% 后停滞，而 $\\varepsilon=.25$ 继续上升至 81.3%。更重要的是，不同 replay schedule 恢复的是**互补的**失败子集：AlfWorld 上最佳单一 schedule 恢复 33/58 个共享失败，而五种 schedule 的 union 恢复 49/58。这揭示了 empirical exploration–exploitation trade-off——利用失败反馈可能锚定错误路线，而 fresh rollout 可能发现替代方案。\n\n**问题 3：语言模型能否作为 exploration–exploitation scheduler，在有限预算下持续优于 retry？**\n\n实验设计：提出 VEX$^{[2]}$，在上述六个 primary setting 中与 retry 和 REFLEXION 进行 paired 比较。VEX$^{[2]}$ 用 LM 在每次失败后生成 semantic policy tree、advisory allocation 和 next-trial guidance，联合决策探索与利用。使用与问题 1 相同的 paired 推断方法。\n\n答案：**能。** VEX$^{[2]}$ 是唯一在全部六个 setting 上 SR@6 点估计均为正的方法（+1.6 至 +17.0 pp），且在全部六个 setting 上 censored AvgT@6 均低于 retry。其中四个 setting 的 paired interval 排除零。恢复分析显示，VEX$^{[2]}$ 在 DeepSeek WebShop 上恢复了 22/61 个共享失败（retry 仅 6/61），且不丢失任何 retry 已解决的目标。AvgT@6 的改善主要来自恢复更多失败案例而非加速已有成功。", "additional_insights": "### § 8 Take-aways\n\nVRL-BENCH 提出了一个在 finite trial budget 下公平评估 trial-and-error learning 的框架，核心设计是让所有条件共享同一个 first trial ($T_1$)、匹配 trial 和 interaction budget，从而将\"跨 trial 学习带来的增益\"与\"单纯多一次尝试带来的增益\"分离。在该框架下，论文发现一个反直觉结果：REFLEXION、DC-Cu$_\\ast$、ACE$_\\ast$ 三种现有 verbal memory update 在 3 个模型 × 2 个 benchmark 的 6 个 setting 中，均未稳定优于 memory-free retry——某些 setting 下提升 SR@6，另一些 setting 下反而降低，且方向随模型变化而非仅随方法变化。通过在 AlfWorld 和 HotPotQA 上控制 reflection 的 replay 概率 $\\varepsilon$，论文揭示了 exploration-exploitation trade-off：full replay 的早期优势可能随 trial 数增加而消失（HotPotQA 上 $\\varepsilon=1$ 最终 50% 反超 $\\varepsilon=0$ 的 49%），且不同 replay schedule 恢复的失败案例是互补的（AlfWorld 上最佳单一 schedule 恢复 33 例，而五种 schedule 的 union 恢复 49 例）。基于此，VEX$^2$ 将 LM 作为 EE scheduler，在每次失败后生成 semantic policy tree、trial allocation 和 next-trial guidance，由 LM 决定哪些 policy 值得 exploit、哪些值得 explore，而非将所有失败反馈无差别地注入下一次尝试。VEX$^2$ 是唯一在全部 6 个 setting 中 SR@6 均高于 retry 的方法，增益范围为 MiniWoB +1.6 至 +6.6 pp、WebShop +8.0 至 +17.0 pp，同时 censored AvgT@6 在全部 6 个 setting 中下降。\n\n### § 9 最脆弱的假设\n\nVEX$^2$ 的核心贡献建立在一个关键假设上：**LM 生成的 semantic policy tree 和 trial allocation 真正驱动了 exploration-exploitation 的有效调度，而非仅仅是 scheduler 调用本身提供的额外结构化推理让 Actor 获得了更好的上下文。** 换言之，论文假设收益来自\"分配哪些 trial 给哪些 policy\"这一调度决策，而不是来自\"Actor 在下一次尝试前收到了一份对失败的结构化分析\"。\n\n这个假设在实际中可能不成立的原因是：VEX$^2$ 的 scheduler response 包含四个部分——EVIDENCE（失败分析）、TREE（策略树）、ALLOCATION（预算分配）、NEXT-ATTEMPT POLICY（下一步指导），其中 EVIDENCE 部分本质上是一种结构化的 failure reflection，与 REFLEXION 的 reflection 功能高度重叠。如果 Actor 的成功主要受益于 EVIDENCE 中的失败归因分析，而非 TREE/ALLOCATION 中的策略分支与预算分配，那么 VEX$^2$ 的核心创新（EE scheduling）就不是增益的真正来源，去掉 TREE 和 ALLOCATION 只保留 EVIDENCE 应能达到类似效果。\n\n论文缺少的关键证据是一个 ablation：将 VEX$^2$ 的完整 response 与仅包含 EVIDENCE+NEXT-ATTEMPT POLICY（去掉 TREE 和 ALLOCATION）的简化版本进行配对比较。论文在 Appendix F 中展示了 VEX$^2$ 的 prompt 结构和 realized response，但从未分离调度机制与结构化失败分析的贡献。Table 8 中 VEX$^2$ vs. REFLEXION 的比较虽然显著正向，但 REFLEXION 的 reflection 是自由文本而 VEX$^2$ 的 response 是结构化的四段式输出，两者在\"给 Actor 的信息量\"上并不可比。如果这个假设不成立——即增益主要来自结构化失败分析而非 EE 调度——那么 VEX$^2$ 的核心设计（policy tree + allocation）就是不必要的，一个更简单的\"结构化 reflection\"即可达到相同效果，论文关于\"将 EE 决策交给 LM\"这一核心主张将失去支撑。\n\n### § 10 最小复现实验\n\n在一周时间内，最值得复现的是论文 Section 4 的 replay exposure 实验，因为它直接验证论文最反直觉的 claim——**使用 reflection 可以降低成功率**——且不需要实现 VEX$^2$ 或完整的 VRL-BENCH harness。\n\n具体方案：使用 HotPotQA 的 100 个问题（与原文一致），以 GPT-4o-mini 作为 Actor，设置 $T=5$ 的 complete trial budget。实现两个条件：(1) Full replay（$\\varepsilon=0$）：每次失败后生成 reflection 并在后续所有 trial 中注入 Actor context；(2) No replay（$\\varepsilon=1$）：失败后仍生成 reflection 但不注入 Actor context，Actor 仅基于原始 task prompt 和 within-trial observations 进行 fresh trial。两个条件共享同一个 $T_1$，成功后 early stopping。测量 SR@5（5 次 trial 内的累积成功率）和 per-trial cumulative success curve。\n\n支持论文 claim 的结果：Full replay 在 $T_2$–$T_4$ 领先 No replay，但在 $T_5$ 被 No replay 追平或反超（原文中 $T_5$ 为 49% vs. 50%），且 No replay 在无 reflection 的情况下从 $T_1$ 的 36% 提升至 50%，恢复了 14 个 $T_1$ 失败的问题。如果 Full replay 在所有 trial 上均稳定领先 No replay，则反驳了\"reflection 可以降低成功率\"这一 claim，也削弱了 EE trade-off 存在的实证基础，进而质疑 VEX$^2$ 的设计动机。该实验仅需一个 LM Actor、一个 reflection writer 和一个简单的 trial loop，无需实现 policy tree、allocation 或任何调度逻辑，是最小代价下触及论文核心发现路径的复现方案。", "research_value": "### § 11 最强反例设计\n\n如果我要对这篇论文发起最有力的攻击，我会直击其最脆弱的假设：VEX$^{[2]}$ 的性能增益实际上来源于结构化失败分析（EVIDENCE 部分）带来的上下文增强，而非其宣称的 exploration-exploitation (EE) scheduling 机制（Semantic Policy Tree 与 Advisory Allocation）。我会设计一个 ablation experiment，构建一个名为 \"Structured-Reflexion\" 的对照基线。该基线保留 VEX$^{[2]}$ scheduler 响应中的 EVIDENCE 和 NEXT-ATTEMPT POLICY 部分，但强制剥离 TREE 和 ALLOCATION 结构，即不让语言模型进行显式的预算分配和策略分支构建，仅将结构化的失败归因原样传递给 Actor。如果在这个配对实验中，\"Structured-Reflexion\" 在 SR@6 和 censored AvgT@6 上表现出与 VEX$^{[2]}$ 统计上无显著差异的提升，甚至由于上下文更简洁而表现更好，那么就可以确凿地证明 VEX$^{[2]}$ 的核心创新——用 LM 充当 EE scheduler 进行显式预算分配——是完全多余的。这一结果将提供一个具体的替代解释：论文观察到的增益仅仅是因为 VEX$^{[2]}$ 的 prompt 结构迫使 scheduler 生成了一份比 REFLEXION 自由文本更高质量的失败归因报告，而非任何动态的跨尝试策略调度。此外，我还会进一步论证，在高度不可逆的计算机控制任务中，LM 生成的 Advisory Allocation 往往充满主观臆断，当 LM 对某个错误路径过度自信并分配过多 trial 时，显式 allocation 反而会锚定 Actor 浪费剩余预算，这意味着 VEX$^{[2]}$ 的复杂调度机制不仅无益，甚至在某些 failure modes 下可预测地劣于简单的结构化重试。\n\n### § 12 Follow-up Research Idea\n\n当前方法的核心局限在于，VEX$^{[2]}$ 依赖 LM 在推理时凭借主观直觉一次性生成全局的 policy tree 和 budget allocation，这种主观调度缺乏对环境反馈的客观校准，且无法利用连续的 partial reward 信号进行动态调整。这一未满足的需求驱动了一个全新的研究 framing：将 inter-trial learning 从 \"LM-as-Scheduler\" 的主观范式转变为 \"LM-as-Policy-Generator + Bayesian-Router\" 的客观范式。在这个新框架下，LM 不再负责决定“下一步试什么”和“预算怎么分”，而是仅负责在失败后生成一组多样化的、互斥的 candidate policies（发散）；随后，引入借鉴自 Multi-armed Bandit (MAB) 领域的 Thompson Sampling 机制，利用环境的 continuous reward（如 WebShop 中的 reward 0.6667）作为反馈信号，构建一个 Gaussian Process 或 Beta-Bernoulli 后验模型来客观评估每个 policy 的成功概率，并由该统计模型自主决定下一次 trial 执行哪个 policy（收敛）。\n\n这一提议与已有工作（如 VEX$^{[2]}$ 或 LATS）有着本质区别：VEX$^{[2]}$ 依赖 LM 的单次主观分配，LATS 依赖中间状态的 MCTS 搜索（在不可逆任务中失效），而本方法将“策略生成”与“策略调度”彻底解耦，用基于 partial reward 的统计推断替代 LM 的主观直觉，从而在不可逆环境中实现真正的自适应 EE trade-off。第一个实验将在 WebShop 上部署该框架：Actor 在 $T_1$ 失败后，LM 生成 $K$ 个 candidate policies，但不附带 allocation。Harness 维护这 $K$ 个 arms 的 Beta 分布，在每次 trial 前通过 Thompson Sampling 采样选择期望 reward 最高的 policy 交给 Actor 执行，并根据环境返回的 continuous reward 更新该 arm 的后验分布。如果该 Bayesian-Router 在相同的 finite trial budget 下，其 SR@6 能够稳定超越 VEX$^{[2]}$ 的主观 LM allocation，尤其是在存在误导性 partial reward 的任务中，这将证明客观的统计推断比 LM 的内省更适合处理有限预算下的探索与利用困境。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yu Bai\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yukai Miao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Dawei Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Li Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yanyu Ren\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yuqian Shi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Dan Li\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Ying Xiong\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Chengqiu Tan\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Run Zhou\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Li Li\", \"affiliations\": [3], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Zhongguancun Laboratory\"},\n    {\"id\": 2, \"name\": \"Tsinghua University\"},\n    {\"id\": 3, \"name\": \"Network Management Center, China Mobile\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "从试错中学习是提升语言智能体在计算机控制等复杂任务上表现的一种有前景的方法。Reflexion 引入了 verbal reinforcement learning，该方法将失败的尝试转化为文本，在不更新模型参数的情况下指导后续的尝试。我们引入了 VRL-Bench，这是一个用于在有限尝试预算下公平评估试错学习的测试框架。在 MiniWoB 和 WebShop 上的三个模型中，我们评估了涵盖 Reflexion 及后续工作的几种著名的 verbal-memory methods 的更新：每种方法在某些设置下相对于 memory-free retry 提升了 observed success rates，但在其他设置下却降低了它。Replay 实验表明，使用 reflection 会降低 success rates，揭示了利用经验与持续探索之间的 trade-off。我们提出了 VEX$^2$，这是一个 verbal exploration--exploitation scheduler，它使用语言模型来联合选择 policies 并分配剩余的尝试预算。VEX$^2$ 是唯一在所有六个设置中相对于 retry 实现了正的 observed success-rate gains 的评估更新。"}]}, {"name": "Agent Training \u0026 Adaptation", "count": 3, "papers": [{"title": "Behavior Quotient Learning for Low-Rank Adaptation of LLM Agents", "arxiv_id": "2609.12896", "authors": "Pengyang Zhou, Xiaobin Tu, Zhengxi Liu, Rongkun Xue, Haochen Li, Miancan Liu, Ziyuan Chen, Yinggui Wang, Jinkui Ren, Xiantao Zhang", "summary": "LLM-based agents rely on heterogeneous interaction capabilities to accomplish complex tasks. Existing approaches often distribute these capabilities across multiple LoRA adapters, which increases adapter storage requirements and introduces routing overhead during inference. A single LoRA avoids this overhead, but learning from diverse agent trajectories under a fixed rank budget presents two challenges. First, trajectories with different interaction traces and parameter gradients can induce equivalent changes in decision distributions, causing repeated updates to overemphasize redundant behavioral changes. Second, an aggregated update may exceed the rank budget of the adapter, and approximating it in weight space can distort the decision changes that it is intended to produce. We propose BQ-LoRA, a low-rank adaptation framework that organizes trajectory updates through a local behavior quotient manifold. It contains two modules, i.e., behavior quotient balancing (BQB) and decision preserving compression (DPC). BQB constructs the quotient manifold from decision distributions and reweights trajectory update directions according to their local density in the quotient tangent space. DPC projects the balanced gradient onto the intrinsic fixed rank tangent space and refactorizes the resulting target by jointly controlling effective weight error and distortion of decision distributions. Experiments on AppWorld and BrowseComp-Plus compare BQ-LoRA with standard LoRA and recent low-rank adaptation methods, while separate ablations evaluate the complementary contributions of both components.", "category": "cs.LG", "cluster": "Agent Training \u0026 Adaptation", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的研究问题是：如何在固定的 rank budget 下，使用单个 LoRA adapter 有效地从多样化的 agent trajectories 中学习异构交互行为。这个问题至关重要，因为 LLM-based agents 需要处理复杂的多步交互任务，而现有的 multi-adapter 方案（如为推理、执行分配不同 LoRA）会显著增加存储需求并引入 inference-time routing overhead。虽然单 adapter 避免了这些开销，但直接从 diverse trajectories 学习会引发“behavioral redundancy”问题：具有不同 interaction traces 和 parameter gradients 的 trajectories 可能对 decision distributions 产生等效的改变。在固定 rank budget 下，这种重复的等效更新会过度主导 adapter 的学习，导致具有独特行为效应的更新被忽视。此外，当聚合的 diverse updates 超过 rank budget 时，在 weight space 中进行近似会扭曲预期的 decision changes。解决这一问题能够以极低的工程和部署成本，使单个 fixed-rank LoRA 实现甚至超越多 adapter 架构的性能，最大化有限参数预算下的行为覆盖度与任务执行效率。\n\n### § 2 前人工作与不足\n针对这一问题，前人研究主要沿三条路径展开，但均存在根本性不足。第一条路径是 multi-LoRA 架构（如 MoRAgent, DART），它们通过为不同 agent capabilities 分配专门的 adapters 并在推理时进行路由来规避单 adapter 的容量瓶颈。然而，这种方法依赖于预定义的 capability partitions，且在 multi-agent workflows 中面临高昂的 adapter management 和 serving costs，未能从根本上解决在单一参数空间内融合异构行为的挑战。第二条路径是 trajectory curation 与优化信号评估（如 TopoCurate, ATLAS），它们试图在训练前或训练中筛选出高质量的 supervision。例如，TopoCurate 通过 tool actions 和 environment observations 的 embedding similarities 来估计 semantic equivalence。但这些方法定义在记录的交互内容上，无法确定不同的 parameter gradients 是否会在相同的 reference histories 下引发相同的 decision representation 变化，因此无法消除优化过程中的 behavioral redundancy。第三条路径是 single-adapter 的几何优化方法（如 LoRA-S），它通过 Sylvester equation 在 quotient manifold 上优化 low-rank factors。虽然它消除了相同 effective weights 的冗余自由度，但其 equivalence relation 仅局限于 factorization 层面，完全忽略了不同 trajectories 诱导的 behavioral equivalence。最后，在处理超过 rank budget 的聚合更新时，传统的 weight-space approximation（如 SVD）仅最小化权重误差，但由于 behavior map 对不同 residual directions 的敏感度不同，相同的权重误差会导致不同程度的 decision distortion，前人方法缺乏在 rank compression 过程中显式保留 decision changes 的机制。", "core_insight": "### § 3 重建作者的思考路径\n\nLLM-based agents 在处理复杂任务时，通常依赖多种异构交互能力。为了高效适配这些能力，现有工作往往采用 multiple LoRA adapters 进行角色或功能划分，但这不可避免地带来了推理时的 routing overhead 和存储成本。如果退而求其次，使用 single LoRA adapter 从多样的 interaction trajectories 中学习，虽然避免了管理开销，但立刻面临一个核心困境：在固定的 rank budget 下，如何让有限的参数容量吸收轨迹中高度多样的行为模式？\n\n作者敏锐地观察到，不同的轨迹更新即使在 interaction traces 和 parameter gradients 上存在显著差异，它们也可能在相同的 reference histories 下引起等效的 decision distribution 变化。这种 behavioral redundancy 意味着，如果均匀地对待所有轨迹，那些在行为上高度重叠的更新会过度消耗有限的低秩容量，而真正带来独特行为变化的轨迹反而被淹没。现有的 trajectory curation 方法（如基于语义相似性的 TopoCurate）仅仅在数据层面筛选轨迹，无法识别这种基于“行为效果”的等效性，因为它们没有触及模型决策表示的实际变化。\n\n为了在数学上精确刻画这种“行为等效性”，作者自然地转向了 quotient manifold 的理论。通过定义一个 behavior map，将参数空间中的 effective updates 映射到固定交互历史下的 normalized decision representations，可以构建一个 behavior quotient geometry。在这个商流形上，那些对决策表示不产生影响的参数差异被垂直空间吸收，从而使得行为上的重叠变得可度量。基于这一几何结构，作者设想通过比较不同轨迹更新方向在 quotient tangent space 中的 local density，来动态调整它们的权重：行为响应高度集中的方向被降权，而独特的行为变化获得更大影响力，这就是 BQB 的理论雏形。\n\n然而，平衡后的聚合更新方向往往超出了 LoRA 的 rank budget。传统的低秩近似仅仅最小化 weight-space error，但这并不能保证保留原始更新对决策表示的预期改变，因为相同的权重误差可能导致不同程度的决策扭曲。作者意识到，压缩过程也必须在相同的 behavior geometry 下进行。因此，他们提出将平衡后的方向投影到当前 LoRA factors 诱导的 tangent space 上形成 affine target，并在 rank 约束下对其进行 refactorization。此时的优化目标不仅包含权重近似误差，还显式地加入了 first-order decision distortion 的惩罚项，确保压缩后的低秩表示能够最大程度地保持目标行为效果，这构成了 DPC 的核心逻辑。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 在于：评估 agent 轨迹多样性的标准不应停留在数据语义或参数梯度层面，而应深入到模型在固定交互历史下的“决策表示变化”这一行为空间。通过在 behavior quotient geometry 中识别并降权那些引起等效决策变化的冗余轨迹更新，并在低秩压缩时显式惩罚对决策表示的扭曲，单个固定秩的 LoRA 便能突破容量瓶颈，有效吸收真正多样的 agent 行为。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n┌─────────────────────────────────────────────────────────────┐\n│                     BQ-LoRA Training Loop                    │\n│                                                             │\n│  Trajectories {τ₁..τ_N}                                     │\n│         │                                                   │\n│         ▼                                                   │\n│  ┌──────────────┐    Behavior Map Φ_T    ┌───────────────┐  │\n│  │ Compute task │───► (normalized ──────►│ Behavior      │  │\n│  │ directions   │    decision reprs)     │ Quotient      │  │\n│  │ U_i = -∇_X ℓ│                        │ Manifold M_T  │  │\n│  └──────────────┘                        └───────┬───────┘  │\n│         │                                       │          │\n│         │    Quotient tangent distances          │          │\n│         │    \u0026 Gaussian affinities ρ_i           │          │\n│         ▼                                       ▼          │\n│  ┌──────────────┐                        ┌───────────────┐  │\n│  │ BQB: Reweight│  w_i ∝ ρ_i^(-α)       │ DPC: Intrinsic│  │\n│  │ trajectories │──► U_BQ = Σ w_i·U_i ──►│ Projection    │  │\n│  │ by behavior  │                        │ onto T_X R_r  │  │\n│  │ density      │                        │ (tangent space│  │\n│  └──────────────┘                        │  of rank-r    │  │\n│                                           │  manifold)    │  │\n│                                           └───────┬───────┘  │\n│                                                   │          │\n│                                    Affine Target   │          │\n│                                    T_l = X_l +     ▼          │\n│                                    η·Proj(U_BQ,l)  │          │\n│                                           ┌───────────────┐  │\n│                                           │ DPC: Fixed-   │  │\n│                                           │ Rank Refactor │  │\n│                                           │ min‖Z-T‖²_F +  │  │\n│                                           │ γ‖DΦ_T(Z-T)‖² │  │\n│                                           └───────┬───────┘  │\n│                                                   │          │\n│                                    Compressed X⁺  │          │\n│                                    = s·B⁺A⁺       ▼          │\n│                                           ┌───────────────┐  │\n│                                           │ Updated LoRA  │  │\n│                                           │ Factors B⁺,A⁺│  │\n│                                           │ (rank ≤ r_l)  │  │\n│                                           └───────┬───────┘  │\n│                                                   │          │\n│                              ┌────────────────────┘          │\n│                              ▼                               │\n│                     (repeat for next batch)                  │\n│                                                             │\n│  Inference: single fixed-rank adapter deployed directly     │\n└─────────────────────────────────────────────────────────────┘\n```\n\n**Pipeline 步骤详解：**\n\n1. **输入与任务方向计算（§4.1）**：输入为 N 条 agent trajectories $\\mathcal{T}=\\{\\tau_i\\}_{i=1}^N$，每条轨迹包含任务 $x_i$、交互历史 $h_{ik}$、agent 输出 $y_{ik}$ 和环境反馈 $o_{ik}$。对每条轨迹计算 task direction $\\mathbf{U}_i = -\\nabla_{\\mathbf{X}} \\ell_i(\\mathbf{X})$，即在 effective-update space 中对任务损失求负梯度。当前模型参数为 LoRA effective update $\\mathbf{X} = (\\mathbf{X}_l)_{l=1}^L$，其中 $\\mathbf{X}_l = s_l \\mathbf{B}_l \\mathbf{A}_l$，rank 受限于 $r_l$。\n\n2. **Behavior Quotient Geometry 构建（§4.3）**：在固定的 reference decision histories 上，构造 behavior map $\\Phi_{\\mathcal{T}}(\\mathbf{X})$，它将 effective update 映射到所有 reference decision 的归一化表示向量。具体地，对每个 decision $a_{ik}$ 的每个生成位置 $t$，取前缀 $h_{ik,t}$（包含已记录的 reasoning 和先前 decision tokens），提取 final hidden representation $f_{\\mathbf{X}}(h_{ik,t})$，对所有位置、decision 和轨迹取平方响应的均值。两个 effective update 在此 map 下产生相同输出即定义为 behaviorally equivalent，形成 quotient manifold $\\mathcal{M}_{\\mathcal{T}} = \\mathcal{O}/\\sim_{\\mathcal{T}}$。Quotient tangent space 识别出在 reference decisions 上具有相同一阶响应的方向，即差异落在 $\\ker D\\Phi_{\\mathcal{T}}(\\mathbf{X})$ 中的方向对。\n\n3. **BQB: Trajectory Update Balancing（§4.3）**：将每条轨迹的 task direction $\\mathbf{U}_i$ 映射到 quotient tangent space，得到 behavior response $D\\Phi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{U}_i]$。通过 quotient metric 计算两两方向间的距离——该距离可直接从 behavior responses 计算，使用 Jacobian-vector products 而无需显式构造 quotient 坐标。基于这些距离，用 Gaussian affinities 累积每个方向周围的 overlap，得到 local density $\\rho_i$。权重设为 $w_i \\propto \\rho_i^{-\\alpha}$（$\\alpha \\in [0,1]$），归一化后 $\\sum_i w_i = N$。$\\alpha=0$ 退化为均匀加权；$\\alpha\u003E0$ 时，behaviorally redundant 的轨迹（高 $\\rho_i$）权重降低，distinct behavioral changes 获得更大相对影响。加权聚合得到 balanced direction $\\mathbf{U}_{BQ} = \\frac{1}{N}\\sum_i w_i \\mathbf{U}_i$。\n\n4. **DPC: Intrinsic Update Projection（§4.4）**：balanced direction $\\mathbf{U}_{BQ}$ 存在于 effective-update space 中，但 LoRA 通过 low-rank factors 改变权重，该方向可能包含 factors 无法一阶实现的部分。对每层 $l$，在 rank-$r_l$ 矩阵流形 $\\mathcal{R}_{r_l}$ 上，当前 iterate 的 tangent space 为 $T_{\\mathbf{X}_l}\\mathcal{R}_{r_l} = \\{\\mathbf{B}_l \\dot{\\mathbf{A}}_l + \\dot{\\mathbf{B}}_l \\mathbf{A}_l\\}$。用 Frobenius 正交投影将 $\\mathbf{U}_{BQ,l}$ 投影到该 tangent space，投影算子依赖 $\\mathbf{X}_l$ 的列空间和行空间（$\\mathbf{P}_l\\mathbf{P}_l^\\top$ 和 $\\mathbf{Q}_l\\mathbf{Q}_l^\\top$），因此对等价 LoRA factorization 不变。投影后乘以学习率 $\\eta$ 得到 affine target $\\mathbf{T}_l = \\mathbf{X}_l + \\eta \\cdot \\text{Proj}_{\\mathbf{X}_l}(\\mathbf{U}_{BQ,l})$。此时 $\\text{rank}(\\mathbf{T}_l) \\leq 2r_l$，可能超出 rank budget。\n\n5. **DPC: Fixed-Rank Refactorization（§4.4）**：当 $\\text{rank}(\\mathbf{T}_l) \u003E r_l$ 时，需在 rank 约束下压缩 target。候选集 $\\mathcal{C}(\\mathbf{T})$ 要求每层 $\\text{rank}(\\mathbf{Z}_l) \\leq r_l$ 且列空间和行空间被限制在 $\\mathbf{T}_l$ 的列空间和行空间内。优化目标联合最小化两项：第一项 $\\|\\mathbf{Z}_l - \\mathbf{T}_l\\|_F^2$ 衡量 effective-weight approximation error；第二项 $\\gamma\\|D\\Phi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{Z} - \\mathbf{T}]\\|^2$ 衡量将 target 替换为 candidate 后引入的 first-order decision distortion，使用与 BQB 相同的 behavior geometry。系数 $\\gamma \u003E 0$ 控制两者间的 tradeoff。由于列/行空间约束，优化可通过大小至多 $2r_l \\times 2r_l$ 的 core 矩阵完成。压缩后 refactorize 为 $\\mathbf{X}_l^+ = s_l \\mathbf{B}_l^+ \\mathbf{A}_l^+$，满足原始 rank budget。\n\n6. **迭代与推理（§4.2, §5）**：上述 BQB → DPC 两阶段在训练中反复执行。推理时直接部署单个 fixed-rank LoRA adapter，无需 adapter routing 或多 adapter 协调。评测在 AppWorld（多步 API 交互任务）和 BrowseComp-Plus（深度搜索任务）上进行，测量 task accuracy/recall 和 interaction counts。\n\n### § 6 核心数学推导\n\n本文的数学核心建立在 **quotient manifold** 理论之上，以下逐步解释关键推导。\n\n**背景：Quotient Manifold（§3）**\n\n给定光滑流形 $\\mathcal{M}$ 和等价关系 $\\sim$，将等价的点归为同一 equivalence class $[x]$，所有 class 构成 quotient set $\\mathcal{M}/\\sim$。若 canonical projection $\\pi: \\mathcal{M} \\to \\mathcal{M}/\\sim$ 是光滑 submersion（即 $D\\pi(x)$ 处处满秩），则 $\\mathcal{M}/\\sim$ 成为 quotient manifold。每个 $x$ 处的 vertical space $V_x = \\ker D\\pi(x)$ 包含\"沿等价类内部移动\"的切方向——这些方向在 quotient 空间中不可区分。两个切向量 $\\mathbf{u}, \\mathbf{v} \\in T_x\\mathcal{M}$ 在 quotient tangent space 中代表同一向量，当且仅当 $\\mathbf{u} - \\mathbf{v} \\in V_x$。\n\n**Intuition**：想象你站在一个山坡上（total space），只关心海拔高度（quotient space）。沿等高线走（vertical direction）不改变海拔，所以这些方向在\"海拔空间\"中是看不见的。Quotient geometry 就是把\"看不见的差异\"除掉，只保留可区分的变化。\n\n**Behavior Map 与等价关系（§4.3）**\n\n定义 behavior map $\\Phi_{\\mathcal{T}}: \\mathcal{W} \\to \\mathbb{R}^{d_{\\text{hid}}}$，将 effective update $\\mathbf{X}$ 映射为所有 reference decision positions 上归一化的表示响应。等价关系定义为：$\\mathbf{X} \\sim_{\\mathcal{T}} \\mathbf{X}'$ 当且仅当 $\\Phi_{\\mathcal{T}}(\\mathbf{X}) = \\Phi_{\\mathcal{T}}(\\mathbf{X}')$。\n\n**Intuition**：两条轨迹可能在参数空间中梯度差异很大，但如果它们在所有参考决策点上引起的 hidden representation 变化相同，那么对 agent 行为而言它们是等价的。参数空间的距离会高估行为多样性，因为它包含了\"在参考决策上不可见\"的成分。\n\n**Quotient Tangent Distance（§4.3）**\n\n在当前 iterate $\\mathbf{X}$ 处，quotient tangent space 中的距离通过 behavior response 直接计算：\n\n$$g(D\\pi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{u}], D\\pi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{v}]) = \\langle D\\Phi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{u}], D\\Phi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{v}] \\rangle$$\n\n**Intuition**：两个更新方向的 quotient 距离就是它们的一阶 behavior response 的内积。如果两个方向在所有参考决策上引起相同的一阶表示变化，它们的 quotient 距离为零——无论参数空间中差多远。这使得距离计算可通过 Jacobian-vector products 完成，无需显式构造 quotient 坐标。\n\n**Gaussian Affinity 加权（§4.3）**\n\n每条轨迹的 local density 通过 Gaussian affinities 计算：\n\n$$\\rho_i = \\frac{1}{N} \\sum_{j=1}^{N} \\exp\\left(-\\frac{g(D\\pi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{U}_i], D\\pi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{U}_j])}{2\\sigma_{\\mathcal{T}}^2}\\right)$$\n\n权重 $w_i \\propto \\rho_i^{-\\alpha}$，归一化 $\\frac{1}{N}\\sum_i w_i = 1$。\n\n**Intuition**：$\\rho_i$ 衡量有多少其他轨迹在 behavior quotient space 中靠近 $\\mathbf{U}_i$。$\\rho_i$ 大意味着该行为变化被大量轨迹重复代表。取 $\\rho_i^{-\\alpha}$ 作为权重，就是在降低冗余行为的贡献、提升独特行为的贡献。$\\alpha$ 控制校正强度：$\\alpha=0$ 不校正，$\\alpha=1$ 在组间 overlap 足够小时近似等化各组的总贡献。\n\n**Tangent Space Projection（§4.4）**\n\nrank-$r$ 矩阵流形 $\\mathcal{R}_r$ 在 $\\mathbf{X}_l$ 处的 tangent space 为 $T_{\\mathbf{X}_l}\\mathcal{R}_{r_l} = \\{\\mathbf{B}_l \\dot{\\mathbf{A}}_l + \\dot{\\mathbf{B}}_l \\mathbf{A}_l\\}$。Frobenius 正交投影为：\n\n$$\\text{Proj}_{\\mathbf{X}_l}(\\mathbf{U}_{BQ,l}) = \\mathbf{P}_l \\mathbf{P}_l^\\top \\mathbf{U}_{BQ,l} + \\mathbf{U}_{BQ,l} \\mathbf{Q}_l \\mathbf{Q}_l^\\top - \\mathbf{P}_l \\mathbf{P}_l^\\top \\mathbf{U}_{BQ,l} \\mathbf{Q}_l \\mathbf{Q}_l^\\top$$\n\n其中 $\\mathbf{P}_l$ 和 $\\mathbf{Q}_l$ 分别张成 $\\text{col}(\\mathbf{X}_l)$ 和 $\\text{col}(\\mathbf{X}_l^\\top)$。\n\n**Intuition**：第一项保留可通过当前列空间实现的部分，第二项保留可通过当前行空间实现的部分，第三项减去两者共享的部分（避免重复计算）。该投影只依赖 $\\mathbf{X}_l$ 的列空间和行空间，不依赖具体的 factorization $(\\mathbf{B}_l, \\mathbf{A}_l)$，因此对等价 factorization 不变——不同的 $(\\mathbf{B}, \\mathbf{A})$ 只要乘积相同，投影结果就相同。\n\n**Fixed-Rank Refactorization 目标（§4.4）**\n\n$$\\min_{\\mathbf{Z} \\in \\mathcal{C}(\\mathbf{T})} \\sum_l \\|\\mathbf{Z}_l - \\mathbf{T}_l\\|_F^2 + \\gamma \\|D\\Phi_{\\mathcal{T}}(\\mathbf{X})[\\mathbf{Z} - \\mathbf{T}]\\|^2$$\n\n**Intuition**：第一项是标准的低秩近似——在 Frobenius 范数下逼近 target。但等量的 weight error 在不同方向上引起的 decision distortion 不同，因为 behavior map 对某些残差方向更敏感。第二项用与 BQB 相同的 behavior geometry 来惩罚 decision distortion，确保压缩保留了对参考决策最重要的部分。$\\gamma$ 控制两者 tradeoff：$\\gamma$ 小偏重 weight 逼近，$\\gamma$ 大偏重 decision 保持。候选集限制在 target 的列/行空间内，使优化可在 $2r_l \\times 2r_l$ 的 core 上完成，计算高效。\n\n### § 7 实验设计与结论\n\n**问题 1：单个 fixed-rank LoRA 能否有效学习 diverse agent behaviors，同时避免 multi-adapter 的存储和 routing 开销？**\n\n实验设计：在 AppWorld（多步 API 交互）和 BrowseComp-Plus（深度搜索）两个 benchmark 上，使用 Qwen3.5-4B 和 9B 两种 backbone，将 BQ-LoRA 与七种 baseline 对比：Base（无适配）、Full FT（全参数微调）、标准 LoRA、LoRA-S（quotient manifold 上的单 adapter 优化）、MoRAgent（多角色 LoRA）、DART（推理/工具使用分离 LoRA）、TopoCurate（语义拓扑轨迹筛选）。测量 task accuracy/recall 和 interaction counts（步数/搜索次数）。\n\n答案：BQ-LoRA 在八项性能指标的平均上超过最强 baseline MoRAgent 2.14（4B）和 2.12（9B）个百分点，同时在所有设置下取得最低 interaction counts。这表明行为级冗余平衡和 decision-preserving 压缩使单个 fixed-rank adapter 能有效覆盖 diverse behaviors，同时提升任务性能和交互效率。\n\n**问题 2：BQB 和 DPC 两个模块各自的贡献是什么？两者是否互补？**\n\n实验设计：Ablation study 在 AppWorld（TGC 指标）和 BrowseComp-Plus（accuracy）上移除各模块：BQ-LoRA w/o BQB（仅 DPC）、BQ-LoRA w/o DPC（仅 BQB），与完整方法和标准 LoRA 对比。\n\n答案：移除 BQB 在 Test-C 上分别下降 3.57（4B）和 3.83（9B）个百分点，在 BrowseComp-Plus 上也下降，支持按 decision representation 效果平衡轨迹更新的价值；Test-C 下降大于 Test-N，说明平衡的收益因评测设置而异。移除 DPC 在全部八项设置中均下降，平均下降 3.64（4B）和 3.57（9B）个百分点，支持在 rank 约束压缩时保持 decision changes 的重要性。完整方法在八项中七项领先；两个 partial variant 均在所有设置上超过标准 LoRA，表明各模块独立有效且互补。保留 DPC 的平均性能高于仅保留 BQB，说明 decision-preserving 压缩的贡献略大于行为平衡。\n\n**问题 3：超参数 $\\alpha$（平衡指数）和 $\\gamma$（压缩系数）如何影响性能？**\n\n实验设计：固定一个超参数为 1，扫描另一个：$\\alpha \\in \\{0, 0.25, 0.5, 0.75, 1\\}$，$\\gamma \\in \\{0.1, 0.3, 0.5, 0.8, 1, 3, 10\\}$。报告八项性能指标的平均值。\n\n答案：$\\alpha$ 方面，4B 在 $\\alpha=0.75$ 处最优、9B 在 $\\alpha=1$ 处最优，两者均优于 $\\alpha=0$（均匀加权），验证了 density-based balancing 的必要性；4B 曲线在高端趋平而 9B 持续上升，表明更大模型可承受更激进的冗余抑制。$\\gamma$ 方面，两种 backbone 均在 $\\gamma=0.8$ 处最优，附近值仍有竞争力；性能在两端（过小偏重 weight 逼近、过大偏重 decision 保持）均下降，支持 weight fidelity 与 decision preservation 之间存在中间最优 tradeoff，该模式在跨越两个数量级的 $\\gamma$ 扫描中一致。", "additional_insights": "### § 8 Take-aways\nBQ-LoRA 提出了一种基于单一 fixed-rank LoRA adapter 学习 diverse agent behaviors 的框架，避免了 multi-adapter 设计带来的存储与 routing 开销。其核心模块 Behavior Quotient Balancing (BQB) 通过比较不同 trajectory updates 对 reference decision representations 的 first-order effects 来识别 behavioral equivalence，并根据 quotient tangent space 中的 local density 对更新方向进行 reweight，从而抑制冗余行为并提升独特行为的贡献。另一个模块 Decision Preserving Compression (DPC) 将平衡后的梯度投影到 fixed-rank tangent space，并在压缩回原始 rank budget 时联合控制 weight approximation error 与 first-order decision distortion，确保 rank reduction 不会破坏预期的决策变化。在 AppWorld 和 BrowseComp-Plus 上的实验表明，该方法在性能上超越了 multi-LoRA 和 trajectory curation baselines，同时显著降低了 agent 完成任务所需的 interaction counts。\n\n### § 9 最脆弱的假设\nBQ-LoRA 最脆弱且失败代价最大的假设是：不同 trajectory updates 在固定 reference histories 上对 normalized decision representations 产生的 first-order effects 相同，就意味着它们在行为上是等价且冗余的。这个假设在实际多步交互的 agent 环境中极易不成立，因为 agent 的状态空间是动态且广阔的。两个在当前 reference histories 上产生相同一阶响应的更新，在模型偏离参考点进入未见过的 states 后，可能会引发截然不同的后续行为。BQB 仅依赖局部 quotient tangent space 的 first-order approximation，忽略了高阶交互和长期轨迹的分布偏移。论文虽然通过 ablation study 证明了移除 BQB 会导致性能下降（尤其在 Test-C 上），但并未提供证据表明这些被 down-weighted 的“等价”更新在多步 rollout 中不会产生分歧，也缺少对 first-order approximation 在动态环境全局有效性的验证。如果这个局部等价假设失效，BQB 可能会错误地抑制对未来决策至关重要的更新，导致核心贡献直接崩塌。\n\n### § 10 最小复现实验\n在一周时间内，可以针对 BQB 模块的核心 claim 进行最小复现实验：验证基于 first-order decision effects 对 trajectory updates 进行 reweighting 是否能减少 behavioral redundancy 并提升效率。使用 AppWorld 数据集收集的一小批成功 trajectories，并选择较小的 backbone（如 Qwen3.5-4B）以降低算力需求。实现一个简化版的 BQB：在标准 LoRA 训练的每个 batch 中，计算各 trajectory 的 task gradient，利用 Jacobian-vector products 评估它们在固定 reference histories 上对 decision representations 的 first-order effects，计算 pairwise quotient distances 并通过 Gaussian affinities 分配非均匀 weights，最后以这些 weights 聚合梯度进行更新。测量指标为 AppWorld Test-N 子集上的 task accuracy 和 average interaction steps，并与采用 uniform weighting 的标准 LoRA 进行对比。如果 reweighted LoRA 在保持或提高 accuracy 的同时显著降低了 average interaction steps，则支持论文关于减少冗余行为能提升 agent 效率的 claim；若性能下降或交互步数反而增加，则反驳了该 claim，说明 first-order reweighting 可能错误抑制了关键行为更新。", "research_value": "### § 11 最强反例设计\n\n最有力的攻击应针对 BQB 的核心假设：first-order decision effects on fixed reference histories 足以判定 behavioral equivalence。我设计一个基于 **branching MDP with asymmetric coverage** 的反例场景。\n\n考虑一个 multi-step agent task，其 trajectory tree 在第二步产生两个互斥的分支：Branch A（占训练轨迹的 80%）要求 agent 调用 search API 后执行 summarize，Branch B（占 20%）要求直接调用 compute API 后执行 format。假设 reference decision histories 主要从 Branch A 的成功轨迹中采样（因为它们数量占优且成功率更高），那么 reference histories 对 Branch B 的 decision positions 覆盖极低。现在有两条 trajectory updates：$U_1$ 来自 Branch A 的轨迹，主要强化 search→summarize 的决策路径；$U_2$ 来自 Branch B 的轨迹，强化 compute→format 的决策路径。由于 reference histories 几乎不包含 compute 和 format 的 decision positions，$U_2$ 在这些 positions 上的 first-order behavior response 接近零——不是因为 $U_2$ 不重要，而是因为 reference set 对 $U_2$ 的作用域存在系统性盲区。结果是 $U_1$ 和 $U_2$ 在 quotient tangent space 中的距离极小，BQB 判定它们 behaviorally equivalent，将 $U_2$ 的权重压低。但 $U_2$ 携带的是 Branch B 独有的、不可被 $U_1$ 替代的行为信息。在部署时，当 agent 遇到需要 Branch B 路径的任务时，由于该行为在训练中被 down-weight 甚至忽略，agent 会 fallback 到 Branch A 的策略，导致任务失败或 interaction count 暴增。\n\n这个反例的杀伤力在于它不需要构造极端分布——只要训练数据中不同行为模式的频率不均匀（这在真实 agent trajectories 中是常态），reference set 就会自然偏向高频模式，而 BQB 的 density-based reweighting 会系统性地放大这种偏向，将低频但行为上不可替代的 updates 判定为冗余。论文的 ablation study 中 Test-C 下降大于 Test-N 的现象实际上已经暗示了这个问题：Test-C 包含 compositionally novel tasks，更需要低频行为的覆盖，而移除 BQB 反而缓解了对这些行为的抑制。论文将此解释为\"平衡收益因评测设置而异\"，但更合理的替代解释是 BQB 在 Test-C 上产生了 negative transfer——它主动伤害了对 novel compositions 至关重要的低频行为学习。要验证这一替代解释，只需在 Test-C 上比较 BQ-LoRA 与 uniform-weighting baseline 在低频行为子任务上的 per-task breakdown：如果 BQ-LoRA 在高频子任务上提升但在低频子任务上显著退化，则证明 BQB 的收益来自牺牲行为覆盖而非消除真正冗余。\n\n### § 12 Follow-up Research Idea\n\n**Trajectory-Distributional Behavioral Equivalence via Optimal Transport**\n\nBQ-LoRA 的根本局限在于它将 behavioral equivalence 定义为局部、一阶、基于固定参考点的性质。但 agent 的行为本质上是 trajectory-level 的：一个 update 的真正行为效应不是它在某个 decision position 上引起的 hidden representation 变化，而是它如何改变 agent 在整个 task 上的 trajectory distribution。两个在参考点上 first-order equivalent 的 updates 可能在 rollout 中诱导截然不同的 trajectory distributions——因为多步交互中，早期决策的微小差异会通过 environment dynamics compound 成完全不同的 state visitation 和 action sequence。这个 gap 不是可以通过增加参考点或引入高阶展开来弥合的，因为问题的本质是 distributional 而非 local。\n\n我提议将 behavioral equivalence 从 decision representation level 提升到 trajectory distribution level，用 **Wasserstein distance between induced trajectory distributions** 作为 behavioral metric。具体地，给定当前 policy $\\pi_\\mathbf{X}$ 和一个 update direction $\\mathbf{U}$，定义 perturbed policy $\\pi_{\\mathbf{X}+\\epsilon\\mathbf{U}}$，从两者各采样一组 trajectories，计算两组 trajectory distributions 之间的 Wasserstein-$k$ 距离作为 $\\mathbf{U}$ 的 behavioral signature。两个 updates $\\mathbf{U}_i, \\mathbf{U}_j$ 在 trajectory-distributional sense 下 equivalent 当且仅当它们各自诱导的 trajectory distribution shifts 相同。这个 equivalence relation 自然形成 quotient manifold，但其 vertical space 包含的是\"不改变 trajectory distribution\"的 parameter directions——这比\"不改变 reference decision representations\"严格得多，也正确得多。\n\n这个 framing 与已有工作的区别是根本性的。BQ-LoRA 和 LoRA-S 都在 parameter 或 representation space 中定义 equivalence；trajectory curation 方法（如 TopoCurate）在 semantic content space 中定义相似性；而本提议在 **trajectory distribution space** 中定义 equivalence，使用 OT 作为几何结构。这连接到 imitation learning 中的 behavioral distance literature（如 GAIL 的 discriminator-induced distance）和 RL 中的 policy distance metrics（如 Wasserstein policy gradient methods），但将其应用于 parameter-efficient fine-tuning 的 quotient construction 是全新的。关键的技术挑战是 trajectory distribution 的高维性和不可枚举性，但可以借鉴 diffusion-based trajectory models 或 trajectory VAE 将 trajectories 嵌入到低维 latent space，在 latent space 中计算 Wasserstein distance 作为 surrogate。另一个可借鉴的工具是 sliced Wasserstein distance，它通过随机投影将高维 OT 降为一维 OT 的期望，计算效率高且 sample complexity 友好。\n\n第一个实验应在一个人工构造的 branching MDP 上进行，该 MDP 具有明确的两个 trajectory modes 且 reference decision histories 只覆盖其中一个 mode。比较三种方法：(1) 标准 LoRA with uniform weighting，(2) BQ-LoRA（first-order decision representation equivalence），(3) OT-BQ（trajectory-distributional equivalence via sliced Wasserstein on trajectory embeddings）。关键测量不是 aggregate accuracy，而是 **per-mode coverage**：agent 在两个 mode 上的各自成功率。预期结果是 BQ-LoRA 在 covered mode 上与 OT-BQ 持平但在 uncovered mode 上显著退化，而 OT-BQ 在两个 mode 上均保持均衡覆盖——因为 trajectory-level Wasserstein distance 能检测到 $U_2$ 对 uncovered mode 的 trajectory distribution 有不可替代的 shift effect，即使它在 reference decision representations 上的 first-order response 为零。如果这个预期成立，它将直接证明 trajectory-distributional equivalence 是比 first-order decision representation equivalence 更正确的行为抽象，并开启 \"distributional PEFT\" 这一新方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Pengyang Zhou\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Xiaobin Tu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Zhengxi Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Rongkun Xue\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Haochen Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Miancan Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ziyuan Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yinggui Wang\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Jinkui Ren\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiantao Zhang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Alibaba Cloud\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution.\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author: wyinggui@gmail.com\"}\n  ]\n}\n```", "summary_translation": "基于 LLM 的 agents 依赖异构交互能力来完成复杂任务。现有方法通常将这些能力分布在多个 LoRA adapters 中，这增加了 adapter 的存储需求，并在推理过程中引入了路由开销。单个 LoRA 避免了这种开销，但在固定的 rank budget 下从多样的 agent trajectories 中学习带来了两个挑战。首先，具有不同交互痕迹和参数梯度的 trajectories 可能会在 decision distributions 中引起等效的变化，导致重复更新过度强调冗余的行为变化。其次，聚合的更新可能会超出 adapter 的 rank budget，并且在 weight space 中对其进行近似可能会扭曲其旨在产生的 decision changes。我们提出了 BQ-LoRA，这是一个通过局部 behavior quotient manifold 来组织 trajectory updates 的 low-rank adaptation 框架。它包含两个模块，即 behavior quotient balancing (BQB) 和 decision preserving compression (DPC)。BQB 从 decision distributions 中构建 quotient manifold，并根据它们在 quotient tangent space 中的局部密度重新加权 trajectory update directions。DPC 将平衡后的梯度投影到 intrinsic fixed rank tangent space 上，并通过联合控制 effective weight error 和 distortion of decision distributions 来重构由此产生的目标。在 AppWorld 和 BrowseComp-Plus 上的实验将 BQ-LoRA 与标准 LoRA 和最近的 low-rank adaptation 方法进行了比较，同时单独的 ablations 评估了这两个组件的互补贡献。"}, {"title": "Granularity-Adaptive Credit Assignment for Long-Horizon LLM Agent Reinforcement Learning", "arxiv_id": "2609.12424", "authors": "Taoran Liang, Yang Liu, Shang Luo, Yingguang Yang, Rongrong Zhang, Yingzong Min, Yulin Huang, Jianshen Zhang, Yongzhi Qi, Kefu Xu, Congjing Ran, Bin Chong", "summary": "Reinforcement learning is now the standard way to train large language model agents on long-horizon tasks, where dozens of interdependent actions precede a single sparse reward. Critic-free, group-relative methods such as GRPO suit this regime, but they broadcast one trajectory-level scalar to every step and cannot say which decision drove the outcome. GiGPO recovers a step-level signal by grouping time steps that share an anchor state, yet it merges the step- and episode-level estimates under one fixed weight, spending the same resolution on a pivotal branching decision as on a routine, near-deterministic transition. We argue that the right resolution is state-dependent, and propose GACA, a critic-free estimator whose granularity follows an uncertainty-based criticality proxy. GACA scores every step by the negative log-likelihood its own rollout already records, then blends the two advantages with a per-step weight that grows with that score, so the gradient places more weight on the fine-grained signal at above-average NLL and on the episode-level signal below it. We derive an exact risk decomposition for the implemented mixture and show that sufficiently small modulation improves on fixed mixing under positive directional alignment. A separate conditional result bounds local action-value variation using expected NLL, while an error-projection analysis characterizes when mixing adds value beyond scalar uncertainty reweighting. On ALFWorld and WebShop, GACA improves task success over GRPO and GiGPO at both 1.5B and 7B scales.", "category": "cs.LG", "cluster": "Agent Training \u0026 Adaptation", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-12 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文的核心是提出一种新的信用分配方法（GACA），用于改进长周期任务中LLM智能体的强化学习训练。这直接属于“构建、改进、评估、训练或演化LLM智能体”的研究范畴，具体对应“单智能体”方向中的智能体训练与强化学习。论文明确以LLM Agent为研究对象，聚焦于通过更精细的信用分配提升智能体在长周期任务中的学习效果，属于方法论创新，而非单纯的应用或基础设施。同时，论文不涉及安全、多模态、图技术或多智能体拓扑编排等排除项。因此，完全符合筛选标准。", "intro_logic": "### § 1 研究问题与重要性\n\n本文解决的核心问题是 long-horizon LLM agent 强化学习中的 credit assignment 粒度自适应问题。在 long-horizon 任务中，agent 需要执行数十个相互依赖的动作后才获得一个 sparse reward，而现有的 critic-free group-relative 方法（如 GRPO）将一个 trajectory-level 的 scalar reward 均匀广播到每一步，无法区分哪一步决策真正驱动了最终结果。GiGPO 虽然通过 anchor-state grouping 恢复了 step-level advantage，但以固定权重混合 step-level 和 episode-level 信号，对所有步骤施加相同的分辨率——无论该步骤是关键的 branching decision 还是 near-deterministic 的常规过渡。本文提出 GACA，一种 critic-free 的 advantage estimator，根据每一步的 policy uncertainty 动态调整 credit assignment 的粒度：在 policy 不确定的关键步骤信任 fine-grained step-level signal，在 confident 的常规步骤回退到 low-variance episode-level signal。这个问题的重要性在于，long-horizon trajectory 中步骤的 criticality 本质上是不均匀的，错误的 credit 分配会直接降低 sample efficiency 和最终策略质量，而 GACA 在不引入 critic、不增加 rollout、不增加显著计算开销的前提下，在 ALFWorld 和 WebShop 上将任务成功率显著提升。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决。最直接的前人工作是 GRPO（Shao et al., 2024）和 GiGPO（Feng et al., 2026）。GRPO 用 group-relative 的 episode-level advantage 替代 learned value function，避免了训练 critic 的成本和不稳定性，但它将整个 trajectory 的 return 标准化后广播给每一个 token，对决定性的早期选择和常规的后续步骤赋予完全相同的 credit——这是方法本身的结构性限制，因为 trajectory-level scalar 在设计上就无法区分步骤间的因果贡献。GiGPO 在此基础上前进了一步：它将共享相同 anchor observation 的 time steps 跨 rollout 重新分组，在 step-group 内计算 group-relative advantage，从而在不增加 rollout 成本的前提下恢复了 step-level 信号，并以固定权重 $w$ 将 step-level 和 episode-level advantage 线性组合。然而，GiGPO 的关键不足在于其 granularity 是 uniform 的：所有步骤获得相同的 step-level advantage 权重，无论该步骤是否是真正的 decision point。这一限制并非工程疏忽，而是因为 GiGPO 将 credit 分配的分辨率视为全局常数，而非 state-dependent 的属性。实际上，long-horizon trajectory 中只有少数步骤是 policy 不确定且影响结果的 branching decision，大多数步骤是 near-deterministic 的过渡，其 step-level advantage 主要是 estimation noise；固定权重将这些 noise 以全强度注入 gradient，同时在真正需要 fine-grained signal 的关键步骤上 under-use 它。这种 asymmetry 在 token level 已有文献记录（Wang et al., 2026; Cui et al., 2025 表明 high-entropy minority tokens 驱动了大部分 policy improvement），但 GiGPO 未能在 step level 利用这一洞察。GACA 的关键贡献在于认识到 policy 自身的 NLL 已经记录了每一步的不确定性，该信息在 rollout 中免费获取，可以作为 criticality score 来 per-step 动态调整混合权重，从而将分辨率从全局常数转变为 state-dependent 的连续变量。", "core_insight": "### § 3 重建作者的思考路径\n\n长程 LLM agent 的 RL 训练面临一个核心困难：任务只在几十步交互后给出一个 sparse 的 terminal reward，而 critic-free 方法如 GRPO 虽然避开了训练 value function 的不稳定性，却只能将这一个 trajectory-level 的 scalar 广播到每一步，无法区分哪一步决策真正导致了成功或失败。GiGPO 部分解决了这个问题：它观察到同一 group 的不同 rollout 中，如果某些步骤面对相同的 anchor state，就可以将这些步骤重新分组，在组内计算 step-level 的 group-relative advantage，从而以零额外 rollout 成本恢复细粒度信号。但 GiGPO 用一个固定权重将 step-level 和 episode-level 两个 estimator 混合，对所有步骤施加相同的分辨率——无论该步骤是一个真正的不确定决策点，还是一个近乎确定性的过渡动作。\n\n从经验上看，长程轨迹本身就不是均匀的：少数步骤是 policy 犹豫、选择影响结局的 branching decision，多数步骤则是走向已选目标之类的 near-deterministic continuation。对 routine step 施加 step-level advantage，注入的主要是估计噪声；而对 pivotal step 却没有加大细粒度信号的权重，恰恰浪费了 step-level estimator 最有价值的地方。这一不对称性在 LLM reasoning 的 RL 中已有先例：少数高 entropy token 驱动了大部分 policy improvement。如果 token 层面的不确定性能够标识学习的关键位置，那么在 agent 的 step 层面，policy 的不确定性理应也能标识哪些步骤的 credit 值得更细粒度的分配。\n\n关键在于，policy 的不确定性信号几乎免费可得：rollout 过程中已经记录了每个被采样 token 的 log-probability，其 mean per-token NLL 就是 Shannon entropy 的无偏估计的长度归一化版本。既然 credit assignment 的理想分辨率是 state 的属性而非全局常数，就可以用这个 NLL 作为 per-step 的 criticality score，动态调节 step-level 与 episode-level advantage 的混合权重——在 policy 不确定时信任细粒度信号，在 policy 自信时退回低方差的 episode-level 估计。从理论上看，高 NLL 意味着同一 anchor state 下不同 rollout 采样的 canonical action 分歧更大，局部 action-value variance 更高，episode-level estimator 作为单一 scalar 无法分辨这些分支，其误差也更大；因此 error-optimal 的 step weight 应随 NLL 递增，而 state-adaptive mixing 只要 per-state 最优权重不全相等，就严格优于任何固定常数。\n\n### § 4 核心 Intuition\n\n长程轨迹中不同步骤的\"关键性\"天然不同：policy 不确定的步骤是真正的决策分叉点，需要细粒度的 step-level credit 来区分好坏选择；policy 自信的步骤则是例行延续，低方差的 episode-level credit 已经足够可靠。既然 policy 自己的 NLL 已经在 rollout 中免费记录了这种不确定性，就可以用它作为 per-step 权重，动态地在 step-level 和 episode-level advantage 之间插值——让 credit 的分辨率跟随 state 而非保持全局常数。先前方法失效的根源正是 GiGPO 用固定权重对待所有步骤，在噪声大的 routine step 上浪费了细粒度信号，在真正关键的 pivotal step 上又给得不够。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n          Group Rollout (G trajectories / task)\n          │\n    ┌─────┼──────────────┬──────────────┐\n    ▼     ▼              ▼              \n  {R_τ}  Anchor      Token Log-Probs   \n    │     States         │              \n    ▼     │              ▼              \n  A_E    │           H_t (NLL, Eq.4)    \n (Eq.2)  │              │              \n    │     ▼              ▼              \n    │  A_S_t         c_t (Eq.5)         \n    │  (Eq.3)        criticality        \n    │     │              │              \n    │     │              ▼              \n    │     │           λ_t (Eq.7)        \n    │     │           mixing weight     \n    │     │              │              \n    └──┬──┴──────────────┘              \n       ▼                                \n  A_GACA = λ_t·w·A_S + (1−λ_t)·A_E      \n       │  (Eq.8)                        \n       ▼                                \n  Clipped Surrogate → Policy Update     \n       │  (Eq.1, PPO-style)             \n       ▼                                \n  Updated π_θ                           \n```\n\n**训练阶段**（推理与评测不涉及 advantage 计算，仅用训练好的 policy 正常 rollout）：\n\n1. **Group Rollout**：对每个 task 采样 G=8 条 trajectories，记录每步的 state、action、reward、per-token log-probability。这是所有后续计算的共享输入（§ 2.1, § 4.1）。\n\n2. **Episode-level Advantage $A^E$**：对同一 prompt group 内所有 trajectories 的 return $R_\\tau$ 做组内标准化（减均值、除标准差），得到每条 trajectory 一个 scalar，广播到该 trajectory 的所有 step（Eq. 2）。这是 GRPO 的原始信号，无法区分哪一步导致了成功或失败。\n\n3. **Anchor-state Step-grouping 与 $A^S_t$**：将不同 trajectories 中共享相同 anchor observation 的 step 归入同一 step-group，在组内对 discounted step return $\\hat{g}_t$ 做标准化，得到 step-level advantage（Eq. 3）。Singleton group 回退到 prompt-group 归一化（Appendix D）。此步骤继承自 GiGPO，GACA 不做修改。\n\n4. **NLL Proxy $H_t$**：从 rollout 已记录的 per-token log-probability 计算每个 step 的 mean per-token negative log-likelihood（Eq. 4）。无需额外 forward pass，成本为零（§ 3.1, Table 5）。\n\n5. **Criticality Score $c_t$**：将 $H_t$ 除以该 trajectory 的 $H_t$ 均值，得到归一化分数（Eq. 5）。$c_t \u003E 1$ 表示该 step 的 policy 不确定性高于 trajectory 平均水平。可选地与 reward-change 信号融合（Eq. 6, $\\alpha_c \u003C 1$），但实验表明纯 entropy（$\\alpha_c = 1$）效果最好（§ 4.3）。\n\n6. **Per-step Mixing Weight $\\lambda_t$**：通过分段线性、clamped 到 [0,1] 的函数（Eq. 7），将 $c_t$ 映射为 $\\lambda_t$。以 $\\lambda_0 = 0.5$ 为基准，$c_t \u003E 1$ 时 $\\lambda_t$ 向上推（更多 step-level 信号），$c_t \u003C 1$ 时向下拉（更多 episode-level 信号）。调制强度由 $\\alpha_\\lambda, \\beta_\\lambda$ 控制（§ 3.2, Figure 3）。\n\n7. **Mixed Advantage $A^{\\text{GACA}}_t$**：凸组合两个 estimator（Eq. 8）：$A^{\\text{GACA}}_t = \\lambda_t w A^S_t + (1 - \\lambda_t) A^E$。在 policy 不确定的 pivotal step 信任 fine-grained step signal，在 routine step 回退到 low-variance episode signal。$\\lambda_t$ 在单次 update 内固定（由 old-policy 量计算）。\n\n8. **Policy Update**：将 $A^{\\text{GACA}}_t$ 广播到该 step 的所有 token，代入 PPO clipped surrogate（Eq. 1），配合 KL penalty 更新 policy。GACA 仅替换 advantage 计算步骤，其余训练循环与 GRPO/GiGPO 完全一致（Algorithm 1）。\n\n---\n\n### § 6 核心数学推导\n\n论文的理论分析围绕三个命题展开，核心逻辑链为：**高 NLL → action 分歧大 → local action-value variance 大 → step-level estimator 更可靠 → 最优权重向 step-level 倾斜 → adaptive 优于 fixed**。\n\n**Proposition 1：Expected NLL certifies local criticality**\n\n直觉：如果 policy 在某个 anchor state $z$ 处很不确定（高 NLL），那么多次访问该 state 时采样的 actions 会更分散。用 collision probability $D_z = \\Pr[U \\neq U']$（两次独立访问采到不同 canonical action 的概率）衡量分歧程度，用 $C_z = \\text{Var}[Q_z(U)]$ 衡量 local action-value variance。\n\n证明的关键技巧在于建立 entropy 与 collision probability 的下界关系。传统做法用 Pinsker inequality 将 KL divergence 转为 TV distance，但只在 entropy 接近最大值（near-uniform）的极窄区间内有效。论文转而利用 largest atom $p_z^{\\max}$：entropy 越高，$p_z^{\\max}$ 越小（通过严格递减函数 $F_K^{-1}$），而 collision probability $\\sum_u p_z(u)^2 \\leq p_z^{\\max}$，因此 $D_z = 1 - \\sum_u p_z(u)^2 \\geq 1 - F_K^{-1}(H(U|Z=z))$。这个 bound 在远超 near-uniform 的实际 entropy 范围内仍然有效（Appendix B.1 给出校准：$K_z=10$, $H=1$ nat 时，此法 certify $D_z \\geq 0.217$，Pinsker certify 0）。\n\n再由 $2C_z = D_z \\cdot \\kappa_z$（不同 canonical action 的 value 差异 $\\kappa_z \\geq \\kappa_0 \u003E 0$），得到 $C_z$ 的下界也随 NLL 递增。注意这是**单边证书**：高 NLL 保证 branching，低 NLL 只是未能 certify。\n\n**Proposition 3：MSE-optimal mixing weight**\n\n直觉：两个 estimator 各有误差。Step-level estimator $A^S$ 的误差来自 step return 的观测噪声 $\\sigma_z^2$（variance，无 bias）；episode-level estimator $A^E$ 的误差来自 shrinkage factor $\\eta_z$（一个 scalar 无法区分 branching，产生 bias）加上独立噪声 $\\tau_z^2$。两者的 conditional MSE 分别为：\n\n$$M_S(z) = \\frac{\\sigma_z^2}{m_z - 1}, \\quad M_E(z) = \\tau_z^2 + \\eta_z^2 \\cdot \\frac{m_z}{m_z - 1} \\cdot C_z$$\n\n混合 estimator 的 risk $R_z(\\lambda) = \\lambda^2 M_S + (1-\\lambda)^2 M_E$ 是严格凸二次函数，最优解为 $\\lambda_z^\\star = M_E / (M_E + M_S)$。关键结论：$\\lambda_z^\\star$ 关于 $C_z$ 和 $m_z$ 非递减——local criticality 越大（episode estimator 的 bias 越严重），或 anchor group 越大（step estimator 的 variance 越小），最优权重越应倾向 step-level。将 Proposition 1 的 $C_z$ 下界代入，得到 $\\lambda_z^\\star$ 的下界 $\\tilde{\\lambda}_z(h_z)$ 也随 expected NLL 递增。Eq. 7 的 monotone gate 实现的正是追踪这个 certified floor。\n\n**Proposition 2：State-adaptive mixing dominates fixed mixing**\n\n直觉最简洁：将 risk 在最优点展开，$R_z(\\lambda) - R_z(\\lambda_z^\\star) = (M_E + M_S)(\\lambda - \\lambda_z^\\star)^2$。对固定权重 $\\lambda_0$ 取期望：\n\n$$\\mathbb{E}_Z[R_Z(\\lambda_0)] - \\mathbb{E}_Z[R_Z(\\lambda_Z^\\star)] = \\mathbb{E}_Z[(M_E + M_S)(\\lambda_0 - \\lambda_Z^\\star)^2] \\geq 0$$\n\n等号成立当且仅当 $\\lambda_Z^\\star$ 几乎处处为常数。只要不同 state 的最优权重不同（这在 long-horizon 任务中是常态），adaptive 就严格优于任何 fixed weight。这是 § 4.3 中 $\\lambda_0$ sweep 实验直接测试的预测。\n\n---\n\n### § 7 实验设计与结论\n\n论文围绕两个核心问题设计实验：\n\n**问题一：Granularity-adaptive credit assignment 是否能提升 long-horizon agent RL 的性能？**\n\n实验设计：在 ALFWorld（文本家务任务，horizon ≤ 50）和 WebShop（网页购物，horizon ≤ 15）两个 benchmark 上，使用 Qwen2.5-1.5B 和 7B backbone，将 GACA 与 GRPO（纯 episode-level）和 GiGPO（固定权重的 two-level）在完全相同的 rollout budget、训练 epoch 和 normalization convention 下比较。所有方法共享 PPO clipped surrogate，唯一差异是 advantage estimator。报告 128 个 held-out task 的 success rate，3 个 random seed 取均值。\n\n答案：GACA 在全部四个 setting 下均为最优。相对 GiGPO，1.5B 上 ALFWorld +10.2、WebShop +13.6；7B 上 +2.4 和 +8.4。训练曲线显示 GACA 在前 30 epoch 内即与 baseline 分离，以约一半的 epoch 达到 GiGPO 的峰值，说明 adaptive weight 同时提升了 sample efficiency 和 final performance。增益在更弱的 policy（1.5B \u003E 7B）和更短的 horizon（WebShop \u003E ALFWorld）上更大，与机制预测一致：弱 policy 在更多 step 上不确定，短 horizon 将 outcome 集中于少数 branching decision。\n\n**问题二：性能提升是否来自 criticality-adaptive granularity 本身，而非更好的常数权重或仅仅引入了变化的权重？**\n\n实验设计：在 ALFWorld 1.5B 上进行 ablation grid，每次只变一个设计选择，其余保持 default，统一训练和 selection protocol。\n\n三组关键对照：\n- **Criticality score**：纯 entropy（96.88）\u003E uniform/固定权重（93.05）\u003E random permutation（88.54）。Random permutation 保持了权重的完整 multiset，仅打乱分配——结果比不 adapt 还差，证明增益来自权重**放在哪里**而非**是否变化**。\n- **Fixed mixing weight $\\lambda_0$ sweep**（adaptation off）：曲线凹，峰值在 $\\lambda_0 = 0.5$（93.05），两端（纯 episode 85.94、纯 step 84.60）均差。Adaptive rule 比最佳常数高 3.83 点，正是 Proposition 2 预测的方向。\n- **Modulation strength**：从无调制到 $\\alpha_\\lambda = \\beta_\\lambda = 0.5$ 增益 3.83 点，但推到 1.0 反而回退 1.44 点——因为 NLL 是单样本估计、噪声大，过强调制将噪声放大到权重中，且 clamp 过早触发使最不确定的 step 塌缩到同一权重。\n\n答案：性能提升可被精确归因于 criticality-adaptive granularity。Diagnostics 进一步确认机制运行在 intended range：criticality score 标准差 0.31（ALFWorld）/ 0.27（WebShop），mixing weight 均值被 construction pin 在 $\\lambda_0 = 0.50$，不到 1% 的 step 触发 clamp，86%/79% 的 step 落在 non-singleton anchor group 中获得真实 within-group contrast。GACA 的 per-iteration 额外开销仅 0.09 秒（总 iteration 约 6 分钟），peak memory 不变。", "additional_insights": "### § 8 Take-aways\n本文提出了一种名为 GACA（Granularity-Adaptive Credit Assignment）的 critic-free advantage estimator，用于解决长序列 LLM agent 强化学习中的 credit assignment 问题。与 GRPO 将单一 trajectory-level 标量广播到所有步骤、或 GiGPO 使用固定权重混合 step-level 与 episode-level advantage 不同，GACA 根据每一步的 policy uncertainty 动态调整混合权重。具体而言，GACA 利用 rollout 中已记录的 mean per-token negative log-likelihood (NLL) 作为 criticality score，在 policy 不确定的关键决策点赋予 step-level advantage 更高的权重，而在近确定性的常规转移中回退到低方差的 episode-level advantage。理论层面，论文证明了更高的 anchor-conditional expected NLL 能保证 local action-value variance 有更大的 lower bound，从而证明 state-adaptive mixing 在 per-state optima 不同时严格优于任何固定权重。实验表明，在 ALFWorld 和 WebShop 上，GACA 在 1.5B 和 7B 规模下均显著超越了 GRPO 和 GiGPO，且消融实验证实收益来源于将权重正确放置在关键步骤上，而非仅仅引入了变化的权重。此外，该机制几乎不产生额外计算开销（每次迭代仅增加 0.09 秒），且不引入额外参数或 critic 网络。\n\n### § 9 最脆弱的假设\nGACA 最核心且最脆弱的假设是：**policy 的 uncertainty（以 mean per-token NLL 衡量）是 step criticality 的可靠代理，即高 NLL 必然对应于对 episode return 影响巨大的 branching decision**。在实际的 LLM agent 交互中，这一假设极易不成立：policy 可能在某一步表现出高 uncertainty，仅仅是因为它缺乏相关知识或处于探索初期的随机状态，而非该步骤是决定任务成败的关键分水岭；反之，一个真正 pivotal 的步骤可能已经被 policy 学得很好，此时 NLL 极低，但 GACA 会错误地将其视为 routine step 并剥夺其 fine-grained 的 step-level signal。论文自身也承认了这一脱节，并试图通过引入 reward-change term $\\Delta_t$ 进行融合修正，但消融实验（Table 2）却表明引入 reward-change 反而降低了性能，最终默认设置退回到纯 entropy 驱动。论文仅通过 Proposition 1 提供了理论上的 lower bound 证明，但缺乏直接的实证数据表明高 NLL 步骤在 ALFWorld/WebShop 中确实对应高 local action-value variance，这使得核心机制在面对更复杂、uncertainty 与 criticality 不对齐的真实任务时面临直接失效的风险。\n\n### § 10 最小复现实验\n若有一周时间，最小复现实验应聚焦于验证“**收益来源于权重的正确放置，而非权重本身的变化**”这一核心 claim。使用 ALFWorld benchmark 和 Qwen2.5-1.5B-Instruct 模型，基于已有的 GiGPO 框架实现三个变体进行对比：一是固定权重基线（$\\lambda_0=0.5$，无 modulation），二是完整的 GACA（基于 NLL 的 adaptive modulation），三是 Random permutation 控制（保持 GACA 计算出的 per-step 权重集合，但随机打乱其分配给各步的顺序）。训练 50 个 epochs 并在 128 个 held-out 评估任务上测量 success rate。如果完整 GACA 的 success rate 显著高于固定权重基线，且 Random permutation 变体的表现不仅低于 GACA，甚至低于固定权重基线，则强有力地支持了论文的 claim；如果 Random permutation 表现与完整 GACA 相当，则反驳了 criticality-adaptive granularity 的有效性，说明性能提升仅仅来自于引入了 advantage magnitude 的方差扰动。", "research_value": "### § 11 最强反例设计\n\n要构建对 GACA 最致命的反例，我们需要直接攻击其最脆弱的假设：**policy 的 NLL 与 step 的实际 causal criticality 之间存在系统性脱节**。具体而言，我会在一个“policy 高度自信但错误，或高度困惑但无关紧要”的 long-horizon agent 任务上设计实验。例如，引入一个多阶段 reasoning 与 tool-use 交织的 benchmark（如修改版的 SciBench 或带有 deceptive traps 的 ALFWorld 变体）：在任务早期，agent 需要做一个反直觉但决定全局成败的 branching decision（例如，忽略看似最相关的工具而选择一个冷门工具），此时 well-pretrained LLM 的 policy 在该步的 NLL 极低（因为预训练分布使其对该错误选择极度自信）；而在任务后期，agent 需要执行一系列繁琐的文本生成与格式化操作，这些步骤对最终 return 几乎无影响，但由于涉及生僻 token 组合，policy 的 NLL 极高。在这种分布下，GACA 的机制会完全倒置：它在真正关键的早期 branching decision 处因低 NLL 而回退到 low-variance 的 episode-level advantage $A^E$，剥夺了该步亟需的 fine-grained step-level signal 以纠正其“自信的错误”；同时，它在无关紧要的后期 routine 步骤处因高 NLL 而过度放大 step-level advantage $A^S$，将大量 estimation noise 注入 gradient。这一反例不仅提供了对原文结果的替代解释——即 GACA 在 ALFWorld 和 WebShop 上的成功仅仅是因为这些 benchmark 恰好满足“高 NLL 等价于高 criticality”的分布，而非其具有普适的 credit assignment 能力——而且精确识别了方法可预测地失效的条件：当 LLM 的 prior knowledge 与 task 的 optimal action distribution 产生错位时，NLL 作为 criticality proxy 会系统性地抑制探索并放大噪声。\n\n### § 12 Follow-up Research Idea\n\n基于 GACA 将 policy uncertainty 作为 criticality proxy 的根本局限，我提出一种全新的 framing：**Causal Influence-Adaptive Credit Assignment (CIACA)**，将 credit assignment 的粒度从“policy 内部的不确定性”转向“action 对未来 trajectory 的因果扰动能力”。这一想法的驱动需求是：真正的 step criticality 不应由 policy 是否困惑来定义，而应由该 step 的 action 能在多大程度上改变后续 state distribution 及 final return 来定义；NLL 是一个 myopic 且 policy-dependent 的代理，当 policy 本身存在 bias 时，NLL 会彻底失效。\n\n为实现这一目标，我们可以借鉴因果推断领域的 **Counterfactual State Divergence** 工具。具体而言，在 group rollout 中，当我们对处于同一 anchor state $z$ 的 step 分配 step-level advantage 时，不再看其 NLL，而是计算该 step 采取不同 canonical action 后，后续 $k$ 步的 observation embedding 的方差或 Wasserstein 距离。如果不同的 action 导致后续 state 迅速发散，说明该 step 具有高 causal leverage，应赋予更高的 step-level signal 权重；如果不同 action 导致后续 state 依然收敛于同一子空间，说明该 step 是 near-deterministic transition，应回退到 episode-level signal。这种方法无需引入 critic，仅利用 rollout 中已生成的 observation 序列计算 counterfactual state divergence。\n\n第一个实验将设计一个“NLL 与 causal influence 解耦”的 diagnostic environment：例如一个迷宫导航任务，其中某些路口只有一条通道（低 causal influence），但由于文本描述复杂导致 policy 难以理解（高 NLL）；而另一些路口有多条通道但文本描述极简（高 causal influence，低 NLL）。我们将对比 GACA（NLL-driven）与 CIACA（Causal-driven）在 sample efficiency 和 final success rate 上的表现。如果 CIACA 能够在 policy prior 与 task structure 错位的场景下依然保持高效的 credit assignment，而 GACA 出现显著的性能崩塌，即可证明从 policy uncertainty 到 environment causal influence 的范式转移是解决 long-horizon credit assignment 的更优路径。这与现有工作的根本区别在于：GACA 和 GiGPO 都在 policy 的输出分布上做文章，而 CIACA 首次将 credit resolution 的自适应权重建立在 environment dynamics 的反事实发散度上。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Taoran Liang\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Yang Liu\", \"affiliations\": [3], \"markers\": [\"*\"]},\n    {\"name\": \"Shang Luo\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yingguang Yang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Rongrong Zhang\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Yingzong Min\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Yulin Huang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Jianshen Zhang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Yongzhi Qi\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Kefu Xu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Congjing Ran\", \"affiliations\": [5], \"markers\": []},\n    {\"name\": \"Bin Chong\", \"affiliations\": [2], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Nankai University\"},\n    {\"id\": 2, \"name\": \"Peking University\"},\n    {\"id\": 3, \"name\": \"Supply Chain Tech Team Y, JD.com\"},\n    {\"id\": 4, \"name\": \"Shanghai Waybot Technology Co., Ltd.\"},\n    {\"id\": 5, \"name\": \"Wuhan University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "Reinforcement learning 现在是训练 large language model agents 处理 long-horizon tasks 的标准方法，在这些任务中，数十个相互依赖的动作之后才会产生一个单一的 sparse reward。诸如 GRPO 之类的 Critic-free, group-relative methods 适用于这种场景，但它们将一个 trajectory-level scalar 广播到每一步，无法说明是哪个决策导致了最终结果。GiGPO 通过对共享同一 anchor state 的 time steps 进行分组来恢复 step-level signal，但它在一个 fixed weight 下合并了 step-level 和 episode-level estimates，在 pivotal branching decision 和 routine, near-deterministic transition 上花费了相同的 resolution。我们认为正确的 resolution 应当是 state-dependent 的，并提出 GACA，一种 granularity 遵循 uncertainty-based criticality proxy 的 critic-free estimator。GACA 根据其
