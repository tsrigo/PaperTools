n作者可能注意到，现有的基准压缩方法仅依赖最终得分矩阵来挑选代表性任务。但在智能体场景中，不同智能体可能通过完全不同的行为路径得到相同得分，仅看结果会丢失关键的执行行为差异。因此，作者推测若能从轨迹中提取反映执行过程的结构化信号（如工具调用失败率、验证步骤等），并将过程与结果结合，就能更精准地识别任务冗余并预测全量表现。\n\n### § 4 核心直觉\n先前方法失效是因为它们只看最终对错，忽略了智能体达成结果的路径差异。这篇论文的核心在于，将智能体的“执行过程特征”与“最终结果”视为两个互补的视角，通过联合建模这两者的关系来挑选核心任务子集。这样不仅保留了得分分布，还保留了行为模式的多样性，从而在极小预算下仍能准确预测全量基准的得分和排名。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\nAgent Trajectories ──\u003E [Event Parsing] ──\u003E 6D Process Profile\n                                                  │\nOutcome Matrix ──────────────────────────────────┐│\n                                                 ▼▼\n                          [Dual-View Relation Matrices]\n                           ├─ Outcome Relation (ORM)\n                           └─ Process Relation (PRM)\n                                        │\n                                        ▼\n                       [Straight-through Hard Top-K] \u003C──┐\n                                    │ (exact K tasks)    │\n                                    ▼                    │\n                           [Fused Agent Kernel]          │\n                                    │                    │\n                                    ▼                    │\n                        [Kernel Ridge Predictor]         │\n                                    │                    │\n                                    ▼                    │\n                           (Score + Ranking Loss)        │\n                                    │                    │\n                                    └── (backprop) ──────┘\n                                       Update Logits, γ, α\n```\n\nDualViewEval 的 pipeline 分为以下步骤：\n\n1. **过程特征提取**（§ 3.2）：输入原始 agent 轨迹，通过 benchmark-specific adapters 解析为统一事件序列，提取 6 维过程特征（agent steps、tool failed rate、tool-category entropy、validation-tool rate、required-write execution、read–write–validate closure）。输出是每个 agent–任务对的过程向量。\n\n2. **双视角关系矩阵构建**（§ 3.3 Step 1）：对每个任务，基于结果矩阵构建 ORM，衡量 agent 间的结果一致性；基于过程特征构建 PRM，衡量执行模式相似度。两个矩阵均为预计算的半正定 Gram 矩阵。\n\n3. **精确大小 miniset 选择**（§ 3.3 Step 2）：为每个任务分配可训练 logit，用 straight-through hard Top-K gate 选出恰好 K 个任务。前向传播保证精确预算，反向传播用 softmax 梯度更新 logit。\n\n4. **分数预测与联合优化**（§ 3.3 Step 3）：将选中的 ORM 和 PRM 用学习权重 γ 融合为 agent kernel，用 Kernel Ridge 预测未见 agent 的全量分数。计算 Smooth-L1 score loss 和 pairwise ranking loss，反向传播联合更新 task logits、γ 和 Ridge 正则化参数 α，形成选择-预测反馈回路。训练采用 B 折交叉拟合防止自我预测泄漏。\n\n5. **最终状态选择**（§ 3.3 Step 4）：在验证集上根据 MAE 和排序误差选择最优 epoch 的 miniset 和预测器状态，用于测试 agent 的一次性评测。\n\n### § 6 核心数学推导\n\n论文的数学部分主要是定义性的，核心是双视角关系矩阵和核岭回归预测器。\n\n**ORM**：$R^{(y)}_i = \\frac{1}{2} U_i U_i^\\top$，其中 $U_i$ 每行是 agent 的二元结果向量 $[Y, 1-Y]$。直觉上，两个 agent 在任务上结果一致（都成功或都失败）时内积为 1，不一致时为 0，除以 2 对两个通道取平均。\n\n**PRM**：$R^{(p)}_i = \\frac{1}{2d} V_i V_i^\\top$，$V_i$ 每行包含标准化过程特征与观测掩码。它衡量 agent 执行模式的相似度，只使用共同观测到的维度，掩码部分暴露哪些特征实际可用。\n\n**融合 kernel**：$K = \\frac{1}{K} \\sum_{i \\in S} [(1-\\gamma^2) R^{(y)}_i + \\gamma^2 R^{(p)}_i]$。用 $\\gamma^2$ 而非 $\\gamma$ 保证系数非负，维持融合矩阵的半正定性质；除以 $K$ 保持不同预算下尺度可比。\n\n**Kernel Ridge 预测**：$\\hat{s}_Q = K_{QR} (K_{RR} + \\alpha I)^{-1} s_R$。这是经典的核岭回归（Kernel Ridge Regression），用已知 agent 的核关系和全量分数，通过正则化逆矩阵预测未知 agent 的分数，$\\alpha$ 控制正则化强度。论文选择线性预测头是因为 agent benchmark 中观测到的 agent 配置远少于任务数，需限制预测器容量同时保持对选中 kernel 的可微性。\n\n### § 7 实验设计与结论\n\n**过程信息是否与 agent 最终性能相关？** 论文分析了 5 个 benchmark 的大规模轨迹，提取 12 个候选统计量并计算与最终分数的 Spearman 相关性。结果显示多个轨迹测量值与最终分数系统相关，低/中/高分模型呈现不同的过程分布，最终保留 6 个互补特征。\n\n**DualViewEval 是否优于现有压缩方法？** 在 5 个 agent benchmark 上与 5 个 baseline 比较，使用 20/40/60 个任务的 miniset，评估 MAE 和 Kendall's τ。DualViewEval 在所有数据集上取得最佳结果，在紧凑预算下优势最明显（如 K=20 时 MAE 降低 14.5%–28.2%），且训练速度比 SparseEval 快 4.2×–8.3×。\n\n**双视角和各组件的贡献如何？** 消融实验表明 ORM 提供主要分数重建信号，PRM 提供互补行为结构；straight-through hard Top-K 在紧凑预算下最强；Kernel Ridge 比 MLP 更稳定。此外，学习到的 γ 因 benchmark 而异，说明 outcome–process 平衡需自适应校准。", "additional_insights": "### § 8 阅读收获\n传统基准压缩仅依赖最终得分，但在Agent评测中相似结果可能源于不同行为过程。本文提出DualViewEval，从轨迹中提取6个过程信号（如工具失败率、读写验证闭环等），结合结果与过程关系联合学习精确大小的子集并预测全量分数。实验表明，仅用20个任务即可实现24至40倍压缩，预测误差和排名保持度均显著优于仅看结果的基线。\n\n### § 9 最脆弱的假设\n核心假设是提取的6个过程信号具有跨任务和模型的稳定预测力，能泛化到未见过的Agent。若该假设不成立，例如特征仅对特定模型家族有效，过程关系矩阵将引入噪声导致子集选择失效。论文虽在附录提供了Qwen家族的泛化测试，但缺乏在更多样化架构或跨领域任务上的验证，难以完全排除过拟合训练模型的风险。\n\n### § 10 最小复现实验\n用1周时间可验证“过程信号与性能存在系统性关联”这一基础点。使用公开的BFCL数据集及轨迹，实现6个过程特征的提取脚本，计算其与Agent全量分数的Spearman相关性，并对比低、中、高分段Agent的特征分布。保留原始轨迹与得分，但不实现完整的DualViewEval优化框架。若特征与分数显著相关且分布区分明显，则支持原结论；若相关性微弱或分布重叠，则说明过程信号普适性存疑。", "research_value": "### § 11 最强反例设计\nDualViewEval 的核心假设是预定义的 6 维过程特征能稳定刻画智能体行为差异。若引入一类通过强化学习微调以极少步骤直接输出答案的开源小模型，其工具调用频率极低但推理质量与闭源大模型相当。此时，过程关系矩阵（PRM）会将两者判定为行为迥异，而结果关系矩阵（ORM）却显示成功率相近。这种过程与结果的系统性错位会干扰核岭回归的权重分配，导致选出的子集无法准确预测此类新型智能体的分数，从而挑战手工特征的跨架构泛化能力。\n\n### § 12 后续研究设想\n现有方法依赖手工设计的 6 个过程特征，这在工具调用密集的场景中有效，但在工具稀疏的深度推理任务中可能失效。后续研究可检验：在纯代码生成或数学证明等极少调用外部工具的基准上，DualViewEval 的预测误差是否会显著上升。具体而言，可选取工具密集型和工具稀疏型基准，分别应用该方法并对比其平均绝对误差（MAE）。若后者误差显著更高，则说明现有过程特征过度依赖工具调用统计，需要针对任务类型自适应提取过程信号。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Xinshuai Guo\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Junjie Wu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Dolly Deng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yinghui Li\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Hai-Tao Zheng\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Suncong Zheng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Maxm Pan\", \"affiliations\": [1], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Hunyuan Team, Tencent\"},\n    {\"id\": 2, \"name\": \"Tsinghua University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Correspondence to zheng.haitao@sz.tsinghua.edu.cn, jackjunjwu@tencent.com, and maxmpan@tencent.com.\"}\n  ]\n}\n```", "summary_translation": "智能体评测基准的评估成本显著高于传统的大语言模型（LLM）评测基准。因此，评测基准压缩是一个自然的解决方案，但现有方法主要对任务-模型最终分数分布中的冗余进行建模，而该分布特征在智能体评估中具有重要意义。为了解决这一局限性，我们分析了大规模轨迹数据，并识别出六种与智能体最终性能系统性相关的互补过程信号。为了从完整视角厘清智能体性能的冗余，我们提出了一种名为 DualViewEval 的智能体评测基准压缩方法，该方法联合利用结果和过程关系来学习一个精确大小的最小子集，并预测完整评测基准的分数。在五个智能体评测基准和五个代表性基线方法上，DualViewEval 在所有数据集上均取得了最佳结果。仅使用20个任务，它就在 APEX-Agents 和 BFCL 上实现了24倍至40倍的压缩率，相比最强竞争对手将平均绝对误差（MAE）降低了14.5%至28.2%，同时在 SWE-bench Verified 上相比 EssenceBench 将肯德尔秩相关系数（Kendall's $τ$）提升了高达7.2%。所选出的最小子集进一步揭示了不同智能体之间的能力差异，为高效的智能体模型开发提供了简洁且具诊断性的反馈。"}, {"title": "Bad Genius: Counterfactual-Guided Harness Evolution Beyond Task-Specific Shortcuts", "arxiv_id": "2609.18366", "authors": "Guojun Zhu, Xunheng Huang, Peng Yin, Jiahui Xie, Sanguo Zhang, Doudou Zhou", "summary": "Reliable agent evaluation is complicated by automatic harness optimization, which repeatedly uses a released benchmark $B_{\\mathrm{rel}}$ to guide a Proposer that edits prompts, memory, retrieval, tools, and control code around a fixed target agent. Task holdout varies semantic tasks but leaves the benchmark protocol fixed, so a \"bad genius\" Proposer can produce a cheating harness whose released-benchmark gain depends on a benchmark-wide shortcut. We introduce Counterfactual Harness Search and Evolution (CHASE), which casts harness evolution as constraint generation over validity-preserving benchmark counterfactuals. After each Proposer update, a Challenger searches for an executable protocol transformation with large gain destruction. A validity firewall checks that task semantics are preserved, while a confirmation set determines whether the counterfactual enters a finite archive. We formalize an exact shortcut-neutralized benchmark $B_0$ and establish statistical guarantees linking finite counterfactual archives to $B_0$ and characterizing sequential Challenger search. We evaluate CHASE on a synthetic benchmark and on OfficeQA, where CHASE retains strong released-benchmark gains while substantially reducing gain destruction under valid protocol changes.", "category": "cs.AI", "cluster": "Agent Benchmarking \u0026 Evaluation", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了一种名为 CHASE（Counterfactual Harness Search and Evolution）的框架，用于指导智能体 harness 的自动演化，并解决在此过程中出现的 benchmark 捷径作弊问题。论文明确探讨了如何通过自动优化来编辑智能体的 prompts、memory、retrieval、tools 和 control code。\n\n这完全符合筛选标准第一步中的保留规则：论文研究的对象是 agent 的 harness / scaffold，并且核心贡献涉及让这些智能体运行组件通过反馈和评估结果自动改进和演化。同时，论文也属于对智能体评估和失败机制（即 harness 演化中的“作弊”捷径）的诊断，符合“只要结论直接帮助理解或改进智能体能力，也应保留”的原则。\n\n此外，论文摘要中高频出现了 \"agent evaluation\", \"harness optimization\", \"harness evolution\" 等关键词，直接命中了第二步的正面指标（Agent Harness, Memory, Tool Use）。它虽然涉及评估基准，但本质是研究智能体运行组件的演化机制，而非单纯的系统基础设施或非演化型应用，因此应予保留。", "intro_logic": "### § 1 研究问题与重要性\n\n论文研究的是agent评测中harness evolution（工具链演化）的可靠性问题。当Proposer反复使用同一发布基准 $B_{\\text{rel}}$ 的分数和执行轨迹来优化harness时，可能利用benchmark-wide shortcut（基准级捷径，即跨任务共享的协议统计相关性）来提高分数，而非真正提升任务解决能力。例如在OfficeQA中，95.2%的单位标注紧跟表格之前，Proposer可据此让agent只读表格前文来获取单位，从而在发布基准上得分更高。这个问题重要是因为harness优化已成为实质性的评测目标，但如果分数提升依赖的是基准协议的格式规律而非agent能力，评测结果就会误导系统选择与部署决策。\n\n### § 2 前人工作与不足\n\n已有方法主要通过task holdout（任务留出）或固定过滤器来限制捷径。HarnessCompass使用固定的Generalization Gate只允许任务无关的harness修改，Meta-Harness则直接在harness源码上搜索优化。但这些方法的根本局限在于：task holdout只改变任务而保留协议不变，因此benchmark-wide shortcut在训练集和测试集上都存在，无法被检测——任务变了，但\"先搜通道A\"这类协议相关性没有变。固定过滤器只能覆盖预先设想的捷径模式，而benchmark-wide shortcut可能来自协议的多个部分（文件名、目录结构、工具别名、检索排序等）且难以预先用规则穷举。因此需要一种能动态发现协议级捷径并将其转化为后续演化约束的方法。", "core_insight": "§ 3 重建作者的思考路径\n作者可能注意到，任务留出只改变任务内容而不改变基准协议，因此利用协议统计规律的基准范围内捷径在留出后依然存在。固定规则过滤只能拦截已知模式，无法发现未知的协议依赖。既然无法预先列举所有捷径，不如在每次 harness 更新后主动搜索能破坏其增益的协议变换，把确认的反事实基准作为约束，迫使后续优化不能依赖这些相关性。\n\n§ 4 核心直觉\n与其用固定规则被动过滤 harness 编辑，不如主动寻找能摧毁当前增益的基准协议变换。每确认一个有效的反事实基准，就将其作为约束加入档案，限制后续演化必须在这些变换下保持增益。这样，harness 的提升只能来自真正可迁移的任务解决能力，而非协议捷径。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n       Archive Aₜ₋₁\n           │\n           ▼\n[H₀]→[Proposer]→Hₜ→[Challenger]→Φ_bₜ\n                                  │\n                      ┌───────────┘\n                      ▼\n              [Validity Firewall]──不通过──→拒绝\n                      │通过\n                      ▼\n              [D_conf,t 确认]──未确认──→不加入存档\n                      │确认\n                      ▼\n              [更新Archive Aₜ]──→下一轮Proposer\n\nT轮后: 从H₀,...,Hₜ选满足Aₜ约束的最优harness\n      → D_cert 认证集最终评估\n```\n\nCHASE在每轮交替执行Proposer演化和Challenger挑战。Proposer以当前harness $H_{t-1}$、历史分数与执行轨迹、已确认反事实存档 $A_{t-1}$ 为输入，编辑prompt、retrieval、tools和控制代码，输出 $H_t$；$H_t$ 必须在存档中所有反事实基准上满足增益破坏 $\\leq\\varepsilon$（§3.2）。Challenger以 $H_t$、$H_0$ 和发现集 $D_\\text{disc}$ 上的配对反馈为输入，搜索可执行的协议变换 $\\Phi_{b_t}$，目标是最大化 $H_t$ 相对 $H_0$ 的增益破坏（§3.2）。提议的变换先经Validity Firewall检查任务语义、答案、可用信息和评分是否保持不变，不通过则拒绝（§3.2，Supp. B.3）。通过检查的变换在确认集 $D_{\\text{conf},t}$ 上重新估计增益破坏，若超过阈值 $\\eta_{\\text{conf},t}$ 则加入存档，成为后续演化的约束（§3.3）。T轮结束后，从 $H_0,\\ldots,H_T$ 中选取满足存档 $A_T$ 约束且发布增益最高的harness，在密封的认证集 $D_\\text{cert}$ 上做最终评估（§3.2–3.3）。\n\n### § 6 核心数学推导\n\n核心推导建立有限反事实存档与理想shortcut-neutralized benchmark $B_0$ 之间的统计桥梁。关键估计量 $\\Delta_\\text{BS}(H;H_0)=G_\\text{rel}-G_0$ 衡量harness通过捷径获得的\"虚假\"增益：$G_\\text{rel}$ 是发布基准上的增益，$G_0$ 是消除捷径后的存活增益（§3.1）。由于 $B_0$ 通常不可知，CHASE用有限存档 $A$ 近似它。定义 $K(A)$ 为存档中变换组合产生 $B_0$ 所需的最少变换数，$\\rho$ 为组合变换引入的额外增益破坏上界。Theorem 1证明：若 $K(A)$ 有限，则以高概率保证 $G_0$ 的下界不低于存档最坏存活增益减去 $(K(A)-1)\\cdot\\rho$ 与估计误差，存档越接近 $B_0$ 保证越紧（§4）。Theorem 2用packing论证证明每个确认反事实迫使后续harness发生非平凡变化，因此确认轮次有上界，足够大的 $T$ 必然出现未确认轮次（§4）。Theorem 3给出互补结论：未确认轮次证明当前harness在整个有效反事实族上增益破坏很小，同时保持接近最优的发布增益，构成近似停止证书（§4）。\n\n### § 7 实验设计与结论\n\n论文围绕三个问题设计实验。第一，CHASE能否发现并约束benchmark-wide shortcut？在OfficeQA上，第一轮Challenger发现\"表格上下文重定位\"反事实——将表格标题、单位行和注释移到表格前方——暴露 $H_1$ 对证据常规位置的依赖，增益从+8.16%逆转为−5.10%；第二轮所有候选违反存档约束，回退到 $H_0$；第三轮找到满足约束的4.08%增益（§5.3）。第二，CHASE的增益在协议变化下是否更稳定？在76题认证集上，CHASE发布得分最高(68.86%)且反事实上保持稳定(68.42%)，而HarnessCompass下降更大；优势还迁移到独立语料Pro V2(30.37% vs 26.30%)（Table 1）。第三，增益是否真正来自能力提升？在可控的Syn-Ledger上，CHASE在 $B_0$ 上增益最高且 $\\Delta_\\text{BS}$ 较小，Oracle-$B_0$ 虽直接访问 $B_0$ 但仅略优，说明CHASE无需预知捷径即可逼近理想基准效果（Table 2）。", "additional_insights": "### § 8 阅读收获\n\n论文区分了任务特定捷径与基准范围捷径：前者通过任务留出即可暴露，后者源于评测协议中跨任务共享的相关性（如文档通道分配、表格位置规律），任务换新但协议不变则捷径依然有效。CHASE在每轮harness更新后由Challenger搜索反事实协议变换，能大幅破坏当前增益且通过有效性验证的变换进入约束档案，限制后续进化方向。理论证明有限反事实档案可认证理想捷径中和基准B0下的存活增益，且Challenger搜索不会无限确认新约束。在OfficeQA和合成基准Syn-Ledger上，CHASE在保持发布基准增益的同时将协议变化下的增益破坏降至接近零。\n\n### § 9 最脆弱的假设\n\n最脆弱的假设是有效性防火墙能确保反事实变换仅改变协议表面而不影响任务语义。若变换实际改变了执行难度——如OfficeQA中重编码表格上下文可能影响agent解读检索结果的难度——则增益破坏混淆了捷径依赖与难度变化，整个约束机制失效。论文仅提供静态检查清单（表B.2），缺少经验证据证明这些检查足以排除难度变化；在Syn-Ledger上可通过B0交叉验证，但在真实基准上这一保证难以确立。\n\n### § 10 最小复现实验\n\n取OfficeQA Full的50个问题，让LLM对初始harness做1-2轮简单优化（仅修改提示和检索策略），在发布协议和一个协议变换（重编码检索结果中的表格上下文字段）下分别测量优化前后harness的分数。若发布协议上的增益在变换后大幅消失（破坏超过5个百分点），支持harness优化依赖基准范围捷径这一前提；若增益基本保持（破坏低于2个百分点），则该前提不成立，CHASE的动机减弱。此实验不需实现Challenger和确认机制，仅验证核心前提。", "research_value": "### § 11 最强反例设计\n最强反例针对有效性防火墙无法区分捷径失效与任务难度增加的缺陷。在长文档问答中，Challenger可能提议将结构化的Markdown表格重排为无格式纯文本。这种变换能通过静态语义检查，但会显著增加agent解析信息的认知负担。若此时分数大幅下降，系统会误判harness依赖排版捷径并将其加入约束档案。这会迫使后续演化放弃真正有效的检索优化，导致CHASE在表面合规的同时牺牲了真实的任务解决能力。\n\n### § 12 后续研究设想\n后续研究应检验能否用动态能力校准替代静态有效性防火墙。核心改变是在评估协议变换时，引入具有不同解析能力的多个agent作为对照组。这值得测试是因为，如果同一变换对不同能力模型的分数破坏程度差异显著，就能证明该变换实质上改变了任务难度而非仅破坏协议捷径。首个对照实验可在OfficeQA中选取50个问题，对比小模型与大模型在表格重排变换下的增益破坏差异。若差异显著，说明现有静态防火墙存在系统性误判。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Guojun Zhu\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Xunheng Huang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Peng Yin\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Jiahui Xie\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Sanguo Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Doudou Zhou\", \"affiliations\": [2], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"UCAS\"},\n    {\"id\": 2, \"name\": \"NUS\"},\n    {\"id\": 3, \"name\": \"CASIA\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"†\", \"text\": \"Corresponding author: ddzhou@nus.edu.sg\"}\n  ]\n}\n```", "summary_translation": "可靠的智能体评估因自动测试框架优化而变得复杂，该优化过程反复使用已发布的评测基准 $B_{\\mathrm{rel}}$ 来指导一个提议器（Proposer），该提议器围绕固定的目标智能体编辑提示词、记忆、检索、工具和控制代码。任务留出（Task holdout）会改变语义任务，但保持评测基准协议不变，因此“不良天才”提议器可以生成一个作弊的测试框架，其在已发布评测基准上的增益依赖于评测基准全局的捷径。我们引入了反事实测试框架搜索与演化（CHASE），该方法将测试框架演化转化为在保持有效性的评测基准反事实样本（validity-preserving benchmark counterfactuals）上的约束生成。在每次提议器更新后，挑战器（Challenger）会搜索一种可执行的协议转换，以实现大幅的增益削减（gain destruction）。有效性防火墙（validity firewall）会检查任务语义是否得到保留，而确认集（confirmation set）则决定该反事实样本是否进入有限存档。我们形式化了一个精确的捷径中和评测基准（shortcut-neutralized benchmark）$B_0$，并建立了统计保证，将有限反事实存档与 $B_0$ 联系起来，并刻画了序列化挑战器搜索。我们在一个合成评测基准和 OfficeQA 上评估了 CHASE，其中 CHASE 保留了在已发布评测基准上的强劲增益，同时在有效的协议更改下大幅减少了增益削减。"}, {"title": "ProgramDistill: From Interactive Web Apps to Verifiable Reference-Guided SWE Tasks", "arxiv_id": "2609.18805", "authors": "Jeonghye Kim, Minseon Kim, Young Jin Kim, Matheus Pereira, Marc-Alexandre Côté, Alessandro Sordoni, Xingdi Yuan, Zhengyan Shi", "summary": "Coding agents are typically evaluated with desired behavior specified through issues or instructions. In practical web development, however, agents may need to infer behavior from working software and implement it in an incomplete application. We introduce ProgramDistill, a benchmark evaluating coding agents on features discovered through interaction with fully functional reference applications. We build ProgramDistill by factorizing applications into features of different granularities, each associated with replayable behaviors executable via its gold patch. Our pipeline, mine-craft-patch, discovers 1,975 replay-verified behaviors across 26 applications and constructs 4,063 tasks without human intervention. Across nine frontier coding agents, GPT-6 Astra and Claude Opus 5 achieve 49.2% and 28.8% success on cumulative workflows in full-application reconstruction. In partial-application reconstruction, success falls from 100% to 64.0% and from 96% to 32% as restoration depth increases from 1 to 8. ProgramDistill thus provides a scalable benchmark with controlled difficulty for evaluating and diagnosing coding agents, and a natural basis for future curriculum-based training.", "category": "cs.AI", "cluster": "Agent Benchmarking \u0026 Evaluation", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-54 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 论文的核心贡献是提出了一个名为 ProgramDistill 的新基准测试，用于评估和诊断 coding agents 在复杂软件工程任务中的能力，特别是从功能完整的参考应用中推断行为并在不完整应用中实现这些行为的能力。根据筛选标准第一步中的保留规则，“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents / Multi-Agent LLMs，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留”。该论文明确以 coding agents 为研究对象，通过评估九个前沿智能体在应用重构任务中的表现，揭示了智能体在长期决策和深度恢复中的失败模式。此外，摘要最后提到该基准为未来基于课程的训练提供了基础，这与智能体的训练和演化方向紧密相关。因此，该论文符合研究目标中对 LLM 智能体评估和诊断的要求。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决的核心问题是：如何将一个可运行的交互式 Web 应用转化为可验证的软件工程任务，让编程代理通过与参考应用交互来推断预期行为，并在不完整的应用中恢复该行为。在实际 Web 开发中，开发者常需从旧版本、原型或类似应用中推断行为规范，而非依赖预先写好的 issue 或测试。现有评测基准普遍假设期望行为已被明确指定，无法覆盖这种\"从运行软件中发现规范\"的场景。ProgramDistill 通过将应用分解为可重放的行为单元并保留前置依赖关系，提供从原子修复到完整重建的递增难度任务，为评测和诊断编程代理提供了可扩展的基准。\n\n### § 2 前人工作与不足\n\n最相关的前人工作是 ProgramBench 和 MirrorCode，它们已将可执行软件作为行为规范，要求代理探测程序并重建实现。但它们将程序视为整体重建目标，不分解内部行为结构，也无法控制任务难度。ProgramDistill 则利用交互式 Web 应用的状态依赖性，将功能分解为不同粒度的可重放行为，沿前置依赖链组合成递增深度的任务。另一类工作如 SWE-bench 依赖人工 issue 或测试定义期望行为，Web2Code 等从固定视觉参考重建网页，均属于\"规范消费\"而非\"规范发现\"，无法评测代理主动探索运行应用、推断行为的能力。", "core_insight": "### § 3 重建作者的思考路径\n\n现有软件工程评测基准依赖人工编写的 issue 或测试来指定期望行为，但实际 Web 开发常需从可运行的参考软件中推断行为。已有行为到代码的工作将程序视为整体重构目标，忽略了交互式应用中由状态依赖形成的行为层级。作者观察到，Web 应用的功能通过界面操作展开，存在天然的前置条件谱系（如先登录才能建项目），这种结构可被分解、掩码并重新组合，从而自动生成难度可控的修复任务。\n\n### § 4 核心直觉\n\n把能跑的 Web 应用本身当作规范来源：自动挖掘其中可重放的交互行为，既用作修复任务目标，也用作验证标准。由于行为天然具有状态依赖链，沿链组合掩码即可自动生成从单点修复到全应用重构、难度递增的评测集，无需人工标注。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n  26个Web应用 (reference + editable实例)\n         │\n    ┌────▼─────┐\n    │  Mining   │ LLM Agent探索live应用,记录可回放trace\n    │  (挖掘)   │→ replay验证 → trace bank B (1,975条)\n    └────┬─────┘\n         │ verified traces + prerequisite lineage\n    ┌────▼─────┐\n    │ Crafting  │ 掩码源码实现 → 原子验证(前置pass/目标fail)\n    │ (构建)   │→ 沿lineage组合 → 累积任务 (4,063个)\n    └────┬─────┘\n         │ masked app + gold patch + problem statement\n    ┌────▼─────┐\n    │ Patching  │ Agent观察reference,编辑current,验证\n    │ (修复)   │→ replay验证 → BinaryScore / ChainScore\n    └──────────┘\n```\n\n**Mining（挖掘）** 阶段以 26 个自包含 Web 应用为输入，每个应用提供固定的 reference 实例和可编辑的 editable 实例，通过共享的 Playwright browser helper 进行交互（§2.1）。多个 LLM 子代理协作：Planner 基于源码和 UI 证据提出行为目标并指定可选的 parent trace；Collector 在 live 应用中探索目标行为，记录浏览器操作序列和成功信号；随后从干净状态重新采集以去除冗余步骤，生成更精简的 trace。每条 trace 经 replay verifier 验证——从重置状态按序回放所有操作，仅当全部操作完成且预期信号满足时才被接受。被接受的 trace 带有 parent 链接，形成 prerequisite lineage（前置依赖谱系），输出为包含 1,975 条 replay-verified behavior 的 trace bank（§2.2）。\n\n**Crafting（构建）** 阶段将已验证的 behavior 转化为修复任务。Task Generator 识别负责目标行为的源码实现并生成 mask（掩码），移除实质性逻辑而保留模块可编译性。掩码分两种 scope：logic-only 仅移除行为逻辑而保留 UI，logic-and-UI 同时移除两者。原子任务验证要求掩码后应用仍能构建启动、所有前置 trace 仍可通过、且目标 trace 失败——这构成 SWE-bench 风格的 fail-to-pass（F2P）与 pass-to-pass（P2P）检查（§2.3）。Mask-Depth Critic 拒绝浅层掩码（如仅切换 feature flag）。验证后的原子掩码沿 prerequisite lineage 组合为累积任务，restoration depth（修复深度）$r_L$ 表示需同时修复的目标数量。组合时非冲突编辑直接合并，冲突部分由 merge agent 解决。最终输出 4,063 个任务，每个附带 gold patch（通过反向掩码 diff 得到）并经 gold-patch replay 验证。\n\n**Patching（修复）** 阶段评测 coding agent 能否从 working reference 推断行为并在不完整应用中实现。Partial-application reconstruction（部分重建）中，agent 收到掩码后的仓库和问题描述，可编辑 hot-reloading 的 current 应用并通过浏览器与 reference 对比，但无法访问 reference 源码。Full-application reconstruction（完整重建）中，agent 从最小可执行脚手架出发，仅凭产品描述和 reference 交互来重建整个应用。评测使用 mining 阶段采集的 trace 进行 replay 验证，BinaryScore 要求完整 lineage 全部通过，ChainScore 对恢复的前缀部分给予部分分数（§2.4）。\n\n### § 6 核心数学推导\n\n本文以定义性公式为主，无复杂推导，以下补充关键定义的直觉。\n\n**Replay verifier** 定义为 $V(A, L_d) \\in \\{0, 1\\}$，其中 $A$ 是完整应用，$L_d = (\\tau_1, \\ldots, \\tau_d)$ 是一条 trace lineage。它从重置状态依次回放 $\\tau_1$ 到 $\\tau_d$，全部操作完成且预期信号满足时返回 1。这个验证器贯穿挖掘、掩码验证和修复评测，是整个 benchmark 的一致性基础。\n\n**原子掩码验证条件**（$d \u003E 1$ 时）要求：掩码后应用能构建启动、前置 lineage 仍通过（$V(A[m_d], L_{d-1}) = 1$）、且目标行为失败（$V(A[m_d], L_d) = 0$）。这确保掩码精确破坏目标行为而不影响其前置依赖。\n\n**累积掩码** $M_L = m_{j_1} \\oplus \\cdots \\oplus m_{j_{r_L}}$，其中 $\\oplus$ 表示对同一基线的源码修改的合并，$r_L$ 为 restoration depth。未掩码的 trace 作为 replay bridge（回放桥梁）建立前置状态但不作为修复目标，因此 lineage depth $d$ 可大于 $r_L$。\n\n**评分**：BinaryScore 仅当完整 lineage 通过时为 1；ChainScore = 恢复的前缀长度 / $r_L$，对部分恢复给予分数。例如两目标累积任务中，若第一个通过而第二个失败，BinaryScore = 0 而 ChainScore = 1/2。\n\n### § 7 实验设计与结论\n\n**问题一：coding agent 能否在 restoration depth 增加时持续修复多个依赖行为？** 实验在 ProgramDistill-300 上评测九个前沿模型，按 restoration depth 1–8 分层抽样，比较 BinaryScore 随深度的变化。结果显示所有模型性能随深度显著下降：GPT-6 Astra 从 depth 1 的 100% 降至 depth 8 的 64.0%，Claude Opus 5 从 96% 降至 32%。分析发现任务负担（需恢复的代码行数增长 9.3 倍）与 agent 投入（每个目标的观察步骤下降约 75%）之间存在日益扩大的错配——agent 在更深的任务中对每个行为的理解和验证投入反而更少。\n\n**问题二：agent 能否从 working reference 完整重建应用？** 实验在 12 个有状态 Web 应用上评测完整重建，使用 590 个原子行为测试和 413 个累积工作流测试。Astra 达到 49.2% 的累积恢复率，Opus 5 为 28.8%。对 977 个失败原子行为的分析揭示，59.2% 的失败源于行为未被观察，27.9% 源于实现了错误的状态或结果——agent 的自我验证常检查相关功能而非精确复现失败的工作流，导致错误未被发现。\n\n**问题三：更高的观察量是否意味着更好的修复性能？** 实验比较各模型的交互模式与性能。Astra 以最少的编辑步骤（平均 9.9 次）和最多的观察步骤实现最强修复性能，呈现\"重观察、轻编辑\"模式；而 Opus 5 在完整重建中通过 shell 循环在每个 agent step 内收集多个浏览器状态（平均 7.9 个/步 vs Astra 的 1.6 个），但恢复的行为更少。这表明观察量本身不决定性能，关键在于 agent 如何在观察、验证和编辑之间有效分配精力。", "additional_insights": "### § 8 阅读收获\nProgramDistill 将交互式 Web 应用分解为可重放的行为，构建了无需人工干预的软件工程任务基准。智能体需通过观察参考应用来推断并恢复缺失功能，这模拟了实际开发中从现有软件推断行为的过程。实验表明，随着恢复深度的增加，智能体成功率显著下降，且观察和验证的努力分配对修复性能至关重要。\n\n### § 9 最脆弱的假设\n核心假设是挖掘出的行为轨迹能准确代表应用功能，且基于这些轨迹的重放验证能有效评估修复结果。如果轨迹无法覆盖关键状态依赖，或重放验证过于宽松，整个基准的有效性就会失效。论文提供了重放验证的通过率，但缺少对轨迹覆盖率和验证准确性的深入分析。\n\n### § 10 最小复现实验\n在一周内，可选取一个简单的 Web 应用，手动实现 mine-craft-patch 的核心流程。使用一个 LLM 作为挖掘和构建模型，生成少量行为轨迹和修复任务。测量生成的任务是否可重放验证，以及一个编码智能体能否通过观察参考应用完成修复。如果生成的任务大多无法通过重放验证，或智能体无法完成修复，则说明流水线的有效性存疑。", "research_value": "### § 11 最强反例设计\n如果我要挑战这篇论文，我会质疑重放验证是否能防止代理走捷径。代理可能通过硬编码特定 trace 的预期输出，或在代码中写死针对验证信号的条件分支来通过重放，而非实现通用的状态管理逻辑。为了检验这一点，可以对成功通过的 patch 进行静态分析，检测其中是否存在针对特定输入的硬编码匹配。如果大量此类代码通过了 BinaryScore，就说明重放验证过于宽松，基准测量的不是规范推断能力，而是拟合验证脚本的能力。\n\n### § 12 后续研究设想\n围绕挖掘阶段依赖大模型自主探索可能导致的覆盖率局限，可以提出一个后续研究问题：引入代码覆盖率引导的轨迹挖掘能否提升任务对深层状态依赖的诊断力？当前的 LLM 探索可能偏向于表面的快乐路径，遗漏复杂的内部状态转换。首个对照实验可选取若干应用，分别用纯 LLM 探索和结合动态执行路径分析的引导探索生成行为轨迹，并比较两组轨迹对内部状态分支的覆盖率差异。如果引导探索组的任务失败更多源于逻辑错误而非行为未被观察，就说明改进挖掘机制能提升基准的评测深度。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jeonghye Kim\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Minseon Kim\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Young Jin Kim\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Matheus Pereira\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Marc-Alexandre Côté\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Alessandro Sordoni\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Xingdi Yuan\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Zhengyan Shi\", \"affiliations\": [2], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"KAIST\"},\n    {\"id\": 2, \"name\": \"Microsoft Research Montréal\"},\n    {\"id\": 3, \"name\": \"Microsoft AI\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"1\", \"text\": \"We are working on a public release of the ProgramDistill benchmark.\"}\n  ]\n}\n```", "summary_translation": "编程智能体通常通过问题或指令来指定期望行为并进行评估。然而，在实际的网页开发中，智能体可能需要从可运行的软件中推断行为，并在不完整的应用程序中实现它。我们引入了ProgramDistill，这是一个评测基准，旨在利用通过与功能完整的参考应用程序交互所发现的功能来评估编程智能体。我们通过将应用程序分解为不同粒度的功能来构建ProgramDistill，每个功能都与可通过其黄金补丁（gold patch，即标准答案代码补丁）执行的可重放行为相关联。我们的处理流程mine-craft-patch在26个应用程序中发现了1,975个经重放验证的行为，并在无需人工干预的情况下构建了4,063个任务。在九个前沿编程智能体中，GPT-6 Astra和Claude Opus 5在全应用重建的累积工作流上分别取得了49.2%和28.8%的成功率。在部分应用重建中，随着恢复深度从1增加到8，成功率从100%降至64.0%，以及从96%降至32%。因此，ProgramDistill提供了一个难度可控且可扩展的评测基准，用于评估和诊断编程智能体，并为未来基于课程式的训练提供了自然的基础。"}]}, {"name": "Agent Skills \u0026 Knowledge Reuse", "count": 2, "papers": [{"title": "M-SQE: Multilingual Skill Quality Estimation for Enhancing Language Equality in Agentic Skill Use", "arxiv_id": "2609.18445", "authors": "Yilun Liu, Shimin Tao, Minggui He, Chenxin Liu, Li Zhang, Chen Liu, Miao Zhang, Jiaxin Guo, Min Zhang, Liqun Deng, Xiaojun Meng, Daimeng Wei", "summary": "Agent skills, reusable procedural documents that extend LLM agents beyond their parametric memory, have become an important interface for deploying agents on real-world tasks. Community-maintained skill libraries built around this interface are growing rapidly. However, this ecosystem remains deeply English-centric: our audit finds that low-resource languages such as Swahili and Hindi have no in-language skill content, so retrieval often returns a skill written in a different language than the query, degrading accuracy and recall. A practical solution is to synthesize in-language skills for retrieval but the quality can be unreliable, so relevance in this setting alone often surfaces a related but unusable candidate. To address this, we propose M-SQE, a post-retrieval Multilingual Skill Quality Estimation framework that scores candidates via a Theory view for intrinsic quality and an Action view for task-grounded utility, unified into a domain-conditioned final score. We evaluate M-SQE across three skill-use domains: general, tool-use, and cultural tasks. Empirically, we build three-layer candidate skill pools mirroring today's ecosystem, where M-SQE's task success exceeds existing baseline's average by at least +3.5 points across three different retrievers. Particularly, M-SQE lifts the lowest-resource languages most (+12.9pp on Hindi and +5.6pp on Swahili) and achieves strong performance across all six culture regions, thereby moving agentic skill use toward linguistic and cultural equality.", "category": "cs.CL", "cluster": "Agent Skills \u0026 Knowledge Reuse", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n论文解决的是多语言 LLM Agent 在调用技能时面临的语言不平等与质量问题。当前社区维护的技能库几乎全是英文，斯瓦希里语和印地语等低资源语言的技能数量为零。跨语言检索会严重降低 Agent 的准确率，而通过机器翻译或模型自生成合成的多语言技能质量不稳定，且表面相关往往并不代表可执行。解决该问题能确保非英语用户也能获得可靠、可执行的 Agent 服务，从而缩小 Agent 时代的语言与文化鸿沟。\n\n### § 2 前人工作与不足\n此前相关工作主要分为两类，均存在关键缺口。第一类是技能检索与重排系统（如 SkillFlow、ToolRerank），它们仅基于查询与技能的相关性进行排序，无法判断检索到的技能是否存在翻译错误或执行缺陷，导致“看似相关却无法使用”的技能被选中。第二类是多语言数据质量评估方法（如 DEITA、M-DaQ），它们仅评估数据自身的语言流畅度，忽略了 Agent 技能特有的可执行性和上下文效率，且不评估技能与具体查询的匹配度。这两类工作分别停留在“相关性匹配”和“静态语言质量”上，未将“内在质量”与“任务可用性”结合，留下了检索后质量评估的空白。", "core_insight": "### § 3 重建作者的思考路径\n作者观察到多语言技能库极度缺乏低资源语言内容，只能依赖机器翻译或模型生成来补充，但这些合成技能质量参差不齐。同时，跨语言检索会引入分布不匹配，而现有的检索后处理方法要么只看相关性，要么只看数据本身的语言质量，都无法判断技能是否真正能被智能体执行。因此，作者想到需要一种结合“内在质量”和“任务匹配度”的评估方法，并根据任务类型动态调整权重，从而在检索后筛选出真正可用的技能。\n\n### § 4 核心直觉\n先前的方法要么只看技能与查询的相关性，要么只看技能自身的语言质量，但这两者都无法保证技能能被智能体成功执行。M-SQE的核心直觉是：一个技能是否可用，既取决于它本身是否正确、可执行，也取决于它的步骤和约束是否与当前查询的具体需求匹配。通过结合这两个视角并按任务领域动态路由，就能过滤掉看似相关但实际无法执行的“伪可用”技能。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n用户查询 q\n  │\n  ├──────────────┐\n  ▼              ▼\n检索器 R        领域路由器 τ\n(BM25/Neural/   (5-shot LLM 分类:\n SkillFlow)     general/tool/culture)\n  │              │\n  ▼              │\n候选集 C_K        │\n  │              │\n  ├──────┬───────┘\n  ▼      ▼\nTheory  Action\n视图     视图\n(6维     (6维\n 内在     任务\n 质量)    适配)\n  │      │\n  ▼      ▼\n  └──┬───┘\n     ▼\n 领域融合\n ├ general: 0.6·Action+0.4·Theory\n ├ tool: Theory≥65 守卫, 再按 Action 排序\n └ culture: z(Retrieval)+z(Theory)+z(Action)\n     │\n     ▼\n Top-N 技能 → Solver 执行任务\n```\n\nM-SQE 的推理流程分为以下步骤：\n\n1. **检索候选**：给定查询 $q$ 和技能池 $S$，检索器 $R$ 返回深度为 $K$ 的候选集 $C_K$（§4.1）。三种检索器分别覆盖词法（BM25）、神经（Neural）和技能专用（SkillFlow）路线。\n\n2. **领域路由**：一个 5-shot 提示的 LLM 路由器将查询分类为 general、tool-use 或 cultural 三种领域 $\\tau$（§4.4），准确率 98.5%。该分类决定后续融合规则的选择。\n\n3. **Theory 视角打分**：对每个候选技能独立评估六维内在质量——正确性（红线维度）、完整性、可执行性、跨语言忠实度、本地化、上下文效率（§4.2）。该视角不接触查询，只判断技能文档本身是否可靠。若红线维度违规，总分封顶 40；若任一基础维度违规，封顶 80，防止单一严重缺陷被平均掩盖。\n\n4. **Action 视角打分**：结合当前查询评估六维任务适配度——任务适用性、流程匹配、约束匹配、输出格式匹配、语言适配、误导风险（§4.3）。该视角直接针对\"相关但不可用\"的失败模式：只有流程可执行、约束对齐且误导风险低时才允许高分。\n\n5. **领域融合**：根据路由结果 $\\tau$ 选择融合规则（§4.4）。General 任务用凸组合 $0.6 \\times \\text{Action} + 0.4 \\times \\text{Theory}$，给任务适配略大权重同时保留质量正则。Tool-use 任务用词典序守卫：Theory $\\geq 65$ 的候选优先，再按 Action 排序，因为工具调用有离散的执行契约，不可用即淘汰。Cultural 任务对 Retrieval、Theory、Action 三者做 per-query z-score 标准化后等权求和，因为文化任务有三种独立失败方式（事件错误、事实不可靠、答非所问），任一视角都不应主导。\n\n6. **选择与执行**：按融合分数排序，取 Top-$N$ 技能（匿名化，去除来源标识）交给下游 Solver 执行（§4.1）。Solver 只看到查询和技能正文，不接触金标准答案或检查器信息。\n\n整个流程在推理时运行，不涉及训练。论文另做了一个下游实验（Table 5）：用各方法选出的技能构建轨迹微调 Qwen3.5-9B，验证质量估计信号也能改善训练数据构造。\n\n### § 6 核心数学推导\n\n论文的核心公式是统一评分函数（§4.4，式 1）：\n\n$$S_{\\text{M-SQE}}(q, s; \\tau) = a_\\tau \\cdot C_{\\text{gen}}(q,s) + b_\\tau \\cdot C_{\\text{func}}(q,s) + c_\\tau \\cdot C_{\\text{cul}}(q,s)$$\n\n其中 $(a_\\tau, b_\\tau, c_\\tau) \\in \\{0,1\\}^3$ 且 $a_\\tau + b_\\tau + c_\\tau = 1$，即根据领域 $\\tau$ 恰好激活一个领域组件。这是一个**硬路由**机制：general 领域设 $(1,0,0)$，tool-use 设 $(0,1,0)$，cultural 设 $(0,0,1)$。直觉是不同任务类型的\"可用性\"判断标准本质不同——工具调用是二值门控（能不能执行），文化问答需要多源证据交叉验证，通用任务则是连续评分——因此不应强行用同一权重组合处理所有任务。\n\n三个领域组件各自内部对 Theory 和 Action（及 Retrieval）的融合方式也不同：$C_{\\text{gen}}$ 是线性凸组合，$C_{\\text{func}}$ 是带阈值守卫的词典序（等价于 $M \\cdot \\mathbf{1}[\\text{Theory} \\geq 65] + \\text{Action}$，$M$ 为大于 Action 值域的常数偏移），$C_{\\text{cul}}$ 是 per-query z-score 标准化后的等权求和。z-score 标准化的作用是消除三个视角的量纲差异，使它们在可比尺度上贡献，避免某个视角因原始分值范围大而主导排序。\n\n### § 7 实验设计与结论\n\n**问题一：在真实多语言技能池中，M-SQE 能否提升任务成功率？** 论文构建了三层技能池（生态式 + 机器翻译 + 模型自生成），在三个领域（通用技能、工具调用、文化问答）× 三种检索器上对比 M-SQE 与六种基线（相关性重排器和质量评分器）。结果显示 M-SQE 在全部 9 种设置中均排名第一或并列第一，平均成功率 69.1%，超过最强基线 SkillFlow 3.5 个百分点，且在所有设置中严格优于仅检索基线 6.3 个百分点（Table 3）。这验证了核心前提：检索返回的相关技能往往不可用，双视角质量估计能弥合这一差距。\n\n**问题二：M-SQE 是否优先帮助低资源语言？** 论文将工具调用任务按语言分解，对比 M-SQE 与两个基线的成功率。结果显示提升最大的正是技能供给为零的两种语言：印地语 +12.9 个百分点、斯瓦希里语 +5.6 个百分点（Figure 3）。在六个文化区域上，M-SQE 也一致匹配或超过基线，南亚 +6.6 个百分点、大洋洲 +8.4 个百分点。这种跨区域的一致性表明质量信号捕获的是文化正确性而非表面流畅度。\n\n**问题三：两个视角是否都不可或缺？** 论文做了消融实验，分别仅用 Theory 或仅用 Action（Table 4）。结果显示单独 Action 在工具调用上已接近完整 M-SQE（38.5 vs 39.6），但单独 Theory 大幅落后（28.7）；而在文化任务上单独 Action 已达 88.5，Theory 仅 59.6。完整 M-SQE 在三个领域均优于任一单视角。机制分析（Case 1/2）揭示了互补角色：Action 视角提供查询适配信号（能区分\"开灯\"与\"关灯\"技能），Theory 视角充当质量守卫（拦截结构完整但内容不可执行的候选）。两者覆盖的是多语言技能的不同失败模式，缺一不可。", "additional_insights": "### § 8 阅读收获\n当前Agent技能库严重偏向英语，低资源语言缺乏原生技能，跨语言检索会显著降低任务成功率。M-SQE框架在检索后引入双视角打分：理论视角评估技能内在质量，行动视角评估任务匹配度与误导风险。该方法在三种任务领域均提升了成功率，并在印地语和斯瓦希里语等零原生技能的语言上获得了最大提升。\n\n### § 9 最脆弱的假设\nM-SQE的核心假设是：大语言模型作为评分器，能准确评估技能的“可执行性”和“误导风险”，且该能力在低资源语言上依然有效。如果评分器在斯瓦希里语等语言上的理解能力不足，M-SQE的打分就会失效甚至引入新偏差。论文虽测试了不同评分器骨干的鲁棒性，但未提供直接证据证明评分器在极低资源语言上对复杂维度的判断准确度。\n\n### § 10 最小复现实验\n在一周内，可使用论文开源的Tool Use数据集，仅复现BM25检索器与M-SQE的行动视角打分模块。实验保留原论文的印地语和斯瓦希里语子集，使用Gemini-3-Flash作为评分器，对比Retrieve-only基线。测量Top-3任务成功率，若M-SQE在这两种语言上的提升超过5个百分点，则支持原结论；若提升不明显，则可能表明评分器在低资源语言上的评估能力不足，触及了方法的适用边界。", "research_value": "### § 11 最强反例设计\n如果我要攻击这篇论文，我会构建一个“表面流畅但逻辑矛盾”的低资源语言技能池来测试 Theory 视角。具体而言，在印地语和斯瓦希里语的候选技能中，注入语法正确但参数约束冲突的工具调用技能，例如要求同时执行开启和关闭操作。如果 M-SQE 未能显著降低这些矛盾技能的分数，且下游成功率随之大幅下降，就能证明 LLM 评分器在低资源语言上被表面流畅度欺骗。这表明其提升可能仅来自过滤了机器翻译的低级语法错误，而非真正理解了可执行性。\n\n### § 12 后续研究设想\n围绕 M-SQE 依赖 LLM 评分器导致推理成本高昂的局限，后续可以研究能否用轻量化的局部特征匹配替代全量 LLM 评分。需要改变的是将六维打分简化为基于关键参数和约束的规则匹配，仅在规则冲突时调用 LLM。值得测试是因为当前方法对每个候选技能进行两次六维 LLM 打分，实际部署成本过高。首个对照实验可在工具调用任务上，对比全量 LLM 评分与“规则优先+LLM兜底”策略的准确率和延迟。如果轻量化策略在保持成功率相近的情况下显著降低了推理时间和 token 消耗，就证明原方法存在冗余计算。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yilun Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shimin Tao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Minggui He\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Chenxin Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Li Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Chen Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Miao Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiaxin Guo\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Min Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Liqun Deng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiaojun Meng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Daimeng Wei\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Huawei, China\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "智能体技能是可复用的程序性文档，它将大语言模型（LLM）智能体的能力扩展至其参数化记忆之外，已成为在真实世界任务中部署智能体的重要接口。围绕该接口构建的社区维护技能库正在快速增长。然而，该生态系统仍深度以英语为中心：我们的审查发现，斯瓦希里语和印地语等低资源语言缺乏同语言的技能内容，因此检索通常会返回与查询语言不同的技能，从而降低了准确率和召回率。一种实用的解决方案是为检索合成同语言的技能，但其质量可能不可靠，因此仅依靠该设定下的相关性往往会呈现出相关但不可用的候选技能。为了解决这一问题，我们提出了 M-SQE，这是一个检索后的多语言技能质量评估框架，它通过用于评估内在质量的理论视角和用于评估基于任务效用的行动视角对候选技能进行评分，并统一为领域条件化的最终得分。我们在三个技能使用领域对 M-SQE 进行了评估：通用、工具使用和文化任务。在实验中，我们构建了映射当今生态系统的三层候选技能池，其中 M-SQE 的任务成功率在三种不同的检索器上至少比现有基线的平均水平高出 3.5 分。特别是，M-SQE 对最低资源语言的提升最大（印地语提升 12.9 个百分点，斯瓦希里语提升 5.6 个百分点），并在所有六个文化区域均取得了优异表现，从而推动智能体技能使用向语言和文化平等迈进。"}, {"title": "Reflect, Revise, Reuse: Training-Free Skill Evolution for GUI Agents", "arxiv_id": "2609.17653", "authors": "Bofan Chen, Boxuan Zhang, Fei Tang, Zhengxi Lu, Yong Du, Tongbo Chen, Weiming Lu, Jun Xiao, Yueting Zhuang, Yongliang Shen", "summary": "GUI agents execute long-horizon tasks on dynamic graphical user interfaces, where pop-ups, delayed loads, and relocated widgets routinely invalidate plans fixed before execution. Recent agent-skill frameworks encapsulate reusable procedural knowledge to mitigate this, yet existing skill designs are largely developed without targeting GUI execution dynamics and treat skills as static artifacts produced before deployment rather than living procedural knowledge that improves through it. We argue that what GUI agents need is not better static skills, but skills that can be revised from execution feedback at deployment time, without additional training. We propose \\textbf{EvoSkill-GUI}, a training-free framework in which each skill is a structured multi-file package containing retrieval metadata, executable plans, backup localization, failure-recovery rules, accessibility utilities, and failure cases. EvoSkill-GUI operates through a \\textbf{\\emph{reflect-revise-reuse}} loop: the executor performs instant in-rollout revisions, an isolated critic diagnoses failed trajectories under strict information isolation, and the executor edits specific skill files through a restricted tool interface. Across MobileWorld, AndroidWorld, and OSWorld, three mainstream GUI benchmarks spanning mobile and desktop platforms, EvoSkill-GUI consistently improves multiple base models without any training, with maximum gains of $+16.2\\%$, $+6.0\\%$, and $+10.5\\%$ respectively, and evolved skill libraries continue to benefit related tasks rather than being rebuilt from scratch. Our code is available at https://github.com/ZJU-REAL/EvoSkill-GUI.", "category": "cs.AI", "cluster": "Agent Skills \u0026 Knowledge Reuse", "tags": ["cs.AI"], "filter_reason": "这篇论文完全符合你的研究范围。其核心贡献是提出了 EvoSkill-GUI，一个针对 GUI 智能体的免训练技能演化框架。论文明确针对智能体在动态环境中的长程任务执行问题，提出了“反思-修订-重用”的自我演化机制，使智能体能够根据执行反馈动态修正和积累技能。这直接命中了你关注的“单智能体：自我反思、记忆、技能获取”以及“自我演化：通过经验、反思或环境反馈进行自我完善和迭代”两个核心方向。虽然 GUI 涉及视觉元素，但论文的研究本质是智能体的运行时机制和技能库的持续自适应优化，而非单纯的多模态视觉理解，因此应予保留。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决的核心问题是：GUI agent 在动态界面（弹窗、延迟加载、控件移位）上执行长程任务时，预先固定的技能方案经常失效，而现有技能框架将技能视为部署前生成的静态产物，无法从执行反馈中自我修正。这个问题之所以重要，是因为真实 GUI 环境本质上是非平稳的——同一技能在某次界面状态下有效，下次可能因一个弹窗或控件偏移而彻底失败，幂等失败循环在实际部署中占大量超时。论文提出 EvoSkill-GUI，一个无需训练的框架，让技能在部署时根据执行反馈即时修订并积累复用，从而将技能从静态文档转变为可演化的过程知识。\n\n### § 2 前人工作与不足\n\n已有技能框架可分为两类。第一类是结构化技能库，如 CUASkill、WebXSkill 和 MMSkills，它们将过程知识外部化为带工作流和参数化执行的结构化产物，但技能在检索后保持静态，不支持推理时修订；并发的 CoEvoSkills 虽协同演化多文件技能包，却面向代码中心环境，未处理 GUI 执行中界面状态频繁偏离预期的问题。第二类是自演化 agent，如 Mobile-Agent-E、SEAgent 和 UI-Mem，它们通过持久记忆或反思模块从经验中改进，但更新的是记忆、策略或模型权重，而非部署的技能产物本身。这些方法之所以未解决推理时技能修订，根本原因在于它们将技能视为一次性生成的完整文档，规划步骤、定位提示与恢复规则纠缠在一起，无法针对具体失败类型（定位错误、缺失恢复分支、计划缺陷）做局部编辑，且依赖外部反思模型引入额外延迟与弱耦合，使系统无法真正自演化。", "core_insight": "### § 3 重建作者的思考路径\n\n以下是对作者思考路径的解释性重建。GUI 环境非平稳，弹窗与控件移位使预固定计划频繁失效，而现有技能框架将技能视为部署前的静态产物。作者识别出四类叠加障碍：技能非结构化难编辑、界面非平稳、外部反思松耦合且昂贵、过程知识不积累。关键线索是失败本身携带可操作信息——grounding 错误暴露不可靠定位，意外弹窗暴露缺失恢复分支。由此自然提出：能否让部署中的 agent 立即反思失败，把修正写回技能本身。\n\n### § 4 核心直觉\n\n将技能从单一长文档拆成结构化多文件包，使每类失败精准对应到可编辑组件。同一骨干模型在信息隔离下执行\"反思—修订—复用\"循环：执行中即时修局部不匹配，失败后隔离诊断轨迹级错误，再经受限工具接口编辑特定技能文件。核心是让技能在推理时从执行反馈进化，无需训练或外部监督。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n        指令 I\n          │\n          ▼\n    元数据检索\n   命中│      │未命中\n       ▼      ▼\n  复用技能包 新建技能包S\n       │      │\n       └──┬───┘\n          ▼\n ┌─ 执行Rollout(≤50步)─────────┐\n │ 即时修订(工具接口编辑文件)    │\n │ 成功?─是─▶注册到技能库       │──▶ 任务完成\n │   │否                       │\n │   ▼                         │\n │ 隔离Critic诊断(信息隔离)     │\n │   ▼                         │\n │ 修订技能包+追加失败案例      │\n │   │                         │\n │   └─▶下一轮(≤3轮)───────────┘\n```\n\n技能包的结构化表示是核心设计。每个技能包 $S=(D, A, P, B, C, F)$ 包含六个组件：检索元数据 $D$、无障碍工具 $A$、可执行计划 $P$、备用定位策略 $B$、失败恢复规则 $C$、失败案例集 $F$。这种分解对应 GUI agent 的三类常见错误源——计划错误对应 $P$、定位错误对应 $B$、缺失的异常处理对应 $C$——使每次修订能精准定位到出错的组件，而非重写整个技能（§3.2）。\n\n检索阶段基于元数据评分而非全文匹配。对新指令，系统对技能库中每个候选技能计算词法覆盖、语义紧密度和任务约束的组合分数，超过阈值 $\\theta_r$ 则复用已验证技能，否则从零新建（§3.4）。元数据索引避免了长文本表面词汇重叠导致的误匹配。\n\n执行阶段包含即时修订和事后反思两个层次。Rollout 中，执行器通过受限工具接口（仅允许读写技能包内预定义文件）即时编辑计划或恢复规则，处理弹窗、控件位移等局部偏差，防止小错累积为整任务失败（§3.3）。若整个 rollout 失败，同一 backbone 模型在独立会话中担任隔离 critic，仅依据指令和执行轨迹诊断失败原因，不接触技能包内容或执行器的推理过程。这种信息隔离迫使 critic 基于可观测证据诊断，而非继承执行器的错误假设。最后，执行器根据 critic 反馈修订技能文件并追加失败案例到 $F$，进入下一轮迭代，最多三轮（§3.3, Algorithm 1）。\n\n### § 7 实验设计与结论\n\n**结构化技能包与各组件是否真正有效？** 研究者在 MobileWorld 上设计了系统消融，分别移除即时修订、信息隔离、计划文档、失败案例等组件，并对比单文件技能与多文件技能包。结构化包比单文件高 2.85 个百分点；移除即时修订下降 6.66，移除信息隔离下降 8.57，每个组件均有独立贡献，验证了分解设计与隔离反思的必要性（§4.3）。\n\n**该方法能否跨平台跨模型一致提升？** 研究者在 MobileWorld、AndroidWorld 和 OSWorld 三个基准上测试了从通用大模型到 GUI 专用小模型的多种 backbone。无需任何训练，EvoSkill-GUI 在三个基准上分别最高提升 16.2、6.0 和 10.5 个百分点，且提升在不同模型家族和规模上一致，表明结构化技能包的收益不依赖特定 backbone（§4.2）。\n\n**进化后的技能库能否复用于相关任务？** 研究者构建了 AndroidWorld 的 116+116 任务流：第一阶段构建技能库，第二阶段在相关任务变体上复用。第二阶段全部任务复用了已进化技能，成功率从 55.2% 升至 61.2%；在 89 个初始失败的任务中恢复了 27 个，表明技能库积累了可迁移的过程性知识而非一次性解决方案（§4.4, Table 7）。", "additional_insights": "### § 8 阅读收获\n\nEvoSkill-GUI 的核心主张是：GUI agent 需要的不是更好的静态技能，而是能从执行反馈中修订的技能。它将每个技能表示为结构化多文件包，分别存放计划、备份定位、恢复规则和失败案例，使每次失败后只需修订相关组件而非重写整体。同一骨干模型在信息隔离下同时担任执行者和诊断者，无需外部更强模型即可完成自我进化。元数据检索比全文匹配更精确，进化后的技能库可跨相关任务复用而非从零重建。\n\n### § 9 最脆弱的假设\n\n最关键的假设是：同一骨干模型在信息隔离下能可靠诊断自身失败轨迹。如果诊断错误，技能修订会写入错误修正，甚至将已验证的技能包引入回归。论文手动审核了 143 个 critic 判断，准确率为 80.4%，但仍有 19.6% 错误，且至少 4 例将失败任务误判为成功并提前终止进化。这意味着约五分之一的修订可能基于错误诊断，在长任务流中错误知识会持续累积。论文缺少对错误修订传播影响的量化分析，也未设计正式验证器来否决有害编辑。\n\n### § 10 最小复现实验\n\n用 AndroidWorld 的 116 个任务和开源的 Qwen3-VL-8B-Instruct，在一周内只复现核心循环：结构化技能包加 reflect-revise 两轮修订，不实现完整检索库。测量三组对比：无技能基线、静态技能包、可修订技能包的成功率，同时手动抽查 30 个 critic 诊断的准确率。若可修订组成功率高于静态组且 critic 准确率超过 75%，则支持自我进化有效的核心主张；若成功率无提升或 critic 准确率低于 60%，则表明同骨干诊断不可靠，核心机制存疑。", "research_value": "### § 11 最强反例设计\n针对同一骨干模型自我诊断不可靠的弱点，我会设计长程任务流实验检验错误修订的累积污染效应。在 AndroidWorld 上构建包含大量相似但细微差异的任务序列，故意混入易导致误判的动态弹窗与延迟加载场景。如果随着复用轮次增加，被错误修订污染的技能包导致后续相关任务成功率显著低于静态技能基线，就能证明该框架在长程演化中存在知识退化风险，直接挑战其“可演化”的核心主张。\n\n### § 12 后续研究设想\n围绕隔离 critic 诊断准确率不足的局限，后续研究可检验引入轻量级交叉验证能否阻断错误修订传播。具体做法是在执行器写入修订前增加验证步骤，例如在沙盒中快速重放失败轨迹关键节点，或引入不同家族的小模型对诊断结论二次确认。这值得测试是因为约五分之一的错误诊断在长期复用中必然导致技能库退化，而原框架缺少否决有害编辑的机制。首个对照实验可在 AndroidWorld 任务流中对比原始框架与增加验证的版本，测量复用成功率及错误修订保留率。若验证机制显著降低错误修订保留率并提升复用成功率，则说明外部验证是维持技能库质量的必要条件。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Bofan Chen\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Boxuan Zhang\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Fei Tang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhengxi Lu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yong Du\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Tongbo Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Weiming Lu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jun Xiao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yueting Zhuang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yongliang Shen\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Zhejiang University\"},\n    {\"id\": 2, \"name\": \"UESTC\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "GUI智能体在动态图形用户界面上执行长程任务，其中弹窗、延迟加载和位置变动的组件常常会导致执行前固定的计划失效。近期的智能体技能框架通过封装可复用的过程性知识来缓解这一问题，然而现有的技能设计在很大程度上并未针对GUI的执行动态特性进行开发，而是将技能视为部署前生成的静态产物，而非在部署过程中不断改进的活态过程性知识（living procedural knowledge）。我们认为，GUI智能体所需的并非更好的静态技能，而是能够在部署时根据执行反馈进行修订且无需额外训练的技能。我们提出了 **EvoSkill-GUI**，这是一个免训练框架，其中每个技能都是一个结构化的多文件包，包含检索元数据、可执行计划、备用定位、故障恢复规则、无障碍实用工具以及失败案例。EvoSkill-GUI 通过 **reflect-revise-reuse** 循环运行：执行器进行执行过程中的即时修订（in-rollout revisions），独立的评估器（isolated critic）在严格的信息隔离下诊断失败的轨迹，随后执行器通过受限的工具接口编辑特定的技能文件。在涵盖移动和桌面平台的三个主流GUI评测基准 MobileWorld、AndroidWorld 和 OSWorld 上，EvoSkill-GUI 在无需任何训练的情况下持续提升了多个基础模型的性能，最大提升分别为 $+16.2\\%$、$+6.0\\%$ 和 $+10.5\\%$，并且进化后的技能库能继续使相关任务受益，而无需从头重建。我们的代码可在 https://github.com/ZJU-REAL/EvoSkill-GUI 获取。"}]}, {"name": "Coding Agents \u0026 Autonomous Execution", "count": 2, "papers": [{"title": "Compiled Agency: Frontier General-Purpose Coding Agents Build Winning Game Players from Bare Interaction - from Flappy Bird to StarCraft II and Civilization", "arxiv_id": "2609.18996", "authors": "Joey Xiao, Haonan Huang", "summary": "LLM agents have repeatedly struggled to convert knowledge of a game into competent play, even when researchers build the agent around the model - supplying perception, memory, skill libraries, planners, or executable-policy scaffolds. Rapid progress in coding agents raises two sharper questions: can frontier models now win games at all, and can they win them unaided, building the entire player themselves? We introduce Gauntlet, a develop-freeze-evaluate framework that ports games from small arcades to full commercial-scale titles, behind one deliberately bare contract: a general-purpose coding agent receives a game description, a raw observation/action interface, and an empty policy file - no strategy, no algorithm, no architecture. In a single autonomous session the agent experiments with the live game and engineers a standalone controller; we freeze the result and score it on held-out instances with zero model calls during play. On an unpublished procedural roguelike, held-out success spans 0-86 percent and exposes a sharp generational threshold: every observed session of a newest-generation system outperforms the best session of its predecessor. At full-game scale, a compiled raw-API controller defeats every fair StarCraft II built-in AI and two cheating variants, and single-session programs win complete games of Civilization (Freeciv) by total conquest on held-out seeds. Though at modest rates against novice AI, this is a first: no prior language-agent system had won full games of this genre standalone, without per-turn model calls and a hand-crafted tactical layer. Frontier coding agents begin to track long-horizon strategy. The frozen programs are inspectable. We call this capability compiled agency: development experience compiled into a persistent executable agent whose architecture is built by the model.", "category": "cs.CL", "cluster": "Coding Agents \u0026 Autonomous Execution", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=49 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了“Compiled Agency”这一新的智能体机制，即通用编码智能体在没有预设架构、策略或算法的情况下，通过与环境的自主交互和实验，从零开始编写并演化出独立的控制程序。这直接对应了筛选标准中关于“保留”的规定：研究 agent 的 harness/scaffold/runtime，并且核心贡献是让这些智能体运行组件通过轨迹、反馈、观测或评估结果自动改进、演化或自适应优化。论文中的智能体在单次自主会话中通过环境反馈进行迭代改进，体现了“自我演化”和“长程决策”能力。虽然论文的评估场景是游戏，但其本质是探讨智能体如何自动构建和优化其执行架构，属于机制创新而非单纯的领域应用，因此完全符合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的核心问题是：前沿通用编码智能体能否在不依赖任何人工预设架构的情况下，仅凭游戏描述和原始交互接口，自主构建完整的游戏玩家并赢得游戏？大语言模型（LLM）在游戏环境中长期存在“知行鸿沟”，即能描述策略却无法转化为持续胜任的操作。以往研究通过人工构建记忆、规划器等脚手架来弥补模型能力不足，但这掩盖了模型自身的真实边界。验证模型能否自主完成从感知到策略的完整架构构建，不仅能准确衡量前沿模型的最新能力，还能推动评测范式从“评估模型如何操作智能体”转向“评估模型如何工程化构建智能体”。\n\n### § 2 前人工作与不足\n在直接在线游戏智能体方面，如CivRealm等基准让模型在动作循环中逐步决策。这类方法受限于在线推理延迟和长程规划能力，在《文明》等需要数百回合连贯规划的游戏中表现脆弱，甚至无法生存完整对局。在脚手架辅助智能体方面，如TextStarCraft II和《文明V》混合架构，研究者预设了宏动作层、技能库或战术AI。这些系统虽然能取得一定成绩（如《星际争霸2》Elite级别25%胜率），但依赖每回合调用模型且战术执行外包给游戏内置AI。这种人工设计的架构不仅工程成本高，更关键的是未能检验模型能否自主重构决策所需的完整控制栈，导致以往负面结果被误读为模型的能力上限。", "core_insight": "### § 3 重建作者的思考路径\n一种可能的解释是，作者观察到语言模型在长周期游戏中直接操作时面临探索与控制瓶颈，即使提供大量人工脚手架也收效甚微。同时，通用编码代理在自动软件工程上进展迅速。既然模型写代码的能力在变强，与其让它在游戏里低效操作，不如让它直接写出一个完整的控制程序，从而绕过在线推理延迟并检验其真实理解能力。\n\n### § 4 核心直觉\n让前沿编码代理仅凭游戏描述和原始接口，在一个自主会话中自己编写出完整的独立控制程序，运行时无需任何模型调用。该方法将“玩游戏”转化为“写代码”，利用代码的持久性，彻底绕过了语言模型在线操作时的长周期记忆与实时控制瓶颈。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[输入: 游戏描述, 原始接口, 空策略文件]\n          |\n          v\n+---------------------------+\n| 通用编码代理 (自主开发会话)  |\n|  - 运行环境 / 形成假设      |\n|  - 编写代码 / 修订控制器     |\n+---------------------------+\n          | (循环实验与修订)\n          v\n[中间产物: 实验轨迹, 支持代码, 控制器版本]\n          | (代理自行决定停止)\n          v\n[冻结: 独立可执行策略]\n          |\n          v\n+---------------------------+\n| 冻结评估 (零模型调用)       |\n|  - 在不可访问的留存实例上测试 |\n+---------------------------+\n          |\n          v\n[输出: 留存能力分布与系统可靠性]\n```\n\n- **输入与初始化**：代理接收游戏描述、原始观测/动作接口和一个空的策略文件。整个过程不提供任何策略、算法或架构提示，仅提供基础软件工具和可执行环境（§2.2）。\n- **自主开发会话**：在单一的新鲜会话中，代理与实时游戏交互，进行实验、编写支持代码并不断修订控制器，直到它自行决定停止。这一阶段产出的中间产物包括实验轨迹和不断迭代的控制器版本（§2.3）。\n- **冻结与评估**：开发结束后冻结最终代码库，移除模型，在不可访问的留存实例上评估该独立程序。评估期间不进行任何模型调用，以测试策略的真实泛化能力（§2.1, §2.3）。\n- **可靠性测量**：通过多次独立的新鲜会话产生策略分布，以此衡量系统的可靠性。单一冠军策略仅作为存在证明，而留存能力的分布才是系统级测量的正确对象（§2.1）。\n\n### § 7 实验设计与结论\n\n这篇论文通过三个核心实验验证了前沿编码代理在无脚手架环境下构建游戏玩家的能力。\n\n首先，针对“前沿模型能否在无辅助下赢得游戏并自行构建玩家”的问题，研究在一个未公开的私有肉鸽游戏上测试了不同代际的编码代理。结果显示存在明显的代际阈值：最新一代系统（如 Fable 5 和 GPT-5.6-sol）的每一次会话表现都优于上一代最佳会话，留存通关率从 0% 跨越到 86%，证明它们能独立构建多视野闭环控制器。\n\n其次，为了验证该合约能否扩展到商业级游戏，研究在《星际争霸2》和《文明》上进行了测试。在《星际争霸2》中，冻结的控制器击败了所有公平的内置 AI 和两个作弊变体；在《文明》中，单会话程序首次在无每回合模型调用的情况下，通过全面征服赢得了完整游戏。这表明代理能够构建包含经济、军事和终结逻辑的完整控制架构。\n\n最后，关于代理编译了什么以及可靠性如何，研究通过审计冻结代码和重放中间版本发现，成功策略包含实时模拟、持久状态和校准的战术原则，而非死记硬背种子。然而，新鲜会话的方差极大，因此产出的程序分布才是衡量系统能力的正确对象，而非单一冠军程序。", "additional_insights": "### § 8 阅读收获\n前沿通用编程代理能在单次自主会话中，仅凭游戏描述和原始接口，从零编写出能赢复杂游戏的完整控制器，无需人工提供策略或架构脚手架。这种“编译代理”能力在最新一代模型上出现代际跃升，它们能自主构建多步预测的闭环控制，而非简单的反应式规则。冻结后的程序运行时无需模型调用，能通过实时观察泛化到未见场景，而非死记硬背训练种子。\n\n### § 9 最脆弱的假设\n最关键的假设是：代理编写的程序通过实时动态计算实现泛化，而非依赖预训练知识提取。对于《星际争霸2》等公开游戏，模型可能在预训练阶段已熟知其核心策略，导致“自主发现”的架构实为对已有知识的复现。论文虽通过代码审查证明程序无硬编码种子，并在私有游戏上观察到自主探索未公开机制的行为，但无法完全排除公开游戏中的预训练污染。\n\n### § 10 最小复现实验\n用一周时间可验证其泛化机制：编写一个规则未公开的极简网格躲避游戏，提供原始接口和空策略文件给前沿编程代理自主开发。冻结生成的策略，在 50 个未见过的随机种子上测试存活率，并审查代码是否包含基于物理规则的动态计算。若策略在未见种子上保持高存活率且代码无硬编码坐标，则支持其泛化能力的 claim；若存活率骤降或充斥硬编码条件，则表明其泛化能力被高估。", "research_value": "### § 11 最强反例设计\n最强反例应直接攻击“自主发现架构而非复现预训练知识”这一核心声明。我会设计一个物理规则与常识完全相反的全新网格生存游戏，例如距离越近受到的伤害越低、资源随移动而非时间积累。将这个完全未公开且无现实对应物的游戏接口提供给前沿编码代理，观察其冻结策略在留存实例上的表现。如果通关率相比论文中的私有肉鸽游戏出现断崖式下跌，且代码审查显示其反复套用常规游戏逻辑而无法适应反直觉规则，这就证明其能力高度依赖预训练记忆，而非真正的自主工程化构建。\n\n### § 12 后续研究设想\n针对论文中“新鲜会话方差极大”的局限，后续研究可探索如何提升代理构建策略的可靠性。在自主开发会话中引入强制测试驱动机制，要求代理每次修订控制器后必须生成并运行基础逻辑验证，例如检查资源是否非负或单位是否避免无意义牺牲。首个对照实验可在同一游戏上，对比有无强制测试环节的多会话策略分布下限。如果引入该机制后最差会话的策略表现显著提升且方差缩小，则说明结构化验证能有效约束随机试错；若无变化，则表明方差源于模型更深层的推理波动。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Joey Xiao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Haonan Huang\", \"affiliations\": [2], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"New York University\"},\n    {\"id\": 2, \"name\": \"Princeton University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author: hnhuang@princeton.edu\"}\n  ]\n}\n```", "summary_translation": "大语言模型智能体（LLM agents）屡屡难以将游戏知识转化为胜任的游戏操作，即使研究人员围绕模型构建智能体——提供感知、记忆、技能库、规划器或可执行策略的脚手架。编码智能体的快速进展引出了两个更尖锐的问题：前沿模型现在究竟能否赢得游戏，以及它们能否在无辅助的情况下获胜，自行构建完整的玩家程序？我们引入了 Gauntlet，这是一个“开发-冻结-评估”框架，将游戏从小型街机移植到完整的商业规模作品，其背后是一个刻意保持极简的契约：通用编码智能体接收游戏描述、原始观测/动作接口以及一个空的策略文件——没有策略，没有算法，没有架构。在单次自主会话中，智能体在实时游戏中进行实验并构建一个独立的控制器；我们冻结该结果，并在留出实例（held-out instances）上对其进行评分，且在游戏过程中不进行任何模型调用。在一款未发表的程序化生成的肉鸽类游戏（procedural roguelike）上，留出实例的成功率跨度为0%至86%，并暴露出明显的代际阈值：最新一代系统的每一次观测会话都优于其前代系统的最佳会话。在完整游戏规模上，一个编译后的原始API控制器击败了所有公平的 StarCraft II 内置AI以及两个作弊变体，并且单次会话程序在留出随机种子上通过全面征服赢得了完整的 Freeciv 游戏。尽管在面对新手AI时成功率适中，但这仍是一个首创：此前没有任何语言智能体系统能够独立赢得该类型的完整游戏，而无需逐回合的模型调用和手工制作的战术层。前沿编码智能体开始能够追踪长周期策略。冻结的程序是可检查的。我们将这种能力称为编译智能体（compiled agency）：将开发经验编译成一个持久可执行的智能体，其架构由模型构建。"}, {"title": "WetRobo: A Reproducible Robot Kit for Coding Agents in Biological Laboratories", "arxiv_id": "2609.18435", "authors": "Yuna Oikawa, Kei Endo, Takanori Uzawa, Yunzhe Zhang, Manan Anjaria, Lerrel Pinto, Sherry Yang, Koji Tsuda", "summary": "Automating biological research requires general-purpose, reproducible robot systems that allow individual wet-lab researchers to delegate robot tasks without performing teleoperation or neural-network training. Vision-language-action policies have been proposed for general-purpose arms, but can lose performance when their operating environment changes. We therefore built WetRobo, a robot kit that can readily transfer between laboratories. It consists of one robot arm, laboratory equipment (an incubator, a reagent bottle with a cap, and a Petri dish), the existing code that moves the arm, teleoperation demonstrations of each task that we recorded, and a general AGENTS.md skill file. A biological experimentalist provides natural-language tasks without collecting local teleoperation training data or training a neural network. The coding agent observes the local laboratory and writes and executes programs, using external tools as needed for adaptation. We demonstrate use of WetRobo with OpenAI Codex (gpt-5.6-sol) on three successful tasks: lifting a Petri dish lid, removing a bottle cap, and opening the incubator door, all in real-world laboratories. The coding agent achieved the cap task in both laboratories, Lab X and Lab Y, whereas a VLA fine-tuned on Lab X demonstrations succeeded there but failed to transfer to Lab Y. These results point to a practical route for laboratory robotics: instead of training a policy for each laboratory, distribute a kit and let a coding agent adapt it in each laboratory. Code, demonstrations, and the evolved programs are available at https://github.com/tsudalab/WetRobo.", "category": "cs.AI", "cluster": "Coding Agents \u0026 Autonomous Execution", "tags": ["cs.AI"], "filter_reason": "这篇论文虽然应用场景设定在生物实验室，但其核心贡献在于提出了一种基于 Coding Agent 的机器人环境自适应机制，而非单纯的领域应用。论文明确指出，传统的视觉-语言-动作（VLA）模型在环境变化时性能下降，而作者构建的 WetRobo 系统让 Coding Agent 观察本地实验室环境，通过编写和执行程序、使用外部工具来实现跨实验室的适应。摘要中明确提到了“let a coding agent adapt it in each laboratory”以及“evolved programs”，这直接对应了筛选标准中“embodied agent 的 continual adaptation”和“coding-agent harness/scaffold/runtime 的自动演化”的保留条件。根据第一步排除规则中的例外说明（“如果论文在特定领域中提出了新的 agent 机制（如 embodied self-improving harness、game-playing agent 的 continual adaptation），则不应排除——领域是场景，机制才是贡献”），该论文的机制贡献符合研究焦点，因此应予保留。", "intro_logic": "### § 1 研究问题与重要性\n论文旨在解决个体生物实验室的机器人自动化部署与跨环境迁移问题。生物湿实验依赖大量重复手动劳动，而现有通用机器人在更换实验室后往往性能骤降。研究者希望让实验人员仅通过自然语言下达任务，无需收集遥操作数据或训练神经网络，机器人即可自主适应本地环境并执行操作。这能大幅降低个体实验室引入自动化的门槛，将研究人员从细胞培养等重复劳动中解放出来。\n\n### § 2 前人工作与不足\n针对实验室机器人操作，前人主要采用视觉-语言-动作模型（VLA）和代码即策略两种路线。基于 VLA 的方法（如 π0.5）对相机视角和物体位置高度敏感，因为其策略依赖特定实验室的演示数据微调，学到的特征难以泛化，导致在 Lab X 训练的模型在 Lab Y 直接失效。另一方面，代码即策略框架（如 ENPIRE）通过大语言模型生成可执行代码控制机器人，具备更强的逻辑可编辑性。但该框架未应用于生物实验室，且依赖人工引导设置重置与验证接口，缺乏针对培养箱等设备的操作约束与安全规则，无法直接应对湿实验的现场适应需求。", "core_insight": "### § 3 重建作者的思考路径\n\nVLA策略在跨实验室迁移时性能骤降——相机视角、夹爪型号、光照条件的微小变化都可能导致失败，这已被多项鲁棒性研究证实。与此同时，code-as-policy范式已证明语言模型能生成可执行代码控制机器人，且代码逻辑可检查、可编辑。作者可能由此推断：如果不在训练时固化环境假设，而是让coding agent在部署现场观察环境并编写适应代码，就能绕开VLA的迁移瓶颈。剩下的问题是agent如何快速理解任务和硬件——作者的方案是打包一套标准kit，包含机械臂、设备规格、基础代码、演示视频和技能文件AGENTS.md，让agent在此基础上现场适应。\n\n### § 4 核心直觉\n\n与其为每个实验室训练一个VLA策略，不如分发一套标准化机器人kit，让coding agent在每个实验室现场观察环境、调用外部工具、编写并执行适应代码。VLA失败的原因是策略被冻结在训练时的环境假设里；而coding agent每次都能根据当前相机、夹爪和物体位置重新测量和调整，把适应从训练时推迟到部署时，从而实现跨实验室迁移。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\nWetRobo 套件\n AGENTS.md · base stack · 15 demos · Piper arm\n        │  实验员下达自然语言任务\n        ▼\n┌─────────────────────┐\n│ 编码代理 观察本地环境 │← RGB-D 相机 / 关节状态\n│ (OpenAI Codex)      │\n└────────┬────────────┘\n         │ 生成分析程序 + 运动程序\n         ▼\n┌─────────────────────┐\n│ 按需调用外部工具      │\n│ SAM3·OpenCV·MuJoCo   │\n│ NumPy·光流·AprilTag  │\n└────────┬────────────┘\n         │ 执行参数\n         ▼\n┌─────────────────────┐\n│ RPC 控制 Piper 臂    │\n│ SafetyLayer 限位     │\n└────────┬────────────┘\n         │ 图像/开合/力矩反馈\n         ▼\n   验证成功？──否→ 代理修订程序（回路）\n        │ 是\n        ▼\n  演化程序 + 动作记录\n```\n\nWetRobo 的流程从套件分发开始。实验员组装硬件并下达自然语言任务，编码代理（OpenAI Codex, gpt-5.6-sol）接管全部适配工作，无需实验员采集遥操作数据或训练神经网络（§I）。\n\n代理通过头部和腕部相机获取 RGB-D 观测，读取关节角度与夹爪状态（§III）。基于 AGENTS.md 的操作规则，代理生成两类程序：分析程序负责定位目标（如用 OpenCV 颜色阈值检测瓶盖）、估计位姿（如用 NumPy RANSAC 拟合培养箱门平面）、校准手眼关系（如用 Lucas–Kanade 光流求解图像雅可比）；运动程序将目标位移转换为关节指令。代理按需引入 SAM 3 分割、MuJoCo 碰撞检查、AprilTag 位姿估计等外部工具（§III-A 至 §III-C）。\n\n运动指令经 RPC 发送至 Piper 机械臂，SafetyLayer 执行禁区检查与单步位移上限（§II-D）。代理从图像、夹爪开合度和关节力矩读取反馈判断成败；若失败则修订程序并重试，形成\"观察—编程—执行—验证\"闭环。成功后留下演化程序与动作记录，存为 git 分支。\n\n### § 7 实验设计与结论\n\n**问题一：编码代理能否完成湿实验室基本操作？** 研究者在两个实验室测试了培养皿盖提取、瓶盖旋取和培养箱门开启三项任务。结果：三项任务均在真实设备上成功，且前序任务的代码模块可被后续任务复用——例如培养皿任务的薄物抓取代码被瓶盖任务直接调用（§IV）。\n\n**问题二：编码代理的跨实验室迁移是否优于 VLA？** 在 Lab X 和 Lab Y 对瓶盖任务进行对照：VLA 模型 π0.5 在 Lab X 的 25 段演示上微调 10 万步后，Lab X 成功率 10/10，迁移至 Lab Y 降为 0/10；编码代理在两实验室均成功（§III-B, Fig. 5）。现场代码适配比策略迁移更鲁棒，因为代理能在本地重新校准手眼关系并选择适配的反馈通道。\n\n**问题三：不同条件下程序如何差异化演化？** Lab Y 用关节力矩反馈停止运动，Lab X 因夹爪无力矩反馈而改用 MuJoCo 碰撞检查；Lab Y 用 Record3D 深度定位瓶盖，Lab X 用预置 AprilTag 重建场景（Table II）。两套演化程序策略不同但均完成任务，验证了\"同一套件、本地适配\"的设计理念。", "additional_insights": "### § 8 阅读收获\n\nWetRobo 证明编码代理可替代 VLA 控制实验室机器人，且跨实验室迁移性更强。瓶盖任务中，在 Lab X 微调的 VLA 迁移到 Lab Y 失败，编码代理却在两个实验室都成功。代理自主调用 OpenCV、SAM、MuJoCo 等外部工具完成环境适应，演化程序可复用于后续任务。这提出一条实用路线：分发标准化套件让代理现场适应，而非为每个实验室训练策略。\n\n### § 9 最脆弱的假设\n\n最脆弱的假设是编码代理能在无人干预下自主完成物理任务的现场适应。论文将 approval policy 设为 never，代理完全自主决策。但物理世界的不可预测性——夹爪滑动、阴影干扰、接触不确定——可能使代理无法诊断失败而陷入无效循环。论文只报告单个适应试验的成功，没有重复独立适应的数据，无法排除偶然性。三个任务均为基本操作，长流程任务的累积误差可能使代理无法收敛。\n\n### § 10 最小复现实验\n\n用一周验证编码代理的跨设置适应能力。使用 WetRobo 代码库和 Piper 臂，在设置 A 完成瓶盖任务后，改变光照、相机位置和物体放置形成设置 B，让代理从原始套件重新适应。测量是否成功、适应时间和 token 消耗。若代理在设置 B 成功则支持跨设置适应的主张；若反复失败或成本远超首次则表明适应能力有边界。此方案不复现 VLA 对照，只检验代理端迁移性。", "research_value": "### § 11 最强反例设计\n要挑战 WetRobo 的有效性，可以设计一个包含多步骤且存在状态漂移的长流程任务，例如“从培养箱取出培养皿、移至显微镜下对焦并放回”。该任务要求机器人在多个子任务间传递物体，且中间状态难以精确重置。由于编码代理缺乏物理直觉，仅依赖视觉和力矩反馈，一旦中间步骤出现夹爪滑动等微小偏差，代理生成的代码可能无法诊断这种未预见的物理状态。这会导致后续步骤全部失败并陷入无效的代码修订循环，从而证明该方法在复杂长流程任务中无法自主适应。\n\n### § 12 后续研究设想\n针对论文仅报告单次适应成功且未排除偶然性的局限，可以提出问题：编码代理在多次独立适应同一任务时，成功率是否稳定且推理成本是否可控？需要在多个不同光照和布局的实验室中，让代理从零开始独立重复执行瓶盖旋取任务各十次，记录每次的成功率、适应时间和 token 消耗。这能检验代理的现场适应能力是稳定可复现的，还是依赖特定提示词的偶然结果。如果成功率波动极大或 token 消耗随失败次数指数增长，则说明现场适应能力存在明确边界，必须引入人工干预机制。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yuna Oikawa\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Kei Endo\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Takanori Uzawa\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yunzhe Zhang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Manan Anjaria\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Lerrel Pinto\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Sherry Yang\", \"affiliations\": [3, 4], \"markers\": []},\n    {\"name\": \"Koji Tsuda\", \"affiliations\": [1, 5, 6], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"The University of Tokyo\"},\n    {\"id\": 2, \"name\": \"RIKEN Pioneering Research Institute\"},\n    {\"id\": 3, \"name\": \"New York University\"},\n    {\"id\": 4, \"name\": \"Google DeepMind\"},\n    {\"id\": 5, \"name\": \"National Institute for Materials Science\"},\n    {\"id\": 6, \"name\": \"RIKEN Center for Advanced Intelligence Project\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "自动化生物学研究需要通用且可复现的机器人系统，使湿实验室研究人员能够委派机器人任务，而无需进行远程操作或神经网络训练。视觉-语言-动作策略（Vision-language-action policies, VLA）已被应用于通用机械臂，但当其运行环境发生变化时，性能可能会下降。因此，我们构建了WetRobo，这是一种能够在实验室之间轻松迁移的机器人套件。它包含一个机械臂、实验室设备（一个培养箱、一个带盖的试剂瓶和一个培养皿）、控制机械臂移动的现有代码、我们录制的每个任务的远程操作演示，以及一个通用的 AGENTS.md 技能文件。生物学实验员只需提供自然语言任务，无需收集本地远程操作训练数据或训练神经网络。编码智能体观察本地实验室并编写、执行程序，根据需要使用外部工具进行适配。我们在真实实验室中展示了使用 OpenAI Codex (gpt-5.6-sol) 驱动 WetRobo 成功完成的三项任务：掀开培养皿盖、拧开试剂瓶盖和打开培养箱门。编码智能体在实验室X和实验室Y均成功完成了开盖任务，而在实验室X的演示数据上微调的VLA虽然在实验室X取得成功，却未能迁移到实验室Y。这些结果为实验室机器人技术指明了一条实用途径：无需为每个实验室训练一个策略，而是分发一套件，并让编码智能体在每个实验室中进行适配。代码、演示及演化生成的程序可在 https://github.com/tsudalab/WetRobo 获取。"}]}, {"name": "LLM Architecture \u0026 Scaling", "count": 1, "papers": [{"title": "Infinite-Parameter LLMs: Generating and Adapting Weights from Live Data", "arxiv_id": "2609.18842", "authors": "Jinli Hu, Ross M. Clarke, Yichuan Zhang, José Miguel Hernández-Lobato", "summary": "The scaling laws hold that a language model grows more capable with more parameters and more training data, and Mixture-of-Experts (MoE) architectures have ridden these laws to remarkable results, activating only a fraction of an enormous stored parameter bank for each token. That success is built on static pretraining data. A deployed model faces a different world, where much of the data that would make it more useful is not in its training set but in the live interaction it is currently handling, such as the facts a user supplies or the corrections they give. A conventional model cannot learn from this data, because its weights are frozen after training. Instead, the knowledge and behaviour supplied at run time are placed in the prompt, by retrieval or instruction, and re-read on every request only to be discarded once the request ends. We ask how an architecture could learn from live interaction by writing it into its weights. Taking inspiration from MoE, we propose the \\textbf{Infinite-Parameter LLM}. A compact hypernetwork turns the data given at run time into a low-rank modulation of a shared base network, so the feed-forward weights are generated from live data rather than stored in a fixed bank. Where prior weight generators read the context once and freeze, we carry a Bayesian belief over the generator's latent code and update it online, so the effective weight is re-derived from that evolving belief as the session proceeds rather than fixed after one read. The stored footprint stays fixed, yet the weights the model can compile are effectively infinite. For the knowledge and behaviour supplied at run time, carrying them in the weights rather than the prompt is amortized in compute, frees the context window, persists across turns, and can generalise better than in-context use. We specify an evaluation protocol that tests exactly this against in-context learning and retrieval.", "category": "cs.AI", "cluster": "LLM Architecture \u0026 Scaling", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了一种名为 \"Infinite-Parameter LLM\" 的新架构，通过超网络在运行时根据实时交互数据生成并在线更新模型权重的低秩调制。论文明确指出其目标是让模型能够从实时交互（live interaction）中学习并将知识写入权重，而不是依赖会被丢弃的上下文提示。这属于典型的模型在线适应和自我演化机制。\n\n根据筛选标准第一步中的保留规则：“如果论文的核心机制是 self-evolving / self-improving / iterative improvement / LLMs improving LLMs，即使对象是 instruction following、test-time reasoning 或模型训练，也应优先保留，因为这属于‘演化机制’的相关前沿。” 该论文通过贝叶斯信念更新实现权重的在线演化，使得模型在部署后仍能持续从环境和用户反馈中自我完善，这高度契合“自我演化”的研究方向。此外，它解决的是智能体在长期交互中面临的上下文窗口限制和记忆持久性问题，从模型底层架构层面提供了一种自适应演化方案，符合研究焦点中关于智能体记忆和自我改进的核心关注点。因此，该论文应予保留。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决的核心问题是：部署后的语言模型权重已冻结，无法从实时交互数据（用户提供的知识、纠正、反馈）中学习。当前做法将这些数据放在 prompt 中反复读取后丢弃，浪费计算且受限于上下文窗口。作者提出\"无限参数 LLM\"，用紧凑超网络将实时数据编译为共享基础网络的低秩权重调制，并以贝叶斯推断在线更新潜在编码上的信念，使权重随会话持续演化。这很重要，因为静态预训练文本趋于耗尽，而交互数据快速增长；将交互写入权重可在推理时持续提升能力，同时节省计算、释放上下文窗口并跨轮次持久化。\n\n### § 2 前人工作与不足\n\n最相关的两类工作各有根本局限。MoE 架构（如 DeepSeek-V3）实现了按 token 的动态权重，但专家库训练后固定且须全部常驻内存，无法从当前交互学习新知识。一次性权重生成器（如 Text-to-LoRA、SHINE）能将上下文编译为 LoRA 适配器，但只读取一次即冻结，是轮次级且无记忆的——权重不随会话内更多证据演化，也不在轮次间传递状态。两者都缺少\"从实时数据生成权重并在线持续适应\"这一耦合，而这正是本文的贡献所在。", "core_insight": "### § 3 重建作者的思考路径\n\n以下是对作者可能思考路径的解释性重建。MoE 已证明 per-token 动态权重有效，但专家库固定存储、训练后冻结，无法从当前交互中学习。超网络能从上下文生成适配器，却只读一次即冻结，是 turn-level 且无记忆的。测试时训练虽能演化权重，但更新的是点估计，缺乏校准与原则性遗忘。任务适应的内在维度很低（Aghajanyan et al. 2021），低维编码加紧凑生成器恰好够用。将递推贝叶斯滤波搬到这个低维潜在编码上，既从实时数据写入知识，又随会话在线更新，便填补了\"生成权重\"与\"持续适应\"之间的缺口。\n\n### § 4 核心直觉\n\n把本该放在提示词里的运行时知识编译进权重——超网络将实时数据转化为共享基础网络的低秩增量，省去每个 token 反复读上下文的代价。让先前方法失效的关键是：已有权重生成器只读一次就冻结，而本文维护一个关于潜在编码的贝叶斯信念并在线更新，使权重随会话持续演化而非每轮重置。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n  实时数据(事实/指令/反馈)\n       │\n       ▼\n ┌─────────────┐\n │编码器 Eϕ     │    memory tokens + M2P\n │(SHINE管线)   │\n └──────┬──────┘\n        │ 潜在编码 z → 缓存为 code pool {m_k}\n        │\n        ▼          ┌──────────────┐\n ┌──────────┐      │ 信念 P(z)     │\n │生成器 Gϕ │◄─────│ (分类分布π_t) │\n │z→ΔW(z)   │      │ 在线贝叶斯更新│\n └────┬─────┘      └──────┬───────┘\n      │低秩LoRA增量        │ per-token信号\n      ▼                    │\n ┌──────────┐              │\n │冻结基础   │◄─────────────┘\n │FFN(W₀)   │  W_eff = W₀ + ΔW(z)\n └────┬─────┘\n      │\n      ▼\n   输出 y\n```\n\n方法的推理流程分为四步，全部在 FFN 侧完成，注意力层始终不变（§3.1）：\n\n1. **编码**：运行时数据（事实、指令或示例）经 Data-to-Weight 编码器 $E_\\phi$ 读取。具体实现采用 SHINE 管线——将可学习的 memory tokens 附加到输入序列，通过冻结的基础模型前向传播，收集各层隐藏状态，再经 Memory-to-Parameter (M2P) 网络映射为平坦的潜在编码 $z$。每个知识集编码一次并缓存，形成 code pool $\\{m_k\\}$（§3.5.2）。\n\n2. **生成**：生成器 $G_\\phi$ 将选中的编码 $z$ 映射为低秩权重增量 $\\Delta W(z) = B(z)A(z)^\\top$，以 LoRA 形式调制基础 FFN 的三个投影矩阵（$W_\\text{gate}, W_\\text{up}, W_\\text{down}$），rank $r=8$，潜在维度 $d_z=128$。增量以分解形式计算 $B(A^\\top x)$，不实例化完整矩阵，每 token 成本为 $O(r(d+h))$，相对于基础 FFN 的 $O(hd)$ 可忽略（§3.5.2）。\n\n3. **选择与信念更新**：分类选择器在每层用输入激活 $u_\\ell$ 作为 query，与每个编码的 learned key $\\kappa_\\ell(m_k)$ 做内积并 softmax 归一化，得到分类后验 $\\pi_t$，top-1 选择一个编码驱动生成器。信念通过递归分类贝叶斯在线更新：$\\pi_t \\propto \\pi_{t-1}^\\gamma \\cdot \\text{softmax}(\\ell_t)$，其中 $\\ell_t$ 是每 token 的信念证据，$\\gamma \\in [0,1]$ 控制遗忘率（§3.5.1, §3.3）。论文实现了三种更新节奏——Design A 无显式信念（基线）、Design B 每轮更新一次、Design C 每 token 更新——本文实验在 Design C 上运行并按轮报告（§3.3, §4.4）。\n\n4. **推理输出**：有效权重 $W_\\text{eff} = W_0 + \\Delta W(z)$ 应用于当前 token 的前向传播，产生输出。所有自适应状态仅存在于 FFN 侧的低维信念中，不向注意力/序列混合路径引入任何循环状态（§3.1）。\n\n训练方面，基础模型（Qwen3-8B）和生成器（复用 SHINE 检查点）均冻结，本文唯一新增的可训练参数是选择器的 per-code key 映射和 query 对齐，规模不到基础模型的 1%（§4.1, §3.5.2）。\n\n### § 6 核心数学推导\n\n论文的核心数学关系围绕\"权重是编码的函数、编码由信念驱动\"这一链条展开。\n\n**有效权重**（§3.2）：\n\n$$W_\\text{eff} = W_0 + \\Delta W(z), \\quad \\Delta W(z) = B(z)\\,A(z)^\\top$$\n\n这是 LoRA 的标准形式：原始权重 $W_0$ 保持冻结，低秩分解 $B \\cdot A^\\top$ 提供可生成的增量。理论依据是任务适配占据的子空间具有极低内在维度（Aghajanyan et al. 2021），因此小 rank（$r=8$）即可表达任务所需的方向调整。$A, B$ 均由编码 $z$ 经线性投影产生，非线性集中在编码器（memory/M2P 栈）而非 code-to-weight 步骤——论文发现线性 code-to-weight 路径在远少于非线性版本的参数下即可持平（§3.5.2）。\n\n**递归贝叶斯滤波**（§3.3）：\n\n$$P_t(z) \\propto P_{t-1}(z) \\cdot p(\\text{obs}_t \\mid z)$$\n\n这是标准贝叶斯递归：将上一时刻的后验作为当前先验，乘以新观测的似然。观测可以是模型自身的对数似然 $\\mathcal{L}(z) = \\sum_i \\log p_\\theta(x_i \\mid x_{\u003Ci}; z)$（自监督机制，始终可用），也可以是显式反馈似然（如标量奖励下的 Boltzmann 分布或成对偏好下的 Bradley-Terry 模型）。直觉上，随着交互进行，证据不断累积，信念逐渐集中到最能解释当前数据的编码上。精确计算此递归需要对编码做反向传播，部署时不可行，因此论文训练一个前向映射 $F_\\phi$ 来摊还近似——这是深度状态空间滤波器/识别网络的实例（§3.3）。\n\n**分类信念特化**（§3.5.1）：\n\n$$\\pi_t \\propto \\pi_{t-1}^\\gamma \\cdot \\text{softmax}(\\ell_t)$$\n\n这是精确递归滤波在分类潜变量上的特化形式。$\\gamma \u003C 1$ 使旧信念按幂次衰减，允许分布重新打开以适应话题转移——这是论文\"有原则的遗忘\"机制。当 $\\gamma=1$ 时退化为标准贝叶斯累积；当 $\\gamma=0$ 时每步完全重置，退化为无记忆的单问题路由。\n\n**选择器打分**（§3.5.1）：\n\n$$\\pi \\propto \\exp\\langle u_\\ell,\\, \\kappa_\\ell(m_k)\\rangle$$\n\n其中 $u_\\ell$ 是层 $\\ell$ 的输入激活作为 query，$\\kappa_\\ell(m_k)$ 是每个编码的 learned key。这是注意力机制的简化形式，用模型自身已稳定的层表示来路由。实验发现路由信号主要来自网络后期层的激活，且取单个后期层摘要优于池化所有 memory tokens——因为 query 是模型对问题\"已沉淀的表示\"，文本检索器无法访问这一信息（§4.3）。\n\n### § 7 实验设计与结论\n\n**问题一：运行时数据编译进权重后能否被使用，与放在提示词中相比如何？**（§4.2）\n\n实验在五个 QA 数据集上比较三种条件：closed-book（无证据）、in-context（证据放提示词）、data-to-weights（证据编译进权重），覆盖从短文本（SQuAD）到长文本多跳（MS MARCO、HotpotQA、2WikiMultihopQA、MuSiQue）的证据难度轴。此外设计了稀释实验：固定答案段落，逐步增加干扰段落数量，在两种编码器上下文预算（1300 和 3000 token）下观察性能变化。\n\n答案呈现明显的交叉效应：短而干净的证据（SQuAD）提示词更优（85.3 vs 51.8 F1），因为小证据一次性读取时没有比直接读更好的方式；长而嘈杂的证据（MS MARCO）权重更优（48.0 vs 33.6 F1），因为提示词要为长度和噪声付出代价而编译后的编码不需要。稀释实验揭示了单一编码的三个退化因素——编码饱和（固定大小编码随证据增多丢失保真度）、截断（答案段落被挤出窗口）和掩埋（答案段落虽在窗口内但被干扰段落淹没）——前两者是前景化失败，后者是容量限制。这促使论文采用\"每段落单独编码 + 选择器路由\"的方案而非把所有证据塞进一次读取。\n\n**问题二：训练的信念能否在编码池上路由到正确编码？**（§4.3）\n\n实验对每个候选段落预编码一个 code，比较随机选择、BM25 词法检索、dense retrieval（bge-small）、零样本编码置信度和训练的激活路由选择器的 top-1 路由准确率。Oracle（用真实答案的编码似然打分）作为上界。\n\n答案：训练的选择器在所有数据集上超过 dense retrieval 8–12 个百分点（如 MS MARCO 53.3 vs 45.3，2Wiki 70.1 vs 58.1，MuSiQue 53.0 vs 40.9）。Oracle 接近完美（78.7–82.8）证明编码可分性强，但零样本置信度接近随机（约 22），说明路由信号真实存在但必须训练才能提取。信号主要来自网络后期层的激活，且在多跳数据集上优势反而扩大——尽管 top-1 只能命名单个编码而多跳答案跨多个段落，更可靠地识别最相关编码已足以领先。端到端 F1 验证了选择的结构优势：当知识池从 8 段增长到 64 段时，单次大读取从 48.8 衰退到 27.8 F1，而选择器路由保持平坦（47.6）。\n\n**问题三：信念能否跨轮积累，随对话增长而改善路由？**（§4.4）\n\n实验在固定编码池上运行多轮对话，每轮对话以明确命名话题的开场轮开始，后续混合自包含轮（可从自身文本定位）和上下文依赖轮（如\"谁设计的？\"\"它有多高？\"，仅凭当前轮文本无法回答）。比较四种方案：逐问题检索、逐问题选择器（无记忆）、拼接历史检索（将累积历史作为查询）和积累信念（持久后验，递归分类贝叶斯更新）。仅在上文依赖轮上报告结果。\n\n答案：积累的信念随对话轮次增加而持续提升路由准确率，且每轮成本恒定（$K$ 个内积/层，不随轮次增长）。逐问题的两个无记忆基线在轮次轴上平坦并在单独模糊的轮上崩溃；拼接历史检索先升后降——历史累积初期有帮助，但查询变长后稀释——且其每轮成本随轮次线性增长。在准确率上超越拼接历史的同时保持成本恒定，是论文关于\"信念比重读历史更好地积累会话状态\"这一主张的核心证据。", "additional_insights": "### § 8 阅读收获\n\n论文的核心思想是将运行时交互数据编译进模型权重，而非放入 prompt 反复重读。具体做法是用一个紧凑的 hypernetwork 将实时数据转化为共享基础 FFN 的低秩权重调制，替代 Mixture-of-Experts 中存储的固定专家库。区别于已有的一次性权重生成器（读取上下文后冻结 adapter），本文携带对 latent code 的 Bayesian belief 并在线递归更新，使权重随会话推进持续演化。实验表明：证据短且干净时 prompt 仍占优，但证据变长、嘈杂、多跳时编译进权重的优势显现；训练后的 selector 在代码池上的路由准确率超过 dense retrieval 8–12 个百分点；累积 belief 随对话轮次增长持续改善路由，且每轮成本恒定，而拼接历史的检索成本随轮次线性增长。\n\n### § 9 最脆弱的假设\n\n最关键的假设是：在线累积的 categorical belief 能在自然多轮对话中持续改善路由，而非仅在作者构造的对话中有效。论文只在人为设计的对话上验证了这一点——上下文依赖的轮次是刻意构造的，知识池就是对话的构建来源，且 belief 取 top-1 单选。自然对话中话题会漂移、正确代码的后验可能多模态、所需代码可能不在当前池中，这些都会使 top-1 categorical 信念失效。论文承认了多模态后验和池外偏移的风险，但未提供自然对话或更长会话的证据，也未实验更丰富的连续高斯信念来应对这些场景。如果累积优势在自然对话中消失，本文区别于一次性生成器的核心贡献即告失败。\n\n### § 10 最小复现实验\n\n用一周时间可复现 §4.2 的 dilution study 核心发现。取一个冻结的小型基础模型（如 Qwen3-8B），用一个轻量 hypernetwork（Text-to-LoRA 风格即可）将单段文本编码为低秩 LoRA adapter 附加到 FFN 上做问答。在 MS MARCO 上固定答案段落、逐步增加干扰段落（8 到 64 段），分两种放置方式：答案前置与顺序打乱，测量答案 F1。若答案前置且无截断时 F1 仍随干扰增多而下降，则支持\"固定大小代码会饱和\"这一机制；若顺序打乱时 F1 进一步低于前置，则支持\"埋没效应\"。此实验不需要 selector 或在线更新，只需编码器和基础模型，保留的是\"数据编译进权重\"这一前提，改变的是证据规模以检验其边界。", "research_value": "### § 11 最强反例设计\n\n最强反例是构造话题频繁漂移且需回溯的自然对话，测试分类信念的累积是否引发路由震荡。论文验证累积优势时使用了人为设计的线性对话，正确编码单一且存在于池中。若在真实对话中引入跨领域跳跃，top-1强制单选与幂次遗忘将面临多模态后验冲突。当用户在话题间切换并提问需综合历史的信息时，单点信念无法同时维持对多个编码的高置信度，路由准确率可能随轮次不增反降。这表明累积优势可能仅是线性对话结构的产物。\n\n### § 12 后续研究设想\n\n后续研究应检验将离散的分类信念替换为连续高斯信念，能否解决多跳对话中的多模态后验问题。当前方法的top-1硬选择强制模型每轮只依赖单个知识编码，在需综合多段证据的场景中受限。首个对照实验可在MuSiQue等多跳数据集的长会话中，比较单选路由与基于高斯分布的软路由。若软路由在需跨段落综合推理的轮次上准确率显著更高，且未导致推理成本大幅上升，则说明连续信念是扩展该方法的必要路径。这与静态MoE的软路由不同，此处的分布参数需随在线交互持续更新。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jinli Hu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ross M. Clarke\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yichuan Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"José Miguel Hernández-Lobato\", \"affiliations\": [2, 1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Boltzbit Limited\"},\n    {\"id\": 2, \"name\": \"University of Cambridge\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "缩放定律认为，语言模型随着参数和训练数据的增加而能力增强，而 Mixture-of-Experts (MoE) 架构借助这些定律取得了显著成果，每个词元仅激活庞大存储参数库中的一小部分。这一成功建立在静态预训练数据之上。部署后的模型面临着一个不同的世界，其中能使其更有用的许多数据并不在训练集中，而是在其当前正在处理的实时交互中，例如用户提供的事实或给出的纠正。传统模型无法从这些数据中学习，因为其权重在训练后已被冻结。相反，运行时提供的知识和行为被放置在提示词中，通过检索或指令实现，并在每次请求时重新读取，一旦请求结束即被丢弃。我们探讨一种架构如何能够通过将实时交互写入其权重来进行学习。受 MoE 启发，我们提出了 \\textbf{Infinite-Parameter LLM}。一个紧凑的超网络将运行时提供的数据转化为共享基础网络的低秩调制，因此前馈权重是由实时数据生成的，而不是存储在固定库中。先前的权重生成器只读取一次上下文便将其冻结，而我们则对生成器的潜在编码维持贝叶斯信念并进行在线更新，因此随着会话的进行，有效权重是从不断演变的信念中重新推导出来的，而不是在一次读取后即固定不变。存储占用保持固定，但模型能够编译的权重实际上是无限的。对于运行时提供的知识和行为，将其承载在权重中而非提示词中，可以在计算上实现分摊，释放上下文窗口，跨轮次持久存在，并且比上下文内使用具有更好的泛化能力。我们设计了一套评测协议，专门针对这一点与上下文学习和检索进行对比测试。"}]}], "2026-09-16": [{"name": "Memory Systems for Long-Term Agents", "count": 4, "papers": [{"title": "Retrieval-Driven Memory Reconsolidation for Long-Term LLM Agents", "arxiv_id": "2609.16053", "authors": "Yuanyi Song, Yukai Wang, Xinbei Ma, Zhihui Fu, Jianghao Lin, Weiwen Liu, Jun Wang, Huarong Deng, Yong Yu, Weinan Zhang", "summary": "Long-term memory is essential for LLM-based agents operating over extended interactions. Existing memory systems primarily update memory when new information arrives, treating retrieval as the endpoint of memory access rather than a driver of memory evolution. Consequently, retrieval feedback is rarely exploited to reorganize memory for future access continuously. Moreover, most existing approaches rely on predefined memory structures together with fixed retrieval pipelines, limiting the agent's ability to organize and evolve its own memory autonomously. Inspired by memory reconsolidation in cognitive neuroscience, we propose \\textbf{REALM}, a \\textbf{r}econsolidation-\\textbf{e}volution \\textbf{a}gentic \\textbf{l}ong-term \\textbf{m}emory framework. It models long-term memory as a continual lifecycle by autonomously organizing memories into a heterogeneous cognitive graph, retrieving evidence via adaptively composed graph-search atoms, and continually reconsolidating memories based on retrieval feedback. REALM achieves an average accuracy of 75.97\\% on LoCoMo and 65.11\\% on LongMemEval, outperforming the strongest baselines by 7.17 and 1.31 points respectively. Ablation studies confirm that memory reconsolidation consistently boosts performance, with further analyses revealing that it progressively reorganizes related memory units into more coherent local structures for collective evidence recall and utilization during reasoning. These results suggest that retrieval-driven memory reconsolidation provides an effective mechanism for continually evolving long-term memory in LLM agents.", "category": "cs.CL", "cluster": "Memory Systems for Long-Term Agents", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n论文解决的核心问题是：现有大语言模型（LLM）智能体的长期记忆系统仅在接收新信息时更新记忆，将检索视为记忆访问的终点，未能利用检索反馈来持续重组记忆结构。这个问题至关重要，因为在个人助手、长程任务协作等长期交互场景中，智能体必须依赖过去的经验进行未来推理，僵化的记忆结构会严重限制其检索效率和推理质量。引入检索驱动的记忆再巩固机制，能让记忆系统根据实际使用情况自我演化，从而显著提升长期记忆的准确性和适应性。\n\n### § 2 前人工作与不足\n此前，长期记忆系统（如Mem0、Zep和MIRIX）主要遵循前向演化范式，通过预定义的层次结构或知识图谱来组织和检索历史信息。这些方法虽然能积累和提取记忆，但将检索视为被动的终点，记忆更新仅由新输入或时间衰减触发，而非记忆使用本身。这种设计忽略了认知神经科学中的记忆再巩固机制——即被回忆的记忆会进入不稳定状态并重新整合连接。因此，现有方法缺乏在检索后根据反馈动态调整记忆拓扑的能力，导致记忆结构僵化，无法随着使用逐步优化以适应未来的检索需求。", "core_insight": "### § 3 重建作者的思考路径\n\n现有长期记忆系统遵循\"新信息驱动更新\"的前向范式：记忆的添加、合并、遗忘都由新输入触发，检索只是被动提取的终点，检索反馈几乎不被利用。但认知神经科学的记忆再巩固现象表明，被回忆的记忆会进入不稳定状态，连接可被加强、减弱或新建——记忆通过使用而演化，而非一次性存储后保持静态。作者由此推断：检索过程中哪些记忆被共同激活、哪些连接有效，本身就是宝贵的认知反馈，应当反过来驱动记忆结构的重组。同时，预定义结构和固定检索流程限制了智能体自主性，需要让智能体自己决定如何组织和检索记忆。\n\n### § 4 核心直觉\n\n记忆不应只是被动积累新信息，而应通过每次检索的使用反馈主动演化。REALM的核心在于：检索不是终点而是闭环的起点——每次检索后，根据哪些记忆被共同使用、哪些连接帮助了推理，动态加强有效路径、削弱误导路径，使记忆图从初始的语义组织逐步演化为使用感知的认知结构。频繁协同召回的记忆因此形成更紧凑的局部子图，未来检索更高效。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n观察 o_t ─→ [记忆组织] ─→ 认知图 G\n            提取·合并·跳过    节点: entity/event/\n            推理边关系         episode/fact\n                              边: logical/causal/\n                                  hierarchical/associative\n查询 q ─→ [记忆检索] ─→ 证据集 V_q\n          种子定位              │\n          自适应扩展      激活子图 G_q\n          证据聚合              │\n                    答案 + 反馈 f\n                          │\n                          ↓\n                   [记忆再巩固]\n                    强化·弱化·新建边\n                    置信度引导更新\n                          │\n                    更新后 G' ──回路──→ G\n```\n\nREALM 将长期记忆建模为持续演化的闭环生命周期，包含三个阶段。\n\n**记忆组织**（§3.2）：输入新观察 $o_t$、对话摘要 $s_t$ 和近期信息 $c_t$。LLM 提取候选记忆单元，自主分类为 entity、event、episode 或 fact 节点。对每个候选单元检索语义相似和近期邻域节点，LLM 决定 add、merge 或 skip，并推理有向边（类型 ∈ {logical, causal, hierarchical, associative}），输出认知图 $G$。该阶段将插入、合并、遗忘统一为单一整合流程（Algorithm 1）。\n\n**记忆检索**（§3.3）：输入查询 $q$，分三阶段执行。种子定位：LLM 生成参数化检索计划，通过 query、keywords 或 hybrid 匹配定位起始节点。自适应扩展：从种子迭代扩展，每轮评估证据充分性，对前沿节点预测扩展动作（遍历模式、边谓词、时间衰减、路径抑制）并按访问分数评分新节点。证据聚合：全局重排序取 top-$K$ 构成证据集 $V_q$，诱导激活子图 $G_q$（Algorithm 2）。\n\n**记忆再巩固**（§3.4）：输入 $q$、$G_q$ 和任务反馈 $f$。LLM 推断主题结构，识别关键证据节点与误导节点，生成修改决策集（目标节点对、关系类型、操作 add/strengthen/weaken、置信度），通过有界调整公式更新边权重，输出 $G'$ 形成闭环（Algorithm 3）。\n\n### § 6 核心数学推导\n\n论文的数学部分主要是定义和更新规则，而非理论推导。节点 $v = (\\kappa_v, c_v, \\text{des}_v, k_v, t_v)$ 和边 $e_{ij} = (\\kappa_{ij}, \\text{des}_{ij}, w_{ij})$ 将记忆内容与拓扑结构解耦，为后续检索和演化提供结构变量。\n\n访问分数 $s_{\\text{access}}(v) = \\beta \\cdot s_{\\text{sim}} + (1-\\beta) \\cdot w_{ij} \\cdot \\Delta_{\\text{decay}}(t_v)$ 综合语义相似度、关系置信度和时间惩罚。直觉是：一个节点是否值得访问，取决于它与查询的语义相关性、在图中的关系强度、以及时间新鲜度三者的加权组合。\n\n边权重有界更新是核心机制。先计算有界表示 $w_b = \\max(w_{\\min}, \\min(1, w_{ij}))$，再按操作类型更新：strengthen 时 $w_{\\text{new}} = w_b + \\eta c(1 - w_b)$，weaken 时 $w_{\\text{new}} = w_b - \\eta c \\cdot w_b$。关键直觉在于：当权重接近边界（0 或 1）时更新幅度自动趋零，形成饱和效应，防止孤立或重复的检索实例导致拓扑剧烈震荡，保证记忆网络在持续使用中保持稳定。\n\n### § 7 实验设计与结论\n\n**RQ1：REALM 是否优于现有长期记忆系统？** 在 LoCoMo 和 LongMemEval 上与 Mem0、MIRIX、Zep、A-Mem、Nemori、MAGMA 六个基线比较。REALM 在两个基准上均取得最高平均准确率，分别超出最强基线 7.17 和 1.31 个百分点，在多跳推理和时间推理等记忆密集型任务上提升最显著。\n\n**RQ2：记忆再巩固是否有效且对交互顺序鲁棒？** 通过移除再巩固模块的消融实验和随机打乱问题顺序的鲁棒性测试验证。再巩固分别带来 2.01 和 2.13 个百分点的整体提升；在不同随机顺序下性能保持稳定，说明改进来自记忆拓扑本身的优化而非对特定问题序列的过拟合。\n\n**RQ3：REALM 在再巩固前为何已有竞争力？** 分析节点与边类型分布、检索深度和策略选择。异构认知图中各节点类型的图分布与检索分布高度一致（差异 \u003C 1.5 个百分点），无检索偏差；84.87% 的 LoCoMo 证据在种子层直接找到；自适应策略选择略优于固定策略，表明 agent 自主构建的记忆已与检索需求良好对齐。\n\n**RQ4：再巩固如何持续改善未来检索？** 比较拓扑演化前后的检索行为。证据发现率仅提升 3.70% 和 5.41%，但正确回答率提升 20.83% 和 19.23%。这表明再巩固的核心价值不在于扩大可检索空间，而在于持续重组认知图，使检索到的证据更相关、更利于下游推理。", "additional_insights": "### § 8 阅读收获\n现有 LLM Agent 的长期记忆多在新信息到来时单向更新，检索仅作为被动终点。REALM 框架引入记忆再巩固机制，将记忆建模为异构认知图，在检索后根据任务反馈动态调整局部拓扑。实验表明，这种检索驱动的演化主要提升了证据利用率而非发现量，且对问题顺序具有鲁棒性，证明其优化了记忆组织质量而非过拟合特定序列。\n\n### § 9 最脆弱的假设\n核心假设是模型能根据检索反馈准确判断记忆节点的有效性，并据此正确调整拓扑权重。若模型在复杂推理中给出错误反馈，再巩固机制可能强化错误关联路径，导致记忆结构退化。论文通过消融实验证明再巩固整体提升了准确率，但缺少对错误反馈如何影响拓扑演化的分析，这在低准确率场景下可能成为隐患。\n\n### § 10 最小复现实验\n可使用 LoCoMo 数据集验证“再巩固主要提升证据利用率而非发现量”这一结论。实现简化版记忆图与基础图检索模块，在检索后根据答案正确性调整边权重，无需复现完整的自适应策略。测量开启与关闭再巩固时支持性证据的检索比例及最终准确率。若开启后准确率提升幅度显著大于证据发现率的提升，则支持原结论；若两者相近或准确率无改善，则反驳该机制的核心价值。", "research_value": "### § 11 最强反例设计\n最强反例应针对模型错误反馈导致记忆退化的风险。在存在误导信息或复杂多跳推理的场景中，LLM 易给出错误反馈，若据此强化错误关联路径，会导致后续检索陷入错误回音壁。可设计包含陷阱问题的实验，在多轮交互中故意引入误导性证据，观察 REALM 在给出错误反馈后，其拓扑演化是否导致后续查询准确率显著下降，且降幅大于无再巩固机制的基线。这能证明该机制在低准确率场景下会可预测地失败。\n\n### § 12 后续研究设想\n后续研究可探讨如何避免错误反馈污染记忆拓扑。当前机制盲目信任 LLM 的单次反馈调整边权重，长期交互中会积累错误，值得测试的改变是引入不确定性感知的更新，仅当模型对反馈高置信度时才调整权重。首个对照实验可在 LoCoMo 中筛选模型初始回答错误的案例，对比强制执行再巩固与基于置信度阈值决定是否再巩固两种策略。若后者能防止后续相关问题的性能崩塌，则说明引入不确定性感知对维持长期记忆可靠性是必要的。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yuanyi Song\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Yukai Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xinbei Ma\", \"affiliations\": [1, 3], \"markers\": []},\n    {\"name\": \"Zhihui Fu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jianghao Lin\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Weiwen Liu\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Jun Wang\", \"affiliations\": [2], \"markers\": [\"†\"]},\n    {\"name\": \"Huarong Deng\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yong Yu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Weinan Zhang\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"SJTU\"},\n    {\"id\": 2, \"name\": \"OPPO\"},\n    {\"id\": 3, \"name\": \"NUS\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"This work was done during Yuanyi Song's internship at OPPO.\"},\n    {\"marker\": \"†\", \"text\": \"J. Lin, W. Liu, J. Wang and W. Zhang are the corresponding authors.\"}\n  ]\n}\n```", "summary_translation": "长期记忆对于在长时间交互中运行的基于大语言模型（LLM）的智能体至关重要。现有的记忆系统主要在新信息到达时更新记忆，将检索视为记忆访问的终点，而非记忆演化的驱动力。因此，检索反馈极少被用于持续重组记忆以供未来访问。此外，大多数现有方法依赖预定义的记忆结构与固定的检索流程，限制了智能体自主组织和演化自身记忆的能力。受认知神经科学中记忆再巩固（memory reconsolidation，指提取已有记忆使其重新不稳定从而进行修改的过程）的启发，我们提出了 REALM，一个再巩固-演化智能体长期记忆框架。该框架将长期记忆建模为持续的生命周期，通过自主将记忆组织成异构认知图、利用自适应组合的图搜索单元检索证据，并基于检索反馈持续进行记忆再巩固来实现这一目标。REALM 在 LoCoMo 和 LongMemEval 数据集上的平均准确率分别达到 75.97% 和 65.11%，比最强基线高出 7.17 和 1.31 个百分点。消融实验证实，记忆再巩固能持续提升性能，进一步分析表明，它能逐步将相关记忆单元重组为更连贯的局部结构，以便在推理过程中进行证据的集中召回与利用。这些结果表明，检索驱动的记忆再巩固为大语言模型智能体持续演化长期记忆提供了一种有效机制。"}, {"title": "Interactive Memory Learning for Long-Term Conversations", "arxiv_id": "2609.17088", "authors": "Cai Ke, Jiangyue Yan, Han Zhang, Xin Liu, Zike Yuan, Yue Yu, Hui Wang, Ruifeng Xu", "summary": "Recent advancements in large language models have significantly enhanced the capabilities of agents in modeling long-term conversations. Despite these successes, existing approaches typically adopt a static heuristic paradigm, where information is passively archived without adaptive memory valuation. Consequently, these methods fail to self-evolve or align their memory management with evolving user needs. To address this, we propose ICML (InteraCtive Memory Learning), a multi-agent framework that transforms the memory mechanism from a passive archive into a learnable, interactive memory policy. Specifically, we first employ a session synthesis pipeline to generate expert data, facilitating rapid test-time adaptation in unseen scenarios. Building on this, ICML utilizes an online reinforcement learning mechanism where a Planner agent selectively encodes high-value information and a Trigger agent dynamically retrieves it to optimize response quality, whereby the two agents co-evolve through continuous interaction feedback. Crucially, both agents are synchronized through a delayed reward mechanism that propagates future feedback back to earlier storage decisions, ensuring memory policies are precisely aligned with user expectations. Experimental results demonstrate that ICML significantly outperforms strong baselines, exhibiting the unique capability to continuously improve response quality as interactions accumulate.", "category": "cs.CL", "cluster": "Memory Systems for Long-Term Agents", "tags": ["cs.CL"], "filter_reason": "这篇论文符合您的研究范围。论文的核心贡献是提出了一个名为 ICML 的多智能体框架，用于长期对话中的交互式记忆学习。该框架将智能体的记忆机制从被动存档转变为可学习的策略，包含一个 Planner agent 负责选择性编码信息和一个 Trigger agent 负责动态检索。论文的核心机制涉及通过在线强化学习和延迟奖励机制使这两个智能体在连续交互反馈中共同演化（co-evolve），并实现测试时的快速自适应。这直接命中了您筛选标准中的多个关键保留项：它研究了智能体的“记忆机制”和“多智能体协作”，并且核心机制是“自我演化/自我改进”和“在线自适应”。虽然其应用场景为长期对话，但其本质贡献是智能体记忆策略的演化机制，而非单纯的领域应用，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决的核心问题是：在长期开放域对话中，智能体如何动态管理记忆以持续满足用户不断变化的期望与偏好。现有方法将记忆视为静态数据库，被动存储信息而不评估其价值，导致过时偏好与新需求之间产生冲突。这个问题至关重要，因为长期对话的本质是满足用户随时间变化的个性化需求，而缺乏自适应记忆机制的智能体无法维持类人的参与度。解决这一问题能带来真正具备终身学习能力的个性化助手，使智能体通过持续交互自我进化，而非依赖人工干预更新记忆规则。\n\n### § 2 前人工作与不足\n\n长期对话的记忆管理此前主要沿两条路线发展。管理中心的记忆智能体如 Mem0、A-Mem 和 MemoryOS 设计了图结构与层次化存储等复杂架构来组织记忆全生命周期，但这些启发式架构依赖固定规则决定存储与检索，无法根据实际对话效用调整策略，因此无法与用户期望精确对齐。生成中心的对话智能体如 MemoryBank 和 THEANINE 则将历史压缩为静态摘要或保留全部历史，前者丢失细粒度因果依赖，后者随对话深度增长导致上下文膨胀与噪声积累。两类方法的共同局限在于将记忆视为被动存档而非可学习过程，缺乏从环境反馈中推断记忆长期价值的机制——当用户偏好转变时，无法让新约束覆盖过时信息，也无法通过交互持续优化记忆决策。", "core_insight": "### § 3 重建作者的思考路径\n\n现有长期对话方法普遍采用静态启发式范式，将记忆视为被动数据库，按固定规则压缩或存档历史信息。这类方法无法区分高价值信息与低价值噪声，也无法随用户偏好变化自我调整，导致过时偏好与新需求之间产生冲突。认知心理学早已指出，人类记忆并非平等保存所有信息，而是选择性编码对未来决策有价值的线索，并通过持续反馈更新心智模型。作者可能由此推断：若将记忆管理建模为序列决策问题，让 agent 在交互中学习\"记什么\"和\"何时检索\"，便能突破静态范式的瓶颈。在线强化学习提供了将延迟反馈传播回早期存储决策的机制，而多 agent 协作则可自然地分离写入与检索两个职责。\n\n### § 4 核心直觉\n\n记忆的价值只有在未来被成功使用时才能确认，因此存储决策必须由检索结果反向校准。ICML 让 Planner 负责选择性写入、Trigger 负责按需检索，两者通过跨会话延迟奖励耦合：当某条记忆在
