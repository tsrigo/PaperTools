，彻底绕开了高维稀疏数据下 neural predictor 的过拟合问题和通用 embedding 的语义-效用错配问题。第一个实验将设计在 reward landscape 高度非平滑的代码生成或精确 action sequencing 任务上，将 skill 分解为抽象语法树或动作序列图，利用 LLM 进行 counterfactual rollout 来 ranking 候选 skill。通过对比新方法与 COBRA-Skills 的 bandit ranking 在 ground-truth reward 上的 Spearman correlation，如果新方法在非平滑任务上展现出显著更高的 ranking 准确率和 evaluation efficiency，则验证了通过 causal simulation 替代 statistical prediction 的优越性，这为 agent skill optimization 开辟了从“统计模式匹配”走向“因果机制理解”的全新研究方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Pingchen Lu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiangyi Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiang Li\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jie Mao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zikun Qu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Junfeng Luo\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yao Shu\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Bryan Kian Hsiang Low\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Zhongxiang Dai\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"CUHK-Shenzhen\"},\n    {\"id\": 2, \"name\": \"Tianjin University\"},\n    {\"id\": 3, \"name\": \"HKUST(GZ)\"},\n    {\"id\": 4, \"name\": \"NUS\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"†\", \"text\": \"Corresponding author. Correspondence to daizhongxiang@cuhk.edu.cn.\"}\n  ]\n}\n```", "summary_translation": "Large language model (LLM) 智能体可以从先前任务经验中蒸馏出的可重用技能中受益，然而现有的技能优化方法通常依赖于昂贵的基于执行的评估和大量的任务数据。我们引入了 \\textbf{COBRA-Skills}，这是一个高效的框架，它将技能优化表述为在动态演进的候选空间上的 budgeted sequential optimization。COBRA-Skills 将 contextual-bandit-guided prioritization 与 evidence-grounded skill evolution 相结合，选择性地将评估分配给有前景或信息量大的候选者，同时根据执行反馈不断精炼技能群体。在六个异构的 agent benchmarks 和三个目标模型上，COBRA-Skills 在所有比较方法中始终取得最强的平均性能，同时相对于 SkillOpt 将优化成本降低了 55--58\\%，并且每个 benchmark 仅使用 50 个独特的优化样本。进一步的分析表明，COBRA-Skills 对 agent harness 的变化保持稳健，并且当目标模型本身用于技能生成和精炼时也能有效发挥作用。"}, {"title": "Decoupling Readiness from Release for Tail-Aware Scheduling of Agentic LLM Workflows", "arxiv_id": "2609.10964", "authors": "Bochao Feng, Jianjiang Li, Haojie Wang, Lin Qiao, Yinghui Li, Yukun Yan, Jidong Zhai", "summary": "Agentic LLM workflows consist of sequences of model turns interleaved with tool interactions, so their end-to-end completion time depends not only on inference speed but also on when ready turns are released. Most runtimes release each turn immediately upon readiness. Under contention, this eager release policy can accumulate released but unfinished work; once submitted, those turns can no longer be reordered by the workflow-level policy, increasing tail latency. We present a tail-risk-aware turn release scheduling method that jointly decides which ready turn to release next and how much released but unfinished work to maintain. The method uses a mean--Conditional Value-at-Risk (CVaR) objective to capture the evolving tail risk of unfinished workflows, incorporates online estimates of turn work when prioritizing ready turns, and adapts the released work budget to observed queue pressure. We evaluate the method using real agent execution traces from software engineering tasks across multiple LLMs and workflow arrival rates. The method performs comparably to eager release under light load and substantially reduces the P95 of workflow flow time under contention, achieving up to a \\(3.50\\times\\) speedup.", "category": "cs.AI", "cluster": "Agent Skill \u0026 Runtime Optimization", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agentic LLMs)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文研究的是 Agentic LLM workflows 在共享推理引擎下的 turn release scheduling 问题。Agentic LLM workflows 由交替的 LLM turns 和 tool interactions 组成，其端到端完成时间不仅取决于 inference speed，还取决于 ready turns 何时被 release 到共享引擎中。当前大多数 agent runtimes 隐式地将 turn readiness 与 immediate submission 耦合，采用 eager release policy，即 turn 一旦 ready 就立即提交。在低负载下这几乎无害，但当引擎接近 saturation 时，持续提交会导致 released but unfinished work（即 committed work）在引擎内部积压。更关键的是，turns 一旦被 commit，workflow runtime 就无法再撤回或重新排序它们，导致 scheduler 丧失了利用后续到达信息重新选择最有价值 workflow 的能力，从而显著增加 tail latency。这个问题非常重要，因为在 web search、computer use、software engineering 等长周期 agent 环境中，stages 是 sequentially dependent 的，当前 turn 的延迟会推迟后续所有 tool invocations 和 LLM turns，调度决策会累积成端到端完成时间的巨大差异。解决这一问题能带来显著价值：在 congestion 下将 workflow P95 flow time 降低最高 71.4%（3.50× speedup），同时在低负载下不引入任何性能损失。\n\n### § 2 前人工作与不足\n\n该问题之前未被作为独立的 pre-engine release scheduling 问题加以解决。最相关的 prior work 可分为两类。第一类是 engine-level scheduling，如 Sarathi-Serve 通过 interleaving chunked prefills with decoding 管理 throughput-latency tradeoff，FastServe 使用 iteration-level preemption 和 multilevel feedback queue 减少 head-of-line blocking，VTC 根据 token-level attained service 分配服务以改善 fairness。这些方法优化的是引擎内部的请求处理顺序，但隐含假设请求一旦 ready 就应立即进入引擎，没有将 release timing 本身视为可控的调度变量。第二类是 application-aware scheduling，如 Parrot 通过 semantic variables 暴露 LLM calls 间的 dependencies 并利用 dataflow，Agentix 使用 program-level attained service 优先处理 calls，JITServe 利用 imprecise length 和 dependency information 为 SLO goodput 分配 capacity。这些方法虽然考虑了 broader execution context，但仍然没有显式建模 ready turn 的 pre-engine release time 作为 workflow-level 的决策变量。在 tail latency 理论方面，Yu and Scully 针对 light-tailed M/G/1 queues 提出 strongly tail-optimal scheduling，Harlev 等人推导了 job sizes 未知时的 Gittins policy，Kim and Min 开发了 predictive CVaR policy gradient method，但这些工作均未针对 multi-turn agent workflows 的 completion time 建模 tail risk，也未研究该风险应如何 govern ready turns 的 release。根本原因在于，之前的研究框架将 readiness 等同于 submission obligation，未认识到在 congestion 下 early commitment 会不可逆地消耗 scheduling optionality——这一 gap 在 agentic workflows 的 sequential dependency 和 shared-capacity contention 交织的场景下尤为突出，但此前既没有被清楚定义，也没有被系统性地 formulate 为 online scheduling problem。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Agentic LLM workflows 的执行场景中，研究者首先观察到端到端的 workflow flow time 才是用户感知的核心指标，而由于 LLM turns 与 tool executions 之间存在严格的序列依赖，单个 turn 的延迟会级联地推迟后续所有阶段。当多个 workflows 并发共享有限的推理资源时，现有的 agent runtimes 普遍采用 eager release policy，即 turn 一旦满足依赖就绪便立即提交至共享的 LLM engine。在轻负载下，这种策略几乎无害；但随着系统接近 saturation，持续提交会导致大量已释放但未完成的 turns 积压在 engine 内部。此时，runtime 失去了对这些 committed turns 的控制权，无法在新的 workflow 到达或现有 workflow 状态演变时重新排序，从而丧失了调度灵活性，最终导致 tail latency 急剧恶化。\n\n面对这一失败模式，研究者意识到这并非单纯的 engine queueing 问题，而是一个发生在请求进入 engine 之前的 online scheduling 问题。Readiness 仅代表 turn 具备了执行资格，并不等同于必须立即提交。在每一个决策点，scheduler 实际上面临两个耦合的问题：应该释放哪个 ready turn，以及是否应该继续释放更多工作。为了解决前者，研究者从 tail-risk-aware scheduling 的视角出发，引入了 mean-CVaR 目标来刻画未完成 workflows 的尾部风险演变。通过对 CVaR 的变分表示进行 occupation form 推导，每个未完成的 workflow 获得了一个随其 age 增长的 instantaneous delay weight，当 age 超过在线估计的尾部阈值时，该权重会显著增加。然而，不同的 ready turns 所需的推理工作量差异巨大，仅按 holding cost 排序并不足够；受经典非抢占式调度中 pairwise interchange rule 的启发，研究者将 holding cost 除以 turn 的在线工作量估计，得到了衡量“单位工作量所能缓解的尾部风险”的 priority index。对于后者，即是否继续释放工作，研究者借鉴了拥塞控制的思想，设计了 adaptive release budget。通过监控 engine 的 congestion signals 并动态调整允许的 committed work 上限，scheduler 能够在拥塞时主动限制提交量，将 ready turns 保留在 runtime 可控的范围内，从而为未来的调度决策保留 optionality。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 在于：将 turn 的 readiness（就绪）与 release（提交）解耦。在系统拥塞时，不要一有 turn 就绪就立刻提交给推理引擎，而是将其保留在 runtime 层面，根据 workflow 的尾部风险和工作量估算来决定优先提交哪个。同时，通过自适应的 release budget 限制进入引擎的未完成工作量，从而保留调度灵活性，优先推进最可能成为尾部延迟的 workflow。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+-------------------+       +-----------------------+\n| Ready Turns R(t)  |------\u003E| Turn Prioritization   |\n| (Workflow Runtime)|       | (Calc Priority U_v)   |\n+-------------------+       +-----------+-----------+\n                                         ^\n+-------------------+       +-----------+-----------+\n| Congestion Signals|------\u003E| Adaptive Release      |\n| (Queue, Waiting)  |       | Budget (B_m)          |\n+-------------------+       +-----------+-----------+\n                                         |\n+-------------------+       +-----------v-----------+\n| Committed Turns   |\u003C------| Release Scheduling    |\n| K(t) (LLM Engine) |       | (Select \u0026 Commit Turn)|\n+-------------------+       +-----------------------+\n        |                              |\n        | (Completion \u0026 Flow Time)     |\n        +------------------------------+\n```\n\n以 SWE-bench 中的一个软件工程 workflow 为例，该 workflow 包含多个 LLM turns 和 tool executions（如运行测试脚本）。\n\n- **输入**：当 workflow 中的一个 tool execution 完成后，下一个 LLM turn $v$ 变为 ready，进入 Ready Turns $R(t)$ 集合。同时，系统持续监测 LLM engine 的 Congestion Signals（如 queue mean, waiting requests）。\n- **处理**：\n  1. **Turn Prioritization** 模块接收 $R(t)$ 中的 turn $v$。它根据该 workflow 的 age $a_i(t)$ 和在线更新的 tail threshold $\\tau(t)$ 计算 holding cost $h_i(t)$。同时，利用 prompt 长度和已完成 turns 的信息估计该 turn 的 work $w_v$。两者相除得到 priority index $U_v(t)$。\n  2. **Adaptive Release Budget** 模块接收 Congestion Signals，更新 congestion-control state $\\lambda_m$，并映射为当前的 release budget $B_m$。\n  3. **Release Scheduling** 模块综合 $U_v(t)$ 和 $B_m$。它首先检查当前 committed work $W(t)$ 加上候选 turn 的 $w_v$ 是否超过 $B_m$。如果未超过，且没有 turn 等待时间超过 starvation threshold $H$，则选择 $U_v(t)$ 最大的 turn 释放。如果超过 $B_m$，则推迟释放，保留在 $R(t)$ 中。\n- **输出**：被选中的 turn 从 $R(t)$ 移入 Committed Turns $K(t)$，提交到 LLM engine 执行。执行完成后，该 turn 的 completion 信息和所属 workflow 的 flow time 作为反馈，更新 $\\tau(t)$ 和后续 turn 的 work estimate，形成闭环。\n\n### § 6 核心数学推导\n\n论文的核心数学推导是从 mean-CVaR 目标函数推导出 turn 的 priority index $U_v(t)$。\n\n1. **目标函数**：$J(\\pi) = \\beta E[T] + \\kappa CVaR_{\\alpha, \\pi}(T)$。这里 $T$ 是 workflow flow time，$\\beta$ 控制平均延迟的权重，$\\kappa$ 控制 tail risk 的权重，$\\alpha$ 是 CVaR 的置信水平。**Intuition**：我们不仅希望所有 workflow 的平均完成时间短，还特别希望那些最慢的 workflow（即 tail）能尽量快一点。\n\n2. **CVaR 的变分表示**：$CVaR_{\\alpha, \\pi}(T) = \\min_{\\tau} \\{ \\tau + \\frac{1}{1-\\alpha} E[(T-\\tau)^+] \\}$。**Intuition**：CVaR 可以转化为寻找一个最优阈值 $\\tau$（即 VaR），使得阈值本身加上超出阈值的平均超额部分的加权和最小。这把复杂的 tail risk 优化变成了一个带辅助变量的优化问题。\n\n3. **Occupation Representation**：对于固定的 $\\tau$，单个 workflow 的 variational loss 可以表示为对其生命周期内 instantaneous holding cost 的积分：$\\int_{A_i}^{C_i} h_i(t; \\tau) dt$，其中 $h_i(t; \\tau) = \\beta + \\frac{\\kappa}{1-\\alpha} \\mathbf{1}_{a_i(t) \u003E \\tau}$。**Intuition**：只要 workflow 未完成，就会持续产生成本。如果它的 age $a_i(t)$ 超过了阈值 $\\tau$（进入了 tail region），它的 holding cost rate 就会跳变，增加一个额外的惩罚项 $\\frac{\\kappa}{1-\\alpha}$，从而迫使 scheduler 优先处理这些快要超时的 workflow。\n\n4. **Priority Index**：为了比较不同大小的 turn，使用 pairwise interchange rule，按 non-increasing holding cost per unit work 排序。定义 $U_v(t) = \\frac{h_i(t; \\tau(t))}{w_v}$。**Intuition**：$U_v(t)$ 衡量了推进该 workflow 每单位 estimated work 所能减少的 holding cost。优先推进 $U_v(t)$ 大的 turn，可以在有限的 engine 容量下最大化降低整体的 tail risk。\n\n5. **在线估计 $\\tau(t)$**：由于真实的 flow time 分布未知，使用随机近似算法在线更新 $\\tau$：$\\tau_n = \\Pi_{\\mathbb{R}_+} [ \\tau_{n-1} - \\zeta_{n-1} ( \\alpha - \\mathbf{1}_{T_{(n)} \u003E \\tau_{n-1}} ) ]$。**Intuition**：如果新观察到的 flow time $T_{(n)}$ 大于当前估计的 $\\tau$，说明 $\\tau$ 估计偏低，应该增大；反之则减小。步长 $\\zeta$ 逐渐减小以保证收敛。\n\n### § 7 实验设计与结论\n\n- **提出了什么问题**：在 shared LLM engine 拥塞的情况下，eager release policy 会导致 tail latency 急剧上升。提出的 tail-risk-aware turn release scheduling 方法能否在保持低负载性能的同时，有效降低高负载下的 workflow tail latency？\n- **设计了什么实验验证这个问题**：使用 vLLM 作为 inference engine，在 SWE-bench 和 SWE-Gym 数据集上，使用三种不同规模的模型（Qwen3-8B, Qwen3-32B, Llama-3.3-70B）进行 closed loop replay。对比 Eager Release 和 Proposed method 在不同 arrival rates 下的 P95 workflow flow time。同时设计了 ablation study，分离 turn ordering (tail-aware vs FIFO) 和 release budget (adaptive vs fixed) 的贡献。\n- **问题的答案是什么**：在低负载下，proposed method 与 eager release 性能几乎相同，没有引入额外的 latency penalty。在高负载下，proposed method 显著降低了 P95 workflow flow time，最高达到 3.50x speedup (71.4% reduction)。Ablation study 表明，tail-aware ordering 提供了主要的性能提升，而 adaptive budget 提供了较小但一致的额外改进。", "additional_insights": "### § 8 Take-aways\n\nAgentic LLM workflow 的端到端完成时间不仅取决于推理速度，还取决于 ready turn 何时被 release 到共享推理引擎。大多数 runtime 采用 eager release policy——turn 一旦 ready 就立即提交——这在轻负载下几乎无害，但在 congestion 下会导致大量 released but unfinished work（即 committed work）在引擎内部积压，且这些 committed turns 无法被 workflow-level scheduler 撤回或重排，造成 scheduling optionality 的不可逆丧失。本文将 readiness 与 release 的解耦形式化为一个 online scheduling 问题：在每个决策点同时决定（1）释放哪个 ready turn，以及（2）是否应该继续提交更多 work。对于第一个决策，作者从 mean-CVaR 目标推导出每个未完成 workflow 的 instantaneous delay weight $h_i(t;\\tau)$，除以该 turn 的 online work estimate $w_v$，得到 priority index $U_v(t)$，衡量\"每单位推理工作能换取的 workflow holding-cost 减少量\"。对于第二个决策，作者维护一个基于 congestion signal 自适应调节的 release budget $B_m$，限制引擎中 committed work 的总量。Algorithm 1 在每个决策点先根据 budget 筛选 feasible turns，再按 $U_v(t)$ 排序选择，并设有 starvation threshold $H$ 防止持久饥饿。实验在 SWE-bench 和 SWE-Gym 的真实 agent trace 上、跨三种模型配置和五种 arrival rate 进行 closed-loop replay，结果表明：轻负载下与 eager release 性能持平（P95 ratio 0.99×–1.00×），congestion 下 P95 workflow flow time 最高降低 71.4%（3.5× speedup）。Ablation 显示 tail-aware ordering 贡献了主要增益（相对 FIFO 降 59.5%–63.5%），budget adaptation 提供较小但一致的额外改进（约 10%–12%）。\n\n### § 9 最脆弱的假设\n\n最脆弱且失败代价最大的假设是：**online turn work estimate $w_v = p_v + \\gamma \\hat{o}_v$ 足够准确，使得 priority index $U_v(t) = h_i(t;\\tau) / w_v$ 能产生有意义的排序。** 这个假设是 tail-aware ordering 的核心——如果 $w_v$ 系统性偏差严重，priority index 就退化为噪声，而 ablation 明确显示 tail-aware ordering 贡献了主要增益（3.12× vs FIFO 的 1.42×），因此 $w_v$ 失效意味着失去大部分性能收益。\n\n该假设在实际中可能不成立的原因是：$\\hat{o}_v$ 仅从已完成 turn 的输出长度构造，而 agentic workflow 中不同 turn 的输出长度变异性极大——一个 code generation turn 可能输出数百 token，而一个 tool-calling turn 可能只输出几十 token。更关键的是，同一 workflow 内 turn 间的输出长度可能没有稳定的自相关结构（例如一个 debugging workflow 的前几个 turn 输出很短，但某个关键 turn 突然需要生成大段 patch），此时从已完成 turn 推断 $\\hat{o}_v$ 会产生系统性低估或高估。此外，prompt length $p_v$ 虽然可观测，但 prefill 和 decode 的实际计算成本在不同模型架构和 batching 策略下并非线性可加，$\\gamma=4$ 这一固定系数难以覆盖所有情况。\n\n论文提供的间接证据是 ablation 中 tail-aware ordering 相对 FIFO 的显著改进，这暗示 $w_v$ 至少在 SWE-bench/SWE-Gym trace 上是有用的。但论文**完全没有直接评估 $w_v$ 的估计误差**——没有报告 $\\hat{o}_v$ 与实际输出长度的相关性、MAPE 或任何 calibration 指标，也没有展示 $w_v$ 误差分布对 P95 改进的敏感性分析。如果 $w_v$ 的准确性高度依赖 SWE 任务特有的输出长度模式，则该方法迁移到其他 agent 场景（如多轮对话、web browsing）时可能大幅退化。\n\n### § 10 最小复现实验\n\n用一周时间，可以做一个**离散事件仿真实验**验证核心 claim：\"在 congestion 下，将 readiness 与 release 解耦并按 tail-risk-aware priority 排序，能显著降低 P95 workflow flow time。\" 这个方案不需要 GPU 或实际 LLM 推理，因为 scheduling benefit 来自 release policy 而非引擎内部机制。\n\n**数据**：从 SWE-bench trace 中提取 100 个 workflow 的结构信息——每个 workflow 的 turn 数量、各 turn 的 prompt/completion token 数（作为 service time 的代理）、tool gap duration。这些信息足以重建 workflow 的依赖结构和计算量分布。\n\n**实现**：用 Python 构建一个 discrete-event simulator，将共享引擎建模为单服务台队列（service time 正比于 token 数），workflow 按 Poisson 过程到达。实现两种 release policy：（A）Eager Release——turn ready 即提交；（B）Proposed——维护 online $\\tau$ 估计（用已完成 workflow 的 flow time 更新 $\\alpha$-quantile），计算每个 ready turn 的 $U_v(t) = h_i(t;\\tau)/w_v$，并用固定 budget $B$ 限制 committed work 总量（可先用固定 120k budget，跳过 adaptive controller 以简化实现）。Tool gap 期间 workflow 阻塞，不参与调度。\n\n**测量**：在 arrival rate = 0.9 workflows/s（congestion regime）下运行 100 个 workflow，记录每个 workflow 的 end-to-end flow time，计算 P95。同时运行 arrival rate = 0.1 workflows/s 作为 low-load 对照。\n\n**判定标准**：如果 Proposed 在 congestion 下 P95 显著低于 Eager Release（例如降低 50% 以上），且在 low-load 下两者 P95 差距 \u003C 5%，则支持核心 claim。如果 congestion 下两者 P95 无显著差异，则说明 benefit 可能主要来自 vLLM 引擎内部的 batching/preemption 动态，而非 release policy 本身——这将反驳论文将贡献归因于 release scheduling 的论述。仿真实验的额外价值是可以在几分钟内扫遍多种 arrival rate 和 budget 设置，快速验证 budget 对 P95 的敏感性曲线。", "research_value": "### § 11 最强反例设计\n\n最强反例应针对方法的核心增益来源——tail-aware ordering 对 turn work estimate $w_v$ 的依赖。论文假设 $w_v = p_v + \\gamma \\hat{o}_v$ 能产生有意义的排序，但这一假设在 turn 输出长度高度不可预测且呈重尾分布的 agentic workflow 中会系统性失效。具体而言，当某个 workflow 的前序 turn 输出都很短，导致 $\\hat{o}_v$ 严重低估当前 turn 的实际输出长度时，该 turn 会获得异常高的 priority index $U_v(t) = h_i(t;\\tau) / w_v$。Scheduler 会优先将其 release 到引擎，但该 turn 实际消耗的 engine capacity 远超预期，形成 **priority inversion**——一个被误判为 \"cheap\" 的 turn 长期占用引擎资源，阻塞了其他真正 cheap 的 turn，反而加剧 tail latency。这比 eager release 更糟，因为 eager release 至少保留了 FIFO 的公平性。为了验证这一替代解释，可以设计一个包含两类混合负载的 synthetic agentic workflow dataset：A 类 workflow 的 turn 输出长度可预测（如 SWE-bench 中的 code generation），B 类 workflow 的 turn 输出长度呈重尾分布且与历史无关（如 open-ended web search 或 creative writing）。在 high arrival rate 下对比 Proposed method 与 Eager Release 的 P95 flow time。如果 Proposed method 在 B 类 workflow 占比高时性能显著退化，甚至不如 Eager Release，则证明论文的增益并非来自 release scheduling 本身，而是高度依赖于 SWE-bench 特有的输出长度可预测性。这一反例揭示了方法在异构且不可预测的 agent 场景下的可预测失败条件。\n\n### § 12 Follow-up Research Idea\n\n基于 turn work 本质上不可预测这一根本局限，可以提出一个从 \"predict-then-schedule\" 转向 \"speculative release with runtime correction\" 的新 framing。当前方法试图在 release 前准确估计 $w_v$，但 LLM 的自回归特性决定了输出长度在生成完成前具有不可消除的随机性。与其依赖不可靠的估计，不如利用 LLM engine 的 preemption 能力（如 vLLM 的 recompute 或 swap），将 release scheduling 与 engine-level preemption 深度耦合，形成一个闭环反馈系统：先按粗略 priority 释放 turn，但在 engine 内部持续监测实际 token 生成速度，如果发现某个 turn 的实际 work 远超预期（即成为 \"tail-maker\"），则主动 preempt 它，将其放回 Ready Turns $R(t)$ 集合，释放 capacity 给其他 workflow。这一思路借鉴了 OS scheduling 中的 **preemptive processor sharing** 和 database query optimization 中的 **feedback-driven adaptive scheduling**，将不可预测性视为系统固有属性而非需要估计的参数。第一个实验可以在 vLLM 上实现这种 speculative release with preemption，使用一个 turn work 高度不可预测的 dataset（如 multi-turn creative writing），对比 Eager Release、Proposed (predict-then-schedule) 和 Speculative Release 的 P95 flow time 与 preemption overhead。预期结果是：当 $w_v$ 估计误差大时，Proposed 方法性能退化，而 Speculative Release 通过 runtime correction 保持低 tail latency，尽管 preemption 带来一定 overhead，但在高负载下 net benefit 显著。这与 FastServe 等已有工作的区别在于：FastServe 使用 preemption 是为了被动解决 engine 内部的 head-of-line blocking，而本提议是 workflow-level 的主动策略，将 preemption 作为 release scheduling 的纠错机制，打开了 \"release-preempt-rerelease\" 联合优化的新方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Bochao Feng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jianjiang Li\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Haojie Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Lin Qiao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yinghui Li\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yukun Yan\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jidong Zhai\", \"affiliations\": [3], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"University of Science and Technology Beijing\"},\n    {\"id\": 2, \"name\": \"Qiyuan Laboratory\"},\n    {\"id\": 3, \"name\": \"Tsinghua University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "Agentic LLM workflows 由与 tool interactions 交替的 model turns 序列组成，因此其 end-to-end completion time 不仅取决于 inference speed，还取决于 ready turns 何时被释放。大多数 runtimes 在 turn 就绪时会立即将其释放。在 contention 下，这种 eager release policy 会积累 released but unfinished work；一旦提交，这些 turns 就无法再被 workflow-level policy 重新排序，从而增加 tail latency。我们提出了一种 tail-risk-aware turn release scheduling method，该方法共同决定下一个释放哪个 ready turn 以及维持多少 released but unfinished work。该方法使用 mean--Conditional Value-at-Risk (CVaR) objective 来捕捉 unfinished workflows 不断演变的 tail risk，在对 ready turns 进行优先级排序时结合 turn work 的 online estimates，并根据观察到的 queue pressure 调整 released work budget。我们使用来自软件工程任务的 real agent execution traces 对该方法进行评估，这些任务涵盖了多个 LLMs 和不同的 workflow arrival rates。该方法在轻负载下表现与 eager release 相当，并在 contention 下显著降低了 workflow flow time 的 P95，实现了高达 \\(3.50\\times\\) 的加速。"}, {"title": "Ecdysis: Efficient and Effective Training of Runtime Harnesses for LLM Agents", "arxiv_id": "2609.11677", "authors": "Ruiqing Yue, Yu Cui, Zhuoyu Sun, Sicheng Pan, Xianhong Xue, Tingyu Li, Ting Li, Wenzhuo Zhu, Yi Chen, Yifei Liu, Baohan Huang, Zhe Cui, Haibin Zhang, Cong Zuo", "summary": "Self-evolving runtime harnesses can substantially improve the capabilities of large language model (LLM) agents and provide a promising paradigm for optimizing agent execution. Existing harness evolution methods typically rely on iterative search, repeatedly evaluating and revising candidate harnesses based on execution feedback from task instances. While this paradigm enables continuous harness optimization, it incurs substantial time overhead due to repeated agent executions and code modifications, and may overfit to observed tasks and specific failure patterns, resulting in degraded generalization to unseen tasks. We identify the lack of principled failure diagnosis as a key bottleneck in harness evolution: an observed failure can reflect either model-specific deficiencies or systematic harness deficiencies, and directly optimizing against individual failures can lead to unnecessary model-specific accommodation. We therefore propose Ecdysis, an efficient and effective framework that distinguishes model-specific accommodation from harness-level repair and biases adaptation toward systematic harness deficiencies by identifying recurring cross-task failure patterns. Ecdysis adopts a batch-level cross-instance failure aggregation paradigm to jointly analyze failure evidence from multiple task instances and further introduces Failure-Driven Collaborative Refinement to diagnose failure causes and iteratively refine harness modification specifications. By combining cross-instance failure analysis with multi-role diagnosis, Ecdysis enables more effective harness evolution with lower training time. Experiments show that Ecdysis achieves up to a 1.84x speedup in harness training compared with existing harness evolution methods, while improving the reasoning accuracy of the resulting harnesses by 18.56%.", "category": "cs.AI", "cluster": "Agent Skill \u0026 Runtime Optimization", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving, LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的研究问题是如何高效且有效地为 LLM agents 训练 runtime harnesses，核心在于区分 model-specific deficiencies 与 systematic harness deficiencies，从而指导更具泛化能力的 harness evolution。在 LLM agents 的实际应用中，底层模型的能力往往不足以应对复杂任务，而 runtime harnesses 通过 task planning、tool interaction 和 context management 等推理时机制能显著提升 agent 性能。因此，自动优化 runtime harnesses 成为释放 LLM 潜力的关键。然而，现有的 harness self-evolution 方法面临效率低下和泛化性差的瓶颈。解决这个问题不仅能大幅降低 harness 训练的时间与 API 成本，还能提升 agent 的推理准确率，并使训练出的 harness 具备更强的跨模型泛化能力和更低的推理时 token 消耗，这对于构建可靠且通用的 LLM agents 具有重要的工程与理论价值。\n\n### § 2 前人工作与不足\n在 ECDYSIS 之前，harness self-evolution 领域已有若干探索，如 Self-Evolution (SE) [27]、Recursive harness self-improvement [6] 以及 Harness-r1 [9] 等方法。这些 prior methods 能够基于 execution feedback 和 iterative evaluation 自动提出并验证 harness 代码的修改，实现了 harness 的持续优化。然而，它们存在根本性的方法论缺陷：这些系统通常将每次观察到的失败视为独立的修改信号，直接针对单个失败调用 coding agent 进行代码修改。这种范式的关键假设失效在于，它默认所有失败都源于 harness 的系统性缺陷，而忽略了失败同样可能源于当前 task model 的特定行为局限。由于缺乏原则性的 failure diagnosis，直接针对单个失败进行修改会导致不必要的 model-specific accommodation，使 harness 过拟合于特定模型和训练任务，进而严重损害其在未见任务和跨模型场景下的泛化能力。此外，这种 instance-level 的串行修改方式要求每次更新都重新执行 agent 并验证结果，导致了极高的训练时间开销和冗余的 coding-agent 调用成本。之前的研究未能解决这一问题的原因在于，单个失败提供的证据不足以区分模型缺陷与 harness 缺陷，而简单收集更多失败也无法消除这种归因模糊性，缺乏跨任务失败模式的聚合分析机制。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM agents 的应用中，runtime harnesses（如 task planning 和 tool interaction 机制）对整体性能至关重要，因此自动优化 harness 的 self-evolution 方法应运而生。然而，早期的 iterative search 方法直接根据 execution feedback 逐个修复失败，这在实践中暴露出明显的局限性：harness 会逐渐 overfit 到特定的训练任务和当前模型的怪癖上。深入分析这一失败模式可以发现，agent 执行失败的原因是模糊的——它可能源于底层 LLM 自身的推理能力不足，也可能源于 harness 在交互机制上的系统性缺陷。如果系统无法区分这两种情况，直接针对单个失败修改 harness，就会迫使 harness 去适应模型的特定弱点，即 model-specific accommodation，这不仅损害了 harness 跨模型和跨任务的 generalization，还因为反复调用 coding agent 修改代码而带来巨大的时间开销。为了打破这一瓶颈，研究者需要找到一种可靠的 failure attribution 机制。一个直观的逻辑是：单个失败不足以证明 harness 存在缺陷，但如果同一种失败模式在多个相互独立的 task instances 中反复出现，那么它作为 systematic harness deficiency 的证据就要强得多。基于这一归纳偏置，研究者自然会想到放弃 instance-level 的串行修复，转而采用 batch-level 的跨任务失败聚合策略。通过在批次内寻找 recurring failure patterns，系统能够过滤掉模型偶发错误带来的噪音，将优化重心转移到真正可复用的 harness-level repair 上。为了进一步提升这种跨任务失败诊断的可靠性，可以引入多角色协作的机制，让不同视角的 agent 共同审查聚合后的失败证据，生成结构化的修改规范，从而在减少冗余代码修改的同时，确保 harness 进化朝着更具泛化性的方向发展。\n\n### § 4 核心 Intuition\n\n现有的 harness self-evolution 之所以低效且容易过拟合，是因为它将每一次 agent 执行失败都视为修改 harness 的直接信号，导致 harness 盲目迎合当前模型的特定弱点。这篇论文的核心 Intuition 是：跨任务反复出现的失败模式才是 harness 系统性缺陷的可靠证据，而孤立失败往往只是模型自身的局限。因此，通过批量聚合多个任务的失败证据并识别重复模式，系统就能将修改导向真正具有泛化价值的 harness-level repair，同时避免为单个失败反复调用 coding agent，从而兼顾进化效果与训练效率。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n                    ECDYSIS Training Pipeline\n\n  ┌─────────┐\n  │ H_{i-1} │─────────────────────────────────┐\n  └────┬────┘                                 │\n       ▼                                      │\n  [Execute Tasks]──T_i──\u003E[Failure Filter]     │\n   θ, H_{i-1}, E          + Aggregation       │\n                          → G_i               │\n                               │              │\n                               ▼              │\n                        [FDCR: K rounds]      │\n                         Analyst/Critic/      │\n                         Engineer→Moderator   │\n                         → q_i (mod spec)     │\n                               │              │\n                               ▼              │\n                        [Coding Agent]        │\n                         → H_i^c              │\n                               │              │\n                               ▼              │\n                        [Validate]            │\n                        J_train(H_i^c)\u003E       │\n                        J_train(H_{i-1})?     │\n                         /        \\           │\n                      Yes         No          │\n                       │           │          │\n                  H_i=H_i^c   H_i=H_{i-1}────┘\n                       │           │\n                       └─────┬─────┘\n                        i\u003CR?─Yes─→ 循环\n                         No\n                         ▼\n                    [Freeze H_F=H_R]\n```\n\nECDYSIS 的训练过程（Algorithm 1）在固定的 task model θ 和 runtime environment E 下，对 runtime harness 进行 R 轮迭代优化，每轮包含以下步骤：\n\n1. **执行与轨迹收集**（§3.3, Line 3-4）：以当前 harness H_{i-1} 在训练集 D_train 上执行所有训练任务，收集 execution trajectories T_i。每条轨迹 τ 产生一个 task score S(τ)，通过预设阈值 λ 判定 binary failure signal f_λ(τ)：若 S(τ) \u003C λ 则标记为失败。此阶段仅使用固定评估框架的原始评分机制，不修改评分逻辑。\n\n2. **Batch-Level Failure Aggregation**（§3.3, Line 5-9）：将所有失败轨迹转换为结构化记录 B_i，每条记录保留 task identifier、failure decision、termination reason、tool-call history 和必要 execution context。随后按失败模式将记录分组为 G_i，优先关注覆盖至少两个不同 task 的 group——因为单一任务的重复失败不足以证明底层失败机制具有跨任务一般性。单任务 group 仅作为辅助证据保留。这一设计将每轮的 coding-agent 调用次数从 n_i（逐失败处理）降至最多 1 次，是训练效率提升的主要来源。\n\n3. **FDCR 多角色诊断**（§3.4, Line 12-16）：对每个含失败证据的 evolution round，启动 K 轮迭代精炼。三个角色顺序执行：Analyst 识别潜在 harness 缺陷并提出最小化、针对性的修改提案；Critic 对照失败证据评估提案风险，包括 trigger 过宽、误阻合法行为、违反 runtime contract、以及对已成功任务的 regression；Engineer 追踪已达成共识与未解决分歧，标记需后续澄清的问题。每轮中各角色接收累积的 shared transcript M_i，使后续分析可基于前序讨论展开。K 轮结束后，Moderator 读取完整 transcript 和失败证据，进行保守仲裁，生成结构化修改规范 q_i——描述失败模式、修改方案和实现指导，但不直接修改 harness 代码。\n\n4. **Coding Agent 修改**（§3.4, Line 17）：Coding agent 接收 q_i、相关执行证据和当前 harness 源码，对 H_{i-1} 进行修改，产出 candidate harness H_i^c。FDCR 与 coding agent 职责分离：前者负责跨实例失败诊断和修改规范精炼，后者负责具体代码实现。\n\n5. **验证与接受**（§3.2, Line 18-21）：在完整训练集上评估 H_i^c 的 overall score J_train。仅当 J_train(H_i^c) \u003E J_train(H_{i-1}) 时接受候选并令 H_i = H_i^c；否则保留上一轮 harness H_i = H_{i-1}。该准则仅约束训练集总体分数，不要求每个训练任务 individually 改进。\n\n6. **冻结与推理**（§3.2, Line 22-23）：R 轮迭代后，冻结最终验证通过的 harness H_F = H_R。推理阶段直接使用 H_F，不再进行任何 harness 修改或 test-time adaptation。跨模型评估时，将 Qwen3-8B 上演化的 harness 直接迁移至其他模型，不做进一步 evolution。\n\n### § 6 核心数学推导\n\n论文的核心数学内容集中在 §3.1 的概念分解和 §8.3 的 model accommodation 分析中，属于概念性形式化而非严格定理证明。\n\n**Harness update 分解**（§3.1）：设一轮 evolution 产生的 aggregate harness update 为 ΔH，由若干独立的修改决策构成。每个决策要么 accommodate 当前 task model 的局限（model-specific accommodation），要么 repair 系统性 harness 缺陷（harness-level repair）。引入 t ∈ [0,1] 表示 model-specific accommodation 决策所占比例，则 ΔH 可概念性分解为 ΔH = t·ΔH_model + (1−t)·ΔH_harness。这里 t 同时是 model-accommodating 决策的占比和 model-accommodation 分量在整体更新中的权重。intuition 是：t 越大，harness 越能快速解决当前观测到的失败，但也越容易 overfit 到当前模型和训练任务的特异性，损害对 unseen tasks 和其他模型的泛化。ECDYSIS 的核心假设是：跨任务实例重复出现的失败模式比孤立失败提供更强的系统性 harness 缺陷证据，因此可以将 t 衰减为 t' = βt（β ∈ (0,1)），从而将 adaptation 偏向 harness-level repair。\n\n**Coding-agent 调用次数不等式**（§3.3）：设第 i 轮收集到 n_i = |B_i| 条失败记录。逐失败独立处理需 n_i 次 coding-agent 调用，而 ECDYSIS 每轮最多 1 次调用。因此总调用次数满足 Σ_i 1 ≤ Σ_i n_i，当任一轮含多条失败记录时不等式严格成立。这是训练效率提升的定量基础。\n\n**接受准则**（§3.2）：H_i^c 被接受当且仅当 J_train(H_i^c) \u003E J_train(H_{i-1})，即候选 harness 必须在训练集总体分数上严格优于上一轮保留的 harness，否则被丢弃并回退。\n\n**Model accommodation 的实证量化**（§8.3）：通过 fine-grained manual analysis，论文量化了 SE 的 t = 60.0% 而 ECDYSIS 的 t = 45.5%，降低 14.5 个百分点。这为\"ECDYSIS 通过减少 model-specific over-adaptation 来提升跨模型泛化\"提供了实证支撑。\n\n### § 7 实验设计与结论\n\n论文围绕四个核心 claim 设计实验，每个 claim 对应明确的实验验证路径。\n\n**Claim 1：ECDYSIS 提升推理性能** → 在五个 task LLM（Qwen3-8B/14B/32B、MiniMax-M2.7、Llama-3.1-8B）和两个 τ²-Bench 子集（Airline、Retail）上，以 Human-Aug. 为共同初始 harness，比较 Direct、Human-Aug.、Self-Evolution (SE)、ECDYSIS (w/o FDCR)、ECDYSIS (w/ FDCR) 五种配置的 AVG accuracy、Pass@3 和 Pass^3 → ECDYSIS (w/ FDCR) 在十种 model-subset 组合上取得最高平均 accuracy 59.33%，相对 SE 提升 27.1%，相对 Human-Aug. 提升 14.8%；Pass^3 相对 SE 提升 55.2%，表明跨重复试验的成功一致性更高。Ablation 显示从 SE 到 ECDYSIS (w/o FDCR) accuracy 提升 8.00%，加入 FDCR 再提升 4.67%，证明 batch-level aggregation 和 multi-role diagnosis 各自贡献独立增益。\n\n**Claim 2：ECDYSIS 提升训练效率** → 记录从初始训练评估到最终 harness 冻结的 end-to-end wall-clock time 和 API cost，并分解为 training evaluation 与 evolution 两部分 → ECDYSIS (w/o FDCR) 在 τ²-Retail 和 τ²-Airline 上分别实现 1.42× 和 3.23× 的训练加速，API cost 降低 70.71% 和 66.53%。ECDYSIS (w/ FDCR) 加速为 1.30× 和 1.84×，API cost 降低 32.07% 和 59.12%。效率提升主要来自 failure aggregation 减少重复 coding-agent 调用；FDCR 作为 accuracy-oriented 模块以额外 evolution-time 成本换取更高质量的 harness 修改。Input cache hit rate 从 SE 的 ~89% 提升至 ECDYSIS 的 93-96%，进一步降低 API 开销。\n\n**Claim 3：ECDYSIS 提升跨模型泛化** → 仅用 Qwen3-8B 进行 harness evolution，冻结后直接迁移至其他四个模型评估，不做进一步 evolution → 在 τ²-Airline 上，Qwen3-32B 的 accuracy 从 SE 的 51.67% 提升至 ECDYSIS 的 68.33%；在 AgentBench 上，Llama-3.1-8B 从 SE 的 68.33% 提升至 ECDYSIS 的 90.00%。这表明 ECDYSIS 训练的 harness 捕获了底层 runtime constraint 而非 model-specific idiosyncrasy，实现了跨模型迁移。Manual analysis 量化了 SE 的 model-accommodation ratio t = 60.0% 而 ECDYSIS 为 45.5%，解释了泛化提升的机制：减少 model-specific over-adaptation 保留了更通用的 valid action space。\n\n**Claim 4：ECDYSIS 降低推理时 token 消耗** → 在 held-out 评估中记录 task model 的 input/output token 总量和 per-trajectory runtime → ECDYSIS (w/ FDCR) 的平均 final evaluation tokens 为 10.16M，相对 SE 的 11.57M 降低 12.19%；平均 per-trajectory runtime 从 126.08s 降至 118.69s。最大增益出现在 Qwen3-14B × τ²-Airline，runtime 从 197.61s 降至 57.16s（3.46× 加速）。这表明 evolution 阶段获得的效率在推理时持续存在，无需 test-time modification。\n\n此外，论文还验证了**数据效率**（§8.2）：使用 failure-aware 策略选取 1/4 训练数据（5 个 training failures），ECDYSIS (Reduced) 在 τ²-Retail × Qwen3-32B 上达到 71.67% accuracy，接近全量训练的 75.00%，而随机选取仅为 65.00%，训练成本从 $5.763 降至 $0.291。这表明优先选择暴露 novel execution paths 和 harness deficiencies 的任务，可以在大幅降低训练开销的同时保持可比性能。", "additional_insights": "## § 8 Take-aways\n\nECDYSIS 的核心洞察是：并非所有执行失败都指向 harness 缺陷——某些失败反映的是当前 task model 的行为特征，直接针对个别失败修改 harness 会导致 model-specific accommodation，损害跨模型泛化能力。论文提出用 cross-task recurring failure patterns 作为 inductive bias 来区分 systematic harness deficiency 与 model-specific limitation，即如果同一失败模式在多个独立任务实例中反复出现，则更可能是 harness 层面的系统性问题而非模型的偶然行为。在方法上，ECDYSIS 采用 batch-level failure aggregation，将一个 evolution round 内所有失败证据联合分析，而非逐个失败独立调用 coding agent，从而将每轮的 coding-agent 调用次数从 $n_i$ 次降至 1 次，这是训练效率提升的主要来源。FDCR 模块引入 Analyst、Critic、Engineer 三个角色通过共享 transcript 迭代精炼修改方案，再由 Moderator 综合产出结构化 modification specification，将失败诊断与代码实现解耦，这是准确率提升的主要来源但以额外训练成本为代价。实验表明 ECDYSIS (w/ FDCR) 相比 Self-Evolution 在平均准确率上提升 18.56%，训练时间加速最高 1.84×，推理 token 消耗降低 12.19%，且用 Qwen3-8B 训练出的 harness 可直接迁移到 Qwen3-32B、MiniMax-M2.7 等未参与训练的模型上。论文引入 model-accommodation ratio $t$ 来量化过度适应现象，手动分析发现 SE 的 $t=60.0\\%$ 而 ECDYSIS 的 $t=45.5\\%$，降低 14.5 个百分点，为跨模型泛化改善提供了机制性解释。在数据效率方面，基于 failure-aware 的训练数据选择策略，仅使用完整训练集 1/4 的数据即可达到与全量训练相当的性能，而随机选择同样数量的样本则表现明显劣化。\n\n## § 9 最脆弱的假设\n\nECDYSIS 最关键也最脆弱的假设是：**cross-task recurring failure patterns 是 systematic harness deficiency 的可靠证据，而非 model-specific limitation 的跨任务表现**。整个框架的合法性建立在这一 inductive bias 之上——如果跨任务复现的失败实际上源于模型的系统性行为倾向（例如模型在处理某类指令格式时一致性地产生相同误解），那么 ECDYSIS 所做的\"harness-level repair\"本质上仍然是 model-specific accommodation，只是被跨任务复现的假象掩盖了。这种情形在实际中完全可能发生：一个 LLM 如果在 state tracking 或 entity resolution 上存在系统性弱点，这种弱点会在多个任务上以相似模式显现，看起来像 harness 缺陷但实际是模型能力边界。论文自己也承认 cross-task recurrence 被用作 inductive bias \"rather than as proof of causal attribution\"，但并未提供独立验证来确认所识别的 recurring patterns 确实属于 harness 层面。论文提供的间接证据有两类：一是跨模型泛化结果（用 Qwen3-8B 训练的 harness 在 Qwen3-32B 上也有效），二是手动标注的 model-accommodation ratio 从 60% 降至 45.5%。但前者可能被替代解释覆盖——不同 Qwen3 模型共享训练数据和架构，行为相似性高，跨模型迁移成功未必证明修改是 harness-level 的；后者的 $t$ 值由人工细粒度分析得出，存在主观判断偏差且未报告标注一致性。如果这一假设不成立，ECDYSIS 的核心贡献——\"区分 model-specific accommodation 与 harness-level repair\"——将退化为一种更高效的 batch-level 修改策略，而非真正在概念层面解决了 failure attribution 问题。\n\n## § 10 最小复现实验\n\n在一周时间内，最值得验证的是 ECDYSIS 的核心 inductive bias 本身：**跨任务复现的失败是否比孤立失败更可能指向可跨模型迁移的 harness 修改**。具体方案如下：使用 $\\tau^2$-Bench 的 Retail 子集，取一个已有的 base harness（如论文中提到的 Life-Harness 或一个简单的 ReAct-style harness），用 Qwen3-8B 作为 task model 在 20 个训练任务上执行，收集所有失败 trajectory。将失败按 failure pattern 分组，标记出在至少 2 个不同任务中复现的 failure group（recurring）和仅出现在单一任务中的 failure（isolated）。然后手动构造两个 harness 变体：H-recurring 仅修复 recurring failure 对应的 harness 问题（如 state synchronization、entity resolution），H-isolated 仅修复 isolated failure 对应的问题。将 base harness、H-recurring、H-isolated 三个版本在 $\\tau^2$-Bench Retail 的 20 个 held-out 任务上分别用 Qwen3-32B 执行，每个任务 3 次独立 trial，测量 average accuracy、Pass@3 和 Pass^3。如果 ECDYSIS 的核心假设成立，则 H-recurring 在 Qwen3-32B 上的准确率应显著高于 H-isolated，因为 recurring failure 对应的修改应当是 harness-level 的、可跨模型迁移的；如果两者表现相当或 H-isolated 反而更好，则说明跨任务复现并非 harness deficiency 的可靠信号，ECDYSIS 的 inductive bias 不成立。这个实验不需要实现 FDCR 或完整的 evolution pipeline，只需一次 base execution、一次手动 failure 分组、两次手动 harness 修改和一次跨模型评估，核心工作量集中在 failure 分析和 harness 编辑上，可在一周内完成。", "research_value": "### § 11 最强反例设计\n\n对 ECDYSIS 最致命的攻击点在于其核心 inductive bias 的失效场景：当 task model 本身存在系统性的认知或格式处理缺陷时，这种缺陷会在多个独立任务上表现出高度一致的 failure patterns。在这种情境下，ECDYSIS 的 cross-task recurring failure 机制将不可避免地把 model-specific 的系统性弱点误判为 systematic harness deficiency。为了验证这一反例，可以设计一个“注入系统性模型偏差”的对照实验。具体而言，选取一个基础能力均衡的 LLM 作为 task model，并通过 system prompt 或轻量级 fine-tuning 注入一种跨任务的系统性行为缺陷，例如强制模型在处理任何包含嵌套 JSON 格式的 tool return 时，一致性地忽略最外层键值。随后，在该被“污染”的模型上运行 ECDYSIS 的 harness evolution pipeline。根据 ECDYSIS 的逻辑，这种在多任务上反复出现的“忽略嵌套 JSON”失败会被判定为 harness 缺陷，从而促使 coding agent 修改 harness 以扁平化所有 tool return 的 JSON 结构。接着，将这一演化后的 harness 应用于一个未受污染的正常 LLM 上。如果反例成立，我们会观察到：为了迁就被污染模型的系统性缺陷而演化出的 harness 扁平化逻辑，不仅增加了正常模型的推理 token 消耗，还会破坏正常模型处理复杂结构化数据的原生能力，导致准确率显著下降。这一结果将直接证明 ECDYSIS 缺乏真正的 causal attribution 能力，其所谓的“区分 model-specific accommodation 与 harness-level repair”仅仅是在统计层面过滤了偶然失败，而无法在逻辑层面抵御模型自身固有的系统性偏差，其跨模型泛化能力的提升只是因为测试模型恰好没有表现出相同的系统性缺陷。\n\n### § 12 Follow-up Research Idea\n\nECDYSIS 的根本局限在于它试图仅通过被动观察 execution trajectories 的统计规律（即 cross-task recurrence）来解决 failure attribution 问题，这在因果推断框架下是严重欠定的。这一局限驱动了一个全新的研究方向：**基于反事实干预的因果归因 harness 演化**。与其猜测某个失败是模型还是 harness 的问题，不如主动实施因果干预：当 agent 执行失败时，引入一个“反事实探针”机制。借鉴因果推断中的 do-calculus 和 process supervision 思想，当观察到特定失败时，系统自动生成一个“理想化”的中间状态或正确的 model action，并将其作为 counterfactual trajectory 强制注入当前的 harness 执行流中。如果注入正确动作后，harness 依然无法完成任务并产生相同或新的错误，则通过反证法确凿地判定为 systematic harness deficiency；反之，若注入后任务成功，则证明失败源于 task model 的 capability gap。这一框架将 harness evolution 从“基于模式匹配的批量修改”转变为“基于假设检验的因果修复”。第一个实验将构建一个 Counterfactual Fault Isolation (CFI) 模块：在 $\\tau^2$-Bench 的 Retail 子集上，对 base harness 执行并收集失败轨迹。对于每个失败，利用一个强大的 oracle LLM 生成正确的下一步 action 并 do-inject 到 harness 上下文中。比较 CFI 与 ECDYSIS 的 failure attribution 准确率：手动构建一个包含 100 个失败案例的 ground-truth 标注集（标明每个失败的真实归因），测量两种方法在区分 model-specific 与 harness-level 缺陷上的 F1-score。预期 CFI 将在 F1-score 上大幅超越 ECDYSIS，并彻底消除因模型系统性偏差导致的误判，从而在真正意义上实现具备因果解释力的 runtime harness 自动演化。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Ruiqing Yue\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Yu Cui\", \"affiliations\": [3], \"markers\": [\"*\"]},\n    {\"name\": \"Zhuoyu Sun\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Sicheng Pan\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Xianhong Xue\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Tingyu Li\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Ting Li\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Wenzhuo Zhu\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Yi Chen\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Yifei Liu\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Baohan Huang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Zhe Cui\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Haibin Zhang\", \"affiliations\": [5, 6], \"markers\": []},\n    {\"name\": \"Cong Zuo\", \"affiliations\": [3], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Chengdu Institute of Computer Applications, CAS\"},\n    {\"id\": 2, \"name\": \"University of Chinese Academy of Sciences\"},\n    {\"id\": 3, \"name\": \"Beijing Institute of Technology\"},\n    {\"id\": 4, \"name\": \"Beijing University of Technology\"},\n    {\"id\": 5, \"name\": \"Yangtze Delta Region Institute of Tsinghua University, Zhejiang\"},\n    {\"id\": 6, \"name\": \"Jiaxing Key Laboratory of Artificial Intelligence and Cyber Resilience\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Yu Cui proposed the algorithm, and Ruiqing Yue validated its effectiveness through experiments.\"}\n  ]\n}\n```", "summary_translation": "自我进化的 runtime harnesses 能够大幅提升 large language model (LLM) agents 的能力，并为优化 agent 执行提供了一种极具前景的范式。现有的 harness evolution methods 通常依赖 iterative search，根据来自 task instances 的执行反馈反复评估和修改 candidate harnesses。尽管这种范式能够实现持续的 harness optimization，但由于重复的 agent executions 和代码修改，它会产生大量的时间开销，并且可能对已观察到的任务和特定的 failure patterns 产生过拟合，导致对 unseen tasks 的泛化能力下降。我们发现缺乏 principled failure diagnosis 是 harness evolution 中的一个关键瓶颈：观察到的失败可能反映 model-specific deficiencies 或 systematic harness deficiencies，而直接针对个别失败进行优化会导致不必要的 model-specific accommodation。因此，我们提出了 Ecdysis，这是一个高效且有效的框架，它通过识别重复出现的 cross-task failure patterns，将 model-specific accommodation 与 harness-level repair 区分开来，并使适应偏向于 systematic harness deficiencies。Ecdysis 采用 batch-level cross-instance failure aggregation paradigm 来联合分析来自多个 task instances 的失败证据，并进一步引入 Failure-Driven Collaborative Refinement 来诊断失败原因并迭代地细化 harness modification specifications。通过将 cross-instance failure analysis 与 multi-role diagnosis 相结合，Ecdysis 能够以更低的训练时间实现更有效的 harness evolution。实验表明，与现有的 harness evolution methods 相比，Ecdysis 在 harness training 中实现了高达 1.84x 的加速，同时将所得 harnesses 的 reasoning accuracy 提升了 18.56%。"}]}, {"name": "Domain-Specific Autonomous Agents", "count": 3, "papers": [{"title": "Auto-RecSys: Harnessing Autonomous Research Agents for Industry-Scale Recommender System", "arxiv_id": "2609.10922", "authors": "Ming Li, Dai Li, Xuying Ning, Bo Sun, Rui Li, Yi Zhang, Silvia Gong, Xuan Cao, Rui Li, Cornelia Carapcea, Qunshu Zhang, Zhigang Wang, Yinglong Xia, Andy Wang", "summary": "Auto-research agents have shown the potential to automate hypothesis generation, experiment execution, and iterative refinement. However, scaling this paradigm to industry-scale recommendation models introduces two challenges: (1) long feedback loops, where model training can take days, making serial iteration prohibitively slow and requiring parallel exploration across multiple research directions; and (2) system complexity, where large configurations, fragile infrastructure dependencies, and multi-day GPU jobs require robust and recoverable execution. We present Auto-RecSys, an autonomous research system for long-horizon experimentation on industry-scale recommendation models. Auto-RecSys addresses these challenges through three harness designs: (1) distributed asynchronous execution for running multiple experiments in parallel across servers, (2) centralized cross-server memory for persistent and recoverable execution across sessions and failures, and (3) cognitive-procedural separation, where natural-language skill files guide LLM reasoning while deterministic scripts enforce operational correctness. Auto-RecSys further employs a dual-loop self-evolving architecture: an Execution Evolution Loop in which model-specific playbooks accumulate operational knowledge by recording failed attempts and crystallizing successful pipelines, and an Idea Evolution Loop in which experimental outcomes inform subsequent ideation. Evaluated on recommendation models, Auto-RecSys significantly reduces the human time required per experiment cycle and improves execution reliability as its playbooks mature.", "category": "cs.CL", "cluster": "Domain-Specific Autonomous Agents", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving, Agent capability/behavior, Autonomous Research Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-57 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了 Auto-RecSys，一个用于长期实验的自主研究智能体系统。虽然其应用场景是工业级推荐系统，但论文的本质是探讨 LLM 智能体的构建与自我演化机制。摘要中明确提出了三个关键的 harness 设计（分布式异步执行、跨服务器集中式记忆、认知与程序分离）以及一个双循环自我演化架构（执行演化循环和想法演化循环）。这些核心机制直接对应了你的研究焦点中的“单智能体（记忆、工具使用）”、“自我演化（通过经验、反思或环境反馈进行自我完善和迭代）”以及“Agent Harness / Continual Harness 的自动改进”。根据筛选标准第一步中的“保留”规则，如果论文在特定领域中提出了新的 agent 机制（如 continual adaptation、harness 改进），则不应排除；且第四步也明确指出，核心是把“自我演化”机制应用在特定领域应予保留。因此，该论文完全符合你的研究范围。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的核心研究问题是：如何将基于 LLM 的 autonomous research agents 范式扩展至 industry-scale recommender systems 的长周期实验自动化中。在工业界推荐模型场景下，单次模型训练往往需要耗费数天的 GPU 时间，且涉及庞大的配置栈、复杂的分布式基础设施依赖以及脆弱的多日作业运行环境。这使得研究人员将大量精力消耗在管理实验执行、故障恢复和基础设施调试上，而非新想法的探索。解决这一问题具有极高的工程与业务价值，因为它能将研究人员从繁琐的运维任务中解放出来，使其能够同时管理一个由多个并行实验组成的 distributed experiment portfolio，从而在多日训练周期的硬性限制下成倍提升研究吞吐量。Auto-RecSys 系统通过实现可靠的并行探索、跨会话与跨服务器的持久化恢复，以及操作知识的持续积累，显著降低了每个实验周期所需的人工带宽，使自主研究在基础设施密集型的工业级模型开发中成为现实。\n\n### § 2 前人工作与不足\n在此研究之前，autonomous research systems 领域已有诸如 AI Scientist、AutoResearch、FARS 和 EvoScientist 等代表性工作。这些系统已经证明 LLM-powered agents 能够协调从假设生成、代码实现到经验评估的完整研究工作流。然而，它们主要针对 small-scale、self-contained 的学术或轻量级问题，其反馈循环通常在几分钟到几小时内完成。这些前人工作之所以无法直接应用于 industry-scale recommendation models，是因为其底层架构建立在一个失效的核心假设上：即实验环境是自包含的，且迭代可以快速串行完成。\n\n具体而言，前人工作存在两大关键不足。首先是迭代策略的限制：面对需要数天训练时间的 industry-scale 模型，前人系统依赖的 rapid serial iteration 变得不可行，严重限制了研究吞吐量；它们缺乏在分布式资源上并行探索多个研究方向并异步整合结果的系统能力。其次是系统鲁棒性与状态管理的缺失：工业级模型涉及数千行配置和复杂的基础设施依赖，作业常因 preemption、checkpoint corruption 或兼容性问题而失败。前人系统通常在单次连续会话中运行，失败后仅需 local reruns，而缺乏跨会话、跨服务器的 persistent recovery 机制。更重要的是，前人工作未能将操作知识结构化沉淀，导致昂贵的计算错误在后续实验中被反复触发。这些不足并非简单的功能遗漏，而是因为前人系统的设计空间被其面向的短周期、低复杂度任务所界定，未能触及工业级长周期实验对分布式异步执行和持久化知识积累的硬性需求。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Auto-RecSys 之前，autonomous research agents 的成功几乎完全局限于小规模、自包含的学术任务。像 AI Scientist、AutoResearch、FARS 这类系统之所以能跑通，是因为它们依赖的反馈回路极短：一个 idea 从提出、实现、验证到分析，往往只需要几分钟到几小时。在这种 regime 下，agent 可以做 serial iteration——失败了就立刻重来，整个生命周期在一个连续的 session 内完成。但作者面对的是 Meta 级别的 recommendation models，这里的现实完全不同：一次 training run 可能要跑好几天，配置栈涉及数千行代码，依赖分布式 GPU 集群、特定的 package layer 版本、warm-start checkpoint，而且 job 随时可能被 preempt。如果仍然让 agent 串行迭代，research throughput 会低到不可用；如果让 agent 在单个 session 里从头跑到尾，session 几乎必然在中途崩溃。\n\n作者首先意识到的是 throughput 问题。长 feedback loop 意味着必须 parallel exploration——多个 idea 同时在不同服务器上处于生命周期的不同阶段。但并行立刻带来一个工程难题：state 怎么管？如果所有 idea 共享一个 mutable state，一个失败会污染所有实验；如果每个 session 各自为政，server 重启后上下文就丢了。作者从分布式系统和数据库的设计中借用了思路：per-idea state isolation + centralized memory store。每个 idea 有自己的 JSON state file，全局 registry 追踪谁在做什么，所有状态写入共享存储，任何 server 上的新 session 都能通过 trajectory log 重建上下文。这解决了跨 session、跨 server 的 recoverability 问题。\n\n但 recoverability 只是底线，真正的瓶颈是 operational knowledge。作者很可能从自身经验出发观察到：一个 researcher 刚接手一个新 model 时，要花好几周才知道配置文件在哪、validation 命令长什么样、哪代 GPU 稳定、哪个 package 版本兼容、checkpoint 从哪取。这些知识不是研究本身，但缺了它就什么都跑不动。更关键的是，这些知识在每次失败后才会积累，而每次失败的代价是几天的 GPU 时间。如果 agent 每次都从零开始踩同样的坑，系统永远不会变得高效。\n\n这里作者触及了一个更深的 insight。他们注意到 LLM agent 有一个特性：它消费 procedural knowledge 的方式跟它推理的方式一致——即 natural language。一个写好的 markdown 指令，比如\"这个 GPU generation 会导致 recurring hardware failure，用另一个\"，agent 读了就能直接执行；而一个数值 confidence score 反而需要额外的解释层。这个观察跟 SkillOpt 和 Meta-Harness 的发现一致：text-space skill optimization 对 frozen agent 是有效的。于是作者想到：为什么不把每次实验的失败原因和修复方法以 natural language 的形式沉淀下来，形成一个 per-model 的 playbook？dead end 写成\"DO NOT\"指令，成功流程写成 numbered procedure，submission config 写成固定参数。每次 iteration 结束后，从 session trajectory 中蒸馏知识更新 playbook；下次 session 开始时 agent 先读 playbook，就能绕过所有已知的坑。\n\n剩下的问题是 scale across models。每个新 model 都从零 bootstrap playbook 太慢。作者发现 playbook 的结构是 model-agnostic 的——\"哪些是关键文件、validation 命令是什么、submission recipe、dead ends\"这些 category 对任何 model 都适用，只是具体内容不同。于是 one-shot transfer 的 idea 自然浮现：第一个 model 的成熟 playbook 当模板，新 model 只需在 interactive session 中填充 slot。\n\n最后，作者把执行层面的进化和研究层面的进化耦合起来。Execution Evolution Loop 让 playbook 越来越可靠，Idea Evolution Loop 让实验历史指导下一轮 ideation——哪些方向已经试过、哪些 partial success 可以组合、哪些 category 应该 prune。两个 loop 共同驱动系统在\"怎么执行\"和\"探索什么\"两个维度上持续改进。\n\n### § 4 核心 Intuition\n\n在 industry-scale recommendation models 的场景下，autonomous research 失效的根本原因不是 agent 不够聪明，而是实验周期太长、基础设施太复杂，导致 agent 无法在单个 session 内串行完成完整循环，且每次失败都浪费数天的 GPU 时间。Auto-RecSys 的核心 intuition 是：把 operational knowledge 以 natural language 的形式持久化为 per-model playbook，让 agent 在每次 session 开始时就读到\"哪些坑不要踩、哪些命令一定能跑通\"，从而把一个需要数周人类经验才能积累的执行能力压缩为几次 iteration 内的 text-space skill evolution。这个设计之所以奏效，是因为 LLM agent 天然擅长消费 natural language 指令——dead end 写成\"DO NOT\"、成功流程写成步骤列表，agent 读了就能直接执行，无需额外的解释或转换层。配合 per-idea state isolation 和 centralized memory，系统得以在多服务器上并行跑多个多日实验，在任何节点崩溃后都能从 playbook 和 trajectory log 无缝恢复，最终让 execution reliability 随 playbook 成熟而单调提升。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+-------------------+       +-------------------------+\n| Idea Generation   |\u003C------| Idea Evolution Loop     |\n+-------------------+       | (Outcomes -\u003E Proposals) |\n          |                 +-------------------------+\n          v\n+-------------------+       +-------------------------+\n| Distributed       |\u003C=====\u003E| Centralized Cross-      |\n| Async Execution   |       | Server Memory           |\n| (State Machine)   |       | (State, Trajectories)   |\n+-------------------+       +-------------------------+\n          |\n          v\n+-------------------+       +-------------------------+\n| Cognitive-        |       | Execution Evolution     |\n| Procedural Sep.   |------\u003E| Loop                    |\n| (Skills + Scripts)|       | (Trajectory -\u003E Playbook)|\n+-------------------+       +-------------------------+\n          |\n          v\n+-------------------+\n| Train/Validate/   |\n| Monitor/Recover   |\n+-------------------+\n```\n\n**节点解释：**\n\n1. **Idea Generation**：系统起点，负责生成实验想法。该阶段受 Idea Evolution Loop 反馈驱动，将先前的实验结果整合进新的提案中。\n2. **Distributed Async Execution**：利用 persistent state machine 独立追踪每个实验，允许在分布式服务器上并行执行多个实验，不依赖单一连续 session。\n3. **Centralized Cross-Server Memory**：作为共享存储层，保存实验状态、执行历史和 session trajectories。当 session 终止或服务器重启时，新 session 可重建上下文并恢复执行。\n4. **Cognitive-Procedural Separation**：LLM 使用自然语言 skill files 进行推理、规划和诊断；确定性 scripts 负责执行状态转换、API 交互和文件操作，确保操作正确性。\n5. **Train/Validate/Monitor/Recover**：执行实际的模型训练、验证、监控与故障恢复，产生实验轨迹。\n6. **Execution Evolution Loop**：将实验轨迹提炼为 model-specific playbooks，记录验证过的命令、硬件需求、常见失败和成功 pipeline 配置，使执行随时间推移愈发可靠。\n7. **Idea Evolution Loop**：记录实验结果与科学发现，将其作为输入反馈给 Idea Generation 节点，形成闭环。\n\n### § 7 实验设计与结论\n\n**提出问题**：Auto-RecSys 能否在 industry-scale recommendation models 的长周期实验中，有效减少每个实验周期所需的人工时间，并提升执行可靠性？\n\n**实验验证**：当前文本缺乏具体的实验设置细节（如具体的数据集、对比基线系统或量化指标数值）。但从摘要和引言可知，作者将 Auto-RecSys 应用于 recommendation models 上进行评估，重点观察人工时间消耗和 playbook 成熟度对执行可靠性的影响。\n\n**结论**：根据摘要和引言推断，Auto-RecSys 显著减少了每个实验周期所需的人工时间，并且随着 model-specific playbooks 的不断积累与成熟，系统的执行可靠性得到了明显提升，证明了该架构在工业级长周期实验中的有效性。", "additional_insights": "### § 8 Take-aways\nAuto-RecSys 通过引入分布式异步执行和集中式跨服务器记忆，解决了工业级推荐模型长反馈循环和系统复杂性导致的自动化研究瓶颈，使多实验能跨服务器并行推进并在崩溃后无缝恢复。系统采用认知-程序分离架构，利用自然语言 skill files 指导 LLM 推理，同时用确定性脚本执行状态转换和 API 调用，兼顾了推理的灵活性与状态管理的精确性。其 Execution Evolution Loop 将操作知识提炼为模型特定的 playbooks，记录 dead ends 与成功 pipeline，使系统具备跨 session 的自愈能力并显著降低操作失败率。Idea Evolution Loop 通过持久化实验历史指导后续的并行 idea 生成与筛选，避免了冗余探索并适应了 baseline 的动态变化。实验表明，随着 playbooks 的成熟，系统的 major fix steps 从 4.0 降至 0.5 次/迭代，将研究者的角色从单线执行转变为管理分布式实验组合，极大提升了人工带宽的利用效率。\n\n### § 9 最脆弱的假设\n该系统最核心且失败代价最大的假设是：**LLM agents 能够有效且可靠地将自然语言形式的 procedural knowledge（如 playbooks 中的 dead ends 和 pipeline recipes）内化，并直接用于指导后续复杂操作，而无需形式化的数值验证或严格的逻辑约束。** 这一假设是 Execution Evolution Loop 能够不断进化并减少人工干预的基石。在实际工业场景中，该假设极易不成立：随着底层代码库、基础设施和 baseline 的频繁变动，自然语言记录的 dead ends 或 pipeline recipes 会迅速过时甚至产生冲突；如果 LLM 盲目遵循过时的自然语言指令（例如“总是使用特定版本的 package layer”），可能会引发比从零开始探索更严重的系统性错误。此外，随着 playbook 规模的不断扩大，LLM 的 context window 限制和注意力分散可能导致其忽略关键指令。论文虽然通过 31 个 session transcripts 的统计证明了 major fix steps 的下降，并在 Section 7.2 观察到 agent 确实倾向于消费自然语言指令，但缺少对 playbook 规模膨胀后的性能衰减评估。更致命的是，论文在 Section 9 中承认目前缺少正式的 validation gate 来验证 playbook 更新，这意味着该假设在长期运行和大规模复杂场景下的鲁棒性仍未被严格证明，一旦自然语言指令失效，整个自演化机制将直接崩溃。\n\n### § 10 最小复现实验\n如果仅有 1 周时间，最小复现实验应聚焦于验证“自然语言 procedural memory（playbook）能够有效降低 LLM agent 在长周期任务中的操作失败率”这一核心 claim。实验无需复现完整的分布式推荐系统，而是构建一个包含多个易错步骤的模拟 ML 训练 pipeline 环境（例如：包含特定的依赖版本要求、易错的数据预处理脚本、需要特定 tag 的远程提交命令）。使用一个开源 LLM（如 GPT-4o 或 Claude 3.5）构建一个简化的 agent harness，使其在这个模拟环境中连续执行 10 次实验迭代，每次迭代需完成代码修改、本地验证、远程提交和结果分析，记录每次迭代的 major fix steps（即用于恢复操作失败的步骤数）。在前 10 次迭代中，不提供任何 playbook，让 agent 裸跑并记录所有遇到的错误及修复过程。随后，将这些错误及修复方案手动提炼为一个纯自然语言的 playbook（包含 \"DO NOT\" 指令和 pipeline recipes），并在第 11 到 20 次迭代中让 agent 在 session 开始时读取该 playbook。测量指标为前后两个阶段的平均 major fix steps per iteration 和 zero-fix rate。如果后 10 次迭代的平均 fix steps 显著下降（例如从 3-4 次降至 1 次以下）且 zero-fix rate 明显上升，则支持论文的 claim；如果 fix steps 未下降，或者 agent 因遵循过时的自然语言指令而引入了新的系统性错误，则直接反驳了该 claim。", "research_value": "### § 11 最强反例设计\n要对该论文构成最致命的打击，我会设计一个**“环境漂移下的知识反噬”**实验，用以证明其核心的 Execution Evolution Loop 在长期动态场景下不仅无效，反而会引发比从零开始更严重的系统性失败。该反例直接挑战论文最脆弱的假设：即自然语言 procedural knowledge 能够持续有效指导后续操作。具体实验设计如下：在 Auto-RecSys 的运行环境中引入受控的底层基础设施漂移，例如在系统积累了一定规模的 playbook 后，静默更新某个核心依赖库的 API 签名，或修改分布式集群的 preemption 与 checkpoint 机制。此时，playbook 中记录的诸如“遇到 OOM 即降低 batch size 并使用特定版本的 parameter server”等自然语言 dead ends 和 pipeline recipes 将变为过时甚至有害的指令。实验将测量 agent 在面对这种环境漂移时的恢复时间与失败率。我预测会出现一种“知识反噬”现象：由于缺乏 formal validation gate，LLM agent 会盲目遵循 playbook 中的过时指令进行“自愈”，导致其在错误的方向上反复尝试，其恢复时间将显著长于一个没有任何历史记忆的 baseline agent。这一结果将提供强有力的替代解释：论文中观察到的 major fix steps 从 4.0 降至 0.5，并非因为系统真正学会了如何处理复杂操作，而是因为在有限的测试周期内，环境保持静态且 agent 穷尽了有限的错误空间；一旦环境发生不可预测的演变，未经形式化验证的自然语言记忆将成为导致系统崩溃的催化剂。\n\n### § 12 Follow-up Research Idea\n基于上述局限，我提出一个非增量的 novel research idea：**将 agent 的 procedural memory 从自然语言 playbook 转化为通过执行轨迹合成的 formal automata，构建 Neuro-Symbolic Execution Guardrails**。该想法的驱动局限在于，纯自然语言记忆在环境漂移下极易语义失效且缺乏逻辑约束，而 LLM 本身无法可靠地验证自身生成的操作知识。为解决这一问题，我们可以借鉴软件工程领域的 Automata Learning 与 Runtime Verification 技术。不再让 LLM 撰写自然语言日志，而是将系统所有的成功与失败执行轨迹输入到一个 automata learning 算法中，推断出一个确定性的 state machine，该状态机能够精确编码“在状态 A 下执行操作 B 必然导致状态 C”的硬性约束。在 agent 运行时，LLM 仅负责生成高层研究意图与代码修改，而每一个底层 API 调用或基础设施操作在执行前都必须经过该 formal state machine 的验证；若操作违反了推断出的状态转移规则，则被直接拦截并强制 LLM 重新规划。第一个实验将构建一个具有动态依赖关系的模拟 ML pipeline，对比纯自然语言 playbook agent 与 Neuro-Symbolic agent 在面对底层 API 突然变更时的 zero-shot 恢复能力。这一提议与已有工作的根本区别在于：它彻底剥离了 LLM 在操作执行与状态管理上的自由度，将“操作知识”从模糊的文本语义升维为数学上可验证的符号约束，从根本上解决了环境漂移导致的记忆失效问题。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Ming Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Dai Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xuying Ning\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Bo Sun\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Rui Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yi Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Silvia Gong\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xuan Cao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Rui Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Cornelia Carapcea\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Qunshu Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhigang Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yinglong Xia\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xue Feng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Andy Wang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Meta\"},\n    {\"id\": 2, \"name\": \"UIUC\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"\", \"text\": \"Correspondence: Andy Wang at xiaolongw@meta.com; Ming Li at liming@meta.com\"}\n  ]\n}\n```", "summary_translation": "Auto-research agents 已经展现出自动化 hypothesis generation、experiment execution 和 iterative refinement 的潜力。然而，将这一范式扩展到 industry-scale recommendation models 引入了两个挑战：（1）long feedback loops，其中模型训练可能需要数天时间，使得 serial iteration 极其缓慢，并需要跨多个研究方向进行 parallel exploration；以及（2）system complexity，其中庞大的 configurations、脆弱的 infrastructure dependencies 和持续数日的 GPU jobs 需要 robust and recoverable execution。我们提出了 Auto-RecSys，这是一个用于在 industry-scale recommendation models 上进行 long-horizon experimentation 的自主研究系统。Auto-RecSys 通过三种 harness designs 应对这些挑战：（1）用于跨服务器并行运行多个实验的 distributed asynchronous execution，（2）用于在 sessions 和 failures 之间实现 persistent and recoverable execution 的 centralized cross-server memory，以及（3）cognitive-procedural separation，其中 natural-language skill files 指导 LLM 推理，而 deterministic scripts 强制执行 operational correctness。Auto-RecSys 进一步采用了一种 dual-loop self-evolving architecture：一个 Execution Evolution Loop，其中 model-specific playbooks 通过记录失败的尝试和 crystallizing successful pipelines 来积累操作知识；以及一个 Idea Evolution Loop，其中实验结果为后续的 ideation 提供信息。在 recommendation models 上进行评估时，Auto-RecSys 显著减少了每个实验周期所需的人工时间，并随着其 playbooks 的成熟提高了 execution reliability。"}, {"title": "MAPLE: Memory-Augmented Planning with Language and Evolution", "arxiv_id": "2609.11636", "authors": "Kesheng Chen, Yamin Hu, Wenjian Luo", "summary": "Domain practitioners understand their business constraints but may lack operations-research expertise or dedicated support. LLM-based optimization agents translate natural-language requirements into models or solver programs that established optimization tools can execute. This progress makes optimization more accessible, but real-world operations are dynamic: changing demand, resources, and priorities require updates to data, constraints, and objectives. Methods centered on isolated requests offer limited support for rapid adaptation that preserves earlier decisions and reuses useful search results. We introduce MAPLE (Memory-Augmented Planning with Language and Evolution), an agent for maintaining optimization problems through successive natural-language requests. MAPLE combines language-based problem construction with mathematical programming and evolutionary search. It retains the optimization program, accepted plans, earlier updates, and candidate solutions for subsequent requests. We introduce NLDO, a benchmark of 15 trajectories and 180 updates spanning selection, scheduling, rostering, routing, and cloud-resource placement. In the main evaluation, MAPLE completes all trajectories and achieves online scalar quality of 0.951 and a Pareto hypervolume ratio of 0.875. Controlled comparisons further show that maintaining executable state improves update validity and can preserve useful search information across substantial revisions.", "category": "cs.AI", "cluster": "Domain-Specific Autonomous Agents", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-54 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一个名为 MAPLE 的 LLM 智能体框架，该框架结合了记忆增强、规划和演化搜索机制，用于处理动态环境下的连续优化问题。论文明确属于“单智能体”和“自我演化”的研究范畴。首先，MAPLE 具备明确的记忆机制，能够保留优化程序、历史计划和候选解，以支持后续请求，这直接对应了核心关注点中的“记忆”能力。其次，它通过维护可执行状态并在重大修订中重用有用的搜索信息，展现了在线适应和迭代改进的能力，符合“自我演化”和“长期决策”的特征。最后，虽然论文的应用场景是运筹优化领域，但其本质是提出了一种新的智能体机制（即如何让智能体在连续的动态请求中保持状态并演化），而不是简单地将现成 LLM 作为工具使用，因此符合“领域是场景，机制才是贡献”的保留原则。论文还提出了一个针对智能体轨迹的基准测试，进一步体现了对智能体能力评估的关注。因此，该论文与您的“LLM智能体及其演化”研究目标高度相关。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是 **live dynamic optimization**：在连续的自然语言请求中维护可执行的优化程序，使其能够适应不断变化的需求、资源和优先级，同时保留先前已接受的决策并复用有用的搜索状态。具体而言，当用户通过自然语言逐步修订一个优化问题——例如更改订单优先级、收紧交货时间窗、替换车辆排放参数、甚至整体替换工作负载——agent 需要定位受影响的代码和数据、解析对先前事件的引用（如\"之前提到的拥堵锚点客户\"）、决定是否复用先前的候选解，并在验证通过后提交更新后的状态。这一问题之所以重要，是因为现实运营环境本质上是动态的：生产计划员、调度员和基础设施运维人员需要不断响应新订单到达、资源不可用和优先级变化，而现有的 LLM-based optimization agents 主要面向单次请求，生成模型或 solver 代码后即丢弃所有上下文。当需求发生变化时，用户不得不从零重新描述整个问题并重新求解，既无法保证先前决策的连续性（例如保留某客户已分配的车辆），也浪费了已有的搜索计算投入。解决这一问题能将优化工具从\"一次性建模器\"转变为可持续维护的决策助手，显著降低领域从业者使用优化方法的门槛和迭代成本。\n\n### § 2 前人工作与不足\n\n这一问题此前未被完整解决，相关研究从不同方向各自覆盖了部分场景但存在关键缺口。在自然语言优化建模方面，**NL4Opt** (Ramamonjison et al., 2023) 将自然语言映射为 linear programs，但仅处理单次静态建模，不涉及后续修订。**OptiMUS** (AhmadiTeshnizi et al., 2024) 和 **OR-LLM-Agent** (Zhang et al., 2025) 生成 formulation 和 solver 代码并利用执行反馈进行修正，**ORLM** (Huang et al., 2025) 训练专用模型进行自动化建模，**OptimAI** (Thind et al., 2025) 采用多角色 agent 进行优化——这些系统都能将自然语言转化为可执行程序，但它们的架构以孤立请求为中心：不保留跨请求的可执行状态（包括优化程序、已接受方案、搜索种群和 Pareto archive），因此每次更新都需要完全重新建模和重新求解。**MIRROR** (Shi et al., 2026) 和 **ORPilot** (Xie, 2026) 进一步引入了问题 elicitation 和业务数据处理能力，但同样不支持在连续修订中维护和复用优化状态。在交互式 agent 方面，**ReAct** (Yao et al., 2023) 保留对话历史，**MemGPT** (Packer et al., 2023) 等记忆系统可检索先前信息，**Flex-TravelPlanner** (Oh et al., 2025) 引入了多轮约束变化——但这些工作处理的是规划推理而非可执行优化程序的维护，不涉及数值搜索状态的迁移和复用。在 dynamic optimization 领域，Branke (2002) 和 Nguyen et al. (2012) 长期研究在变化目标和约束下的 population repair、transfer 和 restart 策略，但这些方法的假设是优化模型本身已固定且变化以数值参数形式给出，而非通过自然语言驱动对程序逻辑、数据表和决策结构的修订。**MOHOLLM** (Schwanke et al., 2026) 使用 LLM surrogate models 进行分层多目标搜索，但不处理可执行问题的语言修订。此外，此前缺乏一个专门评测连续修订场景的 benchmark：现有评测要么衡量单次建模准确率（如 NLP4LP-hard、BWOR20），要么衡量多轮规划中的约束满足，但没有同时评估轨迹连续性（trajectory continuity）和解质量（solution quality）的标准化协议。MAPLE 的贡献正在于将这三个此前割裂的方向——语言驱动的程序构建、历史引用解析、以及动态搜索状态复用——整合进一个统一的可执行状态架构，并通过 NLDO benchmark 填补了评测缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n作者首先观察到 LLM-based optimization agents 的兴起：这些系统能将自然语言转化为 optimization model 或 solver code，降低了领域从业者使用 OR 工具的门槛。但一个直接的矛盾浮现出来——现实运营是动态的，需求、资源和优先级不断变化，而现有 agents 以孤立请求为中心，每次更新都从零开始生成模型，既无法保留先前接受的决策，也无法重用搜索过程中积累的 candidate solutions。这意味着每次小修改都可能丢失有价值的优化状态。\n\n作者进一步审视相关工作，发现两条独立的研究线：multi-turn planning benchmarks 关注约束逐步变化时的计划调整，但不维护 executable optimization state；dynamic optimization 领域长期研究 population repair、transfer 和 restart 策略，但从未与 LLM-based problem construction 结合。两条线之间存在一个未被填补的空白：如何在自然语言驱动的连续修订中，既保持可执行程序的局部一致性，又让数值搜索状态在大幅修订后仍能被合理重用或及时丢弃。\n\n作者由此识别出几个关键失败模式：第一，如果让 LLM 自行生成完整的搜索表示和算子，它经常遗漏隐含约束（如车辆唯一性），导致大量 infeasible outputs；第二，如果完全不保留历史状态，每次更新都 full restart，会浪费先前搜索中已积累的优质候选解；第三，如果盲目重用所有历史候选，在破坏性更新（如替换整个 workload）后，旧解可能严重误导搜索方向。这些观察指向一个核心设计问题：需要一个结构化的机制来管理\"什么应该被保留、什么应该被丢弃、以及如何安全地保留\"。\n\n作者从 dynamic optimization 的经典思路中提取了 population repair 和 restart selection 的概念，但将其嵌入到一个新的架构中：用 Typed Search-Space Scaffolding (TSS) 限制 LLM 只声明决策类型和评估逻辑，而将搜索算子交由固定代码提供，从而消除表示错误；用 Live Problem Decomposition (LPD) 精确定位每次更新影响的代码和数据范围，避免不必要的全量重写；用 Live State Memory (LSM) 将自然语言中的历史引用解析为具体的 binding constraint；最后用一个 semantic restart selector，结合 LLM 的风险评估和固定 gate 的结构化验证，在 Warm（修复并重用部分历史候选）和 Full（完全重新初始化）之间做出选择。这条路径的本质是将 dynamic optimization 的状态管理思想移植到 LLM-driven 的连续优化场景中，同时用 typed scaffolding 解决 LLM 生成代码的可靠性问题。\n\n### § 4 核心 Intuition\n\n先前方法失效的根本原因在于：它们把每个优化请求当作独立任务，丢弃了可执行程序和搜索状态，导致后续更新既无法引用历史决策，也无法重用已积累的候选解。MAPLE 的核心直觉是——将优化过程视为一个持续维护的 executable state，而非一系列孤立的 code generation 任务。通过让 LLM 只负责声明决策类型和评估逻辑（TSS），而由固定代码提供搜索算子和 solver，系统获得了可靠的表示空间；在此基础上，每次自然语言更新只做局部修改，并用一个语义化的 restart selector 判断历史候选是否仍然有用——有用则修复重用，无用则完全重启。这样，小修小改不必浪费先前的搜索投入，而破坏性变更也不会被旧解误导。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+-----------+     +-----+     +-----------+     +-----------+\n| NL Request| --\u003E | TSS | --\u003E | Workbench | --\u003E | Solver/GA |\n+-----------+     +-----+     +-----------+     +-----------+\n                                                           |\n                                                           v\n+-----------+     +-----+     +-----------+     +-----------+\n| NL Update | --\u003E | LPD | --\u003E | Workbench | \u003C-- | Validation|\n+-----------+     +-----+     +-----------+     +-----------+\n                     |             ^                 |\n                     v             |                 |\n                  +-----+          |                 v\n                  | LSM | ---------+             +-----------+\n                  +-----+                      | Accepted  |\n                     |                         | State     |\n                     v                         +-----------+\n              +----------------+                   ^\n              | Restart Selector|                  |\n              +----------------+                  |\n                     |                            |\n                     v                            |\n              +----------------+                  |\n              | Warm/Full Init | -----------------+\n              +----------------+\n```\n\nMAPLE 的完整 Pipeline 围绕持续维护的 **Workbench**（可执行优化程序）展开，分为初始化与动态更新两个阶段：\n\n1. **初始化阶段**：用户输入自然语言请求，系统通过 **Typed Search-Space Scaffolding (TSS)** 让 LLM 仅定义决策变量和评估逻辑，而搜索算子与求解器由固定代码提供。这避免了 LLM 生成错误表示的问题。Workbench 随后调用数学规划求解器或进化算法（GA / NSGA-II）进行求解，生成初始解并通过验证后提交为 **Accepted State**。\n2. **动态更新阶段**：当用户发出新的自然语言更新请求时，**Live Problem Decomposition (LPD)** 精确定位受影响的代码和数据范围，避免全量重写。同时，**Live State Memory (LSM)** 检索历史更新记录和已接受的计划，解析诸如“之前提到的拥堵锚点客户”等历史引用，并在下一次搜索中强制保留先前接受的决策。\n3. **搜索状态重用决策**：对于进化搜索部分，**Restart Selector** 读取变更摘要并评估历史候选解的可用性。结合固定门控的结构化验证，系统在 **Warm repair**（修复并重用部分历史候选解）和 **Full restart**（完全重新初始化种群）之间做出选择，以应对不同程度的破坏性更新。\n4. **验证与提交**：更新后的 Workbench 执行求解，生成的结果必须通过可执行性检查和输出检查。只有验证通过后，新的状态才会被提交，覆盖此前的 Accepted State，供下一次请求使用。\n\n### § 7 实验设计与结论\n\n**提出什么问题**：\nMAPLE 旨在解决 live dynamic optimization 问题，即在连续的自然语言请求中，能否有效维护可执行的优化程序，使其在适应需求变化的同时保留先前决策并复用有用的搜索状态？维护可执行状态是否真的能提高更新有效性并在大幅修订中保留搜索信息？\n\n**用什么实验验证**：\n研究团队引入了 **NLDO** 基准，包含 15 个 trajectories 和 180 个 updates，覆盖 selection, scheduling, rostering, routing 和 cloud-resource placement 等多种优化场景。实验将 MAPLE 与 ReAct, OR-LLM-Agent, ORLM, OptiMUS, OptimAI 及 Persistent ReAct 等基线进行对比。评估指标包括在线标量质量、Pareto 超体积比，以及在静态/动态设置下的成功率。此外，通过对照实验验证状态重用机制的有效性。\n\n**结论是什么**：\n在主评估中，MAPLE 成功完成了所有 trajectories，取得了 0.951 的在线标量质量和 0.875 的 Pareto 超体积比。能力对比表明，MAPLE 是唯一同时具备自然语言输入、Solver 输出、保留 Pareto 集、Live updates 和 Solver state reuse 的系统。对照实验进一步证实，维护可执行状态显著提高了更新有效性，并能在大幅修订中有效保留有用的搜索信息。", "additional_insights": "### § 8 Take-aways\n\nMAPLE 将 \"live dynamic optimization\" 定义为一个新问题设定：在累积的自然语言修订下维护可执行的优化程序，同时保留已接受的决策并复用搜索状态。这一设定区别于单次优化和多轮规划，核心在于状态的可执行性与连续性。\n\nTSS（Typed Search-Space Scaffolding）是系统有效性的基石。它将 LLM 声明的决策类型（assignment、permutation、real 等）绑定到固定的初始化、crossover、mutation 和 repair 算子上，使 LLM 只需编写 `build_problem()` 和 `evaluate()` 两个函数。消融实验表明，移除 TSS 后 feasibility 从 100% 降至 80.6%，routing 场景中 120/120 个结果因遗漏车辆唯一性约束而无效。\n\nRestart selector 的价值集中在 disruptive updates 上。在 t01–t10 的普通更新中，Warm restart（修复历史候选）与 Full restart（完全重新初始化）表现接近；但在 t11–t12 的大规模替换后，MAPLE 选择 Full 并获得 0.696 HV，而 Always Warm 仅 0.636。在 renaming 和 task-addition 控制实验中，Warm 反而优于 Full（最大增益 +0.708），说明复用决策应基于语义判断而非简单的变更比例阈值。\n\nLSM 需要同时保留 update records 和 accepted plans 才能正确解析历史引用。在 18 个 assignment 请求中，仅有 update records 或仅有 accepted plan 各只能解析 6 个直接可答的请求，需要两者结合的 6 个请求在任一单独条件下均失败。\n\nNLDO benchmark 将 trajectory continuity（strict prefix）与 solution quality 分离评估。大多数 baseline（ReAct、OptiMUS、ORLM 等）的失败主因是 output-protocol 检查未通过（如缺少 reasoning field），而非数学不可行。Persistent ReAct 在 strict scoring 下 scalar solve rate 仅 51.3%，但在忽略辅助字段的 mathematical prefix 下升至 85.5%，说明其生成的计划本身可行但输出格式不合规。\n\n### § 9 最脆弱的假设\n\nMAPLE 的核心贡献——\"维护可执行状态以提升 continuity 和 validity\"——建立在一个关键假设上：**LLM 生成的 `evaluate()` 函数能正确编码所有 hard constraints，使系统内部的 feasibility 检查可靠**。TSS 保证了 representation space 的正确性（typed operators 保证候选始终在声明域内），但 constraint checking 完全依赖 LLM 作者编写的评估逻辑。如果 `evaluate()` 遗漏了某个约束检查，系统会将 infeasible 解标记为 feasible 并接受它，此后所有基于该状态的 Warm restart、LSM binding 和 Pareto archive 都会被污染，且 held-out evaluator 只在执行后才能发现问题——此时状态已被 commit。\n\n这一假设在实际中可能不成立的原因是：约束逻辑的完整性要求 LLM 理解问题的全部业务规则并将其正确翻译为代码，而 LLM 在复杂约束上容易遗漏隐含条件。论文提供的证据恰好暴露了这一点：w/o TSS 的 routing 程序遗漏了\"一辆车只能服务一条路线\"的检查（120/120 无效），cloud-placement 程序记录了 GPU 不兼容但未清除 feasibility flag（20/120 无效）。即使有 TSS，论文在 Limitations 中也承认 \"feasibility still depends on the generated evaluation function\"（§A.4）。论文没有提供任何机制来验证 `evaluate()` 是否覆盖了所有约束——smoke test 只检查数据访问和输出结构，不检查约束完整性。这意味着 TSS 降低了 representation 错误，但 evaluation 错误的风险始终存在且无法被系统自身检测。\n\n### § 10 最小复现实验\n\n在一周时间内，可以验证 MAPLE 最核心的 empirical claim：**在 disruptive update 后 Full restart 优于 Warm restart，而在普通更新中 Warm 优于 Full**。这一 claim 不依赖 LLM，可以完全手动实现。\n\n**数据**：使用 NLDO-P010（routing）的公开表格，包含 depot、orders、vehicles、policy 四张表。只需 t00（初始状态）、t10（普通更新前）、t11（disruptive update，替换订单和车辆）三个时间步。\n\n**实现**：手动编写 TSS Workbench 的两个函数——`build_problem()` 声明 assignment segment（订单→车辆）和 permutation segment（访问顺序），`evaluate()` 计算距离、延迟和排放三个目标及容量、班次约束。使用 pymoo 或 DEAP 的 NSGA-II 实现，population 200，最多 200 代。Warm restart 的实现：将 t10 的最终 population 迁移到 t11 的决策域，用 type-specific repair 修复后填充至多一半 population，剩余用 fresh 候选补齐；Full restart 则全部重新初始化。\n\n**测量**：在 t11 和 t12 分别用 Warm 和 Full 各运行 3 个 random seed，计算 HV ratio（需要先独立运行一个 500×500 的 reference search 构建参考 Pareto front）。同时记录平均停止代数。\n\n**预期结果**：若 MAPLE 的 claim 成立，t11–t12 处 Full 的 HV 应显著高于 Warm（论文中差异约 0.05–0.10 HV），且 Full 需要更多代数才能收敛。若两者无显著差异或 Warm 反而更优，则反驳了\"disruptive change 后 fresh initialization 更有利\"这一核心论点，也意味着 restart selector 的语义判断机制并非必要。这个实验剥离了 LLM 的不确定性，纯粹测试 evolutionary search 的 restart 策略效果，是最干净的验证路径。", "research_value": "### § 11 最强反例设计\n\n对 MAPLE 最致命的攻击点在于其“有效性”建立在自我证伪的闭环上：系统内部的 feasibility 检查完全依赖 LLM 生成的 `evaluate()` 函数，而 held-out evaluator 只在状态 commit 后才起作用。我设计的反例实验旨在证明：**MAPLE 所声称的“continuity”和“high validity”实际上是“约束遗漏”与“错误状态污染”的副产品**。具体而言，MAPLE 的高 solve rate 可能并非因为其 state maintenance 机制有效，而是因为 LLM 生成的 `evaluate()` 系统性地比 ground-truth evaluator 更宽松，使得搜索空间被人为放大，从而更容易找到“伪可行解”。\n\n我将构建一个“隐式耦合约束”的动态 trajectory 实验场景。在初始阶段（t00-t05），使用标准的 VRP 问题，MAPLE 能正常工作。在 t06 引入一个高度依赖业务上下文的隐式约束：“由于共享装卸月台，若车辆 A 服务了客户 X，则车辆 B 在同一天内不能服务客户 Y”。这种约束在数据表中没有显式字段标记，完全存在于自然语言描述中。在 t07-t10，继续进行普通的订单量增减。我们将对比 MAPLE 与一个“Oracle Evaluator”基线（即每次更新时强制替换为人工编写的绝对正确的 `evaluate()` 函数，但保留 MAPLE 的 TSS 和 Warm restart 机制）。\n\n我预测实验将暴露两个致命结果：第一，在 t06 之后，MAPLE 的内部 feasibility 检查会通过那些实际上违反了月台冲突约束的候选解，导致 Pareto archive 被大量 infeasible solutions 占据。第二，更严重的是，在 t07-t10 的普通更新中，MAPLE 的 Warm restart 会持续复用这些被污染的历史候选解，导致其报告的 HV ratio 虚高；而“Oracle Evaluator”基线由于严格执行约束，其搜索空间受限，HV ratio 反而可能低于 MAPLE。当最终使用 held-out ground-truth evaluator 进行严格评估时，MAPLE 的 true feasibility 将在 t06 之后断崖式下跌至 0%，且其引以为傲的 Warm restart 策略会加剧错误累积，使得其最终解质量显著低于每次都 Full restart 的基线。这一反例直接挑战了论文的核心论点：当 LLM 无法完美编码复杂业务逻辑时，维护可执行状态不仅无益，反而会将单次错误放大为系统性的状态污染。\n\n### § 12 Follow-up Research Idea\n\nMAPLE 的核心局限在于将 `evaluate()` 的生成视为一次性且绝对可靠的代码编写任务，忽略了自然语言到数学约束映射过程中的模糊性和不可验证性。这一未满足的需求驱动了一个全新的研究方向：**Interactive Constraint Acquisition for Executable Optimization（可执行优化的交互式约束获取）**。我们不应期望 LLM 直接生成完美的 `evaluate()` 函数，而应将约束验证构建为一个动态的、基于主动学习的闭环系统，在搜索过程中持续校准约束边界。\n\n这一想法借鉴了 Constraint Programming（CP）领域的 **Active Constraint Acquisition（如 QuAcq 算法）** 以及 Program Synthesis 中的 **Oracle-Guided Inductive Synthesis（OGIS）**。在 CP 领域，系统通过向用户提出“这个部分赋值是否可行”的二元查询，从候选约束库中收敛出真实的约束集。我们将这种机制与 LLM 的语义理解能力和 Evolutionary Search 的种群分布结合：LLM 不再直接编写最终的 `evaluate()`，而是生成一个“候选约束集”以及一个初始的 `evaluate()`。当 Evolutionary Search 生成 Pareto front 时，系统利用 active learning 挑选出那些处于候选约束边界上的 ambiguous solutions，并要求用户（或一个强大的 held-out LLM simulator）进行自然语言验证（例如：“系统建议车辆 A 服务客户 X 且车辆 B 服务客户 Y，这在实际运营中允许吗？”）。用户的回答将反馈给 LLM，动态修正 `evaluate()` 的代码逻辑，并立即 repair 受影响的 Pareto archive。\n\n第一个实验将设计一个包含深层隐式约束的动态优化轨迹。Baseline 为 MAPLE（静态生成 `evaluate()`），我们的方法为 MAPLE+Active-Acquisition。在每次 disruptive update 后，系统允许向 Oracle 提出 K 次边界查询。评估指标为 True Hypervolume 和 Constraint Convergence Rate。如果该想法有效，我们将看到随着查询次数 K 的增加，系统的 true feasibility 逼近 100%，且由于搜索空间被精准界定（而非盲目放大或过度收紧），其 true HV 将显著超越因约束遗漏而虚高、或因约束过紧而无解的 MAPLE 基线。这一提议将问题从“如何让 LLM 一次性写对代码”转变为“如何让 agent 在搜索过程中通过与环境交互渐进式地学习约束”，彻底改变了 live dynamic optimization 的范式。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Kesheng Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yamin Hu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Wenjian Luo\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Harbin Institute of Technology, Shenzhen\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "领域从业者了解他们的业务约束，但可能缺乏 operations-research 专业知识或专门的支持。基于 LLM 的 optimization agents 将自然语言需求转化为现有的 optimization tools 可以执行的 models 或 solver programs。这一进展使 optimization 更易于使用，但现实世界的运营是动态的：不断变化的需求、资源和优先级需要对 data、constraints 和 objectives 进行更新。以孤立请求为中心的方法对保留早期决策并重用有用搜索结果的快速适应提供的支持有限。我们引入了 MAPLE (Memory-Augmented Planning with Language and Evolution)，这是一种通过连续的自然语言请求来维护 optimization problems 的 agent。MAPLE 将基于语言的问题构建与 mathematical programming 和 evolutionary search 相结合。它保留 optimization program、已接受的 plans、早期更新和 candidate solutions，以供后续请求使用。我们引入了 NLDO，这是一个包含 15 条 trajectories 和 180 次更新的 benchmark，涵盖 selection、scheduling、rostering、routing 和 cloud-resource placement。在主要评估中，MAPLE 完成了所有 trajectories，并达到了 0.951 的 online scalar quality 和 0.875 的 Pareto hypervolume ratio。对照比较进一步表明，维护 executable state 可提高 update validity，并能在重大修改中保留有用的搜索信息。"}, {"title": "Autonomous Chemical Mechanistic Discovery through Agentic Reasoning and Validation", "arxiv_id": "2609.11147", "authors": "Dong Li, Sixuan Mi, Zihao Ye, Huan Xiong, Tao XU, Tong Zhu, Aijia Zhang, Junqi Gao, Kaiyan Zhang, Shijie Wang, Bowen Zhou, Yuqiang Li, Biqing Qi", "summary": "Unraveling reaction mechanisms is central to modern chemistry, yet automating these investigations remains challenging because computational workflows still rely heavily on expert intervention. Here we introduce ARCHE, an autonomous agentic system that integrates a general-purpose reasoning model, a domain-specialized computational chemistry model, and a structured tool registry to transform mechanistic inquiry into a scalable, self-validating process. ARCHE interprets scientific questions, generates and prioritizes mechanistic hypotheses, orchestrates computational workflows, and iteratively refines conclusions based on computed evidence within a closed loop. We validate its capabilities across three increasingly demanding scenarios: reconstructing stereocontrolling transition states and validating the corresponding reaction mechanism in a previously reported asymmetric catalytic reaction; proposing and validating a plausible radical pathway through iterative hypothesis refinement for a recently discovered but unpublished $α$-iodoboronate C-I cleavage reaction; and identifying a chemically interpretable descriptor that governs selectivity in nickel-catalysed migratory cross-coupling reactions. By coupling agentic reasoning with rigorous computational validation, ARCHE advances autonomous mechanistic discovery and establishes a foundation for broader machine-assisted chemical research. The code for ARCHE is publicly available at https://github.com/JetAstra/Arche-Harness.", "category": "cs.AI", "cluster": "Domain-Specific Autonomous Agents", "tags": ["cs.AI"], "filter_reason": "论文的核心贡献是提出了一个名为 ARCHE 的自主智能体系统，该系统集成了通用推理模型、专用计算化学模型和结构化工具注册表。虽然其应用场景是化学机理发现，但其本质是构建了一个具备规划、工具使用和闭环迭代验证能力的 LLM 智能体框架。摘要中明确提到了“iteratively refines conclusions based on computed evidence within a closed loop”（基于计算证据在闭环中迭代地完善结论），这属于智能体的自我反思和迭代改进机制。此外，其代码库名为“Arche-Harness”，表明研究涉及 Agent Harness 的构建。根据筛选标准的第一步和第四步，只要论文在特定领域中提出了新的 agent 机制（如闭环迭代验证、工具编排），就不应作为非演化型应用排除。因此，该论文符合“构建LLM智能体”和“自我演化”的研究焦点，应予保留。", "intro_logic": "### § 1 研究问题与不足\n\n论文提出的核心研究问题是：如何将化学反应机理的阐释从高度依赖计算化学专家直觉和手工操作的过程，转化为一个可自主执行、自我验证的闭环科学发现流程。具体而言，系统需要能够从实验观察出发，自主生成竞争性机理假设，将其转化为可执行的量子化学计算工作流，并根据计算证据迭代修正结论。这个问题之所以重要，是因为 reaction mechanism 的 elucidation 是现代化学从\"观察现象\"迈向\"精确控制过程\"的关键枢纽，直接支撑 rational catalyst design、stereochemical control 和 experimental reactivity 的解释。然而，尽管计算化学软件和自动化工作流已有显著进步，将实验观察转化为稳健的机理洞察仍然是一个 formidable challenge：现有工具能自动化预定义的计算程序并处理错误和重启，但无法实现自主发现所需的闭环过程——即假设生成、计算验证和基于证据的迭代修正。解决这一问题不仅能大幅降低机理研究的专家门槛和劳动成本，还能为更广泛的 machine-assisted chemical research 奠定基础，使 AI 系统在需要专门知识、严格验证和科学可解释结论的领域中贡献真正的科学价值。\n\n### § 2 前人工作与不足\n\n该问题此前未被完整解决。最相关的前人工作可分为两类。第一类是计算化学自动化工具，如 EzMechanism 等系统能够自动提出酶催化反应机理，以及 Steiner 和 Reiher 提出的 human-machine interface 用于自动探索化学反应网络——这些工具可以自动化预定义的计算程序，包括 error handling 和 restart routines，但它们被设计为执行固定协议，而非在开放式机理空间中生成竞争假设、设计判别性计算并迭代修正结论。第二类是近年来基于 LLM 的 agentic 系统，如 Boiko 等人展示的 autonomous chemical research 系统、Bran 等人的 ChemCrow 以及 El Agente 等，这些框架证明了 language-driven agents 能够将明确目标转化为可执行的计算任务循环。然而，这些系统的 domain knowledge 通常通过 prompting、retrieval 或 rule-based modules 注入，使其被限制在执行固定协议而非进行开放式科学推理。具体而言，存在两个关键不足：其一，现有系统围绕预定义工作流或孤立计算阶段组织，面对开放式机理问题时无法主动生成多个竞争假设并迭代精炼——这是因为它们的架构缺乏将科学推理与假设竞争机制相耦合的能力，而非简单的功能遗漏。其二，计算工作流要求对 methods、basis sets、solvation models 和 convergence criteria 进行一致规范，并验证输入输出满足计算要求，但将这些 methodological checks 与 hypothesis generation 和 workflow execution 集成，需要同时具备通用推理能力和领域专精的计算化学知识——此前没有任何系统实现这一集成。这一缺口的存在并非因为问题未被认识到，而是因为 bridging flexible LLM reasoning 与 rigorous quantum-chemical execution 需要一个统一框架，同时解决 domain-specific expertise 的编码、reliable tool orchestration 和 self-validating closed loop 三个相互依赖的工程挑战，这在 prior work 中尚未被系统性地攻克。", "core_insight": "## § 3 重建作者的思考路径\n\n计算化学领域长期存在一个结构性矛盾：DFT计算、transition state搜索、IRC验证等单个计算步骤已经高度标准化，Gaussian等软件可以批量执行，但从\"实验观察\"到\"机制结论\"的整条认知链条却始终无法自动化——因为它要求研究者不断在两个模式之间切换：一是开放式的科学推理（这个反应可能走什么路径？哪些假设值得计算？结果与实验矛盾时该如何修正？），二是严格的技术执行（选什么functional和basis set？Gaussian关键词怎么组合？SCF不收敛该怎么修？）。前者需要化学直觉和创造性假设生成，后者需要对软件细节的精确掌握。任何一个模式出错都会导致整个流程崩溃：推理再好，Gaussian输入写错就跑不出有用结果；计算再精确，假设空间太窄就只是精确地回答了错误的问题。\n\nLLM agent的出现让作者看到了连接这两个模式的机会。2023年起，Coscientist（Boiko et al., Nature 2023）、ChemCrow（Bran et al., 2024）等工作已经证明，语言驱动的agent可以调用化学工具、执行预定义工作流。但作者敏锐地注意到一个关键失败模式：这些系统的领域知识是通过prompting或retrieval注入的，它们能执行固定协议，却无法面对开放式机制问题——当需要主动生成多个竞争假设、设计判别性计算、并根据计算证据迭代修正结论时，它们要么陷入固定流程，要么在计算细节上频繁出错。尤其是Gaussian route generation这类任务，通用模型（如GPT系列）经常提出语法上看似合理但化学上不兼容的方法组合，而错误诊断更是薄弱——把SCF non-convergence误判为几何优化失败是常见错误。\n\n作者由此推断：问题的核心不在于agent能否调用工具，而在于推理层与执行层之间的\"知识断层\"。通用模型缺乏计算化学的procedural knowledge（软件惯例、troubleshooting策略、方法选择的化学一致性约束），而这种知识很难通过prompting有效注入——它需要从教科书、软件文档和专家论坛讨论中系统学习。与此同时，领域专用模型虽然可以编码这些procedural knowledge，但本身不具备开放式科学推理能力。这提示了一个dual-model架构的必要性：让通用模型负责hypothesis exploration和workflow planning，让领域专用模型负责computational rigor的guarding——审查Gaussian设置、解读输出、诊断错误。两者通过结构化的中间表示（hypothesis对象、workflow specification、parsed results）通信，形成一个reasoning-validation的闭环。\n\n但仅有双模型还不够。作者进一步识别出第三个关键gap：从假设到可执行计算之间的翻译需要工具编排能力——分子结构格式转换、计算步骤间的数据依赖管理、失败后的反馈路由。现有系统要么把这一步留给人工，要么用硬编码的pipeline处理固定场景。作者因此引入了结构化的tool registry，将计算化学操作定义为具有明确input-output schema的工具，使planner能够自动组装可执行的多步workflow，并在步骤间插入必要的格式转换。这使得\"假设→计算→证据→修正\"的闭环不仅存在于概念层面，而是真正可执行的。\n\n三个case study的选择也反映了递进的验证逻辑：Case 1（不对称aldol反应）测试reliability——能否从反应级输入自主恢复已发表的transition state模型和selectivity趋势；Case 2（未发表的光化学radical反应）测试discovery——能否在无预设答案的情况下通过迭代假设修正收敛到与实验一致的机制；Case 3（Ni催化migratory cross-coupling）测试abstraction——能否从复杂催化体系中提炼出紧凑、可解释的mechanistic descriptor。这三个场景分别对应reconstruction、convergence和abstraction三种科学推理模式，共同构成了对\"自主机制发现\"能力的系统级验证。\n\n## § 4 核心 Intuition\n\n通用LLM能做开放式科学推理但不懂计算化学的执行细节，领域专用模型懂Gaussian的procedural knowledge但不会自主探索假设空间——把两者通过结构化工具接口tight coupling成一个reasoning-validation闭环，就同时获得了创造性假设生成和计算rigor的保障。关键insight是：计算化学的\"科学判断\"和\"技术执行\"是两种本质上不同的能力，不应该塞进同一个模型，而应该让各自专长的模型在闭环中协作，用结构化中间表示确保两者始终对齐同一个科学目标。先前方法失效是因为它们要么用通用模型硬扛领域细节（导致计算频繁出错），要么用固定pipeline替代推理（导致无法处理开放式问题）；这个方法奏效是因为它让每种能力出现在最需要它的环节。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\nUser Input\n    |\n    v\nRetrieval Agent (GPT-5) -\u003E RAG Context\n    |\n    v\nHypothesis Agent (GPT-5) -\u003E Ranked Hypotheses\n    |\n    v\nPlanner Agent (GPT-5) -\u003E Workflow Spec\n    |                   ^\n    v                   |\nARCHE-Chem (Qwen2.5) --+ (Review Gaussian settings)\n    |\n    v\nExecution Module (Gaussian) -\u003E Parsed Results\n    |\n    v\nReflection Module (GPT-5 + ARCHE-Chem)\n    |         |         |\n    |         |         +-\u003E User (Structural issues)\n    |         +-\u003E Planner (Calc errors)\n    +-\u003E Hypothesis (Evidence mismatch)\n    |\n    v\nFinal Conclusion\n```\n\nARCHE 的推理-验证闭环包含以下核心步骤：\n\n1. **Retrieval Agent**：输入用户的科学问题与反应描述，提取领域关键词并检索文献，构建 local RAG 知识库，输出 background knowledge context（对应正文 A.1.1）。\n2. **Hypothesis Agent**：输入 background knowledge，从多角度生成竞争性 mechanistic hypotheses，通过关系分析（merge/complement/conflict/independent）优化并排序，输出 top-k hypotheses（对应正文 A.1.1）。\n3. **Planner Agent**：输入 top-k hypotheses，将其分解为有序计算操作（conformer sampling, TS search, IRC 等），检查逻辑一致性与 I/O 兼容性，输出 workflow specification（对应正文 A.1.1, A.3.3）。\n4. **ARCHE-Chem 审查**：输入 workflow spec，审查 Gaussian keywords 与计算设置的化学合理性与技术有效性，输出修正后的 route section（对应正文 A.1.1, A.2）。ARCHE-Chem 基于 Qwen2.5-7B-Instruct，经 continual pretraining（105 textbooks + 432 forum discussions）与 supervised fine-tuning（50,000 QA pairs）训练，推理时采用 reward model（Gemma2-27B-IT）引导的 Best-of-N（N=8）策略（对应正文 A.2.1, A.2.6）。\n5. **Execution Module**：输入修正后的 workflow，调用 Gaussian 16 等工具执行计算，解析 log files 提取 geometries, energies, frequencies 等结构化数据，输出 parsed results（对应正文 A.1.1, A.3）。\n6. **Reflection Module**：输入 parsed results，由 generalist model 与 ARCHE-Chem 联合评估。若计算失败（如 SCF non-convergence），反馈至 Planner 修正设置；若结果与实验矛盾，反馈至 Hypothesis Agent 重新生成假设；若结构输入缺陷，请求用户介入。验证通过的证据输出为 final conclusion（对应正文 A.1.2）。\n\n### § 6 核心数学推导\n\n本文为系统架构与实验验证型论文，未包含形式化数学推导，跳过本节。\n\n### § 7 实验设计与结论\n\n**模型级评测**：ARCHE-Chem 在计算化学任务上是否优于通用 LLM？作者在四个 benchmark（CGB, GRG, GRA, GEH）上与 15 个模型对比。结果显示 ARCHE-Chem 在 GRG（65.60%）、GRA（80.30%）和 GEH（87.60%）上取得最高准确率，而 GPT-5.5 在 CGB 上最高（82.71%），表明 domain-specific training 在执行关键任务上优于通用模型（对应正文 Fig. 2d）。\n\n**Case Study 1（可靠性验证）**：ARCHE 能否仅从反应级信息自主重建已发表的 mechanistic analysis？作者输入一个 vicinal diamine-catalysed asymmetric aldol 反应的规格（reactants, product, catalyst, solvent, temperature），隐瞒文献的 TS 结构与能量数据。ARCHE 在 24 小时内无人工干预地识别出 12 个 TS 结构（含文献报道的 9 个与 3 个新构型），主要 TS 的 RMSD 为 0.01 Å 与 0.15 Å，计算 ΔΔG‡ = 1.9 kcal/mol，与实验推断的 1.6 kcal/mol 高度一致，证明系统可可靠复现已知机理（对应正文 Fig. 3）。\n\n**Case Study 2（发现验证）**：ARCHE 能否揭示未知反应机理？作者输入一个未发表的蓝光驱动 α-iodoboronate C–I cleavage 反应的实验描述，不预设路径。ARCHE 首先排除协同路径（ΔG‡ = 46.0 kcal/mol，室温不可行）与直接光激发路径（激发能 102.8/75.8 kcal/mol，远超 450 nm 光子能量 63.6 kcal/mol），随后通过 reflection 提出 CsPPh2-complex 激活模式，计算其激发能为 64.0 kcal/mol，与 450 nm 光匹配，且与 TEMPO 抑制等控制实验一致，成功发现了一条化学合理的自由基路径（对应正文 Fig. 4）。\n\n**Case Study 3（抽象验证）**：ARCHE 能否从复杂催化体系中提取可解释的 mechanistic descriptor？作者输入 nickel-catalysed migratory cross-coupling 中 ligand-controlled regioselectivity 的趋势描述，要求系统提出并验证抽象假设。ARCHE 评估了 bite angle（间接相关）、Ni–H bond strength（NBO/BDE 趋势不一致）与 Br–N–N–H dihedral angle 三个候选 descriptor，最终选定 dihedral angle：ortho 取代基通过 steric repulsion 降低扭转能垒，促进非平面构象利于 hydride migration，而 unsubstituted/meta/para 配体维持平面高能垒，完整解释了选择性反转现象（对应正文 Fig. 5）。", "additional_insights": "### § 8 Take-aways\n\nARCHE 的核心架构是一个 dual-model closed-loop system：general-purpose reasoning model（GPT-5）负责生成和排序机理假设、规划计算工作流，domain-specialized model（ARCHE-Chem，基于 Qwen2.5-7B-Instruct）负责 Gaussian route 细化、输出解析和错误诊断，两者通过 structured tool registry 连接到 Gaussian 16 等计算工具，形成 proposal–execution–reflection 的迭代循环。ARCHE-Chem 的训练数据来自 105 本计算化学教科书/手册和 432 条专家论坛讨论，经 continual pretraining 和 supervised fine-tuning 后，在 Gaussian route generation（65.60%）、result analysis（80.30%）和 error handling（87.60%）三个执行关键任务上超越 GPT-o3-mini，其中 route generation 优
