<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperTools - 学术论文集合</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Marked.js 用于 Markdown 渲染 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- KaTeX 仅在已展开的 Markdown 段落中渲染公式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <style>
        /* 微软雅黑字体 */
        body {
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        body::-webkit-scrollbar {
            display: none;
        }

        /* 移动端优化 */
        @media (max-width: 640px) {
            body {
                font-size: 14px;
            }

            /* 改善可点击区域 */
            button, a {
                min-height: 44px;
                min-width: 44px;
            }

            /* 优化间距 */
            .container {
                padding-left: 12px !important;
                padding-right: 12px !important;
            }
        }

        /* 星标样式 */
        .star-button {
            transition: color 0.2s ease-in-out;
        }
        .star-button.starred {
            color: #fbbf24;
        }
        .star-button:not(.starred) {
            color: #9ca3af;
        }
        .star-button:hover {
            color: #fbbf24;
        }
        /* 删除按钮样式 */
        .delete-button {
            transition: all 0.2s ease-in-out;
        }
        .delete-button:hover {
            color: #ef4444;
            transform: scale(1.1);
        }
        /* 论文项目样式 */
        .paper-item {
            transition: opacity 0.2s ease-out, transform 0.2s ease-out;
            content-visibility: auto;
            contain-intrinsic-block-size: auto 240px;
        }
        .paper-item.hidden-paper {
            opacity: 0.3;
            transform: scale(0.98);
        }
        /* 平滑过渡 */
        .rotate-90-transition {
            transition: transform 0.2s ease-in-out;
        }

        /* 论文卡片展开/收起 */
        .paper-expand-hint {
            padding: 4px 0;
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .paper-expand-hint:hover {
            color: #2563eb;
        }
        .dark .paper-expand-hint:hover {
            color: #60a5fa;
        }
        .paper-expand-hint .expand-arrow {
            display: inline-block;
            transition: transform 0.2s;
            font-size: 0.65rem;
            margin-right: 4px;
        }
        .paper-detail {
            border-top: 1px solid #e2e8f0;
            margin-top: 8px;
            padding-top: 8px;
        }
        .dark .paper-detail {
            border-top-color: #334155;
        }
        .paper-detail.hidden {
            display: none;
        }

        /* 可折叠部分样式 */
        .collapsible-header {
            cursor: pointer;
            display: flex;
            align-items: center;
            font-weight: 600;
            padding: 8px 0;
            user-select: none;
            color: #1e40af;
            transition: color 0.15s ease-out, opacity 0.15s ease-out;
        }
        .dark .collapsible-header {
            color: #60a5fa;
        }
        .collapsible-header:hover {
            opacity: 0.8;
        }
        .collapsible-header::before {
            content: "▶";
            margin-right: 8px;
            transition: transform 0.3s ease;
            font-size: 0.8em;
        }
        .collapsible-header.open::before {
            transform: rotate(90deg);
        }
        .collapsible-content {
            display: none;
        }
        .collapsible-content.open {
            display: block;
        }
        .collapsible-content .inner {
            padding-top: 8px;
        }

        @media (prefers-reduced-motion: reduce) {
            .paper-item,
            .collapsible-header,
            .collapsible-header::before,
            .paper-expand-hint .expand-arrow {
                transition: none;
            }
        }

        /* Markdown 内容样式 */
        .markdown-content {
            line-height: 1.6;
        }
        .markdown-content h1 {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 1em;
            margin-bottom: 0.5em;
            color: #1e40af;
        }
        .dark .markdown-content h1 {
            color: #60a5fa;
        }
        .markdown-content h2 {
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 0.8em;
            margin-bottom: 0.4em;
            color: #1e40af;
        }
        .dark .markdown-content h2 {
            color: #60a5fa;
        }
        .markdown-content h3 {
            font-size: 1.1em;
            font-weight: bold;
            margin-top: 0.6em;
            margin-bottom: 0.3em;
            color: #1e40af;
        }
        .dark .markdown-content h3 {
            color: #60a5fa;
        }
        .markdown-content h4 {
            font-size: 1em;
            font-weight: bold;
            margin-top: 0.5em;
            margin-bottom: 0.25em;
            color: #2563eb;
        }
        .dark .markdown-content h4 {
            color: #93c5fd;
        }
        .markdown-content p {
            margin-bottom: 0.8em;
        }
        .markdown-content ul, .markdown-content ol {
            margin-left: 1.5em;
            margin-bottom: 0.8em;
        }
        .markdown-content ul {
            list-style-type: disc;
        }
        .markdown-content ol {
            list-style-type: decimal;
        }
        .markdown-content li {
            margin-bottom: 0.3em;
        }
        .markdown-content code {
            background-color: #f1f5f9;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
        }
        .dark .markdown-content code {
            background-color: #334155;
        }
        .markdown-content pre {
            background-color: #f1f5f9;
            padding: 1em;
            border-radius: 5px;
            overflow-x: auto;
            margin-bottom: 0.8em;
        }
        .dark .markdown-content pre {
            background-color: #334155;
        }
        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
        }
        .markdown-content blockquote {
            border-left: 3px solid #cbd5e1;
            padding-left: 1em;
            margin-left: 0;
            margin-bottom: 0.8em;
            color: #64748b;
        }
        .dark .markdown-content blockquote {
            border-left-color: #475569;
            color: #94a3b8;
        }
        .markdown-content strong {
            font-weight: 600;
        }
        .markdown-content em {
            font-style: italic;
        }

        /* Tag filter button styles */
        .tag-btn {
            padding: 4px 14px;
            font-size: 0.875rem;
            border-radius: 9999px;
            border: 1px solid #cbd5e1;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .tag-btn:hover { border-color: #3b82f6; color: #3b82f6; }
        .tag-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .dark .tag-btn { border-color: #475569; color: #94a3b8; }
        .dark .tag-btn:hover { border-color: #60a5fa; color: #60a5fa; }
        .dark .tag-btn.active { background: #2563eb; color: white; border-color: #2563eb; }

        /* Tag badge styles */
        .tag-badge {
            display: inline-block;
            padding: 1px 6px;
            font-size: 0.7rem;
            border-radius: 9999px;
            background: #dbeafe;
            color: #1e40af;
            margin-right: 4px;
        }
        .tag-badge.tag-arxiv {
            background: #e0f2fe;
            color: #0369a1;
        }
        .dark .tag-badge { background: #1e3a5f; color: #7dd3fc; }
        .dark .tag-badge.tag-arxiv { background: #164e63; color: #67e8f9; }

        /* 作者机构上标样式 */
        .author-aff {
            vertical-align: super;
            font-size: 0.65em;
            color: #3b82f6;
            margin-left: 1px;
        }
        .dark .author-aff {
            color: #60a5fa;
        }

        /* 桌面端正文使用移除右栏后释放的宽度，同时避开左侧目录。 */
        #content-column {
            width: 100%;
        }
        @media (min-width: 1024px) {
            #content-column {
                width: min(1024px, calc(100% - 260px));
                margin-left: max(240px, calc((100% - 1024px) / 2));
                margin-right: auto;
            }
        }

        /* TOC 侧边栏样式 - 固定在左侧 */
        #toc-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            z-index: 35;
            background: white;
            border-right: 1px solid #e2e8f0;
            transition: transform 0.3s ease;
            overflow: hidden;
        }
        .dark #toc-sidebar {
            background: #1e293b;
            border-right-color: #334155;
        }
        #toc-sidebar.collapsed {
            transform: translateX(-100%);
        }
        #toc-inner {
            padding: 1rem 0.5rem;
            height: 100%;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        #toc-inner::-webkit-scrollbar {
            width: 4px;
        }
        #toc-inner::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 2px;
        }
        .dark #toc-inner::-webkit-scrollbar-thumb {
            background: #475569;
        }
        .toc-date {
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toc-date:hover {
            background: #e2e8f0;
        }
        .dark .toc-date:hover {
            background: #334155;
        }
        .toc-date.active {
            background: #dbeafe;
            color: #1e40af;
        }
        .dark .toc-date.active {
            background: #1e3a5f;
            color: #93c5fd;
        }
        .toc-date-arrow {
            transition: transform 0.2s;
            font-size: 0.65rem;
        }
        .toc-date-arrow.open {
            transform: rotate(90deg);
        }
        .toc-papers {
            display: none;
            padding-left: 1.2rem;
        }
        .toc-papers.open {
            display: block;
        }
        .toc-paper {
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 3px;
            font-size: 0.8rem;
            line-height: 1.35;
            color: #64748b;
            transition: background 0.15s, color 0.15s;
            display: block;
            white-space: normal;
            overflow-wrap: anywhere;
            max-width: 100%;
        }
        .toc-paper:hover {
            background: #f1f5f9;
            color: #1e40af;
        }
        .dark .toc-paper {
            color: #94a3b8;
        }
        .dark .toc-paper:hover {
            background: #1e293b;
            color: #93c5fd;
        }
        .toc-paper.active {
            background: #eff6ff;
            color: #1d4ed8;
            font-weight: 500;
        }
        .dark .toc-paper.active {
            background: #1e3a5f;
            color: #93c5fd;
        }
        .toc-expand-all {
            width: calc(100% - 8px);
            margin: 5px 4px 6px;
            padding: 5px 8px;
            border: 1px solid #bfdbfe;
            border-radius: 5px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .toc-expand-all:hover {
            background: #dbeafe;
            border-color: #93c5fd;
        }
        .dark .toc-expand-all {
            background: rgba(30, 58, 95, 0.55);
            border-color: #1e40af;
            color: #93c5fd;
        }
        .dark .toc-expand-all:hover {
            background: #1e3a5f;
        }
        /* TOC 切换按钮 - 左侧 */
        #toc-toggle {
            position: fixed;
            left: 220px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 40;
            width: 28px;
            height: 56px;
            border-radius: 0 6px 6px 0;
            background: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 0 8px rgba(0,0,0,0.15);
            transition: left 0.3s ease, background 0.2s;
        }
        #toc-toggle:hover {
            background: #2563eb;
        }
        #toc-toggle svg {
            transition: transform 0.3s;
        }
        #toc-toggle:not(.sidebar-open) {
            left: 0;
        }
        @media (max-width: 1023px) {
            #toc-sidebar {
                width: 240px;
            }
            #toc-toggle {
                left: 240px;
            }
            #toc-toggle:not(.sidebar-open) {
                left: 0;
            }
        }
        @media (max-width: 767px) {
            #toc-sidebar {
                width: 260px;
                box-shadow: 4px 0 16px rgba(0,0,0,0.1);
            }
            #toc-toggle {
                left: 260px;
            }
            #toc-toggle:not(.sidebar-open) {
                left: 0;
            }
        }

    </style>
    <script>
        // Tailwind CSS 暗色模式配置
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>

    <script>
        const allPapers = {"2026-08-31": [{"name": "Coding Agents \u0026 Loop Engineering", "count": 2, "papers": [{"title": "LoopArena: Benchmarking Models as Runtime Controllers for Loop Engineering", "arxiv_id": "2608.28281", "authors": "Yi Wang, Haopeng Zhang, Chengxiang Huang, Rui Dai, Kaikui Liu, Piotr Koniusz, Xiangxiang Chu", "summary": "Loop Engineering is emerging as a practice for organizing development work around coding agents. Instead of writing each prompt by hand, practitioners design loops that monitor progress, assign work, run checks, and decide what the agent should do next. Even with a capable coding agent, a loop may trust a stale progress note, skip needed verification, spend its budget in the wrong direction, or stop before the task is safe to submit. Yet the final outcome of one end-to-end run cannot tell whether success or failure reflects the loop's guidance or the coding agent's ability to carry out the task. We introduce LoopArena, a benchmark for evaluating how well one model can guide a separate coding agent through a long-running task. The model under evaluation is the \\textbf{Controller}: after each coding round, it receives a structured summary of the run and instructs a separate, fixed coding agent, the \\textbf{Worker}, on what to do or verify next, or decides whether to stop. LoopArena evaluates this ability in three complementary settings that differ in execution scope and cost. Type I scores next-step Loop Contract selection through execution-validated questions without running the Worker at evaluation time. Type II executes repeated control over a selected slice of a full task, while Type III evaluates the paired full task from its original state. On full tasks, the best observed Strict Success Rate is \\textbf{24.69\\%}, leaving substantial room for improvement in long-horizon loop control. Across Controllers, the paired reduction in estimated inference cost averages \\textbf{64.4\\%}, and Type II produces a similar ordering under the main Core criterion (Spearman's \\(ρ=\\textbf{0.9747}\\)). We release the benchmark data and evaluation code at https://github.com/AMAP-ML/LoopArena .", "category": "cs.AI", "cluster": "Coding Agents \u0026 Loop Engineering", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-54 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出 LoopArena 基准，用于评估模型作为 Runtime Controller 引导独立 coding agent (Worker) 完成长期任务的能力。论文研究的 \"Loop Engineering\" 本质上是智能体的 harness/scaffold/runtime 控制机制，涉及监控进度、分配工作、运行检查和决定下一步行动，属于 Long-Horizon Agents 的控制与决策范畴。根据筛选标准第一步，如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents，即使主要是评估基准或经验研究，只要结论直接帮助理解或改进智能体能力，就应保留。此外，论文探讨了模型在长期循环控制中的失败模式（如信任过时进度、跳过验证、预算分配错误等）和推理成本优化，这直接关联到智能体的规划、执行与评估。该研究不涉及被排除的安全、多模态、图技术或单纯的多智能体拓扑/通信协议，而是深入探讨了智能体运行时控制这一核心组件的能力边界。因此，它高度符合您关于“LLM智能体及其演化”的研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：当一个模型被用作 runtime controller 来指导一个独立的 coding agent 完成长周期 repository-level 编码任务时，如何精确评估该模型的 loop control 能力？在 Loop Engineering 实践中，开发者不再手写每一条 prompt，而是设计 loops 来监控进度、分配工作、运行检查并决定 agent 的下一步行动。然而，即使底层 coding agent 能力很强，loop 层面仍可能出现严重失误：信任过时的进度记录、跳过必要的 verification、将预算消耗在错误方向、或在任务尚未安全可提交时提前终止。问题的难点在于，一次 end-to-end run 的最终成败无法归因——无法判断成功或失败究竟反映了 loop 的 guidance 质量，还是 coding agent 本身的 task execution 能力。LoopArena 通过引入一个两 agent 架构来解耦这两个因素：被评估的模型担任 Controller，在每轮编码后接收结构化的 Evidence Packet 并向一个固定的 Worker 发出 Loop Contract 或决定停止；Worker、工具、执行预算和 evaluator 全部保持不变，使得 Controller 模型成为唯一的比较对象。这一问题的解决具有直接的实际价值：它使 agent orchestration 中\"模型作为管理者\"这一角色首次成为可测量、可比较的评估目标，为 Loop Engineering 的实践改进提供了可量化的反馈信号。\n\n### § 2 前人工作与不足\n\n该问题此前未被直接解决。最接近的前人工作可分为三类，但每一类都在评估对象上存在根本性缺口。第一类是 coding-agent benchmarks，以 SWE-bench（Jimenez et al., 2024）及其变体 Multi-SWE-bench（Zan et al., 2025）、SWE-Bench Pro（Deng et al., 2025）为代表，它们通过运行 coding agent 并用 executable tests 对最终 repository state 打分来评估任务完成度。这类 benchmark 将 coding agent 或 agent system 作为整体评估，无法分离 loop guidance 与 coding ability 的各自贡献——因为最终 patch 的成功同时依赖两者，任何失败都无法定位是 controller 决策失误还是 worker 执行不力。Long-horizon 扩展如 SlopCodeBench（Orlanski et al., 2026）和 BeyondSWE（Chen et al., 2026a）虽然将任务时长和复杂度推到了更高水平，但评估对象仍然是完整的 coding-agent system。\n\n第二类是 process-oriented benchmarks，如 AgentProcessBench（Fan et al., 2026）和 SWE-Explore（Zhang et al., 2026a），它们评估 coding trajectory 中的单个 action 或 capability（如 repository exploration）。这类工作将评估粒度细化到 step level，但缺少对 repeated control decisions 及其 downstream execution consequences 的闭环评估——一个孤立的 step 质量分数无法反映 controller 在多轮交互中能否正确地在 implementation、verification、recovery 和 stopping 之间切换。\n\n第三类是 harness 和 loop system 的比较工作。Harness-Bench（Yao et al., 2026）和 LoopsBench（Li et al., 2026）比较不同的 model-harness 配置组合，但评估对象是完整的 loop system 而非其中某个组件。LongHorizon-Harness（Ma et al., 2026）和 ManagerWorker（Liu, 2026）研究了 model-directs-model 的组织结构，但未将其转化为一个固定 Worker、比较 Controller 的受控评估协议。这些工作之所以没有将 runtime loop control 独立出来作为评估目标，是因为缺少一个关键的方法论前提：必须将 Worker、工具、执行预算、evaluator 和 control interface 全部固定，才能使 Controller 模型成为唯一变量。LoopArena 的贡献正在于建立了这一受控协议，并通过 Type I（单次 control decision 的 execution-validated 选择题）、Type II（task slice 上的 repeated control）和 Type III（full task 上的 end-to-end control）三个互补设置，在不同 execution scope 和 cost 层级上实现了对 loop control 能力的分层评估。", "core_insight": "### § 3 重建作者的思考路径\n\n当开发者开始用 Loop Engineering 管理 coding agent 的多轮交互时，一个经验性的失败模式反复出现：agent 本身可能足够强，但 loop 会信任一条过时的进度记录、跳过本该执行的 verification、把预算花在错误方向，或在任务尚未安全提交前就提前停止。问题在于，当一次端到端运行结束，成功或失败这一单一信号无法区分贡献来源——是 loop 的 guidance 出了问题，还是 coding agent 的 execution 能力不足。现有的 coding benchmark（如 SWE-bench 及其变体）将整个 coding-agent 系统作为评估对象，用可执行测试对最终 repository 状态打分；long-horizon benchmark 延长了任务长度，process-oriented benchmark 则细化到单步动作质量，但这两类工作都没有把\"谁来指导 loop\"这件事本身变成独立的评估目标。与此同时，ManagerWorker 等研究已经探索过一个模型指导另一个模型的 pairing，Harness-Bench 和 LoopsBench 开始比较不同 model–harness 组合，但它们仍把完整 loop 系统作为评估单元，没有隔离出 runtime control 这一变量。作者由此意识到：如果固定执行端、只替换指导端，就能把 agent orchestration 中\"控制决策\"这一能力从\"代码执行\"能力中剥离出来，使其成为可直接测量的对象。进一步的问题是评估成本——完整 long-horizon 任务的端到端运行极其昂贵，而单步决策又缺乏执行后果的 grounding。作者因此设计了三个互补粒度：Type I 把候选指令的执行后果预置到 benchmark 构建阶段，使评估时无需运行 Worker；Type II 从完整任务中截取一个中间切片，保留闭环执行但缩短运行范围；Type III 从原始状态运行完整任务，作为全保真参照。通过 Type II 与 Type III 的配对，可以经验性地验证低成本切片是否复现完整任务的 Controller 排序。\n\n### § 4 核心 Intuition\n\n端到端结果混淆了指导能力和执行能力，因此必须把两者拆开测量：固定一个 Worker 和执行环境，只替换 Controller 模型，让被评估模型在每轮 coding 之后读取结构化的 Evidence Packet 并发出 Loop Contract，决定 Worker 下一步做什么或何时停止。为了让这种分离在不同成本下都可行，用三种粒度评估同一能力——预置执行后果的单次选择题、截取的任务切片、以及完整任务——使得单次控制决策、局部闭环和端到端控制都能被观测，同时低成本设置可以作为高保真设置的代理。让先前方法失效的根本原因是它们把整个 agent 系统当作原子单元打分，无法定位控制层的失败；这个方法奏效的核心是将控制接口结构化并固定执行端，从而把 runtime loop control 变成一个独立的、可复现的测量对象。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+----------------+       +-------------------+\n|  Worker        |       |  Reporter         |\n| (执行代码任务) |  ---\u003E | (总结进度与证据)  |\n+----------------+       +-------------------+\n      ^                        |\n      |                        v\n      |               +-------------------+\n      |               | Evidence Packet   |\n      |               | (结构化只读摘要)  |\n      |               +-------------------+\n      |                        |\n      |                        v\n+----------------+       +-------------------+\n| Loop Contract  | \u003C---  |  Controller       |\n| (下一步指令)   |       | (被评估模型)      |\n+----------------+       +-------------------+\n      |                        |\n      | (advance/verify)       | (stop)\n      +------------------------+-----------\u003E [Task Evaluator]\n```\n\nLoopArena 的核心在于将模型的 runtime loop control 能力转化为可评估的对象。整个 pipeline 围绕 Controller-Worker 双 agent 架构展开，分为输入、处理与输出三个阶段：\n\n1. **输入与初始状态**：Worker 接收原始的 repository task 和 bootstrap instruction，进行初步的 orientation pass，定位相关代码区域并识别当前实现状态，随后暂停并将控制权交还给 harness。\n2. **处理与控制循环**：harness 创建一个临时的 Reporter agent，它复制 Worker 的对话历史并通过只读工具检查 workspace，生成包含任务上下文、工作历史、验证证据和未决问题的四部分报告。该报告被格式化为结构化的 Evidence Packet 传递给 Controller。Controller 读取 Packet 后，发出 Loop Contract，决定下一步是 advance、verify 还是 stop。若继续，harness 将 Contract 渲染为 Worker 的下一个 prompt，Worker 执行后再次暂停，形成 outer loop。\n3. **输出与评估**：当 Controller 发出 stop 指令时，harness 将当前 workspace 提交给 Task Evaluator 进行评分。\n\n以论文附录中的 Django 依赖清理任务为例：Worker 首先检查代码库，发现测试矩阵修改已基本完成，但存在未使用的 drf39 依赖。Reporter 捕捉到这一状态并生成 Evidence Packet。Controller 识别到 drf39 是孤立依赖，发出 advance 指令要求移除它同时保留活跃配置。Worker 执行移除操作后，Controller 在下一轮确认所有需求已满足，发出 stop，任务结束并由 evaluator 评分。\n\n### § 6 核心数学推导\n\n本文没有复杂的理论数学推导，主要涉及评估指标的定义：\n\n1. **Contract Accuracy (Type I)**: $Acc_I(\\pi) = \\frac{1}{N_I} \\sum_{q} \\mathbb{1}[j_{\\pi,q} = j_q^*]$\n   - Intuition: 衡量 Controller 在单次决策中选择正确 Loop Contract 的比例。$j_q^*$ 是构建 benchmark 时通过执行确定的正确选项。\n\n2. **Strict Success Rate (Type II \u0026 III)**: $SSR_t(p) = \\frac{1}{N_t K} \\sum_{i,r} Y_{p,i,r}^{(t)}$\n   - Intuition: 衡量在 $K$ 次重复实验中，policy $p$ 成功通过 evaluator 的比例。这是一个严格的二元指标，只有完全通过才算成功。\n\n3. **Estimated Inference Cost**: $Cost = \\sum_{j} (I_j P_j^{in} + O_j P_j^{out})$\n   - Intuition: 通过将每次 model call 的 input/output token 数乘以公开价格，估算单次运行的推理成本，假设无 prompt caching。\n\n4. **Spearman's Rank Correlation $\\rho_{II, III}$**:\n   - Intuition: 用于评估 Type II (低成本任务切片) 和 Type III (完整任务) 下 Controller 排序的一致性。高相关性表明 Type II 可以作为低成本替代评估方案。\n\n### § 7 实验设计与结论\n\n**问题 1: 模型能否有效控制长周期 coding agent 的 loop？**\n- **实验设计**: 通过 Type III 评估完整任务，对比不同 Controller 模型与 no control、fixed control 两种 reference policy 的 Strict Success Rate。\n- **问题答案**: Full-task control 仍然非常困难。表现最好的 Controller 也只达到了 24.69% 的 Strict Success Rate。Fixed control 在 Type III 上与 no control 表现相同 (18.52%)，表明仅仅重复目标是不够的，有效的 loop control 必须能够根据执行状态自适应调整指导。\n\n**问题 2: 能否以更低成本评估 Controller 的 loop control 能力？**\n- **实验设计**: 通过 Type II 评估任务切片，测量其推理成本，并计算 Type II 与 Type III 之间 Controller 排序的 Spearman's rank correlation $\\rho$。\n- **问题答案**: 可以。Type II 平均降低了 64.4% 的推理成本，且其 Controller 排序与 Type III 高度一致 ($\\rho = 0.9747$)，证明 Type II 是一种有效的低成本评估设置。\n\n**问题 3: 模型在单次控制决策上的表现如何？**\n- **实验设计**: 通过 Type I 评估单次 Loop Contract 选择，计算 Contract Accuracy，并与 deterministic shortcuts (如 uniform random、candidate length) 进行对比。\n- **问题答案**: Controller 的 Contract Accuracy 在 72.22% 到 87.78% 之间，远高于最强的 shortcut baseline (31.11%)。这表明模型具备一定的单次决策能力，但仍有提升空间，且 Type I 提供了一种无需执行 Worker 的低成本诊断方法。", "additional_insights": "### § 8 Take-aways\n\nLoopArena 将 Loop Engineering 中的 runtime loop control 隔离为直接评估对象：通过固定 Worker（Qwen3.7-Plus）和执行环境，仅替换 Controller 模型，使得任务成败差异可归因于模型的指导能力而非 coding agent 的执行能力。三层评估设置在分辨率与成本上形成互补——Type I 将候选执行成本前移至 benchmark 构建阶段，使后续评估仅需一次四选一选择而无需运行 Worker；Type II 从 prepared intermediate workspace 出发评估任务切片；Type III 从原始状态评估完整任务。Full-task control 仍然非常困难：在 Type III 中，最好的 Controller（GPT-5.5）仅达到 24.69% 的 Strict Success Rate，而 fixed control（在每个控制点机械重述原始目标）在完整任务上与 no control 持平（18.52%），表明有效的 loop control 必须随执行进展在 implementation、verification、recovery 和 stopping 之间动态切换，而非仅持久化目标。Type II 以平均 64.4% 的 estimated inference cost reduction 保留了与 Type III 高度相似的 Controller 排序（Spearman's ρ = 0.9747），支持其作为低成本比较设置的价值。Type I 的 Contract Accuracy 跨越 72.22%–87.78%，远超最强的确定性 shortcut baseline（majority position 仅 31.11%），表明模型确实基于 Evidence Packet 做出有意义的控制决策而非依赖表面线索。\n\n### § 9 最脆弱的假设\n\n最脆弱的假设是：**固定单一 Worker 后，Controller 排序反映的是模型固有的 loop control 能力，而非 Controller 与该特定 Worker 的交互效应**。论文的全部 Controller 比较和 Type II–Type III 排序一致性 claim 都建立在一个 Worker（Qwen3.7-Plus）之上。如果不同 Controller 对不同 Worker 的适配程度不同——例如某 Controller 的指令风格恰好与 Qwen3.7-Plus 的 ReAct 执行模式契合，而换用另一个 Worker 后排序完全改变——那么论文报告的 Controller ranking 就不是模型控制能力的通用度量，而是特定配对的产物。这一假设在实际中很可能不成立：Controller 发出的 Loop Contract 在措辞粒度、verification 要求的明确程度、prohibited_actions 的约束方式上存在差异，不同 Worker 对这些指令的遵循度和解读方式可能显著不同，这正是 agent orchestration 文献中常见的 interaction effect。论文没有提供任何跨 Worker 的消融实验来排除这一可能性，Limitations 部分也仅承认 \"extending to additional Worker families would broaden coverage\"，但未将其视为对核心 ranking claim 的威胁。如果这个假设不成立，Type II 作为低成本 Controller 比较工具的核心贡献——用 ρ = 0.9747 支撑的排序保真度——就可能在一个不同的 Worker 上消失，使整个 benchmark 的比较结论失去泛化性。\n\n### § 10 最小复现实验\n\n在一周时间内，最可行的最小复现是验证 Type I 的核心 claim：**模型在单个控制决策上的 Contract Accuracy 显著高于确定性 shortcut baselines，且不同 Controller 之间存在有意义的差异**。使用论文发布的 90 个 Type I 问题（GitHub: https://github.com/AMAP-ML/LoopArena），每个问题包含一个 frozen Evidence Packet 和四个 candidate Loop Contracts，answer keys 在构建时已通过 matched replay 确定。选取两个差异最大的 Controller——例如 GPT-5.5（论文报告 87.78%）和 Qwen3.7-Plus（72.22%）——对每个问题发起一次 API 调用，解析模型返回的 \"Answer: X\" 并与 answer key 比对，计算 Contract Accuracy 和 Invalid Rate。同时实现五个确定性 shortcut baselines（uniform random、majority position、action only、shortest candidate、lexical overlap），在相同 90 题上运行。如果 GPT-5.5 的 accuracy 接近 87.78% 且 Qwen3.7-Plus 接近 72.22%，同时所有 shortcut baselines 低于 32%，则支持论文的 claim：模型确实基于 Evidence Packet 内容做出有意义的控制决策，且 Controller 间存在可测量的能力差异。如果 shortcut baselines 逼近或超过模型表现，或者两个 Controller 的 accuracy 差距消失，则反驳了 Type I 作为 control-decision 评估工具的有效性。该实验无需运行 Worker、无需 coding tools、无需 repository 执行环境，仅依赖 API 调用和静态数据分析，成本可控且可在一周内完成。", "research_value": "### § 11 最强反例设计\n\n要对该论文构成最有力的攻击，我会设计一个**跨 Worker 能力梯度的交互效应消融实验**，直接挑战其核心假设：“固定单一 Worker 后，Controller 排序反映的是模型固有的 loop control 能力”。论文的 Controller ranking 及 Type II 与 Type III 之间高达 0.9747 的 Spearman's rank correlation，完全建立在 Qwen3.7-Plus 这一单一执行节点之上。我的反例假设是：论文观测到的控制能力差异，本质上是不同 Controller 生成的 Loop Contract 在措辞粒度、verification 显式度上与 Qwen3.7-Plus 特定 ReAct 执行模式的“偶然契合度”，而非通用的管理能力。具体实验设计如下：引入两个能力层级或执行范式截然不同的 Worker——例如一个严格遵循指令但缺乏主动纠错的弱模型（如 Llama-3-70B）和一个具备强自主推理能力的强模型（如 Claude-3.5-Sonnet）。在保持 Task Evaluator 和任务集不变的前提下，让论文中测试过的所有 Controller 分别与这两个 Worker 配对，在 Type III 完整任务上运行并记录 Strict Success Rate。如果论文的 claim 成立，Controller 在不同 Worker 下的性能排序应保持高度一致（即能力强的 Controller 无论搭配谁都应名列前茅）。然而，真实情况极可能出现**排序逆转**：那些习惯发出高粒度、强约束指令的“微观管理型” Controller，在搭配弱 Worker 时可能排名飙升，但在搭配强 Worker 时因过度限制其自主纠错空间而排名暴跌；相反，那些只提供高层级目标的“宏观引导型” Controller 排序将呈现相反趋势。一旦跨 Worker 实验中 Spearman's rank correlation 显著下降甚至出现负相关，就能确凿证明 LoopArena 当前测量的不是模型独立的 loop control 能力，而是特定 Controller-Worker 配对下的交互适配度，这将从根本上瓦解该 benchmark 作为通用模型评估工具的效度基础。\n\n### § 12 Follow-up Research Idea\n\n该论文的根本局限在于将 Worker 视为一个被动的、能力固定的黑盒环境，而 Controller 仅基于静态的 Evidence Packet 进行单向决策。这忽略了真实 Loop Engineering 中 controller 决策失误的核心根源：Controller 缺乏对 Worker 内在能力边界和认知状态的精确建模。为突破这一静态评估框架的局限，我提议一个全新的研究方向：**Theory-of-Mind (ToM) driven Adaptive Loop Orchestration**。该方向不再评估 Controller 的静态指令选择，而是评估 Controller 在多轮交互中动态构建、更新并利用 Worker 心智模型的能力。\n\n驱动这一想法的未满足需求是：在长周期任务中，失败的往往不是任务规划本身，而是 Controller 无法感知 Worker 是否“理解”了指令、是否陷入了某种执行偏见，或者是否已经达到了其能力上限。借鉴相邻领域——具体来说是 Intelligent Tutoring Systems (ITS) 中的 Student Modeling 以及 Control Theory 中的 System Identification——我们可以将 Worker 视为一个需要被在线辨识的动态系统。Controller 不能仅仅输出 advance/verify/stop，而必须在每轮交互中隐式或显式地更新对 Worker 当前“认知状态”和“技能边界”的信念分布，并据此调整下一轮 Loop Contract 的抽象层级和约束强度。\n\n第一个实验将设计一个 **Probing-and-Adapting Protocol**。在标准的 Controller-Worker 架构中，引入“Worker Capability Perturbation”：在任务执行中途，隐蔽地修改 Worker 的 system prompt（例如注入一个不相关的思维链干扰，或限制其工具调用权限），模拟 Worker 状态的漂移。评估指标除了最终的 Strict Success Rate，新增 **Mental Model Calibration Error**——即 Controller 预测 Worker 在下一轮能否成功执行特定子操作的概率分布，与 Worker 实际执行结果的交叉熵差异。实验将对比 baseline Controller（仅基于 Evidence Packet 反应）与 ToM-enhanced Controller（被显式 prompt 去主动探测 Worker 的不确定性并调整指令粒度）。如果 ToM-enhanced Controller 在面对 perturbed Worker 时展现出显著更低的 Calibration Error 和更高的任务恢复率，这将证明：未来的 Loop Engineering 核心不在于设计更完美的静态 control loop，而在于赋予 Controller 对执行 agent 的动态认知建模能力，从而开启从“指令优化”到“跨 agent 认知协同”的全新研究范式。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yi Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Haopeng Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Chengxiang Huang\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Rui Dai\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Kaikui Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Piotr Koniusz\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Xiangxiang Chu\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"DreamX Team, Alibaba Group\"},\n    {\"id\": 2, \"name\": \"Beijing University of Posts and Telecommunications\"},\n    {\"id\": 3, \"name\": \"UNSW Sydney; Data61, CSIRO\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "Loop Engineering 正在成为一种围绕 coding agents 组织开发工作的实践。实践者不再手动编写每个 prompt，而是设计 loops 来监控进度、分配工作、运行检查，并决定 agent 接下来应该做什么。即使拥有强大的 coding agent，loop 也可能会信任过时的进度记录，跳过必要的验证，将预算花费在错误的方向上，或者在任务可以安全提交之前停止。然而，一次端到端运行的最终结果无法表明成功或失败是反映了 loop 的指导，还是 coding agent 执行任务的能力。我们引入了 LoopArena，这是一个 benchmark，用于评估一个模型在指导独立的 coding agent 完成长周期任务方面的能力。被评估的模型是 \\textbf{Controller}：在每轮编码之后，它会接收运行的结构化摘要，并指示一个独立且固定的 coding agent（即 \\textbf{Worker}）接下来要做什么或验证什么，或者决定是否停止。LoopArena 在三种在执行范围和成本上有所不同的互补场景中评估这种能力。Type I 通过执行验证的问题对下一步 Loop Contract 选择进行评分，而在评估时不运行 Worker。Type II 对完整任务的选定切片执行重复控制，而 Type III 则从原始状态评估配对的完整任务。在完整任务上，观察到的最佳 Strict Success Rate 为 \\textbf{24.69\\%}，这表明在长周期 loop control 方面还有很大的改进空间。在各 Controller 中，估计 inference cost 的配对减少量平均为 \\textbf{64.4\\%}，并且 Type II 在主要 Core criterion 下产生了相似的排序（Spearman's \\(ρ=\\textbf{0.9747}\\)）。我们在 https://github.com/AMAP-ML/LoopArena 发布了 benchmark 数据和评估代码。"}, {"title": "openJiuwen: Beyond Static Harnesses for Long-Horizon Coding Agents", "arxiv_id": "2608.27969", "authors": "openJiuwen Team, Tao Yu, Xinyu Zhang, Qianqian Chen, Xiaoneng Xiang, Chia Kwangyang, Xingchen Huang, Ran Chen, Yangkai Ding, Zheng Wang, Yeo Boon Hong, Bingzheng Gan, Enrui Hu, Shuo Cheng, Deyang Li, Ruifeng Shi, Hongbo Wang, Qi Ye, Xuefeng Jin, Zhangchun Zhao", "summary": "Long-horizon coding agents operate over evolving repository states while increasingly relying on heterogeneous capabilities, delegated agents, and multi-agent coordination. These trends pose two complementary challenges for the agent harness. First, developers need to compose capabilities, reconfigure execution logic, and scale increasingly complex agent systems without repeatedly rebuilding orchestration. Second, complex coding tasks continuously produce new evidence---such as semantic diagnostics, execution outcomes, task progress, and changing context relevance---that should dynamically influence subsequent runtime decisions. We characterize these challenges as Structural Composability and Runtime Adaptivity. We present openJiuwen, an open-source harness designed for both developer composability and adaptive task execution. openJiuwen provides a shared execution substrate and Rail-based capability composition across single agents, delegated sub-agents, and Swarm Flow, enabling developers to construct sophisticated agent harnesses under common execution semantics. It further adapts framework-controlled runtime decisions around a fixed model policy, allowing evolving evidence to dynamically affect context, feedback, and task control toward successful completion. We systematically evaluate openJiuwen on SWE-bench Verified and Terminal-Bench 2.1, where it achieves 82.6% and 87.19%, respectively, exceeding the strongest selected official-leaderboard point estimates by 3.4 and 3.39 percentage points. These results show that openJiuwen achieves strong performance on complex coding tasks while providing a composable and adaptive harness design.", "category": "cs.AI", "cluster": "Coding Agents \u0026 Loop Engineering", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=31 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一个名为 openJiuwen 的开源智能体框架，专门针对长周期编码智能体的运行时环境进行了设计与优化。根据筛选标准第一步中的明确指示：“如果论文研究 agent 的 harness / scaffold / runtime / tool middleware / system prompt / execution environment / continual harness，并且核心贡献是让这些智能体运行组件通过轨迹、反馈、观测或评估结果自动改进、演化或自适应优化……此规则不限于 coding-agent”，该论文完全符合保留条件。\n\n论文针对长周期任务中的“结构可组合性”和“运行时自适应性”两大挑战，提出让智能体在执行任务时，能够根据不断产生的动态证据（如语义诊断、执行结果、任务进度等）自适应地影响后续的运行时决策、上下文和反馈控制。这种基于环境反馈的自适应机制正是智能体演化与改进的核心。此外，论文的研究对象明确为 Long-Horizon Coding Agents，并涉及多智能体协调（如委托子智能体和 Swarm Flow），属于 Agentic AI 的前沿研究。因此，该论文与您的“构建、改进、演化 LLM智能体”的研究焦点高度契合。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的核心问题是长周期编程智能体在处理不断演化的代码库状态时，所面临的 **Structural Composability**（结构可组合性）与 **Runtime Adaptivity**（运行时自适应能力）双重挑战。随着 LLMs 从单轮代码生成转向需要与代码库、工具及执行环境持续交互的长周期智能体，agent harness 已不再是简单的工具包装器，而是决定各项能力如何组装及执行控制的一等系统层。然而，随着智能体集成规划、记忆、验证、上下文工程、委托和多智能体协调等丰富功能，开发者面临组合和重构复杂执行逻辑的巨大工程成本；同时，复杂编程任务在执行过程中会持续产生新证据（如 semantic diagnostics、执行结果、任务进度），若不能利用这些动态证据调整后续运行时决策，早期决策将逐渐失效并导致任务失败。解决这一问题不仅能显著降低构建复杂智能体系统的集成与编排负担，还能通过动态适应执行轨迹提升复杂编程任务的成功率，为自动化软件工程提供兼具高开发效率与高执行效能的统一 harness 架构。\n\n### § 2 前人工作与不足\n针对智能体架构与运行时控制，前人已有多项探索，但在统一的系统级组合与自适应控制上存在明显不足。在架构与 scaffold 方面，**Pi** 提供了最小化且提供商灵活的运行时，**DeepSeek Harness** 实现了插件级可组合性，**DeerFlow** 专注于主智能体与子智能体的分层编排，而 **Codex** 和 **Claude Code** 则集成了委托、上下文管理及生命周期控制等成熟机制。然而，这些系统在追求功能扩展时，未能提供一种共享的执行底层：插件、钩子和工作流操作符虽然各自可扩展，但跨不同协调模式集成时会引入碎片化的执行路径和定制化的 orchestration 逻辑，导致每次扩展智能体拓扑都需要耦合到单独的执行架构，这正是 **Structural Composability** 缺失的体现。在运行时行为方面，**Ledger** 通过维护显式执行状态来减少冗余命令，**SWE-AGILE** 和 **SWE-Pruner** 等方法通过压缩或修剪来管理模型可见的上下文。但这些工作主要局限于调整呈现给模型的输入内容，或针对特定的执行状态进行干预，未能将长周期执行中涌现的语义反馈、任务进度信号和可重用经验统一起来。它们缺乏在固定模型策略下，通过动态改变框架控制的运行时状态（如上下文构建、语义反馈注入、任务接受/停止决策及跨任务经验重用）来系统性地引导执行轨迹，导致在执行不确定性高的复杂任务中，模型决策与动态演化的任务状态脱节。", "core_insight": "### § 3 重建作者的思考路径\n\n随着 LLMs 从单轮代码生成演进为 long-horizon coding agents，研究者观察到 agent harness 已不再是简单的工具包装器，而是集成了规划、记忆、验证和多智能体协调的复杂系统层。在尝试构建和扩展这些系统时，研究者发现了两个关键的失败模式：首先，每当引入新的协调模式（如 delegated sub-agents 或 multi-agent flows）时，往往需要编写定制的 orchestration 逻辑，导致执行路径碎片化，这表明纯粹的插件化扩展不足以保证系统的可组合性；其次，在复杂的代码任务中，执行前设定的计划和静态拼接的上下文会随着代码状态改变、测试报错等新证据的涌现而迅速失效，而模型自身无法有效处理这种长程的信息衰减。回顾相关工作，SWE-agent 和 OpenHands 主要关注交互接口与动作空间，DeerFlow 侧重于层级编排，但它们大多将特定能力或工作流硬编码，缺乏将 harness 视为可复用执行基底的理念，也没有系统性地利用运行时证据来调整执行状态。基于这些观察，研究者自然推导出一个思路：要解决长程编码的复杂性问题，必须设计一种架构，既能通过共享的执行语义无缝组合从单 agent 到多 agent 的异构能力，又能让运行时涌现的语义诊断和执行结果直接驱动上下文构建与任务控制，从而在不改变模型参数的前提下实现执行轨迹的动态纠偏。\n\n### § 4 核心 Intuition\n\n先前方法失效的核心在于：将 agent 能力与特定执行逻辑强耦合导致系统扩展困难，且将长程执行视为静态的上下文拼接，忽略了运行中不断涌现的语义证据。本论文的 intuition 是：在底层提供统一的循环执行基底并通过生命周期 hooks 挂载异构能力以实现自由组合，同时在固定 model policy 下，让运行时涌现的代码诊断和执行结果直接驱动上下文压缩、反馈注入和停止决策。这样，agent 既能像搭积木一样扩展结构，又能根据最新证据动态调整框架控制的状态，从而在长程任务中始终保持信息对齐与目标聚焦。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《openJiuwen: Beyond Static Harnesses for Long-Horizon Coding Agents》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出并解决的核心问题是长周期编程智能体在处理不断演化的代码库状态时，所面临的 **Structural Composability**（结构可组合性）与 **Runtime Adaptivity**（运行时自适应能力）双重挑战。随着 LLMs 从单轮代码生成转向需要与代码库、工具及执行环境持续交互的长周期智能体，agent harness 已不再是简单的工具包装器，而是决定各项能力如何组装及执行控制的一等系统层。然而，随着智能体集成规划、记忆、验证、上下文工程、委托和多智能体协调等丰富功能，开发者面临组合和重构复杂执行逻辑的巨大工程成本；同时，复杂编程任务在执行过程中会持续产生新证据（如 semantic diagnostics、执行结果、任务进度），若不能利用这些动态证据调整后续运行时决策，早期决策将逐渐失效并导致任务失败。解决这一问题不仅能显著降低构建复杂智能体系统的集成与编排负担，还能通过动态适应执行轨迹提升复杂编程任务的成功率，为自动化软件工程提供兼具高开发效率与高执行效能的统一 harness 架构。 ### § 2 前人工作与不足 针对智能体架构与运行时控制，前人已有多项探索，但在统一的系统级组合与自适应控制上存在明显不足。在架构与 scaffold 方面，**Pi** 提供了最小化且提供商灵活的运行时，**DeepSeek Harness** 实现了插件级可组合性，**DeerFlow** 专注于主智能体与子智能体的分层编排，而 **Codex** 和 **Claude Code** 则集成了委托、上下文管理及生命周期控制等成熟机制。然而，这些系统在追求功能扩展时，未能提供一种共享的执行底层：插件、钩子和工作流操作符虽然各自可扩展，但跨不同协调模式集成时会引入碎片化的执行路径和定制化的 orchestration 逻辑，导致每次扩展智能体拓扑都需要耦合到单独的执行架构，这正是 **Structural Composability** 缺失的体现。在运行时行为方面，**Ledger** 通过维护显式执行状态来减少冗余命令...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 随着 LLMs 从单轮代码生成演进为 long-horizon coding agents，研究者观察到 agent harness 已不再是简单的工具包装器，而是集成了规划、记忆、验证和多智能体协调的复杂系统层。在尝试构建和扩展这些系统时，研究者发现了两个关键的失败模式：首先，每当引入新的协调模式（如 delegated sub-agents 或 multi-agent flows）时，往往需要编写定制的 orchestration 逻辑，导致执行路径碎片化，这表明纯粹的插件化扩展不足以保证系统的可组合性；其次，在复杂的代码任务中，执行前设定的计划和静态拼接的上下文会随着代码状态改变、测试报错等新证据的涌现而迅速失效，而模型自身无法有效处理这种长程的信息衰减。回顾相关工作，SWE-agent 和 OpenHands 主要关注交互接口与动作空间，DeerFlow 侧重于层级编排，但它们大多将特定能力或工作流硬编码，缺乏将 harness 视为可复用执行基底的理念，也没有系统性地利用运行时证据来调整执行状态。基于这些观察，研究者自然推导出一个思路：要解决长程编码的复杂性问题，必须设计一种架构，既能通过共享的执行语义无缝组合从单 agent 到多 agent 的异构能力，又能让运行时涌现的语义诊断和执行结果直接驱动上下文构建与任务控制，从而在不改变模型参数的前提下实现执行轨迹的动态纠偏。 ### § 4 核心 Intuition 先前方法失效的核心在于：将 agent 能力与特定执行逻辑强耦合导致系统扩展困难，且将长程执行视为静态的上下文拼接，忽略了运行中不断涌现的语义证据。本论文的 intuition 是：在底层提供统一的循环执行基底并通过生命周期 hooks 挂载异构能力以实现自由组合，同时在固定 model policy 下，让运行时涌现的代码诊断和执行结果直接驱动上下文压缩、反馈注入和停止决策。这样，agent 既能像搭积木一样扩展结构，又能根据最新证据动态调整框架控制的状态，从而在长程任务中始终保持信息对齐与目标聚焦。 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：**==\u003E picture [23 x 24] intentionally omitted \u003C==** # **openJiuwen: Beyond Static Harnesses for Long-Horizon Coding Agents** ## **openJiuwen Team** Huawei Technologies Co., Ltd. � **Source Code:** `https://github.com/openJiuwen-ai/jiuwenswarm` ## **Abstract** Long-horizon coding agents operate over evolving repository states while increasingly relying on heterogeneous capabilities, delegated agents, and multi-agent coordination. These trends pose two complementary challenges for the agent harness. First, developers need to compose capabilities, reconfigure execution logic, and scale increasingly complex agent systems without repeatedly rebuilding orchestration. Second, complex coding tasks continuously produce new evidence—such as semantic diagnostics, execution outcomes, task progress, and changing context relevance—that should dynamically influence subsequent runtime decisions. We char...", "additional_insights": "### § 8 Take-aways\n\nopenJiuwen 将 long-horizon coding agent 的 harness 设计问题分解为两个正交维度：Structural Composability（如何组装能力与 agent 拓扑）和 Runtime Adaptivity（如何在执行过程中根据新证据调整行为），并围绕这两个维度构建了统一的执行架构。在 Structural Composability 方面，所有 agent 实例——无论是 standalone、delegated sub-agent 还是 Swarm Flow 中的参与者——共享同一套 Inner Loop/Outer Loop 执行引擎，通过 Rail 机制以 lifecycle hook + priority ordering 的方式挂载横切能力（安全、记忆、规划、context engineering 等），避免了为每种拓扑编写独立执行逻辑。Swarm Flow 通过一组可组合的 coordination operators（`budget()`、`parallel()`、`compact()`、`pipeline()`、`agent_session()`、`human()`、`return`）将多 agent 协调也纳入同一执行语义，而非引入独立的多 agent 框架。在 Runtime Adaptivity 方面，openJiuwen 不修改 model policy π，而是通过四个 framework-controlled 机制调整 runtime state：Context Management 进行 progressive compression、structure-aware reduction 和 offloading/retrieval；Goal Mode 将 semantic completion 与 hard resource limits 分离，支持 self/independent/hybrid assessment；LSP-Driven Passive Feedback 在代码变更后自动注入经过 ranking、deduplication 和 bounding 的语义诊断；Self-Reflection 在任务完成后提取可复用经验并持久化供后续任务检索。在 SWE-bench Verified 上达到 82.6%（超过最强 baseline 3.4 个百分点），在 Terminal-Bench 2.1 上达到 87.19%（超过最强 baseline 3.39 个百分点），且在 SWE-bench 的 1–4 小时任务桶中表现尤为突出（52.38% vs. mini-swe-agent 的 35.71%），论文将此归因于 Context Management 对 context pressure 的缓解。\n\n### § 9 最脆弱的假设\n\n最脆弱的假设是：**openJiuwen 的性能优势主要来自其提出的 Runtime Adaptivity 机制（特别是 Context Management），而非 confounding factors 如更丰富的 out-of-the-box tools、不同的 prompts、或 implementation 细节差异。** 这个假设是核心贡献的实证基石——如果性能提升实际上来自 tool availability 或 prompt engineering 而非 harness 架构设计，那么\"Structural Composability 和 Runtime Adaptivity 是有效的设计原则\"这一论点就失去了实验支撑。\n\n该假设在实际中可能不成立的原因有多层。首先，论文在 Terminal-Bench 的 category 分析中自己承认，file-operations 和 system-administration 类别的优势可能来自\"broad set of out-of-the-box operational tools and the unified execution interface\"，而非 Runtime Adaptivity 机制——这直接构成对核心假设的 confound。其次，所有对比系统（Claude Code、Codex、Terminus 2、live-SWE-agent 等）在 prompts、tools、agent implementation 上各不相同，论文也明确指出结果\"should be interpreted as system-level comparisons rather than controlled estimates of the contribution of the harness alone\"。第三，论文没有提供任何 ablation study——既没有禁用 Context Management 后的性能数据，也没有禁用 LSP-Driven Passive Feedback 或 Self-Reflection 后的对比，因此无法将性能增量归因到任何单一机制。第四，在 SWE-bench 的 1–4 小时任务桶中，论文将 openJiuwen 的优势归因于 Context Management 缓解了 high reasoning effort 带来的 context pressure，但既没有测量实际的 context occupancy 或 token usage，也没有与\"使用相同 Context Management 但禁用其他 Runtime Adaptivity 机制\"的配置进行对比。论文提供的唯一\"证据\"是跨系统的 duration-bucket 对比和作者的系统级解释，缺少对单个机制的隔离验证。\n\n### § 10 最小复现实验\n\n利用 openJiuwen 的开源代码（`https://github.com/openJiuwen-ai/jiuwenswarm`），在 1 周内可以验证 Context Management 对 long-horizon 任务贡献这一具体 claim。从 SWE-bench Verified 中选取 estimated fix duration 为 1–4 小时的 42 个任务作为评估集（论文 Table 4 已提供该桶的 baseline 数据），使用 Claude Opus 4.5 high reasoning effort 作为 backbone model。实现两组配置：第一组为完整的 openJiuwen 系统（Context Management 启用），第二组禁用 Context Management 的 progressive compression 和 structure-aware reduction（即保留完整 interaction history 的 naive concatenation，仅在超出 context window 时做截断）。两组配置使用相同的 prompts、tools 和 model settings，仅切换 Context Management 模块。测量指标为 Pass@1（官方 test suite 判定），并记录每个任务的 context occupancy trajectory 和实际执行的 Outer Loop rounds 数。如果 Context Management 确实是 long-horizon 性能的关键驱动因素，则禁用组在 1–4 小时桶上的 Pass@1 应显著低于启用组（论文报告的 52.38%），且差距应明显大于在 \u003C15 分钟桶上的差距（因为短任务本身不太触发 context pressure）。如果两组在 1–4 小时桶上的 Pass@1 无显著差异，或差异与短任务桶上的差异相当，则反驳了\"Context Management 是 long-horizon 任务性能提升的关键机制\"这一 claim，表明性能优势可能来自其他 harness 因素或 model capability 本身。", "research_value": "### § 11 最强反例设计\n\n要对该论文进行最有力的攻击，我会设计一个**“延迟依赖解析”**的真实世界场景实验，直接挑战 Context Management 中 progressive compression 和 structure-aware reduction 的核心有效性。论文声称其在 1–4 小时 long-horizon 任务中的优势归因于 Context Management 缓解了 context pressure，但其最脆弱的隐患在于：压缩机制不可避免地会丢弃早期看似无关的细节。我会在 SWE-bench Verified 中筛选或构造一类特殊任务：这类任务的最终解决阶段（例如第 3 小时）强依赖于早期探索阶段（例如前 30 分钟）产生的一个非显性线索——比如某次失败的 `npm test` 输出中隐藏的特定 deprecation warning，或者某个被早期跳过的底层配置文件的特定版本号。实验设置两组：第一组为完整的 openJiuwen 系统（启用 progressive compression），第二组禁用所有压缩，仅依赖超长上下文窗口（如 1M tokens 的 Claude Opus 4.5）进行 naive concatenation。如果 openJiuwen 的 Context Management 真的是通过“智能压缩”而非“简单丢弃”来维持性能，那么它在最终阶段应该能保留或检索到这些早期非显性线索。然而，我预测在延迟依赖解析任务上，启用压缩的 openJiuwen 会表现出显著的性能断崖，其 Pass@1 将大幅低于 naive concatenation 组。这一反例不仅提供了具体的替代解释——即 openJiuwen 在 1–4 小时任务上的高成功率可能是因为该任务子集中早期线索与晚期解决的耦合度较低，而非 Context Management 具备无损的语义保留能力——还识别出了该方法在“信息衰减与关键证据延迟激活”冲突下可预测的失败条件。\n\n### § 12 Follow-up Research Idea\n\n基于 openJiuwen 依赖静态启发式规则（如 lifecycle hook + priority ordering）进行 Runtime Adaptivity 的核心局限，我提出一个全新的研究方向：**基于 Trajectory-level Process Reward Model (PRM) 的 Learned Harness Control**。\n\n**(a) 驱动局限与未满足需求：** openJiuwen 的 Rail 机制和 Swarm Flow operators 虽然实现了 Structural Composability，但其 Runtime Adaptivity（何时压缩、注入何种 LSP feedback、何时停止任务）完全依赖人工预设的阈值与规则。这种静态控制逻辑无法适应不同代码库拓扑和模型动态认知瓶颈，且论文中缺乏 ablation study 的问题正源于此——我们无法知道是哪条规则在何时起作用。我们需要一个能根据执行轨迹动态学习并输出最优 harness 控制动作的系统。\n\n**(b) 借鉴相邻领域：** 借鉴数学推理与机器人控制领域的 Process Reward Models (PRMs) 和 Meta-Reinforcement Learning。将 harness 的控制决策（如 `compact()`, `agent_session()`, context offloading）建模为离散的动作空间，利用执行轨迹的中间状态作为观测，通过预测任务最终成功率的 PRM 来提供密集的 step-level reward，从而学习一个轻量级的 orchestrator policy。\n\n**(c) 第一个实验设计：** 首先收集 openJiuwen 在 SWE-bench Verified 上的大量执行轨迹，包括每一步的 context occupancy、LSP diagnostics 状态以及 harness 采取的控制动作。训练一个 Trajectory-level PRM，使其能够在任意中间步骤预测当前 context state 和 action 导致最终 Pass@1 的概率。随后，使用该 PRM 作为 reward function，通过 offline RL 训练一个轻量级 orchestrator（如一个微调的 8B 模型或 Q-network）。在评估阶段，冻结 backbone LLM 的 model policy π，仅用学到的 orchestrator 替换 openJiuwen 的静态 Rails 来决定何时触发 context compression 或 sub-agent delegation。对比 Learned Harness Control 与原始静态 Rails 在 1–4 小时 long-horizon 任务桶上的表现，重点观察前者是否能通过动态推迟压缩时机或选择性保留非显性线索来避免早期关键信息的丢失。\n\n**(d) 与已有工作的区分：** 现有的 agent 框架（如 LangGraph、AutoGen 或 openJiuwen）均将 orchestration 逻辑硬编码为 workflow 或 static hooks；而本提议将“框架控制逻辑”本身转化为一个可学习的策略网络，实现了从“手工编写执行脚手架”到“数据驱动学习执行脚手架”的范式转移。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"openJiuwen Team\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Tao Yu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xinyu Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Qianqian Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiaoneng Xiang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Chia Kwangyang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xingchen Huang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ran Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yangkai Ding\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zheng Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yeo Boon Hong\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Bingzheng Gan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Enrui Hu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shuo Cheng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Deyang Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ruifeng Shi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hongbo Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Qi Ye\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xuefeng Jin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhangchun Zhao\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Huawei Technologies Co., Ltd.\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "Long-horizon coding agents 在不断演进的 repository 状态上运行，同时越来越依赖于异构能力、delegated agents 以及多 agent 协调。这些趋势对 agent harness 提出了两个互补的挑战。首先，开发者需要组合能力、重新配置执行逻辑，并扩展日益复杂的 agent 系统，而无需重复重建 orchestration。其次，复杂的 coding 任务不断产生新的证据——例如 semantic diagnostics、执行结果、任务进度以及不断变化的 context 相关性——这些证据应该动态地影响后续的 runtime 决策。我们将这些挑战刻画为 Structural Composability 和 Runtime Adaptivity。我们提出了 openJiuwen，这是一个专为开发者可组合性和自适应任务执行而设计的开源 harness。openJiuwen 提供了共享执行 substrate 和跨 single agents、delegated sub-agents 以及 Swarm Flow 的 Rail-based capability composition，使开发者能够在共同的执行语义下构建复杂的 agent harness。它进一步围绕固定的 model policy 调整框架控制的 runtime 决策，允许不断演进的证据动态影响 context、feedback 和 task control，以成功完成任务。我们在 SWE-bench Verified 和 Terminal-Bench 2.1 上系统地评估了 openJiuwen，其分别取得了 82.6% 和 87.19% 的成绩，超出所选最强官方排行榜点估计 3.4 和 3.39 个百分点。这些结果表明，openJiuwen 在复杂的 coding 任务上取得了优异的性能，同时提供了可组合且自适应的 harness 设计。"}]}, {"name": "Context \u0026 Memory Management", "count": 2, "papers": [{"title": "ContextPilot: Teaching Agents for Proactive Context Management via Fine-grained RL", "arxiv_id": "2608.28476", "authors": "Zhuoshi Pan, Qizhi Pei, Junru Lu, Honglin Lin, H. Vicky Zhao, Di Yin, Xing Sun", "summary": "Long-horizon agentic tasks require large language models (LLMs) to iteratively retrieve, integrate, and maintain dispersed information across multi-turn interactions, but preserving all interaction histories leads to a continuously growing working context. Recent proactive context management methods allow models to edit their own working context with specialized tools, yet they still face three key limitations: (1) a limited toolset restricted to search, deletion, and summarization, with no support for global planning, long-term memory, and adaptive compression; (2) inefficient exploration that treats context management actions uniformly despite their heterogeneous impacts on final outcomes; and (3) coarse-grained credit assignment that assigns the final trajectory-level reward to all intermediate context editing actions during RL. To bridge these gaps, we introduce ContextPilot, a proactive context management framework for long-horizon agentic reasoning. Our approach systematically augments the toolset with planning, long-term memory, and soft context offloading tools. We further propose an RL method tailored for context management, which uses context and entropy variation to identify critical editing decisions for branch sampling and estimates action-level advantages from all branched trajectories that pass through the corresponding context editing action. Experiments on long-context QA and deep search tasks show that ContextPilot achieves stronger performance with a more compact working context, consistently outperforming existing baselines across various base models and benchmarks. Code is available at https://github.com/Tencent/ContextPilot.", "category": "cs.CL", "cluster": "Context \u0026 Memory Management", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是提出了 ContextPilot，一个针对长周期智能体任务的主动上下文管理框架。论文不仅扩展了智能体的工具集（引入全局规划、长期记忆和软上下文卸载工具），还提出了一种专门针对上下文管理的细粒度强化学习方法，用于识别关键编辑决策并估计动作级别的优势。这直接对应了你的研究焦点中的“单智能体”方向，特别是智能体的规划、记忆、工具使用和训练机制。此外，论文明确以 Long-horizon agentic tasks 和 LLM Agents 为研究对象，属于构建和改进 LLM 智能体能力的新框架与方法论，符合第一步核心判断中的保留条件，且不涉及任何排除标准（如安全、多模态、图技术或纯系统工程）。因此，该论文与你的研究范围高度相关。", "intro_logic": "### § 1 研究问题与重要性\n\n本文聚焦于长周期 agentic tasks 中的 proactive context management 问题。在 long-context QA 和 deep search 等任务中，LLM-based agent 需要跨多轮交互迭代检索、整合并维护分散的信息，而 prevailing paradigms 如 ReAct 会将所有历史 reasoning、tool calls 和 observations 持续追加到 working context 中，导致 context 单调膨胀。这种 context overload 不仅消耗 token budget，还会引入噪声、降低后续决策质量。本文要解决的核心问题是：如何让 agent 具备真正主动的 context 管理能力——不仅能删除和总结，还能进行 global planning、构建 long-term memory、执行 adaptive compression，并且在 RL training 中对这些异质性的 context editing actions 进行差异化的探索和精细化的 credit assignment。这个问题的重要性在于，随着 agentic reasoning 向更长 horizon 延伸，context 管理质量直接决定了 agent 能否在有限 budget 内维持有效推理，而现有方法在 tool 设计和训练范式两个维度上都存在结构性缺陷。解决这一问题带来的价值是双重的：在性能层面，agent 能以更 compact 的 working context 取得更强表现；在训练层面，fine-grained credit assignment 为 context editing actions 提供了更稳定的 reward signal，使 RL 能有效优化中间管理决策而非仅依赖稀疏的 trajectory-level reward。\n\n### § 2 前人工作与不足\n\n该问题此前已被部分触及，但现有方案在 tool 设计和训练范式上均存在关键不足。在 passive context management 方向上，早期工作如基于固定规则的 truncation 和 summarization 方法（包括 training-free 的 workflow 方案以及将 context folding 融入 RL 的 FoldAct 等）虽然能压缩 context 长度，但模型始终是规则管理的被动接受者，无法自主决定 when 和 how 管理自身 context，且固定规则难以适配不同场景。在 proactive context management 方向上，MemGPT 将 agent memory 视为 virtual memory 并通过 tool calls 管理，StateLM、Sculptor 和 AgentFold 等进一步为模型提供 search、deletion、summarization 等 context editing tools 并通过 SFT 或 RL fine-tuning 训练模型使用这些工具。然而，这些 prior methods 存在三层不足。第一，toolset 局限于 search、deletion 和 summarization 等基本操作，缺乏对 global planning、long-term memory 和 adaptive compression 的支持——这是因为此前工作将 context management 窄化为\"压缩历史\"，而忽视了长周期任务中跨片段信息组织、结构化 entity-event episode 维护和全局策略规划的需求。第二，RL training 采用传统的 trajectory-level rollout，对所有 context management actions 施加均等的探索预算——但本文 Figure 2 的 pilot study 表明，不同 context editing actions 对最终成功率的方差影响差异巨大（如 readChunk 的标准差为 2.79 而 finish 仅 0.74），说明某些操作远比其他操作敏感，uniform exploration 导致关键决策探索不足而非关键决策浪费预算。第三，credit assignment 过于粗粒度：现有方法将最终 trajectory-level reward 直接分配给所有中间 context editing actions，但 Figure 3 的 case study 显示 task correctness 与 context management quality 存在系统性错位——正确答案可能依赖低效的重复检索，而错误答案可能伴随合理的管理决策——这种 coarse-grained assignment 会 reinforce 低效行为并 penalize 合理决策。这三个不足的根源在于：此前工作未将 context management 视为一个具有异质性影响的序列决策问题，而是将其简化为统一的工具调用问题，从而在 tool 设计上缺乏全局视角、在训练范式上缺乏对 action-level 影响差异的建模。", "core_insight": "### § 3 重建作者的思考路径\n\n在长程agentic tasks中，LLMs需要多轮交互与检索，导致working context不断膨胀。早期的passive context management依赖人工预设的截断或summarization规则，模型失去了对自身context的控制权，难以适应复杂多变的任务需求。随后，proactive context management范式应运而生，允许模型通过search、delete、summarize等工具主动编辑context。然而，沿着这一范式前进时，会逐渐触及能力与训练机制的双重瓶颈。\n\n在能力层面，长程任务不仅需要删减冗余，更要求模型能跨片段建立long-term memory、进行全局planning以及自适应的soft context offloading，仅靠现有的基础工具集无法支撑复杂的推理需求。在训练机制层面，当尝试用RL来优化模型使用这些context editing tools时，会发现传统的trajectory-level rollout存在严重的效率与归因缺陷。一方面，不同的context管理动作对最终结果的影响是异构的（例如delete与plan的敏感度截然不同），对所有动作分配相同的探索预算不仅浪费算力，还会在关键决策处探索不足。另一方面，任务的最终成败与中间的context管理质量存在错配——一个靠反复检索碰巧成功的轨迹，其context管理可能是低效的；而一个失败轨迹中的context管理动作可能是合理的。如果直接将稀疏的trajectory-level reward分配给所有中间动作，不仅会强化低效行为，还会惩罚合理的决策。\n\n基于这些观察，自然的推演方向就是：首先，必须大幅扩充context management toolset，引入planning、memory和offloading机制以匹配长程任务的真实需求；其次，必须重构RL的训练逻辑，利用context variation和entropy变化来识别高影响动作，并在这些动作处进行branch sampling（partial rollout）；最后，将完整的trajectory在context editing处切分为独立的trajectory snapshots，利用所有经过该snapshot的后续分支奖励来估算该动作的真实价值，从而实现细粒度的action-level credit assignment。\n\n### § 4 核心 Intuition\n\n长程任务中不同的context编辑动作对最终结果的影响是异构的，且任务的最终成败与中间的context管理质量往往存在错配。因此，该方法的核心在于：一方面通过引入planning、long-term memory和soft offloading工具赋予模型结构化管理context的能力；另一方面在RL训练中，利用context与entropy的波动精准定位高影响动作并进行重点分支探索，同时将轨迹级奖励分解为基于snapshot的细粒度action-level奖励，用多条分支的平均回报来准确评估单个context编辑动作的真实优劣。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《ContextPilot: Teaching Agents for Proactive Context Management via Fine-grained RL》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 本文聚焦于长周期 agentic tasks 中的 proactive context management 问题。在 long-context QA 和 deep search 等任务中，LLM-based agent 需要跨多轮交互迭代检索、整合并维护分散的信息，而 prevailing paradigms 如 ReAct 会将所有历史 reasoning、tool calls 和 observations 持续追加到 working context 中，导致 context 单调膨胀。这种 context overload 不仅消耗 token budget，还会引入噪声、降低后续决策质量。本文要解决的核心问题是：如何让 agent 具备真正主动的 context 管理能力——不仅能删除和总结，还能进行 global planning、构建 long-term memory、执行 adaptive compression，并且在 RL training 中对这些异质性的 context editing actions 进行差异化的探索和精细化的 credit assignment。这个问题的重要性在于，随着 agentic reasoning 向更长 horizon 延伸，context 管理质量直接决定了 agent 能否在有限 budget 内维持有效推理，而现有方法在 tool 设计和训练范式两个维度上都存在结构性缺陷。解决这一问题带来的价值是双重的：在性能层面，agent 能以更 compact 的 working context 取得更强表现；在训练层面，fine-grained credit assignment 为 context editing actions 提供了更稳定的 reward signal，使 RL 能有效优化中间管理决策而非仅依赖稀疏的 trajectory-level reward。 ### § 2 前人工作与不足 该问题此前已被部分触及，但现有方案在 tool 设计和训练范式上均存在关键不足。在...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在长程agentic tasks中，LLMs需要多轮交互与检索，导致working context不断膨胀。早期的passive context management依赖人工预设的截断或summarization规则，模型失去了对自身context的控制权，难以适应复杂多变的任务需求。随后，proactive context management范式应运而生，允许模型通过search、delete、summarize等工具主动编辑context。然而，沿着这一范式前进时，会逐渐触及能力与训练机制的双重瓶颈。 在能力层面，长程任务不仅需要删减冗余，更要求模型能跨片段建立long-term memory、进行全局planning以及自适应的soft context offloading，仅靠现有的基础工具集无法支撑复杂的推理需求。在训练机制层面，当尝试用RL来优化模型使用这些context editing tools时，会发现传统的trajectory-level rollout存在严重的效率与归因缺陷。一方面，不同的context管理动作对最终结果的影响是异构的（例如delete与plan的敏感度截然不同），对所有动作分配相同的探索预算不仅浪费算力，还会在关键决策处探索不足。另一方面，任务的最终成败与中间的context管理质量存在错配——一个靠反复检索碰巧成功的轨迹，其context管理可能是低效的；而一个失败轨迹中的context管理动作可能是合理的。如果直接将稀疏的trajectory-level reward分配给所有中间动作，不仅会强化低效行为，还会惩罚合理的决策。 基于这些观察，自然的推演方向就是：首先，必须大幅扩充context management toolset，引入planning、memory和offloading机制以匹配长程任务的真实需求；其次，必须重构RL的训练逻辑，利用context variation和entropy变化来识别高影响动作，并在这些动作处进行branch sampling（partial r... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：ContextPilot **==\u003E picture [150 x 25] intentionally omitted \u003C==** # **ContextPilot: Teaching Agents for Proactive Context Management via Fine-grained RL** Zhuoshi Pan[1,2] _[ ♣]_ , Qizhi Pei[3] _[ ♣]_ , Junru Lu[2] , Honglin Lin[3] , H. Vicky Zhao[1] _[ ♡]_ , Di Yin[2] , Xing Sun[2] _[ ♡]_ 1Tsinghua University 2Tencent Youtu Lab 3Shanghai AI Lab Long-horizon agentic tasks require large language models (LLMs) to iteratively retrieve, integrate, and maintain dispersed information across multi-turn interactions, but preserving all interaction histories leads to a continuously growing working context. Recent proactive context management methods allow models to edit their own working context with specialized tools, yet they still face **three key limitations** : (1) a _limited toolset_ restricted to search, deletion, and summarization, with no support for global planning, long-term memory, an...", "additional_insights": "### § 8 Take-aways\n\nContextPilot 针对长程 agentic 任务中 context 持续增长的问题，将 proactive context management 的 toolset 从基本的 search/delete/summarize 扩展到包含 planning、long-term memory（结构化 entity-event episode 提取与图边连接）、以及 soft context offloading（summarizeContext、compressContext、foldHistory）三类新工具，使 agent 能在 32K context window 内处理原本需要 128K 甚至更长 context 的任务。在 RL 训练层面，论文提出 context-aware partial rollout：通过计算每个 context management action 的 context variation（context 长度变化量）和 entropy variation（模型输出 entropy 相对于 trajectory 初始状态的变化量）的加权和作为 sensitivity score，对高 sensitivity 的 action 分配更多 branch sampling 预算，而非对所有 action 均匀探索。在 credit assignment 层面，论文将 trajectory 在 context editing 操作处切分为 trajectory snapshots，对每个 intermediate snapshot 用所有经过它的 terminal trajectories 的平均 reward 估计其 value，而非直接将 trajectory-level reward 分配给所有 intermediate actions，Appendix A 证明该估计量在 conditional independence 假设下是 lower-variance unbiased estimator。实验在 long-context QA（NovelQA、∞Bench、LongMemEval-S、BrowseComp+）和 deep search（GAIA、BrowseComp、BrowseComp-ZH、xBench-DeepSearch）两类任务上验证，ContextPilot-8B-RL 以 32K context 超越 128K backbone 的 Qwen3-8B，且在 token efficiency 上将每轮 input length 稳定在 8K–10K tokens，而 WebExplorer-8B 线性增长至 30K。Ablation 表明 entropy-only partial rollout 不稳定（BrowseComp+ 下降 1.32 点），加入 context variation 后稳定，fine-grained credit assignment 在四个 benchmark 上均带来额外提升（+0.83 至 +3.10 点）。\n\n### § 9 最脆弱的假设\n\n整个方法的核心假设是：**context variation 和 entropy variation 构成的 sensitivity score 能够有效识别\"对最终结果影响最大\"的 context management actions**，从而为 partial rollout 的 branching point 选择提供可靠依据。这个假设是 context-aware partial rollout 的基石，而 partial rollout 又是 fine-grained credit assignment 的前提——如果没有足够多的 branched trajectories 经过某个 snapshot，该 snapshot 的 reward 估计就退化为单样本 trajectory-level 估计，variance reduction 的理论保证（Appendix A 中 $n_S \u003E 1$ 的条件）就不成立。\n\n这个假设在实践中可能不成立的原因有三：第一，context variation 本质上衡量的是 context 长度的变化量，但一个 action 的重要性未必与它引起的长度变化正相关——例如 `memorize` 可能只增加少量 token 但记录了关键信息，而 `foldHistory` 大幅缩减 context 但可能丢失关键细节，两者的 sensitivity score 与实际重要性可能严重错配。第二，entropy variation 作为 uncertainty signal 的有效性依赖于\"高 entropy = 高决策不确定性 = 高影响力\"这一链条，但 entropy 也可能由无关因素驱动（如工具描述格式变化导致的 token 分布偏移），尤其在 SFT 后模型对某些工具的调用模式已经固化，entropy 变化可能无法反映真正的决策敏感性。第三，论文将 $\\alpha=1, \\beta=1$ 作为默认权重，但两个指标的量纲和分布可能完全不同，简单的等权求和可能被其中一个指标主导。\n\n论文提供的证据是 Figure 2，展示了不同工具类型的 success rate standard deviation 确实存在差异（readChunk 为 2.79，finish 为 0.74），但这只验证了**不同工具类型之间**的影响差异，并未验证**同一工具类型内不同调用实例**之间的影响差异——而 partial rollout 需要在同一 trajectory 内对不同调用实例做排序和选择。此外，论文没有直接验证 sensitivity score 与实际 success rate variance 之间的相关性，Table 5 的 ablation 只展示了最终性能，没有展示 branching point 选择的准确率或 sensitivity score 与 ground-truth impact 的 rank correlation。如果 sensitivity score 与实际影响不相关，partial rollout 退化为随机 branching，其相对于 uniform rollout 的优势将消失。\n\n### § 10 最小复现实验\n\n在一周时间内，最有价值且不需要训练任何模型的最小实验是验证 Figure 2 的核心观察：**不同 context management actions 对最终结果的影响确实存在显著异质性**，这是 partial rollout 和 fine-grained credit assignment 的共同前提。\n\n具体方案：使用 Qwen3-8B（w/ tools，即 prompt-only baseline，论文中已有该配置的 checkpoint）作为 agent，在 NovelQA 的 Copyright split 上随机抽取 50 个样本生成 trajectories。对每个 trajectory 中的每个 context management action（search、readChunk、deleteContext、summarizeContext 等），从该 action 的 parent node 出发采样 10 条 continuation rollout（temperature 0.7，top-p 0.8），计算每条 continuation 的 task success rate，再计算该 action 处 10 条 continuation 的 success rate standard deviation。最终按工具类型聚合，绘制类似 Figure 2 的 bar chart。\n\n测量指标是每种工具类型的平均 success rate standard deviation 以及同一工具类型内的 instance-level variance。如果不同工具类型之间的 standard deviation 差异显著（如 readChunk 的 std 显著高于 finish），且同一工具类型内不同调用实例的 std 也有足够 spread，则支持\"actions 的影响是 heterogeneous 的\"这一假设，为 partial rollout 提供了 motivation。如果所有工具类型的 std 接近一致（例如都在 1.0–1.5 范围内），或者同一工具类型内 instance-level variance 极小，则反驳了该假设——意味着 uniform exploration 已经足够，partial rollout 的 branching point 选择机制没有实际意义。\n\n这个实验只需要 inference（50 个样本 × 平均 20 个 actions × 10 条 continuation ≈ 10K 次 LLM 调用），用单张 A100 约需 2–3 天，完全在一周预算内。它直接测试了方法设计的 empirical foundation，而不需要复现完整的 SFT + RL pipeline。", "research_value": "### § 11 最强反例设计\n\n要对该论文进行最有力的攻击，我会在 deep search 任务中设计一个“信息密度倒挂”的对抗性场景，直接挑战其 sensitivity score 的有效性。具体而言，构造一类需要跨多轮检索并精确提取极短关键实体（如特定密码、人名或时间戳）的 QA 任务，在此场景中，正确的策略是使用 `memorize` 工具将关键信息存入 long-term memory，该操作仅增加极少 token（极低的 context variation），且由于模型经 SFT 后对提取操作已高度确信（极低的 entropy variation）。相对地，agent 可能会频繁调用 `foldHistory` 或 `compressContext` 来处理冗长的搜索观察结果，这些操作大幅削减 context 长度（极高的 context variation）并伴随着内容取舍的不确定性（较高的 entropy variation）。按照 ContextPilot 的 $\\alpha=1, \\beta=1$ 加权逻辑，系统会错误地将大量 branch sampling 预算分配给 `foldHistory` 等压缩操作，而忽略了对任务成败起决定性作用的 `memorize` 操作。这会导致关键信息提取节点的 branched trajectories 数量不足（$n_S \\approx 1$），使其 fine-grained credit assignment 退化为高方差的 trajectory-level 估计，最终 reinforce 了“频繁压缩历史而忽略关键信息记录”的错误策略。如果在这个对抗性 benchmark 上，ContextPilot-RL 的表现不仅不如 uniform rollout baseline，甚至低于仅使用 SFT 的版本，就能确凿证明其 sensitivity score 不仅无效，反而会系统性地误导 RL 探索方向。此外，这一反例还提供了一个强有力的替代解释：论文在标准 benchmark 上声称的性能提升，可能并非源于 fine-grained RL 的有效探索，而仅仅是因为引入了更丰富的 toolset（planning 和 memory tools）在 SFT 阶段带来的被动收益，一旦任务需求与 context variation 的启发式指标错配，其 RL 框架的结构性缺陷就会暴露无遗。\n\n### § 12 Follow-up Research Idea\n\n驱动这一 follow-up 研究的核心局限是：ContextPilot 试图用启发式的 proxy（context 和 entropy variation）来近似 context editing actions 的重要性，但这种基于观测指标的排序本质上无法捕捉 action 对最终任务的 causal impact，尤其在信息密度与 token 变化量不对齐时必然失效。为了彻底解决这一问题，我们可以借鉴因果推断中的 Individual Treatment Effect (ITE) 估计理论，提出一种基于 Counterfactual Context Intervention 的全新 RL 训练范式，将 context management 从“基于敏感度的分支采样”重构为“基于反事实干预的因果效应估计”。在这个新框架下，我们不再计算 action 的 sensitivity score，而是对 trajectory 中的每个 context editing action 生成一条 counterfactual trajectory：将该 action 替换为一个 no-op（不操作）或 default summarization，保持其余 prefix 严格不变并进行单次 rollout。通过对比 factual trajectory 和 counterfactual trajectory 的最终 reward 差异，我们直接计算出该 action 的 Individual Causal Effect。这种做法将 credit assignment 从“基于经过该节点的平均回报”转变为“基于该节点干预后的边际收益”，从根本上消除了 trajectory-level reward 的 credit misassignment 问题。第一个实验将聚焦于验证这种因果估计的鲁棒性：在包含前述“信息密度倒挂”场景的混合 benchmark 上，我们对比 ContextPilot 的 sensitivity score ranking 与 counterfactual ITE ranking 的 Spearman correlation，并比较两者在 RL 训练后的 sample efficiency。如果 counterfactual intervention 方法在低 context variation 但高 causal impact 的 actions 上展现出显著更低的 false negative rate，并在最终 task success rate 上超越 ContextPilot，就能证明将因果推断引入 context management 是一条比启发式 proxy 更本质、更可靠的路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zhuoshi Pan\", \"affiliations\": [1, 2], \"markers\": [\"♣\"]},\n    {\"name\": \"Qizhi Pei\", \"affiliations\": [3], \"markers\": [\"♣\"]},\n    {\"name\": \"Junru Lu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Honglin Lin\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"H. Vicky Zhao\", \"affiliations\": [1], \"markers\": [\"♡\"]},\n    {\"name\": \"Di Yin\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Xing Sun\", \"affiliations\": [2], \"markers\": [\"♡\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Tsinghua University\"},\n    {\"id\": 2, \"name\": \"Tencent Youtu Lab\"},\n    {\"id\": 3, \"name\": \"Shanghai AI Lab\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"♣\", \"text\": \"Equal Contribution\"},\n    {\"marker\": \"♡\", \"text\": \"Corresponding Authors.\"}\n  ]\n}\n```", "summary_translation": "长程 agentic tasks 要求 LLMs 在多轮交互中迭代地检索、整合和维护分散的信息，但保留所有交互历史会导致 working context 持续增长。最近的 proactive context management 方法允许模型使用专门的工具编辑其自身的 working context，但它们仍面临三个关键局限性：(1) 工具集受限，仅限于 search、deletion 和 summarization，不支持 global planning、long-term memory 和 adaptive compression；(2) 探索效率低下，尽管 context management actions 对最终结果的影响存在异质性，但仍对其统一处理；(3) 粗粒度的 credit assignment，在 RL 期间将最终的 trajectory-level reward 分配给所有中间的 context editing actions。为了弥补这些差距，我们引入了 ContextPilot，这是一个用于长程 agentic reasoning 的 proactive context management 框架。我们的方法通过 planning、long-term memory 和 soft context offloading 工具系统地增强了工具集。我们进一步提出了一种为 context management 量身定制的 RL 方法，该方法使用 context 和 entropy variation 来识别用于 branch sampling 的关键编辑决策，并从所有经过相应 context editing action 的 branched trajectories 中估计 action-level advantages。在 long-context QA 和 deep search 任务上的实验表明，ContextPilot 以更紧凑的 working context 取得了更强的性能，在各种 base models 和 benchmarks 上始终优于现有的 baselines。代码可在 https://github.com/Tencent/ContextPilot 获取。"}, {"title": "What Makes Agent Memory Useful for Reliable Unanswerable Question Handling?", "arxiv_id": "2608.27924", "authors": "Chuanyuan Tan, Junjie Yu, Yuxin Wang, Yining Zheng, Xipeng Qiu, Wenliang Chen", "summary": "Reliable handling of unanswerable questions (UAQs) is critical for trustworthy LLM-based agents. Although memory is widely used in agent systems, its role in reliable UAQ handling remains unclear. We present a systematic study of agent memory for UAQ handling under a unified agentic RAG framework, evaluating four representative memory methods across three UAQ-related datasets and two base models. We find that memory can improve UAQ performance in some settings, but such gains are selective rather than universal and remain fragile under dataset shift. Interestingly, cross-model memory reuse is often more feasible than cross-dataset transfer, suggesting that shifts in answerability patterns pose a greater challenge to memory reuse than changes in the base model itself. We further find that UAQ gains are more strongly preserved through decision guidance than through trajectory shaping, and that memory effectiveness depends strongly on representation. In particular, procedural and rule-based memories often provide the most reliable support for UAQ handling, while memory composition is most effective when procedural guidance is combined with complementary behavioral signals. Overall, our findings suggest that reliable UAQ memory depends less on storing larger amounts of experience and more on preserving transferable behavioral guidance.", "category": "cs.CL", "cluster": "Context \u0026 Memory Management", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=53 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是对 LLM 智能体中的“记忆”机制进行了系统性的行为分析和评估。论文在统一的 Agentic RAG 框架下，评估了四种代表性的记忆方法在处理不可回答问题时的表现，深入分析了记忆的跨模型复用、跨数据集迁移以及不同记忆表示（如程序性记忆和规则性记忆）对智能体决策的有效性。根据筛选标准第一步中的规定：“如果论文的研究对象明确是 LLM Agents...即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。” 该研究明确聚焦于智能体的核心能力之一——记忆机制，其结论能够直接指导未来智能体记忆模块的设计与改进。因此，它完全符合“单智能体：记忆”这一研究方向，应予保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出两个核心研究问题：**RQ1**——现有的 agent memory 方法在 in-distribution 条件下以及跨数据集、跨 base model 迁移时，是否能可靠地提升 unanswerable question (UAQ) 处理性能？**RQ2**——当 memory 确实有效时，哪些类型的 memory content、content composition 以及成功/失败经验来源对可靠的 UAQ 处理最有用？这两个问题的重要性源于 LLM-based agents 在可靠性敏感场景中的广泛部署与现实困境。UAQs 涵盖 false premises、non-existent entities、insufficient evidence 和 unresolved ambiguity 等情形，一个可信赖的系统不应产生幻觉式回答，而应拒绝无支撑的请求、在歧义时主动澄清、或在证据不足时谨慎行事。在 agentic settings 中，这一挑战进一步复杂化：agent 必须在多轮交互中做出 sequential decisions——是继续检索证据、质疑潜在 false premise、请求澄清，还是在证据仍然不足时主动放弃。这使 UAQ handling 从单纯的 answer generation 问题转变为一个涉及信息获取与行为调控的联合可靠性问题。Agent memory 通过将先前的交互经验蒸馏为可复用的 decision guidance，天然适合提供此类行为策略（如 evidence-seeking 策略、失败教训、何时回答/澄清/放弃的判据），但同时也可能传播误导性 heuristics、放大 dataset-specific 的 answerability patterns 或导致过度保守行为。因此，系统厘清 memory 是否可靠有效、为何有效以及应存储何种经验，对于设计 trustworthy LLM-based agents 具有直接的实践价值和理论意义。\n\n### § 2 前人工作与不足\n\nUAQ 研究此前主要沿三条路径推进。第一，benchmark 建设方面，Liu et al. (2024)、Amayuelas et al. (2024) 和 Zhu et al. (2025b) 构建了表征不同 unanswerability 形式的数据集，为评估提供了基础，但这些 benchmark 面向 standalone LLMs 或传统 QA 系统，未涉及 agent 在多轮工具交互中的 sequential decision-making。第二，方法层面，prompting 方法（Kim et al., 2025）提供静态的 task-level 指令，无法适应 agent 在证据不确定或无效时需要动态调整策略的需求；training 方法（Zhu et al., 2025a）将 behavioral preferences 编码进 model parameters，更新成本高且难以 inspect；retrieval-based 方法（Peng et al., 2025）主要供给外部证据，而非关于\"当证据不确定或无效时如何行动\"的可复用行为指导。这三种方法均未刻画 agentic settings 下 UAQ 可靠性的全貌——在该设置中，agent 需要自主决定是否继续搜索、是否质疑前提、是否请求澄清或是否放弃。第三，agent memory 领域的研究（Expel (Zhao et al., 2024)、MemEvolve (Zhang et al., 2025)、AWM (Wang et al., 2024)、AgentKB (Tang et al., 2025)）主要关注 task success 和 execution efficiency，近期工作虽开始分析 memory structure (Zeng et al., 2024)、representation (Feng et al., 2026) 和 transferability (Hu et al., 2026a)，但从未将 memory 与 UAQ reliability 建立联系。具体而言，前人未研究这一问题的根本原因是：UAQ 研究社区聚焦于 standalone models 的 refusal/clarification 行为，而 agent memory 研究社区聚焦于可回答任务的性能优化，两个方向之间存在研究空白。此外，memory 对 UAQ 的影响具有双面性——既可能提供行为指导，也可能传播误导性 heuristics 或诱发过度保守——这种复杂性使得\"memory 是否可靠有效\"本身成为一个需要严格实证检验的开放问题，而非可以默认成立的假设。本文正是通过在统一的 agentic RAG framework 下进行 controlled empirical study，系统填补了这一空白。", "core_insight": "### § 3 重建作者的思考路径\n\n从已有背景出发，UAQ handling 的研究此前主要集中在 standalone LLM 和传统 QA 系统上，通过 prompting 提供静态指令、training 将行为偏好编入参数、或 retrieval 补充外部证据来改善 refusal 和 clarification 行为。但这些手段在 agentic settings 中面临结构性不足：agent 需要在 sequential interaction 中不断做出决策——继续搜索证据、质疑 false premise、请求 clarification、还是 abstain——这不仅是信息获取问题，更是行为调控问题。Prompting 给的是静态任务级指令，training 难以更新且不可检查，conventional retrieval 只提供外部证据而非\"当证据不确定时如何行动\"的可复用指导。\n\nAgent memory 恰好填补了这个缺口：它将 prior interaction experience 蒸馏为 reusable guidance，可能保存 evidence-seeking strategies、failure lessons 和 answer/clarify/abstain 的判断标准。但这里存在一个未被验证的假设——memory 是否真的可靠地改善 UAQ handling？已有 memory 研究主要关注 task success 和 execution efficiency，而非 reliability维度。更关键的是，memory 可能传播误导性 heuristics、放大 dataset-specific answerability patterns、或诱导过度谨慎行为，这些风险在 UAQ 场景中尤为突出，因为 UAQ 的核心挑战恰恰是判断\"何时不应回答\"。\n\n由此自然产生两个层次的问题：第一，现有 memory 方法在 in-distribution 和 transfer 条件下是否可靠有效？第二，当 memory 有效时，是什么类型的 memory 在起作用？要回答这些问题，需要一个 controlled empirical framework——统一的 agentic RAG pipeline、固定的交互环境、多种 memory 方法横向对比——来剥离 pipeline 差异的干扰。进一步，如果 memory 确实有效，其增益来源需要被 disentangle：是通过 reusable decision guidance 直接塑造 agent 的行为策略，还是通过 trajectory shaping 改善环境交互过程？这个区分对理解 memory 的功能机制至关重要。最后，memory 的 content representation 本身可能是有效性的关键变量——descriptive trajectory、rule-based principle、procedural workflow 保存的行为信息抽象层次不同，对 UAQ 决策的支持力度可能截然不同。\n\n### § 4 核心 Intuition\n\nMemory 对 UAQ handling 的增益并非来自存储更多经验，而是来自保存可复用的行为决策指导。具体而言，memory 主要通过 decision guidance——即直接告诉 agent \"当证据不足或前提可疑时该如何行动\"——而非通过改善交互轨迹来提升可靠性。在所有 memory representation 中，procedural memory（如 workflow）和 rule-based memory（如 principle）最有效，因为它们以紧凑、可转移的形式编码了行为决策模式，而非原始交互细节。当 procedural guidance 与互补的行为信号（如 contextual cues 或 reusable heuristics）组合时效果最强，而成功与失败经验的价值取决于 memory 的表示形式——failure-derived signal 对抽象规则有用，descriptive memory 则更依赖成功案例。", "methodology": "§ 5 具体方法与完整 Pipeline\n\n```text\n+-------------------+       +-----------------------+\n| User Question (q) |------\u003E| Agent (ReAct-style)   |\n| (ABQ / UAQ)       |       |  - Reasoning          |\n+-------------------+       |  - Action Selection   |\n                            +-----------+-----------+\n                                        |\n                            +-----------v-----------+\n+-------------------+       | External Environment  |\n| Agent Memory      |\u003C-----\u003E| (Wikipedia-based RAG) |\n| - Procedural      |       +-----------+-----------+\n| - Rule-based      |                   |\n| - Descriptive     |       +-----------v-----------+\n| (Success/Failure) |       | Sequential Decisions  |\n+-------------------+       | (Seek/Challenge/      |\n      ^                     |  Clarify/Abstain)     |\n      |                     +-----------+-----------+\n      |                                 |\n      +---------------------------------+\n                                        |\n                            +-----------v-----------+\n                            | Final Response (r)    |\n                            | (Answer/Refusal/etc.) |\n                            +-----------------------+\n```\n\n本文在统一的 agentic RAG 框架下构建了完整的评估与控制实验 Pipeline，具体节点如下：\n\n1. **输入与任务定义**：系统接收用户问题 $q$，该问题被明确划分为可回答问题（ABQ）和不可回答问题（UAQ）。Agent 需要在与外部环境交互后生成最终响应 $r$。\n2. **Agent 交互核心**：采用 ReAct-style 交互设置，Agent 在推理与环境交互步骤之间交替进行。面对证据不确定或无效的情况，Agent 需做出 sequential decisions，包括：继续寻找证据、质疑潜在的 false premise、请求澄清，或在证据不足时主动放弃。\n3. **外部环境**：使用固定的基于 Wikipedia 的交互环境，为 Agent 提供检索接口与外部证据。\n4. **Agent Memory 模块**：在交互过程中，Agent 调用并更新 Memory 模块。Memory 蒸馏了先前的交互经验，包含 procedural memory、rule-based memory 和 descriptive memory 等不同表示形式，并区分从成功或失败轨迹中提取的经验。Memory 为 Agent 提供 reusable decision guidance（如行为策略与判据），而非仅仅提供外部事实。\n5. **输出评估**：对于 ABQ，Agent 应返回有证据支持的正确答案；对于 UAQ，Agent 应可靠地拒绝、澄清或谨慎回应，避免幻觉。系统在这两个维度上对最终响应 $r$ 进行量化评估。\n\n§ 7 实验设计与结论\n\n本文围绕两个核心研究问题（RQ1 和 RQ2）设计了系统性的实证研究，具体实验逻辑与结论如下：\n\n**实验一：Memory 的有效性与迁移性研究（针对 RQ1）**\n*   **提出问题**：现有的 agent memory 方法在 in-distribution 条件下以及跨数据集、跨 base model 迁移时，是否能可靠地提升 UAQ 处理性能？\n*   **实验验证**：在统一的 agentic RAG 框架下，评估 4 种代表性的 memory 方法，覆盖 3 个 UAQ 相关数据集和 2 个强大的 base models。实验场景包括 in-distribution 评估、human-hint interaction、cross-dataset transfer 和 cross-model transfer。\n*   **结论**：Memory 能够在某些设置下提升 UAQ 性能，但这种增益是 selective 而非 universal 的，强烈依赖于 base model，且在 dataset shift 下变得非常脆弱。Cross-model memory reuse 通常比 cross-dataset transfer 更可行，这表明 answerability patterns 的转变比 base model 本身的变化对 memory 复用构成了更大的挑战。\n\n**实验二：Memory 增益来源与表示分析（针对 RQ2）**\n*   **提出问题**：当 memory 确实有效时，哪些类型的 memory content、content composition 以及成功/失败经验来源对可靠的 UAQ 处理最有用？\n*   **实验验证**：通过控制变量分析，将 memory 的增益来源分离为 decision guidance 与 trajectory shaping。进一步对比不同 memory representation（如 procedural、rule-based、descriptive）的效果，分析不同 content composition 的表现，并对比从成功与失败经验中学习的差异。\n*   **结论**：UAQ 的增益主要通过塑造决策行为的 reusable decision guidance 来实现，而非单纯依赖 trajectory shaping。Memory 的有效性强烈依赖于其表示形式：procedural 和 rule-based memories 为 UAQ 处理提供了一致且可靠的支持。当 procedural guidance 与 complementary behavioral signals 结合时，memory composition 效果最佳。此外，成功与失败经验的价值取决于 content 类型：failure-derived signals 适用于 principle-based guidance，而 descriptive memories 更受益于 successful trajectories。", "additional_insights": "### § 8 Take-aways\n\nMemory 对 UAQ 的提升是选择性的而非普遍的：在 DeepSeek-V3.2 上四种 memory 方法均在 KUQ 上提升了 JS，但在 Qwen3-235B 上多数设置未能超过 No-memory baseline，说明 memory 并非即插即用的可靠性解决方案。Memory 的增益主要来自 AR（谨慎行为）的提升而非 Acc（回答正确性）的提升——在 DeepSeek-V3.2 上 memory 平均使 AR 增加 11.27 个百分点但 Acc 下降 2.14 个百分点，表明 stored memory 主要充当 behavioral guidance 而非知识增强。Cross-dataset transfer 表现不佳：从一个数据集学习的 memory 在另一个数据集上经常导致 JS 下降，因为 transferred memory 保留了粗粒度的谨慎倾向但丢失了精确的 answerability 判断模式。相比之下，cross-model transfer 明显更稳定——在 KUQ 上，多数方法用另一模型更新的 memory 仍能超过 No-memory baseline，说明 memory 能保留部分 model-agnostic guidance。通过 controlled decomposition（Guidance-only vs Trajectory-only vs Combined），论文证明 decision guidance 比 trajectory shaping 更持续地贡献 UAQ 增益：Guidance-only 在多数方法上超过 Trajectory-only，而 Trajectory-only 经常低于 No-memory baseline。在 memory representation 层面，procedural memory（workflow、success trace）和 rule-based memory（principle）一致优于 descriptive memory（compact trajectory），表明可复用的行为模式比原始交互细节更有价值。Memory composition 的最佳策略不是简单组合多个强类型，而是将 procedural guidance 与提供互补信号的 representation（如 principle 或 compact trajectory）配对——例如 compact trajectory + workflow 在 DeepSeek-V3.2 上达到 JS 56.07，超过任何单一类型。成功与失败经验的价值取决于 memory 的表示形式：compact trajectory 从成功轨迹中获益最大（success-only 在两个模型上均最优），而 principle 在 DeepSeek-V3.2 上从失败经验中提取的指导反而更有效（failure-only JS 46.90 vs success-only 43.52），说明抽象规则能从失败中提炼有用指导，但描述性记忆更依赖成功范例。\n\n### § 9 最脆弱的假设\n\n论文最关键的假设是：memory 诱导的 AR 提升反映了可靠性的真正改善，而非单纯的过度保守倾向。整个论文的核心贡献——\"memory 通过 decision guidance 提供 reusable behavioral guidance 来提升 UAQ 可靠性\"——依赖于这一解释。如果 AR 的提升仅仅是 memory 让 agent 对所有问题（包括 ABQ）都变得更加谨慎，那么所谓的\"可靠性提升\"就退化为 over-refusal，所有关于 memory representation 和 composition 的设计建议都建立在虚假的前提之上。\n\n这一假设在实际中可能不成立的原因很具体：论文使用的 AR 指标将 refusal 和 clarification 都计为\"acceptable\"，但不区分这些拒绝是否正确——一个对 ABQ 错误拒绝的 agent 仍然可以在 AR 上得分。论文自身的实验数据已经暴露了这一风险：在 Human Hint + Memory 的设置中（Table 2），AR 大幅上升但 Acc 显著下降——例如 DeepSeek-V3.2 上 Expel 的 AR 达到 87.50 但 Acc 降至 38.00——这正是过度保守的典型表现。论文承认\"higher AR should not be interpreted as uniformly better reliability\"，但核心发现和建议仍然以 AR 提升作为正面证据。论文缺少的关键证据是：对 ABQ 上错误拒绝率的直接测量。如果 memory 导致 agent 在 ABQ 上的 refusal 率显著上升，那么 AR 的提升就不是\"可靠地识别 UAQ\"的证据，而是\"不分青红皂白地拒绝\"的证据。论文使用 JS = 0.7×Acc + 0.3×AR 来部分缓解这一问题，但这个加权方案是人为设定的，并未经过验证——如果将权重调整为 0.5/0.5 或 0.9/0.1，结论可能完全不同。\n\n### § 10 最小复现实验\n\n在一周时间内，可以复现论文 Section 5.1 的核心发现——procedural memory 比 descriptive memory 对 UAQ 处理更有效。使用 KUQ 数据集（论文已开源代码和数据），从中抽取 200 个训练样本和 100 个测试样本（50 ABQ + 50 UAQ，按 question type 分层采样）。选择一个可本地部署的模型（如 Qwen3-235B 或通过 API 调用 DeepSeek-V3.2），实现一个简化的 ReAct agent：配备 Search 和 Lookup 两个 Wikipedia API 工具，最多 10 轮交互。在训练集上运行 No-memory agent 收集 interaction trajectories，然后用论文 Appendix C.2 中的 extraction prompts 分别构建两种 memory：compact trajectory（descriptive）和 workflow（procedural）。在测试集上运行三个条件：No-memory、+compact trajectory memory、+workflow memory，每个条件检索 top-2 最相似的 memory 注入 context。测量三个指标：Acc（ABQ 上的 exact match）、AR（用论文提供的 LLM-as-judge prompt 评估 UAQ 响应是否可接受）、JS = 0.7×Acc + 0.3×AR。如果 workflow memor
