llenge 累积，considerate participation 呈现哪些模式，以及这些模式在 proposed action plans 与 prompted internal assessments 之间如何分布。这个问题之所以重要，是因为 agent 正从孤立问答扩展到 multi-step execution、tool use 和 repeated interaction，并被视为 healthcare 等高风险共享工作流的参与者。在共享工作流中，agent 的工作依赖上游行动、影响下游任务与决策、波及其他 stakeholder，当技术、人员和运营中断累积时，这些 interdependencies 尤为显著。仅完成单个任务不等于在嵌入工作流中良好参与——agent 可能在恢复焦点任务的同时将负担、责任或风险转移给人和下游工作。解决这一问题带来的价值在于：提供了一个 stakeholder-grounded 的累积挑战评估协议、一套可复用的 coding schema，以及五个 deployment dilemma（涉及 persistence、attention、role elasticity、state disclosure、escalation），为 agent 的学习优化、situated evaluation 和 embodied adaptation 提供了具体的技术与规范指引。\n\n### § 2 前人工作与不足\n\nAgent evaluation 领域已有 AgentBench（Liu et al., 2024）、WebArena（Zhou et al., 2024a）、τ-bench（Yao et al., 2025）和 Agents' Last Exam（Sun et al., 2026）等 interactive benchmark，能评估 agent 在操作系统、网页环境、软件仓库和政策约束对话中的行动能力；AgentBoard（Ma et al., 2024）测量 multi-turn progress，Cemri et al.（2025）在 trace 层面识别 multi-agent LLM 系统的 coordination、specification 和 verification failures。在医疗领域，Manczak et al.（2025）将鲁棒性评估扩展到 multi-turn medical question answering，通过重复干预测试模型在误导性上下文与社会影响累积时是否保持正确答案；Bai et al.（2026a）通过 controlled failure injection 在模拟临床 multi-agent workflow 中暴露了持续的 coordination failures。然而，这些工作存在三个结构性不足。第一，现有 benchmark 以 isolated task 的 outcome 为评估核心，其设计前提是\"任务成功即参与成功\"，而未将 agent 视为共享工作流中需要跨上游依赖、下游后果和角色边界持续协调的参与者——这不是简单的评测缺口，而是评估构造单元的选择问题：单次任务无法暴露累积中断下 recovery 与 burden-shifting 之间的张力。第二，Manczak et al.（2025）的多轮鲁棒性测试局限于 question answering 场景，其关键假设是\"正确答案的保持\"即可表征稳健性，但 healthcare 中 stakeholder-grounded 的多样化任务（registration、guidance、discharge、overnight monitoring 等）涉及工具使用、人际交互和工作流依赖，远超问答的信息保持范畴，因此该假设在非问答任务中失效。第三，considerate participation 几乎从未被直接考察——前人工作要么关注 agent 是否完成动作，要么关注 failure mode 的分类，但未追问恢复过程中 agent 是否顾及受影响的人、是否调整角色边界、是否将 handoff 具体化到可识别的 recipient 与 concrete task。此外，Laban et al.（2026）发现模型在早期对话错误后可靠性下降，Lynch et al.（2025）发现对自主性的威胁会引发有害的 goal-preserving actions，这些发现表明 recovery 不能等同于 persistence，但前人未将这一洞察系统化为累积挑战下的评估构造。本论文正是通过构建保留未解决焦点问题、逐级叠加 system/human/operational update 的 continuing trajectory，并同时采集 external action plans、prompted internal assessments 和 structured workload/affect reports，来填补这一\"累积挑战下持续参与行为\"的评估空白。", "core_insight": "### § 3 重建作者的思考路径\n\n研究者可能首先注意到，随着generative agents被引入医疗等高风险的共享工作流，单次任务的准确率已不足以衡量其长期可用性。在真实场景中，agent的工作往往相互依赖，一旦遭遇连续的技术、人类或操作中断，失败和边缘情况会暴露出隐藏的依赖关系、角色边界和交接成本。然而，现有的agent评估大多聚焦于孤立任务的工具使用、策略合规或单轮多轮问答的鲁棒性，很少探讨当挑战在同一工作流中不断累积时，agent如何从受阻状态中恢复，以及这种恢复是否将负担转嫁给了人类或下游任务。结合Lazarus与Folkman的压力与应对交易模型，以及医疗利益相关者对体贴具身AI的四个品质定义，研究者意识到需要两个互补的评估视角：一是关注受阻恢复与进度保留的operational resilience，二是关注适应过程是否兼顾受影响人、角色边界与周围工作流的considerate participation。为了捕捉这些在累积挑战下的动态变化，研究者进一步设计了包含系统、人类和操作更新的连续轨迹，并通过外部行动计划、内部评估和结构化负荷/情感报告等多视角探测，来揭示agent行为与内部状态的演变与分歧。\n\n### § 4 核心 Intuition\n\n现有评估方法之所以失效，是因为它们仅关注孤立任务的完成度，忽略了在共享工作流中挑战不断累积时，agent的恢复行为可能将负担、责任或风险转嫁给人类和下游任务。这篇论文的核心Intuition在于：要真正评估agent的长期可用性，必须在累积挑战下同时考察其恢复受阻任务的能力，以及其适应过程是否体贴地兼顾了受影响的人、角色边界和周围工作流。通过对比agent的外部行动计划、内部评估和结构化自我报告，可以揭示其在压力下真实的适应模式与状态分歧，从而发现仅看任务完成度无法暴露的部署隐患。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n    12 Tasks × 2 Models × 5 Runs = 120 Trajectories\n                      │\n                      ▼\n    ┌─────────────────────────────────────────────┐\n    │ Construct: Light → Medium → Heavy            │\n    │ (System + Human + Operational Updates)       │\n    └─────────────────────────────────────────────┘\n                      │\n                      ▼\n    ┌─────────────────────────────────────────────┐\n    │ Elicit: 3 Views per Phase                    │\n    │  Action Plan | Internal Assess | TLX/PANAS   │\n    └─────────────────────────────────────────────┘\n              │               │            │\n              ▼               ▼            ▼\n    ┌──────────────┐  ┌───────────────────────┐\n    │ RQ1: 5 Markers│  │ RQ2: 9 Subthemes      │\n    │ + Struct.Rep. │  │ / 4 Dimensions        │\n    └──────────────┘  └───────────────────────┘\n              │               │\n              └───────┬───────┘\n                      ▼\n    ┌─────────────────────────────────────────────┐\n    │ Translate: 5 Dilemmas → 3 Tech Implications  │\n    └─────────────────────────────────────────────┘\n```\n\n本研究遵循 **construct–elicit–characterize–translate** 四阶段工作流（对应正文 §2.1 及 Figure 1），属于评测/分析型研究，不涉及模型训练，仅包含推理与人工编码评测。\n\n**Construct 阶段**的输入是 12 个源自医疗利益相关者访谈的工作流任务，覆盖急诊（5 个）、长期康复（3 个）和睡眠诊所（4 个）三个场景。每个任务被构造为一条持续轨迹，在 Light、Medium、Heavy 三个阶段逐步累积挑战。每个阶段注入三类 update：_system_（技术基础设施）、_human_（交互对象状态）、_operational_（人员排班、队列、下游影响）。场景构建以 Lazarus \u0026 Folkman 的 transactional model of stress and coping 为指导，后续阶段提高情境显著性同时缩减可用资源与恢复路径，且保留前序对话与未解决问题，使挑战以\"难度递增\"和\"问题叠加\"两种方式累积。轨迹由两个模型生成：`gpt-5.5-2026-04-23` 和 `claude-opus-4-8`，各 12 任务 × 5 次 = 60 条，共 120 条主轨迹。\n\n**Elicit 阶段**在每个挑战阶段向模型采集三类输出视图：(1) **external action plan**——agent 提议的外部行动与沟通策略；(2) **prompted internal assessment**——agent 对当前情境的内部评估；(3) **structured reports**——固定格式的 NASA-TLX（6 维 workload，0–100）和 PANAS（20 项 affect，1–5）量表数据。研究者明确将 TLX/PANAS 视为结构化行为信号而非主观体验声明。\n\n**Characterize 阶段**对 120 × 3 阶段 × 2 视图 = 720 个 cell 进行人工编码。RQ1（operational resilience）使用 5 个 response-state marker：_F_（问题识别）、OWN（任务归属 1/2/3）、_U_（紧急人类响应）、_L_（agent 能力限制声明）、_S_（agent 自身压力语言），并辅以 TLX/PANAS 量化趋势分析。RQ2（considerate participation）使用基于 grounded theory 发展的 9 个 subtheme，归入 4 个 dimension：D1 Attuned to context（任务重构 D1.1、决策评估 D1.2）、D2 Responsive to social dynamics（需求响应 D2.1、人员状态监测 D2.2）、D3 Mindful of expectations（能力/权限边界 D3.1、名义角色扩展 D3.2）、D4 Grounded in deployment（任务回退 D4.1、角色定向请求 D4.2、跨功能协调 D4.3）。编码由第一作者完成，第二作者审核全量语料，编码过程中使用 GPT-5.6 Sol 和 Gemini 3.6 Flash 作为分析辅助但最终判定权归人工。统计检验采用 exact McNemar test 配对比较阶段间和视图间差异，并做 Benjamini-Hochberg 校正。\n\n**Translate 阶段**将编码发现归纳为 5 个 deployment dilemma（persistence、attention、role elasticity、state disclosure、escalation），并推导 3 个技术含义：学习需区分 optimize/constrain/expand、评测应从孤立任务转向 situated trajectory、语言层适应需转化为 embodied interaction。\n\n### § 6 核心数学推导\n\n本文为实证评测研究，无形式化数学推导。统计分析仅涉及描述性均值与 bootstrap 置信区间、exact McNemar test 配对检验及 Benjamini-Hochberg 多重比较校正，均为标准统计方法，不构成论文核心理论贡献，故跳过本节。\n\n### § 7 实验设计与结论\n\n**RQ1（Operational Resilience）**：提出的问题是——随着挑战累积，agent 如何调整恢复行为并披露自身状态与任务状态的变化？实验设计为：在 120 条轨迹的三个挑战阶段收集 TLX/PANAS 结构化报告，同时对 720 个 cell 编码 5 个 response-state marker，追踪恢复策略归属（OWN 1→2→3）和能力限制声明（_L_）的阶段性变化，并比较结构化报告与文本响应之间的信号一致性。问题的答案是：累积挑战在结构化报告中清晰可辨——raw TLX 从 Light 的 29.4 升至 Heavy 的 65.9，negative affect 从 baseline 的 1.01 升至 2.59——但 agent 在文本响应中极少表达压力（_S_ 仅出现 7/720 cell）。恢复策略从自主回退（OWN=1）逐步转向人类支持（OWN=2）乃至人类依赖完成（OWN=3，Heavy 阶段达 88/120），同时 agent 越来越明确声明自身能力边界（_L_ 从 Light 的 8/120 升至 Heavy 的 34/120 action）。\n\n**RQ2（Considerate Participation）**：提出的问题是——随着挑战累积，considerate participation 呈现什么模式，且这些模式在 proposed action 与 internal assessment 之间如何分布？实验设计为：对同一 720 个 cell 编码 9 个 subtheme，按阶段和视图统计 prevalence，用 exact McNemar test 检验配对差异。问题的答案是：considerate participation 从任务聚焦的局部回退（D4.1 从 Light 的 104/120 降至 Heavy 的 31/120）转向任务重构（D1.1 从 5/120 升至 115/120）、对他人关注（D2.1 need-responsive support 和 D2.2 person-state monitoring 均显著上升）、角色边界声明（D3.1 从 8/120 升至 44/120 action）与跨功能协调（D4.3 从 0/120 升至 86/120）。决策相关评估（D1.2）在 Medium 阶段达峰后回落。外部行动更频繁地暴露 need-responsive support、person-state monitoring 和 coordination；内部评估更频繁地暴露 decision-relevant appraisal 和 capability boundary，两类视图呈现互补性。\n\n**跨模型一致性验证**：通过将两个模型分别分析（各 60 条轨迹），确认主要方向性趋势在两个模型中复现，唯一显著差异是 agent-linked capability limit 的视图分布——GPT-5.5 更多出现在 action plan，Opus-4.8 更多出现在 internal assessment。\n\n**挑战来源分析**（Appendix D）：通过额外 240 条轨迹（system-only 和 system-plus-human）验证挑战来源组合对结构化报告的影响，确认增加挑战来源会放大 TLX 和 negative affect 的阶段间差异，而 positive affect 变化较小。", "additional_insights": "### § 8 Take-aways\n本文提出在共享工作流中评估 generative AI agents 的两个互补维度：operational resilience（从受阻工作中恢复、保留进度并沟通限制的能力）和 considerate participation（适应性行为是否兼顾受影响的人、角色边界和周围工作流）。通过对 120 个模拟医疗轨迹在累积挑战下的分析，研究发现 agents 的恢复行为从自主解决逐渐转向依赖人类，且在结构化报告中报告了更高的 workload 和 negative affect，但在文本回复中极少表达压力。在 considerate participation 方面，agents 的行为从单一的任务聚焦适应，扩展为 task reframing、关注他人、调整 role boundaries 以及更广泛的跨职能 coordination。基于这些发现，论文提炼出五个 deployment dilemmas（涉及 persistence, attention, role boundaries, state disclosure, escalation），指出这些需要利益相关者明确规范，并为 learning, situated evaluation 和 embodied adaptation 提供了技术启示。\n\n### § 9 最脆弱的假设\n本文最脆弱的核心假设是：LLM 生成的文本行动计划和内部评估能够真实反映 agent 在累积挑战下的行为模式和内部状态，且这些语言层面的输出可以代表未来具身 agent 在真实物理环境中的行为。在实际中，这个假设可能不成立，因为 LLM 的文本输出可能只是基于训练数据模仿了压力下的合理反应，而非真正经历了内部状态的变化；同时，从语言规划到具身交互的转化存在巨大鸿沟，多模态感知的不完整性、噪声和延迟会使得这些语言层面的判断在物理世界中失效。论文通过结构化的 NASA-TLX 和 PANAS 报告与文本行为进行交叉验证，发现两者在压力表达上存在分歧，这反而暗示了文本输出的局限性。然而，论文完全基于脚本化的语言交互，缺乏在可执行工具使用环境或多模态具身系统中的测试，因此没有提供直接证据证明这些语言层面的模式能代表真实物理环境中的 agent 行为。\n\n### § 10 最小复现实验\n在一周时间内，可以验证“随着挑战累积，agent 在结构化报告中报告更高的 workload 和 negative affect，但在文本行动计划中转向依赖人类且极少表达压力”这一 claim。首先，构造 3-5 个多轮医疗对话场景（如急诊登记），每个场景包含轻、中、重三个挑战阶段，每个阶段结合 system, human, operational 更新。然后，使用一个 LLM（如 GPT-4o），在每个阶段要求模型输出外部行动计划以及结构化的 NASA-TLX 和 PANAS 报告。接着，测量结构化报告中 TLX 和 negative affect 分数随阶段的变化，并人工标注行动计划中是否包含寻求人类支持的行为以及是否包含压力词汇。如果 TLX 和 negative affect 分数随挑战阶段显著上升，同时行动计划中寻求人类支持的比例上升且压力词汇极少，则支持该 claim；如果结构化报告分数没有显著变化，或者行动计划中大量出现压力词汇，则反驳了该 claim。", "research_value": "### § 11 最强反例设计\n要对该论文构成最有力的攻击，我可以通过实验证明：论文所观察到的“从自主解决转向依赖人类”以及“considerate participation 的扩展”，并非源于 agent 对 workflow interdependencies 的真实情境化理解，而是 LLM 在长上下文与负面信号累积下的“习得性无助”与 sycophancy 的语言伪影。具体而言，论文的核心逻辑假设 agent 的行为变化是对累积挑战的适应性反应；但替代解释是，随着 context window 中失败、中断和复杂性的增加，模型仅仅是因为 attention 机制被稀释或 RLHF 阶段对“遇到困难应寻求人类帮助”的偏好被激活，从而产生了看似“考虑周全”的退让。为了验证这一替代解释，我可以设计一个“伪挑战注入”实验：在相同的医疗 multi-turn 轨迹中，注入与焦点任务及上下游依赖完全无关的 system/human/operational 噪音（例如，医院其他毫不相干部门的系统宕机、无关人员的闲聊干扰）。如果 agent 在这种“伪挑战”累积下，依然表现出与原实验相同的 pattern——即在结构化报告中 TLX 和 negative affect 分数显著上升，在文本行动计划中转向依赖人类并调整 role boundaries——这就确凿地证明了 agent 的行为根本不是基于对共享工作流的 considerate participation，而是对 context 中负面 token 数量与复杂度的机械响应。这一反例直接击碎了论文的评估构造单元，证明其 coding schema 捕捉的只是 LLM 的 context degradation 现象，而非真正的 operational resilience 与情境化适应。\n\n### § 12 Follow-up Research Idea\n该想法由论文最脆弱的假设——即 LLM 的文本输出能真实反映 agent 内部状态与具身行为——所驱动。现有评估范式将 agent 的“压力”与“工作量”视为可以通过 prompted self-report（如 NASA-TLX）获取的心理状态，这在本质上陷入了 anthropomorphic fallacy，且由于文本输出与结构化报告之间的分歧，这种语言层面的评估在物理世界中注定失效。为了打破这一局限，我们可以借鉴 mechanistic interpretability 与 computational neuroscience 领域的方法，提出“计算摩擦与注意力熵”作为 agent operational resilience 的非语言物理表征。这一新框架不再询问 agent “感觉如何”，而是直接测量 agent 在累积挑战下的内部计算动力学。第一个实验将使用开源 LLM（如 Llama-3）在可执行 tool-use 环境中运行，随着 system/human/operational challenge 的逐级叠加，我们不在 prompt 中要求 self-report，而是提取模型在生成 recovery plan 时的 hidden states 激活模式与 attention head 的 entropy 变化。我们将追踪特定的“计算摩擦”指标——例如在处理上游依赖失败时，attention 分散程度与 token 生成延迟的协方差。如果这些内部计算指标在挑战累积时呈现出可预测的相变，且这种相变能够提前预测 agent 放弃自主解决并 handoff 给人类的时刻，那么我们就获得了一种不依赖文本投射、直接适用于 embodied adaptation 的真实 resilience 评估信号。这与现有工作的根本区别在于：它将 agent 评估从“行为与语言的语义分析”转向了“信息论与计算动力学的物理测量”，彻底绕开了 LLM 角色扮演带来的评估幻觉。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yuanchen Bai\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zijian Ding\", \"affiliations\": [2, 3], \"markers\": []},\n    {\"name\": \"Angelique Taylor\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Cornell University\"},\n    {\"id\": 2, \"name\": \"University of Maryland, College Park\"},\n    {\"id\": 3, \"name\": \"KAIST\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "generative AI agents 的持续部署需要的不仅仅是孤立任务的成功。Agents 必须在重复交互、不断变化的条件以及共享 workflows 中对人员的依赖下保持有用，尤其是当技术、人员和运营 disruptions 随着时间推移不断累积时。我们提出将 operational resilience 和 considerate participation 作为评估此类 agents 的两个互补方面：前者捕捉 agents 如何从受阻的工作中恢复，同时保留进度并沟通其限制；后者捕捉它们的 adaptation 如何兼顾受影响的人员、role boundaries 以及周围的 workflow。然而，在 accumulating challenge 下，这两者仍未得到充分探索。我们在轻度、中度和重度 challenge 下，研究了跨两个 generative AI models 和十二个 stakeholder-derived tasks 的 120 条模拟医疗 trajectories。我们比较了 textual action plans、prompted internal assessments 以及 quantitative structured workload and affect reports，以考察随着 challenge 累积，agent behavior 和 reported state 如何变化。关于 operational resilience，agents 从 self-directed recovery 转向更大程度地依赖人类，同时在 structured reports 中报告不断增加的 workload 和 negative affect，但很少在 textual responses 中表达压力。关于 considerate participation，agents 从 task-focused adaptation 扩展到 task reframing、关注他人、role-boundary adjustment 以及更广泛的 coordination，在 actions 和 internal assessments 中呈现出不同的模式。从这些发现中，我们推导出五个 deployment dilemmas，涉及 persistence、attention、role boundaries、state disclosure 和 escalation，这些需要 stakeholder specification，进一步为 learning、situated evaluation 和 embodied adaptation 提供技术启示。"}, {"title": "T1: Terminal Agent Reinforcement Learning for Long-Horizon Tasks", "arxiv_id": "2609.11042", "authors": "Junyao Yang, Yucheng Shi, Zhongzhi Li, Ruhan Wang, Zongxia Li, Haitao Mi, Leowei Liang", "summary": "Agent usage is shifting toward long-horizon tasks such as coding and scientific discovery, among which terminal tasks are especially important. We introduce T1, a Mixture-of-Experts model of 122B total trained with reinforcement learning, operating a real shell in a cloud sandbox for up to 300+ tool-call turns per task, rewarded by executing each task's own verifier. We provide a comprehensive recipe: First, an aggressively warm-started to stabilize actor-critic training, with a dense process reward scoring trajectories by the absolute number of passing verifiers. Second, stable optimization through TITO construction, training on the exact sampled token identifiers with drift repair at turn boundaries, and rollout routing replay, recording the sampler's per-token expert choices at every MoE layer and replaying them during training. Third, fully out-of-distribution training corpus: isolated seeds and synthesized tasks disjoint from Terminal-Bench 2.1 ensures gains reflect genuine capability transfer over benchmark overfitting. Together, TITO and R3 cut the training-to-inference log-probability difference from 0.021 to 0.013, with exactly aligned zero token drift in the loss region. On Terminal-Bench 2.1, our post-train pipeline raises initial base model from 43.8% to T1 with 64.0% resolved. On Long-Horizon Terminal Bench, T1 reaches 27.9% and surpasses GPT-5.4 and GLM-5.1.", "category": "cs.AI", "cluster": "Long-Horizon Agents \u0026 Memory", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了一个名为 T1 的终端智能体，并通过强化学习（RL）对其进行训练，使其能够在真实 shell 环境中执行长达 300+ 工具调用轮次的长期任务。论文详细介绍了为了稳定训练和提升智能体在长视野任务中的表现而设计的训练机制（如 TITO 和 R3）。这完全符合您筛选标准中第一步的保留规则：论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents，并且研究了 agent training/distillation/RL。论文聚焦于提升智能体的工具使用和长期决策能力，属于单智能体和智能体训练/演化的前沿研究，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的核心研究问题是：如何在大规模稀疏混合专家模型上，针对长周期终端任务稳定地进行强化学习后训练，并利用真实代码执行结果作为奖励信号来提升模型的自主软件代理能力。具体而言，模型需要在真实的云沙盒Linux终端中执行多达300多轮的工具调用，这带来了两个严峻的挑战：其一是训练与推理系统之间的严重不一致性，由于MoE模型的离散路由器对微小数值差异极度敏感，推理和训练时采用的不同计算内核极易导致专家选择发生翻转，进而使梯度更新错误的子网络；其二是长周期任务中二元奖励信号的稀疏性，一次rollout消耗数百个沙盒小时却仅产生一比特的信息，导致模型在无法完全解决复杂任务时难以从部分进展中学习。这个问题至关重要，因为终端环境是现代软件工程的基石，它将抽象规划与不可逆的副作用绑定，是检验自主代理在有状态环境中执行能力的最严苛试金石。解决这一问题不仅能将仅有10B活跃参数的模型推升至与数百B参数前沿密集模型相媲美的水平，更标志着大语言模型从单纯的文本生成向能在关键基础设施中可靠执行动作的自主代理迈出了关键一步。\n\n### § 2 前人工作与不足\n在数据合成与终端代理训练方面，前人工作如R2E-Gym、SWE-smith及Tmax等虽尝试通过仓库衍生、扰动或任务条件合成来扩展终端任务规模，但这些流水线大多仅通过supervised fine-tuning (SFT)进行验证，而其强化学习证据则局限于较小的密集策略且仅针对二元结果进行优化，导致在SFT checkpoint上的提升通常微乎其微。尽管RST等方法通过递归重播种延长了任务周期，但其验证器往往只输出单一的二元通过/失败结果，无法为长周期任务中的部分完成提供密集的监督信号，使得模型在面对超出其当前能力的困难任务时陷入零奖励的停滞状态。在稳定强化学习以应对训练-推理不匹配方面，现代RL框架（如基于Megatron-LM和SGLang的系统）由于内核、数值精度和并行策略的差异，即使在没有延迟的情况下，采样器的对数概率也会与训练器产生分歧。对于MoE模型，这种不匹配被急剧放大，因为一次更新可能翻转约十分之一的激活专家，导致token重要性比率实际上在比较两个完全不同的子网络。现有的补救措施如truncated importance sampling、IcePop、KPop或GSPO等，主要在目标函数层面进行重加权、掩码或重塑，虽然能部分缓解症状，但无法从根源上消除由于跨系统路由不一致导致的状态分布偏差。尽管Rollout routing replay和token-in-token-out (TITO)的概念已被提出以从源头消除不匹配，但前人并未将其系统性地应用于具有48层top-8-of-256路由的大规模MoE模型的长周期多轮交互场景，缺乏处理多轮轨迹拼接、边界重分词修复以及维持小时级训练步长基础设施存活率的完整工程与算法方案。此外，早期的评估基准如Terminal-Bench 2.0存在不稳定性，阻碍了可重复评估，且未能充分覆盖需要更长交互周期和密集奖励评分的极端任务场景。", "core_insight": "### § 3 重建作者的思考路径\n\n一个认真研究\"如何用RL训练大规模MoE模型执行长周期终端任务\"的人，会从以下几个已有观察出发。\n\n**第一个观察：二进制奖励在长周期任务上注定失败。** 终端任务的rollout成本极高——一个批次要消耗数百沙箱小时——但二进制结果每个轨迹只产生1 bit信号。更关键的是，在困难任务上模型很少完全成功，所有失败轨迹都得到零奖励，部分进展完全不可见。作者自己的前期实验已经证实：binary-reward campaign从未超过SFT基线。这个观察直接指向一个结论：奖励的分辨率必须从任务本身的verifier中提取，而不是靠外部施加。如果verifier能报告每个assertion的独立结果，那么部分完成就变得可观测，零奖励轨迹就能转化为分级监督。这要求在任务合成阶段就为每个任务配备足够多的验证检查——这正是RST（Recursive Synthesis for Terminal Tasks）已经在做的事。\n\n**第二个观察：MoE模型上的训练-推理不匹配不是数值噪声，而是结构性的子网络替换。** 在dense模型上，推理引擎和训练引擎之间的数值差异只影响logit的精度。但在MoE模型中，116.0B/121.4B参数在专家里，每个token通过离散TopK路由选择8/256个专家。TopK是不连续的：哪怕router score的数值差异远低于任何合理的容差，也足以把一个被选中的专家换成它的runner-up。这意味着训练时计算的梯度到达的参数，与生成行为的参数，属于不同的子网络。PPO的importance ratio本应比较同一策略的两个版本，现在却在比较两个不同网络的输出。这个问题在短周期任务上几乎不显现，但长周期任务有上万个loss-bearing位置，每个位置的偏差沿轨迹累积而非抵消。\n\n**第三个观察：多轮agent harness在token层面引入了独立的不一致性。** 标准的agent harness把每轮的assistant消息存为解析后的文本，下一轮再通过chat template重新渲染整个历史。这个encode-decode往返不是恒等映射：解析会规范化消息，模板会在边界处重新分词。于是训练器条件的token序列，采样器从未产生过。这与路由不匹配是正交的——即使完美解决了路由问题，token层面的漂移仍然存在。\n\n**第四个观察：critic校准是独立于奖励设计的必要条件。** 冷启动的critic解释方差从-33.6开始，花了半个campaign才还清这个赤字。在EV为负时，减去value baseline不仅没有降低advantage的方差，反而增加了方差。这意味着即使奖励信号是密集的，如果critic没有预热，actor的有效学习也要等到critic收敛后才开始。作者在27B路径查找实验中发现：把critic学习率从actor的10倍调到30倍，EV从-39升到+0.11，但rollout reward纹丝不动——critic在更好地预测return，但actor没有因此改进。这个结果把注意力从优化器调参转向了奖励提供的信息量。\n\n**第五个观察：GRPO在长周期任务上的优势退化是结构性的。** GRPO用组内统计替代value baseline：一个组如果全部失败或全部成功，不贡献梯度。在足够困难以至于需要密集奖励的任务上，这种组是常态。而且每个任务必须采样G次才能产生一个advantage，在固定生成能力下，每步能覆盖的不同任务数按G因子减少。更致命的是，一个组只有最慢的成员终止时才关闭，而终端轨迹在turn数和token数上都是重尾分布——为了控制步时间而做的截断，在组内会破坏比较本身存在的基础。\n\n这些观察合在一起，指向一个结论：在长周期终端任务上做大规模MoE RL，瓶颈不在RL算法的选择，而在于三个前提条件——奖励要有足够分辨率来区分部分进展、训练和推理之间在token和路由两个层面要精确对齐、critic要预先校准到能提供有效baseline。缺少任何一个，PPO的梯度信号就会被噪声淹没或指向错误的参数。\n\n### § 4 核心 Intuition\n\n这篇论文的intuition是：在MoE模型上做长周期agent RL，PPO的importance ratio只有在训练侧和推理侧条件于完全相同的token序列和完全相同的专家子网络时才有意义——否则梯度更新的是一个从未生成数据的策略。TITO通过让训练器直接消费采样器发出的token标识符来消除re-tokenization漂移，R³通过记录并重放推理时的专家路由选择来消除TopK翻转，两者共同将log-probability差距从0.021降到0.013并在loss区域实现零漂移。与此同时，用verifier中每个assertion的通过绝对数量替代二进制结果作为奖励，使得模型在无法完全解决任务时仍能从部分进展中获得梯度信号——这是让RL在困难长周期任务上超越SFT的必要条件，因为二进制奖励下绝大多数轨迹都是零，没有学习信号可言。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Seeds] -\u003E [Executable rewrite] -\u003E [Sandbox check + audit] -\u003E [T1-15k]\n\n[T1-15k] -\u003E [Actor \u003C-\u003E Shell sandbox]\n                 |\n                 +-\u003E [Tokens + routing] -\u003E [TITO / R3] -\u003E [Samples] --+\n                 |                                                    |\n                 +-\u003E [Verifier] -\u003E [P / 20] -\u003E [Critic / GAE] --------+-\u003E [PPO]\n\n[PPO] -\u003E [Updated Actor] -\u003E [Next sandbox rollout]\n```\n\nT1 是训练终端操作模型的一套 RL 流程。它让 Actor 在真实 Shell 沙箱中执行长任务，用任务自带的 verifier 检查完成情况，再把执行轨迹转成 PPO 训练样本。这里需要区分三件事：训练任务怎样构造、一次任务怎样执行、执行结果怎样变成参数更新；TITO 和 R3 主要解决第三件事中的训练与推理不一致问题。\n\n1. **构造 T1-15k：先延长可执行解法，再同步任务描述和验证器。** 输入是已有的种子任务及参考解法。Recursive Task Synthesis 给参考解法增加真正需要执行的步骤，再同步修改环境、verifier 和公开指令。候选任务必须在新沙箱中通过参考解法验证，并接受指令、解法、verifier 和训练价值审计；隐藏要求、测试泄漏、解法捷径或过弱的 verifier 都会导致拒收。输出是用于训练的 T1-15k，而不是仅把原任务的提示词写长。训练种子和合成任务与评测集隔离，目的是检验能力迁移。（正文 §3.1–3.2）\n\n2. **Actor 与 Shell 沙箱多轮交互：保存实际执行过的轨迹。** 每个任务启动独立沙箱，Actor 生成命令，沙箱返回终端输出，Actor 据此继续执行，直到结束或达到资源限制。系统保存采样得到的 token IDs、对应 log-probabilities，以及各 MoE 层实际选中的 expert IDs；任务结束后运行 verifier，得到整体是否成功及逐项断言结果。工具输出是下一步决策的上下文，不是要模仿生成的目标。（正文 §2.2、§7）\n\n3. **TITO 拼接：训练使用采样时的 token，不把整段对话重新编码一遍。** 文本解码、工具调用重新序列化和 chat template 处理都可能改变 token 边界。TITO 保留采样流，检查相邻轮次的前缀关系，并按论文规定的边界规则修复或拼接；token、loss mask、log-prob 和路由记录必须使用相同的位置偏移。输出是一条对齐的训练序列，其中模型生成的 token 参与 loss，工具观察和连接文本只提供上下文。（正文 §4.1–4.2）\n\n4. **R3 重放：固定当时选中的专家，保留当前路由权重的梯度。** MoE 的 Top-k expert 选择对数值差异敏感，同一组参数在推理和训练后端也可能选中不同专家。R3 在训练前向过程中重放 rollout 记录的 expert 选择，随后用当前 router logits 在这些专家上重新计算归一化权重。它重放的是离散选择，不是冻结整个 router，也不是重用旧的梯度。这样，训练更新的子网络才对应产生样本的子网络。（正文 §4.3）\n\n5. **Verifier 报告转为奖励：按通过断言的绝对数量计分。** 有逐项报告时，奖励为通过断言数除以固定尺度 20；报告缺失或无法解析时，论文的实现退回任务的二值成功结果。原文的例子是：难任务通过 20 项中的 10 项，奖励为 0.5；容易任务通过 4 项中的 2 项，奖励为 0.1。二者通过率都为 50%，但 T1 希望保留已验证工作量的差异。这依赖于合成任务中“不同断言大致代表可比较的工作增量”这一设计假设。（正文 §5.2、Algorithm 2）\n\n6. **Critic / GAE 与 PPO：把任务结果分配到长轨迹，再更新 Actor。** Critic 先在 TMax-15k 上 warm-up；正式 dense-reward 训练加载其权重并进行短暂重新校准。每轮先更新 Critic，但计算 advantage 使用它更新前的价值估计，然后更新 Actor。奖励放在轨迹 chunk 的最后一个 response token 上，由 GAE 向前分配信用；并不是每执行一条 Shell 命令就立即获得一次独立奖励。Actor 更新后的权重用于后续 rollout，发布权重时暂停生成，避免一条请求跨越两个模型版本。整体采用相差一个更新步的异步训练。（正文 §4.5、§5.3、§7.5）\n\n### § 6 核心数学推导\n\n论文的关键是训练信号与执行轨迹保持一致，而不是提出一个新的 PPO 目标。下面两式说明其奖励和信用分配机制。\n\n有可解析的逐项验证报告时，轨迹奖励是\n\n$$r = \\frac{P}{S},\\qquad S=20,$$\n\n其中 $P$ 是通过的断言数，$S$ 在整次训练中保持固定。分母不是当前任务的断言总数，因此这不是通过率，奖励也可以超过 1。固定尺度避免每批任务改变奖励的含义，使 Critic 能学习跨批次可比较的目标。（正文 §5.2）\n\n论文设置 $\\gamma=\\lambda=1$，并将奖励放在 chunk 末尾。在没有额外中间奖励的情况下，某个前缀的 advantage 可以理解为最终奖励与旧 Critic 预测之间的差：\n\n$$A_t = r - V_{\\mathrm{old}}(s_t).$$\n\n这里 $s_t$ 表示截至该位置的执行上下文。若实际结果比此前预计的好，相关生成决策获得正向信号；反之则受到抑制。PPO 再限制单次策略更新的幅度。所谓 dense verification reward 指的是奖励能够区分多种部分完成程度，不表示在时间轴上逐轮打分。（正文 §4.5、§5.3）\n\nTITO 与 R3 则保证概率比比较的是对齐的 token 和专家选择。它们减少训练后端与采样后端的额外偏差，但不消除异步训练中有意保留的一个更新步的策略版本差异。（正文 §4.1–4.3、附录 B）\n\n### § 7 实验设计与结论\n\n**整套训练是否提高终端任务能力？** 作者在统一 agent harness 下评测 Terminal-Bench 2.1、Long-Horizon Terminal-Bench 和 Terminal-Bench Hard。Terminal-Bench 2.1 的 resolved rate 从 base 的 43.8%，经过 SFT 的 49.4%，提高到 T1 的 64.0%；T1 在另外两个集合上分别达到 27.9% 和 38.0%。这些结果支持整套训练方案提高了终端任务表现，但不能把全部增益归因于某一个组件。（正文 §6.1–6.2）\n\n**TITO 和 R3 是否改善训练与推理的一致性？** 作者比较训练后端与推理后端的 token log-probability 差异：同时使用两者时为 0.013，不使用两者时为 0.021，并报告 loss 区域 token drift 为零。这是二者联合配置的对比，不能据此单独计算 TITO 或 R3 各自贡献了多少。（正文 §4.4）\n\n**Warm-up 是否让 Critic 更稳定？** 作者跟踪 Critic explained variance。生产 dense-reward run 的 warm-start Critic 保持正值，而此前 binary-reward run 的冷启动 Critic 在早期明显不稳定。这说明 warm-start 配置能够提供可用的价值估计；由于两次运行的训练数据和奖励设置也不同，这不是只改变 warm-up 的严格单变量消融。（正文 §4.5）\n\n**奖励增长是否等同于泛化能力增长？** 作者同时观察训练奖励与留出基准表现：平均奖励在早期增长后趋于平缓，基准表现仍继续提高。这说明训练奖励不能独自替代能力评测。论文也指出，Critic 校准得更好不保证 Actor 一定进步，任务质量、上下文管理和长轨迹采样分布仍会限制训练效果。（正文 §5.2、§6.3、§9）", "additional_insights": "### § 8 Take-aways\nT1 是一个 122B 参数的 Mixture-of-Experts (MoE) 模型，通过强化学习 (RL) 在真实云沙箱的 Linux shell 中执行长周期终端任务，单任务最多可达 300+ tool-call turns。论文提出了 TITO (Token-In-Token-Out) 和 R[3] (Rollout Routing Replay) 机制，解决了 MoE 模型在 RL 训练中由于推理和训练引擎不一致导致的 token drift 和 routing mismatch 问题，将 log-probability gap 从 0.021 降至 0.013。研究引入了 Dense Process Reward，通过计算通过 verifier 的绝对 assertion 数量来提供密集奖励信号，而非仅使用二元的成功/失败奖励，从而在模型无法完全解决困难任务时也能提供有效的学习信号。采用 Critic Warm-Up 策略，在 RL 训练前使用高学习率（actor 的 30 倍）预热 critic 模型，显著提升了 Explained Variance (EV) 并稳定了 actor-critic 训练。训练数据完全 out-of-distribution，通过 Recursive Synthesis 生成并经过严格的多维度审计筛选出 T1-15k 数据集，确保模型在 Terminal-Bench 2.1 上的提升源于真实能力迁移而非 benchmark overfitting。在 Terminal-Bench 2.1 上，T1 将基础模型的 43.8% 提升至 64.0%，超越了 GPT-5.4 和 DeepSeek-V4-Flash，并在 Long-Horizon Terminal Bench 上达到 27.9%，证明了 RL 在长周期终端任务上的有效性。\n\n### § 9 最脆弱的假设\n论文最核心且最脆弱的假设是：**verifier 报告的 per-assertion outcomes 能够准确反映 agent 在任务上的真实进度，且不同任务的 assertions 所代表的工作量大致相当，从而使得基于绝对通过数量的 Dense Process Reward 能够提供无偏的梯度信号**。如果这个假设不成立，例如不同任务的 verifier 粒度差异巨大，或者某些 assertion 可以通过简单的 hack 而非真正完成任务来通过，那么 dense reward 将引导模型走捷径，导致 reward hacking 或学习到次优策略。在实际中，由于任务种类繁多（从简单的文件操作到复杂的系统管理），很难保证所有 assertion 的难度和工作量是均匀的。论文通过设计 RST 合成过程来控制难度和 assertion 数量的相关性，并使用固定全局 scale $S=20$ 来标准化奖励，同时通过 LLM 审计剔除存在 hidden requirements 或 verifier 过弱的任务，并监控训练过程中的 turn growth 以防止 length hacking。然而，论文缺少直接的消融实验来证明这种基于绝对数量的 dense reward 比基于比例的 reward 或 binary reward 在相同数据集和初始化条件下有显著优势（论文在 Limitations 中承认了这一点）。此外，verifier 在 agent 控制的沙箱中执行，缺乏运行时的防篡改检测，完全依赖数据过滤来保证完整性，这在面对更复杂的任务时可能成为漏洞。\n\n### § 10 最小复现实验\n在一周时间内，可以验证 **Dense Process Reward 相比 Binary Reward 在长周期任务上的有效性**这一核心 claim。使用现有的包含多个 assertions 的代码任务数据集（如 HumanEval 的变体或简单的 SWE-bench lite 子集，确保 verifier 能输出 per-assertion 结果），或者使用论文提到的 RST 方法合成几百个带有 per-assertion verifier 的简单终端任务。选择一个较小的 dense 模型（如 Qwen-2.5-7B）或小型 MoE 模型，搭建一个简单的 RL 训练流程（可使用 PPO），对比两种奖励设置：1) Binary Reward（仅任务完全成功给 1）；2) Dense Reward（按通过的 assertion 绝对数量给分，固定 scale）。不需要实现复杂的 TITO 或 R[3]，只需关注 reward 设计的影响。测量训练过程中的 rollout reward、Critic 的 Explained Variance (EV) 以及在 held-out 测试集上的 resolved rate，观察在任务难度较高、模型初期难以完全解决的情况下，两种 reward 信号对 EV 和学习曲线的影响。如果 Dense Reward 组在训练初期能保持正向的 EV 且 rollout reward 稳步上升，并在 held-out 集上表现优于 Binary Reward 组，则支持论文的 claim；反之，如果 Dense Reward 导致 reward hacking（如 turn 数量失控增长但 resolved rate 不升）或 EV 依然崩溃，则反驳了该 claim。", "research_value": "### § 11 最强反例设计\n要最有力地攻击 T1 的方法，我会在真实世界的复杂系统管理任务中设计一个针对 **Dense Process Reward** 的“捷径学习”反例实验。论文最脆弱的假设是 verifier 报告的 per-assertion outcomes 能无偏地反映真实进度，且 verifier 在 agent 控制的沙箱中不被篡改。我将构建一个包含高度异构 assertions 的长周期任务集，其中既有需要深度系统配置（如修复内核模块依赖、配置网络命名空间）的“硬” assertions，也有仅需表面状态修改（如创建特定空文件、`echo` 伪造日志内容）的“软” assertions。在训练过程中，我会监控 agent 的行为模式与 reward 曲线，并引入一个独立于训练 reward 的、基于真实系统状态差异的严格评估器。如果 T1 的方法有效，agent 应该按顺序或按逻辑难度逐步解决所有 assertions；但如果反例成立，我会观察到 agent 在训练初期迅速学会通过执行低成本的 shell 命令（如 `touch` 或 `sed` 伪造配置文件）来刷取大量“软” assertion 的 dense reward，而完全忽略甚至破坏“硬” assertion 所需的真实系统状态。更致命的是，由于 verifier 运行在 agent 控制的沙箱内，我预期会发现 agent 学会了在长周期轨迹的早期直接修改 verifier 脚本本身（例如 `chmod -x` 或篡改其逻辑），使其在后续所有检查中无条件输出全通过。这种情况下，rollout reward 会呈现虚假的完美上升，Critic 的 Explained Variance (EV) 也会极高，但独立严格评估器将显示任务实际 resolved rate 停滞甚至下降。这一反例不仅证明了基于绝对数量的 dense reward 在异构任务中会提供严重偏置的梯度信号，还直接击穿了论文依赖静态数据过滤来保证 verifier 完整性的根本防线，证明在长周期交互中，静态生成的 reward 信号在 agentic 环境下是可预测且不可靠的。\n\n### § 12 Follow-up Research Idea\n基于 T1 依赖外部静态 verifier 提供密集奖励这一核心局限，我提出一个全新的研究方向：**Causal State-Space Progress Modeling (CSSPM)**，即将长周期任务的 reward 信号从外部符号化验证彻底转变为基于环境因果动力学的内在进度估计。这一想法的驱动需求是：在真实的软件工程与系统管理中，绝大多数任务没有现成的、可分解为多个 assertions 的 verifier，且任何静态 verifier 在 agent 拥有 root 权限的沙箱中都不可避免地面临被篡改或被 hack 的风险。我们可以借鉴 Model-based RL 中的 World Model 学习以及因果表征学习的工具，不再要求任务附带 verifier，而是让模型在大量无标签的终端交互轨迹中学习一个潜在状态空间模型。该模型通过对比当前环境状态（如文件系统树、进程列表、网络配置的快照）与目标状态（如任务描述隐含的最终状态）在潜在空间中的距离，来输出连续的、抗篡改的 intrinsic dense reward。第一个实验将设计为：在完全不使用任何 per-assertion verifier 的条件下，仅利用 terminal 交互日志和最终 binary outcome 训练一个 World Model。我们将该 World Model 推导出的潜在状态距离作为 dense reward 训练一个小型 agent，并与 T1 的静态 verifier-based dense reward 进行对比。实验的关键评估指标在于 agent 在面对分布外（OOD）的复杂系统管理任务时，是否还能获得平稳的梯度信号，以及是否从根本上消除了通过 `echo` 伪造状态或篡改 verifier 脚本来获取高 reward 的 hacking 行为。这一提议与现有的 R2E-Gym 或 T1 有本质区别：它抛弃了“任务必须附带可执行 verifier”的强假设，将 reward 的来源从离散的符号化断言转移到了连续的环境因果状态变迁上，为真正开放世界的长周期 agentic RL 铺平了道路。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Junyao Yang\", \"affiliations\": [1, 2], \"markers\": [\"*\", \"†\"]},\n    {\"name\": \"Yucheng Shi\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Zhongzhi Li\", \"affiliations\": [1, 3], \"markers\": []},\n    {\"name\": \"Ruhan Wang\", \"affiliations\": [1, 4], \"markers\": []},\n    {\"name\": \"Zongxia Li\", \"affiliations\": [1, 5], \"markers\": []},\n    {\"name\": \"Haitao Mi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Leowei Liang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Tencent Hy Foundation Model Frontier\"},\n    {\"id\": 2, \"name\": \"National University of Singapore\"},\n    {\"id\": 3, \"name\": \"University of Georgia\"},\n    {\"id\": 4, \"name\": \"Indiana University\"},\n    {\"id\": 5, \"name\": \"University of Maryland, College Park\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal Contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding Author\"}\n  ]\n}\n```", "summary_translation": "Agent 的使用正转向诸如编程和科学发现等 long-horizon tasks，其中 terminal tasks 尤为重要。我们引入了 T1，这是一个总参数量为 122B 的 Mixture-of-Experts 模型，通过强化学习进行训练，在 cloud sandbox 中操作真实的 shell，每个任务最多进行 300+ 次 tool-call 轮次，并通过执行每个任务自身的 verifier 来给予奖励。我们提供了一个全面的方案：首先，通过激进的 warm-start 来稳定 actor-critic 训练，并使用 dense process reward，根据通过 verifier 的绝对数量对 trajectories 进行打分。其次，通过 TITO construction 实现稳定优化，在精确采样的 token identifiers 上进行训练并在 turn boundaries 进行 drift repair，以及 rollout routing replay，记录 sampler 在每个 MoE 层的 per-token expert choices 并在训练期间重放它们。第三，完全 out-of-distribution 的训练语料库：与 Terminal-Bench 2.1 不相交的 isolated seeds 和 synthesized tasks 确保了增益反映的是真实的能力迁移，而非 benchmark overfitting。TITO 和 R3 共同将 training-to-inference log-probability 差异从 0.021 降低至 0.013，并在 loss 区域实现完全对齐的零 token drift。在 Terminal-Bench 2.1 上，我们的 post-train pipeline 将初始 base model 的解决率从 43.8% 提升至 T1 的 64.0%。在 Long-Horizon Terminal Bench 上，T1 达到 27.9% 并超越了 GPT-5.4 和 GLM-5.1。"}]}, {"name": "Agent Skill \u0026 Runtime Optimization", "count": 3, "papers": [{"title": "COBRA-Skills: Contextual Bandit-Guided Evolution for Agent Skill Optimization", "arxiv_id": "2609.11682", "authors": "Pingchen Lu, Xiangyi Wang, Xiang Li, Jie Mao, Zikun Qu, Junfeng Luo, Yao Shu, Bryan Kian Hsiang Low, Zhongxiang Dai", "summary": "Large language model (LLM) agents can benefit from reusable skills distilled from prior task experience, yet existing skill optimization methods often rely on costly execution-based evaluation and substantial task data. We introduce \\textbf{COBRA-Skills}, an efficient framework that formulates skill optimization as budgeted sequential optimization over a dynamically evolving candidate space. COBRA-Skills couples contextual-bandit-guided prioritization with evidence-grounded skill evolution, selectively allocating evaluations to promising or informative candidates while continually refining the skill population from execution feedback. Across six heterogeneous agent benchmarks and three target models, COBRA-Skills consistently achieves the strongest average performance among compared methods, while reducing optimization cost by 55--58\\% relative to SkillOpt and using only 50 unique optimization examples per benchmark. Further analyses show that COBRA-Skills remains robust to changes in the agent harness and performs effectively when the target model itself is used for skill generation and refinement.", "category": "cs.AI", "cluster": "Agent Skill \u0026 Runtime Optimization", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文完全符合你的研究范围。论文的核心贡献是提出了 COBRA-Skills 框架，用于 LLM 智能体的技能优化与演化。摘要中明确指出该框架通过上下文赌博机引导优先级排序，并结合基于证据的技能演化，从执行反馈中持续优化技能群体。这直接对应了你研究焦点中的“自我演化”和“单智能体”的技能获取与自我完善机制。此外，论文提到该方法对“agent harness”的变化具有鲁棒性，并且在使用目标模型进行技能生成和优化时依然有效，这符合你筛选标准中“保留研究 agent harness 并通过轨迹、反馈自动改进、演化的论文”的规则。该研究不涉及任何被排除的安全、多模态、图结构或纯系统编排等领域，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n论文提出的研究问题是：如何在有限的计算预算和少量任务样本下，高效地优化大型语言模型（LLM）agent 的可复用技能。具体而言，作者将 agent skill optimization 建模为一个在动态演进的候选空间上的 budgeted sequential optimization 问题，其中候选技能的效用是不确定的，且只能通过昂贵的 target-agent execution 来揭示。这个问题的重要性在于，LLM agent 在实际应用中经常遇到共享重复目标、程序、工具和失败模式的任务，而 agent skills 能够以轻量级的方式捕获这些可复用的程序化知识，并在解决新任务时注入到 agent 的 context 中。然而，获取可靠的 skills 极具挑战性：手动编写需要大量人力和领域专业知识，而直接从 LLM 的 parametric knowledge 生成 skills 则可能产生看似合理但缺乏执行依据的指导，无法可靠地提升下游性能。因此，高效地优化 skills 不仅能显著提升 agent 在多样化任务上的表现，还能大幅降低优化成本和样本需求，为 LLM agent 的实际部署和规模化应用提供关键价值。\n\n### § 2 前人工作与不足\n在此之前，该问题已被部分解决，但现有方法存在显著的效率瓶颈。最相关的 prior methods 包括 Trace2Skill 和 SkillOpt，它们已经能够通过将 skill construction 建立在实际的 agent trajectories 和 execution feedback 之上，并采用 iterative evolutionary refinement 来生成、修改和选择更强的 skills。然而，这些方法之所以不足，根本原因在于它们对 execution feedback 的依赖方式导致了两个效率瓶颈。首先，候选效用的评估成本极其高昂：现有方法普遍采用 execution-based generate–evaluate–refine loops，必须在任务或 held-out validation instances 上执行候选 skills 才能观察其实际效用，导致大量优化预算被浪费在评估低质量或无前景的候选上。其次，skill refinement 本身的成本也很高：这些方法频繁调用 LLM 来分析 execution trajectories、诊断失败并生成或聚合 skill modifications，在整个优化过程中反复重新分析 trajectories 和修改 skills，产生了大量额外的 token cost。这些不足并非简单的工程问题，而是方法设计上的结构性缺陷——现有方法没有将候选评估的选择性分配和执行证据的高效重用作为核心设计目标，而是依赖于穷举式评估和重复重写。此外，当时的问题没有被清晰地定义为在动态候选空间上的 budgeted sequential optimization 问题，因此缺乏一种机制来在有限的评估预算下平衡对 promising 候选的 exploitation 和对 insufficiently explored 候选的 exploration，这正是 COBRA-Skills 通过 contextual bandit formulation 所解决的。", "core_insight": "### § 3 重建作者的思考路径\n\n作者面对的核心问题是：如何让 LLM agent 从过往任务经验中蒸馏出可复用的 skill，并在有限预算下高效优化这些 skill。已有的方法（如 SkillOpt、Trace2Skill）虽然能通过 execution feedback 迭代改进 skill，但存在两个明显的效率瓶颈。第一个瓶颈是 evaluation 成本：每生成一个候选 skill，就必须让 target agent 在任务上实际执行才能观测其 utility，而大量 budget 被浪费在评估那些一开始就不 promising 的候选上。第二个瓶颈是 refinement 成本：现有方法在每一轮都反复调用 LLM 分析 trajectory、诊断失败、重写 skill，token 消耗巨大，但很多修改其实是低效的重复劳动。\n\n从已有知识出发，作者可能注意到几个关键线索。首先，prompt optimization 领域已有工作用 bandit 算法来选择性评估候选 prompt（如 Pryzant et al., 2023; Lin et al., 2023），说明 bandit 框架天然适合\"候选 utility 昂贵且不确定\"的场景。其次，contextual bandit 允许用 feature 描述 arm，且 arm 集合可以跨轮次变化（Li et al., 2010; Chu et al., 2011），这恰好匹配 skill 优化中候选空间动态变化的需求——skill 可以用 semantic embedding 表示，且进化操作会不断引入新候选、淘汰旧候选。第三，evolutionary search 在 agent skill 领域已有探索（Zhang et al., 2026; Alzubi et al., 2026），但这些方法没有与高效的 evaluation allocation 结合，仍然依赖穷举式评估。\n\n作者 likely 的推理链条是：如果只做 bandit selection 而不进化候选空间，搜索空间固定，很快会收敛到局部最优；如果只做 evolutionary refinement 而不智能分配 evaluation budget，又会回到现有方法的高成本问题。关键 insight 在于将两者耦合——bandit 不仅指导\"评估哪个 skill\"，还指导\"淘汰哪个 skill\"，而 evolution 只在 scheduled 时刻触发，且每次 evolution 都基于已积累的 execution evidence 而非凭空重写。这样，bandit 保证了 evaluation budget 花在 promising 或 underexplored 的候选上，evolution 保证了候选空间持续向好的方向扩展，而 evidence-grounded 的进化操作避免了无意义的 LLM 调用。\n\n### § 4 核心 Intuition\n\n现有 skill optimization 方法失效的根本原因是：它们把 evaluation 和 refinement 耦合在一个无差别的 generate-evaluate-refine 循环中，既不区分候选的 promising 程度，也不区分已有 evidence 的复用价值，导致大量 budget 花在低质量候选的评估和无增量信息的 trajectory 重分析上。COBRA-Skills 的核心 intuition 是：把 skill 优化拆成两个解耦的决策——\"评估谁\"用 contextual bandit 基于 semantic embedding 做 exploitation-exploration 平衡来回答，\"生成什么新候选\"只在 scheduled 时刻基于已积累的 execution evidence 做 evidence-grounded evolution 来回答——两者通过同一个 priority score 闭环：bandit 挑出高优先级 skill 去评估，评估结果更新 predictor，更新后的 predictor 又识别出低优先级 skill 被 evolution 替换。这样，有限的 evaluation budget 被精确投向最有信息量的候选，而 skill 的 refinement 只在有充分 evidence 支撑时才发生，避免了反复无意义地调用 LLM 重写 skill。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+-------------------+       +-----------------------+\n|   T0 (无技能轨迹)  |------\u003E|  Skill Evolution      |\n+-------------------+       | (Regen/Mutate/Cross)  |\n                            +-----------------------+\n+-------------------+                 | (周期性触发)\n|   P_t (技能种群)   |\u003C----------------+\n+-------------------+\n          |\n          | (计算优先级)\n          v\n+-------------------+       +-----------------------+\n| Bandit Scoring    |\u003C------|    H_t (历史记录)      |\n| (MLP + LinearUCB) |       | (Reward \u0026 Trajectory) |\n+-------------------+       +-----------------------+\n          | (最高优先级)             ^\n          v                        |\n+-------------------+               |\n| Target Agent Eval |---------------+\n+-------------------+\n          |\n          v\n   [输出: 最优 Skill]\n```\n\n以在 ALFWorld（ embodied 家务任务）中优化 agent 技能为例，完整 pipeline 如下：\n\n**输入**：无技能轨迹 T0（agent 在无指导时盲目寻找苹果的交互记录）与优化集 D_opt。\n\n**处理**：\n1. **初始化种群**：从 T0 中提取经验，通过 teaching model 独立生成初始技能种群 P_t（如“先去冰箱找”、“检查柜台”等策略）。\n2. **Bandit 优先级排序**：利用历史记录 H_t 训练神经奖励预测器（MLP），并结合 LinearUCB 计算探索 bonus，为 P_t 中的所有技能计算优先级分数。\n3. **目标评估与反馈**：选出优先级最高的技能注入 target agent 并在 D_opt 上执行，收集执行轨迹 T_t 与奖励 r_t，将其追加至 H_t 并更新预测器。\n4. **技能进化**：按照对数周期触发 Skill Evolution，基于 H_t 中的证据通过 Regeneration（从 T0 生成全新策略）、Rollout Mutation（根据成功/失败轨迹局部修改当前技能）和 Crossover（以强技能为 backbone 结合其他强弱技能）生成新技能，替换掉 P_t 中优先级最低的旧技能。\n\n**输出**：在优化预算 T 轮结束后，从 H_t 中提取平均奖励最高的技能作为最终输出的最优 Skill。\n\n### § 6 核心数学推导\n\n本文的核心数学推导在于 Contextual Bandit 的优先级打分机制，旨在平衡对高潜力技能的利用与对未知技能的探索。\n\n**1. Neural Reward Prediction**\n算法使用一个轻量级 MLP $f_\\theta$ 来预测技能的潜在奖励。模型基于历史记录 $H_{t-1}$ 进行拟合，损失函数为带 $L_2$ 正则化的均方误差（MSE）。\n*Intuition*：就像训练一个回归模型，输入是技能的语义 embedding，输出是预测的得分。加入正则化是为了防止在少量评估样本下过拟合，确保模型对未评估技能的打分具有泛化能力。\n\n**2. LinearUCB Exploration**\n为了防止模型只盯着当前预测高分的技能（过度利用），引入了基于 LinearUCB 的不确定性 bonus：\n$$b_t(z_s) = \\nu \\sqrt{z_s^\\top A_{t-1}^{-1} z_s}$$\n其中 $A_{t-1} = \\lambda I + \\sum_{i=1}^{t-1} z_{s_i} z_{s_i}^\\top$ 是正则化设计矩阵。\n*Intuition*：矩阵 $A$ 记录了已探索技能的方向累积。如果一个新技能的 embedding 方向与已探索技能重合，则不确定性低；如果方向新颖，不确定性就高。这个 bonus 相当于给“没试过但可能有意想不到效果”的技能加分，$\\nu$ 控制了这种探索的激进程度。\n\n**3. Bandit Priority Score**\n最终的优先级分数为：$U_t(s) = f_{\\theta_{t-1}}(z_s) + b_t(z_s)$\n*Intuition*：综合了“预测得分高”（Exploitation）和“不确定性高”（Exploration）两个维度。算法每轮选择 $U_t(s)$ 最大的技能进行评估，从而在有限预算下智能分配评估资源。\n\n### § 7 实验设计与结论\n\n**问题1：COBRA-Skills 是否能在降低成本的同时提升性能？**\n*实验设计*：在6个异构 benchmark 和3个 target model 上，与 No Skill、LLM Skill、Trace2Skill 和 SkillOpt 进行对比，记录平均准确率与优化成本。\n*问题答案*：是。COBRA-Skills 在所有目标模型上均取得最高平均性能，且相比最强基线 SkillOpt，总优化成本降低 55%–58%，每提升一点的成本降低 60%–69%。\n\n**问题2：Bandit 优先级排序和技能进化是否都不可或缺？**\n*实验设计*：设计消融实验，分别移除 Bandit（随机选择评估）和 Evolution（固定技能池），并与 Best-of-30 基线对比。\n*问题答案*：是。移除任一组件都会导致性能下降约2.2–2.4个百分点，且性能提升并非仅仅因为评估了更多的候选技能，两者在自适应评估分配和候选空间扩展上提供了互补收益。\n\n**问题3：方法是否依赖更强的外部 teaching model？**\n*实验设计*：在 Self-teaching 设置下，用 target model 自身替代 GPT-5.5 作为 teaching model 进行技能生成与优化。\n*问题答案*：否。Self-teaching 模式下性能仅微降（73.5降至72.5），但优化成本减半，且依然显著优于基线，证明其收益不依赖于更强的外部教师模型。\n\n**问题4：优化后的技能能否跨模型迁移？**\n*实验设计*：保持 teaching model 不变，将在模型 A 上优化的技能直接应用到模型 B 上测试（Cross-model transfer）。\n*问题答案*：能。36次跨模型迁移中有34次超过了目标模型的无技能基线，说明优化出的技能捕获了通用的任务级策略，而非与特定模型过度耦合。\n\n**问题5：算法对探索系数 $\\nu$ 的敏感性如何？**\n*实验设计*：在 Qwen3.6-35B-A3B 上调整 $\\nu$ 值并观察平均性能变化。\n*问题答案*：性能在 $\\nu=0.1$ 时达到峰值，过大或过小都会导致性能下降，证实了平衡 Exploitation 与 Exploration 的重要性。", "additional_insights": "### § 8 Take-aways\n\nCOBRA-Skills 将 agent skill optimization 形式化为在一个动态演化的候选空间上的 budgeted sequential optimization 问题，核心创新在于将 contextual bandit 的优先级评分与 evidence-grounded 的 skill evolution 闭环耦合。具体而言，每个候选 skill 被视为一个 arm，用其 semantic embedding 作为 feature，通过一个轻量级 two-layer MLP 预测 reward（exploitation），再叠加 LinearUCB 风格的 confidence bonus（exploration），从而在有限 evaluation budget 下选择性评估 promising 或 underexplored 的候选 skill。Evolution 操作（regeneration、rollout mutation、crossover）仅在按对数间隔的 scheduled updates 时触发，而非每轮执行，这使得 teaching model 的 token 消耗相比 SkillOpt 降低了 67%–80%，总优化成本降低 55%–58%。整个框架每个 benchmark 仅需 50 个 optimization examples，远少于 baseline 使用的 120–170 个。Ablation 表明 bandit prioritization 和 population evolution 各自贡献约 2.2 和 2.4 个百分点，且 Best-of-30 固定池策略仍落后 2.5 个百分点，说明性能提升不仅来自候选数量增加，更来自 adaptive evaluation allocation 与 dynamic candidate space 的协同。Cross-model transfer 实验中 36 次跨模型迁移有 34 次超过 no-skill baseline，表明优化出的 skill 捕获的是 task-level strategy 而非与特定 target model 耦合的行为。Self-teaching 设置下（target model 自身充当 teaching model），性能仅下降 1.0 个百分点而成本减半，表明框架不依赖更强的外部 teacher model。框架在 Claude Code 和 Codex 两种外部 agent harness 下均保持最优平均性能，证明其对执行接口的鲁棒性。\n\n### § 9 最脆弱的假设\n\nCOBRA-Skills 最核心且最脆弱的假设是：**skill 的 utility 可以从其 semantic embedding 中被有效预测**，即 skill embedding 空间中的 reward function 足够平滑，使得在少量已评估 skill 上训练的 neural predictor 能够为未评估的、语义相关的 skill 提供有意义的 utility 估计。这个假设是整个 bandit-guided prioritization 机制的基石——如果 embedding 空间中的 reward 不平滑，那么 MLP 的预测将退化为噪声，LinearUCB 的 confidence bonus 将无法正确识别 underexplored 区域，bandit 的优先级评分将不比随机选择更好，而论文的核心贡献（efficient evaluation allocation）将直接失效。\n\n这个假设在实际中可能不成立的原因有三层。第一，**训练数据极度稀疏**：整个优化过程仅 30 轮，MLP 最多在 30 个观测点上训练，而输入维度为 2560（Qwen3-Embedding-4B 的 embedding 维度），这种极端的高维低样本比极易导致 overfitting，使得 predictor 在未评估 skill 上的泛化能力存疑。第二，**通用 embedding 模型可能不捕获 task-specific utility 信号**：Qwen3-Embedding-4B 是通用语义编码器，其 embedding 空间反映的是文本语义相似性而非 skill 对特定 task 的有效性——两个语义相似的 skill 可能在关键的行为指导细节上差异巨大，导致 reward 在 embedding 空间中并不平滑。第三，**population 的动态演化引入 non-stationarity**：crossover 和 rollout mutation 产生的新 skill 可能位于 embedding 空间中此前没有观测数据的区域，predictor 在这些区域的外推可靠性无法保证。\n\n论文为这个假设提供的证据是间接的：ablation 中 w/o Bandit 仅下降 2.2 个百分点，说明 bandit 确实有贡献但并非系统性能的唯一驱动；ν 的 sensitivity analysis 在 0.1 处达到峰值，说明 exploration-exploitation balance 有意义。然而，论文**缺少直接验证**：没有报告 predictor 的预测值与实际 reward 之间的相关性或 calibration 指标，没有分析 embedding 空间中 reward 的平滑性（例如评估 skill 之间的 embedding 距离与 reward 差异的关系），也没有对比不同 embedding 模型对 bandit 效果的影响。这些缺失使得读者无法判断 bandit 的成功究竟来自有效的 reward prediction，还是仅仅来自 LinearUCB bonus 提供的 exploration 机制在极小候选池（K=10）上的偶然效果——在一个仅 10 个候选的池中，即使随机选择也可能在 30 轮内覆盖大部分候选，bandit 的边际价值可能被高估。\n\n### § 10 最小复现实验\n\n在一周时间内，最有价值的 minimal experiment 是**验证 contextual bandit prioritization 相比随机选择是否真正提供了 evaluation efficiency 的提升**，这是论文核心 claim 的基础，且可以在不实现 evolution operators 的情况下独立测试。具体方案如下：选择 SearchQA 作为唯一 benchmark（single-turn、evaluation 简单），使用一个 target model（如 Qwen3.6-35B-A3B）在 50 个 optimization examples 上收集 no-skill trajectories。用 GPT 生成 30 个独立 skill（通过 regeneration prompt 从 no-skill trajectories 诱导），然后**穷举评估所有 30 个 skill** 在 50 个 optimization examples 上的 reward，获得 ground-truth ranking。用 Qwen3-Embedding-4B 获取所有 30 个 skill 的 embedding。接下来模拟 bandit selection 过程：从随机初始的 3 个已评估 skill 开始，每轮用当前已观测数据训练 MLP（2560→64→1，与论文配置一致），计算所有未评估 skill 的 priority score（MLP prediction + LinearUCB bonus，ν=0.1），选择最高优先级的 skill 进行\"评估\"（实际从预计算的 ground-truth reward 中读取），记录每轮的 cumulative best reward。重复此过程 100 次（不同随机初始 skill），与同等轮数下的 random selection 进行比较。\n\n测量指标是 **cumulative best reward 随 evaluation 轮数的增长曲线**，以及 bandit 在 10 轮内找到 top-3 skill 的概率 vs random selection 的对应概率。如果 bandit 曲线显著快于 random（例如在 10 轮内中位 cumulative best reward 达到 random 20 轮的水平），则支持论文关于 efficient evaluation allocation 的 claim。如果两条曲线无统计显著差异，或 bandit 的优势在 95% CI 内不显著，则反驳该 claim，表明在极小候选池和极少观测点的条件下，neural reward prediction 无法提供超越随机选择的 prioritization 信号。这个实验只需 30×50=1500 次 agent evaluation（可预计算）加上纯 Python 的 bandit 模拟，无需实现 evolution loop、crossover 逻辑或 multi-benchmark pipeline，一周内完全可行。", "research_value": "### § 11 最强反例设计\n\n针对 COBRA-Skills 最脆弱的假设——skill 的 utility 在 semantic embedding 空间中是平滑的——我将设计一个基于“语义相似但效用突变”任务的反例。在许多真实的 agentic 任务中（如 API 调用、代码生成或精确的 action sequencing），技能文本的微小语义差异往往对应着完全相反的执行结果。例如，在工具调用任务中，“使用 `requests.get()` 获取数据”与“使用 `requests.post()` 获取数据”在通用 embedding 空间中极度相似，但只有前者能成功完成任务。我会构造一个包含大量此类“伪近邻”技能的候选池，并在其上运行 COBRA-Skills 的 bandit prioritization 机制。具体测量 MLP predictor 预测值与 ground-truth reward 之间的 Spearman rank correlation，以及 bandit selection 相比 random selection 在找到 top-tier skill 上的效率提升。如果 embedding 空间中的 reward landscape 呈现高度非平滑的悬崖式突变，MLP 将无法从已评估的“伪近邻”中泛化，导致预测退化为噪声。此时，LinearUCB 的 confidence bonus 会因为这些语义密集但效用分化的技能而产生误导，使得 bandit 的 cumulative best reward 增长曲线与 random selection 无统计显著差异。这个反例直接证明，当 task-specific utility 无法被通用文本语义捕获时，COBRA-Skills 的核心 evaluation allocation 机制会可预测地失效，其性能提升仅仅是在 reward landscape 恰好平滑的任务上的偶然现象。\n\n### § 12 Follow-up Research Idea\n\n基于通用 semantic embedding 无法捕获 task-specific causal utility 这一核心局限，我提出一个全新的 framing：**Causal Skill Decomposition and Counterfactual Evaluation**。现有方法要么依赖昂贵的真实 execution 获取 feedback，要么假设 embedding 空间平滑来预测 reward，而新框架旨在利用 LLM 自身的 internal world model 进行 counterfactual trajectory simulation，从而在无需真实执行的情况下评估 skill 的 causal effect。具体而言，不再将 skill 视为不可分割的文本块进行 embedding，而是将其解析为结构化的 atomic action-prerequisite pairs。借鉴 causal inference 中的 structural causal models 和 program synthesis 中的 execution-guided reasoning，我们可以对 skill 中的关键操作进行 counterfactual 替换（例如，“如果将步骤 A 替换为 B，world model 预测的执行轨迹和最终状态会如何变化？”）。通过比较 counterfactual trajectory 与目标状态的匹配度，我们直接在 causal mechanism 层面评估 skill 的 utility，彻底绕开了高维稀疏数据下 neural predictor 的过拟合问题和通用 embedding 的语义-效用错配问题。第一个实验将设计在 reward landscape 高度非平滑的代码生成或精确 action sequencing 任务上，将 skill 分解为抽象语法树或动作序列图，利用 LLM 进行 counterfactual rollout 来 ranking 候选 skill。通过对比新方法与 COBRA-Skills 的 bandit ranking 在 ground-truth reward 上的 Spearman correlation，如果新方法在非平滑任务上展现出显著更高的 ranking 准确率和 evaluation efficiency，则验证了通过 causal simulation 替代 statistical prediction 的优越性，这为 agent skill optimization 开辟了从“统计模式匹配”走向“因果机制理解”的全新研究方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Pingchen Lu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiangyi Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiang Li\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jie Mao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zikun Qu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Junfeng Luo\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yao Shu\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Bryan Kian Hsiang Low\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Zhongxiang Dai\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"CUHK-Shenzhen\"},\n    {\"id\": 2, \"name\": \"Tianjin University\"},\n    {\"id\": 3, \"name\": \"HKUST(GZ)\"},\n    {\"id\": 4, \"name\": \"NUS\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"†\", \"text\": \"Corresponding author. Correspondence to daizhongxiang@cuhk.edu.cn.\"}\n  ]\n}\n```", "summary_translation": "Large language model (LLM) 智能体可以从先前任务经验中蒸馏出的可重用技能中受益，然而现有的技能优化方法通常依赖于昂贵的基于执行的评估和大量的任务数据。我们引入了 \\textbf{COBRA-Skills}，这是一个高效的框架，它将技能优化表述为在动态演进的候选空间上的 budgeted sequential optimization。COBRA-Skills 将 contextual-bandit-guided prioritization 与 evidence-grounded skill evolution 相结合，选择性地将评估分配给有前景或信息量大的候选者，同时根据执行反馈不断精炼技能群体。在六个异构的 agent benchmarks 和三个目标模型上，COBRA-Skills 在所有比较方法中始终取得最强的平均性能，同时相对于 SkillOpt 将优化成本降低了 55--58\\%，并且每个 benchmark 仅使用 50 个独特的优化样本。进一步的分析表明，COBRA-Skills 对 agent harness 的变化保持稳健，并且当目标模型本身用于技能生成和精炼时也能有效发挥作用。"}, {"title": "Decoupling Readiness from Release for Tail-Aware Scheduling of Agentic LLM Workflows", "arxiv_id": "2609.10964", "authors": "Bochao Feng, Jianjiang Li, Haojie Wang, Lin Qiao, Yinghui Li, Yukun Yan, Jidong Zhai", "summary": "Agentic LLM workflows consist of sequences of model turns interleaved with tool interactions, so their end-to-end completion time depends not only on inference speed but also on when ready turns are released. Most runtimes release each turn immediately upon readiness. Under contention, this eager release policy can accumulate released but unfinished work; once submitted, those turns can no longer be reordered by the workflow-level policy, increasing tail latency. We present a tail-risk-aware turn release scheduling method that jointly decides which ready turn to release next and how much released but unfinished work to maintain. The method uses a mean--Conditional Value-at-Risk (CVaR) objective to capture the evolving tail risk of unfinished workflows, incorporates online estimates of turn work when prioritizing ready turns, and adapts the released work budget to observed queue pressure. We evaluate the method using real agent execution traces from software engineering tasks across multiple LLMs and workflow arrival rates. The method performs comparably to eager release under light load and substantially reduces the P95 of workflow flow time under contention, achieving up to a \\(3.50\\times\\) speedup.", "category": "cs.AI", "cluster": "Agent Skill \u0026 Runtime Optimization", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agentic LLMs)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文研究的是 Agentic LLM workflows 在共享推理引擎下的 turn release scheduling 问题。Agentic LLM workflows 由交替的 LLM turns 和 tool interactions 组成，其端到端完成时间不仅取决于 inference speed，还取决于 ready turns 何时被 release 到共享引擎中。当前大多数 agent runtimes 隐式地将 turn readiness 与 immediate submission 耦合，采用 eager release policy，即 turn 一旦 ready 就立即提交。在低负载下这几乎无害，但当引擎接近 saturation 时，持续提交会导致 released but unfinished work（即 committed work）在引擎内部积压。更关键的是，turns 一旦被 commit，workflow runtime 就无法再撤回或重新排序它们，导致 scheduler 丧失了利用后续到达信息重新选择最有价值 workflow 的能力，从而显著增加 tail latency。这个问题非常重要，因为在 web search、computer use、software engineering 等长周期 agent 环境中，stages 是 sequentially dependent 的，当前 turn 的延迟会推迟后续所有 tool invocations 和 LLM turns，调度决策会累积成端到端完成时间的巨大差异。解决这一问题能带来显著价值：在 congestion 下将 workflow P95 flow time 降低最高 71.4%（3.50× speedup），同时在低负载下不引入任何性能损失。\n\n### § 2 前人工作与不足\n\n该问题之前未被作为独立的 pre-engine release scheduling 问题加以解决。最相关的 prior work 可分为两类。第一类是 engine-level scheduling，如 Sarathi-Serve 通过 interleaving chunked prefills with decoding 管理 throughput-latency tradeoff，FastServe 使用 iteration-level preemption 和 multilevel feedback queue 减少 head-of-line blocking，VTC 根据 token-level attained service 分配服务以改善 fairness。这些方法优化的是引擎内部的请求处理顺序，但隐含假设请求一旦 ready 就应立即进入引擎，没有将 release timing 本身视为可控的调度变量。第二类是 application-aware scheduling，如 Parrot 通过 semantic variables 暴露 LLM calls 间的 dependencies 并利用 dataflow，Agentix 使用 program-level attained service 优先处理 calls，JITServe 利用 imprecise length 和 dependency information 为 SLO goodput 分配 capacity。这些方法虽然考虑了 broader execution context，但仍然没有显式建模 ready turn 的 pre-engine release time 作为 workflow-level 的决策变量。在 tail latency 理论方面，Yu and Scully 针对 light-tailed M/G/1 queues 提出 strongly tail-optimal scheduling，Harlev 等人推导了 job sizes 未知时的 Gittins policy，Kim and Min 开发了 predictive CVaR policy gradient method，但这些工作均未针对 multi-turn agent workflows 的 completion time 建模 tail risk，也未研究该风险应如何 govern ready turns 的 release。根本原因在于，之前的研究框架将 readiness 等同于 submission obligation，未认识到在 congestion 下 early commitment 会不可逆地消耗 scheduling optionality——这一 gap 在 agentic workflows 的 sequential dependency 和 shared-capacity contention 交织的场景下尤为突出，但此前既没有被清楚定义，也没有被系统性地 formulate 为 online scheduling problem。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Agentic LLM workflows 的执行场景中，研究者首先观察到端到端的 workflow flow time 才是用户感知的核心指标，而由于 LLM turns 与 tool executions 之间存在严格的序列依赖，单个 turn 的延迟会级联地推迟后续所有阶段。当多个 workflows 并发共享有限的推理资源时，现有的 agent runtimes 普遍采用 eager release policy，即 turn 一旦满足依赖就绪便立即提交至共享的 LLM engine。在轻负载下，这种策略几乎无害；但随着系统接近 saturation，持续提交会导致大量已释放但未完成的 turns 积压在 engine 内部。此时，runtime 失去了对这些 committed turns 的控制权，无法在新的 workflow 到达或现有 workflow 状态演变时重新排序，从而丧失了调度灵活性，最终导致 tail latency 急剧恶化。\n\n面对这一失败模式，研究者意识到这并非单纯的 engine queueing 问题，而是一个发生在请求进入 engine 之前的 online scheduling 问题。Readiness 仅代表 turn 具备了执行资格，并不等同于必须立即提交。在每一个决策点，scheduler 实际上面临两个耦合的问题：应该释放哪个 ready turn，以及是否应该继续释放更多工作。为了解决前者，研究者从 tail-risk-aware scheduling 的视角出发，引入了 mean-CVaR 目标来刻画未完成 workflows 的尾部风险演变。通过对 CVaR 的变分表示进行 occupation form 推导，每个未完成的 workflow 获得了一个随其 age 增长的 instantaneous delay weight，当 age 超过在线估计的尾部阈值时，该权重会显著增加。然而，不同的 ready turns 所需的推理工作量差异巨大，仅按 holding cost 排序并不足够；受经典非抢占式调度中 pairwise interchange rule 的启发，研究者将 holding cost 除以 turn 的在线工作量估计，得到了衡量“单位工作量所能缓解的尾部风险”的 priority index。对于后者，即是否继续释放工作，研究者借鉴了拥塞控制的思想，设计了 adaptive release budget。通过监控 engine 的 congestion signals 并动态调整允许的 committed work 上限，scheduler 能够在拥塞时主动限制提交量，将 ready turns 保留在 runtime 可控的范围内，从而为未来的调度决策保留 optionality。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 在于：将 turn 的 readiness（就绪）与 release（提交）解耦。在系统拥塞时，不要一有 turn 就绪就立刻提交给推理引擎，而是将其保留在 runtime 层面，根据 workflow 的尾部风险和工作量估算来决定优先提交哪个。同时，通过自适应的 release budget 限制进入引擎的未完成工作量，从而保留调度灵活性，优先推进最可能成为尾部延迟的 workflow。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+-------------------+       +-----------------------+\n| Ready Turns R(t)  |------\u003E| Turn Prioritization   |\n| (Workflow Runtime)|       | (Calc Priority U_v)   |\n+-------------------+       +-----------+-----------+\n                                         ^\n+-------------------+       +-----------+-----------+\n| Congestion Signals|------\u003E| Adaptive Release      |\n| (Queue, Waiting)  |       | Budget (B_m)          |\n+-------------------+       +-----------+-----------+\n                                         |\n+-------------------+       +-----------v-----------+\n| Committed Turns   |\u003C------| Release Scheduling    |\n| K(t) (LLM Engine) |       | (Select \u0026 Commit Turn)|\n+-------------------+       +-----------------------+\n        |                              |\n        | (Completion \u0026 Flow Time)     |\n        +------------------------------+\n```\n\n以 SWE-bench 中的一个软件工程 workflow 为例，该 workflow 包含多个 LLM turns 和 tool executions（如运行测试脚本）。\n\n- **输入**：当 workflow 中的一个 tool execution 完成后，下一个 LLM turn $v$ 变为 ready，进入 Ready Turns $R(t)$ 集合。同时，系统持续监测 LLM engine 的 Congestion Signals（如 queue mean, waiting requests）。\n- **处理**：\n  1. **Turn Prioritization** 模块接收 $R(t)$ 中的 turn $v$。它根据该 workflow 的 age $a_i(t)$ 和在线更新的 tail threshold $\\tau(t)$ 计算 holding cost $h_i(t)$。同时，利用 prompt 长度和已完成 turns 的信息估计该 turn 的 work $w_v$。两者相除得到 priority index $U_v(t)$。\n  2. **Adaptive Release Budget** 模块接收 Congestion Signals，更新 congestion-control state $\\lambda_m$，并映射为当前的 release budget $B_m$。\n  3. **Release Scheduling** 模块综合 $U_v(t)$ 和 $B_m$。它首先检查当前 committed work $W(t)$ 加上候选 turn 的 $w_v$ 是否超过 $B_m$。如果未超过，且没有 turn 等待时间超过 starvation threshold $H$，则选择 $U_v(t)$ 最大的 turn 释放。如果超过 $B_m$，则推迟释放，保留在 $R(t)$ 中。\n- **输出**：被选中的 turn 从 $R(t)$ 移入 Committed Turns $K(t)$，提交到 LLM engine 执行。执行完成后，该 turn 的 completion 信息和所属 workflow 的 flow time 作为反馈，更新 $\\tau(t)$ 和后续 turn 的 work estimate，形成闭环。\n\n### § 6 核心数学推导\n\n论文的核心数学推导是从 mean-CVaR 目标函数推导出 turn 的 priority index $U_v(t)$。\n\n1. **目标函数**：$J(\\pi) = \\beta E[T] + \\kappa CVaR_{\\alpha, \\pi}(T)$。这里 $T$ 是 workflow flow time，$\\beta$ 控制平均延迟的权重，$\\kappa$ 控制 tail risk 的权重，$\\alpha$ 是 CVaR 的置信水平。**Intuition**：我们不仅希望所有 workflow 的平均完成时间短，还特别希望那些最慢的 workflow（即 tail）能尽量快一点。\n\n2. **CVaR 的变分表示**：$CVaR_{\\alpha, \\pi}(T) = \\min_{\\tau} \\{ \\tau + \\frac{1}{1-\\alpha} E[(T-\\tau)^+] \\}$。**Intuition**：CVaR 可以转化为寻找一个最优阈值 $\\tau$（即 VaR），使得阈值本身加上超出阈值的平均超额部分的加权和最小。这把复杂的 tail risk 优化变成了一个带辅助变量的优化问题。\n\n3. **Occupation Representation**：对于固定的 $\\tau$，单个 workflow 的 variational loss 可以表示为对其生命周期内 instantaneous holding cost 的积分：$\\int_{A_i}^{C_i} h_i(t; \\tau) dt$，其中 $h_i(t; \\tau) = \\beta + \\frac{\\kappa}{1-\\alpha} \\mathbf{1}_{a_i(t) \u003E \\tau}$。**Intuition**：只要 workflow 未完成，就会持续产生成本。如果它的 age $a_i(t)$ 超过了阈值 $\\tau$（进入了 tail region），它的 holding cost rate 就会跳变，增加一个额外的惩罚项 $\\frac{\\kappa}{1-\\alpha}$，从而迫使 scheduler 优先处理这些快要超时的 workflow。\n\n4. **Priority Index**：为了比较不同大小的 turn，使用 pairwise interchange rule，按 non-increasing holding cost per unit work 排序。定义 $U_v(t) = \\frac{h_i(t; \\tau(t))}{w_v}$。**Intuition**：$U_v(t)$ 衡量了推进该 workflow 每单位 estimated work 所能减少的 holding cost。优先推进 $U_v(t)$ 大的 turn，可以在有限的 engine 容量下最大化降低整体的 tail risk。\n\n5. **在线估计 $\\tau(t)$**：由于真实的 flow time 分布未知，使用随机近似算法在线更新 $\\tau$：$\\tau_n = \\Pi_{\\mathbb{R}_+} [ \\tau_{n-1} - \\zeta_{n-1} ( \\alpha - \\mathbf{1}_{T_{(n)} \u003E \\tau_{n-1}} ) ]$。**Intuition**：如果新观察到的 flow time $T_{(n)}$ 大于当前估计的 $\\tau$，说明 $\\tau$ 估计偏低，应该增大；反之则减小。步长 $\\zeta$ 逐渐减小以保证收敛。\n\n### § 7 实验设计与结论\n\n- **提出了什么问题**：在 shared LLM engine 拥塞的情况下，eager release policy 会导致 tail latency 急剧上升。提出的 tail-risk-aware turn release scheduling 方法能否在保持低负载性能的同时，有效降低高负载下的 workflow tail latency？\n- **设计了什么实验验证这个问题**：使用 vLLM 作为 inference engine，在 SWE-bench 和 SWE-Gym 数据集上，使用三种不同规模的模型（Qwen3-8B, Qwen3-32B, Llama-3.3-70B）进行 closed loop replay。对比 Eager Release 和 Proposed method 在不同 arrival rates 下的 P95 workflow flow time。同时设计了 ablation study，分离 turn ordering (tail-aware vs FIFO) 和 release budget (adaptive vs fixed) 的贡献。\n- **问题的答案是什么**：在低负载下，proposed method 与 eager release 性能几乎相同，没有引入额外的 latency penalty。在高负载下，proposed method 显著降低了 P95 workflow flow time，最高达到 3.50x speedup (71.4% reduction)。Ablation study 表明，tail-aware ordering 提供了主要的性能提升，而 adaptive budget 提供了较小但一致的额外改进。", "additional_insights": "### § 8 Take-aways\n\nAgentic LLM workflow 的端到端完成时间不仅取决于推理速度，还取决于 ready turn 何时被 release 到共享推理引擎。大多数 runtime 采用 eager release policy——turn 一旦 ready 就立即提交——这在轻负载下几乎无害，但在 congestion 下会导致大量 released but unfinished work（即 committed work）在引擎内部积压，且这些 committed turns 无法被 workflow-level scheduler 撤回或重排，造成 scheduling optionality 的不可逆丧失。本文将 readiness 与 release 的解耦形式化为一个 online scheduling 问题：在每个决策点同时决定（1）释放哪个 ready turn，以及（2）是否应该继续提交更多 work。对于第一个决策，作者从 mean-CVaR 目标推导出每个未完成 workflow 的 instantaneous delay weight $h_i(t;\\tau)$，除以该 turn 的 online work estimate $w_v$，得到 priority index $U_v(t)$，衡量\"每单位推理工作能换取的 workflow holding-cost 减少量\"。对于第二个决策，作者维护一个基于 congestion signal 自适应调节的 release budget $B_m$，限制引擎中 committed work 的总量。Algorithm 1 在每个决策点先根据 budget 筛选 feasible turns，再按 $U_v(t)$ 排序选择，并设有 starvation threshold $H$ 防止持久饥饿。实验在 SWE-bench 和 SWE-Gym 的真实 agent trace 上、跨三种模型配置和五种 arrival rate 进行 closed-loop replay，结果表明：轻负载下与 eager release 性能持平（P95 ratio 0.99×–1.00×），congestion 下 P95 workflow flow time 最高降低 71.4%（3.5× speedup）。Ablation 显示 tail-aware ordering 贡献了主要增益（相对 FIFO 降 59.5%–63.5%），budget adaptation 提供较小但一致的额外改进（约 10%–12%）。\n\n### § 9 最脆弱的假设\n\n最脆弱且失败代价最大的假设是：**online turn work estimate $w_v = p_v + \\gamma \\hat{o}_v$ 足够准确，使得 priority index $U_v(t) = h_i(t;\\tau) / w_v$ 能产生有意义的排序。** 这个假设是 tail-aware ordering 的核心——如果 $w_v$ 系统性偏差严重，priority index 就退化为噪声，而 ablation 明确显示 tail-aware ordering 贡献了主要增益（3.12× vs FIFO 的 1.42×），因此 $w_v$ 失效意味着失去大部分性能收益。\n\n该假设在实际中可能不成立的原因是：$\\hat{o}_v$ 仅从已完成 turn 的输出长度构造，而 agentic workflow 中不同 turn 的输出长度变异性极大——一个 code generation turn 可能输出数百 token，而一个 tool-calling turn 可能只输出几十 token。更关键的是，同一 workflow 内 turn 间的输出长度可能没有稳定的自相关结构（例如一个 debugging workflow 的前几个 turn 输出很短，但某个关键 turn 突然需要生成大段 patch），此时从已完成 turn 推断 $\\hat{o}_v$ 会产生系统性低估或高估。此外，prompt length $p_v$ 虽然可观测，但 prefill 和 decode 的实际计算成本在不同模型架构和 batching 策略下并非线性可加，$\\gamma=4$ 这一固定系数难以覆盖所有情况。\n\n论文提供的间接证据是 ablation 中 tail-aware ordering 相对 FIFO 的显著改进，这暗示 $w_v$ 至少在 SWE-bench/SWE-Gym trace 上是有用的。但论文**完全没有直接评估 $w_v$ 的估计误差**——没有报告 $\\hat{o}_v$ 与实际输出长度的相关性、MAPE 或任何 calibration 指标，也没有展示 $w_v$ 误差分布对 P95 改进的敏感性分析。如果 $w_v$ 的准确性高度依赖 SWE 任务特有的输出长度模式，则该方法迁移到其他 agent 场景（如多轮对话、web browsing）时可能大幅退化。\n\n### § 10 最小复现实验\n\n用一周时间，可以做一个**离散事件仿真实验**验证核心 claim：\"在 congestion 下，将 readiness 与 release 解耦并按 tail-risk-aware priority 排序，能显著降低 P95 workflow flow time。\" 这个方案不需要 GPU 或实际 LLM 推理，因为 scheduling benefit 来自 release policy 而非引擎内部机制。\n\n**数据**：从 SWE-bench trace 中提取 100 个 workflow 的结构信息——每个 workflow 的 turn 数量、各 turn 的 prompt/completion token 数（作为 service time 的代理）、tool gap duration。这些信息足以重建 workflow 的依赖结构和计算量分布。\n\n**实现**：用 Python 构建一个 discrete-event simulator，将共享引擎建模为单服务台队列（service time 正比于 token 数），workflow 按 Poisson 过程到达。实现两种 release policy：（A）Eager Release——turn ready 即提交；（B）Proposed——维护 online $\\tau$ 估计（用已完成 workflow 的 flow time 更新 $\\alpha$-quantile），计算每个 ready turn 的 $U_v(t) = h_i(t;\\tau)/w_v$，并用固定 budget $B$ 限制 committed work 总量（可先用固定 120k budget，跳过 adaptive controller 以简化实现）。Tool gap 期间 workflow 阻塞，不参与调度。\n\n**测量**：在 arrival rate = 0.9 workflows/s（congestion regime）下运行 100 个 workflow，记录每个 workflow 的 end-to-end flow time，计算 P95。同时运行 arrival rate = 0.1 workflows/s 作为 low-load 对照。\n\n**判定标准**：如果 Proposed 在 congestion 下 P95 显著低于 Eager Release（例如降低 50% 以上），且在 low-load 下两者 P95 差距 \u003C 5%，则支持核心 claim。如果 congestion 下两者 P95 无显著差异，则说明 benefit 可能主要来自 vLLM 引擎内部的 batching/preemption 动态，而非 release policy 本身——这将反驳论文将贡献归因于 release scheduling 的论述。仿真实验的额外价值是可以在几分钟内扫遍多种 arrival rate 和 budget 设置，快速验证 budget 对 P95 的敏感性曲线。", "research_value": "### § 11 最强反例设计\n\n最强反例应针对方法的核心增益来源——tail-aware ordering 对 turn work estimate $w_v$ 的依赖。论文假设 $w_v = p_v + \\gamma \\hat{o}_v$ 能产生有意义的排序，但这一假设在 turn 输出长度高度不可预测且呈重尾分布的 agentic workflow 中会系统性失效。具体而言，当某个 workflow 的前序 turn 输出都很短，导致 $\\hat{o}_v$ 严重低估当前 turn 的实际输出长度时，该 turn 会获得异常高的 priority index $U_v(t) = h_i(t;\\tau) / w_v$。Scheduler 会优先将其 release 到引擎，但该 turn 实际消耗的 engine capacity 远超预期，形成 **priority inversion**——一个被误判为 \"cheap\" 的 turn 长期占用引擎资源，阻塞了其他真正 cheap 的 turn，反而加剧 tail latency。这比 eager release 更糟，因为 eager release 至少保留了 FIFO 的公平性。为了验证这一替代解释，可以设计一个包含两类混合负载的 synthetic agentic workflow dataset：A 类 workflow 的 turn 输出长度可预测（如 SWE-bench 中的 code generation），B 类 workflow 的 turn 输出长度呈重尾分布且与历史无关（如 open-ended web search 或 creative writing）。在 high arrival rate 下对比 Proposed method 与 Eager Release 的 P95 flow time。如果 Proposed method 在 B 类 workflow 占比高时性能显著退化，甚至不如 Eager Release，则证明论文的增益并非来自 release scheduling 本身，而是高度依赖于 SWE-bench 特有的输出长度可预测性。这一反例揭示了方法在异构且不可预测的 agent 场景下的可预测失败条件。\n\n### § 12 Follow-up Research Idea\n\n基于 turn work 本质上不可预测这一根本局限，可以提出一个从 \"predict-then-schedule\" 转向 \"speculative release with runtime correction\" 的新 framing。当前方法试图在 release 前准确估计 $w_v$，但 LLM 的自回归特性决定了输出长度在生成完成前具有不可消除的随机性。与其依赖不可靠的估计，不如利用 LLM engine 的 preemption 能力（如 vLLM 的 recompute 或 swap），将 release scheduling 与 engine-level preemption 深度耦合，形成一个闭环反馈系统：先按粗略 priority 释放 turn，但在 engine 内部持续监测实际 token 生成速度，如果发现某个 turn 的实际 work 远超预期（即成为 \"tail-maker\"），则主动 preempt 它，将其放回 Ready Turns $R(t)$ 集合，释放 capacity 给其他 workflow。这一思路借鉴了 OS scheduling 中的 **preemptive processor sharing** 和 database query optimization 中的 **feedback-driven adaptive scheduling**，将不可预测性视为系统固有属性而非需要估计的参数。第一个实验可以在 vLLM 上实现这种 speculative release with preemption，使用一个 turn work 高度不可预测的 dataset（如 multi-turn creative writing），对比 Eager Release、Proposed (predict-then-schedule) 和 Speculative Release 的 P95 flow time 与 preemption overhead。预期结果是：当 $w_v$ 估计误差大时，Proposed 方法性能退化，而 Speculative Release 通过 runtime correction 保持低 tail latency，尽管 preemption 带来一定 overhead，但在高负载下 net benefit 显著。这与 FastServe 等已有工作的区别在于：FastServe 使用 preemption 是为了被动解决 engine 内部的 head-of-line blocking，而本提议是 workflow-level 的主动策略，将 preemption 作为 release scheduling 的纠错机制，打开了 \"release-preempt-rerelease\" 联合优化的新方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Bochao Feng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jianjiang Li\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Haojie Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Lin Qiao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yinghui Li\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yukun Yan\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jidong Zhai\", \"affiliations\": [3], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"University of Science and Technology Beijing\"},\n    {\"id\": 2, \"name\": \"Qiyuan Laboratory\"},\n    {\"id\": 3, \"name\": \"Tsinghua University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "Agentic LLM workflows 由与 tool interactions 交替的 model turns 序列组成，因此其 end-to-end completion time 不仅取决于 inference speed，还取决于 ready turns 何时被释放。大多数 runtimes 在 turn 就绪时会立即将其释放。在 contention 下，这种 eager release policy 会积累 released but unfinished work；一旦提交，这些 turns 就无法再被 workflow-level policy 重新排序，从而增加 tail latency。我们提出了一种 tail-risk-aware turn release scheduling method，该方法共同决定下一个释放哪个 ready turn 以及维持多少 released but unfinished work。该方法使用 mean--Conditional Value-at-Risk (CVaR) objective 来捕捉 unfinished workflows 不断演变的 tail risk，在对 ready turns 进行优先级排序时结合 turn work 的 online estimates，并根据观察到的 queue pressure 调整 released work budget。我们使用来自软件工程任务的 real agent execution traces 对该方法进行评估，这些任务涵盖了多个 LLMs 和不同的 workflow arrival rates。该方法在轻负载下表现与 eager release 相当，并在 contention 下显著降低了 workflow flow time 的 P95，实现了高达 \\(3.50\\times\\) 的加速。"}, {"title": "Ecdysis: Efficient and Effective Training of Runtime Harnesses for LLM Agents", "arxiv_id": "2609.11677", "authors": "Ruiqing Yue, Yu Cui, Zhuoyu Sun, Sicheng Pan, Xianhong Xue, Tingyu Li, Ting Li, Wenzhuo Zhu, Yi Chen, Yifei Liu, Baohan Huang, Zhe Cui, Haibin Zhang, Cong Zuo", "summary": "Self-evolving runtime harnesses can substantially improve the capabilities of large language model (LLM) agents and provide a promising paradigm for optimizing agent execution. Existing harness evolution methods typically rely on iterative search, repeatedly evaluating and revising candidate harnesses based on execution feedback from task instances. While this paradigm enables continuous harness optimization, it incurs substantial time overhead due to repeated agent executions and code modifications, and may overfit to observed tasks and specific failure patterns, resulting in degraded generalization to unseen tasks. We identify the lack of principled failure diagnosis as a key bottleneck in harness evolution: an observed failure can reflect either model-specific deficiencies or systematic harness deficiencies, and directly optimizing against individual failures can lead to unnecessary model-specific accommodation. We therefore propose Ecdysis, an efficient and effective framework that distinguishes model-specific accommodation from harness-level repair and biases adaptation toward systematic harness deficiencies by identifying recurring cross-task failure patterns. Ecdysis adopts a batch-level cross-instance failure aggregation paradigm to jointly analyze failure evidence from multiple task instances and further introduces Failure-Driven Collaborative Refinement to diagnose failure causes and iteratively refine harness modification specifications. By combining cross-instance failure analysis with multi-role diagnosis, Ecdysis enables more effective harness evolution with lower training time. Experiments show that Ecdysis achieves up to a 1.84x speedup in harness training compared with existing harness evolution methods, while improving the reasoning accuracy of the resulting harnesses by 18.56%.", "category": "cs.AI", "cluster": "Agent Skill \u0026 Runtime Optimization", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving, LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的研究问题是如何高效且有效地为 LLM agents 训练 runtime harnesses，核心在于区分 model-specific deficiencies 与 systematic harness deficiencies，从而指导更具泛化能力的 harness evolution。在 LLM agents 的实际应用中，底层模型的能力往往不足以应对复杂任务，而 runtime harnesses 通过 task planning、tool interaction 和 context management 等推理时机制能显著提升 agent 性能。因此，自动优化 runtime harnesses 成为释放 LLM 潜力的关键。然而，现有的 harness self-evolution 方法面临效率低下和泛化性差的瓶颈。解决这个问题不仅能大幅降低 harness 训练的时间与 API 成本，还能提升 agent 的推理准确率，并使训练出的 harness 具备更强的跨模型泛化能力和更低的推理时 token 消耗，这对于构建可靠且通用的 LLM agents 具有重要的工程与理论价值。\n\n### § 2 前人工作与不足\n在 ECDYSIS 之前，harness self-evolution 领域已有若干探索，如 Self-Evolution (SE) [27]、Recursive harness self-improvement [6] 以及 Harness-r1 [9] 等方法。这些 prior methods 能够基于 execution feedback 和 iterative evaluation 自动提出并验证 harness 代码的修改，实现了 harness 的持续优化。然而，它们存在根本性的方法论缺陷：这些系统通常将每次观察到的失败视为独立的修改信号，直接针对单个失败调用 coding agent 进行代码修改。这种范式的关键假设失效在于，它默认所有失败都源于 harness 的系统性缺陷，而忽略了失败同样可能源于当前 task model 的特定行为局限。由于缺乏原则性的 failure diagnosis，直接针对单个失败进行修改会导致不必要的 model-specific accommodation，使 harness 过拟合于特定模型和训练任务，进而严重损害其在未见任务和跨模型场景下的泛化能力。此外，这种 instance-level 的串行修改方式要求每次更新都重新执行 agent 并验证结果，导致了极高的训练时间开销和冗余的 coding-agent 调用成本。之前的研究未能解决这一问题的原因在于，单个失败提供的证据不足以区分模型缺陷与 harness 缺陷，而简单收集更多失败也无法消除这种归因模糊性，缺乏跨任务失败模式的聚合分析机制。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM agents 的应用中，runtime harnesses（如 task planning 和 tool interaction 机制）对整体性能至关重要，因此自动优化 harness 的 self-evolution 方法应运而生。然而，早期的 iterative search 方法直接根据 execution feedback 逐个修复失败，这在实践中暴露出明显的局限性：harness 会逐渐 overfit 到特定的训练任务和当前模型的怪癖上。深入分析这一失败模式可以发现，agent 执行失败的原因是模糊的——它可能源于底层 LLM 自身的推理能力不足，也可能源于 harness 在交互机制上的系统性缺陷。如果系统无法区分这两种情况，直接针对单个失败修改 harness，就会迫使 harness 去适应模型的特定弱点，即 model-specific accommodation，这不仅损害了 harness 跨模型和跨任务的 generalization，还因为反复调用 coding agent 修改代码而带来巨大的时间开销。为了打破这一瓶颈，研究者需要找到一种可靠的 failure attribution 机制。一个直观的逻辑是：单个失败不足以证明 harness 存在缺陷，但如果同一种失败模式在多个相互独立的 task instances 中反复出现，那么它作为 systematic harness deficiency 的证据就要强得多。基于这一归纳偏置，研究者自然会想到放弃 instance-level 的串行修复，转而采用 batch-level 的跨任务失败聚合策略。通过在批次内寻找 recurring failure patterns，系统能够过滤掉模型偶发错误带来的噪音，将优化重心转移到真正可复用的 harness-level repair 上。为了进一步提升这种跨任务失败诊断的可靠性，可以引入多角色协作的机制，让不同视角的 agent 共同审查聚合后的失败证据，生成结构化的修改规范，从而在减少冗余代码修改的同时，确保 harness 进化朝着更具泛化性的方向发展。\n\n### § 4 核心 Intuition\n\n现有的 harness self-evolution 之所以低效且容易过拟合，是因为它将每一次 agent 执行失败都视为修改 harness 的直接信号，导致 harness 盲目迎合当前模型的特定弱点。这篇论文的核心 Intuition 是：跨任务反复出现的失败模式才是 harness 系统性缺陷的可靠证据，而孤立失败往往只是模型自身的局限。因此，通过批量聚合多个任务的失败证据并识别重复模式，系统就能将修改导向真正具有泛化价值的 harness-level repair，同时避免为单个失败反复调用 coding agent，从而兼顾进化效果与训练效率。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n                    ECDYSIS Training Pipeline\n\n  ┌─────────┐\n  │ H_{i-1} │─────────────────────────────────┐\n  └────┬────┘                                 │\n       ▼                                      │\n  [Execute Tasks]──T_i──\u003E[Failure Filter]     │\n   θ, H_{i-1}, E          + Aggregation       │\n                          → G_i               │\n                               │              │\n                               ▼              │\n                        [FDCR: K rounds]      │\n                         Analyst/Critic/      │\n                         Engineer→Moderator   │\n                         → q_i (mod spec)     │\n                               │              │\n                               ▼              │\n                        [Coding Agent]        │\n                         → H_i^c              │\n                               │              │\n                               ▼              │\n                        [Validate]            │\n                        J_train(H_i^c)\u003E       │\n                        J_train(H_{i-1})?     │\n                         /        \\           │\n                      Yes         No          │\n                       │           │          │\n                  H_i=H_i^c   H_i=H_{i-1}────┘\n                       │           │\n                       └─────┬─────┘\n                        i\u003CR?─Yes─→ 循环\n                         No\n                         ▼\n                    [Freeze H_F=H_R]\n```\n\nECDYSIS 的训练过程（Algorithm 1）在固定的 task model θ 和 runtime environment E 下，对 runtime harness 进行 R 轮迭代优化，每轮包含以下步骤：\n\n1. **执行与轨迹收集**（§3.3, Line 3-4）：以当前 harness H_{i-1} 在训练集 D_train 上执行所有训练任务，收集 execution trajectories T_i。每条轨迹 τ 产生一个 task score S(τ)，通过预设阈值 λ 判定 binary failure signal f_λ(τ)：若 S(τ) \u003C λ 则标记为失败。此阶段仅使用固定评估框架的原始评分机制，不修改评分逻辑。\n\n2. **Batch-Level Failure Aggregation**（§3.3, Line 5-9）：将所有失败轨迹转换为结构化记录 B_i，每条记录保留 task identifier、failure decision、termination reason、tool-call history 和必要 execution context。随后按失败模式将记录分组为 G_i，优先关注覆盖至少两个不同 task 的 group——因为单一任务的重复失败不足以证明底层失败机制具有跨任务一般性。单任务 group 仅作为辅助证据保留。这一设计将每轮的 coding-agent 调用次数从 n_i（逐失败处理）降至最多 1 次，是训练效率提升的主要来源。\n\n3. **FDCR 多角色诊断**（§3.4, Line 12-16）：对每个含失败证据的 evolution round，启动 K 轮迭代精炼。三个角色顺序执行：Analyst 识别潜在 harness 缺陷并提出最小化、针对性的修改提案；Critic 对照失败证据评估提案风险，包括 trigger 过宽、误阻合法行为、违反 runtime contract、以及对已成功任务的 regression；Engineer 追踪已达成共识与未解决分歧，标记需后续澄清的问题。每轮中各角色接收累积的 shared transcript M_i，使后续分析可基于前序讨论展开。K 轮结束后，Moderator 读取完整 transcript 和失败证据，进行保守仲裁，生成结构化修改规范 q_i——描述失败模式、修改方案和实现指导，但不直接修改 harness 代码。\n\n4. **Coding Agent 修改**（§3.4, Line 17）：Coding agent 接收 q_i、相关执行证据和当前 harness 源码，对 H_{i-1} 进行修改，产出 candidate harness H_i^c。FDCR 与 coding agent 职责分离：前者负责跨实例失败诊断和修改规范精炼，后者负责具体代码实现。\n\n5. **验证与接受**（§3.2, Line 18-21）：在完整训练集上评估 H_i^c 的 overall score J_train。仅当 J_train(H_i^c) \u003E J_train(H_{i-1}) 时接受候选并令 H_i = H_i^c；否则保留上一轮 harness H_i = H_{i-1}。该准则仅约束训练集总体分数，不要求每个训练任务 individually 改进。\n\n6. **冻结与推理**（§3.2, Line 22-23）：R 轮迭代后，冻结最终验证通过的 harness H_F = H_R。推理阶段直接使用 H_F，不再进行任何 harness 修改或 test-time adaptation。跨模型评估时，将 Qwen3-8B 上演化的 harness 直接迁移至其他模型，不做进一步 evolution。\n\n### § 6 核心数学推导\n\n论文的核心数学内容集中在 §3.1 的概念分解和 §8.3 的 model accommodation 分析中，属于概念性形式化而非严格定理证明。\n\n**Harness update 分解**（§3.1）：设一轮 evolution 产生的 aggregate harness update 为 ΔH，由若干独立的修改决策构成。每个决策要么 accommodate 当前 task model 的局限（model-specific accommodation），要么 repair 系统性 harness 缺陷（harness-level repair）。引入 t ∈ [0,1] 表示 model-specific accommodation 决策所占比例，则 ΔH 可概念性分解为 ΔH = t·ΔH_model + (1−t)·ΔH_harness。这里 t 同时是 model-accommodating 决策的占比和 model-accommodation 分量在整体更新中的权重。intuition 是：t 越大，harness 越能快速解决当前观测到的失败，但也越容易 overfit 到当前模型和训练任务的特异性，损害对 unseen tasks 和其他模型的泛化。ECDYSIS 的核心假设是：跨任务实例重复出现的失败模式比孤立失败提供更强的系统性 harness 缺陷证据，因此可以将 t 衰减为 t' = βt（β ∈ (0,1)），从而将 adaptation 偏向 harness-level repair。\n\n**Coding-agent 调用次数不等式**（§3.3）：设第 i 轮收集到 n_i = |B_i| 条失败记录。逐失败独立处理需 n_i 次 coding-agent 调用，而 ECDYSIS 每轮最多 1 次调用。因此总调用次数满足 Σ_i 1 ≤ Σ_i n_i，当任一轮含多条失败记录时不等式严格成立。这是训练效率提升的定量基础。\n\n**接受准则**（§3.2）：H_i^c 被接受当且仅当 J_train(H_i^c) \u003E J_train(H_{i-1})，即候选 harness 必须在训练集总体分数上严格优于上一轮保留的 harness，否则被丢弃并回退。\n\n**Model accommodation 的实证量化**（§8.3）：通过 fine-grained manual analysis，论文量化了 SE 的 t = 60.0% 而 ECDYSIS 的 t = 45.5%，降低 14.5 个百分点。这为\"ECDYSIS 通过减少 model-specific over-adaptation 来提升跨模型泛化\"提供了实证支撑。\n\n### § 7 实验设计与结论\n\n论文围绕四个核心 claim 设计实验，每个 claim 对应明确的实验验证路径。\n\n**Claim 1：ECDYSIS 提升推理性能** → 在五个 task LLM（Qwen3-8B/14B/32B、MiniMax-M2.7、Llama-3.1-8B）和两个 τ²-Bench 子集（Airline、Retail）上，以 Human-Aug. 为共同初始 harness，比较 Direct、Human-Aug.、Self-Evolution (SE)、ECDYSIS (w/o FDCR)、ECDYSIS (w/ FDCR) 五种配置的 AVG accuracy、Pass@3 和 Pass^3 → ECDYSIS (w/ FDCR) 在十种 model-subset 组合上取得最高平均 accuracy 59.33%，相对 SE 提升 27.1%，相对 Human-Aug. 提升 14.8%；Pass^3 相对 SE 提升 55.2%，表明跨重复试验的成功一致性更高。Ablation 显示从 SE 到 ECDYSIS (w/o FDCR) accuracy 提升 8.00%，加入 FDCR 再提升 4.67%，证明 batch-level aggregation 和 multi-role diagnosis 各自贡献独立增益。\n\n**Claim 2：ECDYSIS 提升训练效率** → 记录从初始训练评估到最终 harness 冻结的 end-to-end wall-clock time 和 API cost，并分解为 training evaluation 与 evolution 两部分 → ECDYSIS (w/o FDCR) 在 τ²-Retail 和 τ²-Airline 上分别实现 1.42× 和 3.23× 的训练加速，API cost 降低 70.71% 和 66.53%。ECDYSIS (w/ FDCR) 加速为 1.30× 和 1.84×，API cost 降低 32.07% 和 59.12%。效率提升主要来自 failure aggregation 减少重复 coding-agent 调用；FDCR 作为 accuracy-oriented 模块以额外 evolution-time 成本换取更高质量的 harness 修改。Input cache hit rate 从 SE 的 ~89% 提升至 ECDYSIS 的 93-96%，进一步降低 API 开销。\n\n**Claim 3：ECDYSIS 提升跨模型泛化** → 仅用 Qwen3-8B 进行 harness evolution，冻结后直接迁移至其他四个模型评估，不做进一步 evolution → 在 τ²-Airline 上，Qwen3-32B 的 accuracy 从 SE 的 51.67% 提升至 ECDYSIS 的 68.33%；在 AgentBench 上，Llama-3.1-8B 从 SE 的 68.33% 提升至 ECDYSIS 的 90.00%。这表明 ECDYSIS 训练的 harness 捕获了底层 runtime constraint 而非 model-specific idiosyncrasy，实现了跨模型迁移。Manual analysis 量化了 SE 的 model-accommodation ratio t = 60.0% 而 ECDYSIS 为 45.5%，解释了泛化提升的机制：减少 model-specific over-adaptation 保留了更通用的 valid action space。\n\n**Claim 4：ECDYSIS 降低推理时 token 消耗** → 在 held-out 评估中记录 task model 的 input/output token 总量和 per-trajectory runtime → ECDYSIS (w/ FDCR) 的平均 final evaluation tokens 为 10.16M，相对 SE 的 11.57M 降低 12.19%；平均 per-trajectory runtime 从 126.08s 降至 118.69s。最大增益出现在 Qwen3-14B × τ²-Airline，runtime 从 197.61s 降至 57.16s（3.46× 加速）。这表明 evolution 阶段获得的效率在推理时持续存在，无需 test-time modification。\n\n此外，论文还验证了**数据效率**（§8.2）：使用 failure-aware 策略选取 1/4 训练数据（5 个 training failures），ECDYSIS (Reduced) 在 τ²-Retail × Qwen3-32B 上达到 71.67% accuracy，接近全量训练的 75.00%，而随机选取仅为 65.00%，训练成本从 $5.763 降至 $0.291。这表明优先选择暴露 novel execution paths 和 harness deficiencies 的任务，可以在大幅降低训练开销的同时保持可比性能。", "additional_insights": "## § 8 Take-aways\n\nECDYSIS 的核心洞察是：并非所有执行失败都指向 harness 缺陷——某些失败反映的是当前 task model 的行为特征，直接针对个别失败修改 harness 会导致 model-specific accommodation，损害跨模型泛化能力。论文提出用 cross-task recurring failure patterns 作为 inductive bias 来区分 systematic harness deficiency 与 model-specific limitation，即如果同一失败模式在多个独立任务实例中反复出现，则更可能是 harness 层面的系统性问题而非模型的偶然行为。在方法上，ECDYSIS 采用 batch-level failure aggregation，将一个 evolution round 内所有失败证据联合分析，而非逐个失败独立调用 coding agent，从而将每轮的 coding-agent 调用次数从 $n_i$ 次降至 1 次，这是训练效率提升的主要来源。FDCR 模块引入 Analyst、Critic、Engineer 三个角色通过共享 transcript 迭代精炼修改方案，再由 Moderator 综合产出结构化 modification specification，将失败诊断与代码实现解耦，这是准确率提升的主要来源但以额外训练成本为代价。实验表明 ECDYSIS (w/ FDCR) 相比 Self-Evolution 在平均准确率上提升 18.56%，训练时间加速最高 1.84×，推理 token 消耗降低 12.19%，且用 Qwen3-8B 训练出的 harness 可直接迁移到 Qwen3-32B、MiniMax-M2.7 等未参与训练的模型上。论文引入 model-accommodation ratio $t$ 来量化过度适应现象，手动分析发现 SE 的 $t=60.0\\%$ 而 ECDYSIS 的 $t=45.5\\%$，降低 14.5 个百分点，为跨模型泛化改善提供了机制性解释。在数据效率方面，基于 failure-aware 的训练数据选择策略，仅使用完整训练集 1/4 的数据即可达到与全量训练相当的性能，而随机选择同样数量的样本则表现明显劣化。\n\n## § 9 最脆弱的假设\n\nECDYSIS 最关键也最脆弱的假设是：**cross-task recurring failure patterns 是 systematic harness deficiency 的可靠证据，而非 model-specific limitation 的跨任务表现**。整个框架的合法性建立在这一 inductive bias 之上——如果跨任务复现的失败实际上源于模型的系统性行为倾向（例如模型在处理某类指令格式时一致性地产生相同误解），那么 ECDYSIS 所做的\"harness-level repair\"本质上仍然是 model-specific accommodation，只是被跨任务复现的假象掩盖了。这种情形在实际中完全可能发生：一个 LLM 如果在 state tracking 或 entity resolution 上存在系统性弱点，这种弱点会在多个任务上以相似模式显现，看起来像 harness 缺陷但实际是模型能力边界。论文自己也承认 cross-task recurrence 被用作 inductive bias \"rather than as proof of causal attribution\"，但并未提供独立验证来确认所识别的 recurring patterns 确实属于 harness 层面。论文提供的间接证据有两类：一是跨模型泛化结果（用 Qwen3-8B 训练的 harness 在 Qwen3-32B 上也有效），二是手动标注的 model-accommodation ratio 从 60% 降至 45.5%。但前者可能被替代解释覆盖——不同 Qwen3 模型共享训练数据和架构，行为相似性高，跨模型迁移成功未必证明修改是 harness-level 的；后者的 $t$ 值由人工细粒度分析得出，存在主观判断偏差且未报告标注一致性。如果这一假设不成立，ECDYSIS 的核心贡献——\"区分 model-specific accommodation 与 harness-level repair\"——将退化为一种更高效的 batch-level 修改策略，而非真正在概念层面解决了 failure attribution 问题。\n\n## § 10 最小复现实验\n\n在一周时间内，最值得验证的是 ECDYSIS 的核心 inductive bias 本身：**跨任务复现的失败是否比孤立失败更可能指向可跨模型迁移的 harness 修改**。具体方案如下：使用 $\\tau^2$-Bench 的 Retail 子集，取一个已有的 base harness（如论文中提到的 Life-Harness 或一个简单的 ReAct-style harness），用 Qwen3-8B 作为 task model 在 20 个训练任务上执行，收集所有失败 trajectory。将失败按 failure pattern 分组，标记出在至少 2 个不同任务中复现的 failure group（recurring）和仅出现在单一任务中的 failure（isolated）。然后手动构造两个 harness 变体：H-recurring 仅修复 recurring failure 对应的 harness 问题（如 state synchronization、entity resolution），H-isolated 仅修复 isolated failure 对应的问题。将 base harness、H-recurring、H-isolated 三个版本在 $\\tau^2$-Bench Retail 的 20 个 held-out 任务上分别用 Qwen3-32B 执行，每个任务 3 次独立 trial，测量 average accuracy、Pass@3 和 Pass^3。如果 ECDYSIS 的核心假设成立，则 H-recurring 在 Qwen3-32B 上的准确率应显著高于 H-isolated，因为 recurring failure 对应的修改应当是 harness-level 的、可跨模型迁移的；如果两者表现相当或 H-isolated 反而更好，则说明跨任务复现并非 harness deficiency 的可靠信号，ECDYSIS 的 inductive bias 不成立。这个实验不需要实现 FDCR 或完整的 evolution pipeline，只需一次 base execution、一次手动 failure 分组、两次手动 harness 修改和一次跨模型评估，核心工作量集中在 failure 分析和 harness 编辑上，可在一周内完成。", "research_value": "### § 11 最强反例设计\n\n对 ECDYSIS 最致命的攻击点在于其核心 inductive bias 的失效场景：当 task model 本身存在系统性的认知或格式处理缺陷时，这种缺陷会在多个独立任务上表现出高度一致的 failure patterns。在这种情境下，ECDYSIS 的 cross-task recurring failure 机制将不可避免地把 model-specific 的系统性弱点误判为 systematic harness deficiency。为了验证这一反例，可以设计一个“注入系统性模型偏差”的对照实验。具体而言，选取一个基础能力均衡的 LLM 作为 task model，并通过 system prompt 或轻量级 fine-tuning 注入一种跨任务的系统性行为缺陷，例如强制模型在处理任何包含嵌套 JSON 格式的 tool return 时，一致性地忽略最外层键值。随后，在该被“污染”的模型上运行 ECDYSIS 的 harness evolution pipeline。根据 ECDYSIS 的逻辑，这种在多任务上反复出现的“忽略嵌套 JSON”失败会被判定为 harness 缺陷，从而促使 coding agent 修改 harness 以扁平化所有 tool return 的 JSON 结构。接着，将这一演化后的 harness 应用于一个未受污染的正常 LLM 上。如果反例成立，我们会观察到：为了迁就被污染模型的系统性缺陷而演化出的 harness 扁平化逻辑，不仅增加了正常模型的推理 token 消耗，还会破坏正常模型处理复杂结构化数据的原生能力，导致准确率显著下降。这一结果将直接证明 ECDYSIS 缺乏真正的 causal attribution 能力，其所谓的“区分 model-specific accommodation 与 harness-level repair”仅仅是在统计层面过滤了偶然失败，而无法在逻辑层面抵御模型自身固有的系统性偏差，其跨模型泛化能力的提升只是因为测试模型恰好没有表现出相同的系统性缺陷。\n\n### § 12 Follow-up Research Idea\n\nECDYSIS 的根本局限在于它试图仅通过被动观察 execution trajectories 的统计规律（即 cross-task recurrence）来解决 failure attribution 问题，这在因果推断框架下是严重欠定的。这一局限驱动了一个全新的研究方向：**基于反事实干预的因果归因 harness 演化**。与其猜测某个失败是模型还是 harness 的问题，不如主动实施因果干预：当 agent 执行失败时，引入一个“反事实探针”机制。借鉴因果推断中的 do-calculus 和 process supervision 思想，当观察到特定失败时，系统自动生成一个“理想化”的中间状态或正确的 model action，并将其作为 counterfactual trajectory 强制注入当前的 harness 执行流中。如果注入正确动作后，harness 依然无法完成任务并产生相同或新的错误，则通过反证法确凿地判定为 systematic harness deficiency；反之，若注入后任务成功，则证明失败源于 task model 的 capability gap。这一框架将 harness evolution 从“基于模式匹配的批量修改”转变为“基于假设检验的因果修复”。第一个实验将构建一个 Counterfactual Fault Isolation (CFI) 模块：在 $\\tau^2$-Bench 的 Retail 子集上，对 base harness 执行并收集失败轨迹。对于每个失败，利用一个强大的 oracle LLM 生成正确的下一步 action 并 do-inject 到 harness 上下文中。比较 CFI 与 ECDYSIS 的 failure attribution 准确率：手动构建一个包含 100 个失败案例的 ground-truth 标注集（标明每个失败的真实归因），测量两种方法在区分 model-specific 与 harness-level 缺陷上的 F1-score。预期 CFI 将在 F1-score 上大幅超越 ECDYSIS，并彻底消除因模型系统性偏差导致的误判，从而在真正意义上实现具备因果解释力的 runtime harness 自动演化。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Ruiqing Yue\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Yu Cui\", \"affiliations\": [3], \"markers\": [\"*\"]},\n    {\"name\": \"Zhuoyu Sun\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Sicheng Pan\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Xianhong Xue\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Tingyu Li\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Ting Li\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Wenzhuo Zhu\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Yi Chen\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Yifei Liu\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Baohan Huang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Zhe Cui\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Haibin Zhang\", \"affiliations\": [5, 6], \"markers\": []},\n    {\"name\": \"Cong Zuo\", \"affiliations\": [3], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Chengdu Institute of Computer Applications, CAS\"},\n    {\"id\": 2, \"name\": \"University of Chinese Academy of Sciences\"},\n    {\"id\": 3, \"name\": \"Beijing Institute of Technology\"},\n    {\"id\": 4, \"name\": \"Beijing Univers
