ven optimization loop; and (3) a Graph-Based Autonomous Search that scales the Auto agent for global exploration of the design space. All three paradigms leverage a shared pool of specialized sub-agents to handle planning, implementation, self-debugging, testing, and hardware profiling. We evaluate MaxKernel on JaxBench, a comprehensive suite of 50 diverse kernel tasks for TPUs, alongside complex, real-world workloads from state-of-the-art open-source models. We demonstrate that MaxKernel consistently generates highly optimized implementations, matching expert hand-tuned baselines and delivering significant performance across the benchmark. Our agent is open-sourced and available https://github.com/AI-Hypercomputer/accelerator-agents/tree/main/MaxKernel.", "category": "cs.AI", "cluster": "Domain-Specific Agent Applications", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agent capability/behavior, Multi-Agent)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的研究问题是如何利用多智能体系统自动化生成和优化Tensor Processing Units (TPUs)的高性能custom kernels。这个问题至关重要，因为随着深度学习架构规模的不断扩大，对专用硬件加速器的需求日益增长。为了充分利用这些设备的计算和内存带宽，工程师通常需要绕过标准compiler pipelines来开发定制化的优化kernels。然而，编写这些kernels（如针对TPU的JAX/Pallas）是一个极其复杂的过程，要求开发者具备深厚的硬件级专业知识，包括手动管理memory hierarchies（如HBM与VMEM）、编排Direct Memory Access (DMA) pipelining以及推导多维tiling strategies。解决这一问题能够大幅降低硬件加速器编程的技术门槛，减少领域专家的手工调优工作量，并确保硬件性能得到最大化释放。\n\n### § 2 前人工作与不足\n在MaxKernel之前，该问题已通过传统compiler优化技术和基于Large Language Models (LLMs)的方法进行了部分探索。传统compiler优化技术如Halide、TVM和Ansor通过将算法定义与调度解耦来应对复杂性，但它们仍然依赖大量的domain knowledge或极其昂贵的evolutionary search阶段。近期的研究（如AutoComp）开始利用LLMs来导航tensor programs的搜索空间，而标准的zero-shot或few-shot LLM方法也尝试直接生成代码。然而，这些先前的工作存在显著不足：首先，由于accelerator APIs的rigidity、严格的memory constraints以及opaque low-level compiler errors，标准LLM方法无法仅凭静态生成产出高质量代码，必须依赖real-time compiler feedback进行迭代，而前人缺乏一个能够无缝集成compiler pipelines和empirical profiling tools（如XProf）的闭环多智能体框架。其次，即使生成了功能正确的代码，实现最优硬件性能仍需经历漫长的经验性profiling、configuration tuning和APIs调整，前人系统未能提供灵活的orchestration paradigms来在人工控制、快速自动迭代和全局设计空间探索之间进行权衡。最后，针对TPU特有的JAX/Pallas编程环境，此前缺乏一个能够涵盖规划、实现、自我调试、测试到硬件profiling全流程的模块化系统，也未能像MaxKernel这样在严格的JaxBench基准上证明其能够稳定匹配甚至超越人类专家手写kernel的性能。", "core_insight": "### § 3 重建作者的思考路径\n\n编写高性能的TPU kernel需要专家手动管理内存层次（如HBM与VMEM）、编排DMA pipelining以及设计多维tiling策略，这极大地限制了开发效率。早期尝试使用传统编译器（如TVM、Halide）通过解耦算法和调度来自动化这一过程，但它们仍需大量领域知识或昂贵的evolutionary search。随着LLM的兴起，研究者尝试用zero-shot或few-shot prompting直接生成代码，但加速器API的僵化和低级编译器错误的晦涩导致编译成功率极低。为了解决这个问题，必须引入real-time compiler feedback，让LLM在错误中自我修正。然而，即使代码能编译运行，单线性的iterative refinement（如简单的hill-climbing）在面对复杂的内存布局和tiling策略时，极易陷入局部最优。此外，缺乏精确的硬件性能反馈，LLM无法判断优化方向是否正确。因此，研究者自然会想到将整个优化过程拆解为模块化的sub-agents，并引入XProf等profiling工具提供量化的硬件指标作为闭环反馈。为了克服单次迭代的局限性，可以将这个闭环agent作为基础单元，嵌入到更宏观的图搜索框架中，通过Parallel Search或Beam Search在全局设计空间中并行探索不同的优化路径。同时，考虑到复杂kernel的开发仍需人类直觉的引导，保留Human-in-the-Loop的交互模式也是顺理成章的演进。\n\n### § 4 核心 Intuition\n\n纯LLM生成缺乏对底层硬件约束的感知，而单次线性迭代优化又容易被困在次优的编译状态中。MaxKernel的核心在于将TPU kernel优化拆解为模块化的agent闭环，利用XProf提取的真实硬件指标作为反馈信号驱动迭代。同时，它将这个闭环agent封装为图搜索的节点，通过Parallel或Beam search在全局设计空间中并行探索不同的优化路径，从而跳出单次迭代的局部最优。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《MaxKernel: Agentic Kernel Generation for TPUs》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 本文提出并解决的研究问题是如何利用多智能体系统自动化生成和优化Tensor Processing Units (TPUs)的高性能custom kernels。这个问题至关重要，因为随着深度学习架构规模的不断扩大，对专用硬件加速器的需求日益增长。为了充分利用这些设备的计算和内存带宽，工程师通常需要绕过标准compiler pipelines来开发定制化的优化kernels。然而，编写这些kernels（如针对TPU的JAX/Pallas）是一个极其复杂的过程，要求开发者具备深厚的硬件级专业知识，包括手动管理memory hierarchies（如HBM与VMEM）、编排Direct Memory Access (DMA) pipelining以及推导多维tiling strategies。解决这一问题能够大幅降低硬件加速器编程的技术门槛，减少领域专家的手工调优工作量，并确保硬件性能得到最大化释放。 ### § 2 前人工作与不足 在MaxKernel之前，该问题已通过传统compiler优化技术和基于Large Language Models (LLMs)的方法进行了部分探索。传统compiler优化技术如Halide、TVM和Ansor通过将算法定义与调度解耦来应对复杂性，但它们仍然依赖大量的domain knowledge或极其昂贵的evolutionary search阶段。近期的研究（如AutoComp）开始利用LLMs来导航tensor programs的搜索空间，而标准的zero-shot或few-shot LLM方法也尝试直接生成代码。然而，这些先前的工作存在显著不足：首先，由于accelerator APIs的rigidity、严格的memory constraints以及opaque low-level compiler errors，标准LLM方法无法仅凭静态生成产出高质量代码，必须依赖real-time compiler feedback进行迭代，而前人缺乏一个能够无缝集成compiler pipelines和em...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 编写高性能的TPU kernel需要专家手动管理内存层次（如HBM与VMEM）、编排DMA pipelining以及设计多维tiling策略，这极大地限制了开发效率。早期尝试使用传统编译器（如TVM、Halide）通过解耦算法和调度来自动化这一过程，但它们仍需大量领域知识或昂贵的evolutionary search。随着LLM的兴起，研究者尝试用zero-shot或few-shot prompting直接生成代码，但加速器API的僵化和低级编译器错误的晦涩导致编译成功率极低。为了解决这个问题，必须引入real-time compiler feedback，让LLM在错误中自我修正。然而，即使代码能编译运行，单线性的iterative refinement（如简单的hill-climbing）在面对复杂的内存布局和tiling策略时，极易陷入局部最优。此外，缺乏精确的硬件性能反馈，LLM无法判断优化方向是否正确。因此，研究者自然会想到将整个优化过程拆解为模块化的sub-agents，并引入XProf等profiling工具提供量化的硬件指标作为闭环反馈。为了克服单次迭代的局限性，可以将这个闭环agent作为基础单元，嵌入到更宏观的图搜索框架中，通过Parallel Search或Beam Search在全局设计空间中并行探索不同的优化路径。同时，考虑到复杂kernel的开发仍需人类直觉的引导，保留Human-in-the-Loop的交互模式也是顺理成章的演进。 ### § 4 核心 Intuition 纯LLM生成缺乏对底层硬件约束的感知，而单次线性迭代优化又容易被困在次优的编译状态中。MaxKernel的核心在于将TPU kernel优化拆解为模块化的agent闭环，利用XProf提取的真实硬件指标作为反馈信号驱动迭代。同时，它将这个闭环agent封装为图搜索的节点，通过Parallel或Beam search在全局设计空间中并行探索不同的优化路径，从而跳出单次迭代的局部最优。 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：**==\u003E picture [56 x 19] intentionally omitted \u003C==** ## **MaxKernel: Agentic Kernel Generation for TPUs** **Shangkun Wang**[1,*] **, Nina Cai**[1,*] **, Charles Hong**[1] **, Julian Walker**[2] **, Gerson Kroiz**[1] **, George Vanica**[1] **, Deepak Patil**[1] **, Andi Gavrilescu**[1] **, Hassan Sipra**[1] **and Sethu Sankaran**[1] *Equal contributions, 2Google DeepMind, 1Google Code: `https://github.com/AI-Hypercomputer/accelerator-agents/tree/main/MaxKernel` **Designing and authoring high-performance custom kernels for accelerators is a complex task that requires deep hardware-level expertise. Large Language Models (LLM) can be leveraged together with real-time compiler feedback to build agentic systems for kernel generation. In this work, we present MaxKernel, a multi-agent system that implements three distinct paradigms for TPU kernel development: (1) a Humanin-the-Loop (HITL) agent f...", "additional_insights": "## § 8 Take-aways\n\nMaxKernel 是一个面向 TPU kernel 优化的 multi-agent 系统，核心思路是将 kernel 生成分解为 Planning、Implementation、Testing、Autotuning、Profiling 等子任务，由专门的 sub-agent 分别处理，再通过 orchestrator 串联成闭环。系统提供三种执行范式：HITL 适合复杂 kernel 中人类专家介入关键决策点；Autonomous Loop 以 Plan→Implement→Compile→Test→Autotune→Profile 的固定序列做局部 hill-climbing；Graph-Based Search 将 Auto agent 嵌入 beam search 或 parallel search 框架中以逃离 local optima。RAG knowledge base 明确排除了 hand-tuned kernel 代码，目的是测试 agent 能否在不依赖人类基线的情况下自主发现 TPU 优化策略。在 JaxBench 的 50 个任务上，Best-of-N zero-shot 仅获得 10/50 的编译成功率和 1.08× speedup，说明无反馈的 LLM 生成几乎不可用；引入迭代反馈后，Auto agent 将编译率提升至 49/50、speedup 提升至 1.39×（中位数），但单次运行方差很大（1.19×–1.42×）。Parallel search（5 条独立轨迹各 5 次迭代取最优）将 speedup 推至 1.58×，编译率和正确率均达 50/50，是三种范式中表现最好的。Beam search（beam width=3, depth=3, 每节点仅 2 次迭代）在 depth 3 处出现性能 plateau，原因是 Pallas 的低级 kernel 优化常需要多步迭代调试才能解决内存约束和 lowering 失败，浅层预算导致过早剪枝。在 8 个有 human-tuned Pallas 参考的生产 kernel 上，MaxKernel Parallel 取得 2.32× geometric mean speedup，超过人类专家的 2.02×，其中 Paged Attention 达到 6.74×（人类 2.41×），但 Ragged Paged Attention 上人类 4.65× 远超 agent 的 1.42×。在 SOTA OSS 模型上，MaxKernel 对 MLA v1 实现 9.5% throughput 提升，对 Qwen3-Next Gated DeltaNet 训练步加速 4.70×，对 DeepSeek-V4 Sparse Attention prefill 加速 7.85×，还自动修复了 RPAv3 的 crash 问题（通过添加 ALU clamp 指令处理 left-padded inputs）。所有实验仅使用 Gemini 3.1 Pro，未做其他 LLM 的 ablation。\n\n## § 9 最脆弱的假设\n\n整个系统最核心也最脆弱的假设是：**LLM 能够有效解读 XProf profiling trace 并将其转化为有意义的代码优化决策**。这是 Autonomous Loop 闭环优化的信息瓶颈——Profiling Agent 提取的 empirical metrics（execution latency、memory bandwidth utilization、compute density）被直接注入下一轮 Planning Agent 的 prompt，驱动 data-driven improvement。如果 LLM 无法从这些低级 trace 数据中推断出正确的优化方向（例如判断瓶颈在 HBM bandwidth 还是 compute density，并据此调整 tiling strategy 或 DMA pipelining），那么闭环就退化为无信息引导的随机尝试加 autotuning，与 Parallel Search 取最优的本质区别消失。\n\n这个假设在实际中可能不成立的原因有三层。第一，XProf trace 包含大量低级硬件事件，LLM 对 TPU microarchitecture 的理解可能不足以建立\"profiling metric → code change\"的因果映射，尤其当瓶颈涉及复杂的 memory hierarchy 交互（VMEM bank conflict、DMA pipeline stall）时。第二，即使 LLM 能正确识别瓶颈，Pallas API 的 rigidity 可能使得对应的代码修改无法表达——论文多次提到\"rigid memory constraints\"和\"lowering failures\"，暗示 API 表达能力本身是瓶颈。第三，autotuning（调 block size、tile dimension）可能贡献了大部分 speedup，而 profiling-driven 的算法级优化贡献被淹没。\n\n论文提供的证据存在明显缺口。Table 1 显示 Auto agent（含 profiling）的 1.39× 优于 Best-of-N 的 1.08×，但这一差距可能来自三个混杂因素中的任意一个或组合：(a) 迭代编译修复提高了编译成功率，(b) autotuning 探索了更好的超参数，(c) profiling feedback 驱动了算法级改进。论文没有提供去掉 Profiling Agent 的 ablation——即一个只有 Plan→Implement→Compile→Test→Autotuning 但无 profiling feedback 的对照组。如果该对照组的 speedup 接近 1.39×，则 profiling feedback 的核心假设即被证伪。此外，Figure 6 中 Parallel Search 的性能随 iteration 持续上升，但这一上升同样可能由 autotuning 驱动而非 profiling-informed planning。论文声称\"empirical profiling feedback is fed directly into the planning phase of the subsequent iteration, driving continuous, data-driven improvement\"，但未提供任何 case study 或定量分析来隔离 profiling feedback 的边际贡献。\n\n## § 10 最小复现实验\n\n在一周时间内，最有价值的 minimal experiment 是隔离 profiling feedback 的边际贡献，直接检验上述最脆弱假设。具体方案如下：\n\n从 JaxBench 中选取 10 个代表性任务，覆盖不同优化类型：compute-bound（GEMM、Flash Attention）、memory-bound（RMSNorm、Mamba2 SSD）、fused operator（Matmul_Swish_Sum_GroupNorm、Conv2d_GELU_GlobalAvgPool）、sparse/ragged（Sparse Attention、Ragged Paged Attention）。实现两个简化版 agent pipeline，均使用 Gemini 3.1 Pro API 和 TPU v6e（或可用的 TPU）：**Pipeline A** 为完整 Auto loop（Plan→Implement→Compile→Fix→Test→Autotune→Profile→反馈至下一轮 Plan），**Pipeline B** 去掉 Profiling Agent，即 Plan→Implement→Compile→Fix→Test→Autotune，下一轮 Plan 仅基于上一轮的 autotuning 结果和编译/测试反馈，不注入 XProf trace 数据。两个 pipeline 均限制 5 次迭代，每个任务各跑 3 次取中位数。同时实现一个 Best-of-10 zero-shot baseline 作为下界参照。\n\n测量三个指标：(1) compilation rate（10 个任务中成功编译的比例），(2) correctness rate（编译通过的任务中数值正确的比例，使用 `jnp.allclose` with atol=rtol=1e-2），(3) geometric mean speedup over XLA baseline（使用 XProf 测量 on-device execution time，regression floored at 1.0×）。\n\n判定标准：如果 Pipeline A 的 geometric mean speedup 显著高于 Pipeline B（例如 A=1.4× vs B=1.1×，差距 \u003E0.2×），则支持 profiling feedback 驱动优化的核心 claim；如果 A 和 B 的 speedup 差距在 0.1× 以内且 compilation/correctness rate 相近，则反驳该 claim，表明 speedup 主要来自迭代编译修复和 autotuning，profiling feedback 的贡献可忽略。这个实验不需要实现 Graph-Based Search、HITL 或 RAG 系统，只需一个简化的 agent loop 和 XProf 集成，一周内可行。关键实现细节是确保 Pipeline B 的 Planning Agent prompt 中不包含任何 profiling 数据，而 Pipeline A 的 prompt 中注入与论文 Section 2.1 描述相同的 empirical metrics。", "research_value": "### § 11 最强反例设计\n\n如果我反对这篇论文，我会设计一个基于“盲调”对照组的实验来证伪 MaxKernel 的核心机制——即 LLM 能够利用 XProf profiling trace 进行语义级的算法重构。具体而言，我会构建一个无 LLM 参与的纯启发式搜索系统：针对 JaxBench 中的每个任务，先由人类或 zero-shot LLM 生成一个功能正确但未优化的基础 Pallas kernel，然后使用随机搜索或贝叶斯优化在庞大的超参数空间（如 block size、tile dimension、DMA pipeline depth）中进行暴力调优，完全不引入任何 profiling feedback 或 LLM 的代码修改。如果这个“盲调”系统在 JaxBench 上取得了与 MaxKernel Parallel Search（1.58× speedup）相近的性能，则证明 MaxKernel 的性能提升主要归功于 autotuning 对 Pallas API 离散参数空间的探索，而非 Profiling Agent 驱动的算法级优化。此外，我会针对不规则内存访问场景（如 Ragged Paged Attention）设计一个极端反例。在这类场景中，性能瓶颈源于复杂的 VMEM bank conflict 和非连续内存访问模式，需要根本性的 indexing 逻辑重构。我会论证，由于 Pallas API 的 rigidity 和 LLM 对底层 TPU microarchitecture 因果映射的缺失，MaxKernel 在面对此类任务时会可预测地陷入局部最优（如论文中 1.42× vs 人类 4.65× 的巨大差距）。这表明 MaxKernel 的闭环优化仅在“规则计算密集型”任务上有效，一旦遇到需要深度算法重构与硬件特性深度耦合的 irregular workloads，其 multi-agent 框架便退化为低效的随机代码突变，无法突破 API 表达能力和 LLM 硬件认知的双重天花板。\n\n### § 12 Follow-up Research Idea\n\n基于 MaxKernel 中 LLM 难以建立“profiling metric → code change”因果映射的核心局限，我提出一个全新的研究方向：**Differentiable Agentic Compilation（可微智能体编译）**。这一想法的驱动力在于，当前的 multi-agent 系统将 LLM 视为黑盒推理机，试图让其直接理解 opaque 的 XProf trace 并在 rigid 的 Pallas API 上进行试错，这导致了信息瓶颈。我们可以借鉴 polyhedral compilation 和 differentiable programming 的思想，将 TPU 的 memory hierarchy（如 VMEM bank conflict、DMA pipeline stall）和 compute density 建模为一个可微的硬件代理模型。在这个新框架下，LLM 不再直接输出低级 Pallas 代码或解读 trace，而是生成 high-level 的 scheduling intent（如“overlap compute and memory transfer”或“increase tile size for reuse”）。这些 intent 被输入到可微硬件代理中，通过梯度回传直接优化 Pallas API 的离散参数空间（如 tile dimensions、DMA buffer sizes），从而将 LLM 的语义规划能力与精确的硬件数学模型解耦但又紧密结合。第一个实验将构建一个针对 TPU VMEM 和 DMA 行为的轻量级可微模拟器，并训练一个基于 LLM 的 policy network 在该模拟器中优化 memory-bound 任务（如 RMSNorm 或 Mamba2 SSD）的 scheduling intent。我们将对比该可微规划系统与 MaxKernel 的 Profiling Agent，验证是否能通过梯度引导而非盲目试错，发现人类专家难以手动推导的 DMA pipelining 策略，从而突破 Pallas API 表达能力与 LLM 硬件认知的双重限制。这与已有工作的根本区别在于：它不再要求 LLM 扮演编译器，而是让 LLM 与一个可微的硬件感知编译器后端协同进化。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Shangkun Wang\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Nina Cai\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Charles Hong\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Julian Walker\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Gerson Kroiz\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"George Vanica\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Deepak Patil\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Andi Gavrilescu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hassan Sipra\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Sethu Sankaran\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Google\"},\n    {\"id\": 2, \"name\": \"Google DeepMind\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contributions\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author(s): sethusankaran@google.com\"}\n  ]\n}\n```", "summary_translation": "为 accelerators 设计和编写高性能自定义 kernels 是一项复杂的任务，需要深厚的硬件级专业知识。可以利用 Large Language Models (LLM) 结合实时 compiler feedback 来构建用于 kernel generation 的 agentic systems。在这项工作中，我们提出了 MaxKernel，这是一个 multi-agent system，实现了三种用于 TPU kernel development 的不同范式：(1) 用于协作式、逐步设计的 Human-in-the-Loop (HITL) agent；(2) 执行完全自动化、metric/trace-driven optimization loop 的 Autonomous (Auto) agent；以及 (3) 扩展 Auto agent 以对设计空间进行全局探索的 Graph-Based Autonomous Search。所有三种范式都利用一个共享的专门 sub-agents 池来处理规划、实现、self-debugging、测试和 hardware profiling。我们在 JaxBench 以及来自最先进开源模型的复杂真实世界 workloads 上评估了 MaxKernel，其中 JaxBench 是一个包含 50 个用于 TPUs 的多样化 kernel tasks 的综合套件。我们证明 MaxKernel 能够持续生成高度优化的实现，匹配专家手工调优的 baselines，并在整个 benchmark 上提供显著的性能。我们的 agent 已开源，可在 https://github.com/AI-Hypercomputer/accelerator-agents/tree/main/MaxKernel 获取。"}]}, {"name": "Skill Learning \u0026 Evolution", "count": 3, "papers": [{"title": "Trace2Tower: Transition-Aware EigenTrace Induction of Multi-Level Skills for LLM Agents", "arxiv_id": "2609.05261", "authors": "Jiazheng Sun, Boyu Yang, Binhao Yuan, Mingxuan Li, Xin Peng", "summary": "Large language model agents increasingly rely on execution traces to master complex interactive tasks. However, current paradigms are bottlenecked by shallow trajectory retrieval and flat skill summarization, fundamentally ignoring the temporal dependencies and outcome-conditioned topology of agent behavior. We introduce Trace2Tower, a transition-aware EigenTrace framework that distills raw trajectories into a robust skill hierarchy. Trace2Tower abstracts step-level interactions into canonical events, constructing a unified graph governed by semantic compatibility, transition dynamics, and outcome evidence. Through a novel contrastive spectral decomposition, it isolates stable, success-aligned behavioral modes while rigorously suppressing failure-prone shortcuts. These modes organically populate a dynamic skill tower of action templates, procedural routines, and overarching task strategies, continuously refined via verifier-guided feedback. On ALFWorld, Trace2Tower achieves 87.31% success requiring only 10.35 steps and 0.26 invalid actions; on WebShop, it reaches 50.67% exact success. Across both benchmarks, Trace2Tower significantly outperforms existing baselines in task mastery and context-efficient experience reuse.", "category": "cs.AI", "cluster": "Skill Learning \u0026 Evolution", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n论文旨在解决如何将LLM agents在交互环境中产生的冗长、冗余且与特定任务紧密绑定的原始执行轨迹，转化为紧凑、可靠且可复用的多层级行为结构。在交互环境中，agent的行为价值不仅取决于即时效果，更取决于它如何塑造后续决策和最终结果。然而，原始轨迹难以直接复用，因为它们不仅冗长，还包含不必要的探索和导致失败的行为分支。如果不加区分地复用这些轨迹，会传播错误或重放错位的经验。因此，将多样的执行轨迹转化为能够显式捕捉语义、执行转换和任务结果依赖关系的结构化技能，对于提升agent在长周期决策任务中的任务掌握度、适应性和执行效率至关重要。这不仅能去除任务特定的噪声和失败相关的捷径，还能支持可靠的经验复用和技能组合。\n\n### § 2 前人工作与不足\n该问题之前主要通过experience reuse和skill construction两条路径解决，但均存在根本性不足。在Agent Experience Learning方面，如ReAct、Reflexion、Voyager和ExpeL等方法，主要通过上下文相关性复用文本记忆、demonstrations或轨迹。这些方法没有显式保留哪些transition导致了成功、哪些分支失败了，或者哪些前置条件先于后续动作出现，因为它们将轨迹视为扁平的文本内容进行检索，缺乏对行为间时序和因果关系的建模。在Skill Library Construction方面，如SkillX和SAGE等方法虽然构建了持久库和层级技能，但其组织主要由语义相似性驱动。它们没有解释为什么某些行为应该组合在一起，也没有显式识别稳定的执行转换或与成功/失败相关的模式，因为在构建层级时没有将执行转换的动态性和任务结果作为联合信号。在Structured Skill Induction方面，如Trace2Skill和GraSP等方法虽然开始显式化技能间的关系，但它们主要是在已有的技能集合上施加关系，而不是在可复用的程序存在之前就基于观察到的执行顺序和成功对齐来构建图结构。这些方法之所以不足，是因为它们没有将semantic compatibility、transition dynamics和outcome evidence整合到一个统一的图中，也没有采用contrastive spectral decomposition来抑制与失败相关的捷径，从而无法显式区分可靠的执行转换和导致失败的捷径，也无法解释局部技能如何组合成与成功对齐的procedures和task-level strategies。", "core_insight": "### § 3 重建作者的思考路径\n\n在探索 LLM agents 的持续学习时，研究者首先观察到原始交互轨迹虽然蕴含丰富的决策模式，但直接复用面临冗长、任务特定且夹杂失败分支的困境。早期的经验复用方法（如 Reflexion, ExpeL）尝试将轨迹转化为文本记忆或跨任务 insights，而技能构建方法（如 SkillX, Trace2Skill）则致力于建立 skill libraries。然而，这些范式普遍受困于“浅层检索”与“扁平总结”，它们主要关注“保留什么信息”，却忽略了行为单元之间的深层关系。研究者发现，语义相似的事件在执行中可能功能迥异，而表面不同的事件可能服务于同一过程；更关键的是，现有方法无法区分哪些执行转换真正导向成功，哪些是导致失败的捷径。\n\n面对这一瓶颈，研究者的思考自然转向了如何显式地建模行为之间的拓扑关系。既然局部行为必须组合成全局策略，且组合的有效性严格受限于执行顺序与最终结果，那么就需要一种能够同时捕捉语义、时间转换和结果条件的统一表示。图论提供了天然的框架：将抽象的执行事件作为节点，将转换动态和结果证据作为边。为了从这种复杂的图中提取出稳定且与成功对齐的行为模式，同时抑制失败相关的捷径，研究者引入了谱图理论。通过构建成功与失败的对比 affinity 矩阵，并进行对比谱分解，可以动态隔离出那些在成功轨迹中高度连通、在失败轨迹中被削弱的稳定行为模式。这些模式不仅自带执行顺序，而且天然具备层级组合的潜力，从而顺理成章地推导出从底层动作模板到中层过程、再到高层策略的 skill tower 构建机制。\n\n### § 4 核心 Intuition\n\n现有方法失效是因为它们仅基于语义相似性孤立地复用经验，忽略了行为之间的执行顺序与最终成败结果，导致无法区分可靠的执行路径与失败捷径。Trace2Tower 的核心 Intuition 是：将 agent 的执行轨迹抽象为事件图，同时融合语义兼容性、转换动态和成败结果三种信号，通过对比谱分解提取出在成功轨迹中稳定共现且有序的行为模式。这些被隔离出的稳定模式自带执行依赖与成功对齐属性，从而能够自然地堆叠成从底层动作到高层策略的多级 skill tower，实现紧凑且可靠的经验复用。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Trace2Tower: Transition-Aware EigenTrace Induction of Multi-Level Skills for LLM Agents》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文旨在解决如何将LLM agents在交互环境中产生的冗长、冗余且与特定任务紧密绑定的原始执行轨迹，转化为紧凑、可靠且可复用的多层级行为结构。在交互环境中，agent的行为价值不仅取决于即时效果，更取决于它如何塑造后续决策和最终结果。然而，原始轨迹难以直接复用，因为它们不仅冗长，还包含不必要的探索和导致失败的行为分支。如果不加区分地复用这些轨迹，会传播错误或重放错位的经验。因此，将多样的执行轨迹转化为能够显式捕捉语义、执行转换和任务结果依赖关系的结构化技能，对于提升agent在长周期决策任务中的任务掌握度、适应性和执行效率至关重要。这不仅能去除任务特定的噪声和失败相关的捷径，还能支持可靠的经验复用和技能组合。 ### § 2 前人工作与不足 该问题之前主要通过experience reuse和skill construction两条路径解决，但均存在根本性不足。在Agent Experience Learning方面，如ReAct、Reflexion、Voyager和ExpeL等方法，主要通过上下文相关性复用文本记忆、demonstrations或轨迹。这些方法没有显式保留哪些transition导致了成功、哪些分支失败了，或者哪些前置条件先于后续动作出现，因为它们将轨迹视为扁平的文本内容进行检索，缺乏对行为间时序和因果关系的建模。在Skill Library Construction方面，如SkillX和SAGE等方法虽然构建了持久库和层级技能，但其组织主要由语义相似性驱动。它们没有解释为什么某些行为应该组合在一起，也没有显式识别稳定的执行转换或与成功/失败相关的模式，因为在构建层级时没有将执行转换的动态性和任务结果作为联合信号。在Structured Skill Induction方面，如Trace2Skill和GraSP等方法虽然开始显式化技能间的关系，但它们主要是在已有的技能集合上施加关系，而不是在可复用的程序存在之前就基于观察到的执行顺序和成功对齐来构建图结构。这些方法之所以不足，是因为它们没有将semantic compa...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在探索 LLM agents 的持续学习时，研究者首先观察到原始交互轨迹虽然蕴含丰富的决策模式，但直接复用面临冗长、任务特定且夹杂失败分支的困境。早期的经验复用方法（如 Reflexion, ExpeL）尝试将轨迹转化为文本记忆或跨任务 insights，而技能构建方法（如 SkillX, Trace2Skill）则致力于建立 skill libraries。然而，这些范式普遍受困于“浅层检索”与“扁平总结”，它们主要关注“保留什么信息”，却忽略了行为单元之间的深层关系。研究者发现，语义相似的事件在执行中可能功能迥异，而表面不同的事件可能服务于同一过程；更关键的是，现有方法无法区分哪些执行转换真正导向成功，哪些是导致失败的捷径。 面对这一瓶颈，研究者的思考自然转向了如何显式地建模行为之间的拓扑关系。既然局部行为必须组合成全局策略，且组合的有效性严格受限于执行顺序与最终结果，那么就需要一种能够同时捕捉语义、时间转换和结果条件的统一表示。图论提供了天然的框架：将抽象的执行事件作为节点，将转换动态和结果证据作为边。为了从这种复杂的图中提取出稳定且与成功对齐的行为模式，同时抑制失败相关的捷径，研究者引入了谱图理论。通过构建成功与失败的对比 affinity 矩阵，并进行对比谱分解，可以动态隔离出那些在成功轨迹中高度连通、在失败轨迹中被削弱的稳定行为模式。这些模式不仅自带执行顺序，而且天然具备层级组合的潜力，从而顺理成章地推导出从底层动作模板到中层过程、再到高层策略的 skill tower 构建机制。 ### § 4 核心 Intuition 现有方法失效是因为它们仅基于语义相似性孤立地复用经验，忽略了行为之间的执行顺序与最终成败结果，导致无法区分可靠的执行路径与失败捷径。Trace2Tower 的核心 Intuition 是：将 agent 的执行轨迹抽象为事件图，同时融合语义兼容性、转换动态和成败结果三种信号，通过对比谱分解提取出在成功轨迹中稳定共现且有序的行为模式。这些被隔离出的稳定模式自带执行依赖与成功对齐属性，从而能够自然地堆叠成从... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **Trace2Tower: Transition-Aware EigenTrace Induction of Multi-Level Skills for LLM Agents** ## **Jiazheng Sun**[∗][1] **, Boyu Yang**[∗][1] **, Binhao Yuan**[1] **, Mingxuan Li**[1] **, Xin Peng**[1] 1College of Computer Science and Artificial Intelligence, Fudan University Shanghai 200433, China ## **Abstract** Large language model agents increasingly rely on execution traces to master complex interactive tasks. However, current paradigms are bottlenecked by shallow trajectory retrieval and flat skill summarization, fundamentally ignoring the temporal dependencies and outcome-conditioned topology of agent behavior. We introduce Trace2Tower, a transition-aware EigenTrace framework that distills raw trajectories into a robust skill hierarchy. Trace2Tower abstracts step-level interactions into canonical events, constructing a unified graph governed by semantic compatibility, transition d...", "additional_insights": "### § 8 Take-aways\nTrace2Tower 提出了一种 transition-aware EigenTrace 框架，将 LLM agent 的原始 trajectories 转化为多层级（action, procedure, strategy）的 skill hierarchy。该框架通过 event abstraction 将 step-level 交互抽象为 canonical events，并构建一个融合 semantic compatibility、transition dynamics 和 outcome evidence 的 unified graph。通过引入 contrastive spectral decomposition，系统能够分离出与成功对齐的 behavioral modes，同时抑制容易导致失败的 shortcuts。在 ALFWorld 和 WebShop 基准测试中，Trace2Tower 分别达到了 87.31% 和 50.67% 的成功率，显著优于 ExpeL 和 SkillX 等 baselines，且减少了执行步骤和无效动作。消融实验表明，transition dynamics 是最关键的信号，移除后成功率下降 17.16%；而 contrastive affinity 和 outcome evidence 防止了语义相似但结果失败的 shortcuts 主导行为图。该方法支持跨模型迁移，GPT-5.4 构建的 Tower 可以有效提升 DeepSeek-V4-Flash 作为 Skill User 的表现，且无需重新诱导结构即可通过 verifier-guided feedback 进行图编辑优化。\n\n### § 9 最脆弱的假设\n该框架最关键且最脆弱的假设是：从有限的历史 trajectories 中提取出的 transition dynamics 和 outcome evidence 能够稳定地泛化到未见过的任务上，即成功对齐的 behavioral modes 是可复用的。在实际的开放环境（如真实的网页交互或非平稳的 API 调用）中，历史轨迹中观察到的 transitions 可能非常稀疏，且特定任务的 state-action 拓扑可能无法覆盖新任务所需的行为模式。如果新任务的结构与训练任务存在显著差异，基于历史轨迹构建的 graph 可能会缺失关键节点或边，导致 spectral decomposition 无法发现有效的 procedure 和 strategy。虽然论文在 ALFWorld 和 WebShop 上验证了 Theorem 1 (EigenTrace Stability)，但这依赖于 graph 统计量的估计误差较小且 eigengap 足够大。论文缺少在高度非平稳或状态空间极度开放的环境中的验证，也没有讨论当新任务所需的 canonical events 在历史轨迹中完全缺失时，系统如何应对（除了 fallback 到 No-Skill）。\n\n### § 10 最小复现实验\n如果有一周时间，最小复现实验可以聚焦于验证 contrastive spectral decomposition 在抑制 failure-prone shortcuts 和提升 skill 质量方面的有效性。使用 ALFWorld 的 1,240 条 No-Skill trajectories（包含成功和失败轨迹）作为数据。不需要实现完整的 LLM agent 交互循环，仅复现 event abstraction 和 graph construction 部分。构建包含 semantic, transition, outcome 信号的 unified graph，然后分别应用 contrastive affinity transformation（$A^+_{uv} / (A^+_{uv} + A^-_{uv})$）和不应用（仅使用 $A^+_{uv}$）进行 spectral decomposition，得到 procedure clusters。测量两种方式得到的 procedure clusters 的纯度，即每个 cluster 内成功轨迹片段的比例。同时，人工检查几个最大的 clusters，看是否包含了明显的 failure-prone shortcuts（例如：在 ALFWorld 中，先去加热不需要加热的物体）。如果应用 contrastive transformation 后，procedure clusters 的成功片段比例显著提高，且明显排除了 failure-prone 的行为序列，则支持论文的 claim；如果两者没有显著差异，或者 contrastive transformation 导致有效行为被错误抑制，则反驳了该 claim。", "research_value": "### § 11 最强反例设计\n我将设计一个基于非平稳交互环境的反例实验，直接挑战 Trace2Tower 的核心假设：即历史轨迹中提取的 transition dynamics 能够稳定泛化到未见任务。具体而言，在 WebShop 的基础上构建一个存在 UI/API drift 的动态环境变体，例如在 agent 收集历史轨迹后，系统在 checkout 流程中注入一个额外的 authentication step（如验证码或新的必填字段），改变了原有的 state-action 拓扑。在这个环境中测试 Trace2Tower 与一个简单的 flat retrieval baseline（如 ExpeL）。我的预测是，Trace2Tower 的表现将显著劣于 baseline，且失败模式具有高度可预测性。因为 contrastive spectral decomposition 会将历史中成功的 checkout procedure 固化为一个 rigid 的 behavioral mode，当环境发生 drift 时，agent 会强制重放这个失效的 procedure，导致反复在同一个未知节点上失败且无法跳出。相反，flat retrieval 方法由于没有施加严格的图结构约束，反而能通过 LLM 自身的 in-context reasoning 识别出局部的状态差异并进行适应。这个反例不仅证明了 Trace2Tower 提取的 success-aligned modes 在面对 transition dynamics 漂移时极其脆弱，还提出了一种强有力的替代解释：其在静态基准上的高成功率可能仅仅源于对固定环境拓扑的过拟合，而非真正掌握了可复用的 skill hierarchy。\n\n### § 12 Follow-up Research Idea\n该想法由 Trace2Tower 无法处理非平稳环境和缺失 canonical events 的核心局限所驱动，提出了一种基于在线因果探测的动态技能图谱重构框架。与其像现有工作那样从静态历史轨迹中离线诱导 skill hierarchy，不如将 agent 的执行过程视为对环境因果结构的持续假设检验。我们可以借鉴因果发现领域的 intervention 和 counterfactual reasoning 技术，赋予 agent 在线进行 counterfactual probing 的能力。当 agent 执行某个 procedure 遇到预期外的 transition 失败时，它不是简单地 fallback 到 No-Skill，而是主动在局部邻域内进行受控的 intervention（即试探性执行替代 action），以收集新的 outcome evidence，并实时更新 unified graph 的局部拓扑和 edge weights。这种动态图随后通过 incremental spectral decomposition 更新当前的 behavioral modes，从而实现 skill 的在线演化。第一个实验将构建一个 affordance 动态变化的 ALFWorld 变体（例如某些容器突然无法打开，需要寻找替代容器），对比 Trace2Tower（静态图）与提出的在线因果重构方法，评估指标聚焦于遭遇环境突变后的 recovery rate 和 adaptation steps。这一提议与现有 skill library 构建工作的根本区别在于，它将 skill induction 从一个静态的、被动观察的图聚类问题，转变为一个动态的、主动干预的因果发现过程，从而真正解决开放世界中 transition dynamics 漂移带来的泛化瓶颈。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jiazheng Sun\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Boyu Yang\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Binhao Yuan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Mingxuan Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xin Peng\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Fudan University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"These authors contributed equally.\"}\n  ]\n}\n```", "summary_translation": "大语言模型 agents 越来越依赖于 execution traces 来掌握复杂的交互式任务。然而，当前的范式受制于 shallow trajectory retrieval 和 flat skill summarization，从根本上忽略了 agent behavior 的 temporal dependencies 和 outcome-conditioned topology。我们引入了 Trace2Tower，这是一个 transition-aware 的 EigenTrace framework，它将 raw trajectories 提炼为稳健的 skill hierarchy。Trace2Tower 将 step-level interactions 抽象为 canonical events，构建了一个由 semantic compatibility、transition dynamics 和 outcome evidence 主导的统一 graph。通过一种新颖的 contrastive spectral decomposition，它分离出稳定的、success-aligned 的 behavioral modes，同时严格抑制 failure-prone 的 shortcuts。这些 modes 有机地填充了由 action templates、procedural routines 和 overarching task strategies 构成的动态 skill tower，并通过 verifier-guided feedback 持续优化。在 ALFWorld 上，Trace2Tower 取得了 87.31% 的 success，仅需 10.35 个 steps 和 0.26 个 invalid actions；在 WebShop 上，它达到了 50.67% 的 exact success。在这两个 benchmarks 上，Trace2Tower 在 task mastery 和 context-efficient experience reuse 方面显著优于现有的 baselines。"}, {"title": "From Interaction Traces to Persistent Skills: Online Evolution for Computer-Use Agents", "arxiv_id": "2609.04869", "authors": "Longtao Hu, Xiao Liang, Linchao Zhu", "summary": "Computer-use agents can execute increasingly complex tasks in graphical interfaces, but their interaction experience is typically transient: procedural knowledge acquired from one rollout is not systematically retained, refined, and reused in later tasks. Existing skill libraries provide external procedural knowledge, yet their incremental value over the same agent operating without skills, as well as their longitudinal dynamics under repeated interaction, remain insufficiently characterized. We present an online skill-evolution framework that converts interaction trajectories and evaluator feedback into a persistent, versioned library of reusable procedures. Each iteration executes against a frozen library snapshot, and evidence-guided skill updates become available in subsequent iterations without changing model parameters. We compare the full evolving-library system with a configuration-matched empty-library control across four OSWorld application domains under the same fixed action-generation and GUI-grounding stack, task sets, and iteration horizons. Following a five-iteration empty-library warm-up, Full attains a higher post-warm-up mean evaluator score in all four observed domain runs, with mean differences ranging from 5.7 to 18.6 percentage points and domain-dependent temporal stability. In GIMP, provenance-aware analysis reveals retrieval across task-of-origin boundaries and revision churn, where repeated accepted edits fail to recover the originating task. These findings characterize evolving skill libraries as auditable, shared procedural memory that can improve a fixed computer-use stack, while showing that their benefits are conditional and repeated revision does not guarantee recovery. Code is released at https://github.com/LongtaoHu/Skill-Evo4GUI.", "category": "cs.AI", "cluster": "Skill Learning \u0026 Evolution", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了一种针对计算机使用智能体的“在线技能演化框架”。该框架通过将交互轨迹和评估反馈转化为持久的、版本化的可重用程序库，实现了智能体在不改变模型参数的情况下，通过经验进行自我完善和迭代改进。这高度契合研究焦点中的“自我演化”和“单智能体”方向，特别是涉及记忆机制、技能获取和在线适应。论文不仅提出了演化机制，还对这种演化型技能库的纵向动态和失败模式进行了深入的行为分析和评估，符合“研究对象明确是 LLM Agents 且结论帮助理解或改进智能体能力”的保留标准。虽然实验场景在图形界面交互中，但属于“领域是场景，机制才是贡献”的范畴，不涉及任何被排除的安全、图网络或纯系统工程问题。", "intro_logic": "### § 1 研究问题与重要性\n论文提出的研究问题是：在 computer-use agents 执行图形界面（GUI）任务时，如何将瞬态的交互轨迹转化为持久、版本化的可重用 procedural memory，并系统评估这种在线进化的 skill library 相对于无技能基线的增量价值及其在重复交互下的纵向动态。具体而言，作者探究了在不改变底层 Executor 和 Grounding 模型参数的前提下，外部技能库的进化能否为固定的 computer-use stack 带来可测量的性能提升，以及这些技能能否跨越其原始任务边界被作为共享记忆重用。这个问题至关重要，因为现有的 computer-use agents 在完成一次 rollout 后，成功的操作程序和失败证据通常不会被系统地保留，导致它们在后续交互中不得不重新发现相同程序或重复相同的失败。通过解决这一问题，论文不仅提供了一种无需参数更新即可实现 agent 持续适应的框架，还通过 provenance-aware analysis 揭示了技能进化的条件性（如 revision churn 现象），为构建可审计、共享的适应层提供了重要的实证基础和设计指导。\n\n### § 2 前人工作与不足\n在本文之前，研究者们已通过多种方式探索了 agent 的非参数化改进与技能管理。早期的外部记忆方法如 Reflexion 存储语言自我反馈，ExpeL 从任务经验中提炼可重用见解，而 Voyager 和 Agent Workflow Memory 则进一步将可执行代码技能和可重用例程应用于开放世界探索和 Web 轨迹。针对计算机使用场景，CUA-Skill、MMSkills 和 MMG2Skill 等系统设计了专门的技能表示形式（如参数化执行图、多模态状态卡和视觉关键帧），以支持程序的检索与组合。此外，SAGE、EvoSkill、SkillOS 和 MUSE-Autoskill 等框架将技能维护转化为显式的学习过程，结合强化学习或失败分析进行技能的创建、编辑与生命周期管理。然而，这些先前工作存在一个关键的评测缺口：它们大多关注最终库的构建或聚合端点分数，而未能充分表征在 grounded desktop agents 中在线进化的 skill libraries 的纵向动态。具体而言，之前的研究没有在配置匹配的条件下，严格比较进化库与同一无技能系统在重复交互中的增量价值，也没有追踪技能的 provenance 以验证其是否跨越原始任务边界被重用。这种不足源于以往系统往往将技能进化与模型微调或 rollout 内适应混淆，缺乏将 iteration-frozen 的执行与 evidence-guided 的技能更新分离的机制，从而无法独立观察外部程序性记忆的演化过程及其对固定执行栈的实际影响。论文通过引入配置匹配的纵向比较和 provenance-aware analysis，精确填补了这一空白，揭示了技能库进化的领域依赖性和重复修订不保证任务恢复的局限性。", "core_insight": "### § 3 重建作者的思考路径\n\n在 computer-use agents 的研究中，一个长期存在的痛点是交互经验的瞬时性：agent 在完成一次 rollout 后，成功或失败的操作流程没有被系统性地保留，导致在后续任务中重复试错或重现相同的失败。虽然已有研究如 Reflexion 和 ExpeL 尝试通过外部语言记忆保留经验，Voyager 和 Agent Workflow Memory 进一步将经验转化为可执行的代码技能或工作流，但这些方法大多关注技能的静态表示与检索，未能充分刻画技能库在长期重复交互中的纵向演化动态。研究者可能观察到，如果技能库无约束地更新，失败证据可能会引发无效的重复修改，导致“revision churn”现象，即技能不断被修改却无法恢复原始任务的成功。为了隔离技能演化本身的真实效果，必须排除模型参数微调或 rollout 内部适应的干扰，这就需要固定底层的 Executor 和 Grounding 模型，将所有的适应行为限制在外部技能库的迭代上。进一步地，为了防止演化过程中的副作用污染当前执行，自然引出了“执行与演化分离”的设计：每次迭代基于冻结的技能库快照执行任务，轨迹证据在迭代结束后才用于指导技能的创建、修改或保留，并在下一次迭代中生效。最后，为了验证技能库是否真正作为共享记忆被跨任务复用，而非仅仅是任务特定的记录，研究者引入了 provenance 机制，通过追踪技能的来源、检索和修改历史，揭示技能复用的真实模式与演化瓶颈。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 在于：将 computer-use agents 瞬时的交互轨迹转化为持久化、版本化的外部程序性记忆，通过“执行与演化分离”的机制实现无需参数更新的持续适应。在固定的 Executor 和 Grounding 模型之上，每次迭代使用冻结的技能库快照执行任务，随后基于轨迹证据对技能库进行增删改，更新仅在后续迭代生效。这种设计将技能库转化为一个可审计的共享适应层，使得 agent 能够在重复交互中积累有效经验，同时暴露出演化过程中的局限性（如无效修改）。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《From Interaction Traces to Persistent Skills: Online Evolution for Computer-Use Agents》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出的研究问题是：在 computer-use agents 执行图形界面（GUI）任务时，如何将瞬态的交互轨迹转化为持久、版本化的可重用 procedural memory，并系统评估这种在线进化的 skill library 相对于无技能基线的增量价值及其在重复交互下的纵向动态。具体而言，作者探究了在不改变底层 Executor 和 Grounding 模型参数的前提下，外部技能库的进化能否为固定的 computer-use stack 带来可测量的性能提升，以及这些技能能否跨越其原始任务边界被作为共享记忆重用。这个问题至关重要，因为现有的 computer-use agents 在完成一次 rollout 后，成功的操作程序和失败证据通常不会被系统地保留，导致它们在后续交互中不得不重新发现相同程序或重复相同的失败。通过解决这一问题，论文不仅提供了一种无需参数更新即可实现 agent 持续适应的框架，还通过 provenance-aware analysis 揭示了技能进化的条件性（如 revision churn 现象），为构建可审计、共享的适应层提供了重要的实证基础和设计指导。 ### § 2 前人工作与不足 在本文之前，研究者们已通过多种方式探索了 agent 的非参数化改进与技能管理。早期的外部记忆方法如 Reflexion 存储语言自我反馈，ExpeL 从任务经验中提炼可重用见解，而 Voyager 和 Agent Workflow Memory 则进一步将可执行代码技能和可重用例程应用于开放世界探索和 Web 轨迹。针对计算机使用场景，CUA-Skill、MMSkills 和 MMG2Skill 等系统设计了专门的技能表示形式（如参数化执行图、多模态状态卡和视觉关键帧），以支持程序的检索与组合。此外，SAGE、EvoSkill、SkillOS 和 MUSE-Autoskill 等框架将技能维护转化为显式的学习过程，结合强化学习或失败分析进行技能的创建、编辑与生命周期管理。然而，这些先前工作存在一个关键的评测缺口：它们...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在 computer-use agents 的研究中，一个长期存在的痛点是交互经验的瞬时性：agent 在完成一次 rollout 后，成功或失败的操作流程没有被系统性地保留，导致在后续任务中重复试错或重现相同的失败。虽然已有研究如 Reflexion 和 ExpeL 尝试通过外部语言记忆保留经验，Voyager 和 Agent Workflow Memory 进一步将经验转化为可执行的代码技能或工作流，但这些方法大多关注技能的静态表示与检索，未能充分刻画技能库在长期重复交互中的纵向演化动态。研究者可能观察到，如果技能库无约束地更新，失败证据可能会引发无效的重复修改，导致“revision churn”现象，即技能不断被修改却无法恢复原始任务的成功。为了隔离技能演化本身的真实效果，必须排除模型参数微调或 rollout 内部适应的干扰，这就需要固定底层的 Executor 和 Grounding 模型，将所有的适应行为限制在外部技能库的迭代上。进一步地，为了防止演化过程中的副作用污染当前执行，自然引出了“执行与演化分离”的设计：每次迭代基于冻结的技能库快照执行任务，轨迹证据在迭代结束后才用于指导技能的创建、修改或保留，并在下一次迭代中生效。最后，为了验证技能库是否真正作为共享记忆被跨任务复用，而非仅仅是任务特定的记录，研究者引入了 provenance 机制，通过追踪技能的来源、检索和修改历史，揭示技能复用的真实模式与演化瓶颈。 ### § 4 核心 Intuition 这篇论文的核心 Intuition 在于：将 computer-use agents 瞬时的交互轨迹转化为持久化、版本化的外部程序性记忆，通过“执行与演化分离”的机制实现无需参数更新的持续适应。在固定的 Executor 和 Grounding 模型之上，每次迭代使用冻结的技能库快照执行任务，随后基于轨迹证据对技能库进行增删改，更新仅在后续迭代生效。这种设计将技能库转化为一个可审计的共享适应层，使得 agent 能够在重复交互中积累有效经验，同时暴露出演化过程中的局限... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **From Interaction Traces to Persistent Skills: Online Evolution for Computer-Use Agents** ## **Longtao Hu** _2023090902005@std.uestc.edu.cn_ _University of Electronic Science and Technology of China_ **Xiao Liang** _Zhejiang University_ _0314liangxiao@gmail.com_ **Linchao Zhu** _[∗] Zhejiang University_ _zhulinchao7@gmail.com_ ## **Abstract** Computer-use agents can execute increasingly complex tasks in graphical interfaces, but their interaction experience is typically transient: procedural knowledge acquired from one rollout is not systematically retained, refined, and reused in later tasks. Existing skill libraries provide external procedural knowledge, yet their incremental value over the same agent operating without skills—and their longitudinal dynamics under repeated interaction—remain insufficiently characterized. We present an online skill-evolution framework that converts in...", "additional_insights": "### § 8 Take-aways\n本文提出了一个 online skill-evolution framework，通过将交互轨迹和 evaluator feedback 转化为持久化、版本化的 procedural memory，实现了在不修改底层模型参数的前提下对 computer-use agents 的持续赋能。实验证明，在 OSWorld 的四个应用领域中，配备 evolving skill library 的系统在 warm-up 阶段后的 mean evaluator score 均高于 empty-library control，提升幅度在 5.7 到 18.6 个百分点之间。Provenance-aware 分析揭示了 43.3% 的技能检索属于 cross-origin retrieval，证实技能库作为 shared procedural memory 被跨任务复用，而非仅仅是 task-specific records。然而，研究也发现了 revision churn 现象，即持续的失败会触发反复的技能编辑，但这并不能保证恢复原始任务的成功，表明技能库的收益是 domain-dependent 且受限于底层 Executor-Grounding stack 的能力瓶颈。\n\n### § 9 最脆弱的假设\n本文最核心且失败代价最大的假设是：**通过 evidence-guided 更新 textual skill library 能够有效弥补固定 Executor-Grounding stack 的执行缺陷，且技能的复用能直接转化为任务成功率的提升。** 如果这个假设不成立，整个 skill evolution 框架就退化为一个无效的文本游戏。在实际中，这个假设极易不成立，因为 computer-use 任务的成功高度依赖于 GUI grounding 的精度和 action execution 的准确性。如果底层模型无法准确点击按钮或识别视觉元素，再完美的 textual procedure 也无法执行。论文中的 revision churn 现象直接暴露了这一脆弱性：在 GIMP 的 background-transparency 任务中，尽管技能被反复编辑，任务成功率依然极低（35次中仅2次成功）。论文虽然承认了这可能是 Executor-Grounding stack 的瓶颈所致，但缺乏 component-level 的 ablation study 来证明 textual skill 的改进确实传递到了执行层面，而非仅仅在 telemetry 中记录了无用的检索行为。\n\n### § 10 最小复现实验\n如果有一周时间，最小复现实验应聚焦于验证 **cross-origin retrieval 是否能带来实际的性能提升**，而非复现完整的 online evolution 闭环。使用 OSWorld 中的 VLC 域作为测试环境（因为其提升最大且相对稳定）。首先，使用固定的 Executor-Grounding stack 运行 Empty control 获取 baseline 成绩。然后，手动为其中一半任务编写高质量的 SKILL.md 文件，构建一个 static skill library。接着，让系统在包含所有任务的集合上运行，但仅提供这半个技能库，测量另外一半没有专属技能的任务在检索到 cross-origin skill 后的成功率变化。如果未提供专属技能的任务成功率显著上升，则支持了“技能库作为 shared procedural memory 具有跨任务增量价值”的 claim；如果成功率不变或下降（例如被错误的技能误导），则反驳了该 claim。此方案绕过了复杂的 Extractor 和 Proposer 闭环，直接测试了 skill retrieval 机制的核心价值。", "research_value": "### § 11 最强反例设计\n如果我反对这篇论文，我会设计一个“逻辑破坏与语义锚定”反例实验，直接挑战技能库作为 procedural memory 提供执行指导的核心 claim。论文声称性能提升源于版本化的操作程序，但如果底层 Executor 仅仅是将检索到的技能文本作为 in-context learning 的语义提示，而非真正遵循其逻辑步骤，那么技能的顺序和因果关系就无关紧要。具体实验如下：在系统完成 warm-up 阶段并生成 evolved skill library 后，我会对库中的每个技能文件进行“步骤乱序”处理——保留所有 GUI 元素名称和动作关键词，但随机打乱步骤的先后顺序，甚至引入逻辑矛盾的操作。如果在这个 Corrupted Skill Library 下，agent 的 mean evaluator score 与原版 evolved library 相比没有显著下降，甚至因为包含了正确的关键词而依然高于 empty-library control，这就构成了最强反例。这将证明所谓的“性能提升”并非源于可审计的 procedural memory 的逻辑指导，而是源于检索机制无意中注入了与任务相关的视觉或功能关键词，从而激活了底层 LLM 的先验知识。此外，针对 revision churn 现象，我可以设计一个“视觉对抗”场景：在 GIMP 任务中，当技能要求点击特定 UI 元素时，故意在 GUI 中引入高强度的视觉干扰或动态布局变化。如果技能库的反复修订仅仅是在文本层面打转，而无法生成适应视觉变化的 grounding 策略，那么这种 textual evolution 就是一个与物理执行环境脱节的无效闭环，彻底暴露其无法弥补 Executor-Grounding stack 瓶颈的致命缺陷。\n\n### § 12 Follow-up Research Idea\n驱动这个想法的局限是：textual skill evolution 与底层 visual grounding 之间的严重脱节，导致 revision churn 现象——即文本层面的反复修订无法解决视觉定位和动作执行的物理瓶颈。当前的框架将 procedural memory 局限为自然语言描述，这在 GUI 元素动态变化或视觉特征模糊时显得苍白无力。因此，我提议从“文本程序记忆”转向“视觉-动作示能记忆”，借鉴机器人操作领域的 Vision-Language-Action (VLA) models 和 visual prompt tuning 技术。不再是让 LLM 生成“点击右上角红色按钮”的文本，而是构建一个存储“视觉状态嵌入-精确动作轨迹-成功反馈”三元组的非参数化记忆库。当 agent 面对新任务时，通过 contrastive learning 在当前 screenshot 与记忆库中的视觉状态进行匹配，直接检索出历史上成功的 bounding box 坐标和鼠标轨迹，并通过 spatial transformer 进行微调适配。第一个实验将设计一个“视觉漂移”场景：在 OSWorld 的相同任务中，通过改变操作系统的 UI 主题、缩放比例或窗口位置来引入视觉变化。对比传统的 textual skill evolution 与提出的 Visual-Grounded Affordance Memory (VGAM)，观察在视觉漂移下两者的 task recovery 率。如果 VGAM 能够通过视觉特征匹配直接复用历史动作参数，而文本系统因无法定位新位置的按钮而陷入 revision churn，这将证明 computer-use agents 的持续适应必须在感知-动作层面进行记忆进化，而非仅仅在符号推理层面。这一提议彻底改变了记忆的模态，将研究焦点从 LLM 的文本规划能力转移到视觉-动作映射的精确性上，与现有的纯文本或代码技能库工作形成了本质区分。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Longtao Hu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiao Liang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Linchao Zhu\", \"affiliations\": [2], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"UESTC\"},\n    {\"id\": 2, \"name\": \"Zhejiang University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "Computer-use agents 能够在图形界面中执行日益复杂的任务，但它们的交互体验通常是瞬时的：从一次 rollout 中获得的 procedural knowledge 不会被系统地保留、优化并在后续任务中复用。现有的 skill libraries 提供了外部的 procedural knowledge，但它们相对于同一 agent 在无 skill 情况下运行的增量价值，以及在重复交互下的 longitudinal dynamics，仍未得到充分刻画。我们提出了一个 online skill-evolution framework，该框架将 interaction trajectories 和 evaluator feedback 转化为一个持久化、版本化的可复用程序库。每次 iteration 都针对一个 frozen library snapshot 执行，并且 evidence-guided skill updates 在后续 iteration 中变得可用，而无需更改 model parameters。我们在相同的固定 action-generation and GUI-grounding stack、task sets 和 iteration horizons 下，比较了 full evolving-library system 与 configuration-matched empty-library control 在四个 OSWorld 应用领域中的表现。在经过 five-iteration empty-library warm-up 之后，Full 在所有四个观察到的 domain runs 中均获得了更高的 post-warm-up mean evaluator score，平均差异从 5.7 到 18.6 个百分点不等，并表现出 domain-dependent temporal stability。在 GIMP 中，provenance-aware analysis 揭示了跨越 task-of-origin boundaries 的 retrieval 以及 revision churn，其中 repeated accepted edits 未能恢复 originating task。这些发现将 evolving skill libraries 描述为能够改进 fixed computer-use stack 的 auditable, shared procedural memory，同时表明其收益是有条件的，且 repeated revision 并不能保证恢复。代码发布于 https://github.com/LongtaoHu/Skill-Evo4GUI。"}, {"title": "CoSkill: Joint Reinforcement Learning of Reasoning and Meta-Skill Agents for Hierarchical Skill Evolution", "arxiv_id": "2609.04865", "authors": "Jinyuan Feng, Dongmin Li, Yiqun Chen, Yang Gao, Xing Chen, Huimu Wang, Zhiqiang Pu", "summary": "Skill libraries improve the sample efficiency of agentic reinforcement learning (RL) by enabling large language model (LLM) agents to reuse procedural knowledge. Yet existing paradigms exhibit structural shortcomings: they either decouple skill evolution from policy optimization or instantiate meta-skills as fixed workflows. Both treat skills as passive objects to be managed, limiting the flexible evolution of skills and their co-adaptation with the reasoning agent. To address the limitations, we propose CoSkill, a unified multi-agent RL framework that recasts the static meta-skill workflow as a learnable Meta-Skill Agent and jointly trains it with a Reasoning Agent over a hierarchical skill library. By modeling the Reasoning and Meta-Skill Agents as a cooperative team sharing a single backbone, CoSkill enables end-to-end co-adaptation: the Reasoning Agent conditions its actions on a retrieved task skill and step skills selected from its child set, while its task performance guides the Meta-Skill Agent in refining those step skills. Experiments on ALFWorld and WebShop show that CoSkill substantially outperforms prior skill-based and RL baselines, achieving success rates of 98.4% and 90.6%, respectively (+3.5 and +6.2 pp). As shown in Figure 1, CoSkill achieves superior early-stage sample efficiency, asymptotic performance, and wall-clock efficiency. Our code is available at https://github.com/jinyuan-cookie/CoSkill.", "category": "cs.AI", "cluster": "Skill Learning \u0026 Evolution", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agent capability/behavior, Multi-Agent)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=12 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文完全符合你的研究范围，特别是“多智能体”和“自我演化”方向。论文的核心贡献是提出了 CoSkill 框架，将静态的元技能工作流重新构建为可学习的“元技能智能体”，并将其与“推理智能体”作为一个合作团队进行联合强化学习。这直接对应了你筛选标准中的“多智能体系统中新的协作机制”以及“智能体通过经验、反馈进行自我完善和迭代演化”。论文明确针对 LLM Agents，探讨了技能获取与层次化技能演化，属于典型的 Agentic AI 和 LLMs Improving LLMs 范畴。此外，实验场景（ALFWorld 和 WebShop）属于长期决策智能体，且论文未涉及被排除的安全、多模态核心、图技术或纯粹的系统工程拓扑结构，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的核心研究问题是：在 agentic reinforcement learning (RL) 中，如何实现 fine-grained 的 skill–policy co-evolution，使得 procedural knowledge 的演化能与 reasoning policy 的优化动态对齐。Skill libraries 通过让 large language model (LLM) agents 复用程序性知识，显著提高了长视距任务的 sample efficiency。然而，随着 reasoning policy 在与环境交互中不断更新，静态或粗粒度管理的技能会迅速变得陈旧、冗余或与当前策略错位。解决这个问题能够带来巨大的实践价值：它不仅消除了对强大闭源 LLM 的依赖以进行外部技能维护，还能通过 end-to-end 的协同训练大幅提升 agent 的 early-stage sample efficiency、asymptotic performance 以及 wall-clock efficiency。将技能演化从一个被动管理的过程转变为一个可学习的、与环境反馈对齐的动态过程，是推动长视距自主智能体走向实际应用的关键一步。\n\n### § 2 前人工作与不足\n该问题在本文之前未被完整解决，现有的 skill-evolution paradigms 均存在结构性缺陷。第一种范式是 **Externally Orchestrated Skill Evolution**（代表方法如 SkillRL, D2Skill, ReSkill, Trace2Skill），这类方法将技能库视为独立的知识库，把技能的生成和修订委托给外部 LLMs 或人工规则。其不足的根本原因在于将技能管理视为外部的、独立于 policy-learning objective 的编排过程，导致技能演化脱离了 RL 的优化闭环，随着库的增长，内容不可避免地与不断演化的 reasoning policy 产生 mismatch。第二种范式是 **RL-Optimized Skill-Library Management**（代表方法如 SAGE, ARISE, Skill1），它尝试将技能库维护纳入 RL 循环，利用 downstream rewards 优化技能的生命周期决策。但其不足在于方法论上的 coarse-grained 假设：它将技能本身视为不可分割的 atomic entry，RL 仅控制技能的创建、选择或保留，而完全忽略了技能内部程序的优化。这种限制导致那些有用但不完美的技能往往被直接移除，而非根据执行反馈进行细化。第三种范式是 **Meta-Skill-Driven Skill Optimization**（代表方法如 SkillOpt, EvoSkill, SkillEvolver, MetaSkill-Evolve），它将优化下沉到单个技能的内部程序上。然而，这类方法依赖预定义的 meta-skill 程序（如 rubric-based prompts 或固定 workflows），且通常冻结 reasoning agent。其不足的核心在于将 meta-skill 实例化为静态的、预定义的更新规则，假设技能的修改逻辑无需与推理策略动态适配。这种固定的更新规则无法与演化的 policy 进行 co-adapt，重新引入了 skill–policy mismatch，使得通过 RL 学习能与推理策略共同演化的 meta-skills 一直是一个未解的开放性问题。", "core_insight": "### § 3 重建作者的思考路径\n\n在 agentic RL 中引入 skill library 虽然能提升 sample efficiency，但长期面临 skill-policy 不匹配的困境。最初，研究者尝试用外部 LLM 或人工规则来维护 skill library，但这将 skill evolution 与 policy optimization 割裂，随着 reasoning policy 的演进，静态管理的 skill 极易变得陈旧或冗余。为了缓解这种脱节，后续工作将 skill 的生命周期管理（如创建、保留、删除）纳入 RL 循环，但这仍然停留在 coarse-grained 层面：RL 只能决定一个 skill 的去留，却无法优化其内部的具体程序，导致那些“有用但不完美”的 skill 被直接丢弃而非被精炼。最近，一些研究开始利用执行反馈来优化 skill 的内部程序，但它们依赖预定义的 meta-skill 工作流（如固定的 prompt 或多智能体规则），且通常冻结 reasoning agent。这种固定的更新规则无法与不断演进的 policy 共同适应，再次引入了优化错位。顺着这些失败模式，一个自然的理论推演是：如果固定的 skill 编辑器会失效，那为什么不把 skill 编辑过程本身也变成一个可学习的 agent？在多智能体强化学习的视角下，如果让负责环境交互的 Reasoning Agent 和负责修改 skill 的 Meta-Skill Agent 共享同一个 LLM backbone，并让后者的编辑动作直接由前者的下游任务表现来校准，就能闭合 skill-policy 的优化回路。此外，为了避免局部编辑破坏全局策略，经验观察提示我们需要一个 hierarchical skill library：在 task level 保持稳定指导，仅在 step level 进行细粒度的程序修正。这样，通过 post-edit verification 将任务成功率转化为对编辑动作的延迟奖励，两个 agent 便能在同一个 RL 目标下实现 end-to-end 的共同进化。\n\n### § 4 核心 Intuition\n\n先前方法失效的原因在于，它们要么用固定规则、要么用外部模型来管理 skill，导致 skill 的进化与 reasoning policy 的学习脱节。这篇论文的核心 Intuition 是：不要把 skill 当作被动管理的静态对象，而是把“如何修改 skill”本身建模成一个可学习的 Meta-Skill Agent，让它和负责执行任务的 Reasoning Agent 共享同一个模型并共同训练。通过让任务执行的成功与否直接作为修改 skill 的奖励信号，系统能自动学会只保留并精炼那些真正能提高任务成功率的 skill 程序，从而实现 skill 与 policy 的共同进化。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+-------------------------+      Retrieve      +-----------------------+\n| Hierarchical Skill Lib  | \u003C----------------- |   Reasoning Agent     |\n| (Task \u0026 Step Skills)    | -----------------\u003E |   (Shared LLM)        |\n+-------------------------+                    +-----------+-----------+\n       ^                                                 | Action\n       | Refine                                          v\n+------+-------+         Outcome Feedback     +-----------+-----------+\n| Meta-Skill   | \u003C--------------------------- | Environment / Task    |\n| Agent        |                              +-----------------------+\n| (Shared LLM) |                                        |\n+------+-------+                                        |\n       ^                                                |\n       |              Joint RL (GiGPO)                  |\n       +------------------------------------------------+\n```\n\nCoSkill 是一个统一的多智能体强化学习框架，其完整 Pipeline 基于上述架构运行：\n\n1. **Hierarchical Skill Library 检索**：系统维护一个分层的技能库。在每一步交互中，Reasoning Agent 首先根据当前任务和历史观测检索出适用的 Task Skill，并进一步从该 Task Skill 的 Child Set 中检索出细粒度的 Step Skills。\n2. **Reasoning Agent 动作执行**：Reasoning Agent 以检索到的 Task Skill 和 Step Skills 作为条件，结合当前的环境观测生成具体的动作，并与环境进行交互。\n3. **Outcome Feedback 与 Post-Edit Verification**：Reasoning Agent 在完成任务后产生任务表现反馈。系统通过 Post-Edit Skill Verification 机制，将这种任务执行的表现转化为与结果对齐的反馈信号。\n4. **Meta-Skill Agent 技能精炼**：Meta-Skill Agent 接收上述反馈信号，对被使用的 Step Skills 的内部程序进行精炼和修改，而不是简单地保留或删除整个技能。\n5. **Joint RL (GiGPO) 联合优化**：Reasoning Agent 和 Meta-Skill Agent 被建模为一个共享单一 LLM backbone 的合作团队。系统使用 GiGPO 算法对这两个 Agent 进行端到端的联合训练，使得技能的演化与推理策略的优化在同一个 RL 目标下实现共同适应。\n\n### § 7 实验设计与结论\n\n**提出问题**：CoSkill 能否有效闭合 skill-policy 优化回路，实现 fine-grained 的技能演化，并在长视距任务中提升 sample efficiency、asymptotic performance 和 wall-clock efficiency？\n\n**实验验证**：研究者在 ALFWorld 和 WebShop 这两个交互式环境上进行了实验。将 CoSkill 与现有的 skill-based 方法（如 D2Skill, Skill1）以及 RL baselines 进行对比，评估了成功率、训练曲线和训练时间等指标。\n\n**结论**：实验结果表明，CoSkill 显著优于先前的 skill-based 和 RL baselines。在 ALFWorld 和 WebShop 上分别达到了 98.4% 和 90.6% 的成功率（相较基线分别提升 +3.5 和 +6.2 pp）。此外，CoSkill 在早期样本效率、渐近性能和墙钟时间效率上均展现出优越的表现，证明了将 meta-skill 建模为可学习 Agent 并与 Reasoning Agent 联合训练的有效性。", "additional_insights": "### § 8 Take-aways\n\nCoSkill 通过将静态的 meta-skill workflow 重构为可学习的 MetaSkill Agent，并与 Reasoning Agent 共享 LLM backbone 进行联合 RL 训练，实现了 skill 与 policy 的端到端 co-adaptation。Hierarchical skill library 的设计将全局 task skills 与局部 step skills 解耦，限制了检索与修订范围，有效减少了不相关 skills 的干扰。Post-Edit Skill Verification 机制将下游任务效用转化为 episode-level 的 delayed reward，作为 skill edits 的直接选择信号，从而过滤掉局部合理但全局有害的修订。实验表明，与目标环境奖励对齐的 RL 训练 skill editor 显著优于大规模外部闭源 LLM editor，证明了 skill-policy co-adaptation 比单纯的 editor 规模更关键。RL 训练使 Meta-Skill Agent 的编辑动作分布从高熵的随机行为收敛为高度选择性的 UPDATE 操作，大幅减少了冗余的 library 增长和破坏性删除。\n\n### § 9 最脆弱的假设\n\nCoSkill 最脆弱的核心假设是：Post-Edit Skill Verification 能够准确地将下游任务的成功归因于特定的 step-skill edits。该框架假设在 baseline 尝试与 verification 尝试之间观察到的成功率提升（$\\Delta_{skill}$）是由 Meta-Skill Agent 的编辑带来的，而非环境或 reasoning policy 的随机性。在实际的长视野稀疏奖励任务中，这个假设极易不成立：如果 verification 阶段仅仅因为 LLM 探索的随机性而偶然成功，一个无用甚至有害的 skill edit 就会被赋予正向的 delayed reward，从而导致 skill library 被污染。论文在第 3.3 节声称“在 verification 尝试中进行聚合减少了 rollout variance”，但表 3 的实现细节显示 Post-edit verification attempts $M=1$，这意味着实际上并没有进行多次聚合来平抑方差。尽管图 5 展示了宏观上稳定的 library 增长和极高的 retrieval hit rate，间接证明 edits 总体有效，但论文缺少对单次 verification 下 credit assignment 可靠性的微观统计分析，无法排除“虚假归因”对系统鲁棒性的潜在破坏。\n\n### § 10 最小复现实验\n\n在 1 周时间内，可以设计一个最小复现实验来验证“未训练的 LLM editor 倾向于产生高熵且破坏性的 edits，而 Post-Edit Skill Verification 是必要的过滤机制”这一核心 claim。使用 ALFWorld 环境和 Qwen2.5-7B-Instruct 模型，首先通过离线 rollout 收集约 50 个长视野任务的 trajectories，并利用外部 LLM 构建一个初始的 hierarchical skill library。接着，在留出的 20 个测试任务上运行 baseline 尝试，记录每一步的 active step skill 和 transition。然后，使用未经 RL 训练的 Qwen2.5-7B 作为 Meta-Skill Agent，对这些 transitions 生成 edits（INSERT/UPDATE/DELETE/KEEP）。实现 Post-Edit Skill Verification 机制：将生成的 edits 应用于私有 bundle，并在相同的测试任务上重新运行 agent（设置 $M=3$ 以获得稳定信号）。测量以下指标：未训练 editor 的动作分布（特别是 DELETE 的比例）、破坏性删除导致的 empty step-bundle rate，以及 edits 通过 verification 的成功率（即 $\\Delta_{skill} \u003E 0$ 的比例）。如果实验结果显示未训练 editor 的 DELETE 比例极高（如论文图 5 所示的 30% 以上），且大量 edits 在 verification 阶段导致任务成功率下降或产生空 bundles，则支持了论文“外部 LLM editor 无法直接用于 skill evolution”的 claim。进一步地，可利用 verification 的二值奖励对 Qwen2.5-7B 进行极少步数的 LoRA 微调（模拟轻量级 RL），若观察到 DELETE 比例显著下降且 UPDATE 与 KEEP 占主导，即可初步验证 RL 对齐对稳定 skill evolution 的关键作用。", "research_value": "### § 11 最强反例设计\n\n要构建对 CoSkill 最致命的攻击，我会设计一个“虚假归因与策略退化”的对抗性实验，直接挑战其 Post-Edit Skill Verification 机制在长视距稀疏奖励下的 credit assignment 可靠性。该实验的核心逻辑是证明 CoSkill 的性能提升并非源于 skill-policy 的有效 co-adaptation，而是源于 Reasoning Agent 自身能力的增强，Meta-Skill Agent 只是搭便车并制造了 skill library 的虚假繁荣。具体而言，我会在 ALFWorld 或 WebShop 中构造一类具有高度环境随机性或存在多条异构解决路径的任务。在这些任务中，我会在测试阶段进行严格的干预实验：首先，正常训练 CoSkill 并记录其达到的 asymptotic performance；随后，在推理阶段完全 ablate 掉 Meta-Skill Agent（即冻结 skill library，停止任何 edits），并强制 Reasoning Agent 在检索 step skills 时随机注入噪声或直接屏蔽 retrieved skills。如果在此干预下，agent 的成功率并未出现显著下降，便构成了最强的反例。这一结果将直接证明，那些通过 verification 获得 positive delayed reward 的 skill edits 实际上是冗余甚至无效的，agent 的成功主要依赖于共享 LLM backbone 在 RL 训练中获得的 reasoning capability 提升，而非 procedural knowledge 的演化。进一步地，通过追踪 $M=1$ 下的 verification 过程，如果统计分析表明大量被保留的 edits 与任务成功之间的互信息极低，且 library 中充斥着由偶然成功导致的“寄生 skills”，就能彻底推翻论文关于“RL 训练使 Meta-Skill Agent 收敛为高度选择性 UPDATE”的结论，揭示其本质上是一个被高方差 rollout 掩盖的虚假协同进化现象。\n\n### § 12 Follow-up Research Idea\n\n基于 CoSkill 在 episode-level delayed reward 下面临的 credit assignment 瓶颈，我提出一个全新的研究框架：**Counterfactual Skill Attribution via Learned World Models (CSA-WM)**。该想法的驱动局限在于，依赖环境真实 rollout 进行 post-edit verification 在长视距任务中不可避免地遭遇高方差和虚假归因，且 $M=1$ 的设定根本无法平抑探索随机性。为了从根本上解耦 skill evaluation 与环境交互的高昂成本及随机性，我们可以借鉴因果推断与模型预测控制领域的 counterfactual reasoning 技术。CSA-WM 不再执行真实的 verification rollouts，而是训练一个 LLM-based World Model 来模拟环境动态与任务成功概率。当 Meta-Skill Agent 提出一个 step-skill edit 时，系统利用 World Model 在隐空间或状态空间中生成 counterfactual trajectories，直接对比“应用该 edit”与“保持原状”在预测成功率上的 Average Treatment Effect (ATE)。这一提议与现有工作的根本区别在于：它将 skill optimization 的信号从粗糙的、延迟的环境二值奖励，转变为密集的、步级因果效应估计，彻底打破了原有范式对完整 episode rollout 的依赖。第一个实验将聚焦于验证 World Model 的因果预测精度：在 ALFWorld 中收集带干预的离线数据集训练 World Model，随后对一系列人工构造的“有害但局部合理”的 skill edits 进行 counterfactual evaluation。如果 CSA-WM 能够准确识别出这些 edits 在 counterfactual 轨迹中导致的成功率下降，而传统的 $M=1$ Post-Edit Verification 因环境随机性未能拒绝这些 edits，即可证明基于因果模型的步级归因能够从根本上消除 skill library 污染，开启基于世界模型的 skill 因果演化新方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jinyuan Feng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Dongmin Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yiqun Chen\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yang Gao\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Xing Chen\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Huimu Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhiqiang Pu\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Institute of Automation, CAS\"},\n    {\"id\": 2, \"name\": \"Renmin University of China\"},\n    {\"id\": 3, \"name\": \"ByteDance\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "Skill libraries 通过使 large language model (LLM) agents 能够复用 procedural knowledge，提高了 agentic reinforcement learning (RL) 的 sample efficiency。然而现有的 paradigms 表现出结构性缺陷：它们要么将 skill evolution 与 policy optimization 解耦，要么将 meta-skills 实例化为 fixed workflows。两者都将 skills 视为被管理的被动对象，限制了 skills 的灵活演化及其与 reasoning agent 的 co-adaptation。为了解决这些局限性，我们提出了 CoSkill，这是一个统一的 multi-agent RL framework，它将 static meta-skill workflow 重构为可学习的 Meta-Skill Agent，并在 hierarchical skill library 上与 Reasoning Agent 进行联合训练。通过将 Reasoning Agent 和 Meta-Skill Agent 建模为共享 single backbone 的 cooperative team，CoSkill 实现了 end-to-end co-adaptation：Reasoning Agent 基于检索到的 task skill 和从其 child set 中选择的 step skills 来决定其动作，而其 task performance 则指导 Meta-Skill Agent 优化这些 step skills。在 ALFWorld 和 WebShop 上的实验表明，CoSkill 显著优于先前的 skill-based 和 RL baselines，分别达到了 98.4% 和 90.6% 的 success rates（+3.5 和 +6.2 pp）。如 Figure 1 所示，CoSkill 取得了更优的 early-stage sample efficiency、asymptotic performance 和 wall-clock efficiency。我们的代码可在 https://github.com/jinyuan-cookie/CoSkill 获取。"}]}, {"name": "Embodied \u0026 Robotic Agents", "count": 2, "papers": [{"title": "RoboSPA: Can VLA Models Go Beyond Simple Scenes and Short-Horizon Tasks?", "arxiv_id": "2609.05324", "authors": "Zhenxuan Fan, Bo Zhang, Yutong Lin, Yuqian Yuan, Juekai Lin, Liang Liang, Zhuoyi Huang, Wenqiao Zhang, Juncheng Li, Siliang Tang, Jun Xiao, Yueting Zhuang", "summary": "Vision-Language-Action (VLA) models have shown promising progress in language-conditioned robotic manipulation. However, existing datasets and benchmarks mainly evaluate task completion under predefined settings, offering limited insight into model reasoning under increasing spatial and procedural complexity. We introduce \\textbf{RoboSPA} (\\textbf{Robo}t \\textbf{S}patial-\\textbf{P}rocedural \\textbf{A}ssessment), a large-scale robotic manipulation dataset and benchmark for diagnosing embodied reasoning in VLA models. \\texttt{RoboSPA} focuses on two core dimensions, Fine-Grained Spatial Reasoning and Long-Horizon Procedural Planning, covering 10 task categories and 56 base tasks. Each task is instantiated across five difficulty levels, yielding 280 variants with increasing spatial ambiguity and procedural complexity. We collect 527K trajectories across multiple embodiments and diverse scenes. Beyond binary success rate, \\texttt{RoboSPA} introduces diagnostic metrics for more detailed evaluation. Experiments on representative VLA models show that current systems still struggle with complex spatial relations, precise low-level execution, and memory-intensive planning. These results establish \\texttt{RoboSPA} as a challenging diagnostic benchmark for developing more capable, reliable, and generalizable embodied agents. Our data and code are available at https://github.com/fanzhenxuan/RoboSPA.", "category": "cs.AI", "cluster": "Embodied \u0026 Robotic Agents", "tags": ["cs.AI"], "filter_reason": "这篇论文提出了一个名为 RoboSPA 的大规模机器人操作数据集和基准，专门用于诊断具身智能体在细粒度空间推理和长程程序规划方面的能力。根据您的筛选标准，虽然该论文涉及视觉-语言-动作（VLA）多模态模型，但其核心研究对象是“具身智能体”在“长程任务”中的“规划”和“记忆”能力。论文明确指出了当前系统在复杂空间关系、精确低级执行和记忆密集型规划上的困难，这属于对智能体长程行为和失败机制的评估与诊断。按照第一步的保留规则，“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents / Multi-Agent LLMs，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留”。因此，该论文符合您对单智能体长程决策和评估的研究焦点，应予保留。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：当前 Vision-Language-Action (VLA) models 能否在空间复杂性和程序复杂性递增的条件下进行有效的 embodied reasoning？具体而言，论文聚焦两个维度——Fine-Grained Spatial Reasoning（在视觉相似候选物体中通过细微空间线索识别正确目标）和 Long-Horizon Procedural Planning（在时间约束和累积误差下执行多步操作任务），并系统考察 VLA models 的性能如何随任务难度增加而退化。这个问题的重要性在于：尽管 VLA models 在结构化、short-horizon 场景中已展现出令人鼓舞的表现，但真实世界部署要求 agent 具备超越简单指令跟随的能力。日常操作任务提出三个关键挑战：(1) Fine-grained target disambiguation，即需要通过超越类别或颜色的细微空间线索（如几何属性、距离关系、行列索引、跨视角变换）在视觉相似候选中识别目标；(2) Temporally extended task execution，即在时间约束和累积误差下完成多步执行；(3) Complexity-scalable embodied reasoning，即候选物体数量、action horizon 和环境多样性的增加会放大 grounding 和 planning 失败。解决这一问题能够为 VLA models 的空间推理、长时程规划和记忆能力提供精确的诊断工具，揭示当前系统的具体失败模式，从而指导更可靠、更可泛化的 embodied agent 的开发。\n\n### § 2 前人工作与不足\n\n这一问题此前未被系统性地解决。现有 robotic manipulation 数据集和 benchmark 在多个关键维度上存在缺口。首先，fine-grained spatial reasoning 几乎从未被显式评估。大规模数据集如 BC-Z、RT-1、BridgeData V2、Open X-Embodiment 和 DROID 的设计目标是扩大任务覆盖和 cross-embodiment 数据规模，其任务指令主要依赖类别或颜色等粗粒度语义线索来指定目标，而非通过细微空间关系进行消歧。这是因为这些数据集的构建动机是训练通用 policy 而非诊断推理能力，因此空间推理被隐含在任务成功率中而无法被单独定位。其次，long-horizon 和 step-level 评估仍然有限。LIBERO 和 RoboTwin 2.0 主要关注 short-horizon 任务，任务步骤少，无法测试累积误差下的执行能力；RoboCasa 和 MIKASA-Robo 虽涉及 long-horizon 任务，但仅报告 binary success rate，缺乏 step-level 诊断，无法区分模型是在哪个子任务阶段失败——是 target grounding 错误、low-level manipulation 失败、temporal ordering 错误还是 memory 丢失。第三，大多数先前 benchmark 缺乏受控的多级难度设计。Colosseum、SimplerEnv、RMBench 等工作虽然考察了 scene generalization 或 memory-dependent tasks，但没有系统性地将每个任务沿统一难度梯度实例化为多个级别，因此无法分析性能退化曲线，也无法区分模型是在何种复杂性阈值下开始失效。第四，数据集规模限制了推理评估的广度——大多数广泛使用的数据集包含少于 200K 轨迹，任务、embodiment 和场景覆盖不足。RoboSPA 通过将 fine-grained spatial reasoning 和 long-horizon procedural planning 设为核心评估维度、引入五级分层难度设计、提供 step-level 诊断指标（Object-Normalized Target Accuracy 和 Progress Score）、并跨五个 embodiment 收集 527K 轨迹，系统性地填补了这些缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n近年来，Vision-Language-Action (VLA) 模型在结构化、短horizon的指令跟随任务中取得了显著进展。然而，当研究者试图将这些模型部署到真实世界时，发现它们在处理日常复杂操作时往往表现不佳。从经验观察来看，真实世界的操作任务通常包含大量视觉相似的候选物体、需要多步且具有时序约束的执行过程，以及随着环境多样性增加而放大的grounding和planning失败。现有的robotic manipulation datasets和benchmarks（如LIBERO、RoboCasa等）大多只关注最终的成功率，缺乏对fine-grained spatial reasoning的显式评估，且在long-horizon任务中缺少step-level的诊断能力。此外，这些数据集通常没有受控的多级难度设计，使得研究者难以分析模型性能随任务复杂度增加而退化的原因。基于这些背景和失败模式，作者意识到，要推动VLA模型的发展，需要一个专门用于诊断embodied reasoning的benchmark。这个benchmark必须围绕两个核心维度构建：一是评估模型在复杂空间结构中grounding指令能力的Fine-Grained Spatial Reasoning，二是评估模型在多步决策中维持时序一致性和记忆能力的Long-Horizon Procedural Planning。为了系统地暴露模型的弱点，还需要引入多级难度设计和超越二元成功率的细粒度诊断指标，从而精确定位模型在target grounding、low-level execution或memory-based reasoning等环节的失效点。\n\n### § 4 核心 Intuition\n\n当前VLA模型在简单场景和短horizon任务中表现尚可，但在面对需要精细空间区分和长时序规划的真实复杂任务时极易崩溃，而现有的二元成功率评估无法揭示其具体的认知与执行瓶颈。RoboSPA的核心Intuition在于：通过构建具有受控多级难度的Fine-Grained Spatial Reasoning和Long-Horizon Procedural Planning任务，并引入step-level的诊断指标，可以系统性地将模型在空间grounding、低级执行和记忆规划上的失败解耦出来。这种从“评估任务是否完成”到“诊断推理在何处失效”的范式转变，正是暴露并推动解决当前VLA模型embodied reasoning能力不足的关键。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《RoboSPA: Can VLA Models Go Beyond Simple Scenes and Short-Horizon Tasks?》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出的核心研究问题是：当前 Vision-Language-Action (VLA) models 能否在空间复杂性和程序复杂性递增的条件下进行有效的 embodied reasoning？具体而言，论文聚焦两个维度——Fine-Grained Spatial Reasoning（在视觉相似候选物体中通过细微空间线索识别正确目标）和 Long-Horizon Procedural Planning（在时间约束和累积误差下执行多步操作任务），并系统考察 VLA models 的性能如何随任务难度增加而退化。这个问题的重要性在于：尽管 VLA models 在结构化、short-horizon 场景中已展现出令人鼓舞的表现，但真实世界部署要求 agent 具备超越简单指令跟随的能力。日常操作任务提出三个关键挑战：(1) Fine-grained target disambiguation，即需要通过超越类别或颜色的细微空间线索（如几何属性、距离关系、行列索引、跨视角变换）在视觉相似候选中识别目标；(2) Temporally extended task execution，即在时间约束和累积误差下完成多步执行；(3) Complexity-scalable embodied reasoning，即候选物体数量、action horizon 和环境多样性的增加会放大 grounding 和 planning 失败。解决这一问题能够为 VLA models 的空间推理、长时程规划和记忆能力提供精确的诊断工具，揭示当前系统的具体失败模式，从而指导更可靠、更可泛化的 embodied agent 的开发。 ### § 2 前人工作与不足 这一问题此前未被系统性地解决。现有 robotic manipulation 数据集和 benchmark 在多个关键维度上存在缺口。首先，fine-grained spatial reasoning 几乎从未被显式评估。大规模数据集如 BC-Z、RT-1、BridgeData V2、Open X-Embodi...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 近年来，Vision-Language-Action (VLA) 模型在结构化、短horizon的指令跟随任务中取得了显著进展。然而，当研究者试图将这些模型部署到真实世界时，发现它们在处理日常复杂操作时往往表现不佳。从经验观察来看，真实世界的操作任务通常包含大量视觉相似的候选物体、需要多步且具有时序约束的执行过程，以及随着环境多样性增加而放大的grounding和planning失败。现有的robotic manipulation datasets和benchmarks（如LIBERO、RoboCasa等）大多只关注最终的成功率，缺乏对fine-grained spatial reasoning的显式评估，且在long-horizon任务中缺少step-level的诊断能力。此外，这些数据集通常没有受控的多级难度设计，使得研究者难以分析模型性能随任务复杂度增加而退化的原因。基于这些背景和失败模式，作者意识到，要推动VLA模型的发展，需要一个专门用于诊断embodied reasoning的benchmark。这个benchmark必须围绕两个核心维度构建：一是评估模型在复杂空间结构中grounding指令能力的Fine-Grained Spatial Reasoning，二是评估模型在多步决策中维持时序一致性和记忆能力的Long-Horizon Procedural Planning。为了系统地暴露模型的弱点，还需要引入多级难度设计和超越二元成功率的细粒度诊断指标，从而精确定位模型在target grounding、low-level execution或memory-based reasoning等环节的失效点。 ### § 4 核心 Intuition 当前VLA模型在简单场景和短horizon任务中表现尚可，但在面对需要精细空间区分和长时序规划的真实复杂任务时极易崩溃，而现有的二元成功率评估无法揭示其具体的认知与执行瓶颈。RoboSPA的核心Intuition在于：通过构建具有受控多级难度的Fine-Grained Spatia... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **RoboSPA: Can VLA Models Go Beyond Simple Scenes and Short-Horizon Tasks?** **Zhenxuan Fan[1] , Bo Zhang[2] , Yutong Lin[1] , Yuqian Yuan[1] , Juekai Lin[1] , Liang Liang[1] Zhuoyi Huang[3]** , **Wenqiao Zhang[1]**[*] , **Juncheng Li[1]**[*] , **Siliang Tang[1]** , **Jun Xiao[1]** , **Yueting Zhuang[1]** 1Zhejiang University 2University of Electronic Science and Technology of China 3South China Normal University zxfan@zju.edu.cn wenqiaozhang@zju.edu.cn Project Page Code Data ## **Abstract** Vision-Language-Action (VLA) models have shown promising progress in languageconditioned robotic manipulation. However, existing datasets and benchmarks mainly evaluate task completion under predefined settings, offering limited insight into model reasoning under increasing spatial and procedural complexity. We introduce **RoboSPA** ( **Robo** t **S** patial- **P** rocedural **A** ssessment), a lar...", "additional_insights": "### § 8 Take-aways\nRoboSPA 通过引入 Fine-Grained Spatial Reasoning 和 Long-Horizon Procedural Planning 两个核心维度，并设置五个难度级别，填补了现有 VLA benchmarks 缺乏对复杂空间和长程任务进行系统性诊断的空白。当前最先进的 VLA models（如 $\\pi_{0.5}$ 和 X-VLA）在任务复杂度增加时表现出显著的性能退化，在最高难度下成功率均低于 25%，表明它们过度依赖简单的 object recognition 而非真正的 spatial reasoning。通过引入 $ONTA$ 和 $PS$ 等诊断指标，研究发现空间任务的主要失败源于 Target Grounding Error，而长程任务则受限于 Manipulation Error、Temporal Ordering Error 和 Memory Error。Memory-Intensive Planning (MIP) 是所有模型表现最差的类别，在较高难度下成功率降至 0%，凸显了当前 VLA 架构在跨扩展时间跨度维持 task-relevant memory 的根本性缺陷。\n\n### § 9 最脆弱的假设\n该论文最脆弱且失败代价最大的假设是：复杂的语言指令（如结合多方向计数的 Canonical Position Indexing 或 Cross-View Reasoning）能够被人类明确无误地解析并执行，因此模型在 L5 难度下的低成功率严格归因于 VLA 的推理局限性。如果这些由 GPT-5.2 生成的指令本身存在固有的语言歧义或过高的认知负荷，导致人类也难以在短时间内正确理解并执行，那么模型在最高难度下的 0% 成功率将无法证明 VLA 缺乏推理能力，只能说明任务定义超出了合理的语言可解性范围。论文虽然提到对指令进行了人工检查以确保语义受控，但并未提供 human baseline 数据来验证这些复杂指令的实际可解性，导致将所有失败归因于“模型缺乏 spatial reasoning”的结论缺乏绝对的基准支撑。\n\n### § 10 最小复现实验\n在一周时间内，可以通过评估现成的 Multimodal Large Language Model (MLLM)（如 GPT-4o 或 Qwen-VL）在 RoboSPA 空间任务图像上的单帧推理能力，来验证“VLA 的失败主要源于 Target Grounding Error 而非低级执行”这一核心 claim。具体而言，从 RoboSPA 的 Canonical Position Indexing (CPI) 任务中抽取 L1 和 L5 难度级别的场景图像各 100 张，并配对相应的语言指令。将这些图像和指令输入给 MLLM，要求其输出目标物体的 bounding box 或空间坐标，而非生成 robot actions。测量 MLLM 在 L1 与 L5 难度下正确识别目标物体的准确率。如果 MLLM 在 L5 上的目标识别准确率出现显著下降（与论文中 VLA 的 $ONTA$ 指标下降趋势一致），则支持了该 claim，证明失败确实源于 spatial reasoning 的认知局限；如果 MLLM 在 L5 上仍保持高准确率，则反驳了该 claim，表明 VLA 的失败可能更多源于将空间理解转化为低级动作的特定局限，而非空间推理本身。", "research_value": "### § 11 最强反例设计\n要对该论文进行最有力的攻击，我会在最高难度级别（L5）下设计一个“Human-in-the-Loop Teleoperation”与“Oracle Grounding”的对照实验，以挑战其关于“VLA 缺乏 spatial reasoning”的核心诊断结论。该反例的替代解释是：VLA 在 L5 下的崩溃并非完全源于模型自身的推理缺陷，而是由于任务指令超出了合理的语言可解性边界，且诊断指标混淆了认知负荷与底层控制不确定性。具体而言，招募人类操作员通过 teleoperation 在 RoboSPA 的 L5 Cross-View Reasoning 和 Memory-Intensive Planning (MIP) 任务中执行操作，并记录人类的认知负荷（NASA-TLX 问卷）与错误率。如果人类在 L5 下的反应时间剧增且错误率显著高于 L1，这证明任务指令本身存在固有的语言歧义或过高的认知超载，此时 VLA 的 0% 成功率便不能严格归因于模型架构的推理局限，而是任务定义脱离了合理的可解性范围。进一步地，构建一个“Oracle Grounding”的 VLA 变体，即在 L5 长程任务中，直接向模型输入完美无歧义的目标坐标以跳过 Target Grounding 阶段，仅评估其 low-level execution。如果该变体在 MIP 任务中仍然因为累积的 Manipulation Error 而失败，这便直接反驳了论文将长程任务失败主要归因于 Temporal Ordering Error 和 Memory Error 的结论，证明即使 grounding 完美，当前 VLA 的底层动作精度不足也会在多步任务中被指数级放大，从而掩盖了真正的 memory 缺陷。\n\n### § 12 Follow-up Research Idea\n当前 VLA 架构在 RoboSPA 的 Memory-Intensive Planning (MIP) 任务中暴露出成功率降至 0% 的根本性缺陷，这驱动了一个全新的研究方向：将 embodied reasoning 从“端到端隐空间压缩”重构为“Neurosymbolic Spatial-State Machine”。该想法的核心理念是，spatial reasoning 和 long-horizon memory 不应被强制塞入单一的 latent action policy 中，而应通过解耦的显式符号状态空间进行管理。借鉴 Cognitive Architecture（如 ACT-R）中的 Working Memory 模型与 NLP 领域的 Retrieval-Augmented Generation (RAG)，我们可以构建一个混合架构：一个轻量级的 MLLM 作为“感知-符号映射器”，在每个 critical step 将视觉场景转化为显式的 symbolic scene graph 并写入外部 episodic memory buffer；同时，VLA 模型退化为纯粹的 motor controller，其动作生成不仅依赖当前视觉输入，更受控于从 memory buffer 中检索出的 symbolic spatial constraints。第一个实验将聚焦于 RoboSPA 的 MIP 任务，对比 baseline VLA（如 $\\pi_{0.5}$）与提出的 Neurosymbolic VLA 架构。在 L4 和 L5 难度下，当任务要求跨长时间跨度维持目标空间关系时，观察显式 symbolic retrieval 机制是否能将成功率从 0% 提升至非平凡水平。这一提议根本不同于现有的“给 VLA 增加记忆模块”的增量做法，它主张将 spatial reasoning 从 action space 中完全剥离，使得 agent 的记忆是可解释、可编辑的符号状态，而非难以追溯的隐向量，从而为解决长时程空间推理提供全新的范式。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "{\n  \"authors\": [\n    {\"name\": \"Zhenxuan Fan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Bo Zhang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yutong Lin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuqian Yuan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Juekai Lin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Liang Liang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhuoyi Huang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Wenqiao Zhang\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Juncheng Li\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Siliang Tang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jun Xiao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yueting Zhuang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"ZJU\"},\n    {\"id\": 2, \"name\": \"UESTC\"},\n    {\"id\": 3, \"name\": \"SCNU\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author.\"}\n  ]\n}", "summary_translation": "Vision-Language-Action (VLA) models 在语言条件下的机器人操作中展现出了令人鼓舞的进展。然而，现有的 datasets 和 benchmarks 主要评估预定义设置下的任务完成情况，对于模型在不断增加的空间和程序复杂性下的推理能力提供的洞察有限。我们引入了 \\textbf{RoboSPA} (\\textbf{Robo}t \\textbf{S}patial-\\textbf{P}rocedural \\textbf{A}ssessment)，这是一个大规模的机器人操作 dataset 和 benchmark，用于诊断 VLA models 中的 embodied reasoning。\\texttt{RoboSPA} 专注于两个核心维度，Fine-Grained Spatial Reasoning 和 Long-Horizon Procedural Planning，涵盖 10 个任务类别和 56 个基础任务。每个任务在五个难度级别上进行实例化，产生了 280 个具有递增空间模糊性和程序复杂性的变体。我们跨多种 embodiments 和多样化场景收集了 527K 条 trajectories。除了 binary success rate 之外，\\texttt{RoboSPA} 还引入了 diagnostic metrics 以进行更详细的评估。在代表性 VLA models 上的实验表明，当前系统在处理复杂空间关系、精确的底层执行和 memory-intensive planning 方面仍然面临困难。这些结果将 \\texttt{RoboSPA} 确立为一个具有挑战性的 diagnostic benchmark，用于开发更强大、更可靠且更具泛化能力的 embodied agents。我们的数据和代码可在 https://github.com/fanzhenxuan/RoboSPA 获取。"}, {"title": "Linguistic Trajectory Encoding for Efficient Long-Horizon Spatial Memory in Embodied Agents", "arxiv_id": "2609.04802", "authors": "Tianyidan Xie, Shenyi Wang, Qiang Tang, Mingjie Wang, Zhicheng Qiu, Xuanfu Li, Zhan Xu, Jian Yang, Lanjun Wang, Zili Yi", "summary": "Embodied agents performing long-horizon tasks require a memory representation in which the state transitions of dynamic objects remain queryable in natural language across hours-to-days observation horizons. Existing systems either drop fine-grained motion (clip-level video-language embeddings), keep it only as raw coordinates (geometric SLAM), or organise it around immediate task context (agent working memories). None of them gives the agent a per-object timeline whose state transitions are themselves queryable in language. Our key contribution is \\textbf{Linguistic Trajectory Encoding} (LTE), which compresses dynamic object motion histories via a hybrid representation combining natural language descriptions, sparse spatial anchors, and visual anchors. LTE adapts compression to motion complexity by anchoring periods without reliable observations to the last seen location, while representing motion with geometric waypoints and linguistic descriptions to preserve accuracy. To evaluate these capabilities across extended time horizons, we construct the \\textbf{Spatial Memory Benchmark} (SMB) from EgoLife multi-day recordings, targeting capabilities absent in existing benchmarks: semantic trajectory retrieval and long-horizon object retrieval. On SMB, the LTE-based system achieves $45.3\\%$ success in semantic trajectory retrieval and $48.7\\%$ in long-horizon object retrieval, outperforming structured-memory and VLM baselines (best prior: $31.9\\%$ and $34.4\\%$). LTE achieves trajectory compression by factors of $8.7\\times$ to $26.1\\times$ with sub-second query latency on $24$\\,h video. On Ego4D natural-language queries, the system reaches $28.75\\%$ / $55.10\\%$ R@1/R@5, $+15.80$ / $+31.30$ pts over EgoVLPv2.", "category": "cs.AI", "cluster": "Embodied \u0026 Robotic Agents", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了一种名为 Linguistic Trajectory Encoding (LTE) 的新型记忆表示方法，专门用于解决具身智能体在长时间跨度任务中的空间记忆问题，并构建了相应的 Spatial Memory Benchmark (SMB) 进行评估。这直接对应了你的研究焦点中“单智能体：智能体的规划、记忆、工具使用、自我反思等”的“记忆”方向。论文明确以 Embodied Agents 和 Long-Horizon Memory 为研究对象，属于构建和评估 LLM 智能体能力的方法论与基准研究。虽然论文涉及视觉和视频数据处理，但多模态在此仅作为智能体感知环境的输入，研究的核心本质是智能体的记忆架构与检索机制，而非纯粹的多模态或视觉理解。因此，该论文符合你的研究范围。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的研究问题是：embodied agents 在执行跨越数小时至数天的 long-horizon tasks 时，如何构建一种 memory representation，使得 dynamic objects 的 state transitions 能够持续以 natural language 进行查询。这一问题至关重要，因为在真实的持久环境中，当用户询问“我最后把洗好的苹果放在哪里了？”时，agent 必须在长时程的观察历史中同时协同三种检索模式：通过语言命名的对象（“苹果”）、语义描述的状态变化（“洗过”）以及特定时刻的空间位置（“最后放在哪里”）。现有的记忆系统均无法同时满足这三种检索需求，导致 agent 无法在长时间跨度下准确回答涉及动态物体状态变化的复杂查询。解决这一问题能够赋予 embodied agents 跨天级别的长时程空间记忆能力，使其在辅助记忆障碍患者或作为个人生产力工具等实际应用中发挥核心价值。\n\n### § 2 前人工作与不足\n该问题之前并未得到有效解决，现有的 memory systems 各自只能处理部分检索模式而受限于此。Geometric SLAM 系统（如 Kimera 和 Khronos）虽然能随时间维持持久的 3D state，但暴露的接口不支持诸如“洗过”之类的 natural-language predicates，只能告知物体最终位置而无法判断其语义状态。Video-language models（如 EgoVLPv2 和 EgoVideo）能将自由文本与 clip-level features 匹配，但由于缺乏 3D index，“最后放在哪里”的查询会退化为缺乏空间剪枝的穷举时间扫描。Memory-augmented video agents（如 AMEGO 和 VideoAgent）将观察结果组织为 temporal events，但不维护 per-object trajectory，导致单个物体的历史被折叠进更广泛的事件中而丢失。Task-oriented agent memories（如 KARMA）虽能将语言与短时程 spatial state 连接，但记录仅围绕当前 task 组织，对于当前任务无关的偶然物体根本不会留下可查询的记录。这些方法存在不足的根本原因在于，它们在记录 dynamic objects 时，要么丢弃了细粒度运动，要么仅保留无语义内容的原始 3D 坐标，要么仅在任务相关时才进行总结。没有任何系统为 agent 提供一个 per-object timeline，且其 state transitions 本身可以用语言查询。这不仅是方法本身的限制或评测缺口，更是问题定义的缺失——前人未将“运动阶段的语言级抽象”视为连接几何 SLAM 和 video-language models 的关键中间层。", "core_insight": "### § 3 重建作者的思考路径\n\n在探索 embodied agents 的长周期空间记忆时，研究者面临一个根本矛盾：现有的记忆系统各自只能处理部分查询模式。Geometric SLAM（如 Kimera）虽然能维持持久的 3D 状态，但缺乏自然语言接口，无法查询诸如“洗过”这样的语义状态；Video-language models（如 EgoVLPv2）能匹配文本与视频片段特征，却因缺乏 3D 索引，使得空间查询退化为耗时的穷举扫描；Memory-augmented video agents（如 AMEGO）将观察组织为时间事件，但单个物体的历史被淹没在宏观事件中而丢失；Task-oriented agent memories 则仅围绕当前任务记录状态，非任务相关的物体根本不留痕迹。这些失败模式暴露了一个核心空白：没有任何系统能为 agent 提供一个 per-object timeline，且其 state transitions 可以用语言查询。从经验观察来看，许多物体的运动实际上可以用简洁的自然语言来概括（如“苹果从水槽移到台面”），这不仅能保留语义，还能维持可查询性。然而，纯文本会丧失几何查询所需的空间精度。结合已有的轨迹压缩技术（如 Douglas-Peucker 算法）和语义轨迹挖掘思路，作者意识到可以构建一种混合表示：将物体的运动阶段用语言描述，同时在轨迹转折处保留稀疏的 3D 位置 anchors，并辅以视觉裁剪用于身份验证。为了处理长时视频中的观测缺失，对于 tracking-gap intervals 直接锚定到最后观测位置；为了实现高效的空间查询，引入 octree 进行区域剪枝。这条路径自然导向了将语言、空间和视觉信息编织在一起的 per-object 轨迹编码方法。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 在于：物体的运动历史可以通过语言、稀疏 3D 坐标和视觉快照这三个互补通道进行混合压缩与索引。语言描述捕捉了语义状态（如“洗过”），3D anchors 回答了“在哪里”的空间查询，而视觉快照则验证了“是哪一个”的身份问题。这种混合表示不仅将长周期轨迹压缩了数十倍，还让 agent 能够通过单次语言匹配结合空间剪枝，直接定位特定物体的状态变化，从而避免了在数小时视频中穷举扫描的低效。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Linguistic Trajectory Encoding for Efficient Long-Horizon Spatial Memory in Embodied Agents》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出并解决的研究问题是：embodied agents 在执行跨越数小时至数天的 long-horizon tasks 时，如何构建一种 memory representation，使得 dynamic objects 的 state transitions 能够持续以 natural language 进行查询。这一问题至关重要，因为在真实的持久环境中，当用户询问“我最后把洗好的苹果放在哪里了？”时，agent 必须在长时程的观察历史中同时协同三种检索模式：通过语言命名的对象（“苹果”）、语义描述的状态变化（“洗过”）以及特定时刻的空间位置（“最后放在哪里”）。现有的记忆系统均无法同时满足这三种检索需求，导致 agent 无法在长时间跨度下准确回答涉及动态物体状态变化的复杂查询。解决这一问题能够赋予 embodied agents 跨天级别的长时程空间记忆能力，使其在辅助记忆障碍患者或作为个人生产力工具等实际应用中发挥核心价值。 ### § 2 前人工作与不足 该问题之前并未得到有效解决，现有的 memory systems 各自只能处理部分检索模式而受限于此。Geometric SLAM 系统（如 Kimera 和 Khronos）虽然能随时间维持持久的 3D state，但暴露的接口不支持诸如“洗过”之类的 natural-language predicates，只能告知物体最终位置而无法判断其语义状态。Video-language models（如 EgoVLPv2 和 EgoVideo）能将自由文本与 clip-level features 匹配，但由于缺乏 3D index，“最后放在哪里”的查询会退化为缺乏空间剪枝的穷举时间扫描。Memory-augmented video agents（如 AMEGO 和 VideoAgent）将观察结果组织为 temporal events，但不维护 per-object trajectory，导致单个物体的历史被折叠进更广泛的事件中而丢失。Task-oriented agent...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在探索 embodied agents 的长周期空间记忆时，研究者面临一个根本矛盾：现有的记忆系统各自只能处理部分查询模式。Geometric SLAM（如 Kimera）虽然能维持持久的 3D 状态，但缺乏自然语言接口，无法查询诸如“洗过”这样的语义状态；Video-language models（如 EgoVLPv2）能匹配文本与视频片段特征，却因缺乏 3D 索引，使得空间查询退化为耗时的穷举扫描；Memory-augmented video agents（如 AMEGO）将观察组织为时间事件，但单个物体的历史被淹没在宏观事件中而丢失；Task-oriented agent memories 则仅围绕当前任务记录状态，非任务相关的物体根本不留痕迹。这些失败模式暴露了一个核心空白：没有任何系统能为 agent 提供一个 per-object timeline，且其 state transitions 可以用语言查询。从经验观察来看，许多物体的运动实际上可以用简洁的自然语言来概括（如“苹果从水槽移到台面”），这不仅能保留语义，还能维持可查询性。然而，纯文本会丧失几何查询所需的空间精度。结合已有的轨迹压缩技术（如 Douglas-Peucker 算法）和语义轨迹挖掘思路，作者意识到可以构建一种混合表示：将物体的运动阶段用语言描述，同时在轨迹转折处保留稀疏的 3D 位置 anchors，并辅以视觉裁剪用于身份验证。为了处理长时视频中的观测缺失，对于 tracking-gap intervals 直接锚定到最后观测位置；为了实现高效的空间查询，引入 octree 进行区域剪枝。这条路径自然导向了将语言、空间和视觉信息编织在一起的 per-object 轨迹编码方法。 ### § 4 核心 Intuition 这篇论文的核心 Intuition 在于：物体的运动历史可以通过语言、稀疏 3D 坐标和视觉快照这三个互补通道进行混合压缩与索引。语言描述捕捉了语义状态（如“洗过”），3D anchors 回答了“在哪里”的空间查询，而视觉快照则验证了... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **Linguistic Trajectory Encoding for Efficient Long-Horizon Spatial Memory in Embodied Agents** **Xie Tianyidan[1,]** _[∗]_ **Shenyi Wang[1] Qiang Tang[2] Mingjie Wang[3] Zhicheng Qiu[4] Xuanfu Li[4] Zhan Xu[4] Jian Yang[1] Lanjun Wang[5] Zili Yi[1,*]** 1Nanjing University 2University of British Columbia 3Zhejiang Sci-Tech University 4Huawei Technologies Co., Ltd. 5Tianjin University ## **Abstract** Embodied agents performing long-horizon tasks require a memory representation in which the state transitions of dynamic objects remain queryable in natural language across hours-to-days observation horizons. Existing systems either drop fine-grained motion (clip-level video-language embeddings), keep it only as raw coordinates (geometric SLAM), or organise it around immediate task context (agent working memories). None of them gives the agent a per-object timeline whose state transitions ar...", "additional_insights": "### § 8 Take-aways\n\n论文提出 Linguistic Trajectory Encoding (LTE)，通过结合自然语言描述、稀疏 3D 空间锚点和视觉锚点，为每个动态物体构建可被自然语言查询的 timeline，填补了 geometric SLAM 缺乏语义与 video-language models 缺乏 3D 空间索引的空白。LTE 采用自适应压缩策略：在 tracking-gap 期间锚定最后已知位置，在运动期间利用 Douglas-Peucker 算法保留关键 waypoints，实现了 8.7× 到 26.1× 的轨迹压缩，使得 24 小时视频的查询延迟保持在亚秒级。论文构建了 Spatial Memory Benchmark (SMB)，基于 EgoLife 多日记录提出 Semantic Trajectory Retrieval (STR) 和 Long-Horizon Object Retrieval (LOR) 两个新任务，专门评估长周期空间记忆能力。实验表明，基于 LTE 的系统在 SMB 上大幅超越最强 VLM baseline（STR +13.4%，LOR +14.3%），并在 Ego4D NLQ 上取得最强 zero-shot 成绩（R@1 28.75%）。消融实验证实 LTE 的三个通道具有超加性效应，其中 text captions 对 STR 贡献最大，visual anchors 对 VQ2D 最关键，而 octree 空间索引则有效支撑了 LOR 任务。\n\n### § 9 最脆弱的假设\n\n最脆弱的假设是：上游的 object tracking（如 SAM3）能够在长周期、遮挡频繁的 egocentric 视频中保持稳定的 per-object identity，从而为 LTE 提供连续且准确的轨迹输入。如果这个假设不成立，即发生 ID switch 或 track loss，LTE 的核心价值将直接失效：错误关联的 captions、spatial anchors 和 visual anchors 会彻底破坏 per-object timeline 的语义一致性，导致语义检索和空间定位同时失败。在实际环境中，物体频繁进出视野、外观相似的物体相互靠近、以及长时间的无观测间隔，极易导致多目标跟踪算法发生身份切换或丢失重关联失败。论文自身的 Error Analysis（Appendix E）也承认，tracking failure 是最大的错误来源（占 STR 错误的 34%，LOR 的 28%），且论文目前缺乏自动化的语义纠错机制来修复这些上游错误，仅将其作为 future direction 提及，这构成了系统性能提升的硬性瓶颈。\n\n### § 10 最小复现实验\n\n在 1 周时间内，可以设计一个最小复现实验来验证 LTE 的混合表示在语义检索上优于 clip-level VLM 这一核心 claim。**数据**：从 Ego4D NLQ 验证集中筛选 50 个涉及明确物体状态变化（如“洗过的苹果”）的 query 及其对应的短视频片段（约 5-10 分钟）。**实现**：构建一个简化版 LTE pipeline。使用 Grounding-DINO 进行 object detection 并提取 bounding box 作为 spatial/visual anchors；将连续的 bounding box 序列作为轨迹，用 Qwen-VL 为每个物体的运动片段生成 text captions。检索时，通过 text embedding 匹配 query 中的状态描述，并结合 visual anchor 的 CLIP embedding 进行验证。Baseline 则直接使用 Qwen-VL 对视频进行 3 秒滑窗的 clip-level 检索。**测量**：计算两种方法在 IoU=0.3 阈值下的 R@1 和 R@5。**结果判定**：如果简化版 LTE 的 R@1 显著高于 clip-level VLM baseline（例如提升超过 5 个百分点），则支持论文关于 per-object linguistic timeline 具备优势的 claim；如果两者表现相当或 LTE 因 tracking 噪声而更差，则反驳了其核心贡献的有效性。", "research_value": "### § 11 最强反例设计\n如果我反对这篇论文，我会设计一个“同质物体高频交互”的真实世界场景作为最强反例，直接攻击其最脆弱的 per-object tracking 假设。在真实的厨房或多人口家庭环境中，经常出现多个外观高度相似的同类物体（例如六个相同的红苹果、一堆白瓷杯）被不同人频繁交替使用、清洗和放回。在这种场景下，任何上游的 object tracking 算法都必然会发生大规模的 ID switch 或 track loss。LTE 的脆弱性在于，一旦发生 ID switch，不仅 spatial anchor 会发生空间跳跃，更致命的是 text captions 会被错误地附加到不相关的轨迹上，导致语义层面的不可逆污染。例如，苹果A的“被洗过”caption被错误嫁接到苹果B的轨迹上，当用户查询“洗过的苹果在哪”时，系统会自信地返回一个实际未洗过且位置错误的苹果。为了提供具体的替代解释，我们可以设计一个对照实验：剥离 LTE 中的 text captions 通道，仅保留 spatial anchors 和 visual anchors，并引入一个简单的基于规则的时空过滤。如果在 Spatial Memory Benchmark (SMB) 上的性能下降幅度极小，这就证明 LTE 的核心优势并非来自“linguistic trajectory”本身，而是仅仅因为 octree spatial indexing 提供了强大的空间剪枝能力，将 VLM 的搜索空间缩小到了关键区域。这直接挑战了论文将“运动阶段的语言级抽象”视为关键中间层的核心 claim，表明在 tracking 不可靠的开放世界中，强行将语义绑定到脆弱的几何轨迹上反而会引入比纯视觉特征更严重的系统性偏差。\n\n### § 12 Follow-up Research Idea\n基于 LTE 对确定性 per-object identity 的过度依赖这一核心局限，我提出一个 novel research idea：构建“Identity-Agnostic Spatio-Semantic Belief Space”（身份无关的时空语义信念空间）。这一想法的驱动力在于，在真实的 long-horizon egocentric 观测中，物体的 identity 本质上是碎片化和概率性的，强行维持连续的 per-object timeline 必然导致级联错误，我们需要一种在 identity 混淆下仍能回答状态查询的机制。我们可以借鉴 Probabilistic Robotics 中的 occupancy grid mapping 和 Bayesian filtering 思想，结合 object-centric learning 中的 slot attention 机制。不再为单个物体维护确定性的 timeline，而是将环境建模为一个随时间演变的连续 semantic-spatial potential field。当物体离开视野时，其 semantic state 和 spatial location 的联合分布会随时间扩散；当外观相似的物体重新出现时，系统不强制进行硬性的 ID 关联，而是通过 particle filter 更新整个 belief space 的概率分布。查询“洗过的苹果在哪”时，系统通过 approximate Bayesian inference 在整个空间中检索 semantic state 符合“洗过”且 spatial transition 符合物理合理性的最高概率区域，而非依赖单一物体的轨迹历史。第一个实验将构建一个合成的长时程 3D 交互环境，其中大量同质物体频繁进出视野并发生状态变化，故意切断 ground truth identity 的连续性。我们将比较 LTE 在 ID switch 率逐渐升高时的性能断崖式下跌曲线，与 Belief Space 方法在相同条件下的 graceful degradation 表现，以此证明在 identity 不可靠的开放世界中，概率性的场表示优于确定性的轨迹表示。这与现有的 geometric SLAM 或 video-language models 均有本质区别，因为它放弃了硬性的 object identity 假设，转而在分布层面统一空间与语义的记忆与检索。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:gl
