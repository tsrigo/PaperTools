<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperTools - 学术论文集合</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Marked.js 用于 Markdown 渲染 -->
    <script src="assets/marked-15.0.12.min.js"></script>
    <!-- KaTeX 仅在已展开的 Markdown 段落中渲染公式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <style>
        /* 微软雅黑字体 */
        body {
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        body::-webkit-scrollbar {
            display: none;
        }

        /* 移动端优化 */
        @media (max-width: 640px) {
            body {
                font-size: 14px;
            }

            /* 改善可点击区域 */
            button, a {
                min-height: 44px;
                min-width: 44px;
            }

            /* 优化间距 */
            .container {
                padding-left: 12px !important;
                padding-right: 12px !important;
            }
        }

        /* 星标样式 */
        .star-button {
            transition: color 0.2s ease-in-out;
        }
        .star-button.starred {
            color: #fbbf24;
        }
        .star-button:not(.starred) {
            color: #9ca3af;
        }
        .star-button:hover {
            color: #fbbf24;
        }
        /* 删除按钮样式 */
        .delete-button {
            transition: all 0.2s ease-in-out;
        }
        .delete-button:hover {
            color: #ef4444;
            transform: scale(1.1);
        }
        /* 论文项目样式 */
        .paper-item {
            transition: opacity 0.2s ease-out, transform 0.2s ease-out;
            content-visibility: auto;
            contain-intrinsic-block-size: auto 240px;
        }
        .paper-item.hidden-paper {
            opacity: 0.3;
            transform: scale(0.98);
        }
        /* 平滑过渡 */
        .rotate-90-transition {
            transition: transform 0.2s ease-in-out;
        }

        /* 论文卡片展开/收起 */
        .paper-expand-hint {
            padding: 4px 0;
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .paper-expand-hint:hover {
            color: #2563eb;
        }
        .dark .paper-expand-hint:hover {
            color: #60a5fa;
        }
        .paper-expand-hint .expand-arrow {
            display: inline-block;
            transition: transform 0.2s;
            font-size: 0.65rem;
            margin-right: 4px;
        }
        .paper-detail {
            border-top: 1px solid #e2e8f0;
            margin-top: 8px;
            padding-top: 8px;
        }
        .dark .paper-detail {
            border-top-color: #334155;
        }
        .paper-detail.hidden {
            display: none;
        }

        /* 可折叠部分样式 */
        .collapsible-header {
            cursor: pointer;
            display: flex;
            align-items: center;
            font-weight: 600;
            padding: 8px 0;
            user-select: none;
            color: #1e40af;
            transition: color 0.15s ease-out, opacity 0.15s ease-out;
        }
        .dark .collapsible-header {
            color: #60a5fa;
        }
        .collapsible-header:hover {
            opacity: 0.8;
        }
        .collapsible-header::before {
            content: "▶";
            margin-right: 8px;
            transition: transform 0.3s ease;
            font-size: 0.8em;
        }
        .collapsible-header.open::before {
            transform: rotate(90deg);
        }
        .collapsible-content {
            display: none;
        }
        .collapsible-content.open {
            display: block;
        }
        .collapsible-content .inner {
            padding-top: 8px;
        }

        @media (prefers-reduced-motion: reduce) {
            .paper-item,
            .collapsible-header,
            .collapsible-header::before,
            .paper-expand-hint .expand-arrow {
                transition: none;
            }
        }

        /* Markdown 内容样式 */
        .markdown-content {
            line-height: 1.6;
        }
        .markdown-content h1 {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 1em;
            margin-bottom: 0.5em;
            color: #1e40af;
        }
        .dark .markdown-content h1 {
            color: #60a5fa;
        }
        .markdown-content h2 {
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 0.8em;
            margin-bottom: 0.4em;
            color: #1e40af;
        }
        .dark .markdown-content h2 {
            color: #60a5fa;
        }
        .markdown-content h3 {
            font-size: 1.1em;
            font-weight: bold;
            margin-top: 0.6em;
            margin-bottom: 0.3em;
            color: #1e40af;
        }
        .dark .markdown-content h3 {
            color: #60a5fa;
        }
        .markdown-content h4 {
            font-size: 1em;
            font-weight: bold;
            margin-top: 0.5em;
            margin-bottom: 0.25em;
            color: #2563eb;
        }
        .dark .markdown-content h4 {
            color: #93c5fd;
        }
        .markdown-content p {
            margin-bottom: 0.8em;
        }
        .markdown-content ul, .markdown-content ol {
            margin-left: 1.5em;
            margin-bottom: 0.8em;
        }
        .markdown-content ul {
            list-style-type: disc;
        }
        .markdown-content ol {
            list-style-type: decimal;
        }
        .markdown-content li {
            margin-bottom: 0.3em;
        }
        .markdown-content code {
            background-color: #f1f5f9;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
        }
        .dark .markdown-content code {
            background-color: #334155;
        }
        .markdown-content pre {
            background-color: #f1f5f9;
            padding: 1em;
            border-radius: 5px;
            overflow-x: auto;
            margin-bottom: 0.8em;
        }
        .dark .markdown-content pre {
            background-color: #334155;
        }
        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
        }
        .markdown-content blockquote {
            border-left: 3px solid #cbd5e1;
            padding-left: 1em;
            margin-left: 0;
            margin-bottom: 0.8em;
            color: #64748b;
        }
        .dark .markdown-content blockquote {
            border-left-color: #475569;
            color: #94a3b8;
        }
        .markdown-content strong {
            font-weight: 600;
        }
        .markdown-content em {
            font-style: italic;
        }

        /* Tag filter button styles */
        .tag-btn {
            padding: 4px 14px;
            font-size: 0.875rem;
            border-radius: 9999px;
            border: 1px solid #cbd5e1;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .tag-btn:hover { border-color: #3b82f6; color: #3b82f6; }
        .tag-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .dark .tag-btn { border-color: #475569; color: #94a3b8; }
        .dark .tag-btn:hover { border-color: #60a5fa; color: #60a5fa; }
        .dark .tag-btn.active { background: #2563eb; color: white; border-color: #2563eb; }

        /* Tag badge styles */
        .tag-badge {
            display: inline-block;
            padding: 1px 6px;
            font-size: 0.7rem;
            border-radius: 9999px;
            background: #dbeafe;
            color: #1e40af;
            margin-right: 4px;
        }
        .tag-badge.tag-arxiv {
            background: #e0f2fe;
            color: #0369a1;
        }
        .dark .tag-badge { background: #1e3a5f; color: #7dd3fc; }
        .dark .tag-badge.tag-arxiv { background: #164e63; color: #67e8f9; }

        /* 作者机构上标样式 */
        .author-aff {
            vertical-align: super;
            font-size: 0.65em;
            color: #3b82f6;
            margin-left: 1px;
        }
        .dark .author-aff {
            color: #60a5fa;
        }

        /* 桌面端正文使用移除右栏后释放的宽度，同时避开左侧目录。 */
        #content-column {
            width: 100%;
        }
        @media (min-width: 1024px) {
            #content-column {
                width: min(1024px, calc(100% - 260px));
                margin-left: max(240px, calc((100% - 1024px) / 2));
                margin-right: auto;
            }
        }

        /* TOC 侧边栏样式 - 固定在左侧 */
        #toc-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            z-index: 35;
            background: white;
            border-right: 1px solid #e2e8f0;
            transition: transform 0.3s ease;
            overflow: hidden;
        }
        .dark #toc-sidebar {
            background: #1e293b;
            border-right-color: #334155;
        }
        #toc-sidebar.collapsed {
            transform: translateX(-100%);
        }
        #toc-inner {
            padding: 1rem 0.5rem;
            height: 100%;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        #toc-inner::-webkit-scrollbar {
            width: 4px;
        }
        #toc-inner::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 2px;
        }
        .dark #toc-inner::-webkit-scrollbar-thumb {
            background: #475569;
        }
        .toc-date {
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toc-date:hover {
            background: #e2e8f0;
        }
        .dark .toc-date:hover {
            background: #334155;
        }
        .toc-date.active {
            background: #dbeafe;
            color: #1e40af;
        }
        .dark .toc-date.active {
            background: #1e3a5f;
            color: #93c5fd;
        }
        .toc-date-arrow {
            transition: transform 0.2s;
            font-size: 0.65rem;
        }
        .toc-date-arrow.open {
            transform: rotate(90deg);
        }
        .toc-papers {
            display: none;
            padding-left: 1.2rem;
        }
        .toc-papers.open {
            display: block;
        }
        .toc-paper {
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 3px;
            font-size: 0.8rem;
            line-height: 1.35;
            color: #64748b;
            transition: background 0.15s, color 0.15s;
            display: block;
            white-space: normal;
            overflow-wrap: anywhere;
            max-width: 100%;
        }
        .toc-paper:hover {
            background: #f1f5f9;
            color: #1e40af;
        }
        .dark .toc-paper {
            color: #94a3b8;
        }
        .dark .toc-paper:hover {
            background: #1e293b;
            color: #93c5fd;
        }
        .toc-paper.active {
            background: #eff6ff;
            color: #1d4ed8;
            font-weight: 500;
        }
        .dark .toc-paper.active {
            background: #1e3a5f;
            color: #93c5fd;
        }
        .toc-expand-all {
            width: calc(100% - 8px);
            margin: 5px 4px 6px;
            padding: 5px 8px;
            border: 1px solid #bfdbfe;
            border-radius: 5px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .toc-expand-all:hover {
            background: #dbeafe;
            border-color: #93c5fd;
        }
        .dark .toc-expand-all {
            background: rgba(30, 58, 95, 0.55);
            border-color: #1e40af;
            color: #93c5fd;
        }
        .dark .toc-expand-all:hover {
            background: #1e3a5f;
        }
        /* TOC 切换按钮 - 左侧 */
        #toc-toggle {
            position: fixed;
            left: 220px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 40;
            width: 28px;
            height: 56px;
            border-radius: 0 6px 6px 0;
            background: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 0 8px rgba(0,0,0,0.15);
            transition: left 0.3s ease, background 0.2s;
        }
        #toc-toggle:hover {
            background: #2563eb;
        }
        #toc-toggle svg {
            transition: transform 0.3s;
        }
        #toc-toggle:not(.sidebar-open) {
            left: 0;
        }
        @media (max-width: 1023px) {
            #toc-sidebar {
                width: 240px;
            }
            #toc-toggle {
                left: 240px;
            }
            #toc-toggle:not(.sidebar-open) {
                left: 0;
            }
        }
        @media (max-width: 767px) {
            #toc-sidebar {
                width: 260px;
                box-shadow: 4px 0 16px rgba(0,0,0,0.1);
            }
            #toc-toggle {
                left: 260px;
            }
            #toc-toggle:not(.sidebar-open) {
                left: 0;
            }
        }

    </style>
    <script>
        // Tailwind CSS 暗色模式配置
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 font-sans text-slate-800 dark:text-slate-200">

            <span id="toast-message" class="text-sm sm:text-base">已删除</span>

    <!-- TOC 切换按钮 -->
    <button id="toc-toggle" class="hidden lg:flex sidebar-open" onclick="toggleTocSidebar()" title="切换目录">

    <div class="flex mx-auto max-w-none">

    <div id="content-column" class="p-3 sm:p-4 lg:p-6">

        <header class="mb-4 sm:mb-6">

                    </button>

                    </button>

                    <button id="summary-toggle" class="px-2.5 py-1.5 sm:px-3 sm:py-2 text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 rounded-md hover:bg-slate-200 dark:hover:bg-slate-600 focus:outline-none transition-colors whitespace-nowrap">

        </header>

        <!-- 主要内容区域 -->
        <main class="space-y-6 sm:space-y-8" id="main-content">

    <!-- 左侧 TOC 侧边栏（固定定位） -->

        <div id="toc-inner">
            <div class="flex items-center justify-between mb-2 px-2">
                <span class="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">目录</span>

    <script>
        const allPapers = {"2026-09-21": [{"name": "Agent Environments \u0026 Benchmarks", "count": 4, "papers": [{"title": "RecreationWorld: Scalable and Verifiable Environments for Hybrid Computer-Use Agents", "arxiv_id": "2609.22000", "authors": "Shuai Bai, Jiayong Deng, Yikun Fu, Chang Gao, Xuhao Hu, Mianqiu Huang, Yizhen Jiang, Yuheng Jing, Dehui Kong, Keliang Li, Ning Li, Wanli Li, Dayiheng Liu, Dunjie Lu, Changwei Luo, Que Shen, Zheyuan Wang, Zijian Wang, Jie Wu, Gao Wu, Zhihui Xie, Rui Xie, Haiyang Xu, An Yang, Jiakang Yuan, Yanming Zhang, Jiajun Zhang, Xi Zhang, Zhenru Zhang, Zhuo Zhen, Mingkang Zhu, Bowen Zhou", "summary": "Computer-use agents (CUAs) have advanced along two separate lines: graphical interaction and software development through code and the command line. Real digital work requires both, interleaved rather than stacked end to end. We study hybrid CUAs that autonomously decide when to explore an interface, implement software, and run and visually verify their artifacts. We introduce RecreationWorld, a five-platform framework built around recreation: given a running reference, an agent must discover its behavior and build a faithful implementation with no prescribed workflow. RecreationWorld provides reproducible environments on Ubuntu, macOS, Windows, Android, and Web, plus a unified harness with native GUI control and coding tools. The running reference serves as an oracle for hidden behavioral tests, providing execution-grounded rewards. We scale trajectory generation with high-quality open-source applications. Models trained on these trajectories improve across five out-of-distribution coding and hybrid computer-use benchmarks and more frequently verify their rendered outputs, providing evidence of transfer beyond recreation. For held-out evaluation, we introduce RecreationBench, comprising 250 diverse tasks across domains and platforms. Reference-grounded programmatic and visual assertions cover action-conditioned outcomes at multiple interaction depths; each is validated on the reference and by human reviewers before the suite is frozen for automatic scoring. GPT-6 Astra leads at 58.1% overall, but passes all programmatic tests on just 2.8% of tasks. Agents reproduce static interface structure more reliably than interactions and computed outputs, while generated applications remain smaller and more monolithic than their references. We release the benchmark, environments, and test suites.", "category": "cs.CL", "cluster": "Agent Environments \u0026 Benchmarks", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是提出了 RecreationWorld，一个用于混合计算机使用智能体的可扩展和可验证环境，并在此基础上进行了智能体训练和评估。论文明确以 Hybrid Computer-Use Agents 为研究对象，探讨了智能体在没有预设工作流的情况下，如何自主决定何时探索界面、实现软件并视觉验证其产物。这直接涉及智能体的规划、工具使用和长期决策能力。\n\n根据筛选标准第一步，论文研究对象明确是 LLM Agents / Tool-Use Agents，并且提出了统一的 harness（包含原生 GUI 控制和编码工具）。更重要的是，论文提到“Models trained on these trajectories improve across five out-of-distribution coding and hybrid computer-use benchmarks and more frequently verify their rendered outputs”，这表明研究不仅提供了评估基准，还涉及通过轨迹和环境反馈进行 agent training/distillation，从而改进智能体能力并实现跨域迁移。这完全符合“保留”规则中关于 agent harness/runtime 以及 agent training 的相关条款。\n\n此外，根据重要校准规则，不应仅因为论文是 benchmark、evaluation 或 training 就排除。只要明确围绕 LLM Agents 展开，就应保留。论文虽然涉及视觉验证，但这是 Computer-Use Agent 感知和交互环境的工具，而非纯粹的多模态视觉研究。因此，该论文与构建、改进、评估和训练 LLM 智能体的研究焦点高度契合。", "intro_logic": "### § 1 研究问题与重要性\n\n论文研究混合计算机使用代理（hybrid CUAs）的培养与评测。现有代理要么只通过图形界面操作应用，要么只通过代码和命令行构建软件，两者割裂；而真实数字工作需要代理在同一长时程中交替探索界面、实现代码并视觉验证结果，而非将两种能力简单首尾串联。论文提出 RECREATIONWORLD 框架，以\"应用重建\"为核心任务：给定运行中的参考应用，代理须自主发现其行为并构建忠实实现，在 Ubuntu、macOS、Windows、Android 和 Web 五个平台上提供可复现环境与客观的执行验证奖励。该问题重要，因为混合循环是自我奠基的——代理构建的产物可运行、可检查，每次循环产生可量化的执行反馈，既支持轨迹内自我修正，也可跨训练改进代理，是自我提升的有前景基础。\n\n### § 2 前人工作与不足\n\n最相关的是两类基准。OSWorld 2.0 和 AndroidWorld 评测代理操作桌面或移动应用，但只记录计算机工具调用，没有可单独观测的代码编辑调用，无法测量代理如何协调界面操作与软件构建。ProgramBench 时程更长但完全没有 GUI 调用，只测试代码重建能力。WeaveBench 虽同时使用 GUI 和命令行，但轨迹中位数仅 178 次调用、每百次仅 1.56 次 GUI–代码切换，远低于 RECREATIONBENCH 的 282.5 次和 9.08 次，切换深度不足以充分锻炼长时程混合循环。这些基准各自强调单一交互模式或切换频率过低，根源在于它们将界面操作与软件构建视为可分离的独立技能，而非需要信息在观察与实现之间反复流动的融合能力，导致代理自主协调探索–实现–验证循环的能力长期未被充分测量。", "core_insight": "### § 3 重建作者的思考路径\n\n作者可能从 GUI agent 与 terminal agent 各自为政、但真实软件任务需要两者交替这一矛盾出发。已有的自我改进理论指出，能自动验证的任务适合规模化训练，而现有基准如 OSWorld 或 ProgramBench 只测单一交互模式，无法衡量两者协调。一个自然的推断是：设计一个任务，其规范只能通过操作界面获得，交付物却必须是可运行代码——\"重建\"恰好满足此约束。同时开源应用源源不断，运行中的参考应用本身可作为 oracle 自动生成行为测试，同时解决任务来源和验证信号两个瓶颈。\n\n### § 4 核心直觉\n\n重建任务天然强制智能体在\"探索界面—编写代码—运行验证\"之间反复切换，单靠点击或单靠编码都无法完成。运行中的参考应用既是唯一的行为规范，也是自动生成隐藏测试的 oracle，使能力既可客观评分又可规模化训练。这个以参考应用为锚的设计让验证信号不依赖人工标注，是先前方法无法奏效而此方法可行的关键。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n      RECREATIONWORLD 方法流程\n\n  输入: 运行参考应用 A* + 任务提示 + 环境\n              │\n              ▼\n  ┌── 混合智能体: explore-implement-verify ──┐\n  │                                          │\n  │   探索GUI → 写代码 → 构建运行             │\n  │      ↑               │                   │\n  │      └── 视觉/行为验证 ←┘                │\n  │          (对比参考与候选)                 │\n  └──────────────────────────────────────────┘\n              │\n              ▼\n  输出: 源码 S → 候选应用 A_c\n              │\n              ▼\n  隐藏评估: Prog断言 + VLM视觉断言 → 评分\n              │\n              ▼\n  高分轨迹 → 拒绝采样 → SFT训练 (35k轨迹)\n```\n\n**任务输入**：智能体收到任务提示、运行参考应用 A* 的交互访问权，以及同时含 GUI 控制和开发工具的环境（§2.1）。桌面和 Android 上参考源码被隐藏，智能体只能通过操作界面发现行为。\n\n**探索-实现-验证循环**：智能体自主在三种操作间切换——通过截图和点击探索参考界面、编写候选源码、构建运行候选应用并与参考做视觉比对。循环无预设顺序，观察指导实现，运行结果又产生新的观察目标（§2.2）。轨迹中位数为 282.5 次工具调用，GUI 与代码编辑切换频率为每 100 次调用 9.08 次。\n\n**候选提交**：返回的源码 S 需满足平台交付契约——桌面为源码加构建入口，Android 为 Gradle→APK，Web 为自包含 index.html。构建产生候选应用 A_c，仅评估可观察行为，不要求架构一致（§2.1, §4.1）。\n\n**隐藏评估**：冻结测试套件在干净环境中回放。程序化断言（Prog）通过各平台原生自动化接口读取控件状态和计算值；视觉断言（VLM）配对候选截图与自然语言描述，由 Qwen3.7-Plus 判官给出二元判定（§4.4）。每个断言冻结前须在参考上通过并经人工审核（§4.3）。\n\n**训练数据生成**：在可扩展虚拟机池上并发执行 rollout（每轮 20 小时），用行为验证器做拒绝采样，五平台各取 7,000 条高分轨迹组成 35,000 条 SFT 混合集，微调 Qwen3.7-Plus 和 Qwen-Flash-CPT 两个初始化（§3.1）。\n\n### § 7 实验设计与结论\n\n**问题一：recreation 训练能否迁移到训练环境之外？** 在 35,000 条 recreation 轨迹上训练两个模型，然后在五个分布外基准上评测。两个运行在全部五个基准上均超过首个检查点，增益最高 17.9 个百分点，且轨迹中代码验证和 GUI 交互频率上升（§3.2）。这初步证明 recreation 监督能迁移到更广泛的编码和混合计算机使用能力。\n\n**问题二：前沿模型在 recreation 上表现如何？** 在 RECREATIONBENCH 的 250 个任务上评测十个前沿模型。GPT-6 Astra 以 58.1% 总分领先，但仅在 2.8% 的任务上通过全部程序化测试（§5.1）。智能体重现静态界面结构远比交互和计算输出可靠，生成的应用也普遍比参考更小更集中（§6.2, §6.3）。\n\n**问题三：智能体是否真正完成了混合验证循环？** 轨迹行为分析显示，最终源码修改后重新启动并检查候选的轨迹不超过 47.5%，大多数轨迹在末次编辑后未完成验证闭环（§6.1.1），揭示了自我验证环节的具体短板。", "additional_insights": "### § 8 阅读收获\n\n论文提出 hybrid CUAs 的核心价值在于自验证循环：agent 构建可运行产物后能直接执行并视觉检查，产生客观反馈用于自我纠错。Recreation 任务天然触发 explore–implement–verify 循环，且运行中的参考应用可作为 oracle 自动生成行为测试，使任务构建和验证都可扩展。训练证据显示，在 35,000 条 recreation 轨迹上微调的两个模型在 5 个分布外基准上均有提升（最多 17.9 个百分点），且 agent 更频繁地检查自身渲染输出。但当前模型复现静态界面结构的能力远强于复现交互行为和计算输出，GPT-6 Astra 虽以 58.1% 领先，仅 2.8% 的任务通过全部程序化测试。\n\n### § 9 最脆弱的假设\n\n最关键的假设是 recreation 训练带来的分布外提升源于 recreation 特有的能力培养，而非单纯的 SFT 数据量增加。论文仅用两个模型初始化、无对照组（如等量非 recreation 代码轨迹的 SFT），无法排除\"任何高质量 agentic 轨迹都能带来类似提升\"的替代解释。如果这个假设不成立，recreation 作为训练范式的独特价值就被削弱为\"又一种生成 SFT 数据的方式\"。论文缺少消融实验来隔离 recreation 轨迹的特殊贡献，也缺少与其他类型训练数据的对比，这是证据链中最薄弱的环节。\n\n### § 10 最小复现实验\n\n在 Web 平台上选取 15–20 个开源静态网站作为参考，用一个现有前沿模型执行 recreation 任务，收集轨迹并按论文方法评测。重点测量两点：一是轨迹中 GUI 操作与代码编辑的交替频率，验证 recreation 是否触发 hybrid 行为；二是程序化测试中静态结构类与交互行为类的通过率差距。如果交替频率显著高于纯编码任务，且静态结构通过率比交互行为高出 10 个百分点以上，则支持论文的核心观察；反之则质疑 recreation 任务的独特性。此方案保留了 recreation 任务的核心机制，省去了多平台基础设施和模型训练。", "research_value": "### § 11 最强反例设计\n\nrecreation 任务要求从头重建完整应用，但真实数字工作中 agent 更常面对增量修改：在现有代码库中定位问题、局部修改并验证。两种任务的轨迹模式截然不同——recreation 是\"从零构建全局结构\"，增量修改是\"在已有结构中局部定位-修改-验证\"。如果构造一个增量修改基准，给定有 bug 的运行应用并要求修复后视觉验证，recreation 训练的模型可能不如在等量增量修复轨迹上训练的模型，因为从头重建的轨迹模式不匹配增量修改所需的能力。此反例不否认 recreation 训练有效，而是挑战其生态效度：即使混合循环被训练到，其轨迹模式可能不迁移到真实工作中更常见的场景，分布外基准上的提升可能来自与混合循环无关的通用编码能力增强。\n\n### § 12 后续研究设想\n\n论文承认超过 52.5% 的轨迹未完成验证闭环——末次代码编辑后未重新启动检查候选应用。由此提出问题：验证闭环是否是 recreation 训练中真正起作用的成分？将 35,000 条轨迹按是否完成验证闭环分为两组，分别训练相同初始化模型，在五个分布外基准上评测。若闭环组在需要交互验证的任务上显著优于未闭环组，说明自我验证是关键成分，训练数据筛选应优先保留闭环轨迹；若两组无差异，则需另寻有效成分。此实验隔离 recreation 内部具体成分的贡献，与比较 recreation 与非 recreation 数据的外部消融互补，能更精确地定位训练增益的来源。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Shuai Bai\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiayong Deng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yikun Fu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Chang Gao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xuhao Hu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Mianqiu Huang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yizhen Jiang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuheng Jing\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Dehui Kong\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Keliang Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ning Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Wanli Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Dayiheng Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Dunjie Lu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Changwei Luo\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Que Shen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zheyuan Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zijian Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jie Wu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Gao Wu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhihui Xie\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Rui Xie\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Haiyang Xu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"An Yang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiakang Yuan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yanming Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiajun Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xi Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhenru Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhuo Zhen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Mingkang Zhu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Bowen Zhou\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Alibaba Token Hub, Alibaba Group\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "计算机使用智能体（CUAs）沿着两条独立的路线发展：图形交互以及通过代码和命令行进行软件开发。真实的数字工作需要两者交替进行，而非端到端堆叠。我们研究了混合型计算机使用智能体，它们能够自主决定何时探索界面、实现软件，以及运行并视觉验证其生成的产物。我们引入了 RecreationWorld，这是一个围绕“复现”构建的五平台框架：给定一个运行中的参考程序，智能体必须发现其行为，并在没有预设工作流的情况下构建忠实的实现。RecreationWorld 在 Ubuntu、macOS、Windows、Android 和 Web 上提供可复现的环境，外加一个配备原生图形用户界面控制和编码工具的统一运行框架（harness）。运行中的参考程序作为隐藏行为测试的判别器（oracle），提供基于执行的奖励。我们利用高质量开源应用扩展了轨迹生成规模。在这些轨迹上训练的模型在五个分布外编码和混合计算机使用评测基准上均有所提升，并且更频繁地验证其渲染输出，这提供了超越复现任务的迁移证据。为了进行留出评测，我们引入了 RecreationBench，包含跨领域和跨平台的250项多样化任务。基于参考程序的程序化和视觉断言涵盖了多种交互深度下以动作为条件的输出结果；在冻结测试套件用于自动评分之前，每项断言均在参考程序上并由人工审核员进行验证。GPT-6 Astra 以58.1%的总成绩领先，但仅在2.8%的任务上通过了所有程序化测试。与交互和计算输出相比，智能体在复现静态界面结构方面更为可靠，而生成的应用程序与参考程序相比仍然更小且更单体化（monolithic）。我们发布了该评测基准、环境和测试套件。"}, {"title": "BI-Agent and BI-Bench: Towards Automating End-to-End Business Intelligence", "arxiv_id": "2609.20886", "authors": "Chuxuan Hu, Yeye He, Penny Zhou, Wee Hyong Tok, Daniel Kang, Surajit Chaudhuri", "summary": "Business intelligence (BI) is a cornerstone of enterprise decision-making and is widely used by enterprise users in software such as Power BI and Tableau. In traditional BI workflows, users need to prepare data by (1) identifying relevant tables, (2) performing data transformations, and (3) building join relationships, before they can (4) answer their business questions. These steps can be complex and time-consuming, making BI challenging. Given the strong capabilities of large language models (LLMs) in working with data, we study their ability to answer BI questions end-to-end, without requiring users to manually perform the tedious preparation steps. To do this, we harvest a large collection of real-world BI projects from public sources, and manually extract pairs of (questions, ground-truth answers) from real user dashboards. The resulting benchmark, BI-Bench, is the first benchmark to systematically study LLMs' ability on end-to-end BI. We find that even frontier LLMs perform poorly on BI-Bench, with less than 50% accuracy. To address their limitations, we design a tool-augmented BI-Agent that decomposes BI workflows into subtasks on structured data, such as search, join, and transform, and orchestrates specialized data management methods across BI stages. Furthermore, we develop a post-training framework that synthesizes training trajectories from real BI projects, enabling BI-Agent to be further post-trained using both supervised fine-tuning (SFT) and reinforcement learning (RL). BI-Agent achieves substantial accuracy gains of up to 40 percentage points with vanilla LLMs, and post-trained BI-Agent yields gains of up to 30 points. Our results highlight the importance of combining tool-augmented reasoning with domain-specific post-training in complex BI workflows, and point to promising directions for future research.", "category": "cs.CL", "cluster": "Agent Environments \u0026 Benchmarks", "tags": ["cs.CL"], "filter_reason": "论文的核心贡献是设计了一个工具增强的 LLM 智能体（BI-Agent），并为其开发了一个后训练框架（结合 SFT 和 RL），以解决复杂的端到端商业智能（BI）工作流问题。虽然该论文的应用场景是特定领域（商业智能），但根据筛选标准第一步的排除规则1，“如果论文在特定领域中提出了新的 agent 机制……则不应排除——领域是场景，机制才是贡献”。该论文不仅提出了将复杂工作流分解为子任务的智能体架构，还重点研究了 agent training（通过合成轨迹进行 SFT 和 RL 后训练），这直接对应了核心关注点中的“构建LLM智能体”和“agent training/distillation/RL”。此外，论文构建的 BI-Bench 评估基准也符合“研究对象明确是 LLM Agents / Tool-Use Agents，即使它主要是评估基准……只要结论直接帮助理解或改进智能体能力，也应保留”的原则。因此，该论文属于 Agentic AI 的研究范畴，应予保留。", "intro_logic": "### § 1 研究问题与重要性\n\n论文研究的问题是：给定一组原始表格和一个自然语言业务问题，能否让大语言模型（LLM）自动完成传统BI工作流中的全部步骤——搜索相关表、执行数据转换、建立表间连接、最终生成分析结果——而无需用户手动完成这些繁琐的数据准备工作。传统BI平台（如Power BI、Tableau）虽然界面友好，但用户仍需在专有DSL或GUI中手动编写转换逻辑、定义连接关系，这对非技术企业用户构成核心痛点。解决这一问题能让长尾用户在尚未建立完善数据基础的情况下，以低门槛获得即席分析能力，而非为少量问题承担高昂的前期数据建模成本。\n\n### § 2 前人工作与不足\n\n最相关的已有工作分为两类。第一类是NL2SQL评测基准（如BIRD、Spider），它们假设输入表已经清洗、结构化且可直接分析，只评测最终的SQL生成步骤，完全未涵盖BI工作流中数据搜索、表格重塑转换和连接预测等前置挑战。这一缺口并非疏忽，而是NL2SQL任务定义本身将数据准备排除在外，导致在BIRD上超过70%准确率的SOTA模型在BI-Bench上仅剩6%–17%。第二类是通用数据分析代理（如Code Interpreter、ReAct代理），它们能执行代码并迭代推理，但缺乏对复杂BI模式（如星型、雪花型）和半结构化原始数据的专业处理能力，面对需要全局统计特征才能可靠预测的连接和转换操作时，仅靠LLM在少量采样行上推理容易出错。数据管理社区虽已为连接预测、表格重塑等单个步骤开发了专门算法，但这些方法此前未被整合进LLM代理的推理-工具调用循环中，也从未在端到端BI场景下被系统评测。", "core_insight": "### § 3 重建作者的思考路径\n\n作者可能从传统BI工作流的实际痛点出发：非技术用户在Power BI等平台中需要手动完成表搜索、数据转换和连接定义，门槛极高。虽然LLM在NL2SQL等分析任务上表现不错，但这些任务假设数据已结构化就绪，而真实BI场景中的原始数据往往是杂乱的电子表格导出，需要复杂的结构转换（如unpivot）才能进行关系分析。作者发现，即使前沿LLM在处理这些数据准备步骤时也频繁出错——难以判断哪些表需要转换、如何在复杂多表模式中预测连接。但数据管理社区早已为这些具体问题开发了专门算法。于是作者想到：与其让LLM硬扛这些不擅长的操作，不如把成熟算法封装为工具，让LLM专注于推理和编排。通用LLM仍不总是知道何时该调用工具，这促使作者进一步引入领域特定的后训练来强化这种能力。\n\n### § 4 核心直觉\n\nLLM擅长推理和代码生成，但缺乏对复杂表结构的整体理解，难以可靠完成转换和连接等数据管理操作。核心洞察是将两类能力解耦：让LLM负责规划和编排，把具体的数据处理难题交给已有专门算法作为工具调用，再通过合成真实BI项目轨迹进行后训练，使小模型也能学会在正确时机调用正确工具。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n==== 推理 Pipeline ====\n原始表 T + 查询 q\n    │\n    ▼\n[Search 筛选表] → [Transform 表重塑] → [Join 连接预测]\n    │\n    ▼\n[Code 工具 SQL/Python] → 结果表 R\nLLM Orchestrator 迭代调用以上工具\n\n==== 后训练 Pipeline ====\n真实 BI 项目\n    │\n    ▼\n采样子schema → 拼接宽表 W → LLM合成 q,代码c → R=c(W)\n    │\n    ▼\n混入无关表 + 逆向变换 → 训练任务 t=(q,T,R)\n    │\n    ├──→ SFT: 教师模型生成轨迹(执行=R才保留)\n    └──→ RL: GRPO 以 R 为可验证奖励, rollout探索\n```\n\n推理阶段，LLM Orchestrator 接收查询 q 和原始表 T，在迭代循环中调用四类工具：\n\n- **Search**：根据 q 和表头采样行，保守筛选相关表，剔除明显无关表（§5.1）。\n- **Transform**：调用表重塑预测算法[70]，检测 pivot/unpivot/transpose 需求，返回变换前后表（§5.1）。\n- **Join**：基于 BI 雪花 schema 优化的连接预测算法[73]，返回所有预测连接关系（§5.1）。\n- **Code**：执行 LLM 生成的 SQL/Python，返回结果或错误，变量跨轮缓存（§5.1）。\n\n每轮工具输出追加到上下文，LLM 决定下一步，直到产出答案（Listing 1）。\n\n后训练分五步自动合成训练数据（Figure 6）：从真实 BI 项目采样连通子 schema 并拼成宽表 W；LLM 在 W 上合成查询 q 和代码 c，执行得 R=c(W)；混入无关表并施加逆向变换构造原始表 T；仅保留执行结果精确匹配 R 的训练轨迹。SFT 用 GPT-4o 作教师生成逐轮样本；RL 用 GRPO 以 R 为可验证奖励，模型自行 rollout 探索（§5.2）。\n\n### § 6 核心数学推导\n\nRL 后训练的奖励函数（式1）对每条轨迹 $J_i$ 定义三档奖励：结果匹配目标 R 得 +1；返回了结果表但不正确得 -0.5 部分奖励；未能返回结果表得 -1。另加格式惩罚 $-0.1n$（n 为语法错误轮数），鼓励模型关注代码语法有效性。部分奖励在稀疏奖励场景中提供密集梯度信号，使早期 rollout 即使未完全正确也能获得学习方向。\n\nGRPO 将同批 K 条轨迹的奖励归一化为优势分数 $A_i=(r_i-\\mu)/\\sigma$，其中 μ、σ 为批次内奖励的均值和标准差。直觉上，$A_i$ 衡量某条轨迹相对于同批其他轨迹的优劣。策略优化使用带裁剪的目标函数 $L(\\theta)=E[\\min(r(\\theta)A,\\, \\text{clip}(r(\\theta),1-\\epsilon,1+\\epsilon)A)]$，其中 $r(\\theta)=\\pi_\\theta(y|x)/\\pi_{\\text{old}}(y|x)$ 为新旧策略概率比。裁剪机制防止策略更新过大，与 PPO 思路一致。梯度仅作用于工具调用块，不优化自然语言生成部分。\n\n### § 7 实验设计与结论\n\n**问题1：前沿 LLM 能否端到端完成 BI？** 在 BI-Bench 的 100 个真实用例上评测 10 个大模型和 6 个 SOTA NL2SQL 系统，使用 SQL 和 Python 两种语言。**答案：不能。** 最强模型 o4-mini 仅 48.2% 准确率，NL2SQL 系统普遍低于 17%，因为 BI-Bench 包含表搜索、结构变换、连接预测等 NL2SQL 未覆盖的数据准备挑战。\n\n**问题2：数据管理工具是否提升质量？** 对同一模型在有/无工具条件下做配对比较，10 次重复运行，用配对 t 检验和 bootstrap 置信区间评估显著性。**答案：是。** 工具平均提升 SQL 14 个百分点、Python 11 个百分点，20 组比较中 19 组统计显著。工具对复杂任务增益更大，且三类工具协同效果优于单独使用（Figure 7-8）。\n\n**问题3：后训练能否提升小模型至大模型水平？** 在 Qwen3-8B 上进行 SFT 和 RL 后训练，与基础模型及大模型对比，并在 Spider 2.0 上做泛化测试。**答案：是。** SFT+RL+工具使 Qwen3-8B 达到 35% 准确率，超过 GPT-4o 无工具表现，成本仅为大模型的 1/54。在 Spider 2.0 上准确率提升 20.5 倍，证明增益不限于 BI-Bench（Table 5）。", "additional_insights": "### § 8 阅读收获\n\nBI-Bench是首个端到端BI评测基准，覆盖搜索、变换、连接、分析全流程；最强模型o4-mini仅48.2%准确率，SOTA NL2SQL系统降至6–26%，说明现有方法远未解决真实BI中的数据准备难题。BI-Agent将三个专用数据管理工具（搜索、变换、连接）暴露给LLM调用，把困难的数据操作卸载到经典算法，跨模型提升准确率最高40个百分点。后训练框架从真实BI项目自动合成训练轨迹，用SFT+RL使8B小模型匹配大模型质量，成本降低50倍，且增益迁移到域外Spider 2.0，首次证明工具使用与领域后训练具有协同效应。\n\n### § 9 最脆弱的假设\n\n最脆弱的假设是专用工具（连接预测、表重塑预测算法）在BI-Bench真实schema上能输出正确结果。论文将这些工具视为可靠预言机，LLM编排器直接采信其输出，但从未报告工具本身的独立准确率。若连接预测在雪花型schema上因代理键值域重叠而误判连接键，或变换预测错误判断重塑操作，LLM会基于错误信息生成错误答案，整个框架的增益将直接坍塌。论文仅以错误分析间接佐证（变换和连接错误减少），未将工具准确率与LLM编排质量分离评估，这是核心贡献中证据链最薄弱的环节。\n\n### § 10 最小复现实验\n\n用已发布的BI-Bench选取约30个需要表重塑变换的查询，以GPT-4o在\"仅编码工具\"和\"额外启用变换工具\"两种条件下各跑10次，按论文指标（表形状匹配+逐单元格值比较，数值容差rtol=1e-2）测量准确率。若变换工具条件在需要变换的查询上显著优于基线（论文报告SQL相对增益84.2%），则支持专用工具卸载数据操作的论断；若无显著差异，则提示变换预测算法在这些schema上可能不可靠，或GPT-4o已能自行处理变换。此实验保留原始基准与评测指标，仅隔离一个工具的贡献，一周内只需API调用和已发布的变换预测算法即可完成。", "research_value": "### § 11 最强反例设计\n\n如果我要攻击这篇论文，我会设计一个“工具误导”实验来挑战其对专用工具可靠性的致命依赖。具体做法是从真实业务中抽取存在大量相似外键的复杂表结构，并人为向连接预测工具的输出中注入错误的连接关系。我将对比“无工具基线”与“接收错误工具输出的BI-Agent”的准确率。如果后者准确率断崖式下跌且LLM无法纠正错误，这就证明该方法并非具备真正的端到端推理能力，而是将难度隐蔽转移到了对工具完美性的依赖上。\n\n### § 12 后续研究设想\n\n围绕LLM盲目采信工具输出这一局限，后续研究可检验：在工具调用后引入验证机制能否提升对工具误报的鲁棒性。具体做法是在调用连接或表重塑工具后，增加一步基于采样数据的逻辑校验，例如检查连接键的唯一性。首个对照实验可在BI-Bench的复杂连接子集上人为扰动工具输出，对比有无验证机制的最终准确率。若验证机制能显著挽回因工具错误导致的准确率下降，则说明赋予代理纠错能力比单纯追求工具准确率更具实用价值。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yeye He\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Penny Zhou\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Chuxuan Hu\", \"affiliations\": [3], \"markers\": [\"∗\"]},\n    {\"name\": \"Wee Hyong Tok\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Daniel Kang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Surajit Chaudhuri\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Microsoft Research\"},\n    {\"id\": 2, \"name\": \"Microsoft\"},\n    {\"id\": 3, \"name\": \"UIUC\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"∗\", \"text\": \"Part of work done while at Microsoft.\"},\n    {\"marker\": \"†\", \"text\": \"Correspondence: chuxuan3@illinois.edu, yeyehe@microsoft.com\"}\n  ]\n}\n```", "summary_translation": "商业智能（BI）是企业决策的基石，企业用户广泛使用 Power BI 和 Tableau 等软件进行工作。在传统 BI 工作流中，用户需要通过（1）识别相关数据表、（2）执行数据转换和（3）建立连接关系来准备数据，然后才能（4）回答其业务问题。这些步骤可能复杂且耗时，使得 BI 具有挑战性。鉴于大型语言模型（LLMs）在处理数据方面的强大能力，我们研究了它们端到端回答 BI 问题的能力，而无需用户手动执行繁琐的准备步骤。为此，我们从公开来源收集了大量真实的 BI 项目，并从真实用户仪表板中手动提取了（问题，真实答案）对。由此产生的评测基准 BI-Bench 是首个系统研究 LLMs 端到端 BI 能力的评测基准。我们发现，即使是前沿的 LLMs 在 BI-Bench 上的表现也不佳，准确率低于 50%。为了解决其局限性，我们设计了一种工具增强的 BI-Agent，它将 BI 工作流分解为结构化数据上的子任务（如搜索、连接和转换），并在 BI 各阶段协调专门的数据管理方法。此外，我们开发了一个后训练框架，该框架从真实 BI 项目中合成训练轨迹，使 BI-Agent 能够使用监督微调（SFT）和强化学习（RL）进行进一步的后训练。与原始 LLMs 相比，BI-Agent 实现了高达 40 个百分点的显著准确率提升，而后训练的 BI-Agent 则带来了高达 30 个百分点的提升。我们的结果强调了在复杂的 BI 工作流中将工具增强的推理与特定领域的后训练相结合的重要性，并为未来的研究指明了有前景的方向。"}, {"title": "Efficient Benchmarking in Production: A Study of an Evolving LLM Agent", "arxiv_id": "2609.21267", "authors": "Yining She, Lei Lin", "summary": "Production LLM agents are evaluated repeatedly as they evolve, but full agent benchmarks are costly to rerun. We study efficient recurring evaluation for a production analytics agent serving tens of thousands of monthly active users and report first-hand deployment experience. Using 574 historical runs of the production benchmark, split chronologically into calibration and held-out periods, we compare random sampling, historical caching, fixed representative subsets, and IRT-based adaptive testing. The results show that multidimensional 2PL adaptive testing achieves the best overall score fidelity: executing 200 questions, 38.5% of a full run, yields 1.03 pp of MAE. We nevertheless deployed difficulty-stratified fixed subsets because of their operational simplicity, and show they transfer without recalibration to five other agent families and remain stable across calibration windows as short as one day. Drawing on this deployment experience, we report practical recommendations for recurring production-agent evaluation.", "category": "cs.AI", "cluster": "Agent Environments \u0026 Benchmarks", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文研究如何对一个服务数万月活用户的生产分析型 LLM agent 进行高效的周期性评测。该 agent 的模型、提示词、工具和系统持续演进，开发者需要反复评测以比较配置和检测回归，但完整基准含 519 道题、每次运行约三小时，严重制约持续开发。核心问题是：能否用远少于完整基准的题目执行量，忠实恢复完整基准的通过率分数以及各次运行间的排名？\n\n### § 2 前人工作与不足\n\n已有方法主要通过子集选择、分数重建和自适应测试降低 LLM 评测成本，如 Polo et al. (2024) 的 tinybenchmarks 用 IRT 聚类选取代表性题目，Truong et al. (2025) 用基于 Fisher 信息的自适应测试。但这些方法均在公开基准上用多个不同模型的响应矩阵校准，针对的是一次性评测多样化模型群体，未利用单个演进 agent 时间有序的历史运行结果来指导后续评测。此外，生产场景中单个 agent 的响应模式远少于多样化模型群体，使 Polo et al. 发现有效的多维 IRT 聚类选择在生产中不如简单的难度分层——多维题目参数估计不够可靠，且子集占基准比例约 19%，远大于前人在 MMLU 上的约 0.7%，随机采样在较大采样比例下已足够准确，聚类改进空间有限。", "core_insight": "### § 3 重建作者的思考路径\n\n生产环境LLM agent每次完整评测耗时数小时，而开发中需要反复评测。已有降本方法多在公开基准上用多个不同模型校准，但生产场景是单一agent随时间演进，积累了大量时序历史数据。可能的思考路径是：历史通过/失败模式能揭示哪些题目有代表性、哪些可跳过，而IRT恰好能从历史矩阵中估计题目难度与能力参数，为子集选择和分数重建提供依据。若题目难度排序在不同agent间相对稳定，简单按难度分层选出的子集还可能具备跨系统迁移性。\n\n### § 4 核心直觉\n\n用历史数据拟合IRT模型得到题目难度，按难度分层选少量代表性题目，就能以约四成题量近似还原完整基准分数。固定子集虽不如自适应测试精确，但无需顺序执行、可并行评测、能跨agent迁移，更适合生产环境反复使用。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[历史评测数据]\n      |\n      v\n+--------------+\n| 拟合 IRT 模型| (Sec 3.3.1)\n+--------------+\n      |\n   +-----+-----+\n   |           |\n   v           v\n+--------+ +--------+\n|构建固定| |准备自适| (Sec 3.3.2)\n|子集    | |应参数  |\n+--------+ +--------+\n   |           |\n   v           v\n+--------+ +--------+ \u003C--+\n|执行固定| |选信息题|    |\n|k题评测 | |更新能力| ---+ (Sec 3.4)\n+--------+ +--------+\n   |           |\n   v           v\n+--------+ +--------+\n|估计通过| |p-IRT   | (Sec 3.3.3)\n|率      | |重构    |\n+--------+ +--------+\n   |           |\n   +-----+-----+\n         |\n         v\n   [完整基准估计分 ŝ]\n```\n\n- **拟合 IRT 模型**：输入历史评测数据，使用最大后验估计拟合 Rasch 或多维 2PL 模型，输出题目难度和区分度参数（Sec 3.3.1）。\n- **构建固定子集**：输入 IRT 参数，按难度排序分层并选取代表题，输出固定题目集（Sec 3.3.2）。\n- **准备自适应参数**：输入 IRT 参数，固定题目参数用于后续动态选择（Sec 3.4）。\n- **执行固定 k 题评测**：输入固定题目集和当前 Agent，执行评测，输出当前 verdicts。\n- **选信息题更新能力**：输入当前 verdicts 和题目参数，计算 Fisher 信息，选择下一题执行并更新能力估计，循环 k 次（Sec 3.4）。\n- **估计通过率**：输入当前 verdicts，使用加权平均或 gp-IRT 结合 IRT 重构，输出估计分（Sec 3.3.3）。\n- **p-IRT 重构**：输入当前 verdicts 和能力估计，预测未观测题目的通过概率，输出估计分（Sec 3.4）。\n\n### § 6 核心数学推导\n\n本文使用项目反应理论（IRT）将 Agent 能力和题目难度建模在同一尺度上。多维 2PL 模型预测通过概率为 $P = \\sigma(\\boldsymbol{\\alpha}^\\top \\boldsymbol{\\theta} - \\beta)$，其中 $\\boldsymbol{\\theta}$ 是能力向量，$\\boldsymbol{\\alpha}$ 是区分度向量，$\\beta$ 是难度。直觉上，能力越高、难度越低，通过概率越大；区分度则衡量题目对不同能力水平的敏感程度。Rasch 模型是其一维特例。\n\n自适应测试通过 Fisher 信息选择题目。对于 Rasch 模型，信息量 $I = p(1-p)$，当通过概率接近 0.5 时最大。这意味着系统总是选择与当前能力估计最匹配的题目，从而最大程度减少能力估计的不确定性。\n\n分数估计使用 gp-IRT 估计器，它将直接加权和 IRT 重构按权重 $\\lambda$ 混合。$\\lambda$ 取决于重构偏差和抽样方差：当模型预测偏差大时多用直接观测，当抽样方差大时多用模型预测，以此平衡两种误差来源。\n\n### § 7 实验设计与结论\n\n**问题1**：部分评测能否在减少执行题目的同时，保持与完整基准一致的分数和排名？**实验**使用生产 Agent 的 574 次历史评测，按时间分为 287 次校准和 287 次测试，比较四种方法的 MAE 和排名相关性。**答案**是部分评测有效，多维 2PL 自适应测试在执行 38.5% 题目时 MAE 仅 1.03 pp，且固定子集在小预算下表现最优。\n\n**问题2**：固定子集能否跨不同 Agent 架构迁移而无需重新校准？**实验**将在原始 Agent 上校准的子集直接应用于另外 5 个不同框架的 Agent 家族。**答案**是可以，该子集在 12 个预算点中有 11 个优于随机采样，说明题目难度具有跨系统的内在通用性。\n\n**问题3**：固定子集的性能对校准数据的时间窗口有多敏感？**实验**固定校准结束日，将起始日逐步推进以缩短历史窗口。**答案**是不敏感，即使仅用 1 天的历史数据，MAE 也与使用 4 周数据相近，说明近期数据足以估计难度排序。", "additional_insights": "### § 8 阅读收获\n对不断演进的生产级大模型智能体，部分评测能大幅降低成本并保持高保真度。多维2PL自适应测试在分数和排名保真度上最优，但难度分层的固定子集因操作简单、无需重新校准即可跨智能体家族迁移，成为实际部署的首选。\n\n### § 9 最脆弱的假设\n难度分层固定子集的核心假设是：题目难度排序在不同智能体和不同时间具有内在稳定性。如果智能体的底层模型或工具发生重大改变，导致题目难度分布发生根本性偏移，该子集将失去代表性，导致评测失效。论文仅验证了5个智能体家族和52天内的数据，缺乏对模型架构发生剧变时难度迁移性的证据。\n\n### § 10 最小复现实验\n使用公开的大模型历史评测记录（如MMLU子集），无需复现完整生产系统。实现难度分层固定子集与随机采样，在两种不同架构的模型上测试。测量两者在相同执行比例下的通过率平均绝对误差（MAE）。如果固定子集在跨模型时的误差显著低于随机采样，则支持其跨系统迁移的结论；若误差相近或更高，则反驳该结论。", "research_value": "### § 11 最强反例设计\n我会设计一个能力维度发生根本性偏移的实验，来挑战固定子集跨架构迁移有效的结论。论文假设题目难度排序在不同系统间具有稳定性，但这可能只是因为测试的五个智能体家族在能力分布上仍然相似。如果引入一个采用全新工具调用机制的智能体，使其在原本困难的任务上表现优异，却在简单的指令遵循任务上失败，难度排序就会翻转。此时，若固定子集未覆盖这些发生翻转的任务，其估计的通过率将出现系统性偏差，证明该方法在架构剧变时会可预测地失效。\n\n### § 12 后续研究设想\n围绕难度排序在系统剧变时失效的局限，后续研究可探索如何在不运行完整基准的前提下，自动检测固定子集何时失去代表性。生产环境无法定期跑全量基准验证子集有效性，因此需要寻找轻量级的偏移预警信号。首个对照实验可收集智能体在固定子集上的作答延迟或模型置信度等辅助信号，在底层模型升级时，对比这些信号分布变化与真实通过率偏移的相关性。如果辅助信号能准确预测估计误差的激增，就说明可通过触发重新校准来挽救该方法，明确其长期适用边界。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yining She\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Lei Lin\", \"affiliations\": [2], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Carnegie Mellon University\"},\n    {\"id\": 2, \"name\": \"Meta\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Work done while at Meta.\"}\n  ]\n}\n```", "summary_translation": "生产级大语言模型（LLM）智能体在演进过程中需要反复评估，但重新运行完整的智能体评测基准成本高昂。我们针对一个服务于数万名月活跃用户的生产级分析智能体，研究了高效的周期性评估方法，并报告了第一手的部署经验。利用生产评测基准的574次历史运行记录（按时间顺序划分为校准期和预留期），我们对比了随机采样、历史缓存、固定的代表性子集以及基于项目反应理论（Item Response Theory, IRT）的自适应测试。结果表明，多维二参数逻辑斯蒂克模型（2PL）自适应测试取得了最佳的总体分数保真度：仅执行200个问题（占完整运行的38.5%），平均绝对误差（MAE）仅为1.03个百分点。尽管如此，出于操作简便的考虑，我们最终部署了难度分层的固定子集，并证明其无需重新校准即可迁移至其他五个智能体系列，且在短至一天的校准窗口内依然保持稳定。基于上述部署经验，我们为生产级智能体的周期性评估提供了实用建议。"}, {"title": "GameASG-Bench: Benchmarking Autonomous Software Generation for Game Development", "arxiv_id": "2609.21293", "authors": "Xiuhui Zhang, Yi Chen, Shusheng Xu, Fan Li, Huan Wang, Tongkai Yang, Binhang Yuan", "summary": "Autonomous software generation (ASG) aims to turn human requirements into executable applications, but delivering these applications does not necessarily establish that their interacting components satisfy the specified behavioral requirements. We introduce GameASG-Bench, a benchmark that makes behavioral testability part of the generation task for game development. Our design declares an evaluation interface specification before generation, fixing legal starting scenarios, player-level actions, stable snapshots, rejection behavior, and invariants while leaving private implementations open. Concretely, we include: (i) static L1 checks that assess source-level compliance; and (ii) browser-executed L2 checks that combine semantic observations with real input and runtime evidence. We implement this protocol as 47 browser-native game-generation tasks spanning 12 primary genres and both 2D and 3D interaction, each with executable checks and an independently verified reference implementation. Our experiments answer four key questions about end-to-end agent performance, tool access and nominal turn budget, reasoning effort, and harness choice. Across nine agent stacks, the highest observed mean L2 check pass rate is 93.2%, yet the highest observed strict task success rate, requiring all L1 and applicable L2 prerequisite and core requirement checks, is only 55.3% (26/47 tasks). For DeepSeek-V4-Flash, full tool access and larger nominal turn budgets yield more strict task successes, while the strict task success rate is not monotonic in reasoning effort. Both tested harnesses achieve 18 strict task successes, but only ten tasks succeed under both. These results expose task-level compliance gaps that high average check pass rates actually obscure.", "category": "cs.AI", "cluster": "Agent Environments \u0026 Benchmarks", "tags": ["cs.AI"], "filter_reason": "这篇论文提出了 GameASG-Bench，一个用于评估游戏开发中自主软件生成（ASG）智能体的基准测试。根据摘要，该研究明确以 LLM 智能体为研究对象，评估了九个不同的“智能体栈”，并深入探讨了工具访问、回合预算、推理努力以及 harness 选择对端到端智能体性能的直接影响。这完全符合筛选标准中“保留：如果论文的研究对象明确是 LLM Agents / Tool-Use Agents，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留”的规则。此外，论文对 agent harness 和工具使用影响的分析，直接关联到智能体运行组件和能力的理解，属于 Agentic AI 的核心研究范畴，而非单纯的领域应用或非演化型基础设施。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决的核心问题是：如何系统评估由 LLM 驱动的编码代理能否自主生成满足指定行为需求的完整可执行应用。作者以浏览器原生游戏生成为切入点，因为游戏要求输入处理、状态转换、渲染和交互逻辑在单一产物中协同工作，能暴露组件级正确性无法覆盖的集成缺陷。这个问题的价值在于，现有评测往往只报告平均检查通过率，却无法判定产物是否满足全部必需需求；GAMEASG-BENCH 通过在生成前声明评估接口规范，将行为可测试性纳入生成任务，从而提供任务级合规诊断，区分真正的完整交付与部分实现。\n\n### § 2 前人工作与不足\n\n最相关的前人工作包括 WebGameBench、GameCraft-Bench 和 GameGen-Verifier。WebGameBench 通过规范引导的浏览器交互评测完整游戏，允许在最终操作前准备候选状态；GameCraft-Bench 要求完整 Godot 项目和可回放演示，按隐藏评分标准打分；GameGen-Verifier 提取前置—交互—后置关键点，通过运行时状态注入将其锚定到各生成实现中。这些方法已能结合运行时证据评测游戏行为，但共同不足在于：如何让固定的可执行检查一致地访问内部实现各异的异构生成产物，仍是一个未被充分解决的设计问题。具体而言，GameCraft-Bench 依赖隐藏评分标准和回放证据，难以将失败归因到具体需求；GameGen-Verifier 的运行时状态注入需要针对每个实现单独适配，缺乏生成前固定的公共评估接口。GAMEASG-BENCH 的关键改进是在生成前就声明评估接口规范——包括合法场景、玩家级动作、稳定快照和不变量——使同一套检查能跨不同私有实现一致运行，同时保留实现自由度。", "core_insight": "### § 3 重建作者的思考路径\n\n现有代码生成评测多聚焦于函数级或仓库级修改，无法验证完整应用的交互行为。游戏生成需要输入、状态转换和渲染等组件协同，是理想的测试场景。然而，现有游戏评测要么依赖开放式游玩而漏掉特定前置条件的交互，要么仅检查编译通过而无法证明机制存在。即使尝试运行时状态注入，让固定检查脚本访问千差万别的私有实现仍是难题。因此，作者可能想到：既然无法事后访问私有状态，不如在生成前就要求应用实现统一的评测接口，让评测器能设定初始场景并执行动作。\n\n### § 4 核心直觉\n\n这篇论文的核心直觉是“将可测试性作为生成任务的一部分”。通过在生成前预先声明评测接口规范，要求应用暴露重置、加载场景、输入和获取快照的方法。这样，评测器就能通过统一接口准备特定场景，并结合真实浏览器输入与状态快照验证行为，从而绕过私有实现的访问障碍，暴露出仅靠平均通过率掩盖的集成缺陷。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n  ┌─ 人工准备 (生成前) ──────────────────────┐\n  │  target.md      生成提示                 │\n  │  game-spec.md   玩法需求                 │\n  │  tdd.md          评测接口规范            │\n  │  checks.json/js  可执行检查              │\n  └──────┬──────────────────────┬───────────┘\n         │ 三份文档              │ 检查脚本\n         ▼                      │ (不进入生成容器)\n  ┌─ 生成阶段 ──────────┐       │\n  │ Coding Agent        │       │\n  │ 实现 game +         │       │\n  │ window.__gameTest   │       │\n  │ 交付 index.html     │       │\n  └──────┬──────────────┘       │\n         │ index.html           │\n         ▼                      ▼\n  ┌─ 评测阶段 (独立容器) ───────────────────┐\n  │ L1: 源码级检查 (结构/正则/反模式)        │\n  │ L2: 浏览器行为检查                       │\n  │     场景准备→语义动作/真实输入→观察      │\n  │     PASS / FAIL / NOT_APPLICABLE        │\n  └──────┬─────────────────────────────────┘\n         ▼\n    严格任务成功率\n```\n\nGAMEASG-BENCH 的核心思路是将\"可测试性\"嵌入生成任务本身，流程分三阶段：\n\n- **人工准备阶段（生成前）**：任务作者编写三份文档——生成提示（target.md）、玩法需求（game-spec.md）和评测接口规范（tdd.md），同时编写检查脚本（checks.json 和 checks.js）。评测接口定义四个方法：reset（重置状态）、loadScenario（加载合法场景）、input（执行玩家级动作）和 getSnapshot（返回状态快照），通过 window.__gameTest 暴露。关键约束是场景设置可调整起始条件，但不能直接产生被测结果，以保留被测动作的作用（§2.2）。\n\n- **生成阶段**：编码代理在干净工作区读取三份文档，同时实现游戏逻辑和评测接口，交付自包含的 index.html。代理可自由选择内部实现方式，但须遵守接口定义的动作语义、拒绝行为和不变量（§2.1–2.2）。\n\n- **评测阶段**：在独立容器中分两层执行。L1 在源码层面检查结构合规性（正则匹配、反模式规则），不涉及游戏正确性。L2 在 headless Chromium 中按\"准备-执行-观察\"序列运行：通过接口加载场景、发送语义动作或真实浏览器输入，再比较状态快照与预期结果。每条检查返回 PASS、FAIL 或 NOT_APPLICABLE（§2.3）。严格任务成功要求有效交付、完成评测，且所有 L1 检查和所有适用的 L2 P0/P1 检查全部通过（§2.4）。\n\n### § 6 核心数学推导\n\n论文定义了严格任务成功的评分规则。对每个任务 g，dg 和 eg 分别表示是否有效交付和完成评测（取值 0 或 1），Lg 包含所有 L1 检查，Bg 包含所有适用的 L2 P0/P1 检查，pg,c 表示检查 c 是否通过（通过为 1，否则为 0）。严格任务成功 sg 要求四个条件同时满足：有效交付、完成评测、所有 L1 检查通过、所有适用的 L2 核心检查通过。主严格任务成功率则对所有计划任务 G 取平均（§2.4）。\n\n这一定义的核心直觉是\"全有或全无\"：即使一个产物通过了 93% 的检查，只要有一条核心需求检查失败，该任务就不算严格成功。这种评分方式揭示了高平均通过率所掩盖的任务级合规缺口——平均通过率衡量的是\"通过了多少条检查\"，而严格成功率衡量的是\"有多少任务通过了全部必要检查\"。\n\n### § 7 实验设计与结论\n\n论文围绕四个研究问题设计实验，每个问题对应一组对照实验：\n\n**RQ1（端到端性能）**：九个代理栈在相同 47 个任务上以最大推理努力和完整工具访问运行。最高严格任务成功率仅 55.3%（GPT-6-Astra + Codex CLI），而最高平均 L2 通过率达 93.2%，表明高平均通过率会掩盖未满足的核心需求——即使单个失败的核心检查也会阻止严格成功。\n\n**RQ2（工具访问与轮次预算）**：以 DeepSeek-V4-Flash 为对象，完整工具访问获 18 个严格成功，受限配置仅 6–9 个；名义轮次预算从 30 升至 120 时，完成任务数从 10 增至 47，严格成功率从 14.9% 升至 38.3%。更多轮次主要提高了生成与交付的完成率，而非已评测任务的成功率。\n\n**RQ3（推理努力）**：高努力获最多严格成功（19/47），且比最大努力少用 26.9% 的推理 token。最大努力在各项检查通过率上最高，但严格成功数反而少一个，说明更多推理不一定带来更多完整合规，存在收益递减的权衡。\n\n**RQ4（框架选择）**：Claude Code 与 Codex CLI 均获 18 个严格成功，但仅 10 个任务在两者下都成功，八个仅在前者成功、八个仅在后者成功。相同的聚合数字背后是不同的成功任务集和资源消耗特征，说明框架选择会实质性地改变哪些任务能够成功。", "additional_insights": "### § 8 阅读收获\n\n论文核心发现是高平均检查通过率不等于任务级合规：九个智能体栈中最高平均 L2 通过率达 93.2%，但严格任务成功率仅 55.3%，因为任一必需检查失败即判整个任务失败。为实现行为可测试评估，论文在生成前声明评估接口规范，要求智能体同时实现游戏和四个接口方法，使固定检查能跨不同私有实现执行。实验还揭示工具访问和回合预算影响显著，推理努力与成功率不成单调关系，不同框架即使成功数相同，成功的任务集合也大不相同。\n\n### § 9 最脆弱的假设\n\n最脆弱的假设是要求智能体额外实现评估接口不会扭曲生成结果。论文未提供\"不要求实现接口时的生成表现\"作为对照。若接口适配本身构成额外复杂度，部分失败可能归因于接口实现而非游戏逻辑缺陷，削弱\"高通过率掩盖合规差距\"这一核心结论的可靠性。论文仅以 47 个人工编写的参考实现全部通过检查作为正面控制证据，但人工实现不能代表智能体在接口适配上面临的实际困难。\n\n### § 10 最小复现实验\n\n选取论文中 3 个 2D Canvas 任务，用单一模型生成，仅实现 L2 P1 核心检查，手动编写检查脚本而非完整评测框架。测量每个任务的平均 P1 通过率和是否所有 P1 检查全部通过。若平均通过率显著高于\"全部通过\"的比例，则支持\"高平均通过率掩盖合规差距\"的核心发现；若两者接近，则该发现可能依赖特定任务集或检查粒度设计，而非普遍现象。", "research_value": "### § 11 最强反例设计\n\n如果我反对这篇论文，我会设计实验验证“接口适配负担”是否扭曲了生成结果。具体做法是将代理分为两组：实验组按原方法同时实现游戏和评估接口，对照组仅实现游戏，由外部脚本通过真实浏览器输入和 DOM 解析进行黑盒评测。如果对照组在核心游戏逻辑上的成功率显著高于实验组，就说明低严格成功率并非因为高通过率掩盖了合规缺口，而是实现评估接口增加了复杂度，导致代理在游戏逻辑上投入不足。这为论文核心发现提供了具体的替代解释。\n\n### § 12 后续研究设想\n\n围绕评估接口需人工编写这一局限，一个可检验的后续研究问题是：能否由大语言模型自动生成评估接口规范和可执行检查脚本，并保持与人工编写相当的评测可靠性？这需要将原流程的人工准备阶段替换为自动化生成，由另一个模型根据玩法需求产出接口定义和检查逻辑。值得测试是因为这能大幅降低构建行为测试基准的成本。首个对照实验可选取若干游戏需求，分别由人工和模型生成检查套件，在相同的代理产物上运行。若两者在判定任务成功或失败上的一致性达到较高水平，则说明自动化生成评测接口具有实际可行性。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Xiuhui Zhang\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Yi Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shusheng Xu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Fan Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Huan Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Tongkai Yang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Binhang Yuan\", \"affiliations\": [1, 3], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Ant Group\"},\n    {\"id\": 2, \"name\": \"Beihang University\"},\n    {\"id\": 3, \"name\": \"HKUST\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "自主软件生成（Autonomous software generation, ASG）旨在将人类需求转化为可执行的应用程序，但交付这些应用程序并不一定意味着其交互组件满足指定的行为需求。我们引入了 GameASG-Bench，这是一个将行为可测试性作为游戏开发生成任务一部分的评测基准。我们的设计在生成之前声明评估接口规范，固定合法的起始场景、玩家级动作、稳定快照、拒绝行为和不变量，同时保持私有实现的开放性。具体而言，我们包括：(i) 评估源码级合规性的静态 L1 检查；以及 (ii) 结合语义观察、真实输入和运行时证据的浏览器执行 L2 检查。我们将此协议实现为 47 个浏览器原生游戏生成任务，涵盖 12 种主要游戏类型以及 2D 和 3D 交互，每个任务都包含可执行检查和独立验证的参考实现。我们的实验回答了关于端到端智能体性能、工具访问权限与名义回合预算、推理工作量以及测试框架（harness）选择的四个关键问题。在九个智能体技术栈中，观察到的最高平均 L2 检查通过率为 93.2%，然而观察到的最高严格任务成功率（要求通过所有 L1 检查以及适用的 L2 前置和核心要求检查）仅为 55.3%（26/47 个任务）。对于 DeepSeek-V4-Flash，完全的工具访问权限和更大的名义回合预算能带来更多的严格任务成功，而严格任务成功率与推理工作量之间并非单调关系。两种测试框架均实现了 18 次严格任务成功，但仅有十个任务在两种框架下均取得成功。这些结果暴露了任务级别的合规性差距，而高平均检查通过率实际上掩盖了这些差距。"}]}, {"name": "Agent Reinforcement Learning", "count": 3, "papers": [{"title": "ArenaFlow: From Trajectory Ranking to Hierarchical Credit Propagation for Open-Ended Agent RL", "arxiv_id": "2609.21378", "authors": "Qiang Zhang, Ruixue Ding, Fanrui Zhang, Xi Chen, Boli Chen, Shihang Wang, Yinfeng Huang, Yi Zheng, Pengjun Xie, Kaipeng Zhang, Jiawei Liu, Zheng-Jun Zha", "summary": "Reinforcement learning has substantially improved large language model (LLM) agents in verifiable domains, but remains difficult to apply to open-ended agent tasks, where solutions are diverse and reliable scalar rewards are hard to obtain. Recent pairwise evaluation methods alleviate reward discrimination collapse by replacing pointwise scoring with relative preferences. However, they still compress rich comparative feedback into a single trajectory-level reward, obscuring decisive intermediate steps and preventing successful behaviors from being consolidated into reusable skills. We propose ArenaFlow, a hierarchical credit propagation framework for open-ended agent reinforcement learning. ArenaFlow leverages tournament-based relative ranking to derive trajectory-level reward signals. Each comparison is further equipped with structured reflective evaluation, which reveals three types of supervision: pivotal success steps, reusable strategy skills, and usage attribution of retrieved skills. At the step level, ArenaFlow propagates trajectory-level advantages to high-confidence pivotal steps according to tournament survival depth, enabling more targeted optimization of local reasoning behaviors. At the skill level, ArenaFlow estimates skill utility from group-level usage attribution and maintains a global skill memory through utility-aware updating, pruning, and retrieval. The resulting high-utility skills further serve as policy priors for future exploration. Extensive experiments validate ArenaFlow's effectiveness on open-ended agent tasks.", "category": "cs.CL", "cluster": "Agent Reinforcement Learning", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了 ArenaFlow，一个用于开放式 LLM 智能体强化学习的层级信用传播框架。论文明确针对 LLM Agents 在开放式任务中的训练难题，提出了基于锦标赛的轨迹排序机制，并引入了结构化反思评估。这直接对应了研究焦点中的“单智能体”和“自我演化”方向：首先，它涉及智能体的技能获取和记忆机制，通过提取可重用的策略技能并维护全局技能记忆库（包含更新、剪枝和检索），实现了经验的积累与复用；其次，它通过将高效用技能作为未来探索的策略先验，展现了智能体自我演化和迭代完善的能力。根据筛选标准第一步和重要校准，明确围绕 LLM Agents 展开的 agent training/RL 以及涉及 memory、skill acquisition 的研究应予以保留。该论文不涉及被排除的安全、多模态、图技术或纯系统工程等领域，完全符合“训练或演化 LLM 智能体”的研究目标。", "intro_logic": "### § 1 研究问题与重要性\n论文解决如何将强化学习有效应用于开放式智能体任务的问题。在这类任务（如深度研究报告生成和个性化旅行规划）中，解空间庞大且缺乏可靠的标量奖励，导致模型难以进行有效优化。解决该问题不仅能实现更细粒度的局部策略优化，还能将成功经验固化为可复用技能，从而显著提升智能体在复杂长程任务中的探索效率和最终表现。\n\n### § 2 前人工作与不足\n针对开放式任务的奖励获取难题，已有方法如ArenaRL和Pref-GRPO采用成对比较或锦标赛排名来提供相对偏好信号，缓解了绝对评分导致的奖励区分度崩溃。然而，这些方法仅将偏好信号用于轨迹级别的整体评估，并将单一优势均匀分配给所有推理步骤。这导致决定性的关键步骤被琐碎步骤稀释，且评估中揭示的成功模式在比较后被直接丢弃，未能转化为指导未来探索的可复用经验。\n\n此外，传统信用分配方法如过程奖励模型通常依赖对中间步骤的客观验证。但在开放式任务中，中间推理过程和最终输出都难以进行明确的规则验证，使得这些方法无法直接适用。", "core_insight": "### § 3 重建作者的思考路径\n\n作者可能注意到，LLM 裁判做成对比较时天然会产出比\"谁赢\"更丰富的判断——哪一步决定了胜负、什么策略值得记住——但现有方法只取最终偏好，丢弃了这些诊断信息。长序列中统一分配轨迹级优势会让关键步骤信号被稀释，这是信用分配的经典难题。技能进化领域已有证据表明，把成功经验蒸馏为可复用技能能改善长期探索。串联这些线索：如果让裁判额外输出结构化反思，就能同时获得步骤级和技能级的细粒度信用信号。\n\n### § 4 核心直觉\n\n比较反馈本身已包含\"哪步关键\"和\"什么策略可复用\"的信息，只是被压缩成了单一奖励。ArenaFlow 的核心直觉是：把轨迹级偏好信号沿两个方向展开——向下传播到裁判指认的关键步骤，用锦标赛存活深度作为置信度权重；向外传播到被归因使用的技能，用使用频率估计其效用。这样既避免长序列中的信用稀释，又让成功模式固化为可检索的探索先验。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n    ┌────── 技能记忆 B ──────┐\n    ▼ (检索)          ▲ (更新)\n用户查询 ─▶ 策略模型πθ ─▶ 轨迹组(N=16)\n                              │\n                              ▼\n               锦标赛式相对排名 → 轨迹级优势\n                              │\n                    结构化反思评估\n                   ┌────┼────┐\n               关键步骤 可复用 技能归因\n                   │         │\n        步级信用传播   技能级信用传播\n        (深度加权)    (效用/剪枝)\n                   │         │\n                   ▼         ▼\n                策略优化   效用更新\n```\n\nArenaFlow 的完整流程包含六个环节，训练与推理共享同一套轨迹生成与评估管线，区别在于训练阶段额外执行信用传播与策略更新。\n\n**技能检索与轨迹生成。** 给定用户查询，先从全局技能记忆 $B$ 中经语义召回加效用重排序检索 top-$k$=3 个高效用技能，注入策略模型 $\\pi_\\theta$ 的系统提示，生成 $N$=16 条候选轨迹（§3.5, §3.1）。\n\n**锦标赛式相对排名。** 采用种子单淘汰锦标赛，先以贪心解码轨迹为锚点建立初始排名先验，再通过两两比较得到组内排名，转换为分位数式奖励并经组内归一化得到轨迹级优势 $A_i$（§3.1）。\n\n**结构化反思评估。** 裁判模型 $J$ 在每轮两两比较中不仅输出偏好决策，还产出三类结构化反馈：关键成功步骤、可复用技能、以及检索技能的使用归因（§3.2）。\n\n**步级信用传播。** 以锦标赛生存深度为置信度指标——越深轮次识别的关键步骤权重越高，因为它们支撑了对更强对手的胜利。将轨迹级优势经深度加权传播到高置信关键步骤，再经轨迹内归一化得到步级优势 $A_i[k]$（§3.3）。\n\n**技能级信用传播。** 仅当裁判明确将某检索技能归因于关键成功步骤时才赋予信用。组级归因信用经归一化后在线更新技能效用估计 $U_s$；效用为负且评估次数超过阈值 $K$=5 的技能被剪枝出主动检索池（§3.4）。\n\n**策略优化与技能演化。** 用步级优势以 PPO 式目标优化策略；同时将冠军轨迹提取的子技能由 LLM 融合为元技能，经版本感知替换更新记忆 $B$。高效用技能在下一轮作为先验检索，形成闭环（§3.6, §3.4）。\n\n### § 6 核心数学推导\n\n论文的核心数学关系围绕\"如何将轨迹级偏好信号分层传播到步级和技能级\"展开。\n\n**轨迹级优势**采用组内归一化：$A_i = (r_i - \\mu_r) / \\sigma_r$，其中 $r_i$ 是基于锦标赛排名的分位数式奖励，$\\mu_r$、$\\sigma_r$ 为组内均值和标准差。这一步的直觉是消除不同查询间奖励尺度差异，使优势信号可比。\n\n**深度置信权重**定义为 $\\omega_m = e^{\\eta \\cdot m/D} \\big/ \\sum_{j=1}^{D} e^{\\eta \\cdot j/D}$，其中 $D$ 为锦标赛总深度，$m$ 为当前轮次，$\\eta$ 控制加权锐度。直觉是：锦标赛越深，对手越强（因为弱者已被淘汰），在此轮获胜所识别的关键步骤越可信，因此赋予更高权重。\n\n**步级优势**最终形式为 $A_i[k] = A_i \\cdot g_i[k]$，其中 $g_i[k]$ 是经轨迹内归一化的关键步骤信用。这一设计保留了全局偏好方向（正/负轨迹级优势），同时选择性地放大关键步骤的学习信号，避免将优势均匀分配到所有步骤导致关键行为被稀释。\n\n**技能效用**以在线平均方式更新：$U_s \\leftarrow (n_s \\cdot U_s + z_s[x]) / (n_s + 1)$，其中 $n_s$ 为历史评估次数，$z_s[x]$ 为当前归一化后的技能信用。直觉是随评估次数增加，效用估计趋于稳定，新技能不会因单次表现被过早判定。\n\n**主动检索池**定义为 $B_{\\text{active}} = \\{s \\in B \\mid U_s \\geq 0 \\text{ 或 } n_s \u003C K\\}$，即只有被评估至少 $K$ 次且效用仍为负的技能才被移除。这一预热机制避免新技能在样本不足时被误删。\n\n**效用感知重排序**分数为 $\\text{score} = \\text{Sim}(x, s) + \\lambda \\cdot U_s$，$\\lambda$=0.2 平衡查询语义相关性与历史经验效用。\n\n### § 7 实验设计与结论\n\n**分层信用传播是否优于仅轨迹级偏好优化？** 在 Open-Travel 和 Open-DeepResearch 上，用相同骨干模型 Qwen3-8B 和裁判 Qwen3-Max，将 ArenaFlow 与 ArenaRL、Pref-GRPO、GRPO 等对比。结果显示 ArenaFlow 在两个基准上均大幅领先：Open-Travel 均值从 ArenaRL 的 35.9 提升至 55.4，且无需冷启动 SFT 数据即超越 Pref-GRPO 23.2 分。这表明将比较反馈传播到关键步骤和可复用技能，比压缩为单一轨迹级奖励提供了更有效的监督。\n\n**步级和技能级信用各自的贡献如何？** 通过消融实验分别移除步级信用、技能级信用、技能记忆和深度权重。移除技能记忆退化最大（55.4→41.2），说明可复用技能作为探索先验至关重要；移除步级信用降至 48.6，证实轨迹级优势在长程任务中存在信用稀释；深度权重的移除则验证了深轮关键步骤确实更可靠。两个层级的信用传播具有协同效应。\n\n**学到的技能能否泛化到更难的任务？** 在 Open-DeepResearch 上训练后，于 DeepResearch Bench（100 个博士级研究任务、22 个领域）上评测。ArenaFlow 获 43.2 分，优于 ArenaRL 5.6 分、Pref-GRPO 9.1 分，与 Grok Deeper Search、Perplexity Deep Research 等专有系统竞争。这表明 ArenaFlow 学到的是可迁移的研究策略而非基准特定的行为模式。", "additional_insights": "### § 8 阅读收获\nArenaFlow将开放式智能体强化学习的成对比较反馈从单一轨迹级奖励，细化为步级和技能级的分层信用传播。在步级，通过锦标赛存活深度加权，将优势集中到关键推理步骤，避免长序列信号稀释。在技能级，通过结构化评估对检索技能进行使用归因，动态更新全局技能记忆，为未来探索提供高效用先验。该方法在Open-Travel等任务上显著优于仅用轨迹级偏好的基线，且无需冷启动数据。\n\n### § 9 最脆弱的假设\nArenaFlow最关键的假设是：LLM裁判能准确识别轨迹中的关键成功步骤，并正确归因检索技能的使用。若裁判归因错误，步级信用传播和技能效用估计都会基于错误信号，直接误导策略优化。在实际复杂任务中，裁判往往难以准确判断长序列推理的因果关系。论文仅通过200个样本验证了约77.8的平均F1分数，缺少在更长或更专业任务上的鲁棒性证据，若该分数大幅下降，整个框架的优化效果将失效。\n\n### § 10 最小复现实验\n一周内可设计离线评估实验验证裁判可靠性。使用Open-Travel基准中的50对轨迹，调用与论文相同的裁判模型进行结构化反思评估，输出关键成功步骤和技能归因。随后人工标注这些轨迹的真实关键步骤和技能使用情况，计算两者的F1分数。若F1分数显著低于论文报告的79.5，则说明裁判在特定数据上不可靠，动摇其分层信用传播的基础；若分数接近，则支持该核心假设。", "research_value": "### § 11 最强反例设计\n如果早期决策决定全局成败，ArenaFlow的深度加权机制可能会可预测地失效。在长程任务中，若首步选错方向，后续执行再精细也毫无价值；但裁判模型可能因后续步骤看似合理而给予高排名，导致深度加权将信用错误分配给后期的琐碎步骤。为检验这一替代解释，可构造一组包含明确早期关键决策点的合成任务，对比ArenaFlow与均匀分配基线的早期决策准确率。若ArenaFlow在早期决策上显著劣于基线，则证明锦标赛深度加权在特定任务结构下会误导策略优化。\n\n### § 12 后续研究设想\nArenaFlow高度依赖裁判模型的主观归因，这在长序列任务中容易产生误差。后续研究可探索引入反事实验证来校准信用传播：对裁判识别出的关键步骤进行扰动并重新生成轨迹，若最终排名显著下降，则确认该步骤的关键性。这一改变将信用分配从主观判断转变为基于扰动结果的客观验证，有望提升复杂任务中的鲁棒性。首个对照实验可在Open-Travel上对比原始方法与加入反事实验证的变体，评估策略模型的最终表现及归因准确率。若变体在长程任务中表现更优，则说明客观校准能有效弥补裁判的归因缺陷。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Qiang Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ruixue Ding\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Fanrui Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xi Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Boli Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shihang Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yinfeng Huang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yi Zheng\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Pengjun Xie\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Kaipeng Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiawei Liu\", \"affiliations\": [], \"markers\": [\"‡\"]},\n    {\"name\": \"Zheng-Jun Zha\", \"affiliations\": [], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Alibaba Token Hub\"},\n    {\"id\": 2, \"name\": \"Amap\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Project leader\"},\n    {\"marker\": \"‡\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "强化学习在可验证领域显著提升了大型语言模型（LLM）智能体的表现，但在开放式智能体任务中仍难以应用，因为此类任务的解决方案多种多样，且难以获得可靠的标量奖励。最近的成对评估方法通过用相对偏好替代逐点打分，缓解了奖励区分度坍缩（reward discrimination collapse）的问题。然而，它们仍然将丰富的比较反馈压缩为单一的轨迹级奖励，掩盖了决定性的中间步骤，并阻碍了成功行为被固化为可复用的技能。我们提出了ArenaFlow，一个用于开放式智能体强化学习的分层信用传播框架。ArenaFlow利用基于锦标赛的相对排名来推导轨迹级奖励信号。每次比较还配备了结构化反思评估，这揭示了三种类型的监督：关键成功步骤、可复用的策略技能以及检索技能的使用归因。在步骤级别上，ArenaFlow根据锦标赛存活深度将轨迹级优势传播到高置信度关键步骤，从而实现对局部推理行为更具针对性的优化。在技能级别上，ArenaFlow从组级别使用归因中估计技能效用，并通过效用感知的更新、剪枝和检索来维护全局技能记忆。由此产生的高效用技能进一步作为未来探索的策略先验。广泛的实验验证了ArenaFlow在开放式智能体任务上的有效性。"}, {"title": "Boosting Deepresearch and LongContext Ability with Self-Generated Deepresearch Rollouts Traces", "arxiv_id": "2609.20844", "authors": "Zihan Wang, Hao Wang, Boyuan Jiang, Yiqun Zhang, Shi Feng, Xiaocui Yang, Yiwen Ye, Jianghang Lin, Xiaozhong Ji, Jinghao Lin, Kai Wu", "summary": "Deepresearch (DR) agents interact with real-world web environments through multi-turn search and visit, causing their contexts to grow rapidly over time. We observe that, even after DR Agentic Reinforcement Learning (DR-RL), 61.6% of the model's remaining prediction errors can still be attributed to insufficient long-context understanding, including longcontext hallucination and failures in cross-document evidence integration. It motivates us to further break the bottleneck of DR-RL by strengthening the model's long-context ability. However, effective LongContext training requires more than simply increasing context length. To bridge the data gap, we propose `DR Rollouts to LongContext-QA (DR-to-Long)'. The method repurposes DR-RL trajectories, which naturally contain search histories, visited webpages, evidence snippets, and final-answer supervision. It then replaces the compact snippets and webpage summaries in each trajectory with the full contents of their corresponding URLs, producing substantially longer multi-document contexts while preserving the original evidence relationships. Building on DR-to-Long, we introduce DLD (DR -\u003E LongQA -\u003E DR)-RL. DLD-RL first performs a short DR-RL stage to collect rollout trajectories, which are then converted into LongQA instances at zero annotation cost. The model is subsequently optimized with LongQA-RL to strengthen LongContext ability, followed by full DR-RL to continue improving its DR capability. Experiments show that DLD-RL outperforms standard DR-RL by 7.3% on three Deepresearch benchmarks and improves performance by 13.5% on three long-context benchmarks.", "category": "cs.CL", "cluster": "Agent Reinforcement Learning", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是提出了一种名为 DLD-RL 的训练方法，通过将 Deepresearch (DR) 智能体生成的轨迹转化为长上下文问答数据，来增强智能体的长上下文理解能力，进而提升其 Deepresearch 能力。论文明确以 LLM 智能体为研究对象，研究焦点在于智能体的训练和自我改进。这符合筛选标准中“保留”规则关于“agent training/distillation/RL”和“self-evolving / self-improving / LLMs improving LLMs”的要求。论文利用智能体自身生成的轨迹来迭代优化其能力，属于智能体演化机制的前沿研究，因此完全符合你的研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文要解决的核心问题是：DeepResearch（DR）agents 在经过 Agentic Reinforcement Learning（DR-RL）训练后，仍有 61.6% 的预测错误源于长上下文理解不足，包括长上下文幻觉和跨文档证据整合失败。DR 任务天然涉及多轮搜索与网页访问，上下文随交互步骤持续增长，模型必须在不断膨胀的上下文中重新组织证据、做出下一步决策，因此长上下文理解是 DR 能力的关键基础。解决这一瓶颈不仅能直接提升 DR agents 的任务表现，还能同时增强模型的长上下文推理能力，两者形成相互促进的关系。\n\n### § 2 前人工作与不足\n\n已有的 DR-RL 方法（如 DeepDive、WebSailor、OffSeeker 等）通过强化学习优化模型的搜索、浏览和证据综合行为，能够将 DR 性能推向一定高度。然而，这些方法的正向训练信号主要来自较短的成功轨迹——模型在早期就能准确检索到有用证据并快速完成任务；而较长的轨迹往往涉及重复搜索、无效证据收集或信息混淆，更容易失败，因此模型几乎无法从长轨迹中获得稳定的正向监督，长上下文决策能力得不到充分锻炼。另一方面，高质量长上下文训练数据的构建本身就很困难：需要多个高度相关的源文档、具有挑战性的干扰文档、隐式的跨文档证据链以及可验证的最终答案，这些要素的标注成本极高。正因如此，此前的 DR 训练范式既缺乏数据层面的长上下文训练资源，又在优化机制上偏向短轨迹，导致长上下文理解成为 DR-RL 难以突破的瓶颈。", "core_insight": "### § 3 重建作者的思考路径\n\n作者观察到 DR agents 多轮搜索后上下文急剧增长，但大量错误并非搜索策略失误，而是模型在长上下文中产生幻觉或无法整合跨文档证据。进一步分析发现，标准 DR-RL 的正向信号主要来自短轨迹，长轨迹多因信息混乱而失败，因此难以训练稳定的长上下文决策。高质量长上下文数据又难以人工构建。作者意识到 DR agents 的交互轨迹天然包含多文档、干扰项和可验证答案，只需将压缩摘要展开为完整网页内容即可零标注生成长上下文训练数据。\n\n### § 4 核心直觉\n\nDR agents 的搜索轨迹天然是长上下文 QA 数据的原材料——把网页摘要替换为完整内容，即可零成本获得含多文档和可验证答案的训练实例。先用短阶段 DR-RL 收集轨迹转为 LongQA 数据训练长上下文能力，再恢复 DR-RL，使两种能力相互增强。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\nDR-SFT 模型\n    │\n    ▼\n[Stage 1] DR-RL (Warm) ──→ rollout 轨迹\n                              │\n                              ▼\n                   [Stage 2] DR-to-Long\n                   ├─ 成功轨迹→展开URL→LongQA\n                   └─ 失败轨迹+成功证据→增强LongQA\n                              │\n                              ▼\n    ┌────────────[Stage 3] LongQA-RL (+KL正则)\n    │                         │\n    │                         ▼\n    └────────────[Stage 4] DR-RL (Full)\n                              │\n                              ▼\n                          最终模型 π*\n```\n\n**Stage 1（DR-RL 热身）** 对应正文 Sec. 4.2 及 Alg. 1 Stage 1。从 DR-SFT 模型出发，用 GRPO 进行短阶段强化学习，模型通过 Search 和 Visit 工具与 Web 多轮交互。此阶段不训练到收敛，核心目的是收集成功与失败的 rollout 轨迹，包括搜索查询、访问的 URL、压缩的网页摘要和最终回答。\n\n**Stage 2（DR-to-Long 数据构造）** 对应 Sec. 4.3 及 Alg. 1 Stage 2。对每条轨迹提取通过 Search 和 Visit 收集的网页，重新访问这些 URL 获取完整网页内容，替换原来的摘要和片段，拼接成长上下文。成功轨迹直接转换，因为其上下文已包含足够证据；失败轨迹则用同一问题的成功轨迹中的高价值搜索片段和网页摘要进行增强，在确保答案可推导性的同时保留更高难度。最终上下文长度控制在 64K–128K tokens。\n\n**Stage 3（LongQA-RL）** 对应 Sec. 4.4 及 Alg. 1 Stage 3。在构造的长上下文 QA 数据上用 GRPO 继续训练，但不提供搜索和访问工具，模型直接基于长上下文生成答案，聚焦证据定位与跨文档整合。为保留前一阶段习得的多轮工具使用能力，引入冻结的热身策略作为参考进行 KL 正则化，防止策略过度偏移。\n\n**Stage 4（DR-RL 完整训练）** 对应 Sec. 4.5 及 Alg. 1 Stage 4。用长上下文增强后的模型初始化，恢复标准 DR-RL 训练直到性能饱和。此阶段作为退火过程，将增强的长上下文能力重新对齐到 DR 目标，转化为更有效的搜索和浏览行为。\n\n### § 6 核心数学推导\n\n论文采用 GRPO 作为两个 RL 阶段的优化算法。GRPO 的核心思想是：对同一问题采样一组轨迹，用组内归一化的优势值（advantage）评估每条轨迹的相对质量，再通过 clip 机制限制策略更新幅度以保持训练稳定。在 DR-RL 阶段，奖励为二值——最终答案匹配参考答案得 1 否则得 0，且不使用 KL 正则化。在 LongQA-RL 阶段，目标函数额外加入 KL 散度正则项，用冻结的热身策略作为参考策略，系数 β（实验中设为 0.005）控制正则强度，目的是在增强长上下文能力的同时防止遗忘已习得的工具使用行为。\n\n### § 7 实验设计与结论\n\n**长上下文理解是否是 DR 的核心瓶颈，标准 DR-RL 能否克服？** 研究者用更强的语言模型分析了 1000 条错误预测轨迹，并在相同总训练步数下对比 DR-RL 和 DLD-RL。分析显示 61.6% 的错误与长上下文理解不足有关，包括证据幻觉和跨文档整合失败；DLD-RL 在三个 DR 基准上平均相对提升约 7.3%，在三个长上下文基准上提升约 13.5%，证明显式增强长上下文能力可以突破 DR-RL 的性能天花板。\n\n**失败轨迹构造的训练数据是否比成功轨迹更有价值？** 消融实验移除了由失败轨迹构造的 LongQA 实例，仅保留成功轨迹数据。结果显示移除后 DR 和长上下文性能均下降，因为失败轨迹包含更多无关、误导或冲突文档，提供了更难的干扰项和更复杂的跨文档关系，训练信号更强。\n\n**长上下文能力增强如何影响 DR 工具使用行为？** 研究者统计了模型在 BrowseComp 上的工具使用频率。LongQA-RL 后，模型减少了冗余搜索查询（相似搜索比例下降），增加了 Visit 工具的使用频率，表明更强的长上下文理解使 agent 更倾向于深入检查有潜力的网页而非反复搜索相似信息。", "additional_insights": "### § 8 阅读收获\n标准的Deepresearch强化学习（DR-RL）主要从较短的交互轨迹中获得正向信号，导致模型在长上下文理解上存在瓶颈。将DR轨迹中的网页摘要替换为完整网页内容，可零标注成本构造高质量的长上下文问答数据。通过DR-RL、长上下文RL、DR-RL的交替训练，能同时提升模型的深度搜索与长上下文推理能力，且两者相互促进。\n\n### § 9 最脆弱的假设\n核心假设是：DR agent访问的网页完整内容能构成有效的长上下文训练数据，即使对于失败轨迹，也能通过补充成功轨迹的摘要来保证信息充足。如果失败轨迹引入的无关网页噪音过大，模型在LongQA-RL阶段可能无法学到跨文档推理，反而被噪音误导。论文虽展示了整体性能提升，但未充分证明在极端噪音或信息极度分散的情况下，这种数据构造方法依然有效。\n\n### § 10 最小复现实验\n使用开源DR轨迹数据集，提取其中的URL并抓取完整网页内容，替换原有的网页摘要，构造一批64K至128K token的长上下文问答数据。将一个基础模型在这批数据上进行监督微调，然后在LongBench-v2等长上下文基准上测试。如果模型得分显著提升，则支持“DR轨迹可低成本转化为有效长上下文训练数据”的结论；如果得分无变化或下降，则说明该数据的有效性高度依赖特定的强化学习过程。", "research_value": "### § 11 最强反例设计\n如果我要挑战这篇论文，我会质疑模型在 LongQA-RL 阶段提升的究竟是跨文档推理能力，还是仅仅学会了定位被人工插入的高价值摘要。我会设计一个对照实验：保留失败轨迹增强的数据构造流程，但将补充的成功证据替换为与问题无关但格式相似的干扰文本。如果模型在“伪增强”数据上训练后，长上下文基准表现与原方法相当，就说明模型并未真正学会整合分散证据，而是依赖了被显式插入的线索，这为论文结果提供了具体的替代解释。\n\n### § 12 后续研究设想\n围绕失败轨迹可能引入过多无关网页噪音这一局限，一个值得检验的问题是：在构造长上下文数据时主动过滤无关网页，是否会比直接拼接完整内容更有效？具体做法是在 Stage 2 中，先用独立模型剔除失败轨迹中与问题无关的网页，再补充成功证据。这能验证失败轨迹的价值是源于“高难度干扰项”还是“噪音掩盖了有效信号”。首个对照实验可比较原始 DLD-RL 与过滤版在 LongBench-v2 上的表现，若过滤版显著提升，则说明原始方法对噪音的容忍度被高估。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zihan Wang\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Hao Wang\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Boyuan Jiang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Yiqun Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shi Feng\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Xiaocui Yang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yiwen Ye\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Jianghang Lin\", \"affiliations\": [5], \"markers\": []},\n    {\"name\": \"Xiaozhong Ji\", \"affiliations\": [6], \"markers\": []},\n    {\"name\": \"Jinghao Lin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Kai Wu\", \"affiliations\": [7], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Northeastern University\"},\n    {\"id\": 2, \"name\": \"City University of Hong Kong\"},\n    {\"id\": 3, \"name\": \"Zhejiang University\"},\n    {\"id\": 4, \"name\": \"Northwestern Polytechnical University\"},\n    {\"id\": 5, \"name\": \"Xiamen University\"},\n    {\"id\": 6, \"name\": \"Nanjing University\"},\n    {\"id\": 7, \"name\": \"Tongji University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"These authors contributed equally.\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author.\"}\n  ]\n}\n```", "summary_translation": "Deepresearch (DR) 智能体通过与真实网络环境进行多轮搜索和访问来交互，导致其上下文随时间快速增长。我们观察到，即使在经过 DR 智能体强化学习（DR-RL）之后，模型剩余预测错误中的 61.6% 仍可归因于长上下文理解能力不足，包括长上下文幻觉和跨文档证据整合失败。这促使我们通过增强模型的长上下文能力来进一步突破 DR-RL 的瓶颈。然而，有效的长上下文训练不仅仅是简单地增加上下文长度。为了弥补数据空白，我们提出了“DR Rollouts to LongContext-QA (DR-to-Long)”方法。该方法重新利用 DR-RL 的轨迹，这些轨迹自然包含了搜索历史、访问的网页、证据片段以及最终答案的监督信号。然后，它将每条轨迹中的紧凑片段和网页摘要替换为其对应 URL 的完整内容，从而生成明显更长的多文档上下文，同时保留原始的证据关系。基于 DR-to-Long，我们引入了 DLD (DR -\u003E LongQA -\u003E DR)-RL。DLD-RL 首先执行一个短期的 DR-RL 阶段以收集 rollout 轨迹，随后以零标注成本将其转换为 LongQA 实例。接着，使用 LongQA-RL 对模型进行优化以增强长上下文能力，最后进行完整的 DR-RL 以继续提升其 DR 能力。实验表明，DLD-RL 在三个 Deepresearch 评测基准上比标准 DR-RL 高出 7.3%，并在三个长上下文评测基准上提升了 13.5% 的性能。"}, {"title": "CodeMidas: Scaling Agentic Coding RL Environments from Code Itself", "arxiv_id": "2609.22068", "authors": "Bowen Ye, Lei Li, Shicheng Li, Zihao Yue, Linghao Zhang, Hanglong Lv, Yuanxin Liu, Wenhan Ma, Hao Tian, Rang Li, Jinhao Dong, Yikai Zhao, Xiangwei Deng, Hailin Zhang, Liang Zhao, Qi Liu, Lingpeng Kong, Tong Yang, Fuli Luo", "summary": "Training capable coding agents via reinforcement learning (RL) requires diverse tasks with reliable verifiers. Open-source codebases offer a rich source of such tasks, while existing methods typically rely on development artifacts such as issues and commits, limiting the range of tasks that can be extracted. To better scale RL environments, we present CodeMidas, an agentic pipeline that turns implemented functionality in existing codebases into executable RL environments using source code as its only task-specific input. CodeMidas allocates agentic compute to every stage of environment construction: agents explore implemented functionality to formulate behavioral specifications, construct tests grounded in execution of the original code, and validate and filter candidate tasks through execution checks and repeated solution rollouts. The resulting dataset has 5,545 training tasks from 3,185 open-source codebases spanning 23 programming languages and 15 technical domains. Training MiMo-V2.5 on these tasks with GRPO improves performance on all five diverse benchmarks, covering issue repair (DeepSWE + 11.7%), whole-program construction (ProgramBench +17%), and terminal work (Terminal-Bench v2.1 +8.5%). Ablations show that increasing the number of high-quality training tasks improves performance. Trajectory analysis shows the RL-trained agent demonstrates better behaviors like increasing codebase exploration and more diverse self-verification. These results establish source code as a scalable foundation for constructing RL environments that improve coding agents across diverse software tasks.", "category": "cs.AI", "cluster": "Agent Reinforcement Learning", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n论文解决如何仅以源代码为输入，自动将开源代码库中已实现的功能转化为可执行的强化学习（RL）环境。训练强大的编码智能体需要多样化的任务和可靠的验证器，而现有方法受限于开发记录的覆盖率。直接从源代码构建RL环境能突破这一瓶颈，大规模生成带有可靠测试的任务，从而提升智能体在问题修复、完整程序构建和终端操作等多种真实软件工程任务上的泛化能力。\n\n### § 2 前人工作与不足\n此前构建编码RL环境的方法主要依赖开发产物或现有测试。例如，SWE-bench 和 R2E-Gym 从 issues、pull requests 或 commits 中提取任务，而 SWE-smith 和 MindForge 则围绕现有测试或文档合成任务。这些方法的不足在于，任务的创建被严格绑定在已记录的变更、测试或文档的覆盖率上。由于大量已实现的功能并未留下对应的开发记录或测试，这种依赖极大限制了可提取任务的规模与多样性。CodeMidas 仅需源代码即可推导行为规范和基于执行的测试，成功绕过了对开发记录的依赖。", "core_insight": "### § 3 重建作者的思考路径\n作者可能观察到，现有构建代码智能体强化学习环境的方法严重依赖GitHub的开发记录（如issue、PR或现有测试），这限制了可提取任务的规模。然而，开源代码库中真正庞大且未被充分利用的资源是已实现的功能本身。如果能直接从源码中提取这些功能，将其转化为“待实现”的任务，并用原代码的执行结果作为测试基准，就能突破数据瓶颈。难点在于如何确保测试只验证外部行为而不限制内部实现，并防止智能体通过残留的缓存文件作弊。\n\n### § 4 核心直觉\n核心直觉是将已实现的源代码本身作为构建RL环境的唯一原料。通过执行原始代码来捕获其外部行为作为测试标准，同时移除核心实现以形成任务起点。这样既绕过了对开发记录的依赖，又保证了验证器的可靠性，让智能体在真实的代码库结构中学习如何从零实现功能。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[源代码 Source Code]\n       |\n       v\n+-------------------+\n| 1. 任务设计       |  --\u003E 任务陈述 + 初始代码库\n| (Task Design)     |\n+-------------------+\n       |\n       v\n+-------------------+\n| 2. 测试构建       |  --\u003E 基于执行的测试\n| (Test Constr.)    |\n+-------------------+\n       |\n       v\n+-------------------+\n| 3. 执行一致性     |  --\u003E 验证 fail-to-pass\n| (Exec. Consist.)  |\n+-------------------+\n       |\n       v\n+-------------------+\n| 4. 后回滚过滤     |  --\u003E 泄漏/审查/结果过滤\n| (Post-rollout)    |\n+-------------------+\n       |\n       v\n[高质量 RL 环境]\n```\n\nCodeMidas 仅以源代码作为特定任务输入，通过四个模块构建可执行的强化学习环境（§3）。\n\n1. **任务设计**（§3.1）：Agent 检查代码库结构与构建元数据，识别具有公共入口和可观测结果的功能。它移除核心实现并调整剩余代码，生成任务陈述和开发起点，同时保留原始实现作为参考解。\n2. **测试构建**（§3.2）：Agent 将行为需求映射为测试输入和边界情况，在参考代码副本上执行公共入口并记录结果。测试断言基于参考执行建立预期值，随后审查并移除不受陈述支持的过度限制。\n3. **执行一致性**（§3.3）：在全新容器中检查任务，确保初始代码库两次运行均失败，而参考解四次运行均通过，以此验证预期的 fail-to-pass 转换并筛除不稳定任务。\n4. **后回滚过滤**（§3.4）：在 RL 训练前，通过对抗性回滚探测可利用的泄漏，审查 agent 生成的解以检查验证器缺陷，并仅保留既有成功也有失败尝试的任务，最终输出高质量 RL 环境。\n\n### § 7 实验设计与结论\n\n**问题**：从源代码构建的 RL 环境能否提升模型在多种软件任务上的表现？\n**实验**：在 5,545 个任务上使用 GRPO 算法训练 MiMo-V2.5，并在五个外部基准上评测。\n**答案**：所有基准均有提升，如 DeepSWE 提升 11.7 个百分点，ProgramBench 提升 17 个百分点，证明源代码派生的任务能提供跨任务的强训练信号。\n\n**问题**：任务规模和质量如何影响效果？\n**实验**：对比 1k、3k、5k 高质量任务集与 8k 未过滤任务集的训练效果。\n**答案**：高质量任务越多效果越好，5k 高质量集优于 8k 未过滤集，证明环境清洗和后回滚过滤提供的可靠性比单纯增加任务数量更重要。\n\n**问题**：RL 训练后 agent 的行为有何变化并是否泛化？\n**实验**：分析训练轨迹中的代码库探索、代码草拟和自我验证行为，并在外部任务上对比早期和晚期检查点。\n**答案**：训练后 agent 探索更多、自我验证更多样化，且这些行为变化在外部任务上也出现，证明行为泛化。", "additional_insights": "### § 8 阅读收获\nCodeMidas仅以源代码为输入，通过移除核心实现并生成行为规范，将开源代码库转化为可执行的强化学习环境，摆脱了对issue或现有测试等开发产物的依赖。它通过执行原始代码生成测试，并结合对抗性rollout和一致性检查过滤不可靠任务。在5,545个任务上训练MiMo-V2.5后，模型在5个外部基准上均有提升，证明从代码派生的任务能跨软件工作类型泛化。消融实验显示，3k高质量任务优于8k未过滤任务，表明任务质量比数量更重要。\n\n### § 9 最脆弱的假设\n核心假设是智能体能仅通过分析源代码，准确识别功能边界并生成既能拒绝错误实现又能接受正确替代实现的测试。若该假设不成立，测试会过于严格或宽松，导致奖励信号不可靠，训练失效。在实际中，代码功能常隐含于复杂上下文和跨文件依赖中，智能体可能无法完全理解所有边界条件。论文通过执行一致性检查和后置rollout过滤提供间接证据，但缺少对测试严格性或宽松性的直接量化。\n\n### § 10 最小复现实验\n若有一周时间，可验证高质量任务是否比未过滤任务提供更有效的训练信号。从GitHub选取约50个Python代码库，用LLM移除核心实现并生成测试，进行简单的执行一致性检查。在小规模模型上分别用过滤后和未过滤任务训练，测量保留任务上的通过率。若过滤后任务训练的模型通过率更高，则支持原结论；若无差异或未过滤任务更好，则反驳该结论。此实验保留任务生成和过滤的核心逻辑，但缩小数据规模。", "research_value": "### § 11 最强反例设计\n如果我要攻击这篇论文，我会挑战其生成的测试是否过度绑定原始实现的具体代码风格，而非真正的功能规范。具体实验是：从生成的任务中抽样，让人类专家编写与原实现逻辑不同但功能等价的代码，测试其能否通过验证器。如果大量等价实现被判定为失败，说明测试过于严格，仅要求模型复刻原代码。这将提供替代解释：模型在外部基准上的提升，可能是因为学会了模仿特定代码模式，而非真正掌握了泛化的工程能力。\n\n### § 12 后续研究设想\n一个关键局限是，基于原始代码执行结果生成的测试，可能无法捕捉完整的行为规范，导致验证器存在盲区。后续研究可以问：在测试构建阶段引入实现多样性验证，能否提升RL训练的泛化能力？具体做法是，要求智能体为同一功能生成多个结构不同的等价实现，仅保留所有实现都能通过的测试。首个对照实验可比较原方法与该方法训练的模型，在包含风格迥异但功能正确的代码评测集上的表现。如果新方法训练的模型通过率更高，则证明引入多样性验证有效缓解了测试对特定实现的过拟合。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Bowen Ye\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Lei Li\", \"affiliations\": [1, 3], \"markers\": []},\n    {\"name\": \"Shicheng Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zihao Yue\", \"affiliations\": [1, 4], \"markers\": []},\n    {\"name\": \"Linghao Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hanglong Lv\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Yuanxin Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Wenhan Ma\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Hao Tian\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Rang Li\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Jinhao Dong\", \"affiliations\": [1, 4], \"markers\": []},\n    {\"name\": \"Yikai Zhao\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Xiangwei Deng\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Hailin Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Liang Zhao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Qi Liu\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Lingpeng Kong\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Tong Yang\", \"affiliations\": [2], \"markers\": [\"†\"]},\n    {\"name\": \"Fuli Luo\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"LLM Core, Xiaomi\"},\n    {\"id\": 2, \"name\": \"Peking University\"},\n    {\"id\": 3, \"name\": \"University of Hong Kong\"},\n    {\"id\": 4, \"name\": \"Renmin University of China\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Work done during an internship at Xiaomi.\"},\n    {\"marker\": \"†\", \"text\": \"Co-corresponding authors.\"}\n  ]\n}\n```", "summary_translation": "通过强化学习（RL）训练能力强大的代码智能体需要具有可靠验证器的多样化任务。开源代码库为这类任务提供了丰富的来源，但现有方法通常依赖于诸如议题和提交等开发产物，限制了可提取任务的范围。为了更好地扩展强化学习环境，我们提出了 CodeMidas，这是一个智能体工作流，它以源代码作为唯一的特定任务输入，将现有代码库中已实现的功能转化为可执行的强化学习环境。CodeMidas 将智能体计算分配到环境构建的每个阶段：智能体探索已实现的功能以制定行为规范，基于原始代码的执行构建测试，并通过执行检查和重复的解决方案推演来验证和过滤候选任务。由此产生的数据集包含来自 3,185 个开源代码库的 5,545 个训练任务，涵盖 23 种编程语言和 15 个技术领域。使用 GRPO 在这些任务上训练 MiMo-V2.5 提升了在所有五个不同评测基准上的表现，涵盖议题修复（DeepSWE 提升 11.7%）、全程序构建（ProgramBench 提升 17%）和终端工作（Terminal-Bench v2.1 提升 8.5%）。消融实验表明，增加高质量训练任务的数量可以提升性能。轨迹分析表明，经过强化学习训练的智能体展现出了更好的行为，例如增加代码库探索和更多样化的自我验证。这些结果确立了源代码作为构建强化学习环境的可扩展基础的地位，能够提升代码智能体在多样化软件任务上的表现。"}]}, {"name": "Skill \u0026 Memory Evolution", "count": 3, "papers": [{"title": "Designer-RSI: Evolving Procedural Memory from User Traffic for Agentic Graphic Design", "arxiv_id": "2609.22086", "authors": "Hongyang Du, Lan Yan, Christian Flores, Asim Kadav", "summary": "Professional graphic design is a long-horizon agentic task in which structured, editable artifacts emerge from many interdependent actions, yet outcomes admit no reliable programmatic oracle. We introduce a continual adaptation framework in which a frozen frontier model operates professional design software through more than 230 tools, while an external procedural memory of natural-language skills accumulates and refines reusable design procedures from experience. The memory widens by acquiring procedures for recurring uncovered subtasks and deepens by revising existing procedures against their own successful and failed executions, while a matched replay gate admits only changes that repair failures without regressing observed successes. Five rounds over 1,406 real user briefs and 1,869 automatically graded trajectories, with no weight updates and no human labels, grow the bank from 76 documentation-derived skills to 139 and raise GenEval2 execution success on Claude-Sonnet-4 from 72.7% to 99.3% (+11.99 points in generation quality), with 61.8% and 67.6% win rates against the no-skill agent across four specialized design benchmarks on Claude-Sonnet-4 and Claude-Opus-4.6. We further show t
