时视频上实现了 8.7× 到 26.1× 的轨迹压缩倍数，且查询延迟低于一秒。在 Ego4D natural-language queries 上，该系统达到了 28.75% / 55.10% 的 R@1/R@5，比 EgoVLPv2 高出 15.80 / 31.30 pts。"}]}, {"name": "Multi-Agent Systems", "count": 1, "papers": [{"title": "DCFA: Dual-view Causal-inspired Attribution for Failure Reasoning in LLM-based Multi-agent Systems", "arxiv_id": "2609.04749", "authors": "Zehao Wang, Lanjun Wang, Shilong Jin, Junjie Chen, Yanghua Xiao", "summary": "Large language model (LLM)-based multi-agent systems have experienced rapid growth in recent years. Despite their promise, such systems remain fragile, frequently exhibiting reasoning and coordination errors that can lead to system-level failures. Failure attribution in such systems relies on tracing natural language interactions among agents to identify the decisive error, which refers to the earliest action whose correction can reverse system failure. There are two key challenges: 1) Shallow attribution: Existing methods often capture only minor deviations, such as incomplete retrievals or formatting errors, which verification mechanisms can correct, while missing the decisive cause of system failure. 2) Contextual degradation: As the length of the system traces increases, the model's reasoning ability rapidly deteriorates. To address these challenges, we propose DCFA, a training-free framework for failure attribution. DCFA integrates a global module that constructs structured causal-inspired dependency graphs from system traces to identify the initial decisive error, and a local module that applies local counterfactual-inspired reasoning to refine causal-inspired attribution. Experiments on the Who\u0026When benchmark across six LLMs show that DCFA improves step-level accuracy by up to 8.27% over state-of-the-art baselines.", "category": "cs.AI", "cluster": "Multi-Agent Systems", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior, Multi-Agent)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心研究对象明确为 LLM-based Multi-agent Systems (多智能体系统)，主要贡献是提出了 DCFA 框架，用于在多智能体系统的交互轨迹中进行失败归因，识别导致系统级失败的决定性错误。这属于对多智能体系统的“失败机制诊断”和“行为分析”。根据第一步的保留规则，如果论文研究对象明确是 Multi-Agent LLMs，即使它主要是行为分析、评估基准或失败机制诊断，只要结论直接帮助理解或改进智能体能力，就应保留。理解多智能体系统在协调和推理中的失败原因，对于后续改进智能体的自我反思和协作机制具有重要价值。虽然摘要中提到了构建因果依赖图，但这只是用于表示系统轨迹和进行因果归因的结构化中间工具，并非以知识图谱、图神经网络或图推理为核心研究技术，因此不触发图相关技术的排除规则。", "intro_logic": "### § 1 研究问题与重要性\n\n本文研究的核心问题是在LLM-based multi-agent systems (MAS)中进行failure attribution——即当系统产出与ground truth不符时，从agents之间长序列的自然语言交互记录中，精确定位导致失败的decisive error。Decisive error被严格定义为\"the earliest action whose correction can reverse system failure\"，即若纠正该步交互则系统失败可被逆转；当多个错误共同导致失败时，decisive error是纠正后能最大程度减少失败的那个交互。这一问题之所以重要，是因为LLM-based MAS虽然已在code generation、knowledge search、data analysis等任务中广泛应用，但系统极为脆弱：agents之间的misalignment或improper tool usage会沿system trace传播，引发cascading reasoning errors，最终导致整个workflow崩溃。如果不能准确定位失败的根本原因，开发者就无法有效地修复和改进系统。然而，该问题面临两个根本性挑战：其一是shallow attribution——现有方法倾向于捕捉formatting errors或incomplete retrievals等可通过downstream verification纠正的minor deviations，却忽略了真正驱动系统失败的decisive error，例如agent在关键信息丢失时fabricate缺失内容，这种错误难以被后续验证机制检测并会持续误导整个reasoning chain；其二是contextual degradation——随着trace长度增长，LLM的reasoning能力急剧衰退，Who\u0026When benchmark报告state-of-the-art方法在trace长度为10时step-level accuracy约15%，而接近100时几乎降至0%。解决这一问题不仅能提升MAS的可靠性和可维护性，还能为agent架构设计、context管理策略和tool invocation策略的offline优化提供精确的诊断依据。\n\n### § 2 前人工作与不足\n\nFailure attribution在LLM-based MAS中的现有方法可分为fine-tuning-based和instruction-based两大范式。Fine-tuning-based方法以AgenTracer (Zhang et al., 2026)为代表，通过构建专门数据集训练dedicated models进行failure analysis，虽然controllability强，但需要大量annotation和repeated training，成本高昂且难以泛化。Instruction-based方法则保持training-free，通过精心设计的prompts引导LLM分析system traces。Who\u0026When benchmark (Zhang et al., 2025)提出了三种基础策略：All-at-Once将完整trace一次性输入LLM直接推断decisive error，Step-by-Step逐步检查每个interaction是否出错，Binary-Search递归地将trace二分以缩小范围。此外，ECHO (Banerjee et al., 2025)引入hierarchical context representations和multi-perspective consensus来检测long traces中的subtle deviations，A2P (West et al., 2025)则采用causal-guided scaffold通过abductive hypothesis generation和counterfactual simulation进行attribution。然而，这些方法存在三个层面的根本不足。第一，在shallow attribution方面，ECHO等方法专注于observable errors如tool failures或formatting issues，这些explicit patterns虽能提高detection accuracy，但所检测的deviations往往是minor而非decisive——它们没有建模interactions之间的dependency relationships，因此无法追踪minor deviations如何沿reasoning chain传播并最终转化为irreversible的decisive error。这一缺陷的根源在于现有方法依赖LLM的vanilla reasoning capability，缺乏structured dependency representations来capture interactions之间的latent causal relationships。第二，在contextual degradation方面，所有现有方法都在full trace上进行reasoning，没有localization机制将reasoning聚焦于critical dependency chains，导致long-context下LLM的reasoning能力急剧衰退。A2P虽引入了causal-guided scaffold，但其causal reasoning仍主要通过prompt-induced implicit reasoning实现，对multi-agent interactions中latent dependency relations的sensitivity不足。第三，从问题定义角度，AgentErrorBench with AgentDebug (Zhu et al., 2025)和TRAIL (Deshpande et al., 2025)等相关工作虽看似相似，但AgentErrorBench聚焦于single-agent human-agent interaction中触发cascading reasoning distortions的earliest mistake，TRAIL则识别trajectories中的所有errors——两者均未针对\"correction可逆转系统失败\"这一decisive error的特定定义，因此无法直接应用于MAS中需要区分contributory minor deviations与decisive errors的场景。DCFA正是通过构建causal-inspired dependency graph进行global reasoning以克服shallow attribution，并通过localized counterfactual-inspired evaluation聚焦critical dependency chains以缓解contextual degradation，从而系统性地填补了这些不足。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM-based multi-agent systems (MAS) 中，系统级失败通常源于多个 agent 交互间的级联错误。现有的 instruction-based failure attribution 方法直接让 LLM 阅读整段非结构化的 system trace 来寻找错误，这面临两个直观的困境：首先，LLM 容易被表面上的 minor deviations（如格式错误或检索不全）吸引，而忽略了真正导致不可逆失败的 decisive error；其次，当 trace 长度增加时，LLM 的 long-context reasoning 能力会急剧退化，导致定位精度暴跌。要解决这两个问题，研究者自然会求助于因果推理领域的工具。为了克服 shallow attribution，不能仅凭文本表面特征判断，而需要梳理交互步骤之间的依赖关系，构建一张 causal-inspired dependency graph，以此追踪错误是如何沿着交互链传播并最终导致系统崩溃的。然而，仅靠全局建图仍无法解决长文本带来的 contextual degradation，因为模型在全局图上推理时仍需处理冗长的上下文。此时，counterfactual analysis 提供了一个绝佳的切入点：与其在整个长 trace 上推理，不如基于全局图给出的初始假设，仅在假设错误周围的局部邻域内进行反事实模拟——即假设修正某一步骤，观察最终结果是否因此逆转。这种“全局建图定位大致区域，局部反事实验证具体节点”的思路，恰好将长文本推理拆解为可控的局部因果验证，从而同时规避了浅层归因和长上下文退化两大痛点。\n\n### § 4 核心 Intuition\n\n现有方法失效的根本原因在于：它们要么被表面的 minor deviations 迷惑而忽略了深层因果链，要么在处理长 system trace 时遭遇严重的 contextual degradation。DCFA 的核心 Intuition 是将复杂的全局长文本归因转化为“先全局建图，后局部反事实验证”的双重视角：首先通过构建 causal-inspired dependency graph 将非结构化的交互转化为结构化的因果依赖关系，从而跳出表面错误追踪到真正的错误传播链；随后，不依赖长文本推理，而是仅在初始假设周围的局部邻域内进行 counterfactual-inspired 模拟，通过评估“修正哪一步能最大程度挽回最终结果”来精确定位 decisive error。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《DCFA: Dual-view Causal-inspired Attribution for Failure Reasoning in LLM-based Multi-agent Systems》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 本文研究的核心问题是在LLM-based multi-agent systems (MAS)中进行failure attribution——即当系统产出与ground truth不符时，从agents之间长序列的自然语言交互记录中，精确定位导致失败的decisive error。Decisive error被严格定义为\"the earliest action whose correction can reverse system failure\"，即若纠正该步交互则系统失败可被逆转；当多个错误共同导致失败时，decisive error是纠正后能最大程度减少失败的那个交互。这一问题之所以重要，是因为LLM-based MAS虽然已在code generation、knowledge search、data analysis等任务中广泛应用，但系统极为脆弱：agents之间的misalignment或improper tool usage会沿system trace传播，引发cascading reasoning errors，最终导致整个workflow崩溃。如果不能准确定位失败的根本原因，开发者就无法有效地修复和改进系统。然而，该问题面临两个根本性挑战：其一是shallow attribution——现有方法倾向于捕捉formatting errors或incomplete retrievals等可通过downstream verification纠正的minor deviations，却忽略了真正驱动系统失败的decisive error，例如agent在关键信息丢失时fabricate缺失内容，这种错误难以被后续验证机制检测并会持续误导整个reasoning chain；其二是contextual degradation——随着trace长度增长，LLM的reasoning能力急剧衰退，Who\u0026When benchmark报告state-of-the-art方法在trace长度为10时step-level accuracy约15%...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在 LLM-based multi-agent systems (MAS) 中，系统级失败通常源于多个 agent 交互间的级联错误。现有的 instruction-based failure attribution 方法直接让 LLM 阅读整段非结构化的 system trace 来寻找错误，这面临两个直观的困境：首先，LLM 容易被表面上的 minor deviations（如格式错误或检索不全）吸引，而忽略了真正导致不可逆失败的 decisive error；其次，当 trace 长度增加时，LLM 的 long-context reasoning 能力会急剧退化，导致定位精度暴跌。要解决这两个问题，研究者自然会求助于因果推理领域的工具。为了克服 shallow attribution，不能仅凭文本表面特征判断，而需要梳理交互步骤之间的依赖关系，构建一张 causal-inspired dependency graph，以此追踪错误是如何沿着交互链传播并最终导致系统崩溃的。然而，仅靠全局建图仍无法解决长文本带来的 contextual degradation，因为模型在全局图上推理时仍需处理冗长的上下文。此时，counterfactual analysis 提供了一个绝佳的切入点：与其在整个长 trace 上推理，不如基于全局图给出的初始假设，仅在假设错误周围的局部邻域内进行反事实模拟——即假设修正某一步骤，观察最终结果是否因此逆转。这种“全局建图定位大致区域，局部反事实验证具体节点”的思路，恰好将长文本推理拆解为可控的局部因果验证，从而同时规避了浅层归因和长上下文退化两大痛点。 ### § 4 核心 Intuition 现有方法失效的根本原因在于：它们要么被表面的 minor deviations 迷惑而忽略了深层因果链，要么在处理长 system trace 时遭遇严重的 contextual degradation。DCFA 的核心 Intuition 是将复杂的全局长文本归因转化为“先全局建图，后局部反事实验证”的双重视... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **DCFA: Dual-view Causal-inspired Attribution for Failure Reasoning in LLM-based Multi-agent Systems** # **Zehao Wang[1,2] , Lanjun Wang[2]**[*] **, Shilong Jin[1,2] , Junjie Chen[1] , Yanghua Xiao[3,4]** 1College of Intelligence and Computing, Tianjin University, Tianjin, China 2School of New Media and Communication, Tianjin University, Tianjin, China 3College of Computer Science and Artificial Intelligence, Fudan University, Shanghai, China 4 Shanghai Key Laboratory of Data Science, Shanghai, China {wzhrslh, jinshilong_2025}@gmail.com {wanglanjun, junjiechen}@tju.edu.cn, shawyh@fudan.edu.cn ## **Abstract** Large language model (LLM)-based multiagent systems have experienced rapid growth in recent years. Despite their promise, such systems remain fragile, frequently exhibiting reasoning and coordination errors that can lead to system-level failures. Failure attribution in such systems...", "additional_insights": "好的，以下是对这篇论文《DCFA: Dual-view Causal-inspired Attribution for Failure Reasoning in LLM-based Multi-agent Systems》的分析。\n\n### § 8 Take-aways\n\n1.  **问题定义与挑战**：论文聚焦于LLM-based multi-agent systems中的failure attribution问题，即定位“decisive error”——那个最早、且一旦修正就能逆转系统失败的交互步骤。作者指出了两个核心挑战：一是现有方法倾向于进行“shallow attribution”，即只捕捉到可恢复的minor deviations（如格式错误），而忽略了真正导致失败的深层因果链；二是随着系统trace长度增加，LLM的推理能力会急剧退化（contextual degradation），导致归因准确率大幅下降。\n\n2.  **核心方法：DCFA框架**：作者提出了一个training-free的归因框架DCFA，它由两个模块组成：Global Causal-inspired Attribution (GCA) 和 Local Counterfactual-inspired Enhancement (LCE)。GCA模块首先从系统trace中识别出所有minor deviations，然后围绕这些偏差构建一个结构化的causal-inspired dependency graph，并通过全局推理生成一个关于decisive error的初始假设。LCE模块则在这个初始假设附近，通过双向搜索依赖图，并利用counterfactual-inspired reasoning来评估修正每个候选交互对最终结果的影响，从而精炼出最终的decisive error。\n\n3.  **关键设计：因果启发与反事实推理**：DCFA的核心创新在于将因果推理的思想引入归因过程。GCA通过评估temporality、necessity和sufficiency三个条件来构建依赖图，这比直接让LLM分析原始文本更能捕捉到深层的依赖关系。LCE则通过构建counterfactual traces（修正前缀+原始后缀）并模拟其输出，来量化每个交互的边际贡献，从而区分出contributing errors和decisive error。这种“全局结构建模+局部反事实验证”的双视角设计是其性能提升的关键。\n\n4.  **实验结果与贡献**：在Who\u0026When基准测试上，DCFA在六个不同的LLM上均取得了优于现有方法（如ECHO, A2P）的结果，step-level accuracy最高提升了8.27%。消融实验表明，LCE模块在长trace场景下对性能提升贡献显著，有效缓解了contextual degradation问题。论文还通过案例研究展示了DCFA如何通过GCA定位错误区域，再通过LCE精确识别出decisive error（如Agent的fabrication行为），而非仅仅是上游的minor deviation。\n\n### § 9 最脆弱的假设\n\nDCFA最脆弱的假设是：**LLM能够可靠地构建一个准确的、反映真实因果关系的causal-inspired dependency graph**。\n\n这个假设是整个框架的基石。GCA模块的核心输出就是这个图，它决定了后续所有推理（全局假设生成、局部邻域搜索）的质量。如果这个图是错误或噪声极大的，那么后续的LCE模块无论多么精巧，都可能在错误的子图上进行搜索，导致归因失败。\n\n这个假设在实际中可能不成立的原因有几点：\n*   **LLM的因果推理能力有限**：论文本身也承认，LLM在长文本上的推理能力会退化。构建一个包含数十个节点和复杂依赖关系的图，对LLM的上下文理解和逻辑一致性是巨大挑战。论文附录F也展示了不同能力的模型（如Qwen3-Coder-30B vs. GPT-5）构建的图在边密度上存在显著差异，这直接证明了LLM能力对图质量的巨大影响。\n*   **因果关系的模糊性**：在复杂的multi-agent对话中，因果关系往往是模糊和概率性的。一个交互可能“部分导致”了另一个交互，但LLM被要求做出“是/否”的二元判断（necessity, sufficiency），这本身就是一种简化，可能丢失关键信息或引入错误。\n*   **缺乏客观验证**：论文中构建依赖图的过程完全依赖于LLM的“判断”，没有引入任何外部知识或数据驱动的验证机制。这意味着框架无法自我纠正错误的因果边，错误会直接向下游传播。\n\n论文为这个假设提供的证据是间接的：它展示了DCFA在最终归因任务上的整体性能提升。但论文**没有提供对构建的causal-inspired dependency graph本身质量的直接评估**（例如，与人工标注的因果图进行对比）。因此，我们无法判断性能提升是来自于一个“好”的图，还是来自于LCE模块在“坏”的图上依然能通过局部搜索找到正确答案的鲁棒性。如果这个假设不成立，即LLM构建的图质量很差，那么DCFA的核心贡献——通过结构化因果图进行推理——就会失效，其性能可能退化为一种更昂贵的、基于随机搜索的归因方法。\n\n### § 10 最小复现实验\n\n如果只有一周时间，我会设计一个实验来验证DCFA最核心的claim：**通过构建causal-inspired dependency graph进行全局推理，比直接对原始trace进行推理，能更有效地识别出decisive error**。\n\n**实验方案**：\n1.  **数据**：使用Who\u0026When benchmark中的Hand-crafted数据集（trace更长，挑战更大）。随机选取20-30个trace。\n2.  **实现**：只实现DCFA的GCA模块，不实现LCE模块。使用一个中等能力的LLM（如DeepSeek-R1-32B，论文中表现不错且成本可控）。\n3.  **测量**：比较两种归因方法的step-level accuracy。\n    *   **方法A (GCA)**：按照论文描述，先让LLM识别minor deviations并构建causal-inspired dependency graph，然后基于这个图生成decisive error的假设。\n    *   **方法B (Direct Reasoning)**：作为对照，让同一个LLM直接阅读完整的系统trace，并直接输出它认为的decisive error。这类似于论文中的All-at-Once基线，但使用相同的prompt风格和输出格式。\n4.  **结果解读**：\n    *   **支持claim**：如果方法A (GCA) 的step-level accuracy显著高于方法B (Direct Reasoning)，则有力地支持了论文的核心claim，即结构化因果图能帮助LLM进行更有效的归因。\n    *   **反驳claim**：如果方法A与方法B性能相当，甚至更差，则表明构建因果图这一步骤本身可能没有带来额外价值，甚至可能引入了噪声。DCFA的整体性能提升可能主要来自于LCE模块的局部反事实推理，而非GCA的全局图推理。\n\n这个实验不需要复现完整的DCFA系统，只需要实现GCA模块，并与一个简单的直接推理基线进行对比。它直接测试了论文中最具创新性的假设——结构化因果图的价值，并且可以在1周内完成数据准备、prompt设计和结果分析。", "research_value": "### § 11 最强反例设计\n\n如果我反对这篇论文，我会设计一个“图结构破坏实验”来证明DCFA的性能提升并非源于其声称的“结构化因果图”，而是源于LCE模块的局部搜索机制提供了一种隐式的注意力聚焦，即提出一种替代解释。具体而言，我会在Who\u0026When benchmark上，保留GCA模块识别出的minor deviations节点，但随机打乱或完全移除这些节点之间的causal-inspired dependency edges，然后在此“损坏图”上运行LCE模块进行counterfactual-inspired reasoning。如果DCFA的step-level accuracy并未因因果边的破坏而显著下降，这就直接证明了GCA构建的因果图对最终性能贡献微乎其微，真正的性能驱动力是LCE通过在初始假设附近进行双向搜索，强行让LLM对局部上下文进行反复验证，这本质上是一种计算资源的重新分配，而非对latent causal relationships的深刻理解。此外，我会构造一类“高耦合非线性传播”的真实场景来预测其失败：当某个minor deviation（如格式错误）触发了下游agent的重试机制，而重试机制本身由于上下文污染引入了fabrication。在这种场景下，LLM在进行counterfactual simulation时，无法准确模拟“修正格式错误后下游agent不再重试”的复杂状态转移，导致LCE错误地评估边际贡献，最终将可恢复的minor deviation误判为decisive error，彻底暴露其依赖LLM隐式模拟不可靠的致命缺陷。\n\n### § 12 Follow-up Research Idea\n\nDCFA的核心局限在于其完全依赖LLM的vanilla reasoning来隐式构建因果图并进行counterfactual simulation，这本质上是用LLM的幻觉去验证LLM的幻觉，缺乏客观的执行级验证机制。针对这一未满足的需求，我提议将MAS的failure attribution从post-hoc的自然语言文本分析，重构为runtime的dynamic information flow tracking问题。我们可以借鉴传统Program Analysis领域的Dynamic Taint Analysis（动态污点分析）技术，提出一个全新的框架：在MAS运行时，对agent间的消息传递和tool invocations进行结构化插桩，将关键信息（如API返回的参数、代码片段的变量）标记为taint sources，并精确追踪这些taints在后续agent reasoning steps中的传播路径。这种基于执行轨迹的客观依赖图，直接取代了DCFA中由LLM猜测出的causal-inspired dependency graph。第一个实验将聚焦于一个code generation MAS（如ChatDev），人为注入一个由于JSON解析错误导致的cascading failure。我们将比较基于Dynamic Taint Analysis的归因方法与DCFA在定位该decisive error时的准确率，并分析当LLM推理逻辑与实际数据流不一致时，DCFA会产生怎样的虚假因果链。这一提议与已有工作的根本区别在于：它放弃了让LLM去“理解”因果关系，转而利用系统执行环境的确定性来“观测”因果关系，从而打开了将传统软件调试技术严格引入LLM-based MAS可靠性研究的新方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zehao Wang\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Lanjun Wang\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Shilong Jin\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Junjie Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yanghua Xiao\", \"affiliations\": [3, 4], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"College of Intelligence and Computing, Tianjin University\"},\n    {\"id\": 2, \"name\": \"School of New Media and Communication, Tianjin University\"},\n    {\"id\": 3, \"name\": \"College of Computer Science and Artificial Intelligence, Fudan University\"},\n    {\"id\": 4, \"name\": \"Shanghai Key Laboratory of Data Science\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding Author.\"}\n  ]\n}\n```", "summary_translation": "基于大语言模型的多智能体系统近年来发展迅速。尽管前景广阔，这类系统仍然脆弱，频繁出现推理与协调错误，可能导致系统级故障。此类系统中的故障归因依赖于追踪智能体之间的自然语言交互，以识别决定性错误——即最早能够通过修正逆转系统故障的动作。存在两个关键挑战：1）浅层归因：现有方法通常仅捕获微小偏差（如不完整检索或格式错误），这些偏差可通过验证机制纠正，却遗漏了系统故障的决定性原因。2）上下文退化：随着系统追踪长度增加，模型的推理能力迅速下降。为应对这些挑战，我们提出DCFA，一种无需训练的故障归因框架。DCFA集成了一个全局模块，从系统追踪中构建结构化的因果启发依赖图以识别初始决定性错误，以及一个局部模块，应用局部反事实启发推理来细化因果启发归因。在Who\u0026When基准上跨越六个LLM的实验表明，DCFA在步骤级准确率上比最先进基线提升高达8.27%。"}]}], "2026-09-04": [{"name": "Agent Training \u0026 RL Methods", "count": 2, "papers": [{"title": "DRACO: Fine-Grained Credit Assignment with Dynamic Rubrics for Long-Horizon Agent Training", "arxiv_id": "2609.04094", "authors": "Shubham Gandhi, Saurabh Goyal, Kiran Kate, Yara Rizk", "summary": "Reinforcement Learning from Verifiable Rewards works well when a task has a programmatic checker, but most long-horizon agent domains have none. We work in the outcome-blind setting, where ground-truth success signals are not available. Multi-criteria rubrics are a popular way to supply such a reward; they are scored once per trajectory, but a single scalar is a poor signal across tens of steps. We propose DRACO: Distributing Rubric-based Advantage for Credit Optimization. It generates rubrics dynamically during training to track the policy's evolving capability, scores those rubrics once per completed trajectory, and redistributes that judgment over the steps responsible for annotated rubrics to produce differentiated per-step advantages in GRPO. The redistribution is closed-form and does not introduce any trained attribution module. On AppWorld, DRACO gains 15.9 points over the base model and 5.3 points over GRPO trained with a sparse ground-truth reward, despite not using any verifiers itself. On out-of-domain Tau-Bench, it gains 5.3 points over the base model even without a frontier judge, beating both ground-truth-reward training and other rubric-based training settings. The code for DRACO is available at https://github.com/IBM/draco.", "category": "cs.AI", "cluster": "Agent Training \u0026 RL Methods", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Long-Horizon Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文研究的是在 **outcome-blind** 设置下，即训练过程中完全无法获取 ground-truth success signal 或 gold answer 的条件下，如何为 long-horizon tool-using agents 进行有效的 fine-grained credit assignment。RLVR 的成功依赖于一个关键假设：存在 programmatic verifier（如代码的 unit test、数学的 exact-match、agent 的 task-pass check）来提供可靠的 terminal reward。然而许多 real-world agent domain——例如 customer-support 和 open-ended research agents——根本没有这样的 programmatic oracle，构建一个 verifier 往往和解决任务本身一样困难。与此同时，long-horizon agent 的 trajectory 通常跨越数十个 interdependent tool-calling steps，即使 reward 可用，将单个 trajectory-level scalar 均匀地分配给每一步在统计上是浪费的，甚至可能有害：成功的 trajectory 中包含冗余或幸运的步骤，失败的 trajectory 中包含大部分正确的步骤。这就是经典的 credit assignment problem，此前在有 terminal reward 的场景下已被广泛研究，但在 outcome-blind regime 下——即需要将 rubric-derived signal 而非 verifier outcome 路由到 individual steps——这一问题此前从未被解决。解决该问题的价值在于：使 RL 训练能够扩展到大量缺乏 verifier 的 real-world agent 场景，同时通过 per-step 的差异化 credit 信号提升 long-horizon trajectory 中的学习效率。\n\n### § 2 前人工作与不足\n\n该问题此前未被完整解决，相关 prior work 可沿两个轴分析。第一类是 **rubric-based reward** 方法。DR Tülu (Shao et al., 2026a)、EvoRubric (Guan et al., 2026)、Online Rubrics Elicitation (Rezaei et al., 2025) 和 RubricARM (Xu et al., 2026a) 在训练过程中 evolve rubric 并在完成的 rollout 上 score 一次，但它们均不进行 step attribution——trajectory-level 的 rubric score 被均匀施加于所有 token，无法区分 trajectory 中哪些步骤真正贡献了成功或导致了失败。ARCO (Tian et al., 2026)、RubricEM (Li et al., 2026a) 和 SCRIBE (Jiang and Ferraro, 2026) 属于第二类，它们在每个 position 评分一个新的 rubric，将 criteria 绑定到 task-specific decomposition 上；这要求每个 position 调用一次 judge，成本高昂，且将 \"step\" 的定义固定为特定 task 的分解结构，缺乏通用性。Xu et al. (2026b) 的 \"Rubrics to Tokens\" 是唯一将 trajectory-level rubric score 传播到 individual token 的方法，但它通过训练一个 learned discriminator 基于 fixed criteria 来实现，引入了需要额外训练的 attribution module，且 criteria 本身是静态的、不随 policy 能力演化而调整。\n\n第二类是 **step-level credit assignment** 方法。SPA-RL (Wang et al., 2025) 通过 trained progress estimator 分解 episode outcome，SALT (Li et al., 2026b) 和 Group-in-group (Feng et al., 2025) 通过跨 rollout 的 recurrence 进行归因，TRACE (Tao et al., 2026) 则利用 reference model 对 gold answer 的 likelihood。这些方法的根本局限在于：它们全部依赖可靠的 ground-truth outcome signal 作为归因的锚点，在 outcome-blind regime 下直接失效。HCAPO (Tan et al., 2026)、Hint-SD (Yeo et al., 2026) 和 AgentEvolver (Zhai et al., 2025) 用 LLM 进行 post hoc 归因，但同样以 outcome signal 为前提。StepTool (Yu et al., 2025) 等方法 specialize 到特定 action space（如 tool-call format 或 CLI command），无法泛化到通用的 long-horizon agent 场景。\n\n这些不足的根源并非前人忽略了 outcome-blind 这一维度，而是 outcome-blind 设置带来了两个耦合的困难：其一，固定的 rubric 无法预见 long trajectory 成功或失败的多样方式，因此无法为 credit assignment 提供足够 specific 的 criteria 来指向特定步骤；其二，即使有了 rubric verdict，将其转化为 per-step advantage 需要一种不依赖 outcome signal 的 redistribution 机制。此前没有任何方法同时满足 outcome-blind、dynamic rubrics、trajectory-level scoring、step attribution 和 no learned attribution 这五个条件（见论文 Table 1），DRACO 正是填补了这一空白。", "core_insight": "### § 3 重建作者的思考路径\n\nRLVR 的成功建立在一个前提上：存在 programmatic verifier 供应可靠的 terminal reward。但许多 real-world agent domains——customer support、open-ended research——没有这样的 oracle，构造一个和任务本身一样难。这是一个被多数 reward literature 跳过的 gap。作者选择在 outcome-blind regime 下工作：训练信号完全来自 process criteria，任何时刻都不接触 ground-truth success。\n\nMulti-criteria rubrics 是这个 regime 下的自然选择：写一组 criteria，在 trajectory 完成后让 judge 评分，得到一个 scalar reward。问题出在 long-horizon 上。一条 AppWorld trajectory 跨越 tens of interdependent tool-calling steps，把一个 scalar 均匀乘到每个 token 上，意味着 lucky step 和 critical step 拿到相同 credit，failed trajectory 里的正确 step 被同等惩罚。这是经典 credit-assignment problem，但已有的解决方案——trained progress estimators（Wang et al., 2025）、hindsight Q-value refinement（Tan et al., 2026）、reference model likelihood（Tao et al., 2026）——全部锚定在 reliable outcome signal 上，在 outcome-blind regime 下无法使用。Xu et al. (2026b) 是唯一将 trajectory-level rubric score 传播到 token level 的工作，但它需要训练一个 learned discriminator 基于 fixed criteria，引入了额外的 trained module 和 fixed rubric 的局限性。\n\n作者的第一个关键观察是：judge 在评估 trajectory against rubric 时，不仅给出 pass/fail verdict，还可以指出哪些 steps 导致了这个 verdict。这个 step attribution 信息是 judge 评分过程的自然副产品，不需要额外的 trained module 来提取。这就提供了一个将 trajectory-level reward 分配到 step-level 的 mechanism——而且是 closed-form 的，只需要在 GRPO 的 advantage 计算中做一个 reallocation，保持 trajectory 的 total push 和 sign 不变。\n\n但仅有 reallocation mechanism 不够。Credit reallocation 只有在 rubric 的 verdicts 是 mixed（同一 trajectory 上有些 criteria pass、有些 fail）时才产生 differentiated step advantages；如果 verdicts unanimous，所有 step 拿到相同 weight，update 退化为 baseline GRPO。Fixed rubric——为整个 task distribution 写一次的 criteria set——有两个结构性问题：一是它必须 phrased 足够 general 以适用于所有 task，无法 capture 单个 trajectory 的 specific failure modes；二是 policy 在训练中 capability 不断 evolve，fixed criteria 很快 saturate（policy pass 几乎所有 criteria，reward 停止 discriminating），unanimous rollouts 变成常态，credit reallocation 在大部分训练中处于 inert 状态。\n\n这引出第二个组件的动机：rubric 需要根据每个 rollout 的实际情况动态生成。Per-trajectory rubric 可以从 instruction 和 rollout 本身提取 criteria——特别是 policy 实际 fail 的方式——使 criteria specific enough 来 implicate particular steps。Discriminative dropout 进一步确保只保留 group 内至少有一个 member fail 的 criteria，维持 reward 的 discriminative power。两个组件形成协同：dynamic rubrics 提供 specificity，step credit 利用这个 specificity 做 attribution；缺少任何一个，另一个的 gain 就大幅缩减。\n\n### § 4 核心 Intuition\n\nJudge 在按 rubric 评分时天然知道哪些 steps 导致了每个 verdict——这个 attribution 信息是评分过程的免费副产品。DRACO 利用这一点，把 judge 的 per-criterion verdict 和 step citations 直接映射成 closed-form 的 per-step advantage reallocation，在 GRPO 框架内保持 trajectory 的 total push 和 sign 不变，无需训练任何 attribution module。为了让这个 reallocation 有足够的 specificity（即 rubric verdicts 能指向具体 steps 而非笼统覆盖整条 trajectory），rubric 不能是 fixed 的，而要根据每个 rollout 的实际行为动态生成，针对 policy 真正 fail 的方式提出 criteria——dynamic rubrics 供应可归因的 granularity，step credit 消费它。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《DRACO: Fine-Grained Credit Assignment with Dynamic Rubrics for Long-Horizon Agent Training》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文研究的是在 **outcome-blind** 设置下，即训练过程中完全无法获取 ground-truth success signal 或 gold answer 的条件下，如何为 long-horizon tool-using agents 进行有效的 fine-grained credit assignment。RLVR 的成功依赖于一个关键假设：存在 programmatic verifier（如代码的 unit test、数学的 exact-match、agent 的 task-pass check）来提供可靠的 terminal reward。然而许多 real-world agent domain——例如 customer-support 和 open-ended research agents——根本没有这样的 programmatic oracle，构建一个 verifier 往往和解决任务本身一样困难。与此同时，long-horizon agent 的 trajectory 通常跨越数十个 interdependent tool-calling steps，即使 reward 可用，将单个 trajectory-level scalar 均匀地分配给每一步在统计上是浪费的，甚至可能有害：成功的 trajectory 中包含冗余或幸运的步骤，失败的 trajectory 中包含大部分正确的步骤。这就是经典的 credit assignment problem，此前在有 terminal reward 的场景下已被广泛研究，但在 outcome-blind regime 下——即需要将 rubric-derived signal 而非 verifier outcome 路由到 individual steps——这一问题此前从未被解决。解决该问题的价值在于：使 RL 训练能够扩展到大量缺乏 verifier 的 real-world agent 场景，同时通过 per-step 的差异化 credit 信号提升 lo...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 RLVR 的成功建立在一个前提上：存在 programmatic verifier 供应可靠的 terminal reward。但许多 real-world agent domains——customer support、open-ended research——没有这样的 oracle，构造一个和任务本身一样难。这是一个被多数 reward literature 跳过的 gap。作者选择在 outcome-blind regime 下工作：训练信号完全来自 process criteria，任何时刻都不接触 ground-truth success。 Multi-criteria rubrics 是这个 regime 下的自然选择：写一组 criteria，在 trajectory 完成后让 judge 评分，得到一个 scalar reward。问题出在 long-horizon 上。一条 AppWorld trajectory 跨越 tens of interdependent tool-calling steps，把一个 scalar 均匀乘到每个 token 上，意味着 lucky step 和 critical step 拿到相同 credit，failed trajectory 里的正确 step 被同等惩罚。这是经典 credit-assignment problem，但已有的解决方案——trained progress estimators（Wang et al., 2025）、hindsight Q-value refinement（Tan et al., 2026）、reference model likelihood（Tao et al., 2026）——全部锚定在 reliable outcome signal 上，在 outcome-blind regime 下无法使用。Xu et al. (2026b) 是唯一将 trajectory-level rubric score 传播到 token level... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **DRACO: Fine-Grained Credit Assignment with Dynamic Rubrics for Long-Horizon Agent Training** ## **Shubham Gandhi**[1] _[,][∗]_ **Saurabh Goyal**[2] _[,][∗]_ **Kiran Kate**[2] **Yara Rizk**[2] 1Carnegie Mellon University 2IBM Research Correspondence: srgandhi@andrew.cmu.edu ## **Abstract** Reinforcement learning from verifiable rewards works well when a task has a programmatic checker, but most long-horizon agent domains have none. We work in the outcome-blind setting, where ground-truth success signals are not available. Multi-criteria rubrics are a popular way to supply such a reward; they are scored once per trajectory, but a single scalar is a poor signal across tens of steps. We propose **DRACO** : Distributing Rubric-based Advantage for Credit Optimization. It generates rubrics dynamically during training to track the policy’s evolving capability, scores those rubrics once per c...", "additional_insights": "### § 8 Take-aways\n\nDRACO在outcome-blind setting下训练long-horizon agent，不依赖任何ground-truth verifier，仅通过judge对process criteria的评分提供reward。其核心由两部分构成：dynamic per-trajectory rubrics根据每个rollout的实际行为生成task-specific criteria，避免了static rubric过早饱和的问题；rubric-conditioned step credit通过closed-form redistribution，将GRPO的trajectory-level advantage $A_i$ 重新分配到judge指认的steps上，满足total-push conservation、sign preservation和length independence等七条形式化性质。在AppWorldTN上，DRACO将Qwen3.6-27B的TGC从69.4提升至85.3，超越了使用ground-truth unit test训练的outcome-aware baseline（80.0 TGC），并在未训练的$\\tau$-bench上实现zero-shot transfer。Ablation揭示dynamic rubrics与step credit存在强协同：单独使用任一组件仅带来+0.8~1.0 TGC的提升，组合后达到+4.2 TGC，因为step credit需要足够specific的criteria才能产生mixed verdicts从而激活redistribution。Self-judge实验表明，用policy model自身替代frontier judge可将成本从$1607降至$316（5.1×节省），在$\\tau$-bench上甚至取得所有setting中最高的SR（21.1），因为self-judge的主要错误模式是lenient false pass而非noisy disagreement，这种错误只压缩group内的reward spread而不reorder group，GRPO对此具有鲁棒性。\n\n### § 9 最脆弱的假设\n\n最关键的假设是：judge的step attribution能够准确识别每个rubric verdict在trajectory中causally responsible的steps。这个假设是credit reallocation的基石——如果judge指认的steps与实际导致pass/fail的steps不一致，redistribution会将advantage施加到错误的steps上，policy会强化错误行为或抑制正确行为。论文在Limitations中明确承认：\"We validate DRACO by end-task performance, which does not establish that credit lands on the right steps: a redistribution that credits the wrong steps can still improve a policy model, and one that credits the right steps can fail to.\" 这意味着论文没有提供任何直接证据证明attribution质量。在实际long-horizon trajectory中，因果关系极其复杂：一个failure可能由多个steps的交互导致（如step 3的错误数据被step 7的消费放大），judge仅从trajectory文本很难区分\"直接导致\"与\"间接促成\"。论文的Appendix E.6显示，median step仅被1个rubric cite，0.6%的steps被10个以上rubric cite，这意味着大多数attribution决策基于极薄的证据——单个verdict决定一个step的quality score $Q_j$，而该verdict可能来自一个spanning six steps的broad check（如示例中的R5）。如果judge系统性地将credit偏向trajectory的前期或后期steps，或偏向包含更多文本的steps，整个credit mechanism可能退化为一个有偏的heuristic，而非论文声称的\"faithful per-step attribution\"。\n\n### § 10 最小复现实验\n\n用AppWorld的10个training tasks，从Qwen2.5-32B-Instruct采样G=6 rollouts per task（共60条trajectory），用GPT-4o作为judge完成dynamic rubric generation、scoring和step attribution三个阶段。核心实现只需credit reallocation的closed-form公式（Eq. 4-6），不需要训练policy model。测量两个指标：第一，对每条trajectory计算step quality $Q_j$ 的within-trajectory variance，对比dynamic rubrics与static rubrics（使用Table 9的21条criteria）下的variance差异；第二，统计credit处于inert状态（所有citing verdicts unanimous）的trajectory比例，按训练窗口分5段计算。如果dynamic rubrics下inert rate稳定在40-60%且$Q_j$ variance显著高于static rubrics（论文报告0.215 vs 0.144），则支持\"dynamic rubrics为credit提供可分配信号\"这一claim。如果dynamic rubrics的inert rate也随rollout质量提升而攀升至80%以上，或$Q_j$ variance与static无显著差异，则反驳了dynamic rubrics能持续产生discriminative signal的核心论点。整个实验只需judge API调用和公式计算，1天内可完成数据分析。", "research_value": "### § 11 最强反例设计\n\n如果我要对DRACO进行最有力的攻击，我会设计一个“Adversarial Attribution Shuffle”实验结合一类“Causal Decoy”真实世界场景，直接挑战其最脆弱的假设：judge的step attribution具有causal accuracy。首先，在实验层面，我会干预DRACO的training loop：在judge完成rubric scoring并输出step attribution后、进行advantage redistribution之前，我会在同一trajectory内部随机打乱credit的分配目标（即将fail verdict指向的steps与pass verdict指向的steps互换，或随机分配），但保持每个step获得的总credit数量分布不变。如果在这个Adversarial Shuffle设定下，DRACO的end-task performance依然保持不变，甚至由于某种隐式regularization效果而提升，这就提供了一个具体的替代解释：DRACO的成功根本不源于论文声称的“faithful per-step attribution”，而是仅仅因为将trajectory-level scalar打散成多个step-level signals时引入的variance reduction或implicit curriculum效应。其次，在真实世界场景层面，我会构建一类“Causal Decoy” tasks：在这类long-horizon agent任务中，导致最终rubric failure的root cause step（如step 3中一个微小的参数格式错误）在文本表现上是极简短的，而后续放大该错误的manifestation step（如step 7中基于错误数据生成的长篇冗余报告或报错堆栈）则是文本密集的。由于LLM judge天然倾向于基于surface text的salience进行归因，它将系统性地把negative credit分配给text-heavy的manifestation step，而忽略text-light的root cause step。在这种可预测的失败条件下，DRACO的redistribution机制不仅无法纠正错误，反而会持续抑制agent处理报错的能力，同时不断强化那个导致根本错误的参数格式行为，使得policy在多步组合任务中陷入无法收敛的dead loop。\n\n### § 12 Follow-up Research Idea\n\n基于DRACO在causal attribution上的核心局限，我提出一个非增量的novel research idea：**Provenance-Driven Credit Routing via Dynamic Taint Analysis**。（a）这一想法的驱动局限是：在long-horizon tool-using agent的trajectory中，依赖LLM judge进行post hoc textual attribution本质上是在做correlation而非causation的猜测，judge无法区分“直接导致”与“间接促成”，且极易被文本表面特征欺骗。（b）为了解决这一未满足的需求，我们可以借鉴软件安全领域的Dynamic Taint Analysis（动态污点分析）和Data Provenance Tracking技术。在agent执行tool call时，我们不依赖judge去“猜”哪一步导致了失败，而是通过运行时的信息流追踪，确定性地构建一个data dependency graph：记录每一步tool call的output payload如何作为input parameter流向后续的steps。当trajectory-level rubric判定某个terminal state或intermediate state为fail时，我们沿着data dependency graph进行backward slice，确定性地找到那些真正向失败节点注入了“poisoned data”的root cause steps。（c）第一个实验将构建一个“Provenance-Conditioned GRPO” baseline，在AppWorld的Causal Decoy任务集上对比DRACO。在该实验中，rubric scoring仍由LLM judge完成以保持outcome-blind，但credit的redistribution不再基于judge的textual citation，而是严格基于deterministic data flow graph的backward slice。如果Provenance-Conditioned GRPO在root cause step的identification准确率上大幅领先，并且在sample efficiency上超越DRACO，即可证明将credit routing从“linguistic inference”转变为“structural tracing”能根本性解决long-horizon credit assignment的因果错配问题，从而开启一个基于execution semantics而非textual heuristics的agent RL新方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Shubham Gandhi\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Saurabh Goyal\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Kiran Kate\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yara Rizk\", \"affiliations\": [2], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Carnegie Mellon University\"},\n    {\"id\": 2, \"name\": \"IBM Research\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"}\n  ]\n}\n```", "summary_translation": "当任务具有 programmatic checker 时，Reinforcement Learning from Verifiable Rewards 效果良好，但大多数 long-horizon agent domains 并不具备。我们在 outcome-blind setting 下进行研究，其中无法获取 ground-truth success signals。Multi-criteria rubrics 是提供此类奖励的常用方法；它们在每条 trajectory 上评分一次，但在数十个 steps 中，单一的 scalar 是一个糟糕的信号。我们提出了 DRACO: Distributing Rubric-based Advantage for Credit Optimization。该方法在训练期间动态生成 rubrics 以跟踪 policy 不断演化的能力，在每条完成的 trajectory 上对这些 rubrics 评分一次，并将该判断重新分配给负责 annotated rubrics 的 steps，从而在 GRPO 中产生差异化的 per-step advantages。这种 redistribution 是 closed-form 的，并且不会引入任何 trained attribution module。在 AppWorld 上，尽管本身不使用任何 verifiers，DRACO 比 base model 提高了 15.9 分，比使用 sparse ground-truth reward 训练的 GRPO 提高了 5.3 分。在 out-of-domain 的 Tau-Bench 上，即使没有 frontier judge，它也比 base model 提高了 5.3 分，击败了 ground-truth-reward training 和其他 rubric-based training settings。DRACO 的代码可在 https://github.com/IBM/draco 获取。"}, {"title": "Spurious Advantage Hidden in GRPO", "arxiv_id": "2609.04063", "authors": "Jiamian Wang, Samyadeep Basu, Koustava Goswami, Tong Yu, Zhiqiang Tao", "summary": "Group Relative Policy Optimization (GRPO) is widely studied for reinforcement learning with verifiable rewards, where its advantage estimator assigns each rollout a magnitude from within-group reward statistics. In the common case, this magnitude rewards rollouts that reach the correct answer through reasoning. Yet, an overlooked case shares the same surface: a rollout may land on it by guessing, and the formula still assigns a high magnitude, which we identify as the spurious advantage. This arises in three cases: bounded-answer tasks with a small candidate set; open-answer sets hosting bounded sub-cases; and search agents whose budget opens many paths to the same answer. In all three, this misleads the policy toward guess-like behaviors. We propose SIGNBALANCE, whose magnitude is composition-free: it keeps the verifier sign, uses a global scale, and restores zero-mean balance via a stop-gradient per-class rescaling. Across math and search agent benchmarks at different scales, SIGNBALANCE matches GRPO on open-answer math and improves on bounded-answer math and search agents. Code will be released.", "category": "cs.AI", "cluster": "Agent Training \u0026 RL Methods", "tags": ["cs.AI"], "filter_reason": "论文的核心贡献是提出了一种改进的强化学习策略优化方法（SIGNBALANCE），以解决 GRPO 算法中的“虚假优势”问题。虽然该方法也应用于数学推理，但摘要明确指出其关键应用场景之一是“搜索智能体”，并提到在搜索智能体中由于预算充足导致多条路径到达同一答案从而引发虚假优势的问题，且最终在“search agent benchmarks”上进行了评估和改进。根据筛选标准第一步中的保留规则：“如果论文研究 test-time scaling、推理策略搜索、澄清时机、记忆机制、协作意图、agent training/distillation/RL，并且标题或摘要明确指向 Agentic / LLM Agents / Self-Evolving / LLMs Improving LLMs，应保留。不要因为它看起来像‘推理优化’或‘训练方法’就直接排除。” 该论文属于 agent training/RL 范畴，且明确针对 search agents 的策略优化，因此符合研究目标中对智能体训练和演化的关注点。", "intro_logic": "### § 1 研究问题与重要性\n本文提出了在 Group Relative Policy Optimization (GRPO) 的 advantage estimator 中隐藏的“spurious advantage”现象。在 Reinforcement Learning with Verifiable Rewards (RLVR) 场景下，GRPO 通过组内 reward 统计为每个 rollout 分配 advantage magnitude。然而，当一个 rollout 通过猜测而非推理获得正确答案时，公式依然会赋予其与推理正确的 rollout 相同的高 magnitude。这种 spurious advantage 会误导 policy 学习“幸运猜测”行为而非真正的推理。该问题在三类场景中尤为显著：具有小候选集的 bounded-answer tasks、包含 bounded sub-cases 的 open-answer sets（如 MATH-7.5K 中 55.95% 的问题具有简短数值或类别答案），以及具有大动作预算的 multi-turn search agents。解决这个问题至关重要，因为 GRPO 是当前 LLM post-training 的核心方法，其 advantage estimator 的系统性偏差会直接损害模型的 reasoning 能力。为此，作者提出了 SIGNBALANCE，一种与组内成分无关的 advantage estimator，通过保留 verifier sign、使用全局 scale 并通过 stop-gradient per-class rescaling 恢复 zero-mean balance，有效消除了 spurious advantage，从而在 bounded-answer math 和 search agent 任务上带来显著性能提升。\n\n### § 2 前人工作与不足\n针对 GRPO advantage estimator 的改进，前人已有大量研究，如 Dr.GRPO、DAPO、BNPO 等方法在 clipping range、normalization term 和 sampling strategy 上进行了优化。在理论分析方面，Mroueh (2025) 推导了 GRPO 在 binary rewards 下的 closed-form weighting，证明其等价于一种 adaptive weighted contrastive loss，其中 rare-success rollouts 会获得大权重。然而，这些工作均隐含了一个关键假设：within-group composition（即正确与错误 rollout 的数量 $n^+$ 和 $n^-$）完全由 policy 的 reasoning 能力驱动，即非推理猜测成功的概率 $p_g \\approx 0$。这一假设在传统的 open-answer math 任务中确实成立，因为答案空间巨大，随机猜中的概率极低。但前人研究未能考虑到，当任务的有效答案表面是有限的（如多选题或 MATH 数据集中的小整数答案），或者动作空间庞大（如 multi-turn search agents）时，$p_g$ 会变得不可忽略。此时，GRPO 中依赖于组内成分的 magnitude 公式 $\\sqrt{n^- / n^+}$ 会放大猜测成分，将本应由 reasoning 驱动的 learning signal 污染为 spurious advantage。这种不足并非方法工程的限制，而是因为此前的评测和设计完全围绕 open-answer math 展开，导致 $p_g \u003E 0$ 时的结构性问题未被清楚定义和暴露。", "core_insight": "## § 3 重建作者的思考路径\n\nGRPO 的核心机制——用 group 内 reward 统计量来估计 advantage——在 open-answer math 上被广泛验证有效，其隐含假设是：一个 rollout 得到正确答案，大概率是因为 policy 真的进行了 reasoning。这个假设在 answer surface 无限大时几乎成立，因为随机猜中一个自由形式数学表达式的概率趋近于零。但这个假设是否在所有任务上都成立，并没有人系统检验过。\n\n第一个理论线索来自 Mroueh (2025) 的 closed-form 分析：在 binary reward 下，GRPO 给每个 correct rollout 的 magnitude 是 $\\sqrt{n^-/n^+}$，这个值完全由 group 内正确/错误的**计数比例**决定，与 rollout 内容、policy 置信度无关。这意味着 magnitude 本身不携带任何关于\"这个正确答案是怎么来的\"的信息。如果一个 correct rollout 是靠 reasoning 得到的，它得到 $\\sqrt{n^-/n^+}$；如果它是靠猜中的，它也得到完全相同的 $\\sqrt{n^-/n^+}$。estimator 无法区分两者。\n\n由此可以推出一个失败模式：当任务存在非零的 guessing 概率 $p_g$ 时，group 内的正确计数 $n^+$ 的期望 $G \\cdot p_q = G(p_r + p_g)$ 同时混入了 reasoning 贡献和 guessing 贡献。在 imbalanced group（$n^+$ 很小）中，estimator 给那个 rare correct rollout 赋予最大的 magnitude（$G=16, n^+=1$ 时 $\\approx 3.87$），但这个 rare correct 有可能恰恰是猜中的——于是最大的 gradient weight 被分配给了一个 lucky guess 而非 genuine reasoning。这就是 spurious advantage 的结构来源。\n\n接下来需要确认这个失败模式在哪些场景下 $p_g$ 足够大、足以产生实质性影响。最直接的场景是 bounded-answer task：$k$ 选项多选题的 $p_g \\approx 1/k$，对于 4 选 1，$G=16$ 时仅靠随机猜测就能期望 4 个 correct rollout。但更隐蔽的是，即使是名义上的 open-answer benchmark 也并非真正 open——MATH-7.5K 中 55.95% 的题目答案是 small integer、simple fraction、finite set 等 bounded form，guess hit rate 可达 4.76%（int_small）甚至 20%（finite_set_listed）。第三个场景是 multi-turn search agent：budget $B$ 越大，能到达同一 final answer 的 trajectory 空间越大，许多包含冗余或无效搜索的 trajectory 仍然拿到 outcome-only reward $+1$，estimator 给它们和真正有效推理的 trajectory 完全相同的 magnitude。\n\n经验上，这个失败模式应该会在训练动态中留下痕迹：bounded-answer benchmark 上 GRPO 的 checkpoint-to-checkpoint 方差应该更大（因为 spurious component 注入了噪声），gain 应该更小更不稳定。而 open-answer benchmark 上 $p_g \\to 0$，spurious advantage 可忽略，GRPO 的 adaptive weighting 恰恰是 feature 而非 bug——rare success 对应 rare reasoning trajectory，理应获得大 weight。\n\n那么修复方向就自然了：advantage 的 magnitude 不应该依赖 $(n^+, n^-)$，因为正是这个依赖让 guessing 成分进入了 gradient weight。但简单地把所有 magnitude 设成常数会破坏 GRPO advantage 的 batch-level zero-mean 性质（$\\sum_i \\hat{A}_i = 0$），而这个性质对训练稳定性很重要。因此需要一个设计：per-rollout magnitude 是常数（不读 $(n^+, n^-)$），但正负两类的总 force 仍然平衡。用 stop-gradient 的 per-class rescaling $\\rho = \\text{sg}[n^+/n^-]$ 恰好满足——per-rollout magnitude 在前向传播中是常数，而 batch-level 的 $\\sum_{i \\in +}|\\hat{A}_i| = \\sum_{i \\in -}|\\hat{A}_i|$ 在统计意义上成立。这个设计 parameter-free、不改 PPO surrogate、无额外推理成本，是一个干净的 drop-in replacement。\n\n## § 4 核心 Intuition\n\nGRPO 用 group 内正确/错误计数来决定每个 rollout 的 gradient weight，但\"正确\"可能来自 reasoning 也可能来自 guessing，estimator 无法区分两者——当任务存在非零的 guessing 概率时，最大的 gradient weight 会被分配给 lucky guess 而非 genuine reasoning，policy 因此被推向模仿猜测行为。修复的核心是：让每个 rollout 的 magnitude 变成一个不依赖 group 内计数的常数，只保留 verifier 的 sign（对/错），同时用 stop-gradient 的 per-class rescaling 恢复 batch-level 的零均值力平衡——这样 guessing 成分不再进入 gradient weight，而 reasoning 信号仍然通过 sign 被保留。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Spurious Advantage Hidden in GRPO》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 本文提出了在 Group Relative Policy Optimization (GRPO) 的 advantage estimator 中隐藏的“spurious advantage”现象。在 Reinforcement Learning with Verifiable Rewards (RLVR) 场景下，GRPO 通过组内 reward 统计为每个 rollout 分配 advantage magnitude。然而，当一个 rollout 通过猜测而非推理获得正确答案时，公式依然会赋予其与推理正确的 rollout 相同的高 magnitude。这种 spurious advantage 会误导 policy 学习“幸运猜测”行为而非真正的推理。该问题在三类场景中尤为显著：具有小候选集的 bounded-answer tasks、包含 bounded sub-cases 的 open-answer sets（如 MATH-7.5K 中 55.95% 的问题具有简短数值或类别答案），以及具有大动作预算的 multi-turn search agents。解决这个问题至关重要，因为 GRPO 是当前 LLM post-training 的核心方法，其 advantage estimator 的系统性偏差会直接损害模型的 reasoning 能力。为此，作者提出了 SIGNBALANCE，一种与组内成分无关的 advantage estimator，通过保留 verifier sign、使用全局 scale 并通过 stop-gradient per-class rescaling 恢复 zero-mean balance，有效消除了 spurious advantage，从而在 bounded-answer math 和 search agent 任务上带来显著性能提升。 ### § 2 前人工作与不足 针对 GRPO advantage estimator 的改进，前人已有大量研究，如 Dr.GRPO、DAPO、BNPO 等方法...\n2. 核心操作：方法部分围绕这一洞察展开：## § 3 重建作者的思考路径 GRPO 的核心机制——用 group 内 reward 统计量来估计 advantage——在 open-answer math 上被广泛验证有效，其隐含假设是：一个 rollout 得到正确答案，大概率是因为 policy 真的进行了 reasoning。这个假设在 answer surface 无限大时几乎成立，因为随机猜中一个自由形式数学表达式的概率趋近于零。但这个假设是否在所有任务上都成立，并没有人系统检验过。 第一个理论线索来自 Mroueh (2025) 的 closed-form 分析：在 binary reward 下，GRPO 给每个 correct rollout 的 magnitude 是 $\\sqrt{n^-/n^+}$，这个值完全由 group 内正确/错误的**计数比例**决定，与 rollout 内容、policy 置信度无关。这意味着 magnitude 本身不携带任何关于\"这个正确答案是怎么来的\"的信息。如果一个 correct rollout 是靠 reasoning 得到的，它得到 $\\sqrt{n^-/n^+}$；如果它是靠猜中的，它也得到完全相同的 $\\sqrt{n^-/n^+}$。estimator 无法区分两者。 由此可以推出一个失败模式：当任务存在非零的 guessing 概率 $p_g$ 时，group 内的正确计数 $n^+$ 的期望 $G \\cdot p_q = G(p_r + p_g)$ 同时混入了 reasoning 贡献和 guessing 贡献。在 imbalanced group（$n^+$ 很小）中，estimator 给那个 rare correct rollout 赋予最大的 magnitude（$G=16, n^+=1$ 时 $\\approx 3.87$），但这个 rare correct 有可能恰恰是猜中的——于是最大的 gradient weight 被分配给了一个 lucky guess 而非 genuine reasoning。这就是 spurious a... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：## **Spurious Advantage Hidden in GRPO** **Jiamian Wang[1] , Samyadeep Basu[2] , Koustava Goswami[2] , Tong Yu[2] , Zhiqiang Tao[1]** 1Rochester Institute of Technology, 2Adobe Research ## **Abstract** Group Relative Policy Optimization (GRPO) is widely studied for reinforcement learning with verifiable rewards, where its advantage estimator assigns each rollout a magnitude from within-group reward statistics. In the common case, this magnitude rewards rollouts that reach the correct answer through reasoning. Yet, an overlooked case shares the same surface: a rollout may land on it by guessing, and the formula still assigns a high magnitude, which we identify as the _spurious advantage_ . This arises in three cases: bounded-answer tasks with a small candidate set; open-answer sets hosting bounded sub-cases; and search agents whose budget opens many paths to the same answer. In all three,...", "additional_insights": "### § 8 Take-aways\nGRPO 的 advantage estimator 仅依赖组内正确与错误 rollout 的数量来分配 magnitude，无法区分模型是通过推理还是猜测得到正确答案。当任务存在有限的候选答案空间时，模型有非零的概率通过随机猜测命中正确答案，从而在 GRPO 中产生 spurious advantage，误导 policy 学习猜测行为。这种现象不仅出现在多选题中，也隐藏在 open-answer 的 MATH 数据集中（如答案为小整数的子集），以及 multi-turn search agents 的冗余搜索路径中。论文提出的 SIGNBALANCE 方法通过将 per-rollout magnitude 与组内组成解耦，保留 verifier sign 并使用全局 scale，消除了 spurious advantage 对 gradient weight 的干扰。实验表明，SIGNBALANCE 在 bounded-answer math 和 search-agent 任务上显著优于 GRPO，而在 open-answer math 上表现与 GRPO 持平，验证了 spurious advantage 在特定任务结构中的负面影响。\n\n### § 9 最脆弱的假设\n论文最脆弱的核心假设是：在 bounded-answer 任务中，模型通过猜测得到正确答案的概率 $p_g$ 足够大，以至于它主导了 GRPO 的梯度更新方向，导致 policy 学习到“猜测捷径”而非“推理”。如果这个假设不成立，例如模型在实际训练中主要依赖部分推理而非纯随机猜测，或者 GRPO 放大罕见正确 rollout 的机制实际上促进了有益的探索而非纯粹的猜测，那么 SIGNBALANCE 解耦 magnitude 的做法就失去了理论依据。在实际中，即使答案空间有限，模型在训练初期可能基于部分启发式规则而非完全随机猜测，将其完全视为“spurious”可能过于绝对。论文虽然通过 Figure 3 证明了 $p_g$ 的理论上界，并在 Appendix G 中展示了 GRPO 训练的模型存在“推导正确但选错字母”的案例，但缺少直接的定量证据证明在 GRPO 训练过程中，究竟有多大比例的正确 rollout 是纯粹由猜测产生的，也没有证明 SIGNBALANCE 真正减少了“猜测”行为本身，而不仅仅是改变了 letter-selection 的映射。\n\n### § 10 最小复现实验\n在 1 周时间内，可以使用 Qwen2.5-0.5B-Instruct 模型在 MATH-7.5K 数据集上训练，并在 bounded-answer 的 AQuA（5选1多选题）数据集上评估，以最小成本验证 spurious advantage 的影响。实现上，基于现有的 GRPO 训练框架，仅需修改 advantage 计算部分，分别实现标准 GRPO 和 SIGNBALANCE（如 Algorithm 2 所示），训练约 500 步。测量指标包括 AQuA 上的准确率曲线，以及“推导-选项一致性”的定量分析：在测试集上提取模型生成的推理过程和最终选项，统计“推理正确但选项错误”的比例。如果论文的 claim 成立，SIGNBALANCE 应该在 AQuA 上准确率显著高于 GRPO，且“推理正确但选项错误”的比例更低，证明 GRPO 确实因 spurious advantage 学到了错误的字母选择捷径。如果两者准确率没有显著差异，或者 GRPO 的错误并非主要源于选项选择不一致，则反驳了 spurious advantage 是主要瓶颈的假设。", "research_value": "### § 11 最强反例设计\n要构造对本文最有力的攻击，核心在于挑战“rare success 等同于 spurious advantage”这一底层归因，将其重新定义为 GRPO 赋予的 **exploration bonus**。我会在 multi-turn search agent 场景下设计一个对比实验，使用具有庞大动作空间但最终答案 bounded 的任务（如 ALFWorld 或 WebShop）。实验设置两组：标准 GRPO 与论文提出的 SIGNBALANCE。除了常规的 success rate，我将重点监测训练中后期的 **trajectory entropy** 和 **state coverage**。如果论文的核心假设成立，GRPO 应因 spurious advantage 陷入低效的猜测捷径；但如果相反，GRPO 的高 magnitude 实际上充当了必要的探索驱动力，那么预期会出现以下结果：尽管 GRPO 在早期会探索大量冗余路径，但其在 hardest quartile（按 ground-truth trajectory 长度划分）上的 success rate 将显著高于 SIGNBALANCE；同时，SIGNBALANCE 虽然可能因抑制了无效探索而在 average length 或 easy tasks 上表现更优，但其 trajectory entropy 会过早坍塌，导致 policy 陷入局部最优。这一结果将提供一种直接的替代解释：在 large action space 中，GRPO 对罕见正确 rollout 的放大并非系统性偏差，而是克服 sparse reward 信号的关键机制；SIGNBALANCE 通过解耦 magnitude 强行消除这种波动，反而破坏了 policy 发现复杂长尾推理链的 sample efficiency。\n\n### § 12 Follow-up Research Idea\n本工作的核心局限在于其 binary 的 reward 视角：它假设 rollout 要么是纯推理，要么是纯猜测，并试图通过修改 outcome-based 的 advantage estimator 来抹平后者的梯度权重。然而，真实世界的 LLM 推理往往是 partial reasoning 与 heuristic guessing 的混合体，仅靠最终的 verifiable reward 无法区分这两者。这一未满足的需求驱动了一个新的研究方向：**Causal Process Advantage (CPA)**，即不再在 outcome level 修补 advantage，而是将 credit assignment 推进到 trajectory 的中间推理步上。我们可以借鉴因果推断领域的 **front-door adjustment** 与信息论中的 **mutual information estimation**。具体而言，不再使用全局或组内的 scalar magnitude，而是训练一个轻量级的 step-level verifier 来估计中间 token 序列对最终正确答案的 causal sufficiency。对于一个 bounded-answer 任务，如果中间推理步骤的 semantic embedding 与最终答案之间的 pointwise mutual information 低于某个阈值，则该段 trajectory 被判定为 non-causal（即猜测），其 advantage 将被 decay 或直接施加 stop-gradient。第一个实验将聚焦于 MATH 数据集中答案为小整数的子集，对比三组：标准 GRPO、SIGNBALANCE 以及 CPA。关键评测指标不仅是最终准确率，而是 **out-of-distribution (OOD) generalization**——将训练好的 policy 迁移到答案空间完全开放的 AIME 问题上。预期 CPA 将显著优于两者，因为它在训练阶段不仅抑制了猜测捷径，更通过 mutual information 显式塑造了可迁移的 causal reasoning pattern，而 SIGNBALANCE 仅在表面压制了猜测行为，未能正向引导 policy 学习通用的推理因果链。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jiamian Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Samyadeep Basu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Koustava Goswami\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Tong Yu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Zhiqiang Tao\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"RIT\"},\n    {\"id\": 2, \"name\": \"Adobe Research\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "Group Relative Policy Optimization (GRPO) 被广泛研究用于 reinforcement learning with verifiable rewards，其 advantage estimator 从 within-group reward statistics 中为每个 rollout 分配一个 magnitude。在常见情况下，该 magnitude 奖励通过推理得出正确答案的 rollout。然而，一个被忽视的情况具有相同的表面现象：rollout 可能通过猜测得出正确答案，而公式仍会分配一个高 magnitude，我们将此识别为 spurious advantage。这出现在三种情形中：具有小 candidate set 的 bounded-answer tasks；包含 bounded sub-cases 的 open-answer sets；以及 budget 为同一答案开辟多条路径的 search agents。在这三种情形中，这都会误导 policy 趋向于类似猜测的行为。我们提出了 SIGNBALANCE，其 magnitude 是 composition-free 的：它保留 verifier sign，使用 global scale，并通过 stop-gradient per-class rescaling 恢复 zero-mean balance。在不同规模的 math 和 search agent benchmarks 上，SIGNBALANCE 在 open-answer math 上与 GRPO 持平，并在 bounded-answer math 和 search agents 上取得提升。代码将公开发布。"}]}, {"name": "Code \u0026 Software Agents", "count": 2, "papers": [{"title": "Editable Visual Design", "arxiv_id": "2609.04034", "authors": "Junyan Ye, Wei Liu, Dongzhi Jiang, Zichen Wen, HaoDong Li, Zhutao Lv, Jiaxin Lin, Jinhua Yu, Jun He, Zilong Huang, Rui Chen, Weijia Li", "summary": "While diffusion base models such as GPT-Image-2 and Nano-Banana exhibit remarkable visual expressiveness, their end-to-end generation inherently yields flattened bitmaps with error-prone text, precluding layer-wise post-editing. Conversely, code-based visual generation via Coding Agents provides precise layout control and decoupled layers, yet remains constrained by a lack of global aesthetic intuition and the difficulty of coding complex visual assets. To address this, we propose Editable Visual Design, a new paradigm driven by a Coding Agent. We designate the VLM as the ``creative brain'' for requirement comprehension, task planning, and aesthetic judgment, while utilizing the image generation model as an on-demand ``visual world simulator'' to synthesize standalone visual assets. Operating under an ``imagine first, then act'' closed-loop workflow, the agent generates isolated assets, writes native HTML/CSS, and iteratively refines the design against visual rendering feedback. Furthermore, Agent Design Replay faithfully reproduces the creative and reasoning trajectory akin to that of professional human designers. Ultimately, the system delivers editable artifacts with decoupled layers and real text, enabling users to perform intuitive mouse dragging and layout adjustments on a graphical user interface. Validations on posters, infographics, and other scenarios show that this paradigm successfully achieves both refined aesthetics and production-grade editability.", "category": "cs.CL", "cluster": "Code \u0026 Software Agents", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是提出了一种由 Coding Agent 驱动的视觉设计新范式。虽然其应用场景是视觉设计（涉及多模态和图像生成），但论文的本质是关于智能体机制设计的：它将 VLM 作为智能体的“大脑”进行任务规划和美学判断，将图像生成模型作为按需调用的工具（视觉世界模拟器），并构建了一个“先想象，后行动”的闭环工作流。更重要的是，该智能体能够根据视觉渲染反馈进行迭代细化，这明确属于智能体通过环境反馈进行自我完善和迭代的机制。根据筛选标准第一步中的“保留”规则，如果论文在特定领域中提出了新的 agent 机制（如闭环工作流、基于反馈的迭代改进），则不应排除——领域是场景，机制才是贡献。此外，论文中的视觉模型仅作为智能体感知和生成的工具，而非研究多模态模型本身的核心。因此，该论文符合“构建、改进 LLM 智能体”及“自我演化”的研究焦点。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的研究问题是如何生成既具备高美学质量又支持生产级可编辑性的视觉设计作品（如海报、信息图等）。在当前的自动化视觉设计领域，生成系统面临着视觉表现力与工程可编辑性难以兼得的困境。基于diffusion model的端到端图像生成虽然能产出极具视觉表现力的图像，但其输出本质上是扁平的bitmap，不仅文本容易出错，且各视觉元素深度纠缠，无法进行分层后期编辑；而基于LLM的纯代码生成虽然能提供精确的布局控制和解耦的图层，但由于代码本质是一维符号序列，模型缺乏二维空间感和全局美学直觉，且难以通过纯代码构建复杂的视觉资产。解决这一问题具有重要价值，因为真实的下游设计交付不仅要求视觉上的精美，更需要交付物具备可维护性和可调整性。本文的解决方案能够交付具有解耦图层和真实文本的可编辑artifacts，允许用户在图形用户界面（GUI）上直接进行鼠标拖拽和布局调整，从而在视觉质量与工程可维护性之间取得了关键平衡，推动了自动化视觉设计向实际生产级应用迈进。\n\n### § 2 前人工作与不足\n该问题此前未被完整解决，现有研究主要沿着两条正交但均存在局限的路径发展。第一条是“左脑”纯代码生成路径，以GPT-5.6 Sol、Claude Fable 5和Kimi K3等前沿LLM以及Design2Code、LaTCoder、UI2Code等基准为代表。这些系统能够自动生成结构完整、组织清晰的HTML/SVG/CSS布局，提供干净的图层和交互式文本。然而，它们存在不足的根本原因在于代码作为一维符号序列与二维空间视觉直觉之间的固有鸿沟。模型精通语法和DOM树，但缺乏全局视觉控制力，直接写布局代码往往只能产出高度模板化的“大标题、卡片、圆角阴影”组合。此外，要求模型用纯代码手绘复杂的视觉资产（如电影级背景、3D视觉元素或精细插图）成本极高且效果僵硬，导致最终产物常以简单几何色块或emoji作为占位符，停留在未完成的草稿阶段。\n\n第二条是“右脑”视觉内容生成路径，以Latent Diffusion、GPT Image 2、Nano Banana 2以及TextDiffuser、COLE等系统为代表。这些方法压缩了人类艺术先验，能够瞬间生成具有顶级构图、光照和纹理的图像。但它们之所以不够，是因为缺乏严谨的工程逻辑。其生成的raster image不仅常包含拼写错误和扭曲的文本，且元素在像素层面深度纠缠，无法分离成可编辑的图层。这种不可分离性使得它们在文本准确性、局部编辑和下游工程交付方面存在致命缺陷，无法作为真正可编辑的设计工程交付物。\n\n此外，近期如Visual ChatGPT、GenArtist、Idea2Img以及GenClaw等Agentic范式探索了多模态工具调度与反思迭代。特别是GenClaw指出了过度依赖端到端生成最终图像的局限性，并提出了code-driven的生成范式。然而，这些方法仍未完全打通美学先验与结构化交付的壁垒。本文正是识别到了这一关键缺口：既没有将图像模型的美学先验有效注入代码生成过程，也没有解决复杂资产生成与图层解耦的工程难题，从而提出了将VLM作为“creative brain”与图像生成模型作为“visual world simulator”协同的新范式。", "core_insight": "### § 3 重建作者的思考路径\n\n在探索自动化视觉设计时，研究者首先观察到现有技术陷入了两条正交但均存在致命缺陷的路径。一方面，基于 LLM 的纯代码生成（如直接编写 HTML/CSS）具有天然的工程优势：它能够提供清晰的图层、可交互的文本以及易于后期修改的结构。然而，代码本质上是一维的符号序列，LLM 虽然精通语法和 DOM 树，却极度缺乏二维空间感和全局审美直觉，导致生成的布局往往沦为“大标题、卡片、圆角阴影”的刻板模板；同时，用纯代码“手绘”复杂的视觉资产（如电影级背景、3D 视觉元素）成本极高且效果僵硬，最终只能用简单的色块或 emoji 作为占位符。另一方面，基于 diffusion model 的图像生成路径虽然压缩了人类数百年的艺术先验，能瞬间产出具备顶级构图、光影和质感的图像，却存在结构性的工程弱点：其输出的光栅图像不仅文本容易扭曲错乱，且元素在像素层面深度纠缠，无法分离为可编辑的图层，根本无法满足下游设计交付的精确编辑需求。\n\n面对“代码有结构无审美”和“图像有审美无结构”的僵局，研究者开始寻找打破瓶颈的理论线索。在“Generation for Understanding”的探索中，以往的多模态模型（UMMs）多将生成用于强符号逻辑的线性推理（如画几何辅助线），但收效甚微，因为严谨的演绎推理与生成模型的隐式反馈机制天然不兼容。然而，一个关键的类比浮现出来：人类很难在梦中解数学题，但梦境却是视觉灵感与创意意象的源泉。这意味着，生成模型真正的价值不在于辅助逻辑推演，而在于提供难以用一维文本量化的空间美学、色彩氛围和构图参考。与此同时，World Action Model (WAM) 的概念提供了系统架构上的启发，即可以将系统拆分为负责决策的“大脑”和负责模拟环境的“模拟器”。\n\n顺着这些线索，研究者推导出了一种全新的分工协作机制：既然代码不擅长审美和复杂资产，图像不擅长结构和工程交付，何不让两者各司其职？将具有通用推理能力的 VLM 作为“创意大脑”主导需求理解和布局规划，将图像生成模型降级为按需调用的“视觉世界模拟器”。在具体执行上，摒弃让图像模型直接输出最终海报的徒劳尝试，而是让它在流程最前端生成一张“想象图”，仅为后续的代码编写提供全局的审美先验。随后，Coding Agent 根据这个视觉先验，按需调用图像模型生成干净、独立的局部视觉资产（通过 alpha 通道或绿幕抠图避免像素污染），并结合真实的文本内容，用原生 HTML/CSS 构建出图层解耦的页面。最后，通过引入 headless browser 的确定性规则检查与 VLM 的多模态视觉反思，对初始代码进行迭代式的自我修复，从而在保留代码工程可编辑性的同时，成功注入了图像生成模型的美学表现力。\n\n### § 4 核心 Intuition\n\n纯代码生成受限于一维符号序列，缺乏二维空间感与审美直觉；而纯图像生成则因像素纠缠和文本错误无法提供可编辑的工程交付物。核心 Intuition 在于将图像生成模型从“最终输出端”前置为“视觉模拟器”与“资产渲染器”，先由它生成想象图提供全局审美先验及解耦的局部素材，再由 Coding Agent 利用这些素材与真实文本编写原生 HTML/CSS 进行结构化重建。这种“先想象后执行”的分工，巧妙地将 diffusion model 的美学表达优势与代码的精确图层控制结合，从而跨越了从“结构正确”到“视觉精炼且可编辑”的鸿沟。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Editable Visual Design》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 本文提出并解决的研究问题是如何生成既具备高美学质量又支持生产级可编辑性的视觉设计作品（如海报、信息图等）。在当前的自动化视觉设计领域，生成系统面临着视觉表现力与工程可编辑性难以兼得的困境。基于diffusion model的端到端图像生成虽然能产出极具视觉表现力的图像，但其输出本质上是扁平的bitmap，不仅文本容易出错，且各视觉元素深度纠缠，无法进行分层后期编辑；而基于LLM的纯代码生成虽然能提供精确的布局控制和解耦的图层，但由于代码本质是一维符号序列，模型缺乏二维空间感和全局美学直觉，且难以通过纯代码构建复杂的视觉资产。解决这一问题具有重要价值，因为真实的下游设计交付不仅要求视觉上的精美，更需要交付物具备可维护性和可调整性。本文的解决方案能够交付具有解耦图层和真实文本的可编辑artifacts，允许用户在图形用户界面（GUI）上直接进行鼠标拖拽和布局调整，从而在视觉质量与工程可维护性之间取得了关键平衡，推动了自动化视觉设计向实际生产级应用迈进。 ### § 2 前人工作与不足 该问题此前未被完整解决，现有研究主要沿着两条正交但均存在局限的路径发展。第一条是“左脑”纯代码生成路径，以GPT-5.6 Sol、Claude Fable 5和Kimi K3等前沿LLM以及Design2Code、LaTCoder、UI2Code等基准为代表。这些系统能够自动生成结构完整、组织清晰的HTML/SVG/CSS布局，提供干净的图层和交互式文本。然而，它们存在不足的根本原因在于代码作为一维符号序列与二维空间视觉直觉之间的固有鸿沟。模型精通语法和DOM树，但缺乏全局视觉控制力，直接写布局代码往往只能产出高度模板化的“大标题、卡片、圆角阴影”组合。此外，要求模型用纯代码手绘复杂的视觉资产（如电影级背景、3D视觉元素或精细插图）成本极高且效果僵硬，导致最终产物常以简单几何色块或emoji作为占位符，停留在未完成的草稿阶段。 第二条是“右脑”视觉内容生成路径，以Latent Diffusion、GPT Image 2、Nano Banana 2以及TextD...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在探索自动化视觉设计时，研究者首先观察到现有技术陷入了两条正交但均存在致命缺陷的路径。一方面，基于 LLM 的纯代码生成（如直接编写 HTML/CSS）具有天然的工程优势：它能够提供清晰的图层、可交互的文本以及易于后期修改的结构。然而，代码本质上是一维的符号序列，LLM 虽然精通语法和 DOM 树，却极度缺乏二维空间感和全局审美直觉，导致生成的布局往往沦为“大标题、卡片、圆角阴影”的刻板模板；同时，用纯代码“手绘”复杂的视觉资产（如电影级背景、3D 视觉元素）成本极高且效果僵硬，最终只能用简单的色块或 emoji 作为占位符。另一方面，基于 diffusion model 的图像生成路径虽然压缩了人类数百年的艺术先验，能瞬间产出具备顶级构图、光影和质感的图像，却存在结构性的工程弱点：其输出的光栅图像不仅文本容易扭曲错乱，且元素在像素层面深度纠缠，无法分离为可编辑的图层，根本无法满足下游设计交付的精确编辑需求。 面对“代码有结构无审美”和“图像有审美无结构”的僵局，研究者开始寻找打破瓶颈的理论线索。在“Generation for Understanding”的探索中，以往的多模态模型（UMMs）多将生成用于强符号逻辑的线性推理（如画几何辅助线），但收效甚微，因为严谨的演绎推理与生成模型的隐式反馈机制天然不兼容。然而，一个关键的类比浮现出来：人类很难在梦中解数学题，但梦境却是视觉灵感与创意意象的源泉。这意味着，生成模型真正的价值不在于辅助逻辑推演，而在于提供难以用一维文本量化的空间美学、色彩氛围和构图参考。与此同时，World Action Model (WAM) 的概念提供了系统架构上的启发，即可以将系统拆分为负责决策的“大脑”和负责模拟环境的“模拟器”。 顺着这些线索，研究者推导出了一种全新的分工协作机制：既然代码不擅长审美和复杂资产，图像不擅长结构和工程交付，何不让两者各司其职？将具有通用推理能力的 VLM 作为“创意大脑”主导需求理解和布局规划，将图像生成模型降级为按需调用的“视觉世界模拟器”。在具体执行上，摒弃让图像模型直接输... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：## **Editable Visual Design** Junyan Ye[1,2,] _[∗]_ , Wei Liu[1,] _[∗]_ , Dongzhi Jiang[4] , Zichen Wen[5] , HaoDong Li[4] , Zhutao Lv[2] , Jiaxin Lin[1] , Jinhua Yu[2] , Jun He[2] , Zilong Huang[2] , Rui Chen[1,] _[†]_ , Weijia Li[3,] _[†]_ - _1Tencent Hunyuan, 2Sun Yat-sen University_ - _3Tsinghua University, 4The Chinese University of Hong Kong, 5Shanghai Jiao Tong University_ While diffusion base models such as GPT-Image-2 and Nano-Banana exhibit remarkable visual expressiveness, their end-to-end generation inherently yields flattened bitmaps with error-prone text, precluding layer-wise post-editing. Conversely, code-based visual generation via Coding Agents provides precise layout control and decoupled layers, yet remains constrained by a lack of global aesthetic intuition and the difficulty of coding complex visual assets. To address this, we propose Editable Visual Design, a new p...", "additional_insights": "### § 8 Take-aways\n\n本文提出的 Editable Visual Design 范式通过将 VLM 设为负责需求理解与审美判断的“creative brain”，将图像生成模型设为按需调用的“visual world simulator”，成功弥合了纯代码生成缺乏全局审美直觉与纯扩散模型生成不可编辑之间的鸿沟。系统遵循“imagine first, then act”的闭环工作流，先通过图像模型生成 imagined visual 以提取构图与色彩先验，再独立生成无背景的 standalone assets 并编写原生 HTML/CSS，从根本上避免了像素纠缠和文字畸变。在验证阶段，系统结合 headless browser 的 deterministic layout checks 与 VLM 的 multimodal visual reflection 进行迭代自愈，有效修复了样式溢出与元素遮挡等代码缺陷。最终交付物由完全解耦的 native DOM nodes 构成，允许用户直接进行拖拽和文本编辑，同时通过 Agent Design Replay 将黑盒生成过程转化为可追溯的设计轨迹。\n\n### § 9 最脆弱的假设\n\n该系统最核心且失败代价最大的假设是：图像生成模型（visual world simulator）生成的 imagined visual 能够提供足够高质量的全局审美先验，并且 VLM（creative brain）能够准确地将这种二维的视觉先验解析并转化为一维的 HTML/CSS 代码结构。如果这个假设不成立，整个架构的协同机制就会失效：如果图像模型输出的参考图在构图上平庸或缺乏明确焦点，VLM 就没有有价值的审美先验可以提取，最终生成的代码仍会退化为论文所批评的“模板化、单调”的布局。在实际中，这个假设极易不成立，因为文本到图像的生成往往具有随机性，且将复杂的视觉空间关系（如透视、光影、非对称平衡）映射到基于 Flexbox 和 DOM 树的逻辑代码中本身就是一个高度有损的降维过程。论文虽然展示了少量精选的 case studies（如 Figure 3 和 Figure 4），但并未提供定量证据证明 VLM 能稳定、准确地从 imagined visual 中提取并复现色彩与构图先验，也未能排除最终视觉效果主要依赖底层 VLM 自身代码能力的可能性。\n\n### § 10 最小复现实验\n\n在一周时间内，可以设计一个最小复现实验来验证“imagine first”这一核心假设的有效性，即生成 imagined visual 是否真的能提升最终代码布局的审美质量。使用 20 个涵盖不同风格（如极简海报、信息图）的文本 design briefs 作为输入数据。实现两个基于同一前沿 VLM（如 GPT-4o 或 Claude 3.5）的代码生成 pipeline：Baseline pipeline 直接根据文本 prompt 生成原生 HTML/CSS；Experimental pipeline 则先调用图像生成模型（如 DALL-E 3）生成一张 imagined visual，将图片连同文本 prompt 一起输入给 VLM，要求其解析视觉特征后再生成原生 HTML/CSS。为了控制时间成本，跳过 standalone asset 生成和复杂的 self-healing 闭环，仅比较单次生成的代码渲染效果。将两组代码渲染为截图，使用更强的 VLM 作为裁判进行盲测打分，测量 visual balance、color harmony 和 typographic hierarchy 三个维度的主观评分。如果 Experimental pipeline 在绝大多数样本上显著优于 Baseline，则支持论文的 claim；如果两者评分无显著差异甚至 Experimental 因过度拟合参考图而导致布局崩坏，则直接反驳了“视觉模拟先验有助于代码布局”的核心假设。", "research_value": "### § 11 最强反例设计\n\n要对该论文进行最有力的攻击，我会设计一个针对“非笛卡尔坐标系布局”的实验，以挑战其核心假设：即 VLM 能够将复杂的二维视觉先验无损地降维映射为一维的 HTML/CSS 代码结构。具体而言，我会构建一个包含高密度重叠元素、非线性排版与有机视觉流向的测试集，例如具有文本绕排的杂志级双栏排版，或元素相互穿插的拼贴风海报。在这个反例实验中，将论文提出的“imagine first, then act”pipeline 与一个仅使用强大 VLM 直接生成代码的 baseline 进行对比，并引入严格的“布局保真度”与“可编辑性”双重定量指标。我的核心论点是：该论文所展示的美学提升，其实际来源并非 VLM 成功解析了 imagined visual 的构图先验，而是系统通过 diffusion model 生成了高质量的 standalone assets（如精美插图）来掩盖其底层布局代码的平庸。当面对需要精确像素级重叠、负空间共享或非矩形文本流的复杂设计时，由于 HTML/CSS 的 Flexbox 和 Grid 布局本质上是为矩形盒模型设计的，VLM 将无法把 imagined visual 中的有机空间关系转化为合规的代码。此时，系统将面临两难困境：要么生成大量使用 `position: absolute` 的硬编码代码来强行复刻视觉，从而彻底丧失论文声称的“解耦图层与流式可编辑性”；要么退化为简单的上下文堆叠，导致最终渲染结果与 imagined visual 产生巨大偏差。这个反例不仅提供了“视觉效果提升实为资产注入而非布局理解”的替代解释，更精准识别出方法在盒模型限制下可预测失败的边界条件。\n\n### § 12 Follow-up Research Idea\n\n基于对该方法核心局限的理解，我提出一个全新的研究框架：**Differentiable Spatial Constraint Graphs for Generative Design**，旨在彻底绕过 VLM 将二维视觉先验直接翻译为一维符号代码的脆弱瓶颈。该想法的驱动局限在于，当前范式要求 LLM 承担超出其能力的空间推理任务，即用离散的 CSS 属性去“猜”连续的视觉关系，这本质上是一个高度有损的降维过程。为了满足既保持生产级可编辑性又实现复杂空间构图的需求，我们可以借鉴计算机图形学中的 Constraint Satisfaction Problems (CSP) 与 UI 布局求解器（如 Cassowary 算法），并结合现代 Differentiable Rendering 技术。在这个新框架下，VLM 不再直接输出 HTML/CSS，而是输出一个声明式的 Spatial Constraint Graph（节点为设计元素，边为拓扑关系如“对齐”、“环绕”、“负空间比例为 X”）。随后，一个可微的布局求解器将 imagined visual 的渲染图作为目标分布，通过梯度下降优化图节点的连续坐标参数，使其既符合 VLM 声明的语义约束，又在视觉特征上对齐 diffusion model 提供的审美先验，最后再将优化后的精确坐标编译为原生 DOM。第一个实验将构建一个包含复杂重叠排版的视觉对齐基准，比较 Direct VLM Coding、本文的 Imagine-then-Act 以及提出的 Constraint Graph 求解器在“视觉对齐误差”和“DOM 结构解耦度”上的表现。这一提议与已有工作的根本区别在于：它将 LLM 的角色从“空间代码的编写者”降维为“空间关系的声明者”，把连续空间优化的难题交还给专业的数学求解器，从而在神经符号系统与图形学布局算法之间建立了一条全新的研究路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Junyan Ye\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Wei Liu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Dongzhi Jiang\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Zichen Wen\", \"affiliations\": [5], \"markers\": []},\n    {\"name\": \"HaoDong Li\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Zhutao Lv\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jiaxin Lin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jinhua Yu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jun He\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Zilong Huang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Rui Chen\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Weijia Li\", \"affiliations\": [3], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Tencent Hunyuan\"},\n    {\"id\": 2, \"name\": \"Sun Yat-sen University\"},\n    {\"id\": 3, \"name\": \"Tsinghua University\"},\n    {\"id\": 4, \"name\": \"The Chinese University of Hong Kong\"},\n    {\"id\": 5, \"name\": \"Shanghai Jiao Tong University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding authors\"}\n  ]\n}\n```", "summary_translation": "尽管 GPT-Image-2 和 Nano-Banana 等 diffusion base models 展现出卓越的视觉表现力，但其 end-to-end generation 本质上会产生带有容易出错文本的 flattened bitmaps，从而阻碍了 layer-wise post-editing。相反，通过 Coding Agents 进行的 code-based visual generation 提供了精确的 layout control 和 decoupled layers，但仍然受限于缺乏全局审美直觉以及编码复杂 visual assets 的困难。为了解决这个问题，我们提出了 Editable Visual Design，这是一种由 Coding Agent 驱动的新范式。我们将 VLM 指定为用于需求理解、任务规划和审美判断的“创意大脑”，同时利用 image generation model 作为按需的“视觉世界模拟器”来合成 standalone visual assets。在“先想象，后行动”的 closed-loop workflow 下运行，该 agent 生成 isolated assets，编写 native HTML/CSS，并根据 visual rendering feedback 迭代优化设计。此外，Agent Design Replay 忠实地重现了类似于专业人类设计师的创意与推理轨迹。最终，该系统交付具有 decoupled layers 和 real text 的 editable artifacts，使用户能够在 graphical user interface 上执行直观的鼠标拖拽和 layout adjustments。在 posters、infographics 和其他场景上的验证表明，这种范式成功实现了 refined aesthetics 和 production-grade editability。"}, {"title": "SWE-Gate: Passing Functional Tests Is Not Enough for Software Engineering Agents", "arxiv_id": "2609.04167", "authors": "Xin He, Yanlin Wang, Mingwei Liu, Jiachi Chen, Hongyu Zhang, Guanbin Li", "summary": "Repository-level software engineering benchmarks have significantly advanced the evaluation of coding agents, but existing benchmarks primarily measure whether generated patches pass functional tests and overlook review-derived acceptance constraints (review constraints) that often influence whether a patch is acceptable in real-world software development. We introduce SWE-Gate, a repository-level benchmark for software engineering agents that explicitly evaluates review constraint compliance alongside functional correctness. SWE-Gate derives review constraints from real pull request review comments and synthesizes repository-level repair instances around these constraints. Each instance provides separate functional and constraint tests, together with non-compliant and gold patches, enabling explicit separation between issue resolution capability and review constraint compliance. We construct SWE-Gate with 303 repository-level repair instances spanning 75 open-source Python repositories across diverse software domains. Experiments with four LLM backends spanning different capability levels under a common coding-agent scaffold reveal a substantial gap between functional success and success under the complete repair specification: among 644 repairs that pass the functional tests, 221 fail to satisfy the provided review constraints. These findings show that functional-only evaluation overestimates agents' ability to satisfy the full requirements of repository-level repair tasks. The replication package including code, data, and experimental results is available at https://github.com/DeepSoftwareAnalytics/SWE-Gate.", "category": "cs.AI", "cluster": "Code \u0026 Software Agents", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior, Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一个名为 SWE-Gate 的仓库级基准测试，专门用于评估软件工程智能体在满足代码审查约束方面的能力。论文通过实验揭示了现有编码智能体在通过功能测试后，仍可能无法满足实际开发中审查约束的失败模式。根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents / Multi-Agent LLMs，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。” 此外，重要校准中也明确指出：“不要只因为论文是 benchmark、evaluation、behavior analysis... 就排除。只要标题和摘要明确围绕 LLM Agents / Agentic AI / Self-Evolving LLMs 展开，就应返回 True。” 该论文明确针对 coding agents 的能力边界和评估进行了深入研究，直接有助于理解和改进智能体在复杂软件工程任务中的表现，因此完全符合您的核心研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：现有的 repository-level software engineering agents 评测基准主要依赖 functional tests 来判定 patch 的有效性，却忽略了真实软件开发中由 code review 衍生出的验收约束。为了弥补这一缺陷，作者引入了 SWE-Gate，这是首个在评估 functional correctness 的同时，显式评估 agents 对 review-derived acceptance constraints 遵循情况的 repository-level benchmark。这个问题至关重要，因为在真实的软件工程实践中，一个能够解决 reported issue 并通过 functional tests 的 patch 并不一定会被 maintainers 接受。在 code review 阶段，maintainers 经常要求贡献者满足功能正确性之外的额外工程要求，例如保持 backward compatibility、维持既定的 exception semantics 或遵循仓库特定的实现规范。仅凭 functional tests 评估 agents 会严重高估其在实际仓库级修复任务中的能力，导致大量“hidden failures”（即通过功能测试但违反审查约束的修复）被遗漏。解决这一问题能够为 coding agents 提供更严格、更贴近现实的评估信号，推动模型不仅生成功能正确的代码，还能生成符合实际工程标准和项目规范的 acceptable repairs。\n\n### § 2 前人工作与不足\n\n在本文之前，repository-level repair 领域的评估主要被 SWE-Bench 及其衍生工作所主导。SWE-Bench 从真实的 GitHub issue-pull request pairs 中构建任务，并使用 PR 中提供的 executable functional tests 来评估 patch，驱动了 SWE-agent 和 OpenHands 等系统。后续的 benchmark 如 SWE-bench-java、Multi-SWE-bench 等进一步扩展了编程语言、多模态或企业项目场景。然而，这些现有基准普遍存在一个关键的评测缺口：它们假设通过 functional test suite 就等同于修复成功。这种假设在真实开发中是失效的，因为 functional tests 通常只验证 reported issue 是否被功能性地解决，而无法覆盖 code review 中涉及的 maintainability、consistency、compatibility 等深层工程关注点。此前并非没有研究意识到测试套件的局限性（如 overfitting repairs 问题），也出现了如 SWE-Shield 中的 DesignHunter 等 constraint-aware benchmark 尝试引入设计约束。但这些前人工作之所以仍然不够，是因为它们在验证约束时依赖 LLM-as-a-judge，这种基于 LLM 的验证方法会引入主观性和 evaluation biases，缺乏确定性。SWE-Gate 正是针对这一评测缺口，通过从真实的 review comments 中提取约束，并为每个实例构建独立且可执行的 functional tests 和 constraint tests，实现了对两个维度的确定性分离评估，从而彻底解决了前人工作中约束验证不可靠或未被显式定义的问题。", "core_insight": "### § 3 重建作者的思考路径\n\n作者首先观察到，当前 repository-level 软件工程评测（以 SWE-Bench 为代表）几乎全部依赖 functional test 的 pass/fail 作为唯一验收标准，这种范式直接继承了 automated program repair 领域长期存在的“plausibility vs. correctness”问题：弱测试套件容易放过 overfitting patch，而 SWE-Bench 的测试通常直接取自 PR 附带的 issue 复现测试，覆盖面有限。与此同时，软件工程经验研究（如 Bacchelli \u0026 Bird, Sadowski et al.）早已表明，真实 code review 关注的远不止功能正确性，maintainer 会就 backward compatibility、exception semantics、API convention 等提出额外要求，这些要求以 review comment 的形式存在，却从未被任何主流 benchmark 纳入可执行的评测维度。作者由此识别出一个结构性盲区：一个能修复 issue 的 patch，完全可能在工程约束层面不合格，而现有 benchmark 无法探测这类“hidden failure”。要弥合这一缺口，必须同时满足三个条件——约束必须源自真实 review 而非人为编造、约束必须与功能需求可分离且可独立执行、约束必须在同一 repair 任务中可被同时满足。受 SWE-Mirror 跨仓库迁移范式的启发，作者选择以 review-derived constraint 为锚点，先从成熟项目的 review history 中抽取 atomic、可验证的 constraint seed，再将其 bug pattern 和工程意图迁移到语义兼容的目标仓库中实例化，最终通过 functional test 与 constraint test 的双轨验证矩阵，确保两个维度的 separability 和 joint satisfiability。这条路径的关键在于“constraint-first”：不是在已有任务上附加规则，而是围绕真实工程约束反向构造任务，从而保证评测的生态效度。\n\n### § 4 核心 Intuition\n\n现有 benchmark 把“修好 issue”等同于“通过 functional test”，但真实代码合入还要求 patch 满足 maintainer 在 review 中提出的工程约束——这些约束与功能正确性是逻辑独立的：一个 patch 可以完全修复 bug 却违反 backward compatibility 或 exception semantics。SWE-Gate 的核心直觉是，如果从真实 review comment 中提取这些约束，并为每条约束构造独立的 executable constraint test，就能在 functional test 之外建立一个可分离、可确定执行的“gate”，从而暴露那些功能正确但工程不合格的 hidden failure。这一设计之所以奏效，是因为它将评测从单维 pass/fail 扩展为 dual-dimension 验证，同时用 non-compliant patch 和 gold patch 证明两个维度既独立又可同时满足，使 constraint compliance 成为不可被 functional success 蕴含的独立信号。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《SWE-Gate: Passing Functional Tests Is Not Enough for Software Engineering Agents》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 本文提出的核心研究问题是：现有的 repository-level software engineering agents 评测基准主要依赖 functional tests 来判定 patch 的有效性，却忽略了真实软件开发中由 code review 衍生出的验收约束。为了弥补这一缺陷，作者引入了 SWE-Gate，这是首个在评估 functional correctness 的同时，显式评估 agents 对 review-derived acceptance constraints 遵循情况的 repository-level benchmark。这个问题至关重要，因为在真实的软件工程实践中，一个能够解决 reported issue 并通过 functional tests 的 patch 并不一定会被 maintainers 接受。在 code review 阶段，maintainers 经常要求贡献者满足功能正确性之外的额外工程要求，例如保持 backward compatibility、维持既定的 exception semantics 或遵循仓库特定的实现规范。仅凭 functional tests 评估 agents 会严重高估其在实际仓库级修复任务中的能力，导致大量“hidden failures”（即通过功能测试但违反审查约束的修复）被遗漏。解决这一问题能够为 coding agents 提供更严格、更贴近现实的评估信号，推动模型不仅生成功能正确的代码，还能生成符合实际工程标准和项目规范的 acceptable repairs。 ### § 2 前人工作与不足 在本文之前，repository-level repair 领域的评估主要被 SWE-Bench 及其衍生工作所主导。SWE-Bench 从真实的 GitHub issue-pull request pairs 中构建任务，并使用 PR 中提供的 executable functional tests 来评估 patch，驱动了 SWE-agent 和 O...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 作者首先观察到，当前 repository-level 软件工程评测（以 SWE-Bench 为代表）几乎全部依赖 functional test 的 pass/fail 作为唯一验收标准，这种范式直接继承了 automated program repair 领域长期存在的“plausibility vs. correctness”问题：弱测试套件容易放过 overfitting patch，而 SWE-Bench 的测试通常直接取自 PR 附带的 issue 复现测试，覆盖面有限。与此同时，软件工程经验研究（如 Bacchelli \u0026 Bird, Sadowski et al.）早已表明，真实 code review 关注的远不止功能正确性，maintainer 会就 backward compatibility、exception semantics、API convention 等提出额外要求，这些要求以 review comment 的形式存在，却从未被任何主流 benchmark 纳入可执行的评测维度。作者由此识别出一个结构性盲区：一个能修复 issue 的 patch，完全可能在工程约束层面不合格，而现有 benchmark 无法探测这类“hidden failure”。要弥合这一缺口，必须同时满足三个条件——约束必须源自真实 review 而非人为编造、约束必须与功能需求可分离且可独立执行、约束必须在同一 repair 任务中可被同时满足。受 SWE-Mirror 跨仓库迁移范式的启发，作者选择以 review-derived constraint 为锚点，先从成熟项目的 review history 中抽取 atomic、可验证的 constraint seed，再将其 bug pattern 和工程意图迁移到语义兼容的目标仓库中实例化，最终通过 functional test 与 constraint test 的双轨验证矩阵，确保两个维度的 separability 和 joint satisfiability。这... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **SWE-Gate: Passing Functional Tests Is Not Enough for Software Engineering Agents** # **Xin He**[1] **, Yanlin Wang**[1][∗] **, Mingwei Liu**[1] **, Jiachi Chen**[2] **, Hongyu Zhang**[3] **, Guanbin Li**[4] 1School of Software Engineering, Sun Yat-sen University 2College of Computer Science and Technology, Zhejiang University 3School of Big Data and Software Engineering, Chongqing University 4School of Computer Science and Engineering, Sun Yat-sen University ## **Abstract** Repository-level software engineering benchmarks have significantly advanced the evaluation of coding agents, but existing benchmarks primarily measure whether generated patches pass functional tests and overlook review-derived acceptance constraints (review constraints) that often influence whether a patch is acceptable in real-world software development. We introduce SWE-Gate, a repository-level benchmark for so...", "additional_insights": "### § 8 Take-aways\n\n现有 repository-level benchmark（如 SWE-Bench）仅以 functional test 通过与否判定 repair 成功，忽略了真实 code review 中 maintainer 提出的额外 acceptance constraint（如 backward compatibility、exception semantics、API convention 等）。SWE-Gate 首次将 review-derived constraint 作为独立可执行评估维度引入，从真实 PR review comment 中提取 constraint seed，通过 cross-repository transfer 在 75 个 Python 仓库中合成 303 个 repair instance，每个 instance 包含独立的 functional test 和 constraint test，以及 non-compliant patch（通过 functional 但违反 constraint）和 gold patch（两者均通过），从而证明两个维度可分离、可独立验证、可联合满足。实验在 Mini-SWE-Agent scaffold 下评估四个 LLM backend，发现 644 个通过 functional test 的 repair 中有 221 个违反 constraint（HFR 34.3%），其中 GPT-4o-mini 的 HFR 高达 53.6%。提供自然语言 constraint 描述（+C 条件）使所有模型的 Joint Success Rate 提升 1.0–11.5 个百分点，Constraint Following Rate 提升 10.2–25.6 个百分点，但 Functional Success Rate 反而略有下降，表明满足额外 requirement 增加了 repair 复杂度。不同 constraint category 难度差异显著：Scope Generalization、Lifecycle Cleanup/Resource、Encoding/Escaping/Quoting 的 CFR 最低，而 Missing-vs-Empty/Sentinel Distinction 和 Ordering/Argument Preservation 最易满足。\n\n### § 9 最脆弱的假设\n\n最脆弱的核心假设是：**LLM-assisted synthesis 能够生成在目标仓库中\"naturally motivated\"的 constraint，即 transferred constraint 在新代码上下文中是真实工程场景中 maintainer 会自然提出的要求，而非人为拼造的规则。** 这个假设直接支撑了 SWE-Gate 的生态效度——如果 transferred constraint 在目标仓库中不自然，那么 benchmark 测量的就不是 agent 在真实 review 场景下的 constraint compliance，而是一种人工构造的 compliance 能力，核心贡献\"functional-only evaluation overestimates agents' ability\"的结论就会从\"揭示了真实差距\"退化为\"揭示了一个人造测试的差距\"。\n\n该假设在实践中可能不成立的原因在于 cross-repository transfer 本身的语义鸿沟：一个从 Pydantic review 中提取的 backward compatibility constraint，被 transfer 到一个功能相似但架构不同的仓库时，该 constraint 可能在该仓库的 API 设计中并不构成真实关注点——maintainer 在那个项目中可能根本不会提出这个要求。论文虽然通过三阶段 quality assurance（Docker validation matrix、LLM-based semantic review、manual inspection）来过滤不自然的 instance，并明确列出了\"constraint not naturally motivated by synthesized scenario\"作为 rejection criterion，但论文未提供独立的外部验证证据（如让目标仓库的实际 maintainer 判断 constraint 是否合理），也没有报告 manual inspection 阶段因\"不自然\"被拒绝的具体比例。所有 evidence 都是内部一致性检查，缺乏外部 ground truth，因此无法排除系统性偏差——即 LLM reviewer 和 LLM synthesizer 共享相似的\"自然性\"判断盲区。\n\n### § 10 最小复现实验\n\n用一周时间，可以验证论文最核心的 empirical claim——\"大量通过 functional test 的 repair 同时违反 review constraint\"——而无需复现完整的 303 instance 构建流程。具体方案：从 SWE-Gate 的公开 GitHub repo 获取已发布的 303 个 instance 及其 functional test 和 constraint test。选取一个中等能力模型（如 GPT-4o-mini 或 DeepSeek-V4-Flash）配合 Mini-SWE-Agent scaffold，在 +C 条件下对全部 303 个 instance 运行 repair generation。对每个生成的 patch，分别执行 functional test suite 和 constraint test suite，记录四种状态：两者均通过、仅 functional 通过、仅 constraint 通过、两者均失败。计算 FSR、CFR、JSR 和 HFR。如果 HFR 显著大于 0（论文报告 GPT-4o-mini 为 53.6%，其他模型 29.5%–35.8%），则支持核心 claim；如果 HFR 接近 0 或大多数 functional success 同时通过 constraint test，则反驳 claim，表明 functional test 已隐含覆盖了 constraint 要求，两个维度不可分离。关键控制点：确保 agent 不能访问 constraint test 文件，且执行前丢弃 agent 对 test 文件的任何修改，防止 evaluation leakage。这个实验不需要复现 constraint extraction 和 instance synthesis 流程，直接使用已发布数据即可在一周内完成。", "research_value": "### § 11 最强反例设计\n\n如果要构建针对 SWE-Gate 的最强反例，核心攻击点应直指其生态效度，即 transferred constraint 在目标仓库中的“自然性”。我会设计一个“Maintainer Ground Truth”实验，直接证伪论文中“LLM-synthesized constraints 代表真实工程要求”的隐含前提。具体而言，从 SWE-Gate 的 75 个 Python 仓库中抽取 50 个 instance，邀请这些仓库的实际 maintainers 或核心贡献者参与盲测。向他们展示原始 issue、functional test、gold patch 以及合成的 constraint test，要求其判断：第一，在真实 PR review 中是否会提出该 constraint；第二，若 patch 通过 functional test 但违反该 constraint，是否会拒绝合并。如果实验结果显示 maintainers 的认同率低于 30%，且他们认为大量 hidden failures 实际上是可接受的工程妥协，那么论文报告的 34.3% Hidden Failure Rate (HFR) 就不是在测量 agents 对真实工程标准的违背，而是在测量 agents 对 LLM 生成的“对抗性边缘条件”的服从度。进一步地，我会分析这些被拒绝的 patch，论证 SWE-Gate 的 constraint tests 本质上可能只是伪装成 review constraint 的“额外 functional tests”，即论文并未发现一个正交的评估维度，而仅仅是揭示了原始 functional test suite 覆盖率不足。这一替代解释将彻底瓦解论文“functional-only evaluation overestimates ability”的核心贡献，将其降维为“测试集不够全面”的常识问题。\n\n### § 12 Follow-up Research Idea\n\n基于 SWE-Gate 将 review constraint 静态化为可执行测试的局限，我提出一个 novel research idea：构建交互式、多轮的 code review negotiation benchmark。SWE-Gate 的核心局限在于它将真实的 code review 简化为一次性的二元判定，忽略了真实开发中 maintainer 与贡献者之间通过自然语言进行的迭代式协商与妥协过程。真实场景下，constraints 往往不是硬性门槛，而是讨论的起点，开发者可以通过解释设计权衡来“反驳”或“豁免”某些 constraints。这个未满足的需求驱动我们将评估目标从“单次 constraint compliance”转向“多轮 consensus reaching with functional preservation”。可以借鉴对话系统中的 interactive evaluation 和 LLM-as-a-judge 的动态交互机制，引入一个基于目标仓库历史 review 风格 grounding 的 LLM-maintainer 模拟器。第一个实验将构建一个多轮交互环境：agent 提交初始 patch，LLM-maintainer 基于代码变更生成自然语言 review comments（而非直接运行 constraint test），agent 需要理解 feedback 并决定是修改代码、坚持原方案还是进行论证，整个过程以 functional test 作为底线约束。我们将评估 agents 的“Consensus Success Rate”（在 K 轮内达成一致且不破坏 functional correctness）和“Negotiation Efficiency”，并与 SWE-Gate 的单次 +C 条件进行对比。这一提议与 SWE-Gate 的根本区别在于，它不再将 constraints 视为静态的 ground truth，而是将其视为可被 functional correctness 和工程论证动态重塑的 negotiable targets，从而打开评估 agents 社交化协作与工程沟通能力的新方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Xin He\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yanlin Wang\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Mingwei Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiachi Chen\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Hongyu Zhang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Guanbin Li\", \"affiliations\": [4], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Sun Yat-sen University\"},\n    {\"id\": 2, \"name\": \"Zhejiang University\"},\n    {\"id\": 3, \"name\": \"Chongqing University\"},\n    {\"id\": 4, \"name\": \"Sun Yat-sen University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Yanlin Wang is the corresponding author.\"}\n  ]\n}\n```", "summary_translation": "Repository-level 软件工程 benchmarks 显著推进了对 coding agents 的评估，但现有的 benchmarks 主要衡量生成的 patches 是否通过 functional tests，而忽略了 review-derived acceptance constraints (review constraints)，这些约束通常会影响在真实世界软件开发中 patch 是否可接受。我们引入了 SWE-Gate，这是一个面向 software engineering agents 的 repository-level benchmark，它在 functional correctness 之外明确评估了 review constraint compliance。SWE-Gate 从真实的 pull request review comments 中提取 review constraints，并围绕这些约束合成了 repository-level repair instances。每个 instance 提供独立的 functional tests 和 constraint tests，以及 non-compliant patches 和 gold patches，从而能够明确区分 issue resolution capability 和 review constraint compliance。我们构建的 SWE-Gate 包含 303 个 repository-level repair instances，涵盖了跨不同软件领域的 75 个开源 Python repositories。在常见的 coding-agent scaffold 下，使用跨越不同能力水平的四个 LLM backends 进行的实验揭示了 functional success 与在 complete repair specification 下的成功之间存在显著差距：在通过 functional tests 的 644 个 repairs 中，有 221 个未能满足提供的 review constraints。这些发现表明，functional-only evaluation 高估了 agents 满足 repository-level repair tasks 全部要求的能力。包含代码、数据和实验结果的 replication package 可在 https://github.com/DeepSoftwareAnalytics/SWE-Gate 获取。"}]}, {"name": "Conversational Memory \u0026 Retrieval", "count": 2, "papers": [{"title": "RuleMem: Active Rule Memory for Long-Term Conversational Agents", "arxiv_id": "2609.03915", "authors": "Xingyuan Zeng, Zuohan Wu, Quanming Yao, Yue Wang, Wei Liu, Libin Zheng, Jiuke Wang, Jian Yin", "summary": "Question answering agents in long-term conversations must reason over massive, temporally dispersed dialogue histories. However, existing memory mechanisms primarily treat past information as \\textit{passively} stored facts, leading to semantic gaps and unreliable reasoning. To address this limitation, we propose RuleMem, a rule-based memory framework that induces reusable logical rules from historical interactions to \\textit{actively} guide both evidence retrieval and reasoning. Specifically, RuleMem constructs natural-language Horn clauses from conversations and validates them via a Rule Perplexity Consistency (RPC) mechanism. These induced rules enable the retrieval of semantically distant evidence while providing an explicit logical structure for answer generation. We conducted a comprehensive evaluation of RuleMem on two long-term conversational benchmarks, LoCoMo and LongMemEval_s*. In a rigorous comparison against 14 baselines on LoCoMo, RuleMem achieved the highest accuracy, exceeding the baseline average by 27.47 points (a 54.3% relative improvement).", "category": "cs.CL", "cluster": "Conversational Memory \u0026 Retrieval", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是为长期对话智能体提出了一种新的记忆机制框架。
