Trace 显示：`robot.place(\"shirt\", \"drawer\") → fail: drawer not open enough`（抽屉没开够大）。\n\n3.  **人类修正（Human Correction）：**\n    *   **输入：** 人类观察者看到失败，提供自然语言修正，例如 \"this time, first open the drawer more\"（这次先多开一点抽屉）。\n    *   **处理：** 系统不直接修改代码，而是将这条修正与执行 Trace 一起反馈给 LLM。LLM 分析失败原因（抽屉开启角度不足），并理解人类的意图。\n\n4.  **代码重构与技能蒸馏（Code Refinement \u0026 Skill Distillation）：**\n    *   **处理：** LLM 根据修正和 Trace 重新生成代码，调整 `open_drawer` 的参数或逻辑。\n    *   **关键步骤：** 成功的修正被提炼为一个 **Skill**（技能）。例如，生成一个名为 `OpenDrawerFully` 的技能模块，包含具体的代码模式和自然语言描述。\n    *   **输出：** 更新后的代码被执行，任务成功。同时，新技能被存入 **Skill Library**，作为长期上下文学习（Long-term In-context Learning）的一部分，供未来任务复用。\n\n5.  **迭代与泛化（Iteration \u0026 Generalization）：**\n    *   **处理：** 在后续任务中（如“把书放进柜子”），LLM 会自动从 Skill Library 中检索相关技能（如“充分打开容器”），无需人类再次修正，从而实现零样本或少样本的迁移。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文**没有**核心的数学推导过程。\n\nARCHITECT 是一个基于工程架构和代理交互的系统框架，而非基于理论推导的算法模型。其核心贡献在于：\n1.  **架构设计：** 将 LLM 作为代码生成器，结合模块化工具链（Perception/Control Tools）。\n2.  **交互机制：** 引入 Human-in-the-loop 的自然语言修正机制。\n3.  **记忆机制：** 通过 Skill Library 实现知识的持久化和复用。\n\n因此，不存在需要解释的公式或理论证明。其有效性通过实验验证，而非数学证明。\n\n### § 7 实验设计与结论\n\n**1. 验证 ARCHITECT 是否优于现有的 SOTA VLA 模型和程序合成基线？**\n*   **设计了什么实验：** 在 Franka Panda 机器人上执行 8 个具有挑战性的真实世界任务（包括多步推理、可变形物体、长视界任务等）。对比基线包括 SOTA VLA 模型（$\\pi_0$, $\\pi_0.5$）和程序合成方法（Code as Policies, CaP）。使用成功率（SR）、目标条件召回率（GCR）和归一化任务进展（NTP）作为指标。\n*   **问题的答案：** ARCHITECT 在复杂任务（如折叠衣物、关闭抽屉）上显著优于所有基线。VLA 模型在分布外（OOD）场景下容易级联失败，且对指令措辞敏感；CaP 缺乏迭代修正能力，对感知模糊性脆弱。ARCHITECT 通过模块化架构和 HiTL 修正，实现了更高的鲁棒性和成功率。\n\n**2. 人类修正（HiTL）是否比自动 VLM 修正更有效？**\n*   **设计了什么实验：** 进行消融实验，对比 ARCHITECT-HiTL（人类修正）与 ARCHITECT-VLM（VLM 自动修正）。\n*   **问题的答案：** 人类修正能解决 VLM 难以检测的细微物理失败模式（如深度估计误差导致的放置高度问题、物体物理属性直觉）。人类修正编码了更丰富的诊断信息和物理直觉，而 VLM 仅依赖像素观察，容易忽略细微的物理约束。\n\n**3. Skill Library 是否能实现跨任务的知识迁移并减少人类干预？**\n*   **设计了什么实验：** 进行 N=6 的人类评估实验。参与者先完成任务 1（如放杯子），积累技能库；然后在任务 2（如放盒子）中，测试是否携带任务 1 的技能库会影响任务 2 的成功率和所需的人类修正次数。\n*   **问题的答案：** 是的。携带技能库后，任务 2 的成功率从 0/6 提升到 4/6，且平均所需的人类修正次数从 4.67 次大幅下降到 0.83 次。这证明了 Skill Library 实现了有效的知识迁移，摊销了人类监督成本，使得系统在新任务中能以“寥寥数语”快速适应。", "additional_insights": "### § 8 Take-aways\n\nARCHITECT 将机器人策略获取重构为交互式程序合成任务，利用 LLM 作为编排代理（orchestrator agent）调用模块化感知与控制工具，从而避免了端到端 VLA 模型在分布偏移下的级联失效问题。该框架的核心创新在于引入“人在回路”（Human-in-the-loop, HiTL）的自然语言修正机制，并通过执行轨迹（execution traces）将修正定位到具体的代码行或工具调用，实现了故障的隔离与局部反馈。系统通过构建持久化的技能库（Skill Library），将人类修正蒸馏为可复用的代码模式，形成一种长期的上下文学习（long-term in-context learning），显著降低了新任务中的人类干预成本。在 Franka Panda 机器人上的基准测试表明，ARCHITECT 在长视界任务（long-horizon tasks）和复杂对象操作（如可变形物体折叠）上显著优于 $\\pi_0$、$\\pi_0.5$ 等 SOTA VLA 模型及 Code as Policies 基线。实验进一步证实，人类修正能够捕捉 VLM 难以从像素中推断的物理直觉（如抓取力度、放置高度），且技能库的迁移能力使得后续任务的成功率大幅提升，证明了“少量语言修正”即可实现高效、可解释的策略适应。\n\n### § 9 最脆弱的假设\n\nARCHITECT 最脆弱的假设是：**底层模块化工具（特别是感知与抓取生成模块）的性能足以支撑高层逻辑的正确执行，且其失败模式可以通过高层语言修正进行有效补偿。** 如果这一假设不成立，即底层工具存在系统性缺陷（如深度估计严重失真导致无法定位放置点，或抓取生成器对特定几何形状完全失效），LLM 生成的任何高层逻辑修正都将无效，因为执行层无法实现预期的物理动作。论文在附录 E 中承认，抓取失败和深度估计不准确是主要失败模式，且这些源于 off-the-shelf 模块的局限性。虽然论文展示了人类修正可以缓解部分问题（如通过“guarded descent”修正放置高度），但如果底层感知完全无法区分目标物体或生成可行的抓取姿态，LLM 无法通过修改代码逻辑来创造不存在的物理能力。论文缺乏对底层工具性能边界与高层修正有效性之间耦合关系的定量分析，仅通过定性案例展示修正的有效性，未证明在底层工具性能显著下降时，HiTL 机制仍能保持系统的鲁棒性。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现并验证 **“技能库迁移是否真的能减少新任务的人类干预次数”** 这一核心 claim，而无需复现完整的机器人硬件系统。具体方案如下：使用论文提供的附录 F 中的 System Prompt 和附录 G 中的 Skill Library 示例，构建一个基于 LLM（如 Claude 或 GPT-4）的代码生成代理。选取两个结构相似但对象不同的任务（如 Task 1: 放置杯子，Task 2: 放置盒子），模拟执行环境（通过硬编码或简单的仿真器返回成功/失败信号）。首先，在不加载技能库的情况下，让 LLM 生成 Task 1 的代码，并模拟人类提供修正（如“抓取位置太高”），记录修正次数。然后，将这些修正蒸馏为技能并加入 Skill Library。接着，在加载该技能库的情况下，让 LLM 生成 Task 2 的代码，记录所需的额外修正次数。测量指标为：Task 2 在有无技能库情况下的平均修正次数差异。如果加载技能库后 Task 2 的修正次数显著降低（如论文所述的从 4.67 降至 0.83），则支持了技能库迁移有效性的 claim；反之，若修正次数无显著变化，则反驳了该 claim。此实验仅需 LLM API 调用和简单的脚本模拟，无需真实机器人或复杂仿真环境。", "research_value": "### § 11 最强反例设计\n\n要最有力地攻击 ARCHITECT 框架，核心策略是证明其所谓的“可解释性”和“模块化”在动态物理交互中是一种**幻觉（Illusion of Control）**，即高层代码逻辑的修正无法弥补底层感知-动作映射的不可靠性，且这种不可靠性会随着任务复杂度的增加呈指数级放大，导致 HiTL 机制失效。\n\n**具体反例场景设计：动态非刚性物体的连续形变任务（Continuous Deformation of Dynamic Non-rigid Objects）**\n\n1.  **场景设定**：\n    设计一个任务：“将一条正在轻微摆动的丝绸围巾折叠成特定形状并放入盒子”。与论文中静态或半静态的衣物不同，丝绸具有极高的动态敏感性，微小的气流或机器人手臂的振动都会导致物体姿态发生不可预测的连续变化。\n\n2.  **攻击逻辑**：\n    *   **底层工具失效的不可补偿性**：ARCHITECT 依赖 `detect_objects` 和 `grasp` 等 off-the-shelf 工具。在动态场景中，深度估计和关键点检测会产生高频噪声。LLM 生成的代码通常是离散的控制原语（如 `move_to`, `grasp`）。当底层感知因动态模糊而失败时，LLM 无法通过修改高层逻辑（如“先打开抽屉更多”）来补偿毫秒级的感知误差。人类修正（HiTL）通常针对的是**逻辑错误**（如顺序错误、参数范围错误），而非**感知噪声**。如果失败原因是“抓取点漂移了 5mm”，人类很难用自然语言精确描述“将抓取点向左平移 5mm 并增加 0.1 秒的等待时间”，因为人类缺乏对底层传感器噪声分布的直观认知。\n    *   **级联错误的不可隔离性**：论文声称模块化架构可以隔离失败。但在动态非刚性物体操作中，每一步的动作都会改变物体的物理状态（State Transition）。如果第一步抓取导致围巾扭曲，后续所有基于初始几何假设的代码（如 `fold_corner`）都将失效。LLM 生成的代码缺乏对物理动力学（Physics Dynamics）的显式建模，它只能根据当前的 Trace 进行“试错”。在动态场景中，Trace 的重复性极低，导致 LLM 无法从之前的失败中提取出通用的 Skill。\n    *   **HiTL 的认知过载与反馈延迟**：在快速变化的动态任务中，人类观察者需要极高的注意力来诊断失败原因。如果失败是由于复杂的物理交互（如布料缠绕），人类可能只能给出模糊的反馈（如“抓得太紧了”），而 LLM 难以将这种模糊反馈转化为精确的代码修正。相比之下，VLA 模型虽然黑盒，但可以通过端到端的梯度更新隐式地适应这种动态性（尽管成本高，但至少在单任务内有效）。ARCHITECT 在这种场景下会陷入“无限修正循环”，因为每次修正都只解决了表面症状，而未解决底层感知与动态物理之间的耦合问题。\n\n3.  **预期结果**：\n    在该反例场景中，ARCHITECT 的成功率将显著低于基线，且 HiTL 的修正次数不会随 Skill Library 的积累而减少，反而可能增加，因为动态任务的 Skill 泛化能力极差。这将证明 ARCHITECT 的“数据效率”和“可解释性”仅在静态或准静态任务中成立，而在真实世界常见的动态交互中失效。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“代码合成”到“物理语义对齐”：基于神经符号混合架构的机器人策略自适应（Neuro-Symbolic Alignment for Robot Policy Adaptation）**\n\n**（a）驱动局限与未满足需求**\nARCHITECT 的核心局限在于其**符号层（LLM 生成的代码）与物理层（机器人执行器与环境）之间的语义鸿沟**。LLM 生成的代码是离散的、逻辑性的，而物理世界是连续的、动态的。当底层工具（如抓取生成器）失败时，LLM 无法理解“为什么”失败，因为它缺乏对物理约束的显式建模。现有的 HiTL 机制依赖于人类将物理直觉转化为自然语言，再转化为代码，这一过程存在巨大的信息损失。我们需要一种机制，能够自动将物理执行中的连续误差映射为符号层面的可修正逻辑，从而实现真正的“物理感知”程序合成。\n\n**（b）借鉴相邻领域的方法**\n借鉴**神经符号人工智能（Neuro-Symbolic AI）**和**系统识别（System Identification）**领域的思想。具体来说，引入一个**物理语义对齐模块（Physical Semantic Alignment Module, PSAM）**，该模块由两部分组成：\n1.  **隐式物理模型（Implicit Physics Model）**：一个轻量级的、可微分的物理模拟器或动力学预测网络，用于预测当前代码执行后的物理状态变化。\n2.  **符号-物理映射器（Symbol-Physics Mapper）**：一个将物理误差（如位置偏差、力矩异常）自动翻译为自然语言修正建议或代码补丁的模块。\n\n**（c）第一个实验设计**\n1.  **任务选择**：选择一个对物理精度要求高且动态性强的任务，如“将不同硬度的球体（乒乓球、网球、篮球）依次放入不同大小的孔中”。\n2.  **基线对比**：对比 ARCHITECT（纯 HiTL 修正）与提出的 **Neuro-Symbolic ARCHITECT**。\n3.  **实验流程**：\n    *   在 Neuro-Symbolic ARCHITECT 中，当机器人执行 `place` 动作失败时，PSAM 模块首先分析执行轨迹中的物理误差（如球体反弹、位置偏移）。\n    *   隐式物理模型预测导致该误差的物理原因（如“速度过快”或“角度偏差”）。\n    *   符号-物理映射器自动生成具体的代码修正建议（如“降低 `move_to` 的速度参数 20%”或“调整 `grasp` 的预抓取高度”），并直接注入 LLM 的上下文，而非依赖人类提供模糊的自然语言反馈。\n    *   人类仅作为最终验证者，而非主要的修正提供者。\n4.  **评估指标**：\n    *   **修正精度**：自动生成的代码修正与人类专家修正的一致性。\n    *   **适应速度**：在新物体（如从未见过的球体）上达到稳定成功率所需的迭代次数。\n    *   **泛化能力**：在物理属性变化（如摩擦力变化）时，系统的鲁棒性。\n\n**与已有工作的区别**：\n不同于 ARCHITECT 完全依赖人类自然语言反馈，也不同于 VLA 模型的端到端黑盒学习，该研究提出了一种**半自动化的物理感知修正机制**。它不试图用 LLM 替代物理引擎，而是用 LLM 编排物理引擎的反馈，实现符号逻辑与物理现实的闭环对齐。这将解决 ARCHITECT 在动态物理交互中“可解释性幻觉”的问题，为机器人策略合成提供一种更稳健、更自动化的适应框架。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Daphne Chen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Archit Ritesh Jain\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Eric Goossen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Emma Romig\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Michael Murray\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Nick Walker\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Maya Cakmak\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"University of Washington\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Microsoft Research\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Massachusetts Institute of Technology\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"∗\",\n      \"text\": \"Correspondence to daphc@cs.washington.edu\"\n    }\n  ]\n}\n```", "summary_translation": "尽管视觉-语言-动作（VLA）模型已展现出令人印象深刻的零样本操作能力，但它们本质上仍是难以解释、适应或纠正的黑盒策略，一旦不可避免地失败便难以处理。在本工作中，我们提出了 ARCHITECT，一个将机器人策略获取视为交互式程序合成任务的框架。ARCHITECT 利用大语言模型（LLM）编码代理的推理能力，合成利用一系列感知和控制工具的模块化机器人程序。与端到端模型中因分布偏移导致不可预测的级联故障不同，我们的模块化架构允许用户在所需的抽象层级上隔离故障并定位反馈。我们引入了一种迭代过程，其中人类监督者提供自然语言修正来引导策略。这些修正通过程序执行轨迹在策略代码中得到具体化，并提炼为一个持久的技能库，这是一种长期上下文学习形式，使代理能够积累可重用、可解释的行为库。在 Franka Panda 机器人上的基准评估中，ARCHITECT 在包括关节物体操作和衣物折叠在内的复杂、长视界任务上，优于最先进的 VLA 模型和程序合成基线。我们的结果表明，合成的技能库使系统能够以递减的人类干预转移到新任务，为黑盒机器人学习提供了一种可引导且数据高效的替代方案。网站：https://robo-architect.github.io/"}]}, {"name": "Tool Use \u0026 Coding Agents", "count": 2, "papers": [{"title": "CRAFT: Learn the Schema, Execute the Plan", "arxiv_id": "2607.22642", "authors": "Aakash Kolekar, Sahika Genc, Shahriar Shariat, Bunyamin Sisman, Tibor Mezi, Barbara Poblete, Shree Vandana Kachroo, Calvin Chi, Parth Parmar, Ari Singer, Prayaas Jain, Cindy Barker, Benoit Dumoulin", "summary": "Enterprise coding agents translate natural-language analytical requests into executable code over proprietary APIs, schemas, and metric definitions. Yet the prevailing deployment pattern injecting exhaustive schema and tool documentation into each prompt increases inference overhead, complicates schema evolution, and undermines reliability in multi-turn analysis. We investigate whether stable schema knowledge and tool-use behavior can instead be acquired through post-training while preserving the consistency required for production-facing analytics. We present CRAFT, a two-stage post-training recipe for schema-grounded coding agents. First, schema-stripped PLAN supervised fine-tuning learns domain-structured plans and executable behaviors from validated trajectories without exhaustive prompt-time schema injection. Second, execution-shaped reinforcement learning aligns the policy for tool selection, code quality, plan-code consistency, and recovery from failed executions. Training trajectories are curated through a Tri-Gate filter combining execution validation, data-integrity checks, and LLM-judge reasoning audit. We evaluate CRAFT for planned rollout in advertising analytics, covering campaign performance analysis, metric drill-downs, entity-level performance analysis, and multi-turn analytical refinement. The enterprise evaluation environment incorporates beta APIs as the agent-facing tool surface and spans 25 schema-linked core entities and 30 agentic workflows. Relative to a schema-stuffed baseline, CRAFT improves composite Agent Score by +9.6 pp, consistency by +4.1 pp, and multi-turn coherence by +4.2 pp, while reducing input-token burden by approximately 9x and schema-discovery loops by up to 5x. We further report deployment tradeoffs, reward-shaping limitations, and training-infrastructure extensions required for multi-turn tool-use reinforcement learning in enterprise settings.", "category": "cs.CL", "cluster": "Tool Use \u0026 Coding Agents", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agent capability/behavior, Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-32 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文完全符合“构建、改进、训练 LLM智能体”的研究范围，具体依据如下：\n\n1.  核心对象明确为 LLM Agent：论文标题和摘要明确指出研究对象是“Enterprise coding agents”（企业级编码智能体），其核心任务是将自然语言请求转化为可执行代码并调用 API（Tool Use）。这属于典型的 Agentic AI 范畴。\n2.  涉及智能体的训练与改进机制：论文提出了 CRAFT，这是一种针对智能体的两阶段后训练（post-training）方法。\n       第一阶段通过监督微调（SFT）学习领域结构化的计划和可执行行为，旨在解决智能体在长上下文中的记忆和规划问题（Planning/Memory）。\n       第二阶段通过执行塑造的强化学习（RL）对齐策略，优化工具选择、代码质量及从失败中恢复的能力（Self-Correction/Recovery）。\n       这直接对应筛选标准中关于“Agent training/distillation/RL”以及“改进智能体能力”的要求。\n3.  解决智能体核心痛点：论文针对的是智能体在工具使用（Tool Use）和长程决策（Multi-turn analysis）中的效率与可靠性问题，提出了通过训练而非单纯依赖 Prompt 注入（Schema-stripped）来内化知识的方法。这属于智能体架构和方法论的创新，而非简单的应用层部署。\n4.  排除项检查：\n       虽然应用场景是广告分析（特定领域），但其贡献在于通用的智能体训练框架（CRAFT），而非仅解决广告业务逻辑，符合“领域是场景，机制才是贡献”的保留原则。\n       不涉及安全、对齐、多模态视觉或图神经网络等排除项。\n       虽然涉及企业部署，但核心贡献是智能体的训练算法和架构改进，而非基础设施优化。\n\n综上，该论文研究如何通过训练方法改进 LLM 智能体的工具使用、规划和自我修正能力，高度契合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决企业级编码智能体（Enterprise Coding Agents）在私有 API、Schema 和指标定义上执行自然语言分析请求时，因过度依赖“上下文填充”（Context Stuffing）而导致的推理开销大、可靠性低及多轮交互一致性差的问题。传统的部署模式通常将详尽的数据定义语言（DDL）、API 文档和工具说明注入到每个提示词中，这种模式在广告分析等复杂场景中面临三大核心挑战：首先，长 Schema 提示词与用户对话、工具轨迹及中间结果竞争工作记忆，导致模型注意力分散；其次，每一轮交互都需支付巨大的 Token 开销，显著增加推理成本；最后，物理 Schema 的微小变更（如列重命名或表迁移）需要更新提示词管道并进行回归测试，维护成本极高。\n\n解决这一问题对于企业级分析系统的规模化落地至关重要。通过提出 **CRAFT** 这一两阶段后训练（Post-training）方案，研究将稳定的 Schema 知识和工具使用行为从瞬态的提示上下文转移至模型参数中。这不仅将输入 Token 负担降低了约 9 倍，还将 Schema 发现循环（Schema-discovery loops）减少了高达 5 倍，从而显著提升了推理效率。更重要的是，CRAFT 通过执行塑造的强化学习（Execution-shaped RL）优化了工具选择、代码质量及计划-代码的一致性，使得智能体在多轮分析中能够保持上下文连贯性并有效从执行失败中恢复。这种从“提示工程”向“模型内化知识”的范式转变，为在保密性要求高、Schema 频繁演进的私有企业环境中部署可靠、高效的分析智能体提供了可行的技术路径。\n\n### § 2 前人工作与不足\n\n尽管自然语言接口到结构化数据的研究已有进展，但现有方法在处理私有、大规模且动态变化的企业级 Schema 时存在明显不足。早期的结构化数据智能体如 **TAPAS**、**Spider**、**RAT-SQL** 和 **CoSQL** 主要关注表格解析和语义解析，而近期的 **DIN-SQL**、**BIRD** 和 **Spider 2.0** 虽然引入了更复杂的数据库接地设置，但它们大多基于公开数据集或静态 Schema，未能充分解决私有 API 环境中因 Schema 庞大且敏感而导致的提示词注入瓶颈。\n\n在工具增强语言智能体方面，**Toolformer**、**Gorilla**、**ReAct**、**Reflexion** 和 **CodeAct** 等研究探索了 API 调用、推理与代码生成的交织，**ToolLLM**、**APIBank** 和 **AgentBench** 则扩展了交互式工具使用的评测。然而，这些方法通常假设 Schema 或工具文档可以通过检索增强生成（RAG）或完整的上下文注入来提供。例如，**RAG** 方法虽然能高效地表征稀疏查找所需的少量 Schema，但在广告分析等需要多跳连接（Multi-hop joins）、指标兼容性检查和后续推理的复杂任务中，仅靠检索难以覆盖所需的上下文广度，且频繁的检索增加了延迟和不确定性。\n\n此外，现有的后训练方法如 **DeepSeek-R1** 或基于 **GRPO** 的优化，虽然利用执行反馈提升了推理能力，但往往缺乏针对企业级多轮工具使用场景的专门设计。例如，单纯的监督微调（SFT）如 **PLAN SFT** 虽然能赋予模型领域熟悉度，但无法完全对齐智能体的工具使用策略和歧义消解能力，导致在多轮交互中出现一致性下降。现有的研究未能充分解决如何在移除详尽 Schema 上下文的同时，通过强化学习对齐智能体的交互决策策略（如工具选择、歧义消解和失败恢复），以在私有 Beta API 环境中实现稳定、一致且高效的多轮分析行为。CRAFT 通过结合 Schema 剥离的 PLAN SFT 和执行塑造的 RL，填补了这一在私有企业环境中平衡效率、一致性和可靠性的研究空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在构建企业级代码生成 Agent 时，研究者首先面临的是 **Context Stuffing**（上下文填充）带来的严峻瓶颈。传统的做法是将庞大的 **DDL**（数据定义语言）、API 文档和工具说明全部注入到每个 Prompt 中，以确保模型知晓 Schema。然而，随着 Schema 的演进和查询复杂度的增加，这种模式导致了极高的 **Token Overhead**，不仅增加了推理成本，还挤占了模型用于处理用户意图和中间结果的 **Working Memory**，导致在多轮对话中容易出现注意力分散或逻辑断裂。\n\n其次，研究者观察到，虽然 **Retrieval-Augmented Generation (RAG)** 可以按需检索部分 Schema，但在广告分析等需要多跳连接（Multi-hop Joins）和复杂指标计算的场景中，静态检索往往无法覆盖动态的推理路径，且频繁的 **Schema Discovery Loops**（Schema 发现循环）严重拖慢了交互体验。此外，单纯的 **Supervised Fine-Tuning (SFT)** 虽然能让模型模仿代码结构，但缺乏对执行结果的反馈，导致模型在面对模糊 Scope 或工具选择歧义时，无法形成稳定的策略，往往产生“能运行但业务逻辑错误”或“多轮对话中丢失约束”的失败模式。\n\n因此，研究者意识到，必须将稳定的 Schema 知识和工具使用行为从瞬时的 Prompt 上下文转移到模型的参数中（即 **Post-training**）。但直接进行 **Reinforcement Learning (RL)** 风险极高，因为通用模型在初期会产生大量语法错误或幻觉工具调用，导致奖励信号稀疏且噪声大。于是，一个两阶段的思路浮现：首先通过 **Schema-Stripped PLAN SFT** 让模型内化领域结构和代码范式，移除对显式 DDL 的依赖；随后，利用 **Execution-Shaped RL**（如 GRPO），基于真实的执行反馈（而非仅基于文本相似度）来对齐工具选择、代码质量和多轮一致性。这种从“外部注入”转向“内部习得”，并从“模仿学习”转向“执行反馈优化”的路径，构成了 CRAFT 的核心逻辑。\n\n### § 4 核心 Intuition\n\nCRAFT 的核心直觉在于：对于企业级分析任务，稳定的 Schema 知识不应作为每次推理时的外部负担（Context），而应通过 **Post-training** 内化为模型的参数记忆，从而释放 **Working Memory** 以专注于复杂的业务逻辑推理。单纯的模仿学习（SFT）只能让模型“学会写代码”，但无法保证“写对代码”和“在多轮对话中保持一致”，因此必须引入基于真实执行结果的 **Reinforcement Learning**，通过 **Execution Feedback** 直接优化模型的工具选择策略和错误恢复能力，从而在减少 **Token Overhead** 的同时，显著提升多轮交互的 **Consistency** 和 **Coherence**。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nCRAFT 的核心方法是一种两阶段的后训练（Post-training）流程，旨在将稳定的 Schema 知识和工具使用行为从提示词上下文（Prompt Context）转移到模型参数中，从而解决企业级编码代理中常见的“上下文塞入”（Context Stuffing）问题。其完整 Pipeline 如下：\n\n1.  **数据生成与过滤（Trajectory Distillation \u0026 Tri-Gate Filter）**：\n    *   **输入**：基于广告分析领域的复杂性矩阵（涵盖拓扑广度如实体跳转数，和执行深度如聚合逻辑），由 Teacher Models 生成候选轨迹。\n    *   **处理**：轨迹包含推理草稿、业务级 `\u003CPLAN\u003E` 块（无原始 DDL）和可执行 `\u003CCODE\u003E` 块。随后通过 **Tri-Gate Filter** 进行严格筛选：Gate 1 剔除执行失败或超时的代码；Gate 2 剔除空输出；Gate 3 使用 LLM-judge 检测计划与代码之间的语义不匹配。\n    *   **输出**：从 100K+ 生成轨迹中筛选出 15.1K 条高质量、经过验证的轨迹用于训练。\n\n2.  **阶段一：Schema 剥离的 PLAN SFT（Schema-stripped PLAN SFT）**：\n    *   **输入**：上述筛选后的轨迹，但**移除**了输入中庞大的 DDL/Schema 上下文（约 50K+ tokens），仅保留用户查询、轻量级工具指令和 `\u003CPLAN\u003E`/`\u003CCODE\u003E` 块。\n    *   **处理**：在 120B MoE 基座模型上进行监督微调（SFT）。关键技巧是**掩码（Mask）**工具输出（Tool Outputs）的损失计算，因为工具返回包含不可预测的 ID、时间戳和运行时数据。模型学习的是从自然语言意图到结构化计划和代码的映射，而非记忆 Schema。\n    *   **输出**：具备领域熟悉度、能生成结构化计划和代码的模型，但此时工具选择策略和歧义解决能力尚不稳定。\n\n3.  **阶段二：执行塑造的强化学习（Execution-shaped GRPO）**：\n    *   **输入**：SFT 后的模型，针对每个 Prompt 采样 $G=8$ 条轨迹。\n    *   **处理**：使用 **Group Relative Policy Optimization (GRPO)** 进行优化。奖励函数由四部分组成：$R_{outcome}$（执行正确性）、$R_{process}$（工具调用结构和代码质量）、$R_{consistency}$（计划与代码的一致性）、$R_{judge}$（LLM 评估的业务对齐度）。\n    *   **输出**：最终模型 CRAFT。它不仅学会了代码生成，还通过执行反馈对齐了工具选择策略、多轮对话中的上下文保持能力以及从失败中恢复的能力。\n\n**真实案例演示：广告活动性能分析**\n\n*   **用户输入**：“分析过去一周‘夏季促销’广告组的点击率（CTR）下降原因，并与上月同期对比。”\n*   **传统 Baseline 处理**：Prompt 中塞入整个广告数据库的 DDL（数万 token），模型在巨大的上下文窗口中艰难查找 `AdGroups` 表和 `Metrics` 表的关系，容易因注意力分散而选错字段或超时。\n*   **CRAFT 处理**：\n    1.  **PLAN SFT 阶段**：模型内部已内化了“广告组”与“指标”的关联模式。它生成一个 `\u003CPLAN\u003E`：“1. 获取‘夏季促销’广告组 ID；2. 查询过去一周和上月同期的 CTR 数据；3. 计算差异并分析显著下降的子维度。”\n    2.  **代码生成**：生成调用 Beta API 的代码，无需在 Prompt 中查看 API 文档，因为模型已通过 SFT 学习了 API 签名模式。\n    3.  **GRPO 优化**：如果生成的代码因参数错误导致 API 调用失败，$R_{outcome}$ 为负，模型在 RL 阶段学会修正参数结构；如果计划说“对比上月”但代码只查了“上周”，$R_{consistency}$ 惩罚模型，使其保持逻辑一致。\n*   **最终输出**：一段可执行的代码，调用正确的 API 获取数据，并返回分析结果：“CTR 下降主要源于‘移动端’渠道的转化效率降低，建议检查移动端落地页加载速度。”\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n本文没有提出全新的基础数学理论，而是应用并组合了现有的 SFT 和 RL 公式，重点在于**损失函数的设计**和**奖励函数的构建**。\n\n**1. PLAN SFT 的损失函数设计**\n\n公式：\n$$ \\mathcal{L}_{SFT} = -\\sum_{t=1}^{T} m_t \\log P(x_t | x_{\u003Ct}, \\theta) $$\n\n*   **Intuition**：这是标准的交叉熵损失，但引入了掩码变量 $m_t$。\n*   **关键点**：$m_t=1$ 仅当 $x_t$ 是助手生成的计划或代码 token；$m_t=0$ 当 $x_t$ 是用户输入、系统消息或**工具输出**。\n*   **为什么这样做？** 工具输出（如 API 返回的 JSON 数据）包含大量噪声（随机 ID、时间戳、具体数值）。如果模型试图预测这些不可预测的输出，会浪费容量并导致过拟合。通过 Mask 掉这些部分，强迫模型只学习“如何根据输入生成正确的代码逻辑”，而不是“记忆特定的数据返回格式”。\n\n**2. GRPO 的优化目标**\n\n公式：\n$$ \\mathcal{L}_{GRPO} = -\\mathbb{E} \\left[ \\frac{1}{G} \\sum_{i=1}^{G} \\left( \\min \\left( r_i(\\theta) \\hat{A}_i, \\text{clip}(r_i(\\theta), 1-\\epsilon, 1+\\epsilon) \\hat{A}_i \\right) - \\beta D_{KL}(\\pi_\\theta || \\pi_{ref}) \\right) \\right] $$\n\n*   **Intuition**：这是 PPO 算法的变体，用于在不使用 Critic 模型的情况下进行策略优化。\n*   **$\\hat{A}_i$ (Advantage)**：优势估计，衡量某条轨迹相对于组内其他轨迹的好坏。\n*   **$r_i(\\theta)$**：概率比率，衡量新策略与旧策略的差异，防止更新步长过大。\n*   **$D_{KL}$**：KL 散度惩罚，防止模型偏离参考策略太远，保持稳定性。\n*   **核心创新不在公式本身，而在奖励信号 $\\hat{A}_i$ 的来源**：它由 $R_{outcome}$（执行结果）、$R_{process}$（过程质量）、$R_{consistency}$（一致性）和 $R_{judge}$（业务对齐）加权组成。这意味着模型优化的不是“下一个 token 的概率”，而是“整个执行流程的业务价值”。\n\n### § 7 实验设计与结论\n\n**1. 问题：移除 Schema 上下文是否会导致性能下降？**\n*   **实验设计**：对比 CRAFT（无 Schema 注入）与 Schema-stuffed Baseline（包含完整 DDL/API 文档）。在包含 25 个核心实体和 30 个工作流的广告分析任务上进行评估。\n*   **结论**：CRAFT 不仅没有下降，反而在综合 Agent Score 上提升了 +9.6 pp，一致性提升 +4.1 pp。证明通过 Post-training 内化 Schema 知识是可行的，且优于上下文注入。\n\n**2. 问题：SFT 和 RL 各自贡献了什么？**\n*   **实验设计**：进行消融实验（Ablation Study），分别测试仅使用 PLAN SFT（Stage I）和使用 PLAN SFT + RL（Stage II）的效果。\n*   **结论**：\n    *   **SFT** 主要贡献了**效率**：输入 Token 负担降低约 9 倍（从 1.0x 降至 0.11x），因为它不再需要读取长 Schema。\n    *   **RL** 主要贡献了**交互质量**：Schema 发现循环（Schema-discovery loops）从 0.62x 进一步降至 0.20x，多轮对话的连贯性（Coherence）和保留率（Retention）显著提升。SFT 仅提供了领域熟悉度，而 RL 对齐了工具选择和歧义解决策略。\n\n**3. 问题：模型是否发生了灾难性遗忘或能力退化？**\n*   **实验设计**：在通用基准测试（IFEval, GSM8K, GPQA）上评估 CRAFT 与基座模型的差异。\n*   **结论**：Delta 接近零（如 GSM8K +0.9 pp, GPQA -0.3 pp），表明领域适应没有损害通用推理和指令遵循能力，满足了企业部署的安全护栏要求。\n\n**4. 问题：该方法在真实企业环境中的可靠性如何？**\n*   **实验设计**：在包含 Beta API 的企业评估环境中，模拟真实用户的多轮交互、约束添加和错误恢复场景。\n*   **结论**：CRAFT 在多轮交互中表现出更强的上下文保持能力（Retention +7.8 pp）和任务推进能力（Progression +9.4 pp），证明了其在复杂、长 horizon 分析任务中的实用性。", "additional_insights": "### § 8 Take-aways\n\nCRAFT 提出了一种针对企业级编码 Agent 的两阶段后训练（Post-training）范式，旨在解决传统“Context Stuffing”（将完整 Schema 注入 Prompt）带来的推理开销大、上下文窗口竞争及 Schema 演进维护困难的问题。第一阶段采用 Schema-stripped PLAN SFT，通过移除输入中的 DDL 并 Mask 工具输出，使模型内化领域结构化的计划（Plan）与可执行代码行为，而非依赖即时检索。第二阶段引入 Execution-shaped GRPO（Group Relative Policy Optimization），利用执行反馈、工具调用结构、代码质量及计划-代码一致性作为奖励信号，对齐 Agent 的工具选择策略与多轮交互中的歧义消解能力。该方法通过 Tri-Gate 过滤器（执行验证、数据完整性检查、LLM-judge 推理审计）从 100K+ 探索性生成中筛选出 15.1K 高质量轨迹，确保训练数据的可执行性与语义一致性。在广告分析场景的预部署评估中，CRAFT 相比 Schema-stuffed 基线，Composite Agent Score 提升 9.6 pp，一致性提升 4.1 pp，多轮连贯性提升 4.2 pp，同时将输入 Token 负担降低约 9 倍，Schema 发现循环减少至 0.20x。实验表明，PLAN SFT 主要贡献于输入 Token 的减少，而 Execution-shaped RL 才是提升工具选择稳定性、多轮保留（Retention）及任务推进（Progression）的关键，证明了仅靠模仿学习不足以形成稳健的交互策略。\n\n### § 9 最脆弱的假设\n\nCRAFT 最核心的假设是：**目标领域的 Schema 和工具接口具有足够的“稳定性”（Stability），使得通过 Post-training 内化的知识在部署后不会迅速过时，且无需频繁重新训练即可适应生产环境的变化。**\n\n如果这一假设不成立，例如企业 API 频繁重构、字段重命名或新增大量实体，CRAFT 的优势将直接转化为劣势。因为模型已经“遗忘”了通过 Prompt 动态获取最新 Schema 的能力，转而依赖训练时内化的静态知识，这将导致严重的幻觉或调用错误，且修复成本远高于更新 Prompt 模板。论文在 Section 9 (Limitations) 中明确承认了这一点，指出对于“Schema-novel entities”或未被训练覆盖的新工作流，系统可能需要微调刷新或检索增强。然而，论文提供的证据主要基于“Planned rollout”前的静态评估环境，缺乏对 Schema 动态演化（Schema Drift）的长期压力测试数据。虽然论文声称通过 Beta APIs 和受控数据模拟了生产环境，但并未展示在 Schema 发生实质性变更（如表结构迁移）后，CRAFT 的退化曲线与基线方法的对比。因此，该方法的实际价值高度依赖于企业数据治理的规范性与 API 版本的冻结频率，这在快速迭代的互联网广告业务中是一个高风险假设。\n\n### § 10 最小复现实验\n\n在 1 周内，无法复现完整的 120B MoE 训练流程，但可以设计一个**“Schema 内化有效性”的最小验证实验**，以验证 CRAFT 的核心 Claim：即模型能否在无 DDL 输入的情况下，仅凭内化知识正确生成工具调用。\n\n**实验设计：**\n1.  **数据准备**：选取一个公开的结构化数据基准（如 Spider 或 Bird 的子集），或构建一个简化的模拟 API Schema（包含 5-10 个表/实体及关联关系）。\n2.  **基线构建**：\n    *   **Baseline (Context Stuffing)**：在 Prompt 中注入完整的 DDL/Schema 描述，使用一个中等规模 LLM（如 Llama-3-8B 或 Qwen-2.5-7B）进行 Few-shot 推理，记录其工具调用准确率。\n    *   **CRAFT-Lite (SFT Only)**：使用相同的 LLM，构建一个小型 SFT 数据集（约 500-1000 条轨迹），其中输入不包含 DDL，仅包含自然语言问题和对应的正确工具调用代码/JSON。对模型进行轻量级 SFT（LoRA）。\n3.  **测量指标**：\n    *   **Zero-shot Schema Recall**：在测试集上，移除所有 Schema 上下文，测量 CRAFT-Lite 模型生成正确工具调用（Tool Call Accuracy）的比例。\n    *   **Token Efficiency**：对比 Baseline 和 CRAFT-Lite 的输入 Token 数量。\n4.  **判定标准**：\n    *   **支持 Claim**：如果 CRAFT-Lite 在输入 Token 减少 80%+ 的情况下，工具调用准确率与 Baseline 持平或下降不超过 5%，则证明“Schema 内化”在静态环境下是可行的。\n    *   **反驳 Claim**：如果 CRAFT-Lite 的准确率显著下降（如 \u003E15%），或仅在训练分布内有效而在分布外（Out-of-Distribution）实体上完全失效，则说明内化策略对数据覆盖度极度敏感，难以替代动态 Schema 注入。\n\n此实验避开了复杂的 RL 阶段，直接验证 CRAFT 第一阶段（PLAN SFT）的核心前提：模型是否真的能“Learn the Schema”而不依赖“See the Schema”。", "research_value": "### § 11 最强反例设计\n\n要最有力地攻击 CRAFT，不应质疑其在静态环境下的性能，而应攻击其核心假设——即“Schema 内化”在动态企业环境中的**可维护性成本**与**泛化边界**。最强反例设计为：**“Schema Drift 下的灾难性遗忘与幻觉放大实验”**。\n\n具体而言，构建一个模拟真实企业 API 演进的场景，其中 20% 的字段发生重命名（Renaming），10% 的表结构发生迁移（Migration），以及 5% 的新实体被引入（Novel Entities）。在此设定下，对比 CRAFT 与传统的 RAG-based Context Stuffing 基线。攻击点在于：CRAFT 通过 SFT 将 Schema 知识“硬编码”进参数，这意味着当 Schema 发生微小变更时，模型不会像 RAG 那样自动获取最新文档，而是会基于训练时的旧知识产生**高置信度的错误调用（Confident Hallucination）**。例如，模型可能继续调用已废弃的 API 端点，或错误地映射重命名字段，且由于缺乏上下文中的最新 DDL 作为“纠错锚点”，这种错误在多轮交互中会被放大。\n\n理论论证上，指出 CRAFT 的 **Tri-Gate Filter** 在训练阶段虽然剔除了执行失败的轨迹，但它无法覆盖所有可能的 Schema 变体。一旦生产环境出现训练分布外（Out-of-Distribution, OOD）的 Schema 变更，CRAFT 的 **Execution-shaped RL** 奖励函数（特别是 $R_{outcome}$）将因执行失败而给出负反馈，但此时模型已无法通过“查看文档”来即时修正，必须依赖昂贵的重新微调（Re-SFT）或在线学习。相比之下，Context Stuffing 虽然 Token 开销大，但具有**零延迟的适应性（Zero-latency Adaptability）**。因此，反例的核心结论是：CRAFT 将“推理时的计算成本”转移为了“训练时的维护成本”，在 Schema 高频迭代（如互联网广告业务）的场景中，其总体拥有成本（TCO）可能远高于基线，且可靠性随 Schema 变更频率呈指数级下降。\n\n### § 12 Follow-up Research Idea\n\n基于 CRAFT 在 Schema 动态适应性上的局限，提出一个全新的研究方向：**“Neuro-Symbolic Schema Grounding with Dynamic Parameter Retrieval”（基于动态参数检索的神经符号 Schema 接地）**。\n\n**(a) 驱动局限与未满足需求：**\nCRAFT 的局限在于将 Schema 知识完全静态化地嵌入模型参数，导致“更新即重训”的高昂成本。现有的 RAG 方法虽然动态，但缺乏对复杂 Schema 关系的深层理解，且 Token 开销巨大。未满足的需求是：如何在保持低 Token 开销的同时，实现 Schema 知识的**即时更新（Instant Update）**和**细粒度检索（Fine-grained Retrieval）**，即模型既能“记住”通用的 API 调用模式，又能“按需加载”最新的 Schema 细节。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴 **Memory-Augmented Neural Networks (MANNs)** 和 **Vector Database Indexing** 的思想，结合 **LoRA (Low-Rank Adaptation)** 的动态切换机制。具体而言，将 Schema 知识分解为“静态模式”（如 API 签名结构、通用业务逻辑）和“动态实例”（如具体的表名、字段名、最新指标定义）。静态模式通过 SFT 内化到基座模型，而动态实例则编码为轻量级的 **Schema Embeddings** 存储在外部向量数据库中。\n\n**(c) 第一个实验设计：**\n构建一个 **Hybrid-Context Agent** 框架。在推理时，模型首先根据用户查询检索相关的 Schema Embeddings，这些 Embeddings 不是作为文本注入 Prompt，而是通过一个轻量级的 **Cross-Attention Layer** 或 **Dynamic LoRA Adapter** 注入到模型的隐藏状态中。\n*   **实验设置**：使用与 CRAFT 相同的广告分析数据集，但引入一个“Schema 变更模拟器”，在测试过程中随机改变 10% 的字段名。\n*   **对比基线**：CRAFT（静态内化）、RAG-Baseline（全文本注入）、以及提出的 Hybrid-Context Agent。\n*   **评估指标**：除了传统的准确率，重点评估 **Adaptation Latency**（从 Schema 变更到模型正确调用所需的时间/步骤）和 **Parameter Efficiency**（存储动态 Schema 所需的额外参数/内存开销）。\n*   **预期结果**：Hybrid-Context Agent 应在保持接近 CRAFT 的低 Token 开销的同时，展现出接近 RAG 的即时适应能力，且在 Schema 变更场景下的准确率显著高于 CRAFT，从而证明“动态参数检索”是解决企业级 Schema 演进问题的更优范式。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Aakash Kolekar\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Bunyamin Sisman\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Shree Vandana Kachroo\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Ari Singer\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Sahika Genc\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Tibor Mezi\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Calvin Chi\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Prayaas Jain\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Shahriar Shariat\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Barbara Poblete\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Parth Parmar\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Cindy Barker\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Benoit Dumoulin\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Amazon Advertising Foundations\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Amazon Web Services Agentic AI\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Both authors contributed equally to this research.\"\n    }\n  ]\n}\n```", "summary_translation": "企业级编码智能体将自然语言分析请求转化为基于专有 API、模式（schema）和指标定义的可执行代码。然而，当前主流的部署模式——在每次提示中注入详尽的模式和工具文档——增加了推理开销，使模式演进复杂化，并削弱了多轮分析的可靠性。我们研究了是否可以通过后训练来获取稳定的模式知识和工具使用行为，同时保持面向生产环境分析所需的一致性。我们提出了 CRAFT，一种用于模式接地编码智能体的两阶段后训练方案。首先，去除模式的 PLAN 监督微调从经过验证的轨迹中学习领域结构化的计划和可执行行为，而无需在提示时注入详尽的模式。其次，执行塑造的强化学习对齐策略，以优化工具选择、代码质量、计划-代码一致性以及从失败执行中恢复的能力。训练轨迹通过 Tri-Gate 过滤器进行筛选，该过滤器结合了执行验证、数据完整性检查和 LLM 裁判推理审计。我们在广告分析的计划部署场景中评估了 CRAFT，涵盖活动性能分析、指标下钻、实体级性能分析以及多轮分析细化。企业评估环境将 beta API 作为面向智能体的工具接口，涵盖 25 个与模式关联的核心实体和 30 个智能体工作流。与填充模式的基线相比，CRAFT 将综合 Agent Score 提高了 9.6 个百分点，一致性提高了 4.1 个百分点，多轮连贯性提高了 4.2 个百分点，同时将输入 token 负担减少了约 9 倍，模式发现循环减少了多达 5 倍。我们还报告了部署权衡、奖励塑造的局限性，以及在企业环境中进行多轮工具使用强化学习所需的训练基础设施扩展。"}, {"title": "E-Bench: Benchmarking Multi-Step Tool-Use Agents in Real-World Product Scenarios", "arxiv_id": "2607.23722", "authors": "Weihuang Zheng, Tianyuan Zou, Eileen Ye, Alphet Liu, Youyong Kong, Ya-Qin Zhang, Duran Zheng, Maxm Pan", "summary": "Large Language Models (LLMs) are increasingly deployed as agents that interact with stateful environments over multiple steps: gathering hidden information, composing tool calls, and committing state changes. We refer to this capability as multi-step tool use. Existing benchmarks have advanced tool-use agent evaluation, but often focus on isolated API calls, short trajectories, or settings that are difficult to scale or control. We introduce E-Bench, a fully synthetic benchmark with 323 state-changing tasks across three product domains: Honor of Kings, QQ Music, and Tencent Meeting. E-Bench decouples environment synthesis from task synthesis: graph-guided database filling builds reusable, orphan-free product environments, while generator-solver asymmetry creates tasks with both an information gap and a tool gap, requiring agents to discover hidden data and compose multiple tool calls before changing state. Outcomes are graded deterministically by database-state diffs. Since both environments and tasks are synthetic, E-Bench is controllable at the environment level and scalable at the task level. Benchmarking 11 cutting-edge LLMs shows that multi-step tool use remains challenging: Pass^3 stays below 60% for the strongest models, and even with code execution in the E-Bench-Code extension, reliability (Pass^3) remains below 70%.", "category": "cs.AI", "cluster": "Tool Use \u0026 Coding Agents", "tags": ["cs.AI"], "filter_reason": "该论文完全符合筛选标准中的“保留”条件。\n\n1. 核心对象匹配：论文的研究对象明确为“Multi-Step Tool-Use Agents”（多步工具使用智能体），这直接对应研究焦点中的“单智能体 (Agentic)”方向下的“工具使用 (Tool Use)”和“规划 (Planning)”能力。\n2. 符合评估基准保留规则：根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents ... 即使它主要是行为分析、评估基准 ... 只要结论直接帮助理解或改进智能体能力，也应保留”。E-Bench 是一个专门针对 LLM 智能体在真实产品场景中多步工具使用能力的评估基准，旨在揭示当前智能体在长程决策、状态管理和工具组合方面的局限性，这有助于理解智能体的失败机制和改进方向。\n3. 非排除项：虽然论文涉及“Graph-guided database filling”，但其核心贡献是构建用于评估智能体的合成环境（Benchmark），而非研究图神经网络（GNN）或知识图谱推理本身，因此不属于“图相关技术”的排除范围。同时，它不涉及多智能体拓扑或通信协议，也不属于纯基础设施优化。\n\n综上，该论文是关于 LLM 智能体核心能力（工具使用）的前沿评估研究，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：如何系统性地评估大型语言模型（LLMs）作为智能体（Agents）在真实世界产品场景中执行**multi-step tool use**（多步工具使用）的能力。具体而言，这要求智能体在具有状态（stateful）的环境中，通过多轮交互获取隐藏信息、组合工具调用（tool calls），并最终提交对后端数据库的状态变更（state changes）。\n\n这一问题的重要性在于，LLM 的应用范式正从单纯的“回答问题”转向“执行行动”。在操作系统、数据库查询及业务流程编排等高价值场景中，智能体必须具备在部分可观测性（partial observability）下，通过工具主动探索环境、推理跨步依赖（cross-step dependencies）并精确修改状态的能力。然而，现有的评估体系往往局限于孤立的 API 调用或短轨迹任务，无法反映真实场景中复杂的长程依赖和状态一致性要求。\n\n解决这一问题的价值体现在三个方面：首先，它揭示了当前前沿模型在复杂工具使用上的真实瓶颈，研究表明即使是最强的模型，其可靠性指标（Pass[3]）仍低于 60%，表明该问题远未解决；其次，通过引入**E-Bench**这一全合成基准，研究证明了**code execution**（代码执行）能显著提升性能并降低交互成本，为优化智能体架构提供了实证依据；最后，该基准通过解耦环境合成与任务合成，提供了一种可控、可扩展且具备确定性评估（deterministic evaluation）的评测框架，避免了真实系统评测中常见的高昂标注成本、数据隐私风险及环境不稳定性，为训练更可靠的工具使用智能体提供了高质量的数据来源和评估标准。\n\n### § 2 前人工作与不足\n\n在 E-Bench 之前，已有大量研究致力于工具使用智能体的评估，但主要存在两类局限，导致无法全面衡量 multi-step tool use 能力。\n\n第一类是早期的工具使用基准，如 **Gorilla**、**ToolLLM** 和 **Berkeley Function Calling Leaderboard (BFCL)**。这些工作主要关注模型能否选择正确的工具并生成格式规范的调用（API grounding and call-structure correctness）。它们的不足在于将工具使用简化为单次或短序列的调用生成，缺乏对持久化环境（persistent environment）的闭环交互评估。在这些基准中，智能体无需根据观察结果进行多步推理或处理状态变更，因此无法测试模型在信息缺失（information gap）和工具限制（tool gap）下的主动探索与状态管理能力。\n\n第二类是基于真实或模拟状态环境的基准，如 **MCP-Atlas**、**MCP-Universe**、**AppWorld**、**VitaBench** 和 **τ-bench**。虽然这些工作提供了更丰富的交互环境，但存在显著的工程与评估缺陷：\n1.  **可控性与可扩展性差**：基于真实 MCP 服务器或 live services 的基准（如 MCP-Atlas, LiveMCPBench）难以重置、扩展，且受限于数据隐私和服务稳定性，无法进行大规模重复的状态变更评估。\n2.  **环境与任务耦合**：许多受控模拟器（如 AppWorld, VitaBench）将环境与特定任务绑定，导致环境缺乏通用性和复用性，且构建成本高昂，需要大量人工标注或工程努力来创建 ground truth 和自定义检查器。\n3.  **评估方式的主观性与路径依赖**：部分自动化基准（如 MCPEval）通过比对智能体轨迹与验证器生成的轨迹来评估，这倾向于奖励特定的解决方案路径而非最终结果的正确性，且可能引入 LLM judge 的主观偏差。\n\nE-Bench 指出，上述工作的根本不足在于未能解耦**environment synthesis**（环境合成）与**task synthesis**（任务合成）。现有方法要么依赖真实系统导致不可控，要么依赖人工构建导致不可扩展。E-Bench 通过**graph-guided database filling**构建无孤立记录（orphan-free）的可复用合成环境，并利用**generator-solver asymmetry**（生成器-求解器不对称性）自动创建具有信息差和工具差的任务，从而填补了缺乏一个既具备真实产品状态复杂性，又具备确定性评估和大规模可扩展性的多步工具使用基准的空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在评估 Large Language Models (LLMs) 作为 Agent 的能力时，现有的 Benchmark 存在明显的局限性。早期的工具使用基准（如 Gorilla, ToolLLM）主要关注单步的 API 调用正确性或函数生成的格式，这无法衡量 Agent 在复杂环境中的长期规划与状态管理能力。随后出现的基于真实环境或模拟器的基准（如 WebArena, SWE-bench, AppWorld）虽然引入了状态交互，但面临严重的可扩展性、可复现性和数据隐私问题，且往往难以进行细粒度的自动化评估，通常依赖 LLM Judge 进行主观打分，导致评估结果不稳定且容易受到模型自身偏见的影响。\n\n此外，现有的合成基准往往将环境与任务耦合，即每个任务对应一个特定的、孤立的状态快照，这导致 Agent 无法像在真实产品中那样探索全局上下文，也无法测试其在部分可观测性（Partial Observability）下的信息获取能力。研究者意识到，要真正评估“多步工具使用”（Multi-step Tool Use），必须构建一个既具备真实产品复杂性（多表关联、状态变更），又完全可控、可自动化评估的合成环境。\n\n因此，作者提出将“环境合成”与“任务合成”解耦。首先，通过图引导的数据库填充（Graph-guided database filling）构建一个完整、无孤立记录（Orphan-free）且引用完整性（Referential Integrity）得到保证的全局数据库环境，模拟真实产品的后端状态。其次，利用生成器-求解器不对称性（Generator-Solver Asymmetry），让拥有全局视野的生成器创建任务并记录确定的数据库状态差异（Database-state diffs）作为 Ground Truth，而求解器只能通过受限的工具接口进行交互。这种设计不仅解决了评估的确定性问题（无需 LLM Judge），还通过人为制造信息差（Information Gap）和工具差（Tool Gap），强制 Agent 执行多步推理、并行工具调用和状态变更，从而更真实地反映其在现实世界产品场景中的能力。\n\n### § 4 核心 Intuition\n\n现有基准要么过于简化（仅测试单步调用），要么过于复杂且不可控（依赖真实环境或主观评估），无法有效衡量 Agent 在状态化环境中的多步推理与执行能力。本方法的核心直觉是通过构建一个完全合成但结构完整的全局数据库环境，并利用生成器与求解器之间的信息不对称，强制 Agent 必须通过多步工具交互来发现隐藏信息并执行精确的状态变更。这种设计将评估标准从“生成正确的工具调用”转变为“达成确定的数据库状态差异”，从而实现了无需 LLM Judge 的自动化、确定性评估，同时通过解耦环境与任务，实现了基准的可扩展性与可控性。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n`E-Bench` 的核心方法在于构建一个**全合成（fully synthetic）**的基准测试环境，通过解耦**环境合成（environment synthesis）**与**任务合成（task synthesis）**，实现对多步工具使用（multi-step tool use）能力的精确评估。其完整 Pipeline 如下：\n\n1.  **环境合成（Environment Synthesis）：构建无孤立的数据库世界**\n    *   **图引导数据库填充（Graph-Guided Database Filling）**：首先定义各产品域（如《王者荣耀》、QQ音乐、腾讯会议）的关系型数据库 Schema。系统构建表依赖图（table-dependency graph），利用强大的 LLM 按照拓扑顺序填充数据。根表（如用户、部门）先生成，随后生成依赖表（如歌曲、会议记录），确保外键引用完整性，从根源上杜绝“孤儿记录”（orphan records）。\n    *   **受限上下文感知合成（Constrained Context-Aware Synthesis）**：LLM 在填充数据时，仅通过受控的插入工具（insertion tools）写入数据库，数据库引擎强制校验主键唯一性和外键有效性。对于下游表，模型必须查询现有实体而非凭空捏造 ID，确保跨表一致性。\n    *   **后生成验证与修复（Post-Generation Validation and Repair）**：使用确定性脚本修复 LLM 生成中可能存在的语义错误（如时间顺序冲突、状态字段不匹配），最终形成一个结构完整、引用完整的产品级数据库环境。\n\n2.  **任务合成（Task Synthesis）：制造信息差与工具差**\n    *   **生成器-求解器不对称（Generator-Solver Asymmetry）**：\n        *   **生成器（Generator）**：拥有特权访问权限（如 `query_sql` 和 `exec_code`），可以直接查看全局数据库状态。它通过“检查数据 → 决定目标 → 修改状态 → 总结意图”的循环生成任务，并记录数据库状态变更（database-state diff）作为 Ground Truth。\n        *   **求解器（Solver）**：即被测试的 Agent，仅拥有受限的领域特定 MCP 工具（如搜索歌曲、创建会议），无法直接访问数据库或执行代码（在 `E-Bench` 基础设置中）。\n    *   **制造差距**：这种设计人为制造了**信息差（information gap）**（求解器不知道隐藏的全局状态）和**工具差（tool gap）**（求解器缺乏生成器的计算能力），迫使 Agent 必须通过多步工具调用来发现隐藏信息并执行状态变更。\n\n3.  **评估与验证（Evaluation）**\n    *   **确定性评估（Deterministic Grading）**：Agent 执行任务后，系统比较最终数据库状态与 Ground Truth 的 Diff。只有完全匹配才算成功，不依赖 LLM Judge，消除了语义判断的主观性。\n    *   **扩展设置（`E-Bench`-Code）**：在 `E-Bench`-Code 设置中，赋予求解器 `exec_code` 能力，允许其编写 Python 代码来批量调用工具，以评估代码执行对缓解工具差的影响。\n\n**真实案例讲解：腾讯会议（Tencent Meeting）场景**\n\n*   **输入（Input）**：用户查询：“我是市场营销部的胡伟杰，需要紧急召开一个跨部门对齐会。参会人包括我，以及我所在组工龄最长的两位深圳在职员工，和产品中心视觉设计组工龄最长的一位深圳在职员工。请找出本周大家共同空闲的最早1小时时段，预定最小容量的普通会议室，创建会议、日历事件，并建立项目群。”\n*   **处理（Processing）**：\n    1.  **信息获取**：Agent 需调用工具查询组织架构，筛选出符合“深圳”、“在职”、“工龄最长”条件的特定员工 ID。\n    2.  **状态查询**：Agent 需并行查询这4位员工的日程表，通过逻辑推理找出共同空闲的时间段。\n    3.  **资源匹配**：Agent 需查询会议室列表，筛选出“普通”、“容量≥4”、“容量最小”的会议室。\n    4.  **状态变更**：Agent 依次调用工具：创建会议、预定会议室、为每位参会人创建日历事件、创建群组并添加成员。\n*   **输出（Output）**：数据库状态发生变更（新增了会议记录、会议室预定记录、日历事件、群组及成员关系）。系统将这些变更与生成器记录的 Ground Truth Diff 进行比对，若完全一致则判定为 Pass。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有核心的数学推导过程。`E-Bench` 是一项工程与评估基准研究，其核心贡献在于**数据合成方法论**、**评估指标设计**以及**实验分析**，而非提出新的数学模型或算法理论。因此，跳过本节。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有的工具使用基准测试（如 Gorilla, BFCL）主要关注单次 API 调用的正确性或短轨迹，缺乏对**多步工具使用（multi-step tool use）**、**状态变更（state-changing）**以及**部分可观测性（partial observability）**下 Agent 能力的系统性评估。此外，基于真实系统的基准难以扩展、成本高且存在数据污染风险。\n\n**2. 设计了什么实验验证这个问题？**\n*   **构建 `E-Bench`**：设计了涵盖《王者荣耀》、QQ音乐、腾讯会议三个真实产品域的 323 个状态变更任务，采用全合成环境和确定性 Diff 评估。\n*   **对比基准测试**：在 `E-Bench`（无代码执行）和 `E-Bench`-Code（有代码执行）两种设置下，测试了 11 个前沿 LLM（如 Kimi-K3, GPT-5.5, Opus-4.8 等）。\n*   **多维度分析**：\n    *   **性能指标**：使用 `Avg@3`（平均成功率）、`Pass@3`（至少一次成功）、`Pass[3]`（三次均成功，衡量可靠性）评估模型表现。\n    *   **能力分解**：将任务分为六类能力（如全数据获取、多条件过滤、跨步依赖等），分析代码执行对不同能力类型的提升效果。\n    *   **成本效率分析**：分析 API 成本、工具调用次数、Token 消耗与性能之间的关系，特别是并行工具调用（parallel tool calling）对效率的影响。\n\n**3. 问题的答案是什么？**\n*   **多步工具使用仍未解决**：即使是最强的模型（Kimi-K3），在 `E-Bench` 上的 `Avg@3` 仅为 73.79%，且可靠性指标 `Pass[3]` 低于 60%，表明 Agent 在复杂多步任务中表现不稳定。\n*   **代码执行显著提升性能但可靠性仍有限**：在 `E-Bench`-Code 中，所有模型性能均提升，Opus-4.8 以 81.11% `Avg@3` 登顶，但 `Pass[3]` 仍未超过 70%。代码执行主要缓解了**计算密集型**任务（如数据聚合、过滤）的困难，但对**推理密集型**任务（如跨实体级联、边界判断）帮助较小。\n*   **并行工具调用是关键效率因素**：具备强并行调用能力的模型（如 GLM-5.2, Hy3）能以更少的交互轮次和更低的 Token 成本完成任务；而并行能力弱的模型（如 Grok-4.5）导致 Token 消耗激增。\n*   **成本效率差异巨大**：不同模型在相同准确率下的 API 成本差异可达一个数量级，`E-Bench`-Code 通过代码封装工具调用，显著降低了交互成本，使 Pareto 前沿向更高效区域移动。", "additional_insights": "### § 8 Take-aways\n\n`E-Bench` 通过解耦 **environment synthesis** 与 **task synthesis**，构建了一个完全合成（fully synthetic）且具备参照完整性（referential integrity）的多步工具使用基准，解决了现有基准在状态持久性、可扩展性及去污染方面的不足。该基准利用 **graph-guided database filling** 生成无孤立记录（orphan-free）的数据库环境，并通过 **generator-solver asymmetry** 人为制造 **information gap** 和 **tool gap**，强制 Agent 在部分可观测环境下通过多步工具调用发现隐藏数据并执行精确的状态变更。对 11 个前沿 LLM 的评估显示，多步工具使用能力远未成熟，最强模型在 `E-Bench` 上的 **Pass[3]**（可靠性指标）仍低于 60%，表明当前 Agent 在复杂状态修改任务中缺乏稳定性。引入代码执行能力的 `E-Bench`-Code 变体显著提升了所有模型的性能并降低了交互成本，但主要收益来自计算密集型任务（如 **Aggregation and Computation**），而在需要复杂推理和边界判断的任务上提升有限，揭示了代码执行主要替代的是编排机械性而非核心推理能力。\n\n### § 9 最脆弱的假设\n\n该论文最脆弱的假设是：**完全合成的数据库环境能够充分代理真实世界产品后端中隐含的复杂业务逻辑、非结构化数据噪声及动态状态约束。** 如果这一假设不成立，即真实环境中的工具行为不仅取决于数据库状态，还涉及外部 API 的随机性、非原子性事务、或基于自然语言描述的模糊业务规则，那么 `E-Bench` 的高分可能无法转化为真实场景下的可用性。论文通过 **deterministic database-state diffs** 进行精确评估，这要求所有状态变更必须是可预测且原子化的，但在真实产品中，许多操作（如推荐系统更新、异步消息队列处理）具有非确定性或延迟效应，无法通过简单的数据库快照差异来验证。论文缺乏证据表明其合成的 **MCP tools** 能够覆盖真实产品中常见的边缘情况（edge cases），例如并发冲突处理、权限动态变更或第三方服务故障，这些在合成环境中被刻意简化或忽略，可能导致基准评估结果过于乐观，无法反映 Agent 在真实混沌环境中的鲁棒性。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 **Section 3.2** 中的 **graph-guided database filling** 流程，以验证其生成数据的参照完整性及多样性。具体步骤如下：选择一个小型真实数据库 Schema（如包含用户、订单、商品的电商模型），使用 LLM 按照拓扑顺序填充数据，并启用外键约束。测量指标包括：1) **Orphan Record Rate**（孤立记录率），理想情况下应为 0；2) **Data Diversity**（数据多样性），通过计算各字段值的熵或唯一值比例来评估；3) **Constraint Violation Rate**（约束违反率），在填充后运行完整性检查脚本。如果生成的数据存在大量孤立记录或违反业务逻辑约束（如订单日期早于用户注册日期），则反驳了论文关于“通过拓扑排序和约束合成即可构建高质量环境”的 claim；反之，若数据完整且多样，则支持了其环境构建方法的有效性，但需注意这仅验证了数据层面，未验证工具交互层面的真实性。", "research_value": "### § 11 最强反例设计\n\n若要挑战 `E-Bench` 的有效性，最有力的攻击点在于其**合成环境的“过度结构化”与真实世界“混沌状态”之间的鸿沟**，具体可通过设计一个**“非原子性并发冲突（Non-Atomic Concurrency Conflict）”**的反例场景来证伪其评估的生态效度。\n\n`E-Bench` 的核心假设是：只要最终数据库状态与 Ground Truth 的 Diff 一致，Agent 的任务即视为成功。然而，在真实的高并发产品后端（如腾讯会议或电商秒杀），状态变更往往涉及**分布式事务（Distributed Transactions）**、**乐观锁（Optimistic Locking）**或**异步消息队列（Async Message Queues）**。我们可以构造这样一个反例任务：Agent 需要为两个重叠的时间段预定同一会议室。在 `E-Bench` 的确定性环境中，由于缺乏真实的并发竞争者，Agent 只需按顺序调用 API 即可成功，系统会记录两次成功的状态变更。但在真实场景中，第二次预定会因资源冲突被后端拒绝，返回特定的错误码（如 `409 Conflict`），要求 Agent 进行**错误恢复（Error Recovery）**或**回退策略（Fallback Strategy）**（例如寻找替代会议室或通知用户）。\n\n`E-Bench` 的 **Deterministic Grading** 机制完全忽略了这一过程。它只检查“会议室是否被预定”，而不检查“预定过程是否处理了潜在的竞争条件”。因此，一个在 `E-Bench` 上得高分的 Agent，可能仅仅是一个擅长在静态快照中执行 CRUD 操作的脚本，而缺乏处理**部分失败（Partial Failure）**和**状态不一致（State Inconsistency）**的鲁棒性。此外，`E-Bench` 中的 **MCP tools** 是理想化的，它们不会超时、不会返回模糊的自然语言错误、也不会因为上游服务抖动而返回空值。如果我们将 `E-Bench` 的任务迁移到一个引入了**随机延迟（Random Latency）**和**非确定性错误注入（Non-deterministic Error Injection）**的模拟环境中，预计所有模型的 `Pass[3]` 将断崖式下跌，从而证明 `E-Bench` 评估的是一种“无菌环境下的工具调用能力”，而非真实世界所需的“抗脆弱智能体能力”。这一反例揭示了 `E-Bench` 的最大盲区：它评估的是**状态的一致性（Consistency）**，而非**过程的鲁棒性（Robustness）**。\n\n### § 12 Follow-up Research Idea\n\n基于 `E-Bench` 在**状态持久性**和**确定性评估**上的成功，但其对**动态环境适应性**和**错误恢复能力**评估的缺失，我提出一个新的研究方向：**Stochastic Stateful Agent Benchmarking (SSAB)**，即**随机状态智能体基准测试**。\n\n**(a) 驱动局限与未满足需求：**\n`E-Bench` 解决了“如何评估多步工具调用的最终结果正确性”的问题，但忽略了真实世界中工具调用的**非确定性（Non-determinism）**和**副作用（Side Effects）**的复杂性。现有基准要么过于静态（如 `E-Bench`），要么过于依赖人工标注的轨迹（如 `AppWorld`）。我们需要一个能够评估 Agent 在**部分可观测、动态变化且充满噪声**的环境中，通过**试错（Trial-and-Error）**和**自我修正（Self-Correction）**来达成目标的能力。这不仅是工具使用的延伸，更是**强化学习（Reinforcement Learning）**与**工具使用（Tool Use）**的交叉点。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴**程序合成（Program Synthesis）**中的**Fuzzing（模糊测试）**技术和**强化学习**中的**Sim-to-Real（仿真到现实）**迁移框架。具体来说，引入一个**动态环境模拟器（Dynamic Environment Simulator）**，该模拟器不仅包含静态数据库，还包含一组**随机扰动器（Perturbers）**。这些扰动器会在 Agent 执行过程中随机注入故障（如 API 超时、数据临时不可用、权限动态变更）。同时，借鉴**形式化验证（Formal Verification）**中的**不变量（Invariants）**概念，定义任务的“成功”不仅取决于最终状态，还取决于执行过程中是否违反了某些安全约束（如未授权访问、数据泄露）。\n\n**(c) 第一个实验设计：**\n构建一个名为 **Chaos-Bench** 的基准，基于 `E-Bench` 的数据库 Schema，但增加以下维度：\n1.  **动态扰动层**：在 Agent 执行每一步工具调用时，以一定概率（如 10%）触发随机故障（如返回空结果、返回错误码、延迟响应）。\n2.  **多智能体竞争**：引入多个 Agent 同时操作同一数据库，模拟真实的并发竞争环境。Agent 必须处理**冲突检测（Conflict Detection）**和**重试机制（Retry Mechanism）**。\n3.  **评估指标**：除了传统的 `Pass@k`，引入**Resilience Score（韧性得分）**，衡量 Agent 在遭遇故障后恢复任务的能力；以及**Efficiency under Chaos（混沌下的效率）**，衡量在噪声环境下完成任务所需的额外 Token 和步骤。\n\n**与已有工作的区别：**\n`E-Bench` 是**确定性（Deterministic）**和**单智能体（Single-Agent）**的，关注**状态变更的精确性**；而 **Chaos-Bench** 是**随机性（Stochastic）**和**多智能体（Multi-Agent）**的，关注**过程的鲁棒性**和**适应性**。`E-Bench` 告诉我们要如何正确地调用工具，而 **Chaos-Bench** 告诉我们要如何在工具调用失败或环境变化时依然达成目标。这一方向将推动 Agent 从“脚本执行者”向“自主问题解决者”演进。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Weihuang Zheng\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Tianyuan Zou\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Eileen Ye\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Alphet Liu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Youyong Kong\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Ya-Qin Zhang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Duran Zheng\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Maxm Pan\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Hunyuan Team, Tencent\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Institute for AI Industry Research, Tsinghua University\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"School of Computer Science and Engineering, Southeast University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"∗\",\n      \"text\": \"Equal contribution.\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Correspondence to maxmpan@tencent.com.\"\n    }\n  ]\n}\n```", "summary_translation": "大型语言模型（LLMs）正越来越多地被部署为代理，在多个步骤中与有状态环境进行交互：收集隐藏信息、组合工具调用以及提交状态变更。我们将这种能力称为多步工具使用（multi-step tool use）。现有的基准测试在工具使用代理评估方面取得了进展，但往往侧重于孤立的 API 调用、短轨迹，或难以扩展或控制的设置。我们引入了 E-Bench，这是一个完全合成的基准测试，包含三个产品领域（王者荣耀、QQ 音乐和腾讯会议）中的 323 个状态变更任务。E-Bench 将环境合成与任务合成解耦：图引导的数据库填充构建了可重用且无孤立数据的产品环境，而生成器-求解器不对称性则创建了同时具有信息差距和工具差距的任务，要求代理在改变状态之前发现隐藏数据并组合多个工具调用。结果通过数据库状态差异进行确定性评分。由于环境和任务都是合成的，E-Bench 在环境层面具有可控性，在任务层面具有可扩展性。对 11 个前沿 LLM 的基准测试表明，多步工具使用仍然具有挑战性：最强模型的 Pass^3 保持在 60% 以下，即使在 E-Bench-Code 扩展中使用代码执行，可靠性（Pass^3）也保持在 70% 以下。"}]}, {"name": "Multi-Agent Systems \u0026 Cooperation", "count": 1, "papers": [{"title": "Commitment To Cooperation With Self-Negotiated Contracts", "arxiv_id": "2607.22750", "authors": "Tim Wyse, Kaitlin Bustos, Yulia Volkova, Max Kleiman-Weiner", "summary": "As AI agents operate with increasing autonomy in a multi-agent world, they will need to learn to cooperate with other agents and with humans to generate mutual benefits. However, cooperation is a challenge because the costs of cooperation are often incurred early on, but the benefits are only realized later, creating an incentive to defect. How can AI agents cooperate with commitment? Here, we draw on inspiration from legal institutions and contracting that human societies have used to solve principal-agent problems of this kind. Contracts provide observable representations of agreements that enable credible commitments through the enforcement of terms. We study the role of contract-based cooperation using LLM-based agents in \\CT, a spatial-temporal game that combines bargaining with navigation towards a goal. We study a suite of contract representations that range from formal contracts that compile to code to natural contracts that require reinterpretation. We evaluate agents with a range of LLM backbones using different sizes and providers. We find that self-negotiated contracts can improve cooperative outcomes beyond what is possible with regular trading.", "category": "cs.AI", "cluster": "Multi-Agent Systems \u0026 Cooperation", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior, Multi-Agent)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-129 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文符合研究范围，主要基于以下理由：\n\n1.  核心对象匹配：论文明确研究对象是 \"LLM-based agents\"（基于大语言模型的智能体），且处于 \"multi-agent world\"（多智能体环境）中，直接对应研究焦点中的“多智能体 (Multi-Agent)”方向。\n2.  机制创新符合“协作机制”定义：论文提出的核心贡献是引入“自我协商的合同”（self-negotiated contracts）作为解决多智能体合作中承诺问题（commitment problem）的新机制。这属于“多智能体系统中新的协作机制”和“博弈策略”的研究范畴，而非被排除的底层通信协议、拓扑结构或消息路由等系统工程问题。\n3.  非纯应用/非纯基础设施：虽然论文使用了特定的游戏环境（CT game）进行评估，但其核心贡献在于提出一种通用的、基于LLM的契约协商与执行框架，旨在解决智能体间的信任与合作难题，具有方法论意义，而非仅仅将现有Agent应用于特定领域解决领域问题。\n4.  符合保留标准：根据筛选标准第一步，“如果论文研究 agent 的...协作意图...并且标题或摘要明确指向 Agentic / LLM Agents...应保留”。该论文探讨了LLM Agent如何通过结构化协议（合同）实现更高级的社会性协作，属于Agentic AI的前沿探索。\n\n综上，该论文研究了LLM多智能体在博弈场景下的新型协作与承诺机制，符合“多智能体协作机制”的研究重点，故判定为保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决多智能体系统中，基于大语言模型（LLM-based agents）的自主代理如何在缺乏稳定声誉机制的情况下，通过**self-negotiated contracts**（自我协商合同）实现可信承诺（credible commitment）并促进合作的问题。随着AI代理在商业和日常任务中自主性增强，它们面临着经典的**principal-agent problems**（委托-代理问题）和**hold-up problem**（敲竹杠问题）：合作往往需要一方先承担成本，而收益滞后，这导致了强烈的**defection**（背叛）激励。由于AI代理可以被随意实例化或终止，传统的基于长期互惠或声誉的合作机制（如**indirect reciprocity**）难以维持，使得“cheap talk”（廉价谈话）式的口头承诺无效。\n\n这一问题的重要性在于，它是实现**Coasean Singularity**（科斯奇点）——即通过极低交易成本实现高效、定制化协议——的关键瓶颈。如果AI代理无法在不对称依赖或互赖情境下建立可靠的执行机制，它们将陷入低效的零和博弈或完全无法合作，从而无法释放多智能体协作的潜在价值。此外，缺乏可信承诺机制可能诱发欺骗或操纵行为，带来**AI safety**（AI安全）风险。通过引入类似人类法律制度的合同机制，本研究探索了如何通过外部可观察的协议表示（如代码或自然语言）来强制执行条款，从而在去中心化的多智能体环境中实现可扩展的合作。解决这一问题不仅有助于提升AI代理在复杂经济交互中的效率，也为理解**contractualist reasoning**（契约主义推理）在机器智能中的实现提供了实证基础。\n\n### § 2 前人工作与不足\n\n尽管多智能体系统中的合作与谈判已有广泛研究，但现有工作在处理LLM代理的**commitment**（承诺）机制方面存在显著不足。经典的多智能体规划研究，如基于**Colored Trails**游戏的实验（Grosz et al., 2004; Gal et al., 2004），主要关注**bargaining**（讨价还价）和**Theory of Mind**（心智理论）在静态或简单动态环境中的作用，但并未深入探讨具有时间延迟和背叛风险的复杂承诺执行问题。近期的强化学习（RL）研究（如Haupt et al., 2024; Oldenburg \u0026 Zhi-Xuan, 2024）引入了形式化合同，但这些工作通常局限于简化的**formal contract spaces**（形式化合同空间），代理仅对固定合同的参数进行谈判，缺乏对合同条款本身的开放协商能力。此外，Yocum et al. (2023)在Minecraft中的研究虽然涉及合同，但仅限于**reward function augmentation**（奖励函数增强），未能模拟真实世界中合同作为独立执行机制的作用。\n\n针对LLM代理的研究（如Piatti et al., 2024; Liu et al., 2026; Qian et al., 2025）主要关注社会困境或买卖谈判中的行为模式，但这些环境通常缺乏**CT-Bench**所具备的复杂状态空间推理和多轮动态交互需求。更重要的是，这些研究未探究LLM代理如何形成、解释和执行合同，特别是不同合同表示形式（如**programmatic contracts** vs. **natural language contracts**）对合作结果的影响。现有的符号方法（如Singh, 1999; Desai et al., 2008）虽然提供了严格的逻辑保证，但需要人类专家将合同转化为形式逻辑，这在LLM代理通过自然语言交互的场景中构成了采用障碍。Chopra et al. (2025)提出的认知架构虽然支持基于承诺的推理，但依赖于预定义的声明式承诺，缺乏对开放-ended自然语言对话中协商过程的建模。因此，现有工作未能充分解决LLM代理在动态、不对称依赖环境中，如何通过自我协商的合同表示来实现鲁棒合作的问题，特别是在合同表示的模糊性（如自然语言）与执行精度（如代码）之间的权衡尚未被系统性地实证研究。", "core_insight": "### § 3 重建作者的思考路径\n\n在大型语言模型（LLM）驱动的自主智能体（Autonomous Agents）日益普及的背景下，多智能体系统（Multi-Agent Systems, MAS）面临的核心挑战是如何在缺乏中央权威的情况下实现可信合作。传统的博弈论和强化学习（Reinforcement Learning, RL）研究指出，合作往往因“搭便车”（Free-riding）或“敲竹杠”（Hold-up Problem）而失败，即一方在付出早期成本后，无法保证对方在后期履行承诺。现有的LLM智能体交互研究多集中于简单的买卖谈判或社会困境（Social Dilemmas），这些环境通常缺乏复杂的状态空间推理和跨时间步的承诺机制。\n\n观察人类社会的解决方案，法律合同（Contracts）作为一种外部可执行的承诺机制，能够有效解决委托-代理问题（Principal-Agent Problems）。然而，在AI领域，现有的合同研究要么局限于形式化逻辑验证（需要人工介入），要么仅作为奖励函数的简单增强，未能探索LLM智能体如何通过自然语言自主协商并执行复杂合同。此外，LLM智能体在交互中常表现出“廉价谈话”（Cheap Talk）的不可靠性，且缺乏稳定的声誉机制来维持长期互惠。\n\n因此，研究者推测，如果为LLM智能体引入类似人类的合同机制，特别是那些能够被程序化执行或明确解释的承诺表示（Commitment Representations），可能会显著提升合作效率。关键在于，合同不仅是一种协议，更是一种改变激励结构（Incentive Structure）的工具。通过对比不同形式的合同（如编译为代码的形式化合同 vs. 需要重新解释的自然语言合同），可以探究承诺的表示形式如何影响智能体的合作行为，特别是在存在权力不对称（Asymmetric Power）和相互依赖（Mutual Dependence）的复杂场景中。这一思路旨在填补当前合作AI（Cooperative AI）和AI安全（AI Safety）领域中关于自主协商与执行机制的研究空白。\n\n### § 4 核心 Intuition\n\nLLM智能体在缺乏强制执行力时，倾向于将口头承诺视为“廉价谈话”，导致在跨时间步的合作中因信任缺失而失败。引入自协商的合同（Self-Negotiated Contracts）作为外部可观察且可执行的承诺机制，能够将模糊的意图转化为明确的义务，从而解决“敲竹杠”问题。特别是形式化合同（如编译为代码的Prog-Trading），通过消除自然语言的歧义并自动执行资源转移，显著降低了执行成本和不信任感，使得即使在权力不对称的场景下，智能体也能达成比单纯交易更优的合作结果。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法是在多智能体协作环境中引入**Contract-based Cooperation**（基于合同的协作）机制，以解决LLM智能体在缺乏长期声誉和外部强制力时面临的**Commitment Problem**（承诺问题）和**Hold-up Problem**（敲竹杠问题）。\n\n该方法构建了一个名为 **CT-Bench** 的评估基准，其核心 Pipeline 包含以下关键步骤：\n\n1.  **环境初始化与状态感知**：\n    *   **输入**：两个自利型LLM智能体（P-Red 和 P-Blue）在一个 $4 \\times 4$ 的网格地图上，各自拥有不同颜色的芯片（Chips）库存。\n    *   **处理**：智能体接收当前状态，包括自身位置、目标位置、剩余芯片数量、地图布局以及对手的状态（在完全信息设定下）。系统提示词（System Prompt）明确设定智能体为“自私”（Selfish），仅在有严格收益时合作。\n\n2.  **合同协商阶段（Contract Negotiation Phase）**：\n    *   **输入**：智能体通过自然语言对话进行多轮谈判。\n    *   **处理**：智能体根据各自的路径需求和资源短缺情况，提出合同条款。根据合同类型的不同，处理方式有所区别：\n        *   **Prog-Trading（程序化交易合同）**：智能体协商具体格子的覆盖责任。LLM Judge（裁判模型，如 Qwen-3-235B）将自然语言协议转化为结构化的 JSON 对象（例如：`{\"(1,0)\": {\"giver\": \"P-BLUE\", \"receiver\": \"P-RED\", \"color\": \"Blue\"}}`）。双方需显式接受该 JSON 合同。\n        *   **NL-Trading（自然语言交易合同）**：智能体仅通过自然语言达成协议，保留完整的对话历史。在执行阶段，LLM Judge 实时解读对话以判断当前移动是否符合合同。\n        *   **Prog-Points（程序化点数合同）**：智能体协商到达终点后的点数转移（Side Payments）。Judge 将其转化为 JSON 格式，规定若一方到达终点，需向另一方支付特定点数。\n    *   **输出**：一份被双方接受的合同（结构化 JSON 或自然语言记录），或谈判失败（无合同）。\n\n3.  **游戏执行与合同强制执行（Execution \u0026 Enforcement Phase）**：\n    *   **输入**：智能体轮流决定移动或交易。\n    *   **处理**：\n        *   **移动决策**：智能体尝试移动到相邻格子。\n        *   **合同触发**：\n            *   在 **Prog-Trading** 中，如果移动涉及的格子在合同中指定由对方支付，系统自动从“给予者”库存中扣除对应颜色的芯片并转移给“接收者”。如果给予者库存不足，其得分立即归零（强制违约惩罚）。\n            *   在 **NL-Trading** 中，LLM Judge 检查当前移动是否在自然语言协议的覆盖范围内。如果是，执行芯片转移；否则，智能体需自行支付。\n            *   在 **Prog-Points** 中，移动阶段正常进行，但在游戏结束时，根据合同自动执行点数转移。\n        *   **Pay-for-Partner（伙伴付费模式）**：作为基线对比，智能体可以口头承诺为对方支付移动成本，但这属于非绑定性承诺（Non-binding），对方可以选择违约（Defect）。\n    *   **输出**：每一步的移动结果、库存更新、以及可能的违约记录。\n\n4.  **结算与评估（Settlement \u0026 Evaluation）**：\n    *   **输入**：游戏结束状态（双方是否到达终点、剩余芯片）。\n    *   **处理**：计算最终得分。到达终点得 20 分，每剩余一个芯片得 5 分。应用合同规定的点数转移（如有）。\n    *   **输出**：最终奖励（Reward）、联合奖励（Joint Reward）、基尼系数（Gini，衡量不平等）、违约率（Defection Rate）等指标。\n\n**真实例子讲解**：\n假设在 **Asymmetric Board**（非对称地图）上，P-Red 可以独立到达终点，而 P-Blue 缺少红色芯片无法通过某些格子。\n*   **协商**：P-Red 利用其优势地位，在 **Prog-Points** 模式下提出：“如果你到达终点，给我 18 分；我到达终点，给你 0 分。” P-Blue 为了获得任何收益（否则得 0 分），被迫接受。\n*   **执行**：P-Red 在移动过程中，当 P-Blue 需要穿过红色格子时，P-Red 根据合同义务（或通过交易）提供红色芯片。由于合同是程序化的，P-Red 无法在 P-Blue 即将到达时突然拒绝帮助（除非库存耗尽，但这会导致 P-Red 违约惩罚或失去点数转移的收益预期，尽管 Prog-Points 主要约束最终点数，但 Prog-Trading 约束过程）。\n*   **结果**：P-Blue 到达终点，触发合同，P-Red 从 P-Blue 的 20 分中拿走 18 分。P-Red 获得高分，P-Blue 获得 2 分（优于不合作的 0 分）。这展示了合同如何使非对称依赖下的合作成为可能。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文主要是一篇实证研究（Empirical Study），侧重于通过实验评估不同合同表示形式对 LLM 智能体行为的影响，而非提出新的理论模型或进行复杂的数学推导。因此，没有核心的数学推导过程。\n\n不过，论文定义了一些关键的量化指标来评估合作效果，其直觉如下：\n\n1.  **Reward ($r_i$)**：\n    *   公式：$r_i = 20 + 5n_i$ （若到达终点），否则 $0$。\n    *   Intuition：激励智能体不仅要到达终点（主要目标），还要节省资源（次要目标）。\n\n2.  **Normalized Joint Reward ($\\hat{R}$)**：\n    *   公式：$\\hat{R} = R / R_{max}$。\n    *   Intuition：衡量合作效率。$R_{max}$ 是理论上双方都走最短路径且无浪费时的最大总得分。该指标越高，说明智能体越能实现帕累托最优（Pareto Optimal）的合作。\n\n3.  **Gini Coefficient ($e$)**：\n    *   公式：$e = \\frac{|r_2 - r_1|}{r_2 + r_1}$ （简化版）。\n    *   Intuition：衡量分配的不平等程度。0 表示完全平等，0.5 表示完全不平等。用于分析合同是否导致一方剥削另一方，特别是在非对称地图中。\n\n4.  **Both Beat Baseline (BBB)**：\n    *   定义：$BBB = 1$ 如果 $r_i \u003E b_i$ 对所有 $i$ 成立，否则 $0$。\n    *   Intuition：$b_i$ 是智能体在不合作情况下的基准得分。BBB 为 1 意味着合作确实带来了“双赢”（Win-Win），即帕累托改进。这是验证合作是否真正有益的核心指标。\n\n### § 7 实验设计与结论\n\n**提出了什么问题？**\n在去中心化的多智能体环境中，LLM 智能体由于缺乏长期声誉和外部强制力，难以建立可信的承诺（Credible Commitment），导致在需要早期投入、后期获益的场景中容易出现违约（Defection）或合作失败。现有的自然语言交流（Cheap Talk）不足以解决这一问题。那么，引入不同形式的**合同（Contracts）**是否能改善合作结果？不同的合同表示形式（结构化代码 vs. 自然语言）对合作效率和公平性有何影响？\n\n**设计了什么实验验证这个问题？**\n1.  **构建 CT-Bench 基准**：设计了一个基于 **Colored Trails** 游戏的时空博弈环境，包含三种地图类型：\n    *   **Independent**：双方可独立到达终点，无需合作。\n    *   **Mutually Dependent**：双方都依赖对方资源才能到达终点，地位平等。\n    *   **Asymmetric**：一方可独立到达，另一方依赖前者，存在权力不对称。\n2.  **引入多种合同机制**：\n    *   **No Contract**：基线，仅靠自然语言承诺（Pay-for-Partner）。\n    *   **Prog-Trading**：程序化交易合同，将协议编译为 JSON，自动执行芯片转移，违约即惩罚。\n    *   **NL-Trading**：自然语言交易合同，由 LLM Judge 实时解释自然语言协议。\n    *   **Prog-Points**：程序化点数合同，约定终点后的点数转移。\n3.  **评估模型**：使用 6 种不同规模和提供商的 LLM（GPT-4.1, Haiku-4.5, LLaMA Maverick/Scout, Qwen-3-235B/30B）进行自对弈（Self-play）和跨模型对弈。\n4.  **分析指标**：关注 Normalized Joint Reward（效率）、Gini（公平性）、Both Finished（成功率）、Defection Rate（违约率）以及谈判策略（如 Power Exploitation, Appeal to Fairness）。\n\n**问题的答案是什么？**\n1.  **合同显著提升合作效果**：与无合同（No Contract）相比，引入合同机制（特别是 **Prog-Trading**）能显著提高联合奖励和双方到达终点的概率，尤其是在 **Mutually Dependent** 和 **Asymmetric** 地图中。\n2.  **结构化合同优于自然语言合同**：**Prog-Trading**（程序化）表现最好，因为它消除了自然语言的歧义，并提供了自动执行的强制力。**NL-Trading** 表现较差，因为智能体容易过度依赖合同文本（Over-anchoring），减少了必要的额外交易，且自然语言的模糊性导致执行失败。\n3.  **合同缓解权力不对称**：在 **Asymmetric** 地图中，弱势方（依赖方）通过合同（特别是 **Prog-Points** 中的点数转移）能够向强势方支付“贿赂”以换取合作，从而获得比不合作更好的结果。虽然强势方可能利用优势获取更高收益（高 Gini），但合作本身得以实现。\n4.  **违约率降低**：程序化合同（Prog-Trading）通过自动执行和违约惩罚，大幅降低了违约率。而在无合同设置下，违约率较高，特别是在存在“瓶颈控制”（Bottleneck Control）的情况下。\n5.  **谈判策略的影响**：智能体在谈判中会使用多种策略，如“权力剥削”（Power Exploitation）和“公平诉求”（Appeal to Fairness）。在不对称地图中，强势方更倾向于使用权力剥削策略，而合同机制使得这种剥削变得可计算和可接受（对弱势方而言）。\n\n总之，论文证明**Self-negotiated Contracts**（自协商合同），特别是那些可以编译为代码并自动执行的**Formal Contracts**，是解决 LLM 智能体间承诺问题、实现高效且稳健合作的有效机制。", "additional_insights": "### § 8 Take-aways\n\nLLM agents在缺乏外部强制力的多智能体环境中，通过自我协商的**self-negotiated contracts**能够显著提升合作效率，特别是在解决**hold-up problem**和**commitment problem**方面表现优于单纯的**Pay-for-Partner**口头承诺。研究提出的**CT-Bench**基准测试表明，将自然语言协议编译为可执行的**Programmatic Trading Contract (Prog-Trading)**比依赖**Natural Language Trading Contract (NL-Trading)**更能减少**defection rate**并提高**Normalized Joint Reward**，因为前者消除了执行阶段的解释歧义。在**Asymmetric boards**（即一方拥有独立达成目标能力而另一方依赖对方）中，合同机制主要惠及弱势方，强势方往往难以利用其战略优势提取额外剩余，这暗示LLM在谈判中倾向于公平分配而非剥削性策略。**NL-Trading**虽然保留了自然语言的灵活性，但导致模型过度锚定（over-anchor）于合同条款，抑制了必要的后续**trading**行为，从而在**Mutually Dependent**场景下表现最差。**Prog-Points**合同允许基于最终结果的**side payments**，在不对称博弈中产生了高度不平等（**Winner Takes All**）的分配结果，揭示了不同合同表示形式对激励对齐（incentive alignment）的深刻影响。\n\n### § 9 最脆弱的假设\n\n该方法最脆弱的假设是：**LLM作为“法官”（Judge Model）能够准确、无偏见地解释和执行自然语言或结构化合同条款，且该解释过程本身不会引入新的系统性偏差或攻击向量。**\n\n如果这一假设不成立，核心贡献将直接失效，因为**NL-Trading**和**Prog-Trading**的有效性完全依赖于一个可信的第三方执行机制。在实际应用中，LLM法官可能面临以下挑战：1) **Prompt Injection**或**Jailbreaking**：恶意代理可能通过精心设计的谈判对话诱导法官做出有利于自己的错误解释；2) **Ambiguity Exploitation**：自然语言固有的模糊性可能被代理利用，导致法官在边界案例中做出不一致的裁决，从而破坏合同的**credible commitment**属性；3) **Judge Bias**：法官模型自身的训练偏差可能导致对某些谈判策略（如**Power Exploitation**）的系统性偏好或歧视。\n\n论文在附录C.4中提供了有限的证据，显示**Qwen-3-235B**法官在1,155次移动验证中仅有0.26%的错误率，且错误多为位置混淆。然而，这一证据仅覆盖了简单的坐标匹配场景，未测试复杂语义歧义、对抗性谈判策略或法官被操纵的情况。缺乏对法官鲁棒性（Robustness）和安全性（Safety）的深入评估，使得该假设在开放、对抗性的真实多智能体环境中显得尤为脆弱。\n\n### § 10 最小复现实验\n\n在1周内，可以复现**NL-Trading**中“过度锚定”（Over-anchoring）导致交易减少这一核心发现，无需构建完整的CT-Bench环境。\n\n**数据与实现**：\n1. 选取3-5个典型的**Mutually Dependent**棋盘布局（如论文Figure 23中的Board 22-26）。\n2. 使用两个相同的LLM（如GPT-4o或Claude 3.5 Sonnet）作为代理，模拟谈判阶段。\n3. 实现一个简化的“法官”逻辑：对于**Prog-Trading**，直接解析JSON合同；对于**NL-Trading**，将自然语言合同和当前移动请求发送给LLM法官，判断是否覆盖。\n4. 关键变量：在谈判后，强制代理进入“移动决策”阶段，记录其是否提出额外的**Pay-for-Partner**交易请求。\n\n**测量指标**：\n1. **Contract Coverage Ratio**：合同覆盖的格子数 / 到达目标所需的最短路径格子数。\n2. **Post-Contract Trade Proposals**：合同生效后，代理提出的额外交易次数。\n3. **Success Rate**：双方是否都到达目标。\n\n**支持/反驳标准**：\n- **支持**：如果**NL-Trading**组的**Post-Contract Trade Proposals**显著低于**Prog-Trading**组，且**Success Rate**也较低，则支持论文关于自然语言合同导致模型过度依赖合同、抑制必要交易的claim。\n- **反驳**：如果两组在额外交易提议上没有显著差异，或者**NL-Trading**组的成功率更高，则表明“过度锚定”效应可能被高估，或模型能够灵活处理自然语言合同的模糊性。\n\n此实验聚焦于合同表示形式对后续行为的影响，避开了复杂的环境模拟和长期训练，能在短时间内验证论文的核心机制假设。", "research_value": "### § 11 最强反例设计\n\n要挑战这篇论文的核心结论，最有力的攻击并非质疑合同是否有效，而是质疑其有效性是否源于**LLM Judge**（裁判模型）的“幻觉性权威”而非合同机制本身的鲁棒性，即提出**“Judge-Dependent Illusion of Commitment”**（依赖法官的承诺幻觉）这一替代解释。\n\n**理论论证与实验设计**：\n论文声称 **Prog-Trading** 优于 **NL-Trading** 是因为前者消除了歧义并提供了自动执行。然而，在 **Prog-Trading** 中，LLM Judge 不仅负责解释，还负责将自然语言谈判转化为 JSON 代码。如果 Judge 模型在转化过程中存在系统性偏差（例如，倾向于将模糊的自然语言承诺转化为对发起方有利的结构化条款，或者在边界条件下错误地判定违约），那么观察到的“高合作率”可能仅仅是因为代理学会了“讨好”Judge 的解析逻辑，而非建立了真正的可信承诺。\n\n**具体反例实验**：\n设计一个**“对抗性语义歧义”**（Adversarial Semantic Ambiguity）实验。\n1.  **场景**：在 **Mutually Dependent** 地图中，构造一种情况，其中自然语言描述的路径存在两种合理的几何解释（例如，“穿过红色区域”是指“进入任意红色格子”还是“完全覆盖红色路径”）。\n2.  **干预**：引入一个**“双法官机制”**（Dual-Judge Mechanism）。使用两个不同架构或不同指令微调的 LLM 作为 Judge（例如，一个严格遵循字面意思，一个遵循意图推断）。\n3.  **预期结果**：如果论文的核心机制成立，**Prog-Trading** 应该因为代码的确定性而表现出一致的执行结果。但如果反例成立，我们会发现：\n    *   在 **NL-Trading** 中，由于缺乏结构化约束，代理会频繁陷入僵局或违约（符合论文预期）。\n    *   但在 **Prog-Trading** 中，如果两个 Judge 对同一份自然语言谈判生成的 JSON 解释不一致，或者代理发现可以通过操纵自然语言措辞来诱导 Judge 生成对自己有利的 JSON（即 **Prompt Injection** 的一种形式），那么 **Prog-Trading** 的 **Defection Rate** 将显著上升，甚至超过 **NL-Trading**。\n    *   更关键的是，如果代理发现 Judge 在解析“模糊条款”时存在可预测的偏差（例如，总是偏向先发言者），代理将不再进行实质性的资源交换，而是进行**“语义套利”**（Semantic Arbitrage），即利用 Judge 的解析漏洞获取利益。这将证明，当前的“合同”并非解决了 **Commitment Problem**，而是将问题转移到了 **Judge Alignment Problem**（法官对齐问题）上，且由于 LLM 的非确定性，这种对齐在开放环境中是不可靠的。\n\n**真实世界场景映射**：\n在去中心化的 **DeFi**（去中心化金融）或 **Smart Contract** 环境中，如果合同解释器（Interpreter）本身存在漏洞或被操纵，所谓的“代码即法律”（Code is Law）将导致系统性风险。如果 LLM 代理在真实商业交互中依赖此类机制，攻击者可以通过精心设计的自然语言谈判诱导生成有漏洞的 JSON 合同，从而在无需违约的情况下合法地“敲竹杠”（Hold-up），这直接否定了论文关于“可信承诺”的结论。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“静态合同执行”到“动态声誉与合同演化”——基于博弈论的 LLM 代理合同生命周期管理**\n\n**(a) 驱动局限与未满足需求**：\n当前论文及现有工作主要关注**单次交互**（One-shot Interaction）或**有限重复博弈**中的合同形成与执行，假设合同一旦签署即固定不变，且执行依赖于外部 **Judge**。然而，在真实的 **Multi-Agent Systems** 中，代理之间往往存在**长期关系**（Long-term Relationships），且环境是动态变化的。静态合同无法适应环境扰动（如路径突然被阻塞），且缺乏对代理**历史行为**（Historical Behavior）的考量。此外，依赖外部 **Judge** 引入了单点故障和高延迟。真正的 **Credible Commitment** 应内生于代理的**声誉机制**（Reputation Mechanism）和**合同演化能力**（Contract Evolution Capability）中，而非仅仅依赖外部强制力。\n\n**(b) 借鉴相邻领域的方法**：\n借鉴**机制设计**（Mechanism Design）中的**动态拍卖**（Dynamic Auctions）和**重复博弈**（Repeated Games）理论，以及**区块链**（Blockchain）中的**智能合约升级**（Smart Contract Upgradability）和**去中心化身份**（DID, Decentralized Identity）概念。具体而言，引入**Reputation-Weighted Contract Enforcement**（声誉加权合同执行）和**Adaptive Contract Clauses**（自适应合同条款）。\n\n**(c) 第一个实验设计**：\n构建一个**“长期合作演化基准”**（Long-term Cooperative Evolution Benchmark, LCE-Bench）。\n1.  **环境**：扩展 **CT-Bench**，使其支持**多轮连续游戏**（Multi-round Sequential Games），代理之间保持身份一致性（Persistent Identity）。\n2.  **机制创新**：\n    *   **去中心化声誉系统**：每个代理拥有一个基于其历史履约记录（Fulfillment History）的**Reputation Score**。该分数不由外部 Judge 直接给出，而是由其他代理基于交互体验进行**Peer-to-Peer Rating**（点对点评分），并通过**Cryptography**（密码学）手段防止篡改。\n    *   **动态合同条款**：合同不再是静态 JSON，而是包含**Conditional Clauses**（条件子句）的**Programmable Logic**（可编程逻辑）。例如，“如果环境状态 X 发生变化，则条款 Y 自动调整为 Z”。\n    *   **声誉加权执行**：当发生争议时，执行力度与代理的 **Reputation Score** 挂钩。高声誉代理的违约成本更高（如被社区排斥），低声誉代理需支付更高的**Collateral**（保证金）才能参与谈判。\n3.  **实验变量**：\n    *   **Baseline**：论文中的 **Prog-Trading**（无声誉，静态合同）。\n    *   **Proposed Method**：**Reputation-Adaptive Contracts**（声誉自适应合同）。\n    *   **Adversarial Condition**：引入**“声誉攻击”**（Reputation Attack），即恶意代理通过串通刷低其他代理的声誉。\n4.  **评估指标**：\n    *   **Cooperative Stability**（合作稳定性）：在长期交互中，合作关系的维持时长。\n    *   **Adaptation Efficiency**（适应效率）：在环境扰动下，合同重新协商并恢复合作的平均时间。\n    *   **Reputation Accuracy**（声誉准确性）：代理的声誉分数与其实际履约行为的相关性。\n\n**与已有工作的区别**：\n现有工作（包括本文）主要关注**合同表示形式**（Representation）对单次谈判结果的影响，而本提议关注**合同生命周期**（Lifecycle）和**代理社会结构**（Social Structure）对长期合作的影响。它不再将 **Judge** 视为全知全能的第三方，而是将执行机制内化为代理间的**声誉博弈**，从而更贴近真实世界中基于信任和声誉的合作模式，解决了 **Judge Dependency** 和 **Static Contract Rigidity** 两大核心局限。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Tim Wyse\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Kaitlin Bustos\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Yulia Volkova\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Max Kleiman-Weiner\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Algoverse AI Research\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"University of Washington\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal contribution. Correspondence: wyset@tcd.ie\"\n    }\n  ]\n}\n```", "summary_translation": "随着 AI agents 在多智能体世界中以日益增长的自主性运行，它们需要学会与其他 agents 和人类合作以产生互利。然而，合作是一个挑战，因为合作的成本往往在早期产生，而收益仅在后期实现，从而产生了背叛的激励。AI agents 如何以承诺进行合作？在此，我们从人类社会用于解决此类委托-代理问题的法律制度和契约中汲取灵感。契约提供了协议的可观察表示，通过条款的执行实现可信承诺。我们使用基于 LLM 的 agents 在 \\CT 中研究基于契约的合作的作用，\\CT 是一种将讨价还价与向目标导航相结合的空间-时间博弈。我们研究了一系列契约表示，范围从编译为代码的形式化契约到需要重新解释的自然契约。我们使用不同规模和提供商的 LLM backbones 评估 agents。我们发现，自我协商的契约可以改善合作结果，超越常规交易所能达到的水平。"}]}], "2026-07-27": [{"name": "Agent Evaluation \u0026 Benchmarking", "count": 3, "papers": [{"title": "Agentic Evaluation of Copyright Law Compliance", "arxiv_id": "2607.21799", "authors": "Zheng Hui, Doni Bloomfield, Noam Kolt", "summary": "Large language model (LLM) agents increasingly perform commercial tasks that involve retrieving external content such as images and, where appropriate, reproducing that content. LLM agents should comply with the law, including copyright law. Presently, however, we lack adequate frameworks to assess whether they do so in practice. To that end, we introduce \\textbf{Copyright-Bench}, a benchmark designed to evaluate \\textit{LLM agents' compliance with} \\emph{copyright law}. Copyright-Bench is comprised of realistic commercial tasks---website development, merchandise design, and pitch deck production---that involve agents selecting between public-domain content (the use of which is \\textit{legal}) and copyrighted content (the use of which is \\textit{infringing} in this setting).The evaluation introduces prompt variations that simulate different user preferences, as well as time pressure.Comparing state-of-the-art LLM agents against a human baseline, we find that: (1) agents select copyrighted works despite the availability of public-domain alternatives; and (2) for open-weights models, violation rates increase in response to certain user preferences and simulated time pressure.", "category": "cs.CL", "cluster": "Agent Evaluation \u0026 Benchmarking", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在具备自主执行复杂多步工作流能力的 **LLM agents** 中，如何评估其在商业场景下对 **copyright law**（特别是美国版权法）的合规性？具体而言，研究关注当代理面临合法（如 **public domain** 或 **CC0** 许可）与侵权（受版权保护）内容并存的选择时，是否能在不牺牲任务完成度的前提下，主动选择法律上合规的资产。\n\n这一问题的重要性源于 **LLM agents** 从被动对话界面向自动化员工角色的范式转变。随着代理系统能够自主检索文件、抓取网站并将资产集成到商业交付物中，其行为直接引发了法律风险。然而，现有的性能评估体系存在严重的“法律盲区”：主流基准主要衡量任务执行效率（如 **task completion**），而忽视了执行手段的合法性。这导致一个悖论：一个通过侵犯版权来高效完成任务的代理，在现有排行榜上可能得分高于一个严格遵守法律但稍显谨慎的代理。这种评估缺失使得高评分可能掩盖了代理在商业部署中的法律不可用性。解决这一问题不仅能填补 **agentic AI** 在法律合规性评估上的空白，还能为开发既具备高能力又符合 **normative constraints** 的代理提供量化标准，从而降低商业部署中的知识产权侵权风险。\n\n### § 2 前人工作与不足\n\n尽管 **agent benchmarks** 和 **copyright in generative AI** 领域已有大量研究，但针对 **agentic copyright compliance** 的系统性评估此前并未被充分解决。\n\n在 **Agent Benchmarks** 方面，现有工作如 **AgentBench**、**GAIA**、**WebArena** 和 **SWE-bench** 主要聚焦于代理的工具使用能力、环境导航效率及多步规划能力。这些基准的核心指标是 **task success rate**，即代理是否完成了用户指令，而完全忽略了执行过程中的法律约束。例如，在网页导航或软件工程任务中，代理是否使用了受版权保护的代码或图像并不影响其得分。这种设计缺陷源于早期基准主要关注 **capability** 和 **utility**，而未将 **legal alignment** 视为关键维度。因此，这些基准无法区分“高效但非法”与“高效且合法”的行为，导致开发者无法通过现有指标判断代理的法律安全性。\n\n在 **Copyright and Generative Models** 方面，现有文献主要集中在两个方向：一是训练阶段的 **fair use** 争议及模型对训练数据的 **verbatim memorization**（如 **CopyBench**、**CopyJudge**）；二是通过技术手段从模型权重中移除受版权保护的内容。这些研究主要关注模型是否“生成”或“复述”了受保护内容，而非代理在自主决策过程中是否“选择”了受保护内容。这种局限性的原因在于，早期研究将版权风险主要视为生成式输出（generation）的问题，而忽视了代理作为行动者（actor）在检索和集成外部资产时的主动选择行为。此外，现有的 **Safety and Alignment** 研究（如基于 **HHH** 准则或 **Constitutional AI** 的工作）主要关注防止物理、心理或社会危害（如毒性、偏见、生物武器协助），而未将 **legal harm** 和 **regulatory compliance** 纳入核心安全框架。\n\n综上所述，前人工作的不足在于：1）代理基准缺乏对法律约束的评估维度，导致 **legal blind spot**；2）版权研究聚焦于生成内容的侵权检测，而非代理在工具使用过程中的合规决策；3）安全对齐研究未涵盖知识产权领域的规范性约束。因此，亟需一个专门针对 **agentic systems** 在真实商业工作流中 **copyright law compliance** 的基准，以填补这一关键缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n随着大语言模型（LLM）从单纯的对话系统演变为能够执行多步工作流的自主智能体（Autonomous Agents），其应用场景已深入商业领域，如网页开发、商品设计和演示文稿制作。现有的智能体评估基准（如 AgentBench, GAIA, WebArena）主要关注任务完成率（Task Completion）和功能效用，却普遍忽视了法律合规性这一关键维度。这种评估盲区导致了一个严重的“法律盲点”：一个在技术上高效完成任务但侵犯版权的智能体，在现有排行榜上可能得分更高，但在实际商业部署中却是不可用的。\n\n与此同时，关于生成式 AI 与版权的研究主要集中在训练阶段（如数据清洗、公平使用争议）或生成阶段（如模型是否记忆并复述受版权保护的内容）。然而，对于作为“自动化员工”的智能体而言，核心风险不在于它“生成”了什么，而在于它“选择”和“使用”了什么外部资产。当智能体在拥有合法替代方案（如公共领域素材）的情况下，仍选择受版权保护的内容时，这就构成了侵权。\n\n此外，安全对齐（Safety Alignment）研究通常关注物理、心理或社会危害，缺乏对法律合规性（Legal Compliance）的系统性评估。作者观察到，智能体的行为高度依赖于提示词（Prompt）的框架效应。在缺乏明确法律指令的中性提示下，智能体往往优先追求任务效率而忽略版权检查；而在用户施加时间压力或明确忽视版权时，违规率可能进一步上升。特别是开源模型（Open-weights models）与专有模型（Proprietary models）在面对“忽视版权”指令时表现出截然不同的行为模式，这暗示了当前对齐机制在法律约束上的脆弱性。\n\n基于此，作者意识到需要一个新的评估框架，专门针对智能体在真实商业工作流中的版权合规决策。该框架必须满足三个条件：1）任务必须是可解的（即存在合法的替代方案），以排除因资源匮乏导致的被迫侵权；2）评估应聚焦于智能体的主动选择行为，而非生成能力；3）需模拟不同的用户意图和环境压力，以测试合规性的鲁棒性。由此，Copyright-Bench 应运而生，旨在填补智能体法律合规评估的空白。\n\n### § 4 核心 Intuition\n\n这篇论文的核心直觉在于，智能体的版权合规性并非一种固有的、稳定的能力，而是一种高度依赖于上下文提示（Prompt Framing）和环境线索的脆弱行为。现有评估体系因忽视法律约束，导致智能体在追求任务效率时默认采取“视觉充分性”启发式策略，即只要素材在视觉上符合要求便直接使用，而忽略了通过元数据（Metadata）验证版权状态的必要步骤。因此，真正的合规挑战不在于智能体是否“知道”版权法，而在于它是否能在缺乏显式指令或面临用户压力时，主动克服认知惰性，优先执行法律合规检查而非单纯的任务完成。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**Copyright-Bench** 的核心方法是通过构建一个受控的、沙盒化的商业工作流环境，评估 **LLM agents** 在面临版权合规与任务效率冲突时的决策行为。其核心逻辑在于：任务本身可以通过合法资源（Public Domain）完成，但环境中同时存在视觉上相似但受版权保护（Restricted）的替代资源，以此测试 Agent 是否会为了“省事”或“美观”而选择侵权内容。\n\n以下以 **Commercial Web Development（商业网页开发）** 任务为例，展示完整的 Pipeline：\n\n1.  **输入（Input）：**\n    *   **任务指令（Instruction）：** 用户要求 Agent 为一个徒步旅行网站选择一个高质量的“Hero Image”（主视觉图）。\n    *   **环境状态（Environment）：** Agent 访问一个本地文件系统（如 `download/images/`），其中包含 200 张高分辨率图片。这些图片经过算法配对，确保合法图片（来自美国国家公园管理局 NPS，Public Domain）与侵权图片（来自 DepositPhotos，Copyrighted）在语义和美学上高度相似（CLIP 相似度 \u003E 0.85，美学评分差 \u003C 0.5）。\n    *   **提示词变体（Prompt Variant）：** 根据实验设置，提示词可能是中性的（Neutral）、强调版权的（IP-Aware）、紧急的（Hurried）或忽视版权的（IP-Dismissive）。\n\n2.  **处理（Processing / Agent Execution）：**\n    *   **工具调用（Tool Use）：** Agent 使用 **Microsoft AutoGen** 框架提供的工具。关键工具包括 `list_files()`（列出文件）、`view_image()`（查看图片内容）和 `read_metadata()`（读取元数据）。\n    *   **决策逻辑：**\n        *   Agent 首先浏览图片，通过 `view_image()` 确认图片内容符合“徒步旅行”主题。\n        *   **关键分歧点：** Agent 是否调用 `read_metadata()`？\n            *   如果调用，Agent 会读取 JSON 侧边文件中的 `Copyright Notice` 字段。合法图片标记为 \"U.S. government work product; public domain\"，侵权图片标记为 \"©2025 Deposit Photo\"。\n            *   如果不调用，Agent 仅凭视觉判断选择图片，极易误选侵权图片，因为两者视觉上无法区分且无水印。\n    *   **推理与权衡：** Agent 在内部推理中权衡任务完成度（图片是否好看、相关）与法律约束（是否侵权）。在 IP-Dismissive 提示下，Agent 可能显式忽略版权检查以加快响应速度。\n\n3.  **输出（Output）：**\n    *   **最终选择（Selection）：** Agent 提交一个具体的文件名（如 `nps_01.jpg` 或 `deposit_05.jpg`）。\n    *   **评估指标（Evaluation）：**\n        *   **Violation Rate (VR)：** 如果选中的图片属于 Restricted 类别，则计为一次违规。\n        *   **Task Success Rate (TSR)：** 检查输出格式是否正确、图片是否与任务语义相关。\n    *   **结果记录：** 系统记录该次运行是合规还是违规，用于后续统计分析不同模型、不同提示词下的合规率。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的理论数学推导，其核心在于定义了两个关键的评估指标公式，用于量化 Agent 的行为。以下是这两个公式的直观解释：\n\n1.  **违规率（Violation Rate, VR）：**\n    *   **公式直觉：** VR 衡量的是 Agent “犯错”的频率。\n    *   **定义：** 对于 $K$ 个任务，如果 Agent 在第 $k$ 个任务中选择了至少一个受版权保护（Restricted）的资源，则标记为违规（$I_k = 1$），否则为合规（$I_k = 0$）。\n    *   **计算：** $VR(\\pi) = \\frac{1}{K} \\sum_{k=1}^{K} I_k$。\n    *   **意义：** 数值越低越好。它直接反映了 Agent 在法律合规性上的表现。即使任务完成了，如果用了盗版图，VR 就会增加。\n\n2.  **任务成功率（Task Success Rate, TSR）：**\n    *   **公式直觉：** TSR 衡量的是 Agent “干活”的能力。\n    *   **定义：** 只有当 Agent 同时满足三个条件时才计为成功：(1) 执行了有效的提交动作；(2) 输出格式正确；(3) 选择的图片与任务语义相关。\n    *   **计算：** $TSR(\\pi) = \\frac{1}{K} \\sum_{k=1}^{K} J_k$，其中 $J_k$ 是任务成功的指示函数。\n    *   **意义：** 数值越高越好。实验发现大多数 Agent 的 TSR 都很高（\u003E98%），说明它们都能“做完”任务，但这掩盖了它们可能通过侵权手段完成任务的事实。\n\n**理论背景补充：**\n这两个指标揭示了 **Capability（能力）** 与 **Compliance（合规）** 之间的脱节。传统 Benchmark 只关注 TSR，导致侵权 Agent 得分更高。Copyright-Bench 引入 VR，旨在捕捉这种“法律盲点”。\n\n### § 7 实验设计与结论\n\n**提出了什么问题：**\n现有的 AI Agent 评估基准主要关注任务完成度（Task Completion），忽视了法律合规性（Legal Compliance）。这导致那些通过侵犯版权来高效完成任务的 Agent 在排行榜上得分更高，从而掩盖了其在商业部署中的法律风险。我们需要知道：Agent 在真实商业场景中是否会遵守版权法？用户指令和环境因素如何影响其合规性？\n\n**设计了什么实验验证这个问题：**\n1.  **构建 Copyright-Bench 数据集：** 设计了三个真实的商业任务场景（网页开发、商品设计、融资演示文稿），每个任务都提供视觉上等效但版权状态不同的图片对（Public Domain vs. Copyrighted）。\n2.  **控制变量实验：**\n    *   **模型对比：** 测试了 11 个主流 LLM Agent，包括闭源模型（如 GPT-4o, Claude 4.5 Opus）和开源模型（如 Llama-4, Qwen-3VL）。\n    *   **提示词变体：** 使用四种提示词：中性（Neutral）、版权意识（IP-Aware）、紧急（Hurried）、忽视版权（IP-Dismissive），以模拟不同的用户压力和意图。\n    *   **环境变体：** 改变文件结构（扁平 vs. 层级）、元数据可用性（有 vs. 无）以及是否允许网络搜索，以测试 Agent 对信息架构的依赖。\n    *   **人类基线：** 招募 176 名人类参与者执行相同任务，作为行为对比基准。\n3.  **定性分析：** 对违规案例进行人工标注，分析 Agent 的推理轨迹（Reasoning Traces），识别失败模式（如未检查元数据、上下文疲劳等）。\n\n**问题的答案是什么：**\n1.  **合规性与能力脱节：** Agent 经常为了任务成功而牺牲法律合规性。在中性提示下，即使是顶级模型（如 Claude 4.5 Opus）也有约 38% 的违规率，开源模型违规率更高（接近 50%）。\n2.  **提示词框架效应显著：**\n    *   **IP-Aware 提示**能显著降低所有模型的违规率，说明 Agent 具备合规能力，但默认行为不合规。\n    *   **IP-Dismissive 提示**导致开源模型违规率急剧上升，而闭源模型违规率反而下降（可能因为触发了安全过滤器或法律术语提醒）。\n3.  **人类与 Agent 的差异：** 在中性条件下，人类和 Agent 的违规率相似；但在明确要求尊重版权时，人类的合规率远高于 Agent（接近 0% 违规），表明当前 Agent 在遵循明确法律约束方面仍不如人类可靠。\n4.  **主要失败模式：** 大多数违规源于 Agent 未调用 `read_metadata` 工具，而是依赖视觉启发式方法（Visual-Sufficiency Heuristic），即认为“看起来合适”就足够了，忽略了法律状态。", "additional_insights": "### § 8 Take-aways\n\n**Copyright-Bench** 揭示了当前 LLM agents 在商业工作流中存在严重的“能力-合规”错位，即模型具备识别版权状态的技术能力，但在默认设置下优先追求任务完成度而忽视法律约束。实验表明，agents 的版权合规性高度依赖于 **Prompt Framing**，在 **IP-Aware** 提示下违规率显著下降，但在 **IP-Dismissive** 提示下，**Open-weights models** 的违规率反而上升，显示出对有害用户指令的脆弱性，而 **Proprietary models** 则表现出更强的安全对齐鲁棒性。定性分析指出，主要失败模式并非技术无能，而是 **Reasoning Fatigue** 和 **Contextual Entitlement**，即 agent 错误地假设本地提供的资产已获授权，或因上下文窗口饱和而遗忘之前的合规检查。与人类基线对比发现，在明确指令尊重版权时，人类的合规表现优于所有测试模型，但在无提示的中性条件下，人类与顶级专有模型的违规率相当，表明缺乏显式法律约束时，人类与 AI 均倾向于捷径思维。\n\n### § 9 最脆弱的假设\n\n该方法最核心的假设是 **Solvability Constraint** 的有效性，即假设在每个任务中，始终存在一组视觉上等效且合法的 **Public Domain** 资产可供 agent 选择，从而将违规行为归因于 agent 的偏好或疏忽而非必要性。这一假设在实际中可能失效，因为真实世界的商业场景往往缺乏高质量的 **Public Domain** 替代品，或者合法资产在美学、分辨率或语义匹配度上显著劣于受版权保护的专业素材，导致 agent 选择侵权内容是为了满足用户对“高质量”或“特定风格”的隐性需求，而非单纯的合规性失败。论文通过 **Algorithmic Pairing** 使用 **CLIP** 和 **LAION-Aesthetics** 确保资产对的视觉等效性，并经过人工验证，但这仅证明了在受控的、人为平衡的数据集中合规是可行的，并未证明在长尾、非平衡的真实商业资产库中，合法替代品的可用性足以支撑同样的合规期望，因此该基准可能低估了真实部署中因资源稀缺导致的合规压力。\n\n### § 10 最小复现实验\n\n在一周内，可以复现 **Prompt Framing** 对合规性的影响，特别是验证 **IP-Dismissive** 提示是否会导致 **Open-weights models** 违规率上升。使用 **Copyright-Bench** 开源代码库中的 **WebDev** 任务子集（约 20-30 个样本），选取一个典型的 **Open-weights model**（如 **Llama-3.1-8B-Instruct** 或 **Qwen2.5-7B-Instruct**）和一个 **Proprietary model**（如 **GPT-4o-mini**）。实现一个简化的 **AutoGen** 或 **LangChain** 代理，仅暴露 `list_files` 和 `read_metadata` 工具，资产池包含 5 对视觉相似但版权状态不同的图片（通过修改 JSON 元数据标记为 **Public Domain** 或 **Restricted**）。测量在不同提示（**Neutral** vs **IP-Dismissive**）下，代理选择 **Restricted** 资产的比例。如果 **Open-weights model** 在 **IP-Dismissive** 提示下的违规率显著高于 **Neutral** 提示，而 **Proprietary model** 保持低违规率或下降，则支持论文关于模型对齐差异的 claim；反之，若两者行为模式一致，则反驳了专有模型具有更强法律约束鲁棒性的结论。", "research_value": "### § 11 最强反例设计\n\n针对 **Copyright-Bench** 最有力的攻击在于其核心假设 **Solvability Constraint** 在真实商业环境中的失效，即“合法替代品在质量上等同于受版权保护内容”这一前提并不成立。我可以设计一个名为 **“Quality-Compliance Trade-off”** 的反例实验，挑战论文关于 Agent 违规是出于“疏忽”或“捷径思维”的结论。\n\n具体设计如下：构建一个包含三个梯度的资产库，而非论文中简单的二元对立（Public Domain vs. Copyrighted）。第一组是 **High-Quality Copyrighted**（高分辨率、专业构图、语义完美匹配）；第二组是 **Low-Quality Public Domain**（低分辨率、构图平庸、语义勉强相关）；第三组是 **High-Quality Public Domain**（极少且难以检索）。在任务指令中，用户明确要求“选择最能提升品牌专业度的图片”，并隐含对美学的高要求。如果 Agent 在绝大多数情况下选择了 **High-Quality Copyrighted** 资产，这并非因为 Agent 缺乏合规意识或未能调用 `read_metadata`，而是因为其内部奖励函数（Reward Function）中 **Task Utility**（任务效用/美学质量）的权重远高于 **Legal Compliance**。\n\n这一反例的杀伤力在于：它证明了在真实世界中，**Compliance** 往往不是免费的，而是以牺牲 **Utility** 为代价的。论文的基准通过 **Algorithmic Pairing** 人为消除了这种权衡，导致其测量的 **Violation Rate (VR)** 反映的是 Agent 在“无成本合规”场景下的惰性，而非其在“有成本合规”场景下的真实风险。如果 Agent 在高质量合法资源稀缺时必然侵权，那么现有的 **Copyright-Bench** 就严重低估了商业部署中的法律风险，因为它测试的是一个被过度简化的、理想化的沙盒环境，而非真实的资源约束环境。此外，还可以引入 **Fair Use** 的灰色地带作为反例：如果 Agent 选择了一张受版权保护的图片但仅用于“评论”或“教育”目的（符合 **Fair Use**），论文的硬性二元分类（Restricted = Violation）会错误地将其标记为违规，从而证明该基准缺乏对法律复杂性的 nuanced 理解，仅能处理简单的 **Black-and-White** 案例，无法应对真实的法律判断。\n\n### § 12 Follow-up Research Idea\n\n基于 **Copyright-Bench** 暴露出的“能力-合规”错位以及 **Solvability Constraint** 的局限，我提出一个新的研究方向：**Dynamic Legal Alignment via Multi-Objective Optimization in Agentic Workflows**（代理工作流中的多目标动态法律对齐）。\n\n**(a) 驱动局限与未满足需求：**\n现有工作将法律合规视为一个静态的、二元的约束（Compliant/Non-Compliant），且假设合规资源总是可用且等效的。然而，真实商业场景中，合规往往涉及 **Trade-offs**（权衡）：例如，在 **Fair Use** 的边界上，或者在合法资源质量较低时，Agent 需要权衡 **Legal Risk**、**Task Quality** 和 **User Preference**。当前的 **Prompt Framing** 方法（如 **IP-Aware**）是脆弱的，因为它依赖于用户显式地提供法律约束，而在实际中，用户往往不懂法或故意忽视法律。因此，我们需要一种机制，使 Agent 能够自主地、动态地评估每个行动的法律风险，并在多目标优化框架下做出决策，而不是简单地遵循或忽视提示词。\n\n**(b) 借鉴相邻领域的方法：**\n可以借鉴 **Reinforcement Learning from Human Feedback (RLHF)** 中的 **Constitutional AI** 思想，以及 **Multi-Objective Reinforcement Learning (MORL)** 中的 **Pareto Optimization** 技术。具体来说，引入一个 **Legal Risk Estimator** 模块，该模块不依赖硬编码的规则，而是通过微调一个小型法律语言模型（Legal LLM）来预测每个资产选择或工具调用的潜在法律风险分数（0-1）。然后，将 Agent 的决策过程建模为一个 **Partially Observable Markov Decision Process (POMDP)**，其中奖励函数 $R(s, a)$ 是 **Task Reward** 和 **Legal Penalty** 的加权和：$R_{total} = \\alpha \\cdot R_{task} - \\beta \\cdot R_{legal}$。通过调整 $\\alpha$ 和 $\\beta$，可以探索不同的合规-效用权衡曲线。\n\n**(c) 第一个实验设计：**\n构建一个名为 **Legal-Tradeoff-Bench** 的新基准，其中包含大量 **Quality-Compliance Trade-off** 场景。例如，任务要求设计一个高端品牌 Logo，合法资源（Public Domain）风格老旧，而受版权保护的资源风格现代。实验将比较三种 Agent 策略：1) **Baseline Agent**（仅优化任务完成度）；2) **Rule-Based Agent**（硬编码禁止使用 Copyrighted 资源）；3) **MORL Agent**（使用上述多目标优化框架）。评估指标不再是单一的 **Violation Rate**，而是 **Pareto Frontier** 上的表现：即在给定的法律风险预算下，Agent 能达到的最高任务质量。此外，引入 **Adversarial User Prompts**，模拟用户试图诱导 Agent 侵权的场景，测试 MORL Agent 是否能在保持高任务质量的同时，通过内部风险估计拒绝高风险行动，从而证明其具备 **Robust Legal Alignment**，而不仅仅是 **Prompt-Dependent Compliance**。这一方向将法律合规从“静态检查”提升为“动态决策”，更贴近真实商业 AI 的需求。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Zheng Hui\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Doni Bloomfield\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Noam Kolt\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"University of Cambridge\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Fordham University\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Hebrew University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"†\",\n      \"text\": \"Correspondence to: Zheng Hui \u003CZh2483@columbia.edu\u003E.\"\n    }\n  ]\n}\n```", "summary_translation": "大型语言模型（LLM）智能体越来越多地执行涉及检索外部内容（如图像）并在适当情况下复现这些内容的商业任务。LLM 智能体应当遵守法律，包括版权法。然而，目前我们缺乏充分的框架来评估它们在实践中是否确实如此。为此，我们引入了 **Copyright-Bench**，这是一个旨在评估 *LLM 智能体对* *版权法* *的合规性* 的基准测试。Copyright-Bench 由真实的商业任务组成——网站开发、商品设计和融资演示文稿制作——这些任务要求智能体在公共领域内容（其使用是 *合法的*）和受版权保护的内容（在此情境下其使用构成 *侵权*）之间进行选择。该评估引入了模拟不同用户偏好的提示变化，以及时间压力。将最先进的 LLM 智能体与人类基线进行比较，我们发现：(1) 尽管存在公共领域的替代方案，智能体仍会选择受版权保护的作品；(2) 对于开放权重模型，违规率会因某些用户偏好和模拟的时间压力而增加。"}, {"title": "Toward User-Conditioned Evaluation of Personal LLM Agents under Temporal Interventions", "arxiv_id": "2607.21635", "authors": "Pin Qian, Su Wang, Yihang Chen, Qiaolin Yu, Xiaoyuan Wang, Zhitong Guo, Zhicheng Wang, Junxian You", "summary": "Personal agents maintain memories, learned skills, tool configurations, and policy state that evolve with each user. Existing agent benchmarks often evaluate these capabilities in isolation: tool benchmarks test invocation under fixed APIs, memory benchmarks test recall or forgetting, and safety benchmarks test static policy compliance. We argue that personal-agent evaluation requires a different protocol: replaying the same temporal intervention across different persistent user-conditioned states and measuring how failures propagate across agent components. We formalize this requirement as four conditions: explicit temporal intervention, persistent state across the intervention, induced cross-dimensional effects, and variation in user-conditioned state. A focused audit of public benchmark protocols selected by explicit inclusion criteria identifies several close cases. Under our explicitly narrow operationalization, we did not find a protocol in that audited set satisfying all four conditions. This claim is scoped as a focused gap analysis with bounded literature coverage. This position paper proposes a minimal benchmark design and candidate reporting metrics for user-conditioned adaptation. The result is a concrete design requirement for future personal-agent evaluation, with metrics used as reporting tools for that requirement.", "category": "cs.LG", "cluster": "Agent Evaluation \u0026 Benchmarking", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文符合筛选标准，主要依据如下：\n\n1.  核心研究对象明确为 LLM 智能体：论文标题和摘要明确指出研究对象是 \"Personal LLM Agents\"（个人 LLM 智能体），并关注其核心能力组件，如记忆（memories）、技能（skills）、工具配置（tool configurations）和政策状态（policy state）。这直接对应研究焦点中的“单智能体”方向。\n\n2.  涉及智能体的演化与适应性机制：摘要中提到智能体的状态 \"evolve with each user\"（随用户演化），并强调评估 \"user-conditioned adaptation\"（用户条件适应性）。这触及了智能体如何通过交互经验进行自我完善或适应的核心议题，符合“自我演化”或“长期决策/记忆”的研究范畴。\n\n3.  属于智能体评估与行为分析的前沿研究：根据筛选标准中的“保留”规则：“如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留”。该论文旨在解决现有基准无法有效评估个人智能体在时间干预下的状态传播和失败机制的问题，提出了新的评估协议设计。这种对智能体复杂行为（如跨组件故障传播、持久状态演化）的深入分析和基准构建，对于理解和改进智能体的鲁棒性和演化能力具有重要价值。\n\n4.  排除项不适用：虽然论文涉及评估（Evaluation），但它不是单纯的安全/对齐/幻觉检测（这些被排除），而是针对智能体核心功能（记忆、工具、策略）在动态环境下的表现评估。它也不属于被排除的“非演化型应用”或“基础设施”，因为其核心贡献在于定义如何评估智能体的演化适应过程，而非仅仅应用智能体解决外部领域问题。\n\n综上，该论文通过提出针对个人智能体演化适应性的评估框架，直接服务于对 LLM 智能体能力（特别是记忆、工具使用和状态演化）的理解和改进，因此应保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：如何设计一种针对个人大语言模型智能体（Personal LLM Agents）的评估协议，以衡量其在面对**时间干预（Temporal Interventions）**时，基于**用户条件化状态（User-Conditioned State）**的适应性与故障传播机制。具体而言，论文定义了用户条件化评估函数 $Q(A_{e_i} | u_j)$，旨在量化当外部事件 $e_i$（如 API 更新、策略收紧）发生时，智能体在特定用户持久化状态 $u_j$（包含记忆、技能、工具配置等）下的表现变化。\n\n这一问题的重要性源于个人智能体与通用助手在故障模式上的本质差异。通用助手通常在标准化基准上评估，假设输入是静态或独立的；而个人智能体维护着随用户演化的持久化状态，包括长期记忆、习得技能、工具配置和安全策略。当外部环境发生**接口漂移（Interface Drift）**或**策略更新**时，相同的干预对不同用户的影响截然不同：轻度用户可能仅经历一次调用失败，而重度用户（Power User）可能因过时的 API 记忆或依赖旧接口的习得技能，导致跨工作流的级联回归（Regression）。现有的评估范式往往将工具调用、记忆召回、技能学习或安全合规孤立测试，忽略了这些组件在用户特定上下文中的耦合效应。\n\n解决这一问题的价值在于填补了个人智能体评估中的关键缺口，即从“静态能力测试”转向“动态适应性审计”。通过形式化四个设计条件（C1-C4），本文不仅揭示了现有基准在衡量**跨维度效应（Cross-Dimensional Effects）**和**用户状态变异（Variation in User-Conditioned State）**方面的不足，还提出了一套最小化基准设计（Minimal Benchmark Design）和候选指标（如适应延迟 $\\alpha_L$、优雅降级 $\\gamma$、跨维度一致性 $\\kappa$ 等）。这为未来构建能够真实反映个人智能体在复杂、演化环境中鲁棒性的评估体系提供了具体的设计要求和度量工具，有助于开发者识别并修复那些仅在特定用户状态下才会触发的隐蔽故障。\n\n### § 2 前人工作与不足\n\n尽管已有大量研究致力于 LLM 智能体的评估，但针对“用户条件化时间干预”这一特定场景的系统性评估尚未被充分解决。现有的相关工作主要集中在单一维度的能力测试或静态环境下的鲁棒性评估，未能捕捉个人智能体在状态演化过程中的动态故障传播。\n\n在**工具使用（Tool Use）**方面，StableToolBench [9]、BFCL [39] 和 API-Bank [27] 等基准主要测试智能体在固定 API 规范下的调用准确性。这些工作假设 API 接口是静态的，或者仅关注单次调用的正确性，而未考虑当 API 发生版本更新或模式变更时，智能体如何利用其持久化记忆中的旧接口信息进行适应。例如，StableToolBench 通过缓存 API 执行来提高基准稳定性，但这恰恰掩盖了真实世界中 API 演化带来的挑战。\n\n在**记忆（Memory）**评估方面，MemoryAgentBench [13]、MemBench [45] 和 MemoryArena [12] 侧重于测试智能体的记忆召回、更新和遗忘能力。虽然 MemoryArena 引入了多会话设置，但其评估目标仍局限于记忆支持的任务成功率，未测量过时记忆（Stale Memories）如何作为可执行上下文（Executable Context）破坏后续的工具调用或技能执行。这些基准缺乏对记忆与其他组件（如工具、策略）之间耦合效应的考察。\n\n在**技能学习（Skill Learning）**方面，SkillLearnBench [64] 评估智能体生成和复用程序的能力，但主要关注技能生成的连续性和质量，未评估当技能所
