自身 rollout 已记录的 negative log-likelihood 对每一步进行评分，然后使用一个随该评分增长的 per-step weight 融合这两个 advantages，使得 gradient 在 above-average NLL 时将更多权重置于 fine-grained signal 上，而在低于平均 NLL 时将更多权重置于 episode-level signal 上。我们为所实现的 mixture 推导出了 exact risk decomposition，并证明在 positive directional alignment 下，sufficiently small modulation 优于 fixed mixing。一个单独的 conditional result 使用 expected NLL 界定了 local action-value variation，而 error-projection analysis 则刻画了 mixing 何时能在 scalar uncertainty reweighting 之外增加价值。在 ALFWorld 和 WebShop 上，GACA 在 1.5B 和 7B scales 上的 task success 均优于 GRPO 和 GiGPO。"}, {"title": "From Collaboration to Capability: Internalizing Routed LLM Experts into Compact Reasoners", "arxiv_id": "2609.12578", "authors": "Frank Nie, Shuyao Wang, Ethan B. Liu", "summary": "A compact controller can coordinate stronger experts by selecting whom to consult, formulating requests, and integrating their responses. We study whether learning from both the controller's decisions and the experts' reasoning and code improves its generation after expert removal. We introduce \\textsc{Rivet} for \\emph{collaboration internalization}: expert-augmented reinforcement learning applies a shared outcome signal to controller decisions and returned expert spans, and verified trajectory internalization consolidates complete successful interactions through format-aware supervised training. The deployed controller generates reasoning, code, and interaction structure with local Python execution and no external LLM. Across seven competition-mathematics benchmarks, RIVET-1.7B and RIVET-4B achieve average accuracies of $28.25\\%$ and $44.16\\%$; Stage~II improves RIVET-4B's accuracy after expert removal by $6.49$ points, and GPQA-Diamond results provide evidence of generalization to scientific reasoning. Ablations show gains from ordinary trajectory supervision and additional format weighting, supporting the effectiveness of training on the content and structure of verified collaborations.", "category": "cs.AI", "cluster": "Agent Training \u0026 Adaptation", "tags": ["cs.AI"], "filter_reason": "该论文的核心贡献是提出一种将多专家协作内化到紧凑推理器中的方法（Rivet），通过专家增强的强化学习和格式感知的监督训练，使模型在移除外部专家后仍能保持甚至提升推理能力。这直接涉及“自我演化”机制——模型从协作轨迹中学习并改进自身能力，属于“LLMs Improving LLMs”和“Self-Improving”的前沿方向。同时，论文的研究对象明确是智能体（控制器作为智能体，协调专家），且涉及多智能体协作的内化，而非仅讨论拓扑或通信协议。因此，它完全符合我的研究焦点：构建和改进LLM智能体，特别是自我演化机制。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：一个 compact controller（小型语言模型）在通过 routing 协调更强的 LLM experts 完成任务后，能否通过学习其自身的控制决策以及 experts 返回的 reasoning 和 code，在移除外部 experts 的情况下，独立生成高质量的推理与代码？这一问题被作者定义为 collaboration internalization。其重要性在于，当前小型模型虽能通过调用外部大模型显著提升任务表现，但在实际部署中长期依赖外部 LLM 会带来高昂的计算成本、延迟以及系统复杂性。如果 controller 能够将协作过程中从 experts 获得的推理能力和代码生成能力内化到自身参数中，就能在无外部 LLM 的部署环境下独立运行，同时保持接近协作时的性能水平。这对于在资源受限场景下部署具备 tool-integrated reasoning 能力的高效模型具有显著的实际价值。\n\n### § 2 前人工作与不足\n\n该问题此前未被直接解决。现有研究主要分为三条路线，各自存在关键不足。第一，Tool-integrated reasoning 和 agentic reinforcement learning 方法（如 ReTool、ToRL、TRICE）主要训练 policy 与功能性工具（如 Python 执行器）的交互，但未将其他 LLMs 视为可选择的任务解决监督来源，因此无法内化 expert 的推理内容。第二，Model routing 和 multi-agent orchestration 系统（如 RouteLLM、Router-R1、ToolOrchestra）虽然能选择和组合不同 LLMs 以优化推理质量或成本，但它们将外部模型视为黑盒工具：Router-R1 在 RL 训练中明确将 routed-model 的输出从 training loss 中 mask 掉，ToolOrchestra 仅通过 outcome 和 efficiency rewards 协调模型，两者均未将 expert 返回的 reasoning 和 code 纳入 controller 的直接训练目标，导致 controller 只学会了\"何时调用谁\"，却未学会\"如何生成专家的推理\"。第三，Distillation 方法（如 Agent Distillation、On-policy distillation、SOD）虽能转移推理能力，但通常使用单一 teacher 或独立生成的轨迹进行训练，未在 controller 自身求解过程中产生的协作轨迹上同时训练 control decisions 和 expert content 的顺序关系。根本原因在于，同时更新协作交互的两侧面临两个未被前人明确界定和解决的挑战：一是需要为外部生成的 spans 分配学习信号，而传统 RL 仅更新 controller tokens；二是需要将请求、expert 响应和后续决策作为完整交互进行整合，而现有 distillation 方法缺乏对这种 sequential relationship 的结构化监督。", "core_insight": "### § 3 重建作者的思考路径\n\n在 RIVET 之前，利用外部 LLM experts 增强小型 controller 模型的推理能力通常依赖于 model routing 或 multi-agent orchestration。这些方法在 inference 阶段虽然有效，但一旦移除外部 experts，controller 的性能会急剧下降，因为它只学会了“何时以及向谁求助”，却没有学会“如何像 expert 那样推理和写代码”。传统的 agent distillation 或 on-policy distillation 虽然能转移推理行为，但往往只关注 teacher 生成的轨迹，而忽略了 controller 在交互过程中的主动决策（如选择 expert、生成请求）与 expert 返回内容之间的序列依赖关系。\n\n作者观察到，一个 collaborative trajectory 实际上包含两个紧密相连的监督信号源：controller 的 control decisions 和 expert 返回的 expert content。如果在 RL 训练中只更新 controller tokens，那么 expert 返回的高质量推理和代码就游离于训练目标之外，造成信息浪费；同时，稀疏的 final-answer reward 在长轨迹上容易导致 policy entropy collapse。为了解决这一问题，作者想到在 GRPO 阶段，将同一个 trajectory outcome advantage 同时分配给 controller tokens 和 expert tokens。这不仅让 controller 学习路由和决策，还通过 advantage-weighted online distillation 将 expert 的推理和代码能力转移给 controller。\n\n然而，仅靠 RL 阶段的更新还不足以在部署时完全摆脱外部 experts，因为 rollout 仍然依赖外部模型。为了实现真正的 internalization，作者进一步提出在 RL 阶段后冻结 policy，收集那些成功、完整且符合协议的交互轨迹。随后，通过 format-aware supervised fine-tuning，将这些轨迹中的请求、expert 的推理与代码以及后续的 controller 决策全部作为 controller 的预测目标，而将 Python 执行结果保留为环境观察。通过对 tool-call 结构施加额外权重，确保 controller 能准确生成交互格式。这样，部署时 controller 就能在同一个 decoding stream 中自主生成推理、代码和交互结构，仅需 local Python 执行，彻底摆脱对外部 LLM 的依赖。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 是：不要只让 controller 学习“如何调用 expert”，还要让它学习“expert 是如何思考和写代码的”。通过在 RL 阶段将 outcome reward 同时分配给 controller 的决策和 expert 的输出，并在 SFT 阶段将完整的成功交互（包括 expert 的推理和代码）作为 controller 的预测目标，就能将 expert 的能力内化到 controller 自身。这样，部署时移除外部 expert 后，controller 依然能独立生成高质量的推理和代码，仅依赖本地 Python 执行。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n Problem x\n    │\n    ▼\n Controller πθ ──calls──► Frozen Experts E (3 models)\n    │                           │\n    ▼                           │\n Collaborative Trajectories ◄──┘\n    │\n    ├─ Stage I: Expert-augmented GRPO\n    │  shared advantage A_i on ctrl+expert tokens\n    │      │\n    │      ▼\n    │   C_RL ──freeze──► Collect verified traces D_ver\n    │                         │\n    │                    Stage II: Format-aware SFT\n    │                    L = L_CE + λ_fmt·L_fmt\n    │                         │\n    │                         ▼\n    │                      C_int (no external LLM)\n    │                         │\n    │                    Local Python only\n    │                         ▼\n    │                    Final Answer\n    │\n    └─ C_RL + Experts = collaborative mode (reference)\n```\n\n**Stage I：Expert-augmented GRPO（§3.3）**\n\n输入为问题 $x$，controller $\\pi_\\theta$ 从 base model $M_0$ 初始化。在 rollout 过程中，controller 可以独立推理，也可以从统一工具集 $U$ 中调用工具——每个 frozen expert 暴露两个工具：`think`（返回推理）和 `code_interpreter`（请求 expert 生成代码并在 sandbox 中执行后返回反馈）。三个 frozen expert 分别是 Qwen3.5-9B、Qwen3-8B 和 Qwen2.5-Coder-7B-Instruct。每个问题采样 $G=8$ 条轨迹，轨迹结束时给出基于最终答案正确性的 sparse reward。关键创新在于：计算 group-relative advantage $A_i$ 后，该标量 advantage 被广播到轨迹中的所有 trainable token——不仅包括 controller 生成的 token（mask $m^{ctrl}$），也包括 expert 返回的推理和代码 token（mask $m^{exp}$），而 Python 执行输出作为环境观测被 mask 掉。对 expert-origin token，其 teacher-forced likelihood 是在 pre-update controller 下计算的，而非在 frozen expert 下，因此这一项本质上是 advantage-weighted online distillation，而非对 expert policy 的 importance sampling。输出为 Stage-I controller $C_{RL}$。此阶段同时从成功和失败轨迹中学习。\n\n**Stage II：Verified Trajectory Internalization（§3.4）**\n\n输入为冻结的 $C_{RL}$ 和训练集。冻结 $C_{RL}$ 后，对每个训练问题用相同的工具集生成 8 条协作轨迹，经过严格过滤：仅保留完整、协议合规、最终答案正确且可解析、Python 执行有效、无严重重复或退化调用循环的轨迹。当多条轨迹满足条件时，优先选择工具调用更少的候选。去重和人工审查后，每个问题最多保留 2 条轨迹，最终得到 $D_{ver}$（4B 版 12,000 条，1.7B 版 10,000 条）。训练时，supervised sequence 将 controller 的请求、expert 返回的推理和代码、以及最终答案都作为 prediction target（$m^{sft}=1$），而问题 token 和 Python 执行输出作为上下文（$m^{sft}=0$）。缺失或自由格式的 instruction 被替换为固定的 tool-specific 模板。Loss 由两部分组成：masked next-token cross-entropy $L_{CE}$ 和对 tool-call format token（分隔符、工具标识符、必需参数字段）施加额外权重的 $L_{fmt}$，组合为 $L = L_{CE} + \\lambda_{fmt} \\cdot L_{fmt}$。输出为 internalized controller $C_{int}$。\n\n**推理与评测（§3.4, §4.1）**\n\n两种推理模式：collaborative mode 中 $C_{RL}$ 使用 expert-backed 工具，作为 expert-assisted 参考；internalized mode 中 $C_{int}$ 不调用任何外部 LLM，仅由本地 Python sandbox 执行 controller 自身生成的代码，这是主要部署设置。expert-removal diagnostic 则在 $C_{RL}$ 上禁用外部 expert 但保留本地 Python，与 $C_{int}$ 对比以衡量 Stage II 的增益。评测覆盖七个竞赛数学 benchmark（AIME 2024–2026、HMMT 2025、BeyondAIME、IMO-AnswerBench、APEX 2025）和 GPQA-Diamond 科学推理 benchmark。\n\n### § 6 核心数学推导\n\n论文的核心数学推导集中在 Stage I 的 Expert-augmented GRPO 和 Stage II 的 format-aware SFT 损失函数上。\n\n**Outcome-based reward（Eq. 1）。** 对每个问题采样 $G$ 条轨迹 $\\{\\tau_i\\}_{i=1}^G$，对轨迹 $\\tau_i$ 的最终答案 $\\hat{y}_i$ 给出 reward $R_i$。这是一个 0/1 sparse reward——仅当最终答案正确时为正，没有对工具调用的 intrinsic bonus。Intuition：工具调用本身不获得直接奖励，其价值只能通过整条轨迹的最终结果来体现，这避免了 controller 学会无意义地频繁调用工具。\n\n**Group-relative advantage（Eq. 2）。** $A_i = (R_i - \\mu_G) / \\sigma_G$，其中 $\\mu_G$ 和 $\\sigma_G$ 是同一问题 $G$ 条轨迹 reward 的均值和标准差。Intuition：不使用绝对 reward 值，而是衡量某条轨迹相对于同组其他轨迹的优劣。如果一个问题大部分轨迹都答对，单条正确轨迹的 advantage 接近零；如果大部分都答错，一条正确轨迹获得大正 advantage。这自然地分配 credit，无需 value function。\n\n**Dual-clipped surrogate 与 Stage I loss（Eq. 3–6）。** 使用 PPO 的 clipped surrogate $s(\\rho, A) = \\min(\\rho A, \\text{clip}(\\rho, 1-\\epsilon, 1+\\epsilon)A)$，并加上 dual-clip 机制（参数 $c=3$）防止 advantage 为负时 ratio 过大导致的不稳定更新。关键设计在训练 mask：$m^{train}_{i,t} = m^{ctrl}_{i,t} + m^{exp}_{i,t}$，即 controller token 和 expert token 都参与 loss，而 Python 执行输出被排除。Loss 对所有 trainable token 做 token-mean normalization，不附加 KL 项。对 expert-origin token，分母中的 teacher-forced likelihood 是在 pre-update controller 下计算的——这意味着 loss 项 $\\rho \\cdot A$ 中的 $\\rho = \\pi_\\theta(y_{i,t}|h_{i,t}) / \\pi_{\\theta_{old}}(y_{i,t}|h_{i,t})$ 衡量的是 controller 对 expert 生成内容的似然变化，而非 expert policy 的 importance sampling。Intuition：当一条轨迹最终成功（$A_i \u003E 0$），controller 被鼓励提高生成类似 expert 推理和代码的概率；当失败（$A_i \u003C 0$），则降低。这实现了在 controller 自身参数空间中的 advantage-weighted distillation。\n\n**Stage II format-aware loss（Eq. 7–9）。** $L_{CE}$ 是标准 masked next-token cross-entropy，对 controller span、tool-call 结构、expert 推理/代码和最终答案计算 loss，对问题 token 和执行输出 mask 掉。$L_{fmt}$ 对 tool-call format token 的位置集合 $\\Omega_{fmt}$ 额外加权。组合 loss $L = L_{CE} + \\lambda_{fmt} \\cdot L_{fmt}$。Intuition：普通 SFT 让 controller 学会生成完整交互序列的内容，而 format weighting 确保工具调用的结构标记（如 JSON 分隔符、工具名、参数字段）被准确生成——这些 token 虽少但对维持 Python 执行接口至关重要。$\\lambda_{fmt}=0.5$ 在实验中表现最优。\n\n### § 7 实验设计与结论\n\n论文围绕四个核心问题设计实验：\n\n**问题 1：移除外部 expert 后，controller 性能下降多少？Stage II 能否恢复？** 设计了 expert-removal diagnostic：将 Stage-I controller $C_{RL}$ 在禁用外部 expert 但保留本地 Python 的条件下评测，与 Stage-II controller $C_{int}$ 在相同接口下对比。结果显示 $C_{RL}$ 移除 expert 后平均数学准确率从 46.22% 降至 37.67%，存在 8.55 个百分点的差距；Stage II 将其提升至 44.16%，恢复了 6.49 个百分点。这表明 supervised internalization 能有效将协作中获得的推理和代码能力内化到独立生成中。\n\n**问题 2：Stage II 的哪些训练选择有效？** 设计了三组 ablation：普通 SFT（$\\lambda_{fmt}=0$）将准确率从 37.67% 提升至 40.90%（+3.23），加入 format weighting $\\lambda_{fmt}=0.5$ 进一步提升至 44.16%（+3.26），而更强的 $\\lambda_{fmt}=1.0$ 降至 42.64%。此外，一个全程不使用外部 expert 的变体仅达 38.16%，比完整 RIVET 低 6.00 个百分点。结论是：对完整成功交互的轨迹监督和对 tool-call 结构的适度加权都贡献了显著增益，且 expert 协作阶段产生的训练信号不可替代。另一个 ablation 比较了包含/不包含 expert-span loss 的 controller entropy 变化，显示包含 expert-span 更新能维持更高的 policy entropy，缓解过早收敛。\n\n**问题 3：协作策略如何影响最终内化性能？** 比较了三种 Stage-I expert 选择策略：learned routing（RIVET 默认）、仅用 Qwen3.5-9B、随机选择。每种策略各自完成两阶段训练后评测。Learned routing 在 Stage I 协作模式下达 46.22%，Stage II 内化后达 44.16%，均优于另两种策略（Qwen3.5-9B only 为 44.41%/42.08%，random 为 41.57%/39.03%）。结论是异构 expert 的学习性路由不仅提升了协作时性能，也通过更优的 Stage-II 初始化和训练轨迹提升了内化后性能。\n\n**问题 4：内化能力是否泛化到竞赛数学之外？** 在 GPQA-Diamond 科学推理 benchmark 上评测。RIVET-1.7B 达 44.95%，在 1.7–3B 组排名第一；RIVET-4B 达 61.62%，在 4–32B 组与 AEPO-8B 并列第一，且超过 ReTool-32B（46.97%）。两个模型均在无外部 LLM、仅本地 Python 的条件下取得这些结果，提供了从竞赛数学训练到科学推理的泛化证据。\n\n此外，论文还设计了 instance-level 的 retention/internalization 分析（Table 6），衡量 Stage II 保留了多少 Stage I 已能独立解决的案例（74.68–84.55%），以及恢复了多少原本依赖 expert 才能解决的案例（46.43–55.56%）；routing 分布分析（Figure 4）显示 controller 在不同 benchmark 上呈现差异化的 expert 和工具选择模式；call-budget 分析（Figure 5）表明 GPQA-Diamond 上一次 expert 调用即获得大部分增益，而 AIME 系列在更高预算下持续受益。", "additional_insights": "### § 8 Take-aways\nRIVET 提出了一种两阶段框架，将外部 LLM experts 的推理与代码生成能力内化到 compact controller 中。Stage I 采用 expert-augmented GRPO，将共享的 outcome advantage 同时分配给 controller decisions 和返回的 expert spans，使 controller 在 RL 过程中直接从专家输出中学习。Stage II 通过 verified trajectory internalization，利用 format-aware SFT 将完整且正确的协作轨迹整合进 controller，其中专家的 reasoning 和 code 成为预测目标，而 Python 执行结果保留为环境观察。部署时，内化后的 controller 无需外部 LLM，仅依靠本地 Python sandbox 即可独立生成推理、代码及交互结构。实验表明，RIVET-4B 在七个竞赛数学基准上达到 44.16% 的平均准确率，Stage II 在移除专家后带来了 6.49 个百分点的提升，并在 GPQA-Diamond 上证明了向科学推理的泛化能力。\n\n### § 9 最脆弱的假设\nRIVET 的核心假设是：compact controller 能够通过在协作轨迹上训练，直接内化并独立复现 heterogeneous experts 在特定上下文中生成的 reasoning 和 code，即使两者之间存在显著的 capability gap。如果这个假设不成立，controller 在部署时可能只是学会了专家的交互格式和表面模式，而无法生成真正有效的推理步骤，导致内化后的准确率大幅下降。在实际中，当 expert model（如 Qwen3.5-9B）的能力远超 controller（如 Qwen3-1.7B）时，直接将专家 token 纳入 student model 的 loss 计算可能面临分布不匹配和表征瓶颈，使得 student 难以吸收超出其容量的知识。论文提供的证据是 Stage II SFT 带来了 6.49 个百分点的准确率提升，且 ablation study 显示包含 expert spans 的训练维持了更高的 policy entropy。然而，论文缺少对内化后生成内容深度的定性分析，未证明 controller 是真正掌握了推理逻辑还是依赖于记忆化的模式匹配，也未探讨当使用能力差距更大的专家（如 70B 模型）时该假设是否依然有效。\n\n### § 10 最小复现实验\n在一周时间内，可以设计一个最小复现实验来验证 Stage II 中 format-aware SFT 对内化效果的贡献。使用 ToRL 数据集的一个子集（如 2000 个问题），利用一个较强的开源模型（如 Qwen2.5-7B-Instruct）作为 expert 生成带有 Python 工具调用的协作轨迹，筛选出答案正确且执行有效的轨迹作为训练数据。选择 Qwen3-1.7B 作为 base model，直接在这些筛选出的轨迹上进行 SFT，跳过计算成本高昂的 Stage I GRPO。实现两组对比：一组使用普通的 cross-entropy loss（$\\lambda_{fmt} = 0$），另一组使用 RIVET 的 format-aware loss（$\\lambda_{fmt} = 0.5$）。在 AIME 2024 测试集上评估两个模型在无外部 LLM、仅使用本地 Python sandbox 条件下的 Mean@8 准确率。如果 format-aware SFT 模型的准确率显著高于普通 SFT 模型，则支持论文关于 format weighting 能有效提升内化后独立推理能力的 claim；如果两者表现无异或普通 SFT 更好，则反驳该 claim。", "research_value": "### § 11 最强反例设计\n\n对 RIVET 最有力的攻击应直指其核心假设：compact controller 能够真正内化并独立复现远超其容量的大模型推理逻辑。我设计了一个基于“极端 capability gap 与分布外组合泛化”的反例实验，旨在证明 Stage II 带来的 6.49 个百分点提升并非源于“推理能力的内化”，而是源于对 expert 输出模式的“表面化模板记忆”。具体而言，将原论文中 7B-9B 级别的 experts 替换为一个 70B 级别的强推理模型（如 Qwen2.5-72B-Instruct），该模型倾向于生成高度抽象、多步嵌套的复杂 Python 代码来解决竞赛数学题。保持 controller 为 1.7B，完整执行 Stage I 和 Stage II。在 AIME 2024 上评估后，引入一个“结构扰动测试集”：对原测试题进行微小的语义保持变换（例如将物理情境从“两车相向”改为“两船相向”，但底层方程结构完全一致），使得正确解答需要重新组合而非直接套用先前的代码模板。如果 RIVET 的内化机制真正掌握了推理逻辑，controller 应能在结构扰动测试集上保持与原测试集相近的准确率；然而，如果 controller 仅是学会了根据特定问题特征映射到记忆中的 expert 代码骨架，它在扰动集上的性能将出现断崖式下跌。进一步的理论论证在于分析 controller 生成 token 的 semantic entropy：如果内化的是表面模式，当面临超出其表征瓶颈的 70B 模型代码时，controller 在关键计算步骤上的 token 级别不确定性将异常升高，且其生成的代码在抽象语法树（AST）结构上将与 expert 的高度同质化，但在变量状态追踪上出现隐性错误。这一反例直接挑战了论文的结论，提供了具体的替代解释：所谓的“内化”可能只是小型模型在容量极限下对高频成功轨迹的格式化拟合，而非对推理能力的真正吸收。\n\n### § 12 Follow-up Research Idea\n\n基于 RIVET 仅在过滤后的成功轨迹上训练、从而丧失了错误恢复能力的局限，我提出一个全新的研究方向：**Failure-Aware Internalization: Learning Self-Correction Dynamics from Expert Search Trees**。该想法的驱动需求在于，真实世界中的独立部署不仅需要生成正确的推理，更需要在本地代码执行失败或逻辑陷入死胡同时具备 self-correction 能力；RIVET 的 Stage II 严格过滤了退化或失败的轨迹，导致 internalized controller 只学会了“完美执行计划”，却从未学习 expert 在面对复杂问题时如何进行探索、试错与策略回溯。\n\n为解决这一问题，可以借鉴相邻领域 **Monte Carlo Tree Search (MCTS)** 中的 backpropagation 机制与 **Process Reward Models (PRMs)** 的细粒度评估逻辑。不再将 expert 视为单向的 token 生成器，而是将其建模为一个在推理状态空间中进行搜索的 agent。具体而言，在 Stage I 的协作轨迹收集阶段，不仅记录最终成功的轨迹，还刻意保留 expert 在 Python 执行报错后进行的代码修正、逻辑重构等“状态转移”片段。在 Stage II 的 internalization 阶段，设计一个基于状态转移的 contrastive learning 目标：将 expert 的“错误状态 -\u003E 修正状态”对作为正样本，将“错误状态 -\u003E 退化/重复状态”对作为负样本，训练 controller 在 latent space 中预测并生成修正动作，而非仅仅进行 next-token prediction。\n\n第一个实验将设计一个“错误注入评测协议”。使用 RIVET 的 1.7B controller 作为 baseline，与我的 Failure-Aware Internalization 模型对比。在推理阶段，当 controller 生成第一版代码后，人为注入一个语法或轻微逻辑错误（模拟环境噪声或自身失误），观察模型能否在后续生成中识别并修正。预期结果是，RIVET 模型由于只见过完美轨迹，遇到执行报错后会陷入重复生成或直接放弃；而我的模型由于内化了 expert 的搜索与回溯动态，能够利用本地 Python 的报错信息进行有效的 self-correction，从而在具有干扰的数学推理任务上展现出显著更高的鲁棒性。这一提议彻底改变了 RIVET 的训练范式，将目标从“模仿专家的正确答案”转移到“内化专家的问题求解动态过程”。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Frank Nie\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Shuyao Wang\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Ethan B. Liu\", \"affiliations\": [1], \"markers\": [\"*\", \"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Shandong University\"},\n    {\"id\": 2, \"name\": \"Zhejiang University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "紧凑的 controller 可以通过选择咨询对象、制定请求并整合其响应来协调更强的 experts。我们研究了在移除 experts 之后，同时从 controller 的决策以及 experts 的推理和代码中进行学习，是否能提升其生成能力。我们引入了 Rivet 用于 collaboration internalization：expert-augmented reinforcement learning 将共享的 outcome signal 应用于 controller 决策和返回的 expert spans，而 verified trajectory internalization 通过 format-aware supervised training 巩固完整的成功交互。部署的 controller 生成推理、代码和交互结构，具有本地 Python 执行能力且无需外部 LLM。在七个竞赛数学 benchmarks 上，RIVET-1.7B 和 RIVET-4B 取得了 28.25% 和 44.16% 的平均准确率；Stage II 在移除 experts 后将 RIVET-4B 的准确率提升了 6.49 个百分点，并且 GPQA-Diamond 的结果为向科学推理的泛化提供了证据。Ablations 显示了来自 ordinary trajectory supervision 和 additional format weighting 的增益，支持了在已验证协作的内容和结构上进行训练的有效性。"}]}, {"name": "Memory \u0026 Experience Management", "count": 3, "papers": [{"title": "LifeMem: Enabling Lifelong Experience Reuse for LLM Agents", "arxiv_id": "2609.12655", "authors": "Yuli Qiu, Yutong Li, Wei Su, Zeming Liu, Wanxiang Che, Heyan Huang, Haifeng Wang, Yuang Guo", "summary": "Large language model agents are expected to continuously adapt to new tasks and environments over their lifetime by reusing past experience. However, existing memory-based agents struggle to transfer reusable experience across environments and suffer from catastrophic forgetting as experience accumulated. To address these challenges, we propose LifeMem, a lifelong learning framework that enables agents to transfer knowledge across multiple environments. During learning, LifeMem clusters accumulated interaction trajectories based on underlying workflows to extract reusable skills. When solving a new task at inference time, the agent recalls relevant skills and trajectories to guide actions. To validate our method, we conduct experiments across 10 environments and over 13k tasks with 2k newly annotated interaction trajectories. Results show that LifeMem enables effective experience reuse in lifelong learning, achieving both reduced forgetting on learned tasks and superior cross-task transfer. Further analysis reveals that task streaming impacts learning, while consolidating structurally similar trajectories within memory boosts performance.", "category": "cs.CL", "cluster": "Memory \u0026 Experience Management", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文研究的核心问题是：LLM agents 在 lifelong learning 场景下，如何跨异构环境持续积累并复用经验，同时避免 catastrophic forgetting。具体而言，在 inter-environment setting 中，agent 依次遇到来自不同环境的任务序列，这些环境具有不同的 action space 和 observation space（如 embodied action、tool utilization、web search、data analysis、web browsing），agent 需要将过去交互中积累的 trajectories 转化为可迁移的经验，用于指导新任务的求解，同时不丧失对先前已学任务的记忆。这一问题的重要性在于，AGI 的实现要求 autonomous agents 能在其生命周期内持续适应多样化和不断演变的环境，而无需依赖环境特定的重新设计。现有 LLM agents 虽然在单一环境内已展现出较强的 task-solving 能力，但跨环境泛化仍是一个未解决的瓶颈。解决该问题能够带来两方面的价值：一是减少 agent 在学习新任务后对旧任务的遗忘，二是实现对未见领域（unseen domains）的有效 zero-shot cross-task transfer，从而为 agent 部署后的持续进化提供实用的 memory 管理与经验复用机制。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决。现有工作可分为两大类，各自存在结构性局限。**Internal-memory-based methods**（如 Yao et al., 2023; Qiao and Mahdavi, 2024）通过在预定义环境的 trajectories 上 fine-tune 模型来内化经验，但这种方式将知识固化于模型参数中，不仅限制了跨环境泛化，还带来高昂的训练成本，难以适应持续增长的任务流。**External-memory-based methods**（如 Xiang et al., 2024）维护外部经验数据库并检索相关 trajectories 以支持 in-context learning，但在跨异构环境场景下暴露出两个关键缺陷。第一类是 **trajectory-only retrieval** 方法，以 Synapse（Zheng et al., 2024）为代表，它抽象当前状态并检索语义相关的 raw trajectories 作为 in-context exemplars。然而，不同环境的 action space 往往不兼容，直接检索 raw trajectory 无法桥接这种 mismatch，导致检索到的经验无法有效指导动作生成；更严重的是，随着数据库增长，语义检索的准确性下降，早期环境的经验被淹没，引发 catastrophic forgetting。第二类是 **generic trajectory abstraction** 方法，以 ExpeL（Zhao et al., 2024a）和 AutoSkill（Yang et al., 2026）为代表，它们试图从 raw trajectories 中蒸馏 high-level skills 或 insights 以指导后续执行。但这些方法在无组织的全局经验池上直接进行抽象，不相关环境的 trajectories 被混入同一蒸馏过程，引入严重的跨环境噪声，导致生成的 skills 过于粗糙、缺乏代表性，无法精确指导新任务。Hermes 同样存在这一问题。这些不足的根本原因在于：先前方法要么仅依赖表面语义相似性组织经验，要么在无结构化的经验池上进行全局抽象，均未按底层 workflow 结构对 trajectories 进行聚类。而跨环境场景下，不同环境虽 action space 不同，却可能共享相同的底层执行逻辑——如果不先按 workflow 将结构相似的 trajectories 归入同一 cluster 再进行局部 skill 蒸馏，就无法避免跨环境噪声污染，也无法生成既具代表性又可迁移的 skills。", "core_insight": "### § 3 重建作者的思考路径\n\nLifelong learning 的核心诉求是让 LLM agent 在生命周期内持续适应新环境，而 inter-environment setting 带来的根本困难在于：不同环境拥有不同的 action space 和 observation space，使得在一个环境中积累的交互轨迹无法直接迁移到另一个环境。研究者首先观察到，现有的 external-memory-based 方法依赖语义相似性检索原始轨迹，但这种检索在跨环境场景下会失效——语义相似的轨迹可能来自完全不同的 action space，导致检索结果不仅无法指导行动，反而引入干扰。更严重的是，随着经验库不断增长，检索准确性持续下降，早期环境的经验被淹没，引发 catastrophic forgetting。\n\n面对这一问题，一个自然的思路是将原始轨迹抽象为 high-level skills，使其脱离具体的 action space 细节。然而，已有的 skill abstraction 方法（如 AutoSkill、ExpeL）在无组织的全局 memory pool 上直接提取技能，不同环境的异构轨迹被混合在一起，导致蒸馏出的技能被跨环境噪声污染，丧失代表性和可迁移性。研究者由此意识到，问题的症结不在于是否抽象，而在于在什么结构上抽象：如果能在蒸馏之前先将轨迹按底层执行逻辑组织起来，就能在每个结构化分组内部获得干净的、一致的技能。\n\n进一步的经验观察支持了这一判断：不同环境的任务虽然在表面语义和 action space 上差异巨大，但底层 workflow 往往共享相似的执行模式——例如 web search 和 fact verification 都遵循\"检索-定位-提取-回答\"的逻辑链条，embodied action 和 tool utilization 都涉及\"感知-规划-操作\"的循环。这意味着，如果按 workflow 而非语义相似性来组织 memory，就能将跨环境但逻辑同构的轨迹归入同一 cluster，从而在 cluster 内部蒸馏出真正 environment-invariant 的技能。同时，为了防止 cluster 随经验积累而变得过于异构，还需要一种自适应机制来监测 cluster 内部的结构多样性，并在必要时进行细粒度分区。\n\n最后，在推理阶段，研究者认识到单纯依赖抽象技能或单纯依赖原始轨迹都不够：技能提供跨环境的逻辑指导，但缺乏具体环境下的行为格式示范；原始轨迹提供精确的 action grounding，但无法跨环境迁移。因此，将两者结合——检索同环境的轨迹作为 behavioral exemplar，同时激活关联 cluster 的抽象技能作为 macro-guidance——才能同时实现精确的行为对齐和鲁棒的知识迁移。\n\n### § 4 核心 Intuition\n\n跨环境经验重用失败的根源在于：不同环境的 action space 不兼容，但底层执行逻辑是共享的。因此，不应在无组织的 memory pool 上直接检索或全局抽象，而应先将轨迹按底层 workflow 聚类，再在每个结构化 cluster 内局部蒸馏出 environment-invariant 的技能。推理时同时激活同环境的原始轨迹（提供 action format 示范）和跨环境的抽象技能（提供执行逻辑指导），从而既避免了 action space 干扰，又实现了知识迁移。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n                   LifeMem Pipeline\n================================================\n\n[初始 Trajectories]\n      │  LLM识别workflow模式\n      ▼\n┌───────────┐      ┌──────────────────┐\n│Memory Init│─────▶│Workflow Clusters │\n│  (§4.1)   │      │  {c1,...,cM}     │\n└───────────┘      └────────┬─────────┘\n                            │\n[新 Trajectory ξ]           │\n      │ top-k检索+LLM判定   │\n      ▼                     │\n┌───────────┐  加入/新建    │\n│Workflow   │──cluster─────▶│\n│Clustering │               ▼\n│  (§4.2)   │    ┌────────────────┐\n└─────┬─────┘    │Adaptive        │\n      │n\u003EL\u0026R\u003Cτ   │Partitioning    │\n      │触发分裂   └───────┬────────┘\n      ▼                  │\n┌───────────┐  LLM抽象   │\n│Skill      │◀───────────┘\n│Distillation│──▶Skills {s1,...,sM}\n│  (§4.2)   │   (env-invariant)\n└───────────┘\n\n══════════ Inference (§4.3) ══════════\n\n[新 Task T]\n   │\n   ├──▶top-k检索──▶Env-aligned\n   │                Trajectories\n   │                     │\n   │                     ▼\n   │              关联 Clusters Cξ\n   │                     │\n   │                     ▼\n   │              激活 Skills Sξ\n   │                     │\n   ▼                     ▼\n┌──────────────────────────┐\n│LLM Agent                 │──▶Action\n│输入: Trajs + Skills      │\n└──────────────────────────┘\n```\n\nLifeMem 的 pipeline 分为三个阶段：**Memory Initialization**、**Memory Evolution** 和 **Inference with Memory**。\n\n**Memory Initialization（§4.1）**：输入为一组初始 trajectories $\\{\\xi_0, \\ldots, \\xi_N\\}$，LLM 识别它们共有的 workflow 模式，将其划分为若干 workflow-level clusters $C = \\{c_1, \\ldots, c_M\\}$，并为每个 cluster 生成一句简洁描述 $d_i$，构成初始 memory。此处的关键设计是按底层 action workflow 而非表面 semantic similarity 进行分区，避免跨环境检索干扰。\n\n**Memory Evolution（§4.2）**：当新 trajectory $\\xi$ 到达时，系统首先从 memory 中检索 top-$k$ 相关 trajectories 并收集其所属 clusters $C_\\xi$，然后由 LLM 判定 $\\xi$ 应加入某个现有 cluster 还是创建新 cluster。随着经验积累，单个 cluster 可能涵盖异质行为，此时引入基于 Mean Resultant Length (MRL) 的 geometric diversity constraint：当 cluster 内 trajectory 数量 $n \u003E L$ 且方向集中度 $R \u003C \\tau_{mrl}$ 时，将该 cluster 分裂为更细粒度的 sub-clusters。在 cluster 结构稳定后，**Skill Distillation** 模块对每个 cluster $c_i$ 通过 LLM prompting 函数 $f(\\cdot)$ 抽象出 environment-invariant 的高层 skill $s_i$，捕获共享约束、逻辑依赖和泛化执行原则，与底层环境细节解耦。最终 memory 形成层次结构 $M = \\{(c_i, d_i, s_i)\\}$。\n\n**Inference with Memory（§4.3）**：面对新 task，系统采用 dual-tier 机制：第一层从 memory 中检索 top-$k$ 条与当前环境 $E$ 对齐的 historical trajectories，提供具体的 environment-aligned 操作范例；第二层根据这些 trajectories 关联的 workflow clusters 激活对应的 abstracted skills，提供跨环境可迁移的执行逻辑。Agent 最终以 $M_{act} = (\\{\\xi^{[j]}\\}_{j=0}^{k-1}, S_\\xi)$ 为条件生成 action $a_t \\sim P_\\theta(\\cdot | o_t, g, M_{act})$，同时受益于精确的行为示范和可迁移的 skill 抽象。\n\n### § 6 核心数学推导\n\n本文的核心数学内容集中在 §4.2 的 **Adaptive Partitioning** 机制中，使用了方向统计学中的 Mean Resultant Length (MRL)。\n\n**背景与 intuition**：当一个 workflow cluster 积累了大量 trajectories 后，可能开始包含异质行为，导致 skill 抽象的代表性下降。需要一个量化指标来判断 cluster 内部是否已经过于\"分散\"，从而决定是否需要分裂。MRL 正是衡量一组单位向量集中程度的经典统计量。\n\n**具体推导**：给定 cluster $c$ 包含 $n$ 条 trajectories，首先将每条 trajectory 的 embedding 归一化为单位向量 $\\mathbf{x}_i$（$\\|\\mathbf{x}_i\\| = 1$）。方向集中度定义为所有单位向量的均值向量的模长：\n\n$$R = \\left\\| \\frac{1}{n} \\sum_{i=1}^{n} \\mathbf{x}_i \\right\\|$$\n\n**Intuition**：如果 cluster 内所有 trajectories 的 embedding 方向高度一致（即 workflow 高度相似），则向量求和后几乎不抵消，$R \\to 1$，表示高冗余；如果 trajectories 行为多样、embedding 方向分散，则向量求和时大量抵消，$R$ 值降低，表示行为多样性高。\n\n**分裂条件**：当且仅当同时满足两个约束时才触发分裂——体量阈值 $n \u003E L$（cluster 足够大）和多样性约束 $R \u003C \\tau_{mrl}$（行为确实发散）。这确保分裂仅在真实行为分歧时发生，避免过度碎片化。论文实验中取 $L = 50$，$\\tau_{mrl} = 0.95$。\n\n此外，memory 的形式化定义为 $M = \\{(c_i, d_i, s_i)\\}$，其中 skill 映射 $s_i = f(c_i)$ 通过 LLM prompting 实现；推理时的 activated memory 为 $M_{act} = (\\{\\xi^{[j]}\\}_{j=0}^{k-1}, S_\\xi)$，action 生成服从 $a_t \\sim P_\\theta(\\cdot | o_t, g, M_{act})$。这些是功能性定义而非推导型公式。\n\n### § 7 实验设计与结论\n\n**问题 1：LifeMem 在跨环境 lifelong learning 中是否优于现有 memory-based 方法？**\n论文在 5 类 agent 场景（embodied action、tool utilization、web search、data analysis、web browsing）的 10 个环境、13k+ tasks 上，以 GPT-4o-mini、Deepseek-v3.2-exp、Qwen3-32b 为 backbone，对比 ReAct（memory-free）、Synapse（trajectory 检索）、ExpeL（insight 蒸馏）、AutoSkill（global skill 蒸馏）四个 baseline，评测 Overall Performance 和 Backward Transfer 两个指标。**答案**：LifeMem 在所有模型上均取得最高 Overall Performance（如 GPT-4o-mini 从 28.84 提升至 44.13），且是唯一在所有模型上实现正向 Backward Transfer 的方法（+5.66、+3.11、+6.68），表明其既减少了 catastrophic forgetting 又实现了有效的 cross-task transfer。\n\n**问题 2：Trajectories 和 skills 各自对性能的贡献如何？**\n通过 ablation study（Table 3），分别测试仅提供 trajectories、仅提供 skills、以及两者联合的配置。**答案**：两者均提供正向贡献——trajectories 提供原始操作格式示范，skills 提供宏观执行指导，联合配置最优。即使仅用 GPT-4o-mini 抽取 skills，LifeMem 仍大幅超过 baseline，且超过 GPT-4.1 的 vanilla 性能，证明核心增益来自经验复用机制而非更强的 LLM。\n\n**问题 3：LifeMem 能否实现 zero-shot 跨任务迁移？**\n在两个场景中测试：同一环境下的未见任务形式（HotpotQA 环境评测 FEVER 事实验证）和相似任务形式下的未见环境（$\\tau$-bench retail 迁移至 airline）。**答案**：LifeMem 在两个场景上均实现显著提升（FEVER 上 GPT-4o-mini 提升 22.5%，airline 上提升 18.8%），而 baseline 方法因 semantic shift 或 domain gap 出现性能下降甚至负迁移，验证了 environment-invariant skills 的跨域泛化能力。\n\n**问题 4：Task streaming 策略如何影响经验复用？**\n对比 similarity（同类任务顺序学习）、random（完全打乱）、buffer-based（随机流经小型缓存稳定后提交）三种 task stream。**答案**：Similarity stream 最优，因为结构相似任务的连续学习减少了检索干扰；但 buffer-based 策略可恢复 random stream 下大部分性能退化（GPT-4o-mini 恢复 44.7%，Deepseek 恢复 64.9%），表明 LifeMem 在非结构化真实场景中仍具鲁棒性。\n\n**问题 5：仅升级检索组件能否弥补 baseline 与 LifeMem 的差距？**\n在 Synapse 上替换更强的 embedding 模型和加入 re-ranking 机制。**答案**：升级 embedding 仅带来边际提升，re-ranking 反而严重损害性能，因为现成 re-ranking 模型优化的是文本相关性而非 agent trajectory 间的行为逻辑对齐。这验证了 LifeMem 层次化 skill 抽象的架构必要性——问题不在检索精度，而在 memory 的组织方式。", "additional_insights": "### § 8 Take-aways\n\nLifeMem 针对 LLM agent 在 inter-environment lifelong learning 中的 experience reuse 问题，提出将异构环境的 interaction trajectory 按 underlying workflow 聚类而非按 surface semantic similarity 检索，再从每个 workflow cluster 中局部蒸馏 environment-invariant skill，形成 trajectory + skill 的双层 memory 结构。该方法的核心洞察是：跨环境经验复用的瓶颈不在 retrieval 精度（Table 7 证明换更强 embedding 或加 re-ranking 反而有害），而在于 memory 的组织方式——unstructured memory pool 会导致 cross-environment noise 污染蒸馏出的 skill。实验在 10 个环境、13k+ 任务上验证，LifeMem 在三个 backbone 上均取得最优 overall performance 和唯一为正的 backward transfer 值，说明结构化 memory 同时缓解了 catastrophic forgetting 并促进了正向迁移。Ablation（Table 3）揭示 env-aligned trajectory 提供动作格式示范，abstracted skill 提供宏观策略指导，两者互补缺一不可；且用弱模型（GPT-4o-mini）蒸馏 skill 仍能显著超越强模型（GPT-4.1）的 vanilla 表现，说明增益来自经验复用机制本身而非蒸馏模型的能力。Zero-shot transfer 实验（Table 4）表明 skill 层在 unseen task formulation 和 unseen environment 下均有效，而 raw trajectory retrieval 在这些场景下反而有害。Task stream 分析（Table 5）指出 similarity-based 顺序最优，但 buffer-based 策略可在 random stream 下恢复 44.7%–64.9% 的性能退化，提供了实际部署的鲁棒性保障。\n\n### § 9 最脆弱的假设\n\nLifeMem 最核心且失败代价最大的假设是：LLM 能够可靠地按 underlying functional workflow 而非 surface semantic similarity 将来自异构环境的 trajectory 聚类到正确的 cluster 中。整个框架的 skill distillation、cross-environment transfer、forgetting 缓解全部依赖这一步聚类结果的正确性——如果 LLM 将语义相似但 workflow 不同的 trajectory 归入同一 cluster，蒸馏出的 skill 就会被 cross-environment noise 污染，方法直接退化为论文所批评的 \"generic trajectory abstraction\" 基线。\n\n这个假设在实际中可能不成立的原因有三：第一，LLM 在判断 workflow alignment 时需要理解 trajectory 的 action-observation 序列背后的功能逻辑，但不同环境的 action space 和 observation format 差异巨大（如 AlfWorld 的离散文本动作 vs. Mind2Web 的 HTML 元素操作），LLM 可能退化为依赖 task description 的语义相似度来判断；第二，论文用 GPT-5-mini 做聚类分配（§5.4），这是一个轻量模型，其推理能力是否足以胜任跨域 workflow 识别存疑；第三，当两个环境的 workflow 部分重叠但存在关键差异时（例如 HotpotQA 和 FEVER 都用 Wikipedia search 但验证逻辑不同），硬性归入同一 cluster 会丢失关键区分。\n\n论文提供的证据是 Appendix I 中人工评估的 91% workflow purity，但这个证据有三个缺口：仅基于 sampled cluster 而非全量评估；annotator 判断 \"dominant workflow\" 本身带有主观性；且实验环境是研究者精心挑选的 5 类场景，可能天然存在 workflow 重叠，不能代表真实部署中环境高度异构的情形。论文缺少对聚类错误如何传播到下游 skill 质量和最终任务表现的 sensitivity analysis。\n\n### § 10 最小复现实验\n\n在一周时间内，可以验证 LifeMem 最关键的 claim：**按 workflow 聚类后蒸馏的 skill 比直接从 unorganized memory pool 全局蒸馏的 skill 更具代表性和迁移性**。具体方案如下：\n\n选取两个环境——HotpotQA（web search）和 APIBank（tool utilization），各收集 50 条成功 trajectory（可用 GPT-4o-mini 在 ReAct 框架下生成）。然后构建三种 skill 来源：（A）AutoSkill 式全局蒸馏，将全部 100 条 trajectory 喂给 LLM 提取 3–5 条 skill；（B）LifeMem 式分簇蒸馏，先用 LLM 将 trajectory 按 workflow 分为 2–4 个 cluster，再从每个 cluster 分别蒸馏 skill；（C）随机分簇蒸馏作为 control，将 trajectory 随机分成相同数量的 cluster 后分别蒸馏。在 FEVER（unseen task formulation，与 HotpotQA 共享 Wikipedia 环境但任务逻辑不同）上用 GPT-4o-mini 测试三种 skill 的 zero-shot transfer 效果，每组 50 个 test instance。\n\n测量指标为 Exact Match accuracy。如果 B 显著优于 A 和 C，则支持 LifeMem 的核心 claim——结构化聚类是 skill 质量的关键，而非蒸馏过程本身。如果 A 与 B 无显著差异，则说明在环境数量少时聚类收益有限，LifeMem 的优势可能需要更多环境才能体现。如果 C 与 B 相当甚至更优，则直接反驳聚类需基于 workflow alignment 的假设，说明任意分簇即可获得蒸馏收益。这个实验无需实现 memory evolution、MRL 约束或 FAISS 检索，只需 LLM prompt 调用和简单统计检验，可在 3–4 天内完成数据收集和实验。", "research_value": "### § 11 最强反例设计\n\n要构建对 LifeMem 最致命的反例，我会设计一个包含**同构 action space 但异构 decision logic** 的跨环境实验场景，直接攻击其最脆弱的假设：LLM 能力基于 functional workflow 而非 surface semantic similarity 进行聚类。具体而言，选取两个 Web browsing 环境（如 WebArena 中的电商购物与航班预订），它们共享完全一致的 action space（click, type, scroll）和高度相似的 observation format（HTML DOM 树），但底层决策逻辑完全不同：电商购物需要比价和筛选规格，而航班预订需要权衡时间中转。在这个场景下，由于 trajectories 的 action-observation 序列在文本和结构上高度相似，LLM 在 Workflow Clustering 阶段会不可避免地将两者归入同一 cluster。更严重的是，由于两者的 embedding 方向高度一致，Adaptive Partitioning 中的 Mean Resultant Length (MRL) 约束会测得极高的 $R$ 值（趋近于 1），从而判定该 cluster 内部高度集中，**永远不会触发分裂机制**。这导致后续的 Skill Distillation 在这个混合了异质决策逻辑的 cluster 上进行，蒸馏出的 environment-invariant skill 将沦为无信息量的通用操作（如“使用搜索栏并点击按钮”），完全丧失对特定任务求解的指导能力。如果在这个反例实验中观察到 LifeMem 的性能退化到与 ExpeL 等 generic trajectory abstraction 基线无异，甚至因引入误导性 skill 而低于纯 trajectory retrieval 的 Synapse 基线，就能提供强有力的替代解释：LifeMem 在原论文 5 类场景中的成功，并非源于其声称的“按底层 workflow 聚类”，而是因为原论文选取的环境（embodied action、tool utilization 等）在 action space 和 observation format 上天然存在巨大的表面差异，使得聚类实际上是被 surface format 驱动的，掩盖了其在同构异质环境下的结构性缺陷。\n\n### § 12 Follow-up Research Idea\n\n基于 LifeMem 依赖 LLM 语义聚类且 skill 静态蒸馏的局限，我提出一个全新的研究方向：**基于因果工作流图的组合式技能发现**。这个想法的驱动力在于：LifeMem 将“workflow”作为一个模糊的语言学概念交由 LLM 隐式判断，导致其在同构异质场景下失效，且蒸馏出的自然语言 skill 无法保证在未见环境中的精确执行。为解决这一未满足的需求，我们可以借鉴图论中的**子图同构**与因果发现方法，将经验复用从“语义匹配”重构为“结构因果匹配”。具体而言，不再使用 LLM 进行文本聚类，而是将每条 trajectory 转化为一个**有向无环图 (DAG)**，节点表示环境状态或工具返回的 observation，边表示带前置条件的 action。随后，利用图神经网络 (GNN) 和子图同构算法，在异构环境的 trajectories 中提取频繁出现的、具有因果依赖的公共子图作为“可执行技能原语”。这些原语不是自然语言描述，而是带有状态前置条件和动作接口的参数化图结构。\n\n这个提议与已有工作（如 ExpeL 或 LifeMem）的根本区别在于，它彻底剥离了对 LLM 模糊推理能力的依赖，将跨环境迁移的粒度从粗粒度的整条 trajectory 或静态文本 skill，细化为严格基于因果逻辑的图结构匹配，从而能够精确区分“表面相似但因果逻辑不同”的 workflows。第一个实验将设计一个“同构异质”验证场景：在两个共享相同 API 接口但决策树不同的 tool utilization 环境中（例如，一个按价格排序筛选股票，一个按市值排序筛选加密货币），对比传统 LLM 聚类蒸馏与因果图同构提取的 skill 在 zero-shot transfer 下的表现。我们预期，当任务要求 agent 在未见环境中执行需要特定因果依赖的多步操作时，基于图结构匹配的 skill 原语能显著降低 action hallucination，而 LifeMem 式的自然语言 skill 将因无法约束执行逻辑而频繁失败。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yuli Qiu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yutong Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Wei Su\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zeming Liu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Wanxiang Che\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Heyan Huang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Haifeng Wang\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Yuhang Guo\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Beijing Institute of Technology\"},\n    {\"id\": 2, \"name\": \"Beihang University\"},\n    {\"id\": 3, \"name\": \"Harbin Institute of Technology\"},\n    {\"id\": 4, \"name\": \"Baidu Inc.\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"†\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "大语言模型 agents 预期将在其生命周期内通过重用过去的经验来持续适应新任务和环境。然而，现有的 memory-based agents 难以跨环境迁移可重用的经验，并且随着经验的积累会遭受 catastrophic forgetting。为了解决这些挑战，我们提出了 LifeMem，这是一个 lifelong learning 框架，使 agents 能够跨多个环境迁移知识。在学习过程中，LifeMem 基于底层 workflows 对积累的 interaction trajectories 进行聚类，以提取可重用的 skills。在 inference time 解决新任务时，agent 会回忆相关的 skills 和 trajectories 以指导行动。为了验证我们的方法，我们在 10 个环境和超过 13k 个任务上进行了实验，并使用了 2k 个新标注的 interaction trajectories。结果表明，LifeMem 在 lifelong learning 中实现了有效的经验重用，既减少了对已学任务的 forgetting，又实现了更优的 cross-task transfer。进一步分析表明，task streaming 会影响学习，而在 memory 中整合结构相似的 trajectories 能够提升性能。"}, {"title": "CueMem: Cue-Guided Context Reconstruction for Long-Term Conversational Memory", "arxiv_id": "2609.12354", "authors": "Changjian Wang, Rongzhen Li, Weili Guan, Shuming Shi, Quan Lu, Ning Jiang", "summary": "Long-term conversational agents must answer user queries by recalling information from extended dialogue histories, yet directly using the full history is costly and often unreliable, while compressed memory units may lose fine-grained evidence needed for question answering. Motivated by the reconstructive view of autobiographical memory, we propose CueMem, a cue-guided framework that treats extracted memory records as retrieval cues rather than self-contained evidence and reconstructs query-relevant dialogue context from their source turns. During memory construction, CueMem extracts fine-grained memory cues from dialogue turns and links each cue to its source turn. At query time, it retrieves query-relevant cues, maps them to source-turn anchors, and expands from these anchors over a turn graph that captures temporal proximity and semantic relatedness, reconstructing a compact evidence context from the original dialogue for LLM answer generation. Experiments on LoCoMo and LongMemEval show that CueMem consistently outperforms representative long-term memory baselines. Further analyses show that graph-based context reconstruction helps recover supporting dialogue evidence while reducing query-time input tokens and latency compared with the full-history LLM setting. These results highlight retrieval cues as an effective alternative to self-contained memory evidence for long-term conversational question answering.", "category": "cs.CL", "cluster": "Memory \u0026 Experience Management", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-60 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了CueMem，一个针对长期对话智能体的记忆重构框架。论文明确以“长期对话智能体”为研究对象，聚焦于改进智能体的核心能力之一——记忆机制。它通过将记忆记录作为检索线索而非自包含证据，并在查询时重构相关的对话上下文，有效解决了长期记忆中信息丢失和成本过高的问题。这完全符合筛选标准中第一步“保留”规则所明确的“研究对象明确是 LLM Agents”且“结论直接帮助理解或改进智能体能力”的要求，同时也命中了第二步正面指标中的“Memory”和“Long-Horizon Decision-Making”。虽然摘要中提到了利用“turn graph”来捕捉对话轮次的时间和语义关系，但这仅是作为记忆上下文重构的辅助数据结构，并非研究知识图谱、图神经网络或图推理等被明确排除的图核心技术。因此，该论文属于单智能体记忆机制的前沿研究，符合本次筛选范围。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的研究问题是：在长期对话场景中，对话代理如何高效且准确地从极长的对话历史中回忆并利用信息来回答用户查询。这个问题至关重要，因为在真实世界的人机交互中，对话往往是多轮且长程的，而直接将完整的交互历史输入给 Large Language Models (LLMs) 会面临 context length 限制、噪声干扰、“lost-in-the-middle”现象以及高昂的 inference latency 等严重瓶颈。解决这一问题能够使对话代理在不受上下文窗口物理限制的情况下，维持连贯的个性化交互并精准回应用户基于历史语境的复杂提问，从而推动 conversational agents 向真正具备长期记忆能力的实用系统迈进。\n\n### § 2 前人工作与不足\n在 CueMem 之前，长期对话记忆问题已被广泛探索，主要方法包括 Naive RAG 以及更结构化的记忆系统如 MemoryOS、Mem0、A-Mem 和 LightMem。这些 prior systems 通常通过分段、压缩、摘要或显著信息提取，将对话历史转化为可检索的 memory units，并以此作为生成回答的直接上下文。然而，这些方法存在根本性缺陷：它们将检索到的 memory units 视为 self-contained evidence，但这些压缩或去语境化的片段往往会丢失问答所需的细粒节证据。更关键的是，基于向量的索引倾向于将多个语义信号纠缠在单一的 dense representation 中（例如将目的地、预算和酒店偏好合并为一个“旅行规划”记忆单元），当用户查询仅针对某一细粒度属性时，相关语义信号被混合信号稀释，导致检索精度大幅下降。这种设计未能采纳认知科学中关于自传体记忆的重构视角——即记忆的提取应由精细的 cues 引导并从更广泛的知识库中重构，而非仅仅依赖静态的压缩片段。因此，前人方法由于在记忆单元粒度与查询粒度之间存在 mismatch，且过度依赖压缩记忆作为直接证据，无法在动态长对话中提供高保真的支撑性上下文。", "core_insight": "### § 3 重建作者的思考路径\n\n在长期对话场景中，LLM agents 面临着如何有效利用历史信息的挑战。直接输入 full history 会受限于 context window 并引发 lost-in-the-middle 问题及高昂的推理延迟。为了解决这一问题，现有的 RAG 和 memory systems 通常将对话历史切分、总结或提取为 memory units 进行检索。然而，这种做法存在明显的失败模式：压缩后的 memory units 丢失了 fine-grained 的细节，且单一的 dense representation 往往将多个语义信号纠缠在一起（例如将目的地、预算和偏好混为一谈），导致针对特定细节的检索精度下降。更重要的是，这些系统将检索到的压缩片段直接作为 self-contained evidence 喂给 LLM，脱离了原始的对话上下文。面对这一瓶颈，研究者开始从认知科学中寻找灵感。Autobiographical memory 理论指出，人类的记忆并非完美存储的记录，而是在线索引导下从更广泛的知识库中重构出来的。这一理论线索提示了一种全新的解法：不要把记忆当作压缩的证据，而应将其视为检索线索。如果我们将对话拆解为细粒度的 memory cues，并让这些线索指向其原始的对话轮次，那么在查询时，就可以先通过精准的线索检索定位到原始对话锚点，再围绕这些锚点重构出包含足够上下文的证据集。这种思路既避免了压缩带来的信息丢失，又规避了全量历史输入的噪声问题。\n\n### § 4 核心 Intuition\n\n现有的长期对话记忆系统试图将冗长的对话压缩成独立的 memory units 作为直接证据，但这不可避免地丢失了细粒度细节并因语义纠缠降低了检索精度。CueMem 的核心直觉在于，记忆不应是自包含的证据，而应是引导我们回到原始对话的检索线索。通过提取细粒度的 memory cues 定位到原始对话轮次，并沿着时间与语义的图结构向外扩展重构出完整的上下文，系统既保留了原始对话的丰富细节，又避免了全量历史带来的噪声与高延迟。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Offline Stage]\nDialogue History D ─────\u003E Memory Cue Extraction ─────\u003E Cue Set C\n                              │           │              │\n                              │           └─────────────┼──\u003E Turn Graph G\n                              │                          │ (Temporal \u0026 Semantic Edges)\n[Online Stage]               │                          │\nUser Query q ─────\u003E Cue Retrieval ─────\u003E Anchor Set Aq ─┘\n                                          │\n                                          v\n                                    Graph Expansion\n                                          │\n                                          v\n                               Evidence Context Eq ──\u003E LLM ──\u003E Answer a\n```\n\nCueMem 的完整 Pipeline 分为离线记忆构建和在线上下文重构两个阶段，具体步骤如下：\n\n- **Memory Cue Extraction (§ 4.1)**\n  - **输入**：长期的 Dialogue History $D = \\{u_1, u_2, \\dots, u_T\\}$。\n  - **具体操作**：在离线阶段，系统使用 LLM 从每个对话轮次中提取细粒度的 relational triples 作为 memory cues。每个 cue 被形式化为 $c_i = (t_i, \\tau_i)$，其中 $t_i$ 是包含原子语义信息的三元组，$\\tau_i$ 是指向其源对话轮次的指针。随后，使用 embedding 模型将每个 $t_i$ 编码为 dense vector $\\mathbf{t}_i$ 以供后续检索。\n  - **输出**：带有源轮次指针的 Cue Set $C = \\{c_1, c_2, \\dots, c_N\\}$。\n\n- **Turn Graph Construction (§ 4.2)**\n  - **输入**：Dialogue History $D$ 与 Cue Set $C$。\n  - **具体操作**：在离线阶段，构建图 $G = (V, E)$，其中节点 $v_i$ 对应对话轮次 $u_i$。图包含两种边：Temporal edges 连接时间窗口 $w$ 内的轮次以保留局部对话连续性；Semantic edges 则通过计算 cue 级别的 embedding 相似度，检索 top-$k$ 近邻 cues，并将它们映射回各自的源轮次节点建立连接，从而捕捉非局部的语义关联。\n  - **输出**：包含时间与语义双重关联的 Turn Graph $G$。\n\n- **Cue Retrieval (§ 4.3)**\n  - **输入**：在线阶段的 User Query $q$ 与离线构建的 Cue Set $C$。\n  - **具体操作**：使用与离线阶段相同的 embedding 模型将查询 $q$ 编码为 $\\mathbf{q}$，在 Cue Set 中检索 top-$m$ 个最相似的 memory cues。提取这些检索到的 cues 的源轮次指针 $\\tau_i$。\n  - **输出**：作为图扩展起点的 Anchor Set $A_q$。\n\n- **Graph Expansion (§ 4.3)**\n  - **输入**：Anchor Set $A_q$ 与 Turn Graph $G$。\n  - **具体操作**：在线阶段，从锚点节点出发，在 Turn Graph 上进行一跳扩展，收集锚点轮次及其时间与语义邻居。随后，将收集到的轮次按其原始时间顺序重新排列，以形成连贯的上下文。\n  - **输出**：紧凑且包含关键证据的 Evidence Context $E_q$。\n\n- **Answer Generation (§ 4.3)**\n  - **输入**：User Query $q$ 与重构的 Evidence Context $E_q$。\n  - **具体操作**：将 $q$ 和 $E_q$ 格式化为 prompt，输入 LLM 进行推理生成。对于涉及知识更新的问题，prompt 中会加入 priority instruction，指导 LLM 优先依赖时间上更近的证据。\n  - **输出**：最终生成的 Answer $a$。\n\n### § 6 核心数学推导\n\n本文未涉及复杂的形式化数学推导或定理证明，其数学表达主要集中于集合定义、图论基础表示以及基于向量相似度的 top-$k$ 检索公式。因此本节跳过。\n\n### § 7 实验设计与结论\n\n这篇论文通过三个核心实验验证了其提出的 claim：\n\n**提出了什么问题**：CueMem 的 cue-guided context reconstruction 机制是否优于现有的长期记忆基线？\n**设计了什么实验**：在 LoCoMo 和 LongMemEval 两个长期对话问答基准上，将 CueMem 与 Naive RAG、MemoryOS、Mem0、A-Mem 和 LightMem 等代表性记忆系统进行对比，使用 LLM-as-judge 协议评估准确率。\n**问题的答案**：CueMem 在两个数据集上均取得了最佳的 overall accuracy，且在不同类型的问题（如 single-hop, temporal, knowledge-update）上表现出更强的泛化性和稳定性，证明了细粒度 cue 检索与 anchor-based 上下文重构的有效性。\n\n**提出了什么问题**：Turn graph expansion 和 priority instruction 对系统性能有何具体贡献？\n**设计了什么实验**：在 LoCoMo 上移除 turn graph（仅保留 anchor turns 作为上下文），在 LongMemEval 上移除 priority instruction，进行 ablation study。\n**问题的答案**：移除 turn graph 导致整体准确率显著下降（尤其在 single-hop 和 multi-hop 问题），证明图扩展对于恢复时间相邻和语义相关的支持证据至关重要。移除 priority instruction 导致 knowledge-update 和 temporal 问题准确率明显下降，证明当重构的上下文中包含冲突历史时，简单的优先指令结合 LLM 固有推理能力即可有效处理知识更新，无需复杂的显式 UPDATE 操作。\n\n**提出了什么问题**：与直接使用 full-history 的长上下文 LLM 相比，CueMem 在效率和效果上表现如何？\n**设计了什么实验**：在限制重构上下文约为 2K tokens 的条件下，比较 CueMem 与 full-history LLM 设置在准确率、input tokens 消耗及 query latency 上的差异。\n**问题的答案**：CueMem 在大幅减少 input tokens（降至 full-history 的 2%~10%）和 query latency（降低 42.5%~87.4%）的同时，反而取得了更高的准确率。这表明 CueMem 能够有效规避长上下文带来的“lost-in-the-middle”现象和噪声干扰，以极低的计算开销实现了高效的记忆重构。", "additional_insights": "### § 8 Take-aways\nCueMem 提出了一种受自传体记忆启发的长期对话记忆框架，将提取的细粒度记忆记录作为 retrieval cues 而非 self-contained evidence。系统通过 LLM 从对话轮次中提取 relational triples 作为 memory cues，并保留指向其 source turn 的指针。在 query time，系统检索相关 cues 并映射到 source-turn anchors，随后在包含 temporal edges 和 semantic edges 的 turn graph 上进行一跳扩展，以重建紧凑的 evidence context。该方法放弃了复杂的 memory update 操作，仅通过添加新 cues 并在 prompt 中加入 priority instruction，依靠 LLM 自身推理能力解决知识冲突。实验表明，CueMem 在 LoCoMo 和 LongMemEval 两个 benchmark 上均超越了 MemoryOS、Mem0 等基线，且相比 full-history 输入大幅减少了 input tokens 和 inference latency。消融实验证明 turn graph expansion 对于恢复局部和全局证据至关重要，而 priority instruction 在不显式更新记忆的情况下有效处理了 knowledge-update 问题。\n\n### § 9 最脆弱的假设\nCueMem 最核心且失败代价最大的假设是：**细粒度的 cue-level 语义相似度能够准确捕捉跨越不同对话轮次的非局部关联，从而使得基于 source-turn anchors 的一跳图扩展足以恢复所有必要的支撑证据。** 如果这个假设不成立，整个 cue-to-anchor-to-context 的重建管道就会断裂，导致 LLM 缺乏关键上下文而回答错误。在实际场景中，这个假设很可能不成立，因为真实的 multi-hop 推理往往依赖逻辑链条而非单纯的语义相似度。例如，用户在第 2 轮提到“买了去巴黎的机票”，在第 50 轮提到“预订了埃菲尔铁塔附近的餐厅”，这两者的 cue-level 语义相似度可能并不高，且它们与其他中间闲聊轮次在语义上可能更为接近，导致 top-k semantic edges 无法将这两个逻辑强相关的轮次连接起来。论文虽然通过 LoCoMo 上 multi-hop 问题的较高准确率（82.24%）间接证明了该机制的有效性，但缺少对 turn graph 连通性的微观分析（例如：成功案例中有多少证据是直接由 semantic edges 贡献的，而非碰巧在时间窗口内），也没有探讨当逻辑链条跨度极大且缺乏明显词汇重合时，一跳扩展是否会彻底失效。\n\n### § 10 最小复现实验\n如果有一周时间，可以最小化复现 CueMem 的核心检索与重建机制，以验证“基于 fine-grained cues 的 anchor 映射加时间窗口扩展，比直接检索 dialogue turns 更能提高 evidence recall”这一 claim。数据方面，使用公开的 LoCoMo 数据集，仅抽取其中的 multi-hop 和 temporal 问题子集。实现方面，跳过复杂的 semantic edges 构建，仅使用 LLM 提取每个轮次的 relational triples 作为 cues 并建立指向 source turn 的指针。对于给定的 query，对比两种检索策略：Baseline 采用传统的 Naive RAG，直接按 query 与 dialogue turn 的 embedding 相似度检索 top-k 轮次；实验组采用 CueMem 的核心机制，先检索 top-k 相似的 cues，映射到 source turns 作为 anchors，然后沿时间轴向前后各扩展一个窗口（如 1-2 个轮次）组成 context。测量指标为 evidence recall（即检索出的 context 中是否包含 LoCoMo 提供的 ground truth supporting turns）以及最终的 LLM answer accuracy。如果实验组的 evidence recall 和 accuracy 显著高于 Baseline，则支持了论文关于 fine-grained cues 提供更精准 retrieval targets 并能有效引导 context reconstruction 的 claim；若两者表现无异或因 cues 提取丢失上下文导致实验组更差，则直接反驳了该机制的核心价值。", "research_value": "### § 11 最强反例设计\n要构造对 CueMem 最致命的攻击，我会在真实世界的长程对话场景中设计一个“语义漂移的隐式因果多跳推理”实验。CueMem 的核心在于利用 cue-level 的 semantic similarity 捕捉非局部关联，并通过一跳图扩展来恢复证据。然而，真实的复杂推理往往依赖隐式的因果或逻辑链条，而非表层的语义相似。例如，用户在第 5 轮提到“我刚失业了，现金流很紧张”，在第 60 轮提到“我把之前订的去巴黎的机票退了”，并在第 120 轮询问“我为什么没去欧洲度蜜月？”。在这个场景中，查询与第 60 轮的退票行为有直接语义关联，但退票与第 5 轮的失业之间缺乏直接的词汇或语义重合，且跨越了极长的时间窗口。CueMem 的 semantic edges 极大概率无法将“失业”与“退票”这两个 cues 连接起来，而 temporal edges 也无法跨越 55 轮的间隔。因此，图扩展收集到的 Evidence Context $E_q$ 将缺失最核心的因果证据（失业导致预算紧张），导致 LLM 产生幻觉或给出表面化的错误回答。这个反例不仅指出了方法在 predictable condition 下的失效，还提供了一个对现有实验结果的替代解释：CueMem 在 LoCoMo 和 LongMemEval 上取得的高 multi-hop 准确率，可能仅仅是因为这些 benchmark 中的多跳推理路径恰好具有较高的词汇共现率或分布在较短的时间窗口内，而非其 semantic edges 真正具备了捕捉深层逻辑关联的能力。\n\n### § 12 Follow-up Research Idea\n基于 CueMem 在隐式逻辑链条上的检索失效问题，我提出一个非增量的 novel research idea：将长期对话记忆从“基于相似度的静态检索”重构为“基于溯因推理的动态假设验证”。驱动这个想法的核心局限是：现有的记忆系统（包括 CueMem）都试图在 query time 一次性完成证据收集，这要求系统必须能“猜中”所有逻辑相关的碎片，但真实的因果链条往往是隐式的，无法通过 embedding similarity 预先建立索引。为了打破这一瓶颈，我们可以借鉴认知科学中的 Episodic Future Thinking 以及符号逻辑中的 Abductive Reasoning，构建一个 Agentic Memory Reasoner。当系统接收到用户查询（如“为什么没去欧洲”）时，不再直接检索 cues 并扩展，而是首先利用 LLM 生成多个潜在的因果假设（如“预算不足”、“签证被拒”、“行程冲突”）。随后，系统将这些假设转化为针对性的探针，在 Turn Graph 上执行多轮迭代的 adversarial search，主动寻找支持或反驳这些假设的 dialogue turns。第一个实验将构建一个包含长跨度隐式因果链的合成对话数据集，对比传统 Naive RAG、CueMem 的单次图扩展，以及提出的 Abductive Reasoning Agent。评价指标不仅包括最终的 answer accuracy，还重点考察 reasoning path fidelity（即系统是否沿着正确的因果节点完成了推理）。这一提议与已有工作的根本区别在于：它将记忆检索从被发的“找相似”转变为主动的“找逻辑”，将记忆系统的角色从 evidence provider 升级为 reasoning participant。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Changjian Wang\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Rongzhen Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Weili Guan\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Shuming Shi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Quan Lu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ning Jiang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Mashang Consumer Finance Co., Ltd.\"},\n    {\"id\": 2, \"name\": \"Harbin Institute of Technology, Shenzhen\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "长期对话代理必须通过从扩展的对话历史中召回信息来回答用户查询，然而直接使用完整历史成本高昂且通常不可靠，而压缩的 memory units 可能会丢失 question answering 所需的 fine-grained evidence。受 autobiographical memory 重构观的启发，我们提出了 CueMem，这是一个 cue-guided 框架，它将提取的 memory records 视为 retrieval cues 而非 self-contained evidence，并从其 source turns 中重构 query-relevant 对话上下文。在 memory construction 阶段，CueMem 从 dialogue turns 中提取 fine-grained memory cues，并将每个 cue 链接到其 source turn。在 query time，它检索 query-relevant cues，将其映射到 source-turn anchors，并在捕获 temporal proximity 和 semantic relatedness 的 turn graph 上从这些 anchors 进行扩展，从原始对话中重构 compact evidence context 以用于 LLM answer generation。在 LoCoMo 和 LongMemEval 上的实验表明，CueMem 始终优于具有代表性的 long-term memory baselines。进一步的分析表明，与 full-history LLM setting 相比，基于 graph 的 context reconstruction 有助于恢复 supporting dialogue evidence，同时减少 query-time input tokens 和 latency。这些结果突出了 retrieval cues 作为长期对话 question answering 中 self-contained memory evidence 的有效替代方案。"}, {"title": "AIM: A Privacy-Aware Interoperable Memory Framework for Multi-Agent Multi-User LLM Systems", "arxiv_id": "2609.12320", "authors": "Zachary Johnson, Nigel Boachie Kumankumah, Somya Chatterjee, Tejas Sathyamurthi, Min Chen, Xinyi Alice Li, Xiao Wang, Emily Morgan Gelchie, Jessica Lin, Sadid A. Hasan, Sulaiman Vesal", "summary": "Traditional large language models (LLMs) are scoped to individual user sessions, limiting their knowledge to a single conversation and preventing them from learning user preferences that evolve over time. Existing agentic memory systems address this limitation but generally operate at the individual-user level, restricting the public knowledge that could be shared across users to improve downstream responses. We introduce AIM (Agentic Interoperable Memory), a unified, privacy-aware memory framework that enables multi-agent, multi-user LLM systems to persistently manage private and shared memory. AIM dynamically classifies information as private, scoped to one user and inaccessible to others, or public, accessible to all users. It enforces index-level access controls so that private memories are retrievable only by their owner, protecting sensitive data while allowing beneficial shared knowledge to improve coordination and consistency. We also introduce MUMBench (Multi-User Memory Benchmark), a dataset of multi-user interactions containing private and shareable information across four domains. To our knowledge, MUMBench is the first public dataset designed to evaluate multiple memory operations, including retrieval, creation, update, and deletion, in a multi-user environment. Across three independent runs on MUMBench, AIM achieves 96.0% visibility classification accuracy, 58.8% strict operation accuracy, and 70.5% state-aware operation accuracy.", "category": "cs.LG", "cluster": "Memory \u0026 Experience Management", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agent capability/behavior, Multi-Agent)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=53 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 论文的核心贡献是提出了AIM（Agentic Interoperable Memory）框架，用于在多智能体、多用户LLM系统中持久化管理私有和共享记忆，并引入了MUMBench来评估多用户环境下的记忆操作。这直接对应了研究焦点中的“单智能体（记忆机制）”和“多智能体（协作与共享知识学习）”方向。虽然论文标题包含“Privacy-Aware”，但其本质是研究智能体在多用户场景下的记忆管理机制（如信息的检索、创建、更新、删除及可见性控制），属于智能体能力构建的一部分，而非纯粹的“Security for AI”或系统安全防护研究。此外，该研究关注的是跨用户的记忆共享与隔离机制，而非单纯的多智能体拓扑结构或消息路由等系统工程问题。因此，该论文符合构建和改进LLM智能体记忆能力的研究范围，应予保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文针对的核心问题是：在 multi-agent、multi-user 的 LLM 系统中，如何持久化地管理 memory，使得 private memory 仅对所属用户可检索，同时允许 public memory 跨用户共享以提升系统整体的协调性与一致性。传统 LLM 被限制在 single-session 范围内，无法跨会话积累用户偏好与结构化知识，导致交互重复、上下文碎片化、个性化受限。现有的 agentic memory 系统（如 MemGPT、Mem0、A-MEM 等）虽然引入了 persistent memory 与 lifecycle management，但它们均设计于 single-user、single-agent 假设之上，既缺乏跨用户的 access control 机制，也无法在异构 agent 之间同步共享知识。随着 LLM 生态向多 agent 协作、多用户并发的方向演进——例如企业级 assistant 同时服务大量用户、specialized agent 之间需要协调共享任务——这一缺口变得尤为关键。解决该问题的价值在于：在保护用户隐私的前提下，将个体用户积累的 beneficial shared knowledge（如团队决策、通用政策）转化为可被所有用户利用的公共资产，从而提升 coordination、consistency 和整体 system intelligence，同时通过 index-level 的确定性访问控制抵御 adversarial query 对 private memory 的提取攻击。\n\n### § 2 前人工作与不足\n\n该问题此前未被完整解决。在 memory architecture 层面，Generative Agents 引入了 recency-importance-relevance 加权的检索机制，CoALA 框架将 agent memory 形式化为 working/episodic/semantic/procedural 模块的 taxonomy，MemGPT 借鉴 OS 分页机制实现 tiered memory，Mem0 构建了 production-oriented 的 ADD/UPDATE/DELETE/NOOP pipeline 并显著降低 latency。然而，这些系统的根本局限在于其架构假设单一用户与单一 agent：memory store 没有 ownership 概念，不存在 visibility predicate 或 access control layer，因此无法支持 multi-tenant isolation。这一缺失并非简单的功能遗漏，而是因为它们的 retrieval index 和 deduplication 逻辑均以全局共享为默认设计——一旦引入多用户，private memory 会在 retrieval 和 deduplication 阶段不可避免地发生 cross-user leakage。在 modular/hierarchical memory 方向，MIRIX、MemOS、G-Memory、LEGOMem 等系统改进了 memory 的组织结构与 retrieval 精度，Mem-α 甚至用 reinforcement learning 优化存储策略，但它们关注的是 single-agent 内部的 memory 效率，完全没有涉及 memory versioning、conflict resolution 或 privacy-scoped sharing 这些 multi-user 场景下的核心需求。在 multi-user sharing 方面，Collaborative Memory 将 user-agent 权限建模为 bipartite graph 并设置 dual-tier private/shared store，INMS 验证了 shared memory pool 对 cross-agent QA 的增益，MaaS 将 memory 解耦为带 dynamic access policy 的模块化服务——这些工作识别了多用户共享的需求，但它们要么要求用户手动标注 memory visibility（增加部署摩擦），要么仅在 probabilistic 层面实施访问控制（无法在结构上阻止 unauthorized retrieval），且均未提供端到端的 automatic privacy classification 与 index-level enforcement。此外，MEXTRA attack framework 已实证表明，缺乏结构化保护的 agent memory 在 black-box 设置下可被提取 private information，凸显了 deterministic access enforcement 的必要性。在 benchmark 层面，LOCOMO 和 MemoryAgentBench 仅评估 single-user retrieval，不测试 access control、cross-session synchronization 或 concurrent multi-agent update 下的 memory integrity，导致 prior systems 即使在多用户场景下存在隐私漏洞，也无法被现有评测发现。AIM 正是针对这三重缺口——automatic visibility inference、deterministic index-level access control、multi-label operation detection——提出了统一解决方案，并配套 MUMBench 填补了评测空白。", "core_insight": "### § 3 重建作者的思考路径\n\n随着 LLM agents 从单次会话走向持久化部署，研究者们观察到无状态的 agent 无法积累跨会话的用户偏好和协作知识。早期的记忆架构如 Generative Agents 和 MemGPT 虽然引入了观察、反思和分层记忆等机制，但它们本质上都是为单 agent 单用户设计的。当企业级 agent 需要同时服务多个用户时，一个核心矛盾浮现：完全隔离的记忆无法利用团队级别的共享知识（如编码规范、通用排障步骤），而完全共享的记忆又会泄露个人隐私（如 MEXTRA 攻击所揭示的漏洞）。现有的多用户记忆研究（如 Collaborative Memory）虽然提出了双轨制存储，但往往依赖用户手动标记隐私级别，或在检索后进行概率性过滤，这在工程上既增加摩擦又不够安全。作者进一步注意到，真实对话中的记忆操作并非互斥——用户一句“我刚搬到旧金山，能推荐餐厅吗？”同时触发了记忆写入和检索，而 Mem0 等先验系统假设每轮仅一个操作，导致信息丢失。基于这些失败模式，作者推断：一个实用的多用户记忆系统必须将隐私分类自动化，并在向量索引层面确定性地强制执行访问控制，使得 private 记忆在检索的物理层面就不可达，而非事后过滤。同时，操作检测必须从单标签升级为多标签分类。为了验证这一思路，作者发现现有 benchmark（如 LOCOMO）均未涵盖多用户隐私隔离和并发操作场景，因此必须构建一个新的评估基准。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 在于：多用户环境下的记忆管理必须将信息的可见性作为系统的基础约束。通过在记忆写入时利用 LLM 自动推断 private/public 标签，并在向量检索的索引层面确定性地强制执行访问控制，系统能在不牺牲共享知识利用的前提下，实现严格的多租户隔离。此外，将记忆操作检测建模为多标签分类，使得单条用户消息能够同时触发记忆的创建与检索，从而更真实地反映对话中的复合意图。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n输入 x, 用户 u, agent a\n    │\n    ▼\n┌──────────────────┐\n│ Multi-Label       │ §3.2\n│ Intent Detection  │\n│   f_op(x)         │\n└────────┬─────────┘\n    O ⊆ {C,R,U,D}\n    ┌────┴────┐\n    ▼ Write   ▼ Read\n   Path      Path\n    │         │\n    ▼         ▼\n┌─────────┐ ┌─────────────────┐\n│Struct.  │ │S1: Dense Retrieve│ §3.7\n│Extract  │ │  +Visibility V   │\n│ f_ext   │ └────────┬────────┘\n└───┬─────┘          │ top-k\n    ▼                ▼\n┌─────────┐ ┌─────────────────┐\n│Privacy  │ │S2: Tag Rescoring │\n│Classif. │ │  dual threshold  │\n│ f_cls   │ └────────┬────────┘\n└───┬─────┘          │\n    ▼                ▼\n┌─────────┐ ┌─────────────────┐\n│Semantic │ │S3: LLM Rerank   │\n│Dedup    │ │  +Recency Fusion │\n│f_dedup  │ └────────┬────────┘\n└───┬─────┘          │\n    ▼                ▼\n┌──────────┐    Retrieved R\n│Memory M  │\n│(shared)  │◄── Delete if D∈O\n└──────────┘\n```\n\nAIM 将 multi-agent memory management 分解为两条级联推理路径，作用于同一个不断演化的共享 memory store $M$（§3）。以下逐步说明：\n\n**1. Multi-Label Intent Detection（§3.2）**\n- 输入：用户消息 $x$、用户 $u$、agent $a$。\n- 操作：通过 in-context learning 的 LLM 将 $x$ 映射为操作子集 $O \\subseteq \\{C, R, U, D\\}$ 或 $\\emptyset$。关键设计是 multi-label——一条消息可同时触发 create 和 read（如\"I just moved to SF. Can you recommend dinner spots?\"）。Prompt 内嵌 privacy guard，将试图获取他人 private 信息的 adversarial query 映射为 $\\emptyset$。Constrained decoding 限制输出仅含合法操作标签。\n- 输出：操作集合 $O$。若 $O = \\emptyset$，直接返回，不触发后续流程（Algorithm 1, Line 3–5）。\n\n**2. Structured Memory Extraction（§3.3）**\n- 输入：消息 $x$，仅当 $C \\in O$ 或 $U \\in O$ 时触发。\n- 操作：prompted LLM 以 constrained JSON-mode decoding 从对话中提取结构化 memory tuples $\\{(c_j, \\boldsymbol{\\tau}_j, \\boldsymbol{\\mu}_j)\\}_{j=1}^{J}$，每个 tuple 包含文本内容 $c$、关键词 tag 集合 $\\boldsymbol{\\tau}$、以及可选的 provenance metadata $\\boldsymbol{\\mu}$（时间上下文、领域类别）。\n- 输出：待写入的 memory tuple 列表。\n\n**3. Privacy-Aware Visibility Classification（§3.4）**\n- 输入：单条 extracted memory 的内容 $c_j$ 及其 metadata $\\boldsymbol{\\mu}_j$。\n- 操作：prompted LLM 依据 prompt 中编码的 inductive biases 进行二分类——public signals 包括集体事件、组织公告、共享资源；private signals 包括个人偏好、个人日程、敏感数据（健康、财务）。该分类决定后续 deduplication scope、retrieval filter 和 update/delete 权限。\n- 输出：visibility label $v_j \\in \\{\\text{PUBLIC}, \\text{PRIVATE}\\}$。\n\n**4. In-Context Semantic Deduplication（§3.5）**\n- 输入：candidate memory $(c_j, v_j)$ 及当前用户 $u$。\n- 操作：首先根据 visibility scope 构建受限比较集 $M_v$——若 $v_j = \\text{PUBLIC}$，则 $M_v$ 为 $M$ 中所有 public memories；若 $v_j = \\text{PRIVATE}$，则 $M_v$ 为同一用户 $u$ 的所有 private memories。随后将整个 $M_v$ 序列化提供给 LLM，进行三路分类：CREATE（无语义等价项）、UPDATE（存在同主题但信息过时的 memory $\\hat{m}$，返回指针）、NO-OP（内容已被覆盖）。Scope restriction 确保一个用户的 private memory 永不与另一用户的 private memory 比较，防止 cross-user 信息泄露。\n- 输出：操作决策 $o_j \\in \\{\\text{CREATE}, \\text{UPDATE}, \\text{NO-OP}\\}$ 及可能的更新目标 $\\hat{m}$。CREATE 则将新 memory 编码后写入 $M$；UPDATE 则在验证 $V(u, \\hat{m})$ 后替换内容（Algorithm 1, Line 17–21）。\n\n**5. Memory Representation and Indexing（§3.6）**\n- 输入：memory 内容 $c_i$、tags $\\boldsymbol{\\tau}_i$、用户 $u$、agent $a$、visibility $v_i$。\n- 操作：使用 embedding model $\\phi$（$d=3072$）生成 dense embedding。当 tags 非空时，计算 tag-enriched embedding——将 content 与 tags 拼接后联合编码，实现 keyword-guided representation learning。Vector index 采用 HNSW 算法支持 ANN 检索；metadata 字段（user, agent, visibility, tags）独立索引以支持 predicate push-down filtered search。\n- 输出：存储于 vector-indexed store 中的结构化 memory record $m_i$。\n\n**6. Cascaded Memory Retrieval（§3.7）**\n- 输入：query $q$、用户 $u$、agent $a$，仅当 $R \\in O$ 或 write path 需要上下文时触发。\n- **Stage 1 — Visibility-Constrained Dense Retrieval**：从 Eq. 1 构建 visibility predicate $V(u, \\cdot)$，作为 server-side filter 推入 vector index。索引返回 cosine similarity 排序的 top-$k$ candidates。此阶段复杂度为 $O(\\log|M|)$（HNSW），且 Eq. 1 在 index level 强制执行，使其他用户的 private memories 在结构上不可能成为候选。\n- **Stage 2 — Tag-Level Semantic Rescoring**：对每个有非空 tags 的 candidate $m_i$，计算 query embedding 与 tag embedding 的 cosine similarity $s_{\\text{tag}}$。仅当 content similarity $s_{\\text{vec}} \\geq \\tau_{\\text{vec}}$ 且 tag similarity $s_{\\text{tag}} \\geq \\tau_{\\text{tag}}$ 同时满足时保留。此 dual-threshold filter 作为 precision gate，大幅削减进入下一阶段的候选数量。\n- **Stage 3 — LLM-Based Reranking with Temporal Fusion**：对存活的 candidates，pointwise LLM scorer $g_\\theta$ 计算 relevance estimate $s_{\\text{rel}}$。Scoring prompt 编码 conservative guidelines：分数 $\u003E0.7$ 要求直接、特定的相关性；不确定匹配默认 $\\leq 0.4$。随后将 $s_{\\text{rel}}$ 与 normalized recency score $s_{\\text{rec}}$ 融合，最终排名分数 $s_{\\text{final}} = (s_{\\text{rel}} + s_{\\text{rec}}) / 2$，按 $s_{\\text{final}}$ 降序截断至 $k$。\n- 输出：retrieved memory set $R$，用于 augment agent 的响应。\n\n**7. Delete 操作（Algorithm 1, Line 24–26）**\n- 输入：消息 $x$、用户 $u$，仅当 $D \\in O$ 时触发。\n- 操作：在满足 $V(u, m)$ 的约束下，删除与 $x$ 相似度最高的 memory $\\arg\\max_{m \\in M} \\text{sim}(x, m)$。这确保用户只能删除自己拥有的 memory。\n- 输出：更新后的 memory store $M$。\n\n**关于评测流程**：AIM 在 MUMBench 上的评测是将 672 条按时间顺序排列的 user interactions 依次回放通过上述完整 pipeline（operation detection → extraction → classification → deduplication → retrieval），每个 domain 开始前清空 memory store 以保证隔离。每条 interaction 的 predicted operations 与 gold operations 通过 strict accuracy、state-aware accuracy、visibility match、content quality 等指标比对。整个流程是纯推理（inference），不涉及训练。\n\n---\n\n### § 6 核心数学推导\n\n本文不包含复杂的形式化数学推导，其数学内容主要是定义性公式和组合性评分函数。以下逐一解释可确认的公式及其 intuition：\n\n**Visibility Predicate（Eq. 1）**\n\n$$V(u, m_i) = \\text{true} \\iff (v_i = \\text{PUBLIC}) \\lor (v_i = \\text{PRIVATE} \\land u = u_i)$$\n\n这是整个系统的隐私基石。直觉很简单：一条 memory 要么对所有人开放（PUBLIC），要么只对创建者本人可见（PRIVATE）。这个谓词在 pipeline 的每个阶段都被强制执行——retrieval 时作为 index filter，write 时作为 update/delete 的权限检查。它使得系统可以在单一共享 index 上实现 multi-tenant isolation，无需为每个用户维护独立的 memory store。\n\n**Tag-Enriched Embedding（Eq. 2）**\n\n$$\\mathbf{e}_i = \\phi(\\text{concat}(c_i, \\tau_{i,1}, \\tau_{i,2}, \\ldots))$$\n\n将 memory 的文本内容与关键词 tags 拼接后一次性送入 embedding model。直觉是：如果一条 memory 的内容是\"User is planning a trip to Paris\"，tags 是 [\"trip planning\", \"Paris\", \"cultural activities\"]，那么联合编码后的 embedding 在面对包含 \"Paris\" 或 \"trip\" 关键词的 query 时会有更高的 cosine similarity，无需维护独立的 sparse keyword index。\n\n**Retrieval Cascade 的评分函数（Eq. 3–7）**\n\nStage 1（Eq. 3）是在 visibility filter 约束下的标准 cosine similarity top-$k$ ANN 检索，无特殊数学结构。\n\nStage 2（Eq. 4）计算 query embedding 与 tag embedding 的 cosine similarity：\n$$s_{\\text{tag}} = \\cos(\\phi(q), \\phi(\\boldsymbol{\\tau}_i))$$\n配合 content similarity $s_{\\text{vec}}$ 构成 dual-threshold precision gate。直觉是：一条 memory 必须在完整语义表示和关键词摘要两个维度上都与 query 相关，才值得送入昂贵的 LLM reranking。\n\nStage 3（Eq. 5–7）是两个分数的线性组合：\n$$s_{\\text{rel}} = g_\\theta(q, m_i) \\quad \\text{（LLM pointwise relevance score）}$$\n$$s_{\\text{rec}} = \\frac{t_i - t_{\\min}}{t_{\\max} - t_{\\min}} \\quad \\text{（normalized recency）}$$\n$$s_{\\text{final}} = \\frac{s_{\\text{rel}} + s_{\\text{rec}}}{2}$$\n\n$s_{\\text{rec}}$ 将 candidate 集合中 memory 的 timestamp 线性归一化到 $[0, 1]$，越新分数越高。$s_{\\text{final}}$ 取 relevance 和 recency 的等权算术平均。直觉是：在 relevance 相近的情况下，更近期的 memory 更可能对当前 query 有用。论文指出这是一种简单的 linear rank combination 实例，未来可从用户反馈中学习融合权重。\n\n**State-Aware Accuracy 的状态修正（Eq. 9）**\n\n$$\\text{state-aware}(i) = \\max\\left(\\text{strict}(i), \\mathbf{1}[C(\\hat{y}_i) = T_i(C(y_i))]\\right)$$\n\n这不是系统内部的数学模型，而是评测指标的设计。$T_i$ 是第 $i$ 轮的状态修正变换：如果 gold operation 期望 update 一个从未被 create 的 memory，$T_i$ 将其放松为 create；如果 read/delete 的目标不存在，则放松为 no-op。$\\max$ 确保一个正确的 strict match 不会被 state heuristic 的 false positive 惩罚。直觉是：早期操作的错误会级联污染后续操作的 store state，state-aware accuracy 旨在将\"单轮决策质量\"与\"级联效应\"解耦。\n\n---\n\n### § 7 实验设计与结论\n\n论文提出了三个核心 claim 并通过实验逐一验证：\n\n**Claim 1：AIM 能在 multi-user 环境中正确区分 private 与 public memory 并执行 access control。**\n\n论文设计了 MUMBench——首个包含 672 条跨 93 个用户、4 个领域（Coding、Customer Support、Education、Travel Planning）的 multi-user memory benchmark，其中包含 60 条 adversarial query（用户试图访问他人 private memory）。每条 interaction 标注了 expected memory operation（CRUD/NOOP）和 expected visibility（private/public）。通过 Visibility Match 指标评估分类正确性，并通过检查 private memory 是否被 unauthorized user 检索来验证 access control。**答案**：5 个模型平均 visibility classification accuracy 接近或超过 90%，GPT-5.4 达到 96.0%，3 个模型在 Travel domain 达到 100%。这表明 AIM 的 privacy-aware classification engine（确定性规则 + LLM 分类）能可靠区分 private 与 public，即使在语义模糊的场景下（如用户提及个人包裹但延迟原因是公共的天气信息）。\n\n**Claim 2：AIM 能在 multi-user 环境中正确识别并执行 memory operations（CRUD）。**\n\n论文采用 tiered scoring framework 评估 operation accuracy：strict accuracy 要求 predicted operation multiset 与 gold 完全匹配；state-aware accuracy 在 strict 基础上根据实际 store state 修正 gold expectations，隔离级联错误的影响；judge-decision accuracy 由 full-context LLM judge 裁决 ambiguous-but-reasonable 的操作选择。三种指标的递进设计直接回应了\"早期错误级联\"这一 agentic memory 评测的核心挑战。**答案**：以 GPT-5.4-mini 为最佳模型，strict accuracy 为 58.8%，state-aware accuracy 为 70.5%，judge-decision accuracy 为 89.5%。Strict 与 state-aware 之间的 12 个百分点差距量化了级联效应的影响；state-aware 与 judge-decision 之间的差距则反映了操作选择的固有歧义性。Coding domain 表现最优（state-aware 79.8%），因其交互模式以直接的 create-and-retrieve 为主；Travel domain 最弱（62.7%），因多轮交互中存在复杂的 update chain。\n\n**Claim 3：高性能 memory system 不需要牺牲质量以换取计算效率。**\n\n论文在所有 pipeline 组件中使用 5 个不同 model family 的模型（GPT-5.4、GPT-5.4-mini、DeepSeek-V3.2、Mistral-Large-3、Llama-3.3-70B-Instruct），每个模型独立完成全部推理任务（extraction、classification、operation detection、deduplication、reranking），运行 3 次取均值和标准差。**答案**：GPT-5.4-mini 在 strict accuracy（58.8%）、state-aware accuracy（70.5%）、content quality（91.6%）和 judge-decision accuracy（89.5%）上均取得最高或接近最高分，超越其更大的 counterpart GPT-5.4。这表明 smaller model 在 memory management 任务上可以保持竞争力，memory system 的整体架构设计（而非单一模型规模）对性能起决定性作用。\n\n论文也在单用户 benchmark LOCOMO 上与 Mem0 对比，但 AIM 在所有类别上均低于 Mem0（如 single-hop judge score 0.280 vs. 0.671）。论文坦诚指出 LOCOMO 是单用户 benchmark，不测试 AIM 的核心 multi-user 能力，且 AIM 的 privacy classification 和 deduplication 阶段在单用户场景下会产生过度合并的副作用。此外，Retrieval Relevance 仅 45.0%、Tag Overlap 仅 35.5%，以及 public memory 缺乏事实性验证（任何用户可写入错误公共信息），是论文明确承认的主要局限。", "additional_insights": "### § 8 Take-aways\n本文提出了 AIM，一个统一的、具备隐私感知的 memory framework，专为 multi-agent 和 multi-user LLM 系统设计，通过 index-level 的 access control 确保了 private memory 对非拥有者的结构不可见。AIM 的核心 pipeline 包含 multi-label intent detection、structured memory extraction、privacy-aware visibility classification 以及 in-context semantic deduplication，支持单条消息同时触发多个 memory operations。为填补 multi-user memory 评估的空白，作者引入了 MUMBench，这是首个评估多用户环境下 agentic memory system 的 multi-operation 性能（retrieve, create, update, delete）的公开数据集，包含 4 个领域的 672 条交互。实验表明，AIM 在 visibility classification 上达到了 96.0% 的准确率，在 state-aware operation accuracy 上达到 70.5%，且较小的模型（如 GPT-5.4-mini）在多数指标上表现最佳，证明了高效的 memory 管理无需以牺牲计算资源为代价。\n\n### § 9 最脆弱的假设\nAIM 的核心贡献建立在这样一个假设上：**LLM 能够在提取阶段准确地将 memory 分类为 private 或 public，且这种基于 inductive biases 的分类在实际复杂场景中是可靠的**。如果这个假设不成立，AIM 的核心价值将直接失效。因为 AIM 的 access control 是在 retrieval index level 确定性执行的，一旦 LLM 在上游的 visibility classification 阶段将本应 private 的 memory 误判为 public，该敏感信息就会被写入 public index 并对所有用户开放，导致不可逆的隐私泄露。在实际应用中，这个假设极易不成立，因为用户输入往往具有高度的上下文依赖性和语义模糊性（如论文 Appendix A.6 中提到的包裹延误与暴风雨的例子），LLM 很难在缺乏全局上下文的情况下做出绝对正确的隐私界定。论文虽然提供了 MUMBench 上 96.0% 的 visibility classification accuracy 作为证据，但这仍意味着有 4% 的误判率；在隐私保护场景下，即使是极低的 false positive rate 也是不可接受的。此外，MUMBench 是由 GPT-4o 合成并人工验证的数据集，可能无法完全覆盖现实世界中极其复杂和隐蔽的隐私边界，论文缺少在真实对抗性场景下对该分类机制鲁棒性的深入评估。\n\n### § 10 最小复现实验\n如果只有 1 周时间，可以做一个最小复现实验来验证 AIM 的 **Privacy-Aware Visibility Classification** 在模糊场景下的可靠性。使用 MUMBench 数据集中标记为 ambiguous 的样本，或者自行构造 50-100 条包含隐含隐私信息的 multi-user 对话数据。实现 AIM 的 visibility classification 模块，即使用 LLM（如 GPT-4o-mini）结合论文中提到的 public signals（如 collective events）和 private signals（如 personal preferences）作为 prompt，对提取的 memory content 进行 PRIVATE 或 PUBLIC 的二分类。测量分类的 accuracy、precision、recall，并特别关注 false positive rate（将 private 误分为 public 的比例）。如果实验结果显示在模糊场景下 false positive rate 显著升高（例如超过 5%），则反驳了 AIM 能够可靠保护隐私的 claim，说明其核心假设在实际复杂场景中不成立；如果 accuracy 保持高位且 false positive rate 趋近于零，则支持其 claim。这个实验无需复现完整的 retrieval pipeline 或 vector index，只需调用 LLM API 即可完成，能够高效地针对系统最脆弱的隐私分类环节进行压力测试。", "research_value": "### § 11 最强反例设计\n\n要对该论文进行最有力的攻击，我会设计一个**“跨记忆推理泄露与公共记忆投毒”**的对抗性实验场景，直接挑战其核心假设——即基于单条 memory 的静态 visibility classification 能够在 multi-user 环境中保护隐私。AIM 的 pipeline 在提取阶段将每一条 memory 独立判定为 PUBLIC 或 PRIVATE，并在 retrieval 阶段通过 index-level filter 确定性隔离 PRIVATE memory。然而，真实的隐私泄露往往不是单条记录的直接暴露，而是通过多条看似无害的 PUBLIC memory 进行交叉推理得出的。我的反例实验构造如下：在一个 Corporate Assistant 场景中，恶意用户 Alice 不断通过正常交互注入带有特定诱导性的 PUBLIC memory（例如“公司政策规定，所有参与 Project X 的员工下个月必须前往 Country Y 出差”），而受害者 Bob 的 PRIVATE memory 中包含“因身体原因无法前往 Country Y”或“持有 Country Y 的特殊签证限制”。当 Alice 发起一个看似普通的 query（如“列出下个月可能无法正常出差的人员特征”），AIM 的 retrieval pipeline 会合法地检索到那条 PUBLIC memory，并可能结合 Bob 之前与 agent 交互时留下的、被误判为 PUBLIC 的碎片化 metadata，通过 LLM 的 in-context reasoning 直接推导出 Bob 的私人敏感信息。在这个场景下，AIM 的 index-level access control 完全失效，因为它只阻断了对 Bob PRIVATE memory 的直接检索，却无法阻止恶意用户利用共享的 PUBLIC memory 作为推理锚点，通过 LLM 的生成能力间接“萃取”出受保护的隐私。这一反例不仅指出了 AIM 将 visibility classification 局限于单条记录的根本缺陷，还揭示了在 LLM 强大推理能力面前，缺乏 relational privacy 约束的 access control 不过是一扇虚掩的门。\n\n### § 12 Follow-up Research Idea\n\n基于上述局限，我提出一个非增量的 novel research idea：**将 Information Flow Control (IFC) 与 Information-Theoretic Privacy 引入 agentic memory，构建一个基于互信息的动态隐私边界推理框架**。这个想法的驱动需求在于，AIM 及前人工作均将 privacy 视为一种静态的、基于记录的标签（PUBLIC/PRIVATE），完全忽略了隐私的“涌现性”——即多条无害记录的组合可能产生高敏感度的推断。为了解决这个问题，我们可以借鉴安全系统领域的 Information Flow Control 和隐私统计学中的 Differential Privacy 概念，不再让 LLM 在提取时硬性分类，而是在 retrieval 和 generation 阶段动态计算信息流的风险边界。\n\n具体而言，memory store 不再存储绝对的 visibility 标签，而是维护一个 relational knowledge graph。当 agent 处理用户 $u$ 的 query 时，系统不仅执行 vector retrieval，还会触发一个 **Inference Leakage Estimator**。该 estimator 计算当前 retrieved memory set $R$ 与目标用户 $u$ 的 private memory subspace $M_{private}$ 之间的 conditional mutual information $I(M_{private}; \\text{Response} | R)$。如果该互信息超过预设的 privacy budget $\\epsilon$，系统将在 vector space 中主动注入“混淆记忆”或对 retrieval 结果进行信息瓶颈约束，从而在结构上阻断跨记忆的推理攻击。\n\n第一个实验将设计一个“Relational Inference Attack Benchmark”：构造一个多用户协作环境，其中单条 memory 均被标记为低敏感，但特定组合的 memory 能够以极高概率推断出某用户的隐藏属性。我们将对比传统 ACL（如 AIM 的 index-level filter）、无保护 LLM，以及我们提出的 IFC-based dynamic filter。评价指标不仅包括 retrieval accuracy，更核心的是测量 adversarial agent 通过多轮交互推断目标用户隐藏属性的成功率以及信息熵的衰减情况。这一提议与已有工作的根本区别在于：它将 privacy enforcement 的重心从“存储时的静态标签”转移到了“推理时的动态信息流约束”，首次将 LLM 的 in-context reasoning 能力视为一种潜在的隐私威胁通道，并用信息论工具进行数学上的严格阻断。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zachary Johnson\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Nigel Boachie Kumankumah\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Somya Chatterjee\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Tejas Sathyamurthi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Min Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xinyi Alice Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiao Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Emily Morgan Gelchie\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jessica Lin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Sadid A. Hasan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Sulaiman Vesal\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Microsoft\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "传统的大型语言模型（LLMs）仅限于单个用户会话，将其知识限制在单次对话中，阻碍了它们学习随时间演变的用户偏好。现有的 agentic memory systems 解决了这一局限性，但通常在单个用户级别上运行，限制了可以跨用户共享以改善下游响应的公共知识。我们引入了 AIM (Agentic Interoperable Memory)，这是一个统一的、具备隐私意识的记忆框架，使多智能体、多用户 LLM 系统能够持久地管理私有和共享记忆。AIM 动态地将信息分类为私有或公共，私有信息仅限于单个用户且其他人无法访问，而公共信息对所有用户均可访问。它实施 index-level access controls，使得私有记忆只能由其所有者检索，在保护敏感数据的同时，允许有益的共享知识改善协调性和一致性。我们还引入了 MUMBench (Multi-User Memory Benchmark)，这是一个多用户交互数据集，包含跨四个领域的私有和可共享信息。据我们所知，MUMBench 是第一个旨在评估多用户环境中多种记忆操作（包括检索、创建、更新和删除）的公开数据集。在 MUMBench 上的三次独立运行中，AIM 实现了 96.0% 的 visibility classification accuracy、58.8% 的 strict operation accuracy 和 70.5% 的 state-aware operation accuracy。"}]}, {"name": "Workflow Synthesis \u0026 Tool Use", "count": 3, "papers": [{"title": "Local Edits, Global Ripples: Replay-Informed Policy Adaptation for Workflow Synthesis", "arxiv_id": "2609.12127", "authors": "Manqing Mao, Hong Wang, Samson Koelle, Jie Yuan, Zhuoer Wang, James Feng, Yanjun Lin, Daniel Edmiston, Nikki Lijing Kuang, Zhecheng Sheng, Wei Niu", "summary": "Prompt-policy editing offers a practical way to improve agents that synthesize executable workflows without updating the underlying model. However, persistent prompt editing has two coupled properties. First, edit locality does not imply effect locality: an edit confined to one policy segment can ripple through downstream execution, altering behavior beyond the edited segment. Second, edit effects are composition-sensitive: edits that work in isolation can interfere after composition, causing one or both to lose their benefit or become harmful. Persistent adaptation must therefore support two distinct decisions: identifying where the policy should change from execution feedback, and determining whether the resulting edit remains safe to persist after composition. To address these challenges, we introduce RIPPLE (Replay-Informed Persistent Policy Localization and Editing), which separates where an edit is made from whether it remains safe after composition. It diagnoses failed trajectories, maps each actionable failure to a predefined policy segment, and restricts the correction to that part of the policy. RIPPLE then evaluates candidates against the same iteration-start policy to compare their isolated gains, before replaying promising edits after previously accepted updates to expose downstream effects and interactions. Only edits that remain safe under composition are retained. We evaluate RIPPLE on Flow-HO, a synthetic held-out benchmark for executable workflow synthesis. RIPPLE improves validation success by up to 23.1% and yields positive gains on two additional frozen language-model backbones, while maintaining edit efficiency and low execution cost. Targeted interaction analysis further demonstrates both properties: a segment-local tool-use edit changes downstream resource resolution and validation, while an edit beneficial in isolation becomes harmful after composition.", "category": "cs.CL", "cluster": "Workflow Synthesis \u0026 Tool Use", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是提出了 RIPPLE，一种针对工作流合成智能体的提示策略自适应编辑方法。该方法通过诊断失败轨迹、将失败映射到策略片段、进行局部修正，并利用重放机制评估组合后的安全性，实现了智能体策略的持续自我改进和自适应优化。这完全符合筛选标准中“保留”规则的核心要求：研究 agent 的 harness / scaffold / system prompt，并且核心贡献是让这些智能体运行组件通过轨迹、反馈或评估结果自动改进、演化或自适应优化。论文探讨的 tool-use edit、execution feedback 和 persistent adaptation 属于单智能体和自我演化方向的核心机制，且不涉及任何被排除的安全、多模态、图技术或纯系统工程领域。因此，该论文与你的研究焦点高度相关。", "intro_logic": "### § 1 研究问题与重要性\n\n本文研究的核心问题是：对于使用 frozen LLM 的 executable workflow synthesis agents，如何通过持久化地编辑 prompt policy 来提升性能，同时保证局部编辑在组合后仍然安全。具体而言，作者识别出 prompt-policy editing 具有两个耦合属性：第一，edit locality does not imply effect locality——对一个 predefined policy segment 的局部指令修改可以波及下游执行，改变 tool call 方向、resource resolution、workflow 结构乃至 validation 和 repair 行为；第二，edit effects are composition-sensitive——在 isolation 中有益的编辑一旦与先前已接受的编辑组合，可能相互干扰、削弱甚至逆转收益。因此，persistent adaptation 实际上是一个 sequential policy-composition problem，而非 one-shot selection。\n\n这个问题的重要性源于 LLM agents 在实际部署中越来越多地被要求生成 executable artifacts（如 workflow JSON、infrastructure configurations、service-integrated automations），这些 artifacts 必须满足严格的 execution contract：conform to schema、implement requested behavior、resolve environment-specific resources、pass external validation。一个 workflow 可以在语义上看起来合理，却因为一个字段无效、一条 transition 断裂或一个 identifier 过期而无法部署。对于 frozen-model agents，唯一可行的改进路径是编辑 prompt policy，但如果不解决上述两个耦合属性，累积的编辑可能在部署中引发不可预测的行为退化和交互冲突。解决这一问题带来的价值是：使 prompt adaptation 成为可审计、可回滚、组合安全的持久化策略改进过程，而非依赖孤立增益的盲目堆叠。\n\n### § 2 前人工作与不足\n\n该问题此前未被完整解决。最相关的 prior work 可分为三类，每一类都触及了问题的一个侧面但存在结构性缺口。\n\n第一类是 automatic prompt optimization 方法，包括 APE (Zhou et al., 2023)、OPRO (Yang et al., 2024a)、ProTeGi/APO (Pryzant et al., 2023)、TextGrad (Yuksekgonul et al., 2024)、EvoPrompt (Guo et al., 2024)、GEPA (Agrawal et al., 2025) 以及 DSPy/MIPRO (Khattab et al., 2024; Opsahl-Ong et al., 2024) 和 SAMMO (Schnabel \u0026 Neville, 2024)。这些方法展示了 black-box textual policies 无需 gradient access 即可改进，但它们在评估每个 candidate 时仅针对 base policy 上的 task metric 打分，不测试该编辑在与其他已接受编辑组合后是否仍然安全。这一缺口的根本原因是：这些方法将 prompt optimization 建模为独立候选的选择问题，而非 sequential composition 问题，因此 isolated gain 被视为 persistence 的充分证据——而本文证明这一假设在 executable agent 场景下失效。\n\n第二类是 search- and reflection-based proposers，如 PromptAgent (Wang et al., 2024b) 的 Monte Carlo tree search、Promptbreeder (Fernando et al., 2023) 的 co-evolution、SPO (Xiang et al., 2025) 的 pairwise judge 比较，以及 Trace/OptoPrime (Cheng et al., 2024) 将 execution traces 视为 \"gradients\" 的优化框架。这些方法针对当前 task loss 联合优化参数，但不保留一个 versioned accepted prefix 作为新候选必须通过的安全基准。换言之，它们无法区分\"依赖当前参数状态的增益\"与\"能跨已接受编辑组合的增益\"。此外，这些方法依赖 LLM-driven 的开放式 proposal，在 executable workflow 场景中搜索空间膨胀速度远超 replay gate 的安全过滤能力。\n\n第三类是 persistent skill and prompt evolution 系统，包括 Voyager (Wang et al., 2023) 的 lifelong skill library、Reflexion (Shinn et al., 2023) 的 verbal reinforcement、ExpeL (Zhao et al., 2024) 的 free-form insight accumulation、ADAS (Hu et al., 2024) 的 meta-agent programming、Agent Workflow Memory (Wang et al., 2024c) 以及 AutoGuide (Fu et al., 2024)。这些系统证明了 acquired text 可以跨任务携带 non-trivial 行为变化，但它们共同的关键缺陷是：任何在 demonstration 上改善 performance 的 skill、reflection、guideline 或 workflow 都被直接保留，而不经过针对 evolving accepted prefix 的 replay-based falsifiability test。这一缺口并非简单的工程疏忽，而是因为这些问题在先前设定中未被清晰定义——先前系统的 deployment target 多为 free-form response 或 browser trajectory，不涉及 schema-validated executable workflow 中 service validity、structural correctness、edit locality、resource resolution 与 execution cost 之间的多维张力。\n\n与 RIPPLE 最接近的方法是同样使用 explicit promotion rules 的 GRASP (Moll et al., 2026)、SkillGen (Ma et al., 2026)、SkillOpt (Yang et al., 2026) 和 PACE (Shawn, 2026)。GRASP 诱导 open-vocabulary failure taxonomy 并在 hard regression budget 下 promote 候选，但使用 run-specific 开放词汇而非固定的六族 workflow failure taxonomy，且不将 reward 和 correctness 作为独立约束分别评估。SkillGen 通过 paired rollout 比较来决定 skill 是否持久化，但不评估候选在已接受编辑组合后的边际效应。SkillOpt 要求严格改进 disjoint selection score，tie 即拒绝，但优化的是 monolithic skill file 而非 segment-typed 的 bounded patch。这些方法在 promotion rule 层面与 RIPPLE 有形式相似性，但都未将两个关键要素联合解决：将 execution evidence 通过 deterministic taxonomy 局部化到特定 policy segment 的 bounded patch，以及在 advancing accepted prefix 上通过 two-signal replay gate（reward 和 correctness 分别约束）评估组合安全性。RIPPLE 的贡献正是将这两个决策解耦并联合处理：localization 约束 policy change 的引入位置，advancing replay 测试其组合后的行为效应是否仍然安全。", "core_insight": "### § 3 重建作者的思考路径\n\n作者面对的问题是：frozen-model agent 在生成可执行 workflow 时，如何在不更新权重的前提下持续改进 prompt policy。已有的 prompt optimization 方法（APE、OPRO、TextGrad、DSPy 等）本质上是在 base policy 上做 one-shot 候选搜索——提出一条新指令，在任务上测一下分数，分数高就保留。这条路径有一个被长期忽视的盲区：它默认\"一条 edit 在 base policy 上的表现能预测它在最终 policy 上的表现\"。\n\n作者 likely 从实际执行反馈中观察到了两个现象。第一个现象是：改了 prompt 里的某一条 tool-use 指令，本意只是让 agent 少做冗余 lookup，结果这条改动改变了 resource resolution 行为，进而改变了下游 workflow 结构，最终导致 validation 行为发生连锁变化。这正是 knowledge editing 文献中已记录的 ripple effect（Cohen et al., 2024），但在 prompt-level agent adaptation 中尚未被系统处理。第二个现象更隐蔽：两条各自有益的 edit 组合在一起后，其中一条会失效甚至有害。比如一条 patch 要求\"所有引用的 resource 必须解析为具体值\"，另一条 patch 说\"已存在的 identifier 可以跳过 lookup\"——单独看都合理，组合后后者会让 stale identifier 逃过前者的 revalidation，导致 service validation 失败。\n\n这两个现象指向同一个结构性问题：prompt adaptation 不是独立候选的选择问题，而是一个 sequential policy composition 问题。已有方法在 propose-and-select 框架下工作，但它们的 select 阶段评估的是 isolated gain，而非 composition 后的 marginal effect。GRASP、SkillGen、SkillOpt 等更近的工作引入了 promotion rule，但它们的 gate 要么只看单一 reward signal，要么评估基准固定在 base policy 而非 evolving accepted prefix，因此无法检测 composition-induced 的 destructive interaction。\n\n作者还需要解决另一个前置问题：execution failure 到 policy edit 之间的映射。一个低 reward 或 validation failure 只告诉你\"这次执行失败了\"，但不告诉你该改 prompt 的哪个部分。不同类型的失败——missing clarification、tool error、schema violation、repair failure、out-of-scope edit、incomplete output——对应不同的 policy segment。如果没有确定性的 diagnosis 机制，candidate proposal 就退化为 open-ended prompt rewriting，搜索空间远超 replay gate 能安全过滤的范围。\n\n综合这些线索，作者的推理路径收敛为：将 adaptation 拆成三个决策——what failed（用 deterministic taxonomy 诊断 trajectory）、where to edit（将诊断映射到 predefined policy segment 并从 versioned library 检索 bounded patch）、whether to persist（在 evolving accepted prefix 上做 replay 评估，同时检查 reward 和 correctness 两个 signal）。关键创新在于第三个决策：replay 不是在 base policy 上测，而是在所有已接受 patch 组合后的 policy 上测，这样 composition-induced 的 destructive interaction 就会在 commit 之前暴露出来。\n\n### § 4 核心 Intuition\n\n一条 prompt edit 的价值不是固定的，而是依赖于它将被嵌入的那个 policy context——同样的 edit 在 base policy 上有益，在已有其他 edit 的 policy 上可能有害，因为 edit 之间会通过下游执行产生非局部交互。因此，判断一条 edit 是否应该 persist，不能看它在 isolation 中的表现，必须把它放到所有已接受 edit 组合后的 policy 上重新执行 replay，只有在这个真实部署状态下仍然安全的 edit 才能保留。这就是 RIPPLE 的核心：把 prompt adaptation 从\"选好候选\"变成\"在 evolving policy 上验证 composition safety\"。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n  D_train + πk\n       │\n       ▼\n  Rollout 采样(N=3) ──► reward 方差排序 ──► 选 B_diag 条低 reward 轨迹\n       │\n       ▼\n  ┌─ Phase 1: WHAT failed ──────────────────────────────┐\n  │ Predicate 诊断 → 失败家族 f∈{F1..F6}, 证据 z(τ)     │\n  └──────────────┬──────────────────────────────────────┘\n                 ▼\n  ┌─ Phase 2: WHERE to edit ────────────────────────────┐\n  │ Localize(f,z)→segment s; Retrieve(L,f,s)→patch a    │\n  │ Coverage-first 排序 → 候选集 Ak                      │\n  └──────────────┬──────────────────────────────────────┘\n                 ▼\n  ┌─ Phase 3a: 训练侧预筛 (共享父策略 πk) ──────────────┐\n  │ ∆train(a)\u003E0? 按 ∆train 降序 → A+k                   │\n  └──────────────┬──────────────────────────────────────┘\n                 ▼\n  ┌─ Phase 3b: Replay 侧 Promotion (advancing prefix) ──┐\n  │ 在 Pk[\u003Cj] 上评估 aj: ∆g_R≥εR AND ∆g_C≥εC?          │\n  │   接受 → 前缀推进 Pk←Pk‖(aj)                         │\n  │   拒绝 → 前缀不变                                    │\n  └──────────────┬──────────────────────────────────────┘\n                 ▼\n          πk+1 = πk ⊕ Pk ──► 迭代 (连续2次无接受则停)\n```\n\n**步骤 1 — Rollout 生成与信息轨迹选择（§3.1, Algorithm 1 Phase 1）。** 输入为训练池 $D_{\\text{train}}$ 和当前策略 $\\pi_k$。对每个 datapoint 采样 $N=3$ 条轨迹，记录 interaction trace、生成 workflow、validator feedback 和 execution cost。计算每个 datapoint 的 rollout-level reward 方差，选方差最高的 $B_{\\text{diag}}=15$ 个 datapoint，取每个的最低 reward 轨迹。高方差意味着当前策略行为不一致，最低 reward 轨迹则提供具体的失败 trace。输出为待诊断轨迹集 $T_k$。\n\n**步骤 2 — WHAT failed: Predicate-based 诊断（§3.1）。** 输入为单条轨迹 $\\tau$。用确定性 Python 规则（无 LLM 调用）检查 execution log，匹配六个预定义失败家族：F1 Clarification、F2 Tool use、F3 Schema、F4 Repair、F5 Edit locality、F6 Completeness。Direct evidence 优先于 consequence fallback；当多个家族触发时，按 task-specific 优先级选取 causally earliest 的作为 primary label，其余保留为 secondary。输出为失败家族集合 $F(\\tau)$ 和证据记录 $z(\\tau)$。\n\n**步骤 3 — WHERE to edit: Segment-typed patch 构造（§3.2）。** 输入为 $F(\\tau)$ 和 $z(\\tau)$。首先通过 `Localize(f, z)` 将每个失败家族映射到七个预定义 prompt segment 之一（REQ_UNDERSTANDING、CLARIFY、PLAN、TOOL_USE、EDIT、VALIDATE、FINAL_OUTPUT）。然后从版本化 patch 库 $\\mathcal{L}$（23 条预注册条目）中 `Retrieve(L, f, s)` 检索匹配的 bounded instruction，直接 append 到目标 segment，不调用 LLM
