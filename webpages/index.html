具体内容。\n    *   **输出：** Agent 基于 `chapter-01.md` 的内容生成答案。\n    *   *特点：* 只有被选中的章节内容才会进入 Context，节省 Token。\n\n*   **策略 C: Hierarchical Disclosure（分层渐进式披露）**\n    *   **输入：** 沙盒中有一个顶层 `SKILL.md`（Meta-router）和多个子文件夹（每个章节是一个独立的 Skill，如 `chapter-01/SKILL.md`）。\n    *   **处理：**\n        1.  **Discovery（发现）：** Agent 的 Context 中始终加载顶层 `SKILL.md` 的描述 **以及** 所有子章节 `SKILL.md` 的描述（Always-loaded）。这意味着所有 31 个章节的摘要都常驻 Context。\n        2.  **Routing（路由）：** Agent 在常驻的摘要中匹配问题，定位到 `chapter-01`。\n        3.  **Execution（执行）：** Agent 加载 `chapter-01/SKILL.md` 的 Body（即章节内容）。\n    *   **输出：** Agent 基于章节内容生成答案。\n    *   *特点：* 路由更直接（少一步读取目录），但所有章节摘要占用大量 Context 空间。\n\n**3. 评估环境：LOONGDOC**\n*   这是一个基于 **BenchFlow** 构建的交互式环境。\n*   Agent 通过文件系统（File System）与文档交互，而不是直接接收文本输入。\n*   系统记录 Agent 的完整轨迹（Trajectory），包括调用了哪些工具、打开了哪些文件、消耗了多少 Token。\n*   最终答案由确定性验证器（Deterministic Verifier）评分。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文是一篇实证研究（Empirical Study），主要关注系统架构设计和实验评估，**不包含核心数学推导或形式化理论证明**。因此，跳过此节。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n*   **问题一：** 对于长文档理解任务，**Progressive Disclosure**（通过 Agent Skills 机制）是否真的有效？它是否优于传统的 RAG 或原始文档导航？\n*   **问题二：** 在构建 Skill Pack 时，哪种结构设计最好？是单层索引（Flat）还是多层递归索引（Hierarchical）？\n*   **问题三：** 这种机制在单本书和图书馆规模（Library Scale，多本书）下的表现有何不同？\n\n**2. 设计了什么实验验证这个问题？**\n*   **基准测试：** 使用 **∞ Bench**，一个包含长文档（书籍）的问答基准。\n*   **变量控制：**\n    *   **方法对比：** Raw（原始导航）、Flat（单层披露）、Hierarchical（分层披露）、Hybrid-RAG（传统检索基线）。\n    *   **Agent Harnesses：** 测试了三种不同的 Agent 框架：**Codex**（强导航能力）、**Pi**（弱导航能力）、**Claude-Code**。\n    *   **模型家族：** 测试了 gpt-5.4-mini, qwen3.6-27b, claude-haiku-4.5 等模型。\n    *   **规模扩展：** 从单本书（K=1）扩展到多本书库（K=5, 10, 20），测试 Agent 在大规模语料库中的定位能力。\n*   **评估指标：** 准确率（Accuracy）、成本（Cost per question）、Token 消耗。\n\n**3. 问题的答案是什么？**\n*   **结论一：Progressive Disclosure 的效果取决于 Agent 的原生导航能力。**\n    *   对于导航能力强的 Agent（如 Codex），在单本书任务上，Flat 披露带来的增益几乎为零，因为 Agent 已经能通过 `grep` 等工具高效定位信息。\n    *   对于导航能力弱的 Agent（如 Pi, Claude-Code），Flat 披露显著提升了准确率，因为它提供了结构化的路由指引。\n*   **结论二：单层披露（Flat）优于分层披露（Hierarchical）。**\n    *   Hierarchical 结构将所有章节描述常驻 Context，导致 Context 饱和，反而降低了准确率（尤其在 Pi 上从 0.91 降至 0.64）。\n    *   Flat 结构仅在激活时加载章节描述，更节省 Context，且在大多数情况下表现更好或持平。\n    *   **核心观点：** Progressive Disclosure 购买的是 **Context**（上下文空间），而不是 **Intelligence**（智能）。它不能替代 Agent 的推理能力，但能缓解 Context Window 的压力。\n*   **结论三：在图书馆规模（Library Scale）下，Flat 披露至关重要。**\n    *   当语料库扩展到 20 本书时，Raw 导航的准确率急剧下降（En.QA 从 0.65 降至 0.26），因为 Agent 无法在海量文件中有效定位目标书籍。\n    *   Flat 披露通过预构建的书籍级索引，帮助 Agent 快速定位目标书籍，显著缓解了性能衰减（En.QA 保持在 0.46）。\n    *   Hierarchical 在大规模下同样失效，因为过多的常驻描述挤占了 Context。\n*   **最终建议：** 对于长文档 Agent 应用，推荐使用 **Flat Progressive Disclosure**（单层 Skill Pack）。它简单、高效，且在语料库规模增大时能提供决定性的性能优势。不需要复杂的分层结构。", "additional_insights": "### § 8 Take-aways\n\nProgressive disclosure via Agent Skills acts as a context management mechanism rather than an intelligence booster, providing negligible gains for single-book tasks when using strong agent harnesses like Codex that natively perform efficient `grep`-based retrieval. However, in library-scale scenarios involving multiple books, flat progressive disclosure becomes decisive by preventing the agent from drowning in irrelevant context, significantly outperforming raw document navigation in accuracy and cost-efficiency. Hierarchical disclosure, which loads per-chunk descriptions into the always-in-context window, consistently underperforms or matches flat disclosure because the accumulated metadata saturates the context window, negating the benefits of progressive loading. The effectiveness of progressive disclosure is highly harness-dependent; it compensates for weak native navigation capabilities in agents like Pi and Claude-Code but is redundant for agents that already implement robust locate-then-read strategies. Consequently, the optimal strategy for packaging long documents is a single-level flat skill pack, as deeper routing levels introduce unnecessary context overhead without improving routing accuracy.\n\n### § 9 最脆弱的假设\n\n该研究最脆弱的假设是**Agent Skills 的路由元数据（routing metadata）能够被 LLM 准确生成并有效指导导航，且这种基于文本描述的路由在大规模语料库中优于基于向量或关键词的检索**。如果 LLM 生成的章节描述（chunk descriptions）存在幻觉、遗漏关键实体或过于模糊，Agent 将无法通过 `SKILL.md` 中的索引定位到正确的片段，导致 progressive disclosure 失效甚至误导 Agent。论文通过固定使用 `book-to-skill` 流水线生成描述来规避部分变异性，但未充分验证不同 LLM 生成描述质量对最终性能的敏感性；如果描述质量下降，flat disclosure 的优势可能迅速消失。此外，假设 Agent 能够完美解析文件系统结构并遵循技能包的指令，这依赖于 Agent 具备较强的工具使用能力和指令遵循能力，若 Agent 本身无法可靠地执行文件读取操作，整个机制将崩溃。论文提供的证据主要基于特定模型（如 gpt-5.4-mini, claude-haiku-4.5）在标准基准上的表现，缺乏对描述生成错误率的直接分析，也未测试在描述质量受损情况下的鲁棒性。\n\n### § 10 最小复现实验\n\n在 1 周内，你可以使用 **∞ Bench** 中的单本书（如 *Frankenstein*）和 **Claude-Code** 或 **Pi** 作为 Agent harness，复现 **raw** 与 **flat** 两种配置在单书 QA 任务上的对比。首先，按照论文附录 A.2 的提示词，使用一个轻量级 LLM（如 Llama-3-8B）生成章节描述并构建 flat skill pack，同时保留原始文本作为 raw 配置。然后，在 LOONGDOC 环境或类似的沙盒文件系统中，让 Agent 回答一组 En.QA 问题，记录其准确率、Token 消耗和工具调用轨迹。如果 flat 配置的准确率显著高于 raw，且 Agent 在 raw 模式下表现出低效的全书扫描行为，则支持论文关于 progressive disclosure 补偿弱导航能力的 claim；如果两者准确率无显著差异，或 flat 配置因描述质量差导致准确率下降，则反驳了该机制的普适性。此实验无需复现完整的 hierarchical 结构或多书扩展，即可验证核心机制的有效性。", "research_value": "### § 11 最强反例设计\n\n要挑战这篇论文的核心结论，最有力的攻击点在于其**评估环境的封闭性**与**元数据生成的静态假设**之间的脱节。论文声称 **Flat Progressive Disclosure** 在 **Library Scale** 下优于 **Raw Navigation**，但其实验依赖于预先通过 LLM 生成的、高度结构化的 `SKILL.md` 描述。一个极具破坏力的反例场景是**动态更新或噪声极大的企业知识库（Dynamic/Noisy Enterprise Knowledge Base）**。\n\n具体而言，可以设计一个实验，其中文档内容在 Agent 运行期间发生高频更新，或者文档本身缺乏清晰的章节结构（如非结构化日志、代码库或法律合同），导致 `Book-to-Skill` 流水线生成的描述存在高噪声或滞后性。在这种场景下，**Flat Disclosure** 的“路由元数据”不再是可靠的索引，而是引入了**误导性先验（Misleading Priors）**。如果 Agent 依赖错误的 `SKILL.md` 描述定位到错误的文件，它将陷入“确认偏误”，忽略其他可能包含正确答案的文件，而 **Raw Navigation** 结合强大的搜索工具（如 `grep` 或全文检索）反而能通过关键词匹配找到正确片段，尽管效率较低但鲁棒性更高。\n\n此外，论文忽略了**检索增强生成（RAG）与 Agent 导航的混合优势**。一个更强大的基线不是单纯的 **Hybrid RAG**，而是 **Vector-Indexed Agent Navigation**。如果我们在 **Flat Disclosure** 的基础上，不仅提供文本描述，还提供每个 chunk 的向量嵌入索引，允许 Agent 在激活 Skill 后使用语义搜索而非仅靠文本匹配来定位章节，那么 **Hierarchical** 或更复杂的结构可能会重新获得优势，因为向量索引可以解决长尾实体匹配问题，而纯文本描述往往遗漏细微的语义关联。论文将 **Progressive Disclosure** 简化为“文本目录导航”，忽略了现代 Agent 可以利用的语义检索能力，从而低估了更复杂结构在语义模糊查询下的潜力。\n\n### § 12 Follow-up Research Idea\n\n基于论文揭示的 **Progressive Disclosure** 本质上是“上下文管理”而非“智能增强”的局限，以及其对静态元数据的依赖，我提出一个新的研究方向：**Adaptive Context-Optimal Routing (ACOR)**，即**自适应上下文最优路由**。\n\n**(a) 驱动局限：** 现有方法（包括本文的 Flat/Hierarchical）采用静态的、预定义的路由结构。然而，不同查询的**信息密度（Information Density）**和**推理深度（Reasoning Depth）**差异巨大。简单事实查询需要极少的上下文，而复杂推理需要跨多个 chunk 的综合信息。静态结构要么导致上下文浪费（加载过多无关描述），要么导致信息不足（需要多次往返）。此外，论文未解决**元数据质量动态变化**的问题。\n\n**(b) 借鉴领域：** 借鉴**强化学习（Reinforcement Learning, RL）**中的**部分可观测马尔可夫决策过程（POMDP）**框架，以及**信息论**中的**互信息（Mutual Information）**最大化原则。将 Agent 的文档导航过程建模为一个序列决策问题，其中每个动作（读取描述、加载 chunk、搜索）都有成本（Token 消耗）和收益（信息增益）。\n\n**(c) 实验设计：**\n1.  **构建动态 Skill Graph：** 不再使用固定的 Flat 或 Hierarchical 结构，而是构建一个**动态技能图（Dynamic Skill Graph）**，其中节点是文档 chunk，边是语义相似度或引用关系。\n2.  **训练路由策略网络（Router Policy Network）：** 训练一个轻量级的 **Router Policy**，输入为当前查询和已加载的上下文摘要，输出为下一步最佳动作（如：加载哪个 chunk 的描述、是否进行向量搜索、是否终止）。该策略通过 **RL** 优化，奖励函数为：`Accuracy - λ * Token_Cost`。\n3.  **对比实验：** 在 **∞ Bench** 上，对比 **ACOR** 与 **Flat Disclosure**、**Hierarchical Disclosure** 以及 **Raw Navigation**。重点评估在**复杂推理任务**（需要跨章节整合信息）和**噪声元数据场景**下的表现。预期 **ACOR** 能够根据查询复杂度动态调整路由深度和广度，在简单查询时表现如 **Flat** 般高效，在复杂查询时自动展开更深层的探索，从而打破“单层最优”的静态结论，实现真正的**上下文自适应（Context-Adaptive）**导航。\n\n这一方向将 **Agent Skills** 从静态的“文件组织方式”提升为动态的“信息获取策略”，解决了论文中未涉及的**查询异质性（Query Heterogeneity）**问题，并为未来 Agent 在大规模、动态知识库中的高效导航提供了新的理论框架。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Yifeng He\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"**\"\n      ]\n    },\n    {\n      \"name\": \"Yinzhe Zhao\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"[*]\",\n        \"**\"\n      ]\n    },\n    {\n      \"name\": \"Jicheng Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"**\"\n      ]\n    },\n    {\n      \"name\": \"Hao Chen\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"University of California, Davis\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Zhejiang University\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"The University of Hong Kong\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"[*]\",\n      \"text\": \"Work done while interning at UC Davis.\"\n    },\n    {\n      \"marker\": \"**\",\n      \"text\": \"Equal contribution\"\n    }\n  ]\n}\n```", "summary_translation": "长文档问答通常迫使人们在将整篇文档加载到上下文窗口与附加一个独立的检索器之间做出选择。Agentic AI 提出了一个更广泛的选项，即向 agent 提供文档路径，并让其自行决定如何阅读以及阅读什么内容。Agent Skills 是一种将专业知识打包到 agent 按需加载的文件夹中的标准，它提供了一种现成的机制：progressive disclosure，该机制仅暴露查询所需的内容，从简短描述到具体段落层层展开。从业者在书籍长度的理解任务中迅速采用了这种模式，但支持此类选择的证据多为轶事。我们对该模式进行了首次受控研究，在 InfiniteBench 上，跨越三个 agent harnesses 和三个模型家族，将原始文档导航和几种 Agent Skills 包设计与经典混合检索器进行了比较。在单本书上，增益取决于 harness，当 agent 对原始文档的导航能力较差时增益很大，但当强大的 agent harness 已经能够自行分割和检索时增益接近于零。当扩展到跨越多本书的任务时，原始文档导航崩溃，而一级 progressive disclosure 退化得更慢并领先。第二层更深的路由层级从未带来帮助，有时甚至会直接破坏准确性，因此一层就足够了。Progressive disclosure 购买的是上下文，而非智能：当强大的 agent 能够自行定位正确段落时，它是多余的；一旦语料库大到无法通过阅读进行导航，它便成为决定性因素。"}, {"title": "Self-Evolving Just-In-Time Memory for Proactive Embodied Safety", "arxiv_id": "2607.16247", "authors": "Bingrui Sima, Lizhong Wang, Xiaoya Lu, Kun He, Xiao Yang", "summary": "While Vision-Language Models (VLMs) have empowered embodied agents to execute complex household tasks, they struggle to proactively handle dynamically emerging hazards during closed-loop interactions. Existing safety approaches often rely on runtime guardrails to block unsafe actions or induce excessive caution, which severely stalls task progress instead of actively resolving the underlying risks. To break this safety-progress trade-off, we introduce the Self-Evolving Just-In-Time Memory framework, which reframes embodied safety from progress-stalling guardrails to proactive hazard mitigation. The framework consists of a Risk-Sufficient Topological Belief Graph (RSG) for persistent safety-relevant state tracking under partial observability, an Agency-Grounded Factual Memory for precise hazard anticipation, and an Experience Memory that injects procedural Meta-Skills to guide executable, progress-preserving mitigation. Furthermore, we propose an automated Test-Verify-Write loop, allowing agents to continually refine their mitigation Meta-Skills from execution traces at test time. Experiments on IS-Bench demonstrate that our framework substantially boosts the Safe-Success rate across multiple VLM backbones (e.g., +30.3% on Qwen3-VL-8B), enabling agents to proactively mitigate hazards without stalling task progress. Code is available at https://github.com/DyMessi/JIT-Memory.", "category": "cs.LG", "cluster": "Context Handling \u0026 Long-Horizon Planning", "tags": ["cs.LG"], "filter_reason": "该论文完全符合“LLM智能体及其演化”的研究范围，具体依据如下：\n\n1.  核心对象为具身智能体 (Embodied Agent)：论文明确针对“Embodied Agents”在家庭任务中的表现进行研究，属于Agentic AI的重要子领域。\n2.  核心机制为自我演化 (Self-Evolving)：标题和摘要中明确提出了“Self-Evolving Just-In-Time Memory”框架。其核心贡献在于提出了一种“Test-Verify-Write”循环机制，允许智能体在测试时（test-time）从执行轨迹中持续提炼和更新其缓解风险的“Meta-Skills”（元技能）。这直接对应了筛选标准中关于“自我演化”、“通过经验/反馈进行自我完善”以及“harness/scaffold的自动改进”的定义。\n3.  涉及智能体关键能力 (Memory \u0026 Planning)：论文设计了多种记忆模块（Topological Belief Graph, Factual Memory, Experience Memory）来支持智能体的主动风险规避和长期决策，这属于智能体规划、记忆和工具使用能力的改进。\n4.  排除项辨析：虽然标题包含“Safety”，但根据筛选标准第四步和第三步的例外说明，如果安全是研究智能体能力边界或失败模式的场景，且核心贡献是智能体机制（此处为自我演化的记忆和技能获取机制），则不应排除。此外，虽然涉及VLM，但VLM仅作为智能体的感知/推理后端，研究核心在于智能体的记忆架构和自我演化逻辑，而非视觉模型本身。\n\n综上，该论文研究的是具身智能体如何通过自我演化机制（Test-Verify-Write loop）改进其记忆和技能以应对动态环境，完全契合“构建、改进、演化 LLM智能体”的核心目标。", "intro_logic": "### § 1 研究问题与重要性\n\n本文针对的核心研究问题是：在部分可观测（POMDP）的闭环交互环境中，如何让基于视觉语言模型（VLMs）的具身智能体（Embodied Agents）在保持任务进度的同时，主动识别并缓解动态涌现的物理风险（Dynamically Emerging Hazards）。现有的具身安全研究主要关注“恶意目标安全”（Malicious-Goal Safety），即通过运行时护栏（Runtime Guardrails）直接拒绝或阻断不安全指令。然而，在真实的家庭场景中，任务目标通常是良性的（Benign-Goal），风险往往源于环境状态的变化或动作与状态的耦合（例如，盘子是干净的，但上面有灰尘，若直接放置食物则构成风险）。这种“良性目标交互安全”（Benign-Goal Interactive Safety）要求智能体不仅不能简单中止任务，还必须在不牺牲任务效率的前提下，主动执行缓解步骤（如先擦拭盘子再放置食物）。\n\n这一问题的重要性在于打破了传统安全机制中“安全”与“进度”之间的零和博弈（Safety–Progress Trade-off）。现有的防御机制往往将安全等同于任务拒绝，导致智能体在面对潜在风险时表现出过度的谨慎（Excessive Caution），从而严重阻碍任务完成。解决这一问题能够赋予智能体“主动安全”（Proactive Safety）能力，使其能够在复杂、动态的物理世界中实现高效且安全的长期自主操作。其价值体现在两个方面：一是提升了智能体在真实家庭环境中的实用性和可靠性，使其能够处理如“水龙头未关”、“易燃物靠近热源”等持续性或情境性风险；二是通过引入自演进的记忆机制，降低了人工标注安全策略的成本，为构建具备自我改进能力的具身智能系统提供了可扩展的基础架构。\n\n### § 2 前人工作与不足\n\n尽管具身智能的安全性和记忆增强规划已有大量研究，但现有方法在处理良性目标下的动态交互风险时存在显著不足。\n\n首先，在安全范式方面，主流方法如 **Agentspec** [18] 和 **Plug in the Safety Chip** [27] 主要依赖线性时序逻辑（LTL）或领域特定语言（DSL）作为运行时护栏。这些方法擅长拦截显式的恶意指令（如“将水倒在电器上”），但其本质是反应式的（Reactive）和阻断性的。它们无法处理语义中性指令中因环境状态变化而动态产生的风险，因为这类风险并非指令本身错误，而是执行过程中的状态耦合问题。例如，**SafeAgentBench** [28] 和 **BadRobot** [30] 等基准主要评估智能体对危险指令的拒绝能力，缺乏对“在任务进行中主动缓解风险”这一能力的评估，导致现有模型在面对 **IS-Bench** [9] 中定义的良性目标交互风险时，往往因缺乏主动缓解策略而失败或过度保守。\n\n其次，在记忆增强规划方面，如 **KARMA** [21]、**RoboMemory** [8] 和 **Voyager** [17] 等框架虽然通过双记忆架构或技能库增强了长期规划能力，但它们主要优化的是任务完成率和场景重建，缺乏对安全相关状态的主动追踪和意图条件化的风险预判。这些方法通常依赖密集的场景重建或基于语义相似性的检索，导致在部分可观测环境下容易出现感知遗忘（Perceptual Forgetting），无法持久追踪被遮挡的危险状态（如关闭柜门后内部物品的状态）。此外，**Safe-CoT** [9] 等基线方法虽然引入了逐步安全推理，但往往导致智能体在每个步骤都进行过度检查，严重降低了任务成功率（Task Success），未能实现“即时”（Just-In-Time）且“保进度”的安全干预。\n\n最后，现有方法缺乏将抽象安全规范转化为可执行、可验证的程序化知识（Procedural Meta-Skills）的机制。传统方法要么依赖静态的安全提示，要么检索原始的经验轨迹（Episodic Trajectories），前者缺乏具体的执行指导（Grounding），后者泛化能力差且难以适应新环境。本文指出的关键缺口在于：缺乏一种能够结合状态-意图耦合（State-Intent Coupling）进行精确触发，并通过测试时自演进（Test-Time Evolution）不断精炼缓解策略（Mitigation Meta-Skills）的系统化框架。因此，尽管前人工作在特定维度上有所进展，但未能同时解决持久状态追踪、意图条件化风险预判以及可执行缓解指导这三个协同能力的需求，导致在良性目标交互安全场景下表现不佳。", "core_insight": "### § 3 重建作者的思考路径\n\n在现有的具身智能（Embodied AI）研究中，基于 Vision-Language Models (VLMs) 的代理在长程任务规划上已取得显著进展，但在“交互式安全”（Interactive Safety）方面存在明显的范式缺陷。现有的安全机制主要分为两类：一类是针对恶意指令的运行时护栏（Runtime Guardrails），如 Agentspec 或 Plug in the Safety Chip，它们通过线性时序逻辑（LTL）或领域特定语言（DSL）直接阻断不安全行为；另一类是针对良性目标但环境动态变化的场景，如 Safe-CoT，通过注入全局安全提示或逐步推理来增强安全性。然而，这两种方法都陷入了“安全-进度权衡”（Safety-Progress Trade-off）的困境：护栏机制过于保守，导致任务因过度谨慎而停滞（Stalling）；而基于语义相似度的记忆检索或全局提示则缺乏对局部动态风险的精确感知，容易在部分可观测（POMDP）环境下产生“感知遗忘”（Perceptual Forgetting），即忽略被遮挡或已发生状态变化的潜在风险。\n\n作者观察到，真正的交互式安全并非环境的固有属性，而是环境状态与代理意图（Agency/Intent）的二元函数。例如，一个布满灰尘的盘子本身是安全的，只有当代理意图将食物放置其上时，它才构成“情境风险”（Situational Risk）；而一个未关闭的水龙头则是“时间风险”（Temporal Risk），需要在任务结束前解决。现有的 VLM 代理缺乏三种关键能力来应对这种动态性：一是跨时间步的持久状态跟踪（Persistent State Tracking），以克服部分可观测性带来的遗忘；二是基于意图的条件化风险预判（Intent-conditioned Hazard Anticipation），以区分当前状态与未来动作耦合后的风险；三是可执行的缓解指导（Executable Mitigation Guidance），即不仅知道“什么”是危险的，还要知道“如何”在不中断任务进度的情况下“何时”进行缓解。\n\n因此，作者认为需要一种“即时”（Just-In-Time）的记忆机制，而非全局的、静态的安全规则。这种机制应当只在特定的状态-意图耦合触发时才激活，从而避免过度干预。同时，为了克服 VLM 在长程交互中的幻觉和遗忘，需要一种结构化的工作记忆（Working Memory）来维护风险相关的拓扑信念，而不是依赖密集的视觉重解析。此外，经验不应以原始的轨迹片段（Episodic Trajectories）存储，因为缺乏泛化性，而应提炼为去情境化的程序性元技能（Procedural Meta-Skills），并通过测试时的验证循环（Test-Verify-Write Loop）不断进化，从而在无需人工标注的情况下实现安全能力的自演进。\n\n### § 4 核心 Intuition\n\n这篇论文的核心直觉在于将具身安全从“被动阻断”重构为“主动缓解”，通过解耦环境状态与代理意图，实现仅在风险真正触发时的“即时”干预，从而打破安全与任务进度之间的零和博弈。具体而言，它利用结构化的拓扑信念图（RSG）在部分可观测环境中持久追踪风险状态，避免感知遗忘；并通过将抽象的安全规范编译为与动作空间对齐的可验证规则，结合去情境化的程序性元技能（Meta-Skills），为代理提供精确的“如何”与“何时”缓解风险的执行指导。这种设计使得代理能够在不牺牲任务效率的前提下，通过测试时的自验证循环不断进化其安全缓解策略，实现从“过度谨慎”到“高效安全”的转变。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法是 **Self-Evolving Just-In-Time Memory** 框架，旨在解决具身智能体（Embodied Agents）在执行任务时面临的“安全与进度权衡”问题。该方法不再依赖阻断任务的运行时护栏（Runtime Guardrails），而是通过一种“即时”记忆机制，在检测到潜在风险时主动介入，以最小化对任务进度的干扰。\n\n完整的 Pipeline 包含三个核心记忆模块和一个自进化循环，具体流程如下：\n\n1.  **输入与状态追踪（Working Memory: RSG）**：\n    *   **输入**：智能体在每一步 $t$ 接收视觉观测 $o_t$ 并执行动作 $a_t$，同时生成预测的下一步意图 $\\tilde{a}_{t+1}$。\n    *   **处理**：系统利用一个辅助 VLM 更新 **Risk-Sufficient Topological Belief Graph (RSG)**。RSG 不重建整个场景，而是采用 **Action-Conditioned Patch Update** 机制。它提取当前动作和预测意图涉及的物体作为“焦点种子”，仅更新局部子图（如物体状态 `dusty`、拓扑关系 `ONTOP`）。这使得智能体能在部分可观测性（POMDP）下持久追踪被遮挡或历史遗留的安全相关状态。\n    *   **输出**：更新后的信念状态图 $G_{t+1}$。\n\n2.  **风险预判与触发（Factual Memory）**：\n    *   **输入**：更新后的 RSG 状态 $G_{t+1}$ 和预测意图 $\\tilde{a}_{t+1}$。\n    *   **处理**：**Agency-Grounded Factual Memory** 将抽象的人类安全规范编译为可计算的规则。它检查当前状态与意图的耦合是否触发 **Situational Risks**（情境风险，如“在脏盘子上放食物”），或是否存在 **Temporal Risks**（时间风险，如“水龙头未关”）。只有当规则被精确匹配时，记忆才被激活，避免过度谨慎。\n    *   **输出**：触发信号及对应的风险类型。\n\n3.  **缓解策略注入（Experience Memory）**：\n    *   **输入**：触发的风险规则。\n    *   **处理**：**Experience Memory** 注入去情境化的程序化 **Meta-Skills**。这些 Meta-Skills 包含具体的缓解指导（How）、接地信息（Grounding，如从 RSG 中查找清洁工具）和时机控制（Timing，如“先清洁再放置”）。\n    *   **输出**：修改后的规划提示（Prompt），引导智能体生成既安全又保持任务进度的实际动作 $a_{t+1}$。\n\n4.  **自进化循环（Test-Verify-Write Loop）**：\n    *   **处理**：任务结束后，系统利用历史 RSG 快照对执行轨迹进行程序化验证。成功的缓解案例被提取为因果补丁（Causal Case Patches），用于在测试时（Test-Time）自动更新和精炼 Meta-Skills，无需人工标注。\n\n**真实例子讲解：**\n假设任务是“把苹果放在盘子上”，但盘子是脏的（`dusty`）。\n*   **Step 1 (RSG)**：智能体看到盘子，RSG 记录节点 `plate` 的状态为 `dusty`，关系 `ONTOP(plate, countertop)`。\n*   **Step 2 (Factual)**：智能体计划执行 `PLACE_ON_TOP(apple, plate)`。Factual Memory 检测到规则 `F14: FOOD_ONLY_ON_CLEAN_PLACE` 被触发，因为 `dusty(plate)` 与 `PLACE` 意图耦合构成了情境风险。\n*   **Step 3 (Experience)**：系统注入 Meta-Skill，指导：“先找到清洁工具（Grounding），执行 `WIPE(plate, rag)`，然后再执行 `PLACE`（Timing）”。\n*   **Step 4 (Action)**：智能体实际执行 `WIPE`，随后 `PLACE`，任务成功且安全。\n*   **Step 5 (Evolution)**：如果之前智能体曾忘记关水龙头导致失败，该失败案例会被写入负向缓冲区，促使 Meta-Skill 进化，未来在类似任务中更早地安排关闭水龙头的动作。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的传统数学推导（如损失函数优化或概率分布推导），其核心在于**形式化定义（Formalization）**和**逻辑规则构建**。以下是其核心概念的理论背景与直觉解释：\n\n1.  **交互式风险的双分函数（Bipartite Function）**：\n    *   **公式直觉**：$Risk = f(State, Agency)$。\n    *   **解释**：传统观点认为风险仅存在于环境状态中（如“火是危险的”）。本文提出，风险是环境状态（State）与智能体意图（Agency/Intent）共同作用的函数。例如，“盘子是脏的”本身不是风险，只有当智能体意图“在盘子上放食物”时，它才成为风险。这解释了为什么需要“即时（Just-In-Time）”触发，而非全程监控。\n\n2.  **情境风险（Situational Risks, $h_{sit}$）**：\n    *   **公式直觉**：$h_{sit}(G_t, \\tilde{a}_{t+1}) = 1$ 当且仅当 当前信念图 $G_t$ 与意图 $\\tilde{a}_{t+1}$ 违反规则 $r \\in R_{sit}$。\n    *   **解释**：这是一种“负向可供性（Negative Affordance）”。它检查“如果我现在做这个动作，是否会立即造成危害”。例如，如果 $G_t$ 显示 `stove` 是 `toggled_on`，而意图是 `PLACE(flammable, stove)`，则触发风险。\n\n3.  **时间风险（Temporal Risks, $h_{tem}$）**：\n    *   **公式直觉**：$h_{tem}(G_t) = 1$ 当且仅当 $G_t$ 中存在持久不安全状态 $U$。\n    *   **解释**：这是一种“持久义务（Persistent Obligation）”。它不依赖于当前意图，而是要求智能体在任务结束前必须解决的状态。例如，`faucet` 是 `open`，无论智能体当前在做什么，它都必须记住在任务结束前关闭它。\n\n4.  **验证目标（Verification Target, $V_r$）**：\n    *   **公式直觉**：$V_r$ 是一个逻辑公式，用于验证风险是否被解决。\n    *   **解释**：对于情境风险，$V_r$ 要求在意图执行前状态变为安全（如 `not dusty(plate)`）；对于时间风险，$V_r$ 要求在任务终止前状态变为安全。这为自动化验证（Test-Verify-Write）提供了可计算的基准。\n\n### § 7 实验设计与结论\n\n**提出了什么问题：**\n现有的具身智能体安全方法（如 Safe-CoT）往往通过过度谨慎（Over-caution）来避免风险，导致任务成功率（Task Success, TS）大幅下降，无法在“安全性”和“任务进度”之间取得平衡。此外，现有方法缺乏对动态涌现风险（Emerging Hazards）的主动缓解能力，且难以从经验中自我进化。\n\n**设计了什么实验验证这个问题：**\n1.  **基准测试（IS-Bench）**：在包含 161 个语义中性家庭任务和 388 个潜在风险的 IS-Bench 上进行评估。对比基线包括 Vanilla（无安全机制）、Safe-CoT（逐步安全推理）以及专有模型（GPT-4o, GPT-5.2, Gemini）。\n2.  **消融实验（Ablation Study）**：\n    *   **触发机制**：对比本文的“状态-意图触发”与传统的“密集检索（Dense Retrieval）”，验证精确触发的重要性。\n    *   **工作记忆**：对比“补丁更新（Patch Update）”与“每步重解析（Per-step Re-parse）”，验证持久状态追踪对时间风险缓解的作用。\n    *   **经验格式**：对比“程序化 Meta-Skills”与“原始情景案例（Episodic Cases）”或“纯事实原则”，验证结构化指导的有效性。\n3.  **测试时进化分析（Test-Time Evolution）**：将数据集分为训练集和测试集，观察智能体在连续执行任务过程中，通过 Test-Verify-Write 循环，其 Safe Success (SS) 和 Task Success (TS) 随时间的变化趋势。\n\n**问题的答案是什么：**\n1.  **打破权衡**：本文方法在 Qwen3-VL-8B 上将 Safe Success (SS) 从 18.4% 提升至 48.7%（+30.3%），同时保持甚至提升了 Task Success (TS)（从 69.3% 提升至 71.3%），证明了主动缓解比被动阻断更有效。\n2.  **组件有效性**：\n    *   精确的状态-意图触发避免了密集检索带来的噪声和过度谨慎。\n    *   RSG 的补丁更新有效解决了部分可观测性下的“感知遗忘”问题，显著提升了时间风险（Post metric）的缓解率（从 46.2% 提升至 89.4%）。\n    *   程序化 Meta-Skills 比原始案例更具泛化性，能更好地指导新颖场景下的缓解行动。\n3.  **自进化能力**：实验显示，随着测试时进化循环的进行，智能体的 SS 和 TS 均呈现单调上升趋势。Meta-Skills 从最初的“过度反应”（如过早关闭冰箱）进化为“子任务感知”（Subtask-aware），实现了安全与进度的动态平衡。", "additional_insights": "### § 8 Take-aways\n\n本文提出了一种名为 Self-Evolving Just-In-Time Memory 的框架，旨在解决具身智能体在闭环交互中面临的“安全与进度权衡”难题，即传统方法往往通过阻断动作来保证安全，导致任务停滞。该框架将交互式安全形式化为环境状态与智能体意图（Agency）的二部函数，区分了由意图触发的 Situational Risks 和需要持续追踪的 Temporal Risks。为了实现这一目标，系统引入了 Risk-Sufficient Topological Belief Graph (RSG) 作为工作记忆，通过基于动作的局部补丁更新机制，在部分可观测环境下持久追踪与安全相关的状态，避免了全场景重建的计算开销和感知遗忘。Factual Memory 模块将抽象的安全规范编译为与智能体动作空间对齐的可计算规则，仅在状态与意图耦合时触发干预，从而实现了精准的 Just-In-Time 风险预判。Experience Memory 则存储去情境化的程序性 Meta-Skills，提供具体的缓解策略（How）、接地信息（Grounding）和时序安排（Timing），确保智能体在执行缓解动作时不中断主要任务进度。此外，系统包含一个自动化的 Test-Verify-Write 循环，利用历史 RSG 快照对执行轨迹进行程序化验证，无需人工标注即可从成功或失败的案例中挖掘因果片段，持续进化 Meta-Skills。在 IS-Bench 基准测试中，该方法显著提升了 Safe Success 率（例如在 Qwen3-VL-8B 上提升 30.3%），同时保持了较高的 Task Success 率，证明了其在多种 VLM 骨干模型上的有效性和可扩展性。\n\n### § 9 最脆弱的假设\n\n该方法最核心且脆弱的假设是：辅助 VLM 能够基于有限的视觉观测，准确且一致地构建并维护 Risk-Sufficient Topological Belief Graph (RSG)，特别是对于被遮挡或细微的安全相关状态（如 `dusty`, `open`, `toggled_on`）。如果这一假设不成立，即 RSG 出现感知错误、状态遗漏或拓扑关系误判，整个系统的逻辑链条将直接断裂：Factual Memory 将无法正确触发风险预警（漏报）或产生误报，Experience Memory 提供的 Meta-Skills 将基于错误的状态上下文执行，导致缓解动作无效甚至引发新的危险。论文在附录 D.2 中承认了这一局限性，指出在 IS-Bench 仿真环境中，图像质量有限且小物体或细粒度状态可能存在视觉歧义，导致 RSG 偶尔遗漏关键状态。虽然论文使用更强的 Qwen3-VL-32B 作为辅助模型以提供比 8B 模型更稳定的结构化感知，但这仅缓解了问题而未根本解决。在真实物理世界中，光照变化、动态遮挡和传感器噪声远比仿真环境复杂，VLM 的感知稳定性可能大幅下降，使得依赖精确符号化状态追踪的 RSG 难以可靠运行，从而导致整个 Just-In-Time 安全机制失效。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现并验证“基于 RSG 的局部补丁更新机制相比全场景重解析能更有效地保持长期状态一致性”这一核心 claim。具体方案如下：使用 IS-Bench 提供的仿真环境或类似的具身任务数据集，选取包含长时序依赖和遮挡场景的任务（如“从冰箱取物后关闭冰箱”或“擦拭脏盘子后放置食物”）。实现两个对比模块：一是本文提出的 Action-Conditioned Patch Update 机制，即仅根据当前动作和预测意图提取局部子图，由 VLM 生成增量补丁合并到全局 RSG；二是 Baseline 的 Per-step Re-parse 机制，即每一步都让 VLM 根据当前观测重新生成完整的场景图。测量指标为 Temporal Risk 的缓解成功率（对应 IS-Bench 的 Post 指标）以及 RSG 中关键状态（如 `open`, `dusty`）在遮挡期间的保持准确率。如果 Patch Update 机制在 Post 指标上显著高于 Re-parse 机制，且 RSG 状态在遮挡后仍正确保留，则支持了论文关于局部更新能克服感知遗忘和保持信念一致性的 claim；反之，若两者性能无显著差异或 Patch Update 因累积误差导致状态漂移，则反驳了该机制的有效性。此实验无需复现完整的 Meta-Skill 进化循环，仅聚焦于工作记忆的稳定性，即可验证系统基础架构的关键优势。", "research_value": "### § 11 最强反例设计\n\n若要挑战 **Self-Evolving Just-In-Time Memory** 框架的有效性，最有力的攻击点在于其核心假设——即 **Risk-Sufficient Topological Belief Graph (RSG)** 能够准确捕捉所有关键的安全相关状态。我会设计一个名为“**隐性状态耦合失效（Implicit State Coupling Failure）**”的反例场景，专门针对 RSG 的 **Action-Conditioned Patch Update** 机制的局限性。\n\n具体场景如下：在一个厨房环境中，任务是“将热汤倒入碗中”。RSG 能够正确追踪显性状态，如 `bowl` 是 `empty`，`soup` 是 `hot`，以及 `stove` 是 `off`。然而，存在一个隐性状态：`bowl` 的材质是 `thin_glass`（薄玻璃），且当前环境温度极低（例如刚从冰箱取出，状态为 `cold`）。现有的 RSG 构建通常依赖视觉观测提取物体属性和拓扑关系，但“薄玻璃遇热易碎”这一风险并非由单一物体的显性状态（如 `dusty` 或 `open`）直接触发，而是由**物体材质属性**与**环境热力学状态**的复杂耦合决定的。\n\n在这个反例中，**Factual Memory** 的规则库可能包含 `NO_HOT_LIQUID_IN_COLD_GLASS`，但 RSG 的 **Patch Update** 机制仅关注与当前动作（`POUR`）直接相关的物体（`bowl`, `soup`）。如果 VLM 在初始观测中未能将 `thin_glass` 标记为关键安全属性（因为视觉上它看起来只是一个普通的 `bowl`），或者未能持续追踪 `cold` 这一随时间衰减的状态，RSG 就会遗漏这一关键节点。当智能体执行 `POUR` 时，**Factual Memory** 检查 `bowl` 状态，发现没有显性的 `unsafe` 标签，因此不触发风险。结果，智能体执行动作，导致碗破裂，汤洒出，造成物理伤害和任务失败。\n\n这个反例的攻击力在于：它证明了 **Just-In-Time** 触发机制依赖于 **RSG** 的完备性。如果 RSG 无法通过局部补丁更新捕捉到非显性、非拓扑的隐性状态（如材质热容、微观裂纹、化学兼容性），那么整个系统的“主动安全”就会退化为“盲目执行”。此外，**Test-Verify-Write** 循环虽然能记录失败，但很难从一次“碗破裂”的失败中自动归纳出“薄玻璃遇热易碎”这一通用 **Meta-Skill**，因为这需要物理常识推理，而不仅仅是轨迹回放。因此，该方法在处理需要深层物理因果推理而非表面状态匹配的风险时，会可预测地失败。\n\n### § 12 Follow-up Research Idea\n\n基于上述局限，我提出一个全新的研究方向：**Physics-Informed Causal Reasoning for Embodied Safety (PICRES)**，即“基于物理因果推理的具身安全框架”。\n\n**(a) 驱动局限与未满足需求：**\n现有方法（包括本文的 JIT-Memory）主要依赖**符号化状态匹配**（Symbolic State Matching）和**经验检索**（Experience Retrieval）来规避风险。这种方法在面对显性、静态风险（如“盘子脏”）时有效，但在面对隐性、动态、基于物理定律的风险（如“热汤倒入冷玻璃”、“湿手触碰插座”）时失效。根本原因是 VLM 缺乏对物理世界因果机制（Causal Mechanisms）的内在理解，仅能学习表面相关性。未满足的需求是：智能体需要具备**反事实推理（Counterfactual Reasoning）**能力，能够在执行动作前，基于物理定律模拟动作后果，从而识别出那些未被显性标记但隐含风险的状态耦合。\n\n**(b) 借鉴相邻领域的方法或工具：**\n借鉴**神经符号人工智能（Neuro-Symbolic AI）**和**物理引擎仿真（Physics Engine Simulation）**。具体而言，引入一个轻量级的**可微物理模拟器（Differentiable Physics Simulator）**或**因果图模型（Causal Graph Model）**作为 VLM 的“物理引擎插件”。该插件不依赖视觉观测提取状态，而是基于物体的物理属性（密度、热容、导电性、摩擦力等）构建因果图。当 VLM 生成意图时，该插件进行快速的**反事实模拟（Counterfactual Simulation）**，预测动作后的物理状态变化，并评估是否违反物理安全约束（如温度梯度超过阈值、电流过载等）。\n\n**(c) 第一个实验设计：**\n设计一个名为 **PhysRisk-Bench** 的基准测试，包含 50 个需要物理因果推理才能识别风险的任务（如“将热水倒入塑料杯”、“在潮湿地板上放置金属梯子”、“将易燃液体靠近未点燃但高温的炉灶”）。\n1.  **基线对比**：对比本文的 JIT-Memory（仅依赖 RSG 状态匹配）、Safe-CoT（依赖语言推理）以及 PICRES（引入物理因果模拟）。\n2.  **实验流程**：智能体接收任务指令，VLM 生成初步意图。PICRES 框架调用物理插件，基于物体属性进行反事实模拟，生成风险评分。如果评分超过阈值，插件生成具体的物理约束提示（如“温度差过大，可能导致破裂”），引导 VLM 调整动作（如“先预热杯子”或“更换材质”）。\n3.  **评估指标**：除了传统的 Safe Success (SS) 和 Task Success (TS)，新增 **Physical Reasoning Accuracy (PRA)**，即智能体是否正确识别并解释了基于物理定律的风险原因。\n\n**与已有工作的区别：**\n本文的 JIT-Memory 是**数据驱动**的，依赖历史轨迹和显性状态规则；而 PICRES 是**模型驱动**的，依赖物理定律和因果推理。前者是“记住什么是不安全的”，后者是“理解为什么是不安全的”。这使得 PICRES 能够泛化到从未见过的物理风险场景，而无需依赖大量的标注数据或经验积累，从而从根本上解决隐性状态耦合失效的问题。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Bingrui Sima\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Lizhong Wang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xiaoya Lu\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Kun He\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"⋆\"\n      ]\n    },\n    {\n      \"name\": \"Xiao Yang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"⋆\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Huazhong University of Science and Technology\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Tsinghua University\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Shanghai Jiao Tong University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"⋆\",\n      \"text\": \"Corresponding authors.\"\n    }\n  ]\n}\n```", "summary_translation": "尽管视觉语言模型（VLMs）已赋能具身智能体执行复杂的家庭任务，但在闭环交互过程中，它们难以主动应对动态出现的安全隐患。现有的安全方法通常依赖运行时护栏来阻止不安全动作或引发过度谨慎，这严重阻碍了任务进展，而非主动解决潜在风险。为了打破这种安全与进展之间的权衡，我们提出了自我演进即时记忆（Self-Evolving Just-In-Time Memory）框架，将具身安全从阻碍进展的护栏重构为主动的风险缓解。该框架包含用于在部分可观测性下持续跟踪安全相关状态的风险充分拓扑信念图（Risk-Sufficient Topological Belief Graph, RSG）、用于精确预测隐患的基于代理的事实记忆（Agency-Grounded Factual Memory），以及注入程序化元技能（Meta-Skills）以指导可执行且保持进展的缓解措施的经验记忆（Experience Memory）。此外，我们提出了一种自动化的测试-验证-写入（Test-Verify-Write）循环，使智能体能够在测试时从执行轨迹中持续优化其缓解元技能。在 IS-Bench 上的实验表明，我们的框架显著提升了多种 VLM 骨干模型的安全成功率（例如，在 Qwen3-VL-8B 上提升了 30.3%），使智能体能够在不阻碍任务进展的情况下主动缓解隐患。代码已开源至 https://github.com/DyMessi/JIT-Memory。"}, {"title": "ProEvent: An Event-centric Benchmark for Proactive Agents", "arxiv_id": "2607.17701", "authors": "Guanzhen Li, Liangming Pan, Leye Wang", "summary": "Proactive agents are expected to anticipate user needs and provide autonomous assistance by perceiving environmental context without explicit instructions. A fundamental capability of such agents is to identify and track users' upcoming events, enabling continuous and event-specific assistance. For example, by recording the time and location of a planned hike, an agent can deliver weather reminders in advance or provide navigation support before departure. However, existing works on proactive agents largely overlook event-centric assistance, and the open-ended nature of proactive assistance poses challenges for reliable evaluation. To bridge these gaps, we introduce ProEvent, the first event-centric benchmark designed to assess an agent's ability to proactively maintain a user's timetable based on ongoing instant messaging chats. ProEvent provides synthesized yet realistic chats that consider the dynamic interaction among users, concurrent chat threads, and noise in the real world, and evaluates proactive agents on response timing, single-step response correctness, and multi-step response correctness. Experiments on eight LLMs and pipelines reveal that current agents frequently overact and struggle with event cancellation. Notably, even GPT-5.1 only reacts correctly in 26.7% of scenarios. Further qualitative analysis reveals fundamental limitations of current LLMs as proactive agents, particularly in detecting implicit events and reasoning from the user's first-person perspective.", "category": "cs.AI", "cluster": "Context Handling \u0026 Long-Horizon Planning", "tags": ["cs.AI"], "filter_reason": "该论文符合筛选标准，属于“保留 (Keep)”类别。\n\n1.  核心对象明确为 LLM 智能体：论文的研究对象是“Proactive Agents”（主动智能体），这是一种特定类型的 LLM-based Agent，其核心能力涉及感知环境上下文、预测用户需求以及在没有显式指令的情况下提供自主协助。这直接对应研究焦点中的“单智能体 (Agentic)”方向，特别是涉及智能体的规划（anticipate user needs）、记忆（track users' upcoming events）和长期决策（continuous assistance）。\n\n2.  符合“评估基准与行为分析”的保留规则：根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。”\n       本文提出了 ProEvent 基准，专门用于评估智能体在事件中心场景下的主动服务能力。\n       论文不仅提供了评估工具，还通过实验揭示了当前 LLM 智能体在“过度反应”（overact）和“事件取消处理”上的根本局限性，并分析了其在检测隐式事件和第一人称推理方面的缺陷。\n       这些发现直接有助于理解智能体的失败模式（failure mechanisms）和行为边界，从而为改进智能体的规划、记忆管理和上下文理解能力提供指导。\n\n3.  非排除项：\n       它不是单纯的基础设施或通信协议研究。\n       它不涉及被排除的安全、对齐、多模态视觉核心或图神经网络技术。\n       虽然它是基准测试，但其核心贡献在于定义和量化“主动智能体”这一特定 Agentic 范式的能力，而非仅仅应用现有框架解决领域问题。\n\n综上所述，该论文通过构建基准和深入的行为分析，直接服务于对 LLM 智能体（特别是具备主动性和长期记忆能力的智能体）的理解与改进，符合研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：如何评估 **Proactive Agents**（主动智能体）在缺乏显式指令的情况下，通过感知即时通讯（Instant Messaging）上下文来主动识别、跟踪并维护用户未来事件日程表的能力。具体而言，该任务要求智能体从动态、并发且充满噪声的聊天对话中提取事件信息，并执行 **Insert**、**Update** 或 **Delete** 等操作以更新用户的 **Timetable**（日程表）。\n\n这一问题的重要性在于，现有的基于大语言模型（LLMs）的智能体大多仍是 **Reactive**（被动响应式）的，依赖用户的明确指令，这导致频繁的人工干预并可能遗漏时间敏感信息。相比之下，**Proactive Agents** 能够预判用户需求，提供连续且无缝的辅助（如提前提醒天气、导航或会议准备），从而实现从“被动执行”到“主动服务”的范式转变。然而，由于主动辅助具有 **Open-ended**（开放式）特性，且真实世界聊天环境涉及复杂的 **Dynamic Speaker Interactions**（动态说话人交互）、**Concurrent Chat Threads**（并发聊天线程）以及 **Pervasive Noise**（普遍噪声），现有的评估手段难以可靠地衡量智能体的表现。\n\n解决这一问题的价值体现在两个方面：首先，它填补了 **Event-centric Assistance**（以事件为中心的辅助）在主动智能体研究中的空白，使智能体能够支持长期、连续的用户活动管理；其次，通过引入 **PROEVENT** 基准，本文提供了客观的评估协议（如 **Response Timing**、**Single-step/Multi-step Correctness**），揭示了当前 LLMs 在检测隐式事件、处理事件取消以及从用户第一人称视角进行推理方面的根本性缺陷，为开发更可靠、更贴近真实场景的主动智能体指明了方向。\n\n### § 2 前人工作与不足\n\n尽管已有研究致力于评估主动智能体，但现有工作存在显著不足，主要体现在任务焦点的局限性和评估协议的主观性上。\n\n在任务焦点方面，现有的基准如 **ProactiveBench** (Lu et al., 2024)、**FingerTip** (Yang et al., 2025c) 和 **PROBE** (Pasternak et al., 2025) 主要关注 **Human-Device Interactions**（人机交互）或即时辅助（如网页摘要、GUI 操作），旨在预测用户的下一步动作或解决即时需求。然而，这些工作完全忽略了 **Tracking Users’ Upcoming Events**（跟踪用户未来事件）这一关键能力。由于缺乏对长期事件状态的维护，现有智能体无法提供针对特定活动的连续、长期辅助（如根据计划好的徒步旅行提前多天提供天气提醒）。这种局限性的原因在于，现有基准多侧重于短期的、反应式的交互场景，而未将“事件”定义为需要跨时间步、跨聊天线程持续跟踪的结构化实体。\n\n在评估协议方面，由于主动响应的 **Open-ended** 性质，现有基准缺乏可靠的客观评估标准。**ProactiveBench** 采用微调小模型来模拟人类判断，而 **FingerTip** 依赖预测结果与真实值之间的 **Semantic Similarity**（语义相似度）。这些方法存在根本缺陷：语义相似度无法准确反映操作的正确性（例如，一个错误的但语义相似的回复可能得分很高），而模拟人类判断缺乏客观的 **Grounding**（依据），难以区分回复的实际有用性和正确性。此外，现有合成数据往往缺乏真实聊天的复杂性，如 **Negotiation Dynamics**（协商动态）、**Concurrent Chats**（并发聊天）和 **Noise**（噪声），导致评估结果无法反映智能体在真实世界复杂环境下的鲁棒性。\n\n因此，现有研究未能提供一个专门针对“基于聊天维护用户日程表”这一具体任务的基准，也缺乏能够客观衡量操作正确性（如 **Insert/Update/Delete** 的精确匹配）和响应时机（如 **False Detection Rate** 和 **Missed Need Rate**）的评估体系。**PROEVENT** 正是为了弥补这些缺口而设计，它通过合成高保真、包含复杂交互和噪声的聊天数据，并引入基于日程表状态一致性的客观评估指标，解决了前人工作在任务定义和评估可靠性上的不足。", "core_insight": "### § 3 重建作者的思考路径\n\n在大型语言模型（LLMs）向智能体（Agents）演进的过程中，研究焦点长期集中在**Reactive Agents**上，即依赖用户显式指令（Explicit Instructions）进行任务执行。然而，随着应用场景从单一任务处理转向个人助理或生活助手，**Proactive Agents**（主动式智能体）的需求日益凸显，其核心能力在于无需指令即可感知环境并预判用户需求。现有的主动式智能体基准测试（如 ProactiveBench, FingerTip, PROBE）主要关注人机交互（Human-Device Interactions）或即时辅助（如网页摘要），存在两个显著缺陷：一是缺乏对**Event-centric**（以事件为中心）的长期规划能力的评估，即智能体无法持续跟踪用户未来的日程安排；二是评估协议（Evaluation Protocols）不可靠，多依赖语义相似度或LLM-as-a-Judge，难以客观衡量主动响应的正确性与必要性。\n\n与此同时，即时通讯（Instant Messaging, IM）是日常生活中事件规划最自然的载体，但其复杂性远超结构化数据。IM对话具有**Dynamic Speaker Interactions**（动态说话人交互）、**Concurrent Chat Threads**（并发聊天线程）以及**Pervasive Noise**（普遍存在的噪声，如无关话题、闲聊）等特征。现有的任务导向对话数据集（如 MultiWOZ）虽然包含事件规划，但通常假设单线程、低噪声且结构化的交互，无法反映真实世界中多线并行、信息碎片化且充满歧义的聊天场景。此外，现有研究指出LLM在**Implicit Intent Recognition**（隐式意图识别）和**First-person Perspective Reasoning**（第一人称视角推理）方面存在系统性偏差，往往以第三人称视角处理事件，导致在事件取消或参与者变更时出现逻辑错误。\n\n基于此，研究者意识到需要一个专门针对**Event Tracking**（事件跟踪）的基准，该基准必须能够模拟真实IM环境的复杂性，并提供客观的评估标准。传统的语义匹配无法解决“何时响应”（Timing）和“如何操作”（Operation）的问题。因此，将问题形式化为对时间表（Timetable）的离散操作（Insert, Update, Delete），并通过对比预测操作与Ground Truth操作来评估，成为解决评估主观性的关键路径。同时，为了克服真实数据获取难且隐私敏感的问题，利用LLM合成高保真、包含噪声和并发线程的对话数据，并引入严格的质量控制，成为构建该基准的可行方案。这一思考路径最终导向了PROEVENT的提出：一个专注于从复杂IM聊天中主动维护用户时间表的基准，旨在揭示当前LLM在主动式事件跟踪中的根本局限性。\n\n### § 4 核心 Intuition\n\nPROEVENT的核心直觉在于，真正的主动式智能体不应仅是对显式指令的反应者，而应是用户生活上下文的**隐式观察者**与**结构化维护者**。现有方法失效的根本原因在于它们忽略了真实即时通讯中**并发线程**、**动态噪声**与**隐式意图**交织的复杂性，导致模型无法在缺乏明确结构线索的情况下，从第一人称视角准确推断并维护用户的时间表。PROEVENT通过将模糊的自然语言对话转化为离散的时间表操作（Insert/Update/Delete），并引入严格的时序与多步一致性评估，迫使模型在充满干扰的环境中精准捕捉事件的演变，从而暴露出当前LLM在**Perspective Alignment**（视角对齐）和**Implicit Reasoning**（隐式推理）上的本质缺陷。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nPROEVENT 的核心方法并非提出一个新的 Agent 架构，而是构建了一个**Event-centric Benchmark**（以事件为中心的基准测试），用于评估 Proactive Agents（主动式智能体）从即时通讯（Instant Messaging）中维护用户日程表（Timetable）的能力。其 Pipeline 包含数据构建（Data Construction）和评估流程（Evaluation Process）两个主要部分。\n\n**1. 数据构建 Pipeline (Data Construction Pipeline)**\n为了模拟真实世界的复杂性，PROEVENT 通过以下四步合成高保真对话数据：\n*   **Step 1: Contact Pool Construction（联系人池构建）**：预定义 56 种不同角色（如同事、朋友）的 Profile，包括姓名、角色及计划事件类型，确保对话背景的多样性。\n*   **Step 2: Chat Synthesis（对话合成）**：\n    *   首先生成 **Scheduling Trajectory（调度轨迹）**，记录事件属性（时间、地点、参与者）随时间变化的真实状态。\n    *   基于轨迹生成 **Chat Skeleton（对话骨架）**，指导 LLM（如 GPT-OSS-120B）生成符合事件演变逻辑的多轮对话。\n    *   引入三种原子操作模拟真实协商：Simple Modification（简单修改）、Timetable Linking（日程关联）、Detail Removal（细节缺失）。\n*   **Step 3: Noise Injection（噪声注入）**：注入三类噪声以模拟真实环境：Message-level noise（无关消息）、Chat-level noise（无关聊天线程）、Event-level noise（干扰性历史事件）。同时加入俚语、表情符号等语言噪声。\n*   **Step 4: Chat Scenario Construction（场景构建）**：将多个聊天线程合并，并按固定时间窗口（Time Windows）分割，形成并发聊天场景（Concurrent Chat Threads），并推导每个时间步的 Ground Truth Operations。\n\n**2. 评估 Pipeline (Evaluation Pipeline)**\nAgent 在给定时间步 $t$ 接收聊天消息 $D_t$ 和当前日程表 $S_{t-1}$，需输出操作列表 $P_t$。\n*   **输入**：时间窗口内的多条聊天消息 $D_t = \\{D_{t[1]}, ..., D_{t[N]}\\}$ 和上一时刻的日程表状态 $S_{t-1}$。\n*   **处理**：Agent 需理解上下文，识别隐含意图，并决定执行何种操作。为避免重复输出，Agent 不直接输出完整日程表，而是输出 **Timetable Operations**：\n    *   `Insert(start_time, end_time, location, participants, description)`：插入新事件。\n    *   `Update(id, attribute, value)`：更新现有事件属性。\n    *   `Delete(id)`：删除事件。\n*   **输出**：操作列表 $P_t$。\n*   **评估**：将 $P_t$ 与 Ground Truth $G_t$ 对比，计算 Response Timing（响应时机）、Single-step Correctness（单步正确性）和 Multi-step Correctness（多步正确性）。\n\n**真实例子讲解：**\n假设用户 Jerry 正在与同事 Alice 和 Bob 聊天。\n*   **输入 ($t=1$)**：\n    *   Chat 1 (Alice): \"Hi, how’s going? How about having a lunch together tomorrow?\"\n    *   Chat 2 (Bob): \"We’ll have our weekly research meeting at Meeting Room 305 2 P.M. today.\"\n    *   当前日程表 $S_0$ 为空。\n*   **处理**：\n    *   Agent 识别出 Chat 1 中 Alice 提议明天午餐，Jerry 回复 \"Sounds great! How about 12 P.M.? Let’s meet at Canteen 1.\"，Alice 确认 \"Perfect!\"。这是一个确定的新事件。\n    *   Agent 识别出 Chat 2 中 Bob 通知今天下午 2 点的会议。这也是一个新事件。\n*   **输出 ($P_1$)**：\n    *   `Insert(start_time=\"Tomorrow 12:00\", location=\"Canteen 1\", participants=[\"Jerry\", \"Alice\"], description=\"Lunch\")`\n    *   `Insert(start_time=\"Today 14:00\", location=\"Meeting Room 305\", participants=[\"Jerry\", \"Bob\", ...], description=\"Research Meeting\")`\n*   **后续步骤 ($t=2$)**：\n    *   如果 Alice 发消息 \"Hey, I’m afraid I can’t make it tomorrow... let’s reschedule\"，Agent 需输出 `Delete(id=Lunch_Event_ID)` 或 `Update` 操作，具体取决于是否立即确定了新时间。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n本节跳过。PROEVENT 是一篇基准测试（Benchmark）论文，其核心贡献在于数据集构建、任务定义和评估指标的设计，而非提出新的数学模型或算法推导。文中涉及的公式仅为评估指标的定义（如 Precision, Recall, FDR, MNR），属于标准统计量，无复杂理论推导。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有 Proactive Agent 基准测试缺乏对“用户未来事件追踪”能力的评估，且评估协议不可靠（依赖语义相似度或 LLM 模拟判断）。此外，当前 LLM 作为主动式智能体在真实复杂聊天环境（动态交互、并发线程、噪声）中的表现如何？存在哪些系统性缺陷？\n\n**2. 设计了什么实验验证这个问题？**\n*   **基准测试构建**：构建 PROEVENT 数据集，包含 2463 个单步问题和 1279 个多步案例，覆盖 7 类事件、56 个子类，并注入真实噪声和并发聊天场景。\n*   **模型评估**：评估 8 种 LLM 及 Pipeline（包括开源模型 Qwen-3, DeepSeek-V3.2/R1 和闭源模型 GPT-5.1，以及 Proactive 和 ProCoT 策略）。\n*   **多维度分析**：\n    *   **整体性能**：对比单步正确性与多步成功率。\n    *   **响应时机**：分析 False Detection Rate (FDR) 和 Missed Need Rate (MNR)，检测“过度反应”倾向。\n    *   **操作类型分析**：重点分析 `Delete` 操作的精度，评估对隐含取消（Implicit Cancellation）的识别能力。\n    *   **复杂性影响**：分析协商轮数（Negotiation Turns）、并发聊天数（Concurrent Chats）和噪声类型（Noise Types）对性能的影响。\n    *   **定性分析**：通过错误案例（Error Cases）分析 LLM 在隐含事件检测、第一人称视角推理（First-person Perspective）和时序推理（Temporal Reasoning）上的缺陷。\n\n**3. 问题的答案是什么？**\n*   **当前 LLM 远未达到可靠主动辅助的水平**：即使是最强的 GPT-5.1，在多步场景下的 Timetable Success Rate (TSR) 仅为 26.7%，单步正确性也仅约 50%。\n*   **LLM 倾向于“过度反应”（Overact）**：所有模型的 FDR 显著高于 MNR，表明 LLM 倾向于在没有必要时触发操作，而非遗漏必要操作。ProCoT 策略通过显式推理必要性，可将 FDR 降低 70%。\n*   **隐含事件取消是难点**：识别 `Delete` 操作极具挑战性，因为取消往往隐含在对话中。强推理模型（如 DeepSeek-R1, GPT-5.1）在 `Delete` 操作的 Precision 上显著优于弱模型，表明推理能力有助于区分真实取消与临时变更。\n*   **真实世界复杂性严重削弱性能**：随着协商轮数增加和并发聊天增多，Recall 显著下降。噪声内容（如无关事件讨论）比噪声位置对性能影响更大。\n*   **根本性缺陷**：\n    *   **缺乏第一人称视角**：LLM 常从第三人称视角推理，例如用户说“我不去了”，LLM 可能仅从参与者列表中移除用户，而非删除整个事件。\n    *   **隐含意图识别弱**：GPT-5.1 等模型在叙事性对话中容易忽略隐含的操作要求（如“邀请同样的人”），除非指令显式化。\n    *   **时序与记忆推理不足**：弱模型存在日期/星期转换错误（Temporal Reasoning Mistakes）和更新错误事件（Update Mismatch）的问题。", "additional_insights": "### § 8 Take-aways\n\nPROEVENT 是首个专注于评估 **Proactive Agents** 从即时通讯（Instant Messaging）中主动维护用户日程表能力的基准测试，填补了现有基准在事件追踪和长期协助评估上的空白。该基准通过合成具有动态交互、并发聊天线程和真实噪声的对话数据，模拟了现实世界中复杂的上下文环境，并引入了基于 **Timetable Operations**（Insert, Update, Delete）的客观评估协议，解决了传统语义相似度评估在开放-ended 响应中的不可靠性。实验结果显示，当前最先进的 LLMs（包括 GPT-5.1）在 **Proactive Assistance** 任务上表现不佳，主要存在 **Overacting**（过度反应，高 False Detection Rate）和难以处理隐式事件取消的问题。定性分析揭示了 LLMs 作为主动代理的根本缺陷：缺乏从用户 **First-person Perspective** 进行推理的能力，以及在缺乏显式结构线索时难以捕捉 **Implicit Events**。此外，研究指出 **Reasoning** 能力（如 DeepSeek-R1 和 ProCoT 策略）能显著改善对隐式取消的识别精度，但模型仍受限于对叙事性指令的感知偏差，表明当前 LLMs 距离可靠的主动式智能助手仍有巨大差距。\n\n### § 9 最脆弱的假设\n\nPROEVENT 核心贡献的有效性高度依赖于一个关键假设：**合成对话（Synthesized Chats）在语义复杂性、噪声分布和交互动态上足以代表真实世界的即时通讯场景，且模型在合成数据上的表现能外推至真实环境。** 如果这一假设不成立，即合成数据未能捕捉真实人类对话中的非结构化混乱、情感细微差别或跨上下文的多义性，那么 PROEVENT 评估出的模型能力将产生偏差，导致对 **Proactive Agents** 实际可用性的错误判断。论文通过 GPT-5.4 的成对比较实验（Pairwise Comparisons）提供了一定证据，显示模型难以区分 PROEVENT 合成对话与 MultiWOZ 或 Ubuntu Dialogue Corpus 中的真实对话，并声称合成风格对模型行为的影响小于 LLM 推理的内在随机性。然而，这一证据存在局限：它仅验证了表层语言风格的相似性，而未验证深层交互逻辑（如多轮谈判中的意图漂移、非语言线索缺失下的歧义处理）的真实性。若真实场景中的噪声更具破坏性或交互更非线性，PROEVENT 的高难度可能仅反映了合成数据的特定偏差，而非模型在真实世界中的真实瓶颈，从而削弱其作为通用基准的权威性。\n\n### § 10 最小复现实验\n\n在 1 周内，可复现的核心点是验证 **“显式提示能显著缓解 LLM 对隐式事件更新的忽略”** 这一结论，特别是针对 GPT-5.1 在 **Implicit Event Detection** 上的缺陷。具体方案如下：使用 PROEVENT 数据集中被标注为 GPT-5.1 出错的 **Implicit Update** 案例（如 Figure 6(c) 中“邀请相同人员”的叙事性指令），构建一个小型测试集（约 50-100 个样本）。实现上，直接调用 GPT-5.1 API，分别输入原始对话上下文和添加 **Update Prompt**（如“[Here is an update]”）或 **Direct Expression**（将隐式指代替换为具体名称）的修改版上下文。测量指标为 **Recall** 和 **Precision**，即模型是否正确输出了对应的 **Update** 操作。若添加提示后 Recall 显著提升（如论文报告的 32% 增益），则支持了“模型具备推理能力但受限于感知偏差”的 claim；若提升不明显或出现新的错误类型，则反驳了该结论，暗示模型缺乏深层语义理解而非仅是提示敏感性问题。此实验无需复现整个数据生成管道，仅聚焦于模型对特定输入形式的敏感性，成本低且能直接验证论文的关键定性发现。", "research_value": "### § 11 最强反例设计\n\n若要挑战 PROEVENT 的有效性，最有力的攻击点在于其**Ground Truth 的构造逻辑与真实人类协商的“模糊性”存在根本错位**，即所谓的“确定性幻觉”（Determinism Illusion）。PROEVENT 的数据构建 Pipeline 依赖于预定义的 **Scheduling Trajectory** 和 **Chat Skeleton**，这意味着在数据生成阶段，事件的最终状态（Insert/Update/Delete）是确定且唯一的。然而，在真实的即时通讯场景中，事件协商往往具有高度的**Ambiguity**（模糊性）和**Probabilistic Nature**（概率性）。\n\n具体反例设计如下：构建一个“软性承诺”（Soft Commitment）场景。例如，用户 Jerry 回复同事 Alice 的午餐邀请时说：“Sounds good, let me check my calendar and get back to you.”（听起来不错，我查下日程再回复你。）在 PROEVENT 的当前框架下，由于缺乏明确的“确认”或“拒绝”信号，Ground Truth 可能标记为“无操作”或“待定”，或者强制要求模型在后续步骤中必须做出二元判断。然而，在真实世界中，一个优秀的 **Proactive Agent** 应当识别出这是一个 **Pending State**（待定状态），并可能主动发起一个 **Follow-up Action**（如设置提醒或在 2 小时后询问进展），而不是简单地等待明确的 Insert/Delete 指令。\n\n如果我们将此类“模糊协商”案例大规模注入测试集，并定义 Ground Truth 为“允许多种合理操作”（如：保持静默、设置提醒、或主动追问），那么 PROEVENT 基于精确匹配（Exact Match）的 **Single-step Correctness** 指标将失效。模型可能因为输出了“设置提醒”这一合理但未被 Ground Truth 覆盖的操作而被判错，或者因为未输出任何操作而被判为 **Missed Need**。这将证明 PROEVENT 评估的不是智能体在复杂社交语境下的**鲁棒性**，而是其对**结构化指令的服从度**。此外，可以论证 **Noise Injection** 是静态且可预测的（如固定的无关消息模板），而真实噪声往往是**Context-dependent**（依赖上下文的），例如朋友在聊天中突然插入一段与当前事件无关但情绪强烈的个人倾诉，这种**Emotional Noise** 会干扰模型对事件意图的提取，而 PROEVENT 的噪声模型未能捕捉这种语义层面的干扰，导致评估结果高估了模型在真实高噪声环境下的表现。\n\n### § 12 Follow-up Research Idea\n\n基于 PROEVENT 揭示的 LLMs 在 **First-person Perspective** 推理和 **Implicit Event Detection** 上的缺陷，以及其评估体系对“确定性操作”的过度依赖，我提出一个新的研究方向：**Probabilistic Event State Tracking with Uncertainty Calibration**（基于不确定性校准的概率事件状态追踪）。\n\n**(a) 驱动局限与未满足需求：**\nPROEVENT 将事件维护视为一个确定性的 CRUD（Create, Read, Update, Delete）操作序列，这忽略了真实世界中事件状态的**不确定性**（Uncertainty）。用户说“我可能去”和“我一定去”在语义上不同，但在 PROEVENT 的 Ground Truth 中可能被简化为相同的 Insert 操作或不同的操作，缺乏对置信度的量化。现有工作缺乏对智能体**何时应该行动**以及**行动置信度如何**的评估，导致 **Overacting** 问题无法从根源解决。我们需要一个框架，不仅预测操作，还预测操作的**置信度分布**，从而允许智能体在不确定时选择“询问”而非“盲动”。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴**Partially Observable Markov Decision Processes (POMDPs)** 和 **Active Learning** 中的不确定性量化方法。在 POMDP 中，智能体维护一个对隐藏状态（此处为真实事件状态）的信念分布（Belief Distribution），而非单一状态估计。同时，借鉴**Human-in-the-Loop** 中的**Query-by-Committee** 策略，当模型对事件状态的不确定性超过阈值时，主动生成澄清问题（Clarification Questions）而非直接执行日程表操作。\n\n**(c) 第一个实验设计：**\n构建一个名为 **UncertainEvent** 的新基准，其核心创新在于 Ground Truth 不再是单一操作，而是一个**操作概率分布**或**多模态标签**（例如：70% 概率 Insert，30% 概率 Pending）。\n1.  **数据构建**：在 PROEVENT 的合成对话中，专门引入“模糊表达”（Hedging Language，如 \"maybe\", \"probably\", \"tentative\"）和“冲突信息”（Conflicting Information，如不同聊天线程中时间不一致）。\n2.  **任务定义**：Agent 需输出两个部分：(1) 预测的操作列表及其置信度分数；(2) 如果置信度低于阈值，输出一个澄清问题。\n3.  **评估指标**：引入 **Calibration Error**（校准误差）来衡量模型置信度与真实正确率的一致性，以及 **Clarification Efficiency**（澄清效率），即模型通过最少次数的提问达到高置信度状态的能力。\n4.  **对比基线**：对比传统 PROEVENT 风格的“硬决策”模型与引入不确定性建模的模型。预期结果是，虽然“硬决策”模型在简单场景下 **Precision** 较高，但在复杂模糊场景下 **FDR** 极高；而新框架通过主动澄清，能显著降低 **FDR** 并提高长期 **Timetable Success Rate**，从而证明在处理真实世界噪声时，**Uncertainty Awareness** 比单纯的 **Reasoning Capability** 更为关键。这一方向将主动智能体的研究从“如何正确执行指令”推向“如何在不确定性中管理交互”，具有更强的理论深度和实际应用价值。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "{\n  \"authors\": [\n    {\n      \"name\": \"Guanzhen Li\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Liangming Pan\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Leye Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"School of Computing, Peking University\"\n    }\n  ],\n  \"footnotes\": []\n}", "summary_translation": "主动式智能体（Proactive agents）被期望在无需明确指令的情况下，通过感知环境上下文来预判用户需求并提供自主辅助。此类智能体的一项基本能力是识别并跟踪用户即将发生的事件，从而实现持续且针对特定事件的辅助。例如，通过记录计划徒步的时间和地点，智能体可以提前提供天气提醒或在出发前提供导航支持。然而，现有的主动式智能体研究大多忽视了以事件为中心的辅助，且主动式辅助的开放性给可靠评估带来了挑战。为了弥补这些不足，我们引入了 ProEvent，这是首个以事件为中心的基准测试，旨在评估智能体基于即时通讯聊天主动维护用户日程表的能力。ProEvent 提供了合成但逼真的聊天数据，考虑了用户之间的动态交互、并发的聊天线程以及现实世界中的噪声，并从响应时机、单步响应正确性和多步响应正确性三个方面对主动式智能体进行评估。对八种 LLM 及其流程的实验表明，当前的智能体经常过度反应，且在处理事件取消方面存在困难。值得注意的是，即使是 GPT-5.1，也仅在 26.7% 的场景中做出正确反应。进一步的定性分析揭示了当前 LLM 作为主动式智能体的根本局限性，特别是在检测隐式事件和从用户第一人称视角进行推理方面。"}, {"title": "Just A Rather Very Intelligent Spoken Agent", "arxiv_id": "2607.16610", "authors": "Chen Chen, Zhehuai Chen", "summary": "Long-horizon AI agents are becoming increasingly capable, yet their interaction with users remains surprisingly thin. In most workflows, users give an initial instruction, receive only selective textual updates, and lose a clear sense of what the agent is doing or when to step in. This leaves a missing part in the current agent ecosystem: an always-on Jarvis-style mediator that keeps the agent continuously reachable to the user. Such a mediator should support real-time spoken interaction with the user, answer questions without interrupting the worker, proactively report progress or confusion, and inject user guidance back into the agent's execution when useful. In this work, we introduce JarvisBench, a benchmark for measuring the dual value of mediation in long-horizon agent workflows. JarvisBench contains two complementary tracks: an agent-collaboration track that measures whether mediation improves downstream task completion, and a user-interaction track that measures whether mediation makes ongoing execution more understandable, responsive, and accessible to users. We instantiate the benchmark with a modular reference Jarvis prototype and evaluate it on 34 text-only WildClaw tasks executed in OpenClaw. Preliminary results with GPT-5.5, Claude Opus 4.7, Gemini-based, and GPT-based worker agents suggest that Jarvis-style mediation can provide trace-grounded responses to user questions and improve task performance when sparse user guidance is injected at appropriate moments. The results also show that effectiveness depends strongly on the mediator's LLM brain, highlighting both the promise of this missing middle layer and the need for broader community effort. Demo page https://cchen1436.github.io/jarvis", "category": "cs.AI", "cluster": "Context Handling \u0026 Long-Horizon Planning", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Long-Horizon Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文符合研究范围，主要基于以下理由：\n\n1.  核心对象为 LLM 智能体 (LLM Agents)：论文明确研究的是“Long-horizon AI agents”（长视界智能体）及其与用户的交互机制。它提出的“Jarvis-style mediator”本质上是一个辅助或增强型智能体组件，负责在长周期任务中管理用户与执行智能体之间的交互。\n2.  涉及智能体能力与机制改进：论文关注智能体的“可解释性”、“响应性”以及“用户指导注入”（inject user guidance back into the agent's execution）。这属于智能体在长视界决策中的交互机制和协作意图（Collaboration/Clarification timing）的研究范畴。虽然它主要是一个基准测试（Benchmark），但根据筛选标准，“如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准... 只要结论直接帮助理解或改进智能体能力，也应保留”。\n3.  符合“单智能体/多智能体协作”方向：论文探讨了中介者（Mediator）如何在不中断工作智能体（Worker Agent）的情况下进行实时交互和进度报告，这涉及智能体系统中的协作机制和执行环境的优化，而非单纯的底层通信协议或拓扑结构。\n4.  排除项不适用：\n       它不是非演化型应用：虽然涉及语音交互，但核心贡献在于定义和评估智能体在长视界任务中的中介/协作能力，而非仅仅将LLM用于语音识别。\n       它不是纯基础设施：虽然提到了原型系统，但重点在于评估这种中介机制对任务完成率和用户体验的影响，属于智能体行为和能力评估。\n       不涉及被排除的安全、图技术或多模态视觉核心研究（语音在此处作为交互模态，服务于智能体交互机制的研究，而非研究语音模型本身）。\n\n综上，该论文通过构建基准和原型，深入研究了长视界智能体系统中的关键交互与协作机制，符合“构建、改进、评估 LLM 智能体”的核心目标。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在长周期（long-horizon）AI Agent 工作流中，如何构建并评估一个“Jarvis-style”的中介层（mediator），以解决用户与执行 Agent 之间交互稀疏、缺乏实时反馈和引导的问题。现有的 Agent 系统大多采用基于回合（turn-based）的交互范式，用户发出初始指令后，Agent 自主执行长时间任务，期间仅通过稀疏的文本更新进行沟通。这种模式导致用户无法实时了解 Agent 的执行状态（progress）、难以在早期纠正错误，也无法在 Agent 偏离意图时及时介入。本文认为，当前 Agent 生态系统中缺失了一个关键的“中间层”——一个始终在线（always-on）、支持实时语音交互、能主动报告进度或困惑、并在必要时将用户指导注入 Agent 执行流的中介者。\n\n这一问题的重要性在于，随着 Agent 在复杂编程、日常辅助等领域的能力提升，其“黑盒”式的执行过程成为了用户体验和任务可靠性的瓶颈。如果用户无法理解 Agent 正在做什么，或者无法在关键节点提供指导，Agent 即使具备强大的推理能力，也可能因微小的误解或环境变化而失败。解决这一问题带来的价值主要体现在两个方面：一是提升任务完成率（task completion），通过中介层在失败敏感点（failure-sensitive checkpoints）引入专家用户的简洁指导，帮助 Worker Agent 从局部失败模式中恢复；二是增强用户体验（user experience），通过实时、基于执行轨迹（trace-grounded）的语音交互，使 Agent 的工作过程对非专家用户更加透明、可解释和可访问。本文提出的 JarvisBench 基准测试正是为了量化这种中介层在“Agent 协作”和“用户交互”两个维度的双重价值。\n\n### § 2 前人工作与不足\n\n尽管长周期 Agent 和语音交互已有大量研究，但专门针对“用户-Agent 中介层”的系统性评估和定义此前并未被充分解决。现有的相关工作主要存在以下不足：\n\n首先，在长周期 Agent 任务基准测试方面，如 $\\tau$-bench、TheAgentCompany 和 WildClawBench，主要关注 Agent 在工具使用、环境交互下的任务完成能力。这些基准测试通常将用户视为任务环境的被动部分或仅作为初始指令的发出者，缺乏对执行过程中用户与 Agent 持续交互的评估。例如，WildClawBench 虽然提供了真实的长周期任务环境，但其评测协议并未涵盖中介层如何帮助用户理解执行过程或如何通过用户反馈提升任务成功率。因此，这些工作无法衡量“中介”这一特定角色的价值。\n\n其次，在人机协作（Human-in-the-loop）和主动 Agent（proactive agents）研究中，如 HiL-Bench 和 PROBE，主要关注 Agent 何时主动请求帮助或自主解决潜在需求。HiL-Bench 测试 Agent 在信息缺失时是否知道停止并询问，但这仍然以 Worker Agent 自身的决策为中心，而非一个独立的中介层。PROBE 则评估 Agent 主动识别瓶颈的能力，但这属于 Agent 自主解决问题的范畴，而非通过中介层连接用户与 Agent。这些工作忽略了中介层作为“通信桥梁”的独特作用：它不直接解决问题，而是监控 Worker 的轨迹，保持用户的可达性，并将用户反馈注入执行循环。\n\n最后，在语音 Agent 评估方面，如 EVA-Bench 和 $\\tau$-Voice，主要评估语音交互作为端到端任务接口的质量，包括语音保真度、对话进展和任务准确性。然而，这些基准测试将语音视为任务执行的主要模态，而 JarvisBench 中的语音是用于监督独立长周期 Worker Agent 的“始终可用”的用户通道。现有的语音基准测试无法回答“语音中介是否提高了用户对执行过程的感知以及 Worker Agent 的任务成功率”这一核心问题。\n\n综上所述，之前的研究要么侧重于 Agent 的自主任务完成能力，要么侧重于语音交互本身的质量，要么侧重于 Agent 主动请求帮助的机制，但缺乏一个统一的框架来评估一个独立的、始终在线的中介层在连接用户与长周期 Worker Agent 过程中的双重价值（即提升任务完成率和改善用户实时体验）。JarvisBench 填补了这一评测缺口，明确了中介层作为“缺失中间层”的定义和评估标准。", "core_insight": "### § 3 重建作者的思考路径\n\n在长程 AI Agent（Long-horizon AI agents）领域，现有的评估基准如 WildClawBench 或 TheAgentCompany 主要关注任务完成率（Task Completion），即 Agent 能否在封闭环境中独立解决复杂问题。然而，在实际部署中，这种“黑盒”式的自主执行存在显著缺陷：用户无法感知 Agent 的实时状态，难以在早期纠正错误，且缺乏自然的交互接口。现有的交互范式多为轮询式（Turn-based）或基于文本的稀疏更新，这导致用户与 Agent 之间的信息不对称，使得 Agent 容易在错误的轨迹上越走越远，而用户只能在最终结果失败后才介入。\n\n与此同时，语音交互技术（如 Full-duplex Speech Interface）和大型语言模型（LLM）的能力正在快速成熟，使得实时、自然的对话成为可能。科幻作品中的 J.A.R.V.I.S. 形象提供了一个理想化的参照：一个始终在线、通过语音与用户保持连接、并能主动汇报进度或寻求指导的中介者（Mediator）。然而，学术界缺乏对这种“中介层”价值的量化评估。现有的 Human-in-the-loop 研究多关注 Agent 何时主动请求帮助，或评估语音 Agent 自身的任务能力，而非评估一个独立的中介层如何增强现有 Worker Agent 的表现。\n\n因此，研究者意识到需要一个专门的基准来衡量这种“中介”价值。这个基准需要解耦两个核心问题：一是中介是否能通过稀疏的用户指导提升 Worker Agent 的任务成功率（Agent-Collaboration）；二是中介是否能通过实时语音交互提升用户对执行过程的可理解性和可控性（User-Interaction）。基于此，作者提出了 JarvisBench，旨在填补长程 Agent 工作流中缺失的“连续通信层”这一空白，将中介视为一个可插拔的模块，而非固定的 Agent 架构。\n\n### § 4 核心 Intuition\n\n长程 Agent 的核心痛点不在于推理能力的不足，而在于执行过程中用户与 Agent 之间缺乏持续、低摩擦的通信通道，导致错误累积且用户无法及时介入。Jarvis 的核心直觉是引入一个独立的“中介层”（Mediator），它不直接执行任务，而是作为 Worker Agent 与用户之间的实时翻译器和监控器，将复杂的执行轨迹转化为自然的语音交互。通过这种机制，中介能在关键失败点（Failure-sensitive checkpoints）主动寻求稀疏但精准的用户指导，从而以极低的干预成本显著提升任务成功率，同时让用户在不理解底层技术细节的情况下保持对过程的掌控感。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法并非一个新的基础模型，而是一个名为 **JarvisBench** 的基准测试框架及其参考实现 **Jarvis Prototype**。其核心思想是在用户（User）和长周期工作智能体（Worker Agent）之间引入一个“中介层”（Mediator），即 Jarvis。该中介层负责双向沟通：一方面通过语音向用户解释执行进度，另一方面监控 Worker 的执行轨迹，在关键时刻向用户寻求指导并注入反馈。\n\n以下是基于论文附录 A.1 中“Example 1: Recovering from a failed external source”的具体 Pipeline 详解：\n\n**1. 输入与初始化 (Input \u0026 Initialization)**\n*   **任务输入**：用户下达指令，要求 Worker Agent 完成特定任务（例如：获取 Kaiming He 2022 年的会议论文，生成符合特定 Schema 的 TSV 文件，并下载对应的 arXiv 源文件）。\n*   **系统架构**：Worker Agent（如 GPT-5.5）在 OpenClaw 环境中执行任务；Jarvis 作为中介，实时接收 Worker 的 **ReAct trajectory**（包括思考、工具调用、观察结果等文本流）；用户模拟器（Expert User）处于待命状态。\n\n**2. 执行监控与检查点触发 (Execution Monitoring \u0026 Checkpoint Triggering)**\n*   **Worker 执行**：Worker Agent 开始执行，尝试通过工具抓取个人主页获取论文列表。\n*   **失败检测**：工具调用失败（Fetch failed）。Jarvis 的 **Trace Monitoring** 模块检测到这一“失败敏感检查点”（Failure-sensitive checkpoint），识别出这是一个可能导致任务停滞或错误的关键时刻。\n*   **暂停与摘要**：Jarvis 触发 **Interaction Checkpointing** 机制，暂时挂起 Worker 的下一步动作，并生成当前执行状态的简洁摘要。\n\n**3. 中介交互与用户指导 (Mediation \u0026 User Guidance)**\n*   **Jarvis 询问**：Jarvis 向 Expert User 发送请求：“Worker 刚刚遇到工具失败。如果有明显的一行修复方案或验证检查，请提供。”\n*   **用户反馈**：Expert User 基于 Jarvis 提供的上下文，给出简洁指导：“最终答案不是工件本身。验证 TSV 文件是否存在，并检查所需的 TSV Schema。”\n*   **Jarvis 注入**：Jarvis 将用户的指导转化为具体的指令注入回 Worker 的上下文：“不要在工具失败且工件缺失时给出最终答案。如果需要，使用备用的无认证源，生成文件，并在最终确定前运行一次路径/Schema 验证。”\n\n**4. 恢复执行与输出 (Resumption \u0026 Output)**\n*   **Worker 修正**：Worker Agent 接收注入的指导，改变策略。它不再执着于失败的个人主页，而是转向 DBLP、官方会议页面、arXiv 元数据等备用源。\n*   **任务完成**：Worker 成功生成 TSV 文件和源文件，并通过验证。\n*   **最终输出**：任务完成，JarvisBench 记录该次干预（Intervention）并评估任务得分。\n\n**Pipeline 总结**：\n`User Request` → `Worker Execution (ReAct)` → `Jarvis Monitors Trace` → `Detect Failure Checkpoint` → `Jarvis Queries Expert User` → `Expert Provides Concise Guidance` → `Jarvis Injects Feedback into Worker Context` → `Worker Resumes \u0026 Corrects` → `Task Completion`.\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有涉及核心的数学推导或形式化理论证明。它主要是一个系统工程与基准测试（Benchmark）工作，侧重于定义评估协议（Evaluation Protocol）、设计模块化架构（Modular Architecture）以及通过实验数据验证中介层（Mediation Layer）的有效性。因此，跳过此节。\n\n### § 7 实验设计与结论\n\n**提出了什么问题**：\n当前的长周期 AI 智能体（Long-horizon AI agents）虽然能力增强，但与用户的交互依然薄弱（Thin interaction）。用户通常只能获得稀疏的文本更新，缺乏对智能体执行过程的实时感知和控制能力。论文提出：引入一个类似 Jarvis 的“中介层”（Mediator），通过实时语音交互和稀疏的用户指导注入，是否能同时提升任务完成率和用户体验？\n\n**设计了什么实验验证这个问题**：\n作者构建了 **JarvisBench** 基准，包含两个互补的轨道（Tracks），在 34 个 WildClaw 文本任务上进行评估：\n1.  **Agent-Collaboration Track（智能体协作轨道）**：\n    *   **设计**：对比同一 Worker Agent 在“无中介”和“有 Jarvis 中介”两种设置下的表现。Jarvis 仅在检测到失败敏感状态（如工具重复失败、进度停滞）时，向模拟的 Expert User 寻求指导并注入反馈。\n    *   **指标**：Overall Score（任务完成得分）、Relative Gain（相对提升）、# Interventions（干预次数）。\n2.  **User-Interaction Track（用户交互轨道）**：\n    *   **设计**：固定 Worker Agent，更换不同的 Jarvis Brain（LLM）。模拟 Non-expert User 在执行过程中提出关于进度（Progress）和背景（Topic）的问题。\n    *   **指标**：Progress/Topic 评分（1-5分，由 LLM Judge 评估回答是否基于执行轨迹或任务上下文）、Latency（响应延迟）。\n\n**问题的答案是什么**：\n1.  **中介层能显著提升任务性能**：在 Agent-Collaboration Track 中，Jarvis 中介使所有测试的 Worker Agent（GPT-5.4-mini, GPT-5.5, Gemini-3.1-Pro, Claude Opus 4.7）的任务得分均有提升。例如，Claude Opus 4.7 的得分从 64.01% 提升至 75.79%。这表明，通过中介层在关键时刻注入稀疏的用户指导，可以帮助 Worker 从局部失败模式（Local failure modes）中恢复，且不需要用户全程介入。\n2.  **中介层能改善用户体验与透明度**：在 User-Interaction Track 中，Jarvis 能够提供基于执行轨迹（Trace-grounded）的进度解释和任务相关的背景回答，使用户无需查看完整日志即可理解智能体状态。\n3.  **中介层的“大脑”能力至关重要**：实验显示，Jarvis 的效果强烈依赖于其底层 LLM 的能力。更强的 LLM（如 GPT-5.4）在理解复杂上下文、生成准确回答以及判断何时干预方面表现更好。较弱的模型可能导致不必要的干预或回答质量低下。\n4.  **结论**：Jarvis 式的中介层不仅是可用性细节，而是长周期智能体工作流中缺失的关键中间层（Missing middle layer），它通过实时语音连接和稀疏反馈注入，使智能体更透明、可引导且与用户意图更对齐。", "additional_insights": "### § 8 Take-aways\n\nJarvisBench 提出了一种将“中介层（Mediator）”从固定架构解耦为可插拔基准（Plug-and-play Benchmark）的新范式，旨在量化长周期 Agent 工作流中用户与执行者之间的实时通信价值。该基准通过双轨道设计，分别评估中介层在“任务完成度（Agent-Collaboration）”和“用户交互体验（User-Interaction）”上的独立贡献，从而分离了模型推理能力与交互接口设计的影响。实验表明，引入 Jarvis 风格的中介层能显著提升 Worker Agent 的任务成功率，例如使 Claude Opus 4.7 的 WildClaw 整体得分从 64.01% 提升至 75.79%，主要归因于中介层在关键失败点（Failure-sensitive Checkpoints）注入稀疏但精准的用户指导。中介层的核心机制并非替代 Worker 进行推理，而是通过监控 ReAct 轨迹，识别如工具调用失败、进度停滞或高风险操作等状态，并主动向专家用户请求简洁的纠正性反馈。在用户交互方面，中介层能够基于执行轨迹提供 grounded 的进度解释，并回答与任务上下文相关的背景问题，从而在不中断 Worker 执行的前提下保持用户的知情权和控制感。研究进一步揭示，中介层的效果高度依赖于其底层 LLM Brain 的能力，强模型在维持对话质量的同时更能准确吸收动态变化的执行上下文，而弱模型容易出现过度自信或上下文边界混淆。定性分析指出，当前主流 Agent 的主要失败模式并非缺乏工具使用能力，而是在精确性验证、不可逆状态管理及安全边界遵守上的疏忽，中介层通过强制稀疏验证有效缓解了这些特定失败模式。\n\n### § 9 最脆弱的假设\n\n该研究最核心且脆弱的假设是：**中介层（Mediator）能够准确识别出那些“通过简短用户指导即可纠正”的失败敏感状态（Failure-sensitive Checkpoints），且这种干预不会引入显著的延迟或噪声从而抵消其收益。** 如果这一假设不成立，即中介层频繁误判干预时机（例如在 Worker 能够自我恢复时强行打断，或在真正需要干预时未能识别），或者用户提供的指导过于模糊无法被 Worker 有效利用，那么中介层不仅无法提升任务成功率，反而可能因增加交互开销和上下文污染而降低整体效率。论文中提供的证据主要基于模拟的专家用户（Simulated Expert User）和特定的 WildClaw 文本任务，这些环境相对受控，且专家用户的反馈被约束为“简洁且纠正性”的。然而，在真实场景中，非专家用户可能无法提供有效指导，或者中介层的监控策略（Monitoring Policy）可能无法泛化到更复杂、非结构化的长周期任务中。论文缺少对中介层误报率（False Positive Rate）和漏报率（False Negative Rate）的深入分析，也未充分探讨在用户响应延迟较高或指导质量较低时，中介层对 Worker 性能的负面影响。如果中介层无法在“何时干预”这一决策上达到极高的准确率，其作为“缺失中间层”的价值将大打折扣，甚至可能成为系统瓶颈。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 **Agent-Collaboration Track 中中介层对特定失败模式（如工具调用失败）的干预效果**，以验证“稀疏用户指导能提升任务成功率”这一核心 claim。具体方案如下：使用 WildClawBench 中的 5-10 个涉及多步工具调用（如 Web Search + File Write）的文本任务，选择一个中等能力的 Worker Agent（如 GPT-4o-mini 或 Claude Haiku）。首先，运行基线实验，记录 Worker 在遇到工具调用失败（如 API 错误、解析失败）时的自然恢复情况及其最终得分。其次，实现一个简化的中介层逻辑：当检测到连续两次工具调用失败或特定错误码时，暂停 Worker，将错误上下文和当前状态发送给一个“模拟专家”（可以是另一个更强的 LLM，如 GPT-4o，提示其提供一句简洁的纠正建议，如“检查 URL 格式”或“重试并增加超时时间”），然后将该建议注入 Worker 的上下文并恢复执行。最后，对比基线与中介干预后的任务完成率和平均步骤数。如果中介干预组的任务完成率显著高于基线，且干预次数占总步骤比例较低（如 \u003C10%），则支持了论文关于“稀疏指导有效”的 claim；反之，如果干预导致任务失败或步骤数大幅增加，则反驳了该假设，表明中介层的监控策略或指导注入机制在当前设置下无效。此实验无需复现完整的语音交互模块，仅关注核心的“监控-干预-注入”逻辑，足以验证中介层在提升鲁棒性方面的基本价值。", "research_value": "### § 11 最强反例设计\n\n若要挑战 JarvisBench 的核心主张，最有力的反例设计应聚焦于**“中介层引入的认知负荷与上下文污染（Context Pollution）抵消了稀疏指导的收益”**这一替代解释。具体而言，可以设计一个对比实验，引入一个**“静默重试与自我反思（Silent Retry \u0026 Self-Reflection）”**的基线 Worker Agent，该 Agent 具备更强的内部错误恢复机制（如自动切换备用 API、增加重试次数、或进行内部 Chain-of-Thought 自我纠错），但不与任何外部中介交互。\n\n在真实世界的长周期任务中，许多“失败敏感检查点”（Failure-sensitive Checkpoints）实际上是瞬态错误（Transient Errors）或可通过简单重试解决的噪声，而非需要人类专家介入的逻辑死锁。如果 Jarvis 的监控策略（Monitoring Policy）过于敏感，频繁触发 **Interaction Checkpointing**，会导致以下负面效应：\n1.  **上下文窗口膨胀与注意力分散**：每次注入用户指导（User Guidance）都会增加 Worker 的上下文长度，并可能引入与当前执行轨迹无关的噪声指令，导致 Worker 在后续步骤中产生“指令漂移”（Instruction Drift），反而降低了任务完成率。\n2.  **延迟累积与状态不一致**：在分布式或高并发环境中，暂停 Worker 等待用户反馈会引入显著的 Latency，可能导致底层环境状态（如临时文件过期、会话超时）发生变化，使得注入的指导在恢复执行时已失效，甚至引发新的错误。\n\n因此，反例实验应选择在**高噪声、高瞬态失败率**的任务集（如不稳定的 Web Scraping 或动态变化的 API 调用）上运行。如果数据显示，引入 Jarvis 中介后的任务成功率提升并不显著，甚至低于具备自我反思能力的静默基线，且平均任务完成时间（Time-to-Completion）显著增加，则证明 Jarvis 式的中介层在缺乏更精细的“干预必要性评估”机制时，可能是一个净负收益（Net Negative）的组件，其价值被高估。\n\n### § 12 Follow-up Research Idea\n\n基于 JarvisBench 对“中介层”定义的局限——即目前中介层主要依赖**被动监控**和**稀疏干预**，缺乏对任务全局状态的主动规划与预测能力——提出一个新的研究方向：**“预测性中介层（Predictive Mediator）与动态任务分解（Dynamic Task Decomposition）”**。\n\n**(a) 驱动局限**：当前的 Jarvis 原型仅在检测到失败或停滞时才介入，这是一种“事后补救”（Reactive）模式。然而，在长周期任务中，许多失败源于初始指令的模糊性或环境约束的不可见性，等到执行失败再介入往往为时已晚或成本高昂。此外，中介层目前仅作为“通信桥梁”，未参与任务结构的优化。\n\n**(b) 借鉴领域**：借鉴**控制理论中的模型预测控制（Model Predictive Control, MPC）**和**软件工程中动态规划（Dynamic Planning）**的思想。MPC 通过预测未来状态来优化当前控制输入，而动态规划允许在运行时根据反馈调整任务分解粒度。\n\n**(c) 实验设计**：\n构建一个**“预测性 Jarvis（Predictive Jarvis）”**原型，其核心模块不再是简单的 Trace Monitoring，而是一个**“任务状态预测器（Task State Predictor）”**。\n1.  **前置预测**：在 Worker 执行每一步之前，Predictive Jarvis 基于当前上下文和历史轨迹，预测该步骤失败的概率及潜在后果。如果预测失败概率高于阈值，Jarvis 主动在**执行前**向用户请求澄清或提供备选方案，而非在失败后请求修复。\n2.  **动态分解**：Jarvis 不仅注入反馈，还能动态调整 Worker 的任务分解粒度。例如，当检测到复杂子任务时，Jarvis 自动将其拆分为更小的、可验证的原子步骤（Atomic Steps），并在每个原子步骤后设置隐式检查点，无需用户显式干预即可实现细粒度验证。\n3.  **对比实验**：在 WildClaw 任务集上，对比“反应式 Jarvis”（原论文方法）、“预测性 Jarvis”和“无中介基线”。评估指标不仅包括任务完成率，还包括**“预防性干预次数”**（Preventive Interventions）和**“平均失败恢复成本”**（Average Cost of Recovery）。预期结果是，预测性中介层能显著减少严重失败的发生，并通过动态分解提高复杂任务的可控性，从而在更广泛的场景下证明中介层的价值。\n\n这一方向将中介层从“通信管道”升级为“认知协作者”，解决了当前方法在主动性和全局优化方面的不足，开辟了 Agent 协作中“预测与规划”的新研究维度。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Chen Chen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zhehuai Chen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"NVIDIA\"\n    }\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "长期 AI 智能体正变得日益强大，但它们与用户的交互却出奇地薄弱。在大多数工作流中，用户给出初始指令，仅收到选择性的文本更新，从而丧失了对智能体正在做什么或何时介入的清晰感知。这暴露了当前智能体生态系统中缺失的一环：一个始终在线的 Jarvis 式中介，它保持智能体对用户持续可访问。这样的中介应支持与用户的实时语音交互，在不打断工作智能体的情况下回答问题，主动报告进度或困惑，并在必要时将用户指导注入智能体的执行过程中。在本工作中，我们引入了 JarvisBench，这是一个用于衡量长期智能体工作流中介双重价值的基准测试。JarvisBench 包含两个互补的赛道：一个智能体协作赛道，衡量中介是否改善了下游任务完成度；一个用户交互赛道，衡量中介是否使正在进行的执行对用户来说更易于理解、响应更灵敏且更易访问。我们使用一个模块化的参考 Jarvis 原型实例化该基准，并在 OpenClaw 中执行的 34 个纯文本 WildClaw 任务上对其进行评估。基于 GPT-5.5、Claude Opus 4.7、Gemini 和 GPT 的工作智能体的初步结果表明，Jarvis 式中介可以为用户提供基于轨迹的回答，并在适当时刻注入稀疏用户指导时改善任务性能。结果还表明，有效性强烈依赖于中介的大语言模型核心，这既凸显了这一缺失中间层的潜力，也强调了更广泛社区努力的必要性。演示页面 https://cchen1436.github.io/jarvis"}]}, {"name": "Evaluation, Benchmarking \u0026 Security", "count": 5, "papers": [{"title": "Automated Discovery Has No Universally Superior Harness", "arxiv_id": "2607.18235", "authors": "Akshat Gupta, Jermaine Lei, Alexander Lu, Gopala Anumanchipalli, Leshem Choshen", "summary": "Autonomous discovery systems such as OpenEvolve and TTT-Discover are often used as general-purpose harnesses. However, in practice these are composite systems combining several design choices about archives, parent selection, exploration, and budget allocation into a single recipe. Because discovery runs are expensive and inherently stochastic, existing harnesses are often compared using too few independent trials to distinguish key methodological improvements from run-to-run variance. We systematically decompose OpenEvolve-style evolutionary search and the TTT-Discover search harness into its constituent components and systematically evaluate 30 budget-matched harnesses across 12 model-problem pairs using more than 3.1 million LLM rollouts and repeated-trial statistical analysis. Our results show that discovery harnesses have a generalization problem: No fixed harness is reliably superior across the evaluated model-problem pairs, and variants of OpenEvolve generally underperform simpler alternatives. Thus, harness choice is better viewed as a hyperparameter rather than as a universal recipe, and should be tailored to the specific problem and underlying model. We also find that early discovery progress predicts final performance, and use this property to present a budget-matched adaptive-allocation experiment that starts multiple harnesses, prunes weak partial runs, and reallocates compute to stronger survivors, outperforming both commitment to a randomly sampled fixed harness and a non-adaptive harness ensemble. Together, these results motivate shifting from fixed harness selection to online adaptation guided by early performance. We release all run pools including baseline null distributions for every model-problem pair as reusable statistical infrastructure against for future harness proposals.", "category": "cs.CL", "cluster": "Evaluation, Benchmarking \u0026 Security", "tags": ["cs.CL"], "filter_reason": "该论文完全符合“LLM智能体及其演化”的研究范围，具体依据如下：\n\n1.  核心对象匹配 (Agentic Harness \u0026 Evolutionary Search): 论文研究的对象是“Autonomous discovery systems”（如 OpenEvolve, TTT-Discover），这些系统本质上是基于 LLM 的自我演化智能体或演化搜索框架。它们通过迭代生成、评估和选择（parent selection, exploration）来发现新知识或解决方案，属于典型的 Agentic AI 和 Self-Evolving 范畴。\n2.  符合“保留”标准中的 Harness/Scaffold 演化: 根据筛选标准第一步，如果论文研究 agent 的 harness/scaffold/runtime，且核心贡献是让这些组件通过轨迹、反馈或评估结果进行自适应优化，应予以保留。本文不仅分解了现有的演化 harness，还提出了一种自适应分配机制 (adaptive-allocation experiment)，即根据早期发现进度（early discovery progress）动态剪枝弱运行并重新分配计算资源给强幸存者。这是一种典型的基于环境反馈的在线适应 (Online Adaptation) 和 自我完善 (Self-Improvement) 机制，旨在优化智能体的搜索效率。\n3.  非纯基础设施，而是方法论改进: 虽然论文涉及统计分析和基准测试，但其核心贡献在于揭示了固定 harness 的局限性，并提出了从“固定选择”转向“在线适应”的方法论建议。这直接服务于构建更鲁棒、更高效的 LLM 演化智能体，而非单纯的底层硬件或通信协议优化。\n4.  排除项检查: 论文不涉及安全、对齐、多模态视觉、图神经网络或多智能体拓扑编排等排除项。\n\n综上，该论文深入探讨了 LLM 演化智能体的核心组件（harness）及其自适应优化策略，属于“构建、改进、演化 LLM 智能体”的高相关研究。", "intro_logic": "### § 1 研究问题与重要性\n\n本文核心研究问题是：在 LLM 驱动的自主发现（Autonomous Discovery）系统中，现有的搜索框架（Harness）是否具有跨模型和跨任务的通用优越性，还是说 Harness 的选择本质上是一个依赖于具体模型和问题特性的超参数（Hyperparameter）？具体而言，作者质疑了像 OpenEvolve 和 TTT-Discover 这样复杂的复合系统是否真的比简单的基线方法（如 Sequential Best-of-N）更稳健，以及这些复杂组件的收益能否在不同设置下稳定迁移。\n\n这一问题的重要性在于，当前的自主发现研究往往将复杂的搜索策略视为“通用配方”，但在实践中，由于发现过程具有内在的随机性且计算成本高昂，现有工作通常仅通过极少数的独立试验（independent trials）来评估性能。这种低样本量的评估无法有效区分真正的算法改进与运行间的方差（run-to-run variance），导致研究者难以判断哪些组件真正贡献了性能提升，哪些只是特定随机种子下的偶然结果。如果复杂的 Harness 并不具备通用优势，那么盲目采用它们不仅浪费计算资源，还可能阻碍对搜索机制本质的理解。\n\n解决这一问题带来的价值主要体现在三个方面：首先，它揭示了“Harness 泛化问题”（Generalization Problem），即没有单一的固定 Harness 能在所有模型-任务对上表现最佳，这促使社区将 Harness 选择从“固定设计”转向“在线适应”（Online Adaptation）。其次，作者证明了早期发现进度（Early Discovery Progress）与最终性能高度相关，这为基于部分运行反馈（Partial-run Feedback）的动态资源分配提供了理论依据。最后，通过提出自适应 Harness 集成（Adaptive Harness Ensemble）策略，作者展示了如何利用早期信号剪枝弱运行并将计算预算重新分配给强幸存者，从而在相同预算下显著优于固定 Harness 策略。此外，作者发布了超过 310 万次 LLM 推理记录（Rollouts）作为可复用的统计基础设施，为未来 Harness 提案提供了严格的基准测试环境。\n\n### § 2 前人工作与不足\n\n在本文之前，LLM 引导的自主发现领域已经涌现出多种系统，如 FunSearch、AlphaEvolve、OpenEvolve 和 TTT-Discover。这些系统通常结合了档案构建（Archive Construction）、父节点选择（Parent Selection）、探索策略（Exploration）和预算分配（Budget Allocation）等多个设计选择，形成复合的搜索框架。例如，OpenEvolve 引入了基于进化搜索的机制，包括 MAP-Elites 多样性维持和多岛进化（Multi-island Evolution）；TTT-Discover 则采用了基于 PUCT 的树搜索策略。这些工作证明了 LLM 结合迭代生成-评估-改进循环可以在数学、算法和科学发现中取得显著成果。\n\n然而，这些前人工作存在明显的不足，主要体现在评估严谨性和组件可解释性两个方面。首先，由于计算成本限制，现有研究通常仅使用少量独立试验来评估复合系统，这导致无法将方法论上的真实改进与随机方差区分开来。正如 Henderson et al. (2018) 在深度强化学习中指出的那样，结果对随机种子高度敏感，而 LLM 发现系统的评估同样缺乏足够的重复试验来建立稳健的统计显著性。其次，现有工作通常将 Harness 视为一个黑盒整体进行端到端评估，缺乏对各个组件（如 Top-K 档案大小、探索概率 $\\epsilon$、树搜索策略等）的细粒度消融研究（Ablation Study）。这意味着我们不清楚是哪些具体组件带来了性能提升，以及这些组件的收益是否能在不同的模型规模（如 3B 到 120B 参数）和问题类型（如几何优化 vs. 抽象不等式）之间迁移。\n\n此外，虽然有一些工作（如 Gideoni et al., 2026; Tanveer, 2026）指出简单基线可能与复杂管道竞争，或者重新设计的搜索架构可以替代更大的模型，但它们并未系统地分解 Harness 的各个组成部分，也未在预算匹配（Budget-matched）的条件下进行大规模的跨对（Cross-pair）统计分析。因此，之前的研究未能回答一个关键问题：当发现系统成功时，其 Harness 选择是作为通用的方法论原则转移，还是作为模型和任务依赖的超参数？本文通过分解 OpenEvolve 和 TTT-Discover 的组件，并在 12 个模型-任务对上使用超过 310 万次推理进行统计控制评估，填补了这一空白，证明了固定 Harness 的局限性，并推动了向在线自适应分配范式的转变。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM 驱动的自主发现（Autonomous Discovery）领域，早期工作如 FunSearch 和 AlphaEvolve 证明了“生成-评估-改进”循环的有效性，但随后的研究迅速陷入了一种“配方竞赛”：OpenEvolve 引入了进化算法中的岛屿模型和灵感采样，TTT-Discover 引入了基于 PUCT 的树搜索。然而，现有的评估范式存在严重缺陷：由于 LLM 推理成本高昂，大多数研究仅使用极少数的独立试验（trials）来比较不同系统，这导致无法区分真正的算法改进与随机运行的方差（run-to-run variance）。\n\n研究者观察到，复杂的复合系统（composite systems）往往将档案构建、父节点选择、探索策略和预算分配捆绑在一起，使得单一组件的贡献难以剥离。更关键的是，不同模型（如 Qwen 与 GPT-OSS）在不同问题（如几何优化与不等式证明）上表现出的能力差异巨大，暗示了“通用最佳实践”可能并不存在。如果固定 harness 的性能高度依赖于具体的模型-问题对（model-problem pair），那么预先选择一个固定 harness 就是一种高风险的赌注。\n\n与此同时，超参数优化和资源分配领域已有成熟理论（如 Successive Halving, Hyperband, ASHA），表明早期性能往往能预测最终结果，且动态分配资源优于静态分配。结合这些线索，研究者推测：既然没有通用的最佳 harness，且早期反馈具有预测性，那么将 harness 的选择从“静态超参数”转变为“在线资源分配问题”，通过剪枝表现不佳的 harness 并将预算重新分配给表现优异的幸存者，可能比任何单一的复杂 harness 都更有效。这一思路旨在解决 harness 的泛化问题（generalization problem），利用统计基础设施（大规模 rollout 池）来验证这一假设。\n\n### § 4 核心 Intuition\n\n这篇论文的核心直觉是：**Discovery harness 并非通用的算法真理，而是高度依赖模型能力和问题结构的超参数，因此不存在放之四海而皆准的“最佳固定配方”。**\n\n由于不同 harness 在不同模型-问题对上的表现差异巨大且不可预测，预先承诺单一 harness 会浪费大量计算资源在次优策略上；然而，**早期发现进度与最终性能之间存在强相关性**，这使得我们可以在搜索过程中利用部分运行（partial-run）的反馈信号，动态地剪枝表现弱的 harness 并将剩余预算重新分配给表现强的幸存者，从而在同等预算下实现比任何固定 harness 或静态集成更高的平均性能。", "methodology": "# 论文方法论详解\n\n## §5 具体方法与完整 Pipeline\n\n### 5.1 核心思想\n\n这篇论文的方法论核心是**将搜索 harness（控制 LLM 生成-评估循环的策略）视为可分解、可比较、可调度的资源**。作者认为，OpenEvolve 和 TTT-Discover 等系统将多种设计选择打包成单一\"配方\"，导致无法独立评估每个组件的贡献，也无法根据具体问题自适应调整。\n\n### 5.2 完整 Pipeline 示例\n\n以 **Qwen3-4B 模型解决 Circle Packing 问题**为例，完整流程如下：\n\n**第一步：定义搜索空间与基线**\n\n- 输入：初始程序（一个简单的圆形排布代码）\n- 处理：Sequential Best-of-N (BoN) 基线——每次迭代选择当前得分最高的解作为父解，生成 N=16 个变体\n- 输出：100 次独立运行的得分分布（均值 0.85，最高 0.97）\n\n**第二步：Harness 组件分解**\n\n作者将复杂 harness 分解为独立组件：\n\n| 组件 | 选项 | 含义 |\n|------|------|------|\n| Archive 大小 K | 1, 10, 20, 30 | 从前 K 个最优解中选父解 |\n| 探索概率 ε | 0%, 20%, 30% | 以此概率从完整历史中采样 |\n| 广度-深度分配 | N×T 固定 | N=每次生成子解数，T=迭代次数 |\n| 树搜索策略 | UCT/PUCT | 基于访问计数的探索-利用平衡 |\n\n**第三步：预算匹配评估**\n\n- 输入：30 种 harness 配置 × 5 次独立运行\n- 处理：每种配置使用相同总预算（1600 次 LLM 调用）\n- 输出：每种配置在 12 个 model-problem 对上的得分分布\n\n**第四步：统计显著性检验**\n\n对每种配置进行两level检验：\n\n1. **Pair-level bootstrap test**：比较该配置的最佳-5 结果与基线分布\n2. **Cross-pair permutation test**：检验该配置是否在多数 model-problem 对上优于基线\n\n**第五步：自适应分配（核心创新）**\n\n当发现\"没有固定 harness 通用最优\"后，作者提出在线调度策略：\n\n```\n初始：启动 m=12 个不同 harness，各运行 25% 预算\n      ↓\n第一轮剪枝：保留 s=5 个得分最高的\n      ↓\n第二轮剪枝：保留 s=2 个得分最高的\n      ↓\n完成：剩余 2 个 harness 运行至结束\n```\n\n### 5.3 关键 Pipeline 特点\n\n1. **预算守恒**：所有比较都在相同 LLM 调用次数下进行\n2. **经验分布**：用 100 次基线运行构建参考分布，而非假设统计性质\n3. **两level推理**：既看单问题表现，也看跨问题泛化能力\n\n---\n\n## §6 核心数学推导\n\n### 6.1 Sequential BoN 的数学形式\n\nSequential BoN 的父解选择规则可写作：\n\n$$p_t = \\text{TopK}(H_t, 1; S)$$\n\n其中 $H_t$ 是历史解集合，$S(x)$ 是评估器得分。这意味着每次都选择历史中得分最高的解作为父解。\n\n**直觉**：这是一种完全贪心的策略，类似于\"一直沿着当前最优路径走\"。\n\n### 6.2 Epsilon-Greedy 探索\n\n加入探索后，父解选择变为：\n\n$$p_t \\sim \\begin{cases} \\text{Uniform}(H_t) \u0026 \\text{with probability } \\epsilon \\\\ \\text{TopK}(H_t, K; S) \u0026 \\text{with probability } 1-\\epsilon \\end{cases}$$\n\n**直觉**：以 ε 概率随机探索历史中的任意解，以 1-ε 概率从精英档案中选择。这平衡了\"利用已知好解\"和\"探索未知可能性\"。\n\n### 6.3 UCT/PUCT 树搜索\n\nUCT 选择分数：\n\n$$Q_t(x) = \\max_{d \\in D_t(x) \\cup \\{x\\}} S(d)$$\n\n其中 $D_t(x)$ 是以 $x$ 为根的子树中的所有解。UCT 选择：\n\n$$\\text{UCT}_t(x) = Q_t(x) + c_{\\text{uct}} \\sqrt{\\frac{\\log(1+N_p(t))}{1+N_x(t)}}$$\n\n**直觉**：第一项 $Q_t(x)$ 考虑了解及其后代的最佳得分；第二项是探索 bonus，访问次数少的节点获得更高分数。$c_{\\text{uct}}$ 控制探索强度。\n\nPUCT 在此基础上加入先验：\n\n$$\\text{PUCT}_t(x) = Q_t(x) + c_{\\text{puct}} \\cdot P_t(x) \\cdot \\sqrt{\\frac{1+N_p(t)}{1+N_x(t)}}$$\n\n其中 $P_t(x)$ 是基于解的排名的先验概率。\n\n### 6.4 Bootstrap P-value 计算\n\n对于给定配置 $h$，其最佳-5 统计量 $T_h = \\max(s_1^h, ..., s_5^h)$。Bootstrap p-value：\n\n$$\\hat{p}_h = \\frac{1}{R} \\sum_{r=1}^{R} \\mathbf{1}[T_r^0 \\geq T_h]$$\n\n其中 $T_r^0$ 是从基线分布中重采样得到的最佳-5 值。\n\n**直觉**：如果配置 $h$ 的表现远超基线分布（p-value 很小），说明它确实有提升。\n\n### 6.5 Cross-pair Majority-Win 统计\n\n$$P_{\\hat{m}aj}(h) = \\frac{1}{R} \\sum_{r=1}^{R} \\mathbf{1}\\left[\\sum_{j=1}^{12} \\mathbf{1}[M(s_{h,g_j}) \\geq M(s_{r,g_j}^0)] \\geq 7\\right]$$\n\n**直觉**：在 12 个 model-problem 对中，该配置在至少 7 个上击败基线的概率。\n\n---\n\n## §7 实验设计与结论\n\n### 7.1 核心问题\n\n**问题**：现有的 discovery harness（如 OpenEvolve、TTT-Discover）是否具有通用优越性？即，是否存在一种固定配置在所有模型和问题上都优于其他配置？\n\n### 7.2 实验设计\n\n**实验一：Harness 组件分解实验**\n\n- **设计**：从 Sequential BoN 基线出发，逐步添加组件（Archive、ε-探索、广度-深度分配、MAP-Elites、多岛屿等），形成 30 种配置\n- **验证方式**：在 12 个 model-problem 对上各运行 5 次，用 bootstrap 检验每种配置是否显著优于基线\n- **发现**：组件增益具有高度问题依赖性。例如，ε=20% 探索在 Circle Packing 上有效，但在 Second Autocorrelation Inequality 上无效\n\n**实验二：Cross-pair 泛化实验**\n\n- **设计**：使用 majority-win 统计量，检验每种配置是否在多数 model-problem 对上优于基线\n- **验证方式**：Permutation test + Holm 校正\n- **发现**：最强配置 K=1, ε=20% 的 Pmaj=0.914，但经 Holm 校正后不显著；OpenEvolve 完整配置的 Pmaj=0.033，显著低于基线\n\n**实验三：早期反馈预测性实验**\n\n- **设计**：记录每次运行在 10%、25%、50% 预算处的得分，计算与最终得分的 Spearman 相关系数\n- **验证方式**：跨 12 个 model-problem 对的相关性分析\n- **发现**：50% 预算处的得分与最终得分相关性 \u003E0.70（11/12 对），说明早期反馈具有预测价值\n\n**实验四：自适应分配实验**\n\n- **设计**：对比四种预算匹配策略——Sequential BoN（5 次完整运行）、单 harness 基线（随机选一种运行 5 次）、无剪枝集成（随机选 5 种各运行 1 次）、自适应剪枝（多启动、逐步剪枝、聚焦幸存者）\n- **验证方式**：100,000 次重采样模拟，计算平均得分和 vector-battle 胜率\n- **发现**：自适应剪枝（12→5→2→1 策略）平均得分 85.75%，优于 Sequential BoN 的 84.35%\n\n### 7.3 核心结论\n\n| Claim | 验证结果 |\n|-------|----------|\n| 存在通用最优 harness | ❌ 不成立。30 种配置中无一在 Holm 校正后显著优于基线 |\n| OpenEvolve 优于简单基线 | ❌ 不成立。完整 OpenEvolve 配置的 cross-pair 表现最差 |\n| 早期反馈可预测最终表现 | ✅ 成立。50% 预算处的相关性普遍 \u003E0.70 |\n| 自适应分配优于固定 harness | ✅ 成立。最优自适应策略提升 1.4 个百分点 |\n\n### 7.4 实践启示\n\n1. **Harness 选择是超参数**：应针对具体模型和问题进行调优，而非使用默认配方\n2. **在线适应有价值**：在有限预算下，多启动+早剪枝+聚焦幸存者的策略优于固定配置\n3. **简单基线被低估**：Sequential BoN 在 cross-pair 评估中表现稳健，不应被忽视", "additional_insights": "### § 8 Take-aways\n\n1. **Discovery harnesses suffer from a generalization problem**: No single fixed search strategy (e.g., OpenEvolve or TTT-Discover) is universally superior across different LLMs and problem types; performance gains are highly dependent on the specific model–problem pair.\n2. **Complexity does not guarantee improvement**: Adding sophisticated components like multi-island evolution or deep tree search (PUCT) often underperforms simpler baselines like Sequential Best-of-N or lightweight epsilon-greedy exploration, indicating that complex recipes are not robust methodological principles.\n3. **Harness choice is a hyperparameter, not a universal recipe**: Because optimal harnesses vary by context, treating harness selection as a static design decision is suboptimal; it should be viewed as a tunable hyperparameter specific to the underlying model and task.\n4. **Early progress predicts final performance**: There is a strong correlation between partial-run scores (e.g., at 50% budget) and final outcomes, enabling reliable pruning of weak search trajectories before completion.\n5. **Online adaptive allocation outperforms fixed strategies**: An adaptive harness ensemble that starts multiple diverse harnesses, prunes underperformers based on early feedback, and reallocates compute to survivors significantly outperforms both committing to a single fixed harness and running an unpruned ensemble of harnesses.\n\n### § 9 最脆弱的假设\n\n**核心假设：Partial-run evaluator scores are sufficiently informative to distinguish promising harnesses from weak ones early in the search process.**\n\n如果这一假设不成立，即早期表现与最终性能之间缺乏强相关性（例如，某些 harness 需要长时间的“冷启动”才能爆发，或者评估器噪声极大导致早期排名随机），那么基于早期反馈的在线自适应分配策略（Adaptive Harness Ensemble）将失效，甚至可能因为过早剪枝掉潜在的高分 harness 而表现更差。\n\n**为何可能不成立：**\n1. **评估器噪声或延迟反馈**：如果外部评估器（Evaluator）本身具有高方差或计算延迟，早期得分可能无法真实反映程序质量，导致错误剪枝。\n2. **非单调优化轨迹**：某些搜索策略可能在初期探索低分区域以建立多样性，后期才收敛到高分解。如果相关性仅在后期显著，早期剪枝会破坏这种探索机制。\n3. **任务特异性**：论文仅在三个数学/几何任务上验证了相关性。在更复杂的代码生成或科学发现任务中，早期代码片段可能无法体现最终系统的整体性能，导致预测信号失效。\n\n**论文提供的证据与缺失：**\n- **证据**：Section 5.1 展示了在 12 个 model–problem pairs 中，50% 检查点的 Spearman 秩相关系数大多超过 0.70，提供了统计上的支持。\n- **缺失**：论文未深入分析相关性失效的具体案例（如 GPT-OSS-120B 在 Second Autocorrelation Inequality 任务中相关性较低，为 0.651），也未探讨在评估器噪声极大或任务结构更复杂（如长程依赖的代码库）时，这种预测能力是否依然稳健。\n\n### § 10 最小复现实验\n\n**目标**：验证“早期表现预测最终性能”这一关键假设，并测试自适应分配策略在单一任务上的有效性。\n\n**数据**：使用论文开源的 `run pools`（https://github.com/akshat57/harness-generalization），选择一个具体的 model–problem pair（例如 Qwen2.5-3B on Circle Packing），该数据集包含超过 3.1 million 次 rollout 的详细步骤得分。\n\n**实现**：\n1. **数据加载**：加载该 pair 的所有独立运行轨迹，每条轨迹包含每一步的 evaluator score。\n2. **相关性计算**：计算每条轨迹在 25%、50%、75% 预算点时的最高得分与最终得分之间的 Spearman 秩相关系数，复现 Figure 5b 的结果。\n3. **模拟自适应分配**：\n   - 从数据池中随机采样 17 条不同 harness 配置的轨迹。\n   - 在 25% 检查点，根据当前最高得分保留前 1 条轨迹，其余剪枝。\n   - 记录该策略的最终得分。\n   - 对比基线：随机选择 1 条轨迹运行到底（Single-harness baseline）或运行 5 条不同轨迹取最高分（Unpruned ensemble）。\n   - 重复 10,000 次蒙特卡洛模拟，计算平均最终得分。\n\n**测量**：\n- **相关性系数**：验证早期得分与最终得分的秩相关性是否显著为正。\n- **平均最终得分**：比较自适应策略、单 harness 基线和未剪枝集成基线的平均得分。\n\n**结果判定**：\n- **支持 Claim**：如果 50% 检查点的相关系数 \u003E 0.6，且自适应策略的平均最终得分显著高于单 harness 基线和未剪枝集成基线，则支持论文结论。\n- **反驳 Claim**：如果相关性系数接近 0 或为负，或者自适应策略的得分低于基线（表明早期剪枝错误地移除了高分轨迹），则说明该假设在此任务或模型上失效，自适应分配策略不可靠。", "research_value": "### § 11 最强反例设计\n\n要挑战这篇论文的核心结论，最有力的攻击并非质疑其统计显著性，而是攻击其**评估范式的根本局限性**，即“静态预算下的离线模拟”无法捕捉动态搜索过程中的**路径依赖（Path Dependence）**和**涌现行为（Emergent Behavior）**。\n\n首先，论文提出的“自适应 Harness 集成”策略依赖于一个关键假设：早期得分（Early Discovery Progress）是最终性能的无偏估计量。然而，在复杂的自主发现任务中，搜索轨迹往往具有高度的非单调性。一个强有力的反例场景是**“冷启动陷阱”（Cold-start Trap）**。在某些需要深层逻辑重构或长程依赖的任务中（如证明复杂的数学定理或生成具有全局一致性的代码库），简单的 Sequential Best-of-N 或低探索率的 Harness 可能在初期迅速收敛到一个局部最优解（Local Optima），从而在 25% 或 50% 的预算检查点上获得极高的分数。相反，采用高探索率（High $\\epsilon$）或复杂树搜索（如 PUCT）的 Harness 可能在初期花费大量预算进行“看似低效”的多样性探索，导致早期得分较低。论文的自适应策略会基于早期信号错误地剪枝掉这些具有长期潜力的复杂 Harness，而保留了那些陷入局部最优的简单 Harness。这种**“短视偏差”（Myopic Bias）**意味着，虽然自适应策略在论文测试的特定数学/几何任务上有效，但在需要深度探索的任务中，它实际上抑制了发现全局最优解的可能性。\n\n其次，论文将 Harness 视为独立的、可分解的组件，并假设组件间的交互是线性的或可加的。然而，一个理论上的反例是**“组件协同效应”（Component Synergy）**。例如，OpenEvolve 中的 MAP-Elites 多样性维持机制可能与特定的父节点选择策略（Parent Selection）存在非线性的协同作用。当单独评估这些组件时，它们可能表现平平甚至不如基线，但当它们以特定方式组合并在动态环境中运行时，可能产生涌现出的鲁棒性。论文的分解实验（Decomposition Experiment）通过固定其他变量来隔离单个组件，破坏了这种潜在的协同结构。因此，论文得出的“复杂组件无益”的结论可能是一个**“还原论谬误”（Reductionist Fallacy）**，即通过拆解系统而丢失了系统层面的关键属性。\n\n最后，从真实世界场景来看，论文的评估基于**“预算匹配”（Budget-matched）**的静态比较，忽略了**“计算效率”（Compute Efficiency）**的动态权衡。在工业界应用中，LLM 推理成本高昂，且任务截止时间（Deadline）是硬约束。如果复杂的 Harness 虽然最终得分略低，但能以更少的 LLM 调用次数达到相同的性能阈值（Performance Threshold），或者在失败时能提供更丰富的诊断信息（如通过树搜索结构定位错误根源），那么它在实际应用中可能优于简单的 Sequential BoN。论文仅关注最终得分的绝对值，忽略了**“成本-性能曲线”（Cost-Performance Curve）**的形状差异。一个反例实验可以设计为：在达到 90% 最优解得分时，比较不同 Harness 所需的平均 LLM 调用次数。如果复杂 Harness 在此指标上显著优于简单基线，那么论文关于“简单基线被低估”的结论在资源受限的实际场景中就不成立。\n\n### § 12 Follow-up Research Idea\n\n基于论文揭示的“Harness 泛化问题”和“早期反馈预测性”，一个非增量的新颖研究方向是：**从“静态 Harness 选择”转向“元学习驱动的动态 Harness 演化”（Meta-Learning Driven Dynamic Harness Evolution）**。\n\n**（a）驱动局限与未满足需求：**\n论文证明了没有单一的固定 Harness 是通用的，且早期反馈可以预测最终性能。然而，目前的解决方案（自适应剪枝）仍然是**反应式（Reactive）**的：它仅在运行过程中根据得分进行剪枝，而没有利用历史数据来**预测**哪个 Harness 在特定任务上会表现最好。此外，论文将 Harness 视为离散的配置选项，忽略了 Harness 本身可以是一个**连续可优化的策略空间**。未满足的需求是：如何在一个新的、未见过的任务上，快速初始化一个高概率成功的 Harness 配置，而不是盲目启动多个 Harness 并等待早期反馈？\n\n**（b）借鉴相邻领域的方法：**\n可以借鉴**元强化学习（Meta-Reinforcement Learning, Meta-RL）**和**神经架构搜索（Neural Architecture Search, NAS）**中的思想。在 Meta-RL 中，智能体通过在一个任务分布上训练，学习如何快速适应新任务。在 NAS 中，搜索空间本身被参数化，并通过代理模型（Surrogate Model）预测架构性能。我们可以将 Harness 的配置（如 Archive 大小 $K$、探索率 $\\epsilon$、树搜索深度等）视为一个连续的策略向量 $\\theta$。然后，训练一个**元控制器（Meta-Controller）**，它是一个轻量级的神经网络，输入是任务的初始特征（如初始程序的复杂度、评估器的梯度信息、LLM 的初步生成样本分布），输出是最优的 Harness 配置 $\\theta^*$ 或一个动态调整策略。\n\n**（c）第一个实验设计：**\n1. **构建元训练数据集**：利用论文开源的 310 万次 Rollout 数据，不仅记录最终得分，还记录每个 Harness 配置在每一步的**状态特征**（State Features），如当前档案的多样性熵、得分分布的方差、LLM 生成的困惑度（Perplexity）变化等。\n2. **训练元预测模型**：训练一个元学习模型（如 MAML 或 Reptile 变体），其目标是在给定任务的前 5% 预算运行数据后，预测哪个 Harness 配置将在剩余 95% 的预算中表现最佳。模型不仅要预测得分，还要输出一个**“置信度区间”**，以量化预测的不确定性。\n3. **动态 Harness 演化实验**：在一个全新的、未见过的任务（如一个复杂的组合优化问题）上，首先运行一个极短的“探针”阶段（Probe Phase，仅 1% 预算），使用元模型预测最优 Harness 配置。然后，根据预测结果动态调整 Harness 参数，并在运行过程中持续更新元模型的信念（Belief Update）。\n4. **对比基线**：将这种“元学习引导的动态 Harness”与论文的“自适应剪枝集成”以及“固定最佳 Harness”进行对比。关键指标不仅是最终得分，还包括**“适应速度”（Adaptation Speed）**，即达到特定性能阈值所需的 LLM 调用次数。\n\n**与已有工作的区别：**\n论文提出的自适应策略是**后验的（Post-hoc）**，依赖于运行过程中的实际得分进行剪枝，本质上是一种**多臂老虎机（Multi-armed Bandit）**问题。而本提议是**先验的（Prior-based）**和**前瞻性的（Proactive）**，利用元学习从历史数据中提取“任务-Harness 匹配”的通用规律，从而在新任务上实现**零样本或少样本的快速初始化**。这不仅解决了“哪个 Harness 更好”的问题，还解决了“如何快速找到好 Harness”的问题，将 Harness 选择从“超参数调优”提升为“策略学习”问题。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Akshat Gupta\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jermaine Lei\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Alexander Lu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Gopala Anumanchipalli\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Leshem Choshen\",\n      \"affiliations\": [\n        2,\n        3\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"UC Berkeley\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"MIT\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"MIT-IBM Watson AI Lab\"\n    }\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "诸如 OpenEvolve 和 TTT-Discover 之类的自主发现系统通常被用作通用框架。然而，在实践中，这些系统是复合系统，将关于档案、父代选择、探索和预算分配的多种设计选择整合为单一方案。由于发现运行成本高昂且本质上具有随机性，现有框架通常使用过少的独立试验进行比较，难以将关键的方法改进与运行间的方差区分开来。我们将 OpenEvolve 风格的进化搜索和 TTT-Discover 搜索框架系统地分解为其组成组件，并通过超过 310 万次 LLM  rollout 和重复试验统计分析，在 12 个模型-问题对上系统评估了 30 个预算匹配的框架。我们的结果表明，发现框架存在泛化问题：在评估的模型-问题对中，没有固定的框架始终可靠地优于其他框架，且 OpenEvolve 的变体通常表现不如更简单的替代方案。因此，框架选择最好被视为超参数而非通用方案，并应根据特定问题和底层模型进行定制。我们还发现，早期的发现进展可以预测最终性能，并利用这一特性提出了一个预算匹配的自适应分配实验，该实验启动多个框架，剪枝较弱的部分运行，并将计算资源重新分配给较强的幸存者，其表现优于对随机采样的固定框架的承诺以及非自适应框架集成。综上所述，这些结果促使我们从固定的框架选择转向由早期性能引导的在线自适应。我们发布了所有运行池，包括每个模型-问题对的基线零分布，作为未来框架提案的可重用统计基础设施。"}, {"title": "DRNOISE: Benchmarking Deep Research Agents in Misleading Evidence Environments", "arxiv_id": "2607.17291", "authors": "Jun Nie, Zhiqin Yang, Zhenheng Tang, Yonggang Zhang, Xiaowen Chu, Xinmei Tian, Bo Han", "summary": "Deep research agents increasingly operate over the open web, where relevant records coexist with redundant summaries, outdated reports, and misleading documents. Existing evaluations offer limited insight into whether agents preserve sound evidential standards when an ordinary-looking false document is deliberately seeded into a searchable environment and offers a direct shortcut to a conflicting answer. We introduce DRNOISE, a 100-task benchmark for answer recovery under misleading evidence. Each task has a unique gold answer supported by two corroborating indirect record chains; the paired noisy condition adds one plausible document that states a conflicting answer directly. The benchmark spans ten families of evidence operations. Across agents with strong clean-task performance, this single intervention causes 66-88 percentage-point accuracy drops. Trace analyses identify verification inertia as the dominant failure mode: agents often retrieve truthful records but stop before completing and reconciling the evidence chain, instead deferring to the answer-like document. Generic verification prompts reduce but do not close this gap. The setting is especially relevant to open-web deployment, where plausible falsehoods arrive through ordinary-looking pages rather than explicit attacks. Reliable deep research therefore requires more than retrieval and citation; it requires active reconciliation of direct claims with record-level evidence.", "category": "cs.CL", "cluster": "Evaluation, Benchmarking \u0026 Security", "tags": ["cs.CL"], "filter_reason": "该论文符合筛选标准，主要依据如下：\n\n1.  核心研究对象明确：论文标题和摘要明确指出研究对象是 \"Deep Research Agents\"（深度研究智能体），这属于典型的 LLM-based Agents，特别是涉及长程决策、工具使用（检索）和证据推理的智能体场景。\n2.  符合“行为分析与评估基准”的保留规则：根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。” 本文提出了 DRNOISE 基准，专门用于评估智能体在误导性证据环境下的表现，并深入分析了智能体的失败模式（如“verification inertia”验证惯性）。\n3.  旨在改进智能体能力：论文不仅指出了现有智能体在复杂证据链处理上的缺陷，还探讨了通用验证提示（generic verification prompts）的效果，并指出需要更主动的证据调和机制。这种对智能体行为边界的诊断和对改进方向的指引，直接服务于“构建、改进、评估 LLM智能体”的核心目标。\n4.  排除项不适用：虽然涉及“误导性证据”，但这并非针对 AI 安全的对抗攻击（Security for AI）或恶意利用（AI for Security），而是模拟开放网络环境中常见的噪声和错误信息，属于智能体鲁棒性和推理能力的评估范畴，因此不被安全相关排除规则覆盖。也不涉及多智能体拓扑或纯基础设施优化。\n\n综上，该论文通过基准测试和行为分析，深入研究了 LLM 智能体在复杂信息环境下的决策机制和局限性，符合 Agentic AI 研究中关于评估和改进智能体能力的方向。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在开放网络环境中，当存在看似合理但直接给出错误答案的误导性文档（misleading evidence）时，Deep Research Agents 是否仍能坚持基于底层记录（record-level evidence）进行证据链重构，还是倾向于直接采纳该“捷径”答案？具体而言，论文旨在量化评估 Agent 在面临“直接断言”与“间接佐证”冲突时的证据使用策
