y 的 JS 显著高于 compact trajectory memory 且两者均不低于 No-memory baseline，则支持论文的 claim；如果 compact trajectory 与 workflow 之间无显著差异，或 workflow 导致 Acc 大幅下降使 JS 低于 No-memory，则反驳了 procedural memory 更有效的结论。整个实验只需一个数据集、一个模型、两种 memory 类型，避免了复现完整系统的开销，但直接检验了论文最核心的设计建议。", "research_value": "### § 11 最强反例设计\n\n针对论文最脆弱的假设——AR 提升等同于可靠性改善而非过度保守，最强反例应直接攻击 memory 诱导的“拒绝行为”在可回答问题（ABQ）上的副作用。具体实验设计如下：构建一个“伪 UAQ”测试集，这些 ABQ 在表面上具有 UAQ 的特征（如包含生僻实体或看似 false premise 的条件），但通过深度多步检索实际上是可回答的。将四种 memory 方法在此测试集上运行，并引入一个新指标：False Refusal Rate (FRR) on ABQ。如果实验结果显示，注入 memory 后 agent 在这些“困难 ABQ”上的 FRR 显著飙升，而 Acc 相应暴跌，这就证明了 memory 提供的并非“可靠的 answerability 判断”，而是一种浅层的“遇到检索困难即放弃”的 shortcut heuristic。进一步，可以通过调整 JS 指标的权重（如 0.5×Acc + 0.5×AR）来展示论文结论的脆弱性：当 Acc 的权重提高时，memory 带来的 JS 增益将完全消失甚至转为负数。这一反例不仅提供了结果的具体替代解释（即 AR 的提升纯粹是以牺牲复杂推理能力为代价的 over-refusal），还识别出了方法可预测失败的条件——当问题需要超越 memory 中存储的浅层谨慎模式进行深度证据挖掘时，memory 会成为可靠性的毒药。\n\n### § 12 Follow-up Research Idea\n\n基于 memory 诱导过度保守这一核心局限，我提出一个全新的研究框架：**Uncertainty-Calibrated Memory for Agentic Decision-Making**。当前 memory 的根本缺陷在于将连续的认知不确定性降维成了离散的“放弃/继续”指令，导致 agent 在遇到与 memory 中失败案例表面相似的情境时盲目触发 refusal。这一未满足的需求驱动我们将 memory 从“静态行为规则”重构为“可校准的概率先验”。我们可以借鉴 Conformal Prediction 领域的方法，将 memory 中存储的轨迹转化为一种 distribution-free 的不确定性量化工具。具体而言，不再提取“当证据不足时应放弃”的 procedural rule，而是记录“在特定检索状态空间下，最终可回答性的经验分布”。在推理时，agent 根据 memory 计算当前状态属于 UAQ 的 p-value，只有当统计显著性超过 calibrated threshold 时才执行 refusal，否则继续检索。第一个实验将聚焦于构建一个包含“易混淆 ABQ”和“真 UAQ”的对抗性数据集，比较传统 procedural memory 与 Uncertainty-Calibrated Memory 的表现。核心评估指标为 Expected Calibration Error (ECE) 和在 ABQ 上的 False Refusal Rate。预期结果是，传统 memory 因无法区分“证据暂时不足”与“问题不可回答”而导致高 FRR，而新方法通过提供统计保证，能在维持 UAQ 上高 AR 的同时，显著降低对复杂 ABQ 的误杀率。这一提议与已有工作的根本区别在于：它不再将 memory 视为启发式行为的搬运工，而是将其视为塑造 agent 认知边界的概率模型。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Chuanyuan Tan\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Junjie Yu\", \"affiliations\": [2, 3], \"markers\": []},\n    {\"name\": \"Yuxin Wang\", \"affiliations\": [5], \"markers\": []},\n    {\"name\": \"Yining Zheng\", \"affiliations\": [4, 5], \"markers\": []},\n    {\"name\": \"Xipeng Qiu\", \"affiliations\": [4, 5], \"markers\": []},\n    {\"name\": \"Wenliang Chen\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Soochow University\"},\n    {\"id\": 2, \"name\": \"Suzhou City University\"},\n    {\"id\": 3, \"name\": \"Shanghai Key Lab of Intelligent Information Processing\"},\n    {\"id\": 4, \"name\": \"Shanghai Innovation Institute\"},\n    {\"id\": 5, \"name\": \"Fudan University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Work done during an internship at Shanghai Innovation Institute.\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding authors\"}\n  ]\n}\n```", "summary_translation": "可靠处理 unanswerable questions (UAQs) 对于构建可信的基于 LLM 的 agent 至关重要。尽管 memory 在 agent 系统中被广泛使用，但其在可靠的 UAQ 处理中的作用仍不清楚。我们在统一的 agentic RAG 框架下，对用于 UAQ 处理的 agent memory 进行了系统性研究，在三个与 UAQ 相关的 dataset 和两个 base model 上评估了四种代表性的 memory 方法。我们发现，memory 在某些设置下可以提升 UAQ 性能，但这种增益是选择性的而非普遍的，并且在 dataset shift 下仍然脆弱。有趣的是，跨 model 的 memory 复用通常比跨 dataset 迁移更可行，这表明 answerability pattern 的转变对 memory 复用构成的挑战比 base model 本身的变化更大。我们进一步发现，与 trajectory shaping 相比，通过 decision guidance 能更好地保留 UAQ 增益，并且 memory 的有效性在很大程度上取决于 representation。具体而言，procedural memory 和 rule-based memory 通常为 UAQ 处理提供最可靠的支持，而当 procedural guidance 与 complementary behavioral signal 结合时，memory composition 最为有效。总体而言，我们的研究结果表明，可靠的 UAQ memory 较少依赖于存储大量经验，而更多依赖于保留可迁移的 behavioral guidance。"}]}, {"name": "RL for Agent Training", "count": 2, "papers": [{"title": "VICT: Verifier-Instrumented Credit Tracing for Long-Horizon LLM Agent Reinforcement Learning", "arxiv_id": "2608.28128", "authors": "Pengcheng Li, Zhengyang Zhang, Dongxu Zhang, Sui Huang, Shaohua Ma", "summary": "Fine-grained credit assignment is a central challenge in reinforcement learning for long horizon LLM agents. Standard objectives often train from programmatically verifiable terminal rewards by broadcasting each sparse outcome to every action in a trajectory. Existing methods typically seek finer credit from the rollout side, constructing auxiliary trajectory signals or additional comparisons to estimate action importance. Although useful, these approaches still treat the verifier that judged success as a scalar reward, discarding its internal task structure. Our key insight is that many verifiable tasks already encode the relevant checks inside their terminal verifier. We propose VICT (VerifierInstrumented Credit Tracing), a training-time interface that exposes executable or evidence backed atoms and traces them back to actions through dependency-valid proof edges. VICT redistributes group-relative advantage only along those edges, shifting credit assignment from rollout-side inference to verifierside tracing. It preserves the original terminal reward, abstains when evidence is incomplete or ambiguous, and changes only the training-time advantage tensor, requiring no learned critic, process labels, branch rollouts, or inference-time verifier access. On ALFWorld and WebShop, VICT improves substantially over outcome-only training and achieves strong performance alongside recent fine-grained credit methods; ablations rule out dense atom rewards, final-commit credit, temporal proximity, and sparsity as sufficient explanations.", "category": "cs.LG", "cluster": "RL for Agent Training", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文解决的核心问题是 long-horizon LLM agent reinforcement learning 中的 fine-grained credit assignment 难题。当 LLM agent 在多轮交互环境中完成任务时，RL 训练通常依赖 programmatically verifiable terminal rewards（如任务是否成功的 0/1 信号），并通过 RLOO 或 GRPO 等 group-based 方法将这一 sparse terminal outcome 均匀广播到 trajectory 中的每一个 action。然而在长序列交互中，真正决定成败的往往只有少数几个关键决策（如选择正确物品、执行关键 API 调用、做出最终 commit），绝大多数 action 只是中间过渡步骤。将同一个 trajectory-level advantage 无差别地分配给所有 action，会导致关键决策与无关操作获得相同的梯度信号，严重降低样本效率并可能误导 policy 学习。这个问题之所以重要，是因为 LLM agent 正在从静态文本生成走向需要多步决策的交互式环境（如 web 购物、embodied household 任务、tool-use 服务场景），而 RL 是优化这类 verifiable outcome 的自然范式——如果 credit assignment 瓶颈不解决，long-horizon agent 的 RL 训练就难以扩展。解决这一问题能直接提升 agent 训练的 sample efficiency 和最终性能，同时为 verifier 结构化信号在 RL 中的应用开辟新路径。\n\n### § 2 前人工作与不足\n\n此问题之前已被多条研究路线触及，但均从 rollout side 构造 proxy signal 来推断 action importance，而非利用 terminal verifier 本身的内部结构。GiGPO 通过比较 repeated environment states 上的 actions 来估计局部优势，SALT 利用 trajectory graph 区分 shared 与 divergent steps，ProxMO 用 semantic proximity 替代 hard state grouping，HCAPO 通过 hindsight reasoning 估计 action utility。这些方法相比 uniform trajectory-level credit 确有改进，但存在根本性局限：state similarity 或 trajectory graph 可能合并具有不同 verifier-relevant facts 的状态，导致 credit 被错误归因；hindsight feedback 依赖额外的辅助判断，引入新的噪声源；branch-based 方法（如 BranPO、Tree search 方法）虽能暴露 local preferences，但需要额外采样，显著增加 rollout 成本。更关键的是，所有这些方法都将 terminal verifier 视为一个不透明的 scalar reward oracle，完全忽略了 verifier 内部已编码的 task structure——verifier 检查的具体事实（如 required state changes、forbidden operations、observed evidence、final commitments）在 credit assignment 过程中被丢弃。另一条路线是 process supervision 和 PRMs，它们提供 step-level feedback，但需要人工标注、learned reward model 或 search-generated supervision，引入额外的训练成本和潜在的 reward hacking 风险。Reward shaping 和 reward machines 虽然证明了 reward structure 的利用价值，但此前未被应用于 LLM agent 的 programmatic verifier 场景。VICT 的作者识别到一个被忽视的事实：许多 verifiable agent task 的 terminal verifier 本身就是可 instrument 的程序，其内部检查逻辑可以直接暴露为 executable atoms 并通过 dependency-valid proof edges 追溯到具体 actions，从而将 credit assignment 从 rollout-side inference 转变为 verifier-side tracing——这一信息源此前的所有方法均未利用，因为标准 RL 接口只暴露 final score 而隐藏 verifier 的内部结构。", "core_insight": "### § 3 重建作者的思考路径\n\n长序列 LLM agent 的 RL 训练面临一个核心困难：terminal reward 是 sparse 的，标准做法是将同一个 trajectory-level advantage 广播到每一步 action，但真正决定成败的往往只有少数几个决策。近年来的改进方法——GiGPO 比较重复状态、SALT 构造 trajectory graph、ProxMO 用语义邻近替代硬状态分组、HCAPO 做 hindsight 推理、tree/branch 方法做分支采样——都在 rollout side 寻找更细粒度的比较单元来估计 action importance。但这些方法有一个共同的盲区：它们都从 scalar outcome 反向推断哪些 action 重要，而真正定义了\"成功\"的那个 programmatic verifier 的内部结构被完全丢弃了。\n\n一个自然的观察是：在 ALFWorld、WebShop、τ-bench 这类可验证任务中，terminal reward 并不是一个黑箱标量，而是由一个程序化 verifier 计算出来的，这个 verifier 内部已经在检查具体的事实——object identity 是否正确、transformation 是否完成、budget 是否满足、confirmation 是否获得、forbidden field 是否被修改。reward shaping、reward machines、reward decomposition 等经典 RL 工作早已表明 reward 内部的结构可以提供有用的学习信号；process supervision 和 PRM 也证明了 step-level feedback 的价值，但它们通常需要额外的标签或 learned reward model。那么，如果 verifier 内部已经编码了这些检查，为什么不直接把它们暴露出来用于 credit assignment？\n\n由此产生了一个方向性的转换：credit assignment 的问题不应该被表述为\"从 scalar outcome 反向推断 action importance\"，而应该被表述为\"检查 outcome 是如何被 verifier 产生的\"。如果一个 verifier 检查了\"product type 是否为 tuxedo shirt\"这个 atom，而 trajectory 中有一个 action（click product page）使得这个 atom 变得 evaluable，另一个 action（buy now）commit 了这个 atom 的违反状态，那么 credit 应该沿着这条可观察的 proof edge 分配，而不是均匀广播。关键在于，这种分配方式不需要引入新的 reward signal 或 learned model——它只是把 verifier 已经在做的事情结构化地暴露给 optimizer。\n\n但这里有一个工程上的约束：不是所有 verifier 都能被自动拆解，也不是所有 atom 都能可靠地追溯到 action。因此方法必须有一个 abstention 机制——当证据不完整、依赖模糊、或 conformance 测试失败时，回退到标准的 outcome-only advantage。这保证了方法不会在不可靠的情况下制造虚假的 credit signal。\n\n### § 4 核心 Intuition\n\n现有方法从 rollout side 用 proxy signal（状态相似性、trajectory graph、hindsight）反向推断哪些 action 重要，但判断任务成功的 verifier 本身已经编码了任务的结构——它检查了哪些事实、依赖了哪些前提、commit 了哪些终态。VICT 的 intuition 是：与其从 outcome 反向猜，不如直接把 verifier 内部的检查拆成 executable atoms，通过可观察的 witness 关系（write、reveal、commit、violation）把这些 atoms 追溯到具体的 action，然后只沿着这些 dependency-valid proof edges 重新分配 advantage。让先前方法失效的是它们把 verifier 当作一个 scalar reward 黑箱；让这个方法奏效的是它把 verifier 当作一个可审计的 credit tracing 接口——只在能建立可靠证明链时分配 credit，否则 abstain。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Programmatic Verifier] --(Instrumentation)--\u003E [Verifier Atoms]\n                                                      |\n[Trajectory (Actions)] --(Evidence Tracing)----\u003E [Proof Edges]\n                                                      |\n                                                      v\n                                [Dependency-Core Attribution]\n                                                      |\n[Group-Relative Advantage] -------------------\u003E [Advantage Correction]\n                                                      |\n                                                      v\n                                [Corrected Advantage Tensor] -\u003E [Policy]\n```\n\n**节点解释：**\n1. **Verifier Instrumentation**：将原本只输出标量结果的 programmatic verifier 进行显式工程化拆解，暴露其内部的具体检查逻辑，形成 executable 或 evidence-backed 的 verifier atoms（例如检查“预算是否满足”或“商品类型是否正确”）。\n2. **Evidence Tracing**：遍历 agent 的交互轨迹，寻找能够使得上述 atoms 变得 evaluable 或被违反的具体 actions，并在这些 actions 与 atoms 之间建立 dependency-valid 的 proof edges。\n3. **Dependency-Core Attribution**：当 verifier 接口符合规范、依赖有效的核心识别出相关 atom，且固定的见证关系将该 atom 链接到某个 action 时，系统产生一个 eligibility guarantee（而非严格的因果证明）。如果证据不完整或模糊，该机制将弃权。\n4. **Advantage Correction**：系统保留原始的 terminal reward 作为结果锚点，不改变奖励本身，而是仅修改 training-time advantage tensor。它将 group-relative advantage 仅沿着已验证的 proof edges 进行重新分配，而非均匀广播。\n5. **Policy Update**：使用修正后的 Corrected Advantage Tensor 进行策略梯度更新。该过程不需要 learned critic、process labels、branch rollouts，也不需要在推理时访问 verifier。\n\n### § 7 实验设计与结论\n\n**提出什么问题**：\n在 long-horizon LLM agent 的 RL 训练中，能否通过暴露并利用 terminal verifier 的内部任务结构（而非从 rollout side 反向推断）来实现更精细、更可靠的 credit assignment，从而提升样本效率和最终性能？\n\n**用什么实验验证**：\n1. **主实验**：在 ALFWorld 和 WebShop 两个长序列可验证 agent 基准上，将 VICT 与 outcome-only 训练（如 GRPO）以及最近的 fine-grained credit assignment 方法进行对比。此外，在 τ-bench 上使用不同的 backbone 和协议进行 service-agent 验证。\n2. **消融实验**：设计消融以排除其他可能导致性能提升的替代解释，包括 dense atom rewards、final-commit credit、temporal proximity 以及 sparsity 的影响。\n3. **接口诊断**：通过 reconstruction、mutation conformance、eligibility、coverage、sparsity、abstention、core-size 和 cost 等多项指标审计 verifier interface 的可靠性与开销。\n\n**结论是什么**：\n在 ALFWorld 和 WebShop 上，VICT 相比仅使用 outcome-only 训练的 GRPO 取得了显著提升，并且与近期先进的 fine-grained credit 方法保持了强劲的竞争力；τ-bench 的结果提供了跨领域的 service-agent 验证。消融实验明确排除了密集奖励或简单时间邻近性等替代解释，证明性能提升确实来源于 verifier-backed 的结构化信用分配机制。", "additional_insights": "## § 8 Take-aways\n\nVICT 的核心 insight 是：许多可验证任务的 terminal verifier 内部已经编码了结构化的检查逻辑（如状态变更、证据揭示、最终提交），标准 RL 接口将这些检查坍缩为标量 reward，丢弃了可用于 credit assignment 的内部结构。VICT 将 verifier instrument 为 executable atoms（如 `target_object_held`、`purchase_committed`、`confirmation_obtained`），通过 dependency rules 定义 atom 间的有效组合，再通过 witness predicates（direct write、evidence reveal、commit、violation）将 atoms 链接到具体 actions，形成 proof graph。在此基础上，VICT 使用 budgeted greedy search 找到 dependency-valid core——即对 terminal score 有实际影响的 atom 子集——仅对这些 core atoms 对应的、有 proof edge 支持的 actions 分配 group-normalized advantage correction。该方法仅修改训练时的 advantage tensor，不引入 learned critic、process labels、branch rollouts 或 inference-time verifier access，且在证据不完整或 ambiguous 时主动 abstain，回退到 base advantage。实验在 ALFWorld 和 WebShop 上分别取得相对 GRPO 16.1 和 17.5 个百分点的提升（7B 模型），且与 rollout-side 方法（GiGPO、SALT、HCAPO）组合时进一步增益。Ablation 表明，dense atom rewards、commit-only credit、temporal proximity、randomized proof edges 均无法解释 VICT 的增益——dependency core + proof edge + group normalization 三者缺一不可。Verifier interface 的 reconstruction conformance 达到 99.6-100%，mutation conformance 达到 98.6-100%，但 proof coverage 仅 84.9-92.4%，abstention rate 为 8.1-15.8%，说明方法在可验证的 benchmark 上可行但并非万能。工程成本为 118-238 LoC 的 adapter 和 6.5-11.5 小时的开发投入，训练开销 11.9-16.7%。\n\n## § 9 最脆弱的假设\n\nVICT 最关键且失败代价最大的假设是：**verifier 的内部结构（atoms + dependencies）能够被忠实分解，且通过 witness predicates 构建的 proof edge 能够可靠地将 atom 归因到具体 action**。整个方法的价值主张建立在此之上——如果 atom 分解不能忠实重建 terminal verifier，或者 proof edge 将 credit 错误地分配到与任务成功无关的 action 上，那么所谓的 \"verifier-backed credit\" 不过是另一种噪声信号，甚至可能比 uniform credit 更有害。\n\n这个假设在实际中可能不成立的原因有几层。第一，proof edge 的构建依赖 witness predicate 对 trajectory log 的确定性匹配，但许多真实环境中的 verifier-relevant state change 是隐式的或跨多个 action 分布的——例如，一个搜索 action 揭示了部分证据，但真正决定 verifier atom 状态的是后续多个 action 的组合效应，单个 witness edge 难以捕获这种组合性。第二，论文承认 proof edge 只保证 \"verifier-defined eligibility\" 而非 causal necessity：redundant 或 correlated 的 action 可能同时满足 witness predicate 并获得 credit，即使其中只有一个 action 是真正必要的。Table 14 的 hand audit 显示，ALFWorld 中 150 条 credited edge 有 9 条 redundant、6 条 correlated；WebShop 中有 13 条 redundant、7 条 correlated。更关键的是，fixed-continuation intervention 显示替换 credited action 为 no-op 后，ALFWorld 有 5/60 例、WebShop 有 8/60 例的 verifier score 未下降——这意味着约 8-13% 的 credit 被分配到了对 verifier score 无实际影响的 action 上。第三，conformance test 只验证 atom aggregator 能否重建 terminal score，但无法检测 witness mapping 的错误——一个 conformance 通过的 interface 仍可能将 atom 错误地归因到不相关的 action，因为 conformance 测的是 score 重建而非 edge 正确性。论文提供的证据局限于三个具有相对简单、programmatic verifier 的 benchmark（atom 数 5.8-11.2），且 abstention rate 已达 8-16%，暗示在更复杂的 verifier 结构下（如 LLM-as-judge、hidden state、holistic judgment），这一假设的成立性会显著下降。\n\n## § 10 最小复现实验\n\n在一周时间内，可以验证 VICT 最核心的 claim——**proof-edge-constrained credit 比 outcome-only credit 和 dense atom reward 更准确地分解失败 trajectory 中的 credit**——而无需运行完整 RL 训练。具体方案如下。\n\n**数据与工具**：使用 ALFWorld 的 Heat 任务类型（如 \"heat some egg and put it in countertop\"），用预训练的 Qwen2.5-7B-Instruct 以 ReAct prompt 收集约 200 条 trajectory，包含成功和失败案例。无需训练 policy，仅做离线分析。\n\n**实现内容**：为 Heat 任务构建最小 verifier interface，包含 3 个 atoms：`target_object_held`（是否持有正确物体）、`transformation_heated`（物体是否被加热）、`final_placement`（加热后的物体是否放在正确位置）。实现 3 个 witness predicates：direct write（take/heat/move action 改变对应 state variable）、evidence reveal（搜索 action 揭示目标物体位置）、commit（最终放置 action）。对每条 trajectory 构建 proof graph 并计算 dependency core。然后对每条 trajectory 中的每个 action 计算三种 credit 信号：(a) outcome-only（成功全 +1，失败全 -1），(b) dense atom reward（每个 satisfied atom 对最近的前置 action 给正信号），(c) VICT correction（仅对 core atom + proof edge 支持的 action 给 group-normalized correction）。\n\n**测量指标**：聚焦于失败 trajectory 中的 credit 分解质量。选取那些\"部分正确\"的失败 trajectory——例如 agent 正确找到并加热了 egg，但最终放错了位置。对每条这样的 trajectory，检查：(1) VICT 是否对正确的中间 action（take egg、heat egg）分配正 credit，同时对错误的 commit action（move to wrong location）分配负 credit；(2) outcome-only 是否将所有 action 统一标记为负；(3) dense atom reward 是否对中间 action 给正信号但无法对错误的 commit action 给负信号。用 hand-labeled ground truth（人工标注每个 action 是否正确）计算三种方法与 ground truth 的 rank correlation（如 Kendall's τ）。\n\n**判定标准**：如果 VICT 的 τ 显著高于 outcome-only 和 dense atom reward（p \u003C 0.05，配对 bootstrap 检验），则支持其核心 claim——verifier 结构化 credit 比标量 reward 和简单 atom 分解更准确。如果 VICT 的 τ 与 dense atom reward 无显著差异，则反驳其核心 claim，说明 dependency core 和 proof edge 的额外复杂性并未带来 credit 分解质量的提升，论文实验中的性能增益可能来自其他因素（如 group normalization 的正则化效应）。这个实验不依赖 RL 训练的稳定性，能在 2-3 天内完成数据收集，剩余时间用于 interface 实现和分析。", "research_value": "### § 11 最强反例设计\n\n要对 VICT 进行最有力的攻击，我会针对其最脆弱的假设——即“verifier-defined eligibility”等价于 causal necessity——设计一个“Decoy-Action”环境反例，并提出其性能增益源于 implicit behavioral regularization 而非 accurate credit assignment 的替代解释。VICT 的 proof edge 依赖 witness predicate 的确定性匹配，只要 action 触发了特定的 state change 就会被归因 credit，完全忽略了该 action 在全局 trajectory 中的因果效用。我会在 ALFWorld 的基础上引入一类“副作用任务”：例如，agent 需要加热 egg 并放到 countertop，但环境中存在一个 decoy 物体（如 microwave 内的一个 sensor）。如果 agent 执行 `take sensor` 再 `put sensor in microwave`，同样会触发 `transformation_heated` 的 witness predicate（因为 microwave 状态改变），但这实际上破坏了后续任务。由于 VICT 的 proof graph 只检查 verifier-defined atoms 是否被满足，它会将正 credit 分配给这个破坏性的 `take sensor` action，仅仅因为它匹配了 direct write 的 evidence pattern。我会训练两个 agent，一个使用 GRPO，一个使用 VICT，并在这个含有 decoy 干扰的环境中对比。我预测 VICT 会比 GRPO 更快地收敛到次优且危险的 policy，因为它系统性地强化了那些满足局部 witness 但全局有害的 redundant/correlated actions。如果实验证明 VICT 在此场景下表现更差，就能有力反驳其核心 claim，证明所谓的 verifier-backed credit 不过是一种依赖特定环境结构的 spurious correlation，其在标准 ALFWorld 上的增益仅仅是因为该环境过于干净，使得 eligible actions 恰好也是 causally necessary actions。\n\n### § 12 Follow-up Research Idea\n\nVICT 的核心局限在于其依赖静态的、人工编写的 witness predicates 来进行确定性匹配，这在 verifier 结构不可解析（如 LLM-as-judge）或 state change 隐式分布时彻底失效。这一未满足的需求驱动了一个全新的研究方向：**Causal Counterfactual Credit Assignment (C3A)**——将 credit assignment 从“verifier-side rule tracing”转变为“trajectory-side causal probing”。我们可以借鉴因果推断领域的 Structural Causal Models (SCMs) 与 Individual Treatment Effect (ITE) 估计，结合 LLM 的 self-simulation 能力，绕过对 programmatic verifier 的依赖。C3A 的核心思想是：对于 trajectory 中的任意 action $a_t$，利用一个 critic LLM 在 latent space 中生成 counterfactual trajectory——即假设 $a_t$ 被替换为 no-op 或其他 semantically neutral action，后续步骤由 LLM 自回归补全，然后查询 terminal LLM-judge 获取反事实结局的 score。Factual score 与 counterfactual score 的差异即为该 action 的 causal effect estimate，直接作为其 dense credit。第一个实验将聚焦于一个纯 LLM-as-judge 的长程多轮谈判或创意写作任务，这类任务没有任何可 instrument 的 programmatic atoms。我会收集 Qwen2.5-7B 的 trajectories，使用 GPT-4o 作为 counterfactual rollout generator 和 terminal judge，计算每个 action 的 C3A credit，并用该 credit 替代 uniform advantage 训练 policy。与 VICT 不同，C3A 不需要任何环境 adapter 或人工定义 dependency rules，直接作用于 holistic judgment；与 GiGPO 等 rollout-side 方法不同，C3A 无需昂贵的真实环境交互，而是利用 LLM 自身的 prior 在语义空间进行高效的 hypothetical branching，从而为不可验证环境下的 long-horizon RL 打开一条全新路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Pengcheng Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhengyang Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Dongxu Zhang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Sui Huang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Shaohua Ma\", \"affiliations\": [1], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Tsinghua University\"},\n    {\"id\": 2, \"name\": \"Xi'an Jiaotong University\"},\n    {\"id\": 3, \"name\": \"Jiaxing Nanhu University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author. Email: lipc24@mails.tsinghua.edu.cn\"}\n  ]\n}\n```", "summary_translation": "细粒度 credit assignment 是 long horizon LLM agents 强化学习中的一个核心挑战。标准 objective 通常从可编程验证的 terminal rewards 进行训练，方法是将每个稀疏结果广播到 trajectory 中的每个 action。现有方法通常从 rollout 侧寻求更细粒度的 credit，通过构建 auxiliary trajectory signals 或额外的比较来估计 action 重要性。尽管有用，这些方法仍然将判断成功的 verifier 视为 scalar reward，丢弃了其内部的 task structure。我们的关键 insight 是，许多可验证任务已经在其 terminal verifier 内部编码了相关的检查。我们提出 VICT (VerifierInstrumented Credit Tracing)，这是一种 training-time interface，它暴露可执行的或基于证据的 atoms，并通过 dependency-valid proof edges 将其追溯回 action。VICT 仅沿着这些 edge 重新分配 group-relative advantage，将 credit assignment 从 rollout 侧推断转移到 verifier 侧追踪。它保留了原始的 terminal reward，在证据不完整或模糊时弃权，并且仅更改 training-time advantage tensor，不需要 learned critic、process labels、branch rollouts 或 inference-time verifier access。在 ALFWorld 和 WebShop 上，VICT 相比 outcome-only training 有显著提升，并与最近的细粒度 credit 方法取得了同样强劲的性能；ablation 排除了 dense atom rewards、final-commit credit、temporal proximity 和 sparsity 作为充分解释。"}, {"title": "Learning to Use Tools: Reinforcement Learning for Tool-Integrated Mathematical Reasoning", "arxiv_id": "2608.28447", "authors": "Minghui Xu, Zi Wang", "summary": "Current large language models (LLMs) increasingly benefit from external tool integration, especially for tasks requiring reliable computation and verification. Motivated by this, we study calculator tool calling for improving mathematical reasoning on the Countdown task. We first analyze reasoning failures and find that calculation errors account for a substantial portion of incorrect responses. We then construct supervised fine-tuning datasets to teach the model useful tool-use patterns and how to interpret returned outputs. Building on this tool-formatted policy, we apply several on-policy reinforcement learning methods, including RLOO, RLOO++, GRPO, and DAPO, using automatically verifiable final-answer rewards. To enable a more reliable evaluation, we construct a fresh 1,024-problem held-out Countdown benchmark with no exact overlap with the training data. Our results show that calculator tool integration consistently improves both SFT and RL baselines, yielding roughly 10 percentage-point gains across pass@k. Among the RL methods, Tool-DAPO achieves the strongest performance, improving pass@1 from 35.8% for Tool-SFT to 66.0%. Further analysis shows that RL encourages more effective tool use even when only final-answer rewards are provided. These findings suggest that tool integration reduces arithmetic and verification errors, while RL increases the probability of correct reasoning traces.", "category": "cs.AI", "cluster": "RL for Agent Training", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是通过监督微调（SFT）和强化学习（RL）训练大语言模型有效地使用外部工具（计算器），以解决数学推理中的计算错误问题。根据您的筛选标准，虽然论文的应用场景是数学推理，但其本质是研究如何通过 RL（如 RLOO, GRPO, DAPO）来训练和改进模型的“工具使用”能力，这属于智能体核心能力（Tool Use / Tool Augmentation）的训练与改进。摘要中明确提到了“tool integration”、“tool calling”、“tool-use patterns”和“effective tool use”等智能体相关机制，符合您在第一步中“保留：如果论文研究 agent training/distillation/RL，并且标题或摘要明确指向 Tool Use”的规则。同时，它不涉及被排除的安全、多模态、图结构或纯基础设施内容。因此，该论文与您关于构建和改进 LLM 智能体工具使用能力的研究方向高度相关。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的研究问题是：如何通过外部计算器工具的集成与强化学习的结合，提升大型语言模型在多步数学推理任务中的可靠性与准确率。具体而言，作者以Countdown任务为测试平台，探究模型在生成中间推理步骤时，能否通过调用计算器纠正算术错误并验证中间结果，同时利用仅基于最终答案正确性的自动验证奖励来优化工具调用策略。该问题的重要性在于，尽管现代LLMs在编码和数学推理方面取得了显著进展，但其自回归的next-token预测机制和tokenization过程缺乏显式的精确计算与验证机制，导致在需要严格数值计算的多步问题中极易产生算术和逻辑错误。解决这一问题不仅能有效减少模型的计算与验证失误，还能通过RL提高正确推理轨迹的采样概率，从而显著增强LLMs在复杂推理任务中的可靠性，为构建更值得信赖的AI推理系统提供方法论支持。\n\n### § 2 前人工作与不足\n该问题在本文之前已被部分探索，但现有研究在方法稳定性、评测可靠性及工具与RL的协同机制上存在明显不足。在工具增强推理方面，早期的ReAct (Yao et al., 2023) 虽然将自然语言推理与外部动作交错，但并未通过RL训练模型何时及如何调用工具；而近期的ReTool (Feng et al., 2025) 和In-Context RL for Tool Use (Ye et al., 2026) 虽开始尝试用RL训练工具调用，却未深入分析RL与工具结合的具体动态及失败模式。在RL方法本身，RLOO (Ahmadian et al., 2024) 和GRPO (Shao et al., 2024) 等策略梯度方法虽能利用可验证奖励优化推理，但Yue et al. (2025) 和Liu et al. (2025) 指出，RLVR的收益主要源于对基础模型已有正确轨迹的概率重分配，而非真正扩展推理覆盖范围，且对于模型完全无法采样的正确轨迹（零正确样本）缺乏改善能力。此外，GRPO在组内奖励均匀时因除以不稳定的组内标准差而产生噪声更新，导致策略偏离SFT初始化并崩溃。在评测方面，原始Countdown公开测试集仅含50个样本，导致pass@k估计噪声极大，难以进行可靠的细粒度比较。本文通过构建1024题的全新held-out benchmark、对比多种RL算法并引入动态采样与不对称裁剪的DAPO (Yu et al., 2026)，系统性地填补了这些方法与评测上的缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n在探讨如何提升 LLM 的数学推理能力时，研究者首先观察到，尽管基于 next-token prediction 的模型能够生成连贯的 reasoning steps，但在需要精确数值计算的多步任务（如 Countdown）中，它们极易在算术运算上犯错。这种 failure mode 并非源于逻辑规划能力的缺失，而是由于模型内部缺乏可靠的计算与验证机制。基于这一经验观察，引入外部计算器工具成为了一个自然的解决方向：如果模型能在推理过程中调用计算器并基于返回的 observation 继续推理，就能有效避免因局部计算错误导致整体推理偏离正轨。\n\n然而，仅仅通过 supervised fine-tuning (SFT) 教模型使用工具可能是不够的。SFT 只能展示工具的使用模式，但无法让模型学会在何种情境下、何时调用工具是最优的。此时，研究者注意到 reinforcement learning (RL)，特别是基于可验证奖励的 RLVR，在提升 LLM 推理能力方面展现出巨大潜力。Countdown 任务具有一个天然优势：其最终答案可以通过 verifier 自动验证，这为 RL 提供了无需人工标注的 reward signal。研究者推测，如果将工具调用集成到 RL 的 rollout 过程中，并仅使用最终答案的正确性作为奖励，RL 算法（如 RLOO, GRPO, DAPO）或许能够隐式地学习到何时以及如何有效使用工具，从而在提升推理轨迹正确概率的同时，利用工具消除算术错误。此外，考虑到不同 RL 算法在处理稀疏奖励和组内方差时的差异，研究者进一步思考哪种算法的机制（如 DAPO 的 dynamic sampling 和 asymmetric clipping）能更有效地过滤无信息量的样本，从而在工具集成场景下实现更高效的策略优化。\n\n### § 4 核心 Intuition\n\nLLM 在数学推理中的失败往往源于不可靠的内部算术计算，而外部计算器可以提供精确的验证与纠正。然而，仅靠 SFT 教模型使用工具无法让模型学会在复杂推理中动态地、策略性地调用工具。这篇论文的核心 Intuition 是：通过将工具调用嵌入 RL 的 rollout 中，并仅用最终答案的正确性作为 reward，RL 能够隐式地激励模型在关键时刻主动调用工具进行验证和纠错，从而将“减少算术错误”与“提升正确推理轨迹的采样概率”这两个目标统一在同一个优化框架内。工具弥补了模型计算的硬伤，而 RL 则重塑了模型探索正确推理路径的概率分布，两者互补使得整体推理能力得到显著提升。", "methodology": "§ 5 具体方法与完整 Pipeline\n```text\n[Original SFT Data D] -\u003E [Detect Calc Errors] -\u003E [Build Correction Prefix]\n                                                        |\n                                                        v\n[Trained SFT Model pi] -------------------------\u003E [Sample K Continuations]\n                                                        |\n                                                        v\n[Inject Tool Format \u003Ctool\u003E...\u003C/tool\u003E\u003Cobs\u003E...\u003C/obs\u003E] \u003C---+\n                                                        |\n                                                        v\n[Tool-Integrated SFT Dataset D'] -\u003E [Train Tool-SFT Model]\n                                                        |\n                                                        v\n[RL Rollouts with Live Calculator] -\u003E [Countdown Verifier Reward]\n                                                        |\n                                                        v\n[On-Policy RL (RLOO/GRPO/DAPO)] -\u003E [Final RL Policy]\n```\n节点解释：\n1. 原始 SFT 数据与错误检测：基于原始 Countdown SFT 数据 D，检测推理过程中的算术错误或最终答案错误。若存在算术错误，将推理截断至该步骤并纠正数值作为前缀；若最终答案错误，则将完整推理加上标记错误的计算器检查作为前缀。\n2. 模型续写采样：利用已训练的 SFT 模型 π，针对上述纠正前缀采样 K 个续写，完成剩余推理和答案生成。\n3. 注入工具格式与数据组装：在纠正前缀和模型续写之间注入计算器调用格式（`\u003Ctool\u003E` expression `\u003C/tool\u003E` 及环境返回的 `\u003Cobs\u003E` observation `\u003C/obs\u003E`），生成工具集成 SFT 数据集 D'。\n4. 训练 Tool-SFT 模型：使用 D' 训练模型，使其学会在推理中何时以及如何调用计算器，并基于返回的 observation 继续推理。\n5. RL 训练与验证：以 Tool-SFT 模型为初始策略进行 RL rollout。模型在 rollout 中生成工具调用，环境执行算术并返回 observation。Policy loss 仅应用于模型生成的 token，利用 Countdown verifier 自动验证最终答案并计算奖励。应用 RLOO、RLOO++、GRPO 和 DAPO 等在线 RL 方法优化策略。\n\n§ 7 实验设计与结论\n提出什么问题：\n1. 工具集成是否能持续提升 SFT 和 RL 基线在数学推理任务上的表现？\n2. 在多种在线 RL 方法中，哪种方法在工具集成场景下表现最好？\n3. RL 是否能鼓励更有效的工具使用，即使仅提供最终答案奖励？\n\n用什么实验验证：\n1. 构建包含 1,024 个问题的全新 held-out Countdown benchmark，避免与训练数据重叠，以提供更可靠的评估。\n2. 对比 No-Tool 和 Tool-Integrated 的 SFT 与 RL 模型（RLOO, RLOO++, GRPO, DAPO）的 pass@k 表现。\n3. 分析错误类别、工具调用动态和正确性分布，解释 RL 和工具使用在何时改善推理以及何处仍然失败。\n\n结论是什么：\n1. 计算器工具集成持续改善了 SFT 和 RL 基线，在 pass@k 上带来约 10 个百分点的提升。\n2. 在测试的 RL 方法中，Tool-DAPO 取得了最强的性能，将 pass@1 从 Tool-SFT 的 35.8% 提升至 66.0%。\n3. 进一步分析表明，即使仅提供最终答案奖励，RL 也能鼓励更有效的工具使用。工具集成减少了算术和验证错误，而 RL 提高了正确推理轨迹的概率。", "additional_insights": "### § 8 Take-aways\n本文针对Countdown数学推理任务，构建了工具集成的SFT数据集，通过`\u003Ctool\u003E`和`\u003Cobs\u003E`标签教会模型调用计算器并解析返回结果。在此基础上，作者应用了RLOO、RLOO++、GRPO和DAPO四种on-policy RL方法，仅使用最终答案的自动验证作为奖励信号。为了降低评估方差，作者构建了包含1024个问题的全新held-out测试集，消除了与训练数据的精确重叠。实验结果表明，计算器工具的集成在SFT和RL基线上均带来了约10个百分点的pass@k提升。在所有RL方法中，Tool-DAPO通过dynamic sampling和asymmetric policy-ratio clipping取得了最佳表现，将pass@1从Tool-SFT的35.8%提升至66.0%。深入分析表明，RL主要提高了模型采样到正确推理轨迹的概率，而非创造了全新的推理能力；对于初始采样中零正确响应的难题，RL的改进效果十分有限。此外，RL训练不仅维持了SFT阶段的工具使用习惯，还进一步增加了模型在解题过程中调用计算器的平均频率。\n\n### § 9 最脆弱的假设\n本文最核心且最脆弱的假设是：RL结合工具集成能够通过最终答案奖励，在模型初始分布中无法解决的难题上发现并强化新的正确推理轨迹（即扩展推理覆盖范围），而不仅仅是进行概率重分配。在实际中，这个假设极易不成立：如果模型在规划阶段就存在缺陷，即使计算器纠正了局部的算术错误，模型也无法找到通向正确答案的解题路径。此外，RL的奖励信号极其稀疏，当一组采样中没有任何正确轨迹时，模型无法获得正向梯度来探索新策略，导致这些真正困难的样本被优化过程忽略。论文在Section 6.1中提供的正确性分布分析实际上构成了反对该假设的证据：RL主要增加了全对样本的比例，但对于0正确响应的样本改善有限。同时，Section 5.1的错误分析显示4-number问题中target/planning errors占主导，这超出了计算器工具的纠正范围。论文缺少在初始pass@k为0的难题上取得突破的证据，这表明该方法在面对需要全新推理策略的复杂问题时，其核心贡献会直接失效。\n\n### § 10 最小复现实验\n如果有1周时间，可以验证本文最基础的claim：工具集成能显著减少SFT模型的算术错误，从而提升pass@1（对应论文Section 5.1和5.2）。数据方面，可自行生成500个Countdown任务（包含3-number和4-number问题），确保有明确的target和可用数字。实现上无需进行耗时的RL训练，选择一个中等规模的开源LLM（如Llama-3-8B），设计两种prompting策略：一种是标准的Chain-of-Thought（no-tool），另一种是允许模型生成`\u003Ctool\u003E`标签并由外部Python脚本执行返回`\u003Cobs\u003E`结果的tool-integrated策略。测量指标为测试集上的pass@1，并编写脚本对错误响应进行分类，统计Calculation errors、Target/plan errors和其他错误的占比。如果tool-integrated策略的pass@1显著高于no-tool策略，且错误分析显示Calculation errors的比例大幅下降，则支持论文的claim；如果算术错误未显著减少，或因工具调用格式问题引入大量新错误导致pass@1无提升，则反驳了该claim。此实验在1周内利用API或单卡推理即可轻松完成。", "research_value": "### § 11 最强反例设计\n如果我要对这篇论文发起最强有力的攻击，我会设计一个高规划复杂度主导的Countdown任务变体作为反例，以证明该方法仅在“算术瓶颈”上有效，而在“搜索与规划瓶颈”上可预测地失效。具体而言，我将构建一个包含5-number和6-number的Countdown测试集，刻意设计目标数字使得其求解路径需要深度的非显然组合搜索（例如需要先做除法得到分数再做乘法），而非简单的加减乘除。在这个高规划复杂度的分布上，我将复现论文中表现最佳的Tool-DAPO模型，并对比其与基础Tool-SFT模型的pass@1以及工具调用频率。我的核心假设是：尽管RL会如论文所述进一步增加计算器的调用频率，但由于计算器只能验证局部算术而无法纠正全局规划错误，模型的pass@1将出现停滞甚至下降。此外，通过分析正确性分布，我会证明RL的收益完全来自于对简单子集的概率重分配，而在初始采样为零正确响应的难题上，模型不仅无法找到新轨迹，反而可能因为过度依赖工具调用而陷入局部验证的死循环。这个反例直接挑战了论文“RL结合工具能提升复杂推理可靠性”的核心声称，揭示了其性能提升高度依赖于任务本身的算术错误率，一旦任务瓶颈转移到组合搜索上，该方法所强化的工具调用行为将退化为一种无效的计算开销，而非推理能力的实质性扩展。\n\n### § 12 Follow-up Research Idea\n基于本文RL仅能进行概率重分配而无法解决零正确样本难题的核心局限，我提出一个全新的研究框架：从“被动工具验证与稀疏RL”转向“符号引擎驱动的主动轨迹合成与过程级奖励”。该想法的驱动需求在于，当模型在规划阶段彻底失败时，自回归采样与最终答案的稀疏奖励无法提供任何探索梯度，导致真正困难的推理覆盖范围无法扩展。我们可以借鉴神经符号AI（Neuro-symbolic AI）与自动课程学习领域的方法，将外部工具从被动的“计算器”升级为主动的“启发式求解器”。具体而言，对于模型初始pass@k为0的难题，不再依赖LLM自身采样，而是调用符号求解器（如Z3 SMT solver或深度优先搜索算法）逆向搜索出通向目标的有效操作序列。随后，将这一符号化求解路径翻译回LLM的Chain-of-Thought格式，并自然嵌入`\u003Ctool\u003E`和`\u003Cobs\u003E`标签，从而合成高质量的“专家轨迹”。第一个实验将设计为：在Countdown任务中筛选出基础模型完全无法解决的4-number难题集，利用符号引擎生成对应的专家轨迹作为SFT数据注入训练池，随后应用过程级奖励模型（PRM）对每一步工具调用与状态转移进行细粒度优化，而非仅依赖最终答案的ORM。与现有工作相比，该提议不再试图通过RL“逼迫”模型自己发现未知轨迹，而是利用符号系统的完备性直接扩展模型的推理边界，将研究重心从“强化已有正确轨迹的概率”转移到“通过神经符号融合注入全新推理范式”上，从而真正突破LLM在复杂组合搜索任务中的能力上限。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Minghui Xu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zi Wang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Stanford University\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "当前的大型语言模型 (LLMs) 越来越受益于外部工具集成，尤其是在需要可靠计算和验证的任务中。受此启发，我们研究了计算器工具调用，以改善在 Countdown 任务上的数学推理。我们首先分析了推理失败的情况，发现计算错误在错误回答中占了很大比例。然后我们构建了 supervised fine-tuning 数据集，以教会模型有用的工具使用模式以及如何解释返回的输出。基于这种工具格式的策略，我们应用了几种 on-policy reinforcement learning 方法，包括 RLOO、RLOO++、GRPO 和 DAPO，并使用自动可验证的最终答案奖励。为了实现更可靠的评估，我们构建了一个全新的包含 1,024 道题的留出 Countdown benchmark，与训练数据没有任何完全重叠。我们的结果表明，计算器工具集成持续改善了 SFT 和 RL baselines，在 pass@k 上产生了大约 10 个百分点的提升。在这些 RL 方法中，Tool-DAPO 取得了最佳性能，将 pass@1 从 Tool-SFT 的 35.8% 提升至 66.0%。进一步的分析表明，即使在仅提供最终答案奖励的情况下，RL 也能鼓励更有效的工具使用。这些发现表明，工具集成减少了算术和验证错误，而 RL 提高了产生正确推理轨迹的概率。"}]}, {"name": "Mobile Agent Benchmarking", "count": 1, "papers": [{"title": "Benchmarking General Mobile Assistants in Challenging Real-World Scenarios", "arxiv_id": "2608.27477", "authors": "Yiqi Zhu, Feiyu Gao, Jiaxing Fan, Jiahui Zeng, Minggang Wu, Chenliang Li, Haiyang Xu, Peng Li, Ming Yan, Yang Liu", "summary": "Graphical user interfaces have emerged as an important environment for evaluating autonomous AI agents on multimodal interactive tasks. Existing benchmarks such as AndroidWorld and MobileWorld provide strong foundations for mobile agent evaluation, but their application coverage and task design do not yet fully capture the diversity and complexity of realistic mobile use. We present GMA, a benchmark for evaluating general mobile assistants in challenging real-world scenarios. GMA introduces seven applications based on open-source projects, spanning domains such as lifestyle sharing and travel planning, and 300 tasks across four difficulty tiers, from atomic actions to complex multi-step workflows. We evaluate eight frontier models and find that performance declines substantially as task complexity increases, with current agents remaining far from reliably handling realistic user requirements. We further conduct controlled ablation studies of agent harness choices, including context retention and explicit state tracking, under a shared environment, model setting, and task taxonomy. Results show that appropriate harness design can meaningfully improve performance, particularly on demanding workflows, while the effectiveness of specific designs can vary across foundation models. Overall, GMA complements existing benchmarks by expanding application coverage and task complexity, providing a challenging testbed for evaluating mobile agents and studying how harness design supports reliable execution in complex mobile workflows.", "category": "cs.AI", "cluster": "Mobile Agent Benchmarking", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了 GMA 基准，用于在复杂的现实场景中评估通用移动智能体，并特别针对智能体的运行架构（agent harness choices，如上下文保留和显式状态跟踪）进行了受控消融研究。根据筛选标准第一步，如果论文的研究对象明确是 LLM Agents / Tool-Use Agents，即使主要是评估基准或经验研究，只要结论直接帮助理解或改进智能体能力，就应保留。此外，论文深入探讨了 harness design 如何支持复杂工作流中的可靠执行，这直接对应了正面指标中的 Agent Harness 和 Long-Horizon Decision-Making。虽然移动端交互涉及多模态视觉元素，但此处 GUI 是作为智能体感知和交互的环境，研究的核心仍是智能体的执行能力和架构设计，而非纯粹的多模态视觉理解。因此，该论文完全符合“LLM智能体及其演化”的研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出GMA，一个用于在challenging real-world scenarios中评估general mobile assistants的benchmark，核心研究问题是：现有mobile agent评估环境在application coverage和task complexity两个维度上是否足以暴露当前agents在真实移动使用场景中的能力边界。GUI环境已成为评估autonomous AI agents在multimodal interactive tasks上的重要testbed，因为成功完成GUI任务要求agent同时具备visual layout感知、element function理解、high-level intention到precise action sequence的转化，以及对dynamic application states的适应能力。真实移动工作流进一步引入long-horizon planning、information retrieval、constraint satisfaction和error recovery等需求，长交互轨迹还对agent如何保存historical observations、intermediate information和task progress施加了巨大压力。解决application coverage和task complexity的扩展问题具有重要价值：它不仅能更全面地揭示当前mobile agents的能力瓶颈——论文评估显示即便最强模型在atomic interactions上表现优异，在realistic tasks上也没有模型能完美完成超过20%，最高Average score仅45.27——还为研究agent harness设计（如context retention和explicit state tracking）如何支撑复杂移动工作流的可靠执行提供了controlled testbed，论文证明适当的harness设计能带来meaningful性能提升，但其效果因foundation model而异。\n\n### § 2 前人工作与不足\n\n该问题此前已被部分解决但存在明确缺口。AndroidWorld (Rawles et al., 2024)建立了可复现评估框架，采用dynamically instantiated tasks和state-based verification，成为mobile-agent评估的canonical benchmark；MobileWorld (Kong et al., 2026)在此基础上集成三个额外应用并设计long-horizon cross-application tasks，还引入user interaction和MCP-augmented tasks。然而，这两者在application coverage上仍不足以反映真实Android生态系统的功能多样性——MobileWorld仅新增三个应用，无法覆盖instant messaging、music library、lifestyle sharing、local discovery、on-demand delivery、e-commerce、travel planning等常见数字服务类别及其独特的interaction paradigms。这一缺口的根源在于工程成本：将fully functional open-source projects适配为benchmark应用需要完全decouple from production APIs、self-host所有backend services和databases、populate本地管理的数据集，并为每个应用开发dedicated state adapters以synchronize frontend emulator snapshots与targeted backend resets，这一infrastructure开销在先前工作中未被充分投入。在task complexity方面，先前benchmark的任务设计未能充分捕捉真实用户需求的nuanced complexity，缺乏需要fragmented evidence synthesis、competing constraints reconciliation和causally dependent cross-application execution的workflow——这种缺口并非因为问题未被认识到，而是因为构建此类任务需要unified declarative asset abstraction framework来decouple high-level task semantics from low-level database schemas，以及composable state verification机制来支持fine-grained continuous scoring而非monolithic binary outcomes。此外，在agent harness研究方面，虽然HiconAgent (Zhou et al., 2026)、Mobile-Agent-v3.5 (Xu et al., 2026)、PhoneHarness (Li et al., 2026)和Zheng et al. (2026)等已incorporate structured planning、historical context、explicit memory和task-state management等机制，但其效果往往作为complete systems的一部分被评估，多个组件同时变化，缺乏在shared environment、model setting和task taxonomy下isolate特定context management与state tracking选择的controlled analysis，因此无法判断哪些harness choices真正有效以及其效果如何随task complexity和foundation model变化。", "core_insight": "### § 3 重建作者的思考路径\n\n作者很可能从对现有 mobile agent benchmark 的直接使用体验出发。AndroidWorld 提供了 reproducible 的 emulator 环境和 state-based verification，MobileWorld 在此基础上增加了 cross-application workflow 和 user interaction。但当一个研究者真正试图用这些 benchmark 评估 frontier model 时，会观察到两个 gap：第一，application 覆盖面仍然狭窄，大量常见 mobile 服务类别（如 lifestyle sharing、on-demand delivery、travel planning）缺席，导致模型在某些交互范式上的能力无法被触及；第二，task design 停留在相对结构化的指令层面，缺少真实用户请求中常见的 underspecified requirements、fragmented evidence 和 long-horizon 跨应用依赖。\n\n与此同时，作者从 agent 研究的更广泛文献中注意到一个方法论问题：harness 机制（如 planning、reflection、memory）的效果通常在完整系统中被评估，多个 component 同时变化，无法隔离单个设计选择的贡献。Harness-Bench 等工作在 software engineering 领域已经开始系统比较 configuration-level 的 harness 效果，但 mobile agent 领域缺乏类似的 controlled analysis。\n\n这两条线索汇合后，作者的自然推理是：如果同时扩展 application 生态系统的广度和 task complexity 的深度，就能更真实地暴露当前 mobile agent 的能力边界；如果在 shared environment 和 task taxonomy 下进行 harness 的 ablation，就能厘清哪些设计选择真正起作用，以及它们是否跨 model 迁移。GMA 的四个难度层级（Atomic → Compositional → Cross-Application → Realistic）正是为了系统性地刻画 capability degradation 的拐点，而 harness 实验则回答\"性能差距中有多少来自 foundation model，有多少来自 surrounding scaffolding\"。\n\n### § 4 核心 Intuition\n\n当前 mobile agent benchmark 的 application 覆盖和 task complexity 都不足以暴露真实用户场景中的能力瓶颈——模型在 atomic interaction 上表现良好，却在需要 long-horizon planning、cross-application information transfer 和 fragmented evidence synthesis 的 realistic workflow 上急剧退化。GMA 的核心 intuition 是：通过自托管七个功能各异的开源应用并构建四层递进难度的 300 个任务，可以在一个 fully reproducible 的环境中同时逼出 foundation model 的能力上限和 agent harness 设计的边际贡献。更关键的是，harness 的效果并非 universal——context retention 和 explicit state tracking 对不同 foundation model 的增益方向和幅度显著不同，这意味着 harness design 必须与 underlying model 的特性协同考虑，而非假设存在 one-size-fits-all 的最优配置。", "methodology": "§ 5 具体方法与完整 Pipeline\n```text\n[Open-source Projects] -\u003E [7 Custom Apps] -\u003E [Mobile Ecosystem]\n                                                      |\n[Real-world User Needs] -\u003E [Task Design] ------------\u003E|\n   (4 Tiers: Atomic, Comp., Cross-App, Realistic)    |\n   (300 Tasks)                                       v\n[Frontier Models] -\u003E [Agent Execution] \u003C------ [GMA Benchmark]\n   (Qwen, GPT, Claude)      |                  (Env + Tasks)\n                           v\n                    [Performance Eval]\n                           |\n[Harness Configs] --------\u003E|\n(Context Retention,        v\n State Tracking)    [Ablation Studies]\n                           |\n                           v\n                    [Findings \u0026 Conclusions]\n```\nGMA 的构建与应用 Pipeline 包含三个核心阶段：\n1. **Mobile Ecosystem 构建**：作者基于开源项目手动开发了七个自定义 Android 应用，涵盖即时通讯、音乐库管理、生活方式分享、本地发现、按需配送、电子商务和旅行规划等常见数字服务类别。这些应用共同构成了一个功能多样且高度交互的可复现评估环境。\n2. **Task Design 与分层**：为了捕捉真实世界的用户需求，作者精心设计了 300 个任务，并将其划分为四个递进的难度层级：Atomic（单步原子操作）、Compositional（单应用内多步操作）、Cross-Application（跨应用信息传递）以及 Realistic（包含碎片化证据、约束条件和长程工作流的复杂任务）。这种渐进结构旨在系统性地分析任务复杂度增加时的能力瓶颈。\n3. **Agent Harness 消融实验**：在共享的评估环境、模型设置和任务分类下，作者对不同的 agent harness 配置进行了受控消融研究，重点考察了 context retention（上下文保留）和 explicit state tracking（显式状态跟踪）等设计选择对 agent 执行复杂移动工作流的影响。\n\n§ 7 实验设计与结论\n论文主要提出了两个核心研究问题并设计了相应的实验进行验证：\n1. **问题一：当前 frontier mobile agents 在真实且复杂的移动场景中能力边界如何？**\n   - **实验验证**：作者在 GMA benchmark 上评估了 8 个前沿模型（涵盖 Qwen、GPT 和 Claude 系列），观察它们在不同难度层级任务上的表现。\n   - **结论**：随着任务复杂度的增加，模型性能急剧下降。当前 mobile agents 在处理 realistic user requirements 时仍远未达到可靠水平，即使它们在 atomic interactions 上表现优异。\n2. **问题二：Agent harness 设计（如 context retention 和 explicit state tracking）在多大程度上能支撑复杂移动工作流的可靠执行，且其效果是否跨模型迁移？**\n   - **实验验证**：在共享环境、模型设置和任务分类下，对多种 agent harness 选择进行受控消融研究。\n   - **结论**：适当的 harness 设计能够显著提升 agent 性能，在 demanding workflows 上尤为明显。然而，特定设计的有效性会因底层的 foundation model 不同而有所差异，这表明 harness 设计应根据基础模型进行定制化调整。", "additional_insights": "### § 8 Take-aways\nGMA通过引入7个基于开源项目的自定义应用和300个跨四个难度等级的任务，扩展了移动agent评估的应用覆盖广度和任务复杂度深度。评估8个前沿模型发现，尽管在atomic任务上表现优异，但在realistic任务上成功率均不超过20%，揭示了当前模型在长程规划和跨应用信息整合上的瓶颈。Agent harness设计（如context retention和explicit state tracking）对复杂任务性能有显著影响，尤其在realistic任务上提升明显。Harness机制的效果具有model-specific特性，structured state tracking对Qwen3.7-Plus有效，但对GPT-5.6 Sol无益甚至有害，说明harness设计需与基础模型特性匹配。\n\n### § 9 最脆弱的假设\nGMA的核心假设是：其realistic任务能够真实反映现实世界中移动助手面临的复杂用户需求，且基于subtask的连续评分能准确衡量agent的执行能力。如果这个假设不成立——例如任务设计过于人工构造，或subtask分解不能代表真实工作流——那么benchmark的核心价值（评估真实场景能力）将直接失效。论文提供了任务设计原则和双标注质量控制的描述，但缺乏与真实用户行为数据的对比验证，无法证明这些任务确实映射了自然分布的用户需求。此外，realistic任务仅有20个，样本量较小，可能不足以稳定支撑关于模型在真实场景中表现的结论。\n\n### § 10 最小复现实验\n在一周时间内，可验证explicit state tracking在realistic任务上的提升效果。使用GMA的20个realistic任务，选择开源模型Qwen3.7-Plus，实现带和不带structured state tracking的agent harness，保持其他设置（如视觉context为2张截图）一致。测量Average score（subtask完成比例）。如果state tracking有效，带该机制的agent在realistic任务上的Average score应显著高于无该机制的baseline（论文中从11.00提升到24.92）。若无显著差异或下降，则反驳了该claim。此实验无需复现完整系统，仅需实现state tracking模块并复用GMA公开的任务验证框架。", "research_value": "### § 11 最强反例设计\n要对该论文进行最有力的攻击，我会针对其“realistic任务能够真实反映现实世界复杂需求，且基于subtask的连续评分能准确衡量agent执行能力”这一最脆弱假设，设计一个基于“路径依赖评分偏差”的反例实验。论文采用composable state verification机制对subtask进行fine-grained continuous scoring，这隐含了一个假设：完成任务的路径是可预测且可被预先分解的。然而，真实用户在移动设备上解决复杂需求时，往往存在高度个性化、非线性的交互路径。我会从GMA的20个realistic任务中选取样本，引入一个“语义等价但路径迥异”的干预组：让人类专家或一个具备强探索能力的agent，刻意采用非预期的应用组合或反直觉的操作顺序来完成相同的high-level intention（例如，不使用论文预设的旅行规划应用，而是通过即时通讯软件中的机器人插件和浏览器搜索来组合完成行程安排）。通过对比GMA的state-based verification评分与人类judge的语义目标达成评分，如果发现干预组在最终语义上完美达成了用户需求，但在GMA的subtask评分体系下得分极低（因为未触发预设的backend state adapters），这就直接证明了GMA测量的不是“解决真实世界问题的能力”，而是“对benchmark设计者预设路径的拟合程度”。这一反例不仅揭示了monolithic state verification在复杂任务中的刚性缺陷，还提供了一个具体的替代解释：当前模型在realistic任务上低于20%的成功率，可能并非完全源于long-horizon planning能力的不足，而是因为模型探索出的divergent paths无法被僵化的verification infrastructure识别和奖励。\n\n### § 12 Follow-up Research Idea\n基于GMA在任务真实性验证和静态评分机制上的局限，我提出一个全新的研究方向：**基于用户交互轨迹的动态偏好对齐与个性化工作流演化**。这一想法的驱动力在于：现有的mobile agent benchmark（包括GMA）均采用“一次性、无状态、去个性化”的静态任务集，忽略了真实移动助手最核心的未满足需求——agent需要在一个长期、持续的时间跨度内，学习并适应特定用户的独特操作习惯、应用配置偏好和动态变化的日常意图。为了解决这一问题，可以借鉴相邻领域**Reinforcement Learning from Human Feedback (RLHF)** 与**Continual Learning**的方法论，将其从宏观的对话对齐下沉至微观的GUI交互轨迹对齐。\n\n具体而言，第一个实验将构建一个longitudinal evaluation framework：部署一个mobile agent在模拟的Android环境中连续运行30个虚拟“天”，每天接收同一user persona发出的具有上下文关联的序列任务（如昨天的旅行规划影响今天的点餐选择）。实验不预设固定的成功路径，而是引入一个基于用户历史操作分布的preference model作为reward function。当agent执行任务时，如果其选择的UI路径、信息保存策略或应用切换顺序符合该user persona的历史交互分布，则获得高reward。我们将对比标准zero-shot agent与经过在线continual learning微调的agent，测量两者在“任务完成度”与“交互偏好一致性”上的trade-off曲线。这一提议与GMA等已有工作的根本区别在于：它将评估范式从“在静态沙盒中求解预设谜题”转变为“在动态生态中学习并演化个人化的数字工作流”，从而打开了对mobile agent长期适应性和个性化harness设计的研究大门。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yiqi Zhu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Feiyu Gao\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Jiaxing Fan\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Jiahui Zeng\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Minggang Wu\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Chenliang Li\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Haiyang Xu\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Peng Li\", \"affiliations\": [2], \"markers\": [\"†\"]},\n    {\"name\": \"Ming Yan\", \"affiliations\": [3], \"markers\": [\"†\"]},\n    {\"name\": \"Yang Liu\", \"affiliations\": [1, 2], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Dept. of CS \u0026 Tech, Institute for AI, Tsinghua University\"},\n    {\"id\": 2, \"name\": \"AIR, Tsinghua University\"},\n    {\"id\": 3, \"name\": \"Alibaba Token Hub, Alibaba Group\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"†\", \"text\": \"Corresponding Authors.\"}\n  ]\n}\n```", "summary_translation": "图形用户界面已成为在多模态交互任务上评估自主 AI agents 的重要环境。现有的 AndroidWorld 和 MobileWorld 等 benchmarks 为 mobile agent 评估提供了坚实的基础，但其应用覆盖范围和任务设计尚未完全捕捉真实移动使用的多样性和复杂性。我们提出了 GMA，这是一个用于在具有挑战性的真实世界场景中评估通用 mobile assistants 的 benchmark。GMA 引入了七个基于开源项目的 applications，涵盖生活方式分享和旅行规划等领域，以及跨越四个难度层级的 300 个 tasks，从 atomic actions 到复杂的多步 workflows。我们评估了八个 frontier models，发现随着 task complexity 增加，性能显著下降，当前的 agents 仍远未能够可靠地处理真实的用户需求。我们进一步在共享的 environment、model setting 和 task taxonomy 下，针对包括 context retention 和 explicit state tracking 在内的 agent harness 选择进行了受控的 ablation studies。结果表明，合适的 harness design 可以显著提升性能，尤其是在要求苛刻的 workflows 上，而特定设计的有效性可能因 foundation models 而异。总体而言，GMA 通过扩展应用覆盖范围和 task complexity 补充了现有的 benchmarks，为评估 mobile agents 并研究 harness design 如何在复杂的 mobile workflows 中支持可靠执行提供了一个具有挑战性的 testbed。"}]}, {"name": "Skill Routing \u0026 Capability Management", "count": 1, "papers": [{"title": "Beyond Task-Only Matching: Personalized Skill Routing with Counterfactual Evaluation", "arxiv_id": "2608.28241", "authors": "Tianle Wang, Yanghe Zou, Xiang Liu, Ziyao Huang, Chenchen Fu, Weiwei Wu", "summary": "The rapid expansion of reusable skill repositories makes skill routing a critical capability for large language model (LLM) agents. Existing methods treat routing as task-only semantic matching. However, when users with incompatible constraints issue an identical request, this assumption conflates task relevance with skill suitability: a task-only router can select a semantically plausible skill that is unsuitable for the requesting user. To expose this failure mode, we formulate \\textit{personalized skill routing} as profile-conditioned retrieval, in which relevance depends jointly on the task and the user profile. We first introduce a profile-counterfactual benchmark, in which the task is held fixed while changes in the user profile induce changes in the reference skill. We further construct paired counterfactual supervision and propose SkillFeed, a progressive retrieve-and-rerank framework that first establishes task--skill alignment and then learns profile-conditioned discrimination. By retrieving body-level evidence and reranking semantically similar but profile-conflicting candidates, SkillFeed identifies skills that satisfy both task requirements and user constraints. On SkillFeed-Bench, SkillFeed attains 75.1\\% top-1 retrieval accuracy, a 23.1-point improvement over the corresponding pretrained routing baseline. Adding profile conditioning yields a 35.1-point gain on queries where user profile changes the reference skill. This contrast shows that user profiles are most consequential precisely when they change skill suitability. Our website is publicly available at http://www.aiskillfeed.com .", "category": "cs.AI", "cluster": "Skill Routing \u0026 Capability Management", "tags": ["cs.AI"], "filter_reason": "这篇论文明确以“LLM智能体”为核心研究对象，聚焦于智能体的“技能路由”这一工具使用与技能获取的关键能力。论文指出现有智能体在技能选择时仅依赖任务语义匹配的失败模式，并提出了一种结合用户画像的个性化技能路由框架和反事实评估基准。这属于改进LLM智能体工具使用机制和评估其能力边界的研究，直接契合“单智能体：工具使用”以及“评估基准”的研究焦点。论文的核心贡献在于提出了新的智能体技能检索与重排序机制，而非单纯的基础设施或非演化型应用，因此符合您的筛选标准。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的研究问题是：在大型语言模型（LLM）agents 中，如何实现基于用户画像的个性化技能路由。现有的方法将技能路由视为单纯的 task-to-skill 语义匹配，假设任务唯一决定了合适的技能。然而，当具有不兼容约束的用户发出相同的请求时，这种假设会将任务相关性与技能适用性混淆，导致 router 可能选择一个语义上合理但对特定用户不合适的技能。例如，同样是“规划上海旅行”的任务，学生需要低预算、乘地铁的行程规划技能，而商务人士则需要高舒适度、乘出租车的豪华行程规划技能。这个问题的重要性在于：随着可复用技能库的快速扩展，skill routing 已成为 LLM agents 的核心能力。如果路由系统不能考虑用户的具体约束（如预算、平台、语言、专业背景等），就会导致执行失败或用户体验下降。解决这个问题能带来巨大的价值，使 LLM agents 能够根据用户的个性化需求精准匹配并调用最合适的技能，从而提高任务执行的成功率和用户满意度。此外，论文引入了 profile-counterfactual benchmark，填补了评测个性化路由的空白，为评估系统是否真正利用了用户画像提供了标准。\n\n### § 2 前人工作与不足\n这个问题之前并未得到充分解决。在个性化检索与推荐领域，前人工作主要关注基于交互历史或用户画像的物品、文档或内容偏好排序，而非针对具体任务选择可执行的过程。在 skill benchmarks 方面，现有的基准（如 SkillsBench, SWE-Skills, SkillRet）评估了 agent skills 的执行、终身发现、持续学习和大规模检索，但它们仅提供 task-level 的监督和评估，没有明确测试当任务不变而用户画像改变时，router 是否应该修改其选择的技能。在 skill retrieval and routing 方面，SkillRouter 和 R3Skill 等系统采用了 retrieve-and-rerank 流水线，并研究了 query-conditioned routing。然而，这些系统主要依赖 task relevance 进行匹配，无法区分那些语义相似但与不同用户约束不兼容的技能。此外，技能的适用性条件往往分布在 SKILL.md 文件的 procedural body 中（如使用条件、依赖项、平台假设），而前人工作通常仅依赖简短的技能描述进行匹配，忽略了这些细粒度的 body-level evidence。前人工作之所以存在这些不足，主要是因为问题没有被清楚定义：传统的 task-only evaluation 无法区分一个真正使用用户画像的系统和一个忽略它的系统，因为当任务保持固定时，它从不询问预测的技能是否应该随着用户画像的变化而改变。这种评测缺口导致训练数据缺乏对 profile-conflicting 替代方案的监督，使得模型无法学习在功能上合理但与用户约束冲突的技能之间进行有效区分。此外，工程上处理大规模技能库的细粒度 body-level 信息也具有挑战性，导致前人系统倾向于使用粗粒度的技能描述进行匹配。", "core_insight": "### § 3 重建作者的思考路径\n\n作者的研究起点是一个来自 LLM agent 实践的直接观察：随着 skill repository 规模化，同一个 task 往往有多个功能上 plausible 的 skill 可选，而真正决定选哪个的，不是 task 本身，而是 user 的约束条件——预算、平台、语言、专业背景。一个学生和一个商务人士同样请求\"规划上海行程\"，需要的 skill 完全不同。这种区分在现有 task-only routing 范式里根本无法表达，因为 task-to-skill semantic matching 假设 task 唯一决定 skill。\n\n但问题不止于\"现有方法忽略了 profile\"。更深层的是：现有 evaluation 体系根本无法暴露这个失败模式。所有 prior benchmark（SkillRet, SkillsBench, SWE-Skills 等）都将 request 与 suitable skill 配对，从不问\"当 task 固定而 profile 变化时，预测的 skill 是否应该改变\"。一个完全忽略 profile 的系统和一个真正利用 profile 的系统，在这样的 benchmark 上表现可能一样。作者由此意识到，要研究 personalized skill routing，首先需要一个 counterfactual evaluation 设定：固定 task，变化 profile，观察 reference skill 是否随之改变。\n\n接下来是训练信号的构造问题。即使有了 benchmark，现有训练数据也无法教模型区分\"task-relevant 但 profile-conflicting\"的 skill。作者借鉴了 personalized recommendation 领域的思路（user profile 作为 conditioning input），但发现这些方法的目标是 item/content preference，而非 executable procedure 的选择。skill routing 中的 profile 约束是硬性的——一个依赖 unavailable platform 的 skill 不是\"不太喜欢\"，而是根本不可用。因此需要构造 counterfactual supervision：同一 task 在不同 profile 下映射到不同 reference skill，且 hard negatives 是那些 task-relevant 但 profile-incompatible 的 skill。\n\n最后是工程层面的推理。作者注意到 skill 的适用条件（如 supported platforms, input requirements, dependencies）通常不在简短的 description 中，而是散布在 SKILL.md 的 procedural body 里（When to use, Constraints, Dependencies 等部分）。如果只在 skill-level 做 embedding，这些 decisive 的局部信息会被稀释。这自然引向 passage-level retrieval 的思路——将 skill body 切分为 chunk，独立编码，再聚合为 skill-level compatibility signal。同时，为了在大规模 repository（228K skills）上保持 recall，需要一个两阶段架构：retrieval 阶段保证功能相关性的 broad coverage，reranking 阶段做 profile-conditioned 的 fine-grained discrimination。训练上采用 progressive 策略——先学 task-skill alignment，再学 profile-conditioned discrimination——因为 profile 应该 refine task relevance 而非替代它，如果模型连 task matching 都没学好，profile 信号只会成为 noise。\n\n### § 4 核心 Intuition\n\n同一个 task 在不同 user profile 下需要不同的 skill，而区分这些 skill 的决定性信息往往不在 skill 的简短 description 里，而是藏在 procedural body 的适用条件中（平台依赖、输入要求、预算假设等）。因此方法的核心是：先用 task 建立功能相关性，再从 skill body 的局部 evidence 中用 profile 做细粒度筛选——并通过 counterfactual supervision（固定 task、翻转 profile、改变 reference skill）直接教模型学会\"profile 变了，选择就该变\"这一行为。让先前方法失效的根本原因是它们把 routing 当作 task-skill 的单变量匹配问题，而这个问题的本质是 task × profile 的联合条件问题。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Beyond Task-Only Matching: Personalized Skill Routing with Counterfactual Evaluation》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出并解决的研究问题是：在大型语言模型（LLM）agents 中，如何实现基于用户画像的个性化技能路由。现有的方法将技能路由视为单纯的 task-to-skill 语义匹配，假设任务唯一决定了合适的技能。然而，当具有不兼容约束的用户发出相同的请求时，这种假设会将任务相关性与技能适用性混淆，导致 router 可能选择一个语义上合理但对特定用户不合适的技能。例如，同样是“规划上海旅行”的任务，学生需要低预算、乘地铁的行程规划技能，而商务人士则需要高舒适度、乘出租车的豪华行程规划技能。这个问题的重要性在于：随着可复用技能库的快速扩展，skill routing 已成为 LLM agents 的核心能力。如果路由系统不能考虑用户的具体约束（如预算、平台、语言、专业背景等），就会导致执行失败或用户体验下降。解决这个问题能带来巨大的价值，使 LLM agents 能够根据用户的个性化需求精准匹配并调用最合适的技能，从而提高任务执行的成功率和用户满意度。此外，论文引入了 profile-counterfactual benchmark，填补了评测个性化路由的空白，为评估系统是否真正利用了用户画像提供了标准。 ### § 2 前人工作与不足 这个问题之前并未得到充分解决。在个性化检索与推荐领域，前人工作主要关注基于交互历史或用户画像的物品、文档或内容偏好排序，而非针对具体任务选择可执行的过程。在 skill benchmarks 方面，现有的基准（如 SkillsBench, SWE-Skills, SkillRet）评估了 agent skills 的执行、终身发现、持续学习和大规模检索，但它们仅提供 task-level 的监督和评估，没有明确测试当任务不变而用户画像改变时，router 是否应该修改其选择的技能。在 skill retrieval and routing 方面，SkillRouter 和 R3Skill 等系统采用了 retrieve-and-rerank 流水线，并研究了 query-conditioned routing...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 作者的研究起点是一个来自 LLM agent 实践的直接观察：随着 skill repository 规模化，同一个 task 往往有多个功能上 plausible 的 skill 可选，而真正决定选哪个的，不是 task 本身，而是 user 的约束条件——预算、平台、语言、专业背景。一个学生和一个商务人士同样请求\"规划上海行程\"，需要的 skill 完全不同。这种区分在现有 task-only routing 范式里根本无法表达，因为 task-to-skill semantic matching 假设 task 唯一决定 skill。 但问题不止于\"现有方法忽略了 profile\"。更深层的是：现有 evaluation 体系根本无法暴露这个失败模式。所有 prior benchmark（SkillRet, SkillsBench, SWE-Skills 等）都将 request 与 suitable skill 配对，从不问\"当 task 固定而 profile 变化时，预测的 skill 是否应该改变\"。一个完全忽略 profile 的系统和一个真正利用 profile 的系统，在这样的 benchmark 上表现可能一样。作者由此意识到，要研究 personalized skill routing，首先需要一个 counterfactual evaluation 设定：固定 task，变化 profile，观察 reference skill 是否随之改变。 接下来是训练信号的构造问题。即使有了 benchmark，现有训练数据也无法教模型区分\"task-relevant 但 profile-conflicting\"的 skill。作者借鉴了 personalized recommendation 领域的思路（user profile 作为 conditioning input），但发现这些方法的目标是 item/content preference，而非 executable procedure 的选择。skill ro... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **Beyond Task-Only Matching: Personalized Skill Routing with Counterfactual Evaluation** **Tianle Wang**[2][∗] **, Yanghe Zou**[1][∗] **, Xiang Liu**[1,3] **, Ziyao Huang**[4] **, Chenchen Fu**[1] **, Weiwei Wu**[1] 1School of Computer Science and Engineering, Southeast University 2College of Software Engineering, Southeast University 3Department of Computer Science and Engineering, The Chinese University of Hong Kong 4Department of Computer Science, City University of Hong Kong ## **Abstract** The rapid expansion of reusable skill repositories makes skill routing a critical capability for large language model (LLM) agents. Existing methods treat routing as task-only semantic matching. However, when users with incompatible constraints issue an identical request, this assumption conflates task relevance with skill suitability: a task-only router can select a semantically plausible skill...", "additional_insights": "### § 8 Take-aways\n现有的skill routing方法通常将问题简化为task-to-skill的语义匹配，忽略了user profile（如预算、平台偏好等）对skill适用性的决定性影响。本文将personalized skill routing形式化为profile-conditioned retrieval，指出skill相关性应由task和user profile共同决定。为评估这一设定，作者构建了SkillFeed-Bench，包含228K候选skill和329个评估query，并特别引入了profile-counterfactual样本（固定task，改变profile导致reference skill改变）来暴露task-only routing的失效模式。在方法层面，提出的SkillFeed框架采用两阶段retrieve-and-rerank架构：第一阶段融合task dense retrieval、BM25与profile-aware skill-body chunk retrieval进行候选召回；第二阶段利用包含counterfactual supervision的数据微调listwise reranker进行精细重排。实验结果表明，SkillFeed达到了75.1%的Hit@1，相比pretrained baseline提升23.1个百分点，且在profile-counterfactual样本上取得了35.1个百分点的巨大提升，证实了引入user profile对skill routing的必要性。\n\n### § 9 最脆弱的假设\n本文最关键且失败代价最大的假设是：在固定task的情况下，改变user profile会改变唯一正确的reference skill，且这种“必须切换skill”的关系在真实skill库中普遍存在。如果这个假设不成立，整个profile-counterfactual benchmark的构建逻辑和核心动机就会失效。在实际的软件工程与agent生态中，许多skill本身被设计为高度参数化和通用的，同一个skill完全可以通过接收不同的配置参数（如budget limit, preferred transportation）来适应截然不同的user profile，而无需路由到另一个独立的skill。如果底层skill库中的技能大多是参数化工具，那么强行要求模型根据profile切换reference skill不仅不符合真实使用逻辑，还可能导致模型在应用中错过更强大的通用技能。论文虽然通过LLM生成和人工标注（平均置信度0.92）来验证counterfactual样本的合理性，但缺少在真实agent执行环境中的闭环验证，未能证明被选中的不同reference skill在实际执行时确实无法通过参数调整来兼容对方的profile，这使得其benchmark的生态有效性存在隐患。\n\n### § 10 最小复现实验\n如果只有1周时间，最小复现实验应直接验证“改变user profile会改变最优skill”这一核心claim，而无需复现完整的228K规模检索系统。使用SkillFeed-Bench中公开的77个profile-counterfactual样本，提取每个样本的task、profile A、profile B以及对应的reference skill A和skill B。选取一个未经过任何特定微调的强大通用LLM（如GPT-4o或Claude-3.5-Sonnet）作为评判者。对于每个样本，将task和profile A连同skill A与skill B的描述一并输入给LLM，要求其选出最合适的skill；随后输入task和profile B进行同样的选择。测量LLM在profile A下选择skill A的比例，以及在profile B下选择skill B的比例，并计算counterfactual-switch accuracy（即LLM是否根据profile变化正确切换了选择）。如果LLM能够高比例地根据profile变化切换选择，则支持了论文的核心claim，证明profile确实改变了skill适用性；如果LLM倾向于认为同一个skill（如skill A）可以同时适用两个profile，或者其选择不随profile发生规律性变化，则直接反驳了论文关于“必须切换skill”的假设，暴露出其counterfactual构建可能存在过度区分的问题。", "research_value": "### § 11 最强反例设计\n我会设计一个“参数化兼容性闭环验证”实验来直接攻击论文“改变 profile 必须切换 reference skill”的核心假设。具体而言，从 SkillFeed-Bench 的 77 个 profile-counterfactual 样本中提取 task、profile B 以及被判定为不兼容的 skill A 的完整 procedural body（包含参数定义与执行逻辑）。将这三者输入给一个强大的通用 LLM agent（如 GPT-4o），要求其利用 skill A 的参数化能力直接执行 profile B 的任务。如果 agent 能够通过向 skill A 传递不同的配置参数（如 budget limit, transport mode）成功完成任务，这就构成了最强反例。这一结果将提供具体的替代解释：SkillFeed 在 counterfactual 样本上取得的 35.1 个百分点提升，并非源于系统真正理解了用户约束，而是源于其 benchmark 构建逻辑强行制造了虚假的 skill 互斥性。在这种情况下，SkillFeed 的 listwise reranker 实际上只是在记忆 profile keywords 到特定 skill description 的表面映射，反而导致系统在真实环境中错失了更强大、更具泛化能力的通用参数化技能，其宣称的“个性化路由”退化为一种过拟合的伪需求。\n\n### § 12 Follow-up Research Idea\n驱动这个想法的局限是：现有方法将 skill 视为不可分割的静态黑盒，强行要求 router 在离散的 skill 集合中进行互斥选择，而忽略了真实技能库中普遍存在的参数化泛化能力。为了打破这一局限，我提议将研究目标从“Personalized Skill Routing”转变为“Profile-Conditioned Skill Parameterization and Joint Instantiation”（基于用户画像的技能参数化与联合实例化）。在这个新的 framing 下，router 的任务不再仅仅是选择一个 skill，而是联合输出一个 base skill 以及一组严格满足 user profile 约束的具体执行参数。我们可以借鉴 Program Synthesis（程序合成）领域中 constrained code generation 和 type-driven development 的方法，将 user profile 转化为对 skill API signature 的前置条件与类型约束，从而在连续的参数空间中直接优化执行路径。第一个实验可以设计为：构建一个包含高度参数化通用 skill 的测试集，给定一个固定的 task 和两个冲突的 profile（如极低预算与极高舒适度），要求模型不仅输出选择的 skill，还必须生成符合各自 profile 的 JSON 格式参数化配置。评估指标从传统的 Hit@1 skill accuracy 转变为 execution success rate（执行成功率）和 profile constraint satisfaction rate（画像约束满足率）。这与已有工作的根本区别在于：已有工作解决的是“选哪个黑盒”的分类问题，而本提议解决的是“如何动态配置一个通用白盒”的生成问题，从而将 skill routing 与 execution planning 真正统一在同一个优化框架内。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Tianle Wang\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Yanghe Zou\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Xiang Liu\", \"affiliations\": [1, 3], \"markers\": []},\n    {\"name\": \"Ziyao Huang\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Chenchen Fu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Weiwei Wu\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Southeast University\"},\n    {\"id\": 2, \"name\": \"Southeast University\"},\n    {\"id\": 3, \"name\": \"CUHK\"},\n    {\"id\": 4, \"name\": \"City University of Hong Kong\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"These authors contributed equally.\"}\n  ]\n}\n```", "summary_translation": "可重用技能库的快速扩张使得 skill routing 成为 large language model (LLM) agents 的一项关键能力。现有方法将 routing 视为仅针对任务的语义匹配。然而，当具有不兼容约束的用户发出相同的请求时，这一假设将 task relevance 与 skill suitability 混为一谈：仅针对任务的 router 可能会选择一个语义上合理但不适合请求用户的 skill。为了揭示这一 failure mode，我们将 personalized skill routing 形式化为 profile-conditioned retrieval，其中相关性同时取决于任务和 user profile。我们首先引入了一个 profile-counterfactual benchmark，在该 benchmark 中，任务保持固定，而 user profile 的变化会导致 reference skill 的变化。我们进一步构建了 paired counterfactual supervision，并提出了 SkillFeed，这是一个渐进式的 retrieve-and-rerank 框架，它首先建立 task-skill alignment，然后学习 profile-conditioned discrimination。通过检索 body-level evidence 并对语义相似但与 profile 冲突的 candidates 进行 reranking，SkillFeed 能够识别出同时满足任务需求和用户约束的 skill。在 SkillFeed-Bench 上，SkillFeed 取得了 75.1% 的 top-1 retrieval accuracy，比相应的预训练 routing baseline 提高了 23.1 个百分点。在 user profile 改变 reference skill 的 queries 上，添加 profile conditioning 带来了 35.1 个百分点的提升。这一对比表明，user profiles 正是在改变 skill suitability 时才具有最重要的影响。我们的网站已公开可用，网址为 http://www.aiskillfeed.com 。"}]}], "2026-08-27": [{"name": "Memory \u0026 Personalization", "count": 4, "papers": [{"title": "Reconstructing the Right Episode: Evaluating Interleaved Conversational Memory Beyond Long Context", "arxiv_id": "2608.25655", "authors": "Zhexi Feng, Ruiyi Zhang, Yongbo Yang, Pengtao Xie", "summary": "Conversations with chat assistants increasingly span many topics in a single long-running thread, challenging memory systems. Existing long-context and memory benchmarks often expose session or topic boundaries, or probe direct personal-memory questions. These settings understate a harder assistant-memory regime: a flat mixed-topic thread where the system must infer which earlier episode makes a later task decision valid. We introduce SCALE-QA, a constraint-grounded task QA benchmark for flat unsegmented threads targeting episode integrity failure. The dataset contains 3,000 audited questions across 10 domains, uses deterministic four-way multiple-choice grading, and includes a deterministic runtime builder; experiments use all 3,000 questions through 128k and a stratified 400-question diagnostic at 1M. SCALE-QA questions are ordinary task-oriented requests whose correct answer depends on causally related evidence introduced earlier in the conversation. We also propose Temporal-Semantic Interleaved Memory Reconstruction (TSIM), which segments the turn stream into coherent episodes and indexes them through a hierarchical multi-view memory stack with deterministic episode-level summary and cluster-routing views. Experiments show that SCALE-QA challenges strong RAG baselines and long-context LLMs alike; across three open-source and proprietary LLM backends, TSIM achieves the highest accuracy in every backend setting, gaining 5.6-17.6 accuracy points over the strongest corresponding baseline.", "category": "cs.CL", "cluster": "Memory \u0026 Personalization", "tags": ["cs.CL"], "filter_reason": "论文的核心贡献是提出了一个针对长对话中混合主题线程的记忆评估基准（SCALE-QA），以及一种新的记忆重构方法（TSIM）。TSIM通过将对话流分割为连贯的片段，并利用分层多视图记忆栈进行索引，以解决智能体在长期交互中的“片段完整性失败”问题。这直接对应了筛选标准中“单智能体：记忆”以及“LLM Agents 的 memory”等核心关注点。尽管论文主要聚焦于评估基准和记忆机制设计，但根据筛选标准，只要研究对象明确围绕智能体的记忆能力并有助于理解和改进其能力，即应保留。因此，该论文符合研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文研究的是在flat unsegmented mixed-topic thread（扁平、未分段的混合话题对话线程）中，如何准确恢复决定后续任务决策的operative episode（操作情节）。具体而言，用户在与AI助手的长对话中可能早期引入一条局部约束——例如\"新项目必须在单个消费级GPU或CPU上运行，禁止大计算量模型\"——该约束可能休眠数千轮对话后突然决定某个问题的唯一正确答案。论文将系统在此场景下的失败定义为episode integrity failure（情节完整性失败）：证据虽然存在于对话中且可能被检索到，但系统只获取了看似相关却episode-incomplete（情节不完整）的片段，而非使局部约束生效的完整operative episode。这个问题之所以重要，是因为真实助手使用场景并非任务隔离的干净文档，而是交织着预算讨论、报销规则、用药限制、旅行安排等多个无关话题的单一长线程；现有state-of-the-art LLMs在modest context lengths下即出现reliability collapse，而在此desktop-scale regime下，能否恢复正确的episode而非仅仅检索到相关token span，直接决定了助手是否能在真实场景中给出可靠决策。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决，核心原因在于现有evaluation和methodology均未将episode integrity failure作为独立失败模式进行isolate和attribute。最接近的前身是LongMemEval (Wu et al., 2025)，它评估了长对话中的long-term memory，覆盖information extraction、multi-session reasoning、temporal reasoning和update reasoning，但其history format保留了timestamped session structure，问题类型为personal-memory QA，且采用judged open-ended responses——这意味着系统可以利用显式session边界进行检索，无需从flat thread中推断episode边界。LongBench (Bai et al., 2024)、∞Bench (Zhang et al., 2024)、RULER (Hsieh et al., 2024)等long-context benchmarks虽然stress-test了longer inputs、positional robustness和noisy contexts，但它们要么暴露session或topic边界，要么probe的是document QA而非conversational memory，无法测试从flat mixed-topic thread中恢复dormant local constraints的能力。Lost in the Middle (Liu et al., 2024)和Lost in Conversation (Laban et al., 2026)揭示了证据在context中仍可能被underused，但其recovery unit是token span而非semantic episode。在方法层面，Standard RAG (Lewis et al., 2020)和dense retrieval (Karpukhin et al., 2020)以固定token chunk为检索单元，matching chunk可能omit使局部约束operative的neighboring turn；RAPTOR (Sarthi et al., 2024)的hierarchical summaries可能over-compress而丢失episode-level coherence；MemGPT (Packer et al., 2023)的memory-management substrate能surface related fragments但不保证preserve operative episode；HippoRAG (Gutiérrez et al., 2024)的graph-style retrieval以graph neighborhood为单元，同样不是semantic-decision unit。这些方法的根本限制在于：chunks是mechanically defined retrieval units，sessions是explicit temporal interaction units，而operative episodes是latent semantic-decision units whose boundaries must be inferred——此前没有工作将episode reconstruction而非chunk retrieval作为memory系统的核心recovery unit，也没有benchmark能在无边界元数据的flat thread中cleanly测量这一能力。", "core_insight": "### § 3 重建作者的思考路径\n\n在真实场景中，用户与助手的对话往往是跨主题、长时间且混合在一起的。研究者早已观察到，LLMs 在长上下文中会出现 reliability collapse，即使证据在 context window 内也可能被忽略（Lost in the middle）。现有的 memory systems（如 RAG、MemGPT、RAPTOR）大多基于固定大小的 chunk 或显式的 session 边界进行检索。然而，在真实的助手对话中，一个早期的约束（如“新项目必须在单个消费级 GPU 上运行”）可能在数千轮无关对话后才突然决定某个问题的答案。这种场景下，系统失败的原因并非简单的 retrieval miss，而是检索到了相关片段却丢失了使约束生效的完整上下文。作者从认知心理学中的 episodic memory 概念获得启发，认为记忆的恢复单位应该是语义连贯的 episode，而非机械分割的 chunk。由此，作者推断出一种新的失败模式——episode integrity failure，并意识到现有 benchmark 无法隔离和测量这种失败，因为它们要么暴露了边界，要么只测试直接的个人记忆。这促使作者构建 SCALE-QA，一个无边界、混合主题的 benchmark，并设计 TSIM 来验证“重建 episode”是否优于“检索 chunk”。\n\n### § 4 核心 Intuition\n\n现有方法失效的根源在于它们以固定大小的 chunk 或孤立的 turn 为检索单位，这会破坏约束的完整性——一个使决策有效的约束往往跨越多个连续的 turn，而 chunk 检索可能只命中其中一部分，导致系统看到证据却无法理解其约束力。TSIM 的核心直觉是：先重建完整的语义 episode，再从中提取证据。通过流式的 semantic-shift segmentation 将对话切分为连贯的 episode，并用多视角索引（raw、summary、cluster）和证据优先的排序机制，确保恢复的是使约束生效的完整情节，而非碎片化的片段。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Reconstructing the Right Episode: Evaluating Interleaved Conversational Memory Beyond Long Context》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文研究的是在flat unsegmented mixed-topic thread（扁平、未分段的混合话题对话线程）中，如何准确恢复决定后续任务决策的operative episode（操作情节）。具体而言，用户在与AI助手的长对话中可能早期引入一条局部约束——例如\"新项目必须在单个消费级GPU或CPU上运行，禁止大计算量模型\"——该约束可能休眠数千轮对话后突然决定某个问题的唯一正确答案。论文将系统在此场景下的失败定义为episode integrity failure（情节完整性失败）：证据虽然存在于对话中且可能被检索到，但系统只获取了看似相关却episode-incomplete（情节不完整）的片段，而非使局部约束生效的完整operative episode。这个问题之所以重要，是因为真实助手使用场景并非任务隔离的干净文档，而是交织着预算讨论、报销规则、用药限制、旅行安排等多个无关话题的单一长线程；现有state-of-the-art LLMs在modest context lengths下即出现reliability collapse，而在此desktop-scale regime下，能否恢复正确的episode而非仅仅检索到相关token span，直接决定了助手是否能在真实场景中给出可靠决策。 ### § 2 前人工作与不足 该问题此前未被充分解决，核心原因在于现有evaluation和methodology均未将episode integrity failure作为独立失败模式进行isolate和attribute。最接近的前身是LongMemEval (Wu et al., 2025)，它评估了长对话中的long-term memory，覆盖information extraction、multi-session reasoning、temporal reasoning和update reasoning，但其history format保留了timestamped session structure，问题类型为perso...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在真实场景中，用户与助手的对话往往是跨主题、长时间且混合在一起的。研究者早已观察到，LLMs 在长上下文中会出现 reliability collapse，即使证据在 context window 内也可能被忽略（Lost in the middle）。现有的 memory systems（如 RAG、MemGPT、RAPTOR）大多基于固定大小的 chunk 或显式的 session 边界进行检索。然而，在真实的助手对话中，一个早期的约束（如“新项目必须在单个消费级 GPU 上运行”）可能在数千轮无关对话后才突然决定某个问题的答案。这种场景下，系统失败的原因并非简单的 retrieval miss，而是检索到了相关片段却丢失了使约束生效的完整上下文。作者从认知心理学中的 episodic memory 概念获得启发，认为记忆的恢复单位应该是语义连贯的 episode，而非机械分割的 chunk。由此，作者推断出一种新的失败模式——episode integrity failure，并意识到现有 benchmark 无法隔离和测量这种失败，因为它们要么暴露了边界，要么只测试直接的个人记忆。这促使作者构建 SCALE-QA，一个无边界、混合主题的 benchmark，并设计 TSIM 来验证“重建 episode”是否优于“检索 chunk”。 ### § 4 核心 Intuition 现有方法失效的根源在于它们以固定大小的 chunk 或孤立的 turn 为检索单位，这会破坏约束的完整性——一个使决策有效的约束往往跨越多个连续的 turn，而 chunk 检索可能只命中其中一部分，导致系统看到证据却无法理解其约束力。TSIM 的核心直觉是：先重建完整的语义 episode，再从中提取证据。通过流式的 semantic-shift segmentation 将对话切分为连贯的 episode，并用多视角索引（raw、summary、cluster）和证据优先的排序机制，确保恢复的是使约束生效的完整情节，而非碎片化的片段。 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **Reconstructing the Right Episode: Evaluating Interleaved Conversational Memory Beyond Long Context** **Zhexi Feng Ruiyi Zhang Yongbo Yang Pengtao Xie**[*] Department of Electrical and Computer Engineering University of California San Diego {zhf023,ruz048,yongboyang,p1xie}@ucsd.edu ## **Abstract** Conversations with chat assistants increasingly span many topics in a single long-running thread, challenging memory systems. Existing long-context and memory benchmarks often expose session or topic boundaries, or probe direct personal-memory questions. These settings understate a harder assistant-memory regime: a flat mixed-topic thread where the system must infer which earlier episode makes a later task decision valid. We introduce SCALEQA, a constraint-grounded task QA benchmark for flat unsegmented threads targeting episode integrity failure. The dataset contains 3,000 audited questions...", "additional_insights": "### § 8 Take-aways\n现有 long-context 和 memory benchmark 通常暴露 session 或 topic 边界，忽略了在 flat mixed-topic thread 中推断哪个早期 episode 决定后续任务决策有效性的更难场景。论文将这种底层失败定义为 episode integrity failure：系统可能检索到了看似相关的片段，但未能恢复使局部约束生效的完整 operative episode。为填补这一测量空白，论文提出了 SCALE-QA benchmark，包含 3,000 个跨 10 个领域的 audited questions，采用 deterministic four-way multiple-choice grading，并配有 deterministic runtime builder 以控制 context length。论文提出了 Temporal-Semantic Interleaved Memory Reconstruction (TSIM) 方法，通过 semantic-shift episode segmentation 将 turn stream 切分为连贯的 episodes，并通过 hierarchical multi-view memory stack (raw, summary, cluster views) 进行索引。实验结果表明，在 128k context 设置下，TSIM 在 Gemma2:9b、Gemini 2.5 Flash 和 GPT-4o-mini 三个 backend 上均取得最高 accuracy，比最强 baseline 提升 5.6 到 17.6 个 accuracy points，且仅使用约 1k retrieved tokens。\n\n### § 9 最脆弱的假设\nTSIM 的核心假设是：基于 embedding 相似度阈值和长度限制的流式切分（M1 semantic-shift episode segmentation）能够有效将 flat turn stream 切分为包含完整 operative episode 的语义单元。如果这个假设不成立，即简单的局部语义聚类无法准确捕捉决定性证据的边界，那么后续的 multi-view indexing 和 ranking 都将基于碎片化的 episode 进行，导致 episode integrity failure 依然存在。在实际对话中，约束往往跨越多个看似不相关的 turn（例如先讨论预算削减，后讨论硬件限制），或者在一个长 topic 内部发生微妙的语义转移；仅依靠局部 embedding 相似度（阈值 0.70）和简单的 speaker transition bonus 可能无法识别这种跨主题的因果关联或长距离依赖，从而导致 episode 被错误切分。论文提供的证据主要是间接的：Table 3 的 ablation study 显示 semantic-drift episodes (55.5%) 优于 fixed-token chunks (43.4%)，且 Table 21 显示 TSIM episode 的 all-evidence recall@5 达到 0.810。然而，论文缺少对切分准确率的直接人工评估（即切分出的 episode 是否真正与 gold evidence span 对齐），且 Figure 6 显示阈值在 0.66 到 0.74 之间 recall 波动明显，说明切分质量对超参数较为敏感，缺乏跨数据集的鲁棒性证明。\n\n### § 10 最小复现实验\n在 1 周时间内，可以验证 TSIM 的 M1 semantic-shift segmentation 是否比 fixed-token chunking 能更好地覆盖 gold evidence span。使用 SCALE-QA 数据集（公开在 GitHub），随机抽取 200 个包含 exact evidence traces 的 QA 实例及其对应的 flat turn stream。实现 TSIM 的 M1 streaming segmenter（使用 BGE-large-en-v1.5 embedding，阈值 0.70，min/max tokens 120/320）以及一个 baseline fixed-token chunker（例如 256-token window）。不需要实现完整的 M2/M3 和 LLM answering 部分，仅进行检索层面的评估。测量 all-evidence recall@5（top-5 检索单元是否覆盖所有 gold evidence turns）和 co-containment（对于多片段证据，是否有单个检索单元包含所有决定性证据）。如果 TSIM episode 的 all-evidence recall@5 显著高于 fixed-token chunker，且 co-containment 也更高，则支持论文关于 episode segmentation 优于 chunking 的 claim；反之则反驳。这个实验只需检索层面的计算，无需调用 LLM，1 周内完全可以完成。", "research_value": "### § 11 最强反例设计\n要对该论文进行最有力的攻击，我会设计一个针对“跨语义转移的因果依赖”场景的实验，以此挑战 TSIM 方法的核心理论前提：即局部 semantic similarity 能够有效捕捉决定性证据的边界。论文声称 operative episode 是 latent semantic-decision units，但其 M1 segmentation 模块实际上假设了决定同一决策的证据在 embedding space 中是局部聚类的。然而，在真实的 flat mixed-topic thread 中，最具挑战性的约束往往是通过跨主题的因果链建立的。例如，用户在第 50 轮讨论“公司预算削减导致云服务额度受限”，随后在第 200 轮转向“视频编码器的选择”，而在第 800 轮询问“如何部署当前项目”。正确答案依赖于将“预算削减”的约束跨主题地应用于“部署方案”上，但这两者在语义上截然不同。我会从 SCALE-QA 数据集中筛选或构造一个包含此类 cross-topic causal constraints 的高难度子集，并测量 TSIM 在该子集上的 all-evidence recall@5 和 downstream accuracy。我的核心假设是：由于这两段证据在 embedding 空间中的相似度远低于 0.70 的切分阈值，M1 segmenter 会在主题转移处将它们强行切分到不同的 episodes 中，导致没有任何一个检索单元能够 co-contain 这两段因果关联的证据。如果实验结果显示 TSIM 在该子集上的性能退化到与 fixed-token chunker 相当，甚至因错误切分而更差，这将直接证明论文的性能提升并非来源于“恢复了完整的 operative episode”，而是因为 SCALE-QA 的多数测试用例恰好满足局部语义聚类假设。这个反例不仅提供了对原结果的替代解释（即 TSIM 的优势仅存在于 intra-topic episodes），还识别出了该方法在处理长距离因果依赖时可预测的失败条件。\n\n### § 12 Follow-up Research Idea\n基于上述局限，我提出一个全新的研究框架：从“基于语义连贯性的 episode segmentation”转向“基于反事实因果推理的 non-contiguous episode reconstruction”。驱动这个想法的核心局限是：operative episode 的本质是因果有效性而非语义相似性，试图通过局部 embedding 聚类来预先切分对话流，从根本上无法捕捉跨主题、长距离的因果依赖。我们可以借鉴因果推断领域的 Structural Causal Models (SCMs) 和 LLM 领域的 counterfactual reasoning 技术，将 memory retrieval 重新定义为一个 abductive causal tracing 过程。具体而言，不再试图将 flat thread 切分为互斥的连续片段，而是构建一个 conversational causal graph，其中每个 turn 是一个节点，边代表潜在的约束施加关系。当面临一个 query 时，系统首先生成一个 default answer，然后通过 counterfactual probing（即“如果对话中不存在 turn X，这个 default answer 是否会改变？”）来反向定位决定性的 evidence turns，最终将这些在时序上可能相距甚远、但在因果上图相邻的 turns 动态组装成一个 virtual operative episode。第一个实验将设计一个包含大量 cross-topic causal dependencies 的 synthetic conversational memory benchmark，并对比传统 contiguous chunking（如 RAG）、semantic episode segmentation（如 TSIM）与提出的 counterfactual causal tracer。评估指标将聚焦于 cross-topic evidence co-containment rate 和 counterfactual answer consistency。这一提议与 HippoRAG 等基于实体共现的 graph retrieval 根本不同：后者依赖于显式的实体重叠来建立图边，而本方法通过干预假设来发掘隐式的、跨主题的因果约束传递，从而真正将 memory 系统的 recovery unit 从 spatial-temporal span 进化为 causal dependency set。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zhexi Feng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ruiyi Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yongbo Yang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Pengtao Xie\", \"affiliations\": [1], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"UCSD\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author.\"}\n  ]\n}\n```", "summary_translation": "与聊天助手的对话日益在单个长期运行的线程中跨越多个主题，这对记忆系统提出了挑战。现有的 long-context 和 memory benchmarks 通常会暴露 session 或 topic 边界，或者探测直接的 personal-memory 问题。这些设置低估了一种更难的 assistant-memory 机制：在一个扁平的混合 topic 线程中，系统必须推断出较早的哪个 episode 使得较晚的任务决策有效。我们引入了 SCALE-QA，这是一个针对扁平未分段线程的 constraint-grounded task QA benchmark，旨在针对 episode integrity failure。该 dataset 包含跨 10 个领域的 3,000 个经过审计的问题，采用 deterministic four-way multiple-choice grading，并包含一个 deterministic runtime builder；实验在 128k 上下文长度下使用了全部 3,000 个问题，并在 1M 上下文长度下进行了包含 400 个问题的分层 diagnostic。SCALE-QA 的问题是普通的 task-oriented 请求，其正确答案取决于对话中较早引入的因果相关证据。我们还提出了 Temporal-Semantic Interleaved Memory Reconstruction (TSIM)，该方法将 turn stream 分割为连贯的 episodes，并通过带有 deterministic episode-level summary 和 cluster-routing views 的 hierarchical multi-view memory stack 对其进行索引。实验表明，SCALE-QA 对强大的 RAG baselines 和 long-context LLMs 均构成了挑战；在三种开源和专有 LLM backends 上，TSIM 在每种 backend 设置下均取得了最高的 accuracy，比最强的相应 baseline 提升了 5.6-17.6 个 accuracy points。"}, {"title": "AWM: Answerable Working Memory for Long-Document VQA Agents", "arxiv_id": "2608.25618", "authors": "Dongzhuoran Zhou, Yuqicheng Zhu, Yule Liu, Zhen Yang, Rui Lu, Yuxiao Dong, Jie Tang, Evgeny Kharlamov", "summary": "Long-document visual question answering increasingly relies on VLM agents that retrieve candidate pages, inspect page images, write findings to working memory, and synthesize answers. Working memory should carry answer-supporting evidence across page inspections for later grounded answering, yet existing evaluation mainly checks final-answer correctness and evidence-page access. This creates a memory-quality blind spot: an agent may reach the right page and answer correctly while leaving behind memory too generic or incomplete to support answering once page context is removed. We introduce \\emph{memory-only answerability}, a diagnostic that asks whether a reader can answer from the question and terminal working memory alone. Building on this diagnostic, \\emph{Answerable Working Memory} (AWM) treats terminal working memory as an answerable evidence artifact, and AWM-GRPO incorporates this signal into the GRPO reward while preserving final-answer priority. Under GRPO, this reward assigns higher advantages to answer-correct trajectories whose terminal working memory remains answerable. On \\textsc{MMLongBench-Doc}, even when gold evidence pages are provided, 42.5\\% of correct answers still cannot be answered from terminal working memory alone. AWM-GRPO improves final-answer accuracy over the RAG baseline by 8.1 and 11.9 points on \\textsc{MMLongBench-Doc} and \\textsc{LongDocURL} and reduces the memory-missing-correct rate by 2.7 points over answer-only GRPO.", "category": "cs.CL", "cluster": "Memory \u0026 Personalization", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是提出了针对长文档VQA智能体的“可回答工作记忆”机制，并通过AWM-GRPO（一种强化学习训练方法）将记忆质量信号纳入奖励函数，从而训练和改进智能体写入工作记忆的能力。这直接对应了筛选标准中的“记忆机制”和“agent training/RL”方向。\n\n虽然论文的应用场景是视觉问答（VQA），涉及多模态（VLM），但根据筛选标准第三步，“多模态与视觉”除非是研究的核心，否则不应排除。在此论文中，视觉和文档只是智能体感知的环境，研究的真正核心是智能体的“工作记忆”这一运行组件，以及如何通过反馈和RL（GRPO）让智能体自动改进其记忆策略。这完全符合第一步中“保留”规则：研究 agent 的 harness / scaffold / runtime / memory，并且核心贡献是让这些智能体运行组件通过轨迹、反馈、观测或评估结果自动改进。因此，该论文属于构建和改进LLM智能体能力的前沿研究，应予保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文聚焦于 long-document VQA agent 中 working memory 的质量问题。当前的长文档 VQA 系统通常采用 retrieve-inspect-update 的 agentic loop：agent 检索候选页面、检视页面图像、将发现写入 working memory，最终综合出答案。Working memory 的设计意图是在跨页面检视过程中携带 answer-supporting evidence，供后续 grounded answering 使用。然而，作者发现一个关键问题：现有评估体系仅检查 final-answer correctness 和 evidence-page access，却从未检验 terminal working memory 本身是否足以支撑回答。这导致一个 memory-quality blind spot——agent 可能借助页面上下文正确回答了问题，但其留下的 working memory 过于泛化或不完整，一旦移除页面图像便无法独立支持回答。作者将此诊断指标称为 memory-only answerability：一个 frozen reader 仅接收问题和 terminal working memory（不含页面图像或 trajectory context），判断能否仅凭 memory 回答问题。实验揭示，在 MMLONGBENCH-DOC 上，即使提供 gold evidence pages，仍有 42.5% 的正确回答无法仅从 terminal working memory 中恢复。这一问题的重要性在于：working memory 是 agent 跨步骤信息整合的核心载体，若 memory 不可回答，意味着 agent 并未真正提取和保存 question-relevant evidence，而是依赖即时页面上下文\"短路\"回答，这在多步推理、证据审计和可信赖部署场景下构成根本性缺陷。受控实验进一步证实，仅改进 terminal working memory 内容（用 GPT-4o 替代 4B agent 写 memory），在固定 reader、judge 和 gold-page access 的条件下，final-answer accuracy 从 36.2% 提升至 44.4%，memory-only accuracy 从 30.2% 提升至 44.8%，表明 memory quality 本身是一个可优化且影响显著的变量。\n\n### § 2 前人工作与不足\n\n长文档 VQA 的 agentic 方法已有若干代表性工作。Doc-V*（Zheng et al., 2026）采用 coarse-to-fine 的页面导航策略，agent 从低分辨率概览出发，逐步获取页面图像并将发现记录于 structured working memory，其导航策略通过 imitation learning 和 GRPO 训练。MemSearcher（Yuan et al., 2025）研究 text-based search agent 中的 compact working memory，使用 multi-context GRPO 将 trajectory-level advantage 传播至各轮。VRAG-RL（Wang et al., 2025）通过 reinforcement learning 优化 vision-perception-based RAG 的迭代推理。这些系统在架构上均已包含 working memory 机制，但它们的训练和评估存在一个共同的结构性缺口：reward signal 和 evaluation metric 仅关注 final-answer correctness，对 memory-supported correct（答案正确且 memory 可回答）和 memory-missing correct（答案正确但 memory 不可回答）两种轨迹赋予完全相同的 reward。以 answer-only GRPO 为例，其 reward $R_{\\text{ans}}(s_{\\text{ans}}) = s_{\\text{ans}}$ 将 $(1,1)$ 和 $(1,0)$ 两种 outcome cell 映射为同一值，memory answerability 在 advantage ranking 中完全不可见。这不是简单的\"遗漏\"，而是 answer-only reward 的结构性限制：它无法在 answer-correct 的轨迹内部产生 preference gradient，因此 agent 没有任何信号驱动其改进 memory 提取质量。更深层的原因在于，此前的评测范式将 evidence-page access 等同于 evidence preservation——认为只要 agent 访问了正确页面，memory 自然包含所需信息。但作者的诊断表明这一假设失效：agent 可以用 generic description（如\"the chart shows trends\"）满足 mandatory memory-update 的 schema 要求，却省略 question-specific finding（如\"the 2020 self-sufficiency rate is 4.7%\"），最终仍从 raw page context 中提取答案。Mandatory commit 机制确保了 agent 在每次检索后都写入 memory，但无法保证写入的内容是 answer-critical 的。在 intermediate-state supervision 方向，CapRL（Xing et al., 2026）奖励 answerable captions，Vision-SR1（Li et al., 2026b）优化 question-conditioned visual descriptions，Perception-R1（Xiao et al., 2026a）检查 reasoning response 中的视觉内容与参考标注的一致性，但这些方法针对的是单次视觉输入的描述质量，而非跨多次页面检视累积的 terminal working memory 的 answerability。在 memory evaluation 方向，evidence-citation 工作（Liu et al., 2023; Gao et al., 2023）检验 final answer 是否被 cited evidence 支持，但 grounded memory 不等于 answerable memory——memory 可能引用了正确的来源页面却遗漏了回答所需的关键事实，反之 answerable memory 也可能包含未经来源验证的猜测。此前没有任何工作将 memory-only answerability 作为独立的诊断维度或训练信号，这正是本文填补的空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在 long-document VQA 中，agent 的标准范式是 retrieve-inspect-update memory-answer：检索候选页面、检视页面图像、将发现写入 working memory、最终综合出答案。这个范式背后的隐含假设是，working memory 承载了跨页面检视的 answer-supporting evidence，使得最终答案能够被 grounded 地生成。然而，现有评估只检查两件事：final-answer 是否正确，以及 agent 是否访问了 gold evidence pages。这两项检查通过，并不意味着 working memory 本身是 answerable 的——agent 完全可能在 inspect 阶段直接从 page image 中读取答案，而在 memory 中只留下 \"the chart shows tre
