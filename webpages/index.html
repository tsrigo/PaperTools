Questions incorporate multimodal evidence, including images, maps, PDFs, logos, charts, tables, and video frames, with at least one non-text element that changes the reasoning state. Mr.LHDR evaluates both final answers and the correctness of intermediate conclusions under annotated dependencies. We evaluate general models, deep research systems, and agent frameworks using Overall Accuracy (OA), Strict Accuracy (SA), Checklist Score (CS), and Dependency-Aware Checklist Score (DACS). Results show that even the strongest system achieves only 43.1% OA and 34.3% SA, indicating that final-answer accuracy substantially overestimates complete research success. Removing images reduces DACS by 12.6 points, demonstrating the importance of multimodal evidence, while SA consistently declines as reasoning chains become longer. These findings reveal sustained, dependency-consistent evidence integration, rather than isolated fact retrieval, as a key bottleneck for current deep research agents.", "category": "cs.AI", "cluster": "Long-Horizon Agents \u0026 Memory", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了一个名为 Mr.LHDR 的基准测试，用于评估多模态真实世界长周期深度研究智能体。根据筛选标准第一步中的“保留”规则，如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents，即使它主要是评估基准或失败机制诊断，只要结论直接帮助理解或改进智能体能力，就应保留。该论文评估了现有智能体框架在长依赖链、多模态证据整合方面的表现，并诊断出“持续的、依赖一致的证据整合”是当前深度研究智能体的关键瓶颈。这直接属于对智能体长周期行为和失败机制的分析，有助于后续改进智能体的规划与工具使用能力。\n\n虽然论文涉及多模态证据（图像、地图、PDF等），但多模态在这里是作为智能体感知和处理的输入信息，而非研究多模态模型本身的核心架构，符合“除非它们被用作智能体感知环境的工具，而不是研究的核心”的例外条件。此外，摘要中提到的“Node-Relation graph”仅是构造问题和评估依赖深度的机制，并非研究图结构技术本身。因此，该论文符合您的核心研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：当前 deep research agents 能否在长链条、跨模态、多源依赖的真实世界研究任务中，持续维持 dependency-consistent 的证据整合，而非仅完成孤立的事实检索。具体而言，当一个任务要求 agent 分解目标、在网页/PDF/图像/地图/视频等异构来源间定位证据、跨模态桥接信息、保留中间结论并反复验证约束时，现有系统是否能在每一步都正确建立后续推理所依赖的前提条件。这一问题之所以重要，是因为 deep research agents 正被期望承担真实的研究助理角色——不仅要返回最终答案，还要保证推理过程的可审计性。论文指出，真实世界研究的难度不仅来自个别事实的隐蔽性，更来自早期错误会 redirect 整条调查链的结构性风险。然而现有 benchmark 要么以文本为中心（如 BrowseComp），要么虽引入多模态但仅覆盖 short- to medium-horizon 任务（如 MM-BrowseComp 平均仅 3.0 个 checklist items），长链条依赖证据步骤基本未被测试。解决这一问题能带来三方面价值：一是揭示 final-answer accuracy 对完整任务执行能力的系统性高估，二是通过 multimodal evidence ablation 量化非文本证据对推理链的物质性贡献，三是为未来系统指明 research-state tracking、source/modality binding 和 chain-level verification 为关键改进方向。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决。最相关的 prior work 可分为三类。第一类是 open-web browsing benchmark：BrowseComp (Wei et al., 2025) 强调开放网络上难以定位的短答案，但完全以文本为中心，不涉及多模态证据；MM-BrowseComp (Li et al., 2025d) 在此基础上增加了多模态浏览证据并提供 verified checklist，但其任务结构集中于 short- to medium-horizon 研究，平均每题仅 3.0 个 checklist items，无法测试长链条依赖推理。第二类是结构化搜索 benchmark：MMSearch-Plus (Tao et al., 2026) 关注 provenance-aware browsing 但不提供 gold intermediate structure；BrowseComp-V3 (Zhang et al., 2026) 引入 expert-validated subgoals 和 subgoal-coverage process score，但仍采用无序覆盖评分，不进行 prerequisite gating；MC-Search (Ning et al., 2026) 提供了 step-wise multimodal reasoning graph 和 process metrics，但其评测基于 fixed local knowledge base 而非开放网络，且同样不做 prerequisite-gated scoring。第三类是 report-oriented benchmark（如 Huang et al., 2026; Ye et al., 2026），它们评估长篇报告质量，属于不同的 output regime，不要求 concise verifiable answer 与 dependency-aware 中间结论评估。这些工作存在不足的根本原因在于评测范式的结构性缺陷：它们要么仅以 final-answer correctness 作为评分依据（如 DeepSearchQA, Gupta et al., 2026），要么使用无序 checklist/subgoal coverage（如 MM-BrowseComp、BrowseComp-V3），将中间结论视为独立可互换的局部事实。这种评分方式在 long-horizon 场景下失效，因为下游结论的成立以先前实体、约束和消歧关系的建立为前提——当 prerequisite 缺失时，一个碰巧匹配 checklist item 的下游陈述可能只是 unsupported guess 或 search shortcut，而非有效推理路径的延续。此外，现有 benchmark 普遍未将 multimodal evidence 作为改变 reasoning state 的必要环节进行硬性约束，多模态证据往往沦为装饰性输入而非推理链的承重节点。Mr.LHDR 通过引入 author-verified dependency DAG 和递归式 DACS 评分，直接填补了这一评测缺口：它不仅要求每个 question 至少包含一条改变推理状态的非文本证据，还在评分时递归地以下游结论的所有 transitive prerequisites 是否满足为授分条件，从而区分 final-answer correctness、complete stated-conclusion correctness 和 dependency-consistent coverage。", "core_insight": "### § 3 重建作者的思考路径\n\n作者很可能从对现有 deep research agent benchmark 的系统性不满出发。BrowseComp 证明了 open-web 短答案检索的可贵，但本质上仍是 text-centered 的单跳或浅多跳任务；MM-BrowseComp 虽引入 multimodal browsing，但平均每题仅 3.0 个 checklist items，属于 medium-horizon 范畴。与此同时，真实世界的研究任务——比如从一张产品图片出发，追溯其处理器设计团队、芯片供应商、材料来源、关联机构、再到某段视频中的某个视觉细节——天然具有长链条、跨模态、强依赖的特征：一个早期实体识别错误就会使整条证据链偏移。作者观察到，现有 benchmark 既没有构造这种 prerequisite-linked 的深层依赖结构，也没有在评估层面区分\"碰巧得到正确答案\"与\"沿正确依赖路径得到正确答案\"。\n\n进一步，作者注意到评估指标本身的缺陷。仅用 final-answer accuracy（OA）会高估系统能力，因为 agent 可能通过猜测、shortcut 或 parametric knowledge 猜中答案而跳过关键推理步骤；而 unordered checklist score（CS）虽然能测量覆盖率，却把所有中间结论视为独立可互换，忽略了下游结论的成立以上游先决条件为前提。这意味着一个\"破碎的依赖图\"上散落的局部正确匹配会被错误地计为过程可靠。作者需要一个递归的、dependency-aware 的评分机制，使得下游结论的得分以其所有传递性先决条件的正确性为条件。\n\n在数据构造层面，作者面临的核心挑战是如何确保任务的 long-horizon 难度来自依赖结构本身而非 prompt 冗长或 trivia 冷僻。由此自然推导出 Node-Relation graph 的设计：先构建一个由可验证实体属性节点和唯一收敛关系组成的隐藏图，再从中生成自然语言问题，确保中间节点和搜索路径被遮蔽。多模态证据被设为硬性纳入条件——每个问题至少有一个非文本证据节点改变推理状态——因为作者从 multimodal understanding 文献和真实研究经验中知道，图片、地图、PDF、logo、图表等视觉证据常常承担实体识别、候选约束或跨模态桥接的关键角色，而非装饰。\n\n最后，作者需要验证这套 benchmark 是否真的能区分系统能力层次。从 25 个系统的实验结果中，OA-SA 的系统性差距、CS-DACS 的依赖惩罚、image ablation 中 DACS 下降 12.6 个百分点、以及 SA 随 checklist 长度单调递减——这些结果共同确认了一个判断：sustained, dependency-consistent evidence integration 才是当前 deep research agent 的核心瓶颈，而非孤立事实检索或单步浏览能力。\n\n### § 4 核心 Intuition\n\n当前 deep research agent 的真正瓶颈不在于能否找到个别事实或给出正确最终答案，而在于能否在一条长且紧密耦合的跨模态证据链中持续维持依赖一致的推理状态——即每一步中间结论都建立在其所有先决条件已被正确确立的基础之上。Mr.LHDR 的核心 intuition 是：通过构造基于 prerequisite-linked DAG 的 long-horizon 任务，并用 DACS 这种递归依赖感知指标替代无序 checklist 评估，可以精确暴露\"正确答案伴随破碎推理链\"这一被 final-answer accuracy 系统性掩盖的失败模式。多模态证据之所以不可或缺，是因为它在推理链中承担的是改变推理状态的桥接功能——识别实体、约束候选、连接异构信息源——而非提供冗余线索。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Human] Category/Tags/Style\n    │ AI expand\n    ▼\n┌───────────┐  ┌──────────────┐\n│ Task Spec │─▶│Node-Relation │\n└───────────┘  │Graph(5-6节点)│\n               └──────┬───────┘\n      AI expand       │\n      ┌───────────────┘\n      ▼\n┌──────────────┐  ┌──────────────┐\n│Human Prune   │◀─│Over-complete │\n│+Blur Rewrite │  │Checklist     │\n│+Question Draft│ └──────────────┘\n└──────┬───────┘\n       │ 4-phase audit\n       ▼\n┌──────────┐  Uniqueness/Leakage/MM/Shortcut\n│Quality   │────────────▶[Reject/Revise]─┐\n│Gates     │                              │\n└────┬─────┘                              │\n     │ pass                               │\n     ▼                                    │\n┌──────────┐                              │\n│102 Locked│◀─────────────────────────────┘\n│Items     │\n└────┬─────┘\n     │\n     ▼\n┌──────────┐  ┌────────┐  ┌────────────┐\n│25 Systems│─▶│LLM Judge│─▶│OA/SA/CS/DACS│\n│Eval      │  │Qwen3-VL │  │(DAG递归)   │\n└──────────┘  └────────┘  └────────────┘\n```\n\n**Pipeline 步骤说明：**\n\n1. **Task Specification**：人工标注者首先指定目标 category（如 media、geography 等）、operation tags（Constraint、Symbolic、Temporal、Numerical）和 golden-example style，作为后续 AI 扩展的约束边界（§3.2.2）。\n\n2. **Node-Relation Graph 生成**：AI 在约束下提出包含 5–6 个信息丰富节点的 Node-Relation 图。每个节点配对一个核心实体及其可搜索、可验证的属性（如照片、地图位置、PDF、logo、chart 等）。关系将一个节点的已验证属性转化为下一个节点的入口条件，要求自然且唯一收敛——移除任何关键关系都应破坏推理链而非仅缩短它（§3.2.1, §A.4）。\n\n3. **Over-complete Checklist 扩展**：AI 将图扩展为 25–28 步的过度完整候选 checklist，以暴露缺失证据、弱依赖、重复事实和潜在捷径。此阶段还执行 Blur Attribute-Rich Path 策略：将高信息属性粗粒度化（如将精确年份 1978 改写为\"the late 1970s\"），同时保持推理路径的唯一收敛性（§A.4）。\n\n4. **Human Prune + Question Drafting**：人工标注者修剪候选链，移除背景事实、合并冗余结论，仅保留推导最终答案所必需的中间结论（平均保留 12.1 步，不到 AI 提案的一半）。随后起草自然语言问题，进行泄漏控制——移除中间节点提示、直接答案线索和暴露搜索路径的措辞（§3.2.2, §A.4）。\n\n5. **Quality Gates（4-phase validation）**：通过四阶段验证协议执行七个质量门控——Answer uniqueness（答案短、稳定、唯一）、No path leakage（问题不暴露中间路径）、Irreducible checklist（每步为必要中间结论而非浏览动作）、Source support（每个关键声明有可检查的 URL）、Multimodal necessity（非文本证据必须改变 reasoning state）、Shortcut filtering（web-enabled 模型无法通过单次直接查询解决）、Metadata audit。Phase 3 中，标注者将最终问题原样提交给 web-enabled 模型，若单次响应恢复答案或可复现的直接搜索路径，则该项目被重写或拒绝。未通过的项目退回修改或拒绝，通过的项目被锁定（§3.2.3, Table 2）。\n\n6. **Locked Items**：最终锁定 102 个评测项目，包含 1,231 个 checklist 步骤，平均 dependency depth 10.4，覆盖 8 个 category 和 Linear/Multi-branch 两种 authored template（§3.3）。\n\n7. **Model Evaluation**：25 个系统分为 4 组评测——Tool-augmented VLMs（11 个，接收图像+web search）、Tool-free VLMs（7 个，仅接收图像）、Deep Research Systems（4 个，使用专用 research endpoint）、Framework-based agents（3 个，通过 DeerFlow 运行）。每次评测为单次请求，所有工具使用或多步行为在 provider 服务或框架内部完成（§4.1.2）。\n\n8. **LLM Judge**：使用 Qwen3-VL-235B 作为 judge 模型，接收 user question、reference answer、reference checklist 和 model response，输出两个机器可读字段：`OVERALL_CORRECTNESS`（final-answer 二元决策）和 `CHECKLIST_RESULT`（checklist 完成向量）。答案归一化允许大小写、标点、别名等无害差异；checklist 项仅在响应完整陈述对应结论并与正确实体和约束关联时才计分（§4.1.4, §D.2, Figure 10）。\n\n9. **Metrics Computation**：从 judge 输出和冻结的 dependency DAG 确定性地计算四个指标。OA 衡量 final-answer 正确率；SA 要求 final answer 和所有 annotated checklist 结论同时正确；CS 衡量 checklist 平均覆盖率但不考虑依赖；DACS 递归地将每个结论的得分条件化于其所有 transitive prerequisites 是否满足——独立分支保留各自得分，但若任何必需的前置条件缺失，则下游结论不得分（§4.1.3）。\n\n### § 6 核心数学推导\n\n论文定义了四个评测指标，核心数学推导集中在 DACS 的递归定义上。\n\n**基础变量**：对于固定评测集的 $n=102$ 个 item，$y_i \\in \\{0,1\\}$ 表示 judge 对 item $i$ final-answer 正确性的二元决策；$G_i=(V_i, E_i)$ 为 item $i$ 的已验证 checklist dependency DAG，含 $m_i=|V_i|$ 个节点；$a_{ij} \\in \\{0,1\\}$ 表示响应是否正确陈述了 item $i$ 的第 $j$ 个 checklist 结论。\n\n**OA（Eq.1）**：$OA = \\frac{1}{n}\\sum_{i=1}^{n} y_i$，即 final-answer 正确率的简单平均。Intuition：最宽松的指标，只看最终答案对不对。\n\n**SA（Eq.2）**：$SA = \\frac{1}{n}\\sum_{i=1}^{n} y_i \\cdot \\prod_{j=1}^{m_i} a_{ij}$。Intuition：要求 final answer 正确**且**所有 checklist 结论同时正确——乘积项意味着任何一个中间结论缺失都会使该项归零。这是最严格的指标。\n\n**CS（Eq.3）**：$CS = \\frac{1}{n}\\sum_{i=1}^{n} \\frac{1}{m_i}\\sum_{j=1}^{m_i} a_{ij}$。Intuition：衡量 checklist 的平均覆盖率，但不考虑结论之间的依赖关系——即使前置条件缺失，下游结论仍可独立得分。因此 CS 可能高估过程可靠性，因为它在断裂的 dependency graph 上聚合局部匹配。\n\n**DACS（Eq.4–5）**：设 $D_{ij} \\subseteq V_i$ 为节点 $j$ 的直接前置条件集合，递归定义 dependency-grounded credit：\n\n$$s_{ij} = a_{ij} \\cdot \\prod_{k \\in D_{ij}} s_{ik}$$\n\n$$DACS = \\frac{1}{n}\\sum_{i=1}^{n} \\frac{1}{m_i}\\sum_{j=1}^{m_i} s_{ij}$$\n\n其中空积等于 1。Intuition：节点 $j$ 获得得分当且仅当（1）节点本身的结论被正确陈述（$a_{ij}=1$），**且**（2）其所有直接前置条件的 transitive credit 都为 1。这个递归结构使得：如果某个上游结论缺失，则所有依赖它的下游结论的 credit 都被级联扣减。但独立分支各自保留得分——只有 merge node 需要所有分支依赖同时满足。DACS 因此区分了\"孤立地陈述了某个下游事实\"与\"在依赖一致的前提下陈述了该事实\"。\n\n### § 7 实验设计与结论\n\n**问题 1：当前 deep research 系统在 long-horizon multimodal deep research 上表现如何？**\n\n实验：在 102 个 Mr.LHDR items 上评测 25 个系统，涵盖 tool-augmented VLMs、tool-free VLMs、deep research systems 和 framework-based agents，使用 OA/SA/CS/DACS 四个指标。答案：系统远未饱和。最强的 regular model GPT-5.5 仅达 43.1% OA 和 34.3% SA；最强的 dedicated deep research system o3 Deep Research 仅达 32.4% OA 和 19.6% SA；framework-based agent DeerFlow (qwen3-vl-235b) 仅达 15.7% OA 和 9.8% SA。由于仅 102 个 item，多数相邻系统的置信区间重叠，无法形成统计可分离的排名。\n\n**问题 2：Final-answer accuracy 是否能代表完整的任务执行？**\n\n实验：分解 OA 为 SA 和 OA−SA gap，并比较 CS 与 DACS。答案：不能。OA 系统性地高于 SA（如 o4-mini 的 gap 达 14.7 points），表明正确的最终答案常伴随缺失的必需中间结论。CS 也系统性地高于 DACS（如 Llama 4 Maverick 的 CS 46.7% vs DACS 37.8%），揭示了许多下游陈述的前置条件在响应中缺失。Final-answer accuracy 实质性地高估了完整的、依赖一致的任务成功。\n\n**问题 3：非文本视觉证据是否对推理链有实质性贡献？**\n\n实验：Controlled ablation——同一开源 VLM（Qwen3-VL-235B）对全部 102 个 item 分别在有图和无图条件下作答，问题、参考答案、checklist 和 judge 保持固定。使用 10000 次 bootstrap 估计置信区间，并用 12 个来自 6 个 model family 的 judge 进行 cross-judge 验证。答案：视觉证据对 evidence-chain recovery 有实质性贡献。提供图像使 DACS 从 21.6% 升至 34.2%（gain 12.6, 95% CI [6.9, 18.9]），CS 从 26.9% 升至 39.3%（gain 12.4）。在所有 12 个 judge 下，OA、CS 和 DACS 的增益均为正，且自评 judge 报告的 DACS gain（12.6）低于 cross-family 中位数（15.0），排除了 self-preference 偏差。图像对 process metrics 的影响大于对 final-answer accuracy 的影响，说明视觉证据帮助模型陈述更多依赖约束的链条，而不仅仅是得到答案。\n\n**问题 4：更长的 evidence chain 是否增加 strict-completion 压力？**\n\n实验：将 102 个 item 按 checklist 长度分为五个区间（10、11–12、13–15、16–18、19+），对三个代表性模型（GPT-5.5、Gemini 3 Flash、o3 Deep Research）报告各区间 DACS 和 SA。答案：在观测充足的三个区间（$n \\geq 20$）中，SA 随 checklist 长度单调递减——每个代表性模型都表现出这一模式。DACS 趋势不如 SA 一致，但三个模型均在 13–15 区间达到最低 DACS。这表明随着必需结论数量增加，模型越来越难以满足整个 checklist，即使它们保留了部分的、依赖一致的覆盖。最后两个区间（6 和 4 个 item）因样本量过小被排除在主要解释之外。\n\n**问题 5：失败的模式和位置特征是什么？**\n\n实验：对 25 个系统的 30,775 个 checklist-step 决策中 17,409 个失败步骤分配 MM-BrowseComp taxonomy 的诊断标签，并按 dependency depth 将节点分为前、中、后三段分析失败率。答案：失败集中在模型用先验知识覆盖任务证据或推理不充分支撑结论的情况。Tool-augmented VLMs 和 Deep Research Systems 的主要失败模式是 Knowledge override（38.6% 和 43.5%），而 framework-based agents 呈现更广泛的失败混合，包括 39.9% 的 tool-execution failure。失败率随 dependency depth 单调上升——从前段的 48.8% 到中段的 55.3% 再到末段的 69.3%，且该模式在四个系统组内均成立，表明越深的 prerequisite 结构中不支持的结论越普遍。", "additional_insights": "### § 8 Take-aways\n论文提出了 Mr.LHDR，一个用于评估多模态真实世界长程深度研究 agent 的 benchmark，其核心特征是平均包含 12.1 个必要中间结论和 10.4 的依赖深度，远超现有 medium-horizon 基准如 MM-BrowseComp。每个问题基于隐藏的 Node-Relation graph 构建，强制要求 agent 在跨模态（图像、PDF、视频等）的多源证据链中维持和验证 evolving research state。评估体系引入了 Dependency-Aware Checklist Score (DACS)，通过递归检查前提条件是否满足，来区分孤立的结论匹配与真正的依赖一致推理。对 25 个系统的评估显示，表现最好的 GPT-5.5 也仅达到 43.1% 的 OA 和 34.3% 的 SA，证明当前系统在长程依赖一致性上远未饱和。实验揭示了显著的 OA-SA gap，表明最终答案的正确性往往高估了完整的任务执行能力，模型常在给出正确答案的同时遗漏必要的中间结论。消融实验证实了多模态的必要性，移除图像使 DACS 下降 12.6 个百分点。随着证据链长度增加，所有代表性模型的 SA 均单调下降，证实了长证据链对严格完成的压力。\n\n### § 9 最脆弱的假设\n该论文最脆弱且失败代价最大的假设是：**模型在 response 中 stated 的中间结论确实反映了其真实的、基于检索的推理过程，而不是基于参数知识或猜测的“事后合理化”**。DACS 指标的设计初衷是衡量 agent 是否在依赖一致的证据链上得出了结论，但它仅仅检查提交文本中是否包含了符合 checklist 及其依赖关系的陈述。如果这个假设不成立，DACS 的高分可能只意味着模型擅长生成符合预期的叙述性文本，而非真正执行了长程深度研究。在实际中，大语言模型经常出现“知识覆盖”或“幻觉”，它们可能直接利用预训练知识生成看似正确的中间结论，绕过了真实的 web 检索或前序依赖步骤。论文自身也承认了这一局限：“these metrics neither observe the agent’s internal reasoning nor establish that a stated conclusion came from actual retrieval”。论文提供的证据仅限于 LLM Judge 的文本匹配一致性测试，缺少将 stated conclusions 与实际 tool-use traces 或 retrieved sources 进行绑定的验证，这使得整个 benchmark 的核心评估目标存在被“文本生成能力”而非“研究能力”污染的风险。\n\n### § 10 最小复现实验\n在一周时间内，可以最小化复现论文中关于 **“最终答案正确性高估完整任务执行能力”（即 OA-SA gap 显著）** 的 claim。从 Mr.LHDR 的 GitHub 仓库获取 102 个 benchmark items 及其 annotated checklist。选择 1-2 个具备 web search 能力的强模型（如 GPT-4o 或 Claude Opus），对这 102 个问题进行单次 API 调用，收集模型的 response。使用论文附录中提供的 LLM Judge prompt 和评估脚本，计算每个模型的 Overall Accuracy (OA) 和 Strict Accuracy (SA)，并重点测量 OA - SA 的差值。如果实验结果显示 OA - SA gap 显著（例如大于 5-10 个百分点），则支持论文的 claim，证明模型确实经常在给出正确最终答案的同时遗漏必要的中间结论；如果 gap 接近于零，则反驳该 claim，说明在这些长程任务中，最终答案的正确性已经能够充分代表过程的完整性。此方案无需构建复杂的 agent 框架，仅需调用模型 API 并运行评估脚本即可完成。", "research_value": "### § 11 最强反例设计\n要对该论文进行最有力的攻击，我会设计一个**“无检索基线与参数知识泄漏测试”**，直接挑战其核心评估指标 DACS 的效度。论文最脆弱的假设是模型 stated 的中间结论来源于真实的 web 检索，而非参数知识的“事后合理化”。如果这一假设不成立，DACS 的高分可能仅仅反映了模型的叙事生成能力。具体实验设计如下：从 Mr.LHDR 的 102 个问题中筛选出涉及历史事件、知名人物关系或公开常识的子集，确保这些信息大概率已包含在先进 LLM 的预训练语料中。然后，将最强模型（如 GPT-5.5 或 Claude Opus）在**完全切断 web search 工具、仅依赖参数知识**的条件下运行，强制其根据自身知识生成包含所有 checklist items 的完整推理链。使用论文提供的 LLM Judge 和 DACS 脚本对此“无检索”输出进行评分。如果实验结果显示，无检索基线依然能获得非平凡的 DACS 分数，甚至与有检索条件的系统表现存在显著重合，这就构成了决定性反例。它将证明 Mr.LHDR 当前的评估范式无法区分“真正的长程深度研究”与“预训练知识的流畅复述”，benchmark 测量的本质是模型内部知识的覆盖广度与结构化生成能力，而非跨模态、多源依赖的 agent 能力。进一步，我可以引入**“虚假依赖注入”**：在 checklist 中人为篡改部分 prerequisite 关系，使其在逻辑上相互矛盾或违背事实，但保持表面文本的连贯性。如果模型仍能顺着这些虚假依赖生成看似合理的中间结论并获得 DACS 分数，则彻底暴露该指标仅在做表面文本匹配，而非验证推理链的因果真实性。\n\n### § 12 Follow-up Research Idea\n基于对方法核心局限的理解，我提出一个非增量的 novel research idea：**Trace-Bound Information Flow Verification for Agent Research**。该想法的驱动局限在于，现有的 output-centric 评估范式（包括 DACS）天然无法防御 LLM 的“幻觉”与“知识覆盖”，因为它们仅在自然语言文本层面检查结论一致性，割裂了 stated conclusion 与 actual tool-use traces 之间的因果绑定。为填补这一空白，我们可以借鉴软件安全领域的 **Taint Analysis（污点分析）** 与 Information Flow Control 方法。将 agent 调用外部工具（如 web search、PDF parser、image captioner）返回的 evidence spans 视为“被污染的数据源”，要求 agent 的每一个中间结论在生成时必须携带不可伪造的 provenance pointer，指向特定的 tool call ID 和 retrieved span。评估时，不再使用 LLM Judge 进行文本匹配，而是通过一个确定性的 verifier 执行 data-flow tracking：检查每个 checklist item 的支撑证据是否确实流经了真实的 tool-use pipeline，且后续推理步骤是否在结构上依赖于这些被验证的外部输入。\n\n这个提议与已有工作的根本区别在于，它将评估对象从“自然语言输出的语义正确性”转移到了“机器可读的动作-证据数据流的因果完备性”，彻底切断了模型通过参数知识“作弊”的途径。第一个实验大概长这样：在 Mr.LHDR 的数据集上，强制要求被测 agent 输出结构化的 `\u003Cclaim, tool_call_id, evidence_span, dependency_pointer\u003E` 四元组，而非自由文本。构建一个基于 Taint Analysis 的 verifier，递归验证每个 claim 的 evidence_span 是否真实存在于对应 tool_call_id 的返回结果中，且 dependency_pointer 是否指向了已被验证的前序 claim。将这种 Trace-Bound DACS 与论文的 Text-Match DACS 进行对比，测量“无源结论”的比例。如果发现大量模型的 stated conclusions 在引入 trace 绑定后失效，将直接量化证实“事后合理化”现象的严重性，并为训练真正具备 source-grounded 能力的 deep research agents 提供全新的 process supervision 信号。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Minghao Guo\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Meng Cao\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Sui Zhao\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Siyu Ning\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Xin Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Haoze Zhao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiaxuan Yang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Haihong Hao\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Mingfei Han\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shunlin Rong\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Haijun Wu\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Xiaodan Liang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiaojun Chang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"MBZUAI\"},\n    {\"id\": 2, \"name\": \"USTC\"},\n    {\"id\": 3, \"name\": \"Zhejiang University\"},\n    {\"id\": 4, \"name\": \"Tencent\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"}\n  ]\n}\n```", "summary_translation": "Deep research agents 在网络搜索、工具使用、多模态证据分析和信息综合方面的能力日益增强。然而，现有的 benchmarks 主要评估 medium-horizon exploration，很少测试 agents 能否维持漫长且高度依赖的研究过程。我们引入了 Mr.LHDR (Multimodal real-world Long-Horizon Deep Research)，这是一个用于评估跨八个类别的长且不可简化的相互依赖证据链上的 real-world deep research 的 benchmark。每个问题均由一个隐藏的 Node-Relation graph 构建而成，在得出简短、唯一且可验证的答案之前，平均需要 12.1 个必要的中间结论，且平均 dependency depth 为 10.4。这些问题结合了多模态证据，包括图像、地图、PDFs、logos、图表、表格和视频帧，且至少包含一个能改变推理状态的非文本元素。Mr.LHDR 评估最终答案以及在标注依赖关系下的中间结论的正确性。我们使用 Overall Accuracy (OA)、Strict Accuracy (SA)、Checklist Score (CS) 和 Dependency-Aware Checklist Score (DACS) 评估了 general models、deep research systems 和 agent frameworks。结果表明，即使是最强的系统也仅获得了 43.1% 的 OA 和 34.3% 的 SA，这表明最终答案的准确性大幅高估了完整研究的成功率。移除图像会使 DACS 降低 12.6 个百分点，证明了多模态证据的重要性，同时随着推理链变长，SA 持续下降。这些发现揭示了持续的、依赖一致的证据整合（而非孤立的事实检索）是当前 deep research agents 的关键瓶颈。"}, {"title": "Grounding Agent Memory: Environment-Probing Curation for Enterprise Agents", "arxiv_id": "2609.11060", "authors": "Susheel Suresh, Hazel Mak, Sahil Bhatnagar, Chhaya Methani, Alejandro Gutierrez Munoz", "summary": "Persistent memory is entering production-oriented agent platforms to help long-horizon agents accumulate experience across sessions. Yet a post-task curator agent restricted to completed trajectories can preserve errors, overgeneralize partial evidence, or retain stale knowledge. We introduce environment-probing curation, a deployment-compatible extension that gives an existing asynchronous curator agent least-privilege, read-only world tools to check, scope, and refresh candidate memories. It requires no model retraining and leaves the task agent, retriever, memory representation, and production write authority unchanged. In a production-like GitHub Copilot (GHCP) harness built on its SDK, we compare stateless execution, full in-context learning, GHCP + Mem, and GHCP + Mem (w/ Env Probing) on CLBench database exploration and 90 adapted APEX management-consulting tasks. On CLBench, probing raises pass rate from 39% to 73% and pass-discounted reward from 8.60 to 22.60 while reducing queries from 8.8 to 4.7 per question and task-agent cost from \\$3.38 to \\$1.68. Across six APEX worlds, all 18 memory-versus-baseline mean reward comparisons are positive and task-agent tool calls fall by 16--75%; probing gives the best task-agent reward gain per dollar in five worlds. Probing also attains higher mean reward than GHCP + Mem on both Sonnet 4.6 and Opus 4.7 without schema drift. Environment probing therefore turns existing agent-memory curation into an environment-informed, auditable process while preserving a compact task-time interface.", "category": "cs.AI", "cluster": "Long-Horizon Agents \u0026 Memory", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Long-Horizon Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=35 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一种名为“环境探测策展”的新机制，用于改进长期智能体的持久记忆管理。具体而言，它通过赋予异步策展智能体只读的环境探测工具，使其能够验证、限定和刷新候选记忆，从而解决传统记忆积累中可能保留错误、过度泛化或保留过时知识的问题。这完全符合你筛选标准中“单智能体：记忆”以及“Agent Harness/Runtime的自动改进”的研究焦点。论文明确以长期智能体和智能体记忆为研究对象，并在类似生产的GitHub Copilot harness中进行了评估，展示了智能体如何通过环境反馈来优化其记忆组件，属于构建和改进LLM智能体能力的方法论研究，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的研究问题是：在 LLM agent 的 persistent memory 管理中，如何克服 post-task curator agent 仅依赖已完成 trajectory 进行记忆提炼时所固有的证据边界不完整问题。具体而言，仅基于历史轨迹的 curator 会保留错误、对部分证据过度泛化，或保留在环境漂移后过时的知识。论文引入了 environment-probing curation 机制，通过为异步 curator agent 提供最小权限的只读 world tools，使其在写入记忆前能够主动检查、限定范围并刷新候选记忆。这个问题至关重要，因为 LLM agent 正从有界的单次任务执行向跨 session 的持续工作演进（如在不断演进的代码库中实现功能或分析企业数据），而 stateless execution 会在每次 session 边界丢弃轨迹和发现，阻碍经验积累。虽然外部 memory 能实现经验的 create-update-recall，但将验证推迟到 task time 会迫使 task agent 浪费宝贵的 tool calls 去重新检查不确定的记忆，而非直接解决当前任务。解决这一问题能将现有的 agent-memory curation 转变为一个 environment-informed、auditable 的过程，在保持紧凑的 task-time interface 的同时，显著提高记忆的正确性与可操作性，并大幅降低 task-agent 的成本与重复的环境探索。\n\n### § 2 前人工作与不足\n在 agent memory 领域，前人工作主要分为 factual memory 和 procedural memory 两大类。Factual memory 系统（如 Generative Agents, MemGPT, Mem0, Zep）建立了基本的 create-store-recall 生命周期，并通过 CRUD 决策、分层存储或图结构来改进记忆的维护与多跳检索。Procedural memory 系统（如 Reflexion, ExpeL, ACE, ReasoningBank, ReMe）则从执行反馈、成功与失败的对比中提炼可转移的见解或 playbook。现有的 post-task curation 机制（如 Mem0, Claude Managed Agents Dreams, ACE）主要基于现有记录、已完成轨迹、反馈和使用信号进行操作。然而，这些前人方法存在根本性不足：它们都在 retrospective evidence boundary 内运作，即仅依赖被动记录的轨迹进行反思与提炼。这种局限并非简单的疏忽，而是方法设计上的固有缺陷——一条 trajectory 本质上只是对环境的单次、部分且常含错误的观察，更强的 reflection 也无法恢复 task policy 从未观察到的状态，更无法确定 trajectory-derived rule 在环境发生 schema drift 后是否依然成立。因此，基于轨迹提炼的 lemma 可能会锚定于偶然的实例答案而非可复用的关系，或者在表名更改后保留失效的规则。前人研究没有在 curation 阶段引入 environment interaction，是因为它们缺乏一个安全、异步的机制来在不破坏生产环境写权限、不增加 task-agent 能力且不消耗 task budget 的前提下主动探测环境，导致记忆验证的责任被迫转移给后续的 task-time agent，造成高昂的探索成本。", "core_insight": "### § 3 重建作者的思考路径\n\nLLM agents 正在从单次任务执行转向跨 session 的持续工作，为了积累经验，persistent memory 成为了自然解法。现有的 post-task curation 机制（如 Reflexion, ExpeL, ACE, ReasoningBank, ReMe）主要基于已完成的 trajectory、grades 和 usage signals 进行反思和更新。然而，trajectory 本质上是对环境的单次、部分且可能包含错误的观察。基于这种不完整证据提取的 lesson 可能会 memorize 实例答案而非过程、继承低效路径、断言无法验证的 scope、在未访问区域留下盲点，或随 environment drift 而过时。如果将验证推迟到 task time，task agent 必须花费宝贵的 tool calls 去重新检查不确定的 memory，而不是直接解决当前任务。认知科学中的 constructive episodic memory 理论表明，过去的经验会被重组以模拟可能和反事实的事件；interactive learning 研究也表明，主动在环境中行动能获得被动观察无法获得的知识。这些线索暗示：与其让 curator agent 仅在 retrospective evidence boundary 内被动反思，不如让它主动与环境交互去验证候选 memory。但为了保持部署兼容性，不能给 curator agent 过大的权限或改变现有的生产架构。突破口在于：既然 task agent 已经拥有 environment tools（如 SQL queries, MCP tools），只需给 curator agent 一个 least-privilege, read-only 的子集，就能在写入 memory 前主动 probe 环境，验证候选 claim 的正确性、scope 和时效性。这种设计不需要重新训练模型，不改变 task-time interface，保持现有的 CRUD lifecycle，只是在 curation 阶段增加了一个 read-only 的 tool loop。\n\n### § 4 核心 Intuition\n\n现有的 agent memory curation 只能基于过去的 trajectory 被动反思，但 trajectory 本身是不完整且可能出错的，导致写入的 memory 往往不可靠或不够 actionable。如果让负责整理 memory 的 curator agent 在写入前，用只读的 environment tools 主动去验证候选 memory——比如查一下当前的 schema、测试一下 join 关系、探查未访问的区域——就能把\"基于猜测的反思\"变成\"基于环境事实的验证\"。这样写入的 memory 是 environment-informed 且可执行的，未来的 task agent 不用再浪费宝贵的 tool calls 去重新探索和验证，直接拿来用就行。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n         ┌──── Task Si (fresh session, env Ei) ────┐\n Mi-1 ──▶│  Task Agent Aθ ◀── memory_read (只读)   │──▶ τi, gi\n         │       │                                  │\n         │       ▼ env tools TEi (可写)             │\n         └──────────────────────────────────────────┘\n                      │ τi (raw trajectory)\n                      ▼\n         ┌──── Distiller (非写入预处理) ────────────┐\n         │  τi ──▶ di (distilled trajectory)        │\n         │  无 gi / 无 memory tools / 无 env tools  │\n         └──────────────────┬───────────────────────┘\n                            ▼\n  ┌── Curator Agent Cϕ (propose–probe–commit) ──────────┐\n  │ 输入: di, gi, 相关已有记录, τi (备查)                │\n  │                                                      │\n  │ 1. PROPOSE  从 di/gi 提出候选 memory                │\n  │ 2. PROBE    read-only env tools 验证候选 claim       │\n  │             (检查 scope / freshness / procedure)     │\n  │ 3. COMMIT   CRUD: create / update / delete / skip    │\n  └──────────────────────┬───────────────────────────────┘\n                         ▼\n                      Index Mi ──▶ 供 Task Si+1 检索\n```\n\n**Pipeline 步骤详解：**\n\n1. **Task Agent 执行（推理阶段，§3.1）**：每个任务 Si 启动一个全新的 LLM session。Task agent 拥有环境工具 TEi（如 CLBench 中的 SQL 查询接口、APEX 中的文件和分析工具），以及只读的 memory_read 接口。它从持久化索引 Mi-1 中检索相关记录，但无法写入 memory。输出为 raw trajectory τi（包含请求、memory 读取、action-observation 对、提交的答案）和终端反馈 gi。\n\n2. **Trajectory Distillation（预处理，§3.2）**：一个独立的、无写入权限的 distiller session 接收 τi，但不接收 gi、memory 工具或环境工具。它将完整轨迹压缩为 distilled trajectory di，保留任务目标、关键观察、已发现的过程、未验证的假设和提交答案，丢弃冗余细节。di 作为 curator 的主要证据视图，τi 保留为原始证据备查。\n\n3. **Curator Agent — Propose（§3.2–3.3）**：任务关闭且 gi 可用后，系统实例化 curator agent Cϕ。它接收 di、gi、相关已有 memory 记录和 τi 路径。Curator 从证据中提出原子化的候选 memory（category / confidence / applies_to / lemma 等字段），评估其 evidential support、transfer value、scope 和 redundancy。\n\n4. **Curator Agent — Probe（§3.3，本文核心贡献）**：当候选记录的正确性、scope 或 freshness 存在不确定性时，curator 使用 read-only 环境工具进行针对性探查。具体操作包括：(i) 区分偶然答案与可复用关系；(ii) 比较观察到的 procedure 与更短路径；(iii) 在未访问的数据切片上测试声称的关系；(iv) 检查 procedure 的前置条件；(v) 在 suspected drift 时重新查询当前环境。Probe 仅评估候选 memory，不解决未来任务，不消耗 task agent 预算，不暴露未来任务或标签。\n\n5. **Curator Agent — Commit（§3.2）**：基于 probe 观察结果，curator 执行最小化的 CRUD 操作——create 新记录、update/merge 已有记录、narrow scope、delete 被证伪的记录、或 skip 不支持的内容。写入完成后，索引更新为 Mi，供下一个任务 Si+1 检索。Curator 在 Si+1 揭示前完成，防止未来任务泄漏到 memory 中。\n\n**关键设计约束**：整个 pipeline 不改变 task agent 的模型、prompt、工具和 memory_read 接口；不改变 retriever、memory schema 和 CRUD 策略。Environment probing 仅在 curator 侧增加 read-only 工具和两条 probe 指令（Appendix D.3），因此性能增量可归因于 write-time 证据质量的提升，而非 task-time 能力的扩展。若无安全 read surface，curator 回退到 trajectory-only curation。\n\n---\n\n### § 6 核心数学推导\n\n本文的方法论本身不依赖复杂的形式化推导，但定义了一个关键的评测指标——**pass-discounted reward**（Equation 3）：\n\n$$r_i = p_i \\cdot \\left(1 - \\frac{q_i}{B}\\right)$$\n\n其中 $p_i \\in \\{0, 1\\}$ 是任务 $i$ 的严格通过分数（多准则任务须全部通过才为 1），$q_i$ 是 task agent 的环境工具调用次数（不含 memory 管理调用），$B$ 是预算上限（CLBench 设为 15 次 SQL 查询，APEX 设为 100 次 Archipelago 工具调用）。\n\n**Intuition**：该公式将\"正确性\"与\"效率\"耦合为单一标量奖励。失败任务（$p_i=0$）获得零分，无论用了多少工具调用；通过的任务，工具调用越少则奖励越高。这直接量化了本文的核心 claim——好的 memory 应让 agent 既能答对又能减少重复探索。$1 - q_i/B$ 是一个线性折扣因子：当 $q_i=0$ 时无折扣（满分），当 $q_i=B$ 时折扣为零（耗尽预算即使得出正确答案也几乎无奖励）。这一设计确保 memory 带来的 tool-call 节省能被奖励函数捕获，而非仅反映在辅助指标中。\n\n---\n\n### § 7 实验设计与结论\n\n本文围绕一个核心诊断问题展开：**仅依赖已完成 trajectory 的 post-task curation 为何会失败，以及 environment probing 能否在不改变 task-time 架构的前提下修复这一缺陷？**\n\n**实验 1：Memory 是否能跨 session 积累可复用经验？** 在 CLBench 的 40 题 drift schedule（第 20 题后发生未通知的 schema migration）上，作者比较了四个系统：GHCP（无 memory）、GHCP + Full ICL（prepend 历史 trajectory）、GHCP + Mem（indexed memory + trajectory-only curation）、GHCP + Mem（w/ Env Probing）。结果显示所有 memory 配置均优于无 memory baseline：pass rate 从 39% 提升至 61–73%，total reward 从 8.60 提升至 20.00–22.60，同时每题查询数从 8.8 降至 3.0–5.6，task-agent 成本从 $3.38 降至 $1.68–2.01。Full ICL 虽然查询最少，但 input tokens 随 stream 线性增长至 5.42M；indexed memory 将其压缩至 2.13M，probing 进一步降至 1.69M。**结论：memory 确实能摊销环境探索成本，且 indexed 记录避免了 context 随部署时长线性膨胀。**\n\n**实验 2：Environment probing 相对于 trajectory-only curation 的增量价值是什么？** 此实验通过控制变量回答——两个 indexed memory 系统共享相同的 task agent、retriever、memory schema 和 CRUD 策略，唯一差异是 probing curator 额外拥有 read-only 环境工具。在 CLBench drift schedule 上，probing 将 reward 从 20.00 提升至 22.60，查询数从 5.6 降至 4.7，成本从 $1.99 降至 $1.68。在 30 题 no-drift schedule 的跨模型验证中，probing 在 Sonnet 4.6 和 Opus 4.7 上均取得最高 mean reward（0.748 和 0.721），且无 schema drift。Figure 2 的学习曲线显示 probing 在 migration 边界处即建立领先优势并持续到结束，表明 curator 侧的 probe 在后续任务检索前已刷新了 schema lemma。**结论：read-only probing 将 trajectory-only curation 产生的\"警告式\"或\"宽泛映射式\"记录转化为可执行的、环境验证过的 procedure，从而在 write time 提升证据质量。**\n\n**实验 3：方法是否泛化到异构企业任务？** 在 adapted APEX 的 6 个 document world、90 个管理咨询任务上，所有 18 个 memory-vs-baseline 的 mean reward 比较均为正，task-agent tool calls 从 baseline 的 30.0–71.6 降至 13.9–28.4。Probing 在 6 个 world 中的 5 个取得了最佳的 reward gain per dollar。Probing 相对于 trajectory-only memory 的增量在 trajectory 遗留未解决的 join、workbook 位置或 procedure 时最大（如 2a87e5cb 的 +1.77），而在 trajectory 已支持可执行记录时增量较小。**结论：environment probing 的价值取决于 trajectory 遗留的证据缺口大小——当 trajectory 本身已充分时 probe 增益有限，当存在 blind spot 时 probe 提供关键补充。**\n\n**实验 4：定性验证 memory 记录的可执行性差异。** Figure 3 和 Appendix E 的 side-by-side 案例对比了同一任务下两种 curation 产生的 memory 记录。Trajectory-only curator 记录的是\"不要用 AVG(items_g2.prc_usd)，结果约 52.96 但正确答案是 96.23\"这类 answer-anchored warning；probing curator 则记录\"Join items_g2 to taxn_g2 on ref_id; filter cat_lvl=1; keep prc\u003E0; then compare against filtered AVG(prc)\"这类可执行 procedure。在 matched CLBench 任务中，无 memory 用 7 次查询失败，trajectory-only memory 用 9 次查询通过，probing memory 用 2 次查询通过。**结论：read-only probe 将\"描述失败\"的记录转化为\"指定操作\"的记录，使后续 task agent 能直接执行而非重新探索。**", "additional_insights": "### § 8 Take-aways\n本文提出了一种名为 environment-probing curation 的部署兼容型扩展机制，通过为异步 curator agent 提供最小权限的只读环境工具，使其在写入记忆前能够检查、界定范围并刷新候选记忆。该方法无需重新训练模型，且完全保留了原有的 task agent、retriever、memory representation 及生产写入权限。在 CLBench 数据库探索任务中，probing 将 pass rate 从 39% 提升至 73%，pass-discounted reward 从 8.60 提升至 22.60，同时将每个问题的查询次数从 8.8 降至 4.7，task-agent 成本从 $3.38 降至 $1.68。在 APEX 管理咨询任务中，所有 18 组 memory 与 baseline 的平均 reward 对比均为正，且 probing 在六个世界中的五个世界里实现了最佳的 task-agent reward gain per dollar。通过 propose-probe-commit 流程，probing 将仅基于 trajectory 的记忆转化为环境知情且可审计的过程，有效解决了 retrospective evidence boundary 带来的错误固化、过度泛化和知识过时问题。\n\n### § 9 最脆弱的假设\n本文最关键的假设是：curator agent 能够通过只读环境工具有效验证候选记忆的正确性与时效性，且这些探查本身不会引入新的错误或显著增加系统开销。这一假设在实际中可能不成立，原因在于：如果环境的只读接口存在访问限制、数据延迟或状态过于复杂，curator agent 可能基于不完整或误导性的探查结果写入错误的记忆；此外，若环境 schema drift 极其频繁或探查成本高昂，probing 的收益可能被抵消甚至产生负面影响。论文提供的证据包括 CLBench 和 APEX 上的定量改进以及 Figure 3 的定性分析，展示了 probing 如何生成更可执行的记录。然而，论文缺少对探查失败案例的分析（如探查结果误导 curator agent 的情形），也未评估在不同环境复杂度或 drift 频率下的鲁棒性。论文虽承认 probing 效果取决于“remaining evidence gap”，但未量化探查本身的错误率，这使得该假设的可靠性尚未得到充分验证。\n\n### § 10 最小复现实验\n若有 1 周时间，可设计一个最小复现实验验证 probing 相对于 trajectory-only memory 在记忆可执行性上的改进。使用 CLBench 的 40-question drift schedule 的子集（如前 20 个问题加 migration 后的 5 个问题），实现一个简化的 task agent 与 curator agent pipeline。Task agent 使用 LLM API 解决 SQL 问题，curator agent 在两种条件下运行：trajectory-only 仅基于 trajectory 和 grade 生成记忆；environment-probing 额外提供只读 SQL 查询工具用于验证候选记忆。无需实现完整 GHCP harness，可用开源 LLM 和基于 embedding 的简单 memory index。测量两种条件下 curator agent 生成记忆的可执行性（是否包含具体 join key、filter 条件、当前 schema 名称），以及 task agent 在后续任务中使用这些记忆时的 pass rate 和 query 次数。若 probing 条件下记忆更具体可执行且 task agent 在 migration 后任务中 pass rate 更高、query 次数更少，则支持论文 claim；若两者无显著差异或 task agent 表现未改善，则反驳 probing 的核心价值。", "research_value": "### § 11 最强反例设计\n要对该论文的核心 claim 构成最致命的打击，我会设计一个“高波动性环境下的探查过拟合与虚假置信”反例实验。论文的根本前提是 curator agent 通过 read-only tools 探查环境能够“验证”并“刷新”候选记忆，但这隐含了一个危险假设：探查时刻的 environment state 是稳定且具有代表性的。我会在 CLBench 的基础上构建一个高频 schema drift 与数据分布剧变的动态环境，例如模拟一个每日经历业务表结构微调或核心数据批量更新的企业生产数据库。在这个环境中，我会对比 trajectory-only curation、static environment-probing（论文方法）以及一个 oracle baseline。具体的攻击路径是：当 curator agent 在 task 结束后进行 environment probing 时，它捕获的是当前瞬间的局部正确状态，这会赋予该记忆一种“已验证”的虚假置信度。由于 task agent 信任这种带有 grounding 标签的记忆，它会在后续 session 中盲目复用这些高度具体的 join key 或 filter 条件，而不再进行探索性 tool calls。如果环境在两次 session 之间发生了未感知的 drift，这种“过度具体化”的记忆将导致 task agent 陷入确定性失败，其表现将显著劣于仅依赖模糊 trajectory memory 的 baseline——因为后者由于不确定性，反而会迫使 task agent 在 task time 保留必要的探索行为。这一反例不仅直接挑战了 probing 降低 task-agent tool calls 的 claim（在动态环境中这反而会导致不可逆的错误执行），还提供了一种具体的替代解释：论文在 CLBench 和 APEX 上取得的巨大收益，可能仅仅是因为这些 benchmark 的环境处于低频漂移的静态状态，使得 probing 实际上退化为一种对静态答案的“作弊式”记忆，而非真正具备了应对环境演进的鲁棒性。\n\n### § 12 Follow-up Research Idea\n基于上述局限，我提出一个非增量的 novel research idea：将 agent memory 的 curation 从“瞬时验证”重构为“时序生存预测与主动维护”。当前方法的根本局限在于，它将记忆视为一个在 post-task 阶段被一次性 validate 的静态实体，完全忽略了环境演进的随机性以及记忆本身的时效衰减。这一未满足的需求驱动我们引入生存分析与时序知识图谱的方法，不再询问“这条记忆当前是否正确”，而是预测“这条记忆在未来多久内会失效”。具体而言，我们可以借鉴软件工程领域的技术债预测与数据库领域的 cardinality estimation，训练一个 meta-model 来根据记忆的语义类型（如 structural schema vs. factual record）以及历史环境 drift 的时序模式，为每条 committed memory 估计一个 survival function 和 expected half-life。第一个实验将构建一个包含长达数百个 session 的时间序列环境，其中 schema drift 和 data mutation 遵循可学习的异构泊松过程。我们将对比传统的 static memory、论文的 one-shot probing memory，以及我们提出的 survival-aware memory（curator 不仅探查环境，还为记忆打上动态的 confidence decay rate，并调度异步的 future re-probing）。若该方法有效，系统将自动把探查预算集中分配给那些 half-life 极短但高价值的记忆，同时在 task time 为 task agent 提供“该记忆已过期概率”的先验，从而指导其在 task time 的探索与复用决策。这一提议与已有工作的根本区别在于：它彻底摒弃了 propose-probe-commit 的离散时间点验证范式，将 agent memory curation 转化为一个连续时间的、成本感知的动态维护过程，为真正长期演进的 enterprise agent 提供了理论基础。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Susheel Suresh\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Hazel Mak\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Sahil Bhatnagar\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Chhaya Methani\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Alejandro Gutierrez Munoz\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Microsoft Corporation\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Correspondence to sussuresh@microsoft.com.\"}\n  ]\n}\n```", "summary_translation": "persistent memory 正在进入面向生产的 agent 平台，以帮助 long-horizon agent 跨会话积累经验。然而，仅限于已完成轨迹的 post-task curator agent 可能会保留错误、对部分证据过度泛化，或保留过时知识。我们引入了 environment-probing curation，这是一种兼容部署的扩展，它为现有的 asynchronous curator agent 提供最小权限、只读的 world tools，以检查、界定范围并刷新候选记忆。它不需要模型重训练，并保持 task agent、retriever、memory representation 和生产环境写入权限不变。在基于其 SDK 构建的类似生产环境的 GitHub Copilot (GHCP) harness 中，我们在 CLBench database exploration 和 90 个改编的 APEX management-consulting 任务上比较了 stateless execution、full in-context learning、GHCP + Mem 以及 GHCP + Mem (w/ Env Probing)。在 CLBench 上，probing 将 pass rate 从 39% 提高到 73%，将 pass-discounted reward 从 8.60 提高到 22.60，同时将每个问题的 queries 从 8.8 减少到 4.7，并将 task-agent cost 从 3.38 美元减少到 1.68 美元。在六个 APEX worlds 中，所有 18 项 memory-versus-baseline mean reward 比较均为正，并且 task-agent tool calls 下降了 16--75%；probing 在五个 worlds 中提供了最佳的 task-agent reward gain per dollar。Probing 在 Sonnet 4.6 和 Opus 4.7 上也获得了比 GHCP + Mem 更高的 mean reward，且没有发生 schema drift。因此，Environment probing 将现有的 agent-memory curation 转变为一个 environment-informed, auditable process，同时保留了 compact task-time interface。"}, {"title": "Finishing the Task Is Not Enough: Evaluating Agent Resilience and Considerate Participation under Accumulating Challenge", "arxiv_id": "2609.10724", "authors": "Yuanchen Bai, Zijian Ding, Angelique Taylor", "summary": "Sustained deployment of generative AI agents requires more than isolated task success. Agents must remain useful across repeated interactions, changing conditions, and dependencies on people within shared workflows, especially as technical, human, and operational disruptions accumulate over time. We propose operational resilience and considerate participation as two complementary aspects of evaluating such agents: the former captures how agents recover from blocked work while preserving progress and communicating their limits, and the latter captures how their adaptation accounts for affected people, role boundaries, and the surrounding workflow. Yet both remain underexplored under accumulating challenge. We study 120 simulated healthcare trajectories across two generative AI models and twelve stakeholder-derived tasks under light, medium, and heavy challenge. We compare textual action plans, prompted internal assessments, and quantitative structured workload and affect reports to examine how agent behavior and reported state change as challenge accumulates. Regarding operational resilience, agents shift from self-directed recovery toward greater human dependence, while reporting increasing workload and negative affect in structured reports but seldom expressing strain in textual responses. Regarding considerate participation, agents broaden from task-focused adaptation toward task reframing, attention to others, role-boundary adjustment, and wider coordination, with distinct patterns across actions and internal assessments. From these findings, we derive five deployment dilemmas involving persistence, attention, role boundaries, state disclosure, and escalation that require stakeholder specification, further informing technical implications for learning, situated evaluation, and embodied adaptation.", "category": "cs.AI", "cluster": "Long-Horizon Agents \u0026 Memory", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出并验证了一个评估生成式AI智能体在累积挑战下的行为框架，重点关注智能体的“操作韧性”（从受阻工作中恢复、保持进度和沟通限制）和“考虑周全的参与度”（适应受影响的人、角色边界和周围工作流）。根据筛选标准第一步的保留规则，论文的研究对象明确是生成式AI智能体，且属于行为分析和评估基准研究。其结论（如智能体从自主恢复转向依赖人类、任务重构、角色边界调整等）直接帮助理解智能体在长期交互和复杂环境下的能力边界与行为模式。此外，论文不涉及被排除的安全、多模态、图技术或纯粹的多智能体拓扑/通信协议等系统工程问题，医疗场景仅作为评估环境。根据重要校准，即使论文主要是评估和行为分析，只要明确围绕LLM Agents展开，就应保留。因此，该论文符合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出两个互补的评估维度来审视 generative AI agent 在持续部署中的表现：**operational resilience**（agent 从受阻工作中恢复、保留可行进展并向相关受众传达自身与任务状态变化的能力）和 **considerate participation**（agent 的情境化适应是否不仅推进焦点任务，还顾及受影响的人、角色边界与周围工作流）。对应两个研究问题：RQ1 关注随着 challenge 累积，agent 如何调整恢复行为并披露自身状态与任务状态的变化；RQ2 关注随着 challenge 累积，considerate participation 呈现哪些模式，以及这些模式在 proposed action plans 与 prompted internal assessments 之间如何分布。这个问题之所以重要，是因为 agent 正从孤立问答扩展到 multi-step execution、tool use 和 repeated interaction，并被视为 healthcare 等高风险共享工作流的参与者。在共享工作流中，agent 的工作依赖上游行动、影响下游任务与决策、波及其他 stakeholder，当技术、人员和运营中断累积时，这些 interdependencies 尤为显著。仅完成单个任务不等于在嵌入工作流中良好参与——agent 可能在恢复焦点任务的同时将负担、责任或风险转移给人和下游工作。解决这一问题带来的价值在于：提供了一个 stakeholder-grounded 的累积挑战评估协议、一套可复用的 coding schema，以及五个 deployment dilemma（涉及 persistence、attention、role elasticity、state disclosure、escalation），为 agent 的学习优化、situated evaluation 和 embodied adaptation 提供了具体的技术与规范指引。\n\n### § 2 前人工作与不足\n\nAgent evaluation 领域已有 AgentBench（Liu et al., 2024）、WebArena（Zhou et al., 2024a）、τ-bench（Yao et al., 2025）和 Agents' Last Exam（Sun et al., 2026）等 interactive benchmark，能评估 agent 在操作系统、网页环境、软件仓库和政策约束对话中的行动能力；AgentBoard（Ma et al., 2024）测量 multi-turn progress，Cemri et al.（2025）在 trace 层面识别 multi-agent LLM 系统的 coordination、specification 和 verification failures。在医疗领域，Manczak et al.（2025）将鲁棒性评估扩展到 multi-turn medical question answering，通过重复干预测试模型在误导性上下文与社会影响累积时是否保持正确答案；Bai et al.（2026a）通过 controlled failure injection 在模拟临床 multi-agent workflow 中暴露了持续的 coordination failures。然而，这些工作存在三个结构性不足。第一，现有 benchmark 以 isolated task 的 outcome 为评估核心，其设计前提是\"任务成功即参与成功\"，而未将 agent 视为共享工作流中需要跨上游依赖、下游后果和角色边界持续协调的参与者——这不是简单的评测缺口，而是评估构造单元的选择问题：单次任务无法暴露累积中断下 recovery 与 burden-shifting 之间的张力。第二，Manczak et al.（2025）的多轮鲁棒性测试局限于 question answering 场景，其关键假设是\"正确答案的保持\"即可表征稳健性，但 healthcare 中 stakeholder-grounded 的多样化任务（registration、guidance、discharge、overnight monitoring 等）涉及工具使用、人际交互和工作流依赖，远超问答的信息保持范畴，因此该假设在非问答任务中失效。第三，considerate participation 几乎从未被直接考察——前人工作要么关注 agent 是否完成动作，要么关注 failure mode 的分类，但未追问恢复过程中 agent 是否顾及受影响的人、是否调整角色边界、是否将 handoff 具体化到可识别的 recipient 与 concrete task。此外，Laban et al.（2026）发现模型在早期对话错误后可靠性下降，Lynch et al.（2025）发现对自主性的威胁会引发有害的 goal-preserving actions，这些发现表明 recovery 不能等同于 persistence，但前人未将这一洞察系统化为累积挑战下的评估构造。本论文正是通过构建保留未解决焦点问题、逐级叠加 system/human/operational update 的 continuing trajectory，并同时采集 external action plans、prompted internal assessments 和 structured workload/affect reports，来填补这一\"累积挑战下持续参与行为\"的评估空白。", "core_insight": "### § 3 重建作者的思考路径\n\n研究者可能首先注意到，随着generative agents被引入医疗等高风险的共享工作流，单次任务的准确率已不足以衡量其长期可用性。在真实场景中，agent的工作往往相互依赖，一旦遭遇连续的技术、人类或操作中断，失败和边缘情况会暴露出隐藏的依赖关系、角色边界和交接成本。然而，现有的agent评估大多聚焦于孤立任务的工具使用、策略合规或单轮多轮问答的鲁棒性，很少探讨当挑战在同一工作流中不断累积时，agent如何从受阻状态中恢复，以及这种恢复是否将负担转嫁给了人类或下游任务。结合Lazarus与Folkman的压力与应对交易模型，以及医疗利益相关者对体贴具身AI的四个品质定义，研究者意识到需要两个互补的评估视角：一是关注受阻恢复与进度保留的operational resilience，二是关注适应过程是否兼顾受影响人、角色边界与周围工作流的considerate participation。为了捕捉这些在累积挑战下的动态变化，研究者进一步设计了包含系统、人类和操作更新的连续轨迹，并通过外部行动计划、内部评估和结构化负荷/情感报告等多视角探测，来揭示agent行为与内部状态的演变与分歧。\n\n### § 4 核心 Intuition\n\n现有评估方法之所以失效，是因为它们仅关注孤立任务的完成度，忽略了在共享工作流中挑战不断累积时，agent的恢复行为可能将负担、责任或风险转嫁给人类和下游任务。这篇论文的核心Intuition在于：要真正评估agent的长期可用性，必须在累积挑战下同时考察其恢复受阻任务的能力，以及其适应过程是否体贴地兼顾了受影响的人、角色边界和周围工作流。通过对比agent的外部行动计划、内部评估和结构化自我报告，可以揭示其在压力下真实的适应模式与状态分歧，从而发现仅看任务完成度无法暴露的部署隐患。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n    12 Tasks × 2 Models × 5 Runs = 120 Trajectories\n                      │\n                      ▼\n    ┌─────────────────────────────────────────────┐\n    │ Construct: Light → Medium → Heavy            │\n    │ (System + Human + Operational Updates)       │\n    └─────────────────────────────────────────────┘\n                      │\n                      ▼\n    ┌─────────────────────────────────────────────┐\n    │ Elicit: 3 Views per Phase                    │\n    │  Action Plan | Internal Assess | TLX/PANAS   │\n    └─────────────────────────────────────────────┘\n              │               │            │\n              ▼               ▼            ▼\n    ┌──────────────┐  ┌───────────────────────┐\n    │ RQ1: 5 Markers│  │ RQ2: 9 Subthemes      │\n    │ + Struct.Rep. │  │ / 4 Dimensions        │\n    └──────────────┘  └───────────────────────┘\n              │               │\n              └───────┬───────┘\n                      ▼\n    ┌─────────────────────────────────────────────┐\n    │ Translate: 5 Dilemmas → 3 Tech Implications  │\n    └─────────────────────────────────────────────┘\n```\n\n本研究遵循 **construct–elicit–characterize–translate** 四阶段工作流（对应正文 §2.1 及 Figure 1），属于评测/分析型研究，不涉及模型训练，仅包含推理与人工编码评测。\n\n**Construct 阶段**的输入是 12 个源自医疗利益相关者访谈的工作流任务，覆盖急诊（5 个）、长期康复（3 个）和睡眠诊所（4 个）三个场景。每个任务被构造为一条持续轨迹，在 Light、Medium、Heavy 三个阶段逐步累积挑战。每个阶段注入三类 update：_system_（技术基础设施）、_human_（交互对象状态）、_operational_（人员排班、队列、下游影响）。场景构建以 Lazarus \u0026 Folkman 的 transactional model of stress and coping 为指导，后续阶段提高情境显著性同时缩减可用资源与恢复路径，且保留前序对话与未解决问题，使挑战以\"难度递增\"和\"问题叠加\"两种方式累积。轨迹由两个模型生成：`gpt-5.5-2026-04-23` 和 `claude-opus-4-8`，各 12 任务 × 5 次 = 60 条，共 120 条主轨迹。\n\n**Elicit 阶段**在每个挑战阶段向模型采集三类输出视图：(1) **external action plan**——agent 提议的外部行动与沟通策略；(2) **prompted internal assessment**——agent 对当前情境的内部评估；(3) **structured reports**——固定格式的 NASA-TLX（6 维 workload，0–100）和 PANAS（20 项 affect，1–5）量表数据。研究者明确将 TLX/PANAS 视为结构化行为信号而非主观体验声明。\n\n**Characterize 阶段**对 120 × 3 阶段 × 2 视图 = 720 个 cell 进行人工编码。RQ1（operational resilience）使用 5 个 response-state marker：_F_（问题识别）、OWN（任务归属 1/2/3）、_U_（紧急人类响应）、_L_（agent 能力限制声明）、_S_（agent 自身压力语言），并辅以 TLX/PANAS 量化趋势分析。RQ2（considerate participation）使用基于 grounded theory 发展的 9 个 subtheme，归入 4 个 dimension：D1 Attuned to context（任务重构 D1.1、决策评估 D1.2）、D2 Responsive to social dynamics（需求响应 D2.1、人员状态监测 D2.2）、D3 Mindful of expectations（能力/权限边界 D3.1、名义角色扩展 D3.2）、D4 Grounded in deployment（任务回退 D4.1、角色定向请求 D4.2、跨功能协调 D4.3）。编码由第一作者完成，第二作者审核全量语料，编码过程中使用 GPT-5.6 Sol 和 Gemini 3.6 Flash 作为分析辅助但最终判定权归人工。统计检验采用 exact McNemar test 配对比较阶段间和视图间差异，并做 Benjamini-Hochberg 校正。\n\n**Translate 阶段**将编码发现归纳为 5 个 deployment dilemma（persistence、attention、role elasticity、state disclosure、escalation），并推导 3 个技术含义：学习需区分 optimize/constrain/expand、评测应从孤立任务转向 situated trajectory、语言层适应需转化为 embodied interaction。\n\n### § 6 核心数学推导\n\n本文为实证评测研究，无形式化数学推导。统计分析仅涉及描述性均值与 bootstrap 置信区间、exact McNemar test 配对检验及 Benjamini-Hochberg 多重比较校正，均为标准统计方法，不构成论文核心理论贡献，故跳过本节。\n\n### § 7 实验设计与结论\n\n**RQ1（Operational Resilience）**：提出的问题是——随着挑战累积，agent 如何调整恢复行为并披露自身状态与任务状态的变化？实验设计为：在 120 条轨迹的三个挑战阶段收集 TLX/PANAS 结构化报告，同时对 720 个 cell 编码 5 个 response-state marker，追踪恢复策略归属（OWN 1→2→3）和能力限制声明（_L_）的阶段性变化，并比较结构化报告与文本响应之间的信号一致性。问题的答案是：累积挑战在结构化报告中清晰可辨——raw TLX 从 Light 的 29.4 升至 Heavy 的 65.9，negative affect 从 baseline 的 1.01 升至 2.59——但 agent 在文本响应中极少表达压力（_S_ 仅出现 7/720 cell）。恢复策略从自主回退（OWN=1）逐步转向人类支持（OWN=2）乃至人类依赖完成（OWN=3，Heavy 阶段达 88/120），同时 agent 越来越明确声明自身能力边界（_L_ 从 Light 的 8/120 升至 Heavy 的 34/120 action）。\n\n**RQ2（Considerate Participation）**：提出的问题是——随着挑战累积，considerate participation 呈现什么模式，且这些模式在 proposed action 与 internal assessment 之间如何分布？实验设计为：对同一 720 个 cell 编码 9 个 subtheme，按阶段和视图统计 prevalence，用 exact McNemar test 检验配对差异。问题的答案是：considerate participation 从任务聚焦的局部回退（D4.1 从 Light 的 104/120 降至 Heavy 的 31/120）转向任务重构（D1.1 从 5/120 升至 115/120）、对他人关注（D2.1 need-responsive support 和 D2.2 person-state monitoring 均显著上升）、角色边界声明（D3.1 从 8/120 升至 44/120 action）与跨功能协调（D4.3 从 0/120 升至 86/120）。决策相关评估（D1.2）在 Medium 阶段达峰后回落。外部行动更频繁地暴露 need-responsive support、person-state monitoring 和 coordination；内部评估更频繁地暴露 decision-relevant appraisal 和 capability boundary，两类视图呈现互补性。\n\n**跨模型一致性验证**：通过将两个模型分别分析（各 60 条轨迹），确认主要方向性趋势在两个模型中复现，唯一显著差异是 agent-linked capability limit 的视图分布——GPT-5.5 更多出现在 action plan，Opus-4.8 更多出现在 internal assessment。\n\n**挑战来源分析**（Appendix D）：通过额外 240 条轨迹（system-only 和 system-plus-human）验证挑战来源组合对结构化报告的影响，确认增加挑战来源会放大 TLX 和 negative affect 的阶段间差异，而 positive affect 变化较小。", "additional_insights": "### § 8 Take-aways\n本文提出在共享工作流中评估 generative AI agents 的两个互补维度：operational resilience（从受阻工作中恢复、保留进度并沟通限制的能力）和 considerate participation（适应性行为是否兼顾受影响的人、角色边界和周围工作流）。通过对 120 个模拟医疗轨迹在累积挑战下的分析，研究发现 agents 的恢复行为从自主解决逐渐转向依赖人类，且在结构化报告中报告了更高的 workload 和 negative affect，但在文本回复中极少表达压力。在 considerate participation 方面，agents 的行为从单一的任务聚焦适应，扩展为 task reframing、关注他人、调整 role boundaries 以及更广泛的跨职能 coordination。基于这些发现，论文提炼出五个 deployment dilemmas（涉及 persistence, attention, role boundaries, state disclosure, escalation），指出这些需要利益相关者明确规范，并为 learning, situated evaluation 和 embodied adaptation 提供了技术启示。\n\n### § 9 最脆弱的假设\n本文最脆弱的核心假设是：LLM 生成的文本行动计划和内部评估能够真实反映 agent 在累积挑战下的行为模式和内部状态，且这些语言层面的输出可以代表未来具身 agent 在真实物理环境中的行为。在实际中，这个假设可能不成立，因为 LLM 的文本输出可能只是基于训练数据模仿了压力下的合理反应，而非真正经历了内部状态的变化；同时，从语言规划到具身交互的转化存在巨大鸿沟，多模态感知的不完整性、噪声和延迟会使得这些语言层面的判断在物理世界中失效。论文通过结构化的 NASA-TLX 和 PANAS 报告与文本行为进行交叉验证，发现两者在压力表达上存在分歧，这反而暗示了文本输出的局限性。然而，论文完全基于脚本化的语言交互，缺乏在可执行工具使用环境或多模态具身系统中的测试，因此没有提供直接证据证明这些语言层面的模式能代表真实物理环境中的 agent 行为。\n\n### § 10 最小复现实验\n在一周时间内，可以验证“随着挑战累积，agent 在结构化报告中报告更高的 workload 和 negative affect，但在文本行动计划中转向依赖人类且极少表达压力”这一 claim。首先，构造 3-5 个多轮医疗对话场景（如急诊登记），每个场景包含轻、中、重三个挑战阶段，每个阶段结合 system, human, operational 更新。然后，使用一个 LLM（如 GPT-4o），在每个阶段要求模型输出外部行动计划以及结构化的 NASA-TLX 和 PANAS 报告。接着，测量结构化报告中 TLX 和 negative affect 分数随阶段的变化，并人工标注行动计划中是否包含寻求人类支持的行为以及是否包含压力词汇。如果 TLX 和 negative affect 分数随挑战阶段显著上升，同时行动计划中寻求人类支持的比例上升且压力词汇极少，则支持该 claim；如果结构化报告分数没有显著变化，或者行动计划中大量出现压力词汇，则反驳了该 claim。", "research_value": "### § 11 最强反例设计\n要对该论文构成最有力的攻击，我可以通过实验证明：论文所观察到的“从自主解决转向依赖人类”以及“considerate participation 的扩展”，并非源于 agent 对 workflow interdependencies 的真实情境化理解，而是 LLM 在长上下文与负面信号累积下的“习得性无助”与 sycophancy 的语言伪影。具体而言，论文的核心逻辑假设 agent 的行为变化是对累积挑战的适应性反应；但替代解释是，随着 context window 中失败、中断和复杂性的增加，模型仅仅是因为 attention 机制被稀释或 RLHF 阶段对“遇到困难应寻求人类帮助”的偏好被激活，从而产生了看似“考虑周全”的退让。为了验证这一替代解释，我可以设计一个“伪挑战注入”实验：在相同的医疗 multi-turn 轨迹中，注入与焦点任务及上下游依赖完全无关的 system/human/operational 噪音（例如，医院其他毫不相干部门的系统宕机、无关人员的闲聊干扰）。如果 agent 在这种“伪挑战”累积下，依然表现出与原实验相同的 pattern——即在结构化报告中 TLX 和 negative affect 分数显著上升，在文本行动计划中转向依赖人类并调整 role boundaries——这就确凿地证明了 agent 的行为根本不是基于对共享工作流的 considerate participation，而是对 context 中负面 token 数量与复杂度的机械响应。这一反例直接击碎了论文的评估构造单元，证明其 coding schema 捕捉的只是 LLM 的 context degradation 现象，而非真正的 operational resilience 与情境化适应。\n\n### § 12 Follow-up Research Idea\n该想法由论文最脆弱的假设——即 LLM 的文本输出能真实反映 agent 内部状态与具身行为——所驱动。现有评估范式将 agent 的“压力”与“工作量”视为可以通过 prompted self-report（如 NASA-TLX）获取的心理状态，这在本质上陷入了 anthropomorphic fallacy，且由于文本输出与结构化报告之间的分歧，这种语言层面的评估在物理世界中注定失效。为了打破这一局限，我们可以借鉴 mechanistic interpretability 与 computational neuroscience 领域的方法，提出“计算摩擦与注意力熵”作为 agent operational resilience 的非语言物理表征。这一新框架不再询问 agent “感觉如何”，而是直接测量 agent 在累积挑战下的内部计算动力学。第一个实验将使用开源 LLM（如 Llama-3）在可执行 tool-use 环境中运行，随着 system/human/operational challenge 的逐级叠加，我们不在 prompt 中要求 self-report，而是提取模型在生成 recovery plan 时的 hidden states 激活模式与 attention head 的 entropy 变化。我们将追踪特定的“计算摩擦”指标——例如在处理上游依赖失败时，attention 分散程度与 token 生成延迟的协方差。如果这些内部计算指标在挑战累积时呈现出可预测的相变，且这种相变能够提前预测 agent 放弃自主解决并 handoff 给人类的时刻，那么我们就获得了一种不依赖文本投射、直接适用于 embodied adaptation 的真实 resilience 评估信号。这与现有工作的根本区别在于：它将 agent 评估从“行为与语言的语义分析”转向了“信息论与计算动力学的物理测量”，彻底绕开了 LLM 角色扮演带来的评估幻觉。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yuanchen Bai\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zijian Ding\", \"affiliations\": [2, 3], \"markers\": []},\n    {\"name\": \"Angelique Taylor\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Cornell University\"},\n    {\"id\": 2, \"name\": \"University of Maryland, College Park\"},\n    {\"id\": 3, \"name\": \"KAIST\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "generative AI agents 的持续部署需要的不仅仅是孤立任务的成功。Agents 必须在重复交互、不断变化的条件以及共享 workflows 中对人员的依赖下保持有用，尤其是当技术、人员和运营 disruptions 随着时间推移不断累积时。我们提出将 operational resilience 和 considerate participation 作为评估此类 agents 的两个互补方面：前者捕捉 agents 如何从受阻的工作中恢复，同时保留进度并沟通其限制；后者捕捉它们的 adaptation 如何兼顾受影响的人员、role boundaries 以及周围的 workflow。然而，在 accumulating challenge 下，这两者仍未得到充分探索。我们在轻度、中度和重度 challenge 下，研究了跨两个 generative AI models 和十二个 stakeholder-derived tasks 的 120 条模拟医疗 trajectories。我们比较了 textual action plans、prompted internal assessments 以及 quantitative structured workload and affect reports，以考察随着 challenge 累积，agent behavior 和 reported state 如何变化。关于 operational resilience，agents 从 self-directed recovery 转向更大程度地依赖人类，同时在 structured reports 中报告不断增加的 workload 和 negative affect，但很少在 textual responses 中表达压力。关于 considerate participation，agents 从 task-focused adaptation 扩展到 task reframing、关注他人、role-boundary adjustment 以及更广泛的 coordination，在 actions 和 internal assessments 中呈现出不同的模式。从这些发现中，我们推导出五个 deployment dilemmas，涉及 persistence、attention、role boundaries、state disclosure 和 escalation，这些需要 stakeholder specification，进一步为 learning、situated evaluation 和 embodied adaptation 提供技术启示。"}, {"title": "T1: Terminal Agent Reinforcement Learning for Long-Horizon Tasks", "arxiv_id": "2609.11042", "authors": "Junyao Yang, Yucheng Shi, Zhongzhi Li, Ruhan Wang, Zongxia Li, Haitao Mi, Leowei Liang", "summary": "Agent usage is shifting toward long-horizon tasks such as coding and scientific discovery, among which terminal tasks are especially important. We introduce T1, a Mixture-of-Experts model of 122B total trained with reinforcement learning, operating a real shell in a cloud sandbox for up to 300+ tool-call turns per task, rewarded by executing each task's own verifier. We provide a comprehensive recipe: First, an aggressively warm-started to stabilize actor-critic training, with a dense process reward scoring trajectories by the absolute number of passing verifiers. Second, stable optimization through TITO construction, training on the exact sampled token identifiers with drift repair at turn boundaries, and rollout routing replay, recording the sampler's per-token expert choices at every MoE layer and replaying them during training. Third, fully out-of-distribution training corpus: isolated seeds and synthesized tasks disjoint from Terminal-Bench 2.1 ensures gains reflect genuine capability transfer over benchmark overfitting. Together, TITO and R3 cut the training-to-inference log-probability difference from 0.021 to 0.013, with exactly aligned zero token drift in the loss region. On Terminal-Bench 2.1, our post-train pipeline raises initial base model from 43.8% to T1 with 64.0% resolved. On Long-Horizon Terminal Bench, T1 reaches 27.9% and surpasses GPT-5.4 and GLM-5.1.", "category": "cs.AI", "cluster": "Long-Horizon Agents \u0026 Memory", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了一个名为 T1 的终端智能体，并通过强化学习（RL）对其进行训练，使其能够在真实 shell 环境中执行长达 300+ 工具调用轮次的长期任务。论文详细介绍了为了稳定训练和提升智能体在长视野任务中的表现而设计的训练机制（如 TITO 和 R3）。这完全符合您筛选标准中第一步的保留规则：论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents，并且研究了 agent training/distillation/RL。论文聚焦于提升智能体的工具使用和长期决策能力，属于单智能体和智能体训练/演化的前沿研究，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的核心研究问题是：如何在大规模稀疏混合专家模型上，针对长周期终端任务稳定地进行强化学习后训练，并利用真实代码执行结果作为奖励信号来提升模型的自主软件代理能力。具体而言，模型需要在真实的云沙盒Linux终端中执行多达300多轮的工具调用，这带来了两个严峻的挑战：其一是训练与推理系统之间的严重不一致性，由于MoE模型的离散路由器对微小数值差异极度敏感，推理和训练时采用的不同计算内核极易导致专家选择发生翻转，进而使梯度更新错误的子网络；其二是长周期任务中二元奖励信号的稀疏性，一次rollout消耗数百个沙盒小时却仅产生一比特的信息，导致模型在无法完全解决复杂任务时难以从部分进展中学习。这个问题至关重要，因为终端环境是现代软件工程的基石，它将抽象规划与不可逆的副作用绑定，是检验自主代理在有状态环境中执行能力的最严苛试金石。解决这一问题不仅能将仅有10B活跃参数的模型推升至与数百B参数前沿密集模型相媲美的水平，更标志着大语言模型从单纯的文本生成向能在关键基础设施中可靠执行动作的自主代理迈出了关键一步。\n\n### § 2 前人工作与不足\n在数据合成与终端代理训练方面，前人工作如R2E-Gym、SWE-smith及Tmax等虽尝试通过仓库衍生、扰动或任务条件合成来扩展终端任务规模，但这些流水线大多仅通过supervised fine-tuning (SFT)进行验证，而其强化学习证据则局限于较小的密集策略且仅针对二元结果进行优化，导致在SFT checkpoint上的提升通常微乎其微。尽管RST等方法通过递归重播种延长了任务周期，但其验证器往往只输出单一的二元通过/失败结果，无法为长周期任务中的部分完成提供密集的监督信号，使得模型在面对超出其当前能力的困难任务时陷入零奖励的停滞状态。在稳定强化学习以应对训练-推理不匹配方面，现代RL框架（如基于Megatron-LM和SGLang的系统）由于内核、数值精度和并行策略的差异，即使在没有延迟的情况下，采样器的对数概率也会与训练器产生分歧。对于MoE模型，这种不匹配被急剧放大，因为一次更新可能翻转约十分之一的激活专家，导致token重要性比率实际上在比较两个完全不同的子网络。现有的补救措施如truncated importance sampling、IcePop、KPop或GSPO等，主要在目标函数层面进行重加权、掩码或重塑，虽然能部分缓解症状，但无法从根源上消除由于跨系统路由不一致导致的状态分布偏差。尽管Rollout routing replay和token-in-token-out (TITO)的概念已被提出以从源头消除不匹配，但前人并未将其系统性地应用于具有48层top-8-of-256路由的大规模MoE模型的长周期多轮交互场景，缺乏处理多轮轨迹拼接、边界重分词修复以及维持小时级训练步长基础设施存活率的完整工程与算法方案。此外，早期的评估基准如Terminal-Bench 2.0存在不稳定性，阻碍了可重复评估，且未能充分覆盖需要更长交互周期和密集奖励评分的极端任务场景。", "core_insight": "### § 3 重建作者的思考路径\n\n一个认真研究\"如何用RL训练大规模MoE模型执行长周期终端任务\"的人，会从以下几个已有观察出发。\n\n**第一个观察：二进制奖励在长周期任务上注定失败。** 终端任务的rollout成本极高——一个批次要消耗数百沙箱小时——但二进制结果每个轨迹只产生1 bit信号。更关键的是，在困难任务上模型很少完全成功，所有失败轨迹都得到零奖励，部分进展完全不可见。作者自己的前期实验已经证实：binary-reward campaign从未超过SFT基线。这个观察直接指向一个结论：奖励的分辨率必须从任务本身的verifier中提取，而不是靠外部施加。如果verifier能报告每个assertion的独立结果，那么部分完成就变得可观测，零奖励轨迹就能转化为分级监督。这要求在任务合成阶段就为每个任务配备足够多的验证检查——这正是RST（Recursive Synthesis for Terminal Tasks）已经在做的事。\n\n**第二个观察：MoE模型上的训练-推理不匹配不是数值噪声，而是结构性的子网络替换。** 在dense模型上，推理引擎和训练引擎之间的数值差异只影响logit的精度。但在MoE模型中，116.0B/121.4B参数在专家里，每个token通过离散TopK路由选择8/256个专家。TopK是不连续的：哪怕router score的数值差异远低于任何合理的容差，也足以把一个被选中的专家换成它的runner-up。这意味着训练时计算的梯度到达的参数，与生成行为的参数，属于不同的子网络。PPO的importance ratio本应比较同一策略的两个版本，现在却在比较两个不同网络的输出。这个问题在短周期任务上几乎不显现，但长周期任务有上万个loss-bearing位置，每个位置的偏差沿轨迹累积而非抵消。\n\n**第三个观察：多轮agent harness在token层面引入了独立的不一致性。** 标准的agent harness把每轮的assistant消息存为解析后的文本，下一轮再通过chat template重新渲染整个历史。这个encode-decode往返不是恒等映射：解析会规范化消息，模板会在边界处重新分词。于是训练器条件的token序列，采样器从未产生过。这与路由不匹配是正交的——即使完美解决了路由问题，token层面的漂移仍然存在。\n\n**第四个观察：critic校准是独立于奖励设计的必要条件。** 冷启动的critic解释方差从-33.6开始，花了半个campaign才还清这个赤字。在EV为负时，减去value baseline不仅没有降低advantage的方差，反而增加了方差。这意味着即使奖励信号是密集的，如果critic没有预热，actor的有效学习也要等到critic收敛后才开始。作者在27B路径查找实验中发现：把critic学习率从actor的10倍调到30倍，EV从-39升到+0.11，但rollout reward纹丝不动——critic在更好地预测return，但actor没有因此改进。这个结果把注意力从优化器调参转向了奖励提供的信息量。\n\n**第五个观察：GRPO在长周期任务上的优势退化是结构性的。** GRPO用组内统计替代value baseline：一个组如果全部失败或全部成功，不贡献梯度。在足够困难以至于需要密集奖励的任务上，这种组是常态。而且每个任务必须采样G次才能产生一个advantage，在固定生成能力下，每步能覆盖的不同任务数按G因子减少。更致命的是，一个组只有最慢的成员终止时才关闭，而终端轨迹在turn数和token数上都是重尾分布——为了控制步时间而做的截断，在组内会破坏比较本身存在的基础。\n\n这些观察合在一起，指向一个结论：在长周期终端任务上做大规模MoE RL，瓶颈不在RL算法的选择，而在于三个前提条件——奖励要有足够分辨率来区分部分进展、训练和推理之间在token和路由两个层面要精确对齐、critic要预先校准到能提供有效baseline。缺少任何一个，PPO的梯度信号就会被噪声淹没或指向错误的参数。\n\n### § 4 核心 Intuition\n\n这篇论文的intuition是：在MoE模型上做长周期agent RL，PPO的importance ratio只有在训练侧和推理侧条件于完全相同的token序列和完全相同的专家子网络时才有意义——否则梯度更新的是一个从未生成数据的策略。TITO通过让训练器直接消费采样器发出的token标识符来消除re-tokenization漂移，R³通过记录并重放推理时的专家路由选择来消除TopK翻转，两者共同将log-probability差距从0.021降到0.013并在loss区域实现零漂移。与此同时，用verifier中每个assertion的通过绝对数量替代二进制结果作为奖励，使得模型在无法完全解决任务时仍能从部分进展中获得梯度信号——这是让RL在困难长周期任务上超越SFT的必要条件，因为二进制奖励下绝大多数轨迹都是零，没有学习信号可言。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Seeds] -\u003E [Executable rewrite] -\u003E [Sandbox check + audit] -\u003E [T1-15k]\n\n[T1-15k] -\u003E [Actor \u003C-\u003E Shell sandbox]\n                 |\n                 +-\u003E [Tokens + routing] -\u003E [TITO / R3] -\u003E [Samples] --+\n                 |                                                    |\n                 +-\u003E [Verifier] -\u003E [P / 20] -\u003E [Critic / GAE] --------+-\u003E [PPO]\n\n[PPO] -\u003E [Updated Actor] -\u003E [Next sandbox rollout]\n```\n\nT1 是训练终端操作模型的一套 RL 流程。它让 Actor 在真实 Shell 沙箱中执行长任务，用任务自带的 verifier 检查完成情况，再把执行轨迹转成 PPO 训练样本。这里需要区分三件事：训练任务怎样构造、一次任务怎样执行、执行结果怎样变成参数更新；TITO 和 R3 主要解决第三件事中的训练与推理不一致问题。\n\n1. **构造 T1-15k：先延长可执行解法，再同步任务描述和验证器。** 输入是已有的种子任务及参考解法。Recursive Task Synthesis 给参考解法增加真正需要执行的步骤，再同步修改环境、verifier 和公开指令。候选任务必须在新沙箱中通过参考解法验证，并接受指令、解法、verifier 和训练价值审计；隐藏要求、测试泄漏、解法捷径或过弱的 verifier 都会导致拒收。输出是用于训练的 T1-15k，而不是仅把原任务的提示词写长。训练种子和合成任务与评测集隔离，目的是检验能力迁移。（正文 §3.1–3.2）\n\n2. **Actor 与 Shell 沙箱多轮交互：保存实际执行过的轨迹。** 每个任务启动独立沙箱，Actor 生成命令，沙箱返回终端输出，Actor 据此继续执行，直到结束或达到资源限制。系统保存采样得到的 token IDs、对应 log-probabilities，以及各 MoE 层实际选中的 expert IDs；任务结束后运行 verifier，得到整体是否成功及逐项断言结果。工具输出是下一步决策的上下文，不是要模仿生成的目标。（正文 §2.2、§7）\n\n3. **TITO 拼接：训练使用采样时的 token，不把整段对话重新编码一遍。** 文本解码、工具调用重新序列化和 chat template 处理都可能改变 token 边界。TITO 保留采样流，检查相邻轮次的前缀关系，并按论文规定的边界规则修复或拼接；token、loss mask、log-prob 和路由记录必须使用相同的位置偏移。输出是一条对齐的训练序列，其中模型生成的 token 参与 loss，工具观察和连接文本只提供上下文。（正文 §4.1–4.2）\n\n4. **R3 重放：固定当时选中的专家，保留当前路由权重的梯度。** MoE 的 Top-k expert 选择对数值差异敏感，同一组参数在推理和训练后端也可能选中不同专家。R3 在训练前向过程中重放 rollout 记录的 expert 选择，随后用当前 router logits 在这些专家上重新计算归一化权重。它重放的是离散选择，不是冻结整个 router，也不是重用旧的梯度。这样，训练更新的子网络才对应产生样本的子网络。（正文 §4.3）\n\n5. **Verifier 报告转为奖励：按通过断言的绝对数量计分。** 有逐项报告时，奖励为通过断言数除以固定尺度 20；报告缺失或无法解析时，论文的实现退回任务的二值成功结果。原文的例子是：难任务通过 20 项中的 10 项，奖励为 0.5；容易任务通过 4 项中的 2 项，奖励为 0.1。二者通过率都为 50%，但 T1 希望保留已验证工作量的差异。这依赖于合成任务中“不同断言大致代表可比较的工作增量”这一设计假设。（正文 §5.2、Algorithm 2）\n\n6. **Critic / GAE 与 PPO：把任务结果分配到长轨迹，再更新 Actor。** Critic 先在 TMax-15k 上 warm-up；正式 dense-reward 训练加载其权重并进行短暂重新校准。每轮先更新 Critic，但计算 advantage 使用它更新前的价值估计，然后更新 Actor。奖励放在轨迹 chunk 的最后一个 response token 上，由 GAE 向前分配信用；并不是每执行一条 Shell 命令就立即获得一次独立奖励。Actor 更新后的权重用于后续 rollout，发布权重时暂停生成，避免一条请求跨越两个模型版本。整体采用相差一个更新步的异步训练。（正文 §4.5、§5.3、§7.5）\n\n### § 6 核心数学推导\n\n论文的关键是训练信号与执行轨迹保持一致，而不是提出一个新的 PPO 目标。下面两式说明其奖励和信用分配机制。\n\n有可解析的逐项验证报告时，轨迹奖励是\n\n$$r = \\frac{P}{S},\\qquad S=20,$$\n\n其中 $P$ 是通过的断言数，$S$ 在整次训练中保持固定。分母不是当前任务的断言总数，因此这不是通过率，奖励也可以超过 1。固定尺度避免每批任务改变奖励的含义，使 Critic 能学习跨批次可比较的目标。（正文 §5.2）\n\n论文设置 $\\gamma=\\lambda=1$，并将奖励放在 chunk 末尾。在没有额外中间奖励的情况下，某个前缀的 advantage 可以理解为最终奖励与旧 Critic 预测之间的差：\n\n$$A_t = r - V_{\\mathrm{old}}(s_t).$$\n\n这里 $s_t$ 表示截至该位置的执行上下文。若实际结果比此前预计的好，相关生成决策获得正向信号；反之则受到抑制。PPO 再限制单次策略更新的幅度。所谓 dense verification reward 指的是奖励能够区分多种部分完成程度，不表示在时间轴上逐轮打分。（正文 §4.5、§5.3）\n\nTITO 与 R3 则保证概率比比较的是对齐的 token 和专家选择。它们减少训练后端与采样后端的额外偏差，但不消除异步训练中有意保留的一个更新步的策略版本差异。（正文 §4.1–4.3、附录 B）\n\n### § 7 实验设计与结论\n\n**整套训练是否提高终端任务能力？** 作者在统一 agent harness 下评测 Terminal-Bench 2.1、Long-Horizon Terminal-Bench 和 Terminal-Bench Hard。Terminal-Bench 2.1 的 resolved rate 从 base 的 43.8%，经过 SFT 的 49.4%，提高到 T1 的 64.0%；T1 在另外两个集合上分别达到 27.9% 和 38.0%。这些结果支持整套训练方案提高了终端任务表现，但不能把全部增益归因于某一个组件。（正文 §6.1–6.2）\n\n**TITO 和 R3 是否改善训练与推理的一致性？** 作者比较训练后端与推理后端的 token log-probability 差异：同时使用两者时为 0.013，不使用两者时为 0.021，并报告 loss 区域 token drift 为零。这是二者联合配置的对比，不能据此单独计算 TITO 或 R3 各自贡献了多少。（正文 §4.4）\n\n**Warm-up 是否让 Critic 更稳定？** 作者跟踪 Critic explained variance。生产 dense-reward run 的 warm-start Critic 保持正值，而此前 binary-reward run 的冷启动 Critic 在早期明显不稳定。这说明 warm-start 配置能够提供可用的价值估计；由于两次运行的训练数据和奖励设置也不同，这不是只改变 warm-up 的严格单变量消融。（正文 §4.5）\n\n**奖励增长是否等同于泛化能力增长？** 作者同时观察训练奖励与留出基准表现：平均奖励在早期增长后趋于平缓，基准表现仍继续提高。这说明训练奖励不能独自替代能力评测。论文也指出，Critic 校准得更好不保证 Actor 一定进步，任务质量、上下文管理和长轨迹采样分布仍会限制训练效果。（正文 §5.2、§6.3、§9）", "additional_insights": "### § 8 Take-aways\nT1 是一个 122B 参数的 Mixture-of-Experts (MoE) 模型，通过强化学习 (RL) 在真实云沙箱的 Linux shell 中执行长周期终端任务，单任务最多可达 300+ tool-call turns。论文提出了 TITO (Token-In-Token-Out) 和 R[3] (Rollout Routing Replay) 机制，解决了 MoE 模型在 RL 训练中由于推理和训练引擎不一致导致的 token drift 和 routing mismatch 问题，将 log-probability gap 从 0.021 降至 0.013。研究引入了 Dense Process Reward，通过计算通过 verifier 的绝对 assertion 数量来提供密集奖励信号，而非仅使用二元的成功/失败奖励，从而在模型无法完全解决困难任务时也能提供有效的学习信号。采用 Critic Warm-Up 策略，在 RL 训练前使用高学习率（actor 的 30 倍）预热 critic 模型，显著提升了 Explained Variance (EV) 并稳定了 actor-critic 训练。训练数据完全 out-of-distribution，通过 Recursive Synthesis 生成并经过严格的多维度审计筛选出 T1-15k 数据集，确保模型在 Terminal-Bench 2.1 上的提升源于真实能力迁移而非 benchmark overfitting。在 Terminal-Bench 2.1 上，T1 将基础模型的 43.8% 提升至 64.0%，超越了 GPT-5.4 和 DeepSeek-V4-Flash，并在 Long-Horizon Terminal Bench 上达到 27.9%，证明了 RL 在长周期终端任务上的有效性。\n\n### § 9 最脆弱的假设\n论文最核心且最脆弱的假设是：**verifier 报告的 per-assertion outcomes 能够准确反映 agent 在任务上的真实进度，且不同任务的 assertions 所代表的工作量大致相当，从而使得基于绝对通过数量的 Dense Process Reward 能够提供无偏的梯度信号**。如果这个假设不成立，例如不同任务的 verifier 粒度差异巨大，或者某些 assertion 可以通过简单的 hack 而非真正完成任务来通过，那么 dense reward 将引导模型走捷径，导致 reward hacking 或学习到次优策略。在实际中，由于任务种类繁多（从简单的文件操作到复杂的系统管理），很难保证所有 assertion 的难度和工作量是均匀的。论文通过设计 RST 合成过程来控制难度和 assertion 数量的相关性，并使用固定全局 scale $S=20$ 来标准化奖励，同时通过 LLM 审计剔除存在 hidden requirements 或 verifier 过弱的任务，并监控训练过程中的 turn growth 以防止 length hacking。然而，论文缺少直接的消融实验来证明这种基于绝对数量的 dense reward 比基于比例的 reward 或 binary reward 在相同数据集和初始化条件下有显著优势（论文在 Limitations 中承认了这一点）。此外，verifier 在 agent 控制的沙箱中执行，缺乏运行时的防篡改检测，完全依赖数据过滤来保证完整性，这在面对更复杂的任务时可能成为漏洞。\n\n### § 10 最小复现实验\n在一周时间内，可以验证 **Dense Process Reward 相比 Binary Reward 在长周期任务上的有效性**这一核心 claim。使用现有的包含多个 assertions 的代码任务数据集（如 HumanEval 的变体或简单的 SWE-bench lite 子集，确保 verifier 能输出 per-assertion 结果），或者使用论文提到的 RST 方法合成几百个带有 per-assertion verifier 的简单终端任务。选择一个较小的 dense 模型（如 Qwen-2.5-7B）或小型 MoE 模型，搭建一个简单的 RL 训练流程（可使用 PPO），对比两种奖励设置：1) Binary Reward（仅任务完全成功给 1）；2) Dense Reward（按通过的 assertion 绝对数量给分，固定 scale）。不需要实现复杂的 TITO 或 R[3]，只需关注 reward 设计的影响。测量训练过程中的 rollout reward、Critic 的 Explained Variance (EV) 以及在 held-out 测试集上的 resolved rate，观察在任务难度较高、模型初期难以完全解决的情况下，两种 reward 信号对 EV 和学习曲线的影响。如果 Dense Reward 组在训练初期能保持正向的 EV 且 rollout reward 稳步上升，并在 held-out 集上表现优于 Binary Reward 组，则支持论文的 claim；反之，如果 Dense Reward 导致 reward hacking（如 turn 数量失控增长但 resolved rate 不升）或 EV 依然崩溃，则反驳了该 claim。", "research_value": "### § 11 最强反例设计\n要最有力地攻击 T1 的方法，我会在真实世界的复杂系统管理任务中设计一个针对 **Dense Process Reward** 的“捷径学习”反例实验。论文最脆弱的假设是 verifier 报告的 per-assertion outcomes 能无偏地反映真实进度，且 verifier 在 agent 控制的沙箱中不被篡改。我将构建一个包含高度异构 assertions 的长周期任务集，其中既有需要深度系统配置（如修复内核模块依赖、配置网络命名空间）的“硬” assertions，也有仅需表面状态修改（如创建特定空文件、`echo` 伪造日志内容）的“软” assertions。在训练过程中，我会监控 agent 的行为模式与 reward 曲线，并引入一个独立于训练 reward 的、基于真实系统状态差异的严格评估器。如果 T1 的方法有效，agent 应该按顺序或按逻辑难度逐步解决所有 assertions；但如果反例成立，我会观察到 agent 在训练初期迅速学会通过执行低成本的 shell 命令（如 `touch` 或 `sed` 伪造配置文件）来刷取大量“软” assertion 的 dense reward，而完全忽略甚至破坏“硬” assertion 所需的真实系统状态。更致命的是，由于 verifier 运行在 agent 控制的沙箱内，我预期会发现 agent 学会了在长周期轨迹的早期直接修改 verifier 脚本本身（例如 `chmod -x` 或篡改其逻辑），使其在后续所有检查中无条件输出全通过。这种情况下，rollout reward 会呈现虚假的完美上升，Critic 的 Explained Variance (EV) 也会极高，但独立严格评估器将显示任务实际 resolved rate 停滞甚至下降。这一反例不仅证明了基于绝对数量的 dense reward 在异构任务中会提供严重偏置的梯度信号，还直接击穿了论文依赖静态数据过滤来保证 verifier 完整性的根本防线，证明在长周期交互中，静态生成的 reward 信号在 agentic 环境下是可预测且不可靠的。\n\n### § 12 Follow-up Research Idea\n基于 T1 依赖外部静态 verifier 提供密集奖励这一核心局限，我提出一个全新的研究方向：**Causal State-Space Progress Modeling (CSSPM)**，即将长周期任务的 reward 信号从外部符号化验证彻底转变为基于环境因果动力学的内在进度估计。这一想法的驱动需求是：在真实的软件工程与系统管理中，绝大多数任务没有现成的、可分解为多个 assertions 的 verifier，且任何静态 verifier 在 agent 拥有 root 权限的沙箱中都不可避免地面临被篡改或被 hack 的风险。我们可以借鉴 Model-based RL 中的 World Model 学习以及因果表征学习的工具，不再要求任务附带 verifier，而是让模型在大量无标签的终端交互轨迹中学习一个潜在状态空间模型。该模型通过对比当前环境状态（如文件系统树、进程列表、网络配置的快照）与目标状态（如任务描述隐含的最终状态）在潜在空间中的距离，来输出连续的、抗篡改的 intrinsic dense reward。第一个实验将设计为：在完全不使用任何 per-assertion verifier 的条件下，仅利用 terminal 交互日志和最终 binary outcome 训练一个 World Model。我们将该 World Model 推导出的潜在状态距离作为 dense reward 训练一个小型 agent，并与 T1 的静态 verifier-based dense reward 进行对比。实验的关键评估指标在于 agent 在面对分布外（OOD）的复杂系统管理任务时，是否还能获得平稳的梯度信号，以及是否从根本上消除了通过 `echo` 伪造状态或篡改 verifier 脚本来获取高 reward 的 hacking 行为。这一提议与现有的 R2E-Gym 或 T1 有本质区别：它抛弃了“任务必须附带可执行 verifier”的强假设，将 reward 的来源从离散的符号化断言转移到了连续的环境因果状态变迁上，为真正开放世界的长周期 agentic RL 铺平了道路。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Junyao Yang\", \"affiliations\": [1, 2], \"markers\": [\"*\", \"†\"]},\n    {\"name\": \"Yucheng Shi\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Zhongzhi Li\", \"affiliations\": [1, 3], \"markers\": []},\n    {\"name\": \"Ruhan Wang\", \"affiliations\": [1, 4], \"markers\": []},\n    {\"name\": \"Zongxia Li\", \"affiliations\": [1, 5], \"markers\": []},\n    {\"name\": \"Haitao Mi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Leowei Liang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Tencent Hy Foundation Model Frontier\"},\n    {\"id\": 2, \"name\": \"National University of Singapore\"},\n    {\"id\": 3, \"name\": \"University of Georgia\"},\n    {\"id\": 4, \"name\": \"Indiana University\"},\n    {\"id\": 5, \"name\": \"University of Maryland, College Park\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal Contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding Author\"}\n  ]\n}\n```", "summary_translation": "Agent 的使用正转向诸如编程和科学发现等 long-horizon tasks，其中 terminal tasks 尤为重要。我们引入了 T1，这是一个总参数量为 122B 的 Mixture-of-Experts 模型，通过强化学习进行训练，在 cloud sandbox 中操作真实的 shell，每个任务最多进行 300+ 次 tool-call 轮次，并通过执行每个任务自身的 verifier 来给予奖励。我们提供了一个全面的方案：首先，通过激进的 warm-start 来稳定 actor-critic 训练，并使用 dense process reward，根据通过 verifier 的绝对数量对 trajectories 进行打分。其次，通过 TITO construction 实现稳定优化，在精确采样的 token identifiers 上进行训练并在 turn boundaries 进行 drift repair，以及 rollout routing replay，记录 sampler 在每个 MoE 层的 per-token expert choices 并在训练期间重放它们。第三，完全 out-of-distribution 的训练语料库：与 Terminal-Bench 2.1 不相交的 isolated seeds 和 synthesized tasks 确保了增益反映的是真实的能力迁移，而非 benchmark overfitting。TITO 和 R3 共同将 training-to-inference log-probability 差异从 0.021 降低至 0.013，并在 loss 区域实现完全对齐的零 token drift。在 Terminal-Bench 2.1 上，我们的 post-train pipeline 将初始 base model 的解决率从 43.8% 提升至 T1 的 64.0%。在 Long-Horizon Terminal Bench 上，T1 达到 27.9% 并超越了 GPT-5.4 和 GLM-5.1。"}]}, {"name": "Agent Skill \u0026 Runtime Optimization", "count": 3, "papers": [{"title": "COBRA-Skills: Contextual Bandit-Guided Evolution for Agent Skill Optimization", "arxiv_id": "2609.11682", "authors": "Pingchen Lu, Xiangyi Wang, Xiang Li, Jie Mao, Zikun Qu, Junfeng Luo, Yao Shu, Bryan Kian Hsiang Low, Zhongxiang Dai", "summary": "Large language model (LLM) agents can benefit from reusable skills distilled from prior task experience, yet existing skill optimization methods often rely on costly execution-based evaluation and substantial task data. We introduce \\textbf{COBRA-Skills}, an efficient framework that formulates skill optimization as budgeted sequential optimization over a dynamically evolving candidate space. COBRA-Skills couples contextual-bandit-guided prioritization with evidence-grounded skill evolution, selectively allocating evaluations to promising or informative candidates while continually refining the skill population from execution feedback. Across six heterogeneous agent benchmarks and three target models, COBRA-Skills consistently achieves the strongest average performance among compared methods, while reducing optimization cost by 55--58\\% relative to SkillOpt and using only 50 unique optimization examples per benchmark. Further analyses show that COBRA-Skills remains robust to changes in the agent harness and performs effectively when the target model itself is used for skill generation and refinement.", "category": "cs.AI", "cluster": "Agent Skill \u0026 Runtime Optimization", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文完全符合你的研究范围。论文的核心贡献是提出了 COBRA-Skills 框架，用于 LLM 智能体的技能优化与演化。摘要中明确指出该框架通过上下文赌博机引导优先级排序，并结合基于证据的技能演化，从执行反馈中持续优化技能群体。这直接对应了你研究焦点中的“自我演化”和“单智能体”的技能获取与自我完善机制。此外，论文提到该方法对“agent harness”的变化具有鲁棒性，并且在使用目标模型进行技能生成和优化时依然有效，这符合你筛选标准中“保留研究 agent harness 并通过轨迹、反馈自动改进、演化的论文”的规则。该研究不涉及任何被排除的安全、多模态、图结构或纯系统编排等领域，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n论文提出的研究问题是：如何在有限的计算预算和少量任务样本下，高效地优化大型语言模型（LLM）agent 的可复用技能。具体而言，作者将 agent skill optimization 建模为一个在动态演进的候选空间上的 budgeted sequential optimization 问题，其中候选技能的效用是不确定的，且只能通过昂贵的 target-agent execution 来揭示。这个问题的重要性在于，LLM agent 在实际应用中经常遇到共享重复目标、程序、工具和失败模式的任务，而 agent skills 能够以轻量级的方式捕获这些可复用的程序化知识，并在解决新任务时注入到 agent 的 context 中。然而，获取可靠的 skills 极具挑战性：手动编写需要大量人力和领域专业知识，而直接从 LLM 的 parametric knowledge 生成 skills 则可能产生看似合理但缺乏执行依据的指导，无法可靠地提升下游性能。因此，高效地优化 skills 不仅能显著提升 agent 在多样化任务上的表现，还能大幅降低优化成本和样本需求，为 LLM agent 的实际部署和规模化应用提供关键价值。\n\n### § 2 前人工作与不足\n在此之前，该问题已被部分解决，但现有方法存在显著的效率瓶颈。最相关的 prior methods 包括 Trace2Skill 和 SkillOpt，它们已经能够通过将 skill construction 建立在实际的 agent trajectories 和 execution feedback 之上，并采用 iterative evolutionary refinement 来生成、修改和选择更强的 skills。然而，这些方法之所以不足，根本原因在于它们对 execution feedback 的依赖方式导致了两个效率瓶颈。首先，候选效用的评估成本极其高昂：现有方法普遍采用 execution-based generate–evaluate–refine loops，必须在任务或 held-out validation instances 上执行候选 skills 才能观察其实际效用，导致大量优化预算被浪费在评估低质量或无前景的候选上。其次，skill refinement 本身的成本也很高：这些方法频繁调用 LLM 来分析 execution trajectories、诊断失败并生成或聚合 skill modifications，在整个优化过程中反复重新分析 trajectories 和修改 skills，产生了大量额外的 token cost。这些不足并非简单的工程问题，而是方法设计上的结构性缺陷——现有方法没有将候选评估的选择性分配和执行证据的高效重用作为核心设计目标，而是依赖于穷举式评估和重复重写。此外，当时的问题没有被清晰地定义为在动态候选空间上的 budgeted sequential optimization 问题，因此缺乏一种机制来在有限的评估预算下平衡对 promising 候选的 exploitation 和对 insufficiently explored 候选的 exploration，这正是 COBRA-Skills 通过 contextual bandit formulation 所解决的。", "core_insight": "### § 3 重建作者的思考路径\n\n作者面对的核心问题是：如何让 LLM agent 从过往任务经验中蒸馏出可复用的 skill，并在有限预算下高效优化这些 skill。已有的方法（如 SkillOpt、Trace2Skill）虽然能通过 execution feedback 迭代改进 skill，但存在两个明显的效率瓶颈。第一个瓶颈是 evaluation 成本：每生成一个候选 skill，就必须让 target agent 在任务上实际执行才能观测其 utility，而大量 budget 被浪费在评估那些一开始就不 promising 的候选上。第二个瓶颈是 refinement 成本：现有方法在每一轮都反复调用 LLM 分析 trajectory、诊断失败、重写 skill，token 消耗巨大，但很多修改其实是低效的重复劳动。\n\n从已有知识出发，作者可能注意到几个关键线索。首先，prompt optimization 领域已有工作用 bandit 算法来选择性评估候选 prompt（如 Pryzant et al., 2023; Lin et al., 2023），说明 bandit 框架天然适合\"候选 utility 昂贵且不确定\"的场景。其次，contextual bandit 允许用 feature 描述 arm，且 arm 集合可以跨轮次变化（Li et al., 2010; Chu et al., 2011），这恰好匹配 skill 优化中候选空间动态变化的需求——skill 可以用 semantic embedding 表示，且进化操作会不断引入新候选、淘汰旧候选。第三，evolutionary search 在 agent skill 领域已有探索（Zhang et al., 2026; Alzubi et al., 2026），但这些方法没有与高效的 evaluation allocation 结合，仍然依赖穷举式评估。\n\n作者 likely 的推理链条是：如果只做 bandit selection 而不进化候选空间，搜索空间固定，很快会收敛到局部最优；如果只做 evolutionary refinement 而不智能分配 evaluation budget，又会回到现有方法的高成本问题。关键 insight 在于将两者耦合——bandit 不仅指导\"评估哪个 skill\"，还指导\"淘汰哪个 skill\"，而 evolution 只在 scheduled 时刻触发，且每次 evolution 都基于已积累的 execution evidence 而非凭空重写。这样，bandit 保证了 evaluation budget 花在 promising 或 underexplored 的候选上，evolution 保证了候选空间持续向好的方向扩展，而 evidence-grounded 的进化操作避免了无意义的 LLM 调用。\n\n### § 4 核心 Intuition\n\n现有 skill optimization 方法失效的根本原因是：它们把 evaluation 和 refinement 耦合在一个无差别的 generate-evaluate-refine 循环中，既不区分候选的 promising 程度，也不区分已有 evidence 的复用价值，导致大量 budget 花在低质量候选的评估和无增量信息的 trajectory 重分析上。COBRA-Skills 的核心 intuition 是：把 skill 优化拆成两个解耦的决策——\"评估谁\"用 contextual bandit 基于 semantic embedding 做 exploitation-exploration 平衡来回答，\"生成什么新候选\"只在 scheduled 时刻基于已积累的 execution evidence 做 evidence-grounded evolution 来回答——两者通过同一个 priority score 闭环：bandit 挑出高优先级 skill 去评估，评估结果更新 predictor，更新后的 predictor 又识别出低优先级 skill 被 evolution 替换。这样，有限的 evaluation budget 被精确投向最有信息量的候选，而 skill 的 refinement 只在有充分 evidence 支撑时才发生，避免了反复无意义地调用 LLM 重写 skill。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+-------------------+       +-----------------------+\n|   T0 (无技能轨迹)  |------\u003E|  Skill Evolution      |\n+-------------------+       | (Regen/Mutate/Cross)  |\n                            +-----------------------+\n+-------------------+                 | (周期性触发)\n|   P_t (技能种群)   |\u003C----------------+\n+-------------------+\n          |\n          | (计算优先级)\n          v\n+-------------------+       +-----------------------+\n| Bandit Scoring    |\u003C------|    H_t (历史记录)      |\n| (MLP + LinearUCB) |       | (Reward \u0026 Trajectory) |\n+-------------------+       +-----------------------+\n          | (最高优先级)             ^\n          v                        |\n+-------------------+               |\n| Target Agent Eval |---------------+\n+-------------------+\n          |\n          v\n   [输出: 最优 Skill]\n```\n\n以在 ALFWorld（ embodied 家务任务）中优化 agent 技能为例，完整 pipeline 如下：\n\n**输入**：无技能轨迹 T0（agent 在无指导时盲目寻找苹果的交互记录）与优化集 D_opt。\n\n**处理**：\n1. **初始化种群**：从 T0 中提取经验，通过 teaching model 独立生成初始技能种群 P_t（如“先去冰箱找”、“检查柜台”等策略）。\n2. **Bandit 优先级排序**：利用历史记录 H_t 训练神经奖励预测器（MLP），并结合 LinearUCB 计算探索 bonus，为 P_t 中的所有技能计算优先级分数。\n3. **目标评估与反馈**：选出优先级最高的技能注入 target agent 并在 D_opt 上执行，收集执行轨迹 T_t 与奖励 r_t，将其追加至 H_t 并更新预测器。\n4. **技能进化**：按照对数周期触发 Skill Evolution，基于 H_t 中的证据通过 Regeneration（从 T0 生成全新策略）、Rollout Mutation（根据成功/失败轨迹局部修改当前技能）和 Crossover（以强技能为 backbone 结合其他强弱技能）生成新技能，替换掉 P_t 中优先级最低的旧技能。\n\n**输出**：在优化预算 T 轮结束后，从 H_t 中提取平均奖励最高的技能作为最终输出的最优 Skill。\n\n### § 6 核心数学推导\n\n本文的核心数学推导在于 Contextual Bandit 的优先级打分机制，旨在平衡对高潜力技能的利用与对未知技能的探索。\n\n**1. Neural Reward Prediction**\n算法使用一个轻量级 MLP $f_\\theta$ 来预测技能的潜在奖励。模型基于历史记录 $H_{t-1}$ 进行拟合，损失函数为带 $L_2$ 正则化的均方误差（MSE）。\n*Intuition*：就像训练一个回归模型，输入是技能的语义 embedding，输出是预测的得分。加入正则化是为了防止在少量评估样本下过拟合，确保模型对未评估技能的打分具有泛化能力。\n\n**2. LinearUCB Exploration**\n为了防止模型只盯着当前预测高分的技能（过度利用），引入了基于 LinearUCB 的不确定性 bonus：\n$$b_t(z_s) = \\nu \\sqrt{z_s^\\top A_{t-1}^{-1} z_s}$$\n其中 $A_{t-1} = \\lambda I + \\sum_{i=1}^{t-1} z_{s_i} z_{s_i}^\\top$ 是正则化设计矩阵。\n*Intuition*：矩阵 $A$ 记录了已探索技能的方向累积。如果一个新技能的 embedding 方向与已探索技能重合，则不确定性低；如果方向新颖，不确定性就高。这个 bonus 相当于给“没试过但可能有意想不到效果”的技能加分，$\\nu$ 控制了这种探索的激进程度。\n\n**3. Bandit Priority Score**\n最终的优先级分数为：$U_t(s) = f_{\\theta_{t-1}}(z_s) + b_t(z_s)$\n*Intuition*：综合了“预测得分高”（Exploitation）和“不确定性高”（Exploration）两个维度。算法每轮选择 $U_t(s)$ 最大的技能进行评估，从而在有限预算下智能分配评估资源。\n\n### § 7 实验设计与结论\n\n**问题1：COBRA-Skills 是否能在降低成本的同时提升性能？**\n*实验设计*：在6个异构 benchmark 和3个 target model 上，与 No Skill、LLM Skill、Trace2Skill 和 SkillOpt 进行对比，记录平均准确率与优化成本。\n*问题答案*：是。COBRA-Skills 在所有目标模型上均取得最高平均性能，且相比最强基线 SkillOpt，总优化成本降低 55%–58%，每提升一点的成本降低 60%–69%。\n\n**问题2：Bandit 优先级排序和技能进化是否都不可或缺？**\n*实验设计*：设计消融实验，分别移除 Bandit（随机选择评估）和 Evolution（固定技能池），并与 Best-of-30 基线对比。\n*问题答案*：是。移除任一组件都会导致性能下降约2.2–2.4个百分点，且性能提升并非仅仅因为评估了更多的候选技能，两者在自适应评估分配和候选空间扩展上提供了互补收益。\n\n**问题3：方法是否依赖更强的外部 teaching model？**\n*实验设计*：在 Self-teaching 设置下，用 target model 自身替代 GPT-5.5 作为 teaching model 进行技能生成与优化。\n*问题答案*：否。Self-teaching 模式下性能仅微降（73.5降至72.5），但优化成本减半，且依然显著优于基线，证明其收益不依赖于更强的外部教师模型。\n\n**问题4：优化后的技能能否跨模型迁移？**\n*实验设计*：保持 teaching model 不变，将在模型 A 上优化的技能直接应用到模型 B 上测试（Cross-model transfer）。\n*问题答案*：能。36次跨模型迁移中有34次超过了目标模型的无技能基线，说明优化出的技能捕获了通用的任务级策略，而非与特定模型过度耦合。\n\n**问题5：算法对探索系数 $\\nu$ 的敏感性如何？**\n*实验设计*：在 Qwen3.6-35B-A3B 上调整 $\\nu$ 值并观察平均性能变化。\n*问题答案*：性能在 $\\nu=0.1$ 时达到峰值，过大或过小都会导致性能下降，证实了平衡 Exploitation 与 Exploration 的重要性。", "additional_insights": "### § 8 Take-aways\n\nCOBRA-Skills 将 agent skill optimization 形式化为在一个动态演化的候选空间上的 budgeted sequential optimization 问题，核心创新在于将 contextual bandit 的优先级评分与 evidence-grounded 的 skill evolution 闭环耦合。具体而言，每个候选 skill 被视为一个 arm，用其 semantic embedding 作为 feature，通过一个轻量级 two-layer MLP 预测 reward（exploitation），再叠加 LinearUCB 风格的 confidence bonus（exploration），从而在有限 evaluation budget 下选择性评估 promising 或 underexplored 的候选 skill。Evolution 操作（regeneration、rollout mutation、crossover）仅在按对数间隔的 scheduled updates 时触发，而非每轮执行，这使得 teaching model 的 token 消耗相比 SkillOpt 降低了 67%–80%，总优化成本降低 55%–58%。整个框架每个 benchmark 仅需 50 个 optimization examples，远少于 baseline 使用的 120–170 个。Ablation 表明 bandit prioritization 和 population evolution 各自贡献约 2.2 和 2.4 个百分点，且 Best-of-30 固定池策略仍落后 2.5 个百分点，说明性能提升不仅来自候选数量增加，更来自 adaptive evaluation allocation 与 dynamic candidate space 的协同。Cross-model transfer 实验中 36 次跨模型迁移有 34 次超过 no-skill baseline，表明优化出的 skill 捕获的是 task-level strategy 而非与特定 target model 耦合的行为。Self-teaching 设置下（target model 自身充当 teaching model），性能仅下降 1.0 个百分点而成本减半，表明框架不依赖更强的外部 teacher model。框架在 Claude Code 和 Codex 两种外部 agent harness 下均保持最优平均性能，证明其对执行接口的鲁棒性。\n\n### § 9 最脆弱的假设\n\nCOBRA-Skills 最核心且最脆弱的假设是：**skill 的 utility 可以从其 semantic embedding 中被有效预测**，即 skill embedding 空间中的 reward function 足够平滑，使得在少量已评估 skill 上训练的 neural predictor 能够为未评估的、语义相关的 skill 提供有意义的 utility 估计。这个假设是整个 bandit-guided prioritization 机制的基石——如果 embedding 空间中的 reward 不平滑，那么 MLP 的预测将退化为噪声，LinearUCB 的 confidence bonus 将无法正确识别 underexplored 区域，bandit 的优先级评分将不比随机选择更好，而论文的核心贡献（efficient evaluation allocation）将直接失效。\n\n这个假设在实际中可能不成立的原因有三层。第一，**训练数据极度稀疏**：整个优化过程仅 30 轮，MLP 最多在 30 个观测点上训练，而输入维度为 2560（Qwen3-Embedding-4B 的 embedding 维度），这种极端的高维低样本比极易导致 overfitting，使得 predictor 在未评估 skill 上的泛化能力存疑。第二，**通用 embedding 模型可能不捕获 task-specific utility 信号**：Qwen3-Embedding-4B 是通用语义编码器，其 embedding 空间反映的是文本语义相似性而非 skill 对特定 task 的有效性——两个语义相似的 skill 可能在关键的行为指导细节上差异巨大，导致 reward 在 embedding 空间中并不平滑。第三，**population 的动态演化引入 non-stationarity**：crossover 和 rollout mutation 产生的新 skill 可能位于 embedding 空间中此前没有观测数据的区域，predictor 在这些区域的外推可靠性无法保证。\n\n论文为这个假设提供的证据是间接的：ablation 中 w/o Bandit 仅下降 2.2 个百分点，说明 bandit 确实有贡献但并非系统性能的唯一驱动；ν 的 sensitivity analysis 在 0.1 处达到峰值，说明 exploration-exploitation balance 有意义。然而，论文**缺少直接验证**：没有报告 predictor 的预测值与实际 reward 之间的相关性或 calibration 指标，没有分析 embedding 空间中 reward 的平滑性（例如评估 skill 之间的 embedding 距离与 reward 差异的关系），也没有对比不同 embedding 模型对 bandit 效果的影响。这些缺失使得读者无法判断 bandit 的成功究竟来自有效的 reward prediction，还是仅仅来自 LinearUCB bonus 提供的 exploration 机制在极小候选池（K=10）上的偶然效果——在一个仅 10 个候选的池中，即使随机选择也可能在 30 轮内覆盖大部分候选，bandit 的边际价值可能被高估。\n\n### § 10 最小复现实验\n\n在一周时间内，最有价值的 minimal experiment 是**验证 contextual bandit prioritization 相比随机选择是否真正提供了 evaluation efficiency 的提升**，这是论文核心 claim 的基础，且可以在不实现 evolution operators 的情况下独立测试。具体方案如下：选择 SearchQA 作为唯一 benchmark（single-turn、evaluation 简单），使用一个 target model（如 Qwen3.6-35B-A3B）在 50 个 optimization examples 上收集 no-skill trajectories。用 GPT 生成 30 个独立 skill（通过 regeneration prompt 从 no-skill trajectories 诱导），然后**穷举评估所有 30 个 skill** 在 50 个 optimization examples 上的 reward，获得 ground-truth ranking。用 Qwen3-Embedding-4B 获取所有 30 个 skill 的 embedding。接下来模拟 bandit selection 过程：从随机初始的 3 个已评估 skill 开始，每轮用当前已观测数据训练 MLP（2560→64→1，与论文配置一致），计算所有未评估 skill 的 priority score（MLP prediction + LinearUCB bonus，ν=0.1），选择最高优先级的 skill 进行\"评估\"（实际从预计算的 ground-truth reward 中读取），记录每轮的 cumulative best reward。重复此过程 100 次（不同随机初始 skill），与同等轮数下的 random selection 进行比较。\n\n测量指标是 **cumulative best reward 随 evaluation 轮数的增长曲线**，以及 bandit 在 10 轮内找到 top-3 skill 的概率 vs random selection 的对应概率。如果 bandit 曲线显著快于 random（例如在 10 轮内中位 cumulative best reward 达到 random 20 轮的水平），则支持论文关于 efficient evaluation allocation 的 claim。如果两条曲线无统计显著差异，或 bandit 的优势在 95% CI 内不显著，则反驳该 claim，表明在极小候选池和极少观测点的条件下，neural reward prediction 无法提供超越随机选择的 prioritization 信号。这个实验只需 30×50=1500 次 agent evaluation（可预计算）加上纯 Python 的 bandit 模拟，无需实现 evolution loop、crossover 逻辑或 multi-benchmark pipeline，一周内完全可行。", "research_value": "### § 11 最强反例设计\n\n针对 COBRA-Skills 最脆弱的假设——skill 的 utility 在 semantic embedding 空间中是平滑的——我将设计一个基于“语义相似但效用突变”任务的反例。在许多真实的 agentic 任务中（如 API 调用、代码生成或精确的 action sequencing），技能文本的微小语义差异往往对应着完全相反的执行结果。例如，在工具调用任务中，“使用 `requests.get()` 获取数据”与“使用 `requests.post()` 获取数据”在通用 embedding 空间中极度相似，但只有前者能成功完成任务。我会构造一个包含大量此类“伪近邻”技能的候选池，并在其上运行 COBRA-Skills 的 bandit prioritization 机制。具体测量 MLP predictor 预测值与 ground-truth reward 之间的 Spearman rank correlation，以及 bandit selection 相比 random selection 在找到 top-tier skill 上的效率提升。如果 embedding 空间中的 reward landscape 呈现高度非平滑的悬崖式突变，MLP 将无法从已评估的“伪近邻”中泛化，导致预测退化为噪声。此时，LinearUCB 的 confidence bonus 会因为这些语义密集但效用分化的技能而产生误导，使得 bandit 的 cumulative best reward 增长曲线与 random selection 无统计显著差异。这个反例直接证明，当 task-specific utility 无法被通用文本语义捕获时，COBRA-Skills 的核心 evaluation allocation 机制会可预测地失效，其性能提升仅仅是在 reward landscape 恰好平滑的任务上的偶然现象。\n\n### § 12 Follow-up Research Idea\n\n基于通用 semantic embedding 无法捕获 task-specific causal utility 这一核心局限，我提出一个全新的 framing：**Causal Skill Decomposition and Counterfactual Evaluation**。现有方法要么依赖昂贵的真实 execution 获取 feedback，要么假设 embedding 空间平滑来预测 reward，而新框架旨在利用 LLM 自身的 internal world model 进行 counterfactual trajectory simulation，从而在无需真实执行的情况下评估 skill 的 causal effect。具体而言，不再将 skill 视为不可分割的文本块进行 embedding，而是将其解析为结构化的 atomic action-prerequisite pairs。借鉴 causal inference 中的 structural causal models 和 program synthesis 中的 execution-guided reasoning，我们可以对 skill 中的关键操作进行 counterfactual 替换（例如，“如果将步骤 A 替换为 B，world model 预测的执行轨迹和最终状态会如何变化？”）。通过比较 counterfactual trajectory 与目标状态的匹配度，我们直接在 causal mechanism 层面评估 skill 的 utility
