的 claim；如果两者表现相当或 ROAM 因 relation 误判而更差，则反驳该 claim。这个方案避免了 fusion 模块的实现复杂度，同时直接测试了 ROAM 最核心的机制。", "research_value": "### § 11 最强反例设计\n\n对 ROAM 最有力的攻击应针对其五类 semantic relation 的互斥性假设，提出一个基于“混合关系原子对”的真实场景反例。ROAM 的核心逻辑建立在 incoming-stored atom pair 可以被干净地映射为 IND、EQV、OSN、NSO 或 CON 中的某一类，并据此执行 deterministic policy。然而，在复杂的真实交互中，语义关系往往是多维度的。考虑这样一个医疗代理场景：stored memory 为“患者对青霉素过敏”，而 incoming observation 为“患者正在服用阿莫西林治疗呼吸道感染”。从 taxonomic 层面看，阿莫西林属于青霉素类，两者构成 OSN/NSO 的 directional subsuming 关系；但从临床状态层面看，当前的用药行为与既往过敏史构成严重的 CON 关系。如果 LLM manager 将其分类为 OSN 并将 incoming observation 设为 Primary，过敏史被降级为 Evidence，那么在检索时“正在服用阿莫西林”会挤占 context，而致命的过敏警告可能因未被 fusion 进 Primary view 而丢失；如果分类为 CON，系统又可能错误地覆写或抑制当前正在发生的治疗事实。这种分类失败提供了一种强有力的替代解释：ROAM 在 LongMemEval 上的性能提升，可能仅仅是因为该数据集的原子事实多为单维度属性（如位置、偏好），从而回避了多维度语义纠缠。一旦面对属性正交、关系混合的开放场景，ROAM 的 deterministic policy 将被迫做出错误的互斥选择，导致 role assignment 系统性崩溃，其表现甚至可能不如不进行任何干预的 Append-all 策略，因为后者至少保留了原始的 provenance 供下游 LLM 自行裁决。\n\n### § 12 Follow-up Research Idea\n\n基于 ROAM 在离散关系分类上的脆弱性，一个非增量的 novel research idea 是放弃互斥的 symbolic relation classification，转而引入 **Differentiable Memory State-Space Models (DM-SSM)**，将记忆管理从“离散分类与突变”重构为“连续状态空间内的概率演化”。驱动这个想法的局限是：LLM 难以可靠执行 OSN/NSO 等细粒度方向性判断，且强制将复杂语义交互映射为五类互斥关系会丢失多维度的上下文信息。我们可以借鉴控制论与序列建模领域（如 Mamba 或 Linear RNNs）的状态更新机制，将每条 atomic memory 视为状态空间中的一个连续向量。当 incoming observation 到来时，不要求 LLM 输出离散标签，而是通过一个轻量级投影网络计算 incoming embedding 与 stored memory vectors 之间的 continuous transition matrix，该矩阵能够同时表达 partial entailment、temporal decay 和 dimensional conflict。在此框架下，Primary 和 Evidence 的界限被打破，取而代之的是每条记忆在状态空间中的“激活势能”，检索时直接根据当前 query 在该连续状态空间中进行投影匹配。第一个实验将构造一个高密度多维度冲突的合成数据集（如前述医疗场景的规模化版本），比较传统离散分类框架（ROAM）与 DM-SSM 在处理 mixed-relation pairs 时的下游 answer accuracy 和 latent state trajectory 的稳定性。这一提议与已有工作的根本区别在于：它彻底移除了 LLM 作为 symbolic memory manager 的角色，将 semantic relation inference 隐式地吸收进一个可微分的连续状态更新过程中，从而绕过了中小模型在细粒度方向性推理上的认知瓶颈。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jianjie Zheng\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Peng Lai\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Sijie Cheng\", \"affiliations\": [2, 3], \"markers\": []},\n    {\"name\": \"Jiehui Zhao\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Lei Yang\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Guanhua Chen\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Southern University of Science and Technology\"},\n    {\"id\": 2, \"name\": \"Tsinghua University\"},\n    {\"id\": 3, \"name\": \"RayNeo.AI\"},\n    {\"id\": 4, \"name\": \"Deepexi Technology Co. Ltd.\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal Contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding Author\"}\n  ]\n}\n```", "summary_translation": "长期 language-model agents 在跨交互过程中依赖于外部记忆。Atomic memories 尤为有用：其细粒度的语义边界能够实现精确检索以及观察结果之间的直接比较。然而，不断累积的 atoms 不可避免地会变得冗余、重叠或冲突。现有方法通常要求 LLM manager 直接添加、更新、删除或重写记忆，将语义解释、存储决策和内容生成耦合在一个容易出错的操作中。我们引入了 ROAM，这是一个 relation-guided 框架，它利用 atomicity 进行管理，同时允许更丰富的 answer-time 表示。ROAM 将输入的与存储的 atom 对分类为 independent、equivalent、directionally subsuming 或 conflicting，然后将观察结果组织为活跃的 Primary 和辅助的 Evidence 角色。随后，Fusion 将互补的细节和时间变化结合成紧凑的、潜在 non-atomic 的 views。仅检索 Primary views 用于回答，从而防止冗余或过时的 atoms 独立竞争。在不同的 models 和 evaluation settings 下，ROAM 将 answer accuracy 提高了最多 29.8 个百分点。Ablations 表明，不同的 relations 带来了互补的益处，并且在 role organization 之外，fusion 也带来了持续的增益。机制分析进一步发现，answer-critical source recall 提高了 15.6 个百分点，且 confounder-token share 降低了 11.5 个百分点。ROAM 在不同的 manager scales 下保持稳健。"}, {"title": "Subagents vs Agent Skills: Executing Reusable Knowledge for Long-Horizon Agentic Tasks", "arxiv_id": "2609.09233", "authors": "Wasu Top Piriyakulkij, Rachel Lawrence, Alicia Curth, Sushrut Karmalkar, Niranjani Prasad", "summary": "How can language model agents effectively leverage libraries of reusable knowledge to solve long-horizon tasks? Recent work has increasingly focused on agent skills: reusable capabilities represented as skill packages, i.e., multi-file bundles containing instructions, scripts, and other resources that help agents perform specific tasks. Agent skills are typically executed by loading their skill instructions into an agent's context and relying on the agent to follow them. As task horizons grow, however, this approach becomes increasingly brittle, because reasoning quality degrades as more information accumulates in the context window. We investigate an alternative approach in which skill packages are instead invoked as subagents. Rather than loading skill instructions into the main context, subagent execution spawns fresh context windows dedicated to solving individual subtasks. We show that subagent execution outperforms agent-skill execution when skill packages expose clear input-output contracts and their instructions encode the procedural knowledge needed to fulfill those contracts. The tradeoff is additional communication overhead, as extra tokens are required to coordinate between the main agent and its subagents. Our results show that the benefit of reusable knowledge depends not only on its content, but also on how it is organized and invoked.", "category": "cs.CL", "cluster": "Agent Memory \u0026 Knowledge Reuse", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文的核心研究问题是：在 long-horizon agentic tasks 中，language model agents 应该如何有效地执行 reusable knowledge libraries（特别是 agent skills）以避免 context overload 导致的性能退化？传统方法将 skill packages 中的 instructions 加载到 main agent 的 context window 中，由 LLM 自行遵循这些指令来执行任务。然而，随着任务跨度增加，context 中积累的 verbose tool inputs/outputs 和 intermediate reasoning 会导致 LLM reasoning quality 显著下降——这一现象已被证明与 bandwidth-limited attention 有关。论文提出将 skill packages 作为 subagents 调用：在独立的 context window 中初始化 skill instructions 并执行子任务，仅将最终 output 返回给 main agent，从而降低任意单个 context 所需处理的 peak context length。这个问题的重要性在于，long-horizon tasks 是现实场景中 agent 应用的关键需求，而 context overload 是制约 agents 可扩展性的核心瓶颈。解决这一问题不仅能提升 agents 在复杂任务上的准确性和鲁棒性，还能为构建模块化、可扩展的 agent 系统提供理论基础——subagent execution 本质上是一种通过明确接口实现 information encapsulation 的机制。\n\n### § 2 前人工作与不足\n\n在论文之前，agent skills 已成为向 LLM agents 注入 reusable, domain-specific knowledge 的主流方法（如 Anthropic 的 Agent Skills 框架）。这些方法将知识表示为 skill packages（包含 SKILL.md instructions、scripts 和 supporting resources），执行时将 instructions 加载到 main context 中，由同一 policy 在同一 context 中逐步完成。然而，这种方法在 long-horizon tasks 中存在根本性缺陷：加载 skill instructions 会进一步加剧 context overload，而 LLM 性能随 context 增长而退化，导致任务越长、性能越差——skill instructions 本应帮助 agent，却反而成为 context 的负担。另一方面，现有的 agent harnesses（如 Claude Code 和 OpenAI Codex）虽然支持 spawning subagents，但主要将其用于 task parallelization 以降低延迟，而非作为执行 reusable knowledge 的机制。因此，将 skill packages 作为 subagents 执行以控制 context 增长的潜力尚未被系统探索。此外，LLM skill learning 领域的工作（如 Voyager, LATM, CREATOR, CRAFT, SkillCraft 等）虽然致力于学习程序化技能或从 execution trajectories 中合成 skill packages，但无一例外采用 agent-skill execution 方式，未质疑这一执行范式在 long-horizon 场景下的局限性。更关键的是，现有的 curated skill packages（如 SkillsBench 中 human-authored 的包）大多缺乏明确的 input-output contracts，仅描述相关知识而未定义预期的输入和输出接口。这使得 subagent execution 难以有效实施——因为 main agent 无法准确判断何时应调用 subagent 以及应提供何种信息，subagent 也无法明确知道应返回什么。论文识别了这一关键缺口，指出只有当 skill packages 被设计为具有明确 input-output contracts 的 procedural knowledge（类比 reinforcement learning 中的 options framework）时，subagent execution 才能发挥优势，而此前的研究既未提出这一设计原则，也未实证验证 subagent execution 在控制 context 增长方面的价值。", "core_insight": "### § 3 重建作者的思考路径\n\n从已有背景出发，LLM agents 依赖 in-context learning 注入领域知识，而当前主流的 agent skills 机制通过将 skill packages 的指令加载到主 context 中来执行任务。然而，已有研究表明 LLM 的 reasoning 质量会随 context length 增加而显著退化，这在需要多步工具调用和大量中间推理的 long-horizon tasks 中尤为致命；context 本身就已经膨胀，再注入冗长的 skill instructions 无异于雪上加霜。与此同时，在强化学习的 options framework 中，skill 被视为由高层控制器调用的 temporally extended policy，具有明确的 initiation set 和 termination condition，这与当前简单将指令塞入 context 的做法形成鲜明对比。研究者可能进一步注意到，现有的 agent harnesses 虽然支持 subagents，但通常仅用于并行化以降低延迟，并未将其用于信息封装。如果借鉴 RL 中的思想，将 skill 作为一个独立子策略在隔离的 context 中执行，就能将子任务的内部轨迹隐藏起来，只向主 agent 返回最终输出，从而有效控制主 context 的增长。但要让这种委派生效，主 agent 必须知道何时调用以及传递什么信息，这就要求 skill 本身必须具备类似 option 的明确接口，即清晰的 input-output contracts 和 procedural knowledge。\n\n### § 4 核心 Intuition\n\n先前方法失效的根源在于将所有技能指令和子任务推理都堆积在同一个 context window 中，导致 long-horizon 任务中 context 膨胀并引发 LLM reasoning 质量崩塌。这篇论文的核心 intuition 是：如果将具备明确 input-output contracts 的 procedural skill 委派给独立的 subagent 执行，就能通过信息封装将冗长的子任务推理隔离在主 context 之外，仅返回最终结果。这种做法虽然牺牲了部分 token 用于主 agent 与 subagent 间的通信，但显著降低了主 agent 必须处理的 peak context length，从而避免了 context overload 带来的性能退化。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n           Skill Package s = (d, m, R)\n      d=(h,q_in,q_out)  m=SKILL.md  R=resources\n                     │\n           ┌─────────┴─────────┐\n           │                   │\n     Agent Skill          Subagent\n           │                   │\n    ┌──────▼──────┐     ┌──────▼──────┐\n    │ Main Context│     │ Main Context│\n    │ 加载 m 入 c │     │ 传 x_t 给子 │\n    │ π_LLM 推理  │     │ 代理        │\n    │ 逐步执行    │     └──────┬──────┘\n    └──────┬──────┘            │\n           │            ┌──────▼──────┐\n           │            │Subagent Ctx │\n           │            │ 初始化 x_t+m│\n           │            │ π^(k) 推理  │\n           │            │ 返回 r_T^k  │\n           │            └──────┬──────┘\n           │                   │\n    ┌──────▼───────────────────▼──────┐\n    │  Main Agent → Final Answer      │\n    └─────────────────────────────────┘\n```\n\n论文的核心方法围绕 **skill package** 的两种执行模式展开，具体 pipeline 如下：\n\n**Skill Package 结构定义（§2, Eq 4-8）。** 每个 skill package $s = (d, m, R)$ 包含三部分：description $d$（始终暴露给 main agent 用于 skill discovery）、instruction file $m$（即 `SKILL.md`，描述如何执行该 skill）、resource collection $R$（脚本、示例等辅助文件）。论文进一步将 $d$ 结构化为 $(h, q_{in}, q_{out})$，其中 $h$ 是功能摘要，$q_{in}$ 和 $q_{out}$ 分别是自然语言输入/输出 contract specification（§3.2, Eq 8）。这一结构借鉴了 reinforcement learning 中的 **options framework**：$q_{in}$ 对应 initiation set $I_\\omega$，$m$ 对应 option policy $\\pi_\\omega$，$q_{out}$ 对应 termination condition $\\beta_\\omega$。\n\n**Agent Skill 执行模式（§2, Eq 5）。** Main agent 调用 skill 时，tool executor 直接返回 instruction file $m_k$，将其注入 main context $c$。此后 $\\pi_{LLM}$ 在同一个 context 中逐步执行 skill 的每个步骤，遵循 Eq 1-3 的标准 tool-calling 循环。所有中间推理、tool output 都累积在单一 context 中。\n\n**Subagent 执行模式（§2, Eq 6-7）。** Main agent 调用 subagent 时，tool executor 实例化一个独立 policy $\\pi^{(k)}$，以 skill instructions $m_k$ 和 task input $x_t$ 初始化一个全新的 context window。Subagent 在该隔离 context 中独立执行完整的 tool-calling 推理过程，仅将最终 response $r_T^{(k)}$ 返回给 main agent。Main agent 既不读取也不写入 subagent 的内部 context。\n\n**Procedural Skill Package 合成（§4, §A.4）。** 论文从 SkillsBench 的 87 个任务中，使用 GPT-5.3 Codex 运行 OpenHands agent 三次，收集成功 trajectories。随后用 Copilot CLI（Claude Opus 5 驱动）从这些 trajectories 合成带有明确 I/O contracts 的 procedural skill packages，人工干预确保每个 skill 包含 \"expected input\" 和 \"output\" 描述。最终为 64 个任务成功合成了 well-interfaced procedural skills。\n\n**Peak Context Length 控制（§3.1）。** Subagent 执行的核心机制是 **information encapsulation**：subtask-specific 的内部 trajectory 对 main agent 不可见，只有最终输出被传递回主 context。这降低了任何单个 context window 需要处理的 peak context length，代价是 main agent 与 subagent 之间的 communication overhead——相关信息会在不同 context window 间重复。\n\n**Hierarchical Library Organization（§A.1）。** 当 skill library 规模增大时，论文测试了将 skills 组织为层级结构：routing node（不含 procedural knowledge，仅导航）作为 agent skill inline 执行，leaf skill（含 I/O contracts）作为 subagent 隔离执行。这种 hybrid 模式模拟了 MCP server 的 lazy-loading 策略，仅暴露当前层级的 skill 子集，进一步降低 initial context load。\n\n### § 6 核心数学推导\n\n论文的形式化部分主要在 §2 和 §3.2，核心是将两种 skill 执行模式用统一的数学语言描述，并建立与 options framework 的类比。\n\n**Agent context 更新（Eq 3）：** $c_{t+1} = c_t \\oplus (r_t, k_t, x_t, o_t)$。这里 $\\oplus$ 表示将一轮交互的 response、tool call、tool arguments 和 tool output 追加到 context。Intuition 很直接：agent 的 context 是一个不断增长的交互日志，每轮推理都在这个日志上条件化。这正是 long-horizon task 中 context overload 的根源——日志越长，LLM 的 attention bandwidth 越紧张。\n\n**Agent Skill 执行（Eq 5）：** $E(k = \\text{AgentSkill}(s), \\emptyset) = m_k$。调用 agent skill 不需要额外参数（输入为 $\\emptyset$），直接返回 instruction file。关键在于 $m_k$ 随后被注入 main context，skill 的每一步执行都成为 main context 中的普通 agent step。数学上，这意味着 skill 的推理过程与 main agent 的推理过程共享同一个不断增长的 $c$。\n\n**Subagent 执行（Eq 6-7）：** Subagent 的 context 初始化为 $c_0^{(k)} = \\text{init}(m_k, x_t)$，随后在独立 policy $\\pi^{(k)}$ 下运行至终止，返回 $r_T^{(k)}$。关键区别在于：$\\pi^{(k)}$ 作用于一个 main agent 不可见的 context，信息仅通过 $x_t$（输入）和 $r_T^{(k)}$（输出）流动。这是一个 **信息封装** 的数学表达——subagent 的内部 trajectory $(r_0^{(k)}, k_0^{(k)}, \\dots, r_T^{(k)})$ 完全隔离。\n\n**Options Framework 类比（Eq 8）：** Skill package 被结构化为 $s = ((h, q_{in}, q_{out}), m, R)$，对应 option $\\omega = (I_\\omega, \\pi_\\omega, \\beta_\\omega)$。$q_{in}$ 定义合法输入集合 $X_{in}$（对应 $I_\\omega$：何时可以调用），$m$ 编码将输入映射到输出的过程（对应 $\\pi_\\omega$：如何执行），$q_{out}$ 约束返回内容（对应 $\\beta_\\omega$：何时终止、返回什么）。这一类比的核心 intuition 是：只有当 skill 像 option 一样具有自包含的接口时，才能安全地将内部推理委托给隔离 context——否则 subagent 缺乏足够信息独立完成任务。\n\n### § 7 实验设计与结论\n\n论文围绕三个核心 claim 设计实验，均在 SkillsBench（87 个 long-horizon agentic task）上评测，使用 OpenHands 作为 agent harness，覆盖 7 个 base LLM（从 Ministral-8B 到 GPT-5.3 Codex）。\n\n**Claim 1：Subagent 执行仅在 skill package 具备明确 I/O contracts 和 procedural instructions 时优于 agent skill 执行。** 论文设计了 2×2 的对照实验：两种执行模式（agent skill vs subagent）× 两种 skill package 类型（原始 curated packages 无 I/O contracts vs 合成的 procedural + I/O contracts packages）。结果（Figure 2）清晰支持该 claim：使用原始 curated skills 时，agent skill 在所有模型上匹配或优于 subagent；使用合成的 contract-driven skills 时，趋势逆转，subagent 显著优于 agent skill，且增益在 bandwidth-limited 的小模型上最大。这表明 skill 的组织方式与执行方式需要匹配——loosely structured knowledge 适合直接注入 context，而 procedural abstraction with well-defined interfaces 适合隔离执行。\n\n**Claim 2：Subagent 执行的优势随 context pressure 增大而增长。** 论文通过向 agent context 中注入数量递增的 distracting tools（0 到 263 个）来模拟真实环境中大量工具可用的场景，测量 task accuracy 随 distracting skills 数量的变化。结果（Figure 3）显示，agent skill 执行的 accuracy 随 distracting tools 增加而快速下降，而 subagent 执行退化更为平缓。这验证了 §3.1 的分析：当 initial context 已经很长时，将 skill instructions 排除在 main context 之外的收益更大。\n\n**Claim 3：Subagent 执行以更高的 total token cost 换取更低的 peak context length。** 论文直接测量了每种执行模式下的 per-task peak context length 和 total token consumption。结果（Figure 4）显示，对于强模型（GPT-5.3 Codex、Kimi K2.6），subagent 在超过 80% 的任务上实现了更低的 peak context length，但 total token 消耗显著更高——因为每个 subagent 需要被独立供给所需 context，导致信息在 context windows 间重复。对于弱模型，peak context 的减少不明显甚至反转，论文解释这是因为弱模型在 agent skill 模式下因 reasoning 退化而过早终止，context 自然偏短，而非真正高效完成了任务。\n\n**附录实验：Hierarchical library organization（§A.1, Figure 5）。** 论文进一步测试了四种 library 组织方式（flat、hierarchical tree、hierarchical graph、two-level task-tree）与三种执行模式（fully agent skill、fully subagent、hybrid）的组合。结果显示 hybrid 模式（routing nodes 作为 agent skill inline 执行，leaf skills 作为 subagent 隔离执行）在所有 library 类型上一致最优，支持了论文的核心论点：不含 procedural knowledge 和 I/O contracts 的 routing node 适合 inline 执行，而具备这些属性的 leaf skill 适合隔离执行。Hierarchical graph 略优于 hierarchical tree，表明允许到达同一 leaf skill 的多条路径有助于 agent 导航。", "additional_insights": "### § 8 Take-aways\n\n论文的核心发现是：skill package 的执行方式——而非仅其内容——显著影响 agent 在 long-horizon tasks 上的表现。当 skill packages 被设计为具有明确 input-output contracts 的 procedural knowledge 时，subagent execution（在独立 context window 中执行 skill 并仅返回 output）显著优于 agent-skill execution（将 SKILL.md 加载到 main context 中由主 agent 自行执行），且该优势在 context 压力增大（如引入 distracting tools）时进一步扩大。其根本机制是 peak context length 的降低：subagent 将 subtask-specific 的 reasoning 封装在独立 context 中，使主 agent 需要处理的信息量减少，从而缓解了 LLM 在长 context 下 reasoning 质量退化的问题。然而，这一优势仅在 skill packages 满足特定结构条件时成立——缺乏 explicit input-output contracts 的 curated skills 在 subagent 模式下反而表现更差或持平。代价是 total token consumption 显著增加，因为信息需在 main agent 与 subagents 之间重复传递。论文还发现 hybrid 执行模式（routing nodes 作为 agent skills、leaf skills 作为 subagents）配合 hierarchical library organization 效果最佳，呼应了 MCP lazy-loading 的设计理念。此外，论文提供了一条 practical pathway：从成功 trajectories 中 synthesize 符合 contract 要求的 procedural skills，但成功率仅为 64/87，且依赖 Copilot CLI 和 minimal human intervention。\n\n### § 9 最脆弱的假设\n\n论文最关键的假设是：long-horizon tasks 可以被有效分解为具有明确 input-output contracts 的自包含 subtasks，使得每个 subagent 无需访问 main agent 的完整 context 即可独立完成其 subtask。这一假设是 subagent execution 优势的全部基础——如果 subtasks 本质上高度耦合、需要 main context 中的细粒度中间状态或跨 skill 的知识融合，那么 subagent 要么因信息不足而失败，要么因需要传递大量 context 而丧失 peak context reduction 的优势。\n\n该假设在实际中可能不成立的原因有三：第一，许多真实任务（如 multi-file refactoring、iterative debugging）的 subtasks 之间存在隐式依赖，难以用 static input-output contract 完整刻画；第二，main agent 的 delegation 能力本身受限于 LLM 的 reasoning 质量，当任务复杂度上升时，main agent 可能无法正确识别所需 subagent 或提供充分 input，论文虽提及此问题但未量化 delegation failure rate；第三，论文自身的 skill synthesis 流程存在严重的幸存者偏差——87 个任务中仅 64 个成功 synthesize，且仅从成功 trajectories 中提取 skills，这意味着失败或难以分解的任务被系统性排除，导致结论可能高估了 subagent execution 的普适性。论文未提供任何关于 subtask 可分解性边界的分析，也未报告 delegation 失败的案例研究，这使得核心假设的适用范围缺乏界定。\n\n### § 10 最小复现实验\n\n在一周时间内，可以验证论文最核心的 claim——\"procedural skills with explicit I/O contracts 在 subagent execution 下优于 agent-skill execution，且该优势随 context 压力增大而扩大\"——而无需复现完整系统。具体方案如下：从 SkillsBench 的 64 个任务中选取 10 个具有代表性的任务（覆盖不同 domain 和 tool 数量），手动编写 2-3 个 procedural skill packages，每个包含明确的 Expected input 和 Output 描述（参照论文 Figure 10/11 的格式）。使用 OpenHands 作为 agent harness（论文已开源修改细节），配置一个中等规模 LLM（如 Qwen3.5-9B 或 GPT-5.4-mini），在两种执行模式下运行：agent-skill 模式（SKILL.md 加载到 main context）和 subagent 模式（spawn 独立 context window）。测量三个指标：task accuracy（是否完成最终任务）、peak context length（所有 context windows 中的最大 token 数）和 total token consumption。然后引入 0、50、100 个 distracting tool descriptions 追加到初始 context 中，观察两种模式的 accuracy 退化曲线。如果 subagent 模式在无 distraction 时 accuracy 持平或略高，在 100 个 distracting tools 时 accuracy 优势显著扩大（如论文 Figure 3 所示的 gap），且 peak context length 在 80% 以上任务中更低，则支持论文 claim；如果两种模式在 context 压力下退化幅度相当，或 subagent 模式因 delegation 失败而 accuracy 更低，则反驳 claim。该实验仅需 API 调用费用和少量手动 skill 编写，无需训练模型或构建完整 skill synthesis pipeline。", "research_value": "### § 11 最强反例设计\n\n我将设计一个基于“深度耦合状态依赖任务”的实验来挑战论文的核心假设，即 long-horizon tasks 可以被有效分解为具有明确 input-output contracts 的自包含 subtasks。具体场景设定为大型代码库的 iterative debugging 与 multi-file refactoring，例如将一个 monolithic application 迁移至 microservices 架构，其中 frontend、backend 和 database schema 的修改存在隐式且动态的依赖关系。在此场景下，subtask 的成功执行高度依赖于前序步骤产生的细粒度中间状态（如某个未在 contract 中定义的 error log 或 variable state）。我将对比 agent-skill execution 与 subagent execution 在该任务集上的表现，并重点测量 delegation failure rate、context starvation 发生频率以及 total token consumption。我的核心攻击假设是：当 subtasks 高度耦合时，subagent execution 会陷入“delegation thrashing”——main agent 因 subagent 缺乏全局上下文而失败，不得不反复 spawn 新的 subagent 并传递越来越长的 context，导致 peak context length 不降反升，且 total token consumption 呈指数级增长。这一结果将提供一种替代解释：subagent execution 在论文原实验中的优势并非源于 context encapsulation 的通用机制，而是因为所选任务（如 SkillsBench 中的独立任务）恰好满足“弱耦合”条件。对于真实世界中普遍存在的强耦合任务，agent-skill execution 尽管面临 context overload，但由于保持了单一且连贯的 global state，其 performance degradation 反而比因 context starvation 而反复失败的 subagent execution 更为平缓。\n\n### § 12 Follow-up Research Idea\n\n驱动这一研究想法的局限是：static input-output contracts 在面对 subtasks 高度耦合的真实任务时必然失效，而将完整 context 传递给 subagent 又会丧失 peak context reduction 的优势。我们需要一种机制，允许 subagent 在不污染 main agent context 的前提下，按需动态获取全局状态。这可以借鉴 Operating Systems 中的 demand paging 与 shared memory 机制，提出一种“Dynamic Context Paging for Multi-Agent Systems”的新范式。在该框架下，main agent 的 execution trajectory 不再被完全封装，而是作为一个 read-only 的“address space”存在；subagent 初始化时仅接收 minimal contract，在执行过程中若遇到 context starvation（即发现缺失必要中间状态），则主动触发“context fault”。Agent harness 拦截该 fault，利用 semantic retrieval 从 main agent 的历史 trajectory 中抽取相关的“context page”（即特定中间状态或 tool output snippet），并动态注入 subagent 的 context window。第一个实验将构建一个具有深度隐式依赖的 multi-file refactoring benchmark，对比三种模式：（1）传统 agent-skill execution（全量 context），（2）论文提出的 static-contract subagent execution，以及（3）提出的 demand-paging subagent execution。核心评估指标是 task accuracy 与 context fault resolution rate 的权衡，以及 total token consumption 的 Pareto frontier。这一提议与现有 multi-agent communication 工作（如 AutoGen 中的自由对话）的本质区别在于：它不依赖 LLM 自行决定“需要说什么”，而是将 context 访问抽象为系统级的 memory management 操作，通过显式的 faulting mechanism 将 information encapsulation 从“静态隔离”转变为“动态按需共享”，从而在缓解 context overload 的同时解决 subtask 耦合问题。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Wasu Top Piriyakulkij\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Rachel Lawrence\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Alicia Curth\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Sushrut Karmalkar\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Niranjani Prasad\", \"affiliations\": [2], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Cornell University\"},\n    {\"id\": 2, \"name\": \"Microsoft Research Cambridge\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Work done during an internship at Microsoft Research Cambridge.\"}\n  ]\n}\n```", "summary_translation": "语言模型 agents 如何有效利用可重用知识库来解决 long-horizon tasks？最近的工作越来越关注 agent skills：即表示为 skill packages 的可重用能力，也就是包含指令、脚本和其他资源以帮助 agents 执行特定任务的多文件包。Agent skills 通常通过将其 skill instructions 加载到 agent 的 context 中并依赖 agent 遵循它们来执行。然而，随着 task horizons 的增长，这种方法变得越来越脆弱，因为随着 context window 中累积的信息增多，reasoning quality 会下降。我们研究了一种替代方法，在该方法中，skill packages 被作为 subagents 调用。subagent execution 不是将 skill instructions 加载到 main context 中，而是生成专门用于解决各个 subtasks 的全新 context windows。我们表明，当 skill packages 暴露清晰的 input-output contracts 并且其 instructions 编码了履行这些 contracts 所需的 procedural knowledge 时，subagent execution 优于 agent-skill execution。其代价是额外的 communication overhead，因为在 main agent 及其 subagents 之间进行协调需要额外的 tokens。我们的结果表明，可重用知识的收益不仅取决于其内容，还取决于其组织和调用方式。"}]}]};

const dailyOverviewsRaw = {"2026-09-14": "### 今日AI论文速览 (2026-09-14)\n\n今天的AI研究前沿呈现出强烈的“落地化”与“系统化”趋势。研究焦点正从单次推理转向Agent的终身学习、跨环境记忆共享以及长视界任务的信用分配。同时，具身智能在物理操作和长视频理解上取得突破，而评估领域则开始深刻反思LLM-as-a-Judge的局限性，呼吁回归真实世界验证。\n\n---\n\n### 记忆的进化：从个体回溯到跨用户共享\n*本主题关注如何为Agent构建更高效、持久且安全的记忆系统，解决长期交互中的灾难性遗忘与上下文爆炸问题。*\n\n- **LifeMem** 提出了一种终身学习框架，通过聚类交互轨迹提取可复用技能，解决了LLM Agent跨环境知识迁移和灾难性遗忘问题。在1万多个任务上的实验表明，该方法能有效整合结构相似的轨迹，实现跨任务的高效经验复用。**(2609.12655 [cs.CL])**\n- **CueMem** 受自传体记忆重构启发，将提取的记忆记录视为检索线索而非独立证据，通过图结构重构查询相关的对话上下文。该方法在大幅减少输入Token和延迟的同时，显著提升了长期对话问答的准确性。**(2609.12354 [cs.CL])**\n- **AIM** 针对多用户多Agent系统提出隐私感知的互操作记忆框架，动态区分私有与公共知识并在索引级实施访问控制。配合首个多用户记忆基准**MUMBench**，实现了96%的可见性分类准确率，兼顾了隐私保护与知识共享。**(2609.12320 [cs.LG])**\n\n### 跨越数字鸿沟：具身智能与领域专精代理\n*本主题探讨Agent如何走出纯文本沙盒，在物理世界、可穿戴设备及海量多模态数据中发挥实质作用。*\n\n- **Agent as Policy (AGP)** 证明了通用Agent无需特定训练即可直接驱动物理机器人。**AGP**将任务规划与执行交由Agent控制，通过视觉解释、编写程序和运动指令的闭环交互，在积木搭建等真实操作中达到100%成功率。**(2609.12541 [cs.CL])**\n- **Affective Agent** 提出面向可穿戴设备的三层个性化干预推理架构，结合亚十亿参数语言模型与生理信号，在设备端实现闭环干预。该架构通过**结构化记忆演化**适应用户，无需云端依赖或按用户重训。**(2609.12322 [cs.LG])**\n- **VideoXAgent** 针对长视频理解中的“大海捞针”问题，提出纯在线Agent框架。通过按需调用异构专家工具并执行预算感知控制，在仅使用约15%上下文的情况下，匹配甚至超越了密集帧基线的表现。**(2609.12818 [cs.AI])**\n- **Reality Is the Final Verifier** 提出**双缺口框架**，指出需求与模型近似误差是Agent软件工程失败的根源。文章主张将目标从“闭合缺口”转向“持续缩小”，强调现实部署是最终的验证者。**(2609.12039 [cs.AI])**\n\n### 祛魅与重构：重新定义Agent评估基准\n*本主题聚焦当前Agent评估方法的盲区，揭示LLM评委的失效边界及复杂交互场景的测试挑战。*\n\n- **GAUGE** 揭示了在任务导向Agent评估中，LLM-as-a-Judge存在严重的**满意度-成功鸿沟**：57.5%被评分为“满意”的对话实际上未能完成任务。研究指出该评估门控在强模型间失去分辨率，并提出了“先校准后信任”的补救策略。**(2609.12191 [cs.CL])**\n- **MP-Bench** 是首个专门评估语音Agent在多方对话中表现的标准。评估发现，当前实时语音Agent在多方理解上准确率不足22%，在多方轮次把握上接近随机，暴露了复杂群聊场景下的巨大挑战。**(2609.13076 [cs.CL])**\n- **VRL-Bench** 在有限尝试预算下评估Agent的试错学习能力。研究发现基于语言记忆的反思方法可能反而降低成功率，揭示了利用经验与持续探索之间的权衡，并提出**VEX²**调度器实现稳定增益。**(2609.12404 [cs.AI])**\n\n### 工具与工作流：从Bash极简主义到自适应编排\n*本主题关注Agent如何更好地使用工具和合成工作流，从接口选择到动态修复机制。*\n\n- **RIPPLE** 针对提示词策略编辑中的“局部编辑引发全局涟漪”问题，提出将编辑位置与组合安全性分离的框架。通过重放机制诊断失败轨迹并验证编辑在组合后的安全性，将工作流合成的验证成功率提升了23.1%。**(2609.12127 [cs.CL])**\n- **Earth-Agent-Pro** 面向真实世界地球观测的全链路Agent框架，采用执行自适应的**Plan-and-Execute**架构。通过工作流中心化结构记忆和联合适配器调优，在开放世界执行任务上大幅超越ReAct基线。**(2609.12533 [cs.CL])**\n- **Is Bash All You Need?** 通过实证研究挑战了专用工具的必要性，发现纯**Bash**接口在企业任务中优于类型化工具，不仅得分高出21.8-24.5个百分点，还能节省19-72%的Token。**(2609.11999 [cs.CL])**\n\n### 训练范式革新：内化专家与长视界信用分配\n*本主题探讨如何更高效地训练Agent，包括参数高效微调的优化与长序列决策的信用分配。*\n\n- **BQ-LoRA** 提出基于**行为商空间**的低秩适配框架，解决单一LoRA从多样化轨迹学习时的冗余更新和秩预算溢出问题。通过行为商平衡和决策保持压缩，在不增加路由开销的情况下有效整合异构交互能力。**(2609.12896 [cs.LG])**\n- **GACA** 针对长视界RL中GRPO无法进行细粒度信用分配的问题，提出无critic的粒度自适应估计器。该方法基于不确定性关键性代理，根据每步的负对数似然动态调整步级与回合级优势的混合权重，显著提升了任务成功率。**(2609.12424 [cs.LG])**\n- **Rivet** 研究如何将路由的LLM专家能力内化到紧凑推理器中。通过**专家增强强化学习**和验证轨迹内化，在移除专家后，4B模型的准确率仍提升了6.49个百分点，证明了协作结构内化的有效性。**(2609.12578 [cs.AI])**\n\n---\n\n### 今日看点\n\n- **评估体系的集体反思**：今天多篇论文直击Agent评估痛点。GAUGE戳破了LLM-as-Judge的“满意度幻觉”，VRL-Bench揭示了“反思可能有害”，而“Reality Is the Final Verifier”则从哲学高度指出预部署评估的局限性。这表明社区正从盲目刷分转向追求真实、严谨的落地验证。\n- **记忆架构的升维**：从LifeMem的跨环境技能复用，到CueMem的线索重构，再到AIM的多用户隐私隔离，Agent的记忆系统正从简单的KV存储向具备语义抽象、图结构重构和权限管理的复杂知识库演进。\n- **“极简主义”工具接口的胜利**：Is Bash All You Need? 的结论令人侧目——纯Bash竟然击败了精心设计的类型化工具。这暗示着在强模型时代，赋予Agent更底层、更灵活的执行权限，可能比将其限制在预定义工具箱中更高效。\n- **长视界RL的精细化破局**：GACA和BQ-LoRA分别从时间维度（信用分配）和参数维度（LoRA更新）解决了长轨迹训练的痛点，标志着Agent训练正从粗放的回合级反馈向精细化的状态级对齐迈进。", "2026-09-11": "### 今日AI论文速览 (2026-09-11)\n\n今天的AI研究前沿呈现出一个清晰的宏观趋势：**智能体正从“单次任务执行”向“长周期、自我演进的自主系统”进化**。无论是通过负向自我蒸馏实现无监督学习，还是在工业级推荐系统、化学发现等垂直领域实现端到端自动化，研究的焦点都在向长时序记忆、运行时优化和持续学习能力倾斜。此外，具身智能在突发物理危险下的反应评估，以及递归自我改进（RSI）路线图的提出，标志着AI正逼近下一个能力跃迁的临界点。\n\n---\n\n### 突破有监督的局限：大模型的自我进化与负向学习\n\n- **Negative Self-Distillation (NSD)** 提出了一种全新的自我改进范式，通过让模型“避开”错误推理而非模仿标准答案来进行学习。该方法通过动态门控机制分离推理关键token与基础语言token，解决了传统**OPSD**强制模仿带来的不确定性抑制问题，在复杂推理任务上显著超越基线。**(2609.11699 [cs.CL])**\n- 论文提出了**递归自我改进 (RSI)**的概念与发展路线图，从改进执行自主性一路延伸至递归元改进。文章引入**Headroom-Closed Index (HCI)**来揭示现有LLM的瓶颈，并探讨了RSI在科学发现、具身智能等场景下迈向“人类构建的最后一个AI”的关键挑战。**(2609.11873 [cs.CL])**\n- 针对运筹学（OR）问题，提出了**SOLID**框架，利用求解器自身生成的伪参考工件进行无评估者的在线自我蒸馏。该方法通过聚类目标函数和组相对优势，实现了密集的自我监督，打破了传统方法对人类验证或外部评估器的依赖。**(2609.09957 [cs.AI])**\n\n### 走向垂直领域：工业级与科学发现的自主智能体\n\n- **Auto-RecSys** 是一个面向工业级推荐模型的长周期自主研究系统。它通过分布式异步执行、跨服务器集中记忆以及认知与程序分离设计，解决了长反馈循环和系统脆弱性问题，其双循环自演化架构大幅减少了人工干预。**(2609.10922 [cs.CL])**\n- **MAPLE** 结合了语言建模与进化搜索，旨在通过自然语言请求动态维护和更新运筹优化问题。它通过保留可执行状态和候选解，在处理动态变化的业务约束时，实现了跨迭代的快速适应与搜索信息复用。**(2609.11636 [cs.AI])**\n- **ARCHE** 是一个用于化学反应机理发现的自主智能体系统。它集成了通用推理模型与专业计算化学工具，能够自主生成假设、编排计算工作流并基于证据进行闭环迭代验证，在多个复杂催化反应中展示了强大的自主发现能力。**(2609.11147 [cs.AI])**\n\n### 效率与鲁棒性并重：智能体运行时与技能优化\n\n- **COBRA-Skills** 将智能体技能优化形式化为预算约束下的序列优化问题。通过结合上下文老虎机引导的优先级评估与基于证据的技能演化，该方法在仅用50个样本的情况下，将优化成本降低了55-58%，同时保持顶尖性能。**(2609.11682 [cs.AI])**\n- 针对智能体工作流的尾部延迟问题，提出了一种尾风险感知的轮次释放调度方法。该方法利用**均值-条件风险价值 (CVaR)**目标，解耦了“就绪”与“释放”，在高负载争用下实现了高达3.5倍的P95流程时间加速。**(2609.10964 [cs.AI])**\n- **Ecdysis** 框架通过区分模型特定缺陷与系统性工具包缺陷，解决了智能体运行时演化中的过拟合问题。其跨实例失败聚合和**Failure-Driven Collaborative Refinement**机制，在提升18.56%推理准确率的同时，将训练速度提高了1.84倍。**(2609.11677 [cs.AI])**\n\n### 跨越长周期鸿沟：深度研究与持久记忆机制\n\n- **Mr.LHDR** 是一个针对多模态真实世界长周期深度研究的基准测试。它要求智能体在平均深度达10.4的依赖链上进行推理，结果表明，即使最强系统准确率也仅为43.1%，揭示了当前模型在持续、依赖一致的证据整合上存在严重瓶颈。**(2609.11318 [cs.AI])**\n- 提出了**环境探测策展**机制，通过赋予异步策展智能体只读的世界工具权限，来验证和刷新候选记忆。该部署兼容的扩展无需重新训练，成功将GitHub Copilot在CLBench上的通过率从39%提升至73%，同时降低了任务成本。**(2609.11060 [cs.AI])**\n- 超越单一任务成功，提出了**操作弹性**与**考虑周全的参与**两个评估维度，以衡量智能体在累积挑战下的表现。研究发现，随着挑战增加，智能体会从自主恢复转向依赖人类，并在内部报告中表现出负面情绪，揭示了部署中的五大困境。**(2609.10724 [cs.AI])**\n- **T1** 是一个122B参数的MoE模型，专门针对终端长周期任务进行强化学习训练。通过**TITO**构造和**R3** rollout路由重放技术，解决了MoE训练中的token漂移问题，在Terminal-Bench 2.1上达到64.0%的解决率，超越GPT-5.4。**(2609.11042 [cs.AI])**\n\n### 具身智能的试金石：物理反应与持续学习验证\n\n- 针对具身智能体的持续学习，提出了一种更新准入审计协议。研究发现，传统的基于范围的置信度门控会拒绝有用的更新，而**配对二项式构造**和认证历史参考提升能在控制错误的同时保留学习机会，揭示了验证与学习之间的深层张力。**(2609.10873 [cs.AI])**\n- **ReactHuman** 是首个基于物理的类人反应决策基准，要求多模态大模型作为人形机器人的大脑应对突发家庭危险。评估显示，模型在约1/3的危险中处理不当，且盲目信任外观而非运动轨迹，证明反应性安全无法仅靠模型规模扩展来解决。**(2609.10895 [cs.AI])**\n\n---\n\n### 今日看点\n\n- **趋势观察：长周期智能体成为核心战场**。今天多达4篇论文聚焦长周期任务与记忆机制（如T1、Mr.LHDR、Grounding Agent Memory）。研究界已敏锐地意识到，单次推理能力已接近天花板，真正的突破点在于智能体能否在数百次工具调用和深度依赖链中保持状态一致性与记忆的准确性。\n- **颠覆性观点：“向错误学习”优于“向标准答案模仿”**。NSD论文直击当前On-Policy Self-Distillation的痛点，指出强制模仿特权信息会扼杀模型的不确定性表达和探索能力。这种“负向学习”范式通过隔离并规避错误推理token，为无监督自我改进提供了极具潜力的新路径。\n- **跨界融合：AI Agent 正在重塑传统科学工业界**。ARCHE 在化学机理发现中的应用，以及 Auto-RecSys 在工业级推荐系统中的自动化研究，展示了 LLM Agent 从“玩具任务”向高门槛、长反馈周期的专业领域深度渗透。这预示着“AI作为科研同事”正从概念走向工程落地。\n- **潜力技术：运行时调度与技能演化的工程化突破**。Ecdysis 和 Decoupling Readiness 论文将注意力转移到了 Agent 的底层执行效率上。通过 CVaR 控制尾部延迟、跨实例失败聚合来优化 Harness，这些底层系统级优化技术将是未来支撑大规模 Agent 集群稳定、低成本运行的基石。", "2026-09-10": "### 今日AI论文速览 (2026-09-10)\n\n今天的AI研究前沿正全面向“长周期、跨环境”的复杂智能体能力演进。从跨设备GUI交互到结构化与非结构化数据的混合检索，研究者们正致力于打破单一环境与模态的限制。同时，如何通过更精细的强化学习奖励机制、异步RL优化以及有效的记忆与知识复用架构，来提升智能体在多步任务中的稳定性和推理能力，成为了当下的核心命题。\n\n---\n\n### 记忆与知识复用：如何为长周期智能体“减负”？\n\n- 针对长期智能体外部记忆中原子记忆的冗余与冲突问题，提出了**ROAM**框架。该方法通过将输入与存储的记忆对分类为独立、等价、包含或冲突关系，组织成主要的**Primary**和辅助的**Evidence**角色，并仅检索Primary视图来回答问题，有效防止了过时信息的干扰，将回答准确率提升了高达29.8个百分点。**(2609.09778 [cs.CL])**\n- 探讨了在长周期任务中复用知识库的最佳方式，对比了将技能包加载入上下文与作为**子智能体**调用的效果。研究发现，当技能包具有明确的输入输出契约时，通过生成全新上下文窗口执行子任务的子智能体方法能显著缓解上下文退化问题，表现优于传统的技能执行方式，代价是增加了通信开销。**(2609.09233 [cs.CL])**\n\n### 强化学习与优化：破解多轮交互与异步训练的瓶颈\n\n- 提出了**SocialRL**多轮强化学习框架，旨在优化LLM在长对话中平衡目标推进与关系维护的社交智能。该框架利用**PPO**传播延迟奖励以实现长视野规划，并设计了包含目标推进、关系协调等六个维度的过程奖励模型，结合阶段感知的权重调度策略，使目标达成率平均提升了9.2个百分点。**(2609.09764 [cs.CL])**\n- 针对异步强化学习中策略滞后导致评论家偏向陈旧行为策略的问题，提出了**BRACE**（锚定贝尔曼残差校正）。该方法将校正范围限制在策略token前缀，并对尾部进行常数权重蒙特卡洛锚定，成功将策略校正与奖励传播分离，在提升性能的同时比同步训练快2.46倍。**(2609.09783 [cs.AI])**\n- 探索了在低预算黑盒优化中，智能体通过代码自博弈学习搜索策略并将其蒸馏为文本框架的可行性。研究生成的仅197词的**Harness A**文本，不仅将Gemini Flash的遗憾值降低了48%，还能跨模型迁移至Claude Sonnet并保持显著效果，证明了语言作为可移植策略部署媒介的巨大潜力。**(2609.09468 [cs.LG])**\n\n### 研究智能体与评估：超越单一得分，直面真实世界复杂性\n\n- 推出了首个要求同时结合网络搜索和SQL查询的深度研究基准**HybridDeepResearch**。该基准包含380个工具依赖型任务，评估发现即使是最先进的模型（如GPT-5、Claude-Sonnet-4.6）在困难子集上的**Pass@8**也仅为50-54%，揭示了在结构化与非结构化信息空间之间无损传递约束仍是智能体系统的重大挑战。**(2609.09410 [cs.CL])**\n- 引入了滚动基准**RAP**（研究注意力预测），用于评估LLM研究智能体追踪研究趋势变化的能力。测试表明，大多数诊断模型的表现甚至不如简单的指数加权移动平均（**EWMA**）基线，研究揭示了智能体在获取证据时存在的“目标条件偏差”以及状态携带与直接预测之间的性能反转现象。**(2609.10092 [cs.CL])**\n- 提出了**发现认证协议（DCP）**，主张仅凭得分无法证明AI研究智能体的真实发现能力。DCP将结果声明转化为可执行的恢复和反馈测试，通过密封评估、恢复见证和核心否决等机制，为AI研究智能体的有用结果、替代路径和反馈效应提供了一套通用的证据语言。**(2609.09219 [cs.AI])**\n\n### 具身与GUI智能体：跨越平台与物理边界的交互\n\n- 推出了动态基准**JarvisGUI**，用于评估GUI智能体在跨设备（Android、Windows、Ubuntu）工作流中的协调能力。通过将GUI任务形式化为轻量级类型系统下的输入输出转换，该基准暴露出现有SOTA开源GUI智能体在状态转移感知、跨平台上下文推理和长周期依赖管理方面的严重能力缺陷。**(2609.10451 [cs.AI])**\n- 提出了**Show-Harness**具身框架，使基础视觉语言模型（VLM）能够通过紧凑的语义接口直接“扮演”机器人。该接口暴露离散语义动作单元，由VLM负责细粒度物理决策，不仅实现了前沿闭源VLM的零样本机器人控制，还能通过少量微调适配开源VLM，无需昂贵的具身预训练。**(2609.10522 [cs.AI])**\n- 关注网络实验中AI智能体修改实验记录的可靠性，提出了**工件完整性**的概念。通过引入**NetArtifactBench**基准，测试智能体修复不一致记录的能力，结果发现尽管智能体局部修正的通过率尚可，但在需要恢复隐含关系并跨工件传播更改时，没有任何智能体运行时的通过率超过30%。**(2609.09849 [cs.AI])**\n\n---\n\n### 今日看点\n\n- **趋势观察：“长周期与跨环境”成为智能体能力的试金石。** 今天的多篇论文（JarvisGUI, HybridDeepResearch, Subagents vs Agent Skills）都在指出同一个问题：单设备、单轮、单模态的评估已过于乐观。未来的智能体必须解决跨平台状态同步、长上下文退化以及结构化/非结构化数据混合推理的难题。\n- **颠覆性观点：“得分不等于发现”。** DCP协议提出了一个深刻的观点：在AI研究智能体领域，仅仅达到某个数值目标不足以证明其发现了有效方法，必须通过严格的恢复测试排除“碰运气”或“记忆”的可能。这为评估AI科研能力设定了更高的科学严谨性标准。\n- **潜力技术：语义接口与文本策略蒸馏。** Show-Harness证明了正确的语义接口能让现成的VLM直接控制机器人，而Self-Play in Code则证明了可以通过代码自博弈提炼出197词的文本策略来指导黑盒优化。这两项研究都暗示，与其盲目扩大模型参数，不如在“接口设计”和“知识表征”上发力，以极低成本解锁强大的泛化能力。"};

                filters.clear();
            } else if (filters.has(tagName)) {
                filters.delete(tagName);
            } else {
                filters.add(tagName);
            }
            renderPapers();
        }

        // Check if paper matches active tag filters for its date
        function paperMatchesFilters(paper, date) {
            const filters = activeTagFilters[date];
            if (!filters || filters.size === 0) return true;
            if (filters.has(paper.cluster)) return true;
            return (paper.tags || []).some(tag => filters.has(tag));
        }

        // 加载更多日期的数据
        async function loadMoreDates() {
            if (isLoadingMore) return;

            const unloadedDates = getUnloadedDates();
            if (unloadedDates.length === 0) {
                showSimpleToast('已加载全部数据');
                return;
            }

            isLoadingMore = true;
            const loadBtn = document.getElementById('load-more-btn');
            if (loadBtn) {
                loadBtn.disabled = true;
                loadBtn.innerHTML = '<span class="animate-spin inline-block mr-2">⏳</span>加载中...';
            }

            const datesToLoad = unloadedDates.slice(0, LOAD_MORE_DAYS);
            let loadedCount = 0;

            for (const date of datesToLoad) {
                try {
                    const response = await fetch(`data/${date}.json?v=${DATA_VERSION}`);
                    if (!response.ok) continue;

                    const dateData = await response.json();

                    // 将数据添加到 allPapers
                    allPapers[date] = dateData.clusters;
                    allPaperTags[date] = dateData.tags;

                    // 添加每日速览
                    if (dateData.overview) {
                        dailyOverviews[date] = dateData.overview;
                    }

                    loadedDates.add(date);
                    loadedCount++;
                } catch (e) {
                    console.error(`加载 ${date} 数据失败:`, e);
                }
            }

            isLoadingMore = false;

            if (loadedCount > 0) {
                renderPapers();
                showSimpleToast(`已加载 ${loadedCount} 天的数据`);
            }

            updateLoadMoreButton();
        }

        // 更新"加载更多"按钮状态
        function updateLoadMoreButton() {
            const loadBtn = document.getElementById('load-more-btn');
            const unloadedCount = getUnloadedDates().length;

            if (loadBtn) {
                if (unloadedCount === 0) {
                    loadBtn.style.display = 'none';
                } else {
                    loadBtn.style.display = 'inline-flex';
                    loadBtn.disabled = false;
                    loadBtn.innerHTML = `📥 加载更多 (还有 ${unloadedCount} 天)`;
                }
            }
        }

        // 加载窗口外（两周前）被收藏论文所在日期的数据，使其能在信息流中内联显示。
        // 这些日期的数据文件一直保留在 data/ 下，这里按需 fetch 进来；渲染时
        // createPaperHTML 会把窗口外日期里未收藏的论文隐藏，只留下收藏的那几篇。
        async function loadArchivedStarredDates() {
            if (!starredPapers || starredPapers.size === 0) return;
            const datesToLoad = new Set();
            starredPapers.forEach(aid => {
                const date = paperDateIndex[aid];
                if (date && !windowDateSet.has(date) && !loadedDates.has(date)) {
                    datesToLoad.add(date);
                }
            });
            if (datesToLoad.size === 0) return;

            let loadedCount = 0;
            for (const date of datesToLoad) {
                try {
                    const response = await fetch(`data/${date}.json?v=${DATA_VERSION}`);
                    if (!response.ok) continue;
                    const dateData = await response.json();
                    allPapers[date] = dateData.clusters;
                    allPaperTags[date] = dateData.tags;
                    if (dateData.overview) {
                        dailyOverviews[date] = dateData.overview;
                    }
                    loadedDates.add(date);
                    loadedCount++;
                } catch (e) {
                    console.error(`加载收藏日期 ${date} 数据失败:`, e);
                }
            }
            if (loadedCount > 0) {
                renderPapers();
            }
        }

        // 从localStorage加载状态
        function loadState() {
            const starred = localStorage.getItem('starred_papers');
            const read = localStorage.getItem('read_papers');
            const deleted = localStorage.getItem('deleted_papers');
            const summaryLang = localStorage.getItem('summary_language');

            if (starred) starredPapers = new Set(JSON.parse(starred));
            if (read) readPapers = new Set(JSON.parse(read));

        // 保存状态到localStorage
        function saveState() {

            localStorage.setItem('read_papers', JSON.stringify([...readPapers]));
            localStorage.setItem('deleted_papers', JSON.stringify([...deletedPapers]));

        // 显示撤销删除的Toast
        function showUndoToast(message, seconds, onUndo, onExpire) {
            const toast = document.getElementById('undo-toast');
            const msgEl = document.getElementById('toast-message');
            const cdEl = document.getElementById('countdown');
            const undoBtn = document.getElementById('undo-btn');

            msgEl.textContent = message;
            let remaining = seconds;
            cdEl.textContent = `(${remaining}s)`;
            toast.classList.remove('hidden');

            let intervalId = setInterval(() => {
                remaining -= 1;
                cdEl.textContent = `(${remaining}s)`;
                if (remaining <= 0) {
                    clearInterval(intervalId);
                    toast.classList.add('hidden');
                    try { onExpire && onExpire(); } catch (e) {}
                }
            }, 1000);

            let expireTimer = setTimeout(() => {
                clearInterval(intervalId);
                toast.classList.add('hidden');
                try { onExpire && onExpire(); } catch (e) {}
            }, seconds * 1000);

            const cleanup = () => {
                clearInterval(intervalId);
                clearTimeout(expireTimer);
                toast.classList.add('hidden');
            };

            const onUndoClick = () => {
                cleanup();
                try { onUndo && onUndo(); } catch (e) {}
            };

            undoBtn.removeEventListener('click', onUndoClick);
            undoBtn.addEventListener('click', onUndoClick);
        }

        // 显示简单的提示信息
        function showSimpleToast(message) {

            toast.textContent = message;

            document.body.appendChild(toast);

            // 3秒后自动消失
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // 删除论文
        function deletePaper(arxivId, title) {
            const paperEl = document.querySelector(`[data-arxiv-id="${cssEscape(arxivId)}"]`);
            if (!paperEl) return;
            const listItem = paperEl.closest('li');
            const sectionEl = paperEl.closest('section[data-date-section]');

            paperEl.style.transition = 'all 0.3s ease-out';

            paperEl.style.opacity = '0.5';

            setTimeout(() => {
                // 立即删除并保存状态
                deletedPapers.add(arxivId);

                // 移除DOM元素
                if (listItem) {
                    listItem.remove();
                } else {
                    paperEl.remove();
                }

                updateDateSection(sectionEl);
                updateStats();
                buildToc();

        // 切换星标状态
        function toggleStar(arxivId) {
            if (starredPapers.has(arxivId)) {
                starredPapers.delete(arxivId);
            } else {
                starredPapers.add(arxivId);

            saveState();

            // 如果当前是只看收藏模式，或这篇属于窗口外（两周前）日期，则重新渲染：
            // 窗口外的论文取消收藏后应立即隐藏，新收藏的则应立即出现。
            const paperDate = (paperDataMap[arxivId] && paperDataMap[arxivId].date)
                || paperDateIndex[arxivId];
            if (showOnlyStarred || (paperDate && !windowDateSet.has(paperDate))) {
                renderPapers();

        // 切换摘要语言
        function toggleSummaryLanguage() {

            toggleBtn.textContent = showChineseSummary ? '中文摘要' : 'English Summary';

        // 更新统计信息
        function updateStats() {
            const visiblePapers = document.querySelectorAll('.paper-item:not(.hidden-paper)').length;
            document.getElementById('total-papers').textContent = visiblePapers;
        }

        function updateDateSection(sectionEl) {
            if (!sectionEl) return;
            const totalPapers = sectionEl.querySelectorAll('.paper-item').length;
            const header = sectionEl.querySelector('[data-date-heading]');

            if (header) {

        // 可折叠功能
        function toggleCollapsible(header) {
            const content = header.nextElementSibling;
            const isOpen = header.classList.contains('open');

            if (isOpen) {
                header.classList.remove('open');
                content.classList.remove('open');
            } else {
                header.classList.add('open');
                content.classList.add('open');
                // Commit the disclosure state before doing any text layout.
                renderMarkdownAfterPaint(content);
            }
        }

        // Map of element ID -> raw markdown content for lazy rendering
        const mdRawContent = {};

        // Register raw markdown content for lazy rendering
        function registerMarkdown(id, content) {
            if (id && content) mdRawContent[id] = content;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function escapeJsSingleQuotedAttr(value) {
            return escapeHtml(String(value ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n')
                .replace(/\u2028/g, '\\u2028')
                .replace(/\u2029/g, '\\u2029'));
        }

        function safePathSegment(value) {
            return encodeURIComponent(String(value ?? ''));
        }

        function cssEscape(value) {
            const text = String(value ?? '');
            if (window.CSS && typeof CSS.escape === 'function') return CSS.escape(text);
            return text.replace(/["\\]/g, '\\$&');
        }

        function escapeMarkdownHtml(value) {
            return String(value ?? '').replace(/[&<>]/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;'
            }[ch]));
        }

        function sanitizeRenderedMarkdown(root) {
            root.querySelectorAll('script, style, iframe, object, embed, svg, math').forEach(el => el.remove());
            root.querySelectorAll('*').forEach(el => {
                [...el.attributes].forEach(attr => {
                    if (/^on/i.test(attr.name) || /^(style|srcdoc|srcset)$/i.test(attr.name)) {
                        el.removeAttribute(attr.name);
                    }
                });
            });
            root.querySelectorAll('img[src]').forEach(img => {
                if (!/^(https?:|[/])/i.test(img.getAttribute('src') || '')) img.removeAttribute('src');
            });
            root.querySelectorAll('a[href]').forEach(link => {
                const href = link.getAttribute('href') || '';
                if (!/^(https?:|mailto:|#|[/])/i.test(href)) {
                    link.removeAttribute('href');
                }
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            });
        }

        function renderMathEl(el) {
            if (!el || el.getAttribute('data-math-rendered')) return;
            if (typeof renderMathInElement !== 'function') return;
            try {
                renderMathInElement(el, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '\\[', right: '\\]', display: true },
                        { left: '\\(', right: '\\)', display: false },
                        { left: '$', right: '$', display: false }
                    ],
                    throwOnError: false,
                    strict: 'ignore',
                    ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
                });
                el.setAttribute('data-math-rendered', '1');
            } catch (e) {
                console.warn('公式渲染失败:', e);
            }
        }

        // Parse markdown for a single element by id
        function renderMarkdownEl(el) {
            if (!el || el.getAttribute('data-rendered')) return;
            const raw = mdRawContent[el.id];
            if (raw) {
                try {
                    // Escape only raw HTML tokens. Pre-escaping Markdown double-escapes
                    // code fences and destroys blockquotes and comparison operators.
                    const renderer = new marked.Renderer();
                    renderer.html = token => {
                        const text = typeof token === 'string' ? token : token.text;
                        return /^<br\s*\/?>$/i.test(text.trim()) ? '<br>' : escapeMarkdownHtml(text);
                    };
                    const template = document.createElement('template');
                    template.innerHTML = marked.parse(raw, { renderer });
                    sanitizeRenderedMarkdown(template.content);
                    el.replaceChildren(template.content);
                    // This element belongs to the section the reader just opened;
                    // closed sections remain untouched until their first expansion.
                    renderMathEl(el);
                } catch (e) { el.textContent = raw; }
                el.setAttribute('data-rendered', '1');
            }
        }

        // Parse markdown for all unrendered .markdown-content elements inside a container
        function lazyRenderMarkdown(container) {
            if (typeof marked === 'undefined') return;
            container.querySelectorAll('.markdown-content:not([data-rendered])').forEach(el => {
                if (el.style.display !== 'none') renderMarkdownEl(el);
            });
        }

        // Run work after a browser paint. Two animation frames are intentional: the
        // first commits the interaction feedback, and the second starts follow-up work.
        function afterNextPaint(callback) {
            requestAnimationFrame(() => requestAnimationFrame(callback));
        }

        // Serialize markdown work across animation frames. This is especially
        // important when "expand today's papers" reveals many cards at once.
        const markdownRenderQueue = [];
        let markdownRenderScheduled = false;

        function drainMarkdownRenderQueue() {
            if (markdownRenderScheduled || markdownRenderQueue.length === 0) return;
            markdownRenderScheduled = true;
            afterNextPaint(() => {
                markdownRenderScheduled = false;
                const container = markdownRenderQueue.shift();
                if (container) {
                    container.removeAttribute('data-render-queued');
                    if (container.isConnected &&
                        (!container.classList.contains('collapsible-content') ||
                         container.classList.contains('open'))) {
                        lazyRenderMarkdown(container);
                    }
                }
                drainMarkdownRenderQueue();
            });
        }

        // Keep markdown parsing and the resulting text layout out of the click frame.
        function renderMarkdownAfterPaint(container) {
            if (!container || typeof marked === 'undefined') return;
            const pending = container.querySelectorAll('.markdown-content:not([data-rendered])');
            if (!pending.length) return;
            if (container.getAttribute('data-render-queued') === '1') return;
            container.setAttribute('data-render-queued', '1');
            markdownRenderQueue.push(container);
            drainMarkdownRenderQueue();
        }

        function hasMeaningfulText(value) {
            return typeof value === 'string' && value.trim().length > 0;
        }

        function splitMethodologySections(value) {
            const result = { pipeline: '', math: '', experiments: '' };
            if (!hasMeaningfulText(value)) return result;

            const text = String(value).replace(/\r\n?/g, '\n');
            const headingPattern = /^[ \t]*(?:#{1,6}[ \t]*)?§[ \t]*(5|6|7)\b[^\n]*\n?/gm;
            const matches = [...text.matchAll(headingPattern)];
            if (matches.length === 0) {
                result.pipeline = text.trim();
                return result;
            }

            const keyBySection = { '5': 'pipeline', '6': 'math', '7': 'experiments' };
            matches.forEach((match, index) => {
                const key = keyBySection[match[1]];
                if (!key) return;
                const start = match.index + match[0].length;
                const end = index + 1 < matches.length ? matches[index + 1].index : text.length;
                const body = text.slice(start, end).trim();
                if (body) result[key] = body;
            });

            const prefix = text.slice(0, matches[0].index).trim();
            if (prefix) result.pipeline = `${prefix}

${result.pipeline}`.trim();
            return result;
        }

        // Render markdown only for currently visible (open) sections
        function renderVisibleMarkdown() {
            if (typeof marked === 'undefined') return;
            marked.setOptions({ breaks: true, gfm: true, headerIds: false, mangle: false });
            // Render open collapsible sections
            document.querySelectorAll('.collapsible-content.open').forEach(c => lazyRenderMarkdown(c));
            // Render overview sections (top-level, not inside collapsible)
            document.querySelectorAll('.markdown-content:not([data-rendered])').forEach(el => {
                if (!el.closest('.collapsible-content')) renderMarkdownEl(el);
            });
        }

        // 创建论文HTML
        function formatAuthorsWithAffiliations(authorsStr, affiliationsStr) {
            if (!affiliationsStr) return escapeHtml(authorsStr);
            try {
                // 解析 JSON（可能被包在 ```json ... ``` 中）
                let jsonStr = affiliationsStr;
                const match = jsonStr.match(/```json\s*([\s\S]*?)\s*```/);
                if (match) jsonStr = match[1];
                const objMatch = jsonStr.match(/\{[\s\S]*\}/);
                if (objMatch) jsonStr = objMatch[0];
                const data = JSON.parse(jsonStr);

                // 兼容旧格式（数组）
                if (Array.isArray(data)) {
                    const authors = authorsStr.split(/,\s*/);
                    const affMap = {};
                    data.forEach(a => { if (a.name && a.affiliation) affMap[a.name.trim().toLowerCase()] = a.affiliation; });
                    return authors.map(a => {
                        const aff = affMap[a.trim().toLowerCase()];
                        return aff
                            ? `${escapeHtml(a.trim())}<sup class="aff-sup" title="${escapeHtml(aff)}">${escapeHtml(aff)}</sup>`
                            : escapeHtml(a.trim());
                    }).join(', ');
                }

                if (!data.authors || !data.institutions) return escapeHtml(authorsStr);

                // 新格式：论文式数字角标
                const instMap = {};
                data.institutions.forEach(inst => { instMap[inst.id] = inst.name; });

                // 渲染作者行
                const authorParts = data.authors.map(a => {
                    let sups = [];
                    if (a.affiliations && a.affiliations.length > 0) {
                        sups = sups.concat(a.affiliations.map(String));
                    }
                    if (a.markers && a.markers.length > 0) {
                        sups = sups.concat(a.markers);
                    }
                    const supValues = sups.map(escapeHtml).join(',');
                    const supStr = sups.length > 0
                        ? `<sup class="aff-sup">${supValues}</sup>`
                        : '';
                    return `${escapeHtml(a.name)}${supStr}`;
                });

                // 渲染机构列表
                const instLine = data.institutions.map(inst =>
                    `<sup class="aff-sup">${escapeHtml(inst.id)}</sup>${escapeHtml(inst.name)}`
                ).join('&ensp;');

                // 渲染脚注
                let footLine = '';
                if (data.footnotes && data.footnotes.length > 0) {
                    footLine = data.footnotes.map(fn =>
                        `<sup class="aff-sup">${escapeHtml(fn.marker)}</sup>${escapeHtml(fn.text)}`
                    ).join('&ensp;');
                }

                let html = authorParts.join(', ');
                html += `<div class="text-xs text-slate-500 dark:text-slate-400 mt-1">${instLine}</div>`;
                if (footLine) {
                    html += `<div class="text-xs text-slate-400 dark:text-slate-500 mt-0.5 italic">${footLine}</div>`;
                }
                return html;
            } catch (e) {
                return escapeHtml(authorsStr);
            }
        }

        // Store paper data by arxiv_id for lazy detail building
        const paperDataMap = {};

        function createPaperHTML(paper, date) {
            const aid = String(paper.arxiv_id ?? '');
            const aidHtml = escapeHtml(aid);
            const aidArg = escapeJsSingleQuotedAttr(aid);
            const titleHtml = escapeHtml(paper.title);
            const titleAttr = escapeHtml(paper.title);
            const dateHtml = escapeHtml(date);
            const isStarred = starredPapers.has(aid);
            const isRead = readPapers.has(aid);
            const isDeleted = deletedPapers.has(aid);

            if (isDeleted) return '';
            // 展示窗口：窗口外（两周前）的日期只展示被收藏的论文，其余隐藏。
            if (!windowDateSet.has(date) && !isStarred) return '';
            if (showOnlyStarred && !isStarred) return '';
            if (!paperMatchesFilters(paper, date)) return '';

            // Store paper data for lazy rendering
            paperDataMap[aid] = { paper, date };

            const clusterBadge = paper.cluster ? `<span class="tag-badge">${escapeHtml(paper.cluster)}</span>` : '';
            const tagBadges = (paper.tags || []).map(tag => `<span class="tag-badge tag-arxiv">${escapeHtml(tag)}</span>`).join('');

            return `
                <div class="paper-item bg-white dark:bg-slate-800/50 rounded-lg shadow-sm p-4 sm:p-6" data-arxiv-id="${aidHtml}">
                    <!-- 论文标题和操作按钮 -->
                    <div class="flex items-start justify-between mb-1">
                        <div class="flex items-start space-x-2 sm:space-x-3 flex-1 min-w-0">
                            <button class="star-button ${isStarred ? 'starred' : ''} mt-1 flex-shrink-0" onclick="toggleStar('${aidArg}')" title="点击收藏">
                                <svg class="h-5 w-5 sm:h-6 sm:w-6" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />

                            <h3 class="text-base sm:text-lg font-semibold text-black dark:text-white leading-tight break-words cursor-pointer hover:text-blue-600 dark:hover:text-blue-400 transition-colors" onclick="togglePaperDetail('${aidArg}')">${titleHtml}</h3>
                        </div>
                        <button class="delete-button text-slate-400 hover:text-red-500 ml-2 sm:ml-4 flex-shrink-0" onclick="deletePaperByButton(this)" data-arxiv-id="${aidHtml}" data-title="${titleAttr}" title="删除">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
