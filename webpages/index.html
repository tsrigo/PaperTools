he two mechanisms are effective in combination: on 200 held-out briefs from user-traffic benchmark, widening or deepening alone reaches a 49.4% / 48.6% win rate over the no-skill agent, while their combination reaches 58.5% (p = 0.025). Procedural memory offers a practical route to continual adaptation of agents under noisy, unverifiable feedback.", "category": "cs.AI", "cluster": "Skill \u0026 Memory Evolution", "tags": ["cs.AI"], "filter_reason": "这篇论文高度符合你的研究范围。其核心贡献是提出了一个用于长期智能体任务的持续适应框架，通过外部程序记忆的积累和细化来实现智能体的自我演化和技能获取。\n\n具体分析如下：\n1. 核心判断与正面指标：论文明确以“长期智能体任务”和“工具使用（230多个工具）”为研究对象。其核心机制是构建一个外部程序记忆，通过“拓宽”获取新技能和“深化”基于成功与失败经验的自我修正来演化技能库。这完美契合了你关注的“单智能体（记忆、工具使用、自我反思）”和“自我演化（通过经验、反思或环境反馈进行自我完善和迭代）”方向。此外，这种基于自然语言技能库的持续适应机制，也符合你提到的“agent harness/scaffold/runtime 的自动演化”和“技能获取”的保留标准。\n2. 排除标准校验：虽然论文的应用场景是专业图形设计，但根据你的“第四步：处理特殊和模糊情况”中的例外规则，如果论文的核心是把“自我演化”机制应用在特定领域，应予以保留。论文的重点在于提出并验证了程序记忆的演化机制，而非单纯将现成LLM作为工具解决设计问题。同时，论文不涉及安全、图结构、多智能体编排等被排除的主题。\n3. 结论：论文聚焦于 LLM 智能体在不可验证反馈下的持续适应与自我完善，属于 Agentic AI 和 Self-Evolving 的前沿研究，完全符合你的筛选要求。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决的核心问题是：如何让冻结的前沿语言模型在不更新权重、不依赖人工标注的情况下，通过用户流量持续学习专业平面设计技能。专业设计是长周期任务，需要数十个相互依赖的操作来生成结构化、可编辑的作品，且设计结果没有可靠的程序化验证标准——不像代码可以执行测试。设计需求混合了客观要求（文字、颜色、位置）与主观标准（构图、层次、风格），自动化评估器只能部分捕捉，使得监督学习需要昂贵演示，基于结果的优化则面临长周期信用分配和不完美代理奖励的双重困难。\n\n### § 2 前人工作与不足\n\n已有工作从两个方向探索了智能体的经验学习。Reflexion 和 Self-Refine 通过语言反馈在任务内迭代改进，但未研究从多用户部署流量中演化共享技能库。Voyager 在 Minecraft 中构建可执行技能库，但依赖程序化成功信号——设计领域通常没有这种确定性预言机。ACE 和 Dynamic Cheatsheet 维护演化的上下文记忆，但未引入保守的回归门控来控制部署系统的变更。这些方法的关键不足在于：要么假设存在可靠验证信号，要么未解决噪声评估器下如何避免回归的问题，而专业设计恰恰同时面临不可验证反馈和长周期信用分配的挑战。", "core_insight": "### § 3 重建作者的思考路径\n\n专业图形设计是长程任务，终端反馈无法可靠定位哪步操作导致成败，且设计没有可执行的验证器（oracle），自动评估器本身有噪声和偏差。模型通常外部托管、不可更新权重。但创意软件历来有将工作流打包为可重放例程的传统（如 Photoshop actions）。若将学习目标从权重转移到外部记忆——用自然语言描述的可复用流程——就能在不更新模型的情况下积累经验。关键难题是噪声反馈下如何避免\"改进一个请求却损害另一个\"。安全策略改进（safe policy improvement）的思路提示：变更应与已部署基线成对比较，只在无回退时准入。\n\n### § 4 核心直觉\n\n将冻结模型周围的程序性记忆作为学习对象。技能库沿两条轴演化：为反复出现的未覆盖子任务铸造新技能，用同一技能的成功与失败执行对比来修订现有技能。一个保守的 replay gate 在固定上下文中成对重放，只接受能修复失败且不导致已观察成功回退的变更。核心在于：在不可验证的反馈下，用相对比较而非绝对分数来控制什么进入部署系统。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[设计简报] -\u003E [Solver: 技能库+工具] -\u003E [渲染图像] -\u003E [Grader: 评分与失败原因]\n                                                              |\n                     +------------------------------------------+\n                     v                                          v\n          [拓宽: 聚类未覆盖子任务]                   [深化: 对比成功/失败历史]\n                     |                                          |\n                     v                                          v\n          [生成候选技能]                              [重写现有技能]\n                     |                                          |\n                     +-------------\u003E [重放门: 配对验证] \u003C--------+\n                                                                |\n                                                          [通过/拒绝]\n                                                                |\n                                                          [更新技能库]\n```\n\n系统通过离线循环进化技能库，核心步骤如下：\n- **[设计简报]**：输入来自用户流量或 LLM Prompter 的设计需求。\n- **[Solver: 技能库+工具]**：冻结的 LLM 检索技能并调用 230+ 个工具生成设计。\n- **[渲染图像]**：将中间状态渲染为图像供多模态检查。\n- **[Grader: 评分与失败原因]**：多模态评分器评估图像，给出标量奖励和未满足要求的原因。\n- **[拓宽: 聚类未覆盖子任务]**：提取未覆盖的子任务，聚类后蒸馏为新技能（§3.1）。\n- **[深化: 对比成功/失败历史]**：针对失败技能，对比成功与失败轨迹进行重写（§3.2）。\n- **[重放门: 配对验证]**：在固定上下文中对比候选技能与基线，仅允许无回归的改进通过（§3.3）。\n- **[更新技能库]**：通过验证的技能进入技能库，参与下一轮推理。\n\n### § 6 核心数学推导\n\n论文的核心数学推导在于重放门的接受标准（公式 1）：$\\nexists \\text{ prompt lost} \\land \\exists \\text{ prompt won}$。这里 $\\nexists$ 表示“不存在”，$\\exists$ 表示“存在”。该公式的直觉是：一个候选技能只有在“没有任何测试用例失败”且“至少有一个测试用例获胜”时才会被接受。这体现了保守的更新策略，确保技能更新不会牺牲已有的成功案例，类似于强化学习中的安全策略改进。\n\n此外，评分公式 $s_j = w_c \\cdot \\text{completeness} + w_a \\cdot \\text{aesthetics}$（权重 $w_c=0.7, w_a=0.3$）表明完整性比美学更重要，因为一个漂亮但偏离需求的设计是不合格的。\n\n### § 7 实验设计与结论\n\n**问题 1：外部技能库能否在不更新模型权重的情况下提升专业设计 Agent 的表现？**\n实验设计：在 1406 个简报上运行 5 轮进化，使用冻结的 Claude-Sonnet-4 等模型，在 GenEval2 等基准上对比有无技能库的表现。\n问题答案：可以。技能库从 76 增长到 139，Claude-Sonnet-4 在 GenEval2 上的执行成功率从 72.7% 提升至 99.3%。\n\n**问题 2：拓宽（增加新技能）和深化（重写旧技能）哪个更有效？**\n实验设计：进行消融实验，分别单独应用拓宽或深化，以及两者结合，在 200 个未见过的简报上测试。\n问题答案：两者单独使用效果有限，但结合使用产生了超加性效应，胜率达到 58.5%，证明了它们是互补的。\n\n**问题 3：如何确保技能更新不会引入回归？**\n实验设计：设计重放门机制，在固定上下文中配对测试候选技能与基线，仅接受无回归的更新。\n问题答案：重放门有效过滤了噪声反馈，确保了技能库的持续改进，且在多轮进化中保持了性能的稳定提升。", "additional_insights": "### § 8 阅读收获\n\n这篇论文的核心贡献是将一个冻结的前沿语言模型与外部程序记忆耦合，通过从用户流量中进化可复用的自然语言技能来持续提升专业图形设计能力，而无需更新模型权重或人工标注。技能库沿两条轴进化：widening 为反复出现的未覆盖子任务铸造新技能，deepening 通过对比成功与失败执行来修订已有技能。一个保守的 replay gate 只接受那些修复失败且不导致已有成功退化的变更，从而在噪声反馈下保证不回归。消融实验表明两个机制单独使用收益有限，组合后产生超加性效果，说明覆盖扩展与可靠性精炼是互补的。\n\n### § 9 最脆弱的假设\n\n最关键的假设是：自然语言技能描述能可靠引导冻结模型执行复杂的多步设计流程。如果模型在长流程中偏离脚本、回退到自身默认策略，整个技能库的价值就会坍缩。论文在附录 I 中实际上提供了反证：Droste 递归效果和完整 De Nigris 图案的复现均失败，模型在多步构造中途停止遵循技能指令。主实验的成功可能掩盖了这些失败，因为评测基准中的任务流程长度和几何精度要求可能低于这些边界案例。论文缺少对\"模型遵循技能的忠实度随流程步数衰减\"的系统性量化，这使得核心机制在长流程场景下的适用边界未被充分验证。\n\n### § 10 最小复现实验\n\n用 10–15 个图像编辑工具接口和一个开源 LLM（如 Qwen3-72B），构造 60–80 个简短设计任务（如\"给照片加双重曝光效果\"\"制作含文字的横幅\"）。初始技能库从 5–8 个手工编写的工作流起步，运行三轮进化：每轮用 LLM 评分器对输出打分，widening 从反复失败的子任务中蒸馏新技能，deepening 修订高失败率技能，replay gate 用配对比较决定是否采纳。测量四个条件下的任务完成率：无技能、仅 widening、仅 deepening、两者组合。如果组合条件的完成率显著高于任一单独条件（差距超过 5 个百分点），则支持超加性 claim；若组合无明显优势或出现退化，则反驳该 claim。此实验保留了核心机制但大幅缩减了工具规模和进化轮次，一周内可行。", "research_value": "### § 11 最强反例设计\n\n如果我要攻击这篇论文，我会设计一个需要极高几何精度且操作链超过50步的复杂矢量图案复现任务。在这个场景中，冻结模型极易在多步操作中累积误差或遗忘自然语言技能指令。如果引入技能库的完成率相比无技能基线没有显著提升，甚至因冗长技能上下文导致注意力分散而下降，就能证明该方法仅在短流程或低精度任务中有效。这表明主实验的高成功率可能是因为评测基准的任务复杂度不足以触发长流程的指令偏离。\n\n### § 12 后续研究设想\n\n围绕模型在长流程中偏离自然语言技能这一局限，后续可以研究在执行中途强制对齐技能指令是否能提升忠实度。具体做法是在技能执行过程中每隔10步插入一个状态检查点，强制模型重新检索技能并核对当前设计状态。这值得测试是因为它能区分技能失效究竟是指令遗忘还是技能本身质量不佳。首个对照实验可在长流程任务上比较基线（仅初始加载技能）与检查点组的中途偏离率和最终完成率，这与任务后的语言反思不同，聚焦于流程中的主动纠偏。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Hongyang Du\", \"affiliations\": [1, 2], \"markers\": [\"†\"]},\n    {\"name\": \"Lan Yan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Christian Flores\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Asim Kadav\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Adobe\"},\n    {\"id\": 2, \"name\": \"Brown University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"†\", \"text\": \"Corresponding to hongyangdu@brown.edu\"}\n  ]\n}\n```", "summary_translation": "专业平面设计是一项长程智能体任务（long-horizon agentic task），结构化且可编辑的设计产物由许多相互依赖的操作产生，但其结果缺乏可靠的程序化真值标准（programmatic oracle）。我们引入了一个持续适应框架，在该框架中，一个冻结的前沿模型通过230多个工具操作专业设计软件，同时一个由自然语言技能构成的外部程序性记忆（procedural memory）从经验中积累并提炼可复用的设计流程。该记忆通过为反复出现的未覆盖子任务获取流程来实现横向扩展，并通过根据自身成功与失败的执行记录修订现有流程来实现纵向深化，同时一个匹配重放门控（matched replay gate）仅允许那些能修复失败且不导致已观察到的成功发生退化的更改。在1,406份真实用户需求简报和1,869条自动评分轨迹上进行的五轮迭代，在无权重更新且无人工标签的情况下，将技能库从76个源自文档的技能扩展至139个，并将 Claude-Sonnet-4 上的 GenEval2 执行成功率从72.7%提升至99.3%（生成质量提升11.99分）。在 Claude-Sonnet-4 和 Claude-Opus-4.6 上的四个专业设计评测基准中，相对于无技能智能体的胜率分别达到61.8%和67.6%。我们进一步证明这两种机制在组合使用时是有效的：在来自用户流量评测基准的200份预留需求简报上，单独的横向扩展或纵向深化相对于无技能智能体的胜率分别为49.4%和48.6%，而两者的组合则达到了58.5%（p = 0.025）。程序性记忆为智能体在充满噪声且不可验证的反馈下进行持续适应提供了一条实用途径。"}, {"title": "DENSE: Distilling Agent Trajectories into Evidence-Grounded Shortcut Trees for Self-Refinement", "arxiv_id": "2609.21423", "authors": "Siyuan Liu, Fan Yu, Dongyu Ru, Yizhu Liu, Yifan Yang, Xuezhi Cao, Xunliang Cai, Yixin Cao", "summary": "Online agent deployments produce abundant execution traces, while task-specific verification and expert annotation are costly to scale. We study how to distill these traces into reusable feedback without post-hoc outcome labels, drawing on their evidence of local progress, recovery, and unfinished requirements. We introduce DENSE (Distilling Evidence from Nested Subtask Executions), which organizes this evidence into evidence-grounded nested shortcut trees. DENSE compresses redundant attempts, reconciles issues across levels using recovery evidence, and summarizes completed branches while expanding unresolved ones, linking reusable progress to remaining obligations. We introduce REFIT, a source-paired protocol comparing feedback from shared initial trajectories under post-hoc outcome blindness, with environments and model contexts reset for fresh attempts at the same tasks. On Terminal-Bench 2.1, DENSE achieves the highest strict pass rate among tested non-privileged feedback methods across four recipient models. Relative to initial executions, strict pass rate improves by 7.12-15.64 pp, with 19.0-43.6% fewer observed recipient tokens in reruns. GPT-5.5 ablations support combining nested subtask analysis with shortcut construction and issue reconciliation. These findings point toward agent self-refinement through evidence-grounded trajectory reuse with less reliance on external supervision.", "category": "cs.AI", "cluster": "Skill \u0026 Memory Evolution", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文研究的核心问题是：在没有事后结果标签（post-hoc outcome labels，即任务完成后的奖励信号、隐藏验证器输出或人工标注）的情况下，如何从智能体的执行轨迹中蒸馏出可复用的反馈，以指导同一任务的新一次尝试。LLM agent 在软件工程、网页交互等场景的在线部署持续产生大量包含失败尝试与恢复过程的长轨迹，而为这些轨迹提供任务特定的验证或专家标注成本高昂且难以规模化——轨迹在增长，监督却没有。解决这一问题意味着无需额外人工或验证器即可将历史执行经验转化为结构化反馈，使 agent 能在全新环境中复用有效路径、规避无效探索并完成未竟需求，从而降低对外部监督的依赖。\n\n### § 2 前人工作与不足\n\n已有工作从多个角度利用轨迹：Reflexion（Shinn et al., 2023）通过语言反思引导重试，ExpeL（Zhao et al., 2024）从成功 rollout 中提取经验供后续任务检索，GUIDE（Zhai et al., 2026）则做层次化过程诊断。这些方法要么依赖事后奖励或成功判定来筛选可复用经验，要么将轨迹信息用于评估而非在完全重置条件下驱动新一轮执行。关键缺口在于：它们未区分局部恢复与父任务完成、历史成功与当前状态——一次成功的编译不等于推理正确，历史写入的文件在环境重置后并不存在。因此反馈若不保留完成范围与证据边界，agent 在新环境中可能误报历史产物为当前交付物。此外，此前缺乏一个在环境和模型上下文双重重置下、以反馈为唯一信息传递通道的受控评测协议，使得反馈的下游效用无法与原始轨迹或特权结果信息进行公平比较。", "core_insight": "### § 3 重建作者的思考路径\n\n在线 agent 每天产生大量执行轨迹，但为每条轨迹提供奖励信号或人工标注成本极高，无法规模化。作者注意到一个被忽视的事实：即使没有最终结果标签，轨迹本身仍记录了哪些局部路径有效、哪些错误被修复、哪些需求尚未满足。此前基于反思或经验记忆的方法通常将整条轨迹视为成功或失败的整体，没有区分局部恢复与父任务完成，也没有区分历史成功与当前环境状态——环境重置后，之前写入的文件已不存在。这个区分缺失导致反馈要么过于笼统，要么误导 agent 将历史产物当作当前成果。作者由此提出：需要一种结构化表示，把可复用的进展、恢复证据和剩余义务显式绑定，并在完全重置的条件下检验其价值。\n\n### § 4 核心直觉\n\n轨迹里真正可复用的不是\"整条执行是否成功\"，而是局部子任务中哪些路径走通了、哪些是死路、哪些需求还悬而未决。DENSE 把轨迹拆成嵌套子任务，压缩冗余尝试为快捷路径，同时保留失败教训和未完成需求，让 agent 在全新环境中知道该重建什么、避开什么。让先前方法失效的关键在于：它们没有把历史成功与当前完成区分开，而 DENSE 通过限定完成范围（completion scope）和跨层问题调和，确保反馈只传达证据，不传达虚假的完成判断。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n任务 x + 轨迹 τ=(a₁,o₁,…,aₜ,oₜ)\n        │\n        ▼\n┌────────────────────────┐\n│ 阶段1: 构建嵌套子任务树  │\n│ 叶子 ℓᵢ=(aᵢ,oᵢ)→队列 Qₖ │\n│ 识别语义边界→父节点 v    │\n│ 递归→根层次结构          │\n└───────────┬────────────┘\n            │ 嵌套子任务树\n            ▼\n┌────────────────────────┐\n│ 阶段2: 压缩·调和·渲染    │\n│ A. shortcut 压缩        │\n│    保留 dead-end/路径   │\n│ B. 跨层级 issue 调和    │\n│    需恢复证据才关闭      │\n│ C. 问题门控渲染          │\n│    完成→摘要/未完成→展开 │\n└───────────┬────────────┘\n            │\n            ▼\n       有界反馈 f\n      (快捷方式树)\n```\n\nDENSE 分两阶段将散乱的动作与观察组织为可复用的任务经验。\n\n**输入**：任务指令 x 和一条已完成的执行轨迹 τ，仅包含可见的动作、工具交互和观察，不含事后奖励或验证器输出（§2.1）。\n\n**阶段1：构建嵌套子任务树**。将动作-观察配对为时序队列中的叶子节点，分析模型识别服务于同一目标的连续前缀作为语义边界，将其归组为父节点并放入上一级队列。递归重复直至形成根层次结构，使局部结果可在更高层目标中被重新解释（§2.2）。\n\n**阶段2A：快捷方式压缩**。自底向上处理子任务树，将同一父节点下的连续尝试融合为 shortcut。每个 shortcut 保留失败路径、紧凑的工作路径、最终局部结果和来源引用，使下一次执行能避免重复无效探索（§2.3）。\n\n**阶段2B：跨层级问题调和**。父节点需重新审视从子节点继承的问题。只有当后续子任务提供了具体的恢复证据时，才能关闭一个继承的问题。例如，早期报告文件缺失，后来子任务写入并回读确认，父节点才关闭该问题（§2.4）。\n\n**阶段2C：问题门控渲染**。完成的分支仅保留简短摘要和关键操作；未完成、失败或无证据支撑的分支则展开 shortcut、问题和观察。任务状态决定哪些内容被压缩、哪些被展开，生成长度有界的高密度反馈（§2.5）。\n\n**输出**：一棵证据接地的嵌套快捷方式树，明确连接历史支持的可复用进展与下一次执行仍需完成的工作。\n\n### § 7 实验设计与结论\n\n论文围绕三个核心问题设计实验。\n\n**无标签轨迹能否产生有用的反馈？** 作者在 Terminal-Bench 2.1 上用 REFIT 协议比较了六种反馈方法：仅任务建议、原始历史、全局分析、逐步评分、DENSE 和带有验证器输出的特权参考。所有方法共享同一条初始执行轨迹，在重置的环境和模型上下文中进行独立重试。结果显示，DENSE 在四个接收模型上均达到最高的严格通过率，较初始执行提升 7.12–15.64 个百分点，同时减少 19.0–43.6% 的执行 token。分析过的轨迹比原始历史和通用建议更有用，证明无标签轨迹确实包含可复用经验（§4.3, §5.2）。\n\n**DENSE 的两个核心设计是否必要？** 作者用 GPT-5.5 进行消融实验，分别移除快捷方式压缩与问题调和（S\u0026R）以及嵌套层次结构。完整 DENSE 达到 75.66% 严格通过率，移除 S\u0026R 降至 72.28%，移除层次结构降至 72.66%，且两者均消耗更多 token。这支持将嵌套子任务分析与快捷方式构建和问题调相结合（§4.4）。\n\n**组织化的证据是否优于附加验证信号的历史？** 在 MiniMax 上，DENSE 的严格通过率为 52.43%，超过带有验证器输出的特权反馈的 44.94%。案例分析表明，特权反馈的接收者有时将历史完成误认为当前交付，直接报告历史结果而不重新创建文件；DENSE 将完成范围限定于历史轨迹，并保留构建过程供接收者重新执行（§5.1, §D.4）。", "additional_insights": "### § 8 阅读收获\n即使没有外部奖励或人工标注，仅从 agent 执行轨迹中提取局部进展与错误恢复的证据，也能为后续重试提供有效反馈。DENSE 通过构建嵌套子任务树，压缩冗余尝试并区分已完成与未完成的分支，使反馈既保留可用路径又明确剩余义务。在重置环境的 REFIT 协议下，这种结构化反馈比直接提供原始轨迹甚至特权验证器输出更能稳定提升重试成功率。\n\n### § 9 最脆弱的假设\nDENSE 的核心假设是：分析模型能准确从长轨迹中识别语义边界，并严格区分“局部成功”与“整体完成”。若该假设不成立，模型会将历史成功误判为当前环境状态，导致 agent 直接声称完成而不重新执行操作。论文通过确定性检查约束证据引用，并在案例中展示了 DENSE 能避免这种误用，但缺乏对分析模型在超长轨迹下判断准确率的量化评估。\n\n### § 10 最小复现实验\n可选取 Terminal-Bench 中包含多次失败与恢复的任务，手动从一条失败轨迹中提取“已验证的局部进展”和“未完成的最终需求”，生成结构化反馈。将此反馈与原始轨迹分别提供给同一模型在全新环境中重试，测量严格通过率和工具调用次数。若结构化反馈组的通过率更高且调用次数更少，则支持“组织证据比提供原始历史更有效”的结论；反之则说明该提取方式不足以指导重试。", "research_value": "### § 11 最强反例设计\n如果我要攻击 DENSE，我会设计一个子任务高度交织的实验场景，例如多文件协同重构。在这种场景中，一个文件的修改会引发其他文件的连锁反应，不存在清晰的语义边界。我预期分析模型会错误划分嵌套子任务树，将相互依赖的操作强行割裂或错误归组。这种错误的结构化反馈可能比原始轨迹更有害，因为接收模型会基于错误的快捷方式盲目复用操作，而原始轨迹至少保留了完整的时序上下文供模型自行推断。\n\n### § 12 后续研究设想\nDENSE 的一个关键局限是未量化分析模型在超长轨迹下识别语义边界的准确率。后续研究可以探究轨迹长度如何影响边界识别质量及下游重试效果。具体而言，需要收集不同长度的执行轨迹，并人工标注真实的子任务边界作为基准。首个对照实验可以比较使用人工标注的完美边界树与 DENSE 自动生成的树进行重试的通过率。如果完美边界组的通过率随轨迹变长而保持稳定，而自动生成组显著下降，就能证明分析模型的边界识别能力是当前方法的性能瓶颈。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Siyuan Liu\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Fan Yu\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Dongyu Ru\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yizhu Liu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yifan Yang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Xuezhi Cao\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Xunliang Cai\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yixin Cao\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Fudan University\"},\n    {\"id\": 2, \"name\": \"Meituan Longcat Team\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "在线智能体部署产生了大量的执行轨迹，而特定任务的验证和专家标注的规模化成本高昂。我们研究如何在没有事后结果标签的情况下，利用局部进展、恢复和未完成需求的证据，将这些轨迹提炼为可复用的反馈。我们引入了 DENSE（从嵌套子任务执行中提炼证据），该方法将这些证据组织成基于证据的嵌套捷径树。DENSE 压缩冗余尝试，利用恢复证据跨层级协调问题，并在扩展未解决分支的同时总结已完成分支，从而将可复用的进展与剩余的待办事项联系起来。我们引入了 REFIT，这是一种源配对协议，在事后结果盲区（post-hoc outcome blindness）的条件下，比较来自共享初始轨迹的反馈，同时重置环境和模型上下文，以便对相同任务进行全新尝试。在 Terminal-Bench 2.1 上，DENSE 在四种接收模型的测试中，在所有受测的非特权反馈方法中取得了最高的严格通过率。相对于初始执行，严格通过率提升了 7.12 至 15.64 个百分点，且在重新执行中观测到的接收模型词元数减少了 19.0% 至 43.6%。GPT-5.5 的消融实验支持将嵌套子任务分析与捷径构建及问题协调相结合。这些发现表明，智能体可以通过基于证据的轨迹复用实现自我精炼，从而减少对外部监督的依赖。"}, {"title": "GraphSkillEvo: Evolutionary Optimization of Graph-Structured Agent Skills", "arxiv_id": "2609.21749", "authors": "Rui Sun, Zhi Zheng, Zhenkun Wang, Zhichao Lu", "summary": "Skills can improve the performance of Large Language Model (LLM) agents by providing task-specific procedural guidance, while skill optimization further improves their effectiveness through iterative refinement. However, existing skill optimization methods typically represent skills as unstructured natural-language instructions, creating two key challenges: 1) Unstructured skills often lack explicit workflow-level guidance and contain substantial redundancy, making them difficult for LLMs to execute; 2) the vast search space of unconstrained natural-language skills makes skill optimization ineffective. To address these challenges, we propose representing skills as graph-structured natural-language artifacts. In graph-structured skills, each node represents an execution step together with its operational guidance, while directed edges encode context-dependent transitions between steps. Compared to unstructured skills, graph-structured skills can provide clear workflow-level guidance. Moreover, the proposed graph-structured skill can also facilitate skill optimization. Building on this structured representation, we introduce GraphSkillEvo, a population-based evolutionary optimization framework with mutation and crossover operators for graph-structured skills. By maintaining multiple candidate skills and combining effective components, GraphSkillEvo enables broader and more comprehensive exploration of the structured skill space than purely LLM-based iterative self-refinement. Extensive experiments across five agent benchmarks demonstrate that GraphSkillEvo consistently outperforms the strong skill optimization baseline SkillOpt, improving average accuracy by 4.01% on GPT-5.4-nano and 1.76% on GPT-5.4. Our code is available at https://github.com/ruisun7/GraphSkillEvo.", "category": "cs.LG", "cluster": "Skill \u0026 Memory Evolution", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=18 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一个名为 GraphSkillEvo 的演化优化框架，用于改进 LLM 智能体的技能。论文针对智能体技能优化问题，将技能表示为图结构化的自然语言工件，并引入基于种群的演化算法（变异和交叉）来实现技能的迭代自我完善。这直接命中了研究焦点中的“自我演化”和“单智能体”方向，特别是“技能获取”和“迭代改进”机制。\n\n虽然论文标题和摘要中包含了 \"Graph-Structured\" 一词，但这里的图结构仅用于表示智能体技能的工作流（节点为执行步骤，边为状态转换），并非研究焦点之外被明确排除的图相关技术（如知识图谱、图神经网络、图推理或图RAG）。论文的本质是探讨 LLM Agent 的技能自我演化与优化方法论，而非图数据挖掘或图机器学习。因此，该论文符合筛选标准，应予保留。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决如何有效优化大型语言模型（LLM）agent技能的问题。技能是提供给agent的任务特定程序性指导，能提升其完成复杂任务的能力，且可跨模型复用——这在LLM快速迭代的实践中尤为有价值。但现有方法将技能表示为非结构化自然语言指令，导致两个挑战：技能缺乏明确的工作流级指导且冗余多，LLM难以执行；无约束的自然语言搜索空间过大，优化低效。解决此问题能让agent更高效地完成任务，尤其对能力较弱的模型帮助更大。\n\n### § 2 前人工作与不足\n\n最相关的方法是SkillOpt，它通过LLM自我反思迭代优化非结构化技能。但SkillOpt将技能表示为冗长检查清单，仅提供粗粒度工作流指导，agent难以判断当前阶段应遵循哪条指导，对GPT-5.4-nano等较弱模型尤为严重。此外，相似工作流可通过多种文本实现表达，优化器需探索大量不对应有意义程序性变化的变体，搜索空间大且冗余。这些限制源于非结构化表示本身——没有显式结构，优化器无法直接操作执行步骤及其依赖关系，纯LLM自我反思也难以跳出局部改进。", "core_insight": "### § 3 重建作者的思考路径\n\n作者可能从 LLM agent 执行失败的现象出发：现有 skill 优化方法（如 SkillOpt）把技能写成冗长清单，能力较弱的模型难以判断当前该遵循哪条指导，优化器也因文本冗余而在庞大空间中低效搜索。关键观察在于，技能本质上与流程图同构，而流程图天然能显式表达步骤依赖与条件分支。已有工作虽将图结构用于技能库检索，却未用于优化单个技能内部结构。由此推演：把技能重构为有向图后，共享步骤只需定义一次，工作流显式可循，搜索空间随之收紧；在此结构化空间上引入种群进化，用变异和交叉组合有效组件，便能突破纯 LLM 自我反思的局限。\n\n### § 4 核心直觉\n\n把技能从松散文本变成有向图，让模型执行时按节点推进、按条件边选路，优化时直接操作可复用步骤而非整段文本。图的显式结构既压缩搜索空间，又使变异能局部修正、交叉能跨候选重组，从而比单线自我反思更全面地探索高质量技能。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[初始技能] + [LLM生成] -\u003E [初始化种群 P]\n                              |\n            +-----------------+-----------------+\n            |                                   |\n      [训练集执行]                         [验证集评估]\n      收集失败轨迹                          计算适应度\n            |                                   |\n            v                                   |\n   [选择进化算子]                               |\n   (变异/交叉)                                  |\n            |                                   |\n            v                                   |\n   [生成新技能] -\u003E [图结构验证] -\u003E [新种群] ----+\n            |                                   |\n            +-----------------------------------+\n                                              |\n                                     [循环T代后输出]\n                                        [最优技能]\n```\n\nGraphSkillEvo 的完整流程包含种群初始化、训练集执行、技能生成与种群选择四个阶段。在初始化阶段，系统结合初始技能与 LLM 生成的多样化技能构建初始种群，并在验证集上评估适应度（对应正文 3.2 Step 0）。随后进入训练集执行阶段，从训练集采样实例并驱动 Agent 执行当前种群中的技能，收集失败轨迹作为反思信息（对应正文 3.2 Step 1）。\n\n在技能生成阶段，系统通过轮询方式选择进化算子（包括全局指导变异、图结构变异、全局指导交叉与图结构交叉），并依据适应度排名选择父代技能。结合失败轨迹，LLM 生成新的图结构技能，随后通过图结构验证器确保格式正确（对应正文 3.2 Step 2）。最后在种群选择阶段，新技能在验证集上评估适应度，与当前种群合并后保留排名前 N 的技能。该过程循环 T 代，最终输出适应度最高的图结构技能（对应正文 3.2 Step 3）。\n\n### § 7 实验设计与结论\n\n论文围绕三个核心问题设计实验验证 GraphSkillEvo 的有效性。首先针对“图结构技能是否提升执行效果”的问题，研究者将优化后的图结构技能去除显式工作流，转化为非结构化对照技能进行测试。结果显示，去除图结构导致所有基准的成功率下降，证明显式的工作流组织能帮助 Agent 更准确地应用指令。\n\n其次，为探究“图结构与进化算子在优化中的贡献”，研究设计了消融实验，分别移除图结构、变异或交叉操作。实验表明，图结构提供了紧凑的搜索空间，变异基于执行反馈进行局部细化，而交叉通过重组不同候选技能的有效组件实现了更广泛的探索，三者缺一不可。\n\n最后，针对“优化后的技能能否跨模型迁移”的问题，研究者将 GPT-5.4-nano 优化的技能直接应用于 GPT-5.4。结果表明，迁移后的技能仍显著优于无技能基线，且 GraphSkillEvo 的迁移效果优于基线方法 SkillOpt，证实了图结构技能在跨模型场景下的良好可移植性。", "additional_insights": "### § 8 阅读收获\n将大语言模型（LLM）代理的技能表示为图结构（节点为执行步骤，有向边为上下文转移），能提供明确的工作流指导并减少文本冗余。在此基础上，采用基于种群的进化算法（变异与交叉）优化图结构技能，比纯LLM自我反思探索更全面。实验表明，该方法在五个基准上优于SkillOpt，尤其对较弱模型和程序性任务提升最大，且优化消耗的token更少。\n\n### § 9 最脆弱的假设\n最关键的假设是：LLM能准确解析并严格遵循图结构技能中节点和边的执行顺序。若此假设不成立，图结构带来的工作流指导将失效，甚至因结构复杂而增加理解负担。虽然较小模型受益最大的结果似乎支持了该假设，但论文未提供LLM在执行时偏离指定路径的频率分析。当任务复杂、图结构庞大时，模型仍可能迷失在节点中。\n\n### § 10 最小复现实验\n用一周时间可验证图结构在技能执行阶段的优势。选择ALFWorld基准，用LLM生成一个图结构技能，再将其“扁平化”为无结构文本指令（保留全局指导和节点说明，去掉工作流路径）。在测试集上运行较小模型（如GPT-4o-mini），测量两种技能的通过率。若图结构技能通过率显著更高，则支持原结论；若两者接近或无结构版本更高，则表明该优势在实际执行中不成立。", "research_value": "### § 11 最强反例设计\n\n图结构技能在高度动态的开放任务中可能可预测地失败。在WebArena等状态不可预测的评测基准上，预设的有向边无法覆盖所有环境反馈，强制遵循固定工作流会限制agent的灵活性。我们可以设计对照实验，对比GraphSkillEvo与无结构自适应技能在路径偏离时的成功率。若图结构技能在环境反馈偏离预设节点时失败率剧增，则说明其提升仅适用于流程固定的任务，而非普适的技能优化。\n\n### § 12 后续研究设想\n\n当前方法假设LLM能严格遵循图结构的静态执行顺序，这在复杂任务中可能成为瓶颈。后续研究可探索将静态有向边改为条件触发的动态边，允许LLM根据环境反馈选择下一个执行节点。这值得测试，因为真实任务常需根据中间结果调整策略，刚性路径可能错失更优解。首个对照实验可在ALFWorld上比较静态图结构与动态跳转图结构的通过率，若后者显著提升，则说明动态路径规划是图结构技能优化的关键方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Rui Sun\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Zhi Zheng\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Zhenkun Wang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Zhichao Lu\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"City University of Hong Kong\"},\n    {\"id\": 2, \"name\": \"National University of Singapore\"},\n    {\"id\": 3, \"name\": \"Southern University of Science and Technology\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"}\n  ]\n}\n```", "summary_translation": "技能可以通过提供特定任务的过程性指导来提升大语言模型（LLM）智能体的性能，而技能优化则通过迭代精炼进一步提高其有效性。然而，现有的技能优化方法通常将技能表示为非结构化的自然语言指令，这带来了两个关键挑战：1）非结构化技能往往缺乏明确的工作流级别指导，且包含大量冗余，使得大语言模型难以执行；2）无约束自然语言技能的庞大搜索空间导致技能优化效率低下。为了应对这些挑战，我们提出将技能表示为图结构的自然语言产物。在图结构技能中，每个节点表示一个执行步骤及其操作指导，而有向边则编码了步骤之间依赖于上下文的转换关系。与非结构化技能相比，图结构技能能够提供清晰的工作流级别指导。此外，所提出的图结构技能也能促进技能优化。基于这种结构化表示，我们引入了 GraphSkillEvo，这是一个基于种群的进化优化框架，针对图结构技能设计了变异和交叉算子。通过维护多个候选技能并结合有效组件，与纯基于大语言模型的迭代自我精炼相比，GraphSkillEvo 能够对结构化技能空间进行更广泛、更全面的探索。在五个智能体评测基准上的广泛实验表明，GraphSkillEvo 始终优于强大的技能优化基线 SkillOpt，在 GPT-5.4-nano 和 GPT-5.4 上分别将平均准确率提升了 4.01% 和 1.76%。我们的代码可在 https://github.com/ruisun7/GraphSkillEvo 获取。"}]}, {"name": "Domain-Specific Agents", "count": 2, "papers": [{"title": "SpecOpt: Contact-Diff Reasoning for Agentic Molecule Optimization Toward Binding Specificity", "arxiv_id": "2609.21165", "authors": "Thao Nguyen, Heng Ji", "summary": "Off-target protein binding is a major source of adverse effects for small-molecule drugs, yet most structure-based molecular design methods focus on generating selective compounds de novo rather than improving the selectivity of existing, well- characterized drugs. We introduce specificity optimization (SpecOpt), a molecular design task that seeks constrained structural modifications to an existing compound that increase its binding preference for an intended target over known off-targets while preserving its structural identity and drug-like properties. To enable systematic evaluation, we construct a ChEMBL-derived benchmark from compound-target interaction data, identifying intended targets through curated drug-mechanism annotations and off- targets through measured activities. We then develop an agentic framework that docks each compound against its intended target and off-targets, compares the resulting poses through residue-aware atom-protein contacts, and provides these differential interactions to a large language model to propose targeted structural modifications. Candidates are retained only if they satisfy molecular similarity, ADMET, and target-off-target docking selectivity criteria. On 915 compounds, the agent improves the target- off-target binding gap for 84.8% of compounds, shifting the mean gap from -0.72 to +0.47 kcal/mol while maintaining a mean Tanimoto similarity of 0.72 to the starting compounds. Ablation studies identify residue-specific contact information as the critical optimization signal: replacing residue identities with binary contact indicators eliminates improvement on all 29 ablation compounds. These results establish SpecOpt as a distinct molecular design problem and demonstrate residue-aware differential interactions as an effective signal for improving the specificity of existing compounds.", "category": "cs.AI", "cluster": "Domain-Specific Agents", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n论文提出了“特异性优化”（SpecOpt）任务，旨在对现有药物进行受限的结构修饰，以增强其对预期靶点的结合偏好并减弱对已知脱靶的结合，同时保持原分子的结构和类药特性。小分子药物常因结合脱靶蛋白而产生不良反应甚至导致临床失败，但许多已有药物具备优良的药效和药代动力学特性，直接用全新分子替换它们并非最优解。因此，在最小化结构改动的前提下提升现有分子的靶点选择性，对于药物后期开发与改良具有重要实用价值。\n\n### § 2 前人工作与不足\n针对分子选择性问题，前人主要采用从头生成方法，例如Chandra等人通过贝叶斯优化在潜在空间中生成具有选择性结合的新分子。这些方法虽然能设计出避开脱靶的新化合物，但无法满足在保留现有药物核心特性下进行微调的需求，因为从头生成会破坏原分子已验证的临床优势。另一方面，基于结构的先导化合物优化方法（如DeepFrag和FRAME）虽能利用靶点口袋信息指导现有配体修饰，但它们仅关注单一靶点的结合亲和力，未显式比较同一分子与靶点及脱靶结合时的相互作用差异，因此无法指导针对特异性的结构编辑。", "core_insight": "### § 3 重建作者的思考路径\n\n以下是对作者思考路径的推测性重建。已有药物常因脱靶结合产生副作用，但从头生成新分子会丢失原药已验证的药代动力学和临床数据，因此对现有药物做最小结构修饰更为合理。结构生物学经验表明，同源蛋白的结合口袋高度相似，同一配体往往占据相似位置却接触不同残基——这个差异暗示了可被化学修饰选择性利用的相互作用环境。同时，LLM 已被证明能理解分子片段级别的化学语义并结合蛋白结构上下文提出编辑建议。将残基级接触差异作为信号、LLM 作为编辑器，自然成为连接结构分析与分子优化的桥梁。\n\n### § 4 核心直觉\n\n关键洞察是：不要只问配体\"是否接触\"靶点或脱靶，而要问它接触的是\"哪些残基\"。同源口袋中接触区域几乎重合，但残基身份和化学环境不同，简单的接触有无无法区分，残基级差异才是可利用的信号。把这个差异信息交给 LLM，它就能提出只扰动一种结合环境而不影响另一种的精准化学编辑。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n输入: 化合物 + 目标蛋白 + 脱靶蛋白\n        │\n        ▼\nAutoDock Vina 分别对接目标 \u0026 脱靶蛋白\n        │\n        ▼\n差异接触分析 (逐原子, 残基级)\n  TARGET-ONLY / OFF-TARGET-ONLY\n  SHARED-SAME / SHARED-DIFF-RESIDUES\n  GROWTH-OPPORTUNITY\n        │\n        ▼\nBRICS 片段聚合 → 编辑建议\n  REMOVE / REDESIGN / GROW / KEEP\n        │\n        ▼\nLLM Agent (GPT-5.4) 提出结构修改\n        │\n        ▼\n候选筛选: Tanimoto\u003E0.4 + ADMET + 间隙改善\n        │\n   ┌────┴────┐\n   ▼ 否      ▼ 是\n  丢弃    接受 → 下一轮迭代\n              │\n              ▼\n        输出: 优化后分子\n```\n\n输入阶段接收一个已有化合物、其目标蛋白和已知脱靶蛋白。系统首先用 AutoDock Vina 将同一化合物分别对接到各蛋白上，得到目标结合姿态和脱靶结合姿态（§3.3）。\n\n差异接触分析是核心信号来源。对每个配体原子，系统识别 7 Å 范围内的蛋白残基，将原子分为五类：仅接触目标（TARGET-ONLY）、仅接触脱靶（OFF-TARGET-ONLY）、接触相同残基（SHARED-SAME-RESIDUES）、接触不同残基（SHARED-DIFFERENT-RESIDUES）、以及目标侧有更多未占据口袋空间的生长机会（GROWTH-OPPORTUNITY）。其中\"接触不同残基\"这一类尤为关键——同一区域在不同蛋白中接触的残基身份不同，为选择性修改提供了切入点（§3.3）。\n\n这些原子级信号通过 BRICS 片段切割聚合到片段层面，每个片段获得编辑建议：移除（REMOVE）、保留（KEEP）、重新设计（REDESIGN）、延伸（GROW）或中性（NEUTRAL）。片段级差异摘要连同当前对接评分和历史编辑记录提供给 GPT-5.4 作为 LLM agent，由其提出具体的结构修改方案（§3.3–3.4）。\n\n候选分子须通过三重门控才能被接受：与原始分子的 Tanimoto 相似性高于 0.4、ADMET 性质变化在容差内、重新对接后特异性间隙有改善。接受的候选成为下一轮起点，最多迭代 4 轮，每轮最多 8 个候选（§3.4）。\n\n### § 6 核心数学推导\n\n论文定义了特异性间隙（specificity gap）作为优化目标。设 $s(m, P)$ 为化合物 $m$ 对蛋白 $P$ 的 AutoDock Vina 评分（越负表示结合越紧），特异性间隙定义为：\n\n$$g(m) = s(m, T) - \\min_{O} s(m, O)$$\n\n即目标蛋白评分与最强脱靶蛋白评分之差。$g \u003E 0$ 意味着分子偏好目标蛋白胜过所有脱靶蛋白；优化的目标是在保持与原始分子结构相似的前提下增大 $g$。这一定义将\"选择性\"转化为可计算的标量目标，且通过取最强脱靶的评分，确保优化对最危险的竞争蛋白有效。整个 pipeline 不涉及训练，所有评分均通过固定种子的对接计算获得，优化过程完全在推理阶段完成。\n\n### § 7 实验设计与结论\n\n**问题一：能否系统性地优化现有药物的选择性？** 作者在 915 个化合物上运行完整系统，比较优化前后的特异性间隙。结果显示 84.8% 的化合物间隙改善，平均从 −0.72 提升到 +0.47 kcal/mol，同时保持与原始分子 0.72 的平均 Tanimoto 相似性，证明在约束条件下系统性优化是可行的（§4.1）。\n\n**问题二：什么信号驱动了优化效果？** 消融实验将残基感知的五类接触分类替换为简单的三分类（仅目标/仅脱靶/共享），结果 29/29 化合物完全无改善，平均改善量从 +0.903 降至 0.000。这表明关键信号不是\"是否接触\"，而是\"接触了哪些残基\"——尤其是同一区域接触不同残基的差异，为区分同源口袋提供了判别力（§4.3）。\n\n**问题三：与已有选择性生成方法相比如何？** 在 FLT3 基准上，SpecOpt 对 24 个真实 FLT3 药物进行优化，23 个成功运行中 20 个改善特异性间隙，平均间隙从 −2.03 提升至 −0.91 kcal/mol。由于任务设定不同（修改现有药物 vs 从头生成），绝对选择性不可直接比较，但结果表明约束优化路径有效（§4.5）。", "additional_insights": "### § 8 阅读收获\n本文提出针对现有药物的特异性优化任务，在保持分子结构前提下微调结构，增强其对靶点的结合偏好并降低脱靶结合。核心机制是提取分子在靶点与脱靶结合构象中的残基级接触差异，指导大语言模型进行结构编辑。消融实验证明残基身份是关键信号，若仅保留接触有无而忽略残基差异，优化效果完全消失。\n\n### § 9 最脆弱的假设\n最脆弱的假设是 AutoDock Vina 的对接得分差异能准确反映结合特异性的真实变化。若不成立，筛选出的“优化”分子在实验中可能毫无改善。论文附录承认对接得分与实验亲和力整体相关性极低（中位数仅 -0.075），且无法有效区分靶点和脱靶。论文缺乏实验验证或高精度自由能计算来支撑得分差异的可靠性。\n\n### § 10 最小复现实验\n利用一周时间，可从基准中选取具有丰富实验亲和力数据的靶点（如 Muscarinic M2）及其配体。保留论文对接流程，对原始分子和优化分子重新对接，计算得分预测的特异性提升。同时利用 ChEMBL 已有实验值计算真实特异性变化。若预测与实验趋势一致，则支持其优化有效性；若得分改善但实验特异性未变或恶化，则反驳其核心假设。", "research_value": "### § 11 最强反例设计\n要挑战该方法的有效性，最致命的攻击点在于验证 AutoDock Vina 评分差异是否真实反映了结合特异性。我会选择一批结合口袋高度同源的激酶靶点和脱靶，使用 SpecOpt 生成优化分子，随后采用自由能微扰（FEP）计算这些分子对靶点与脱靶的真实结合自由能差值。如果 FEP 结果显示特异性并未改善甚至恶化，就能证明该方法只是在利用对接程序的评分漏洞，而非真正提升了分子的物理选择性。\n\n### § 12 后续研究设想\n该方法依赖单次刚性对接提取残基接触差异，忽略了蛋白柔性及溶剂效应，可能导致静态构象遗漏关键的瞬时接触。后续研究可以探索引入分子动力学（MD）模拟生成靶点和脱靶的构象系综，再进行接触差异分析。首个对照实验可选取论文中改善显著的 20 个分子，分别用原方法和基于 MD 构象的方法进行优化，并利用实验数据验证。若 MD 组的实验成功率显著更高，则证明动态构象信息对指导特异性优化不可或缺。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Thao Nguyen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Heng Ji\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"University of Illinois Urbana-Champaign\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "脱靶蛋白结合是小分子药物不良反应的主要来源，然而大多数基于结构的分子设计方法侧重于从头生成具有选择性的化合物，而不是改善现有且特征明确的药物的选择性。我们引入了特异性优化（SpecOpt），这是一项分子设计任务，旨在对现有化合物进行受限的结构修饰，以提高其对预期靶点而非已知脱靶靶点的结合偏好，同时保持其结构特征和类药性质。为了实现系统性评估，我们利用化合物-靶点相互作用数据构建了一个基于 ChEMBL 的评测基准，通过经过人工筛选的药物机制注释确定预期靶点，并通过实测活性确定脱靶靶点。随后，我们开发了一个智能体框架，该框架将每个化合物与其预期靶点和脱靶靶点进行对接，通过残基感知的原子-蛋白质接触比较产生的构象，并将这些差异相互作用提供给大语言模型，以提出针对性的结构修饰。只有满足分子相似性、ADMET以及靶点-脱靶靶点对接选择性标准的候选化合物才会被保留。在915个化合物上，该智能体改善了84.8%化合物的靶点-脱靶靶点结合差值，将平均差值从 -0.72 转变为 +0.47 kcal/mol，同时保持与起始化合物的平均 Tanimoto 相似度为 0.72。消融实验表明，残基特异性接触信息是关键的优化信号：用二元接触指示符替换残基标识会消除所有29个消融化合物上的改善效果。这些结果确立了 SpecOpt 作为一个独特的分子设计问题，并证明了残基感知的差异相互作用是改善现有化合物特异性的有效信号。"}, {"title": "Verify, Don't Trust: Agentic Model Development for Video Discovery Retrieval at Scale", "arxiv_id": "2609.21257", "authors": "Hao Fu, Baiting Zhu, Minglei Chen, Yinjie Huang, Shuai Ding", "summary": "Large language model (LLM) agents can propose, implement, and evaluate model changes. Autoresearch loops demonstrate this capability through minutes-scale iterations on a self-contained program. Online autoresearch instead spans asynchronous systems, hours-long variants, and weeks-long campaigns that can influence a product. A completed run can still support an invalid conclusion when a code change is a no-op, data windows leak, evaluator semantics drift, or the two arms traverse different serving funnels. We present EvoPilot, a human-gated method for long-horizon online autoresearch. Role-specific agents execute each round through a versioned domain skill and typed adapter. Durable records preserve experiments and failures; deterministic checks enforce recorded lessons. We study a 37-day campaign for the retrieval system that powers Video Deep Dive (VDD), an online experience for discovering follow-on videos after a user opens a seed video. The campaign covered seven directions and used an hourly refreshed index of hundreds of millions of videos. Earlier manual experiments had not established a benefit from an interaction head. A primitive autoresearch attempt revisited the direction but incorrectly attributed an offline hit-rate decline of 22 percentage points to the head. We then introduced EvoPilot. Its human-gated verification traced the drop to a pre-existing evaluation defect that produced output depths of 3,000 and 600. After repair, a matched comparison measured an offline improvement of 3.20 percentage points. Post-study replay and mutation tests rejected invalid comparisons while admitting valid counterparts. Durable state recovered an interrupted round, and artifact reuse avoided approximately five GPU-hours. Separately, a seven-day randomized online evaluation estimated a 0.66% relative increase in the VDD slice of Good Search Result Rate for Retention (GSRR).", "category": "cs.AI", "cluster": "Domain-Specific Agents", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-17 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文提出了 EvoPilot，一种用于长期在线自动研究（long-horizon online autoresearch）的人机协同方法。论文的核心贡献在于构建了能够提出、实现和评估模型更改的 LLM 智能体框架，使其能够在长达数周的长期任务中通过持久化记录保存实验和失败教训，并利用确定性检查来强制执行已记录的经验，从而实现自我演化和技能获取。这高度符合筛选标准中关于“自我演化”和“长期决策智能体”的研究焦点。虽然论文的应用场景是视频检索系统，但其本质是探讨智能体在长期迭代中的自我改进、记忆机制和验证机制，属于将“自我演化”机制应用于特定领域的典型案例，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n论文提出的研究问题是如何在跨越数小时乃至数周的在线机器学习实验中，确保大语言模型（LLM）智能体自动完成的实验运行构成有效对比，而非得出虚假结论。真实的在线开发涉及异步系统与长期活动，代码未生效、数据泄漏或评估器语义漂移会导致看似成功的运行实际上无法比较。解决该问题能避免无效实验误导产品决策，确保智能体驱动的开发具备科学严谨性与可恢复性。\n\n### § 2 前人工作与不足\n针对智能体驱动的实验自动化，前人工作如 MLAgentBench 和 AI Scientist 主要依赖 LLM 智能体修改单一脚本，在分钟级循环中根据单一标量指标决定保留或回退。这些方法假设实验是自包含的且耗时极短，无法应对跨越训练、发布、服务和评估系统的异步远程工作流，缺乏机制验证两次完成的运行是否共享相同的基准或评估器版本。\n\n此外，MLflow 和 TFX 等机器学习生命周期系统虽能记录单次运行的参数与血缘关系，但无法判断两次成功完成的运行是否真正实现了预期的实验对比。两次各自完整的运行若使用了不同版本的评估器，依然会构成无效对比，而现有系统无法在对比层面拦截这种错误。", "core_insight": "### § 3 重建作者的思考路径\n作者可能观察到，现有的自动化机器学习系统多在几分钟内修改自包含脚本，无法应对工业界跨越数周的长周期实验。在这种异步环境中，代码未生效或评估器漂移会导致两个独立完成的运行无法构成有效对照。面对 VDD 系统中因输出深度不匹配导致的 22 个百分点误差，作者意识到传统追踪工具只记录参数，无法验证对照有效性。因此，他们决定将实验视为需严格验证的协议，通过确定性产物检查来强制执行实验有效性。\n\n### § 4 核心直觉\n这篇论文的核心直觉是：在长周期的自动化机器学习实验中，一个完成的运行本身并不构成科学证据，只有经过验证的对照比较才是。系统不信任大模型 agent 的自我报告，而是通过确定性检查器验证实验产物，确保对照组和实验组共享相同基线且仅存在授权差异。人类负责审批计划和解释指标语义，机器负责执行和机械验证，从而将实验有效性转化为可执行的代码检查。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[人类审批 Round Protocol]\n         │\n         ▼\n[Base Builder] ──\u003E 共享基准\n         │\n┌────────┴────────┐\n▼                 ▼\n[Control Worker]  [Treatment Worker]\n(领域技能+适配器)  (领域技能+适配器)\n│ 训练/发布/评测   │ 训练/发布/评测\n▼                 ▼\n[产物 Rc]         [产物 Rt]\n└────────┬────────┘\n         ▼\n[VerifyComparison] (确定性校验)\n         │\n         ▼\n[人类审查 Review] ──\u003E 拒绝或准入\n         │ (准入)\n         ▼\n[Results Analyst] ──\u003E 更新假设树\n         │\n         ▼\n[Round Planner] ──\u003E 提出下一轮方案\n```\n\nEvoPilot 将长周期在线自动化研究视为一个受人类把关的协议循环，而非简单的提示词交互。**人类审批**阶段由 Round Planner 读取研究方向与历史记忆，提出包含共享基准、授权差异和数据快照的实验方案，必须经人类明确批准（对应正文 4.3）。获批后，**Base Builder** 将代码变更和配置实例化为统一基准。\n\n对照组和实验组的 **Experiment Worker** 在相互隔离的环境中继承该基准，通过版本化的领域技能和适配器执行异步的“训练→发布→评测”工作流，产出终端产物和执行轨迹（对应正文 4.1、4.4）。随后，确定性验证器 **VerifyComparison** 检查两组产物是否共享同一基准、数据是否对齐、实际差异是否严格等于授权变量，且未受影响的阶段是否具有等价产物（对应正文 4.2）。\n\n只有通过机械验证的对比对才会进入**人类审查**环节，由人类裁决指标语义并决定是否准入为有效科学证据。被准入的结果交由 **Results Analyst** 更新假设树并建议后续动作，最后由 Round Planner 结合证据生成下一轮提案，形成完整的闭环。\n\n### § 7 实验设计与结论\n\n**问题 1：自动化系统的控制机制能否区分正常完成与有效对比，并拦截已知执行错误？**\n实验设计：对十种不变量（如数据身份、有效漏斗配置等）进行配对重放测试，对比正常状态与单字段突变故障的准入结果。\n答案：确定性验证器成功准入全部十个正常状态，并拦截了全部十个对应的故障状态，证明机械检查能有效区分有效对比与无效执行。\n\n**问题 2：EvoPilot 能否纠正早期自动化研究的错误结论？**\n实验设计：回顾早期自动化尝试中因输出深度不匹配导致的交互头负面结论，使用 EvoPilot 的人类审查机制进行溯源和修复，随后进行匹配血统的消融实验与在线 A/B 测试。\n答案：EvoPilot 发现对照组实际输出深度为 3000 而非声明的 600。修复配置后，隔离的在线 A/B 测试确认交互头使在线指标 GSRR 相对提升 0.66%，成功推翻了错误结论。\n\n**问题 3：被准入的实验结果如何约束后续研究方向？**\n实验设计：在评分和深度扫描中固定发布产物，测试不同评分项和候选深度对点击命中率的影响。\n答案：结果显示增加参与度评分会降低命中率，且超过 6000 候选深度后收益递减。这些有效证据直接促使系统选择更简单的纯点击混合模型并停止该方向的探索。", "additional_insights": "### § 8 阅读收获\n完成机器学习实验运行不等于获得有效结论，跨系统长期实验必须以“对照比较”而非“单次运行”作为科学证据单位。EvoPilot通过人类审批协议和确定性产物验证，确保控制组与实验组共享相同基础且仅存在授权差异。该方法成功纠正了因输出深度K不匹配导致的22个百分点错误归因，并验证了交互头带来的3.20个百分点离线改进与0.66%在线相对提升。\n\n### § 9 最脆弱的假设\n最关键的假设是：验证器能从终端产物中提取所有影响实验解释的关键变量，从而机械判定比较有效性。若存在影响指标语义的隐性因素无法被提取，验证器就会放行无效比较并得出错误结论。论文承认评测器语义漂移在软件版本之外仍需人工审查，且新身份验证器仅有重放测试证据，表明机械验证边界在实际中依然脆弱。\n\n### § 10 最小复现实验\n一周内可复现“输出深度K不匹配导致错误归因”的发现，无需构建完整流水线。使用开源数据集训练双塔模型，在评测时故意使控制组实际截断深度K_eff=3000、实验组K_eff=600，但配置文件均声明K=600。测量两组命中率，若实验组显著低于控制组且仅看声明配置会错误归因为模型差异，则支持论文主张；若无显著差异，则反驳该故障模式的影响程度。", "research_value": "### § 11 最强反例设计\nEvoPilot 的核心假设是验证器能从终端产物中提取所有影响实验解释的关键变量。如果底层特征服务在异步执行期间发生未记录的静默更新，例如特征哈希算法的微小改变，对照组和实验组实际输入的特征空间就会不同。这种隐式特征漂移无法从模型权重或配置文件中提取，验证器会机械地放行对比。若实验组指标因此显著提升，系统会错误归因为代码变更，直接证明机械验证在复杂隐式依赖下会失效。\n\n### § 12 后续研究设想\n关键局限在于评估器语义漂移在软件版本之外仍需人工审查。后续研究可探索如何自动检测这种漂移，以减少人类审查负担。具体做法是在每次实验前后，使用一组固定的、具有已知预期输出的锚点查询测试评估器的输出分布。首个对照实验可故意引入不改变版本号但改变评分逻辑的微小漂移，观察引入探针的系统是否能通过锚点查询的异常输出自动拦截无效对比，而原系统则错误放行。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Hao Fu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Baiting Zhu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Minglei Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yinjie Huang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shuai Ding\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Meta Platforms, Inc.\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "大语言模型（LLM）智能体能够提出、实施并评估模型变更。自动化研究循环通过对独立程序进行分钟级的迭代来展示这种能力。相比之下，在线自动化研究跨越异步系统、小时级的变体测试以及能够影响产品的持续数周的实验活动。当代码变更属于无效操作、数据窗口发生泄漏、评估器语义漂移，或者两个实验组经历了不同的服务漏斗时，一次已完成的运行仍可能支持无效的结论。我们提出了 EvoPilot，一种用于长周期在线自动化研究的人工把关方法。特定角色的智能体通过版本化的领域技能和具有明确参数定义的适配器来执行每一轮任务。持久化记录保存了实验过程与失败信息；确定性检查强制应用了所记录的经验教训。我们针对为 Video Deep Dive (VDD) 提供支持的检索系统进行了一项为期37天的实验活动，VDD 是一种在用户打开种子视频后用于发现后续视频的在线体验。该实验活动涵盖七个方向，并使用了一个包含数亿视频且每小时刷新一次的索引。早期的手动实验尚未证实交互头能带来收益。一次初级的自动化研究尝试重新探索了该方向，但错误地将离线命中率下降22个百分点归咎于该交互头。随后我们引入了 EvoPilot。其人工把关验证将这一下降追溯到一个既有的评估缺陷，该缺陷产生了3000和600的输出深度。修复该缺陷后，匹配比较测量到了3.20个百分点的离线提升。事后研究重放和变异测试拒绝了无效的比较，同时接受了有效的对照。持久化状态恢复了一轮被中断的实验，产物复用避免了大约五个GPU小时的消耗。另外，一项为期七天的随机在线评估估计，在 VDD 切片中，留存导向良好搜索结果率（GSRR）相对提升了0.66%。"}]}, {"name": "Information Retrieval \u0026 Extraction", "count": 2, "papers": [{"title": "What Should We Ask Next? Retrieval-Aware Question Learning under Partial Evidence", "arxiv_id": "2609.21924", "authors": "Lyucheng Qian, John Yuehan Zhang, Pingyu Wang", "summary": "Interactive retrieval under partial evidence is a sequential information-acquisition problem: an agent must decide which question will create the most useful evidence for the next retrieval update. Existing systems train this decision by imitating an offline ordering of candidate QA pairs, although question value is determined by the response it elicits and its downstream effect on retrieval. We establish that candidate discriminativeness and perceived usefulness provide weak supervision for this objective, then introduce RAVEL, a retrieval-aware online reinforcement learning framework for interactive person re-identification. RAVEL initializes from supervised question generation, observes the current Top-4 candidates directly, and optimizes the question policy with rank feedback from the full question-answer-retrieval loop. Experiments on Interactive-PEDES show that RAVEL delivers progressively stronger retrieval performance across five interaction rounds. Further analysis shows that RAVEL reallocates the questioning budget toward localized open-ended attributes, which provide more useful retrieval evidence and yield the largest gains on initially difficult queries.", "category": "cs.AI", "cluster": "Information Retrieval \u0026 Extraction", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了 RAVEL，一个基于检索感知的在线强化学习框架，用于优化智能体在交互式检索中的提问策略。论文明确指出这是一个序列信息获取问题，智能体需要决定下一个问题以产生最有用的证据，并通过全闭环的问答检索反馈（rank feedback）来优化其提问策略。这直接对应了你的研究焦点中提到的“澄清时机”以及“agent training/RL”和“通过环境反馈进行自我完善/演化”的机制。虽然论文的应用场景是交互式人物重识别（可能涉及视觉或多模态），但视觉/检索在这里仅作为智能体交互的环境，研究的核心本质是智能体的决策、规划和策略学习机制，符合“不要因为论文是 training/distillation 就排除”以及“领域是场景，机制才是贡献”的筛选原则。因此，该论文应予保留。", "intro_logic": "### § 1 研究问题与重要性\n论文解决在部分证据下的交互式检索中，智能体应如何选择下一个问题以最大化下游检索效果的问题，具体应用于交互式行人重识别。该问题至关重要，因为单个问题的价值并非固定不变，而是取决于它所引发的回答、当前对话状态以及最终对图库排名的影响。解决这一问题能显著提升检索系统在初始证据不足或查询困难时的准确率与交互效率。\n\n### § 2 前人工作与不足\n此前的方法如 LLaVA-ReID 主要依赖离线行为克隆，将描述分解为候选问答对，并用贪心前瞻策略选出能带来即时排名提升的固定顺序来训练提问者。这种方法的根本局限在于，它仅在固定状态下对问答对进行离线评分，提问者既不观察自己提问所引发的回答，也不了解该回答进入检索器后的重排结果。因此，行为克隆只能学到静态的候选区分线索作为代理，无法捕捉问题在多轮对话和候选状态动态演变中的真实条件价值。", "core_insight": "### § 3 重建作者的思考路径\n\n作者面对的起点是交互式行人重识别（Interactive ReID）中一个看似合理的做法：把细粒度描述拆成候选问答对，用贪心前瞻选出能最大改善排名的提问顺序，再让提问者模仿这个固定顺序。但这里有一个根本矛盾——问题的价值不是静态的。同一个问题在不同对话状态、不同候选组合下，引出的回答不同，经过文本清洗和检索器重排后的效果也不同。作者很可能从经验观察中发现：一个看起来能区分候选的问题，实际提问后反而可能把目标排名推低。这说明离线标注的\"好问题\"标签与真实的检索增益之间存在系统性脱节。\n\n进一步追问会发现两个线索。第一，问题的判别性和人类感知有用性与下游排名变化几乎没有相关性，模型判断与人类判断的一致性也很低，这意味着静态标签本身就不是可靠的监督信号。第二，提问者虽然对视觉 token 有注意力，但对候选顺序和组合的变化几乎不敏感，说明它并没有真正利用候选图像来指导提问，而是在学习某种固定的候选分离模式作为代理。这两点合在一起指向同一个结论：问题选择本质上是一个序列决策问题，必须在完整的\"提问—回答—检索\"闭环中在线学习，而不是离线模仿一个预设顺序。强化学习恰好提供了这种从环境反馈中优化策略的机制。\n\n### § 4 核心直觉\n\n问题的真正价值只有在它引出回答、回答经过处理后进入检索器、并改变排名的那一刻才能确定，因此不能靠离线标签预先判定，必须让提问者从真实的检索排名反馈中学习。RAVEL 的做法是把每个问题丢进完整的交互闭环，用排名提升作为奖励信号，通过组内相对策略优化更新提问策略，让模型自己发现哪些问题能产生有用的检索证据。让先前方法失效的核心在于它们用静态的候选区分度近似了一个本质上动态的条件价值；让这个方法奏效的核心在于把奖励直接绑定到检索效用上，跳过所有中间代理指标。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n┌─────────────────────────────────────────────────────┐\n│ Stage 1: Retriever Training (CLIP + IRRA, frozen)    │\n└──────────────────────┬──────────────────────────────┘\n                       │\n┌──────────────────────▼──────────────────────────────┐\n│ Stage 2: SFT Cold Start                              │\n│  LLaVA-OneVision-Qwen2-7B-ov + QLoRA                 │\n│  Input: 初始描述 + Top-4 候选 + 对话历史              │\n│  Output: 监督式提问策略 π_SFT                         │\n└──────────────────────┬──────────────────────────────┘\n                       │\n┌──────────────────────▼──────────────────────────────┐\n│ Stage 3: Retrieval-Aware Online RL (GRPO)            │\n│                                                       │\n│  观测 o_t ──► π_θ 采样 G 个问题 q₁..q_G              │\n│                │                                      │\n│         ┌──────┴──────┐                               │\n│         ▼             ▼                               │\n│   Validity Gate   (无效问题 → 无检索奖励)             │\n│         │                                             │\n│         ▼                                             │\n│   Frozen Answerer → 答案清洗 → 追加检索文本            │\n│         │                                             │\n│         ▼                                             │\n│   Frozen Retriever → 重排序 → r_after                 │\n│         │                                             │\n│         ▼                                             │\n│   Reward = ΔRR + Rank-1 bonus − 重复/无效惩罚          │\n│         │                                             │\n│         ▼                                             │\n│   组内归一化优势 → GRPO 更新 QLoRA adapter             │\n└─────────────────────────────────────────────────────┘\n```\n\nRAVEL 的 pipeline 分三个阶段。Stage 1 用 CLIP-ViT-B/16 配合 IRRA 框架在 Interactive-PEDES 上训练检索器并冻结，作为后续所有阶段的固定检索后端（§4.1、§5.1）。Stage 2 以 LLaVA-OneVision-Qwen2-7B-ov 为初始模型，用 QLoRA 做一轮监督微调，让提问者学会基本的候选条件提问格式，得到参考策略 π_SFT（§4.1、Supplementary B）。\n\nStage 3 是核心的在线强化学习阶段。在每个交互状态，策略 π_θ 接收部分观测 o_t（初始描述、对话历史、累积检索文本、当前 Top-4 候选图像、轮次编号），采样一组 G=8 个候选问题。每个问题先经过 Validity Gate 过滤：空问题、候选选择指令、自填答案、记忆转储等违规输出被拦截，确保只产生合法的证人交互（§4.3、Supplementary B）。通过门控的问题送入冻结的 Answerer（Qwen2.5-7B-Instruct），其回答经原始清洗规则处理后追加到检索文本，再由冻结的 Retriever 重新排序，得到更新后的目标排名 r_after（§4.2）。\n\n奖励由三部分组成：倒数排名提升 ΔRR = 1/r_after − 1/r_before 构成主项，成功进入 Rank-1 额外加 0.35 分，重复问题和无效动作分别受惩罚（§4.3）。一组内 8 个问题的奖励做组内归一化得到优势值，用 GRPO 的 token 级裁剪目标更新 QLoRA adapter，KL 散度以 SFT checkpoint 为参考策略进行正则化（§4.1、Supplementary B）。训练中 Answerer 和 Retriever 始终冻结，所有策略更新都归因于提问者所引发的检索证据变化。推理时不再有选择器，策略直接接收 Top-4 候选并生成问题，用 temperature 1.0、top-p 0.5 采样（Supplementary B）。\n\n### § 7 实验设计与结论\n\n**问题一：静态问题标签能否可靠预测检索效果？** 作者从测试集 rollout 中采样 2,000 个交互状态，用 Qwen3-VL-32B 和人工分别标注问题的区分度和感知有用性，再计算这些标签与实际倒数排名增益的相关性。结果显示 Spearman 相关仅 0.05 左右，人工标注的 101 个案例甚至呈微弱负相关（ρ = −0.016, p = 0.875），模型与人工的一致率也只有 65%（κ = 0.312）。结论是静态标签无法可靠预测检索收益，直接否定了离线行为克隆的监督基础（§3.2）。\n\n**问题二：提问者是否真正利用了候选图像？** 作者设计三个诊断指标——视觉依赖比 VRR、图像消融敏感度 IAS、候选敏感度 CS——在 teacher-forced 下测量提问者对视觉 token 的注意力和对候选变化的响应。结果表明 VRR 和 IAS 随轮次上升，但 CS 始终很小，保留 Rank-1 图像或打乱候选顺序几乎不改变生成问题的似然。这说明提问者虽然关注了视觉输入，但并未对候选间的区分性做出有效响应，进一步 motivates 在线学习（§3.3）。\n\n**问题三：在线检索反馈能否直接优化提问策略？** 作者在 Interactive-PEDES 上将 RAVEL 与 PlugIR、ChatIR、SimRV、LLaVA-ReID 及 GPT-5.6 Luna 对比，并在 CUHK-PEDES、ICFG-PEDES、RSTPReid 上做跨数据集迁移测试。RAVEL 在五轮后达到 73.73 Rank-1，比 LLaVA-ReID 高 5.79 个百分点，BRI 降至 0.642；在三个迁移基准上 Rank-1 分别提升 7.21、5.94、12.73 个百分点。消融实验进一步确认：去掉 Validity Gate 会导致策略崩溃（输出候选指代和无效问题），仅用 RL 从原生模型初始化不如 SFT→RL 路径，且 RAVEL 学到的策略可直接迁移到不同的检索后端（RDE）而无需重新训练（§5.2–5.4）。", "additional_insights": "### § 8 阅读收获\n离线静态标签（如问题区分度或人类感知有用性）无法可靠预测交互式检索的下游排名提升，因为问题的真实价值取决于它引出的答案及随后的重排结果。RAVEL 框架通过在线强化学习直接从检索排名反馈中优化提问策略，将提问、回答与重排耦合，显著提升了交互式行人重识别性能。模型最终学会了将交互轮次分配给局部开放属性问题（如头发、鞋子），这类问题比全局是非题能产生更有效的检索证据。\n\n### § 9 最脆弱的假设\nRAVEL 的核心假设是：从 3,000 个采样状态中学到的提问策略，能泛化到测试集的复杂状态甚至不同检索器上。若该假设不成立，策略可能只是在有限状态池上过拟合了特定排名模式，而非真正学会了基于候选图像生成有用问题。论文虽提供了跨数据集和更换检索器的迁移实验作为证据，但 3K 状态池相对较小，且未验证在分布外真实交互场景下的泛化能力，这是其潜在风险。\n\n### § 10 最小复现实验\n若有一周时间，可最小化复现“离线静态标签与下游排名提升无相关性”这一诊断结论。从 Interactive-PEDES 测试集采样约 400 个交互状态，使用现成多模态大模型对候选问题进行“区分度”打分。随后执行问答并计算检索后的倒数排名增益（$\\Delta RR$）。测量模型打分与 $\\Delta RR$ 的 Spearman 相关系数。若相关系数接近 0，则支持原结论；若存在显著正相关，则说明离线监督仍具参考价值，反驳了该诊断。", "research_value": "### § 11 最强反例设计\nRAVEL 可能只是在常规数据分布上学会了利用某些主导视觉特征的捷径，而非真正掌握了基于候选差异的动态提问能力。为检验这一点，可构建一个高混淆度的图库子集，其中所有候选图像共享相同的主导属性（例如全穿黑衣、同发型），仅在细微配饰上存在差异。如果在这种极端相似场景下，RAVEL 的提问策略退化为无效提问且排名无法提升，就说明它高度依赖常见区分性特征，在缺乏这些特征时会可预测地失败。\n\n### § 12 后续研究设想\nRAVEL 的训练仅依赖 3,000 个采样状态，且 Answerer 和 Retriever 始终冻结，这可能导致提问策略过拟合于固定的回答风格和检索器偏好。后续研究可检验“扩大交互状态采样规模并引入困难负样本挖掘是否能提升分布外泛化能力”。具体做法是将训练采样状态扩大十倍，并刻意筛选视觉高度相似的候选图像加入训练。首个对照实验在原规模和扩大规模下分别训练，然后在包含严重遮挡的分布外测试集上比较 Rank-1。若扩大采样显著提升分布外性能，则证明原方法确实受限于状态池规模。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Lyucheng Qian\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"John Yuehan Zhang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Pingyu Wang\", \"affiliations\": [1], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Sichuan University\"},\n    {\"id\": 2, \"name\": \"University of California, Berkeley\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "部分证据下的交互式检索是一个序列信息获取问题：智能体必须决定提出哪个问题能为下一次检索更新产生最有用的证据。现有系统通过模仿候选问答对的离线排序来训练这一决策，尽管问题的价值取决于其引发的响应及其对检索的下游影响。我们证实，候选区分度和感知有用性为该目标提供了弱监督，随后引入了 RAVEL，这是一个用于交互式行人重识别的检索感知在线强化学习框架。RAVEL 从有监督的问题生成进行初始化，直接观察当前的 Top-4 候选，并利用来自完整“问题-回答-检索”闭环的排序反馈来优化提问策略。在 Interactive-PEDES 上的实验表明，RAVEL 在五轮交互中表现出逐步增强的检索性能。进一步分析表明，RAVEL 将提问预算重新分配给局部化的开放式属性，这些属性提供了更有用的检索证据，并在最初困难的查询上取得了最大的增益。"}, {"title": "One Prompt Does Not Fit All: Self-Meta-Evolve for Personalized Information Extraction", "arxiv_id": "2609.21626", "authors": "Hongliang Li, Lu Wang, Yong Xu, Hanyang Chen, Zhitao Hou, Xiaoting Qin, Song Ge, Qingwei Lin, Dongmei Zhang", "summary": "Large language models (LLMs) are increasingly deployed for enterprise information extraction (IE), where the same document must be reorganized differently for each user. Existing prompt optimization methods, however, rely on a single prompt optimized against a global objective, which is misaligned with the inherent user heterogeneity of real workplaces. We formulate enterprise IE as per-user prompt adaptation under interaction feedback and propose Self-Meta-Evolve, a hierarchical framework that maintains a dedicated prompt for each user and continuously refines it through a dual-loop process: an inner loop that edits structured prompts based on persona-conditioned feedback, and an outer loop that evolves the meta-prompt itself by distilling successful editing patterns. To enable scalable training and evaluation, we release a persona-driven IE benchmark of 292 simulated enterprise users, paired with a reproducible persona-generation pipeline grounded in O*NET occupational taxonomies. On this benchmark, Self-Meta-Evolve achieves a 74.58% success rate, outperforming the strongest prompt-optimization baseline by 13.56 absolute points, and reaches 52.54\\% within only two iterations. A double-blind human study with twenty real professionals further confirms that prompts adapted by our framework win against static baselines in 71% of pairwise comparisons.", "category": "cs.AI", "cluster": "Information Retrieval \u0026 Extraction", "tags": ["cs.AI"], "filter_reason": "论文的核心贡献是提出了一个名为 \"Self-Meta-Evolve\" 的分层框架，该框架通过双循环过程（内循环根据反馈编辑结构化提示词，外循环通过提炼成功编辑模式来演化元提示词）实现了基于交互反馈的持续自我完善。这高度符合研究焦点中的“自我演化”方向。尽管论文的应用场景是企业信息提取，但其本质机制是“提示词优化”和“迭代改进”，属于 LLMs Improving LLMs 的自我演化前沿。根据筛选标准第一步和第四步的明确规定，如果论文的核心机制是 self-evolving / self-improving / iterative improvement，或者将“自我演化”机制应用于特定领域，均应优先保留。因此，该论文符合研究范围。", "intro_logic": "### § 1 研究问题与重要性\n论文解决企业信息提取中不同用户需要个性化提取结果的问题，提出基于交互反馈的逐用户提示词适应机制。在真实企业环境中，同一份文档对不同角色（如项目经理与财务分析师）的价值完全不同，72%的用户需要手动修改通用输出。传统静态提示词无法满足这种动态、特定角色的需求。解决该问题能显著提升企业数据处理的准确性与效率，使大语言模型真正适应复杂的工作场景。\n\n### § 2 前人工作与不足\n此前的提示词优化方法（如ProTeGi、APE、OPRO）均假设优化一个针对固定数据集和全局目标的单一提示词。这些方法虽能通过搜索、文本梯度或进化机制提升模型表现，但其核心假设失效：它们认为提取结果的“正确性”是绝对的。实际上，企业环境中的正确性取决于“谁在阅读”，全局优化的单一提示词与用户中心的个性化需求存在根本错位，无法处理角色特定的反馈信号。", "core_insight": "### § 3 重建作者的思考路径\n\n以下是对作者思路的推测性重建。作者可能注意到，企业 IE 中同一文档对不同角色意味着不同抽取目标，而现有 prompt 优化都假设全局单一目标。组织研究的 Job Crafting 理论提示工具须对齐角色需求。两个经验观察推动了设计：LLM 角色扮演可模拟用户反馈，prompt 优化天然分层（低层编辑、高层策略）。于是想到为每个用户维护专属 prompt，用模拟反馈驱动优化，并把跨用户的成功编辑经验提炼为共享元策略。\n\n### § 4 核心直觉\n\n抽取的\"正确\"取决于谁在读，因此必须按用户定制 prompt 并用反馈迭代。关键在于双层结构：内循环根据用户反馈编辑具体 prompt，外循环从成功轨迹中提炼跨用户通用的编辑策略，使后续用户更快收敛。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n输入: persona u, 文档 x\n        |\n        v\n  当前 prompt p_t ---\u003E [抽取 LLM] ---\u003E 输出 y_t\n                                          |\n                                          v\n                                   [AI User 反馈] ---\u003E 结构化反馈 S_t\n                                          |\n                                          v\n  meta-prompt π ---\u003E [编辑代理] \u003C--- (p_t, S_t)\n                          |\n                          v\n                    编辑计划 E_t ---\u003E 更新 prompt p_{t+1}\n                          |\n                   (若 loss 下降)\n                          |\n                          v\n                   成功轨迹存入 Buffer B\n                          |\n                   (当 |B| = K 时)\n                          |\n                          v\n                   [Meta-Optimizer] ---\u003E 更新 π (外循环)\n```\n\n框架将每个抽取 prompt 表示为 JSON-like 结构化对象，键为功能区块（任务描述、抽取指令、输出 schema、示例、约束规则），每个区块带稳定 point_id，使编辑可精确定位而非重写整段（§5.1）。\n\n**内循环**（§5.2）：每步采样 persona $u$ 和文档 $x$，当前 prompt $p_t$ 经 LLM 生成 $y_t$；AI User 模块角色扮演 $u$，对 $y_t$ 中每个抽取产物返回 keep/revise/delete 的结构化反馈 $S_t$；编辑代理在 meta-prompt $\\pi$ 指导下生成编辑计划 $E_t$，定位具体 (section, point_id) 执行 replace_content、patch_logic 或 add_constraint。若更新后 loss 下降，轨迹 $(p_t, S_t, E_t)$ 存入成功缓冲区 $B$。\n\n**外循环**（§5.3）：当 $|B|$ 达到阈值 $K$，meta-optimizer 读取累积成功轨迹，重写 $\\pi$ 以捕获跨用户泛化的编辑模式（如反馈指示过度抽取时优先收窄 instr.scope 而非重写示例），使后续内循环对未见 persona 用更少步数适配。\n\n### § 6 核心数学推导\n\n优化目标是最小化期望反馈损失：$\\min_p \\mathbb{E}[g(F_\\phi(u, x, f_{\\text{LLM}}(x,p)))]$。其中 $F_\\phi$ 返回离散反馈对 $\\{(a_i, t_i)\\}$，$t_i \\in \\{\\textit{revise}, \\textit{delete}\\}$；$g$ 将其转为标量 $L = \\lambda_r \\cdot |\\textit{revise}| + \\lambda_d \\cdot |\\textit{delete}|$。权重依据试点标注设定：5 位企业用户在 1–5 Likert 量表上评定，删除产物的感知成本约为修改的 2 倍（均值比 2.04±0.41），故取 $\\lambda_d = 2\\lambda_r$。成功阈值 $\\tau$ 取最强 baseline ProTeGi 在 dev 集上的中位部署 loss（归一化 $\\tau=0.75$），确保\"成功\"代表对先前 SOTA 的严格改进。\n\n### § 7 实验设计与结论\n\n**RQ1：方法是否优于现有 prompt 优化器？** 在 292-persona 评测集上对比 7 个 baseline（ProTeGi、OPRO、EvoPrompt、Bandit-UCB、APE、MetaSPO、Pareto Prompt）。Self-Meta-Evolve 达 74.58% SR，比最强 baseline 高 13.56 个百分点，且仅 2 步迭代（SR@2=52.54%）即超过多数 baseline 的最终 SR，表明进化的 meta-prompt 每步产出更高质量编辑。\n\n**RQ2：meta-evolution 是否提升收敛与跨域鲁棒性？** 追踪 20 步优化曲线，ProTeGi 在 $t\\approx10$ 趋于平台而外循环持续提升上限。在 STEM→Humanities 跨域迁移中，baseline 性能下降 8–16 个百分点，本方法仅降 4.0 点，说明 meta-prompt 内化了跨域编辑原则而非过拟合 STEM 风格错误。\n\n**RQ3：各组件贡献与 scaling？** 消融显示去掉外循环 SR 降 17 个百分点（74.6→57.6），是后期增益主驱动；成功缓冲区和结构化编辑计划提升早期效率。persona 池从 50 扩至 150 时 SR 急升（+15.7），200 后收益递减，292 位于饱和点之上。20 位真实专业人士的双盲成对评测中，adapted prompt 在 71% 比较中胜出，证实合成环境优化的增益可迁移至真实用户。", "additional_insights": "### § 8 阅读收获\n\n论文将企业信息抽取重新定义为\"基于交互反馈的逐用户提示适配\"：同一文档对不同角色应产出不同结构化结果，全局单一提示无法满足此需求。核心机制是双层循环——内循环根据AI用户反馈编辑结构化提示的特定区块，外循环从跨用户成功轨迹蒸馏元提示，使编辑策略可迁移到未见角色。结构化提示表示让编辑可定位到具体指令而非整体重写，提升了优化的稳定性和可解释性。\n\n### § 9 最脆弱的假设\n\n最关键的假设是LLM扮演的AI用户能忠实模拟真实用户反馈。若不成立，整个优化循环拟合的是代理目标而非真实偏好——LLM评判者可能系统性偏好某些输出模式（如更规整的格式），与真实用户关注的语义准确性偏离。论文证据有限：20位专业人士的成对比较中71%偏好适配提示，但样本小；AI用户与抽取器默认同用GPT-5.1，存在自我偏好漂移风险，跨模型检验中成功率从0.746降至0.728，提示该假设并非完全稳固。\n\n### § 10 最小复现实验\n\n选取5–10个差异明显的角色（如项目经理、法务顾问、运维工程师），每个用LLM生成3–5份合成文档并编写3–4条偏好声明。实现AI用户反馈模块和内循环（初始提示→抽取→反馈→定位编辑→再抽取，迭代4–8步），跳过外循环。以人工标注衡量适配前后输出与角色偏好的匹配度。若适配后匹配度显著高于初始提示，支持\"逐用户适配优于全局提示\"的核心主张；若无差异或下降，则质疑内循环机制本身的有效性。", "research_value": "### § 11 最强反例设计\n最有力的攻击针对“AI用户能忠实模拟真实反馈”这一核心假设。我会在需要深层专业逻辑而非表面格式的领域设计反例，例如法律合同中的隐性违约风险提取。在此场景下，AI用户可能因缺乏真实业务约束，倾向于奖励格式规整但语义错误的输出。如果用这种反馈优化提示词，真实法务专家的盲测可能会显示，适配后的提示词因过度迎合AI偏好而引入更多致命遗漏，证明内循环拟合的是代理目标而非真实需求。\n\n### § 12 后续研究设想\n关键局限在于AI用户与抽取器同源导致的自我偏好漂移。后续研究可测试：引入少量真实人类反馈来校准AI用户的评判标准，能否提升优化后提示词在真实场景的泛化能力。具体做法是收集少量真实专家对初始输出的修订意见，将其作为上下文示例注入AI用户模块，使其学习人类关注的语义维度。首个对照实验将比较“纯AI反馈”与“人类校准AI反馈”两组，通过真实专家盲测判断校准机制是否显著提高提示词适配的有效性。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Hongliang Li\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Lu Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yong Xu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hanyang Chen\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Zhitao Hou\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiaoting Qin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Song Ge\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Qingwei Lin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Dongmei Zhang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Microsoft\"},\n    {\"id\": 2, \"name\": \"Beijing Jiaotong University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Work conducted during Hongliang Li's internship at Microsoft.\"}\n  ]\n}\n```", "summary_translation": "大语言模型 (LLMs) 正日益广泛地被部署于企业信息抽取 (IE) 任务中，在这些任务中，同一份文档必须针对不同用户进行差异化的重组。然而，现有的提示词优化方法依赖于针对全局目标进行优化的单一提示词，这与真实工作场景中固有的用户异质性不匹配。我们将企业 IE 形式化为交互反馈下的针对单用户的提示词自适应，并提出了 Self-Meta-Evolve。这是一个分层框架，为每个用户维护专属提示词，并通过双循环过程持续对其进行优化：内循环根据基于用户画像的反馈编辑结构化提示词，外循环则通过提取成功的编辑模式来演化元提示词本身。为了实现可扩展的训练与评估，我们发布了一个包含 292 个模拟企业用户的基于用户画像的 IE 评测基准，并配套了一条基于 O*NET 职业分类体系的可复现的用户画像生成流水线。在该评测基准上，Self-Meta-Evolve 达到了 74.58% 的成功率，比最强的提示词优化基线高出 13.56 个百分点，并且仅需两次迭代即可达到 52.54%。一项由 20 位真实专业人员参与的双盲人类评估研究进一步证实，由我们框架自适应生成的提示词在 71% 的成对比较中胜过静态基线。"}]}, {"name": "Multi-Agent \u0026 Social Systems", "count": 2, "papers": [{"title": "Scaling Discovery through Test-Time Communication", "arxiv_id": "2609.21032", "authors": "Jongho Park, Vasilis Kontonis, Shivam Garg, Akshay Krishnamurthy, Dimitris Papailiopoulos", "summary": "Science advances not in isolation but through collaboration, yet existing agentic systems capture little of this. Whether communicating agents help remains an open question with mixed prior results. We show that test-time communication can substantially outperform independent parallel attempts on challenging tasks, where sharing a breakthrough can push the whole group forward. We first study the effect of scaling multi-agent test-time communication, where agents have no predefined roles and communicate via a shared directory, on ARC-AGI-3, a benchmark requiring novel problem solving. We find that a team of $k$ communicating agents, team@$k$, matches the success rate of $4k$ independent agents, and this advantage grows with $k$, suggesting gains compound with scale. The effect is not merely efficiency: a task that no single agent can solve, a team of agents can solve reliably. Furthermore, these gains transfer to research-oriented tasks, given sufficient compute. On polyomino packing, communicating agents outperform best@$k$ and exceed the prior best-known score. On MNIST classifier compression, communication surpasses the best-known human solution. A team of four agents produced a 1,957-byte classifier submission achieving 99.4% test accuracy, smaller than both the best-known human solution and the best single-agent result. These gains are not unconditional. Independent agents may outperform communication when compute is limited or when a clear measure of progress is absent. However, under sufficient compute and clear feedback, multi-agent communication consistently yields stronger results.", "category": "cs.CL", "cluster": "Multi-Agent \u0026 Social Systems", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是研究多智能体在测试时通过通信进行协作的机制，以及这种机制如何随着规模扩展而提升解决复杂挑战性任务的能力。论文明确指出现有的“智能体系统”在协作方面存在不足，并探讨了在测试时引入多智能体通信的效果。\n\n符合筛选标准的原因如下：\n1. 核心范式匹配：论文的研究对象明确是 Agentic systems 和 Multi-Agent Systems (MAS)。它探讨了多智能体之间新的协作机制（无预定义角色的共享目录通信），这属于你关注的“多智能体”方向。\n2. Test-Time Scaling 保留规则：根据你的重要校准和第一步规则，研究 test-time scaling、推理策略搜索、协作意图的论文，只要明确指向 Agentic / LLM Agents，就应保留。该论文标题和摘要直接围绕 test-time communication 和 agentic systems 展开，完全符合此规则。\n3. 非排除项：虽然论文在 ARC-AGI-3 和 MNIST 等任务上进行了评估，但这些任务只是用于测试智能体发现和解决问题能力的 benchmark，论文的本质是研究多智能体协作机制的效果，而非将LLM作为工具应用于特定领域。同时，论文没有仅停留在多智能体的拓扑结构或消息路由等系统工程层面，而是关注通信带来的“协作意图”和“群体智能”涌现，因此不属于被排除的“多智能体拓扑与编排”类别。", "intro_logic": "### § 1 研究问题与重要性\n论文探讨在测试时计算中，多个大语言模型（LLM）智能体通过通信协作，能否在开放式探索任务上超越独立并行的尝试。现有方法通常让智能体独立采样多次并取最佳结果（best@k），但这浪费了单次运行中产生的中间发现和失败教训。明确通信在何种条件下能将并行探索转化为累积进展，对于扩展LLM解决复杂长周期研究任务的能力至关重要。\n\n### § 2 前人工作与不足\n针对多智能体协作，前人主要尝试了多智能体辩论和基于持久记忆的协调系统。多智能体辩论让模型交换意见以达成共识，但在缺乏可靠外部验证器时，智能体容易盲从错误多数或向非专家妥协，导致“专业知识稀释”，效果往往不如简单的独立采样。虽然部分协调系统能在可清晰分解的任务上通过分治获得收益，或发现更多漏洞，但它们未能证明在计算量匹配的条件下，通信本身能带来超越简单并行化的效率提升。", "core_insight": "### § 3 重建作者的思考路径\n\n独立并行采样是测试时计算的标准做法，但每次尝试的中间发现无法被其他运行中的搜索利用——一个 agent 走过的死胡同、找到的可用启发式，对同伴完全不可见。多 agent 辩论曾被寄予厚望，但反复表现出失败模式：没有验证器时，agent 会向错误多数妥协或稀释专家判断，效果甚至不如简单的独立采样加聚合。这些负面结果暗示，通信本身不是问题，问题在于 agent 缺乏客观依据来判断该采纳谁的发现。科学协作的类比提供了一个线索：科学家并非简单分工，而是根据他人已验证的结果调整自己的搜索方向，将分散的努力转化为累积进步。作者可能由此推断，如果任务本身提供可查询的验证信号——关卡是否通过、分数是否提高、文件是否变小——agent 就能在搜索过程中客观筛选同伴的发现并在此基础上继续推进，而非盲目跟从。一个简单的概率模型进一步支撑了这一推断：若任务需要 m 个连续突破，独立采样要求某个 agent 独自快速完成全部序列，而通信团队在每个阶段都可借用不同成员的突破，将\"各 agent 完成时间之和的最小值\"转化为\"各阶段最小完成时间之和\"，在足够计算预算下产生指数级的成功率分离。\n\n### § 4 核心直觉\n\n通信奏效的核心机制是\"已验证进度共享\"（verified progress sharing）：每当一个 agent 取得可被客观验证的突破，所有同伴都能在此基础上继续搜索，而非各自从头发现。这让并行探索从\"选最好的一条完整轨迹\"变成\"在每个阶段拼接最快的突破\"，使团队累积进步的速度远超任何个体。这个机制只在两个条件同时满足时生效——任务提供可被 agent 实时查询的验证信号，且每个 agent 拥有足够计算预算来消化和扩展同伴的发现。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n    ┌─────────── 共享工作区 ───────────┐\n    │  slots/  findings/  score log/  │\n    │  disconfirm/                    │\n    └──┬───────────┬──────────────┬───┘\n   读/写│        读/写│          读/写│\n  ┌─────▼──┐  ┌─────▼──┐    ┌─────▼──┐\n  │Agent 1 │  │Agent 2 │... │Agent k │\n  │认领slot│  │认领slot│    │认领slot│\n  │独立探索│  │独立探索│    │独立探索│\n  └────┬───┘  └────┬───┘    └────┬───┘\n       │           │             │\n       └─────┬─────┴──────┬──────┘\n             │比较验证分数 │\n             ▼           ▼\n    ┌──────────────────────┐\n    │verified progress     │\n    │sharing               │──┐\n    │更优→采纳+保留变体     │  │\n    └────────┬─────────────┘  │\n             │迭代探索         │\n             └────────────────┘\n             ▼\n       最优提交结果\n```\n\n论文研究一种最简化的测试时通信机制：k 个完全相同的 agent 在同一容器中并发运行，无预分配角色、无中央协调器，仅通过共享文件系统异步通信（Section 2）。具体步骤如下：\n\n- **启动与认领**：k 个 agent 并发启动，通过原子文件操作（`mkdir`）竞争认领编号 slot 目录，确保各 agent 声明不同的方法，避免早期趋同（Section 2，prompt 第 1 条）。\n- **独立探索与评测**：每个 agent 在私有 scratch 目录中执行命令、调用工具、用任务自带评测器打分，将分数追加到共享 score log（prompt 第 2–3 条）。\n- **发布发现**：agent 将中间结果、失败证据和可复现指令写入共享 findings 和 disconfirm 日志，附带时间戳与评测分数（prompt 第 4 条）。\n- **验证式采纳**：当 agent 观察到 peer 的评测分数明显优于自身时，采纳对方方法但保留一个有意义的变体（如不同参数或子策略），防止过早收敛（prompt 第 6 条）。\n- **迭代与输出**：探索—评测—发布—采纳循环持续至预算耗尽，系统保留整个运行中分数最高的有效提交（Section 2.1 Metrics）。\n\n### § 6 核心数学推导\n\n论文在 Section 3.4 提出一个教学模型，形式化\"验证式进展共享\"（verified progress sharing）的直觉。考虑需要 m 次连续改进的任务，agent i 在第 j 阶段的搜索时间 $X_{ij}$ 独立同分布于指数分布 $\\text{Exp}(\\lambda)$。独立 agent 要求某一个 agent 独自走完全部 m 个阶段，完成时间为 $T_{\\text{best}} = \\min_i \\sum_j X_{ij}$，即\"和的最小值\"。通信团队在每个阶段采用最先突破者的成果，完成时间为 $T_{\\text{team}} = \\sum_j \\min_i X_{ij}$，即\"最小值的和\"。通信的核心作用是将\"和的最小值\"转化为\"最小值的和\"。\n\n由于 k 个指数变量最小值服从 $\\text{Exp}(k\\lambda)$，团队总时间服从 Erlang 分布，均值为 $m/(k\\lambda)$。在固定预算 $\\tau = \\alpha m / \\lambda$（$1/k \u003C \\alpha \u003C 1$）下，Proposition 1 证明：团队成功概率以 $e^{-mI(k\\alpha)}$ 速率趋近 1，而独立 agent 以 $ke^{-mI(\\alpha)}$ 速率趋近 0，其中 $I(a) = a - 1 - \\log a \u003E 0$。这意味着随着所需改进次数 m 增长，两者出现指数级分离。模型同时警告\"羊群效应\"（herding）：若 k 个 agent 收敛为 $g \u003C k$ 个独立组，有效发现率降为 $g\\lambda$，优势随之缩小。\n\n### § 7 实验设计与结论\n\n论文围绕三个递进问题设计实验。第一，通信是否比独立并行尝试更有助于新颖问题求解？在 ARC-AGI-3 上，team@5 的解题率等价于 33 个独立 agent（6.6 倍），且能解决单个 agent 在 64 次试验中从未通过的游戏（LP85 从 0% 升至 65%），表明通信不仅是效率提升，更能解锁单个 agent 无法完成的任务。第二，通信能否在长周期研究任务中持续推动进展？在多边形装箱任务上，team@3 达到 0.945 分，超越先前最优 0.894；在 MNIST 分类器压缩上，team@4 产出 1,957 字节分类器，优于已知最优人类方案的 2,461 字节，两项均创下新纪录。第三，通信是否总是有益？在 Terminal-Bench 2.0 上，由于中间验证信号不可靠，team@2 优于单个 agent 但未超越 pass@2。综合结论是：通信在计算充足且存在可访问验证器时最为有效，验证式进展共享是其核心机制；当反馈稀疏或计算受限时，通信的协调成本可能超过收益。", "additional_insights": "### § 8 阅读收获\n测试时多智能体通信在具有明确验证信号的开放式任务中能显著超越独立并行采样。通过共享工作区，智能体分享经过验证的进展，将并行探索转化为累积进步，从而突破单智能体的性能瓶颈。这种优势在计算充足时随团队规模复合增长，但在缺乏可靠验证或预算过低时失效。\n\n### § 9 最脆弱的假设\n该方法最脆弱的假设是任务必须提供可被智能体直接访问且能可靠区分优劣的验证信号。若验证信号稀疏或存在噪声，智能体可能采纳错误方向，导致过早收敛或性能稀释。论文在Terminal-Bench 2.0上的负面结果印证了这点：因缺乏测试时的密集验证，通信团队未能超越独立采样。这表明该机制成败高度依赖任务环境的反馈质量。\n\n### § 10 最小复现实验\n用一周时间可复现Polyomino packing任务的核心机制。使用同一大语言模型生成3个独立智能体和3个通信智能体，在3小时预算内编写C++多格骨牌打包程序，测量两者的最高打包得分。若通信团队得分显著高于独立团队最佳得分，则支持原结论；若持平或更低，则反驳了通信在短时间内的优势。此实验保留任务和验证机制，仅缩小规模。", "research_value": "### § 11 最强反例设计\n如果我要反对这篇论文，我会设计一个具有“欺骗性局部最优”的任务来挑战它。在这种任务中，中间评测分数高的方法往往导向死胡同，而低分路径才是通向最终解的唯一途径。我会在这种环境下比较 team@k 和 best@k。如果通信团队因为频繁采纳看似更优的中间分数，导致所有 agent 迅速涌入同一个死胡同，而独立采样因保持多样性最终找到了正确路径，这就直接反驳了“验证式进展共享总是有益”的声称。这表明当验证信号存在系统性偏差时，通信会可预测地摧毁探索多样性。\n\n### § 12 后续研究设想\n论文的核心局限在于高度依赖任务自带的可靠验证器，一旦反馈稀疏，通信就会引发过早收敛。后续研究可以探讨：在缺乏外部验证器的任务中，引入“对抗性验证”机制能否恢复通信的收益？具体做法是修改通信协议，要求 agent 在采纳 peer 的高分发现前，必须先尝试复现并寻找反例来推翻它。首个对照实验可以在 Terminal-Bench 2.0 上进行，比较加入对抗验证的 team@k、原始 team@k 和 best@k。如果新机制能显著减少群体盲从，并使通信团队的表现超越独立采样，就说明内部对抗可以替代外部验证器。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jongho Park\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Vasilis Kontonis\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Shivam Garg\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Akshay Krishnamurthy\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Dimitris Papailiopoulos\", \"affiliations\": [2], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"UC Berkeley\"},\n    {\"id\": 2, \"name\": \"Microsoft Research\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"This work was done during an internship at Microsoft Research.\"}\n  ]\n}\n```", "summary_translation": "科学的发展并非孤立进行，而是通过协作推进，然而现有的智能体系统却很少体现这一点。通信智能体是否能带来帮助仍是一个悬而未决的问题，且以往的研究结果褒贬不一。我们表明，在具有挑战性的任务上，测试时通信可以显著优于独立的并行尝试，因为分享突破能够推动整个群体向前发展。我们首先在 ARC-AGI-3（一个需要新颖问题解决能力的评测基准）上，研究了扩展多智能体测试时通信的效果，其中智能体没有预定义角色，并通过共享目录进行通信。我们发现，由 $k$ 个通信智能体组成的团队（team@$k$）能够匹敌 $4k$ 个独立智能体的成功率，并且这种优势随 $k$ 的增加而扩大，表明收益随规模呈复合增长。这种效果不仅仅体现在效率上：单个智能体无法解决的任务，智能体团队却能够可靠地解决。此外，在算力充足的情况下，这些收益可以迁移到面向研究的任务中。在多联骨牌装箱（polyomino packing）任务上，通信智能体的表现优于 best@$k$，并超越了此前已知的最高分。在 MNIST 分类器压缩任务上，通信机制超越了已知最佳的人类解决方案。一个由四个智能体组成的团队生成了一个 1,957 字节的分类器提交结果，实现了 99.4% 的测试准确率，其大小既小于已知最佳的人类解决方案，也小于最佳的单智能体结果。然而，这些收益并非无条件的。当算力受限或缺乏明确的进展衡量标准时，独立智能体的表现可能会优于通信智能体。但是，在算力充足且反馈明确的情况下，多智能体通信始终能够产生更强的结果。"}, {"title": "Bayesian Belief Layer for Controllable Opinion Dynamics in LLM Agents", "arxiv_id": "2609.21997", "authors": "Hafsa Akbar, Daniel Platnick, Marjan Alirezaie, Hossein Rahnama", "summary": "LLM agents in social simulation revise their opinions implicitly, in context: how open an agent is to persuasion can neither be specified nor verified, and collective outcomes inherit the model's training prior. We introduce Bayesian Chronicle Agents (BCA), a minimal belief layer separating \\emph{what} an agent believes from \\emph{how} it speaks. Each stance is a probability, updated by one Bayesian step per utterance heard. A single prior-strength parameter $κ$ encodes stubbornness, modeled after its role in Friedkin--Johnsen (FJ) opinion dynamics. We then sweep this parameter to yield three canonical regimes of opinion dynamics on demand (consensus, persistent disagreement, committed-minority influence), with persistent disagreement matching the FJ closed-form fixed points at $R^2\\!=\\!0.93$--$0.99$. We further show that prescribed $κ$ remains recoverable after the language round-trip, with perfect rank-order recovery across all four models. Explicit belief also makes simulation auditable: the layer surfaces systematic per-model stance biases that end-to-end simulation would silently absorb.", "category": "cs.AI", "cluster": "Multi-Agent \u0026 Social Systems", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n论文解决如何在社会模拟中结合大语言模型（LLM）的语言能力与经典观点动力学的数学可控性。当前 LLM agents 隐式修改观点，导致群体因模型固有偏见发生“共识崩溃”，且无法指定或验证其对说服的开放程度。解决该问题能使模拟结果可审计、可复现，并按需精准控制共识或持续分歧等动态机制。\n\n### § 2 前人工作与不足\n该问题此前未被充分解决，受限于经典模型与 LLM 模拟的鸿沟。经典模型（如 DeGroot 和 Friedkin–Johnsen）虽具可解释性，但仅操作纯标量，缺乏语言交互能力。而现有 LLM 模拟将信念更新交由模型内部处理，动态机制只能从先验中“涌现”而无法预设。最相关的 Belief Engine 虽引入可审计的信念累加器，但其参数仅具经验意义，缺乏与经典理论的精确对应，且未验证参数在语言往返后的可恢复性及群体规模验证。", "core_insight": "### § 3 重建作者的思考路径\n\n经典 opinion dynamics（DeGroot、FJ、committed-minority）提供了可解释的数学机制——共识、持续分歧、少数派影响——但只操作裸标量，没有语言。LLM agents 恰好填补了语言缺口，却带来两个已知失败：群体向模型固有偏差收敛（consensus collapse），且 LLM 的信念修正违反 Bayesian 规范、校准差。一个自然的想法是：保留经典模型的标量更新规则作为骨架，让 LLM 只负责语言层面的输入输出，不让它自己决定信念如何变化。FJ 模型中的 stubbornness 参数已证明能解释持续分歧，若把它外置为 agent 的显式属性，就能在 LLM 的语言往返中保持对动态的控制。\n\n### § 4 核心直觉\n\n核心在于把\"agent 相信什么\"从 LLM 内部拿出来，变成一个外部的概率值。LLM 只做两件事：把当前信念翻译成自然语言发言，把听到的发言翻译成标量证据。信念更新走经典 Bayesian 规则，由单一参数 κ 控制固执程度。这样语言能力被利用，但信念动态仍然可预测、可审计。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n┌─────────────────┐\n│ Agent 信念状态   │  κ(固执), γ(遗忘), b(当前信念)\n└────────┬────────┘\n         │\n         ▼\n┌─────────────────┐\n│ Generator LLM   │  信念 b → 自然语言发言\n│  (T=0.9)        │\n└────────┬────────┘\n         │ 发言文本\n         ▼\n┌─────────────────┐\n│ Appraiser LLM   │  发言 → 标量证据 e∈[0,1]\n│ (T=0, τ校准)     │\n└────────┬────────┘\n         │ 证据 e\n         ▼\n┌─────────────────┐\n│ Bayesian 更新   │  b' = b + η(e-b) + ρ(b₀-b)\n│ (FJ 形式)        │\n└────────┬────────┘\n         │ 新信念 b'\n         └──────▶ 回到 Generator (下一轮)\n```\n\nPipeline 步骤如下：\n\n1. **信念状态初始化**：每个 agent 的信念由 prior strength κ（固执程度）、forgetting factor γ（固定 0.7）和当前 credence b 组成，存储在 LLM 外部的概念节点上（§3.1, §3.3）。\n2. **Generator 生成发言**：Generator LLM（温度 0.9）将数值信念 b 通过九档定性描述映射为自然语言发言，发言中不暴露任何数字或概率（§3.2, App. D）。\n3. **Appraiser 评估证据**：Appraiser LLM（温度 0，经温度 τ 校准）将听到的发言评估为标量证据 e∈[0,1]，表示该发言对 a⁺ 的支持强度。校准用 100 条人工标注 utterance 拟合，修正 appraiser 的过度自信（§3.2, App. B）。\n4. **Bayesian 更新信念**：按 FJ 形式执行单步更新 b' = b + η(e−b) + ρ(b₀−b)，η 由 κ 决定（κ 越大越固执），ρ 由 γ 决定（γ\u003C1 时产生向初始信念的锚定拉力）。更新后的 b 进入下一轮发言，形成回路（§3.3, Eq. 2）。\n5. **独立探针验证**：每轮额外请求 agent 做 0–100 自评，该分数不参与任何信念更新，用于验证隐藏信念是否真实支配表达行为（§4, App. C）。\n\n### § 6 核心数学推导\n\nAgent 信念用 Beta 分布的伪计数 (α, β) 表示，credence b = α/n，n = α+β。每听到一条发言，证据 e 按权重 w=1 分配到两个 stance：α' = γα + we，β' = γβ + w(1−e)。γ\u003C1 时旧证据被折扣，模拟遗忘。改写为 credence 形式后，单步更新为 b' = b + η(e−b) + ρ(b₀−b)，其中 η = w/n' 衡量对新证据的敏感度，ρ = κ(1−γ)/n' 衡量向初始信念 b₀ 的锚定强度。κ 越大则 n' 越大、η 越小，agent 越难被说服——这正是 FJ 模型的核心结构：社会影响与初始信念锚定的凸组合。\n\n关键理论结论有两条。第一，γ=1（无遗忘）时锚定项 ρ 消失，计数无限增长，先验权重趋于零，所有 agent 收敛到共识，无论 κ 如何设置。第二，γ\u003C1 时计数饱和于 κ + w/(1−γ)，初始信念保持永久权重，异质 κ 可维持持久分歧，系统稳态恰好对应 FJ 闭式不动点。此外，仿射更新形式决定了 committed minority 影响是平滑的：少数派比例 f 的函数连续且严格递增，不存在 tipping point（临界点），这与含非线性阈值的经典模型形成对比（§E.3, §E.5）。\n\n### § 7 实验设计与结论\n\n**κ 可恢复性**：设定不同 κ 值，经过\"信念→发言→评估→更新\"完整语言往返后，能否从 agent 行为中恢复 κ 的排序？实验在 4 个 LLM 上扫描 κ∈{0.5,…,32}，用说话者的潜在信念 s 替代评估证据 e 反演单步更新公式，检验语言通道是否忠实传输了 stance。结果是 4 个模型 Spearman 均为 1.0，完美恢复排序；幅度有均匀衰减（如 κ=32 恢复为 25–30），因为语言通道放大了证据-信念差距，使 agent 显得比预设更易说服（§5.1）。\n\n**三种经典 regime**：仅调节 κ 能否复现 DeGroot 共识、FJ 持久分歧、committed minority 影响？实验在 N=20 完全图上分别设置全 pliable（κ=0.1）、固执阵营+pliable 中间派（κ=16 与 κ=1）、committed 少数派（κ→∞）vs. 自由多数派（κ=4），与对应闭式解对照。结果是共识时信念收敛但落点暴露通道偏差（如 Llama 收敛到 0.01 而非 0.50）；持久分歧与 FJ 闭式解匹配 R²=0.93–0.99；少数派影响平滑无临界点，与仿射更新理论一致。关闭遗忘（γ=1）后 FJ 分歧坍缩为共识，证实遗忘是维持分歧的必要条件（§5.2）。\n\n**可审计性**：显式信念层能否暴露端到端模拟会静默吸收的模型偏差？实验绘制每个模型的 channel transfer curve（说话者潜在信念 s vs. appraiser 评估证据 e 的均值），与对角线比较。结果是每个模型都有特征性偏差：GPT 对称夸大（温和 stance 被读为更极端），Llama 统一偏向 a⁻，Claude 不对称放大 a⁻ 侧。固执 agent 被先验每步重新锚定，偏差无法累积，FJ regime 接近理论值；pliable agent 无抵抗力，偏差累积为大幅偏移的\"共识\"。端到端模拟会将这些偏移当作发现报告，而信念层使其可测量（§5.2, App. C）。", "additional_insights": "### § 8 阅读收获\n\nBCA 在 LLM 智能体的人格与语言生成之间插入显式贝叶斯信念层，将\"相信什么\"与\"如何表达\"分离。单一参数 κ 编码固执程度，调节它即可按需复现 DeGroot 共识、FJ 持续分歧和坚定少数派影响三种经典机制。κ 排序在完整语言往返后可完美恢复（Spearman 1.0），但绝对值被系统性衰减。该层还使模拟可审计，揭示各模型在立场传递中的系统性偏差。\n\n### § 9 最脆弱的假设\n\n最脆弱的假设是评估器能从生成文本中单调读回说话者信念强度。可恢复性完全依赖语言通道保持信念排序——若评估器在某些区间非单调，κ 排序恢复即失效。论文仅在一个刻意虚构、模型无强先验的二元话题上验证单调性（Pearson 0.94–0.97）。在模型有真实立场偏好时，评估器可能失去单调性，使 κ 恢复和机制控制同时崩溃，论文缺少此类证据。\n\n### § 10 最小复现实验\n\n最小实验只检验通道单调性，无需完整模拟。用单个 LLM 作为生成器，在 [0,1] 均匀取 20 个信念值，按论文九档定性映射生成发言；再用同一模型作为评估器打分。计算生成信念与评估证据的 Spearman ρ。若 ρ \u003E 0.9 支持单调性；若显著偏低或出现区间性反转，则表明该假设在更一般条件下不成立。", "research_value": "### § 11 最强反例设计\n最有力的攻击是选择大语言模型存在强烈训练先验的真实争议话题，检验评估器能否保持单调性。设定 agent 初始信念与模型固有立场相反，例如让支持控枪的模型扮演反对控枪的发言者。如果模型先验导致评估器对偏离自身立场的发言给出系统性偏低或非单调的证据值，预设的 κ 排序恢复将失效。这会直接证明该方法在真实社会模拟中无法按需控制观点动态，其声称的可控性仅限于模型无偏见的虚构场景。\n\n### § 12 后续研究设想\n关键局限在于语言通道的系统性偏差在易被说服的 agent 中会累积为大幅偏移的“共识”。后续研究可测试在评估证据后引入逆映射校准步骤，利用已测量的通道偏差曲线将证据修正回无偏状态。这值得测试是因为它能检验显式信念层能否不仅暴露偏差，还能主动消除偏差以逼近理论值。首个对照实验在完全图上设置全为易说服的 agent，比较引入校准前后的最终共识落点与理论值 0.5 的偏差。若校准后落点显著接近 0.5，说明偏差可被有效修正；若仍存在显著偏移，则表明非线性偏差难以通过简单逆映射消除。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Hafsa Akbar\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Daniel Platnick\", \"affiliations\": [2, 3], \"markers\": []},\n    {\"name\": \"Marjan Alirezaie\", \"affiliations\": [2, 3], \"markers\": []},\n    {\"name\": \"Hossein Rahnama\", \"affiliations\": [1, 2, 3], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"MIT Media Lab\"},\n    {\"id\": 2, \"name\": \"Flybits Labs\"},\n    {\"id\": 3, \"name\": \"Toronto Metropolitan University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"1\", \"text\": \"https://github.com/hafsa-akbar/bayesian-chronicle-agents\"}\n  ]\n}\n```", "summary_translation": "在社会模拟中，LLM智能体在上下文中隐式地修正其观点：智能体对说服的接受程度既无法被指定也无法被验证，且集体结果继承了模型的训练先验。我们引入了Bayesian Chronicle Agents (BCA)，这是一个最小信念层，将智能体“相信什么”与“怎么说”分离开来。每个立场均表示为一个概率，每听到一次话语便通过单步贝叶斯更新进行修正。单一的先验强度参数 $κ$ 编码了固执程度，其作用机制模仿了Friedkin-Johnsen (FJ) 观点动力学中的设定。随后，我们扫描该参数以按需产生三种典型的观点动力学状态（共识、持续分歧、坚定少数派影响），其中持续分歧状态与FJ的闭式解固定点相匹配，$R^2$ 达到 0.93 至 0.99。我们进一步表明，预设的 $κ$ 在经历语言往返（即文本生成与解析的循环过程）后仍然可恢复，在所有四个模型中均实现了完美的秩次恢复。显式的信念还使模拟变得可审计：该层会暴露出每个模型特有的系统性立场偏差，而端到端模拟则会默默吸收这些偏差。"}]}, {"name": "Reasoning \u0026 Problem Solving", "count": 1, "papers": [{"title": "Complex Problem Solving in Large Language Models: A Statistical Control Survey and Diagnostic Framework", "arxiv_id": "2609.20973", "authors": "Jiazhang Cai, Tao Wang, Ruidong Zhang, Siyuan Li, Terry Ma, Luyang Fang, Haoran Lu, Huimin Cheng, Yingchuan Zhang, Shushan Wu, Rui Xie, Lin Tang, Chao Huang, Rongjie Liu, Ziyu Liu, Meizhi Yu, Yongkai Chen, Yifan Zhou, Zeliang Sun, Chang Liu, Zhen Xiang, Wei Xiao, Zixin Rao, Xinyi Liu, Yutong Hu, Mengrui Zhang, Jing Zhang, Weidi Luo, Jincheng Yu, Zhengliang Liu, Weihang You, Hanqi Jiang, Yi Pan, Junhao Chen, Xinliang Li, Tianming Liu, Wenxuan Zhong, Ping Ma", "summary": "Complex problem solving (CPS) with large language models (LLMs) is often framed as a matter of stronger reasoning or longer generation. Yet early-step error amplification, prompt brittleness, and failures to revise incorrect commitments are difficult to explain by missing knowledge or expressive capacity alone. This survey interprets CPS as a sequential estimation-and-decision problem over a latent solution state. A controller maintains a belief about an unobserved solution trajectory, updates it as noisy intermediate evidence arrives, and decides whether to commit, verify, branch, roll back, or abstain to minimize expected loss. Reasoning supplies candidate transitions and interpretations, whereas process control shapes and evaluates those proposals and regulates subsequent transitions and observations. Within this framework, we organize existing methods around five components: explicit state representation, transition structuring, validation and constraint enforcement, search and rollback, and uncertainty management. We also interpret evaluation metrics according to the statistical quantities they estimate. The framework further yields a diagnostic hypothesis: interventions should be most effective when they target the error or uncertainty component implicated by an observed failure. We distinguish systematic, stochastic, and irreducible error together with epistemic and aleatoric uncertainty, and call this alignment problem-control fit and its failure control mismatch. For example, additional sampling may reduce sampling variability while leaving a shared systematic error unchanged. This perspective clarifies what current methods estimate and control, what remains uncontrolled, and why reliable validation, targeted recovery, calibrated uncertainty, and matched-budget evaluation are central open problems.", "category": "cs.LG", "cluster": "Reasoning \u0026 Problem Solving", "tags": ["cs.LG"], "filter_reason": "这篇论文是一篇关于LLM复杂问题求解（CPS）的综述和诊断框架研究。虽然摘要中没有直接出现“Agent”一词，但其核心内容将CPS构建为一个“顺序估计与决策问题”，并引入了一个控制器来维护对潜在解轨迹的信念，根据中间证据决定是否提交、验证、分支、回滚或放弃。这完全对应了智能体在长程任务中的规划、状态管理、搜索与自我反思机制。\n\n论文讨论的五个核心组件——显式状态表示、转移结构化、验证与约束执行、搜索与回滚、不确定性管理——均是构建和改进LLM智能体（特别是Long-Horizon Agents）能力的关键技术。此外，论文对早期错误放大、无法修正错误承诺等失败机制的诊断，直接符合筛选标准中“保留行为分析、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力”的规则。因此，该论文属于Agentic AI的研究范畴，应予保留。", "intro_logic": "### § 1 研究问题与重要性\n\n论文要回答的核心问题是：为什么LLM在复杂问题求解（Complex Problem Solving, CPS）中反复出现早期错误放大、提示脆弱性和无法修正错误承诺等失败模式，而这些失败无法仅用\"知识缺失\"或\"表达能力不足\"来解释。作者将CPS重新框架为对潜在解状态的序贯估计与决策问题：控制器维护对未观测解轨迹的信念，在有噪声的中间证据到达时更新它，并决定提交、验证、分支、回滚或弃权。这一框架的重要性在于，它将大量被笼统归为\"推理改进\"的技术重新归类为估计-决策闭环中的具体控制组件，从而提供了诊断能力——当观察到特定失败特征时，可以定位到哪个误差分量（系统偏差、采样方差、不可约噪声）是瓶颈，并匹配相应干预，而非盲目增加推理长度。\n\n### § 2 前人工作与不足\n\n此前文献主要以\"推理能力\"为解释构架来理解CPS。Chain-of-Thought (CoT) 外化了线性文本轨迹，但仅提供可见性而不约束状态转移的有效性，早期错误可在无纠正机制的情况下沿轨迹传播。基于规模的涌现能力研究显示大模型在多步基准上表现更好，但规模改善的是候选转移的提议质量，并不可靠地提供监控、验证和长程修正机制。Self-Refine、Reflexion等自纠正方法虽能局部修复，但当批评信号与原始草稿共享同一误解时，修订只是改写错误而非纠正它。这些方法的共同不足在于：它们各自只触及闭环的某一组件，却未将CPS视为需要轨迹级控制的完整估计-决策系统，因此无法解释为何增加采样不能修复共享的系统偏差，也无法诊断特定失败应匹配哪种干预。", "core_insight": "### §3 重建作者的思考路径\n\n作者 likely 从一个反复出现的经验观察出发：Chain-of-Thought 等方法在长链推理中频繁出现早期错误放大、提示脆弱和无法回滚，而这些失败无法用\"知识不足\"或\"模型不够大\"解释。与此同时，Self-Consistency 在某些任务上大幅提升、在另一些上几乎无效，Program-Aided 方法对算术错误有效但对列式错误无效，over-thinking 研究显示加长推理有时反而降低准确率。这些零散结果暗示一个统一结构：不同干预针对的是不同类型的误差。将经典的偏差–方差–噪声分解和贝叶斯滤波框架映射到推理轨迹上，自然得出\"推理负责提议、控制负责筛选与修正\"的分离，以及\"干预须匹配实际瓶颈\"的诊断逻辑。\n\n### §4 核心直觉\n\n复杂问题求解的失败本质上是过程控制失败，而非推理能力不足。推理只负责生成候选步骤，真正决定轨迹是否可靠的是验证、回滚和不确定性管理这些控制机制。因此，增加推理量若未触及实际失败所对应的误差分量（系统性偏差、采样方差或不可约不确定性），便是资源错配——这正是作者所称的 control mismatch。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n输入 x → [显式状态 s_t]\n              │ 候选转移\n              ▼\n         [转移结构化 q(s'│s,a)]\n              │\n              ▼\n         [验证/约束 p(o│s',a)]\n              │\n              ▼\n         [信念更新 b_t]\n              │\n         ┌────┼────┐\n         ▼    ▼    ▼\n       搜索 不确定性 决策\n         └────┴────┘\n              │\n   commit/verify/branch/rollback/abstain\n              │\n              ▼\n         输出答案 ŷ\n```\n\n论文将复杂问题求解建模为\"估计与决策回路\"（§2.4），推理负责提出候选转移，控制机制负责塑造、评估并决定是否接受这些转移。回路包含五个组件，每个组件对应滤波器中的一个统计对象：\n\n- **显式状态表示**（§3.1）：将中间状态外部化为可检查接口。CoT 提供线性文本可见性，Scratchpad 增加持久工作记忆，Tree-of-Thoughts 引入分支结构，逐步提升可见性、持久性和结构性，但均不约束转移本身的正确性。\n- **转移结构化**（§3.2）：约束状态转移核 $q(s_{t+1}|s_t, a_t)$。分解规划（如 Least-to-Most）将端到端生成拆为子问题序列；程序化方法（PAL/PoT）将计算委托给解释器；混合结构（PoT）让语言负责语义表述、代码负责精确计算。这些方法约束\"如何转移\"，但不检验转移是否正确。\n- **验证与约束执行**（§3.4）：充当观测模型 $p(o_{t+1}|s_{t+1}, a_t)$，用证据重加权信念。模型内部验证（Self-Refine、Reflexion）成本低但易与原轨迹共享盲区；外部可执行验证（代码执行、符号求解器）提供确定性反馈但覆盖面窄；解码时约束（语法约束解码）控制形式但不保证语义正确；多阶段管道组合互补信号，但各阶段间的误差相关性仍不受控。\n- **搜索与回滚**（§3.3）：维护多条候选轨迹以避免过早承诺。采样搜索（Self-Consistency）并行生成完整轨迹后聚合，但不提供局部回滚；树搜索（ToT）在中间状态层面分支和剪枝，但依赖评分函数质量；迭代修正局部修复草稿，但诊断信号可能不可靠；验证器触发的回滚用外部信号决定何时修正，但验证器本身可能稀疏或不完美。\n- **不确定性管理**（§3.5）：将信念的分散度和多模态性转化为决策信号。基于多样性的方法（Self-Consistency 的答案分歧度）是无标签的但不识别中间步骤错误；置信度感知决策用阈值门控提交或弃权，但原始模型置信度通常校准不良；不确定性引导的策略动态分配搜索深度和验证预算；概率控制信号将不确定性嵌入风险敏感的目标函数，但概率估计本身的误差会沿回路传播。\n\n两个交叉维度——分布式控制（§4.1，将控制权分配给多个角色/代理）和训练时内化（§4.2，通过微调或强化学习将控制行为折叠进权重）——改变组件实现方式但不引入新组件。\n\n### § 6 核心数学推导\n\n论文的核心数学框架包含四个关键推导，均作为分析骨架而非对现有系统的字面描述：\n\n**误差传播**（Eq. 1）：在参考轨迹附近，状态估计偏差 $\\mathbf{e}_t$ 的一阶演化近似为 $\\mathbf{e}_{t+1} \\approx \\mathbf{J}_t \\mathbf{e}_t + \\boldsymbol{\\varepsilon}_t$，其中 $\\mathbf{J}_t$ 是有效单步更新的雅可比矩阵，$\\boldsymbol{\\varepsilon}_t$ 是新注入的噪声。当 $\\|\\mathbf{J}_t\\| \u003C 1$ 时局部更新是收缩的，扰动被衰减；$\\|\\mathbf{J}_t\\| \u003E 1$ 时误差沿某些方向几何放大。这解释了为何早期小错误会累积成全局失败——后续步骤条件化于早期输出，错误沿轨迹复合传播。\n\n**贝叶斯滤波**（Eq. 2）：控制器对隐状态 $s_t$ 维护信念 $b_t(s) = p(s_t = s \\mid o_{1:t}, a_{0:t-1})$，分两步递归更新：先按选定动作传播先验信念，再用新观测按似然重加权。这对应经典贝叶斯滤波器的预测-更新两步结构，论文用它作为分析骨架将各方法映射到滤波器的不同组件上。\n\n**误差分解**（Eq. 4）：轨迹误差分解为系统误差（bias，跨采样轨迹共享）、随机误差（variance，采样依赖）和不可约误差（noise，偶然性）。系统误差进一步分为公式化偏差（在转移阶段通过重新规划修复）和计算偏差（在验证阶段通过可执行检查修复）。采样聚合主要降低方差项，但不修正共享的系统误差——这正是\"控制失配\"（control mismatch）的数学根源。\n\n**有效样本量**（Eq. 5）：对 $K$ 个具有平均成对相关 $\\bar{\\rho}$ 的可交换样本，有效样本量近似为 $K_{\\text{eff}} = K / (1 + (K-1)\\bar{\\rho})$。当采样轨迹高度相关时（共享同一误解），有效多样性降低，额外采样无法纠正主导的系统误差。\n\n**不确定性分解**（Eq. 6）：按全方差法则，预测不确定性 $\\text{Var}(y) = \\mathbb{E}[\\text{Var}(y|H)] + \\text{Var}(\\mathbb{E}[y|H])$，第一项是偶然不确定性（aleatoric，不可约），第二项是认知不确定性（epistemic，可通过检索或新证据减少）。区分两者决定了额外计算是否有意义：对不可约的偶然不确定性增加搜索预算是浪费。\n\n### § 7 实验设计与结论\n\n这是综述论文，通过收集已发表结果验证其诊断框架，而非设计新实验。三个核心发现：\n\n**问题一：不同干预对不同失败模式的效果是否不同？** 论文收集 Self-Consistency 在 GSM8K（56.5→74.4）和 CommonsenseQA（79.0→80.7）的效果差异，以及 GSM-HARD 上 CoT（23.1）与 PAL（61.2）的对比（Table 3）。**答案**：聚合对采样变异有效但对共享系统误差无效；可执行计算对算术偏差有效但无法修正公式化错误。这支持\"问题-控制匹配\"假设——干预应瞄准失败所暗示的误差组件。\n\n**问题二：模型内部自我修正是否可靠？** Table 4 汇总五个基准上内在自我修正与外部验证的对比。**答案**：内在自我修正在多数设置下降低准确率（如 GSM8K 95.5→89.0，CommonsenseQA 75.8→41.8），而外部验证一致提升（如 95.5→97.5，75.8→89.7）。这支持将验证视为独立控制组件而非推理的附属品，模型生成的验证信号可能与被评估的轨迹共享盲区。\n\n**问题三：增加推理量是否总能提升准确率？** 论文引用过度思考研究，发现延长推理链或增加推理时计算有时不提升甚至降低准确率。**答案**：这与\"控制失配\"假设一致——当额外计算投向了非瓶颈组件时，成本增加但不解决实际失败。但论文明确承认这些研究未在固定预算下对比不同组件，因此因果解释仍是框架的预测而非已验证事实，系统的匹配预算实验是框架邀请的核心实验。", "additional_insights": "### § 8 阅读收获\n\n论文将大语言模型的复杂问题求解重新定义为一个序贯估计与决策过程：推理只负责提出候选转移，过程控制则负责塑造、验证、搜索和回滚这些提议。在此框架下，许多被称作\"推理增强\"的技术实际上只是在控制循环的某个组件上做文章。核心诊断工具是误差分解——将轨迹误差分为系统性偏差、随机方差和不可约噪声，并主张干预必须对准失败实际来源的误差分量，否则就是\"控制错配\"。\n\n### § 9 最脆弱的假设\n\n最关键的假设是：失败签名能可靠地映射到特定误差分量，从而指导干预选择。论文自己承认这只是\"诊断假设而非识别结果\"，映射不唯一。实际中，同一个\"跨样本相同错误\"的签名既可能源于公式偏差，也可能源于验证缺失或状态表示不足；一个多跳推理失败可能同时涉及转移结构、验证和搜索三个组件。论文仅用Table 3中三个非受控案例间接支持该假设，没有在固定预算下做\"针对匹配组件 vs 针对非匹配组件\"的对照实验，因此因果链尚未被直接验证。\n\n### § 10 最小复现实验\n\n用GSM-HARD数据集和一个中等规模模型（如Code Llama或GPT-4o-mini），在固定token预算下对比两种干预：增加采样次数做多数投票，与将算术委托给Python解释器执行。前者针对方差，后者针对计算偏差。若论文诊断成立，在相同预算下程序执行应显著优于更多采样，因为大数运算的系统性错误无法靠采样消除。若两者提升幅度相当，则说明该场景下误差分量并非如诊断所预测的那样可分离，控制错配假设的适用范围需收窄。", "research_value": "### § 11 最强反例设计\n\n最强反例应挑战“误差分量可分离且能独立干预”的核心假设。在 GSM-HARD 等多跳大数运算任务中，可设计固定预算实验：一组用 Python 解释器消除计算偏差，另一组仅增加采样次数降低方差。如果程序执行组因模型规划本身错误而执行错误代码，准确率未提升，而增加采样组偶然采到正确规划使准确率上升，就证明系统偏差与随机方差在实际中高度耦合。该结果将表明，针对单一误差分量的精准干预在复杂任务中可能失效，因为各误差分量沿轨迹复合传播，无法被独立修复。\n\n### § 12 后续研究设想\n\n后续研究应解决“失败签名映射不唯一”的局限，探索在单次推理中动态诊断主导误差分量的可行性。现有框架依赖跨样本对比（如 Self-Consistency 的答案分歧度）识别误差类型，成本高昂且滞后。可检验的问题是：能否通过提取单次生成中的中间步骤特征（如 token 熵）来预测当前失败属于系统偏差还是随机方差。首个对照实验可在 GSM8K 上对比静态干预与基于单次特征动态选择干预的混合系统。若在固定预算下动态系统准确率显著优于单一最佳静态方法，则说明单次特征足以指导控制匹配。", "research_value_source": "legacy_research_value", "resea
