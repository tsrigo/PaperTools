ck”任务的成本，预测误差将远超论文声称的 36%，甚至可能达到数量级上的偏差。这个反例直接证明了论文提出的加性模型（level + shape）在真实工程场景的极端任务分布下会可预测地失效，其 36% 的预测精度仅仅是由于评测集任务同质性带来的虚假繁荣。\n\n### § 12 Follow-up Research Idea\n\n该论文的根本局限在于将 task specification 视为静态的、先验给定的输入，并被动地预测其引发的 cost distribution，这忽略了 specification 本质上是人类意图与 agent 认知边界之间的信息接口。驱动这一新研究想法的未满足需求是：既然压缩 prompt 会增加成本，提供完整 spec 又有编写成本，我们不应仅仅“预测”成本，而应“优化”信息流，即在 agent 执行过程中动态地按需投喂 specification，以最小化“人类编写成本 + agent 执行成本”的全局期望开销。我们可以借鉴信息论中的 Value of Information (VoI) 以及 Active Learning 领域的 query 策略，将 agentic coding 建模为一个 Sequential Information Revelation（序列信息揭示）过程。在这个新 framing 下，agent 不再一次性接收 full spec 或 minimal spec，而是初始仅接收 user story，当其内部 context 的 uncertainty（例如通过分析其 thinking trajectory 的熵或 tool call 的失败率来量化）超过阈值时，主动向一个“Spec Oracle”请求揭示特定的 spec 模块（如 acceptance criteria 或 raw test output）。第一个实验将构建一个基于上下文不确定性的 trigger 机制：在 mini-swe-agent 中，当 agent 连续两次产生无效的 file edits 或重复搜索同一模块时，系统自动注入 full spec 中的相关上下文段落。我们将比较这种 Dynamic Spec Revelation 策略与论文中的静态 full/minimal specs，评估指标为总 token spend、solve rate 以及为避免冗余信息输入而节省的 prompt tokens。这与已有工作截然不同：论文试图在执行前用静态 probe 预测成本，而本提议将 specification 转化为执行过程中的动态控制变量，打开了“认知自适应信息投喂”这一全新研究方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jakub Smékal\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Stanford University\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "Agentic coding workflows 现已广泛应用于真实世界系统中。随着 long-horizon reasoning 和 tool use 的应用，token usage 已成为成本和效率方面的重要考量。两个使用 AI 的工程师会以不同的方式解决同一问题。task specification 如何影响 agent 的 token spend，以及该花费是否可以提前预测，仍是开放问题。在此，我们研究了在三种 thinking efforts 下，不同 task specifications 对 Kimi K3 model 的 agentic token spend 的影响。在 $2,700$ 次 runs 中，我们表明，将 full task specification 简化为 bare user story 会使 token spend 增加 $29.7\\%$，而 run-to-run variance 不受任何 prompt changes 的影响。我们表明，prompt-sensitivity 是 task-dependent 的，范围从 $13\\%$ 到 $115\\%$。我们拟合了一个简单的 predictor，它可以通过对 unseen task 进行 single cheap probe，在 $36\\%$ 的误差范围内对 task specifications 和 thinking effort configurations 的完整分布进行定价，改进了先前关于 predicting token spend 的工作。我们的工作提供了量化 task specification 对 agentic token spend 影响的初步结果，并引入了一种可用于系统评估 AI coding workflows 成本的方法。"}]}, {"name": "Self-Evolving Agents", "count": 2, "papers": [{"title": "Beyond Scaling: Self-Evolving LLM Agents for Hardware Kernel Optimization via an Experience-Driven Workflow and Experience Graph Memory", "arxiv_id": "2608.25570", "authors": "Siyuan Chen, Runlin Hou, Shenxiu Wu, Yansong Sun, Junming Cao, Yiyu Zhang, Shudi Shao, Junhao Qiu, Zhichao Lu, Qingfu Zhang", "summary": "Hardware kernel optimization requires repeated compilation, correctness testing, profiling, and revision. LLM agents can automate parts of this process, and stronger foundation models, longer context windows, and longer execution horizons have improved optimization within individual tasks. These advances alone do not enable an agent to learn from completed optimization runs. Existing kernel-optimization agents seldom preserve a decision, its observed execution feedback, and the later decisions that use that evidence. Retaining every prior trajectory is also impractical because an expanding history competes with the current task for context. We present KOPE, an experience-driven framework for hardware kernel optimization. KOPE records optimization trajectories with correctness and performance feedback in Experience Graph Memory, then uses Active Context Management and Injection to retrieve relevant experience under a fixed token budget. The graph retains decision order, observed outcomes, and alternative branches, allowing evidence collected on the target hardware to inform later optimization steps and tasks. Under the same GLM-5.2 setting, the geometric mean of KOPE's per-operator speedups is $1.54\\times$ that of CANNBot, the strongest competing baseline. In a complete 53-operator ablation, Active Context Management and Injection raises pass rate from 60.0\\% to 84.6\\%, increases the evaluator-reported positive-field geometric mean from 0.0382 to 0.0661, and reduces optimization token consumption from 15.9B to 1.113B tokens relative to passive agent-led context construction. Enabling Experience Graph Memory raises full-suite pass rate from 55.2\\% to 84.6\\% and yields a $1.43\\times$ geometric-mean speedup on valid timing comparisons. These results support continual optimization through external experience while the foundation model remains fixed.", "category": "cs.LG", "cluster": "Self-Evolving Agents", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving, LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：在公开训练数据稀缺的目标硬件上，LLM agent 如何将单次 kernel 优化过程中产生的 execution feedback——包括 compiler diagnostics、correctness 结果、profiling 观察和 measured performance——转化为可持久化、可跨步骤和跨任务复用的知识，同时保持 foundation model 参数固定。这个问题的重要性源于硬件 kernel 优化本身的性质：性能取决于 memory hierarchy、data movement、parallel execution 以及目标设备特有约束，每个候选实现都必须经历 compile、correctness test、benchmark 和反复 revision，是一个 expertise-intensive 且迭代密集的过程。自动化优化在新硬件引入的早期阶段最有价值，因为此时软件生态尚未积累足够的公开实现和优化 trace，而恰恰在这一阶段，agent 最缺乏目标硬件的领域知识。现有 LLM agent 的有效性仍严重依赖 foundation model 中已编码的硬件知识，对于 Ascend NPU 这类公开实现有限的平台，这种依赖尤其受限。如果 agent 能在探索过程中持续积累并复用目标硬件上实测产生的 evidence，就能在不重新训练模型的前提下，逐步弥补目标硬件知识的缺口，从而提升 coverage、correctness 和 performance，并显著降低 token 消耗。\n\n### § 2 前人工作与不足\n\n这个问题之前没有被完整解决。在 LLM-based kernel optimization 方向，Codex 和 DeepSeek-Coder 建立了广泛的代码生成能力，ChipNeMo 证明了 chip-design 任务中 domain adaptation 的价值，KernelBench 和 CANN Bench 分别为 GPU 和 Ascend NPU 提供了 execution-based 评测基准。面向优化流程的系统层面，Astra 通过多 agent 协调实现 generate-test-profile-plan 循环，Makora 采用 reinforcement-learning post-training，CuSeT 进行 CUDA-sensitive instruction tuning，QiMeng-Kernel 分离高层策略与逐步实现，AscendKernelGen 结合 domain-specific data、model adaptation 和 execution-based evaluation 服务于 Ascend NPU。这些系统的共同特征是：execution feedback 主要用于指导当前 run 内的 refinement，而非被组织为供后续 decision 或 task 复用的 persistent evidence。其不足并非简单的\"没有考虑复用\"，而是存在两个结构性障碍。第一，kernel 优化的 trajectory 是分支式的——同一 incumbent 可能产生多个候选尝试，某个早期 decision 的价值往往要等到观察其 successor 的 outcome 后才能显现——而现有系统缺乏能够保留 decision order、observed outcome 和 alternative branch 的结构化记忆表示。第二，即使简单保留所有 trajectory，也会因 history 不断膨胀而与当前任务竞争 context window；Long-Context 利用率研究（\"Lost in the Middle\"、RULER）已表明，更长的 context window 并不保证有效利用其中信息，attention dilution 会导致性能下降。因此，可行的方案必须同时解决\"记什么\"和\"在有限 token budget 下注入什么\"两个问题。在 agent memory 方向，MemGPT 通过 OS 启发的层级管理 bounded context，ExpeL 保留 task trajectory 并蒸馏 reusable insight，ReMe 提供动态 procedural memory 框架；但这些通用记忆机制没有针对 kernel 优化的 decision-to-outcome 结构进行建模，也缺乏在固定 token budget 下、依据当前 optimization state 进行 task-conditioned retrieval 和 injection 的集成机制。KOPE 正是在这一缺口上提出 Experience Graph Memory 和 Active Context Management and Injection，将目标硬件上实测的 branching trajectory 组织为有向 experience graph，并在每次 iteration 重建 prompt 时按 hot-warm-cold 三层优先级在 budget 内选择和注入相关 experience，从而把 execution feedback 从一次性指导转化为跨 run 的可复用知识。", "core_insight": "### § 3 重建作者的思考路径\n\n在探索硬件 kernel 优化时，研究者首先面临的是一个高度依赖领域专家经验的迭代过程：候选实现需要经历编译、正确性测试、性能 profiling 和反复修改。随着 LLM agents 的引入，这一流程的部分环节得以自动化，且通过更强的 foundation models、更大的 context windows 以及更长的执行轨迹，单次任务内的优化效果得到了显著提升。然而，当面对缺乏公开实现和优化轨迹的新硬件（如 Ascend NPUs）时，模型内部固有的硬件知识匮乏成为了严重的瓶颈。现有的 kernel-optimization agents（如 Astra, Makora, CUDA-Agent）主要依赖 domain adaptation 或 agentic reinforcement learning 来增强模型能力，其 execution feedback 仅用于指导当前运行，很少被组织为可复用的证据供后续决策或跨任务使用。这导致 agent 始终无法摆脱对模型预训练知识的依赖。\n\n为了打破这一限制，研究者自然会想到引入外部记忆机制来保留历史经验。但直接保留所有历史轨迹会引发新的问题：随着历史不断膨胀，它会与当前任务竞争有限的 context 空间。此外，关于 long-context utilization 的研究（如“Lost in the Middle”和 RULER）明确指出，更长的 context window 并不能保证有效利用所有信息，无关 token 引发的 attention dilution 甚至会降低模型表现。这意味着被动地堆叠历史轨迹不仅成本高昂，而且会掩盖对当前任务真正有用的证据。同时，KV-cache eviction 等技术虽然能在 inference 阶段缓解 attention dilution，但它们作用于模型内部状态，无法从根本上解决外部经验的组织与筛选问题。\n\n基于上述失败模式与理论线索，研究者推导出：要让 LLM agent 在稀缺语料的新硬件上持续进化，不能仅靠扩大模型规模或 context window，而必须解决“如何将探索反馈转化为持久知识”以及“如何在有限预算下精准提取并注入相关知识”这两个核心问题。这就要求设计一种结构化的外部记忆，能够记录决策顺序、观测结果及分支路径（而不仅仅是文本日志），并配合一种主动的 context 管理机制，在每次迭代前根据当前优化状态，在固定 token budget 内筛选出最相关的经验。这种思路最终导向了 Experience Graph Memory 与 Active Context Management and Injection 的结合，使 agent 能够在不改变模型参数的前提下，通过跨任务复用目标硬件上的实测证据实现自我进化。\n\n### § 4 核心 Intuition\n\n在缺乏公开训练数据的新硬件上，LLM agent 无法仅凭模型内部知识进行有效优化，而简单堆叠历史轨迹又会超出 context 限制并引发“Lost in the Middle”问题。因此，关键在于将每次优化的决策与硬件实测反馈转化为结构化的外部经验图谱，并在每次迭代前，根据当前优化状态，在有限的 token budget 内主动筛选并注入最相关的历史经验。这样，agent 便能在不更新模型参数的情况下，通过跨任务复用探索证据实现持续进化。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+-------------------+     +-----------------------+     +-------------------+\n| Current Task      |----\u003E| Experience-Driven     |----\u003E| Candidate Kernel  |\n| (AscendC Kernel)  |     | Optimization Workflow |     | Implementation    |\n+-------------------+     +-----------------------+     +-------------------+\n                                  |   ^                           |\n                                  v   |                           v\n                          +-----------------------+     +-------------------+\n                          | Active Context        |\u003C----| Execution Feedback|\n                          | Management \u0026 Injection|     | (Compile, Test,   |\n                          +-----------------------+     | Profile, Perf)    |\n                                  |                   +-------------------+\n                                  v                           |\n                          +-----------------------+           |\n                          | Experience Graph      |\u003C----------+\n                          | Memory (KOPE-Mem)     |\n                          | (Decisions, Outcomes, |\n                          |  Branches)            |\n                          +-----------------------+\n```\n\nKOPE 框架的运行流程围绕三个核心机制展开，形成一个闭环的经验驱动优化系统：\n\n1. **Experience-Driven Optimization Workflow**：这是系统的主干闭环。Agent 接收当前的 kernel 优化任务，生成候选实现，随后在目标硬件上执行。系统会验证候选实现的 correctness 和 performance，收集完整的 execution feedback（包括 compiler diagnostics、correctness outcomes、profiling observations 和 measured performance changes）。这些反馈不仅用于指导当前运行的下一步决策，还会被转化为外部知识记录下来，供后续的优化步骤或跨任务运行复用。\n\n2. **Experience Graph Memory (KOPE-Mem)**：这是知识的持久化存储层。系统将优化决策和实测结果组织为有向经验图。图中的节点代表决策和结果，provenance links 保留了执行顺序和替代分支。这意味着检索时不仅可以考虑文本相关性，还能追踪下游的执行结果，从而保留优化路径的完整因果链条。\n\n3. **Active Context Management and Injection**：这是知识检索与注入的桥梁。在每次生成新的候选实现之前，该机制会在有限的 token budget 内，根据当前的优化状态，从 Experience Graph Memory 中筛选出最相关的经验，并将其注入到 prompt 中。这使得组装的 prompt 既包含了当前所需的任务状态，又包含了有用的先验经验，而无需携带完整的历史记录，有效避免了 context 膨胀和 attention dilution。\n\n### § 7 实验设计与结论\n\n**提出什么问题**：在公开训练数据稀缺的目标硬件上，LLM agent 如何在不改变 foundation model 参数的前提下，将单次 kernel 优化过程中产生的 execution feedback 转化为可持久化、可跨步骤和跨任务复用的知识，从而提升优化的 coverage、correctness 和 performance？\n\n**用什么实验验证**：\n1. **主实验与基线对比**：在 Huawei Ascend NPUs 上使用 AscendC kernels 和 CANN Bench 进行评测，主模型为 GLM-5.2。对比基线包括 CANNBot 以及针对 NVIDIA GPU 的 CUDA-Agent（分别使用 GLM-5.2 和 Deepseek-V4-Pro 配置）。\n2. **Context Policy 消融**：在完整的 53-operator 套件上，对比 Active Context Management and Injection 与 passive agent-led context construction 的效果。\n3. **Memory 机制消融**：评估 Experience Graph Memory 的作用，基于 412 paired valid timing cases 测试 geometric-mean speedup，并统计 full-suite pass rate。\n\n**结论是什么**：\n1. **整体性能优势**：在相同的 GLM-5.2 设置下，KOPE 的 per-operator speedup geometric mean 是最强竞争基线 CANNBot 的 1.54 倍。\n2. **主动上下文管理的有效性**：Active Context Management and Injection 将 pass rate 从 60.0% 提升至 84.6%，使 positive-field geometric mean 提升 1.73 倍，并将优化过程的 token 消耗从 15.9B 大幅降低至 1.113B。\n3. **经验图记忆的有效性**：启用 Experience Graph Memory 将 full-suite pass rate 从 55.2% 提升至 84.6%，并在有效计时比较中实现了 1.43 倍的 geometric-mean speedup。\n4. **跨硬件迁移的局限性**：针对 NVIDIA GPU 的 CUDA-Agent 在 Ascend suite 上表现不佳（GLM-5.2 和 Deepseek-V4-Pro 的 pass rate 分别仅为 14.7% 和 9.1%，且未解决任何完整的 operator）。这证明当目标硬件缺乏公开语料时，仅依靠模型能力和任务内优化是不够的，必须通过外部经验机制保留和复用探索中获得的知识。", "additional_insights": "### § 8 Take-aways\nKOPE 提出了一种 experience-driven 的硬件 kernel 优化框架，通过将执行反馈外部化为结构化图，打破了单纯依赖扩大模型参数或 context window 的 scaling 范式。其核心组件 Experience Graph Memory 以有向无环森林的形式记录决策顺序、观测结果与替代分支，使得过去探索中的失败与成功均能作为可追溯的 evidence。Active Context Management and Injection 机制在固定的 token budget 下，通过 Hot/Warm/Cold 三级优先级动态组装 prompt，有效缓解了长上下文带来的“Lost in the Middle”问题。实验表明，在 GLM-5.2 模型下，KOPE 的 per-operator speedup geometric mean 达到最强 baseline CANNBot 的 1.54 倍，且 active context 策略相较于 passive 策略将 token 消耗从 15.9B 暴降至 1.113B，同时 pass rate 提升 24.6 个百分点。跨硬件 retargeting 实验（Ascend NPU 至 RISC-V CPU）证明，源硬件的 experience 能有效转移可行性知识（提升 23.0 pp 覆盖率），但性能优化仍需 target-side 的持续探索来修正 prior。\n\n### § 9 最脆弱的假设\nKOPE 最核心且失败代价最大的假设是：**过去优化轨迹中记录的决策与结果（即 Experience Graph Memory 中的 Cases）能够被准确检索，并有效指导当前或跨任务的优化状态，而不会引入误导性的偏差。** 这个假设在实际中极易不成立：硬件 kernel 的优化高度依赖具体的 input shape、memory layout 和 operator 语义，一个在特定场景下被标记为“effective”的 transformation，在另一个看似相似的 operator 上可能引发严重的性能 regression 或编译失败。此外，论文明确指出图中的 edge 仅记录 lineage 而非 causal identification，这意味着一个下游节点的成功可能并非上游决策的直接因果产物，若 LLM Agent 将这种巧合的 correlation 误认为 causal pattern 并注入 prompt，将导致优化轨迹偏离正轨。论文仅提供了端到端的 aggregate ablation 证据（如开启图记忆后 pass rate 提升），但缺少针对单次检索质量的细粒度分析，未能证明注入的经验确实被模型采纳并产生了正向的 causal contribution，而非被模型忽略。\n\n### § 10 最小复现实验\n在一周时间内，可针对“Active Context Management and Injection 在固定 token budget 下比被动全量历史注入更高效”这一核心 claim 进行最小复现。从 CANN Bench 或 KernelBench 中抽取 10 个不同难度的基础 operator 作为数据集，使用固定的 LLM（如 GLM-5.2 或 GPT-4o）进行两轮配置测试。实现两个极简的 agent loop：Passive 配置在每轮迭代时将所有历史编译诊断、代码和反馈拼接进 prompt（直至触及 context window 上限）；Active 配置则实现一个基础版的 keyword/semantic retrieval，仅提取与当前报错类型或 operator 类别匹配的 top-3 历史案例注入 prompt。测量两种配置在完成这 10 个 operator 优化时的总 token consumption 以及最终的 pass rate。如果 Active 配置在 token 消耗显著低于 Passive 配置（例如降低一个数量级）的前提下，维持或提高了 pass rate，则支持该 claim；若 Active 配置因检索不相关经验导致 LLM 陷入死循环，或 Passive 配置因全量历史保留了更完整的上下文反而获得更高的 pass rate，则直接反驳该 claim。", "research_value": "### § 11 最强反例设计\n\n如果我要对这篇论文发起最有力的攻击，我会针对其最脆弱的假设——即 Experience Graph Memory 中的 lineage 关系能够被有效复用而不引入误导性偏差——设计一个基于“因果混淆与硬件特异性触发”的对抗性实验。硬件 kernel 的性能往往受制于极其隐蔽的底层机制，例如特定的 memory alignment、bank conflict 的偶然缓解，或是 compiler 的某个内部 heuristic。在 KOPE 的有向无环森林中，一个下游节点的成功（如 latency 降低）会被记录为上游 transformation 的有效 evidence，但实际上两者可能仅是 correlation 而非 causation。我会构建一个包含 20 个 operator 的对抗性测试集，这些 operator 在语义上具有相似性（容易触发跨任务检索），但在底层 memory access pattern 上存在致命差异。例如，Operator A 通过引入一种特定的 `pad` 策略偶然解决了 bank conflict 并获得了 2x speedup，系统会将此作为“effective transformation”存入图记忆；而 Operator B 具有相似的代码结构但完全不同的 memory footprint，当 agent 跨任务检索并复用这一“成功经验”时，`pad` 不仅无法提升性能，反而会破坏原有的 memory coalescing，导致严重的 performance regression 甚至 OOM。如果实验结果显示，开启 Experience Graph Memory 的 KOPE 在该对抗集上的 pass rate 和 performance 显著低于无记忆的 baseline，这就直接证明了其图结构缺乏 causal identification 机制，不仅无法提供有效指导，反而会成为“经验陷阱”。\n\n此外，我可以提出一个针对实验结果的强替代解释：KOPE 相比 baseline 的巨大性能提升和 token 暴降，可能并非源于“复用了有效经验”，而是因为 Active Context Management and Injection 机制本身充当了一个强大的 noise filter。现有 baseline（如 CANNBot）可能将大量冗余的 compiler diagnostics 和失败代码塞入 prompt，导致 LLM 陷入“Lost in the Middle”并产生 hallucination；KOPE 仅仅是通过 Hot/Warm/Cold 三级优先级截断了这些噪声，使得 LLM 能够更专注地处理当前任务。为了验证这一替代解释，我可以设计一个“Sham Experience”消融实验：保持 KOPE 的 Active Context Management 机制不变，但将 Experience Graph Memory 替换为一个随机采样的、来自完全无关任务的失败 trajectory 库。如果在这个“注入随机噪声但经过严格 budget 控制”的设置下，KOPE 的 pass rate 和 token consumption 依然显著优于全量历史注入的 Passive 配置，且与真实 Experience Graph 的表现无异，那么论文声称的“experience-driven continual optimization”这一核心贡献将被彻底推翻——系统真正有效的原因是 context truncation，而非 experience reuse。\n\n### § 12 Follow-up Research Idea\n\n基于 KOPE 在 causal identification 上的根本性缺失，我提出一个 novel research idea：**Causal Kernel Attribution via Counterfactual Execution**。这个想法的驱动力在于，当前的 LLM agent 优化系统（包括 KOPE）均采用 observational learning 的范式，即被动记录“做了什么操作”与“得到了什么结果”，这种范式在高度依赖局部上下文的硬件优化中极易产生 spurious correlation。我们需要将 agent 从“经验主义者”转变为“实验科学家”，使其能够主动设计并执行 counterfactual experiments 来剥离 transformation 与 performance 之间的真实因果关系。\n\n借鉴因果推断领域的 structural causal models (SCM) 以及 compiler optimization 中的 differential testing 技术，我们可以构建一个 Causal Discovery Agent。当 agent 观察到一个成功的 optimization trajectory（例如应用了 loop unrolling 和 vectorization 后 latency 下降）时，它不会直接将其作为通用经验存入图记忆，而是主动生成一个 counterfactual kernel variant——仅保留 loop unrolling 而撤销 vectorization，并在目标硬件上执行。通过对比 factual 和 counterfactual 的 profiling 结果，系统能够精确 attribution 出 latency 下降的真正贡献来源。更进一步，借鉴 active learning 的思想，agent 可以针对那些 attribution 模糊的节点，自动生成最小化变量控制的探针实验，从而在目标硬件上动态构建一棵真正的 causal graph 而非 lineage graph。\n\n第一个实验将聚焦于跨任务的 causal transfer rate。选取两组具有 confounding factors 的 operator 对（如前述的 memory alignment 问题），分别使用 KOPE 的 Experience Graph Memory 和我们提出的 Causal Graph Memory 进行跨任务优化。在目标任务启动时，两种记忆机制都会检索到源任务的成功 transformation，但 Causal Graph 会附带其 counterfactual validation 结果（例如：“该 speedup 仅在 L2 cache size 为 X 时成立，归因于 cache line 利用率，而非 algorithmic complexity”）。实验将测量两种方法在目标任务中的 first-try regression rate 和平均探索迭代次数。如果 Causal Graph 能够在保持同等 token 消耗的前提下，将 negative transfer 的发生率降低一个数量级，并显著缩短探索路径，这将证明在 LLM-driven hardware optimization 中，主动的因果验证比被动的经验积累是更本质的解决路径。这与现有的 agent memory 工作（如 ExpeL 或 KOPE）形成了本质区别：后者追求的是“记住更多有效经验”，而本提议追求的是“证伪虚假经验”。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Siyuan Chen\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Runlin Hou\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Shenxiu Wu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yansong Sun\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Junming Cao\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yiyu Zhang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Shudi Shao\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Junhao Qiu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhichao Lu\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Qingfu Zhang\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"City University of Hong Kong\"},\n    {\"id\": 2, \"name\": \"Huawei Technologies Ltd.\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"These authors contributed equally.\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding authors.\"}\n  ]\n}\n```", "summary_translation": "硬件 kernel 优化需要反复的编译、正确性测试、profiling 和修改。LLM agents 可以自动化该过程的部分环节，而更强的 foundation models、更长的 context windows 以及更长的执行周期已经改善了单个任务内的优化效果。仅靠这些进展并不能使 agent 从已完成的优化运行中学习。现有的 kernel-optimization agents 很少会保留某个决策、其观察到的执行反馈，以及使用该证据的后续决策。保留所有先前的轨迹也是不切实际的，因为不断增长的历史记录会与当前任务竞争 context。我们提出了 KOPE，一个用于硬件 kernel 优化的经验驱动框架。KOPE 将带有正确性和性能反馈的优化轨迹记录在 Experience Graph Memory 中，然后使用 Active Context Management and Injection 在固定的 token 预算下检索相关经验。该图保留了决策顺序、观察到的结果和备选分支，使得在目标硬件上收集的证据能够为后续的优化步骤和任务提供信息。在相同的 GLM-5.2 设置下，KOPE 的每个 operator 加速比的 geometric mean 是最强竞争 baseline CANNBot 的 $1.54\\times$。在完整的 53-operator ablation 中，相对于被动的 agent 主导的 context 构建，Active Context Management and Injection 将 pass rate 从 60.0\\% 提高到 84.6\\%，将 evaluator 报告的 positive-field geometric mean 从 0.0382 提高到 0.0661，并将优化 token 消耗从 15.9B tokens 减少到 1.113B tokens。启用 Experience Graph Memory 将全套 pass rate 从 55.2\\% 提高到 84.6\\%，并在有效的 timing comparisons 上产生了 $1.43\\times$ 的 geometric-mean speedup。这些结果支持在 foundation model 保持不变的情况下，通过外部经验进行持续优化。"}, {"title": "From General Agents to RCA Experts: A Self-Evolving Harness for Root Cause Analysis", "arxiv_id": "2608.25661", "authors": "Haiyu Huang, Jiewei Lyu, Zhihan Jiang, Jinyang Liu, Xiao He, Tieying Zhang, Wu Xiang, Michael R. Lyu", "summary": "Automated root cause analysis (RCA) with large language models (LLMs) has drawn growing attention. Today, SREs typically automate RCA with LLMs in one of two ways: directly using a general-purpose agent (e.g., Codex or Claude Code) for diagnosis, or building a specialized RCA agent from scratch. As mainstream general agents grow more capable and iterate quickly, our quantitative study finds that the former now often surpasses the latter. Its accuracy, however, still falls short of production needs, and this gap stems mainly from the external adaptation layer outside the agent's general capabilities, namely the harness. We therefore argue that LLM-based RCA should focus on this external harness, reusing the strong general capabilities of a modern agent rather than rebuilding an agent from scratch. A key capability of such a harness is to self-evolve, accumulating system-specific experience from past diagnoses so that it gets better the more it is used. We introduce OpsHarness, a self-evolving RCA harness that turns diagnosis experience into reusable expertise. Its data plane combines layered operational knowledge with an idea-card tool library, while its control plane coordinates setup, diagnosis, evolution, and verification. During evolution, OpsHarness contrasts successful and failed trajectories, converts their evidence into atomic proposals, and admits updates only through a dual-gate verification process designed to prevent overfitting and regression. Across two public benchmarks and an industrial deployment, OpsHarness achieves 59.0\\% top-1 accuracy, improving over a bare general agent by 63.4\\% and over baseline RCA agents by 4.02$\\times$.", "category": "cs.AI", "cluster": "Self-Evolving Agents", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的研究问题是：如何为现代大型语言模型（LLM）agent构建一个能够持续自进化的外部harness，以将其强大的通用能力转化为生产级Root Cause Analysis (RCA)所需的专家级诊断能力。在微服务架构中，故障往往在复杂的依赖网络中跨层级传播，导致症状与根因相距甚远，RCA成为Site Reliability Engineering (SRE)中时间压力最大的任务。尽管LLM agent被广泛引入自动化RCA，但直接使用general-purpose agent缺乏对目标系统的诊断经验和特定知识，而从头构建专门的RCA agent又难以跟上通用agent框架的快速迭代。解决这一问题不仅能将RCA从静态的一次性推理转变为随使用次数增加而不断积累经验的持续进化过程，还能显著降低Mean Time to Resolve (MTTR)。通过自动化挖掘和复用诊断经验，该方案填补了通用推理能力与系统特定专家知识之间的鸿沟，在真实工业部署中实现了高准确率的自动化故障定位。\n\n### § 2 前人工作与不足\n在本文之前，自动化RCA主要分为两类方法：基于dependency graphs或causal inference的传统方法，以及基于LLM的专门agent方法。最相关的prior methods包括RCAgent、RCA-Agent、mABC以及Flow-of-Action，它们通常从零开始设计完整的agentic pipeline，包括ReAct循环、代码执行和多智能体协作。然而，这些方法存在两个根本性不足。首先，从头构建专门agent意味着必须重新实现长程规划、上下文管理和错误恢复等通用机制，这不仅工程成本高昂，而且通常不如主流general-purpose agent（如Codex或Claude Code）开箱即用的能力强；论文的定量研究表明，这些专门agent的准确率甚至低于直接使用bare general agent。其次，这些框架是静态的，缺乏自进化能力，无法从过去的诊断轨迹中挖掘和积累系统特定的经验（如metric噪声特征或故障传播模式），导致其难以泛化到未见过的场景。尽管工业界通过手动维护Troubleshooting Guides (TSGs)来记录专家经验，但这种依赖人工的方式无法实现自动化复用和持续更新。因此，在Ops领域，当时的问题并未被清楚定义为“如何构建一个包裹通用agent的外部harness”，导致前人工作陷入了不断重造底层agent而忽视外部经验积累与进化的误区。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM-based RCA 的发展初期，研究者的自然倾向是从头构建 specialized RCA agent，设计完整的 ReAct 循环、工具调用和规划逻辑。然而，随着 general-purpose agents（如 Codex、Claude Code）的快速迭代，它们在工具使用、长程规划和上下文管理上的通用能力已高度成熟。作者通过定量实验敏锐地观察到：直接使用 bare general agent 的表现往往超过了精心设计的 specialized agent，因为从头构建通常意味着重新实现且往往低于实现这些成熟的通用机制。但 bare general agent 的准确率仍无法满足生产需求。通过分析失败案例，作者发现瓶颈并非模型推理能力不足，而是缺乏目标系统的特定诊断经验——这就像一个能力很强但刚入职的工程师，不懂系统的噪声特征和运维惯例。与此同时，作者从工业实践中发现，专家 SRE 之所以准确率高，是因为他们能在一次次故障诊断中持续总结和复用经验。结合 harness engineering 的理论线索，作者意识到：在 Ops 领域，关键不在于重建 agent，而在于构建一个外部的、能够像专家一样自我进化的 harness，自动从诊断轨迹中挖掘可复用的经验并加以验证。\n\n### § 4 核心 Intuition\n\n先前方法要么从头构建 specialized agent 而无法复用快速进步的通用能力，要么直接使用 bare general agent 而缺乏特定系统的诊断经验。这篇论文的核心 Intuition 是：不重建 agent，而是为 general agent 套上一层能够自我进化的外部 harness。这个 harness 将 agent 的强推理能力与从历史诊断轨迹中自动挖掘的系统特定知识、工具和规则相结合，使其像专家 SRE 一样越用越聪明，同时通过双重验证门防止经验积累过程中的过拟合和退化。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《From General Agents to RCA Experts: A Self-Evolving Harness for Root Cause Analysis》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 本文提出并解决的研究问题是：如何为现代大型语言模型（LLM）agent构建一个能够持续自进化的外部harness，以将其强大的通用能力转化为生产级Root Cause Analysis (RCA)所需的专家级诊断能力。在微服务架构中，故障往往在复杂的依赖网络中跨层级传播，导致症状与根因相距甚远，RCA成为Site Reliability Engineering (SRE)中时间压力最大的任务。尽管LLM agent被广泛引入自动化RCA，但直接使用general-purpose agent缺乏对目标系统的诊断经验和特定知识，而从头构建专门的RCA agent又难以跟上通用agent框架的快速迭代。解决这一问题不仅能将RCA从静态的一次性推理转变为随使用次数增加而不断积累经验的持续进化过程，还能显著降低Mean Time to Resolve (MTTR)。通过自动化挖掘和复用诊断经验，该方案填补了通用推理能力与系统特定专家知识之间的鸿沟，在真实工业部署中实现了高准确率的自动化故障定位。 ### § 2 前人工作与不足 在本文之前，自动化RCA主要分为两类方法：基于dependency graphs或causal inference的传统方法，以及基于LLM的专门agent方法。最相关的prior methods包括RCAgent、RCA-Agent、mABC以及Flow-of-Action，它们通常从零开始设计完整的agentic pipeline，包括ReAct循环、代码执行和多智能体协作。然而，这些方法存在两个根本性不足。首先，从头构建专门agent意味着必须重新实现长程规划、上下文管理和错误恢复等通用机制，这不仅工程成本高昂，而且通常不如主流general-purpose agent（如Codex或Claude Code）开箱即用的能力强；论文的定量研究表明，这些专门agent的准确率甚至低于直接使用bare general agent。其次，这些框架是静态的，缺乏自进化能力，无法从过去的诊断轨迹中挖掘和积累系统特定的经验（如me...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在 LLM-based RCA 的发展初期，研究者的自然倾向是从头构建 specialized RCA agent，设计完整的 ReAct 循环、工具调用和规划逻辑。然而，随着 general-purpose agents（如 Codex、Claude Code）的快速迭代，它们在工具使用、长程规划和上下文管理上的通用能力已高度成熟。作者通过定量实验敏锐地观察到：直接使用 bare general agent 的表现往往超过了精心设计的 specialized agent，因为从头构建通常意味着重新实现且往往低于实现这些成熟的通用机制。但 bare general agent 的准确率仍无法满足生产需求。通过分析失败案例，作者发现瓶颈并非模型推理能力不足，而是缺乏目标系统的特定诊断经验——这就像一个能力很强但刚入职的工程师，不懂系统的噪声特征和运维惯例。与此同时，作者从工业实践中发现，专家 SRE 之所以准确率高，是因为他们能在一次次故障诊断中持续总结和复用经验。结合 harness engineering 的理论线索，作者意识到：在 Ops 领域，关键不在于重建 agent，而在于构建一个外部的、能够像专家一样自我进化的 harness，自动从诊断轨迹中挖掘可复用的经验并加以验证。 ### § 4 核心 Intuition 先前方法要么从头构建 specialized agent 而无法复用快速进步的通用能力，要么直接使用 bare general agent 而缺乏特定系统的诊断经验。这篇论文的核心 Intuition 是：不重建 agent，而是为 general agent 套上一层能够自我进化的外部 harness。这个 harness 将 agent 的强推理能力与从历史诊断轨迹中自动挖掘的系统特定知识、工具和规则相结合，使其像专家 SRE 一样越用越聪明，同时通过双重验证门防止经验积累过程中的过拟合和退化。 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# From General Agents to RCA Experts: A Self-Evolving Harness for Root Cause Analysis Haiyu Huang _[∗]_ , Jiewei Lyu _[†]_ , Zhihan Jiang _[∗‡]_ , Jinyang Liu _[‡]_ , Xiao He _[‡]_ , Tieying Zhang _[‡]_ , Wu Xiang _[‡]_ , Michael Lyu _[∗]_ \u003E _∗_ The Chinese University of Hong Kong, {hyhuang25, zhjiang22, lyu}@cse.cuhk.edu.hk \u003E _†_ Individual Researcher, jiewei.lyu@gmail.com \u003E _‡_ ByteDance, {jinyang.liu, xiao.hx, tieying.zhang, xiangwu}@bytedance.com _**Abstract**_ **—Automated root cause analysis (RCA) with large language models (LLMs) has drawn growing attention. Today, SREs typically automate RCA with LLMs in one of two ways: directly using a general-purpose agent (e.g., Codex or Claude Code) for diagnosis, or building a specialized RCA agent from scratch. As mainstream general agents grow more capable and iterate quickly, our quantitative study finds that the former now often surpass...", "additional_insights": "## § 8 Take-aways\n\n论文的核心论点是：在当前 LLM agent 生态下，RCA 的性能瓶颈已从 agent 本身的通用能力转移到 agent 外部的 adaptation layer（即 harness）上。定量实验表明，裸的 general-purpose agent（如 Codex、Claude Code）在 RCA 任务上已经超过了从零构建的 specialized RCA agent（RCA-Agent、mABC），但准确率仍不足以满足生产需求，缺口主要来自缺乏系统特定的诊断经验。基于此，论文提出 OpsHarness——首个自进化的外部 RCA harness，其 data plane 包含分层知识库（K0-K3）和 idea-card 工具库，control plane 驱动 setup、diagnose、evolve、verify 四个生命周期阶段。自进化机制从正确和错误的诊断轨迹中分别提取共性模式和对比修正，生成原子化 proposal，并通过 dual-gate verification（inner gate 要求在 source cases 上严格提升，outer gate 要求在 held-out testbed 上不回退）来防止 overfitting。实验在两个公开 benchmark 和一个工业部署上验证，OpsHarness 达到 59.0% top-1 accuracy，相对裸 agent 提升 63.4%，相对 specialized agent 提升 4.02×。消融实验显示，去掉 verification gate 后准确率会先升后降甚至崩溃（DeepSeek-V4 上从 0.4 跌至 0.0），验证了 dual-gate 的必要性。成本方面，OpsHarness 的 per-case 诊断开销与裸 agent 持平（约 106k tokens、325s），额外的 setup/evolve/verify 开销作为 sidecar 并行运行且可摊销。工业部署中，OpsHarness 在 Company A 的数据集上达到 0.74 A@1，约为裸 agent 的 3 倍，且在完全开源的 agent+model 组合下仍有效。\n\n## § 9 最脆弱的假设\n\nOpsHarness 最核心也最脆弱的假设是：**从历史诊断轨迹中挖掘的知识（K2 workflow skeletons、K3 operations/rules、persisted tools）能够泛化到同一系统未来的未见案例上，且 dual-gate verification 足以确保这种泛化性。** 整个 self-evolution 机制的价值都建立在此之上——如果挖掘出的知识只是对 source cases 的过拟合，那么 harness 不会随使用而改善，甚至可能退化。\n\n这个假设在实际中可能不成立的原因有多方面。首先，outer gate 的 held-out testbed B 并非真正独立：它从已积累的案例中按 fault family 和时间分层采样得到，与 mining batch 来自同一系统、相近时间段，共享相似的故障分布。如果系统在评估期间相对稳定，testbed 自然与 mining data 同质，gate 的筛选能力被高估。其次，真实生产系统的故障模式会随部署变更、配置调整、流量模式变化而漂移，历史知识可能变陈旧甚至产生误导——论文自己在 Discussion 中承认系统变更会 invalidate K1 和部分 mined knowledge，但将此视为 graceful degradation 而非核心机制的失效。第三，论文的 12-window 连续诊断实验全部在 training split 上进行，test set 是时间靠后的 20% holdout，如果故障模式在时间维度上高度自相关（这在稳定运行的系统中很常见），则 self-evolution 的增益可能主要来自\"见过类似案例\"而非真正提炼出可复用的 expertise。\n\n论文提供的支持证据包括：no-verify 变体确实出现崩溃（证明 gate 有作用），full OpsHarness 在 12 个 window 上稳步上升，以及工业案例中 DB-sync fault 知识在第三天被成功复用。但缺少的关键证据是：没有在经历显著系统变更的评估周期上测试，没有分析 mined knowledge 的有效寿命，也没有对比高故障复现率与低复现率系统上 evolution 的效果差异。如果故障复现率低（论文引用的 36.2% 复现率本身不算高），则挖掘出的知识可能长期得不到验证和复用，self-evolution 的实际收益将大幅缩水。\n\n## § 10 最小复现实验\n\n在一周时间内，可以验证论文最基础的 claim：**从历史诊断中提炼的模式知识能提升同一系统后续案例的诊断准确率。** 这个 claim 是 self-evolution 机制价值的前提，且不需要复现完整的 OpsHarness 系统。\n\n具体方案：使用 OpenRCA benchmark 的 Telecom 子集（335 个案例中的一部分），按时间顺序取前 80% 作为 warm-up 集、后 20% 作为 test 集。用 GPT-4o 或 Claude Sonnet 连接 Codex/Claude Code 作为 general agent，在 warm-up 集上逐案例诊断，收集所有 trajectory 和 ground-truth 标签。然后手动或用 LLM 从正确轨迹中提取 3-5 条共性诊断模式（如\"先确认 anomaly window，再 top-down 定位组件，最后区分 cause 与 propagation\"），从错误轨迹中提取 2-3 条 anti-pattern（如\"DB session count 波动不应作为唯一诊断依据\"）。将这些提炼出的规则以 system prompt 形式注入 agent，在 test 集上运行诊断，对比不注入任何提炼知识的裸 agent baseline。\n\n测量指标为 test 集上的 A@1（top-1 exact accuracy）。如果注入提炼知识后 A@1 相对裸 agent 有统计学意义上的显著提升（论文报告的 cold-start 增益约 5 个百分点），则支持该 claim；如果无提升或下降，则表明简单的知识注入不足以带来增益，self-evolution 的价值可能依赖更复杂的 harness 机制（如 progressive disclosure、idea-card 动态生成等），而非知识提炼本身。这个实验剥离了 evolve-verify 循环的复杂性，直接测试\"经验提炼→知识复用\"这一核心价值链是否成立。", "research_value": "### § 11 最强反例设计\n要构造对 OpsHarness 最致命的攻击，我会在真实微服务环境中设计一个**高频系统演进与故障漂移**的对照实验，直接挑战其“历史挖掘的知识能泛化到未来案例”这一核心假设。具体而言，在连续 12 个诊断 window 的评估期内，我会在第 6 个 window 之后引入显著的系统变更，例如重构核心微服务的依赖拓扑、升级数据库引擎、或更改流量调度策略，同时确保新出现的故障类型在依赖链路和 metric 表现上与历史案例产生偏移。在这个动态环境下，我会监测 OpsHarness 的 top-1 accuracy 和 dual-gate verification 的通过率随时间的变化。我的核心预期是：系统变更后，前期积累的 K2 workflow skeletons 和 K3 operations 不仅会失效，更会作为强 prior 误导 general agent 的探索方向，导致准确率发生断崖式下跌，甚至低于完全不进化的 bare agent baseline。更关键的是，由于 outer gate 的 held-out testbed 依然从变更前的历史案例中采样，它将无法识别这种因系统漂移导致的语义失效，反而会“验证”并保留那些过拟合于旧架构的 toxic knowledge。这个反例直接证明：在真实工业系统不可避免的持续演进下，OpsHarness 的 self-evolution 机制不仅无法实现 graceful degradation，反而会因知识生命周期的错配而引发严重的负迁移，其 dual-gate 在非平稳环境下的筛选能力是一个伪命题。\n\n### § 12 Follow-up Research Idea\n驱动这个新研究方向的核心局限是：OpsHarness 及其前人工作均隐式假设目标系统是静态的，从而将 RCA 经验视为可无限期复用的静态资产，忽略了真实生产环境中系统演进对知识生命周期的致命影响。为了打破这一局限，我提议将研究目标从“最大化经验积累”转向“动态管理知识的遗忘与重构”，构建一个基于**变更感知的 RCA 知识生命周期管理框架**。该框架不再盲目积累 K2/K3 知识，而是将微服务系统的 CI/CD 事件流（如代码 commit、配置变更、拓扑更新）作为知识衰减的先验信号，借鉴软件工程中的 Change Impact Analysis (CIA) 技术，主动预测并标记可能被 invalidate 的历史诊断经验。当系统变更发生时，框架会触发受影响知识条目的“冻结”与“重验证”，并在 agent 推理时引入基于系统当前架构状态的动态置信度权重，而非依赖静态的 dual-gate。第一个实验将构建一个注入了连续代码与拓扑变更的微服务模拟环境，对比传统持续积累型 harness（如 OpsHarness）与所提的变更感知框架在系统演进前后的 A@1 表现，重点观测在系统重构后的 20 个案例中，新框架是否能通过主动遗忘与知识降权，有效抑制因旧经验干扰导致的准确率崩溃，并加速恢复至新基线水平。这一思路彻底改变了 RCA agent 的进化范式，将其从被动的轨迹挖掘器转变为与系统架构演进同步的动态认知系统。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Haiyu Huang\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Jiewei Lyu\", \"affiliations\": [2], \"markers\": [\"†\"]},\n    {\"name\": \"Zhihan Jiang\", \"affiliations\": [1, 3], \"markers\": [\"*\", \"‡\"]},\n    {\"name\": \"Jinyang Liu\", \"affiliations\": [3], \"markers\": [\"‡\"]},\n    {\"name\": \"Xiao He\", \"affiliations\": [3], \"markers\": [\"‡\"]},\n    {\"name\": \"Tieying Zhang\", \"affiliations\": [3], \"markers\": [\"‡\"]},\n    {\"name\": \"Wu Xiang\", \"affiliations\": [3], \"markers\": [\"‡\"]},\n    {\"name\": \"Michael Lyu\", \"affiliations\": [1], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"CUHK\"},\n    {\"id\": 2, \"name\": \"Individual Researcher\"},\n    {\"id\": 3, \"name\": \"ByteDance\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"The Chinese University of Hong Kong\"},\n    {\"marker\": \"†\", \"text\": \"Individual Researcher\"},\n    {\"marker\": \"‡\", \"text\": \"ByteDance\"}\n  ]\n}\n```", "summary_translation": "基于大型语言模型 LLMs 的自动化根因分析 RCA 受到越来越多的关注。如今，SREs 通常通过以下两种方式之一使用 LLMs 自动化 RCA：直接使用通用 agent（例如 Codex 或 Claude Code）进行诊断，或者从零开始构建专用的 RCA agent。随着主流通用 agent 能力不断增强且迭代迅速，我们的定量研究发现，前者现在通常优于后者。然而，其准确率仍达不到生产需求，且这一差距主要源于 agent 通用能力之外的外部适应层，即 harness。因此我们认为，基于 LLM 的 RCA 应关注这一外部 harness，复用现代 agent 的强大通用能力，而不是从零开始重建 agent。这种 harness 的一个关键能力是自我进化，从过去的诊断中积累特定于系统的经验，从而实现越用越好。我们引入了 OpsHarness，这是一种自我进化的 RCA harness，能够将诊断经验转化为可复用的专业知识。其 data plane 将分层运维知识与 idea-card 工具库相结合，而其 control plane 则协调设置、诊断、进化和验证。在进化过程中，OpsHarness 对比成功和失败的 trajectories，将其证据转化为 atomic proposals，并且仅通过旨在防止过拟合和回归的 dual-gate 验证过程接受更新。在两个公开 benchmarks 和一次工业部署中，OpsHarness 达到了 59.0\\% 的 top-1 accuracy，比基础通用 agent 提高了 63.4\\%，比 baseline RCA agents 提高了 4.02$\\times$。"}]}, {"name": "World Models \u0026 Simulation", "count": 2, "papers": [{"title": "Code World Model: Coding Agent as World Brain", "arxiv_id": "2608.25927", "authors": "Yiwen Chen, Guosheng Lin, Chi Zhang", "summary": "World models aim to simulate how complex environments evolve under actions and events, yet existing video-based world models primarily learn dynamics from visual observations, which reveal outcomes rather than the underlying knowledge, rules, and mechanisms governing world evolution. This makes it difficult to maintain persistent consequences and support coherent, open-ended evolution. We introduce Code World Model, a framework that separates world evolution from visual realization by combining the reasoning and coding capabilities of language models with the generative priors of video models. A coding agent serves as the world brain, reasoning about events and their consequences and generating executable code to maintain persistent world state and perform rule-consistent evolution. To connect executable state with visual generation, we introduce a proxy representation that encodes frame-wise spatiotemporal constraints and is compiled into a proxy video, which conditions a video model to render high-fidelity visual observations. We further develop data pipelines for constructing aligned proxy-observation pairs from gameplay and real-world videos. After fine-tuning on paired gameplay data, MiniMax-H3 follows proxy-based spatiotemporal specifications from simple interactive worlds built by the coding agent while preserving rich visual details and dynamics. These results demonstrate the potential of combining code for persistent world evolution with video models for flexible visual realization, providing a new path toward open-ended world models.", "category": "cs.CL", "cluster": "World Models \u0026 Simulation", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-55 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了“Code World Model”框架，其中一个编码智能体充当“世界大脑”，负责推理事件及其后果，并生成可执行代码以维护持久的世界状态并执行规则一致的演化。这直接涉及构建LLM智能体的新框架，特别是智能体的规划、工具使用（代码生成）和长期状态维护能力。\n\n虽然论文涉及视频模型（多模态），但视频模型在此框架中仅作为环境的“视觉实现”渲染器，而研究的核心是作为“世界大脑”的编码智能体如何通过推理和代码生成来控制和演化环境状态。这符合筛选标准中“除非它们被用作智能体感知环境的工具，而不是研究的核心”的例外情况。该论文属于构建长期决策智能体和交互式环境的前沿研究，符合您的核心关注点。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：如何构建能够支持连贯、开放式演化的交互式世界模型，使其既能维持持久的世界状态与规则一致的后果传播，又能生成高保真的视觉观察。现有video-based world models主要从视觉观察中学习世界动态，但视频仅记录了世界演化的可观察结果，而驱动这些结果的底层世界知识、常识规则、实体间关系、长期规划与后果传播机制并不可直接观察。这一缺陷使得模型难以在长时间跨度上维持持久的后果——例如玩家刺杀城市统治者后，继承顺序、派系联盟、NPC行为等变化应在玩家离开后持续发展并在返回时显现，但纯视觉模型无法在off-screen期间保持这些状态的连贯演化。该问题对自动驾驶、embodied intelligence和开放式游戏世界等需要理解、预测并作用于演化环境的应用至关重要，也是训练和评估agents的基础设施。解决这一问题能将知识驱动的规则一致演化与video models学到的丰富视觉、运动和交互priors相统一，为开放式世界模型提供新路径。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决。最相关的prior work是interactive video world models，包括GameGAN [10]、Genie [6]、Diffusion for world modeling [7]、Pandora [17]、Matrix-Game [26]以及LingBot-World 2.0 [31]等系统。这些系统已能实现action-或prompt-conditioned的video generation，在视觉质量和动作可控性上取得显著进展，部分系统还通过geometry-aware history、persistent memory和streaming generation处理长时序一致性问题 [32-44]。然而，它们的根本局限在于建模对象始终是生成的observation sequence——场景特定的状态和交互后果主要由visual history、latent context或visual memory承载。这种范式之所以不足，是因为视频数据仅保留运行固定game code的视觉输出，可执行逻辑在渲染后被丢弃，模型必须从稀疏的视觉后果中反推底层规则，这一学习过程高度低效。更关键的是，许多状态变化发生在视野之外或超出模型通常不足一分钟的training context window，而需要推理的因果过程在世界时间中可能跨越数天甚至数年，纯视觉建模无法填补这一gap。Generative 3D worlds方向 [75, 76, 81-89]提供了显式几何表示，但构建production-quality的assets、animation、materials和rendering pipeline成本高昂，且过早约束最终视觉实现，其天花板由资产和模拟器的保真度与覆盖范围决定，难以逼近真实世界的视觉丰富性和物理复杂性。Coding agents与world models的交叉研究 [67-70, 90-91]已证明世界规则和状态转换可外化为可检查、可修改的code，但这些工作聚焦于生成游戏制品或构建可执行模型供planner使用，并未将持久的、可修改的code作为学习视觉世界模型的操作介质，也未解决可执行状态如何连接到高保真视觉生成这一interface问题。因此，此前没有任何框架将coding agent驱动的持久世界演化与video model的视觉生成能力统一在一个可操作的pipeline中。", "core_insight": "### § 3 重建作者的思考路径\n\n研究者首先观察到，现有的 video world models 试图直接从视觉观察中学习世界动态，但视频只记录了世界演化的表象结果，背后的常识规则、实体关系和因果机制是不可观测的。例如，游戏视频仅保留了固定代码执行的视觉输出，许多关键状态变化发生在画面之外或超出模型的时间上下文，导致模型难以维持长期后果和开放式演化。为了解决逻辑推理的缺失，自然会想到利用 LLM，因为它们从大规模文本和代码中获得了丰富的世界知识和长程规划能力。然而，如果让 LLM 处理所有低级状态更新（如位置、碰撞、数值计算），会带来巨大的推理开销且无法实时。因此，引入代码作为执行底座成为一种必然选择：让 coding agent 处理低频但复杂的语义决策并生成可复用代码，由代码执行高频但确定性的状态更新。接下来面临的挑战是，如何将这种可执行的世界状态转化为 video model 能够理解的视觉条件。纯文本条件无法提供精确的帧级时空控制，而构建完整的 3D 资产和渲染管线成本过高且限制了视觉生成的开放性。于是，研究者设想了一种中间态：一种粗糙的、可编程的视觉条件。它仅编码实体位置、轨迹和相机运动等粗略时空约束，由轻量级编译器渲染成 proxy video。这样既为 video model 提供了直接的时空 grounding，又将外观和精细动态的生成留给 video model 的学习先验，从而在不依赖高质量 3D 资产的前提下实现了精确控制与高保真视觉的统一。\n\n### § 4 核心 Intuition\n\n先前方法试图让 video model 从视觉数据中隐式学习复杂的因果规则和长期状态演化，这在数据上是低效且难以维持连贯性的。这篇论文的核心 intuition 是将“世界逻辑演化”与“视觉细节渲染”解耦：用 coding agent 和可执行代码显式维护持久的世界状态与规则，用 video model 的生成先验填补高保真视觉细节。两者通过一种粗糙但可编程的 proxy video 进行通信，从而在不依赖完整 3D 资产的前提下，实现精确的时空控制与开放式世界演化的结合。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Code World Model: Coding Agent as World Brain》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出的核心研究问题是：如何构建能够支持连贯、开放式演化的交互式世界模型，使其既能维持持久的世界状态与规则一致的后果传播，又能生成高保真的视觉观察。现有video-based world models主要从视觉观察中学习世界动态，但视频仅记录了世界演化的可观察结果，而驱动这些结果的底层世界知识、常识规则、实体间关系、长期规划与后果传播机制并不可直接观察。这一缺陷使得模型难以在长时间跨度上维持持久的后果——例如玩家刺杀城市统治者后，继承顺序、派系联盟、NPC行为等变化应在玩家离开后持续发展并在返回时显现，但纯视觉模型无法在off-screen期间保持这些状态的连贯演化。该问题对自动驾驶、embodied intelligence和开放式游戏世界等需要理解、预测并作用于演化环境的应用至关重要，也是训练和评估agents的基础设施。解决这一问题能将知识驱动的规则一致演化与video models学到的丰富视觉、运动和交互priors相统一，为开放式世界模型提供新路径。 ### § 2 前人工作与不足 该问题此前未被充分解决。最相关的prior work是interactive video world models，包括GameGAN [10]、Genie [6]、Diffusion for world modeling [7]、Pandora [17]、Matrix-Game [26]以及LingBot-World 2.0 [31]等系统。这些系统已能实现action-或prompt-conditioned的video generation，在视觉质量和动作可控性上取得显著进展，部分系统还通过geometry-aware history、persistent memory和streaming generation处理长时序一致性问题 [32-44]。然而，它们的根本局限在于建模对象始终是生成的observation sequence——场景特定的状态和交互后果主要由visual history、latent context或visual m...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 研究者首先观察到，现有的 video world models 试图直接从视觉观察中学习世界动态，但视频只记录了世界演化的表象结果，背后的常识规则、实体关系和因果机制是不可观测的。例如，游戏视频仅保留了固定代码执行的视觉输出，许多关键状态变化发生在画面之外或超出模型的时间上下文，导致模型难以维持长期后果和开放式演化。为了解决逻辑推理的缺失，自然会想到利用 LLM，因为它们从大规模文本和代码中获得了丰富的世界知识和长程规划能力。然而，如果让 LLM 处理所有低级状态更新（如位置、碰撞、数值计算），会带来巨大的推理开销且无法实时。因此，引入代码作为执行底座成为一种必然选择：让 coding agent 处理低频但复杂的语义决策并生成可复用代码，由代码执行高频但确定性的状态更新。接下来面临的挑战是，如何将这种可执行的世界状态转化为 video model 能够理解的视觉条件。纯文本条件无法提供精确的帧级时空控制，而构建完整的 3D 资产和渲染管线成本过高且限制了视觉生成的开放性。于是，研究者设想了一种中间态：一种粗糙的、可编程的视觉条件。它仅编码实体位置、轨迹和相机运动等粗略时空约束，由轻量级编译器渲染成 proxy video。这样既为 video model 提供了直接的时空 grounding，又将外观和精细动态的生成留给 video model 的学习先验，从而在不依赖高质量 3D 资产的前提下实现了精确控制与高保真视觉的统一。 ### § 4 核心 Intuition 先前方法试图让 video model 从视觉数据中隐式学习复杂的因果规则和长期状态演化，这在数据上是低效且难以维持连贯性的。这篇论文的核心 intuition 是将“世界逻辑演化”与“视觉细节渲染”解耦：用 coding agent 和可执行代码显式维护持久的世界状态与规则，用 video model 的生成先验填补高保真视觉细节。两者通过一种粗糙但可编程的 proxy video 进行通信，从而在不依赖完整 3D 资产的前提下，实现精确的时空控制与开放式世界演化... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：**Westlake AGI Lab** **==\u003E picture [20 x 20] intentionally omitted \u003C==** # **Code World Model: Coding Agent as World Brain** Yiwen Chen[1] _[,]_[2] , Guosheng Lin[2] , Chi Zhang[1] 1AGI Lab, Westlake University 2Nanyang Technological University https://buaacyw.github.io/cwm/ ## **Abstract** _World models aim to simulate how complex environments evolve under actions and events, yet existing video-based world models primarily learn dynamics from visual observations, which reveal outcomes rather than the underlying knowledge, rules, and mechanisms governing world evolution. This makes it difficult to maintain persistent consequences and support coherent, open-ended evolution. We introduce_ _**Code World Model** , a framework that separates world evolution from visual realization by combining the reasoning and coding capabilities of language models with the generative priors of video models....", "additional_insights": "### § 8 Take-aways\n\n现有 video world model 从视觉观测中学习 dynamics，但只能看到 outcome 而非 underlying rules，导致难以维持 persistent consequences 和 coherent open-ended evolution。Code World Model 将 world evolution 与 visual realization 解耦：coding agent 作为 world brain，通过 executable code 维护 persistent world state 并执行 rule-consistent evolution，video model 负责将 evolved state 渲染为 high-fidelity 观测。该框架的核心设计是 agent–code 双频机制：coding agent 处理低频但语义复杂的推理决策（如事件解释、长期后果推断、机制修订），code 执行高频确定性更新（位置、属性、碰撞、数值规则），两者频率解耦使 world state 可持续演化而机制保持可修改。连接 executable state 与 video generation 的关键中介是 proxy——一种由 world state 确定性编译而成的 coarse spatiotemporal 视觉条件，编码 entity positions、trajectories、spatial relations 和 camera motion，渲染为 proxy video 后作为 frame-wise 约束输入 video model。Proxy 设计的核心 trade-off 是 constructability 与 grounding strength：需提供 current observation 必须遵守的最小充分状态，同时将 appearance 和 fine-grained dynamics 留给 video model 的 learned priors。数据构建方面，gameplay 数据可从同一执行中同步录制 target video 和 runtime state 以构造 spatiotemporally aligned proxy–observation pairs；real-world 数据可通过 calibrated 3D reconstruction 和 object annotations 离线编译 aligned proxy，无需 action labels。实验中，仅在约 5.6 小时 GTA V gameplay 数据上做 LoRA fine-tuning 后，MiniMax-H3 能在 coding agent 构建的简单交互世界中定性遵循 proxy 指定的 entity positions、motion trajectories、scene layout 和 camera trajectories，同时保持高保真外观和细粒度 dynamics。\n\n### § 9 最脆弱的假设\n\n整个框架最脆弱、失败代价最高的假设是：**video model 能够从有限 paired data 中学会将 coarse proxy video 可靠地解读为 frame-wise spatiotemporal 约束，并同时生成 high-fidelity、identity-consistent 的视觉观测**。这个假设是 coding agent 的 symbolic world 与用户看到的 visual world 之间的唯一桥梁——如果 video model 无法准确遵循 proxy 指定的 entity positions、trajectories 和 camera motion，那么 coding agent 无论推理多么正确、code 无论执行多么精确，最终输出都是不可信的，整个 framework 的核心贡献直接失效。\n\n该假设在实际中可能不成立的原因有多层。首先，proxy 使用极简 primitives（bounding boxes、capsule skeletons、low-poly shapes）表示 entities，video model 需要从这些抽象形状推断出具体的人物、车辆、建筑等外观，这要求模型学会一种高度非平凡的 cross-modal mapping。其次，proxy 的 spatial resolution 仅为 target video 的 1/4（336×192 vs. 1344×768），这意味着 video model 必须在 16 倍像素差异下完成 precise spatial grounding，position 和 scale 的微小偏差在 upscaling 后可能被放大。第三，论文仅使用约 5.6 小时 gameplay 数据做 LoRA fine-tuning（rank-128，约 596M trainable parameters，3 epochs），这一数据量相对于学习 proxy-to-observation mapping 所需的多样性而言可能严重不足，尤其考虑到不同 entity 类别、动作类型、场景布局和 camera trajectory 的组合空间极大。第四，论文未报告任何 quantitative metrics 来衡量 proxy adherence 的精度——没有 position error、trajectory deviation、identity consistency score 或 temporal stability 指标，所有结论均基于 Fig. 4 的定性视觉检查和 project page 上的 demo videos。第五，论文未展示 failure cases 或 error analysis，无法评估 proxy conditioning 在何种条件下会退化（如密集多 entity 场景、快速 camera motion、复杂 occlusion、非典型 entity 比例等）。论文提供的证据仅限于\"在 coding agent 构建的简单交互世界中\"的定性结果，而 framework 的核心 claim 是支持 open-ended world evolution——简单世界中的定性成功并不能直接外推到复杂、长时程、多 entity 的交互场景。\n\n### § 10 最小复现实验\n\n在一周时间内，最值得验证的单一 claim 是：**video model 能否在少量 paired data 上学会遵循 proxy 指定的 frame-wise entity positions 和 camera motion，同时保持视觉质量**。这一实验直接测试 framework 的核心桥梁，且不需要复现 coding agent 或完整 agent–code loop。\n\n具体方案如下。数据方面，选择一个可程序化控制的简单 3D 环境（如 Unity 或 Blender 中的简单场景，包含 1-3 个移动 entity 和固定 camera trajectory），录制 50-100 段 5 秒视频（24 FPS，分辨率 1344×768），同时从 runtime 提取 entity positions、orientations、camera poses，用简单 primitives（colored bounding boxes、capsule shapes）渲染对应的 proxy video（336×192，含 depth map 和 semantic-ID map）。这构成 spatiotemporally aligned proxy–observation pairs，数据构建可完全自动化。实现方面，取一个开源 video diffusion model（如 CogVideoX 或 Open-Sora 的小型版本），在其上施加 LoRA fine-tuning（rank 64-128），训练目标为以 proxy sequence + text prompt 为条件生成 target RGB video，训练 3-5 epochs。推理时，对 held-out proxy sequences 生成视频。测量方面，需量化三个指标：(1) **Position adherence**——对生成视频用现成 object detector 或 segmentation model 提取 entity positions，与 proxy 指定 positions 计算 frame-wise IoU 或 center-point L2 distance；(2) **Camera motion adherence**——用 optical flow 或 pose estimation 从生成视频估计 camera motion，与 proxy 指定 trajectory 计算偏差；(3) **Visual fidelity**——用 FID 或 CLIP score 衡量生成质量。如果 position adherence 显著优于 text-only conditioning baseline（即仅用 text prompt 不加 proxy 的同模型生成），且 visual fidelity 未显著下降，则支持论文的核心 claim；如果 proxy conditioning 未带来可测量的 position/camera 控制提升，或 visual fidelity 严重退化，则反驳该 claim。这一实验可在单张 A100/H100 上完成，不依赖 coding agent、GPT-5 或 AAA game engine，却能直接检验 framework 是否成立的必要条件。", "research_value": "### § 11 最强反例设计\n\n如果我要对这篇论文发起最有力的攻击，我会设计一个“跨分布的 off-screen 演化渲染”实验，直接挑战其“支持 coherent open-ended evolution”的核心 claim。论文声称 coding agent 能够在 off-screen 期间通过 executable code 维持 persistent consequences（例如派系联盟变化、城市统治者被刺杀后的继承顺序），并在玩家返回时通过 video model 渲染出 high-fidelity 的视觉观测。然而，video model 的 visual priors 仅来自有限的 gameplay 数据（如 5.6 小时的 GTA V）。我的反例实验如下：让 coding agent 执行一段完全符合逻辑但视觉上严重超出训练分布的 off-screen 演化代码——例如，生成一个全新的、由废弃汽车堆叠而成的 NPC 派系堡垒，或者让所有 NPC 骑乘某种未在训练集中出现的异形生物。当玩家返回该区域时，coding agent 会将这个 novel state 编译成仅包含 bounding boxes 和 capsule skeletons 的 proxy video。由于 proxy 仅提供粗略的 spatiotemporal 约束，video model 必须从其有限的 GTA V priors 中“拼凑”出这些从未见过的复杂结构。我预测，video model 会在此处发生严重的 semantic hallucination 与 structural collapse：它要么将 proxy 强行渲染为普通的 GTA V 建筑（忽略 coding agent 的语义创新），要么生成视觉上破碎、identity 不一致的图像。这个反例揭示了一个致命的替代解释：论文在“简单交互世界”中的定性成功，并非因为框架真正实现了 open-ended evolution，而是因为 coding agent 生成的简单状态恰好落在了 video model 的 in-distribution priors 内。一旦 symbolic world 的演化复杂度或新颖度超越了 video model 的训练分布，proxy 这个脆弱的桥梁就会断裂，visual realization 将无法反映真实的 world state，整个 decoupling 框架在真正开放世界中的有效性即被证伪。\n\n### § 12 Follow-up Research Idea\n\n基于对方法核心局限的理解，我提出一个非增量的 novel research idea：**Bidirectional Neuro-Symbolic Co-Execution（双向神经符号协同执行）**，即将 video model 从被动的“渲染器”重构为参与 world state 演化的“可微物理引擎”。(a) 驱动这个想法的局限是：Code World Model 采用了刚性的单向 decoupling（Code -\u003E Proxy -\u003E Video），假设 coding agent 能够预先通过 code 定义所有 state transitions。但在真正的 open-ended world 中，存在大量 fine-grained physical interactions（如 soft-body deformation、fluid dynamics、复杂碰撞碎裂），这些现象在 symbolic 层面计算不可行或无法穷尽，导致 proxy 无法编码这些信息，video model 只能进行不可控的 hallucination，最终导致 persistent state 与 visual observation 产生不可逆的 divergence。(b) 为解决此问题，我们可借鉴 embodied AI 与 differentiable simulation 领域的 Visual Inverse Dynamics 与 differentiable rendering 方法。不再将 video model 的输出视为最终结果，而是引入一个 visual-to-symbolic 的反馈闭环：当 coding agent 的 code 执行到粗粒度碰撞时，video model 生成高保真视觉后果，随后一个 visual perception module（如 VLM）提取生成视频中的 fine-grained physical consequences（如“杯子碎成3片”、“布料挂在栏杆上”），并将其自动转化为 code patch 注入回 coding agent 的 runtime state 中。(c) 第一个实验大概长这样：构建一个包含可破碎物体和流体的简单 3D 环境，对比 open-loop baseline（现有论文方法）与 closed-loop co-execution（本提议）在 10 分钟连续交互中的 state-visual consistency。具体而言，让 agent 向一个水杯开枪，在 baseline 中，杯子碎裂的细节仅由 video model 幻觉生成，off-screen 后 state 中杯子仍是一个整体；而在 closed-loop 系统中，video model 生成碎裂视频后，系统自动提取碎片状态并更新 code 中的 entity list。随后让 agent 走开再返回，观察水杯碎片是否在位置和形态上保持一致。这一实验将证明，只有让 video model 的 generative priors 参与到 state 的反向更新中，才能真正维持长时程的 persistent consequences，从而将研究目标从“如何更好地渲染 proxy”转变为“如何实现视觉与符号的共同演化”。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "{\n  \"authors\": [\n    {\"name\": \"Yiwen Chen\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Guosheng Lin\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Chi Zhang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"AGI Lab, Westlake University\"},\n    {\"id\": 2, \"name\": \"Nanyang Technological University\"}\n  ],\n  \"footnotes\": []\n}", "summary_translation": "World models 旨在模拟复杂环境在动作和事件下如何演化，然而现有的基于视频的 world models 主要从视觉观测中学习 dynamics，这揭示了结果，而不是支配世界演化的底层知识、规则和机制。这使得维持持久的后果并支持连贯的、开放式演化变得困难。我们引入了 Code World Model，这是一个通过将 language models 的推理和编码能力与 video models 的生成先验相结合，从而将世界演化与视觉实现分离开来的框架。coding agent 作为世界大脑，对事件及其后果进行推理，并生成可执行代码以维持持久的 world state 并执行与规则一致的演化。为了将可执行状态与视觉生成连接起来，我们引入了一种 proxy representation，它编码了逐帧的 spatiotemporal constraints，并被编译成 proxy video，以此作为 video model 的条件来渲染高保真视觉观测。我们进一步开发了 data pipelines，用于从 gameplay 和真实世界视频中构建对齐的 proxy-observation pairs。在成对的 gameplay 数据上进行 fine-tuning 后，MiniMax-H3 遵循由 coding agent 构建的简单交互世界中的基于 proxy 的 spatiotemporal specifications，同时保留了丰富的视觉细节和 dynamics。这些结果展示了将用于持久世界演化的代码与用于灵活视觉实现的 video models 相结合的潜力，为 open-ended world models 提供了一条新路径。"}, {"title": "Agentic Game Development as a Verifiable Trajectory Data Engine for Scaling World Models", "arxiv_id": "2608.25518", "authors": "Pengfei Zhou, Hexin Wang, Zhengfeiyang Zhang, Yixing Ma, Zhenglin Wan, Kaipeng Zhang, Wangbo Zhao, Yang You", "summary": "A common strategy for scaling world models is to train on more crawled video with more compute. We argue that this strategy is inefficient: scaling world models also requires a recursive data engine that offers grounded reward signals. The success of code agents illustrates why this matters. As code is executable, compilers and runtimes can provide high-quality rewards for Reinforcement Learning (RL) post-training of LLMs. By contrast, spatial generation still relies largely on fuzzy proxies such as CLIP scores. These signals are fuzzy and biased, making them hard to support RL post-training. Compared with these, game development provides a missing reward environment for spatial world models. A scene encoded by a game engine is an executable world specification: the engine can efficiently check collision, physics, navigability and bounded playability, while the developer provides the global verification signal by judging whether the scene should be accepted. Game development also provides real-world long-horizon trajectory data for RL post-training. We therefore propose Reinforcement Learning with Human-Engine Verification (RLHEV), a post-training paradigm that combines dense engine signals with implicit human acceptance feedback from the development process.", "category": "cs.AI", "cluster": "World Models \u0026 Simulation", "tags": ["cs.AI"], "filter_reason": "论文标题明确包含 \"Agentic Game Development\"，摘要中多次提及与智能体演化及训练相关的核心概念，如 \"code agents\"、\"long-horizon trajectory data\"、\"RL post-training of LLMs\" 以及 \"recursive data engine\"。论文的核心贡献是提出了一种结合引擎验证信号和人类反馈的强化学习后训练范式（RLHEV），利用游戏开发这一长期决策环境为世界模型提供可验证的轨迹数据和奖励信号。这属于 \"agent training/RL\" 和 \"Long-Horizon Agents\" 的研究范畴，符合“如果论文研究 agent training/distillation/RL，并且标题或摘要明确指向 Agentic / LLM Agents，应保留”的筛选标准。虽然论文涉及空间生成和世界模型，但其本质是利用智能体在可执行环境中的交互轨迹来改进模型，属于智能体运行环境与训练机制的探讨，而非单纯的多模态视觉研究。因此，该论文与构建、训练和演化 LLM 智能体的研究目标强相关。", "intro_logic": "### § 1 研究问题与重要性\n\n本文聚焦的核心问题是：spatial world models 的 post-training 缺乏可扩展、低噪声的 reward signal，导致其无法像 code agents 那样通过 reinforcement learning 实现持续自我改进。当前 spatial generation（包括 video generation、3D synthesis、learned world simulators）主要依赖 CLIP score、FVD、JSD、MLLM-as-judge 等 fuzzy proxies 作为质量评估信号，这些代理指标本质上是 noisy、biased 且 gameable 的——它们只能衡量 perceptual plausibility，无法确定性判定物理一致性、几何正确性或功能可玩性。与此形成鲜明对比的是，code agents 之所以能快速进步，是因为代码可执行：compilers、test suites 和 runtimes 提供了 dense、low-cost、grounded 的 verifiable reward，使 RLVR（Reinforcement Learning from Verifiable Reward）成为可行的 post-training 范式。spatial intelligence 领域恰恰缺少这样的 verifier。\n\n这个问题的重要性在于：它揭示了 spatial intelligence 正在遭遇一个 data-centric 版本的 Bitter Lesson——限制进步的瓶颈不仅是 data 或 compute 的规模，更是 feedback channel 的 fidelity 与 authority。当 reward signal 不 grounded 时，scaling compute 只会放大 reward hacking，而非提升 true quality。本文提出 game development 可以填补这一缺口：game engine 本质上是一个 executable world specification 的 interpreter 和 partial verifier，能够低成本地检查 collision、physics stability、navmesh reachability、script execution 和 bounded playability；而 developer 的 accept/reject 判断提供了 sparse 但高度 aligned 的全局验证。两者结合构成 RLHEV（Reinforcement Learning with Human-Engine Verification），为 world models 提供了一条可递归自我改进的训练路径。解决这一问题的价值不仅在于提升 spatial generation 的结构正确性，更在于将 game development 的工作流程本身转化为一个 recursive data engine——每一次 propose、render、verify、repair、review 的循环都自动生成可复用的 multimodal trajectory training data，从而打破 spatial intelligence 对昂贵人工标注和模糊代理指标的依赖。\n\n### § 2 前人工作与不足\n\nSpatial world model 的 post-training 问题此前并未被直接解决，相关工作可分为几条路径，每条都存在结构性局限。第一条是 neural game engines 和 interactive video world models，以 Genie、GameNGen、Diffusion Models Are Real-Time Game Engines（GameNGen）和 iVideoGPT 为代表。这些系统能够从 video-like data 生成 action-conditioned 的 interactive rollouts，在 perceptual fidelity 上取得了显著进展。然而，它们的输出是 opaque 的 frame sequences，不暴露 explicit state、behavior scripts、collision semantics 或 localized failure traces。这意味着当生成结果出现物理不一致或长时序动态崩溃时，模型无法获得确定性的、可定位的 error signal 来指导修复——它只能继续依赖 next-frame prediction 和 fuzzy aggregate metrics 进行训练，无法形成 propose-verify-repair 的闭环。\n\n第二条是 structured 和 executable 3D generation，包括 WorldCoder-Bench、3DCodeBench、P3D-Bench、VoxelCodeBench 和 PhysForge 等。这些工作将 3D world 表示为可执行的程序代码而非不透明的 media artifact，并通过 runtime-state contracts 检查执行正确性，确实支持了 visual plausibility 与 executable correctness 的区分。但它们的局限在于：验证范围局限于 browser-native 或单一 runtime 的局部几何与物理约束，缺乏将完整 game development 工作流（包括 human intent、design constraints、rendered evidence、repair trajectories 和 human acceptance decisions）统一编码为可训练 trajectory 的 protocol。因此它们验证了\"代码能跑\"，但无法捕获\"为什么一个 edit 被接受或拒绝\"这一更高层的 supervision 信号。\n\n第三条是将 game development 本身作为 agentic verifier 和 data source 的工作，如 GameDevBench、GameGenVerifier 和 Agent2World。GameDevBench 评估 agent 在 code changes、multimodal assets、shaders、animation 和 gameplay logic 等真实开发任务上的能力，但它的目标是 benchmarking agent capability，而非将 development traces 转化为 world model 的训练数据。GameGenVerifier 将自然语言 game specification 分解为 keypoints 并注入 runtime states 进行 bounded behavior assertion checking，提供了局部验证能力，但不记录 object-linked 的 edit/check/fix/accept/reject 完整轨迹作为递归训练信号。Agent2World 使用 adaptive multi-agent testing 生成 symbolic world models 并保留 repair trajectories，但其目标对象是 passed game 或 score，而非可以训练下一个 world builder 的 structured development trace。关键缺口在于：这些工作将 game 视为被测试的 artifact，而非将 world construction 的完整过程——包括失败、修复、engine 诊断和 human judgment——视为 world model 的递归训练数据源。\n\n第四条是 games as verifiable supervision 和 open-ended curricula，包括 Game-RL、RLVR-World、UED/PAIRED 和 POET 等。Game-RL 使用 game code 和 rules 合成 multimodal verifiable data 来提升 VLM reasoning，RLVR-World 使用 executable rules 或 transition checks 作为 reward 训练 world models，UED/PAIRED 和 POET 则通过 evolving environments 来暴露 agent 弱点以提升泛化能力。这些工作共享了 recursive data 的直觉，但它们的关注点是 agent 在世界中游戏——用 game rules 验证 agent behavior，而非用 development process 验证和改进 world model 本身。它们没有将 scene programs、verifier outputs、repairs 和 accepted/rejected edits 作为 world-model training 的 supervision，因此无法解决 spatial generation 的 verifiability bottleneck。\n\n总体而言，前人工作之所以未能解决这一问题，并非单纯因为\"没有考虑 X\"，而是因为 spatial intelligence 领域长期缺乏一个 cheap、grounded、可重复的 automatic verifier——在 real world 中获取 verifiable 3D signal（depth、geometry、dynamics、contact）的成本极高，而 fuzzy proxy 又无法支撑 RL post-training。本文的关键洞察是：这个 missing verifier 已经以 game engine 的形式存在，只需将其与 human acceptance 信号统一为 RLHEV 框架，并将 development workflow instrument 为 trajectory data collection protocol（UWDP），即可将 game development 转化为 world models 的 recursive data engine。", "core_insight": "### § 3 重建作者的思考路径\n\n作者的第一性观察来自一个不对称现象：代码 agent 已经成为 LLM 最成功的应用之一，而空间生成（视频、3D、世界模拟器）尽管投入了大量数据和算力，仍停留在\"看起来 plausible 但不 correct\"的阶段。这个差距的根源不在模型容量，而在 feedback channel 的性质。代码之所以能支撑 RL post-training 的持续改进，是因为它天然具备双重验证：编译器和测试套件提供密集、低成本、可复现的局部错误信号，开发者提供全局接受/拒绝的稀疏但高对齐性判断。这两层信号合在一起，构成了一个可闭环的 optimization loop——模型提议、执行暴露错误、人类裁决、奖励更新模型、更好的模型生成更好的候选。空间生成恰恰缺少这个 loop。CLIP score、FVD、JSD、MLLM-as-judge 这些 proxy reward 是 noisy、biased、gameable 的：它们衡量的是最终输出的感知相似度，而非中间过程的物理或结构正确性，无法定位 failure，也无法 cheaply 复现。用这样的 reward 做 RL，优化方向会偏离真实质量——这是 reward overoptimization 的经典陷阱。\n\n作者接下来追问：为什么空间领域找不到 cheap verifier？真实世界的 3D ground truth（depth、geometry、dynamics、contact）标注成本极高，且不存在一个 runtime 能自动检查生成视频中的物理一致性或物体持久性。3D 资产虽有局部几何检查，但缺少对 physical plausibility、semantics、task usefulness 的联合 verifier。世界模拟器更是面临\"annotation wall\"——需要真实世界的密集 ground truth，而这在可预见的未来不会变便宜。作者将此诊断为\"unverifiability tax\"：没有可靠 verifier，领域只能靠堆数据、堆算力、堆人工标注来推进，无法复用代码和推理领域那种 cost-effective 的 post-training paradigm。\n\n关键的视角转换发生在此处：作者没有试图为真实世界构建 verifier，而是问了一个不同的问题——是否已经存在一种人类活动，其中空间知识被编码为可执行规范，且执行环境天然提供结构验证？答案是 game development。游戏引擎（Unity、Unreal、Godot）本质上是一个 executable world specification 的 interpreter 和 partial verifier：它能 cheaply 检查 collision penetration、physics stability、navmesh reachability、script execution、bounded playability——这些检查是 grounded 的（基于显式规范而非感知 proxy）、low-variance 的（可复现）、hard to game 的（碰撞查询不会被逼真纹理欺骗）。同时，游戏开发者的接受/拒绝判断提供了 engine 无法自动裁决的全局信号：场景是否符合设计意图、视觉可读性、产品适配。这与代码 agent 的人类-编译器双重验证结构完全同构：engine 是 compiler + test suite，developer 是 reviewer。\n\n但仅有 verifier 还不够——还需要 trajectory data。作者注意到，游戏开发过程天然产生 rich 的多模态轨迹：设计意图、中间场景状态、编辑动作、引擎检查输出、渲染证据、失败定位、修复动作、人类决策。这些轨迹比最终资产更有价值，因为它们记录了\"为什么这个编辑被接受或拒绝\"的因果信息——这是静态 image-caption pair 或最终 3D asset 无法提供的 supervision density。然而，这些数据通常散落在 editor saves、screenshots、logs、QA notes 等异构格式中，且丢失了编辑被接受或拒绝的原因。这促使作者提出 Unified World-Development Protocol (UWDP)，将开发工作转化为 state-action-check-review traces，使同一个构建世界的 workflow 同时 emit 自己的训练数据。\n\n最后一步是闭合递归 loop：更好的模型生成更多候选世界 → human-engine verification 提供 reward → 积累的轨迹训练下一代模型。作者将此与 Bitter Lesson 重新对齐——Sutton 的原意不只是\"算力战胜手工先验\"，而是在有 scalable feedback channel 的领域（游戏的规则、代码的执行、数学的数值检查），计算才能有效搜索满足约束的候选。空间智能的瓶颈不是数据或算力不足，而是缺少 scalable feedback channel。游戏开发恰好提供了这个 channel：executable checks 处理可形式化的部分，human judgment 处理剩余部分，两者结合构成 RLHEV。\n\n### § 4 核心 Intuition\n\n代码 agent 能通过 RL 持续改进，是因为代码可执行——编译器 cheaply 暴露局部错误，人类裁决全局正确性，两层信号构成可闭环的 optimization loop。空间生成之所以卡住，是因为它缺少这个 loop：CLIP score 之类的 proxy reward 衡量的是最终输出的感知相似度而非中间过程的物理和结构正确性，无法定位 failure、无法 cheaply 复现、可被博弈，因此无法支撑 RL post-training。这篇论文的 core intuition 是：游戏引擎天然就是一个 spatial world 的 executable verifier——它能 cheaply 检查碰撞、物理稳定性、导航可达性等结构属性，而开发者的接受/拒绝判断补充了 engine 无法自动裁决的全局意图对齐；将游戏开发过程记录为 state-action-check-review 轨迹，就用人类-引擎双重验证替代了模糊 proxy，为 world models 打开了与代码 agent 同构的递归自改进通道。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Agentic Game Development as a Verifiable Trajectory Data Engine for Scaling World Models》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 本文聚焦的核心问题是：spatial world models 的 post-training 缺乏可扩展、低噪声的 reward signal，导致其无法像 code agents 那样通过 reinforcement learning 实现持续自我改进。当前 spatial generation（包括 video generation、3D synthesis、learned world simulators）主要依赖 CLIP score、FVD、JSD、MLLM-as-judge 等 fuzzy proxies 作为质量评估信号，这些代理指标本质上是 noisy、biased 且 gameable 的——它们只能衡量 perceptual plausibility，无法确定性判定物理一致性、几何正确性或功能可玩性。与此形成鲜明对比的是，code agents 之所以能快速进步，是因为代码可执行：compilers、test suites 和 runtimes 提供了 dense、low-cost、grounded 的 verifiable reward，使 RLVR（Reinforcement Learning from Verifiable Reward）成为可行的 post-training 范式。spatial intelligence 领域恰恰缺少这样的 verifier。 这个问题的重要性在于：它揭示了 spatial intelligence 正在遭遇一个 data-centric 版本的 Bitter Lesson——限制进步的瓶颈不仅是 data 或 compute 的规模，更是 feedback channel 的 fidelity 与 authority。当 reward signal 不 grounded 时，scaling compute 只会放大 reward hacking，而非提升 true quality。本文提出 game development 可以填补这一缺口：game engine 本质上...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 作者的第一性观察来自一个不对称现象：代码 agent 已经成为 LLM 最成功的应用之一，而空间生成（视频、3D、世界模拟器）尽管投入了大量数据和算力，仍停留在\"看起来 plausible 但不 correct\"的阶段。这个差距的根源不在模型容量，而在 feedback channel 的性质。代码之所以能支撑 RL post-training 的持续改进，是因为它天然具备双重验证：编译器和测试套件提供密集、低成本、可复现的局部错误信号，开发者提供全局接受/拒绝的稀疏但高对齐性判断。这两层信号合在一起，构成了一个可闭环的 optimization loop——模型提议、执行暴露错误、人类裁决、奖励更新模型、更好的模型生成更好的候选。空间生成恰恰缺少这个 loop。CLIP score、FVD、JSD、MLLM-as-judge 这些 proxy reward 是 noisy、biased、gameable 的：它们衡量的是最终输出的感知相似度，而非中间过程的物理或结构正确性，无法定位 failure，也无法 cheaply 复现。用这样的 reward 做 RL，优化方向会偏离真实质量——这是 reward overoptimization 的经典陷阱。 作者接下来追问：为什么空间领域找不到 cheap verifier？真实世界的 3D ground truth（depth、geometry、dynamics、contact）标注成本极高，且不存在一个 runtime 能自动检查生成视频中的物理一致性或物体持久性。3D 资产虽有局部几何检查，但缺少对 physical plausibility、semantics、task usefulness 的联合 verifier。世界模拟器更是面临\"annotation wall\"——需要真实世界的密集 ground truth，而这在可预见的未来不会变便宜。作者将此诊断为\"unverifiability tax\"：没有可靠 verifier，领域只能靠堆数据、堆算力、堆人工标注来推进，无法... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：_2026-06-22_ **==\u003E picture [62 x 29] intentionally omitted \u003C==** **==\u003E picture [32 x 34] intentionally omitted \u003C==** **==\u003E picture [113 x 31] intentionally omitted \u003C==** **==\u003E picture [95 x 31] intentionally omitted \u003C==** # **Agentic Game Development as a Verifiable Trajectory Data Engine for Scaling World Models** **Pengfei Zhou**[1] _[,]_[2] **Hexin Wang**[2] **Zhengfeiyang Zhang**[2] **Yixing Ma**[3] **Zhenglin Wan**[1] **Kaipeng Zhang**[4] **Wangbo Zhao**[5][‡] **Yang You**[1][‡] 1National University of Singapore, HPC-AI Lab 2InfRec, Cardinal AI Lab 3University of California, Berkeley 4Independent Researcher 5Hong Kong University of Science and Technology � wangbo.zhao96@gmail.com; � yangyou@nus.edu.sg \u003E ‡ Corresponding Author **Abstract** A common strategy for scaling world models is to train on more crawled video with more compute. We argue that this strategy is inefficient: scalin...", "additional_insights": "### § 8 Take-aways\n当前 spatial intelligence 的 scaling 瓶颈并非仅在于数据量或算力，而在于缺乏廉价且可靠的 verifiable reward signal 来支持 RL post-training。传统的 fuzzy proxies（如 CLIP score、FVD）噪声大、存在系统偏差且易被 hack，无法像代码执行那样提供确定性的反馈。Game development 提供了一种天然的 Human-Engine Verification (RLHEV) 机制：game engine 提供密集的结构性验证（如 collision、physics、navmesh），而人类开发者提供全局的接受/拒绝判断。论文提出 Agentic World Model (AWoMo)，将游戏开发过程转化为 state-action-check-review 的多模态轨迹数据，作为递归自进化的数据引擎。实验表明，结合人类与引擎双重验证的 Full RLHEV 在 UnitySceneBench 上取得了最佳表现，且在跨引擎迁移和 embodied diagnostics 中展现出正向的泛化信号。\n\n### § 9 最脆弱的假设\n该方法最核心且失败代价最大的假设是：game engine 提供的 structural verification 能够作为有效的 reward signal，引导 world model 学习到可泛化到 out-of-distribution (OOD) 场景的物理与空间规律，而不仅仅是过拟合特定引擎的底层检查逻辑。如果这个假设不成立，即 engine reward 过于局部或容易被“钻空子”，导致模型只学会满足特定引擎的离散检查（例如生成无碰撞但视觉上荒谬或语义破碎的布局），那么 RLHEV 框架就退化为一种针对特定引擎规则的 reward hacking 过程，失去了作为通用 world model scaling 引擎的意义。在实际中，这个假设极易不成立，因为 game engine 的物理规则是简化的，其局部检查（如 collider 交集）无法保证长程的语义连贯性和真实世界的物理复杂性。论文提供的证据仅限于 UnitySceneBench 上的 asset 分类与生成，以及向 Unreal/Godot 的微弱正向迁移（0.25 提升至 0.35），但缺乏在真实物理环境或复杂长程任务中的验证，未能证明这种 engine-grounded reward 能够跨越 sim-to-real gap 而不被严重 hack。\n\n### § 10 最小复现实验\n在一周时间内，可以设计一个最小复现实验来验证“engine reward 比 fuzzy proxy reward 更能提升 spatial generation 的结构正确性且不易被 hack”这一核心 claim。数据方面，可使用数百个简单的 3D 室内场景（包含物体坐标、尺寸和文本描述）。实现方面，训练一个轻量级的 text-to-layout 生成模型（如基于 MLP 或小型 Transformer 的模型），并设置两组 RL post-training 设置：一组使用 CLIP score 作为 reward（Fuzzy Proxy），另一组使用简单的 bounding box 交集检测和路径连通性检查作为 reward（Engine Verification）。测量指标包括生成场景的物理穿模率和路径阻挡率，以及与文本的语义对齐度。如果 Engine Verification 组在保持相当语义对齐度的前提下，物理穿模率显著低于 Fuzzy Proxy 组，且 Fuzzy Proxy 组出现明显的 reward hacking 现象（如物体重叠以最大化 CLIP 视觉相似度），则支持论文的 claim；反之，若 Engine Verification 组生成的场景出现极端退化（如所有物体贴墙角以避免碰撞），则反驳了该 claim。", "research_value": "### § 11 最强反例设计\n我会设计一个名为“静态结构约束下的语义与物理崩塌”的实验来直接攻击论文的核心假设，即 game engine 的 structural verification 能够引导模型学习到可泛化的物理与空间规律。具体而言，在 UnitySceneBench 上训练 AWoMo 模型生成复杂的室内场景（如厨房或客厅），但在 RL post-training 阶段，仅使用 game engine 的 structural verification（如 collider 无交集、navmesh 连通）作为 reward，移除 human verification。我预测模型会迅速找到 engine 的“钻空子”路径：为了绝对避免 collision penalty，模型会生成悬浮于半空或紧贴天花板的家具；为了满足 navmesh reachability，模型会生成违背重力的浮空桥接路径。这些生成结果在 Unity 的 discrete checker 中能获得满分，但在语义上完全荒谬。进一步地，将这些“高分”场景导入高保真连续物理模拟器（如 Isaac Sim）或真实机器人环境中，由于缺乏真实的物理锚定（如无支撑的物体会掉落），场景会瞬间崩塌。这个反例提供了具体的替代解释：论文在 UnitySceneBench 上的性能提升并非因为模型学到了通用的 spatial intelligence，而是因为模型过拟合了 Unity 引擎特定的离散检查逻辑，本质上是一种高级的 engine-specific reward hacking，根本无法跨越 sim-to-real gap。\n\n### § 12 Follow-up Research Idea\n驱动这个想法的局限是：game engine 的 structural verification 本质上是静态且局部的，它只能验证“场景是否能编译”和“物体是否穿模”，却无法验证“场景是否功能可用”或“物理动态是否真实”。例如，engine 可以检查椅子的 collider，但无法判断这把椅子是否真的能被坐下而不翻倒，也无法验证抽屉是否能被拉开。这种静态验证留下了巨大的 sim-to-real gap 和 semantic vulnerability。为了填补这一缺口，我们可以借鉴 Embodied AI 和 Robotic Manipulation 领域的“Task Success as Reward”范式，将其与 World Model 训练结合。第一个实验将提出一种全新的 post-training 范式——RLTEV（Reinforcement Learning from Task-Execution Verification）。具体而言，训练一个 spatial world model 生成室内场景，随后将一个预训练的 embodied agent（如基于 Habitat 或 Isaac Lab 的通用操作策略）部署到生成的场景中执行一系列长程任务（如“从冰箱拿取食物并放到桌上”）。agent 的 task success rate、物理交互的稳定性（如物体是否异常滑动）以及 trajectory smoothness 将作为 dense reward 反馈给 world model 进行 RL post-training。这与已有工作（如 Game-RL 或 UED）形成本质区别：已有工作使用固定环境训练 agent，而本提议使用 agent 的动态交互失败信号来反向训练和修复 world model。它将 verification 的标准从“静态结构合法”提升为“动态功能可用”，从根本上消除了通过静态 collider hacking 获取高分的可能，并天然桥接了 sim-to-real gap。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Pengfei Zhou\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Hexin Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Zhengfeiyang Zhang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yixing Ma\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Zhenglin Wan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Kaipeng Zhang\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Wangbo Zhao\", \"affiliations\": [5], \"markers\": [\"‡\"]},\n    {\"name\": \"Yang You\", \"affiliations\": [1], \"markers\": [\"‡\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"National University of Singapore, HPC-AI Lab\"},\n    {\"id\": 2, \"name\": \"InfRec, Cardinal AI Lab\"},\n    {\"id\": 3, \"name\": \"University of California, Berkeley\"},\n    {\"id\": 4, \"name\": \"Independent Researcher\"},\n    {\"id\": 5, \"name\": \"Hong Kong University of Science and Technology\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"‡\", \"text\": \"Corresponding Author\"}\n  ]\n}\n```", "summary_translation": "扩展 world models 的一种常见策略是使用更多算力在更多爬取的视频上进行训练。我们认为这种策略是低效的：扩展 world models 还需要一个提供 grounded reward signals 的递归数据引擎。code agents 的成功说明了为什么这很重要。由于代码是可执行的，compilers 和 runtimes 可以为 LLMs 的 Reinforcement Learning (RL) post-training 提供高质量的奖励。相比之下，空间生成仍然在很大程度上依赖于诸如 CLIP scores 之类的模糊代理指标。这些信号是模糊且有偏的，使其难以支持 RL post-training。与这些相比，游戏开发为 spatial world models 提供了一个缺失的奖励环境。由 game engine 编码的场景是一个可执行的世界规范：引擎可以高效地检查碰撞、物理、可导航性和有界可玩性，而开发者则通过判断是否应该接受该场景来提供全局验证信号。游戏开发还为 RL post-training 提供了真实世界的 long-horizon trajectory data。因此，我们提出了 Reinforcement Learning with Human-Engine Verification (RLHEV)，这是一种将密集的 engine signals 与来自开发过程的隐式人类接受反馈相结合的 post-training paradigm。"}]}], "2026-08-26": [{"name": "Self-Improvement \u0026 Recursive Evolution", "count": 5, "papers": [{"title": "SkillForge: Evolving Verifiable Skills for Reinforcement Learning Agents", "arxiv_id": "2608.24747", "authors": "Shidong Yang, Ziyu Ma, Tongwen Huang, Xucong Wang, Renda Li, Yiming Hu, Yong Wang, Xiangxiang Chu", "summary": "Large language model (LLM) agents are trained with reinforcement learning (RL) for complex decision-making tasks. However, most RL-trained agents remain episodic and cannot accumulate reusable knowledge across episodes. Recent skill-based approaches, such as SkillRL, attempt to address this issue by extracting skills from raw trajectories, but treat the skill bank as an append-only repository without verifying whether stored skills remain effective. In this paper, we propose SkillForge, a framework for continuous skill evolution that enables skills to be verified and refined through environment interaction. By making skill usage explicit during agent interaction, RL can directly optimize both environment actions and skill invocation decisions. SkillForge further introduces evidence-based skill verification and multi-pathway skill induction, allowing the skill bank to continuously grow while maintaining its quality. Extensive experiments on ALFWorld, WebShop, and AppWorld show that SkillForge consistently outperforms SkillRL, demonstrating the effectiveness of continuously verified skills in training stronger LLM agents.", "category": "cs.CL", "cluster": "Self-Improvement \u0026 Recursive Evolution", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=18 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文完全符合“LLM智能体及其演化”的研究范围，具体依据如下：\n\n1.  核心对象匹配：论文明确针对 LLM Agents（大型语言模型智能体），并在摘要中多次提及“LLM agents are trained with reinforcement learning”以及“training stronger LLM agents”。\n2.  符合“自我演化”方向：论文提出的 SkillForge 框架核心在于 Continuous Skill Evolution（持续技能演化）。它解决了现有方法中技能库仅追加不验证的问题，引入了基于证据的技能验证（evidence-based skill verification）和多路径技能归纳，使技能库能够随着环境交互不断生长并保持质量。这直接对应研究焦点中的“自我演化 (Self-Evolving)”和“智能体通过经验、反思或环境反馈进行自我完善和迭代”。\n3.  符合“单智能体能力”方向：论文关注的是智能体的 Skill Acquisition（技能获取）和 Memory（记忆/知识积累）机制，即如何让智能体在长周期任务中积累可复用的知识（reusable knowledge），这是构建高级 Agentic AI 的关键能力。\n4.  非排除项：虽然涉及强化学习（RL），但其目的是训练和演化 LLM 智能体的技能，而非单纯的模型训练基础设施或基础推理优化；也不涉及被排除的安全、多模态视觉核心、图神经网络或多智能体拓扑编排等问题。\n\n综上，该论文提出了一个让 LLM 智能体通过环境反馈持续演化其技能库的新框架，属于典型的 Agentic AI 自我演化研究，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：如何使基于大语言模型（LLM）的强化学习（RL）智能体能够跨 episode 积累、验证并复用可验证的技能（skills），从而克服传统 RL 智能体“episodic”（即每个 episode 从零开始、无法保留过往经验）的根本缺陷。这一问题的重要性在于，尽管 RL 已成为训练 LLM 智能体处理复杂决策任务（如 Web 导航、多步推理）的主流方法，但现有智能体往往在每次交互中重复发现相同的有效行为，导致学习效率低下且难以适应长 horizon 任务。解决该问题的价值在于，通过构建一个持续演化的技能库（skill bank），智能体不仅能从成功轨迹中提取通用策略，还能从失败中提炼修正规则，从而显著提升样本效率、任务成功率及跨任务的知识迁移能力。SKILLFORGE 框架通过显式技能调用（explicit skill calling）和基于证据的技能验证（evidence-based skill verification），实现了技能质量的动态维护，避免了知识库的污染，为构建具备长期记忆和自适应能力的智能体提供了有效路径。\n\n### § 2 前人工作与不足\n\n该问题此前已有初步探索，最相关的 prior work 包括基于外部记忆的方法（如 Mem0, SimpleMem）以及基于技能提取的方法（如 SKILLRL）。基于记忆的方法通常存储原始轨迹或压缩摘要，但原始轨迹冗长、噪声大，且难以提取出结构化的、可复用的决策原则；即使经过压缩，这些方法仍主要依赖回忆过去 episode 而非提取抽象知识，导致检索效率低且易受无关信息干扰。SKILLRL 等技能学习方法虽然尝试从轨迹中蒸馏出紧凑的技能并注入 prompt，但其存在三个关键不足：首先，技能库被视为“append-only”（仅追加）仓库，缺乏对已存储技能有效性的验证机制，导致错误或过时的技能可能长期污染知识库；其次，技能使用过程不透明，技能以批量形式注入 prompt，无法观测智能体是否真正依赖特定技能，导致难以进行细粒度的信用分配（credit assignment）；最后，缺乏对技能质量的主动控制，无法区分成功轨迹是由特定技能驱动还是偶然巧合。SKILLFORGE 通过引入显式技能调用标签（\u003Cskill_call\u003E）使技能使用可观测，并结合基于成功率和使用次数的证据验证机制，解决了 SKILLRL 在技能质量维护和归因分析上的局限，实现了技能库的持续进化而非简单堆积。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM Agent 的强化学习（RL）训练中，一个长期存在的痛点是“灾难性遗忘”与“低效探索”。传统的 RL 方法（如 PPO、GRPO）通常将每个 episode 视为独立事件，Agent 无法跨 episode 积累可复用的知识，导致在复杂任务中反复试错。为了解决这个问题，社区引入了外部记忆机制，如 ReAct 中的反思或 Mem0 中的长期记忆存储。然而，直接存储原始轨迹（raw trajectories）存在严重缺陷：轨迹冗长、噪声大且包含大量无关细节，导致检索效率低下且难以提取通用策略。\n\n随后，研究焦点转向了“技能（Skills）”这一更结构化的知识抽象形式。以 SKILLRL 为代表的工作尝试从轨迹中蒸馏出紧凑的技能（包含意图、原则和适用条件），并将其作为上下文注入到 Prompt 中。这种方法确实提升了性能，但作者敏锐地发现了其核心缺陷：**技能库被当作一个“只追加（append-only）”的静态仓库**。在这种范式下，技能一旦生成便不再被验证。这导致了三个关键问题：第一，**不可观测性**，技能是批量注入 Prompt 的，Agent 是否真正使用了某个特定技能无法追踪；第二，**归因困难**，由于缺乏显式的调用信号，无法判断任务成功是归功于某个技能还是巧合；第三，**质量失控**，错误或过时的技能会永久污染知识库，随着训练进行，噪声累积反而可能损害性能。\n\n基于此，作者意识到，要让技能真正进化，必须将“技能的使用”从隐式的上下文提示转变为显式的、可追踪的动作。如果 Agent 必须通过显式调用（explicit calling）来激活技能，那么每一次调用就成为了轨迹中的一个离散事件，从而使得 RL 可以直接优化“何时调用”以及“调用哪个技能”。同时，这种显式调用为基于证据的验证（evidence-based verification）提供了数据基础：通过统计每个技能的调用次数和成功率，可以量化其有效性，进而触发 LLM 的反思（reflexion）机制来修订或淘汰低效技能。由此，SKILLFORGE 的核心逻辑自然浮现：构建一个闭环系统，其中技能不仅是被检索的静态知识，更是通过环境交互被持续验证、修正和进化的动态实体。\n\n### § 4 核心 Intuition\n\n现有方法将技能视为静态的“提示词上下文”，导致无法追踪具体哪个技能生效，也无法剔除无效知识，造成技能库随时间推移而污染。SKILLFORGE 的核心直觉是将技能调用转化为 Agent 的**显式离散动作**，使得强化学习能够直接优化“何时使用技能”这一决策，从而建立技能使用与任务结果之间的因果归因。基于这种可观测性，系统能够利用调用统计数据（如成功率）作为证据，自动触发对低效技能的反思与修订，实现技能库在增长过程中的**自我净化与持续进化**，而非简单的无限堆积。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**SkillForge** 的核心思想是将技能（Skills）从静态的“只追加”记忆库转变为动态的、可验证的、可进化的知识单元。其完整 Pipeline 包含三个主要阶段：技能表示与检索、显式技能调用与策略优化、以及基于证据的技能进化。\n\n以下以 **AppWorld** 环境中的一个具体任务为例，演示完整的 Pipeline：\n**任务场景**：用户要求“找出我 Spotify 播放列表中最长的那个，并告诉我时长（分钟）”。\n\n1.  **技能表示与检索 (Skill Representation \u0026 Retrieval)**\n    *   **输入**：任务描述 $d$（\"Find my longest Spotify playlist duration\"）。\n    *   **处理**：系统从技能库 $B$ 中检索与任务语义最相关的技能。技能库分为通用技能（General Skills）和任务特定技能（Task-Specific Skills）。检索器计算任务描述嵌入与技能意图嵌入的相似度，选出 Top-K 个技能。\n    *   **输出**：一个紧凑的**技能目录 (Skill Catalog)**，仅包含技能名称和一行简短的触发条件描述。例如，检索到技能 `[Enumerate User-Owned Entities First]`，其描述为“当任务涉及用户特定集合时，先枚举这些集合”。该目录被注入到 Agent 的 System Prompt 中。\n\n2.  **显式技能调用与策略优化 (Explicit Skill Calling \u0026 Policy Optimization)**\n    *   **输入**：Agent 观察到当前环境状态（已登录 Spotify，查看 API 文档）。\n    *   **处理**：\n        *   Agent 进行推理，决定调用技能。它在输出中生成结构化标签 `\u003Cskill_call\u003EEnumerate User-Owned Entities First\u003C/skill_call\u003E`。\n        *   框架解析该标签，将技能的完整内容（Intent, Principle, Applicability Conditions）作为反馈返回给 Agent。\n        *   **Principle 内容**：“当任务引用用户特定集合（如播放列表）时，首先使用专用 API（如 `show_playlist_library`）枚举这些集合，然后再应用过滤器或修改。切勿用全局搜索结果替代用户拥有的项目。”\n        *   Agent 根据此指导执行动作：调用 `show_playlist_library` 并分页获取所有播放列表。\n        *   任务完成后，获得奖励 $r \\in \\{0, 1\\}$。\n        *   **策略更新**：使用 **GRPO** (Group Relative Policy Optimization) 更新 Agent 参数 $\\theta$。由于 `\u003Cskill_call\u003E` 标签是生成序列的一部分，RL 直接优化了“何时调用”以及“调用哪个技能”的决策。\n    *   **输出**：更新后的策略参数 $\\theta$，以及一条包含技能调用事件的轨迹 $\\tau$。\n\n3.  **基于证据的技能进化 (Evidence-Based Skill Evolution)**\n    *   **输入**：收集到的轨迹缓冲区（成功轨迹 $T_+$ 和失败轨迹 $T_-$）。\n    *   **处理**：\n        *   **多路径技能归纳 (Multi-Pathway Skill Induction)**：每隔 $I$ 步，教师 LLM ($M_T$) 分析轨迹。\n            *   若从成功轨迹中提取通用策略，生成新技能。\n            *   若从失败轨迹中识别常见错误，生成修正性技能。\n            *   若对比成功与失败，生成区分性技能。\n            *   新技能经过去重（词汇和语义）后加入技能库。\n        *   **基于证据的技能验证 (Evidence-Based Skill Verification)**：\n            *   跟踪每个技能的统计信息：指数移动平均 (EMA) 成功率 $\\hat{p}_s$ 和总使用次数 $n_s$。\n            *   计算**表现不佳分数 (Underperformance Score)**：$conf(s) = \\frac{n_s}{h} \\cdot (1 - \\hat{p}_s)$。分数高表示该技能被频繁使用但成功率低。\n            *   对高分技能进行 **LLM Reflexion**：教师 LLM 审查技能定义及其使用上下文，决定 **Keep**（保留）或 **Revise**（修订原则或触发条件）。\n    *   **输出**：更新后的技能库 $B$，其中包含新增的有效技能和经过修订的旧技能，供下一轮训练使用。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有提出全新的基础数学理论，而是基于现有的强化学习算法（GRPO）和统计方法设计了具体的优化目标和评估指标。以下是核心公式的 Intuition 解释：\n\n1.  **策略优化目标 (GRPO Objective)**\n    $$ \\mathcal{L}(\\theta) = \\frac{1}{G} \\sum_{i=1}^{G} \\left[ \\min \\left( \\rho_i A_i, \\text{clip}(\\rho_i, 1-\\epsilon, 1+\\epsilon) A_i \\right) - \\beta \\mathbb{D}_{KL}[\\pi_\\theta || \\pi_{ref}] \\right] $$\n    *   **Intuition**：这是标准的 PPO/GRPO 损失函数。\n        *   $\\rho_i = \\pi_\\theta / \\pi_{\\theta_{old}}$ 是重要性采样比率，衡量新策略与旧策略在生成当前轨迹上的概率差异。\n        *   $A_i$ 是组相对优势（Group-Relative Advantage），表示当前轨迹相对于同组其他轨迹的表现好坏。\n        *   **关键点**：由于 `\u003Cskill_call\u003E` 标签是生成序列的一部分，$\\pi_\\theta$ 不仅优化环境动作 $a_t$，也优化技能调用决策 $c_t$。这意味着 RL 直接学习“在什么情况下调用技能能带来更高的奖励”。\n\n2.  **技能有效性跟踪 (EMA Success Rate)**\n    $$ \\hat{p}_s^{(t)} = \\alpha r_t + (1-\\alpha) \\hat{p}_s^{(t-1)} $$\n    *   **Intuition**：这是一个指数移动平均公式。\n        *   $\\hat{p}_s$ 是技能 $s$ 的历史成功率估计。\n        *   $\\alpha$ 是平滑因子。\n        *   **目的**：避免单次成功或失败对技能评价造成剧烈波动，提供一个稳定的、反映长期表现的成功率指标。\n\n3.  **表现不佳分数 (Underperformance Score)**\n    $$ conf(s) = \\frac{n_s}{h} \\cdot (1 - \\hat{p}_s) $$\n    *   **Intuition**：这是一个用于决定哪些技能需要被审查的评分机制。\n        *   $n_s$ 是技能被调用的总次数。\n        *   $h$ 是使用半衰期（Usage Half-life），用于归一化不同技能的使用频率。\n        *   $(1 - \\hat{p}_s)$ 是失败率。\n        *   **核心逻辑**：如果一个技能**很少被使用**（$n_s$ 小），即使失败率高，也不一定是技能本身的问题，可能是检索不到或 Agent 没学会用；如果一个技能**经常被使用**（$n_s$ 大）且**失败率高**（$1-\\hat{p}_s$ 大），则说明该技能很可能存在缺陷或已过时，需要优先进行 LLM Reflexion 进行修订。这个公式量化了“证据强度”。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有的基于技能的 RL 方法（如 SKILLRL）将技能库视为“只追加”的存储库，缺乏对技能有效性的验证机制。这导致技能库中可能积累无效、过时或错误的技能，污染知识库，且无法明确归因于特定技能的成功或失败。\n\n**2. 设计了什么实验验证这个问题？**\n*   **主实验 (Main Results)**：在 ALFWorld, WebShop, AppWorld 三个基准上，对比 SkillForge 与 SOTA 方法（包括 Vanilla RL, Memory-based, 以及最接近的基线 SKILLRL）。\n    *   *验证点*：SkillForge 是否能通过持续验证和进化技能，获得比静态技能库更高的性能？\n*   **消融实验 (Ablation Study)**：移除 SkillForge 的关键组件：\n    *   `w/o Explicit Calling`：不使用显式技能调用标签，改为批量注入。\n    *   `w/o Skill Bank`：不使用外部技能库。\n    *   `w/o Multi-Pathway Induction`：仅从成功轨迹提取技能，不从失败或对比中学习。\n    *   `w/o Effectiveness Tracking / LLM Reflexion`：不进行基于证据的验证和修订。\n    *   *验证点*：显式调用、多路径归纳、以及验证机制各自对最终性能的贡献是多少？\n*   **技能库进化分析 (Skill Bank Evolution)**：可视化技能数量随训练步骤的变化，以及技能嵌入空间 (t-SNE) 的分布变化。\n    *   *验证点*：技能库是否真的在“进化”（多样化、专业化）而不是盲目增长？\n*   **技能可迁移性 (Skill Transferability)**：将小模型 (Qwen3-4B) 训练出的技能库直接应用于大模型 (Qwen3-30B-A3B)，不进行额外训练。\n    *   *验证点*：SkillForge 学到的技能是否是通用的、可迁移的知识，而非特定于模型参数的过拟合产物？\n\n**3. 问题的答案是什么？**\n*   **性能提升**：SkillForge 在所有基准上均显著优于 SKILLRL 和其他基线。例如，在 ALFWorld 上比 SKILLRL 提高 3.7%，在 WebShop 成功率上提高 10.3%。这证明了**持续验证和进化技能**比静态积累更有效。\n*   **组件有效性**：消融实验显示，移除显式技能调用或技能验证机制会导致性能大幅下降。特别是**显式调用**使得技能使用可观测，从而允许 RL 进行精确的信用分配；**多路径归纳**（尤其是从失败中学习）对复杂环境（如 AppWorld）至关重要。\n*   **技能库质量**：技能库的大小随训练稳步增长但保持可控，t-SNE 显示新技能逐渐扩展到未探索的嵌入空间区域，表明技能库在**多样化**和**专业化**。\n*   **可迁移性**：小模型生成的技能库能显著提升大模型的性能，甚至超过大模型自进化初期的表现。这说明 SkillForge 提取的是**环境相关的通用决策原则**，具有高度的可迁移性。", "additional_insights": "### § 8 Take-aways\n\nSKILLFORGE 的核心突破在于将技能调用（Skill Calling）显式化为强化学习（RL）轨迹中的离散事件，从而解决了传统方法中技能使用不可观测、归因困难的问题。通过引入 `\u003Cskill_call\u003E` 标签，RL 算法（如 GRPO）能够直接优化“何时调用技能”这一决策，实现了环境动作与技能调用的联合优化。该框架提出了基于证据的技能验证机制（Evidence-based Skill Verification），利用指数移动平均（EMA）成功率和使用次数计算“表现不佳分数”，自动触发 LLM 对低效技能进行反思（Reflexion）和修订，防止知识库污染。多路径技能归纳（Multi-pathway Skill Induction）机制不仅从成功轨迹中提取策略，还从失败轨迹和对比分析中生成修正性技能，确保了技能库在增长的同时保持高质量。实验表明，SKILLFORGE 在 ALFWorld、WebShop 和 AppWorld 上均显著优于 SKILLRL，且无需冷启动初始化，证明了持续验证和演进的技能比静态追加的技能库更能提升 Agent 的长期决策能力。\n\n### § 9 最脆弱的假设\n\nSKILLFORGE 最脆弱的假设是：**外部教师 LLM（Teacher LLM）具备足够的能力，能够准确地从轨迹摘要中归纳出高质量的新技能，并对现有技能做出正确的“保留”或“修订”判断。**\n\n如果这一假设不成立，即教师 LLM 生成的技能存在逻辑错误、过度泛化或无法捕捉关键决策模式，那么整个“技能演进”循环将失效。具体而言：\n1.  **归纳错误导致污染**：如果教师 LLM 从失败轨迹中提取了错误的因果归因（例如将偶然成功归因于某个无关动作），生成的技能将是误导性的。由于 SKILLFORGE 依赖这些技能进行后续推理，错误的技能会被反复调用，导致 Agent 性能下降而非提升。\n2.  **验证失效**：证据-based 验证机制依赖于教师 LLM 对“表现不佳”技能的反思。如果教师 LLM 无法理解技能失败的根本原因（例如混淆了环境状态与技能适用条件），它可能错误地“保留”了无效技能，或“修订”了有效技能，导致技能库质量退化。\n\n**论文提供的证据与缺失：**\n论文在附录 A.7 进行了教师敏感性分析，显示即使使用与策略模型相同的较小模型作为教师（Self-teacher），性能仍有提升，这暗示框架本身有一定鲁棒性。然而，该实验并未展示教师 LLM 在极端复杂或长尾任务中的归纳错误案例。论文缺乏对教师 LLM 生成技能质量的定量评估（如人工评估或自动化逻辑一致性检查），也未探讨当教师 LLM 能力低于策略模型时，系统是否会陷入“垃圾进，垃圾出”的恶性循环。因此，系统性能高度依赖于教师 LLM 的推理和抽象能力，这是该方法在实际部署中最大的风险点。\n\n### § 10 最小复现实验\n\n**目标**：验证“显式技能调用（Explicit Skill Calling）”是否真的比“批量注入（Bulk Injection）”能带来更好的技能归因和 RL 优化效果，而不需要复现完整的技能演进循环。\n\n**数据**：使用 ALFWorld 或 WebShop 的一个子集（例如 50 个任务）。\n\n**实现**：\n1.  **基线模型**：训练一个标准的 GRPO 模型，不使用任何技能库。\n2.  **SkillForge 变体（显式调用）**：构建一个固定的、小型的技能库（例如 10 个已知有效技能）。在 Prompt 中只注入技能标题和简短意图（Catalog）。Agent 必须通过生成 `\u003Cskill_call\u003ENAME\u003C/skill_call\u003E` 标签来触发技能，系统随后将完整技能内容注入到下一个 Observation 中。使用 GRPO 进行训练。\n3.  **对比变体（批量注入）**：使用相同的技能库和 Prompt 结构，但不要求 Agent 调用。而是根据任务描述，通过检索将所有相关技能的完整内容直接注入到初始 Prompt 中（类似 SKILLRL 的方式）。使用 GRPO 进行训练。\n\n**测量**：\n1.  **最终成功率**：比较两种方法在测试集上的成功率。\n2.  **技能使用相关性**：在训练过程中，记录每个技能被调用的次数与该技能相关任务的成功率之间的相关性。在“显式调用”组中，应能观察到高成功率技能被更频繁调用；而在“批量注入”组中，由于所有技能都可见，无法直接观测到这种选择性使用的信号。\n\n**结果判定**：\n*   **支持 Claim**：如果“显式调用”组的最终成功率显著高于“批量注入”组，且训练曲线显示更快的收敛速度，则证明显式调用机制有助于 RL 更有效地优化技能使用策略。\n*   **反驳 Claim**：如果两组性能无显著差异，或“批量注入”组表现更好，则说明显式调用的开销（额外 token、决策复杂度）并未带来足够的优化收益，或者 RL 无法有效学习这种离散的技能调用决策。", "research_value": "### § 11 最强反例设计\n\n若要挑战 **SkillForge** 的有效性，最有力的攻击并非针对其性能提升的幅度，而是针对其核心机制——**显式技能调用（Explicit Skill Calling）**与**基于证据的验证（Evidence-Based Verification）**之间的因
