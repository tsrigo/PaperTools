过高或与其他验证器高度相关（即可能犯同样的错），即使测试通过，也可能拒绝提交，要求更多证据或人工审核。\n*   **输出**：最终提交的代码或继续循环。\n\n**核心区别**：传统 Pipeline 允许 Agent 自由输出并直接覆盖代码，且证据可能滞后；StateSeal Pipeline 强制证据与代码状态哈希绑定，动作类型化，且通过检查点机制确保“正确状态”一旦达成就不会被后续的错误修订破坏（即 Correctness is Absorbing）。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文包含核心的数学推导，主要用于形式化“可靠性分解”和“证据有效性”。以下是面向数学基础较弱读者的直觉解释：\n\n**1. 状态转移模型 (State Transition Model)**\n*   **公式直觉**：论文定义 $Y_t \\in \\{0, 1\\}$ 为第 $t$ 次修订后代码的正确性（1为正确，0为错误）。\n*   **推导逻辑**：\n    *   $\\alpha_e = P(Y_{t+1}=1 | Y_t=0, e)$：从错误状态通过证据 $e$ 修复为正确的概率（修复能力）。\n    *   $\\beta_e = P(Y_{t+1}=0 | Y_t=1, e)$：从正确状态通过证据 $e$ 退化为错误的概率（回归风险/Continuation Harm）。\n*   **核心结论**：仅仅关注 $\\alpha_e$（修复能力）是不够的。如果 $\\beta_e$ 很高，继续修订反而有害。论文推导出，当当前正确率 $q_t$ 超过阈值 $\\frac{\\alpha_e}{\\alpha_e + \\beta_e}$ 时，继续修订的期望正确率变化为负。这解释了为什么“循环越多越好”是错误的，因为存在“正确状态被破坏”的风险。\n\n**2. 有效证据响应 (Effective Evidence Response)**\n*   **公式直觉**：定义 $\\Delta_e = (\\alpha_e - \\beta_e)$ 或类似的对比量。\n*   **推导逻辑**：这个量衡量证据 $e$ 的净效用。\n    *   如果 $\\Delta_e \u003E 0$，证据有助于从错误走向正确，且不会轻易破坏正确状态。\n    *   如果 $\\Delta_e \u003C 0$，证据可能是误导性的（Stale Evidence），或者 Agent 对证据反应过度。\n*   **直觉**：这解释了为什么“Stale Trace”（过时的执行轨迹）是有害的。虽然它包含真实信息，但因为它绑定的是旧状态，对于当前正确状态而言，它提供了错误的上下文，导致 $\\beta_e$ 激增，从而 $\\Delta_e$ 变为负值。\n\n**3. 验证器风险与依赖性 (Verifier Risk and Dependence)**\n*   **公式直觉**：\n    *   **Risk**：在给定覆盖率（Coverage）下，验证器错误接受错误代码的概率。\n    *   **Conditional Dependence ($\\phi$)**：两个验证器在都错误接受错误代码时的相关性。\n*   **推导逻辑**：论文指出，即使两个验证器单独看都很强（低 Risk），如果它们的错误是高度相关的（高 $\\phi$），那么组合使用它们并不能显著降低整体风险。\n*   **核心结论**：$P(A_1 \\cap A_2 | Y=0) \\approx P(A_1|Y=0) \\times P(A_2|Y=0)$ 仅在 $\\phi=0$ 时成立。如果 $\\phi \u003E 0$，联合错误率高于独立乘积，这意味着简单的“多数投票”或“双重验证”可能无效，除非验证器之间具有独立性。\n\n**总结**：数学推导的核心目的是证明：**迭代本身不保证可靠性**，可靠性取决于状态转移矩阵中的 $\\alpha$ 和 $\\beta$ 平衡，以及验证器的独立性和风险校准。\n\n### § 7 实验设计与结论\n\n**RQ1: 正确性是否是吸收状态？（即一旦正确，是否会保持正确？）**\n*   **问题**：在强制修订循环中，代码一旦变正确，是否会因为后续修订而变回错误？\n*   **实验设计**：**Trajectory Study**。使用 30 个 HumanEval 任务，强制进行 3 次修订。对比“当前正确率”（Current Correctness）和“曾经正确率”（Ever-Correct）。\n*   **答案**：**否，正确性不是吸收状态。** 数据显示，经过 1 次修订后正确率为 0.820，但经过 2 次修订后降至 0.673，尽管“曾经正确”的比例上升至 0.847。这表明约 16% 的轨迹在产生正确补丁后，因后续修订而丢失了正确性。\n\n**RQ2: 证据内容和状态对齐如何影响修复和回归？**\n*   **问题**：不同类型的证据（当前 vs. 过时）对从错误修复和从正确保持的影响是什么？\n*   **实验设计**：**Common-State Intervention**。冻结相同的错误和正确代码状态，分别注入“当前证据”、“过时证据”、“无证据”等，观察单步转移结果。使用 7B 和 14B 模型进行对比。\n*   **答案**：**证据有助于修复，但过时证据会严重损害保留。** 对于 14B 模型，过时轨迹（Stale Trace）导致 34/135 的正确起始状态回归为错误，而当前轨迹仅导致 4/135 回归。这证明了“状态绑定”的必要性：过时的证据即使内容真实，也会误导 Agent 破坏当前正确的代码。\n\n**RQ3: 验证器的质量是否等同于独立性？**\n*   **问题**：使用不同家族的模型作为验证器是否能保证低错误率和独立性？\n*   **实验设计**：评估 Qwen-7B, Qwen-14B, DeepSeek-6.7B 作为验证器的风险（Risk）和条件依赖性（$\\phi$）。\n*   **答案**：**否，质量不等于独立性。** Qwen-14B 和 DeepSeek 虽然家族不同，但在特定覆盖率下，它们的错误接受率可能存在相关性。更重要的是，高覆盖率往往伴随高风险，且不同验证器之间的错误依赖性随操作点变化，不能简单假设多样性带来独立性。\n\n**RQ4: 哪些编排守卫能直接阻止观察到的失败类别？**\n*   **问题**：引入 StateSeal 契约（状态绑定、检查点、新鲜验证）能否减少回归和错误提交？\n*   **实验设计**：**Prospective Paired Online Comparison**。在 27 个任务上对比基线（无守卫）和受保护（Guarded）策略。\n*   **答案**：**守卫能消除观察到的回归，但可能降低修复覆盖率。** 受保护策略在正确起始状态下实现了 0 回归（135/135 保持正确），而基线有 13/135 回归。然而，这也导致从错误状态修复的成功率略有下降，且整体完成覆盖率降低。这表明安全与灵活性之间存在权衡。\n\n**RQ5: 契约和修订允许如何影响仓库级完成？**\n*   **问题**：在更复杂的仓库级任务中，StateSeal 契约是否有效？\n*   **实验设计**：**Repository-Agent Factorial**。在 24 个真实 Bug 上，对比 Contract ON/OFF 和 Current/Stale 证据。\n*   **答案**：**契约消除了不安全完成，但受限于底层修复能力。** Contract ON 消除了所有观察到的不安全完成（Unsafe Completion），但也消除了仅有的几个安全完成（Sound Completion），因为底层 Agent 的修复能力有限（Floor Effect）。这表明契约本身不提升修复能力，但能确保“不犯错”或“不提交错误”，其有效性依赖于底层 Agent 的 Competence。", "additional_insights": "### § 8 Take-aways\n\nCoding agents 的 Generate-test-revise 循环并不自动带来可靠性，因为正确性并非吸收态（absorbing state），后续修订可能破坏已修复的代码。State-bound evidence 至关重要，使用与当前代码状态哈希不匹配的 stale traces 会导致显著的正确性回归（continuation harm），特别是在能力更强的模型（如 14B）上这种危害更为严重。Verifier 的质量（risk）与独立性（dependence）是两个正交属性，模型家族的多样性并不能保证验证器错误的不相关性，高覆盖率下仍可能存在条件假接受依赖。Typed revision contracts 通过强制证据与状态绑定、保留 last-known-good checkpoint 以及基于风险感知的停止策略，可以在机制上防止状态丢失和无效提交，但这属于可执行的规范而非能力增强。Repository 级别的实验显示，严格的 admission 策略虽然消除了 unsafe completion，但也导致了严重的 completion floor 效应，表明在缺乏足够修复能力时，过度保守的门控会牺牲 liveness。评估 agentic code repair 必须区分 ever-correct（轨迹中曾出现过正确解）与 current correctness（最终提交的正确性），并报告 sound completion 和 verifier risk-coverage 以全面衡量系统可靠性。\n\n### § 9 最脆弱的假设\n\n该论文核心贡献最脆弱的假设是：**Verifier 的判定结果（特别是 challenge/hidden tests 的执行结果）是代码正确性的无偏且稳定的代理指标，且验证器与生成器之间的错误相关性可以通过简单的覆盖率匹配和条件依赖系数（$\\phi$）充分捕捉。**\n\n如果这一假设不成立，即验证器本身存在系统性偏差（如 flaky tests、环境依赖导致的误判）或与生成器存在未建模的深层耦合（如训练数据泄露导致的特定模式偏好），那么论文中推导出的“证据绑定”和“门控策略”的有效性将大打折扣。例如，如果 stale evidence 导致的回归并非因为模型被误导，而是因为验证器对特定代码结构的误判，那么 StateSeal 的 checkpoint 机制虽然保留了代码，但可能保留了验证器认为“正确”实则错误的状态。论文通过 HumanEval+ 的 disjoint partitions 和 sealed adjudication 试图控制这一风险，并展示了 verifier risk 随覆盖率变化的曲线，但它缺乏对验证器本身鲁棒性（robustness）的独立评估，也未证明在更复杂的 repository 环境中，这种基于执行结果的验证能完全替代语义正确性。此外，论文承认 verifier family 和 capacity 是 confounded 的，这意味着观察到的“独立性”可能只是特定模型组合下的偶然现象，而非通用属性。\n\n### § 10 最小复现实验\n\n在 1 周内，你可以复现 **RQ2 中关于 stale evidence 导致 continuation harm 的核心发现**，无需构建完整的 StateSeal 系统。\n\n**数据与实现：**\n1.  **数据：** 选取 HumanEval 中 5-10 个已知有正确修复方案的 task。准备两个代码状态：一个初始错误版本（wrong state），一个已修复的正确版本（correct state）。\n2.  **实现：** 使用一个开源 LLM（如 Qwen2.5-7B 或 Llama-3-8B）作为 coder。构造两种 prompt 条件：\n    *   **Current Trace：** 提供当前正确代码的执行通过日志（PASS）。\n    *   **Stale Trace：** 提供来自初始错误代码的执行失败日志（FAIL），但将其作为当前正确代码的反馈输入。\n3.  **测量：** 对每个 task 和每个条件，运行 10-20 次采样（seeds）。测量“正确代码被修改为错误代码”的比例（continuation harm rate）。\n\n**支持或反驳的 Claim：**\n*   **支持：** 如果 Stale Trace 条件下的 harm rate 显著高于 Current Trace 条件（例如 \u003E10% vs \u003C2%），则支持论文关于“stale evidence 会复活已修复 bug”的 claim，证明状态对齐的重要性。\n*   **反驳：** 如果两种条件下的 harm rate 无显著差异，或者 Stale Trace 甚至有助于进一步改进（尽管代码已正确），则反驳了 stale evidence 必然有害的结论，暗示模型可能具有更强的上下文忽略能力或论文中的 harm 是特定模型/提示工程的产物。\n\n此实验直接验证了论文最关键的机制性发现：证据与状态的错位会导致可靠性下降，且无需复杂的 repository 环境或自定义验证器框架。", "research_value": "### § 11 最强反例设计\n\n要挑战这篇论文的核心主张，最有力的攻击并非证明“迭代无用”，而是证明 **StateSeal 的机械约束（Mechanical Constraints）在复杂依赖场景下会导致“假阴性锁定”（False-Negative Locking），从而系统性扼杀了通过多步推理修复深层 Bug 的可能性，且这种损失无法通过简单的“修复能力不足”来解释，而是协议本身的结构性缺陷。**\n\n具体反例设计如下：\n\n**1. 理论攻击：状态哈希的粒度谬误（The Granularity Fallacy of State Hashing）**\n论文假设代码状态 $S_t$ 可以通过哈希 $h(S_t)$ 唯一标识，且证据 $E_t$ 必须严格绑定于此。然而，在面向对象或模块化编程中，许多 Bug 的修复涉及**语义等价但语法不同**的代码重构（Refactoring），或者涉及**全局状态/副作用**的修正。\n*   **攻击点**：如果 Agent 生成一个补丁，该补丁在逻辑上修复了 Bug，但改变了代码的缩进、变量命名或引入了等价的辅助函数，导致 $h(S_{new}) \\neq h(S_{old})$。如果此时测试套件（Test Suite）存在**Flaky Tests**（不稳定测试）或**非确定性行为**（如依赖时间戳、随机种子），StateSeal 的 `Commit Gate` 可能因为一次偶然的测试失败而拒绝该补丁。\n*   **后果**：由于 StateSeal 强制保留 `Last-Known-Good Checkpoint`，系统会回滚到旧状态。更严重的是，如果 Agent 试图基于这个“被拒绝但逻辑正确”的中间状态进行下一步推理（例如，它意识到需要修改另一个模块来配合这个重构），StateSeal 会切断这种**跨状态的知识迁移**，因为证据被严格绑定在已回滚的哈希上。这证明了“状态绑定”在存在非确定性验证或需要多步协同修改的场景中，不仅不能保证可靠性，反而引入了**状态碎片化（State Fragmentation）**，使得 Agent 无法利用中间失败的有益信息。\n\n**2. 实验攻击：多文件依赖中的“幽灵回归”（Phantom Regression in Multi-File Dependencies）**\n论文主要在 HumanEval（单文件函数级）上验证，但在真实仓库（Repository）中，Bug 往往涉及多个文件的交互。\n*   **实验设计**：构造一个场景，其中 Bug 的修复需要同时修改文件 A 和文件 B。Agent 先生成文件 A 的补丁 $P_A$，测试通过（因为文件 B 尚未修改，测试未覆盖交互逻辑，或测试本身有 Mock）。StateSeal 接受 $P_A$ 并更新 Checkpoint。接着 Agent 生成文件 B 的补丁 $P_B$，但 $P_B$ 依赖于 $P_A$ 的特定实现细节。如果 $P_B$ 的测试失败，StateSeal 回滚到 $P_A$ 的状态。此时，Agent 需要重新生成 $P_B$，但 StateSeal 的证据绑定机制要求新的证据必须基于当前状态（含 $P_A$）。\n*   **攻击点**：如果 $P_A$ 本身是一个**部分正确但脆弱**的补丁（例如，它修复了表面症状但引入了潜在的竞态条件，而当前测试未覆盖），StateSeal 会将其视为“Good Checkpoint”并锁定。当 Agent 尝试修复 $P_B$ 时，它被强制在 $P_A$ 的约束下工作，无法回溯到“未修改 A”的状态来探索“同时修改 A 和 B”的全局最优解。\n*   **结论**：这证明了 StateSeal 的**局部最优保留策略（Local Optimal Preservation）**在存在**全局耦合（Global Coupling）**的代码库中，会导致**搜索空间剪枝过度（Over-pruning of Search Space）**，使得 Agent 陷入局部陷阱，无法找到需要协同修改的全局修复方案。这与论文声称的“提高可靠性”背道而驰，因为在复杂系统中，可靠性应包含“找到全局正确解”的能力，而不仅仅是“保留局部通过测试的状态”。\n\n**3. 替代解释：验证器偏差而非证据过时（Verifier Bias vs. Stale Evidence）**\n论文将“Stale Trace”导致的回归归因于证据过时。反例可提出：回归的真正原因是 **LLM 的“过度自信修正”（Over-confident Correction）倾向**，而非证据本身。\n*   **论证**：即使提供 Current Trace，如果 Agent 被提示“请优化代码”或“请修复潜在问题”，它仍可能破坏正确代码。StateSeal 通过 `Keep` 动作缓解了这一点，但这只是抑制了 Agent 的主动性，而非解决了根本问题。\n*   **攻击**：如果我们在实验中引入一个**对抗性提示（Adversarial Prompt）**，要求 Agent “即使测试通过，也要尝试改进性能”，StateSeal 的 `Commit Gate` 可能会因为性能测试的波动性而拒绝正确的代码，或者因为 `Keep` 动作的强制映射而阻止了必要的优化。这表明 StateSeal 的可靠性是建立在**抑制 Agent 能力**的基础上的，而非增强了其判断力。在需要创造性修复的场景中，这种抑制会导致**能力天花板（Competence Ceiling）**，使得系统在面对新颖 Bug 时完全失效。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“状态绑定”到“语义意图追踪”：基于因果干预的 Agentic Code Repair 协议（Causal-Intent Tracking for Agentic Code Repair）**\n\n**（a）驱动局限与未满足需求：**\nStateSeal 的核心局限在于其**语法级状态绑定（Syntactic State Binding）**。它假设代码的正确性可以通过哈希和测试执行结果完全表征，忽略了**修复意图（Repair Intent）**和**因果机制（Causal Mechanism）**。在复杂 Bug 修复中，Agent 可能需要多次尝试不同的修复路径，每条路径都包含部分正确的逻辑片段。StateSeal 的“全有或全无”（All-or-Nothing）检查点机制丢弃了这些中间路径中的**因果知识（Causal Knowledge）**，导致 Agent 无法从失败中学习“哪些部分是对的，哪些是错的”。此外，StateSeal 无法处理**非确定性验证**和**多文件协同修改**中的全局依赖问题，因为它缺乏对代码变更**语义影响（Semantic Impact）**的建模。\n\n**（b）借鉴相邻领域的方法：**\n借鉴**因果推断（Causal Inference）**和**程序分析（Program Analysis）**中的**差分抽象解释（Differential Abstract Interpretation）**和**因果图模型（Causal Graph Models）**。\n*   **因果图模型**：将代码变更建模为因果图，其中节点是代码片段，边是数据流和控制流依赖。通过干预（Intervention）分析，确定哪些变更导致了测试通过/失败。\n*   **差分抽象解释**：不比较代码的哈希，而是比较代码的**抽象语义状态**（如变量类型、控制流图结构、API 调用序列）。这允许系统在语法不同但语义等价的情况下识别“正确性保留”。\n\n**（c）第一个实验设计：**\n**实验名称：Causal-Trace vs. State-Trace in Multi-Step Repair**\n\n1.  **数据集**：选择 SWE-bench 中涉及多文件修改和复杂逻辑的 50 个 Bug。\n2.  **方法对比**：\n    *   **Baseline (StateSeal)**：使用 StateSeal 协议，强制状态绑定和检查点保留。\n    *   **Proposed (CausalSeal)**：引入一个**因果追踪器（Causal Tracker）**，在每次修订时，不仅记录代码哈希，还记录**变更的因果影响图（Causal Impact Graph）**。当测试失败时，系统不直接回滚，而是使用**因果归因（Causal Attribution）**算法，识别导致失败的具体代码片段，并保留其他未受影响的正确片段。Agent 被提示基于因果图进行**局部修正（Local Correction）**，而非全局重写。\n3.  **测量指标**：\n    *   **Repair Efficiency**：达到正确修复所需的平均修订次数。\n    *   **Knowledge Retention**：在失败路径中保留的正确代码片段比例。\n    *   **Global Consistency**：在多文件修改中，保持全局语义一致性的成功率。\n4.  **预期结果**：CausalSeal 将在多步修复中显著减少修订次数，因为它利用了中间失败的因果知识，避免了 StateSeal 的“状态碎片化”和“搜索空间剪枝过度”。这将证明，**可靠性不仅来自状态的保留，更来自对修复意图和因果机制的理解与追踪**。\n\n**与已有工作的区别：**\nStateSeal 关注**执行层面的状态一致性**，而 CausalSeal 关注**语义层面的因果一致性**。StateSeal 是**反应式**的（测试失败则回滚），而 CausalSeal 是**诊断式**的（测试失败则归因并局部修正）。这打开了一个从“机械验证”到“智能诊断”的新研究方向，旨在构建能够理解代码变更因果影响的 Agentic 系统。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Xueping Gao\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jianwei Yang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Qiang Yang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Alibaba Cloud\"\n    }\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "Generate--test--revise 循环在 coding agents 中很常见，但仅靠重复无法提供可靠性保证。我们研究了找到正确补丁与保留、验证并提交它之间的差距。一项针对 30 个 HumanEval 修复任务的密封五种子研究产生了 900 条三修订轨迹。在强制修订下，使用当前轨迹的当前正确率从一次修订后的 0.820 下降到两次修订后的 0.673，尽管 ever-correct 上升至 0.847。两项 common-state 研究使用来自相同冻结程序的 2,430 个分支，以消除治疗后风险集偏差。在预设的 14B 复制实验中，过时轨迹导致 135 个正确起始中有 34 个受损，而使用当前轨迹的仅有 4/135 受损，增加了 22.2 个百分点（task-cluster 95% CI $[8.9,37.0]$，exact Holm $p=0.0337$）。一项前瞻性 540-rollout 策略消除了观察到的正确起始损害，但降低了错误起始修复率，并未能满足其联合标准。针对 24 个 bug 和四个 coder stacks 的 Repository 实验揭示了 floor effects 和组件异质性，但未发现 Holm 显著效应。因此，我们将 admission、preservation、grounded certification、competence 和 liveness 分开。我们推导出一个证据绑定的 typed loop contract，并在参考实现中实例化其机械可执行的子集，该实现将 verifier evidence 绑定到精确的代码状态，保留已验证的检查点，并发出可审计的 admission receipts。该实现是一个可执行规范和一致性工件，而非修复能力提高或校准 verifier 依赖性的证据。"}, {"title": "Falsifiable Commitment Planning for Self-Correcting Web Agents", "arxiv_id": "2607.24167", "authors": "Guangyi Liu, Huan Zhao, Quanming Yao", "summary": "Long-horizon web agents often go off track before final failure: a trajectory can remain locally plausible even after the current state, reused skill, or plan assumption no longer supports the user instruction. Existing agents can plan, reflect, or reuse experience, but their plans rarely specify the evidence under which an active step should still be trusted. We propose FCPAgent, a falsifiable commitment planning framework for robust long-horizon web agents. FCPAgent represents each plan step as a Falsifiable Commitment Unit (FCU): a subgoal grounded in a reusable skill, together with confirming evidence, falsifying evidence, and a confidence score. Execution is organized as a plan-test-repair loop. The hybrid commitment testing module checks candidate actions before they modify the browser and checks observations after execution; for efficiency, it combines lightweight evidence matching with LLM-based diagnostic verification. When evidence falsifies a commitment, scope-aware repair localizes the contradiction to the execution, skill, or planning level and revises the smallest adequate part. On WebArena, FCPAgent achieves a 13.8% relative improvement in average success over the strongest baseline, with especially large gains on long-horizon tasks.", "category": "cs.AI", "cluster": "Planning, Verification \u0026 Self-Correction", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=25 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文完全符合研究范围，核心贡献在于提出了一种针对长周期Web智能体（Long-horizon Web Agents）的自我修正规划框架（FCPAgent）。\n\n具体判断依据如下：\n1. 核心对象匹配：论文明确研究对象是“Web Agents”，属于典型的LLM智能体应用，且聚焦于“Long-horizon”（长周期）场景，符合方向1（单智能体）中关于规划、记忆和工具使用的研究重点。\n2. 机制创新符合“自我演化/改进”定义：论文提出的“Falsifiable Commitment Planning”（可证伪承诺规划）和“plan-test-repair loop”（规划-测试-修复循环）是一种明确的自我修正（Self-Correction）和自我反思（Self-Reflection）机制。它通过证据验证和局部修复来改进智能体的执行轨迹，这直接对应了筛选标准中关于“Self-Correction”、“Self-Reflection”以及“Iterative Improvement”的正面指标。\n3. 非纯应用或基础设施：虽然应用场景是Web，但论文的核心贡献不是解决某个具体的Web业务问题，而是提出了一种通用的智能体规划与纠错方法论，旨在提升智能体在复杂环境下的鲁棒性和成功率，属于构建和改进LLM智能体能力的核心研究。\n4. 无排除项：论文不涉及安全、对齐、多模态视觉核心研究、图神经网络或多智能体拓扑编排等排除领域。\n\n综上，该论文通过引入可证伪的承诺单元和修复机制，显著提升了智能体的自我修正能力，是典型的Agentic AI前沿研究，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文针对长视界（long-horizon）Web Agent 在最终失败前出现的“脱轨执行”（off-track execution）问题，提出了可证伪承诺规划（Falsifiable Commitment Planning, FCP）框架。核心研究问题在于：现有的 Web Agent 虽然具备规划、反思或经验复用能力，但其计划步骤通常缺乏明确的运行时有效性条件（runtime validity conditions），导致 Agent 在当前状态、复用技能或计划假设已不再支持用户指令时，仍因局部动作看似合理而继续执行，从而陷入无效循环或错误分支。这一问题至关重要，因为 Web 环境具有部分可观测性（partially observed）、动态更新及长依赖链特征，使得传统的基于最终反馈的稀疏奖励机制难以及时纠正中间偏差。解决该问题的价值在于，通过将计划步骤转化为包含确认证据（confirming evidence）和证伪证据（falsifying evidence）的“可证伪承诺单元”（Falsifiable Commitment Unit, FCU），Agent 能够在执行过程中在线检测轨迹漂移（trajectory drift），并在最小必要范围内进行修复（scope-aware repair）。这不仅显著提升了长视界任务的鲁棒性（在 WebArena 上相对最强基线提升 13.8%），还通过混合测试机制（hybrid commitment testing）平衡了检测精度与计算效率，为构建稳定、自修正的通用 Web Agent 提供了新的范式。\n\n### § 2 前人工作与不足\n\n尽管已有大量研究致力于提升 Web Agent 的可靠性，但现有方法在应对“脱轨执行”时仍存在根本性不足。ReAct (Yao et al. 2023b) 和 AgentOccam (Yang et al. 2025b) 等基线方法主要关注动作抽象与反应式推理，缺乏对计划整体有效性的显式监控。AWM (Wang et al. 2025b) 和 WALT (Prabhu et al. 2026) 引入了工作流记忆或工具学习以复用经验，但它们假设复用的技能或工具在当前上下文中始终有效，未考虑技能与当前页面布局或权限状态不匹配时的失效情况。WebDART (Yang et al. 2025a) 和 ColorBrowserAgent (Zhou et al. 2026) 虽然引入了动态分解或进度反思以检测偏差，但其计划步骤并未被形式化为具有明确证伪条件的测试对象（testable objects）。具体而言，这些方法通常依赖事后反思（post-hoc reflection）或通用的进度评估，缺乏针对每个活跃计划步骤的、任务特定的前瞻性有效性标准（task-specific prospective validity criteria）。因此，当 Agent 进入语义相关但功能错误的页面分支时，由于缺乏明确的“证伪证据”（如“未出现邀请入口”），这些方法无法在早期识别出局部合理但全局无效的执行路径，导致偏差累积直至任务失败。此外，SkillTracer (Li et al. 2026) 和 ContractSkill (Lu et al. 2026) 虽能进行技能层面的故障归因，但其归因范围局限于技能内部，未能区分执行层、技能层和规划层的多范围故障（multi-scope failure attribution），限制了修复策略的针对性。FCPAgent 通过统一任务特定的有效性标准、多范围归因和归因引导的恢复机制，弥补了上述方法在在线漂移检测和精细化修复方面的缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n在长视界（long-horizon）Web Agent 的研究中，一个核心痛点是“局部合理但全局偏离”（off-track execution）。现有的 Agent 架构，如 ReAct 或基于 Memory/Skill 的方法（如 AWM, WALT），虽然能复用经验或进行动态规划，但它们通常将计划步骤视为不可变的执行指令（executable recipe）。这意味着，一旦 Agent 进入错误的分支（例如在 GitLab 中误入 Group Information 页面而非 Overview 页面），只要当前页面的 UI 元素在语义上与任务相关（如都有“用户”相关标签），Agent 就会继续执行看似合理的操作，直到最终失败。这种失败模式表明，缺乏一种机制来在运行时显式地验证“当前路径是否仍然有效”。\n\n认知心理学中的 TOTE 模型（Test-Operate-Test-Exit）提供了一个理论线索：智能行为本质上是基于预期的，即行动前应有对结果的预期，并通过观察是否违背预期来修正行为。然而，现有的 Web Agent 缺乏这种“预期”的形式化表达。它们要么依赖稀疏的最终反馈（final feedback），要么依赖通用的反思（reflection），后者往往计算昂贵且滞后。\n\n因此，研究者意识到，需要将计划步骤从“做什么”转化为“什么证据表明我在做对，什么证据表明我做错了”。这引入了“可证伪的承诺”（Falsifiable Commitment）的概念。每个计划步骤不应只是一个动作序列，而应是一个假设（hypothesis），包含确认证据（confirming evidence）和证伪证据（falsifying evidence）。当执行过程中观察到证伪证据时，Agent 应立即停止并修复，而不是盲目继续。\n\n进一步地，简单的证据匹配可能不够鲁棒，且频繁调用 LLM 进行验证成本过高。因此，需要一种混合测试机制（hybrid testing）：用轻量级的证据匹配处理常规状态，仅在模糊或高风险状态下调用 LLM 进行诊断。同时，修复机制不能是盲目的重试，而应基于证伪证据的来源（执行层、技能层或规划层）进行范围感知的修复（scope-aware repair）。这一思考路径从“局部合理导致的漂移”问题出发，结合认知理论，最终导向了 FCPAgent 的核心设计：将计划步骤形式化为可测试的承诺，并通过在线测试与针对性修复来保证长视界任务的鲁棒性。\n\n### § 4 核心 Intuition\n\n传统 Web Agent 将计划步骤视为必须执行的指令，导致其在局部合理但全局偏离的路径上盲目坚持，直到最终失败。FCPAgent 的核心直觉是将每个计划步骤重构为一个“可证伪的承诺”（Falsifiable Commitment），即一个包含预期进展证据和偏离证据的假设。通过在线测试这些证据，Agent 能在轨迹发生不可逆漂移前及时检测并修复，从而将执行从“无条件遵循”转变为“基于证据的动态验证”。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nFCPAgent 的核心方法是将传统的“执行计划”转变为“可证伪的承诺规划”（Falsifiable Commitment Planning）。其核心思想是：每一个计划步骤不仅仅是一个操作指令，而是一个带有明确验证条件的假设（Hypothesis）。如果执行过程中的观察结果与假设矛盾（即被证伪），系统会立即触发修复机制，而不是盲目继续。\n\n**完整 Pipeline 流程如下：**\n\n1.  **输入与初始化 (Input \u0026 Initialization)**：\n    *   输入自然语言指令 $q$ 和初始浏览器状态 $o_0$。\n    *   系统从离线构建的 **Skill Library**（技能库，包含成功轨迹提炼的可复用步骤）和 **Failure-Repair Library**（失败-修复库，包含历史失败模式及修复策略）中检索相关的技能 $S_q$ 和失败经验 $F_q$。\n\n2.  **可证伪承诺生成 (Falsifiable Commitment Generation)**：\n    *   Planner 基于检索到的技能和失败经验，生成一系列 **Falsifiable Commitment Units (FCUs)**。\n    *   每个 FCU $c_i$ 包含：子目标 $g_i$、关联技能 $s_i$、**确认证据** $E_i^+$（证明计划正在正常推进的信号）、**证伪证据** $E_i^-$（证明计划已偏离或失效的信号）以及置信度 $\\kappa_i$。\n    *   *关键点*：$E_i^+$ 和 $E_i^-$ 是显式定义的，例如“页面出现‘邀请’按钮”是确认证据，“页面未出现‘邀请’入口且多次导航无进展”是证伪证据。\n\n3.  **混合承诺测试 (Hybrid Commitment Testing)**：\n    *   这是执行循环的核心，分为 **Pre-action Test**（动作前测试）和 **Post-state Test**（状态后测试）。\n    *   **轻量级测试 (Lightweight Tester)**：首先使用高效的模型（如 NLI 模型和 SigLIP）快速匹配当前观察或候选动作与 $E_i^\\pm$。如果匹配度明确（强确认或强证伪），则直接路由；如果模糊或高风险，则升级。\n    *   **LLM 诊断验证 (LLM-based Diagnostic Verification)**：对于升级的案例，调用大语言模型进行深度推理，判断是执行偏差、技能不匹配还是计划本身错误，并输出诊断结果 $d_t$（continue, advance, 或 repair）。\n\n4.  **范围感知修复 (Scope-Aware Repair)**：\n    *   如果测试结果为 `repair`，系统根据诊断出的错误层级（Execution-level, Skill-level, Planning-level）进行最小化修复：\n        *   **执行层修复**：修正当前动作或路径。\n        *   **技能层修复**：保留子目标，但切换关联技能 $s_i$。\n        *   **计划层修复**：重写当前 FCU 或重新规划后续步骤。\n    *   修复过程会参考 Failure-Repair Library 中的类似案例作为软引导。\n\n5.  **输出与蒸馏 (Output \u0026 Distillation)**：\n    *   输出最终的任务执行轨迹 $\\tau$。\n    *   离线阶段，成功的轨迹被蒸馏为新的技能存入 Skill Library，失败或修复的轨迹被存入 Failure-Repair Library，用于增强未来的规划能力。\n\n**真实案例讲解：GitLab 邀请成员任务**\n\n*   **输入**：指令“创建 GitLab 组并邀请用户 A、B”。\n*   **规划**：生成 FCU：子目标“邀请成员”，关联技能“GitLab 邀请流程”，确认证据“看到 Invite 按钮”，证伪证据“当前页面无 Invite 入口且导航未找到”。\n*   **执行与测试**：\n    *   Agent 进入“Group Information”页面寻找邀请入口。\n    *   **Post-state Test**：轻量级测试发现页面没有“Invite”按钮（匹配证伪证据 $E_i^-$ 的一部分），且多次点击无进展。\n    *   **LLM 诊断**：LLM 确认这是 **Execution-level drift**（执行偏离），因为邀请入口通常在 Overview 页面，而非 Information 页面。\n*   **修复**：触发 **Local Repair**，Agent 返回 Overview 页面，找到正确的 Invite 入口。\n*   **输出**：成功邀请用户，任务完成。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的理论数学推导，其核心贡献在于**框架设计**和**工程实现**，而非新的数学定理。但为了帮助理解，我们可以解释其核心公式的直觉（Intuition）：\n\n1.  **FCU 定义**：\n    $$ c_i = (g_i, s_i, E_i^+, E_i^-, \\kappa_i) $$\n    *   **Intuition**：这不仅仅是一个“做什么”的指令，而是一个“假设”。它明确列出了“如果我对，我会看到什么”（$E_i^+$）和“如果我错了，我会看到什么”（$E_i^-$）。$\\kappa_i$ 是系统对这个假设有多自信。\n\n2.  **轻量级测试评分**：\n    $$ \\text{Score} = \\lambda \\cdot \\text{NLI}(T_t, E_i^\\pm) + (1-\\lambda) \\cdot \\text{SigLIP}(I_t, E_i^\\pm) $$\n    *   **Intuition**：这是一个加权评分公式。系统同时看文本（Accessibility Tree, $T_t$）和图片（Screenshot, $I_t$）。\n    *   $\\text{NLI}$ (Natural Language Inference) 判断文本是否蕴含证据。\n    *   $\\text{SigLIP}$ 判断图片是否与证据描述匹配。\n    *   $\\lambda$ 平衡两者的权重。如果得分高，说明证据存在；如果得分低且匹配证伪证据，说明计划可能失效。\n\n3.  **路由决策**：\n    $$ z_t = \\begin{cases} \\text{continue} \u0026 \\text{if score is safe} \\\\ \\text{verify} \u0026 \\text{if score is ambiguous/risky} \\end{cases} $$\n    *   **Intuition**：这是一个“过滤器”。大多数常规操作由快速的轻量级模型处理（continue），只有当情况模糊、高风险或接近阈值时，才调用昂贵的大语言模型（verify）。这保证了效率。\n\n**结论**：没有复杂的数学证明，核心在于将“计划”形式化为可测试的单元，并通过混合测试机制平衡效率与鲁棒性。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有的 Web Agent 在长程任务中容易“脱轨”（Off-track execution），即局部操作看似合理，但整体轨迹已偏离目标，且缺乏显式的机制来检测这种偏离并及时纠正。\n\n**2. 设计了什么实验验证这个问题？**\n*   **主实验 (Main Results)**：在 **WebArena** 基准测试上，将 FCPAgent 与 SOTA 基线（如 ColorBrowserAgent, WebDART, WALT 等）进行对比，评估任务成功率。特别关注长程任务（Long-horizon tasks）的表现。\n*   **零样本泛化 (Zero-Shot Generalization)**：在 **WebChoreArena** 上测试，不使用该数据集的训练数据，验证 FCPAgent 学到的“可证伪承诺”机制是否具有通用性。\n*   **消融实验 (Ablation Study)**：\n    *   移除 **Falsifiable Planning**（只用技能，无显式证据）。\n    *   移除 **Commitment Testing**（不在线测试证据）。\n    *   移除 **Commitment Repair**（检测到错误但不修复）。\n    *   对比 **Hybrid Testing** 与 **Slow-only Testing** 的效率。\n*   **长程鲁棒性分析**：按任务步数（1-5步, 6-10步, 11+步）分组，观察成功率随任务长度增加的变化趋势。\n\n**3. 问题的答案是什么？**\n*   **有效性**：FCPAgent 在 WebArena 上比最强基线（ColorBrowserAgent）平均成功率提高了 **13.8%**，在长程任务上提升尤为显著（例如 GitLab 任务提升 19.1%）。\n*   **泛化性**：在 WebChoreArena 上实现了 **9.6%** 的相对提升，证明该机制不依赖特定数据集的记忆，而是学到了通用的纠错逻辑。\n*   **组件贡献**：消融实验表明，**Falsifiable Planning**（提供测试标准）和 **Commitment Testing**（在线检测）是最关键的组件，移除它们会导致性能大幅下降。\n*   **效率**：混合测试机制在保持高成功率的同时，比纯 LLM 验证减少了约 **19.5%** 的 LLM 调用时间，证明了其工程可行性。\n*   **核心结论**：稳定的长程 Web Agent 不仅需要更好的动作预测，更需要**能够识别自身何时出错**的计划机制。显式的证伪证据和范围感知的修复是解决“脱轨”问题的关键。", "additional_insights": "### § 8 Take-aways\n\nFCPAgent 将长程 Web Agent 的执行范式从“无条件遵循计划”转变为“在线验证可证伪承诺”，通过显式定义每个计划步骤的确认证据（Confirming Evidence）和证伪证据（Falsifying Evidence），解决了传统 Agent 在局部合理但全局偏离（Off-track Execution）时无法及时止损的问题。该方法引入 Falsifiable Commitment Unit (FCU) 作为计划的基本单元，不仅包含子目标和关联技能，还绑定了层级化的证伪条件（执行层、技能层、规划层），使得 Agent 能够在浏览器状态变化时实时检测轨迹漂移。通过混合测试机制（Hybrid Commitment Testing），系统利用轻量级的证据匹配进行高频筛选，仅在完成、风险或模糊状态下调用 LLM 进行诊断验证，从而在保证检测精度的同时显著降低了推理延迟。当检测到承诺被证伪时，Scope-aware Repair 模块根据诊断结果定位最小受影响的范围（如仅修正动作、切换技能或重新规划），避免了因局部错误导致的全局重启，提升了长程任务的鲁棒性。实验表明，FCPAgent 在 WebArena 上相比最强基线实现了 13.8% 的相对提升，且在长程任务（Long-horizon Tasks）上的增益尤为显著，证明了显式有效性接口对于维持长程执行稳定性的关键作用。\n\n### § 9 最脆弱的假设\n\nFCPAgent 最核心的脆弱假设是：**生成的证伪证据（Falsifying Evidence）必须具有足够的特异性和准确性，能够区分“正常的执行变异”与“真正的轨迹漂移”，且不会因过于宽泛导致频繁误报（False Positives）或因过于狭窄导致漏报（False Negatives）。** 如果这一假设不成立，即 LLM 生成的证伪条件无法准确捕捉当前网页状态与任务目标之间的语义偏差，整个“计划-测试-修复”循环将失效：过于宽泛的证伪条件会触发不必要的修复，导致 Agent 陷入反复修正的循环或浪费大量计算资源；过于狭窄的证伪条件则无法检测到隐蔽的漂移，使 Agent 继续沿着错误路径执行直至最终失败。论文通过消融实验（Ablation Study）和人工标注的漂移检测准确率（Drift Detection Accuracy, F1=80.0%）提供了一定证据，表明当前方法能有效识别大部分漂移。然而，论文也承认这是一个局限性，因为证伪证据的质量完全依赖于 Planner LLM 的生成能力，而在复杂多变的真实 Web 环境中，LLM 可能难以穷尽所有潜在的失败模式或准确界定“正常变异”的边界，特别是在面对动态更新或布局剧烈变化的网页时，预定义的证伪条件可能迅速过时或失效。\n\n### § 10 最小复现实验\n\n在 1 周时间内，可以复现并验证 **混合测试机制（Hybrid Commitment Testing）中轻量级证据匹配的有效性及其对 LLM 调用成本的节省**，这是 FCPAgent 效率优势的关键。具体方案如下：\n1.  **数据**：从 WebArena 测试集中选取 50 个长程任务（如 Shopping 或 GitLab 域），使用基线方法（如 ReAct 或 ColorBrowserAgent）生成轨迹，并人工或半自动标注每个步骤的“正常”、“漂移”或“完成”状态。\n2.  **实现**：不实现完整的 FCPAgent 规划与修复模块，仅实现轻量级测试器（Lightweight Tester）。使用论文提到的 nli-deberta-v3-base 模型进行文本蕴含匹配，SigLIP2 进行图像-文本匹配，计算当前观察与预设的确认/证伪证据之间的相似度分数。设定阈值，模拟路由逻辑（即何时调用“慢速”LLM 验证，何时直接继续）。\n3.  **测量**：测量轻量级测试器在 50 个任务轨迹中的路由准确率（Precision/Recall of routing to slow verifier），以及相比每一步都调用 LLM 验证所节省的 LLM 调用次数和预估时间。\n4.  **结果判定**：如果轻量级测试器能以高准确率（如 \u003E85%）识别出需要 LLM 介入的“高风险”或“完成”状态，同时过滤掉大部分常规步骤，且节省的 LLM 调用次数显著（如 \u003E50%），则支持了混合测试机制在效率上的 claim；反之，如果轻量级测试器频繁误报或漏报，导致需要大量 LLM 介入或错过关键漂移，则反驳了该机制在实际部署中的可行性。此实验无需复现复杂的技能库和修复逻辑，聚焦于核心的检测效率假设。", "research_value": "### § 11 最强反例设计\n\n要挑战 FCPAgent 的有效性，最有力的攻击并非质疑其检测机制的准确性，而是攻击其核心假设在**高动态、非结构化 Web 环境**中的**可证伪性（Falsifiability）与完备性（Completeness）**之间的根本矛盾。具体而言，可以设计一个针对“语义漂移但视觉/文本表面一致”的**对抗性场景（Adversarial Scenario）**，证明显式定义的 $E_i^-$ 在复杂长程任务中必然导致**高漏报率（High False Negative Rate）**或**灾难性误报（Catastrophic False Positives）**。\n\n**具体反例设计：动态权限与隐性状态依赖的“静默失败”**\n\n1.  **场景构建**：选择一个涉及多步骤状态依赖的任务，例如“在 Jira 中创建一个 Epic，并关联三个特定标签的子任务，最后将 Epic 状态变更为 'In Progress'”。\n2.  **攻击点：隐性状态（Implicit State）与证据的脱节**：\n    *   FCPAgent 依赖 Planner 生成 $E_i^-$（如“页面未显示 'Create Issue' 按钮”）。然而，在许多现代 Web 应用中，权限错误或前置条件缺失（如未选择项目上下文）并不会导致 UI 元素消失，而是导致**静默失败（Silent Failure）**或**误导性成功（Misleading Success）**。\n    *   *反例操作*：Agent 执行“创建子任务”时，由于未正确关联 Epic ID（一个隐性状态错误），系统实际上创建了一个独立的 Issue，但 UI 反馈完全正常（显示“Success”弹窗，页面跳转至新 Issue 详情页）。\n    *   *FCPAgent 的失效*：\n        *   **确认证据 $E_i^+$**：“页面显示 Issue 创建成功” -\u003E **匹配**。\n        *   **证伪证据 $E_i^-$**：“页面报错”或“未找到创建按钮” -\u003E **不匹配**。\n        *   **结果**：轻量级测试器（Lightweight Tester）判定为 `continue`，LLM 诊断器因缺乏全局上下文（当前 Issue 未关联 Epic）而难以在单步观察中识别出逻辑错误。Agent 继续执行后续步骤，直到最终验证阶段才发现 Epic 下无子任务，此时已无法进行“最小范围修复”，必须全局重规划。\n3.  **理论论证：证据生成的组合爆炸与不完备性**：\n    *   论证指出，对于长视界任务，可能的失败模式（Failure Modes）是组合爆炸的。Planner 无法在规划阶段穷举所有 $E_i^-$。\n    *   如果 $E_i^-$ 过于宽泛（如“任务未完成”），则无法提供早期干预信号；如果过于具体（如“未关联 Epic ID”），则 Planner 需要拥有对后端逻辑的上帝视角，这在通用 Web Agent 中是不现实的。\n    *   **替代解释**：FCPAgent 在 WebArena 上的提升可能并非源于“在线证伪”，而是源于**更细致的技能分解（Finer-grained Skill Decomposition）**和**检索增强（RAG）**带来的先验知识优势。消融实验中移除“Testing”模块导致的性能下降，可能仅仅是因为失去了对 Skill Library 的精细检索引导，而非测试机制本身的功劳。可以通过对比“无测试但同样使用细粒度技能检索”的基线来验证这一替代解释。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“静态证伪”到“动态假设演化”——基于在线信念更新的自适应承诺规划（Adaptive Commitment Planning with Online Belief Updating）**\n\n**(a) 驱动局限与未满足需求**\nFCPAgent 的核心局限在于其**静态性（Static Nature）**：$E_i^+$ 和 $E_i^-$ 在规划阶段一次性生成，并在整个执行过程中保持不变。然而，Web 环境是部分可观测且动态变化的。随着 Agent 的执行，它获得了新的观察信息，这些信息不仅用于验证当前步骤，还应用于**修正对后续步骤有效性的信念（Belief）**。现有的“证伪”是二元且滞后的，缺乏一种机制来量化“当前轨迹与预期轨迹的分布距离”，并在漂移发生前进行**概率性预警（Probabilistic Early Warning）**。此外，FCPAgent 假设 Planner 能预知所有失败模式，这忽略了**未知未知（Unknown Unknowns）**的存在。\n\n**(b) 借鉴相邻领域的方法**\n借鉴**部分可观测马尔可夫决策过程（POMDP）**中的**信念状态更新（Belief State Updating）**和**主动学习（Active Learning）**中的**不确定性采样（Uncertainty Sampling）**。\n*   不再将计划步骤视为固定的“假设”，而是视为一个**概率分布（Probability Distribution）**，表示在给定当前观察下，任务处于正确轨迹的后验概率。\n*   引入**在线元学习（Online Meta-Learning）**或**上下文带臂老虎机（Contextual Bandits）**的思想，让 Agent 在执行过程中动态调整对“证据”的敏感度。例如，如果连续几步的轻量级测试得分处于“模糊”区间，系统应自动提高对后续步骤的验证阈值，或主动执行“探索性动作”（Exploratory Actions）以获取更多信息，而非盲目继续。\n\n**(c) 第一个实验设计**\n*   **方法名称**：**Bayesian Commitment Planning (BCP)**。\n*   **核心机制**：\n    1.  **动态证据权重**：不再使用固定的 $\\lambda$ 和阈值，而是维护一个**信念向量（Belief Vector）**，表示当前状态属于“正常”、“轻微漂移”、“严重漂移”的概率。\n    2.  **在线证据生成**：在每一步执行后，不仅检查 $E_i^\\pm$，还利用 LLM 生成**新的潜在证伪证据**（基于当前观察与预期的差异），并将其加入后续步骤的测试队列。这解决了“未知未知”问题。\n    3.  **主动验证策略**：当信念不确定性（Entropy）超过阈值时，Agent 不直接修复，而是执行一个低成本的“探针动作”（如点击“Help”或检查页面源码中的特定标记）来降低不确定性。\n*   **实验设置**：\n    *   在 **WebArena** 的长程任务子集上，对比 FCPAgent 与 BCP。\n    *   **关键指标**：除了成功率，重点测量**“早期检测时间（Time-to-Detection）”**和**“无效修复次数（Number of Unnecessary Repairs）”**。\n    *   **预期结果**：BCP 应在那些失败模式未被 Planner 预见的任务上表现出显著优势，因为它能在线适应新的异常模式，而 FCPAgent 会因缺乏对应的 $E_i^-$ 而漏检。这将证明从“静态证伪”转向“动态信念管理”是构建鲁棒 Web Agent 的更优范式。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Guangyi Liu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"**\"\n      ]\n    },\n    {\n      \"name\": \"Huan Zhao\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"**\"\n      ]\n    },\n    {\n      \"name\": \"Quanming Yao\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Tsinghua University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Noumena AI\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"**\",\n      \"text\": \"Equal contribution\"\n    },\n    {\n      \"marker\": \"*\",\n      \"text\": \"Corresponding author\"\n    }\n  ]\n}\n```", "summary_translation": "长周期 Web 智能体往往在最终失败前就会偏离轨道：即使当前状态、复用的技能或计划假设已不再支持用户指令，轨迹仍可能在局部上看似合理。现有智能体能够进行规划、反思或复用经验，但其计划很少明确指定在何种证据下应继续信任当前步骤。我们提出了 FCPAgent，一种用于鲁棒长周期 Web 智能体的可证伪承诺规划框架。FCPAgent 将每个计划步骤表示为一个可证伪承诺单元（Falsifiable Commitment Unit, FCU）：一个基于可复用技能的子目标，并附带确证证据、证伪证据以及置信度分数。执行过程组织为“规划-测试-修复”循环。混合承诺测试模块在候选动作修改浏览器之前对其进行检查，并在执行后检查观测结果；为提高效率，该模块将轻量级证据匹配与基于大语言模型（LLM）的诊断验证相结合。当证据证伪某个承诺时，范围感知修复机制将矛盾定位到执行、技能或规划层面，并修正最小且充分的相应部分。在 WebArena 基准测试中，FCPAgent 的平均成功率相比最强基线实现了 13.8% 的相对提升，在长周期任务上增益尤为显著。"}, {"title": "From RLVR to RLSVR: Task Transformation Induces Self-Verifiable Rewards for Open-Ended LLM Self-Improvement", "arxiv_id": "2607.23802", "authors": "Qinsi Wang, Jing Shi, Huazheng Wang, Kun Wan, Yiran Wu, Bo Liu, Qingyun Wu, Hai Helen Li, Yiran Chen, Handong Zhao, Wentian Zhao", "summary": "Reinforcement Learning with Verifiable Rewards (RLVR) has driven recent progress in reasoning-oriented large language models (LLMs) by enabling large-scale optimization. However, its applicability remains largely limited to domains such as mathematics and coding, where correctness can be deterministically verified. Open-ended tasks instead often rely on human preferences, reward models, or LLM-based judges, introducing evaluation bias, judge capability bottlenecks, and additional inference costs.Drawing on the principle of self-supervised learning, which constructs pretext tasks to derive supervision from the data itself, we propose Reinforcement Learning with Self-Verifiable Rewards (RLSVR), a task-transformation-based training paradigm for extending RLVR to open-ended tasks. RLSVR transforms open-ended tasks into verifiable proxy environments whose internal rules and interaction outcomes automatically generate reward signals. We instantiate RLSVR with SpyRL, a multi-agent self-play environment inspired by Who Is the Spy?. Agents receive asymmetric information, complete the same target task, and vote to identify a designated spy. Because the spy identity is predetermined, voting outcomes provide fully verifiable rewards, while successful identification remains closely related to output quality. Experiments on text summarization, creative writing, and mathematical reasoning show that SpyRL outperforms existing self-improvement methods on non-verifiable tasks and yields consistent gains on verifiable reasoning tasks. These results demonstrate that task transformation can extend scalable RLVR-based self-improvement beyond inherently verifiable domains. Models and code have been released at https://github.com/wangqinsi1/SpyRL.", "category": "cs.AI", "cluster": "Planning, Verification \u0026 Self-Correction", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving, Multi-Agent)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=29 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文完全符合“自我演化 (Self-Evolving)”和“LLM智能体”的研究范围，具体依据如下：\n\n1.  核心机制符合“自我演化”与“LLMs Improving LLMs”：\n    论文提出的 RLSVR (Reinforcement Learning with Self-Verifiable Rewards) 是一种训练范式，旨在通过任务转换（Task Transformation）为开放式任务生成可验证的奖励信号，从而实现 LLM 的自我改进 (Self-Improvement)。这直接对应筛选标准中“保留”的第5条：“如果论文的核心机制是 self-evolving / self-improving ... 即使对象是 ... 模型训练，也应优先保留”。\n\n2.  研究对象明确为“多智能体系统 (Multi-Agent Systems)”：\n    论文通过实例化方法 SpyRL，构建了一个多智能体自博弈 (multi-agent self-play) 环境。智能体在不对称信息下进行交互、投票和决策。这属于筛选标准中“保留”的第1条和第2条关注的范畴：研究多智能体系统中的协作/博弈策略，以及通过智能体交互产生的反馈来优化模型。虽然涉及多智能体，但其核心贡献在于利用这种多智能体交互机制来解决“奖励稀疏/不可验证”的问题，从而实现模型的自我演化，而非仅仅讨论拓扑结构或通信协议（排除项）。\n\n3.  符合“Agentic AI”的广义定义：\n    论文中的智能体需要在特定环境（SpyRL）中进行决策、交互和接收反馈，这体现了 Agentic 的行为特征。其最终目标是提升 LLM 在开放式任务（如摘要、创意写作）上的能力，属于通过智能体机制（自博弈、自验证奖励）来增强 LLM 性能的前沿研究。\n\n综上所述，该论文通过多智能体自博弈机制实现了 LLM 在开放式任务上的自我演化与改进，高度契合研究课题中关于“自我演化”和“多智能体协作/博弈策略”的核心目标。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决 **Reinforcement Learning with Verifiable Rewards (RLVR)** 在 **open-ended tasks**（如文本摘要、创意写作）中无法直接应用的核心瓶颈。现有的 RLVR 范式（如用于训练 OpenAI o1 或 DeepSeek-R1 的方法）依赖于确定性的验证器（deterministic verifier），例如代码执行结果或数学答案的正确性，从而提供无偏、低成本且可扩展的监督信号。然而，在缺乏客观标准答案的开放域任务中，输出质量通常由潜在的主观函数 $Q(x, y)$ 定义，无法通过简单的规则进行验证。\n\n这一问题的重要性在于，它限制了 LLM 自我进化（self-improvement）能力的泛化范围。目前，LLM 在推理能力上的巨大进步主要局限于数学和代码等可验证领域，而在需要人类偏好判断的开放域任务中，模型提升往往依赖 **RLHF**、**DPO** 或 **LLM-as-a-Judge**。这些方法引入了显著的评价偏差（evaluation bias）、受限于裁判模型的能力上限（judge capability bottlenecks），并带来了高昂的推理成本。此外，现有的基于自博弈（self-play）的方法（如 R-Zero, Absolute Zero）通常假设任务具有可验证性，通过动态调整难度来生成奖励，这在主观任务中因缺乏明确的“正确”反馈而失效。\n\n解决该问题的价值在于，它提出了一种无需外部裁判或人类标注即可实现开放域任务可扩展自我改进的新范式。通过 **Task Transformation**，将不可验证的质量评估转化为可验证的身份识别问题，RLSVR 使得 LLM 能够在没有人类监督的情况下，利用环境内部规则生成的 **Self-Verifiable Rewards** 进行持续优化。这不仅降低了训练成本，还避免了因依赖单一裁判模型导致的性能天花板，为通用开放域能力的自动化提升提供了可行路径。\n\n### § 2 前人工作与不足\n\n在 RLVR 扩展到开放域任务方面，前人工作主要尝试通过近似手段来替代确定性验证器，但均存在根本性缺陷。\n\n首先，**RLHF** (Ouyang et al., 2022) 及其变体（如 **DPO** (Rafailov et al., 2023)）以及 **RLAIF** (Lee et al., 2023) 依赖人类偏好数据或 AI 反馈来构建奖励模型。这些方法的不足在于：1) 数据获取成本高且难以规模化；2) 奖励模型的质量限制了策略模型的上限，且容易引入系统性偏差；3) 它们本质上是在近似不可验证的目标 $Q$，而非构造可验证的信号，因此无法享受 RLVR 在可验证域中那种“无偏、无限、免费”的监督优势。\n\n其次，**LLM-as-a-Judge** (Zheng et al., 2023) 和 **Rubric-as-Reward** (Gunjal et al., 2025) 方法使用强大的 LLM 或预设规则作为裁判。其核心缺陷在于：1) **Judge Capability Bottleneck**：策略模型的性能被裁判模型的能力所封顶，无法超越裁判；2) **Inference Cost**：每次 rollout 都需要调用昂贵的裁判模型，阻碍了大规模训练；3) **Evaluation Bias**：LLM 裁判存在位置偏差、风格偏好等固有偏见，导致训练信号噪声大。\n\n第三，**Self-Rewarding** 机制 (Yuan et al., 2024) 让模型自己评估自己的输出。这种方法虽然消除了外部裁判，但存在严重的 **Circular Reasoning** 风险，即模型倾向于奖励自己容易生成的内容，而非真正高质量的内容，导致训练不稳定或退化。\n\n最后，最近的 **Proposer-Solver Self-Play** 框架，如 **R-Zero** (Huang et al., 2025) 和 **Absolute Zero** (Zhao et al., 2025)，通过联合进化任务生成器和求解器来实现自我改进。这些方法在数学和代码等可验证任务上表现优异，因为它们依赖求解器的正确性作为奖励信号。然而，在开放域任务中，由于缺乏确定性的“正确”答案，这些方法无法有效区分输出质量的细微差别，导致奖励信号模糊，训练效果显著下降。它们未能解决的核心问题是：如何在没有外部验证器的情况下，从数据本身构造出具有判别力的、确定性的奖励信号。\n\n本文提出的 **RLSVR** 通过借鉴 **Self-Supervised Learning (SSL)** 的思想，构造 **Pretext Tasks**（如 SpyRL 中的身份识别游戏），将开放域任务转化为具有确定性 ground truth（间谍身份）的代理环境。这与上述方法不同，它不近似质量函数，而是通过任务变换构造出可验证的奖励，从而克服了 prior work 在可扩展性、成本和偏差方面的局限。", "core_insight": "### § 3 重建作者的思考路径\n\n现有的 **Reinforcement Learning with Verifiable Rewards (RLVR)** 范式在数学和代码等具有确定性验证器（deterministic verifier）的领域取得了巨大成功，但在文本摘要、创意写作等开放式任务（open-ended tasks）中却面临瓶颈。传统的解决方案如 **RLHF**、**DPO** 或 **LLM-as-a-Judge** 依赖于人类偏好数据或外部模型评分，这不仅引入了评估偏差（evaluation bias）和推理成本，还受限于评判模型的能力上限，无法实现像 RLVR 那样大规模、无偏的自动化优化。\n\n作者观察到，**Self-Supervised Learning (SSL)** 成功的关键在于通过构造 **pretext tasks**（如掩码语言建模），从数据本身自动生成监督信号，从而摆脱了对人工标注的依赖。这启发作者思考：是否可以将 SSL 的“任务转换”思想引入 RLVR？即，不直接近似难以验证的质量函数 $Q(x, y)$，而是将原始任务转换为一个代理环境（proxy environment），在该环境中，奖励信号可以通过环境内部的规则或交互结果自动验证。\n\n为了实现这一目标，需要设计一种机制，使得“输出质量”与“可验证的交互结果”强相关。作者借鉴了社交推理游戏《谁是卧底》（Who Is the Spy?）的机制：通过引入**信息不对称**（information asymmetry），让部分玩家（平民）拥有完整信息，而另一部分玩家（卧底）拥有退化信息。所有玩家执行相同的生成任务，随后通过投票识别卧底。由于卧底身份是环境预设的，投票结果具有确定性可验证性；同时，只有输出质量高、能掩盖信息缺陷的玩家才能避免被识别。这种设计巧妙地将不可验证的“生成质量”转化为可验证的“身份识别”问题，从而在无需外部评判者的情况下，为开放式任务提供了可扩展的、基于规则的奖励信号。\n\n### § 4 核心 Intuition\n\n传统方法试图直接近似开放式任务中难以定义的质量函数，导致依赖有偏的外部评判者。本文的核心直觉是借鉴自监督学习中的“任务转换”思想，通过构建一个信息不对称的多智能体博弈环境，将不可验证的“输出质量”转化为可验证的“身份识别”问题。在这种机制下，高质量的输出能帮助智能体隐藏其信息劣势从而避免被投票出局，使得基于投票结果的确定性奖励能够间接但有效地驱动模型在开放式任务上的自我进化。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法是 **RLSVR (Reinforcement Learning with Self-Verifiable Rewards)**，其具体实现为 **SpyRL**。该方法通过任务转换（Task Transformation），将原本无法直接验证质量（Unverifiable）的开放域任务（如创意写作、摘要生成），转化为一个具有确定性奖励信号的多智能体博弈环境。\n\n**核心 Pipeline 流程如下：**\n\n1.  **环境初始化与信息分配 (Information Allocation)**：\n    *   系统从任务分布中采样一个输入 $x$（例如一段新闻文本或写作提示）。\n    *   随机指定一个玩家为 **Spy**（间谍），其余 $n-1$ 个玩家为 **Civilian**（平民）。\n    *   **Civilian** 接收完整的输入信息 $x$。\n    *   **Spy** 接收经过退化处理的信息 $g(x)$（例如被掩码遮挡的部分文本，或关键信息缺失的提示）。这种信息不对称是产生可验证奖励的关键。\n\n2.  **执行阶段 (Performing Stage)**：\n    *   所有玩家（包括 Spy 和 Civilian）基于各自接收到的观察值 $o_i$，利用策略模型 $\\pi_\\theta^P$ 执行相同的目标任务（如生成摘要或故事）。\n    *   每个玩家生成输出 $y_i$。由于 Spy 信息不全，其输出质量通常低于 Civilian，或者在风格/内容上存在细微差异。\n    *   所有输出 $Y = \\{y_1, ..., y_n\\}$ 被公开。\n\n3.  **检测阶段 (Detection Stage)**：\n    *   每个玩家作为检测器，观察所有公开的输出 $Y$ 以及自己的私有观察 $o_i$。\n    *   玩家利用检测策略 $\\pi_\\phi^D$ 进行推理，投票选出他们认为最可能是 Spy 的玩家编号 $v_i$。\n    *   **奖励计算**：\n        *   **检测奖励 ($R_D$)**：如果玩家 $i$ 投票正确（即 $v_i$ 等于真实的 Spy 索引 $u$），获得奖励 1，否则为 0。这是一个完全可验证的确定性奖励。\n        *   **执行奖励 ($R_P$)**：基于投票结果计算。Spy 获得的奖励与其被投票的次数成反比（被怀疑越多，奖励越低）；Civilian 获得的奖励也与其被误投为 Spy 的次数成反比。这构成了一个零和博弈结构，激励玩家生成高质量且难以被识破的输出。\n\n4.  **交替优化 (Alternating Optimization)**：\n    *   系统交替更新执行策略 $\\pi_\\theta^P$ 和检测策略 $\\pi_\\phi^D$。\n    *   当检测器变得太强（容易识别 Spy）时，重点优化执行器，使其生成更高质量、更具迷惑性的内容；当执行器变得太强时，重点优化检测器，提高其鉴别能力。这种动态平衡推动了模型能力的持续提升。\n\n**真实例子讲解：文本摘要任务**\n\n*   **输入**：一篇关于“军队结构改革”的长报告。\n*   **处理**：\n    *   **分配**：玩家 A, B, C, D 是 Civilian，玩家 E 是 Spy。\n    *   **观察**：A-D 看到完整报告；E 看到报告中关于“后勤部门”的关键段落被掩码（xxx）。\n    *   **执行**：A-D 生成包含后勤细节的完整摘要；E 生成一份遗漏后勤细节或逻辑稍显薄弱的摘要。\n    *   **检测**：所有玩家阅读这 5 份摘要。A-D 发现 E 的摘要缺少关键信息或与其他人的摘要在细节上不一致，因此投票给 E。\n*   **输出与奖励**：\n    *   如果 A 投票给 E（正确），A 获得检测奖励 +1。\n    *   E 因为被多人投票，获得较低的执行奖励（负向激励，迫使其下次即使信息不全也要努力模仿完整摘要，或者在信息完整时生成更完美的摘要以避免被怀疑）。\n    *   模型通过梯度下降更新参数，使得 Spy 在信息缺失时也能生成看似合理的摘要，而 Civilian 生成更精准、更具区分度的摘要。\n\n### § 6 核心数学推导\n\n这篇论文的核心数学贡献在于构建了 **Self-Verifiable Reward** 的形式化定义，并设计了基于群体相对优势（Group-based Advantage）的优化目标。\n\n**1. 任务转换与自验证奖励 (Task Transformation \u0026 Self-Verifiable Reward)**\n\n传统 RLVR 的优化目标为：\n$$ \\max_{\\theta} \\mathbb{E}_{x \\sim D, y \\sim \\pi_\\theta(\\cdot|x)} [V(x, y)] $$\n其中 $V$ 是确定性验证器。对于开放域任务，$V$ 不存在。\n\nRLSVR 引入任务转换 $\\Phi$，将原始任务 $(D, \\tau)$ 映射到代理环境 $E$。环境采样潜在变量 $z$（如 Spy 的身份 $u$）。\n*   **检测奖励**：$r_i^D = \\mathbb{I}[v_i = u]$。这是一个指示函数，完全由环境预设的 $u$ 决定，因此是 **Self-Verifiable** 的。\n*   **执行奖励**：\n    $$ r_u^P = -\\beta (m_u - \\bar{m}_c) $$\n    $$ r_j^P = \\frac{\\beta}{|C|} (m_u - \\bar{m}_c) - \\lambda (m_j - \\bar{m}_c), \\quad \\forall j \\in C $$\n    其中 $m_u$ 是 Spy 收到的票数，$m_j$ 是 Civilian $j$ 收到的票数，$\\bar{m}_c$ 是 Civilian 的平均票数。$\\beta$ 和 $\\lambda$ 是超参数。\n    *   **Intuition**：这个公式确保了 Spy 和 Civilian 之间的零和约束（Zero-sum Constraint）。Spy 被怀疑越多（$m_u$ 大），奖励越低；Civilian 被误怀疑越多（$m_j$ 大），奖励越低。这迫使模型在“生成高质量内容”和“避免被识别为异常”之间寻找平衡，从而间接优化了任务质量。\n\n**2. 群体相对优势估计 (Group-based Advantage Estimation)**\n\n为了降低方差并避免使用额外的 Critic 网络，SpyRL 采用类似 GRPO 的组内归一化优势估计。\n对于检测阶段，第 $i$ 个检测器的优势 $A_i^D$ 计算为：\n$$ A_i^D = \\frac{r_i^D - \\mu_D}{\\sigma_D + \\epsilon} + \\mu_D $$\n其中 $\\mu_D$ 和 $\\sigma_D$ 是当前批次中所有 $n$ 个检测器奖励的均值和标准差。\n*   **Intuition**：这种归一化使得奖励信号是相对的。即使绝对奖励值波动，模型也能根据自己在组内的相对表现（比其他人好还是差）来更新策略。这增强了训练的稳定性，特别是在多智能体博弈中。\n\n**3. 策略优化目标 (Policy Optimization Objective)**\n\n执行策略 $\\pi_\\theta^P$ 的更新目标为：\n$$ \\mathcal{L}(\\theta) = \\mathbb{E} \\left[ \\min \\left( \\rho_k^P A_k^P, \\text{clip}(\\rho_k^P, 1-\\epsilon, 1+\\epsilon) A_k^P \\right) - \\beta_{KL} D_{KL}(\\pi_\\theta || \\pi_{ref}) \\right] $$\n其中 $A_k^P$ 是通过 **Role-Advantage Estimation (RAE)** 校准后的优势，用于消除 Spy 和 Civilian 因信息不对称导致的基线偏差。\n*   **Intuition**：标准的 PPO/GRPO 损失函数，加上 KL 散度惩罚以防止策略偏离参考模型太远。RAE 的引入是关键，它确保梯度更新反映的是“相对于同角色平均水平的表现”，而不是被角色固有的难度差异所混淆。\n\n### § 7 实验设计与结论\n\n**1. 验证 RLSVR 能否将不可验证任务转化为可验证信号？**\n*   **问题**：SpyRL 产生的基于投票的奖励是否真的与任务输出质量相关？\n*   **实验**：在摘要和创意写作任务中，记录每个玩家收到的怀疑票数，并使用 GPT-4o 对输出质量进行独立排名。分析票数与质量排名之间的相关性。\n*   **答案**：实验显示，收到更多怀疑票数的玩家，其输出质量排名显著更低（Figure 4）。这证明了 SpyRL 的奖励信号与真实任务质量高度对齐，无需外部验证器即可提供有效的训练信号。\n\n**2. 验证 SpyRL 在不可验证任务上的有效性？**\n*   **问题**：SpyRL 是否能显著提升开放域任务（摘要、创意写作）的性能，优于现有的自进化方法（如 R-Zero, Absolute Zero）？\n*   **实验**：在 GovReport, Multi_News, WritingPrompts 等基准上，对比 Qwen3 基线模型、R-Zero、Absolute Zero 和 SpyRL 的表现。使用 ROUGE 分数和 GPT-4o A/B 测试胜率进行评估。\n*   **答案**：SpyRL 在摘要任务中 ROUGE 分数提升约 4-5 点，A/B 测试胜率超过 75%；在创意写作中，A/B 测试胜率超过 80%，显著优于基线和其他自进化方法（Table 1, Table 2）。这表明 SpyRL 能有效解决开放域任务的优化难题。\n\n**3. 验证 SpyRL 在可验证任务上的泛化能力？**\n*   **问题**：SpyRL 是否会在数学推理等已有验证器的任务上退步或表现不佳？\n*   **实验**：在 GSM8K, Math500, AIME 等数学基准上测试 SpyRL 训练后的模型。\n*   **答案**：SpyRL 在数学任务上也取得了显著提升（例如 Qwen3-4B 在 Math500 上从 68.2% 提升到 79.5%），且优于 R-Zero 和 Absolute Zero（Table 3）。这说明 SpyRL 的机制不仅适用于不可验证任务，也能通过增强推理的严谨性和完整性，提升可验证任务的性能。\n\n**4. 验证模块必要性与超参数敏感性？**\n*   **问题**：交替优化、Spy 机制、群体大小对性能有何影响？\n*   **实验**：进行消融实验，分别移除 Spy 机制、仅训练执行阶段或检测阶段、改变玩家数量 $n$。\n*   **答案**：\n    *   交替优化至关重要，联合训练会导致性能崩溃（Table 10）。\n    *   移除 Spy 机制会导致性能停滞，证明信息不对称是驱动进化的关键。\n    *   玩家数量 $n=5$ 时性能最佳，增加至 6 或 8 收益递减（Figure 5）。\n\n**结论**：SpyRL 通过任务转换和信息不对称博弈，成功将开放域任务的不可验证质量目标转化为可验证的身份识别问题，实现了无需人类标注或外部奖励模型的规模化自我改进，且在多种任务上均优于现有 SOTA 方法。", "additional_insights": "### § 8 Take-aways\n\nRLSVR 的核心创新在于将自监督学习中的“预训练任务（pretext task）”思想引入强化学习，通过任务变换（task transformation）将原本不可验证的开放域任务转化为具有确定性奖励的代理环境。SpyRL 作为 RLSVR 的具体实例，利用信息不对称的多人自博弈机制，将输出质量评估转化为可验证的身份识别问题，从而消除了对昂贵外部裁判或奖励模型的依赖。实验表明，这种基于投票结果的规则化奖励信号与人类及 LLM 对输出质量的判断高度相关，证明了“可验证性”可以通过环境设计而非任务固有属性来构建。SpyRL 在文本摘要、创意写作等主观任务上显著优于现有的自进化方法（如 R-Zero 和 Absolute Zero），同时在数学推理等客观任务上也保持了性能增益，展示了其广泛的适用性。该方法通过交替优化执行阶段（Performing Stage）和检测阶段（Detection Stage），有效避免了传统自博弈中常见的策略停滞和奖励扭曲问题，实现了模型能力的持续协同进化。\n\n### § 9 最脆弱的假设\n\n该方法最关键的假设是：**在信息不对称的博弈环境中，代理对“间谍”身份的投票结果能够准确反映生成内容的质量差异，即“被怀疑程度”与“输出质量”之间存在稳定的负相关关系。** 如果这一假设不成立，例如当所有代理都生成高质量但风格迥异的内容，或者当“平民”代理因过度拟合提示词而生成僵化内容导致“间谍”的通用高质量内容反而更受欢迎时，投票机制将失效，奖励信号将变得噪声化甚至反向引导。论文通过 Figure 4 提供了初步证据，显示在 WritingPrompts 和 GovReport 任务中，接收到的怀疑票数与 GPT-4o 排名的相关性较强，但这仅验证了特定模型和特定任务下的现象，缺乏对更广泛分布或对抗性更强场景下的鲁棒性分析。此外，论文未充分探讨当模型能力极强、能够完美模仿平民风格时，检测阶段是否会导致奖励信号饱和，从而失去区分度，这是该方法在长期训练中可能面临的最大风险。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 SpyRL 的核心奖励机制验证其有效性，无需训练完整模型。具体方案如下：使用 Qwen3-4B 作为基础模型，选取 100 个创意写作提示词（WritingPrompts）。对于每个提示词，生成 5 个输出：4 个基于完整提示词（平民），1 个基于部分掩码提示词（间谍，模拟信息缺失）。然后，使用另一个独立的 LLM（如 GPT-4o 或 Qwen3-8B）作为“检测器”，输入这 5 个输出及完整提示词，要求其投票选出最可能是间谍的输出。同时，使用 GPT-4o 对这 5 个输出进行质量排名。最后，计算“间谍”被投票选中的频率与其实际质量排名之间的相关性。如果间谍（通常因信息缺失导致质量较低）被高频选中，且被选中的输出在质量排名中普遍靠后，则支持 SpyRL 的核心 claim；反之，如果高质量输出常被误判为间谍，或低质量输出未被识别，则表明该奖励机制在当前设置下不可靠。此实验仅需推理调用，无需梯度更新，可快速验证奖励信号的有效性。", "research_value": "### § 11 最强反例设计\n\n若要挑战 **RLSVR** 的核心有效性，最有力的攻击并非质疑其数学推导，而是攻击其核心假设：**“信息不对称导致的输出差异（即 Spy 的劣势）与‘低质量’在语义空间上是同构的，且这种差异能被其他代理稳定地识别为‘异常’而非‘多样性’。”** 这一假设在高度主观或风格驱动的任务中极易崩溃。\n\n**具体反例场景：创意写作中的“风格漂移”与“平庸陷阱”**\n\n1.  **替代解释：多样性被误判为错误（False Positive on Diversity）**\n    在 **Creative Writing** 任务中，高质量往往意味着独特的视角、新颖的隐喻或非线性的叙事结构。假设 **Civilian** 代理基于完整提示词生成了四种截然不同但均高质量的风格（如：意识流、硬汉派、诗意现实主义、黑色幽默）。而 **Spy** 代理由于信息缺失（例如缺失了关于“主角性格”的关键描述），被迫生成一个基于通用先验的、平庸但逻辑自洽的“平均化”故事。\n    *   **攻击点**：在这种情况下，**Spy** 的输出可能因为缺乏极端特征而显得“安全”或“常规”，而 **Civilian** 中某个极具创新性但偏离常规预期的输出（例如使用了非常规的叙事视角）反而会被其他代理视为“异常”或“幻觉”，从而被投票为 Spy。\n    *   **后果**：奖励信号将反向引导模型。模型为了不被投票为 Spy，会倾向于抑制创造性，收敛到一种“最大公约数”式的平庸风格（Mode Collapse towards Mediocrity）。此时，**Self-Verifiable Reward** 不再反映质量，而是反映“符合群体平均预期的程度”。这将导致模型在 **A/B Testing** 中虽然胜率看似提升（因为裁判模型也偏好连贯性），但在人类评估中会被认为缺乏灵气和深度。\n\n2.  **理论论证：纳什均衡下的“伪装最优”而非“质量最优”**\n    从博弈论角度分析，**SpyRL** 的均衡状态并非“所有代理生成最高质量内容”，而是“Spy 完美模仿 Civilian 的分布，且 Civilian 无法区分 Spy”。\n    *   **攻击点**：如果 **Spy** 代理学会了通过“模糊化”或“通用化”输出来掩盖信息缺失（例如，在摘要任务中，Spy 生成一份极其简短、只包含最高频词汇的摘要，从而避免暴露细节缺失），而 **Civilian** 代理为了不被误判，也开始模仿这种模糊风格。\n    *   **后果**：系统会收敛到一个低信息量的纳什均衡。此时，**Detection Reward** 饱和（投票随机化，准确率接近 1/n），**Performance Reward** 失去区分度。模型不再优化内容的丰富度和准确性，而是优化“不可区分性”。这在数学上表现为梯度消失，导致训练停滞在低质量均衡点，而非高质量均衡点。\n\n3.  **真实世界场景：多模态或代码生成中的“语法正确但语义错误”**\n    在 **Code Generation** 中，如果 **Spy** 缺失了部分函数签名，它可能生成一个语法完全正确但调用错误函数的代码。如果 **Civilian** 生成的代码虽然正确但使用了罕见的库或复杂的结构，**Spy** 的简单错误代码可能因为“看起来更像标准模板”而被误认为是 Civilian。更极端地，如果任务涉及 **Hallucination** 检测，**Spy** 可能因为信息不足而拒绝回答（Safe Refusal），这在某些评估标准下被视为“高质量”（避免幻觉），从而获得高奖励，尽管它并未完成任务。这证明了 **Self-Verifiable Reward** 与 **Task Completion** 之间的解耦风险。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“身份识别”到“共识构建”——基于多智能体辩论的相对质量排序强化学习 (RL with Consensus-Based Relative Rewards, RL-CRR)**\n\n**(a) 驱动局限与未满足需求**\n**RLSVR/SpyRL** 的根本局限在于其奖励信号依赖于“异常检测”（Anomaly Detection），即假设 Spy 是“坏”的，Civilian 是“好”的。这种二元对立无法处理“所有输出都有缺陷”或“所有输出都很优秀但侧重点不同”的情况。此外，它无法区分“高质量的错误”和“低质量的正确”。我们需要一种机制，不依赖于预设的“间谍”角色，而是通过代理间的交互，动态构建一个关于“什么是好”的局部共识，并从中提取相对质量信号。\n\n**(b) 借鉴相邻领域的方法**\n借鉴 **Multi-Agent Debate** (Lian et al., 2023) 和 **Preference Learning from Pairwise Comparisons** (Bradley-Terry Model) 的思想，但将其嵌入到强化学习的闭环中。不同于现有的 **RLHF** 依赖静态偏好数据，我们提出 **Dynamic Consensus Reward**：让多个代理对同一组输出进行多轮辩论和投票，最终形成的“共识分布”作为奖励信号。关键在于，我们不预设谁是 Spy，而是让代理通过辩论揭示输出的内在矛盾或优势。\n\n**(c) 第一个实验设计**\n\n1.  **环境设置**：给定一个开放域任务（如法律案例摘要），采样 $N$ 个代理（均为同一模型的不同实例或不同初始化）。所有代理接收相同的完整输入 $x$。\n2.  **生成阶段**：每个代理生成输出 $y_i$。\n3.  **辩论与共识阶段**：\n    *   所有输出 $Y = \\{y_1, ..., y_N\\}$ 公开。\n    *   代理进入多轮辩论（Debate Rounds）。每轮中，代理可以引用其他输出的片段，论证其优劣。\n    *   辩论结束后，每个代理对所有输出进行排序（Ranking），而非简单的二元投票。\n4.  **奖励计算**：\n    *   计算所有代理排序的 **Kendall Tau 一致性系数**。\n    *   对于输出 $y_i$，其奖励 $R_i$ 定义为：其在所有代理排序中的平均排名，加权以该排名的共识强度（即其他代理是否也同意这个排名）。\n    *   **关键创新**：引入 **Dissent Bonus**。如果某个输出 $y_i$ 排名较低，但有一个代理强烈辩护其独特价值（且该辩护逻辑自洽），则给予 $y_i$ 一定的探索奖励，以防止模式崩溃。\n5.  **优化目标**：使用 **PPO** 更新策略，最大化 $R_i$。\n6.  **验证**：对比 **SpyRL** 和 **RL-CRR** 在 **Legal Summarization** 和 **Scientific Abstract Generation** 上的表现。重点评估：\n    *   **多样性-质量权衡**：使用 **BERTScore** 和 **Human Evaluation** 检查模型是否保留了多样化的正确观点，而非收敛到单一平庸答案。\n    *   **鲁棒性**：在输入包含噪声或歧义时，**RL-CRR** 是否能通过辩论发现并纠正错误，而 **SpyRL** 是否会因无法识别“谁是 Spy”而失效。\n\n**与已有工作的区别**：\n*   不同于 **SpyRL** 的“零和博弈”和“身份识别”，**RL-CRR** 是“非零和”的，旨在构建“质量共识”。\n*   不同于 **RLHF** 的静态偏好，**RL-CRR** 的奖励是动态生成的，且依赖于代理间的交互过程（Debate），而非仅依赖最终输出。\n*   不同于 **Self-Rewarding** 的循环推理，**RL-CRR** 通过多代理的独立视角和辩论机制，引入了外部性（Exogeneity），打破了单一模型的自我偏见。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Qinsi Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jing Shi\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Huazheng Wang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Kun Wan\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yiran Wu\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Bo Liu\", \"affiliations\": [5], \"markers\": []},\n    {\"name\": \"Qingyun Wu\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Hai Helen Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yiran Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Handong Zhao\", \"affiliations\": [2], \"markers\": [\"†\"]},\n    {\"name\": \"Wentian Zhao\", \"affiliations\": [6], \"markers\": [\"†\", \"‡\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Duke University\"},\n    {\"id\": 2, \"name\": \"Adobe Inc.\"},\n    {\"id\": 3, \"name\": \"Oregon State University\"},\n    {\"id\": 4, \"name\": \"Pennsylvania State University\"},\n    {\"id\": 5, \"name\": \"National University of Singapore\"},\n    {\"id\": 6, \"name\": \"Amazon\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"†\", \"text\": \"Co-advisors.\"},\n    {\"marker\": \"‡\", \"text\": \"Work done at Adobe.\"}\n  ]\n}\n```", "summary_translation": "Reinforcement Learning with Verifiable Rewards (RLVR) 通过实现大规模优化，推动了近期面向推理的大型语言模型 (LLMs) 的进展。然而，其适用性仍主要局限于数学和编程等可以确定性验证正确性的领域。开放式任务则通常依赖人类偏好、奖励模型或基于 LLM 的评判者，这引入了评估偏差、评判者能力瓶颈以及额外的推理成本。借鉴自监督学习从数据本身构建 pretext tasks 以推导监督信号的原则，我们提出了 Reinforcement Learning with Self-Verifiable Rewards (RLSVR)，这是一种基于任务转换的训练范式，旨在将 RLVR 扩展至开放式任务。RLSVR 将开放式任务转换为可验证的代理环境，其内部规则和交互结果自动生成奖励信号。我们利用 SpyRL 实例化了 RLSVR，这是一个受《谁是卧底》启发的多智能体自对弈环境。智能体接收非对称信息，完成相同的目标任务，并投票识别指定的卧底。由于卧底身份是预先确定的，投票结果提供了完全可验证的奖励，而成功识别仍与输出质量密切相关。在文本摘要、创意写作和数学推理上的实验表明，SpyRL 在非可验证任务上优于现有的自我改进方法，并在可验证推理任务上带来了一致的增益。这些结果表明，任务转换可以将可扩展的基于 RLVR 的自我改进扩展到本质上可验证的领域之外。模型和代码已发布在 https://github.com/wangqinsi1/SpyRL。"}, {"title": "SeekJudge: A Practical Reward Framework for Reinforcement Learning in Computer-Use Agents", "arxiv_id": "2607.23263", "authors": "Yang Wan, Zhenhao Zhang, Jierui Wang, Linchao Zhu", "summary": "Deciding whether a trajectory actually fulfills its instruction governs how we measure computer-use agents on long-horizon graphical-user-interface tasks and how we train them with reinforcement learning. This judgment has long relied on rule-based evaluation, which struggles to align with human intention and goes stale when an app updates or its online content drifts. Existing model-based judges attempt to address these problems but still leave a performance gap to the rule-based evaluation. We propose the \\textbf{SeekJudge} framework, in which four role-specialized agents, a Condense, a Ground, a Seek and an Analyze agent, reach a verdict through a Seek--Analyze loop over the trajectory. A seed-calibrated distillation pipeline trains one specialized $9$B model to serve as the shared backbone for all four agents. Measured by downstream success rate on held-out RL test goals, SeekJudge is the first practical model-based reward to match or surpass native rule-based supervision in online RL. Beyond accuracy, SeekJudge provides step-level judgments, runs far cheaper than a closed-source large model, and keeps a small per-call context that scales to much longer trajectories. We further contribute a general architectural improvement to the reward server that speeds up judging in RL. Together these make model-based reward a practical drop-in for rule-based supervision in CUA reinforcement learning.", "category": "cs.AI", "cluster": "Planning, Verification \u0026 Self-Correction", "tags": ["cs.AI"], "filter_reason": "该论文符合研究范围，核心依据如下：\n\n1.  研究对象明确为 LLM 智能体 (LLM Agents)：论文针对的是 \"Computer-Use Agents\" (CUA)，即基于 GUI 操作的智能体，属于典型的 Agentic AI 范畴（方向1：单智能体/工具使用）。\n2.  核心贡献涉及智能体的训练与演化机制 (Training/Evolution)：论文提出的 SeekJudge 框架是一个用于强化学习 (RL) 的奖励模型 (Reward Framework)。在 Agentic AI 研究中，设计有效的奖励函数或评估机制是训练智能体（特别是通过 RL 进行自我改进或策略优化）的关键环节。论文明确指出该框架用于 \"train them with reinforcement learning\"，并解决了长horizon 任务中的评估难题，这直接服务于智能体的能力构建和改进。\n3.  符合“保留”标准中的训练/评估类论文：根据筛选标准，“如果论文研究 agent training/distillation/RL... 并且标题或摘要明确指向 Agentic / LLM Agents... 应保留”。虽然论文侧重于奖励模型（Judge），但其目的是为了解决智能体训练中的核心痛点（奖励稀疏、规则僵化），且最终目标是提升智能体的下游成功率，属于智能体系统闭环中不可或缺的一部分。\n4.  排除项不适用：\n       它不是单纯的基础设施优化，而是针对智能体行为评估的算法改进。\n       它不涉及被排除的“多智能体拓扑/通信协议”问题，虽然内部有四个角色代理，但它们是作为一个统一的奖励判定模块（Scaffold/Harness 的一部分）协同工作，而非研究多智能体间的社会交互或博弈。\n       它不涉及被排除的安全、对齐、幻觉或图神经网络等主题。\n\n综上，该论文通过改进奖励机制来促进 Computer-Use Agents 的强化学习训练，属于构建和改进 LLM 智能体的前沿研究，故判定为 True。", "intro_logic": "### § 1 研究问题与重要性\n\n论文旨在解决 Computer-Use Agents (CUAs) 在长视界图形用户界面任务中，如何准确、高效地评估 Agent 轨迹是否真正完成了指令这一核心问题。这一判断不仅决定了 Agent 的离线评测标准，更直接作为 Reward Model 驱动下游的 Reinforcement Learning (RL) 或 Rejection Fine-tuning。该问题的重要性在于，现有的主流评估方法主要依赖 Rule-based Evaluation，这种方法存在三个致命缺陷：首先，规则难以与人类意图对齐，无法枚举所有满足目标的自洽答案，尤其在开放式任务中完全失效；其次，规则依赖于特定应用的内部状态解析器（如 DOM 或 Accessibility Tree），导致其覆盖范围狭窄且极易因应用版本更新或在线内容漂移而失效（Stale）；最后，维护这些规则的成本极高，限制了其在动态在线环境中的适用性。\n\n尽管 Model-based Evaluation 被视为替代方案，但现有框架尚未成为主流，主要瓶颈在于它们未能平衡精度、成本和延迟。解决这一问题具有显著价值：SeekJudge 框架通过解耦 Localization 和 Extraction，首次实现了 Model-based Reward 在在线 RL 中的下游测试成功率匹配甚至超越原生 Rule-based Supervision。此外，它提供了细粒度的 Step-level Judgments，支持更长的轨迹评估，且推理成本仅为闭源大模型的几百分之一，使得基于模型的奖励成为 Rule-based 监督在实际 RL 训练中的可行替代品（Drop-in replacement），从而将 CUA 的强化学习扩展到规则无法覆盖的复杂动态环境中。\n\n### § 2 前人工作与不足\n\n该问题此前主要通过 Rule-based Verifiers 和部分 Model-based Judges 进行尝试，但均存在显著不足。Rule-based 方法（如 OSWorld, WebArena 中的评估器）虽然稳定，但如前所述，其泛化性差、维护成本高且易过时。在 Model-based 方面，最相关的 Prior Methods 包括 CUAJudge, OS-Themis, WebJudge, OpenWebRL-Judge 和 PRO-CUA。\n\nCUAJudge 和 OS-Themis 等框架试图通过多智能体或多图像输入来评估轨迹，但它们的核心弱点在于“稀释决定性证据”（Dilute the decisive evidence）。这些方法通常将大量截图和观察结果一次性输入到单个 Forward Pass 中，而实际上只有少量高保真片段决定最终判决。这种设计导致模型容易在次要细节上产生幻觉，或过度信任 Agent 的自我报告，且随着图像数量增加，性能显著下降（如图 2(b) 和 4.5 节所示）。此外，OS-Themis 依赖昂贵的闭源大模型和巨大的 Context Window，导致计算成本高昂且延迟高，难以在 RL 循环中实时使用。\n\nWebJudge 和 OpenWebRL-Judge 虽然在离线人类一致性或特定 Web 任务上表现良好，但 WebJudge 仅作为离线评估器，未与 Rule-based Supervision 在在线 RL 中进行头对头比较；OpenWebRL-Judge 虽在 Web Agent RL 中匹配了 GPT-4.1 的监督，但其对照组是另一个模型 Judge，且局限于 Web 环境和 Trajectory-level 评估，缺乏 Step-level 的细粒度反馈。PRO-CUA 报告了 Step-level 奖励优于规则基线，但其规则基线仅匹配 Golden Reference Actions 而非检查执行状态，且其成功指标本身由 GPT-5 Judge 评分，导致比较存在循环论证（Circular comparison）。\n\n根本而言，现有 Model-based Judges 未能被广泛采用的原因是它们没有解决“多图像信息噪声”（Multi-Image Information Noise）问题，即在一个 Forward Pass 中堆叠更多图像会干扰对关键证据的提取，同时缺乏对 RL 训练所需的低延迟、低成本和细粒度 Step-level 信号的支持。SeekJudge 通过引入 Seek-Analyze Loop，将 Localization（通过 Condense 和 Ground Agent 压缩时间线）与 Extraction（通过 Analyze Agent 单次读取单张图像）解耦，从而克服了上述限制。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Computer-Use Agents (CUAs) 的强化学习（RL）训练中，Reward Model 的准确性直接决定了 Agent 的上限。长期以来，Rule-based evaluation 是主流，但它存在明显的局限性：规则难以覆盖所有符合人类意图的解（如开放性任务），且极易因软件版本更新或在线内容漂移而失效。这促使研究者转向 Model-based evaluation。然而，现有的 Model-based judges（如 CUAJudge, OS-Themis）虽然试图解决规则僵化的问题，但在实际 RL 应用中表现不佳，往往无法超越 Rule-based baseline。\n\n深入分析现有 Model-based judges 的失败模式，可以发现一个核心矛盾：**信息稀释（Information Dilution）**。现有的方法通常采用“单轮多图”（single multi-image forward pass）的策略，即将整个轨迹的所有截图一次性输入给 VLM。直觉上，更多的上下文应该有助于判断，但实验观察（Figure 2b）显示，随着输入图像数量的增加，即使关键截图始终存在，模型的判断准确率（F1）反而下降。这是因为 VLM 在处理长上下文时，关键证据被大量无关或静态的帧淹没，导致模型产生幻觉或过度信任 Agent 的自我报告。\n\n此外，RL 训练对 Reward Model 的延迟和成本极其敏感。现有的多 Agent 框架（如 OS-Themis）依赖昂贵的闭源大模型，且串行处理导致高延迟，无法在 RL 循环中实时提供反馈。同时，长轨迹（Long-horizon）任务日益普遍，单轮处理的 Context Window 限制使得现有方法难以扩展。\n\n基于以上观察，作者意识到必须将“判断”这一黑盒过程解耦。人类判断一个任务是否完成，并非一次性扫描所有截图，而是先**定位（Localization）**关键步骤，再**提取（Extraction）**关键细节。因此，理想的 Reward Framework 应该模拟这一过程：通过轻量级的文本摘要进行全局定位，识别出包含决定性证据的截图 ID；然后针对该特定截图进行高精度的细节提取。这种“先定位、后提取”的解耦设计，既能避免多图像上下文干扰，又能通过按需调用（On-demand）降低计算成本，从而在保持高精度的同时，实现 RL 训练所需的低延迟和高扩展性。\n\n### § 4 核心 Intuition\n\n现有 Model-based judges 失败的核心原因在于**多图像上下文干扰**：将整段轨迹的所有截图一次性输入模型，会导致关键证据被大量无关视觉信息稀释，从而降低判断准确率。SeekJudge 的核心直觉是将判断过程解耦为**定位（Localization）**与**提取（Extraction）**两个阶段：首先通过轻量级的文本摘要快速定位包含决定性证据的关键截图，然后仅针对该单张截图进行高精度分析。这种“按需查看”的机制不仅消除了多图像间的噪声干扰，还显著降低了每次调用的 Context 大小和计算成本，使得模型能够以极低的延迟和成本，在长轨迹 RL 训练中提供比 Rule-based 更准确、更细粒度的奖励信号。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**SeekJudge** 的核心方法是将长轨迹（Long Trajectory）的评估问题分解为两个子任务：**Localization**（定位包含决定性证据的图像）和 **Extraction**（从该图像中高精度地提取细节）。它摒弃了传统方法将所有截图一次性输入模型的做法，转而采用一个由四个角色专业化 Agent 组成的框架，共享同一个 9B 参数量的骨干模型（Backbone Model）。\n\n**Pipeline 详解（以“在 Victoria Falls 预订酒店”为例）：**\n\n1.  **输入（Input）：**\n    *   **指令（Instruction）：** “Book a hotel in Victoria Falls”。\n    *   **轨迹（Trajectory）：** 包含一系列截图（Screenshots）、动作（Actions，如点击坐标）和状态转换的长序列。\n\n2.  **预处理阶段（Early Processing）：**\n    *   **Condense Agent（压缩代理）：** 遍历轨迹中的每一对前后截图，生成简短的状态转换描述（Transition Entry, T）。例如：“Switched to a booking confirmation page”。这一步将视觉信息压缩为紧凑的文本时间线（Text Timeline）。\n    *   **Ground Agent（接地代理）：** 读取动作后的截图和原始动作（如 `click 128, 453`），识别该坐标实际点击的 UI 元素，生成接地动作描述（Grounded-action Entry, A）。例如：“Click 'Reserve' button at booking bar”。\n    *   **结果：** 生成一个包含 T 和 A 的紧凑文本时间线，作为后续推理的初始上下文。\n\n3.  **核心推理循环（Seek–Analyze Loop）：**\n    *   **Seek Agent（搜索代理，控制器）：**\n        *   读取上述时间线，判断当前证据是否足以判定任务是否完成。\n        *   **情况 A（证据不足）：** Seek Agent 发现时间线中提到“确认页面”，但不确定地点是否为 Victoria Falls。它决定发起一次查询，指定需要检查的截图 ID（例如 Obs 29）和一个具体问题：“What location is this showing?”。\n        *   **情况 B（证据充足）：** 如果证据确凿，直接输出最终判决。\n    *   **Analyze Agent（分析代理，执行器）：**\n        *   接收 Seek Agent 指定的单张截图和问题。\n        *   **无状态处理：** 仅关注这一张图，进行高精度的视觉理解。\n        *   **输出：** 返回文本答案，例如：“Hotel in Albuquerque New Mexico”。\n    *   **迭代：** Seek Agent 将 Analyze Agent 的回答追加到上下文中，重新评估。发现地点不符（Albuquerque vs Victoria Falls），判定为失败或需要进一步探索。\n\n4.  **输出（Output）：**\n    *   **轨迹级判决（Trajectory-level Verdict）：** 基于七个维度（如完成度、可靠性等）打分，并通过回归模型映射为标量奖励（Scalar Reward）或二元标签（True/False）。\n    *   **步骤级标签（Step-level Labels）：** 对轨迹中的每一步赋予九类细粒度标签（如 `milestone`, `correct_decision`, `error` 等），用于提供细粒度的强化学习信号。\n\n5.  **工程优化（Engineering Optimization）：**\n    *   **Rollout-Overlapped Server：** Condense 和 Ground 的计算在环境执行动作的空闲 GPU 时间片内异步完成，不阻塞训练。\n    *   **Zero-Client-State：** 客户端无需维护状态，只需流式发送截图和动作，服务器负责重排序和调度。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**说明：** 本文主要侧重于系统架构设计、数据构建流程及工程实现，**没有提出新的核心数学理论或复杂的推导公式**。其核心贡献在于通过多 Agent 协作机制解决视觉信息稀释问题，并通过蒸馏（Distillation）和校准（Calibration）将模型输出转化为强化学习可用的奖励信号。\n\n*   **奖励映射逻辑（非推导，仅为映射规则）：**\n    *   轨迹奖励 $R_{traj}$ 由七个维度分数通过梯度提升回归器（Gradient-Boosted Regressor）映射得到。\n    *   最终 RL 奖励 $R_{final} = R_{traj} + w_{step} \\times \\text{Mean}(R_{step})$，其中 $R_{step}$ 是将九类步骤标签映射为预设常数后的均值。\n    *   这并非数学推导，而是工程上的信号组合策略，旨在结合结果奖励（Outcome Reward）和过程奖励（Process Reward）。\n\n因此，本节跳过复杂的数学推导部分。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 问题：现有基于模型的评估器（Model-based Judges）在在线强化学习（Online RL）中能否达到或超越基于规则的评估（Rule-based Evaluation）？**\n*   **实验设计：** 在三个不同的任务域（Chrome, Impress, OS）中，使用相同的 Actor 模型（UI-TARS 1.5 7B 和 Qwen3VL-8B），分别使用 Rule-based、CUAJudge、OSThemis 和 SeekJudge 作为奖励模型进行 GRPO 强化学习训练。对比训练奖励（Train Reward）和测试成功率（Test Success Rate）。\n*   **结论：** SeekJudge 是第一个在下游测试成功率上匹配甚至超越原生 Rule-based 监督的基于模型的奖励模型。Rule-based 虽然训练奖励高，但存在过拟合，泛化能力不如 SeekJudge。\n\n**2. 问题：将多张截图放入单次前向传播（Single Forward Pass）是否会损害评估精度？**\n*   **实验设计：** 在 CUAStepBench 上，固定包含决定性证据的截图，逐步增加其他无关截图或噪声图像的数量，观察 F1 分数、精确率（Precision）和召回率（Recall）的变化。\n*   **结论：** 随着图像数量增加，F1 分数单调下降。这是因为竞争性内容（Competing Content）而非上下文长度（Context Length）导致了性能下降。模型容易被其他截图中看似合理的细节误导，从而降低了对决定性证据的关注度（Precision 下降）。\n\n**3. 问题：SeekJudge 的架构是否比现有方法更节省成本且能处理更长轨迹？**\n*   **实验设计：**\n    *   **成本：** 对比不同方法在判断相同数量轨迹时的美元成本（Token 计费）。\n    *   **上下文缩放：** 绘制峰值上下文大小（Peak Context Size）随轨迹长度变化的曲线。\n    *   **长轨迹性能：** 在 CUAStepBench-Long 上，对比 CUAJudge（受限于最大图像数）和 SeekJudge（无上限）的 F1 分数。\n*   **结论：** SeekJudge 的单次调用上下文大小仅为现有方法的 1/4 到 1/6，成本最低。在长轨迹上，CUAJudge 因图像截断导致性能受限，而 SeekJudge 通过按需查询（On-demand Query）保持了稳定的高精度。\n\n**4. 问题：细粒度的步骤级奖励（Step-level Reward）是否比布尔值奖励（Boolean Reward）更有效？**\n*   **实验设计：** 在 Impress 域进行消融实验，对比 Rule-based（Boolean）、SeekJudge（Boolean）和 SeekJudge（Continuous + Step-level）的训练和测试表现。\n*   **结论：** 结合连续分数和步骤级分数的细粒度奖励带来了最高的测试成功率。这表明密集的监督信号（Dense Supervision）能更好地指导策略优化，解决长轨迹中的信用分配（Credit Assignment）问题。\n\n**5. 问题：SeekJudge 的各个组件（Condense, Ground, Seek-Analyze）是否都是必要的？**\n*   **实验设计：** 在 CUAStepBench 上进行组件消融实验，分别移除 Condense、Ground 或 Seek-Analyze 循环，观察 F1 分数的变化。\n*   **结论：** Condense 和 Ground 是不可或缺的，移除它们会导致轨迹级和步骤级 F1 显著下降。Seek-Analyze 循环在强骨干模型上收益明显，证明了多轮交互提取证据的有效性。", "additional_insights": "### § 8 Take-aways\n\nSeekJudge 的核心洞察是将长轨迹评估解耦为 **localization**（定位关键证据帧）和 **extraction**（高精度读取细节），证明了在单次前向传播中堆叠多张截图会导致 **multi-image information noise**，即无关内容稀释了决定性证据，从而降低判断准确率。通过引入 Condense、Ground、Seek 和 Analyze 四个角色共享一个 9B 骨干模型，SeekJudge 实现了按需检索（on-demand retrieval），使得每次推理的上下文窗口显著缩小（比现有方法小 4-6 倍），从而能够处理更长的轨迹并降低计算成本。该框架是首个在在线 **reinforcement learning** 中，其下游测试成功率匹配或超越原生 **rule-based supervision** 的基于模型的奖励模型，解决了传统规则评估难以对齐人类意图、易受环境更新影响以及维护成本高的问题。为了支持细粒度的训练信号，论文构建了 **CUAStepBench**，这是首个同时包含人类轨迹级判决和密集步骤级标签的跨平台基准，并提出了 **rollout-overlapped** 奖励服务器架构，通过异步预取和零客户端状态设计，将奖励计算延迟隐藏在环境执行间隙，大幅提升了 RL 训练的效率。\n\n### § 9 最脆弱的假设\n\nSeekJudge 最脆弱的假设是：**基于文本摘要的 localization 阶段（Condense/Ground agents）能够可靠地识别出包含决定性证据的截图，且该证据足以支撑 Analyze agent 做出正确判决，而无需依赖全量视觉上下文。** 如果这一假设不成立，即关键证据分散在多帧之间、需要跨帧时序推理才能发现，或者 Condense agent 生成的文本摘要丢失了关键的视觉细微差别（如微小的 UI 变化或隐含状态），那么 Seek-Analyze 循环就会陷入“盲人摸象”，导致判断错误。论文在 Section 4.8 中通过对比实验提供了一定证据，显示在长轨迹上，当限制单帧输入时，SeekJudge 的性能优于固定窗口的方法，但这主要验证了其在“关键帧可被定位”场景下的优势。然而，论文缺乏对“定位失败”案例的系统性分析，特别是当任务依赖复杂的跨步状态累积（如多步骤表单填写中的中间验证状态）时，文本摘要可能无法捕捉这种动态依赖，导致 localization 偏差。如果实际应用中存在大量此类需要全局视觉上下文的任务，SeekJudge 的解耦设计将导致性能断崖式下跌，因为其核心优势（小上下文、低噪声）是以牺牲全局视觉连贯性为代价的。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 **Section 4.5 Multi-Image Information Noise** 实验，以验证“多图像堆叠导致性能下降”这一核心前提。具体步骤如下：使用 **CUAStepBench** 中已标注的 123 个单截图可判定案例（或类似公开数据集的子集），选取一个开源 VLM（如 Qwen2.5-VL-7B 或 LLaVA-NeXT）。首先，构建基线模型，仅输入决定性截图和指令，记录其 **F1 score**。然后，构建实验组，在输入中按顺序追加同一轨迹中的其他截图（padding images），逐步增加图像数量（如 2, 4, 8, 16 张），同时保持决定性截图始终存在。测量不同图像数量下的 **Accuracy, Precision, Recall** 和 **F1**。如果随着图像数量增加，**Precision** 显著下降（如论文所述从 0.56 降至 0.45），而 **Recall** 变化不大，则支持了“竞争内容稀释证据”的 claim，证明了解耦设计的必要性。反之，如果性能保持稳定或提升，则说明当前 VLM 对多图像噪声具有鲁棒性，SeekJudge 的复杂多 agent 架构可能并非最优解。此实验无需复现整个 RL 训练流程，仅需离线评估，计算资源需求低，且能直接验证论文方法论的基石。", "research_value": "### § 11 最强反例设计\n\n若要挑战 **SeekJudge** 的有效性，最有力的攻击并非针对其精度，而是针对其核心假设——即“决定性证据通常存在于单帧或少数几帧中，且可通过文本摘要可靠定位”。我会设计一个名为 **“State-Dependent Ambiguity” (状态依赖歧义)** 的反例场景，专门针对那些**视觉状态相同但语义状态不同**的任务。\n\n具体实验设计如下：构建一个包含“多步骤表单验证”或“动态权限检查”的 Benchmark。例如，任务要求“在用户余额不足时，将购物车中的商品移至收藏夹”。在轨迹中，Agent 执行了点击“移至收藏夹”的动作。\n1.  **视觉层面**：点击前后的截图（Screenshot）在像素级上几乎完全一致（UI 无变化，或仅有微小的 Toast 提示，容易被 **Condense Agent** 忽略或概括为“无变化”）。\n2.  **语义层面**：任务是否成功取决于后台数据库状态（余额是否真的不足，商品是否真的被移动）。\n3.  **攻击点**：**Condense Agent** 生成的文本时间线（Text Timeline）会显示“Action: Click 'Move to Favorites'; Observation: No visual change”。**Seek Agent** 基于此文本，可能认为证据不足或证据指向失败（因为没看到成功提示），从而发起查询。然而，**Analyze Agent** 接收到的单张截图无法显示后台状态。如果 **Seek Agent** 错误地判断“无视觉变化”意味着“操作未执行”或“无需进一步检查”，它将给出错误判决。更致命的是，如果 **Condense Agent** 丢失了关键的微小视觉线索（如颜色极淡的 Toast），**Seek Agent** 根本无法发起正确的查询。\n\n这个反例揭示了 **SeekJudge** 的结构性缺陷：**Localization 阶段对视觉细微差别的敏感性不足，且 Extraction 阶段无法访问非视觉状态（Non-visual State）**。在真实世界的 Enterprise 应用中，大量操作（如 API 调用、后台数据处理）的反馈是隐式的。如果 **SeekJudge** 无法处理这种“视觉静默但语义关键”的步骤，其在复杂业务流中的泛化能力将大打折扣。此外，我可以论证，现有的 **Rule-based** 方法虽然僵化，但可以通过解析 DOM 事件或 API 日志直接获取状态，而 **SeekJudge** 仅依赖截图，本质上丢失了信息通道，因此在处理此类任务时，其性能上限必然低于能够访问内部状态的 Rule-based 或 Hybrid 方法。\n\n### § 12 Follow-up Research Idea\n\n基于 **SeekJudge** 在“视觉静默”和“跨帧状态累积”任务中的局限，我提出一个新的研究方向：**Semantic-State-Grounded Reward Modeling (SSGRM)**，即从“基于视觉证据的推理”转向“基于语义状态轨迹的验证”。\n\n**(a) 驱动局限与未满足需求：**\n当前所有 Model-based Judges（包括 SeekJudge）都假设“屏幕即真理”（Screen is Truth），即任务完成状态完全反映在 UI 截图中。然而，在复杂的 Computer-Use Agents 任务中，大量关键状态（如数据库更新、异步任务完成、权限变更）是隐式的。SeekJudge 的解耦设计虽然解决了视觉噪声问题，但加剧了“视觉-语义鸿沟”。我们需要一种方法，能够利用 Agent 执行过程中产生的**非视觉信号**（如 DOM 变化、Console 日志、API 响应、Accessibility Tree 的深层属性）来辅助或校正视觉判断，而不仅仅是依赖截图。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴 **Software Engineering** 中的 **Dynamic Program Analysis** 和 **Log-based Anomaly Detection** 技术。在软件测试中，验证器不仅看 UI，还监控内部状态机。我们可以引入一个 **State-Trace Parser**，将 Agent 的每一步操作映射为结构化的状态变更日志（State-Change Log），类似于 Git 的 Diff 但针对应用状态。同时，借鉴 **Information Retrieval** 中的 **Cross-Modal Retrieval** 技术，将视觉查询与结构化日志进行对齐。\n\n**(c) 第一个实验设计：**\n构建一个 **Hybrid-Reward Benchmark**，包含两类任务：1) **Visual-Explicit**（如 SeekJudge 擅长的，结果直接显示在屏幕上）；2) **State-Implicit**（如“提交表单后，检查数据库是否新增记录”，UI 仅显示“提交成功”，但需验证数据一致性）。\n实验对比三种 Reward Model：\n1.  **SeekJudge**（仅视觉）；\n2.  **Log-Augmented SeekJudge**：在 **Condense Agent** 阶段，除了生成视觉摘要，还注入解析后的 DOM/Log 摘要（如 `DOM: \u003Cform\u003E submitted`, `API: POST /submit 200 OK`）。\n3.  **State-Graph Verifier**：一个全新的轻量级模型，不直接看截图，而是将轨迹转化为一个有向无环图（DAG），节点为状态变更，边为动作，通过图神经网络（GNN）或 LLM 对图路径进行逻辑一致性检查。\n\n预期结果：在 **Visual-Explicit** 任务上，SeekJudge 保持优势；但在 **State-Implicit** 任务上，**Log-Augmented** 或 **State-Graph** 方法将显著超越 SeekJudge，证明引入非视觉语义信号是突破当前 Model-based Judge 瓶颈的关键。这将开启一个从“视觉理解”到“系统状态理解”的新范式，使 Reward Model 能够真正理解 Agent 与环境的深层交互，而不仅仅是表面现象。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Yang Wan\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zhenhao Zhang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jierui Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Linchao Zhu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Zhejiang University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"University of Rochester\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Corresponding author\"\n    }\n  ]\n}\n```", "summary_translation": "判断轨迹是否真正满足指令，决定了我们如何衡量计算机使用智能体在长视界图形用户界面任务上的表现，以及如何通过强化学习对其进行训练。长期以来，这一判断依赖于基于规则的评估，该方法难以与人类意图对齐，且在应用程序更新或在线内容漂移时容易过时。现有的基于模型的裁判试图解决这些问题，但与基于规则的评估相比仍存在性能差距。我们提出了 **SeekJudge** 框架，其中四个角色专用的智能体——Condense、Ground、Seek 和 Analyze 智能体——通过对轨迹执行 Seek--Analyze 循环来达成裁决。一个经过种子校准的蒸馏流程训练了一个专用的 $9$B 模型，作为所有四个智能体的共享骨干网络。通过在保留的 RL 测试目标上的下游成功率进行衡量，SeekJudge 是第一个在实际应用中匹配或超越原生基于规则监督的在线 RL 的基于模型的奖励。除了准确性之外，SeekJudge 提供步骤级判断，运行成本远低于闭源大模型，并保持较小的每次调用上下文，从而可扩展到更长的轨迹。我们进一步为奖励服务器贡献了一种通用的架构改进，以加速 RL 中的判断。这些改进共同使得基于模型的奖励成为 CUA 强化学习中基于规则监督的实用即插即用替代方案。"}]}, {"name": "Agentic Search \u0026 Retrieval", "count": 3, "papers": [{"title": "A New Role for Relevance: Guiding Corpus Interaction in Agentic Search", "arxiv_id": "2607.24223", "authors": "Jiangnan Li, Yuqing Li, Mo Yu, Jinchao Zhang, Jie Zhou", "summary": "Relevance is a query-dependent estimate of whether a document or excerpt contains useful evidence. Existing retrieval agents use relevance to select top-$k$ content, but document relevance alone cannot localize, compose, or verify the evidence required by complex questions. Direct Corpus Interaction (DCI) enables such fine-grained operations through grep-style exploration, but its relevance-agnostic search can expose useful clues late and delay convergence. Recent advances use relevance to narrow the corpus into a working space for interaction. Once interaction begins, however, relevance still does not directly guide which documents grep searches first or distinguish informative excerpts from a broad set of matches to let LLMs see them first. We introduce the Relevance-Aware RipGrep Search Agent (RARG), which turns relevance into an execution prior for corpus interaction. RARG provides coarse-to-fine relevance guidance: it orders documents for sequential 'ripgrep' traversal to expose globally relevant clues earlier, initializes promising entry points with query-relevant paragraphs, and reranks grep matches to surface informative excerpts that document-level ranking may otherwise obscure. Across challenging browse question answering and reasoning-intensive retrieval, RARG improves the accuracy--efficiency frontier over retrieval-based and direct-interaction agents. These results demonstrate that relevance-aware interaction enables faster and more reliable search convergence.", "category": "cs.CL", "cluster": "Agentic Search \u0026 Retrieval", "tags": ["cs.CL"], "filter_reason": "该论文符合筛选标准，核心依据如下：\n\n1.  核心对象明确为 LLM 智能体：论文标题和摘要明确提出了 \"Agentic Search\" 和 \"RARG (Relevance-Aware RipGrep Search Agent)\"，研究对象是具备搜索能力的 LLM 智能体，而非单纯的检索模型或传统信息检索系统。\n2.  涉及智能体机制的改进（规划与工具使用）：论文的核心贡献在于提出了一种新的智能体执行策略（execution prior），即如何利用“相关性”来指导智能体与语料库的交互（corpus interaction）。这属于智能体在 工具使用（Tool Use） 和 规划（Planning） 层面的机制优化。具体而言，它改进了智能体在使用 grep 等工具进行细粒度探索时的顺序、入口点选择和结果重排序策略，旨在解决复杂问题中证据定位和验证的难题。\n3.  符合“构建/改进 LLM 智能体”的目标：论文旨在通过改进智能体的内部决策逻辑（将相关性转化为执行先验）来提升其在长horizon 搜索任务中的准确性和效率。这直接对应了筛选标准中“构建、改进... LLM智能体”的要求，特别是关于智能体如何更有效地利用工具和环境反馈进行决策的部分。\n4.  排除项检查：\n       它不是单纯的基础设施或通信协议研究，而是关于智能体行为逻辑的算法改进。\n       它不涉及被排除的安全、对齐、多模态视觉或图神经网络技术。\n       虽然涉及检索（Retrieval），但其重点在于 Agent 如何主动交互和探索，而非被动检索，因此属于 Agentic AI 范畴。\n\n综上，该论文研究的是如何改进 LLM 智能体在搜索场景下的工具使用策略和规划能力，属于单智能体（Agentic）方向的前沿研究，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在 Agentic Search（智能体搜索）中，如何超越将 Relevance（相关性）仅作为检索输入筛选机制的传统范式，将其转化为指导 Direct Corpus Interaction（DCI，直接语料库交互）的 Execution Prior（执行先验），以解决细粒度探索中的收敛效率与证据定位问题。\n\n这一问题的重要性源于现有 Agentic Retrieval 架构在“检索”与“交互”之间的根本性割裂。传统的 Retrieval-Augmented Generation (RAG) 或基于 Top-k 检索的智能体，将 Relevance 等同于 Evidence Utility（证据效用），通过返回 Top-k 文档或 Snippet 供 LLM 推理。然而，这种粗粒度接口无法支持复杂问题所需的证据 Localization（定位）、Composition（组合）与 Verification（验证），导致智能体即使检索到相关文档，也可能因关键事实被截断或隐藏在深层结构中而失败。另一方面，Direct Corpus Interaction (DCI) 允许智能体通过 `grep` 等工具直接操作原始语料，提供了高分辨率的交互能力，但其本质是 Relevance-agnostic（无关相关性）的。DCI 将语料库视为均匀分布的搜索空间，导致智能体在缺乏全局指引的情况下进行盲目探索，不仅工具调用成本高昂，且容易因输出截断而遗漏关键线索，造成 Search Convergence（搜索收敛）缓慢甚至失败。\n\n解决这一问题的价值在于打破了 Accuracy-Efficiency Frontier（准确率-效率前沿）的瓶颈。通过将 Relevance 注入到交互的执行层面（如决定 `ripgrep` 的遍历顺序和匹配结果的可见性），RARG 实现了从“盲目扫描”到“引导式探索”的转变。这不仅显著降低了达到正确结论所需的 Tool Calls（工具调用次数）和计算成本，还提高了在大规模、高噪声语料库中定位复杂证据的可靠性。研究表明，这种 Relevance-Aware Interaction（相关性感知交互）能够在保持 DCI 细粒度优势的同时，利用检索信号加速收敛，为构建更高效、更鲁棒的深度研究智能体提供了新的技术路径。\n\n### § 2 前人工作与不足\n\n该问题在之前的研究中并未得到充分解决，主要因为现有工作要么局限于静态检索，要么在动态交互中忽略了相关性信号的细粒度引导作用。\n\n最相关的 Prior Methods 包括 **DCI-Agent** [16]、**RISE** [35] 和 **DR-DCI** [18]。**DCI-Agent** 确立了通过 Shell 命令（如 `grep`）直接交互语料库的范式，证明了细粒度交互在证据组合上的优势，但其核心缺陷在于完全缺乏 Corpus-level Relevance Guidance（语料库级相关性引导）。由于 `grep` 对所有文件一视同仁，智能体必须遍历大量无关文件才能找到线索，导致随着语料库规模扩大，收敛速度急剧下降，工具使用量激增。\n\n**RISE** 和 **DR-DCI** 试图通过引入检索来构建或扩展一个有界的 Interaction Space（交互空间）来解决 DCI 的扩展性问题。RISE 使用 BM25 检索构建一个预处理过的子集供智能体探索，DR-DCI 则将检索作为动作逐步扩展工作区。然而，这些方法存在关键不足：它们仅将 Relevance 用于 **Space Construction（空间构建）** 或 **Input Selection（输入选择）**，即决定“哪些文档可以被访问”，而未将 Relevance 转化为 **Execution Signal（执行信号）** 来指导“如何访问”。具体而言，一旦进入交互阶段，RISE 和 DR-DCI 内部的 `grep` 操作仍然是 Relevance-agnostic 的，无法决定遍历顺序，也无法在输出截断时优先展示高信息量的 Excerpts（摘录）。这导致智能体在受限空间内依然可能进行低效探索，且容易因局部噪声干扰而迷失。\n\n此外，传统的 **Retrieval-Agent** 或 **NeMo** [6] 等系统虽然擅长文档级排序，但其接口本质上是静态的 Top-k 返回，缺乏 DCI 所需的动态、细粒度证据验证能力，无法处理需要多跳推理或精确上下文匹配的复杂查询。\n\n前人工作之所以未能解决此问题，是因为它们隐含地假设“检索到的文档集合”足以支撑后续推理，或者认为交互过程中的探索成本可以通过限制搜索空间来完全抵消。然而，本文指出，Relevance 不仅是一个过滤器，更是一个优先级信号。之前的系统未能定义如何将 Document-level Relevance（文档级相关性）映射到 File Traversal Order（文件遍历顺序），以及如何将 Local Relevance（局部相关性）映射到 Match Visibility（匹配可见性）。这种机制上的缺失，使得现有方法无法在保持 DCI 灵活性的同时，利用检索信号实现高效的 Search Convergence。RARG 正是通过填补这一机制空白，将 Relevance 从“静态筛选器”转变为“动态执行先验”，从而克服了上述不足。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Agentic Search 领域，研究者长期面临两种极端范式的权衡：传统的 Retrieval-Augmented Generation (RAG) 依赖静态的 Top-k 文档检索，虽然利用了 Relevance 信号，但缺乏细粒度的证据定位能力，容易因 Snippet 截断或上下文噪声导致关键信息丢失；而 Direct Corpus Interaction (DCI) 允许 Agent 通过 `grep` 等工具直接探索原始语料，具备极高的交互分辨率，但其本质是 Relevance-agnostic 的，导致 Agent 在大规模语料中如同“盲人摸象”，收敛速度慢且工具调用成本高昂。\n\n现有的改进工作（如 RISE, DR-DCI）试图通过检索构建一个有界的“交互空间”来缓解 DCI 的扩展性问题，但这仅将 Relevance 用作空间构建的过滤器，并未将其融入交互执行过程。作者观察到，DCI 的核心痛点在于缺乏执行层面的优先级引导：Agent 不知道先搜哪个文件，也不知道在输出截断时哪些匹配项更重要。因此，作者推断 Relevance 不应仅仅是输入选择的依据，而应转化为一种 Execution Prior，直接指导 `grep` 的遍历顺序和匹配项的可见性。基于此，作者提出将文档级 Relevance 映射为 `ripgrep` 的扫描顺序（Global Relevance），并将局部匹配项通过 Embedding 重新排序以突破截断限制（Local Relevance），从而在保留 DCI 细粒度交互优势的同时，注入检索系统的效率优势。\n\n### § 4 核心 Intuition\n\n传统方法将 Relevance 视为静态的内容过滤器，而 RARG 将其转化为动态的执行信号，直接决定 Agent 在语料库中的探索路径和观察焦点。通过强制 `ripgrep` 按文档相关性顺序单线程扫描，并重新排序局部匹配项以对抗输出截断，该方法确保了高价值证据在交互早期即可被 Agent 捕获。这种从“选择看什么”到“指导怎么看”的转变，解决了 DCI 在大规模语料中因缺乏优先级引导而导致的收敛缓慢问题，实现了精度与效率的双重提升。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法是 **Relevance-Aware RipGrep Search Agent (RARG)**。其核心思想是将传统的检索相关性（Relevance）从单纯的“内容筛选器”转变为“执行先验（Execution Prior）”，直接指导 Agent 在语料库中的交互顺序和观察重点。RARG 包含三个层级的粗到细（Coarse-to-Fine）引导机制：\n\n1.  **文档级相关性插入（Document-Level Relevance Insertion, RARG）**：\n    *   **机制**：利用 Embedding Retriever 对语料库进行排序，生成一个包含文档路径的 `scope` 文件（通常限制在前 10,000 个最相关文档）。\n    *   **执行**：Agent 不直接读取文档内容，而是通过 `cat scope.txt | xargs -d '\\n' rg -j1 \"PATTERN\"` 命令，强制 `ripgrep` (`rg`) 按照相关性从高到低的顺序**单线程**遍历文档。这确保了高相关文档中的匹配项优先暴露给 Agent。\n2.  **入口点初始化（Entry Point Initialization, RARG+）**：\n    *   **机制**：在生成 `scope` 的同时，提取 Top-K 文档中与查询最相关的段落（Paragraphs），作为初始上下文提供给 LLM。\n    *   **作用**：为 Agent 提供高质量的“切入点”，使其能立即制定精确的搜索策略，减少盲目探索。\n3.  **匹配级相关性重排序（Match-Level Relevance Insertion, RARG++）**：\n    *   **机制**：当 `rg` 返回大量匹配片段时，使用 Embedding 模型结合全局查询意图和局部搜索模式（Pattern）对匹配片段进行重排序。\n    *   **作用**：即使某些文档在文档级排名较低，其中包含的关键证据片段也能通过重排序进入 Agent 的观察窗口（Observation Budget），避免被截断。\n\n**完整 Pipeline 示例：**\n\n假设用户提问：“*Find Person A, who earned a Ph.D. in Mathematics in 1983 and became an AMS Fellow between 2005 and 2020...*”\n\n1.  **输入（Input）**：\n    *   原始查询（Query）：上述关于 Person A 的多跳问题。\n    *   语料库：包含 100K+ 文档的本地文件系统。\n\n2.  **处理（Processing）**：\n    *   **Step 1: Scope 构建 (RARG)**：\n        *   Agent 调用 `embed_recall` 工具，输入原始查询。\n        *   系统使用 Embedding 模型检索最相关的文档路径，写入 `/tmp/scope_1.txt`。\n        *   *(若为 RARG+)*：系统同时提取 Top 10 相关段落，包裹在 `\u003Cqr_paragraph\u003E` 标签中返回给 Agent 作为初始提示。\n    *   **Step 2: 相关性引导搜索 (RARG)**：\n        *   Agent 根据初始信息（或自行推理）生成搜索关键词，如 `\"1983\" \"Mathematics\" \"Ph.D.\"`。\n        *   Agent 执行命令：`cat /tmp/scope_1.txt | xargs -d '\\n' rg -j1 \"1983.*Mathematics.*Ph.D.\"`。\n        *   `rg` 严格按照 `scope_1.txt` 中的文档顺序扫描，高相关文档的匹配行优先输出。\n    *   **Step 3: 匹配重排序 (RARG++)**：\n        *   `rg` 返回 500 个匹配片段。\n        *   系统构建重排序查询：`Query: [Original Query] RG focus: 1983 Mathematics Ph.D.`。\n        *   Embedding 模型对这 500 个片段打分，保留 Top 30 最相关的片段返回给 Agent。\n    *   **Step 4: 迭代与验证**：\n        *   Agent 观察到包含 \"Russell David Lyons\" 的 CV 片段。\n        *   Agent 进一步调用 `rg` 验证其 AMS Fellow 身份及合著者信息，直到确信答案。\n\n3.  **输出（Output）**：\n    *   Agent 停止工具调用，输出最终答案：`Exact Answer: Russell David Lyons`。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过**。\n\n本文主要关注系统架构设计与工程实现，未提出新的数学模型或形式化推导。其核心贡献在于将检索相关性（Relevance）作为一种**执行信号（Execution Signal）**而非仅作为内容过滤条件，通过改变 `grep` 操作的遍历顺序和输出截断策略来优化搜索收敛性。文中涉及的“相关性”主要指 Embedding 相似度或 BM25 分数，这些是现有检索模型的直接应用，而非本文推导的新公式。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有的检索 Agent 要么仅依赖 Top-K 文档返回（缺乏细粒度证据定位能力），要么使用无相关性引导的直接语料库交互（Direct Corpus Interaction, DCI，导致搜索效率低、收敛慢）。核心问题是：**如何将相关性（Relevance）有效地转化为语料库交互过程中的执行先验，以加速搜索收敛并提高准确性？**\n\n**2. 设计了什么实验验证这个问题？**\n*   **基准测试（Benchmarks）**：\n    *   **BrowseComp-Plus (BC+)**：用于评估复杂浏览问答（QA）能力，包含 100K 和扩展至 1M 文档的语料库，测试 Agent 在大规模噪声下的收敛速度和准确率。\n    *   **BRIGHT**：用于评估推理密集型检索（Reasoning-Intensive Retrieval），测试 Agent 在需要深度推理而非简单语义匹配场景下的表现（nDCG@10）。\n*   **对比基线（Baselines）**：\n    *   **Retrieval-based**：如 RISE（构建交互空间）、NeMo（迭代召回重排）。\n    *   **Direct Interaction**：如 DCI-Agent-Lite（无相关性引导的纯 `grep` 搜索）。\n*   **消融实验（Ablation）**：\n    *   对比 RARG（仅文档级排序）、RARG+（增加入口初始化）、RARG++（增加匹配级重排序）的性能差异。\n    *   分析不同模型（GPT-5.4-mini/nano）和语料库规模（100K vs 1M）下的表现。\n*   **行为分析（Behavior Analysis）**：\n    *   通过热力图（Heatmap）分析 Agent 在 `scope` 排名中的命中分布，验证相关性是否真正引导了遍历顺序。\n    *   统计工具调用次数（Tool Calls）和搜索/读取比例，评估效率。\n\n**3. 问题的答案是什么？**\n*   **相关性引导显著提升效率与准确性**：RARG++ 在 BC+ 上相比 DCI 减少了约 75% 的工具调用次数（从 99.1 降至 23.9），同时准确率从 68% 提升至 84%（GPT-5.4-mini）。这证明将相关性作为执行先验能有效加速搜索收敛。\n*   **粗到细的引导机制有效**：RARG（文档级排序）优于纯 DCI；RARG+（入口初始化）进一步减少初始探索步数；RARG++（匹配级重排序）在 QA 任务中表现最佳，因为它能挖掘低排名文档中的高价值片段。\n*   **任务依赖性**：在 BRIGHT（检索任务）中，RARG+ 表现最好，因为该任务需要广泛召回（Broad Recall），而 RARG++ 的局部重排序可能过于聚焦，限制了召回广度。这表明最优的相关性粒度取决于任务目标（快速收敛 vs 广泛召回）。\n*   **可扩展性**：在语料库从 100K 扩展到 1M 时，RARG 系列方法虽然准确率略有下降，但仍显著优于基线，且工具调用成本增加有限，证明了其在大规模语料库中的鲁棒性。", "additional_insights": "### § 8 Take-aways\n\nRelevance should function as an execution prior for corpus interaction rather than merely a filter for selecting input documents. The proposed RARG agent transforms document-level relevance scores into a sequential traversal order for `ripgrep` (`rg`) operations, ensuring that semantically relevant documents are scanned first. This coarse-to-fine guidance strategy includes entry-point initialization with query-relevant paragraphs and match-level reranking to surface informative excerpts from lower-ranked documents. By enforcing single-threaded `rg` execution (`-j1`), the method preserves the relevance-induced ordering, which is otherwise lost in parallel multi-threaded scanning. Experimental results on BrowseComp-Plus and BRIGHT demonstrate that RARG++ achieves higher accuracy and significantly lower tool call counts compared to retrieval-only agents and unrestricted Direct Corpus Interaction (DCI) baselines. The approach effectively balances the high-resolution evidence localization of DCI with the global prioritization of retrieval, accelerating search convergence even as the corpus scales from 100K to 1M documents.\n\n### § 9 最脆弱的假设\n\n该方法最核心的假设是：Embedding model 生成的文档级相关性排序（Document-level Relevance）能够准确预测哪些文档包含对当前查询至关重要的证据，且这种全局排序足以指导细粒度的 `grep` 搜索顺序。如果这一假设不成立，即高相关性文档实际上不包含关键证据，或者关键证据隐藏在低相关性文档中且无法通过 Match-level Reranking 有效恢复，那么 RARG 的“先扫描高相关文档”策略将导致搜索收敛变慢甚至失败。在实际中，这一假设可能失效的原因包括：Embedding 模型对长文档的语义压缩存在偏差，导致包含关键事实但语义背景不同的文档排名靠后；或者在噪声极大的语料库中，无关的词汇匹配（Incidental Lexical Matches）干扰了相关性判断。论文通过 Scope Recall 实验（Fig. 4a）提供了部分证据，显示 Top-10K 文档覆盖了绝大多数 Gold Documents，但这仅证明了召回率，并未完全证明排序的前置性对于加速收敛是绝对必要的，特别是在复杂推理任务中，证据可能分散在多个低排名文档中。\n\n### § 10 最小复现实验\n\n在 1 周内，可以使用 BrowseComp-Plus 的 100-query 子集和 100K 文档语料库，复现 RARG 的核心机制：基于 Embedding 排序的 `rg` 遍历。具体实现为：使用 Qwen3-Embedding-4B 对语料库文档进行排序，生成 Scope 文件；然后对比两种 `rg` 搜索策略：1) 无序并行搜索（标准 `rg`），2) 有序串行搜索（`rg -j1` 按 Scope 顺序）。测量指标为：找到正确答案所需的平均工具调用次数（Tool Calls）和首次命中关键证据文档的步数（Steps to First Hit）。如果有序串行搜索在保持相同准确率的前提下，显著减少了工具调用次数或提前命中关键文档，则支持了“相关性作为执行先验能加速收敛”的 Claim；反之，如果两者性能无显著差异或有序搜索更慢，则反驳了该假设的有效性。此实验无需复现完整的 Agent 循环，仅需验证底层搜索机制的效率差异。", "research_value": "### § 11 最强反例设计\n\n要挑战 RARG 的核心主张，最有力的攻击点在于其**“相关性排序与搜索效率之间的单调性假设”**，即假设 Embedding 相似度高的文档必然包含更早被发现的证据。然而，在**“语义漂移（Semantic Drift）”**或**“长尾事实（Long-tail Facts）”**场景中，这一假设极易失效。\n\n**具体反例场景：多跳推理中的“语义陷阱”**\n考虑一个需要多跳推理的查询，例如：“*Find the company founded by the person who wrote the paper cited by Author X in 2010.*”\n1.  **第一跳（Author X 的论文）**：Embedding 检索可能返回大量与 Author X 主题相关但并未引用目标论文的文档（高语义相似度，低事实相关性）。\n2.  **第二跳（引用者）**：真正引用该论文的作者 Y，其个人主页或 CV 可能在语义上与 Author X 的原始研究领域差异巨大（例如跨学科引用），导致 Author Y 的文档在 Embedding 排序中排名极低（例如 Top-10,000 之外，或排名靠后）。\n3.  **RARG 的失败模式**：\n    *   RARG 强制 `rg` 按 Embedding 排序遍历。Agent 会花费大量 Tool Calls 扫描前 10,000 个“语义相关但事实无关”的文档，寻找不存在的引用线索。\n    *   由于 `rg -j1` 是单线程串行执行，Agent 必须等待这些低价值文档扫描完毕，才能触及排名靠后的 Author Y 的文档。\n    *   相比之下，**DCI-Agent（无序并行搜索）**虽然盲目，但 `ripgrep` 的多线程并行特性可能偶然且快速地扫描到 Author Y 的文档（假设其文件名或路径包含关键词，或运气好被早期线程命中）。\n    *   **结果**：在特定分布下，RARG 的“有序串行”反而比“无序并行”更慢，因为**排序噪声（Ranking Noise）**引入了巨大的**等待延迟（Latency Penalty）**。\n\n**理论论证：信息熵与遍历顺序的错配**\nRARG 假设 Relevance 是 Evidence Utility 的代理。但在复杂查询中，**Information Gain（信息增益）**最高的文档往往不是语义相似度最高的，而是那些能消除最大不确定性的文档。Embedding 模型捕捉的是静态语义，而搜索过程是动态的。如果高排名文档包含大量“部分匹配（Partial Matches）”或“干扰项（Distractors）”，Agent 需要更多步数来排除它们，而低排名文档可能直接包含“决定性证据（Decisive Evidence）”。RARG 的串行机制放大了这种错配，导致**Search Convergence**不仅没有加速，反而因“过早承诺（Early Commitment）”于错误路径而延迟。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“静态执行先验”到“动态信息增益引导的探索（Dynamic Information-Gain Guided Exploration）”**\n\n**（a）驱动局限与未满足需求**\nRARG 的核心局限在于其**静态性（Static Nature）**：它在搜索开始前基于原始 Query 计算一次 Relevance，并固定整个搜索过程的遍历顺序。然而，Agentic Search 是一个**贝叶斯更新过程（Bayesian Updating Process）**。随着 Agent 获取新证据（Observations），其对“哪里还有未发现的证据”的信念（Belief）应动态更新。RARG 无法利用中间步骤获得的信息来调整后续搜索策略，导致在复杂多跳任务中，早期检索的偏差会贯穿整个搜索过程。现有方法缺乏一种机制，将**实时观察到的信息熵（Information Entropy）**转化为**动态的搜索优先级**。\n\n**（b）借鉴相邻领域的方法**\n借鉴**主动学习（Active Learning）**中的**不确定性采样（Uncertainty Sampling）**和**强化学习（Reinforcement Learning）**中的**探索-利用权衡（Exploration-Exploitation Trade-off）**。\n*   在主动学习中，模型选择那些能最大程度减少模型不确定性的样本进行标注。\n*   在 RL 中，Agent 根据当前状态选择能最大化预期回报的动作。\n*   我们可以将语料库中的每个文档或文件块视为一个“状态”，将 `grep` 搜索视为“动作”。目标不是最大化静态 Relevance，而是最大化**预期信息增益（Expected Information Gain, EIG）**。\n\n**（c）第一个实验设计：EIG-Agent**\n1.  **核心机制**：\n    *   不再使用固定的 `scope` 文件。\n    *   引入一个轻量级的**价值网络（Value Network）**或**启发式函数**，该函数输入当前 Query、已观察到的证据（Context）和候选文档的元数据（Metadata/Embedding）。\n    *   输出每个候选文档的**EIG 分数**：即“如果扫描该文档，预计能减少多少关于最终答案的不确定性”。\n    *   **动态重排序**：在每一步 Tool Call 前，重新计算剩余未扫描文档的 EIG，并动态调整 `rg` 的遍历顺序（或选择下一个要扫描的子目录/文件集）。\n2.  **实验设置**：\n    *   **基准**：BrowseComp-Plus 中的多跳推理子集。\n    *   **基线**：RARG++（静态 Relevance 引导）、DCI-Agent（无引导）、以及一个基于**随机探索（Random Exploration）**的基线。\n    *   **指标**：除了 Accuracy 和 Tool Calls，引入**“信念收敛速度（Belief Convergence Speed）”**，即 Agent 的预测概率分布达到稳定（或高置信度）所需的步数。\n3.  **预期结果与区分度**：\n    *   如果 EIG-Agent 能在早期步骤中主动跳过那些“语义相关但信息饱和（Information Saturated）”的文档，转而探索那些“语义稍远但可能包含关键缺失链接”的文档，则证明**动态引导**优于**静态先验**。\n    *   这将揭示 RARG 的静态排序在复杂推理中的根本缺陷：它无法适应搜索过程中不断变化的信息需求。\n\n这个方向将 Agentic Search 从“检索增强”推向“认知增强”，强调 Agent 的**元认知（Metacognition）**能力——即知道“我不知道什么”，并据此优化搜索策略，而不仅仅是“知道什么相关”。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Jiangnan Li\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\",\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Yuqing Li\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Mo Yu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Jinchao Zhang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jie Zhou\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Tencent\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"IIE-CAS\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"equal contributions\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"corresponding authors\"\n    }\n  ]\n}\n```", "summary_translation": "相关性是对文档或摘录是否包含有用证据的依赖于查询的估计。现有的检索智能体利用相关性来选择前 $k$ 个内容，但仅凭文档相关性无法定位、组合或验证复杂问题所需的证据。直接语料库交互（DCI）通过 grep 风格的探索实现了此类细粒度操作，但其与相关性无关的搜索可能会延迟暴露有用线索并延缓收敛。最近的进展利用相关性将语料库缩小为交互的工作空间。然而，一旦交互开始，相关性仍然不能直接指导哪些文档优先进行 grep 搜索，也无法从广泛的匹配结果中区分出信息丰富的摘录以让大语言模型（LLMs）优先查看。我们引入了相关性感知 RipGrep 搜索智能体（RARG），它将相关性转化为语料库交互的执行先验。RARG 提供了由粗到细的相关性指导：它对文档进行排序以进行顺序的 'ripgrep' 遍历，从而更早地暴露全局相关的线索；使用与查询相关的段落初始化有希望的入口点；并对 grep 匹配结果进行重排序，以凸显文档级排序可能掩盖的信息丰富的摘录。在具有挑战性的浏览问答和推理密集型检索任务中，RARG 在基于检索和直接交互的智能体之上提升了准确率-效率前沿。这些结果表明，相关性感知的交互能够实现更快且更可靠的搜索收敛。"}, {"title": "From Proprietary to Open-Source: Bridging the Distribution Gap via Multi-Agent Prot
