rifiable Rewards）方法，如 **GRPO**，仅依赖稀疏的终端奖励（0/1），导致模型无法区分轨迹中哪些步骤是关键的，哪些是无关的。虽然 **Process Reward Models (PRMs)** 或基于搜索的方法（如 **MCTS**）能提供细粒度信号，但它们要么需要昂贵的额外训练数据，要么计算开销巨大，难以在 LLM 训练规模下普及。\n\n与此同时，经典游戏（如 Sokoban, Minesweeper）拥有完美的 **Game Solvers**，这些求解器能给出任意状态下的最优解或 **Cost-to-Go**。传统的做法是使用 **SFT** 模仿求解器的轨迹，但这存在严重的 **Distribution Shift** 问题：一旦 LLM 偏离了专家轨迹，SFT 就无法提供指导。因此，研究者意识到需要一种 **On-Policy** 的机制，让 LLM 在自己的探索中实时获得反馈。\n\n然而，直接蒸馏（Distillation）通常要求 Teacher 提供完整的 **Logits** 分布，而传统 Solver 只输出标量值（如剩余步数）或单一动作，缺乏分布信息。这就产生了一个矛盾：如何利用 Solver 的标量价值信号，在不构建复杂分布模型的前提下，实现高效的 **On-Policy Distillation**？\n\n作者观察到，Solver 的 **State Value** 变化（即动作前后的价值差）本质上反映了该动作对达成目标的贡献。如果假设 Solver 是 **Soft-Optimal** 的，那么这种价值变化与动作的对数概率（Log-Probability）存在数学上的等价关系。这意味着，Solver 的标量优势（Advantage）本身就编码了 Teacher 的偏好强度。因此，无需复杂的 Logits 匹配，只需将 Solver 的 **Advantage** 作为 **Turn-Level** 的信号注入到 RLVR 中，即可在数学上等价于从 Solver 进行蒸馏，同时保留了 RL 探索任务奖励的能力。这一洞察将“利用 Solver 指导”从昂贵的搜索或 SFT 转化为轻量级的、基于标量优势的 **Logit-Free Distillation**。\n\n### § 4 核心 Intuition\n\n传统 RLVR 因稀疏奖励导致长视界任务中的 **Credit Assignment** 失效，而现有细粒度信号来源（如 PRM 或搜索）成本高昂或依赖离线数据。CAST 的核心直觉是：经典游戏的 **Solver** 天然具备评估任意状态价值的能力，其动作前后的 **State Value** 变化（即 **Solver Advantage**）直接量化了该动作对胜利的贡献。在 **Soft-Optimal** 假设下，这一标量优势在数学上等价于 Teacher 的动作对数偏好，因此无需 Teacher 的完整 **Logits** 分布，仅凭标量优势即可实现高效的 **On-Policy Distillation**，从而以极低的计算开销为 LLM 提供精准的 **Turn-Level** 监督信号。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nCAST（Credit Assignment from Solver Teachers）的核心思想是利用游戏求解器（Game Solver）作为“回合级教师”，为 LLM Agent 的每一步动作提供细粒度的信用分配信号，从而解决长视界游戏中稀疏奖励导致的 Credit Assignment 难题。\n\n**完整 Pipeline 示例：以 Sokoban（推箱子）游戏为例**\n\n1.  **输入（Input）：**\n    *   **环境状态：** LLM Agent 观察到当前的 Sokoban 棋盘状态 $s_t$（文本渲染的网格，包含墙壁、箱子、目标点、玩家位置）。\n    *   **动作采样：** Agent 基于当前策略 $\\pi_\\theta$ 采样一个动作 $a_t$（例如：“向右移动”）。\n\n2.  **处理（Processing）：**\n    *   **环境交互：** 环境执行动作 $a_t$，转移到新状态 $s_{t+1}$。\n    *   **求解器评估（Solver Query）：**\n        *   调用专用的 Sokoban 求解器（如加权 A* 搜索），计算当前状态 $s_t$ 的“剩余步数” $N(s_t)$ 和新状态 $s_{t+1}$ 的“剩余步数” $N(s_{t+1})$。这里的 $N(s)$ 定义为从状态 $s$ 到达胜利所需的最少动作数。\n        *   **计算 Solver Advantage：** 计算动作带来的价值变化。原始优势定义为 $A^{\\pi_{Solver}} = N(s_t) - N(s_{t+1})$。\n            *   若动作最优（减少1步剩余距离），$A=1$。\n            *   若动作无效（剩余距离不变），$A=0$。\n            *   若动作有害（增加剩余距离或进入死局），$A \u003C 0$。\n    *   **信号整形（Signal Shaping）：**\n        *   **Shift：** 将优势值平移，确保进步对应正信用。\n        *   **asinh 压缩：** 应用反双曲正弦函数 $h(x) = \\text{asinh}(x)$。这能保留小信号（常见步骤）的分辨率，同时压缩极端值（如进入死局的巨大负惩罚），防止梯度爆炸。\n        *   **RMS 归一化：** 对 Batch 内的所有回合信号进行均方根归一化，消除不同游戏或不同难度间的尺度差异，保持“0”代表无进展的语义。\n    *   **优势融合（Advantage Combination）：**\n        *   计算 GRPO 的轨迹级优势 $\\hat{A}^{outcome}_i$（基于最终胜负的稀疏奖励）。\n        *   将整形后的 Solver 优势 $\\alpha \\cdot h(A^{\\pi_{Solver}})$ 与轨迹级优势相加，得到最终的 Token 级优势 $\\hat{A}_{i,t}$。\n        *   公式：$\\hat{A}_{i,t} = \\hat{A}^{outcome}_i + \\alpha \\cdot h(A^{\\pi_{Solver}}_{i,t})$。\n\n3.  **输出（Output）：**\n    *   **策略更新：** 使用融合后的优势 $\\hat{A}_{i,t}$ 作为权重，通过 GRPO 的 Clipped Surrogate Objective 更新 LLM 参数 $\\theta$。\n    *   **结果：** LLM 学习到哪些动作能真正推进游戏进程，而不仅仅是模仿最终获胜的轨迹。\n\n---\n\n### § 6 核心数学推导\n\nCAST 的理论核心在于证明：**最大化 Solver Advantage 等价于无 Logit 的 On-Policy Distillation (OPD)**。这意味着我们不需要求解器提供完整的动作概率分布（Logits），仅凭标量优势值即可实现知识蒸馏。\n\n**1. 理论背景：Soft-Optimal Solver 假设**\n假设求解器是一个“软最优”策略（Soft-Optimal Policy），其动作概率遵循 Boltzmann 分布：\n$$ \\pi_{Solver}(a|s) \\propto \\exp\\left(\\frac{Q^{\\pi_{Solver}}(s,a)}{\\tau}\\right) $$\n其中 $\\tau$ 是温度参数。取对数后，Solver 的 Log-Preference 与 Q-Value 线性相关。\n\n**2. 核心恒等式：Advantage 即 Log-Preference**\n在 RL 中，Advantage 定义为 $A^{\\pi}(s,a) = Q^{\\pi}(s,a) - V^{\\pi}(s)$。\n对于 Soft-Optimal Solver，可以推导出：\n$$ A^{\\pi_{Solver}}(s,a) = \\tau \\log \\pi_{Solver}(a|s) + C(s) $$\n**Intuition：** 这一步至关重要。它表明，Solver 对某个动作的“偏好程度”（Log Probability）直接正比于该动作带来的“状态价值提升”（Advantage）。因此，标量 Advantage 已经编码了教师策略的分布信息。\n\n**3. 信号整形的泰勒展开**\nCAST 使用 $h(x) = \\text{asinh}(x)$ 对优势进行压缩。在大多数正常步骤中，优势值较小（$|A| \\lesssim 1$）。\n对 $\\text{asinh}(A+1)$ 在最优动作点（$A=0$）附近进行泰勒展开：\n$$ \\text{asinh}(A+1) \\approx \\text{asinh}(1) + \\frac{1}{\\sqrt{2}}A + O(A^2) $$\n忽略常数项（在 Policy Gradient 中会被 Baseline Invariance 抵消），整形后的信号近似为：\n$$ \\alpha \\cdot h(A) \\approx \\beta \\cdot A \\approx \\beta \\tau \\log \\pi_{Solver}(a|s) $$\n其中 $\\beta$ 是包含归一化系数的常数。\n**Intuition：** 经过整形，Solver 信号变成了教师策略 Log-Probability 的线性缩放版本。\n\n**4. 隐式目标函数推导**\nGRPO 的更新方向由优势加权决定。将上述近似代入 Policy Gradient 公式：\n$$ \\nabla_\\theta J \\propto \\mathbb{E} \\left[ \\nabla_\\theta \\log \\pi_\\theta(a|s) \\cdot (\\hat{A}^{outcome} + \\beta \\tau \\log \\pi_{Solver}(a|s)) \\right] $$\n利用交叉熵定义 $H(\\pi_\\theta, \\pi_{Solver}) = -\\mathbb{E}_{\\pi_\\theta}[\\log \\pi_{Solver}]$，第二项可以重写为：\n$$ \\beta \\tau \\mathbb{E} \\left[ \\nabla_\\theta \\log \\pi_\\theta(a|s) \\cdot \\log \\pi_{Solver}(a|s) \\right] = -\\beta \\tau \\nabla_\\theta \\mathbb{E}_{s \\sim d^{\\pi_\\theta}} [H(\\pi_\\theta(\\cdot|s), \\pi_{Solver}(\\cdot|s))] $$\n**结论：** CAST 的隐式优化目标是：\n$$ \\max_\\theta \\left( \\mathbb{E}[R_{task}] - \\beta \\tau \\mathbb{E}[H(\\pi_\\theta, \\pi_{Solver})] \\right) $$\n**Intuition：** 这证明了 CAST 同时在最大化任务奖励和最小化学生策略与教师策略之间的交叉熵。由于交叉熵 $H(\\pi_\\theta, \\pi_{Solver}) = KL(\\pi_\\theta || \\pi_{Solver}) + H(\\pi_\\theta)$，最小化交叉熵不仅拉近了分布（KL 散度），还降低了学生策略的熵（Mode-Seeking），使其更自信地模仿教师。这就是“Logit-Free Distillation”的数学本质。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n在长视界游戏（Long-horizon Games）中，基于稀疏最终奖励的 RLVR（Reinforcement Learning with Verifiable Rewards）面临严重的 Credit Assignment 问题，无法区分哪些中间决策导致了成功或失败。现有的密集信号方法（如搜索或过程奖励模型）计算成本高或准确性不足。如何利用低成本、高精度的游戏求解器提供细粒度的回合级指导？\n\n**2. 设计了什么实验验证这个问题？**\n*   **基准对比（In-Domain \u0026 Unseen-Difficulty）：** 在 Sokoban、Minesweeper 和 Rush Hour 三个经典游戏中，对比 CAST 与 Outcome-only RLVR 基线（GRPO, GSPO, DAPO）以及 Process-level 基线（GiGPO）。评估指标为 Avg@4 成功率。\n*   **零样本泛化（Zero-Shot OOD Transfer）：** 将在游戏中训练好的 Agent 直接迁移到未见过的领域（ALFWorld 和 WebShop），验证其是否学到了通用的推理和规划能力，而非过拟合特定游戏。\n*   **消融实验（Ablation Studies）：** 验证 Solver Advantage 权重 $\\alpha$、asinh 变换和 RMS 归一化的必要性。\n*   **效率与实用性分析：** 测量求解器查询带来的额外计算开销，并测试使用学习型价值网络（Learned Value Network）替代精确求解器的效果。\n\n**3. 问题的答案是什么？**\n*   **性能提升：** CAST 在所有三个游戏的 In-Domain 和 Unseen-Difficulty 设置下均取得了最佳性能，显著优于 Outcome-only 基线和 GiGPO。特别是在 Minesweeper 上，ID 性能提升了 14.9%。\n*   **样本效率：** CAST 达到 DAPO 峰值性能所需的训练步数减少了 1.7-2.0 倍。\n*   **泛化能力：** 在 ALFWorld 和 WebShop 上，CAST 实现了最高的零样本平均成功率，证明求解器指导有助于学习可迁移的规划能力。\n*   **低开销：** 求解器查询仅占训练总时间的 73 ppm（百万分之七十三），开销可忽略不计。\n*   **可扩展性：** 即使使用近似的学习型价值网络替代精确求解器，CAST 仍能保持大部分性能增益，表明该方法不仅限于有精确求解器的场景。", "additional_insights": "### § 8 Take-aways\n\nCAST 方法的核心洞察是将游戏求解器（Game Solver）的状态价值变化转化为 Turn-Level 的 Credit Assignment 信号，从而解决长视界游戏中稀疏奖励导致的 Credit Assignment 难题。通过定义 Solver Advantage（即动作前后的 Cost-to-Go 差值），CAST 将原本仅依赖最终胜负的 Outcome-only RLVR 转化为包含细粒度过程监督的训练范式。理论分析证明，在 Soft-Optimal Solver 假设下，最大化 Solver Advantage 等价于无需 Teacher Logits 的 On-Policy Distillation（OPD），这消除了传统蒸馏对完整动作分布的需求，仅依赖标量价值即可实现策略对齐。为了应对求解器信号中存在的极端值（如死局惩罚）和跨游戏尺度差异，CAST 引入了 asinh 压缩变换和 Batch-level RMS 归一化，确保了训练梯度的稳定性。实验表明，在 Sokoban、Minesweeper 和 Rush Hour 等经典游戏中，CAST 在 In-Domain 和 Unseen-Difficulty 设置下均优于 GRPO、DAPO 等基线方法，且训练效率提升 1.7–2.0 倍。此外，CAST 具备显著的零样本泛化能力，在 ALFWorld 和 WebShop 等未见过的 Agent 任务中取得了最高的平均成功率，证明了从结构化游戏中学习到的规划与纠错能力可迁移至开放域任务。求解器查询带来的计算开销极小（仅占训练步骤时间的 73 ppm），且当精确求解器不可用时，使用学习到的 Value Network 作为近似求解器仍能保留大部分性能增益，增强了方法的实用性。\n\n### § 9 最脆弱的假设\n\nCAST 方法最脆弱且关键的假设是 **Soft-Optimal Solver Assumption**（即求解器遵循最大熵策略，其动作概率与动作价值呈指数关系，见 Assumption C.1）。这一假设是连接“Solver Advantage”与“On-Policy Distillation”的理论桥梁：只有当求解器被视为 Soft-Optimal 时，Solver Advantage 才能被严格解释为 Teacher 的 Log-Preference，从而证明最大化该优势等价于最小化学生策略与求解器策略之间的 Cross-Entropy。如果求解器并非 Soft-Optimal（例如，它是一个确定性的、非平滑的启发式搜索算法，或者其价值估计存在系统性偏差），那么 Solver Advantage 就不再准确反映策略分布的对数概率，此时 CAST 的优化目标将偏离真正的蒸馏目标，可能导致学生策略学习到错误的动作偏好或陷入局部最优。在实际中，许多经典游戏求解器（如 A* 搜索）是确定性的，并不天然具备 Soft-Optimal 的平滑概率分布特性；虽然论文通过引入温度参数 $\\tau$ 强行构建这一映射，但这更多是一种理论上的近似而非求解器的固有属性。论文提供的证据主要依赖于理论推导（Theorem 2.1）以及在三个特定游戏上的实验验证，但缺乏对求解器偏离 Soft-Optimal 程度（如温度 $\\tau$ 的敏感性或分布拟合误差）的定量分析，也未在求解器质量较差或具有强启发式偏差的环境中测试该假设失效时的鲁棒性。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 CAST 在 **Sokoban** 游戏上的核心机制，以验证“Solver Advantage 信号是否比 Outcome-only 信号提供更有效的梯度方向”。具体方案如下：使用开源的 Sokoban 环境（如 `gym-sokoban`）和一个轻量级求解器（如基于 A* 的求解器，计算 Cost-to-Go $N(s)$）。选取一个固定的、中等难度的 Sokoban 关卡，使用一个预训练的 LLM（如 Qwen2.5-1.5B 或更小模型）作为策略网络 $\\pi_\\theta$。实现两个训练循环：1) **Baseline**：仅使用最终的 0/1 稀疏奖励进行 GRPO 训练；2) **CAST**：在每一步计算 Solver Advantage $A = N(s_t) - N(s_{t+1})$，应用 asinh 变换和 RMS 归一化后，将其加权加入 GRPO 的优势函数中。测量指标为：在相同训练步数（如 100-200 steps）下，两个策略在验证集上的成功率（Success Rate）以及训练过程中的 Reward 曲线。如果 CAST 策略在早期训练阶段（如前 50 步）的成功率显著高于 Baseline，且 Reward 曲线更平滑、方差更小，则支持了 CAST 提供的 Turn-Level 信号能有效缓解 Credit Assignment 问题并加速收敛的 Claim。反之，如果两者性能无显著差异或 CAST 表现更差，则可能暗示在该小规模设置下，Solver 信号的噪声或缩放问题未被充分解决，或者稀疏奖励本身已足够提供有效梯度。此实验无需复现完整的 DAPO 框架或大规模分布式训练，仅需验证核心信号注入机制的有效性。", "research_value": "### § 11 最强反例设计\n\n若要挑战 CAST 的有效性，最有力的攻击并非质疑其性能提升，而是攻击其**理论解释的因果性**与**泛化机制的独立性**。具体而言，可以设计一个“解耦实验”来证明 CAST 的性能增益并非源于其声称的“On-Policy Distillation”或“Credit Assignment”，而是源于**隐式的课程学习（Implicit Curriculum Learning）**或**状态空间修剪（State Space Pruning）**。\n\n**实验设计：随机价值噪声对照（Random Value Noise Control）**\n构建一个对照组，其中不使用真实的 Game Solver 计算 $N(s)$，而是使用一个**随机游走策略（Random Walk Policy）**或**均匀分布的价值函数**来生成伪优势信号 $A^{noise}$。关键在于，这个伪信号必须经过与 CAST 完全相同的信号整形流程（Shift, asinh, RMS Normalization），以确保其统计特性（均值、方差、分布形态）与真实 Solver Advantage 高度相似，但**不包含任何关于“最优路径”的信息**。\n\n**预期结果与攻击逻辑：**\n1.  **若 CAST 显著优于 Random Noise 对照组**：这支持了 CAST 的有效性，但攻击者可以进一步指出，这种优势可能仅来自于**梯度稳定化**。因为 Solver 提供的信号是平滑且低方差的，而 Outcome-only 奖励是高方差的。攻击者可以提出，任何低方差、平滑的标量信号（如基于启发式距离的简单线性函数，而非精确求解器）都能达到类似效果，从而削弱“Solver Advantage 等价于 Distillation”这一复杂理论解释的必要性。\n2.  **若 CAST 与 Random Noise 对照组性能相当**：这是最致命的反例。它表明 LLM 的性能提升并非来自于学习“正确的动作偏好”（即 Distillation），而是来自于**信号的存在本身**。Solver 信号可能仅仅起到了**正则化（Regularization）**或**探索引导（Exploration Guidance）**的作用，通过提供密集的反馈信号减少了策略更新的方差，或者通过惩罚“死局”状态隐式地修剪了搜索空间。在这种情况下，CAST 的理论核心——即最大化 Solver Advantage 等价于最小化 Cross-Entropy——就是错误的，因为随机噪声并不对应任何有意义的 Teacher Policy。\n\n**理论攻击：Soft-Optimal 假设的失效边界**\n在理论层面，攻击者可以指出 **Soft-Optimal Solver Assumption** 在离散、确定性游戏（如 Sokoban）中是根本性错误的。A* 等求解器是确定性的，其“价值”是整数步数，不存在平滑的概率分布。CAST 强行通过 $\\tau$ 参数构建 Boltzmann 分布是一种**事后合理化（Post-hoc Rationalization）**。攻击者可以证明，在状态空间存在大量局部最优解（Local Optima）的游戏中，Solver 的 $N(s)$ 变化可能误导 LLM 走向局部最优，而 Outcome-only 奖励虽然稀疏，但通过大规模采样可能更有效地跳出局部最优。因此，CAST 在复杂、多解空间中可能表现出**过拟合求解器路径（Overfitting to Solver Path）**，导致在未见过的难度或变体中泛化能力下降，而非提升。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“静态求解器蒸馏”到“动态价值对齐”：基于逆强化学习的 LLM 策略鲁棒性增强**\n\n**（a）驱动局限与未满足需求**\nCAST 的核心局限在于其依赖**静态、精确的 Game Solver**，这限制了其在开放世界、部分可观测或无精确求解器的环境中的应用。此外，CAST 的“Logit-Free Distillation”本质上是让学生策略模仿求解器的**确定性最优路径**，这可能导致策略**缺乏鲁棒性（Lack of Robustness）**和**多样性（Diversity）**。在真实世界中，最优路径往往不是唯一的，且环境存在噪声。CAST 训练的 Agent 可能变得“脆弱”，一旦偏离求解器路径就难以恢复。因此，我们需要一种方法，不仅学习“如何赢”，还要学习“在偏离时如何恢复”，即学习**价值函数的鲁棒性**，而非仅仅模仿动作。\n\n**（b）借鉴相邻领域的方法**\n借鉴**逆强化学习（Inverse Reinforcement Learning, IRL）**和**偏好学习（Preference Learning）**中的**Dagger（Dataset Aggregation）**思想，以及**多智能体强化学习（MARL）**中的**对手塑造（Opponent Shaping）**概念。具体而言，不直接使用 Solver 的标量优势，而是将 Solver 视为一个**动态的、可交互的“价值教师”**。我们不再假设 Solver 是 Soft-Optimal 的，而是假设 Solver 提供了一个**价值函数的上界（Upper Bound）**。我们引入一个**价值对齐损失（Value Alignment Loss）**，该损失不仅惩罚与 Solver 价值的偏差，还鼓励策略在**价值等高线（Value Contours）**上的平滑性，从而学习到一个**鲁棒的价值函数**，而非单一的最优路径。\n\n**（c）第一个实验设计**\n**实验名称：Robust-CAST：在扰动环境下的价值对齐训练**\n\n1.  **环境设置**：使用 Sokoban 和 Minesweeper，但引入**环境扰动（Environmental Perturbations）**，例如随机移动箱子、隐藏部分地雷信息，或增加动作执行噪声。这些扰动使得精确求解器失效或计算成本极高。\n2.  **方法对比**：\n    *   **CAST**：使用原始 CAST 方法，依赖精确求解器。\n    *   **Robust-CAST**：不使用精确求解器，而是训练一个**学习型价值网络（Learned Value Network, LVN）**，该网络通过**对比学习（Contrastive Learning）**从 Solver 生成的轨迹中学习价值函数。在训练 LLM Agent 时，使用 LVN 提供的**价值梯度（Value Gradient）**作为优势信号，并引入**熵正则化（Entropy Regularization）**以鼓励探索。\n    *   **Baseline**：Outcome-only RLVR。\n3.  **评估指标**：\n    *   **鲁棒性（Robustness）**：在扰动环境下的成功率。\n    *   **恢复能力（Recovery）**：当 Agent 被强制偏离最优路径后，重新回到成功轨迹所需的步数。\n    *   **泛化性（Generalization）**：在未见过的扰动类型下的表现。\n4.  **预期结果**：Robust-CAST 在扰动环境下的表现应显著优于 CAST，因为 CAST 过拟合了精确求解器的路径，而 Robust-CAST 学习到了更通用的价值函数。这将证明，从“模仿求解器”转向“对齐价值函数”是提升 LLM Agent 鲁棒性的关键方向。\n\n**与已有工作的区别**：\nCAST 关注的是**Credit Assignment**，即如何分配稀疏奖励。Robust-CAST 关注的是**Value Robustness**，即如何学习一个在扰动下依然有效的价值函数。CAST 依赖精确求解器，Robust-CAST 依赖学习型价值网络，从而摆脱了对精确求解器的依赖。CAST 的理论基础是 Distillation，Robust-CAST 的理论基础是 Value Alignment 和 Robust RL。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Yu Wang\",\n      \"affiliations\": [\n        1,\n        4\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Yi-Kai Zhang\",\n      \"affiliations\": [\n        2,\n        4\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Wentao Shi\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Ziang Ye\",\n      \"affiliations\": [\n        1,\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yuchun Miao\",\n      \"affiliations\": [\n        3,\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yueqing Sun\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Qi Gu\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Xunliang Cai\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Lan-Zhe Guo\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Han-Jia Ye\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Fuli Feng\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"University of Science and Technology of China\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Nanjing University\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Wuhan University\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Meituan\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal contribution.\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding authors: guqi03@meituan.com and shiwentao123@mail.ustc.edu.cn.\"\n    }\n  ]\n}\n```", "summary_translation": "训练大型语言模型（LLMs）在长视界游戏中进行决策，是迈向通用决策能力的重要一步，然而基于可验证奖励的强化学习（RLVR）依赖于稀疏的最终奖励，这些奖励几乎无法揭示哪些决策决定了成功。更密集的过程信号可以提供缺失的回合级信用分配，但现有的信号来源难以同时兼顾低成本和高准确性。我们观察到，游戏求解器（game solver）状态值的变化能够揭示某个动作是否使状态向成功推进。基于这一洞察，我们提出了 CAST（Credit Assignment from Solver Teachers），它将状态值的变化转化为求解器优势（solver advantages），并将其作为回合级信号注入 RLVR。我们进一步证明，在软最优求解器假设下，最大化求解器优势等价于从求解器进行 on-policy 蒸馏，且仅需标量值而非教师模型的 logits。在 Sokoban、Minesweeper 和 Rush Hour 上，CAST 在域内和未见难度评估中均优于所有训练基线，并在 ALFWorld 和 WebShop 上实现了最高的平均零样本性能。我们的代码已开源：https://github.com/Wloner0809/CAST。"}]}], "2026-07-28": [{"name": "Agentic Frameworks \u0026 Automated Research", "count": 4, "papers": [{"title": "AgentOmnia: Scaling Agentic Models for Full-Scenario Applications", "arxiv_id": "2607.23124", "authors": "Hao Jiang, Gangtao Xin, Yingdi Huang, Guojie Zhu, Jiangshan Zhang, Xinyuan Lin, Yunkun Xu, Chengyu Shen, Wenlong Fei, Jiawei Li, Yujie Fu, Sichen Kang, Tingyu Xie, Yedi Hu, Jingren Zhang, Hongcheng Gao, Jianshu Zeng, Chong Chen, Chang Guo, Chao Feng, Feng Wang, Fulin Lin, Jinchao Ma, Lang Mei, Li Huang, Liyan Liu, Qing He, Shuting Tao, Siyu Mo, Xiangnan Chen, Xiaohan Yu, Xiaoyang Li, Yanheng Hou, Yanyu Wu, Zhihan Yang, Wentao Zhang, Yang Gao, Zhao Cao", "summary": "Large language model agents have advanced rapidly, yet progress remains fragmented across domains, capabilities, task difficulty, and interaction settings. We frame this as full-scenario agentic scaling and present AgentOmnia, a framework coordinating task-space definition, data synthesis, post-training, evaluation, and improvement across To-Consumer (ToC), To-Business (ToB), and To-Employee (ToE) applications. An extensible Domain x Capability x Atomic Difficulty taxonomy aligns these stages and enables fine-grained diagnosis with OmniaBench. AgentOmnia combines bidirectional environment-task synthesis with tool-dependency, program-structured, and solver-based pipelines, constructing 5,018 stateful environments with 255,375 tools and 52,361 tasks. Programs, solvers, and verifiers provide correctness signals, while supervised fine-tuning, online agentic reinforcement learning, and a rollback curriculum support post-training. Evaluation failures translate into Product Requirement Documents (PRDs) for targeted self-evolution. Starting from Qwen3-30B-A3B-Thinking-2507, AgentOmnia raises the pass rate on the OmniaBench challenging subset from 9.16% to 37.11% and the macro-average across OmniaBench, $τ^2$-Bench, DeepPlanning, and VitaBench from 22.86% to 41.69%. Under a unified protocol,it leads the evaluated agentic post-trained baselines on OmniaBench and retains the highest four-benchmark macro-average. It also surpasses Qwen3-235B-A22B-Thinking-2507 on all four benchmarks and exceeds Qwen3.5-35B-A3B on the macro-average. Gains span three application splits, ten capability dimensions, eight atomic-difficulty factors, and 76 of 90 level-1 domains, indicating broad rather than category-specific improvement. A one-round study provides initial evidence for PRD-guided self-evolution, motivating validation at larger scales and in industrial settings.", "category": "cs.CL", "cluster": "Agentic Frameworks \u0026 Automated Research", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Self-Evolving/Self-Improving, LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是 **full-scenario agentic scaling**（全场景智能体扩展），即如何在 To-Consumer (ToC)、To-Business (ToB) 和 To-Employee (ToE) 等异构应用场景中，实现智能体在领域覆盖、执行能力、任务难度及交互模式上的系统性、可扩展进步。当前大语言模型智能体（LLM Agents）的发展虽然迅速，但进展呈现碎片化特征：现有基准测试通常局限于特定的领域、平台或交互协议，导致模型在单一基准上的高分无法保证其在异质现实应用中的可靠运行。例如，一个在特定工具生态中表现良好的模型，可能在涉及状态跟踪、约束维护、文档操作或错误恢复的其他场景中表现不佳。\n\n这一问题的重要性在于，真实的智能体应用需要处理可变状态、领域规则、文件、结构化数据以及长程交互，这远超简单的工具调用轨迹收集。解决该问题能带来以下价值：首先，它建立了一个统一的 **Domain × Capability × Atomic Difficulty** 三维分类法，为数据构建、训练和诊断提供了共享的坐标系，解决了现有评估缺乏细粒度诊断能力的问题；其次，通过 **AgentOmnia** 框架，实现了从任务空间定义、数据合成、后训练到基于 **Product Requirement Documents (PRDs)** 的自我演化的闭环，使得智能体能够针对诊断出的弱点进行针对性改进；最后，该方法证明了在统一评估协议下，智能体可以在广泛的领域和能力维度上获得普遍提升，而非仅在特定类别中优化，从而为构建真正通用的、工业级可用的智能体奠定了基础。\n\n### § 2 前人工作与不足\n\n尽管前人在智能体基准测试、环境合成及强化学习方面取得了显著进展，但仍存在关键不足，主要体现在覆盖范围、任务复杂性建模及从失败中学习的能力上。\n\n在基准测试与环境合成方面，**AgentBench** [7]、**WebArena** [8]、**OSWorld** [10] 等工作主要关注 Web、GUI 或操作系统层面的交互，而 **SWE-bench** [90]、**WorkArena** [24] 等则聚焦于软件修复或特定企业工作流。这些基准通常局限于单一领域或交互协议，缺乏跨 ToC/ToB/ToE 的统一视角。在数据合成上，**ToolAlpaca** [93]、**APIGen** [94] 早期工作主要合成孤立的 API 调用，缺乏对持久状态和长程交互的支持。近期的 **AgentScaler** [52]、**EnvScaler** [30] 和 **Agent World Model** [20] 虽然通过程序化合成构建了可执行环境，但往往侧重于环境本身的规模扩展，或在任务生成上依赖简单的工具依赖图，难以覆盖涉及全局约束优化和复杂逻辑推理的高难度任务。例如，**Agent-World** [19] 虽然展示了大规模环境合成的潜力，但其任务生成机制在应对需要全局规划（如资源分配、调度）的场景时，缺乏基于求解器（Solver）的严格验证机制，导致任务难度和正确性信号不足。\n\n在训练与自我演化方面，现有的智能体强化学习（Agentic RL）方法如 **GRPO** [63]、**MUA-RL** [42] 主要关注策略优化，但往往面临“全失败”（all-fail）任务缺乏有效学习信号的问题。传统的模仿学习（Imitation Learning）容易继承教师模型的局限性，而标准的在线强化学习在任务难度超出模型当前能力时，由于奖励信号稀疏或为零，难以收敛。此外，现有的自我演化系统如 **Reflexion** [45]、**AgentEvolver** [48] 多依赖于语言层面的反思或简单的反馈循环，缺乏将评估失败转化为结构化、可执行的数据合成指令（如 PRD）的机制。这意味着它们难以将诊断出的具体能力缺口（如多工具组合中的参数传递错误）精确映射到新的训练数据构建中，导致改进过程缺乏可控性和针对性。\n\n综上所述，前人工作的不足在于：1）缺乏统一的全场景分类体系，导致数据、训练和评估无法对齐；2）任务合成难以平衡覆盖率、难度和正确性，特别是缺乏对全局约束优化任务的支持；3）缺乏从硬失败中提取有效信号并转化为针对性训练数据的闭环机制。AgentOmnia 通过引入双向环境-任务合成、基于求解器的任务管道以及 PRD 引导的自我演化，旨在克服这些限制。", "core_insight": "### § 3 重建作者的思考路径\n\n在 AgentOmnia 出现之前，LLM Agent 的研究主要面临“碎片化”与“不可控”的双重困境。早期的 Agent 训练多依赖于静态的 Tool-Use 数据（如 ToolAlpaca）或孤立的 Benchmark（如 WebShop, SWE-bench），这些方法虽然提升了单一场景下的表现，但缺乏统一的坐标系来衡量模型在 ToC（消费者）、ToB（商业）和 ToE（员工）等不同场景下的通用能力。研究者观察到，一个在代码生成上表现优异的模型，可能在复杂的跨系统状态管理（State Management）或长程规划（Long-horizon Planning）中彻底失效，且这种失效往往难以归因——是因为缺乏特定领域的知识，还是因为推理链条断裂？\n\n现有的数据合成方法（如 Agent-World, EnvScaler）虽然引入了可执行环境，但大多采用“环境驱动”的单向合成：先构建环境，再生成任务。这种方式导致任务难度分布不均，且难以针对模型的特定弱点（如多源信息冲突、模糊目标理解）进行定向增强。同时，传统的强化学习（RL）在面对高难度 Agent 任务时，由于奖励信号稀疏且探索空间巨大，模型极易陷入“全失败”（All-fail）状态，导致梯度消失或训练崩溃。\n\n此外，工业界对 Agent 的需求是动态演进的，但学术界缺乏一种机制将“评估失败”转化为“训练数据”。现有的自我进化方法（如 Reflexion, AgentEvolver）多依赖语言层面的反思，缺乏对底层执行环境和任务结构的精确控制。因此，研究者意识到，要突破当前瓶颈，必须建立一个闭环系统：首先定义一个细粒度的、可扩展的任务空间坐标系（Taxonomy），以此指导双向的环境-任务合成；其次，引入“弱到强”（Weak-to-Strong）的监督信号，利用程序、求解器（Solver）和特权信息（Privileged Guidance）生成高质量轨迹，解决高难度任务的监督数据稀缺问题；最后，借鉴工业界的 PRD（Product Requirement Document）概念，将评估诊断结果结构化，指导下一轮的数据合成与模型迭代，从而实现从“静态训练”到“动态自进化”的跨越。\n\n### § 4 核心 Intuition\n\nAgentOmnia 的核心直觉在于将 Agent 的能力提升从“盲目扩大数据规模”转变为“基于细粒度坐标系的定向增强”。通过建立 Domain × Capability × Atomic Difficulty 的三维坐标系，研究者能够精确诊断模型在特定场景、能力维度和难度因子上的短板，并利用双向合成机制生成针对性极强的训练数据。\n\n关键在于引入“特权引导”（Privileged Guidance）和“回滚课程学习”（Rollback Curriculum RL），这使得模型能够在无法独立解决的高难度任务中，借助外部求解器或结构化提示获得正确的执行轨迹，从而突破传统 RL 在稀疏奖励下的探索瓶颈。最终，通过 PRD 机制将评估失败转化为结构化的合成指令，形成了一个可解释、可追踪的自进化闭环，确保模型能力的提升是全面且可控的，而非仅在特定 Benchmark 上的过拟合。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nAgentOmnia 的核心方法是一个基于 **Full-Scenario Taxonomy**（全场景分类法）的闭环框架，旨在解决 Agent 在不同领域（ToC/ToB/ToE）、能力和难度下的泛化问题。其 Pipeline 包含数据合成、后训练（Post-Training）和基于 PRD 的自我进化三个主要阶段。\n\n以下以 **“在复杂企业系统中，根据多源冲突数据筛选最佳供应商并生成报告”** 为例，展示完整的 Pipeline：\n\n#### 1. 任务空间定义与数据合成 (Data Synthesis)\n*   **输入**：基于分类法坐标 `(Domain: ToB/Procurement, Capability: Data Analysis \u0026 Planning, Difficulty: Multi-source Inconsistency)`。\n*   **环境合成 (Environment Synthesis)**：\n    *   系统从种子数据（如 API 规范、业务文档）中挖掘，构建一个可执行的 Python 环境 `E`。\n    *   定义状态空间 `S`（包含供应商列表、库存、价格历史）和工具集 `T`（如 `get_supplier_info`, `check_inventory`, `calculate_cost`）。\n    *   **验证**：通过单元测试和双 Agent 滚动测试，确保环境状态转换一致且无逻辑错误。\n*   **任务合成 (Task Synthesis)**：\n    *   采用 **Solver-Based Synthesis**（求解器引导合成）。首先定义优化目标（最小化成本，满足质量约束），使用真实求解器（Solver）生成最优解作为 Ground Truth。\n    *   构造初始状态 `s0`，故意引入“多源不一致”（例如：API 返回的价格与文档中的价格冲突）。\n    *   生成任务描述 `D`：“请找出符合质量要求且总成本最低的供应商组合，并解释选择理由。”\n*   **轨迹合成 (Trajectory Synthesis)**：\n    *   由于任务困难，直接让 Teacher Model 滚动可能失败。系统引入 **Capability-Aware Privileged Guidance**（能力感知特权引导）。\n    *   **规划导向引导**：提示 Teacher Model 先构建线性规划模型，再求解。\n    *   Teacher Model 在引导下生成轨迹 `ξ`，系统通过 **Evidence Grounding** 检查，确保推理步骤仅基于可观察证据，剔除特权信息泄露。\n\n#### 2. 代理后训练 (Agentic Post-Training)\n*   **SFT 冷启动 (SFT Capability Bootstrapping)**：\n    *   将上述验证通过的轨迹 `ξ` 格式化为 SFT 样本。\n    *   使用 **Convergence-Aware Sample Budgeting** 平衡不同来源数据的采样比例，确保模型在复杂推理和简单工具调用上均衡学习。\n*   **强化学习 (Reinforcement Learning)**：\n    *   **奖励系统**：结合规则奖励（如 JSON 格式正确性）和 Rubric 奖励（如是否解决了价格冲突、成本是否最优）。\n    *   **Rollback Curriculum RL (RCRL)**：\n        *   若模型在某个任务上完全失败（Reward=0），系统触发 **Rollback** 机制。\n        *   从 Golden Trajectory 中截取前缀（例如前 3 步正确的工具调用），作为 Prompt 的一部分重新生成后续步骤。\n        *   随着模型能力提升，逐渐缩短前缀长度，直至模型能从头完成整个任务。\n\n#### 3. PRD 引导的自我进化 (PRD-Guided Self-Evolution)\n*   **诊断与 PRD 生成**：\n    *   在 OmniaBench 评估中，发现模型在“多源不一致”场景下得分低。\n    *   诊断 Agent 分析失败轨迹，生成 **Product Requirement Document (PRD)**。\n    *   PRD 内容：“目标场景：采购；弱点：无法处理冲突数据；合成指导：增加更多价格冲突的测试用例，要求模型显式调用 `resolve_conflict` 工具。”\n*   **迭代合成与训练**：\n    *   根据 PRD 指导，合成新的环境和任务数据。\n    *   进行新一轮 SFT 和 RL 训练，形成闭环。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有提出全新的基础数学理论，而是对现有的强化学习算法（如 GRPO）进行了工程化和策略上的改进。其核心数学逻辑体现在 **Rollback-based Curriculum Reinforcement Learning (RCRL)** 的目标函数和奖励模型校准指标上。\n\n#### 1. RCRL 的混合训练目标\n为了在利用 Golden Prefix 加速收敛的同时，防止模型产生“前缀依赖”（即只会在有提示时才能工作），论文提出了一个混合损失函数：\n\n$$ \\mathcal{L} = \\lambda_{CE} \\mathcal{L}_{CE}(\\tau^*_{1:P_q}) + \\lambda_{RL} \\mathcal{L}_{RL}(\\tau_{P_q+1:L}) $$\n\n*   **Intuition**：\n    *   $\\mathcal{L}_{CE}$ 是交叉熵损失，作用于 Golden Prefix 部分（$\\tau^*_{1:P_q}$）。这强制模型学习如何复现正确的起始步骤，确保它“知道”正确的开头是什么。\n    *   $\\mathcal{L}_{RL}$ 是强化学习损失，作用于后续步骤（$\\tau_{P_q+1:L}$）。这鼓励模型在已知正确开头的基础上，通过探索找到最优的后续路径。\n    *   这种设计类似于“脚手架”教学：先扶着走（CE Loss），再放手跑（RL Loss），随着 $P_q$（前缀长度）动态减小，最终实现独立行走。\n\n#### 2. 奖励模型校准指标 (Reward Model Calibration)\n论文指出，传统的准确率不足以评估 Agent RL 中的奖励模型，因此提出了五个维度的校准指标，其中 **Advantage Direction Reliability** 尤为关键：\n\n$$ C_{Dir} = \\frac{1}{1 + \\lambda \\cdot \\text{AdvFPR} + \\text{AdvFNR}} $$\n\n*   **Intuition**：\n    *   在 RL 中，梯度更新的方向由 Advantage（优势值）的符号决定。如果奖励模型错误地给一个坏策略打了高分（AdvFPR，假阳性），或者给好策略打了低分（AdvFNR，假阴性），会导致梯度方向完全错误，模型性能崩溃。\n    *   该公式通过加权调和平均，惩罚符号错误。即使排名大致正确，如果符号翻转，$C_{Dir}$ 也会显著降低，从而筛选出更可靠的奖励模型。\n\n---\n\n### § 7 实验设计与结论\n\n#### 1. 全场景泛化能力验证\n*   **提出了什么问题**：现有的 Agent 模型往往在特定基准测试上表现良好，但在跨领域（ToC/ToB/ToE）、跨能力维度上存在严重的性能不平衡，缺乏真正的“全场景”泛化能力。\n*   **设计了什么实验验证这个问题**：\n    *   构建了 **OmniaBench**，一个基于 `Domain × Capability × Atomic Difficulty` 分类法的基准测试，包含 1,431 个任务。\n    *   同时使用三个外部基准测试：$\\tau^2$-Bench（交互）、DeepPlanning（长程规划）、VitaBench（生活服务）。\n    *   对比 AgentOmnia 与基础模型（Qwen3-30B）及其他 SOTA Agent 模型（如 Agents-A1, Nex-N2-Mini）在上述四个基准上的表现。\n*   **问题的答案是什么**：\n    *   AgentOmnia 在 OmniaBench 挑战集上的通过率从 9.16% 提升至 37.11%。\n    *   在四个基准的宏观平均分上达到 41.69%，超越了同规模的基础模型和大多数开源 Agent 模型。\n    *   关键发现：提升是**广泛分布**的，覆盖了 90 个一级领域中的 76 个，以及所有 10 个能力维度和 8 个难度因子，证明了其全场景泛化能力，而非针对单一任务的过拟合。\n\n#### 2. PRD 引导自我进化的有效性验证\n*   **提出了什么问题**：评估失败能否转化为结构化的指导信号（PRD），从而引导数据合成并实现模型的自我进化？\n*   **设计了什么实验验证这个问题**：\n    *   进行了一轮自我进化实验。\n    *   首先，利用 OmniaBench 的失败案例生成诊断报告和 PRD。\n    *   其次，根据 PRD 指导合成新的训练数据（121 个环境，804 个任务）。\n    *   最后，使用这些数据对 AgentOmnia 进行微调，得到 `AgentOmnia-evo`，并在 OmniaBench 和外部基准上评估其性能变化。\n*   **问题的答案是什么**：\n    *   `AgentOmnia-evo` 在 OmniaBench 挑战集上从 37.11% 提升至 38.49%。\n    *   在外部基准的平均分上从 43.22% 提升至 44.14%。\n    *   虽然提升幅度 modest（初步研究），但证明了 PRD 机制能有效将诊断信号转化为针对性的数据合成，并带来可测量的性能增益，验证了闭环自我进化的可行性。", "additional_insights": "### § 8 Take-aways\n\nAgentOmnia 的核心贡献在于提出了一套 **Full-Scenario Agentic Scaling** 框架，通过 **Domain × Capability × Atomic Difficulty** 的三维分类法（Taxonomy）统一了数据合成、训练、评估与诊断的坐标系统，解决了现有 Agent 评测中领域覆盖碎片化和能力诊断模糊的问题。该框架采用 **Bidirectional Environment–Task Synthesis** 策略，结合 **DAG-based**、**Program-based** 和 **Solver-based** 三种任务生成管线，构建了 5,018 个代码驱动的有状态环境（Stateful Environments）和 52,361 个任务，确保了从简单工具调用到复杂全局约束优化（如线性规划）的广泛覆盖。在训练范式上，AgentOmnia 引入了 **Weak-to-Strong Synthesis**，利用 **Privileged Guidance**（包括 Planning-oriented 和 Outcome-oriented 两种引导）辅助 Teacher Model 生成高质量轨迹，并通过严格的 **Evidence Grounding** 验证防止信息泄露，随后结合 **Supervised Fine-Tuning (SFT)** 和基于 **Rollback Curriculum Reinforcement Learning (RCRL)** 的在线强化学习，有效解决了长程任务中“全失败”样本无法提供梯度信号的问题。实验结果显示，基于 Qwen3-30B 的 AgentOmnia 在 OmniaBench 挑战集上的通过率从 9.16% 提升至 37.11%，且在 ToC/ToB/ToE 三大应用场景及所有能力维度上均实现了广泛而非局部的性能提升。此外，论文初步验证了 **PRD-Guided Self-Evolution** 机制，即将评估失败转化为结构化的 **Product Requirement Documents (PRDs)** 以指导针对性数据合成，在一轮迭代中实现了外部基准的泛化性能提升，展示了从评估诊断到数据合成的闭环自进化潜力。\n\n### § 9 最脆弱的假设\n\nAgentOmnia 最脆弱且关键的假设是：**通过程序、求解器（Solvers）和验证器（Verifiers）生成的“正确性信号”能够完全代理真实世界中复杂、动态且非确定性的用户意图与环境反馈，即合成数据的分布与真实工业场景中的长程交互分布具有足够的重叠度（Distributional Overlap）。**\n\n如果这一假设不成立，核心贡献将直接失效，因为 AgentOmnia 的性能提升主要依赖于大规模合成数据的质量，而非模型内在推理能力的突破。在实际中，该假设可能不成立的原因包括：1) **合成环境的简化偏差**：代码驱动的环境虽然可执行，但往往缺乏真实 API 的噪声、延迟、部分可观察性以及非结构化数据的复杂性，导致模型在合成环境中习得的策略在真实世界中泛化能力差（Sim-to-Real Gap）；2) **求解器引导的局限性**：Solver-based 任务依赖于明确的数学约束和优化目标，但真实业务场景（如 ToB/ToE）中的许多决策涉及模糊的社会规范、隐性偏好或非量化因素，无法被形式化为求解器可处理的约束，导致合成任务无法覆盖真实的“模糊性”难点；3) **Privileged Guidance 的泄露风险**：尽管论文声称通过 Evidence Grounding 验证防止泄露，但在长程多步推理中，Teacher Model 可能隐式地利用了引导信息中的逻辑捷径，导致 SFT 阶段学到的策略依赖于这些“作弊”信号，而在无引导的推理阶段失效。\n\n论文提供的证据主要局限于合成环境内部的验证（如状态一致性检查、求解器结果匹配）以及在 OmniaBench 等合成基准上的表现。虽然论文展示了在外部基准（如 DeepPlanning, VitaBench）上的提升，但这些基准本身也多为结构化或半结构化任务，缺乏对完全开放、非确定性真实工业工作流的测试。论文缺少在真实生产环境（如实际的企业 ERP 系统或复杂的客户服务对话日志）中进行端到端部署和评估的证据，因此无法证明合成数据分布与真实分布的重叠度足以支撑其“全场景”声称。\n\n### § 10 最小复现实验\n\n如果只有一周时间，建议复现 **PRD-Guided Self-Evolution** 中的 **Diagnosis-to-Data Alignment** 环节，以验证“评估失败能否有效转化为针对性的合成数据分布”这一核心 claim，而不需复现完整的训练和 RL 流程。\n\n**具体方案：**\n1.  **数据准备**：使用论文公开的 **OmniaBench** 挑战集（或其中一部分，如 100 个任务）和基础模型（如 Qwen3-30B-A3B-Thinking-2507）。\n2.  **实现诊断模块**：复现论文 Section 6.1 中的 **Diagnosis Report Generation** 流程。让 LLM 对基础模型在 OmniaBench 上的失败案例进行分析，生成结构化的 **PRDs**（包含目标场景、能力缺口、合成指导）。\n3.  **实现合成模块**：根据生成的 PRDs，使用论文描述的 **Task Synthesis** 管线（简化版，仅使用 DAG-based 或 Program-based 中的一种）生成一批新的合成任务数据。\n4.  **测量指标**：计算 **PRD-guided synthetic data** 的领域/能力分布与 **Diagnosis-Derived Failure Data**（即原始失败任务的分布）之间的 **KL Divergence**（如论文 Figure 18 所示）。同时，对比 **Original Post-Training Data** 与失败分布的 KL Divergence。\n5.  **支持/反驳标准**：\n    *   **支持**：如果 PRD-guided 数据的 KL Divergence 显著低于 Original Data 的 KL Divergence（如论文报告的 0.196 vs 0.603），则证明 PRD 机制能有效将合成数据导向模型的弱点领域。\n    *   **反驳**：如果两者 KL Divergence 无显著差异，或 PRD 生成的数据分布与失败分布依然高度不匹配，则说明诊断到合成的转化机制失效，PRD 未能准确捕捉或引导针对弱点的合成，从而质疑整个自进化闭环的有效性。\n\n此实验无需进行昂贵的模型训练，仅需 LLM 推理和简单的统计分析，即可验证 AgentOmnia 自进化机制中最关键的“诊断-合成”对齐假设。", "research_value": "### § 11 最强反例设计\n\n若要挑战 **AgentOmnia** 的有效性，最有力的攻击并非质疑其合成数据的规模，而是攻击其核心假设：**Solver-based Ground Truth 与真实世界复杂决策之间的等价性（Equivalence）**。具体而言，可以设计一个名为 **\"Ambiguity-Induced Hallucination in Constraint Relaxation\"** 的反例实验。\n\n**理论论证与场景设计：**\nAgentOmnia 依赖 **Solver-based Synthesis** 生成具有明确数学最优解的任务（如线性规划、资源调度）。然而，真实 ToB/ToE 场景中的许多高价值任务并非“有唯一解的优化问题”，而是“多目标权衡下的模糊决策”（例如：在供应商选择中，除了成本和质量，还涉及长期合作关系、政治风险、隐性合规要求等无法被形式化为硬约束的软因素）。\n\n**具体反例实验：**\n1.  **构造“软约束”陷阱任务**：构建一组任务，其表面结构符合 AgentOmnia 的合成规范（有明确的 API 和状态空间），但 Ground Truth 的生成逻辑故意引入 **Non-Formalizable Heuristics**（不可形式化的启发式规则）。例如，任务要求“选择最佳供应商”，Solver 给出的最优解是成本最低的供应商 A，但真实业务逻辑（作为隐藏 Ground Truth）要求排除供应商 A，因为其所在地区的近期地缘政治风险导致供应链不稳定（这一信息存在于非结构化的新闻文档中，而非结构化 API 中，且无法通过简单的 `check_inventory` 工具获取）。\n2.  **评估“过度拟合求解器逻辑”**：让 AgentOmnia 在这些任务上运行。由于训练数据中大量使用 Solver 生成的轨迹，模型会强烈倾向于寻找满足所有显式约束的数学最优解。\n3.  **预期结果与攻击点**：\n    *   AgentOmnia 将高置信度地选择供应商 A，因为它完美符合显式约束和 Solver 逻辑。\n    *   然而，在真实评估中，这被视为“失败”，因为模型未能处理 **Implicit Context**（隐性上下文）。\n    *   **替代解释**：AgentOmnia 在 OmniaBench 上的高分并非源于其泛化的推理能力，而是源于其对 **Formalizable Logic**（可形式化逻辑）的过度拟合。它学会了“如何像求解器一样思考”，而非“如何像人类专家一样在模糊中决策”。\n    *   **可预测的失败条件**：当任务中的关键决策因素无法被编码为 **Stateful Environment** 中的变量或 **Tool** 的返回值时，AgentOmnia 的 **Evidence Grounding** 机制将失效，因为它只能验证基于可观察证据的推理，而无法验证基于隐性知识的推理。这将证明其 **Full-Scenario** 声称仅覆盖了“可计算场景”，而遗漏了“可解释但不可计算场景”。\n\n### § 12 Follow-up Research Idea\n\n基于 AgentOmnia 在 **Sim-to-Real Gap**（仿真到现实的差距）和 **Formalizable vs. Ambiguous Tasks**（可形式化与模糊任务）上的局限，提出一个新的研究方向：**Cognitive-Alignment via Human-in-the-Loop Preference Optimization (CAL-HPO)**。\n\n**(a) 驱动局限与未满足需求：**\nAgentOmnia 的核心局限在于其 **Ground Truth** 来源于程序、求解器或验证器，这些信号是二元且确定的（Correct/Incorrect）。然而，真实世界智能体的核心价值往往体现在处理 **Ambiguity**（模糊性）和 **Value Alignment**（价值对齐）上，这些无法通过 Solver 验证。现有的 **PRD-Guided Self-Evolution** 仅能针对“错误”进行修复，无法针对“次优但合理”或“符合人类直觉但非数学最优”的行为进行优化。我们需要一种机制，让智能体不仅学会“做对”，还学会“做得像人”或“符合业务伦理”。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴 **Reinforcement Learning from Human Feedback (RLHF)** 和 **Constitutional AI** 中的 **Preference Modeling** 思想，但将其从“文本生成”领域迁移到“Agentic Trajectory”领域。具体而言，引入 **Trajectory-Level Preference Data**，即不再仅仅依赖 Solver 的布尔值奖励，而是收集人类专家对多条 Agent 轨迹的偏好排序（例如：轨迹 A 虽然成本略高，但解释了风险规避理由，优于轨迹 B 的纯数学最优解）。\n\n**(c) 第一个实验设计：**\n1.  **数据构建**：选取 AgentOmnia 中那些 Solver 判定为“正确”但人类专家判定为“缺乏业务洞察”的任务子集。邀请领域专家（如采购经理）对同一任务的多条 Agent 轨迹进行两两比较，标注偏好。\n2.  **模型训练**：训练一个 **Agentic Reward Model (ARM)**，该模型不仅预测任务完成度，还预测轨迹的“业务合理性”（Business Rationality）。\n3.  **优化目标**：在 AgentOmnia 的 **RCRL** 框架中，将原有的 **Rubric Reward** 替换或加权为 **ARM Score**。\n4.  **评估指标**：在 **OmniaBench** 之外，构建一个 **Human-Aligned Benchmark**，其中包含大量无唯一解的模糊任务。评估 Agent 在保持高任务通过率的同时，其轨迹的人类偏好得分（Human Preference Score）是否显著提升。\n5.  **与已有工作的区别**：不同于 AgentOmnia 的 **PRD-Guided Self-Evolution**（基于错误诊断的自动化数据合成），CAL-HPO 强调 **Human Preference** 作为核心信号，解决的是“正确性”之外的“合理性”和“对齐”问题，填补了从“可计算智能”到“可信赖智能”的空白。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "{\n  \"authors\": [\n    {\"name\": \"Hao Jiang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Gangtao Xin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yingdi Huang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Guojie Zhu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiangshan Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xinyuan Lin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yunkun Xu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Chengyu Shen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Wenlong Fei\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiawei Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yujie Fu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Sichen Kang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Tingyu Xie\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yedi Hu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jingren Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hongcheng Gao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jianshu Zeng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Chong Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Chang Guo\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Chao Feng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Feng Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Fulin Lin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jinchao Ma\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Lang Mei\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Li Huang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Liyan Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Qing He\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shuting Tao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Siyu Mo\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiangnan Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiaohan Yu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiaoyang Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yanheng Hou\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yanyu Wu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhihan Yang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Wentao Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yang Gao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhao Cao\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Huawei Cloud Post-Training Team\"}\n  ],\n  \"footnotes\": []\n}", "summary_translation": "大型语言模型智能体发展迅速，但在领域、能力、任务难度和交互设置方面的进展仍然分散。我们将此问题定义为全场景智能体扩展，并提出 AgentOmnia，这是一个协调任务空间定义、数据合成、后训练、评估和改进的框架，涵盖 To-Consumer (ToC)、To-Business (ToB) 和 To-Employee (ToE) 应用。可扩展的 Domain x Capability x Atomic Difficulty 分类体系将这些阶段对齐，并通过 OmniaBench 实现细粒度诊断。AgentOmnia 结合双向环境-任务合成与工具依赖、程序结构和求解器管道，构建了 5,018 个有状态环境，包含 255,375 个工具和 52,361 个任务。程序、求解器和验证器提供正确性信号，而监督微调、在线智能体强化学习和回滚课程支持后训练。评估失败转化为产品需求文档 (PRDs)，用于针对性自我进化。从 Qwen3-30B-A3B-Thinking-2507 开始，AgentOmnia 将 OmniaBench 挑战子集的通过率从 9.16% 提高到 37.11%，并将 OmniaBench、$τ^2$-Bench、DeepPlanning 和 VitaBench 的宏平均值从 22.86% 提高到 41.69%。在统一协议下，它在 OmniaBench 上领先于所有评估的智能体后训练基线，并保持最高的四基准宏平均值。它还在所有四个基准上超越 Qwen3-235B-A22B-Thinking-2507，并在宏平均值上超过 Qwen3.5-35B-A3B。提升涵盖三个应用划分、十个能力维度、八个原子难度因素和 90 个一级领域中的 76 个，表明这是广泛而非特定类别的改进。一轮研究为 PRD 引导的自我进化提供了初步证据，激励在更大规模和工业环境中进行验证。"}, {"title": "Co-Harness: Co-Evolving Harnesses and Model Weights for LLM Agents", "arxiv_id": "2607.22688", "authors": "Zhengyu Chen, Teng Xiao, Huaisheng Zhu, Yige Yuan, Luan Zhang, Jingang Wang", "summary": "Post-training agents for automated AI research requires optimizing not only model parameters, but also the runtime harness that shapes how research trajectories are generated, evaluated, and learned from. Existing pipelines typically train models under a fixed harness, including prompts, tools, skills, middleware, and memory, while leaving the data-generating process outside the optimization objective. This creates a mismatch between model updates and the static scaffolding that determines trajectory quality. We introduce Co-Harness, a framework that jointly optimizes the agent harness and model parameters during post-training. Co-Harness alternates between harness optimization and model optimization. An LLM-based HarnessCritic analyzes failed trajectories, identifies harness-level failure modes, and proposes validated local updates. The model is then fine-tuned on high-quality trajectories generated by the improved harness, distilling effective scaffolding into model parameters. A 200+ hour autonomous case study further shows that Co-Harness can recover from system crashes, improve inference efficiency, and discover ensemble strategies without human intervention. These results suggest that joint harness and model optimization is an effective way to improve agents beyond fixed-harness post-training.", "category": "cs.CL", "cluster": "Agentic Frameworks \u0026 Automated Research", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在大型语言模型（LLM）智能体的后训练（Post-training）过程中，如何联合优化模型参数（Model Weights）与运行时支撑系统（Agent Harness），以解决传统流水线中“静态脚手架”与“动态模型更新”之间的不匹配问题。现有的智能体训练范式通常将 Harness（包括 Prompts、Tools、Skills、Middleware 和 Memory）视为固定不变的基础设施，仅通过监督微调（SFT）或强化学习更新模型权重。这种不对称处理导致了一个关键瓶颈：Harness 决定了训练轨迹（Trajectories）的生成质量，但它本身并不从训练过程中观察到的失败中进化。例如，错误的 Tool Schema、缺失的 Retry Hook 或不当的 Context Management 会直接导致高质量轨迹无法生成，从而限制了模型能力的上限。\n\n这一问题的重要性在于，随着 LLM 在软件工程、代码解释器（Code Interpreter）等复杂任务中的能力增强，Harness 已成为决定智能体性能的一阶变量（First-order determinant）。特别是在工具集成推理（Tool-Integrated Reasoning, TIR）场景下，单一的 Harness 配置错误（如 JSON 格式错误或中间件重试逻辑缺失）可能导致整个多轮交互会话崩溃，使得模型无法通过推理自行恢复。解决这一问题带来的价值是显著的：通过引入 Co-Harness 框架，实现 Harness 与模型的协同进化（Co-evolution），可以打破固定 Harness 带来的性能天花板。实验表明，这种联合优化不仅能自动修复系统崩溃、提升推理效率，还能发现如集成策略（Ensemble Strategies）等非显而易见的高级优化手段，最终在数学推理基准（如 AIME, HMMT）上实现超过人类手工设计 Harness 的准确率提升，证明了将 Harness 作为可学习变量纳入后训练循环的有效性。\n\n### § 2 前人工作与不足\n\n该问题在之前的研究中并未得到完整解决，现有工作主要存在以下局限：\n\n首先，传统的后训练方法（如 SWEsmith, AgentTuning）通常冻结 Harness，仅优化模型权重。这种方法假设 Harness 是完美的或足够好的数据生成环境，忽略了 Harness 缺陷对轨迹质量的负面影响。当模型能力增强时，固定的 Harness 反而成为瓶颈，导致模型无法利用更复杂的工具链或推理策略。\n\n其次，近期的自动化 Harness 设计工作（如 Meta-Harness [8], Agentic Harness Engineering [9], AEVO [10]）虽然将 Harness 视为优化变量，但它们主要关注推理时（Inference-time）的性能提升，而非训练时的数据生成质量。例如，Meta-Harness 通过源代码、执行轨迹和任务分数优化 Harness 实现；Agentic Harness Engineering 利用可观测性信号更新 Prompts 和 Tools；AEVO 将智能体进化视为交互过程并修改驱动搜索的程序或上下文。这些方法的共同不足在于，它们优化的 Harness 仍然包裹在一个固定的模型周围，仅改善当前模型在推理时的表现，而未将 Harness 的改进反馈到后训练循环中。也就是说，它们没有解决“生成训练数据的系统”与“在该数据上训练的模型”之间的耦合进化问题。\n\n最后，自动化智能体系统设计（如 ADAS [15]）通过元智能体（Meta Agent）搜索新的智能体设计代码，虽然展示了强大的跨域迁移能力，但其优化目标主要是推理时的上下文任务准确率（In-context task accuracy），并未考虑发现的智能体设计是否能产生高质量的训练轨迹，也未进行失败归因（Failure Attribution）。ADAS 的搜索信号仅来自任务结果分数，缺乏对失败原因的细粒度诊断，导致其难以针对特定的 Harness 缺陷进行定向修复。\n\n综上所述，现有工作要么冻结 Harness 导致数据生成质量受限，要么仅优化推理时的 Harness 而未将其纳入模型训练闭环，要么缺乏基于失败归因的定向修复机制。Co-Harness 通过引入 HarnessCritic 进行失败归因和局部修复，并将修复后的 Harness 生成的轨迹用于模型微调，填补了“联合优化模型与 Harness 以产生复利式自我改进”这一关键缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n在当前的 LLM Agent 研究中，存在一个明显的“不对称优化”现象：社区投入了大量精力通过 SFT 或 RLHF 优化模型权重（Model Weights），却往往将运行时的支撑系统——即 Harness（包含 Prompts、Tools、Middleware、Memory 等）——视为静态的基础设施。这种假设在简单的文本生成任务中或许成立，但在复杂的 Tool-Integrated Reasoning (TIR) 场景下，这一假设开始崩塌。\n\n首先，观察 TIR 的失败模式可以发现，许多错误并非源于模型推理能力的不足，而是源于“脚手架”的缺陷。例如，一个错误的 Tool Schema 会导致代码执行直接中断，或者缺失的 Retry Hook 会让瞬时的系统崩溃变成不可恢复的任务失败。这些是典型的 Harness-level failures，而非 Model-level failures。现有的自动化 Agent 设计工作（如 ADAS 或 Meta-Harness）虽然尝试优化 Harness，但它们通常是在推理阶段（Inference-time）针对固定模型进行搜索，目的是让当前模型跑得更顺，却忽略了这些优化后的 Harness 所产生的高质量轨迹（Trajectories）本身就是一种宝贵的训练信号。\n\n其次，从数据生成的角度来看，训练数据的质量直接决定了模型的上限。如果 Harness 存在缺陷，生成的轨迹中就会包含大量的噪声、无效的工具调用或错误的中间状态。用这些“脏数据”去 Fine-tune 模型，不仅无法提升模型能力，反而可能让模型学习到错误的依赖关系（Harness Debt）。反之，如果 Harness 能够动态修复这些结构性错误，生成的轨迹将更加干净、逻辑更严密。\n\n最后，作者意识到模型与 Harness 之间存在一种潜在的互促关系：更强的模型能够利用更复杂的 Harness 策略（如更精细的 Memory 管理或更复杂的 Tool 组合），而更完善的 Harness 又能释放出模型潜在的推理能力。现有的范式将二者割裂，导致优化陷入局部最优。因此，自然的下一步是将 Harness 的优化纳入 Post-training 的闭环中，让 Harness 的进化与模型的进化交替进行，形成一种 Co-evolution 机制，从而打破固定 Harness 带来的性能瓶颈。\n\n### § 4 核心 Intuition\n\nCo-Harness 的核心直觉在于打破“模型”与“运行环境”的静态边界，将 Harness 视为一个可学习的优化变量，而非固定的基础设施。传统方法中，固定的 Harness 限制了高质量训练数据的生成，导致模型无法从更优的交互模式中受益；而 Co-Harness 通过 HarnessCritic 自动诊断并修复导致失败的结构性问题（如工具定义错误或中间件配置不当），从而生成更干净、更具信息量的轨迹。这些高质量轨迹随后用于微调模型，使模型内化更优的行为模式；而更强的模型又能暴露出更深层次的 Harness 瓶颈，驱动下一轮的 Harness 进化。这种“更好的 Harness 产生更好的数据，更好的数据训练出更强的模型，更强的模型解锁更复杂的 Harness”的正反馈循环，实现了模型与环境的协同进化，从而在复杂推理任务上获得超越单一维度优化的累积增益。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**Co-Harness** 的核心方法是将 Agent 的运行时环境（Harness）与模型参数（Model Weights）视为两个相互耦合的优化变量，通过双循环（Dual-Loop）机制进行联合优化。传统的 Post-training 通常固定 Harness 仅更新模型，导致数据生成过程与模型更新脱节；Co-Harness 则通过 **Co-Harness Loop**（优化 Harness）和 **Model Alignment Loop**（优化模型）的交替迭代，实现“更好的 Harness 产生更高质量的轨迹，进而训练出更强的模型，更强的模型又能解锁更复杂的 Harness 优化空间”的正向反馈螺旋。\n\n以下以 **AIME24 数学竞赛题目求解** 为例，展示 Co-Harness 的完整 Pipeline：\n\n**1. 初始化与初始 Rollout (Input \u0026 Initial Execution)**\n*   **输入**：初始模型参数 $\\theta_0$（如 Qwen3-8B）和初始 Harness 配置 $\\phi_0$（包含 Prompt、Tool Schema、Middleware 策略等）。任务集为 AIME24 的 30 道数学题。\n*   **处理**：Agent 在 TIR（Tool-Integrated Reasoning）范式下运行，交替生成 Chain-of-Thought 和调用 Python 代码解释器。\n*   **输出**：一批轨迹（Trajectories）。其中部分轨迹成功解题，部分失败（如代码报错、超时、逻辑中断）。\n\n**2. Co-Harness Loop: HarnessCritic 分析与修复 (Harness Optimization)**\n*   **输入**：失败的轨迹集合 $F_t^-$ 和当前 Harness $\\phi_t$。\n*   **处理**：\n    *   **Failure Attribution**：LLM-based 的 **HarnessCritic** 分析失败轨迹，将错误归因到具体的 Harness 维度。例如，发现某道题因 `tool_schema_error`（工具模式错误）导致 Python 解释器拒绝执行，或因 `middleware_mismatch`（中间件不匹配）导致重试机制缺失。\n    *   **Diff Generation**：HarnessCritic 提出具体的局部修改建议（Diff），如修复 JSON 参数格式、增加 `retry_on_rate_limit` 钩子、或调整 Context 压缩策略。\n    *   **Validation**：在验证集上测试这些 Diff，确保修复了目标错误且未导致其他行为退化（Non-regressive）。\n*   **输出**：进化后的 Harness $\\phi_t^*$。例如，从初始崩溃状态修复为稳定的代码执行环境，或优化了推理效率。\n\n**3. Model Alignment Loop: 高质量轨迹收集与 SFT (Model Optimization)**\n*   **输入**：进化后的 Harness $\\phi_t^*$ 和当前模型 $\\theta_t$。\n*   **处理**：\n    *   **High-Quality Rollout**：使用 $\\phi_t^*$ 重新运行任务，收集高质量轨迹集 $D_t$。由于 Harness 更完善，这些轨迹包含更清晰的工具调用、更少的无效重试和更完整的推理链。\n    *   **Supervised Fine-Tuning (SFT)**：使用 $D_t$ 对模型 $\\theta_t$ 进行微调，得到新模型 $\\theta_{t+1}$。这一步将 Harness 提供的“外部脚手架”能力蒸馏（Distill）到模型内部参数中。\n*   **输出**：更新后的模型 $\\theta_{t+1}$。\n\n**4. 迭代与收敛 (Iteration)**\n*   **处理**：将 $\\theta_{t+1}$ 和 $\\phi_t^*$ 作为下一轮起点。更强的模型可能暴露出之前被掩盖的更深层 Harness 瓶颈（如需要更复杂的 Memory 策略），从而触发新一轮的 Harness 优化。\n*   **输出**：经过多轮（如 Round 1, Round 2）迭代后，最终得到在准确性和效率上均显著提升的 Agent 系统。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过**。\n\n本文主要提出的是一个工程框架和算法流程（Algorithm 3），而非基于严格数学定理推导的理论模型。文中涉及的公式主要用于定义优化目标（如联合优化模型 $\\theta$ 和 Harness $\\phi$ 以最大化奖励 $R$）和 SFT 的损失函数，属于标准的机器学习设定，没有复杂的理论推导过程。其核心贡献在于**架构设计**（Dual-Loop Co-Evolution）和**机制创新**（HarnessCritic 的归因与验证），而非数学证明。\n\n---\n\n### § 7 实验设计与结论\n\n**提出了什么问题？**\n现有的 Agent Post-training 流程通常将 Harness（Prompt、工具、中间件等）视为固定基础设施，仅优化模型参数。这导致模型更新与数据生成环境（Harness）之间存在错配（Mismatch），限制了 Agent 在复杂任务（如 Tool-Integrated Reasoning）中的性能上限。核心问题是：**能否将 Harness 的进化与模型的 Post-training 耦合起来，实现两者的共同进化（Co-evolution），从而获得超越固定 Harness 训练的效果？**\n\n**设计了什么实验验证这个问题？**\n1.  **基准测试对比**：在三个不同难度的数学推理基准（AIME24, AIME25, HMMT25）上，对比三种设置：\n    *   **Baseline (Round 0)**：仅优化 Harness 但不进行模型 SFT。\n    *   **Human**：人工设计的静态 Harness，无模型对齐。\n    *   **Co-Harness (Ours)**：完整的双循环共进化（HarnessCritic + SFT），进行 1-2 轮迭代。\n    *   使用 Qwen3-8B 和 Qwen3-32B 两种规模的模型，评估 pass@1 准确率。\n2.  **自主进化案例研究**：在 AIME24 上运行超过 200 小时的完全自主实验，观察 Co-Harness 在无人类干预下如何从系统崩溃（Crash）逐步修复、优化效率并发现集成策略（Ensemble Strategy）。\n3.  **消融与分析**：分析不同难度任务下的增益差异，以及模型规模对共进化效果的影响，验证“更强模型解锁更多 Harness 优化空间”的假设。\n\n**问题的答案是什么？**\n1.  **共进化带来显著且累积的性能提升**：Co-Harness 在所有基准和模型规模上均实现了单调的准确率提升。平均准确率从 Baseline 的 58.5% 提升至 Round 2 的 78.9%（+20.4 pp），且显著超越了人工设计的静态 Harness（+24.7 pp）。\n2.  **困难任务受益更大**：在最具挑战性的 HMMT25 基准上，增益最大（32B 模型提升 +27.2 pp），证明在复杂多步推理中，Harness 的缺陷是主要瓶颈，共进化能有效解决这一问题。\n3.  **自主修复与优化能力**：在 200+ 小时的自主运行中，Co-Harness 成功从初始的系统崩溃中恢复，将推理效率提升 8.7 倍，并自主发现了多数投票集成策略，证明了该框架在自动化 AI R\u0026D 中的潜力。\n4.  **减少 Harness Debt**：实验表明，通过共进化训练的模型不仅依赖外部脚手架，而是将有效行为内化为模型能力，从而在测试时表现出更强的泛化性和独立性。", "additional_insights": "### § 8 Take-aways\n\nCo-Harness 提出了一种将 Agent 的运行时环境（Harness）与模型参数（Model Weights）进行联合优化的双循环框架，打破了传统 Post-training 中 Harness 固定不变的范式。该框架通过一个基于 LLM 的 HarnessCritic 模块，对失败的轨迹进行结构化归因（如 `tool schema error` 或 `middleware mismatch`），并生成经过验证的局部补丁（Diffs）来修复 Harness。修复后的 Harness 用于生成更高质量的训练轨迹，进而通过 SFT 更新模型参数，形成“更好的 Harness 产生更好的轨迹，更强的模型解锁更复杂的 Harness”的正向反馈螺旋。实验表明，在 Tool-Integrated Reasoning (TIR) 任务中，经过两轮 Co-evolution，Qwen3-8B 和 Qwen3-32B 在 AIME 和 HMMT 基准上的平均准确率提升了 20.4 个百分点，且显著超越了人工设计的静态 Harness。此外，长达 200 多小时的自主演化案例证明，该系统不仅能修复系统崩溃和提升推理效率，还能自主发现如 Ensemble 策略等非显而易见的优化手段，同时通过版本控制的 Harness Registry 有效避免了 Harness Debt（即模型过度依赖特定脚手架导致泛化能力下降）。\n\n### § 9 最脆弱的假设\n\n该方法最核心的假设是：**Harness 层面的缺陷（Scaffolding Deficiencies）是限制当前模型性能的主要瓶颈，且这些缺陷可以通过结构化的归因和局部补丁被有效识别与修复，从而产生可被模型内化（Internalized）的通用推理能力，而非仅仅是对特定脚手架的过拟合。**\n\n如果这一假设不成立，即模型的性能瓶颈主要源于其内在推理能力的不足（Model-internal limitations），或者 Harness 的优化仅导致模型记住了特定的工具调用模式而非提升通用推理逻辑，那么 Co-Harness 的增益将迅速饱和甚至失效。论文通过“Harness Debt analysis”部分提供了一定证据，指出经过 Co-Harness 训练的模型在测试时（即使没有经过优化的 Harness 辅助）也能保持较高的准确率，表明其学到了可迁移的技能。然而，这一证据主要基于相对简单的数学推理任务（TIR），在更复杂的、需要深层逻辑抽象或长程依赖的任务中，模型是否真的能“内化”由复杂 Middleware 或 Memory 策略带来的收益，还是仅仅学会了在特定上下文窗口下的行为模式，仍存在不确定性。如果 Harness 的优化变得过于复杂（Over-patching），导致模型无法在有限的上下文窗口中有效利用这些改进，或者归因模块（HarnessCritic）错误地将模型能力不足归因为 Harness 问题，整个闭环将陷入无效循环。\n\n### § 10 最小复现实验\n\n在 1 周时间内，可以复现 **HarnessCritic 的归因准确性及其对轨迹质量的提升作用**，而不必完整实现双循环的 SFT 训练。\n\n**具体方案：**\n1.  **数据准备**：选取一个小型的数学推理数据集（如 AIME24 的子集，约 50-100 题），使用一个基座模型（如 Qwen2.5-7B-Instruct）配合一个故意配置有缺陷的初始 Harness（例如：缺少重试机制、错误的 Tool Schema 定义、或截断策略过于激进）进行 Rollout，收集失败轨迹（Failed Trajectories）。\n2.  **实现核心模块**：实现 HarnessCritic 模块，使用一个更强的 LLM（如 GPT-4o 或 Claude 3.5 Sonnet）作为 Critic，输入失败轨迹和当前 Harness 配置，要求其输出结构化的归因结果（Root Cause, Harness Dim, Diff Suggestion）。\n3.  **测量与验证**：\n    *   **归因准确性**：人工标注一部分失败轨迹的真实原因，计算 HarnessCritic 归因的准确率（Precision/Recall）。\n    *   **补丁有效性**：根据 HarnessCritic 提出的 Diffs 修改 Harness，在相同的失败轨迹子集上重新运行 Agent，测量修复后的通过率（Pass Rate）提升情况。\n    *   **对比基线**：对比“无修复”、“随机修复”和“HarnessCritic 修复”后的轨迹质量。\n\n**支持/反驳标准**：\n*   **支持**：如果 HarnessCritic 能准确识别出大部分失败是由 Harness 配置错误（而非模型能力不足）引起的，且应用其提出的补丁后，原本失败的轨迹中有显著比例（如 \u003E30%）转变为成功轨迹，则证明 Harness 优化是有效的，且归因模块可靠。\n*   **反驳**：如果归因准确率极低，或者应用补丁后通过率提升微乎其微（\u003C5%），说明失败主要源于模型内在能力，或者 Harness 的局部修复无法解决根本问题，从而质疑 Co-Harness 核心假设的有效性。", "research_value": "### § 11 最强反例设计\n\n若要挑战 Co-Harness 的有效性，最有力的攻击并非质疑其能否提升准确率，而是质疑其提升的**来源（Source of Gain）**与**泛化性（Generalizability）**，即证明该方法实际上是在进行“针对特定 Harness 的过拟合”而非“通用推理能力的内化”。\n\n**实验反例设计：Harness-Independent Generalization Gap (HIGG) 测试**\n设计一个严格的“零样本迁移”实验。首先，使用 Co-Harness 在数学基准（如 AIME）上完成完整的 Co-evolution 训练，得到模型 $\\theta_{final}$ 和进化后的 Harness $\\phi_{final}$。随后，在测试阶段，不使用 $\\phi_{final}$，而是强制模型 $\\theta_{final}$ 在一个**完全陌生且故意设计为低效的 Harness $\\phi_{naive}$** 下运行（例如，移除所有 Retry Hooks，使用极简的 Prompt，且 Tool Schema 故意包含冗余字段）。\n*   **攻击逻辑**：如果 Co-Harness 的核心假设成立（即模型内化了推理逻辑），那么 $\\theta_{final}$ 在 $\\phi_{naive}$ 下的表现应显著优于初始模型 $\\theta_0$ 在 $\\phi_{naive}$ 下的表现，且接近 $\\theta_{final}$ 在 $\\phi_{final}$ 下的表现。\n*   **预期反驳结果**：如果 $\\theta_{final}$ 在 $\\phi_{naive}$ 下的性能急剧下降，甚至低于 $\\theta_0$ 在 $\\phi_{final}$ 下的表现，则证明模型并未学会“如何推理”，而是学会了“如何配合特定的脚手架”。这表明 Co-Harness 实际上是在训练模型去适应 Harness 的特定 API 调用模式和错误处理流程，而非提升其内在的数学或逻辑能力。这种“Harness-Specific Overfitting”意味着该方法无法解决根本的模型能力瓶颈，只是通过增加系统复杂度来掩盖模型缺陷。\n\n**理论/机制反例：Attribution Bias 导致的恶性循环**\n攻击 HarnessCritic 的归因可靠性。设计一个场景，其中失败的根本原因是模型缺乏深层逻辑抽象能力（Model-internal limitation），但 HarnessCritic 错误地将其归因为 `context_window_overflow` 或 `tool_schema_error`。\n*   **攻击逻辑**：由于 HarnessCritic 本身也是一个 LLM，它倾向于将错误归因于外部可修改的系统配置（因为修改代码比承认模型愚蠢更容易），从而产生 **Systemic Attribution Bias**。\n*   **预期反驳结果**：在迭代过程中，Harness 变得越来越复杂（Over-patching），引入了大量的冗余中间件和复杂的重试逻辑，而模型参数并未发生实质性的推理能力更新。最终，系统陷入“为了修复一个由模型能力不足导致的错误，而不断堆砌 Harness 复杂度”的恶性循环。这可以通过测量 **Harness Complexity vs. Model Performance Correlation** 来验证：如果 Harness 的代码行数或模块数量呈指数增长，而模型在独立推理任务上的增益趋于饱和甚至下降，则证明该方法在复杂任务中会失效。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：Causal Disentanglement of Scaffolding Effects (脚手架效应的因果解耦)**\n\n**(a) 驱动局限与未满足需求**\nCo-Harness 的核心局限在于其“黑盒式”的联合优化：它假设 Harness 的改进必然导致模型能力的提升，但无法区分哪些性能增益来自**真正的推理逻辑内化（Internalized Reasoning）**，哪些来自**对特定脚手架行为的记忆（Scaffolding Memorization）**。现有方法缺乏一种机制来量化“Harness 贡献”与“模型贡献”的边界。如果无法解耦这两者，我们就无法知道模型是否真的变聪明了，还是只是变得更擅长“使用工具”了。这限制了模型在脱离特定 Harness 环境后的泛化能力，也阻碍了我们对 Agent 学习机制的理论理解。\n\n**(b) 借鉴相邻领域的方法**\n借鉴 **Causal Inference（因果推断）** 中的 **Do-Calculus** 和 **Interventional Analysis**，以及 **Mechanistic Interpretability（机制可解释性）** 中的 **Feature Attribution** 技术。具体而言，可以引入 **Counterfactual Data Augmentation（反事实数据增强）** 和 **Information Bottleneck（信息瓶颈）** 理论。在训练过程中，不仅优化模型参数，还显式地约束模型对 Harness 特定信号（如特定的 JSON 结构、特定的 Retry 模式）的信息依赖度，迫使模型学习更抽象、更通用的推理特征。\n\n**(c) 第一个实验设计**\n提出 **Causal-Co-Harness** 框架，并在标准数学推理任务上进行验证。\n1.  **干预层（Intervention Layer）**：在 Co-Harness 的 Model Alignment Loop 中，引入一个 **Scaffolding Masking Module**。在生成训练数据时，随机扰动或屏蔽 Harness 的特定部分（如改变 Tool Schema 的字段顺序、移除特定的 Middleware 日志），生成“反事实轨迹”。\n2.  **解耦损失函数（Disentanglement Loss）**：除了标准的 SFT 损失，增加一个 **Mutual Information Minimization Loss**，旨在最小化模型输出与特定 Harness 配置之间的互信息，同时最大化模型输出与任务正确答案之间的互信息。这迫使模型忽略“脚手架噪音”，专注于“任务本质”。\n3.  **评估指标**：除了传统的 Accuracy，引入 **Scaffolding Independence Score (SIS)**。SIS 定义为模型在完全随机化 Harness 配置下的性能与在最优 Harness 配置下的性能之比。\n4.  **对比实验**：对比 Co-Harness 与 Causal-Co-Harness。预期结果是，Causal-Co-Harness 在初始收敛速度上可能较慢（因为需要学习更抽象的特征），但在 **SIS** 指标上显著更高，且在面对未见过的、结构完全不同的新 Harness 时，表现出更强的鲁棒性和泛化能力。这将证明，通过因果解耦，我们可以训练出真正“独立于脚手架”的智能体，而不仅仅是“擅长使用脚手架”的智能体。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Zhengyu Chen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Teng Xiao\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Huaisheng Zhu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yige Yuan\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Luan Zhang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jingang Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Meituan\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Allen Institute for AI\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Independent\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"†\",\n      \"text\": \"Equal contribution.\"\n    }\n  ]\n}\n```", "summary_translation": "用于自动化人工智能研究的代理后训练不仅需要优化模型参数，还需要优化塑造研究轨迹生成、评估和学习方式的运行时框架。现有流程通常在固定的框架下训练模型，包括提示、工具、技能、中间件和记忆，而将数据生成过程置于优化目标之外。这导致了模型更新与决定轨迹质量的静态支撑结构之间的不匹配。我们引入了 Co-Harness，这是一个在后训练期间联合优化代理框架和模型参数的框架。Co-Harness 在框架优化和模型优化之间交替进行。基于大语言模型的 HarnessCritic 分析失败的轨迹，识别框架层面的失败模式，并提出经过验证的局部更新。随后，模型在由改进后的框架生成的高质量轨迹上进行微调，将有效的支撑结构蒸馏到模型参数中。一项超过 200 小时的自主案例研究进一步表明，Co-Harness 能够从系统崩溃中恢复，提高推理效率，并在无人干预的情况下发现集成策略。这些结果表明，联合优化框架和模型是一种超越固定框架后训练来提升代理性能的有效方法。"}, {"title": "SIREN: Towards End-to-End Extreme-Weather Early Warning with Experience-Grounded LLM Agents", "arxiv_id": "2607.24588", "authors": "Hang Ni, Weijia Zhang, Fan Liu, Mengqian Lu, Hao Liu", "summary": "Early warning of extreme weather is essential for mitigating the societal, economic, and environmental risks posed by hazardous weather events. However, expert-centered warning workflows are costly, labor-intensive, and difficult to scale throughout the warning-to-action process. Although recent advances in Large Language Model (LLM) agents have enabled the automation of weather-related tasks, existing studies remain centered on isolated scientific tasks and overlook the chain of interdependent processes required for operational extreme-weather early warning. To bridge this gap, this study investigates automated end-to-end extreme-weather early warning through LLM agents. We first develop SIREN-Bench, a comprehensive benchmark comprising 600 question-answer instances across 19 tasks, and covering four individual warning procedures and an end-to-end warning chain. Evaluation on SIREN-Bench reveals substantial capability gaps in existing weather agent frameworks. This motivates us to develop SIREN, an experience-grounded agent framework inspired by experts' use of historical cases, which combines an agentic execution environment integrating heterogeneous weather evidence and tools with a family of agent harnesses that exploit historical cases through retrieval, skill distillation, and predictive modeling. Extensive experiments demonstrate that SIREN outperforms weather-agent baselines on both individual warning procedures and end-to-end warning chains.", "category": "cs.AI", "cluster": "Agentic Frameworks \u0026 Automated Research", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本研究旨在解决**极端天气早期预警（Extreme-weather Early Warning）**中从孤立科学分析向**端到端（End-to-End）**操作化预警流程转化的问题。具体而言，研究核心在于构建一个能够自动化执行完整**Warning-to-Action**链条的**LLM Agent**系统，该链条涵盖**Event Characterization**（事件表征）、**Spatiotemporal Prediction**（时空预测）、**Impact Assessment**（影响评估）以及**Responsive Decision-Making**（响应决策）。\n\n这一问题的重要性源于当前极端天气预警系统的固有局限性。现有的预警工作流高度依赖领域专家，不仅成本高昂、劳动密集，且难以规模化扩展。尽管**Large Language Model (LLM)** 和 **Agent** 技术在自动化气象任务方面取得了进展，但现有研究主要局限于早期的灾害分析或预测等孤立环节，忽视了下游的影响评估、预警通信及响应决策等相互依赖的过程。这种割裂导致现有的自动化系统无法直接支持操作层面的决策，无法实现从“灾害中心预测”向“基于影响的行动导向预警”的转变。\n\n解决该问题的价值在于：首先，通过自动化端到端流程，显著降低对人工专家的依赖，提高预警系统的可扩展性和响应速度；其次，通过引入**Experience-Grounded**（基于经验）的机制，利用历史案例增强Agent的推理能力，弥补纯数据驱动模型在复杂、罕见极端天气场景下的不足；最后，建立统一的评测基准（**SIREN-Bench**），为评估气象Agent在真实操作环境中的能力提供标准，推动气象AI从科研辅助向实际业务应用落地。\n\n### § 2 前人工作与不足\n\n此前，已有研究尝试利用LLM Agent进行气象科学分析，但均未完全解决端到端预警的问题。最相关的**Prior Methods**包括 **Zephyrus** [38]、**EWE** [13]、**ClimAgent** [39]、**ClimateAgent** [15] 和 **HVR-Met** [34]。\n\n这些系统的主要不足体现在以下三个方面：\n\n1.  **任务覆盖范围的局限性（Task Coverage Gap）：** 现有基准和Agent主要关注**Hazard Analysis**（灾害分析）和**Forecasting**（预测）等早期阶段任务。例如，**ZephyrusBench** [38] 和 **ClimaBench** [39] 侧重于气候分析和科学问题解答，**EWE** [13] 和 **HVR-Met** [34] 专注于极端天气的诊断和信号识别。它们普遍忽略了**Impact Assessment**（影响评估）、**Warning Communication**（预警通信）和**Response-oriented Decision Support**（响应导向决策支持）等下游关键环节。这是因为早期研究多由气象科学家主导，关注点在于物理机制的解释和数值预测的准确性，而非操作层面的风险管理和决策制定，导致缺乏涵盖完整**Warning-to-Action**链条的评测标准。\n\n2.  **缺乏端到端的流程整合（Lack of End-to-End Integration）：** 现有系统通常针对孤立任务进行优化，缺乏处理多阶段、相互依赖任务链的能力。在真实预警场景中，上游的预测误差会级联影响下游的影响评估和决策。现有Agent无法在一个统一的**Agentic Environment**中协调异构数据源和分析工具，以完成从监测到决策的连续推理。这种碎片化的处理方式使得现有系统无法模拟真实专家的工作流，难以应对需要多步骤推理和证据综合的复杂预警任务。\n\n3.  **历史经验利用的不足（Underutilization of Historical Experience）：** 现有气象Agent主要依赖当前的气象状态和参数化知识进行推理，未能有效利用历史案例中的操作经验。在极端天气预警中，历史相似案例（如类似时空特征或灾害类型的过往事件）提供了宝贵的类比参考和程序性技能。现有方法如 **Zephyrus** 或 **ClimateAgent** 虽然具备工具调用能力，但缺乏专门设计的**Harnesses**（如**RAG**、**Skill Distillation**、**Predictive Modeling**）来检索、蒸馏或建模历史案例。这导致Agent在面对罕见或复杂事件时，缺乏基于经验的鲁棒性，难以做出符合实际操作规范的决策。\n\n综上所述，前人工作虽然在单一气象任务上取得了进展，但由于缺乏对完整预警链条的覆盖、端到端流程的整合以及历史经验的有效利用，无法满足操作化极端天气早期预警的需求。**SIREN** 通过构建 **SIREN-Bench** 和提出 **Experience-Grounded** 的Agent框架，填补了这一空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在极端天气预警领域，传统的 Early Warning Systems (EWS) 长期依赖领域专家进行从监测、预测到影响评估和决策的端到端工作流。尽管 Large Language Model (LLM) Agents 在自动化科学工作流方面取得了进展，但现有的 Weather Agent 研究（如 Zephyrus, ClimAgent, EWE 等）主要局限于孤立的科学分析任务，例如单一的气象诊断或数值预报，而忽略了 Operational Warning 中至关重要的下游环节——即基于影响的评估（Impact Assessment）和响应决策（Responsive Decision-Making）。这种割裂导致现有基准无法评估 Agent 在完整预警链条中的表现，且现有 Agent 往往缺乏处理复杂、多阶段依赖任务的能力。\n\n进一步观察发现，人类专家在进行极端天气预警时，并非仅依赖当前的气象数据，而是高度依赖“历史经验”。例如，在评估龙卷风伤亡或洪水损失时，专家会检索具有相似时空特征或灾害类型的历史案例，通过类比推理（Analogy）或提取可复用的操作技能（Procedural Skills）来辅助当前决策。然而，现有的 LLM Agent 框架主要基于当前的气象状态进行推理，未能有效利用历史案例库中的隐性知识。这种“无经验”的推理模式导致 Agent 在面对需要综合判断和长期依赖的任务时表现不佳，特别是在影响评估和决策制定阶段。\n\n因此，研究者的思考路径自然导向了两个核心缺口：首先，需要一个涵盖从事件表征到响应决策的端到端基准（Benchmark），以真实反映 Operational Warning 的复杂性；其次，需要一种能够模拟专家“经验驱动”推理机制的 Agent 框架。这促使作者提出构建 SIREN-Bench 以覆盖完整的预警链条，并设计 SIREN 框架，通过检索增强生成（RAG）、技能蒸馏（Skill Distillation）和预测建模（Predictive Modeling）三种机制，将历史案例转化为可操作的推理依据，从而弥补现有 Agent 在端到端预警任务中的能力差距。\n\n### § 4 核心 Intuition\n\n现有 Weather Agent 的瓶颈在于它们仅基于“当前气象状态”进行孤立推理，缺乏人类专家在预警决策中依赖的“历史操作经验”。SIREN 的核心直觉是：极端天气预警本质上是一个需要类比推理和模式识别的任务，通过检索相似历史案例、蒸馏可复用技能或训练预测模型，可以将隐性的专家经验显性化并注入 Agent 的推理过程。这种“经验接地”（Experience-Grounded）机制使 Agent 能够跨越单一数据点的局限，利用历史先例中的因果逻辑和统计规律，从而在复杂、多阶段的端到端预警链条中实现更稳健的决策。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法是 **SIREN**，一个基于经验（Experience-Grounded）的 **LLM Agent** 框架，旨在实现端到端的极端天气早期预警。其核心思想是模仿人类专家利用历史案例（Historical Cases）进行推理的模式，通过检索、技能蒸馏或预测建模来增强 Agent 的决策能力。\n\nSIREN 的完整 Pipeline 由 **Agentic Environment**（智能体环境）和 **Agent Harnesses**（智能体执行策略）两部分组成。以下结合一个真实场景——**“预测2021年7月6日美国东北部严重对流风暴的影响并制定响应决策”**——来详细拆解其处理流程：\n\n#### 1. 输入阶段 (Input)\n*   **任务指令 (Task Instruction)**：Agent 接收一个具体的预警任务，例如：“评估此次风暴造成的农业损失（Impact Assessment）并建议疏散区域（Responsive Decision-Making）”。\n*   **事件上下文 (Event Conditions)**：提供当前时间（2021-07-06 20:23 UTC）、地理位置（宾夕法尼亚州东部至新英格兰南部）以及初步的气象描述。\n*   **历史案例库 (Historical Case Base, $K$)**：系统内置了往年类似极端天气事件的问答对集合，作为“经验”来源。\n\n#### 2. 处理阶段 (Processing) - 以 SIREN-RAG 为例\nSIREN 框架包含多种 Harness，这里以表现优异的 **SIREN-RAG**（基于检索增强生成）为例说明其多轮交互过程：\n\n*   **步骤一：环境感知与证据检索 (Evidence Retrieval)**\n    *   Agent 首先调用 **Agentic Environment** 中的工具。它使用 `access_hrrr_reanalysis` 获取高分辨率数值天气预报网格数据（Meteorological Grids），使用 `access_spc_mesoscale_images` 获取中尺度分析图像。\n    *   同时，Agent 调用 `access_historical_cases`，根据当前任务意图（Impact Assessment）和事件特征（对流风暴、东北部地区），从历史案例库 $K$ 中检索出最相似的 6 个历史案例（Analogues）。\n\n*   **步骤二：代码执行与诊断分析 (Code Execution \u0026 Diagnosis)**\n    *   Agent 生成 Python 代码，通过 **Guarded Code Execution Server** 执行。\n    *   代码调用 `compute_layer_profile_metrics` 计算大气层结参数（如 Bulk Shear, CAPE），调用 `compute_wind_diagnostics` 分析风场结构。\n    *   执行结果返回结构化观察值（Observations），例如：“850hPa 湿度高达 15.4 g/kg，低层风切变显著”。\n\n*   **步骤三：经验融合与推理 (Experience-Grounded Reasoning)**\n    *   Agent 将当前的诊断数据（高湿度、强切变）与检索到的历史案例进行对比。\n    *   它发现历史案例中，类似的大气配置通常导致严重的下击暴流（Downburst）和冰雹。\n    *   Agent 结合 **Geospatial Information**（如 OpenStreetMap 数据），将气象风险映射到具体的行政区域（县/市），评估暴露度（Exposure）。\n\n*   **步骤四：技能蒸馏或模型预测 (可选，针对 SIREN-Skill/Modeling)**\n    *   如果是 **SIREN-Skill**，Agent 会先在几个历史案例上进行“排练”（Rehearsal），提炼出通用的解题步骤（如“先查湿度，再查切变，最后查地形”），形成可复用的技能摘要 $S$。\n    *   如果是 **SIREN-Modeling**，Agent 会利用历史数据训练一个轻量级的 ML 模型（如回归模型），用于预测具体的损失金额或断电时长。\n\n#### 3. 输出阶段 (Output)\n*   **最终答案 (Final Solution)**：Agent 综合所有证据，生成符合格式要求的答案。\n    *   **Impact Assessment**: “预计农作物损失约为 $X 美元，主要影响宾夕法尼亚州南部。”\n    *   **Responsive Decision-Making**: “建议激活位于 [具体坐标] 的灾难恢复中心，并向 [具体县] 发布紧急疏散警报。”\n*   **端到端链条 (Warning Chain)**：如果是端到端任务，Agent 会依次完成事件表征、时空预测、影响评估和响应决策，并将前一步的输出作为后一步的输入，最终输出完整的预警报告。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**说明：** 本文主要侧重于系统架构设计、基准测试构建（Benchmark Construction）和实验评估，**没有提出新的底层数学理论或复杂的推导公式**。其核心贡献在于工程实现和 Agent 交互范式的创新，而非数学模型的推导。因此，本节跳过。\n\n*注：文中涉及的公式主要为评估指标的计算（如相对误差 RE、地理局部化得分 LS）和 Agent 交互的形式化定义（如轨迹更新 $h_{t+1} = h_t \\cup \\{r_t, a_t, o_t\\}$），这些属于标准定义，非核心推导。*\n\n---\n\n### § 7 实验设计与结论\n\n#### 1. 提出了什么问题？\n现有的 LLM Agent 在气象领域的应用主要集中在孤立的科学任务（如单一的气象预测或诊断），缺乏对**端到端（End-to-End）**极端天气预警流程的支持。此外，现有 Agent 往往忽视**历史案例（Historical Cases）**作为“经验”的价值，导致在复杂的操作性任务（如影响评估、决策制定）中表现不佳。\n\n#### 2. 设计了什么实验验证这个问题？\n为了验证上述问题并展示 SIREN 的有效性，作者设计了以下实验：\n\n*   **构建 SIREN-Bench 基准测试**：\n    *   创建了包含 600 个问答对（QA pairs）的基准，覆盖 12 种极端天气类型和 19 个子任务。\n    *   任务分为四类原子程序（事件表征、时空预测、影响评估、响应决策）和一个端到端预警链（Warning Chain）。\n    *   这是首个覆盖完整预警流程的基准，用于评估 Agent 在操作性任务上的能力。\n\n*   **对比实验（Baselines Comparison）**：\n    *   将 SIREN 的不同变体（SIREN-Base, SIREN-RAG, SIREN-Skill, SIREN-Modeling）与现有的强基线模型（Zephyrus, EWE, ClimAgent, ClimateAgent, HVR-Met）进行对比。\n    *   使用三种先进的 LLM 后端（Qwen, GPT, Gemini）进行实例化，确保结果的鲁棒性。\n\n*   **多维度分析**：\n    *   **原子任务性能**：评估各子任务的表现，验证历史经验对不同阶段（如预测 vs. 决策）的贡献。\n    *   **端到端链条性能**：评估 Agent 在连续多步任务中的整体表现，验证误差累积和上下文传递的效果。\n    *   **细粒度分析**：按事件类型（如龙卷风、洪水）、地理区域（各州）和时间（月份）分析性能差异，检验模型的泛化能力和鲁棒性。\n    *   **跨程序依赖性分析**：使用 Spearman 相关系数分析预警链中前后步骤之间的依赖关系，验证端到端流程的合理性。\n\n#### 3. 问题的答案是什么？\n*   **现有 Agent 存在显著能力差距**：在 SIREN-Bench 上，现有基线模型在端到端预警链上的表现远未达到操作就绪水平，尤其是在影响评估和响应决策方面。\n*   **历史经验显著提升性能**：SIREN 系列模型通过引入历史案例，在所有 LLM 后端上均显著优于基线模型。例如，SIREN-RAG 和 SIREN-Modeling 在整体得分上比最强基线高出 26%-30%。\n*   **不同经验机制具有互补性**：\n    *   **SIREN-RAG**（检索类比）在大多数影响评估任务和 GPT/Gemini 后端上表现最佳。\n    *   **SIREN-Modeling**（预测建模）在时空预测和 Qwen 后端上表现优异。\n    *   **SIREN-Skill**（技能蒸馏）虽然整体略逊于前两者，但在特定任务上仍优于无经验的 Base 模型。\n*   **端到端链条具有强依赖性**：实验证实，预警链中上游任务（如事件表征、时空预测）的性能与下游任务（如影响评估、决策）呈正相关，强调了完整流程优化的重要性。\n*   **鲁棒性仍有提升空间**：尽管 SIREN 表现优异，但在某些特定事件类型（如火灾、龙卷风）和地理区域（如阿拉斯加、佛罗里达）上仍存在性能波动，表明未来需增强模型对特定灾害动力学和局部条件的适应性。", "additional_insights": "### § 8 Take-aways\n\nSIREN-Bench 填补了现有气象基准的空白，首次将极端天气预警定义为包含事件表征、时空预测、影响评估和响应决策的端到端（End-to-End）任务链，而非孤立的科学分析任务。实验表明，现有的气象 Agent 框架（如 Zephyrus, ClimAgent）在处理这种多阶段依赖的操作性任务时存在显著的能力缺口，尤其是在下游的影响评估和决策环节。SIREN 框架的核心创新在于引入“经验 grounding”（Experience-Grounded）机制，通过检索增强生成（RAG）、技能蒸馏（Skill Distillation）和预测建模（Predictive Modeling）三种方式利用历史案例，显著提升了 Agent 在复杂预警链中的表现。其中，SIREN-RAG 在大多数子任务和整体链式任务中表现最佳，证明类比推理在缺乏明确物理公式的操作决策中比纯参数化知识更有效。端到端评估揭示了任务间的强依赖性，特别是上游的事件表征和时空预测性能直接决定了下游影响评估和响应决策的质量，强调了完整工作流优化的必要性。尽管 SIREN 在基准测试中优于基线，但其在快速演变灾害（如龙卷风、火灾）和特定地理区域的表现波动，表明历史经验的迁移能力仍受限于时空相似性和数据覆盖度。\n\n### § 9 最脆弱的假设\n\nSIREN 框架最脆弱的假设是：**历史极端天气案例在时空特征、气象机制和社会暴露度上具有足够的相似性，使得基于历史案例的类比推理或统计建模能够泛化到当前的新事件中。** 如果这一假设不成立，即当前极端天气事件是前所未有的（Novelty），或者其影响机制与历史案例存在本质差异（例如由于气候变化导致的新型复合灾害，或城市基础设施变化导致的暴露度改变），那么 SIREN-RAG 的检索将返回无关或误导性案例，SIREN-Modeling 训练的模型将产生系统性偏差，导致预警失效甚至加剧风险。论文通过展示 SIREN 在不同事件类型（如海洋灾害 vs. 龙卷风）和不同月份的性能差异，间接承认了这种泛化能力的局限性，特别是在快速演变或局部性强的灾害中表现较弱。然而，论文缺乏对“分布外”（Out-of-Distribution, OOD）极端天气事件的专门评估，也未提供当历史案例库中缺乏相似先例时，Agent 如何识别这种不确定性并退回到保守策略的证据。这意味着在真实世界中面对“黑天鹅”式极端天气时，SIREN 可能无法像人类专家那样通过第一性原理进行推理，而是盲目依赖错误的历史类比。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 SIREN 框架中 **SIREN-RAG 的检索模块对单一子任务（如“影响评估”中的经济损失预测）的提升效果**，以验证历史案例类比的有效性。具体步骤如下：首先，从 SIREN-Bench 公开数据中选取一个特定灾害类型（如洪水）的 50 个测试样本及其对应的历史案例库；其次，实现一个简化的检索器，基于事件类型、地理位置和时间窗口计算当前测试样本与历史案例的相似度，并检索 Top-K 个相似案例；然后，构建两个 LLM Agent 变体：一个仅使用当前气象数据（SIREN-Base 简化版），另一个在提示词中注入检索到的历史案例及其结果（SIREN-RAG 简化版）；最后，测量两者在经济损失预测任务上的相对误差（Relative Error）或相关系数。如果 SIREN-RAG 变体的误差显著低于 Base 变体，则支持了“历史经验有助于提升预测准确性”的核心 claim；反之，如果引入历史案例导致性能下降或无显著改善，则反驳了该机制在特定场景下的有效性，并提示需要更精细的案例筛选或特征对齐策略。此实验无需复现完整的代码执行环境和多模态工具链，聚焦于核心的“经验 grounding”逻辑。", "research_value": "### § 11 最强反例设计\n\n若要挑战 SIREN 的有效性，最有力的攻击并非针对其代码执行或检索机制的技术细节，而是针对其核心假设——**“历史相似性足以支撑操作化决策”**——在**非平稳气候环境（Non-stationary Climate Regimes）**下的崩溃。具体而言，可以设计一个基于**“气候突变点（Climate Tipping Points）”**的反例场景：选取一个在历史案例库中从未出现过、但由当前气候变化驱动的新型复合极端天气事件（例如，由海洋热浪与大气阻塞高压共同引发的、突破历史极值的“湿球温度”致死事件）。\n\n在此场景中，SIREN-RAG 的检索模块将面临**“语义陷阱”**：由于缺乏完全匹配的历史先例，检索器可能返回时空特征相似但物理机制不同的“伪相似”案例（例如，仅温度相似但湿度分布截然不同的普通热浪）。SIREN 的 **Experience-Grounded Reasoning** 会错误地将历史案例中的低影响评估（如仅建议开启避暑中心）迁移到当前高致死风险事件中，导致严重的**Under-warning**（预警不足）。更致命的是，SIREN-Modeling 基于历史数据训练的回归模型，其预测区间（Prediction Interval）在分布外（Out-of-Distribution, OOD）数据上会严重低估不确定性，给出虚假的高置信度错误预测。\n\n为了验证这一攻击，可以构建一个**“合成 OOD 基准（Synthetic OOD Benchmark）”**：利用物理模型（如 WRF）生成一组具有全新气象配置（Novel Meteorological Configurations）的极端天气事件，这些事件在特征空间上与训练集/历史库中的任何案例都保持较大的马氏距离（Mahalanobis Distance）。实验将对比 SIREN 与一个基于**第一性原理（First-Principles）**的纯物理约束 Agent（不依赖历史类比，仅依赖实时物理方程求解）的表现。预期结果是，SIREN 在常规任务上表现优异，但在 OOD 任务上的误差率呈指数级上升，且无法像人类专家那样通过识别“无先例”而触发保守的“高预警级别”策略，从而证明其**“经验 grounding”在应对气候非线性突变时的结构性脆弱性**。\n\n### § 12 Follow-up Research Idea\n\n基于 SIREN 在**分布外泛化（OOD Generalization）**和**不确定性量化（Uncertainty Quantification）**方面的局限，提出一个新的研究方向：**“Counterfactual-Reasoning LLM Agents for Robust Extreme-Weather Warning”**（基于反事实推理的鲁棒极端天气预警 LLM Agent）。\n\n**(a) 驱动局限与需求：**\nSIREN 的核心缺陷在于其**归纳式（Inductive）**的学习范式，即依赖历史数据的统计规律。然而，极端天气预警本质上是一个**小样本（Few-Shot）**甚至**零样本（Zero-Shot）**的决策问题，且后果具有不可逆性。现有方法缺乏对**“如果...会怎样？”（What-if）**的因果推理能力，无法区分气象变量之间的**相关性（Correlation）**与**因果性（Causality）**。例如，SIREN 可能因为历史中“高湿度”常伴随“低损失”而低估风险，却忽略了在当前特定地形下“高湿度”是触发“山体滑坡”的必要因果条件。因此，需要一种能够超越历史类比，通过**因果干预（Causal Intervention）**来评估潜在风险的方法。\n\n**(b) 借鉴领域与方法：**\n借鉴**因果推断（Causal Inference）**和**反事实学习（Counterfactual Learning）**领域的最新进展，特别是**Structural Causal Models (SCMs)** 和 **Do-calculus**。具体而言，引入**Causal LLM Agents** 的概念，让 Agent 不仅检索历史案例，还能构建当前气象状态的**因果图（Causal Graph）**。Agent 可以通过执行**“反事实模拟”**（例如：“如果风切变增加 10%，但湿度保持不变，灾害类型是否会从冰雹转变为龙卷风？”）来验证其决策的鲁棒性。此外，结合**Conformal Prediction** 技术，为 Agent 的每一个决策步骤提供严格的**不确定性校准（Uncertainty Calibration）**，确保在缺乏历史先例时，Agent 能输出“高不确定性”而非“错误的高置信度”。\n\n**(c) 第一个实验设计：**\n构建一个**“因果鲁棒性基准（Causal Robustness Benchmark）”**，包含两类任务：\n1.  **因果发现任务**：给定一组气象变量和灾害结果，要求 Agent 识别出关键的**因果驱动因子（Causal Drivers）**，而非仅仅是统计相关因子。\n2.  **反事实压力测试**：提供一组经过**因果干预**修改的气象场景（例如，保持温度不变但改变气压梯度），评估 Agent 是否能正确预测灾害类型的转变。\n\n实验将对比 SIREN（基于统计类比）与提出的 **Causal-SIREN**（基于因果图与反事实推理）在**分布内（In-Distribution）**和**分布外（Out-of-Distribution）**场景下的表现。预期 **Causal-SIREN** 在常规场景下性能相当，但在 OOD 场景和因果机制发生变化的场景中，能显著降低误报率（False Positives）和漏报率（False Negatives），并能够明确解释其决策的因果逻辑，从而为操作化预警提供更具可解释性和鲁棒性的支持。这一方向将气象 AI 从“模式匹配”推向“因果理解”，是迈向真正自主、可靠预警系统的关键一步。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Hang Ni\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Weijia Zhang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Fan Liu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Mengqian Lu\",\n      \"affiliations\": [\n        2,\n        3\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Hao Liu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"The Hong Kong University of Science and Technology (Guangzhou)\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"The Hong Kong University of Science and Technology\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Otto Poon Center for Climate Resilience and Sustainability, The World Sustainable Development Institute\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Also with Otto Poon Center for Climate Resilience and Sustainability, The World Sustainable Development Institute.\"\n    }\n  ]\n}\n```", "summary_translation": "极端天气的早期预警对于减轻灾害性天气事件带来的社会、经济和环境风险至关重要。然而，以专家为中心的预警工作流程成本高昂、劳动密集，且难以在从预警到行动的整个过程中扩展。尽管大型语言模型（LLM）智能体在自动化天气相关任务方面取得了最新进展，但现有研究仍局限于孤立的科学任务，忽视了业务化极端天气早期预警所需的相互依赖的过程链。为了弥补这一差距，本研究探讨了通过 LLM 智能体实现自动化的端到端极端天气早期预警。我们首先开发了 SIREN-Bench，这是一个全面的基准测试，包含跨越 19 个任务的 600 个问答实例，涵盖四个独立的预警程序和一个端到端的预警链。在 SIREN-Bench 上的评估揭示了现有天气智能体框架中存在显著的能力差距。这促使我们开发了 SIREN，这是一个以经验为基础的智能体框架，灵感来源于专家对历史案例的使用，该框架将整合异构天气证据和工具的 agentic 执行环境与利用检索、技能蒸馏和预测建模来利用历史案例的一系列 agent harnesses 相结合。大量实验表明，SIREN 在独立预警程序和端到端预警链上均优于天气智能体基线。"}, {"title": "Agentic Autoresearch for CT Reconstruction", "arxiv_id": "2607.22824", "authors": "Andreas Maier, Lucas Kachelriess, Siming Bayer, Yixing Huang, Yan Xia, Amber Simpson, Moritz Zaiss", "summary": "Comparing CT reconstruction methods fairly is labor-intensive and largely manual, and many benchmarks use idealized data. We ask whether a large language model (LLM) agent can do the labor of reconstruction research on its own, and whether a ranking measured on ideal data predicts behavior under realistic noise. We built an agentic loop: the agent edits a solver, runs a short cluster job, reads one frozen metric, and revises. The metric is a calibrated headroom score against the FBP baseline, inside the field of view; every method shares the same differentiable fan-beam projector. We benchmarked 26 methods on Mayo low-dose CT (noise-limited) and a 128-view sparse-view breast task from the noiseless DL-Sparse-View Challenge, with validation-selected iterations scored on a held-out test set. Every trained breast model was then re-scored on noisy inputs (I_0 = 10^5 photons) without retraining, and separately retrained on matched noise. The agent independently implemented, tuned, and benchmarked all 26 methods, and recombined them into a compact solver of 969 parameters that ties the top Mayo tier at the 1% level using 0.4% of the champion's parameters. Benchmarking gives a tier of statistically indistinguishable top methods, not one winner. Mild input noise nearly inverts the breast ranking: the noiseless champion (a supervised image denoiser, hr 0.89) collapses to 0.00, while a learned primal-dual method rises to champion (0.72 to 0.93). An ideal-data leaderboard therefore does not predict robustness. The inversion is a transfer effect, not a permanent deficit: retraining on matched noise restores much of the clean ranking (Spearman rho 0.04 to 0.61). Noise is only the easiest confounder in an open-ended set (beam hardening, scatter, anatomy, disease), so no single-factor challenge certifies generality. Benchmarks should model a broad spectrum of realistic factors at once.", "category": "cs.AI", "cluster": "Agentic Frameworks \u0026 Automated Research", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文核心解决两个相互关联的问题：首先，验证大型语言模型（LLM）Agent 能否在固定计算预算和统一指标下，自动化地完成 CT 重建算法的实现、调优与基准测试（即 Agentic Autoresearch）；其次，探究在理想数据（如无噪声或低噪声）上建立的算法排名，是否能预测其在真实噪声环境下的鲁棒性。这一问题的重要性在于，当前深度学习 CT 重建领域存在严重的“评测-部署”鸿沟。现有的基准测试（Benchmarks）多依赖理想化数据（如 Mayo 低剂量挑战中的特定噪声分布或 DL-Sparse-View Challenge 中的无噪声合成数据），导致许多在榜单上表现优异的纯数据驱动方法（如监督式图像域去噪器）在面对真实临床中常见的分布偏移（如额外噪声、束硬化、散射）时性能急剧下降甚至崩溃。解决这一问题具有双重价值：在方法论上，它揭示了“已知算子”（Known Operator）嵌入物理模型对于提升泛化能力的关键作用，证明了仅靠理想数据排名无法保证临床鲁棒性；在工程范式上，它展示了 Agentic Autoresearch 能够以极低成本（相比人工编码）大规模并行评估数十种 SOTA 方法，从而加速从“单一因素挑战”向“多因素联合真实场景挑战”的范式转变，为构建更可靠的医学影像 AI 评测体系提供自动化基础设施。\n\n### § 2 前人工作与不足\n\n此前，CT 重建算法的开发与评测主要依赖人工手动实现与调优，而自动化研究（Autoresearch）在相邻领域已有初步探索，但存在显著局限。在算法层面，前人工作如 Learned Primal-Dual (LPD)、Variational Networks (VN) 和各类 Unrolled Networks 已证明将物理前向算子（Forward Operator）嵌入网络可提升性能，但缺乏在统一框架下对 26 种不同范式（从经典迭代到生成式先验）的系统性公平对比，且多数研究孤立地优化单一指标，未考察跨分布鲁棒性。在自动化层面，Karpathy 提出的 autoresearch 概念及 SWE-agent 等通用编码 Agent 已能解决软件工程任务，但在科学计算领域，现有系统往往缺乏对物理约束（如可微投影器）的严格 grounding，且多侧重于超参数搜索而非从零实现复杂求解器。\n\n现有工作的不足主要体现在三个方面：第一，**评测缺口与分布假设失效**。传统基准测试（如 Mayo 或 Breast CT Challenge）通常隔离单一变量（仅噪声或仅稀疏角），假设训练与测试分布一致。然而，真实临床场景是多因素耦合的（噪声、解剖结构、病理变化共存）。前人未充分量化“理想数据排名”与“真实噪声鲁棒性”之间的相关性，导致许多在干净数据上夺冠的监督式方法（Supervised Image-domain Denoisers）因过拟合干净分布而在轻微噪声下崩溃（如 hr 从 0.89 跌至 0.00），这一现象未被系统性揭示。第二，**工程成本与可扩展性瓶颈**。手动实现、调试和基准测试 26 种不同架构的求解器需要数周至数月的人力，且难以保证不同方法间几何管道（Geometry Pipeline）和指标计算的一致性。现有自动化工具缺乏针对医学影像物理模型（如 Fan-beam Projector）的专用上下文理解，无法高效处理复杂的物理约束代码生成。第三，**缺乏对“物理嵌入”与“先验来源”的系统性解耦分析**。虽然已知算子学习（Known Operator Learning）已被提出，但前人未通过大规模自动化实验明确展示：在噪声受限（Noise-limited）与稀疏角受限（Incompleteness-limited）不同场景下，最优架构（如去噪器 vs. 滤波数据一致性+原对偶展开）的根本差异，以及这种差异如何决定模型对分布偏移的敏感度。本文通过 Agentic Loop 填补了这一空白，不仅自动化了繁琐的实现过程，更通过引入噪声扰动实验，揭示了理想榜单的误导性，指出了当前单一因素挑战在认证算法通用性（Generality）上的根本缺陷。", "core_insight": "### § 3 重建作者的思考路径\n\n在深度学习重塑 CT 重建领域的背景下，研究者面临两个日益凸显的痛点：一是方法迭代与基准测试（Benchmarking）的效率瓶颈，二是理想化数据与临床现实之间的巨大鸿沟。\n\n首先，从**研究效率**的角度看，传统的重建算法开发是一个高度手工化、低自动化的过程。研究人员需要手动实现求解器（Solver）、配置几何参数、调整超参数并运行实验，这一循环耗时数周甚至数月。随着大语言模型（LLM）在代码生成和软件工程任务（如 SWE-agent）中展现出强大的自主执行能力，研究者自然联想到：能否将这种“Agentic”范式引入医学影像重建？即构建一个闭环系统，让 LLM 代理自主提出假设、修改代码、运行实验并根据指标反馈进行迭代。这不仅是为了加速，更是为了在统一的框架下公平地比较大量现有方法，消除人为实现偏差。\n\n其次，从**方法鲁棒性**的角度看，现有的基准测试（如 Mayo 低剂量挑战或 DL-Sparse-View 挑战）往往基于理想化或单一因素的数据（如纯噪声或纯稀疏视图）。然而，临床数据是复杂的，包含噪声、硬化、散射等多种混杂因素。经验观察表明，在理想数据上表现优异的纯数据驱动方法（如监督式图像去噪器）往往在分布外（Out-of-Distribution）数据上表现脆弱，甚至产生幻觉。相反，嵌入物理先验（Known Operator）的方法通常更具鲁棒性。但这一结论缺乏系统性的量化证据，尤其是当引入轻微的现实扰动（如少量噪声）时，排行榜是否会剧烈反转？\n\n因此，作者的思考路径是：利用 **Agentic Autoresearch** 这一新兴工具，在一个统一的、基于可微投影算子（Differentiable Projector）和固定指标（Calibrated Headroom）的框架下，大规模自动化地实现和基准测试 26 种主流重建方法。通过这种规模化实验，不仅验证了 LLM 代理在科研中的可行性，更关键的是，通过引入“噪声鲁棒性”实验，揭示了一个被忽视的现象：理想数据上的排名并不能预测现实场景下的鲁棒性，且这种脆弱性主要源于缺乏物理约束的监督学习范式。这一发现反过来强调了在基准测试中模拟多因素现实场景的重要性，而 Agentic 方法正是实现这种复杂基准测试的高效手段。\n\n### § 4 核心 Intuition\n\n这篇论文的核心直觉在于：**理想化数据上的性能排名具有误导性，因为它奖励了那些过度拟合特定数据分布而缺乏物理约束的方法，而这些方法在面对微小的现实扰动（如噪声）时会迅速崩溃。**\n\n通过引入嵌入物理先验（Known Operator）的求解器，模型不再仅仅学习从输入到输出的映射，而是学习在物理约束下求解逆问题，从而在分布外数据上保持鲁棒性。\n\n**Agentic Autoresearch** 的价值不仅在于自动化代码实现，更在于它使得大规模、多场景的公平比较成为可能，从而揭示了“单一因素基准测试无法验证通用性”这一深刻结论，并证明了通过重新训练或引入物理约束可以恢复方法的鲁棒性。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文的核心方法并非提出一种新的CT重建算法，而是构建了一个**Agentic Autoresearch Loop**（智能体自动研究循环），利用大语言模型（LLM）作为“自动研究员”，在统一的物理约束和评估指标下，自主实现、调优并基准测试多种CT重建方法。\n\n**核心 Pipeline 流程：**\n\n1.  **环境初始化与约束设定**：\n    *   **物理基础**：所有方法必须基于同一个可微分的扇束投影器（Differentiable Fan-beam Projector，如 PYRO-NN），确保前向投影（Forward Projection）和反向投影（Back Projection）的梯度可以流动，从而嵌入到深度学习网络中。\n    *   **评估指标**：定义一个固定的、冻结的指标——**Calibrated Headroom Score (hr)**。公式为 $hr = \\max(0, 1 - RMSE_{method} / RMSE_{FBP})$。该指标衡量重建方法相对于滤波反投影（FBP）基线的改进程度，0表示未超越FBP，1表示完美重建。\n    *   **计算预算**：每次迭代限制固定的计算时间（如20分钟），确保公平比较。\n\n2.  **Agentic Loop 执行循环**：\n    *   **Step 1: 读取与诊断**：Agent 读取上一轮实验的结果（包括重建图像、残差图、hr分数）。它需要识别“失败模式”（Failure Mode），例如：hr分数停滞、出现条纹伪影（Streak Artifacts）、过度平滑（Over-smoothing）或噪声放大。\n    *   **Step 2: 假设与修改**：基于诊断，Agent 提出一个假设，并修改代码或超参数。修改可以是调整学习率、改变网络结构（如从图像域去噪改为数据一致性步骤）、或更换先验（Prior）。\n    *   **Step 3: 执行实验**：Agent 提交一个短时的集群作业（Cluster Job），运行修改后的求解器（Solver）。\n    *   **Step 4: 评估与决策**：作业完成后，Agent 读取新的 hr 分数。如果分数提升，则接受该修改并保留代码；否则，丢弃修改，回滚到上一版本。\n    *   **Step 5: 迭代**：重复上述过程，直到达到迭代次数上限或性能收敛。\n\n3.  **真实案例演示：稀疏视图乳腺CT重建（Sparse-view Breast CT）**\n    *   **输入**：128个视角的无噪声合成乳腺体素数据（Sinogram），由于视角稀疏，直接FBP重建会产生严重条纹。\n    *   **处理过程**：\n        *   *初始状态*：Agent 尝试使用纯图像域去噪网络（Image-domain Denoiser），发现 hr 分数卡在 0.26 左右，无法进一步去除条纹。\n        *   *诊断*：Agent 识别出瓶颈在于缺乏对投影数据物理一致性的约束。\n        *   *修改*：Agent 将数据一致性算子（Data-consistency Operator, $\\mathbf{D}$）从简单的伴随算子（Adjoint, $\\mathbf{A}^\\top$）替换为滤波反投影（FBP）算子，并引入学习到的原对偶（Learned Primal-Dual, LPD）更新步骤。\n        *   *优化*：Agent 进一步添加一个轻量级的双边滤波（Bilateral Filter）作为输出后处理。\n    *   **输出**：最终得到一个仅含 195 个参数的紧凑求解器（Compact Solver），其 hr 分数达到 0.62，远超初始方案，且参数量仅为冠军方法的 0.04%。\n\n4.  **鲁棒性测试 Pipeline**：\n    *   在理想数据上训练好模型后，Agent 将测试集输入添加轻微的泊松噪声（Poisson Noise，$I_0 = 10^5$ photons）。\n    *   **无重训练评估**：直接加载在干净数据上训练好的权重，在噪声数据上推理，重新计算 hr。\n    *   **重训练评估**：在匹配噪声的训练数据上重新训练模型，再次评估。\n    *   **对比分析**：比较干净数据排名与噪声数据排名的相关性（Spearman $\\rho$），以验证方法的鲁棒性。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有提出新的数学理论推导，而是基于现有的**已知算子学习（Known Operator Learning）**框架和**正则化反问题（Regularized Inverse Problem）**理论。以下是核心公式的直觉解释：\n\n1.  **前向模型（Forward Model）**：\n    $$ \\mathbf{g} = \\mathbf{A}\\mathbf{x} + \\boldsymbol{\\varepsilon} $$\n    *   **直觉**：这是CT成像的基本物理方程。$\\mathbf{x}$ 是我们想求的图像，$\\mathbf{A}$ 是投影矩阵（代表X射线穿过物体的路径积分），$\\mathbf{g}$ 是探测器接收到的信号（Sinogram），$\\boldsymbol{\\varepsilon}$ 是噪声。重建的目标就是从 $\\mathbf{g}$ 反推 $\\mathbf{x}$。由于视角稀疏或噪声存在，这是一个病态问题（Ill-posed problem），即解不唯一或不稳定。\n\n2.  **正则化反问题（Regularized Inversion）**：\n    $$ \\hat{\\mathbf{x}} = \\arg\\min_{\\mathbf{x}} \\underbrace{\\|\\mathbf{g} - \\mathbf{A}\\mathbf{x}\\|_2^2}_{\\text{Data Consistency}} + \\lambda \\underbrace{\\mathcal{R}(\\mathbf{x})}_{\\text{Prior/Regularizer}} $$\n    *   **直觉**：为了得到合理的解，我们需要平衡两项：\n        *   **数据一致性（Data Consistency）**：重建图像投影回去后，应该尽可能接近测量数据 $\\mathbf{g}$。\n        *   **先验/正则化（Prior/Regularizer, $\\mathcal{R}$）**：图像应该符合某种“合理”的结构（如平滑性、稀疏性）。$\\lambda$ 是权衡参数。\n    *   **论文观点**：传统方法手工设计 $\\mathcal{R}$（如全变分 TV），而深度学习方法学习 $\\mathcal{R}$。论文强调将物理算子 $\\mathbf{A}$ 嵌入网络中，可以限制解空间，防止“幻觉”（Hallucination）。\n\n3.  **展开式优化（Unrolled Optimization）**：\n    $$ \\mathbf{x}_{k+1} = \\text{prox}_{\\lambda \\mathcal{R}_\\theta} \\left( \\mathbf{x}_k - \\eta \\mathbf{D}^\\top (\\mathbf{A}\\mathbf{x}_k - \\mathbf{g}) \\right) $$\n    *   **直觉**：这是将迭代优化算法（如近端梯度下降）“展开”成神经网络层的过程。\n        *   $\\mathbf{D}^\\top (\\mathbf{A}\\mathbf{x}_k - \\mathbf{g})$：计算残差并映射回图像空间（数据一致性步骤）。\n        *   $\\text{prox}_{\\lambda \\mathcal{R}_\\theta}$：近端算子，通常由神经网络实现，负责根据先验知识“清洗”图像。\n        *   整个网络有 $K$ 层，每层对应一次迭代，参数 $\\theta$ 通过端到端训练学习。\n\n4.  **校准头室分数（Calibrated Headroom Score, hr）**：\n    $$ hr = \\max\\left(0, 1 - \\frac{\\text{RMSE}(\\hat{\\mathbf{x}}, \\mathbf{x}_{\\text{truth}})}{\\text{RMSE}(\\mathbf{x}_{\\text{FBP}}, \\mathbf{x}_{\\text{truth}})}\\right) $$\n    *   **直觉**：这是一个相对指标。分母是FBP基线的误差，分子是当前方法的误差。\n        *   如果方法比FBP差，hr 为 0。\n        *   如果方法误差减半，hr 为 0.5。\n        *   如果方法完美重建，hr 为 1。\n    *   **优势**：它消除了不同数据集绝对误差量纲的影响，专注于“改进幅度”，适合跨方法比较。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n*   **问题一（自动化研究）**：LLM Agent 能否在统一的物理约束和评估指标下，自主实现、调优并基准测试多种CT重建方法，从而替代繁琐的人工实验流程？\n*   **问题二（基准测试的可靠性）**：在理想数据（无噪声或稀疏视图）上表现最好的方法，是否在现实世界的噪声扰动下依然鲁棒？理想数据的排行榜是否能预测方法的泛化能力？\n\n**2. 设计了什么实验验证这个问题？**\n*   **实验一：Agentic Benchmarking**\n    *   构建 Agentic Loop，让 Agent 在两个数据集上（Mayo低剂量CT-噪声受限；Breast稀疏视图CT-欠采样受限）自主实现和调优 26 种主流重建方法。\n    *   使用统一的 hr 指标和计算预算，生成排行榜。\n    *   让 Agent 尝试组合不同组件，寻找参数高效的紧凑求解器（Compact Solver）。\n*   **实验二：噪声鲁棒性测试（Distribution Shift）**\n    *   在 Breast CT 测试集上添加轻微的泊松噪声（$I_0 = 10^5$）。\n    *   **无重训练（No-retrain）**：直接使用在干净数据上训练好的模型权重，在噪声数据上推理，重新排名。\n    *   **重训练（Retrain）**：在匹配噪声的训练数据上重新训练模型，再次排名。\n    *   对比干净数据排名、噪声无重训练排名、噪声重训练排名之间的相关性（Spearman $\\rho$）。\n\n**3. 问题的答案是什么？**\n*   **关于自动化研究**：\n    *   LLM Agent 能够高效地实现、调优和基准测试方法，大幅降低人工成本（从数周缩短至数小时）。\n    *   Agent 能发现参数高效的紧凑求解器（如 Mayo 上的 969 参数去噪器，Breast 上的 195 参数原对偶网络），其性能可与顶级方法媲美。\n    *   但 Agent 缺乏创新能力，主要依赖人类指导进行探索，且容易过拟合单一指标。\n*   **关于基准测试的可靠性**：\n    *   **理想数据排行榜不可靠**：在干净数据上排名第一的方法（如监督图像域去噪器），在轻微噪声下性能崩溃（hr 降至 0.00），排名跌至末尾。\n    *   **排名反转**：噪声导致排名几乎完全反转（Spearman $\\rho \\approx 0.04$）。物理正则化方法（如 Learned Primal-Dual）和手工平滑方法（如 Bilateral Filter）在噪声下表现更鲁棒，排名上升。\n    *   **可修复性**：这种崩溃是分布不匹配（Distribution Mismatch）导致的，而非架构缺陷。通过在匹配噪声的数据上重训练，排名大部分恢复（Spearman $\\rho$ 升至 0.61）。\n    *   **核心结论**：单一因素（如仅噪声或仅稀疏）的挑战无法验证方法的通用性（Generality）。未来的基准测试应模拟多种现实因素（噪声、硬化、散射等）的共存，而 Agentic Autoresearch 是实现这种大规模、复杂基准测试的有效工具。", "additional_insights": "### § 8 Take-aways\n\nLLM Agent 能够自动化 CT 重建算法的实现、调优与基准测试，显著降低了从论文到代码的工程成本，但并未发明新算法，其核心价值在于规模化实验执行。在理想数据（无噪声或低剂量）上表现优异的监督式图像域去噪器（Supervised Image-domain Denoisers），在面对轻微的真实噪声扰动时性能会急剧崩溃，导致排行榜完全反转。包含物理先验（Physics-in-the-loop，如 Learned Primal-Dual）或手工平滑先验（Hand-crafted Smoothing）的方法在噪声环境下表现出更强的鲁棒性，因为它们在推理阶段重新求解测量数据而非仅对固定图像进行去噪。理想数据排行榜无法预测模型在分布偏移（Distribution Shift）下的鲁棒性，这种崩溃源于训练/测试分布不匹配，而非架构本身的缺陷，通过在匹配噪声数据上重新训练（Retraining）可部分恢复排名。单一因素的挑战（如仅加噪声）无法验证方法的通用性（Generality），因为真实临床场景涉及束硬化、散射、解剖结构等多重并发偏移，基准测试应模拟更广泛的现实因素组合。\n\n### § 9 最脆弱的假设\n\n最关键的假设是：**“在理想数据（如无噪声稀疏视图）上训练的最佳模型，其性能排名在引入轻微真实噪声后具有可预测性或相关性。”** 如果这一假设成立，现有的基于理想数据的基准测试（Leaderboard）就具有指导意义；但论文证明该假设不成立，Spearman 相关系数仅为 0.04，排名几乎完全反转。在实际中，这一假设不成立的原因是：监督式深度学习模型（特别是纯图像域映射）严重依赖训练数据的统计分布，当输入数据出现训练集中未见的噪声模式时，模型会偏离其学习到的流形（Manifold），导致幻觉或结构化错误，而物理约束模型则通过正向算子（Forward Operator）在推理时重新适应噪声数据。论文通过对比无噪声和有噪声（$I_0 = 10^5$ photons）测试集上的排名，以及重新训练后的排名恢复情况，提供了强有力的反证证据；然而，论文缺少对更复杂、多因素并发偏移（如同时存在噪声、束硬化和金属伪影）下该假设失效程度的量化证据，仅证明了噪声这一单一“容易”混淆因素的破坏力。\n\n### § 10 最小复现实验\n\n在 1 周内，你可以复现论文中关于“噪声导致排名反转”的核心发现，无需复现整个 Agentic 循环。使用公开的 Mayo Low-Dose CT 数据集或合成稀疏视图数据（如论文使用的 Breast CT Challenge 数据），选取两个代表性模型：一个纯监督式图像域去噪器（如 U-Net 或 DD-Supervised）和一个物理约束模型（如 Learned Primal-Dual 或 Variational Network）。首先，在无噪声或低噪声数据上训练这两个模型，并记录其在测试集上的 Headroom (hr) 或 SSIM 分数，确认监督模型在理想条件下通常表现更好或相当。然后，向测试集投影数据添加轻微的高斯或泊松噪声（模拟 $1-2\\%$ 的噪声水平），**不重新训练**模型，直接推理并计算新的指标。如果监督模型的分数大幅下降（如 hr 接近 0 或 SSIM 显著降低），而物理约束模型分数保持相对稳定或下降幅度较小，则支持了论文关于“理想数据排名不预测噪声鲁棒性”的 Claim。反之，如果两者性能下降比例相似，则反驳了该特定架构差异导致的鲁棒性差异结论。此实验仅需标准深度学习框架和公开数据，重点在于对比“无重训”情况下的分布偏移敏感性。", "research_value": "### § 11 最强反例设计\n\n要挑战这篇论文的核心结论，最有力的攻击并非质疑 LLM Agent 的代码生成能力，而是攻击其**评估指标（Calibrated Headroom Score, hr）与临床效用之间的脱节**，以及**“重训练恢复排名”这一结论对“鲁棒性”定义的偷换概念**。\n\n首先，**替代解释攻击：指标陷阱与伪影掩盖**。论文使用 $hr$ 分数（基于 RMSE 相对于 FBP 的改进）作为唯一优化目标。RMSE 对全局像素误差敏感，但对局部结构保真度（如微小病灶的边缘锐度）不敏感。一个强有力的反例是展示：在噪声环境下，某些物理约束模型（如 Learned Primal-Dual）虽然 $hr$ 分数较高，但可能引入了严重的**过度平滑（Over-smoothing）**或**结构化伪影（Structured Artifacts）*
