Nodes* 将“读取 CSV”和“预览数据”分组为 `inspect` 类型的 Action Node；将生成的“缺失值统计表”和“小时均值图”标记为 Artifact Nodes。\n    *   *Workflow Nodes* 将上述节点聚合为 `inspect` 阶段、`execute` 阶段（含错误修复子流程）、`validate` 阶段和 `claim` 阶段。\n    *   *Edges* 建立连接：`claim` (最终报告) `supports` \u003C- `artifact` (图表) `produced_by` \u003C- `action` (绘图代码执行) `uses` \u003C- `artifact` (清洗后的数据)。\n*   **输出**：审查者在 Dashboard 中点击最终报告（Claim），沿 `supports` 边看到生成的图表，再沿 `produced_by` 边看到绘图代码，发现代码曾失败并经过 Patch 修复，从而确认结论的可靠性。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有核心数学推导。LEDGER 是一个系统架构与可视化方法，其核心贡献在于**数据结构设计**（分层图模型）和**语义关系定义**（Typed Semantic Edges），而非数学算法或理论证明。因此，跳过此节。\n\n### § 7 实验设计与结论\n\n**提出了什么问题**\n现有的 Agent Observability 系统（如 LangSmith）仅提供细粒度的事件日志（Event Trace），缺乏对“哪些事件支撑特定结论”的结构化组织。这导致人工审计成本高，审查者需手动重构任务结构和证据关系，难以进行高效的“以证据为中心”的审计。\n\n**设计了什么实验验证这个问题**\n论文通过两个典型的 Agent 工作流案例研究（Case Studies）来验证 LEDGER 的有效性：\n1.  **数据分析案例（Tabular Data Analysis）**：使用空气质量数据集，任务涉及数据清洗、缺失值处理、聚合统计和绘图。重点考察 **Artifact Lineage**（工件谱系），即从源数据到最终图表和报告的证据链条。\n2.  **代码开发案例（Feature Addition in Existing Codebase）**：在 NetworkX 库中添加新功能。重点考察 **Code Grounding**（代码落地），即代码修改如何基于对现有代码库的检查，以及如何通过测试进行验证。\n\n实验通过对比传统日志查看方式与 LEDGER 图视图，展示审查者如何更快速地定位关键决策、错误修复步骤和验证覆盖范围。\n\n**问题的答案是什么**\n1.  **LEDGER 能有效暴露工作流结构和证据关系**：在数据分析案例中，LEDGER 清晰展示了从数据清洗到最终图表的完整路径，并突出了错误修复过程（如依赖缺失导致的失败及后续 Patch），使审查者能确认结论是否基于正确的数据处理。\n2.  **LEDGER 能区分设计意图与事后修复**：在代码案例中，LEDGER 将初始实现与后续的边界情况修复（Guard Patch）分离为不同的 Workflow Phases，使审查者能明确哪些行为是原始设计，哪些是事后补充，从而更准确地评估代码质量和测试覆盖度。\n3.  **结论**：分层追踪图（Layered Trace Graphs）通过将原始记录组织为 Claim-to-Evidence 的路径，显著提升了 Agent 输出的可审计性，使审查者能够从结论反向追溯至具体证据，而无需手动重构复杂的执行日志。", "additional_insights": "### § 8 Take-aways\n\nLLM Agent 的审计瓶颈已从“生成速度”转移至“证据可追溯性”，现有的 Observability 系统（如 LangSmith）仅提供扁平化的 Event Trace，缺乏将 Claim 与底层 Evidence 显式关联的结构化视图。LEDGER 提出了一种 Layered Trace Graph 架构，通过 Sidecar Tracer 捕获原始 Session 数据，并将其重构为 Trace Records、Evidence Nodes 和 Workflow Nodes 三层结构，实现了从结论到具体 Artifacts 和 Actions 的逆向追溯。该系统不依赖 Agent 的自我报告，而是通过解析 Hook Events 和 Transcript 构建确定性底层，再结合语义推断构建高层逻辑，从而在保留原始记录完整性的同时提供审计友好的导航路径。通过 Data Analysis 和 Code Editing 两个 Case Studies，LEDGER 展示了其如何暴露 Artifact Lineage（如数据清洗到图表生成的链路）和 Code Grounding（如代码修改与测试验证的对应关系），显著降低了人工重构任务结构的认知负荷。尽管高层 Graph 结构仍依赖模型推断且非完全确定性，但 LEDGER 通过保留底层 Trace Records 的索引，确保了审计过程的可验证性，为 Agent 输出的可信度评估提供了新的交互范式。\n\n### § 9 最脆弱的假设\n\nLEDGER 核心贡献成立的最关键假设是：**Tracer Agent 能够准确且稳定地从非结构化的 Session Transcript 和 Tool Call Logs 中推断出正确的 Semantic Edges（如 `supports`, `checked_by`）和 Workflow Node 归类。** 如果这一假设不成立，即 Tracer 错误地连接了无关的 Action 与 Claim，或遗漏了关键的验证步骤，那么生成的 Trace Graph 将误导审计者，导致“虚假的可追溯性”，其危害甚至大于无结构的日志，因为用户可能盲目信任 Graph 的导航路径而忽略实际缺失的证据。在实际中，该假设可能失效的原因在于 LLM 对复杂上下文（如多轮对话中的隐含依赖、间接的数据流传递）的理解存在噪声，且不同 Agent 框架的 Log 格式差异巨大，导致泛化能力受限。论文在 Discussion 部分承认了 Graph 构建的非确定性（non-deterministic）和潜在的不稳定性，并指出当前主要依赖 Codex 的特定 Hook 机制，缺乏跨平台的一致性验证。虽然论文提供了 Case Studies 展示 Graph 的合理性，但并未提供定量指标（如 Edge 预测的 Precision/Recall 或人工标注的一致性检验）来证明 Tracer 推断的鲁棒性，这使得“推断结构”的可信度成为整个系统最大的风险点。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 LEDGER 的核心价值主张：**“结构化 Graph 视图比扁平日志更能高效定位 Claim 的支持证据”**。\n\n*   **数据**：选取 5-10 个公开的、包含多步工具调用（Tool Use）和文件修改的 LLM Agent Session Logs（例如来自 LangSmith 或 OpenAI Codex 的公开示例，涵盖代码生成和数据清洗任务）。\n*   **实现**：\n    1.  **Baseline**：构建一个简单的日志查看器，按时间顺序展示原始 JSON Logs。\n    2.  **LEDGER-Lite**：实现一个简化的 Graph 构建器。不依赖复杂的 LLM 推断，而是使用规则引擎（Regex/Heuristics）提取关键节点：将 `tool_call` 和 `tool_result` 配对为 Evidence Node，将 `file_write` 标记为 Artifact Node，并基于文件名匹配建立简单的 `produces` 和 `uses` 边。构建一个简易的前端，支持从最终输出（Claim）反向点击追踪到相关的 Artifact 和 Action。\n*   **测量**：招募 5-10 名具有技术背景的审计者，执行“证据溯源”任务（例如：“找出支持最终报告结论的原始数据清洗步骤”或“找出导致最终代码错误的初始修改”）。记录两组（Baseline vs. LEDGER-Lite）完成任务所需的**时间**和**点击次数**，以及审计者对“证据完整性”的主观评分。\n*   **结果判定**：如果 LEDGER-Lite 组在任务完成时间和点击深度上显著优于 Baseline 组，且主观评分更高，则支持了“结构化 Graph 提升审计效率”的 Claim。反之，若差异不显著或 Graph 导致误导，则反驳了该方法的必要性或有效性。此实验避开了复杂的 Tracer 推断模块，直接验证了“分层可视化”这一核心交互设计的价值。", "research_value": "### § 11 最强反例设计\n\n要挑战 LEDGER 的有效性，最有力的反例并非证明其“无法构建图”，而是证明其构建的图在复杂动态环境中会产生**“语义幻觉”（Semantic Hallucination）**，从而误导审计者。具体而言，可以设计一个**“隐式状态依赖与间接因果”**的反例场景：\n\n**场景设定**：一个 LLM Agent 执行一个多步骤的数据科学任务，其中包含一个隐蔽的“静默失败”（Silent Failure）。例如，Agent 首先调用 `tool_A` 读取配置文件，该配置文件中包含一个错误的参数 `param_X`。随后，Agent 调用 `tool_B` 进行数据预处理，`tool_B` 内部逻辑依赖于 `param_X`，但由于代码中的默认值回退机制（Default Fallback），`tool_B` 并未报错，而是使用了错误的默认值生成了中间数据 `Artifact_1`。接着，Agent 调用 `tool_C` 基于 `Artifact_1` 生成最终图表 `Claim`。\n\n**攻击逻辑**：\n1.  **Tracer 的局限性**：LEDGER 的 Tracer Agent 主要基于显式的 `Tool Call` 和 `Tool Result` 以及文件名匹配来推断 `uses` 和 `produces` 边。在这个场景中，`tool_B` 的结果是成功的（无 Error），且 `Artifact_1` 确实由 `tool_B` 产生。Tracer 会正确地建立 `tool_B` -\u003E `Artifact_1` -\u003E `tool_C` -\u003E `Claim` 的链路。\n2.  **缺失的因果链**：然而，导致 `Claim` 错误的根本原因是 `tool_A` 读取的错误配置 `param_X`。由于 `tool_B` 没有显式地“读取” `tool_A` 的输出文件（而是通过环境变量或内存中的全局状态间接依赖），LEDGER 的静态分析或基于日志的推断很难建立 `tool_A` 与 `tool_B` 之间的 `informs` 或 `causes` 边。\n3.  **误导性结论**：审计者在 LEDGER 的 Graph View 中，从 `Claim` 反向追踪，会看到一条看似完美、无错误的证据链：`Claim` \u003C- `tool_C` \u003C- `Artifact_1` \u003C- `tool_B`。所有节点状态均为“Success”。审计者会误认为数据预处理步骤是可靠的，从而忽略了对上游配置 `tool_A` 的检查。\n4.  **对比 Baseline**：在传统的扁平日志中，虽然查找困难，但审计者可以通过全局搜索 `param_X` 或阅读 `tool_B` 的代码实现（如果可见）发现潜在风险。而 LEDGER 提供的“结构化清晰感”反而成为一种**认知陷阱**，因为它将“执行成功”等同于“逻辑正确”，掩盖了隐式的状态污染。\n\n**理论论证**：LEDGER 的核心假设是“执行日志中的显式交互足以重构因果图”。但在软件工程和数据管道中，大量的依赖是隐式的（Implicit Dependencies），如全局变量、环境变量、共享内存或文件系统副作用。如果 Tracer 无法解析这些隐式依赖，生成的 Graph 就是**不完整且具有欺骗性的**。这种“虚假的可追溯性”比无结构的日志更危险，因为它赋予了审计者错误的信心。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“静态证据图”到“动态因果验证”——基于形式化验证的 Agent 审计框架（Formal Verification for Agent Auditability）**\n\n**(a) 驱动局限与未满足需求**\nLEDGER 的核心局限在于其**被动性**和**推断性**。它依赖于 Tracer Agent 对日志的语义推断来构建图，这种推断是非确定性的，且无法验证“隐式依赖”或“逻辑正确性”。审计者看到的只是“发生了什么”（What happened），而不是“为什么必然导致这个结果”（Why it must lead to this result）。现有的审计方法缺乏对 Agent 执行逻辑的**形式化保证**，无法区分“巧合的正确”与“逻辑的正确”。因此，需要一个从“可视化追溯”转向“逻辑验证”的新范式，不仅展示证据链，还能自动验证证据链的逻辑完备性。\n\n**(b) 借鉴相邻领域的方法**\n借鉴**形式化验证（Formal Verification）**和**程序分析（Program Analysis）**领域的技术，特别是**符号执行（Symbolic Execution）**和**依赖分析（Dependency Analysis）**。在软件工程中，这些技术用于证明程序在所有可能输入下都满足特定属性。我们可以将这些技术应用于 LLM Agent 的“伪代码”或“执行轨迹”：\n1.  **符号执行**：将 Agent 的 Tool Calls 视为函数调用，对输入数据进行符号化，追踪数据流和状态变化，从而发现隐式依赖。\n2.  **契约验证（Contract Verification）**：为每个 Tool 定义前置条件（Pre-conditions）和后置条件（Post-conditions），验证 Agent 的调用序列是否满足这些契约。\n\n**(c) 第一个实验设计**\n**实验名称**：FormalAgentAudit：基于符号执行的隐式依赖检测与验证\n\n1.  **系统构建**：\n    *   开发一个 **Symbolic Tracer**，它不依赖 LLM 推断语义边，而是通过解析 Agent 生成的代码（如 Python 脚本）和 Tool 的 API 定义，构建一个**数据流图（Data Flow Graph）**。\n    *   引入一个 **Verifier Module**，使用轻量级的符号执行引擎（如 Z3 Solver）对关键路径进行验证。例如，验证“最终图表的生成是否确实依赖于清洗后的数据，而非原始数据”。\n\n2.  **实验场景**：\n    *   使用与 LEDGER 相同的“数据清洗与分析”案例，但故意引入隐式错误（如上述的 `param_X` 静默失败）。\n    *   对比三种方法：\n        1.  **Baseline**：原始日志。\n        2.  **LEDGER**：基于语义推断的 Trace Graph。\n        3.  **FormalAgentAudit**：基于符号执行的数据流图与验证报告。\n\n3.  **测量指标**：\n    *   **隐式依赖检测率**：能够识别出未显式记录但实际存在的依赖关系的比例。\n    *   **误报率/漏报率**：在验证逻辑正确性时的准确性。\n    *   **审计效率**：审计者在发现“静默失败”类错误所需的时间。\n\n4.  **预期结果**：\n    *   LEDGER 可能无法建立 `tool_A` 与 `tool_B` 之间的边，导致审计者忽略错误。\n    *   FormalAgentAudit 通过符号执行发现 `tool_B` 的输出符号表达式中包含来自 `tool_A` 的符号变量，从而显式地标记出这条隐式依赖，并验证其是否满足预期契约。如果契约失败（如 `param_X` 超出范围），系统会直接发出警告，而不仅仅是展示一个“成功”的节点。\n\n**与已有工作的区别**：\n*   不同于 LEDGER 的**语义推断**（Semantic Inference），本方法采用**形式化推导**（Formal Derivation），提供确定性保证。\n*   不同于 AgentAuditor 的**黑盒评分**，本方法提供**白盒验证**，解释错误的具体逻辑原因。\n*   不同于传统的静态代码分析，本方法针对的是**动态生成的、多工具调用的 Agent 工作流**，需要处理非结构化日志与结构化代码的混合分析。\n\n这个研究方向将 Agent 审计从“辅助人类查看”提升到“自动验证正确性”，解决了 LEDGER 无法处理的隐式依赖和逻辑幻觉问题。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Daehong Kim\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Haichao Miao\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Shusen Liu\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Carnegie Mellon University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Lawrence Livermore National Laboratory\"\n    }\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "大型语言模型（LLM）智能体如今能够执行涉及复杂工具使用、代码执行、文件编辑和生成工件的长周期技术工作流。随着智能体以更快的速度完成更多工作，生产力瓶颈已从产出结果转移到审计这些结果是否正确和可信。智能体可观测性系统使细粒度的执行事件可见，但仅靠可见性仍要求审查者重建哪些操作、工件和验证步骤对特定结论至关重要。我们提出 LEDGER——用于执行审查的分层证据与决策图，这是一种在观察到的智能体会话上构建分层追踪图的追踪与审查系统。LEDGER 保留 Trace Records，同时将其分组为 Evidence Nodes 和 Workflow Nodes，将工件表示为证据锚点，并添加类型化的语义边，将主张与支持性操作、工件和检查连接起来。通过数据分析和编码示例，我们展示了生成的追踪如何揭示工作流决策、工件谱系、修复步骤、验证覆盖范围以及用于以证据为中心的审计的主张-支持路径。"}]}, {"name": "Self-Evolving Agents \u0026 Synthetic Environments", "count": 4, "papers": [{"title": "SPADE: Self-Play in Adaptive Synthetic Executable Environments", "arxiv_id": "2608.19197", "authors": "Bo Liu, Simon Yu, Yiding Jiang, Ao Qu, Andrew Zhao, Zichen Liu, Junsu Kim, Zijian Zhou, Seungone Kim, Tongzheng Ren, Mickel Liu, Hanfei Yu, Zhaorun Chen, Weiyan Shi, Paul Pu Liang, Luke Zettlemoyer, Yejin Choi, Natasha Jaques", "summary": "Continuous self-improvement requires an ever-expanding pool of self-generated, diverse, adaptive goals. For language agents, existing training environment pools (hand-curated, statically synthesized, or frozen-verifier) keep the goal distribution fixed as the learner scales. We introduce SPADE (Self-Play in Adaptive Synthetic Executable Environments), a self-play RL framework in which a single LLM plays two roles: an Environment Designer that writes complete, long-horizon training environments as executable code with an OpenAI Gym-style reset()/step() interface, and a Reasoning Agent that learns to act in them. Each is a stateful, multi-turn environment (state transitions, reward functions, and verification code), so one interface spans reasoning problems and multi-step agentic tool use. The Reasoning Agent's regret is estimated using the gap between its reward with and without privileged hints; in optimizing this regret signal the Environment Designer learns to target environments at the edge of the agent's capabilities while keeping them feasible. Through extensive experimentation, we find several components critical to success: grounding the Environment Designer on documents sampled from a large pretraining corpus, and giving it an accumulated environment memory. Scaling to 30B-parameter models, SPADE improves over the strongest fixed-environment baseline by +5.3 on average across eight held-out math, science, code, and reasoning benchmarks, and lifts the tool-use setting by +5.7 on BFCL-v4 multi-turn and +13.9 on ACEBench-Agent; on the games setting, the margin over the strongest baseline grows with model scale. By making environment design itself a learnable component, SPADE takes a concrete step toward open-ended self-improvement.", "category": "cs.CL", "cluster": "Self-Evolving Agents \u0026 Synthetic Environments", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Self-Evolving/Self-Improving, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-20 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文完全符合“LLM智能体及其演化”的研究范围，具体依据如下：\n\n1.  核心机制符合“自我演化”与“单智能体/多智能体”方向：\n       论文提出了 SPADE 框架，核心机制是 Self-Play（自我对弈） 和 Self-Improvement（自我改进）。这直接对应研究焦点中的“自我演化 (Self-Evolving)”方向，即智能体通过经验、反馈进行自我完善。\n       框架中包含两个角色：Environment Designer（环境设计者）和 Reasoning Agent（推理智能体）。这构成了一个多智能体系统（Multi-Agent System），其中两个智能体通过交互（一个生成环境，一个在环境中行动）共同进化。这符合“多智能体系统中新的协作机制”或“LLMs Improving LLMs”的定义。\n\n2.  涉及智能体的核心能力与组件：\n       论文明确提到了 Tool Use（工具使用）、Long-Horizon Decision-Making（长期决策）、Memory（记忆，特别是 Environment Designer 的 accumulated environment memory）以及 Planning/Reasoning。这些都是 Agentic AI 的核心能力。\n       它研究了如何让智能体在动态生成的、可执行的环境中学习和适应，这属于构建和改进 LLM 智能体方法论的前沿研究。\n\n3.  符合“保留”标准中的关键条款：\n       符合“保留 (Keep): 如果论文的核心机制是 self-evolving / self-improving ... 即使对象是 ... 模型训练，也应优先保留”。\n       符合“保留 (Keep): 如果论文研究 ... agent training/distillation/RL ... 并且标题或摘要明确指向 Agentic / LLM Agents / Self-Evolving”。\n       虽然涉及 RL（强化学习），但其应用场景是 LLM Agent 在合成环境中的自我对弈和演化，而非通用的基础模型训练，因此不属于排除项。\n\n4.  排除项检查：\n       不涉及安全、对齐、可解释性等排除领域。\n       不涉及纯基础设施或硬件加速。\n       虽然涉及代码生成（作为环境构建手段），但目的是构建智能体训练环境，而非单纯的代码生成应用，且核心贡献在于演化机制。\n\n综上，该论文是关于 LLM 智能体通过自我对弈和自适应环境生成实现自我演化的典型研究，高度契合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：如何实现大语言模型（LLM）的**开放式自我改进（open-ended self-improvement）**，即打破当前训练环境分布固定导致的性能瓶颈，使模型能够持续生成并适应于其能力边界（capability frontier）的动态训练环境。\n\n这一问题的重要性源于 Agentic AI 发展的根本性瓶颈。随着高质量人类文本资源的枯竭，模型能力的提升越来越依赖于通过经验学习（learning through experience），即在与环境的交互中通过奖励信号进行优化。然而，现有的训练环境池——无论是人工构建（hand-curated）、静态合成（statically synthesized）还是基于冻结验证器（frozen-verifier）——其目标分布是固定的。当模型在固定环境中耗尽学习潜力后，性能便会停滞。尽管业界投入巨资构建环境，但缺乏自适应性的环境供给限制了模型的进一步进化。\n\n解决该问题的价值在于：\n1.  **突破性能天花板**：通过让环境设计本身成为可学习的组件，模型可以持续获得位于其当前能力边缘的挑战，从而实现持续的能力增长，而非在固定数据集上饱和。\n2.  **统一多模态任务范式**：SPADE 提出的 **Code-as-Environment** 表示法，将单轮推理（single-turn reasoning）和多轮智能体工具使用（multi-turn agentic tool use）统一在同一个 Gym-style 接口下，使得同一套自博弈框架能同时提升数学推理、代码生成和复杂工具调用能力。\n3.  **迈向通用人工智能的关键一步**：通过 **Self-Play** 机制，模型不仅学习如何解决问题，还学习如何构建用于学习的世界，这是从固定基准测试向无限自我改进系统演进的具体步骤。\n\n### § 2 前人工作与不足\n\n该问题此前已有多个方向的研究尝试，但均存在显著局限，无法实现真正的开放式自我改进：\n\n1.  **固定环境合成与扩展（Synthetic Generation \u0026 Scaling）**：\n    *   **代表工作**：RLVE (Zeng et al., 2025), AgentScaler (Fang et al., 2025a), EnvScaler (Song et al., 2026), AWM (Wang et al., 2026b)。\n    *   **不足**：这些系统虽然能大规模生成环境，但其生成器（generator）通常是**冻结的（frozen）**或基于启发式规则。这意味着环境空间不随智能体的进步而增长，模型很快会耗尽环境中的学习信号。此外，它们通常生成的是带有稀疏终端奖励的“任务”（tasks），而非包含状态转移和奖励函数的完整多轮 **MDP 环境**，限制了其在复杂交互场景中的应用。\n\n2.  **无监督环境设计（Unsupervised Environment Design, UED）**：\n    *   **代表工作**：PAIRED (Dennis et al., 2020), POET (Wang et al., 2019), OMNI-EPIC (Faldor et al., 2024)。\n    *   **不足**：经典 UED 方法通常在**参数化（parameterized）**的小规模设计空间（如迷宫尺寸、地形摩擦系数）中搜索，而非在无限的代码空间中生成。OMNI-EPIC 虽然使用代码生成环境，但依赖一个**冻结的基础模型（frozen FM）**作为“有趣性”裁判，且生成器本身不通过 RL 梯度更新，缺乏与智能体的联合进化（co-evolution）。\n\n3.  **LLM 自博弈（Self-Play for LLMs）**：\n    *   **代表工作**：SPIRAL (Liu et al., 2025a), SPICE (Liu et al., 2025b), AZR (Zhao et al., 2025), R-Zero (Huang et al., 2025)。\n    *   **不足**：\n        *   **信息对称性与模式崩溃**：未接地（ungrounded）的自博弈受限于模型自身的知识边界，容易放大错误并导致模式崩溃（mode collapse）。虽然 SPICE 引入了语料库接地（corpus grounding），但它仅生成单轮“任务”（问题-答案对），而非多轮交互环境。\n        *   **缺乏完整环境结构**：大多数 LLM 自博弈方法生成的是静态问题，缺乏状态转移（state transitions）和中间奖励，无法训练智能体的长期规划和工具使用能力。\n        *   **奖励信号缺陷**：现有方法多使用启发式代理奖励（如难度、方差），容易受到奖励黑客（reward hacking）的影响，且无法精确地将环境难度锚定在智能体的学习前沿。\n\n**SPADE 的核心突破**在于它结合了上述方法的优点并克服了其缺陷：它使用 **Code-as-Environment** 生成完整的 MDP；通过 **Hint-based Regret** 奖励信号，利用智能体在有/无提示下的表现差距来精确估计最小最大遗憾（minimax regret），从而引导环境生成器始终产生位于智能体能力前沿的可解环境；并通过 **Corpus Grounding** 和 **Environment Memory** 确保环境的多样性和难度适应性，实现了真正的联合进化。", "core_insight": "### § 3 重建作者的思考路径\n\n在 SPADE 出现之前，LLM 的强化学习（RL）训练面临一个核心瓶颈：**高质量、可验证的训练环境（Environments）供给不足**。早期的工作主要依赖人类手工构建（Hand-curated）或静态合成（Static Synthesis）的环境池。然而，随着模型能力的提升，这些固定分布的环境很快被模型“刷穿”（Exhausted），导致训练停滞。为了解决这个问题，研究社区转向了**自我博弈（Self-Play）**和**无监督环境设计（Unsupervised Environment Design, UED）**。\n\n然而，现有的自我博弈方法存在明显的局限性。以 SPIRAL 或 SPICE 为代表的工作，虽然引入了语料库 grounding 来防止模式崩溃（Mode Collapse），但它们生成的仅仅是**任务（Tasks）**——即带有稀疏终端奖励（Sparse Terminal Reward）的单轮问答或推理题。这种“任务”缺乏状态转移（State Transitions）和中间反馈，无法模拟复杂的、多轮交互的 Agent 行为（如工具使用、代码调试）。此外，许多自我博弈方法中的“出题者”（Proposer/Designer）是冻结的，或者仅通过启发式规则（如难度过滤）进行更新，而非通过梯度进行端到端的联合优化。这导致环境分布无法随着求解者（Solver/Agent）的能力边界动态演进，容易出现“出题者”生成过于简单或完全不可解的环境，或者陷入信息对称导致的退化（Degeneration）。\n\n同时，经典的 UED 方法（如 PAIRED）依赖于**最小最大遗憾（Minimax Regret）**理论，通过对抗性生成环境来最大化求解者的学习潜力。但在 LLM 语境下，直接应用对抗性生成往往导致环境变得不可解（Unsolvable），因为对抗者没有动机去确保环境是“可学习的”，只关心让求解者失败。因此，需要一个既能保持环境可解性（Solvability），又能精准定位在求解者能力前沿（Learning Frontier）的信号。\n\n基于此，作者思考路径如下：\n1.  **统一表示**：既然任何可计算的马尔可夫决策过程（MDP）都可以写成代码，那么应该让 LLM 直接生成**可执行的 Python 代码**作为环境（Code-as-Environment），这样就能统一单轮推理和多轮 Agent 交互，突破固定参数化环境的限制。\n2.  **联合优化**：环境生成器（Environment Designer）不应是冻结的，而应与求解者（Reasoning Agent）共享参数，通过 RL 联合训练，实现真正的共进化（Co-evolution）。\n3.  **解决可解性与前沿性的矛盾**：借鉴 PAIRED 的遗憾思想，但引入**特权提示（Privileged Hint）**。如果环境对“有提示的 Agent”是可解的，但对“无提示的 Agent”是不可解的，那么这个环境就位于学习前沿。这个**基于提示的遗憾（Hint-based Regret）**信号，既保证了环境不是完全不可解的（因为有提示能解），又保证了环境具有挑战性（因为无提示难解），从而避免了纯对抗生成的不可解陷阱。\n4.  **防止退化**：引入外部语料库（Corpus Grounding）和环境记忆（Environment Memory），确保生成的环境具有新颖性且不会重复已掌握的内容。\n\n### § 4 核心 Intuition\n\nSPADE 的核心直觉在于将**环境设计本身视为一个可学习的、与求解者共演化的角色**，并通过**“有提示可解但无提示难解”**这一信号来精准定位学习前沿。\n\n传统方法中，环境是静态的或仅由冻结模型生成，导致模型在刷完固定题库后停止进步；而纯对抗生成则容易制造出不可解的难题。SPADE 通过让同一个 LLM 既当“出题人”又当“解题人”，并利用**特权提示（Privileged Hint）**作为能力上限的代理，计算出**遗憾（Regret）**：如果提示能帮 Agent 解决问题，说明环境是合理的（Solvable）；如果没提示 Agent 就解不出，说明环境具有挑战性（Challenging）。这种机制迫使环境生成器不断创造出恰好位于 Agent 当前能力边缘的、可执行的复杂交互环境，从而实现开放式的持续自我改进。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nSPADE (Self-Play in Adaptive Synthetic Executable Environments) 的核心方法是一个基于 **Self-Play** 的强化学习框架，其中单个大语言模型（LLM）通过共享参数 $\\pi_\\theta$ 扮演两个角色：**Environment Designer**（环境设计者）和 **Reasoning Agent**（推理智能体）。其核心创新在于将环境表示为可执行的 Python 代码（Code-as-Environment），并通过 **Hint-based Regret** 信号驱动环境与智能体的共同进化。\n\n以下是 SPADE 的完整 Pipeline，以一个具体的“热力学实验室”环境生成为例进行说明：\n\n1.  **环境生成阶段 (Environment Design)**：\n    *   **输入**：Environment Designer 接收来自预训练语料库（Corpus Grounding）的随机文档片段（例如一篇关于热力学循环的物理学论坛帖子）以及过往高难度环境的记忆（Environment Memory）。\n    *   **处理**：Designer 根据文档内容生成一个完整的、可执行的 Python 类（继承自 Gym-style 接口），包含 `reset()` 和 `step()` 方法。同时，Designer 生成一个 **Privileged Hint**（特权提示），例如：“可逆过程的净熵变必须为零”。\n    *   **输出**：一个可执行的 Python 环境代码 $e$ 和一个提示 $h$。\n    *   *例子*：Designer 生成了 `ThermodynamicCycleManipulationLabEnv`，要求智能体通过一系列操作（加热、膨胀等）使气体完成一个循环，并计算净熵变。\n\n2.  **智能体交互与评估阶段 (Reasoning Agent Rollouts)**：\n    *   **无提示交互 (No-Hint Play)**：Reasoning Agent 在不看提示 $h$ 的情况下，与环境 $e$ 进行多轮交互（调用 `step()`），尝试完成任务。记录其平均回报 $\\bar{r}_A(e)$。\n    *   **有提示交互 (Hint Play)**：Reasoning Agent 在上下文包含提示 $h$ 的情况下，再次与环境 $e$ 进行多轮交互。记录其平均回报 $\\bar{r}_A(e|h)$。\n    *   *例子*：\n        *   无提示时，Agent 盲目尝试操作，最终未能正确计算熵变，回报为 0.0。\n        *   有提示时，Agent 利用“净熵变为零”这一关键洞察，正确执行操作序列，回报为 1.0。\n\n3.  **奖励计算与策略更新 (Reward Calculation \u0026 Update)**：\n    *   **Designer 奖励 (Hint-based Regret)**：计算两个回报的差距 $r_D(e) = \\bar{r}_A(e|h) - \\bar{r}_A(e)$。这个差距被称为“遗憾”（Regret）。如果差距大，说明环境处于智能体的“学习前沿”（Learning Frontier）——即智能体目前解不开，但有了提示就能解开，具有极高的教学价值。\n    *   **Agent 奖励**：基于任务完成的正确性（Task Correctness）。\n    *   **联合更新**：使用 **GRPO** (Group Relative Policy Optimization) 算法，根据这两个奖励信号更新共享模型参数 $\\theta$。Designer 被鼓励生成更多处于前沿的环境，Agent 被鼓励提高解题能力。\n    *   *例子*：由于差距为 1.0，Designer 获得高奖励，模型参数更新以强化生成此类“有挑战性但可解”的热力学问题的能力；Agent 参数更新以学习如何应用热力学定律。\n\n4.  **循环迭代 (Iteration)**：\n    *   生成的环境及其后悔值存入记忆库。随着训练进行，Agent 能力增强，Designer 会自动生成更复杂、更隐蔽的环境（例如不再在提示中直接给出公式，而是要求推导），从而形成自适应的课程学习（Adaptive Curriculum）。\n\n### § 6 核心数学推导\n\nSPADE 的理论核心在于证明 **Hint-based Regret** 奖励机制能够引导系统达到一个理想的纳什均衡（Nash Equilibrium），在该均衡下，智能体在所有有效环境上都能达到最优性能。\n\n**1. 核心公式：Hint-based Regret**\n\n$$ r_D(e) = \\bar{r}_A(e|h) - \\bar{r}_A(e) $$\n\n*   **Intuition**：这个公式衡量的是“提示带来的增益”。\n    *   $\\bar{r}_A(e)$ 是智能体当前能力下的表现。\n    *   $\\bar{r}_A(e|h)$ 是智能体在拥有上帝视角（提示）下的表现，代表了该环境的“潜在可解性”或“上限”。\n    *   如果 $r_D(e)$ 很大，说明环境既不是太简单（否则两者都接近1，差距小），也不是太难/不可解（否则两者都接近0，差距小）。它精准地定位了“跳一跳够得着”的学习区域。\n\n**2. 理论背景与假设**\n\n为了分析这个游戏的均衡，论文定义了以下假设：\n*   **Assumption B.1 (Sound Generation)**：Designer 只生成数学上有效且可执行的环境。\n*   **Assumption B.2 (Articulated Hints)**：提示是完美的，即给定提示后，智能体能达到该环境的最优无提示价值 $R^\\star(e)$。也就是说，$R_{\\pi[h]}(e) = R^\\star(e)$。\n*   **Assumption B.3 (Internalizability)**：智能体可以通过学习，将“有提示时的行为”内化为“无提示时的行为”。即存在一个策略 $\\pi'$，使得 $R_{\\pi'}(e) = R_{\\pi[h]}(e)$。\n\n**3. 核心定理：纳什均衡意味着无提示最优性**\n\n**Theorem B.5** 指出，在上述假设下，任何纯策略纳什均衡 $(D^\\circ, \\pi^\\circ)$ 都满足：\n$$ R_{\\pi^\\circ}(e) = R^\\star(e) \\quad \\forall e \\in M $$\n\n*   **推导逻辑 (Intuition)**：\n    1.  **Designer 的动机**：Designer 的目标是最大化期望后悔值 $E_{e \\sim D}[r_D(e)]$。如果存在某个环境 $e$，智能体在没有提示时表现不佳（$R_\\pi(e) \u003C R^\\star(e)$），但有了提示就能做好，那么 Designer 就会倾向于生成更多这类环境，因为这样能获得高奖励。\n    2.  **Agent 的动机**：Agent 的目标是最大化无提示回报 $R_\\pi(e)$。\n    3.  **均衡状态**：如果系统达到均衡，Designer 无法通过改变环境分布来增加后悔值，Agent 也无法通过改变策略来增加回报。\n    4.  **结论**：如果还有任何环境存在“后悔”（即 $R_\\pi(e) \u003C R^\\star(e)$），Designer 就会把概率质量集中到这些环境上，迫使 Agent 改进。只有当所有环境的后悔值都为 0 时（即 $R_\\pi(e) = R^\\star(e)$），Designer 才无法通过选择特定环境来获利，系统达到均衡。此时，Agent 在所有环境上都达到了最优性能，提示变得多余（Vacuous）。\n\n**总结**：这个推导证明了 Hint-based Regret 不仅仅是一个启发式奖励，它在理论上保证了自玩过程会驱动智能体不断突破能力边界，直到掌握所有可生成的环境。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有的 LLM 训练环境池（无论是人工构建还是静态合成）是固定的，随着模型能力提升，固定环境会迅速饱和，导致模型停止进步。如何构建一个能够随模型能力共同进化、持续提供处于“学习前沿”环境的训练框架？\n\n**2. 设计了什么实验验证这个问题？**\n*   **基线对比 (Baselines)**：设计了 **Fixed-env GRPO** 和 **Fixed-env RLVE** 作为基线。这些基线使用固定的环境池（如 RLVE 的 400 个手工环境或 GPT-5.5 生成的静态环境）进行训练，以验证“自适应环境生成”是否优于“固定环境”。\n*   **消融实验 (Ablations)**：\n    *   **移除 Corpus Grounding**：验证外部语料库对维持环境多样性和防止模式崩溃（Mode Collapse）的重要性。\n    *   **移除 Environment Memory**：验证记忆机制对避免重复生成已掌握环境的重要性。\n    *   **冻结 Environment Designer**：使用固定的 GPT-5.5 作为 Designer，验证“联合训练”（Co-training）相对于“固定生成器”的优势。\n    *   **替换奖励信号**：将 Hint-based Regret 替换为 EMA-based Learning Potential，验证后悔信号在定位学习前沿上的优越性。\n*   **多领域评估**：在 **Games**（推理游戏）和 **Tool Use**（工具使用）两个截然不同的设置下进行测试，并评估其在 held-out 基准（如 AIME, GPQA, LiveCodeBench, BFCL, ACEBench）上的迁移效果。\n\n**3. 问题的答案是什么？**\n*   **自适应环境显著优于固定环境**：SPADE 在 30B 模型上比最强的固定环境基线平均高出 +5.3 分，且在训练后期固定基线饱和时，SPADE 仍能持续进步。\n*   **联合训练是关键**：冻结 Designer 或使用固定生成器（即使是更强的 GPT-5.5）的效果远不如联合训练的 SPADE，证明环境生成器本身需要通过学习来适应 Agent 的能力变化。\n*   **Corpus 和 Memory 不可或缺**：移除语料库导致环境多样性急剧下降（Vendi Score 从 0.68 降至 0.04），移除记忆导致模型在已掌握的任务上停滞。\n*   **Hint-based Regret 是最优信号**：相比 EMA 信号，Hint-based Regret 能更快速、更精准地定位学习前沿，带来更高的最终性能。\n*   **泛化能力强**：在 Games 设置下训练获得的推理能力，能有效迁移到数学、科学和代码基准；在 Tool Use 设置下，显著提升了多步交互任务的性能（如 ACEBench-Agent +13.9）。\n\n结论表明，将环境设计本身作为一个可学习的组件，并通过 Hint-based Regret 进行自玩训练，是实现 LLM 开放-ended 自我改进的有效路径。", "additional_insights": "### § 8 Take-aways\n\nSPADE 的核心突破在于将环境设计（Environment Design）本身转化为一个可学习的组件，通过单一 LLM 同时扮演 Environment Designer 和 Reasoning Agent，实现了基于 **hint-based regret** 的自适应课程学习。该方法利用 **code-as-environment** 表示法，将环境生成统一为编写具有 Gym-style `reset()/step()` 接口的 Python 代码，从而能够涵盖从单轮推理到多轮工具使用的复杂 **Markov Decision Process (MDP)**。Environment Designer 的奖励信号定义为 Reasoning Agent 在拥有特权提示（privileged hint）与无提示情况下的回报差距，这种 **minimax regret** 机制迫使生成器专注于生成位于 Agent 能力前沿（learning frontier）且可解的环境，避免了传统自博弈中常见的模式崩溃或难度失控。实验表明，在 30B 参数规模下，SPADE 在数学、科学、代码及工具使用基准上平均提升了 +5.3 至 +13.9 个百分点，且其增益随模型规模扩大而显著增长，优于固定环境基线。消融实验证实，**corpus grounding**（基于预训练语料库生成）和 **environment memory**（环境记忆）是维持环境多样性和防止重复生成已掌握任务的关键，而冻结 Designer 或使用固定前沿模型（如 GPT-5.5）均无法达到同等效果。\n\n### § 9 最脆弱的假设\n\nSPADE 最脆弱且关键的假设是 **Assumption B.3 (Internalizability of hinted behavior)**，即“带有提示的行为在没有提示的情况下也是可达的”。该假设认为，如果 Agent 在获得提示（hint）后能解决某个环境，那么它必然存在一种无需提示的策略也能达到相同的性能上限，从而使得 **hint-based regret** 能够准确衡量 Agent 当前的能力缺口并引导其学习。如果这一假设不成立，例如提示提供了 Agent 架构或上下文窗口无法内化的外部知识（如长程依赖或特定领域事实），那么高 regret 信号将错误地标记那些 Agent 根本无法通过内部推理掌握的环境，导致 Designer 生成大量“不可学”的任务，进而引发训练崩溃或性能停滞。论文在附录 B 中通过理论分析证明了在理想条件下该假设成立，但在实际实验中，小模型（4B/8B）的 regret 信号经常变为负值，表明提示有时会产生误导或提供无法内化的信息，这暗示了该假设在有限上下文或较小模型规模下可能失效。尽管论文通过 **corpus grounding** 和 **difficulty anchor** 缓解了这一问题，但并未提供直接证据证明所有高 regret 环境最终都能被 Agent 无提示掌握，这是该方法能否实现真正“开放-ended”自我改进的最大隐患。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 SPADE 的核心机制：**验证 hint-based regret 是否能有效筛选出位于能力前沿的环境**。具体步骤如下：\n1.  **数据与实现**：使用一个小型开源 LLM（如 Qwen2.5-7B-Instruct）作为基础模型。手动构建或从公开数据集（如 GSM8K 或简单的代码生成任务）中选取 50-100 个任务，并为每个任务编写一个简单的 Python 环境类（实现 `reset` 和 `step`）。\n2.  **提示生成**：使用一个更强的模型（如 GPT-4o 或 Claude 3.5 Sonnet）作为“Oracle Designer”，为每个环境生成一个特权提示（hint），该提示应包含解题的关键步骤或中间状态，但不直接给出最终答案。\n3.  **测量**：让基础模型在两种条件下运行每个环境：(a) 无提示，(b) 有提示。计算每个环境的 **regret** = $R_{with\\_hint} - R_{without\\_hint}$。\n4.  **验证 Claim**：将环境按 regret 排序，选取高 regret 组（Top 20%）和低 regret 组（Bottom 20%）。对高 regret 组的环境进行少量样本的 **Supervised Fine-Tuning (SFT)** 或 **GRPO** 训练，然后重新评估基础模型在无提示情况下的性能提升。\n5.  **结果判定**：如果高 regret 组的环境在训练后带来了显著的无提示性能提升，而低 regret 组（已掌握或不可解）提升甚微，则支持 SPADE 的核心 claim，即 regret 信号能有效定位学习前沿。反之，如果高 regret 组训练后无显著提升，则表明 regret 信号可能包含了噪声或不可内化的信息，反驳了该方法的有效性。此实验无需复现完整的自博弈循环，仅验证奖励信号的有效性。", "research_value": "### § 11 最强反例设计\n\n若要挑战 SPADE 的有效性，最有力的攻击并非针对其代码生成的语法正确性，而是针对 **Hint-based Regret** 信号在复杂 **Markov Decision Process (MDP)** 中的语义有效性，即证明该信号会系统性地奖励“虚假前沿”（False Frontier），导致模型陷入 **Reward Hacking** 而非真正的能力增长。\n\n**理论攻击：提示依赖性与推理内化的解耦（Decoupling of Hint-Dependency and Reasoning Internalization）**\nSPADE 的核心假设 **Assumption B.3 (Internalizability)** 认为，如果 Agent 在有提示时能解决环境，则存在一个无提示策略能达到相同性能。然而，在长程依赖或多步工具调用场景中，提示往往提供的是“关键洞察”或“中间状态”，而非完整的推理路径。反例设计如下：构造一类环境，其解决方案依赖于对特定领域公理的瞬间回忆（如物理常数或特定 API 的冷门参数），而非逻辑推导。\n*   **场景**：Designer 生成一个需要调用特定库函数 `lib.obscure_func()` 的环境。\n*   **现象**：Agent 在无提示时因不知道该函数存在而失败（$R_A(e) \\approx 0$）；在有提示（“使用 `lib.obscure_func()`”）时成功（$R_A(e|h) \\approx 1$）。\n*   **结果**：Regret 信号极高，Designer 被奖励生成更多此类“知识检索型”环境。\n*   **攻击点**：Agent 通过记忆提示中的函数名来“解决”问题，但这并未提升其 **Reasoning** 或 **Planning** 能力，只是增加了 **Context Window** 的利用率。随着训练进行，模型并未学会如何发现新工具，而是学会了“等待提示”。这导致模型在 held-out 基准上表现不佳，因为真实世界的问题无法提供特权提示。这种“记忆捷径”（Memorization Shortcut）使得 Regret 信号与真正的 **Capability Frontier** 脱钩，证明了 SPADE 可能只是在训练模型进行高效的 **Contextual Retrieval**，而非 **Open-ended Self-improvement**。\n\n**实验攻击：模式崩溃至“提示敏感型”环境（Mode Collapse to Hint-Sensitive Environments）**\n设计一个对比实验，监控 Designer 生成的环境分布随时间的变化。\n*   **假设**：如果 SPADE 有效，环境难度应平滑增加，且提示应逐渐从“直接答案”变为“启发式引导”。\n*   **反例预测**：Designer 会迅速收敛到一类环境，这类环境对提示极度敏感（即无提示必败，有提示必胜），但对无提示推理能力的提升贡献极低。例如，生成大量包含“陷阱”的环境，只有看到提示才能避开陷阱。\n*   **验证**：计算 Agent 在训练过程中对“无提示环境”的 **Sample Efficiency**。如果 SPADE 的样本效率低于固定环境基线，或者 Agent 在移除提示后的性能提升曲线出现平台期甚至下降，则证明 Regret 信号引入了噪声，导致模型在“学习如何解题”和“学习如何依赖提示”之间产生了负迁移。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“提示内化”到“环境解构”——基于因果干预的自适应环境生成（Causal Intervention-based Adaptive Environment Generation）**\n\n**（a）驱动局限与未满足需求**\nSPADE 的根本局限在于其 **Hint-based Regret** 机制隐含地假设“提示”是连接当前能力与潜在能力的桥梁。然而，如反例所示，提示可能仅提供事实性知识或捷径，而非推理结构。真正的 **Open-ended Self-improvement** 需要模型不仅学会“解题”，还要学会“理解问题的结构”。当前方法缺乏对环境 **Causal Structure** 的显式建模，导致 Designer 可能生成结构上简单但表面上困难（依赖提示）的环境，而非结构上复杂且需要深层推理的环境。我们需要一种机制，能够区分“知识缺口”（Knowledge Gap）和“推理缺口”（Reasoning Gap），并优先针对后者生成环境。\n\n**（b）借鉴相邻领域的方法**\n借鉴 **Causal Representation Learning** 和 **Interventional Data Augmentation** 的思想。在因果推断中，我们通过 **Do-calculus** 区分相关性与因果性。我们可以将环境生成视为一个 **Causal Graph** 的构建过程，其中提示不再是黑盒的“上帝视角”，而是对环境中特定 **Causal Nodes** 的干预（Intervention）。\n*   **核心概念**：引入 **Causal Regret**，定义为 Agent 在干预关键因果节点（如移除某个冗余步骤、改变某个物理参数）后的性能变化，而非仅仅依赖文本提示。\n*   **工具**：利用 **Program Synthesis** 生成可解释的 **Causal Graph** 伴随环境代码，使得 Designer 能够显式地操纵环境的因果结构，而非仅仅操纵文本提示。\n\n**（c）第一个实验设计**\n**实验名称：Causal-SPADE vs. Hint-SPADE 在结构泛化上的对比**\n1.  **环境构建**：修改 SPADE 的 Designer 输出，要求除了 Python 环境代码外，还必须生成一个简化的 **Causal Graph**（例如，使用 `networkx` 表示变量间的依赖关系）。\n2.  **干预机制**：\n    *   **Hint-SPADE (Baseline)**：使用原有的文本提示。\n    *   **Causal-SPADE (Proposed)**：Designer 生成环境时，同时生成一组 **Interventions**（例如，“如果移除步骤 A，结果会如何？”）。Agent 在训练时，不仅接收环境，还接收这些干预后的反事实结果（Counterfactual Outcomes）。\n3.  **奖励信号**：定义 **Causal Regret** 为 Agent 在原始环境与经过关键因果干预后的环境之间的性能差异。如果 Agent 能正确预测干预结果，说明它理解了环境的因果结构，而不仅仅是记住了提示。\n4.  **评估指标**：\n    *   **结构泛化能力**：在 held-out 测试中，使用与训练环境结构相似但参数不同的环境，评估 Agent 的性能。\n    *   **解释性**：分析 Agent 是否学会了忽略环境中的 **Spurious Correlations**（虚假相关），而专注于 **Causal Features**。\n5.  **预期结果**：Causal-SPADE 在结构泛化任务上显著优于 Hint-SPADE，证明通过因果干预而非文本提示来定位学习前沿，能更有效地提升模型的深层推理能力，而非仅仅是上下文记忆能力。\n\n这一方向将 SPADE 从“基于文本提示的自适应”提升到“基于因果结构的自适应”，为 **Agentic AI** 的 **Reasoning** 能力提供了更坚实的理论基础和更有效的训练信号。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Bo Liu\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Simon Yu\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Yiding Jiang\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Ao Qu\",\n      \"affiliations\": [\n        5\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Andrew Zhao\",\n      \"affiliations\": [],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zichen Liu\",\n      \"affiliations\": [\n        6\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Junsu Kim\",\n      \"affiliations\": [\n        7\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zijian Zhou\",\n      \"affiliations\": [\n        6\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Seungone Kim\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Tongzheng Ren\",\n      \"affiliations\": [],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Mickel Liu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Hanfei Yu\",\n      \"affiliations\": [\n        8\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zhaorun Chen\",\n      \"affiliations\": [\n        9\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Weiyan Shi\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Paul Pu Liang\",\n      \"affiliations\": [\n        5\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Luke Zettlemoyer\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yejin Choi\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Natasha Jaques\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"University of Washington\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Stanford University\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Northeastern University\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Carnegie Mellon University\"\n    },\n    {\n      \"id\": 5,\n      \"name\": \"Massachusetts Institute of Technology\"\n    },\n    {\n      \"id\": 6,\n      \"name\": \"National University of Singapore\"\n    },\n    {\n      \"id\": 7,\n      \"name\": \"Seoul National University\"\n    },\n    {\n      \"id\": 8,\n      \"name\": \"Stevens Institute of Technology\"\n    },\n    {\n      \"id\": 9,\n      \"name\": \"University of Chicago\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal contribution\"\n    }\n  ]\n}\n```", "summary_translation": "持续的自我改进需要一个不断扩展的、由自身生成的、多样化且自适应的目标池。对于语言智能体而言，现有的训练环境池（手工精选、静态合成或基于冻结验证器）在智能体规模扩大时保持目标分布固定。我们提出了 SPADE（Self-Play in Adaptive Synthetic Executable Environments），这是一种自博弈强化学习框架，其中单个大语言模型扮演两个角色：一个是环境设计器（Environment Designer），负责编写完整的、长视界的训练环境，这些环境以可执行代码形式呈现，并具备 OpenAI Gym 风格的 reset()/step() 接口；另一个是推理智能体（Reasoning Agent），负责学习在这些环境中行动。每个环境都是一个有状态的、多轮交互的环境（包含状态转移、奖励函数和验证代码），因此单一接口涵盖了推理问题和多步智能体工具使用。推理智能体的遗憾（regret）通过其在使用和不使用特权提示（privileged hints）时的奖励差距来估计；在优化这一遗憾信号的过程中，环境设计器学会将环境目标设定在智能体能力的边缘，同时保持其可行性。通过广泛的实验，我们发现几个关键组件对成功至关重要：基于从大型预训练语料库中采样的文档来锚定环境设计器，并为其提供累积的环境记忆。在扩展到 30B 参数模型时，SPADE 在八个保留的数学、科学、代码和推理基准测试上，平均比最强的固定环境基线高出 +5.3；在工具使用设置中，BFCL-v4 多轮任务提升 +5.7，ACEBench-Agent 提升 +13.9；在游戏设置中，相对于最强基线的优势随着模型规模的扩大而增长。通过将环境设计本身作为一个可学习的组件，SPADE 向着开放式自我改进迈出了具体的一步。"}, {"title": "Self-Evolving Agents as Dynamic Graph Transformation: A Survey and New Perspective", "arxiv_id": "2608.18104", "authors": "Yuanyuan Xu, Wenjie Zhang, Yin Chen, Xuemin Lin, Ying Zhang", "summary": "Large language model (LLM)-based agents are increasingly becoming self-evolving systems that persist across interactions, maintain memories, use tools, acquire skills, refine workflows, and coordinate with other agents. These capabilities make agent states structural and dynamic: entities, relations, attributes, dependencies, and execution structures change with new evidence, feedback, and environmental conditions. Existing graph-agent surveys typically treat graphs as support structures for agent functions rather than as evolving substrates, while self-evolving-agent surveys focus on agent-level mechanisms and rarely discuss graph topology evolution. Thus, the coupling between evolving agent state and dynamic graph topology remains underexplored. This survey connects these two research lines by framing \\textit{agent evolution as dynamic graph transformation}. We model agent state as a dynamic graph, where memories, tools, skills, workflows, and inter-agent relations are represented as typed nodes, edges, and subgraphs updated through schema-constrained rewrites. Based on this formulation, we organize existing dynamic-graph-based methods for self-evolving agents into four taxonomies: node/feature evolution, edge/topology evolution, subgraph activation, and cross-component co-evolution. Building on this taxonomy, we propose dynamic graph learning as reusable infrastructure for self-evolving agents and map nine dynamic-graph-learning subfields to agent-evolution capabilities, discussing their adaptations and possible failure modes. Finally, we discuss five types of graph-aware evaluation and governance protocols from a dynamic-graph perspective, which complement end-task evaluation. The goal is to provide a compact structural lens for designing and governing self-evolving agents.", "category": "cs.AI", "cluster": "Self-Evolving Agents \u0026 Synthetic Environments", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：如何将 **Self-Evolving Agents**（自演化智能体）的状态演化过程形式化为 **Dynamic Graph Transformation**（动态图变换），并以此统一视角来建模、分析和治理智能体的长期演化行为。具体而言，论文旨在解决现有研究中 **Agent Evolution**（智能体演化）与 **Dynamic Graph Topology**（动态图拓扑）之间的解耦问题，即如何将智能体的记忆、工具、技能、工作流及多智能体协作关系映射为具有类型约束的节点、边和子图，并通过 **Schema-Constrained Rewrites**（模式约束重写）来描述其随时间、反馈和环境漂移发生的结构性变化。\n\n这一问题的重要性在于，随着 **Large Language Model (LLM)** 驱动的智能体从短期任务求解器转变为长期运行的系统，其状态呈现出高度的 **Non-Stationary**（非平稳性）和 **Structurally Evolving**（结构性演化）特征。现有的评估和治理方法主要关注最终任务成功率（End-Task Evaluation），往往忽视了支撑这些结果的内部状态是否有效、安全且可追溯。例如，智能体可能依赖过时的记忆（Stale Memories）或泄露的未来信息得出正确答案，或者在不安全的更新通过依赖链传播后导致系统性故障。通过引入动态图视角，该研究能够揭示智能体内部状态的 **Provenance**（溯源）、**Dependency Propagation**（依赖传播）和 **Affected Scope**（影响范围），从而为设计可靠、可审计且可控的自演化智能体提供结构化的理论透镜。解决这一问题不仅能统一碎片化的智能体演化机制，还能将成熟的 **Dynamic Graph Learning (DGL)** 技术转化为智能体演化的可复用基础设施，填补了从“功能支持”到“状态演化治理”的关键空白。\n\n### § 2 前人工作与不足\n\n该问题此前并未被完整解决，现有研究主要分散在两个互补但割裂的领域，且均存在显著局限。\n\n第一类是 **Graph-Agent Surveys**（如图 [7], [8]），这类工作主要采取 **Agent-Functionality-Centered**（以智能体功能为中心）的视角。它们研究了如何利用静态或半静态的图结构来支持智能体的记忆检索、工具调用和多智能体协调。然而，这些方法通常将图视为支持智能体功能的静态基础设施，而非智能体状态本身演化的载体。它们未能建模智能体状态（如记忆、技能）在交互过程中发生的持久性结构更新，也缺乏对图拓扑随时间演化的形式化描述，因此无法捕捉智能体内部状态的耦合演化及其依赖传播。\n\n第二类是 **Self-Evolving-Agent Surveys**（如图 [9], [10]），这类工作主要采取 **Agent-Evolution-Mechanism-Centered**（以智能体演化机制为中心）的视角。它们关注智能体组件如何通过反思（Reflection）、自我训练（Self-Training）或经验蒸馏（Experience Distillation）进行适应。尽管这些研究涵盖了记忆更新、技能获取等机制，但它们通常将各个组件的演化视为独立事件，缺乏对组件间 **Structural Coupling**（结构耦合）的统一建模。由于缺乏统一的图形式化语言，这些研究难以分析局部更新（如一个工具接口的变更）如何通过依赖链引发全局性的级联效应（Cascade Effects），也无法有效评估演化过程中的安全性、可回滚性（Rollback）和审计性（Auditability）。\n\n此外，虽然 **Dynamic Graph Learning (DGL)** 领域（如图 [21]-[30]）提供了处理演化结构的成熟基础，但现有 DGL 研究主要针对通用图数据，并未针对自演化智能体的特定需求（如模式约束、类型安全、可解释性）进行适配。智能体领域的研究也鲜少探讨如何将 DGL 方法作为基础设施来支持智能体的预测、激活、生成和诊断。因此，现有工作存在明显的 **Evaluation and Governance Gap**（评估与治理缺口）：缺乏基于图结构的评估协议来检测状态泄漏、验证更新局部性（Locality）或追踪安全传播路径。本文通过提出 **Dynamic Graph Transformation** 框架，填补了上述空白，将分散的演化机制统一在动态图变换的范式下，并建立了 DGL 与智能体能力之间的系统映射。", "core_insight": "### § 3 重建作者的思考路径\n\n在深入阅读这篇综述之前，我们需要回到 LLM Agent 发展的早期阶段，观察当时研究社区面临的结构性困境。起初，Agent 被视为短视的任务求解器（short-horizon task solvers），其状态是瞬时的，记忆和工具调用仅服务于单次交互。然而，随着 Agent 向长期运行系统（long-running systems）演进，研究者发现传统的“静态图”或“非结构化文本”无法有效建模 Agent 的持久化状态。现有的 Graph-Agent 综述（如 [7], [8]）主要关注如何利用静态图作为检索增强生成（RAG）或工具调用的支持结构，即图是“被使用的对象”，而非“演化的主体”。与此同时，Self-Evolving Agent 的研究（如 [9], [10]）聚焦于反思（reflection）、自我训练（self-training）等机制，但这些工作往往将记忆、技能、工作流视为独立的模块，缺乏对它们之间耦合关系（coupling）的结构化建模。\n\n这种割裂导致了一个核心问题：当 Agent 的记忆更新时，依赖该记忆的技能是否失效？当工具 API 漂移时，调用该工具的工作流是否需要同步重写？现有的评估体系仅关注最终任务成功率（end-task success），却忽略了中间状态的结构性错误，例如使用了过时的记忆（stale memories）或引发了不可控的级联故障（cascade failures）。研究者意识到，Agent 的演化本质上是一个动态结构的变化过程，而动态图学习（Dynamic Graph Learning, DGL）领域已经积累了处理时序依赖、结构演化、异常检测和因果推理的成熟方法（如 [21]-[30]）。然而，DGL 社区通常关注通用的链接预测或节点分类，并未针对 Agent 特有的“模式约束重写”（schema-constrained rewrites）和“多组件协同演化”进行适配。\n\n因此，一个自然的推论是：如果我们将 Agent 的状态显式地建模为动态图（Dynamic Graph），其中节点代表记忆、工具、技能，边代表依赖和通信，那么 Agent 的演化就可以形式化为图变换（Graph Transformation）。这一视角不仅能统一碎片化的 Agent 演化机制（如记忆插入、工作流重连、子图激活），还能将 DGL 的成熟算法（如时序表示学习、图生成、异常检测）直接映射为 Agent 的基础设施（Infrastructure）。通过这种映射，研究者可以系统地分析现有方法的局限性（如缺乏影响范围估计 affected-scope estimation），并提出基于图结构的评估协议（如支持子图精度、重写局部性），从而填补从“黑盒行为演化”到“白盒结构治理”之间的空白。\n\n### § 4 核心 Intuition\n\n这篇论文的核心直觉在于：**Self-Evolving Agent 的状态演化本质上是一个受模式约束的动态图变换过程（Dynamic Graph Transformation），而非孤立的模块更新。**\n\n传统方法将记忆、工具、技能视为独立组件，导致局部更新无法自动触发依赖项的验证与修复，从而引发静默回归（silent regression）或级联故障。通过将 Agent 状态建模为动态图，并利用动态图学习（DGL）技术作为基础设施，我们可以显式地追踪实体间的依赖关系与演化轨迹，从而实现从“基于结果的黑盒评估”向“基于结构的白盒治理”的范式转变，确保 Agent 在长期演化中的结构一致性与可审计性。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n本文并非提出单一的算法模型，而是提出了一种**概念框架（Conceptual Framing）**和**基础设施映射（Infrastructure Bridge）**。其核心方法是将“自进化智能体（Self-Evolving Agents）”的状态演化形式化为**动态图变换（Dynamic Graph Transformation）**，并将现有的**动态图学习（Dynamic Graph Learning, DGL）**技术作为支持这种演化的可复用基础设施。\n\n以下结合文中 **Agent-Evolution Example IV.2**（GitHub 维护智能体处理分支变更）为例，展示完整的 Pipeline：\n\n**1. 输入（Input）：动态图状态与查询**\n*   **环境输入**：用户查询 $q_t$（例如：“为这个热修复打开一个 Pull Request”）。\n*   **历史状态**：智能体的持久化状态被建模为动态图 $G(t)$。图中包含节点（记忆、工具、技能、智能体）和边（依赖、通信、溯源）。\n*   **具体场景**：仓库默认分支从 `master` 变更为 `main`。图中存在一个过时的记忆节点 $m_{old}$（指向 `master`）和一个新的元数据查询事件。\n\n**2. 处理（Processing）：DGL 基础设施介入与图变换**\n*   **步骤 A：动态文本属性图编码（DyTAG Encoding, Section IV-B）**\n    *   使用如 **MoMent** 这样的 DyTAG 编码器，融合文本语义（记忆内容）、时间戳（更新历史）和图结构（依赖关系）。\n    *   **Intuition**：单纯基于文本相似度可能会检索到过时的 `master` 记忆。DyTAG 编码器通过时间编码和结构连接，降低过时但文本相似节点的激活概率。\n*   **步骤 B：子图激活（Subgraph Activation, Section III-C）**\n    *   基于编码器的评分，智能体选择一个**只读的支持子图** $G_{act}(t)$。\n    *   在这个例子中，激活的是包含最新元数据查询和 `main` 分支策略的证据链，而不是过时的 $m_{old}$。\n    *   **注意**：此时并未修改持久化图 $G(t)$，只是选择了当前的推理上下文。\n*   **步骤 C：动态图生成与验证（Generation \u0026 Validation, Section IV-C）**\n    *   如果需要修复工作流（例如 API 参数变更），使用如 **TIGGER** 的动态图生成方法生成候选的工作流重写轨迹（Rewrite Trace）。\n    *   运行时环境（Runtime）根据 Schema 约束（如工具签名、权限）验证生成的轨迹是否合法。\n*   **步骤 D：图变换提交（Graph Transformation Commit, Section II）**\n    *   如果验证通过，智能体执行 **DPO（Double-Pushout）重写操作**。\n    *   例如：执行 `FEATUREUPDATE` 更新记忆节点的状态，或 `LINK` 添加新的依赖边。\n    *   所有变更被记录为带时间戳的事件，用于后续的溯源（Provenance）和回滚。\n\n**3. 输出（Output）：动作与演化后的状态**\n*   **即时动作**：智能体调用 `open_pr` 工具，并传入正确的 `base: main` 参数。\n*   **状态演化**：持久化图 $G(t+1)$ 被更新，过时的记忆可能被标记为无效或合并，新的依赖关系被固化。\n*   **可审计性**：整个激活和重写过程留下了图级别的证据（Evidence），可用于后续的评估（如 M1: Support-Subgraph Accuracy）和安全审计。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n本文的核心数学贡献在于将智能体演化形式化为**动态图变换（Dynamic Graph Transformation）**，并基于 **Double-Pushout (DPO)** 范式定义了重写算子。虽然这不是传统意义上的“推导证明”，但它是连接智能体行为与图论形式的理论基石。\n\n**1. 动态图状态定义**\n智能体在时间 $t$ 的状态被定义为动态图：\n$$ G(t) = (V(t), E(t), X_V(t), X_E(t), Y(t)) $$\n*   **Intuition**：这不仅仅是静态的知识图谱。$V$ 和 $E$ 随时间变化，$X$ 代表属性（如记忆的文本内容、工具的可靠性分数），$Y$ 代表标签。这涵盖了连续时间动态图（CTDGs）和离散时间动态图（DTDGs）。\n\n**2. DPO 重写算子（Rewrite Operators）**\n演化被建模为一系列类型化的重写操作 $\\rho$。DPO 规则由一个跨度（Span）定义：$L \\leftarrow K \\rightarrow R$。\n*   $L$ (Left-hand side)：在图 $G(t)$ 中匹配的模式（即“要改变什么”）。\n*   $K$ (Interface)：保留的接口（即“什么保持不变”）。\n*   $R$ (Right-hand side)：替换结构（即“变成什么”）。\n\n**具体算子示例（Section III-A）：**\n*   **INSERT (插入)**：\n    $$ L = \\emptyset, K = \\emptyset, R = \\{v_{new}\\} $$\n    *   **Intuition**：向图中添加一个新节点（如新记忆），不依赖现有结构。\n*   **FEATUREUPDATE (特征更新)**：\n    $$ L = \\{v\\}, K = \\{v\\}, R = \\{v'\\} $$\n    *   **Intuition**：节点 $v$ 存在，保留其身份（$K$），但更新其属性（$v'$）。例如，更新工具的可靠性评分。\n*   **MERGE (合并)**：\n    $$ L = \\{v_1, v_2\\}, K = \\emptyset, R = \\{v_{merged}\\} $$\n    *   **Intuition**：将两个节点合并为一个，通常用于记忆压缩或去重。\n\n**3. 级联重写（Cascade Rewrites, Section III-D）**\n跨组件的协同演化被建模为时间戳轨迹：\n$$ C(c) = (\\rho_1, \\mu_1, t_1), \\dots, (\\rho_k, \\mu_k, t_k) $$\n*   **Intuition**：一个初始触发事件 $c$（如工具 API 变更）引发一系列重写。$\\mu_i$ 是匹配，$t_i$ 是时间。如果轨迹跨越多种组件类型（如从 Tool 到 Workflow 再到 Agent），则属于跨组件协同演化。这为**影响范围估计（Affected-scope estimation）**提供了数学基础：通过追踪 $C(c)$ 中的受影响的子图 $S_i$，可以确定哪些下游组件需要重新验证。\n\n**4. 动态图学习映射（Section IV）**\n文章将 DGL 任务映射为智能体能力的优化目标。例如，**动态图表示学习**的目标函数通常涉及最小化预测误差：\n$$ \\min_\\theta \\mathcal{L}(G(t), \\theta) $$\n*   **Intuition**：在智能体语境下，$\\mathcal{L}$ 不再是简单的链接预测，而是**记忆有效性评分**、**工具可靠性预测**或**工作流边缘风险评估**。DGL 模型输出的是“信号”（Signal），指导智能体进行激活或重写，而不是直接修改图。\n\n---\n\n### § 7 实验设计与结论\n\n**重要说明**：本文是一篇**综述（Survey）**和**视角（Perspective）**论文，**并未提出新的算法模型，也未进行传统的实证实验（Empirical Experiments）**来验证某个特定模型的性能。因此，它没有“训练集/测试集”或“准确率对比”的实验设计。\n\n然而，文章通过**系统性映射（Systematic Mapping）**和**概念性案例（Conceptual Examples）**来验证其核心 Claim。我们可以将其“验证逻辑”总结如下：\n\n**1. 提出了什么问题？**\n*   **问题**：现有的自进化智能体研究（Self-Evolving Agents）和动态图学习（Dynamic Graph Learning）是两个分离的领域。智能体研究缺乏对状态结构演化的统一形式化，而动态图学习缺乏在智能体基础设施中的具体应用路径。现有的评估方法（仅关注最终任务成功率）无法捕捉智能体内部状态演化中的错误（如使用过时记忆、不安全更新传播）。\n\n**2. 设计了什么“验证”手段？**\n*   **手段一：分类学构建（Taxonomy Construction）**\n    *   文章收集了 46 种代表性的自进化智能体方法，并根据**图变换模式**将其归类为四类：节点/特征演化、边/拓扑演化、子图激活、跨组件协同演化。\n    *   **目的**：证明现有的异构方法可以在“动态图变换”这一统一框架下被理解和比较。\n*   **手段二：基础设施映射（Infrastructure Mapping）**\n    *   文章将 9 个动态图学习子领域（如 CTDG, DyTAG, Anomaly Detection 等）映射到智能体的具体能力（如记忆更新、工具路由、安全监控）。\n    *   **目的**：证明 DGL 技术可以作为智能体演化的可复用基础设施，并指出了具体的适配方式（Adaptations）和潜在的失败模式（Failure Modes）。\n*   **手段三：评估协议设计（Evaluation Protocols Design）**\n    *   提出了 5 种图感知的评估协议（如 Support-Subgraph Accuracy, Leakage-Free Temporal Splits）。\n    *   **目的**：通过定义新的评估指标，论证现有评估方法的不足，并提供解决“状态演化不可见性”问题的具体方案。\n\n**3. 问题的答案（结论）是什么？**\n*   **结论 1**：将智能体演化视为**动态图变换**提供了一个紧凑的结构化视角，能够统一记忆、工具、技能和工作流的演化机制。\n*   **结论 2**：**动态图学习（DGL）**不仅是理论工具，更是智能体演化的**基础设施**。例如，DyTAG 可用于解决文本与时间不一致的记忆检索问题，动态图异常检测可用于早期发现不安全的行为传播。\n*   **结论 3**：现有的基于任务结果的评估是不充分的。必须引入**图感知的评估（Graph-Aware Evaluation）**，关注支持子图的有效性、重写的局部性以及时间泄漏问题，才能确保自进化智能体的可靠性和可治理性。\n*   **结论 4**：未来的挑战在于实现**可观测性（Observability）**、**记忆影响的生命周期管理**、**工具依赖的下游验证**以及**多智能体安全传播路径的治理**。\n\n**总结**：本文的“实验”是**文献的系统性重组与理论映射**。其核心贡献在于建立了一座桥梁，让动态图学习社区和智能体社区能够使用共同的语言（图变换、DPO 重写、动态图表示）进行对话，并指出了从“黑盒适应”走向“结构化、可治理演化”的研究路径。", "additional_insights": "### § 8 Take-aways\n\n本文提出将 Self-Evolving Agents 的状态演化形式化为 Dynamic Graph Transformation，利用 Double-Pushout (DPO) 规则统一描述 Memory、Tool、Skill 及 Workflow 的节点/边更新、子图激活与跨组件级联演化。该框架揭示了现有 Agent 研究在结构耦合性上的盲区：局部状态更新（如 Memory 修正）往往缺乏对下游依赖（如 Skill 或 Workflow）的影响范围估计（Affected-Scope Estimation），导致静默回归或安全漏洞。文章构建了 Dynamic Graph Learning (DGL) 与 Agent 演化能力的映射，指出 CTDG/DyTAG 等表示学习、TKG Reasoning 及 Anomaly Detection 可作为可复用的基础设施，提供激活信号、证据链追溯及异常预警，而非直接修改持久化状态。在评估层面，传统基于最终任务成功率的指标存在严重缺陷，本文主张引入 Graph-Aware Evaluation，包括 Support-Subgraph Accuracy（验证证据的时间有效性）、Counterfactual Rewrite Locality（确保更新不破坏无关行为）及 Leakage-Free Temporal Protocols（防止未来信息泄露）。治理方面，强调通过 Provenance Tracing 实现可审计的 Rollback 机制，并指出当前核心挑战在于如何量化 Memory 的衍生影响生命周期及预测 Workflow-Topology 耦合下的级联重写效应。\n\n### § 9 最脆弱的假设\n\n本文核心贡献依赖于一个关键假设：**Agent 的内部状态（Memory, Tool, Skill, Workflow）可以被精确地建模为具有明确 Schema 约束和类型安全（Type Safety）的动态图，且其演化过程遵循可追溯的 DPO 重写规则。** 如果这一假设不成立，即 Agent 的状态是高度非结构化、隐式或无法通过显式图结构完整捕获的，那么基于图变换的演化分类、影响范围估计及基于 DGL 的基础设施映射将全部失效。在实际中，LLM-based Agents 的“状态”往往分散在 Context Window、隐式参数更新（如 LoRA 微调）或非结构化的 Vector Store 中，难以完全映射为离散的 Typed Nodes 和 Edges。例如，Skill 的“可用性”可能取决于 LLM 的隐式推理能力而非显式的 Dependency Graph；Memory 的“有效性”可能由语义相似度而非严格的 Provenance Edge 决定。论文虽然通过列举 46 种现有方法并强行映射到图结构来佐证其普适性，但这更多是一种“后验”的形式化重构，而非证明所有 Agent 系统天然具备这种结构化属性。若 Agent 的演化主要发生在 LLM 的隐式参数空间或无法被图结构捕获的语义空间中，则 Dynamic Graph Transformation 仅能描述表层行为，无法触及核心演化机制，导致提出的 Governance 和 Evaluation 协议无法覆盖真正的失败模式。\n\n### § 10 最小复现实验\n\n在 1 周内，可复现 **§ V-A 中的 Support-Subgraph Accuracy (M1)** 评估协议，以验证“基于图结构的证据评估能发现传统指标遗漏的失败”这一 Claim。\n\n1.  **数据**：使用 **LongMemEval** 或 **MemBench** 中的长程记忆对话数据集，选取包含明确时间戳和事实修正的轨迹。\n2.  **实现**：\n    *   构建一个简化的 Agent Graph：节点为 Memory Items，边为时间先后或引用关系。\n    *   实现一个基线 Agent（如 RAG-based Agent），记录其在每个决策点 $t_q$ 激活的 Memory Subgraph $G_{act}(q, t_q)$。\n    *   人工标注或基于 Ground Truth 构建“有效支持子图” $G^*_q$（即仅包含在 $t_q$ 时刻之前存在且正确的记忆节点）。\n3.  **测量**：计算 M1 指标（Dice Overlap between $G_{act}$ and $G^*_q$），同时记录传统的任务准确率（Answer Accuracy）。\n4.  **结果判定**：\n    *   **支持 Claim**：若发现大量样本中 Answer Accuracy 为 1（回答正确），但 M1 分数极低（激活了 Stale Memory 或 Future Leakage），则证明传统指标失效，Graph-Aware Evaluation 具有必要性。\n    *   **反驳 Claim**：若 M1 与 Answer Accuracy 高度正相关，或构建 $G^*_q$ 的成本极高且主观性强，则说明该评估协议在实际中缺乏可操作性或增量价值有限。\n\n此实验无需复现复杂的 DGL 模型或完整的 Agent 演化系统，仅聚焦于评估协议的可行性与洞察力，直接验证论文在 Evaluation 方面的核心贡献。", "research_value": "### § 11 最强反例设计\n\n若要挑战本文的核心论点，最有力的攻击并非针对其形式化的严谨性，而是针对其**本体论假设（Ontological Assumption）**的适用边界，即“所有 Agent 演化均可被离散图结构完整捕获”。我会设计一个基于**隐式参数演化（Implicit Parameter Evolution）**与**语义涌现（Semantic Emergence）**的反例场景，证明 Dynamic Graph Transformation 在描述 LLM 核心能力演化时的失效。\n\n**反例场景：基于 In-Context Learning (ICL) 的隐式技能习得与“幽灵依赖”**\n考虑一个长期运行的代码辅助 Agent，它通过持续的交互日志进行自我微调（Self-Training）或仅通过 Context Window 中的 Few-Shot 示例进行 ICL 适应。\n1.  **现象描述**：Agent 在处理 Python 代码时，逐渐学会了使用一种非标准的、但在特定社区流行的错误处理模式。这种“技能”并未显式地存储在 Memory Graph 的节点中，也没有在 Workflow Graph 中新增边。它存在于 LLM 的激活模式（Activation Patterns）或 Context 的统计分布中。\n2.  **图模型的失败**：根据本文框架，Agent 的状态 $G(t)$ 应反映这一变化。然而，由于没有显式的 `INSERT` 或 `FEATUREUPDATE` 操作发生在图结构上，$G(t)$ 保持不变。此时，若引入一个依赖该非标准模式的下游工具，Agent 能正确调用，但图模型无法解释这种**功能耦合（Functional Coupling）**，因为图中缺乏对应的依赖边。\n3.  **攻击点：不可观测的级联效应（Unobservable Cascade Effects）**\n    *   假设后续环境变更导致该非标准模式被弃用。Agent 可能因为隐式参数的惯性继续使用该模式，导致错误。\n    *   本文提出的 **Cascade Rewrites** 和 **Affected-Scope Estimation** 依赖于显式的图路径追踪。由于该技能演化发生在“图外”（Off-Graph），图模型无法预测其影响范围，也无法通过 **Provenance Tracing** 定位根源。\n    *   **结论**：这证明了对于 LLM-based Agents，**状态演化主要发生在连续的高维语义空间（Semantic Space）而非离散的图拓扑空间（Graph Topology Space）**。Dynamic Graph Transformation 仅能描述“显式配置”的演化，而忽略了“隐式能力”的演化，导致其作为统一框架的完整性缺失。任何基于图结构的 **Governance** 协议（如回滚、审计）都将对这类隐式演化完全失明，从而无法保证系统的安全性。\n\n### § 12 Follow-up Research Idea\n\n基于上述局限，即“图结构无法捕获隐式语义演化”，我提出一个新的研究方向：**Semantic-Graph Co-Evolution via Latent State Alignment（基于潜在状态对齐的语义-图协同演化）**。\n\n**(a) 驱动局限与未满足需求**\n现有工作（包括本文）将 Agent 状态二分为“显式图结构”和“黑盒 LLM 参数”。这种二分法导致治理盲区：我们能看到图变了，但不知道 LLM 的“意图”是否同步更新；或者 LLM 学会了新东西，但图结构滞后，导致 **Schema Drift**（模式漂移）。需求在于建立一种机制，能够实时监测并同步**显式拓扑结构（Explicit Topology）**与**隐式语义状态（Implicit Semantic State）**的一致性，而不仅仅是将图作为静态容器。\n\n**(b) 借鉴相邻领域的方法**\n借鉴 **Neuro-Symbolic AI** 中的 **Grounding** 技术和 **Causal Representation Learning** 中的 **Disentanglement** 方法。\n*   具体而言，引入 **Latent Space Probing**（潜在空间探测）技术，将 LLM 的隐藏层激活映射到图节点的特征空间。\n*   利用 **Causal Discovery** 算法，从交互日志中推断出隐式的因果依赖关系，并将其与显式的图边进行对比，识别出“缺失的边”或“错误的边”。\n\n**(c) 第一个实验设计**\n**实验名称：Detecting and Correcting Semantic-Graph Misalignment in Self-Evolving Agents**\n1.  **设置**：构建一个具备自我反思能力的 Agent，使其在长程任务中通过 ICL 习得新的工具使用习惯（隐式演化），同时维护一个显式的 Tool Dependency Graph。\n2.  **干预**：故意引入 **Semantic-Graph Misalignment**，例如，LLM 通过上下文学会了工具 A 和 B 可以并行执行（隐式知识），但显式图中仍标记为串行依赖（显式约束）。\n3.  **方法**：\n    *   部署一个 **Alignment Monitor**，它不直接修改图，而是通过 **Activation Similarity** 和 **Causal Intervention** 来检测 LLM 的实际行为分布与图结构约束之间的偏差。\n    *   当检测到显著偏差（如 LLM 频繁绕过串行约束）时，触发 **Graph Refinement** 步骤，自动提议更新图结构以反映隐式知识。\n4.  **评估**：\n    *   对比传统方法（仅依赖显式图更新）与本方法在 **Task Efficiency**（任务效率）和 **Safety Violation Rate**（安全违规率）上的表现。\n    *   关键指标：**Alignment Latency**（从隐式知识习得到显式图更新的时间延迟）和 **False Positive Rate**（误报隐式演化导致不必要的图重构）。\n\n**与已有工作的区别**：\n本文及现有 Survey 将图视为**状态本身**或**基础设施**，假设图是真理的来源。本提议将图视为**假设（Hypothesis）**，而 LLM 的隐式状态是**证据（Evidence）**。研究重点从“如何变换图”转向“如何验证图与隐式语义的一致性”，从而解决隐式演化带来的治理盲区，实现真正的 **Neuro-Symbolic Co-Governance**。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "{\n  \"authors\": [\n    {\n      \"name\": \"Yuanyuan Xu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Wenjie Zhang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yin Chen\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xuemin Lin\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Ying Zhang\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"The University of New South Wales\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"University of Technology Sydney\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"The Chinese University of Hong Kong-Shenzhen\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Zhejiang Gongshang University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding author: Ying Zhang (email: ying.zhang@zjgsu.edu.cn).\"\n    }\n  ]\n}", "summary_translation": "基于大型语言模型（LLM）的智能体正日益成为跨越交互过程的自演化系统，它们能够维持记忆、使用工具、习得技能、优化工作流，并与其他智能体协同。这些能力使得智能体状态具有结构性和动态性：实体、关系、属性、依赖关系和执行结构会随着新证据、反馈和环境条件的变化而改变。现有的图智能体综述通常将图视为支持智能体功能的结构，而非演化的基底；而自演化智能体综述则侧重于智能体层面的机制，很少讨论图拓扑的演化。因此，演化智能体状态与动态图拓扑之间的耦合关系尚未得到充分探索。本综述通过将*智能体演化框定为动态图变换*，连接了这两条研究线索。我们将智能体状态建模为动态图，其中记忆、工具、技能、工作流和智能体间关系被表示为类型化的节点、边和子图，并通过模式约束的重写进行更新。基于这一表述，我们将现有的基于动态图的自演化智能体方法组织为四个分类：节点/特征演化、边/拓扑演化、子图激活以及跨组件协同演化。在此基础上，我们提出动态图学习作为自演化智能体的可重用基础设施，并将九个动态图学习子领域映射到智能体演化能力上，讨论其适应性及可能的失效模式。最后，我们从动态图的角度讨论了五种图感知评估与治理协议，以补充端到任务评估。我们的目标是为设计和治理自演化智能体提供一个紧凑的结构化视角。"}, {"title": "SkillForge: Self-Distilling Agents for Project-Specific Issue Resolution", "arxiv_id": "2608.18933", "authors": "Silin Chen, Han Li, Xiaodong Gu, Yuling Shi, Haibing Guan", "summary": "Large language model (LLM) based agents have demonstrated remarkable proficiency in automated software issue resolution, yet they often struggle to resolve issues in a specific repository because they lack project-specific knowledge. Existing self-evolving approaches acquire such knowledge from repository history or online repair trajectories, but they either depend on available historical issue-resolution signals or incur substantial per-issue test-time exploration cost. In this paper, we propose SkillForge, a self-distillation framework that proactively acquires project-specific knowledge from the repository itself. Instead of waiting for real issues to expose project-specific knowledge gaps, SkillForge synthesizes project-specific issues by re-implementing test-covered core functionalities of the repository. By resolving these synthetic issues, SkillForge distills reusable project-specific knowledge into entity-grounded skills and associates them with relevant repository entities for future issue resolution. Extensive experiments using both open-source and closed-source models show that SkillForge consistently improves issue resolution performance over strong baselines. These results demonstrate that proactively acquiring project-specific knowledge before solving real issues substantially improves downstream software issue resolution.", "category": "cs.AI", "cluster": "Self-Evolving Agents \u0026 Synthetic Environments", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=18 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文完全符合研究范围，核心依据如下：\n\n1.  核心对象明确为 LLM 智能体：论文标题和摘要明确指出研究对象是 \"LLM based agents\"，具体场景为自动化软件问题修复（automated software issue resolution）。这属于典型的 Agentic AI 应用（Coding Agent / Software Engineering Agent）。\n2.  符合“自我演化/自我改进”方向：论文提出的 \"SkillForge\" 框架核心机制是 \"self-distillation\"（自蒸馏）和 \"proactively acquires project-specific knowledge\"（主动获取项目特定知识）。摘要中明确提到 \"Existing self-evolving approaches...\" 并将自身方法与之对比，表明其属于智能体通过经验或合成数据自我完善、迭代优化的范畴。这直接对应筛选标准中的“自我演化 (Self-Evolving)”和“智能体能力 (Skill Acquisition, Memory)”。\n3.  非单纯应用，而是机制创新：虽然应用场景是软件工程，但论文的贡献不在于解决某个具体的业务问题，而在于提出了一种新的智能体知识获取和技能蒸馏机制（从仓库本身合成问题并提炼技能），以解决智能体在特定项目中缺乏领域知识的问题。这符合“保留”标准中关于“在特定领域中提出了新的 agent 机制”的描述。\n4.  排除项检查：\n       不涉及安全、对齐、可解释性等排除项。\n       不涉及多智能体拓扑或通信协议等系统工程排除项。\n       不涉及纯基础设施或硬件加速。\n\n综上，该论文研究的是 LLM 智能体如何通过自蒸馏机制自我演化以获取特定领域技能，高度契合“LLM智能体及其演化”的研究课题。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：如何解决基于大语言模型（LLM）的软件工程代理（SWE agents）在特定代码库（repository）上进行问题修复时的“冷启动”（cold-start）问题，即代理缺乏项目特定知识（project-specific knowledge）导致必须从零开始探索并反复陷入相同陷阱的现象。这一问题至关重要，因为尽管现代 SWE agents（如 SWE-agent, OpenHands）在通用基准上表现优异，但在部署到具体项目时，它们往往无法利用代码库中隐含的结构规律、脆弱的模块模式、特定的 API 契约以及隐式的执行路径耦合。缺乏这些知识使得代理在解决真实问题前必须重复发现这些约定，导致效率低下且容易失败。解决该问题的价值在于，通过主动（proactively）从代码库本身获取知识，而非被动等待历史数据或高昂的在线探索，可以显著提升代理在下游真实问题修复中的准确率（Pass@1）和效率。SkillForge 通过合成项目特定问题并蒸馏出可复用的技能（skills），证明了在解决真实问题之前主动获取项目特定知识是一种比依赖历史轨迹或在线探索更有效、更具可扩展性的替代方案，从而打破了代理在特定项目上的性能瓶颈。\n\n### § 2 前人工作与不足\n\n该问题此前主要通过“自我进化”（self-evolving）的 SWE agents 尝试解决，主要分为两类方法：基于历史的方法（History-driven）和在线方法（Online）。基于历史的方法，如 EvoCoder [24]、SWE-Exp [2] 和 MemGovern [25]，试图从历史问题、提交记录或代理轨迹中蒸馏可复用的知识。然而，这些方法存在根本性不足：它们受限于历史数据的丰富度和覆盖率。如果某些代码行为、API 组合或长尾组件在历史轨迹中未被充分练习，它们就无法提供有效的学习信号，导致蒸馏出的知识往往粗糙或与特定实例绑定，无法覆盖所有潜在的项目特定模式。此外，MemGovern 等依赖外部调试讨论的方法虽然增加了覆盖率，但削弱了项目特定性。\n\n另一类是在线方法，如 SAGE [27]、SWE-Debate [28] 和 Live-SWE-agent [29]，它们在解决当前问题的过程中通过测试时探索（test-time exploration）生成额外轨迹来细化代理。虽然这些方法减少了对历史的依赖，但它们存在严重的工程成本和时效性问题：每个目标问题都需要付出巨大的轨迹、Token 和时间成本，且获取到的指导仅在问题到达后才可用，无法解决“冷启动”阶段代理缺乏先验知识的问题。\n\n现有的合成数据方法，如 SWE-Smith [35]，主要通过独立重写单个 API 级函数来构建合成任务，旨在提供可扩展的训练数据。然而，SkillForge 指出这种方法粒度太细，无法捕捉跨组件交互和项目特定的 API 耦合。SkillForge 的不足在于，它不依赖于丰富的历史问题轨迹或昂贵的每问题在线探索，而是通过从测试覆盖的核心功能出发，重写协同实现的代码段来合成问题，从而暴露代理通用编码知识与项目特定知识之间的差距。这种主动合成与蒸馏机制克服了 prior work 在知识覆盖范围、获取时机和成本效益上的局限，特别是解决了历史方法无法覆盖未见过模式以及在线方法成本过高且滞后性的问题。", "core_insight": "### § 3 重建作者的思考路径\n\n在大型语言模型（LLM）驱动的软件开发代理（SWE agents）领域，尽管通用能力显著提升，但在面对特定代码库（repository-specific）时，代理往往面临严重的“冷启动”问题：缺乏对项目特定结构、API 契约和隐含执行路径的理解，导致其像通用探索者一样反复试错。现有的自我进化方法主要分为两类：基于历史的方法（如 EvoCoder, SWE-Exp）和在线探索方法（如 SAGE, Live-SWE-agent）。然而，前者受限于历史 issue 的覆盖范围，无法学习到未被历史轨迹触发的长尾组件或 API 组合知识；后者虽然能针对当前问题学习，但每个 issue 都需要高昂的测试时（test-time）探索成本，且知识获取是反应式的（reactive），即在问题出现后才开始学习，无法解决初始阶段的无知状态。\n\n作者意识到，要解决冷启动问题，必须从“被动等待真实 issue 暴露知识缺口”转向“主动从代码库本身挖掘知识”。既然代码库中的测试用例（test suite）覆盖了核心功能并定义了正确的行为边界，那么测试用例就是项目特定知识最密集的载体。如果能让代理在解决真实 issue 之前，先通过某种方式“预演”项目中的核心功能，就能提前习得项目特定的调试模式和修复陷阱。\n\n关键在于如何生成这种“预演”任务。直接注入随机 bug 可能产生不切实际的错误，而简单的函数重写（如 SWE-Smith）忽略了跨组件的交互。作者观察到，真实 bug 往往源于对复杂功能实现的误解。因此，如果让 LLM 在受限上下文（masked context）下重新实现由测试覆盖的核心功能，LLM 会因其通用编码先验（general coding priors）与项目特定实现之间的差异而自然产生“幻觉”或错误。这些由 LLM 自身能力局限引发的合成 issue（synthetic issues），恰好暴露了代理在处理该项目时最容易犯错的领域。通过解决这些合成 issue 并蒸馏其轨迹，可以构建一个包含全局诊断策略（global diagnostic skills）和局部干预指南（local intervention skills）的知识库，从而在解决真实 issue 时提供精准的、实体感知的（entity-grounded）指导。\n\n### § 4 核心 Intuition\n\nSkillForge 的核心直觉在于将“项目特定知识”的获取从**反应式**（依赖真实 issue 的历史或在线探索）转变为**主动式**（利用测试用例驱动的功能重写来预演潜在错误）。通过让 LLM 在受限上下文中重新实现核心功能，系统能自然暴露出 LLM 通用编码先验与项目特定实现之间的偏差，从而生成高价值的合成 issue。解决这些合成 issue 所积累的轨迹被蒸馏为与代码实体绑定的技能（skills），使得代理在解决真实 issue 时，能够基于当前访问的代码上下文即时获取针对性的诊断和修复指导，从而克服冷启动问题。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nSkillForge 的核心思想是**主动式自蒸馏（Proactive Self-Distillation）**，旨在解决 LLM 代理在特定代码库（Repository）上解决 Issue 时的“冷启动”问题。它不依赖历史 Issue 数据或昂贵的在线探索，而是通过合成问题来提取项目特定的知识。\n\n**完整 Pipeline 分为四个阶段：**\n\n1.  **项目特定问题合成（Project-Specific Issue Synthesis）：**\n    *   **输入：** 目标代码库快照及其测试套件。\n    *   **处理：**\n        *   **测试驱动的范围界定与追踪：** 运行通过的核心测试用例，利用覆盖率工具获取执行轨迹（Execution Trace），识别被测试覆盖的代码区域。\n        *   **关键片段选择：** 使用 LLM 从轨迹中筛选出最能代表该测试功能的关键代码片段（Critical Segments），通常涉及跨组件交互。\n        *   **代码重写（Code Rewriting）：** 在**严格掩码（Strict-Mask）**条件下，让 LLM 仅凭上下文和测试目标重写这些片段，而不提供原始实现。这迫使 LLM 暴露其通用编码知识与项目特定实现之间的差距，从而自然产生符合项目逻辑但存在缺陷的“合成 Bug”。\n        *   **实例组装：** 将重写后的代码应用为 Buggy Patch，生成对应的 Problem Statement 和参考补丁（Reference Patch），形成标准的 SWE-bench 格式合成任务。\n    *   **输出：** 一组可执行的、行为上由测试保证的合成 Issue 实例。\n\n2.  **问题解决尝试（Issue Resolution Attempt）：**\n    *   **输入：** 上述合成的 Issue 实例。\n    *   **处理：** 部署一个 SWE Agent（如 Mini-SWE-Agent）在隔离环境中尝试修复这些合成 Bug。Agent 会执行文件编辑、Shell 命令和测试运行。\n    *   **输出：** 完整的解决轨迹（Trajectory），包括成功和失败的尝试记录。\n\n3.  **技能蒸馏（Skill Distillation）：**\n    *   **输入：** 解决合成 Issue 的轨迹。\n    *   **处理：**\n        *   **轨迹归一化与实体对齐：** 解析轨迹中的 Shell 命令和文件操作，将其映射到代码库的 AST 结构，确定涉及的代码实体（Entities）。\n        *   **全局诊断技能提取（$M_{ext}$）：** 从轨迹中提炼项目级的诊断知识，包括实体的功能角色（Purpose）、推理剧本（Playbook，如调试步骤）和相关 API 交互（Related APIs）。\n        *   **局部干预技能提取（$M_{int}$）：** 从成功和失败轨迹中提炼具体的修改指导。成功轨迹提供有效修复策略，失败轨迹通过对比参考补丁揭示项目特定的陷阱（Pitfalls）。\n    *   **输出：** 双层技能库（Dual-level Skill Repository），包含全局诊断技能集 $M_{ext}$ 和局部干预技能集 $M_{int}$，均与代码实体绑定。\n\n4.  **技能适配与下游解决（Skill Adaptation）：**\n    *   **输入：** 真实的 Issue 描述及代码库。\n    *   **处理：**\n        *   **宏观初始化（Macro-level Initialization）：** 在解决新 Issue 前，使用 BM25 检索器从 $M_{ext}$ 中检索最相关的 Top-k 全局诊断技能，作为初始上下文注入 Agent 的 Prompt，提供项目架构和调试启发式知识。\n        *   **微观即时注入（Micro-level JIT Injection）：** 在 Agent 解决过程中，实时监控其访问的文件路径。当 Agent 访问某个实体时，动态从 $M_{int}$ 中检索并注入对应的局部干预技能（如避免特定错误、遵循特定 API 契约），实现“即时指导”。\n    *   **输出：** 修复真实 Issue 的 Patch。\n\n**真实例子讲解（以 Django 为例）：**\n假设我们要处理 Django 项目。\n1.  **合成：** SkillForge 找到一个测试 `test_decimal_formatting`，追踪到 `django/utils/numberformat.py` 中的 `nformat` 函数。它让 LLM 重写该函数，LLM 可能错误地使用了基于指数（exponent）的启发式规则来处理极小值，导致测试失败。\n2.  **解决：** Agent 尝试修复这个合成 Bug。在失败轨迹中，Agent 发现直接修改指数判断是错误的；在成功轨迹中，Agent 学会了使用基于数值阈值（value-based thresholding）的方法，并保留了 Decimal 类型的原始语义。\n3.  **蒸馏：** 系统提取出技能：对于 `numberformat.py`，$M_{ext}$ 记录其目的是格式化数字，Playbook 提示“注意 Decimal 类型处理”；$M_{int}$ 记录“避免过早将 Decimal 转换为字符串”、“不要仅依赖指数判断零值”。\n4.  **适配：** 当遇到真实的 Issue #11206（格式化极小 Decimal 值出错）时，Agent 首先获得全局提示，知道该模块涉及 Decimal 处理。当 Agent 打开 `numberformat.py` 时，JIT 注入局部技能，提醒它“避免基于指数的启发式规则”，从而引导 Agent 采用正确的阈值比较逻辑，成功修复真实 Bug。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有核心的数学推导过程。SkillForge 是一个基于大语言模型（LLM）和软件工程技术（如代码覆盖率、AST 解析）的系统框架，其核心贡献在于**方法论设计（Methodology Design）**和**知识表示（Knowledge Representation）**，而非数学模型或算法推导。\n\n论文中涉及的符号主要用于描述流程，例如：\n*   轨迹 $T = \\{(a_1, o_1), ..., (a_n, o_n)\\}$：表示 Agent 的动作（Action）和环境观察（Observation）序列。\n*   技能集 $M_{ext}$ 和 $M_{int}$：表示蒸馏出的结构化知识集合。\n*   候选实体 $E_{cand} \\subseteq R$：表示从轨迹中识别出的代码实体集合。\n\n这些符号旨在清晰定义数据流和处理步骤，不涉及复杂的数学证明或理论推导。因此，本节跳过。\n\n### § 7 实验设计与结论\n\n**RQ1: SkillForge 的有效性如何？**\n*   **问题：** SkillForge 相比其他自进化方法（History-driven 和 Online 方法）在 Issue 解决性能上是否有显著提升？\n*   **实验设计：** 在 SWE-bench Verified 和 SWE-bench Pro 两个基准上，对比 SkillForge 与 Mini-SWE-Agent（基线）、SWE-Exp、EvoCoder、MemGovern（历史驱动方法）以及 SAGE、SWE-Debate、Live-SWE-agent（在线方法）。使用 DeepSeek-V3.2 和 GPT-5-mini 作为后端模型，评估 Pass@1 和平均成本（Avg Cost）。\n*   **答案：** SkillForge 在所有基准上均优于基线和所有对比方法。在 SWE-bench Verified 上，Pass@1 提升 +5.8% (DeepSeek) 和 +5.6% (GPT-5-mini)；在 SWE-bench Pro 上，提升 +5.8% 和 +4.1%。这表明主动获取项目特定知识比被动依赖历史或在线探索更有效。\n\n**RQ2: SkillForge 的组件是否都必要？知识是否可跨模型迁移？**\n*   **问题：** 全局诊断技能（$M_{ext}$）和局部干预技能（$M_{int}$）是否都不可或缺？蒸馏出的知识是否可以在不同 LLM 后端之间迁移？\n*   **实验设计：**\n    1.  **消融实验：** 分别移除 $M_{ext}$ 和 $M_{int}$，观察性能下降。\n    2.  **跨模型迁移：** 使用一个 LLM（如 GPT-5-mini）蒸馏技能，然后注入到另一个 LLM（如 DeepSeek-V3.2）中解决真实 Issue，反之亦然。\n*   **答案：**\n    1.  移除任一技能集都会导致性能显著下降（$M_{ext}$ 下降 3.0-3.8%，$M_{int}$ 下降 3.4-4.4%），证明两者互补且均必要。\n    2.  知识**不可**通用迁移。每个 LLM 在解决合成 Issue 时暴露的“项目特定不匹配”是模型依赖的（Model-dependent）。使用自身蒸馏的技能表现最佳，使用其他模型蒸馏的技能会导致性能下降，因为不同 LLM 的编码先验（Coding Priors）不同。\n\n**RQ3: 超参数对性能的影响如何？**\n*   **问题：** 检索的全局技能数量（$k_r$）和合成问题时重写的代码片段数量（$k_s$）如何影响性能？\n*   **实验设计：** 在 Django 和 Sphinx 仓库上，分别改变 $k_r$（0-7 及 Full）和 $k_s$（0-7），观察 Pass@1 的变化。\n*   **答案：** 存在最佳中间值。$k_r=5$ 时性能最佳，过多检索会引入噪声；$k_s=5$ 时性能最佳，过少无法暴露足够知识，过多则导致合成问题过于复杂，降低蒸馏质量。适度的合成和检索规模效果最好。\n\n**RQ4: SkillForge 在不同仓库上的泛化能力如何？**\n*   **问题：** SkillForge 是否能在不同类型的仓库上 consistently 提升性能，而不出现回归？\n*   **实验设计：** 分析 SWE-bench Verified 中实例最多的七个仓库（如 Django, Sympy, Sphinx 等）的逐仓库性能，对比 Baseline、SWE-Exp 和 SkillForge。\n*   **答案：** SkillForge 在所有七个仓库上均实现了性能提升，无任何回归。相比之下，SWE-Exp 在某些仓库上出现性能下降。这证明主动从目标仓库自身提取知识具有更强的鲁棒性和泛化性。", "additional_insights": "### § 8 Take-aways\n\nSkillForge 提出了一种**主动式（proactive）**的项目特定知识获取范式，通过基于测试覆盖率的代码重写合成人工缺陷（synthetic issues），从而在解决真实问题前预先蒸馏出项目特定的调试与修复技能。该方法构建了双层技能库：**全局诊断技能（Global Diagnostic Skills, $M_{ext}$）**用于宏观导航与推理启发，**局部干预技能（Local Intervention Skills, $M_{int}$）**用于微观代码修改时的防错指导，并通过实体感知的检索机制在 Agent 交互过程中进行即时注入。实验表明，SkillForge 在 SWE-bench Verified 和 SWE-bench Pro 上显著优于 Mini-SWE-Agent 及现有的历史驱动（如 SWE-Exp）和在线探索（如 SAGE）基线，证明了预先获取项目特定知识能有效缓解冷启动问题。消融实验证实，全局诊断与局部干预技能缺一不可，且蒸馏出的技能具有**模型依赖性（LLM-specific）**，即由特定 LLM 蒸馏的知识对该模型自身效果最佳，跨模型迁移效果显著下降，这表明技能本质上是捕捉了特定模型在特定代码库中的推理偏差与修复模式。\n\n### § 9 最脆弱的假设\n\nSkillForge 最核心的脆弱假设是：**基于测试覆盖率的代码重写所暴露的“模型通用编码先验”与“项目特定实现模式”之间的差异，能够充分代表真实世界中解决复杂 Issue 所需的项目特定知识。** 如果这一假设不成立，即合成缺陷所触发的修复路径与真实缺陷的修复路径在知识需求上存在本质错位，那么蒸馏出的技能将无法有效迁移至真实任务。\n\n在实际中，该假设可能失效的原因在于：真实世界的 Bug 往往涉及深层架构误解、隐蔽的状态竞争或复杂的业务逻辑错误，而 SkillForge 合成的缺陷主要源于 LLM 在受限上下文下对局部功能的“平庸化”重写（如简化逻辑、忽略边缘情况）。这种合成缺陷可能过于偏向语法或局部语义错误，缺乏真实 Issue 中常见的跨模块耦合复杂性或历史遗留代码的特定约束。论文提供的证据主要依赖于合成 Issue 与真实 Issue 在类型分布上的非重叠性（Section V.A），并声称这证明了合成 Issue 暴露了更细粒度的模型偏差；然而，论文缺乏直接的证据表明这些“细粒度偏差”与解决真实长尾 Issue 所需的“项目特定知识”之间存在强相关性。如果合成缺陷过于简单或偏离真实错误模式，蒸馏出的技能可能仅适用于修复类似的合成错误，而在面对真实世界中结构更复杂的 Issue 时失效。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现并验证 SkillForge 的核心假设：**“基于测试覆盖的代码重写能有效暴露项目特定的修复知识，且该知识优于静态代码摘要。”**\n\n**实验设计：**\n1.  **数据选择**：选取 SWE-bench Verified 中一个中等规模的项目（如 `django` 或 `sphinx`），仅使用其测试套件和代码库，不使用任何历史 Issue 数据。\n2.  **实现内容**：\n    *   **基线方法**：使用 LLM 生成该项目的静态代码摘要（Static Summary），作为项目特定知识注入 Agent。\n    *   **SkillForge 简化版**：实现 SkillForge 的 Issue 合成与技能蒸馏流程。具体步骤为：运行测试获取覆盖率 -\u003E 选择关键代码段 -\u003E 使用 LLM 在屏蔽原实现的情况下重写代码以触发测试失败 -\u003E 使用 Agent 修复这些合成缺陷 -\u003E 从修复轨迹中蒸馏出 $M_{ext}$ 和 $M_{int}$ 技能。\n    *   **评估 Agent**：使用 Mini-SWE-Agent 作为后端，分别注入上述两种知识源。\n3.  **测量指标**：在该项目对应的真实 SWE-bench 测试集上，测量 Agent 的 **Pass@1** 准确率。\n4.  **结果判定**：\n    *   **支持 Claim**：如果 SkillForge 简化版的 Pass@1 显著高于静态摘要基线（例如提升 \u003E 3%），则证明主动合成缺陷并蒸馏轨迹比静态理解更能捕捉有效的项目特定知识。\n    *   **反驳 Claim**：如果两者性能无显著差异，或静态摘要甚至更优，则说明合成缺陷并未提供额外的、有价值的修复洞察，或者蒸馏过程引入了噪声，核心假设失效。\n\n此实验无需复现完整的 SkillForge 系统（如复杂的 JIT 注入机制），仅验证其知识获取源头（合成缺陷 vs 静态摘要）的有效性，即可判断其核心贡献的合理性。", "research_value": "### § 11 最强反例设计\n\n要最有力地攻击 SkillForge，核心策略是证明其合成的“项目特定知识”本质上是**过拟合于 LLM 的通用编码偏差（General Coding Biases）**，而非代码库特有的结构约束，且这种知识在真实场景中不仅无效，反而会产生**负迁移（Negative Transfer）**。\n\n**实验设计：合成缺陷与真实缺陷的“知识正交性”测试**\n设计一个对照实验，选取 SWE-bench Verified 中那些**测试覆盖率极高但真实 Issue 极少涉及核心逻辑重写**的仓库（如某些配置管理库或简单的工具库）。\n1.  **构造反例场景**：SkillForge 依赖测试覆盖率来定位关键代码片段。然而，许多真实世界的 Bug 并非源于核心算法逻辑的错误（这是 SkillForge 合成的主要来源），而是源于**隐式的全局状态管理、并发竞争条件（Race Conditions）或外部依赖的特定版本行为**。这些模式通常无法通过简单的单元测试覆盖率捕捉，因为它们是动态的、环境依赖的。\n2.  **具体攻击步骤**：\n    *   选取一组真实 Issue，这些 Issue 的修复补丁（Patch）主要涉及**新增文件、修改配置文件或调整依赖版本**，而非修改被测试覆盖的核心函数逻辑。\n    *   运行 SkillForge 生成技能库 $M_{ext}$ 和 $M_{int}$。由于这些真实 Issue 涉及的代码区域可能未被核心测试覆盖，或者其修复逻辑与“重写核心功能”无关，SkillForge 蒸馏出的技能将主要集中于核心函数的局部语义。\n    *   **关键对比**：引入一个基线方法，该方法不依赖合成缺陷，而是直接提取代码库的**静态依赖图（Static Dependency Graph）**和**API 契约文档**。\n    *   **预期结果**：如果 SkillForge 在这些特定类型的 Issue 上表现不如静态依赖图基线，甚至低于无知识基线（因为注入了错误的局部启发式规则，误导 Agent 去修改核心逻辑而非配置），则证明 SkillForge 的知识获取机制存在严重的**领域偏差（Domain Bias）**。它假设“项目特定知识”等同于“核心函数的正确实现细节”，而忽略了软件工程实践中大量存在的架构级、配置级和集成级知识。\n\n**理论论证：合成缺陷的“平庸化”陷阱**\n从理论上论证，LLM 在“严格掩码”下重写代码时，倾向于生成**符合通用编程范式但缺乏项目特定优化**的代码（即“平庸化”）。例如，LLM 可能忽略项目中特有的内存管理约定或特定的错误处理模式，而采用通用的 Pythonic 风格。\n*   **攻击点**：SkillForge 蒸馏出的“陷阱（Pitfalls）”实际上是 LLM 自身通用先验与项目特定约定之间的差异。然而，真实世界的 Bug 往往是由**人类开发者对复杂业务逻辑的误解**或**历史遗留代码的耦合**引起的，这些错误模式与 LLM 的“平庸化”重写产生的错误模式在分布上是**正交（Orthogonal）**的。\n*   **结论**：如果合成缺陷的错误分布与真实缺陷的错误分布不重叠，那么从合成缺陷中蒸馏出的技能就无法泛化到真实任务。SkillForge 实际上是在教 Agent 如何避免“LLM 风格的错误”，而不是如何避免“人类风格的错误”。这种**分布外泛化（Out-of-Distribution Generalization）**的失败将是其最致命的弱点。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：基于因果干预的项目特定知识图谱构建（Causal Intervention-based Project-Specific Knowledge Graph Construction）**\n\n**（a）驱动局限与未满足需求**\nSkillForge 的核心局限在于其知识表示是**扁平的、基于文本的技能片段（Textual Skill Snippets）**，缺乏对代码库中**实体间因果依赖关系（Causal Dependencies）**的结构化建模。它假设“修复某个函数的经验”可以直接迁移到“另一个涉及该函数的 Issue”，但忽略了代码库中复杂的**副作用（Side Effects）**和**状态传播（State Propagation）**。真实世界中，许多 Bug 的修复需要理解“修改 A 如何影响 B 和 C”，而不仅仅是“如何正确实现 A”。现有的方法（包括 SkillForge）未能捕捉这种**高阶交互知识（Higher-order Interaction Knowledge）**，导致 Agent 在解决涉及多模块耦合的复杂 Issue 时容易引发回归错误。\n\n**（b）借鉴相邻领域的方法**\n借鉴**程序分析（Program Analysis）**中的**污点分析（Taint Analysis）**和**因果推断（Causal Inference）**中的**结构因果模型（Structural Causal Models, SCM）**。\n*   **污点分析**：用于追踪数据在代码库中的流动路径，识别哪些变量和函数调用之间存在潜在的影响关系。\n*   **结构因果模型**：用于形式化地表示代码实体之间的因果干预关系。例如，将代码库建模为一个有向无环图（DAG），其中节点是代码实体，边表示因果影响。通过模拟对某个节点的干预（如修改代码），预测对其他节点的影响。\n\n**（c）第一个实验设计**\n1.  **构建因果知识图谱**：\n    *   不使用 SkillForge 的合成缺陷方法，而是利用**动态污点分析工具**（如 Python 的 `taint` 库）在运行测试套件时，自动追踪数据流，构建一个**项目特定的因果依赖图（Project-Specific Causal Dependency Graph）**。\n    *   图中的每个节点包含代码实体及其元数据，每条边标注了数据流动的类型（如参数传递、返回值、全局变量修改）。\n2.  **因果技能蒸馏**：\n    *   当 Agent 解决一个真实 Issue 时，不仅记录其修复动作，还利用因果图分析该修复动作对下游实体的潜在影响。\n    *   蒸馏出的“技能”不再是简单的文本提示，而是**因果干预规则（Causal Intervention Rules）**，例如：“修改函数 A 的返回值类型时，必须同步检查所有调用 A 且依赖其返回值的函数 B 和 C 的类型兼容性”。\n3.  **评估指标**：\n    *   在 SWE-bench Verified 上，对比 SkillForge 与该方法在**回归错误率（Regression Error Rate）**上的表现。即，Agent 修复了目标 Issue，但引入了新的测试失败。\n    *   预期结果：该方法在解决涉及多模块交互的复杂 Issue 时，能显著降低回归错误率，因为它显式地建模了代码库中的因果依赖，而 SkillForge 仅依赖局部的、基于文本的启发式规则。\n\n**与已有工作的区分**\n*   **与 SkillForge 的区别**：SkillForge 依赖 LLM 合成缺陷并蒸馏文本技能，知识表示是非结构化的；本提议依赖静态/动态程序分析构建结构化因果图，知识表示是图形的、可推理的。\n*   **与 SWE-Exp 的区别**：SWE-Exp 依赖历史轨迹，知识是隐式的、基于相似性的；本提议主动构建显式的因果模型，知识是显式的、基于逻辑的。\n*   **新颖性**：将因果推断引入 SWE Agent 的知识获取过程，从“模仿修复”转向“理解影响”，为解决复杂软件工程问题提供了新的范式。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Silin Chen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Han Li\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Xiaodong Gu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Yuling Shi\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Haibing Guan\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Shanghai Jiao Tong University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"∗\",\n      \"text\": \"Silin Chen and Han Li contributed equally to this work.\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding author: Xiaodong Gu.\"\n    }\n  ]\n}\n```", "summary_translation": "基于大型语言模型（LLM）的智能体在自动化软件问题修复方面已展现出卓越的能力，但由于缺乏项目特定的知识，它们在解决特定仓库中的问题时往往面临困难。现有的自进化方法从仓库历史或在线修复轨迹中获取此类知识，但这些方法要么依赖于可用的历史问题修复信号，要么会产生高昂的每个问题的测试时探索成本。在本文中，我们提出了 SkillForge，这是一种主动从仓库本身获取项目特定知识的自蒸馏框架。SkillForge 不是等待真实问题暴露项目特定的知识缺口，而是通过重新实现仓库中受测试覆盖的核心功能来合成项目特定的问题。通过解决这些合成问题，SkillForge 将可复用的项目特定知识蒸馏为基于实体的技能，并将这些技能与相关的仓库实体关联起来，以供未来的问题修复使用。使用开源和闭源模型进行的广泛实验表明，SkillForge 在强大的基线方法上持续提升了问题修复性能。这些结果表明，在解决真实问题之前主动获取项目特定知识，能够显著提升下游软件问题修复的效果。"}, {"title": "SeisEvo: Evolution of Seismic Data Reconstruction Algorithms by Agents", "arxiv_id": "2608.18272", "authors": "Yingjie Xu, Siwei Yu, Jianwei Ma", "summary": "Classical seismic data reconstruction relies on manually designed structural priors and iterative operators, whose coupled design space is far larger than manual trial and error can explore systematically. Deep-learning methods encode the reconstruction rules in learned weights rather than in an explicit operator that can be inspected and modified. We propose SeisEvo (Seismic Algorithm Evolution), which does not optimize a single reconstruction result but searches for the algorithm that produces it. Starting from a classical reconstruction algorithm, an LLM-driven multi-agent search modifies only the components that the user has opened for editing, without prescribing the mechanism to be discovered. Candidates that violate the physical constraints of the task are rejected outright, and the remaining ones are scored by execution. The output is neither an agent system nor a neural network, but a standalone white-box algorithm that requires no agent or neural network at inference time. For interpolation without added noise, the search discovered a residual-gated, phase-aligned dip-consistency projection; Evo-POCS improves the SNR over classic POCS by 3.49 dB on average across missing ratios from 30% to 70%. For simultaneous interpolation and denoising, it discovered a reliability-grouped singular-value shrinkage; Evo-MSSA improves the average reconstruction SNR by more than 7 dB over classic MSSA and by more than 3 dB over a stronger rank-reduction baseline. Both operators retain their gains on data not used during the search. To the best of our knowledge, this is the first study to formulate the design of a seismic reconstruction operator as a constrained, LLM-driven program evolution task. Agentic algorithm evolution can thus complement deep learning in discovering explicit, inspectable, and deployable seismic processing algorithms.", "category": "cs.AI", "cluster": "Self-Evolving Agents \u0026 Synthetic Environments", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Multi-Agent)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=12 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文符合“自我演化 (Self-Evolving)”和“LLM智能体 (LLM-based Agents)”的研究范围，具体依据如下：\n\n1.  核心机制符合“自我演化/算法演化”：论文提出的 SeisEvo 框架核心在于利用 LLM 驱动的多智能体系统进行搜索，以发现和改进地震数据重建算法。这属于典型的“LLMs Improving LLMs”或“Agentic Discovery”范畴，即智能体通过迭代搜索、评估和反馈来演化出更优的解决方案（此处为算法算子）。这完全契合筛选标准中关于“自我演化”、“迭代改进”以及“智能体通过经验/反馈进行自我完善”的定义。\n\n2.  智能体作为核心方法论而非单纯应用工具：虽然应用场景是地震数据处理（领域应用），但论文的贡献不在于解决地震问题本身，而在于提出了一种新的智能体驱动的程序演化范式（LLM-driven program evolution task）。论文明确指出这是“第一个将地震重建算子设计表述为约束下的、LLM驱动的程序演化任务的研究”。这种将智能体用于自动化算法发现（Automated Algorithm Discovery）的方法论，对于理解智能体在复杂决策空间中的规划、搜索和演化能力具有普遍意义，符合“保留：如果论文的核心是把‘自我演化’机制，应用在特定领域...也应该保留”的规则。\n\n3.  多智能体协作与评估机制：论文涉及多智能体搜索（multi-agent search），其中智能体负责修改组件、执行候选方案并根据物理约束和性能得分进行筛选。这涉及智能体的工具使用（执行代码/算法）、自我反思（基于得分的筛选）和协作机制，属于 Agentic AI 的核心研究内容，而非简单的系统工程编排。\n\n4.  排除项检查：\n       它不是单纯的基础设施或部署优化。\n       它不涉及被排除的安全、对齐、可解释性（尽管生成的算法是白盒可解释的，但这只是结果属性，核心机制是演化）、图神经网络或多模态视觉。\n       它不是非演化的应用，因为核心贡献是“演化算法”这一机制本身。\n\n综上，该论文展示了 LLM 智能体在自动化算法发现和演化方面的前沿能力，属于 Agentic AI 中 Self-Evolving 方向的重要案例，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：如何将地震数据重建算子（seismic reconstruction operator）的设计过程，从依赖人工经验的手动调优，转化为一个由大语言模型（LLM）驱动的、受物理约束约束的自主程序进化任务（constrained program evolution task）。具体而言，SeisEvo 框架不直接优化重建结果，而是以经典重建算法为种子，在保留数据保真度（data-fidelity）和物理合法性（physical legality）的前提下，自动搜索并发现新的算子机制（如阈值函数、衰减策略或低秩投影规则），最终输出一个无需神经网络或 Agent 参与即可独立运行的白盒算法（white-box algorithm）。\n\n这一问题的重要性在于它直击了传统地震处理与深度学习方法的共同痛点。传统方法（如 POCS 和 MSSA）虽然具有可解释性和易部署性，但其设计空间（design space）巨大且各组件（如变换域选择、阈值形式、秩选择）之间存在复杂的耦合效应，人工试错难以系统性地探索最优组合。另一方面，虽然深度学习（deep learning）在重建性能上取得了显著进展，但其本质是黑盒模型，重建规则隐含在权重中，难以检查、修改或保证在分布外数据（out-of-distribution data）上的泛化能力，且推理过程依赖庞大的计算资源。SeisEvo 的价值在于它提供了一种互补路径：既保留了传统算子的显式、可检查和可部署特性，又利用 LLM 的生成能力突破了人工设计的局限，实现了算法机制的自动发现。这不仅提升了重建精度（如在无噪插值中 SNR 提升 3.49 dB，在去噪插值中 SNR 提升超过 7 dB），还确保了算法在未见数据上的鲁棒性，为地球物理算法设计提供了一种新的范式，即专家定义约束与目标，而由搜索过程发现具体机制。\n\n### § 2 前人工作与不足\n\n地震数据重建问题此前主要通过两类方法解决：基于显式数学算子的经典方法和基于数据驱动的深度学习方法，但两者均存在显著不足。\n\n在经典方法方面，代表性工作包括基于变换域稀疏性的投影凸集（POCS）方法 [Abma and Kabir, 2006] 和基于结构化低秩特性的多通道奇异谱分析（MSSA）方法 [Oropeza and Sacchi, 2011]。后续研究如 [Gao et al., 2010] 提出的指数硬阈值 POCS，以及 [Chen et al., 2020] 提出的最优阻尼秩缩减（ODRR）方法，通过专家引导的机制特定设计（mechanism-specific design）对算子进行了改进。然而，这些方法的不足在于：1）设计空间探索不系统：改进通常仅针对单一维度（如仅调整阈值形式或仅优化秩选择），忽略了各设计因子之间的交互作用，导致在特定采集条件或噪声水平下有效的参数难以迁移到其他场景；2）依赖人工经验：算子的具体形式和参数调整高度依赖领域专家的先验知识，无法自动发现超越人类直觉的新机制（如 SeisEvo 发现的残差门控相位对齐倾角一致性投影）。\n\n在深度学习方法方面，近期研究如 [Yu et al., 2019]、[Wang et al., 2019] 以及自监督方法 [Liu et al., 2021]、[Meng et al., 2022] 通过端到端网络学习重建映射。尽管这些方法在特定数据集上表现优异，但其不足在于：1）黑盒性质与不可解释性：重建规则分布在网络权重中，难以像传统算子那样被显式写出、检查或在给定约束下修改；2）泛化能力受限：监督方法严重依赖训练数据分布，当采集条件、噪声水平或地质结构与训练数据差异较大时，性能可能显著下降；3）设计负担转移而非消除：深度学习并未消除人工设计，而是将设计努力从重建算子转移到了网络架构、损失函数和训练策略上，且推理过程仍需依赖神经网络，增加了部署成本和计算开销。\n\n此外，虽然 LLM 驱动的程序搜索（如 FunSearch [Romera-Paredes et al., 2024]、Eureka [Ma et al., 2024]）已在组合数学和机器人控制等领域展示了发现新启发式规则的能力，但在地震重建领域的应用尚属空白。现有 LLM 进化方法通常针对固定算法管道内的启发式规则或奖励函数，缺乏对地震重建任务特有的物理合法性约束（如采样掩码不变性、观测数据保真性）和可解释性规则（如参数溯源、禁止纯参数调优）的系统性整合。因此，前人工作未能将算法结构本身作为搜索对象，并在严格的地球物理约束下发现独立、白盒的重建算子，这正是 SeisEvo 所填补的关键缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n地震数据重建（Seismic Data Reconstruction）长期依赖于人工设计的数学算子，如基于稀疏性的 POCS 或基于低秩结构的 MSSA。尽管这些经典方法具有可解释性，但其性能高度依赖于专家对阈值函数、衰减策略或秩选择等超参数的精细调优。随着深度学习（Deep Learning）的兴起，数据驱动的方法在重建质量上取得了显著进展，但它们通常作为“黑盒”存在，难以在物理约束下进行显式修改，且泛化能力受限于训练数据分布。与此同时，大语言模型（LLM）在代码生成和程序搜索领域展现出巨大潜力，如 FunSearch 和 AlphaEvolve 等研究表明，LLM 可以通过进化搜索发现优于人类设计的启发式规则或算法结构。\n\n然而，将 LLM 驱动的算法进化直接应用于地震重建面临两个核心挑战：一是缺乏明确的物理合法性约束，导致搜索可能产生违反数据一致性或物理意义的无效代码；二是传统进化算法往往陷入单纯的参数微调，而非发现新的机制。作者意识到，地震重建问题具有明确的模块化结构（如变换域投影、数据一致性步骤）和可量化的质量指标（如 SNR、SSIM），这为将算法设计转化为受约束的程序进化任务提供了理想场景。通过引入“物理合法性硬门控”（Physical Legality Hard Gates）和“参数溯源规则”（Parameter Provenance Rules），可以确保搜索过程不仅优化性能，而且发现具有明确物理意义、可解释且无需神经网络支持的白盒算子。因此，作者提出 SeisEvo 框架，旨在利用 LLM 多智能体系统，在经典算法的编辑表面上自主搜索新的算子机制，从而结合经典方法的可解释性与进化搜索的探索能力。\n\n### § 4 核心 Intuition\n\n传统地震重建算法的性能瓶颈在于人工设计难以穷尽复杂的算子组合空间，而深度学习虽能拟合复杂映射却牺牲了可解释性和物理约束。SeisEvo 的核心直觉是将“算法结构本身”而非“重建结果”作为搜索对象，利用 LLM 多智能体在严格的物理合法性约束下，对经典算法的可编辑模块进行自动化进化。这种方法通过执行反馈而非梯度下降来筛选候选算子，从而发现既符合物理规律又优于人工设计的显式、可解释的新机制，实现了从“调参”到“发现机制”的范式转变。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nSeisEvo 的核心思想是将地震数据重建算法的设计转化为一个由大语言模型（LLM）驱动的**程序进化（Program Evolution）**任务。它不直接优化重建结果，而是搜索能产生高质量重建结果的**算法代码**。\n\n**完整 Pipeline 以 Evo-POCS（基于 POCS 的插值算法进化）为例：**\n\n1.  **任务实例化（Task Instantiation，人工设定）：**\n    *   **输入：** 专家定义种子算法 $A_0$（经典 POCS，使用指数硬阈值）、可编辑组件集合 $S$（如阈值函数、衰减调度、投影算子）、目标函数 $O$（SNR 和 SSIM 的组合）、约束集 $C$（必须保留观测数据、掩码不变、输出为实数、无未解释的自由参数）。\n    *   **目的：** 划定搜索边界，确保生成的算法在物理上是合法的（Physical Legality）。\n\n2.  **候选生成（Candidate Generation，Agent 执行）：**\n    *   **过程：** 多个 LLM 编码 Agent 并行工作。它们读取当前池中的高分候选、失败案例及搜索上下文。\n    *   **动作：** Agent 仅在 $S$ 定义的范围内修改代码。例如，Agent 可能提议在 Fourier 阈值化后增加一个“局部倾角一致性校正”步骤。每个候选必须附带理由（Rationale）和参数来源说明。\n\n3.  **门控与评分（Gating and Scoring，框架执行）：**\n    *   **硬门控（Hard Gate）：** 框架首先检查代码是否违反约束 $C$。如果代码破坏了观测数据、改变了采样掩码或数值发散，直接拒绝。\n    *   **执行与评分：** 合法的候选代码在搜索用的子块数据（Search-time sub-blocks）上运行。\n    *   **输出：** 计算目标函数 $O$ 的得分。高分者进入候选池，低分或失败者作为负样本记录。\n\n4.  **证据绑定与上下文更新（Evidence Binding and Context Update，框架执行）：**\n    *   **过程：** 框架记录每个候选的得分和失败日志，更新搜索上下文。\n    *   **目的：** 指导下一轮 Agent 更倾向于探索成功的机制（如“倾角一致性”），避免重复失败的尝试。此步骤不涉及 LLM 判断，仅基于执行结果的程序化规则。\n\n5.  **输出与验证（Output and Validation）：**\n    *   **最终输出：** 经过 $T$ 轮迭代后，得分最高的合法候选 $A^{[\\star]}$ 被冻结为独立算法（如 Evo-POCS）。\n    *   **推理阶段：** 该算法是**白盒（White-box）**的，无需 Agent、Prompt 或神经网络即可独立运行。\n    *   **外部验证：** 在搜索未使用的合成数据和野外数据上测试其泛化能力。\n\n**具体例子：Evo-POCS 的发现过程**\n*   **初始状态：** 经典 POCS 仅依赖 Fourier 域的稀疏性，对倾斜事件重建效果有限。\n*   **进化发现：** Agent 发现引入一个**残差门控、相位对齐的倾角一致性投影（Residual-gated, phase-aligned dip-consistency projection）**能显著提升得分。\n*   **机制细节：** 在每次迭代中，算法从观测到的相邻道估计局部相位关系，预测缺失样本，并根据预测与观测的残差大小赋予置信度权重，仅在高置信度方向上校正缺失值。\n*   **结果：** Evo-POCS 在 30%-70% 缺失率下，平均 SNR 比经典 POCS 提高 3.49 dB。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\nSeisEvo 本身是一个框架，其核心数学推导体现在进化出的具体算子（如 Evo-POCS 和 Evo-MSSA）中。以下以 **Evo-POCS** 的核心创新——**倾角一致性校正（Dip-consistency Correction）**为例进行推导说明。\n\n**理论背景：**\n经典 POCS 假设地震数据在变换域（如 Fourier 域）是稀疏的。然而，地震波具有明显的**局部连续性（Local Coherence）**和**倾角（Dip）**特征。Evo-POCS 在 Fourier 阈值化后，增加了一个基于数据驱动的局部倾角校正步骤，以利用这一结构先验。\n\n**核心公式与 Intuition：**\n\n1.  **局部相位系数估计（Local Phase Coefficient）：**\n    对于每个候选倾角方向 $d$，算法从观测到的相邻道对估计复数相位系数 $c_d(u)$：\n    $$ c_d(u) = \\frac{\\sum_{v \\in N_7(u)} M(v+d)M(v) U(v+d) \\overline{U(v)}}{\\sum_{v \\in N_7(u)} M(v+d)M(v) |U(v)|^2 + \\epsilon} $$\n    *   **Intuition：** 这个公式计算了沿方向 $d$ 相邻样本之间的相位旋转关系。分子是互相关，分母是自相关。它捕捉了地震波沿特定方向传播时的相位变化规律。$M$ 确保只使用观测到的数据。\n\n2.  **方向预测与残差（Directional Prediction and Residual）：**\n    利用相位系数，沿方向 $d$ 预测当前位置 $u$ 的值 $P_d(u)$：\n    $$ P_d(u) = \\frac{1}{2} \\left( c_d(u) U(u+d) + \\overline{c_d(u)} U(u-d) \\right) $$\n    然后计算该预测在观测样本上的残差 $R_d(u)$：\n    $$ R_d(u) = \\sum_{v \\in N_3(u)} M(v) |U(v) - P_d(v)|^2 $$\n    *   **Intuition：** $P_d(u)$ 利用左右邻居的相位对齐信息来预测中心点。如果方向 $d$ 是真实的波前方向，预测值应与实际值接近，残差 $R_d$ 应较小。\n\n3.  **共识预测与置信度门控（Consensus Prediction and Confidence Gate）：**\n    选择残差最小的几个方向，加权组合成共识预测 $P^\\star(u)$。校正强度由置信度 $\\kappa(u)$ 控制：\n    $$ \\kappa(u) = \\max\\left(0, 1 - \\frac{\\min_d R_d(u)}{\\bar{R}(u)}\\right) $$\n    最终更新：\n    $$ V_{new} = V_{POCS} + \\kappa \\odot (P^\\star - V_{POCS}) $$\n    *   **Intuition：** $\\bar{R}(u)$ 是所有方向残差的均值。如果某个方向的残差远小于均值（即 $\\min_d R_d \\ll \\bar{R}$），说明该方向非常可靠，$\\kappa$ 接近 1，校正作用强；如果所有方向残差都差不多，说明局部结构不明确，$\\kappa$ 接近 0，保持原样。这实现了**自适应的、数据驱动的**结构先验注入。\n\n**Evo-MSSA 的核心数学：**\nEvo-MSSA 引入了**可靠性分组奇异值收缩（Reliability-grouped Singular-value Shrinkage）**。\n*   **Intuition：** 传统 MSSA 对所有 Hankel 块使用相同的秩和收缩规则。Evo-MSSA 根据局部观测的可靠性（由残差和噪声水平估计）将块分组，每组使用独立的低秩子空间拟合。\n*   **关键公式：** 使用 Marchenko-Pastur (MP) 定律估计噪声尺度 $\\sigma_{B,g}$，并结合 Gavish-Donoho (GD) 最优阈值进行奇异值收缩。可靠性场 $\\Gamma$ 通过跨迭代的 Cesàro 平均稳定下来，用于软数据一致性更新。\n\n### § 7 实验设计与结论\n\n**提出了什么问题？**\n传统地震数据重建算法（如 POCS, MSSA）依赖人工设计的结构先验和迭代算子，设计空间巨大且难以系统探索。深度学习虽然有效，但缺乏可解释性且依赖训练数据分布。如何自动发现**可解释、白盒、无需神经网络**的高效重建算法？\n\n**设计了什么实验验证这个问题？**\n1.  **案例一：无噪声插值（Interpolation without noise）。**\n    *   **种子算法：** 经典 POCS。\n    *   **任务：** 随机缺失道插值。\n    *   **验证：** 在合成数据和野外数据上，比较 Evo-POCS 与经典 POCS 在不同缺失率（30%-70%）下的 SNR、SSIM 和 MSE。\n2.  **案例二：同时插值与去噪（Simultaneous interpolation and denoising）。**\n    *   **种子算法：** 经典 MSSA。\n    *   **任务：** 随机缺失道 + 高斯噪声。\n    *   **验证：** 比较 Evo-MSSA 与经典 MSSA 及强基线 ODRR 在不同噪声水平下的重建 SNR。\n3.  **泛化性测试：**\n    *   在搜索阶段未使用的合成数据和野外数据上测试进化算法的性能，验证其是否过拟合搜索数据。\n\n**问题的答案是什么？**\n1.  **Evo-POCS 有效提升了插值性能：** 在 30%-70% 缺失率下，Evo-POCS 平均 SNR 比经典 POCS 提高 **3.49 dB**。它发现了一个基于局部倾角一致性的校正机制，增强了事件连续性。\n2.  **Evo-MSSA 显著优于传统方法：** 在同时插值和去噪任务中，Evo-MSSA 平均重建 SNR 比经典 MSSA 提高超过 **7 dB**，比 ODRR 提高超过 **3 dB**。它发现了一种基于可靠性分组的奇异值收缩机制，更好地平衡了去噪和信号保留。\n3.  **泛化能力强：** 进化出的算法在未见过数据上保持了性能增益，证明其发现的是通用的物理机制而非数据捷径。\n4.  **结论：** LLM 驱动的程序进化（Agentic Algorithm Evolution）可以作为一种互补于深度学习的路径，发现**显式、可检查、可部署**的地震处理算法，将领域专家的角色从“设计算子”转变为“定义搜索边界和约束”。", "additional_insights": "### § 8 Take-aways\n\nSeisEvo 将地震数据重建算法的设计重构为一个受物理约束的 LLM 驱动的程序进化任务，其核心产出是无需神经网络或 Agent 参与推理的独立白盒算子（standalone white-box algorithm）。该方法通过 Evolutionary Ensemble of Agents (EvE) 框架，在保留经典算法（如 POCS 和 MSSA）数据保真度约束的前提下，自动搜索并发现新的算子机制，而非仅优化网络权重。在无损插值任务中，SeisEvo 发现的 Evo-POCS 引入了残差门控、相位对齐的倾角一致性投影（residual-gated, phase-aligned dip-consistency projection），在 30%-70% 缺失率下平均提升 SNR 3.49 dB。在联合插值与去噪任务中，SeisEvo 发现的 Evo-MSSA 采用了基于可靠性的奇异值分组收缩（reliability-grouped singular-value shrinkage），相比经典 MSSA 平均提升 SNR 超过 7 dB，且优于 ODRR 基线。该框架通过硬性合法性门控（hard legality gates）和参数溯源规则（parameter provenance rules）确保生成的代码符合物理测量条件且具备可解释性，避免了深度学习黑盒模型在泛化性和可部署性上的局限。实验表明，这些通过搜索发现的显式算子在未见过的合成数据和野外数据上均保持了性能增益，证明了 Agentic algorithm evolution 作为深度学习补充手段在发现可检查、可部署的地震处理算法方面的潜力。\n\n### § 9 最脆弱的假设\n\n该方法最脆弱的假设是：**搜索阶段使用的子块数据（search-time sub-blocks）及其对应的质量指标（如 SNR、SSIM）能够充分代表真实野外数据中复杂地质结构和噪声分布下的算法泛化能力，且硬性物理约束足以防止 Agent 发现仅针对特定子块统计特性的“捷径”（shortcuts）。**\n\n如果这一假设不成立，即 Agent 发现的机制（如 Evo-POCS 中的倾角一致性校正或 Evo-MSSA 中的可靠性分组）仅仅是过拟合了搜索子块的局部统计特征（例如特定的频率带宽或噪声水平），那么当算法应用于具有不同地质构造、更复杂噪声或不同采样模式的真实野外数据时，其性能增益将消失甚至导致重建失败。论文通过在不同缺失率和噪声水平下的野外数据集上进行外部验证（external validation）来支持这一假设，展示了 Evo-POCS 和 Evo-MSSA 在未见数据上的 SNR 提升。然而，论文缺乏对“机制鲁棒性”的深入分析，例如未证明这些机制在极端地质条件（如强散射介质、非平稳噪声）下是否依然有效，也未排除 Agent 可能利用了搜索子块中存在的某种未被察觉的统计偏差。如果未来在更广泛的野外场景中测试发现性能显著下降，则说明当前的约束集和评分函数未能完全捕捉地震重建任务的本质物理规律，导致进化出的算子缺乏真正的物理普适性。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 **Evo-POCS 中“倾角一致性校正”（dip-consistency correction）模块的有效性**，以验证其是否真的通过利用局部倾角信息提升了重建质量，而非仅仅依赖傅里叶稀疏性。\n\n**具体步骤：**\n1.  **数据准备**：使用论文中提供的或公开的 3D 地震数据子块（如 64x64x64），生成 50% 随机缺失的观测数据 $Y$ 和掩码 $M$。\n2.  **实现基线**：实现经典的 POCS 算法（傅里叶变换 + 硬阈值 + 数据一致性投影），作为 Baseline。\n3.  **实现增量模块**：根据附录 A 的公式，实现 Evo-POCS 的核心增量部分——即基于观测道对的局部相位系数估计、多方向预测、残差加权共识预测以及置信度门控更新。将此模块插入到经典 POCS 的每次迭代之后。\n4.  **测量指标**：在相同的缺失率下，分别运行 Baseline 和 Evo-POCS，计算重建结果与原始完整数据的 SNR 和 SSIM。\n5.  **验证逻辑**：\n    *   **支持 Claim**：如果 Evo-POCS 的 SNR 显著高于 Baseline（如论文所述的 3-5 dB 提升），且误差图显示在倾角变化剧烈的区域（如断层附近）重建更连续，则证明该局部倾角一致性机制有效。\n    *   **反驳 Claim**：如果两者性能相当或 Evo-POCS 更差，则说明该机制可能依赖于特定的数据分布或实现细节，或者其增益主要来源于其他未隔离的因素（如迭代次数或阈值策略的微小差异），从而质疑 SeisEvo 发现机制的独立价值。\n\n此实验无需复现整个 LLM Agent 搜索过程，仅验证其发现的一个具体算子机制，成本低且能直接检验论文的核心技术贡献之一。", "research_value": "### § 11 最强反例设计\n\n若要挑战 SeisEvo 的有效性，最有力的攻击并非质疑其性能提升，而是质疑其发现的机制是否具备**物理普适性（Physical Gene
