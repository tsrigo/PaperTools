工具调用是否必要     │\n└──────────────────────┬────────────────────┘\n                       ▼\n┌───────────────────────────────────────────┐\n│         反事实评测 (§3.3, §5)               │\n│  线索存在(Y) vs 线索缺失(N)                │\n│  ∆Tool_Y-N = π̂(T|xc,a) - π̂(T|xc)        │\n│  在工具不需要的任务上测量捷径强度           │\n└───────────────────────────────────────────┘\n```\n\n整个 pipeline 分训练与评测两个阶段。训练阶段首先从 NQ 和 DeepMath 各采样 500 条问题，向其中一个子集注入与特定工具强相关但因果无关的线索（如 `[WEB INDEX]` 或 `# Cell`），构造出 1000 条带虚假相关性的训练样本（§3.1）。随后用 GRPO 算法训练 Qwen2.5-7B-Instruct，agent 通过生成 `\u003Csearch\u003E` 或 `\u003Cpython\u003E` 结构化标签来调用对应工具，环境执行后将结果返回供后续生成使用（§5.1）。标准训练仅以最终答案正确性给出任务奖励 $r_{\\text{task}}$；本文额外引入工具必要性奖励，由 GPT-5 Nano 作为 LLM judge 逐步判定每次工具调用是否为正确解题所必需，对不必要的调用施加 $\\alpha=0.5$ 的惩罚，总奖励为 $r_{\\text{task}} + \\alpha \\cdot r_{\\text{nec}}$（§4.1）。\n\n评测阶段采用反事实评测组：对每个测试问题构造线索存在（Y）和线索缺失（N）两个变体，在工具并非所需的任务上比较两者的工具调用率之差 $\\Delta\\text{Tool}_{Y-N}$，以此隔离线索驱动与任务驱动的工具选择（§3.3）。除训练分布内的 DeepMath 和 NQ 外，还在 GSM8K 和 2Wiki 上评测泛化表现。\n\n### § 6 核心数学推导\n\n本文的理论框架建立在群鲁棒性（group robustness）之上。标准经验风险最小化（ERM）最小化平均风险 $R_{\\text{avg}}(\\theta)$，但当虚假属性 $a$ 与标签 $y$ 在训练分布中相关而因果无关时，模型可能学到捷径 $a \\to y$，导致最差组风险 $R_{\\text{max}}(\\theta)$ 很高（§2.1）。\n\n本文将此框架扩展到工具选择这一中间决策层。给定输入 $x = (x_c, a)$，agent 按策略 $\\pi_\\theta(T|x)$ 选择工具，期望奖励分解为各工具的期望效用之和：$\\mathbb{E}[R|x] = \\sum_T \\pi_\\theta(T|x) \\, P(R{=}1|x,T)$，其中 $P(R{=}1|x,T)$ 是工具 $T$ 对该任务的功能效用（§2.2）。\n\n**定义 1（工具虚假相关性）**：策略 $\\pi_\\theta$ 对工具 $T_s$ 表现出虚假相关性，需同时满足两个条件——(1) 线索 $a$ 的存在使工具选择概率膨胀至 $\\pi_\\theta(T_s|x_c, a) \\gg \\pi_\\theta(T_s|x_c)$；(2) $T_s$ 对任务表现无贡献，即使用它不比不用更好。第二个条件的关键 intuition 在于：虚假工具调用未必导致任务失败（agent 可以忽略搜索结果仍给出正确答案），因此仅看最终答案正确性的奖励信号无法检测到此类捷径。实验中用 $\\Delta\\text{Tool}_{Y-N} = \\hat{\\pi}_\\theta(T_s|x_c, a) - \\hat{\\pi}_\\theta(T_s|x_c)$ 来量化捷径强度，其中 $\\hat{\\pi}_\\theta$ 为经验工具调用率。\n\n### § 7 实验设计与结论\n\n**问题一：RL agent 是否会学到基于表面线索的虚假工具调用？** 作者在 NQ 训练子集中注入搜索语义线索（如 `[WEB INDEX]`、`\u003Canswer\u003E`），训练后在数学测试集上评测。结果发现线索存在时 agent 大量调用搜索工具，$\\Delta\\text{Search}$ 在 GSM8K 上高达 +39.2 个百分点，而线索缺失时几乎不调用（Table 1）。这证实了虚假工具使用的存在。\n\n**问题二：捷径形成的关键因素是什么？** 作者设计了交换线索实验：将代码语义线索注入 NQ（任务已学会但语义不匹配），将搜索语义线索注入 DeepMath（语义匹配但任务未学会）。结果前者仅产生 $\\Delta\\text{Search} \\leq 3.5\\%$ 的微弱效应（Table 3），后者几乎无效应（Table 4）。结合训练准确率曲线（NQ 持续上升而 DeepMath 停滞，Figure 2），结论是任务能力是捷径形成的必要条件，语义对齐则调节其强度——两者互补，缺一不可。\n\n**问题三：工具必要性奖励能否缓解这一问题？** 作者在训练中加入 LLM judge 对每次工具调用的必要性评估，对不必要的调用施加惩罚。结果显示虚假工具调用率降至接近零，同时任务准确率保持或略有提升（Table 1 的 +Reward 行）。此外，相关性强度实验（Table 5）表明捷径行为在线索-工具相关度达 80% 以上才显著出现，70% 及以下基本消失，提示存在阈值效应。", "additional_insights": "### § 8 阅读收获\n\n论文揭示RL训练的工具使用智能体存在隐蔽失败模式：智能体根据表面线索而非任务需求选择工具，因不影响最终答案正确率而在标准评测中难以被发现。核心发现是捷径形成与任务能力紧密耦合——只对已学会可靠使用的工具形成伪关联，线索与工具的语义一致性会放大该效应。工具必要性奖励通过LLM评判器逐次评估调用必要性，在不牺牲准确率的前提下有效抑制伪调用。\n\n### § 9 最脆弱的假设\n\n最关键假设是捷径形成由任务能力驱动而非工具结构差异。论文证据来自单一不对称场景：智能体学会了搜索但未学会数学，捷径仅在搜索工具上出现。但搜索只需生成查询、代码需生成可执行程序，调用复杂度的差异可能才是真正原因。论文缺少智能体同时学会两类任务的对照——若此时捷径仍只对搜索出现，任务能力的解释将被根本削弱。\n\n### § 10 最小复现实验\n\n用200个NQ问答和200个GSM8K数学题构建训练集，在NQ样本末尾注入`\u003Canswer\u003E`标签作为搜索语义线索，用Qwen2.5-7B-Instruct配合GRPO训练约20步。在GSM8K上分别评估有线索和无线索版本的搜索调用率，计算差值ΔSearch。若ΔSearch超过5个百分点则支持\"线索诱发不必要搜索调用\"的结论，接近零则反驳。实验保留线索注入与反事实评测的核心设计，将训练规模压缩至最小可行范围。", "research_value": "### § 11 最强反例设计\n针对本文提出的工具必要性奖励，最强反例在于 LLM judge 本身可能受到同样的表面线索干扰。如果评判器在评估时也学会了“看到特定线索就认为调用合理”，惩罚机制将形同虚设。我们可以设计一个工具真实必要性难以单步判断的复杂推理任务，并注入强相关线索。若实验发现评判器对带有线索的不必要调用给出了高必要性评分，导致虚假调用未被惩罚，这就证明该方法在评判器能力受限时会可预测地失败。\n\n### § 12 后续研究设想\n本文的关键局限在于仅在单步工具调用场景中验证了缓解方法，而真实智能体常需多轮交互。后续研究可探讨在多轮工具调用链中，单步必要性奖励是否依然有效。具体而言，需要将单次调用评估改为对整条交互轨迹的评估，因为前一次冗余调用可能引发后续连锁反应。首个对照实验可在需要多轮搜索与代码执行的任务上，比较单步奖励与轨迹级奖励对虚假调用的抑制效果，以此检验单步评估是否会遗漏跨步骤的捷径行为。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yiwei Yang\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Haoxiang Zhang\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Bingbing Wen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yao Lu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuchen Wu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Lei Zhang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Julian McAuley\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Pan Lu\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Bill Howe\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"University of Washington\"},\n    {\"id\": 2, \"name\": \"University of California San Diego\"},\n    {\"id\": 3, \"name\": \"Stanford University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"}\n  ]\n}\n```", "summary_translation": "大语言模型（LLM）智能体日益将自然语言推理与网络搜索和代码执行等外部工具交替结合。这些工具使用策略通常通过强化学习（RL）进行优化，但这可能会放大训练数据中的虚假相关性。在本研究中，我们探讨了经过RL训练的智能体何时以及为何会学习捷径工具选择策略：即基于表面的提示线索而非真实的任务需求来调用工具。我们构建了结合事实问答和数学推理任务的受控合成环境，并在训练期间注入与特定工具强相关但在因果关系上与工具必要性无关的线索。在线索存在但不需要相关工具的反事实评估中，智能体表现出显著的捷径行为，虚假工具调用率增加了高达39%。然而，捷径的形成并非普遍现象：在我们测试的条件下，仅当智能体已经学会可靠地使用目标工具时才会出现，这表明任务能力而非单纯的数据集不平衡是捷径学习的关键因素。交换线索分析进一步表明，线索与工具之间的语义对齐会显著放大这种效应。为了缓解这些问题，我们引入了一种密集的决策级奖励，其中LLM评判器会评估每次工具调用的必要性。这种工具必要性奖励在保持任务性能的同时，有效抑制了由线索驱动的工具使用，为提高LLM智能体工具使用策略的鲁棒性提供了一种实用方法。"}, {"title": "Turn-level Multiscale Density Ratio Estimation for LLM Agents", "arxiv_id": "2609.16760", "authors": "Zishuo Zhao, Kai Chen, Ao Li, Yuan Liu", "summary": "With the rapid development of Large language model (LLM), agent systems enhanced by LLMs show huge potential in being able to deal with complex tasks, especially involving multi-step thinking or interaction with tools. For applying LLM techniques with a well-designed agent paradigm, post-training of LLM in multiple agent scenarios is necessary to achieve better performance. Among the variable post-training techniques, alignment methods such as PPO, DPO, DIL, and GRPO become popular because many papers show a significant positive impact on the model's performance by punishing negative samples while keeping acceptable training complexity. However, most alignment methods address simple single-turn tasks, and there remains room for improvement for complex multi-turn tasks. We propose Turn-level Multiscale Density Ratio Estimation (tlm-DRE), which assigns different weights on corresponding turns and proposes asymmetric token-level training based on the positive-negative space gaps across multiple turns of tasks. The results of the experiment on a wide range of agent benchmarks show that the proposed method performs competitively compared to traditional alignment methods. The proposed training method enables LLMs to perform robustly in multi-turn reasoning tasks with both in-domain and out-of-domain conditions.", "category": "cs.AI", "cluster": "Tool Use \u0026 Agent Training", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-12 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 论文的核心贡献是提出了一种针对LLM智能体多轮任务的训练方法（Turn-level Multiscale Density Ratio Estimation, tlm-DRE），通过在多轮交互中分配不同权重并进行非对称的token级训练，以改进智能体在复杂多步推理和工具交互场景下的表现。这直接符合筛选标准中“保留”规则所强调的“agent training/distillation/RL”以及“研究对象明确是 LLM Agents / Tool-Use Agents”。尽管摘要中提到了“alignment methods”（如PPO、DPO），但其目的并非探讨AI安全或对齐问题，而是作为一种后训练技术来提升LLM智能体在多轮任务中的鲁棒性和能力，属于智能体能力改进的范畴。因此，该论文与你的研究焦点（构建、改进、训练LLM智能体）高度相关。", "intro_logic": "### § 1 研究问题与重要性\n论文解决的研究问题是如何对大语言模型（LLM）Agent 进行多轮交互任务的高效对齐训练。LLM Agent 在处理复杂任务时需要与环境进行多步交互，而现有的对齐方法通常在整条轨迹级别进行奖励或惩罚。然而，一条失败的轨迹往往只有少数关键轮次出错，轨迹级别的粗粒度对齐会错误惩罚正确的轮次，导致训练效率低下且性能次优。解决这个细粒度对齐问题能显著提升 Agent 在多轮推理任务中的鲁棒性和泛化能力。\n\n### § 2 前人工作与不足\n此前，ETO 和 DMPO 等基于直接偏好优化（DPO）的方法，以及 DIL 等基于密度比估计的方法，已被用于 Agent 的对齐训练。这些方法主要在轨迹级别操作，将整条失败轨迹视为完全负面的样本，忽略了多轮轨迹中不同轮次的贡献差异。虽然已有研究尝试在 token 级别分配权重，但由于 Bregman 散度的高度非线性和不对称性，这些思路无法直接扩展到基于密度比估计的轮次级别优化中，导致现有方法在多轮任务中的对齐效果受限。", "core_insight": "### § 3 重建作者的思考路径\n\n现有对齐方法如 DPO 将整条失败轨迹视为负样本统一惩罚，但实际观察发现，一条被拒绝的轨迹中往往只有少数几个轮次出了关键错误，其余轮次与专家轨迹基本一致。这种粗粒度的正负区分会把大量正确轮次推向负样本空间，造成信号污染。与此同时，密度比估计（DRE）作为模仿学习的一种形式，已被证明可用于 LLM 对齐，但其传统表达仍停留在轨迹级别，未利用轮次间的差异信息。一个自然的问题是：能否在 DRE 框架内引入轮次粒度的权重，让训练聚焦于真正需要纠正的关键步骤？\n\n### § 4 核心直觉\n\n一条多轮轨迹里，真正导致失败的轮次是稀疏的，大部分轮次模型已经做得不错。tlm-DRE 用 SFT 策略对每个轮次的输出置信度作为\"训练充分度\"指标：置信度低的轮次说明模型还没学好，需要重点对齐；置信度高的轮次则降权，避免过度惩罚已经正确的部分。这样在密度比估计的框架下，对齐训练从\"整条轨迹拉远\"变成\"只拉远关键错误轮次\"，既节省了 token 级别的训练预算，又防止正确轮次的奖励被误压。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+-------------------+       +-------------------+       +-------------------+\n|   SFT 参考策略    | ----\u003E |  采样轨迹与环境   | ----\u003E |  收集失败轨迹     |\n| (Reference Policy)|      |    交互反馈       |       | (Rejected Traj.)  |\n+-------------------+       +-------------------+       +-------------------+\n                                                              |\n                                                              v\n+-------------------+       +-------------------+       +-------------------+\n|  tlm-DRE 对齐训练 | \u003C---- |  计算轮次权重     | \u003C---- |  识别低置信度轮次 |\n| (Multiscale DRE)  |       | (Turn-level Weight)|      | (Low-confidence)  |\n+-------------------+       +-------------------+       +-------------------+\n        |\n        v\n+-------------------+\n|   优化后的策略     |\n| (Optimized Policy)|\n+-------------------+\n```\n\n整个流程分为采样、权重计算和对齐训练三个阶段。首先，使用监督微调得到的 SFT 参考策略在环境中执行任务，采样轨迹并收集失败轨迹。接着，利用参考策略计算失败轨迹中每个轮次的置信度，识别出导致失败的低置信度关键轮次。随后，根据置信度为不同轮次分配权重：低置信度轮次赋予高权重，高置信度轮次赋予低权重。最后，将轮次权重代入多尺度密度比估计进行对齐训练，显式提升关键失败轮次的优化比重，输出最终策略。\n\n### § 6 核心数学推导\n\n本文的核心在于将传统的轨迹级密度比估计扩展到轮次级多尺度密度比估计。密度比定义为当前策略与参考策略的概率比值，用于衡量当前策略接近最优策略的程度。传统方法使用 Bregman 散度来最小化估计密度比与真实密度比之间的差异，而 Bregman 散度可以通过选择不同的核函数导出不同的距离度量。\n\n为了区分不同轮次的重要性，论文引入了轮次权重函数。该权重基于参考策略在特定轮次的置信度计算：置信度低意味着该轮次训练不足或存在关键错误，因此赋予高权重；置信度高则赋予低权重。将这一权重机制代入 Bregman 散度的优化目标后，推导出了 tlm-DRE 的最终损失函数。其直觉在于，一条失败轨迹往往只有少数几个轮次是错的，通过给这些关键错误轮次赋予更高权重，可以更精细地惩罚错误，避免把正确的轮次也推向负样本区域。\n\n### § 7 实验设计与结论\n\n论文提出：现有的对齐方法在多轮 Agent 任务中表现不佳，因为它们在轨迹级别进行粗粒度对齐，忽略了不同轮次的重要性差异。为验证这一问题，研究者在 ALFWorld、SciWorld 和 HotpotQA 等多轮交互基准上，将 tlm-DRE 与 SFT、PPO、ETO、DMPO、DIL 等基线方法进行对比，并进行了消融实验。\n\n实验结果表明，tlm-DRE 在多个基准上取得了最优或极具竞争力的表现，尤其在分布外任务上提升明显。消融实验证明，轮次权重和密度比估计各自都有独立贡献，且轮次权重在分布外任务上增益更大，说明强调关键轮次有助于模型更好地适应未见过的交互模式。", "additional_insights": "### § 8 阅读收获\n传统对齐方法如DPO将整条失败轨迹视为负样本，忽略了其中大部分正确的轮次，导致过度惩罚。tlm-DRE通过参考策略计算每个轮次的置信度，对低置信度的关键错误轮次赋予高权重进行重点训练，高置信度轮次则降低权重。这种细粒度的轮次级对齐在域外任务上表现更稳健，提升了多轮推理任务的token效率。\n\n### § 9 最脆弱的假设\n该方法的核心假设是：SFT参考策略在特定轮次上的低置信度，代表该轮次是“欠拟合”的关键错误步骤，而非模型固有的幻觉或环境随机性。如果低置信度仅源于任务固有难度，基于置信度分配高权重就会放大噪声，导致核心贡献失效。论文仅通过正负样本置信度分布的差距和个别案例分析来支撑此假设，缺乏在高随机性环境中的验证。\n\n### § 10 最小复现实验\n可使用ALFWorld数据集和Qwen2.5-7B-Instruct模型进行最小复现。首先复现SFT阶段并收集失败轨迹，计算各轮次置信度以定位低置信度轮次。然后对比标准DPO与仅对低置信度轮次加权惩罚的简化版对齐方法，在未见测试集上测量成功率。若简化版成功率显著高于标准DPO，则支持轮次级加权能提升域外泛化的结论；若无差异或下降，则反驳该主张。", "research_value": "### § 11 最强反例设计\n如果我要反驳这篇论文，我会设计一个具有多解路径和高随机性的交互环境作为反例。在这种环境中，模型在某一步置信度低，可能是因为该步骤存在多个合理的分支选择，而非发生了关键错误。此时，对这种低置信度轮次施加高权重惩罚，会迫使模型放弃合理探索并收敛到单一解，导致泛化能力下降。在 WebShop 等网页导航任务上对比 tlm-DRE 与标准轨迹级方法，若 tlm-DRE 成功率显著下降且输出多样性锐减，就能证明基于置信度的加权机制在多解场景中会可预测地失败。\n\n### § 12 后续研究设想\n围绕低置信度可能源于合理探索而非错误这一局限，后续研究可以探讨如何结合环境反馈来修正轮次权重。具体而言，不直接将参考策略的低置信度等同于错误，而是检查该轮次是否存在多个能获得正向反馈的合理分支，若存在则降低其惩罚权重。这一改进值得测试，因为它能避免模型在多解任务中因过度惩罚而丧失灵活性。首个对照实验可以在具有多解路径的交互基准上，将引入环境反馈修正权重的版本与原 tlm-DRE 对比，观察分布外任务的成功率和输出多样性，以此判断该机制是否有效拓宽了适用边界。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zishuo Zhao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Kai Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ao Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuan Liu\", \"affiliations\": [1], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Alibaba Group\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "随着大语言模型（LLM）的快速发展，由 LLM 增强的智能体系统在处理复杂任务方面展现出巨大潜力，特别是涉及多步思考或工具交互的任务。为了将 LLM 技术应用于设计良好的智能体范式，在多智能体场景下对 LLM 进行后训练是提升性能的必要条件。在多种后训练技术中，诸如 PPO、DPO、DIL 和 GRPO 等对齐方法变得流行，因为许多研究表明，在保持可接受的训练复杂度的同时，通过惩罚负样本能对模型性能产生显著的积极影响。然而，大多数对齐方法针对的是简单的单轮任务，在处理复杂的多轮任务时仍有改进空间。我们提出了 Turn-level Multiscale Density Ratio Estimation (tlm-DRE)，该方法在相应的轮次上分配不同的权重，并基于任务多轮交互中的正负样本空间差距，提出了一种非对称的词元级训练方法。在广泛的智能体评测基准上的实验结果表明，与传统对齐方法相比，所提出的方法表现出竞争力。所提出的训练方法使得 LLM 在多轮推理任务中，无论是在领域内还是领域外条件下，均能保持稳健的表现。"}, {"title": "Coaching Qwen3 Coder 30B to Think Like a CodeClash Arena Agent", "arxiv_id": "2609.16096", "authors": "Ivy Ning Zhang", "summary": "Large language model coding agents have recently become useful for software tasks, but weaker or open-weight agents still struggle to reliably interpret user intent and execute complex multi-step workflows. This gap is especially visible in long-horizon settings, where an agent must repeatedly inspect prior outcomes, diagnose failure, and choose the next code edit under interaction constraints. It motivates a natural question: what can we do to improve the thinking process of a weak code agent? We study this question in CodeClash, a code-arena benchmark where the original work evaluates 8 commercial coding agents across 6 arenas through multi-round tournaments. Since Qwen3 Coder Plus ranks last among them, we take the open-weight Qwen3-Coder-30B as a case study and investigate how to improve it with distilled knowledge from stronger agents. Our analysis shows that Qwen3-Coder-30B is not well optimized for arena-style interaction: it frequently produces syntax and protocol-breaking errors and exhibits weak strategic adaptation across rounds. These failures are difficult to correct with vanilla instruction tuning alone, since offline SFT cannot directly verify whether a generated action is valid or beneficial. To address this, we propose ReAct SFT, which rewrites teacher trajectories into explicit [obs][thought][act] chains, and trajectoryquality weighted SFT, which reweights samples to encourage post-edit checking. ReAct SFT substantially improves strategic behavior, and our fine-tuned model outperforms the original Qwen3 Coder Plus in tournament evaluation.", "category": "cs.AI", "cluster": "Tool Use \u0026 Agent Training", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior, Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一种针对弱开源代码智能体的训练与改进方法。论文明确以 LLM coding agent 为研究对象，关注其在长周期多步骤工作流中的失败模式（如无法有效检查先前结果、诊断失败和进行下一步编辑）。通过提出 ReAct SFT 和轨迹质量加权 SFT，将强智能体的轨迹蒸馏为显式的 [obs][thought][act] 链，并鼓励编辑后检查，从而显著提升了弱智能体的策略行为和交互能力。这直接符合筛选标准中“保留”规则：研究 agent training/distillation，且明确指向 Agentic / LLM Agents / Long-Horizon Agents。同时，这也契合重要校准中关于保留“Small Language Model Agents 的 tool-use training/distillation”以及“LLM Agents 的 long-horizon behavior”的要求。论文不涉及被排除的安全、多模态、图技术或纯系统工程问题，属于通过训练方法改进智能体能力的核心研究范畴。", "intro_logic": "### § 1 研究问题与重要性\n论文研究如何改进较弱的开放权重代码智能体在长周期、多轮交互竞技编程环境中的决策能力。现有的开源模型在多步工作流中常难以准确理解用户意图，且在反复检查结果和诊断失败时表现脆弱。解决这一问题能显著提升开源模型在复杂软件工程任务中的可靠性与实际部署价值，弥补单次代码生成与真实多轮交互之间的能力鸿沟。\n\n### § 2 前人工作与不足\n针对代码智能体的评测，前人提出了HumanEval和SWE-bench等基准，主要关注单次代码生成或单仓库问题修复；InterCode等交互式基准虽引入执行反馈，但仍未覆盖长周期竞争压力下的多轮策略适应。在训练方法上，传统的指令微调能让模型模仿强智能体回复的表面格式，但无法教会模型在反馈下进行深度的“观察-推理-行动”循环。由于离线微调无法直接验证生成动作的协议合法性与策略有效性，模型在竞技环境中极易因语法错误或盲目修改而崩溃。", "core_insight": "### § 3 重建作者的思考路径\n作者观察到开源弱模型在长周期代码竞技场中表现不佳，频繁出错且不善于利用反馈。他们发现普通的指令微调只能让模型模仿表面格式，无法学会在多轮交互中根据反馈调整策略，直接用强模型轨迹做微调甚至会导致行为漂移。既然问题在于模型没学到深层的“观察-推理-行动”循环，作者自然想到：若将强模型轨迹显式重写为结构化的 `[Obs][Thought][Act]` 格式，就能把隐含的决策过程暴露出来供弱模型学习。同时，为抑制盲目修改导致的崩溃，可对遵循“修改后检查”的安全轨迹增加权重。\n\n### § 4 核心直觉\n普通微调让模型只学会生成看似合理的代码，却没学会在失败后如何诊断和调整。这篇论文的核心直觉是：将强模型的隐性决策过程显式拆解为“观察反馈、思考策略、执行动作”的结构化链条，迫使弱模型在模仿动作的同时学会根据环境反馈进行推理。这种结构化监督比单纯模仿表面格式更能传递长周期任务中的竞争性策略。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[教师轨迹]                 [自博弈轨迹]\n(Claude Sonnet 4.5等)      (Qwen3-Coder-30B)\n      |                          |\n      v                          v\n+-------------------+     +------------------+\n| ReAct SFT 重写    |     | Vanilla SFT 基线 |\n| -\u003E [Obs][Thought] |     +------------------+\n|    [Act] 结构     |             |\n+-------------------+             |\n      |                           |\n      |   +-----------------------+\n      v   v                       \n+-------------------+     +------------------+\n| TQ-SFT 质量打分   |----\u003E| QLoRA 微调       |\n| (修改-检查权重)   |     | (4-bit, r=16)    |\n+-------------------+     +------------------+\n                                |\n                                v\n                       [微调后 Qwen3-30B]\n                                |\n                                v\n                       [BattleSnake 评测]\n```\n\n本文的 Pipeline 包含数据准备、监督信号构建和微调评测三个阶段。首先，研究收集了强模型（如 Claude Sonnet 4.5）在 CodeClash 中的交互轨迹作为教师数据，同时收集 Qwen3-Coder-30B 的自博弈数据作为基线（§4.1, §5.2）。\n\n针对 ReAct SFT，系统使用 Claude Sonnet 4.5 API 将教师轨迹中的非结构化 `THOUGHT` 重写为显式的 `[Obs][Thought][Act]` 格式。此过程保留原始 bash 命令，仅重构推理部分，使模型的观察-推理-行动决策链更加明确（§4.2）。对于 TQ-SFT，系统从教师轨迹中提取行为类别（如修改、检查、提交），计算启发式轨迹质量分数，奖励“先修改后检查”的安全行为并惩罚盲目修改，最终转化为样本权重（§4.3）。\n\n在微调阶段，研究采用 QLoRA（4-bit 量化，LoRA rank=16）在长上下文滑动窗口上训练 Qwen3-Coder-30B。训练仅在 assistant token 上计算损失，以专注于优化 agent 的输出能力（§4.1）。最终，微调模型在 CodeClash BattleSnake 竞技场中通过多轮锦标赛进行评测，比较胜率与可靠性指标（§5.3）。\n\n### § 6 核心数学推导\n\n本文的数学推导主要涉及两个损失函数的定义。首先是 **Assistant-only SFT 损失**：这是标准的语言模型交叉熵损失，但计算范围被限制在 assistant 生成的 token 集合 $Y$ 内。其直觉在于，模型只需学习生成 agent 的响应部分，而屏蔽 system 和 user 的 token，避免模型在记忆用户输入上浪费容量。\n\n其次是 **TQ-SFT 加权损失**：该损失在标准 SFT 损失的基础上，为每个样本 $i$ 乘以一个权重 $w_i$。权重由轨迹质量分数 $q_i$ 转化而来，直觉是让遵循“安全编辑-验证-提交”模式的轨迹在优化中贡献更大，而盲目修改的轨迹被降权。这通过损失函数的尺度调整，引导模型学习更可靠的交互行为（§4.3）。\n\n### § 7 实验设计与结论\n\n**问题**：如何改进弱开源代码 agent（Qwen3-Coder-30B）在长周期竞技场环境中的交互和策略能力？\n\n**实验**：在 CodeClash BattleSnake 竞技场中，研究比较了基线模型、Vanilla SFT、ReAct SFT 和 TQ-SFT 的表现。通过多轮锦标赛评估胜率，并追踪无效提交等可靠性指标（§5）。\n\n**答案**：\n1. Vanilla SFT 虽然能学到表面格式，但无法可靠提升策略，甚至因行为漂移增加失败风险。\n2. ReAct SFT 通过显式结构化推理过程，显著提升了模型的竞技行为和胜率，最终模型超越了原版 Qwen3 Coder Plus。\n3. TQ-SFT 主要提高了可靠性（减少无效提交），但在直接竞技中表现不如 ReAct SFT，说明仅靠可靠性过滤不足以提升策略能力。", "additional_insights": "### § 8 阅读收获\n普通的指令微调只能让弱模型模仿表面格式，无法学到长周期交互的深层决策循环，甚至因行为漂移增加崩溃率。将强模型轨迹改写为显式的 `[Obs][Thought][Act]` 结构（ReAct SFT），能有效传递基于反馈的策略推理，显著提升弱模型在多轮代码竞技场中的胜率。而基于轨迹质量的加权微调（TQ-SFT）虽能降低无效提交率，但只能让模型更谨慎，无法教会策略性适应。\n\n### § 9 最脆弱的假设\nReAct SFT 的核心假设是：将强模型轨迹改写为显式的 `[Obs][Thought][Act]` 文本结构，是驱动弱模型策略改进的关键。该假设可能不成立，因为弱模型提升或许仅源于训练数据中强模型 bash 命令分布的变化（如更频繁的日志检查），而非结构化推理文本。论文未彻底剥离“结构化文本”与“强模型动作分布”这两个变量。若此假设不成立，结构化监督的核心贡献将直接失效。\n\n### § 10 最小复现实验\n若有 1 周时间，可验证 ReAct SFT 中“显式结构”是否比“仅用强模型原始轨迹”更有效。使用约 150 条 Claude Sonnet 4.5 的轨迹，分两组微调 Qwen3 Coder 30B：A 组直接用原始轨迹做普通 SFT，B 组用改写后的 `[Obs][Thought][Act]` 轨迹做 ReAct SFT，两组保留相同 bash 命令与 4-turn 窗口。在竞技场中对战 1000 局，测量非平局胜率。若 B 组胜率显著高于 A 组则支持原结论；若无显著差异则说明动作分布才是关键，结构化改写并非必要。", "research_value": "### § 11 最强反例设计\nReAct SFT 的胜率提升可能仅在不严格限制延迟的环境中成立。显式生成 `[Thought]` 会增加输出 token 数量，在真实竞技编程的严格时间约束下，这种推理开销可能导致模型频繁超时或动作截断。为检验此失败条件，可在 BattleSnake 中引入严格的每回合生成时间上限与延迟惩罚，比较 ReAct SFT 与 Vanilla SFT 的超时率与胜率。若 ReAct SFT 在此约束下超时率激增且胜率显著低于 Vanilla SFT，则证明该方法在时间敏感场景中失效，其原有效果依赖于宽松的评测设置。\n\n### § 12 后续研究设想\nReAct SFT 依赖离线蒸馏推理结构，但未验证弱模型在自回归生成时能否维持推理质量。后续可研究：弱模型自生成的错误 `[Thought]` 是否会引发误差累积，导致后续 `[Act]` 比无推理直连时崩溃更严重？这值得测试，因为若错误推理会污染动作，离线模仿格式便不足以支撑真实部署。首个对照实验可在竞技场比较三种模式：自由生成推理与动作、截断推理仅保留动作、向推理注入错误诊断后生成动作。若注入错误推理的模式胜率显著劣于无推理模式，则说明弱模型缺乏推理纠错能力，离线蒸馏的适用边界受限。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Ivy Ning Zhang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Stanford University\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "大语言模型编程智能体近期在软件任务中已展现出实用性，但较弱或开源权重的智能体在可靠理解用户意图和执行复杂多步工作流方面仍面临困难。这种差距在长程任务设置（long-horizon settings）中尤为明显，在此类设置下，智能体必须在交互约束中反复检查先前结果、诊断失败原因并选择下一步代码编辑。这引出了一个自然的问题：我们能做些什么来改善较弱编程智能体的思考过程？我们在 CodeClash 这一代码竞技场评测基准中研究了该问题，原始工作曾通过多轮锦标赛在6个竞技场中评估了8个商业编程智能体。由于 Qwen3 Coder Plus 在其中排名垫底，我们将开源权重的 Qwen3-Coder-30B 作为案例研究，探讨如何利用从更强智能体中蒸馏出的知识来改进它。我们的分析表明，Qwen3-Coder-30B 并未针对竞技场式交互进行良好优化：它频繁产生语法和破坏协议的错误，且在跨轮次中表现出较弱的策略适应性。仅靠原始指令微调（vanilla instruction tuning）难以纠正这些失败，因为离线监督微调（SFT）无法直接验证生成的动作是否有效或有益。为解决此问题，我们提出了 ReAct SFT，该方法将教师轨迹重写为显式的 [obs][thought][act] 链；同时提出了轨迹质量加权监督微调（trajectory-quality weighted SFT），通过对样本重新加权来鼓励编辑后检查。ReAct SFT 显著改善了策略行为，且我们微调后的模型在锦标赛评估中超越了原始的 Qwen3 Coder Plus。"}]}, {"name": "Agent Evaluation \u0026 Benchmarks", "count": 2, "papers": [{"title": "Skill-based Agentic Evaluation for Real-time Data Science Tasks", "arxiv_id": "2609.16487", "authors": "Aniruddha Tamhane, Raghavendra Addanki, Ayushi Aggarwal, Aditya Bansal, Rui Wang, Charles Menguy, Swati Jain", "summary": "We present a framework for evaluating data-science agents on live, continuously updated data using executable ground truth and format-agnostic factoid scoring. Consider this example query: \"what were last week's audience sizes\"---the reference answer changes as the underlying data changes, so static references become outdated and standard LLM-as-a-judge pipelines cannot verify responses against a fixed ground truth. Our central contribution, ground-truth-as-code, encodes each expected answer as an executable reference function that recomputes the answer directly from live data at evaluation time, ensuring the reference remains consistent with the system it describes. We combine this with a factoid-level, format-agnostic judge that decomposes both the agent's response and the computed ground truth into atomic claims and scores precision, recall, and accuracy over them, irrespective of the response format (prose, list, table, HTML, etc.). The approach is applicable to agents whose expected outputs can be expressed as executable data computations. We validate the framework through a human--LLM agreement study on an internally developed machine learning skill deployed in production, using a synthetic database constructed to reproduce production schemas and entity relationships. Relative to a natural-language ground-truth baseline, our method achieves a 29% improvement in the Matthews Correlation Coefficient (MCC)---a class-balanced measure of agreement between expert annotators and LLM-as-a-judge predictions---and a 16% reduction in token consumption per test case, while a self-directed baseline lacking explicit ground truth is anti-correlated with human judgment. Agents that perform multi-source data integration and computation over non-stationary data are routinely deployed in industry; we propose ground-truth-as-code as a practical methodology for their evaluation.", "category": "cs.AI", "cluster": "Agent Evaluation \u0026 Benchmarks", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决的核心问题是：如何评估输出依赖实时、持续更新数据的 data-science agents。这类 agent 在工业界广泛用于多源数据集成与非平稳数据上的多步分析，但其价值所在——操作不断变化的活数据——恰好违背了现有 benchmark 与 LLM-as-a-judge 流水线所依赖的时间不变性假设。以\"上周受众规模\"为例，正确答案随底层数据入库而变化，任何在标注时写定的静态参考答案在评测时即已过时，无法作为可信对照。Chen et al. [2026a] 的并发综述已将\"缺乏时变 ground truth\"列为该领域首要开放挑战，因此提出一种能在数据漂移下仍保持一致的参考答案构造方式，具有直接的工程价值。\n\n### § 2 前人工作与不足\n\n执行式 ground truth 的先例来自 text-to-SQL 评测：WikiSQL、Spider、BIRD 通过执行生成的 SQL 并比较输出来衡量正确性，确立了\"以可观察效果度量代码正确性\"的范式。但它们局限于单一 SQL 查询与确定性表格输出，无法泛化到 data science agent 的任意 Python 计算与非结构化自然语言响应；其 ground truth 仍为预编译查询，未设计在评测时刻重新连接实时数据系统并重算答案的机制。LLM-as-a-judge 与 factoid 级评测（FActScore、SAFE、RAGAS）则将自由文本分解为原子事实逐一评分，但它们假设静态文档语料、依赖检索上下文作为显式输入，既无机制处理需通过 API 调用或代码执行而非文档检索来产生答案的 agent，也无法在 production schema 演变时重新执行 ground truth。两类工作的共同缺口正是论文所填补的：将执行准确性哲学从 SQL 推广到任意 Python 计算，并使参考答案在评测时刻对活数据重新执行，从而天然抗漂移。", "core_insight": "### § 3 重建作者的思考路径\n\n数据科学智能体在持续更新的实时数据上运行，但现有评测基准和 LLM-as-a-judge 管道都假设参考答案时间不变——数据一变，静态参考就过时了。text-to-SQL 领域早已用执行准确度替代字符串匹配（WikiSQL、Spider、BIRD），通过执行生成代码并比较输出来判断正确性，证明代码正确性最好通过其可观察效果来衡量。同时，FActScore 等工作已证明可将自由文本分解为原子声明并独立评分。然而 RAGAS、ARES 等框架假设静态文档语料库，LiveBench 虽动态刷新问题却保留固定验证逻辑，都无法处理需要在实时数据系统上重新计算的参考答案。作者可能由此推论：既然实时数据的参考答案本质是计算而非静态事实，就应编码为可执行函数在评估时重新运行；既然响应格式多样但底层事实相同，就应在原子声明级别比较，使评分与格式无关。\n\n### § 4 核心直觉\n\n实时数据的正确答案本质是一次计算而非固定文本，所以把参考答案写成代码、在评估时刻对实时数据重新执行，就能天然抵抗数据漂移。智能体可能用散文、表格或列表表达相同事实，所以把双方都拆成原子声明再逐条匹配，评分就与格式无关，幻觉和遗漏也直接可归因。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n      测试用例 τi = (Ui, Gi, E, C)\n      ┌─────────┴─────────┐\n      ▼                   ▼\n  运行 Skill S          执行 Gi\n  (agentic harness)     (实时数据)\n      │                   │\n      ▼                   ▼\n    响应 ri              GT 输出 gi\n      │                   │\n      ▼                   ▼\n  提取 Factoids        提取 Factoids\n    Fr (无条件)         Fg|Ui (条件化)\n      │                   │\n      └─────────┬─────────┘\n                ▼\n      一对一二值匹配 → Frg\n                │\n                ▼\n   P=|Frg|/|Fr|  R=|Frg|/|Fg|\n   A + Coverage/Tone/Conciseness\n                │\n                ▼\n     Per-test-case Scorecard\n```\n\n论文框架的核心矛盾是：实时数据持续变化，静态参考答案必然过时。pipeline 在评测时刻并行执行两条路径——一条运行被测 agent，一条执行 ground-truth 代码——然后对两者的输出做原子事实匹配。具体步骤如下：\n\n1. **构建测试用例**：每个用例 τi = (Ui, Gi, E, C)，其中 Ui 为用户查询，Gi 为 ground-truth-as-code 函数，E 为环境变量（业务上下文、共存 skill），C 为计算变量（凭证、超时、API 端点）。参考答案从不预先计算或存储（§3.1）。\n\n2. **并行执行**：agentic harness 同时运行被测 skill S 产生响应 ri，并执行 Gi 连接实时数据系统拉取当前数据计算 ground truth gi。因为 ri 和 gi 来自同一数据状态，参考天然抗数据漂移；Gi 作为普通代码随测试集版本管理，具备与生产代码相同的可审计性（§3.2）。\n\n3. **Factoid 分解**：LLM judge 将 ri 无条件分解为原子声明集合 Fr——任何多余声明本身就是可评分信号；将 gi 以 Ui 为条件分解为 Fg，只保留与查询相关的 factoid。提取过程与响应格式无关，无论 prose、表格还是 HTML，Fr 包含相同的原子声明（§3.3）。\n\n4. **一对一匹配**：harness 对 Fr 和 Fg 做二值匹配得 Frg，每个 factoid 要么精确匹配一个对方 factoid，要么不匹配，无部分得分。未匹配的响应 factoid 为幻觉（Fr\\Frg），未匹配的 GT factoid 为遗漏（Fg\\Frg）（§3.4）。\n\n5. **指标计算**：precision = |Frg|/|Fr|（低值指示幻觉），recall = |Frg|/|Fg|（低值指示遗漏），accuracy 衡量整体事实准确率。另由 rubric 引导的 LLM judge 评分三个定性维度——Question Coverage、Tone、Conciseness。所有指标统一线性映射到 0–9 分（§3.5）。\n\n### § 6 核心数学推导\n\n论文数学部分较为简洁，核心是 factoid 级评测指标的定义。Factoid 是可独立判定真伪的最小信息单元。设 Φ(·) 将字符串映射为原子声明集合，对响应无条件提取 Fr = Φ(ri)，对 ground truth 以查询为条件提取 Fg = Φ(gi | Ui)。条件化确保只保留与查询相关的 factoid，避免无关事实干扰 recall 计算。\n\n匹配后得 Frg，precision 衡量 agent 陈述事实中正确的比例，recall 衡量期望事实被覆盖的比例。两个指标直接对应失败模式：precision 低意味着编造不存在的事实（hallucination），recall 低意味着遗漏关键事实（omission）。scorecard 直接记录 Fr\\Frg 和 Fg\\Frg 的原文，使每个扣分可追溯到具体声明，指标具备可解释性。\n\n### § 7 实验设计与结论\n\n论文验证的核心问题是：ground-truth-as-code 是否比自然语言 ground truth 或无显式 ground truth 的方案更接近人类专家判断，且评测成本更低？\n\n实验在一个内部 ML skill 上构建 55 个单轮测试用例，覆盖 ML 目标识别和数据集发现两个子任务，使用合成数据库模拟生产数据的 schema、实体关系和时间推进结构。三位领域专家独立对每个响应打分，计算 LLM judge 与人类标注的 MCC（Matthews Correlation Coefficient，一种对类别不平衡鲁棒的二分类一致性度量）。同时设置两个对照：Baseline-1 不提供任何 ground truth（让 harness 自行推断正确性标准），Baseline-2 提供等价的自然语言 ground truth 说明。\n\n三条核心发现如下。第一，GT-as-code 的 MCC 为 0.427，比 NL GT 的 0.331 高 29%，且 recall 达到 1.0，说明可执行参考能完整覆盖期望事实。第二，No GT baseline 的 MCC 为 −0.379，与人类判断反相关——它只检查 skill 自己声明的 final checks，从不独立访问实时数据计算参考，因此无法发现 skill 自身的错误。第三，GT-as-code 的 token 成本约 24.6k/TC，比 NL GT 低 16%，比 No GT 的 ~70k 大幅降低，因为确定性代码执行比让 LLM 自行推断检查计划更高效。", "additional_insights": "### § 8 阅读收获\n\n论文解决实时数据下智能体评估的真值漂移问题：将预期答案编码为可执行 Python 函数，评估时从实时数据重新计算，使真值随数据同步更新。配合原子事实分解评分，将响应与真值拆分为可独立验证的原子声明后计算精确率、召回率和准确率，将事实正确性与响应格式解耦。可执行真值相比自然语言真值基线 MCC 提升 29%、token 消耗降低 16%，无显式真值的自评基线则与人类判断负相关。\n\n### § 9 最脆弱的假设\n\n最关键的假设是 ground-truth-as-code 函数 Gi 对用户请求隐含的所有子查询都能生成正确且完整的参考数据。若 Gi 遗漏子查询或计算错误，原子事实指标会系统性误判智能体——不是偏差而是根本性失效。实际中用户查询常含歧义，Gi 只编码一种解读；论文承认此假设但未提供独立验证，仅报告标注者间一致性（Gwet's AC2），后者衡量标注者共识而非真值本身的正确性。\n\n### § 10 最小复现实验\n\n用小型静态数据库构造 10–15 个查询，每个查询同时编写 Python 真值函数和自然语言真值描述。让 LLM 智能体回答后，分别用两种真值驱动 LLM 评判器做原子事实提取与匹配，并请 2–3 名专家独立评分。测量两种方式下评判结果与人类评分的 MCC 及每用例 token 消耗。可执行真值 MCC 显著更高且 token 更少则支持核心 claim，反之则反驳。此方案保留真值编码方式和原子事实评分机制，仅以静态数据替代实时数据，检验方法有效性而非抗漂移能力。", "research_value": "### § 11 最强反例设计\n\n最有力的攻击针对一个论文未验证的条件：当用户查询本身允许多种合理解读时，单一 ground-truth 函数会系统性地误判正确回答。考虑\"哪些数据集适合做用户流失预测\"这类判断性查询——Gi 编码一种基于固定规则的选择逻辑（如含 churn 列且样本量超阈值），但一个合理 agent 可能从数据分布、缺失模式或时间覆盖等不同维度推荐不同数据集。此时 recall 惩罚 agent 遗漏 Gi 选中的集合，precision 惩罚它推荐 Gi 未选中的集合，而 agent 的回答可能同样正确。论文实验仅覆盖 ML 目标识别和数据集发现两个事实型子任务，恰好回避了这类歧义场景。可构造 20 个判断型查询，让 3 位专家各自独立列出合理答案集合，若专家间答案重叠度低于 60% 而 GT-as-code 仍按单一参考评分，则 MCC 会可预测地低于事实型查询组，揭示方法的适用边界而非偶然失败。\n\n### § 12 后续研究设想\n\n关键局限在于 ground-truth 函数的编写依赖测试设计者对查询意图的单一解读，而真实用户查询的歧义程度未知。值得测试的问题是：查询歧义程度是否可预测地降低 GT-as-code 与人类判断的一致性？具体做法是按歧义度将查询分为高、低两组——低歧义组有唯一确定答案，高歧义组经多位专家确认存在多种合理解读——分别计算两组的 MCC。首个对照实验用 30 个查询，每组 15 个，保持 pipeline 其余部分不变。若高歧义组 MCC 显著低于低歧义组，说明方法需要引入多参考函数或歧义感知的评分调整；若两组无显著差异，则单一参考函数的适用范围比预期更广。此提议区别于已有工作之处在于：不修改 Gi 本身，而是量化查询属性对评测有效性的影响，为方法的部署边界提供经验依据。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Aniruddha Tamhane\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Raghavendra Addanki\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ayushi Aggarwal\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Aditya Bansal\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Rui Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Charles Menguy\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Swati Jain\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Adobe\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "我们提出了一个框架，用于在实时、持续更新的数据上评估数据科学智能体，该框架使用可执行的真实基准和与格式无关的事实性评分。考虑这样一个示例查询：“上周的受众规模是多少”——参考答案会随着底层数据的变化而改变，因此静态参考会变得过时，而标准的大语言模型作为评判者（LLM-as-a-judge）流水线无法根据固定的真实基准来验证响应。我们的核心贡献是“真实基准即代码（ground-truth-as-code）”，它将每个预期答案编码为一个可执行参考函数，在评估时直接从实时数据中重新计算答案，确保参考与它所描述的系统保持一致。我们将此与一个事实层面、与格式无关的评判器相结合，该评判器将智能体的响应和计算出的真实基准都分解为原子声明，并在此基础上计算精确率、召回率和准确率，而无论响应采用何种格式（文本、列表、表格、HTML等）。该方法适用于其预期输出可以表示为可执行数据计算的智能体。我们通过一项人机一致性研究验证了该框架，该研究针对一个部署在生产环境中的内部开发机器学习技能，并使用了一个为重现生产模式和实体关系而构建的合成数据库。相对于自然语言真实基准基线，我们的方法在马修斯相关系数（MCC）上实现了29%的提升——MCC是一种衡量专家标注者与LLM-as-a-judge预测之间一致性的类别平衡度量——并且每个测试用例的词元消耗减少了16%，而缺乏明确真实基准的自导向基线则与人类判断呈负相关。在非平稳数据上执行多源数据集成和计算的智能体在工业界被常规部署；我们提出将ground-truth-as-code作为评估它们的实用方法论。"}, {"title": "CADWorld: Computer-Use Benchmark for Long-Horizon Computer-Aided Design", "arxiv_id": "2609.16251", "authors": "Zihan Dong, Yuanzhe Liu, Zhiyuan Ma, Qishi Zhan, Dehan Kong, Guohao Li, Kaixin Li", "summary": "Computer-use agents are increasingly evaluated in realistic desktop environments, but existing benchmarks provide limited coverage of professional engineering workflows whose outputs are persistent, structured artifacts. Mechanical computer-aided design (CAD) is a particularly demanding setting: an agent must manipulate geometry and constraints over long interaction horizons while producing a native project whose dimensions, construction structure, and downstream engineering state remain valid. We introduce \\textbf{CADWorld}, a benchmark for long-horizon computer use in FreeCAD. CADWorld contains 200 tasks spanning 11 mechanical-CAD workflow categories, including sketching, part modeling, assembly, CAM, FEM, measurement, mesh processing, and technical drawing. Agents operate through screenshots and GUI actions, while success is determined by task-specific executable checks over saved FreeCAD artifacts and auxiliary outputs, covering geometric properties, parametric structure, constraints, manufacturing state, and simulation results. Across seven current agents on the full benchmark, the strongest agent achieves 17.5\\% success, compared with an 87.0\\% expert reference pass. We find that weaker agents often fail before producing a valid artifact, whereas stronger agents increasingly fail on structural, geometric, and construction-process requirements. CADWorld therefore exposes a gap between general GUI competence and reliable execution of persistent, verifiable engineering workflows. Project accessible at https://cad-world.github.io.", "category": "cs.AI", "cluster": "Agent Evaluation \u0026 Benchmarks", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了 CADWorld，一个用于评估长期计算机辅助设计（CAD）中计算机使用智能体的基准测试，并详细分析了当前智能体在长期复杂工程工作流中的表现与失败模式。\n\n根据筛选标准第一步，论文的研究对象明确是 Long-Horizon Agents / Computer-Use Agents。虽然它主要是一个评估基准，但摘要中明确指出了其行为分析和失败机制诊断的价值（例如发现较弱智能体通常在产生有效工件前失败，而较强智能体越来越多地在结构、几何和构建过程要求上失败）。这些结论直接帮助理解智能体在长期决策和 GUI 交互中的能力边界与局限性，符合“保留”规则中关于“即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留”的条件。\n\n此外，根据重要校准规则，“不要只因为论文是 benchmark、evaluation、behavior analysis 就排除。只要标题和摘要明确围绕 LLM Agents / Agentic AI 展开，就应返回 True”。该论文聚焦于长期智能体的评估，虽然应用场景在 CAD 领域，但其本质是研究智能体在长期、持久且可验证的任务中的执行能力，属于 Agentic AI 的核心研究范畴，而非单纯的非演化型领域应用。因此，该论文符合您的研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n论文研究通用计算机使用代理能否通过图形界面完成长时程机械CAD工作流，并产出持久、可验证的原生工程工件。这一问题重要是因为CAD的图形界面不是可替代的命令前端，而是工程师表达和操作几何约束、特征树、装配关系等工程状态的主要媒介。现有代理评测多聚焦网页导航或通用桌面任务，而专业工程工作流要求代理同时维持空间精度、数值约束和下游有效性，这些能力在静态问答或表单测试中无法暴露。\n\n### § 2 前人工作与不足\n\n相关工作分两类。通用计算机使用基准如OSWorld和Agents' Last Exam虽包含少量CAD任务，但未系统覆盖草图、参数化建模、装配、CAM、FEM等机械CAD知识谱系，无法评估长时程工程语义维持能力。CAD领域基准如DeepCAD、Text2CAD、CADBench则从几何或程序表示出发，评估的是生成的CAD代码或命令序列，而非代理通过GUI操作原始工程环境；修改脚本并重新运行与重新打开原生项目、在特征树中直接编辑早期草图或约束有本质区别，后者才是专业CAD实践所要求的工作流连续性。", "core_insight": "### § 3 重建作者的思考路径\n\n作者观察到两条线索的交汇。一方面，OSWorld 等通用计算机使用基准暴露了专业工作流的困难，但 CAD 只占很小比例；另一方面，DeepCAD、Text2CAD 等 CAD 基准评测的是代码或命令序列生成，而非通过 GUI 执行原始工程工作流。关键洞察在于：CAD 的图形界面不是可替换的前端，而是工程状态被表达和操作的主要表示——程序化方法在已有符号规范时有效，却抽象掉了识别工程状态、决定如何修改、验证后果这一交互式工作的核心。因此，要评测代理能否像人类工程师那样通过交互式表示感知、操作和验证工程状态，就需要一个全新的基准。\n\n### § 4 核心直觉\n\nCADWorld 的核心直觉是：CAD 工作流的正确性必须落在持久化的原生工件上，而非视觉相似或生成的代码。代理通过 GUI 操作真实 CAD 环境，产出的 .FCStd 文件必须保持可检查、可测量、可编辑、对后续工程有效。这一要求让通用 GUI 能力与可靠工程执行之间的差距暴露出来——能点击可见控件不等于能维护几何意图、跟踪依赖关系、保持工件有效性。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[任务包] 指令 / 前置文件 / 参考图 / 评测器\n    │\n    ▼\n[环境重置] Docker/QEMU Ubuntu VM + FreeCAD\n    │\n    ▼\n┌─► [截图观测] 桌面截图 + 指令 + 紧凑轨迹历史\n│       │\n│       ▼\n│   [Agent 推理] 输出 pyautogui 动作 / WAIT / DONE / FAIL\n│       │\n│       ▼\n│   [动作执行] VM 内 GUI 操作（鼠标/键盘/快捷键）\n│       │\n└─── ┤ 未终止则继续\n    │\n    ▼ 终止\n[工件提取] 保存的 .FCStd + 辅助输出\n    │\n    ▼\n[主机端评测] 任务特定可执行检查（几何/约束/结构/CAM/FEM）\n    │\n    ▼\n[二元结果 + 11 类失败诊断 + 效率指标]\n```\n\nCADWorld 的 pipeline 围绕\"持久工件评测\"展开，区分推理与评测两个阶段：\n\n- **任务打包**：每个任务由自然语言指令、可选前置 CAD 文件、参考资源、设置配置和任务特定评测器组成，对应正文 § 3 与图 2。\n- **环境重置**：运行器通过 Docker/QEMU 启动预建 Ubuntu VM，上传任务资源、清除陈旧输出并打开初始 FreeCAD 状态，保证可复现（§ 4.1）。\n- **Agent 交互循环（推理）**：每步接收桌面截图、指令和最近 10 轮紧凑轨迹，模型输出经清洗的 pyautogui 动作或控制令牌（WAIT/DONE/FAIL），在 VM 内执行；每任务上限 100 步。该接口刻意排除直接脚本与文件系统访问，使交互贴近人类 CAD 使用（§ 3，附录 D，表 4）。\n- **工件提取与评测**：终止后下载保存的 .FCStd 及辅助输出，主机端评测器按工作流类型检查草图实体与约束、特征属性、几何量、CAM 路径、FEM 结果等，全部检查通过才记成功，无部分分（§ 3，表 3）。\n- **诊断与报告**：结合评测证据、终止状态与轨迹，将失败归入 11 类确定性原因（如无输出文件、文档结构错误、几何超差、构建过程错误），输出二元分数、效率指标与诊断报告，无需 LLM 裁判或人工检查（§ 3，图 4，表 7）。\n\n### § 7 实验设计与结论\n\n**问题一：当前通用计算机使用 agent 能否可靠执行持久、可验证的机械 CAD 工作流？** 作者在全部 200 个任务上评测 7 个当代 agent，与人类专家参照轨迹对比，并按 11 个工作流类别和 11 类失败原因分解结果。答案是否定的：最强 agent GPT5.4 仅 17.5% 成功率，人类专家为 87.0%。更关键的是失败模式的分层——弱 agent（Qwen3.6、MiniMax M3、Holo 3.1、OpenCUA）平均 85–101 步却几乎全部失败，常陷入\"死亡循环\"，反复点击同一坐标而不改变策略，导致无输出文件；强 agent 更多逃出早期循环并保存了可读工件，但失败下移到文档结构、几何和构建过程层面，例如选错工作台、草图欠约束、尺寸填入错误字段、生成视觉相似但语义错误的几何。CAM、FEM 和 TechDraw 三类任务所有模型均为 0%，可能因为这些工作流中间状态可见性低且公开教程稀少，但作者明确将此列为可能的解释而非因果定论。\n\n**问题二：终端脚本方式能否完成这些任务，计算机使用工具是否显著提升性能？** 作者在 50 个类别分层任务上做消融，比较终端 agent 与 GUI agent，并比较 GPT5.4 有无 CUA harness。结果显示终端 agent 成功率相近，但主要失败于\"错误文档结构\"——脚本构建使工程师无法在 GUI 中回溯编辑先前特征，违背了原生可编辑性要求；而 GPT5.4 去掉 harness 后完成率为 0%，加上 harness 后达 17.5%，表明 GUI 交互框架对当前模型不可或缺。这两项发现共同支撑了论文的核心主张：专业 CAD 自动化的瓶颈不仅在视觉定位与长时程控制，更在于能否在整个演化工作流中保持工程语义并产出可重开、可检查、可修复的持久工件。", "additional_insights": "### § 8 阅读收获\n\nCADWorld 将交互式机械 CAD 建模为计算机使用代理问题：代理必须通过截图与 GUI 操作在 FreeCAD 中完成长流程任务，最终保存的 .FCStd 原生工程文件须经任务级可执行检查通过才算成功，而非仅凭视觉相似度。200 个任务覆盖草图、零件、装配、CAM、FEM 等 11 类工作流，最强代理 GPT5.4 仅获 17.5% 成功率，而人类专家达 87.0%。关键发现是失败模式随能力迁移：弱代理多因无法产出有效文件而早期失败，强代理更多能保存文件却在文档结构、几何精度与建模过程上出错。所有模型在 CAM、FEM 和 TechDraw 上得分为零，表明通用 GUI 能力难以迁移到低曝光的专门工程流程。\n\n### § 9 最脆弱的假设\n\n核心假设是：观察到的失败反映的是工程推理能力的真实缺口，而非代理对 FreeCAD 特定界面约定的不熟悉。若此假设不成立——即 CAM/FEM 零分主要源于 FreeCAD 这些工作台的 UI 模式在训练数据中罕见，而非代理缺乏工程语义维护能力——那么论文\"通用 GUI 能力与工程工作流之间存在独特瓶颈\"这一中心论点将被削弱为\"代理对特定软件不熟练\"。论文自身承认训练语料不可观测，无法将曝光度与推理能力做因果区分，且仅在 FreeCAD 上测试，未在商业 CAD 系统上验证失败模式是否迁移。Table 8 的软件对比仅为定性分析，未提供跨平台对照证据。\n\n### § 10 最小复现实验\n\n选取 15 个任务（草图 5、零件 5、CAM 5），用两个能力差异显著的代理（如一个闭源强模型与一个开源弱模型）经 CADWorld runner 运行，按 F1–F11 分类失败原因。保留原评测器与 .FCStd 检查逻辑不变，仅缩小任务集与模型数。若强代理的早期失败（F1–F4）占比显著低于弱代理，且下游失败（F5–F10）占比显著更高，则支持\"失败随能力向下游迁移\"这一机制性结论；若两者失败分布无系统性差异，则该结论可能仅是任务难度采样的产物而非能力梯度的反映。", "research_value": "### § 11 最强反例设计\n\n论文将 CAM、FEM 和 TechDraw 三类任务全零分归因于代理缺乏工程语义维护能力，但未排除 FreeCAD 这些工作台在训练数据中曝光度极低的替代解释。最强反例是招募熟练使用 SolidWorks 或 CATIA 但不熟悉 FreeCAD 的机械工程师，在 CADWorld 的 CAM 和 FEM 任务上测试。若这些专家的成功率也显著低于他们在熟悉软件上的表现，且失败集中在 UI 定位与操作流程而非工程判断，则零分更可能反映软件特定熟悉度缺口而非通用工程推理瓶颈，论文\"通用 GUI 能力与工程工作流之间存在独特瓶颈\"的中心论点将被大幅削弱。\n\n### § 12 后续研究设想\n\n关键局限是仅在 FreeCAD 单一平台上测试，无法区分工程推理能力与软件特定操作知识。后续研究可选取 20 个跨工作流类别的任务，在 FreeCAD 和 Onshape（网页端 CAD）两个平台上构建等价任务集，用同一批 agent 测试。若同一 agent 在两平台上的失败类别分布高度一致，说明瓶颈在工程语义维护；若分布显著不同，则软件熟悉度是主因。首个对照实验比较两平台失败类别分布的 KL 散度即可初步判断。与已有工作的区别在于：现有基准只测单一软件，此实验首次跨平台分离推理能力与操作熟练度。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zihan Dong\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuanzhe Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhiyuan Ma\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Qishi Zhan\", \"affiliations\": [3, 4], \"markers\": []},\n    {\"name\": \"Dehan Kong\", \"affiliations\": [3, 4], \"markers\": []},\n    {\"name\": \"Guohao Li\", \"affiliations\": [5, 6], \"markers\": []},\n    {\"name\": \"Kaixin Li\", \"affiliations\": [7], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Georgia Institute of Technology\"},\n    {\"id\": 2, \"name\": \"North Carolina State University\"},\n    {\"id\": 3, \"name\": \"Marquette University\"},\n    {\"id\": 4, \"name\": \"Saros Lab\"},\n    {\"id\": 5, \"name\": \"CAMEL-AI\"},\n    {\"id\": 6, \"name\": \"Eigent.AI\"},\n    {\"id\": 7, \"name\": \"National University of Singapore\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "计算机使用智能体越来越多地在真实的桌面环境中接受评估，但现有的评测基准对专业工程工作流的覆盖有限，而这些工作流的产出物是持久化、结构化的。机械计算机辅助设计（CAD）是一个要求极高的场景：智能体必须在长交互周期内操控几何图形和约束，同时生成一个原生项目，且该项目的尺寸、构建结构和下游工程状态必须保持有效。我们引入了 \\textbf{CADWorld}，这是一个用于在 FreeCAD 中进行长周期计算机使用的评测基准。CADWorld 包含 200 个任务，涵盖 11 个机械 CAD 工作流类别，包括草图绘制、零件建模、装配、计算机辅助制造（CAM）、有限元方法（FEM）、测量、网格处理和技术图纸绘制。智能体通过屏幕截图和图形用户界面（GUI）操作进行工作，而任务的成功与否由针对保存的 FreeCAD 产出物和辅助输出的特定可执行检查来决定，这些检查涵盖几何属性、参数化结构、约束、制造状态和仿真结果。在完整评测基准上对当前的七个智能体进行测试，最强的智能体实现了 17.5% 的成功率，而专家参考通过率为 87.0%。我们发现，较弱的智能体通常在生成有效产出物之前就遭遇失败，而较强的智能体则越来越多地在结构、几何和构建过程要求上失败。因此，CADWorld 揭示了通用 GUI 能力与可靠执行持久化、可验证的工程工作流之间的差距。项目访问地址：https://cad-world.github.io。"}]}, {"name": "Interactive \u0026 Multimodal Agents", "count": 2, "papers": [{"title": "Never Stop Thinking: Continuous-Time Language Agents", "arxiv_id": "2609.17416", "authors": "Bojie Li, Noah Shi", "summary": "Voice agents built on LLMs follow a rigid listen-think-speak loop that inserts seconds of dead air before every reply. We show that continuous-time cognition (thinking while listening and thinking while speaking) emerges from an unmodified text model under a lightweight interrupt-and-resume orchestrator, cutting live-pipeline latency by 19% overall and by half in the regime the mechanism targets. To measure whether continuous-time thinking improves what agents accomplish, we introduce ReactiveBench: 120 interactive scenarios scored against pre-registered binary requirements, plus a verifiable streaming track scored by exact correctness. ReactiveBench exposes a pitfall with broad consequences: LLM judges reward visible reasoning; a large judged \"advantage\" of continuous-time thinking reverses sign under an independent judge, and judge-trained models objectively complete fewer requirements when they think. A five-stage training study then locates the right signal at three levels. Its source: verifiable objectives turn thinking from harmful to helpful. Its structure: whatever a uniform reward omits, optimization trades away; brevity everywhere erodes multi-hop tool chaining. Its optimizer: preference optimization can only trade conflicting sub-goals against each other, while on-policy RL over a type-shaped reward improves every correctness axis at once, raising streaming completion from 48% to 73+/-5% across seeds and replicating at larger scale and on a second model. Orchestration makes continuous-time interaction possible; a verifiable signal, correctly sourced, shaped, and optimized, makes it good.", "category": "cs.AI", "cluster": "Interactive \u0026 Multimodal Agents", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=0 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献在于改进LLM智能体的执行机制和训练方法，符合你的研究范围。具体分析如下：\n1. 核心机制与Harness改进：论文提出了一种轻量级的“中断与恢复”编排器，打破了传统LLM智能体僵化的“听-想-说”循环，实现了连续时间认知。这属于智能体运行时和执行环境的改进，且通过反馈和RL训练使得这种编排机制能够自适应优化，完全符合“保留”规则中关于 agent harness / scaffold / runtime 自动演化的要求。\n2. 智能体评估与行为分析：论文引入了 ReactiveBench 来评估智能体在交互场景下的表现，并深入分析了LLM评判者的缺陷以及“可见推理”对智能体完成实际任务（如多跳工具链式调用）的负面影响。这属于对智能体能力边界和失败机制的深刻诊断，符合评估和行为分析保留规则。\n3. 智能体训练与RL：论文进行了五阶段训练研究，探索了如何通过可验证目标和 on-policy RL（基于类型塑造的奖励）来优化智能体的连续时间思考能力，解决了偏好优化在冲突子目标上的权衡问题。这明确属于 agent training / RL 的范畴，且直接提升了智能体的任务完成率。\n4. 不触发排除条件：虽然论文以语音智能体为切入点，但其核心并非单纯的领域应用，而是探讨通用的智能体执行、评估与训练机制；同时，论文中的“编排”指的是单智能体内部认知与行动的执行调度，而非多智能体系统中的拓扑或通信协议，因此不触发多智能体编排的排除规则。", "intro_logic": "### § 1 研究问题与重要性\n\n论文研究如何让基于LLM的语音智能体实现连续时间认知（continuous-time cognition），即在用户说话时就开始推理、在自己说话时继续思考，而非遵循传统的\"听完→静默思考→回复\"循环。传统循环在每次回复前插入数秒死气时间，既社交尴尬，也无法处理打断、工具结果中途返回等动态事件。解决这一问题能将实时语音管线的端到端延迟降低约19%，在早期实体查询场景下降幅达一半，同时让对话具备人类交互中自然的预判与适应能力。\n\n### § 2 前人工作与不足\n\n最相关的一类工作是原生全双工与全模态模型，如Moshi、Qwen-Omni系列、Step-AudioR1.1及Thinking Machines Lab的交互模型，它们通过训练定制化的语音或多模态架构实现了token级低延迟与声学接地。这类系统的不足在于方法本身的限制：每个系统都是专用训练架构，工程与数据成本高昂，且这条路线尚未回答两个开放问题——如何客观衡量交错思考是否真正改善了交互，以及用什么目标函数来训练它。另一类文本流式推理工作（如StreamingThinker、AgileThinker）虽在流式输入上增量推理，但未采用单一连贯推理流加中断驱动认知的统一机制，也未实现零模型修改。更根本的缺口在于评测：现有基准（MultiWOZ、SpokenWOZ、MT-Bench）均不评估中断条件下的交错思考与说话，且依赖LLM评判者的做法被本文证明会产生系统性偏差——评判者奖励可见推理而非更好的口语输出，导致\"连续思考质量优势\"在更换评判者或隐藏思考块时反转甚至消失。", "core_insight": "### § 3 重建作者的思考路径\n\n语音代理卡在\"听-想-说\"循环里，每次回复前有几秒沉默。人类对话是连续的——边听边想、边说边想——已有方案（Moshi、Qwen-Omni）训练专门的全双工架构，成本高且难以评估。关键观察是：模型生成 token 远快于人类说话（每秒数十至上百 token vs 约 3 词），用户说话的时间本质上是免费的计算窗口。思考模型（Qwen3、DeepSeek-R1）已有结构化的 `\u003Cthink\u003E` 块，可以强制关闭并注入新观察后恢复解码——这本质上是更细粒度的多轮推理，不需要修改模型权重、分词器或对话模板。但评估和训练是两个未解决的问题：现有基准不测试中断下的交错思考，而 LLM-as-judge 可能只奖励可见推理过程而非实际输出质量。\n\n### § 4 核心直觉\n\n编排使连续时间交互成为可能，正确的训练信号使其变好。模型生成速度远快于人类说话，用户说话的时间是免费计算窗口；中断-恢复机制利用思考模型已有的 `\u003Cthink\u003E` 块结构，在不修改模型的前提下把环境观察注入推理流。但只有可验证的奖励信号（而非 LLM 评判）才能避免\"思考挤占说话\"的失败模式，且奖励必须显式为每个重要行为定价——遗漏的行为会被优化无声地牺牲掉。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n推理：中断-恢复编排器（~200行，不改权重/词表/模板）\n  ASR片段 · TTS超时 · 异步工具结果 · 用户打断\n       │\n       ▼\n  ① 强制闭合\u003C/think\u003E（KV缓存保留部分推理）\n  ② 注入观测为原生对话轮  ③ 恢复解码\n       │\n       ▼\n  持续推理流 ─ \u003Csay\u003E/工具调用 ─ 流式TTS ─ 用户\n\n训练：五阶段信号谱系（Qwen3-8B）\n  基座\n   ├①判官奖励SFT → ②判官RL ── 思考挤占语音\n   ├③覆盖保持SFT ── 消除语音抑制\n   ├④在策略蒸馏OPD（32B教师·逆向KL）\n   ├⑤拒绝微调（可验证门控筛选轨迹）\n   └⑥在线GRPO（类型条件可验证奖励）→ 发布模型\n\n评测：ReactiveBench\n  赛道A：120场景·688二元清单·双验证器(κ=0.75)\n  赛道B：200流式任务·精确正确性·行为指标\n```\n\n**推理部分**：编排器接收四类环境观测（ASR片段、TTS超时、异步工具结果、用户打断），对未修改的思考模型执行中断-恢复原语——强制闭合当前 `\u003C/think\u003E` 块并将部分推理保留在 KV 缓存中，把观测注入为原生对话轮后恢复解码。模型在单一持续推理流中交替生成思考、`\u003Csay\u003E` 和工具调用 token，输出经流式 TTS 播放给用户。边听边思考（TWL）策略在 ASR 片段到达时反复中断推理；双进程策略让受限的 System 1 立即回复、System 2 在后台继续推理（§2.1，图2）。\n\n**训练部分**：五阶段谱系依次诊断信号的来源、结构和优化器。判官奖励 SFT 与 RL 蒸馏出高效交错思考（思考 token 减少 5–6 倍），但客观上思考挤占语音、完成度下降。覆盖保持 SFT 以\"简短思考但完整口述\"重训，消除语音抑制。在策略蒸馏（OPD）让学生自产生流式轨迹，32B 教师以逐 token 逆向 KL 评分。拒绝微调采样 K=4 条轨迹，仅保留通过可验证门控者做继续训练。最终在线 GRPO 用类型条件可验证奖励处理冲突子目标（§4，图6）。\n\n**评测部分**：ReactiveBench 赛道 A 含 120 个多轮场景和 688 条预注册二元清单项，由两个不同模型族的验证器独立评分（Cohen's κ=0.75），仅从口语输出评分。赛道 B 含 200 个可验证流式任务，按精确正确性评分并记录工具提前量、语音覆盖率等行为指标（§3，图4）。\n\n### § 7 实验设计与结论\n\n**问题1：连续时间思考是否真正改善 agent 完成的内容？** → 用 ReactiveBench 客观清单和精确正确性对比连续模式与基线模式 → LLM 判官显示的\"质量优势\"在独立判官下符号反转、隐藏思考块后大部分消失；客观清单显示判官训练模型在思考时完成的需求反而更少，因为思考挤占了语音（§3.3，图5、图8）。\n\n**问题2：正确的训练信号能否修复这一缺陷？** → 设计覆盖保持 SFT 和五阶段可验证信号谱系 → 覆盖保持 SFT 消除语音抑制并取得最高完成度；在策略蒸馏提升流式正确率，拒绝微调修复轨迹级坏习惯，在线 GRPO 将整体流式完成率从 48% 提升至 73±5%，在多个种子和第二个模型上复现（§5.2–5.4，图10–11）。\n\n**问题3：可验证子目标冲突时优化器如何选择？** → 从同一检查点分别用 DPO 和在线 GRPO 训练 → DPO 只能用多跳工具链准确性换取偏好对齐轴的改善；GRPO 在类型条件奖励上同时改善所有正确性轴（§5.4，图11）。", "additional_insights": "### § 8 阅读收获\n\n连续时间认知不需要新架构：约两百行的 interrupt-and-resume 编排器就能让任何现成 thinking 模型在听和说的同时推理，延迟在 early-entity 场景下减半。LLM judge 作为交互评测不可靠：它奖励可见的推理过程，换一个独立 judge 或隐藏 think block 后，连续模式的\"质量优势\"直接反转或消失。正确的训练信号必须来自可验证目标：judge reward 会让 thinking 挤占 speech，而 type-conditional verifiable reward 配合 on-policy GRPO 能同时提升所有正确性维度，把 streaming completion 从 48% 拉到 73%。\n\n### § 9 最脆弱的假设\n\n最关键的假设是 TWL（think-while-listening）在真实语音管道中能稳定减少延迟。论文的 live-pipeline 证据只有 20 个 episode，且两个条件是从同一生成 trace 按组件耗时拼合的，而非两条独立闭环运行。更根本的是，TWL 在 CPU 速度（低于约 85 tokens/s）下因 interrupt 开销超过隐藏的思考时间反而增加延迟；真实部署中 ASR partial 频繁更新可能放大这一开销。如果实际推理速度不够快或 ASR 更新粒度更细，19% 的整体延迟收益可能蒸发，而延迟是连续时间认知最直观的卖点。\n\n### § 10 最小复现实验\n\n用 Track B 的 early-entity 合成任务（如\"weather in Denver\"式请求，entity 早出、冗长框架在后）和一个纯文本 streaming simulator 即可验证 tool-lead 行为，无需 ASR/TTS。将每条 utterance 按语音速率切成 partial 片段，每个 partial 后执行 interrupt-and-resume：强制闭合 `\u003C/think\u003E`、注入新 turn、恢复解码。用 Qwen3-8B 经 vLLM 服务，测量工具调用是否在 utterance 结束前触发以及提前秒数。若工具在 entity 出现后、utterance 结束前 fire，则支持\"unmodified model 零样本产生 anticipation\"这一核心 claim；若工具只在 utterance 结束后 fire 或 interrupt 导致输出混乱，则反驳该 claim。", "research_value": "### § 11 最强反例设计\n\n最有力的攻击指向 TWL 在真实噪声环境下的稳定性。论文的 live-pipeline 证据仅 20 个 episode 且从同一生成 trace 拼合，而 interrupt-and-resume 的核心前提是 ASR partial 片段足够干净、频率足够低，使中断开销低于隐藏思考节省的时间。在真实开放麦克风场景中，环境噪声、多人重叠语音和 ASR 误识别会产生高频虚假 partial，编排器被迫反复强制闭合 `\u003C/think\u003E` 块并注入错误观测。这不仅放大中断开销使延迟收益蒸发，更可能让模型基于错误 partial 触发不可逆的工具调用（如提前预订错误日期），而论文的 ReactiveBench 赛道 B 只测单轮精确正确性，不评估错误行动的下游代价。若在 SNR 低于 10 dB、多人交替说话的条件下测量，TWL 的工具提前量和完成率可能同时恶化，直接挑战\"零模型修改即可部署\"这一核心卖点。\n\n### § 12 后续研究设想\n\n关键局限在于编排器对 ASR partial 质量的依赖未被系统检验。一个可检验的问题是：interrupt-and-resume 的工具提前量和推理质量如何随 ASR partial 的更新频率与词错误率变化？具体做法是用纯文本流式模拟器控制两个变量——partial 间隔（100ms 至 2s）和插入/替换错误率（0% 至 30%），在 Track B 的 early-entity 任务上测量工具是否仍在 entity 出现后正确触发、以及中断后推理是否保持连贯。对照组为传统听完再回复模式。若高频高错误率下 TWL 的工具提前量趋近于零或误触发率超过 20%，则说明编排器需要 ASR 质量门控才能在真实部署中有效，而非论文声称的即插即用。这与已有工作的区别在于：StreamingThinker 等只评估干净文本流上的增量推理，从未在受控噪声条件下检验中断-恢复机制的鲁棒性边界。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Bojie Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Noah Shi\", \"affiliations\": [2], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Pine AI\"},\n    {\"id\": 2, \"name\": \"University of Washington\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "基于LLM构建的语音智能体遵循刻板的“听-想-说”循环，在每次回复前都会插入数秒的静音。我们表明，在轻量级中断与恢复编排器（interrupt-and-resume orchestrator）的作用下，未经修改的文本模型能够产生连续时间认知（continuous-time cognition，即在听和说的同时进行思考），将实时流水线延迟总体降低19%，并在该机制针对的特定区间内降低一半。为了衡量连续时间思考是否能提升智能体的任务完成度，我们引入了评测基准 ReactiveBench：包含120个根据预先注册的二元要求进行评分的交互场景，外加一个以精确正确性为评分标准的可验证流式处理赛道。ReactiveBench 暴露了一个具有广泛影响的陷阱：LLM评判器会奖励可见的推理过程；连续时间思考在LLM评判下表现出的巨大“优势”，在独立评判器下会发生符号反转（即变为劣势），并且基于评判器训练的模型在进行思考时客观上完成的要求更少。随后，一项五阶段训练研究在三个层面上定位了正确的信号。其来源：可验证的目标将思考从有害转变为有益。其结构：统一奖励所遗漏的任何内容，都会在优化过程中被牺牲；处处追求简短会侵蚀多跳工具链调用。其优化器：偏好优化只能在不同冲突的子目标之间进行权衡，而基于类型塑造奖励（type-shaped reward，即根据特定类型结构设计的奖励）的在线强化学习（on-policy RL）能够同时提升所有正确性维度，将流式完成率在不同随机种子下从48%提升至73±5%，并在更大规模和第二个模型上复现了该结果。编排机制使连续时间交互成为可能；而来源正确、结构合理且优化得当的可验证信号，则使其表现优异。"}, {"title": "OmniHarness: Harnessing Generalizable Visual Generation via Symbolic Policy Learning", "arxiv_id": "2609.16057", "authors": "Xu Xu, Jinxiu Liu, Zhangbo Qiao, Jiaxing Lu, Xiangyu Zhang, Yubin Gu, Fangwei Ning, Yan Shi", "summary": "Unified multimodal large language models (MLLMs) and multi-agent systems have advanced visual generation. However, three limitations remain. (1) Existing methods often distill task-specific experience with limited generalizability. (2) Reflection is often deferred until task completion. (3) Knowledge is often acquired only in response to downstream task demands. To address these limitations, we introduce OmniHarness, a framework for generalizable visual generation via symbolic policy learning. OmniHarness abstracts verified executions into symbolic policies for visual generation task families, capturing shared procedures and applicability conditions while removing instance-specific inputs. The harness instantiates, adapts, and composes these policies for new tasks. Intermediate verification guides refinement and failure recovery during execution. Through self-directed inquiry, OmniHarness autonomously generates and executes practice tasks near its capability limits before downstream objectives are specified. Execution feedback continually refines the policies while model parameters remain fixed. Experiments across six benchmarks, three MLLM backbones, and three visual agent frameworks demonstrate strong performance and continual capability expansion. On ComfyBench's Creative tasks, OmniHarness achieves a 95.0% resolve rate, exceeding the strongest baseline by 27.5 percentage points. Frozen policy snapshots improve existing visual agent systems through plug-and-play reuse.", "category": "cs.AI", "cluster": "Interactive \u0026 Multimodal Agents", "tags": ["cs.AI"], "filter_reason": "这篇论文符合您的研究范围。论文的核心贡献是提出了 OmniHarness 框架，该框架通过符号策略学习、自主探究和执行反馈来不断细化智能体的策略，实现持续的能力扩展。这完全契合您筛选标准中第一步提到的“保留”规则：即研究 agent 的 harness / scaffold / continual harness，并且核心贡献是让这些智能体运行组件通过轨迹、反馈、观测或评估结果自动改进、演化或自适应优化。此外，论文中提到的“执行反馈不断细化策略且模型参数保持固定”以及“自主生成并执行练习任务”属于典型的自我演化和自我完善机制。\n\n虽然论文的应用场景是视觉生成，涉及多模态大语言模型，但根据您的筛选规则，视觉生成只是智能体所处的任务领域，论文的本质贡献是提出了新的智能体 harness 演化与自适应机制。正如规则所述，“领域是场景，机制才是贡献”，且“如果论文的核心是把‘自我演化’机制，应用在特定领域……也应该保留”。因此，该论文应予保留。", "intro_logic": "### § 1 研究问题与重要性\n\n论文要解决的核心问题是：如何让视觉生成系统从个别执行经验中提炼出可跨任务复用的策略，在执行过程中即时发现并修复错误，并在下游任务到来之前就主动学习。这个问题之所以重要，是因为视觉生成正沿两条路径发展——端到端统一多模态大语言模型（MLLMs）依赖大规模训练数据但缺乏显式验证与自纠错能力，而多智能体系统（MAS）虽引入协作推理，却往往保留具体解决方案而未提取任务族共享的通用原则。OmniHarness 通过符号策略学习将已验证的执行抽象为可复用的工作流模板，使系统能在新任务上泛化、在执行中纠错、在需求出现前积累能力，从而显著提升视觉生成的可靠性和可扩展性。\n\n### § 2 前人工作与不足\n\n最相关的两类前人工作分别存在结构性局限。端到端统一 MLLMs（如 Janus-Pro、Emu3）将视觉理解与生成集成于单一架构，但标准推理流程不支持显式的中间验证、失败恢复和持久化工作流复用，面对复杂多步生成任务时难以自我纠错。基于 MLLM 的多智能体系统方面，ComfyAgent 依赖手动定义的 ComfyUI 工作流，ComfyMind 引入了树状规划与反应式反馈但仍将经验绑定于具体案例，SymbOmni 从传入任务中学习符号概念但知识获取完全是被动的——仅在下游任务到达时才触发学习。这些方法的共同不足在于：保留成功执行不等于获得可复用技能，因为个案经验未抽象出任务族共享的程序与适用条件；反思推迟到任务完成后才进行，中间错误会沿工作流传播而无法及时修复；且系统无法在需求出现前主动探索能力边界，导致能力缺口直到执行受阻才暴露。", "core_insight": "### § 3 重建作者的思考路径\n\n作者从视觉生成的两条路径出发：端到端统一 MLLM 依赖大规模训练数据，缺乏显式验证与自纠错；多智能体系统虽引入协作推理，但多依赖手工定义的 ComfyUI 工作流或固定通信拓扑。关键观察是：保留成功执行不等于获得可复用技能——个别案例的解法不揭示任务家族共享的原则，如同\"授人以鱼不授人以渔\"。同时，现有方法在任务完成后才反思，中间错误已传播；且只在下游需求出现时才学知识，能力缺口暴露太晚。这三个失败模式提示：需要从经验中抽象可泛化模式、在执行中即时验证、在任务到来前主动学习。\n\n### § 4 核心直觉\n\n把验证过的执行蒸馏为符号策略——保留任务家族共享的过程和适用条件，去掉实例特定输入——使经验从\"记住一个解\"变成\"掌握一类方法\"。在下游任务到来前，系统自主生成练习任务、探测能力边界，提前积累可复用策略；执行中对每步中间输出做验证和局部修复，不让错误传播到最终结果。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n┌─────────────────────────────────────────────────────┐\n│            自主探究阶段 (下游任务到达前)              │\n│  能力空间G + 场景上下文c + 策略库S=(L,F)             │\n│         │                                            │\n│         ▼                                            │\n│  候选任务生成 → 任务选择 N(τ)·C(τ)                    │\n│         │                                            │\n│         ▼                                            │\n│  ┌─ 反馈引导执行 ─────────────────────┐              │\n│  │ 规划器 → 计划验证 → 工作流编写      │              │\n│  │   → 编译 → 执行 → 中间验证          │              │\n│  │     ↙ 失败? ↘                      │              │\n│  │  局部修复    成功                   │              │\n│  └────────────────────────────────────┘              │\n│         │                                            │\n│    ┌────┴────┐                                       │\n│    ▼         ▼                                       │\n│  策略库L    失败库F    ← 蒸馏/记录                    │\n│    │         │                                       │\n│    ▼         ▼                                       │\n│  导出冻结快照 K_inquiry (供即插即用)                  │\n└─────────────────────────────────────────────────────┘\n          │\n          ▼\n┌─────────────────────────────────────────────────────┐\n│            下游执行阶段                               │\n│  外部任务指令 → 同一反馈引导执行流程                   │\n│  → 策略库持续更新 (模型参数固定)                      │\n│  → 输出结果                                          │\n└─────────────────────────────────────────────────────┘\n```\n\nOmniHarness 的完整流程分为自主探究和下游执行两个阶段，核心回路是\"选任务→执行→验证→蒸馏策略\"。\n\n**自主探究阶段**在下游任务到达之前运行（§3.1, Algorithm 1）。系统维护一个策略库状态 $S_t = (L_t, F_t)$，其中 $L_t$ 存储可复用的工作流模板，$F_t$ 存储失败证据和纠正策略。每轮迭代中，提议器根据能力空间 $G$、场景上下文 $c_t$ 和策略库状态生成候选练习任务，再通过能力新颖度 $N(\\tau)$ 与能力前沿分数 $C(\\tau)$ 的乘积选出下一个任务。选出的任务进入反馈引导执行。\n\n**反馈引导执行**是系统的核心执行引擎（§3.2, §A.1.3）。规划器将任务分解为有序计划 $\\rho_t$，从 $L_t$ 中实例化、适配或组合已有策略，同时参考 $F_t$ 中的失败模式。计划验证器检查步骤顺序和依赖后，工作流编写器将计划转化为类 Python 的 Code-as-Policy 程序，可逆解释器将其编译为可执行的 ComfyUI 工作流。执行过程中进行四级验证：计划验证、工作流合法性验证、中间输出验证和最终目标验证。若某步失败，诊断器定位受影响步骤并从 $F_t$ 检索纠正方案，系统仅修复该组件而保留已验证步骤，必要时调用子代理生成可复用子工作流。验证与修复循环直至成功或重试预算耗尽。\n\n**符号策略学习**在每次任务完成后更新策略库（§3.3, §A.1.4）。成功执行的工作流被蒸馏为符号策略，去除任务特定的输入（如描述文本和源图像），保留共享流程和适用条件。等价工作流被合并，使用次数和成功率被更新。失败记录连同执行证据和验证反馈存入 $F_t$，分析后提取根因、反模式和纠正策略。策展器定期整合冗余工作流、更新可靠性分层。经过 $N$ 轮探究后，策略库导出为冻结快照 $K_{\\text{inquiry}}$，供外部视觉代理即插即用复用。\n\n**下游执行阶段**从探究结束后的策略库状态出发，对每个外部任务指令执行相同的反馈引导执行流程，同时持续更新内部策略库，但冻结快照不再更新。\n\n### § 6 核心数学推导\n\n论文的任务选择机制依赖两个评分函数，其设计有明确的直觉。\n\n**能力新颖度** $N(\\tau) = \\frac{1}{|G_\\tau|} \\sum_{g \\in G_\\tau} \\frac{1}{\\sqrt{n_t(z_\\tau, g) + 1}}$，其中 $n_t(z, g)$ 是上下文 $z$ 与能力 $g$ 的历史练习次数。分母中的平方根使已探索较多的组合得分递减但不归零，加 1 避免零次尝试时除零。对 $|G_\\tau|$ 取平均防止能力集越大得分越高的偏差。直觉是：优先探索尚未充分练习的\"上下文—能力\"组合。\n\n**保守工作流可靠性**采用 95% Wilson 置信区间的下端点 $r(w)$，而非直接使用经验成功率 $p_w = s_w / u_w$。Wilson 区间对样本量敏感：执行次数少时区间宽，下端点低，从而抑制\"仅成功一两次就获得高可靠性\"的乐观估计。任务能力估计取所有必需能力中最弱者的可靠性 $r_t(\\tau) = \\min_{g \\in G_\\tau} r_t(\\tau, g)$，体现木桶效应。\n\n**能力前沿分数** $C(\\tau) = 4 \\cdot \\bar{r}_t(\\tau) \\cdot (1 - \\bar{r}_t(\\tau))$ 遵循 Goldilocks 原则。该二次函数在 $\\bar{r}_t(\\tau) = 0.5$ 时取最大值，对估计成功率过高或过低的任务降权。直觉是：太容易的任务不带来新知识，太难的任务大概率失败也无法蒸馏策略，中等难度的任务学习收益最大。\n\n最终任务选择为 $\\tau_t = \\arg\\max_{\\tau} N(\\tau) \\cdot C(\\tau)$，将探索新颖性与可学习性结合。\n\n### § 7 实验设计与结论\n\n**问题1：自主探究能否在下游任务到达前获取可复用策略？** 实验在 ComfyBench 上对比有无自主探究的配置，并逐步增加探究轮数（0→10→20→50→100）。移除探究后 Creative 子集的 Resolve 从 95.0% 降至 72.5%，且随轮数增加性能持续提升但边际递减，50 轮后趋于饱和。答案：自主探究对创造性任务收益显著，因为这些任务需要超越课程例题的技能组合，提前获取策略尤为关键。\n\n**问题2：反馈引导执行中的规划、中间验证和局部修复各自是否必要？** 实验在 Complex 子集上逐一移除三个组件。移除规划使 Resolve 从 83.3% 降至 55.0%（降幅最大），移除中间验证使 Pass 从 100.0% 降至 75.0%（错误传播导致工作流不可执行），移除局部修复使 Resolve 降至 76.7%。答案：三者互补——规划协调多步依赖，中间验证限制错误传播，局部修复在保留已验证步骤的前提下修复失败组件。\n\n**问题3：冻结策略快照能否跨框架即插即用复用？** 实验将同一 $K_{\\text{inquiry}}$ 注入 ComfyAgent、ComfyMind 和 SymbOmni 三个外部代理，不微调模型权重。三个代理的 Total Resolve 分别提升 24.5、5.0 和 3.0 个百分点，Creative 子集提升尤为明显。此外，仅用图像任务探究得到的快照直接应用于视频生成任务，Total Resolve 达 85.9%，超过 SymbOmni 5.1 个百分点。答案：符号策略捕获的是跨任务家族的共享流程而非实例特定解，因此可跨框架、跨模态复用。", "additional_insights": "### § 8 阅读收获\nOmniHarness 通过自导向探究在下游任务到来前主动生成练习任务，将成功执行抽象为可复用的符号策略以实现跨任务泛化。执行中的中间验证和局部修复限制了错误传播，提升了多步任务的可靠性。冻结的策略快照能即插即用地增强现有视觉智能体，无需微调模型参数。\n\n### § 9 最脆弱的假设\n核心假设是自导向探究学到的符号策略能有效泛化到未见过的下游任务。若不成立，其泛化贡献将直接失效。实际中，探究生成的练习任务可能受限于模型初始能力空间，导致策略集中在已知领域，难以覆盖下游任务中真正新颖的组合。论文虽展示了优异的基准结果，但缺少对探究任务与下游任务分布差异的定量分析，跨模态泛化也仅基于少量任务验证。\n\n### § 10 最小复现实验\n若有一周时间，可验证冻结策略快照的即插即用效果。使用 ComfyBench 的 Creative 子集，将开源的冻结策略快照映射到 ComfyAgent 的参考记忆中，不微调模型。测量加入快照前后 ComfyAgent 的解决率。若解决率显著提升（如从 15% 升至 40% 以上），则支持其策略可迁移的声明；若无明显提升则反驳。此方案无需复现完整探究流程，仅测试最终产物有效性。", "research_value": "### § 11 最强反例设计\n如果我要挑战这篇论文，我会设计一个分布严重偏移的下游任务集来测试冻结快照的泛化能力。具体而言，在 ComfyBench 中引入一组必须依赖探究阶段提议器从未生成过的冷门自定义节点的任务。如果系统在这些任务上不仅没有提升，反而因为强行匹配不相关的符号策略而导致解决率下降，这就构成了负迁移。这一结果将表明，所谓的泛化可能只是在初始能力空间内的排列组合，而非真正的能力扩展。\n\n### § 12 后续研究设想\n围绕探究任务受限于模型初始能力空间这一局限，后续可以研究如何打破提议器的知识边界。需要改变的是候选任务的生成机制，例如引入基于 ComfyUI 节点完全随机组合的探究任务，而非仅依赖模型自生成。这值得测试是因为如果探究只能覆盖已知能力的组合，系统上限将被锁死。首个对照实验可比较模型自生成探究与随机组合探究在高度新颖下游任务上的解决率，若后者显著更高，则说明打破初始边界对获取真正新策略是必要的。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Xu Xu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Jinxiu Liu\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Zhangbo Qiao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiaxing Lu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiangyu Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yubin Gu\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Fangwei Ning\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yan Shi\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Beihang University\"},\n    {\"id\": 2, \"name\": \"The Chinese University of Hong Kong\"},\n    {\"id\": 3, \"name\": \"National University of Singapore\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding authors: Xu Xu (xuxu1@buaa.edu.cn), Jinxiu Liu (jinxiuliu0628@foxmail.com)\"}\n  ]\n}\n```", "summary_translation": "统一的多模态大语言模型（MLLMs）和多智能体系统推动了视觉生成的发展。然而，仍存在三个局限性：（1）现有方法通常蒸馏出特定于任务的经验，泛化能力有限。（2）反思通常被推迟到任务完成之后。（3）知识通常仅在响应下游任务需求时才被获取。为了解决这些局限性，我们引入了 OmniHarness，这是一个通过符号策略学习实现泛化视觉生成的框架。OmniHarness 将经过验证的执行过程抽象为视觉生成任务族的符号策略，捕获共享的程序和适用条件，同时移除特定于实例的输入。该框架为新任务实例化、调整并组合这些策略。中间验证在执行过程中指导细化和失败恢复。通过自主探究，OmniHarness 在指定下游目标之前，自主生成并执行接近其能力极限的练习任务。执行反馈不断细化这些策略，同时保持模型参数固定。跨六个评测基准、三个 MLLM 骨干网络和三个视觉智能体框架的实验表明，其具有强大的性能和持续的能力扩展。在 ComfyBench 的创意任务上，OmniHarness 达到了 95.0% 的解决率，超过最强基线 27.5 个百分点。冻结的策略快照通过即插即用的重用方式改进了现有的视觉智能体系统。"}]}], "2026-09-15": [{"name": "Agent Memory \u0026 Inference Optimization", "count": 2, "papers": [{"title": "AgentKV: Phase-Aware KV Eviction for Agentic LLMs", "arxiv_id": "2609.14872", "authors": "Taowen Tony Liu, Jeffrey T. H. Wong, Can Xiao, Bowen Yang, Hao Mark Chen, Yiren Zhao", "summary": "Agentic serving can consume orders of magnitude more tokens than chatbot workloads, stressing both KV-cache capacity and decode-time bandwidth. Most KV-eviction methods score cached keys against representative queries drawn from the most recent tokens, assuming future attention resembles recent attention. We show that agentic generation violates this assumption: future queries form a mixture over think, act, tool, and others phases, and principal-angle analysis shows these components occupy measurably different query subspaces, so recency representatives systematically undervalue keys that upcoming phases will need. We propose AGENTKV, which maintains a small query buffer per phase and scores cached keys against their union. We further implement AGENTKV in a persistent multi-turn serving path that carries compressed KV state across turns and compacts retained KV pages online. Across two models, six task domains, and three KV budgets each, AGENTKV improves task score by 5.5 points on average over R-KV and 5.3 over Tri-attention. Relative to upstream full-KV SGLang, AGENTKV improves output-token throughput by up to 1.80x. Code: https://github.com/LiuTaowen-Tony/agentkv.", "category": "cs.LG", "cluster": "Agent Memory \u0026 Inference Optimization", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic LLMs)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的核心问题是：在多轮 agentic LLMs 推理场景下，如何有效进行 KV-cache eviction 以缓解显存容量与 decode-time 带宽瓶颈，同时避免因 eviction 策略不当导致的任务质量下降。随着 LLMs 从单轮对话转向工具增强的 agentic workloads，token 消耗量急剧增加（可达传统 chatbot 的 1000 倍），这使得 KV-cache 成为限制 serving throughput 和 latency 的主要瓶颈。现有的 KV-cache 压缩方法通常基于“近期注意力可预测未来注意力”的假设，利用最近的 queries 作为代表来评估 cached keys 的重要性。然而，论文指出 agentic generation 违背了这一平稳性假设：agent 的轨迹在 think、act、tool 和 others 四个阶段间交替，且通过 principal-angle analysis 证明这些阶段的 queries 占据着显著不同的 subspaces。因此，基于 recency 的 eviction 策略会系统性地低估未来阶段所需的关键 keys。解决这一问题不仅能显著提升多轮 agent 任务的质量，还能通过物理层面的 KV-page compaction 与 allocator-level reuse，将压缩后的 KV state 转化为实际的 serving concurrency 提升和 throughput 增长（最高达 1.80×），对降低长周期 agent 的部署成本具有重大工程价值。\n\n### § 2 前人工作与不足\n在 KV-cache eviction 领域，前人研究多采用 query-centric 框架，即通过一小部分 representative queries 来估计 cached keys 的重要性并保留 top-B tokens。代表性方法包括基于累积注意力保留 heavy hitters 的 H2O、利用 attention sinks 与 sliding window 的 StreamingLLM、基于近期 observation window 选择 informative tokens 的 SnapKV，以及引入 redundancy penalty 的 R-KV。这些方法在单轮或平稳生成的假设下表现良好，但在 agentic 场景中存在根本性缺陷。它们之所以未能考虑 phase structure，是因为其底层逻辑将未来的 query distribution $p(q)$ 假设为一个平稳过程，并用最近窗口的经验分布 $p_{recent}(q)$ 来近似它。这种假设在单轮 chatbot 中成立，但在多轮 agent 轨迹中，query distribution 会在不同 semantic phases 间发生非平稳的转移。由于不同阶段的 queries 在几何表示上占据不同的 subspaces，recency representatives 只能覆盖当前阶段的 query 分布，导致对未来阶段（如从 think 转向 tool）至关重要的 keys 被错误地 evict。此外，在系统实现层面，先前的 KV-eviction 方法通常缺乏针对 persistent multi-turn inference 的 serving path 设计。它们没有实现在跨轮次工具调用中维持压缩状态、在线 compact retained KV pages 并将释放的显存交还 allocator 的机制，导致逻辑上的 cache 压缩无法转化为实际的 decode-time 内存流量减少或并发度提升。", "core_insight": "### § 3 重建作者的思考路径\n\n在 agentic LLMs 兴起之初，研究者们发现其多轮交互与工具调用特性导致 token 消耗量比传统 chatbot 高出几个数量级，这给 KV-cache 容量和 decode-time bandwidth 带来了巨大压力。为了缓解这一瓶颈，社区提出了许多 query-centric 的 KV-cache eviction 方法，如 H2O、SnapKV 和 R-KV。这些方法的核心逻辑是：利用最近的 representative queries 去评估 cached keys 的重要性，其隐含假设是未来的 attention 分布与最近的分布相似，即 query 分布是 stationary 的。\n\n然而，当将这些方法应用于 agentic workloads 时，作者观察到了潜在的失败模式。Agentic 轨迹并非单一的平稳过程，而是由 think、act、tool 和 others 等语义阶段交替构成的。如果当前处于 think 阶段，基于 recency 的 eviction 策略会主要保留对当前推理有用的 keys，而可能丢弃了接下来 act 或 tool 阶段所依赖的上下文信息（如工具描述或历史观测结果）。这意味着 recency representatives 系统性地低估了未来阶段所需的 keys。\n\n为了验证这一直觉，作者从表示空间的几何结构入手。借鉴已有关于 hidden states 中 phase 可线性检测的研究，作者推测不同阶段的 query vectors 也会占据不同的 subspaces。通过 t-SNE 可视化和 principal-angle analysis，作者证实了不同 agentic phases 之间的 query subspaces 确实存在显著差异，而同一 phase 在不同步骤间的 query 方向则更为对齐。这一理论线索直接证明了 agentic 场景下 query 分布的非平稳性及 phase 结构。\n\n基于上述观察与验证，作者自然地推导出了改进方案：既然未来 queries 是一个跨阶段的 mixture，那么 representative queries 也应该覆盖这个 mixture，而不是仅局限于最近的窗口。因此，为每个 phase 维护一个独立的 query buffer，并在 eviction 时用这些 buffers 的并集来给所有 cached keys 打分，就能无偏地估计 keys 在未来各阶段中的重要性，从而保留真正有用的全局上下文。\n\n### § 4 核心 Intuition\n\n现有的 KV eviction 方法假设未来的 attention 模式与最近的相似，但在 agentic LLMs 中，模型会在 think、act、tool 等不同阶段间切换，且这些阶段的 query 分布在几何上占据不同的 subspaces。因此，仅用最近的 queries 评估 KV entries 会系统性地丢弃未来阶段所需的关键信息。AGENTKV 的核心直觉是：为每个 phase 维护一组代表性的 queries，并用它们的并集来评估所有 cached keys，从而确保保留的 KV cache 能够覆盖未来所有可能阶段的 attention 需求。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Token \u0026 Query] -\u003E (Phase Parser, Alg.1) -\u003E [Phase Label]\n                                                |\n                                                v\n                               (Push to Phase FIFO Buffer)\n                                                |\n                                                v\n                             (Compression Event? Every 128 tok)\n                                         /            \\\n                                       No             Yes\n                                       /                \\\n                                      v                  v\n                             [Normal Decode]    (Concat Buffers \u0026 Score Keys, Alg.2)\n                                                         |\n                                                         v\n                                               (Keep Top-B \u0026 Evict Rest)\n                                                         |\n                                                         v\n                                               (Physical Compaction, Alg.3)\n                                                         |\n                                                         v\n                                             [Persistent KV State]\n```\n\nAGENTKV 的完整推理与压缩 Pipeline 包含以下步骤：\n\n1. **Phase Parsing \u0026 Buffering**：输入是当前生成的 token 及其对应的 query vector。系统通过基于 chat-template markers 的 deterministic parser（Algorithm 1）判定当前 token 所属的 agentic phase（think, act, tool, others），并将该 query 推入对应 phase 的 FIFO buffer 中。此过程无需模型内部的 classifier，仅依赖 tokenizer-visible 的结构标记（对应正文 §3.3 与 Algorithm 1）。\n2. **Compression Trigger**：在 decode 阶段，每生成 128 个 tokens 触发一次 compression event。若未达到触发阈值，模型继续正常 decode；若触发，则进入打分与驱逐流程（对应正文 §4.1 与 Algorithm 2）。\n3. **Phase-Aware Scoring**：触发压缩时，系统合并四个 phase buffer 中的 recent queries 形成代表集 $Q_e$。随后计算所有 candidate keys 对 $Q_e$ 的 average attention mass，以此作为 key 的重要性分数。这种基于 phase mixture 的打分机制避免了 recency bias 导致的跨 phase 关键信息丢失（对应正文 §3.3 与 Algorithm 2）。\n4. **Eviction \u0026 Compaction**：结合 protected indices（如 attention sinks），系统保留分数最高的 top-B 个 keys 并驱逐其余 keys。随后执行物理 compaction（Algorithm 3），将保留的 KV entries 写入新的连续 slots，释放旧 pages 给 allocator。这一步确保了逻辑上的 eviction 能转化为实际的 memory traffic 减少和并发度提升，并维持跨轮次的 persistent KV state（对应正文 §3.4 与 Algorithm 3）。\n\n### § 6 核心数学推导\n\n本论文的核心理论分析在于证明 agentic 场景下 query distribution 的 phase structure，以及 recency-based eviction 产生的估计偏差。\n\n首先是 **Query-centric 重要性评估**。Query-centric 方法通过计算 candidate key $i$ 在代表性 query 集 $Q$ 下的平均注意力权重来评估其重要性：\n$$A_i = \\frac{1}{|Q|} \\sum_{q \\in Q} \\text{softmax}(q^\\top K)_i$$\n**Intuition**：在 attention 机制中，query $q$ 和 key $k$ 的点积决定了注意力分配。为了预测某个 key $i$ 在未来是否重要，我们用一组历史 representative queries $Q$ 来模拟未来的 queries。如果 key $i$ 在这些 queries 下获得了较高的平均注意力 $A_i$，说明它是个“heavy hitter”，应该被保留。\n\n从概率视角看，这等价于在估计的未来 query 分布 $\\hat{p}(q)$ 下计算期望注意力：\n$$\\mathbb{E}_{q \\sim \\hat{p}(q)} [\\text{softmax}(q^\\top K)_i]$$\n**Intuition**：Recency-based 方法假设 $\\hat{p}(q)$ 等于最近 queries 的经验分布。但论文指出，agentic 场景下的真实分布 $p(q)$ 是不同 phase 的 mixture。用单峰的 recency 分布去近似多峰的 phase mixture 分布，会系统性地低估非当前 phase 的 keys 的重要性。\n\n为了验证 phase structure 的存在，论文使用了 **Principal Angle Analysis**。对于某个 phase span $s$，将其 query vectors 堆叠成矩阵 $X_s$ 并进行 SVD：$X_s = U_s \\Sigma_s V_s^\\top$。提取前 $k$ 个右奇异向量 $V_{s,k}$ 作为该 span 主方向的 orthonormal basis。比较 span $s$ 和 $t$ 的子空间重叠度时，计算 $V_{s,k}^\\top V_{t,k}$ 的奇异值：\n$$\\sigma_i(V_{s,k}^\\top V_{t,k})$$\n**Intuition**：SVD 提取了 query 矩阵的主要能量方向。两个子空间基向量的内积矩阵的奇异值，衡量了它们在不同方向上的对齐程度。奇异值越接近 1，说明两个 phase 的 query 方向越重合（夹角接近 0）；越接近 0，说明方向越正交（夹角接近 90 度）。实验表明，不同 phase 间的 principal angle 显著大于同 phase 内的 angle，证明了不同 phase 占据不同的 query subspaces。\n\n最后是 **Utility Coverage** 评估。定义 token $i$ 的 future utility 为 $U_i = \\sum_{j \u003E i_{\\text{comp}}} a_{j,i}$。对于 phase $\\phi$，其 utility coverage 定义为：\n$$UC_\\phi = \\frac{\\sum_{i \\in R_\\phi \\cap \\phi} U_i}{\\sum_{i \\in K_\\phi} U_i}$$\n**Intuition**：$U_i$ 是一个离线计算的 oracle 指标，统计了 token $i$ 在压缩点之后被所有未来 query 关注的总和。$UC_\\phi$ 衡量了某种保留策略 $R_\\phi$ 为 phase $\\phi$ 保留了多少比例的未来注意力信息。实验发现，recency 方法对 tool phase 的 $UC$ 极低，而 AGENTKV 的 multi-phase representatives 显著提升了这一指标。\n\n### § 7 实验设计与结论\n\n**问题1：Agentic 推理中，不同 phase 的 query 是否占据不同的 subspaces，导致 recency-based eviction 存在 bias？**\n**实验设计**：作者通过 principal angle analysis 量化了不同 layer 和 head 上各 phase 的 query subspaces 夹角，并通过 offline utility-coverage diagnostic 测量了 recency 和 multi-phase representatives 对各 phase 未来注意力信息的保留比例。\n**实验结论**：不同 phase 的 query subspaces 确实存在显著几何差异。Recency representatives 会系统性地低估 tool 等 non-recent phase 的 keys，而 AGENTKV 的 multi-phase representatives 能显著恢复这些被忽略的 utility。\n\n**问题2：AGENTKV 相比现有 KV eviction 方法能否提升多轮 agentic 任务的质量？**\n**实验设计**：在 BFCL 和 $\\tau^2$-bench 上，使用 Qwen3-32B 和 Qwen3-8B，在三种 KV budget 下端到端对比 AGENTKV, R-KV 和 Tri-attention 的任务准确率。\n**实验结论**：AGENTKV 在 multi_turn 等需要跨 phase 长程依赖的任务上提升最明显，平均任务得分比 R-KV 提升 5.5 分，比 Tri-attention 提升 5.3 分。在仅需近期 tool response 的任务（如 airline）中，不同方法差异较小。\n\n**问题3：AGENTKV 的性能提升是否真正来源于 phase-aware 机制，而非 serving path 的工程优化？**\n**实验设计**：进行 Matched recent-query ablation。在完全相同的 serving path、pooling 机制和 KV budget 下，仅将 AGENTKV 的 phase buffers 替换为等量的 recent queries。\n**实验结论**：在排除了系统工程优化的干扰后，phase-aware representatives 依然平均提升了 4.2 分，证明了 phase mixture 建模本身对跨阶段状态保留的有效性。\n\n**问题4：AGENTKV 能否在实际 serving 系统中转化为吞吐量收益？**\n**实验设计**：在 H100 NVL 和 RTX A6000 上，对比 AGENTKV 实现与 upstream full-KV SGLang 的 output-token throughput，并在统一 serving path 下对比不同 eviction policy 的吞吐量。\n**实验结论**：通过在线 compaction 和 allocator-level reuse，AGENTKV 将逻辑上的 cache 压缩转化为实际的 memory traffic 减少和并发度提升。在 32k/1k 的 prompt/generation 设置下，最高实现了 1.80x 的吞吐量提升，且在相同 budget 下始终优于其他共享 path 的 policy。", "additional_insights": "### § 8 Take-aways\nAgentic workloads 违背了 recency-based KV eviction 的平稳性假设，因为未来的 queries 会在 think, act, tool 和 others 四个 phases 之间切换，而这些 phases 占据着几何上可区分的 query subspaces。AGENTKV 通过为每个 phase 维护独立的 FIFO query buffer，并根据这些 phase-aware representatives 的并集对 cached keys 进行评分，从而纠正了 recency bias。该方法在 persistent multi-turn serving path 中实现了 online KV-page compaction 与 allocator-level reuse，将逻辑上的 eviction 转化为物理内存的节省与并发度的提升。实验表明，AGENTKV 在中间 KV budgets 下显著提高了 task utility coverage 和 end-to-end accuracy，同时相对于 full-KV SGLang 将 output-token throughput 最高提升了 1.80 倍。\n\n### § 9 最脆弱的假设\n最脆弱且失败代价最大的假设是：不同 agentic phases（think, act, tool, others）的 query vectors 占据着几何上可区分的 subspaces。如果这个假设不成立，例如在某些高度交织的复杂推理任务中，模型在同一 phase 内频繁混合使用不同功能，或者 attention heads 实际上是按语法/语义功能而非 phase label 进行划分的，那么基于 phase mixture 的评分将退化为带有噪声的 recency 评分，核心贡献直接失效。在实际部署中，该假设还隐含了对确定性 phase parsing 的依赖，这在自定义 agent 框架或非标准 tool-call 格式中可能不成立。论文为该假设提供了 principal-angle analysis（显示 inter-phase angles 显著大于 intra-phase angles）和 t-SNE 可视化作为几何证据，并通过 utility-coverage 诊断证明了 multi-phase representatives 确实能恢复 recency 遗漏的 tool utility。然而，论文缺少证据证明这种 subspace separation 在更广泛的 model architectures 或 phase boundaries 模糊的极端复杂任务中依然稳健。\n\n### § 10 最小复现实验\n如果有 1 周时间，可以通过一个纯离线的 utility-coverage 分析来最小化复现其核心动机，无需构建复杂的 persistent serving path。使用 Qwen3-8B 模型在 BFCL multi_turn_base 数据集（200 个 instances）上运行标准的 multi-turn agent generation，并记录所有 layers 和 heads 的 query vectors 与 attention weights。利用论文的 Algorithm 1 将 tokens 解析为四个 phases，并在几个代表性的 (layer, head) 对上计算 principal angles，比较 intra-phase 与 inter-phase 的 span pairs。接着，在每个 compression event 处，分别使用 recency representatives（最后 32 个 queries）和 multi-phase representatives（每个 phase 8 个 queries）计算各 phase 的 utility coverage $UC_\\phi$。如果实验结果显示 inter-phase principal angles 显著大于 intra-phase angles，且 multi-phase representatives 的 tool phase utility coverage 相比 recency 有显著提升（如论文中从 0.04 提升至 0.17），则支持其“phase structure 存在且 recency 存在 bias”的 claim；若两者 angles 相近或 utility coverage 无显著差异，则直接反驳其核心前提。", "research_value": "### § 11 最强反例设计\n要对该论文进行最有力的攻击，核心在于挑战其根本假设：即性能提升源于“不同 agentic phases 占据几何上可区分的 query subspaces”。我设计了一个“Random-Partition Ablation”实验结合“Phase-Blurred Task”来提出替代解释。具体而言，在完全相同的 serving path 和 KV budget 下，我将废弃论文基于 chat-template markers 的 deterministic phase parser，转而将最近的 query window 随机均分为四个等大的 FIFO buffers，并使用这些随机分组的 representatives 的并集进行 key scoring。如果这个 Random-Partition 变体能够取得与 AGENTKV 相当的 task accuracy 和 utility coverage，那么论文的核心理论便被推翻：性能提升的真正来源并非“phase-aware”的语义结构，而仅仅是因为从更宽广的历史窗口中采样 queries 增加了 representative set 的 diversity，从而缓解了纯 recency 造成的 attention collapse。此外，我会在 ReAct 或复杂代码生成等 phase boundaries 极度模糊的真实场景中测试该方法。在这些场景下，模型在同一生成片段内高频交织 think 和 act 功能，且不依赖标准的 tool-call markers。由于缺乏明确的 tokenizer-visible 结构标记，Algorithm 1 将退化为将所有 tokens 归入单一 phase，此时 AGENTKV 将完全退化为标准的 recency-based eviction，而其维护多 phase buffer 的额外开销将变得毫无意义。这一反例不仅提供了“diversity sampling 替代解释”，还精准识别了方法在非标准 agentic 框架中可预测失效的条件。\n\n### § 12 Follow-up Research Idea\n基于 AGENTKV 依赖确定性 phase parsing 且将 query distribution 视为离散静态 mixture 的局限，我提出一个全新的研究方向：**Latent-Intent-Aware KV Eviction via Continuous State Tracking**。该想法驱动的核心局限是，真实 agentic workloads 中的 query distribution 演化是连续且高度动态的，硬性将其划分为 think/act/tool 等离散 bins 不仅需要脆弱的 chat-template 依赖，还忽略了同一 phase 内部不同推理深度的 subspace 漂移。为了解决这一未满足的需求，我们可以借鉴相邻领域——如 Reinforcement Learning 中的 Partially Observable Markov Decision Processes (POMDPs) 或在线聚类算法——来构建一个轻量级的 latent state tracker。具体而言，不再使用规则解析器打标签，而是用一个极小的 recurrent network (如 lightweight GRU 或 Linear Attention) 在 decode 阶段实时吸收历史 query vectors，输出一个 continuous latent intent state，并基于该 state 预测未来的 query distribution $\\hat{p}(q)$，进而动态调整 KV-cache eviction 的 scoring weights。第一个实验将设计一个 “Implicit-ReAct Benchmark”，强制模型在不使用任何特殊 tokens 的情况下进行隐式工具调用与推理交织。我们将对比 full-KV、SnapKV (recency)、AGENTKV (discrete phase) 与提出的 Latent-Intent 方法在 utility coverage 和端到端准确率上的表现。区别于现有所有基于硬性规则或近期窗口的 query-centric 方法，本提议将 KV-cache 管理从“对历史静态特征的聚类”重构为“对未来 attention 意图的连续预测”，彻底打破对显式 prompt 结构的依赖，为无边界、长周期 agentic serving 开辟新路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Taowen Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jeffrey T. H. Wong\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Can Xiao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Bowen Yang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Hao Mark Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yiren Zhao\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Imperial College London\"},\n    {\"id\": 2, \"name\": \"Columbia University\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "Agentic serving 消耗的 tokens 比 chatbot workloads 多出数个数量级，给 KV-cache capacity 和 decode-time bandwidth 都带来了压力。大多数 KV-eviction methods 使用从最近的 tokens 中提取的 representative queries 对缓存的 keys 进行评分，假设 future attention 类似于 recent attention。我们表明，agentic generation 违背了这一假设：future queries 由 think, act, tool 及其他 phases 混合而成，并且 principal-angle analysis 表明这些组件占据了明显不同的 query subspaces，因此 recency representatives 会系统性地低估 upcoming phases 将需要的 keys。我们提出了 AGENTKV，它为每个 phase 维护一个小的 query buffer，并根据它们的并集对缓存的 keys 进行评分。我们进一步在一个 persistent multi-turn serving path 中实现了 AGENTKV，该路径在多轮之间携带压缩的 KV state，并在线压缩保留的 KV pages。在两个模型、六个任务领域以及各自的三个 KV budgets 上，AGENTKV 相比 R-KV 平均将 task score 提高了 5.5 分，相比 Tri-attention 提高了 5.3 分。相对于 upstream full-KV SGLang，AGENTKV 将 output-token throughput 最多提高了 1.80 倍。代码：https://github.com/LiuTaowen-Tony/agentkv。"}, {"title": "LIMBO: Lifelong Inference-Time Memory and Budget Optimization for LLM Agents", "arxiv_id": "2609.14138", "authors": "Siddharth Sharma, Nilesh Prasad Pandey, Onat Gungor, Tajana Rosing", "summary": "As LLM agents become integrated into increasingly complex workflows, they must continually acquire new capabilities while retaining competence on previously learned tasks. Lifelong agents address this through experience replay, injecting past interactions into the prompt to leverage prior experience during inference. However, replay is not free: every replayed trajectory competes with retrieval, reasoning, tool use, and verification for the same limited prompt and compute budget, making effective resource allocation essential. Existing approaches allocate these resources using fixed replay policies, regardless of whether replay is beneficial for the current task. We identify this as inference-time memory allocation, a distinct problem class for lifelong agents, and introduce LIMBO: the first online framework to our knowledge that treats memory as a controllable inference-time resource and jointly optimizes memory strategy and inference budget for each incoming task. Unlike prior approaches that fix the replay policy or require model weights, teacher supervision, or offline retraining, LIMBO learns this allocation online in a single pass, explicitly balancing task performance and inference cost without modifying the underlying agent. Across three LLM backbones on LifelongAgentBench, LIMBO achieves better cost-accuracy tradeoffs than state-of-the-art memory-augmented baselines and nearly matches all strongest such baselines at up to ~83% lower inference cost (~53% on average). LIMBO adapts its policy across models and environments without retraining, demonstrating that effective allocation can be learned online rather than manually specified.", "category": "cs.LG", "cluster": "Agent Memory \u0026 Inference Optimization", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的研究问题是：Lifelong LLM agents 在处理连续任务流时，如何将 experience replay（将历史交互轨迹注入 prompt）作为一种可控的 inference-time 资源，针对每个新任务动态且联合地优化 memory strategy 和 inference budget。这个问题至关重要，因为随着 agent 积累经验，replay buffer 会随任务数呈 $O(t)$ 增长，导致 token 消耗和 inference overhead 激增。在有限的 context length 和 computational budget 下，replay 会与 retrieval、reasoning、tool use 和 verification 竞争资源。如果采用固定的 replay 策略，会导致严重的 cost-value mismatch：在 replay 价值不大的任务上浪费计算资源，或在急需历史经验的任务上预算不足。解决这一问题能带来巨大的工程与经济价值，它使得 agent 能够在不修改底层模型权重、无需离线训练或教师监督的情况下，以极低的 inference cost（最高降低约 83%）实现与最强 memory-augmented baselines 相当的准确率，从而推动 lifelong agents 在实际复杂工作流中的高效部署。\n\n### § 2 前人工作与不足\n在此之前，该问题并未得到充分解决。经典的 lifelong learning 方法（如基于 regularization 和 experience replay）主要针对静态监督学习环境，未扩展至交互式 LLM agents，且缺乏自适应 inference-time budget allocation 的机制。在 benchmark 方面，WebArena 和 AgentBench 等仅评估静态孤立任务，缺乏 sequential skill transfer 协议；虽然 LifelongAgentBench (LAB) 填补了这一评测缺口，但其原生的 Group Self-Consistency (GSC) 稳定器通过投票提升性能，却大幅增加了 token cost，与效率目标背道而驰。在 replay 机制本身，LongLLMLingua 采用 prompt compression 减少 token，但 token 级压缩会破坏交互环境所需的结构化 action traces；SuRe 利用 dual LoRA adapters 计算的 surprise scores 进行 replay 选择，但这要求访问模型权重，无法应用于 black-box LLMs；MemRL 和 ATLAS 等方法改进了 memory representation 或 retrieval，但未在统一框架下显式优化 replay 的 inference-time cost。这些前人工作的核心不足在于，它们将 replay 视为固定的预处理步骤或单纯改进 memory 的存储与检索，而没有将“何时进行 replay 以及分配多少 compute budget”定义为一个明确的 inference-time memory allocation 问题。由于缺乏一个能够在单次在线过程中学习这种分配、且兼容 black-box 模型的轻量级控制框架，前人方法无法根据当前任务、模型能力和部署成本动态平衡 accuracy 与 cost。", "core_insight": "### § 3 重建作者的思考路径\n\n研究者首先注意到，lifelong LLM agents 依赖 experience replay 来避免 catastrophic forgetting 并复用过去的能力，但这种机制并非免费。随着任务流的推进，replay buffer 不断增长，注入 prompt 的 token 数量呈 $O(t)$ 线性增加，直接导致 inference cost 暴涨。经验观察进一步揭示了一个 cost-value mismatch 现象：在许多任务上，固定增加 replay 的数量（例如从 $k=8$ 增加到 $k=16$）只能带来边际递减的 accuracy 提升，却伴随着数倍的 cost 增长。这说明历史轨迹的价值高度依赖于当前的 task、model 和 environment，uniform replay 策略在资源分配上极其低效。\n\n面对这一效率瓶颈，研究者审视了现有的改进路径。Prompt compression（如 LongLLMLingua）虽然能减少 token 开销，但容易破坏交互环境所需的结构化 action traces；retrieval-based 策略提高了相关性，却引入了额外的选择成本并挤占了有限的 context capacity；而基于 surprise score 的选择方法（如 SuRe）则需要访问模型权重，无法适用于 black-box LLMs。更重要的是，这些方法都将 replay 视为一个固定的预处理步骤，没有从根本上解决“何时 replay 才值得其 cost”的问题。\n\n既然 memory、retrieval、reasoning 和 tool use 都在竞争有限的 inference-time budget，研究者意识到 memory 的使用本质上是一个动态的资源分配问题。这个分配决策必须满足严苛的现实约束：不能依赖模型权重、必须在线单次学习、开销需远小于 LLM 推理本身，且必须显式权衡 accuracy 与 cost。在已有的机器学习工具中，contextual bandit 完美契合这些需求：它无需梯度更新，通过单次 scalar reward 在线学习，且能根据上下文特征平衡 exploration 与 exploitation。因此，将 memory mode 和 compute budget 的联合选择建模为 contextual bandit 问题，让 controller 在每个任务开始前根据 prompt 特征和 runtime 状态动态决策，成为了顺理成章的突破口。\n\n### § 4 核心 Intuition\n\n先前方法失效的原因在于将 experience replay 视为固定的预处理步骤，盲目注入历史轨迹，导致在不需要 replay 的任务上浪费计算资源，而在需要 replay 的任务上可能预算不足或格式被破坏。LIMBO 的核心 intuition 是：将 memory 视为一种可控的 inference-time 资源，而非固定的输入。在每次任务开始前，根据当前任务的 prompt 特征和近期的运行状态，动态决定是否注入历史轨迹、注入多少以及分配多少计算预算，从而在 accuracy 和 cost 之间取得最优平衡。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\nTask Stream (T_i)\n   │\n   ▼\n[Feature Extraction] ──\u003E x_i (12维: prompt-shape, runtime, prev-outcome)\n   │\n   ▼\n[Two-Head LinUCB Controller]\n   ├──\u003E Head 1: 预测 correctness (p_a)\n   └──\u003E Head 2: 预测 cost (c_a)\n   │\n   ▼ (Action Selection: argmax(p - λc + α*UCB))\n[Replay \u0026 Budget Action (a*)] (none/full/compressed/retrieved + token/round/tool)\n   │\n   ▼\n[Prompt Construction \u0026 Agent Execution]\n   │\n   ▼\nObserve: Correctness (y_i) \u0026 Cost (c_i)\n   │\n   ├──────────────────────┐\n   ▼                      ▼\n[Update Memory Bank]   [Update Bandit Stats] (Sherman-Morrison)\n```\n\nLIMBO 的推理与在线学习过程高度耦合，具体步骤如下：\n\n- **Feature Extraction**：输入为当前任务 $T_i$ 及其 prompt、retrieval state 和 recent runtime statistics。具体操作是提取 12 个轻量级特征，分为 prompt-shape features（如 log-normalized token counts）、runtime-state features（如 EMA of normalized cost）和 previous-outcome features（如上一任务是否成功）。输出为特征向量 $x_i$。此步骤在 LLM 调用前完成，满足黑盒兼容性（对应正文 III-D(a)）。\n- **Two-Head LinUCB Controller**：输入为特征向量 $x_i$。具体操作是使用 LinUCB 算法，为每个候选 action 维护 precision matrix $A_a$ 和两个参数向量 $b_a^{acc}, b_a^{cost}$，分别预测 correctness probability 和 normalized expected cost。输出为各 action 的预测值（对应正文 III-D(b)）。\n- **Action Selection**：输入为各 acti
