d actions 和 tool scopes，但这些规范此前仅用于 agent 配置，未被用于结构化 model post-training 的 rollout 任务和 resolution criteria。Salesforce Koa 通过 simulation-to-reward pipeline 填补了这一缺口，将同一套 specification 同时驱动 agent authoring 和 RL 训练，使 spec-driven RL 成为专门化 open-weight foundation models 的可行路径。", "core_insight": "### § 3 重建作者的思考路径\n\n企业 AI 系统对 LLM 的要求与通用助手根本不同：它必须调用外部工具、检索结构化信息、完成跨业务应用的多步骤工作流，而这些工具的 schema、API 和策略是组织特定的。开源基础模型（Llama、Gemma、Qwen、Mistral、Nemotron）在公共 benchmark 上已大幅缩小与专有模型的差距，但企业需要的部署控制、定制化、治理和成本管理是单一外部 provider 无法满足的。核心问题因此浮现：能否在保留通用能力的同时，将开源基础模型有效特化为企业 agentic 任务专用？\n\n标准的 post-training 路线是 SFT 适配下游任务，再用 RLHF 或 GRPO 进一步提升推理和决策。但作者在 preliminary SFT study 中观察到一个关键失败模式：在已经经过大量后训练的 Nemotron-120B base 上，SFT 对多轮工具使用几乎没有提升（BFCL multi-turn 54.1%→53.2%），增益集中在单轮和静态 agentic 类别。这暗示行为克隆无法教会 agent 在长 horizon 交互中做出正确决策——它只能模仿表面动作序列，无法学习何时该调用工具、何时该与用户沟通、何时该 defer。与此同时，SFT 与 RL 在 post-training 中并非干净解耦，简单叠加 SFT-then-RL 的收益并非理所当然。\n\n另一方面，现有 RL 工作大多针对通用推理和公共工具，而非企业特定的 schema 和 API。企业领域的 RL 面临一个结构性困难：训练任务和 reward 必须反映真实的工作流结构，但人工标注昂贵且涉及客户数据隐私，而通用合成数据又无法覆盖组织特定的路由逻辑、工具范围和策略约束。APIGen 和 APIGen-MT 提供了合成多轮交互的自动化 pipeline，Tau2Bench 和 BFCL 确立了工具使用评估标准，PivotRL 展示了低计算成本下的 agentic post-training 方法——但这些工作都没有利用企业 agent 本身已有的声明式规范。\n\n关键的洞察在于：Salesforce 的 Agentforce agent 本身就是用 Agent Script 这种声明式语言编写的，一个 specification 已经完整定义了 agent 的路由结构、子 agent、typed actions、工具范围和工作流指令。如果将这个 specification 不仅用于配置 agent，还用于结构化 RL 的 rollout 任务和 resolution criteria，就能直接桥接 agent authoring 与 model post-training。specification 可以被编译为 typed workflow graph，实例化为可执行环境；simulation pipeline 可以将其扩展为 scenario- 和 persona-conditioned 的多轮任务；coverage judge 可以基于 sub-question 的 resolved/not-resolved 判决生成 grounded reward，并强制要求需要客户或系统数据的子问题必须由成功的工具调用支撑。对于没有 Agent Script 的公共工具领域，可以直接合成 workflow structure，复用相同的 simulation 和 reward 机制。这样，RL 就能在真实的工作流结构中学习，而非在抽象的通用任务中。\n\n### § 4 核心 Intuition\n\n企业 agent 的声明式 specification 本身就包含了训练所需的全部结构：工作流路由、工具范围、状态效应和终止条件。将 specification 编译为可执行环境，用 simulation pipeline 扩展为多轮任务，用 coverage judge 生成 grounded reward，就能让 GRPO 在真实工作流中学习 agent 该做什么，而不是在抽象任务中学习通用推理。先前方法失效是因为 SFT 只能模仿表面动作而无法教会长 horizon 决策，通用 RL 又缺乏企业特定的工作流结构和 grounded reward；这个方法奏效是因为 specification 同时定义了 agent 的行为空间和模型的训练信号，使 agent authoring 与 post-training 不再是割裂的两个阶段。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Agent Script / Synth Workflow]\n      |\n      v\n[Typed Workflow Graph] -\u003E [Simulation Pipeline] -\u003E [Persona-conditioned Tasks]\n                                                        |\n                                                        v\n[GRPO Optimization] \u003C- [Grounded Reward] \u003C- [NeMo Gym Online Rollout]\n      |                    ^                 |          |\n      v                    |                 v          |\n[Policy Update]            |          [Coverage Judge]  |\n                           |          (Frozen Helper)   |\n                           |               ^            |\n                           |               |            |\n                           +---------------+------------+\n```\n\nSalesforce Koa 的完整训练 pipeline 包含以下核心步骤：\n\n1. **Spec-driven 环境与任务构建 (Section 2.1)**：\n   - **输入**：企业领域的 Agent Script 规范（定义路由、子代理、工具作用域等）或公开工具领域的合成工作流结构。\n   - **操作**：静态提取将规范编译为 typed workflow graph（包含工具参数 schema、路由条件等）。随后，simulation pipeline 将其扩展为基于场景和 persona 的多轮对话任务。\n   - **输出**：带有 `agent_ref` 和初始上下文的 persona-conditioned RL 训练任务。\n\n2. **在线 Rollout 与 Grounded Reward (Section 2.2)**：\n   - **输入**：RL 训练任务、可训练的 Policy (Nemotron-120B) 以及 Frozen Helper 模型。\n   - **操作**：NeMo Gym 执行 online rollout。Policy 与环境交互，Frozen Helper 扮演 customer simulator、tool emulator 和 coverage judge 三个角色。Coverage judge 根据子问题解决情况与成功工具调用的 grounding 计算覆盖率，并施加 duplicate-call gate。\n   - **输出**：标量 Grounded Reward。\n\n3. **策略优化 (Section 2.3)**：\n   - **输入**：Rollout 生成的完整轨迹与标量奖励。\n   - **操作**：使用 Group Relative Policy Optimization (GRPO) 算法，通过 leave-one-out 基线估计优势，进行单步 on-policy 更新。对格式错误的工具调用施加负向优势作为硬性约束。\n   - **输出**：更新后的 Policy 权重。\n\n4. **单步训练模式 (Appendix F)**：\n   - **输入**：受约束的决策回合（如工具被故意扣留时的对话前缀）。\n   - **操作**：环境动态创建工具缺失的约束状态，要求 Policy 选择与用户沟通而非盲目调用工具。通过 procedural gate 阻止不可逆的副作用，并在恢复回合评估正确性。\n   - **输出**：增强 Policy 在面对限制时的用户沟通与延迟决策能力。\n\n### § 6 核心数学推导\n\n本文的核心数学推导基于 Group Relative Policy Optimization (GRPO) 算法，旨在最大化期望轨迹奖励。由于原文部分公式抽取缺失，以下仅解释可确认的定义与关系，并补充标准理论背景。\n\n**1. 期望轨迹奖励**：\n模型优化的目标是最大化期望奖励 $J(\\theta) = \\mathbb{E}_{x \\sim D} \\mathbb{E}_{\\tau \\sim \\pi_\\theta(\\cdot|x, env)} [R(\\tau)]$。\n- **Intuition**：给定从数据集 $D$ 采样的 prompt $x$，策略 $\\pi_\\theta$ 在环境中生成轨迹 $\\tau$，目标是让所有可能轨迹的奖励 $R(\\tau)$ 的期望最大化。这里不使用单步奖励，而是基于完整多轮交互的最终结果给予奖励。\n\n**2. Leave-one-out 优势估计**：\n对于同一 prompt 采样的一组 $G$ 条轨迹，轨迹 $i$ 的优势 $A_i$ 通过 leave-one-out 基线计算。\n- **Intuition**：GRPO 不使用额外的 value network 来估计基线，而是用同一组其他轨迹的平均奖励作为基线。计算轨迹 $i$ 的优势时，排除 $i$ 自身，用剩余 $G-1$ 条轨迹的奖励均值和标准差进行归一化。这减少了方差，并使得相对表现更好的轨迹获得正优势。\n\n**3. Token-level 截断重要性采样权重**：\n在单步 on-policy 更新中，引入一个 token 级别的权重来纠正训练时与生成时 log-probability 的不匹配。\n- **Intuition**：由于策略在生成一个 batch 后会立即更新，生成时的概率与训练时的概率会有微小偏差。重要性采样权重用于修正这种偏差，保证梯度估计的无偏性，而截断操作则防止极端值导致训练不稳定。\n\n**4. Grounded Reward 计算**：\n奖励由 coverage rate 和 duplicate-call gate 组成。Coverage rate 是被 judge 判定为已解决的子问题比例；若发生连续重复的相同工具调用，奖励直接置零。\n- **Intuition**：通过 gate 机制惩罚无效的重复调用，强制模型在获取数据时依赖成功的、相关的工具调用，而非通过重复尝试或通用事实猜测来“作弊”通过判定。\n\n### § 7 实验设计与结论\n\n**提出了什么问题**：开源基础模型能否在不损失通用能力的前提下，通过强化学习有效特化为企业级 agentic 任务模型？spec-driven RL 是否是一条实用的技术路径？\n\n**设计了什么实验验证这个问题**：研究团队在公开工具调用、agentic reasoning 和企业 CRM 基准上，将 Salesforce Koa 与其开源基座、专有前沿模型进行对比。同时，设计了 scoped SFT-vs-RL 消融实验，从相同的已 RL-post-trained 基座出发，分别评估 SFT-only 和 RL-only 在单轮与多轮任务上的表现差异。\n\n**问题的答案是什么**：Spec-driven RL 能有效提升开源基座在企业 agentic 任务上的表现，尤其在多轮工具调用上提升最明显，并超越了强专有基线 GPT-4.1，但未达到最强前沿模型水平。消融实验表明，RL 在多轮工具使用上显著优于 SFT，而 SFT 在单轮 CRM 任务上更具竞争力。这证实了 spec-driven RL 是特化开源基础模型的有效路径，但从已 RL-post-trained 基座出发的结论可能不适用于 pre-RL checkpoint。", "additional_insights": "### § 8 Take-aways\n\nSalesforce Koa 是基于开源的 Nemotron-3-Super-120B foundation model，通过 GRPO (Group Relative Policy Optimization) 进行 post-training 的企业级语言模型，其核心创新是 specification-driven task construction。该 pipeline 使用 Salesforce 的声明式语言 Agent Script 编写企业工作流规范，将其扩展为基于场景和 persona 的多轮任务，并通过 simulation-to-reward pipeline 生成基于成功工具调用的 task-resolution rewards。对于公共工具使用领域，由于没有 Agent Script 规范，论文直接合成工作流结构生成 typed workflow graph，与企业领域共享相同的模拟和奖励机制。在公共工具使用、agentic-reasoning 和企业 CRM benchmarks 上，Salesforce Koa 相比其开源基线有所提升，特别是在多轮工具使用方面提升最明显，并超越了 GPT-4.1，但仍低于最强的前沿模型如 Claude Opus 4.8 和 GPT-5.5。论文发现，从已经经过 RL post-training 的基线模型出发，RL 在多轮工具使用上显著提升，而 SFT 贡献甚微，但在单轮 CRM 任务上 SFT 表现出竞争力。训练仅使用公开和合成生成的数据，不使用任何客户数据，确保了数据隐私和合规性。奖励设计采用了 gated coverage reward，通过 coverage judge 对子问题进行 resolved/not-resolved 判决，并强制要求需要特定数据的子问题必须由成功的工具调用支持。研究还发现 RL 的稳定性是 scale-dependent 的：在 Super-120B 模型上训练稳定，但在较小的 Nano-30B proxy 模型上训练会在早期达到峰值后崩溃。\n\n### § 9 最脆弱的假设\n\n该论文最关键的假设是：使用 frozen helper model（Nano-30B）同时充当 customer simulator、tool/function emulator 和 coverage judge，能够准确模拟真实环境并生成可靠的 reward 信号。如果这个假设不成立，核心贡献会直接失效，因为整个 GRPO 训练完全依赖于 helper model 生成的 reward，如果 helper 的模拟不准确或 judge 不可靠，会导致 reward hacking 或错误的训练信号，使得模型学到的策略在真实环境中无效。在实际中，这个假设可能不成立的原因是 helper model 需要同时扮演三个角色，其能力可能不足以准确模拟复杂的企业工作流或正确判断任务是否解决，特别是 coverage judge 需要理解复杂的业务逻辑和工具调用结果，如果 judge 本身有系统性偏差，会导致模型学到错误的行为。论文提供的证据包括：helper 是一个独立的推理服务，不被 policy optimization 更新，以避免数据并行协调失败；在 offline evaluation 中使用独立的 LLM judge 来避免 training-time helper 的失败影响最终 benchmark。然而，论文缺少对 helper model 本身准确性的直接评估，例如 coverage judge 与人类判断的一致性，或 tool emulator 与真实工具输出的一致性，这使得无法确认生成的 reward 信号是否真正可靠。\n\n### § 10 最小复现实验\n\n在一周时间内，可以验证 specification-driven task construction 和 gated coverage reward 是否能提升多轮工具使用能力这一核心 claim。使用公开的 Tau2Bench (Airline domain) 作为工具集合和可执行环境，合成多轮交互数据。实现上，使用一个较小的开源模型如 Llama-3-8B 作为 policy，使用另一个 frozen model 如 GPT-4o-mini 作为 helper（customer simulator 和 coverage judge）。实现 Agent Script 的简化版本或直接合成工作流结构，生成 typed workflow graph。实现 gated coverage reward：coverage rate 乘以 duplicate-call gate，并要求需要数据的子问题必须由工具调用支持。使用 GRPO 进行训练。测量指标是在 BFCL multi-turn 子集或 Tau2Bench 上评估模型的准确率，对比基线模型和经过 RL 训练的模型。如果 RL 训练后的模型在多轮工具使用准确率上显著高于基线（例如提升 5 个百分点以上），则支持 specification-driven RL 能提升多轮工具使用的 claim；如果没有提升或下降，则反驳该 claim。同时观察训练过程中 reward 的稳定性，验证 scale-dependent stability 的发现。", "research_value": "### § 11 最强反例设计\n\n如果我要对 Salesforce Koa 提出最有力的攻击，我会设计一个 **“Helper Distribution Shift”** 实验，以挑战其核心假设：即 frozen helper model 能够准确模拟真实环境并生成可靠的 reward 信号。具体而言，我会质疑论文所观察到的 multi-turn tool use 提升是否真正源于模型掌握了企业工作流的 agentic reasoning，还是仅仅因为 policy 过拟合了 frozen Nano-30B helper 的特定行为分布和 judge 偏好。在这个反例实验中，我会保持训练后的 Salesforce Koa policy 不变，但在评估阶段引入 distribution shift：将训练时使用的 frozen Nano-30B helper 替换为具有不同风格、对话习惯或系统性偏差的另一个 LLM（例如 GPT-4o 或经过不同 post-training 的 Llama 变体）来扮演 customer simulator 和 tool emulator，同时使用独立的人类标注或更强的 frontier model 来充当 ground-truth coverage judge。如果 Salesforce Koa 的核心 claim 成立，即它学到了通用的、spec-driven 的多步工具调用与延迟决策能力，那么在替换 simulator 后其任务完成率应该保持相对稳定。然而，我预测其 performance 会出现断崖式下跌。这一结果将提供一种具体的替代解释：policy 在 GRPO 训练中并未学到真正的环境交互逻辑，而是学到了如何“作弊”或迎合 Nano-30B simulator 的特定交互模式（例如利用其特定的 prompt 弱点套取信息，或生成能被 Nano-30B coverage judge 宽松判定的特定格式响应）。这种 reward hacking 现象在真实的企业部署中是可预测且致命的，因为真实用户的表达方式和企业 API 的异常返回模式远比单一 frozen helper 的分布复杂，一旦脱离这个“温室”环境，模型学到的策略将直接失效。\n\n### § 12 Follow-up Research Idea\n\n基于 Salesforce Koa 依赖静态 frozen helper 导致 simulation-to-reality gap 的核心局限，我提出一个非增量的 novel research idea：**Adversarial Co-evolutionary Spec-Driven RL (ACES-RL)**，将 agent post-training 从“静态环境模拟”重构为“动态对抗博弈”。驱动这一想法的未满足需求是：声明式规范本质上是对真实世界的抽象，而用单一 frozen model 将其具象化为训练环境，必然产生可被 policy 利用的 blind spots，导致 reward hacking。为了打破这一局限，我们可以借鉴 Multi-Agent Reinforcement Learning (MARL) 和 Adversarial Inverse Reinforcement Learning (AIRL) 的思想，将原本静态的 helper 升级为一个具有自身 reward function 的 learnable adversary。在这个新 framing 下，Agent Script 不再仅用于生成固定任务，而是定义了 adversary 的 action space 和约束边界：adversary 的目标是在不违反 spec 逻辑的前提下，主动探索和构造最难、最边缘的 customer persona 或 tool emulator 响应，以最小化 policy 的 grounded reward；而 policy 则试图在对抗性环境中最大化任务完成率。两者的 reward 形成零和或非零和博弈，通过轮流更新实现 co-evolution。第一个实验将设计一个 controlled adversarial training setup：在 Tau2Bench (Airline domain) 上，使用两个同架构的较小模型（如 Llama-3-8B）分别初始化 policy 和 adversarial helper。在每轮 GRPO 中，adversary 先通过 gradient descent 生成使当前 policy 失败率最高的对话前缀和工具异常返回，随后 policy 在此对抗分布上进行 RL 更新。我们将评估这种 co-evolved policy 在面对完全 OOD 的真实人类对话测试集时的 robustness 和 recovery 能率，并与 Salesforce Koa 的 frozen-helper baseline 进行对比。这一提议与已有工作的根本区别在于：它摒弃了 LLM-as-a-judge 或 LLM-as-simulator 中模型固定不变的假设，首次将 declarative agent specification 转化为动态对抗博弈的规则约束，从而将模型训练的焦点从“拟合固定环境”转移到“学习对环境扰动的鲁棒性”，为 enterprise agent 的 post-training 打开了一个全新的自适应方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zixiang Chen\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Sufeng Niu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Yingchi Liu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Wenting Zhao\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Akshara Prabhakar\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Shubham Mehrotra\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Bin Bi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhujun Lan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Katherine Tan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Mohammad Ramezanali\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Tulika Manoj Awalgaonkar\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Monojit Banerjee\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jielin Qiu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shiva Kumar Pentyala\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhepeng Cen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Anupam Tripathi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ali Ziaei\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Regunathan Radhakrishnan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Darvish Lee Shadravan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shelby Heinecke\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Sitaram Asur\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Silvio Savarese\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"James Zhu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Phil Mui\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Huan Wang\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Salesforce Agentforce \u0026 AI Research\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution (co-first authors).\"},\n    {\"marker\": \"†\", \"text\": \"Co-corresponding authors.\"}\n  ]\n}\n```", "summary_translation": "我们提出了 Salesforce Koa，这是一个企业级语言模型，通过使用 Group Relative Policy Optimization (GRPO) 的 reinforcement learning 对 open-weight 的 Nemotron-3-Super-120B foundation model 进行 post-training 构建而成。Salesforce Koa 在公开和合成生成的数据上进行训练，不包含任何客户数据，旨在提高 tool use 和 agentic 能力，同时保持强大的通用性能。其独特的组件是一个 simulation-to-reward pipeline，该 pipeline 将 workflow specifications 扩展为 persona-conditioned 的多轮任务，这些任务的 task-resolution rewards 基于针对数据依赖请求的成功 tool use。对于企业领域，这些 specifications 使用 Agent Script 编写，Agent Script 是 Salesforce 用于构建 Agentforce agents 的 declarative language；对于公开的 tool-use 领域，我们直接合成 workflow structure。相同的 simulation 和 grounded-reward machinery 在两者中驱动 GRPO。在公开的 tool-use、agentic-reasoning 和企业 Customer Relationship Management (CRM) benchmarks 上，Salesforce Koa 相比其 open-weight 基础模型有所提升，在多轮 tool use 上的提升最为明显，并超越了一个强大的专有 baseline，但仍低于最强的 frontier models。这些结果表明，specification-driven reinforcement learning 是将 open-weight foundation models 专门化于企业 agentic 任务的一条实用路径。"}]}]};

const dailyOverviewsRaw = {"2026-09-17": "### 今日AI论文速览 (2026-09-17)\n\n今天的AI研究前沿呈现出明显的“Agentic”转向：从单一模型的推理能力探索，全面过渡到对多智能体协作、长程任务可靠性以及自主执行能力的深度审视。研究者们不仅致力于通过共享记忆和协同进化提升多智能体系统的上限，更将目光聚焦于如何精准定位智能体在长周期任务中的“隐性失败”、构建防作弊的评测体系，以及让代码智能体在真实世界（从游戏到生物实验室）中实现“编译式”自主执行。此外，动态权重生成架构的提出，为LLM摆脱静态预训练限制、实现实时学习提供了全新范式。\n\n---\n\n### 拒绝“刷榜”与捷径：构建更公平、更动态的智能体评测体系\n*(聚类主题: Agent Benchmarking \u0026 Evaluation)*\n\n*   提出了一种名为 **DualViewEval** 的智能体基准压缩方法，通过联合利用结果和过程关系来学习精确大小的最小子集，解决了传统基准评测成本过高的问题。该方法在仅使用20个任务的情况下实现了24倍至40倍的压缩，显著降低了平均绝对误差（MAE），并为智能体能力差异提供了紧凑的诊断反馈。**(2609.18909 [cs.CL])**\n*   针对智能体评测中自动优化框架可能利用任务特定“捷径”作弊的问题，提出了 **CHASE**（反事实框架搜索与进化）方法。该方法通过在保持任务语义不变的反事实协议转换中寻找能破坏性能增益的挑战者，形式化了精确的捷径中和基准，为评测的有效性提供了严格的统计保证。**(2609.18366 [cs.AI])**\n*   针对代码智能体在实际开发中需从已有软件推断行为的问题，提出了 **ProgramDistill** 基准。该工作通过将应用程序分解为不同粒度的特征，并利用“mine-craft-patch”流程自动构建了4063个任务，能够在受控难度下评估和诊断代码智能体在完整或部分应用重构中的表现。**(2609.18805 [cs.AI])**\n\n### 技能复用与动态进化：打破静态知识的局限\n*(聚类主题: Agent Skills \u0026 Knowledge Reuse)*\n\n*   针对当前智能体技能库严重偏向英语、低资源语言检索质量差的问题，提出了 **M-SQE** 多语言技能质量估计框架。该方法通过“理论视图”评估内在质量，通过“行动视图”评估任务效用，显著提升了印地语和斯瓦希里语等低资源语言的任务成功率，推动了智能体技能使用的语言和文化平等。**(2609.18445 [cs.CL])**\n*   针对GUI智能体在动态界面中难以应对突发变化的问题，提出了无训练框架 **EvoSkill-GUI**。该框架将技能视为结构化的多文件包，通过“反思-修改-复用”循环，允许执行器在部署时根据反馈即时修改技能文件，在多个主流GUI基准上实现了高达16.2%的性能提升。**(2609.17653 [cs.AI])**\n\n### 直面长程任务的“隐性失败”：打造可信赖的智能体\n*(聚类主题: Agent Reliability \u0026 Trustworthiness)*\n\n*   针对长程任务中单点错误导致状态破坏和错误累积的问题，提出了 **RIR**（Rollback-Induced Reflection）统一恢复框架。该框架将恢复视为回滚边界控制问题，在将执行状态恢复到先前节点的同时，保留从失败轨迹中提炼的可复用知识，实现了高效的状态修复与经验传承。**(2609.18304 [cs.CL])**\n*   挑战了仅依赖当前推理过程进行置信度估计的传统范式，提出了基于经验的 **XConf** 估计器。通过检索模型过去在相似任务上的历史成功率并让其反思 recurring 失败模式，XConf 在多个基准上以十分之一的生成成本匹配了十次采样自洽的性能，并在智能体任务中显著提升了选择性预测的成功率。**(2609.17708 [cs.CL])**\n*   针对LLM智能体工具调用可能带来不可逆伤害的问题，提出了基于契约的符号时序监督框架 **ContrAgent**。该框架将智能体行为形式化为有限迹线性时序逻辑（LTLf）契约，并编译为确定性有限自动机（DFA），同时支持在线动作门控和离线轨迹评估，提供了确定性且低延迟的安全保障。**(2609.18128 [cs.AI])**\n*   揭示了长程智能体在取得“成功”结果前可能造成数据删除等不可逆伤害的“隐性失败”现象，并发布了包含6967个错误标注的 **Traverse** 基准。研究发现前沿模型难以定位这些失败，而训练的4B验证器 **Scout** 能够精准定位首次错误，并在测试时提升智能体的任务成功率。**(2609.17930 [cs.LG])**\n\n### 从孤岛到共生：多智能体协作的进化与失控边界\n*(聚类主题: Multi-Agent Systems \u0026 Collaboration)*\n\n*   针对Text-to-SQL系统中模式链接和SQL生成任务割裂的问题，提出了基于多智能体强化学习的 **DualSQL** 系统。两个共享权重的智能体在护栏机制下进行联合优化，4B模型即可匹配7B模型的性能，8B模型超越了32B的最先进方案，展现了多智能体联合RL的强大潜力。**(2609.18135 [cs.CL])**\n*   针对多个自主研究智能体从零开始导致搜索重复的问题，提出了以Git作为共享记忆的 **Agora** 系统。研究记录为存储在Git中的无环图（DAG），13个LLM工作者在无中心规划下协作近12天，成功将权重转移问题的评估指标显著降低，证明了共享研究状态能提升计算发现率。**(2609.18094 [cs.CL])**\n*   针对现有混合智能体范式将路由和微调分离的局限，提出了迭代强化学习框架 **CERA-MoA**。该框架通过预测熟悉度估计器和累积阈值自适应路由机制，使动态路由器和独立智能体策略协同进化，在任务性能和效率之间取得了出色平衡。**(2609.18779 [cs.AI])**\n*   探讨了多智能体博弈中LLM的上下文学习（ICL）究竟是递归推理还是统计外推。通过公共物品博弈实验发现，当历史统计模式被破坏时，长上下文的优势消失，表明在此类战略环境中，ICL行为更符合**统计外推**而非真正的战略推理。**(2609.18591 [cs.AI])**\n*   以流行病学视角解释了多智能体系统如何从局部偏差演变为集体失控。提出了由意外突变、传染和恢复组成的机制，并发布了 **RogueHandoff-20** 基准，证实了即使基线危害很低，智能体在接收到注入的不安全轨迹后也具有极高的易感性。**(2609.18460 [cs.AI])**\n\n### 编译即智能：代码智能体在游戏与实验室中的自主执行\n*(聚类主题: Coding Agents \u0026 Autonomous Execution)*\n\n*   提出了 **Gauntlet** 框架，测试前沿代码智能体能否在无辅助的情况下从零开始构建游戏玩家。智能体仅接收原始观察/动作接口，在单次会话中自主实验并编写独立控制器，成功在《星际争霸2》和《文明》等完整商业游戏中获胜，展示了将开发经验编译为持久可执行智能体的**编译式代理**能力。**(2609.18996 [cs.CL])**\n*   针对生物实验室自动化需求，构建了可复现的机器人套件 **WetRobo**。与易受环境变化影响的VLA策略不同，WetRobo结合代码智能体（如gpt-5.6-sol），通过自然语言指令和AGENTS.md技能文件直接在真实实验室中编写执行程序，成功完成了开培养皿盖、拧瓶盖等任务，展现了代码智能体跨实验室迁移的实用性。**(2609.18435 [cs.AI])**\n\n### 突破静态预训练：无限参数LLM的实时权重生成\n*(聚类主题: LLM Architecture \u0026 Scaling)*\n\n*   挑战了模型权重在训练后冻结的传统设定，提出了 **Infinite-Parameter LLM** 架构。受MoE启发，该模型使用紧凑的超网络将运行时的实时数据转化为共享基础网络的低秩调制，并通过在线更新贝叶斯信念持续演化权重，实现了将运行时知识写入权重的计算摊销，释放了上下文窗口并提升了泛化能力。**(2609.18842 [cs.AI])**\n\n---\n\n### 今日看点\n\n*   **“编译式智能体”的崛起**：今天最令人瞩目的趋势是代码智能体从“辅助生成代码”向“自主编译完整策略”的跨越。无论是Gauntlet框架下独立攻克《星际争霸2》和《文明》的智能体，还是在真实生物实验室中自适应操作硬件的WetRobo，都表明前沿LLM已经具备了在复杂环境中进行长程策略探索并将其固化为可执行程序的能力。这为具身智能和自主系统提供了一条绕过昂贵VLA模型微调的新路径。\n*   **长程任务中的“隐性失败”与可靠性危机**：多篇论文直击智能体落地的核心痛点——可靠性。Traverse基准揭示了智能体在“看似成功”的过程中可能造成数据删除等不可逆伤害；RIR和XConf则分别从状态回滚和经验置信度估计的角度提出缓解方案。这表明学界正从单纯追求任务成功率，转向对智能体执行过程的细粒度监控与安全干预。\n*   **多智能体系统的“社会学”审视**：多智能体研究正在从单纯的性能堆叠走向更深层的机制反思。Agora证明了共享记忆（Git DAG）能避免重复劳动并促进集体发现；而“Collective Loss of Control”则用流行病学模型警告了多智能体系统中错误策略“传染”的巨大风险。此外，关于ICL在博弈中究竟是“推理”还是“统计外推”的证伪，为LLM的推理能力边界敲响了警钟。\n*   **架构创新：让模型在推理时“学习”**：Infinite-Parameter LLMs提出了一种极具潜力的新范式。不同于将知识塞入Prompt的RAG，该架构通过超网络在推理阶段根据实时交互动态生成并更新权重。这种将上下文学习“内化”为权重更新的方法，可能从根本上改变我们处理长对话和个性化部署的方式。", "2026-09-16": "### 今日AI论文速览 (2026-09-16)\n\n今天的AI研究前沿呈现出强烈的“具身化”与“长程化”趋势，核心焦点正从单次模型推理转向智能体在复杂、持续交互环境中的行为优化。我们观察到，记忆系统正在经历从静态存档到动态重组的范式转移，借鉴认知神经科学的“再巩固”机制成为突破长周期对话瓶颈的关键。同时，针对多轮交互的工具调用训练和更贴近真实工业场景（如CAD设计与实时数据科学）的严苛评估，暴露出当前智能体在可靠性、捷径学习及评估方法论上的深层缺陷，预示着下一代智能体研究将更侧重于可验证性与持续进化能力。\n\n#### 一、 效率与可靠性：重塑智能体工具调用与训练范式\n- 针对RL训练的LLM智能体常因表面线索产生**虚假工具调用**的捷径学习问题，研究揭示了任务胜任力是产生该现象的关键因素。为此，研究者引入了由LLM评判器评估每次调用必要性的**工具必要性奖励**，在有效抑制基于线索的虚假调用的同时保持了任务性能。**(2609.16268 [cs.CL])**\n- 针对复杂多轮任务中的对齐难题，提出了**回合级多尺度密度比估计**。该方法通过在多轮交互中为不同回合分配不同权重，并基于正负样本空间差距进行非对称的token级训练，显著提升了LLM在多轮推理任务中的鲁棒性及跨域泛化能力。**(2609.16760 [cs.AI])**\n- 针对弱开源代码智能体在竞技场交互中的策略劣势，提出了**ReAct SFT**和**轨迹质量加权SFT**。通过将教师轨迹重写为显式的[obs][thought][act]链并鼓励编辑后检查，成功提升了Qwen3-Coder-30B的战略适应能力，使其在锦标赛评估中超越原版更强模型。**(2609.16096 [cs.AI])**\n\n#### 二、 记忆的进化：从被动存档到主动重组的长期智能体记忆\n- 突破传统记忆系统将检索作为终点的局限，提出了受认知神经科学启发的**REALM**框架。该框架通过异构认知图谱自主组织记忆，并利用检索反馈持续**再巩固**记忆，在LoCoMo和LongMemEval基准上大幅超越基线，证明了检索驱动记忆重组的有效性。**(2609.16053 [cs.CL])**\n- 将记忆机制从被动存档转变为可学习的交互策略，提出了多智能体框架**ICML**。通过Planner智能体选择性编码和Trigger智能体动态检索，结合延迟奖励机制将未来反馈回传，实现了两个智能体的共同进化，使响应质量随交互积累持续提升。**(2609.17088 [cs.CL])**\n- 针对显式文本记忆管道的信息瓶颈，提出了端到端潜在记忆框架**ThinkFlow**。它将对话流动态压缩为**概率潜在记忆技能**，绕过文本瓶颈，并通过教师引导的潜在对齐与自监督预测实现测试时进化，成功克服冷启动并实现无标签的终身个性化。**(2609.17010 [cs.CL])**\n- 针对GUI智能体重复操作的效率问题，引入了模型无关的执行级可重放记忆框架**EchoPath**。它将经过验证的GUI轨迹转化为标准化、参数控制的**可调用记忆**，通过基于图像的目标重瞄准算法实现确定性重放，将中位token成本降低90%以上。**(2609.16635 [cs.AI])**\n\n#### 三、 情感与社会推理：构建可持续的陪伴与社会化智能体\n- 为解决社会推理缺乏可验证基准真相的问题，引入了多智能体仿真框架**Fuse**。该框架通过构建带有隐藏动机的目标智能体，为用户介导的社会推理提供了可验证的评估基础，并揭示了LLM对用户偏见框架的系统性敏感及对冗长对话的无效依赖。**(2609.17496 [cs.CL])**\n- 部署了基于理论的情感调节伴侣**PAIR**并进行为期14天的纵向研究。研究发现，跨会话的**记忆更新和纠正保留**是实现持续情感支持个性化的关键，且参与者感知到的帮助随时间显著增加，为自适应情感工具提供了设计准则。**(2609.16344 [cs.AI])**\n- 探讨了AI智能体社交网络中的**语义坍塌**现象。通过对MOLTBOOK平台的研究发现，少数能维持高新颖性的智能体得益于用户主动提供广泛且独特的素材，这表明人类持续的探索性输入与干预是抵抗AI输出同质化的关键。**(2609.16051 [cs.AI])**\n\n#### 四、 连续时间与符号策略：突破多模态与交互式智能体边界\n- 打破LLM语音智能体僵化的“听-想-说”循环，实现了**连续时间认知**。研究引入**ReactiveBench**并发现，基于可验证目标的在策略RL能同时提升所有正确性维度，而LLM评判器可能会错误奖励“可见推理”导致模型客观完成度下降。**(2609.17416 [cs.AI])**\n- 针对视觉生成任务泛化性差的问题，提出了基于**符号策略学习**的**OmniHarness**框架。它将验证过的执行抽象为符号策略，并通过自我导向探究在任务下达前自主练习，在ComfyBench创意任务上达到95.0%的解决率，且支持即插即用。**(2609.16057 [cs.AI])**\n\n#### 五、 超越静态评估：面向真实复杂工作流的智能体基准测试\n- 针对实时数据科学任务中静态参考答案失效的问题，提出了**ground-truth-as-code**评估框架。它将期望答案编码为可执行参考函数，结合格式无关的事实级评判器，有效解决了非平稳数据下多源整合智能体的评估难题。**(2609.16487 [cs.AI])**\n- 推出了面向长周期计算机辅助设计的基准测试**CADWorld**。包含200个涵盖草图、零件建模到CAM等11类工作流的FreeCAD任务，揭示了当前最强智能体（17.5%成功率）与人类专家（87.0%）在持久、可验证工程工作流上的巨大差距。**(2609.16251 [cs.AI])**\n\n### 今日看点\n\n- **记忆系统的“认知化”浪潮**：今天的多篇论文（REALM, ICML, ThinkFlow, EchoPath）标志着智能体记忆正从简单的向量检索向复杂的认知图谱、潜在空间压缩和执行级重放演进。借鉴认知科学的“再巩固”机制和“预测编码”正在成为打造终身学习智能体的核心范式。\n- **颠覆性观点：LLM评判器的“可见推理”陷阱**：《Never Stop Thinking》揭示了一个反直觉现象：LLM评判器倾向于奖励“可见的推理过程”，导致在连续时间思考中，被评判为“有优势”的模型在客观任务完成度上反而更差。这警示我们，在复杂智能体训练中，过度依赖LLM作为奖励信号可能会诱导模型学会“表演思考”而非真正解决问题。\n- **跨界融合：认知神经科学与大模型架构的深度交汇**：ThinkFlow将认知科学中的“潜在空间心理模型”与“预测编码”引入LLM，通过将对话流压缩为概率潜在记忆技能，巧妙绕过了显式文本记忆的信息瓶颈，为终身个性化提供了极具潜力的无标签学习路径。\n- **潜力技术：将“经验”转化为“API”的执行级记忆**：EchoPath提出了一种将GUI操作轨迹转化为标准化、参数化“可调用工具”的方法。这种将历史操作确定性重放的机制不仅将token成本暴降90%，更为企业级重复性GUI任务提供了一种极具落地价值的自动化新范式。", "2026-09-15": "### 今日AI论文速览 (2026-09-15)\n\n今日的AI研究前沿呈现出强烈的“智能体化”趋势，核心焦点全面转向如何让大模型在复杂、多轮、长周期的任务中更高效地行动与协作。从底层的KV缓存驱逐与推理时记忆分配，到上层的技能路由与多环境强化学习调度，研究者们正致力于突破智能体在算力、上下文和训练成本上的瓶颈。此外，多智能体动态协作在自动化学术综述和前沿数学证明中展现出巨大潜力，标志着LLM正从单纯的对话工具演变为自主的研究引擎。\n\n---\n\n### 精准调度：挖掘LLM内置的技能路由与工具使用潜能\n\n- **The Router Within: Eliciting Native Skill Routing from a Frozen LLM**\n  传统智能体依赖将所有技能元数据预加载到上下文中进行路由，这严重分散了模型注意力并限制了技能库规模。本研究提出**Gavel**，证明了冻结的LLM在其前向传播中已自带路由信号，仅需两个线性映射即可在无技能文本注入上下文的情况下读取该信号。该方法在Qwen3-32B上零样本迁移表现优异，甚至超越了增加数十亿外部参数的检索重排管线。**(2609.15982 [cs.LG])**\n\n- **Salesforce Koa: An Enterprise Language Model for Agentic Tool Use**\n  针对企业级智能体工具使用场景，Salesforce提出了**Koa**模型，通过**GRPO**强化学习对开源的Nemotron-3-Super-120B进行后训练。其核心创新在于**simulation-to-reward**流水线，利用声明式语言**Agent Script**将工作流规范扩展为多轮任务，并以成功的工具调用作为接地奖励。该模型在多轮工具使用基准上取得显著提升，证明了规范驱动的RL是专用于企业智能体任务的有效路径。**(2609.15066 [cs.LG])**\n\n### 群体智能：多智能体协作攻克长周期复杂任务\n\n- **Assembling the CREW: A Collaborative Multi-agent Reinforcement Learning Framework for Automated Related Work Generation**\n  现有多智能体LLM系统通常依赖预定义的静态工作流，难以应对复杂文献合成的动态需求。本文提出**CREW**框架，让LLM智能体摆脱启发式管线，通过**IPPO**优化的策略自主选择检索、传播、撰写和批判等动作。实验表明，这种动态协作机制在大幅降低Token成本的同时，显著提升了相关工作生成的质量。**(2609.15721 [cs.LG])**\n\n- **Stellar Colosseum: A Many-Agent Harness for Long-Horizon Research in Mathematics and Theoretical Computer Science**\n  应对长周期数学和理论计算机科学研究中的不确定性，本研究提出了模型无关的**Stellar Colosseum**框架。该系统通过就绪门控决定策略成熟度，将证明计划分解为相互依赖的子问题，并结合并行生成、定向证伪与重叠随机采样树聚合来整合研究产物。结合Gemini 3.1 Pro，该系统在TCS-Bench上达到71.0%准确率，并成功解决了多篇顶会论文遗留的开放性问题。**(2609.15983 [cs.LG])**\n\n### 记忆与效率：突破智能体推理的上下文与算力瓶颈\n\n- **AgentKV: Phase-Aware KV Eviction for Agentic LLMs**\n  智能体生成涉及思考、行动、工具调用等不同阶段，传统基于近期查询的KV缓存驱逐方法会系统性地低估未来阶段所需的键值。本文提出**AGENTKV**，为每个阶段维护独立的查询缓冲区并联合评分缓存键，同时支持跨轮次的持久化压缩。该方法在多种任务和KV预算下显著优于R-KV等基线，相对全量KV的SGLang实现了最高1.80倍的吞吐量提升。**(2609.14872 [cs.LG])**\n\n- **LIMBO: Lifelong Inference-Time Memory and Budget Optimization for LLM Agents**\n  终身学习智能体在注入历史经验时，面临有限的Prompt和算力预算分配难题。本文首次将此定义为“推理时记忆分配”问题，并提出在线框架**LIMBO**。该框架将记忆视为可控资源，在单次前向传播中在线学习并联合优化记忆策略与推理预算，无需修改模型权重。在大幅降低推理成本（平均约53%）的情况下，实现了与最强基线相当的精度。**(2609.14138 [cs.LG])**\n\n### 淬炼与提纯：加速多轮智能体的训练与蒸馏过程\n\n- **Know When to Stop, Where to Restart: Accelerating Multi-Turn Agentic On-Policy Distillation**\n  多轮智能体策略蒸馏（OPD）的成本受限于自回归Rollout的长度，现有截断方法依赖固定预算且忽略了教师信号可靠性的时序变化。本研究提出**STRIDE**，结合自适应早停机制和前缀缓冲区，在学生模型出现首个错误动作时精准重启生成。这种数据驱动的课程学习机制在保持甚至超越教师模型性能的同时，实现了最高5.10倍的加速。**(2609.14636 [cs.LG])**\n\n- **HarnessBandit: Joint Learnability-Transferability Scheduling for Multi-Harness Agentic Reinforcement Learning**\n  同一模型在不同智能体框架（Harness，如系统提示、工具格式不同）下表现差异巨大，多框架联合训练面临调度难题。本文提出在线调度器**HarnessBandit**，在GRPO更新后综合评估当前框架的**可学习性**与向其他框架的**可迁移性**。通过融合这两种动态信号进行采样，该方法有效提升了策略在未见任务和未见框架上的鲁棒性。**(2609.13739 [cs.LG])**\n\n---\n\n### 今日看点\n\n- **向内挖掘而非向外堆料**：Gavel的发现令人瞩目，它证明了冻结的LLM内部已经隐含了强大的技能路由能力。这挑战了当前主流“外挂检索器或扩充上下文”的范式，提示我们在增加外部复杂组件前，应先尝试激活模型自身的原生潜能。\n- **智能体基础设施的精细化运营**：从AGENTKV的阶段感知缓存到LIMBO的在线记忆预算分配，再到STRIDE的自适应早停，今天的多篇论文显示出“智能体优化”正从高层的算法策略向底层的显存管理、算力调度和时序控制深入。系统级工程优化正成为提升智能体能效比的关键驱动力。\n- **强化学习重塑多智能体协作**：无论是CREW在文献综述中的动态动作选择，还是HarnessBandit在多框架间的梯度迁移调度，RL正在取代预先设定的静态启发式规则。这标志着多智能体系统正从“机械式流水线”向具备自适应协作策略的“有机体”演进。\n- **LLM作为科研长周期推演的引擎**：Stellar Colosseum在FOCS/STOC级别的理论计算机问题上取得突破，并解决了真实的开放性学术问题。这不仅是Benchmark分数的提升，更是LLM从“代码助手”向“能够进行长链条不确定推理的科研合作者”跨越的重要里程碑。"};

        let isLoadingMore = false; // 是否正在加载更多
        let activeTagFilters = {}; // {date: Set of active tag names}

        // 获取未加载的日期（只在两周展示窗口内分页；窗口外日期不进入"加载更多"，

        function getUnloadedDates() {

        }

        // Tag filter toggle
        function toggleTagFilter(date, tagName) {
            if (!activeTagFilters[date]) activeTagFilters[date] = new Set();
            const filters = activeTagFilters[date];
            if (tagName === 'All') {
                filters.clear();

                filters.delete(tagName);

                filters.add(tagName);

            renderPapers();

        // Check if paper matches active tag filters for its date
        function paperMatchesFilters(paper, date) {
            const filters = activeTagFilters[date];
            if (!filters || filters.size === 0) return true;
            if (filters.has(paper.cluster)) return true;
            return (paper.tags || []).some(tag => filters.has(tag));
        }

        // 加载更多日期的数据
        async function loadMoreDates() {
            if (isLoadingMore) return;

            const unloadedDates = getUnloadedDates();
            if (unloadedDates.length === 0) {
                showSimpleToast('已加载全部数据');
                return;
            }

            isLoadingMore = true;
            const loadBtn = document.getElementById('load-more-btn');
            if (loadBtn) {
                loadBtn.disabled = true;
                loadBtn.innerHTML = '<span class="animate-spin inline-block mr-2">⏳</span>加载中...';
            }

            const datesToLoad = unloadedDates.slice(0, LOAD_MORE_DAYS);

                    if (!response.ok) continue;

                    // 将数据添加到 allPapers

        // 从localStorage加载状态

        // 显示撤销删除的Toast
        function showUndoToast(message, seconds, onUndo, onExpire) {
            const toast = document.getElementById('undo-toast');
            const msgEl = document.getElementById('toast-message');
            const cdEl = document.getElementById('countdown');
            const undoBtn = document.getElementById('undo-btn');

            msgEl.textContent = message;
            let remaining = seconds;
            cdEl.textContent = `(${remaining}s)`;
            toast.classList.remove('hidden');

            let intervalId = setInterval(() => {
                remaining -= 1;
                cdEl.textContent = `(${remaining}s)`;
                if (remaining <= 0) {
                    clearInterval(intervalId);
                    toast.classList.add('hidden');
                    try { onExpire && onExpire(); } catch (e) {}
                }
            }, 1000);

            let expireTimer = setTimeout(() => {
                clearInterval(intervalId);
                toast.classList.add('hidden');
                try { onExpire && onExpire(); } catch (e) {}
            }, seconds * 1000);

            const cleanup = () => {
                clearInterval(intervalId);
                clearTimeout(expireTimer);
                toast.classList.add('hidden');
            };

            const onUndoClick = () => {
                cleanup();
                try { onUndo && onUndo(); } catch (e) {}
            };

            undoBtn.removeEventListener('click', onUndoClick);
            undoBtn.addEventListener('click', onUndoClick);
        }
