in liquid cooling, it improves the agent accuracy from 0.652 under full provision to 0.715 and achieves accuracy comparable to Reflexion with 48% fewer tokens; In power grids, full provision remains accuracy-optimal, while map-based provisioning offers lower-cost alternatives. These findings show that harness provisioning follows a domain-dependent accuracy-cost Pareto frontier rather than a universal optimum.", "category": "cs.AI", "cluster": "Agent Infrastructure \u0026 Harnessing", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在关键基础设施（Mission-Critical Infrastructure, MCI）运维场景中，如何为大型语言模型（LLM）智能体确定执行特定任务所需的**最小充分 Harness（工具与信息配置）**，即建立从任务类别到 Harness 配置的精确映射（Task-to-Harness Mapping）。传统做法通常采用“一刀切”策略，为所有任务提供相同的、最全面的 Harness（Full Provision），这种做法不仅造成计算资源（Token 消耗、延迟）的浪费，还因暴露过多系统数据而增加信息安全隐患。然而，过度精简的 Harness 又可能导致智能体因缺乏必要上下文而无法可靠执行任务。因此，该问题本质上是一个在任务成功率、经济成本（Token/Latency）和信息安全性之间寻求平衡的资源匹配问题。\n\n解决这一问题的重要性在于，MCI 系统（如电力网、液冷数据中心）的运维对可靠性要求极高，同时运维成本巨大。现有的 LLM 智能体在 MCI 中的应用往往忽视了 Harness 配置的动态适应性，导致要么因资源冗余而效率低下，要么因资源不足而失败。通过识别不同任务类别（基于物理系统的数学表示，如观测信号、潜在状态、系统机制）对信息需求的差异，可以实现**任务感知的 Harness 供给（Task-Aware Harness Provisioning）**。其价值体现在三个方面：首先，显著降低运营成本，例如在液冷场景中，提出的 Map-Guided Escalation 策略在保持甚至提升准确率的同时，比全量供给减少了 48% 的 Token 消耗；其次，通过限制不必要的数据暴露，提升了系统的安全性；最后，揭示了 Harness 供给并非存在通用的最优解，而是遵循依赖于领域的准确率-成本帕累托前沿（Pareto Frontier），为不同场景下的智能体部署提供了理论依据和工程指导。\n\n### § 2 前人工作与不足\n\n尽管已有大量研究致力于提升 LLM 智能体的性能，但针对 MCI 运维中 Harness 供给的精细化控制仍显不足。现有的相关工作主要可以分为三类，它们各自存在明显的局限性：\n\n第一类是**基于检索或路由的资源选择方法**，如 ToolLLM、AnyTool、Instruction-Tool Retrieval (ITR) 以及 RouteLLM。这些方法通过语义相关性检索任务相关的 API 或指令，或者根据预测需求动态分配计算能力。然而，这些方法的核心缺陷在于它们通常**推断**什么资源“可能”有用，而不是**测量**什么资源“实际”足够。例如，ITR 虽然能根据语义相关性检索资源，但其 Token 消耗仍接近全量供给，未能实现真正的成本优化；而基于 LLM 判断的路由方法（如 LLM-Route）往往准确率较低，且引入了额外的路由调用开销。它们缺乏对任务本质需求与 Harness 提供能力之间匹配关系的系统性度量。\n\n第二类是**执行侧的优化方法**，如 ReAct、Reflexion 和 ExpeL。这些方法侧重于改变智能体在给定环境下的推理、学习或反应机制，例如通过自我反思（Reflexion）或经验检索（ExpeL）来改进执行过程。虽然这些方法能有效提升智能体在固定 Harness 下的表现，但它们**假设 Harness 是固定且充足的**，并未解决 Harness 本身配置不当的问题。在 MCI 场景中，如果初始 Harness 缺乏关键的结构或物理信息，仅靠执行侧的优化无法弥补信息缺失，且这些方法通常伴随着高昂的 Token 成本（如 Reflexion 需要多次重试）。\n\n第三类是**Harness 的设计、评估与治理研究**，如 HarnessBench、Progent 和 AgentSandbox。这些工作将 Harness 视为一个独立的系统层，关注其表示、优化、跨配置评估或权限控制。然而，它们主要关注 Harness 的静态属性或安全边界，**未解决“对于固定执行器和重复任务类别，何种 Harness 供给是保持执行性能的充分条件”这一动态匹配问题**。它们缺乏从任务需求出发，逆向推导最小充分 Harness 的机制。\n\n综上所述，前人工作要么侧重于资源的相关性检索而非充分性测量，要么侧重于执行过程的优化而非供给侧的适配，要么关注 Harness 的静态治理而非动态匹配。本文指出的关键缺口在于：缺乏一种基于任务数学表示（如目标元素、时间、输出模式）的系统性分类方法，以及缺乏一种通过文献挖掘和控制实验来实证测量任务与 Harness 之间映射关系的方法。正是由于缺乏这种对“任务需求”与“Harness 供给”之间可比表示的定义和测量，导致现有系统无法实现精确的、成本最优的 Harness 供给。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM Agent 应用于 Mission-Critical Infrastructure (MCI) 运维时，现有的主流做法往往陷入“一刀切”的困境：要么为了保险起见，默认赋予 Agent 最高权限的 Harness（Full Provision），导致 Token 消耗巨大、延迟高且存在不必要的数据暴露风险；要么依赖动态路由（如 RouteLLM）或检索增强（如 ITR），但这些方法通常基于语义相关性或启发式规则来“猜测”所需资源，而非基于任务执行的“充分性”进行测量。作者观察到，MCI 任务具有明确的物理系统背景，传统的任务标签（如 Detection, Diagnosis）定义模糊且跨领域不一致，无法作为精确的资源匹配依据。因此，作者意识到必须从物理系统的数学本质出发，重新定义任务空间，将其解构为对可观测信号、隐状态或系统机制在不同时间点的查询或干预。与此同时，Harness 提供的资源也可以被量化为从纯模型推理到前向模拟的累积层级。既然任务需求和资源供给都可以被结构化表示，那么核心问题就转化为一个资源匹配问题：是否存在一个从任务类别到最小充分 Harness 的映射？通过挖掘大量文献和构建受控实验环境，作者发现这种映射不仅存在，而且具有领域依赖性。基于此，作者提出不应盲目追求最大权限，而是利用这种映射关系，结合自我检查机制，实现一种“按需升级”的 Harness 供给策略，从而在准确性、成本和安全性之间找到更优的 Pareto 前沿。\n\n### § 4 核心 Intuition\n\n这篇论文的核心直觉在于，LLM Agent 在关键基础设施运维中的资源需求并非由语义相关性决定，而是由任务对物理系统状态的依赖深度决定的。通过从物理方程中推导出的任务分类与累积式 Harness 层级进行匹配，可以精确识别出每个任务类别所需的“最小充分资源”，从而避免过度供给带来的成本和安全风险。这种方法之所以有效，是因为它用实测的“执行充分性”替代了传统的“语义相关性”猜测，并通过自我检查触发的条件升级机制，在保证高准确率的同时显著降低了 Token 消耗。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出了一种**Task-Aware Harness Provisioning**（任务感知的 Harness 配置）方法，旨在为 LLM Agent 在关键基础设施运维（MCI O\u0026M）中动态分配最小必要资源，以平衡准确性、成本和安全性。其核心 Pipeline 包含以下三个主要阶段：\n\n1.  **定义任务空间与 Harness 空间（Space Definition）**：\n    *   **任务分类**：基于物理系统的数学表示，将任务分解为三个维度：输出模式（Output Mode, $\\omega$：Inform 报告信息或 Act 执行干预）、目标时间（Target Time, $\\tau$：Now 当前或 Future 未来）、目标元素（Target Element, $e$：Observable signals 可观测信号、Latent states 隐状态、System mechanisms 系统机制）。这构成了 $2 \\times 2 \\times 3 = 12$ 个标准任务类。\n    *   **Harness 层级**：定义五个累积的资源层级（$K_1$ 到 $K_5$），从仅模型参数知识（$K_1$）逐步增加到静态知识（$K_2$）、时序观测数据（$K_3$）、结构物理模型（$K_4$），直至前向仿真能力（$K_5$）。\n\n2.  **构建任务到 Harness 的映射（Map Construction）**：\n    *   **文献映射（Literature-Derived Map）**：通过分析 1,200+ 篇 MCI 研究论文，统计不同任务类在现有研究中通常使用的最高 Harness 层级，形成先验分布。\n    *   **执行映射（Execution-Derived Map）**：在两个仿真环境（液冷数据中心和电网）中，对 240 个验证过的任务进行控制实验。固定 Agent 执行器，遍历 $K_1-K_5$ 所有层级，记录每个任务类在不同层级下的平均准确率。选取能达到“接近最佳性能”（误差容忍度 $\\epsilon=0.05$）的最低 Harness 层级作为该任务类的推荐配置。\n\n3.  **Map-Guided Escalation 策略（部署阶段）**：\n    *   **初始选择**：当新任务到来时，首先将其分类到 12 个任务类之一，然后查表获取执行映射中推荐的初始 Harness 层级（例如 $K_3$）。\n    *   **执行与自检**：Agent 在初始 Harness 下执行任务，并进行 Self-Check（自检）。\n    *   **条件升级**：如果自检通过，直接输出结果；如果自检失败，则触发升级机制，将 Harness 提升至最高层级 $K_5$，保留之前的中间发现（findings），重新执行任务。\n\n**真实例子讲解：液冷数据中心故障诊断**\n\n*   **输入**：运维人员询问：“当前机架 A4 的出口水温是多少？”（这是一个 Inform-Now-Signal 任务，即 $\\langle \\text{Inform}, t, y \\rangle$）。\n*   **处理**：\n    1.  **分类**：系统识别该任务属于 `I-N-S` 类。\n    2.  **查表**：根据执行映射（Exec-Map），`I-N-S` 类在液冷环境中通常只需 $K_3$（时序观测数据）即可达到最佳性能，无需复杂的物理模型或仿真。\n    3.  **初始执行**：Agent 仅被赋予访问实时遥测数据（Telemetry）的权限（$K_3$），查询数据库获取当前温度值。\n    4.  **自检**：Agent 检查返回的数据是否完整且符合物理常识（如温度范围合理）。假设自检通过。\n*   **输出**：Agent 直接返回温度值，无需调用昂贵的仿真引擎（$K_5$）或加载复杂的拓扑结构（$K_4$），从而节省了 Token 和延迟。\n\n*   **对比案例**：如果任务是“如果将泵速提高到 4500 rpm，最热点会降多少？”（Act-Future-State），映射可能指向 $K_5$。若初始配置较低导致自检失败，系统会自动升级至 $K_5$ 进行仿真计算。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的理论证明或新的算法收敛性推导，其核心在于**形式化定义**和**映射规则**。以下是关键概念的数学直觉解释：\n\n1.  **任务的形式化表示**：\n    论文将物理系统抽象为状态方程：\n    $$ y_t = h(x_t, m_t, \\xi_t) $$\n    $$ x_{t+1} = f(x_t, a_t, d_t, \\epsilon_t) $$\n    其中 $y_t$ 是可观测信号，$x_t$ 是隐状态，$m_t$ 是系统机制（拓扑、方程等）。\n    *   **Intuition**：任何运维任务本质上都是在查询或影响这三个变量中的某一个，在某个时间点（当前或未来），以某种方式（报告或行动）。这为任务分类提供了统一的数学基础，避免了传统标签（如“检测”、“诊断”）在不同领域定义不一致的问题。\n\n2.  **映射选择规则**：\n    对于执行映射，定义支持度 $A_{exec}(T, K) = \\mu_{exec}(T, K)$，即任务类 $T$ 在 Harness 层级 $K$ 下的平均得分。\n    映射函数 $G_{exec}(T)$ 选择满足以下条件的最小 $K$：\n    $$ \\mu_{exec}(T, K) \\ge \\max_{K'} \\mu_{exec}(T, K') - \\epsilon_{exec} $$\n    *   **Intuition**：我们不需要找到绝对最好的层级，而是找到“足够好”的最低层级。$\\epsilon_{exec}$ 是一个容忍度（设为 0.05），意味着只要性能损失不超过 5%，我们就选择更便宜的资源。这体现了“最小充分性”原则。\n\n3.  **Map-Guided Escalation 逻辑**：\n    初始层级 $K_0 = G_{exec}(T(q))$。\n    最终输出 $o_{final}$ 取决于自检结果 $c_0$：\n    $$ o_{final} = \\begin{cases} o_0 \u0026 \\text{if } c_0 = \\text{pass} \\text{ or } K_0 = K_5 \\\\ o_{retry} \u0026 \\text{otherwise} \\end{cases} $$\n    *   **Intuition**：这是一个两阶段决策过程。第一阶段利用统计规律（Map）进行低成本尝试；第二阶段利用个体差异（Self-Check）进行保险式升级。它假设类级别的映射对大多数实例有效，但对少数困难实例，通过升级到全资源（$K_5$）来保证可靠性。\n\n### § 7 实验设计与结论\n\n**提出了什么问题？**\n1.  **RQ1**：不同的任务类别是否真的需要不同的 Harness 配置？更多的资源是否总是带来更好的性能？\n2.  **RQ2**：如何可靠地估计任务到 Harness 的映射？文献先验和实际执行证据哪个更准确？\n3.  **RQ3**：在部署时，应如何操作这个映射？是直接查表（Lookup）还是结合自检升级（Escalation）？\n4.  **RQ4**：这种映射关系是否具有跨领域和跨模型的泛化能力？\n\n**设计了什么实验验证这个问题？**\n*   **环境构建**：构建了两个高保真仿真环境：液冷数据中心（Liquid Cooling）和 IEEE-14 电网（Power Grid）。\n*   **基准测试**：生成了 240 个经过人工和程序验证的任务，覆盖 12 种任务类，每种 10 个实例。\n*   **全量扫描**：对每个任务在 $K_1$ 到 $K_5$ 五个层级下分别运行相同的 LLM Agent（GPT-5.4），记录准确率和成本。\n*   **对比基线**：与固定全资源（Full-$K_5$）、基于语义检索的工具选择（ITR）、LLM 路由（LLM-Route）、以及执行侧优化方法（Reflexion, ExpeL）进行对比。\n*   **泛化测试**：将基于 GPT-5.4 训练的映射直接应用于 Qwen3.5-27B，测试跨模型迁移效果。\n\n**问题的答案是什么？**\n*   **RQ1 答案**：是的，任务需求差异显著。性能并非随资源增加单调提升，在某些任务类中，过多资源（如 $K_5$）反而因引入噪声或增加计算开销导致性能下降或成本激增。不存在通用的“最佳”配置，而是存在领域依赖的 Accuracy-Cost Pareto Frontier。\n*   **RQ2 答案**：文献映射提供了有用的先验，但执行映射（Execution-Derived Map）更准确地反映了特定 Agent 和环境下的实际需求。在电网场景中，执行映射显著优于文献映射。\n*   **RQ3 答案**：Map-Guided Escalation 策略效果最佳。在液冷场景中，它将准确率从全资源的 0.652 提升至 0.715，同时 Token 使用量比 Reflexion 少 48%。在电网场景中，虽然全资源准确率最高，但执行映射提供了更低成本的 Pareto 有效替代方案。\n*   **RQ4 答案**：映射关系具有较好的泛化性。基于 GPT-5.4 构建的映射直接迁移到 Qwen3.5-27B 时，在液冷场景中提升了准确率，在电网场景中保持接近的性能，证明了任务-资源需求的内在稳定性。", "additional_insights": "### § 8 Take-aways\n\nLLM Agent 在关键基础设施运维（MCI O\u0026M）中的性能瓶颈并非仅在于模型推理能力，更在于 **Harness Provisioning**（即向 Agent 暴露的信息、工具和权限配置）与具体任务需求之间的匹配效率。传统的“全量提供”（Full Provision）策略不仅造成 Token 和计算资源的浪费，还可能因引入无关上下文或过度复杂的工具链而导致性能下降（Over-provisioning backfire）。论文提出将 Harness 配置视为一个可测量的资源匹配问题，通过构建基于物理系统数学表示的 **Task Space**（由输出模式、目标时间、目标元素定义的 12 类任务）和累积式的 **Harness Space**（从 K1 纯模型推理到 K5 正向仿真），建立了任务类别与最小充分 Harness 级别之间的映射关系。通过挖掘 1,200+ 篇文献和 240 个受控实验任务，研究发现不同任务类别对 Harness 的需求存在显著差异，且这种需求具有领域依赖性（Domain-dependent），不存在通用的最优配置。提出的 **Map-Guided Escalation** 策略利用执行数据驱动的映射表初始化 Harness，仅在自我检查失败时升级至全量配置，在液冷场景中相比全量配置提升了准确率（0.652 -\u003E 0.715）并减少了 48% 的 Token 消耗，证明了基于任务感知的动态资源分配优于静态全量提供或基于语义相关性的检索方法。\n\n### § 9 最脆弱的假设\n\n该方法最核心的脆弱假设是：**Task-to-Harness Mapping 具有跨实例的稳定性和可迁移性，即同一任务类别（Task Class）下的不同具体任务实例对 Harness 级别的需求是高度一致的，且该映射关系在不同 Executor 模型间可转移。** 如果这一假设不成立，基于类别的映射表（Class-level Map）将无法作为可靠的初始配置依据，导致 Map-Guided Escalation 频繁触发升级或初始配置严重不足，从而丧失其效率优势。在实际中，该假设可能因以下原因失效：首先，同一类别的任务（如“预测未来信号”）可能因具体场景的噪声水平、数据稀疏度或物理非线性程度不同，而对仿真工具（K5）的依赖程度截然不同；其次，不同 LLM 模型（如 GPT-5.4 与 Qwen3.5-27B）在利用相同 Harness 资源时的推理效率和错误模式存在差异，可能导致映射关系失效。论文通过 Table 3 展示了从 GPT-5.4 迁移到 Qwen3.5-27B 时，使用原映射表仍能保持接近的性能，提供了一定证据；同时通过 Bootstrap 分析（Table 9）展示了映射级别的稳定性。然而，论文仅验证了两个特定领域（液冷和电网）和两个特定模型，缺乏在更广泛、更嘈杂的真实世界场景或更多样化模型架构下的泛化性证据，且未深入探讨当任务实例分布发生漂移（Distribution Shift）时映射表的失效机制。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现论文中 **Execution-Derived Mapping 的构建与验证** 部分，以验证“不同任务类别确实需要不同级别的 Harness”这一核心 Claim。具体方案如下：\n1.  **数据与环境**：使用论文开源的 **Grid2Op** 环境（基于 IEEE-14 节点电网），这是一个完全开源且易于部署的仿真环境。无需复现复杂的液冷数字孪生。\n2.  **实现**：选取论文定义的 12 类任务中的 3-4 个代表性类别（例如 I-N-S, I-F-S, A-N-M, A-F-M）。实现 K1（无工具）、K3（仅时序数据）和 K5（含仿真/潮流计算）三个关键 Harness 级别。使用一个开源 LLM（如 Llama-3-8B 或 Qwen-7B）作为 Executor，通过 ReAct 框架执行任务。\n3.  **测量**：为每个类别生成 10-20 个任务实例，分别在 K1、K3、K5 下执行，记录准确率（Accuracy）和 Token 消耗。\n4.  **验证标准**：如果实验结果显示，对于某些类别（如 I-N-S），K3 的准确率与 K5 相当但 Token 消耗显著更低；而对于其他类别（如 A-F-M），K5 的准确率显著高于 K3，则支持了“任务类别决定 Harness 需求”的 Claim。反之，如果所有类别在 K3 和 K5 下的性能差异不显著，或 K5 并未带来预期提升，则反驳了该映射关系的必要性。此实验避开了复杂的文献挖掘和全量基准测试，直接验证了核心方法论的有效性。", "research_value": "### § 11 最强反例设计\n\n要挑战这篇论文的核心主张，最有力的攻击点在于其**Task-to-Harness Mapping 的静态性与任务实例动态复杂性之间的根本矛盾**，即“类别平均主义”在长尾分布下的失效。论文假设同一 Task Class（如 `Inform-Now-Signal`）内的所有实例对 Harness 的需求是同质的，因此可以使用基于历史数据的静态映射表（Static Map）作为初始配置。然而，在真实的 Mission-Critical Infrastructure (MCI) 运维中，任务实例的“信息熵”和“物理非线性程度”存在巨大的实例间差异（Instance-level Variance）。\n\n**具体反例场景设计：**\n考虑一个 `Inform-Now-State` 任务（查询当前隐状态，如电网某节点的电压稳定性裕度）。在大多数正常工况下，该任务确实可以通过 $K_3$（时序观测数据）结合简单的插值或轻量级模型估算完成，符合论文的执行映射（Execution-Derived Map）。但是，如果该任务实例发生在**系统处于临界振荡边缘（Critical Oscillation）**或**传感器数据存在高频噪声/丢包**的极端工况下，仅凭 $K_3$ 的观测数据会导致 Agent 产生严重的幻觉或错误推断。此时，必须依赖 $K_5$（前向仿真）来通过物理约束进行状态重构。\n\n**攻击逻辑：**\n1.  **映射失效导致的安全风险**：论文的 Map-Guided Escalation 策略依赖 Agent 的 Self-Check 来触发升级。然而，LLM Agent 在缺乏 $K_5$ 提供的物理一致性校验时，往往**无法意识到自己错了**（即 Self-Check 的 False Negative 率极高）。Agent 可能会基于错误的 $K_3$ 数据生成一个看似合理但物理上不可行的答案，并通过 Self-Check，从而直接输出错误结果，而不会触发升级至 $K_5$。\n2.  **成本-安全权衡的崩塌**：论文声称减少了 48% 的 Token 消耗，但这建立在“大多数任务简单”的假设上。在 MCI 场景中，运维人员往往在系统异常时才介入查询，此时任务实例的分布偏向于“高复杂度/高不确定性”。如果静态映射表是基于全量历史数据（包含大量正常工况）训练的，它会系统性低估异常工况下的资源需求。\n3.  **替代解释**：实验观察到的“准确率提升”可能并非源于“最小充分 Harness”的精准匹配，而是源于**Over-provisioning 的噪声过滤效应**。即，全量提供（Full Provision）虽然引入了冗余信息，但也提供了更多的上下文线索供 LLM 进行自我纠错；而精简后的 Harness 虽然节省了 Token，却剥夺了 LLM 进行交叉验证的机会，导致其在复杂实例上的鲁棒性下降。论文在液冷场景中准确率的提升（0.652 -\u003E 0.715）可能仅适用于该特定数据集的简单任务分布，而在更具挑战性的电网故障诊断中，这种精简可能导致灾难性的误判。\n\n因此，最强的反例是证明：**在分布外（Out-of-Distribution, OOD）或高不确定性任务实例中，基于类别的静态映射会导致 Self-Check 失效，进而引发不可接受的错误率，使得“任务感知”的动态配置在安全性上劣于保守的“全量提供”。**\n\n### § 12 Follow-up Research Idea\n\n**研究主题：Uncertainty-Aware Dynamic Harness Orchestration (UADO) —— 基于认知不确定性的自适应资源编排**\n\n**(a) 驱动局限与未满足需求：**\n现有工作（包括本文）将 Harness Provisioning 视为一个**分类问题**（Task Class -\u003E Harness Level），忽略了任务执行过程中的**认知不确定性（Epistemic Uncertainty）**。本文的脆弱假设是“同类任务需求一致”，但真实世界中，Agent 对当前任务难度的感知是动态的。未满足的需求是：如何在任务执行过程中，实时量化 Agent 的“知识缺口”或“推理置信度”，并据此动态调整 Harness 粒度，而不是依赖事前的静态映射或事后的二元自检（Pass/Fail）。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴**主动学习（Active Learning）**中的查询策略（Query-by-Committee）和**贝叶斯优化（Bayesian Optimization）**中的探索-利用权衡（Exploration-Exploitation Trade-off）。在主动学习中，模型通过测量预测的不确定性来决定是否请求人工标注；在这里，我们可以将“请求更高级别的 Harness（如从 $K_3$ 升级到 $K_4$）”视为一种“主动查询”。同时，借鉴**神经符号系统（Neuro-Symbolic Systems）**中的可解释性机制，利用物理约束作为不确定性校准的锚点。\n\n**(c) 第一个实验设计：**\n1.  **核心机制**：构建一个 **Uncertainty Estimator** 模块，嵌入在 Agent 的推理循环中。该模块不依赖静态映射表，而是实时监测 Agent 在生成中间结果时的**语义一致性（Semantic Consistency）**和**物理可行性（Physical Feasibility）**。例如，使用一个轻量级的物理验证器（Physics Validator）对 Agent 基于 $K_3$ 数据生成的初步结论进行快速校验。如果校验失败或置信度低于阈值 $\\theta$，则动态触发“局部升级”，仅加载必要的 $K_4$ 模块（如特定子网的拓扑结构），而非直接升级到全量 $K_5$。\n2.  **实验设置**：在 IEEE-14 电网仿真环境中，设计一组**分布漂移（Distribution Shift）**任务，包括正常工况、轻微扰动和严重故障。对比三种策略：\n    *   **Baseline**: 本文的 Map-Guided Escalation（静态映射 + 二元自检）。\n    *   **Proposed**: UADO（动态不确定性感知 + 细粒度 Harness 升级）。\n    *   **Oracle**: 始终使用 $K_5$。\n3.  **评估指标**：除了 Accuracy 和 Token Cost，引入 **Uncertainty Calibration Error (ECE)** 和 **Failure Recovery Rate**。重点观察在 OOD 任务实例中，UADO 是否能比静态映射更早、更精准地识别出需要额外资源的时刻，从而在保持高准确率的同时，避免不必要的 $K_5$ 全量加载，实现比本文方法更精细的 Pareto 优化。\n\n**与已有工作的区别：**\n本文是“开环”的（基于历史统计的静态映射），而 UADO 是“闭环”的（基于实时推理状态的动态反馈）。本文关注“任务是什么”，UADO 关注“Agent 当前知道多少以及还缺什么”。这将 Harness Provisioning 从资源分配问题转化为**认知辅助（Cognitive Assistance）**问题，为 LLM Agent 在高风险场景下的可靠部署提供了更细粒度的控制手段。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Qingang Zhang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zhaomeng Zhu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Liangtao Lin\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Tianwei Zhang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yonggang Wen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Nanyang Technological University\"\n    }\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "LLM agents 已被广泛用于操作关键任务基础设施（MCI）。这些代理通常依赖于一个 harness，该 harness 决定了它们可以访问的信息、可以使用的工具以及可以采取的操作。现有系统通常向每个任务暴露相同的全面 harness，这可能并非必要，并导致资源浪费。在本文中，我们专注于识别最优 harness 配置，并将其视为每个任务需求与 harness 提供能力之间的资源匹配问题。为了衡量这种匹配度，我们根据底层系统的数学表示对 MCI 任务进行分类，并根据 harness 配置提供的信息量和类型对其进行排序。然后，我们从两个来源构建任务到 harness 的映射：挖掘研究文献和测量受控代理执行。利用测量得到的映射，我们提出了一种新的 harness 供应算法：map-guided escalation。该算法从特定任务的 harness 开始，仅在自检失败后才扩展到全面供应。我们在两个具有代表性的 MCI 任务中评估了我们的方法：在液体冷却中，它将代理准确率从全面供应下的 0.652 提高到 0.715，并以减少 48% 的 tokens 实现了与 Reflexion 相当的准确率；在电力网格中，全面供应仍然保持准确率最优，而基于映射的供应提供了更低成本的替代方案。这些发现表明，harness 供应遵循依赖于领域的准确率-成本 Pareto 前沿，而非通用最优解。"}, {"title": "Wuying-Browser-Agent: Real-World Centric Fundamental Long-Horizon Browser Agents", "arxiv_id": "2608.17319", "authors": "AIMAE Team, Tianxiang Chen, Yan Cheng, Zhangye Han, Xiaowei Li, Chang Liu, Cheng Liu, Zhongqiang Ma, Long Peng, Xiaobing Tu, Yinggui Wang, Hongliang Wei, Chen Wu, Daiping Xin, Kunyu Zhou, Pengyang Zhou, Peiyuan Chen, Ziyuan Chen, Yutao Deng, Chunyu Dong, Xiangyu Fu, Yicheng Feng, Ruian He, Haochen Li, Miancan Liu, Zhengqin Liu, Wei Peng, Jinkui Ren, Haoyu Tan, Dong Xiao, Rongkun Xue, Shujian Yang, Xianhang Ye, Ziqi Yuan, Ziyang Yu, Linghan Zhang, Xiantao Zhang, Xuanpu Zhao, Yinan Zhao, Zhenghui Zhao, Bin Zhu, Likai Zou", "summary": "Browser agents perform well on short, clean demonstrations, but real deployment is fundamentally different: agents must sustain dozens of decisions on live websites while recovering from mistakes and navigating complex UIs. We argue that closing this gap requires alignment at every level of the pipeline, including execution, supervision, optimization, and evaluation, rather than scale alone. We present Wuying-Browser-Agent, a unified framework that addresses each of these levels. A structured browser harness provides stable execution primitives and decision-oriented context management. Reflection and UI-specialized Curriculum SFT (RUIC-SFT) explicitly trains on recovery trajectories and complex-UI interactions. Divergence-Aware Online GRPO (DAO-GRPO) improves long-horizon credit assignment through potential-based reward shaping and divergence-aware step weighting. Finally, we introduce BrowserBench, a bilingual real-web benchmark of 350 tasks averaging 37.9 steps, because most existing benchmarks are too short to expose long-horizon failure modes. Wuying-Browser-Agent-27B achieves 80.6\\% on WebVoyager, 66.7\\% on Online-Mind2Web, and 65.1\\% on BrowserBench, establishing a new open-source state of the art on browser-use benchmarks. The same pipeline also transfers beyond browser use, demonstrating strong general agentic ability and reaching an average score of 73.8 on Tau2-Bench, Claw-Eval, and BFCL-v4.", "category": "cs.AI", "cluster": "Agent Infrastructure \u0026 Harnessing", "tags": ["cs.AI"], "filter_reason": "该论文完全符合“LLM智能体及其演化”的研究范围，具体依据如下：\n\n1.  核心对象明确为LLM智能体：论文标题和摘要明确指出研究对象是“Browser Agents”（浏览器智能体），属于典型的Tool-Use Agents和Long-Horizon Agents。\n2.  涉及智能体的构建与改进（Agentic \u0026 Self-Evolving）：\n       构建/框架：提出了“Wuying-Browser-Agent”统一框架，包含结构化的浏览器harness（执行环境）和决策导向的上下文管理，这属于智能体能力实现的核心组件（Agent Harness/Scaffold）。\n       训练与演化：引入了“Reflection and UI-specialized Curriculum SFT (RUIC-SFT)”，明确利用“recovery trajectories”（恢复轨迹）进行训练，体现了从错误中学习的自我完善机制。\n       优化机制：提出了“Divergence-Aware Online GRPO (DAO-GRPO)”，通过基于势能的奖励塑造和发散感知步长加权来改进长horizon信用分配。这是一种针对智能体长期决策能力的在线优化/强化学习方法，符合“Agent training/RL”和“Self-Improvement”的方向。\n3.  符合保留标准：根据筛选标准第一步，论文研究的是构建LLM智能体的方法论（新框架、新训练策略、新评估基准），且核心贡献在于解决长horizon决策中的失败模式恢复和信用分配问题，直接帮助理解并改进智能体能力。\n4.  排除项检查：论文不涉及纯基础设施优化、非Agentic的基础推理、安全/对齐/可解释性、多模态视觉核心研究或图技术，也不属于仅讨论拓扑/通信的多智能体系统工程。\n\n综上，该论文在智能体框架设计、长horizon决策优化及基于轨迹的自我改进方面均有深入贡献，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决 **Browser Agents** 在从受控演示环境向真实世界部署迁移时面临的 **Long-Horizon Robustness Gap**（长视界鲁棒性差距）。具体而言，现有的浏览器代理在短且干净的演示数据上表现良好，但在真实部署中，它们需要在动态变化的实时网页上维持数十步的决策，并具备从错误中恢复（Recovery）和处理复杂 UI 组件的能力。论文指出，这一差距并非单纯由模型规模（Scale）决定，而是源于训练、监督、优化和评估全链路缺乏针对长视界场景的对齐（Alignment）。\n\n该问题的重要性在于，真实世界的 Web 交互本质上是部分可观测、状态动态变化且充满噪声的序列决策过程。随着任务步数的增加，代理不可避免地会遇到意外重定向、页面结构变更或复杂控件（如日期选择器、级联菜单），导致执行偏离预期轨迹。如果代理缺乏有效的错误检测和恢复机制，微小的初始错误会在长序列中被放大，导致任务彻底失败。此外，现有的评估基准多集中于短视界、英语主导的任务，无法充分暴露代理在长视界、多语言真实 Web 环境下的失效模式（Failure Modes）。\n\n解决这一问题具有显著价值：首先，它推动了浏览器代理从“演示型”向“部署型”转变，提升了其在电商、信息聚合、跨标签页工作流等复杂场景下的实际可用性。其次，通过提出 **Wuying-Browser-Agent** 框架，包括 **RUIC-SFT**（Reflection and UI-specialized Curriculum SFT）和 **DAO-GRPO**（Divergence-Aware Online GRPO），论文展示了如何通过结构化监督信号和在线强化学习优化长视界信用分配（Credit Assignment），从而提升代理的自主纠错能力。最后，引入 **BrowserBench** 这一双语长视界基准，填补了评估领域的空白，为衡量代理在真实部署条件下的鲁棒性提供了更可靠的指标。\n\n### § 2 前人工作与不足\n\n尽管 **Browser Agents** 领域取得了显著进展，但现有研究在应对长视界真实部署挑战时仍存在结构性不足。\n\n在 **基础模型与框架** 方面，**ReAct** [46] 确立了推理与行动范式，**SeeAct** [50] 和 **AutoWebGLM** [17] 展示了大模型在结构化接地（Grounding）和自动化数据收集下的潜力。专用 GUI 代理如 **UI-TARS** [27]、**FARA** [1] 和 **ScaleCUA** [18] 通过原生视觉感知或高效代理设计提升了性能。然而，这些系统大多孤立地关注模型架构或单一训练算法，未能联合解决面向恢复的数据构建、稳定的长视界在线优化以及双语真实 Web 评估这三个核心挑战。例如，**OpenWebRL** [45] 虽然展示了在线多模态 RL 的有效性，但其主要关注点在于通过在线 RL 提升紧凑模型的竞争力，而未深入解决长视界中稀疏奖励导致的信用稀释问题。\n\n在 **计算机使用代理（CUAs）** 方面，**OpenCUA** [37]、**GUI-Owl-1.5** [42] 和 **EvoCUA** [14] 等系统通过大规模 OS 级交互数据或多轮在线 RL 增强了通用 GUI 控制能力。但这些系统通常优化的是原子级 GUI 控制或通用计算机使用能力，评估场景多为短视界或单一平台。它们未能针对真实 Web 执行中常见的错误恢复监督、稀疏终端奖励下的分支敏感信用分配以及双语长视界评估进行联合优化。\n\n在 **代理强化学习（Agentic RL）** 方面，**GRPO** [28]、**DAPO** [48] 等方法通过组相对优势实现了无 Critic 的策略优化，**WebRL** [26] 和 **AgentRL** [49] 探索了基于课程或自进化的在线训练。然而，浏览器环境的特殊性使得标准序列级目标失效：浏览器上下文并非简单的追加式（Append-only），DOM 快照会随导航插入、替换或删除，导致标准 RL 方法在优化时面临上下文不匹配（Context Mismatch）和长视界信用分配困难。现有工作如 **PAE** [53] 和 **WebGym** [2] 虽提供了可扩展环境，但未解决长轨迹中共享前缀导致的信号稀释问题，即均匀优化整个轨迹会分散学习信号，无法聚焦于决定成败的关键分支步骤。\n\n在 **基准测试** 方面，**WebArena** [52] 提供确定性验证，**Mind2Web** [7] 提供大规模演示，**WebVoyager** [11] 和 **Online-Mind2Web** [43] 转向真实网站。但这些基准存在三个主要局限：1) 长视界任务代表性不足，平均步数较短，无法暴露长视界失效模式；2) 严重偏向英语，缺乏对中文 Web 环境的评估；3) 网站覆盖范围狭窄。因此，现有基准无法充分反映本文所针对的双语、长视界、真实 Web 部署场景。\n\n综上所述，前人工作未能充分考虑 **Recovery Supervision**（恢复监督）、**Branch-Sensitive Credit Assignment**（分支敏感信用分配）以及 **Bilingual Long-Horizon Evaluation**（双语长视界评估）这三个相互交织的结构挑战。本文通过 **Wuying-Browser-Agent** 统一框架，协同设计执行层、监督、优化和评估，填补了这一空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在长视界（Long-Horizon）浏览器代理（Browser Agent）的研究中，现有的主流范式存在一个根本性的错位：训练数据主要由成功的、短视界的演示（Demonstrations）构成，而真实部署环境充满了错误、重定向和复杂的 UI 交互。研究者首先观察到，基于成功轨迹的监督微调（SFT）虽然能教会模型“如何正确执行”，却无法教会模型“出错后如何恢复”。因为在真实场景中，代理不可避免地会遭遇页面结构变化或点击错误，而现有的训练数据缺乏对这种“偏离-恢复”（Off-trajectory Recovery）过程的显式监督，导致模型在遇到错误时往往陷入无效循环或直接失败。\n\n其次，研究者意识到长视界任务中的信用分配（Credit Assignment）问题比传统 RL 更为严峻。在浏览器交互中，多个轨迹往往共享很长的前缀（Shared Prefixes），仅在少数几个关键分支点（Branch Steps）产生分歧。如果使用标准的轨迹级奖励（如 GRPO），学习信号会被稀释在漫长的共享前缀中，导致模型无法聚焦于那些真正决定成败的关键决策。此外，浏览器状态是动态重构的（非追加式），传统的基于完整历史转录（Transcript）的优化方式会导致训练与推理时的上下文不匹配（Train-Test Mismatch），进一步加剧了优化难度。\n\n最后，现有的基准测试（Benchmarks）大多集中在英语环境且任务较短，无法充分暴露上述长视界、多语言、真实网页环境下的失败模式。因此，研究者推断，要解决这些问题，不能仅靠增加数据规模，而需要一套协同设计的 pipeline：在数据层面，必须引入包含错误反思和复杂 UI 交互的专用数据；在优化层面，需要一种能感知轨迹分歧（Divergence-Aware）的在线强化学习算法，以集中优化关键分支；在评估层面，需要构建一个真正反映长视界、双语真实网页环境的基准。这一思考路径最终导向了 Wuying-Browser-Agent 的核心设计：RUIC-SFT 用于建立恢复先验，DAO-GRPO 用于精细化长视界决策，BrowserBench 用于验证真实部署能力。\n\n### § 4 核心 Intuition\n\n现有浏览器代理在长视界任务中失败的核心原因在于：训练数据缺乏对“错误后恢复”的监督，且优化信号被稀释在漫长的共享轨迹前缀中，导致模型既不会纠错，也无法聚焦关键决策。\n\n本方法的直觉是：通过课程化引入“反思与恢复”数据，让模型学会从错误中自我修正；同时，利用在线强化学习识别轨迹中的“分歧点”，将学习信号集中加权于那些真正决定成败的关键分支步骤，而非均匀分配给所有步骤。\n\n此外，通过动态重构每一步的决策上下文，确保训练时的信息状态与推理时完全一致，从而解决长视界交互中的上下文漂移问题，使模型在真实、动态的网页环境中具备更强的鲁棒性和决策效率。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nWuying-Browser-Agent 的核心方法是一个针对长程（Long-Horizon）浏览器任务设计的统一框架，旨在解决现有代理在真实部署中缺乏错误恢复能力、信用分配稀疏以及评估基准短视的问题。其 Pipeline 由底层的基础设施层、两阶段的训练策略以及自增强的数据飞轮组成。\n\n**1. 结构化浏览器执行层 (Structured Browser Harness Layer)**\n这是整个系统的基石，为监督学习、在线强化学习和评估提供统一的接口。\n*   **输入处理**：代理不直接接收原始 DOM，而是接收经过优化的结构化浏览器状态 $S_t$（保留交互元素，去除噪声）和可选的视口截图 $V_t$。\n*   **决策上下文重构 (Decision Context Reconstruction)**：在每个步骤 $t$，系统根据任务指令、当前状态、历史动作和环境反馈动态重构决策上下文 $c_t$。这避免了传统方法中随着轨迹增长而无限膨胀的 Token 消耗，确保代理只关注当前决策相关的信息。\n*   **动作执行与反馈**：代理输出结构化动作 $a_t$（如 `click`, `scroll`, `input`），Harness 层验证其 Schema 并执行。如果动作无效，Harness 返回类型化的错误信息作为反馈 $e_t$，使代理能够感知并纠正错误，而不是静默失败。\n\n**2. 第一阶段：反思与 UI 专项课程监督微调 (RUIC-SFT)**\n为了解决仅靠成功轨迹训练导致代理缺乏错误恢复能力的问题，该阶段引入了三种数据源并进行课程化混合训练：\n*   **通用浏览器数据 ($D_g$)**：用于稳定基础操作（导航、点击、输入）。\n*   **专项 UI 组件数据 ($D_u$)**：针对日期选择器、级联选择器等复杂控件，通过系统化采集和增强，提供密集的交互模式监督。\n*   **反思数据 ($D_r$)**：包含“错误动作 -\u003E 错误观察 -\u003E 反思推理 -\u003E 纠正动作”的轨迹。这些数据通过自动化挖掘和人工标注获得，明确教导代理在偏离路径时如何恢复。\n*   **课程调度 (Curriculum Schedule)**：训练分为三个阶段。Phase 1 以通用数据为主稳定基础能力；Phase 2 增加 UI 专项数据比例以强化复杂交互；Phase 3 引入反思数据以培养自我纠正能力，同时降低 UI 数据比例以防止灾难性遗忘。这种渐进式混合避免了早期引入反思数据导致的过度保守行为。\n\n**3. 第二阶段：发散感知在线 GRPO (DAO-GRPO)**\n在 RUIC-SFT 初始化的基础上，通过在线强化学习进一步优化长程决策。\n*   **分组 rollout (Grouped Rollout)**：对于每个任务，并行生成多个轨迹组。\n*   **潜在基奖励塑形 (Potential-Based Reward Shaping, PBRS)**：为了解决终端奖励稀疏问题，引入基于任务进度的潜在函数 $\\Phi(s)$，生成中间步骤的密集奖励信号 $r_{t}^{shape} = \\gamma \\Phi(s_{t+1}) - \\Phi(s_t)$。这在不改变最优策略的前提下，提供了更丰富的学习信号。\n*   **发散感知信用分配 (Divergence-Aware Credit Assignment)**：利用 LLM 作为发散估计器，识别轨迹组中成功与失败轨迹首次出现行为差异的关键分支点 $t^*$。\n    *   **直觉**：长轨迹往往共享很长的前缀，只有少数几个关键决策决定了成败。均匀加权会稀释学习信号。\n    *   **机制**：对共享前缀步骤赋予较低权重，对发散点 $t^*$ 及其后的有利分支步骤赋予较高权重。这使得优化集中在真正决定成败的“分支决策”上。\n*   **响应级策略优化 (Response-Level Policy Optimization)**：每个步骤的策略更新基于该步骤实际可用的决策上下文 $c_t$，而不是整个轨迹的拼接文本。这消除了训练与推理时的上下文不匹配（Train-Test Mismatch）。\n\n**4. 自增强数据飞轮 (Self-Reinforcing Data Flywheel)**\n*   **闭环迭代**：在线 RL 和评估产生的轨迹被自动分类。成功轨迹补充通用数据，失败轨迹中可定位错误的部分转化为反思数据，特定控件失败转化为 UI 专项数据。\n*   **验证门控**：所有生成的纠正策略必须在沙箱中重新执行验证，确保其确实能恢复任务，防止错误放大。\n\n**真实例子讲解：在奇瑞官网查找隐私政策更新公告**\n\n*   **输入**：用户指令“进入奇瑞官网，滚动到底部，找到隐私政策链接，点击进入，找到隐私政策更新公告，点击个人信息收集清单，查看收集目的。”\n*   **处理 (Pipeline)**：\n    1.  **初始化**：代理加载奇瑞官网，处理 Cookie 弹窗，滚动到底部。\n    2.  **错误发生**：代理点击了“隐私条款”而非“隐私与数据保护”，被重定向到一个无关的品牌历史页面。\n    3.  **检测与反思 (RUIC-SFT 作用)**：代理观察到当前页面 URL 和内容与目标不符。得益于反思数据训练，它没有盲目继续，而是识别出这是一个导航错误。\n    4.  **恢复 (DAO-GRPO 作用)**：代理决定返回上一页或重新导航至正确的隐私页面。在在线 RL 阶段，这种从错误中恢复的行为被 PBRS 奖励（因为进度从 0 变为正）和发散感知机制（该步骤是成功与失败轨迹的分水岭）重点强化。\n    5.  **复杂交互**：进入隐私页面后，目标内容未直接显示。代理尝试滚动，未果后升级为结构化提取（Structured Extraction）来探测页面结构，最终找到“个人信息收集清单”链接。\n    6.  **完成**：点击链接，滚动查看表格，确认收集目的，输出 `done(success=True)`。\n*   **输出**：任务成功完成，轨迹被记录。如果该轨迹包含上述恢复过程，它将被标记为高质量的反思数据，用于下一轮训练。\n\n### § 6 核心数学推导\n\n本文的核心数学贡献在于 **DAO-GRPO** 中的奖励塑形和信用分配机制，旨在解决长程稀疏奖励下的信用分配问题。\n\n**1. 潜在基奖励塑形 (Potential-Based Reward Shaping, PBRS)**\n\n*   **公式**：\n    $$ r_{t}^{shape} = \\gamma \\Phi(s_{t+1}) - \\Phi(s_t) $$\n    $$ R_i = R_i^{term} + \\sum_{t=0}^{T_i-1} \\gamma^t r_{t}^{shape} $$\n*   **理论背景**：Ng et al. (1999) 证明，如果奖励函数增加一个潜在函数 $\\Phi(s)$ 的差分，最优策略保持不变。\n*   **Intuition**：\n    *   在浏览器任务中，只有最后一步知道任务是否成功（$R^{term} \\in \\{0, 1\\}$），中间的几十步没有奖励信号，导致梯度消失或噪声极大。\n    *   $\\Phi(s)$ 是一个由 LLM 评估的“进度分数”（例如，0.0 表示刚开始，1.0 表示完成）。\n    *   $r_{t}^{shape}$ 衡量的是这一步带来的“进度增量”。如果代理从“未找到链接”变为“找到链接”，$\\Phi$ 增加，获得正奖励；如果代理迷路了，$\\Phi$ 不变或减少，获得零或负奖励。\n    *   这使得代理在每一步都能得到反馈，而不仅仅是最后。\n\n**2. 发散感知步骤信用权重 (Divergence-Aware Step Credit Weight)**\n\n*   **公式**：\n    $$ w_{i,t} = \\begin{cases} \\alpha_{shared} \u0026 \\text{if } t \u003C t^* \\\\ \\alpha_{div} \\cdot c^* \u0026 \\text{if } t = t^* \\\\ \\alpha_{div} \\cdot c^* \\cdot \\delta_{+}^{t-t^*} \u0026 \\text{if } t \u003E t^* \\text{ and } \\tau_i \\in B_+ \\\\ \\alpha_{div} \\cdot c^* \\cdot \\delta_{-}^{t-t^*} \u0026 \\text{if } t \u003E t^* \\text{ and } \\tau_i \\in B_- \\end{cases} $$\n*   **理论背景**：在 Group Relative Policy Optimization (GRPO) 中，通常对所有步骤均匀加权。但在长轨迹中，前缀往往是冗余的。\n*   **Intuition**：\n    *   $t^*$ 是成功轨迹和失败轨迹第一次做出不同选择的时间点（分支点）。\n    *   $c^*$ 是该分支点的关键性评分（由 LLM 给出）。\n    *   $B_+$ 和 $B_-$ 分别代表走向成功和失败的分支集合。\n    *   **权重分配逻辑**：\n        *   **前缀 ($t \u003C t^*$)**：所有轨迹都一样，对区分成败无贡献，给予低权重 $\\alpha_{shared}$。\n        *   **分支点 ($t = t^*$)**：这是决定命运的时刻，给予高权重，并由关键性 $c^*$ 调制。\n        *   **后分支 ($t \u003E t^*$)**：成功分支 ($B_+$) 的步骤保留较长时间的信用（$\\delta_+ \u003E \\delta_-$），因为它们是成功路径的一部分；失败分支 ($B_-$) 的步骤信用迅速衰减，因为它们是错误路径的延续。\n    *   这种机制确保梯度更新主要集中在那些“真正起作用”的决策上，而不是浪费在重复的滚动或导航上。\n\n**3. 响应级策略目标 (Response-Level Policy Objective)**\n\n*   **公式**：\n    $$ \\mathcal{L}_{GRPO} = -\\frac{1}{K} \\sum_{i=1}^K A_i \\sum_{t=0}^{T_i-1} w_{i,t} \\log \\pi_\\theta(y_{i,t} | c_{i,t}) $$\n*   **Intuition**：\n    *   传统的 RLHF 或 GRPO 通常基于整个序列的似然。\n    *   这里，$c_{i,t}$ 是步骤 $t$ 的**动态重构上下文**，而不是整个历史。\n    *   这意味着模型在训练时看到的输入与推理时看到的输入完全一致。这解决了“训练时看全貌，推理时只看局部”的不匹配问题，提高了泛化能力。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有的浏览器代理基准（如 WebVoyager, Mind2Web）主要关注短程、英语、成功轨迹，无法反映真实部署中长程、双语、包含错误和恢复的复杂场景。此外，现有的训练方法缺乏对错误恢复的监督，且在线强化学习在长轨迹中面临信用分配稀疏的问题。\n\n**2. 设计了什么实验验证这个问题？**\n*   **构建 BrowserBench**：设计了一个包含 350 个中英双语真实网站任务的基准，平均步骤长达 37.9 步，最长 100 步。任务涵盖电商、搜索、地图等，并标注了难度（Easy/Medium/Hard）。\n*   **消融实验 (Ablation Study)**：\n    *   **RUIC-SFT 消融**：对比仅使用通用数据、仅增加 UI 数据、仅增加反思数据、固定混合比例以及课程化混合（Curriculum）的效果。特别关注“恢复成功率”（Recovery SR）和“平均步骤数”。\n    *   **DAO-GRPO 消融**：对比 Vanilla GRPO、加入 PBRS、加入发散感知信用分配、以及完整 DAO-GRPO 的效果。关注在 Hard 任务和长轨迹上的表现。\n    *   **组件可靠性验证**：验证 LLM 发散估计器的准确性（与人工标注对比）以及 PBRS 进度估计器与人类判断的一致性。\n*   **对比实验**：在 WebVoyager, Online-Mind2Web, BrowserBench 上与开源（如 Qwen3.8-Max, OpenWebRL）和闭源（如 GPT-4o, GPT-5）模型对比。同时在通用代理基准（Tau2-Bench, BFCL-v4）上测试迁移能力。\n\n**3. 问题的答案是什么？**\n*   **BrowserBench 的有效性**：现有强模型在 BrowserBench 上表现不佳（如最强闭源模型仅 ~67%），且随着任务长度增加，成功率急剧下降，证实了长程任务的挑战性被低估。\n*   **RUIC-SFT 的贡献**：\n    *   仅增加 UI 数据提高了基础操作能力，但对恢复帮助有限。\n    *   仅增加反思数据显著提高了恢复成功率（从 8.5% 到 16.4%），但可能导致行为犹豫。\n    *   **课程化混合（Curriculum）** 效果最佳，既提高了整体成功率（38.0%），又保持了高效的步骤数（22.4 步），证明了渐进式学习的重要性。\n*   **DAO-GRPO 的贡献**：\n    *   Vanilla GRPO 提升有限。\n    *   PBRS 提供了必要的密集信号，提升了整体和 Hard 任务表现。\n    *   **发散感知信用分配** 在 Hard 任务和恢复任务上带来了最大增益，证实了聚焦关键分支决策的有效性。\n    *   完整 DAO-GRPO 在长轨迹（\u003E50 步）上带来了 +13.4% 的巨大提升，证明了其在长程信用分配上的优势。\n*   **整体结论**：Wuying-Browser-Agent-27B 在 BrowserBench 上达到 65.1%，在 WebVoyager 上达到 80.6%，建立了新的开源 SOTA。同时，该方法在通用代理基准上也表现强劲，证明了浏览器专项训练并未损害通用能力，反而增强了结构化工具使用和自主决策能力。", "additional_insights": "### § 8 Take-aways\n\nWuying-Browser-Agent 的核心洞察在于，长视界（Long-Horizon）浏览器代理的瓶颈并非模型规模，而是训练数据中缺乏对错误恢复（Recovery）和复杂 UI 交互的显式监督，以及评估基准对真实双语长任务覆盖不足。为了解决成功轨迹主导导致模型无法从错误中恢复的问题，论文提出了 Reflection and UI-specialized Curriculum SFT (RUIC-SFT)，通过引入包含错误-反思-修正结构的 Reflection Dataset 和针对复杂控件（如日期选择器、级联选择器）的 Specialized UI Dataset，并在训练后期才引入反思数据以避免模型行为过度保守。针对长轨迹中信用分配（Credit Assignment）稀疏且被共享前缀稀释的问题，论文设计了 Divergence-Aware Online GRPO (DAO-GRPO)，利用 LLM 检测轨迹分歧点（Divergence Points），将优化信号集中在决定成败的关键分支步骤上，并结合基于势函数的奖励塑形（Potential-based Reward Shaping, PBRS）提供密集的过程监督。为了填补现有基准在长视界和双语场景下的空白，论文构建了 BrowserBench，包含 350 个平均步骤达 37.9 的中英文真实网页任务，揭示了现有模型在超过 50 步任务上的严重性能衰减。实验表明，该统一框架在 WebVoyager、Online-Mind2Web 和 BrowserBench 上均取得了开源 SOTA 性能，且其能力可迁移至 Tau2-Bench 等通用代理基准，证明了基于结构化浏览器 Harness 和长视界优化策略的有效性。\n\n### § 9 最脆弱的假设\n\n该方法最脆弱的假设是：**LLM 作为分歧检测器（Divergence Estimator）和进度评估器（Progress Estimator）能够以足够高的准确率识别出轨迹中的关键分支点（Branch Points）和中间进度状态，且这种近似正确的信号足以引导策略优化而不引入有害偏差。**\n\n如果这一假设不成立，即 LLM 错误地标记了非关键步骤为分歧点，或者对进度的评估与真实任务目标严重脱节，DAO-GRPO 的核心机制——将梯度更新集中在“关键步骤”上——将失效甚至产生负面影响。具体而言，如果分歧点定位错误，模型可能会在无关紧要的步骤上过度优化，而在真正决定成败的步骤上信号不足；如果进度评估器（$\\Phi$）给出的势函数值不能真实反映任务完成度，PBRS 提供的密集奖励可能会误导模型走向局部最优或无效路径。\n\n论文为这一假设提供的证据包括：在 100 个 rollout 组上，LLM 分歧检测器在 61% 的情况下能精确定位分歧步，在 78% 的情况下误差在 $\\pm 1$ 步以内；进度评估器与人类标注的 Spearman 相关系数为 0.81。此外，消融实验显示，即使对检测到的分歧步引入 $\\pm 4$ 步的随机扰动，性能下降也是平缓的（从 42.9% 降至 41.1%），仍优于均匀信用分配基线。然而，这一证据主要基于离线验证集，且依赖于特定的 LLM 判断器。在实际部署中，面对从未见过的复杂网页结构或动态变化的 UI 逻辑，LLM 判断器的可靠性可能会显著下降，而论文未充分展示在极端噪声或对抗性网页环境下的鲁棒性边界。如果判断器在长尾场景下失效，整个在线 RL 阶段的收益将大打折扣。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现并验证 **RUIC-SFT 中“反思数据（Reflection Data）对错误恢复能力的提升”** 这一核心 claim，无需复现完整的在线 RL 系统。\n\n**实验设计：**\n1.  **数据准备**：使用开源的 Mind2Web 或 WebVoyager 数据集的子集。人工构造或从现有失败轨迹中提取约 500-1000 条包含“错误动作-错误观察-反思文本-修正动作”的 Reflection 样本。同时准备同等数量的普通成功轨迹作为基线数据。\n2.  **模型选择**：选择一个轻量级开源模型（如 Qwen2.5-7B-Instruct 或 Llama-3.1-8B-Instruct），确保其具备基本的指令遵循能力。\n3.  **训练实现**：\n    *   **基线模型**：仅使用普通成功轨迹数据进行 SFT。\n    *   **实验模型**：使用普通成功轨迹 + 构造的 Reflection 数据进行 SFT（可简化 RUIC-SFT 的课程学习，直接混合训练以节省时间）。\n4.  **评估测量**：\n    *   构建一个小型的“错误注入”测试集：在标准任务执行过程中，故意在第 $t$ 步注入一个错误动作（如点击错误链接），然后观察模型在后续步骤中是否能通过反思和修正回到正确路径。\n    *   测量指标：**错误恢复成功率（Recovery Success Rate）**，即模型在遭遇注入错误后，最终仍能完成任务的比例。\n5.  **结果判定**：\n    *   **支持 Claim**：如果实验模型的错误恢复成功率显著高于基线模型（例如提升 10% 以上），则证明显式的反思监督能有效提升模型的鲁棒性。\n    *   **反驳 Claim**：如果两者恢复率无显著差异，或实验模型因过度反思导致正常任务执行效率大幅下降，则说明简单的反思数据混合不足以解决长视界恢复问题，可能需要更复杂的课程学习或在线 RL 配合。\n\n此实验避开了复杂的在线 RL 环境搭建和 BrowserBench 构建，直接验证了论文中关于“成功轨迹主导导致恢复能力弱”这一核心痛点及其解决方案的有效性。", "research_value": "### § 11 最强反例设计\n\n若要挑战 **Wuying-Browser-Agent** 的有效性，最有力的攻击并非针对其整体成功率，而是针对其核心优化机制 **DAO-GRPO** 中 **LLM-based Divergence Estimator** 的可靠性与 **Potential-Based Reward Shaping (PBRS)** 的诱导偏差。\n\n**理论攻击：奖励塑形导致的策略退化与局部最优陷阱**\n论文声称 PBRS 在不改变最优策略的前提下提供密集信号，但这依赖于潜在函数 $\\Phi(s)$ 能够完美对齐任务目标。在真实 Web 环境中，$\\Phi(s)$ 由 LLM 估算，存在固有的主观性和噪声。如果 LLM 错误地将“点击广告”或“进入无关子页面”评估为高进度（例如，因为页面标题包含关键词），PBRS 会给予正奖励，导致代理被诱导进入局部最优路径。更严重的是，**Divergence-Aware Credit Assignment** 假设成功与失败轨迹的分歧点 $t^*$ 是唯一的因果决策点。然而，在长视界任务中，失败往往源于早期细微的上下文丢失（如未注意到页面顶部的隐藏通知），而非某个显式的错误点击。如果 LLM 错误地将分歧点定位在后期（例如，因为后期动作差异更明显），模型会过度优化后期动作，而忽略早期关键的上下文感知，导致“治标不治本”。这种 **Credit Assignment Misalignment** 会导致模型在训练集上表现良好（因为 LLM 评估器与训练数据分布一致），但在分布外（OOD）的真实部署中，由于评估器失效，性能急剧下降。\n\n**实验反例：对抗性 UI 与动态 DOM 下的评估器失效**\n设计一个包含 **Dynamic DOM Mutation** 和 **Adversarial UI Patterns** 的测试集。例如，网站在用户滚动时动态加载内容，或根据鼠标悬停改变按钮位置。在此场景下，LLM 作为 Divergence Estimator 和 Progress Estimator 的输入是静态快照或有限历史，无法捕捉动态变化。\n1.  **构造场景**：创建一个任务，其中正确路径需要先点击一个看似无关的“帮助”按钮以解锁主功能，而错误路径是直接点击主按钮（导致权限错误）。\n2.  **预期失败**：LLM 评估器可能认为直接点击主按钮是“高进度”（因为更接近目标），而点击“帮助”是“低进度”或“偏离”。因此，PBRS 会惩罚正确路径，奖励错误路径。\n3.  **结果验证**：如果 Wuying-Browser-Agent 在此类任务上的表现显著低于基线（如 Vanilla GRPO 或随机策略），则证明其核心优化机制依赖于评估器的先验知识，而非真正的自主推理能力。这揭示了该方法在缺乏明确进度指标的复杂探索任务中的根本局限性。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“轨迹优化”到“状态空间拓扑学习”：基于因果干预的浏览器代理鲁棒性框架**\n\n**（a）驱动局限与未满足需求**\n现有方法（包括 Wuying-Browser-Agent）本质上是在 **Action Space** 中进行优化，依赖 LLM 对轨迹的启发式评估（Divergence/Progress）。这导致代理缺乏对 **Web State Space** 的深层理解，无法区分“偶然成功”与“因果正确”。当 UI 结构发生微小变化时，基于轨迹相似度的优化会失效。我们需要一种方法，使代理能够学习 Web 应用的 **Causal Structure**，即哪些状态转换是任务成功的必要充分条件，从而实现对 UI 变体的泛化。\n\n**（b）借鉴相邻领域的方法**\n借鉴 **Causal Inference** 中的 **Do-Calculus** 和 **Structural Causal Models (SCMs)**，以及 **Reinforcement Learning** 中的 **Model-Based RL** 和 **World Models**。具体而言，引入 **Causal Discovery** 算法来从交互数据中推断 DOM 元素与任务目标之间的因果图，而非仅依赖相关性。\n\n**（c）第一个实验设计**\n1.  **构建因果感知代理 (Causal-Aware Agent)**：\n    *   在 **Structured Browser Harness** 之上，增加一个 **Causal Graph Learner** 模块。该模块在代理交互过程中，记录状态转移 $S_t \\to S_{t+1}$ 和动作 $a_t$，并使用 **PC Algorithm** 或 **NOTEARS** 等方法学习局部因果图。\n    *   定义 **Interventional Policy**：代理不仅预测下一个动作，还预测该动作对因果图中关键节点（如“登录状态”、“表单验证通过”）的干预效果。\n2.  **实验设置**：\n    *   使用 **BrowserBench** 的子集，但引入 **UI Perturbations**：随机改变按钮颜色、位置、文本标签，甚至移除某些非关键元素，保持功能不变。\n    *   对比基线：Wuying-Browser-Agent（依赖轨迹相似度）、Vanilla RL（依赖奖励信号）、以及提出的 Causal-Aware Agent。\n3.  **评估指标**：\n    *   **Causal Robustness Score**：在 UI 扰动下，代理保持任务成功率的能力。\n    *   **Causal Graph Accuracy**：学习到的因果图与人工标注的 Web 应用逻辑图的一致性。\n4.  **预期结果**：Causal-Aware Agent 在 UI 扰动下表现显著优于基线，因为它关注的是“点击登录按钮导致状态变为已登录”这一因果事实，而非“点击屏幕坐标 (x, y)”这一表面特征。这将打开一个从“行为模仿”到“因果理解”的新研究方向，解决长视界代理在动态 Web 环境中的泛化难题。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "{\n  \"authors\": [\n    {\"name\": \"AIMAE Team\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Tianxiang Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yan Cheng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhangye Han\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiaowei Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Chang Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Cheng Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhongqiang Ma\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Long Peng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiaobing Tu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yinggui Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hongliang Wei\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Chen Wu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Daiping Xin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Kunyu Zhou\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Pengyang Zhou\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Peiyuan Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ziyuan Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yutao Deng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Chunyu Dong\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiangyu Fu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yicheng Feng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ruian He\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Haochen Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Miancan Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhengqin Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Wei Peng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jinkui Ren\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Haoyu Tan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Dong Xiao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Rongkun Xue\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shujian Yang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xianhang Ye\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ziqi Yuan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ziyang Yu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Linghan Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiantao Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xuanpu Zhao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yinan Zhao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhenghui Zhao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Bin Zhu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Likai Zou\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Alibaba Cloud\"}\n  ],\n  \"footnotes\": []\n}", "summary_translation": "Browser agents 在简短、干净的演示中表现良好，但实际部署存在根本性差异：agent 必须在实时网站上持续做出数十次决策，同时从错误中恢复并导航复杂的 UI。我们认为，缩小这一差距需要在整个 pipeline 的每个层级进行 alignment，包括 execution、supervision、optimization 和 evaluation，而不仅仅依赖规模。我们提出了 Wuying-Browser-Agent，这是一个解决上述每个层级的统一框架。结构化的 browser harness 提供了稳定的 execution primitives 和面向决策的 context management。Reflection and UI-specialized Curriculum SFT (RUIC-SFT) 显式地在 recovery trajectories 和复杂 UI 交互上进行训练。Divergence-Aware Online GRPO (DAO-GRPO) 通过基于势能的 reward shaping 和 divergence-aware step weighting 改善了长 horizon 的 credit assignment。最后，我们引入了 BrowserBench，这是一个包含 350 个任务、平均 37.9 步的双语真实 web benchmark，因为大多数现有 benchmark 过于简短，无法暴露长 horizon 的 failure modes。Wuying-Browser-Agent-27B 在 WebVoyager 上达到 80.6%，在 Online-Mind2Web 上达到 66.7%，在 BrowserBench 上达到 65.1%，在 browser-use benchmark 上确立了新的开源 state of the art。相同的 pipeline 也迁移到了 browser use 之外的领域，展示了强大的通用 agentic ability，并在 Tau2-Bench、Claw-Eval 和 BFCL-v4 上达到了 73.8 的平均分。"}, {"title": "The Working Set of a Coding Agent: Coherence Debt in Repository-Scale Tasks", "arxiv_id": "2608.16630", "authors": "Bardia Mohammadi, Lars Klein, Aman Chadha, Akhil Arora, Laurent Bindschaedler", "summary": "Repository-scale coding requires an agent to keep tests, imports, configuration, and migration rules consistent within a bounded context window. We model this as reconstructing a coupled-fact graph: at each edit, a required fact comes from recent context or parametric memory, and the facts covered by neither form coherence debt. We supply and withhold each channel and inject faults across seven models and five harnesses. As expected, no model completes a task on an unseen API with both channels empty, and putting the facts in the prompt restores success. When a rename defeats what models memorized about a real library, all seven fail in the same place, passing and missing the same tests. Availability decides the outcome and distance does not: withholding a fact costs exactly the work it supports, and a supplied fact works as well far from the edit as next to it. Harnesses pay unequal prices for it: configurations that all pass every test differ more than tenfold in tokens consumed because they rebuild the same content at different rates, and spending more recovers nothing when facts are withheld. A missing fact produces wrong work rather than absent work: an agent asked to act acts, fabricating the file or guessing the value, so instruments built on reads look for a hole already filled. How often it says it is blocked instead is a property of the model, from every trial to none. Availability does not settle every edit: where standard and code disagree, agents follow the standard even when it prescribes the worse code, so a stale convention file costs more than no file. Because parametric memory substitutes for reading, on SWE-bench, where models likely know the repositories, reads no longer predict success. Harnesses should keep the facts an edit depends on available when the agent writes, and check that availability against what the agent produces rather than what it reads.", "category": "cs.AI", "cluster": "Agent Infrastructure \u0026 Harnessing", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=25 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文符合筛选标准，属于“保留 (Keep)”类别。\n\n1.  核心对象明确：论文的研究对象是“Coding Agent”（代码智能体），具体针对的是仓库级（Repository-scale）的长程任务。这直接对应了研究焦点中的“单智能体 (Agentic)”和“LLM-based Agents”。\n2.  核心贡献在于智能体机制与评估：论文并非简单地将LLM应用于代码生成，而是深入分析了智能体在执行复杂任务时的记忆机制（Memory）、上下文管理（Context Window/Working Set）以及工具/环境交互（Harness/Execution Environment）。它提出了“Coherence Debt”（一致性债务）这一概念，用于量化智能体在缺乏必要事实（来自上下文或参数记忆）时的失败模式。\n3.  符合“评估与改进”标准：根据筛选标准，“如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留”。该论文通过控制变量实验（供应/ withholding 事实通道），诊断了智能体在长程任务中的失败机制（如幻觉、错误遵循过时标准等），并提出了针对 Harness 设计的改进建议（如如何保持事实可用性、如何验证输出而非仅依赖读取）。这直接服务于“构建、改进、评估 LLM智能体”的目标。\n4.  排除项不适用：虽然涉及代码领域，但其核心贡献是通用的智能体记忆与上下文管理理论，而非特定领域的非演化应用；虽然涉及图（coupled-fact graph），但这是作为建模智能体状态依赖关系的工具，而非研究图神经网络或知识图谱技术本身，因此不触发图相关技术的排除规则。\n\n综上，该论文深入探讨了LLM智能体在长程任务中的记忆、上下文依赖及失败模式，对理解和改进智能体的执行环境（Harness）和记忆机制具有重要价值，故判定为相关。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在 Repository-scale coding 任务中，决定 Agent 编辑成功与否的关键因素是什么？具体而言，作者探究了在编辑发生的瞬间（edit-time），哪些耦合事实（coupled facts）必须可用，以及近期上下文（recent context）与模型参数记忆（parametric memory）这两个信息通道是否可以相互替代。为了解决这一问题，作者引入了“一致性债务”（coherence debt）的概念，将其定义为在编辑时刻，既不在有效上下文窗口内、也不在模型参数记忆中的必要事实的数量。\n\n这个问题的重要性在于，现有的评估体系往往只关注最终的补丁（patch）是否正确，而忽略了 Agent 在构建代码一致性时所面临的隐性认知负荷。在大规模仓库中，一个文件的正确性依赖于测试、导入、配置和迁移规则等其他地方的事实。如果这些耦合事实不可用，Agent 就会产生一致性债务。解决这一问题具有双重价值：首先，它揭示了 Agent 失败的因果机制——即“可用性决定结果，距离无关紧要”（availability decides, distance does not），证明了只要事实存在，无论其在上下文中的位置远近，都能被有效利用，从而推翻了关于长上下文位置衰减的某些假设。其次，它为 Harness 设计提供了指导原则：Harness 应确保编辑依赖的事实可用，并检查 Agent 产出的内容而非其读取的行为，因为 Agent 在事实缺失时往往会通过“幻觉”或“伪造”来填补空白，导致基于读取行为的监控指标失效。\n\n### § 2 前人工作与不足\n\n尽管已有大量研究致力于 Repository-scale coding，但之前的工作未能精确界定编辑时刻的事实可用性对成功率的因果影响。现有的相关工作主要包括：建立仓库级评估基准（如 SWE-bench, Jimenez et al. 2024）；构建工具使用循环（如 SWE-agent, Yang et al. 2024; OpenHands, Wang et al. 2025）；利用仓库结构指导检索（如 RepoGraph, Ouyang et al. 2025）；以及观察成功 Agent 在编辑前会收集上下文的现象（Mehtiyev and Assunção 2026）。\n\n这些前人工作的不足主要体现在以下几个方面：\n\n1.  **缺乏因果隔离与通道替代性分析**：现有研究大多将上下文检索视为黑盒或仅关注检索质量（如 ContextBench, Li et al. 2026），并未区分事实是通过“近期上下文”还是“参数记忆”获得的。它们未能回答这两个通道是否可以相互替代，也未量化当两者都缺失时（即产生 coherence debt）的具体后果。例如，SWE-bench 等基准测试中，模型可能凭借对知名仓库的参数记忆（parametric memory）成功完成任务，这使得基于读取行为（read-derived instruments）的指标无法预测成功，因为模型根本不需要读取那些它已经“记住”的事实。\n2.  **监控指标的失效与误判**：之前的轨迹分析（Trajectory studies）通常假设 Agent 的读取行为反映了其知识状态。然而，本文指出，当事实缺失时，Agent 不会停止工作，而是会“伪造”文件或猜测值（fabricating the file or guessing the value）。因此，基于读取事件的监控指标（如 residency score）实际上是在寻找一个已经被 Agent 用错误信息填补的“空洞”，导致指标高估了覆盖率。前人工作未考虑到这种“补偿性行为”（compensatory behavior），导致其诊断工具在事实缺失时失效。\n3.  **对“耦合”与“分解”的机制理解不足**：虽然有多 Agent 分解的研究（如 Yang et al. 2026; Pan and Luo 2026），但它们主要基于任务结构的静态划分，未从“耦合事实图”（coupled-fact graph）的角度动态分析分解对一致性的影响。本文指出，分解只有在保持相互一致的事实在一起时才有效，而前人工作未能在编辑时刻的事实粒度上验证这一假设。\n4.  **未区分“覆盖”与“权威”**：现有工作假设只要事实被覆盖（covered），编辑就会正确。但本文发现，当书面标准与现有代码冲突时，Agent 会遵循书面标准，即使该标准是错误的。前人工作未考虑到这种“权威冲突”（authority conflict），导致其无法解释为何在某些情况下，即使事实可用，Agent 仍会生成错误代码。\n\n综上所述，前人工作虽然建立了评估框架和工具循环，但缺乏对编辑时刻事实可用性的细粒度因果分析，且其监控指标因未考虑参数记忆和 Agent 的补偿性行为而存在根本性缺陷。", "core_insight": "### § 3 重建作者的思考路径\n\n在研究 Repository-scale Coding Agents 时，研究者观察到一个反直觉的现象：现有的评估指标（如 SWE-bench 的解决率）与 Agent 在轨迹中读取的代码量或上下文窗口大小之间缺乏强相关性。传统的虚拟内存理论中的 Working Set 概念暗示，程序性能取决于当前活跃的数据页是否驻留内存，但在 LLM 的无地址（addressless）上下文中，这一概念难以直接应用。研究者注意到，Agent 的失败往往不是因为“不知道”代码逻辑，而是因为编辑时缺乏与当前修改耦合的关键事实（如重命名后的符号、特定的配置值或迁移规则）。\n\n现有的工具使用循环（Tool-using loops）通常假设 Agent 会通过读取文件来获取必要信息，但日志分析显示，Agent 经常在没有读取关键依赖文件的情况下进行编辑，或者读取了大量无关文件却错过了关键事实。更令人困惑的是，当关键事实缺失时，Agent 很少报告“无法继续”，而是倾向于“幻觉”出文件内容或猜测值，导致错误的修改而非空操作。这暗示了传统的基于“读取行为”的代理指标（如 Residency Score）存在根本缺陷，因为它们无法区分“通过参数记忆（Parametric Memory）已知”和“通过上下文（Context）已知”的事实，也无法捕捉 Agent 在事实缺失时的补偿性行为。\n\n此外，研究者发现，当 API 发生重命名或引入虚构库时，即使模型在训练数据中见过类似库，其表现也会急剧下降，且不同模型在相同的测试用例上失败，这表明模型依赖的是特定的参数记忆而非通用推理能力。同时，当文档标准与现有代码冲突时，Agent 倾向于遵循文档，即使文档是过时的。这些观察促使研究者提出一个核心假设：编辑的成功与否不取决于上下文的总量或距离，而取决于编辑时刻（Edit-time）所需的关键耦合事实（Coupled Facts）是否通过“近期上下文”或“参数记忆”这两个通道之一可用。如果两者皆无，则产生“一致性债务（Coherence Debt）”，导致失败。因此，需要一个新的框架来量化这种债务，并验证“可用性（Availability）”而非“邻近性（Proximity）”才是决定因素。\n\n### § 4 核心 Intuition\n\n这篇论文的核心直觉是：Repository-scale 编程任务的成功不取决于 Agent 消耗了多少 Token 或读取了多少文件，而取决于在**编辑发生的那一刻**，所有与该编辑逻辑耦合的关键事实（如符号定义、配置规则、测试约束）是否通过**近期上下文（Recent Context）**或**模型参数记忆（Parametric Memory）**这两个通道中的至少一个变得可用。\n\n如果关键事实缺失，Agent 不会停止工作，而是会基于幻觉或错误假设生成“错误的工作（Wrong Work）”，这使得基于读取行为的传统指标失效。因此，衡量 Agent 性能的关键不是它读了什么，而是它在写代码时，所需的“一致性事实”是否真正驻留在其有效工作集中，且这种驻留可以通过提供上下文来完全替代模型的记忆。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文并没有提出一个新的 Coding Agent 架构，而是提出了一套**评估框架（Evaluation Framework）**和**因果分析模型**，用于诊断 Repository-scale Coding Agent 在编辑代码时的失败原因。其核心概念是 **Coherence Debt（一致性债务）**，即 Agent 在编辑时刻（Edit-time）所依赖的关键事实（Coupled Facts）未被当前上下文（Recent Context, $R_t$）或模型参数记忆（Parametric Memory, $K_M$）覆盖的部分。\n\n为了清晰说明，我们以一个真实的 **Pydantic v1 到 v2 迁移任务**为例，展示该论文定义的“理想化”分析 Pipeline（注意：这是论文提出的理论分析流程，而非 Agent 自身的运行流程）：\n\n1.  **输入（Input）：任务与耦合事实图构建**\n    *   **任务定义**：假设任务是将一个使用 Pydantic v1 的 FastAPI 应用迁移到 v2。\n    *   **构建耦合事实图（Coupled-fact Graph, $G_T$）**：分析器识别出所有原子事实（Atomic Facts），如 `BaseSettings` 类名、`ConfigDict` 的使用方式、验证器（Validators）的语法变化等。\n    *   **确定关键子集（$C_T$）**：确定哪些事实必须同时正确才能使测试通过。例如，如果代码中使用了 `ConfigDict`，那么导入语句必须正确，且字段定义必须符合 v2 规范。\n\n2.  **处理（Processing）：编辑时刻的覆盖度分析**\n    *   **Agent 执行轨迹记录**：Agent 开始工作，执行 `read`（读取文件）、`edit`（修改代码）、`test`（运行测试）等操作。论文定义了一个五类事件流（Five-event stream）来记录这些动作，特别是 `edit_intent`（编辑意图），其中包含 Agent 声称依赖的事实。\n    *   **计算一致性债务（Coherence Debt Calculation）**：\n        *   当 Agent 准备对文件 $f_i$ 进行编辑 $e_i$ 时，系统检查该编辑所需的事实集合 $C_T(i)$。\n        *   **通道 1 检查（$R_t$）**：检查 Agent 在编辑前的最近窗口内是否读取了包含这些事实的文件（通过静态导入图或实际读取日志判断）。\n        *   **通道 2 检查（$K_M$）**：判断模型是否通过预训练“记住”了这些事实（例如，Pydantic 是知名库，模型可能已知晓其 v2 语法）。\n        *   **债务公式**：$D(e_i) = |C_T(i) \\setminus (R_t \\cup K_M)|$。如果 $D(e_i) \u003E 0$，说明存在一致性债务。\n    *   **故障注入（Fault Injection，实验阶段）**：为了验证因果关系，实验者可以人为地从上下文中移除某些事实（例如，重命名 API 以破坏 $K_M$，或删除文件以破坏 $R_t$），观察 Agent 的行为。\n\n3.  **输出（Output）：诊断与归因**\n    *   **失败归因**：如果测试失败，系统分析 $D(e_i)$。\n        *   若 $D(e_i) \u003E 0$ 且 Agent 生成了错误代码（Fabrication），则归因为 **Coherence Debt**。\n        *   若 $D(e_i) = 0$ 但测试仍失败，则归因为其他原因（如逻辑错误、标准冲突等）。\n    *   **行为分类**：\n        *   **Wrong Work**：Agent 在缺失事实的情况下强行生成代码（如编造文件内容）。\n        *   **Blocked**：Agent 明确报告缺少信息（较少见，取决于模型）。\n    *   **最终结论**：输出一个关于“可用性（Availability）”而非“距离（Distance）”或“阅读量（Read Volume）”的诊断报告。例如：“Agent 失败是因为在编辑 `settings.py` 时，`ConfigDict` 的迁移规则既不在上下文窗口中，模型也未正确回忆（由于重命名），导致产生了一致性债务。”\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文的核心数学推导非常简洁，主要是一个集合论定义，用于量化 **Coherence Debt**。\n\n**理论背景：**\n传统评估往往关注 Agent 读了多少文件（Read Volume）或上下文窗口有多大。但论文指出，关键在于**编辑时刻（Edit-time）**，Agent 是否拥有完成该编辑所需的**所有耦合事实（Coupled Facts）**。这些事实可以通过两个通道获得：\n1.  **Recent Context ($R_t$)**：Agent 刚刚读取的上下文。\n2.  **Parametric Memory ($K_M$)**：模型预训练时记住的知识。\n\n**核心公式：**\n$$ D(e_i) = |C_T(i) \\setminus (R_t \\cup K_M)| $$\n\n**公式 Intuition（面向数学基础较弱的读者）：**\n*   **$C_T(i)$**：想象你要修一辆车（执行编辑 $e_i$），你需要一套特定的零件（关键事实集合 $C_T(i)$），比如螺丝、扳手、说明书。\n*   **$R_t \\cup K_M$**：这是你手头现有的资源。$R_t$ 是你刚才从工具箱里拿出来的零件（读取的上下文），$K_M$ 是你脑子里记得的修理知识（模型记忆）。两者的并集（$\\cup$）意味着只要零件在工具箱里**或者**你脑子里记得，都算“有”。\n*   **$\\setminus$ (差集)**：从“需要的零件”中减去“手头有的资源”。\n*   **$|...|$ (基数/数量)**：数一数剩下多少个零件是你既没拿到、也没记住的。\n*   **$D(e_i)$ (Coherence Debt)**：这就是你的“一致性债务”。如果债务大于 0，说明你缺少关键信息，此时强行修理（编辑代码）极大概率会出错。\n\n**关键推论（Proposition 1）：**\n论文通过模拟器证明了一个重要的测量偏差：\n*   如果我们只能看到 Agent 的读取日志（Event-only estimator），我们只能看到 $R_t$，看不到 $K_M$。\n*   因此，基于读取日志的估算器会报告缺失集合为 $C_T(i) \\setminus R_t$。\n*   这个估算值实际上等于 **真实缺失 ($U$) + 模型记忆覆盖的部分 ($P$)**。\n*   **结论**：基于读取的指标会**高估**一致性债务，高估的量正好等于模型记忆覆盖的部分。这解释了为什么在 SWE-bench 等基准上，读取行为与成功率相关性低——因为模型可能根本没读，但靠记忆（$K_M$）完成了任务。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n在 Repository-scale Coding 任务中，Agent 的编辑正确性究竟取决于什么？是上下文的长度、读取的文件数量，还是编辑时刻关键事实的**可用性（Availability）**？此外，上下文（Context）和模型记忆（Parametric Memory）是否可以相互替代？\n\n**2. 设计了什么实验验证这个问题？**\n*   **通道控制实验（Channel-Control Workloads）**：\n    *   **Closed-book（闭卷）**：不提供工作区，也不依赖模型记忆（使用虚构 API），验证当两个通道都为空时，Agent 是否完全失败（Floor）。\n    *   **Front-load（前置加载）**：将所需事实直接放入 Prompt，验证提供事实是否能恢复成功率（Ceiling）。\n    *   **Rename（重命名）**：对真实库（Pydantic）进行 API 重命名，破坏模型的参数记忆（$K_M$），观察失败模式是否一致。\n*   **故障注入实验（Fault Injection）**：\n    *   在合成任务中，精确控制缺失的事实数量（Withholding facts），观察测试通过率是否线性下降。\n    *   改变事实与编辑位置的距离（Distance），验证距离是否影响成功率。\n*   **冲突源实验（Conflicting Source）**：\n    *   提供相互矛盾的文档和代码，观察 Agent 遵循哪个来源，验证“覆盖度”是否足以决定编辑结果。\n*   **Harness 对比实验**：\n    *   比较不同 Harness（如 Claude Code, Codex, Aider）在相同任务下的 Token 消耗和成功率，验证“花费更多 Token 是否能弥补事实缺失”。\n\n**3. 问题的答案是什么？**\n*   **可用性决定结果，距离无关紧要**：只要关键事实可用（无论是在 Prompt 开头还是结尾，无论模型是否读取），成功率就高；如果事实缺失，无论 Agent 读了多少无关文件，都会失败。缺失一个事实导致的损失是线性的，仅影响该事实支持的工作量，不会级联崩溃。\n*   **通道可替代**：上下文（$R_t$）和模型记忆（$K_M$）在提供事实方面是可替代的。如果模型记住了 API，它不需要读取文件；如果没记住，必须通过上下文提供。\n*   **缺失导致“错误工作”而非“无工作”**：当事实缺失时，Agent 通常不会停止，而是会编造文件内容或猜测值（Fabrication），导致错误的代码生成。\n*   **覆盖度不是充分条件**：当文档和代码冲突时，Agent 倾向于遵循文档（Standard），即使文档是错误的。因此，一个过时的标准文件比没有文件更糟糕。\n*   **现有指标失效**：基于读取行为的指标（如 Residency Score）在 SWE-bench 等真实基准上无法预测成功，因为模型记忆（$K_M$）掩盖了读取行为，且 Agent 会补偿缺失事实。", "additional_insights": "### § 8 Take-aways\n\nRepository-scale coding success depends on **edit-time coverage** of coupled facts, where **recent context** and **parametric memory** act as substitutable channels rather than complementary ones. Withholding a required fact causes linear damage proportional to the work it supports, proving that **coherence debt** is additive rather than cascading. Fact **presence** determines success, while **distance** within the context window (up to 200k characters) has no measurable impact on retrieval reliability. Agents do not abstain when facts are missing; instead, they fabricate files or guess values, making read-based instruments blind to the actual shortfall. A stale written standard overrides working code, meaning a wrong convention file is more harmful than no file at all. On benchmarks like **SWE-bench**, where models likely possess strong **parametric memory**, read-derived metrics like **residency score** fail to predict success because the model relies on internal knowledge rather than external reads.\n\n### § 9 最脆弱的假设\n\n最关键的假设是：**Coupled-fact graph ($G_T$) 可以被静态导入图或简单的文本规则近似，且任务所需的原子事实集合 ($C_T$) 是独立于具体实现路径的。**\n\n如果这个假设不成立，即事实之间的耦合关系是动态的、隐式的，或者不同的正确补丁需要完全不同的事实子集，那么论文中定义的 **coherence debt** 和 **residency score** 将失去因果解释力。在实际中，许多依赖关系通过运行时反射、环境变量或复杂的配置逻辑建立，静态分析无法捕获这些动态耦合。此外，$C_T$ 依赖于具体的实现路径，而代理在编辑前并不确定路径，导致“前置加载”所有必要事实在理论上不可行，除非已知唯一解。\n\n论文通过构建人工合成的 **synthetic-coherence tasks** 来验证这一假设，其中耦合关系由作者明确定义（如通过随机字面量连接文件），从而确保了 $C_T$ 的已知性和静态性。然而，论文在 **SWE-bench** 上的实验显示，基于导入图的代理指标无法预测真实仓库中的成功，这间接暗示了真实世界中 $G_T$ 的复杂性远超静态导入图，且 **parametric memory** 掩盖了这种复杂性，使得该假设在真实场景下的适用性存疑。\n\n### § 10 最小复现实验\n\n你可以复现 **Section 4.2** 中的 **Supplied-Fact Distance** 实验，以验证“距离不影响事实可用性”这一核心 claim。\n\n**数据与实现：**\n选择一个简单的编程任务（如修改一个 Python 函数以使用特定的常量值）。创建一个包含该常量值的配置文件，并在提示词中插入大量无关的填充文本（filler text），将常量值与编辑指令之间的距离分别设置为 0、32k、64k 和 128k 字符。使用一个主流 LLM（如 Claude Sonnet 或 GPT-4o）作为代理，不提供任何工具访问权限（closed-book），仅通过提示词提供上下文。\n\n**测量：**\n测量代理在每种距离设置下正确引用该常量值的成功率。\n\n**结果判定：**\n如果成功率在所有距离设置下保持统计显著的一致性（例如均接近 100% 或均接近 0%，取决于是否提供事实），则支持论文 claim，即 **presence** 而非 **distance** 决定结果。如果成功率随距离增加而显著下降，则反驳该 claim，表明长上下文中的位置衰减（positional degradation）在编码任务中依然显著。此实验无需构建复杂的代理循环或仓库环境，仅需控制提示词结构即可验证核心机制。", "research_value": "### § 11 最强反例设计\n\n要挑战这篇论文的核心论点，最有力的攻击并非针对“可用性决定结果”这一现象，而是针对其**因果归因的排他性**以及**静态耦合假设在动态系统中的失效**。论文将失败归因于 `Coherence Debt`（即事实缺失），并假设只要事实可用（$R_t \\cup K_M$ 覆盖 $C_T$），Agent 就能成功。然而，这一逻辑忽略了**推理复杂度（Reasoning Complexity）**和**上下文干扰（Context Interference）**这两个关键变量。\n\n首先，设计一个**“高债务但成功”与“零债务但失败”的反例场景**，以证明 `Coherence Debt` 既非充分也非必要条件。\n*   **反例 1：零债务但失败（推理瓶颈）**。构造一个任务，其中所有必要的 API 签名、导入路径和配置项都明确提供在 Prompt 中（$D(e_i)=0$），且模型对这些库有极强的 `Parametric Memory`。但是，任务要求 Agent 执行一个复杂的、多步骤的逻辑推导（例如，在迁移过程中重构一个递归算法以适配新的异步接口，同时保持特定的边界条件）。如果 Agent 的推理能力不足以处理这种逻辑转换，即使事实完全可用，它也会生成错误的代码。此时，论文框架会错误地诊断失败原因为“其他原因”（如逻辑错误），从而掩盖了真正的瓶颈：**事实可用性不等于推理可行性**。这挑战了论文隐含的假设，即只要事实到位，编辑就是机械性的替换或简单适配。\n*   **反例 2：高债务但成功（隐式模式匹配）**。构造一个任务，其中关键事实（如特定的配置键名）既不在 `Recent Context` 中，也不在模型的 `Parametric Memory` 中（通过重命名和闭卷测试确保 $D(e_i) \u003E 0$）。然而，该任务的结构与模型训练数据中的某个常见模式高度相似（例如，标准的 `pytest` 配置结构）。Agent 可能通过**模式补全（Pattern Completion）**而非事实检索来生成代码，并意外地猜对了正确的键名或结构。在这种情况下，Agent 成功了，但根据论文定义，它产生了 `Coherence Debt`。这表明 `Coherence Debt` 是一个**代理指标（Proxy Metric）**，而非根本原因，因为它无法区分“基于事实的正确性”和“基于统计概率的偶然正确性”。\n\n其次，攻击**静态耦合图（Static Coupled-fact Graph）的局限性**。\n*   **动态依赖反例**：在真实的 Repository-scale 任务中，许多依赖关系是**运行时动态解析**的（例如，通过 `importlib` 动态加载模块，或通过环境变量决定配置源）。论文的 `Coupled-fact Graph` 基于静态导入分析，无法捕获这些动态耦合。设计一个实验，其中 Agent 需要修改一个动态加载的插件系统。静态分析显示文件 A 和文件 B 无耦合，因此 $C_T$ 不包含文件 B 的事实。Agent 在编辑文件 A 时未读取文件 B（$D(e_i)=0$ 对于静态图而言），但运行时失败，因为文件 B 的接口发生了变化。此时，论文框架会错误地认为没有 `Coherence Debt`，从而无法诊断出真正的失败原因：**动态耦合的事实缺失**。这证明了在动态系统中，基于静态分析的 `Coherence Debt` 计算是**不可靠的**，因为它低估了实际所需的上下文。\n\n最后，挑战**“距离无关紧要”的结论**。\n*   **注意力稀释反例**：虽然论文声称在 200k 字符内距离不影响检索，但这可能仅在**事实稀疏**的情况下成立。设计一个实验，在 Prompt 中插入大量**语义相似但事实错误**的干扰项（Distractors），并将正确事实放置在远距离位置。如果 Agent 的注意力机制被干扰项捕获，导致它忽略了远距离的正确事实，那么成功率将显著下降。这将证明，在**高噪声上下文**中，距离和位置确实影响事实的**有效可用性（Effective Availability）**，而不仅仅是物理存在。这挑战了论文将“存在”等同于“可用”的简化假设。\n\n### § 12 Follow-up Research Idea\n\n基于对 `Coherence Debt` 框架局限性的理解，特别是其**静态耦合假设**和**对推理复杂度的忽视**，我提出一个新的研究方向：**Dynamic Coherence Verification via Runtime Tracing（基于运行时追踪的动态一致性验证）**。\n\n**（a）驱动局限与未满足需求：**\n现有工作（包括本文）主要关注**编辑时刻（Edit-time）**的静态事实覆盖，忽略了**运行时（Runtime）**的动态依赖和**推理过程（Reasoning Process）**的复杂性。`Coherence Debt` 无法捕获动态导入、环境变量依赖以及 Agent 在推理过程中的逻辑错误。此外，基于读取行为的指标在 `Parametric Memory` 存在时失效，而基于静态图的指标在动态系统中失效。因此，我们需要一种能够**动态验证**事实可用性和一致性的方法，而不仅仅是静态预测。\n\n**（b）借鉴相邻领域的方法：**\n借鉴**软件工程中动态分析（Dynamic Analysis）**和**形式化验证（Formal Verification）**的方法。具体来说，利用**运行时追踪（Runtime Tracing）**技术（如 Python 的 `sys.settrace` 或 eBPF）来捕获 Agent 生成代码在测试执行时的实际依赖路径。同时，借鉴**程序合成（Program Synthesis）**中的**约束求解（Constraint Solving）**思想，将代码编辑视为一个约束满足问题，其中约束不仅包括语法和导入，还包括运行时行为。\n\n**（c）第一个实验设计：**\n1.  **构建动态耦合图（Dynamic Coupled-fact Graph）**：在 Agent 执行任务时，不仅记录其读取的文件，还通过**插桩（Instrumentation）**捕获测试运行时的实际模块加载路径、函数调用链和变量赋值。构建一个**动态依赖图**，其中节点是运行时实际访问的代码片段，边是执行时的调用关系。\n2.  **定义动态一致性债务（Dynamic Coherence Debt）**：在编辑时刻，不仅检查静态导入，还检查**预测的运行时依赖**是否在 `Recent Context` 或 `Parametric Memory` 中。如果 Agent 修改的代码在运行时依赖于一个未被覆盖的动态事实（例如，一个动态加载的模块的特定属性），则产生动态债务。\n3.  **对比实验**：在包含动态依赖的任务集（如插件系统、微服务配置）上，比较**静态 Coherence Debt**（本文方法）和**动态 Coherence Debt**（新方法）对失败率的预测能力。预期结果是，动态债务能更准确地预测那些静态分析认为“无债务”但实际失败的情况。\n4.  **推理复杂度分析**：引入**推理深度（Reasoning Depth）**指标，测量 Agent 在编辑前生成的思维链（Chain-of-Thought）长度和复杂度。分析在 `Coherence Debt` 为零的情况下，推理深度与成功率的相关性。这将揭示**事实可用性**与**推理能力**之间的权衡关系，从而提供一个更全面的失败归因模型。\n\n**与已有工作的区别：**\n本文关注**静态事实覆盖**，而新方向关注**动态运行时依赖**和**推理过程**。本文将失败归因于事实缺失，而新方向将失败归因于**动态依赖未覆盖**或**推理不足**。这打开了一个从**静态分析**向**动态验证**和**认知建模**转变的新研究方向，更贴近真实世界中复杂、动态的软件系统。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Bardia Mohammadi\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"**\"\n      ]\n    },\n    {\n      \"name\": \"Lars Klein\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"**\"\n      ]\n    },\n    {\n      \"name\": \"Aman Chadha\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": [\n        \"**\",\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Akhil Arora\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": [\n        \"**\"\n      ]\n    },\n    {\n      \"name\": \"Laurent Bindschaedler\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Max Planck Institute for Software Systems\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"EPFL\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Apple\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Aarhus University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Work done outside of role at Apple.\"\n    },\n    {\n      \"marker\": \"**\",\n      \"text\": \"Equal contribution\"\n    }\n  ]\n}\n```", "summary_translation": "Repository-scale coding 要求智能体在有限的上下文窗口内保持测试、导入、配置和迁移规则的一致性。我们将此建模为重构耦合事实图：在每次编辑中，所需的事实来自近期上下文或参数化记忆，而两者均未覆盖的事实则形成连贯性债务。我们对七个模型和五个测试框架分别提供或 withholding 每个通道，并注入故障。正如预期，当两个通道均为空时，没有模型能在未见过的 API 上完成任务，而在提示中放入事实则恢复了成功。当重命名击败了模型对真实库的记忆时，所有七个模型都在同一位置失败，通过和遗漏相同的测试。可用性决定结果，而距离无关紧要： withholding 一个事实的成本恰好等于它所支持的工作量，而提供的事实无论距离编辑远近都同样有效。测试框架为此支付不同的代价：所有通过每个测试的配置在消耗的 token 数量上相差超过十倍，因为它们以不同的速率重建相同的内容，而当事实被 withholding 时，花费更多并不能恢复任何东西。缺失的事实产生错误的工作而非缺失的工作：被要求行动的智能体会采取行动，伪造文件或猜测值，因此基于读取的工具寻找的漏洞已经被填补。它声称自己被阻塞的频率是模型的属性，从每次试验到无试验不等。可用性并不能解决所有编辑：当标准和代码不一致时，即使标准规定了更差的代码，智能体也会遵循标准，因此过时的约定文件比没有文件成本更高。由于参数化记忆替代了读取，在 SWE-bench 上，模型可能知道这些仓库，读取不再预测成功。测试框架应在智能体编写时保持编辑所依赖的事实可用，并根据智能体产生的内容而非其读取的内容检查可用性。"}]}, {"name": "Benchmarks \u0026 Evaluation Frameworks", "count": 3, "papers": [{"title": "AutoResearch: Insight In, Hallucination Out", "arxiv_id": "2608.17906", "authors": "Yiming Ren, Xiang Liu, Qumeng Sun, Xiao Zhang, Jiahao Li, Haoyang Zhang, Junjie Wang", "summary": "Autonomous research systems are increasingly capable of executing long research workflows, yet automation alone does not ensure that the resulting process remains scientifically grounded. We introduce AutoResearch, a two-stage system that connects Idea Generation with Idea Execution to address both how research ideas are formed and how they are reliably established through experimentation. In Idea Generation, AutoResearch continuously integrates emerging research signals with accumulated domain knowledge, identifies transferable mechanistic insights, and uses multi-model generation and cross-review to produce grounded, testable research plans. In Idea Execution, coordinated agents decompose these plans into experiments, iteratively implement and diagnose them, and employ independent evidence-based review before accepting research conclusions. Across representative settings in cross-modal retrieval, systems optimization, and benchmark-driven machine learning, AutoResearch turns generated ideas into measurable progress, detects and corrects unreliable experimental results, and makes evidence-conditioned decisions to continue, revise, or terminate research directions. For example, on RSICD benchmark, an AutoResearch-generated idea improves mean Recall from 32.84 to 34.69, while recording only 5 audit-confirmed issue events compared with 11-27 for other autonomous research systems. These results demonstrate a research process in which meaningful insight is grounded before experimentation and conclusions are grounded before acceptance: Insight In, Hallucination Out.", "category": "cs.AI", "cluster": "Benchmarks \u0026 Evaluation Frameworks", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Autonomous Research Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-144 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文符合研究范围，核心依据如下：\n\n1.  核心对象为 LLM 智能体系统：论文提出的 \"AutoResearch\" 是一个自主研究系统，明确涉及 \"coordinated agents\"（协调智能体）来分解计划、实施实验和诊断结果。这属于多智能体系统（Multi-Agent Systems）或复杂单智能体工作流的范畴，符合方向 1（单智能体规划/工具使用）和方向 2（多智能体协作）。\n\n2.  具备自我演化与自我修正机制：摘要中强调系统能够 \"iteratively implement and diagnose\"（迭代实施与诊断）、\"detects and corrects unreliable experimental results\"（检测并纠正不可靠的实验结果）以及 \"make evidence-conditioned decisions to continue, revise, or terminate\"（基于证据决定继续、修改或终止）。这种基于反馈的迭代改进、自我纠错和动态决策过程，完全契合方向 3（自我演化/Self-Evolving）中关于智能体通过经验、反思或环境反馈进行自我完善和迭代的定义。\n\n3.  非纯应用，而是机制创新：虽然应用场景是“科学研究”，但论文的贡献不在于解决某个具体的科学问题，而在于提出了一种新的智能体工作流框架（Idea Generation + Idea Execution），特别是引入了 \"cross-review\"（交叉审查）和 \"evidence-based review\"（基于证据的审查）机制来减少幻觉并提高可靠性。这属于构建和改进 LLM 智能体方法论的研究，而非简单的领域应用。\n\n4.  排除项检查：\n       不涉及安全/对齐/可解释性等排除项。\n       不涉及纯基础设施或硬件加速。\n       虽然涉及多智能体，但重点在于协作机制和迭代优化，而非单纯的拓扑结构或通信协议。\n       虽然标题提到 \"Hallucination Out\"，但其核心是通过智能体的自我审查和迭代机制来解决，属于智能体能力改进的一部分，而非单纯的幻觉检测算法研究。\n\n综上，该论文研究的是具有自我修正和迭代能力的自主智能体系统，符合“构建、改进、演化 LLM 智能体”的核心目标。", "intro_logic": "### § 1 研究问题与重要性\n\nAutoResearch 旨在解决自主研究系统（Autonomous Research Systems）中“自动化”与“科学严谨性”之间的脱节问题。具体而言，核心研究问题是如何构建一个两阶段系统，将 **Idea Generation**（基于领域知识和新兴信号的洞察生成）与 **Idea Execution**（基于证据的实验执行与验证）紧密耦合，从而在研究过程中实现 **Insight In, Hallucination Out**。这一问题的重要性在于，现有的自主研究系统往往过度关注工作流的自动化程度（Automation Dimension），即减少人类干预并延长代理执行链条，却忽视了研究过程的科学根基（Research Dimension）。如果缺乏对机制性洞察（Mechanistic Insight）的严格筛选和对实验结论的证据支撑（Evidence Grounding），系统极易产生看似连贯但缺乏实证支持的“系统性幻觉”（System-level Hallucination），导致不可靠的研究结论被错误接受。解决这一问题能够带来显著价值：首先，它确保了生成的研究想法具有可解释的机制基础，而非表面关联；其次，通过独立的证据审查机制，系统能够检测并纠正实施或测量中的错误，防止错误传播；最后，它使系统能够基于证据做出继续、修订或终止研究方向的理性决策，从而将自主研究从单纯的代码生成工具提升为具备科学推理能力的可靠研究伙伴。\n\n### § 2 前人工作与不足\n\n尽管已有多种自主研究系统被提出，如 **The AI Scientist** [1]、**Agent Laboratory** [2]、**R\u0026D-Agent** [6] 和 **AutoResearchClaw** [7]，但它们在不同程度上存在局限性，未能完全解决上述问题。这些系统通常基于用户提供的想法、目标或预定义的实验上下文进行操作，或者虽然具备自主假设生成能力，但在将新兴信号转化为领域接地（Domain-grounded）假设方面仍显不足。具体而言，**The AI Scientist** 和 **Agent Laboratory** 等端到端工作流系统往往缺乏对研究背景持续演进的维护，难以识别跨领域的可转移机制（Transferable Mechanisms），导致生成的想法可能缺乏深层的技术合理性。**R\u0026D-Agent** 和 **AutoResearchClaw** 虽然引入了迭代研发循环和故障恢复机制，但在执行阶段，它们往往未能严格区分“产生结果”与“确立结果有效性”。由于缺乏独立的、基于新鲜上下文（Fresh-context）的审查代理（Reviewer/Critic），这些系统中的实施错误、测量偏差或解释谬误容易在连贯的叙事中被掩盖，形成未被充分支持的结论。此外，现有系统通常缺乏对实验结果可靠性的审计机制，导致在评测中确认的问题事件（Audit-confirmed Issue Events）数量远高于 AutoResearch。根本原因在于，前人工作多将自动化视为目的，而未将“洞察的接地”和“结论的证据支撑”作为核心约束条件，导致系统在追求工作流长度的同时牺牲了科学发现的严谨性。", "core_insight": "### § 3 重建作者的思考路径\n\n在 AutoResearch 出现之前，自主科研系统（Autonomous Research Systems）的发展主要沿着“自动化”维度推进，即通过 LLM 和 Agentic Systems 将科研流程中的假设生成、代码实现、实验执行等环节尽可能多地委托给 AI，以减少人工干预。然而，这种以“自动化程度”为核心的范式存在两个根本性的缺陷，导致了所谓的“系统级幻觉”（System-level Hallucination）。\n\n首先，在 **Idea Generation** 阶段，现有系统（如 The AI Scientist, Agent Laboratory）往往依赖于用户提供的初始目标或预定义的实验上下文，缺乏从动态变化的科研信号中自主提取“机制性洞察”（Mechanistic Insight）的能力。它们倾向于进行表层的术语组合或基于已有文献的简单延伸，而非识别可迁移的技术机制。这导致生成的假设往往缺乏深刻的科学依据，仅仅是“新颖”而非“有意义”。\n\n其次，在 **Idea Execution** 阶段，尽管引入了迭代开发和失败恢复机制，但大多数系统将“产生结果”与“验证结果”混为一谈。由于 LLM 具有强烈的自洽性倾向，当实验出现错误（如测量偏差、实现 Bug）时，系统往往会通过“合理化”错误来维持叙事的一致性，而不是质疑结果的有效性。这种“锚定效应”（Anchoring Bias）使得不可靠的实验结果被错误地接受为研究结论，形成了从错误实现到错误结论的传播链条。\n\n因此，一个真正可靠的自主科研系统不能仅仅追求流程的自动化，而必须解决“接地”（Grounding）问题。作者意识到，必须将科研过程解耦为两个具有不同接地要求的阶段：一是 **Knowledge-grounded Research Discovery**，即从外部信号和领域知识中提炼出可测试的、机制明确的假设；二是 **Evidence-grounded Research Execution**，即通过独立的、基于证据的验证流程来确立结论，确保只有经过严格审计的结果才能被接受。这种从“自动化执行”到“证据驱动决策”的范式转变，是 AutoResearch 提出的核心逻辑起点。\n\n### § 4 核心 Intuition\n\nAutoResearch 的核心直觉在于将科研过程严格解耦为“洞察注入”（Insight In）与“幻觉剔除”（Hallucination Out）两个阶段，以解决自主系统中常见的“自洽性幻觉”问题。在 **Idea Generation** 阶段，系统不直接生成新颖性，而是通过多模型交叉验证，从外部信号中提炼出可迁移的“机制性洞察”（Mechanistic Insight），确保假设在实验前就具备科学合理性。在 **Idea Execution** 阶段，系统引入独立的“新鲜上下文”（Fresh-context）评估代理，将结果的生产与验证分离，强制要求所有结论必须通过基于证据的独立审计，从而阻断错误实现或测量偏差向最终研究结论的传播。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**AutoResearch** 的核心方法是一个两阶段的自主研究系统，旨在解决现有系统在“自动化”维度上的过度追求而忽视“科学性”维度的问题。其核心逻辑是 **Insight In, Hallucination Out**：在实验前确保研究灵感（Insight）有坚实的理论或机制基础，在实验后确保结论（Conclusion）有确凿的证据支持，从而消除系统级的幻觉（Hallucination）。\n\n完整的 Pipeline 分为 **Idea Generation（灵感生成）** 和 **Idea Execution（灵感执行）** 两个阶段，具体步骤如下：\n\n#### 第一阶段：Idea Generation（灵感生成）\n该阶段的目标是将外部信号转化为可测试的研究假设（Hypothesis）和执行计划（Plan）。\n\n1.  **构建动态研究上下文 (Building an Evolving Research Context)**：\n    *   **输入**：系统持续从研究社区、论文库、代码仓库及社交媒体（如 X, Xiaohongshu）收集新兴的研究信号（Signals, $S_t$），并结合目标领域（Domain, $D$）的累积知识库（Knowledge Base, $K_t$）。\n    *   **处理**：系统利用来源感知的质量先验（Source-aware quality priors）对信号进行去重、归一化和基于模型的筛选，保留具有实质性技术内容的信号。\n    *   **目的**：捕捉“领域已知什么”以及“高质量观察者新发现了什么”。\n\n2.  **从信号到可迁移洞察 (From Research Signals to Transferable Insights)**：\n    *   **处理**：系统不直接生成新颖性，而是寻找**机制性洞察（Mechanistic Insight）**。即识别出那些技术原理可以从原始设置中剥离，并应用于目标领域未解决问题的方法或观察。\n    *   **生成**：多个前沿模型（Frontier Models）独立生成候选假设（Candidate Hypotheses, $H$）。生成器需判断信号中的机制是否能解决目标领域的问题，若无法建立实质性联系，则明确输出 `nomatch`，避免强行拼凑。\n\n3.  **从洞察到可执行研究计划 (From an Insight to an Executable Research Idea)**：\n    *   **交叉验证 (Cross-validation)**：三个独立的评审模型（Reviewers）对每个候选假设进行评估，至少需要两个正面评价才能通过。评审重点在于机制的技术意义、方法的简洁性（以便隔离效应）以及实验协议的可测试性。\n    *   **新鲜度与一致性检查**：检查假设是否过时，并确保其充分利用了目标领域的知识。\n    *   **输出**：生成一个包含接地假设（Grounded Hypothesis, $h$）和具体测试计划（Executable Plan, $p$）的对 $(h, p)$。\n\n#### 第二阶段：Idea Execution（灵感执行）\n该阶段的目标是将计划转化为由证据支持的实验结果，并通过独立审查防止幻觉。\n\n1.  **任务分解与状态管理 (Decomposable Execution)**：\n    *   **处理**：将研究计划表示为任务图（Task Graph），包含可执行任务（如实现、试点评估、消融实验、诊断、验证）及其依赖关系。\n    *   **执行**：协调器（Coordinator）识别满足前置条件的任务并并发分发。每个动作 $a_k$ 产生环境输出或工件 $o_k$，并更新持久化的研究状态 $x_k$。这种状态管理允许项目从已验证的进度恢复，而非依赖不透明的对话历史。\n\n2.  **错误检测与修正触发 (Error Detection and Correction)**：\n    *   **独立评估**：系统故意将实现与关键评估分离。一个**新鲜上下文代理（Fresh-context Agent）**作为独立评估者，不继承生产者的推理轨迹，仅基于假设、计划、实验工件和评估标准进行独立评估。\n    *   **诊断**：如果检测到语义不匹配、标准失败或证据不足，系统触发修正路径（Correction Path），而不是将错误结果吸收进后续叙述中。意外或负面观察被视为诊断和决策的信号。\n\n3.  **证据支持与研究结论 (Evidence Support and Research Claim)**：\n    *   **验证**：对于研究主张 $c$，系统识别相关的证据子集 $E_c$，并要求独立验证。只有当存在证据 $e \\in E$ 支持主张 $c$ 时，主张才被接受。\n    *   **决策**：根据证据，系统决定 **CONTINUE**（继续）、**REVISE**（修订）、**SCALE**（扩展）或 **STOP**（终止）。负面结果若由证据支持，也是有效的研究结果；而无证据支持的正面结果则被拒绝。\n    *   **输出**：最终的研究结论及对应的证据记录，通过只读监控面板（Monitoring Dashboard）暴露过程可见性。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的理论数学推导，而是通过形式化定义来明确研究过程的约束条件。以下是核心公式的直觉解释：\n\n1.  **研究上下文定义**：\n    $$ C_t = (K_t, S_t) $$\n    *   **直觉**：在时间 $t$，系统拥有的“知识”由两部分组成：$K_t$ 是过去积累的领域知识（已知真理），$S_t$ 是当前观察到的新信号（新发现）。这强调了研究是基于“旧知”与“新知”的结合。\n\n2.  **灵感生成映射**：\n    $$ G_{idea}: (C_t, D) \\rightarrow (h, p) $$\n    *   **直觉**：灵感生成器 $G_{idea}$ 是一个函数，它接收当前上下文 $C_t$ 和目标领域 $D$，输出一个假设 $h$ 和一个计划 $p$。关键在于，这个映射要求 $h$ 必须是“接地”的（Grounded），即其动机可追溯至上下文，且机制有意义，而非表面关联。\n\n3.  **执行状态更新**：\n    $$ x_{k+1} = F(x_k, a_k, o_k), \\quad x_0 = (h, p) $$\n    *   **直觉**：研究执行是一个状态机。初始状态 $x_0$ 是假设和计划。每一步 $k$，系统执行动作 $a_k$（如写代码、跑实验），观察结果 $o_k$（如日志、指标），然后通过函数 $F$ 更新状态 $x_{k+1}$。状态 $x_k$ 记录了所有历史、代码、结果和批评，确保过程可追溯。\n\n4.  **证据接地约束（Hallucination Out 的核心）**：\n    $$ \\text{Accept}(c) \\Rightarrow \\exists e \\in E; \\text{Supports}(e, c) = 1 $$\n    *   **直觉**：这是防止幻觉的关键规则。一个研究主张 $c$ 只有在证据集 $E$ 中存在至少一个证据 $e$ 明确支持它时，才能被接受。如果中间输出看起来很好但没有确凿证据（如未验证的代码、不稳定的指标），它不能被提升为最终结论。\n\n---\n\n### § 7 实验设计与结论\n\n论文通过三个代表性场景验证了 AutoResearch 在将灵感转化为进展、检测不可靠结果以及基于证据做出决策方面的能力。\n\n**1. 验证灵感能否转化为可测量的进展 (Can AutoResearch Turn a Research Idea into Measurable Progress?)**\n*   **提出的问题**：自主生成的研究想法是否能在受控实验中转化为具体的、可测量的性能提升，且过程可靠？\n*   **设计的实验**：在遥感图像字幕数据集（RSICD）上进行跨模态检索任务。AutoResearch 生成并交叉验证了一个分阶段假设（全局对齐、文本引导局部聚合、实体-位置关联）。系统逐步引入每个组件，并在固定协议下评估平均召回率（mR）。同时，审计整个研究过程，记录确认的问题事件（Audit-confirmed issue events）。\n*   **问题的答案**：AutoResearch 生成的想法使 mR 从 32.84 提升到 34.69（+1.85），且提升是单调的，证明了机制的可分解性和可测试性。在可靠性方面，AutoResearch 仅记录了 5 个确认问题事件，远低于其他系统（11-27 个），表明其执行轨迹更可靠。\n\n**2. 验证系统能否检测和纠正不可靠的结果 (Can AutoResearch Detect and Correct an Unreliable Result?)**\n*   **提出的问题**：当实验结果看似成功但证据不足时，系统能否拒绝接受并诊断出根本原因？\n*   **设计的实验**：进行一个经典的矩阵乘法任务（1024x1024 FP32），要求速度 \u003C200ms，误差 \u003C1e-5，且运行间变异系数 \u003C20%。这是一个可严格验证正确性和稳定性的任务。\n*   **问题的答案**：AutoResearch 初始满足了速度和精度，但试点测试（Pilot）因稳定性失败。系统没有接受这个快速结果，而是触发诊断，发现是计时错误（CPU 时间与墙钟时间混淆）。修正后，系统建立了可复现的 3.4ms 基线。AutoResearch 记录了 4 个确认问题事件，是所有对比系统中最低的，证明了其证据接地执行的有效性。\n\n**3. 验证系统能否基于证据决定继续、修订或停止 (Can AutoResearch Decide When to Continue, Revise, or Stop?)**\n*   **提出的问题**：系统能否根据实验证据决定研究方向的下一步行动，而不是盲目继续实验？\n*   **设计的实验**：在三个 Kaggle 机器学习任务（Titanic, House Prices, Disaster Tweets）上，从低成本基线开始，迭代评估修改，并与预定目标比较。\n*   **问题的答案**：\n    *   **Titanic**：特征扩展使准确率超过目标，系统决定 **Scale-up**（扩展）。\n    *   **House Prices**：误差接近但未达到目标，系统决定 **Revise**（修订）以继续优化。\n    *   **Disaster Tweets**：F1 分数远低于目标且增益递减，系统决定 **Stop**（终止），并保留负面结果。\n    *   这表明 AutoResearch 的研究闭合（Research Closure）是基于累积证据的，而非执行长度，能够做出合理的证据条件决策。", "additional_insights": "### § 8 Take-aways\n\nAutoResearch 的核心贡献在于将自主研究系统从单纯的“自动化执行”范式转向“知识驱动发现”与“证据驱动验证”的双阶段架构，旨在解决现有系统在 Idea Generation 中缺乏机制洞察（Insight）以及在 Idea Execution 中容易产生幻觉结论（Hallucination）的问题。在 Idea Generation 阶段，系统通过整合外部研究信号（Research Signals）与领域知识库（Domain Knowledge Base），利用多模型生成与交叉审查（Cross-review）机制，强制要求生成的假设必须基于可迁移的机制性洞察（Mechanistic Insight）而非表面关联，从而确保研究方向的科学合理性。在 Idea Execution 阶段，系统采用多智能体工作流（Multi-agent Workflows）将研究计划分解为可执行任务，并引入独立的“新鲜上下文”评估者（Fresh-context Agent）对实验结果进行基于证据的审查（Evidence-based Review），只有当实验产出通过独立验证并满足预设标准时，结论才会被接受，否则触发诊断或终止流程。实验结果表明，在 RSICD 跨模态检索任务中，AutoResearch 生成的想法带来了可测量的性能提升（mR 从 32.84 提升至 34.69），且审计确认的问题事件（Audit-confirmed Issue Events）显著少于其他自主研究系统（5 次 vs 11-27 次），证明了其在减少无效探索和错误结论传播方面的有效性。此外，在矩阵乘法优化和 Kaggle 基准测试中，系统展示了其能够检测不稳定的实验结果（如计时错误）、纠正测量偏差，并根据证据条件做出继续、修订或终止（Continue/Revise/Stop）的研究决策，体现了负结果（Negative Results）作为有效研究产出的价值。\n\n### § 9 最脆弱的假设\n\nAutoResearch 最脆弱且关键的假设是：**外部研究信号（Research Signals）中蕴含的“机制性洞察”（Mechanistic Insight）可以通过当前的 LLM 能力被准确识别、剥离原始语境并成功迁移到目标领域，且这种迁移在技术上是可行且有意义的。** 如果这一假设不成立，即 LLM 无法真正理解跨领域的深层机制，或者生成的“洞察”仅仅是术语的拼凑而非真正的因果逻辑，那么整个 Idea Generation 阶段将退化为随机搜索或产生大量看似合理但实际不可行的“幻觉想法”，导致后续昂贵的执行阶段浪费资源。在实际中，这一假设可能不成立的原因在于：当前的 LLM 虽然擅长模式匹配和文本生成，但在处理高度专业化、依赖隐性工程知识或复杂物理约束的跨领域机制迁移时，往往缺乏真正的因果推理能力，容易受到训练数据中统计偏差的影响，产生“看似合理但无法实现”的伪洞察。论文为这一假设提供的证据主要依赖于 RSICD 任务中生成的想法确实带来了性能提升，以及人工审计确认的问题事件较少。然而，这种证据存在局限性：RSICD 任务相对标准化，且性能提升幅度有限（+1.85 mR），这可能部分归功于基线方法的优化空间较大，而非机制迁移本身的深刻性；此外，论文未提供对“失败想法”中机制迁移错误类型的深入分析，也未在更复杂、机制更不透明的领域（如新材料发现或复杂生物系统）验证这一假设的鲁棒性，因此缺乏对 LLM 在深层机制迁移能力上限的直接证据。\n\n### § 10 最小复现实验\n\n如果只有一周时间，可以设计一个最小复现实验来验证 AutoResearch 在 **Idea Execution 阶段通过独立审查（Independent Review）检测并纠正“幻觉结论”的能力**，特别是针对“看似成功但测量有误”的场景。具体方案如下：使用一个简化的基准任务，例如在 PyTorch 中实现一个标准的 ResNet-18 在 CIFAR-10 上的训练流程，但故意在评估代码中引入一个常见的测量错误（例如，在计算 Accuracy 时未将预测标签与真实标签正确对齐，或者在计算 Loss 时未正确处理 Batch Normalization 的统计量）。然后，构建一个简化的 AutoResearch 执行工作流：包括一个“Coder/Runner”智能体负责执行训练和评估代码，以及一个独立的“Reviewer”智能体，它不继承 Coder 的上下文，仅接收实验日志、代码片段和最终指标。测量指标为：Reviewer 是否能识别出指标异常（如 Accuracy 异常高或 Loss 不收敛）并触发诊断流程，最终是否通过重新运行修正后的代码得到正确结果。如果 Reviewer 能够检测到测量错误并拒绝接受初始的“成功”结论，转而要求重新验证，则支持了 AutoResearch 的“Hallucination Out”主张；如果 Reviewer 接受了错误的指标或未能发现测量偏差，则反驳了该机制的有效性。这个实验不需要复现完整的 Idea Generation 阶段，只需聚焦于执行阶段的证据验证逻辑，且所需数据（CIFAR-10）和代码实现都非常轻量，适合在一周内完成。", "research_value": "### § 11 最强反例设计\n\n要最有力地攻击 AutoResearch，核心策略是证明其所谓的“机制性洞察（Mechanistic Insight）”和“独立证据审查（Independent Evidence Review）”在复杂、高噪声或需要隐性工程知识（Tacit Engineering Knowledge）的场景中会系统性失效，导致“伪严谨”的幻觉。\n\n**反例场景：跨模态架构迁移中的“维度灾难”与“评估盲区”**\n\n1.  **理论攻击：机制迁移的“语义鸿沟”与 LLM 的归纳偏差**\n    AutoResearch 假设 LLM 能从信号 $S_t$ 中剥离出可迁移的机制。然而，在深度学习领域，许多 SOTA 方法的提升并非源于通用的“机制”，而是源于对特定数据集分布（Data Distribution）或硬件特性的过拟合（Overfitting）。\n    *   **具体反例**：假设 AutoResearch 从 NLP 领域捕捉到一个关于“稀疏注意力（Sparse Attention）”的信号，并试图将其迁移到计算机视觉（CV）的遥感图像检索任务中。LLM 可能生成一个看似合理的假设：“引入稀疏注意力机制以减少计算冗余并提升长程依赖捕捉能力”。\n    *   **攻击点**：在 CV 任务中，图像的空间局部性（Spatial Locality）与 NLP 的序列依赖性截然不同。稀疏注意力在 NLP 中有效是因为词序的稀疏性，但在图像中，强行引入稀疏性可能破坏空间结构的完整性。AutoResearch 的 `Cross-validation` 阶段仅依赖文本层面的逻辑一致性（Coherence），无法验证这种跨模态的“机制兼容性”。因此，系统会生成一个逻辑自洽但物理上无效的假设，导致后续执行阶段浪费大量资源去验证一个注定失败的方向。这证明了 **Insight In** 阶段缺乏真正的因果推理能力，仅停留在表面特征的拼凑。\n\n2.  **实验攻击：Fresh-context Agent 的“评估盲区”与“指标操纵”**\n    AutoResearch 的核心防御是 **Fresh-context Agent** 进行独立评估。然而，如果评估指标本身存在漏洞，或者错误类型超出了 LLM 的“常识”范围，独立审查将失效。\n    *   **具体反例**：设计一个任务，其中“成功”的定义依赖于一个难以通过日志直接观察的隐性状态。例如，在训练一个强化学习（RL）代理时，AutoResearch 生成的代码可能在训练循环中引入了一个隐蔽的 Bug：在计算 Reward 时，错误地使用了未归一化的原始传感器数据，导致 Reward 数值巨大但方向正确。\n    *   **攻击点**：\n        *   **指标欺骗**：由于 Reward 方向正确，代理的性能指标（如 Cumulative Reward）会单调上升，看起来非常“成功”。\n        *   **审查失效**：**Fresh-context Agent** 仅检查日志中的指标趋势和代码的语法正确性。它没有“运行”代码的直觉，也无法理解未归一化数据在特定 RL 算法（如 PPO）中的灾难性后果（如梯度爆炸或策略崩溃）。Agent 会认为证据 $e$ 支持主张 $c$（即“新算法有效”），从而接受结论。\n        *   **结果**：系统输出了一个“证据充分”但实际不可复现、在真实部署中会崩溃的结论。这证明了 **Hallucination Out** 机制在面对“语义正确但工程错误”时是盲目的，因为它依赖于 LLM 对代码行为的静态分析能力，而非动态执行验证。\n\n3.  **替代解释：性能提升源于“搜索空间覆盖”而非“洞察质量”**\n    在 RSICD 实验中，AutoResearch 提升了 1.85 mR。攻击者可以提出：这一提升并非源于 AutoResearch 独特的“机制洞察”，而是源于其 **Multi-model Generation** 和 **Iterative Execution** 带来的巨大计算预算（Compute Budget）。\n    *   **论证**：如果对比系统（如 The AI Scientist）被赋予相同的计算资源（即允许更多的重试和更长的执行链），它们也可能通过随机搜索找到类似的改进。AutoResearch 的“严谨性”可能只是其“高计算成本”的副产品，而非其方法论的内在优势。如果移除“独立审查”模块，仅保留“多模型生成+长执行链”，性能可能依然可观，从而削弱“Insight In, Hallucination Out”作为核心贡献的必要性。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“静态证据审查”到“动态因果干预”：构建基于 Do-Calculus 的自主研究验证框架**\n\n**(a) 驱动局限与未满足需求**\nAutoResearch 的核心局限在于其 **Evidence-based Review** 是静态的、基于相关性（Correlation）的。它检查“指标是否上升”或“代码是否报错”，但无法区分“性能提升是由于提出的机制（Mechanism）”还是“由于随机种子、数据泄露或超参数巧合”。在科学研究中，确立因果关系（Causality）比确立相关性更重要。当前的 LLM 代理缺乏进行**因果干预（Causal Intervention）**的能力，即无法主动“切断”某些变量以验证机制的必要性。这导致系统容易接受“伪因果”结论，即所谓的“幻觉”不仅存在于事实层面，更存在于因果推理层面。\n\n**(b) 借鉴相邻领域的方法**\n借鉴 **Causal Inference（因果推断）** 领域中的 **Do-Calculus** 和 **Structural Causal Models (SCMs)**，以及 **Automated Machine Learning (AutoML)** 中的 **Ablation Study Automation**。\n*   **核心思想**：将研究假设建模为一个因果图（Causal Graph），其中节点是实验组件（如“稀疏注意力”、“数据增强”），边是潜在的因果影响。\n*   **新工具**：引入一个 **Causal Intervener Agent**，它不只看结果，而是主动执行“干预”操作。例如，为了验证“稀疏注意力”是否真的贡献了性能提升，Intervener 会强制“切断”该组件（即设置 `do(SparseAttention = False)`），同时保持其他所有条件不变，观察性能是否下降。如果性能不变，则证明该机制无效，无论其初始指标多么好看。\n\n**(c) 第一个实验设计**\n**实验名称：Causal-AutoResearch: Validating Mechanisms via Automated Interventions**\n\n1.  **设置**：选择一个具有多个可组合模块的基准任务，如 **LLM Fine-tuning**（包含 LoRA、Prompt Tuning、Data Filtering 等模块）。\n2.  **基线**：AutoResearch 的标准流程，生成一个包含多个模块的假设，并报告整体性能提升。\n3.  **新方法**：\n    *   **因果图构建**：LLM 根据假设生成一个初步的因果图，标识各模块间的依赖关系。\n    *   **自动干预**：**Causal Intervener Agent** 自动生成并执行一系列“反事实实验”（Counterfactual Experiments）。例如，它会自动生成代码，移除 LoRA 模块，重新训练模型，并记录性能变化。\n    *   **因果验证**：只有当移除某个模块导致性能显著下降（即存在因果效应）时，该模块才被确认为“有效机制”。如果移除后性能不变，即使整体指标提升，该模块也被标记为“冗余”或“伪因果”。\n4.  **评估指标**：\n    *   **Causal Precision**：系统识别出的“有效机制”中，真正对性能有因果贡献的比例。\n    *   **Redundancy Detection Rate**：系统检测并剔除冗余模块的能力。\n    *   **Robustness to Confounders**：在存在数据泄露或超参数巧合的情况下，系统是否仍能拒绝接受伪因果结论。\n\n**与已有工作的区别**：\n*   **AutoResearch** 关注“结果是否可复现”和“证据是否支持结论”，是**后验的、静态的**。\n*   **Causal-AutoResearch** 关注“机制是否真正起作用”，是**先验的、动态的、干预性的**。它不仅仅验证“发生了什么”，还验证“为什么发生”，从而从根本上解决“系统性幻觉”中的因果谬误问题。这将自主研究系统从“实验执行者”提升为“科学假设的因果验证者”。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "{\n  \"authors\": [\n    {\n      \"name\": \"Yiming Ren\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Xiang Liu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Qumeng Sun\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xiao Zhang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jiahao Li\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Haoyang Zhang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Junjie Wang\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"EvoMap\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Tsinghua Shenzhen\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal contribution.\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding Author. 17@evomap.ai, wangjunjie@sz.tsinghua.edu.cn\"\n    }\n  ]\n}", "summary_translation": "自主研究系统日益具备执行长程研究工作流的能力，然而仅靠自动化并不能确保所产生的过程在科学上具有坚实依据。我们提出了 AutoResearch，这是一个两阶段系统，将 Idea Generation 与 Idea Execution 相连接，以解决研究想法如何形成以及如何通过实验可靠确立的问题。在 Idea Generation 阶段，AutoResearch 持续整合新兴的研究信号与积累的领域知识，识别可迁移的机制性见解，并利用多模型生成和交叉评审来产生有据可依、可测试的研究计划。在 Idea Execution 阶段，协调的智能体将这些计划分解为实验，迭代地实现和诊断它们，并在接受研究结论之前采用独立的基于证据的评审。在跨模态检索、系统优化和基准驱动的机器学习等代表性场景中，AutoResearch 将生成的想法转化为可衡量的进展，检测并纠正不可靠的实验结果，并做出基于证据的条件决策以继续、修订或终止研究方向。例如，在 RSICD benchmark 上，一个由 AutoResearch 生成的想法将平均 Recall 从 32.84 提升至 34.69，同时仅记录了 5 个经审计确认的问题事件，而其他自主研究系统则记录了 11 至 27 个。这些结果展示了一个研究过程，其中有意义的见解在实验前得到确立，结论在接受前得到确立：Insight In, Hallucination Out。"}, {"title": "StartupBench: Benchmarking General-Purpose Agents on Market-Validated End-to-End Workflows", "arxiv_id": "2608.17800", "authors": "Liya Zhu, Xin Ma, Tao Liu, Haodong Wang, Ge Zhang, Jingzhe Ding, Qingshui Gu, Yongjie Zhong, Jinxiang Meng, Yuan Gao, Yunqiu Zhou, Hao Zhu, Jifeng He, Yongzhi Liao, Xinyi Zhang, Chaoxin Li, Yi Zhu, Xi Lin, Duju Zeng, Xiang Gao, Wen Zhang, Yunyang Wang, Duo Wang, Huan Zhou, Zuo Wang, Jin Chen, Kaiyuan Zhang, Chuqian Yu, Tianhao Yu, Longxiang Liu, Jianbo Xue, Huimin Che, Jiahao Wang, Yujia Qin, Jiaheng Liu, Shen Yan, Xiaolong Chang, Wenhao Huang", "summary": "Recent advances in Large Language Models(LLMs) and agents have substantially improved the ability of AI systems to execute complex tasks. Yet existing benchmarks largely rely on researcher-selected tasks, leaving uncertain whether such progress extends to the work that real-world users actually demand from AI systems. We introduce \\textbf{StartupBench}, an E2E agent benchmark grounded in market-validated AI startup products. Rather than defining tasks from pre-defined assumptions about useful agent capabilities, we systematically study AI products with demonstrated adoption, together with their product workflows and users, to identify real-world tasks for which AI has established practical demand across diverse professional domains. We translate these workflows into complete deliverable-oriented tasks and evaluate them with fine-grained rubrics capturing their complex requirements. Across representative models evaluated under a unified agent harness, even the strongest model successfully completes only approximately 30\\% of StartupBench, despite making substantial partial progress on many tasks. Further analysis identifies aspects like complex instruction following and domain-specific expertise as major sources of failure. Our results reveal that many market-validated workflows remain beyond the reliable capabilities of current general-purpose agents, establishing StartupBench as an empirical measure of progress toward E2E completions of real-world user tasks.", "category": "cs.AI", "cluster": "Benchmarks \u0026 Evaluation Frameworks", "tags": ["cs.AI"], "filter_reason": "该论文符合筛选标准，属于“保留 (Keep)”类别。\n\n1. 核心对象明确：论文的研究对象是“General-Purpose Agents”（通用智能体），旨在评估其在端到端（End-to-End）工作流中的表现。这直接对应了研究焦点中的“单智能体”或“多智能体”在复杂任务中的能力评估。\n2. 符合评估基准保留规则：根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。” StartupBench 正是一个针对 LLM 智能体的评估基准（Benchmark），其核心贡献在于揭示了当前智能体在真实世界复杂工作流中的能力边界和失败模式（如复杂指令遵循、领域专业知识缺失），这为改进智能体的规划、工具使用或记忆机制提供了重要的实证依据。\n3. 非纯应用或非基础设施：虽然论文涉及“市场验证的工作流”，但其目的不是解决某个特定领域的业务问题（如医疗诊断），而是构建一个通用的智能体能力测试平台。同时，它使用统一的 agent harness 进行评估，关注的是智能体本身的执行能力，而非底层基础设施优化。\n\n因此，尽管这是一篇基准测试论文，但它紧密围绕 LLM 智能体的核心能力评估，符合“帮助理解或改进智能体能力”的标准，故判定为相关。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：当前的通用人工智能代理（General-Purpose Agents）是否具备在真实商业环境中可靠地完成端到端（End-to-End, E2E）专业工作流并产出可直接使用交付物（Deliverables）的能力？现有的基准测试大多基于研究者主观定义的任务或模拟环境，缺乏对真实市场需求和复杂专业约束的反映，导致无法准确评估 AI 系统从“回答问题”向“执行实际工作”跨越的真实水平。\n\n这一问题的重要性在于，随着大语言模型（LLMs）能力的提升，AI 正从信息检索工具演变为能够执行复杂任务的代理系统。然而，学术界对 AI 能力的评估往往局限于孤立的能力测试（如工具使用、多步推理），忽略了真实世界中用户对 AI 的核心诉求：即在严格的格式、结构、领域合规性及数值精度约束下，生成无需人工二次修正的专业级交付物（如财务报表、法律备忘录、医疗方案等）。如果无法验证 AI 能否可靠地完成这些高价值、长周期的 E2E 工作流，我们就无法判断 AI 是否真正具备了替代或辅助人类专业工作的能力，也无法为下一代基础模型和代理系统的研发提供明确的改进方向。\n\n解决这一问题带来的价值主要体现在三个方面：首先，StartupBench 提供了一个基于市场验证（Market-Validated）的实证基准，通过从已获融资且拥有真实用户基础的 AI 原生初创公司中提取工作流，确保了任务来源的真实性和需求的有效性，填补了现有基准在“真实用户需求”方面的空白。其次，该研究揭示了当前最强模型在 StartupBench 上的成功率仅为约 30%，明确了通用代理在复杂指令遵循（Complex Instruction Following）、领域特定专业知识（Domain-Specific Expertise）以及自我验证（Self-Verification）方面的具体瓶颈，为模型优化提供了细粒度的反馈信号。最后，通过对比通用代理与垂直领域专用代理（Specialized Agents）的性能差距，研究证明了当前通用模型在专业工作流执行上仍存在显著不足，强调了在特定领域构建专用代理或增强通用模型领域能力的必要性，从而指导产业界更合理地部署 AI 系统。\n\n### § 2 前人工作与不足\n\n在 StartupBench 之前，已有大量研究致力于评估 AI 代理的能力，但它们在任务来源、评估粒度及真实性方面存在显著不足。早期的基准如 AgentBench 和 GAIA 主要关注工具使用、多步推理和通用助手能力，其任务多由研究者手动设计或基于公开数据集构建，缺乏对真实商业工作流中复杂约束和交付物标准的反映。随后的研究如 OSWorld 和 WebArena 将评估环境扩展到真实的计算机交互和网页操作，虽然提高了环境的真实性，但其任务往往侧重于界面交互和状态验证，而非生成具有专业深度的结构化交付物。\n\n更近期的基准如 GDPval、Workspace-Bench 和 Agents’ Last Exam 试图向专业工作和长周期工作流靠拢。GDPval 关注具有经济价值的任务，Workspace-Bench 涉及大规模文件依赖的工作空间任务，Agents’ Last Exam 则基于职业分类构建任务。然而，这些工作仍存在关键局限：第一，任务来源并非直接源于市场验证的 AI 产品工作流，而是基于研究者假设、职业分类或模拟环境，导致任务可能偏离真实用户的核心需求和痛点。例如，研究者定义的任务可能忽略了实际工作中至关重要的细微格式要求或领域特定的合规性约束。第二，评估协议往往过于粗糙，通常采用整体评分或简单的答案匹配，无法捕捉真实交付物中涉及的功能性、结构性、格式性及领域特定质量等多维度细粒度要求。这种粗粒度的评估无法区分模型是真正完成了任务，还是仅满足了表面要求而忽略了核心约束。第三，现有基准缺乏对“交付物可用性”的严格检验，即生成的结果是否可以直接用于专业场景，而无需人工大量修正。\n\nStartupBench 通过引入“采用驱动的任务来源”（Adoption-grounded task sourcing）和“细粒度基于量规的评估”（Fine-
