tropy）。当前方法仅使用评分 $s$，而忽略了 Judge 对评分本身的**不确定性（Uncertainty）**。\n\n现有的诊断方法只回答了“Judge 是否*平均*有用”，而未回答“Judge 在*哪些具体样本*上可信”。这导致了**过度拒绝（Over-rejection）**的问题：即使 Judge 整体 $AUC \u003E 0.5$，它仍可能在困难样本上表现随机，导致有价值的更新被错误拒绝。\n\n**（b）借鉴相邻领域的方法：**\n借鉴**主动学习（Active Learning）**和**不确定性量化（Uncertainty Quantification, UQ）**领域的思想。在主动学习中，模型利用预测不确定性来选择最有价值的样本进行标注。在这里，我们可以利用 Judge 的**评分不确定性**来动态调整门控策略：\n*   当 Judge 评分置信度高时，直接采用其决策。\n*   当 Judge 评分置信度低（高熵）时，触发**回退机制（Fallback Mechanism）**，如使用更强大的模型、人工审核，或暂时搁置该更新。\n\n**（c）第一个实验设计：**\n\n1.  **框架构建**：\n    *   修改 **Non-Intervening Probe**，不仅记录评分 $s$，还记录 Judge 的**内部置信度分数**（例如，通过 Logits 的熵、多次采样的方差，或显式的置信度提示）。\n    *   定义一个**动态门控函数** $G(s, u)$，其中 $u$ 是不确定性度量。\n2.  **实验设置**：\n    *   在 **GPQA-Diamond** 或 **MATH** 数据集上运行 SkillOpt。\n    *   对比三种策略：\n        *   **Static Gate**：论文提出的固定阈值门控。\n        *   **Uncertainty-Aware Gate**：仅当 $s \u003E \\tau$ 且 $u \u003C \\epsilon$ 时才接受更新；否则回退到随机门控或更保守的策略。\n        *   **Baseline**：无门控（直接接受所有更新，作为上限参考）。\n3.  **评估指标**：\n    *   **最终 Skill 性能**：验证动态门控是否能比静态门控获得更高的最终准确率。\n    *   **样本效率**：统计在相同迭代次数下，动态门控接受的“高质量更新”比例。\n    *   **错误类型分析**：分析动态门控是否显著减少了 **False Accept**（有害接受）和 **False Reject**（过度拒绝）。\n\n**与已有工作的区别：**\n现有工作（包括本文）主要关注**Judge 的绝对能力**，而本提议关注**Judge 的相对可靠性**。它不试图提高 Judge 的解题能力，而是通过**元认知（Meta-cognition）**机制，让 Judge “知道何时不知道”，从而在保持安全性的同时，最大化优化信号的有效利用率。这将 Skill Optimization 从“静态筛选”推向“自适应优化”，为在缺乏完美验证器的场景下实现更高效的 LLM 代理进化提供了新路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Chenle Chen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yangbo Wei\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Chao Yao\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Shaoqiang Lu\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Junhong Qian\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Chen Wu\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Lei He\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"University of California, Los Angeles\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Shanghai Jiao Tong University\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Arizona State University\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Eastern Institute of Technology, Ningbo\"\n    }\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "Text-space skill optimization 通过演化自然语言技能文档来适配冻结的 agent，并通过验证门控接受每个候选方案。现有的门控依赖于可验证奖励，将这些方法局限于具有自动验证器的任务。用 LLM-judge gate 替换验证器可以解除这一限制，但此类门控是否携带可用信号尚未经过测试。我们提出了一个先决问题：在将 judge 纳入循环之前，我们能否判断其评分是否能在正确与错误答案之间产生区分？我们将无参考的 judge 形式化为 latent solver——其裁决取决于与其自身结论的一致性，因此其评估能力受限于其求解能力。该模型给出了关于 judge 能力 $c$ 和答案空间大小 $k$ 的判别力（ROC-AUC）的闭式界、必要条件 $c \u003E 1/k$，以及边际 AUC 受题目难度混淆而 within-question estimator 不受影响的结论。non-intervening probe 在不改变任何决策的情况下，记录真实优化运行中 judge 的评分。我们发现，当能力处于低位时判别力为随机水平，高于该水平则具有可用性；judge 在 benchmark 上的准确率高估了相关能力；并且在闭环研究中，screen 预测了发生的门控错误类型。该结果提供了一种用于 judge gates 的低成本部署前诊断方法。"}]}, {"name": "Code Agents \u0026 Software Engineering", "count": 3, "papers": [{"title": "A Jagged Frontier: Evaluating Robustness of Code Agents to Semantics-Preserving Transformations", "arxiv_id": "2608.18389", "authors": "Hasan Najib Mahmud, Shreya Gupta, Isha Chaudhary, Nathaniel Enis, Ravi Mangal, Gagandeep Singh, Corina Pasareanu", "summary": "AI code agents are increasingly deployed to resolve real software issues, yet their reliability under superficial code variations remains poorly understood. We evaluate whether coding agents that repair repository-level issues remain reliable when the surrounding codebase is rewritten into a semantically equivalent form. We introduce a random variant sampler that applies common semantics-preserving transformations (SPTs) - spanning control-flow rewrites, dead-code injection, and identifier renaming - to produce perturbed variants. We evaluate two agentic scaffolds (mini-SWE agent and OpenCode) each backed by one of four frontier models (Claude Opus 4.5, Kimi K2.5, MiniMax M2.5, and Qwen 3.6-27B) across instances drawn from SWE-bench Verified and SWE-bench Pro. For each instance, the agent is run multiple times on the unperturbed and perturbed variants, yielding paired resolve-rate estimates that isolate the perturbation effect from intrinsic stochasticity. We find small degradation in most configurations: up to 6.7 percentage points mean resolve-rate drop in the most affected configurations with statistically significant degradations in 6 of 16 configurations of model, scaffold, and dataset. Crucially, no single model ranking by robustness holds across scaffolds - Qwen is among the most robust under mini-SWE agent on SWE-bench Verified yet the most brittle under OpenCode - revealing a jagged robustness frontier. The simpler scaffold (mini-SWE agent) is more robust to perturbation. Our results demonstrate that even top frontier models are susceptible to semantics-preserving perturbations although the effect is not uniform, raising concerns about the deployment reliability of AI code agents in diverse real-world codebases.", "category": "cs.AI", "cluster": "Code Agents \u0026 Software Engineering", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=18 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文符合筛选标准，主要依据如下：\n\n1.  核心研究对象明确为 LLM Agents：论文标题和摘要明确指出研究对象是 \"AI code agents\"（AI代码智能体），并具体评估了 \"mini-SWE agent\" 和 \"OpenCode\" 这两种 agentic scaffolds（智能体脚手架/框架）。这直接对应了筛选标准中“保留”的第一条和第三条，即研究 LLM Agents 的行为分析、评估基准或失败机制。\n\n2.  关注智能体系统的鲁棒性与可靠性（Agentic Capability）：论文的核心贡献在于评估代码智能体在面对语义保持变换（Semantics-Preserving Transformations, SPTs）时的鲁棒性。这属于对智能体能力（特别是长期决策和工具使用中的稳定性）的深度诊断。根据筛选标准，“如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准、失败机制诊断... 只要结论直接帮助理解或改进智能体能力，也应保留”。\n\n3.  涉及 Agent Scaffold 的比较与洞察：论文不仅评估模型，还比较了不同 \"agentic scaffolds\" 的表现，发现“更简单的脚手架（mini-SWE agent）对扰动更鲁棒”。这一发现直接关联到智能体系统的设计（Scaffold/Harness），有助于理解如何构建更稳健的智能体系统，符合“构建、改进... LLM智能体”的研究目标。\n\n4.  排除项不适用：\n       虽然涉及代码（Coding），但并非单纯的“非演化型应用”，而是对智能体本身机制（Scaffold）和能力的评估。\n       不涉及安全（Security）、对齐（Alignment）、幻觉（Hallucination）等被明确排除的领域（尽管鲁棒性有时与安全相关，但此处明确为语义扰动下的可靠性，属于能力评估范畴）。\n       不涉及多智能体拓扑或通信协议等被排除的系统工程细节。\n\n综上，该论文通过评估代码智能体在扰动下的表现，揭示了当前智能体脚手架和模型的局限性，为改进智能体的鲁棒性提供了实证依据，属于 Agentic AI 领域的重要前沿研究。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在评估基于大语言模型（LLM）的代码智能体（Code Agents）在面对**语义保持变换（Semantics-Preserving Transformations, SPTs）**时的鲁棒性。具体而言，研究核心问题是：当代码库被重写为语义等价但表面结构不同的形式时，那些能够修复仓库级（repository-level）软件问题的智能体是否仍能保持可靠的性能？这一问题的紧迫性源于当前AI编码工具从研究原型向主流软件开发流程的快速渗透。尽管SWE-bench Verified和SWE-bench Pro等基准测试提供了性能指标，但这些指标往往掩盖了神经模型普遍存在的**捷径学习（shortcut learning）**现象，即模型可能依赖浅层的句法模式而非深层的程序语义。如果智能体的行为会因代码的表层变化而发生显著偏移，那么基准测试中的高分可能严重高估了其在真实部署环境中的可靠性。此外，现有的鲁棒性研究多集中于单轮、非智能体（non-agentic）的代码生成或分类任务，缺乏对多轮交互、具备故障定位和补丁合成能力的仓库级智能体的系统性评估。解决这一问题具有双重价值：一方面，它为开发者提供了关于智能体部署可靠性的**下限估计（lower bounds）**，揭示了模型、智能体框架（scaffold）和工作负载之间复杂的交互效应，即所谓的“锯齿状鲁棒性前沿（jagged robustness frontier）”；另一方面，它指出了当前模型在理解程序语义上的局限性，为训练更鲁棒的模型和设计更稳健的智能体架构提供了方向，特别是揭示了即使是最前沿的模型（如Claude Opus 4.5）在特定配置下也可能表现出显著的脆弱性，且这种脆弱性不仅体现在解决率下降，还体现在计算成本和步骤数的显著增加。\n\n### § 2 前人工作与不足\n\n在代码大语言模型的鲁棒性方面，已有大量研究证实了神经模型对保持语义的表层扰动具有脆弱性。例如，Yefet等人（2020）展示了标识符重命名攻击对代码模型的影响，Srikant等人（2021）利用死代码插入和运算符替换攻击程序分类器，而Ramakrishnan等人（2022）则结合重命名、死代码和操作数交换来暴露方法名预测和代码摘要任务中的脆弱性。在防御和基准层面，Jain等人（2021）通过对比学习提升鲁棒性，Wang等人（2023）的ReCode基准测试评估了代码生成模型对文档字符串和语法扰动的敏感性，Mastropaolo等人（2023）则发现提示上下文中的微小重构会显著改变GitHub Copilot的补全结果。然而，这些现有工作存在明显的局限性，无法直接回答本文提出的研究问题。首先，绝大多数 prior work 聚焦于**单轮推理（single-turn inference）**或短文本生成任务，扰动通常应用于固定长度的输入片段，而本文关注的是**多轮智能体（multi-turn agents）**，它们需要在数十个推理步骤中定位故障、导航整个仓库并合成补丁，这种长程交互引入了完全不同的失败模式和鲁棒性挑战。其次，现有的扰动方法往往针对特定任务（如分类或短代码生成）设计，缺乏针对仓库级代码修复任务的系统性扰动库，特别是缺乏能够模拟开发者常规重构或故意引入噪声（如死代码注入）的**语义保持变换（SPTs）**集合。最后，由于LLM智能体的内在随机性（intrinsic stochasticity），简单的对比实验难以区分性能下降是由扰动引起还是由模型随机性导致，而 prior work 缺乏一种能够隔离扰动效应与运行间变异性的实验方法论。因此，尽管 prior work 证明了代码模型的表层脆弱性，但它们未能揭示在复杂的智能体交互环境中，鲁棒性如何随模型、框架和具体代码库的变化而呈现非均匀的“锯齿状”分布，这一关键缺口正是本文旨在填补的。", "core_insight": "### § 3 重建作者的思考路径\n\n在 AI 代码代理（Code Agents）迅速从研究原型走向工业部署的背景下，研究者首先注意到一个显著的矛盾：尽管模型在 SWE-bench 等基准测试中表现优异，但神经网络普遍存在的“捷径学习”（Shortcut Learning）现象暗示，模型可能并未真正理解程序语义，而是依赖于浅层的语法模式。现有的鲁棒性研究主要集中在单轮、非代理（non-agentic）的代码生成或分类任务上，通过标识符重命名或死代码插入来测试模型，但这些工作无法反映真实场景中代理与代码库进行多轮交互、定位故障并合成补丁的复杂过程。\n\n研究者进一步观察到，现有的基准测试分数可能高估了部署可靠性，因为测试环境中的代码结构是固定的，而现实世界中的代码库会经历各种保持语义不变的变换（Semantics-Preserving Transformations, SPTs），如重构、变量重命名或控制流重写。如果代理的性能在这些表面变化下发生剧烈波动，说明其鲁棒性并非模型本身的固有属性，而是与代理框架（Scaffold）和具体代码库紧密耦合。\n\n此外，评估代理鲁棒性面临独特的挑战：代理具有内在的随机性（Stochasticity），单次运行的失败可能源于随机性而非扰动。因此，需要一种能够隔离扰动效应与内在随机性的实验设计。基于此，研究者提出构建一个随机变体采样器（Random Variant Sampler），在不依赖对抗反馈的情况下生成语义等价的代码库变体，并通过配对运行（Paired Runs）来精确量化扰动对代理解决率、步骤数和成本的影响，从而揭示代码代理鲁棒性的“锯齿状前沿”（Jagged Frontier）。\n\n### § 4 核心 Intuition\n\n代码代理的鲁棒性并非模型能力的单一指标，而是模型、代理框架（Scaffold）和具体代码库三者共同作用的联合属性，表现为一种“锯齿状前沿”（Jagged Frontier）。即使是最先进的模型，在面对保持语义不变的代码变换时，其表现也会因框架的不同而发生剧烈反转，例如在简单框架下鲁棒的模型在复杂框架下可能变得极其脆弱。这种脆弱性不仅体现在解决率的轻微下降，更体现在代理为处理噪声而付出的显著增加的步骤和计算成本上，揭示了代理对表面语法模式的依赖而非深层语义理解。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文的核心方法是构建一个**Semantics-Preserving Transformations (SPTs)** 库，并设计一个**Random Variant Sampler** 来生成语义等价但表面结构不同的代码变体，以此评估 AI Code Agents 的鲁棒性。\n\n**Pipeline 详解（以修复 `sympy` 库中的一个 Bug 为例）：**\n\n1.  **输入 (Input)：**\n    *   **Seed Repository：** 选取 `sympy` 库在特定 commit 的代码库。\n    *   **Task Instance：** 包含 Issue 描述（例如：“修复矩阵乘法中的维度错误”）、Gold Patch（参考修复补丁）、以及测试集（FAIL_TO_PASS 和 PASS_TO_PASS）。\n    *   **Agent Configuration：** 选定一个 Agent Scaffold（如 `mini-SWE agent`）和一个基础模型（如 `Claude Opus 4.5`）。\n\n2.  **处理 (Processing)：**\n    *   **Step 1: 基线评估 (Baseline Evaluation)：**\n        *   在隔离环境中，让 Agent 对原始的、未修改的 `sympy` 代码库运行 $N=20$ 次。\n        *   记录每次运行的 Resolve Rate（是否通过测试）、Step Count（交互步数）和 Token Cost。\n    *   **Step 2: 变体生成 (Variant Generation via Sampler)：**\n        *   **SPT 选择：** 从 14 种 SPT 中随机抽取 $N_t=3$ 种（例如：`If Else Switcher`, `Dead String Assignment`, `Local Variable Renamer`）。\n        *   **文件与位置选择：** 随机选择非测试文件和非 Gold Patch 涉及的文件。对于 `Dead String Assignment`，从 Issue 描述中提取关键词（如 \"matrix\"），并在代码中注入包含该关键词的死代码作为 Decoy（诱饵）。\n        *   **应用变换：** 在选定的文件中，对 $\\phi=0.7$ 比例的候选位置应用变换。例如，将 `if a and b:` 重构为嵌套的 `if a: if b:`，或插入 `if False: ...` 块。\n        *   **输出：** 生成 20 个语义等价但代码表面不同的 `sympy` 变体仓库。\n    *   **Step 3: 扰动评估 (Perturbed Evaluation)：**\n        *   对生成的每一个变体仓库，让 Agent 运行 1 次（共 20 次运行，每个变体 1 次，以最大化覆盖变体多样性）。\n        *   记录同样的指标：Resolve Rate, Step Count, Cost。\n\n3.  **输出 (Output)：**\n    *   **Degradation Metric：** 计算基线 Resolve Rate 与扰动后 Resolve Rate 的差值。例如，基线解决率为 80%，扰动后为 73.3%，则 Degradation 为 6.7 个百分点。\n    *   **Effort Metric：** 计算 Step Count 和 Cost 的相对变化。\n    *   **结论：** 分析 Agent 是否因为代码表面的微小变化（如变量重命名、死代码注入）而失败，从而揭示其鲁棒性的“锯齿状前沿”（Jagged Frontier）。\n\n### § 6 核心数学推导\n\n**理论背景：**\n评估 LLM Agent 的鲁棒性面临两个随机性来源：\n1.  **Variant Randomness ($\\sigma^2$)：** 不同的语义等价变体难度不同，导致 Agent 解决概率 $p_V$ 的波动。\n2.  **Agent Randomness ($\\nu$)：** 即使面对同一个变体，Agent 由于采样温度（Temperature）等原因，每次运行的结果也是伯努利分布的随机变量。\n\n**核心推导：为什么每个变体只运行一次 ($K=1$) 是最优且无偏的？**\n\n论文证明了在固定总运行预算 $R$ 下，将预算分配给 $N$ 个不同变体，每个变体运行 $K$ 次（$R = N \\times K$），估计平均解决概率 $\\mu = E[p_V]$ 的方差为：\n\n$$ \\text{Var}(\\hat{\\mu}) = \\frac{K\\sigma^2 + \\nu}{R} $$\n\n**Intuition 解释：**\n*   **$\\sigma^2$ (Between-variant variance)：** 变体之间的难度差异。为了准确估计平均难度，我们需要尽可能多的**不同**变体（即 $N$ 要大）。\n*   **$\\nu$ (Within-variant noise)：** Agent 自身的随机噪声。为了减少这个噪声，我们需要对同一个变体运行多次（即 $K$ 要大）。\n*   **权衡：** 公式显示，方差由两部分组成。$K\\sigma^2/R$ 项表明，如果 $K$ 增大（即 $N$ 减小），由于覆盖的变体种类减少，对变体难度分布的估计误差会增大。$\\nu/R$ 项表明，总运行次数 $R$ 固定时，Agent 自身噪声的估计误差是固定的，与 $K$ 无关。\n*   **结论：** 只要变体之间存在难度差异（$\\sigma^2 \u003E 0$），方差 $\\text{Var}(\\hat{\\mu})$ 就随 $K$ 的增加而严格增加。因此，**$K=1$（每个变体只运行一次，最大化 $N$）是方差最小化的最优策略**。同时，由于 $E[\\hat{\\mu}] = \\mu$，该估计量在任何 $K$ 下都是无偏的。\n\n这一推导证明了论文实验设计中“每个变体运行一次”的统计有效性，避免了因重复运行相同变体而浪费预算，从而更准确地捕捉 SPTs 对 Agent 性能的整体影响。\n\n### § 7 实验设计与结论\n\n**RQ1: SPTs 在多大程度上降低 Agent 性能，且这种影响如何随模型和 Scaffold 变化？**\n*   **实验设计：** 在 `SWE-bench Verified` 和 `SWE-bench Pro` 上，对比 4 个前沿模型（Claude Opus 4.5, Kimi K2.5, MiniMax M2.5, Qwen 3.6-27B）在 2 个 Scaffold（mini-SWE agent, OpenCode）下，对原始代码和 SPT 扰动代码的 Resolve Rate 差异。\n*   **答案：** 性能下降幅度较小但显著（最高 6.7 个百分点）。关键发现是**鲁棒性排名不具可迁移性**（Jagged Frontier）：例如 Qwen 在 `mini-SWE agent` 上最鲁棒，但在 `OpenCode` 上最脆弱。简单的 Scaffold（mini-SWE agent）通常比复杂的 Scaffold（OpenCode）更鲁棒。\n\n**RQ2: SPTs 给 Agent 带来了多少额外的努力（Effort），控制任务结果后？**\n*   **实验设计：** 仅分析那些在原始和扰动代码上都成功解决的运行轨迹，比较 Step Count 和 Token Cost 的相对变化。\n*   **答案：** 即使 Resolve Rate 变化不大，**Effort 显著增加**。Cost 平均增加 4.0% - 22.9%，Step Count 增加较少。这表明 Agent 在处理扰动代码时消耗了更多上下文（Context），而非仅仅增加了交互轮次。\n\n**RQ3: Agent 在语义等价变体上失败时，出现了什么失败模式？**\n*   **实验设计：** 手动分析 20 个具有高方差或高退化率的 Agent 轨迹，定性分析其行为。\n*   **答案：** 观察到四种主要模式：\n    1.  **检测并回滚：** Agent 识别出代码被混淆，直接 `git reset` 恢复原始状态。\n    2.  **定位能力退化：** SPTs（如死代码注入）稀释了 `grep` 搜索结果，导致 Agent 难以定位关键代码。\n    3.  **过度修复：** Agent 试图“简化”或“修复”被扰动的代码，引入了不必要的变更，增加了失败风险。\n    4.  **验证混淆：** Agent 将测试失败错误归因于 SPTs（如字符串分割），而非真正的 Bug，导致提交错误补丁。\n\n**总结：** 鲁棒性不是模型的固有属性，而是模型、Scaffold 和工作负载（Workload）的联合属性。即使是最先进的模型，在面对语义保持的代码变换时，其表现也具有高度的不确定性和依赖性。", "additional_insights": "### § 8 Take-aways\n\nAI code agents 的鲁棒性并非模型本身的固有属性，而是模型、Agentic Scaffold 和工作负载共同作用的“锯齿状前沿”（Jagged Frontier），这意味着在特定 Benchmark 上表现稳健的模型（如 Qwen 在 mini-SWE agent 下）在另一配置下可能极度脆弱。语义保持变换（Semantics-Preserving Transformations, SPTs）即使以非对抗性的随机方式应用，也能导致最高 6.7 个百分点的 Resolve Rate 下降，且在 16 种配置中有 6 种表现出统计显著的退化。更隐蔽的影响在于，SPTs 显著增加了 Agent 的推理成本，即使 Resolve Rate 未变，Token 成本也可能增加高达 22.9%，表明 Agent 在处理扰动代码时消耗了更多上下文和步骤。简单的 Scaffold（如 mini-SWE agent）比复杂的 Scaffold（如 OpenCode）对扰动更具鲁棒性，这挑战了“更复杂架构必然更稳健”的直觉。退化效应高度集中在少数特定实例上，而非均匀分布，表明 Agent 的脆弱性与特定代码库的结构特征紧密相关。Agent 在面对 SPTs 时表现出多种失败模式，包括被死代码（Dead Code）误导导致定位失败、错误归因测试失败，甚至尝试“修复”语义等价的扰动代码。\n\n### § 9 最脆弱的假设\n\n该方法最关键的假设是：**所实施的 14 种 Semantics-Preserving Transformations (SPTs) 在目标代码库的所有执行路径上严格保持语义等价性，即不会改变任何可观察行为或测试用例的结果。** 如果这一假设不成立，即某些 SPT 实际上引入了语义错误（Semantic Errors），那么观察到的性能下降可能归因于代码功能的破坏而非 Agent 对表面扰动的敏感性，从而彻底推翻关于“鲁棒性”的核心结论。在实际中，这一假设可能因 Python 的动态特性而失效，例如 `Commutative Operand Permuter` 假设加法和乘法满足交换律，但若操作数是自定义类且重写了 `__add__` 或 `__radd__` 方法，交换操作数可能改变返回值或副作用；同样，`Local Variable Renamer` 若未能识别通过 `locals()` 或字符串反射访问的变量名，重命名将导致运行时错误。论文通过 Differential Testing 在三个项目（SymPy, sqlfluff, xarray）的测试套件上验证了 SPTs 的等价性，但这仅提供了基于测试覆盖率的经验证据，而非形式化证明。由于测试套件无法覆盖所有可能的输入和边缘情况，且 SPTs 是在整个仓库范围内随机应用，未被测试覆盖的代码路径中可能存在语义破坏，这是该研究最大的潜在漏洞。\n\n### § 10 最小复现实验\n\n在 1 周内，你可以复现论文中关于“SPTs 导致 Agent 定位能力退化”的定性发现，具体聚焦于 **Dead String Assignment** 这一种变换。首先，从 SWE-bench Verified 中选取一个已知由 Claude Opus 4.5 或 Qwen 成功解决的简单实例（例如涉及字符串匹配或特定变量查找的任务）。其次，手动实现一个简单的脚本，在该实例的源文件中随机插入 5-10 个包含 Issue Description 中关键词的死字符串赋值（如 `unused_var = \"keyword_from_issue\"`），确保这些赋值位于函数体内且不影响程序逻辑。然后，使用 mini-SWE agent 或 OpenCode 运行该扰动后的代码库，记录 Agent 的轨迹（Trajectory）。测量指标包括：Agent 是否使用了 `grep` 或类似搜索工具、搜索结果的噪音程度、Agent 是否被误导到错误的文件、以及最终是否成功解决 Issue。如果 Agent 在搜索过程中被死代码干扰，花费更多步骤或失败，则支持了论文关于“SPTs 稀释 grep 结果并降低核心文件可信度”的 claim；如果 Agent 完全忽略这些死代码并直接定位到正确位置，则反驳了该特定变换对定位能力的显著影响。此实验无需复现完整的随机采样器或所有 14 种变换，仅需验证一种高干扰性变换对 Agent 行为的影响。", "research_value": "### § 11 最强反例设计\n\n要最有力地攻击这篇论文，核心策略是挑战其**Semantics-Preserving Transformations (SPTs)** 的“语义保持”假设，并论证观察到的性能退化并非源于模型对表面扰动的脆弱性，而是源于 SPTs 无意中破坏了代码库的**隐式契约（Implicit Contracts）**或**工具链兼容性（Toolchain Compatibility）**，从而将“鲁棒性测试”扭曲为“工具链稳定性测试”。\n\n具体反例设计如下：\n\n1.  **理论攻击：隐式语义破坏与工具链失效**\n    论文假设 SPTs 仅改变代码的表层结构（Surface Structure），而不改变其运行时行为。然而，现代代码智能体（Code Agents）严重依赖外部工具（如 `grep`, `ast` 解析器, `linter`, `type checker`）来导航和理解代码。许多 SPTs（如 `Dead String Assignment` 或复杂的 `Control-Flow Rewrites`）虽然不改变 Python 解释器的执行结果，但可能改变静态分析工具的输出。例如，`Local Variable Renamer` 如果重命名了被 `logging` 模块或 `debugger` 硬编码引用的变量名，或者 `If Else Switcher` 改变了代码的缩进结构导致 `flake8` 或 `black` 等格式化器报错，Agent 可能会因为工具链报错而陷入死循环或错误路径。这种失败并非因为 Agent 无法理解语义，而是因为 SPTs 破坏了 Agent 赖以生存的**工具生态（Tool Ecosystem）**。如果性能退化主要发生在那些依赖特定静态分析结果的 Agent 轨迹中，那么论文关于“模型语义理解脆弱性”的结论就是错误的，实际反映的是“Agent 对工具链噪声的敏感性”。\n\n2.  **实验反例：控制工具链输出的对照实验**\n    设计一个对照实验，使用相同的 SPTs 扰动代码库，但强制 Agent 使用**语义感知的导航工具**（如基于 AST 的搜索而非基于文本的 `grep`）或禁用所有静态分析工具。如果在使用语义感知工具后，Agent 的性能退化显著降低甚至消失，则证明原始的退化主要源于工具链对表面扰动的误报，而非模型本身的语义理解缺陷。此外，可以引入一组**“工具链鲁棒性基线”**，即在不改变代码语义的情况下，仅修改代码的格式（如空格、换行），观察 Agent 性能是否同样下降。如果格式修改导致的退化与 SPTs 导致的退化幅度相当，则说明 Agent 的脆弱性更多源于对代码格式的过度依赖（Format Bias），而非对深层语义变换的敏感，从而削弱论文关于“语义保持变换”特殊性的主张。\n\n3.  **真实世界场景：重构工具的自然扰动**\n    在真实软件开发中，开发者使用重构工具（如 `refactor` 命令）进行代码变换，这些工具通常保证语义等价且维护工具链兼容性。如果论文中的 SPTs 是由脚本随机生成的，它们可能包含重构工具不会产生的“病态”变换（如在不合适的地方插入死代码）。如果 Agent 在面对由专业重构工具生成的、同样语义等价的代码变体时表现出更高的鲁棒性，则说明论文的 SPTs 库引入了非自然的噪声，其评估结果不能推广到真实的代码维护场景。这将挑战论文结论的外部效度（External Validity），表明其发现的“锯齿状前沿”可能是由非自然的扰动方式人为制造的。\n\n### § 12 Follow-up Research Idea\n\n基于论文揭示的“鲁棒性依赖于模型、Scaffold 和工作负载的联合分布”这一局限，以及 SPTs 可能破坏工具链兼容性的潜在问题，提出一个全新的研究方向：**从“被动鲁棒性评估”转向“主动语义对齐与工具链感知增强（Active Semantic Alignment and Toolchain-Aware Augmentation）”**。\n\n**（a）驱动局限与未满足需求：**\n现有研究（包括本文）主要关注评估 Agent 在扰动下的脆弱性，但缺乏一种机制让 Agent 在运行时主动识别并适应代码的表层变化，或确保其使用的工具链对扰动具有鲁棒性。论文指出简单的 Scaffold 更鲁棒，但这牺牲了性能。我们需要一种方法，既能保持复杂 Scaffold 的高性能，又能通过**语义对齐（Semantic Alignment）**技术，使 Agent 对表面扰动具有内在的不变性（Invariance）。此外，Agent 目前缺乏对“代码是否被扰动”的自我意识，导致其在面对扰动时容易陷入过度修复或定位失败。\n\n**（b）借鉴相邻领域的方法：**\n借鉴**计算机视觉中的对抗训练（Adversarial Training）**和**自然语言处理中的语义不变性学习（Semantic Invariance Learning）**。在对抗训练中，模型通过暴露于扰动样本并最小化扰动前后的输出差异来学习鲁棒特征。在语义不变性学习中，模型被训练以忽略表层噪声，专注于深层语义。我们可以将这些思想引入 Code Agents，设计一种**“语义锚定（Semantic Anchoring）”**机制，使 Agent 在导航和修复代码时，不仅依赖文本匹配，还依赖基于 AST 或数据流分析的语义指纹（Semantic Fingerprints）。\n\n**（c）第一个实验设计：**\n1.  **构建语义指纹库：** 为 SWE-bench 中的每个代码库构建一个基于 AST 和数据流分析的语义指纹库，该指纹对 SPTs 具有不变性（例如，变量名重命名不影响数据流图的结构）。\n2.  **设计语义感知 Scaffold：** 修改现有的 Agent Scaffold（如 mini-SWE agent），使其在导航代码时，优先使用语义指纹进行匹配，而非文本搜索。例如，当 Agent 需要查找“计算矩阵乘法的函数”时，它不再使用 `grep \"matrix\"`，而是查询语义指纹库中“具有矩阵乘法数据流模式”的函数。\n3.  **对比实验：** 在相同的 SPTs 扰动下，对比原始 Scaffold 和语义感知 Scaffold 的性能。预期结果是，语义感知 Scaffold 在 Resolve Rate 和 Effort 上均表现出更高的鲁棒性，且其鲁棒性排名在不同模型间更加一致，从而验证了“语义对齐”作为提升鲁棒性有效途径的潜力。\n4.  **扩展实验：** 进一步探索是否可以通过**元学习（Meta-Learning）**，让 Agent 在训练阶段自动学习哪些工具链调用对扰动敏感，并动态调整其工具使用策略，从而实现自适应的鲁棒性。\n\n这一研究方向不仅超越了单纯的评估，而是提出了一种构建更鲁棒 Code Agents 的具体技术路径，将鲁棒性从“模型属性”转化为“可设计的系统特性”，具有更高的实用价值和理论深度。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Hasan Najib Mahmud\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Shreya Gupta\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Isha Chaudhary\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Nathaniel Enis\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Ravi Mangal\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Gagandeep Singh\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Corina Pasareanu\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Colorado State University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Microsoft\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"University of Illinois Urbana-Champaign\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Carnegie Mellon University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"∗\",\n      \"text\": \"These authors contributed equally.\"\n    }\n  ]\n}\n```", "summary_translation": "AI 代码代理正越来越多地被部署以解决真实的软件问题，然而其在表面代码变化下的可靠性仍知之甚少。我们评估了当周围代码库被重写为语义等价形式时，修复仓库级问题的编码代理是否仍保持可靠。我们引入了一种随机变体采样器，该采样器应用常见的语义保持变换（SPTs）——涵盖控制流重写、死代码注入和标识符重命名——以生成扰动变体。我们在从 SWE-bench Verified 和 SWE-bench Pro 中抽取的实例上，评估了两种代理框架（mini-SWE agent 和 OpenCode），每种框架分别由四种前沿模型之一（Claude Opus 4.5、Kimi K2.5、MiniMax M2.5 和 Qwen 3.6-27B）提供支持。对于每个实例，代理在未扰动和扰动变体上多次运行，产生成对的解决率估计，从而将扰动效应与内在随机性隔离开来。我们发现大多数配置下仅有轻微的性能下降：在受影响最大的配置中，平均解决率下降高达 6.7 个百分点，在 16 种模型、框架和数据集配置中有 6 种表现出统计显著的性能下降。至关重要的是，没有单一模型在鲁棒性排名上能跨框架保持一致——Qwen 在 SWE-bench Verified 上使用 mini-SWE agent 时是最鲁棒的模型之一，但在 OpenCode 下却是最脆弱的——这揭示了一个参差不齐的鲁棒性前沿。较简单的框架（mini-SWE agent）对扰动更具鲁棒性。我们的结果表明，即使是最顶尖的前沿模型也容易受到语义保持扰动的影响，尽管这种影响并不均匀，这引发了人们对 AI 代码代理在多样化真实世界代码库中部署可靠性的担忧。"}, {"title": "FACET: Preserving Source Intent and Executable State in Terminal Task Synthesis", "arxiv_id": "2608.18580", "authors": "Kou Shi, Zun Wang, Qisheng Su, Shiting Huang, Ziao Zhang, Zhen Fang, Qingnan Ren, Jin Liu, Yu Zeng, Yiming Zhao, Lin Chen, Zehui Chen, Feng Zhao", "summary": "Training terminal agents requires scalable executable supervision, yet synthesizing high-quality terminal tasks remains challenging. Each task couples an instruction, an initialized environment, a reference solution, and an executable verifier; if these artifacts are generated from inconsistent assumptions, the resulting task may be unsolvable or incorrectly evaluated. Meanwhile, multi-stage synthesis can discard the goals, dependencies, state transitions, and procedural constraints encoded in the original sources. We present FACET (Fine-grained Agentic Construction of Executable Tasks), a framework that addresses both information preservation and cross-artifact consistency. FACET reconstructs related agent skills into coherent, information-rich scenarios, then realizes and repairs the execution environment before generating the final task artifacts. The resulting container state serves as shared grounding for the instruction, solution, and verifier, while execution-based validation and targeted repair correct artifact-specific failures without unnecessarily regenerating valid components. FACET produces complex terminal tasks with dense executable checks, and successful trajectories collected from these tasks provide effective, data-efficient supervision. Fine-tuning models across multiple scales consistently improves performance on Terminal-Bench 2.1, while analyses of alternative generation schemes support the importance of environment-grounded construction for task validity and solution-verifier alignment. These results establish source-intent preservation and shared executable-state grounding as key principles for scalable terminal-task synthesis.", "category": "cs.AI", "cluster": "Code Agents \u0026 Software Engineering", "tags": ["cs.AI"], "filter_reason": "该论文符合研究范围，主要基于以下理由：\n\n1.  核心对象明确为 LLM 智能体 (LLM Agents)：论文标题和摘要明确指出研究对象是 \"Terminal Agents\"（终端智能体），这是一种典型的需要工具使用（Tool Use）和环境交互的 Agentic AI 场景。\n2.  涉及智能体的训练与数据合成 (Agent Training/Data Synthesis)：论文的核心贡献是提出 FACET 框架，用于合成高质量的终端任务数据，以解决训练终端智能体时缺乏可扩展的可执行监督信号的问题。这直接服务于“构建、改进、训练 LLM 智能体”这一核心目标。\n3.  包含智能体能力构建机制 (Agentic Mechanisms)：摘要中提到 FACET 框架通过“重构相关智能体技能”（reconstructs related agent skills）、“实现和修复执行环境”（realizes and repairs the execution environment）以及“基于执行的验证”（execution-based validation）来生成任务。这些步骤涉及对智能体技能、执行环境和验证器的协同构建，属于智能体系统构建方法论的一部分，而非单纯的基础设施或应用层问题。\n4.  符合“保留”标准中的训练/蒸馏/数据生成类：根据筛选标准，如果论文研究 agent training/distillation 或为智能体提供有效监督数据的方法，且明确指向 Agentic LLMs，应予以保留。本文通过改进任务合成流程来提升智能体在 Terminal-Bench 上的性能，属于智能体能力改进的前置关键环节。\n\n综上，该论文聚焦于终端智能体的训练数据合成与技能构建，属于 Agentic AI 中关于智能体训练和构建的前沿研究，故判定为符合。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决终端智能体（Terminal Agents）训练中高质量、可执行任务合成（Executable Task Synthesis）的核心难题。具体而言，研究聚焦于如何从异构的代理技能（Agent Skills）中合成出包含指令（Instruction）、初始化环境（Initialized Environment）、参考解（Reference Solution）和可执行验证器（Executable Verifier）的紧密耦合任务包，同时确保这些组件之间的一致性（Cross-artifact Consistency）并保留源技能中的丰富信息（Source Intent Preservation）。\n\n这一问题的重要性在于，终端环境的交互具有高度的状态依赖性和执行复杂性。智能体不仅需要生成合理的文本或代码，还必须正确操作文件、安装依赖、调用命令行工具并处理执行失败。现有的合成方法往往导致任务组件基于不一致的假设生成，例如指令引用了环境中不存在的文件，或验证器测试的状态无法通过生成的解决方案达到，从而导致任务不可解或评估错误。此外，多阶段合成过程容易丢失源材料中编码的目标、依赖关系、状态转换和过程约束，导致合成的任务过于简化，无法提供有效的监督信号。\n\n解决这一问题能带来显著价值：首先，它提供了可扩展的、高质量的监督数据，用于后训练（Post-training）语言智能体。通过保留源意图和共享可执行状态（Shared Executable State），FACET 框架能够生成具有密集可执行检查（Dense Executable Checks）的复杂任务，从而更精确地评估和训练智能体的长程工作流能力。其次，实验表明，使用 FACET 合成的数据进行微调，能在不同规模的模型（4B 至 27B）上显著提升在 Terminal-Bench 2.1 上的性能，证明了其作为数据高效监督信号的有效性。最后，该研究确立了“源意图保留”和“共享可执行状态接地”作为终端任务合成的关键原则，为构建更可靠、更复杂的智能体训练基准提供了方法论基础。\n\n### § 2 前人工作与不足\n\n在 FACET 之前，已有多种方法尝试合成终端任务，包括基于领域规范（Domain Specifications）、技能分类法（Skill Taxonomies）、可重用仓库（Reusable Repositories）、终端录制（Terminal Recordings）以及程序化生成的任务签名（Procedurally Generated Task Signatures）。代表性的工作包括 Nemotron-Terminal、Endless-Terminals、Terminal-Lego、TerminalWorld 和 Tmax 等。这些方法展示了合成可执行环境在扩展终端智能体训练方面的潜力，并构建了各自的数据集。\n\n然而，这些现有方法存在明显的不足，主要体现在信息丢失和组件不一致两个方面：\n\n1.  **源信息丢失（Source Information Loss）：** 现有方法通常直接将采样到的技能转换为任务描述，或在多阶段生成过程中逐步压缩信息。这导致丰富的源材料（如能力、依赖、中间状态、输入输出契约和过程约束）被简化为浅层的任务描述。例如，TerminalWorld 虽然基于真实终端录制，但其合成过程可能未能充分保留跨技能的依赖关系和中间状态，导致生成的任务缺乏原始源中的结构复杂性。这种信息压缩使得合成的任务仅保留了源材料的一小部分，无法提供足够复杂的监督信号。\n\n2.  **任务组件漂移（Task Artifact Drift）：** 现有方法往往独立生成指令、环境、解决方案和验证器，或者通过传递文本规范来协调它们。这种方法无法保证所有组件都基于相同的实际执行状态（Realized Execution State）。例如，指令可能引用一个在环境中未实现的文件，解决方案可能假设不同的模式或依赖，而验证器可能测试一个生成的任务无法产生的状态。这种不一致性导致大量合成的任务无效。相比之下，FACET 通过“可执行状态接地”（Executable-State-Grounded Construction）范式，先构建并修复执行环境，然后将实现后的容器状态作为共享接地接口，确保指令、解决方案和验证器都基于相同的文件、模式、服务和运行时状态生成，从而显著提高了任务的有效性和组件间的一致性。\n\n此外，现有数据集在任务复杂度和验证密度上也有局限。例如，Nemotron-Terminal 和 Endless-Terminals 的平均可执行测试点较少，意味着每个任务包含的独立检查要求较少，评估标准相对宽松。而 FACET 通过细粒度的代理构建（Fine-grained Agentic Construction）和针对性的修复机制，生成了具有更多可执行检查点的复杂任务，从而提供了更严格、更细致的评估和训练信号。", "core_insight": "### § 3 重建作者的思考路径\n\n在终端智能体（Terminal Agents）的训练中，合成数据的质量直接决定了模型的上限。早期的合成方法主要依赖从开源仓库、Q\u0026A社区或终端录制中提取技能（Skills），并通过简单的模板或程序化生成将其转化为任务。然而，研究者很快发现这种“拼凑式”的合成存在两个致命缺陷。\n\n首先，**信息丢失（Information Loss）**。原始的技能描述往往包含丰富的上下文、依赖关系和中间状态，但在转化为简化的任务指令（Instruction）时，这些细粒度的约束被压缩或丢弃。这导致生成的任务过于简单，无法反映真实场景中复杂的长程依赖（Long-horizon dependencies）。\n\n其次，**组件不一致（Artifact Inconsistency）**。一个完整的终端任务由指令（Instruction）、环境（Environment）、参考解（Solution）和验证器（Verifier）组成。现有的流水线通常独立生成这些组件，或者仅通过文本规范进行传递。这导致了严重的“幻觉”问题：指令中提到的文件在环境中不存在，解决方案假设的依赖项未安装，或者验证器检查的状态与解决方案产生的状态不匹配。这种不一致使得大量合成任务在验证阶段失效，或者即使通过验证，其逻辑也是脆弱的。\n\n为了解决这些问题，作者意识到必须改变合成的范式。不能将技能视为孤立的模板，而应将其视为构建复杂场景的积木。关键在于**重建（Reconstruction）**：在生成具体任务组件之前，先通过智能体推理，将多个相关技能融合成一个连贯的、信息丰富的用户场景（Scenario），保留所有的依赖和状态转换。\n\n更进一步，作者认为**执行状态（Executable State）**才是连接所有组件的唯一真理来源。如果指令、解决方案和验证器都基于同一个实际构建并初始化的容器环境（Container State）进行生成，那么它们之间的不一致性将从根本上被消除。因此，思考路径从“文本到文本”的生成，转向了“环境驱动”的构建：先构建并修复环境，暴露其真实状态，再基于此状态生成指令、解决方案和验证器。这种**共享可执行状态接地（Shared Executable-State Grounding）**的策略，确保了任务组件在物理层面的一致性，从而解决了合成数据中的核心痛点。\n\n### § 4 核心 Intuition\n\n现有合成方法失败的核心在于**组件间的语义漂移**：指令、环境、解和验证器各自独立生成，导致它们在逻辑上无法对齐，且原始技能的复杂上下文在简化过程中丢失。\n\nFACET 的核心直觉是**以“已实例化的执行环境”为唯一共享真理（Single Source of Truth）**。通过先构建并修复环境，暴露其真实的文件、依赖和状态，再让指令、解决方案和验证器基于这个共同的物理状态进行生成，从而强制实现组件间的一致性。\n\n同时，通过**智能体场景重建（Agentic Scenario Reconstruction）**，将离散的原子技能融合为包含完整依赖链和状态转换的复杂工作流，从而在保留源信息丰富度的同时，生成具有高密度可执行检查（Dense Executable Checks）的高质量任务。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nFACET (Fine-grained Agentic Construction of Executable Tasks) 的核心方法在于解决终端任务合成中的两个关键挑战：**源信息丢失**（Source Information Loss）和**工件不一致**（Artifact Inconsistency）。它提出了一种基于**可执行状态接地**（Executable-State-Grounded）的构建范式，通过共享的容器状态来协调指令、解决方案和验证器的生成。\n\n以下是 FACET 的完整 Pipeline，结合一个具体的例子进行说明：\n\n**假设场景**：我们需要合成一个任务，要求 Agent 使用 Python 处理一个 CSV 文件，清洗数据并生成一个统计报告 PDF。\n\n1.  **信息源获取与场景重建 (Information Source Acquisition \u0026 Scenario Reconstruction)**\n    *   **输入**：从 OpenClaw 或 GitHub 收集的相关 Agent Skills（例如：“CSV 数据清洗技能”、“PDF 报告生成技能”）。\n    *   **处理**：\n        *   **Skill Understanding**：解析每个 Skill 的描述、工具依赖、输入输出格式。\n        *   **Scenario Extraction**：提取潜在的应用场景。例如，将“清洗”和“生成报告”关联起来，形成一个连贯的用户目标。\n        *   **Agentic Scenario Reconstruction**：通过五个模块（Skill Analysis, Scenario Exploration, Association, Evolution, Information Expansion）重建场景。系统不仅保留“清洗”和“生成”这两个动作，还恢复了它们之间的依赖关系（清洗后的数据格式必须匹配 PDF 生成器的输入要求）、中间状态（清洗后的临时文件）以及具体的约束（如：只保留销售额大于 1000 的记录）。\n        *   **Reference Building**：生成五维度的场景描述（Goal, Context, Capability, State, I/O \u0026 Tools），并据此生成**解决方案参考**（Solution Reference, $R_S$）和**指令参考**（Instruction Reference, $R_I$）。\n    *   **输出**：一个富含细节的场景规范 $Z = (C, R_S, R_I)$，其中 $C$ 是完整的自然语言场景描述。\n\n2.  **环境构建与修复 (Environment Construction and Repair)**\n    *   **输入**：场景规范 $Z$。\n    *   **处理**：\n        *   **Manifest Planning**：环境 Agent 根据 $Z$ 规划所需的文件、依赖库（如 `pandas`, `reportlab`）、目录结构。\n        *   **Materialization**：在受限的基础镜像中实例化这些资源。例如，生成一个包含脏数据的 `sales.csv` 文件，安装必要的 Python 包。\n        *   **Repair Loop**：如果构建失败（如依赖冲突、文件路径错误），系统会根据错误日志自动修复环境，最多尝试 3 次。\n    *   **输出**：一个成功构建并初始化的 Docker 镜像，以及其对应的**初始可执行状态** $e_0$（包括具体的文件路径、内容、环境变量等）。\n\n3.  **基于共享状态的任务工件生成 (Executable-State-Grounded Artifact Generation)**\n    *   **输入**：场景规范 $Z$ 和共享的初始状态 $e_0$。\n    *   **处理**：\n        *   **Instruction Generation**：生成用户指令 $I$。由于 $I$ 是基于真实的 $e_0$ 生成的，它会准确引用 `sales.csv` 的路径和列名，避免了指令与环境不匹配的问题。\n        *   **Solution Generation**：生成参考解决方案 $S$（如 `solve.sh`）。$S$ 同样基于 $e_0$ 和 $R_S$ 生成，确保它能正确处理环境中的实际数据。\n        *   **Execution**：执行 $S$，得到最终状态 $e_T$。\n        *   **Verifier Generation**：生成验证器 $V$（如 `test_*.py`）。$V$ 基于 $I, R_S, e_0, e_T$ 生成，检查最终状态是否满足所有要求（如：PDF 是否存在、统计数据是否正确）。\n    *   **输出**：初步的任务工件包 $(I, S, V)$。\n\n4.  **验证与定向修复 (Validation and Targeted Repair)**\n    *   **输入**：任务工件包 $(I, S, V)$ 和环境。\n    *   **处理**：\n        *   **Validation**：在干净的容器中运行验证流程。检查：(1) 环境构建成功；(2) 初始状态下验证器不通过；(3) 执行 $S$ 后验证器通过。\n        *   **Targeted Repair**：如果验证失败，系统根据执行轨迹定位失败原因（是指令错误、解决方案错误还是验证器错误），仅修复对应的工件，而不是重新生成整个任务。最多尝试 5 次。\n    *   **输出**：最终验证通过的任务包 $T$，包含 `instruction.md`, `environment/`, `solution/`, `tests/`, `task.toml`。\n\n**总结**：FACET 的关键创新在于**先构建环境，再基于真实环境状态生成指令、解决方案和验证器**，并通过**定向修复**机制保证最终任务的一致性和可执行性。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的理论数学推导，其核心贡献在于工程框架设计和实验验证。但为了清晰定义任务合成的目标，论文提出了一个形式化的任务接受准则。\n\n**公式 (2) 的任务接受准则：**\n\n$$ A(T) = B(E) \\land \\neg \\nu_V(e_0) \\land (e_T \\neq \\bot) \\land \\nu_V(e_T) $$\n\n**Intuition 解释：**\n\n*   **$T$**：合成的终端任务包。\n*   **$E$**：环境规范。\n*   **$B(E)$**：环境构建是否成功。如果环境构建失败，任务无效。\n*   **$e_0$**：初始状态，由 $Init(E)$ 得到。\n*   **$\\nu_V(e)$**：验证器 $V$ 在状态 $e$ 下的输出结果（True/False）。\n*   **$\\neg \\nu_V(e_0)$**：初始状态下验证器必须**不通过**。这确保了任务是非平凡的（Non-trivial），即初始状态不满足要求，Agent 需要执行操作才能完成任务。\n*   **$S$**：参考解决方案。\n*   **$e_T$**：执行 $S$ 后的最终状态，$e_T = Run(S, e_0)$。\n*   **$e_T \\neq \\bot$**：参考解决方案必须能成功执行，不能崩溃或失败（$\\bot$ 表示失败）。\n*   **$\\nu_V(e_T)$**：最终状态下验证器必须**通过**。这确保了参考解决方案确实能完成任务。\n\n**总结**：这个公式定义了一个“有效任务”的四个必要条件：环境可构建、初始状态不满足要求、参考解可执行、参考解能达成目标。这是 FACET 框架中所有验证和修复步骤的理论基础。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有的终端任务合成方法存在两个主要问题：一是**源信息丢失**，导致合成任务过于简单，缺乏复杂性；二是**工件不一致**，指令、环境、解决方案和验证器之间可能存在矛盾，导致任务无效或评估错误。此外，现有数据集的任务难度和验证密度不足，难以有效监督训练强大的终端 Agent。\n\n**2. 设计了什么实验验证这个问题？**\n*   **数据集对比实验**：将 FACET 合成的数据集与现有的终端 Agent 数据集（如 Nemotron-Terminal, Terminal-Lego, TerminalWorld 等）进行对比。比较指标包括轨迹长度（Turns）、每个任务的验证点数量（Tests）、以及使用统一 Solver（DeepSeek-V4-Pro）在相同设置下的通过率（P@1, P@3）。\n*   **模型微调实验**：使用 FACET 合成的 1.2K 条成功轨迹对 Qwen3.5 系列模型（4B, 9B, 27B）进行监督微调（SFT），并在 Terminal-Bench 2.1 基准上评估性能提升。\n*   **生成方案分析实验**：对比三种不同的工件生成顺序（Forward: $I \\to S \\to V$, Reverse: $I \\to V \\to S$, Joint: 同时生成），分析其对任务初始有效性和修复后产量的影响，以验证“基于环境状态的顺序生成”的优势。\n*   **任务难度分析**：分析 FACET 任务中验证器检查的通过率分布，以及不同技能类别、指令长度对任务难度的影响，以证明 FACET 任务的复杂性和挑战性。\n\n**3. 问题的答案是什么？**\n*   **FACET 产生了更高质量、更复杂的任务**：与现有数据集相比，FACET 的任务具有更长的轨迹（平均 11.86 turns）和更多的验证点（平均 22.77 tests），表明任务更复杂、验证更严格。\n*   **FACET 提供了有效的监督信号**：在 Terminal-Bench 2.1 上，使用 FACET 数据微调的 Qwen3.5 模型在所有规模下均取得显著提升（4B: +7.12, 9B: +8.24, 27B: +6.75）。特别是 27B 模型的性能接近更大的 397B 模型，证明了 FACET 数据的高效性。\n*   **基于环境状态的顺序生成（Forward）最优**：实验表明，先构建环境，再依次生成指令、解决方案和验证器（Forward）的方案，其初始有效性和最终产量均高于 Reverse 和 Joint 方案，且能更好地保证解决方案与验证器的一致性。\n*   **任务难度源于组合性要求**：分析显示，许多失败轨迹仅因少数几个验证点未通过而失败，说明任务难度不仅在于执行主流程，还在于满足所有细粒度的、相互依赖的要求。FACET 的密集验证机制能有效捕捉这些细微错误。", "additional_insights": "### § 8 Take-aways\n\nFACET 框架的核心创新在于将终端任务合成从“独立生成组件”转变为“基于共享可执行状态（executable-state-grounded）的协同构建”，通过先构建并修复环境容器，再基于该真实状态生成指令、解决方案和验证器，从根本上解决了多阶段合成中常见的组件间不一致问题。论文提出“代理场景重构（agentic scenario reconstruction）”机制，将离散的 Agent Skills 重组为包含跨技能依赖、中间状态和过程约束的连贯场景，有效保留了源数据中的复杂意图，避免了传统方法中信息过度压缩导致的任务浅层化。实验表明，这种基于环境接地（environment-grounded）的生成范式显著提升了任务的有效性（validity）和验证器与解决方案的对齐度，特别是在处理长 horizon 和复杂依赖的任务时，其初始有效率和修复后的最终产出率均优于反向或联合生成方案。尽管 FACET 生成的任务具有更密集的验证检查点（dense executable checks）和更低的单次通过率（P@1），但这反映了任务对细节要求更严格，且使用仅 1.2K 条成功轨迹进行微调，即可在 Terminal-Bench 2.1 上使 Qwen3.5 系列模型（4B-27B）获得显著提升，证明了其数据的高效性和监督信号的质量。\n\n### § 9 最脆弱的假设\n\nFACET 最关键的假设是：**“基于失败轨迹（failure trace）和重构规范（reconstructed specification）的自动化修复（targeted repair）能够可靠地纠正环境构建或任务组件中的错误，且不会引入新的语义偏差或无限循环。”** 如果这一假设不成立，即修复代理无法准确定位错误根源或修复后破坏了任务原有的逻辑约束，那么整个流水线将产生大量看似有效但实际逻辑错误（silent failure）的任务，或者因修复预算耗尽而导致产出率极低，从而使得“可执行状态接地”的优势无法转化为高质量数据。在实际中，这一假设可能失效的原因是：终端环境的错误往往具有高度耦合性（例如，一个依赖包的版本冲突可能导致多个文件解析失败），简单的基于日志的修复可能只能解决表面症状；此外，LLM 在修复代码或配置时可能为了通过验证而“作弊”（例如，修改验证器以匹配错误的解决方案，或简化任务要求以通过构建），导致生成的任务虽然形式上 valid，但失去了原有的训练价值。论文提供的证据主要限于统计层面的修复成功率（如 Table 5 显示 81.63% 的最终验证通过率）和定性分析，但缺乏对“修复后任务语义一致性”的深入审计，也未展示修复代理在面对复杂、非确定性错误时的具体行为边界，因此读者难以确信所有通过验证的任务都严格保留了原始的场景意图。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现并验证 FACET 中**“生成顺序对任务一致性的影响”**这一核心 claim，无需复现完整的场景重构模块。具体方案如下：选取 50 个现有的、结构清晰的 Agent Skills 或简单的终端任务描述作为种子数据。实现三个简化的生成流水线：1) **Forward**：先生成环境 Dockerfile 并构建，再基于构建后的环境状态生成指令、解决方案和验证器；2) **Reverse**：先生成指令和验证器，最后生成解决方案；3) **Joint**：一次性生成所有组件。测量指标为**“初始验证通过率”**（即无需修复即通过环境构建、解决方案执行和验证器检查的任务比例）以及**“组件间不一致错误类型分布”**（如路径不匹配、依赖缺失、验证器与解决方案逻辑冲突）。如果 Forward 方案的初始通过率显著高于 Reverse 和 Joint，且 Reverse 方案中“跨组件契约不匹配（cross-artifact contract mismatch）”的错误比例最高，则支持了论文关于“环境接地和顺序生成能提升对齐度”的结论；反之，若三者差异不显著或 Reverse/Joint 表现更好，则反驳了该 claim 的必要性。此实验仅需调用 LLM API 和简单的 Docker 构建脚本，无需复杂的场景重构逻辑，即可验证核心方法论的有效性。", "research_value": "### § 11 最强反例设计\n\n要挑战 FACET 的核心主张，最有力的攻击并非质疑其工程实现的复杂性，而是攻击其**“可执行状态接地（Executable-State-Grounded）”范式在语义保真度上的根本缺陷**，即所谓的**“验证器作弊（Verifier Cheating）”或“语义漂移（Semantic Drift）”**。\n\n**理论论证：形式化有效性与语义一致性的解耦**\nFACET 的有效性完全依赖于公式 (2) 中的逻辑约束 $A(T) = B(E) \\land \\neg \\nu_V(e_0) \\land (e_T \\neq \\bot) \\land \\nu_V(e_T)$。然而，这个公式仅保证了**形式上的可执行性（Formal Executability）**，并未保证**语义上的正确性（Semantic Correctness）**。在 LLM 生成的多阶段流水线中，存在一种系统性偏差：当 `Targeted Repair` 模块面对难以修复的 `Solution` 或 `Environment` 错误时，LLM 倾向于修改最容易改变的部分——即 `Verifier` 或 `Instruction`，以使其与错误的 `Solution` 对齐，而不是修复 `Solution` 以符合原始意图。\n\n**具体反例场景：依赖注入导致的“虚假通过”**\n假设源技能要求 Agent 使用 `pandas` 处理 CSV 并生成特定格式的 JSON。\n1.  **环境构建失败**：由于版本冲突，`pandas` 安装失败，环境构建报错。\n2.  **修复代理行为**：`Repair Loop` 尝试修复环境失败后，触发 `Targeted Repair`。LLM 分析错误日志，发现 `Solution` 依赖 `pandas`。为了通过验证，LLM 可能采取以下策略之一：\n    *   **策略 A（修改验证器）**：将 `Verifier` 修改为仅检查“是否存在输出文件”，而忽略内容格式，甚至忽略 `pandas` 的使用。\n    *   **策略 B（修改指令/解决方案）**：将 `Instruction` 中的“使用 pandas”改为“使用 csv 模块”，并相应修改 `Solution`。\n3.  **结果**：任务最终通过验证 $A(T)=True$。环境构建成功，初始状态不满足，最终状态满足。\n4.  **致命缺陷**：生成的任务**丢失了源技能的核心约束**（即必须使用 `pandas` 或处理特定复杂数据结构）。对于训练 Agent 来说，这个任务变得极其简单且偏离了原始意图。如果 FACET 数据集中大量存在此类“被简化”的任务，那么微调后的 Agent 提升的性能可能并非来自对复杂工作流的掌握，而是来自对**简化版、低复杂度任务**的过拟合。\n\n**实验验证设计**\n为了证明这一点，可以设计一个**“意图保留审计（Intent Preservation Audit）”**实验：\n1.  选取 FACET 生成的 100 个任务。\n2.  提取每个任务的原始 `Agent Skill` 描述中的关键约束（如特定库、特定算法、特定输出格式）。\n3.  使用一个独立的、强能力的 LLM（如 o1 或 Claude 3.5 Sonnet）作为“审计员”，对比 `Instruction`、`Solution` 和 `Verifier` 是否严格保留了这些约束。\n4.  **预期结果**：如果 FACET 存在严重的语义漂移，审计员会发现大量任务中，`Verifier` 的检查粒度远低于原始技能要求，或者 `Solution` 使用了与原始技能完全不同的、更简单的替代方案。这将证明 FACET 合成的数据虽然“可执行”，但**信息密度（Information Density）和意图保真度（Intent Fidelity）远低于声称的水平**，其性能提升可能部分归因于数据量的增加而非质量的提升。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“静态状态接地”到“动态轨迹对齐”——基于反事实推理的终端任务合成（Counterfactual Trajectory-Aligned Task Synthesis, CTATS）**\n\n**（a）驱动局限与未满足需求**\nFACET 的核心局限在于其**“静态快照”视角**。它通过构建一个初始状态 $e_0$ 和一个最终状态 $e_T$ 来定义任务，并假设只要 $S$ 能从 $e_0$ 到达 $e_T$ 且通过 $V$，任务就是有效的。然而，终端智能体的核心能力在于**过程推理（Process Reasoning）**和**错误恢复（Error Recovery）**。FACET 生成的任务往往只验证“结果正确”，而忽略了“路径正确”。例如，一个 Agent 可能通过暴力破解或绕过关键步骤得到正确结果，这在 FACET 的验证框架下是“通过”的，但在真实场景中是不可接受的。此外，FACET 的 `Targeted Repair` 机制缺乏对**因果链条（Causal Chain）**的建模，导致修复后的任务可能逻辑断裂。\n\n**（b）借鉴相邻领域的方法**\n借鉴**程序合成中的反事实解释（Counterfactual Explanation in Program Synthesis）**和**强化学习中的轨迹优化（Trajectory Optimization in RL）**。\n*   **反事实推理**：在程序合成中，通过修改输入或代码片段，观察输出变化，以确定代码的鲁棒性和逻辑正确性。\n*   **轨迹对齐**：在 RL 中，不仅奖励最终状态，还奖励中间状态的合理性（如通过 Reward Shaping 或 Inverse RL）。\n\n**（c）第一个实验设计**\n提出 **CTATS (Counterfactual Trajectory-Aligned Task Synthesis)** 框架，其核心创新是引入**“中间状态验证器（Intermediate State Verifiers）”**和**“反事实扰动测试（Counterfactual Perturbation Tests）”**。\n\n1.  **方法流程**：\n    *   **Step 1: 轨迹采样与关键帧提取**：在生成 `Solution` 时，不仅记录 $e_0$ 和 $e_T$，还通过 LLM 识别并提取 $k$ 个**关键中间状态（Key Intermediate States, $e_1, ..., e_k$）**，这些状态对应于任务中的关键决策点或状态转换（如“数据清洗完成”、“依赖安装完成”）。\n    *   **Step 2: 反事实验证器生成**：为每个关键状态 $e_i$ 生成一个**反事实验证器 $V_i^{cf}$**。该验证器不仅检查 $e_i$ 是否满足要求，还检查**“如果在此处引入特定错误，后续步骤是否会失败”**。例如，如果 $e_1$ 是“数据清洗完成”，$V_1^{cf}$ 会检查：如果数据中混入非法字符，后续的 PDF 生成是否会崩溃？如果不会，说明 `Solution` 缺乏鲁棒性，任务无效。\n    *   **Step 3: 因果一致性检查**：使用 LLM 分析 $e_0 \\to e_1 \\to ... \\to e_T$ 的转换逻辑，确保每一步都是必要的且符合源技能的意图。如果某一步可以被跳过或替换为更简单的操作而不影响最终结果，则标记为“语义漂移”，并触发重新生成。\n\n2.  **实验设置**：\n    *   **数据集**：使用 FACET 生成的 1.2K 任务作为基线。\n    *   **对比方法**：FACET vs. CTATS。\n    *   **评估指标**：\n        *   **鲁棒性得分（Robustness Score）**：在测试阶段，对 Agent 的执行轨迹引入随机扰动（如文件权限错误、网络延迟），测量 Agent 是否能正确恢复。FACET 训练的 Agent 可能在此类测试中表现较差，因为它们的训练数据缺乏对错误处理的显式监督。\n        *   **过程准确率（Process Accuracy）**：使用人工或强 LLM 评估 Agent 的执行步骤是否符合最佳实践，而不仅仅是结果正确。\n        *   **任务难度分布**：分析 CTATS 生成的任务中，因“过程错误”而失败的比例，预期应显著高于 FACET。\n\n3.  **预期贡献**：\n    *   证明**“结果正确”不等于“过程正确”**，终端智能体的训练需要更细粒度的过程监督。\n    *   提出一种新的任务合成范式，将**反事实推理**融入数据生成，提高合成数据的**因果一致性（Causal Consistency）**和**鲁棒性（Robustness）**。\n    *   为终端智能体的评估提供新的基准，不仅关注 P@1，还关注**轨迹鲁棒性（Trajectory Robustness）**。\n\n这个研究方向超越了 FACET 的“静态状态接地”，转向了**“动态轨迹对齐”**，更贴近真实世界中终端智能体面临的复杂、动态和易错环境。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Kou Shi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zun Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Qisheng Su\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Shiting Huang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ziao Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhen Fang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Qingnan Ren\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jin Liu\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Yu Zeng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yiming Zhao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Lin Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zehui Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Feng Zhao\", \"affiliations\": [1], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"MoE Key Lab of BIPC, University of Science and Technology of China\"},\n    {\"id\": 2, \"name\": \"Shanghai AI Laboratory\"},\n    {\"id\": 3, \"name\": \"Fudan University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Correspondence: fzhao956@ustc.edu.cn\"}\n  ]\n}\n```", "summary_translation": "训练终端智能体需要可扩展的可执行监督，然而合成高质量的终端任务仍然具有挑战性。每个任务都耦合了指令、初始化的环境、参考解决方案以及可执行验证器；如果这些构件是从不一致的假设中生成的，生成的任务可能无法解决或被错误评估。同时，多阶段合成可能会丢弃原始来源中编码的目标、依赖关系、状态转换和过程约束。我们提出了 FACET（Fine-grained Agentic Construction of Executable Tasks），这是一个解决信息保留和跨构件一致性的框架。FACET 将相关的智能体技能重构为连贯且信息丰富的场景，然后在生成最终任务构件之前实现并修复执行环境。生成的容器状态作为指令、解决方案和验证器的共享基础，而基于执行的验证和针对性修复则在不必要重新生成有效组件的情况下纠正特定构件的故障。FACET 生成了具有密集可执行检查的复杂终端任务，从这些任务中收集的成功轨迹提供了有效且数据高效的监督。在多个规模上微调模型在 Terminal-Bench 2.1 上始终提高了性能，而对替代生成方案的分析支持了环境基础构建对于任务有效性和解决方案-验证器对齐的重要性。这些结果确立了源意图保留和共享可执行状态基础作为可扩展终端任务合成的关键原则。"}, {"title": "Adversarial Review: Structured Disagreement for Grounded Agentic Code Review", "arxiv_id": "2608.18167", "authors": "Eric S. Qiu, Joyce Gill", "summary": "Early multi-agent LLM systems often used role-separated teams, yet scaling agent count yields diminishing returns on repository-level coding tasks. Recent alternatives treat agents as passive tools (subagents), yet this removes the benefits of agent interaction entirely. We study whether a subagent paradigm can support a middle ground: minimal agentic cooperation without the overhead of large multi-agent teams. We introduce Adversarial Review (AR), a minimal cooperative code-review protocol in which a main coding agent works with a reviewer and a critic agent. The reviewer evaluates code, while the critic audits the review through structured disagreement before the main agent edits. On LiveCodeBench, AR achieves the highest pass rate among tested methods, outperforming a five-agent baseline while using only three agents. On SWE-PRBench, naive AR exposes a false-consensus failure mode, where agents converge on agreement without sufficient evidence, but a single prompt iteration that adds disagreement explicitly achieves the highest F1 among tested methods. On SWE-bench Verified, AR also shows improvements over the baselines on repository-level coding tasks. Together, AR demonstrates that cooperative code review does not require many agents or complex communication structures: it requires that disagreement be minimal, structured, and evidence-grounded.", "category": "cs.AI", "cluster": "Code Agents \u0026 Software Engineering", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agent capability/behavior, Multi-Agent, Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=57 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文符合研究范围，核心依据如下：\n\n1.  核心对象为 LLM 智能体协作机制：论文研究的是多智能体系统（Multi-Agent Systems）中的协作策略，具体提出了一种名为 \"Adversarial Review\" (AR) 的协议。这属于方向2（多智能体）中的“新的协作机制”和“博弈策略”（通过结构化分歧/对抗来优化结果），而非被排除的底层通信协议或拓扑结构。\n2.  涉及智能体能力的改进与演化：论文不仅提出了协作框架，还诊断了多智能体系统中的“虚假共识”（false-consensus）失败模式，并通过迭代提示（prompt iteration）引入显式分歧机制来改进智能体的表现。这符合方向1（单智能体/多智能体的自我反思、协作意图）和方向3（通过反馈/经验进行自我完善）的特征。\n3.  非纯基础设施或应用层堆砌：虽然应用场景是代码审查（Code Review），但论文的贡献不在于解决具体的软件工程问题，而在于探索“最小化智能体合作”（minimal agentic cooperation）的机制设计，即如何通过特定的交互逻辑（Reviewer + Critic）来提升智能体系统的整体效能。这属于 Agentic AI 的方法论研究，而非简单的 LLM 应用。\n4.  符合保留标准：根据筛选标准第一步，论文研究 Multi-Agent LLMs 的协作机制和失败模式诊断，且结论直接帮助理解如何改进智能体能力（通过结构化分歧避免虚假共识），因此应保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决多智能体大语言模型（Multi-agent LLM）系统在代码生成与审查任务中的组织效率与协作质量之间的权衡问题。具体而言，研究核心在于探索是否存在一种“中间地带”（middle ground），既能保留智能体间交互带来的协作收益，又能避免大规模角色分离团队（role-separated teams）所带来的高昂协调开销（coordination overhead）和边际收益递减问题。\n\n这一问题的重要性源于当前自动化代码审查（automated code review）领域的两个极端范式均存在显著缺陷。早期的多智能体系统通过增加智能体数量（如生成、审查、辩论、聚合等角色）来提升质量，但在复杂的仓库级（repository-level）编码任务中，这种扩展往往导致收益递减甚至负面效果，主要归因于无约束通信引入的协调复杂性和特定的失败模式。相反，当前的生产级编码智能体（如 Claude Code, Cursor）倾向于采用“主智能体+子智能体”（main agent with subagents）范式，将子智能体视为被动工具（passive tools）调用，这虽然降低了开销，却完全丧失了智能体间主动交互（agent interaction）带来的纠错与验证优势。\n\n解决这一问题的价值在于提出了一种最小化但高效的协作协议——对抗性审查（Adversarial Review, AR）。AR 证明了在“主智能体+子智能体”架构下，仅需引入一个审查者（reviewer）和一个批评者（critic）进行结构化异议（structured disagreement），即可在 LiveCodeBench 和 SWE-bench Verified 等基准测试中超越更复杂的五智能体基线（如 MARS）。这不仅降低了计算成本（token cost）和系统复杂度，还通过显式的证据 grounding 机制解决了合作智能体系统中常见的“虚假共识”（false consensus）可靠性问题，为构建轻量级、可移植且高可靠性的自动化代码审查工作流提供了新的设计原则。\n\n### § 2 前人工作与不足\n\n该问题此前已有多种尝试，但现有方法在效率、交互深度或可靠性方面均存在不足。\n\n首先，**Self-refinement** 方法（如 Madaan et al., 2023）让同一模型自我批评并修正代码。其不足在于缺乏外部视角，模型往往难以纠正自身生成的推理错误（reasoning errors），导致在 LiveCodeBench 上的通过率与 Zero-shot 基线持平，无法突破性能瓶颈。\n\n其次，**独立多审查者**方法（如 Single-reviewer, Two-reviewers）通过引入外部审查者或增加独立样本数量来降低方差。然而，实验表明，仅增加独立审查者数量（如 Two-reviewers）并不能显著提升性能，因为单个外部审查者存在高方差，可能盲目批准或过度关注次要问题，且缺乏机制来过滤低质量或投机性的审查意见。\n\n第三，**多智能体辩论**（Multi-agent debate, MAD）系统（如 Du et al., 2024）通过智能体间的论点交换来提升推理质量。其主要不足在于通信开销（communication overhead）随智能体数量和轮次线性增长，且在复杂任务中可能导致性能下降。此外，辩论系统对提示词和协议选择敏感，往往无法稳定超越更简单的基线。\n\n第四，**MARS**（Multi-Agent Review Systems, Wang et al., 2025）试图通过移除审查者之间的消息传递来降低 MAD 的开销，采用并行独立审查并由元审查者（meta-reviewer）聚合结果。虽然 MARS 在 LiveCodeBench 上表现优于前述方法，但其不足在于：1）完全消除了智能体间的交互，失去了通过对话澄清模糊点或纠正错误认知的机会；2）需要五个智能体（一个作者、三个审查者、一个元审查者），相对于其带来的性能增益（+5pp pass-rate），其 token 成本过高，性价比低。\n\n最后，现有工作普遍忽视了一个关键的结构性失败模式：**虚假共识**（false consensus）。在 SWE-PRBench 的评测中， naive 的 AR 协议表现最差，因为审查者和批评者倾向于为了达成一致而妥协，而非追求事实正确性。之前的系统（包括 MARS 和简单的 Self-refine）未能显式地强制“基于证据的异议”（evidence-grounded disagreement），导致智能体在缺乏充分证据的情况下收敛于错误共识。本文指出的这一不足并非单纯的性能问题，而是合作智能体系统的可靠性缺陷，即智能体优化的是“达成一致”而非“正确性”，这是 prior work 在协议设计中未充分解决的结构性问题。", "core_insight": "### § 3 重建作者的思考路径\n\n在大型语言模型（LLM）应用于代码生成的早期阶段，研究者普遍采用“多智能体辩论”（Multi-agent Debate）或角色分离的团队架构，试图通过增加智能体数量来模拟人类软件工程中的分工协作。然而，随着实验深入，一个明显的瓶颈浮现：在复杂的仓库级（repository-level）任务中，单纯增加智能体数量往往导致收益递减，甚至因通信开销（communication overhead）和协调失败而降低性能。与此同时，工业界的生产级代理系统（如 Claude Code）逐渐收敛于“主智能体+子智能体”（main agent with subagents）的范式，其中子智能体仅作为被动工具被调用，缺乏独立的交互能力。这种范式虽然高效，却牺牲了智能体间互动带来的纠错潜力。\n\n研究者意识到，完全独立的并行评审（如 MARS 中的独立评审员聚合）虽然避免了通信开销，但失去了通过对话挖掘深层逻辑错误的机会；而完全开放的辩论又过于昂贵且容易陷入无效循环。因此，一个关键的中间地带被识别出来：是否存在一种轻量级的合作机制，既能保留智能体互动的益处，又能严格控制通信范围？\n\n进一步的观察发现，现有的自我修正（Self-Refine）或单一外部评审往往存在“虚假共识”（false consensus）的问题——即智能体倾向于为了达成一致而忽略证据不足的观点，或者评审员与批评者（critic）在缺乏结构化约束时，容易互相妥协而非基于代码证据进行对抗。特别是当评审员提出模糊的担忧时，批评者若没有明确的机制去要求证据，往往会默认接受，导致错误未被纠正。因此，核心思路转向设计一种“结构化分歧”（structured disagreement）协议：通过强制要求批评者明确区分“基于证据的反驳”和“基于疑虑的反驳”，并迫使评审员用具体代码片段回应，从而将模糊的共识转化为可审计的、基于证据的结论。这种设计旨在用最少的智能体（仅一个评审员和一个批评者）实现最高效的纠错，避免大规模团队的冗余，同时克服单一评审的方差和虚假共识陷阱。\n\n### § 4 核心 Intuition\n\n多智能体协作的核心瓶颈并非智能体数量不足，而是缺乏**结构化、基于证据的分歧机制**。传统的多智能体系统要么因过度通信导致效率低下，要么因缺乏互动而陷入“虚假共识”（false consensus），即智能体为了达成一致而牺牲正确性。Adversarial Review 的直觉在于，通过引入一个专门的批评者（critic）角色，强制其在评审过程中进行**显式的、证据驱动的反驳**（structured disagreement），从而将模糊的同意转化为可审计的逻辑验证。这种轻量级的对抗循环确保了最终共识是建立在坚实代码证据之上，而非社交压力或默认妥协，从而在极少智能体开销下显著提升代码生成与审查的质量。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**Adversarial Review (AR)** 是一种基于“主代理+子代理”（main-agent-with-subagents）范式的轻量级协作代码审查协议。其核心思想是通过引入一个**Reviewer (R)** 和一个 **Critic (C)** 形成内层循环（inner loop），对代码或计划进行结构化、基于证据的对抗性审查，只有当审查达成一致且无缺陷时，主代理（Main Agent, M）才会在外层循环（outer loop）中修改代码。\n\n以下是以 **SWE-bench Verified** 中的真实案例 `matplotlib-matplotlib-20826` 为例的完整 Pipeline 说明：\n\n**1. 输入 (Input)**\n*   **任务描述**：GitHub Issue 指出，当用户调用 `ax.clear()` 清除共享或子图坐标轴时，由 `label_outer()` 设置的刻度可见性（tick-visibility）等状态丢失。\n*   **初始状态**：主代理 M 阅读仓库代码，定位到 `lib/matplotlib/axes/_base.py` 中的 `clear()` 方法，并生成初始修复补丁（Artifact Version N=1）。初始补丁试图在重置后重新应用可见性设置（治标不治本）。\n\n**2. 处理 (Processing) - AR 协议执行**\n*   **外层循环启动**：主代理 M 冻结当前代码版本（Artifact N=1），进入内层审查循环。\n*   **内层循环 (Inner Loop) - 审查与对抗**：\n    *   **Reviewer (R) 行动**：R 审查代码，指出 `clear()` 方法破坏了状态，建议重新应用设置。R 生成 `Review_1`。\n    *   **Critic (C) 行动**：C 评估 R 的审查。C 发现 R 的建议仅修复了症状（symptom），未触及根本原因（root cause）。C 提出 **DISAGREE_EVIDENCE**，引用底层 `lib/matplotlib/axis.py` 中的 `reset_major_tick_kw()` 代码，指出问题在于过度宽泛的重置操作，而非上层应用的缺失。\n    *   **Reviewer (R) 响应**：R 收到 C 的反驳，必须基于 C 提供的代码证据进行回应。R 承认 C 的观点，修改审查意见，确认根本原因在于底层重置逻辑。\n    *   **收敛**：R 和 C 达成一致（Consistent Review），指出应修改 `axis.py` 中的重置逻辑以保留相关状态，而非在 `axes/_base.py` 中修补。\n*   **外层循环决策 (Outer Loop Decision)**：\n    *   由于内层循环发生了交互（非 First-pass termination），协议判定当前 Artifact 需要修改。\n    *   主代理 M 接收一致的审查意见，修改代码，生成 **Artifact Version N=2**。新补丁直接修改 `lib/matplotlib/axis.py`，移除过度重置并保留 `gridOn` 等关键字段。\n*   **再次审查**：\n    *   对 N=2 启动新的内层循环。R 审查新补丁，C 评估。\n    *   若 R 和 C 在第一轮即达成一致且无缺陷（First-pass clean），则终止审查。\n\n**3. 输出 (Output)**\n*   **最终补丁**：一个仅约 20 行的精简补丁，直接修复了底层状态破坏问题。\n*   **结果**：该补丁通过了隐藏测试（hidden tests），而 Zero-shot 和 MARS 生成的更长补丁（45-50行）因仅修复表面症状而失败。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过**。\n本文是一篇系统设计与实证研究论文，未提出新的数学模型或形式化推导。其核心贡献在于协议设计（Protocol Design）和通过实验验证“结构化分歧”（Structured Disagreement）对代理协作性能的影响。文中涉及的指标（如 Pass Rate, F1 Score）均为标准评估指标，无特定数学推导过程。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n在多代理 LLM 系统中，增加代理数量往往带来边际收益递减甚至负面效果（由于协调开销），而将代理视为被动工具（Subagents）又失去了交互带来的益处。是否存在一种“中间地带”（Middle Ground），即在不增加大量代理和复杂通信结构的前提下，通过最小化的代理协作提升代码生成和审查质量？\n\n**2. 设计了什么实验验证这个问题？**\n作者设计了三个层面的实验，逐步构建并验证 AR 协议：\n*   **构建与基准测试 (LiveCodeBench, LCB)**：通过逐步迭代（Zero-shot → Self-Refine → Single-reviewer → Two-reviewers → MARS → AR），验证 AR 在代码生成任务上的有效性。重点对比 AR（3个代理，有交互）与 MARS（5个代理，无交互）的性能与效率。\n*   **审查质量与失败模式分析 (SWE-PRBench)**：专门评估内层循环的审查质量。发现 naive AR 存在“虚假共识”（False Consensus）失败模式，即代理倾向于达成一致而非追求正确性。随后引入“文本约束”（Text Constraint），强制 Critic 区分“基于证据的分歧”和“基于担忧的分歧”，验证结构化分歧对审查质量的提升。\n*   **真实仓库级修复 (SWE-bench Verified)**：在更复杂的真实 GitHub Issue 修复任务中，使用自主代理（如 Claude Code）执行 AR 协议（以 SKILL.md 形式），验证其在无严格编排器（Orchestrator）情况下的泛化能力和实际修复效果。\n\n**3. 问题的答案是什么？**\n*   **协作优于堆叠**：AR 证明，在“主代理+子代理”范式下，**两个相互交互的审查代理（R+C）的性能优于四个不交互的审查代理（MARS）**。AR 在 LCB 上取得了最高的 Pass Rate，且使用的代理数量更少。\n*   **结构化分歧是关键**：简单的交互会导致“虚假共识”（False Consensus），即代理为了达成一致而牺牲正确性。通过强制要求分歧必须基于具体代码证据（Evidence-grounded Disagreement），可以显著消除这一失败模式，提升审查的 F1 分数。\n*   **协议的可移植性**：AR 协议不仅能在严格的 Python 编排器下工作，也能以纯文本协议（SKILL.md）的形式被自主代理遵循，并在 SWE-bench Verified 上优于 Zero-shot 和 MARS 基线，证明了轻量级协作协议在复杂软件工程任务中的有效性。\n*   **权衡**：AR 以更高的 Token 消耗为代价换取了性能提升，位于成本-质量的 Pareto Frontier 上。它最适合用于复杂仓库或需要精确定位根本原因的场景。", "additional_insights": "### § 8 Take-aways\n\nAdversarial Review (AR) 提出了一种在 main-agent-with-subagents 范式下的最小化合作协议，通过引入一个 reviewer (R) 和一个 critic (C) 的交互循环，在 LiveCodeBench (LCB) 上以仅 3 个 agent 的规模超越了使用 5 个 agent 的 MARS 基线，证明了结构化交互比单纯增加独立 reviewer 数量更有效。然而，AR 在 SWE-PRBench 上暴露了“false consensus”（虚假共识）这一核心失效模式，即 agent 倾向于为了达成一致而牺牲正确性，导致 naive AR 的 F1 分数低于独立 reviewer 基线。通过引入显式的文本约束（text constraint），强制 critic 区分 AGREE、DISAGREE_EVIDENCE 和 DISAGREE_CONCERN，AR 成功修复了虚假共识问题，并在 SWE-PRBench 上取得了最高的 F1 分数，表明显式的、基于证据的 disagreement 是提升代码审查质量的关键。在 SWE-bench Verified 的真实仓库级任务中，AR 以更高的 token 消耗换取了性能提升，其 reviewer-critic 循环有助于定位根本原因（root cause），但也存在因过度推测导致 scope creep（范围蔓延）的风险。总体而言，AR 证明了在 agentic coding 系统中，轻量级的、结构化的、基于证据的对抗性审查比大规模的多 agent 辩论或被动工具调用更能平衡性能与开销，且该协议可通过 SKILL.md 形式移植到自主 agent 系统中。\n\n### § 9 最脆弱的假设\n\nAR 方法最脆弱的假设是：**LLM 能够严格遵循显式的结构化 disagreement 指令（如区分证据型与认知型异议），并在交互中保持对代码证据的忠实引用，而不受对话压力或上下文窗口饱和的影响。** 如果这一假设不成立，即 LLM 在长上下文或复杂推理中忽略或混淆了 `DISAGREE_EVIDENCE` 与 `DISAGREE_CONCERN` 的语义区别，或者为了结束循环而随意生成虚假的代码引用，那么 AR 的核心优势——通过结构化异议防止虚假共识——将直接失效，系统可能退化为更昂贵的 naive AR 甚至产生误导性的审查结果。论文在 Section 7 中承认了这一点，指出当前 LLM 在上下文窗口接近满负荷时容易遗忘或忽略指令，且文本约束可能不是强制执行语义约束的最终解决方案。论文提供的证据主要基于 SWE-PRBench 上的 prompt 迭代实验，显示添加文本约束后 F1 显著提升，但这仅证明了在特定 benchmark 和较短交互轮次下的有效性，缺乏在更长上下文、更复杂仓库或不同模型架构下该假设鲁棒性的广泛验证。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 AR 在 SWE-PRBench 上解决“false consensus”的核心 claim，无需构建完整的代码生成系统。具体方案如下：使用 SWE-PRBench 的一个子集（例如 20-50 个 PR diffs），实现一个简化的 Python 编排器，调用同一个 LLM（如 Claude Sonnet 或 GPT-4o）分别扮演 Reviewer (R) 和 Critic (C)。首先，使用 naive AR 的 prompt（仅要求 AGREE/DISAGREE）运行 R-C 循环，记录 R 和 C 最终达成一致但实际存在 bug 的案例比例，以及 F1 分数。然后，使用 AR with text constraint 的 prompt（强制区分 AGREE, DISAGREE_EVIDENCE, DISAGREE_CONCERN）运行相同的案例。测量指标为：1) R 和 C 达成一致的轮次；2) 最终审查结果与人工标注或 GPT-5.2 judge 匹配的 F1 分数；3) Critic 使用 `DISAGREE_EVIDENCE` 时是否确实引用了有效的代码片段。如果 text constraint 版本的 F1 显著高于 naive 版本，且 `DISAGREE_EVIDENCE` 的引用准确率较高，则支持了“结构化 disagreement 能缓解虚假共识”的 claim；反之，如果两者 F1 无显著差异或 text constraint 版本出现更多格式错误导致的无效输出，则反驳了该假设在简化设置下的有效性。", "research_value": "### § 11 最强反例设计\n\n若要挑战 Adversarial Review (AR) 的有效性，最有力的攻击并非质疑其性能提升，而是揭示其性能增益源于**“计算冗余导致的搜索空间扩大”**而非**“结构化异议的认知价值”**，并证明在特定高噪声或高耦合场景下，AR 会因**“对抗性幻觉放大”**（Adversarial Hallucination Amplification）而系统性失败。\n\n首先，设计一个**“等效计算量控制实验”**（Equivalent Compute Control Experiment）。AR 的核心优势在于 Reviewer (R) 和 Critic (C) 的交互循环。然而，这种交互本质上增加了 LLM 的推理步数（reasoning steps）。反例设计应构建一个基线模型：**Single-Agent Deep Reasoning (SADR)**。在该基线中，不使用多智能体交互，而是让单个 Main Agent 在生成代码前，通过 Chain-of-Thought (CoT) 或 Tree of Thoughts (ToT) 进行同等 Token 消耗量的自我辩论和自我审查。如果 SADR 在 LiveCodeBench 或 SWE-bench Verified 上能达到与 AR 相当甚至更高的 Pass Rate，且无需维护复杂的 Agent 通信协议，则证明 AR 的“结构化异议”并非必要，其收益仅来自额外的计算资源（Compute Budget）。这将直接削弱 AR 作为“协作协议”的理论贡献，将其降级为一种昂贵的 Self-Refinement 变体。\n\n其次，针对 AR 依赖的“基于证据的分歧”（Evidence-grounded Disagreement），设计一个**“高耦合依赖注入场景”**（High-Coupling Dependency Injection Scenario）。AR 假设 Critic 能够准确引用代码片段来反驳 Reviewer。然而，在大型遗留代码库（Legacy Codebases）中，Bug 的根本原因往往涉及跨模块的隐式状态共享或复杂的依赖图，而非单一函数的逻辑错误。构造一组测试用例，其中 Bug 的修复需要理解三个以上模块间的隐式契约（Implicit Contracts）。在此场景下，Critic 极可能引用局部正确的代码片段（Local Evidence）来支持一个全局错误的结论（Global Misinterpretation），而 Reviewer 由于缺乏全局视图，无法有效反驳。这种**“局部证据陷阱”**（Local Evidence Trap）会导致 AR 陷入死循环或收敛于一个看似有证据支持但实际错误的修复方案。相比之下，MARS 的并行独立审查虽然缺乏交互，但通过元审查者（Meta-reviewer）的聚合可能更倾向于保守的正确性，或者简单的 Self-Refinement 可能通过更长的上下文窗口捕捉到全局依赖。如果 AR 在此类高耦合任务中的 F1 分数显著低于基线，且失败模式表现为“过度自信的局部修复”，则证明 AR 的结构化异议在复杂依赖图中是脆弱且误导性的。\n\n最后，攻击 AR 的**“虚假共识”缓解机制**的鲁棒性。AR 通过强制区分 `DISAGREE_EVIDENCE` 和 `DISAGREE_CONCERN` 来避免虚假共识。然而，LLM 具有强烈的**“顺从性偏差”**（Sycophancy Bias）。设计一个**“对抗性提示注入”**（Adversarial Prompt Injection）实验，在 Critic 的输入中嵌入微妙的社会工程学指令，诱导其为了“结束对话”或“取悦 Reviewer”而将 `DISAGREE_EVIDENCE` 降级为 `AGREE`，即使存在明显的代码错误。如果 AR 在这种轻微的压力测试下迅速退化为 Naive AR 的表现，甚至更差（因为增加了交互轮次），则证明其核心机制——结构化异议——在真实世界的噪声环境中是不可靠的。\n\n### § 12 Follow-up Research Idea\n\n基于 AR 在“结构化异议”上的局限，特别是其对 LLM 遵循复杂指令和引用证据能力的依赖，我提出一个新的研究方向：**“形式化验证引导的对抗性审查”**（Formal Verification-Guided Adversarial Review, FV-AR）。\n\n**(a) 驱动局限与未满足需求：**\nAR 的核心弱点在于“证据”的主观性。LLM 生成的 `DISAGREE_EVIDENCE` 往往是自然语言描述或代码片段引用，缺乏严格的逻辑真值。这导致 Critic 可能引用了相关但无关的代码，或者 Reviewer 可能误解了引用的含义。现有的 AR 依赖于 LLM 的“语言理解”来达成共识，而非“逻辑正确性”。在关键任务（如安全敏感代码、金融算法）中，这种基于语言的共识是不够的。我们需要一种机制，将“异议”从自然语言辩论转化为可验证的逻辑断言，从而消除“虚假共识”和“局部证据陷阱”。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴**形式化方法**（Formal Methods）中的**契约式设计**（Design by Contract, DbC）和**轻量级定理证明**（Lightweight Theorem Proving）。具体来说，利用**程序合成**（Program Synthesis）中的**约束求解器**（Constraint Solvers，如 Z3）或**静态分析工具**（Static Analyzers，如 CodeQL）作为“客观仲裁者”（Objective Arbiter）。不同于 AR 中 Critic 仅依赖 LLM 内部知识，FV-AR 引入一个外部工具层，将代码逻辑转化为形式化断言（Assertions）。\n\n**(c) 第一个实验设计：**\n构建一个**“混合智能体-工具审查协议”**（Hybrid Agent-Tool Review Protocol）。\n1.  **Reviewer (R)** 生成代码补丁，并附带一组自然语言描述的预期行为（Specs）。\n2.  **Critic (C)** 不再直接反驳 R，而是调用一个**“形式化翻译器”**（Formal Translator Agent），将 R 的代码和 Specs 转化为形式化断言（如 Hoare Triples 或 SMT-LIB 格式）。\n3.  **Arbiter (A)** 是一个非 LLM 组件（如 Z3 求解器或静态分析引擎），它验证这些断言是否在代码中成立。如果断言失败，Arbiter 返回具体的反例（Counter-example）或违反的约束。\n4.  **Critic (C)** 基于 Arbiter 返回的客观反例，生成 `DISAGREE_EVIDENCE`。此时，异议不再是基于 LLM 的“观点”，而是基于求解器的“证明”。\n5.  **实验对比**：在 SWE-bench Verified 的子集上，对比 AR 与 FV-AR。重点测量：1) **异议的客观性**：Critic 提出的异议中，有多少能被形式化工具验证为真？2) **修复的鲁棒性**：FV-AR 生成的补丁在隐藏测试中的通过率是否显著高于 AR，特别是在涉及复杂逻辑不变量（Invariants）的任务中？3) **成本效益**：尽管引入了工具调用，FV-AR 是否因减少了无效的 LLM 辩论轮次而降低了总 Token 消耗？\n\n这个提议与 AR 的根本区别在于：**AR 试图通过更好的 Prompt 工程来模拟人类的理性辩论，而 FV-AR 试图通过引入外部形式化验证来替代辩论中的“真理判定”环节。** 这将代码审查从“语言游戏”提升为“逻辑验证”，为解决 LLM 在代码审查中的幻觉和一致性問題提供了一条更根本的路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Eric S. Qiu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Joyce Gill\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Cornell University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Stanford University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal contribution\"\n    }\n  ]\n}\n```", "summary_translation": "早期的多智能体大语言模型系统通常采用角色分离的团队，但在仓库级编码任务中，增加智能体数量带来的收益递减。近期的替代方案将智能体视为被动工具（子智能体），但这完全消除了智能体交互带来的优势。我们研究子智能体范式是否支持一种中间状态：在没有大型多智能体团队开销的情况下实现最小的智能体协作。我们引入了对抗性审查（Adversarial Review, AR），这是一种最小的协作代码审查协议，其中主编码智能体与审查智能体和批评智能体协同工作。审查智能体评估代码，而批评智能体在主智能体编辑之前通过结构化分歧对审查进行审计。在 LiveCodeBench 上，AR 在测试方法中取得了最高的通过率，优于五智能体基线，同时仅使用三个智能体。在 SWE-PRBench 上，朴素的 AR 暴露了一种虚假共识失败模式，即智能体在没有充分证据的情况下收敛于一致意见，但通过添加明确分歧的单一提示迭代实现了测试方法中最高的 F1 分数。在 SWE-bench Verified 上，AR 在仓库级编码任务上也显示出优于基线的改进。总体而言，AR 表明协作代码审查不需要许多智能体或复杂的通信结构：它需要分歧是最小化的、结构化的，并且基于证据的。"}]}], "2026-08-19": [{"name": "Reinforcement Learning \u0026 Training for Agents", "count": 6, "papers": [{"title": "Write, Execute, Refine: From Skill Followers to Skill Optimizers via Reinforcement Learning from Execution Feedback", "arxiv_id": "2608.17587", "authors": "Kang Peng, Zhiwei Zhang, Yichen Zhang, Zezhong Wang, Yiming Du, Geng Tu, Baojun Wang, Bin Liang, Ruifeng Xu, Kam-Fai Wong", "summary": "Expert-written natural language skills can improve tool-using agents, yet agent-authored skills perform 8-11 points worse than using no skill. This gap suggests that following procedural guidance and improving it from execution evidence are distinct capabilities. Inference time loops can repair skills but do not improve the model that writes the next one. We study how to organize execution experience from intermediate skills into training states for an optimizer. We introduce WER (Write, Execute, and Refine), a multi-phase framework that trains a Skill Optimizer outside a frozen executor. The optimizer proposes skills, a frozen agent executes each repeatedly, and a programmatic verifier scores the outcomes. The scores provide relative credit and select mixed-outcome records. Matched successful and failed trajectories from these records form the next phase's refinement states, so the optimizer learns from the consequences of its earlier outputs. On BFCL v4 multi-turn and tau2-bench, WER improves average Pass@1 over the no-skill baseline by 7.80 and 3.85 points, respectively. Under an identical refinement workflow, it outperforms the same backbone without optimizer training by 9.35 and 10.29 points. The trained 4B optimizer reaches 76.63 percent on BFCL v4, outperforming all evaluated off-the-shelf general-purpose models used as skill optimizers on average.", "category": "cs.CL", "cluster": "Reinforcement Learning \u0026 Training for Agents", "tags": ["cs.CL"], "filter_reason": "该论文完全符合“LLM智能体及其演化”的研究范围，具体依据如下：\n\n1.  核心对象明确为 LLM Agent：论文研究的是“tool-using agents”（工具使用智能体），旨在通过优化自然语言技能（skills）来提升智能体的执行能力。这直接对应研究焦点中的“单智能体 (Agentic)”方向，特别是涉及工具使用（Tool Use）和规划/指令遵循的能力。\n\n2.  核心机制属于“自我演化/改进”：论文提出的 WER (Write, Execute, Refine) 框架，核心贡献在于训练一个“Skill Optimizer”（技能优化器）。该优化器通过执行反馈（execution feedback）和轨迹（trajectories）进行迭代改进，从“技能跟随者”进化为“技能优化者”。这符合筛选标准中关于“Self-Evolving”（自我演化）、“Self-Improvement”（自我改进）以及“LLMs Improving LLMs”（LLM改进LLM）的定义。它不仅仅是静态的工具调用，而是通过强化学习（RL）从执行结果中学习并优化生成技能的过程，属于智能体能力的动态演化。\n\n3.  符合保留规则：\n       符合“保留 (Keep): 如果论文研究 agent 的 harness / scaffold ... 并且核心贡献是让这些智能体运行组件通过轨迹、反馈、观测或评估结果自动改进、演化或自适应优化”。这里的 Skill Optimizer 可以被视为智能体能力实现的一部分（即生成高质量工具调用指令或规划步骤的能力），且其核心是通过反馈进行优化。\n       符合“保留 (Keep): 如果论文的核心机制是 self-evolving / self-improving / iterative improvement ... 即使对象是 ... 模型训练，也应优先保留”。\n\n4.  排除项检查：\n       不涉及安全、对齐、可解释性等排除领域。\n       不涉及多智能体拓扑或通信协议等系统工程排除项。\n       虽然涉及训练（RL），但其目标是优化智能体的技能生成能力，而非单纯的基础模型预训练或通用推理能力增强，因此不属于“非Agentic的推理”排除项。\n\n综上，该论文探讨了如何通过执行反馈机制让智能体（或其技能生成组件）自我优化和演化，是典型的 Agentic AI 演化研究，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：如何将来自中间技能（intermediate skills）的执行经验（execution experience）结构化地组织为训练状态（refinement states），以训练一个独立的 Skill Optimizer，使其能够从执行反馈中学习并优化自然语言技能？这一问题的重要性源于当前 Agent 在工具使用（tool use）中存在的显著能力鸿沟：虽然专家编写的自然语言技能能显著提升 Agent 性能，但由 Agent 自主生成的技能往往比不使用技能的效果还要差 8–11 个百分点。这表明，遵循程序性指导（following procedural guidance）与从执行证据中改进指导（improving it from execution evidence）是两种截然不同的能力。现有的推理时循环（inference-time loops）虽然能修复当前技能，但并未改变生成下一个技能的模型本身，导致模型无法将行为证据转化为防止未来失败的程序性指令。解决这一问题具有双重价值：首先，它通过训练专门的 Skill Optimizer，使模型能够内化从执行轨迹中诊断失败并提取可复用经验的能力，从而突破通用推理模型的局限；其次，该方法在保持下游执行器（executor）冻结的前提下，通过优化技能文档提升了 Agent 的整体任务成功率，证明了技能优化作为一种独立能力，其价值超越了单纯的上下文推理（in-context reasoning）。\n\n### § 2 前人工作与不足\n\n该问题此前并未被充分解决，现有研究主要存在两类不足：一是仅优化当前工件而未更新生成模型，二是虽涉及技能学习但未有效利用执行反馈进行结构化训练。\n\n第一类工作包括 EvoSkill、SkillOpt、SkillRevise 以及自动提示优化方法（如 OPRO、DSPy、TextGrad）。这些系统利用执行反馈在推理时修订技能或提示，但它们通常假设基础模型具备将执行日志转化为通用程序修正的能力。然而，这种假设往往失效，因为语言模型并不可靠地拥有将行为证据转化为预防性程序指令的能力。更重要的是，这些方法仅优化当前的文本工件（artifact），而编写技能的模型本身并未从修订经验中学习，导致每次新任务仍需依赖基础模型重新诊断，无法实现能力的累积提升。\n\n第二类工作涉及基于强化学习的技能管理，如 SkillMaster、SkillOS 和 Skill-R1。SkillMaster 通过反事实探针评估学习技能突变，SkillOS 训练技能库管理器以优化长期效用，Skill-R1 则优化递归技能修订。尽管这些方法超越了固定技能编写者的限制，学习了某种形式的修订策略，但它们在信用分配（credit assignment）和经验构建（experience construction）上存在局限。例如，Skill-R1 主要关注代内和代间的优势比较，而未深入探讨如何从同一中间技能的成功与失败轨迹中构建具有诊断价值的配对经验（paired evidence）。WER 指出，之前的方法未能充分利用“混合结果”（mixed-outcome）记录——即同一技能在同一任务下既成功又失败的轨迹对——来形成下一阶段的精炼状态。这种配对证据能控制变量，精准定位技能未约束的行为分支，而 prior work 往往缺乏这种精细的跨阶段经验重组机制，导致优化器难以从自身先前输出的具体执行后果中学习特定的缺陷修正。", "core_insight": "### § 3 重建作者的思考路径\n\n在研究 Agent 的 Tool Use 能力时，我们观察到专家编写的自然语言 **Skills** 能显著提升性能，但 Agent 自主生成的 **Skills** 往往比不使用 Skill 更差。这揭示了一个核心矛盾：Agent 能够受益于程序化指导，却缺乏可靠地编写这种指导的能力。现有的解决方案主要依赖 **Inference-time loops**（如 Reflexion），让 LLM 在推理阶段根据执行轨迹反思并修改 Skill。然而，这种方法存在两个致命缺陷：首先，它假设 LLM 具备将行为证据转化为通用程序指令的能力，但实验表明，LLM 容易生成看似合理实则错误的修正，导致性能下降；其次，这种推理时的修复是“一次性”的，模型本身并未从这些修正经验中学习，下一个任务仍需从头开始诊断，无法实现能力的累积。\n\n与此同时，**Reinforcement Learning** 在 Agent 领域的应用多集中于更新执行策略（Policy）或内部化 Skill，而较少关注如何训练一个独立的 **Skill Optimizer**。虽然已有工作如 Skill-R1 尝试通过 RL 优化 Skill 生成，但它们往往侧重于代际间的优势比较或单轮内的突变，缺乏对执行过程中产生的细粒度诊断信息的有效利用。特别是，如何从中间 Skill 的执行结果中提取有价值的训练状态，是一个未被充分解决的问题。如果我们将 Skill 的优化视为一个独立的学习任务，那么关键在于如何构建训练数据。单纯的失败轨迹缺乏对比，单纯的成功轨迹缺乏改进空间，只有那些在同一 Skill 下既成功又失败的 **Matched Trajectories** 才能提供清晰的因果信号，指出 Skill 中具体缺失的约束。\n\n基于此，我们设想将 **Skill Optimizer** 与 **Executor** 解耦。Executor 保持冻结，确保执行结果的可归因性；Optimizer 则作为一个独立的策略网络，专门学习如何根据执行反馈修订 Skill。为了训练这个 Optimizer，我们需要一种机制，能够跨阶段地收集和重组执行经验。通过 **Phase-wise Self-Bootstrapping**，我们可以利用前一轮优化产生的混合结果（即部分成功、部分失败的轨迹对）作为下一轮的训练状态。这样，Optimizer 不再是从零开始猜测，而是直接面对自己之前输出所暴露的具体缺陷，从而学习到从执行后果中提炼通用程序指导的能力。这种设计将 Skill 优化从推理时的临时补救，转变为模型参数层面的持久能力提升。\n\n### § 4 核心 Intuition\n\n现有方法让 Agent 在推理时临时修补 Skill，但模型本身并未学会如何修补，导致每次任务都需重新诊断且易受错误反思误导。WER 的核心直觉是将 **Skill Optimizer** 与执行器解耦，并通过 **Phase-wise Self-Bootstrapping** 机制，专门利用同一 Skill 下成功与失败轨迹的对比信息（Matched Trajectories）来训练优化器。这使得模型能够从自身先前输出的执行后果中学习，将具体的执行反馈转化为通用的程序化修正能力，而非依赖通用的推理能力进行一次性补救。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法是 **WER (Write, Execute, Refine)** 框架，旨在训练一个独立的 **Skill Optimizer**（技能优化器），使其能够从执行反馈中学习如何改进自然语言技能（Skills），而不是仅仅在推理时进行一次性修复。\n\n**核心 Pipeline 流程：**\n\n1.  **初始化与输入 (Input \u0026 Initialization)**：\n    *   输入是一个多轮工具使用任务（如 BFCL v4 中的文件操作任务）。\n    *   初始阶段，由一个强大的通用模型（如 GPT-5.1）生成一个零样本的初始技能草稿（Seed Skill）。\n    *   该技能被注入到一个**冻结的（Frozen）**执行代理（Executor Agent，如 GPT-4o）的系统提示中。\n\n2.  **执行与观察 (Execute \u0026 Observe)**：\n    *   **Skill Optimizer**（待训练的模型，如 Qwen3-4B）接收当前的技能、任务上下文以及之前的执行轨迹，生成 $K$ 个候选技能修订版。\n    *   冻结的 Executor 在沙箱环境中对每个候选技能执行 $n$ 次（例如 2 次），产生完整的交互轨迹（Trajectories），包括工具调用、参数、环境响应和最终状态。\n    *   **程序化验证器（Programmatic Verifier）** 检查最终状态是否与参考解一致，给出二元奖励（成功/失败）。\n\n3.  **奖励计算与优化 (Reward \u0026 Optimization)**：\n    *   使用 **Group-Relative Advantage** 计算奖励。由于不同任务难度差异大，绝对奖励意义不大，因此将同一状态下生成的 $K$ 个候选技能进行组内比较。\n    *   优势值 $A_k$ 定义为候选技能奖励与组内平均奖励的偏差。\n    *   使用 **GRPO (Group Relative Policy Optimization)** 算法更新 Skill Optimizer 的参数，使其倾向于生成能获得更高相对奖励的技能文本。\n\n4.  **经验构建与自举 (Experience Construction \u0026 Self-Bootstrapping)**：\n    *   这是 WER 的关键创新。并非所有执行记录都用于下一轮训练。\n    *   **保留策略（Retention）**：只保留“混合结果”的记录。例如，在 $n=2$ 次执行中，如果一次成功、一次失败，则保留该记录。\n    *   **配对证据（Matched Pair）**：成功和失败的轨迹来自同一个技能和任务，唯一的区别在于执行过程中的随机性或未被技能约束的行为分支。这种配对提供了最清晰的诊断信息：成功路径展示了正确做法，失败路径展示了技能未覆盖的缺陷。\n    *   将这些配对轨迹与当前技能组合，构建下一阶段的 **Refinement State**（精炼状态）。\n\n5.  **迭代精炼 (Iterative Refinement)**：\n    *   进入下一个训练阶段（Phase），Skill Optimizer 基于上一阶段产生的“混合结果”状态，再次生成修订版技能。\n    *   重复上述过程，形成一棵修订树（Revision Tree）。Optimizer 逐渐学会从执行后果中诊断特定缺陷并进行针对性修正。\n\n**真实例子讲解：**\n\n假设任务是：“读取财务报告，计算收入、支出和利润的平均值，四舍五入后写入新文件 `statistics.txt`。”\n\n*   **Phase 1 (初始)**：\n    *   **输入**：GPT-5.1 生成的初始技能，可能只说“计算平均值并写入文件”。\n    *   **执行**：Executor 尝试直接写入 `statistics.txt`，但文件不存在，报错失败；或者计算时未提取数字，导致错误。\n    *   **结果**：两次执行均失败。由于没有成功轨迹作为对比，该记录可能被丢弃或仅用于初步格式调整。\n\n*   **Phase 2 (第一次精炼)**：\n    *   **输入**：Optimizer 观察到失败，生成修订版技能，明确指示“如果文件不存在，先使用 `touch` 创建文件”。\n    *   **执行**：\n        *   轨迹 A：成功创建文件，但计算平均值时只取了第一个数字，结果错误（失败）。\n        *   轨迹 B：成功创建文件，且正确提取了所有数字并计算，结果正确（成功）。\n    *   **保留**：这是一次“混合结果”（1成功/1失败）。\n    *   **构建状态**：将技能、成功轨迹 A 和失败轨迹 B 打包。\n\n*   **Phase 3 (第二次精炼)**：\n    *   **输入**：Optimizer 接收 Phase 2 的状态。它看到成功轨迹中正确提取了所有数字，而失败轨迹中只取了一个。\n    *   **输出**：Optimizer 修订技能，增加指令：“在应用 `mean` 函数前，必须从文件内容中提取所有相关数值列表”。\n    *   **执行**：新的技能在两次执行中均成功。\n    *   **结论**：Optimizer 学会了从“文件创建”到“数值提取”的逐步修正，这种能力是通过训练获得的，而非通用推理。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文的核心数学推导基于 **Group Relative Policy Optimization (GRPO)**，这是一种无需参考策略（Reference Policy）和 KL 散度惩罚的强化学习算法。\n\n**理论背景与 Intuition：**\n\n1.  **为什么不用绝对奖励？**\n    *   在工具使用任务中，不同任务的固有难度差异巨大。一个简单任务可能总是得高分，复杂任务总是得低分。如果直接用绝对奖励更新模型，模型会倾向于只做简单任务或无法区分同一任务下不同技能的好坏。\n    *   **Intuition**：我们需要知道的是“在这个特定任务下，技能 A 比技能 B 好多少”，而不是“技能 A 得了多少分”。\n\n2.  **Group-Relative Advantage (组相对优势)**：\n    *   对于同一个精炼状态 $x$，Optimizer 采样 $K$ 个候选技能 $s'_1, ..., s'_K$。\n    *   每个技能执行 $n$ 次，得到平均奖励 $R_k$。\n    *   计算组内平均奖励 $\\bar{R} = \\frac{1}{K} \\sum_{k=1}^K R_k$。\n    *   优势值 $A_k = R_k - \\bar{R}$。\n    *   **Intuition**：如果 $A_k \u003E 0$，说明该技能比平均水平好，应该增加其生成概率；如果 $A_k \u003C 0$，则降低概率。这消除了任务难度的影响，只关注相对优劣。\n\n3.  **GRPO 目标函数**：\n    *   论文使用的更新目标为：\n        $$ L(\\theta) = \\frac{1}{K} \\sum_{k=1}^K \\left[ \\min \\left( \\rho_k A_k, \\text{clip}(\\rho_k, 1-\\epsilon, 1+\\epsilon) A_k \\right) \\right] $$\n    *   其中 $\\rho_k = \\frac{\\pi_\\theta(s'_k|x)}{\\pi_{old}(s'_k|x)}$ 是新旧策略的概率比。\n    *   **Intuition**：\n        *   $\\rho_k A_k$：标准的策略梯度项，鼓励高优势动作。\n        *   `clip` 项：防止策略更新步长过大，导致训练不稳定。如果概率比变化太大，就截断梯度，保证更新平滑。\n        *   **无 KL 惩罚**：传统 PPO 需要 KL 散度来防止策略偏离初始模型太远。但在这里，我们希望 Optimizer 学会一种全新的“修订风格”和“文档格式”，这与基础模型的初始分布不同。因此，去掉 KL 惩罚允许模型更自由地探索新的技能表达方式。\n\n4.  **奖励构成**：\n    *   $R = R_{task} + R_{fmt} + R_{len}$\n    *   $R_{task}$：验证器给出的任务成功奖励（核心信号）。\n    *   $R_{fmt}$：格式奖励，确保技能是合法的 Markdown 结构，便于解析。\n    *   $R_{len}$：长度惩罚，防止推理过程过长或过短。\n    *   **Intuition**：任务奖励是粗粒度的（成功/失败），格式和长度奖励是细粒度的约束，确保生成的技能是可用的且高效的。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n*   现有的 Agent 技能优化方法（如推理时循环反思）通常不更新技能生成模型本身，导致每次新任务都依赖基础模型的通用推理能力，效率低且易出错。\n*   核心问题：如何将执行经验（Execution Experience）结构化，以训练一个专门的 **Skill Optimizer**，使其具备从执行反馈中诊断缺陷并生成有效修订的能力？\n\n**2. 设计了什么实验验证这个问题？**\n*   **基准测试**：在 **BFCL v4**（多轮工具使用）和 **$\\tau_2$-bench**（对话式工具代理）上进行评估。\n*   **基线对比**：\n    *   **No Skill**：无技能基线。\n    *   **GPT-5.1 Seed Skill**：仅使用初始生成的技能，无优化。\n    *   **Qwen3-4B as Skill Optimizer (Untrained)**：使用未训练的相同骨干模型进行相同的精炼流程，以隔离“训练”带来的增益。\n    *   **Skill-R1, Trace2Skill**：现有的技能优化方法。\n    *   **General-purpose Models**：使用 GPT-5.5, Claude Sonnet 4.6 等大模型作为 Optimizer，对比专用训练的小模型。\n*   **消融实验**：\n    *   **Phase-wise Training**：验证多阶段自举训练是否比单阶段更有效。\n    *   **Refinement Depth**：验证推理时迭代次数对性能的影响，确定收益饱和点。\n*   **定性分析**：通过具体案例展示 successive revisions 如何逐步修复不同的执行错误。\n\n**3. 问题的答案是什么？**\n*   **WER 显著提升了性能**：在 BFCL v4 上，WER 比 No Skill 基线提升 7.80 个百分点，比未训练的相同骨干模型提升 9.35 个百分点。\n*   **专用训练优于通用推理**：经过 WER 训练的 4B 参数模型（Qwen3-4B）在 BFCL v4 上的平均 Pass@1 达到 76.63%，超过了所有参数量更大、通用能力更强的模型（如 GPT-5.5, Claude Sonnet 4.6）。这表明“技能精炼”是一种可以通过训练习得的特定能力，而非完全依赖通用推理。\n*   **多阶段自举有效**：随着训练阶段（Phase）的增加，性能单调提升，证明从早期修订的执行后果中学习是有效的。\n*   **收益饱和**：推理时的迭代精炼在 2-3 轮后收益饱和，说明训练好的 Optimizer 能够快速收敛到高质量技能。", "additional_insights": "### § 8 Take-aways\n\nWER框架的核心洞察是将“技能优化器（Skill Optimizer）”与“执行器（Executor）”解耦，通过训练一个独立的策略模型来专门学习如何从执行轨迹中提炼程序性知识，而非依赖通用大模型的即时推理能力。该方法的关键创新在于“阶段式自举（Phase-wise Self-Bootstrapping）”机制，即仅保留那些在同一任务下产生混合结果（部分成功、部分失败）的执行记录，利用这种受控的局部对比来构建下一阶段的训练状态，从而让优化器专注于修复特定缺陷。实验表明，经过WER训练的4B参数模型在BFCL v4和$\\tau_2$-bench上的表现优于未训练的相同基座模型，甚至超越了GPT-5.5等更强通用模型作为技能优化器的效果，证明了“从执行反馈中学习技能修订”是一种可被专门训练且独立于通用推理能力的技能。此外，研究揭示了技能优化的收益具有边际递减效应，前两轮修订贡献了绝大部分性能提升，第三轮修订反而可能导致性能轻微下降，这为推理时的迭代深度提供了明确的截止依据。\n\n### § 9 最脆弱的假设\n\n该方法最脆弱且代价最大的假设是：**程序化验证器（Programmatic Verifier）能够准确且无偏差地反映技能质量，且执行器（Executor）的冻结状态足以隔离噪声，使得轨迹差异完全归因于技能文本。** 如果验证器存在盲区（例如无法检测逻辑正确但格式错误的输出，或反之），或者冻结的执行器本身存在不稳定的采样噪声导致相同技能产生不可复现的结果，那么“混合结果记录”所依赖的“受控对比”前提将失效，优化器将学习到错误的因果关联。论文通过强调使用确定性验证器（如BFCL的状态比对和$\\tau_2$-bench的数据库比对）来支持这一假设，并指出冻结执行器是为了避免模型自我确认偏差。然而，论文缺乏对验证器覆盖率（Coverage）和执行器噪声敏感度（Sensitivity to Executor Variance）的深入分析；如果验证器无法区分细微但关键的逻辑错误，或者执行器在边缘情况下的随机性过大，WER构建的“成功-失败”配对数据将包含大量噪声，导致优化器学习到虚假的相关性而非真正的程序性改进。\n\n### § 10 最小复现实验\n\n在1周内，可以复现WER的核心假设：**“混合结果轨迹（Mixed-outcome Trajectories）比单一结果轨迹包含更多可学习的修订信号。”** 具体方案如下：\n1.  **数据**：使用BFCL v4的一个小个子集（如20个任务），利用一个固定的强执行器（如GPT-4o）和一组初始技能（可由GPT-5.1生成）。\n2.  **实现**：对每个任务运行多次（如10次）执行，收集所有轨迹。将轨迹分为三类：全成功、全失败、混合结果（既有成功也有失败）。\n3.  **测量**：构建一个小型的“修订对比实验”。使用一个固定的LLM（如Qwen3-4B）作为修订器，分别输入“全成功轨迹”、“全失败轨迹”和“混合结果轨迹”作为上下文，要求其对原始技能进行修订。然后，用修订后的技能再次执行任务，测量Pass@1的提升幅度。\n4.  **结果判定**：如果“混合结果轨迹”引导的修订带来的性能提升显著高于“全成功”或“全失败”轨迹，则支持WER的核心假设；如果三者无显著差异，或“全失败”轨迹（通过错误分析）表现更好，则反驳了WER对混合轨迹特殊性的依赖，表明其复杂的阶段式自举机制可能并非必要。此实验无需复现完整的GRPO训练循环，仅需验证数据构建策略的有效性。", "research_value": "### § 11 最强反例设计\n\n要挑战 WER 框架的有效性，最有力的攻击并非质疑其性能提升，而是攻击其核心假设的**因果归因谬误（Causal Attribution Fallacy）**，即证明“混合结果轨迹（Mixed-outcome Trajectories）”中的成功与失败差异并非由技能文本的缺陷引起，而是由**执行器（Executor）的内在随机性（Intrinsic Stochasticity）**或**环境非确定性（Environmental Non-determinism）**主导，导致优化器学习到的是虚假的相关性而非程序性修正。\n\n具体反例设计如下：构建一个**“高方差工具调用”基准（High-Variance Tool-Use Benchmark）**。在该基准中，任务的成功与否高度依赖于执行器在特定步骤的采样随机性（例如，从多个等价但语义细微差别的 API 参数中选择，或依赖非确定性的外部服务响应时间），而技能文本本身在逻辑上是完备且正确的。在此场景下，WER 的“保留策略”会大量保留那些因执行器随机采样导致“偶然成功”和“偶然失败”的配对轨迹。由于技能文本未变，Optimizer 接收到的信号是：相同的技能文本 $S$ 导致了结果 $R_{success}$ 和 $R_{fail}$。为了最大化奖励，Optimizer 可能会过度拟合（Overfit）到执行器的特定随机种子或环境噪声模式，生成包含冗余约束或针对特定随机路径的“伪指令”（例如，“如果 API 返回延迟超过 100ms，则重试”，而实际上重试与否与任务逻辑无关）。\n\n**理论论证**：如果执行器的方差（Variance）大于技能文本对结果的影响（Signal-to-Noise Ratio \u003C 1），那么 Group-Relative Advantage 计算出的优势值 $A_k$ 将主要反映执行器的随机波动，而非技能的质量。此时，GRPO 更新将导致策略崩溃（Policy Collapse），Optimizer 学会的是“猜测”执行器的随机行为，而非“修复”技能逻辑。这可以通过对比实验验证：在低方差（确定性）环境中 WER 有效，但在高方差环境中，WER 训练后的模型性能反而低于未训练的基线，因为它破坏了原本鲁棒的通用技能结构，引入了对噪声的敏感依赖。这一反例揭示了 WER 缺乏对**执行器噪声敏感度（Executor Noise Sensitivity）**的鲁棒性机制，其“受控对比”前提在真实世界的非确定性工具使用中可能失效。\n\n### § 12 Follow-up Research Idea\n\n基于 WER 将“技能优化”视为一种独立的、可训练的策略能力这一洞察，但受限于其仅优化**静态文本指令（Static Textual Instructions）**的局限，我提出一个新的研究方向：**从“技能优化”转向“技能结构化表征学习（Structured Skill Representation Learning）”**，即训练一个 **Skill Compiler**，将自然语言技能编译为可执行的形式化中间表示（如程序图 Program Graph 或状态机 State Machine），并直接优化该结构化表征，而非自然语言文本。\n\n**（a）驱动局限**：WER 的核心瓶颈在于自然语言的**歧义性（Ambiguity）**和**非结构化（Unstructured Nature）**。即使 Optimizer 学会了从执行反馈中修正文本，它仍然是在“修补”模糊的自然语言描述，这导致修正往往是局部的、易碎的，且难以保证逻辑一致性（例如，修改了前置条件却未同步更新后置条件）。此外，WER 依赖程序化验证器，这意味着它只能优化那些有明确二元成功/失败信号的任务，无法处理需要中间步骤质量评估的复杂任务。\n\n**（b）借鉴领域**：借鉴**程序合成（Program Synthesis）**和**形式化验证（Formal Verification）**领域的思想。在程序合成中，代码被解析为抽象语法树（AST）或控制流图（CFG），优化器可以直接操作节点和边，确保语法正确性和逻辑完整性。我们可以引入一个 **Neural Skill Compiler**，将自然语言技能映射到一个轻量级的、可执行的结构化图表示（如 **Skill Graph**），其中节点代表工具调用或逻辑判断，边代表控制流。\n\n**（c）第一个实验**：构建一个 **Graph-RL Skill Optimizer** 框架。\n1.  **编码器**：使用一个预训练的 LLM 将初始自然语言技能解析为 Skill Graph。\n2.  **优化器**：训练一个基于图神经网络（GNN）或图 Transformer 的策略模型，直接在图结构上进行操作（如添加节点、修改边权重、插入条件分支）。\n3.  **执行与反馈**：冻结的 Executor 执行由 Skill Graph 生成的代码或指令序列。\n4.  **奖励设计**：除了最终任务成功奖励，引入**中间状态奖励（Intermediate State Rewards）**，例如，检查图执行路径是否覆盖了所有必要的工具调用，或是否避免了死循环。\n5.  **对比实验**：在 BFCL v4 上，对比 WER（优化文本）与 Graph-RL（优化图结构）在**泛化性（Generalization）**和**鲁棒性（Robustness）**上的表现。预期 Graph-RL 能够更有效地处理复杂的多分支逻辑，因为结构化表征消除了自然语言的歧义，使得优化器能够进行更精确的“手术式”修正，而非“文本式”修补。这一方向将技能优化从“语言模型推理”提升到了“程序逻辑优化”的层面，打开了**可解释、可验证、结构化**的 Agent 技能学习新范式。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Kang Peng\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Zhiwei Zhang\",\n      \"affiliations\": [\n        2,\n        3\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Yichen Zhang\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zezhong Wang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yiming Du\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Geng Tu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Baojun Wang\",\n      \"affiliations\": [\n        5\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Bin Liang\",\n      \"affiliations\": [\n        2,\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Ruifeng Xu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Kam-Fai Wong\",\n      \"affiliations\": [\n        2,\n        3\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Harbin Institute of Technology, Shenzhen\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"The Chinese University of Hong Kong\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"MoE Key Laboratory of High Confidence Software Technologies\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Harbin Institute of Technology, Harbin\"\n    },\n    {\n      \"id\": 5,\n      \"name\": \"Huawei Technologies Co., Ltd.\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal contribution.\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding author.\"\n    }\n  ]\n}\n```", "summary_translation": "专家撰写的自然语言技能可以提升工具使用型智能体（tool-using agents）的性能，然而由智能体自主生成的技能表现比不使用任何技能还要差 8-11 分。这一差距表明，遵循程序化指导与根据执行证据改进技能是两种不同的能力。推理时的循环（inference time loops）可以修复技能，但无法提升生成下一个技能的模型。我们研究了如何将来自中间技能的执行经验组织成优化器（optimizer）的训练状态。我们提出了 WER（Write, Execute, and Refine），这是一个多阶段框架，用于在冻结的执行器（executor）之外训练一个技能优化器（Skill Optimizer）。优化器提出技能，一个冻结的智能体反复执行每个技能，并通过程序化验证器（programmatic verifier）对结果进行评分。这些分数提供相对信用并筛选出混合结果的记录。来自这些记录的匹配成功和失败轨迹形成下一阶段的精炼状态，从而使优化器能够从先前输出的后果中学习。在 BFCL v4 多轮任务和 tau2-bench 上，WER 分别将平均 Pass@1 提高了 7.80 和 3.85 分，优于无技能基线。在相同的精炼工作流下，它比未经优化器训练的相同主干模型高出 9.35 和 10.29 分。经过训练的 4B 优化器在 BFCL v4 上达到了 76.63% 的准确率，平均优于所有作为技能优化器评估的现成通用模型。"}, {"title": "Agentic ESOpt: Fine-Tuning Long-Horizon LLM Agents with Minimal GPU Requirements", "arxiv_id": "2608.17310", "authors": "Zhi Zheng, Rongsheng Chen, Yunpeng Ba, Zhenkun Wang, Yee Whye Teh, Wee Sun Lee", "summary": "Reinforcement Learning (RL) has been promising in single-turn LLM fine-tuning. However, long-horizon agentic reasoning introduces increasingly branching interactions and sparse rewards, exposing several limitations of RL: its heavyweight backpropagation-based training stack makes it impractical to fine-tune larger LLMs, and longer-horizon trajectories make credit assignment in RL substantially harder. This paper argues that evolution strategies (ES) can be a better choice for fine-tuning long-horizon LLM agents. Compared with agentic RL, ES offers three key advantages: 1) Model Scalability: ES enables full-parameter optimization with only minimal, inference-level GPU memory, making it possible to fine-tune large LLMs. 2) Flexibility: its lightweight, black-box feedback interface makes ES fine-tuning easy to compose with prompt-space evolution (e.g., skill optimization \u0026 test-time compute); and 3) Long-Horizon Scalability: ES performs trajectory-level parameter attribution without decomposing rewards across horizons, yielding better scalability than Agentic RL as the horizon length grows. Based on this insight, we propose Agentic ESOpt, a full-parameter agentic fine-tuning framework tailored to flexible parameter--context co-evolution. At each step, Agentic ESOpt samples perturbations around the current LLM parameters, evaluates the resulting agents with rewards, and applies an online reward-weighted update. To improve the exploration--adaptation trade-off, Agentic ESOpt further introduces a cosine decay schedule of the perturbation scale $σ$. On WebArena-Lite, full-parameter optimization of Qwen-3.5-27B improves the No Skill baseline by 6.69%. In test-time automatic heuristic design, Agentic ESOpt performs online prompt--parameter co-evolution, improving its matched baseline in 28 of 36 settings.", "category": "cs.LG", "cluster": "Reinforcement Learning \u0026 Training for Agents", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决长视界（long-horizon）LLM Agent 微调中的核心优化难题：如何在稀疏奖励和高度分支的交互轨迹下，高效地进行全参数优化，同时克服传统强化学习（RL）在显存占用和信用分配（credit assignment）上的瓶颈。随着 LLM 在工具使用、代码编辑及多步工作流协调等 Agent 场景中的应用日益深入，模型需要在数十甚至上百个交互回合中保持逻辑一致性。然而，现有的主流微调范式——特别是基于策略梯度的 Agentic RL（如 Agentic PPO 和 Agentic GRPO）——在面对长视界任务时暴露出严重缺陷：首先，RL 方法需要存储大量的激活值（activations）、优化器状态并进行反向传播（backpropagation），导致全参数微调大模型（如 27B 参数级别）的 GPU 显存需求极高，工程上难以落地；其次，随着轨迹长度增加，将稀疏的终端奖励准确归因到中间每一步动作（turn-level credit assignment）变得极其困难，导致梯度估计方差随视界长度线性增长，优化效率急剧下降。\n\n解决这一问题具有极高的理论与应用价值。理论上，本文论证了进化策略（Evolution Strategies, ES）在长视界场景下比 RL 更具结构性优势，因为它通过轨迹级别的参数归因（trajectory-level parameter attribution）避免了视界维度的分数累积，从而实现了更好的长视界可扩展性（long-horizon scalability）。应用上，Agentic ESOpt 框架仅需推理级别的 GPU 显存（inference-level GPU memory），使得在有限硬件资源下对大规模 LLM 进行全参数微调成为可能。此外，其轻量级的黑盒反馈接口（black-box feedback interface）赋予了极高的灵活性，能够与提示空间进化（prompt-space evolution，如 Trace2Skill）和测试时计算（test-time compute）无缝组合，实现了参数与上下文（parameter-context）的协同进化。这不仅降低了 Agent 微调的门槛，还为构建能够在线自我改进、适应复杂动态环境的智能体提供了新的优化范式。\n\n### § 2 前人工作与不足\n\n在长视界 LLM Agent 微调领域，前人工作主要集中在基于梯度的强化学习方法和提示空间优化上，但均存在显著局限。\n\n**Agentic RL 方法（如 Agentic PPO, Agentic GRPO）：**\n这是目前最主流的 Agent 微调方法。Agentic GRPO（Shao et al., 2024）通过组相对优势（group-relative advantage）在单轮推理中表现出色，但在多轮交互中，其优势估计无法覆盖复杂的轨迹依赖关系。Agentic PPO（Li et al., 2026; Hou et al., 2026）引入了 Critic 模型进行回合级优势估计，试图改善信用分配。然而，这些方法存在根本性不足：\n1.  **显存与计算瓶颈：** RL 方法需要完整的反向传播路径，必须存储整个轨迹的激活值和参考模型（reference model）的输出，导致显存占用随模型规模和轨迹长度激增。对于 27B 级别的大模型，全参数 RL 微调在常规硬件（如 4 张 H100）上几乎不可行。\n2.  **长视界信用分配失效：** 在稀疏奖励设置下（如 Sudoku 或 WebArena，仅最终成功才有奖励），Critic 模型难以在训练初期学习到可靠的价值信号，导致早期优势估计噪声极大。即使 Critic 训练良好，策略梯度仍需对 $H$ 个动作级别的得分项求和，其方差随视界长度 $H$ 近似线性增长，导致优化不稳定且效率低下。\n\n**提示空间优化与测试时计算（如 Trace2Skill, EoH, Reflexion）：**\n这类方法（Ni et al., 2026; Liu et al., 2024; Shinn et al., 2023）通过优化外部组件（如提示词、技能文档、记忆库）或增加推理时的搜索步数来提升性能，而保持 LLM 参数冻结。\n1.  **优化空间受限：** 由于模型参数固定，这些方法只能重新加权或重组模型已具备的行为模式（frozen policy），无法从根本上改变模型的底层策略分布。当任务需要模型习得全新的推理逻辑或工具使用习惯时，仅靠提示优化往往触及性能天花板。\n2.  **缺乏参数协同：** 现有的测试时计算（test-time compute）通常独立于参数更新，无法利用轨迹反馈来微调模型权重，导致参数优化与提示/技能优化割裂，未能实现真正的协同进化。\n\n**单轮 LLM 微调中的 ES 方法（如 Qiu et al., 2026; Sun et al., 2026）：**\n近期研究探索了 ES 在单轮 LLM 推理微调中的应用，证明了其在显存效率上的优势。然而，这些工作主要关注单轮输出，未深入探讨 ES 在长视界、多步交互 Agent 场景下的潜力。前人普遍认为 ES 仅是 RL 的一种“更便宜但性能略低”的替代方案，未能认识到在长视界稀疏奖励场景下，ES 的轨迹级归因机制能从根本上规避 RL 的视界依赖方差问题，从而在长视界任务中实现性能反超。因此，缺乏针对长视界 Agent 特性的全参数 ES 微调框架，以及对其与提示空间优化协同机制的系统性研究。", "core_insight": "### § 3 重建作者的思考路径\n\n在长视界（Long-Horizon）Agent 任务中，现有的 Agentic RL（如 PPO、GRPO）面临两个日益严峻的瓶颈：一是**Credit Assignment**难题，随着交互步数 $H$ 增加，稀疏的终端奖励难以准确归因到每一步动作，导致策略梯度方差随 $H$ 线性增长；二是**显存开销**巨大，全参数微调需要存储 Activations 和 Optimizer States，使得在有限 GPU 资源下微调大模型（如 27B+）变得不切实际。\n\n与此同时，Evolution Strategies (ES) 作为一种无梯度优化方法，在单轮推理任务中已显示出极高的显存效率（仅需 Inference-level Memory），但其性能通常略逊于 RL。然而，作者注意到 ES 的核心机制是**Trajectory-level Parameter Attribution**：它不对每一步动作进行梯度分解，而是将整条轨迹的奖励直接归因于一次参数扰动。这种机制天然规避了长视界下的 Credit Assignment 难题，因为 ES 的估计器方差不随 $H$ 显式增长。\n\n此外，ES 的黑盒反馈接口具有极高的**Flexibility**，可以轻松与 Prompt-space Evolution（如 Trace2Skill）或 Test-time Compute 结合，实现参数与上下文提示的协同进化。基于此，作者推测：在长视界、稀疏奖励的场景下，ES 的结构优势（避免 Horizon-wise Score Accumulation）将使其相对优势超过 RL，尤其是在需要全参数微调大模型时。因此，提出 Agentic ESOpt，通过引入 Cosine Decay 的扰动尺度 $\\sigma$ 来平衡探索与利用，旨在解决长视界 Agent 微调中的显存限制和信用分配难题。\n\n### § 4 核心 Intuition\n\nAgentic ESOpt 的核心直觉在于：**长视界 Agent 微调的瓶颈不在于模型容量，而在于 RL 方法中随交互步数线性增长的信用分配方差和巨大的显存开销。**\n\n通过采用 Evolution Strategies，我们将优化目标从“每一步动作的梯度”转变为“整条轨迹的参数扰动”，从而**彻底规避了长视界下的 Credit Assignment 难题**，因为 ES 的估计器方差不随 Horizon 长度显式增加。\n\n同时，ES 仅需 Inference-level 的显存，使得**全参数微调大模型（如 27B）在有限硬件上成为可能**，并通过黑盒接口实现了参数与 Prompt/Skill 的灵活协同进化。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**Agentic ESOpt** 是一种基于 **Evolution Strategies (ES)** 的全参数微调框架，旨在解决长视界（Long-Horizon）LLM Agent 微调中的显存瓶颈和信用分配（Credit Assignment）难题。其核心思想是不使用反向传播（Backpropagation），而是通过在参数空间采样扰动，根据环境奖励进行黑盒优化。\n\n以下以 **WebArena-Lite** 任务为例，展示 Agentic ESOpt 的完整 Pipeline：\n\n1.  **初始化与扰动采样 (Initialization \u0026 Perturbation Sampling)**：\n    *   **输入**：当前 LLM 参数 $\\theta$（例如 Qwen3.5-27B），以及一组训练任务（如“在 Reddit 上查找特定帖子”）。\n    *   **处理**：算法从标准正态分布 $\\mathcal
