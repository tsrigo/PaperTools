\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yuexing Hao\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Liting Mai\",\n      \"affiliations\": [\n        6\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xianglin Ji\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Wenjun Zhang\",\n      \"affiliations\": [\n        8\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zhuofan Chen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yixiao Huang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Chi Wang\",\n      \"affiliations\": [\n        12\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Wenyue Hua\",\n      \"affiliations\": [\n        11\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yilun Hao\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yuantao Zhai\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Ziyan Zhao\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jingyan Xie\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Tsinghua University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Massachusetts Institute of Technology\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Harvard University\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Carnegie Mellon University\"\n    },\n    {\n      \"id\": 5,\n      \"name\": \"University of Michigan\"\n    },\n    {\n      \"id\": 6,\n      \"name\": \"University of Illinois Urbana–Champaign\"\n    },\n    {\n      \"id\": 7,\n      \"name\": \"Boston University\"\n    },\n    {\n      \"id\": 8,\n      \"name\": \"University of Queensland\"\n    },\n    {\n      \"id\": 9,\n      \"name\": \"University of Science and Technology of China\"\n    },\n    {\n      \"id\": 10,\n      \"name\": \"Flatiron Institute\"\n    },\n    {\n      \"id\": 11,\n      \"name\": \"Microsoft Research\"\n    },\n    {\n      \"id\": 12,\n      \"name\": \"AG2 AI\"\n    },\n    {\n      \"id\": 13,\n      \"name\": \"Independent Researcher\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"†\",\n      \"text\": \"Equal contribution.\"\n    },\n    {\n      \"marker\": \"∗\",\n      \"text\": \"Corresponding author.\"\n    }\n  ]\n}", "summary_translation": "人工超级智能（ASI）要求人工智能超越对现有知识的掌握，转向探索未知、创造新知识，并将新想法转化为可验证的结果。然而，当今人工智能系统的能力仍然主要建立在学习、压缩和应用现有人类知识的基础上。因此，现有的基准测试主要评估人工智能能否基于已学知识产生正确答案，或者能否在大量人类指导下完成任务。为此，我们引入了 ASI-Bench，这是首个在通用研究领域联合评估人工智能系统创新探索和自主科学执行能力的基准，也是首个在同一研究项目中逐步撤除人类方法指导，以测试人工智能独立推进程度的基准。ASI-Bench 由 40 多位专家耗时 31,000 多个人工小时构建，包含 11 个科学领域的 60 个项目级研究任务，并通过逐步减少方法指导来测试人工智能能否独立选择方法、开展研究并产生可验证的结果。所有任务均经过专家审查、AI 辅助审计、沙盒执行和评分验证。在 18 种最先进的 agent-model 配置中，平均得分从完全方法指导下的 50.91 分，下降到仅指定方法时的 29.10 分，再到 agent 必须自行确定方法时的 26.62 分。这一显著下降表明，当前系统仍然严重依赖人类指导，距离自主开展端到端、项目级的科学研究仍有很大差距。ASI-Bench 向全球开放。我们邀请世界各地的研究者和开发者贡献新任务，挑战当今人工智能的极限，并帮助加速人类通往人工超级智能的集体进程，请访问 https://asibench.apexin.ai/submit。"}]}, {"name": "Self-Evolving \u0026 Adaptive Agents", "count": 3, "papers": [{"title": "Teach and Grow: An Agent-Centered Architecture for General Robot Learning", "arxiv_id": "2608.17209", "authors": "Chang Nie, Zhe Liu, Hesheng Wang", "summary": "End-to-end vision-language-action (VLA) and world-action models offer an elegant route to general-purpose robotics, but their reliability is bounded by validated physical coverage. When an unfamiliar object, sensor, embodiment, or contact falls outside that coverage and no validated fallback exists, correcting the failure requires new robot data, a policy update, and regression testing. This recurring burden is the retraining tax. Unlike text, embodied data must often be created by operating machines. We present Teach-and-Grow Learning (TGL), an agent-centered architecture for general robot learning. In its general form, a multimodal agent turns a few successful demonstrations into reusable Skill Blocks: closed-loop behaviors for meaningful subgoals. In a new scene, the agent grounds and composes these blocks, selects learned or geometric tools, observes the physical outcome, and revises the route when execution departs from intent. A Skill Library stores executable behavior, while structured Experience Memory carries forward success, failure, and repair. New tasks are acquired without task-specific policy retraining. Our LIBERO evaluation attains state-of-the-art performance; controlled studies expose skill induction, persistent reuse, and agent-directed adaptation. Finally, we propose the Teach-and-Grow scaling-law hypothesis: if X denotes effective reusable experience, future-task error and teaching demand should approach irreducible floors as power laws in X. The architecture therefore treats deployment as a period of continued learning, in which one task can make the next easier.", "category": "cs.LG", "cluster": "Self-Evolving \u0026 Adaptive Agents", "tags": ["cs.LG"], "filter_reason": "该论文完全符合“LLM智能体及其演化”的研究范围，具体依据如下：\n\n1.  核心对象为智能体 (Agentic AI)：论文提出了一种“以智能体为中心”（Agent-Centered）的架构，研究对象是具备感知、决策和行动能力的具身智能体（Embodied Agent）。这直接对应研究焦点中的“单智能体”方向。\n2.  具备明确的智能体能力机制：摘要中明确提到了智能体的关键能力组件，包括：\n       记忆 (Memory)：“Structured Experience Memory carries forward success, failure, and repair”（结构化经验记忆携带成功、失败和修复信息）。\n       工具使用 (Tool Use)：“selects learned or geometric tools”（选择学习到的或几何工具）。\n       规划与反思 (Planning \u0026 Self-Reflection)：“revises the route when execution departs from intent”（当执行偏离意图时修正路径），这体现了自我反思和在线适应能力。\n3.  符合自我演化 (Self-Evolving) 标准：论文的核心贡献在于“Teach-and-Grow Learning (TGL)”机制，强调智能体通过积累可复用的“Skill Blocks”（技能块）和“Experience Memory”（经验记忆）来实现持续学习。摘要指出“deployment as a period of continued learning”（部署是持续学习的时期）以及“one task can make the next easier”（一个任务能让下一个任务更容易），这完全符合“智能体通过经验、反思或环境反馈进行自我完善和迭代”的定义。\n4.  排除项检查：虽然涉及机器人（具身智能），但论文重点不在于底层视觉模型或硬件加速，而在于智能体的架构设计、技能获取、记忆管理和持续适应机制。它不属于单纯的应用层论文，而是提出了新的智能体学习范式。同时，它不涉及被排除的多智能体拓扑、通信协议或纯基础设施优化。\n\n综上，该论文在具身智能体场景下研究了智能体的记忆、工具使用、自我修正及持续演化机制，属于高相关性的前沿研究。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在通用机器人学习（General Robot Learning）中，如何克服由端到端模型架构引发的“重训练税”（retraining tax），即当机器人遇到分布外（OOD）的新物体、传感器或接触场景时，必须通过收集新数据、更新全局策略并进行回归测试来修复局部失败的高昂成本。这一问题之所以至关重要，是因为当前主导的通用机器人愿景依赖于大规模视觉-语言-动作（VLA）或世界-动作模型（World-Action Models, WAMs），这些模型虽然通过扩展数据集和模型规模实现了语义理解的泛化，但其可靠性严格受限于已验证的物理覆盖范围（validated physical coverage）。与文本数据不同，具身交互数据（embodied data）无法预先存在，必须通过操作物理机器或模拟器生成。当局部能力缺失时，更新单体策略（monolithic policy）会导致全局性的重新优化和测试，这种“局部缺口与全局更新”之间的不匹配构成了部署扩展的实际瓶颈。解决这一问题带来的价值在于，它允许机器人以“局部能力增长”的方式学习，即在不重写无关行为的情况下添加和验证新技能。通过引入以智能体为中心的架构，机器人可以将稀疏的教学转化为可复用的“技能块”（Skill Blocks），并利用结构化经验记忆（Experience Memory）实现持续学习。这不仅降低了新任务获取的数据和计算成本，还提出了“Teach-and-Grow 缩放定律假设”，预测随着有效可复用经验（effective reusable experience）的增加，未来任务的错误率和所需的教学量将按幂律下降，从而为终身机器人智能（lifelong robot intelligence）提供了一条可扩展的路径。\n\n### § 2 前人工作与不足\n\n该问题此前并未被完全解决，现有的研究主要沿着两条路径展开，但均存在显著不足。第一条路径是通用 VLA 和世界-动作策略（如 RT-1, RT-2, Octo, OpenVLA, DreamZero 等）。这些系统通过大规模行为克隆和端到端映射展示了强大的语义理解和泛化潜力，但它们将机器人智能封装在单一的参数化策略中。其根本不足在于，它们缺乏处理物理覆盖范围外新任务的机制：当遇到未见过物体或接触模式时，由于缺乏几何、动力学或接触行为的显式建模，系统无法仅通过语义知识可靠执行，必须依赖昂贵的全局重训练循环。这种架构无法区分“熟悉行为的快速执行”与“不熟悉行为的获取”，导致任何局部失败都触发全局更新，即所谓的“重训练税”。第二条路径是基于演示学习、少样本适应和可复用技能的研究（如 MimicGen, XSkill, SkillPlug, SkillMemo 等）以及代理式工具使用系统（如 ASPIRE, Code as Policies, ReKep 等）。这些工作试图通过显式技能结构或高层推理来组织行为。然而，它们的不足在于：许多基于演示的系统侧重于直接模仿或生成可转移的行为，未能将演示转化为可重新实例化的闭环行为抽象（即 Skill Blocks），导致技能难以在新场景中灵活重组；而现有的代理系统（如 ASPIRE）虽然展示了零样本探索的能力，但在物理机器人上主要依赖试错，可能导致不安全探索且效率低下，且往往缺乏将成功经验持久化为可复用、可验证的显式知识结构的机制。此外，现有工作通常将记忆、工具和可执行技能混为一谈，未能清晰分离“指导选择的经验”与“实际执行的能力”。TGL 指出，之前的系统要么将新能力吸收进不透明的参数中（导致重训练税），要么缺乏将稀疏教学转化为持久、可组合、闭环技能块的完整生命周期管理，从而无法实现无需任务特定策略重训练的持续能力增长。", "core_insight": "### § 3 重建作者的思考路径\n\n在端到端 Vision-Language-Action (VLA) 模型和 World-Action Models (WAM) 成为通用机器人学习的主流范式后，研究者观察到一种显著的“再训练税”（retraining tax）：当机器人遇到分布外（OOD）的对象、传感器或接触情况时，由于缺乏验证过的物理覆盖，系统必须收集新数据、更新全局策略并进行回归测试。这种全局更新不仅计算昂贵，而且容易破坏已习得的行为（灾难性遗忘），导致局部错误引发全局重构。与此同时，现代 Coding Agents（如 Codex, Claude Code）展示了另一种智能组织形式：它们不通过更新模型权重来适应新代码库，而是通过观察环境、调用工具、检查结果并动态调整计划来完成任务。这种“感知-规划-执行-反馈”的循环在语义层面是开放的，允许局部修正而不影响整体架构。\n\n作者意识到，机器人领域缺乏像文本那样预先存在的大规模数据基底，物理交互数据的获取成本极高。因此，单纯依靠扩大模型和数据规模（Scaling Laws）在物理世界中面临边际效益递减的问题。如果将机器人智能视为一个静态的策略映射，那么每一次新任务都意味着从头开始或全局微调。但如果借鉴 Agentic 架构，将“任务理解”与“物理执行”解耦，让一个高层 Agent 负责语义推理和工具调度，而底层保留专门的执行器（Executors），那么新任务的学习就可以转化为“技能组合”而非“策略重写”。\n\n进一步地，作者思考如何避免零样本探索（Zero-shot exploration）在物理世界中的高成本和安全性风险。人类学习新技能往往通过少量示范（Few-shot teaching）获得结构，再通过实践细化。如果 Agent 能从少量示范中提取出可复用的、闭环的“技能块”（Skill Blocks），并将这些技能块存入持久的“技能库”（Skill Library）和“经验记忆”（Experience Memory），那么机器人就可以在部署过程中持续生长。这种架构将学习从“参数更新”转变为“知识积累”，使得新任务的习得不再依赖于全局策略的重新训练，而是依赖于对已有技能块的检索、组合和局部验证。由此，作者提出了 Teach-and-Grow Learning (TGL) 架构，并假设随着有效可复用经验（Effective Reusable Experience）的增长，未来任务的错误率和教学需求将遵循幂律下降。\n\n### § 4 核心 Intuition\n\n传统端到端模型将机器人智能压缩为静态的参数权重，导致任何新任务或环境变化都迫使系统进行昂贵且易出错的全局更新（即“再训练税”）。Teach-and-Grow Learning 的核心直觉是将机器人智能重构为一个动态的、基于 Agent 的组织系统，其中高层 Agent 负责语义推理和任务规划，而底层由可复用的、闭环的“技能块”（Skill Blocks）构成物理执行能力。通过从少量示范中提取并持久化这些技能块，机器人能够在不更新基础模型权重的情况下，通过组合现有技能和局部适应来学习新任务，从而实现“教一次，长一智”的终身学习机制。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**Teach-and-Grow Learning (TGL)** 的核心架构是一个以 Agent 为中心的终身学习系统，旨在解决端到端模型面临的“重训练税”（retraining tax）。其核心思想是将稀疏的教学演示转化为可复用的、闭环的 **Skill Blocks**，并通过 **Skill Library** 和 **Experience Memory** 实现能力的持久化增长，而非更新全局策略参数。\n\n以下以“将碗放在盘子上”（Bowl-on-Plate）这一不熟悉任务为例，讲解完整的 Pipeline：\n\n1.  **输入（Input）：稀疏教学与任务指令**\n    *   **场景**：机器人面对一个未见过的任务指令：“把碗放在盘子上”。\n    *   **数据**：用户提供少量（Few-shot）成功的演示轨迹（例如3次）。这些演示包含同步的视觉观测、动作序列和最终状态。\n    *   **初始状态**：机器人拥有固定的预训练基础模型（Foundation Models，如 VLA 或 World-Action Model），以及初始的 Skill Library 和 Experience Memory。\n\n2.  **处理（Processing）：抽象、组成与执行**\n    *   **跨演示抽象（Cross-Demonstration Abstraction）**：\n        *   AI Agent 分析演示轨迹，识别语义子目标（Semantic Subgoals）。例如，将轨迹分解为“获取碗”（Acquire Bowl）和“放置碗”（Place Bowl）两个阶段。\n        *   Agent 提取共享策略，忽略具体的像素坐标或关节角度，生成可复用的 **Skill Blocks**。每个 Block 包含子目标 $g_i$、适用范围 $S_i$、复用策略 $\\rho_i$、接地函数 $\\gamma_i$（将当前观测映射为变量）、执行器集合 $\\Pi_i$、验证器 $v_i$ 和恢复机制 $R_i$。\n    *   **动态组成（Dynamic Agentic Composition）**：\n        *   在新场景中，Agent 检索相关的 Skill Blocks，构建一个工作计划（Working Plan），例如 $[Block_{acquire}, Block_{place}]$。\n        *   **接地（Grounding）**：Agent 调用接地函数 $\\gamma_i$，根据当前场景的视觉信息（如碗和盘子的实时位置、几何形状），重新计算具体的抓取点和路径。\n    *   **闭环执行与反馈（Closed-loop Execution \u0026 Feedback）**：\n        *   Agent 选择执行器（如几何规划器或 VLA 策略）执行第一个 Block（获取碗）。\n        *   **验证（Verification）**：执行后，Agent 通过验证器 $v_i$ 检查物理结果（例如：碗是否被稳定持有？）。\n        *   **自适应调整**：如果验证失败或结果不明确（Inconclusive），Agent 不会盲目继续，而是根据 **Experience Memory** 中的历史教训，决定重新观测、更换执行器、请求针对性教学或修改后续计划。在本例中，如果抓取成功但放置前的姿态不佳，Agent 会重建剩余路线。\n\n3.  **输出（Output）：任务完成与知识增长**\n    *   **即时输出**：任务成功完成（碗被放置在盘子上）。\n    *   **持久化增长（Persistent Growth）**：\n        *   **Skill Library 更新**：经过验证的“获取碗”和“放置碗”的 Skill Blocks 被存入 Skill Library，成为可复用的显式知识。\n        *   **Experience Memory 更新**：执行过程中的成功条件、失败原因及修复策略被记录为结构化文本，供未来任务参考。\n        *   **无参数更新**：整个过程中，基础模型的参数 $\\theta$ 保持不变。机器人通过扩展显式技能和记忆来学习，而非重新训练策略。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有传统意义上的复杂微积分或优化推导，其核心贡献在于提出了一种新的**缩放定律假设（Scaling-Law Hypothesis）**和**状态更新机制**。以下是核心理论的直觉解释：\n\n1.  **状态更新机制（State Update Mechanism）**\n    *   **公式直觉**：传统强化学习或模仿学习通过梯度下降更新模型参数 $\\theta$。TGL 的更新公式为：\n        $$ (B_{n+1}, M_{n+1}, H_{n+1}) = \\text{Update}(B_n, M_n, H_n, \\Delta H_n) $$\n        其中 $\\theta$（预训练参数）保持固定。\n    *   **解释**：这意味着学习不是通过改变“大脑”（神经网络权重）来实现的，而是通过改变“知识库”（Skill Library $B$）和“经验记忆”（Experience Memory $M$）来实现的。这类似于人类学习新技能时，不是改变大脑结构，而是增加新的技能模块和记忆。\n\n2.  **Teach-and-Grow 缩放定律假设（Scaling-Law Hypothesis）**\n    *   **公式**：\n        $$ E_{future} \\approx E_\\infty + A X^{-\\alpha}, \\quad D_{teach} \\approx D_\\infty + B X^{-\\beta} $$\n    *   **变量定义**：\n        *   $X$：**有效可复用经验（Effective Reusable Experience）**。这不是简单的数据量，而是经过验证、可检索、可接地并能在新场景中复用的经验的质量加权总和。\n        *   $E_{future}$：未来相关任务的预期错误率。\n        *   $D_{teach}$：学习新任务所需的教学投入（如教师干预时间）。\n        *   $E_\\infty, D_\\infty$：不可约减的底线（Irreducible floors）。\n        *   $\\alpha, \\beta$：缩放指数，表示系统将经验转化为能力的效率。\n    *   **直觉解释**：\n        *   传统的缩放定律关注模型大小和数据量。TGL 提出，随着机器人积累的**高质量可复用经验 $X$** 增加，未来任务的错误率和所需的教学量会以**幂律（Power Law）**形式下降。\n        *   这意味着：机器人学得越多（且这些知识是可复用的），它学习新任务就越容易，需要的指导就越少。这打破了“每个新任务都需要从头训练”的瓶颈，实现了“一次教学，终身受益”的累积效应。\n\n---\n\n### § 7 实验设计与结论\n\n**提出了什么问题 → 设计了什么实验验证这个问题 → 问题的答案是什么**\n\n1.  **问题：TGL 能否从稀疏演示中诱导出生成可持久化复用的 Skill Blocks？**\n    *   **实验设计**：在 LIBERO 基准测试中，使用少量演示（如3次轨迹）训练机器人执行特定任务（如转移调味品）。随后，将生成的 Skill Blocks 保存并重新加载，在未见过的初始状态下测试其成功率。同时，测试超出 Block 适用范围的情况，观察其是否停止执行以防止错误传播。\n    *   **结论**：演示确实被转化为持久的、具有范围感知的行为。保存并重新加载的 Blocks 在相同状态下保持 100% 成功率，且在超出范围时能正确停止，证明了 Skill Blocks 的有效性和安全性。\n\n2.  **问题：物理反馈是否能动态改变 Agent 的执行计划？**\n    *   **实验设计**：设计两个代表性任务（碗放盘子、开抽屉）。在“碗放盘子”任务中，故意制造抓取成功但放置前证据不足的情况；在“开抽屉”任务中，制造结果不明确的情况。观察 Agent 是否会根据物理反馈重新规划路线或重新观测。\n    *   **结论**：物理世界的证据确实改变了 Agent 的后续行动。Agent 能够根据反馈重建剩余路线或获取新观测，证明了其具备动态适应能力，而非僵化地执行预定义脚本。\n\n3.  **问题：在不更新模型参数的情况下，局部技能库的增长能否提升整体性能？**\n    *   **实验设计**：固定执行器（Executor）和运行时环境，对比仅包含基础 6 个 Blocks 的库与添加了 2 个新学习 Blocks 的 8 个 Blocks 库在相关任务上的表现。\n    *   **结论**：基础库在 6 个评估状态中成功率为 0/6，而添加新 Blocks 后成功率为 4/6。这证明了通过局部添加可复用能力，可以在不重新训练全局策略的情况下显著提升机器人对新任务的解决能力，验证了“非破坏性增长”（Non-Destructive Growth）的有效性。\n\n4.  **问题：TGL 在标准基准测试中是否达到 State-of-the-Art (SOTA)？**\n    *   **实验设计**：在完整的 LIBERO 基准测试上评估 TGL 系统的整体任务成功率。\n    *   **结论**：TGL 在 LIBERO 上取得了 SOTA 的任务成功率，证明了该架构在通用机器人学习中的竞争力。", "additional_insights": "### § 8 Take-aways\n\nTeach-and-Grow Learning (TGL) 提出了一种以 Agent 为中心的机器人学习架构，旨在解决端到端 Vision-Language-Action (VLA) 模型面临的“retraining tax”问题，即当遇到分布外（OOD）对象或场景时，全局策略更新带来的高昂回归测试成本。该架构的核心创新在于将稀疏的人类演示（few-shot demonstrations）转化为可重用的、闭环的 **Skill Blocks**，这些块不是固定的轨迹回放，而是包含语义子目标、适用范围、接地函数（grounding function）和执行器选择的抽象行为单元。TGL 通过分离“获取新行为”与“执行熟悉行为”，利用 **Skill Library** 存储已验证的可执行行为，并通过结构化的 **Experience Memory** 记录成功、失败及修复经验，从而实现非破坏性的增量学习，无需针对每个新任务重新训练底层策略权重。论文提出了 **Teach-and-Grow scaling-law hypothesis**，预测随着有效可重用经验（effective reusable experience, $X$）的增加，未来任务的错误率和所需的教学量将按幂律下降至不可约简的基线，强调了部署期作为持续学习阶段的价值。在 LIBERO 基准测试中，TGL 实现了 state-of-the-art 的任务成功率，并通过受控实验证明了 Skill Blocks 的持久性、物理反馈对工作流的动态重组能力，以及在固定执行器下通过局部库增长提升性能的有效性。\n\n### § 9 最脆弱的假设\n\nTGL 架构最脆弱且关键的假设是：**多模态 AI Agent 能够可靠地从少量演示中抽象出语义不变量（semantic invariants），并正确定义 Skill Block 的适用范围（scope）和接地逻辑，从而在未见过的场景中实现泛化。** 如果这一假设不成立，即 Agent 无法准确区分演示中的“核心策略”与“特定实例细节”（如将特定物体的抓取姿态误认为是通用策略），生成的 Skill Blocks 将要么过于狭窄（无法复用），要么过于宽泛（在新场景中频繁失败）。在实际中，这一假设面临巨大挑战，因为当前的 LLM/VLM 在理解物理接触动力学、几何约束和细微的状态变化方面仍存在显著局限，容易受到演示中噪声或特定环境因素的误导。论文提供的证据主要基于 LIBERO 仿真环境中的受控实验，展示了 Agent 能够分解演示并生成在特定测试集上成功的块，但缺乏在高度复杂、非结构化真实物理世界中的大规模泛化验证。如果 Agent 的抽象能力不足，Experience Memory 将充满错误的因果归因，导致后续任务规划失效，整个“教与长”的闭环将退化为低效的试错或需要频繁的人工干预，从而丧失其避免全局重训练的核心优势。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 TGL 的核心机制：**从演示中诱导 Skill Block 并验证其在不同初始状态下的可重用性。** 具体方案如下：使用 LIBERO 仿真环境中的单一任务（如 `pick-and-place`），收集 3-5 条不同初始物体位置的成功演示轨迹。实现一个简化的 Agent 模块（可使用现成的 VLM API 如 GPT-4o 或 Claude），输入演示的关键帧和动作序列，要求其输出一个结构化的 Skill Block 描述，包括子目标（subgoal）、适用范围（scope）和接地变量（grounding variables）。随后，在 10 个未见过的初始状态下，利用该 Skill Block 的描述调用底层的几何抓取规划器（如 Contact-GraspNet）和运动规划器执行任务。测量指标为任务成功率以及 Agent 生成的 Block 描述在跨场景时的一致性。如果成功率显著高于随机基线且 Block 描述能正确忽略演示中的特定坐标而保留语义关系，则支持了“演示可转化为可重用抽象”这一核心 claim；反之，若成功率低或 Block 过度拟合演示细节，则反驳了该假设的有效性。此实验无需复现完整的 Experience Memory 或长期学习循环，仅验证最基础的“Teach”到“Grow”的转化能力。", "research_value": "### § 11 最强反例设计\n\n要彻底挑战 Teach-and-Grow Learning (TGL) 的有效性，最有力的反例设计应聚焦于**“语义抽象的脆弱性”与“物理接触的非线性耦合”**之间的冲突，具体通过一个**“高动态接触依赖任务”（High-Dynamic Contact-Dependent Task）**的实验来证伪其核心假设。\n\n**实验设计：柔性物体堆叠与姿态保持（Flexible Object Stacking \u0026 Pose Maintenance）**\n选择一个涉及显著形变、摩擦依赖和连续接触力反馈的任务，例如“将一条湿毛巾折叠并整齐地堆叠在另一条毛巾上，且保持特定角度”。在此场景中，TGL 的 **Skill Blocks** 依赖于从演示中提取的“语义子目标”（如“抓取边缘”、“折叠”、“放置”）和“接地函数”（Grounding Function）。\n\n**攻击逻辑与预期失败模式：**\n1.  **接地函数的失效（Grounding Failure）**：TGL 假设 Agent 可以通过视觉观测（如关键点或边界框）将抽象变量映射到当前场景。然而，对于柔性物体，视觉上的“边缘”在物理上可能对应完全不同的力学状态（例如，干燥时的硬边与湿润时的软塌边缘）。如果 Agent 从演示中提取的接地逻辑仅基于几何特征（Geometric Features），而忽略了材料属性（Material Properties）和接触力学（Contact Mechanics），那么在真实世界中，即使视觉接地成功，执行器（Executor）施加的力也会导致物体滑移或过度形变，导致任务失败。\n2.  **Skill Block 的不可复用性（Non-Reusability of Skill Blocks）**：TGL 声称 Skill Blocks 是“闭环”且“可复用”的。但在柔性物体任务中，成功的策略高度依赖于实时的力觉反馈（Force Feedback）和微小的姿态调整，这些往往无法被抽象为离散的、基于视觉的 **Semantic Subgoals**。如果 Agent 试图将“折叠”抽象为一个固定的 **Skill Block**，它必须忽略演示中细微的力控调整。当在新场景中复用时，由于缺乏对接触动力学（Contact Dynamics）的显式建模，Block 将退化为开环执行，导致高失败率。\n3.  **替代解释（Alternative Explanation）**：如果 TGL 在此类任务中表现不佳，这并非因为“重训练税”问题未解决，而是因为其核心架构错误地将**物理交互问题简化为语义规划问题**。现有的 VLA 模型虽然也有局限，但它们通过端到端映射隐式地学习了部分动力学特征。TGL 通过显式抽象剥离了这些隐式知识，导致在需要精细物理交互的任务中性能反而低于基线。这将证明 TGL 的“非破坏性增长”是以牺牲物理鲁棒性为代价的，且其 **Experience Memory** 中记录的“成功条件”在物理参数变化时完全失效，无法提供有效的迁移学习。\n\n**结论**：如果 TGL 在处理柔性物体或高摩擦依赖任务时，其 **Skill Blocks** 的复用成功率显著低于随机基线或需要频繁的人工干预来修正接地逻辑，则证明其“语义不变量”假设在物理世界中不成立，从而动摇其作为通用机器人学习架构的基础。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“语义技能块”到“物理原语库”：基于接触动力学感知的可组合机器人技能（Contact-Aware Composable Robot Primitives）**\n\n**（a）驱动局限与未满足需求：**\nTGL 的核心局限在于其 **Skill Blocks** 主要基于视觉-语义抽象，缺乏对**接触动力学（Contact Dynamics）**和**材料属性（Material Properties）**的显式建模。这导致其在处理非刚性物体、滑动接触或需要精细力控的任务时，**Grounding Function** 容易失效，且 **Skill Blocks** 难以在不同物理条件下复用。现有的方法要么完全依赖端到端学习（黑盒，缺乏可解释性和复用性），要么依赖显式几何规划（白盒，但难以处理复杂语义和不确定性）。我们需要一种新的框架，能够将**物理交互的底层原语（Physical Primitives）**与**高层语义目标（Semantic Goals）**解耦并重新组合，从而实现真正的物理鲁棒性和语义泛化。\n\n**（b）借鉴相邻领域的方法或工具：**\n借鉴**符号回归（Symbolic Regression）**和**系统辨识（System Identification）**领域的思想，结合**神经符号学习（Neuro-Symbolic Learning）**。具体而言，利用**接触感知神经网络（Contact-Aware Neural Networks）**来学习局部接触动力学模型，并将其封装为可微分的**物理原语（Physical Primitives）**。同时，借鉴**程序合成（Program Synthesis）**中的搜索算法，用于在物理原语空间中搜索满足高层语义约束的执行序列。\n\n**（c）第一个实验设计：**\n**实验名称：基于物理原语库的柔性物体操作泛化（Generalization of Flexible Object Manipulation via Physical Primitive Library）**\n\n1.  **构建物理原语库（Physical Primitive Library）**：\n    *   不直接从演示中提取语义 Skill Blocks，而是通过少量演示和物理仿真，学习一组基础的**接触原语（Contact Primitives）**，如“滑动抓取（Sliding Grasp）”、“柔性折叠（Flexible Fold）”、“张力保持（Tension Maintenance）”。每个原语包含一个局部动力学模型（Local Dynamics Model）和一个验证器（Verifier），能够实时监测接触力、形变和滑移。\n    *   这些原语是**参数化**的，能够适应不同的材料属性（如刚度、摩擦系数）。\n\n2.  **神经符号规划器（Neuro-Symbolic Planner）**：\n    *   设计一个规划器，输入高层语义指令（如“折叠毛巾”）和当前场景的物理属性估计（通过视觉和触觉传感器获取）。\n    *   规划器在物理原语库中搜索并组合原语，生成一个**物理感知的工作计划（Physically-Aware Working Plan）**。例如，将“折叠”分解为“滑动抓取边缘” -\u003E “施加张力” -\u003E “折叠” -\u003E “释放”。\n\n3.  **评估与对比**：\n    *   在 LIBERO 的柔性物体子集或自定义的柔性物体操作基准上，对比 TGL、端到端 VLA 和提出的物理原语方法。\n    *   **关键指标**：在不同材料属性（如不同湿度、不同织物类型）下的任务成功率、**原语复用率（Primitive Reusability）**以及**物理验证通过率（Physical Verification Pass Rate）**。\n    *   **预期结果**：提出的方法在处理物理属性变化时表现出更高的鲁棒性，因为物理原语显式地建模了接触动力学，而 TGL 的语义 Skill Blocks 因缺乏物理感知而失败。这将证明，真正的通用机器人学习需要将**物理原语**作为可复用的基本单元，而非仅依赖语义抽象。\n\n**与已有工作的区别：**\nTGL 关注的是**语义技能**的复用，假设物理执行可以通过接地函数适配；而本提议关注的是**物理原语**的复用，假设语义目标可以通过组合物理原语实现。前者是“自上而下”的语义驱动，后者是“自下而上”的物理驱动，两者结合可能才是通用机器人学习的完整路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Chang Nie\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zhe Liu\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Hesheng Wang\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"School of Automation and Intelligent Sensing, Shanghai Jiao Tong University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Shanghai Key Laboratory of Navigation and Location Based Services\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Corresponding author: Hesheng Wang (e-mail: wanghesheng@sjtu.edu.cn).\"\n    }\n  ]\n}\n```", "summary_translation": "端到端的视觉-语言-动作（VLA）和世界-动作模型为通用机器人提供了一条优雅的路径，但其可靠性受限于经过验证的物理覆盖范围。当不熟悉的物体、传感器、具身形态或接触超出该覆盖范围且不存在经过验证的后备方案时，纠正失败需要新的机器人数据、策略更新和回归测试。这种反复出现的负担被称为再训练税（retraining tax）。与文本不同，具身数据通常需要通过操作机器来创建。我们提出了 Teach-and-Grow Learning（TGL），一种以智能体为中心的通用机器人学习架构。在其一般形式中，多模态智能体将少量成功的演示转化为可重用的 Skill Blocks：用于有意义子目标的闭环行为。在新场景中，智能体会对这些块进行接地和组合，选择学习到的或几何工具，观察物理结果，并在执行偏离意图时修正路径。Skill Library 存储可执行的行为，而结构化的 Experience Memory 则传递成功、失败和修复经验。新任务的获取无需针对特定任务的策略再训练。我们的 LIBERO 评估达到了最先进的性能；控制研究揭示了技能归纳、持久重用和智能体导向的适应性。最后，我们提出了 Teach-and-Grow 缩放定律假设：如果 X 表示有效的可重用经验，那么未来任务的错误和教学需求应作为 X 的幂律趋近于不可约简的下限。因此，该架构将部署视为持续学习的时期，其中一项任务可以使下一项任务更容易。"}, {"title": "EvoTS-Agent: A Self-Evolving LLM Agent for Financial Time Series Change Point Detection", "arxiv_id": "2608.17933", "authors": "Lei Jiang, Ye Wei, Xinyu Xi, Jordan Langham-Lopez, Yifan Bao, Raad Khraishi, Yihao Ang, Anthony K. H. Tung, Lukasz Szpruch, Hao Ni", "summary": "Financial time series exhibit non-stationary and heterogeneous statistical properties, making change-point detection challenging because no single unsupervised algorithm performs consistently across assets and market regimes. Conventional workflows consequently depend heavily on expert-driven model selection, feature design, and hyperparameter tuning, limiting their scalability and adaptability. We propose EvoTS-Agent, a validation-guided self-evolving LLM agent for autonomous financial time-series change-point detection. EvoTS-Agent first performs curated exploratory data analysis to characterize dataset properties and initialize candidate detection models. It then evolves executable experiment trajectories through three complementary operators: \\textit{Revision} exploits the current best solution, \\textit{Alternative Strategy} explores fundamentally different modeling directions when progress stagnates, and \\textit{Recombination} synthesizes complementary evidence from high-performing trajectories. Validation feedback guides trajectory evolution throughout the search, enabling the agent to adapt its detection pipeline to the statistical characteristics of each dataset while preserving reliable optimization. Experiments across four benchmark datasets demonstrate that EvoTS-Agent consistently outperforms existing LLM-based agents while maintaining a 100\\% execution success rate across all evaluated backbone LLMs.", "category": "cs.AI", "cluster": "Self-Evolving \u0026 Adaptive Agents", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving, LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决金融时间序列中**Change Point Detection (CPD)** 的自动化与自适应难题。金融时间序列具有非平稳性（non-stationary）和异质性（heterogeneous）统计特性，导致没有任何单一的无监督算法能在所有资产和市场机制下保持一致的性能。传统工作流严重依赖领域专家进行模型选择、特征设计和超参数调整，这种人工干预不仅限制了可扩展性，也难以适应市场统计特性的动态变化。因此，核心研究问题是如何构建一个能够自主探索、评估并优化检测流程的代理系统，以应对不同数据集的特定统计分布。\n\n该问题的重要性在于，准确识别结构性转变对于风险管理、投资组合配置、欺诈检测及量化决策至关重要。然而，由于金融数据的噪声大、重尾分布及波动率时变等特性，手动配置检测管道（pipeline）既耗时又容易陷入局部最优。解决这一问题能带来显著价值：首先，它消除了对专家知识的过度依赖，实现了检测流程的自动化和规模化；其次，通过自适应调整检测管道，系统能更精准地捕捉不同市场机制下的结构变化，从而提高检测的鲁棒性和准确性；最后，该方法为金融时间序列分析提供了一个透明、可验证且基于证据的自动化框架，推动了从静态算法应用向动态实证搜索的范式转变。\n\n### § 2 前人工作与不足\n\n尽管**Change Point Detection** 领域已有大量研究，包括基于统计假设的经典方法（如 PELT, Bayesian inference）和基于深度学习的表示学习方法（如 KL-CPD），但这些方法通常针对特定类型的结构变化设计，缺乏通用性。在自动化方面，基于大语言模型（LLM）的代理系统（如 **ReAct**, **DS-Agent**, **ResearchAgent**, **TS-Agent**）已展现出在数据科学工作流中的潜力。然而，现有 LLM 代理在应用于自主 CPD 时存在显著不足。\n\n最相关的现有工作包括 **TS-Agent** 和 **DS-Agent**，它们通过检索增强或案例推理来复用先前解决方案，但往往遵循预定义的工作流或仅对当前解进行简单的迭代细化（iterative refinement）。这种范式缺乏明确的优化机制来决定何时利用当前策略（exploit）以及何时探索根本不同的建模方向（explore）。例如，**ResearchAgent** 虽然能迭代生成研究想法，但在 CPD 任务中容易陷入局部最优，一旦当前模型的微调不再带来显著改进，搜索就会停滞，无法有效切换策略。**SE-Agent** 虽然引入了轨迹进化概念，但其主要优化软件工程的推理轨迹，而非可执行的实验轨迹，且缺乏基于验证反馈的动态策略控制。\n\n现有方法的根本缺陷在于缺乏“停滞感知”（stagnation-aware）的控制机制和证据综合能力。它们通常孤立地处理实验轨迹，未能有效结合来自不同高绩效轨迹的互补证据。此外，检索系统在面对统计特性差异巨大的新数据集时，迁移效果往往不佳。因此，现有工作未能解决如何在无监督检测任务中，通过验证反馈动态平衡探索与利用，以及如何从多个成功实验中合成最优检测管道的问题，这正是 **EvoTS-Agent** 试图通过其独特的 **Revision**, **Alternative Strategy**, 和 **Recombination** 算子来解决的关键缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n在金融时间序列分析中，Change Point Detection (CPD) 长期面临一个核心困境：市场数据的非平稳性（Non-stationarity）和异质性（Heterogeneity）导致没有任何单一的无监督算法能在所有资产和市场状态下保持鲁棒性。传统的解决方案依赖于领域专家手动进行模型选择、特征工程和超参数调优，这种工作流不仅难以扩展，而且无法适应市场统计特性的动态变化。\n\n随着 Large Language Models (LLMs) 在自动化数据科学工作流（如 DS-Agent, TS-Agent）中的应用，研究者开始尝试用 LLM Agent 来替代人工进行模型搜索。然而，现有的 LLM Agent 范式在解决 CPD 问题时暴露出明显的局限性。首先，基于检索增强（Retrieval-based）的方法往往复用历史成功案例，但不同数据集的统计分布差异巨大，导致经验迁移效果不佳。其次，基于简单迭代优化（Iterative Refinement）的方法通常陷入“局部最优”陷阱：Agent 倾向于对当前最佳方案进行微调（Revision），一旦改进停滞，缺乏明确的机制去探索截然不同的建模方向（Exploration），导致搜索空间被限制在次优路径上。此外，现有方法通常将每次实验视为孤立的轨迹，未能有效合成来自不同成功实验的互补证据（Recombination）。\n\n因此，作者意识到需要一种新的 Agent 架构，它不应仅仅是一个代码生成器，而应是一个具备“自我进化”能力的实验搜索系统。这个系统需要能够：1) 通过探索性数据分析（EDA）理解当前数据的统计特性以初始化候选模型；2) 维护可执行的实验轨迹（Executable Experiment Trajectories），而不仅仅是推理日志；3) 设计一种由验证反馈（Validation Feedback）驱动的进化策略，明确区分“利用”（Exploitation，即对当前最佳方案的修订）和“探索”（Exploration，即在停滞时切换策略），并在最后阶段进行证据合成。这种从“固定工作流”到“自适应轨迹进化”的思维转变，构成了 EvoTS-Agent 的核心动机。\n\n### § 4 核心 Intuition\n\nEvoTS-Agent 的核心直觉是将自动化的 Change Point Detection 重构为一个基于验证反馈的**可执行实验轨迹进化过程**，而非简单的代码生成或静态模型选择。\n\n传统 Agent 失败的原因在于它们缺乏对搜索状态的感知，往往在局部最优解上反复微调而不知变通；EvoTS-Agent 通过引入**停滞感知（Stagnation-Aware）**机制，当对当前最佳方案（Incumbent）的修订不再带来显著性能提升时，强制触发**替代策略（Alternative Strategy）**以探索正交的建模方向，从而跳出局部最优。\n\n最终，该方法通过**重组（Recombination）**操作，将不同进化路径中发现的互补优势（如不同的数据表示或检测器配置）合成到最终方案中，实现了从单一轨迹优化到多轨迹证据合成的跨越，从而在复杂多变的金融时间序列中找到更鲁棒的检测管道。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nEvoTS-Agent 的核心方法是一个基于验证反馈（Validation-guided）的自进化 LLM Agent 框架，旨在自动化金融时间序列的 Change Point Detection (CPD)。其完整 Pipeline 包含以下关键步骤：\n\n1.  **EDA-based Model Selection (探索性数据分析与模型选择)**：\n    *   **输入**：原始金融时间序列数据。\n    *   **处理**：Agent 首先执行轻量级的 Exploratory Data Analysis (EDA)，提取元特征（Meta-features），如滞后自相关（Lag-1 autocorrelation）、趋势强度（Trend strength）、非平稳性（Non-stationarity）、频谱集中度（Spectral concentration）以及局部均值和方差差异（Local mean and variance discrepancies）。\n    *   **决策**：LLM 根据这些统计特征，从包含 8 种不同假设的 Model Bank（如 PELT, Bottom-up, KL-CPD 等）中筛选出最匹配的 Top-K 候选模型。\n\n2.  **Warm-up Stage (预热阶段)**：\n    *   **处理**：对选出的每个候选模型进行初始实现，并进行一次 Revision（修订），生成 $2 \\times K$ 个可执行的实验轨迹（Experiment Trajectories）。\n    *   **输出**：在 Validation Set 上评估这些轨迹，得分最高的成为初始 Incumbent（当前最佳解），存入 Trajectory Pool。\n\n3.  **Trajectory-guided Evolution (轨迹引导的进化优化)**：\n    这是核心循环，Agent 根据当前状态选择三种操作符之一来生成新的实验计划：\n    *   **Revision (修订/利用)**：默认操作。基于当前 Incumbent 和近期成功轨迹，微调代码、超参数或预处理步骤。旨在局部优化。\n    *   **Alternative Strategy (替代策略/探索)**：当 Revision 导致的性能提升低于阈值 $\\epsilon$（即 Stagnation，停滞）时触发。Agent 放弃当前方向，尝试完全不同的建模思路或未尝试过的 EDA 推荐模型。旨在跳出局部最优。\n    *   **Recombination (重组/合成)**：仅在最后一步执行。从多个高性能轨迹中提取互补优势（如一个轨迹的预处理好，另一个的检测器好），合成最终方案。\n\n4.  **Execution \u0026 Validation (执行与验证)**：\n    *   **处理**：LLM 生成 Python 脚本并自动执行。\n    *   **反馈**：计算 Validation F1 Score。如果新得分严格高于 Incumbent，则更新 Incumbent；否则保留原 Incumbent。无论是否更新，该次实验的完整记录（代码、日志、得分、父轨迹）都存入 Trajectory Pool，形成有向搜索图。\n\n**真实案例讲解（以 Bee-Dance 数据集为例，参考 Figure 5）：**\n\n*   **输入**：蜜蜂舞蹈运动轨迹数据（Bee-Dance Dataset），目标是识别行为阶段的转换点。\n*   **EDA 阶段**：Agent 分析数据发现强周期性（Periodicity=0.724）和高非平稳性（Non-stationarity=0.77）。LLM 据此选择 `Spectral` 和 `Bottom-up` 作为主要候选，`KLCPD` 作为备选。\n*   **进化过程**：\n    1.  **初始**：`Spectral` 检测器作为 Incumbent，F1=0.3425。\n    2.  **Revision**：Agent 尝试优化 `Spectral` 的边界过滤和后处理，F1 提升至 0.5859。\n    3.  **Stagnation**：继续修订 `Spectral` 导致性能下降或停滞（F1 降至 0.0556 或无显著提升）。Agent 检测到停滞。\n    4.  **Alternative Strategy**：Agent 切换策略，尝试 `Bottom-up` 检测器家族。\n    5.  **Revision (New Path)**：在 `Bottom-up` 基础上调整阈值和最小间隔，F1 提升至 0.6258。\n    6.  **Recombination**：在最后一步，Agent 结合 `Spectral` 轨迹中的某些预处理优势和 `Bottom-up` 的检测逻辑，生成最终配置。\n*   **输出**：最终验证集 F1 达到 0.8631 的最佳检测管道，并输出对应的 Change Point 位置。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过。**\n\n本文主要侧重于 Agent 架构设计、搜索策略（Revision/Alternative/Recombination）的工程实现以及基于验证反馈的启发式搜索，而非提出新的数学理论或推导新的检测算法公式。文中涉及的数学公式主要用于定义问题设置（如 Change Point Detection 的目标函数、局部均值/方差差异统计量），属于标准的时间序列分析定义，没有复杂的理论推导过程。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有的 LLM Agent 在金融时间序列 Change Point Detection 任务中存在局限性：它们通常遵循固定的工作流或仅对单一解进行迭代修订（Repeated Revision），缺乏对搜索停滞（Stagnation）的感知，无法有效探索不同的建模方向，且难以综合多个实验中的互补证据，导致容易陷入局部最优且执行成功率低。\n\n**2. 设计了什么实验验证这个问题？**\n*   **基准对比实验**：在四个具有不同统计特性的数据集（合成数据 OU Process, Mean-Variance Shift；真实/半真实数据 ADIA, Bee-Dance）上，将 EvoTS-Agent 与现有的 SOTA LLM Agent（TS-Agent, DS-Agent, ResearchAgent）进行对比。使用多种 Backbone LLMs（GPT-4o, GPT-5.4, Sonnet-4.6, Sonnet-5）以确保鲁棒性。\n*   **消融实验（Ablation Study）**：在 Bee-Dance 数据集上，分别移除 `Alternative Strategy` 和 `Recombination` 模块，验证这两个核心进化操作对最终性能（F1, Precision, Recall）的具体贡献。\n*   **模型库对比**：将 Agent 的最终结果与 Model Bank 中各个独立检测器（如 PELT, KL-CPD 等）在手动配置下的性能进行对比，证明自适应选择优于固定算法。\n\n**3. 问题的答案是什么？**\n*   **性能优越性**：EvoTS-Agent 在所有数据集和大多数 Backbone LLM 上均取得了最高或极具竞争力的 F1 分数，特别是在复杂的 ADIA 数据集上，Hausdorff Distance 显著降低，证明其能更好地适应多断点场景。\n*   **可靠性**：EvoTS-Agent 在所有测试中保持了 **100% 的执行成功率**，而基线模型（如 ResearchAgent）在某些 LLM 上成功率低至 33.3%，证明其架构更稳定。\n*   **策略有效性**：消融实验表明，`Alternative Strategy` 有助于避免局部最优（提高 Precision/Recall 平衡），而 `Recombination` 有助于整合证据（显著提高 Recall）。这证实了“验证引导的轨迹进化”比单纯的“迭代修订”更有效。\n*   **自适应能力**：相比固定检测器，EvoTS-Agent 能通过 EDA 和进化过程自动找到最适合当前数据分布的检测器和配置，证明了其泛化能力和自动化潜力。", "additional_insights": "### § 8 Take-aways\n\nEvoTS-Agent 的核心创新在于将金融时间序列的 Change Point Detection (CPD) 重构为一个基于验证反馈的轨迹进化过程，而非传统的静态模型选择或简单的迭代微调。该框架通过三个互补的操作符——Revision（利用当前最优解）、Alternative Strategy（在停滞时探索正交方向）和 Recombination（最终合成互补证据）——解决了现有 LLM Agent 在复杂搜索空间中容易陷入局部最优且缺乏探索机制的问题。通过引入 curated EDA 阶段，Agent 能够提取时间序列的元特征（如非平稳性、频谱集中度）来初始化候选模型池，从而缩小搜索空间并提高初始解的质量。实验结果表明，EvoTS-Agent 在四个基准数据集上不仅实现了最高的 F1 分数，还保持了 100% 的执行成功率，显著优于 TS-Agent、DS-Agent 等基线方法，证明了其代码生成和实验执行的鲁棒性。消融研究证实，Alternative Strategy 对于避免搜索停滞至关重要，而 Recombination 则有效提升了最终检测的召回率，表明多轨迹证据合成是提升性能的关键。尽管该方法依赖于验证集标签进行进化引导，但其通过自适应调整检测管道（包括数据表示、检测器配置和后处理规则）来匹配特定数据集统计特性的能力，展示了在异构金融数据上的强大泛化性。\n\n### § 9 最脆弱的假设\n\nEvoTS-Agent 最脆弱且代价最大的假设是：**在真实的金融应用场景中，存在高质量、无泄露的验证集标签（Validation Annotations）用于指导 Agent 的进化过程。** 论文明确指出，虽然底层的 CPD 检测器是无监督的，但 Agent 的模型选择、轨迹保留和进化策略完全依赖于验证集上的 F1 分数等监督信号。在实际金融市场中，结构断点（Structural Breaks）往往具有滞后性，且缺乏公认的“Ground Truth”；专家标注成本极高且存在主观性，而使用历史事件作为标签可能导致未来函数（Look-ahead Bias）或分布偏移。如果这一假设不成立，即无法获得可靠的验证标签，EvoTS-Agent 的整个闭环优化机制将失效，因为它无法区分“好的”实验轨迹和“坏的”轨迹，从而退化为盲目的随机搜索。论文在 Limitation 部分承认了这一点，并指出获取此类标签需要专家标注或历史真实事件，但并未提供在无标签或弱标签场景下的替代方案或鲁棒性证据，这使得该方法在缺乏标注基础设施的实际部署中面临根本性障碍。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 EvoTS-Agent 的核心进化逻辑，重点验证 **Alternative Strategy 在解决搜索停滞问题上的有效性**，而无需构建完整的 EDA 和模型库。具体方案如下：使用论文提供的 **Bee-Dance 数据集**（或简单的合成 Mean-Variance Shift 数据），仅选取 **PELT** 和 **Bottom-Up** 两种检测器作为候选。实现一个简化的 Agent 循环：初始阶段随机选择一个检测器并运行；随后进入进化阶段，定义一个停滞阈值 $\\epsilon$（如 F1 提升小于 0.01）。当连续两次 Revision（微调超参数）未能突破阈值时，强制触发 Alternative Strategy（切换到另一种检测器）。测量指标为：在固定预算（如 20 次迭代）内，启用 Alternative Strategy 的 Agent 与仅使用 Revision 的 Baseline Agent 的最终 F1 分数对比。如果启用 Alternative Strategy 的 Agent 在多次运行中显著高于 Baseline，且能跳出低分局部最优，则支持了论文关于“停滞触发探索”的核心 claim；反之，若两者性能无差异或 Baseline 更稳定，则质疑该进化策略的必要性。此实验避开了复杂的代码生成和 EDA 模块，直接验证了进化策略的核心价值。", "research_value": "### § 11 最强反例设计\n\n针对 **EvoTS-Agent** 最致命的攻击在于揭示其“验证引导进化”机制在真实金融场景中的**因果倒置**与**过拟合陷阱**。虽然论文声称解决了无监督 CPD 的自动化问题，但其核心优化信号（Validation F1 Score）完全依赖于带有标签的验证集，这本质上将无监督学习问题转化为了有监督的超参数搜索问题。\n\n**反例场景：结构性断点的滞后性与标注噪声（Lag and Label Noise in Structural Breaks）**\n\n在真实的金融市场中，结构性断点（Structural Breaks）往往不是瞬时发生的，而是伴随着波动率聚集（Volatility Clustering）和均值回归的渐进过程。更重要的是，Ground Truth 标签通常由事后专家标注或基于重大新闻事件定义，存在显著的**滞后性（Lag）**和**主观性**。\n\n**具体攻击实验设计：**\n\n1.  **构建“模糊断点”数据集（Ambiguous Breakpoint Dataset）**：\n    *   不使用论文中清晰的合成数据（如 OU Process）或行为数据（Bee-Dance），而是构建一组高噪声、低信噪比（SNR）的真实股票收益率序列。\n    *   在这些序列中，人为引入“伪断点”（Pseudo-breaks）：即统计特性发生短暂剧烈波动（如单日暴跌 5%），但随后迅速回归原分布，且无基本面新闻支持。同时，引入“真实但滞后”的断点：统计特性缓慢漂移，但官方认定的断点日期比实际统计变化晚 2-4 周。\n    *   标签设定：使用两种标签体系。Label A 为“即时统计断点”（基于滚动窗口统计检验），Label B 为“事后专家断点”（基于新闻事件）。\n\n2.  **验证“验证集泄露”导致的过拟合**：\n    *   运行 **EvoTS-Agent**，使用 Label B（专家断点）作为 Validation Set 进行进化。\n    *   观察 Agent 是否倾向于生成复杂的后处理规则（Post-processing rules），这些规则专门用于捕捉 Label B 中的特定噪声模式或滞后特征，而非通用的统计异常。\n    *   **关键测试**：将进化出的最佳 Pipeline 应用于一个**未见过的、具有相同统计特性但断点时间分布不同**的测试集（Test Set），并使用 Label A（即时统计断点）进行评估。\n    *   **预期结果**：如果 **EvoTS-Agent** 的 F1 分数在测试集上显著下降，且其检测到的断点与 Label A 高度不匹配，则证明 Agent 并没有学习到鲁棒的统计变化检测能力，而是**过拟合了验证集的标注偏差（Annotation Bias）**。\n\n3.  **对比基线：无监督稳定性指标**：\n    *   引入一个不使用任何标签、仅基于**统计稳定性（Statistical Stability）**或**预测误差突变（Prediction Error Spike）**的简单无监督基线（如基于 LSTM 的预测残差检测）。\n    *   如果该简单基线在 Label A 上的表现优于 **EvoTS-Agent**，则证明 **EvoTS-Agent** 的复杂进化机制在缺乏可靠即时标签时，反而引入了不必要的方差和偏差，其“自进化”能力在真实噪声环境中失效。\n\n**理论论证：**\n该反例挑战了论文的核心假设：**“验证集标签能准确反映模型对数据分布变化的泛化能力”**。在金融时间序列中，标签本身是噪声的函数。如果 Agent 优化的是对噪声标签的拟合，而非对潜在数据生成过程（Data Generating Process, DGP）变化的检测，那么其“自进化”只是在优化一个错误的目标函数。这揭示了 **EvoTS-Agent** 在缺乏高质量、即时、无偏标签的真实部署中，可能退化为一个昂贵的、过拟合的曲线拟合器，而非通用的 CPD 工具。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“验证引导”到“因果不变性引导”的无监督自进化 CPD Agent**\n\n**（a）驱动局限与未满足需求：**\n**EvoTS-Agent** 的根本局限在于其对**监督信号（Supervised Signal）**的依赖，这在真实金融场景中不可持续。现有的无监督 CPD 方法（如 PELT, KL-CPD）虽然不需要标签，但缺乏自适应能力，无法根据数据特性自动选择最优算法或调整超参数。因此，存在一个巨大的空白：**如何在不使用任何标签的情况下，让 LLM Agent 自主评估和优化 CPD 管道？** 我们需要一种新的评估范式，不依赖于“是否正确检测了断点”，而是依赖于“检测到的断点是否揭示了数据生成机制的因果不变性（Causal Invariance）”。\n\n**（b）借鉴相邻领域的方法：**\n借鉴**因果发现（Causal Discovery）**和**域泛化（Domain Generalization）**领域的**不变风险最小化（Invariant Risk Minimization, IRM）**思想。在因果推断中，真正的因果机制在不同环境（Environments）下是保持不变的，而混淆因素（Confounders）则会变化。我们可以将时间序列的不同子段视为不同的“环境”，将 CPD 的目标重构为：**寻找一个检测器，其输出的断点位置能最大化后续子段统计特性的“不变性”或“可预测性”**。\n\n**（c）第一个实验设计：**\n\n1.  **新框架：Causal-Invariant EvoTS-Agent**\n    *   **移除 Validation F1**：完全移除对标签的依赖。\n    *   **引入“环境一致性”评分（Environmental Consistency Score, ECS）**：\n        *   当 Agent 提出一个候选 CPD 管道时，执行检测。\n        *   将检测出的断点作为分割点，将时间序列划分为多个子段（Segments）。\n        *   在每个子段内，训练一个简单的预测模型（如 ARIMA 或 LSTM），并计算其在**跨子段**的预测误差方差。\n        *   **核心假设**：如果断点检测准确，那么每个子段内部的统计特性应该是同质的（Homogeneous），且预测模型在该子段内的表现应该稳定；反之，如果断点错误，子段内仍包含混合机制，预测误差会波动剧烈。\n        *   **ECS 定义**：$ECS = - \\text{Var}(\\text{Prediction Error across Segments})$。Agent 的目标是最大化 ECS，即最小化跨段预测误差的波动，从而确保每个段内的机制是“因果不变”的。\n\n2.  **进化算子调整：**\n    *   **Revision**：微调超参数以最大化 ECS。\n    *   **Alternative Strategy**：当 ECS 停滞时，尝试不同的数据变换（如差分、对数变换）或不同的检测器家族，以探索不同的因果结构假设。\n    *   **Recombination**：合成在不同数据变换下均能保持高 ECS 的检测逻辑。\n\n3.  **实验验证：**\n    *   **数据集**：使用真实的金融高频交易数据（如 Order Book 数据），其中断点由微观结构变化（如交易策略切换）引起，无明确标签。\n    *   **对比基线**：\n        *   **EvoTS-Agent (Supervised)**：使用事后标注的标签。\n        *   **Traditional Unsupervised (PELT, KL-CPD)**：固定算法。\n        *   **Causal-Invariant EvoTS-Agent (Proposed)**：无标签，基于 ECS。\n    *   **评估指标**：\n        *   **下游任务性能**：使用检测出的断点作为特征，训练一个简单的交易策略或波动率预测模型。如果 **Causal-Invariant EvoTS-Agent** 检测出的断点能显著提升下游模型的**样本外（Out-of-Sample）**表现，则证明其检测到了具有经济意义的结构性变化，而非统计噪声。\n        *   **稳定性分析**：分析检测出的断点在不同时间窗口下的稳定性。\n\n**与已有工作的区别：**\n现有工作（包括 **EvoTS-Agent**）将 CPD 视为一个**模式匹配（Pattern Matching）**问题，依赖标签进行监督。本提议将 CPD 重构为一个**因果结构学习（Causal Structure Learning）**问题，利用**不变性（Invariance）**作为无监督的优化目标。这不仅解决了标签依赖问题，还提升了检测结果的经济学解释性和鲁棒性，打开了“因果感知时间序列分析”的新研究方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Lei Jiang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Jordan Langham-Lopez\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yihao Ang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Ye Wei\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Yifan Bao\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Anthony K. H. Tung\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Xinyu Xi\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Raad Khraishi\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Lukasz Szpruch\",\n      \"affiliations\": [\n        5\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Hao Ni\",\n      \"affiliations\": [\n        6\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Alan Turing Institute\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"National University of Singapore\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"University of Oxford\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"NatWest AI Research\"\n    },\n    {\n      \"id\": 5,\n      \"name\": \"University of Edinburgh\"\n    },\n    {\n      \"id\": 6,\n      \"name\": \"University College London\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"∗\",\n      \"text\": \"These authors contributed equally to this work.\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"These authors are corresponding authors.\"\n    }\n  ]\n}\n```", "summary_translation": "金融时间序列表现出非平稳性和异质性的统计特性，使得变点检测具有挑战性，因为没有一种无监督算法能在不同资产和市场状态下保持一致的性能。因此，传统工作流程严重依赖专家驱动的模型选择、特征设计和超参数调整，限制了其可扩展性和适应性。我们提出了 EvoTS-Agent，这是一种由验证引导的自进化大语言模型（LLM）智能体，用于金融时间序列的自主变点检测。EvoTS-Agent 首先执行精心设计的探索性数据分析，以表征数据集特性并初始化候选检测模型。随后，它通过三个互补的操作符进化可执行的实验轨迹：\\textit{Revision} 利用当前最优解，\\textit{Alternative Strategy} 在进展停滞时探索根本不同的建模方向，而 \\textit{Recombination} 则从高性能轨迹中综合互补证据。验证反馈在整个搜索过程中指导轨迹进化，使智能体能够根据每个数据集的统计特性调整其检测流程，同时保持可靠的优化能力。在四个基准数据集上的实验表明，EvoTS-Agent 始终优于现有的基于 LLM 的智能体，并且在所有评估的基础 LLM 上保持了 100% 的执行成功率。"}, {"title": "SAGE: Self-Evolving Storyboard Skills via Attribution-Guided Rule Evolution", "arxiv_id": "2608.17468", "authors": "Maolin Ran, Xiaoyang Lu, Jiaqi Liu, Jian Wang, Weiwen Liu, Jianghao Lin, Yong Yu, Weinan Zhang", "summary": "Storyboards turn screenplays into visual shot plans for automated short drama production. Professional storyboarding relies on tacit directorial expertise and remains an industrial bottleneck. Large language models can automate this step, but methods for supplying directing knowledge face three challenges: (1) Knowledge acquisition: the craft remains implicit in exemplars or must be written manually. (2) Knowledge refinement: authored knowledge is not evaluated against execution outcomes, and opaque generation prevents feedback attribution to the knowledge behind each decision. (3) Knowledge injection: injecting all knowledge exceeds usable context, while manual selection for every narrative group does not scale. We present SAGE (Skill with Attribution-Guided Evolution), a deployed framework that learns, attributes, evolves, and routes directing knowledge from expert demonstrations. SAGE derives rules that are independent of episode content by contrasting each training screenplay with its expert storyboard. During generation, the model records each narrative group's adopted rules. Combining these records with localized feedback enables targeted updates to individual rules. Evolved rules form scenario packages with a routing index, so each group retrieves only a bounded set appropriate to its situation without expert intervention. On 18 test episodes across three genres, SAGE scored 77.8 on a rubric validated by experts, versus 77.1 for professional directors. Deployed for 14 days on Virtual Film Studio, SAGE produced 1,344 narrative group outputs; 87.2 percent were accepted without substantive edits, and the production team recorded over 83 percent less authoring time per episode. We release PROSE, the first public dataset pairing screenplays with storyboards by professional directors across 68 episodes: https://github.com/creDreams/PROSE.", "category": "cs.AI", "cluster": "Self-Evolving \u0026 Adaptive Agents", "tags": ["cs.AI"], "filter_reason": "该论文完全符合“自我演化 (Self-Evolving)”这一核心研究方向。\n\n1. 核心机制匹配：论文标题明确包含 \"Self-Evolving\" 和 \"Rule Evolution\"。摘要指出，SAGE 框架能够从专家演示中学习、归因、演化并路由导演知识。其核心贡献在于提出了一种机制，通过对比训练剧本与专家分镜，提取独立于内容的规则，并在生成过程中记录规则使用情况，结合局部反馈对单个规则进行针对性更新（targeted updates）。这属于典型的“智能体通过经验/反馈进行自我完善和迭代”的范畴。\n2. 符合保留标准：根据筛选标准第一步中的保留规则，“如果论文的核心机制是 self-evolving / self-improving / iterative improvement... 即使对象是... 模型训练，也应优先保留”。此外，该论文涉及“Skill Acquisition”（技能获取）和“Harness Refinement”（通过演化规则来优化智能体的执行策略），属于构建和改进 LLM 智能体能力的研究。\n3. 非单纯应用：虽然应用场景是电影分镜（Storyboarding），但论文的重点不在于解决电影制作本身的问题，而在于提出一种通用的、基于归因引导的规则演化框架，使 LLM 能够自动化地获取和精炼隐性知识（tacit knowledge）。这符合“领域是场景，机制才是贡献”的保留例外情况。\n4. 无排除项：论文不涉及安全、对齐、多模态视觉核心研究（分镜是文本到文本/结构的规划，而非视觉生成模型研究）、图神经网络或多智能体拓扑编排等排除项。\n\n综上，该论文研究的是 LLM 智能体如何通过反馈机制自我演化其内部规则/技能，高度契合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决大型语言模型（LLMs）在自动化分镜脚本（Storyboard）生成中面临的**导演专业知识（Directorial Knowledge）**获取、精炼与注入的三大核心挑战。具体而言，研究问题聚焦于如何构建一个能够自我演进的框架，从专家演示中自动提取显式规则，通过归因机制（Attribution Mechanism）将执行反馈精确映射到具体规则以进行迭代优化，并在推理时通过路由索引（Routing Index）高效检索相关知识，从而克服上下文窗口限制。\n\n这一问题的重要性源于短视频与短剧（Short Drama）产业的工业化瓶颈。尽管视频生成模型日益成熟，但分镜作为连接创意意图与视频合成的中间产物，其质量直接决定了下游视频的连贯性与电影感。目前，分镜制作高度依赖专业导演的隐性知识（Tacit Expertise），如镜头节奏、景别、角度及运镜的联合决策，这导致人工制作耗时极长（单集超过一小时），成为制约产能的关键瓶颈。现有的LLM方案缺乏专业的镜头语言（Camera Language）能力，直接生成往往导致视角扁平、无法传达权力动态等叙事缺陷。\n\n解决该问题的价值体现在三个层面：首先，在技术层面，SAGE框架实现了从隐性知识到显式、可解释规则库的自动化转化，并通过规则级归因（Rule-level Attribution）解决了传统自我修正中反馈信号模糊的问题，使知识进化具备收敛性。其次，在性能层面，SAGE在专家验证的评分标准下得分（77.8）超越了人类专业导演（77.1），证明了AI在特定垂直领域达到专家水平的可行性。最后，在工业应用层面，该框架在商业平台Virtual Film Studio的部署中，将单集制作时间从一小时缩短至10分钟（效率提升83%以上），且87.2%的输出无需实质性修改即可进入生产流程，真正实现了从“手动创作”到“人工审核”的范式转移，释放了巨大的生产力。\n\n### § 2 前人工作与不足\n\n尽管已有研究尝试将知识注入LLM以辅助分镜生成，但现有方法在知识表示、优化粒度及检索效率上存在显著不足。\n\n在**知识获取与表示**方面，Few-shot Prompting和Chain-of-Thought (CoT) 是主流方法。Few-shot通过提供剧本-分镜对示例，让模型隐式学习导演技巧，但知识仍隐含在示例中，模型需在推理时重新归纳，缺乏可检查、可复用的显式形式。CoT虽由专家编写推理链，但依赖人工逐条撰写，无法规模化，且知识一旦固定便无法根据执行结果进行动态修正。此外，如DramaDirector等系统通过SFT和GRPO微调LLM，将电影知识隐式编码在模型权重中，导致知识不可解释且难以针对特定场景进行局部调整。\n\n在**知识精炼与归因**方面，现有的自我进化代理（Self-evolving Agents）如Self-Refine、Reflexion或AutoManual，通常基于轨迹级（Trajectory-level）或任务级（Task-level）的反馈进行迭代。例如，AutoManual虽能引用规则，但其学习信号来自二值化的 episodic rewards，且规则修订基于对整个轨迹的后验判断。这种粗粒度的反馈无法区分具体是哪一条规则导致了生成偏差（Credit Assignment Problem）。当生成过程不透明时，无法将反馈归因于特定的知识单元，导致“误火”规则（Misfiring Rules）无法被精准修正，而未被使用的规则也无法被及时淘汰。实验表明，缺乏归因的迭代往往在早期达到峰值后性能下降，因为优化变成了无方向的扰动而非真正的优化。\n\n在**知识注入与检索**方面，随着规则库的增长，将所有知识注入上下文会超出LLM的处理能力，而手动选择相关知识又无法扩展。现有的自动检索方法（如FilMaster）通常基于预定义的粗粒度知识单元或从成品视频中逆向工程的标注（如SkyScript-100M），这些标注反映的是最终屏幕呈现而非导演的决策过程，且缺乏对叙事情境的细粒度匹配。SAGE指出的关键不足在于，缺乏一种机制能将演化后的规则自动聚类为情境包（Scenario Packages），并通过路由索引在推理时仅检索与当前叙事组（Narrative Group）匹配的知识子集，从而在保证知识相关性的同时控制上下文成本。\n\n综上所述，前人工作要么知识隐式不可控，要么优化信号粗粒度导致进化不稳定，要么检索机制缺乏情境感知能力。SAGE通过引入规则级归因和情境感知路由，填补了从专家演示到可部署、可进化、高精度分镜生成技能之间的空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在短视频自动化生产流水线中，Storyboard 是连接剧本与视频生成的关键中间件，其质量直接决定了下游视频的叙事连贯性与电影感。然而，现有的 Large Language Models (LLMs) 在缺乏专业导演知识（如镜头语言、景别选择、运镜逻辑）的情况下，生成的分镜往往缺乏专业深度，表现为视角扁平、节奏混乱。\n\n为了解决这一问题，工业界和学术界尝试了多种知识注入机制。Few-shot prompting 通过提供示例让模型隐式学习，但模型无法显式复用这些知识，且推理时需重新归纳；Chain-of-Thought (CoT) 和 Skill 文件虽然显式化了知识，但依赖人工编写，难以规模化，且一旦写入便固定不变，无法根据生成结果进行自我修正。更关键的是，现有的 Self-evolving agents 或 Skill optimization 方法（如 EvoSkill, SkillOpt）通常将自然语言知识视为整体参数，通过整体验证分数（scalar validation score）来更新整个技能文档。这种粗粒度的优化存在严重的 Credit Assignment 问题：当生成结果不佳时，系统无法知道是哪一条具体的规则导致了错误，因此只能进行盲目的整体重写或丢弃，导致优化过程不稳定，甚至出现性能退化。\n\n此外，知识检索也面临挑战。如果将所有规则注入 Context，会超出 LLM 的上下文窗口；如果手动挑选，则无法扩展。现有的自动检索往往基于预定义的单元，缺乏对具体叙事情境（Narrative Situation）的细粒度匹配。\n\n因此，作者意识到，要突破这一瓶颈，必须将知识视为可学习的离散参数，并解决两个核心问题：一是如何从专家演示中自动提取显式规则（解决知识获取）；二是如何建立细粒度的归因机制，将生成结果的反馈精确映射到具体的规则上，从而实现规则的针对性进化（解决知识精炼与归因）。同时，需要通过语义聚类将进化后的规则打包为 Scenario Packages，以便在推理时根据情境动态检索，解决知识注入的扩展性问题。这一思路引导出了 SAGE 框架：通过对比剧本与专家分镜提取无内容规则，在生成时记录规则采纳情况（Rule-adoption records），结合局部反馈进行规则级的诊断与更新，最终形成可路由的场景化知识包。\n\n### § 4 核心 Intuition\n\n现有方法将自然语言知识视为不可分割的整体，导致反馈信号模糊，无法区分哪些规则有效、哪些无效，从而陷入盲目优化的困境。SAGE 的核心直觉是引入“规则级归因”（Rule-level Attribution），通过在生成过程中显式记录每个决策所采用的具体规则，将全局的生成质量反馈精确拆解并分配给个体规则。这种细粒度的 Credit Assignment 使得系统能够针对性地修正错误规则、填补覆盖空白或淘汰无用规则，从而将知识进化从随机的扰动转化为稳定的优化过程，最终实现超越人类专家的专业分镜生成能力。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nSAGE (Skill with Attribution-Guided Evolution) 的核心方法是将 LLM 的 **Skill** 定义为工作流（Workflow）与知识库（Knowledge Base）的解耦组合，并通过 **Attribution-Guided Rule Evolution** 机制，从专家演示数据中自动提取、评估并进化规则。其完整 Pipeline 分为三个阶段：\n\n1.  **Stage 1: Attribution-Guided Rule Evolution (规则进化)**\n    *   **输入**：剧本（Screenplay）$S$ 和专家分镜脚本（Expert Storyboard）$B^*$。\n    *   **处理**：\n        *   **Rule Extraction (规则提取)**：对比剧本与专家分镜，提取无内容依赖的通用规则（Content-free rules），格式为 `(condition, practice)`，例如“当发生权力压制时，使用低角度镜头”。\n        *   **Attributed Generation (归因生成)**：LLM 根据当前规则集生成分镜，并显式声明每个叙事组（Narrative Group）采用了哪些规则，形成 **Rule-adoption record** $A$。\n        *   **Alignment Evaluation (对齐评估)**：使用 $f_{align}$ 将生成结果与专家分镜对比，输出维度级反馈（如“镜头角度缺乏张力”）。\n        *   **Attribution-Guided Diagnosis (归因诊断)**：结合反馈与 $A$，进行细粒度信用分配。若某规则被采用但导致错误（Class A），则修订该规则；若未采用任何规则但出现错误（Class B），则新增规则；从未被采用的规则被退役。\n    *   **输出**：进化后的规则集 $R^{(t+1)}$。\n\n2.  **Stage 2: Rule Consolidation (规则整合)**\n    *   **输入**：所有训练剧集进化后的冗余规则集。\n    *   **处理**：\n        *   **Deduplication (去重)**：基于条件（Condition）和实践（Practice）的嵌入相似度合并重复规则。\n        *   **Clustering (聚类)**：使用 UMAP 降维和 K-means 聚类，将语义相似的规则分组。\n        *   **Scenario Packaging (场景打包)**：为每个簇生成可读的场景名称（如“权力威胁/主导对峙”）和描述，形成 **Scenario Package**。\n    *   **输出**：带有路由索引（Routing Index）的场景包集合。\n\n3.  **Stage 3: Scenario-Aware Inference (场景感知推理)**\n    *   **输入**：未见过的测试剧本 $S_{test}$。\n    *   **处理**：\n        *   **Narrative Grouping**：将剧本划分为叙事组。\n        *   **Scenario Routing**：根据叙事组的情境，通过路由索引检索 Top-$k$ 匹配的场景包。\n        *   **Rule Injection \u0026 Generation**：将检索到的规则注入 LLM，生成分镜片段，并记录规则采用情况。\n    *   **输出**：完整的分镜脚本 $B$。\n\n**真实例子讲解：**\n假设输入剧本片段为“Victor 威胁 Victor 的玩具男孩”。\n1.  **进化阶段**：系统发现专家在此处使用了“低角度推镜头”以强化 Victor 的支配地位。提取规则：“当强势角色发起攻击时，使用低角度”。在生成中，若模型采用了该规则但角度不够低，反馈指出“缺乏压迫感”，系统修订规则为“使用显著低角度”。\n2.  **整合阶段**：该规则与来自其他剧集的类似规则（如“反派登场”）聚类，形成“Power Threat”场景包。\n3.  **推理阶段**：遇到新剧本中类似的威胁场景，系统检索到“Power Threat”包，注入规则，生成带有低角度推镜头的分镜，无需人工干预。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的传统数学推导（如梯度下降或概率模型推导），其核心在于将 **Rule Set** 视为可学习的离散参数，并定义了一个优化目标。\n\n**理论背景与 Intuition：**\n传统机器学习通过梯度更新连续权重。SAGE 将自然语言规则视为“离散参数”，优化过程是通过 **Credit Assignment**（信用分配）来更新这些参数。\n\n**核心公式与解释：**\n$$ \\max_{R} \\frac{1}{m} \\sum_{j=1}^{m} f_{align}(g_{\\Sigma}(S_j), B^*_j) $$\n\n*   **$R$ (Rule Set)**：相当于神经网络中的权重 $W$。它是我们要优化的对象。\n*   **$g_{\\Sigma}(S_j)$**：生成函数。$\\Sigma = (W, R)$ 是 Skill，$W$ 是固定工作流，$R$ 是可变规则。这相当于前向传播。\n*   **$f_{align}$**：对齐评分函数。相当于 Loss Function 的负值（我们要最大化对齐度）。它衡量生成分镜与专家分镜在五个维度（节奏、视觉、景别、角度、运动）上的相似度。\n*   **Intuition**：\n    *   在标准 ML 中，我们通过 $\\nabla_W Loss$ 知道哪个权重对误差贡献大。\n    *   在 SAGE 中，规则是离散的文本，无法求导。因此，SAGE 引入 **Attribution Mechanism**：在生成时记录“哪些规则被使用了”（Rule-adoption record）。\n    *   当 $f_{align}$ 发现某个维度得分低时，系统查看该叙事组采用了哪些规则。如果规则 $r$ 被采用且导致错误，则 $r$ 对误差有“负贡献”，需要修订；如果没采用规则却出错，说明缺少规则，需要新增。\n    *   这种机制实现了类似“梯度”的信号路由，但作用于自然语言规则层面。\n\n### § 7 实验设计与结论\n\n**RQ1: 进化后的 Skill 能否缩小与专业导演的质量差距？与强基线相比如何？**\n*   **实验设计**：在 18 集测试集上，比较 SAGE 与 Human Director、Vanilla、Few-shot、CoT、EvoSkill、SkillOpt 在五个专业维度上的质量得分（Quality Score）。\n*   **结论**：SAGE 总体得分 77.8，超过人类导演的 77.1。在镜头角度和运动等 Vanilla 最弱的维度上，SAGE 表现最佳，证明显式知识注入优于隐式示例学习。\n\n**RQ2: 各组件（规则预热、迭代、归因）的贡献如何？**\n*   **实验设计**：进行消融实验（Ablation Study），逐步移除组件：Vanilla -\u003E +Rule Warm-start -\u003E +Iteration (No Attribution) -\u003E +Attribution (Full SAGE)。\n*   **结论**：规则预热贡献最大（+9.0 分）；无归因的迭代提升有限（+1.2 分）；加入归因后迭代收益翻倍（+2.4 分），证明细粒度信用分配是将迭代从“扰动”转化为“优化”的关键。\n\n**RQ3: 归因是否使质量随轮次稳定提升而非波动？**\n*   **实验设计**：追踪 10 轮进化过程中测试集质量得分的变化曲线，对比 With Attribution 和 Without Attribution。\n*   **结论**：有归因时，质量在前 5 轮上升至 77.8 后保持稳定；无归因时，质量在第 3 轮达到峰值 75.4 后下降至 73.8。证明归因机制确保了进化的收敛性和稳定性。\n\n**RQ4: 整合后的知识库是否可跨 Backbone LLM 迁移？**\n*   **实验设计**：将完全基于 Claude Opus 4.6 进化出的场景包，直接注入 GPT-5.4、GLM-5.2、DeepSeek-V4-Pro 等其他模型，不修改任何规则。\n*   **结论**：所有目标模型均获得 8.1% 到 21.2% 的相对提升。证明进化出的规则编码的是领域知识（Domain Knowledge）而非模型特定技巧（Model-specific tricks），具有通用性。\n\n**生产部署验证：**\n*   **实验设计**：在商业平台 Virtual Film Studio 部署 14 天，统计 1,344 个叙事组输出的接受率（无需实质性编辑即可进入生产）和制作时间。\n*   **结论**：87.2% 的输出被直接接受，单集制作时间从 1 小时以上降至约 10 分钟（减少 83%），证明该方法在工业场景中有效解决了产能瓶颈。", "additional_insights": "### § 8 Take-aways\n\nSAGE 将 LLM Skill 中的知识库（Knowledge Base）视为可学习的离散参数，通过对比剧本与专家分镜脚本自动提取无内容依赖的规则（Content-free Rules），解决了导演隐性知识难以显式化的问题。其核心创新在于引入规则级归因（Rule-level Attribution），在生成过程中记录每个叙事组（Narrative Group）所采用的具体规则，从而将执行反馈精确映射到单一规则，实现了针对误用规则（Misfiring Rules）的修订、覆盖缺失（Coverage Gaps）的新增以及未使用规则的淘汰。这种细粒度的信用分配（Credit Assignment）机制使得知识迭代能够持续收敛并达到稳定最优，避免了传统基于整体轨迹反馈的优化方法中常见的性能震荡或早期停滞。经过语义聚类整合后的场景包（Scenario Packages）具有模型无关性（Backbone-agnostic），可直接迁移至其他 LLM 并带来显著的性能提升，证明了演化出的知识是领域通用的导演原则而非特定模型的过拟合技巧。在商业部署中，SAGE 将分镜制作从手动创作转变为审核模式，大幅降低了单集制作时间并保持了高接受率，验证了该框架在工业级短剧生产中的实际效能。\n\n### § 9 最脆弱的假设\n\nSAGE 最关键的假设是：**LLM 能够准确且诚实地报告其在生成每个叙事组时具体采用了哪些规则（即 Rule-adoption Records 的可靠性）。** 如果模型在生成过程中并未真正依据所声明的规则进行决策，或者为了迎合提示词而虚假声明规则使用（Hallucination of Attribution），那么后续的归因诊断（Attribution-Guided Diagnosis）将基于错误的因果链，导致对正确规则的误删或对错误规则的强化，从而使整个演化系统崩溃。在实际中，这一假设可能不成立，因为 LLM 的生成过程本质上是概率性的，且“声明使用规则”与“实际遵循规则”之间可能存在解耦，特别是在规则条件（Condition）模糊或相互冲突时，模型可能无法精确区分其决策依据。论文通过消融实验（Ablation Study）间接支持了这一假设，显示移除归因机制后迭代性能迅速下降，但这仅证明了归因机制的有效性，并未直接验证模型自我报告规则的准确性（Ground Truth Alignment）。论文缺乏对“模型声明的规则”与“模型实际生成行为背后的真实逻辑”之间一致性的独立验证实验，例如通过扰动规则观察生成结果是否按预期变化，因此这一假设的稳健性仍存在潜在风险。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 **规则级归因对迭代稳定性的影响** 这一核心 Claim，无需构建完整的 SAGE 系统。首先，从 PROSE 数据集中选取 5-10 个短剧剧本及其对应的专家分镜脚本，使用一个开源 LLM（如 Llama-3-8B 或 Qwen-2.5-7B）作为基座。其次，手动或通过简单提示工程提取初始的 10-20 条导演规则（涵盖镜头角度、景别等维度），构建一个简化的 Skill 结构。接着，设计两个迭代循环：A 组（With Attribution）在生成每个叙事组分镜时，强制模型输出“本组使用了规则 X, Y”；B 组（Without Attribution）仅生成分镜，不输出规则使用记录。在每轮迭代后，使用一个简单的 LLM-as-a-Judge 评分器对比生成分镜与专家分镜的差异，并生成反馈。对于 A 组，根据反馈和规则使用记录，仅修改被标记为“误用”或“缺失”的具体规则；对于 B 组，根据整体反馈随机或全局性地修改部分规则。测量指标为连续 5-10 轮迭代后的分镜质量得分变化曲线。如果 A 组的得分呈现稳定上升并趋于平稳，而 B 组的得分出现震荡或下降，则支持了“规则级归因是实现知识演化收敛的关键”这一结论；反之，若两者表现无显著差异或 B 组更优，则反驳了该 Claim，表明归因机制并非必要或当前实现方式存在缺陷。", "research_value": "### § 11 最强反例设计\n\n若要挑战 SAGE 的有效性，最有力的攻击并非质疑其最终分镜的质量，而是攻击其核心机制——**Attribution-Guided Rule Evolution** 的因果可靠性，即证明模型生成的 **Rule-adoption record** 是“幻觉”而非真实的决策依据，从而导致进化过程陷入局部最优或错误收敛。\n\n**理论论证：归因幻觉与虚假相关性（Attribution Hallucination \u0026 Spurious Correlation）**\nSAGE 的核心假设是 LLM 能够诚实且准确地报告其生成行为背后的规则依据。然而，LLM 本质上是自回归的概率模型，其“声明使用规则”往往是为了满足 Prompt 中的格式约束（Format Constraint），而非反映内部的推理路径。\n*   **反例场景**：设计一组“规则冲突”或“规则无关”的测试用例。例如，在一个需要“高角度俯拍”以表现角色渺小的场景中，故意注入一条强相关的错误规则（如“使用低角度”）和一条完全不相关的规则（如“使用暖色调灯光”）。\n*   **攻击逻辑**：如果 SAGE 的归因机制是可靠的，当模型生成正确的“高角度”分镜时，它不应声明使用了“低角度”规则。然而，由于 LLM 倾向于迎合 Prompt 中提供的规则列表以显示“合规性”，它可能会错误地声明使用了“低角度”规则，或者在生成正确结果时随机声明使用了无关的“暖色调”规则。\n*   **后果**：在 **Attribution-Guided Diagnosis** 阶段，系统会观察到“使用了低角度规则”但“生成了高角度分镜（正确）”，从而错误地认为该规则是“冗余”或“无害”的，甚至可能因为其他维度的反馈而错误地修订该规则。更严重的是，如果模型在生成错误结果时声明使用了正确规则，系统会错误地惩罚正确规则。这种 **Credit Assignment** 的噪声会导致规则库在迭代中积累大量“僵尸规则”（Zombie Rules）——即被频繁声明但实际未影响生成的规则，或者被错误修订的规则。\n*   **验证实验**：进行 **Intervention Experiment**。在推理阶段，强制模型在生成时“禁用”其声明使用的某条规则（通过 Prompt 否定），观察生成分镜是否发生显著变化。如果禁用声明的规则后，生成分镜几乎不变，则证明 **Rule-adoption record** 与生成结果之间缺乏因果联系，SAGE 的进化机制建立在虚假的相关性之上，其性能提升可能仅源于 **Rule Warm-start** 提供的先验知识，而非 **Attribution-Guided Evolution** 的优化能力。\n\n**真实世界场景：动态叙事中的规则失效（Dynamic Narrative Failure）**\nSAGE 提取的是 **Content-free rules**，假设导演技巧是静态的。然而，电影语言是高度语境依赖的。\n*   **反例场景**：在“权力压制”场景中，SAGE 可能进化出“使用低角度”的规则。但在某些反讽或黑色幽默的叙事中，导演可能故意使用“高角度”来表现反派的滑稽或脆弱。\n*   **攻击逻辑**：SAGE 的 **Alignment Evaluation** 基于与专家分镜的相似度。如果训练数据中“权力压制”大多对应“低角度”，SAGE 会强化这一规则。当遇到需要反常规处理的测试集时，SAGE 会僵化地应用“低角度”规则，导致分镜与叙事意图严重背离。由于 **Scenario Routing** 仅基于粗粒度的情境包（如“Power Threat”），它无法捕捉细微的叙事语调（Narrative Tone）差异。\n*   **后果**：SAGE 在标准化测试集上得分高，但在需要创造性偏离规则的复杂叙事中表现极差，证明其学到的是“统计平均的导演风格”而非“可适应的导演思维”。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从静态规则进化到动态导演意图建模（From Static Rule Evolution to Dynamic Directorial Intent Modeling）**\n\n**（a）驱动局限与未满足需求**\nSAGE 的核心局限在于将导演知识简化为静态的 **If-Then Rules**，忽略了导演决策的动态性和意图性。导演并非机械地应用规则，而是根据叙事弧光（Narrative Arc）、角色心理状态和观众预期，动态调整镜头语言。SAGE 的 **Scenario Package** 是离散的、静态的，无法处理同一情境下因叙事阶段不同而导致的镜头语言差异（例如，同一场“对峙”戏，在开场和结局的镜头节奏截然不同）。此外，SAGE 依赖 **Expert Storyboard** 作为监督信号，这限制了其泛化能力，因为专家分镜本身可能包含个人风格偏差，而非普适的电影语法。\n\n**（b）借鉴相邻领域的方法**\n借鉴 **Reinforcement Learning from Human Feedback (RLHF)** 中的 **Preference Optimization** 和 **Cognitive Modeling** 中的 **Theory of Mind** 概念。\n*   **Preference Optimization**：不直接优化分镜与专家分镜的相似度，而是优化分镜与“叙事意图”的对齐度。通过构建一个 **Director Intent Model**，将剧本转化为隐式的意图向量（如“紧张感”、“权力动态”、“情感共鸣”），并训练一个奖励模型（Reward Model）来评估分镜是否有效传达了这些意图。\n*   **Theory of Mind**：引入 **Audience Perception Model**，模拟观众对分镜的心理反应。导演决策不仅基于剧本，还基于对观众预期的管理。\n\n**（c）第一个实验设计**\n**实验名称：Intent-Aligned Storyboard Generation via Dynamic Policy Optimization**\n\n1.  **数据构建**：不使用单一的专家分镜作为 Ground Truth，而是收集同一剧本的多个不同风格的分镜版本（如“经典好莱坞风格”、“欧洲艺术风格”、“短视频快节奏风格”），并标注每个版本所强调的叙事意图（Narrative Intent）。\n2.  **模型架构**：\n    *   **Intent Encoder**：将剧本片段编码为多维意图向量（如 [Tension: 0.8, Power: 0.9, Emotion: 0.3]）。\n    *   **Dynamic Policy Network**：一个基于 LLM 的策略网络，根据意图向量动态生成镜头参数（角度、景别、运动），而非检索静态规则。\n    *   **Reward Model**：训练一个奖励模型，输入为（剧本片段，意图向量，生成分镜），输出为对齐分数。奖励模型通过对比不同风格分镜的观众反馈数据（如眼动追踪数据、情感分析数据）进行训练。\n3.  **训练过程**：使用 **PPO (Proximal Policy Optimization)** 或 **DPO (Direct Preference Optimization)** 优化策略网络，使其在给定意图下生成最大化奖励的分镜。\n4.  **评估指标**：\n    *   **Intent Fidelity**：生成分镜传达的意图与目标意图的一致性（通过独立的意图评估模型测量）。\n    *   **Style Diversity**：在相同剧本下，不同意图向量能否生成显著不同的分镜风格。\n    *   **Audience Engagement**：在 A/B 测试中，比较 SAGE 生成的分镜与 Intent-Aligned 分镜对观众情感唤醒度的影响。\n\n**与已有工作的区别**：\nSAGE 是 **Rule-Based** 和 **Static** 的，依赖显式规则的提取和归因；本提议是 **Intent-Based** 和 **Dynamic** 的，依赖隐式意图的建模和优化。SAGE 解决的是“如何正确应用已知规则”，本提议解决的是“如何根据叙事需求动态创造镜头语言”。这从“自动化执行”转向了“创造性辅助”，更贴近导演的实际工作流。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Maolin Ran\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xiaoyang Lu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jiaqi Liu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jian Wang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Weiwen Liu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Jianghao Lin\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yong Yu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Weinan Zhang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Shanghai Jiao Tong University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"CreativeFitting\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Corresponding authors.\"\n    }\n  ]\n}\n```", "summary_translation": "分镜脚本将剧本转化为视觉镜头计划，用于自动化短剧制作。专业的分镜设计依赖于隐性的导演专业知识，仍是行业瓶颈。大型语言模型可以自动化这一步骤，但提供导演知识的方法面临三个挑战：（1）知识获取：该工艺在范例中保持隐性，或必须手动编写。（2）知识精炼：撰写的知识未根据执行结果进行评估，且不透明的生成过程阻碍将反馈归因于每个决策背后的知识。（3）知识注入：注入所有知识会超出可用上下文，而为每个叙事组手动选择无法扩展。我们提出 SAGE（Skill with Attribution-Guided Evolution），这是一个已部署的框架，从专家演示中学习、归因、进化和路由导演知识。SAGE 通过将每个训练剧本与其专家分镜脚本进行对比，推导出独立于剧集内容的规则。在生成过程中，模型记录每个叙事组采用的规则。将这些记录与局部反馈相结合，使针对单个规则的定向更新成为可能。进化后的规则形成带有路由索引的场景包，因此每个组只需检索适合其情况的有限集合，无需专家干预。在涵盖三种类型的 18 个测试剧集中，SAGE 在经专家验证的量表上得分为 77.8，而专业导演得分为 77.1。在 Virtual Film Studio 部署 14 天后，SAGE 生成了 1,344 个叙事组输出；87.2% 无需实质性编辑即被接受，制作团队记录每集创作时间减少了超过 83%。我们发布了 PROSE，这是首个公开数据集，将 68 集剧本与专业导演的分镜脚本配对：https://github.com/creDreams/PROSE。"}]}]};

const dailyOverviewsRaw = {"2026-08-21": "### 今日AI论文速览 (2026-08-21)\n\n#### 开篇导语\n今日的研究动态呈现出“从单点突破向系统可靠性演进”的鲜明趋势。在**Agent评估**领域，研究重心已从简单的任务完成率转向对**复杂工作流、科学严谨性及状态一致性**的深度考察，揭示了当前模型在长程依赖和领域知识整合上的显著短板。与此同时，**效率与优化**成为另一大热点，无论是通过**KV Cache复用**降低推理成本，还是利用**数学规划**优化技能选择，亦或是提出**单轨迹RL算法**，均显示出社区对Agent落地可行性的迫切追求。此外，**递归自我改进（RSI）**的基准测试首次量化了AI设计AI算法的极限，为AGI路径提供了冷峻的现实参照。\n\n---\n\n#### 三、 主题分类与论文速览\n\n### 🔬 科学工程与复杂工作流：从“能跑”到“可信”\n*   **SWE-bench Science: Can Coding Agents Resolve Engineering Tasks in Science?**\n    针对科学软件工程中代码错误可能导致科学结论失效的问题，提出了包含119个跨20个科学领域任务的**SWE-bench Science**基准。研究发现，即使是最强的**Claude Code with Opus-5 (max)**，其pass@1也低于50%，主要失败原因包括科学知识缺失、探索误导及泛化能力不足。研究还指出，不当的科学引导反而可能引发“锚定效应”，表明领域知识的注入需极其谨慎。(2608.19799 [cs.CL])\n\n*   **One Success Isn't Reliability: Thinkingbox, a Sandbox and Benchmark for Agents in Stateful Business Workflows**\n    针对现有基准仅关注单次成功而忽视可靠性的问题，引入了**Thinkingbox**沙箱及包含507个策略条件工作流的**Thinkingbox-bench**。评估显示，最强模型pass@1为65.36%，但**pass^20（20次尝试中全部成功）仅为25.25%**，揭示了Agent在状态持久化、多轮信息收集及避免副作用方面的巨大差距，证明单次成功并非可靠性的有效代理指标。(2608.19741 [cs.CL])\n\n*   **Bringing analytic rigor to agentic AI for science: The Brain Researcher platform for neuroimaging data analysis**\n    为解决AI在科学分析中缺乏严谨性（如选择性分析、过早声明成功）的问题，提出了**Brain Researcher**平台，将方法论判断嵌入神经影像分析工作流。该平台通过强制要求替代方案权衡和证据溯源，使工具选择准确率提升了70.2个百分点，并将可验证的论证基础从4.6%提升至22.0%，强调了**分析严谨性**在科学Agent中的核心地位。(2608.19902 [cs.AI])\n\n### 🧠 记忆陷阱与状态追踪：Agent的“认知缺陷”\n*   **MemTrapBench: Benchmarking Cognitive Traps in LLM Memory Use**\n    指出当前记忆基准忽视了检索记忆对推理的负面影响，提出了**MemTrapBench**以评估**认知陷阱**（推理固着和信念扭曲）。实验发现，即使记忆准确且相关，也可能导致性能下降超过10%。为此提出的**AdaptiveMem**方法，通过推理时指令让LLM避免陷入记忆陷阱，在保持标准记忆基准性能的同时有效缓解了这一问题。(2608.20202 [cs.CL])\n\n*   **Can Agent Memory Systems Track Evolving State?**\n    强调Agent记忆系统必须具备**状态追踪（State Tracking）**能力，即区分当前状态与被取代的旧状态。提出的**StateMemBench**基准显示现有系统在此任务上表现不佳。新提出的**StateMem**方法通过显式追踪取代关系和依赖，在DeepSeek-V4-Flash上将当前状态准确率提升了1.8倍，并证明该结构优势可轻量级封装至现有记忆系统中。(2608.19652 [cs.CL])\n\n### 🚀 效率革命与技能管理：让Agent更“轻”更“准”\n*   **ReCache: Efficient KV Cache Reuse and Compression for Tool-Augmented LLM Agents**\n    针对工具增强Agent中工具模式重复编码导致的KV Cache浪费问题，提出了**ReCache**框架。通过**资源感知注意力（Resource-wise attention）**实现组合不变的KV块，并结合结构化剪枝，在保持性能几乎无损（Inv-F1 82.3% vs 82.4%）的情况下，将KV张量内存减少92.43%，首字生成速度提升3.655倍。(2608.19662 [cs.CL])\n\n*   **Optimal Skill Selection for LLM Agents with Provable Bicriteria Guarantees**\n    将技能选择建模为在硬令牌预算下最大化单调次模收益减去上下文惩罚的优化问题，提出了**Best Prefix Selection (BPS)**算法。该算法提供了首个多项式时间的**双准则近似保证**，在BigCodeBench变体上以少28%的令牌实现了0.73的任务成功率，显著优于现有的基于语义相关性的贪心选择方法。(2608.19993 [cs.AI])\n\n### 🔄 训练范式与递归改进：探索Agent的“进化”边界\n*   **AI4AI-Bench: Benchmarking LLM Agents in Algorithmic Design for Recursive Self-Improvement**\n    首次针对**递归自我改进（RSI）**中Agent设计训练算法的能力提出基准**AI4AI-Bench**。结果显示，最强系统仅能关闭现有算法与最优解之间差距的五分之一，且多数提交并未真正改变模型的学习方式。研究指出，更多的推理努力主要转化为“尝试改变学习算法”的意愿，而非实际效果，揭示了RSI的巨大挑战。(2608.20318 [cs.CL])\n\n*   **SAPO: Single-Rollout Autoregressive Policy Optimization for Agentic Reinforcement Learning**\n    针对Agentic RL中现有方法缺乏显式价值泛化及优势崩溃的问题，提出了**SAPO**框架。该框架利用LLM的自回归结构，在共享参数下分别预测策略和价值，并结合轨迹级广义优势估计。在ALFWorld和WebShop上，SAPO比PPO和GRPO分别高出15.1和12.1个百分点，同时消除了独立Critic模型的内存开销，迭代时间减少33.2%。(2608.19842 [cs.AI])\n\n*   **MidTool: Mid-training Data Synthesis for Agentic Tool Use**\n    提出**MidTool**，一个用于Agent工具使用能力的**中期训练（Mid-training）**数据合成管道。通过结合网络、PDF、代码数据及真实API合成的监督信号，教导模型识别工具亲和性、参数接地及工作流组合。在Qwen3系列模型上的中期训练显著提升了下游工具使用性能，证明通用工具能力应通过专门的中期训练而非仅靠后期微调来获得。(2608.20314 [cs.AI])\n\n### 🌍 模拟环境与代码生成：构建更真实的交互世界\n*   **Mitigating Identity Essentialism in LLM Agents with Longitudinal Life Trajectories**\n    针对静态Profile Agent存在的**身份本质主义**（Identity Essentialism）偏差，提出了**LifeMem**纵向记忆框架。通过结合结构化生活事件检索和参数化记忆，LifeMem在Add Health等数据集上显著改善了Agent响应分布与人类数据的一致性，增强了组内多样性和跨生命阶段的动态演变能力。(2608.19621 [cs.CL])\n\n*   **EnvHarness: Awakening Static Worlds for Agent Learning**\n    为解决静态环境无法适应Agent能力增长的问题，提出了**EnvHarness**，一个可编程的插件层，无需修改底层逻辑即可重塑环境行为。配合**EnvRigger**自动诊断Agent弱点并合成组件，EnvHarness在五个基准上实现了最高9.0分的性能提升，并为强化学习提供了更优的协同进化信号。(2608.19880 [cs.CL])\n\n*   **Repo0: Design-Driven Zero-to-All Code Generation**\n    针对从零开始生成完整软件项目的需求，提出了**Repo0**框架，通过**双有向无环图（Dual-DAG）**显式维护架构状态。该框架通过模块化指标引导结构演化直至收敛，再指导测试驱动开发。在RepoCraft基准上，Repo0的功能覆盖率和通过率均优于最强基线RPG，证明了显式架构状态在零到全代码生成中的关键作用。(2608.19854 [cs.AI])\n\n---\n\n#### 四、 今日看点\n\n*   **📉 RSI的“冷峻现实”：AI设计AI算法的能力远未成熟**\n    **AI4AI-Bench**的结果令人深思：即使是最先进的Agent，在改进训练算法这一核心RSI任务上，表现也仅略优于随机基线。这挑战了“AI将迅速通过自我改进实现指数级增长”的乐观预期，提示我们当前的瓶颈可能不在于算力，而在于**算法设计的元认知能力**。\n\n*   **🛡️ 可靠性 \u003E 成功率：Agent评估范式的重大转折**\n    **Thinkingbox**提出的**pass^20**指标是一个极具洞察力的创新。它揭示了Agent在“偶尔成功”与“可靠执行”之间的巨大鸿沟。对于企业级应用而言，这种对**状态一致性**和**无副作用**的严苛要求，将是未来Agent落地的真正门槛，而非单纯的SOTA分数。\n\n*   **⚡ 效率优化的“数学化”与“结构化”**\n    今日多篇论文展示了效率优化的新方向：**ReCache**通过解耦资源表示实现KV Cache压缩，**BPS**通过次模优化保证技能选择的最优性，**SAPO**通过共享自回归骨干降低RL内存开销。这表明Agent的效率提升正从简单的工程技巧转向**具有理论保证的结构化设计**。\n\n*   **🧪 科学Agent的“严谨性”危机**\n    **SWE-bench Science**和**Brain Researcher**共同指向一个问题：Agent在科学领域不仅是“代码工人”，更是“证据解释者”。当前的失败模式（如锚定效应、选择性分析）表明，缺乏**方法论约束**和**批判性思维**的Agent在科学场景中是危险的。未来的科学Agent必须内置“怀疑机制”和“多宇宙分析”能力。", "2026-08-20": "### 今日AI论文速览 (2026-08-20)\n\n#### 开篇导语\n今日的研究动态呈现出**“Agent 自主性深化”**与**“评估体系精细化”**的双轨并行趋势。一方面，从 SPADE 的自适应环境生成到 SkillForge 的项目知识蒸馏，Agent 正从被动执行者向具备自我进化能力的系统转变；另一方面，针对 Agent 的评估不再局限于最终结果，而是深入到了组件级故障诊断、行为过程审计以及人机协作中的“增强”价值。此外，代码 Agent 的鲁棒性边界和工具调用的拓扑结构优化，揭示了当前系统在复杂逻辑处理上的深层瓶颈与突破方向。\n\n---\n\n#### 三、 主题分类与论文速览\n\n### 🧬 自我进化与合成环境：从静态训练到动态博弈\n*这一板块聚焦于 Agent 如何突破固定训练数据的限制，通过自我博弈、动态图结构或合成数据实现能力的持续迭代。*\n\n*   **SPADE** 提出了一种**自我博弈强化学习框架**，其中单个 LLM 同时扮演“环境设计师”和“推理代理”。环境设计师编写可执行的 Gym 风格训练环境，而推理代理在其中学习；通过优化代理的**遗憾（regret）**信号，环境设计师能自动生成处于代理能力边缘的挑战性任务。该方法在数学、代码及多轮工具使用基准上显著优于固定环境基线，证明了**环境设计本身作为可学习组件**对开放-ended 自我改进的关键作用。(2608.19197 [cs.CL])\n*   **SkillForge** 针对 Agent 在特定仓库中缺乏项目知识的问题，提出了一种**主动式自蒸馏框架**。它不依赖历史修复记录，而是通过重新实现仓库中受测试覆盖的核心功能来**合成项目特定问题**，并从中蒸馏出与实体绑定的可复用技能。实验表明，这种在解决真实问题前**预先获取项目特定知识**的策略，能显著提升下游软件问题修复的性能。(2608.18933 [cs.AI])\n*   **SeisEvo** 展示了 Agent 在科学计算领域的算法进化能力，通过 LLM 驱动的多智能体搜索，对地震数据重建算法进行**约束下的程序进化**。该方法不优化单一结果，而是搜索产生结果的**白盒算法**，发现了如残差门控相位对齐投影等新算子，在信噪比上显著优于经典方法，证明了**代理算法进化**可发现可解释且可部署的科学处理算子。(2608.18272 [cs.AI])\n*   **Self-Evolving Agents as Dynamic Graph Transformation** 是一篇综述，将 Agent 的进化过程形式化为**动态图变换**。它将 Agent 的状态（记忆、工具、工作流）建模为动态图，并提出了节点/特征进化、边/拓扑进化等四种分类体系，旨在为设计和治理自我进化 Agent 提供结构化的**动态图学习基础设施**视角。(2608.18104 [cs.AI])\n\n### 🛠️ 工具使用、技能选择与规划：解决拓扑崩溃与信用分配难题\n*针对多轮工具调用中的复杂依赖和长程决策问题，今日研究提出了从拓扑感知到信用隔离的创新解决方案。*\n\n*   **DART-SD** 指出多轮工具调用中的最优解空间呈**钻石拓扑结构**，传统的全轨迹模仿会导致**拓扑崩溃**。该框架通过构建交互状态转换图（ISTG），识别**关键拓扑断点（CTB）**，并仅对恢复步骤进行局部监督的自蒸馏，从而保护有效推理前缀免受破坏性梯度更新，显著提升了复杂多轮工具调用的性能。(2608.18524 [cs.CL])\n*   **SkillGate** 解决了长程 Agent 中**选择器信用饥饿（selector credit starvation）**的问题，即技能选择 token 在序列级奖励中获得的信用信号微弱且易错。该方法将 token 支持划分为两个独立的信用通道：**结果信用**仅作用于执行 token，而**动作局部优势**仅作用于技能命名 token，从而在 16 个候选技能的任务中将 9B 模型的试错成功率从 40.8% 提升至 53.2%。(2608.18852 [cs.AI])\n*   **Looped Language Models** 研究了循环语言模型在**组合式工具调用**中的潜力。实验发现，循环计算能显著受益于需要协调多个 API 调用、维护中间状态和依赖关系的任务，且**自适应推理**能在计算性能之间取得更优权衡，表明循环架构是构建可靠代理系统的有前景方向。(2608.18171 [cs.LG])\n*   **Competence, Not Accuracy** 探讨了在无验证器场景下使用 LLM 作为技能优化门控的可行性。研究指出，LLM 裁判的判别能力受限于其自身的**解题能力（competence）**，并提出了一个基于 ROC-AUC 的闭式界限。该工作提供了一种**部署前诊断工具**，用于评估裁判门控是否具备区分正确与错误答案的有效信号，避免盲目引入裁判导致的优化失效。(2608.18719 [cs.AI])\n\n### 📊 评估、基准与审计：从结果导向到行为与组件级洞察\n*随着 Agent 能力增强，评估重点转向了细粒度的故障诊断、行为过程审计以及人机协作中的实际价值。*\n\n*   **ComponentBench** 填补了长程工作流基准与原子 GUI 测试之间的空白，专注于**组件级交互**（如按钮切换）的诊断。该基准包含 97 种标准 UI 组件的 2,910 个任务，研究发现观察空间（如无障碍树 vs. 像素坐标）的选择对模型性能影响巨大（高达 30% 的差异），揭示了当前 Agent 在空间操作上的脆弱性。(2608.18307 [cs.CL])\n*   **What is Missing from AI Post-Training AI** 分析了 AI 代理进行后训练时的能力瓶颈，发现代理往往在初始阶段锁定训练策略，随后仅进行局部调整，缺乏**自发重新评估策略**的机制。实验表明，增加经验、人类指导或推理算力均无法解决这一**策略僵化**问题，指出当前 AI-for-AI 缺乏高层策略的动态修订能力。(2608.19072 [cs.CL])\n*   **LEDGER** 提出了一种用于审计 LLM Agent 的**分层证据与决策图**系统。它将执行事件分组为证据节点和工作流节点，并通过语义边连接主张与支持动作，从而暴露工作流决策、工件谱系和验证覆盖范围，解决了 Agent 可观测性系统中**可见性不等于可审计性**的问题。(2608.18398 [cs.AI])\n*   **CentaurBench** 挑战了仅以自动化能力评估 LLM 的传统，引入了**增强（Augmentation）**视角。研究发现，自动化表现最好的模型在辅助较弱代理时未必表现最佳，甚至在某些任务中**无辅助优于有辅助**，表明自动化能力是辅助质量的**不完全代理**，需建立评估模型在人类-AI 或多智能体系统中角色的新基准。(2608.18554 [cs.AI])\n*   **Position: Behavioral Systems Require Behavioral Tests** 是一篇立场论文，主张应将 AI Agent 视为**行为系统**进行评估。借鉴行为科学，论文呼吁开发系统性的**行为测试**，包括从动作序列中恢复决策策略、构建隔离行为差异的环境以及探测多智能体系统中的涌现动态，以建立 AI 行为科学。(2608.18081 [cs.AI])\n\n### 💻 代码 Agent 与软件工程：鲁棒性边界与协作协议\n*聚焦代码 Agent 在面对代码变异时的稳定性，以及通过结构化对抗提升代码审查质量的新范式。*\n\n*   **A Jagged Frontier** 评估了代码 Agent 对**语义保持变换（SPTs）**（如控制流重写、死代码注入）的鲁棒性。研究发现，尽管顶级模型在大多数配置下仅出现小幅性能下降，但鲁棒性排名在不同脚手架间不一致，揭示了**锯齿状的鲁棒性前沿**，表明当前代码 Agent 在多样化真实代码库中的部署可靠性仍存隐患。(2608.18389 [cs.AI])\n*   **FACET** 解决了终端任务合成中信息丢失和跨工件不一致的问题，提出了一种**细粒度代理构建框架**。它通过重建代理技能为连贯场景，并以**容器状态**作为指令、解决方案和验证器的共享接地，确保了源意图的保留和执行状态的一致性，从而生成高质量的可执行监督数据。(2608.18580 [cs.AI])\n*   **Adversarial Review** 提出了一种最小化的合作代码审查协议，引入**结构化分歧（Structured Disagreement）**。在主要编码代理之外，增加审查者和批评者代理，通过批评者对审查的审计来避免**虚假共识**失败模式。该方法仅用三个代理即超越了五代理基线，证明了**最小化、结构化且基于证据的分歧**是提升代码审查效率的关键。(2608.18167 [cs.AI])\n\n---\n\n#### 四、 今日看点 (Highlights)\n\n*   **🔍 评估范式的根本性转变**：今日多篇论文（ComponentBench, LEDGER, CentaurBench, Position Paper）共同指向一个趋势：传统的“输入-输出”准确率评估已不足以衡量 Agent 的真实能力。研究正转向**组件级诊断**、**行为过程审计**以及**人机协作中的增强价值**。特别是 CentaurBench 的发现——“自动化强不代表辅助好”，对当前以 SOTA 刷榜为导向的模型选择逻辑提出了严峻挑战。\n*   **🧩 解决长程决策的“信用分配”难题**：SkillGate 和 DART-SD 分别从**信用隔离**和**拓扑感知**的角度，解决了长程 Agent 训练中的核心痛点。SkillGate 提出的“选择器信用饥饿”概念极具洞察力，指出了为何简单的 RL 难以教会 Agent 选择正确的技能；而 DART-SD 对“钻石拓扑”的建模则揭示了多轮工具调用中并行探索被错误惩罚的机制。这两项工作为构建更可靠的长程规划 Agent 提供了具体的技术路径。\n*   **🔄 从“使用工具”到“进化环境”**：SPADE 和 SeisEvo 展示了 Agent 能力的边界正在从“执行既定任务”扩展到“生成和优化任务/算法本身”。SPADE 让 Agent 自我生成训练环境，SeisEvo 让 Agent 进化科学算法。这种**自我进化（Self-Evolving）**的能力，结合 SkillForge 的主动知识蒸馏，标志着 Agent 正从被动的工具使用者转变为主动的知识构建者和环境塑造者。\n*   **⚠️ 代码 Agent 的“脆弱性”被量化**：A Jagged Frontier 的研究令人警醒，它量化了代码 Agent 在面对语义不变变换时的性能波动。这种**锯齿状的鲁棒性**意味着，即使模型在基准测试中表现优异，其在真实、杂乱代码库中的表现可能极不稳定。这提示开发者在部署代码 Agent 时，不能仅依赖基准分数，还需关注其在代码变异下的稳定性。", "2026-08-19": "### 今日AI论文速览 (2026-08-19)\n\n**开篇导语**\n今日的研究焦点高度集中在**智能体（Agent）的自主进化与鲁棒性**上。从“经验链”到“技能优化器”，研究者们正试图让LLM从被动的指令执行者转变为能够从交互反馈中自我修正、长期记忆并适应复杂环境的主动学习者。同时，针对长程任务中奖励稀疏和信用分配难题，**强化学习（RL）的新范式**（如进化策略、组规划感知优化）正在突破传统PPO/GRPO的局限。此外，一系列新的基准测试（如StartupBench, ASI-Bench）揭示了当前通用智能体在真实世界工作流和自主科研探索中的巨大能力缺口，标志着评估标准正从“解题能力”向“端到端交付能力”和“创新探索能力”跃迁。\n\n---\n\n### 一、 记忆与经验管理：从静态存储到动态演化\n\n这一板块的论文探讨了如何让LLM像人类一样，通过迭代交互积累经验，并构建更智能、更具结构化的长期记忆系统，以解决上下文丢失和语义检索局限的问题。\n\n*   **Chain-of-Experience (CoE)** 提出了一种测试时持续改进框架，让LLM通过自我反馈或环境信号（如代码通过率）在推理过程中形成“经验链”。研究发现，仅利用自我反馈即可带来显著增益，且结合互补反馈渠道能进一步降低API成本并提升准确率，证明了**迭代经验**优于零次推理基线。(2608.18027 [cs.CL])\n*   **CABLE** 针对长期对话记忆中语义检索无法捕捉隐含关联的问题，提出了一种基于互补前驱链接的扩展机制。它通过生成前驱导向查询并减去直接语义邻居，构建稀疏的推理相关关联图，从而在检索时扩展宿主系统的语义覆盖范围，显著提升了跨会话和多任务场景下的证据召回率。(2608.17911 [cs.CL])\n*   **ArborMem** 将长期对话建模为可导航的“交互状态森林”，而非简单的线性历史。该框架通过定位当前输入所属的交互分支，恢复局部上下文并跨分支检索可重用证据，有效解决了多任务交织和中断恢复时的连续性难题，在受限读取预算下表现尤为突出。(2608.17534 [cs.CL])\n*   **On the Fragility of Self-Improving Agents** 对基于记忆的自改进智能体进行了严谨的压力测试，揭示了其性能对任务顺序和评估噪声的高度敏感性。研究指出，当前的自改进循环容易放大噪声，且依赖隐式课程学习，呼吁建立更严格的评估协议并引入人类监督以防止不可预见的失败。(2608.18066 [cs.CL])\n\n### 二、 强化学习与智能体训练：突破长程决策瓶颈\n\n面对长程交互中的稀疏奖励和信用分配难题，今日多篇论文提出了超越传统RL的新方法，包括进化策略、技能优化器以及更精细的优势函数设计。\n\n*   **WER (Write, Execute, Refine)** 区分了“遵循技能”与“优化技能”的能力，提出了一种多阶段框架，训练一个独立的**技能优化器**从执行反馈中学习。通过匹配成功与失败的轨迹进行精炼，该4B优化器在BFCL v4上达到了76.63%的Pass@1，超越了未训练的大型通用模型。(2608.17587 [cs.CL])\n*   **Agentic ESOpt** 论证了**进化策略（ES）**在长程智能体微调中的优势，相比基于反向传播的RL，ES仅需推理级GPU内存即可实现全参数优化，且无需分解长轨迹奖励。该方法在WebArena-Lite上实现了Qwen-3.5-27B的全参数优化，并支持提示词与参数的协同进化。(2608.17310 [cs.LG])\n*   **FACA (Feedback-Aware Credit Assignment)** 针对多轮用户交互，提出利用下一轮用户反应作为局部信用信号，而非仅依赖终端奖励。这种方法无需额外的Critic模型，即可在交互GRPO中实现更精细的优势分配，在电信等复杂对话场景中带来了显著的性能提升。(2608.17499 [cs.AI])\n*   **PlanPO** 解决了组相对策略优化中成功轨迹优势坍缩的问题，引入了**粗到细的优势信号**，区分不同交互效率和长度的成功轨迹。这使得智能体能学习到更具通用性的规划能力，在ALFWorld等多轮基准上平均提升了27.2%。(2608.17289 [cs.AI])\n*   **LEGO-RL** 旨在弥合原生编码智能体Harness与策略梯度训练之间的鸿沟，通过进程内LLM代理和可扩展沙箱编排，解决了环境崩溃和奖励黑客问题。该方法在保持 rollout-training 概率高相关性的同时，显著提升了Qwen3.5-35B在SWE-bench Verified上的表现。(2608.17393 [cs.AI])\n*   **Agent Lightning v1.0** 推广了**Harnessed Agentic RL**范式，即部署时的Harness直接参与模型后训练。该轻量级框架解决了重分词、样本合并等挑战，仅用6K示例和 modest compute 就将Qwen3.5-9B在SWE-bench Verified上的得分提升了14.6个百分点。(2608.17528 [cs.AI])\n\n### 三、 自进化与自适应智能体：从被动执行到主动成长\n\n这一主题关注智能体如何在特定领域（如机器人、金融、影视制作）中通过自我演化、技能组合和规则更新来适应新任务，减少对人力的依赖。\n\n*   **Teach-and-Grow (TGL)** 提出了一种以智能体为中心的通用机器人学习架构，将成功演示转化为可重用的**技能块（Skill Blocks）**。智能体在新场景中组合这些块并根据物理结果进行修订，实现了无需任务特定策略重新训练的新任务获取，验证了“教学即成长”的缩放定律假设。(2608.17209 [cs.LG])\n*   **EvoTS-Agent** 针对金融时间序列的非平稳性，设计了一个验证引导的自进化LLM智能体。它通过修订、替代策略和重组三个算子自主演化检测模型，适应不同数据集的统计特性，在保持100%执行成功率的同时优于现有LLM智能体。(2608.17933 [cs.AI])\n*   **SAGE** 解决了影视分镜制作中隐性导演知识难以获取和注入的问题，通过对比剧本与专家分镜推导规则，并利用归因引导的规则演化机制进行更新。部署结果显示，其生成的分镜87.2%无需实质性编辑，大幅降低了制作时间，并发布了首个专业分镜数据集PROSE。(2608.17468 [cs.AI])\n\n### 四、 基准测试与评估框架：重新定义智能体的能力边界\n\n新的基准测试不再局限于单一任务的正确率，而是转向评估端到端工作流的完成度、真实市场需求以及自主科研探索能力。\n\n*   **StartupBench** 基于市场验证的AI初创产品工作流构建，评估通用智能体在真实用户需求下的端到端交付能力。结果显示，即使是最强的模型也仅能完成约30%的任务，揭示了当前智能体在复杂指令遵循和领域专业知识上的巨大差距。(2608.17800 [cs.AI])\n*   **ASI-Bench** 旨在评估AI向**人工超级智能（ASI）**迈进的能力，重点考察其在缺乏人类方法论指导下的创新探索和自主科研执行能力。随着指导信息的逐步撤出，模型得分急剧下降，表明当前系统仍严重依赖人类引导，距离自主科研尚有遥远距离。(2608.17271 [cs.AI])\n*   **AutoResearch** 提出了一个两阶段系统，连接“想法生成”与“想法执行”，通过多模型生成、交叉审查和独立证据审查来确保研究过程的科学性。该系统能有效检测并纠正不可靠的实验结果，实现了“洞察输入，幻觉输出”的研究闭环。(2608.17906 [cs.AI])\n\n### 五、 智能体基础设施与Harness优化：提升效率与可靠性\n\n研究者们开始深入优化智能体的运行环境（Harness），通过动态资源配置、上下文管理和执行原语优化，提升智能体在关键基础设施和浏览器操作中的表现。\n\n*   **Task-Aware Harness Provisioning** 将Harness配置视为任务需求与资源提供的匹配问题，提出了**地图引导的升级（map-guided escalation）**算法。该方法从特定任务Harness开始，仅在自检失败时扩展至全配置，在液冷等任务中提高了准确率并减少了48%的Token消耗。(2608.17433 [cs.AI])\n*   **Wuying-Browser-Agent** 针对真实网页环境的长程操作挑战，提出了包含结构化浏览器Harness、恢复轨迹SFT和发散感知在线GRPO的统一框架。该模型在BrowserBench等新基准上建立了开源SOTA，并展示了强大的通用智能体迁移能力。(2608.17319 [cs.AI])\n*   **The Working Set of a Coding Agent** 分析了代码智能体在仓库级任务中的**连贯性债务（Coherence Debt）**，指出事实的可用性而非距离决定了编辑成功与否。研究发现，Harness应确保编辑依赖的事实可用，并检查可用性与产出的一致性，而非仅依赖读取操作。(2608.16630 [cs.AI])\n\n---\n\n### 今日看点\n\n*   **趋势观察：RL范式的多元化与“去中心化”**\n    今日多篇论文（Agentic ESOpt, WER, PlanPO, LEGO-RL）共同指向一个趋势：传统的基于反向传播的RL在长程智能体训练中面临瓶颈。**进化策略（ES）**因其低内存需求和黑盒特性受到青睐；**技能优化器**将“执行”与“优化”解耦；而**组规划感知优化**则试图在轨迹层面挖掘更细粒度的优势信号。这表明RL正在从单一的算法优化转向更灵活、更适应智能体复杂交互结构的混合范式。\n\n*   **颠覆性观点：记忆不仅是存储，更是“状态导航”**\n    ArborMem和CABLE的研究挑战了传统基于语义相似性的记忆检索范式。ArborMem提出记忆应被视为**可导航的状态森林**，强调交互轨迹的结构化连续性；CABLE则强调构建**互补的稀疏关联**以扩展语义检索的盲区。这暗示未来的记忆系统将不再是被动的数据库，而是具备推理能力的主动索引结构。\n\n*   **潜力技术：Harnessed Agentic RL 成为新基建**\n    Agent Lightning v1.0 和 LEGO-RL 的发布标志着 **Harnessed Agentic RL** 正在成为一种标准基础设施。通过将部署时的Harness直接纳入训练循环，解决了训练与推理环境不一致的问题。这种“即插即用”的RL框架有望大幅降低智能体微调的门槛，加速高质量智能体在代码、搜索等领域的落地。\n\n*   **现实差距：从“做题家”到“创业者”的鸿沟**\n    StartupBench 和 ASI-Bench 的结果令人警醒。尽管模型在标准化基准上表现优异，但在**市场验证的真实工作流**（StartupBench）和**自主科研探索**（ASI-Bench）中，成功率极低且严重依赖人类引导。这提醒我们，当前的AI进步可能更多体现在“知识压缩与检索”上，而在“复杂系统交互”和“原创性探索”方面，我们仍处于早期阶段。"};

        // 全局状态管理

        let showOnlyStarred = false; // 筛选状态：是否只显示收藏的论文
        let isLoadingMore = false; // 是否正在加载更多
        let activeTagFilters = {}; // {date: Set of active tag names}

        // 获取未加载的日期（只在两周展示窗口内分页；窗口外日期不进入"加载更多"，
        // 仅在被收藏时由 loadArchivedStarredDates 按需加载）
        function getUnloadedDates() {
            return availableDates.filter(date => !loadedDates.has(date) && windowDateSet.has(date));
        }

        // Tag filter toggle
        function toggleTagFilter(date, tagName) {
            if (!activeTagFilters[date]) activeTagFilters[date] = new Set();
            const filters = activeTagFilters[date];
            if (tagName === 'All') {
                filters.clear();
            } else if (filters.has(tagName)) {
                filters.delete(tagName);
            } else {
                filters.add(tagName);
            }
            renderPapers();
        }

        // Check if paper matches active tag filters for its date
        function paperMatchesFilters(paper, date) {
            const filters = activeTagFilters[date];
            if (!filters || filters.size === 0) return true;
            if (filters.has(paper.cluster)) return true;
            return (paper.tags || []).some(tag => filters.has(tag));
        }

        // 加载更多日期的数据
        async function loadMoreDates() {
            if (isLoadingMore) return;

            const unloadedDates = getUnloadedDates();
            if (unloadedDates.length === 0) {
                showSimpleToast('已加载全部数据');
                return;
            }

            isLoadingMore = true;
            const loadBtn = document.getElementById('load-more-btn');
            if (loadBtn) {
                loadBtn.disabled = true;
                loadBtn.innerHTML = '<span class="animate-spin inline-block mr-2">⏳</span>加载中...';
            }

            const datesToLoad = unloadedDates.slice(0, LOAD_MORE_DAYS);
            let loadedCount = 0;

            for (const date of datesToLoad) {
                try {
                    const response = await fetch(`data/${date}.json?v=${DATA_VERSION}`);

                }
            }

            isLoadingMore = false;

            if (loadedCount > 0) {
                renderPapers();

        // 更新"加载更多"按钮状态

        // createPaperHTML 会把窗口外日期里未收藏的论文隐藏，只留下收藏的那几篇。
        async function loadArchivedStarredDates() {
            if (!starredPapers || starredPapers.size === 0) return;
            const datesToLoad = new Set();
            starredPapers.forEach(aid => {
                const date = paperDateIndex[aid];
                if (date && !windowDateSet.has(date) && !loadedDates.has(date)) {
                    datesToLoad.add(date);
                }
            });
            if (datesToLoad.size === 0) return;

            let loadedCount = 0;
            for (const date of datesToLoad) {
                try {
                    const response = await fetch(`data/${date}.json?v=${DATA_VERSION}`);
                    if (!response.ok) continue;
                    const dateData = await response.json();
                    allPapers[date] = dateData.clusters;
                    allPaperTags[date] = dateData.tags;
                    if (dateData.overview) {
                        dailyOverviews[date] = dateData.overview;
                    }
                    loadedDates.add(date);
                    loadedCount++;
                } catch (e) {
                    console.error(`加载收藏日期 ${date} 数据失败:`, e);
                }
            }
            if (loadedCount > 0) {
                renderPapers();
            }
        }

        // 从localStorage加载状态
        function loadState() {
            const starred = localStorage.getItem('starred_papers');
            const read = localStorage.getItem('read_papers');
            const deleted = localStorage.getItem('deleted_papers');
            const summaryLang = localStorage.getItem('summary_language');

            if (starred) starredPapers = new Set(JSON.parse(starred));
            if (read) readPapers = new Set(JSON.parse(read));
            if (deleted) deletedPapers = new Set(JSON.parse(deleted));
            if (summaryLang !== null) showChineseSummary = summaryLang === 'chinese';
        }

        // 保存状态到localStorage
        function saveState() {
            localStorage.setItem('starred_papers', JSON.stringify([...starredPapers]));
            localStorage.setItem('read_papers', JSON.stringify([...readPapers]));
            localStorage.setItem('deleted_papers', JSON.stringify([...deletedPapers]));
            localStorage.setItem('summary_language', showChineseSummary ? 'chinese' : 'english');
        }

        // 显示撤销删除的Toast
        function showUndoToast(message, seconds, onUndo, onExpire) {
            const toast = document.getElementById('undo-toast');
            const msgEl = document.getElementById('toast-message');
            const cdEl = document.getElementById('countdown');
            const undoBtn = document.getElementById('undo-btn');

            msgEl.textContent = message;
            let remaining = seconds;
            cdEl.textContent = `(${remaining}s)`;
            toast.classList.remove('hidden');

            let intervalId = setInterval(() => {
                remaining -= 1;
                cdEl.textContent = `(${remaining}s)`;
                if (remaining <= 0) {
                    clearInterval(intervalId);
                    toast.classList.add('hidden');
                    try { onExpire && onExpire(); } catch (e) {}
                }
            }, 1000);

            let expireTimer = setTimeout(() => {
                clearInterval(intervalId);
                toast.classList.add('hidden');
                try { onExpire && onExpire(); } catch (e) {}
            }, seconds * 1000);

            const cleanup = () => {
                clearInterval(intervalId);
                clearTimeout(expireTimer);
                toast.classList.add('hidden');
            };

            const onUndoClick = () => {
                cleanup();
                try { onUndo && onUndo(); } catch (e) {}
            };

            undoBtn.removeEventListener('click', onUndoClick);
            undoBtn.addEventListener('click', onUndoClick);
        }

        // 显示简单的提示信息
        function showSimpleToast(message) {
            // 创建一个简单的toast元素

            toast.textContent = message;

            document.body.appendChild(toast);

            // 3秒后自动消失
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // 删除论文
        function deletePaper(arxivId, title) {
            const paperEl = document.querySelector(`[data-arxiv-id="${cssEscape(arxivId)}"]`);
            if (!paperEl) return;
            const listItem = paperEl.closest('li');
            const sectionEl = paperEl.closest('section[data-date-section]');

            paperEl.style.transition = 'all 0.3s ease-out';
            paperEl.style.transform = 'scale(0.95)';
            paperEl.style.opacity = '0.5';

            setTimeout(() => {

                saveState();

                // 移除DOM元素
                if (listItem) {
                    listItem.remove();
                } else {
                    paperEl.remove();
                }

                updateDateSection(sectionEl);
                updateStats();
                buildToc();

            // 窗口外的论文取消收藏后应立即隐藏，新收藏的则应立即出现。
            const paperDate = (paperDataMap[arxivId] && paperDataMap[arxivId].date)
                || paperDateIndex[arxivId];

                renderPapers();

        // 可折叠功能
        function toggleCollapsible(header) {
            const content = header.nextElementSibling;
            const isOpen = header.classList.contains('open');

            if (isOpen) {
                header.classList.remove('open');
                content.classList.remove('open');
            } else {
                header.classList.add('open');
                content.classList.add('open');
                // Lazy render: parse markdown only when first opened
                lazyRenderMarkdown(content);
