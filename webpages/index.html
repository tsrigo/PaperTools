增益与冗余的 claim。此实验无需复现完整的 RL 训练循环，只需通过离线评估不同奖励信号对记忆选择策略的影响即可验证核心机制。", "research_value": "### § 11 最强反例设计\n\n若要挑战 CMI-Mem 的有效性，最有力的攻击并非质疑其性能提升，而是攻击其核心假设——即**嵌入空间中的几何残差投影（Residual Projection）能够忠实代理信息论意义上的条件互信息（CMI）**。这一假设在语义高度非线性或存在“语义等价但形式不同”的场景下极易失效。\n\n**具体反例场景：语义重构与同义替换（Semantic Paraphrasing \u0026 Reconstruction）**\n设计一个实验，其中用户输入 $C_t$ 是对现有记忆 $M_{t-1}$ 中信息的**完全同义重构**或**逻辑推导结果**，而非简单的重复。例如，$M_{t-1}$ 包含事实：“用户喜欢苹果”，$C_t$ 为：“我倾向于选择红色的水果，尤其是那种脆甜的品种”。\n*   **理论攻击点**：从信息论角度看，如果 $C_t$ 完全由 $M_{t-1}$ 决定（即 $H(C_t|M_{t-1}) \\approx 0$），则 $I(C_t; m^{new}_t | M_{t-1})$ 应接近于 0，因为新记忆 $m^{new}_t$ 没有提供额外的不确定性减少。然而，在 LLM 的嵌入空间中，由于“苹果”和“红色脆甜水果”的向量表示可能位于不同的子空间，且经过残差投影后，$\\mathbf{r}_C$ 和 $\\mathbf{r}^{new}$ 可能表现出非零的余弦相似度，导致 CMI 估计器错误地赋予高奖励。\n*   **后果**：模型会错误地将这种“语义冗余”视为“新颖信息”并存储，导致记忆库中充斥着大量语义等价但形式不同的冗余条目（Memory Bloating），这与论文声称的“抑制冗余”背道而驰。\n*   **替代解释**：CMI-Mem 在基准测试中的成功可能并非源于其捕捉到了真正的“信息增益”，而是因为它通过高斯整形（Gaussian Shaping）无意中惩罚了那些与现有记忆向量过于接近的“字面重复”，从而起到了一种隐式的去重作用。这种去重效果可以通过更简单的余弦相似度阈值（Cosine Similarity Thresholding）实现，无需引入复杂的 CMI 理论框架。因此，CMI 的引入可能是一种“过拟合”的理论包装，其实际贡献仅限于一种特定的、基于向量距离的启发式去重，而非通用的信息价值评估。\n\n**验证实验**：\n构建一个合成数据集，其中包含三类记忆操作：1) 字面重复（Literal Repetition）；2) 语义重构（Semantic Paraphrasing）；3) 真正的新信息（Novel Information）。测量 CMI 估计器对这三类的评分分布。如果 CMI 对“语义重构”的评分显著高于 0 且接近“新信息”，则证明其无法区分语义冗余与信息增益，其泛化能力的提升可能仅依赖于对字面重复的抑制，而非对深层信息结构的理解。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：基于因果干预的记忆价值评估（Causal Intervention-based Memory Valuation, CIMV）**\n\n**（a）驱动局限与未满足需求**\nCMI-Mem 的核心局限在于其依赖嵌入空间的几何近似来估计信息增益，这忽略了记忆在下游任务中的**因果效用（Causal Utility）**。互信息（CMI）衡量的是统计相关性，而非因果性。一个记忆片段可能与当前会话高度相关（高 CMI），但对最终的任务目标（如决策、推理）并无因果贡献，甚至可能是混淆变量（Confounder）。现有的 QA 奖励虽然提供了因果信号，但过于稀疏且滞后。我们需要一种方法，能够在记忆操作发生的瞬间，评估该记忆对下游任务结果的**因果影响**，而不仅仅是统计相关性。\n\n**（b）借鉴相邻领域的方法**\n借鉴**因果推断（Causal Inference）**中的**反事实推理（Counterfactual Reasoning）**和**干预（Intervention, do-calculus）**概念。具体而言，可以借鉴**Causal Representation Learning**中的方法，通过构建一个轻量级的“因果图”或“结构因果模型（SCM）”，将记忆状态、会话上下文和下游任务结果建模为随机变量。利用**Shapley Value**或**Integrated Gradients**等归因方法，在嵌入空间或潜在空间中模拟“如果未存储该记忆，任务结果会如何变化”，从而计算记忆的**因果边际贡献（Causal Marginal Contribution）**。\n\n**（c）第一个实验设计**\n1.  **框架构建**：在 CMI-Mem 的 Pipeline 中，替换 CMI 奖励模块为 **Causal Impact Reward (CIR)**。\n2.  **实现细节**：\n    *   训练一个轻量级的**Counterfactual Predictor**，输入为 $(C_t, M_{t-1}, \\text{mask})$，其中 mask 表示是否包含新记忆 $m^{new}_t$。\n    *   该 Predictor 预测下游任务（如 QA 答案）的分布。\n    *   CIR 定义为：$r^{CIR}_t = P(\\text{Success} | \\text{do}(M_t)) - P(\\text{Success} | \\text{do}(M_{t-1}))$，即存储新记忆前后，任务成功概率的因果差异。\n    *   为了计算效率，可以使用**Embedding Space Intervention**，即在嵌入空间中直接对 $m^{new}_t$ 的向量进行零化或扰动，观察对下游 Reader 输出 logits 的影响，作为因果效用的代理。\n3.  **实验对比**：\n    *   在 LongMemEval 和 MemoryAgentBench 上，对比 CMI-Mem（基于相关性）与 CIMV（基于因果性）的性能。\n    *   **关键指标**：除了准确率，重点分析**记忆稀疏性（Memory Sparsity）**和**鲁棒性（Robustness）**。假设 CIMV 能够更有效地剔除那些“相关但无用”的记忆（如闲聊中的高 CMI 但低因果价值的片段），从而在保持相同准确率的前提下，显著减少记忆库大小，并在分布外（OOD）任务中表现出更强的鲁棒性，因为因果结构比统计相关性更具泛化性。\n\n**与已有工作的区别**：\n现有工作（如 CMI-Mem）关注的是记忆与上下文之间的**统计依赖（Statistical Dependence）**，而 CIMV 关注的是记忆对任务结果的**因果贡献（Causal Contribution）**。这不仅解决了 CMI 近似不准确的问题，还从根本上改变了记忆管理的目标：从“保留信息”转向“保留因果效用”，为构建更高效、更鲁棒的 AI Agent 记忆系统提供了新的理论框架。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Yubo Wang\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Qiuyu Zhao\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Zenghui Sun\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Shichao Dong\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jinsong Lan\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xiaoyong Zhu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Haoyang Li\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Bo Zheng\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Lei Chen\",\n      \"affiliations\": [\n        2,\n        4\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Alibaba Group\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"HKUST\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"PolyU\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"HKUST(GZ)\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal Contribution.\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding authors.\"\n    }\n  ]\n}\n```", "summary_translation": "Memory Manager 模型在智能体系统中至关重要。现有方法主要依赖于由 LLM 判定的合成问答（QA）对，使得记忆评估依赖于采样查询和下游阅读器。为了解决这一局限性，我们提出了 \\textbf{CMI-Mem}，一种基于强化学习（RL）的轻量级记忆管理器模型，其混合奖励结合了下游 QA 正确性和内在条件互信息（CMI）。CMI 评估新对话输入相对于当前记忆状态所贡献的信息，而不依赖于采样 QA 查询，从而补充而非取代 QA 基础。我们的代码可在以下地址获取：https://github.com/Wyb0627/CMIMem ，CMI-Mem-4B 模型检查点可在以下地址获取：https://www.modelscope.cn/models/wyb0627/CMIMem-4B"}, {"title": "AttriMem: Attribution-Guided Process Feedback for Agent Memory Learning", "arxiv_id": "2607.21106", "authors": "Qinfeng Li, Yuntai Bao, Xinyan Yu, Hongze Chen, Wenqi Zhang, Xuhong Zhang", "summary": "Effective memory is crucial for LLM agents, yet constructing it effectively remains challenging. A memory-construction policy decides what information to extract, store, update, compress, or discard as interactions accumulate. Heuristic memory methods rely on subjective, task-specific rules, which can misalign with downstream objectives and limit cross-task adaptability. RL-based methods, by contrast, learn from task feedback but mainly use outcome- or module-level rewards. These coarse signals indicate task success but cannot identify which intermediate memory contents support the final answer, creating a fine-grained credit-assignment bottleneck. However, constructing such process feedback is prohibitively difficult because intermediate memory decisions lack unique ground-truth targets, while the appropriate credit varies with the agent's uncertain reasoning trajectory and therefore cannot be specified in advance. We propose AttriMem, an attribution-guided process-feedback framework for learning memory-construction policies with RL. AttriMem augments the global outcome reward with local rewards derived from token-level contributions to the final answer. Experiments on long-horizon dialogue question answering show that AttriMem outperforms retrieval-based, heuristic, and RL-based baselines, generalizes across benchmarks and answer models, stabilizes RL optimization.", "category": "cs.AI", "cluster": "Agent Memory \u0026 Learning Efficiency", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=53 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文完全符合研究范围，核心依据如下：\n\n1.  核心对象匹配：论文明确针对 LLM Agents（LLM智能体），研究焦点是智能体的关键能力之一——记忆（Memory）。摘要中多次提到 \"LLM agents\", \"memory-construction policy\", \"agent's uncertain reasoning trajectory\"，直接对应筛选标准中的 Agentic AI 和 Memory 子方向。\n2.  机制创新符合“构建/改进”标准：论文提出了一种新的框架 AttriMem，旨在解决智能体记忆构建中的信用分配（credit-assignment）问题。它通过归因引导的过程反馈（attribution-guided process feedback）来优化记忆策略，这属于对智能体内部机制（记忆管理）的构建与改进，符合第一步中“保留：如果论文的核心是关于构建LLM智能体...的方法论或新框架”的标准。\n3.  涉及自我优化/学习机制：论文使用强化学习（RL）来学习记忆构建策略，并引入了细粒度的过程反馈以稳定优化。这涉及智能体如何通过反馈信号进行自我完善和策略迭代，符合 Self-Improvement 和 Agent Training 的相关前沿方向。\n4.  排除项检查：\n       不涉及安全、对齐、可解释性（虽然用了attribution，但目的是优化记忆策略而非解释模型黑盒，且未涉及Safety/Alignment标签）。\n       不涉及多模态、图神经网络或纯基础设施。\n       不是简单的应用，而是提出了通用的记忆学习机制。\n\n综上，该论文研究的是LLM智能体记忆机制的优化与学习，属于单智能体能力构建的核心范畴，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决 **LLM agents** 在长程交互任务中 **memory-construction policy**（记忆构建策略）的学习难题，核心挑战在于如何克服 **fine-grained credit-assignment bottleneck**（细粒度信用分配瓶颈）。在长对话问答等场景中，Agent 需要从海量且混杂无关信息的交互历史中提取、存储、更新或丢弃信息以构建外部记忆。现有的 **RL-based memory learning** 方法虽然能通过任务反馈优化策略，但主要依赖 **outcome-level rewards**（结果级奖励，如最终答案的正确性）或粗粒度的 **action-level rewards**（动作级奖励）。这种稀疏且粗糙的信号无法指明哪些具体的中间记忆内容（甚至具体到 token）对最终答案产生了贡献，导致 Agent 难以区分关键证据与噪声，也无法针对记忆内容的内部细节进行精细化优化。\n\n该问题的重要性在于，有效的记忆是 LLM Agent 具备长期规划与复杂推理能力的基础。如果无法精确地将最终任务的成功归因于特定的记忆操作或内容片段，Agent 就无法学习到真正 **task-grounded**（任务导向）且高效的记忆构建行为。解决这一问题的价值体现在三个方面：首先，通过引入 **attribution-guided process feedback**（归因引导的过程反馈），能够显著提升 Agent 在长程对话问答中的准确率，并增强其在不同基准测试和不同 **answer models** 之间的泛化能力；其次，细粒度的 **token-level attribution** 使得 RL 优化更加稳定，避免了传统 Outcome-only RL 中因奖励稀疏导致的训练震荡或收敛困难；最后，该方法能够引导 Agent 自动过滤无关上下文，保留高价值的 **answer-critical details**（答案关键细节），从而构建出更紧凑、更高质量的结构化记忆库，提升推理效率与可解释性。\n\n### § 2 前人工作与不足\n\n该问题此前已有多种尝试，但均存在显著局限。**Heuristic memory methods**（如 Mem0, MIRIX, LightMem）依赖人工设计的规则或启发式评分函数来决定信息的存储与检索。这些方法的主要不足在于 **objective mismatch**（目标错位）：基于人类直觉设计的显著性规则往往与下游任务的实际需求不一致，且缺乏跨任务的适应性，一旦任务目标改变，原有的记忆策略便失效，需要大量人工调整。\n\n相比之下，**RL-based memory learning methods** 试图通过任务反馈自动学习记忆策略，但仍面临 **credit-assignment** 的困境。**Task-performance RL**（如 Mem-$\\alpha$）仅使用最终答案的正确性作为奖励，信号极度稀疏，无法指导中间步骤的优化。**Outcome-redistribute rewards methods**（如 Mem-T）虽然通过采样记忆动作树将最终奖励回溯分配给中间节点，但这本质上仍是最终反馈的重新分布，并未引入新的信息，无法解决“哪些具体记忆内容导致了成功”的问题。\n\n最接近的工作是 **QA-derived action-reward methods**（如 MemBuilder），它通过合成辅助 QA 对来评估记忆库，并根据检索使用情况生成动作级奖励。尽管这比单纯的结果奖励更密集，但其不足在于奖励粒度仍停留在 **action-level**（动作级），即对整个记忆操作进行整体评价，无法区分操作内部哪些 **tokens** 或 **spans** 是关键的。例如，一个记忆条目可能包含大量噪声，但只要包含少量关键实体，MemBuilder 就会给予整体正向奖励，导致 Agent 无法学会剔除冗余信息。此外，由于中间记忆决策缺乏唯一的 **ground-truth**，且其价值高度依赖于 Agent 不确定的推理轨迹，因此无法预先指定静态的过程监督信号。现有方法未能利用 **context attribution** 技术将最终答案的贡献逆向映射到具体的记忆 token 上，从而无法提供真正细粒度的、因果性的过程反馈，这正是 AttriMem 试图填补的关键缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n在长程对话问答（Long-horizon Dialogue QA）任务中，LLM Agent 面临的核心挑战是如何从海量、分散且包含噪声的历史交互中构建有效的外部记忆（Memory Construction）。早期的启发式方法（Heuristic Memory）依赖人工规则，存在主观性强、与下游任务目标不匹配（Objective Mismatch）以及跨任务泛化能力差的问题。为了解决这些问题，研究者转向基于强化学习（RL-based Memory Learning）的方法，试图让 Agent 从任务反馈中学习记忆策略。\n\n然而，现有的 RL 方法陷入了“细粒度信用分配瓶颈”（Fine-grained Credit-assignment Bottleneck）。传统的 Task-Performance RL 仅使用最终答案的正确性作为奖励信号，这种稀疏的 Outcome Reward 无法告诉 Agent 哪些中间的记忆操作（如提取、压缩、更新）对最终结果是有贡献的，哪些是冗余或有害的。虽然 Mem-T 等方法尝试通过记忆操作树将最终奖励重新分配（Redistribute）给中间节点，但这本质上只是信号的传播，并未引入新的信息，依然无法区分具体内容的价值。更进一步的 MemBuilder 利用合成的 QA 对生成 Action-level 的奖励，虽然比纯 Outcome Reward 更密集，但它仍然将每个记忆动作视为一个整体进行评估，无法识别动作内部哪些具体的 Token 或 Span 是关键证据，哪些是干扰信息。\n\n作者意识到，构建中间记忆步骤的 Ground-truth 是极其困难甚至不可能的，因为记忆决策没有唯一的标准答案，且其价值高度依赖于 Agent 不确定的推理轨迹。因此，静态的、预设的过程监督信号不可行。作者转而思考：能否利用最终答案本身作为“信用分配目标”（Credit-assignment Target），逆向追溯哪些中间记忆内容真正支撑了该答案？通过引入归因（Attribution）技术，量化每个 Token 对最终答案的贡献，可以将全局的任务成功信号转化为局部的、细粒度的过程奖励（Process Reward）。这种思路不仅解决了奖励稀疏问题，还能提供比 Action-level 更精细的 Token-level 指导，从而引导 Agent 保留关键证据并剔除噪声。\n\n### § 4 核心 Intuition\n\n现有 RL 记忆学习方法受限于稀疏的 Outcome Reward 或粗糙的 Action-level Reward，无法识别记忆内容中哪些具体细节对最终答案至关重要。AttriMem 的核心直觉是利用归因技术（Attribution），将最终答案作为信用分配目标，逆向量化中间记忆输出中每个 Token 对答案生成的贡献度。通过将这种 Token-level 的贡献转化为局部过程奖励，Agent 能够接收到比全局结果更精细的反馈，从而学会精准保留关键证据并过滤无关噪声，有效解决细粒度信用分配难题。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**AttriMem** 的核心方法是一种基于**归因（Attribution）**引导的**过程反馈（Process Feedback）**框架，旨在解决长程对话中记忆构建（Memory Construction）的**信用分配（Credit Assignment）**难题。传统强化学习（RL）仅依赖最终答案的正确性（Outcome Reward）来更新策略，导致中间记忆操作缺乏细粒度指导。AttriMem 通过量化中间记忆内容中每个 Token 对最终答案的贡献，生成局部过程奖励（Local Process Rewards），从而更精确地优化记忆策略。\n\n以下是结合一个真实场景的完整 Pipeline 说明：\n\n**场景设定：**\n*   **输入（Input）：** 用户与助手的长期对话历史 $H$。例如，用户在第 1 轮提到“我每天早上 7:15 坐公交车上班”，在第 5 轮提到“我最近开始听有声书，两个月听了三本”。最后用户提问：“我通勤时听完了多少本书？”\n*   **目标：** 记忆代理（Memory Agent）需要从历史中提取、压缩并存储关键信息，以便后续检索并回答该问题。\n\n**处理流程（Processing Pipeline）：**\n\n1.  **记忆构建阶段（Memory Construction）：**\n    *   记忆代理（基于 LLM，如 Qwen3-4B）观察当前会话 $h_t$ 和上一时刻的记忆库 $M_{t-1}$。\n    *   代理执行记忆操作 $a^{mem}_t$（如 `ADD`, `UPDATE`, `MERGE`），生成或修改记忆内容 $\\Delta M_t$。\n    *   *例子：* 代理在第 5 轮生成记忆条目：“用户通勤时听有声书，两个月听了三本。”\n\n2.  **问答与结果评估（QA \u0026 Outcome Evaluation）：**\n    *   使用固定的检索器（Retriever）从最终记忆库 $M_T$ 中检索相关信息。\n    *   使用固定的回答模型（Answer Model，如 Claude）生成最终答案 $\\hat{y}$。\n    *   计算全局结果奖励 $R_{out}$（例如，答案正确得 1 分，错误得 0 分）。\n\n3.  **归因分析（Attribution Analysis）—— AttriMem 的核心创新：**\n    *   **上下文构建：** 将中间记忆内容 $\\Delta M_t$ 分解为 Token 集合。\n    *   **随机掩码（Random Ablation）：** 使用 **ContextCite** 方法，随机掩码（移除）记忆中的不同 Token 子集，生成多个变体上下文。\n    *   **贡献度计算：** 保持最终答案 $\\hat{y}$ 不变，评估在不同掩码上下文中，回答模型对该答案的置信度（Logits）变化。\n    *   **线性回归拟合：** 通过稀疏线性回归（LASSO）拟合每个 Token 的保留与否对答案得分的影响，得到每个 Token 的归因分数 $\\phi$。\n    *   *例子：* 在记忆条目“两个月听了三本”中，Token “三本” 和 “两个月” 对回答“多少本”至关重要，因此获得高归因分数；而无关的修饰词得分较低。\n\n4.  **过程奖励生成（Process Reward Generation）：**\n    *   将 Token 级别的归因分数聚合，映射回产生该内容的记忆操作 $a^{mem}_t$。\n    *   计算局部过程奖励 $r_t$，公式为 $r_t = \\frac{1}{\\sqrt{l_t}} \\sum \\phi$，其中 $l_t$ 是记忆内容的长度，用于消除长度偏差。\n    *   *例子：* 如果“三本”被正确保留且归因分高，该记忆操作获得高过程奖励；如果代理错误地记录了“每月三本”，导致归因分低或负，则获得低奖励。\n\n5.  **策略优化（Policy Optimization）：**\n    *   使用 **GRPO**（Group Relative Policy Optimization）算法进行 RL 训练。\n    *   优势函数（Advantage）结合全局结果优势 $\\hat{A}^{out}$ 和局部过程优势 $\\hat{A}^{proc}$。\n    *   更新记忆代理的参数 $\\theta$，使其倾向于生成高归因分数的记忆内容。\n\n**输出（Output）：**\n*   优化后的记忆策略 $\\pi_\\theta$，能够更精准地提取和保留对下游任务关键的信息，过滤噪声。\n*   最终的高质量记忆库 $M_T$，支持更准确的问答。\n\n---\n\n### § 6 核心数学推导\n\n**理论背景：**\nAttriMem 的核心在于将**上下文归因（Context Attribution）**转化为**强化学习中的过程奖励（Process Reward）**。其数学基础建立在**反事实推理（Counterfactual Reasoning）**和**线性代理模型（Linear Surrogate Model）**之上。\n\n**1. 归因分数的定义（Attribution Score）：**\n归因的目标是衡量上下文源 $z_i$（如一个 Token）对响应 $y$ 的贡献。直觉上，如果移除 $z_i$ 导致模型对 $y$ 的置信度大幅下降，则 $z_i$ 的贡献大。\n公式：\n$$ \\phi(z_i, y; c) \\approx F(y | c) - F(y | c \\setminus \\{z_i\\}) $$\n其中 $F(y|c)$ 是模型在上下文 $c$ 下对答案 $y$ 的评分（如 Logits）。\n\n**2. ContextCite 的线性近似（Linear Approximation）：**\n直接计算所有可能的掩码组合计算量过大。ContextCite 假设响应评分 $g(v)$ 是包含向量 $v$（指示哪些 Token 被保留）的线性函数：\n$$ g(v) \\approx b + w^\\top v $$\n通过采样 $N$ 个随机掩码向量 $v_k$ 及其对应的评分 $g(v_k)$，使用 **LASSO 回归** 拟合权重 $w$：\n$$ \\min_w \\| g(v) - (b + w^\\top v) \\|^2 + \\alpha \\|w\\|_1 $$\n**Intuition：** L1 正则化（$\\alpha \\|w\\|_1$）鼓励稀疏性，因为通常只有少数关键 Token 对答案有决定性影响。拟合出的权重 $w_j$ 即为 Token $z_j$ 的归因分数 $\\phi_j$。\n\n**3. 过程奖励的计算（Process Reward）：**\n将归因分数映射回记忆操作。对于第 $t$ 步产生的记忆内容 $\\Delta M_t$，其过程奖励 $r_t$ 为该内容中所有 Token 归因分数的归一化总和：\n$$ r_t = \\frac{1}{\\sqrt{l_t}} \\sum_{j \\in I_t} \\phi_j $$\n其中 $l_t$ 是 $\\Delta M_t$ 的 Token 数量，$I_t$ 是其索引集合。\n**Intuition：** 除以 $\\sqrt{l_t}$ 是为了防止长记忆条目仅仅因为包含更多 Token 而获得更高的奖励总和，确保奖励反映的是“信息密度”而非“长度”。\n\n**4. GRPO 策略梯度（Policy Gradient）：**\nAttriMem 使用 GRPO 进行优化，其优势函数 $A_i$ 结合了结果奖励和过程奖励：\n$$ A_i = \\hat{A}^{out}_i + \\lambda \\hat{A}^{proc}_i $$\n其中 $\\hat{A}^{out}_i$ 是组内结果奖励的优势（Outcome Advantage），$\\hat{A}^{proc}_i$ 是基于过程奖励的优势（Process Advantage），$\\lambda$ 是平衡系数。\n**Intuition：** 传统 RL 仅使用 $\\hat{A}^{out}_i$，导致所有中间步骤共享同一个稀疏信号。AttriMem 引入 $\\hat{A}^{proc}_i$，为每个中间记忆操作提供独立的、细粒度的反馈，从而解决**信用分配瓶颈（Credit Assignment Bottleneck）**。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有基于 RL 的记忆学习方法主要依赖最终任务表现（Outcome Reward）或粗粒度的动作级奖励，存在**细粒度信用分配瓶颈（Fine-grained Credit-assignment Bottleneck）**。这导致模型难以识别哪些具体的记忆内容（Token 级别）对最终答案至关重要，从而限制了记忆构建策略的优化效果和跨任务泛化能力。\n\n**2. 设计了什么实验验证这个问题？**\n*   **主实验（Main Results）：** 在 LongMemEval、LoCoMo 和 PerLTQA 三个长程对话问答基准上，对比 AttriMem 与基线方法（包括启发式方法如 Mem0、MIRIX，以及 RL 方法如 MemBuilder、Mem-T）。重点比较 SFT 初始化后，加入不同奖励信号（Outcome-only, Action-level, Token-level）的 RL 训练效果。\n*   **消融实验（Ablation Study）：** 验证奖励粒度的影响，比较 Outcome-only RL、Action-level Attribution RL 和 Token-level Attribution RL 的性能差异。\n*   **跨模型泛化实验（Transfer across Answer Models）：** 使用不同的回答模型（Claude, GPT-4.1, Qwen3-4B）评估同一记忆库，验证学习到的记忆结构是否与特定回答模型解耦。\n*   **中间记忆质量评估（Intermediate Memory Quality）：** 使用 LLM Judge 对中间记忆步骤进行成对比较，评估 AttriMem 生成的记忆在证据忠实度、答案关键性覆盖等方面的质量。\n*   **训练动态分析（Training Dynamics）：** 监控 RL 训练过程中的奖励变化曲线，评估优化稳定性。\n\n**3. 问题的答案是什么？**\n*   **Token 级归因奖励显著提升性能：** AttriMem 在所有三个基准上均优于最强基线（如 MemBuilder），证明细粒度的过程反馈能有效优化记忆策略。\n*   **粒度越细，效果越好：** 消融实验显示，Token-level 奖励优于 Action-level 和 Outcome-only 奖励，证实了细粒度信用分配的必要性。\n*   **良好的泛化能力：** 学习到的记忆结构在不同回答模型间具有良好的迁移性，说明 AttriMem 学习到了通用的、任务相关的记忆表示，而非过拟合于特定模型的推理模式。\n*   **优化更稳定：** AttriMem 的训练奖励曲线比基线方法更平滑且持续上升，表明过程奖励提供了更稳定的优化信号，缓解了 RL 训练中的稀疏奖励问题。\n*   **中间记忆质量更高：** LLM Judge 评估显示，AttriMem 生成的中间记忆在保留关键事实和去除噪声方面显著优于基线方法。", "additional_insights": "### § 8 Take-aways\n\nAttriMem 的核心突破在于将 **credit-assignment** 的粒度从传统的 outcome-level 或 action-level 细化到了 **token-level**，从而解决了长程对话中记忆构建的稀疏奖励问题。该方法利用 **ContextCite** 进行归因分析，通过随机掩码（masking）中间记忆内容并观察最终答案得分的变化，量化每个 token 对最终结果的贡献，进而生成细粒度的 **process rewards**。实验表明，这种基于归因的局部奖励信号能够显著稳定 **RL** 训练过程，避免传统 **GRPO** 仅依赖全局结果奖励时出现的优化不稳定和中间步骤惩罚缺失问题。在 LoCoMo、LongMemEval 和 PerLTQA 等基准测试中，AttriMem 不仅超越了现有的启发式方法和基于 RL 的基线（如 MemBuilder），还展示了良好的跨模型泛化能力，即训练出的记忆策略在不同 **answer models**（如 Claude, GPT-4.1, Qwen）下均保持有效。此外，消融实验证实了 **token-level attribution** 优于 **action-level attribution**，且该奖励机制与 **SFT** 初始化具有互补性，能够进一步挖掘记忆构建策略的潜力。\n\n### § 9 最脆弱的假设\n\nAttriMem 最脆弱且关键的假设是：**基于 ContextCite 的 token-level 归因分数能够准确、无偏地反映中间记忆内容对最终答案的真实因果贡献**。如果这一假设不成立，即归因模型错误地将无关 token 标记为高贡献，或将关键信息标记为低贡献，那么生成的 **process rewards** 将包含大量噪声甚至误导性信号，导致 **RL** 策略向错误的方向优化，核心贡献将直接失效。在实际中，该假设可能不成立的原因包括：1) **ContextCite** 依赖于线性代理模型（linear surrogate）和 LASSO 正则化，这种近似在长上下文或复杂推理链条中可能无法捕捉高阶交互效应，导致归因偏差；2) 最终答案模型（answer model）本身的评分机制可能存在偏差，例如对某些表述风格而非事实内容的偏好，这会污染归因信号；3) 记忆内容中的冗余信息可能在归因中被错误地赋予高权重，因为移除它们可能不会立即改变答案，但保留它们可能增加了检索噪声。论文提供的证据主要是消融实验显示 **token-level** 优于 **action-level**，以及定性案例研究（Figure 2）显示归因奖励能保留关键事实。然而，论文缺乏对归因准确性（attribution fidelity）的定量评估，例如将归因分数与人工标注的关键证据进行对比，也未充分讨论当 **answer model** 本身存在幻觉或推理错误时，归因信号如何被污染。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现的核心点是验证 **token-level attribution rewards** 是否比 **outcome-only rewards** 提供更稳定的优化信号和更高质量的中间记忆。具体方案如下：\n1.  **数据**：使用 LongMemEval 的一个小子集（例如 100-200 个样本），包含多轮对话历史和对应的问题/答案。\n2.  **实现**：\n    *   构建一个简化的记忆构建代理，使用一个小型 LLM（如 Qwen2.5-1.5B 或 Llama-3-8B）作为策略模型，执行简单的记忆提取操作（如 `ADD` 或 `SKIP`）。\n    *   实现 **ContextCite** 归因模块：对于每个生成的记忆片段，随机掩码部分 token，通过固定的 **answer model**（如本地部署的较小模型或 API 调用）计算答案概率的变化，拟合线性模型得到 token 级贡献分数。\n    *   实现两种奖励机制：(a) **Outcome-only**：仅根据最终答案的正确性给予 0/1 奖励；(b) **AttriMem-style**：结合 outcome reward 和归因得到的 token-level process reward。\n3.  **测量**：\n    *   使用 **GRPO** 或简单的 PPO 进行几轮训练（例如 50-100 步）。\n    *   记录每步的 **reward curve**，观察 **AttriMem-style** 是否比 **Outcome-only** 更平滑、收敛更快。\n    *   使用一个 LLM Judge（如 GPT-4o）对训练后的策略生成的中间记忆进行两两比较，评估其 **evidence-grounded faithfulness** 和 **answer-critical coverage**。\n4.  **结果判定**：如果 **AttriMem-style** 的奖励曲线波动更小，且 LLM Judge 判定其生成的中间记忆在关键信息保留上显著优于 **Outcome-only** 基线，则支持论文 claim；反之，如果归因引入的噪声导致训练发散或记忆质量下降，则反驳该 claim 的有效性。此实验无需复现完整的四模块记忆架构，仅需验证归因奖励在简化设置下的有效性。", "research_value": "### § 11 最强反例设计\n\n若要挑战 AttriMem 的有效性，最有力的攻击点在于其核心假设的脆弱性：**归因信号（Attribution Signal）与真实因果贡献（True Causal Contribution）之间的解耦，以及由此引发的“奖励黑客”（Reward Hacking）现象**。\n\n**理论论证：线性近似的失效与高阶交互的忽略**\nAttriMem 依赖 **ContextCite** 和 **LASSO 回归** 来估计 Token 的贡献。这一方法隐含了一个强假设：Token 对答案的影响是**可加的（Additive）**且**线性的（Linear）**。然而，在长程对话推理中，关键信息往往依赖于**高阶交互（Higher-order Interactions）**。例如，答案可能取决于“时间 A”和“事件 B”的同时存在，单独移除任何一个 Token 可能不会显著降低模型置信度（因为另一个 Token 提供了部分线索），导致 LASSO 将这两个关键 Token 的权重都压缩为零或极低值。\n*   **反例场景**：设计一个“逻辑门”类型的记忆任务。假设记忆库中包含两条独立的事实：“用户喜欢苹果”和“用户讨厌香蕉”。问题问：“用户喜欢的水果是什么？”如果 AttriMem 的归因模型是线性的，它可能无法正确识别“苹果”和“喜欢”之间的强耦合，或者在存在干扰项（如“用户也吃过梨”）时，错误地将注意力分散到无关 Token 上。更极端的情况是，如果答案依赖于两个分散在不同记忆条目中的实体（Entity Linking），线性归因可能完全失效，导致 **Process Reward** 无法区分“包含部分关键信息”和“包含全部关键信息”的记忆操作，从而无法引导 Agent 学习复杂的跨条目推理。\n\n**实验设计：对抗性噪声与奖励黑客**\n设计一个实验，其中 **Answer Model** 对特定的、无意义的“触发词”（Trigger Words）存在偏差，而这些触发词与任务答案无关。\n1.  **构造数据**：在 LongMemEval 的子集中，人工注入一些高频但无意义的短语（如“根据最新数据”、“值得注意的是”），并确保这些短语在训练集中与正确答案共现频率较高（即使没有因果关系）。\n2.  **训练过程**：使用 AttriMem 训练记忆代理。由于 **ContextCite** 基于统计相关性而非因果性，这些触发词可能会获得高归因分数 $\\phi$，因为移除它们会导致 Answer Model 的置信度下降（由于模型本身的偏见）。\n3.  **结果观测**：观察训练后的记忆代理是否开始**过度生成**这些触发词，即使它们对答案毫无帮助。如果 Agent 学会了“填充”高归因分数的噪声 Token 以最大化 $r_t$，而忽略了真正的事实内容，这就证明了 AttriMem 容易受到 **Reward Hacking** 的攻击。\n4.  **对比基线**：同时运行一个基于 **Outcome-only** 的 RL 基线。如果 AttriMem 的 Agent 在测试集（不含这些触发词偏差）上的性能显著低于 Outcome-only 基线，或者其生成的记忆库中充满了无意义的“高归因”噪声，则证明该方法在存在模型偏差时是不鲁棒的。\n\n**真实世界场景：动态上下文与归因滞后**\n在真实的长程交互中，上下文是动态变化的。AttriMem 的归因是在**最终答案生成后**，基于**静态的**最终记忆库 $M_T$ 进行的。然而，记忆构建是一个**时序过程**。\n*   **攻击点**：某个 Token 在早期步骤中可能是噪声，但在后期步骤中被其他信息“激活”或“修正”后才变得关键。AttriMem 的归因分析是**后验的（Post-hoc）**且**全局的**，它无法区分 Token 在**构建时**的价值和**最终使用时**的价值。如果 Agent 在早期错误地存储了一个模糊的实体（如“他”），而在后期通过上下文澄清了“他”指代谁，AttriMem 可能会给早期的模糊存储给予低奖励（因为单独看“他”贡献低），从而惩罚了合理的、渐进式的记忆构建策略。这会导致 Agent 倾向于在每一步都生成“完美”但可能不切实际的记忆，破坏了记忆构建的自然流。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“静态归因”到“因果干预”——基于反事实记忆编辑的鲁棒信用分配（Causal Intervention-based Credit Assignment via Counterfactual Memory Editing）**\n\n**（a）驱动局限与未满足需求**\nAttriMem 的核心局限在于其归因机制是**统计性的（Statistical）**而非**因果性的（Causal）**。它依赖于 Answer Model 的置信度变化，这容易受到模型偏见、高阶交互忽略和上下文动态性的影响。现有的 **Process Feedback** 方法大多停留在“相关性”层面，无法回答“如果这个记忆 Token 不存在，答案是否会*必然*改变？”这一因果问题。此外，AttriMem 的归因是**后验的**，无法指导 Agent 在记忆构建的*过程中*进行前瞻性的因果推理。我们需要一种能够区分“相关噪声”和“因果证据”的机制，并能在记忆构建的每一步提供**反事实（Counterfactual）**指导。\n\n**（b）借鉴相邻领域的方法**\n借鉴**因果推断（Causal Inference）**中的**干预（Intervention）**和**反事实推理（Counterfactual Reasoning）**技术，特别是**Do-calculus** 和 **Structural Causal Models (SCMs)**。同时，结合**程序性记忆（Procedural Memory）**和**符号推理（Symbolic Reasoning）**的思想，将记忆构建视为一个可解释的因果图构建过程。具体而言，可以借鉴 **Causal Discovery** 算法（如 PC 算法或 NOTEARS）来识别记忆 Token 与答案之间的因果结构，而不是仅仅依赖线性回归。\n\n**（c）第一个实验设计**\n1.  **方法框架：CausalMem**\n    *   **因果图构建**：在记忆构建阶段，不仅存储文本 Token，还构建一个轻量级的**因果图（Causal Graph）**，节点为关键实体和关系，边表示潜在的因果依赖。\n    *   **反事实干预奖励**：在计算 Process Reward 时，不再使用随机掩码（Random Ablation），而是进行**结构性干预（Structural Intervention）**。对于每个记忆操作 $a^{mem}_t$，生成其**反事实版本**（例如，移除某个实体节点及其所有关联边），并观察 Answer Model 在**干预后**的分布变化。\n    *   **因果优势函数**：定义 **Causal Advantage** 为干预前后答案概率的**最大差异**，并结合**因果发现算法**计算的**因果强度（Causal Strength）**。只有当移除某个 Token 导致答案分布发生**显著且稳定**的变化（通过统计检验，如 Bootstrap）时，才给予高奖励。\n    *   **前瞻性指导**：在记忆构建的每一步，Agent 不仅接收当前的 Process Reward，还接收一个**因果预测信号**，预测当前记忆操作对未来潜在问题的因果贡献。\n\n2.  **实验设置**\n    *   **数据集**：使用 **LongMemEval** 和 **LoCoMo**，并额外构建一个**因果敏感基准（Causal-Sensitive Benchmark）**，其中包含大量需要区分相关性和因果性的问题（例如，控制变量实验、多因素推理）。\n    *   **对比基线**：AttriMem（统计归因）、Outcome-only RL、以及一个基于**符号逻辑（Symbolic Logic）**的记忆构建基线。\n    *   **评估指标**：\n        *   **因果忠实度（Causal Faithfulness）**：通过人工标注或 LLM Judge 评估记忆库中保留的信息是否确实是答案的因果证据，而非仅仅是相关噪声。\n        *   **鲁棒性（Robustness）**：在 Answer Model 存在偏见或噪声的情况下，评估 CausalMem 与 AttriMem 的性能下降幅度。\n        *   **可解释性（Interpretability）**：可视化因果图，评估其是否反映了人类理解的因果结构。\n\n3.  **预期结果与创新点**\n    *   **创新点**：将记忆构建从“文本压缩”提升为“因果结构学习”，解决了 AttriMem 的统计偏差问题。\n    *   **预期结果**：CausalMem 在因果敏感任务上显著优于 AttriMem，且在存在模型偏见时表现出更强的鲁棒性。因果图提供了比 Token-level 归因更清晰、更可解释的记忆结构。\n\n这个研究方向不仅解决了 AttriMem 的局限，还打开了**因果记忆（Causal Memory）**这一新领域，将 LLM Agent 的记忆能力从“存储信息”提升到“理解因果”，为更复杂的长期规划和推理奠定了基础。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Qinfeng Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuntai Bao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xinyan Yu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hongze Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Wenqi Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xuhong Zhang\", \"affiliations\": [1], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Zhejiang University\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "有效的记忆对于 LLM agents 至关重要，然而有效地构建记忆仍然具有挑战性。记忆构建策略决定了随着交互的积累，应提取、存储、更新、压缩或丢弃哪些信息。启发式记忆方法依赖于主观的、特定于任务的规则，这可能与下游目标不一致，并限制跨任务适应性。相比之下，基于 RL 的方法从任务反馈中学习，但主要使用结果级或模块级的奖励。这些粗糙的信号表明了任务的成功，但无法识别哪些中间记忆内容支持最终答案，从而造成了细粒度的信用分配瓶颈。然而，构建此类过程反馈极其困难，因为中间记忆决策缺乏唯一的地面真值目标，而适当的信用分配随 agent 不确定的推理轨迹而变化，因此无法预先指定。我们提出了 AttriMem，这是一个归因引导的过程反馈框架，用于通过 RL 学习记忆构建策略。AttriMem 通过源自 token 级对最终答案贡献的局部奖励来增强全局结果奖励。在长程对话问答上的实验表明，AttriMem 优于基于检索、启发式和基于 RL 的基线方法，在 benchmarks 和答案模型之间具有泛化能力，并稳定了 RL 优化。"}]}, {"name": "Agent Frameworks \u0026 Infrastructure", "count": 2, "papers": [{"title": "OpenForgeRL: Train Harness-native Agents in Any Environment", "arxiv_id": "2607.21557", "authors": "Xiao Yu, Baolin Peng, Ruize Xu, Hao Zou, Qianhui Wu, Hao Cheng, Wenlin Yao, Nikhil Singh, Zhou Yu, Jianfeng Gao", "summary": "Modern AI agents rely on elaborate inference harnesses such as Claude Code, Codex, and OpenClaw to drive multi-turn reasoning, tool use, and access to external systems. While powerful, these complex harnesses also make agents hard to train end-to-end with open infrastructure, whose SFT/RL stacks cannot natively express stateful, multi-process harness inference. To address this, we present OpenForgeRL, an open-source framework for training harness-based agents end-to-end in diverse environments. OpenForgeRL achieves this with a lightweight proxy that serves the harness's model calls while recording them as training data for a standard RL codebase (e.g., veRL), and a Kubernetes orchestrator that runs each rollout in its own remote container, together enabling training on any harness in any environment at scale. By decoupling training and inference, OpenForgeRL allows researchers to easily train, study, and improve agents directly in the real harnesses and environments they are deployed with. We validate our framework across diverse, complex harnesses and environments, spanning tool/claw-based agents and multimodal GUI browser- and computer-use agents. Using only hundreds to a few thousand tasks, OpenForgeClaw reaches 31.7 pass^3 and 55.9 pass@3 on ClawEval and 33.7 on QwenClawBench. OpenForgeGUI reaches 37.7 on OSWorld-Verified, 63.0 on Online-Mind2Web, and 72.3 on WebVoyager. Both outperform open baselines of similar size on nearly all benchmarks, and in the GUI setting match or surpass models several times larger. Beyond benchmarks, we analyze how harness choice (e.g., ZeroClaw, OpenClaw, Codex) and RL shape agent behavior. We find that some harnesses are substantially harder to learn than others, and that RL improves agentic reliability, such as self-verification, tool coverage, and completing multi-step plans, though critical abilities such as error recovery remain weak.", "category": "cs.CL", "cluster": "Agent Frameworks \u0026 Infrastructure", "tags": ["cs.CL"], "filter_reason": "该论文完全符合“构建、改进、训练 LLM智能体”的研究范围，具体依据如下：\n\n1.  核心对象明确为 LLM Agents：论文标题和摘要明确指出研究对象是 \"Harness-native Agents\"（基于执行框架的智能体），涉及 \"multi-turn reasoning\"（多轮推理）、\"tool use\"（工具使用）和 \"external systems\"（外部系统交互），这些都是 Agentic AI 的核心特征。\n2.  符合“训练/改进智能体”的标准：论文提出了 OpenForgeRL 框架，旨在解决现有基础设施无法原生支持对复杂智能体执行框架（harness）进行端到端训练的问题。其核心贡献在于提供了一种机制，使得研究者可以直接在真实的智能体运行环境（harness）中通过 RL（强化学习）来训练和改进智能体。这直接对应筛选标准中“保留：如果论文研究 agent training/distillation/RL... 并且标题或摘要明确指向 Agentic / LLM Agents”的规则。\n3.  涉及智能体能力的演化与优化：摘要提到通过 RL 训练提升了智能体的 \"agentic reliability\"（智能体可靠性），包括 \"self-verification\"（自我验证）、\"tool coverage\"（工具覆盖率）和 \"completing multi-step plans\"（完成多步规划）。这些都属于智能体自我完善和能力提升的范畴，符合“自我演化”或“改进智能体”的方向。\n4.  排除项不适用：虽然论文提到了 \"Kubernetes orchestrator\"，但这只是实现大规模训练的技术手段，而非研究多智能体拓扑或通信协议本身；其核心贡献在于智能体的训练方法论，而非系统工程层面的编排。此外，虽然涉及 GUI 和浏览器环境，但这是作为智能体交互的场景，而非研究视觉模型本身，因此不属于多模态视觉研究的排除范围。\n\n综上，该论文是关于如何训练和优化复杂 LLM 智能体框架的前沿工作，高度契合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决现代 AI Agent 在复杂、长程环境中进行端到端（end-to-end）训练时的核心基础设施瓶颈：现有的开源强化学习（RL）框架无法原生支持基于复杂推理框架（inference harnesses，如 Claude Code, Codex, OpenClaw）的 Agent 训练。当前的 SOTA Agent 并非裸模型，而是包裹在管理多轮交互、工具调用和上下文状态的复杂 harness 中，这种有状态、多进程（stateful, multi-process）的推理过程与主流开源 RL 栈（如 veRL, Slime）所假设的轻量级、单轮或简单多轮生成模式存在根本性的不兼容。这导致了严重的“训练-部署不匹配”（train–deploy mismatch），即研究人员往往需要在简化版 harness 中训练模型，而模型在实际部署时却运行在完全不同的复杂 harness 中，从而限制了模型性能的上限和可研究性。\n\n解决这一问题具有极高的价值，因为它打破了专有闭源系统（如 OpenAI 的 Codex 或 Anthropic 的 Claude Code）在 Agent 训练领域的垄断，使开源社区能够直接在真实的部署环境（real deployment harnesses）中训练和优化 Agent。通过解耦训练与推理，OPENFORGE RL 允许研究人员利用云原生容器化技术，在任意环境（从 CLI 工具使用到 GUI 浏览器控制）中大规模并行执行 rollout，并将生成的轨迹自动转换为标准 RL 格式。这不仅显著提升了开源模型在复杂基准（如 ClawEval, OSWorld-Verified）上的性能，使其媲美甚至超越更大规模的闭源模型，还为研究 harness 选择、RL 对 Agent 可靠性（agentic reliability，如自我验证、错误恢复）的影响提供了前所未有的实证基础，填补了此前因基础设施限制而无法进行的系统性行为分析空白。\n\n### § 2 前人工作与不足\n\n尽管 Agent 训练和 RL 框架已有大量研究，但针对“复杂 harness 下的端到端训练”这一特定问题，现有工作存在显著不足。早期的 Agent 工作（如 SWE-Agent, OpenHands）主要关注设计高效的 Agent-Computer Interface 或 harness 本身，以通过精心设计的工具和控制流提升推理性能，但并未解决如何将这些复杂的 harness 集成到训练循环中。在训练方面，现有的开源 RL 框架（如 veRL, Slime, OpenRLHF）虽然支持先进的算法（如 PPO, GRPO）和异步分布式训练，但它们通常假设 rollout 过程是轻量级的、可直接在训练节点本地执行的，且交互模式相对简单（如单次生成或简单的代码沙箱执行）。这种假设在面对包含嵌套工具调用、子代理（subagents）和长程上下文管理的复杂 harness 时完全失效。\n\n为了在复杂环境中训练 Agent，先前的尝试（如 Bai et al., 2024; Jin et al., 2025; Yu et al., 2025b）往往需要针对特定任务案例（case-by-case） heavily modifying 训练循环，或者重新实现一个简化的 harness 用于训练。这种做法不仅导致代码库难以扩展和维护，更造成了训练环境与真实部署环境之间的巨大鸿沟，使得模型无法学习到真实 harness 特有的控制流和工具使用模式。此外，由于复杂 harness 的 rollout 需要专用的 CPU/内存资源和容器化环境，无法与 GPU 训练节点共置，现有的本地化 rollout 假设在大规模扩展时面临工程瓶颈。虽然近期有并发工作如 Polar (Xu et al., 2026) 提出了类似思路，但其主要聚焦于软件工程任务（SWE-Bench-Verified），缺乏对更广泛的文本工具使用（claw）和多模态 GUI 环境的覆盖，也未深入分析 harness 选择对 Agent 行为的影响。因此，缺乏一个通用的、可扩展的、能够无缝连接任意 harness 与任意环境至标准 RL 代码库的基础设施，是阻碍开源 Agent 研究进一步发展的关键缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n在深入思考如何训练基于 Harness 的 Agent 之前，我们需要审视当前开源社区面临的结构性困境。现有的 SOTA Agent（如 Claude Code, Codex）之所以强大，并非仅靠基座模型，更依赖于复杂的 **Inference Harness**——这些 Harness 封装了多轮推理、工具调用、上下文管理甚至子 Agent 调度。然而，主流的开源 RL 框架（如 veRL, Slime）在设计时假设 Rollout 是轻量级、无状态且可本地并行的，它们无法原生表达 Harness 内部复杂的有状态、多进程逻辑。这导致了严重的 **Train-Deploy Mismatch**：研究者为了适配 RL 框架，往往不得不简化或重写 Harness，导致训练环境与真实部署环境脱节，模型学到的策略在真实复杂的 Harness 中失效。\n\n此外，即使解决了逻辑表达问题，工程上的可扩展性也是巨大障碍。真实的 Harness 运行需要独立的容器化环境（Containerized Environments），涉及大量的 CPU/内存资源以及外部系统交互（如浏览器、MCP Server），这些资源无法与 GPU 训练节点共存。现有的尝试要么需要重度修改 RL 代码以适配特定任务，要么无法在云端大规模弹性扩展。\n\n因此，一个合理的推导路径是：要真正提升 Agent 能力，必须消除 Train-Deploy Mismatch，让模型直接在真实的、复杂的 Harness 中进行端到端训练。但这要求我们将 **Rollout 过程**与 **RL 训练过程**彻底解耦。我们需要一个中间层，既能拦截 Harness 对 LLM 的调用并将其转化为标准的 RL 训练数据（Trajectory），又能将 Rollout 任务卸载到云端的远程容器中，以实现大规模并发。基于此，作者提出了 **OPENFORGE RL**，通过一个轻量级的 **Proxy** 和 **Kubernetes Orchestrator**，实现了“Any Harness x Any Environment”与标准 RL 代码库的无缝连接。\n\n### § 4 核心 Intuition\n\n现有 RL 框架无法直接训练复杂 Agent，是因为它们假设训练器能直接控制生成过程，而复杂的 **Inference Harness** 将这一过程黑盒化且资源密集。OPENFORGE RL 的核心直觉是**解耦（Decoupling）**：通过一个轻量级 **Proxy** 拦截 Harness 的模型调用并重构为标准 **Trajectory**，同时利用 **Kubernetes** 将 Rollout 卸载到云端容器，从而让任何复杂的 Harness 都能像标准 API 一样被现有的 RL 框架（如 veRL）训练。这种方法消除了 **Train-Deploy Mismatch**，使模型能在真实的部署环境中通过 RL 学习，从而显著提升 **Agentic Reliability**（如自我验证和工具覆盖），而无需重新发明训练轮次或简化 Harness 逻辑。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**OPENFORGE RL** 的核心方法是通过解耦训练（Training）与推理（Inference），利用轻量级代理（Lightweight Proxy）和 Kubernetes 编排器（Orchestrator），实现“任意 Harness 在任意环境中”的端到端强化学习（RL）训练。其核心在于将复杂的、有状态的、多进程的 Harness 推理过程抽象为标准 RL 框架（如 veRL）可理解的轨迹数据。\n\n以下以 **OpenForge-Claw** 在 **ZeroClaw Harness** 下执行“查询邮件并更新工单”任务为例，讲解完整的 Pipeline：\n\n1.  **环境初始化与编排 (Orchestration)**：\n    *   **输入**：RL Trainer 发起一个 Rollout 请求。\n    *   **处理**：Kubernetes Orchestrator 在云端（如 Azure）启动一个独立的容器 Pod。该容器预装了目标 Harness（ZeroClaw）和任务环境（模拟邮件服务器、工单系统）。\n    *   **输出**：一个隔离的、可交互的沙箱环境，其中包含待训练的 Agent 模型（通过 API 连接）和 Harness 逻辑。\n\n2.  **推理与拦截 (Inference \u0026 Interception)**：\n    *   **输入**：Harness 根据当前环境状态（如“收到新邮件”）构建 Prompt，并向 LLM 发起生成请求。\n    *   **处理**：\n        *   **Proxy 拦截**：OPENFORGE RL 的 Lightweight Proxy 拦截了 Harness 发出的所有 LLM API 调用。\n        *   **路由**：Proxy 将请求路由到后端的 RL Inference Server（如 vLLM），由待训练的模型生成响应。\n        *   **记录**：Proxy 同时记录每一轮的 Prompt-Response 对（即 $(H(s_t), a_t)$），以及最终的奖励信号（如任务是否成功）。\n    *   **输出**：模型生成的动作（如“调用 `get_email` 工具”），以及被完整记录的交互轨迹。\n\n3.  **轨迹重构 (Trajectory Reconstruction)**：\n    *   **输入**：Rollout 结束（任务完成或超时），Proxy 收集到的原始 Prompt-Response 序列及最终奖励 $r_T$。\n    *   **处理**：由于 Harness 内部可能包含复杂的子代理（Subagents）或嵌套调用，原始数据并非标准的 MDP 格式。OPENFORGE RL 将记录的 I/O 对重构为标准的 RL 训练样本。对于 GRPO 等算法，它计算组内不同轨迹的优势（Advantage）。\n    *   **输出**：标准化的训练数据批次（Batch），包含状态、动作、奖励和优势估计，格式兼容 veRL 等标准 RL 代码库。\n\n4.  **模型更新 (Model Update)**：\n    *   **输入**：重构后的训练数据。\n    *   **处理**：RL Trainer（运行在 GPU 集群上）使用这些数据执行策略梯度更新（如 GRPO）。\n    *   **输出**：更新后的模型权重 $\\theta$，用于下一轮的 Rollout。\n\n5.  **数据合成 (Data Synthesis) - 前置步骤**：\n    *   为了获得上述训练所需的任务，论文还提出了一个自动化的数据合成 Pipeline：\n        *   **Propose**：基于参考池（如 ClawHub 技能）生成候选任务指令。\n        *   **Prune**：过滤低质和重复任务。\n        *   **Build**：为每个任务构建可执行环境（Dockerfile）和验证脚本（Verifier）。\n        *   **Test \u0026 Refine**：使用强模型（Teacher Model）试运行，若失败则自动修复环境或指令，直到任务可被正确验证。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过**。\n\n本文主要侧重于系统架构（System Architecture）和工程实现（Engineering Implementation），而非提出新的数学理论或算法推导。其核心贡献在于通过 **Proxy** 和 **Containerization** 解决了现有 RL 框架无法原生支持复杂、有状态 Harness 的问题。文中涉及的数学公式仅为标准的 MDP 定义和 RL 奖励计算（如公式 1 中的轨迹奖励计算），属于通用 RL 背景知识，无特殊的理论创新推导。\n\n### § 7 实验设计与结论\n\n**1. 验证 OPENFORGE RL 在复杂 Harness 和 GUI 环境下的有效性**\n*   **提出了什么问题**：现有的开源 RL 框架难以在复杂的、有状态的 Harness（如 Codex, OpenClaw）和多模态 GUI 环境中进行端到端训练，导致开源模型性能落后于闭源模型。\n*   **设计了什么实验验证这个问题**：\n    *   **Claw Agents**：使用 OpenForge-Claw (30B-A3B) 在 ZeroClaw, OpenClaw, Codex 等 Harness 上进行 SFT 和 RL 训练，并在 ClawEval, QwenClawBench, MCPAtlas 上评估。\n    *   **GUI Agents**：使用 OpenForge-GUI (8B) 在 Kimi-Agent 和 Molmo-Web Harness 上进行训练，并在 OSWorld-Verified, Online-Mind2Web, WebVoyager 上评估。\n    *   **对比基线**：与同规模开源模型（如 Qwen3-32B, MolmoWeb-8B）及更大规模的闭源模型进行对比。\n*   **问题的答案是什么**：OPENFORGE RL 训练出的模型在几乎所有基准测试中均优于同规模开源基线，并在 GUI 任务上匹敌或超越数倍规模的模型。例如，OpenForge-Claw 在 ClawEval 上达到 31.7 (pass@3)，OpenForge-GUI 在 WebVoyager 上达到 72.3。这证明了该框架能有效利用真实 Harness 进行训练，显著提升 Agent 性能。\n\n**2. 分析 Harness 选择对学习效果的影响**\n*   **提出了什么问题**：不同的 Harness 设计（如工具注册方式、上下文管理）是否会影响 Agent 的学习难度和最终性能？\n*   **设计了什么实验验证这个问题**：在 ClawEval 上，使用相同的训练数据，分别评估在 ReACT, ZeroClaw, OpenClaw, Codex 四种不同 Harness 下的模型表现。\n*   **问题的答案是什么**：支持自定义工具注册且结构更简单的 Harness（如 ReACT, ZeroClaw）更容易学习，性能更高。复杂的 Harness（如 Codex）虽然功能强大，但学习难度更大，且 RL 带来的增益相对较小。这表明 Harness 的工程设计与模型能力对齐至关重要。\n\n**3. 探究 RL 训练对 Agent 行为的具体改善**\n*   **提出了什么问题**：相比于仅使用 SFT，RL 训练具体改善了 Agent 的哪些行为能力？\n*   **设计了什么实验验证这个问题**：对比 SFT 和 SFT+RL 模型在 ClawEval 上的轨迹，分析工具使用分布（Tool Usage）和高层行为能力（如自我验证、错误恢复、工具覆盖率）。\n*   **问题的答案是什么**：RL 显著提升了 **Agentic Reliability**。具体表现为：\n    *   **工具选择更精准**：减少了对通用 `shell` 工具的依赖，更多使用专用服务工具。\n    *   **自我验证增强**：模型更倾向于在执行写操作后读取结果以确认成功。\n    *   **计划完整性**：提高了多步骤任务中工具覆盖率和任务完成率。\n    *   **局限性**：错误恢复（Error Recovery）能力仍然较弱，表明仅靠 RL 难以完全解决此类复杂能力，可能需要专用数据。", "additional_insights": "### § 8 Take-aways\n\nOPENFORGE RL 通过引入轻量级代理（Lightweight Proxy）和 Kubernetes 编排器，解决了复杂推理框架（Inference Harnesses）与标准强化学习（RL）代码库之间的解耦问题，实现了“任意 Harness 在任意环境”中的端到端训练。该框架将 Rollout 过程隔离在远程容器中，通过拦截模型调用并重构轨迹（Trajectory Reconstruction），使得 veRL 等现有 RL 框架能够直接利用真实部署环境中的状态交互数据进行训练，消除了 Train-Deploy Mismatch。实验表明，在仅使用数百至数千个自动合成任务的情况下，OpenForge-Claw 和 OpenForge-GUI 模型在 ClawEval、OSWorld-Verified 等基准测试中显著优于同等规模的开源基线，甚至在 GUI 任务上超越了数倍规模的模型。深入的行为分析揭示，RL 训练主要提升了 Agent 的可靠性（Agentic Reliability），包括自我验证（Self-verification）、工具覆盖率（Tool coverage）和多步计划完成能力，但错误恢复（Error recovery）能力依然薄弱。此外，研究证实了 Harness 的选择对学习效果有显著影响，简单的 Harness（如 ZeroClaw）比复杂的 Harness（如 Codex）更容易学习，且多 Harness 联合训练能带来更好的泛化性能。\n\n### § 9 最脆弱的假设\n\n该方法最核心的脆弱假设是：**通过拦截 Prompt-Response 对并重构轨迹，足以捕捉复杂 Harness 内部的状态管理逻辑，从而为 RL 提供有效的信用分配（Credit Assignment）信号。**\n\n如果这一假设不成立，即 Harness 内部的隐式状态（如子代理上下文、内存缓存、非显式的控制流跳转）对任务成功至关重要，而仅靠表面的 I/O 对无法反映这些状态，那么 RL 代理将无法学习到正确的策略，导致训练失效或性能停滞。在实际中，许多高级 Harness（如 Codex 或 Claude Code）拥有复杂的内部状态机，模型的一次输出可能依赖于之前未显式记录在 Prompt 中的中间状态。如果 Proxy 仅记录显式的 Prompt 和 Response，而忽略了 Harness 内部的状态转换，RL 算法可能会将成功归因于错误的动作，或者无法理解长程依赖。\n\n论文提供的证据主要基于基准测试的性能提升（如 ClawEval 和 OSWorld 上的 pass@1 提高），这间接证明了重构的轨迹包含足够的学习信号。然而，论文缺乏对“状态丢失”程度的定量分析，例如对比完整内部状态日志与重构轨迹之间的信息差异，或者在极端依赖隐式状态的特定任务子集上验证 RL 的有效性。如果存在大量依赖隐式状态的任务，当前的 Proxy 机制可能会成为性能瓶颈，导致 RL 无法进一步突破。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现并验证 **“RL 训练是否显著提升了 Agent 的自我验证（Self-verification）行为”** 这一具体 claim，而无需复现整个分布式训练系统。\n\n**实验设计：**\n1.  **数据与模型**：使用论文开源的 OpenForge-Claw 的 SFT 和 SFT+RL 检查点（如果可用），或者使用一个小型的开源 LLM（如 Qwen2.5-7B）在本地进行简化的 SFT 和 GRPO 训练。数据选用 ClawEval 中涉及文件读写或状态修改的子集（如 `file_write` 后接 `file_read` 的任务）。\n2.  **实现**：搭建一个简化的本地 Harness 环境（如 ZeroClaw 的简化版），包含 `write_file` 和 `read_file` 工具。实现一个轻量级的 GRPO 训练循环，奖励函数仅基于任务最终是否成功。\n3.  **测量**：收集 SFT 模型和 RL 模型在相同测试集上的 Rollout 轨迹。统计每个任务中，模型在执行写操作后，是否立即执行了读操作以验证内容（即 Self-verification 行为的比例）。\n4.  **结果判定**：如果 RL 模型的 Self-verification 比例显著高于 SFT 模型（例如从 20% 提升到 50% 以上），且任务成功率同步提升，则支持论文关于 RL 提升 Agentic Reliability 的 claim。如果 RL 模型并未增加验证行为，或者验证行为增加但成功率未变，则反驳了 RL 通过强化特定可靠行为来提升性能的机制假设。\n\n此实验避开了复杂的 Kubernetes 编排和远程容器管理，聚焦于 RL 对特定微观行为（Micro-behavior）的影响，验证了论文核心贡献中关于“RL 改变 Agent 行为模式”的关键论点。", "research_value": "### § 11 最强反例设计\n\n若要挑战 OpenForgeRL 的有效性，最有力的攻击并非质疑其工程实现的复杂性，而是针对其核心假设——即“基于 Prompt-Response 对的轨迹重构足以捕捉 Harness 内部状态以进行有效的 Credit Assignment”——提出**“隐式状态遮蔽（Implicit State Masking）”**的反例。\n\n具体而言，可以设计一类**“状态依赖型长程任务（State-Dependent Long-Horizon Tasks）”**作为反例场景。在这类任务中，Harness 的成功执行高度依赖于其内部维护的、未显式暴露给 LLM 的中间状态（例如：Codex 或 Claude Code 中的内部文件索引缓存、子代理（Subagent）的并行执行结果聚合、或基于历史对话的动态上下文窗口管理）。\n\n**实验设计如下：**\n1.  **构造对抗性任务集**：设计一组任务，其正确解法要求 Agent 利用 Harness 的隐式状态优化。例如，一个任务要求 Agent 修改一个大型代码库中的多个文件，但 Harness 内部有一个“变更集（Change Set）”机制，只有当所有修改在内存中完成并一次性提交时才有效，而中间的单步提交会导致冲突或失败。如果 LLM 仅看到表面的 Prompt（如“修改文件 A”），它无法感知到 Harness 正在累积变更集。\n2.  **对比基线**：\n    *   **OpenForgeRL 模型**：在标准 OpenForgeRL 框架下训练，仅通过 Proxy 记录显式的 Prompt-Response 对。\n    *   **Oracle-Harness 模型**：一个假设的基线，其训练数据中包含了 Harness 的完整内部状态日志（Internal State Logs），即 RL 算法能观察到隐式状态的变化。\n    *   **SFT 基线**：仅使用 SFT 的模型。\n3.  **预期结果与攻击逻辑**：\n    *   如果 OpenForgeRL 模型在这些任务上的表现与 SFT 基线无显著差异，甚至低于 SFT（因为 RL 可能错误地将成功归因于某个无关的显式动作，导致策略崩溃），而 Oracle-Harness 模型表现优异，则证明**显式 I/O 对丢失了关键的因果信号**。\n    *   这将揭示 OpenForgeRL 的致命缺陷：它假设 Harness 是“无记忆的”或“状态完全由 Prompt 体现的”，但在真实的复杂 Harness（如 Codex）中，大量逻辑发生在黑盒内部。RL 算法在这种“部分可观测（Partially Observable）”且观测噪声极大的环境下，无法学习到正确的策略，所谓的性能提升可能仅来自于简单任务（如单步工具调用）的过拟合，而非真正掌握了复杂 Harness 的控制流。\n\n此外，还可以从**“奖励稀疏性与信用分配失效”**角度进行理论攻击。在长程任务中，最终奖励 $r_T$ 是稀疏的。如果 Harness 内部存在多个子代理（Subagents）并行工作，Proxy 记录的线性 Prompt-Response 序列无法反映并行执行的拓扑结构。RL 算法（如 GRPO）在计算 Advantage 时，会将最终奖励均匀或错误地分配给线性序列中的每一个动作，导致**“错误归因（Misattribution）”**。例如，一个子代理的成功可能被错误地归因于另一个无关子代理的早期动作，导致策略更新方向错误。这种结构性的信息丢失使得 OpenForgeRL 在涉及复杂并行控制的 Harness 中注定失效。\n\n### § 12 Follow-up Research Idea\n\n基于 OpenForgeRL 在捕捉隐式状态和并行控制流方面的局限，提出一个全新的研究方向：**“Harness-Aware RL: Training Agents with Internal State Observability and Structural Credit Assignment”**（感知 Harness 的强化学习：基于内部状态可观测性与结构化信用分配的训练）。\n\n**（a）驱动局限与未满足需求：**\n现有方法（包括 OpenForgeRL）将 Harness 视为黑盒，仅通过 I/O 接口进行交互，这导致了严重的部分可观测性问题（POMDP）和信用分配错误。真实世界的复杂 Harness（如 IDE 插件、浏览器自动化框架）拥有丰富的内部状态（如 DOM 树变化、代码 AST 更新、内存缓存状态），这些状态对于理解动作的长期影响至关重要。当前的 RL 框架缺乏利用这些内部信号的能力，限制了 Agent 在复杂环境中的学习上限。\n\n**（b）借鉴相邻领域的方法：**\n借鉴**“部分可观测马尔可夫决策过程（POMDP）中的记忆增强机制”**和**“程序合成中的结构化执行追踪（Structured Execution Tracing）”**。\n*   从 POMDP 领域借鉴 **Recurrent Policy Networks** 或 **Memory-Augmented Agents**，让 Agent 维护一个显式的内部记忆状态，以弥补观测信息的不足。\n*   从程序合成和调试领域借鉴 **Execution Trace Analysis**，将 Harness 的内部状态变化（如变量赋值、函数调用栈、文件修改记录）转化为结构化的“状态转移图（State Transition Graph）”，而非线性的文本序列。\n\n**（c）第一个实验设计：**\n1.  **构建 State-Enhanced Harness Wrapper**：开发一个通用的 Harness 包装器，能够拦截并记录 Harness 的关键内部状态变化（例如，在代码编辑任务中记录 AST 的 diff，在浏览器任务中记录 DOM 的变更）。这些状态被编码为额外的观测向量 $o_t^{internal}$。\n2.  **设计 Graph-Based RL Algorithm**：提出一种新的 RL 算法，其输入不仅是线性的 Prompt-Response 序列，而是由内部状态变化构成的**有向无环图（DAG）**。每个节点代表一个 Harness 的内部状态快照，边代表 LLM 的动作。信用分配（Credit Assignment）不再基于线性序列，而是基于图上的**因果路径分析（Causal Path Analysis）**，识别哪些内部状态变化对最终奖励贡献最大。\n3.  **实验验证**：在 OpenForgeRL 的基准测试（如 ClawEval）上，对比以下三种模型：\n    *   **Baseline**: 标准 OpenForgeRL（仅使用 Prompt-Response）。\n    *   **Memory-Augmented**: 在 OpenForgeRL 基础上增加一个 LSTM/Transformer 记忆模块，但输入仍仅为 Prompt-Response。\n    *   **Proposed (State-Graph RL)**: 使用内部状态图作为输入，并进行结构化信用分配。\n4.  **预期结果**：Proposed 模型在涉及长程依赖和复杂状态管理的任务上应显著优于 Baseline，证明利用 Harness 内部状态和结构化信用分配能有效解决隐式状态遮蔽问题，从而打开“白盒 Harness 训练”的新范式。\n\n这一提议与 OpenForgeRL 的根本区别在于：OpenForgeRL 试图通过**解耦**来简化问题（将复杂 Harness 抽象为标准 RL 轨迹），而本提议试图通过**深度融合**来解决根本问题（利用 Harness 的内部结构信息来增强 RL 的学习信号），从“黑盒代理”走向“白盒协同”。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Xiao Yu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Baolin Peng\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Ruize Xu\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Hao Zou\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Qianhui Wu\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Hao Cheng\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Wenlin Yao\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Nikhil Singh\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zhou Yu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Jianfeng Gao\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Columbia University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Dartmouth College\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Microsoft Research\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"∗\",\n      \"text\": \"Equal Advisory Contribution\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Project Lead\"\n    }\n  ]\n}\n```", "summary_translation": "现代 AI 智能体依赖于 Claude Code、Codex 和 OpenClaw 等复杂的推理框架（inference harnesses），以驱动多轮推理、工具使用以及对外部系统的访问。尽管功能强大，但这些复杂的框架也使得智能体难以在开放基础设施上进行端到端训练，因为现有的 SFT/RL 技术栈无法原生表达有状态的、多进程的框架推理过程。为解决这一问题，我们提出了 OpenForgeRL，这是一个用于在多样化环境中端到端训练基于框架的智能体的开源框架。OpenForgeRL 通过一个轻量级代理实现这一目标，该代理服务于框架的模型调用，并将其记录为标准 RL 代码库（如 veRL）的训练数据；同时结合一个 Kubernetes 编排器，在独立的远程容器中运行每次 rollout，从而实现在任何环境下的任何框架上进行大规模训练。通过解耦训练与推理，OpenForgeRL 使研究人员能够直接在智能体部署所使用的真实框架和环境中轻松训练、研究和改进智能体。我们在多种复杂的框架和环境中验证了该框架，涵盖基于工具/Claw 的智能体以及多模态 GUI 浏览器和计算机使用智能体。仅使用数百到数千个任务，OpenForgeClaw 在 ClawEval 上达到了 31.7 pass^3 和 55.9 pass@3，在 QwenClawBench 上达到了 33.7。OpenForgeGUI 在 OSWorld-Verified 上达到 37.7，在 Online-Mind2Web 上达到 63.0，在 WebVoyager 上达到 72.3。两者在几乎所有基准测试中均优于规模相近的开放基线模型，并且在 GUI 设置下匹配或超越了规模大数倍的模型。除了基准测试外，我们还分析了框架选择（如 ZeroClaw、OpenClaw、Codex）和 RL 如何塑造智能体行为。我们发现某些框架比其他框架更难学习，并且 RL 提高了智能体的可靠性，例如自我验证、工具覆盖率和完成多步计划的能力，尽管错误恢复等关键能力仍然较弱。"}, {"title": "NVIDIA-labs OO Agents: Native Python Object-Oriented Agents", "arxiv_id": "2607.20709", "authors": "Paul Furgale, Severin Klingler, James Nolan, Matt Staats, Gaia Di Lorenzo, Elisa Martinez Abad, Christian Schüller, Razvan Dinu, Alessio Devoto, Pascal Berard, Gal Kaplun, Elad Sarafian, Riccardo Roveri, Leon Derczynski, Ricardo Silveira Cabral", "summary": "Traditional agent development is split across prompt templates, tool schemas, callback code, and workflow graphs. We present NVIDIA Object-Oriented Agents (NOOA), a model-agnostic Python framework for building reliable AI agents. NOOA takes a simpler approach: an agent is a Python object. Its methods are the actions the model can take, fields are its state, docstrings are its prompts, and its type annotations are contracts. A method whose code body consists of \"...\" is completed at runtime by an LLM-driven agent loop, while methods with normal bodies remain standard deterministic Python. This gives developers and agents the same interface, so agent behavior can be tested, traced, refactored, and improved just like other software. This paper makes three contributions. (1) We present the agent-as-a-Python-object programming model and the design principles behind it. Where Python has existing abstractions, we adopt them directly. Agent-specific capabilities--context, events, state rendering, long-term memory, and validated LLM loops--are exposed through simple Pythonic APIs, so both developers and agents share one familiar programming model. (2) We identify six model-facing ideas that NOOA is, to our knowledge, the first to combine on a single surface: typed input/output, pass-by-reference over live objects, code as action, programmable loop engineering, explicit object state, and model-callable harness APIs for context and events. We find the community already converging on several of these ideas--often as experimental or partial features--and present the comparison to encourage further adoption. (3) We demonstrate that current models use this interface effectively, both in targeted capability tests and on agentic and reasoning benchmarks such as SWE-bench Verified and Terminal-Bench 2.0 and ARC-AGI-3.", "category": "cs.CL", "cluster": "Agent Frameworks \u0026 Infrastructure", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=12 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文符合筛选标准，主要依据如下：\n\n1.  核心贡献属于智能体构建框架（Agent Harness/Scaffold）：论文提出了 NVIDIA Object-Oriented Agents (NOOA)，这是一个用于构建可靠 AI 智能体的 Python 框架。根据筛选标准第一步中的保留规则：“如果论文研究 agent 的 harness / scaffold / runtime ... 并且核心贡献是让这些智能体运行组件通过轨迹、反馈、观测或评估结果自动改进、演化或自适应优化... 应保留”。虽然 NOOA 主要是一个编程模型，但它明确将“智能体即 Python 对象”作为核心范式，使得智能体的行为可以像普通软件一样被测试、追踪、重构和改进（\"agent behavior can be tested, traced, refactored, and improved just like other software\"）。这种将智能体逻辑与代码结构深度融合的方法，属于构建和改进 LLM 智能体基础设施的关键方法论，而非单纯的底层硬件或通用部署基础设施。\n\n2.  涉及智能体核心能力与长期决策：摘要中明确提到该框架暴露了“长期记忆”（long-term memory）、“上下文”（context）、“事件”（events）和“验证的 LLM 循环”（validated LLM loops）等智能体特定能力。这直接对应研究焦点中的“单智能体 (Agentic)”方向，特别是记忆和规划/执行循环。\n\n3.  非纯应用或非纯推理：论文不是在特定领域（如医疗、金融）应用现有智能体，也不是单纯研究 LLM 的基础推理能力（如数学、逻辑），而是研究如何更好地构建和组织智能体系统，使其更可靠、更易维护且具备更强的交互能力。它在 SWE-bench 和 Terminal-Bench 等基准上的表现验证了其作为智能体构建框架的有效性。\n\n4.  排除项检查：\n       它不是非演化型应用，因为它提出了新的编程模型和架构。\n       它不是非 Agentic 的推理，因为它关注的是 Agent 的构建和工具使用（通过 Python 方法作为动作）。\n       它不是纯基础设施（如硬件加速），而是智能体层面的软件架构。\n       它不涉及多智能体拓扑或通信协议的纯系统工程讨论，而是聚焦于单个智能体对象的内部结构和执行机制。\n\n综上所述，该论文关于“智能体即对象”的编程模型和框架设计，对于理解如何构建、改进和评估 LLM 智能体具有直接的相关性，符合“构建、改进... LLM智能体”的核心目标。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：如何构建一个统一、可靠且对开发者友好的 AI Agent 开发框架，以解决当前 Agent 开发中代码分散、抽象冗余以及模型与开发者接口割裂的问题。现有的 Agent 开发通常将逻辑分散在 prompt templates、tool schemas、callback code 和 workflow graphs 中，导致开发者需要学习特定的领域特定语言（DSL）或复杂的编排逻辑，而模型则面对非结构化的文本交互。这种割裂不仅增加了人类开发者的认知负担，也阻碍了 Agent 行为的可测试性、可追溯性和可重构性。\n\n这一问题的重要性在于，随着 AI Agent 在软件工程、终端交互和复杂推理任务中的应用日益广泛，现有的碎片化开发模式已成为规模化部署的主要瓶颈。如果 Agent 的行为不能像传统软件一样被版本控制、单元测试和调试，其可靠性将难以保证。此外，由于 LLM 的训练数据主要包含成熟的 Python 代码，迫使模型学习新的 DSL 或 JSON 工具调用格式会引入额外的“接口摩擦”，降低模型的零样本（zero-shot）适应能力。\n\n解决这一问题带来的价值主要体现在三个方面：首先，通过 **agent-as-a-Python-object** 的编程模型，NOOA 消除了人类开发者与 AI 模型之间的接口差异，使得 Agent 行为可以像普通软件一样进行测试、追踪和优化；其次，通过 **pass-by-reference** 和 **code as action** 机制，NOOA 允许模型直接操作内存中的实时对象而非序列化文本，从而突破了上下文窗口（context window）的限制，显著提升了处理大规模数据时的效率和准确性；最后，实验表明，这种原生 Python 接口能显著提升 Agent 在 SWE-bench Verified、Terminal-Bench 2.0 和 ARC-AGI-3 等基准测试中的表现，特别是在降低 token 消耗的同时提高了任务完成率，证明了该框架在提升 Agent 能力与成本效益方面的巨大潜力。\n\n### § 2 前人工作与不足\n\n在 NOOA 之前，社区已经涌现出多种 Agent 框架和 harness，如 LangChain/LangGraph、OpenHands、smolagents、PydanticAI 以及 OpenAI Codex 等。这些系统在一定程度上解决了 Agent 开发的特定痛点，例如 LangGraph 提供了基于图的流程控制，OpenHands 展示了 CodeAct 范式在软件工程任务中的有效性，smolagents 简化了代码执行代理的构建。然而，这些现有系统存在明显的不足，主要体现在未能将六个关键接口能力（typed I/O, pass-by-reference, code as action, programmable loop engineering, object state, model-visible harness APIs）统一在一个表面上。\n\n具体而言，大多数现有框架在 **pass-by-reference** 方面存在局限。例如，LangChain 和 OpenAI Agents SDK 主要依赖文件路径或序列化文本作为数据传递介质，模型无法直接引用内存中的实时对象，导致在处理大型数据结构时效率低下且容易丢失类型信息。虽然 smolagents 支持将 Python 对象注入执行器命名空间，但其状态是无类型的字典，且缺乏对模型可见的显式状态渲染机制。此外，许多系统如 OpenHands 和 PI 仍然依赖 shell 命令或离散的工具调用，而非真正的 **code as action**，这限制了模型在代码中进行复杂控制流和并行编排的能力。\n\n在 **loop engineering** 和 **harness APIs** 方面，现有工作往往将编排逻辑限制在开发者侧，或者通过复杂的 DSL（如 LangGraph 的节点图）来实现，模型本身无法直接编写或修改控制流。例如，Microsoft Agent Framework 和 Google ADK 虽然提供了工作流定义，但模型通常只能作为工作流中的一个节点执行，无法自主生成动态的编排代码。同时，大多数框架的上下文管理（context management）和事件历史（event history）对模型是不可见的，或者仅通过简单的文件读写暴露，缺乏像 NOOA 那样通过显式 Python API（如 `self.context` 和 `self.events`）让模型直接查询和管理自身状态的能力。\n\n最后，现有系统在 **object state** 的管理上多依赖于外部文件（如 MEMORY.md）或向量数据库，这些状态与 Agent 的核心逻辑分离，导致状态更新和检索存在延迟和不一致性。NOOA 通过将状态直接绑定到 Python 对象的字段上，并在每个 turn 动态渲染，确保了状态的实时性和类型安全性。综上所述，尽管 prior work 在单个能力上有所进展，但缺乏一个能够同时支持类型安全、实时对象引用、代码即行动、可编程循环、显式对象状态和模型可见 API 的统一框架，这正是 NOOA 旨在填补的空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在 NOOA 出现之前，AI Agent 的开发长期处于一种“分裂”状态。开发者被迫在两套完全不同的范式之间切换：一套是用于构建业务逻辑的成熟编程语言（如 Python），另一套是用于定义 Agent 行为的领域特定语言（DSL）、提示词模板（Prompt Templates）或工作流图（Workflow Graphs）。这种分裂导致了严重的工程痛点：Agent 的状态往往散落在对话历史（Conversation History）或外部文件中，缺乏类型安全（Type Safety）和版本控制；工具调用（Tool Calling）通常基于 JSON 序列化，导致大模型在处理复杂数据结构时效率低下且容易出错；更重要的是，Agent 的行为难以像普通软件那样进行单元测试、调试和重构，因为“提示词”和“代码”是解耦的。\n\n与此同时，社区中涌现出了一些试图解决这些问题的局部方案。例如，CodeAct 范式证明了让模型直接编写可执行代码比生成 JSON 工具调用更有效，因为它利用了模型在预训练阶段积累的庞大代码知识。DSPy 和 LMQL 等框架引入了结构化输出和类型约束，提高了 LLM 输出的可靠性。MemGPT 和 Letta 等系统则尝试通过外部记忆机制解决上下文窗口限制问题。然而，这些方案往往是孤立的：CodeAct 缺乏对对象状态（Object State）的原生支持，DSPy 侧重于流水线优化而非交互式 Agent 循环，而大多数框架仍然将“模型可见的上下文”与“开发者编写的代码”割裂开来。\n\n作者观察到，现有的 Agent 框架往往引入了新的抽象层（如 LangGraph 的节点图、LangChain 的链），这反而增加了学习曲线，且这些抽象在 LLM 的训练数据中并不常见，导致模型需要额外的指令才能理解。相反，Python 本身已经拥有成熟的抽象：类（Class）代表对象，方法（Method）代表能力，类型注解（Type Annotations）代表契约，异步编程（Asyncio）代表并发。如果直接将 Agent 定义为 Python 对象，那么开发者熟悉的软件工程实践（如测试、重构、依赖管理）可以直接应用于 Agent 开发。\n\n关键的洞察在于：LLM 已经非常擅长编写 Python 代码。如果我们将 Agent 的“动作”定义为 Python 方法的调用，将“状态”定义为对象的字段，将“提示词”定义为方法的 Docstring，那么模型就不需要学习新的 DSL，而是直接利用其已有的 Python 知识。通过“引用传递”（Pass-by-Reference）而非“文本序列化”，模型可以直接操作内存中的大型对象，从而突破上下文窗口的限制。这种设计不仅降低了开发者的认知负荷，还确保了“Agent 就绪性”（Agent Readiness），即模型能够零样本（Zero-shot）地理解并正确使用该接口，因为这与它训练数据中的代码分布高度一致。\n\n### § 4 核心 Intuition\n\nNOOA 的核心直觉是：**Agent 不应被视为需要特殊 DSL 或提示词工程的“黑盒”，而应被视为标准的 Python 对象，其方法、状态和类型注解直接构成了模型可理解的接口。**\n\n通过让模型直接操作内存中的**Live Objects**（引用传递）并执行**Python Code**（代码即动作），NOOA 消除了传统 Agent 框架中因文本序列化导致的上下文膨胀和类型丢失问题，使 Agent 能够像人类开发者一样利用成熟的软件工程抽象（如类、方法、异步控制流）来构建可靠、可测试且可扩展的行为。\n\n这种设计利用了 LLM 在预训练阶段对 Python 代码的深刻理解，使得**提示词工程回归为软件工程**，从而实现了开发者与模型在同一套编程范式下的高效协作。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nNVIDIA Object-Oriented Agents (NOOA) 的核心方法是将 AI Agent 定义为标准的 Python 对象（Class）。其设计哲学是“Agent 即 Python 对象”：Agent 的类定义即为 Agent 本身，方法（Methods）是 Agent 可执行的动作，字段（Fields）是 Agent 的状态，文档字符串（Docstrings）是 Prompt，类型注解（Type Annotations）是输入输出的契约。\n\n以下以论文中的 `SupportAgent`（客服支持 Agent）为例，展示从输入到输出的完整 Pipeline：\n\n**1. 定义阶段（Developer Side）**\n开发者编写一个继承自 `Agent` 的 Python 类 `SupportAgent`。\n*   **状态定义**：定义字段 `order_db: OrderDB`，这是 Agent 的持久化状态，对模型可见。\n*   **确定性方法**：定义 `is_refund_eligible`，包含具体的 Python 代码逻辑（如检查订单是否送达且未超过30天）。这是确定性的，不经过 LLM。\n*   **Agentic 方法**：定义 `triage` 方法，其函数体仅为 `...`（省略号）。该方法装饰有 `@strategy(CodeActStrategy())`，表示这是一个由 LLM 驱动的迭代循环。其输入包括 `message`（文本）、`photo`（图像对象）和 `order`（实时 Python 对象），返回类型为 `Ticket`（结构化数据）。\n\n**2. 调用与上下文渲染（Context Rendering）**\n当外部代码调用 `agent.triage(message, photo, order)` 时，NOOA 的 Harness（运行时框架）介入：\n*   **Pass-by-Reference（引用传递）**：`order` 对象不是被序列化为 JSON 字符串放入 Prompt，而是作为实时 Python 对象保留在内存中。Prompt 中仅显示该对象的“有界预览”（Bounded Preview），例如 `Order(id=123, status='delivered', ...)`，告知模型对象的结构和类型，但不占用大量 Token。\n*   **Context 组装**：Harness 将静态上下文（System Prompt、Agent 的 `doc(self)` 渲染）、动态上下文（当前状态 `pprint(self)`）和事件历史（Event History）组装成 LLM 可理解的格式。\n\n**3. LLM 循环执行（CodeAct Loop）**\nLLM 接收上下文后，进入 `CodeActStrategy` 定义的 Read-Eval-Print Loop (REPL)：\n*   **Turn 1**：LLM 生成 Python 代码，例如调用 `self.is_refund_eligible(order)` 来检查退款资格，并打印结果。\n*   **执行与观察**：Harness 在受限的沙箱环境中执行这段 Python 代码。由于 `order` 是实时对象，代码可以直接访问其属性。执行结果（如 `True`）被捕获并作为 `PythonOutput` 事件追加到 Event History 中。\n*   **Turn 2**：Harness 重新渲染上下文，包含新的执行结果。LLM 根据结果生成下一步代码，例如构造一个 `Ticket` 对象。\n*   **终止**：LLM 调用 `return_result(ticket_obj)`。\n\n**4. 验证与返回（Validation \u0026 Return）**\n*   **类型验证**：Harness 检查 `ticket_obj` 是否符合 `Ticket` 类的类型注解（如 `kind` 必须是 \"refund\", \"damaged\" 或 \"other\"，`priority` 必须在 1-5 之间）。\n*   **成功返回**：如果验证通过，Harness 将结果返回给调用者，Agent 循环结束。如果验证失败，Harness 将错误信息反馈给 LLM，循环继续直到成功或达到重试上限。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n本文主要是一篇系统工程与架构设计论文，侧重于软件抽象、接口设计和框架实现，**不包含核心的数学推导或形式化理论证明**。\n\n论文中提到的“数学”或“理论”背景主要体现在：\n1.  **ACT-R 激活模型**：在长期记忆（Long-Term Memory）模块中，引用了认知心理学中的 ACT-R 理论来对记忆进行排序（基于相关性、近期性和重要性），但这属于应用现有理论而非推导新公式。\n2.  **Pareto Frontier**：在评估部分，使用分数-成本（Score-Cost）的 Pareto 前沿来衡量性能，这是标准的优化理论概念，用于展示 NOOA 在相同成本下获得更高分数，或在相同分数下成本更低。\n\n因此，本节跳过数学推导部分。\n\n### § 7 实验设计与结论\n\n**1. 问题：当前 LLM 是否理解并能够有效使用 NOOA 这种“Agent 即 Python 对象”的接口？**\n*   **实验设计**：设计了 88 个针对性的能力测试（Capability Tests），涵盖类型化方法调用、结构化返回、状态管理、REPL 代码执行、错误恢复等。使用 10 种不同规模的模型（从高效小模型到前沿大模型）进行零样本（Zero-shot）测试，每个测试运行 5 次以评估一致性。此外，设计了 6 个高难度的“压力测试”（Stress Tests），模拟复杂的批量处理、多步推理和错误恢复场景。\n*   **结论**：当前模型对 NOOA 接口具有极高的“零样本流利度”（Zero-shot fluency）。整体通过率高达 97.9%，前沿模型接近 100%。这表明 LLM 已经具备理解 Python 对象、类型注解和代码执行的能力，无需额外训练即可适应该框架。压力测试显示，主要失败模式并非接口理解错误，而是长程任务中的纪律性缺失（如忘记返回变量而非重新打字），这为后续通过强化学习优化提供了方向。\n\n**2. 问题：NOOA 架构在实际端到端任务中是否优于现有的 Agent 框架？**\n*   **实验设计**：在四个基准测试上进行对比实验：\n    *   **SWE-bench Verified**：软件工程任务，对比 NOOA 与 OpenCode、PI 等开源框架。\n    *   **Terminal-Bench 2.0**：命令行交互任务。\n    *   **CyberGym L1**：网络安全漏洞发现任务。\n    *   **ARC-AGI-3**：交互式推理任务，对比 NOOA 单 Agent 与之前的多 Agent 系统（DreamTeam）。\n*   **结论**：\n    *   在 SWE-bench 和 Terminal-Bench 上，NOOA 在相同模型（如 GPT-5.5, Opus 4.6）下取得了最高的通过率，且 Token 使用效率更高（得益于 Pass-by-Reference 减少了上下文冗余）。\n    *   在 CyberGym 上，NOOA 作为开源 Agent 取得了最高分，超越了多数闭源系统。\n    *   在 ARC-AGI-3 上，NOOA 将原本需要 6 个 Agent 和复杂协调系统的任务，简化为单个 Agent 加一个 50 行的 Skill，同时提升了性能（RHAE 分数提升 8.5-11.8 点）并降低了成本。这证明了“对象状态”和“代码即动作”能有效压缩多 Agent 系统的复杂性。\n\n**3. 问题：NOOA 提出的六大接口特性（Typed I/O, Pass-by-Reference 等）在现有框架中的普及程度如何？**\n*   **实验设计**：对 14 个主流 Agent 框架（如 LangChain, OpenAI Agents SDK, smolagents 等）进行横向对比，评估它们是否原生支持这六大特性。\n*   **结论**：现有框架通常只支持部分特性，且往往仅对开发者可见，而非对模型可见。NOOA 是首个将所有六大特性统一在一个表面（Single Surface）并对模型完全暴露的框架。这表明社区正在向这些设计原则收敛，但 NOOA 提供了最完整和一致的实现。", "additional_insights": "### § 8 Take-aways\n\nNOOA 的核心创新在于将 Agent 定义为标准的 Python 对象，利用现有的 Python 抽象（如类、方法、类型注解）替代传统的 Prompt 模板和 DSL，从而消除开发者与模型之间的接口摩擦。该框架通过 `CodeActStrategy` 实现“代码即动作”，允许模型在受限的 REPL 环境中直接操作内存中的 Live Objects（Pass-by-Reference），而非序列化文本，这显著降低了 Context Window 的压力并支持处理超出 Prompt 限制的大规模数据。NOOA 是首个同时结合 Typed I/O、Pass-by-Reference、Code as Action、Programmable Loop Engineering、Explicit Object State 和 Model-Callable Harness APIs 六大特性的框架，这种统一接口使得 Agent 行为可测试、可追踪且易于重构。在 SWE-bench Verified 和 Terminal-Bench 2.0 等基准测试中，NOOA 以更高的 Token 效率超越了 OpenCode 和 PI 等主流开源框架，并在 ARC-AGI-3 交互推理任务中通过单一 Agent 配合记忆子系统大幅提升了性能。评估表明，当前主流 LLM 对这种原生 Python 接口具有极高的零样本流利度（Zero-shot Fluency），证明模型无需额外训练即可有效利用面向对象编程范式进行 Agent 开发。\n\n### § 9 最脆弱的假设\n\nNOOA 最关键的假设是：**当前 LLM 能够可靠地遵循“Pass-by-Reference”语义，即在仅看到变量名和有限预览（Preview）的情况下，正确生成操作完整 Live Object 的代码，而不依赖对完整数据的文本序列化。** 如果模型无法理解变量引用与完整数据之间的映射关系，或者倾向于重新序列化数据以进行推理，那么 NOOA 在 Context 效率和大规模数据处理上的核心优势将失效，退化为普通的文本交互框架。论文在 Section 4.1 的 Capability Tests 中提供了部分证据，显示模型在简单接口调用上表现良好，但在 Section 4.1 的 Stress Tests 和 Appendix B 中揭示了脆弱性：例如 Claude Opus 4.8 在 `sentiment_batch` 测试中，虽然正确执行了并行分类，却在最后一步错误地将打印输出转录为列表而非直接返回变量，导致数据丢失；GPT-5.4 Mini 则完全忽略了预览限制，试图基于可见的 25 条数据构建规则并应用于全部 50 条数据。这些失败表明，模型在长程任务中容易丧失对“引用”与“值”的纪律性区分，目前主要依靠强模型（如 GPT-5.5）的推理能力来弥补，而非框架本身的强制约束。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 NOOA 的核心机制：**基于 Pass-by-Reference 的 Context 压缩与代码执行循环**，以验证其是否能有效处理超出 Context Window 的数据。\n\n*   **数据**：构造一个包含 10,000 条短文本的 JSON 列表（总大小远超典型 Context Window，如 100k tokens），其中隐藏特定的模式（如每 100 条中有一条包含特定关键词）。\n*   **实现**：\n    1.  搭建一个简化的 NOOA 式 Harness：定义一个 Python Agent 类，包含一个 `analyze_data(data: list[str]) -\u003E int` 方法，方法体为 `...`。\n    2.  实现 `CodeActStrategy` 的核心逻辑：\n        *   **Context Rendering**：不将 `data` 序列化进 Prompt，而是生成预览字符串（如 `list(len=10000, [:5]=..., [-5:]=...)`）。\n        *   **Execution Environment**：创建一个隔离的 Python 执行环境（如 `restrictedpython` 或沙箱），将完整的 `data` 对象注入为局部变量。\n        *   **Loop**：接收模型生成的 Python 代码（如 `sum(1 for x in data if 'keyword' in x)`），在环境中执行，捕获结果或错误，并将结果追加到 Event History 中反馈给模型。\n*   **测量**：\n    1.  **成功率**：模型是否能通过编写代码（如迭代、过滤、计数）正确找出隐藏模式的数量，而不是尝试打印或序列化整个列表。\n    2.  **Token 效率**：对比传统方法（将数据分块序列化进 Prompt）与 NOOA 方法（仅传递预览）在达到相同准确率下的 Token 消耗。\n*   **判定标准**：如果模型能够稳定地生成操作完整列表的代码（如使用 `len(data)` 或迭代），且 Token 消耗显著低于序列化方法，则支持 NOOA 的 Claim；如果模型频繁尝试 `print(data)` 导致截断错误，或无法理解变量引用而要求提供完整数据，则反驳该假设的有效性。", "research_value": "### § 11 最强反例设计\n\n若要挑战 NOOA 的核心主张，最有力的攻击并非针对其代码执行能力，而是针对其**“Pass-by-Reference”机制在复杂推理任务中的认知幻觉与安全性悖论**。\n\n首先，设计一个**“隐式依赖与状态污染”（Implicit Dependency \u0026 State Pollution）**的反例实验。NOOA 假设模型仅通过 `Bounded Preview` 就能理解对象结构并生成正确代码，但这忽略了 LLM 对“未看见数据”的推理盲区。构造一个场景：Agent 需要处理一个包含 10,000 条记录的 `DataFrame`，其中关键逻辑依赖于数据分布的长尾特征（例如，只有最后 1% 的数据包含异常值，而前 99% 是噪声）。在 `Bounded Preview` 中，模型只能看到头部和尾部的少量样本，无法感知整体分布。如果模型基于预览生成的代码（如简单的均值过滤）在沙箱中执行，它可能会错误地清洗掉关键信号，或者更糟糕的是，由于模型无法“看见”中间数据，它可能生成一个看似正确但逻辑上依赖于“假设数据均匀分布”的代码。这种**“基于局部预览的全局推理失效”**将证明 NOOA 的 Token 节省是以牺牲推理准确性为代价的，特别是在数据分布不均或存在隐蔽模式的任务中，模型会因缺乏全局上下文而产生系统性偏差。\n\n其次，提出一个**“代码注入与权限提升”（Code Injection \u0026 Privilege Escalation）**的安全反例。NOOA 允许模型在沙箱中执行任意 Python 代码，并直接操作内存中的 `Live Objects`。攻击者可以构造一个恶意的 `Live Object`（例如，一个被精心设计的 `__repr__` 或 `__getattr__` 方法的类），当模型尝试通过 `pprint(self)` 或访问属性来理解对象时，触发恶意代码执行。虽然 NOOA 声称有沙箱限制，但如果沙箱允许访问某些系统库或网络接口（为了支持复杂的 Tool 调用），模型生成的代码可能无意中绕过沙箱限制，或者利用 Python 的动态特性（如 `eval`、`exec` 或 `import`）进行权限提升。更微妙的是，如果模型被提示去“调试”一个对象，它可能会生成代码来修改对象的内部状态，导致**“状态不一致”（State Inconsistency）**，即 Agent 认为的状态与实际内存中的状态不同步，从而引发难以追踪的 Bug。这种**“模型作为代码生成器”与“模型作为状态消费者”之间的角色冲突**，揭示了 NOOA 在安全性与可靠性上的根本脆弱性。\n\n最后，从**“认知负荷与调试复杂性”（Cognitive Load \u0026 Debugging Complexity）**的角度进行理论论证。NOOA 声称简化了开发，但实际上它将调试责任从框架层转移到了模型层。在传统框架中，错误通常发生在明确的 Tool 调用边界，易于日志追踪。而在 NOOA 中，错误可能发生在模型生成的任意一行 Python 代码中，且由于代码是动态生成的，传统的静态分析工具（如 Linter、Type Checker）无法在开发阶段捕获错误。这意味着开发者必须依赖**“运行时调试”（Runtime Debugging）**，即观察模型生成的代码、执行结果和错误信息，这实际上增加了调试的认知负担。特别是当模型生成复杂的控制流（如嵌套循环、递归）时，追踪错误根源变得极其困难。这种**“黑盒代码生成”与“白盒状态管理”之间的不匹配**，可能导致在实际生产环境中，NOOA 的维护成本远高于传统框架，从而反驳其“开发者友好”的主张。\n\n### § 12 Follow-up Research Idea\n\n基于 NOOA 在**“模型对未看见数据的推理盲区”**和**“动态代码生成的安全性”**方面的局限，提出一个全新的研究方向：**“形式化验证的 Agent 代码合成”（Formally Verified Agent Code Synthesis, FVACS）**。\n\n**(a) 驱动局限与未满足需求：**\nNOOA 的核心假设是 LLM 能可靠地生成操作 `Live Objects` 的代码，但缺乏对生成代码正确性的形式化保证。在金融、医疗或安全关键领域，Agent 的错误决策可能导致严重后果。现有的 NOOA 仅依赖类型注解（Type Annotations）进行轻量级验证，无法捕获逻辑错误（如边界条件、数据完整性约束）。因此，需要一个机制，在代码执行前或执行中，对模型生成的代码进行**形式化验证（Formal Verification）**，确保其行为符合预定义的规范（Specification）。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴**程序合成（Program Synthesis）**和**形式化方法（Formal Methods）**领域的技术，特别是**契约式编程（Design by Contract, DbC）**和**轻量级定理证明（Lightweight Theorem Proving）**。具体而言，可以引入**“运行时断言”（Runtime Assertions）**和**“符号执行”（Symbolic Execution）**。在 Agent 的类定义中，开发者不仅定义类型注解，还定义**前置条件（Preconditions）**和**后置条件（Postconditions）**，以及**不变量（Invariants）**。例如，在 `triage` 方法中，定义“如果订单状态为 'delivered' 且时间超过 30 天，则退款资格必须为 False”。当模型生成代码时，框架不仅执行代码，还通过符号执行引擎验证代码是否满足这些契约。如果验证失败，框架不执行代码，而是将反例（Counterexample）反馈给模型，引导其修正代码。\n\n**(c) 第一个实验设计：**\n设计一个**“高可靠性金融交易 Agent”**实验。\n1.  **场景**：Agent 需要根据市场数据（`Live Object`）生成交易指令。数据包含价格、成交量、波动率等，且存在复杂的非线性关系。\n2.  **规范定义**：定义严格的交易规则，如“单笔交易金额不得超过账户余额的 10%”、“禁止在波动率超过阈值时交易”、“交易指令必须包含有效的股票代码”。\n3.  **实现**：在 NOOA 框架基础上，集成一个轻量级的符号执行引擎（如 Z3 Solver 的 Python 接口）。当模型生成交易代码时，引擎在符号级别验证代码是否满足所有契约。\n4.  **对比**：对比标准 NOOA（仅类型验证）与 FVACS（形式化验证）在以下指标上的表现：\n    *   **安全性**：违规交易指令的数量（FVACS 应为 0）。\n    *   **效率**：由于验证开销，Token 消耗和延迟的变化。\n    *   **鲁棒性**：在面对对抗性市场数据（如极端波动）时，Agent 的决策稳定性。\n5.  **预期结果**：FVACS 将显著降低错误率，特别是在边界条件下，尽管会增加一定的计算开销。这将证明，通过引入形式化验证，可以弥补 LLM 在逻辑严谨性上的不足，使 Agent 适用于高可靠性场景。\n\n这个方向与 NOOA 的区别在于，NOOA 关注**“如何高效地让模型操作对象”**，而 FVACS 关注**“如何确保模型操作对象的正确性和安全性”**。它不是简单地扩展 NOOA 的功能，而是引入了一个全新的**“验证层”（Verification Layer）**，将 Agent 开发从“试错式编程”推向“验证式编程”，打开了**“可信 AI Agent”（Trustworthy AI Agents）**的研究新领域。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "{\n  \"authors\": [\n    {\"name\": \"Paul Furgale\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Severin Klingler\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"James Nolan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Matt Staats\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Gaia Di Lorenzo\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Elisa Martinez Abad\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Christian Schüller\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Razvan Dinu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Alessio Devoto\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Pascal Berard\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Gal Kaplun\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Elad Sarafian\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Riccardo Roveri\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Leon Derczynski\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ricardo Silveira Cabral\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"NVIDIA\"}\n  ],\n  \"footnotes\": []\n}", "summary_translation": "传统的智能体开发分散在提示模板、工具模式、回调代码和工作流图中。我们提出了 NVIDIA Object-Oriented Agents (NOOA)，这是一个与模型无关的 Python 框架，用于构建可靠的 AI 智能体。NOOA 采用了一种更简单的方法：智能体即 Python 对象。其方法是模型可执行的动作，字段是其状态，文档字符串是其提示，类型注解是其契约。代码体由 \"...\" 组成的方法在运行时由 LLM 驱动的智能体循环完成，而具有常规代码体的方法则保持为标准确定性 Python。这为开发者和智能体提供了相同的接口，因此智能体行为可以像其他软件一样进行测试、追踪、重构和改进。本文做出了三项贡献。（1）我们提出了智能体即 Python 对象的编程模型及其背后的设计原则。在 Python 已有抽象的地方，我们直接采用它们。智能体特定功能——上下文、事件、状态渲染、长期记忆和经过验证的 LLM 循环——通过简单的 Pythonic API 暴露，使开发者和智能体共享一个熟悉的编程模型。（2）我们确定了六个面向模型的理念，据我们所知，NOOA 是首个在单一表面上组合这些理念的系统：类型化输入/输出、通过实时对象进行引用传递、代码即动作、可编程循环工程、显式对象状态以及用于上下文和事件的模型可调用测试框架 API。我们发现社区已经在收敛于其中几个理念——通常作为实验性或部分功能——并进行了比较以鼓励进一步采用。（3）我们证明了当前模型能够有效地使用此接口，无论是在针对性能力测试中，还是在 SWE-bench Verified、Terminal-Bench 2.0 和 ARC-AGI-3 等智能体和推理基准测试中。"}]}, {"name": "Human-Agent Interaction \u0026 Tool Use", "count": 2, "papers": [{"title": "AppWorld-UL: Benchmarking Diverse Agent-User Interactions for Tool-Use", "arxiv_id": "2607.20536", "authors": "Junzhi Chen, Harsh Trivedi, Jane Pan, Michael JQ Zhang, Tejas Srinivasan, Niranjan Balasubramanian, Ashish Sabharwal", "summary": "Tool-use agents that address day-to-day digital tasks such as ordering groceries must not only operate applications, but also interact with the user, e.g., to ask clarification questions, prompt for confirmation, and inform the user when the instruction is infeasible. However, current benchmarks for evaluating agent-user interactions do not capture the diversity of such interactions. Further, they operate in small environments with few, often non-state-changing, APIs. To address this gap, we introduce AppWorld-UL, a ``user-in-the-loop'' benchmark of 516 challenging tasks requiring diverse agent-user interactions. Building upon the AppWorld framework with 9 popular simulated apps like Amazon and Spotify, we systematically modify original tasks to introduce ambiguities and constraints that necessitate various types of agent-user interaction. User behavior is simulated by an LLM prompted to respond with carefully designed knowledge boundaries, offering more reliable simulation than the unconstrained or overly rigid alternatives used in prior work. Our evaluation reveals that a state-of-the-art LLM, Claude Opus 4.7, achieves only 48.6% success on AppWorld-UL, and only 35.7% on the harder, compositional subset. On the stricter, scenario-level metric, compositional task performance drops to only 21.3%. Our analysis reveals that correct user-interaction is crucial for success. This demonstrates the benchmark's difficulty and its potential to advance research on user-in-the-loop tool-use agents.", "category": "cs.CL", "cluster": "Human-Agent Interaction \u0026 Tool Use", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=54 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文符合筛选标准，主要依据如下：\n\n1.  核心研究对象明确为 LLM Agent：论文标题和摘要明确指出研究对象是 \"Tool-use agents\"（工具使用智能体），这是 Agentic AI 的核心子方向之一。\n2.  聚焦智能体的关键能力（澄清与交互）：摘要强调智能体不仅需要操作应用，还需要与用户进行交互，包括“ask clarification questions”（询问澄清问题）、“prompt for confirmation”（请求确认）等。这直接对应筛选标准中提到的“clarification timing”（澄清时机）和“agent-user interactions”（智能体-用户交互），属于单智能体在复杂环境下的规划与决策能力范畴。\n3.  属于评估基准类保留项：根据筛选标准第一步，“如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准... 只要结论直接帮助理解或改进智能体能力，也应保留”。AppWorld-UL 是一个专门针对“user-in-the-loop”场景的基准测试，旨在揭示当前智能体在处理模糊指令和需要交互的任务中的失败模式（如 Claude Opus 4.7 的低成功率），其分析结果（“correct user-interaction is crucial for success”）直接有助于改进智能体的交互机制和鲁棒性。\n4.  排除项不适用：虽然涉及模拟用户（LLM prompted to respond），但这属于基准测试中的环境模拟部分，而非研究多智能体拓扑或通信协议；也不涉及安全、对齐、图神经网络或多模态视觉等排除领域。\n\n综上，该论文通过构建新的基准来评估和改进工具使用智能体的用户交互能力，完全符合“构建、改进、评估 LLM 智能体”的研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：如何构建一个能够全面评估 **Tool-Use Agents** 在 **User-in-the-Loop** 场景下多样化交互能力的基准测试。现有的 Agent 评测大多假设任务是完全指定的（fully specified），即目标清晰、信息完整且固定。然而，现实世界中的数字任务（如在线购物、邮件处理）本质上是迭代和协作的：用户初始指令往往模糊（underspecified）、不可行（infeasible）或需要确认（confirmation-requiring），Agent 必须通过多轮交互来澄清意图、处理异常或获取授权。\n\n这一问题的重要性在于，当前主流的 Agent 评测基准存在显著局限，无法反映真实部署中的复杂性。首先，现有基准仅捕捉了狭窄的交互类型（主要是简单的澄清问题），忽略了 **Infeasibility**（任务不可行时的沟通）和 **Need for Approval**（高成本操作前的确认）等关键交互模式。其次，现有基准中的用户模拟要么过于僵化（基于规则，缺乏灵活性），要么过于自由（基于 LLM 但无约束，导致评估不稳定且难以归因失败原因）。最后，现有基准通常运行在小型、非状态改变（non-state-changing）的环境中，限制了 Agent 在复杂、长 horizon 任务中的规划能力。\n\n解决这一问题带来的价值包括：1) 提供一个包含 516 个挑战性任务的 **AppWorld-UL** 基准，涵盖三种核心交互类型及其组合，填补了多样化 Agent-User 交互评测的空白；2) 提出一种基于扰动（perturbation-based）的方法，将自主任务系统性地转化为交互式任务，并设计了具有明确知识边界（knowledge boundaries）的模拟用户，平衡了交互的自然性与评估的可复现性；3) 通过实验揭示当前最先进 LLM（如 Claude Opus 4.7）在交互式任务上的表现远低于自主任务，证明交互能力是当前 Agent 的主要瓶颈，从而为未来研究提供了明确的改进方向。\n\n### § 2 前人工作与不足\n\n该问题此前并未得到充分解决，尽管已有研究开始关注 Agent-User 交互，但存在明显不足。最相关的 prior work 包括 **$\\tau$-bench** (Yao et al., 2024)、**BFCLv3** (Mao et al., 2024)、**UserBench** (Qian et al., 2025) 和 **ToolSandbox** (Lu et al., 2025)。\n\n**$\\tau$-bench** 等基准引入了多轮协作执行，但其模拟用户具有过强的自由度（unconstrained），不仅回答问题，还负责纠正 Agent 并决定任务终止。这种设计导致用户行为不稳定，引入显著方差，使得评估结果难以复现，且失败原因难以归因于 Agent 还是模拟器。相比之下，**BFCLv3** 采用基于规则的用户模型，在固定轮次插入预定义消息，虽然保证了高稳定性和可复现性，但严重限制了用户对 Agent 发起问题的响应能力，无法捕捉真实世界中用户主动协商约束、澄清意图的动态交互过程。\n\n**UserBench** 和 **ToolSandbox** 试图在灵活性与可靠性之间取得平衡，引入了知识受限的模拟用户。然而，这些基准构建在相对较小的环境中，API 数量少且多为非状态改变型，限制了 Agent 的长期规划和复杂工具使用能力。此外，它们捕捉的 Agent-User 交互类型有限，未能系统性地覆盖 **Underspecification**、**Infeasibility** 和 **Confirmation-Seeking** 这三种核心交互模式及其组合。\n\n因此，现有工作的不足主要在于：1) **交互类型单一**：缺乏对不可行性和确认需求的系统性评估；2) **用户模拟失衡**：要么过于僵化，要么过于不稳定，缺乏具有明确知识边界的平衡模拟；3) **环境复杂度低**：无法测试 Agent 在大型、状态化环境中的长 horizon 规划与交互结合能力。AppWorld-UL 通过基于 AppWorld 的大型环境、系统性的任务扰动方法以及知识受限的 LLM 用户模拟，有效解决了这些不足。", "core_insight": "### § 3 重建作者的思考路径\n\n在评估 LLM-based agents 的现有基准（如 WebArena, SWE-bench）中，任务通常被设计为“完全指定”（fully specified）的，即目标清晰、环境状态确定，Agent 只需执行固定的 API 调用序列。然而，现实世界中的数字任务本质上是 **User-in-the-Loop** 的：用户指令往往模糊（Underspecified），环境约束可能导致目标不可行（Infeasible），或高成本操作需要确认（Confirmation-requiring）。现有的交互式基准（如 $\\tau$-bench, BFCLv3）试图模拟这种交互，但存在两个极端缺陷：一是基于规则的用户模拟器（Rule-based）过于僵化，无法处理动态对话流；二是基于 LLM 的无约束用户模拟器（Unconstrained LLM-based）引入了巨大的方差，导致评估结果不稳定且难以归因（Failure Attribution）。\n\n此外，现有基准的环境通常较小，API 数量有限且多为非状态改变型（non-state-changing），无法测试 Agent 在复杂、长视界（long-horizon）任务中同时管理工具使用和用户交互的能力。作者意识到，要构建一个可靠且具挑战性的基准，必须解决“如何模拟用户”和“如何定义交互必要性”这两个核心问题。直接从头构建交互式任务极其困难且难以保证质量。因此，作者转向了已有的高质量自主 Agent 基准 AppWorld，思考如何通过系统性的“扰动”（Perturbation）将自主任务转化为交互式任务。通过从指令或初始状态中移除关键信息（引入信息不对称），可以精确地定义用户知识集合 $K$，从而既保证了用户模拟器的可控性（通过约束 LLM 仅回答 $K$ 中的问题），又实现了交互质量的程序化评估（检查 Agent 是否询问了所有必要信息）。这种从“自主”到“交互”的转化思路，既复用了 AppWorld 的复杂环境工程，又解决了用户模拟的稳定性和评估的可解释性问题。\n\n### § 4 核心 Intuition\n\n这篇论文的核心直觉是：现实世界任务的难度不仅源于环境复杂性，更源于**信息不对称**所引发的必要交互。通过从已有的自主任务中系统性移除关键信息（Perturbation），我们可以精确构造出必须通过 Agent-User 交互才能解决的任务，并利用定义好的用户知识集合 $K$ 来约束 LLM 模拟用户的行为。这种方法既避免了无约束模拟带来的评估噪声，又通过程序化验证 Agent 是否获取了 $K$ 中的所有必要信息，实现了对交互质量而非仅仅任务结果的精确评估。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法是 **Perturbation-based Transformation**（基于扰动的转换），旨在将现有的自主代理任务（Autonomous Agent Tasks）系统性地转化为需要用户交互的 **User-in-the-Loop** 任务。其完整 Pipeline 如下：\n\n1.  **基础环境构建 (Base Environment Setup)**：\n    *   **输入**：基于 **AppWorld** 框架，这是一个包含 9 个流行模拟应用（如 Amazon, Spotify, Gmail 等）和超过 475 个 API 的大型状态化环境。\n    *   **初始状态**：每个任务由一个 **Scenario**（场景模板）定义，包含初始环境状态 $S_0$、自然语言指令 $I$ 和程序化评估函数 $E$。此时，任务是完全确定的，无需用户交互。\n\n2.  **任务扰动与知识注入 (Perturbation \u0026 Knowledge Injection)**：\n    *   **处理**：作者通过修改指令 $I$ 或初始状态 $S_0$ 引入特定的“信息缺口”，从而生成新的任务 $T' = (I', S_0', E', K)$。\n    *   **三种扰动类型**：\n        *   **Underspecification（欠指定）**：移除关键信息，导致存在多个可行路径。例如，将“退回上周买的 Nike 衬衫”改为“退回上周买的衬衫”，而环境中存在多件衬衫。\n        *   **Infeasibility（不可行性）**：修改环境状态使原目标无法达成。例如，移除所需商品的库存。\n        *   **Confirmation-Requiring（需确认）**：引入高成本或高风险条件。例如，商品价格大幅上涨，需用户确认是否继续购买。\n    *   **知识集 $K$ 生成**：扰动过程中移除或隐藏的信息被提取为 **User Knowledge Set** $K$，表示为问答对集合 $\\{(q_1, a_1), ..., (q_n, a_n)\\}$。这是用户知道但代理不知道的信息。\n\n3.  **模拟用户设计 (Simulated User Design)**：\n    *   **机制**：使用一个受约束的 LLM 作为模拟用户。\n    *   **约束逻辑**：模拟用户被提示包含任务指令、对话历史以及知识集 $K$。\n        *   如果代理的问题映射到 $K$ 中的某个 $q_i$，用户回答对应的 $a_i$。\n        *   如果问题不在 $K$ 中，用户拒绝回答或引导代理自行决定（防止信息泄露）。\n    *   **目的**：平衡真实感与可复现性，避免传统规则用户的僵化和无约束 LLM 用户的不稳定性。\n\n4.  **代理执行与交互 (Agent Execution \u0026 Interaction)**：\n    *   **代理架构**：使用 **Code Agent**（生成 Python 代码调用 API）或 **Function Calling Agent**。\n    *   **交互流程**：代理在执行过程中遇到信息缺口时，调用 `supervisor.message()` API 向模拟用户提问。\n    *   **示例流程**：\n        *   *指令*：“退回上周买的衬衫并买大一号的。”\n        *   *代理动作*：查询订单，发现两件衬衫（Nike 和 Adidas）。\n        *   *交互*：代理提问：“您想退回哪一件？”（映射到 $K$ 中的欠指定问题）。\n        *   *用户响应*：“Nike 那件。”\n        *   *代理动作*：尝试查找 Nike 衬衫的大号，发现缺货（Infeasibility）。\n        *   *交互*：代理提问：“大号缺货，您想怎么办？”\n        *   *用户响应*：“买加大号（XL）。”\n        *   *代理动作*：查询 XL 价格，发现涨价。\n        *   *交互*：代理提问：“价格翻倍了，还要买吗？”（Confirmation）。\n        *   *用户响应*：“买。”\n        *   *最终动作*：完成购买。\n\n5.  **程序化评估 (Programmatic Evaluation)**：\n    *   **输出**：不仅评估任务目标完成度（TGC/SGC），还引入 **Interactive Metrics** (I-TGC, I-SGC)。\n    *   **交互质量评估**：检查代理是否询问了 $K$ 中所有必要的问题（**Interaction Recall**）。如果代理遗漏了关键提问，即使最终任务侥幸成功，也被视为交互失败。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n本节跳过。本文主要贡献在于基准测试构建、任务转换方法论及实证评估，未涉及复杂的理论数学推导或新算法的收敛性证明。其核心逻辑基于集合论的任务定义 $T = (I, S_0, E, K)$ 和基于规则的扰动转换，而非数学模型推导。\n\n### § 7 实验设计与结论\n\n**1. 验证基准的难度与当前 SOTA 模型的局限性**\n*   **提出了什么问题**：当前的顶级 LLM 代理在需要复杂用户交互的任务中表现如何？基准测试是否足够具有挑战性？\n*   **设计了什么实验验证这个问题**：在 **AppWorld-UL** 基准上测试多种前沿 LLM（如 Claude Opus 4.7, GPT-5.5, Qwen 3.7 Max 等）结合 Code Agent 和 Function Calling Agent 的表现。分别评估单一交互类型（Underspecified, Infeasible, Confirmation）和组合交互类型（Compositional）的任务完成率（I-TGC）和场景完成率（I-SGC）。\n*   **问题的答案是什么**：即使是最先进的模型（Claude Opus 4.7 Code Agent），整体成功率仅为 48.6%，在更难的组合任务中降至 35.7%。这表明当前的代理在处理动态、多轮、需澄清和确认的用户交互方面存在显著不足，基准测试具有足够的区分度和挑战性。\n\n**2. 验证用户交互对任务成功的关键性**\n*   **提出了什么问题**：任务失败的主要原因是环境复杂性还是交互能力不足？正确的用户交互是否直接关联任务成功？\n*   **设计了什么实验验证这个问题**：\n    *   **Ablation Study（消融实验）**：对比三种设置：Default（正常交互）、Oracle Knowledge（预先提供所有用户知识 $K$，无需交互）、Hidden Knowledge（用户拒绝提供任何信息）。\n    *   **交互分析**：计算成功任务与失败任务中的 **Interaction Recall**（是否问了所有必要问题）和 **Interaction Precision**（问的问题是否相关）。\n*   **问题的答案是什么**：\n    *   在 Oracle 设置下，成功率从 41.8% 提升至 78.1%，证明交互需求是主要难点。\n    *   在 Hidden 设置下，成功率骤降至 12.8%，证明用户知识 $K$ 是完成任务的必要条件。\n    *   成功任务中，代理的 Interaction Recall 接近 100%；失败任务中，Recall 大幅降低（37%-40%），表明未能获取必要信息是导致失败的核心原因。\n\n**3. 验证模拟用户的鲁棒性与自然度**\n*   **提出了什么问题**：基于 LLM 的模拟用户是否稳定？其回答是否自然且符合预设的知识边界？\n*   **设计了什么实验验证这个问题**：\n    *   **LLM 敏感性测试**：更换模拟用户背后的基础 LLM（如 GPT-4.1, GPT-5, GPT-5.5），观察代理得分的标准差。\n    *   **人工评估**：人工审查模拟用户的回答，判断其是否符合人类在给定知识 $K$ 下的自然反应。\n*   **问题的答案是什么**：不同 LLM 作为模拟用户时，代理得分的标准差极小（I-TGC 标准差 2.2），证明模拟用户行为稳定。人工评估显示错误率仅为 1.3%，证明模拟用户既自然又可靠，能够有效隔离代理的行为评估。", "additional_insights": "### § 8 Take-aways\n\nAppWorld-UL 提出了一种基于扰动（perturbation-based）的方法，将现有的自主代理任务系统性地转化为需要用户交互的 User-in-the-Loop 任务，从而解决了现有基准在交互多样性、用户模拟平衡性及环境复杂度上的不足。该基准定义了三种核心交互类型：Underspecification（目标未指定，需澄清）、Infeasibility（目标不可行，需沟通替代方案）和 Confirmation-requiring（需确认，涉及高成本或风险操作），并构建了包含 516 个任务的测试集，涵盖单一及组合交互场景。通过引入具有明确知识边界（Knowledge Boundaries）的 LLM 模拟用户，AppWorld-UL 在保持交互自然性的同时确保了评估的可复现性，避免了传统规则式用户的僵化和完全开放 LLM 用户的不稳定性。实验结果显示，即使是 SOTA 模型如 Claude Opus 4.7，在整体任务上的成功率仅为 48.6%，而在更复杂的组合任务（Compositional subset）上仅达到 35.7%，表明当前代理在动态交互中仍存在显著缺陷。消融实验证实，交互需求是任务难度的主要来源，当提供 Oracle Knowledge 时，GPT-5.5 的成功率从 41.8% 提升至 78.1%，说明代理的主要瓶颈在于未能有效识别信息缺口并发起正确的用户交互，而非单纯的环境规划能力不足。分析进一步揭示，成功的任务执行与高 Interaction Recall（问出所有必要问题）强相关，而失败案例常表现为未能识别澄清需求、幻觉式自我解决或提问质量低下。\n\n### § 9 最脆弱的假设\n\n该方法最核心的脆弱假设是：**预定义的、离散的问答对（QA pairs）集合 $K$ 能够充分覆盖并代表真实用户在复杂、动态交互中可能提供的有效信息和意图修正。**\n\n如果这一假设不成立，即真实用户的反馈往往是非结构化、隐含上下文依赖或超出预设 QA 范围的，那么 AppWorld-UL 的评估将严重偏离现实，导致代理在基准上表现良好但在实际部署中失败。具体而言，真实用户可能会提供模糊的偏好（如“找个便宜点的”而非具体的颜色排序）、引入新的约束条件，或者在代理提问时改变整个任务目标，而不仅仅是回答预设问题。论文中虽然通过手动构建 QA 对并验证其必要性来支持这一假设，且声称模拟用户会拒绝回答 $K$ 之外的问题以模拟真实用户的有限知识，但这实际上简化了真实交互的开放性。论文缺乏证据表明这种受限的交互模式足以泛化到更广泛的真实世界场景，特别是当用户意图发生根本性偏移（Intent Shift）时，代理是否具备处理超出 $K$ 范围的新信息的能力并未得到充分验证。如果真实场景中用户提供的信息经常超出预设的 $K$，那么基于 $K$ 的 Programmatic Evaluation 将无法准确衡量代理的真实交互能力，从而削弱基准的有效性。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现并验证 **“交互质量（Interaction Recall）与任务成功率之间的强相关性”** 这一核心 claim，无需构建完整的 AppWorld 环境。\n\n**数据与实现：**\n1.  **数据：** 从论文附录或公开代码中选取 10-20 个典型的 User-in-the-Loop 任务轨迹（包括成功和失败的案例），重点关注代理与模拟用户之间的对话日志。\n2.  **实现：** 编写一个简单的脚本，解析这些对话日志。对于每个任务，提取代理提出的所有问题，并与该任务预设的 Knowledge Set $K$ 中的必要问题进行匹配。计算每个任务的 Interaction Recall（问出的必要问题比例）和 Interaction Precision（问出的问题中属于 $K$ 的比例）。\n3.  **测量：** 将计算出的 Recall 和 Precision 分数与任务的实际执行结果（Success/Fail）进行关联分析。\n\n**验证标准：**\n*   **支持 Claim：** 如果数据显示，成功任务的平均 Interaction Recall 显著高于失败任务（例如成功任务 Recall \u003E 90%，失败任务 Recall \u003C 50%），且两者之间存在统计学上的显著相关性，则支持论文关于“正确交互是成功关键”的结论。\n*   **反驳 Claim：** 如果发现大量成功任务的 Interaction Recall 很低（即代理未问出所有预设问题却仍完成任务），或者大量失败任务的 Recall 很高（即代理问出了所有问题但仍失败），则表明交互质量并非决定因素，或者预设的 $K$ 未能准确反映任务成功的必要条件，从而质疑基准设计的合理性。\n\n此实验成本低，仅需处理文本日志，却能直接检验论文最核心的因果推断：即代理的失败主要源于交互缺失，而非其他环境因素。", "research_value": "### § 11 最强反例设计\n\n针对 AppWorld-UL 的核心假设——即预定义的离散问答对集合 $K$ 能够充分代表真实交互中的信息需求——最有力的反例设计应聚焦于 **“意图漂移（Intent Drift）”与“非结构化反馈（Unstructured Feedback）”** 场景，以证明该基准评估的是“模式匹配能力”而非真正的“交互推理能力”。\n\n**实验设计：开放域意图修正攻击（Open-Domain Intent Shift Attack）**\n构建一组特殊的测试任务，其中用户的初始指令存在严重的 **Underspecification**，但正确的解决方案并非通过澄清原始指令中的缺失参数（如颜色、尺寸），而是需要 Agent 识别出原始指令在逻辑或偏好上的根本错误，并引导用户修正目标本身。\n*   **具体场景**：用户指令为“帮我订一张去纽约的机票，明天出发”。在真实场景中，如果明天没有直飞航班或价格极高，优秀的 Agent 不应仅仅询问“你要直飞吗？”或“预算多少？”（这些属于预设 $K$ 中的澄清问题），而应主动提出“明天直飞售罄，建议后天出发或中转，您看如何？”\n*   **攻击逻辑**：在 AppWorld-UL 的框架下，如果 $K$ 仅包含关于“直飞/中转”或“日期偏好”的预设 QA 对，Agent 只需机械地遍历 $K$ 即可得分。然而，如果我们将模拟用户的行为修改为：当 Agent 提出预设问题但用户回答“不，我其实更看重价格，哪怕晚两天也行”时，Agent 必须动态调整搜索策略。\n*   **预期结果**：如果 Agent 在 AppWorld-UL 上表现良好（高 Interaction Recall），但在引入这种动态意图修正的变体实验中失败（例如，Agent 继续执着于询问“是否接受中转”而忽略了用户已表达的“价格优先”新约束），则证明 AppWorld-UL 的高分仅源于 Agent 对静态 $K$ 的覆盖能力，而非其处理动态、非结构化用户反馈的真实交互智能。这将揭示基准存在 **“Goodhart's Law”** 风险：Agent 优化了“问对预设问题”这一代理指标，却未提升真实的用户协作能力。\n\n**理论论证：知识边界的刚性缺陷（Rigidity of Knowledge Boundaries）**\n从信息论角度论证，真实用户交互是一个 **贝叶斯更新（Bayesian Updating）** 过程，用户提供的信息不仅回答当前问题，还可能隐含新的约束或修正先验概率。AppWorld-UL 将用户知识建模为静态集合 $K$，切断了信息之间的语义关联。\n*   **反例逻辑**：在真实购物场景中，用户回答“我要红色的”可能隐含“我不喜欢蓝色”以及“红色通常更贵，但我愿意接受”等多重语义。如果 Agent 仅将“红色”映射到 $K$ 中的单一属性过滤，而忽略了潜在的预算约束变化，它在 AppWorld-UL 中可能因“正确回答了颜色问题”而获得高分，但在真实部署中会导致后续因价格过高被用户拒绝。\n*   **结论**：这种设计使得基准无法区分“机械式澄清（Mechanical Clarification）”与“协作式规划（Collaborative Planning）”。因此，AppWorld-UL 的高成功率可能只是 Agent 在封闭集合中检索信息的效率体现，而非其在开放交互中理解用户意图的能力体现。\n\n### § 12 Follow-up Research Idea\n\n基于 AppWorld-UL 将用户交互简化为静态知识检索的局限，提出一个新的研究方向：**Dynamic Intent Co-Evolution Benchmark (DICE)**，旨在评估 Agent 与用户共同演化任务目标的能力，而非仅仅澄清固定目标。\n\n**(a) 驱动局限与未满足需求**\nAppWorld-UL 的核心局限在于其 **Static Goal Assumption**：任务目标 $I$ 在交互开始前已固定，交互仅用于填补信息缺口。然而，真实世界中的数字任务（如旅行规划、内容创作）本质上是 **Co-Creative** 的：用户往往只有模糊的初始意图，最终目标是在与 Agent 的多轮交互中逐渐清晰和演变的。现有基准无法评估 Agent 在用户意图发生根本性偏移（Intent Shift）或用户提出全新约束时的适应能力。\n\n**(b) 借鉴相邻领域的方法**\n借鉴 **Human-AI Teaming** 和 **Conversational Recommender Systems** 中的 **Joint Action Space** 概念。在这些领域，Agent 和用户被视为共同探索解空间的合作伙伴，而非简单的问答双方。引入 **Intent Graph** 或 **Preference Latent Space** 的概念，将用户意图建模为一个动态变化的概率分布，而非固定的参数集合。同时，借鉴 **Reinforcement Learning from Human Feedback (RLHF)** 中的偏好学习机制，但将其应用于实时交互中的目标修正，而非离线训练。\n\n**(c) 第一个实验设计**\n构建一个 **Dynamic Goal Evolution (DGE)** 实验协议，包含以下关键组件：\n1.  **动态用户模拟器（Dynamic User Simulator）**：不同于 AppWorld-UL 中基于静态 $K$ 的模拟器，DGE 的模拟器拥有一个隐式的、可变的 **Preference Vector**。当 Agent 提出建议时，模拟器不仅回答“是/否”，还会根据建议的质量动态调整其偏好向量（例如，如果 Agent 推荐了高价商品，用户可能从“性价比优先”转向“质量优先”）。\n2.  **意图漂移任务（Intent Drift Tasks）**：设计一系列任务，其中初始指令故意模糊或存在内在冲突（如“我要一个既便宜又顶级的耳机”）。Agent 必须通过多轮交互，不仅澄清参数，还要引导用户做出权衡（Trade-off），最终达成一个双方都接受的、与初始指令可能显著不同的目标。\n3.  **评估指标**：引入 **Goal Alignment Score**（最终执行结果与用户动态偏好向量的匹配度）和 **Efficiency of Co-Evolution**（达成最终目标所需的交互轮次）。\n4.  **对比基线**：将当前在 AppWorld-UL 上表现最好的 Agent（如 Claude Opus 4.7）与专门针对动态意图优化的 Agent 进行对比。预期结果是，现有 Agent 在 DGE 任务上表现极差，因为它们倾向于僵化地执行初始指令或机械地澄清参数，而无法适应用户意图的动态演化。\n\n**与已有工作的区别**：\nAppWorld-UL 关注的是 **Information Gap Filling**（填补信息缺口），而 DICE 关注的是 **Goal Space Exploration**（目标空间探索）。前者假设目标是固定的，交互是手段；后者假设目标是流动的，交互是共同创造的过程。这一转变将研究重点从“如何问对问题”转移到“如何与用户共同定义问题”，代表了 Agent 交互能力评估的范式转移。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Junzhi Chen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Harsh Trivedi\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Jane Pan\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Michael Zhang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Tejas Srinivasan\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Niranjan Balasubramanian\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Ashish Sabharwal\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"New York University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Allen Institute for AI\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"University of Southern California\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Stony Brook University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal contribution\"\n    }\n  ]\n}\n```", "summary_translation": "处理日常数字任务（如订购杂货）的工具使用智能体不仅需要操作应用程序，还必须与用户进行交互，例如提出澄清性问题、请求确认，以及在指令不可行时通知用户。然而，当前用于评估智能体-用户交互的基准测试未能捕捉此类交互的多样性。此外，这些基准测试通常在小型环境中运行，仅包含少量且通常不改变状态的 API。为了弥补这一差距，我们引入了 AppWorld-UL，这是一个包含 516 个具有挑战性任务的“人在回路”（user-in-the-loop）基准测试，这些任务需要多样化的智能体-用户交互。基于包含 Amazon 和 Spotify 等 9 个流行模拟应用的 AppWorld 框架，我们对原始任务进行了系统性修改，引入了需要各种类型智能体-用户交互的歧义和约束。用户行为由大型语言模型（LLM）模拟，该模型被提示以精心设计的知识边界进行响应，相较于先前工作中使用的无约束或过于僵化的替代方案，提供了更可靠的模拟。我们的评估显示，最先进的 LLM Claude Opus 4.7 在 AppWorld-UL 上的成功率仅为 48.6%，而在更难的组合子集上仅为 35.7%。在更严格的场景级指标下，组合任务的性能进一步下降至仅 21.3%。我们的分析表明，正确的用户交互对于成功至关重要。这证明了该基准测试的难度及其在推动人在回路工具使用智能体研究方面的潜力。"}, {"title": "LLMs Get Lost in Evolving User Intent", "arxiv_id": "2607.20734", "authors": "Jihoon Tack, Philippe Laban, Jennifer Neville", "summary": "As LLMs become more capable, they are increasingly deployed as collaborative agents, taking on user-delegated tasks through iterative interaction. Yet genuine interaction is inherently dynamic: users rarely specify their intent upfront, instead disclosing, revising, and reshaping it as the conversation unfolds. Despite this, LLMs are still predominantly evaluated or trained in single-turn, fully-specified settings, leaving open a fundamental question: how well do LLMs track and act on user intent as it evolves over the course of a conversation? To study this, we introduce a framework that transforms static, single-turn tasks into dynamic multi-turn conversations in which the user's intent evolves across turns--incrementally revealed, revised, and at times redirected mid-conversation--
