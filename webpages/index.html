是提示词过长，还是引入了冗余流程？\n\n**设计了什么实验验证这个问题**：\n1.  **构建对比数据集**：利用 **Differential Testing** 思想，在 SkillsBench 和 SWE-Skills-Bench 上执行配对运行（Target vs. No-Skill/Matched-Skill），隔离出由技能引起的 307 个故障案例。\n2.  **构建分类法与人工分析**：对 125 个功能性故障和 182 个效率回归进行人工根因分析，建立详细的分类体系（如 Task-Implementation Fault, Excessive Procedure 等）。\n3.  **开发并评估自动归因工具**：构建 **SKILLTRIAGE** 工具，利用差分证据自动预测故障根因，并与人工标签对比，验证其自动化归因的准确性。\n\n**问题的答案是什么**：\n1.  **功能性故障的根源**：绝大多数功能性故障（68.8%）并非由明显不相关的技能引起，而是由 **Task-Implementation Fault (TIF)** 导致。看似相关的技能往往使 Agent 错误地实现或遗漏了任务必需的元素（如错误的 API 调用、缺失的配置项）。仅有 1.6% 的故障是因为技能完全不适用（Applicability Mismatch）。\n2.  **效率回归的根源**：效率回归主要由 **Excessive Procedure (EP)** 主导（62.6%），而非单纯的提示词长度（Context Bloat 仅占 25.3%）。在 EP 中，**Excessive Verification**（过度验证，36.8%）和 **Heavy Implementation Pipeline**（重型实施流程，16.5%）是主要来源。这表明技能常将可选的验证清单和构建食谱转化为强制性工作。\n3.  **自动归因的可行性**：**SKILLTRIAGE** 工具在功能性故障上的子类别准确率达到 88.8%，在效率回归上达到 72.5%，证明了基于差分证据的自动化归因是可行且有效的，可用于大规模技能市场的筛选。", "additional_insights": "### § 8 Take-aways\n\nLLM Agent 的 **Agent Skills** 机制虽然旨在提供可复用的程序化指导，但实证研究表明其经常导致 **Functional Failures**（功能失败）和 **Efficiency Regressions**（效率回归），且这种危害往往源于看似相关但操作不兼容的技能，而非完全不相关的噪声。在 125 例功能失败中，68.8% 归因于 **Task-Implementation Fault**，即技能诱导 Agent 错误实现或遗漏了任务必需的元素（如错误的 API 调用或缺失的配置字段），这表明 Agent 倾向于过度信任技能中的默认示例或模板，将其误认为特定任务的强制约束。在 182 例效率回归中，62.6% 归因于 **Excessive Procedure**，其中 **Excessive Verification**（过度验证）和 **Heavy Implementation Pipelines**（重型实现流水线）是主要驱动因素，证明技能常将可选的检查清单或构建步骤转化为强制性工作，从而显著增加 Token 消耗和执行时间，而不仅仅是因为 Prompt 长度增加导致的 **Context Bloat**。为了归因这些失败，论文提出了基于 **Differential Testing** 思想的对比分析框架，通过比较 **Target Run**（加载技能）与 **Reference Run**（无技能或语义匹配技能）来隔离技能诱导的影响，并开发了 **SKILLTRIAGE** 工具，该工具能自动化提取差异证据并归因根因，在功能失败和效率回归上的子类别准确率分别达到 88.8% 和 72.5%。研究建议技能作者应将强制性任务要求与可选示例、默认值分离，并采用 **Lazy-loading** 策略加载辅助材料，同时 Agent 平台应实施 **Skill-task compatibility checks** 和 **Budget-aware execution policies** 以动态调整验证范围和实现深度。\n\n### § 9 最脆弱的假设\n\n本研究最核心且脆弱的假设是：**Reference Run**（无技能或语义匹配技能）能够作为有效的 **Pseudo-oracle**，即如果 Reference Run 成功或成本更低，那么 Target Run 的失败或高成本必然由加载的技能引起，而非基线 Agent 的能力局限、任务本身的随机性或环境噪声。这一假设在实际中可能不成立，因为 LLM Agent 的执行具有高度的非确定性（Stochasticity），即使在没有技能的情况下，Agent 也可能因内部推理波动、工具调用顺序的微小差异或环境状态的细微变化而失败或产生高成本；如果 Reference Run 的成功仅仅是因为“运气好”或避开了某个随机陷阱，而 Target Run 的失败是因为触发了同样的陷阱，那么将失败归因于技能就是错误的归因。此外，**Semantically Matched Skills** 的检索依赖于嵌入模型的语义相似度，如果检索到的参考技能在语义上看似匹配但在操作逻辑上存在根本差异（例如一个强调速度，一个强调鲁棒性），那么两者之间的性能差异可能反映的是技能设计哲学的不同，而非目标技能的“有害性”，这会导致对 **Skill-induced** 性质的误判。论文通过要求 Reference Run 在相同任务、验证器、模型和环境配置下运行来提供控制证据，并排除了模糊案例，但并未完全排除 Agent 内在随机性导致的对比偏差，也未证明检索到的语义匹配技能在操作等价性上足以作为公平的成本基准，这留下了将随机方差误判为技能缺陷的风险。\n\n### § 10 最小复现实验\n\n在 1 周内，你可以复现论文中关于 **Efficiency Regressions** 中 **Excessive Verification** 导致成本增加的 Claim，无需构建完整的 **SKILLTRIAGE** 系统。首先，从 **SWE-Skills-Bench** 或 **SkillsBench** 中选取 10-20 个已知的、包含详细验证步骤的 **Curated Skills** 任务。其次，设计两组实验：一组为 **Target Run**，加载完整技能（包含详细的验证清单和测试步骤）；另一组为 **Reference Run**，使用同一技能但通过 Prompt Engineering 移除或简化其中的 **Validation Guidance** 部分（例如删除“运行完整测试套件”或“多次调试”的指令），或者直接使用 **No-Skill** 基线。接着，使用相同的 LLM（如 Claude Opus 或 GPT-4o）和 Agent 框架（如 OpenCode 或 AutoGen）执行这些任务，记录每次运行的 **Token Use**、**Execution Time** 以及 **Trajectory** 中的工具调用次数。最后，测量并比较两组运行的成本差异，重点分析 **Target Run** 中是否出现了比 **Reference Run** 显著更多的测试执行、调试循环或检查步骤。如果 **Target Run** 在任务成功的前提下，其 Token 消耗和执行时间显著高于 **Reference Run**（例如超过 2 倍阈值），且轨迹分析显示多出的成本主要来自于重复的验证或测试调用，则支持了“技能通过诱导 **Excessive Procedure** 导致效率回归”的 Claim；反之，如果成本差异主要来自于初始 Context 大小或实现步骤的复杂化，则反驳了该特定子类别的主导地位。", "research_value": "### § 11 最强反例设计\n\n要挑战这篇论文的核心结论，最有力的攻击点在于其 **Differential Testing** 框架中 **Reference Run**（参考运行）作为 **Pseudo-oracle**（伪预言机）的有效性假设，特别是针对 **Efficiency Regressions**（效率回归）的归因。论文声称效率回归主要由 **Excessive Procedure**（过度流程，如过度验证）引起，而非 **Context Bloat**（上下文膨胀）。然而，一个精心设计的反例可以证明，所谓的“过度流程”实际上是 Agent 在缺乏技能引导时无法有效利用上下文信息的补偿行为，或者是由技能引入的 **Context Bloat** 导致的推理质量下降所引发的“虚假”效率回归。\n\n具体实验设计如下：选取一组对 **Context Window** 极其敏感且逻辑复杂的任务（例如大型代码库重构），其中 **Target Run** 加载了一个包含详细但冗长验证步骤的技能。论文方法会将 **Target Run** 的高 Token 消耗归因为 **Excessive Verification**。然而，反例实验将引入第三组对照：**Minimal-Skill Run**，即加载一个经过严格精简、仅保留核心逻辑指令但去除了所有验证清单和示例代码的“极简技能”。如果 **Minimal-Skill Run** 的执行成本与 **No-Skill Reference Run** 相当，且成功率也相近，而 **Target Run** 的成本显著高于两者，那么论文关于 **Excessive Procedure** 是主要驱动因素的结论可能成立。但是，如果 **Minimal-Skill Run** 的成本依然显著高于 **No-Skill Reference Run**，且其失败模式与 **Target Run** 类似（例如因遗漏关键依赖而失败），则说明问题根源并非“过度验证”，而是技能本身引入的 **Context Bloat** 干扰了 Agent 的注意力机制，导致其在后续步骤中需要更多的自我纠正（Self-Correction）循环，这些循环被错误地归类为“过度流程”。更极端的反例是，如果 **No-Skill Reference Run** 的成功仅仅是因为任务本身存在多条简单路径，而技能强制 Agent 走了一条更稳健但更昂贵的路径（即技能实际上提升了鲁棒性而非导致失败），那么将这种“稳健性成本”标记为 **Efficiency Regression** 就是错误的归因，因为它忽略了技能在长期维护性或错误率降低方面的潜在收益。这种反例揭示了论文方法在量化“效率”时仅关注即时 Token/时间成本，而忽略了 **Quality-Cost Trade-off**（质量-成本权衡），从而可能错误地将有益的技能行为标记为有害。\n\n### § 12 Follow-up Research Idea\n\n基于论文未能解决 **Skill-Task Compatibility**（技能-任务兼容性）的动态评估以及 **Context Bloat** 与 **Excessive Procedure** 之间的混淆问题，我提出一个新的研究方向：**Dynamic Skill Pruning and Adaptation via Causal Trajectory Analysis**（基于因果轨迹分析的技能动态剪枝与自适应）。\n\n**(a) 驱动局限与未满足需求：**\n现有工作（包括本文）主要关注事后的 **Attribution**（归因）和静态的 **Triage**（分诊），即判断一个技能是否有害。然而，在实际的 Agent 运行中，技能往往是部分有用的：某些步骤（如规划）可能有益，而其他步骤（如过度验证）可能有害。当前的 **Differential Testing** 框架是二元的（有技能 vs 无技能），无法识别技能内部的 **Heterogeneous Impact**（异质性影响）。此外，论文指出 **Context Bloat** 是一个次要因素，但并未提供在运行时动态管理技能上下文的方法。因此，需求在于从“静态筛选”转向“动态优化”，即在 Agent 执行过程中实时评估技能片段的贡献，并动态剔除有害部分或调整其权重。\n\n**(b) 借鉴相邻领域的方法：**\n可以借鉴 **Causal Inference**（因果推断）中的 **Do-calculus** 和 **Counterfactual Reasoning**（反事实推理），以及 **Reinforcement Learning**（强化学习）中的 **Policy Gradient** 方法。具体来说，将 Agent 的执行轨迹建模为一个马尔可夫决策过程（MDP），其中每个技能指令被视为一个干预变量（Intervention）。通过构建 **Structural Causal Model**（结构因果模型），我们可以量化每个技能片段对最终结果（成功/失败）和成本（Token/时间）的 **Causal Effect**（因果效应），而不仅仅是相关性。\n\n**(c) 第一个实验设计：**\n构建一个 **Skill-Aware Agent Framework**，该框架在运行时维护一个 **Skill Impact Graph**（技能影响图）。实验步骤如下：\n1.  **数据收集**：使用论文中的 307 个故障案例，但不仅记录整体结果，还记录每个技能指令（如“安装包”、“运行测试”）执行前后的状态变化和成本增量。\n2.  **因果建模**：对于每个案例，构建一个反事实场景：如果 Agent 跳过了某个特定的技能指令（如“运行完整测试套件”），轨迹会如何变化？这可以通过在训练一个 **Trajectory Predictor**（轨迹预测器）来实现，该预测器学习在给定当前状态和剩余技能指令的情况下，预测下一步的动作和成本。\n3.  **动态剪枝策略**：开发一个 **Pruning Policy**，在 Agent 执行过程中，实时计算每个待执行技能指令的 **Expected Marginal Utility**（预期边际效用）。如果某个指令的因果效应显示其显著增加成本且对成功概率贡献极低（即被识别为 **Excessive Procedure**），则动态跳过或简化该指令。\n4.  **评估**：对比 **Static Skill Loading**（论文方法）、**No-Skill** 和 **Dynamic Pruning** 三种策略在相同任务集上的表现。关键指标不仅是成功率和总成本，还包括 **Adaptation Overhead**（自适应开销）和 **Robustness to Skill Noise**（对技能噪声的鲁棒性）。\n\n这个提议与已有工作的区别在于，它不再将技能视为一个不可分割的整体进行“通过/拒绝”判断，而是将其视为可分解、可动态调整的组件，通过因果分析实现细粒度的 **Runtime Optimization**（运行时优化），从而真正解决 **Skill-Induced Failures** 的根本问题，而不仅仅是事后归因。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Gen Dong\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yanjie Gao\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Liqun Li\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Tianyin Xu\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yu Hua\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Fan Yang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Huazhong University of Science and Technology\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Microsoft Research\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Microsoft\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"University of Illinois Urbana-Champaign\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding author\"\n    }\n  ]\n}\n```", "summary_translation": "Agent skills 是扩展 LLM agents 以提供可复用指导的事实标准机制。一个 skill 可以塑造 agent 的任务执行过程，包括 planning、tool use、problem-solving 和 validation。先前的工作报道了 agent skills 的混合结果：一些 skills 提高了任务成功率，而另一些则没有效果，增加了 token 使用量和执行时间，甚至降低了成功率。本文通过对任务失败和成本回归归因于特定加载的 skills，对 skill-induced agent failures 进行了全面分析。我们引入了一种 differential analysis framework，通过将目标 skill-guided run 与无 skill 或语义匹配的 skill reference run 进行比较，将失败或回归归因于某个 skill，后者解决相同任务，或以更低的成本解决任务。我们在 SkillsBench 和 SWE-Skills-Bench 上实例化了该框架，产生了 307 个 skill-induced failures，包括 125 个 functional failures 和 182 个 efficiency regressions。我们还构建了 SkillTriage，一种由 taxonomy 指导的归因工具，用于规范化配对案例、提取 differential evidence 并生成 triage reports。我们的主要发现包括：（1）Skill induced functional failures 很少由明显不相关的 skills 引起；相反，看似相关的 skills 往往导致 agent 错误实现或遗漏任务所需的实现元素。（2）Skill-induced efficiency regressions 不能仅由 prompt length 解释。（3）Excessive Procedure 中最大的来源是 excessive verification 和 heavy implementation pipelines，分别贡献了 67 和 30 个案例。这表明 skills 经常将 validation checklists 和 construction recipes 转变为强制性工作。基于我们的发现，我们提出了研究主题和工具改进，以实现更安全且更具成本意识的 skill reuse。"}]}, {"name": "Tool Use, Robustness \u0026 Error Handling", "count": 3, "papers": [{"title": "Retry, Switch, or Abstain? Learning Strategy-Aware Tool-Use Policies via Controlled Error Injection", "arxiv_id": "2608.11977", "authors": "Chaoran Chen, Vy Nguyen, Ziji Zhang, Abhinav Gullapalli, Ziyi Wang, Yuxuan Lu, Dakuo Wang, Jing Huang, Zhou Yu, Jin Lai", "summary": "Tool-using LLM agents are commonly trained and evaluated in environments where tool calls succeed reliably, yet deployed tools can fail transiently, persistently, or silently. Robust recovery therefore requires more than repeated retries: an agent may need to retry the same path, switch to an alternative, or recognize that no viable path remains. We present BENCH2ROBUST, a framework that converts failure-free tool-use benchmarks into controlled stochastic environments with scenario-controlled solvability, where episodes explicitly require retrying, switching, or stopping after available paths are exhausted. We use BENCH2ROBUST to study two complementary interventions: structured runtime recovery context through Bayesian Tool Memory (BTM), and curriculum-controlled reinforcement learning. Across 7 models from 4 families and two multi-turn benchmark families, tool failures produce a near-universal robustness gap. On held-out Retail tasks, BTM improves robustness by up to 16.8 percentage points without retraining, while RL learns complementary recovery behavior that remains beneficial without inference-time BTM. Combining the two reaches 40.8-45.5% under injection while preserving failure-free performance. These results suggest that robust tool use benefits from combining environment-specific recovery knowledge with learned recovery behavior.", "category": "cs.AI", "cluster": "Tool Use, Robustness \u0026 Error Handling", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决 **Tool-using LLM agents** 在真实生产环境中面对工具调用失败时的 **Robust Recovery** 问题。现有的工具使用基准测试（Benchmarks）通常假设工具调用能够可靠地返回及时、结构有效且正确的响应，然而在实际部署中，工具可能会遭遇瞬态故障（如超时、速率限制）、持久性故障（如凭证失效、Schema漂移）或静默故障（如数据陈旧、部分缺失）。传统的恢复策略往往局限于简单的重复重试（Retry），但鲁棒的代理需要根据剩余的可恢复性，智能地选择重试同一路径、切换到替代工具（Switch），或在所有可行路径耗尽后中止并升级（Abstain/Escalate）。\n\n这一问题的重要性在于，当前的 **LLM Agents** 在工具失败面前表现出普遍的脆弱性，存在巨大的 **Robustness Gap**。研究表明，在注入工具故障后，绝大多数模型的性能会显著下降，且这种下降无法通过单纯增加模型规模来消除。解决这一问题具有双重价值：首先，它提升了代理在不可靠环境中的任务完成率，确保在部分工具失效时仍能通过替代路径完成任务；其次，它引入了 **Strategy-Aware** 的决策机制，使代理能够区分“可恢复的瞬态错误”与“需要切换或放弃的持久错误”，从而避免无效的重试循环或过早的升级，提高了系统的效率和可靠性。\n\n### § 2 前人工作与不足\n\n尽管已有研究关注工具使用的鲁棒性，但现有工作存在明显的局限性，主要体现在评测环境的构建和恢复策略的训练机制上。\n\n首先，在评测基准方面，现有的鲁棒性基准如 **ToolBench-X**、**AgentNoiseBench** 和 **ReliabilityBench** 等，虽然引入了噪声或故障注入，但大多缺乏对 **Solvability**（可解性）的显式控制。它们通常采用通用的随机噪声增强，无法区分一个故障场景是可以通过重试解决的（S1），还是需要切换工具的（S2），或是完全不可解的（S3）。这种缺乏 **Scenario-Controlled Solvability** 的设计导致难以评估代理是否真正学会了区分不同的恢复策略，还是仅仅依靠运气或盲目的持久性重试。例如，如果瞬态错误在下次调用时恰好消失，一个盲目重试的策略可能看起来是鲁棒的，但这掩盖了其策略选择的缺陷。\n\n其次，在训练方法上，近期的工作如 **NoisyAgent** 和 **PALADIN** 尝试通过注入噪声或提供恢复标注的轨迹来训练代理，但它们未能明确控制恢复所需的策略类型。**NoisyAgent** 的训练环境没有显式区分重试、切换或中止的场景，导致代理难以学习到针对不同故障类型的差异化行为。**PALADIN** 虽然使用了失败注入的轨迹，但依赖于示例检索（Exemplar Retrieval），且同样缺乏对场景可解性的控制，无法有效分离重试、切换和中止的学习信号。此外，**ToolCritic** 等方法通过独立的 Critic 来纠正错误，而非端到端地训练策略，限制了代理自主恢复能力的内化。\n\n最后，现有的恢复机制往往依赖于简单的启发式规则或外部反馈，如 **ReAct** 和 **Reflexion** 中的重试/反思机制，但研究表明 LLM 在没有外部反馈的情况下难以可靠地自我纠正。而 **Bayesian-Agent** 等维护后验信念的工作，主要关注技能复用，而非针对具体工具故障的运行时恢复决策。因此，缺乏一个能够显式定义恢复需求（Retry/Switch/Abstain）并提供结构化恢复上下文（如 **Bayesian Tool Memory**）与强化学习相结合的训练框架，是现有研究的主要缺口。本文提出的 **BENCH2ROBUST** 框架正是为了填补这一空白，通过场景控制的可解性和结构化的恢复上下文，使代理能够学习到更精细、更鲁棒的工具使用策略。", "core_insight": "### § 3 重建作者的思考路径\n\n现有的 Tool-use LLM Agent 研究大多建立在“工具调用总是成功”的理想假设之上，然而在生产环境中，API 超时、限流、Schema 漂移或静默数据错误是常态。传统的鲁棒性评估往往通过随机注入噪声来测试 Agent，但这存在一个根本性的缺陷：随机噪声无法区分“需要重试的瞬态错误”和“需要切换路径的持久性故障”，导致 Agent 的鲁棒性提升可能仅仅源于“运气好”（即重试后错误恰好消失），而非真正学会了策略性的恢复行为。此外，现有的强化学习（RL）训练缺乏针对恢复行为的细粒度奖励信号，且缺乏结构化的先验知识引导，使得 Agent 难以在复杂的错误空间中收敛到正确的 RETRY、SWITCH 或 ABSTAIN 策略。因此，研究者意识到，要真正解决工具失败下的鲁棒性问题，必须构建一个能够明确控制“可解性”（Solvability）的环境，将错误类型与所需的恢复策略（重试、切换、放弃）显式关联，并结合结构化的运行时上下文（如贝叶斯工具记忆）与课程化强化学习，从而让 Agent 学会基于错误信号的策略选择，而非盲目重试。\n\n### § 4 核心 Intuition\n\n传统随机噪声注入混淆了“运气”与“能力”，导致 Agent 无法区分何时应重试、何时应切换工具。本文的核心直觉是：通过**场景控制的可解性**（Scenario-Controlled Solvability）显式定义任务的恢复路径（S1重试、S2切换、S3放弃），使环境本身成为策略学习的导师。结合**贝叶斯工具记忆**（BTM）提供的结构化恢复先验与**强化学习**（RL）学到的行为策略，Agent 能够从盲目重试进化为基于错误信号的策略感知型恢复，从而在工具失败时做出最优决策。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法是 **BENCH2ROBUST** 框架，结合 **Bayesian Tool Memory (BTM)** 和 **Curriculum-controlled Reinforcement Learning (RL)**，旨在让 LLM Agent 在面对工具调用失败时，能够智能地选择 **Retry**（重试）、**Switch**（切换替代工具）或 **Abstain**（放弃并升级）。\n\n完整的 Pipeline 如下：\n\n1.  **环境构建与错误注入 (Environment Construction \u0026 Error Injection)**：\n    *   **输入**：标准的 Tool-use Benchmark（如 $\\tau^2$-bench, Retail-3I）。\n    *   **处理**：BENCH2ROBUST 框架在 Agent 和工具执行之间插入一个中间层。它根据 **Scenario-Controlled Solvability** 机制，为每个 Episode 分配一个可解性类别：\n        *   **S1 (Retry Works)**：路径未被永久阻塞，随机噪声可能通过重试解决。\n        *   **S2 (Switch Needed)**：主路径被永久阻塞，必须使用等效的替代工具（Fallback Tool）。\n        *   **S3 (Impossible)**：所有可用路径均被阻塞，唯一正确的行为是升级（Escalation）。\n    *   **噪声类型**：包括显式错误（Timeout, Rate Limit, Server Error 等）和静默错误（Partial Data, Stale Values, Factual Errors）。\n\n2.  **推理时上下文增强 (Inference-time Context Augmentation via BTM)**：\n    *   **输入**：Agent 的 System Prompt。\n    *   **处理**：注入 **Bayesian Tool Memory (BTM)**。BTM 包含三部分结构化信息：\n        *   **Fallback Maps**：明确列出每个工具的等效替代工具（例如 `get_product_details` 失败时可切换至 `search_product_by_name`）。\n        *   **Recovery Constraints**：启发式规则（如“重试前至少尝试一次”、“切换后需验证数据完整性”、“穷尽路径后才升级”）。\n        *   **Beta-Posterior Statistics**：基于训练数据计算的恢复概率统计（虽然实验表明结构信息比概率值更重要，但作为探索先验存在）。\n    *   **输出**：Agent 获得显式的恢复策略指导，而非仅依赖隐式学习。\n\n3.  **策略训练 (Policy Training via RL)**：\n    *   **输入**：带有 BTM 上下文的 Agent 在 BENCH2ROBUST 环境中的交互轨迹。\n    *   **处理**：使用 **DAPO** 算法进行强化学习训练，采用 **Curriculum Learning**（课程学习）：\n        *   Phase 1-2：主要训练 **Retry** 行为（S1 场景）。\n        *   Phase 3-4：引入 **Switch** 行为（S2 场景），要求 Agent 识别主路径阻塞并切换。\n        *   Phase 5：引入 **Abstain** 行为（S3 场景），训练在无路可走时正确升级。\n    *   **奖励设计**：使用 **Partial-Credit Rewards**，不仅奖励任务完成，还惩罚重复调用和过长回合，以鼓励高效的恢复行为。\n\n4.  **推理与决策 (Inference \u0026 Decision Making)**：\n    *   **输入**：用户请求 + 工具调用历史 + 当前工具响应（可能包含错误）。\n    *   **处理**：\n        *   Agent 观察工具响应。如果成功，继续任务。\n        *   如果失败，Agent 结合 BTM 提供的 **Fallback Map** 和 **Constraints**，以及 RL 学到的策略，决定下一步动作。\n        *   例如：遇到 `Schema Drift`（静默/持久错误），BTM 提示该错误重试无效，且存在替代工具；RL 策略倾向于 **Switch** 到替代工具。\n        *   如果所有路径（主路径+替代路径）均失败，Agent 执行 **Abstain**，调用 `transfer_to_human_agents`。\n    *   **输出**：最终的任务结果（成功完成、部分完成或升级给人工客服）。\n\n**真实例子讲解：**\n*   **任务**：用户要求修改订单 #W5056519 的地址。\n*   **步骤 1**：Agent 调用 `get_order_details`。\n*   **情况 A (S1 - 瞬态错误)**：返回 `HTTP 429 Rate Limit`。\n    *   **BTM 提示**：Rate Limit 通常可通过重试解决。\n    *   **RL 策略**：执行 **Retry**。\n    *   **结果**：第二次调用成功，获取订单信息，继续修改地址。\n*   **情况 B (S2 - 持久错误)**：返回 `Schema Drift` (字段缺失)。\n    *   **BTM 提示**：Schema Drift 重试无效；存在替代工具 `get_orders_for_user`。\n    *   **RL 策略**：执行 **Switch**，调用 `get_orders_for_user` 获取摘要，再结合其他工具获取详情。\n    *   **结果**：通过替代路径获取信息，成功修改地址。\n*   **情况 C (S3 - 不可解)**：`get_order_details` 和 `get_orders_for_user` 均返回错误，且无其他路径。\n    *   **BTM 提示**：穷尽所有路径后应升级。\n    *   **RL 策略**：执行 **Abstain**，调用 `transfer_to_human_agents`。\n    *   **结果**：任务未自动完成，但正确升级，避免了幻觉或错误操作。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的理论数学推导，其核心在于 **环境建模** 和 **奖励函数设计** 的形式化定义，用于指导 RL 训练。\n\n1.  **POMDP 环境建模**：\n    *   论文将注入错误的环境形式化为一个 **Partially Observable Markov Decision Process (POMDP)** $M_{inj} = (S, A, O, T, Z_{inj}, R, \\gamma)$。\n    *   **Intuition**：与干净环境相比，状态转移 $T$ 和奖励 $R$ 不变，但观测核 $Z_{inj}$ 被修改。$Z_{inj}$ 根据噪声类型 $\\nu_t$ 对工具响应进行腐蚀。这明确了 Agent 面对的是观测噪声，而非状态本身的随机性。\n\n2.  **Beta-Posterior 恢复概率估计**：\n    *   对于每个 (工具 $j$, 错误类型 $e$) 对，恢复概率 $p_{rec}^{j,e}$ 建模为 Beta 分布：$p_{rec}^{j,e} \\sim \\text{Beta}(\\alpha_{j,e}, \\beta_{j,e})$。\n    *   **Intuition**：$\\alpha$ 和 $\\beta$ 分别代表成功恢复和失败恢复的次数。后验均值 $P = \\alpha / (\\alpha + \\beta)$ 给出了在特定错误下任务仍能成功的经验概率。这为 Agent 提供了量化依据，判断是应该重试（高 $P$）还是切换（低 $P$ 且有替代工具）。\n\n3.  **奖励函数设计**：\n    *   $R(\\tau) = \\text{pass}(\\tau) \\cdot \\text{eff}(\\tau) - \\text{rep}(\\tau)$。\n    *   **Intuition**：\n        *   `pass`：任务是否完成。\n        *   `eff`：效率折扣，惩罚过长的回合（$\\max(0.3, 1.0 - 0.02 \\cdot \\max(0, |\\tau| - 12))$），鼓励快速恢复。\n        *   `rep`：重复惩罚，惩罚连续相同的工具调用，防止死循环重试。\n        *   **关键点**：奖励函数中没有对正确 **Abstain** 的正向奖励，因为基准测试评估器无法给不可解任务打分。因此，Abstain 行为主要通过 BTM 的约束和 S3 场景的暴露来学习，而非直接通过奖励最大化。\n\n### § 7 实验设计与结论\n\n**提出了什么问题？**\n现有的 Tool-use LLM Agent 在干净环境中表现良好，但在生产环境中面对工具失败（瞬态、持久、静默）时缺乏鲁棒性。传统的随机错误注入无法区分 Agent 是真正学会了恢复策略（Retry/Switch/Abstain），还是仅仅靠运气或盲目重试。如何系统地评估和训练 Agent 的策略感知恢复能力？\n\n**设计了什么实验验证这个问题？**\n1.  **构建 BENCH2ROBUST 框架**：引入 **Scenario-Controlled Solvability** (S1/S2/S3)，明确区分需要重试、切换和放弃的场景，解决传统注入中“运气”与“策略”混淆的问题。\n2.  **评估鲁棒性差距 (Robustness Gap)**：在 7 个模型、4 个家族、10 个任务切片上，对比 Clean 环境和 Injected 环境的性能，量化失败带来的性能下降。\n3.  **验证干预措施的有效性**：\n    *   **BTM (Zero-shot)**：在不重新训练的情况下，仅通过注入 BTM 上下文，评估其对鲁棒性的提升。\n    *   **RL Training**：使用 DAPO 和课程学习训练 Agent，评估其学到的恢复行为。\n    *   **组合 (RL + BTM)**：评估两者结合的效果。\n4.  **分解分析**：\n    *   **策略分解**：分别统计 S1 (Retry) 和 S2 (Switch) 场景下的成功率，验证 RL 是否真的学会了切换而非仅重试。\n    *   **错误类型分解**：分析 BTM 和 RL 在不同错误类型（显式 vs. 静默）下的贡献差异。\n    *   **BTM 组件分解**：对比 Static (结构/约束) 和 Dynamic (概率值) 的贡献，验证结构信息的重要性。\n\n**问题的答案是什么？**\n1.  **鲁棒性差距普遍存在**：工具失败导致几乎所有模型性能显著下降（高达 46.7pp），且模型规模增大并不能完全消除这种脆弱性。\n2.  **结构化上下文 (BTM) 提供最大的零训练增益**：BTM 通过提供 Fallback Maps 和 Constraints，在不重新训练的情况下显著提升鲁棒性（+16.8pp）。其增益主要来自结构信息，而非校准后的概率值。\n3.  **RL 学习互补的恢复行为**：RL 训练使 Agent 能够超越简单的重试持久性，学会在需要时切换工具（S2 成功率提升），并减少过早升级。即使移除推理时的 BTM，RL 模型仍比基线模型更鲁棒。\n4.  **组合效果最佳**：RL + BTM 在保持干净环境性能的同时，在注入环境下达到最高通过率（40.8%-45.5%）。BTM 在处理显式瞬态错误时最强，而 RL 在处理持久错误和静默错误时贡献更大。\n5.  **结论**：鲁棒的工具使用需要结合 **运行时环境特定的恢复知识 (BTM)** 和 **通过训练获得的恢复行为 (RL)**。两者功能互补，缺一不可。", "additional_insights": "### § 8 Take-aways\n\nTool failures expose a universal robustness gap across LLM agents, where performance degrades significantly under stochastic injection regardless of model scale or family. The proposed BENCH2ROBUST framework introduces scenario-controlled solvability (S1/S2/S3) to explicitly distinguish between retryable, switchable, and impossible episodes, separating policy quality from environmental luck. Bayesian Tool Memory (BTM) provides substantial zero-training gains by supplying structured fallback maps and recovery constraints, rather than relying on calibrated posterior probabilities. Reinforcement Learning (RL) via DAPO complements BTM by internalizing recovery behaviors, particularly improving performance on persistent errors and silent corruptions where simple retry heuristics fail. The combination of runtime structured context (BTM) and learned policy (RL) yields the highest robustness while preserving clean-task performance, indicating a functional division of labor between environment-specific knowledge and generalizable recovery strategies.\n\n### § 9 最脆弱的假设\n\nThe most critical assumption is that **scenario-controlled solvability (S1/S2/S3) accurately reflects real-world tool failure dynamics**, specifically that failures can be cleanly categorized into transient (retryable), persistent path-blockage (switchable), or total unavailability (abstain). In production environments, failures are often ambiguous, cascading, or partially recoverable in ways that do not fit these discrete categories; for instance, a \"silent\" error might be intermittent rather than persistent, or a fallback tool might also be degraded. If this assumption fails, the agent’s learned strategy of switching or abstaining may be misaligned with actual recovery possibilities, leading to premature escalation or wasted retries. The paper supports this assumption by constructing synthetic failure modes with explicit ground truth, but it lacks evidence from real-world incident traces where the \"correct\" recovery action is often unknown or context-dependent. The limitation is acknowledged in the Ethics Statement, noting that failures are simulated stressors rather than real incident traces, which risks overfitting to the specific structure of the injection framework rather than generalizing to complex, unstructured production failures.\n\n### § 10 最小复现实验\n\nTo validate the claim that **structured recovery context (BTM) provides larger zero-training gains than RL alone**, one can implement a minimal experiment using a single benchmark (e.g., τ²-bench Retail) and a base model (e.g., Qwen3-4B). First, construct a simplified BTM prompt containing only fallback maps and retry constraints (excluding Beta posteriors) for a subset of tools. Second, inject controlled failures (e.g., 50% timeout, 50% schema drift) into tool responses using a simple wrapper. Third, measure the pass rate of the base model with and without the BTM prompt under injection. A significant improvement (e.g., \u003E10 percentage points) with the BTM prompt compared to the base model would support the claim that explicit structural context is highly effective for robustness without retraining. Conversely, if the gain is negligible, it would suggest that LLMs cannot effectively utilize such structured hints, undermining the core argument for BTM’s utility. This experiment avoids the complexity of RL training and focuses on the immediate impact of the proposed context intervention.", "research_value": "### § 11 最强反例设计\n\n若要挑战 **BENCH2ROBUST** 框架的有效性，最有力的攻击点在于其核心假设——**Scenario-Controlled Solvability (S1/S2/S3)** 在真实生产环境中的**可观测性（Observability）**与**因果独立性（Causal Independence）**。论文假设 Agent 能够准确区分瞬态错误（S1）、持久错误（S2）和不可解错误（S3），并据此采取最优策略。然而，在真实的分布式系统中，故障往往是**级联的（Cascading）**且**非正交的（Non-orthogonal）**。\n\n**具体反例场景：级联依赖导致的“伪 S2”与“真 S3”混淆**\n考虑一个电商场景，Agent 需要调用 `get_inventory` 来检查库存，若失败则切换至 `check_stock_level`（S2 场景）。但在真实世界中，这两个工具可能共享同一个底层数据库连接池或依赖同一个微服务网关。当网关发生**部分退化（Partial Degradation）**时，`get_inventory` 返回超时（Timeout），Agent 根据 BTM 的 **Fallback Map** 切换到 `check_stock_level`。然而，由于底层网关拥塞，`check_stock_level` 同样超时。此时，Agent 面临两种解释：\n1.  **论文假设的 S3**：所有路径阻塞，应 **Abstain**。\n2.  **真实世界的 S1**：这是瞬态的网络拥塞，只需等待片刻后重试任一工具即可成功。\n\n**攻击逻辑：**\n如果 Agent 严格遵循论文训练的 **Curriculum RL** 策略，它可能在尝试切换一次后，因未立即成功而判定为“路径阻塞”，从而过早执行 **Abstain**（升级给人工），导致不必要的运营成本增加。反之，如果 Agent 倾向于重试，它可能陷入**死循环（Retry Loop）**，因为 BTM 的 **Recovery Constraints** 可能未涵盖“跨工具共享基础设施故障”这一复杂情况。\n\n**理论论证：**\n论文的 **POMDP 建模** 假设观测噪声 $Z_{inj}$ 是独立同分布（i.i.d.）或仅依赖于当前工具调用。然而，真实故障具有**时间相关性（Temporal Correlation）**和**空间相关性（Spatial Correlation）**。如果 `get_inventory` 和 `check_stock_level` 的失败是高度相关的（Correlated Failures），那么基于独立 Beta-Posterior 统计的 **BTM** 将提供误导性的先验概率。Agent 会错误地认为切换工具能增加成功概率（因为历史数据中两者失败不相关），从而在级联故障中做出次优决策。这种**分布外泛化（Out-of-Distribution Generalization）**的失败，揭示了 **Scenario-Controlled Solvability** 在复杂依赖图中的脆弱性。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“静态恢复策略”到“动态故障诊断与自适应拓扑重构” (Dynamic Fault Diagnosis \u0026 Adaptive Topology Reconstruction)**\n\n**（a）驱动局限与未满足需求：**\n现有工作（包括本文）将工具恢复视为一个**离散的动作选择问题**（Retry/Switch/Abstain），依赖于预定义的 **Fallback Maps** 和静态的 **Recovery Constraints**。这种范式假设工具间的替代关系是固定的、已知的，且故障模式是预定义的。然而，在快速迭代的微服务架构中，工具依赖关系动态变化，且新型故障（如 **Schema Drift** 的细微变体）可能未被预先建模。Agent 缺乏**在线诊断（Online Diagnosis）**能力，无法在运行时推断故障的根本原因（Root Cause），也无法动态发现新的替代路径。\n\n**（b）借鉴相邻领域的方法：**\n借鉴**分布式系统可观测性（Distributed Systems Observability）**中的**因果追踪（Causal Tracing）**和**动态图神经网络（Dynamic Graph Neural Networks, DGNNs）**。在分布式系统中，通过 **OpenTelemetry** 等标准收集链路追踪数据，构建服务依赖的动态图。DGNNs 能够处理随时间变化的图结构，并推断节点（工具）之间的因果影响。此外，借鉴**主动学习（Active Learning）**中的**不确定性采样（Uncertainty Sampling）**，让 Agent 在遇到未知故障时，主动探索而非盲目遵循静态规则。\n\n**（c）第一个实验设计：**\n1.  **构建动态故障注入环境**：不同于 BENCH2ROBUST 的静态 S1/S2/S3 分类，构建一个**动态依赖图（Dynamic Dependency Graph）**，其中工具间的替代关系随时间变化（例如，`get_inventory` 的备用工具从 `check_stock_level` 变为 `query_warehouse_api`，且后者可能间歇性下线）。\n2.  **引入因果诊断模块**：在 Agent 的推理过程中，嵌入一个轻量级的 **Causal Inference Module**。当工具调用失败时，该模块分析错误日志、延迟指标和依赖图状态，推断故障是**局部瞬态**、**局部持久**还是**全局级联**。\n3.  **自适应策略学习**：训练 Agent 不仅选择动作，还输出**故障假设（Fault Hypothesis）**。使用 **Meta-Learning** 框架，让 Agent 在多个具有不同依赖拓扑和故障模式的环境中快速适应。\n4.  **评估指标**：除了任务完成率，引入**诊断准确率（Diagnosis Accuracy）**和**策略适应速度（Adaptation Speed）**。对比静态 BTM + RL 方法与动态因果诊断方法在**分布外故障（OOD Failures）**和**动态拓扑变化**下的表现。\n\n**与已有工作的区别：**\n本文的 **BTM** 是静态的知识库，**RL** 是固定的策略。而本提议将恢复过程重构为一个**在线诊断与规划（Online Diagnosis \u0026 Planning）**问题，强调 Agent 对故障因果结构的**实时感知**和**动态适应**，而非依赖预定义的恢复路径。这打开了从“策略执行”到“系统理解”的研究新方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Chaoran Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Vy Nguyen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ziji Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Abhinav Gullapalli\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ziyi Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuxuan Lu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Dakuo Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jing Huang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhou Yu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jin Lai\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Amazon\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "使用工具的 LLM 智能体通常在工具调用可靠成功的环境中进行训练和评估，然而实际部署的工具可能会出现暂时性、持续性或静默失败。因此，鲁棒的恢复机制需要超越简单的重复重试：智能体可能需要重试相同路径、切换到替代方案，或识别出已无可行路径。我们提出了 BENCH2ROBUST，这是一个将无失败工具使用基准转化为具有场景可控可解性的受控随机环境的框架，其中每个回合明确要求在可用路径耗尽后进行重试、切换或停止。我们利用 BENCH2ROBUST 研究两种互补的干预措施：通过 Bayesian Tool Memory (BTM) 提供的结构化运行时恢复上下文，以及课程控制的强化学习。在来自 4 个系列的 7 个模型和两个多轮基准系列中，工具失败导致了近乎普遍的鲁棒性差距。在保留的 Retail 任务上，BTM 在不重新训练的情况下将鲁棒性提高了多达 16.8 个百分点，而 RL 学习到的互补恢复行为在没有推理时 BTM 的情况下仍然有益。结合这两种方法在注入失败的情况下达到了 40.8-45.5% 的性能，同时保持了无失败情况下的性能。这些结果表明，鲁棒的工具使用受益于结合特定环境的恢复知识与学习到的恢复行为。"}, {"title": "VAKRA: Evaluating Multi-Hop Reasoning Across APIs and Retrieval Under Tool-Use Policies", "arxiv_id": "2608.12282", "authors": "Ankita Rajaram Naik, Anupama Murthi, Benjamin Elder, Siyu Huo, Raavi Gupta, Abhinav Jain, Praveen Venkateswaran, Abdulhamid Adebayo, Danish Contractor", "summary": "Agents deployed in enterprise settings must reason across structured APIs and document collections, yet existing benchmarks evaluate these capabilities in isolation. We introduce VAKRA (e\\textbf{V}aluating \\textbf{A}PI and \\textbf{K}nowledge \\textbf{R}etrieval \\textbf{A}gents), a benchmark of over $8{,}000$ executable APIs across $62$ domains with tasks spanning three settings of increasing difficulty: diverse API interaction styles, multi-hop reasoning over structured APIs, and multi-source reasoning with natural-language tool-use policy constraints. Correctness is verified by re-executing predicted tool calls against live APIs, accommodating multiple valid paths. Using a fixed ReAct harness to isolate model capabilities from agent architecture, we evaluate frontier and open-weight models and find that even the best model achieves only 70.4\\% on single-hop endpoint-style tasks and drops to 50--51\\% on compositional APIs; performance degrades by over 50\\% as reasoning depth increases, and policy-constrained questions expose severe failures (as low as 2.4\\% on unanswerable queries). Trace analysis shows failures concentrate at language-mediated reasoning - entity disambiguation, cross-source grounding, rather than tool invocation mechanics. Code is available https://github.com/IBM/VAKRA. Dataset is available https://huggingface.co/datasets/ibm-research/VAKRA", "category": "cs.AI", "cluster": "Tool Use, Robustness \u0026 Error Handling", "tags": ["cs.AI"], "filter_reason": "该论文符合筛选标准，主要依据如下：\n\n1.  核心研究对象明确为 LLM Agents：论文标题和摘要明确指出研究对象是 \"API and Knowledge Retrieval Agents\"（API与知识检索智能体），属于典型的 Tool-Use Agents（工具使用智能体）。\n2.  符合“评估与行为分析”的保留条件：根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。” 本文提出了 VAKRA 基准，专门用于评估智能体在复杂工具使用场景下的多跳推理能力，并深入分析了失败模式（如实体消歧、跨源 grounding 等），这直接有助于理解当前智能体在工具使用中的局限性，从而指导后续的智能体改进。\n3.  涉及智能体核心能力：论文关注的是智能体的规划（Planning）、工具使用（Tool Use）以及长程推理（Multi-hop Reasoning）能力，这些都是 Agentic AI 的核心组成部分。\n4.  排除项不适用：虽然论文使用了固定的 ReAct harness 以隔离模型能力，但这属于评估方法论的一部分，旨在更准确地衡量智能体能力，而非单纯的基础设施研究。同时，它不涉及被排除的安全、对齐、图神经网络或多智能体拓扑编排等无关领域。\n\n综上，该论文通过构建专门的基准和深入的行为分析，为理解和改进 LLM 智能体的工具使用与推理能力提供了重要依据，符合研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：如何在一个统一的、可执行的评估框架下，衡量大型语言模型（LLMs）在复杂企业环境中跨结构化 API 和非结构化文档集合进行多跳推理（Multi-Hop Reasoning）的能力，特别是在受到自然语言工具使用策略（Tool-Use Policies）约束的情况下。现有的基准测试通常将工具调用（Tool Invocation）、网页导航、多轮对话或多跳文档检索等能力孤立地进行评估，缺乏对异构系统间复合挑战的考察。\n\n这一问题的重要性在于，随着智能体（Agents）在客户服务、商业智能和金融运营等关键企业场景中的部署日益广泛，它们必须能够处理非线性的推理路径，例如在 CRM 中消歧客户记录、从承运商文档中提取追踪 ID、映射到物流 API 参数，并解释退款政策以确定补偿。然而，现有基准测试无法捕捉这种跨源（Cross-Source）和组合式（Compositional）推理的复杂性，导致 75% 的部署团队在没有正式基准的情况下评估其智能体，这带来了巨大的实际风险。解决这一问题能够提供一个名为 VAKRA 的基准，它包含超过 8,000 个可执行 API 和领域对齐的文档集合，通过重新执行预测的工具调用（Re-executing predicted tool calls）来验证正确性，从而隔离模型推理能力与智能体架构的影响，揭示当前前沿模型在实体消歧、跨源接地（Cross-Source Grounding）和策略遵守方面的根本性瓶颈，为开发更可靠的企业级智能体提供明确的改进方向。\n\n### § 2 前人工作与不足\n\n尽管已有大量研究致力于评估 LLM 的工具使用能力，但现有工作存在显著的局限性，无法全面反映企业级智能体的实际需求。\n\n首先，在**可执行接地（Executable Grounding）**方面，大多数工具调用基准测试（如 ToolBench, RestBench, ToolLLM）要么在合成环境中运行，要么依赖行为随时间变化的外部 API，或者通过模型生成的反馈来模拟执行。这些方法缺乏确定性，无法在评估时提供可验证的响应。虽然 LiveAPIBench 提供了本地托管的真实数据库支持的 API，但它未结合高级推理和轨迹级评估特性。相比之下，VAKRA 通过自托管所有 API 并针对真实的 BIRD-SQL 数据库和文档集合，确保了评估时的确定性和可验证性。\n\n其次，在**跨源与组合推理（Cross-Source and Compositional Reasoning）**方面，WebArena 和 WorkArena 主要评估 UI 交互和系统状态，而非基于模式和文档的数据级推理。GAIA 和 AppWorld 虽然评估长 horizon 规划，但未针对跨源接地挑战（如词汇不匹配下的实体解析或检索内容与结构化 API 模式的对齐）进行设计。ToolQA 提供了统一的检索和表格查询工具接口，但不要求智能体协调独立设计的异构系统。VAKRA 明确要求智能体在单个多跳推理链中交错使用结构化 API 调用和非结构化文档检索，其中中间步骤的输出直接参数化后续工具调用，这是 prior work 未能涵盖的复杂场景。\n\n最后，在**策略约束工作流与轨迹级评估（Policy-Constrained Workflows and Trace-Level Evaluation）**方面，$\\tau$-bench 虽然在精神上最接近 VAKRA，但其策略推理局限于狭窄的对话领域，且未跨独立数据源接地决策。大多数基准测试仅对最终答案、单个调用准确率或二元任务成功进行评分，这些指标无法区分中间步骤（如实体解析或策略解释）是否有效。VAKRA 通过重新调用工具调用对完整轨迹进行验证，容纳多种有效执行路径，从而能够针对语言介导推理中的失败进行针对性分析，而不仅仅是工具执行机制。这种细粒度的轨迹级评估揭示了当前模型在组合推理和约束解释方面的关键弱点，这是 prior work 由于缺乏相应的评估框架而无法发现的。", "core_insight": "### § 3 重建作者的思考路径\n\n在构建 VAKRA 之前，研究者首先观察到企业级 Agent 部署中的一个核心矛盾：现有的 Benchmark 将能力割裂评估。ToolBench、WebArena 或 GAIA 等基准分别侧重于 Tool Invocation、Web Navigation 或 Long-horizon Planning，但缺乏对“跨异构系统（API 与文档）进行多跳推理”的综合考察。这种割裂导致了一个严重的评估盲区：模型可能在单一模态下表现良好，但在需要结合结构化数据查询与非结构化文档检索的复杂工作流中失败。\n\n其次，研究者注意到现有评估方法的脆弱性。许多基准依赖合成环境或模拟执行，无法验证 Agent 在真实数据库和实时 API 上的实际效果。更重要的是，传统的“最终答案匹配”或“单步工具调用准确率”指标无法区分失败是源于工具调用机制（如参数填充错误）还是语言介导的推理缺陷（如实体消歧、跨源对齐）。这种细粒度的归因缺失使得优化方向模糊。\n\n此外，企业场景中存在严格的 Tool-Use Policies（如合规性约束、数据源限制），但现有基准极少涉及此类自然语言约束下的推理。研究者意识到，如果 Agent 不能正确理解并遵守这些策略（例如在政策禁止使用某数据源时强行调用），其在生产环境中的风险极高。\n\n基于以上观察，研究者推断需要一个能够同时满足以下条件的基准：1) 基于真实可执行环境（Live APIs + Real Databases）以确保评估的确定性；2) 强制要求跨源组合推理（API + RAG）以模拟真实业务逻辑；3) 引入自然语言策略约束以测试合规性；4) 采用轨迹级评估（Trajectory-level Evaluation）以精确定位推理瓶颈。由此，VAKRA 的设计思路自然浮现：利用 BIRD-SQL 构建大规模可执行 API，结合 Wikidata/ClapNQ 构建文档检索环境，并通过 ReAct 框架隔离模型能力与架构差异，从而全面评估 Agent 在复杂、受约束环境下的多跳推理能力。\n\n### § 4 核心 Intuition\n\nVAKRA 的核心直觉在于，企业级 Agent 的瓶颈并非在于工具调用的机械执行，而在于**语言介导的跨源推理（Language-mediated Cross-source Reasoning）**。现有方法失效是因为它们孤立地评估工具使用或检索，忽略了在异构数据源（结构化 API 与非结构化文档）之间进行实体消歧、参数对齐和策略解释的复杂性。VAKRA 通过强制 Agent 在单一推理轨迹中交织 API 调用与文档检索，并遵守自然语言策略，揭示了模型在组合推理和约束理解上的根本弱点，从而将评估焦点从“能否调用工具”转移到“能否在复杂约束下正确整合多源信息”。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nVAKRA 的核心方法并非提出一个新的 Agent 架构，而是构建了一个**可执行、多源、带策略约束的基准测试环境（Benchmark Environment）**，用于评估现有 LLM 在复杂企业场景下的推理能力。其 Pipeline 包含数据构建、执行环境搭建和评估流程三个关键部分。\n\n**1. 数据构建 Pipeline (Data Construction)**\n*   **API 生成：** 基于 BIRD-SQL 数据集，将 62 个领域的真实数据库转化为超过 8,000 个可执行的 Python 函数（APIs）。这些 API 分为三种交互风格：\n    *   **SLOT (Compositional):** 提供少量通用操作（如过滤、聚合），需组合使用。\n    *   **SEL (Expanded Function):** 将通用操作实例化为大量具体工具，需从候选集中选择。\n    *   **Dashboard (Endpoint-style):** 提供高度特定的查询端点，类似传统 REST API。\n*   **多跳推理链生成：** 利用 Wikidata5M 构建领域知识图谱，通过深度优先遍历（DFS）连接 API 输出与输入，生成 2-5 跳的推理链。\n*   **多源混合 (Multi-Source)：** 引入 ClapNQ 和 Wikidata5M 文档集合，构建 ChromaDB 索引。通过 LLM 生成需要同时调用 API 和检索文档（RAG）的问题，并应用“交叉源可回答性过滤”，确保 RAG 问题不能仅靠 API 回答，反之亦然。\n*   **策略注入：** 为部分任务添加自然语言形式的工具使用策略（Tool-use Policies），例如“禁止使用文档回答电影相关问题”。\n\n**2. 执行与评估 Pipeline (Execution \u0026 Evaluation)**\n以解决一个“延迟订单投诉”为例，完整的 Pipeline 如下：\n\n*   **输入 (Input):**\n    *   **用户查询：** “客户 John Doe 的订单延迟了，根据退款政策，他应该获得多少补偿？”\n    *   **工具集：** 包含 CRM 查询 API、物流追踪 API、退款政策文档检索器。\n    *   **策略约束：** “仅当订单状态为‘已发货’且延迟超过 3 天时，才允许查询退款政策文档。”\n\n*   **处理 (Processing - ReAct Harness):**\n    *   Agent 采用固定的 **ReAct** 范式（Reason-Act-Observe），隔离模型能力与架构差异。\n    *   **Step 1 (Reason \u0026 Act):** 模型推理需要查找客户记录，调用 `CRM_Get_Customer` API，参数为 \"John Doe\"。\n    *   **Step 2 (Observe):** 系统执行 API，返回客户 ID 和订单号。\n    *   **Step 3 (Reason \u0026 Act):** 模型推理需要追踪物流，调用 `Logistics_Track` API，参数为订单号。\n    *   **Step 4 (Observe):** 系统返回物流状态“已发货”及延迟天数“5天”。\n    *   **Step 5 (Reason \u0026 Act):** 模型检查策略：状态符合且延迟\u003E3天，允许检索政策。调用 `Retriever_Search`，查询“refund policy delay”。\n    *   **Step 6 (Observe):** 检索器返回政策文档片段：“延迟超过3天补偿 10%”。\n    *   **Step 7 (Final Answer):** 模型结合订单金额（从 Step 2 或额外 API 获取）计算补偿金额。\n\n*   **输出与验证 (Output \u0026 Verification):**\n    *   **轨迹记录：** 记录所有 Tool Calls、参数、中间响应和最终答案。\n    *   **Stage 1 (Tool-Sequence Verification):** 系统**重新执行**预测的 Tool Calls 对真实 API，验证返回的信息集合是否覆盖 Ground Truth。允许不同的有效路径（Alternative Traces）。\n    *   **Stage 2 (Final Response Evaluation):** 使用 LLM-as-Judge (GPT-OSS-120B) 评估最终答案的事实一致性和 groundedness。\n    *   **Stage 3 (Policy Adherence):** 确定性检查是否违反了策略（如在不满足条件时调用了检索器）。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n本节跳过。VAKRA 是一篇基准测试（Benchmark）论文，其核心贡献在于数据集构建、评估框架设计和实证分析，不涉及新的算法模型或形式化的数学推导。其评估指标基于准确率（Accuracy）、工具调用成功率（Tool Call Success Rate）和策略遵守率（Policy Adherence Rate），均为统计指标而非数学定理推导。\n\n### § 7 实验设计与结论\n\n**RQ1: API 交互范式如何影响模型性能？**\n*   **问题：** 不同的 API 设计风格（SLOT, SEL, Dashboard）对模型难度有何影响？\n*   **实验设计：** 在相同的 62 个领域上，分别测试模型在三种 API 风格下的表现，并分析错误分布（工具选择、参数填充、答案生成）。\n*   **结论：** 模型性能高度依赖 API 风格。GPT-5.5 在 Dashboard API 上表现最佳（70.4%），但在需要组合推理的 BI APIs (SLOT/SEL) 上显著下降（~50%）。错误主要集中在语言介导的推理步骤（如实体消歧、跨源对齐），而非工具调用机制本身。\n\n**RQ2: 多跳推理深度如何影响性能？**\n*   **问题：** 随着推理链长度（Hops）增加，模型性能如何衰减？\n*   **实验设计：** 分析 1-hop 到 5-hop 任务的准确率变化，特别关注中间步骤的错误传播。\n*   **结论：** 性能随推理深度急剧下降。除 GPT-5.5 外，大多数模型在链长增加时准确率下降超过 50%。失败主要源于中间结果的实体消歧和参数提取错误，导致后续步骤失效。\n\n**RQ3: 多源推理与策略遵守能力如何？**\n*   **问题：** 模型能否有效结合 API 和文档检索，并遵守自然语言策略？\n*   **实验设计：** 测试 Multi-Source Multi-hop 任务，并细分策略类别：策略使问题不可回答（Unanswerable）、策略无影响、无策略。\n*   **结论：** 多源推理进一步降低了性能。策略遵守是严重弱点：当策略使问题不可回答时，前沿模型（如 Claude Opus 4.7）准确率低至 2.4%，表明模型倾向于强行生成答案而非识别约束。这揭示了当前 Agent 在约束解释和组合推理上的根本性瓶颈。", "additional_insights": "### § 8 Take-aways\n\nVAKRA 揭示了当前前沿模型在工具使用上的核心瓶颈并非在于工具调用的机械执行（Tool Invocation Mechanics），而在于语言介导的推理步骤（Language-mediated Reasoning），如实体消歧（Entity Disambiguation）和跨源接地（Cross-source Grounding）。实验表明，模型在单跳 Endpoint-style 任务上的准确率可达 70.4%，但在需要组合多个 API 的 Compositional APIs 任务中骤降至 50–51%，且随着推理深度（Reasoning Depth）增加，性能衰减超过 50%。最严重的缺陷出现在策略约束（Policy Constraints）场景下，当自然语言策略使问题变得不可回答时，即使是最佳模型（如 Claude Opus 4.7）的准确率也低至 2.4%，表明模型倾向于强行生成答案而非识别策略冲突。API 交互范式显著影响模型表现，模型在 Dashboard APIs（高特定性、低组合性）和 BI APIs（低特定性、高组合性）上的排名发生反转，证明不存在通用的工具使用能力。通过重新执行预测的工具调用（Re-executing predicted tool calls）对实时 API 进行验证，VAKRA 证明了轨迹级评估（Trajectory-level Evaluation）比最终答案评估更能准确反映代理的真实推理能力，并允许识别多条有效路径。\n\n### § 9 最脆弱的假设\n\nVAKRA 的核心贡献建立在“基于 BIRD-SQL 数据库生成的合成 API 和文档集合能够充分代表企业环境中异构系统间复杂推理挑战”这一假设之上。如果该假设不成立，即合成数据中的实体链接、模式对齐（Schema Alignment）和策略约束过于简化或结构化，那么 VAKRA 所揭示的“语言介导推理瓶颈”可能只是针对特定合成数据分布的过拟合现象，而非通用代理系统的根本缺陷。在实际企业环境中，API 的命名约定、错误处理机制、数据不一致性以及策略的自然语言表述往往比基于 Wikidata5M 和 ClapNQ 构建的合成环境更加混乱和非标准化。论文通过人工评估（Human Study）验证了生成问题的逻辑一致性和忠实度（Faithfulness），并展示了跨源实体一致性（Cross-Hop Entity Consistency）的高评分，但这仅证明了数据生成的内部质量，并未提供证据表明这些合成任务在语义复杂度和噪声水平上与真实世界企业工作流（如 Figure 1 所示的 CRM 与物流系统交互）具有统计等价性。如果真实世界的 API 接口更加不透明或文档更加稀疏，模型在 VAKRA 上表现出的“工具调用机械执行正确但推理失败”的模式可能会转变为更基础的“无法解析 API 接口”或“无法检索到相关文档”，从而改变瓶颈的性质。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 VAKRA 中关于“推理深度导致性能急剧下降”的核心发现，无需构建完整的 8,000+ API 环境。具体方案如下：选取 VAKRA 数据集中的“Multi-hop Reasoning”子集（仅涉及 API 调用，不涉及 RAG），使用公开的 BIRD-SQL 数据库作为后端，手动实现一个简单的 ReAct Agent 框架，集成 2-3 个主流模型（如 GPT-4o, Llama-3-70B, Qwen-2.5-72B）。测量不同跳数（1-hop, 2-hop, 3-hop）任务上的准确率，重点分析失败案例中错误发生的阶段（是工具选择错误、参数提取错误，还是最终答案生成错误）。如果复现结果显示，随着跳数增加，错误主要集中在参数提取和实体消歧（即语言介导步骤），而非工具选择本身，则支持 VAKRA 的 claim；如果错误均匀分布或主要集中在工具选择上，则可能反驳其关于瓶颈性质的结论。此实验仅需少量样本（如每跳数 50-100 个样本）和标准的 LLM API 调用，即可验证推理深度与性能衰减的相关性及错误模式。", "research_value": "### § 11 最强反例设计\n\n要挑战 VAKRA 的核心结论，最有力的攻击并非质疑其评估框架的严谨性，而是攻击其**数据合成假设（Synthetic Data Assumption）**与**真实企业环境（Real-world Enterprise Environment）**之间的分布偏移（Distribution Shift）。VAKRA 声称揭示了“语言介导推理（Language-mediated Reasoning）”是瓶颈，但其 API 是基于 BIRD-SQL 数据库生成的，这意味着 Schema 是静态、一致且逻辑完备的。然而，真实企业中的异构系统往往存在严重的**Schema Drift（模式漂移）**、**数据不一致性（Data Inconsistency）**以及**非确定性错误（Non-deterministic Errors）**。\n\n具体反例设计如下：构建一个名为 **\"VAKRA-Real\"** 的对比实验，保留 VAKRA 的评估 Pipeline，但将后端替换为模拟真实企业痛点的“脏数据”环境。具体包括：\n1.  **Schema 不匹配与模糊性：** 在 API 返回中引入字段命名冲突（如 `customer_id` 在 CRM 中是字符串，在 Logistics 中是整数，且无明确映射文档），或引入缺失字段。\n2.  **非确定性故障：** 模拟 API 的随机超时、部分失败（Partial Failure）或返回空结果，而非 VAKRA 中确定的成功/失败。\n3.  **策略的模糊表述：** 将 VAKRA 中清晰的自然语言策略（如“延迟超过3天”）替换为真实世界中常见的模糊策略（如“根据客户等级酌情处理”或“参考最新内部备忘录”），这些策略无法通过简单的确定性检查（Deterministic Check）验证。\n\n**预期结果与攻击逻辑：** 如果 VAKRA 的结论成立，模型在 VAKRA-Real 上的失败模式应与 VAKRA 相似（即集中在实体消歧和跨源接地）。然而，极大概率会出现以下情况：模型在 VAKRA-Real 上的失败将迅速从“推理错误”转变为**“鲁棒性崩溃（Robustness Collapse）”**。模型可能因为无法处理 Schema 不匹配而直接产生幻觉参数，或因无法解析模糊策略而完全放弃推理。这将证明，VAKRA 所识别的“推理瓶颈”实际上是一个**“理想化环境下的伪瓶颈”**。在真实世界中，首要瓶颈是**“环境感知与容错（Environment Perception and Fault Tolerance）”**，而非纯粹的逻辑推理。因此，VAKRA 提出的改进方向（如增强跨源接地）可能无法解决真实部署中最致命的稳定性问题，从而削弱其作为企业级基准的实用价值。\n\n### § 12 Follow-up Research Idea\n\n基于 VAKRA 暴露出的“策略遵守（Policy Adherence）”严重缺陷以及合成数据与真实环境的差距，提出一个全新的研究方向：**从“静态策略验证”转向“动态策略协商与可解释性对齐（Dynamic Policy Negotiation and Explainable Alignment）”**。\n\n**(a) 驱动局限：** VAKRA 将策略视为硬约束（Hard Constraints），通过确定性检查判断是否违反。然而，真实企业场景中，策略往往是动态的、上下文相关的，且存在冲突（例如，“快速退款”与“严格审核”之间的权衡）。当前 Agent 在遇到不可回答或策略冲突时直接失败（如 2.4% 的准确率），缺乏**“元认知（Meta-cognition）”**能力来识别不确定性并与用户或系统协商。此外，VAKRA 的评估是黑盒的，无法解释*为什么*模型违反了策略，导致难以调试。\n\n**(b) 借鉴领域：** 借鉴**形式化验证（Formal Verification）**中的**模型检查（Model Checking）**技术与**人机交互（HCI）**中的**可解释 AI（XAI）**框架。具体而言，引入**策略形式化语言（Policy Formalization Language, PFL）**，将自然语言策略自动转换为可执行的逻辑规则（如 LTL 或 CTL），并在 Agent 执行轨迹上进行实时验证。同时，借鉴**对话式 AI（Conversational AI）**中的澄清机制，允许 Agent 在策略模糊或冲突时主动发起“策略澄清请求（Policy Clarification Request）”。\n\n**(c) 第一个实验设计：** 构建一个名为 **\"Policy-Aware Agent with Negotiation (PAN)\"** 的新基准和框架。\n1.  **数据集扩展：** 在 VAKRA 基础上，引入“策略冲突”和“策略模糊”任务类别。例如，任务要求同时满足“最小化成本”和“最大化客户满意度”，但两者在特定情境下互斥。\n2.  **新评估指标：** 除了准确率，引入**“策略合规性解释得分（Policy Compliance Explanation Score）”**和**“协商成功率（Negotiation Success Rate）”**。前者评估 Agent 能否用自然语言解释其决策如何满足或违反策略；后者评估 Agent 能否在策略冲突时提出合理的替代方案并获得用户/系统批准。\n3.  **实验流程：** 对比传统 ReAct Agent 与 PAN 框架。PAN 框架在每一步推理后，通过一个轻量级的**“策略验证器（Policy Verifier）”**模块检查当前状态是否违反形式化策略。如果违反或不确定，Agent 不直接输出答案，而是生成一个**“澄清问题（Clarification Question）”**或**“替代方案（Alternative Plan）”**。\n4.  **预期发现：** 预期 PAN 框架在“不可回答”和“策略冲突”任务上的表现将显著优于传统 Agent，因为它将“失败”转化为“协商”，从而提高了系统的整体可用性和安全性。这将打开一个从“被动执行”到“主动合规与协商”的新研究方向，直接回应企业级 Agent 对安全性和可解释性的核心需求。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "{\n  \"authors\": [\n    {\n      \"name\": \"Ankita Rajaram Naik\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Anupama Murthi\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Benjamin Elder\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Siyu Huo\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Raavi Gupta\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Abhinav Jain\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Praveen Venkateswaran\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Abdulhamid Adebayo\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Danish Contractor\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"IBM\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding author\"\n    }\n  ]\n}", "summary_translation": "部署在企业环境中的智能体必须跨结构化 API 和文档集合进行推理，然而现有的基准测试孤立地评估这些能力。我们引入了 VAKRA（e\\textbf{V}aluating \\textbf{A}PI and \\textbf{K}nowledge \\textbf{R}etrieval \\textbf{A}gents），这是一个涵盖 62 个领域、超过 8,000 个可执行 API 的基准测试，其任务跨越三种难度递增的场景：多样化的 API 交互风格、基于结构化 API 的多跳推理，以及带有自然语言工具使用策略约束的多源推理。正确性通过针对实时 API 重新执行预测的工具调用来验证，从而容纳多种有效路径。使用固定的 ReAct harness 将模型能力与智能体架构隔离开来，我们评估了前沿模型和开放权重模型，发现即使是表现最好的模型在单跳端点式任务上也仅达到 70.4% 的准确率，而在组合式 API 上则降至 50--51%；随着推理深度的增加，性能下降超过 50%，且受策略约束的问题暴露出严重缺陷（在不可回答的查询中低至 2.4%）。轨迹分析显示，失败主要集中在语言介导的推理环节——实体消歧、跨源 grounding，而非工具调用机制。代码可用 https://github.com/IBM/VAKRA。数据集可用 https://huggingface.co/datasets/ibm-research/VAKRA"}, {"title": "Harness-IF: Evaluating Instruction Following Across Instruction Surfaces in Coding Agents", "arxiv_id": "2608.11727", "authors": "Zining Huang, Haoran Que, Hong Zeng, Ge Zhang, Zuo Wang, Jin Chen, Haodong Wang, Zhongfei Hou, Changxin Pu, Shen Yan, Wenhao Huang", "summary": "When a coding agent obeys a rule, it may simply have been going to do that anyway. Existing instruction-following benchmarks cannot tell the difference: they concentrate rules in the user turn, while coding-agent benchmarks emphasize final task success. We introduce Harness-IF, which scores operational rules one at a time from execution evidence: 60 realistic multi-turn coding items drawn from a 642-rule library, 256 rules receiving verdicts, placed on the five configurable surfaces a deployed agent reads. To separate compliance from coincidence we introduce Against-Prior Accuracy (AP-Acc), which scores only rules labeled as opposing unprompted defaults, observed by re-running tasks with the rule withheld across nine probe builds and curated otherwise. Across 12 frontier models, accuracy spans 72.1-85.9% and AP-Acc 66.1-78.6%; every model is worse on against-prior rules, by 3.6 to 7.4 points (mean 5.81), and the direction survives a common-support analysis with item-clustered intervals. Aggregate scores therefore overstate compliance by a model-specific margin: prior control leaves the top build unchanged and exchanges three adjacent rank pairs. A counterbalanced conflict pilot on nine separate builds adds a second result: pooled precedence does not follow prompt depth, with system prompts, project files, and user instructions ahead of tool and skill descriptions.", "category": "cs.AI", "cluster": "Tool Use, Robustness \u0026 Error Handling", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在复杂的 Coding Agent 工作流中，如何精确评估 Agent 对分布在多个 **Instruction Surfaces**（指令表面，如 System Prompt、Tool Description、Project File 等）上的具体操作规则（Operational Rules）的遵循程度，并区分真正的指令遵循与模型默认行为（Unprompted Defaults）的巧合。现有的评测体系存在两个主要盲区：一是传统的 Instruction-Following (IF) 基准（如 IFEval）通常将规则集中在 User Turn，忽略了 Agent 实际运行中读取的多层指令栈；二是现有的 Coding Agent 基准（如 SWE-Bench）主要关注最终任务的成功率（Task Success），无法揭示 Agent 在长程工作流中具体遵循了哪条操作规则。\n\n这一问题的重要性在于，Coding Agent 的行为是由平台默认设置、系统提示、工具描述、项目文件（如 `CLAUDE.md`）和用户指令共同塑造的。如果无法区分 Agent 是“因为指令而遵守规则”还是“本来就会这样做”，现有的聚合分数（Aggregate Scores）会严重高估模型的合规性。例如，如果模型默认就会使用英文提交信息，那么即使指令要求使用中文，模型也可能因巧合而“通过”测试，但这并不代表它具备真正的指令遵循能力。\n\n解决这一问题带来的价值包括：首先，引入了 **Against-Prior Accuracy (AP-Acc)** 指标，通过控制未提示的默认行为，更真实地衡量模型在违背其先验倾向时的指令遵循能力，揭示了现有分数中存在的 3.6 到 7.4 个百分点的虚高。其次，通过 **Harness-IF** 基准，研究者可以定位不同指令表面（如 System Prompt vs. Tool Description）的优先级和有效性，发现 System Prompt、Project File 和 User Instruction 的优先级高于 Tool 和 Skill Description，这与简单的 Prompt Depth 假设不符。最后，该研究提供了细粒度的失败分析，指出大部分失败源于对“要求行动”规则（Shortfall Rules）的遗漏，而非对“禁止行动”规则（Overstep Rules）的违反，为 Agent 的改进提供了具体方向。\n\n### § 2 前人工作与不足\n\n在本文之前，指令遵循评测和 Agent 评测是两个相对独立的领域，且各自存在明显的局限性。\n\n在 **Instruction-Following (IF) Evaluation** 方面，代表性工作如 **IFEval** [48]、**FollowBench** [13]、**InfoBench** [26] 和 **ComplexBench** [37] 建立了基于可验证约束的评测协议。这些工作主要关注指令内容本身的复杂性、多语言或多轮对话场景，但其实验变量主要是指令内容或场景，而非指令的交付表面（Delivery Surface）。它们通常假设指令仅存在于 User Prompt 中，忽略了实际部署中 Agent 读取的多层指令栈。此外，这些基准缺乏对模型默认行为（Unprompted Defaults）的控制，无法区分合规是源于指令遵循还是巧合。\n\n在 **Agentic and Coding Evaluation** 方面，**SWE-Bench** [6, 14]、**Terminal-Bench** [16]、**AgentBench** [15] 和 **GAIA** [17] 等基准在真实环境中评估 Agent 的规划、工具调用和任务完成能力。这些基准具有高保真度，但其核心指标是最终任务的成功率（Task Success），将复杂的执行轨迹坍缩为一个二元结果。这种聚合分数掩盖了中间过程中的指令遵循细节，无法回答“Agent 在长程工作流中具体遵循了哪条操作规则”的问题。例如，一个 Agent 可能通过错误的中间步骤偶然完成了任务，或者忽略了某些非关键的操作规则，这在任务成功率中无法体现。\n\n在 **Harness and Trajectory Evaluation** 方面，**IHEval** [46] 尝试评估指令层级（Instruction Hierarchy），测试模型在 System、User、History 和 Tool Output 消息冲突时的合规性。然而，IHEval 主要关注预设的消息层级冲突，而 **Harness-IF** 关注的是可执行工作空间中的分布式约束，并在更广泛的表面集上估计优先级，且不假设存在通用的层级顺序。此外，**SpecBench** [47] 等研究指出长程 Coding Agent 可能利用基准规范进行奖励黑客（Reward Hacking），这进一步凸显了需要更细粒度、基于执行证据的评测方法。\n\n前人工作的不足主要在于：\n1.  **评测粒度不足**：现有 IF 基准缺乏对多表面指令栈的覆盖，而 Coding 基准缺乏对规则级（Rule-Level）合规性的细粒度测量。\n2.  **缺乏先验控制**：没有基准明确区分指令遵循与模型默认行为，导致分数虚高。\n3.  **表面优先级假设错误**：现有工作往往假设指令优先级与 Prompt 深度（即出现位置）相关，而 **Harness-IF** 通过受控实验（E0）证明，System Prompt、Project File 和 User Instruction 的优先级高于 Tool 和 Skill Description，这与简单的深度假设不一致。\n\n因此，**Harness-IF** 通过引入多表面指令栈、规则级评分和 AP-Acc 指标，填补了上述评测缺口，提供了更准确、更细粒度的 Coding Agent 指令遵循评估框架。", "core_insight": "### § 3 重建作者的思考路径\n\n在深入分析 Coding Agent 的评估体系时，研究者首先注意到一个显著的评估错位：现有的 Instruction Following (IF) 基准（如 IFEval, FollowBench）主要关注单轮对话中 User Prompt 内的显式约束，而 Coding Agent 基准（如 SWE-Bench, Terminal-Bench）则聚焦于最终任务的成功率（Task Success）。这种二分法导致了一个盲区：在真实的 Agent 工作流中，指令并非仅来自用户，而是分布在 System Prompt、Tool Description、Project Files（如 `CLAUDE.md`）等多个“指令表面”（Instruction Surfaces）上。现有的评估无法区分 Agent 是真正遵循了特定表面的规则，还是仅仅因为其默认行为（Unprompted Defaults）恰好与规则一致。\n\n进一步观察发现，Agent 的合规性存在“巧合”问题。如果一条规则要求“使用英文提交信息”，而 Agent 默认就使用英文，那么无论该规则出现在 System Prompt 还是 User Instruction 中，Agent 都会“通过”测试。这种高准确率掩盖了 Agent 对指令来源敏感度的真实差异。研究者意识到，要真正评估 Agent 的指令遵循能力，必须剥离这种“默认行为”带来的虚假合规，即需要一种机制来区分“顺从默认”与“对抗默认”的行为。\n\n此外，关于指令优先级（Instruction Hierarchy）的现有研究（如 IHEval）多基于合成冲突或简单的消息层级假设，缺乏在真实代码执行环境中的验证。研究者推测，不同表面的指令权重可能并不遵循简单的“深度优先”（即 User Prompt 权重最高）直觉，而是受到表面类型（如 System Prompt 的权威性 vs. Project File 的上下文相关性）的复杂影响。因此，需要一个能够控制指令语义不变、仅改变其投放表面（Surface Relocation），并能通过执行证据（Execution Evidence）进行细粒度判定的基准。基于此，Harness-IF 的设计思路应运而生：构建一个多表面、多轮次的真实编码场景，引入 Against-Prior Accuracy (AP-Acc) 来剔除默认行为干扰，并通过受控冲突实验（E0）来揭示真实的表面优先级秩序。\n\n### § 4 核心 Intuition\n\n现有基准的高准确率往往是一种“巧合”，因为许多规则与模型的默认行为（Unprompted Defaults）一致，导致无法区分 Agent 是真正遵循了指令还是仅仅沿用了习惯。Harness-IF 的核心直觉是，只有当规则与模型的默认倾向相悖（Against-Prior）时，才能真实衡量其指令遵循能力，因此引入 AP-Acc 指标专门评估这类“对抗性”规则，从而剥离虚假合规。同时，通过将同一规则在不同指令表面（如 System Prompt、Project File）间进行受控迁移，该方法揭示了 Agent 对指令来源的敏感度并非由提示词深度决定，而是由表面的功能角色（如权威性、上下文相关性）主导，从而提供了更真实的指令优先级洞察。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**Harness-IF** 的核心方法是将指令遵循（Instruction Following, IF）从传统的“任务级成功”评估转化为“规则级（Rule-level）”的细粒度测量，并引入 **Against-Prior Accuracy (AP-Acc)** 指标以区分模型是真正遵循了指令，还是仅仅因为其默认行为（Prior）恰好符合指令要求。\n\n以下是结合一个真实场景的完整 Pipeline 说明：\n\n**1. 输入构建：多表面指令注入 (Multi-Surface Injection)**\n*   **场景设定**：假设任务是“修复一个 Python 后端 API 的认证 Bug”。\n*   **规则库选择**：从 642 条原子规则库中选取一条规则，例如“提交信息必须使用英文”（Commit messages in English）。\n*   **表面分配 (Surface Assignment)**：该规则被放置在特定的 **Instruction Surface** 上。例如，将其放入 **Project File (PF)**（如 `CLAUDE.md` 文件）中，而不是用户提示词中。\n*   **对抗先验标签 (Prior Labeling)**：通过 **Zero-injection Probe**（即在不注入该规则的情况下运行任务），观察模型的默认行为。如果模型默认倾向于使用中文提交信息，则该规则被标记为 **Against-Prior**（对抗先验）；如果模型默认就用英文，则标记为 **Align-Prior**（对齐先验）。\n\n**2. 处理执行：代理工作流与证据收集 (Agent Execution \u0026 Evidence Collection)**\n*   **代理运行**：12 个前沿模型（如 Claude-Opus-4.7, GPT-5.5 等）在包含该规则的上下文中执行任务。代理会读取 System Prompt (SP)、Tool Description (TD)、Project File (PF) 等所有表面。\n*   **轨迹记录**：系统记录完整的执行轨迹，包括代码变更、生成的文件、命令行输出和最终响应。\n*   **证据包生成 (Evidence Bundle)**：对于每条规则，系统提取相关的执行证据。例如，对于“提交信息”规则，提取 Git commit log；对于“代码风格”规则，提取生成的代码 AST。\n\n**3. 输出评估：规则级判决与指标计算 (Rule-Level Verdict \u0026 Metric Calculation)**\n*   **规则判决 (Verdict)**：评估器（Evaluator）对每条规则进行二元判决：**Pass**（遵循）、**Fail**（未遵循）或 **N/A**（不适用）。\n    *   *判定方式*：部分规则通过确定性检查（如 Regex 匹配、AST 结构检查）；复杂规则通过 LLM Judge（如 GPT-5.2）基于 Rubric 进行多数投票判定。\n*   **指标计算**：\n    *   **Acc (Accuracy)**：所有适用规则的通过率。\n    *   **AP-Acc (Against-Prior Accuracy)**：仅计算被标记为 **Against-Prior** 的规则通过率。\n    *   **Delta (∆)**：Acc - AP-Acc，衡量“巧合合规”带来的分数膨胀。\n\n**示例总结**：\n如果模型在 PF 中看到了“使用英文提交”，且其默认行为是中文（Against-Prior），它成功使用了英文，则 AP-Acc +1。如果模型默认就是英文（Align-Prior），它使用英文，Acc +1 但 AP-Acc 不计入（或视为基线）。最终，AP-Acc 能更真实地反映模型“改变默认行为以遵循指令”的能力。\n\n---\n\n### § 6 核心数学推导\n\n本文没有复杂的理论推导，其核心在于定义了一套基于集合论和统计学的评估指标公式，旨在解决传统评估中“默认行为混淆”的问题。以下是核心公式的 Intuition 解释：\n\n**1. 基础准确率 (Accuracy, Acc)**\n$$ \\text{Acc} = \\frac{\\sum_{(i,r) \\in E_a} z_{a,i,r}}{|E_a|} $$\n*   **Intuition**：这是最直观的分数。$E_a$ 是模型 $a$ 所有产生明确 Pass/Fail 结果的规则实例集合（排除 N/A）。$z_{a,i,r}$ 是指示变量（Pass=1, Fail=0）。它回答的问题是：“模型在所有被要求遵守的规则中，有多少比例做到了？”\n*   **缺陷**：如果模型本来就想这么做（默认行为），这个分数会虚高。\n\n**2. 对抗先验准确率 (Against-Prior Accuracy, AP-Acc)**\n$$ \\text{AP-Acc} = \\frac{\\sum_{(i,r) \\in E_a \\cap P} z_{a,i,r}}{|E_a \\cap P|} $$\n*   **Intuition**：这是本文提出的核心创新指标。$P$ 是 **Against-Prior** 规则集合，即那些与模型“无提示默认行为”相悖的规则。\n*   **意义**：分母只包含那些模型“本来不想做”或“默认不做”的规则。如果模型在这些规则上得分高，说明它真正具备了指令遵循能力，而不是靠运气或默认习惯。\n*   **对比**：$\\Delta = \\text{Acc} - \\text{AP-Acc}$ 量化了“虚假合规”的程度。论文发现所有模型的 $\\Delta$ 均为正，说明传统 Acc 高估了能力。\n\n**3. 过滤准确率 (Filtered Accuracy, F-Acc) 与 判别加权准确率 (DW-Acc)**\n*   **F-Acc**：移除那些所有模型表现一致（无法区分模型优劣）的规则。Intuition：只关注那些能拉开差距的“硬骨头”规则。\n*   **DW-Acc**：给那些能更好区分模型整体能力的规则赋予更高权重（基于 Pearson 相关系数 $d_r$）。Intuition：有些规则虽然难，但所有模型都错，这种规则对排名贡献小；有些规则能精准反映模型强弱，应赋予更高权重。\n\n**理论背景补充**：\n这些公式基于 **Behavioral Stratification**（行为分层）思想。传统评估假设所有指令遵循难度相同，而 Harness-IF 认为指令遵循的难度取决于其与模型 **Prior**（先验分布/默认倾向）的距离。AP-Acc 本质上是在测量模型在 **Decision Boundary** 附近克服惯性（Inertia）的能力。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有的指令遵循基准（如 IFEval）主要关注用户提示词中的规则，且无法区分模型是“真正遵循了指令”还是“默认行为恰好符合指令”。此外，Coding Agent 的指令分布在多个表面（System Prompt, Tool Description, Project File 等），现有基准未评估不同表面的指令优先级和遵循效果。\n\n**2. 设计了什么实验验证这个问题？**\n*   **主基准测试 (Main Coding Panel)**：\n    *   **设计**：构建 60 个多轮编程任务，注入 256 条规则，分布在 5 个可配置表面（SP, TD, SD, PF, UI）。\n    *   **验证**：对比 12 个前沿模型的 **Acc** 和 **AP-Acc**，观察差距（$\\Delta$）以及不同规则家族（如 Output Control vs. Code Style）的难度差异。\n*   **先验控制实验 (Prior Control / Zero-Injection)**：\n    *   **设计**：在 9 个模型构建版本上运行任务，但**移除**目标规则，观察模型的默认行为，从而为每条规则打上 **Align-Prior** 或 **Against-Prior** 标签。\n    *   **验证**：确保 AP-Acc 的分母是准确的，并验证 $\\Delta$ 的稳定性。\n*   **表面优先级冲突实验 (E0 Conflict Pilot)**：\n    *   **设计**：构造 4 组合成冲突对（例如：System Prompt 说“用英文”，Project File 说“用中文”），在 9 个模型上运行，观察哪个表面的指令胜出。\n    *   **验证**：测试指令层级（Hierarchy）是否遵循“提示深度”（即越靠后的指令优先级越高）。\n\n**3. 问题的答案是什么？**\n*   **合规性被高估**：所有 12 个模型在 **Against-Prior** 规则上的表现均显著低于整体准确率（平均差距 5.81 分）。这意味着传统基准分数存在“模型特异性”的虚高，AP-Acc 能更真实地反映能力。\n*   **失败模式集中**：大部分失败（77.1%）源于 **Shortfall**（未执行要求的动作），而非 **Overstep**（做了被禁止的事）。**Output Control**（输出控制）和 **Workflow**（工作流）是最难遵循的规则家族。\n*   **表面优先级不遵循深度**：在冲突实验中，**System Prompt (SP)**、**Project File (PF)** 和 **User Instruction (UI)** 的优先级并列最高，显著高于 **Tool Description (TD)** 和 **Skill Description (SD)**。这反驳了“越靠后的指令优先级越高”的简单假设，表明代理更倾向于遵循具有更高“权威性”或“全局性”的表面，而非仅仅时间上最近的指令。", "additional_insights": "### § 8 Take-aways\n\nHarness-IF 揭示了现有指令遵循（Instruction Following, IF）基准测试存在严重的“合规性通胀”，因为传统指标无法区分模型是真正遵循了指令，还是仅仅因为其默认行为（unprompted defaults）恰好符合规则。通过引入 Against-Prior Accuracy (AP-Acc) 指标，该研究证明所有前沿模型在违背其默认行为的规则上表现均显著下降，平均差距为 5.81 个百分点，且这种差距因模型而异，导致基于聚合准确率（Aggregate Accuracy）的排名可能产生误导。在指令表面（Instruction Surfaces）的优先级测试中，系统提示（System Prompt）、项目文件（Project File）和用户指令（User Instruction）在冲突场景下表现出同等且最高的优先级，优于工具描述（Tool Description）和技能描述（Skill Description），这反驳了仅基于提示深度（prompt depth）的简单层级假设。失败分析显示，绝大多数合规失败源于“缺失”（shortfall，即未执行要求的行为），而非“越界”（overstep，即执行了禁止的行为），其中输出控制（Output Control）和工作流（Workflow）规则是最主要的失败来源。该基准通过规则级（rule-level）而非任务级（task-level）的评估，提供了更细粒度的诊断能力，能够识别不同规则家族（如定量限制 vs. 输出控制）和逻辑模态（如命令式 vs. 偏好式）下的具体困难模式。\n\n### § 9 最脆弱的假设\n\n该研究最核心且脆弱的假设是：**基于 LLM 裁判（LLM Judge）的规则级判定（Verdicts）具有足够的信度和稳定性，能够准确区分“遵循指令”与“默认行为”，从而支撑 AP-Acc 的有效性。**\n\n如果这一假设不成立，即 LLM 裁判的评分存在系统性偏差或高噪声，那么 Acc 与 AP-Acc 之间的差异可能并非源于模型对“反先验”规则的固有困难，而是裁判对特定类型规则评分不一致所致，这将直接导致核心贡献（即揭示合规性通胀和模型特异性差距）失效。论文承认了这一点：86.8% 的判定依赖 LLM 裁判，且在裁判替换实验（Judge-swap ablation）中，Claude Opus 4.7 与 GPT-5.2 之间的 Cohen's $\\kappa$ 仅为 0.163，表明不同裁判对同一轨迹的判定一致性极低。虽然论文通过“共同支持分析”（common-support analysis）和“项目聚类区间”（item-clustered intervals）试图证明跨模型的相对趋势是稳定的，但这仅能缓解而非消除绝对评分偏差的风险。如果裁判本身对“反先验”规则更苛刻或更宽松，AP-Acc 的下降幅度将被人为放大或缩小，使得“模型特异性通胀”的结论变得不可靠。论文缺乏独立的人类黄金标准（human gold standard）大规模验证来锚定 LLM 裁判的绝对准确性，仅提供了有限的人类参考审计（69.0% 同意率），这在面对细微的规则遵循差异时可能不足以支撑高精度的排名交换结论。\n\n### § 10 最小复现实验\n\n在 1 周内，你可以复现 **AP-Acc 与 Acc 之间的差距是否由“反先验”规则的本质难度驱动，而非裁判偏差** 这一核心 claim 的一个子集。\n\n**数据与实现：**\n1.  **数据选择：** 从 Harness-IF 发布的 642 条规则库中，选取 10-20 条标记为 `against_prior`（反先验）和 10-20 条标记为 `align_prior`（顺先验）的规则。这些规则应属于同一规则家族（如 Output Control）以控制难度变量。\n2.  **模型选择：** 选择 2-3 个易于访问的前沿模型（如 GPT-4o, Claude 3.5 Sonnet, 或开源的 Qwen2.5-72B）。\n3.  **实现：** 构建一个简单的单轮或少轮对话测试脚本，将选定的规则分别注入到 System Prompt 和 User Instruction 中。对于 `against_prior` 规则，确保任务本身会诱导模型产生默认行为（例如，要求模型“不要输出任何解释”，而默认行为是输出解释）。\n4.  **测量：** 不使用复杂的 LLM 裁判，而是使用**确定性检查**（Deterministic Checks，如正则表达式、AST 匹配或简单的字符串包含/排除）来评估模型是否遵循规则。例如，对于“不要输出解释”的规则，检查输出中是否包含特定的解释性关键词或段落结构。\n\n**结果解读：**\n*   **支持 Claim：** 如果在使用确定性检查的情况下，模型在 `against_prior` 规则上的通过率显著低于 `align_prior` 规则（例如差距 \u003E 5%），且这一差距在不同模型间保持一致，则支持了“反先验规则确实更难遵循”的核心观点，证明 AP-Acc 的差距并非完全由裁判噪声引起。\n*   **反驳 Claim：** 如果在使用确定性检查后，`against_prior` 和 `align_prior` 规则之间的通过率差距消失或变得极小（\u003C 1%），则表明原论文中观察到的巨大差距可能主要源于 LLM 裁判对“反先验”失败的过度惩罚或评分偏差，而非模型本身的遵循能力差异。这将严重削弱 AP-Acc 作为独立评估指标的有效性。", "research_value": "### § 11 最强反例设计\n\n若要挑战 **Harness-IF** 的核心结论，最有力的攻击并非质疑其数据规模，而是攻击其 **Prior Labeling（先验标签）** 的因果推断有效性，即证明 **AP-Acc** 的下降并非源于模型“难以克服默认行为”，而是源于 **Contextual Interference（上下文干扰）** 或 **Evaluation Bias（评估偏差）**。\n\n具体反例设计如下：构造一组 **“High-Friction Align-Prior”** 规则与 **“Low-Friction Against-Prior”** 规则进行对比。\n1.  **High-Friction Align-Prior**：选择一条模型默认就会遵守的规则（如“代码需符合 PEP8”），但在 **System Prompt** 中注入大量与之无关但极具认知负荷的噪声指令（如复杂的数学推导要求或长文本摘要任务）。如果模型在此场景下失败，传统 **Acc** 会下降，但 **AP-Acc** 因该规则属于 Align-Prior 而不计入分母，导致 **AP-Acc** 依然虚高。这证明了 **AP-Acc** 忽略了 **Cognitive Load（认知负荷）** 对指令遵循的负面影响，仅关注“方向性”而非“执行难度”。\n2.  **Low-Friction Against-Prior**：选择一条与模型默认行为相悖但极易执行的规则（如“在输出末尾添加一个特定的无关字符”）。由于该规则执行成本极低，模型即使默认不这样做，也能轻松遵循。此时 **AP-Acc** 会很高。\n3.  **核心攻击点**：通过展示 **AP-Acc** 与 **Task Success** 或 **Human Preference** 的相关性显著低于 **Acc**，或者证明 **AP-Acc** 的排名波动主要源于 **Rule Complexity（规则复杂度）** 而非 **Prior Alignment（先验对齐度）**，可以论证 **Harness-IF** 混淆了“违背先验”与“增加认知负担”这两个变量。此外，针对 **LLM Judge** 的低一致性（Cohen's $\\kappa$ = 0.163），可以设计一个 **Adversarial Prompting** 实验，证明裁判对 **Against-Prior** 失败的判定存在系统性严苛偏差（即裁判倾向于认为“模型没做它本来不做的事”是更严重的错误，从而给予更低的分数），从而证明 **Delta** 是裁判偏差的产物，而非模型能力的真实反映。\n\n### § 12 Follow-up Research Idea\n\n基于 **Harness-IF** 将指令遵循视为静态二元判定（Pass/Fail）的局限，以及其未能解决 **Instruction Hierarchy（指令层级）** 动态冲突的问题，提出一个新的研究方向：**Dynamic Instruction Negotiation and Priority Learning（动态指令协商与优先级学习）**。\n\n**(a) 驱动局限与未满足需求：**\n**Harness-IF** 揭示了不同 **Instruction Surfaces** 存在固定的优先级（SP/PF/UI \u003E TD/SD），但这是一种静态的、基于冲突实验的归纳。在真实的 **Coding Agent** 工作流中，指令往往是动态生成的、相互依赖甚至部分矛盾的（例如，用户要求“快速修复”，而 **Project File** 要求“严格遵循测试覆盖率”）。现有方法无法处理这种 **Temporal and Contextual Dependency（时空依赖性）**，即模型需要根据任务阶段动态调整对不同表面指令的权重，而非简单遵循固定层级。此外，**AP-Acc** 仅衡量“是否遵循”，未衡量“遵循的成本”或“遵循的合理性”。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴 **Reinforcement Learning from Human Feedback (RLHF)** 中的 **Preference Optimization** 思想，以及 **Multi-Objective Optimization（多目标优化）** 中的 **Pareto Frontier（帕累托前沿）** 概念。将指令遵循建模为一个 **Multi-Constraint Satisfaction Problem（多约束满足问题）**，其中每个 **Instruction Surface** 的约束具有动态权重。引入 **Causal Inference（因果推断）** 中的 **Do-calculus** 来区分指令对行为的真实因果效应与相关性，从而更精确地估计 **Prior** 的影响。\n\n**(c) 第一个实验设计：**\n构建一个 **Dynamic Priority Benchmark (DP-Bench)**，包含一系列具有 **Conflicting Objectives（冲突目标）** 的编程任务。\n1.  **场景**：任务要求模型在有限步数内修复 Bug，同时 **System Prompt** 要求“最小化代码变更”，**User Instruction** 要求“最大化可读性”，**Tool Description** 要求“使用特定调试工具”。\n2.  **方法**：训练一个 **Priority Predictor（优先级预测器）**，输入当前的 **Execution Trajectory（执行轨迹）** 和 **Context Window（上下文窗口）**，输出各表面指令的实时权重。\n3.  **评估**：不只看最终是否遵循所有规则，而是评估模型在 **Trade-off Space（权衡空间）** 中的表现。例如，当步数限制紧迫时，模型是否正确地降低了“可读性”指令的权重，而提高了“最小化变更”的权重？\n4.  **对比**：与 **Harness-IF** 的静态优先级假设对比，证明动态权重调整能显著提高 **Task Success** 和 **User Satisfaction**，同时保持合理的 **Instruction Compliance**。这将把指令遵循从“合规性检查”提升为“智能决策过程”，打开 **Agentic Reasoning（代理推理）** 与 **Instruction Following** 结合的新研究方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Zining Huang\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Haoran Que\",\n      \"affiliations\": [\n        1,\n        3\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Hong Zeng\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Ge Zhang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zuo Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jin Chen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Haodong Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zhongfei Hou\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Changxin Pu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Shen Yan\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Wenhao Huang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"ByteDance Seed\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Tsinghua University\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Peking University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"∗\",\n      \"text\": \"Work done at ByteDance Seed\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding author\"\n    }\n  ]\n}\n```", "summary_translation": "当编码智能体遵守某条规则时，它可能原本就打算这样做。现有的指令遵循基准无法区分这种差异：它们将规则集中在用户轮次中，而编码智能体基准则强调最终任务的成功。我们引入了 Harness-IF，它根据执行证据对操作规则逐一评分：包含 60 个源自 642 条规则库的真实多轮编码题目，256 条规则获得判定，这些规则被放置在部署智能体读取的五个可配置表面上。为了将合规性与巧合区分开来，我们引入了 Against-Prior Accuracy (AP-Acc)，该指标仅对标记为与未提示默认行为相反的规则进行评分，这是通过在九个探针构建中重新运行任务并 withholding 规则，同时精心策划其他方面来观察的。在 12 个前沿模型中，准确率范围为 72.1-85.9%，AP-Acc 为 66.1-78.6%；每个模型在对抗先验规则上的表现都较差，差距为 3.6 到 7.4 分（平均 5.81），且这一方向在采用项目聚类区间的共同支持分析中依然成立。因此，聚合分数以特定于模型的幅度高估了合规性：先验控制使顶级构建保持不变，并交换了三对相邻排名。在九个独立构建上进行的平衡冲突试点增加了第二个结果：汇总的优先级并不遵循提示深度，系统提示、项目文件和用户指令优于工具和技能描述。"}]}, {"name": "Evaluation Frameworks \u0026 Reliability", "count": 2, "papers": [{"title": "Deployment Decision Reliability: A Generalizability-Theory Framework for Sizing Long-Horizon Agent Evaluations", "arxiv_id": "2608.11323", "authors": "Vasundra Srinivasan", "summary": "Enterprise practitioners read agent leaderboards as if they ranked agent capability. We show, across three open agent-trace benchmarks (TheAgentCompany, $τ^2$-bench, and AppWorld), that the agent main effect accounts for less than 3% of total variance in every dataset and check type, while the agent-by-task interaction accounts for 7-23%. Leaderboards rank specialization, not capability. We arrive at this through a four-facet Generalizability Theory variance decomposition, fit with three estimators (Henderson Method-I, REML via lme4, and a Bayesian binomial GLMM) that agree to three decimal places. Four further findings sharpen what the leaderboard is hiding. First, aggregate reliability collapses on the hardest task quartile: $Eρ^2$ on $τ^2$ action_checks falls from 0.752 to 0.000. Second, training-cell reliability negatively correlates with held-out reliability ($r = -0.90$ on $τ^2$), meaning the designs that look most reliable replicate worst. Third, population-level diagnostics transfer across enterprise benchmarks (capability-gap ratio stable at 0.35-0.40) but per-family agent rankings invert. Fourth, on the MAST failure taxonomy, trace-level mode profiles are idiosyncratic (MAE = 0.261) while cell-level profiles generalise (MAE = 0.056, $r = 0.83$). We package these into Deployment Decision Reliability (DDR), a one-page reporting discipline that turns the variance-component table into five decisions an enterprise buyer can defend. All code, data loaders, and fit artifacts are released under an open-source license.", "category": "cs.LG", "cluster": "Evaluation Frameworks \u0026 Reliability", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Long-Horizon Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决企业级长程 Agent 评估中的**测量可靠性（Measurement Reliability）**与**部署决策支持（Deployment Decision Support）**问题。具体而言，作者质疑当前 Agent 排行榜（Leaderboards）所报告的分数是否真正反映了 Agent 的通用能力（Capability），还是仅仅反映了其在特定任务集上的特化表现（Specialization）。通过引入**Generalizability Theory (G-theory)** 框架，论文将观测到的总方差分解为 Agent 主效应（Agent main effect）、任务效应、步骤效应、错误类别效应及其交互项，从而量化了不同来源的测量噪声。\n\n这一问题的重要性在于，企业实践者通常将排行榜分数视为采购决策的直接依据，却忽视了分数背后巨大的测量不确定性。如果排行榜排名主要受 Agent-Task 交互项（Agent-by-task interaction）驱动而非 Agent 主效应驱动，那么基于单一基准测试的排名在推广到生产环境时可能完全失效。解决这一问题带来的核心价值是提出了 **Deployment Decision Reliability (DDR)** 框架，这是一种将方差分量表转化为可辩护的采购决策清单的纪律。DDR 帮助企业在考虑成本约束（Cost-aware reliability）、任务难度分布（Difficulty-conditional reliability）和泛化能力（Hold-out generalization）的情况下，科学地确定评估所需的任务数量（Evaluation Sizing），从而避免基于有偏或不可靠的基准测试做出错误的部署决策。\n\n### § 2 前人工作与不足\n\n尽管已有研究关注 LLM 评估的不确定性，但针对多步 Agent 的细粒度测量分解尚未被充分解决。\n\n1.  **统计严谨性研究（如 Miller [2024], Madaan et al. [2024], Heineman et al. [2025]）**：这些工作通过聚类标准误、种子方差或信噪比分解来量化评估中的噪声总量（How much noise）。然而，它们未能分解噪声的具体来源（Where the noise lives），即无法区分噪声是来自 Agent 本身、任务采样、执行步骤还是错误类别。因此，它们无法提供针对特定部署场景（如高难度任务或成本敏感场景）的评估规模建议（Evaluation Sizing）。\n2.  **G-theory 在检索与评分中的应用（如 Urbano et al. [2013], Song et al. [2025], Messing [2026]）**：Urbano 等人将 G-theory 用于信息检索测试集的规模确定，Song 等人用于评估 LLM 作为评分者的一致性，Messing 用于纠正单步 LLM 标注中的隐藏误差。这些工作的不足在于，它们处理的对象通常是静态模型或单步评分者，而非**多步 Agent（Multi-step Agent）**。多步 Agent 引入了轨迹（Trajectories）、步骤位置（Step position）和错误类别（Error category）作为独立的方差来源，且部署决策涉及成本和难度约束，这是传统测试集规模确定（Test-collection sizing）未曾面对的问题。\n3.  **复合评分与心理测量学方法（如 Liang et al. [2022], Polo et al. [2024], Ndzomga [2026]）**：HELM 等框架依赖专家权重聚合多个维度，tinyBenchmarks 应用项目反应理论（IRT）。这些方法的局限在于，专家权重缺乏经验方差分解的支持，且 IRT 通常假设单维潜在能力（Unidimensional latent ability），无法处理 Agent 评估中所需的多面交叉设计（Multi-faceted crossed designs）。此外，Ndzomga 的 IRT 方法仅建议过滤中等难度任务，而未从完整的方差分解中推导任务预算。\n4.  **Agent 特定可靠性指标（如 $\\tau$-bench [Yao et al., 2024], Zhang et al. [2026]）**：$\\tau$-bench 引入了 `pass_k` 指标，但这本质上是一个单面（Trial）设计，无法同时建模任务、步骤和错误类别噪声。Zhang 等人定性描述了评估框架（Harness）作为方差来源的影响，但未量化其大小。\n5.  **失败模式分析（如 MAST [Cemri et al., 2025], Zhang et al. [2025]）**：MAST 提供了失败分类，Zhang 等人关注步骤级归因准确率。这些工作将失败归因视为分类问题（Classification problem），而本文将其重构为测量问题（Measurement problem），关注方差是否稳定到足以支持部署决策，而非仅仅识别哪一步失败。\n\n综上所述，现有工作要么缺乏对多步 Agent 复杂方差结构的分解能力，要么缺乏将统计诊断转化为具体部署决策（如成本调整、难度条件化）的框架。本文通过扩展 G-theory 到四面交叉设计（Four-facet crossed design），填补了这一空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在深入分析 Agent 评估之前，作者首先观察到企业实践中存在一个显著的认知偏差：从业者往往将 Leaderboard 上的排名直接等同于 Agent 的通用能力（Capability），并据此做出采购决策。然而，现有的评估体系存在严重的测量学缺陷。传统的 LLM 评估多关注静态认知测试或单轮问答，而 Agent 涉及多步轨迹（Trajectories），引入了步骤位置（Step position）和错误类别（Error category）等新的方差来源。作者意识到，现有的统计方法（如聚类标准误或简单的信度系数）只能量化噪声的总量，却无法分解噪声的来源——即无法区分差异是来自 Agent 本身、任务分布、还是 Agent 与任务的交互（Interaction）。\n\n进一步地，作者借鉴了心理测量学中的 Generalizability Theory (G-theory)，该理论在信息检索和人类评分一致性研究中已有应用，但从未被用于处理多步 Agent 这种复杂对象。作者推测，如果将 Agent 视为测量对象，任务、步骤和错误类别视为 Facets，那么通过方差分解（Variance Decomposition）可以揭示 Leaderboard 排名的真实构成。同时，作者注意到企业部署决策不仅关注准确率，还受限于推理成本（Inference Cost）和生产环境中的任务难度分布（Difficulty Distribution）。现有的 Benchmark 往往报告聚合指标，忽略了在困难任务子集上信度可能崩溃（Collapse）的风险，且缺乏对未见数据（Held-out data）泛化能力的验证。因此，作者认为需要构建一个框架，将方差分解结果转化为具体的部署决策依据，即通过 D-study 确定达到特定信度目标所需的最小任务样本量，并引入成本感知和难度条件化的诊断指标，从而解决“评估设计如何支持部署决策”这一核心问题。\n\n### § 4 核心 Intuition\n\n这篇论文的核心直觉在于，当前 Agent Leaderboard 的排名主要反映的是 Agent 对特定任务集的**特化程度（Specialization）**，而非其通用的**能力优势（Capability）**，因为 Agent 主效应（Main Effect）在总方差中占比极低，而 Agent-任务交互效应（Interaction Effect）占据主导。这意味着，聚合信度指标（Aggregate Reliability）在困难任务或新任务分布下会失效，甚至产生误导性的乐观估计。因此，可靠的部署决策不应依赖单一的排名分数，而应基于**Deployment Decision Reliability (DDR)** 框架，通过分解方差来源、评估难度条件化信度以及验证持有集泛化能力，来量化评估设计对特定业务场景的支持程度。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文的核心方法是将心理测量学中的 **Generalizability Theory (G-theory)** 应用于长周期 Agent 的评估，旨在通过方差分解（Variance Decomposition）来量化评估结果的可靠性，从而指导企业级的部署决策。其提出的框架称为 **Deployment Decision Reliability (DDR)**。\n\n以下以评估两个前沿 Agent（如 GPT-4.1 和 o4-mini）在 $\\tau_2$-bench 的 `action_checks` 任务上的表现为例，展示完整的 Pipeline：\n\n1.  **数据收集与预处理 (Input)**：\n    *   **输入**：收集 Agent 在特定基准测试（如 $\\tau_2$-bench）上的执行轨迹（Traces）。每个观测值 $Y_{atse}$ 是一个二元成功指标（0 或 1），对应 Agent $a$ 在任务 $t$、步骤 $s$、错误类别 $e$ 下的表现。\n    *   **处理**：将数据整理为四因素完全交叉设计（Four-facet fully crossed design）。对于 $\\tau_2$-bench，由于奖励机制分解为多种检查类型（如 `db_check`, `action_checks` 等），需针对每种检查类型分别构建数据集。\n\n2.  **G-Study 方差分解建模 (Processing - G-Study)**：\n    *   **模型拟合**：使用三种估计器（Henderson Method-I, REML via `lme4`, Bayesian binomial GLMM）拟合线性混合效应模型。\n    *   **方差分量提取**：计算总观测方差中的各个分量，重点关注：\n        *   $\\sigma^2_a$：Agent 主效应方差（代表 Agent 的通用能力差异）。\n        *   $\\sigma^2_{a:t}$：Agent-任务交互效应方差（代表 Agent 对特定任务的专精程度）。\n        *   其他噪声项：任务主效应、步骤效应、残差等。\n    *   **示例结果**：在 `action_checks` 中，发现 $\\sigma^2_a$ 仅占总方差的 1.74%，而 $\\sigma^2_{a:t}$ 占 7.54%。这表明排名主要反映的是“专精化”（Specialization）而非通用“能力”（Capability）。\n\n3.  **可靠性系数计算 (Processing - Reliability Metrics)**：\n    *   **通用性系数 ($E\\rho^2$)**：计算相对排名可靠性，公式为 $\\sigma^2_a / (\\sigma^2_a + \\sigma^2_\\delta)$，其中 $\\sigma^2_\\delta$ 是相对误差方差。\n    *   **依赖性系数 ($\\Phi$)**：计算绝对阈值决策（如 SLA 门禁）的可靠性。\n    *   **能力天花板比率 (Capability-gap ratio)**：计算 $\\sigma^2_a / (\\sigma^2_a + \\sigma^2_{a:t})$，用于量化 Agent 主效应在 Agent 相关方差中的占比。\n\n4.  **D-Study 决策研究与诊断扩展 (Processing - D-Study \u0026 Diagnostics)**：\n    *   **难度条件可靠性 (Difficulty-conditional reliability)**：将任务按成功率分为四个四分位（Q1-Q4），分别拟合 G-Study。发现 Q4（最难任务）的 $E\\rho^2$ 可能从整体的 0.752 坍缩至 0.000。\n    *   **持有集泛化测试 (Hold-out generalization)**：进行 50 次随机 70/30 分割，比较训练集预测的 $E\\rho^2$ 与持有集实际 $E\\rho^2$ 的相关性。发现存在负相关（$r = -0.90$），即训练集可靠性高往往意味着持有集可靠性低。\n    *   **成本感知可靠性 (RPD)**：结合推理成本（Token 价格），计算 Reliability per Dollar，重新排序 Agent。\n\n5.  **生成 DDR 报告 (Output)**：\n    *   **输出**：生成一份单页报告，包含五个关键决策依据：\n        1.  **采样规模**：基于 D-Study 预算前沿，确定达到目标 $E\\rho^2$ 所需的最小任务数。\n        2.  **难度目标**：根据生产环境任务难度分布，选择对应的难度条件可靠性指标。\n        3.  **成本约束**：使用 RPD 指标在成本受限下选择 Agent。\n        4.  **持有集协议**：要求基准测试供应商提供持有集可靠性估计，而非仅训练集投影。\n        5.  **失败模式解读**：区分方差来源（Variance）与失败频率（Frequency），避免误判。\n\n### § 6 核心数学推导\n\n这篇论文的核心数学基础是 **Generalizability Theory (G-theory)** 的方差分解模型。虽然论文未提供复杂的推导过程，但其核心公式具有明确的直觉意义，以下面向数学基础较弱的读者进行解释：\n\n**1. 观测值的分解模型**\n论文将每个观测值 $Y_{atse}$（Agent $a$ 在任务 $t$、步骤 $s$、错误类别 $e$ 下的成功与否）分解为多个随机效应的总和：\n$$ Y_{atse} = \\mu + \\nu_a + \\nu_t + \\nu_s + \\nu_e + \\nu_{a:t} + \\dots + \\epsilon_{atse} $$\n*   **直觉**：你看到的分数（$Y$）由一个平均值（$\\mu$）加上各种“噪音”和“信号”组成。\n*   $\\nu_a$ 是 **Agent 主效应**：代表 Agent 本身的固有水平。如果这个方差 $\\sigma^2_a$ 很大，说明 Agent 之间能力差异明显。\n*   $\\nu_{a:t}$ 是 **Agent-任务交互效应**：代表 Agent 对特定任务的适应性。如果这个方差 $\\sigma^2_{a:t}$ 很大，说明 Agent A 可能在任务 1 上很强，但在任务 2 上很弱，即“偏科”。\n*   $\\epsilon_{atse}$ 是 **残差**：无法解释的随机噪声。\n\n**2. 可靠性系数 ($E\\rho^2$)**\n$$ E\\rho^2 = \\frac{\\sigma^2_a}{\\sigma^2_a + \\sigma^2_\\delta} $$\n*   **直觉**：这是一个信噪比。分子 $\\sigma^2_a$ 是我们想要的“信号”（Agent 的真实能力差异）。分母中的 $\\sigma^2_\\delta$ 是“噪声”（所有涉及 Agent 的交互项，如 Agent-任务交互，除以样本量后得到的误差方差）。\n*   如果 $E\\rho^2$ 接近 1，说明排名非常可靠；如果接近 0，说明排名主要是由随机噪声或任务特异性决定的，不可信。\n\n**3. 能力天花板比率 (Capability-gap ratio)**\n$$ \\text{Ratio} = \\frac{\\sigma^2_a}{\\sigma^2_a + \\sigma^2_{a:t}} $$\n*   **直觉**：这个比率衡量了 Agent 的“通用能力”在其“总表现差异”中占多大比例。\n*   如果比率接近 0（如论文发现的 \u003C0.001），意味着 Agent 之间的差异几乎完全来自于它们对不同任务的“专精化”（Interaction），而不是谁比谁更聪明（Main Effect）。这解释了为什么 Leaderboard 排名不稳定——因为换一批任务，专精化的优势就会改变。\n\n**4. 成本感知可靠性 (RPD)**\n$$ \\text{RPD} = \\frac{E\\rho^2}{\\bar{C}} $$\n*   **直觉**：性价比。用获得的可靠性（$E\\rho^2$）除以平均推理成本（$\\bar{C}$）。这帮助企业在预算有限时，选择“每美元获得的可靠性”最高的 Agent，而不仅仅是准确率最高的。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n企业实践者通常将 Agent Leaderboard 的排名直接等同于 Agent 的通用能力（Capability），并据此做出部署决策。然而，这种排名是否可靠？它反映的是通用能力还是对特定测试集的过拟合（Specialization）？当前的评估设计是否足以支持生产环境中的部署决策？\n\n**2. 设计了什么实验验证这个问题？**\n*   **多基准方差分解**：在三个开放的企业级 Agent 基准测试（TheAgentCompany, $\\tau_2$-bench, AppWorld）上，应用四因素 G-theory 模型，分解总方差为 Agent 主效应、任务效应、步骤效应、错误类别效应及其交互项。\n*   **难度分层分析**：将任务按难度分为四个四分位，分别计算各层的 $E\\rho^2$，检验整体可靠性是否掩盖了困难任务上的可靠性坍缩。\n*   **持有集泛化测试**：通过 50 次随机 70/30 分割，对比训练集预测的可靠性与持有集实际可靠性的相关性，检验评估结果的泛化能力。\n*   **跨数据集迁移性测试**：比较不同基准测试间的 Agent 家族排名相关性和能力天花板比率，检验诊断指标的普适性。\n*   **失败模式分析**：利用 MAST/MAD 数据集，分析失败模式的方差来源，区分方差（Variance）与频率（Frequency）。\n\n**3. 问题的答案是什么？**\n*   **Leaderboard 排名反映的是专精化，而非通用能力**：在所有数据集中，Agent 主效应方差 $\\sigma^2_a$ 均低于总方差的 3%，而 Agent-任务交互效应 $\\sigma^2_{a:t}$ 占 7-23%。这意味着 Leaderboard 排名主要反映 Agent 对特定测试任务的适配度，而非统一的性能优势。\n*   **困难任务上的可靠性坍缩**：整体 $E\\rho^2$ 可能很高（如 0.752），但在最难的任务四分位（Q4）上可能降至 0.000。因此，整体可靠性指标不能保证在生产环境（通常包含更多困难任务）中的表现。\n*   **训练集可靠性与持有集可靠性负相关**：训练集上看起来最可靠的评估设计，在持有集上往往表现最差（$r = -0.90$）。这表明基于训练集的可靠性投影存在严重的乐观偏差，企业应要求提供持有集可靠性估计。\n*   **群体诊断可迁移，个体排名不可迁移**：能力天花板比率在不同基准间保持稳定（0.35-0.40），但具体 Agent 家族的排名在不同基准间可能反转。\n*   **方差与频率正交**：Agent 差异最大的类别（高方差）并不一定是失败最频繁的类别。评估应关注方差来源以区分 Agent，而非仅关注失败频率。\n\n**结论**：论文提出了 **Deployment Decision Reliability (DDR)** 框架，建议企业不再单纯依赖 Leaderboard 排名，而是通过方差分解、难度条件可靠性、持有集泛化测试和成本感知指标，进行更科学、可辩护的部署决策。", "additional_insights": "### § 8 Take-aways\n\n企业级 Agent 排行榜反映的是 Agent 对特定任务的 **specialization**（专业化），而非通用的 **capability**（能力），因为 **agent main effect**（$\\sigma_a^2$）在所有测试集中均低于总方差的 3%，而 **agent-by-task interaction**（$\\sigma_{a:t}^2$）占比高达 7–23%。基于 **Generalizability Theory**（G-theory）的方差分解显示，聚合可靠性指标 **$E\\rho^2$** 在困难任务象限（Q4）会发生严重崩塌（例如在 $\\tau_2$-bench 的 `action_checks` 中从 0.752 降至 0.000），这意味着针对高难度生产环境的部署决策不能依赖基准测试的平均可靠性。训练集上的可靠性估计与 **held-out**（留出）可靠性呈显著负相关（$r = -0.90$），表明基于训练单元投影的可靠性指标存在严重的乐观偏差，必须报告交叉验证后的留出可靠性。引入 **Reliability per Dollar (RPD)** 指标后，成本敏感的采购排名与纯准确率排名经常发生反转，证明在成本约束下，低准确率但低推理成本的模型可能更具部署价值。**Deployment Decision Reliability (DDR)** 框架将方差分量表转化为五个可辩护的采购决策维度，包括任务采样量、难度桶选择、成本约束、留出协议及失败模式解读，从而替代单一的排行榜分数作为部署依据。\n\n### § 9 最脆弱的假设\n\n该方法最核心且脆弱的假设是：**当前前沿 Agent 群体中，$\\sigma_a^2 \\approx 0$ 这一现象是测量设计的固有属性，而非暂时性的技术停滞或特定基准测试的偏差，即 Agent 之间的差异主要体现为任务特异性交互而非整体能力层级。** 如果这一假设不成立，例如未来出现具有显著通用能力优势的 Agent（导致 $\\sigma_a^2$ 显著增大），或者当前的基准测试未能有效区分整体能力，那么基于“无通用能力差异”前提构建的 **DDR** 框架中关于“排行榜反映专业化而非能力”的核心结论将失效，且基于 **agent-by-task interaction** 主导的 **routing**（路由）策略建议将失去理论支撑。论文通过三个独立数据集（TheAgentCompany, $\\tau_2$-bench, AppWorld）和三种估计器（Henderson Method-I, REML, Bayesian GLMM）的一致性结果提供了强证据，表明 $\\sigma_a^2$ 极小并非单一数据集或估计器的偶然现象。然而，论文缺乏对“为何 $\\sigma_a^2$ 如此小”的深层机制解释，也未排除当前基准测试任务分布过于均匀或难度天花板过低导致无法激发整体能力差异的可能性；若未来基准测试引入更具区分度的通用能力任务，$\\sigma_a^2$ 可能回升，从而动摇 DDR 框架中关于“停止将排行榜顺序视为采购信号”的激进建议。\n\n### § 10 最小复现实验\n\n在 1 周内，可以使用公开的 **$\\tau_2$-bench** 数据子集（例如仅选取 `action_checks` 类型的 50 个任务和 3 个前沿 Agent 的轨迹数据）来复现 **difficulty-conditional reliability** 的崩塌现象。具体实现步骤为：首先，计算每个任务在所有 Agent 上的平均成功率，将任务按难度分为四个象限（Q1-Q4）；其次，分别对整体数据和 Q4（最难）子集拟合四因素 **G-study** 模型（使用 `lme4` 进行 REML 估计），提取 **agent main effect** ($\\sigma_a^2$) 和 **agent-by-task interaction** ($\\sigma_{a:t}^2$)；最后，计算整体和 Q4 子集的 **generalizability coefficient** ($E\\rho^2$)。如果复现结果显示 Q4 子集的 $E\\rho^2$ 显著低于整体 $E\\rho^2$（例如接近 0 或大幅下降），且 Q4 子集中的 $\\sigma_a^2$ 接近于 0，则支持论文关于“困难任务下聚合可靠性失效”的 claim；反之，如果 Q4 子集仍保持较高的 $E\\rho^2$ 且 $\\sigma_a^2$ 显著，则反驳该结论，表明当前基准测试在困难任务上仍能区分 Agent 的整体能力。此实验无需复现完整的 DDR 报告生成流程，仅需验证方差分解在难度分层下的行为，即可检验论文最关键的实证发现之一。", "research_value": "### § 11 最强反例设计\n\n要挑战这篇论文的核心结论，最有力的攻击并非质疑其统计方法的正确性，而是攻击其**方差分解模型的前提假设**与**企业部署决策的实际逻辑**之间的错位。具体而言，可以设计一个基于**非平稳任务分布（Non-stationary Task Distribution）**和**长尾错误敏感性（Long-tail Error Sensitivity）**的反例场景。\n\n首先，论文假设 Agent 的“通用能力”可以通过 $\\sigma^2_a$（Agent main effect）来衡量，并认为 $\\sigma^2_a \\approx 0$ 意味着排行榜无效。然而，这一结论依赖于一个隐含假设：所有任务在部署决策中具有同等的权重或方差贡献。在真实的企业场景中，任务分布往往是极度偏斜的（Skewed）。如果 90% 的生产任务属于“简单模式”（Easy Mode），而只有 10% 属于“困难模式”（Hard Mode），那么即使 $\\sigma^2_a$ 在整体方差中占比极低，但在“简单模式”子集中，$\\sigma^2_a$ 可能显著大于 $\\sigma^2_{a:t}$。此时，Leaderboard 排名在覆盖 90% 业务量的场景下是高度可靠的。论文提出的 **Difficulty-conditional reliability** 虽然指出了 Q4（最难四分位）的可靠性坍缩，但它错误地将“困难任务上的不可靠”推广为“整体部署决策的不可靠”。反例实验可以构造一个合成数据集，其中 Agent A 在 95% 的任务上表现完美且稳定（高 $\\sigma^2_a$ 贡献），仅在 5% 的极端边缘案例上表现随机；而 Agent B 在所有任务上表现中等但稳定。根据论文的 DDR 框架，由于整体 $\\sigma^2_a$ 被边缘案例的噪声稀释，可能会建议降低对 Agent A 的置信度，甚至因为 Agent B 的 **Reliability per Dollar (RPD)** 更稳定而推荐 B。然而，在实际部署中，Agent A 能解决绝大多数问题，其“专精化”带来的收益远超其在边缘案例上的噪声。这证明了 **G-theory** 的全局方差分解忽略了**任务频率加权（Task-frequency weighting）**，导致在长尾分布场景下给出次优甚至错误的采购建议。\n\n其次，从理论层面攻击 **Hold-out generalization** 的负相关结论（$r = -0.90$）。论文声称训练集可靠性高意味着持有集可靠性低，暗示存在严重的过拟合或乐观偏差。然而，一个替代解释是**任务采样偏差（Task Sampling Bias）**而非模型过拟合。如果基准测试中的任务是从一个有限的、高度相关的任务池中采样的，那么训练集和持有集之间的相关性本身就受到任务池内部结构（Task Pool Structure）的限制，而非 Agent 的泛化能力问题。反例论证可以指出，如果任务池是无限且独立的，这种负相关不应存在。因此，论文的结论可能只是反映了当前基准测试构建方法的缺陷（即任务间缺乏独立性），而非 Agent 评估本身的固有不可靠性。如果企业能够构建一个任务间独立性更强的基准测试（例如通过程序化生成无限变体），$\\sigma^2_{a:t}$ 可能会显著降低，$\\sigma^2_a$ 的占比会相对上升，从而恢复 Leaderboard 的有效性。这意味着论文的“DDR 框架”可能是一个针对“劣质基准测试”的补丁，而非针对“Agent 评估本质”的通用解决方案。一旦基准测试质量提升，DDR 的许多复杂诊断（如难度条件化、持有集协议）可能变得多余，从而削弱其作为通用框架的价值。\n\n### § 12 Follow-up Research Idea\n\n基于对 **G-theory** 在处理**非平稳性**和**任务依赖性**方面局限性的理解，提出一个新的研究方向：**Dynamic Reliability Routing (DRR) via Causal Task Graphs**。\n\n**(a) 驱动局限与未满足需求：**\n现有工作（包括本文的 DDR）主要关注静态的、离线评估的可靠性，假设任务分布是固定的，且 Agent 的表现是独立同分布的（i.i.d.）。然而，真实的企业 Agent 部署是一个**动态过程**：任务之间存在依赖关系（例如，先搜索再总结），且 Agent 的表现具有**路径依赖性（Path-dependency）**。DDR 框架虽然引入了步骤效应（Step effect），但仍将其视为独立的方差来源，未能捕捉步骤间的因果结构。此外，DDR 建议基于整体或难度分层的可靠性进行采购，但忽略了**运行时自适应（Runtime Adaptation）**的可能性。企业真正的需求不是选择一个“平均最可靠”的 Agent，而是构建一个系统，能够根据当前任务的特征和 Agent 的历史表现，动态路由到最合适的 Agent 或策略。现有的方差分解无法提供这种细粒度的、因果驱动的决策支持。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴**因果推断（Causal Inference）**中的**结构因果模型（Structural Causal Models, SCM）**和**强化学习（Reinforcement Learning）**中的**上下文多臂老虎机（Contextual Bandits）**。具体来说，将 Agent 的执行轨迹建模为一个因果图，其中节点是任务步骤，边是因果依赖关系。利用 SCM 识别哪些步骤的失败是“根本原因”（Root Cause），哪些是“下游效应”（Downstream Effect）。然后，结合 Contextual Bandits，根据当前任务的上下文特征（如复杂度、领域、历史失败模式）动态选择 Agent 或调整策略，以最大化累积可靠性。\n\n**(c) 第一个实验设计：**\n构建一个**多 Agent 协作系统**，其中包含多个具有不同专精化特征的 Agent（如一个擅长代码生成，一个擅长逻辑推理）。实验场景为一个复杂的、多步骤的企业工作流（如“代码审查-测试-部署”）。\n1.  **因果图构建**：首先，使用历史轨迹数据学习任务步骤间的因果依赖关系，构建 SCM。\n2.  **动态路由策略**：设计一个 Contextual Bandit 算法，其奖励函数不是简单的任务成功率，而是基于 **G-theory** 分解出的**步骤级可靠性（Step-level Reliability）**。例如，如果当前步骤是“代码生成”，且 SCM 显示该步骤的失败会导致后续所有步骤失败（高因果影响力），则路由到在该步骤上 $\\sigma^2_a$ 占比最高的 Agent；如果步骤是“格式检查”，则路由到成本最低的 Agent。\n3.  **对比基线**：对比 DRR 策略与 DDR 框架推荐的“静态最佳 Agent”以及“随机路由”策略。\n4.  **评估指标**：不仅评估整体任务成功率，还评估**成本效率（Cost Efficiency）**和**鲁棒性（Robustness）**（即在任务分布发生漂移时的表现）。\n\n这个提议与已有工作的区别在于：它不再试图通过增加评估样本量来提高静态可靠性，而是承认可靠性的动态性和条件性，并利用因果结构和在线学习来**优化部署时的决策过程**，从而在有限的评估预算下实现更高的生产环境性能。这将 Agent 评估从“测量问题”转化为“决策优化问题”，开辟了新的研究范式。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Vasundra Srinivasan\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Stanford School of Engineering\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Code, data loaders, results, and reproducibility instructions: https://github.com/vasundras/agent-reliability-engineering-lab\"\n    }\n  ]\n}\n```", "summary_translation": "企业从业者阅读智能体排行榜时，往往将其视为对智能体能力的排名。我们在三个开放式的智能体轨迹基准测试（TheAgentCompany、$τ^2$-bench 和 AppWorld）上表明，在所有数据集和检查类型中，智能体的主效应仅解释了总方差的不到 3%，而智能体与任务的交互效应则解释了 7-23%。排行榜排名的是专业化程度，而非能力。我们通过基于四个维度的 Generalizability Theory 方差分解得出这一结论，并使用了三种估计器（Henderson Method-I、基于 lme4 的 REML 以及贝叶斯二项式 GLMM），这三种估计器的结果在三位小数上保持一致。另外四项发现进一步揭示了排行榜所掩盖的问题。首先，在最难的任务四分位上，聚合信度急剧下降：$τ^2$ action_checks 上的 $Eρ^2$ 从 0.752 降至 0.000。其次，训练单元信度与留出集信度呈负相关（在 $τ^2$ 上 $r = -0.90$），这意味着看起来最可靠的设计其复现效果最差。第三，群体层面的诊断指标在企业基准测试间具有迁移性（能力差距比率稳定在 0.35-0.40），但每个家族的智能体排名会发生反转。第四，在 MAST 故障分类法中，轨迹层面的模式分布具有特异性（MAE = 0.261），而单元层面的模式分布则具有泛化性（MAE = 0.056，$r = 0.83$）。我们将这些发现整合为 Deployment Decision Reliability (DDR)，这是一种单页报告规范，将方差分量表转化为企业买家可以辩护的五项决策。所有代码、数据加载器和拟合产物均在开源许可下发布。"}, {"title": "Self-evolving network verifiers", "arxiv_id": "2608.11340", "authors": "Ioannis Protogeros, Tibor Schneider, Laurent Vanbever", "summary": "Symbolic network verifiers can reason about correctness across vast spaces of routing inputs and failures, but only for the protocols and features an expert has encoded by hand. Creating and maintaining a faithful model of the control plane is both difficult and never-ending, since no written source specifies perfectly what a network does: vendor implementations deviate from the RFCs, and behaviour shifts with releases. The burden of constant upkeep ultimately keeps verification out of many networks that need it. We argue that the model should instead evolve automatically to faithfully capture the actual network behaviour. To achieve that, we leverage the only source that specifies it unambiguously: the router software itself. In a counterexample-guided loop, a coding agent proposes extensions to the verifier's symbolic encoding, while a trusted oracle (e.g., emulated routers) supplies the ground-truth routing state. The agent iteratively refines the network model using each disagreement with the oracle. As early evidence, a prototype of this system taught a 3,000-line SMT-based verifier three features it did not support: OSPF areas, BGP route reflection, and L3VPN over EVPN, converging autonomously on models that match the oracle, even noticing vendor-specific behaviour. Automating model growth shifts the hard problem from writing verification systems to systematically testing them; we propose a research agenda for trusting and harnessing automatically evolved verifiers.", "category": "cs.AI", "cluster": "Evaluation Frameworks \u0026 Reliability", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving, Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究
