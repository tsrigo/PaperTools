                    │                          │ (Temporal \u0026 Semantic Edges)\n[Online Stage]               │                          │\nUser Query q ─────\u003E Cue Retrieval ─────\u003E Anchor Set Aq ─┘\n                                          │\n                                          v\n                                    Graph Expansion\n                                          │\n                                          v\n                               Evidence Context Eq ──\u003E LLM ──\u003E Answer a\n```\n\nCueMem 的完整 Pipeline 分为离线记忆构建和在线上下文重构两个阶段，具体步骤如下：\n\n- **Memory Cue Extraction (§ 4.1)**\n  - **输入**：长期的 Dialogue History $D = \\{u_1, u_2, \\dots, u_T\\}$。\n  - **具体操作**：在离线阶段，系统使用 LLM 从每个对话轮次中提取细粒度的 relational triples 作为 memory cues。每个 cue 被形式化为 $c_i = (t_i, \\tau_i)$，其中 $t_i$ 是包含原子语义信息的三元组，$\\tau_i$ 是指向其源对话轮次的指针。随后，使用 embedding 模型将每个 $t_i$ 编码为 dense vector $\\mathbf{t}_i$ 以供后续检索。\n  - **输出**：带有源轮次指针的 Cue Set $C = \\{c_1, c_2, \\dots, c_N\\}$。\n\n- **Turn Graph Construction (§ 4.2)**\n  - **输入**：Dialogue History $D$ 与 Cue Set $C$。\n  - **具体操作**：在离线阶段，构建图 $G = (V, E)$，其中节点 $v_i$ 对应对话轮次 $u_i$。图包含两种边：Temporal edges 连接时间窗口 $w$ 内的轮次以保留局部对话连续性；Semantic edges 则通过计算 cue 级别的 embedding 相似度，检索 top-$k$ 近邻 cues，并将它们映射回各自的源轮次节点建立连接，从而捕捉非局部的语义关联。\n  - **输出**：包含时间与语义双重关联的 Turn Graph $G$。\n\n- **Cue Retrieval (§ 4.3)**\n  - **输入**：在线阶段的 User Query $q$ 与离线构建的 Cue Set $C$。\n  - **具体操作**：使用与离线阶段相同的 embedding 模型将查询 $q$ 编码为 $\\mathbf{q}$，在 Cue Set 中检索 top-$m$ 个最相似的 memory cues。提取这些检索到的 cues 的源轮次指针 $\\tau_i$。\n  - **输出**：作为图扩展起点的 Anchor Set $A_q$。\n\n- **Graph Expansion (§ 4.3)**\n  - **输入**：Anchor Set $A_q$ 与 Turn Graph $G$。\n  - **具体操作**：在线阶段，从锚点节点出发，在 Turn Graph 上进行一跳扩展，收集锚点轮次及其时间与语义邻居。随后，将收集到的轮次按其原始时间顺序重新排列，以形成连贯的上下文。\n  - **输出**：紧凑且包含关键证据的 Evidence Context $E_q$。\n\n- **Answer Generation (§ 4.3)**\n  - **输入**：User Query $q$ 与重构的 Evidence Context $E_q$。\n  - **具体操作**：将 $q$ 和 $E_q$ 格式化为 prompt，输入 LLM 进行推理生成。对于涉及知识更新的问题，prompt 中会加入 priority instruction，指导 LLM 优先依赖时间上更近的证据。\n  - **输出**：最终生成的 Answer $a$。\n\n### § 6 核心数学推导\n\n本文未涉及复杂的形式化数学推导或定理证明，其数学表达主要集中于集合定义、图论基础表示以及基于向量相似度的 top-$k$ 检索公式。因此本节跳过。\n\n### § 7 实验设计与结论\n\n这篇论文通过三个核心实验验证了其提出的 claim：\n\n**提出了什么问题**：CueMem 的 cue-guided context reconstruction 机制是否优于现有的长期记忆基线？\n**设计了什么实验**：在 LoCoMo 和 LongMemEval 两个长期对话问答基准上，将 CueMem 与 Naive RAG、MemoryOS、Mem0、A-Mem 和 LightMem 等代表性记忆系统进行对比，使用 LLM-as-judge 协议评估准确率。\n**问题的答案**：CueMem 在两个数据集上均取得了最佳的 overall accuracy，且在不同类型的问题（如 single-hop, temporal, knowledge-update）上表现出更强的泛化性和稳定性，证明了细粒度 cue 检索与 anchor-based 上下文重构的有效性。\n\n**提出了什么问题**：Turn graph expansion 和 priority instruction 对系统性能有何具体贡献？\n**设计了什么实验**：在 LoCoMo 上移除 turn graph（仅保留 anchor turns 作为上下文），在 LongMemEval 上移除 priority instruction，进行 ablation study。\n**问题的答案**：移除 turn graph 导致整体准确率显著下降（尤其在 single-hop 和 multi-hop 问题），证明图扩展对于恢复时间相邻和语义相关的支持证据至关重要。移除 priority instruction 导致 knowledge-update 和 temporal 问题准确率明显下降，证明当重构的上下文中包含冲突历史时，简单的优先指令结合 LLM 固有推理能力即可有效处理知识更新，无需复杂的显式 UPDATE 操作。\n\n**提出了什么问题**：与直接使用 full-history 的长上下文 LLM 相比，CueMem 在效率和效果上表现如何？\n**设计了什么实验**：在限制重构上下文约为 2K tokens 的条件下，比较 CueMem 与 full-history LLM 设置在准确率、input tokens 消耗及 query latency 上的差异。\n**问题的答案**：CueMem 在大幅减少 input tokens（降至 full-history 的 2%~10%）和 query latency（降低 42.5%~87.4%）的同时，反而取得了更高的准确率。这表明 CueMem 能够有效规避长上下文带来的“lost-in-the-middle”现象和噪声干扰，以极低的计算开销实现了高效的记忆重构。", "additional_insights": "### § 8 Take-aways\nCueMem 提出了一种受自传体记忆启发的长期对话记忆框架，将提取的细粒度记忆记录作为 retrieval cues 而非 self-contained evidence。系统通过 LLM 从对话轮次中提取 relational triples 作为 memory cues，并保留指向其 source turn 的指针。在 query time，系统检索相关 cues 并映射到 source-turn anchors，随后在包含 temporal edges 和 semantic edges 的 turn graph 上进行一跳扩展，以重建紧凑的 evidence context。该方法放弃了复杂的 memory update 操作，仅通过添加新 cues 并在 prompt 中加入 priority instruction，依靠 LLM 自身推理能力解决知识冲突。实验表明，CueMem 在 LoCoMo 和 LongMemEval 两个 benchmark 上均超越了 MemoryOS、Mem0 等基线，且相比 full-history 输入大幅减少了 input tokens 和 inference latency。消融实验证明 turn graph expansion 对于恢复局部和全局证据至关重要，而 priority instruction 在不显式更新记忆的情况下有效处理了 knowledge-update 问题。\n\n### § 9 最脆弱的假设\nCueMem 最核心且失败代价最大的假设是：**细粒度的 cue-level 语义相似度能够准确捕捉跨越不同对话轮次的非局部关联，从而使得基于 source-turn anchors 的一跳图扩展足以恢复所有必要的支撑证据。** 如果这个假设不成立，整个 cue-to-anchor-to-context 的重建管道就会断裂，导致 LLM 缺乏关键上下文而回答错误。在实际场景中，这个假设很可能不成立，因为真实的 multi-hop 推理往往依赖逻辑链条而非单纯的语义相似度。例如，用户在第 2 轮提到“买了去巴黎的机票”，在第 50 轮提到“预订了埃菲尔铁塔附近的餐厅”，这两者的 cue-level 语义相似度可能并不高，且它们与其他中间闲聊轮次在语义上可能更为接近，导致 top-k semantic edges 无法将这两个逻辑强相关的轮次连接起来。论文虽然通过 LoCoMo 上 multi-hop 问题的较高准确率（82.24%）间接证明了该机制的有效性，但缺少对 turn graph 连通性的微观分析（例如：成功案例中有多少证据是直接由 semantic edges 贡献的，而非碰巧在时间窗口内），也没有探讨当逻辑链条跨度极大且缺乏明显词汇重合时，一跳扩展是否会彻底失效。\n\n### § 10 最小复现实验\n如果有一周时间，可以最小化复现 CueMem 的核心检索与重建机制，以验证“基于 fine-grained cues 的 anchor 映射加时间窗口扩展，比直接检索 dialogue turns 更能提高 evidence recall”这一 claim。数据方面，使用公开的 LoCoMo 数据集，仅抽取其中的 multi-hop 和 temporal 问题子集。实现方面，跳过复杂的 semantic edges 构建，仅使用 LLM 提取每个轮次的 relational triples 作为 cues 并建立指向 source turn 的指针。对于给定的 query，对比两种检索策略：Baseline 采用传统的 Naive RAG，直接按 query 与 dialogue turn 的 embedding 相似度检索 top-k 轮次；实验组采用 CueMem 的核心机制，先检索 top-k 相似的 cues，映射到 source turns 作为 anchors，然后沿时间轴向前后各扩展一个窗口（如 1-2 个轮次）组成 context。测量指标为 evidence recall（即检索出的 context 中是否包含 LoCoMo 提供的 ground truth supporting turns）以及最终的 LLM answer accuracy。如果实验组的 evidence recall 和 accuracy 显著高于 Baseline，则支持了论文关于 fine-grained cues 提供更精准 retrieval targets 并能有效引导 context reconstruction 的 claim；若两者表现无异或因 cues 提取丢失上下文导致实验组更差，则直接反驳了该机制的核心价值。", "research_value": "### § 11 最强反例设计\n要构造对 CueMem 最致命的攻击，我会在真实世界的长程对话场景中设计一个“语义漂移的隐式因果多跳推理”实验。CueMem 的核心在于利用 cue-level 的 semantic similarity 捕捉非局部关联，并通过一跳图扩展来恢复证据。然而，真实的复杂推理往往依赖隐式的因果或逻辑链条，而非表层的语义相似。例如，用户在第 5 轮提到“我刚失业了，现金流很紧张”，在第 60 轮提到“我把之前订的去巴黎的机票退了”，并在第 120 轮询问“我为什么没去欧洲度蜜月？”。在这个场景中，查询与第 60 轮的退票行为有直接语义关联，但退票与第 5 轮的失业之间缺乏直接的词汇或语义重合，且跨越了极长的时间窗口。CueMem 的 semantic edges 极大概率无法将“失业”与“退票”这两个 cues 连接起来，而 temporal edges 也无法跨越 55 轮的间隔。因此，图扩展收集到的 Evidence Context $E_q$ 将缺失最核心的因果证据（失业导致预算紧张），导致 LLM 产生幻觉或给出表面化的错误回答。这个反例不仅指出了方法在 predictable condition 下的失效，还提供了一个对现有实验结果的替代解释：CueMem 在 LoCoMo 和 LongMemEval 上取得的高 multi-hop 准确率，可能仅仅是因为这些 benchmark 中的多跳推理路径恰好具有较高的词汇共现率或分布在较短的时间窗口内，而非其 semantic edges 真正具备了捕捉深层逻辑关联的能力。\n\n### § 12 Follow-up Research Idea\n基于 CueMem 在隐式逻辑链条上的检索失效问题，我提出一个非增量的 novel research idea：将长期对话记忆从“基于相似度的静态检索”重构为“基于溯因推理的动态假设验证”。驱动这个想法的核心局限是：现有的记忆系统（包括 CueMem）都试图在 query time 一次性完成证据收集，这要求系统必须能“猜中”所有逻辑相关的碎片，但真实的因果链条往往是隐式的，无法通过 embedding similarity 预先建立索引。为了打破这一瓶颈，我们可以借鉴认知科学中的 Episodic Future Thinking 以及符号逻辑中的 Abductive Reasoning，构建一个 Agentic Memory Reasoner。当系统接收到用户查询（如“为什么没去欧洲”）时，不再直接检索 cues 并扩展，而是首先利用 LLM 生成多个潜在的因果假设（如“预算不足”、“签证被拒”、“行程冲突”）。随后，系统将这些假设转化为针对性的探针，在 Turn Graph 上执行多轮迭代的 adversarial search，主动寻找支持或反驳这些假设的 dialogue turns。第一个实验将构建一个包含长跨度隐式因果链的合成对话数据集，对比传统 Naive RAG、CueMem 的单次图扩展，以及提出的 Abductive Reasoning Agent。评价指标不仅包括最终的 answer accuracy，还重点考察 reasoning path fidelity（即系统是否沿着正确的因果节点完成了推理）。这一提议与已有工作的根本区别在于：它将记忆检索从被发的“找相似”转变为主动的“找逻辑”，将记忆系统的角色从 evidence provider 升级为 reasoning participant。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Changjian Wang\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Rongzhen Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Weili Guan\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Shuming Shi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Quan Lu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ning Jiang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Mashang Consumer Finance Co., Ltd.\"},\n    {\"id\": 2, \"name\": \"Harbin Institute of Technology, Shenzhen\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "长期对话代理必须通过从扩展的对话历史中召回信息来回答用户查询，然而直接使用完整历史成本高昂且通常不可靠，而压缩的 memory units 可能会丢失 question answering 所需的 fine-grained evidence。受 autobiographical memory 重构观的启发，我们提出了 CueMem，这是一个 cue-guided 框架，它将提取的 memory records 视为 retrieval cues 而非 self-contained evidence，并从其 source turns 中重构 query-relevant 对话上下文。在 memory construction 阶段，CueMem 从 dialogue turns 中提取 fine-grained memory cues，并将每个 cue 链接到其 source turn。在 query time，它检索 query-relevant cues，将其映射到 source-turn anchors，并在捕获 temporal proximity 和 semantic relatedness 的 turn graph 上从这些 anchors 进行扩展，从原始对话中重构 compact evidence context 以用于 LLM answer generation。在 LoCoMo 和 LongMemEval 上的实验表明，CueMem 始终优于具有代表性的 long-term memory baselines。进一步的分析表明，与 full-history LLM setting 相比，基于 graph 的 context reconstruction 有助于恢复 supporting dialogue evidence，同时减少 query-time input tokens 和 latency。这些结果突出了 retrieval cues 作为长期对话 question answering 中 self-contained memory evidence 的有效替代方案。"}, {"title": "AIM: A Privacy-Aware Interoperable Memory Framework for Multi-Agent Multi-User LLM Systems", "arxiv_id": "2609.12320", "authors": "Zachary Johnson, Nigel Boachie Kumankumah, Somya Chatterjee, Tejas Sathyamurthi, Min Chen, Xinyi Alice Li, Xiao Wang, Emily Morgan Gelchie, Jessica Lin, Sadid A. Hasan, Sulaiman Vesal", "summary": "Traditional large language models (LLMs) are scoped to individual user sessions, limiting their knowledge to a single conversation and preventing them from learning user preferences that evolve over time. Existing agentic memory systems address this limitation but generally operate at the individual-user level, restricting the public knowledge that could be shared across users to improve downstream responses. We introduce AIM (Agentic Interoperable Memory), a unified, privacy-aware memory framework that enables multi-agent, multi-user LLM systems to persistently manage private and shared memory. AIM dynamically classifies information as private, scoped to one user and inaccessible to others, or public, accessible to all users. It enforces index-level access controls so that private memories are retrievable only by their owner, protecting sensitive data while allowing beneficial shared knowledge to improve coordination and consistency. We also introduce MUMBench (Multi-User Memory Benchmark), a dataset of multi-user interactions containing private and shareable information across four domains. To our knowledge, MUMBench is the first public dataset designed to evaluate multiple memory operations, including retrieval, creation, update, and deletion, in a multi-user environment. Across three independent runs on MUMBench, AIM achieves 96.0% visibility classification accuracy, 58.8% strict operation accuracy, and 70.5% state-aware operation accuracy.", "category": "cs.LG", "cluster": "Memory \u0026 Experience Management", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agent capability/behavior, Multi-Agent)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=53 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 论文的核心贡献是提出了AIM（Agentic Interoperable Memory）框架，用于在多智能体、多用户LLM系统中持久化管理私有和共享记忆，并引入了MUMBench来评估多用户环境下的记忆操作。这直接对应了研究焦点中的“单智能体（记忆机制）”和“多智能体（协作与共享知识学习）”方向。虽然论文标题包含“Privacy-Aware”，但其本质是研究智能体在多用户场景下的记忆管理机制（如信息的检索、创建、更新、删除及可见性控制），属于智能体能力构建的一部分，而非纯粹的“Security for AI”或系统安全防护研究。此外，该研究关注的是跨用户的记忆共享与隔离机制，而非单纯的多智能体拓扑结构或消息路由等系统工程问题。因此，该论文符合构建和改进LLM智能体记忆能力的研究范围，应予保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文针对的核心问题是：在 multi-agent、multi-user 的 LLM 系统中，如何持久化地管理 memory，使得 private memory 仅对所属用户可检索，同时允许 public memory 跨用户共享以提升系统整体的协调性与一致性。传统 LLM 被限制在 single-session 范围内，无法跨会话积累用户偏好与结构化知识，导致交互重复、上下文碎片化、个性化受限。现有的 agentic memory 系统（如 MemGPT、Mem0、A-MEM 等）虽然引入了 persistent memory 与 lifecycle management，但它们均设计于 single-user、single-agent 假设之上，既缺乏跨用户的 access control 机制，也无法在异构 agent 之间同步共享知识。随着 LLM 生态向多 agent 协作、多用户并发的方向演进——例如企业级 assistant 同时服务大量用户、specialized agent 之间需要协调共享任务——这一缺口变得尤为关键。解决该问题的价值在于：在保护用户隐私的前提下，将个体用户积累的 beneficial shared knowledge（如团队决策、通用政策）转化为可被所有用户利用的公共资产，从而提升 coordination、consistency 和整体 system intelligence，同时通过 index-level 的确定性访问控制抵御 adversarial query 对 private memory 的提取攻击。\n\n### § 2 前人工作与不足\n\n该问题此前未被完整解决。在 memory architecture 层面，Generative Agents 引入了 recency-importance-relevance 加权的检索机制，CoALA 框架将 agent memory 形式化为 working/episodic/semantic/procedural 模块的 taxonomy，MemGPT 借鉴 OS 分页机制实现 tiered memory，Mem0 构建了 production-oriented 的 ADD/UPDATE/DELETE/NOOP pipeline 并显著降低 latency。然而，这些系统的根本局限在于其架构假设单一用户与单一 agent：memory store 没有 ownership 概念，不存在 visibility predicate 或 access control layer，因此无法支持 multi-tenant isolation。这一缺失并非简单的功能遗漏，而是因为它们的 retrieval index 和 deduplication 逻辑均以全局共享为默认设计——一旦引入多用户，private memory 会在 retrieval 和 deduplication 阶段不可避免地发生 cross-user leakage。在 modular/hierarchical memory 方向，MIRIX、MemOS、G-Memory、LEGOMem 等系统改进了 memory 的组织结构与 retrieval 精度，Mem-α 甚至用 reinforcement learning 优化存储策略，但它们关注的是 single-agent 内部的 memory 效率，完全没有涉及 memory versioning、conflict resolution 或 privacy-scoped sharing 这些 multi-user 场景下的核心需求。在 multi-user sharing 方面，Collaborative Memory 将 user-agent 权限建模为 bipartite graph 并设置 dual-tier private/shared store，INMS 验证了 shared memory pool 对 cross-agent QA 的增益，MaaS 将 memory 解耦为带 dynamic access policy 的模块化服务——这些工作识别了多用户共享的需求，但它们要么要求用户手动标注 memory visibility（增加部署摩擦），要么仅在 probabilistic 层面实施访问控制（无法在结构上阻止 unauthorized retrieval），且均未提供端到端的 automatic privacy classification 与 index-level enforcement。此外，MEXTRA attack framework 已实证表明，缺乏结构化保护的 agent memory 在 black-box 设置下可被提取 private information，凸显了 deterministic access enforcement 的必要性。在 benchmark 层面，LOCOMO 和 MemoryAgentBench 仅评估 single-user retrieval，不测试 access control、cross-session synchronization 或 concurrent multi-agent update 下的 memory integrity，导致 prior systems 即使在多用户场景下存在隐私漏洞，也无法被现有评测发现。AIM 正是针对这三重缺口——automatic visibility inference、deterministic index-level access control、multi-label operation detection——提出了统一解决方案，并配套 MUMBench 填补了评测空白。", "core_insight": "### § 3 重建作者的思考路径\n\n随着 LLM agents 从单次会话走向持久化部署，研究者们观察到无状态的 agent 无法积累跨会话的用户偏好和协作知识。早期的记忆架构如 Generative Agents 和 MemGPT 虽然引入了观察、反思和分层记忆等机制，但它们本质上都是为单 agent 单用户设计的。当企业级 agent 需要同时服务多个用户时，一个核心矛盾浮现：完全隔离的记忆无法利用团队级别的共享知识（如编码规范、通用排障步骤），而完全共享的记忆又会泄露个人隐私（如 MEXTRA 攻击所揭示的漏洞）。现有的多用户记忆研究（如 Collaborative Memory）虽然提出了双轨制存储，但往往依赖用户手动标记隐私级别，或在检索后进行概率性过滤，这在工程上既增加摩擦又不够安全。作者进一步注意到，真实对话中的记忆操作并非互斥——用户一句“我刚搬到旧金山，能推荐餐厅吗？”同时触发了记忆写入和检索，而 Mem0 等先验系统假设每轮仅一个操作，导致信息丢失。基于这些失败模式，作者推断：一个实用的多用户记忆系统必须将隐私分类自动化，并在向量索引层面确定性地强制执行访问控制，使得 private 记忆在检索的物理层面就不可达，而非事后过滤。同时，操作检测必须从单标签升级为多标签分类。为了验证这一思路，作者发现现有 benchmark（如 LOCOMO）均未涵盖多用户隐私隔离和并发操作场景，因此必须构建一个新的评估基准。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 在于：多用户环境下的记忆管理必须将信息的可见性作为系统的基础约束。通过在记忆写入时利用 LLM 自动推断 private/public 标签，并在向量检索的索引层面确定性地强制执行访问控制，系统能在不牺牲共享知识利用的前提下，实现严格的多租户隔离。此外，将记忆操作检测建模为多标签分类，使得单条用户消息能够同时触发记忆的创建与检索，从而更真实地反映对话中的复合意图。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n输入 x, 用户 u, agent a\n    │\n    ▼\n┌──────────────────┐\n│ Multi-Label       │ §3.2\n│ Intent Detection  │\n│   f_op(x)         │\n└────────┬─────────┘\n    O ⊆ {C,R,U,D}\n    ┌────┴────┐\n    ▼ Write   ▼ Read\n   Path      Path\n    │         │\n    ▼         ▼\n┌─────────┐ ┌─────────────────┐\n│Struct.  │ │S1: Dense Retrieve│ §3.7\n│Extract  │ │  +Visibility V   │\n│ f_ext   │ └────────┬────────┘\n└───┬─────┘          │ top-k\n    ▼                ▼\n┌─────────┐ ┌─────────────────┐\n│Privacy  │ │S2: Tag Rescoring │\n│Classif. │ │  dual threshold  │\n│ f_cls   │ └────────┬────────┘\n└───┬─────┘          │\n    ▼                ▼\n┌─────────┐ ┌─────────────────┐\n│Semantic │ │S3: LLM Rerank   │\n│Dedup    │ │  +Recency Fusion │\n│f_dedup  │ └────────┬────────┘\n└───┬─────┘          │\n    ▼                ▼\n┌──────────┐    Retrieved R\n│Memory M  │\n│(shared)  │◄── Delete if D∈O\n└──────────┘\n```\n\nAIM 将 multi-agent memory management 分解为两条级联推理路径，作用于同一个不断演化的共享 memory store $M$（§3）。以下逐步说明：\n\n**1. Multi-Label Intent Detection（§3.2）**\n- 输入：用户消息 $x$、用户 $u$、agent $a$。\n- 操作：通过 in-context learning 的 LLM 将 $x$ 映射为操作子集 $O \\subseteq \\{C, R, U, D\\}$ 或 $\\emptyset$。关键设计是 multi-label——一条消息可同时触发 create 和 read（如\"I just moved to SF. Can you recommend dinner spots?\"）。Prompt 内嵌 privacy guard，将试图获取他人 private 信息的 adversarial query 映射为 $\\emptyset$。Constrained decoding 限制输出仅含合法操作标签。\n- 输出：操作集合 $O$。若 $O = \\emptyset$，直接返回，不触发后续流程（Algorithm 1, Line 3–5）。\n\n**2. Structured Memory Extraction（§3.3）**\n- 输入：消息 $x$，仅当 $C \\in O$ 或 $U \\in O$ 时触发。\n- 操作：prompted LLM 以 constrained JSON-mode decoding 从对话中提取结构化 memory tuples $\\{(c_j, \\boldsymbol{\\tau}_j, \\boldsymbol{\\mu}_j)\\}_{j=1}^{J}$，每个 tuple 包含文本内容 $c$、关键词 tag 集合 $\\boldsymbol{\\tau}$、以及可选的 provenance metadata $\\boldsymbol{\\mu}$（时间上下文、领域类别）。\n- 输出：待写入的 memory tuple 列表。\n\n**3. Privacy-Aware Visibility Classification（§3.4）**\n- 输入：单条 extracted memory 的内容 $c_j$ 及其 metadata $\\boldsymbol{\\mu}_j$。\n- 操作：prompted LLM 依据 prompt 中编码的 inductive biases 进行二分类——public signals 包括集体事件、组织公告、共享资源；private signals 包括个人偏好、个人日程、敏感数据（健康、财务）。该分类决定后续 deduplication scope、retrieval filter 和 update/delete 权限。\n- 输出：visibility label $v_j \\in \\{\\text{PUBLIC}, \\text{PRIVATE}\\}$。\n\n**4. In-Context Semantic Deduplication（§3.5）**\n- 输入：candidate memory $(c_j, v_j)$ 及当前用户 $u$。\n- 操作：首先根据 visibility scope 构建受限比较集 $M_v$——若 $v_j = \\text{PUBLIC}$，则 $M_v$ 为 $M$ 中所有 public memories；若 $v_j = \\text{PRIVATE}$，则 $M_v$ 为同一用户 $u$ 的所有 private memories。随后将整个 $M_v$ 序列化提供给 LLM，进行三路分类：CREATE（无语义等价项）、UPDATE（存在同主题但信息过时的 memory $\\hat{m}$，返回指针）、NO-OP（内容已被覆盖）。Scope restriction 确保一个用户的 private memory 永不与另一用户的 private memory 比较，防止 cross-user 信息泄露。\n- 输出：操作决策 $o_j \\in \\{\\text{CREATE}, \\text{UPDATE}, \\text{NO-OP}\\}$ 及可能的更新目标 $\\hat{m}$。CREATE 则将新 memory 编码后写入 $M$；UPDATE 则在验证 $V(u, \\hat{m})$ 后替换内容（Algorithm 1, Line 17–21）。\n\n**5. Memory Representation and Indexing（§3.6）**\n- 输入：memory 内容 $c_i$、tags $\\boldsymbol{\\tau}_i$、用户 $u$、agent $a$、visibility $v_i$。\n- 操作：使用 embedding model $\\phi$（$d=3072$）生成 dense embedding。当 tags 非空时，计算 tag-enriched embedding——将 content 与 tags 拼接后联合编码，实现 keyword-guided representation learning。Vector index 采用 HNSW 算法支持 ANN 检索；metadata 字段（user, agent, visibility, tags）独立索引以支持 predicate push-down filtered search。\n- 输出：存储于 vector-indexed store 中的结构化 memory record $m_i$。\n\n**6. Cascaded Memory Retrieval（§3.7）**\n- 输入：query $q$、用户 $u$、agent $a$，仅当 $R \\in O$ 或 write path 需要上下文时触发。\n- **Stage 1 — Visibility-Constrained Dense Retrieval**：从 Eq. 1 构建 visibility predicate $V(u, \\cdot)$，作为 server-side filter 推入 vector index。索引返回 cosine similarity 排序的 top-$k$ candidates。此阶段复杂度为 $O(\\log|M|)$（HNSW），且 Eq. 1 在 index level 强制执行，使其他用户的 private memories 在结构上不可能成为候选。\n- **Stage 2 — Tag-Level Semantic Rescoring**：对每个有非空 tags 的 candidate $m_i$，计算 query embedding 与 tag embedding 的 cosine similarity $s_{\\text{tag}}$。仅当 content similarity $s_{\\text{vec}} \\geq \\tau_{\\text{vec}}$ 且 tag similarity $s_{\\text{tag}} \\geq \\tau_{\\text{tag}}$ 同时满足时保留。此 dual-threshold filter 作为 precision gate，大幅削减进入下一阶段的候选数量。\n- **Stage 3 — LLM-Based Reranking with Temporal Fusion**：对存活的 candidates，pointwise LLM scorer $g_\\theta$ 计算 relevance estimate $s_{\\text{rel}}$。Scoring prompt 编码 conservative guidelines：分数 $\u003E0.7$ 要求直接、特定的相关性；不确定匹配默认 $\\leq 0.4$。随后将 $s_{\\text{rel}}$ 与 normalized recency score $s_{\\text{rec}}$ 融合，最终排名分数 $s_{\\text{final}} = (s_{\\text{rel}} + s_{\\text{rec}}) / 2$，按 $s_{\\text{final}}$ 降序截断至 $k$。\n- 输出：retrieved memory set $R$，用于 augment agent 的响应。\n\n**7. Delete 操作（Algorithm 1, Line 24–26）**\n- 输入：消息 $x$、用户 $u$，仅当 $D \\in O$ 时触发。\n- 操作：在满足 $V(u, m)$ 的约束下，删除与 $x$ 相似度最高的 memory $\\arg\\max_{m \\in M} \\text{sim}(x, m)$。这确保用户只能删除自己拥有的 memory。\n- 输出：更新后的 memory store $M$。\n\n**关于评测流程**：AIM 在 MUMBench 上的评测是将 672 条按时间顺序排列的 user interactions 依次回放通过上述完整 pipeline（operation detection → extraction → classification → deduplication → retrieval），每个 domain 开始前清空 memory store 以保证隔离。每条 interaction 的 predicted operations 与 gold operations 通过 strict accuracy、state-aware accuracy、visibility match、content quality 等指标比对。整个流程是纯推理（inference），不涉及训练。\n\n---\n\n### § 6 核心数学推导\n\n本文不包含复杂的形式化数学推导，其数学内容主要是定义性公式和组合性评分函数。以下逐一解释可确认的公式及其 intuition：\n\n**Visibility Predicate（Eq. 1）**\n\n$$V(u, m_i) = \\text{true} \\iff (v_i = \\text{PUBLIC}) \\lor (v_i = \\text{PRIVATE} \\land u = u_i)$$\n\n这是整个系统的隐私基石。直觉很简单：一条 memory 要么对所有人开放（PUBLIC），要么只对创建者本人可见（PRIVATE）。这个谓词在 pipeline 的每个阶段都被强制执行——retrieval 时作为 index filter，write 时作为 update/delete 的权限检查。它使得系统可以在单一共享 index 上实现 multi-tenant isolation，无需为每个用户维护独立的 memory store。\n\n**Tag-Enriched Embedding（Eq. 2）**\n\n$$\\mathbf{e}_i = \\phi(\\text{concat}(c_i, \\tau_{i,1}, \\tau_{i,2}, \\ldots))$$\n\n将 memory 的文本内容与关键词 tags 拼接后一次性送入 embedding model。直觉是：如果一条 memory 的内容是\"User is planning a trip to Paris\"，tags 是 [\"trip planning\", \"Paris\", \"cultural activities\"]，那么联合编码后的 embedding 在面对包含 \"Paris\" 或 \"trip\" 关键词的 query 时会有更高的 cosine similarity，无需维护独立的 sparse keyword index。\n\n**Retrieval Cascade 的评分函数（Eq. 3–7）**\n\nStage 1（Eq. 3）是在 visibility filter 约束下的标准 cosine similarity top-$k$ ANN 检索，无特殊数学结构。\n\nStage 2（Eq. 4）计算 query embedding 与 tag embedding 的 cosine similarity：\n$$s_{\\text{tag}} = \\cos(\\phi(q), \\phi(\\boldsymbol{\\tau}_i))$$\n配合 content similarity $s_{\\text{vec}}$ 构成 dual-threshold precision gate。直觉是：一条 memory 必须在完整语义表示和关键词摘要两个维度上都与 query 相关，才值得送入昂贵的 LLM reranking。\n\nStage 3（Eq. 5–7）是两个分数的线性组合：\n$$s_{\\text{rel}} = g_\\theta(q, m_i) \\quad \\text{（LLM pointwise relevance score）}$$\n$$s_{\\text{rec}} = \\frac{t_i - t_{\\min}}{t_{\\max} - t_{\\min}} \\quad \\text{（normalized recency）}$$\n$$s_{\\text{final}} = \\frac{s_{\\text{rel}} + s_{\\text{rec}}}{2}$$\n\n$s_{\\text{rec}}$ 将 candidate 集合中 memory 的 timestamp 线性归一化到 $[0, 1]$，越新分数越高。$s_{\\text{final}}$ 取 relevance 和 recency 的等权算术平均。直觉是：在 relevance 相近的情况下，更近期的 memory 更可能对当前 query 有用。论文指出这是一种简单的 linear rank combination 实例，未来可从用户反馈中学习融合权重。\n\n**State-Aware Accuracy 的状态修正（Eq. 9）**\n\n$$\\text{state-aware}(i) = \\max\\left(\\text{strict}(i), \\mathbf{1}[C(\\hat{y}_i) = T_i(C(y_i))]\\right)$$\n\n这不是系统内部的数学模型，而是评测指标的设计。$T_i$ 是第 $i$ 轮的状态修正变换：如果 gold operation 期望 update 一个从未被 create 的 memory，$T_i$ 将其放松为 create；如果 read/delete 的目标不存在，则放松为 no-op。$\\max$ 确保一个正确的 strict match 不会被 state heuristic 的 false positive 惩罚。直觉是：早期操作的错误会级联污染后续操作的 store state，state-aware accuracy 旨在将\"单轮决策质量\"与\"级联效应\"解耦。\n\n---\n\n### § 7 实验设计与结论\n\n论文提出了三个核心 claim 并通过实验逐一验证：\n\n**Claim 1：AIM 能在 multi-user 环境中正确区分 private 与 public memory 并执行 access control。**\n\n论文设计了 MUMBench——首个包含 672 条跨 93 个用户、4 个领域（Coding、Customer Support、Education、Travel Planning）的 multi-user memory benchmark，其中包含 60 条 adversarial query（用户试图访问他人 private memory）。每条 interaction 标注了 expected memory operation（CRUD/NOOP）和 expected visibility（private/public）。通过 Visibility Match 指标评估分类正确性，并通过检查 private memory 是否被 unauthorized user 检索来验证 access control。**答案**：5 个模型平均 visibility classification accuracy 接近或超过 90%，GPT-5.4 达到 96.0%，3 个模型在 Travel domain 达到 100%。这表明 AIM 的 privacy-aware classification engine（确定性规则 + LLM 分类）能可靠区分 private 与 public，即使在语义模糊的场景下（如用户提及个人包裹但延迟原因是公共的天气信息）。\n\n**Claim 2：AIM 能在 multi-user 环境中正确识别并执行 memory operations（CRUD）。**\n\n论文采用 tiered scoring framework 评估 operation accuracy：strict accuracy 要求 predicted operation multiset 与 gold 完全匹配；state-aware accuracy 在 strict 基础上根据实际 store state 修正 gold expectations，隔离级联错误的影响；judge-decision accuracy 由 full-context LLM judge 裁决 ambiguous-but-reasonable 的操作选择。三种指标的递进设计直接回应了\"早期错误级联\"这一 agentic memory 评测的核心挑战。**答案**：以 GPT-5.4-mini 为最佳模型，strict accuracy 为 58.8%，state-aware accuracy 为 70.5%，judge-decision accuracy 为 89.5%。Strict 与 state-aware 之间的 12 个百分点差距量化了级联效应的影响；state-aware 与 judge-decision 之间的差距则反映了操作选择的固有歧义性。Coding domain 表现最优（state-aware 79.8%），因其交互模式以直接的 create-and-retrieve 为主；Travel domain 最弱（62.7%），因多轮交互中存在复杂的 update chain。\n\n**Claim 3：高性能 memory system 不需要牺牲质量以换取计算效率。**\n\n论文在所有 pipeline 组件中使用 5 个不同 model family 的模型（GPT-5.4、GPT-5.4-mini、DeepSeek-V3.2、Mistral-Large-3、Llama-3.3-70B-Instruct），每个模型独立完成全部推理任务（extraction、classification、operation detection、deduplication、reranking），运行 3 次取均值和标准差。**答案**：GPT-5.4-mini 在 strict accuracy（58.8%）、state-aware accuracy（70.5%）、content quality（91.6%）和 judge-decision accuracy（89.5%）上均取得最高或接近最高分，超越其更大的 counterpart GPT-5.4。这表明 smaller model 在 memory management 任务上可以保持竞争力，memory system 的整体架构设计（而非单一模型规模）对性能起决定性作用。\n\n论文也在单用户 benchmark LOCOMO 上与 Mem0 对比，但 AIM 在所有类别上均低于 Mem0（如 single-hop judge score 0.280 vs. 0.671）。论文坦诚指出 LOCOMO 是单用户 benchmark，不测试 AIM 的核心 multi-user 能力，且 AIM 的 privacy classification 和 deduplication 阶段在单用户场景下会产生过度合并的副作用。此外，Retrieval Relevance 仅 45.0%、Tag Overlap 仅 35.5%，以及 public memory 缺乏事实性验证（任何用户可写入错误公共信息），是论文明确承认的主要局限。", "additional_insights": "### § 8 Take-aways\n本文提出了 AIM，一个统一的、具备隐私感知的 memory framework，专为 multi-agent 和 multi-user LLM 系统设计，通过 index-level 的 access control 确保了 private memory 对非拥有者的结构不可见。AIM 的核心 pipeline 包含 multi-label intent detection、structured memory extraction、privacy-aware visibility classification 以及 in-context semantic deduplication，支持单条消息同时触发多个 memory operations。为填补 multi-user memory 评估的空白，作者引入了 MUMBench，这是首个评估多用户环境下 agentic memory system 的 multi-operation 性能（retrieve, create, update, delete）的公开数据集，包含 4 个领域的 672 条交互。实验表明，AIM 在 visibility classification 上达到了 96.0% 的准确率，在 state-aware operation accuracy 上达到 70.5%，且较小的模型（如 GPT-5.4-mini）在多数指标上表现最佳，证明了高效的 memory 管理无需以牺牲计算资源为代价。\n\n### § 9 最脆弱的假设\nAIM 的核心贡献建立在这样一个假设上：**LLM 能够在提取阶段准确地将 memory 分类为 private 或 public，且这种基于 inductive biases 的分类在实际复杂场景中是可靠的**。如果这个假设不成立，AIM 的核心价值将直接失效。因为 AIM 的 access control 是在 retrieval index level 确定性执行的，一旦 LLM 在上游的 visibility classification 阶段将本应 private 的 memory 误判为 public，该敏感信息就会被写入 public index 并对所有用户开放，导致不可逆的隐私泄露。在实际应用中，这个假设极易不成立，因为用户输入往往具有高度的上下文依赖性和语义模糊性（如论文 Appendix A.6 中提到的包裹延误与暴风雨的例子），LLM 很难在缺乏全局上下文的情况下做出绝对正确的隐私界定。论文虽然提供了 MUMBench 上 96.0% 的 visibility classification accuracy 作为证据，但这仍意味着有 4% 的误判率；在隐私保护场景下，即使是极低的 false positive rate 也是不可接受的。此外，MUMBench 是由 GPT-4o 合成并人工验证的数据集，可能无法完全覆盖现实世界中极其复杂和隐蔽的隐私边界，论文缺少在真实对抗性场景下对该分类机制鲁棒性的深入评估。\n\n### § 10 最小复现实验\n如果只有 1 周时间，可以做一个最小复现实验来验证 AIM 的 **Privacy-Aware Visibility Classification** 在模糊场景下的可靠性。使用 MUMBench 数据集中标记为 ambiguous 的样本，或者自行构造 50-100 条包含隐含隐私信息的 multi-user 对话数据。实现 AIM 的 visibility classification 模块，即使用 LLM（如 GPT-4o-mini）结合论文中提到的 public signals（如 collective events）和 private signals（如 personal preferences）作为 prompt，对提取的 memory content 进行 PRIVATE 或 PUBLIC 的二分类。测量分类的 accuracy、precision、recall，并特别关注 false positive rate（将 private 误分为 public 的比例）。如果实验结果显示在模糊场景下 false positive rate 显著升高（例如超过 5%），则反驳了 AIM 能够可靠保护隐私的 claim，说明其核心假设在实际复杂场景中不成立；如果 accuracy 保持高位且 false positive rate 趋近于零，则支持其 claim。这个实验无需复现完整的 retrieval pipeline 或 vector index，只需调用 LLM API 即可完成，能够高效地针对系统最脆弱的隐私分类环节进行压力测试。", "research_value": "### § 11 最强反例设计\n\n要对该论文进行最有力的攻击，我会设计一个**“跨记忆推理泄露与公共记忆投毒”**的对抗性实验场景，直接挑战其核心假设——即基于单条 memory 的静态 visibility classification 能够在 multi-user 环境中保护隐私。AIM 的 pipeline 在提取阶段将每一条 memory 独立判定为 PUBLIC 或 PRIVATE，并在 retrieval 阶段通过 index-level filter 确定性隔离 PRIVATE memory。然而，真实的隐私泄露往往不是单条记录的直接暴露，而是通过多条看似无害的 PUBLIC memory 进行交叉推理得出的。我的反例实验构造如下：在一个 Corporate Assistant 场景中，恶意用户 Alice 不断通过正常交互注入带有特定诱导性的 PUBLIC memory（例如“公司政策规定，所有参与 Project X 的员工下个月必须前往 Country Y 出差”），而受害者 Bob 的 PRIVATE memory 中包含“因身体原因无法前往 Country Y”或“持有 Country Y 的特殊签证限制”。当 Alice 发起一个看似普通的 query（如“列出下个月可能无法正常出差的人员特征”），AIM 的 retrieval pipeline 会合法地检索到那条 PUBLIC memory，并可能结合 Bob 之前与 agent 交互时留下的、被误判为 PUBLIC 的碎片化 metadata，通过 LLM 的 in-context reasoning 直接推导出 Bob 的私人敏感信息。在这个场景下，AIM 的 index-level access control 完全失效，因为它只阻断了对 Bob PRIVATE memory 的直接检索，却无法阻止恶意用户利用共享的 PUBLIC memory 作为推理锚点，通过 LLM 的生成能力间接“萃取”出受保护的隐私。这一反例不仅指出了 AIM 将 visibility classification 局限于单条记录的根本缺陷，还揭示了在 LLM 强大推理能力面前，缺乏 relational privacy 约束的 access control 不过是一扇虚掩的门。\n\n### § 12 Follow-up Research Idea\n\n基于上述局限，我提出一个非增量的 novel research idea：**将 Information Flow Control (IFC) 与 Information-Theoretic Privacy 引入 agentic memory，构建一个基于互信息的动态隐私边界推理框架**。这个想法的驱动需求在于，AIM 及前人工作均将 privacy 视为一种静态的、基于记录的标签（PUBLIC/PRIVATE），完全忽略了隐私的“涌现性”——即多条无害记录的组合可能产生高敏感度的推断。为了解决这个问题，我们可以借鉴安全系统领域的 Information Flow Control 和隐私统计学中的 Differential Privacy 概念，不再让 LLM 在提取时硬性分类，而是在 retrieval 和 generation 阶段动态计算信息流的风险边界。\n\n具体而言，memory store 不再存储绝对的 visibility 标签，而是维护一个 relational knowledge graph。当 agent 处理用户 $u$ 的 query 时，系统不仅执行 vector retrieval，还会触发一个 **Inference Leakage Estimator**。该 estimator 计算当前 retrieved memory set $R$ 与目标用户 $u$ 的 private memory subspace $M_{private}$ 之间的 conditional mutual information $I(M_{private}; \\text{Response} | R)$。如果该互信息超过预设的 privacy budget $\\epsilon$，系统将在 vector space 中主动注入“混淆记忆”或对 retrieval 结果进行信息瓶颈约束，从而在结构上阻断跨记忆的推理攻击。\n\n第一个实验将设计一个“Relational Inference Attack Benchmark”：构造一个多用户协作环境，其中单条 memory 均被标记为低敏感，但特定组合的 memory 能够以极高概率推断出某用户的隐藏属性。我们将对比传统 ACL（如 AIM 的 index-level filter）、无保护 LLM，以及我们提出的 IFC-based dynamic filter。评价指标不仅包括 retrieval accuracy，更核心的是测量 adversarial agent 通过多轮交互推断目标用户隐藏属性的成功率以及信息熵的衰减情况。这一提议与已有工作的根本区别在于：它将 privacy enforcement 的重心从“存储时的静态标签”转移到了“推理时的动态信息流约束”，首次将 LLM 的 in-context reasoning 能力视为一种潜在的隐私威胁通道，并用信息论工具进行数学上的严格阻断。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zachary Johnson\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Nigel Boachie Kumankumah\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Somya Chatterjee\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Tejas Sathyamurthi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Min Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xinyi Alice Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiao Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Emily Morgan Gelchie\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jessica Lin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Sadid A. Hasan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Sulaiman Vesal\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Microsoft\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "传统的大型语言模型（LLMs）仅限于单个用户会话，将其知识限制在单次对话中，阻碍了它们学习随时间演变的用户偏好。现有的 agentic memory systems 解决了这一局限性，但通常在单个用户级别上运行，限制了可以跨用户共享以改善下游响应的公共知识。我们引入了 AIM (Agentic Interoperable Memory)，这是一个统一的、具备隐私意识的记忆框架，使多智能体、多用户 LLM 系统能够持久地管理私有和共享记忆。AIM 动态地将信息分类为私有或公共，私有信息仅限于单个用户且其他人无法访问，而公共信息对所有用户均可访问。它实施 index-level access controls，使得私有记忆只能由其所有者检索，在保护敏感数据的同时，允许有益的共享知识改善协调性和一致性。我们还引入了 MUMBench (Multi-User Memory Benchmark)，这是一个多用户交互数据集，包含跨四个领域的私有和可共享信息。据我们所知，MUMBench 是第一个旨在评估多用户环境中多种记忆操作（包括检索、创建、更新和删除）的公开数据集。在 MUMBench 上的三次独立运行中，AIM 实现了 96.0% 的 visibility classification accuracy、58.8% 的 strict operation accuracy 和 70.5% 的 state-aware operation accuracy。"}]}, {"name": "Workflow Synthesis \u0026 Tool Use", "count": 3, "papers": [{"title": "Local Edits, Global Ripples: Replay-Informed Policy Adaptation for Workflow Synthesis", "arxiv_id": "2609.12127", "authors": "Manqing Mao, Hong Wang, Samson Koelle, Jie Yuan, Zhuoer Wang, James Feng, Yanjun Lin, Daniel Edmiston, Nikki Lijing Kuang, Zhecheng Sheng, Wei Niu", "summary": "Prompt-policy editing offers a practical way to improve agents that synthesize executable workflows without updating the underlying model. However, persistent prompt editing has two coupled properties. First, edit locality does not imply effect locality: an edit confined to one policy segment can ripple through downstream execution, altering behavior beyond the edited segment. Second, edit effects are composition-sensitive: edits that work in isolation can interfere after composition, causing one or both to lose their benefit or become harmful. Persistent adaptation must therefore support two distinct decisions: identifying where the policy should change from execution feedback, and determining whether the resulting edit remains safe to persist after composition. To address these challenges, we introduce RIPPLE (Replay-Informed Persistent Policy Localization and Editing), which separates where an edit is made from whether it remains safe after composition. It diagnoses failed trajectories, maps each actionable failure to a predefined policy segment, and restricts the correction to that part of the policy. RIPPLE then evaluates candidates against the same iteration-start policy to compare their isolated gains, before replaying promising edits after previously accepted updates to expose downstream effects and interactions. Only edits that remain safe under composition are retained. We evaluate RIPPLE on Flow-HO, a synthetic held-out benchmark for executable workflow synthesis. RIPPLE improves validation success by up to 23.1% and yields positive gains on two additional frozen language-model backbones, while maintaining edit efficiency and low execution cost. Targeted interaction analysis further demonstrates both properties: a segment-local tool-use edit changes downstream resource resolution and validation, while an edit beneficial in isolation becomes harmful after composition.", "category": "cs.CL", "cluster": "Workflow Synthesis \u0026 Tool Use", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是提出了 RIPPLE，一种针对工作流合成智能体的提示策略自适应编辑方法。该方法通过诊断失败轨迹、将失败映射到策略片段、进行局部修正，并利用重放机制评估组合后的安全性，实现了智能体策略的持续自我改进和自适应优化。这完全符合筛选标准中“保留”规则的核心要求：研究 agent 的 harness / scaffold / system prompt，并且核心贡献是让这些智能体运行组件通过轨迹、反馈或评估结果自动改进、演化或自适应优化。论文探讨的 tool-use edit、execution feedback 和 persistent adaptation 属于单智能体和自我演化方向的核心机制，且不涉及任何被排除的安全、多模态、图技术或纯系统工程领域。因此，该论文与你的研究焦点高度相关。", "intro_logic": "### § 1 研究问题与重要性\n\n本文研究的核心问题是：对于使用 frozen LLM 的 executable workflow synthesis agents，如何通过持久化地编辑 prompt policy 来提升性能，同时保证局部编辑在组合后仍然安全。具体而言，作者识别出 prompt-policy editing 具有两个耦合属性：第一，edit locality does not imply effect locality——对一个 predefined policy segment 的局部指令修改可以波及下游执行，改变 tool call 方向、resource resolution、workflow 结构乃至 validation 和 repair 行为；第二，edit effects are composition-sensitive——在 isolation 中有益的编辑一旦与先前已接受的编辑组合，可能相互干扰、削弱甚至逆转收益。因此，persistent adaptation 实际上是一个 sequential policy-composition problem，而非 one-shot selection。\n\n这个问题的重要性源于 LLM agents 在实际部署中越来越多地被要求生成 executable artifacts（如 workflow JSON、infrastructure configurations、service-integrated automations），这些 artifacts 必须满足严格的 execution contract：conform to schema、implement requested behavior、resolve environment-specific resources、pass external validation。一个 workflow 可以在语义上看起来合理，却因为一个字段无效、一条 transition 断裂或一个 identifier 过期而无法部署。对于 frozen-model agents，唯一可行的改进路径是编辑 prompt policy，但如果不解决上述两个耦合属性，累积的编辑可能在部署中引发不可预测的行为退化和交互冲突。解决这一问题带来的价值是：使 prompt adaptation 成为可审计、可回滚、组合安全的持久化策略改进过程，而非依赖孤立增益的盲目堆叠。\n\n### § 2 前人工作与不足\n\n该问题此前未被完整解决。最相关的 prior work 可分为三类，每一类都触及了问题的一个侧面但存在结构性缺口。\n\n第一类是 automatic prompt optimization 方法，包括 APE (Zhou et al., 2023)、OPRO (Yang et al., 2024a)、ProTeGi/APO (Pryzant et al., 2023)、TextGrad (Yuksekgonul et al., 2024)、EvoPrompt (Guo et al., 2024)、GEPA (Agrawal et al., 2025) 以及 DSPy/MIPRO (Khattab et al., 2024; Opsahl-Ong et al., 2024) 和 SAMMO (Schnabel \u0026 Neville, 2024)。这些方法展示了 black-box textual policies 无需 gradient access 即可改进，但它们在评估每个 candidate 时仅针对 base policy 上的 task metric 打分，不测试该编辑在与其他已接受编辑组合后是否仍然安全。这一缺口的根本原因是：这些方法将 prompt optimization 建模为独立候选的选择问题，而非 sequential composition 问题，因此 isolated gain 被视为 persistence 的充分证据——而本文证明这一假设在 executable agent 场景下失效。\n\n第二类是 search- and reflection-based proposers，如 PromptAgent (Wang et al., 2024b) 的 Monte Carlo tree search、Promptbreeder (Fernando et al., 2023) 的 co-evolution、SPO (Xiang et al., 2025) 的 pairwise judge 比较，以及 Trace/OptoPrime (Cheng et al., 2024) 将 execution traces 视为 \"gradients\" 的优化框架。这些方法针对当前 task loss 联合优化参数，但不保留一个 versioned accepted prefix 作为新候选必须通过的安全基准。换言之，它们无法区分\"依赖当前参数状态的增益\"与\"能跨已接受编辑组合的增益\"。此外，这些方法依赖 LLM-driven 的开放式 proposal，在 executable workflow 场景中搜索空间膨胀速度远超 replay gate 的安全过滤能力。\n\n第三类是 persistent skill and prompt evolution 系统，包括 Voyager (Wang et al., 2023) 的 lifelong skill library、Reflexion (Shinn et al., 2023) 的 verbal reinforcement、ExpeL (Zhao et al., 2024) 的 free-form insight accumulation、ADAS (Hu et al., 2024) 的 meta-agent programming、Agent Workflow Memory (Wang et al., 2024c) 以及 AutoGuide (Fu et al., 2024)。这些系统证明了 acquired text 可以跨任务携带 non-trivial 行为变化，但它们共同的关键缺陷是：任何在 demonstration 上改善 performance 的 skill、reflection、guideline 或 workflow 都被直接保留，而不经过针对 evolving accepted prefix 的 replay-based falsifiability test。这一缺口并非简单的工程疏忽，而是因为这些问题在先前设定中未被清晰定义——先前系统的 deployment target 多为 free-form response 或 browser trajectory，不涉及 schema-validated executable workflow 中 service validity、structural correctness、edit locality、resource resolution 与 execution cost 之间的多维张力。\n\n与 RIPPLE 最接近的方法是同样使用 explicit promotion rules 的 GRASP (Moll et al., 2026)、SkillGen (Ma et al., 2026)、SkillOpt (Yang et al., 2026) 和 PACE (Shawn, 2026)。GRASP 诱导 open-vocabulary failure taxonomy 并在 hard regression budget 下 promote 候选，但使用 run-specific 开放词汇而非固定的六族 workflow failure taxonomy，且不将 reward 和 correctness 作为独立约束分别评估。SkillGen 通过 paired rollout 比较来决定 skill 是否持久化，但不评估候选在已接受编辑组合后的边际效应。SkillOpt 要求严格改进 disjoint selection score，tie 即拒绝，但优化的是 monolithic skill file 而非 segment-typed 的 bounded patch。这些方法在 promotion rule 层面与 RIPPLE 有形式相似性，但都未将两个关键要素联合解决：将 execution evidence 通过 deterministic taxonomy 局部化到特定 policy segment 的 bounded patch，以及在 advancing accepted prefix 上通过 two-signal replay gate（reward 和 correctness 分别约束）评估组合安全性。RIPPLE 的贡献正是将这两个决策解耦并联合处理：localization 约束 policy change 的引入位置，advancing replay 测试其组合后的行为效应是否仍然安全。", "core_insight": "### § 3 重建作者的思考路径\n\n作者面对的问题是：frozen-model agent 在生成可执行 workflow 时，如何在不更新权重的前提下持续改进 prompt policy。已有的 prompt optimization 方法（APE、OPRO、TextGrad、DSPy 等）本质上是在 base policy 上做 one-shot 候选搜索——提出一条新指令，在任务上测一下分数，分数高就保留。这条路径有一个被长期忽视的盲区：它默认\"一条 edit 在 base policy 上的表现能预测它在最终 policy 上的表现\"。\n\n作者 likely 从实际执行反馈中观察到了两个现象。第一个现象是：改了 prompt 里的某一条 tool-use 指令，本意只是让 agent 少做冗余 lookup，结果这条改动改变了 resource resolution 行为，进而改变了下游 workflow 结构，最终导致 validation 行为发生连锁变化。这正是 knowledge editing 文献中已记录的 ripple effect（Cohen et al., 2024），但在 prompt-level agent adaptation 中尚未被系统处理。第二个现象更隐蔽：两条各自有益的 edit 组合在一起后，其中一条会失效甚至有害。比如一条 patch 要求\"所有引用的 resource 必须解析为具体值\"，另一条 patch 说\"已存在的 identifier 可以跳过 lookup\"——单独看都合理，组合后后者会让 stale identifier 逃过前者的 revalidation，导致 service validation 失败。\n\n这两个现象指向同一个结构性问题：prompt adaptation 不是独立候选的选择问题，而是一个 sequential policy composition 问题。已有方法在 propose-and-select 框架下工作，但它们的 select 阶段评估的是 isolated gain，而非 composition 后的 marginal effect。GRASP、SkillGen、SkillOpt 等更近的工作引入了 promotion rule，但它们的 gate 要么只看单一 reward signal，要么评估基准固定在 base policy 而非 evolving accepted prefix，因此无法检测 composition-induced 的 destructive interaction。\n\n作者还需要解决另一个前置问题：execution failure 到 policy edit 之间的映射。一个低 reward 或 validation failure 只告诉你\"这次执行失败了\"，但不告诉你该改 prompt 的哪个部分。不同类型的失败——missing clarification、tool error、schema violation、repair failure、out-of-scope edit、incomplete output——对应不同的 policy segment。如果没有确定性的 diagnosis 机制，candidate proposal 就退化为 open-ended prompt rewriting，搜索空间远超 replay gate 能安全过滤的范围。\n\n综合这些线索，作者的推理路径收敛为：将 adaptation 拆成三个决策——what failed（用 deterministic taxonomy 诊断 trajectory）、where to edit（将诊断映射到 predefined policy segment 并从 versioned library 检索 bounded patch）、whether to persist（在 evolving accepted prefix 上做 replay 评估，同时检查 reward 和 correctness 两个 signal）。关键创新在于第三个决策：replay 不是在 base policy 上测，而是在所有已接受 patch 组合后的 policy 上测，这样 composition-induced 的 destructive interaction 就会在 commit 之前暴露出来。\n\n### § 4 核心 Intuition\n\n一条 prompt edit 的价值不是固定的，而是依赖于它将被嵌入的那个 policy context——同样的 edit 在 base policy 上有益，在已有其他 edit 的 policy 上可能有害，因为 edit 之间会通过下游执行产生非局部交互。因此，判断一条 edit 是否应该 persist，不能看它在 isolation 中的表现，必须把它放到所有已接受 edit 组合后的 policy 上重新执行 replay，只有在这个真实部署状态下仍然安全的 edit 才能保留。这就是 RIPPLE 的核心：把 prompt adaptation 从\"选好候选\"变成\"在 evolving policy 上验证 composition safety\"。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n  D_train + πk\n       │\n       ▼\n  Rollout 采样(N=3) ──► reward 方差排序 ──► 选 B_diag 条低 reward 轨迹\n       │\n       ▼\n  ┌─ Phase 1: WHAT failed ──────────────────────────────┐\n  │ Predicate 诊断 → 失败家族 f∈{F1..F6}, 证据 z(τ)     │\n  └──────────────┬──────────────────────────────────────┘\n                 ▼\n  ┌─ Phase 2: WHERE to edit ────────────────────────────┐\n  │ Localize(f,z)→segment s; Retrieve(L,f,s)→patch a    │\n  │ Coverage-first 排序 → 候选集 Ak                      │\n  └──────────────┬──────────────────────────────────────┘\n                 ▼\n  ┌─ Phase 3a: 训练侧预筛 (共享父策略 πk) ──────────────┐\n  │ ∆train(a)\u003E0? 按 ∆train 降序 → A+k                   │\n  └──────────────┬──────────────────────────────────────┘\n                 ▼\n  ┌─ Phase 3b: Replay 侧 Promotion (advancing prefix) ──┐\n  │ 在 Pk[\u003Cj] 上评估 aj: ∆g_R≥εR AND ∆g_C≥εC?          │\n  │   接受 → 前缀推进 Pk←Pk‖(aj)                         │\n  │   拒绝 → 前缀不变                                    │\n  └──────────────┬──────────────────────────────────────┘\n                 ▼\n          πk+1 = πk ⊕ Pk ──► 迭代 (连续2次无接受则停)\n```\n\n**步骤 1 — Rollout 生成与信息轨迹选择（§3.1, Algorithm 1 Phase 1）。** 输入为训练池 $D_{\\text{train}}$ 和当前策略 $\\pi_k$。对每个 datapoint 采样 $N=3$ 条轨迹，记录 interaction trace、生成 workflow、validator feedback 和 execution cost。计算每个 datapoint 的 rollout-level reward 方差，选方差最高的 $B_{\\text{diag}}=15$ 个 datapoint，取每个的最低 reward 轨迹。高方差意味着当前策略行为不一致，最低 reward 轨迹则提供具体的失败 trace。输出为待诊断轨迹集 $T_k$。\n\n**步骤 2 — WHAT failed: Predicate-based 诊断（§3.1）。** 输入为单条轨迹 $\\tau$。用确定性 Python 规则（无 LLM 调用）检查 execution log，匹配六个预定义失败家族：F1 Clarification、F2 Tool use、F3 Schema、F4 Repair、F5 Edit locality、F6 Completeness。Direct evidence 优先于 consequence fallback；当多个家族触发时，按 task-specific 优先级选取 causally earliest 的作为 primary label，其余保留为 secondary。输出为失败家族集合 $F(\\tau)$ 和证据记录 $z(\\tau)$。\n\n**步骤 3 — WHERE to edit: Segment-typed patch 构造（§3.2）。** 输入为 $F(\\tau)$ 和 $z(\\tau)$。首先通过 `Localize(f, z)` 将每个失败家族映射到七个预定义 prompt segment 之一（REQ_UNDERSTANDING、CLARIFY、PLAN、TOOL_USE、EDIT、VALIDATE、FINAL_OUTPUT）。然后从版本化 patch 库 $\\mathcal{L}$（23 条预注册条目）中 `Retrieve(L, f, s)` 检索匹配的 bounded instruction，直接 append 到目标 segment，不调用 LLM。多个轨迹的提名按 patch ID 合并，计算 support count $c_k(a)$，再以 coverage-first round robin 排序（每个失败家族先各贡献一个候选）。输出为有序候选集 $A_k$。\n\n**步骤 4 — WHETHER to persist（训练侧预筛）（§3.3）。** 输入为 $A_k$ 和迭代起始策略 $\\pi_k$。对每个候选 $a$ 构造 $\\pi_k[a] = \\pi_k \\oplus a$，在 $D_{\\text{train}}$ 上计算 one-step training gain $\\Delta_{\\text{train}}(a) = \\bar{V}_R(\\pi_k[a]; D_{\\text{train}}) - \\bar{V}_R(\\pi_k; D_{\\text{train}})$。关键设计：所有候选都在同一个 $\\pi_k$ 上评估，使 one-step gain 可直接比较，不受其他候选交互干扰。保留 $\\Delta_{\\text{train}} \u003E 0$ 的候选并按降序排列，输出 $A_k^+$。此阶段仅决定评估顺序，不决定持久化。\n\n**步骤 5 — WHETHER to persist（Replay 侧 promotion）（§3.3, Algorithm 1 Phase 3）。** 输入为排序后的 $A_k^+$、已接受前缀 $P_k[\u003Cj]$ 和 replay 池 $D_{\\text{replay}}$。对第 $j$ 个候选 $a_j$，在当前已接受前缀 $\\pi_k[\u003Cj] = \\pi_k \\oplus P_k[\u003Cj]$ 上评估，计算 replay delta $\\Delta_R^g(a_j | P_k[\u003Cj])$ 和 $\\Delta_C^g(a_j | P_k[\u003Cj])$。接受条件为 AND 规则：$\\Delta_R^g \\geq \\varepsilon_R = -0.05$ 且 $\\Delta_C^g \\geq \\varepsilon_C = -0.10$。接受则前缀推进 $P_k \\leftarrow P_k \\| (a_j)$，下一个候选在新前缀上评估；拒绝则前缀不变。这一步是论文的核心创新：每个候选在它真正会持久化的 policy state 上被测试，而非在孤立 $\\pi_0$ 上。Replay 池支持 static（仅 $D_{\\text{core}}$）和 adaptive（$D_{\\text{core}} \\cup D_{\\text{hard}} \\cup D_{\\text{recent}}$）两种模式。\n\n**步骤 6 — 策略更新与多迭代（§3.4, Algorithm 2）。** 输入为本轮接受的有序 patch 序列 $P_k$。更新 $\\pi_{k+1} = \\pi_k \\oplus P_k$；若无 patch 被接受则 $P_k = \\emptyset$，patience counter 递增。连续两次无接受则停止外循环。最终输出 $\\pi_{\\text{final}} = \\pi_0 \\oplus P$，其中 $P$ 是所有迭代接受的 patch 按序拼接。所有接受的 patch 形成 auditable、rollbackable 的 checkpoint。\n\n### § 6 核心数学推导\n\n论文不包含传统定理证明，但有一套形式化的优化目标与关键定义，其核心逻辑如下。\n\n**复合 reward（Eqn. 2）。** 每条轨迹 $\\tau$ 获得有界复合 reward $R(\\tau; x) = \\rho(S(\\tau), C(\\tau), E(\\tau), K(\\tau))$，其中 $S$ 为 service validation success（0/1），$C$ 为 workflow correctness（[0,1]），$E$ 为 edit efficiency（[0,1]），$K$ 为 normalized execution cost（[0,1]）。Intuition：executable workflow 的质量是多维的——仅通过 validation 不够，还需结构正确、编辑不越界、执行开销可控。修改任务的具体公式为 $R_{\\text{mod}} = 0.3S + 0.3C + 0.2SC + 0.1E - 0.1K$，其中交互项 $SC$ 奖励同时正确且通过验证的 workflow。\n\n**Prefix-conditioned marginal effect（Eqn. 6）。** 对候选 patch $a$、已接受前缀 $P$、指标 $X$ 和任务池 $D$，定义 $\\Delta_X^{[g]}(a | P; D) = V_X^{[g]}(\\pi_0 \\oplus P \\oplus a; D) - V_X^{[g]}(\\pi_0 \\oplus P; D)$。Intuition：一个 patch 的价值不是绝对的，而是相对于它将被插入的 policy state 的边际效应。同一个 patch 在 $\\pi_0$ 上可能有益，但在已接受若干 patch 后可能有害——这正是论文标题\"global ripples\"的数学表达。\n\n**Persistent-editing objective（Eqn. 7）。** 理想目标是找到有序 patch 序列 $P = (a_1, \\ldots, a_t)$，最大化训练池上的 reward，同时要求每个 patch 在 replay 池上、相对于其前缀 $P[\u003Cj]$ 满足 reward 和 correctness 的 tolerance 约束。Intuition：这是一个带约束的序列优化问题，而非一次性选择问题。穷举搜索所有有序子集的代价过高（每个评估都需要新的 tool-calling rollout），因此 RIPPLE 用贪心顺序评估来近似。\n\n**Acceptance condition（Eqn. 19）。** $\\text{Accept}(a_j | P_k[\u003Cj]) \\iff \\Delta_R^g(a_j | P_k[\u003Cj]) \\geq \\varepsilon_R \\wedge \\Delta_C^g(a_j | P_k[\u003Cj]) \\geq \\varepsilon_C$。Intuition：使用 AND 规则而非 OR，因为 reward 和 correctness 是独立的可容许条件——OR 会允许一个指标任意退化只要另一个通过。阈值设为负值（$-0.05, -0.10$）而非严格改进，因为 replay 效应来自小池上的少量 rollout，允许小幅回归避免因 rollout variation 误拒有用 patch。但这是 marginal 而非 cumulative 控制：每次决策相对于最新前缀，小退化可累积。\n\n### § 7 实验设计与结论\n\n论文围绕四个研究问题（RQ1–RQ4）设计实验，在自建的 Flow-HO benchmark（39 个 held-out workflow modification 任务，4 个 ground-truth family，与训练/replay 完全不相交）上评测。\n\n**RQ1: 跨 backbone 有效性。** 问题：RIPPLE 能否在不同能力水平的 frozen backbone 上提升 held-out workflow 质量？实验在 Claude Haiku 4.5（primary）、Gemma 3-12B（upper-headroom）、Ministral 3-14B（lower-headroom）上比较 base $\\pi_0$ 与 RIPPLE，使用 $N=3$ rollout 和 family-cluster bootstrap。答案：RIPPLE 在三个 backbone 上均提升 service-validation success（Haiku +23.1 pp，Gemma/Ministral 各 +6.8 pp）和 composite reward，workflow correctness 基本持平。增益主要由 validation success 驱动，且在四个 family 中至少三个改善。Transfer backbone 复用 Haiku 的 proposer、patch library 和 gate tolerance 而无 backbone-specific tuning，证明 untuned transfer。\n\n**RQ2: Replay 设计与迭代深度。** 问题：aggregation、replay maintenance、gating 和 iteration depth 如何影响 patch 接受和策略质量？实验在 Haiku 上消融五个变体：RIPPLE-U（uniform + adaptive）、RIPPLE-S（balanced + static）、Coverage-Adaptive（balanced + adaptive）、Train-Only（无 replay gate）、Multi-Iteration（$k\u003E1$）。答案：RIPPLE-U 最优（reward 0.644）；uniform aggregation 和 static replay 均优于 Coverage-Adaptive。Train-Only 达到相似 aggregate performance 但接受了更宽的 patch 集（含被 replay 拒绝的 edit），说明相似 held-out 均值可掩盖实质不同的 persistent policy。Multi-Iteration 增加两个 patch 却低于其单迭代 parent，证明更多 adaptation 非固有更好——persistent performance 取决于哪些 edit 存活、它们的顺序和交互，而非 patch 数量或迭代深度。\n\n**RQ3: 检测破坏性 edit 交互。** 问题：advancing replay baseline 能否检测并拒绝孤立有益但 composition 后有害的 edit？实验隔离 F2a patch（限制 resource lookup 仅用于新引入的 reference），对比其在 $\\pi_0$ 上的 training gain 与在已接受四 patch 前缀上的 replay effect。答案：F2a 在 $\\pi_0$ 上 $\\Delta_{\\text{train}} = +0.0465$（通过预筛），但在前缀 $(F3a, F6c, F6b, F6d)$ 上 replay reward 下降 0.2257、correctness 下降 0.1218、validation success 从 35.4% 降至 0%。机制：F6c 要求所有 referenced resource 解析为具体值，而 F2a 豁免已存在于 corrupted input 中的 identifier，允许 stale value 存活至发布。Advancing-baseline replay 暴露此失败并在持久化前拒绝该 patch，直接验证了\"edit quality is policy-context dependent\"。\n\n**RQ4: Promotion 规则与 checkpoint trade-off。** 问题：更严格的 acceptor 如何影响 policy composition 和质量？实验固定 proposer、候选顺序和 replay evidence，仅替换 acceptor：RIPPLE 的 tolerant two-signal gate vs. SkillOpt-style（严格改进）vs. SkillGen-style（paired count threshold）。答案：RIPPLE 接受 4 个 patch；两种 stricter rule 均只保留 F3a，收敛到同一 one-patch checkpoint（Skill-Compact）。Skill-Compact 在 correctness 上高 5.4 pp、reward 高 0.026，但 success 仅差 1.7%，且这些增益特定于 matched acceptor probe。RIPPLE-U 仍是整体最优配置。Post hoc oracle 显示 per-request 选择可从 0.625 提至 0.665，但 request-only selector 无法恢复该 headroom。结论：promotion 是实质性的 policy-construction 决策——更严格 acceptor 产生更紧凑 checkpoint 并改善某些指标，但重塑而非统一提升策略。", "additional_insights": "### § 8 Take-aways\n本文针对 frozen LLM agents 在 executable workflow synthesis 任务中的 prompt-policy editing 问题，提出了 RIPPLE 框架。其核心 take-away 是：prompt 的局部编辑（local edits）会产生全局的下游影响（global ripples），且不同 edits 在组合（composition）后可能相互干扰甚至反转效果。因此，persistent adaptation 必须解决两个决策：从执行反馈中定位“在哪里”修改，以及“是否”在组合后仍安全地保留该修改。RIPPLE 通过将 prompt 分割为固定 segments，利用 deterministic taxonomy 将失败轨迹映射到对应的 segment 并从 versioned library 中检索 bounded patch，实现了 failure-localized 的编辑。在评估是否保留时，RIPPLE 引入了 advancing-prefix replay 机制：每个候选 patch 都在已接受 patches 组成的当前 policy 基础上进行评估，而非仅在初始 policy 上评估，从而暴露 composition 后的 destructive interactions。实验在 Flow-HO benchmark 上验证，RIPPLE 在 Claude Haiku 4.5 上将 service-validation success 提升了 23.1%，并在 Gemma 和 Ministral 两个 weaker backbones 上实现了 untuned transfer。消融实验表明，replay design 和 promotion rules 实质性地决定了最终 policy 的质量，而非简单的 patch 数量或 iteration 深度。特别是，case study 证实了一个在 isolation 下有益的 patch F2a，在 composition 后变为 destructive，被 replay gate 成功拒绝。\n\n### § 9 最脆弱的假设\nRIPPLE 最关键且失败代价最大的假设是：一个预定义的、固定的六类 failure taxonomy（F1-F6）加上一个 versioned patch library，能够充分覆盖 frozen agent 在 workflow synthesis 中的主要失败模式，并且每个失败都能被 deterministic predicates 准确归因到对应的 policy segment。如果这个假设不成立——例如真实场景中的失败是多因素交织、无法被单一 primary label 捕获，或者所需 corrective instruction 不在预定义 library 中——那么整个 localization-and-retrieval 机制就会退化为无效的 patch 匹配，核心贡献（将 open-ended prompt rewriting 转化为 deterministic, typed update）直接失效。论文为这个假设提供的证据仅限于 Flow-HO 这一个 synthetic benchmark 上的 23 个 preregistered library entries，且 taxonomy 是 top-down 构建的，缺乏在更多样化、真实世界任务上的验证。此外，论文承认 F6 的 subfamilies 是在开发过程中迭代添加的（F6e-F6h 针对后续观察到的失败模式），这暗示初始 taxonomy 并不完备，而在真实部署中，unseen failure modes 的出现频率可能远超 synthetic benchmark 中的情况。\n\n### § 10 最小复现实验\n用 1 周时间，可以最小化复现论文最核心的 claim——即 composition 可以反转局部有益 edit 的效果，且 advancing-prefix replay 能检测并拒绝此类 edit。具体方案：不需要构建完整的 workflow synthesis 系统，而是用一个简化的 text-based task（例如 structured JSON generation with validation）配合一个 frozen open-source model（如 Llama 3.1 8B）。首先设计一个 base prompt policy $\\pi_0$，使其在某个 task pool 上有中等成功率。然后手工设计两个 prompt patches：patch A 单独应用时能提升 reward（例如要求 schema lookup before insertion），patch B 单独应用时也能提升 reward（例如限制 resource lookup 范围），但 A+B 组合后 B 会与 A 产生 conflict 导致 reward 下降（模拟 F2a 与 F6c 的 interaction）。测量三个配置的 reward：$\\pi_0 \\oplus A$、$\\pi_0 \\oplus B$、$\\pi_0 \\oplus A \\oplus B$，以及 $\\pi_0 \\oplus A \\oplus B$ 相对于 $\\pi_0 \\oplus A$ 的 marginal delta。如果 $\\Delta_{\\text{train}}(B) \u003E 0$ 但 $\\Delta_g(B | A) \u003C 0$，则支持论文的核心 claim：isolated gain 不蕴含 compositional safety。进一步，实现一个简单的 two-signal replay gate（reward 和 correctness 的 tolerance thresholds），验证 gate 是否拒绝 patch B。如果 gate 成功拒绝 B 而保留 A，则复现了 RIPPLE 的关键机制。整个实验只需约 50-100 个 task instances、3 次 rollouts per task，计算成本可控。", "research_value": "### § 11 最强反例设计\n\n要对该论文进行最有力的攻击，我会设计一个基于“多因素交织失败与语义漂移”的真实世界场景实验，直接挑战其核心假设：固定的六类 deterministic taxonomy 能够准确将失败归因到单一 primary policy segment。具体而言，我会构建一个 Cross-Factor Failure benchmark，其中的任务失败并非由单一策略缺陷引起，而是由 requirement understanding 的语义模糊触发了错误的 tool use，进而导致 schema validation 失败。在这种场景下，RIPPLE 的 predicate-based 诊断会根据“causally earliest”原则将失败标记为 F1 (Clarification) 或 F3 (Schema)，并从 versioned library 中检索对应的 bounded patch 进行 append。然而，由于根本原因是语义层面的耦合误解，针对 F1 或 F3 的局部文本指令不仅无法修复问题，反而会约束 LLM 的推理空间，导致生成出“syntactically valid but semantically hollow”的 workflow。此时，由于外部 validator 仅检查 schema conformance 和 structural correctness，该错误 patch 可能在 replay gate 中获得正向的 reward 和 correctness delta，从而被错误地持久化。这一反例提供了一个具体的替代解释：RIPPLE 在 Flow-HO 上声称的 23.1% 提升并非真正源于“compositional safety”的保障，而是因为该 synthetic benchmark 的失败模式恰好与其 top-down 构建的 taxonomy 正交——即 benchmark 的局限性人为创造了 taxonomy 充分的假象。一旦面对真实世界中 continuous and entangled 的 failure space，deterministic localization 机制会可预测地退化为 misattribution，而 advancing-prefix replay 不仅无法纠正这一错误，反而会将 semantically harmful 的 edits 通过 gate 固化为不可回滚的 technical debt。\n\n### § 12 Follow-up Research Idea\n\n基于 RIPPLE 在 discrete taxonomy 和 static patch library 上的根本局限，我提出一个全新的研究框架：Causal Prompt Topology Optimization (CPTO)。该想法的驱动需求在于，prompt editing 的“global ripples”本质上是 prompt segments 之间以及 prompt 与 execution environment 之间的复杂因果交互，而 RIPPLE 将其简化为离散的 sequential composition test，无法捕捉连续的、非线性的 policy interactions。为了突破这一局限，CPTO 借鉴了结构因果模型 和 causal tracing 技术，不再预定义失败家族或检索静态 patch，而是将 frozen LLM 的 prompt policy 视为一个连续的因果图拓扑，其中 token spans 作为节点，execution trace 中的 tool calls 和 validations 作为观测变量。在方法上，CPTO 首先通过 counterfactual prompting（对特定 prompt span 进行扰动并观察 execution trace 的分布变化）来推断 prompt 内部的 causal dependency graph，识别出哪些 span 真正 causally drive 了特定的 downstream failure。随后，利用 continuous optimization（如 soft prompt tuning 或 embedding-level interventions，即便在 frozen model 下也可作用于 prefix embeddings）在因果图的高 leverage 点上进行梯度-free 的方向性优化，而非 append 离散文本。第一个实验将聚焦于 SWE-bench 等真实世界 coding agent 任务，首先通过 causal tracing 绘制 base prompt 的干预效应图，随后对比 CPTO 与 RIPPLE 在处理 multi-factor failures 时的表现。实验将重点检验 CPTO 是否能在没有预定义 taxonomy 的情况下，自动发现 RIPPLE 无法定位的 cross-segment causal pathways，并生成连续的 policy adjustments。这一提议与已有工作的根本区别在于：它将 prompt adaptation 从 discrete sequence matching 问题重新定义为 continuous causal graph optimization 问题，从而彻底摆脱了人工 taxonomy 和 bounded library 的表达能力束缚。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Manqing Mao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hong Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Samson Koelle\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jie Yuan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhuoer Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"James Feng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yanjun Lin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Daniel Edmiston\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Nikki Lijing Kuang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhecheng Sheng\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Wei Niu\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Amazon, Inc.\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "Prompt-policy editing 提供了一种实用的方法，可以在不更新底层模型的情况下改进合成可执行工作流的智能体。然而，persistent prompt editing 具有两个耦合属性。首先，edit locality 并不意味着 effect locality：局限于单一 policy segment 的修改可能会波及 downstream execution，改变被修改 segment 之外的行为。其次，edit effects 是 composition-sensitive 的：在独立情况下有效的修改在 composition 后可能会相互干扰，导致其中一个或两者失去其益处或变得有害。因此，Persistent adaptation 必须支持两个不同的决策：根据 execution feedback 识别 policy 应该在哪里改变，以及确定产生的修改在 composition 后是否仍然可以安全地持久化。为了应对这些挑战，我们引入了 RIPPLE (Replay-Informed Persistent Policy Localization and Editing)，它将进行修改的位置与 composition 后是否仍然安全分离开来。它诊断 failed trajectories，将每个 actionable failure 映射到 predefined policy segment，并将 correction 限制在 policy 的该部分。随后，RIPPLE 针对相同的 iteration-start policy 评估 candidates 以比较它们的 isolated gains，然后在先前 accepted updates 之后重放有潜力的修改，以揭示 downstream effects 和 interactions。只有在 composition 下仍然安全的修改才会被保留。我们在 Flow-HO 上评估 RIPPLE，这是一个用于 executable workflow synthesis 的 synthetic held-out benchmark。RIPPLE 将 validation success 提高了高达 23.1%，并在另外两个 frozen language-model backbones 上产生了正向收益，同时保持了 edit efficiency 和较低的 execution cost。Targeted interaction analysis 进一步证明了这两个属性：一个 segment-local tool-use 修改改变了 downstream resource resolution 和 validation，而一个在独立情况下有益的修改在 composition 后变得有害。"}, {"title": "Earth-Agent-Pro: Towards Real-World Full-Chain Earth Observation with Agents", "arxiv_id": "2609.12533", "authors": "Zhutao Lv, Chenhao Dang, Yi Feng, Yanpei Gong, Xiaolei Wang, Junyan Ye, Conghui He, Weijia Li", "summary": "Real-world Earth observation (EO) agents must translate high-level scientific questions into executable workflows to acquire observations, prepare data, perform domain computations, and derive conclusions from runtime evidence. Existing EO agents typically start from supplied observations, while benchmarks typically provide prepared inputs or candidate answers, leaving full-chain open-world EO execution largely untested. We present Earth-Agent-Pro, an execution-adaptive Plan-and-Execute framework using expert-authored skills to constrain planning and runtime tool use. Workflow-centered structured memory records planned steps, accepted evidence, and their dependencies, enabling repair of only the affected workflow suffix when runtime evidence invalidates a step. Separate large language model adapters use sequence-level supervised fine-tuning for planner workflow composition and node-level group relative policy optimization with locally verifiable rewards for executor tool-argument grounding. Earth-Bench-Pro instantiates 248 expert-curated task cores as 744 questions under three matched regimes. Its 248 Open-World Execution questions span RGB imagery, spectral observations, and remote sensing products, pairing high-level requests with runtime data requirements, executable trajectories, and open-ended answers grounded in execution evidence. With a shared GPT-5 backbone, Earth-Agent-Pro achieves 66.13% LLM-as-Judge accuracy, exceeding ReAct by 20.95 points in this metric and 24.44 points in Tools-In-Order. Joint adapter tuning raises Qwen3.5-9B LLM-as-Judge accuracy from 38.31% to 50.00%, an 11.69-point gain over the untuned configuration. Planning-only evaluation and execution with the reference workflow show that the adapters improve workflow composition and argument grounding, respectively. Code and datasets will be released soon.", "category": "cs.CL", "cluster": "Workflow Synthesis \u0026 Tool Use", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=16 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一个名为 Earth-Agent-Pro 的执行自适应 Plan-and-Execute 智能体框架。尽管其应用场景是地球观测，但论文的本质是探讨 LLM 智能体的核心机制设计与训练改进，符合“领域是场景，机制才是贡献”的保留原则。\n\n具体而言，论文在以下几个方面高度契合您的研究焦点：\n1. 单智能体能力：论文提出了工作流为中心的结构化记忆，并实现了基于运行时证据的步骤修复机制，这直接对应了智能体的规划、记忆和自我反思能力。\n2. 智能体训练与演化：论文使用了序列级监督微调和节点级群组相对策略优化（GRPO）来分别训练 Planner 和 Executor，属于明确的 Agent Training / RL 范畴，提升了智能体的工具使用和参数对齐能力。\n3. 评估基准：论文构建了 Earth-Bench-Pro，用于评估开放世界中的长周期智能体执行轨迹，这属于对智能体行为和失败机制的评估研究。\n\n因此，该论文深入探讨了智能体的规划、记忆、工具使用及训练方法，完全符合您关于“构建、改进、评估、训练 LLM智能体”的研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是 **open-world EO execution**（开放世界地球观测执行），即给定一个高层科学问题，agent 需要自主完成从问题到答案的完整链条：定位运行时输入、按需获取观测数据、执行数据预处理、进行领域计算，并基于执行过程中产生的证据生成开放式答案。这一问题之所以重要，是因为现实世界的 Earth observation (EO) 分析本质上是高度专家密集的：分析师需要根据目标现象、区域和时段匹配合适的观测数据，选择数据源、产品、波段和采样参数，完成数据获取与预处理，再将其送入领域特定的计算流水线以产出科学量值。这一完整工作流要求同时具备传感器、数据产品、geospatial processing 和领域科学的专业知识，构成了非 EO 社区用户的极高准入门槛，也限制了可复现分析的普及。论文指出，尽管近年的研究已将 EO 能力从单纯解读给定图像扩展到多步分析执行，但现有 agents 通常从预先提供的观测数据出发，现有 benchmarks 则提供准备好的输入或候选答案，导致从用户请求到证据支撑的科学答案这一完整链条从未被系统性地测试和评估。解决这一问题不仅能推动 EO agent 从受控实验环境走向真实世界应用，还能为非专家用户提供可复现的自动化 EO 分析能力。\n\n### § 2 前人工作与不足\n\n该问题此前未被完整解决，现有研究在评测和方法两个层面均存在关键缺口。在评测层面，作者此前的 Earth-Bench 虽然提供了 248 个科学任务核心和轨迹级评估基础，但其从专家准备的本地输入和 multiple-choice questions 出发，将 runtime data discovery 和 open-ended answer generation 排除在评估边界之外。其他 EO agent benchmarks 也各自只覆盖部分链条：OpenEarth-Bench 和 KnowFlow-Bench 包含数据获取或预处理但省略开放式答案评估；OpenEarthAgent、TerraBench 和 EO-Gym 评估开放式答案和工具轨迹但对获取、预处理或定量分析的覆盖不完整；GeoPlan-Bench 隔离了工作流规划但无可执行参考轨迹或运行时获取。这些评测缺口的根本原因在于，此前的 benchmark 设计假设输入数据已由专家准备完毕，而真实 EO 分析中文件、中间产物和工具结果仅在执行过程中才出现，后续操作依赖于上游已接受的证据——这一依赖链在固定输入设定下无法被触发和检验。\n\n在方法层面，MLLM-based EO methods（如 GeoChat、LHRS-Bot、EarthGPT、EarthMarker 等）加强了对给定图像或产品的视觉理解和问答能力，但通常不具备发现外部数据、协调工具使用或在长周期 EO 分析中维护证据的能力。Agent-based EO methods 则存在更具体的结构性不足：早期系统如 RS-ChatGPT、RS-Agent 和 Change-Agent 将 LLM 与视觉模型或专家工具连接以完成感知任务，后续系统如 UnivEarth、ThinkGeo、Earth-Agent、CangLing-KnowFlow 和 HTAM 组织了更广泛的工作流，但它们普遍在广泛或预定义的工具空间上进行规划，缺乏用专家任务技能同时约束工作流构建和运行时工具范围的机制。更关键的是，现有系统将 planning 和 execution 作为统一策略进行优化，没有分离工作流组合与节点级参数 grounding 的预测接口，导致工作流错误与参数错误在长工具链中混合传播，credit assignment 困难。此外，这些系统很少显式维护已接受的证据及其依赖关系作为执行状态演变的一部分，当运行时证据使某一步骤失效时，无法精确定位并修复受影响的工作流后缀，而只能丢弃已有进展重新规划。通用 agent 范式如 ReAct 的 reasoning-action 交错、Voyager 的可复用技能、AFlow 的工作流优化虽提供了规划与工具使用的基础范式，但均未针对 EO 领域的完整链条进行角色特定的对齐训练。因此，工作流组合和节点级参数 grounding 的 role-specific alignment 在此前研究中基本未被探索，这正是论文通过 Planner SFT 和 Executor GRPO 的分离训练所要解决的核心方法缺口。", "core_insight": "### § 3 重建作者的思考路径\n\nEO 分析的本质是一条从科学问题到定量证据的完整链条：分析师需要匹配现象、区域和时期到合适的观测数据，选择数据源、产品、波段和采样参数，获取并预处理数据，然后送入领域特定的计算 pipeline。这个过程要求传感器、数据产品、地理空间处理和领域科学的多重专业知识。一个认真研究这个问题的人会首先注意到，现有工作在这条链条上各自只覆盖了一片段：MLLM-based 方法（如 GeoChat、EarthGPT）能理解已提供的图像或产品，但不发现外部数据、不协调工具使用、不在长周期分析中维护证据；Agent-based 方法（如 ReAct、AFlow、OpenEarthAgent）虽然能选择操作和执行代码，但在广泛或预定义的工具空间上规划，将规划和执行作为统一策略优化，很少用专家任务知识约束工作流构建和运行时工具范围，更少显式维护已接受的证据和依赖关系。与此同时，Benchmark 层面（如 RSVQA、Earth-Bench、GeoPlan-Bench）大多从专家准备的本地输入和多项选择题出发，评估固定输入上的感知能力或孤立的工作流规划，将 runtime data discovery、中间证据链和开放式答案生成排除在评估边界之外。\n\n由此可以识别出一个未被测试的空白地带：open-world EO execution——agent 从一个指定现象、区域和时期的请求出发，必须在运行时定位输入、按需获取观测数据、执行预处理和领域计算，并从执行证据中推导开放式答案。这个设置的核心困难在于执行是动态且依赖驱动的：文件、中间工件和工具结果只在执行期间出现，后续操作依赖上游已接受的证据；当某个步骤被运行时证据证伪时，agent 需要修改后续计划但不能丢弃已验证的执行进度。先前工作中，Voyager 的可重用 skills、ReAct 的推理-行动交替、AFlow 的工作流优化都提供了部分线索，但没有任何一个方法同时解决工具空间约束、证据依赖追踪和局部失败修复这三个问题。作者之前自己的 Earth-Agent 和 Earth-Bench 提供了任务和评估基础，但 Earth-Bench 仍从专家准备的输入和多项选择题开始，留下了 runtime data discovery 和开放式答案生成在评估之外。\n\n从这些观察出发，自然的推演路径是：首先，需要用专家领域知识将庞大的工具空间约束为任务相关的子集，避免 agent 在 112 个工具中盲目搜索；其次，需要将工作流规划与运行时参数 grounding 解耦为两个独立角色，因为单一轨迹目标会将工作流错误与参数错误混合并在长工具链上分散信用分配；第三，需要一种结构化内存将动态工作流与已验证证据及其依赖关系耦合，使后续操作只暴露已接受的上游结果而非整个交互历史；第四，当执行失败时，需要保留成功前缀并仅修复受影响的后缀，而非推翻整个计划；最后，需要一个新的 benchmark 来评估这条完整链条，将科学目标固定而在三种机制下逐步移除参考工作流和准备输入，使评估能够精确测量从指令跟随到自主规划再到开放世界执行的难度梯度。\n\n### § 4 核心 Intuition\n\n先前方法在开放世界 EO 执行中失效，根本原因在于它们在无约束的工具空间中进行规划，且将规划与执行混为一谈，导致工作流错误与参数错误相互污染、错误沿长工具链传播且难以局部纠正。Earth-Agent-Pro 的核心 Intuition 是：用专家 skills 将工具空间约束为任务相关的子集并贯穿规划与执行两阶段，将工作流组合与运行时参数 grounding 解耦为两个独立预测接口分别训练和优化，同时通过以工作流为中心的结构化内存将动态工作流与已验证证据及其依赖关系显式耦合，使得执行失败时只需局部修复受影响的工作流后缀而保留成功前缀——从而将一个高维度的端到端执行问题分解为有约束的规划、有证据基础的局部 grounding 和有边界的修复三个可管理的子问题。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\nEO Task (q, c_req)\n  │\n  ▼\nSkill Router ──► Tool Router ──► Planner ──► W₀, M₀\n(select s)      (T∩A_s→P_s)    (4-role      (init state)\n                                 debate)\n                                               │\n                    ┌──────────────────────────┘\n                    ▼\n           Executor (per node v_i)\n           G_exec → E → V_hyb ─┬─► Accept → M_k.append\n                               ├─► Retry (re-args)\n                               └─► Replace (re-tool)\n                    │ ◄────────────┘\n                    ▼\n              Next node ──(fail)──► Repair: keep prefix,\n                                     revise suffix ──► re-exec\n                    │\n                    ▼\n           Answer Controller ──► Final Answer\n           (evidence check)      (from M_k only)\n\n══ Training: Planner SFT (seq) + Executor GRPO (node) ══\n```\n\n**推理阶段——Skill-Guided Workflow Planning（§IV-B）。** 输入为开放世界 EO 任务的科学查询 $q$ 和运行时数据需求 $c_{req}$。Skill Router 根据查询和上下文从六种专家 skill（spectral analysis、thermal retrieval、product statistics、time-series、RGB perception 等）中选出一种 $s$，每种 skill 定义了允许的工具范围 $A_s$、操作顺序、参数约束和重复规则。Tool Router 随后将全局 112 个工具的目录 $T$ 与 $A_s$ 取交集，得到候选工具集 $P_s$，从而在规划前就排除不相关工具。Planner 在 $P_s$ 上通过四角色 sequential debate（EO procedure specialist → tool schema specialist → benchmark minimalist → skeptical moderator）生成有序工具序列 $\\pi^{plan}$，catalog validator 校验工具存在性和 skill 归属，不通过则反馈重试。输出为初始动态工作流 $W_0$ 和空记忆 $M_0$ 构成的初始状态 $S_0$（正文 Eq. 5）。\n\n**推理阶段——Evidence-Grounded Execution（§IV-D）。** Executor 逐节点推进工作流。对当前节点 $v_i$，argument generator $G_{exec}$ 结合工具 schema、当前节点、active skill 和已接受的 upstream evidence 生成参数，送入执行环境 $E$ 获得观测。Hybrid verification gate $V_{hyb}$ 先执行确定性检查（结构错误、错误标记、batch 覆盖），无法判定的 case 交由 LLM checker 依据 active skill 评估。判定结果有三种：Accept 将结果提交到 $M_k$ 并推进到下一节点；Retry 在当前节点重新生成参数；Replace 从 $P_s$ 中换一个工具。三种操作均局限于当前 attempt，不改变持久状态 $S_k$（正文 Eq. 7-8）。\n\n**推理阶段——Workflow Repair（§IV-D）。** 当某节点所有 in-node attempt 均失败后，Executor 将失败诊断写入该节点并触发局部修复：Planner 从失败节点出发生成候选替换 suffix $V_i$，Executor 校验候选操作不重复早期修复、有执行进展、长度正常后，将成功 prefix 与新 suffix 拼接，旧 suffix 及诊断存入 revision archive $R_k$。修复不改变 $M_k$，仅重新执行失败位置及其后续操作（正文 Eq. 9）。Answer Controller 复用同一修复机制：当所有工具成功但 evidence 仍不完整时（缺少必要计算、时空覆盖不足、单位/数值 scale 错误等），生成可操作诊断并重新打开指定节点；evidence 充足时仅从 $M_k$ 生成最终答案。\n\n**推理阶段——Workflow-Centered Structured Memory（§IV-C）。** 运行时状态 $S_k = (W_k, M_k)$ 贯穿全程。$W_k$ 包含活跃节点序列 $V_k$ 和 revision archive $R_k$；$M_k$ 是按时间排序的 evidence record 集合，每条记录存储已调用工具、参数、观测和 provenance（变量、时间、区域、波段、batch）。该结构使后续操作仅暴露已验证结果，避免从不断膨胀的自由文本交互记录中恢复有效 evidence、失败尝试和待执行操作。\n\n**训练阶段——Dependency-Preserving Data Construction（§V-B）。** 从 248 条 seed workflow 出发，将每条分解为不可变 execution skeleton $\\kappa(z)$（保留工具序列、schema、依赖结构 $G_z$）和可变 instance state $\\mathbf{u}(z)$（位置、时间范围、文件引用等）。LLM 识别可替换 slot 并生成样本级 instantiation program $F_z$，在固定 skeleton 下沿依赖传播替换值，生成保持依赖一致性的新实例。人工审核 slot 规格和程序后批量合成，得到 2,480 条 trajectory，再与 OpenEarthAgent 训练集混合平衡。\n\n**训练阶段——Planner SFT（§V-C）。** 输入为 query、input context、skill guidance 和候选工具 schema 组成的单轮对话；目标序列为 reference tool sequence $\\pi^\\star$ 的 JSON 序列化（仅含 tool_sequence 字段，无参数和观测）。冻结 backbone，仅更新 Planner-specific LoRA，对 prompt token 做 mask，损失 $L_{plan}$ 仅监督 assistant response 的自回归 NLL。\n\n**训练阶段——Executor GRPO（§V-D）。** 输入为当前节点 context 和 prescribed tool 的 schema；策略 $p_{\\psi_E}$ 生成参数字典 $\\hat{\\theta}_i$。Reward 直接将解析后的参数字典与 reference $\\theta_i^\\star$ 比较，无需 learned reward model：包含 key coverage（公共 key 比例）、symmetric-difference penalty（缺失 key 惩罚大于多余 key）、value agreement（递归比较嵌套值及类型，浮点容差 $10^{-6}$）。每组采样 $G=4$ 个候选，组内标准化 reward 得到 relative advantage $\\hat{A}_{i,j}$。总目标结合 GRPO surrogate term、KL 正则和 entropy bonus，冻结 backbone 仅更新 Executor-specific LoRA（正文 Eq. 10）。\n\n**评测阶段。** Earth-Bench-Pro 的三种 regime 逐步移除脚手架：Earth-Bench-IF 提供有序参考工具序列和预处理输入；Earth-Bench-AP 隐藏工具序列但保留预处理输入；Earth-Bench-OW 要求 agent 自行获取/发现数据并生成开放式答案。评测指标包括 LLM-as-Judge accuracy、ROUGE-L、EM（答案质量）以及 Efficiency、TAO、TIO、TEM、Parameter Accuracy（轨迹保真度）。\n\n---\n\n### § 6 核心数学推导\n\n论文的核心形式化围绕 open-world EO execution 的定义和 role-specialized training 的目标函数展开。\n\n**Open-world execution 的形式化（Eq. 3）。** 给定查询 $q$ 和运行时需求 $c_{req}$，第 $i$ 步的工具选择由 policy $f$ 决定，参数生成由 $g$ 决定，最终答案由 evidence-conditioned function $h$ 生成：\n\n$$t_i, \\theta_i = f(g(q, c_{req}, \\text{trace}_{\u003Ci}))$$\n\n其中 $\\text{trace}_{\u003Ci}$ 包含此前所有已接受的工具调用和观测。Intuition：每一步的决策不仅依赖原始请求，还依赖执行过程中累积的 evidence——后续操作必须 ground 在已验证的 upstream 结果上，而非预先准备的静态输入。这与传统 benchmark 中\"输入固定、答案从候选中选择\"的模式根本不同。\n\n**Skill/Tool routing（Eq. 5）。** 候选工具集通过两级路由缩减：\n\n$$P_s = R_{skill}(q, c, s) \\cap R_{tool}(q, c, T \\cap A_s)$$\n\nIntuition：先由 skill 限定领域程序允许的工具子集 $A_s$，再由 tool router 根据任务目标进一步检索，将 112 个工具缩减到 20-30 个。这使 Planner 在一个科学有效且接口兼容的搜索空间上组合 workflow，避免在无约束的工具空间中产生 ambiguous workflow。\n\n**Hybrid verification gate（Eq. 7）。** 对节点 $v_i$ 的第 $a$ 次 attempt，gate 产生决策 $\\delta_{i,a}^{(k)}$ 和反馈 $b_{i,a}^{(k)}$：\n\n$$\\delta, b = V_{hyb}(o_{i,a}, \\text{query}, \\text{args}, \\text{skill}, \\text{workflow})$$\n\nIntuition：先用确定性规则捕获结构错误（error marker、batch 覆盖等），这些规则可快速且无歧义地判定；仅对规则无法判定的 case 才调用 LLM checker，降低验证成本和不确定性。\n\n**Workflow repair（Eq. 9）。** 失败节点 $i$ 后，Planner 生成候选 suffix $\\tilde{V}_i$，Executor 校验后拼接：\n\n$$W_{k+1} = \\text{prefix}(W_k, i) \\oplus \\tilde{V}_i, \\quad R_{k+1} = R_k \\cup \\{( \\text{old suffix}, d_i^{(k)} )\\}$$\n\nIntuition：保留已验证的 successful prefix 避免丢弃有效执行进展，仅替换受影响的 suffix。$M_k$ 不变，因此已接受的 evidence 不会被失败污染。这实现了 bounded adaptation——修复范围被限制在失败点之后，而非从头重新规划。\n\n**Training objective（Eq. 10）。** 总损失结合 Planner SFT 和 Executor GRPO：\n\n$$L_{total} = L_{plan}(x^{(P)}, \\omega^{(P)}) + L_{GRPO}(x^{(E)}, \\omega^{(E)})$$\n\n其中 Planner SFT 是对 reference tool sequence 的自回归 NLL；Executor GRPO 的 surrogate term 为：\n\n$$\\mathbb{E}[\\hat{A}_{i,j} \\cdot \\min(\\rho_{i,j,\\ell}, \\bar{\\rho}_{i,j,\\ell})] - \\beta \\cdot D_{KL}(p_{\\psi_E} \\| p_{ref}) + \\eta \\cdot H(p_{\\psi_E})$$\n\nIntuition：Planner 在 sequence level 学习\"选哪些工具、按什么顺序\"，Executor 在 node level 学习\"给定工具，如何填参数\"。将两个角色的训练信号隔离在各自的 prediction interface 上，避免 monolithic trajectory objective 将 workflow error 和 argument error 混在一起并在长工具链上扩散 credit。GRPO 的组内标准化 advantage 无需单独 critic，KL 正则防止偏离 reference model 过远，entropy bonus 防止过早坍缩。\n\n**Executor reward（Eq. 11）。** 对候选 $j$ 在节点 $i$ 的参数字典，reward 综合三项：\n\n$$r_{i,j} = \\alpha \\cdot \\frac{|K_c|}{m} - \\beta' \\cdot \\frac{|K_d|}{m} + \\gamma \\cdot A_{val}$$\n\n其中 $K_c = K^\\star \\cap \\hat{K}$（公共 key），$K_d = K^\\star \\triangle \\hat{K}$（差异 key），$m = |K^\\star|$。缺失 key 的惩罚大于多余 key，因为缺失既降低 coverage 又增加 symmetric difference。Intuition：在工具身份已由 workflow 固定的前提下，reward 只需评估参数结构和值的正确性，使反馈信号精准对应 argument grounding 这一单一决策界面。\n\n---\n\n### § 7 实验设计与结论\n\n**问题 1：LLM backbone 选择和 role-specialized training 如何影响 Earth-Agent-Pro 的表现？** 作者在 Earth-Bench-Pro 上用 13 个 open-weight 和 3 个 closed-weight backbone 统一评测，并与 fine-tuned Qwen3.5-4B/9B 对比（Table II）。结果显示 GPT-5 在 LLM-as-Judge 上最高（66.13%），但 fine-tuned 9B 在 TAO、TIO、TEM、Parameter Accuracy 上最强，说明答案质量与 workflow fidelity 并不必然同步提升。Role-specialized training 对小模型有一致增益：9B 的 Judge accuracy 从 38.31% 升至 50.00%，4B 的 Judge accuracy 提升 10.89 点，TEM 提升 10.97 点。\n\n**问题 2：Earth-Agent-Pro 与 remote-sensing MLLM 在定量推理上的差距如何？** 作者在 TerraScope 的五个任务类别上以开放式问答（非多选）评测六种 RS MLLM 和 Earth-Agent-Pro（Table III）。RS MLLM 在 boundary detection 和 comparative ranking 上尚可，但在 coverage estimation、area measurement、distance measurement 上急剧下降，distance accuracy 几乎全为零。Earth-Agent-Pro 以 50.58% 平均 accuracy 领先最强 baseline TerraScope 7.98 点，在 area measurement 上优势最显著（31.58% vs. 至多 4.65%）。\n\n**问题 3：Earth-Agent-Pro 的框架优势能否跨 benchmark 迁移？** 作者在 OpenEarthAgent benchmark 上用共享 GPT-5 backbone 对比 ReAct、AFlow、OpenEarthAgent 和 Earth-Agent-Pro（Table IV）。Earth-Agent-Pro 在 Perception、GIS 和全部三个 tool-order 指标上最强，answering accuracy 超过最强 GPT-5 baseline 11.16 点。Fine-tuned 9B 在 GIS 和 AnyOrder 上领先，4B 在 SameOrder 和 Unique 上最佳，表明 role-specialized training 使小模型也能学到可迁移的 workflow pattern。\n\n**问题 4：与通用 agent 相比，领域专用 workflow 是否带来准确率和延迟的双重优势？** 作者在 Spectrum、Products、RGB 三类任务上对比 Codex 和 Manus（Table V）。Earth-Agent-Pro (GPT-5) 以 75.00% 平均 accuracy 超过 Codex 28.33 点，同时将平均延迟从 268.73s 降至 208.64s，在 RGB 任务上完成全部样本。准确率和延迟同时改善，说明任务完成质量的提升不必以更高执行成本为代价。\n\n**问题 5：在严格控制 backbone 的条件下，Earth-Agent-Pro 框架本身的贡献有多大？** 作者在 Earth-Bench-Pro 上用同一 GPT-5 backbone 对比 ReAct、AFlow、OpenEarthAgent（Table VI）。Earth-Agent-Pro 在八项指标中七项领先，LLM-as-Judge 超过最强 baseline 20.95 点，TAO 从 70.47% 升至 87.61%，TIO、TEM、Parameter Accuracy 同步提升，表明改进不仅在于选出合理工具集，更在于保留更多 expert workflow 结构。\n\n**问题 6：Domain skills 对框架的贡献是否独立于 role-specialized training？** 作者在 ReAct 和 Earth-Agent-Pro（base 9B 和 fine-tuned 9B）上分别做 with/without skill 消融（Table VII）。Skills 对轨迹保真度提升最大：base Earth-Agent-Pro 的 TIO 从 61.94% 升至 74.57%，TEM 从 51.71% 升至 67.29%。对 fine-tuned 模型，skills 仍将 Judge accuracy 提升 12.90 点，说明 training 强化的是 learned policy，skills 提供的是 explicit domain procedure 约束，两者在不同层面互补，training 未使 external skill guidance 冗余。\n\n**问题 7：Planner SFT 和 Executor GRPO 各自的贡献能否被分离测量？** 作者设计了三组隔离实验。Adapter composition（Table VIII）显示 Planner tuning 主要提升 workflow 指标，Executor tuning 主要提升答案质量和参数 grounding，两者组合在所有指标上最强。Planning-only evaluation（Table IX）禁用执行，仅评估 Planner 输出的工具序列：tuned Planner 的 TAO 达 92.51%、TIO 达 83.35%、TEM 达 76.14%，分别超过 base Planner 5.81、11.48、9.18 点，超过 GPT-5 3.65、6.97、6.11 点，隔离了 workflow composition 的改进。Oracle-plan execution（Table X）固定参考工具序列、禁用工具替换和 suffix replanning，仅保留 runtime argument grounding：tuned Executor 的 Judge accuracy 从 46.37% 升至 52.82%，Parameter Accuracy 从 34.19% 升至 37.20%，隔离了 argument grounding 的改进。三组实验共同确认两个 adapter 在各自 prediction interface 上提供互补增益。", "additional_insights": "### § 8 Take-aways\n本文提出了Earth-Bench-Pro，一个包含744个问题的全链路Earth observation (EO) agent benchmark，要求agent在open-world环境中自主完成数据获取、预处理、领域计算并生成基于证据的开放式答案。针对此挑战，作者提出了Earth-Agent-Pro框架，通过expert-authored skills约束workflow planning与runtime tool use，并利用workflow-centered structured memory记录步骤、证据及其依赖关系，在运行时证据失效时仅修复受影响的workflow suffix。在训练层面，框架采用role-specific training：Planner使用sequence-level supervised finetuning (SFT)优化workflow composition，Executor使用node-level group relative policy optimization (GRPO)结合locally verifiable rewards优化tool-argument grounding。实验表明，在共享GPT-5 backbone下，Earth-Agent-Pro在Earth-Bench-OW上达到66.13%的LLM-as-Judge accuracy，较ReAct提升20.95个百分点；联合微调Planner和Executor adapters使Qwen3.5-9B的准确率从38.31%提升至50.00%。\n\n### § 9 最脆弱的假设\n本文最核心且失败代价最大的假设是：**由专家预先定义的6种domain skills能够有效约束并覆盖open-world EO execution中的各种任务需求，且这种静态约束不会损害agent在开放世界中的泛化能力。** \n在实际应用中，open-world execution本质上具有高度不可预测性，真实世界的遥感分析可能涉及skill未覆盖的边缘场景、新型数据源或非标准的处理流程。如果任务需求偏离了这6种预定义skill的scope，Skill Router和Tool Router将无法提供有效的约束，导致agent要么无法处理该任务，要么因工具空间受限而产生错误的workflow。论文虽然通过消融实验（Table VII）证明了在当前benchmark内加入skills能显著提升各项指标，且定性案例（Figure 7 Task 3）也承认skill guidance无法完全消除语义层面的tool-selection errors，但缺乏在分布外（OOD）任务或全新EO场景下skills泛化能力的评估。如果该假设不成立，整个框架的约束机制将失效，Earth-Agent-Pro将退化为无约束的planning，其相对于ReAct等baseline的核心优势将不复存在。\n\n### § 10 最小复现实验\n在1周时间内，可以设计一个最小复现实验来验证**Executor GRPO能够提升runtime argument grounding**这一claim，而无需复现完整的Plan-and-Execute框架。\n**数据**：使用Earth-Bench-Pro中的248个Open-World Execution workflows，提取其中的node-level argument records作为训练和评估数据。\n**实现内容**：仅实现Executor的node-level接口。给定一个workflow node及其上下文（包括prescribed tool schema和accepted upstream evidence），使用Qwen3.5-9B作为backbone，训练一个Executor-specific LoRA adapter。训练采用GRPO算法，reward函数基于预测argument dictionary与reference argument dictionary的key coverage、symmetric-difference penalty和value agreement（如论文Eq. 12所定义）。评估时采用oracle-plan execution设置，即固定workflow结构，仅评估argument grounding。\n**测量指标**：在测试集上，比较base Executor和tuned Executor的Parameter Accuracy和LLM-as-Judge accuracy。\n**判定标准**：如果tuned Executor的Parameter Accuracy显著高于base Executor（论文中从34.19%提升至37.20%），且LLM-as-Judge accuracy有所提升（从46.37%到52.82%），则支持该claim；反之则反驳。此实验避开了复杂的动态workflow repair和环境交互，聚焦于模型参数微调的直接效果，适合在有限时间内完成。", "research_value": "### § 11 最强反例设计\n\n如果我要对这篇论文发起最有力的攻击，我会从其**评测集的生态效度**与**单 skill 路由机制的结构性局限**两个维度构造反例，揭示其所谓的“open-world”能力可能只是在同构模板上的过拟合。首先，Earth-Bench-Pro 的 248 个 Open-World Execution questions 是通过 Dependency-Preserving Data Construction 从 248 条 seed workflow 合成的，即在固定的 execution skeleton $\\kappa(z)$ 上替换 instance state $\\mathbf{u}(z)$。这意味着测试集与训练集的 tool sequence 拓扑高度同构。如果我在测试集中引入需要**跨 skill 动态组合**的复合任务（例如：“分析某海域过去十年海表温度异常对周边植被覆盖率的时空滞后影响”），该任务需要先执行 thermal retrieval，再基于其输出空间执行 time-series 分析，最后衔接 spectral analysis。由于框架的 Skill Router 被强制设计为单选路由（$R_{skill}$ 输出单一 skill $s$），Tool Router 随后将工具空间限制为 $T \\cap A_s$，系统将无法在运行时跨越 skill 边界获取所需工具。在这种条件下，Earth-Agent-Pro 要么因工具缺失而触发无意义的 Workflow Repair，要么退化为次优的局部规划，其准确率将出现断崖式下跌。这一反例直接挑战了论文的核心假设：静态的 6 种 skills 无法覆盖真实 EO 分析中司空见惯的多源因果链条，且其高分表现很大程度上依赖于评测集中任务结构的单一性，而非真正的 open-world 泛化能力。\n\n### § 12 Follow-up Research Idea\n\n基于上述局限，我提出一个非增量的研究方向：**Causal Workflow Induction for Open-Ended Skill Evolution**，将 agent 的目标从“在预定义 skill 约束下执行”转变为“从执行反馈中自主发现并形式化新的 skill 因果图”。驱动此想法的局限是：静态预定义 skills 不可避免地成为 open-world 探索的天花板，且 Planner 与 Executor 的分离训练割裂了 workflow composition 与 argument grounding 之间隐含的因果依赖（例如，某个参数的特定取值实际上决定了下一步唯一可行的工具路径）。为了解决这一问题，我们可以借鉴 Causal Discovery 领域的 intervention 机制以及 Hierarchical Reinforcement Learning (HRL) 中的 option discovery 算法。具体而言，不再预定义 $A_s$，而是让 agent 在无约束的工具空间中自由探索，系统通过 counterfactual intervention（干预某一节点的参数或替换工具）观察对下游 evidence 的因果效应，从而自动从成功轨迹中归纳出具有高因果依赖的子图，并将其抽象为新的、层次化的 domain skills。\n\n这一提议与现有工作（如 Voyager 的 skill library 或 AFlow 的工作流优化）存在本质区别：Voyager 依赖代码执行的二值成功信号来积累技能，而本提议引入了结构因果模型（SCM）来量化工具节点间的因果流向，使得 skill 的边界由数据流和物理逻辑决定，而非人为划定或简单的频率统计。第一个实验将设计一个“Zero-skill Open-World Sandbox”：在 Earth-Bench-OW 的基础上，移除所有 6 种预定义 skill 的约束，仅提供 112 个原子工具。对比基线为无约束的 ReAct 和使用静态 skills 的 Earth-Agent-Pro。评估指标不仅包括最终的 LLM-as-Judge accuracy，还引入“Skill Emergence Fidelity”——即 agent 自主归纳出的因果 skill 子图与专家定义的 ground-truth workflow 模式的图编辑距离。如果新框架能在保持答案准确率的同时，自主涌现出跨越原有 6 种 skill 边界的复合 workflow 模式，并在 OOD 复合任务上显著超越静态约束框架，即可证明因果驱动的 skill evolution 是突破 open-world EO 瓶颈的真正路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zhutao Lv\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Chenhao Dang\", \"affiliations\": [3, 4], \"markers\": [\"*\"]},\n    {\"name\": \"Yi Feng\", \"affiliations\": [5], \"markers\": [\"*\"]},\n    {\"name\": \"Yanpei Gong\", \"affiliations\": [6], \"markers\": [\"*\"]},\n    {\"name\": \"Xiaolei Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Junyan Ye\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Conghui He\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Weijia Li\", \"affiliations\": [1, 4], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Tsinghua Shenzhen International Graduate School, Tsinghua University\"},\n    {\"id\": 2, \"name\": \"Sun Yat-Sen University\"},\n    {\"id\": 3, \"name\": \"Shanghai Jiao Tong University\"},\n    {\"id\": 4, \"name\": \"Shanghai Artificial Intelligence Laboratory\"},\n    {\"id\": 5, \"name\": \"Tianjin University\"},\n    {\"id\": 6, \"name\": \"Harbin Institute of Technology\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "现实世界的 Earth observation (EO) agents 必须将高层科学问题转化为可执行的工作流，以获取观测数据、准备数据、执行领域计算，并从运行时证据中得出结论。现有的 EO agents 通常从提供的观测数据开始，而 benchmarks 通常提供准备好的输入或候选答案，使得全链条开放世界 EO 执行在很大程度上未被测试。我们提出了 Earth-Agent-Pro，这是一个执行自适应的 Plan-and-Execute 框架，使用专家编写的技能来约束规划和运行时工具使用。以工作流为中心的结构化记忆记录了规划的步骤、接受的证据及其依赖关系，当运行时证据使某一步骤无效时，能够仅修复受影响的工作流后缀。独立的大型语言模型适配器使用 sequence-level supervised fine-tuning 进行 planner workflow composition，并使用 node-level group relative policy optimization 结合 locally verifiable rewards 进行 executor tool-argument grounding。Earth-Bench-Pro 将 248 个专家策划的任务核心实例化为三种匹配机制下的 744 个问题。其 248 个 Open-World Execution 问题涵盖 RGB 图像、光谱观测和遥感产品，将高层请求与运行时数据需求、可执行轨迹以及基于执行证据的开放式答案配对。在共享 GPT-5 backbone 的情况下，Earth-Agent-Pro 达到了 66.13% 的 LLM-as-Judge 准确率，在该指标上超过 ReAct 20.95 个百分点，并在 Tools-In-Order 上超过 24.44 个百分点。联合适配器调优将 Qwen3.5-9B 的 LLM-as-Judge 准确率从 38.31% 提升至 50.00%，比未调优配置提高了 11.69 个百分点。仅规划评估和使用参考工作流的执行表明，适配器分别改进了 workflow composition 和 argument grounding。代码和数据集即将发布。"}, {"title": "Is Bash All You Need? An Empirical Study of Tool Interfaces for Enterprise Digital Worker Agents", "arxiv_id": "2609.11999", "authors": "Hazel Mak, Susheel Suresh, Sahil Bhatnagar, Barry Wang, Chhaya Methani, Alejandro Gutierrez Munoz", "summary": "In this study, we examine whether a general shell can outperform specialized tools on enterprise tasks. Shell-based agents have shown strong results in coding, but enterprise work also involves moving between applications and services, coordinating with coworkers, and performing professional analysis. We compare five tool interfaces on TheAgentCompany and APEX-Agents using Opus-4.8 and GPT-5.5: typed tools, typed tools plus bash, bash alone, bash with persistent agent-synthesized tools, and programmatic tool calling (PTC), which runs programs whose actions are restricted to a typed tool catalog. Bash alone outperforms typed tools on both benchmarks, improving score by 21.8-24.5 pp on TheAgentCompany and 4.8-7.4 pp on APEX-Agents while using 19-72% fewer total tokens. Adding typed tools or persistent tool synthesis to bash produces no detectable pooled score gain. PTC uses fewer tokens than direct typed calls with broadly similar task performance, but generally underperforms bash alone in both quality and cost efficiency. For enterprise practitioners, these results favor bash alone when arbitrary execution can be isolated and PTC when security or compliance policies require a fixed tool catalog.", "category": "cs.CL", "cluster": "Workflow Synthesis \u0026 Tool Use", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是对 LLM 智能体在不同工具接口下的表现进行实证研究，比较了 typed tools、bash、bash with persistent agent-synthesized tools 等多种工具使用方式。这直接属于“单智能体”研究范畴中的“工具使用”方向。根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents / Multi-Agent LLMs，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。” 该研究通过评估不同工具接口对智能体性能和成本的影响，为理解和改进智能体的工具使用能力提供了重要经验依据。此外，论文中提到的“bash with persistent agent-synthesized tools”也涉及智能体在运行时动态合成工具的机制，与智能体能力构建密切相关。因此，该论文完全符合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n企业智能体究竟需要一套预先定义好的专用工具，还是一个 Bash 命令行就够了？专用工具规定了能做什么、参数如何填写；Bash 则让智能体自己写命令、组合操作。选择哪种接口，会影响任务完成质量、模型调用成本和权限管理。\n\n### § 2 前人工作与不足\n\n已有编程智能体表明，仅靠命令行也能完成复杂操作，但企业任务还需要跨应用协作和专业文档分析，编程场景的结果未必适用。另一类方法让模型写程序来组合调用专用工具，减少逐次调用的开销；它是否比直接使用 Bash 更合适，同样缺少企业场景中的对照证据。本文用相同模型和任务比较这些接口，补上这项评测。", "core_insight": "### § 3 如何理解研究思路\n\n可以把作者的研究思路理解为：先把“工具越丰富越好”当作待验证的问题，再逐步比较只给专用工具、只给 Bash，以及两者组合的效果。随后加入“把经验保存成脚本”和“用程序批量调用工具”，检验复用和编排是否带来额外收益。这是对研究设计的解释，不代表作者真实的思考过程。\n\n### § 4 核心直觉\n\n接口的关键可能是能否方便地组合操作，而非提供多少工具。Bash 允许模型在一次执行中处理多个步骤，只返回有用结果，因此可能减少反复调用和中间信息传递。这能解释实验趋势，但实验尚未单独证明它就是性能差异的原因。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n相同任务、模型与基础提示\n  |\n  v\n分别配置五种接口\n  ├─ 专用工具\n  ├─ 专用工具 + Bash\n  ├─ 仅 Bash\n  ├─ Bash + 可复用脚本\n  └─ 程序化工具调用（PTC）\n  |\n  v\n在两个企业任务基准中执行\n  |\n  v\n比较任务得分、token 用量与推理成本\n```\n\n本文是一项对照研究，没有提出新的训练算法。作者保持模型、任务、基础提示和停止条件一致，只改变工具接口，并为脚本复
