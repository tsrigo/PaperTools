stochasticity，这意味着即使不加任何 feedback，仅仅是将任务重新运行几次，也可能因为采样到不同的路径而偶然获得成功。这就引出了一个根本性的怀疑：当某种 repair 方法提高了任务成功率时，这个提升到底是因为方法真正识别并修复了导致失败的 causal mechanism，还是仅仅因为增加了采样次数从而提高了 stochastic recovery 的概率？现有的评估范式只关注 terminal success，完全忽略了 execution history 的控制，因此无法回答这个问题。 为了打破这个僵局，作者从经典的软件调试领域寻找灵感。在传统调试中，要验证一个 bug fix 是否有效，必须在完全相同的执行状态下施加修改，而不是重新执行整个程序以期望偶然避开错误。这就需要引入 execution replay 技术：记录程序运行到 bug 点之前的所有状态，然后在 replay 时恢复这些状态，只从 bug 点开始改变执行。将这个思路移植到 MAS 中，意味着我们需要拦截并记录 agent 与 LLM 以及外部 tool 交互的所有 boundary，构建出 event-dependency graph。在 replay 时，严格匹配并注入这些历史记录，从而“冻结”失败前的 execution prefix。 但仅仅冻结历史还不够，还需要知道在哪里施加干预。Task-level 的失败标签太粗糙，无法指导具体的逻辑修改。作者注意到，MAS 的失败通常会在 trace 中留下特定的 symptom，比如陷入循环、违反任务约束等。... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# Repair or Resample? Rethinking Failure Debugging in LLM Multi-Agent Systems Zhongwen Luan[1] , Xiaoyu Zhang[2] , Ming Hu[1,3] , Yue Yang[4] , Jiongchi Yu[2,3] , Xiaohong Chen[1] \u003E 1East China Normal University \u003E 2Nanyang Technological University \u003E 3Singapore Management University \u003E 4Xi’an University of Architecture and Technology ``` 10245101408@stu.ecnu.edu.cn ``` ## **Abstract** ## **1 Introduction** As large language model (LLM)-based multi-agent systems (MASs) are increasingly applied to longhorizon complex tasks, their reliability has emerged as the core bottleneck hindering their real-world deployment. Existing MAS debugging and repair methods typically rely on rerunning and resampling the entire execution trajectory. However, a fundamental question remains to be answered: _do these methods causally repair MAS failures or merely stochastically repair by leveraging the randomness...", "additional_insights": "### § 8 Take-aways\n本文质疑了现有 LLM Multi-Agent Systems (MAS) 中依赖 rerun 和 resampling 的修复方法的有效性，指出其可能仅是通过 LLM 采样的随机性实现了 stochastic recovery，而非真正因果性地修复了 failure。为区分这两者，作者提出了 SymTrace 框架，通过记录执行轨迹的 event-dependency graph 并在 replay 时严格匹配和注入历史结果，实现了对 intervention 前置历史的精确重构。基于此框架和包含 536 个人工标注失败轨迹的 SymFail 数据集，实验证明传统的 unguided rerun 方法不仅修复率极低（6.90%），还会破坏原本成功的执行。作为替代方案，作者提出了 Suspicious-Node Intervention，利用 trace-localized symptoms 指导单次干预，将修复率提升至 20.15%，证明了精确的执行控制和局部证据引导比全轨迹重复采样更有效且可靠。\n\n### § 9 最脆弱的假设\n本文最核心且失败代价最大的假设是：SymTrace 的 selective replay 能够精确重构 intervention 前的执行历史，即“内部 MAS 转换在给定相同的 represented state、输入和 boundary result 时是确定性的”（附录 A.3 条件 2）。如果该假设不成立，SymTrace 无法保证前缀的一致性，下游的任何变化都无法被纯粹归因于干预措施，整个评估框架的因果推断基础将彻底崩塌。在实际中，MAS 框架内部可能存在未被捕获的隐藏非确定性，例如并发的线程调度、未受控的随机数生成、依赖 wall-clock timing 的逻辑，或是未被完全序列化的隐藏状态对象。尽管论文在附录 D.3 中通过 content hash 验证了所有 6,159 个重用节点与源记录完全匹配，但这仅证明了“边界结果”和“图拓扑”的匹配，并未直接证明“隐藏的框架内部状态”也完全一致。论文也承认“arbitrary hidden framework objects are not serialized”，这意味着如果框架内部状态转移存在非确定性，即使边界输入输出完全相同，重放后的内部状态也可能已经偏移，导致该假设在复杂的真实 MAS 部署中面临失效风险。\n\n### § 10 最小复现实验\n在一周时间内，可以最小化复现并验证本文“Task-level rerun 方法高度不可靠且主要依赖 stochastic regeneration”这一核心 claim。无需复现完整的 SymTrace 系统，只需从 WebArena-Verified Hard 中选取 50 个长 horizon 任务，使用 AG2 框架和固定的 LLM 运行一次以收集初始执行结果。针对这些任务，提取初始失败的任务集和初始成功的任务集。随后，对这两组任务在相同配置下分别进行 3 次 Unguided Full Rerun。测量两个关键指标：初始失败任务在 3 次重试中的修复率（pass@3），以及初始成功任务在 3 次重试中的回归失败率。如果实验结果显示失败任务的修复率极低（例如低于 10%），同时初始成功的任务出现了显著的回归（例如超过 30% 的案例在重试中失败），则强有力地支持了论文的 claim，证明 task-level rerun 确实是在进行随机重采样而非因果修复，且会破坏执行稳定性。反之，若修复率高且回归率极低，则反驳了该 claim。", "research_value": "### § 11 最强反例设计\n要对该论文进行最有力的攻击，我会在真实复杂 MAS 部署中构造一个包含“隐式状态依赖”的反例，直接挑战 SymTrace selective replay 的确定性假设。具体而言，设计一个包含并发 agent 通信与动态 memory 更新的场景：agent A 和 agent B 通过共享黑板（blackboard）异步交互，且 agent 内部维护一个未被 SymTrace 序列化的 working memory buffer，该 buffer 的内容会根据前序 LLM 调用的 token 消耗量或 wall-clock timing 动态截断。在这个场景下，即使 SymTrace 在 boundary result 和图拓扑上实现了完美匹配，agent 内部的隐藏状态实际上已经发生了偏移。此时，对下游节点施加 Suspicious-Node Intervention，其声称的 20.15% 修复率提升将无法被纯粹归因于局部症状引导的因果修复。相反，这 20.15% 的成功率可能仅仅是因为干预操作打断了原有的隐式状态累积，无意中重置了导致失败的隐藏上下文，本质上仍是一种由干预引发的 advanced stochastic recovery。为了验证这一替代解释，我可以设计一个 A/B 测试实验：在相同的失败前缀上，不仅执行论文提出的基于 trace-localized symptoms 的 Suspicious-Node Intervention，还执行一种“无信息随机干预”（即随机选择一个节点注入无意义的扰动）。如果在这个包含隐式状态依赖的复杂场景中，随机干预也能获得与 symptom-driven intervention 相当的修复率，就能强有力地证明 SymTrace 评估框架的因果推断基础已经崩塌，其修复效果并非源于因果修复，而是系统对隐藏状态扰动的随机响应。\n\n### § 12 Follow-up Research Idea\n基于 SymTrace 在处理隐藏非确定性状态时的核心局限，我提出一个全新的研究框架：Probabilistic Causal Debugging via State-Distribution Alignment。该想法放弃了 SymTrace 追求的“单条轨迹确定性重放”这一在真实复杂 MAS 中无法实现的目标，转而接受 MAS 内部状态的不可观测性与非确定性。（a）这一提议由现有方法无法序列化 arbitrary hidden framework objects（如动态 memory、并发线程状态）的未满足需求驱动，传统的 point estimate 评估在状态偏移下极其脆弱。（b）为实现这一目标，可借鉴因果推断领域的 Structural Causal Models (SCMs) 以及软件工程中的 Metamorphic Testing 思想，不再试图固定历史，而是通过多次采样的状态分布来量化干预的因果效应。（c）第一个实验将这样设计：选取一组具有高内部非确定性的 MAS 失败任务，不进行 selective replay，而是对干预前和干预后的系统分别进行 $N$ 次完整采样，构建下游关键执行状态的分布。随后，使用 Maximum Mean Discrepancy (MMD) 或 Wasserstein distance 测量干预前后状态分布的偏移。如果某种干预是真正的因果修复，它应使失败状态分布显著且稳定地偏移向成功状态分布；若仅是 stochastic recovery，则状态分布偏移将呈现随机性。这一框架将 MAS 调试从“轨迹级精确复现”转向“分布级因果效应估计”，彻底绕开了隐藏状态不可序列化的死结，为非确定性系统的可靠性评估开辟了全新方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zhongwen Luan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiaoyu Zhang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Ming Hu\", \"affiliations\": [1, 3], \"markers\": []},\n    {\"name\": \"Yue Yang\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Jiongchi Yu\", \"affiliations\": [2, 3], \"markers\": []},\n    {\"name\": \"Xiaohong Chen\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"East China Normal University\"},\n    {\"id\": 2, \"name\": \"Nanyang Technological University\"},\n    {\"id\": 3, \"name\": \"Singapore Management University\"},\n    {\"id\": 4, \"name\": \"Xi'an University of Architecture and Technology\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "随着基于 large language model (LLM) 的 multi-agent systems (MASs) 越来越多地应用于长周期复杂任务，其可靠性已成为阻碍其在现实世界中部署的核心瓶颈。现有的 MAS 调试与修复方法通常依赖于重新运行和重采样整个执行轨迹。然而，一个根本问题仍有待回答：这些方法是因果地修复了 MAS 故障，还是仅仅通过利用 LLM 采样的随机性来进行随机修复？为了评估 MAS 修复方法的有效性，我们引入了 SymTrace，这是一个受控评估框架，用于记录 MAS 执行轨迹并建立干预锚点。在重放期间，它使用记录的日志有效地重建锚点之前的执行，并仅重新生成下游轨迹，从而实现 MAS 故障的可靠复现。我们进一步构建了数据集 SymFail，包含 536 条人工标注的故障轨迹，并带有图关联的位置、类别和追踪证据。基于这些基础，我们在三个主流 MAS 框架上进行了大规模实证研究。我们的发现表明，现有的无引导重运行方法高度不可靠，表现出较低的故障复现率和修复率（分别仅为 67.97% 和 6.90%）。在这些发现的基础上，我们进一步探索了一种症状驱动的干预方法的有效性，该方法成功修复了 20.15% 的失败案例（相比 state-of-the-art 修复方法提升了 191.89%）。本研究旨在为 MAS 调试与修复研究提供可操作的见解，为 multi-agent systems 的稳健部署铺平道路。"}, {"title": "Candidate supply and answer selection shape the value of LLM judging in multi-agent systems", "arxiv_id": "2608.25937", "authors": "Jia-Hao Ji, Sijie Li, Jiabei Cheng, Zixi She, Jin-Tai Yu, Zhiyuan Yuan", "summary": "Multi-agent systems (MAS) sometimes already have the potential to answer correctly, but still report a wrong answer. Explaining this outcome is difficult because generation, communication and final answer-selection rules usually change simultaneously. We conceptualize multi-agent reasoning as an evolutionary pipeline of candidate generation, peer communication and terminal selection, wherein consensus without quality control can exhibit patterns of memetic drift. We study two questions: (1) when an LLM judge provides effective selection pressure by supplying a signal of answer correctness for candidates generated in a multi-agent system, and (2) when using that signal improves the reported answer. To map judge reliability, we analysed 15,336 questions from MMLU-Pro, GPQA, MedXpertQA and MuSR, with Humanity's Last Exam analysed separately. To test these rules, we replayed 81,390 fixed candidate pools drawn from 16,278 questions across five benchmarks. We report three findings. (1) A correct answer is often already present among the generated candidates, but the system can still converge on and report a wrong answer. (2) Judge reliability is not a fixed trait of the model, but varies with the task, the generator and how rare the correct answer is. (3) Combining answer frequency with the judge's evaluation changed only the final answer-selection rule and raised accuracy from 63.82% to 70.82-70.95%, primarily by rescuing correct answers that were outnumbered by popular errors. In the systems studied here, the value of generating more candidates depends on whether those extra samples make correct answers present, frequent or recognisable. By isolating generation, recognition and selection, these findings establish a diagnostic basis for designing multi-agent architectures that protect generated correct answers from being lost.", "category": "cs.AI", "cluster": "Multi-Agent Systems", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Multi-Agent)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是对多智能体系统（MAS）中推理与答案选择机制的深入分析和改进。论文将多智能体推理概念化为一个包含候选生成、同伴通信和终端选择的演化管道，并研究了LLM作为评判者如何提供有效的选择压力来提升系统最终输出的准确性。这属于对多智能体系统行为分析、失败机制诊断以及协作机制的改进。\n\n根据筛选标准第一步，论文的研究对象明确是 Multi-Agent LLMs，虽然它主要是行为分析和评估研究，但其结论直接帮助理解多智能体系统中的共识机制（如 memetic drift）并提出了改进最终答案选择规则的方法，以防止正确答案在协作中被丢失。这完全符合“结论直接帮助理解或改进智能体能力”的保留条件。\n\n在第二步正面指标中，论文明确涉及了 Multi-Agent Systems (MAS) 和多智能体间的 Collaboration (peer communication, consensus) 机制。虽然论文提到了“designing multi-agent architectures”，但其核心不在于讨论拓扑结构或通信协议等系统工程问题，而是聚焦于智能体协作中的决策与选择机制，因此不被第三步的排除标准所排除。\n\n综上所述，该论文紧密契合“多智能体”这一研究方向，为理解和改进LLM多智能体系统的协作效果提供了有价值的机制分析与优化方案，符合研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文聚焦于多智能体系统（multi-agent systems, MAS）中一个被长期忽视的悖论：系统已经生成了正确答案，但最终仍报告错误答案。作者将多智能体推理形式化为一个由 candidate generation、peer communication 和 terminal selection 三个功能阶段组成的进化流水线，并提出两个核心问题：(1) LLM judge 在何种条件下能为 MAS 中生成的候选答案提供有效的 selection pressure（即正确性信号）；(2) 利用该信号在何种条件下能真正改善最终报告的答案。这一问题的重要性在于，MAS 正被广泛用于推理、规划、软件编写和复杂任务协调，但现有系统比较通常同时改变 candidate generation、communication、topology 和 answer selection，导致系统级准确率提升无法归因到具体操作。这种归因能力的缺失已成为 multi-agent AI 的核心 transparency 问题。更关键的是，当 agents 重复同一个 plausible error 时，majority voting 会压制频率较低的正确候选答案，而无质量过滤的 peer interaction 会通过 memetic drift 和 majority-biased cascade 放大流行错误，形成 generation–retention bottleneck。解决这一问题不仅能诊断正确答案在流水线哪个阶段丢失，还能为设计能保护已生成正确答案的多智能体架构提供可操作的诊断基础。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决，核心原因是大多数 MAS 研究在比较系统时同时改变多个机制，使得无法隔离各操作的贡献。Du et al. 让模型实例交换论点，Chen et al. 引入 confidence-weighted round table，Hong et al. 分配专业化角色，其他系统通过 dynamic 或 searched workflows 路由信息——但这些系统在提升准确率的同时，无法说明增益来自更多采样、agent 间交流还是 answer selection 规则。Choi et al. 发现 majority voting 占了 multi-agent debate 中大部分通常被归因的增益，Wang et al. 和 Li et al. 进一步证明独立采样和投票无需交流即可改善推理。然而，这些工作虽然揭示了交流的边际贡献有限，却未进一步追问：当正确答案已被生成但处于少数时，系统为何仍报告错误答案？Smit et al. 发现交流的益处跨设置不可靠，Kim et al. 在受控 token 预算下表明其价值随任务和模型能力变化，但二者均未将 candidate generation 的供应问题与下游 answer selection 的保留问题分离。近期工作通过 structured reasoning-tree auditing 和 hidden-state selection 试图为少数正确答案提供路径，但仍未系统量化 judge reliability 如何随 candidate availability、task 和 generator 变化，也未在固定候选池上隔离 terminal selection 的独立贡献。根本不足在于：前人未将\"judge 能否识别正确答案\"与\"answer-selection 规则能否利用该信号\"作为两个独立瓶颈分别评估，因此无法诊断正确答案究竟是在 generation 阶段缺失、在 recognition 阶段失败、还是在 selection 阶段被多数错误压制。本文通过 offline replay 固定候选池、分离 ranking benchmark 与 selection rule 实验，首次系统填补了这一评测缺口。", "core_insight": "## § 3 重建作者的思考路径\n\nMAS 领域有一个被广泛承认但未被充分解释的 transparency 问题：大多数系统比较同时改变了 candidate generation、peer communication、topology 和 answer selection，导致无法归因系统级提升的真正来源。一个认真的研究者面对这个局面，首先会注意到一个 paradox——多个 agents 可以集体生成正确答案，但系统最终报告错误答案。这个 paradox 在已有文献中已有零散线索：Choi et al. 发现 multi-agent debate 的大部分增益其实来自 majority voting 而非辩论本身；Wang et al. 和 Li et al. 证明独立采样加投票无需通信即可改善推理；Smit et al. 和 Kim et al. 则指出通信的益处不稳定且依赖 task 和 model capability。更关键的是，当 agents 重复同一个 plausible error 时，voting 会系统性压制出现频率较低的正确答案——这恰好解释了 paradox 的一半：正确答案被生成了，但被 popularity-based 的 aggregation 规则丢弃了。\n\n从理论侧看，文化进化文献中的 memetic drift 概念提供了一个现成的解释框架：没有 quality filter 的 peer interaction 中，随机变异会给某个 rationale 早期优势，重复的 peer adoption 将其放大为 majority-biased cascade。这与生物进化中 stochastic drift 压倒 fitness 的机制高度类似。生物进化的解决方案是 selection pressure——保留更高 fitness 的 variants。将这个类比映射到 MAS，对应的解决方案就是 correctness-sensitive selection pressure：一个独立于 popularity 的外部信号来评估 candidate 的内容质量。LLM judge 恰好可以提供这种信号，但已有研究也表明 LLM judge 存在 position bias、length bias 和 self-preference 等系统性偏差，其可靠性不应被视为模型的固定属性。\n\n由此自然产生一个关键的方法论分离：要理解 MAS 何时丢失正确答案，必须将三个功能阶段拆开——candidate generation 是否产生了正确答案、LLM judge 能否在 plausible errors 中识别正确答案、answer-selection rule 是否有效利用了 judge 的信号。现有工作将这三者混在一起评估，因此无法定位 failure 发生在哪一环。一旦做出这个分离，就可以提出三个可检验的预测：正确答案被生成但仍被丢失（retention bottleneck）、judge reliability 随 correct-answer availability 和 generator 变化、judge 信号在正确答案被 outnumbered 时最有价值而在 majority voting 已经可靠时价值递减。这三个预测分别对应 generation、recognition 和 selection 三个 bottleneck，构成了整篇论文的实验骨架。\n\n## § 4 核心 Intuition\n\nMAS 的准确率受三个可分离的 bottleneck 约束：candidate generation 是否产生正确答案、LLM judge 能否在 plausible errors 中识别它、answer-selection rule 是否利用该信号将其保留到最终输出。没有 quality filter 的 peer communication 会触发 memetic drift，使 popular errors 通过 majority-biased cascade 压倒少数正确答案，造成\"已生成却未保留\"的 failure mode。将 answer frequency 与 judge 的 content-based ranking 结合为 terminal selection rule，可以在不改变 generation 和 communication 的前提下，为被 outnumbered 的正确答案提供一条通往最终输出的路径——而这正是纯粹 majority voting 无法做到的。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Candidate supply and answer selection shape the value of LLM judging in multi-agent systems》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文聚焦于多智能体系统（multi-agent systems, MAS）中一个被长期忽视的悖论：系统已经生成了正确答案，但最终仍报告错误答案。作者将多智能体推理形式化为一个由 candidate generation、peer communication 和 terminal selection 三个功能阶段组成的进化流水线，并提出两个核心问题：(1) LLM judge 在何种条件下能为 MAS 中生成的候选答案提供有效的 selection pressure（即正确性信号）；(2) 利用该信号在何种条件下能真正改善最终报告的答案。这一问题的重要性在于，MAS 正被广泛用于推理、规划、软件编写和复杂任务协调，但现有系统比较通常同时改变 candidate generation、communication、topology 和 answer selection，导致系统级准确率提升无法归因到具体操作。这种归因能力的缺失已成为 multi-agent AI 的核心 transparency 问题。更关键的是，当 agents 重复同一个 plausible error 时，majority voting 会压制频率较低的正确候选答案，而无质量过滤的 peer interaction 会通过 memetic drift 和 majority-biased cascade 放大流行错误，形成 generation–retention bottleneck。解决这一问题不仅能诊断正确答案在流水线哪个阶段丢失，还能为设计能保护已生成正确答案的多智能体架构提供可操作的诊断基础。 ### § 2 前人工作与不足 该问题此前未被充分解决，核心原因是大多数 MAS 研究在比较系统时同时改变多个机制，使得无法隔离各操作的贡献。Du et al. 让模型实例交换论点，Chen et al. 引入 confidence-weighted round table，Hong et al. 分配专业化角色，其他系统通过 dynamic 或 searched wor...\n2. 核心操作：方法部分围绕这一洞察展开：## § 3 重建作者的思考路径 MAS 领域有一个被广泛承认但未被充分解释的 transparency 问题：大多数系统比较同时改变了 candidate generation、peer communication、topology 和 answer selection，导致无法归因系统级提升的真正来源。一个认真的研究者面对这个局面，首先会注意到一个 paradox——多个 agents 可以集体生成正确答案，但系统最终报告错误答案。这个 paradox 在已有文献中已有零散线索：Choi et al. 发现 multi-agent debate 的大部分增益其实来自 majority voting 而非辩论本身；Wang et al. 和 Li et al. 证明独立采样加投票无需通信即可改善推理；Smit et al. 和 Kim et al. 则指出通信的益处不稳定且依赖 task 和 model capability。更关键的是，当 agents 重复同一个 plausible error 时，voting 会系统性压制出现频率较低的正确答案——这恰好解释了 paradox 的一半：正确答案被生成了，但被 popularity-based 的 aggregation 规则丢弃了。 从理论侧看，文化进化文献中的 memetic drift 概念提供了一个现成的解释框架：没有 quality filter 的 peer interaction 中，随机变异会给某个 rationale 早期优势，重复的 peer adoption 将其放大为 majority-biased cascade。这与生物进化中 stochastic drift 压倒 fitness 的机制高度类似。生物进化的解决方案是 selection pressure——保留更高 fitness 的 variants。将这个类比映射到 MAS，对应的解决方案就是 correctness-sensitive selection pressure：一个独立于 popularity 的外部信号来评估 ca... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：## **Candidate supply and answer selection shape the value of LLM judging in multiagent systems** Jia-Hao Ji[1#] , Sijie Li[2,4#] , Jiabei Cheng[2,3#] , Zixi She[2] , Jin-Tai Yu[1*] , Zhiyuan Yuan[2,4*] 1Department of Neurology and National Center for Neurological Diseases, Huashan Hospital, State Key Laboratory of Medical Neurobiology and Ministry of Education Frontiers Center for Brain Science, Shanghai Medical College, Fudan University, Shanghai 200040, China. 2Institute of Science and Technology for Brain-Inspired Intelligence, MOE Key Laboratory of Computational Neuroscience and Brain-Inspired Intelligence, MOE Frontiers Center for Brain Science, Fudan University, Shanghai 200433, China. 3School of Automation and Intelligent Sensing, Shanghai Jiao Tong University, Shanghai 200433, China. 4Shanghai Academy of Artificial Intelligence for Science, Shanghai 200003, China. #These authors...", "additional_insights": "### § 8 Take-aways\n这篇论文将 multi-agent systems (MAS) 的推理过程解耦为 candidate generation、information evolution 和 terminal selection 三个阶段，揭示了系统即使生成了正确答案也可能在最终报告时丢失的 generation-retention bottleneck。这种瓶颈源于无质量控制的 peer communication 引发的 memetic drift 和 majority-biased cascades，导致流行的错误答案淹没少数正确的候选答案。研究指出，LLM judge 的可靠性并非静态模型属性，而是随任务、generator 以及正确答案的可用度（$p_{gen}$）动态变化；当正确答案稀缺时，judge 的 ranking 甚至低于随机水平。通过在 81,390 个固定候选池上进行 offline replay，论文证明将 answer frequency 与 judge 的 ranking 信号结合（如 rank-power weighting）能将准确率从 63.82% 提升至 70.82–70.95%，有效挽救被多数错误答案压制的少数正确答案。此外，test-time compute scaling 改变了 voting 与 judging 的成本效益权衡：在小候选池中引入 judge 的边际成本极低且收益巨大，而随着候选池增大，正确答案更容易通过 majority voting 自行胜出，judge 的附加价值随之衰减。\n\n### § 9 最脆弱的假设\n论文最核心且失败代价最大的假设是：LLM judge 能够基于 candidate rationales 的内容提供独立于 answer frequency 的 correctness-sensitive selection pressure，并且这种在 offline 静态池上测得的 ranking 信号能直接转化为系统级准确率的提升。在实际应用中，这个假设可能不成立，因为 LLM judge 极易受到 length bias、position bias 和 self-preference 等系统性偏差的影响。如果 generator 生成的错误 rationales 在表面上比正确 rationales 更长或更具结构化特征，judge 的 ranking 将退化为对表面特征的匹配，而非真正的逻辑验证。此外，论文的 offline replay 隔离了 terminal selection，忽略了 live multi-agent 交互中 receiver-mediated local selection 和 transformation 对候选分布的动态改变。如果 judge 在面对动态交互后产生的高度同质化或对抗性 rationales 时，其 ranking 可靠性下降，那么基于静态池设计的 hybrid selection rules 将无法挽救正确答案。论文通过 information perturbation 实验提供了部分证据，证明打乱 rationale-answer 对应关系会使 rank AUC 降至 0.482（接近随机），表明 judge 确实依赖内容的逻辑连贯性；但论文缺少在真实多轮动态交互环境下的端到端验证，无法完全排除交互动态性导致 judge 失效的风险。\n\n### § 10 最小复现实验\n在一周时间内，可以最小化复现“结合 answer frequency 与 judge ranking 能挽救被多数错误答案淹没的少数正确候选”这一核心 claim。首先，从 MedXpertQA 测试集中随机抽取 500 道题，使用 DeepSeek-V4-Flash (Preview) 在 temperature 1.0 下为每道题独立生成 8 个 candidate traces（包含 answer 和 rationale）。筛选出正确答案存在但处于少数（即 $0 \u003C p_{pool} \u003C 0.5$）的题目，这些题目构成了 majority voting 失效的场景。接着，使用同一个 LLM 作为 judge，在 temperature 0.0 下对这 8 个匿名 rationales 进行 ranking（不提供答案选项和正确性标签）。实现两种 terminal selection 规则：纯 majority voting（$t=0$）和 hybrid rule（如 $t=2$ 的 rank-power weighting，$w_i = (k-i)^t$）。测量这两种规则在筛选出的子集上的准确率。如果 hybrid rule 的准确率显著高于 majority voting，则支持论文的 claim，证明 judge 信号能有效识别并提升少数正确答案；如果两者准确率无显著差异或 hybrid rule 表现更差，则反驳了该 claim，表明 judge 在正确答案稀缺时无法提供有效的 selection pressure。此方案无需构建完整的 multi-agent 通信拓扑，仅依赖独立采样和 offline replay，即可在有限资源下验证核心机制。", "research_value": "### § 11 最强反例设计\n\n要对该论文的核心 claim 进行最有力的攻击，我会在真实多轮动态交互的 multi-agent debate 场景下设计一个“Memetic Amplification of Plausible Errors”（ plausible 错误的模因放大）反例实验，直接挑战其“LLM judge 能提供独立于 answer frequency 的 correctness-sensitive selection pressure”这一最脆弱的假设。论文的结论基于 offline replay 的静态候选池，隐含假设是 candidate rationales 的质量分布是异质的，且正确答案的 rationale 在逻辑连贯性上天然优于错误答案。然而，在真实的 live peer communication 中，agents 之间会相互影响并产生高度同质化的错误 rationales。具体实验设计如下：构建一个包含 5 个 agents 的 MAS，在数学推理任务中，故意诱导其中 3 个 agents 在早期通过 majority-biased cascade 采纳一个具有高度复杂但存在微妙逻辑谬误的 plausible error。在多轮交互后，这 3 个 agents 会相互强化并产出结构极其严密、长度更长且充满专业术语的错误 rationales，而剩余 2 个持有正确答案的 agent 由于缺乏 peer reinforcement，其 rationales 往往更短、更朴素。此时，引入论文提出的 LLM judge 进行 terminal selection。由于 LLM judge 普遍存在 length bias 和 structural bias，judge 会将这种经过群体交互放大、表面逻辑严密的“高置信度”错误 rationale 排在首位。如果实验结果如预期所示，即 hybrid selection rule（rank-power weighting）在动态交互池上的准确率不仅低于纯 majority voting，甚至低于随机选择，这就构成了最强反例。这一结果将提出具体的替代解释：论文在静态池上观察到的 judge 价值，并非源于 judge 对逻辑正确性的敏感，而是因为在独立采样（无交互）的静态池中，正确答案恰好更容易表现出 judge 所偏好的表面特征；一旦 live interaction 改变了 rationales 的表面特征分布，judge 的 ranking 信号就会退化为对 memetic drift 的放大器，从而在系统级可预测地导致灾难性失败。\n\n### § 12 Follow-up Research Idea\n\n该研究的核心局限在于将 terminal selection 视为一个 post-hoc 的静态 ranking 问题，忽略了 live multi-agent 交互中 receiver-mediated local selection 对候选分布的动态重塑，导致 judge 只能在 memetic drift 发生之后进行被动补救。基于这一未满足的需求，我提出一个 novel research idea：将 multi-agent reasoning 的 selection pressure 从 terminal 阶段前置并内化为 continuous ecological dynamics（连续生态动力学），不再寻找“最佳答案”，而是研究如何维持“正确答案的生存概率”。这个新 framing 借鉴了演化生物学中的 frequency-dependent selection 和 predator-prey models，将 LLM judge 重新概念化为生态系统中的“捕食者”，其目标不是在终点排序，而是在 peer communication 的每一轮中动态“捕食”那些具有高 memetic fitness 但逻辑有缺陷的 plausible errors，从而打破 majority-biased cascade 的形成条件。第一个实验将构建一个 live MAS 环境，其中 agents 分为 generators（生成候选）和 judge-predators（评估并淘汰劣质候选）。在每轮 peer communication 后，judge-predators 会根据 rationales 的 logical coherence（而非单纯的 answer frequency）对当前候选池进行 culling（淘汰），只允许存活下来的 rationales 进入下一轮交互。我们将追踪正确答案的 population dynamics（种群动态，即 $p_{gen}$ 随轮次的变化曲线），对比“无 judge 的自然演化”、“论文中的 terminal judge”以及“continuous predator-prey selection”三种模式。这一提议与已有工作的根本区别在于：现有方法（包括本文）都是在 generation 完成后施加 selection，而本提议将 selection pressure 融入 communication 拓扑本身，研究 selection 如何主动重塑 generation 的 evolutionary trajectory，从而从根本上阻止 generation-retention bottleneck 的形成。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jia-Hao Ji\", \"affiliations\": [1], \"markers\": [\"#\"]},\n    {\"name\": \"Sijie Li\", \"affiliations\": [2, 4], \"markers\": [\"#\"]},\n    {\"name\": \"Jiabei Cheng\", \"affiliations\": [2, 3], \"markers\": [\"#\"]},\n    {\"name\": \"Zixi She\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jin-Tai Yu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Zhiyuan Yuan\", \"affiliations\": [2, 4], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Huashan Hospital, Fudan University\"},\n    {\"id\": 2, \"name\": \"ISTBI, Fudan University\"},\n    {\"id\": 3, \"name\": \"Shanghai Jiao Tong University\"},\n    {\"id\": 4, \"name\": \"Shanghai Academy of Artificial Intelligence for Science\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"#\", \"text\": \"These authors contributed equally.\"},\n    {\"marker\": \"*\", \"text\": \"Corresponding authors: jintai_yu@fudan.edu.cn (J.-T.Y.); zhiyuan@fudan.edu.cn (Z.Y.)\"}\n  ]\n}\n```", "summary_translation": "Multi-agent systems (MAS) 有时已经具备正确回答的潜力，但仍然会报告错误答案。解释这一结果很困难，因为生成、通信和最终答案选择规则通常会同时发生变化。我们将 multi-agent reasoning 概念化为包含 candidate generation、peer communication 和 terminal selection 的 evolutionary pipeline，其中缺乏质量控制的共识会表现出 memetic drift 模式。我们研究了两个问题：(1) LLM judge 何时通过为 multi-agent system 中生成的 candidates 提供答案正确性的信号来提供有效的选择压力，以及 (2) 何时使用该信号能改进所报告的答案。为了映射 judge reliability，我们分析了来自 MMLU-Pro、GPQA、MedXpertQA 和 MuSR 的 15,336 个问题，并对 Humanity's Last Exam 进行了单独分析。为了测试这些规则，我们重放了从五个 benchmarks 的 16,278 个问题中提取的 81,390 个固定 candidate pools。我们报告了三个发现。(1) 正确答案通常已经存在于生成的 candidates 中，但系统仍然可能收敛于并报告错误答案。(2) Judge reliability 不是模型的固定特征，而是随任务、generator 以及正确答案的罕见程度而变化。(3) 将答案频率与 judge 的评估相结合，仅改变了最终答案选择规则，并将 accuracy 从 63.82% 提高到 70.82-70.95%，主要是通过挽救那些在数量上被常见错误答案压制的正确答案。在本文研究的系统中，生成更多 candidates 的价值取决于这些额外样本是否使正确答案存在、频繁或可识别。通过隔离生成、识别和选择，这些发现为设计能够保护生成的正确答案免遭丢失的 multi-agent architectures 建立了诊断基础。"}]}, {"name": "Tool Use \u0026 Planning", "count": 4, "papers": [{"title": "Paint What You See: Benchmarking Dexterous Visual Tool Use in Multimodal Agents", "arxiv_id": "2608.25417", "authors": "Shudong Liu, Dongyang Chen, Enci Zhang, Jinwei Liang, Zheng Ma, Lewei Lu", "summary": "Evaluation is shifting from static QA toward agentic settings where models act through external tools. We identify a critical yet underexplored capability within this space - dexterous visual tool use: fine-grained, closed-loop parameterized visual action in which models infer tool parameters from visual evidence, and those parameters directly govern the final result. Existing benchmarks cover web navigation, GUI operation, and software engineering, but rarely target this coupling between visual evidence and execution precision. We propose EASEL, a benchmark evaluating a controlled instance of dexterous visual tool use that adopts reference-guided visual reconstruction as its primary proxy task: the agent incrementally paints a canvas to match a reference image. EASEL additionally includes semantic tasks spanning region annotation, handwriting, and path planning. We further provide EASEL-Data, a 440k-sample two-stage curriculum dataset for trajectory supervision, and EASEL-9B to investigate its effect on this capability. Evaluation of 25 models reveals that current multimodal agents systematically struggle on EASEL. Reconstruction similarity bottlenecks at low levels (0.40-0.54), while trajectory diagnostics expose severe closed-loop instability - models typically saturate early or degrade post-peak. Semantic tasks reveal sharp capability boundaries in precision annotation and path planning. EASEL-9B, trained on EASEL-Data, surpasses the base model by a relative 6.3%, ranking third among all evaluated models.", "category": "cs.AI", "cluster": "Tool Use \u0026 Planning", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了一个名为 EASEL 的基准，用于评估多模态智能体在“灵巧视觉工具使用”方面的能力，并提供了轨迹监督数据集和训练了相应的智能体模型。论文的研究对象明确是“多模态智能体”及其“工具使用”和“闭环”行为。根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents / Multi-Agent LLMs，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。” 此外，论文不仅进行了评估，还通过轨迹监督数据训练了 EASEL-9B 模型以改进其工具使用能力，这属于智能体训练的范畴。虽然论文涉及视觉和多模态，但这里的视觉是作为智能体感知环境和执行参数化动作的核心通道，而非单纯的多模态理解研究。因此，该论文符合研究目标中关于“工具使用”和“评估、训练 LLM智能体”的焦点。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的核心研究问题是：当前 multimodal agents（多模态智能体）是否具备 **dexterous visual tool use**（灵巧视觉工具使用）的能力，即能否在闭环交互中，根据像素级视觉线索推断出显式的工具参数，并使这些参数直接且精确地决定最终的视觉输出。这一问题至关重要，因为现有的 agent 评测大多转向了 web navigation、GUI operation 或 software engineering 等结构化环境，而在这些环境中，交互通常是 **precision-tolerant**（容错的）——只要动作落在宽泛的边界框内即可成功，无需严格的空间控制。然而，要真正操纵视觉内容，agent 必须超越高层级的任务委派，将细粒度的视觉理解直接转化为精确的执行参数。填补这一评测空白具有重大价值：它不仅能够暴露模型在语义理解与几何精度之间的鸿沟，还能推动 agent 向医学标注、CAD 草图绘制、图表创作及 embodied manipulation（具身操作）等需要精确视觉状态观察与结构化动作预测的实际应用迈进。\n\n### § 2 前人工作与不足\n在本文之前，dexterous visual tool use 这一能力维度并未被清晰定义和系统评测，现有的相关研究范式均通过不同方式规避了精确执行。首先，针对 agent 交互的 benchmarks（如 SWE-bench, WebArena, OSWorld）主要关注目标导向的执行，但其 GUI grounding 任务（如 SeeClick）通常定位的是高容错的交互元素，坐标精度并不直接决定结果质量，因此未要求精确的空间控制。其次，在直接操作图像以辅助理解的研究中（如 V*, SoM, LISA, PSALM），模型要么仅进行视觉搜索或区域标注而不产生持久的视觉输出，要么将像素级分割等执行过程委派给外部的 specialized decoders（专用解码器），而非由 agent 自身生成参数化动作。尽管 SimpleSeg 尝试让通用模型直接预测多边形坐标序列，实现了无解码器委派的参数化动作，但它仅限于 one-shot（一次性）静态设置，未涉及多步闭环细化。最后，在视觉编辑与生成领域（如 instruction-based image editing, neural painting 中的 Learning to Paint 和 SketchAgent），研究往往优化的是 task-specific models 的重建质量，或将执行意图交给外部生成模型黑盒处理，缺乏针对显式视觉目标的闭环纠正机制。因此，前人工作之所以存在不足，根本原因在于它们要么通过容错边界吸收了不精确性，要么将执行责任外包，导致“持续读取细粒度视觉信号并转化为纠正性参数化动作”这一闭环能力始终处于评测盲区。", "core_insight": "### § 3 重建作者的思考路径\n\n从当前 multimodal agents 的评估现状出发，作者观察到现有的 agentic benchmarks（如 web navigation 和 GUI operation）虽然涉及视觉交互，但大多是 \"precision-tolerant\" 的，即动作只要落在宽泛的边界框内即可成功，坐标精度并不直接决定最终结果的质量。另一方面，涉及视觉内容操作的任务（如 segmentation 和 image editing）通常采用 \"delegated execution\" 的范式，将高层意图交给外部专用模型（如 mask decoder 或 generative model）执行，agent 本身并不直接控制形成结果的参数。这意味着，现有范式都回避了一个关键挑战：将细粒度的视觉理解直接转化为精确的执行参数。\n\n作者从机器人学的 dexterous manipulation 中获得类比灵感：真正的灵巧操作要求操作者通过连续反馈直接用自身动作塑造物理结果，而不是向外部执行器发送指令。将此概念映射到视觉领域，便形成了 \"dexterous visual tool use\" 的雏形——模型必须在每一步读取像素级视觉线索，推断显式工具参数，这些参数直接控制视觉输出，并驱动后续的细化。虽然 SimpleSeg 等工作证明了通用 MLLMs 在 one-shot 静态设置下能实现像素级感知，但这种感知能否在多步闭环执行中维持（即每次动作改变视觉状态后仍能进行新的空间推理）尚属未知。\n\n为了在可控环境下测试这一能力，作者需要一个既能暴露空间精度差距、又易于规模化的 proxy task。绘画成为理想选择：每一笔都会改变画布并影响下一步决策，参数误差无法被容错接口或外部生成器吸收；同时，参考图像可自由获取，笔画轨迹可自动生成，免去了人工标注的负担。由此，作者自然推导出以 reference-guided visual reconstruction 为核心的 EASEL benchmark，并辅以 semantic tasks 以全面探测该参数化动作接口。\n\n### § 4 核心 Intuition\n\n先前方法之所以失效，是因为它们要么通过容错边界吸收了空间不精确性，要么将执行委托给外部黑盒模型，从而回避了“将细粒度视觉感知转化为精确动作参数”的挑战。EASEL 的核心 intuition 是：通过要求 agent 在闭环中直接输出连续参数化的绘画动作来匹配参考图像，迫使模型必须持续读取像素级视觉线索并据此进行空间纠错，从而暴露并评估其真正的“灵巧视觉工具使用”能力。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Paint What You See: Benchmarking Dexterous Visual Tool Use in Multimodal Agents》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 本文提出并解决的核心研究问题是：当前 multimodal agents（多模态智能体）是否具备 **dexterous visual tool use**（灵巧视觉工具使用）的能力，即能否在闭环交互中，根据像素级视觉线索推断出显式的工具参数，并使这些参数直接且精确地决定最终的视觉输出。这一问题至关重要，因为现有的 agent 评测大多转向了 web navigation、GUI operation 或 software engineering 等结构化环境，而在这些环境中，交互通常是 **precision-tolerant**（容错的）——只要动作落在宽泛的边界框内即可成功，无需严格的空间控制。然而，要真正操纵视觉内容，agent 必须超越高层级的任务委派，将细粒度的视觉理解直接转化为精确的执行参数。填补这一评测空白具有重大价值：它不仅能够暴露模型在语义理解与几何精度之间的鸿沟，还能推动 agent 向医学标注、CAD 草图绘制、图表创作及 embodied manipulation（具身操作）等需要精确视觉状态观察与结构化动作预测的实际应用迈进。 ### § 2 前人工作与不足 在本文之前，dexterous visual tool use 这一能力维度并未被清晰定义和系统评测，现有的相关研究范式均通过不同方式规避了精确执行。首先，针对 agent 交互的 benchmarks（如 SWE-bench, WebArena, OSWorld）主要关注目标导向的执行，但其 GUI grounding 任务（如 SeeClick）通常定位的是高容错的交互元素，坐标精度并不直接决定结果质量，因此未要求精确的空间控制。其次，在直接操作图像以辅助理解的研究中（如 V*, SoM, LISA, PSALM），模型要么仅进行视觉搜索或区域标注而不产生持久的视觉输出，要么将像素级分割等执行过程委派给外部的 specialized decoders（专用解码器），而非由 agent 自身生成参数化动作。尽管 SimpleSeg 尝试让通用模型直接预测...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 从当前 multimodal agents 的评估现状出发，作者观察到现有的 agentic benchmarks（如 web navigation 和 GUI operation）虽然涉及视觉交互，但大多是 \"precision-tolerant\" 的，即动作只要落在宽泛的边界框内即可成功，坐标精度并不直接决定最终结果的质量。另一方面，涉及视觉内容操作的任务（如 segmentation 和 image editing）通常采用 \"delegated execution\" 的范式，将高层意图交给外部专用模型（如 mask decoder 或 generative model）执行，agent 本身并不直接控制形成结果的参数。这意味着，现有范式都回避了一个关键挑战：将细粒度的视觉理解直接转化为精确的执行参数。 作者从机器人学的 dexterous manipulation 中获得类比灵感：真正的灵巧操作要求操作者通过连续反馈直接用自身动作塑造物理结果，而不是向外部执行器发送指令。将此概念映射到视觉领域，便形成了 \"dexterous visual tool use\" 的雏形——模型必须在每一步读取像素级视觉线索，推断显式工具参数，这些参数直接控制视觉输出，并驱动后续的细化。虽然 SimpleSeg 等工作证明了通用 MLLMs 在 one-shot 静态设置下能实现像素级感知，但这种感知能否在多步闭环执行中维持（即每次动作改变视觉状态后仍能进行新的空间推理）尚属未知。 为了在可控环境下测试这一能力，作者需要一个既能暴露空间精度差距、又易于规模化的 proxy task。绘画成为理想选择：每一笔都会改变画布并影响下一步决策，参数误差无法被容错接口或外部生成器吸收；同时，参考图像可自由获取，笔画轨迹可自动生成，免去了人工标注的负担。由此，作者自然推导出以 reference-guided visual reconstruction 为核心的 EASEL benchmark，并辅以 semantic tasks 以全面探测该参数化动作接口。... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **Paint What You See: Benchmarking Dexterous Visual Tool Use in Multimodal Agents** ## **Shudong Liu**[∗][1,3] **, Dongyang Chen**[∗][2,3] **, Enci Zhang**[1] **, Jinwei Liang**[3] **, Zheng Ma**[3] **, Lewei Lu**[3][†] 1Peking University, 2Tsinghua University, 3SenseTime Research {shooo, eczhang}@stu.pku.edu.cn, chen-dy25@mails.tsinghua.edu.cn, {liangjinwei, mazheng2, luotto}@sensetime.com https://github.com/OOOHS/EASEL https://huggingface.co/EASEL-Bench ## **Abstract** Evaluation is shifting from static QA toward agentic settings where models act through external tools. We identify a critical yet underexplored capability within this space—dexterous visual tool use: fine-grained, closed-loop parameterized visual action in which models infer tool parameters from visual evidence, and those parameters directly govern the final result. Existing benchmarks cover web navigation, GUI operati...", "additional_insights": "### § 8 Take-aways\n本文提出了“dexterous visual tool use”这一概念，强调多模态智能体需要通过细粒度、闭环的参数化视觉动作直接控制输出，而非依赖高容错接口或外部黑盒模型。为评估此能力，作者提出了EASEL benchmark，以参考图像引导的视觉重建为核心代理任务，并辅以区域标注、手写和路径规划等语义任务。对25个现有多模态智能体的系统评估揭示了两种典型的闭环失败模式：early saturation（模型在初期快速获得收益后便停止有效动作）和post-peak degradation（模型持续输出动作但导致画面质量退化），且重建相似度普遍瓶颈在0.40-0.54的低水平。通过构建440k样本的两阶段课程数据集EASEL-Data并训练EASEL-9B，作者证明了轨迹级监督能有效提升基座模型的闭环动作质量（相对提升6.3%），且这种训练不仅没有损害反而略微提升了模型在标准感知基准上的细粒度视觉感知能力。\n\n### § 9 最脆弱的假设\n本文最核心且失败代价最大的假设是：**通过强制模型输出13个连续参数来定义quadratic Bézier曲线的`brush_stroke`接口，能够真实反映多模态智能体的dexterous visual tool use能力，而不是仅仅暴露模型对这种特定低级参数化接口的不适应。** 如果这个假设不成立，那么论文中观察到的early saturation和post-peak degradation可能并非因为模型缺乏闭环纠错或细粒度视觉操作能力，而是因为预测精确的Bézier控制点坐标及颜色/透明度参数对基于自然语言或高层API预训练的LLM来说过于反直觉和困难。在实际应用中，智能体通常通过生成代码（如SVG路径、Python绘图脚本）或调用高层视觉工具来执行操作，这种连续参数的JSON输出格式可能引入了人为的评估偏差。论文提供的证据是Table 2中的score anchors，表明特定的data policy在该接口下可以达到0.665-0.715的相似度，证明接口本身是可解的；但论文缺少关键的反事实证据：即未验证这些表现不佳的模型如果被允许通过生成代码或使用其他更熟悉的参数化接口（如直接输出SVG路径字符串），是否能在相同的重建任务上表现出更好的闭环纠错能力。如果模型在代码生成接口下表现优异，那么EASEL所测量的就不是dexterous visual tool use的本能，而是对特定连续参数格式的适应难度，这将直接削弱该benchmark的核心价值。\n\n### § 10 最小复现实验\n在一周时间内，可以最小化复现论文中关于“当前多模态智能体在闭环视觉动作中存在early saturation或post-peak degradation”这一核心发现。从EASEL的HuggingFace仓库中选取10张Programmatic或Spatial Geometry类别的参考图像（因其结构清晰、易于渲染）。实现一个极简的基于Python的渲染器，接收符合论文3.4节schema的13个参数JSON并通过alpha blending更新canvas。选取一个闭源API模型（如Gemini 3.1 Pro或GPT-5.5）或本地开源模型（如Qwen3.5-9B），在每一步将参考图像和当前canvas输入模型，要求其输出下一步的`brush_stroke`动作，连续执行32步。测量每一步的相似度（按论文3.3节的SSIM、RGB L1和Edge IoU加权计算），并记录Similarity@50%、Trajectory AUC、Best Similarity以及Final-Best Gap。如果曲线在前10%的步数内迅速上升后趋于平缓（@50%与Final相似度几乎相同），或者曲线在中期达到峰值后最终相似度显著下降（AUC显著大于Final，且F-B Gap较大），则支持了论文关于闭环不稳定的claim；如果模型能够持续利用视觉反馈逐步提升相似度直至步数耗尽，且F-B Gap极小，则反驳了该claim。此方案无需复现完整的110个样本集和复杂的EASEL-9B训练流程，即可有效验证核心诊断结论。", "research_value": "### § 11 最强反例设计\n要对该论文进行最有力的攻击，核心在于挑战其最脆弱的假设：即“13个连续参数的quadratic Bézier曲线JSON接口能够真实反映dexterous visual tool use能力”。我会设计一个**跨接口表征的对比消融实验**，用以证明论文观察到的early saturation和post-peak degradation并非源于模型缺乏闭环视觉纠错能力，而是源于自回归LLM（Autoregressive LLM）在连续浮点数空间中固有的“坐标回归困难症”。具体而言，保持EASEL的参考图像引导视觉重建任务和闭环交互逻辑完全不变，但将动作空间从“输出13个连续参数的JSON”替换为“输出等价的SVG路径字符串或Python绘图代码（如调用PIL或Cairo库）”。选取论文中表现不佳的代表性模型（如GPT-5.5或Qwen3.5-9B），在代码生成接口下重新运行32步闭环重建。如果模型在代码接口下能够持续利用视觉反馈逐步提升相似度，且Final-Best Gap显著缩小、不再出现post-peak degradation，这就提供了一个具体的替代解释：EASEL benchmark当前测量的不是模型“视觉-动作耦合”的灵巧度上限，而是模型对特定低级连续参数格式的适应下限。进一步地，我可以引入一个“离散化网格接口”实验，将画布划分为粗粒度网格，要求模型输出网格索引而非精确坐标；若离散化接口下的轨迹曲线远比连续参数接口下平滑且单调递增，则直接证明论文的失败模式诊断是伪命题——模型具备闭环纠错的视觉意图，只是被不自然的连续数值输出格式所阻断，这使得EASEL作为衡量dexterous visual tool use通用能力的benchmark失去效度。\n\n### § 12 Follow-up Research Idea\n基于EASEL在动作空间表征上的核心局限，一个非增量的novel research idea是探索**“Neuro-symbolic Closed-loop Visual Program Synthesis”（神经符号闭环视觉程序合成）**，将dexterous visual tool use的framing从“连续参数回归”转变为“视觉约束引导的符号程序生成与可微执行”。驱动这一想法的局限是：现有方法强制LLM在token空间内直接预测反直觉的连续几何参数，导致语义理解与几何执行之间产生不可逾越的鸿沟，且无法利用视觉反馈进行梯度级的策略优化。我们可以借鉴“Program Synthesis”和“Differentiable Rendering”（可微渲染）这两个相邻领域的工具，让模型生成结构化的、包含高层视觉原语（如`draw_curve`, `align_boundary`）的Python程序，并通过一个可微渲染器将程序执行结果与参考图像进行比对。第一个实验将设计一个“Visual-Feedback-Guided Code Refinement”循环：给定参考图像，LLM生成初始绘图程序，可微渲染器计算当前画布与参考图像的像素级L1 loss和语义loss，但不同于传统的反向传播，我们将渲染loss转化为结构化的自然语言反馈（如“左上角曲线的控制点需向(15, 20)方向偏移以贴合边缘”），要求LLM在下一轮修改代码。这与已有工作的根本区别在于：EASEL和Learning to Paint要求模型直接吐出参数，而本提议将模型的角色从“参数回归器”升级为“基于视觉编译错误的代码调试器”，利用LLM最擅长的代码推理能力来桥接细粒度视觉误差与精确执行，从而在真正意义上实现高灵巧度的闭环视觉控制。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Shudong Liu\", \"affiliations\": [1, 3], \"markers\": [\"*\"]},\n    {\"name\": \"Dongyang Chen\", \"affiliations\": [2, 3], \"markers\": [\"*\"]},\n    {\"name\": \"Enci Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jinwei Liang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Zheng Ma\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Lewei Lu\", \"affiliations\": [3], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Peking University\"},\n    {\"id\": 2, \"name\": \"Tsinghua University\"},\n    {\"id\": 3, \"name\": \"SenseTime Research\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"These authors contributed equally.\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author.\"}\n  ]\n}\n```", "summary_translation": "评估正从静态 QA 转向模型通过外部工具执行操作的 agentic settings。我们在该领域内识别出一种关键但尚未被充分探索的能力——dexterous visual tool use：这是一种细粒度、闭环的参数化视觉动作，模型从视觉证据中推断工具参数，且这些参数直接控制最终结果。现有的 benchmarks 涵盖了 web navigation、GUI operation 和 software engineering，但很少针对这种视觉证据与执行精度之间的耦合。我们提出了 EASEL，这是一个用于评估 dexterous visual tool use 受控实例的 benchmark，它采用 reference-guided visual reconstruction 作为其主要 proxy task：agent 逐步在 canvas 上进行绘制以匹配参考图像。EASEL 还包含跨越 region annotation、handwriting 和 path planning 的 semantic tasks。我们进一步提供了 EASEL-Data，这是一个包含 44 万样本的两阶段 curriculum dataset，用于 trajectory supervision；同时提供了 EASEL-9B 以研究其对这种能力的影响。对 25 个模型的评估显示，当前的 multimodal agents 在 EASEL 上系统性表现不佳。Reconstruction similarity 在较低水平（0.40-0.54）遇到瓶颈，而 trajectory diagnostics 暴露出严重的 closed-loop instability——模型通常过早饱和或在达到峰值后发生退化。Semantic tasks 揭示了在 precision annotation 和 path planning 方面存在显著的能力边界。在 EASEL-Data 上训练的 EASEL-9B 相对 base model 提升了 6.3%，在所有评估模型中排名第三。"}, {"title": "Tunable Tool-Call Rates in LLM Agents via Representation Steering", "arxiv_id": "2608.25198", "authors": "Yuqi Chen, Vincent Siu, Yang Liu, Dawn Song, Chenguang Wang", "summary": "Deciding whether to call a tool is a core competence of an LLM agent, and a costly one to get wrong: needless calls add latency, accrue cost, and may trigger irreversible side effects, while missing calls leave the model confidently wrong on questions it could only answer through tool-calls. Models manage this balance poorly, both over-using and under-using tools. Existing methods such as post-training and prompt engineering are expensive and difficult to modify at inference time. We show that whether an instruction-tuned model calls a tool can be controlled by a single linear direction in its residual stream, extracted without any training from the model's own tool-use preference signal and turned into an inference-time intervention with no prompt change. Adding the direction with strength $α$ moves the call rate monotonically from near $0\\% $ to over $90\\%$ while keeping calls well-formed. The steering works in both directions: dialing it down suppresses calls, and dialing it up induces new calls that land precisely on the questions the model cannot answer from its own knowledge. We also show that the direction generalizes to unseen tools with strength comparable to each tool's own direction and without favoring any specific tool choice. With live tool execution, a single sweep of the steering traces a cost/accuracy Pareto frontier and nearly doubles open-domain QA accuracy ($0.29 \\! \\rightarrow \\! 0.56$); the same recipe transfers across a diverse range of models spanning dense, MoE, and multimodal architectures, without any training. Our code is publicly available at https://github.com/YuqiChen4188/Steering-Tool-Use-Propensity.", "category": "cs.AI", "cluster": "Tool Use \u0026 Planning", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=8 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一种在推理时通过表征引导来动态控制LLM智能体工具调用频率的方法。论文明确指出“决定是否调用工具是LLM智能体的核心能力”，并针对智能体在工具使用中过度调用或调用不足的问题提出了解决方案。这直接属于单智能体方向中的“工具使用”和“推理时优化”子方向。根据筛选标准第一步，论文研究推理策略干预且明确指向LLM Agents的工具使用能力改进，应予保留；同时它不属于任何排除类别（如纯基础设施、安全对齐、图技术或非演化型应用）。因此，该论文与构建和改进LLM智能体能力的研究目标高度相关。", "intro_logic": "### § 1 研究问题与重要性\n\n本文解决的核心问题是：如何在不重新训练模型、不修改 prompt 的前提下，在 inference time 对 instruction-tuned LLM agent 是否调用工具这一二元决策进行连续、双向的控制。具体而言，模型在 tool use 上存在两种系统性失败——对长尾事实问题 under-use 工具导致幻觉性错误回答，以及对自身已能解答的问题 over-use 工具造成不必要的 latency、成本甚至不可逆副作用（如发送邮件、执行代码）。随着 industry 向大规模 agentic deployment 演进，这些成本在部署规模而非实验室规模上被承担，因此对 tool-call rate 的轻量级、可调控制具有直接的工程价值。作者发现，这一 whether-to-call 决策可以被 residual stream 中的单一 linear direction 编码，通过 difference-of-means 方法无需任何 training 即可提取，并在 inference time 以标量系数 α 加回该方向，使 call rate 从接近 0% 单调上升至 90% 以上，同时保持 tool-call 格式 well-formed。该控制还具备三个实用属性：knowledge-selective（诱导的调用集中在模型自身知识无法覆盖的问题上）、tool-general（从 multi-tool harness 提取的方向可迁移至六个 held-out tools，强度接近各工具自身提取的方向）、以及与 tool choice 解耦（改变是否调用但不干扰调用哪个工具）。在 live tool execution 下，sweeping α 可描绘 cost–accuracy Pareto frontier，将 PopQA open-domain QA accuracy 从 0.29 提升至 0.56，且同一方法跨 dense、MoE 和 multimodal 架构的五个模型均有效。\n\n### § 2 前人工作与不足\n\nTool-use mitigation 的 prior work 主要沿两条路径展开。第一条是 post-training 路线：Qian et al. (2025) 的 SMART 和 Shen, Zhu \u0026 Chen (2024) 的 SMARTCAL 通过 fine-tuning 或 alignment 使 agent 对 tool overuse 更具 self-awareness；Wang et al. (2025) 的 Self-DC 通过 divide-and-conquer 策略优化 compositional unknown questions 下的调用决策；Xu et al. (2025) 通过 alignment 提升 efficient tool calling。这些方法的共同局限在于：它们需要 task-specific supervision 或 gradient-based training，一旦部署后难以在 inference time 动态调整 call rate，且针对 over-use 设计的 mitigation 无法同时覆盖 under-use 场景。第二条是 prompt engineering 与 retrieval-augmented generation 路线：Mallen et al. (2023) 通过 popularity-based 启发式学习何时检索，Lewis et al. (2020) 的 RAG 框架依赖外部 supervision 信号决定检索时机。这些方法虽然无需训练，但调用策略被固化在 prompt 或 retrieval policy 中，缺乏连续可调的控制旋钮，且修改 prompt 会引入不可预期的 side effect，难以精确地双向调节。\n\n在 interpretability 方向，Park, Choe \u0026 Veitch (2024) 提出的 linear representation hypothesis 以及 Arditi et al. (2024) 在 refusal direction 上的工作表明，模型权重中编码的概念可被 linearly decoded 并通过 residual stream 中的方向 steering。Wu et al. (2026) 进一步证明 tool choice 本身是 linearly readable and steerable 的。然而，这些工作均假设被 steer 的概念具有稳定的 parametric grounding——即概念编码在模型权重中。Tool use 的特殊性在于：工具是通过 context 注入的而非预存在权重中的，因此 a priori 不清楚一个 context-dependent 的 agentic decision 是否同样 admits a single weight-space steering direction。Prior steering work 未触及这一问题，因为它们的研究对象（refusal、truthfulness 等）属于模型固有行为，而非由 runtime context 动态引入的行为。本文的贡献正在于填补这一缺口：证明 whether-to-call 这一 context-dependent 决策同样可以被单一 linear direction 捕获，且该方向具有跨工具的 domain-general 成分，从而将 representation steering 从 parametric concept 扩展到 context-injected agentic behavior，并提供了一个 training-free、inference-time 的连续控制机制，同时覆盖 under-use 和 over-use 两种 regime。", "core_insight": "### § 3 重建作者的思考路径\n\n在探讨如何控制 LLM agent 的 tool-call rate 时，研究者首先观察到模型在工具使用上存在严重的 over-use 和 under-use 失败模式：有时面对长尾事实问题盲目自信给出错误答案而不去调用 search 工具，有时面对简单的算术题又多余地调用 calculator，徒增 latency 和 cost。传统的解决途径主要依赖 post-training（如 fine-tuning）或 prompt engineering，这些方法不仅计算成本高昂，且在 inference time 极难灵活调整。与此同时，mechanistic interpretability 领域的进展揭示了模型内部的许多高级概念（如 refusal、truthfulness）在 residual stream 中是以 linear direction 的形式存在的，并且可以通过 representation steering（如 difference-of-means 和 activation addition）进行双向调控。更关键的是，已有研究（Wu et al. 2026）发现模型“选择哪个工具”这一行为也是 linearly readable 且 steerable 的。顺着这些线索，一个自然的假设浮现：既然具体的工具选择有对应的线性表示，那么更基础的二元决策——“是否要调用工具”——是否也同样对应一个单一的 linear direction？如果这个 direction 存在，我们就能绕过昂贵的 retraining 和 prompt 修改，直接在 inference time 通过向量加减来像调节旋钮一样连续控制模型的 tool-use propensity。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 在于：LLM 决定“是否调用工具”这一行为，在其内部表示空间中可以被压缩为一个单一的 linear direction。通过利用模型自身生成 tool-call 起始 token 的 log-probability 作为 propensity proxy，对比高倾向与低倾向的 query 提取 residual stream 的均值差，就能无需任何训练获得这个 steering vector。在 inference time 简单地对该 vector 进行标量加减，即可在不修改 prompt 的情况下连续、双向地调节 tool-call rate，且这种调节天然具备 knowledge-selectivity——它只在模型自身参数知识不足的 query 上触发新的工具调用，而不会破坏模型本已掌握的知识。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n  [Query q] --\u003E [Multi-tool Harness] --\u003E [x(q)]\n                                           |\n               +---------------------------+-------------------+\n               |                                               |\n      [Forward Pass: P(t[*])]                          [Inference Time]\n               |                                               |\n        [Propensity Score s(q)]                    [Add alpha * v_l to h_l]\n               |                                               |\n      [Rank Queries by s(q)]                             [Generation]\n               |                                               |\n         +-----+-----+                                         |\n         |           |                                         |\n      [Set H]     [Set L]                                      |\n         |           |                                         |\n   [h_l(H)]     [h_l(L)]                                       |\n         |           |                                         |\n         +-----+-----+                                         |\n               |                                               |\n      [Difference of Means] --\u003E [Steering Vector v_l] ---------+\n```\n\n该 Pipeline 包含三个无需训练的环节：\n\n1. **Forward-pass propensity proxy**：将输入 Query $q$ 放入 multi-tool harness 渲染为 $x(q)$。模型在生成第一个位置时，发出共享的 tool-exclusive special token $t[\\star]$ 的 log-probability 作为 propensity proxy $s(q)$。这一过程仅需一次 forward pass，无需实际生成。\n2. **Extracting the direction**：根据 $s(q)$ 对所有 queries 排序，取 top quantile 作为 high-propensity set $H$，bottom quantile 作为 low-propensity set $L$。在每一层 $\\ell$，提取最后一个 prompt token 处的 residual stream $h_\\ell$。计算 $H$ 和 $L$ 的均值差，得到该层的 steering vector $v_\\ell$。由于 $H$ 包含对不同工具的调用，$v_\\ell$ 捕获的是通用的 call-propensity 而非特定工具特征。\n3. **Inference-time steering**：在推理时，将标量系数 $\\alpha$ 乘以 $v_\\ell$，加到 decoder 的 residual stream 输出上。通过调节 $\\alpha$ 的大小和正负，可以双向控制模型是否调用工具。\n\n### § 7 实验设计与结论\n\n**提出问题**：能否在不重新训练模型、不修改 prompt 的前提下，通过单一 linear direction 在 inference time 连续、双向地控制 LLM agent 的 tool-call rate，并保持 knowledge-selective 和 tool-general？\n\n**实验验证**：\n1. **调控效果验证**：在 multi-tool harness 中，通过改变干预强度 $\\alpha$，观察 call rate 的变化。\n2. **知识选择性验证**：检查增加 $\\alpha$ 诱导出的新 tool calls 是否集中在模型自身知识无法覆盖的问题上。\n3. **泛化性验证**：将从 multi-tool harness 提取的 steering vector 应用于 held-out tools，观察其强度是否接近各工具自身提取的方向，并验证其是否与 tool choice 解耦。\n4. **实际效用验证**：在 live tool execution 下，sweeping $\\alpha$ 描绘 cost–accuracy Pareto frontier，并测量 PopQA open-domain QA accuracy 的变化。\n5. **跨架构验证**：在 dense、MoE 和 multimodal 架构的多个模型上重复上述流程。\n\n**结论**：\n1. 添加该方向使 call rate 从接近 0% 单调上升至 90% 以上，同时保持 tool-call 格式 well-formed；减小该方向则抑制调用。\n2. 诱导的调用精确落在模型自身无法回答的问题上，体现了 knowledge-selectivity。\n3. 提取的方向可迁移至未见过的工具，且不干扰具体的 tool choice。\n4. 在 live tool execution 下，该方法将 PopQA open-domain QA accuracy 从 0.29 提升至 0.56。\n5. 该方法在 dense、MoE 和 multimodal 架构的多个模型上均有效，证明了其广泛适用性。", "additional_insights": "### § 8 Take-aways\n本文提出了一种无需训练的 inference-time intervention 方法，通过在 LLM 的 residual stream 中添加单一的 linear direction，实现了对 tool-call rate 的双向连续控制。该 steering direction 通过 difference-of-means (DIM) 方法从模型自身的 tool-use preference signal 中提取，无需 gradient 或外部 label。这种控制具有 knowledge-selective 特性，能够精准在模型参数知识无法覆盖的问题上诱导 tool call，同时避免在已知问题上过度调用。实验证明，该 direction 具有工具泛化性，在 multi-tool harness 中提取的向量能有效控制未见过的工具，且不干扰模型对具体工具的选择。通过调整 steering strength $\\alpha$，可以在 cost 与 accuracy 之间描绘出 Pareto frontier，在 PopQA 数据集上将准确率从 0.29 提升至 0.56。该方法在 dense、MoE 和 multimodal 等不同架构的模型上均有效，展现了跨模型的强泛化能力。\n\n### § 9 最脆弱的假设\n本文最关键的假设是：模型“是否调用工具”的决策在 representation space 中是线性可表示的，且这个方向与“选择哪个工具”的决策是解耦的。如果这个假设不成立，即 tool-use propensity 和 tool choice 在 representation space 中高度纠缠，那么提取的 steering direction 就无法在不干扰模型 routing 的情况下独立控制 call rate，也无法泛化到 unseen tools。在实际中，对于某些模型，调用工具的决策可能深度依赖于特定工具的语义特征，导致 whether-to-call 和 which-tool-to-call 共享同一个多维子空间，而非单一的线性方向。论文通过 Table 1 和 Table 2 提供了支持证据，表明 multi-tool direction 对 held-out tools 的控制强度与 tool-specific direction 相当，且 steering 后模型仍能保持 task-appropriate 的 tool selection。然而，论文也承认在 Gemma 和 gpt-oss 模型上，过度的正向 steering 会导致模型生成无效或无法识别的工具名称，这暗示了在极端情况下，propensity 和 tool choice 之间的解耦可能会破裂，暴露了该线性假设的边界。\n\n### § 10 最小复现实验\n如果有一周时间，可以复现论文中最核心的 claim：单一 linear direction 能双向控制 tool-call rate 且具有 knowledge-selective 特性。使用 PopQA 数据集，选取 200 个低 entity popularity 的问题。模型选择 Qwen3-4B-Instruct。首先，构建一个包含 search tool 的 harness，计算模型在每个问题上首 token 生成 tool-call token 的 log-probability，取 top 10% 和 bottom 10% 的问题，在 mid-late layer（如 layer 22）提取 residual stream 的 difference-of-means 向量。然后，在 inference 时将提取的向量乘以系数 $\\alpha$ 加到该层的 output 中。测量不同 $\\alpha$ 值（如 -2, 0, +2）下的 tool-call rate 和 answer accuracy。如果 claim 成立，$\\alpha=+2$ 应该显著提高 tool-call rate 和 answer accuracy，而 $\\alpha=-2$ 应该将 tool-call rate 降至接近 0 且不影响已知问题的准确率。如果 $\\alpha=+2$ 导致 tool-call rate 没有明显提升，或者 accuracy 没有提升甚至下降，则反驳了该 claim。", "research_value": "### § 11 最强反例设计\n要对该论文的核心 claim 构成最致命的打击，可以设计一个针对“knowledge-selective”特性的替代解释实验，挑战其提取的 steering direction 是否真正编码了“factual knowledge boundary”，而非仅仅放大了模型的“epistemic uncertainty”或“perceived prompt difficulty”。论文声称正向 steering 能够精准在模型参数知识无法覆盖的问题上诱导 tool call，但这一现象存在一个更平庸的解释：提取的 difference-of-means 向量可能只是捕捉到了模型在面对高 perplexity 或长尾实体时的“uncertainty representation”。如果事实如此，那么在 inference time 增大 $\\alpha$ 将不可避免地在那些“模型本可知但表述复杂、具有对抗性扰动或存在歧义”的问题上触发不必要的 tool call。为了验证这一替代解释，我们可以构建一个包含 500 个问题的测试集，这些问题分为两类：一类是真正的长尾事实问题（模型参数知识缺失），另一类是高频事实问题但经过 adversarial paraphrasing 或注入 distractors，使得 prompt 的表面 complexity 显著增加但答案依然在模型参数范围内。如果在这些高表面复杂度但高知识覆盖的问题上，正向 steering（$\\alpha \u003E 0$）导致 tool-call rate 出现不可控的激增，且这种激增无法通过调整单一标量 $\\alpha$ 来与真正的长尾问题区分开，这就直接反驳了 steering direction 具有“knowledge-selective”的精准性。进一步地，在真实的 agentic deployment 场景中，这种将“uncertainty”误判为“knowledge deficit”的系统性偏差会导致模型在遇到稍微复杂的已知推理任务时放弃自身能力，转而执行不可逆的高风险工具调用（如盲目执行 SQL 删除操作或发送邮件），从而证明该线性方向在安全关键场景下会可预测地失败。\n\n### § 12 Follow-up Research Idea\n当前方法的核心局限在于，它假设“是否调用工具”是一个静态的、state-agnostic 的线性特征，通过一个全局提取的标量 $\\alpha$ 来强行干预，这完全忽略了在 multi-step agentic workflows 中，工具调用的预期效用是高度 context-dependent 且随时间动态演变的。针对这一未满足的需求，我提出一个全新的研究框架：**Dynamic Utility-Grounded Representation Steering**，将静态的 propensity steering 转变为基于 trajectory-level expected utility 的动态干预。该想法借鉴了 Reinforcement Learning from Human Feedback (RLHF) 中的 Process Reward Models (PRMs) 以及 mechanistic interpretability 中的 activation patching 技术，不再寻找一个固定的“tool-call direction”，而是训练一个轻量级的、在 inference time 运行的 linear probe，实时读取 residual stream 中的 representation 来预测当前状态下调用工具的“expected information gain”或“cost-benefit ratio”。第一个实验将聚焦于一个多跳问答（multi-hop QA）任务（如 HotpotQA），模型需要在多步推理中决定何时检索、何时依赖自身参数。实验将对比三种设置：无干预的 baseline、本文的静态 $\\alpha$ steering、以及我们提出的动态 steering（其中干预强度 $\\alpha_t$ 在每一步由 probe 预测的 expected utility 动态决定，当且仅当预期信息增益超过阈值时才注入正向 steering vector）。通过测量 trajectory length、tool-call accuracy 以及不可逆操作的误触发率，我们可以验证动态方法是否能在避免 over-use 的同时维持 under-use 的缓解效果。这一提议与已有工作的根本区别在于：它放弃了寻找一个恒定的行为开关，而是将 representation steering 重新定义为对模型内部动态价值估计的实时校准，从而打开了将 mechanistic steering 与 sequential decision theory 相结合的全新研究方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yuqi Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Vincent Siu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yang Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Dawn Song\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Chenguang Wang\", \"affiliations\": [1], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"UC Santa Cruz\"},\n    {\"id\": 2, \"name\": \"UC Berkeley\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "决定是否调用工具是 LLM agent 的一项核心能力，且犯错的代价高昂：不必要的调用会增加延迟、累积成本，并可能触发不可逆的副作用，而遗漏调用则会使模型在只能通过工具调用才能回答的问题上自信地犯错。模型在平衡这一问题时表现不佳，存在过度使用和使用不足工具的情况。现有方法如 post-training 和 prompt engineering 成本高昂，且在 inference time 难以修改。我们表明，instruction-tuned model 是否调用工具可以通过其 residual stream 中的单一 linear direction 来控制，该方向无需任何训练即可从模型自身的 tool-use preference signal 中提取，并转化为无需更改 prompt 的 inference-time intervention。以强度 $α$ 添加该方向，可将 call rate 从接近 $0\\%$ 单调移动至 $90\\%$ 以上，同时保持调用格式良好。该 steering 在两个方向上均有效：调低它会抑制调用，调高它会引发新的调用，这些调用精确地落在模型无法凭借自身知识回答的问题上。我们还表明，该方向能泛化至 unseen tools，其强度与每个工具自身的方向相当，且不偏向任何特定的工具选择。在 live tool execution 下，单次 steering sweep 即可描绘出 cost/accuracy Pareto frontier，并使 open-domain QA accuracy 几乎翻倍（$0.29 \\! \\rightarrow \\! 0.56$）；相同的 recipe 可迁移至涵盖 dense、MoE 和 multimodal 架构的多种模型，且无需任何训练。我们的代码已在 https://github.com/YuqiChen4188/Steering-Tool-Use-Propensity 公开。"}, {"title": "LifePlanner: Evaluating LLM Agents for Geo-spatial Planning with Social Media Data", "arxiv_id": "2608.25039", "authors": "Zhen Dong, Yuning Peng, Yutao Shi, Lei Zhong, Yongsen Mao, Yuan Liu, Haiping Wang", "summary": "Geo-spatial planning, like trip design, is a realistic testbed for LLM agents because it requires grounded tool use, noisy evidence retrieval, and multi-constraint reasoning. Most benchmarks, however, only provide clean geospatial data and tools, missing the open-ended social signals that people use in daily planning. We introduce LifePlanner, a benchmark that enriches map data with large-scale local social media posts and provides access through an MCP toolset. LifePlanner provides an evaluation suite spanning four task categories and three difficulty levels. Experiments show frontier LLMs perform well on simple retrieval but degrade sharply on complex planning, with the Pass Rate dropping to 40.2%. Results show that failures mainly stem from incomplete evidence acquisition from such a large multimodal database, imprecise tool use, and weak constraint integration rather than model size or reasoning length, suggesting that future progress requires effective grounded planning instead of scaling alone.", "category": "cs.AI", "cluster": "Tool Use \u0026 Planning", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=14 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 论文提出了一个名为LifePlanner的基准测试，用于评估LLM智能体在地理空间规划中的能力。其核心贡献在于评估智能体的工具使用、噪声证据检索和多约束推理能力，并诊断了智能体在复杂规划任务中的失败机制（如证据获取不完整、工具使用不精确、约束整合薄弱）。根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents / Tool-Use Agents，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。”以及第五步的校准：“不要只因为论文是 benchmark、evaluation、behavior analysis... 就排除”，该论文明确围绕LLM Agents的规划和工具使用展开，符合研究焦点中的单智能体方向（规划、工具使用）。因此，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：如何系统评估 LLM agents 在真实日常地理空间规划场景中的能力，特别是当规划需要整合来自社交媒体的嘈杂、非结构化信号时。作者将 geo-spatial planning 定义为在地理、时间、语义和用户特定约束下，利用外部空间证据和工具来选择和排序真实世界地点的过程。这一问题的核心挑战在于，真实的规划任务不仅需要查询结构化地图数据，还需要从高噪声的社交媒体帖子中提取隐含偏好（如\"hidden gem\"景点、限时活动、短腿犬互动咖啡馆等），并将这些非结构化证据与显式约束联合优化为可行方案。该问题之所以重要，是因为 geo-spatial planning 构成了一个对 LLM agents 三项关键能力的综合测试场：多模态异构空间证据的长上下文处理、grounded spatial analysis 的工具使用、以及成本-偏好权衡的 constrained reasoning。论文发现，当前 frontier LLMs 在简单检索任务上表现良好，但在复杂规划任务上 Pass Rate 骤降至 40.2%，且失败主因并非 hallucination 或 model size 不足，而是 incomplete evidence acquisition、imprecise tool use 和 weak constraint integration。这一发现对未来 agent 训练方向具有直接指导价值：仅靠 scaling 无法弥合规划差距，需要在 effective grounded planning 方面取得实质性进展。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决。现有 geo-spatial planning benchmarks 在两个关键维度上存在系统性缺陷。在 environment 维度，绝大多数 benchmark——包括 TravelPlanner (Xie et al., 2024)、MapEval (Dihan et al., 2025)、ChinaTravel (Shao et al., 2026)、COMPASS (Qin et al., 2026)、MobilityBench (Song et al., 2026)、DeepPlanning (Zhang et al., 2026) 和 TravelBench (Cheng et al., 2026)——均构建于干净的 cartographic database 或人工策划的结构化资源之上，部分提供了 map-based API 供 agents 进行信息检索与分析，但无一纳入 open-ended social signals。这一缺失并非偶然疏忽：社交媒体数据本质上具有歧义性、冗余性和时效性，包含模糊的地点指代和上下文依赖的语义，将其引入 benchmark 会显著增加数据构建和评估的工程复杂度。然而，这种回避导致了 environment 与真实人类行为之间的根本性偏离——现实中个体大量依赖社交媒体获取 timely、noisy、locally grounded 的空间知识，而仅凭结构化平台无法满足诸如\"寻找隐藏景点\"或\"限时活动\"等 socially-driven preferences。在 evaluation protocol 维度，CityEval (Feng et al., 2025a)、USTBench (Lai et al., 2025) 和 CityBench (Feng et al., 2025c) 虽涵盖多种城市任务类型，但缺乏分层难度设计；TripScore (Qu et al., 2025) 和 TP-RAG (Ni et al., 2025) 采用 static context 方式预先提供必要信息，回避了 dynamic tool interaction 的评估需求；TripTailor (Wang et al., 2025a) 和 ChinaTravel 虽具备难度分层，但任务类型单一。这种 task intent 狭窄且 difficulty stratification 薄弱的设计，使得研究者无法系统分析模型能力随任务复杂度变化的趋势，也无法区分 simple retrieval 与 complex constrained planning 之间的能力差距。LifePlanner 通过同时覆盖 Tool Box、Social Media、Multi-Task 和 Multi-Difficulty 四个维度（Table 1 中唯一全部满足的 benchmark），填补了这一评测缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM agents 的发展中，研究者逐渐意识到单纯的参数化知识无法应对复杂的 geospatial reasoning，因此开始引入外部工具和检索增强（如 RAG 和 map-based APIs）。然而，观察现有的 geo-spatial planning benchmarks，它们大多构建在干净、结构化的地图数据之上，这与人类真实的日常规划行为存在巨大割裂。现实中，人们在规划行程时不仅依赖地图导航，还会大量参考社交媒体上的非结构化、充满噪声的本地化信息（如寻找“隐藏景点”或特定氛围的店铺）。这种 open-ended social signals 在现有评估环境中是缺失的。同时，现有 benchmark 的任务设计往往意图单一且缺乏难度分层，难以系统性地诊断 agent 在从简单检索到复杂多约束规划过程中的能力断层。基于这些观察，作者推断：要真正评估 LLM agents 在现实场景中的 grounded planning 能力，必须构建一个融合结构化地图与大规模社交媒体噪声的环境，并设计一套能够系统性区分任务复杂度的评估协议，从而暴露模型在证据获取和约束整合上的真实瓶颈。\n\n### § 4 核心 Intuition\n\n现有方法失效的根源在于它们假设规划环境是干净且结构化的，而真实世界的规划要求 agent 能从充满噪声的社交媒体中提取非结构化线索并整合多源约束。LifePlanner 的核心 Intuition 是：将真实的社交媒体噪声注入地理空间规划环境，迫使 LLM agent 像人类一样在多源异构数据中主动探索、精确调用工具并整合隐式约束。通过这种设计，评估的重心从单纯的推理能力转移到了 grounded planning——即能否在庞大且模糊的信息库中获取完整证据，并将其与用户偏好和时空约束忠实结合，而非仅仅依赖模型规模或推理链长度。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《LifePlanner: Evaluating LLM Agents for Geo-spatial Planning with Social Media Data》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出的核心研究问题是：如何系统评估 LLM agents 在真实日常地理空间规划场景中的能力，特别是当规划需要整合来自社交媒体的嘈杂、非结构化信号时。作者将 geo-spatial planning 定义为在地理、时间、语义和用户特定约束下，利用外部空间证据和工具来选择和排序真实世界地点的过程。这一问题的核心挑战在于，真实的规划任务不仅需要查询结构化地图数据，还需要从高噪声的社交媒体帖子中提取隐含偏好（如\"hidden gem\"景点、限时活动、短腿犬互动咖啡馆等），并将这些非结构化证据与显式约束联合优化为可行方案。该问题之所以重要，是因为 geo-spatial planning 构成了一个对 LLM agents 三项关键能力的综合测试场：多模态异构空间证据的长上下文处理、grounded spatial analysis 的工具使用、以及成本-偏好权衡的 constrained reasoning。论文发现，当前 frontier LLMs 在简单检索任务上表现良好，但在复杂规划任务上 Pass Rate 骤降至 40.2%，且失败主因并非 hallucination 或 model size 不足，而是 incomplete evidence acquisition、imprecise tool use 和 weak constraint integration。这一发现对未来 agent 训练方向具有直接指导价值：仅靠 scaling 无法弥合规划差距，需要在 effective grounded planning 方面取得实质性进展。 ### § 2 前人工作与不足 该问题此前未被充分解决。现有 geo-spatial planning benchmarks 在两个关键维度上存在系统性缺陷。在 environment 维度，绝大多数 benchmark——包括 TravelPlanner (Xie et al., 2024)、MapEval (Dihan et al., 2025)、ChinaTravel (Shao et...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在 LLM agents 的发展中，研究者逐渐意识到单纯的参数化知识无法应对复杂的 geospatial reasoning，因此开始引入外部工具和检索增强（如 RAG 和 map-based APIs）。然而，观察现有的 geo-spatial planning benchmarks，它们大多构建在干净、结构化的地图数据之上，这与人类真实的日常规划行为存在巨大割裂。现实中，人们在规划行程时不仅依赖地图导航，还会大量参考社交媒体上的非结构化、充满噪声的本地化信息（如寻找“隐藏景点”或特定氛围的店铺）。这种 open-ended social signals 在现有评估环境中是缺失的。同时，现有 benchmark 的任务设计往往意图单一且缺乏难度分层，难以系统性地诊断 agent 在从简单检索到复杂多约束规划过程中的能力断层。基于这些观察，作者推断：要真正评估 LLM agents 在现实场景中的 grounded planning 能力，必须构建一个融合结构化地图与大规模社交媒体噪声的环境，并设计一套能够系统性区分任务复杂度的评估协议，从而暴露模型在证据获取和约束整合上的真实瓶颈。 ### § 4 核心 Intuition 现有方法失效的根源在于它们假设规划环境是干净且结构化的，而真实世界的规划要求 agent 能从充满噪声的社交媒体中提取非结构化线索并整合多源约束。LifePlanner 的核心 Intuition 是：将真实的社交媒体噪声注入地理空间规划环境，迫使 LLM agent 像人类一样在多源异构数据中主动探索、精确调用工具并整合隐式约束。通过这种设计，评估的重心从单纯的推理能力转移到了 grounded planning——即能否在庞大且模糊的信息库中获取完整证据，并将其与用户偏好和时空约束忠实结合，而非仅仅依赖模型规模或推理链长度。 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **LifePlanner: Evaluating LLM Agents for Geo-spatial Planning with Social Media Data** **Zhen Dong[1,*] , Yuning Peng[1,*] , Yutao Shi[1] , Lei Zhong[1] , Yongsen Mao[2]** , **Yuan Liu[2]** , **Haiping Wang[1,2]** 1Wuhan University 2Hong Kong University of Science and Technology {dongzhenwhu,yuningpeng,yutaoshi,leizhong}@whu.edu.cn yongsen.mao@connect.ust.hk, {yuanly,hpwang}@ust.hk \u003E *Equal contribution. **Correspondence:** hpwang@ust.hk ## **Abstract** Geo-spatial planning, like trip design, is a realistic testbed for LLM agents because it requires grounded tool use, noisy evidence retrieval, and multi-constraint reasoning. Most benchmarks, however, only provide clean geospatial data and tools, missing the open-ended social signals that people use in daily planning. We introduce LifePlanner, a benchmark that enriches map data with large-scale local social media posts and provides acce...", "additional_insights": "## § 8 Take-aways\n\nLifePlanner 将大规模社交媒体数据（小红书约 200,000 条笔记与评论）融入地理空间规划 benchmark，通过 MCP toolset 让 LLM agent 同时查询地图数据库和非结构化社交证据，填补了现有 benchmark 仅依赖 clean geospatial data 的空白。任务体系覆盖四个类别（Place Perception、Nearby Discovery、Routing、Trip Design）和三个难度层级（L0 单步检索、L1 多步推理、L2 隐式约束整合），共 667 个合成 query，能够系统性地分离检索能力与规划能力。实验揭示了一个尖锐的性能断层：L0 的 Pass Rate 为 89.4%，而 L2 骤降至 40.2%，且 Token Usage 从 24.6k 增至 251.1k，说明复杂规划中的多跳证据收集与约束整合是当前 LLM agent 的核心瓶颈。失败模式分析表明，Reasoning Purity 在 L2 仍保持 86.4%，即模型并未严重 hallucinate；真正的问题是 Information Grounding 降至 64.6%（证据获取不完整）和 Tool Efficiency 降至 44.6%（工具调用冗余或不够精准）。模型规模扩展和更长的 reasoning trace 并不能弥合这一差距——GPT-5.4 未超越 Qwen3.5-27B 或 GLM-5.1，Gemini-3.1-Pro-Preview 用 token 最少却因 early-stopping 损失性能，而 Qwen3.5-27B 消耗 191.2k token 仍不如仅用 75.2k 的 GLM-5.1。论文据此提出，未来进展需要 effective grounded planning 而非单纯 scaling。\n\n## § 9 最脆弱的假设\n\n核心假设是：Data Engine Agent 构建的每个评估 case 都存在唯一正确答案（answer uniqueness），且该答案所依赖的 social media evidence 在被 LLM 检索时具有确定性可匹配性。整个 evaluation protocol 的 Pass Rate 度量建立在 ground truth answer $a^\\star$ 与模型输出 $a$ 的精确比对之上——PIoU 要求 place set 完全重合，Order Consistency 要求访问顺序一致，Routing Deviation 要求路线成本匹配。如果同一 query 存在多个同样合理的规划方案，那么模型选择了与 $a^\\star$ 不同但同样正确的方案就会被判为失败，导致 Pass Rate 被系统性低估，进而使\"LLM 在复杂规划上表现差\"这一核心结论失去可靠性。\n\n这个假设在实际中极易不成立。L2 任务要求整合 implicit preference（如\"cute vibe for taking pictures\"\"hidden gem\"），这类偏好本质上是主观的、多解的——多家餐厅可能都符合\"粉色装修适合拍照\"的描述，多条 social media note 可能指向不同的合理地点。论文虽声称通过 `place_search` 的 strict filter 验证 uniqueness，但 social media evidence 的语义匹配本身具有模糊性：一个 note 提到\"樱花元素\"与另一个提到\"粉色系\"可能指向不同但同样合理的候选地点。论文提供的证据仅是 manual cross-validation（人工交叉验证 solvability 和 answer uniqueness），但未报告 uniqueness 验证的通过率、争议案例数量或 inter-annotator agreement，也未展示在存在多个合理答案时 evaluation metrics 的 sensitivity analysis。如果 uniqueness 假设在哪怕 20% 的 L2 case 上不成立，那么 L2 的 40.2% Pass Rate 中可能有相当一部分是 false negative，\"复杂规划能力不足\"的结论就需要被打折。\n\n## § 10 最小复现实验\n\n用一周时间，可以验证论文最核心的 claim——\"失败主要源于 incomplete evidence acquisition 和 weak constraint integration 而非 hallucination\"。不需要构建完整的 MCP server 或采集 200k 条 social media data，而是手动构造一个微型环境并直接观察 LLM 的行为。\n\n具体方案：从论文的 Figure 8 示例 task instance 出发，手动构建一个包含约 30 个地点的 mini map database（含 name、place_type、opentime_week、rating、cost、tag 字段）和约 50 条 social media notes（含 note_id、title、desc、tag_list）。为这些地点设计 5 个 L0 query 和 5 个 L2 query，L2 query 需包含 implicit preference（如\"想和柯基犬互动\"\"适合安静看书\"）和 temporal constraint（如营业时间顺序）。实现 4 个最基础的 MCP tool：`place_search`、`place_detail`、`search_notes`、`routing`，用 Python 函数模拟返回结果。选取 2 个 frontier LLM（如 GPT-4o 和 Claude-Sonnet）在相同 system prompt 和 30 次 tool call 预算下运行。\n\n测量三个指标：(1) Pass Rate，手动标注每个输出是否满足所有显式和隐式约束；(2) Information Grounding，检查模型是否检索了 ground truth 所需的全部 note_id 和 place attribute；(3) 失败原因分类，对每个失败 case 标注为\"证据缺失\"\"工具查询不精准\"\"约束整合失败\"或\"hallucination\"四类之一。如果 L0 Pass Rate 显著高于 L2（如 \u003E80% vs \u003C50%），且失败 case 中 ≥70% 归因于证据缺失或约束整合失败而非 hallucination，则支持论文的核心 claim；反之，若 L2 失败中 hallucination 占主导，或 Pass Rate 在 L2 并未显著下降，则反驳该 claim。这个实验仅需约 2 天构建环境、1 天设计 query、2 天运行实验和标注、1 天分析，完全可行。", "research_value": "### § 11 最强反例设计\n\n我将设计一个针对 evaluation protocol 的反例，直接挑战“L2 任务 Pass Rate 骤降源于 LLM 规划能力不足”这一核心结论。具体而言，我会构建一组具有高主观性和多解性的 L2 query，例如“寻找适合周末放松且具有复古氛围的 hidden gem 咖啡馆”，并确保数据库中存在至少 5 个在 rating、tag 和 social media notes 上均高度符合该描述的候选地点。在这个环境中，ground truth answer $a^\\star$ 仅为其中一种合理方案。我将运行多个 frontier LLMs 收集它们被判定为 failed 的输出，随后引入 human evaluation 或 LLM-as-a-judge 机制，对这些 failed cases 进行 constraint satisfaction 的重新评估。如果结果表明，超过 40% 的 failed cases 实际上完全满足了 query 中的 explicit 和 implicit constraints，只是与 $a^\\star$ 的 place set 不同，那么这就提供了一个强有力的替代解释：L2 的性能断层并非源于 incomplete evidence acquisition 或 weak constraint integration，而是由于 rigid metric（如 PIoU 和 Order Consistency）在处理 socially-driven preferences 时产生了大量的 false negatives。这一反例将证明，论文所声称的“复杂规划能力不足”实际上是 evaluation protocol 的伪影，真实的 LLM agent 可能已经具备了处理多约束规划的能力，只是被 deterministic matching 机制错误地惩罚了。\n\n### § 12 Follow-up Research Idea\n\n这一想法由 LifePlanner 中 deterministic evaluation protocol 与 subjective social preferences 之间的根本冲突所驱动。当前的 benchmark 强制要求 answer uniqueness，这在处理诸如“hidden gem”或“cute vibe”等本质上连续且多解的偏好时，不可避免地产生大量 false negatives，掩盖了 LLM agent 在 preference alignment 上的真实表现。为了打破这一局限，我提议将 geo-spatial planning 的评估框架从“Exact Constraint Matching”转变为“Preference Negotiation and Trade-off Optimization”。我们可以借鉴 Recommender Systems 和 Reinforcement Learning from Human Feedback (RLHF) 中的 reward modeling 技术，不再寻找唯一正确答案，而是评估 agent 在 hard constraints（如营业时间、路线成本）与 soft social preferences（如氛围、小众程度）之间进行权衡的质量。具体而言，第一个实验将构建一个 Geospatial Preference Reward Model (Geo-PRM)。首先，针对 LifePlanner 中的 L2 任务，人工生成多个满足 hard constraints 但在 social preferences 上具有不同覆盖度的候选方案，并让人类标注员对这些方案进行 pairwise ranking。利用这些数据训练 Geo-PRM，使其能够捕捉 social media evidence 与 implicit preference 之间的模糊映射关系。随后，使用 Geo-PRM 替代原有的 PIoU 和 Order Consistency，重新评估现有 frontier LLMs 在 LifePlanner 上的表现。如果 LLMs 在 Geo-PRM 评分下的排名与原论文的 Pass Rate 排名出现显著差异，特别是那些因找到 alternative valid plans 而被原 metric 惩罚的模型获得更高评分，这将证明 preference-aware evaluation 能够更准确地反映 agent 的 grounded planning 能力。这一方向不仅解决了当前 benchmark 的评估盲区，还为训练能够理解 subjective spatial intent 的下一代 LLM agents 提供了全新的 reward signal。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zhen Dong\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Yuning Peng\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Yutao Shi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Lei Zhong\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yongsen Mao\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yuan Liu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Haiping Wang\", \"affiliations\": [1, 2], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Wuhan University\"},\n    {\"id\": 2, \"name\": \"HKUST\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"**\", \"text\": \"Correspondence: hpwang@ust.hk\"}\n  ]\n}\n```", "summary_translation": "地理空间规划（如行程设计）是 LLM agents 的现实 testbed，因为它需要 grounded tool use、noisy evidence retrieval 和 multi-constraint reasoning。然而，大多数 benchmarks 仅提供干净的 geospatial data 和工具，缺失了人们在日常规划中使用的 open-ended social signals。我们引入了 LifePlanner，这是一个用大规模本地社交媒体帖子丰富 map data 并通过 MCP toolset 提供访问的 benchmark。LifePlanner 提供了一个涵盖四个 task categories 和三个 difficulty levels 的 evaluation suite。实验表明，frontier LLMs 在 simple retrieval 上表现良好，但在 complex planning 上急剧下降，Pass Rate 降至 40.2%。结果表明，失败主要源于从如此 large multimodal database 中进行 incomplete evidence acquisition、imprecise tool use 以及 weak constraint integration，而不是 model size 或 reasoning length，这表明未来的进展需要 effective grounded planning，而不仅仅是 scaling。"}, {"title": "AdaVDR: Adaptive Tool Use and Reflection for Video Deep Research", "arxiv_id": "2608.25559", "authors": "Xintong Zhang, Xiaomeng Fan, Shilin Yan, Ekko He, Zicheng Liu, Zijian Zou, Guannan Zhang, Yuwei Wu, Zhi Gao, Hongwei Xue", "summary": "Video deep research answers complex questions by jointly understanding video content and retrieving external knowledge from the open Web. However, diverse questions and videos require different tool-use strategies, and inappropriate tool calls can produce incorrect results. Uncertain grounding and retrieval also make unnecessary interactions costly and error-prone, increasing latency and reasoning errors. To address these challenges, we propose AdaVDR, an adaptive video deep research agent with adaptive tool invocation and reflection. AdaVDR selects tools according to the task and its capabilities, and backtracks only when unreliable intermediate results require correction. To enable these capabilities, we develop a video deep research data construction pipeline. We first discover retrieval-relevant events and entities in diverse videos and acquire detailed information through grounding and external retrieval to construct high-quality QA pairs. For each QA, task-specific prompts organize the information acquisition process into a tool-use trajectory, allowing different question and video types to follow different grounding and retrieval strategies. We further introduce model-conditioned tool necessity filtering, which evaluates tool calls against the target model's video understanding and internal knowledge, removing tools or tool chains the model can bypass. This yields trajectories tailored to the target model's video understanding capability and knowledge. Using this pipeline, we construct training data and VDR-EE, a benchmark covering entity-centric and event-centric questions. We perform supervised fine-tuning followed by reinforcement learning with a redundancy-aware reward to strengthen adaptive tool invocation and reflection. Experiments show that our method performs best among the evaluated open-source models on VDR-EE and substantially improves over its base models on VideoDR.", "category": "cs.AI", "cluster": "Tool Use \u0026 Planning", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了一个名为 AdaVDR 的自适应视频深度研究智能体，并开发了相应的数据构建和训练流程（SFT + RL）来强化其自适应工具调用和反思能力。论文明确聚焦于 LLM Agent 的核心能力，包括 Tool Use（根据任务和模型能力选择工具）、Self-Reflection（在中间结果不可靠时进行回溯纠正）以及 Agent Training（通过监督微调和强化学习训练智能体的工具使用轨迹）。虽然论文的应用场景是视频理解，但视频在此处是智能体感知和处理的环境，研究的本质仍是改进智能体的工具使用策略和自我反思机制。这完全符合筛选标准中“单智能体：智能体的规划、工具使用、自我反思”以及“训练LLM智能体”的研究焦点，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出并解决的研究问题是Video Deep Research（视频深度研究）中的自适应工具调用与反思机制。具体而言，在需要联合理解视频内容并从开放Web检索外部知识以回答复杂问题的场景下，如何让agent根据任务类型、自身视频理解能力和内部知识，动态选择必要的工具（如temporal grounding、timestamp grounding、spatial grounding、image search、web search、page visit），并在中间结果不可靠时进行自适应的反思与回溯纠正。该问题包含两个核心挑战：一是不同的问题类型和视频内容需要截然不同的工具使用策略，不合适的策略无法获取关键证据甚至导致错误推理；二是video grounding和external retrieval工具本身具有固有的不确定性，当模型已具备足够能力或知识时，不必要的工具调用不仅增加inference latency，还会暴露于grounding和retrieval错误风险中，加剧incorrect reasoning的传播。\n\n这个问题的重要性在于，Video Deep Research将video question answering扩展到开放世界场景，所需信息可能不完全包含在视频本身中，而需要进一步检索和验证外部来源，这对于涉及fine-grained entities、evolving events和up-to-date factual information的问题尤为关键。解决这一问题能带来双重价值：一方面通过adaptive tool invocation减少冗余工具交互，提升推理效率并降低latency；另一方面通过adaptive reflection在中间证据不可靠时进行针对性纠正，防止错误信息在多轮推理中传播，从而提升推理准确性。\n\n### § 2 前人工作与不足\n\nVideo Deep Research这一问题之前尚未被充分解决。最相关的前人工作可分为两类。第一类是Video understanding agents，如VideoMind [Liu et al., 2025b]、LVAgent [Chen et al., 2025]、VCA [Yang et al., 2025b]和Deep Video Discovery [Zhang et al., 2025]，它们通过迭代定位视频内的question-relevant evidence来改进长视频推理，部分方法还引入了uncertainty-aware plan adjustment [Zhi et al., 2025]、hierarchical memory backtracking [Zuo et al., 2026]或dynamic temporal grounding [Yuan et al., 2025]。然而，这些方法的evidence acquisition主要局限于视频内部，而Video Deep Research还需要获取与grounded entities或events相关的外部信息。它们的方法设计未考虑外部retrieval的协调需求，因为其任务定义本身不涉及开放Web知识的联合推理。\n\n第二类是Multimodal deep research agents，如Search-R1 [Jin et al., 2025]、MMSearch-R1 [Wu et al., 2025]、OpenSearch-VL [Chen et al., 2026]和RedSearcher [Chu et al., 2026]，它们通过迭代推理和调用外部工具获取信息，多模态扩展进一步结合了image search、visual grounding等视觉操作。然而，这些方法主要在静态输入图像或从Web检索的视觉证据上操作，缺乏对视频时间维度的处理。Video Deep Research引入了额外的时间复杂性：相关证据可能对应某一特定时刻出现的entity或某一段落内展开的event，需要将video grounding与external retrieval协调。虽然最近的工作如VideoDR [Liu et al., 2026]开始定义和评估这一设置，但一个有效的Video Deep Research agent必须针对每个问题确定是否需要以及需要哪些temporal、timestamp、spatial grounding和retrieval操作，同时从不可靠的中间结果中恢复。前人方法未能解决这一自适应工具选择和反思纠正的核心挑战，根本原因在于它们的方法基于固定workflow或静态图像输入，未考虑视频场景中工具需求的高度多样性（event-centric与entity-centric问题需要完全不同的grounding策略）以及中间结果的不确定性（grounding定位不精确或retrieval返回不相关结果时缺乏纠正机制）。此外，当时也缺乏同时覆盖entity-centric和event-centric问题的综合评测benchmark，使得这一问题的难度和工具使用差异未被充分暴露。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Video Deep Research 任务提出之前，学术界已经积累了大量关于 video understanding agents 和 multimodal deep search agents 的经验。一方面，处理长视频推理的 agent（如 VideoMind、Deep Video Discovery）通常依赖固定的多步 grounding pipeline 来定位视频内部证据；另一方面，多模态搜索 agent（如 MMSearch-R1、OpenSearch-VL）则通过迭代调用视觉裁剪和 Web 检索工具来获取外部知识。然而，当这两条线索在 Video Deep Research 中交汇时，研究者必然面临一个尴尬的局面：视频具有时间维度，且问题类型高度多样（event-centric 与 entity-centric 所需的工具链截然不同）。如果沿用固定的 agentic workflow，不仅会因为不必要的 spatial grounding 或 image search 引入额外的 exposure to grounding errors，还会大幅增加 inference latency。\n\n更深层的痛点在于，video grounding 和 external retrieval 本质上是充满不确定性的操作。经验表明，当模型本身已经具备足够的 video understanding capability 或 internal knowledge 时，强行调用外部工具反而会“弄巧成拙”，检索回的噪声会污染后续的 multi-turn reasoning。此外，多步工具调用中不可避免地会出现中间结果不可靠的情况（例如 image search 匹配到错误实体），如果没有一种机制来识别并纠正这些失败，错误就会沿着 reasoning trajectory 不断累积。基于这些观察，作者自然会想到：与其让 agent 盲目执行预定义的工具序列，不如赋予它两种能力——第一，根据当前任务需求和自身能力边界**动态裁剪**不必要的工具调用；第二，在遇到不可靠的中间证据时**按需回溯**进行修正。为了让模型学会这种自适应行为，作者进一步意识到，传统的数据构造方法生成的轨迹往往包含大量对特定模型而言是冗余的步骤，因此必须引入一种基于模型自身能力的“必要性过滤”机制来清洗训练数据，最终辅以强化学习来巩固这种“能省则省，出错则改”的推理范式。\n\n### § 4 核心 Intuition\n\n先前方法失效的核心在于：固定的工具流水线无视了问题类型的差异与模型自身的能力边界，导致冗余的工具调用不仅浪费资源，还引入了额外的检索噪声；同时，缺乏对不可靠中间证据的纠错机制使得错误在多步推理中不断累积。这篇论文的核心 Intuition 是：让 agent 根据问题类型和自身已掌握的知识**动态决定是否调用某个工具**，并在中间证据不可靠时**按需触发反思与回溯**，而非盲目执行全流程。通过“基于模型能力的工具必要性过滤”来剔除训练数据中模型本可直接回答的冗余步骤，并利用强化学习进一步惩罚不必要的工具调用，从而在保证推理准确性的同时最大化工具使用的效率。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《AdaVDR: Adaptive Tool Use and Reflection for Video Deep Research》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出并解决的研究问题是Video Deep Research（视频深度研究）中的自适应工具调用与反思机制。具体而言，在需要联合理解视频内容并从开放Web检索外部知识以回答复杂问题的场景下，如何让agent根据任务类型、自身视频理解能力和内部知识，动态选择必要的工具（如temporal grounding、timestamp grounding、spatial grounding、image search、web search、page visit），并在中间结果不可靠时进行自适应的反思与回溯纠正。该问题包含两个核心挑战：一是不同的问题类型和视频内容需要截然不同的工具使用策略，不合适的策略无法获取关键证据甚至导致错误推理；二是video grounding和external retrieval工具本身具有固有的不确定性，当模型已具备足够能力或知识时，不必要的工具调用不仅增加inference latency，还会暴露于grounding和retrieval错误风险中，加剧incorrect reasoning的传播。 这个问题的重要性在于，Video Deep Research将video question answering扩展到开放世界场景，所需信息可能不完全包含在视频本身中，而需要进一步检索和验证外部来源，这对于涉及fine-grained entities、evolving events和up-to-date factual information的问题尤为关键。解决这一问题能带来双重价值：一方面通过adaptive tool invocation减少冗余工具交互，提升推理效率并降低latency；另一方面通过adaptive reflection在中间证据不可靠时进行针对性纠正，防止错误信息在多轮推理中传播，从而提升推理准确性。 ### § 2 前人工作与不足 Video Deep Research这一问题之前尚未被充分解决。最相关的前人工作可分为两类。第一类是Video understanding agents，如Vide...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在 Video Deep Research 任务提出之前，学术界已经积累了大量关于 video understanding agents 和 multimodal deep search agents 的经验。一方面，处理长视频推理的 agent（如 VideoMind、Deep Video Discovery）通常依赖固定的多步 grounding pipeline 来定位视频内部证据；另一方面，多模态搜索 agent（如 MMSearch-R1、OpenSearch-VL）则通过迭代调用视觉裁剪和 Web 检索工具来获取外部知识。然而，当这两条线索在 Video Deep Research 中交汇时，研究者必然面临一个尴尬的局面：视频具有时间维度，且问题类型高度多样（event-centric 与 entity-centric 所需的工具链截然不同）。如果沿用固定的 agentic workflow，不仅会因为不必要的 spatial grounding 或 image search 引入额外的 exposure to grounding errors，还会大幅增加 inference latency。 更深层的痛点在于，video grounding 和 external retrieval 本质上是充满不确定性的操作。经验表明，当模型本身已经具备足够的 video understanding capability 或 internal knowledge 时，强行调用外部工具反而会“弄巧成拙”，检索回的噪声会污染后续的 multi-turn reasoning。此外，多步工具调用中不可避免地会出现中间结果不可靠的情况（例如 image search 匹配到错误实体），如果没有一种机制来识别并纠正这些失败，错误就会沿着 reasoning trajectory 不断累积。基于这些观察，作者自然会想到：与其让 agent 盲目执行预定义的工具序列，不如赋予它两种能力——第一，根据当前任务需求和自身能力边界**动态裁剪**不必要的工... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：**==\u003E picture [48 x 15] intentionally omitted \u003C==** # **AdaVDR: Adaptive Tool Use and Reflection for Video Deep Research** **Xintong Zhang**[1,2,*] , **Xiaomeng Fan**[2,*] , **Shilin Yan**[1] , **Ekko He**[1] , **Zicheng Liu**[1] , **Zijian Zou**[1] , **Guannan Zhang**[1] , **Yuwei Wu**[2] , **Zhi Gao**[2,†] , **Hongwei Xue**[1,†] 1Accio Team, Alibaba Group 2Beijing Key Laboratory of Intelligent Information Technology, School of Computer Science \u0026 Technology, Beijing Institute of Technology ## **Abstract** Video deep research aims to answer complex questions by jointly understanding video content and retrieving external knowledge from the open Web. However, diverse question and video types require different tool-use strategies, where inappropriate tool invocation lead to incorrect results. The inherent uncertainty of grounding and retrieval makes unnecessary tool interactions both costly...", "additional_insights": "### § 8 Take-aways\n本文提出了 AdaVDR，一个用于 video deep research 的 adaptive agent，通过 adaptive tool invocation 和 adaptive reflection 机制，根据任务需求和模型自身能力动态选择工具，并仅在中间结果不可靠时进行回溯纠错。为赋予模型此能力，作者设计了数据构建 pipeline，通过 model-conditioned tool necessity filtering 移除基座模型自身能力可覆盖的冗余工具链，生成定制化的 tool-use trajectories。基于该 pipeline，作者构建了涵盖 entity-centric 和 event-centric 问题的 VDR-EE benchmark，要求模型联合推理视频内容与外部 Web 知识。在训练策略上，模型先通过 SFT 学习任务适配的工具选择与多轮推理，再通过带有 redundancy-aware reward 的 GRPO 强化学习，在保证准确率的同时进一步抑制不必要的工具调用。实验表明，该方法在 VDR-EE 和 VideoDR 上均显著优于基座模型，不仅提升了推理准确率，还有效降低了平均工具交互轮数。\n\n### § 9 最脆弱的假设\n本文最核心且失败代价最大的假设是：**基座模型（如 Qwen3-VL-8B）能够准确评估自身的内部知识与视频理解能力边界，从而可靠地判断何时可以跳过工具调用。** 这一假设是 model-conditioned tool necessity filtering 和 adaptive tool invocation 的基石。如果该假设不成立，即模型高估了自己的能力，它会跳过必要的 grounding 或 retrieval 步骤，导致关键证据缺失并引发幻觉；如果低估了能力，则退化为冗余调用，失去 adaptive 的意义。在实际中，小模型普遍存在严重的知识盲区和过度自信问题，极难精准区分“已知”与“未知”。论文 Table 8 的消融实验间接暴露了这一风险：仅使用 adaptive data 进行 SFT 时，准确率从 45.00% 降至 43.00%，说明模型确实存在错误跳过有用工具的倾向。尽管论文试图通过引入 reflection data 和 RL 阶段的 redundancy-aware reward 来弥补，但 RL 的 reward 设计并未直接惩罚“因跳过工具而产生的幻觉”，仅依赖最终答案的正确性来间接纠偏。如果模型在跳过工具后仍能输出看似合理但事实错误的答案，RL 机制将无法有效纠正这种过度自信，导致核心的 adaptive 机制失效。\n\n### § 10 最小复现实验\n若有 1 周时间，可设计一个最小复现实验来验证 **model-conditioned tool necessity filtering** 是否真的能在不损害准确率的前提下减少工具调用。使用论文公开的 VDR-EE benchmark 中的 250 个问题作为测试数据。选择 Qwen3-VL-8B-Instruct 作为基座模型，实现两个简单的 agentic pipeline：一个是固定流程的 baseline（严格按 temporal grounding -\u003E timestamp grounding -\u003E spatial grounding -\u003E image search -\u003E web search 的顺序执行），另一个是 filtered pipeline（在执行每一步工具前，先让模型根据当前上下文直接预测该工具的预期输出，若预测结果与实际工具输出一致则跳过该工具）。测量两个 pipeline 在测试集上的最终答案准确率（由 LLM judge 评判）和平均工具调用次数。如果 filtered pipeline 在保持准确率不显著下降（差距 \u003C 2%）的同时，平均工具调用次数显著减少（如降低 20% 以上），则支持论文关于 adaptive tool invocation 可提升效率的 claim；若准确率大幅下降，则直接反驳了模型能可靠评估自身能力边界的核心假设。", "research_value": "### § 11 最强反例设计\n要对该论文进行最有力的攻击，我会设计一个基于“知识冲突与过度自信”的实验，直接挑战其核心假设：即基座模型能够准确评估自身能力边界以进行 tool necessity filtering。具体而言，我会构建一个包含“时间漂移与实体混淆”的 adversarial test set。在这个测试集中，视频内容涉及某个常见实体在特定历史时刻的状态（例如某公司在2022年发布的一款产品），而问题要求结合最新的 Web 知识回答该实体的当前状态。由于基座模型（如 Qwen3-VL-8B）的内部知识通常包含该常见实体的先验信息，它在 model-conditioned tool necessity filtering 阶段会表现出极高的过度自信，错误地认为自己已经掌握了足够信息，从而在生成的 trajectory 中过滤掉 web search 和 page visit 步骤。在推理阶段，模型会直接依赖过时的内部知识生成看似合理但事实错误的答案。更致命的是，由于 RL 阶段的 redundancy-aware reward 仅依赖最终答案的表面正确性或格式匹配来进行间接纠偏，缺乏对“跳过工具导致幻觉”的直接惩罚，这种错误不仅无法被 reflection 机制捕获，反而会因为推理路径短、符合“减少冗余工具调用”的 reward 倾向而被 RL 强化。这个反例揭示了一个危险的替代解释：AdaVDR 性能的提升和工具调用次数的减少，可能并非源于模型学会了“自适应工具调用”，而是因为数据过滤 pipeline 系统性地剔除了那些模型“自以为会但实际会犯错”的困难样本，迫使模型退化为一个依赖内部偏见的闭卷系统，在需要 up-to-date 外部知识的真实开放世界场景中可预测地失败。\n\n### § 12 Follow-up Research Idea\n基于上述局限，我提出一个 novel research idea：**Calibrated Epistemic Routing for Agentic Systems（基于校准认知不确定性的智能体路由机制）**。该想法的驱动局限在于，当前依赖 LLM 自身 verbalized confidence（语言化自信度）来决定是否调用工具的范式（如 AdaVDR）在小型模型上必然失败，因为小模型缺乏可靠的自我评估能力，无法区分“已知”与“未知”。为了从根本上解决这一问题，我们可以借鉴相邻领域 Uncertainty Quantification (UQ) 和 Mechanistic Interpretability 的方法，不再询问模型“你需要工具吗”，而是通过探针直接测量模型内部表征的 epistemic uncertainty（认知不确定性）。\n\n具体而言，我们放弃 model-conditioned tool necessity filtering 中的 prompt-based 评估，转而训练一个轻量级的 linear probe，该 probe 作用于 LLM 在处理视频和问题时的特定 intermediate hidden states。这个 probe 的目标不是预测答案的正确与否，而是预测“如果此时不调用外部 grounding 或 retrieval 工具，模型生成事实性幻觉的概率”。当 probe 检测到高 epistemic uncertainty 时，系统强制注入工具调用指令，无视模型自身的生成倾向；当 uncertainty 极低时，则允许模型直接输出。第一个实验将聚焦于对比验证：在 AdaVDR 的 VDR-EE benchmark 上，我们使用 Qwen3-VL-8B 作为 base model，对比三种路由策略：(1) AdaVDR 的 SFT+RL 自适应路由，(2) 固定 workflow 的 baseline，(3) 我们的 hidden-state probe 路由。我们将专门构建一个包含 hard negatives 和 temporal drift 的子集，测量三种策略在“本不需要工具但模型误以为需要”和“需要工具但模型误以为不需要”这两类边界情况下的 hallucination rate 和 tool call accuracy。这一提议与已有工作的根本区别在于：它将 agentic tool use 的触发机制从模型的行为层（生成文本决定）下沉到模型的表征层（内部几何特征决定），将工具调用从一种“学习到的策略”转化为一种“可证明校准的物理触发”，从而彻底绕开小模型无法可靠进行自我能力评估的认知瓶颈。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Xintong Zhang\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Xiaomeng Fan\", \"aff
