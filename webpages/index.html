经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：2026-09-04 **==\u003E picture [19 x 19] intentionally omitted \u003C==** # **Terminal-Universe: Turning Agent Trajectories into Scalable Terminal Environments** Jie Wu[1,2,*] , Zhenru Zhang[1,‡] , Beichen Zhang[1] , Xuwu Wang[1] , Yuhui Su[1] , Mouxiang Chen[1] , Peng Wang[1] , Zhihai Wang[1] , Que Shen[1] , Hao Zhou[1] , An Yang[1] , Fei Huang[1] , Yujiu Yang[2,†] , Dayiheng Liu[1,†] **1Qwen Team, Alibaba Group 2Tsinghua University** ‡Project leader †Corresponding authors ## **Abstract** As terminal-based code agents become increasingly prevalent, the corresponding agent trajectories have accumulated at scale, while realistic, executable environments remain scarce. However, environments are what agent post-training actually requires: each one can be re-queried into many verifiable tasks and provides the execution feedback, whereas a trajectory is a single frozen demonstration. Rather than generat...", "additional_insights": "### § 8 Take-aways\n\n论文提出 Terminal-Universe 框架，将已有的 agent trajectories 转化为可复用的 executable environments，而非从零构建或依赖真实 repository history。通过 deterministic replay 重放文件操作恢复 partial workspace，再由 agentic completion 补全缺失依赖，最终将 workspace sufficiency rate 从 40.2% 提升至 93.5%。在重建环境上，通过 Intent Recovery、Single-WS、Cross-WS 和 Multi-Round 四种方式生成新任务，其中 Cross-WS 通过跨代码库依赖挖掘扩展任务广度，Multi-Round 通过 user agent 模拟迭代反馈扩展任务深度。实验表明，在重建环境中重新求解任务远优于直接模仿原始 trajectories（52.1 vs 36.7），且 verifier filtering 对高难度任务（如 Cross-WS）尤为关键，能以不到一半的数据量实现更高性能。在固定数据预算下，扩展 environment 数量比增加 query 或 solution 数量更有效，说明环境多样性是提升 agent 能力的核心驱动力。\n\n### § 9 最脆弱的假设\n\n最关键的假设是：agentic completion 能够在不泄露解决方案的前提下，准确补全 workspace 的缺失文件和依赖，使重建环境足以支撑任务求解。如果 completion agent 引入了与原始项目不一致的依赖、错误配置或泄露了 solution，那么后续的 task generation、verifier 构建和 teacher rollout 都会建立在错误的环境基础上，导致整个 pipeline 产出的训练数据质量崩塌。论文提供了部分证据：Table 2 显示 completion 将 sufficiency rate 提升至 93.5%，Table 5 显示 completed environments 比 replay-only 提升 4.2 分。但论文也承认（§B.1），在 30 个随机抽样的 Terminal completions 中，有 8 个引入了不必要的文件，且 verifier 和 solution 均由同一 teacher model（Qwen3.7-Max）生成，缺乏独立验证，这意味着 completion 的错误可能被同源 verifier 掩盖，sufficiency rate 可能被高估。\n\n### § 10 最小复现实验\n\n用一周时间可验证 agentic completion 对 environment sufficiency 的贡献。从公开的 LFM2-Terminal 数据集中抽取 100 条 trajectories，仅实现 deterministic replay 阶段，得到 100 个 partial workspaces。然后用一个开源 LLM（如 Qwen2.5-72B）作为 completion agent，按论文 §B.1 的 prompt 对每个 workspace 进行补全。再用另一个 LLM 作为 judge，按论文 §B.2 的 sufficiency 标准评估 replay-only 和 replay+completion 两组 workspace 的 task-sufficiency。测量两组的 sufficiency rate 差值。若 completion 后 sufficiency rate 显著上升（如从 40% 左右升至 80% 以上），则支持论文的核心 claim；若提升有限或 judge 发现大量不一致的补全，则表明 completion 的实际效果被高估。此实验无需实现 task generation、verifier 或 SFT pipeline，即可验证 pipeline 最基础的环节是否成立。", "research_value": "### § 11 最强反例设计\n\n要对该论文进行最有力的攻击，我会设计一个针对“Verifier-Teacher Homology”（验证器与教师模型同源）和“Hidden State Blindness”（隐藏状态盲区）的联合反例实验，旨在证明其报告的 93.5% sufficiency rate 和 SFT 性能提升是建立在同源 LLM 的“闭环幻觉”之上，而非真实的可执行环境。具体而言，我会从生成的 Cross-WS 和 Multi-Round 任务中抽取 200 个被论文判定为“task-sufficient”且 verifier 验证通过的环境，引入一个完全独立的、基于真实 Docker container 的 ground-truth execution engine 进行交叉验证。在这个独立验证中，我会刻意剥离 trajectory 中未记录的非文件系统状态（如 background processes、database states、network sockets 或特定的 OS-level environment variables）。如果论文的核心 claim 成立，这些环境应当能独立支撑 task 的求解；但如果我的假设正确，当独立 verifier 强制要求依赖这些隐藏状态时，环境的实际 sufficiency rate 将发生断崖式下跌。进一步地，我会对 SFT 后的 agent 进行 probing 测试，提出一个替代解释：agent 在 Terminal-Bench 2.1 上 11.9 分的提升并非源于“环境多样性带来的泛化能力”，而是因为 agent 在同源 teacher model 生成的“简化版”环境中过拟合了 LLM 偏好的代码结构与错误模式。当面对真实世界中由人类编写的、充满非标准依赖和隐藏状态的历史代码库时，这个 SFT agent 的表现将劣于未经过此微调的 baseline，从而证明 Terminal-Universe 实际上是在批量制造“LLM 友好的伪环境”，而非真实的 executable environments。\n\n### § 12 Follow-up Research Idea\n\n基于 Terminal-Universe 试图从静态 trajectory 重建环境却受限于文件系统快照的局限，我提出一个全新的研究方向：**Latent Environment World Models for Agent Training**。该想法的驱动需求在于，真实的 terminal 环境本质上是一个具有复杂动态反馈的 state machine，而现有的 deterministic replay 和 agentic completion 试图去“物质化”地重建文件，这注定无法捕捉 OS 级别的隐藏状态和执行副作用，且极易泄露 solution。我们可以借鉴强化学习与机器人控制领域的 World Model（如 Dreamer 系列或 Learned Simulators）以及因果推断中的 Structural Causal Models (SCMs)。不再试图重建一个物理上可执行的 Docker container，而是训练一个 Neural World Model，使其从海量 agent trajectories 中学习环境的状态转移概率分布：给定当前 latent state 和 agent 的 tool call（如 `bash_command`），直接预测下一个 terminal output 和 workspace diff。第一个实验将聚焦于构建一个基于 Transformer 的 autoregressive environment simulator，并在包含大量隐藏状态交互（如启动后台服务、修改系统配置）的轨迹上训练它。随后，将一个 RL agent 放入这个“神经模拟器”中进行 post-training，并与在 Terminal-Universe 重建的物理容器中训练的 agent 进行对比。如果 agent 在 Neural World Model 中能习得处理隐藏状态的能力，且训练成本远低于维护海量真实容器，这将彻底打破现有“从轨迹重建物理环境”的范式，开启“将环境本身作为可学习分布”的全新研究方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jie Wu\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Zhenru Zhang\", \"affiliations\": [1], \"markers\": [\"‡\"]},\n    {\"name\": \"Beichen Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xuwu Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuhui Su\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Mouxiang Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Peng Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhihai Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Que Shen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hao Zhou\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"An Yang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Fei Huang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yujiu Yang\", \"affiliations\": [2], \"markers\": [\"†\"]},\n    {\"name\": \"Dayiheng Liu\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Qwen Team, Alibaba Group\"},\n    {\"id\": 2, \"name\": \"Tsinghua University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Work done during the internship at Qwen Team, Alibaba Group.\"},\n    {\"marker\": \"‡\", \"text\": \"Project leader\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding authors\"}\n  ]\n}\n```", "summary_translation": "随着基于终端的代码 agent 变得普及，agent trajectories 正在大规模积累，而现实且可执行的环境仍然稀缺。然而，环境才是 agent post-training 真正需要的：每个环境都可以被重新查询以生成许多可验证的任务，并提供执行反馈，而 trajectory 只是一个单一的、固定的 demonstration。与其从零开始生成环境，我们观察到现有 trajectories 中的 tool-execution history 暴露了它们所运行环境的结构和内容，这使得从 trajectories 自身重建这些环境成为可能。因此，我们引入了 Terminal-Universe，这是一个将每个 trajectory 转化为可重用环境，并对其进行探索以合成新任务和持续交互的框架。具体而言，Terminal-Universe 重放 trajectory 中记录的文件操作，以将每个文件恢复到 agent 修改它之前的状态，从而生成一个 partial workspace；随后，一个 completion agent 补充缺失的文件和依赖项。在这个恢复的 workspace 上，我们既重建了原始的 intent task，又合成了全新的任务。此外，我们还沿着两个互补的维度来扩展任务：广度和深度。对于广度，我们挖掘相关环境之间的 directional dependency relations，并合成跨越多个 codebases 的 cross-workspace queries，正如开发者在真实世界开发中经常做的那样。对于深度，我们将初始的 single-turn query 扩展为 multi-round session，通过 user agent 捕获迭代的用户反馈和需求细化。应用于公开的 terminal agent trajectories，Terminal-Universe 生成了 37.3k 个 task-sufficient environments。在该语料库上对 Qwen3.5-27B 进行 Supervised fine-tuning，使其在 Terminal-Bench 2.1 上的 single-round performance 提升了 11.9 分，并在 EvoCode-Bench v2 MT@4 上的 multi-round performance 提升了 13.8 分。"}, {"title": "Environment Evolution for Terminal Agents", "arxiv_id": "2609.04128", "authors": "Zhiyuan Fan, Tinghao Yu, Yuanjun Cai, Jiang Zhou, Jiangtao Guan, Jincheng Liu, Yun Yang, Dingxin Hu, Zhuo Han, Xing Wu, Feng Zhang, Lilin Wang", "summary": "Scaling interactive and verifiable environments is critical for training terminal agents. As frontier models become more capable, environments synthesized from scratch become less challenging and thus provide limited learning signals. Recent co-evolution methods iteratively synthesize environments near the model's learnable frontier based on weaknesses exposed during rollouts. However, their dependence on on-policy rollouts limits generalization and the continuous provision of learning signals as the model becomes stronger. In this paper, we propose environment evolution, which incrementally increases environment difficulty off-policy and schedules the evolved environments generation by generation during training to provide continuous learning signals. We derive three evolution directions that influence environment difficulty from the multi-turn learning objective and then implement evolution along these directions through a loop-engineered multi-agent harness. Quantitative rollout experiments with Hy4 preview, Claude Opus 5, and GPT-5.6 Sol show that environment evolution consistently produces more difficult environments. We validate its effectiveness on Qwen3.6-27B and Qwen3.6-35B-A3B through simple long-horizon RL training, improving their performance by 14.4 and 18.0 percentage points on Terminal-Bench 2.1, respectively.", "category": "cs.AI", "cluster": "Terminal Agent Environments", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了一种“环境演化”方法，通过 off-policy 方式增量增加环境难度，并利用一个 loop-engineered multi-agent harness（多智能体框架）来实现环境演化，从而为 terminal agents 的 long-horizon RL 训练持续提供学习信号。这完全符合筛选标准中的多个“保留”条件：首先，它研究了 agent training/RL 和 long-horizon agents；其次，它利用 multi-agent harness 作为核心机制来驱动环境的自动演化和改进，属于智能体运行组件的演化；最后，其核心机制涉及 co-evolution 和 environment evolution，属于自我演化与持续学习的范畴。论文没有触及任何排除标准（如安全、纯多智能体拓扑通信协议、图技术等），因此高度契合“LLM智能体及其演化”的研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：如何为训练 terminal agents 持续扩展可交互、可验证的 RL environments，使得在前沿模型能力不断增强的背景下仍能提供有效的学习信号。随着工业级 agentic RL 算法的稳定和异步基础设施的成熟，进一步扩展的瓶颈已从算法和系统转向环境本身——环境的难度和多样性是决定 agent 能通过 verifiable feedback 学到什么的核心杠杆，其中自适应难度保持持续学习潜力，多样性支持泛化能力。然而，当前从零合成的大规模 terminal environments 对前沿模型而言已不够具有挑战性，模型在重复 rollouts 中能稳定解决它们，导致这些环境在 RL 训练中因无法区分好坏 trajectory 而被丢弃，既浪费环境构建成本又降低保留训练分布的多样性。现有的 co-evolution 方法虽能通过 on-policy rollouts 暴露模型弱点来指导新环境合成，但其依赖 rollout model 和初始环境分布，限制了泛化能力，且当训练饱和、模型失败变得稀疏时无法持续提供学习信号。论文提出的 environment evolution 通过 off-policy 方式逐代增量提升环境难度，并沿 lineage 调度演化环境以提供持续学习信号，在 Qwen3.6-27B 和 Qwen3.6-35B-A3B 上分别将 Terminal-Bench 2.1 性能提升了 14.4 和 18.0 个百分点，验证了该范式的有效性。\n\n### § 2 前人工作与不足\n\n该问题此前已被部分解决，但现有方法在持续提供学习信号方面存在结构性不足。第一类前人工作是从零合成大规模 terminal environments，如 SkillSynth (Fan et al., 2026)、Endless terminals (Gandhi et al., 2026)、CLI-Universe (Hua et al., 2026) 等，通过人工设计的 pipeline 将 GitHub 仓库、技能和网页等资源转化为可执行环境。然而，论文的大规模 rollout 和质量评估实验揭示，这些开源环境存在 reward signal 质量低下的问题（如任务指令与 verification system 不匹配、环境损坏），且对当前前沿模型难度不足，无法提供有意义的学习信号。第二类是 Unsupervised Environment Design (UED) 范式，包括 POET (Wang et al., 2019) 通过环境变异和 agent 跨环境迁移生成新挑战，以及 regret-based generation (Dennis et al., 2021) 和 prioritized level replay (Jiang et al., 2021) 等方法。这些方法在传统 RL 中有效，但迁移到 LLM agents 时需要 designated agent 通过 on-policy rollouts 估计环境难度，生成的环境同时受限于 rollout agent 和初始环境分布。第三类是 agent-environment co-evolution 方法，如 GenEnv (Guo et al., 2025)、CoEvolve (Yang et al., 2026)、EnvGen (Zala et al., 2024) 等，通过收集目标模型的 rollouts、分析失败 trajectory 构建 weakness bank，再据此合成新环境。论文从 multi-turn learning objective 的推导精确揭示了 co-evolution 的根本局限：on-policy co-evolution 产生的信号主要针对 $\\sum_{t=1}^{L} \\mathbb{1}_t^{[\\theta]}[-\\log p_\\theta(\\kappa_t | \\sigma_{t-1}, g)]$，即模型在 seed 环境中已到达场景下的 skill-selection 错误，它既不显式控制所需的 solver 步数 $L$，也不系统地增加在参考分布 $p_T$ 下的 scenario novelty $-\\log p_T(\\sigma | g)$。这意味着 co-evolution 只覆盖了完整难度空间 $(L, -\\log p_T(\\sigma|g), -\\log p_T(\\kappa|\\sigma,g))$ 中的一个子空间，当训练饱和、模型失败变得稀疏时，可合成的有效新环境迅速耗尽。相比之下，environment evolution 直接在完整难度空间上操作，独立于目标策略构建递增难度的 lineage，从而提供了更通用的持续学习信号来源。", "core_insight": "### § 3 重建作者的思考路径\n\n在训练 terminal agents 时，RL environments 的难度和多样性是决定学习效果的核心杠杆。随着 frontier models 能力的提升，从零合成的环境往往变得过于简单，无法提供有效的 learning signals。为了解决这一问题，现有的 co-evolution 方法通过 on-policy rollouts 暴露模型弱点，并据此生成新环境。然而，这种方法将环境难度与特定 rollout model 的失败模式绑定，导致生成的环境受限于初始环境分布和模型当前能力，随着模型变强，失败变得稀疏，难以持续提供学习信号。作者由此意识到，需要一种脱离特定模型、直接度量环境本身难度的方法。从 multi-turn learning objective 出发，轨迹的负对数似然可以分解为三个贡献因素：所需的 solver turns 数量、scenario 在环境家族中的新颖度，以及所需 skill 在该 scenario 下的稀有度。如果将模型相关的概率替换为基于广泛世界知识的参考分布，难度就不再依附于特定模型，而成为环境家族本身的属性。这一 off-policy 难度公式化揭示了三个可操作的演化方向：增加执行 length、替换 scenario、替换 skill。沿着这些方向逐步修改环境，即可在不依赖 rollout 的情况下构建难度递增的环境谱系，从而持续为 RL 训练提供学习信号。\n\n### § 4 核心 Intuition\n\n环境难度不应由特定模型的成败来定义，而应由环境本身的属性——scenario novelty、skill rarity 和 execution length——来度量。通过用基于世界知识的参考分布替换模型相关的概率，可以将难度从 on-policy 的模型弱点转化为 off-policy 的环境固有特征。沿着这三个维度增量演化环境，构建出难度递增的代际谱系，再按顺序调度进入 RL 训练，即可在不依赖 rollout model 的情况下持续提供有效的 learning signals，突破 co-evolution 随模型饱和而失效的瓶颈。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+-------------------+       (Select Direction: scenario/skill/length)\n| Seed Environment  |-----\u003E [Proposer] -\u003E Extract Seq -\u003E Update Seq\n+-------------------+            |                   |\n                                 v                   v\n                          [Plan Reviewer] \u003C--- (Reject/Rubric Fail)\n                                 | (Pass)\n                                 v\n                          [Modifier] -\u003E Apply Delta_E -\u003E Candidate Env\n                                 |                   |\n                                 v                   v\n                          [Verifiers] \u003C--- (Fail/Repair Budget Out)\n                          /     |     \\\n                         V      V      V\n                    Oracle  Invalid  General\n                                 | (All Pass)\n                                 v\n                         +-----------------+\n                         | Evolved Env (E) | -\u003E [EL Scheduler] -\u003E RL Training\n                         +-----------------+\n```\n\n结合一个真实的终端任务例子（解压并分析日志文件），完整 pipeline 的步骤如下：\n\n- **输入**：系统接收一个 Seed Environment，例如一个要求 agent 使用 `tar` 解压日志并用 `grep` 提取错误信息的任务环境。\n- **处理 1：序列提取与更新**：[Proposer] 从当前环境中提取执行序列（如 scenario: 解压 -\u003E skill: `tar`）。系统根据随机选择的 evolution direction（如 length）更新该序列，例如插入一个新的 scenario-skill pair（如 scenario: 转码 -\u003E skill: `iconv`），从而生成 Evolution Plan。\n- **处理 2：计划审查回路**：[Plan Reviewer] 基于 rubric 审查该计划。如果计划不合理（例如引入的依赖过于突兀），则退回 [Proposer] 重新修改；若通过，则进入下一阶段。若当前 direction 耗尽修复预算，则触发 cross-mode fallback 切换至其他 direction。\n- **处理 3：环境修改与验证回路**：[Modifier] 根据计划生成残差修改并应用到环境代码中，生成 Candidate Env。该候选环境需通过 [Verifiers] 的三项并行检查：Oracle 验证参考解可执行，Invalid 验证空操作会失败，General 检查环境整体质量。若验证失败，则退回 [Modifier] 修复。\n- **输出**：通过所有验证的 Candidate Env 成为正式的 Evolved Env (E)。这些环境按代际被推入 [EL Scheduler]，调度器根据 agent 的实时 pass rate 阈值，按顺序将不同难度的环境喂给 RL Training，确保持续提供有效的学习信号。\n\n### § 6 核心数学推导\n\n论文在第 3 节从 multi-turn learning objective 推导出了 off-policy 的 environment difficulty formulation，这是指导环境演化的核心理论基础。\n\n**理论背景与 Intuition**：\n在 RL 中，通常用 on-policy rollout 的 pass rate 来估计环境难度。但这反映的是特定模型 $\\theta$ 的弱点，而非环境本身的属性。为了获得与模型无关的难度度量，作者将 agent 的底层执行轨迹抽象为高层的 scenario ($\\sigma$) 和 skill ($\\kappa$) 交错序列。\n\n1. **Model-specific difficulty**：在模型 $\\theta$ 下，轨迹的负对数似然分解为三部分：执行步数 $L$、scenario novelty $-\\log p_\\theta(\\sigma|g)$ 和 skill rarity $-\\log p_\\theta(\\kappa|\\sigma,g)$。Intuition 是：步数越多、场景越罕见、技能越罕见，对特定模型来说越难。\n2. **Model-agnostic environment difficulty**：为了消除模型依赖，作者将概率分布替换为基于广泛世界知识的参考分布 $p_T$。Intuition 是：用世界知识来衡量场景和技能在环境家族中的普遍程度，而不是特定模型会不会。这样难度就变成了环境本身的固有属性。\n3. **Agent weakness**：定义为环境难度减去环境家族的基础难度。Intuition 是：weakness 不是环境本身有多难，而是这个环境相对于同类环境，对特定模型来说额外难了多少。\n4. **Evolution directions 的导出**：从上述公式直接得出影响难度的三个维度：length ($L$)、scenario ($-\\log p_T(\\sigma|g)$) 和 skill ($-\\log p_T(\\kappa|\\sigma,g)$)。这为后续的 environment evolution 提供了明确的操作空间。\n\n### § 7 实验设计与结论\n\n论文通过四个核心实验验证了 environment evolution 的有效性：\n\n- **提出了什么问题**：Evolution effort (low, high, max) 如何影响环境难度的演化？\n  **设计了什么实验**：使用相同的 seed environments，在三种 effort 下独立构建 15 代 lineage，用不同前沿模型测量 pass rate 和 avg turns。\n  **问题的答案**：low effort 难度波动且无法降至零；high 和 max effort 能单调降低 pass rate 至零并增加 turns。综合考虑可控性，high 为默认设置。\n\n- **提出了什么问题**：三个 evolution directions (scenario, skill, length) 是否具有稳定且特定的难度调节效果？\n  **设计了什么实验**：固定 high effort，分别应用三个方向于相同 seeds，测量 1-step 和 15-step 的 pass rate 和 turns 变化。\n  **问题的答案**：三个方向均能稳定降低 pass rate 并增加 turns。length 带来最大的 pass rate 下降，scenario 和 skill 带来更大的 turns 增加。1-step 和 15-step 效果一致，说明效果持久。\n\n- **提出了什么问题**：EL Scheduler 是否比随机调度更有效？\n  **设计了什么实验**：在 RL 训练前 50 步比较 EL Scheduler 和 random scheduling 的 partial-solved rate 和 reward。\n  **问题的答案**：EL Scheduler 避免了过早暴露无法解决的环境，使得更多 rollout groups 保持部分解决状态，为 GRPO 提供了更有信息量的学习信号。\n\n- **提出了什么问题**：Environment evolution 是否比其他 paradigm 更能提升 agent 性能？\n  **设计了什么实验**：在 Qwen3.6-27B 和 Qwen3.6-35B-A3B 上进行 200 步 RL 训练，固定环境合成模型和总环境数，比较 environment evolution, co-evolution, ensemble 在 Terminal-Bench 2.1 上的表现。\n  **问题的答案**：Environment evolution 达到了最高的峰值准确率 (71.5% 和 64.9%)，显著优于 co-evolution 和 ensemble，证明了 off-policy 演化能提供更持久的学习信号。", "additional_insights": "### § 8 Take-aways\n本文提出了 *environment evolution*，一种 off-policy 的环境生成范式，通过逐代增量修改现有环境来为 terminal agents 提供持续的 RL 学习信号。作者从 multi-turn learning objective 推导出 model-agnostic 的环境难度公式，指出 *scenario* novelty、*skill* rarity 和 execution *length* 是影响难度的三个关键维度。基于此，本文实现了一个 loop-engineered multi-agent harness，通过 Plan Refinement 和 Environment Refinement 两个反馈循环，沿上述三个方向生成难度递增且通过严格验证的 environment lineage。为避免模型过早接触无法解决的环境，本文提出了 Evolution-Lineage (EL) Scheduler，按代际顺序和 pass rate 阈值调度训练数据，确保 rollout 组内保留有效的 advantage。实验表明，在 Qwen3.6-27B 和 Qwen3.6-35B-A3B 上，该方法比 agent-environment co-evolution 和 environment ensemble 提供了更持久的学习信号，在 Terminal-Bench 2.1 上分别提升了 14.4 和 18.0 个百分点。\n\n### § 9 最脆弱的假设\n本文最核心且失败代价最大的假设是：通过修改 *scenario*、*skill* 和 *length* 生成的 evolved environments，其难度增加是 model-agnostic 的，即不需要依赖特定 target agent 的 on-policy rollouts 就能持续为目标模型提供有效的 RL 学习信号。在实际中，RL 训练需要的是处于模型 capability frontier 附近的相对难度，而非单纯的绝对难度。如果 evolved environments 的难度增长轨迹与目标模型（如 Qwen3.6）的学习进度或弱点分布严重不匹配，这些环境可能对目标模型而言要么太难（导致全失败 rollout，无 within-group advantage），要么偏离了模型真正需要学习的技能分布。虽然论文使用 EL Scheduler 通过 pass rate 阈值来控制环境暴露的节奏，但这只能被动过滤“太难”的环境，无法保证被暴露的环境恰好处于 frontier。论文提供的证据是图5中 partial-solved rate 在前50步保持较高水平，以及图7中最终 benchmark 性能的提升，这间接证明了信号的有效性。然而，论文缺少对 evolved environments 难度分布与目标模型 capability frontier 匹配度的定量分析，也未展示在模型能力发生显著偏移时，off-policy 生成的 lineage 是否仍能自适应地提供有效信号。\n\n### § 10 最小复现实验\n如果有1周时间，可以验证本文最基础的 claim：*environment evolution* 能够 off-policy 地生成难度递增的环境，且这种难度增加对不同模型是一致的。从开源的 terminal environment 数据集中选取 10 个 seed environments，使用 Claude Opus 5 或类似强模型作为 evolver，按照论文所述的 *scenario*、*skill* 和 *length* 三个方向，手动或通过简单 prompt 驱动生成 5 代 lineage，确保每代环境通过 Oracle verifier 和 Invalid-test verifier。然后，使用两个能力差异较大的模型（如 Qwen3.6-27B 和 GPT-5.6 Sol）对每一代环境进行 8 次 rollout。测量每次 rollout 的 pass rate 和 avg turns。如果随着代际增加，两个模型的 pass rate 都呈现单调下降趋势，且 avg turns 逐渐增加，则支持该 claim；如果 pass rate 在某一代突然降至零（难度失控），或者两个模型的表现趋势出现严重分歧（难度增加实际上是 model-specific 的），则反驳了该 claim。此实验无需实现完整的异步 RL 训练系统，即可验证环境演化的核心机制。", "research_value": "### § 11 最强反例设计\n\n要对该论文进行最有力的攻击，核心在于挑战其最脆弱的假设：off-policy 生成的绝对难度能够持续匹配目标模型的 capability frontier。我会设计一个跨架构异构模型的对比实验，以证明 environment evolution 的难度增长轨迹实际上是 model-specific 的，且在模型能力结构不匹配时会迅速失效。具体而言，选取两个参数量相近但能力剖面截然不同的前沿模型，例如一个擅长长程规划但工具调用精度较低的 dense transformer，和一个工具调用极强但长程上下文记忆较弱的 Mixture-of-Experts (MoE) 模型。使用论文所述的 high effort 和三个固定方向生成 15 代 environment lineage，并分别对这两个模型进行 RL 训练。如果论文的 model-agnostic claim 成立，EL Scheduler 应该能为这两个模型都提供持续的 partial-solved rate 和有效的 within-group advantage。然而，我的反例假设是：由于演化方向（特别是 length 和 skill rarity）对模型能力维度的挤压是各向异性的，增加 length 会迅速击穿 dense transformer 的规划瓶颈，导致其 pass rate 在前几代骤降至零，而增加 skill rarity 则会让 MoE 模型因生僻工具调用失败而无法产生有效 gradient。这种绝对难度的线性叠加并未沿着任何单一模型的 capability frontier 前进，而是随机切割了不同模型的能力空间。在此场景下，EL Scheduler 的 pass rate 阈值过滤将退化为一种被动的、极度浪费环境的截断机制，大量生成的 evolved environments 因超出特定模型的 ZPD (Zone of Proximal Development) 而被丢弃。这不仅会大幅降低环境的利用率，还会导致 RL 训练在极少的可用环境子集上过拟合。由此可以提出对论文结果的替代解释：Qwen3.6 系列模型之所以能获得显著提升，并非因为环境难度真正做到了 model-agnostic，而是因为 Qwen3.6 的能力分布恰好与演化生成的难度分布（尤其是 length 和 skill 的叠加速率）较为匹配，这是一种隐式的 on-policy 偏置，而非通用的 off-policy 优势。\n\n### § 12 Follow-up Research Idea\n\n上述反例暴露了一个深层的未满足需求：RL 训练真正需要的不是脱离模型的绝对难度爬升，而是能够精准追踪并施压于模型当前 capability boundary 的相对难度，且这一过程不应受限于高成本的 on-policy rollouts。为了解决这一矛盾，我提出一种新的研究范式：Capability-Aware Environment Morphogenesis (CAEM)，其核心目标是将 environment evolution 从“基于世界知识的绝对难度最大化”转变为“基于模型能力流形的边界梯度最大化”。该方法借鉴了 Active Learning 中的 acquisition function 设计以及 Bayesian Optimization 中的 surrogate modeling 思想。具体而言，不再使用固定的参考分布 $p_T$ 来衡量 scenario 和 skill 的普遍程度，而是首先通过极低成本的 off-policy probing（例如对每个 skill 和 scenario 进行单次或少次 zero-shot rollout）构建目标模型的 capability manifold。在这个流形上，我们可以估计模型在不同 (scenario, skill, length) 组合下的 success probability 等高线。随后，environment evolution 的目标函数被重新定义为寻找那些位于模型 capability frontier 陡峭下降区的环境修改方案，即最大化模型 loss landscape 的曲率，而非单纯最大化环境的负对数似然。第一个实验将设计如下：选取一个目标模型，利用 probing 数据拟合一个轻量级的 Gaussian Process 来预测不同环境配置下的 pass rate。然后，对比 CAEM 与原论文的 uniform evolution 在 200 步 RL 训练中的表现，重点测量环境的 discard rate（因 pass rate 为 0 或 1 而被 EL Scheduler 过滤的比例）以及 benchmark 上的 sample efficiency。与现有的 agent-environment co-evolution 不同，CAEM 不需要在训练循环中持续进行 on-policy rollouts 来更新 weakness bank，而是通过一次性的 capability profiling 指导整个 off-policy 演化过程；与原论文的 environment evolution 不同，CAEM 的演化方向不再是随机选择或固定递增，而是由模型的 capability manifold 形状自适应导出，从而在保持 off-policy 高效性的同时，确保生成的每一个 evolved environment 都精确锚定在模型当前最需要突破的能力边界上。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zhiyuan Fan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Tinghao Yu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuanjun Cai\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiang Zhou\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiangtao Guan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jincheng Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yun Yang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Dingxin Hu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhuo Han\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xing Wu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Feng Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Lilin Wang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Hunyuan Team, Tencent\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "扩展交互式和可验证环境对于训练 terminal agents 至关重要。随着 frontier models 变得更加强大，从零开始合成的环境变得缺乏挑战性，因此提供的 learning signals 有限。最近的 co-evolution methods 根据 rollouts 期间暴露的弱点，迭代地在模型的 learnable frontier 附近合成环境。然而，它们对 on-policy rollouts 的依赖限制了 generalization，并且随着模型变强，也限制了 learning signals 的持续提供。在本文中，我们提出 environment evolution，该方法以 off-policy 方式逐步增加环境难度，并在训练期间逐代调度演化后的环境，以提供持续的 learning signals。我们从 multi-turn learning objective 中推导出影响环境难度的三个演化方向，然后通过 loop-engineered multi-agent harness 沿这些方向实现演化。使用 Hy4 preview、Claude Opus 5 和 GPT-5.6 Sol 进行的定量 rollout 实验表明，environment evolution 能够持续产生更困难的环境。我们通过简单的 long-horizon RL training 在 Qwen3.6-27B 和 Qwen3.6-35B-A3B 上验证了其有效性，分别在 Terminal-Bench 2.1 上将其性能提高了 14.4 和 18.0 个百分点。"}]}], "2026-09-03": [{"name": "Long-Horizon Planning \u0026 Memory", "count": 6, "papers": [{"title": "SkillGLoW: Procedural-Family Skill Consolidation for Self-Improving Agents on Long-Horizon Task Streams", "arxiv_id": "2609.02217", "authors": "Ao Yan, Xin Zhang, Jiawei Du, Joey Tianyi Zhou", "summary": "LLM agents increasingly self-improve by writing and reusing textual skills, kept either as one global document or as a flat pool of per-task entries, though most of the evidence comes from domains with structurally similar tasks. On long-horizon workloads where each task demands a different solution, the two forms fail in opposite ways: the document collapses into generic discipline, while the pool inflates and its entries stay bound to the instance that wrote them. We argue the missing unit of reuse is the solving procedure shared by a cluster of related tasks, and build SkillGLoW (Global-Local Weave) around it: the local skills a task writes from its own execution are aggregated into procedural families and compressed into de-instantiated global priors, while the instance detail they hold is regenerated per task rather than stored; a commit gate admits a prior only when real execution shows it does not degrade the deployed library. Across four benchmarks (mathematical reasoning, terminal automation, software repair, and embodied control) and three models, the priors gain 17.2 points (hard) over the no-skill baseline on average, with positive gains in all 12 continual-improvement runs, and 18.0 with local regeneration, while the library holds one prior per procedural family, 3.6x more compact than the per-task pool. Under the same protocol GLoW leads a published single-document optimizer on 15 of 21 cells. Unmodified, the library lifts success on unseen ALFWorld tasks from 73.9% to 83.9%, evidence that what transfers is procedure rather than task memory.", "category": "cs.AI", "cluster": "Long-Horizon Planning \u0026 Memory", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving, LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的研究问题是：当 LLM agents 在异构长视野任务流中持续生成、修订和复用 textual skills 时，应当以何种 granularity 组织和维护这些 skills？随着 base models 和 agent harnesses 日趋成熟，agents 正从短视野封闭任务转向更长视野、更复杂的环境，这些任务迅速超出固定 prompts 和人工编写 skills 的覆盖范围，迫使近期系统从自身执行轨迹中蒸馏可复用 skills 并写入文档以供 prompt injection 复用。然而，一旦 skills 被持续生成与修订，一个更根本的组织问题便浮现出来。SkillsBench 提供了直接证据：人工策划的 skills 可将 pass rate 提升 16.2 points，而模型仅从任务描述出发为自己编写的 skills 反而比 no-skill baseline 低 1.3 points，表明 skill 的组织形式而非 mere generation 才是性能瓶颈。论文指出，现有两种组织形式在异构长视野任务上以相反方式失败——单一全局文档坍缩为模型已内化的 generic discipline，而 per-task 扁平 pool 随流膨胀且条目绑定于编写它的具体 instance。作者论证缺失的 reuse unit 是一族相关任务共享的 solving procedure，并围绕此构建 SkillGLoW 框架：将任务自身执行中编写的 local skills 聚合为 procedural families 并压缩为 de-instantiated 的 global priors，同时 instance detail 在每个任务上重新生成而非存储；commit gate 仅当真实执行表明候选 prior 不会降低已部署 library 的性能时才予以准入。解决此问题的价值在于：agent 能在异构任务上持续积累可复用的 procedural knowledge 而非退化为泛化空话或过拟合实例，在四个 benchmark 和三个模型上实现 17.2 points 的平均提升，library 比 per-task pool 紧凑 3.6 倍，且未经修改即可将未见 ALFWorld 任务的成功率从 73.9% 提升至 83.9%，证明迁移的是 procedure 而非 task memory。\n\n### § 2 前人工作与不足\n\n该问题此前未被直接解决。最相关的 prior methods 可分为三条线索。第一条是 skill construction and optimization：SkillOpt 将单个 skill document 作为 frozen agent 的 external state 进行训练，仅当 held-out split 上性能改善时才接纳编辑，但其 scope 限定于单一 domain；AutoSkill、Trace2Skill 和 ExpeL 从多条轨迹中池化蒸馏 skills，因为单轨迹摘要会过拟合。这些方法关注如何产生更好的 skill，却未追问以什么 granularity 维护已生成的 skills——优化对象只需在单一分布上保持有效，而无需跨一族任务成立。第二条是 skill organization, transfer, and abstraction：大多数系统将 skills 存储在单层，要么是一个持续重写的文档，要么是一个扁平的可检索 library，并依赖 retrieval 和 governance 机制。ReMe 通过 judge 去重并修剪低效用条目；XSkill 在架构上最接近本文，将 action-level experience stream 与 task-level skill stream 配对，但其 local component 从历史记录中检索并适配，而非从当前任务自身反馈重新生成。这些方法的证据绝大部分来自结构相似的任务——在这种分布下，单一文档假设存在主导 procedure、per-task pool 假设旧条目可整体复用，两者大致成立。一旦放松该假设转向异构长视野任务，两种组织形式同时失效：不存在主导 procedure 使合并文档退化为 generic discipline，而 instance-bound 条目无法整体适配新任务且 pool 随流线性增长、积累噪声与陈旧性。即使为扁平 pool 添加 retrieval（如 AWM 的工作流归纳方式）也无法弥合差距，因为 cross-task recall over instance-bound entries transfers little，甚至引发 negative transfer。第三条是 lifecycle and multi-skill maintenance：SkillOS 将自我进化视为 library governance 并冻结 executor 学习何时变更 library；SkillGraph 为 retrieval 添加 prerequisite structure。这些方法将困难转移到何时及如何编辑条目，且均需 learned 或 hand-set 的 utility scorer。根本原因在于，前人系统未考虑介于单一文档与单一条目之间的中间粒度——procedural family——并非因为该粒度不可想象，而是因为其证据基础集中在结构相似任务上，极端粒度的隐含假设在这种受控分布下恰好成立，掩盖了异构场景下中间粒度的必要性。GLoW 正是填补这一空白：以 procedural family 为 reuse unit，global prior 在 solving episode 期间保持 frozen 且仅 offline 修订，local skill 从当前任务自身执行反馈重新生成且从不写回长期 library，retention 从 consolidation 中自然产生而无需额外 governance policy，acceptance 仅取决于 measured downstream execution。", "core_insight": "### § 3 重建作者的思考路径\n\n在长视野的复杂任务流中，LLM agents 需要通过编写和重用文本技能来实现自我提升。然而，现有的技能组织方式在面对异构解决方案的任务时，会暴露出截然相反的失败模式：如果将所有技能压缩进一个 single global document，由于任务间不存在主导的统一流程，文档会坍缩为模型早已掌握的通用准则，失去指导意义；反之，如果采用 flat per-task skill library，技能条目会与生成它们的具体实例高度绑定，不仅库体积随任务流无限膨胀，跨任务检索时也会因实例细节的噪声而引发负迁移。这些现象表明，无论是“单文档”还是“单条目”，都隐含了关于任务分布的错误假设。研究者由此意识到，在这两种极端粒度之间，缺失了一个正确的重用单元。通过观察任务流的内在结构可以发现，尽管异构任务的解法各不相同，但相似任务会聚集成家族，并共享一套解决过程，而每个实例特有的局部约束只在执行时显现。这意味着可迁移的是过程而非实例记忆。基于这一线索，合理的技能组织架构应当将共享过程与实例细节剥离：在离线时将局部经验聚类并压缩为去实例化的全局先验，在执行时再根据当前任务的反馈重新生成局部细节。为了防止语言压缩过程中的信息损失导致规则泛化或约束丢失，任何全局先验的更新都必须通过真实下游执行效果的检验，而非依赖文本层面的主观判断。\n\n### § 4 核心 Intuition\n\n现有方法要么把所有技能压成一个失去细节的通用文档，要么把每个任务的特定解法存成扁平的技能池导致无法泛化。这篇论文的核心 intuition 是：相似任务共享一个解决过程，而每个任务带有自己特定的实例细节。因此，将技能拆分为两层：全局层只保留一族任务共享的解决骨架，局部层在每次执行时根据当前反馈重新生成实例细节。只有当压缩后的全局先验在真实执行中被证明不会降低性能时，它才会被提交进技能库。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Task Execution]\n      |\n      v\n[Local Skills (Per-task)]\n      |\n      v\n[Group by Procedural Family]\n      |\n      v\n[Consolidate: Keep shared step, drop instance detail]\n      |\n      v\n[Global Prior Candidate]\n      |\n      v\n[Commit Gate: Real Execution Check] --(Degrade)--\u003E [Reject]\n      | (No degrade)\n      v\n[Global Skills (Family Priors, Frozen)]\n      |\n      +\u003C--------(Regenerate from feedback)--------+\n      |                                          |\n      v                                          |\n[Solving Time: Combine Global + Local]----\u003E[Local Skills (Regenerated)]\n```\n\n论文提出了 SkillGLoW (Global-Local Weave, GLoW) 框架，其完整 Pipeline 按图中节点展开如下：\n\n1. **Task Execution 与 Local Skills 生成**：Agent 在长视野任务流中执行具体任务，并从自身的执行轨迹中编写带有实例细节的 Local Skills。\n2. **Group by Procedural Family**：将异构但相关的 per-task skills 进行聚类，组织成 procedural families。相似任务形成家族并共享一套解决过程。\n3. **Consolidate**：对每个 procedural family 内的 skills 进行压缩。保留家族共享的 solving procedure，丢弃特定实例的 instance detail，生成去实例化的 global prior。\n4. **Commit Gate**：通过真实下游执行效果检验候选 global prior。只有当候选 prior 被证明不会降低已部署 library 的性能时，才允许提交进入全局技能库。这防止了语言压缩过程中的信息损失导致规则泛化或约束丢失。\n5. **Global Skills (Family Priors, Frozen)**：存储通过验证的 global priors。在 solving episode 期间，global prior 保持冻结状态，仅在离线时进行修订。\n6. **Solving Time 组合**：在解决新任务时，将冻结的 global prior 与重新生成的 local skills 结合。Local layer 根据当前任务的执行反馈重新生成，提供 prior 无法携带的 instance detail，并在下一轮 consolidation 时被聚合。两者在 solving time 结合，在 consolidation time 分离。\n\n### § 7 实验设计与结论\n\n**提出的问题**：\n1. 现有的 skill 组织形式（single global document, flat per-task pool 及其检索变体）在异构长视野任务流上表现如何？\n2. GLoW 提出的 procedural-family consolidation 能否带来持续的性能提升，并保持技能库的紧凑性？\n3. GLoW 迁移到未见任务上的性能提升，究竟归功于可复用的 procedure 还是 task memory？\n\n**用什么实验验证**：\n- 在四个 benchmark（mathematical reasoning, terminal automation, software repair, embodied control）和三个模型上评估 GLoW，产生 12 个 continual-improvement runs。\n- 使用 multi-setting protocol 分离 frozen prior 和 within-task regeneration 的贡献。\n- 在相同 streams 上对比 single document, per-task pool, pool with retrieval 三种组织形式。\n- 在未见过的 ALFWorld 任务上测试未修改的 library 的迁移效果。\n\n**结论是什么**：\n- 现有三种组织形式的增益均不如 family consolidation，证实了缺失的 reuse unit 是 procedural family。\n- GLoW 的 committed priors 相比 no-skill baseline 平均提升 17.2 points，在所有 12 个 continual-improvement runs 中均获得正增益；结合 local regeneration 后提升达 18.0 points。\n- 部署的 library 每个 procedural family 仅保留一个 prior，比 per-task pool 紧凑 3.6 倍。\n- 在相同 protocol 下，GLoW 在 21 个 cells 中的 15 个上领先于已发表的 single-document optimizer。\n- 在未修改的情况下，library 将未见 ALFWorld 任务的成功率从 73.9% 提升至 83.9%，证明 GLoW 迁移的是 reusable procedure 而非 task memory。", "additional_insights": "### § 8 Take-aways\n在长视野、异构任务流中，LLM agent 的技能组织形式不应是单一全局文档（过于宽泛，退化为通用准则）或扁平的 per-task 技能池（过于细碎，过拟合到具体实例且无限增长）。作者提出 SkillGLoW (Global–Local Weave) 框架，将任务按“解决过程”聚类为 procedural families，将每个家族的共享过程压缩为去实例化的 global prior，而在执行时为每个任务重新生成 local skill 补充实例细节。通过 verifier-grounded commit gate，只有在不降低实际执行性能时才将候选 prior 写入库中。实验表明，该方法在四个 benchmark 上平均比 no-skill baseline 提升 17.2 个点，且库的体积比 per-task pool 紧凑 3.6 倍，并能将性能提升迁移到未见过的任务上（如 ALFWorld 从 73.9% 提升至 83.9%），证明了迁移的是过程而非任务记忆。\n\n### § 9 最脆弱的假设\n最脆弱的假设是：任务流中存在可以被有效聚类并提取出共享 procedural skeleton 的“procedural families”。如果任务之间的解决过程差异极大，或者聚类质量低下，压缩出的 global prior 将退化为无用的通用准则（即论文中批评的 single global document 的失败模式），甚至误导 agent。在实际中，长视野任务往往具有高度多样性和复杂的依赖关系，基于 embedding 的聚类可能无法准确捕捉真正的过程相似性。论文虽然提供了 ALFWorld 上的聚类纯度数据（purity 0.950）和 Terminal-Bench-Pro 上的案例分析，但这些证据依赖于特定 benchmark 的结构，且在 LMB 等任务共享度较低的 benchmark 上，聚类效果和 prior 的增益显著下降（如 GPT-5.4-mini 仅提升 3.8 个点），暗示该假设在高度异构的极端情况下可能不成立。\n\n### § 10 最小复现实验\n如果只有 1 周时间，可以复现论文中关于 procedural family clustering 和 prior compression 的核心机制，而不必搭建完整的 agent 执行循环。使用 ALFWorld 的 42 个训练任务，首先收集每个任务的 no-skill 执行轨迹和 local skill（可以通过简单的 prompt 让 LLM 生成）。然后实现 multi-view consensus clustering：使用 sentence embedding 对任务的 signature、instruction、local skill 和 trajectory 进行编码，通过多次 hierarchical clustering 构建 consensus matrix 并划分家族。接着，使用 LLM 将每个家族的 local skills 压缩为 global prior。最后，测量这些 prior 在 ALFWorld valid_unseen split 上的 hard score，并与 no-skill baseline 对比。如果注入 prior 后成功率显著高于 baseline（如论文报告的 73.9% -\u003E 83.9%），则支持了“去实例化的 procedural prior 能够迁移”这一核心 claim；如果成功率没有提升甚至下降，或者 prior 内容退化为通用建议，则反驳了该 claim。", "research_value": "### § 11 最强反例设计\n要对该论文的核心 claim 进行最有力的攻击，我会设计一个“语义-程序解耦”的对抗性任务流实验，旨在证明 SkillGLoW 的 multi-view consensus clustering 实际上捕捉的是 semantic similarity 而非 procedural similarity，且其 commit gate 无法阻止这种虚假聚类带来的 negative transfer。具体而言，我会构建一个包含 40 个长视野任务的数据集，其中 20 个任务在表面语义和工具调用上高度相似（例如均涉及“在终端中操作文件系统并运行 Python 脚本”），但底层解决过程分属两个完全互斥的 procedural families（例如 10 个是“数据清洗后入库”，10 个是“环境配置后执行训练”）；另外 20 个任务在语义上风马不及（例如“操作文件系统”与“调用外部 REST API”），但底层解决过程完全一致（例如均遵循“获取凭证-\u003E建立连接-\u003E轮询状态-\u003E处理异常断开”的 procedural skeleton）。如果 SkillGLoW 的 clustering 机制真正提取的是“解决过程”，它应当将语义不同但过程相同的任务聚为一类，并将语义相同但过程不同的任务分离。然而，基于 sentence embedding 的 multi-view clustering 极大概率会将前 20 个语义相似的任务错误聚为一簇。此时，将“数据清洗”与“环境配置”的 local skills 压缩进同一个 global prior，必然产生互相干扰的矛盾指令。更致命的攻击在于 commit gate 的验证逻辑：由于 commit gate 仅在特定 benchmark 的 held-out split 上验证“不降低性能”，如果该 benchmark 的分布同样偏向语义聚类，这个错误的 prior 可能因为恰好包含了通用的文件系统操作指令而通过 gate 准入。但在面对需要精确执行“环境配置”流程的 unseen 任务时，这个夹杂了“数据清洗”噪声的 prior 将引发严重的 negative transfer。这一反例直接挑战了论文最脆弱的假设，证明 SkillGLoW 在语义表面相似但 procedural skeleton 异构的复杂真实场景下，其 consolidation 机制会系统性地失效，且所谓的“迁移 procedure”不过是迁移了 semantic domain memory。\n\n### § 12 Follow-up Research Idea\n基于 SkillGLoW 将 skills 强制离散化为固定 procedural families 并进行静态 compression 的局限，我提出一个全新的研究框架：**Procedural Skill Diffusion (PSD)**，将 skill consolidation 从离散的聚类与压缩问题重构为连续空间中的条件去噪生成问题。该想法的驱动局限在于：真实世界的长视野任务往往不是彼此的离散变体，而是多个 procedural skeletons 的连续插值与动态组合，硬性划分 family 并维护 frozen global prior 必然在任务处于 family 边界时产生 granularity mismatch。PSD 借鉴了 Diffusion Models 在连续潜在空间中的去噪生成机制以及 Prompt Tuning 的思想，不再维护一个显式的 textual skill library，而是训练一个轻量级的 skill autoencoder 将历史执行轨迹的 local skills 映射为一个 continuous procedural latent manifold。在执行新任务时，agent 根据当前 state 在该 manifold 上进行 conditional sampling，生成一个 instance-specific 的 continuous soft prompt，随后通过一个 frozen decoder 将其转译为 textual skill 供 prompt injection。第一个实验将构建一个 compositional long-horizon benchmark，其中每个任务均由两个已知 procedural skeleton 按不同比例混合而成（例如 60% 的 API orchestration 加 40% 的 file system manipulation）。实验将对比 SkillGLoW（必须将任务硬性分配给某一个 family 的 prior）与 PSD（在 latent manifold 上根据当前 state 动态插值采样）在 cross-family unseen 任务上的表现。如果 PSD 能够平滑地过渡并生成兼顾两种 procedural skeleton 的 hybrid skill，而 SkillGLoW 在 family 边界任务上出现性能断崖式下跌，则证明了 continuous procedural interpolation 是远优于 discrete family consolidation 的 skill 组织范式。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Ao Yan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xin Zhang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jiawei Du\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Joey Tianyi Zhou\", \"affiliations\": [2], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"NUS\"},\n    {\"id\": 2, \"name\": \"IAIC\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "LLM agents 越来越多地通过编写和重用文本技能进行自我改进，这些技能要么作为单一全局文档保存，要么作为扁平的 per-task 条目池保存，尽管大多数证据来自具有结构相似任务的领域。在每个任务需要不同解决方案的 long-horizon 工作负载上，这两种形式以相反的方式失败：文档退化为通用准则，而池发生膨胀且其条目仍然绑定于编写它们的实例。我们认为缺失的重用单元是由一簇相关任务共享的求解过程，并围绕它构建了 SkillGLoW (Global-Local Weave)：task 从自身执行中编写的 local skills 被聚合为 procedural families 并压缩为 de-instantiated global priors，而它们持有的实例细节是按 task 重新生成而非存储的；commit gate 仅在真实执行表明某个 prior 不会降低已部署库的性能时才接纳它。在四个 benchmarks（数学推理、终端自动化、软件修复和具身控制）和三个 models 上，priors 平均比 no-skill baseline 高 17.2 points (hard)，在所有 12 次 continual-improvement runs 中均获得正向增益，使用 local regeneration 时为 18.0，同时该库每个 procedural family 保留一个 prior，比 per-task pool 紧凑 3.6 倍。在相同的 protocol 下，GLoW 在 21 个 cells 中的 15 个上领先于已发表的 single-document optimizer。未经修改的情况下，该库将未见过的 ALFWorld tasks 上的成功率从 73.9% 提升至 83.9%，这证明了迁移的是过程而非任务记忆。"}, {"title": "CivBench: A Long-Horizon Benchmark for Tool-Mediated Agents in Civilization VI", "arxiv_id": "2609.02459", "authors": "Austin Tudor David Andrews, Liam Wilkinson, Jamie Heagerty, Harry Coppock, Jakob Nicolaus Foerster, Rui Ponte Costa", "summary": "We present CivBench, an open-source benchmark for evaluating language model agents in long-horizon, tool-mediated environments through the Model Context Protocol (MCP). A single episode spans 300+ turns and produces thousands of tool calls over a large action space, requiring sustained planning, state monitoring, and execution under partial observability. The environment exposes 76 MCP tools and a narration layer that converts visual game state into structured text. We use CivBench to characterise agent behaviour across four model families in 23 admissible runs. The sample is a pilot, not a model ranking: aggregate outcomes do not reliably discriminate models at this scale. Instead, we introduce two interface-level metrics that the environment makes measurable: Proactive Monitoring Rate (PMR), capturing whether agents actively query latent strategic state, and RAG@10, capturing whether commitments stated in structured planning reflections are executed within ten subsequent turns. Across runs we observe two consistent patterns under a shared playbook protocol. Agents under-monitor strategically relevant state that is available but requires explicit querying: despite playbook guidance to query victory progress every 20 turns, agents do so only every 30 to 75 turns, and in 7 of 20 detectable defeats they failed to query within the 20 turn warning window before game end. Agents also frequently fail to execute near-term commitments stated in their own planning reflections (RAG@10 between 48.2% and 65.8% across models). Both patterns arise despite tool access and explicit guidance, and we interpret them as deviations under instruction rather than absences of capability. We release the environment, scenarios, logs, metrics, and analysis pipeline at https://github.com/lmwilki/civ6-mcp", "category": "cs.AI", "cluster": "Long-Horizon Planning \u0026 Memory", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=24 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文提出了 CivBench，一个用于评估长视野、工具介导环境中的语言模型智能体的基准测试。论文的核心研究对象明确为 LLM Agents / Long-Horizon Agents / Tool-Use Agents，评估了智能体在长达300多轮交互中的持续规划、状态监控、工具调用和自我反思执行能力。\n\n根据筛选标准第一步中的“保留”规则：“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents... 即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。” 以及重要校准中的说明：“不要只因为论文是 benchmark、evaluation、behavior analysis... 就排除。只要标题和摘要明确围绕 LLM Agents / Agentic AI / Self-Evolving LLMs 展开，就应返回 True。”\n\n论文分析了智能体在主动监控和执行反思承诺方面的失败模式，这直接对应了单智能体方向中的规划、工具使用和自我反思能力。虽然游戏环境包含视觉元素，但论文通过叙述层将其转化为结构化文本，核心贡献在于智能体的长视野决策和行为分析，而非多模态视觉理解本身。因此，该论文完全符合您的核心研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：在长周期、工具介导的环境中，语言模型 agent 能否持续维持对全局状态的感知，并将自身陈述的计划转化为后续行动？具体而言，当所有非局部状态都必须通过显式 tool call 主动检索时，agent 是否会系统性地忽略关键战略信息，以及是否会在 planning reflection 中做出承诺却不执行？这一问题的重要性在于，前沿模型正越来越多地被部署为 agent，在扩展的决策序列中调用工具、检查外部状态并行动，而现有的 evaluation 通常孤立地测试 reasoning、tool use 或短周期 planning 等组件，无法直接观察这些能力在长周期交互中如何相互影响。Civilization VI 作为一个单局超过 300 turns、包含 6 种胜利条件、涉及经济、科技、文化、军事、外交等多维度优先级管理的 4X 策略游戏，提供了一个理想的测试场景：它要求 agent 在 partial observability 下持续追踪计划、监控对手并随新信息修订策略。CivBench 的关键设计选择是将信息的可用性与信息是否被纳入 context 分离——所有非局部状态必须通过显式查询才能获取，这使得研究者能够直接从 interaction traces 中测量 attention allocation 和 plan execution，而非依赖压缩了数百个决策行为差异的聚合结果。解决这一问题能够为 agent 的可靠性评估提供超越 win/loss 的诊断维度，揭示仅靠改进 reasoning 不足以解决的 interface-level failure modes，并为改进 scaffolding、memory mechanism 和 commitment tracking 提供实证基础。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决。在 Civilization-based AI 环境方面，CivRealm [Qi et al., 2024] 基于 FreeCiv 引擎通过 Gymnasium-style API 交互，CivAgent [FuxiAILab, 2024] 和 Vox Deorum [Vox Deorum, 2025] 在替代游戏实现中研究 LLM 行为。这些系统的主要不足在于接口设计：它们使用 Gymnasium tensor 或 LangChain text 接口而非生产级的 MCP tool call 接口，无法反映真实工具使用场景中 agent 必须自主决定调用哪些工具、何时调用的交互模式。更关键的是，这些环境未将信息的可用性与是否被显式查询分离——在 Gymnasium-style API 中，observation space 是固定的，agent 被动接收状态，因此无法区分\"信息不可用\"与\"信息可用但未被检索\"，也就无法直接测量 attention allocation。在更广泛的 LLM agent evaluation 领域，BALROG [Paglieri et al., 2025] 报告了模型在解释策略与执行策略之间的差距，但未使用 MCP 接口；CICERO [Meta FAIR, 2022] 在 Diplomacy 中展示了强性能，但该游戏的交互周期和状态复杂度远低于 Civilization VI。其他 benchmark 如 Vending-Bench 2 [Andon Labs, 2025]、MCPAgentBench [2025]、ToolBench [Qin et al., 2023] 和 SWE-bench [Jimenez et al., 2024] 各自孤立地评估 long-term management、tool use 或 software engineering 等单一维度，未能在单一长周期环境中整合这些要素。此外，先前的 game-agent benchmark 主要以 task success 或 final outcome 作为评分标准，未释放完整的 tool-call traces，也未定义基于信息检索和承诺执行的 metrics。这些不足的根源并非单纯是\"未考虑 X\"，而是缺乏一个将 partial observability、large action space、长周期决策和 production-style tool interface 整合在一起的环境，使得 attention allocation 和 plan execution 这两个 interface-level 行为模式无法被直接观察和量化。CivBench 通过 MCP 接口、narration layer 和 structured diary 填补了这一评测缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n前沿 LLM 正越来越多地被部署为 agent，在长周期环境中调用工具、观察外部状态并做出连续决策。然而，现有的评估范式通常将推理、工具使用或短周期规划孤立地测试，或者通过 Gymnasium 风格的 API 将所有状态被动地暴露给 agent，并主要依赖最终的输赢或任务成功率来衡量表现。这种评估方式掩盖了一个关键问题：在真实世界的工具介导环境中，信息并非被动呈现，而是需要主动检索。如果 agent 像人类玩家一样被动“吸收”状态，它可能无法暴露出在长周期决策中“该看没看”的注意力缺陷。同时，已有经验观察（如 BALROG 等工作）指出，LLM agent 经常能“说”出正确的策略，但在实际执行时却失败。然而，由于缺乏对交互轨迹的细粒度记录，研究者很难区分这种失败是因为能力缺失，还是因为 agent 根本没有将相关信息带入上下文，亦或是它忘记了自己刚刚制定的计划。作者意识到，要真正理解 agent 在长周期任务中的失败模式，需要一个能够将“信息的可用性”与“是否被主动检索”强制分离的环境。在这个环境中，所有非局部状态必须通过显式的工具调用才能获取，并且 agent 的每一次工具调用和计划陈述都被完整记录。这样，研究者就能直接从交互轨迹中测量 agent 的注意力分配和承诺执行情况，而不是从聚合的最终结果中去推断。《文明6》因其 300+ 回合的复杂博弈、部分可观察性和巨大的动作空间，成为了实现这一想法的理想测试床。\n\n### § 4 核心 Intuition\n\n现有评估将状态被动喂给 agent 并只看最终结果，掩盖了 agent 在长周期中“该看没看、该做没做”的执行缺陷。CivBench 的核心在于强制 agent 只能通过显式工具调用来获取非局部状态，从而将“信息的可用性”与“是否被检索”彻底分离。这种设计使得 agent 的注意力分配和计划执行轨迹变得直接可测，暴露出即使有能力且受指导也依然存在的“感知盲区”和“言行不一”。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+-------------------+      Tool Calls       +-------------------+\n|   Language Model  | ---------------------\u003E |   MCP Server      |\n|      Agent        | \u003C--------------------- |   (76 Tools)      |\n+-------------------+   Structured Text     +-------------------+\n         |                                           | Game Calls\n         |                                           v\n         |                               +-------------------+\n         |                               | Civilization VI   |\n         |                               +-------------------+\n         |                                           | Visual State\n         |                                           v\n         |                               +-------------------+\n         |                               | Narration Layer   |\n         |                               +-------------------+\n         v                                           | Structured Text\n+-------------------+                                 |\n| Interaction Trace | \u003C-------------------------------+\n+-------------------+\n         |\n         v\n+-------------------+\n|  Metric Analysis  |\n| (PMR, RAG@K, etc) |\n+-------------------+\n```\n\n**节点与流程解释：**\n\n1. **Language Model Agent**：作为决策核心，在长周期交互中接收结构化文本观察，输出 tool calls 并生成 planning reflections。Agent 面临 partial observability，必须主动决定调用哪些工具来获取非局部状态。\n2. **MCP Server (76 Tools)**：作为生产级的交互接口，将 Agent 的 tool calls 转化为游戏引擎指令，并将结构化反馈返回给 Agent。这涵盖了状态查询、单位控制、城市管理、外交和科研等核心系统。\n3. **Civilization VI**：底层游戏引擎，执行指令并产生 visual game state。单局游戏跨度超过 300 turns，包含经济、科技、文化、军事等多维度优先级管理。\n4. **Narration Layer**：核心设计组件，将游戏的 visual state 转换为 Agent 可读的 structured text。关键在于，该层强制执行“信息可用性与是否被带入上下文分离”的约束——所有非局部状态必须通过显式查询才能呈现给 Agent。\n5. **Interaction Trace**：完整记录 Agent 的每一次 tool call、planning reflection 以及对应的游戏状态变化，为细粒度行为分析提供数据基础。\n6. **Metric Analysis**：基于 Interaction Trace 计算两个 interface-level metrics：Proactive Monitoring Rate (PMR) 测量 Agent 是否主动查询潜在战略状态；RAG@K 测量 Agent 在 planning reflections 中陈述的承诺是否在后续 K turns 内被执行。\n\n### § 7 实验设计与结论\n\n**提出什么问题**：\n在长周期、工具介导的环境中，语言模型 agent 是否会系统性地忽略可主动查询的关键战略信息？此外，agent 是否会在 planning reflection 中做出承诺却在后续行动中未能执行？\n\n**用什么实验验证**：\n研究者使用 CivBench 环境，让来自 4 个模型家族的 agent 在 shared playbook protocol 下进行完整的 Civilization VI 游戏，共收集 23 个 admissible runs。单局游戏超过 300 turns 并产生数千次 tool calls。通过完整记录的 interaction traces，研究者计算了 Proactive Monitoring Rate (PMR) 和 RAG@10 指标，以量化 agent 的注意力分配和承诺执行情况。\n\n**结论是什么**：\n1. **战略状态监测不足**：尽管 playbook 指导 agent 每 20 turns 查询一次胜利进度，但实际运行中 agent 仅每 30–75 turns 查询一次。在 20 次可检测的失败中，有 7 次在游戏结束前的 20-turn 警告窗口内未能进行查询。\n2. **近期承诺执行失败**：Agent 频繁未能执行其在 planning reflections 中陈述的近期承诺，各模型的 RAG@10 得分仅在 48.2% 到 65.8% 之间。\n3. **失败模式归因**：这两种一致的模式是在 agent 拥有工具访问权限和明确指导的情况下出现的。因此，研究者将这些 interface-level failures 解释为 instruction deviations（指令偏差），而非 capabilities absences（能力缺失）。这表明仅靠改进推理能力不足以解决这些问题，需要在 scaffolding 和 commitment tracking 机制上进行改进。", "additional_insights": "### § 8 Take-aways\nCivBench 是一个基于 Model Context Protocol (MCP) 的开源 benchmark，它通过 narration layer 将 Civilization VI 的视觉游戏状态转化为结构化文本，用于评估 LLM agents 在长周期、工具介导环境中的表现。该环境的核心设计是将信息的可用性与是否被主动检索分离，所有非局部状态必须通过显式的 tool calls 获取，从而使得 agent 的注意力分配变得可测量。论文提出了两个 interface-level metrics：Proactive Monitoring Rate (PMR) 衡量 agent 主动查询潜在战略状态的频率，RAG@10 衡量 agent 在 10 个回合内执行其在 planning reflections 中陈述的承诺的比例。通过对四个模型家族的 23 次有效运行进行分析，论文发现了 sensorium effect，即尽管有 playbook 的明确指导，agents 仍极少主动查询胜利进度等全局状态，导致在 20 次可检测的失败中有 7 次未在警告窗口内察觉对手的胜利威胁。实验还揭示了 reflection-action gap，agents 经常无法在短期内执行自己陈述的具体计划，各模型的 RAG@10 得分仅在 48.2% 到 65.8% 之间。由于样本量较小，论文明确声明这并非模型排名，而是指出这些失败是在有工具访问权限和明确指导下的 instruction deviation，而非纯粹的 capability absence。\n\n### § 9 最脆弱的假设\n这篇论文最关键的假设是：narration layer 能够无损且充分地传递游戏状态，使得 agent 的 under-monitoring 和未执行计划行为可以被纯粹归因于其注意力分配缺陷和执行偏差，而非界面信息呈现的局限性。如果这个假设不成立，核心贡献将直接失效，因为所谓的 sensorium effect 和 reflection-action gap 可能只是 narration layer 信息压缩或呈现方式不佳导致的认知过载，而非 agent 本身的策略性疏忽。在实际中，这个假设很可能不成立，因为将一个高度视觉化、空间化的 4X 策略游戏转化为结构化文本不可避免地会丢失空间关系和紧急状态的视觉显著性，agent 可能需要消耗大量的 context window 才能拼凑出人类玩家一眼就能看出的全局态势。论文为这个假设提供的证据非常薄弱，仅在 Appendix A.5 中提到 narration 是“intentionally selective”并进行了压缩，但缺乏对信息保真度的定量评估，也没有提供人类玩家在仅使用该文本界面时的 baseline 表现来排除界面设计本身的误导性。\n\n### § 10 最小复现实验\n如果有一周时间，最小复现实验可以直接使用论文在 HuggingFace 上开源的 raw admissible-game logs，验证 sensorium effect 及其与失败结局的关联，而无需运行完整的 Civilization VI 环境或调用昂贵的 LLMs。具体而言，解析这些 tool-call transcripts，提取每次调用 `get_victory_progress` 的时间戳和频率，并筛选出所有以 defeat 结束的游戏。测量在这些失败游戏中，最后 20 个回合内 agent 是否至少调用过一次 `get_victory_progress`。如果结果与论文 Table 2 一致，即在约 35%（7/20）的失败游戏中完全没有查询胜利进度，则支持了 agent 在有明确指导的情况下仍存在系统性 under-monitoring 的 claim。反之，如果发现 agent 实际上频繁查询了该工具但仍然失败，则反驳了论文的 claim，表明失败可能源于 agent 无法理解返回的结构化文本，而非没有主动查询。", "research_value": "### § 11 最强反例设计\n我会设计一个“被动状态注入”的对照实验来挑战论文对 sensorium effect 的核心归因。论文将 agent 未查询 `get_victory_progress` 归因为注意力分配缺陷，但这极可能是 MCP 接口设计引入的认知税伪影。在真实人类玩家界面中，胜利进度是 HUD 常驻的视觉显著性信息，而 CivBench 强制其成为显式 tool call，这实际上将高显著性信息降维为了低显著性文本。如果我在实验中将该状态信息作为被动 observation 自动注入每回合的 context（模拟人类玩家的 HUD），并发现 agent 的失败率显著下降且策略行为改善，这就证明所谓的 under-monitoring 并非 agent 本身的固有缺陷，而是 benchmark 接口将环境感知负担不合理地转移给 agent 后造成的认知过载。此外，我可以测量 `get_victory_progress` 返回的 token 长度与调用频率的负相关性：如果返回文本越长、越冗余，agent 越倾向于不调用，则说明这是 context window 管理策略下的理性规避，而非论文声称的 instruction deviation。这一反例直接动摇了论文将失败归因于 agent 认知缺陷的立论，揭示其测量到的可能只是 interface friction。\n\n### § 12 Follow-up Research Idea\n针对静态 narration layer 导致信息保真度与 context window 难以兼顾的局限，我提出一个“基于注意力驱动的动态状态抽象”研究框架。该想法的核心是将 agent 从被动的 tool caller 转变为主动的 perception policy 设计者。在 CivBench 等长周期环境中，固定的 MCP tools 和静态文本压缩无法适应 agent 在不同战略阶段的注意力焦点变化，导致信息检索与当前 sub-goal 脱节。我们可以借鉴机器人领域的 Active Vision 和 Information Foraging Theory，让 agent 根据其 planning reflection 中的 sub-goals，动态生成针对高维游戏状态的“注意力掩码”或“查询谓词”。第一个实验将设计一个 Dynamic State Query Generator，取代固定的 `get_victory_progress` 等 tool。Agent 不再调用预定义接口，而是输出一个结构化查询（如“提取首都半径 5 格内的敌军单位，忽略科技进度”），由底层引擎动态渲染并返回高度定制化的局部 narration。通过对比固定 MCP 接口与动态查询接口在 context efficiency 和 RAG@10 上的表现，我们可以验证：如果 agent 能够自主控制状态抽象的粒度，reflection-action gap 是否会随之消失。这不仅重新定义了 agent-environment interface，还将 LLM 的内部 attention 机制与外部 state retrieval 深度耦合，开辟了“自适应感知界面”的新方向，彻底区别于现有静态 tool-use benchmark 的评估范式。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Austin Tudor David Andrews\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Liam Wilkinson\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Jamie Heagerty\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Harry Coppock\", \"affiliations\": [4, 5, 6], \"markers\": []},\n    {\"name\": \"Jakob Nicolaus Foerster\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Rui Ponte Costa\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"University of Oxford\"},\n    {\"id\": 2, \"name\": \"Tony Blair Institute for Global Change\"},\n    {\"id\": 3, \"name\": \"Google DeepMind\"},\n    {\"id\": 4, \"name\": \"UK AI Security Institute\"},\n    {\"id\": 5, \"name\": \"Imperial College London\"},\n    {\"id\": 6, \"name\": \"10 Downing Street\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Joint first authors; equal contribution.\"}\n  ]\n}\n```", "summary_translation": "我们提出了CivBench，这是一个开源benchmark，用于通过Model Context Protocol (MCP)在long-horizon, tool-mediated environments中评估language model agents。单个episode跨越300余个turns，并在庞大的action space中产生数千次tool calls，需要在partial observability下进行持续的planning、state monitoring和execution。该环境暴露了76个MCP tools和一个narration layer，后者将视觉游戏状态转换为结构化文本。我们使用CivBench在23次admissible runs中对四个model families的agent behaviour进行了表征。该样本是一个pilot，而非model ranking：在这个规模下，aggregate outcomes无法可靠地区分模型。相反，我们引入了该环境使其可测量的两个interface-level metrics：Proactive Monitoring Rate (PMR)，用于捕捉agents是否主动查询latent strategic state；以及RAG@10，用于捕捉在structured planning reflections中声明的commitments是否在随后的十个turns内被执行。在shared playbook protocol下，我们在各次runs中观察到了两种一致的模式。Agents对可用但需要显式查询的strategically relevant state存在监控不足：尽管playbook指导每20个turns查询一次victory progress，但agents仅每30到75个turns执行一次；并且在20次detectable defeats中，有7次在游戏结束前的20个turns的warning window内未能进行查询。Agents也经常未能执行其自身planning reflections中声明的近期commitments（各模型的RAG@10在48.2%到65.8%之间）。尽管拥有tool access和explicit guidance，这两种模式依然出现，我们将它们解释为instruction下的偏差，而非能力的缺失。我们在 https://github.com/lmwilki/civ6-mcp 发布了环境、scenarios、logs、metrics和analysis pipeline。"}, {"title": "CHIME: Credit-Aware Hierarchical Memory Evolution for Long-Horizon Agentic Planning", "arxiv_id": "2609.02074", "authors": "Yongshi Ye, Tian Lan, Feihu Jiang, Muyang Ye, Bin Zhu, Qianghuai Jia, Longyue Wang, Zhao Xu, Weihua Luo, Xiaodong Shi", "summary": "Planning is a central capability that enables agents to decompose complex long-horizon tasks into manageable steps. Test-time search and training-based methods improve planning but incur high inference costs or require expensive training data. Self-evolving memory instead accumulates reusable experience from agent interaction outcomes into an external memory bank, so planning capability keeps improving at inference time without parameter updates. However, existing self-evolving memory methods share an inherent credit assignment problem: they rely on final task outcomes as feedback, but such outcomes conflate plan quality with execution errors and environmental factors, so the accumulated planning experience is often biased and noisy. To address this problem, we propose Credit-Aware Hierarchical Memory Evolution (CHIME), a self-evolving memory framework that maintains a separate planning bank and execution bank and follows an attribute-before-memorize principle: CHIME first attributes each task outcome to the plan, the execution, both, or neither, and then updates only the corresponding memory bank. Extensive experiments on four long-horizon agent benchmarks show that CHIME consistently outperforms state-of-the-art training-based and self-evolving memory baselines. Further analyses reveal several interesting findings. For example, CHIME accumulates effective memory with far fewer items. In addition, the learned memory values faithfully reflect downstream utility: high-quality planning memories are more valuable than execution memories. Finally, the accumulated memory effectively transfers across backbone models. Code will be released at https://github.com/ATH-MaaS/Marco-DeepResearch.", "category": "cs.AI", "cluster": "Long-Horizon Planning \u0026 Memory", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving, Long-Horizon Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文针对 self-evolving memory 范式在 long-horizon agentic planning 中固有的 credit assignment problem，提出了一种能够在不更新模型参数的前提下，将任务结果的反馈精确归因到 planning 或 execution 阶段的 memory evolution 框架——CHIME (Credit-Aware Hierarchical Memory Evolution)。具体而言，现有的 self-evolving memory 方法直接将下游任务的最终 outcome 作为监督信号来更新 memory bank，但同一个 outcome 可能源于截然不同的原因：成功可能是因为 plan 合理，也可能是因为 executor 从一个有缺陷的 plan 中恢复了过来；失败可能源于 flawed plan、incorrect execution，或是 environmental issues。这种将 outcome 与 plan quality 直接等同的做法，会导致积累的 planning experience 充满偏差与噪声。\n\n这个问题的重要性在于，long-horizon tasks 要求 agent 在多个相互依赖的步骤间协调决策并维持对任务约束的遵守，而 planning 是实现这一目标的核心能力。一旦 biased experience 被写入 memory bank，它会在后续任务中被反复检索和重用，使局部的误判累积为系统性的 planning 错误；同时，execution- 或 environment-level 的经验可能被误当作 planning memory，在检索时以低层细节误导高层 planning 决策。解决这一问题不仅能提升 agent 在 long-horizon tasks 上的准确率，还能显著提高 memory bank 的效率与可迁移性——实验表明 CHIME 仅用 129 条 memory 即超越了使用 3,585 条 memory 的强 baseline，且积累的 memory 能有效跨 backbone model 迁移。\n\n### § 2 前人工作与不足\n\nLong-horizon agentic planning 的改进此前主要沿三条路径展开，但均存在根本性局限。Test-time search 方法（如 Tree of Thoughts、LATS、WebAnchor）通过在推理时探索多个候选 plan 或 trajectory 并基于 value estimates 进行选择来提升单任务表现，但它们不仅 incur high inference costs，而且不保留可跨任务复用的经验，每次任务都从零开始。Planner model training 方法（如 TodoEvolve、Plan-and-Act）试图将 planning capability 内化到模型参数中，但这要求收集大量 trajectory 数据并进行 post-training，且识别高质量 plan 依赖于大量的 downstream executions，使得 planner 的持续更新成本高昂。\n\n与 CHIME 最接近的是 self-evolving memory 范式（如 A-MapReduce、UMEM、ReasoningBank），它将外部 memory bank 视为 agent 的可进化参数，从交互轨迹中蒸馏可复用经验，保持模型参数冻结，避免了昂贵的训练过程。然而，这类方法存在一个未被清楚定义的关键缺陷：它们隐式地假设 final task outcome 能够忠实反映 plan quality，并直接用该 outcome 作为 memory 更新的监督信号。这一假设在 agentic planning 场景下失效，因为 outcome 是 plan、execution 和 environment 三者共同作用的结果——A-MapReduce 虽能从过去执行中进化结构化 hints 来改善任务分解与结果聚合，但它同样从 final outcomes 直接诱导 insights，没有区分 plan 与 execution 对 outcome 的各自贡献。这种 credit assignment failure 的根源在于，先前方法缺乏一种机制来解耦 outcome 中的 planning credit 与 execution credit，导致 execution-level 的噪声污染 planning memory，或使 biased experience 在 memory bank 中持续累积并干扰后续检索。CHIME 正是通过引入 attribute-before-memorize 原则和 hierarchical memory bank 设计，在 memory 写入前即对 outcome 进行阶段级归因，从而填补了这一缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n作者面对的起点是 long-horizon agentic planning 中 self-evolving memory 这一范式。这一范式的吸引力很明确：不需要昂贵的 post-training，只需把 agent 交互轨迹中蒸馏出的经验写入外部 memory bank，就能在推理阶段持续提升 planning 能力。然而，作者很可能从实验观察中注意到一个反复出现的失败模式——memory bank 里积累了大量经验，但检索出来的内容经常对当前任务的 planning 没有实质帮助，甚至产生误导。这个现象促使作者追问：为什么从真实交互中提取的经验反而不可靠？\n\n要诊断这个问题，作者需要回到 self-evolving memory 的基本反馈机制。现有方法（如 A-MapReduce、UMEM）几乎无一例外地用 final task outcome 作为 memory 更新的 supervision signal：任务成功就把这条轨迹的经验标记为\"有用\"，失败就标记为\"有害\"。但 long-horizon agent 的执行是一个 multi-stage 过程——planner 先生成 plan，executor 再执行 plan。作者从 credit assignment 的经典视角意识到，final outcome 实际上 conflates 了两个不同决策层的贡献。一个成功的 outcome 可能是因为 plan 本身合理，也可能是因为 executor 在执行过程中自行纠正了一个有缺陷的 plan；一个失败的 outcome 可能是 plan 的问题，也可能是 execution 的问题，甚至是环境因素（如 API 不可用）导致的。把 outcome 直接等同于 plan quality，等于在 multi-stage 决策中做了一个错误的 reward 归因。\n\n这个 credit assignment failure 会产生两类可预见的后果。第一，biased experience 一旦写入 memory bank，就会通过 similarity retrieval 被反复召回和复用，使局部的误判累积成系统性的 planning 错误——这解释了作者可能观察到的\"memory 越多反而越差\"的现象。第二，execution-level 的经验（如某个工具的具体调用参数技巧）可能被错误地当作 planning memory 存入同一个 bank，检索时把低层操作细节注入高层 planning 上下文，不仅无法提供 strategic guidance，反而干扰 planner 的 subtask decomposition 和 dependency modeling。\n\n从 RL 的 credit assignment 理论中，作者可以找到一个自然的解决思路：在 multi-stage 系统中，reward 必须被分配到产生它的那个决策层，而不是均匀地施加给所有层。将这个思路迁移到 self-evolving memory，就意味着在写入 memory 之前，必须先判断当前 outcome 的 credit 应归属于 planning 还是 execution。此外，既然 planning 和 execution 产生的是不同层级的经验（strategic experience vs. operational experience），它们理应被存储在不同的 memory bank 中，各自独立检索，避免 cross-stage contamination。作者进一步注意到，LLM 本身具备 self-reflection 能力，可以通过 structured prompting 审视 task、plan、trajectory 和 outcome，做出合理的 stage-level attribution——这提供了一个无需额外训练的 credit attribution 机制。\n\n至此，作者的思考路径从\"memory 为什么不可靠\"走到\"outcome 不等于 plan quality\"的 credit assignment 诊断，再走到\"先归因、再记忆\"的解决原则，最终形成 hierarchical memory bank + credit attribution gate + credit-aware evolution 的完整框架设计。\n\n### § 4 核心 Intuition\n\n现有 self-evolving memory 把任务的最终成败直接当作 plan 的好坏来更新经验库，但 long-horizon 任务的 outcome 是 planner 和 executor 共同作用的结果——executor 可能纠正了一个糟糕的 plan 使任务成功，也可能执行错了一个好 plan 导致失败。CHIME 的核心 intuition 是：在把任何经验写入 memory 之前，先用 LLM 的 self-reflection 能力判断这次成败到底该归因于 planning、execution、两者还是外部因素，然后只更新被归因的那个阶段的专属 memory bank。这个\"先归因再记忆\"的步骤切断了 execution 噪声污染 planning memory 的通道，使得每条积累的经验都真正对应它所能指导的那个决策层。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《CHIME: Credit-Aware Hierarchical Memory Evolution for Long-Horizon Agentic Planning》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文针对 self-evolving memory 范式在 long-horizon agentic planning 中固有的 credit assignment problem，提出了一种能够在不更新模型参数的前提下，将任务结果的反馈精确归因到 planning 或 execution 阶段的 memory evolution 框架——CHIME (Credit-Aware Hierarchical Memory Evolution)。具体而言，现有的 self-evolving memory 方法直接将下游任务的最终 outcome 作为监督信号来更新 memory bank，但同一个 outcome 可能源于截然不同的原因：成功可能是因为 plan 合理，也可能是因为 executor 从一个有缺陷的 plan 中恢复了过来；失败可能源于 flawed plan、incorrect execution，或是 environmental issues。这种将 outcome 与 plan quality 直接等同的做法，会导致积累的 planning experience 充满偏差与噪声。 这个问题的重要性在于，long-horizon tasks 要求 agent 在多个相互依赖的步骤间协调决策并维持对任务约束的遵守，而 planning 是实现这一目标的核心能力。一旦 biased experience 被写入 memory bank，它会在后续任务中被反复检索和重用，使局部的误判累积为系统性的 planning 错误；同时，execution- 或 environment-level 的经验可能被误当作 planning memory，在检索时以低层细节误导高层 planning 决策。解决这一问题不仅能提升 agent 在 long-horizon tasks 上的准确率，还能显著提高 memory bank 的效率与可迁移性——实验表明 CHIME 仅用 129 条 memory 即超越了使用 3,585 条 memor...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 作者面对的起点是 long-horizon agentic planning 中 self-evolving memory 这一范式。这一范式的吸引力很明确：不需要昂贵的 post-training，只需把 agent 交互轨迹中蒸馏出的经验写入外部 memory bank，就能在推理阶段持续提升 planning 能力。然而，作者很可能从实验观察中注意到一个反复出现的失败模式——memory bank 里积累了大量经验，但检索出来的内容经常对当前任务的 planning 没有实质帮助，甚至产生误导。这个现象促使作者追问：为什么从真实交互中提取的经验反而不可靠？ 要诊断这个问题，作者需要回到 self-evolving memory 的基本反馈机制。现有方法（如 A-MapReduce、UMEM）几乎无一例外地用 final task outcome 作为 memory 更新的 supervision signal：任务成功就把这条轨迹的经验标记为\"有用\"，失败就标记为\"有害\"。但 long-horizon agent 的执行是一个 multi-stage 过程——planner 先生成 plan，executor 再执行 plan。作者从 credit assignment 的经典视角意识到，final outcome 实际上 conflates 了两个不同决策层的贡献。一个成功的 outcome 可能是因为 plan 本身合理，也可能是因为 executor 在执行过程中自行纠正了一个有缺陷的 plan；一个失败的 outcome 可能是 plan 的问题，也可能是 execution 的问题，甚至是环境因素（如 API 不可用）导致的。把 outcome 直接等同于 plan quality，等于在 multi-stage 决策中做了一个错误的 reward 归因。 这个 credit assignment failure 会产生两类可预见的后果。第一，biased experience 一旦写入 memory bank，就会通... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **CHIME: Credit-Aware Hierarchical Memory Evolution for Long-Horizon Agentic Planning** # **Yongshi Ye[1,2,4] , Tian Lan[4] , Feihu Jiang[4] , Muyang Ye[3] , Bin Zhu[4] , Qianghuai Jia[4] , Longyue Wang[4]**[*] **, Zhao Xu[4] , Weihua Luo[4] , Xiaodong Shi[1,2]**[*] 1Institute of Artificial Intelligence, Xiamen University 2Key Laboratory of Digital Protection and Intelligent Processing of Intangible Cultural Heritage of Fujian and Taiwan (Xiamen University), Ministry of Culture and Tourism 3Zhejiang University 4Alibaba Group ## **Abstract** Planning is a central capability that enables agents to decompose complex long-horizon tasks into manageable steps. Testtime search and training-based methods improve planning but incur high inference costs or require expensive training data. Self-evolving memory instead accumulates reusable experience from agent interaction outcomes into an externa...", "additional_insights": "### § 8 Take-aways\n本文提出了 CHIME，一个基于 self-evolving memory 的 agentic planning 框架，通过 attribute-before-memorize 原则解决了现有方法中由于直接使用最终任务结果作为反馈而导致的 credit assignment 问题。CHIME 引入了 Credit Attribution Gate，将任务结果归因于 planning、execution、两者或外部因素，并仅更新对应的 memory bank，从而避免了 execution-level 细节污染 planning memory。框架采用 Hierarchical Memory Bank 显式分离 planning 和 execution 经验，通过 similarity retrieval 和 value-based reranking 提取 stage-specific memory 指导后续任务。实验表明，CHIME 在四个 long-horizon agent benchmark 上超越了基于训练和基于 self-evolving memory 的 SOTA baselines，且仅需极少的 memory items（129条 vs 3585条）即可达到更高的准确率。进一步分析发现，planning memory 的价值显著高于 execution memory，且积累的 memory 能够有效跨 backbone model 迁移，证明了 attributed memory 编码的是通用指导而非模型特定模式。\n\n### § 9 最脆弱的假设\nCHIME 最核心且最脆弱的假设是：LLM 的 self-reflection 能力能够准确地将任务结果归因于 planning 或 execution 阶段（即 Credit Attribution Gate 的可靠性）。如果这个假设不成立，即 LLM 无法准确区分是计划错误还是执行错误，那么归因错误会导致经验被写入错误的 memory bank，不仅无法解决原有的 credit assignment 问题，反而会引入新的系统性偏差。在实际的 long-horizon tasks 中，失败往往是多阶段的且因果关系复杂，一个看似是 execution 错误的问题可能根源在于 plan 没有提供足够的约束，反之亦然，LLM 在面对冗长的交互轨迹时极易产生误判或幻觉。论文为这个假设提供的证据并不充分：RQ4 中虽然 Stability 达到了 87.8%-97.9%，但 Rescued 比例仅为 56.3%-67.6%，意味着仍有近一半的失败任务在注入生成 memory 后未能修复；此外，RQ5 显示使用更强的模型（Qwen3.7-Flash）进行 credit attribution 能进一步提升性能，这恰恰反证了当前 backbone 的 self-reflection 能力存在局限，归因并不总是可靠的。\n\n### § 10 最小复现实验\n在一周时间内，可以设计一个最小复现实验来验证 Credit Attribution Gate 对 memory 质量的提升作用。数据方面，选择一个较小的 long-horizon agent benchmark（如 $\\tau^2$-bench 的子集，约 50-100 个任务）。实现方面，不需要复现完整的 CHIME 框架，只需构建一个简化的 memory accumulation 流程：使用一个 LLM 作为 agent 执行任务并生成轨迹，然后对比两种 memory 更新策略——(1) Vanilla：直接根据任务成功或失败将轨迹摘要写入 memory；(2) CHIME-simplified：使用 LLM 作为 Credit Attribution Gate 对失败轨迹进行归因，仅将归因到特定阶段的经验写入对应的 memory bank。测量指标包括：在积累一定数量 memory 后，冻结 memory bank 并在 20 个新任务上测试 agent 的准确率；同时使用一个外部 LLM judge 评估积累的 memory 的 Correctness 和 Generality（类似 RQ1）。如果 CHIME-simplified 策略积累的 memory 质量评分显著高于 Vanilla 策略，且在测试任务上的准确率更高，则支持论文的 claim；反之，如果两者表现无显著差异，或者 CHIME-simplified 的 memory 质量反而更差，则说明归因机制未能有效过滤噪声，反驳了核心 claim。", "research_value": "### § 11 最强反例设计\n\n如果我要对 CHIME 提出最有力的攻击，我会挑战其 Credit Attribution Gate 的实际归因准确性，并提出一个替代解释：CHIME 的性能提升并非源于精确的 credit assignment，而是源于 Hierarchical Memory Bank 的结构化分离本身对检索噪声的物理隔离，以及 LLM 在归因时存在系统性的“高估 planning、低估 execution”的偏差。我设计一个包含高度 causal entanglement 的合成 long-horizon task suite 作为反例实验。在这个实验中，任务的失败被刻意设计为具有隐蔽的跨阶段因果关系：例如，plan 在表面上看起来逻辑完备且步骤清晰，但实际缺失了一个关键的 environmental constraint，导致 executor 在后续执行中必然触发未处理的 edge case 而失败。我将引入一个具有 ground-truth attribution 的评估机制，直接测量 Credit Attribution Gate 的归因准确率，而不仅仅是下游任务的 success rate。我预测，在面对这种因果纠缠的轨迹时，LLM-based gate 会表现出强烈的 superficial reasoning 倾向，将失败归咎于 execution 阶段的具体报错，而非 plan 阶段的约束缺失。这种系统性的 misattribution 会导致大量“如何修复 execution 报错”的低层细节被错误写入 execution memory bank，而真正有价值的 planning memory（如“需要预先检查 environmental constraint”）却从未被生成。如果这个替代解释成立，那么实验将显示：CHIME 相比于无归因的 vanilla baseline 的提升，主要来自于 execution memory bank 吸收了有害噪声（起到了缓冲作用），而非 planning memory bank 的质量提升；并且，当强制将所有失败都归因于 planning 时，系统性能可能不降反升，从而直接证伪论文“精确阶段级归因提升 planning memory 质量”的核心 claim。\n\n### § 12 Follow-up Research Idea\n\n基于 CHIME 依赖 LLM self-reflection 进行 post-hoc 归因这一核心局限，我提出一个非增量的 novel research idea：将 agentic memory 的 credit assignment 从被动的事后反思转变为主动的干预式因果探测，即 Counterfactual Trajectory Replay for Memory Distillation。这个想法的驱动需求是：long-horizon tasks 中 plan 与 execution 的因果关系是 entangled 的，任何基于静态轨迹的 LLM reasoning 都不可避免地产生幻觉或 misattribution，我们需要一种不依赖 LLM 内部因果推理能力的客观归因机制。可以借鉴因果推断领域的 interventionist framework 和 counterfactual evaluation 方法，将 agent 的交互环境视为一个可干预的 structural causal model。具体而言，当一条 trajectory 失败时，我们不再询问 LLM“哪里错了”，而是通过 environment rollback 和 controlled intervention 来经验性地测试反事实假设：保持 plan 不变，替换为一个已知强大的 oracle executor，如果任务成功，则经验性地证明原 executor 是失败的唯一原因；保持原 executor 不变，注入一个 oracle plan，如果任务成功，则证明原 plan 是瓶颈。这种干预直接从环境获得 ground-truth credit，完全绕过了 LLM 的反思局限。第一个实验将设计一个支持 state rollback 的 long-horizon environment（如 $\\tau^2$-bench 的子集），对比三种 memory accumulation 策略：(1) Vanilla (无归因), (2) CHIME (LLM reflective attribution), (3) Causal-Intervention (counterfactual replay)。评估指标不仅包括下游任务的 success rate，还直接测量 attribution accuracy 和 memory bank 的 sparsity。这个提议与已有工作的根本区别在于：它将 memory evolution 从一个 natural language processing 任务（让 LLM 读轨迹写总结）重构为一个 empirical causal discovery 任务（让 agent 通过受控实验验证假设），从而首次在 self-evolving memory 范式中引入了客观的、可证伪的 credit assignment 机制。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yongshi Ye\", \"affiliations\": [1, 2, 4], \"markers\": []},\n    {\"name\": \"Tian Lan\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Feihu Jiang\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Muyang Ye\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Bin Zhu\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Qianghuai Jia\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Longyue Wang\", \"affiliations\": [4], \"markers\": [\"*\"]},\n    {\"name\": \"Zhao Xu\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Weihua Luo\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Xiaodong Shi\", \"affiliations\": [1, 2], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Institute of Artificial Intelligence, Xiamen University\"},\n    {\"id\": 2, \"name\": \"Key Laboratory of Digital Protection and Intelligent Processing of Intangible Cultural Heritage of Fujian and Taiwan (Xiamen University), Ministry of Culture and Tourism\"},\n    {\"id\": 3, \"name\": \"Zhejiang University\"},\n    {\"id\": 4, \"name\": \"Alibaba Group\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author: wanglongyue.wly@alibabainc.com, mandel@xmu.edu.cn.\"}\n  ]\n}\n```", "summary_translation": "规划是一项核心能力，使智能体能够将复杂的 long-horizon tasks 分解为可管理的步骤。Test-time search 和 training-based methods 改进了规划，但会产生高昂的推理成本或需要昂贵的训练数据。相比之下，Self-evolving memory 将从智能体交互结果中积累的可复用经验存入外部 memory bank，因此规划能力在推理阶段无需参数更新即可持续提升。然而，现有的 self-evolving memory 方法存在一个固有的 credit assignment problem：它们依赖最终任务结果作为反馈，但这种结果将规划质量与执行错误和环境因素混为一谈，因此积累的规划经验往往是有偏且充满噪声的。为了解决这个问题，我们提出了 Credit-Aware Hierarchical Memory Evolution (CHIME)，这是一个 self-evolving memory 框架，它维护独立的 planning bank 和 execution bank，并遵循 attribute-before-memorize 原则：CHIME 首先将每个任务结果归因于规划、执行、两者或两者皆非，然后仅更新相应的 memory bank。在四个 long-horizon agent benchmarks 上的大量实验表明，CHIME 始终优于 state-of-the-art 的 training-based 和 self-evolving memory baselines。进一步的分析揭示了几个有趣的发现。例如，CHIME 用少得多的条目积累了有效的 memory。此外，学习到的 memory values 忠实地反映了 downstream utility：高质量的 planning memories 比 execution memories 更有价值。最后，积累的 memory 能在 backbone models 之间有效迁移。代码将在 https://github.com/ATH-MaaS/Marco-DeepResearch 发布。"}, {"title": "How Fast Do Agents Rot? An Empirical Study of Long-Horizon Degradation in LLM Agents for Production Decision-Making", "arxiv_id": "2609.01660", "authors": "Shubhra Mittal", "summary": "Production deployments of large language model (LLM) agents remain unreliable on long, multi-step workflows even as benchmark success rates climb steadily. We argue this gap is largely an artifact of task horizon: benchmarks are dominated by short-to-medium horizons where success remains high, while production workloads demand an order of magnitude more dependent steps. We measure the effect directly, characterizing the shape of agent degradation and disentangling its cause across a large controlled study spanning nine models, six open models from 1.2B to 671B parameters, and three deployed proprietary systems; four task families, including a genuinely agentic tool-use loop; five horizons; and three context regimes. Task success follows a geometric law governed by a single per-step reliability parameter, which rises with model scale but saturates well below 1 even for the strongest models, guaranteeing eventual collapse at sufficiently long horizons. The effect is sharpest on the agentic task, where every model tested, including widely deployed systems, falls from near-perfect success to near zero within sixteen steps of (n=10,664 analyzed trajectories. Degradation is driven by step count rather than context length: bounding the context window steepens decay rather than easing it (logit slope -0.69 vs. -0.44), p=3x10-6), contradicting a lost-in-the-middle explanation and warning against a common production shortcut. Projecting measured reliability onto representative benchmark horizons quantifies a substantial gap between benchmark and production conditions, from 0.42 at GAIA-length horizons to 0.24 at hundred-step production horizons. For teams responsible for agent orchestration and reliability at scale, these results argue for horizon-aware evaluation and reliability budgeting in place of aggregate pass-rate metrics. Code, prompts, seeds, and raw trajectories are released.", "category": "cs.AI", "cluster": "Long-Horizon Planning \u0026 Memory", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出并解决的核心研究问题是：LLM agents 在长周期多步骤工作流中的性能退化遵循何种数学规律，以及这种退化的根本驱动力是 agent 必须执行的步骤数量还是其必须处理的上下文长度。这个问题至关重要，因为尽管 LLM agents 在各类 benchmark 上的成功率不断攀升，但在生产环境中执行长周期、开放式工作流时却依然不可靠。这种 benchmark 表现与生产可靠性之间的鸿沟，使得负责 agent orchestration 和 incident response 的团队面临严峻挑战：系统可能通过所有离线评估，但在实际多步骤工作流中却不可预测地发生退化。通过直接测量退化的功能形态并分离其成因，该研究证明了退化遵循由 per-step reliability 决定的 geometric law，从而将生产环境中的可靠性差距从不可解释的异常转化为可预测的数学必然。这为生产环境中的 horizon-aware evaluation 和 reliability budgeting 提供了坚实的理论和实证基础，使工程团队能够根据单步可靠性科学规划任务长度，而非依赖掩盖长周期崩溃的 aggregate pass-rate metrics。\n\n### § 2 前人工作与不足\n\n这个问题之前并未得到充分解决。现有的 agent benchmarks（如 SWE-bench, WebArena, Mind2Web 等）主要报告固定任务集上的 aggregate single-attempt success，极少将成功率直接与 horizon 挂钩进行解析。这种做法之所以存在不足，是因为它们主要采样了短到中等长度的任务，恰好处于衰减曲线的平坦顶部，从而在数学上掩盖了长周期下的崩溃现象，导致 benchmark 表现无法预测生产环境中的可靠性。Kwa et al. [9] 虽然追踪了跨代模型可完成任务长度的翻倍趋势，但其关注点在于跨代演进趋势，而非在受控环境中解析单个模型随 horizon 变化的具体衰减曲线形状。评测严谨性文献（如 Kapoor et al. [10]）指出了 agent benchmarking 中的成本盲点等问题，呼吁可靠性导向的测量，但同样未将 horizon 作为主要评测轴，因为当时的评测框架缺乏在受控环境下隔离并量化多步骤依赖性退化的机制。此外，Long-context 文献（如 Liu et al. [3] 的 \"Lost in the Middle\" 和 Dziri et al. [4] 的组合推理限制研究）预测 context length 是 agentic 退化的主要驱动因素。然而，这些研究关注的是静态输入中的位置效应或组合复杂度，而非依赖性的多步骤 agent loop，因此未能预见到本文所揭示的相反结论：限制 context 反而会加剧性能衰减，真正驱动退化的是 step count 本身。Laban et al. [11] 虽然报告了多轮对话中的性能下降，但其研究局限于对话场景，未涉及真正的 agentic tool-use loop，因此无法揭示 agentic 任务中更为严重的崩溃机制。", "core_insight": "### § 3 重建作者的思考路径\n\n在正式提出实验设计之前，一个负责 production agent orchestration 的工程师或研究者必然会经历以下认知推演过程。首先，业界面临着一个普遍的痛点：LLM agents 在各种 benchmark（如 SWE-bench, WebArena）上表现优异，但在实际部署的长链条多步工作流中却不可预测地崩溃。作者注意到了一个被以往评估文献（如 Kapoor et al. 对 cost-blindness 的批判）忽视的变量——task horizon。现有 benchmark 大多只采样短到中等长度的任务，而生产环境的任务往往需要多出一个数量级的 dependent steps。\n\n基于这一观察，作者引入了基本的概率理论：如果一个任务需要 $H$ 个依赖步骤，且每步成功率为 $r$，那么整体成功率近似于 $r^H$。只要 $r$ 不等于 1，随着 $H$ 的增加，成功率必然呈几何级数坍塌。这意味着 benchmark 的高分可能仅仅是因为它们停留在衰减曲线平坦的顶部，而生产环境的崩溃是数学上的必然结果，而非偶然异常。\n\n然而，要证实这个假设，必须排除一个强大的竞争解释。现有的 long-context 文献（如“Lost in the Middle”以及关于 compositional reasoning 的研究）广泛表明，模型在长输入或多轮对话中性能会下降。因此，同行会质疑：agent 在长任务中失败，到底是因为“步骤太多导致误差级联”，还是因为“context 太长导致模型遗忘”？\n\n为了将 step count 与 context length 彻底解耦，作者需要设计一种受控的对比机制。这就自然引出了三种 context regime 的构想：natural regime（自然累积历史）、compressed regime（压缩历史以隔离 context length 的影响）和 padded regime（单轮塞入所有操作以隔离多轮交互结构的影响）。如果压缩 context 反而让性能下降得更快，就能彻底推翻“lost-in-the-middle”的传统解释，从而确立 step count 才是导致 degradation 的核心机制。此外，为了确保这种数学衰减规律不是 structured-output probe 的伪影，还必须引入一个真正具备 agentic loop（如 ReAct）的 task family 来验证其在真实工具调用场景下的普适性。\n\n### § 4 核心 Intuition\n\nLLM agent 在多步任务中的整体成功率本质上是一个概率连乘问题。只要单步可靠性（per-step reliability）未达到完美的 1，随着任务 horizon（步数）的增加，成功率必然遵循几何级数走向坍塌。这种衰减的真正驱动力是依赖步骤的累积误差，而非 context length 过长导致的信息丢失。因此，用短步数的 benchmark aggregate pass-rate 来预测长链条的生产环境表现是极其危险的，系统可靠性必须基于单步可靠性进行严格的数学预算。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《How Fast Do Agents Rot? An Empirical Study of Long-Horizon Degradation in LLM Agents for Production Decision-Making》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出并解决的核心研究问题是：LLM agents 在长周期多步骤工作流中的性能退化遵循何种数学规律，以及这种退化的根本驱动力是 agent 必须执行的步骤数量还是其必须处理的上下文长度。这个问题至关重要，因为尽管 LLM agents 在各类 benchmark 上的成功率不断攀升，但在生产环境中执行长周期、开放式工作流时却依然不可靠。这种 benchmark 表现与生产可靠性之间的鸿沟，使得负责 agent orchestration 和 incident response 的团队面临严峻挑战：系统可能通过所有离线评估，但在实际多步骤工作流中却不可预测地发生退化。通过直接测量退化的功能形态并分离其成因，该研究证明了退化遵循由 per-step reliability 决定的 geometric law，从而将生产环境中的可靠性差距从不可解释的异常转化为可预测的数学必然。这为生产环境中的 horizon-aware evaluation 和 reliability budgeting 提供了坚实的理论和实证基础，使工程团队能够根据单步可靠性科学规划任务长度，而非依赖掩盖长周期崩溃的 aggregate pass-rate metrics。 ### § 2 前人工作与不足 这个问题之前并未得到充分解决。现有的 agent benchmarks（如 SWE-bench, WebArena, Mind2Web 等）主要报告固定任务集上的 aggregate single-attempt success，极少将成功率直接与 horizon 挂钩进行解析。这种做法之所以存在不足，是因为它们主要采样了短到中等长度的任务，恰好处于衰减曲线的平坦顶部，从而在数学上掩盖了长周期下的崩溃 ng nine models, six open models from 1.2B to 671B parameters, and three deployed proprietary systems; four task families, including a genuinely agentic tool-use loo...", "additional_insights": "### § 8 Take-aways\nLLM agent 在长周期多步骤任务中的可靠性随步数呈几何级数衰减，其衰减斜率由单步可靠性参数决定。即使是最强的前沿模型，其单步可靠性也远低于1，因此在足够长的 horizon 下，任务成功率的崩溃是数学上的必然。这种衰减的真正驱动因素是 step count 而非 context length；限制 context window 反而会加剧衰减，这直接反驳了 lost-in-the-middle 假说，并警告生产环境中常见的上下文截断捷径是适得其反的。在真正的 agentic tool-use 任务中，所有测试模型（包括广泛部署的专有系统）在 16 步内成功率从近乎完美骤降至接近零。传统的 aggregate pass-rate benchmark 仅仅采样了衰减曲线平坦的顶部，掩盖了生产环境中长周期任务的可靠性危机。因此，实践者应直接在生产相关任务上测量单步可靠性，并基于此进行 reliability budgeting，而非依赖 benchmark 分数。\n\n### § 9 最脆弱的假设\n这篇论文最核心且失败代价最大的假设是：**在受控合成任务中观察到的几何级数衰减规律及其“错误作为吸收态”的机制，能够准确外推到真实世界的生产级 agent 工作流中。** 论文的核心贡献——预测 benchmark 与生产环境之间存在巨大的可靠性鸿沟——完全建立在真实部署环境也会表现出这种不可逆的复合错误机制之上。然而，在实际生产中，agent 系统通常集成了复杂的错误恢复机制（如 Reflexion 式的 verbal self-reflection）、外部状态验证器或 human-in-the-loop 干预，这些设计专门用于在错误发生后重置轨迹或修正航向。如果真实环境中的 agent 能够有效从错误中恢复，那么“吸收态”假设就不成立，几何衰减的斜率会被大幅缓解，所谓的“长 horizon 崩溃”可能只会表现为性能的轻微线性下降。论文为这一假设提供的证据仅限于其未修改的 ReAct loop 中“一旦出错很少恢复”的观察，但严重缺乏在包含错误恢复模块的真实复杂工作流中的对照实验，这使得其对生产环境的悲观预测可能被高估。\n\n### § 10 最小复现实验\n如果有一周时间，最小复现实验是验证**“在 agentic tool-use 任务中，成功率随 horizon 呈几何级数衰减，且在 16 步内崩溃”**这一核心 claim。使用 Python 构建一个简单的隐藏图遍历模拟器作为测试环境：agent 必须通过调用 `inspect_node(current_id)` 工具，沿着未知链条逐步探索，直到达到目标节点。不需要复杂的真实世界数据，只需程序化生成不同长度（H=2, 4, 8, 16）的随机链条。选取 2-3 个模型（如 GPT-4o-mini 和 Llama-3.1-8B），使用标准的 ReAct prompt 让其自主调用工具完成遍历。每个 horizon 测试 50 个轨迹，测量最终任务成功率以及每一步的准确率。如果成功率在 log-scale 图上随 H 呈线性下降，且 H=16 时成功率降至 0.2 以下，则支持论文的几何衰减与快速崩溃 claim；如果成功率在 H=16 时仍保持高位，或衰减曲线呈现平缓的线性下降而非几何骤降，则直接反驳了该 claim。", "research_value": "### § 11 最强反例设计\n我会设计一个引入“环境反馈驱动的状态重置”机制的对照实验，来直接攻击论文核心的“错误作为不可逆吸收态”假设。论文观察到的 geometric decay 极可能不是 LLM 推理的内在属性，而是其采用的 vanilla ReAct loop 缺乏环境纠错信号的产物。在真实的生产级 agent 工作流中，环境往往提供密集的验证信号（如编译器报错、API 状态码、单元测试失败）。我会构建一个包含可验证反馈的 agentic tool-use 任务（例如带有自动测试用例的代码生成与修复循环），当 agent 执行错误步骤时，环境不仅返回失败，还提供结构化的错误定位信息，允许 agent 执行回溯或 patch 操作。如果在这种带有 error-recovery 机制的 setup 下，任务成功率随 horizon 的衰减曲线从 geometric decay 转变为 sub-linear decay 甚至出现 plateau，这就直接反驳了长 horizon 崩溃是“数学必然”的结论。这证明了退化的根本驱动力并非单纯的 step count，而是“无反馈环境下的误差累积”，论文所声称的 reliability budgeting 在具备自我纠错能力的现代 agent 架构中将失去预测效力。\n\n### § 12 Follow-up Research Idea\n驱动这个想法的局限是论文将 agent 的 per-step reliability 视为一个静态常数，并假设错误是不可逆的吸收态，这完全忽略了现代 agent 系统中动态纠错与状态回滚的普遍实践。我们需要一个新的 framing：将 agent 的长周期执行建模为带有“反射壁”的随机过程，而非单向的吸收态马尔可夫链。可以借鉴控制理论中的容错系统与马尔可夫更新过程，引入“State-Dependent Error Recovery”框架，将 agent 的单步错误分为“可恢复”与“致命”两类，并量化环境反馈密度对恢复转移概率的影响。第一个实验将设计一个允许 agent 主动调用 `rollback` 或 `verify_state` 工具的 agentic loop，在不同环境反馈噪声水平下，测量 agent 从错误状态恢复到正确轨迹的转移概率矩阵。通过绘制“有效 horizon”（即考虑回滚后的净前进步数）与任务成功率的函数关系，我们可以推导出一个动态的 reliability budgeting 模型。这与现有的 Reflexion 等跨 episode 学习工作截然不同，后者关注多轮尝试间的改进，而本提议聚焦于单个长 horizon episode 内的随机动态纠错机制，旨在将 reliability 从一个静态的预测指标转化为一个可通过环境设计主动调控的系统属性。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Shubhra Mittal\", \"affiliations\": [1, 2], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Independent Researcher\"},\n    {\"id\": 2, \"name\": \"Microsoft AI\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "即使 benchmark 成功率稳步攀升，large language model (LLM) agents 在长周期、多步骤工作流上的生产部署仍然不可靠。我们认为这一差距很大程度上是 task horizon 造成的假象：benchmark 主要由短至中等长度的 horizon 主导，在这些 horizon 下成功率保持较高水平，而生产工作负载所需的依赖步骤要多出一个数量级。我们直接测量了这一效应，在一项大规模对照研究中刻画了 agent degradation 的形态并理清了其成因。该研究涵盖九个模型（包括六个参数量从 1.2B 到 671B 的 open models 和三个已部署的 proprietary systems）、四个 task families（包含一个真正的 agentic tool-use loop）、五个 horizons 以及三个 context regimes。Task success 遵循由单一 per-step reliability parameter 控制的 geometric law，该参数随 model scale 增长而上升，但即使对于最强大的模型，其饱和值也远低于 1，这保证了在足够长的 horizons 下最终必然发生崩溃。这一效应在 agentic task 上最为显著，在十六个步骤内，所有受测模型（包括广泛部署的系统）的成功率都从近乎完美跌至接近零（分析了 n=10,664 条 trajectories）。Degradation 是由 step count 而非 context length 驱动的：限制 context window 反而会加剧衰减而非缓解衰减（logit slope -0.69 vs. -0.44，p=3x10-6），这与 lost-in-the-middle 的解释相矛盾，也对常见的生产环境捷径提出了警告。将测量到的 reliability 投射到具有代表性的 benchmark horizons 上，量化了 benchmark 与生产环境条件之间的巨大差距，从 GAIA-length horizons 下的 0.42 到百步生产 horizons 下的 0.24。对于负责大规模 agent orchestration 和 reliability 的团队而言，这些结果呼吁采用 horizon-aware evaluation 和 reliability budgeting，以取代 aggregate pass-rate metrics。Code、prompts、seeds 和 raw trajectories 已开源。"}, {"title": "Agent Memory Is a Surface for Endogenous Authorization Laundering", "arxiv_id": "2609.01836", "authors": "Tommaso Cerruti, Mika Okamoto, Ansel Kaplan Erol", "summary": "Long-running LLM agents rely on persistent memory to carry state across interactions, including permissions, restrictions, and revocations. When memory misrepresents this evolving authorization state, the agent's own records can grant authority that the underlying history never permitted, resulting in misaligned behavior without any external attacks. We term this failure endogenous authorization laundering, where spurious permissions written into memory lead to unauthorized actions as their provenance is washed away. We then introduce EAL-Bench, which measures how accurately persistent memory preserves evolving authorization state and whether errors propagate to downstream unauthorized actions. We evaluate five LLMs as memory writers and two as executors across procurement, cybersecurity, and finance. We find that under incremental memory updates, writers create false authority for up to 50.2% of unauthorized requests; once false authority is present, executors act on it in 98.6% of trials. Two safeguards, requiring stored permissions to be backed by valid source events, and tracking permission changes through bounded event sourcing, substantially reduce laundering, but both also reject more legitimate actions, exposing a safety-utility tradeoff. Persistent memory is therefore not merely a performance component, but a part of an LLM agent's effective authorization policy.", "category"
