是：当 VLM 需要外部证据时，工具调用（image cropping, image search, text search）已成为标准手段，而现有训练范式几乎统一采用 outcome-centric supervision——只要最终答案正确，整条轨迹中的所有工具调用就获得同等信用。这种粗粒度奖励的直接后果是，模型学会了\"调用工具\"这一行为本身，却未学会\"为什么调用\"以及\"调用后该提取什么\"。在分析实际 rollout 时，两类失败反复出现：一是 pre-call misalignment，模型发出偏离目标的冗余调用，反复搜索同一已满足的证据目标；二是 post-acquisition failure，工具返回了关键信息，但模型的后续推理完全忽略它，仍凭空给出答案。这两类失败在 outcome-only reward 下不可区分——因为最终答案可能仍然正确，冗余调用和未被利用的证据都被掩盖了。\n\n从 RL 理论角度，这指向一个 evidence-level credit assignment 问题：终端奖励无法将信用分配到具体的工具调用步骤，也无法区分\"碰巧出现在成功轨迹中的无用调用\"与\"真正推进推理的必要调用\"。text domain 的 search agent 工作（如 Search-R1, R1-Searcher）已展示 RL 可以激励查询发出和动态知识获取，但它们主要关注\"是否搜索\"而非\"搜索是否必要、信息是否被利用\"。将这一范式扩展到 multimodal 时，问题更尖锐：视觉工具的成本更高，冗余 crop 或重复 image search 的浪费更显著，而现有方法缺乏机制来约束这种浪费。\n\n关键转折在于重新定义\"一个有用的工具调用\"的含义：它不应仅仅是轨迹中的一个动作，而必须是一个完整的 tool-evidence step——在执行前，其意图必须瞄准一个必要的证据目标；在执行后，其返回的观察必须被真正提取并整合进推理。这个双重要求自然引出一个设计：如果能为每个训练样本显式定义一条\"必要证据路径\"（即哪些证据目标是必需的、用什么工具获取、应提取什么信息），就可以在 RL 中对每次调用进行双阶段评估——pre-call goal alignment 和 post-call information acquisition——而非等到最终答案才给奖励。同时，观察到冗余调用的本质是重复访问已满足的目标，这直接启发了一个 non-repeated-goal regularizer：一旦某个证据目标已被满足，再次瞄准它的调用应被显式惩罚。这条推理链条从\"失败模式观察\"走到\"信用分配需求\"，再到\"双阶段过程奖励 + 冗余惩罚\"，最终形成 NTEP-R 的设计逻辑。\n\n### § 4 核心 Intuition\n\n现有 outcome-only reward 无法区分轨迹中的有用调用与冗余调用，因为相同答案可能对应截然不同的工具使用模式——有的精准高效，有的堆砌冗余。NTEP-R 的核心 Intuition 是：将工具监督从\"是否调用\"提升到\"每次调用是否严格推进必要证据轨迹\"，通过在调用前验证意图是否瞄准必要证据目标、调用后验证返回信息是否被真正提取，并显式惩罚重复访问已满足目标的冗余调用，迫使模型学会在证据足够时立即停止而非盲目搜索。让先前方法失效的根本原因是终端奖励对中间步骤的信用分配过于粗糙，让这个方法奏效的核心则是将\"证据必要性\"这一抽象概念转化为可验证的双阶段语义判断，从而在 RL 中实现精准的过程级信用分配。", "methodology": "§ 5 具体方法与完整 Pipeline\n\n```text\n[Image + Query]\n      |\n      v\n[NTEP Goal] \u003C--- NTEP Annotation (Goal, Tool, Info)\n      |\n      v\n[Pre-call Intent] --\u003E(+) Pre-call Alignment Reward\n      |\n      v\n[Tool Call] (crop / image search / text search)\n      |\n      v\n[Observation]\n      |\n      v\n[Extracted Info] --\u003E(+) Post-Acquisition Reward\n      |         \\\n      |          \u003E(-) Non-repeated-goal Regularizer\n      v\n[Next Step / Final Answer]\n```\n\n基于上述 Pipeline 图，该方法的核心节点与执行逻辑如下：\n\n1. **NTEP Annotation (Necessary Tool-Evidence Path)**：对于输入的 Image + Query，NTEP 标注方案将推理轨迹分解为有序的答案关键步骤序列。每个步骤显式定义了三要素：证据寻求目标、适当的工具执行以及必须从结果观察中提取的必要信息。这为过程监督提供了明确的参考基准。\n2. **Pre-call Alignment Reward**：在模型生成工具调用意图时，NTEP-R 评估该意图是否与 NTEP 中定义的必要证据目标对齐。如果对齐，则给予奖励，以此约束模型在执行前具备明确且必要的意图。\n3. **Tool Call 与 Observation**：模型根据意图调用工具（图像裁剪、图像搜索、文本检索），获取返回的 Observation。\n4. **Post-Acquisition Reward**：模型从 Observation 中总结提取信息后，NTEP-R 评估提取的信息是否与所需的必要证据对齐。如果对齐，则给予奖励，以此确保模型真正利用了获取的证据。\n5. **Non-repeated-goal Regularizer**：如果某个 NTEP 目标已被满足，模型再次发起针对该目标的冗余调用，则施加惩罚，从而避免重复访问已满足目标的浪费行为。\n6. **迭代与输出**：完成当前步骤后，模型进入下一个 NTEP Goal 继续推理，或输出最终答案。通过这种双阶段评估与冗余惩罚，将工具监督从粗粒度的“是否调用”提升为细粒度的“调用是否必要且有效”。\n\n§ 7 实验设计与结论\n\n* **提出问题**：如何为具备工具调用能力的视觉语言模型提供细粒度的过程监督，以确保每次工具调用都能有效获取并利用必要证据，从而提升推理准确性和工具使用效率？\n* **实验验证**：研究者在七个图像基础基准上进行了广泛评估，涵盖搜索导向推理和细粒度视觉感知。实验采用统一的三工具框架（图像裁剪、视觉搜索、文本检索），训练了 8B 参数的模型实例 (NTEP-8B)，并与强大的端到端和 agentic 基线进行比较。此外，通过消融研究验证了各个奖励组件的具体贡献。\n* **结论**：实验结果表明，NTEP-R 在搜索导向准确性和工具使用效率上均实现了显著提升。消融研究证实，pre-call goal alignment 和 post-call information extraction 高度互补，而 non-repeated-goal regularizer 有效强制执行了精确、选择性的工具利用。这些发现确立了鲁棒的 agentic VLMs 需要对证据获取进行细粒度过程监督，而非仅基于工具调用数量或最终答案正确性的粗略激励。", "additional_insights": "### § 8 Take-aways\n\n这篇论文的核心贡献是提出了 **NTEP-R**，一个用于训练 agentic VLM 的细粒度过程奖励框架。它解决了现有方法仅依赖最终答案正确性来监督工具使用的根本缺陷，即模型可能发出冗余或偏离目标的工具调用，即使调用了正确工具也可能无法提取所需信息。\n\nNTEP-R 的关键创新在于引入了 **NTEP（Necessary Tool-Evidence Path）**，这是一种显式的标注方案，为每个训练样本定义了必要的证据目标、对应的工具调用以及必须从返回结果中提取的关键信息。这相当于为每个问题绘制了一张“证据获取路线图”。\n\n基于 NTEP，NTEP-R 提供了双阶段的过程监督：**预调用目标对齐奖励**，检查模型在调用工具前的意图是否指向必要的证据目标；**后调用信息获取奖励**，检查模型是否成功从工具返回的观察中提取了所需信息。此外，**非重复目标正则化器** 明确惩罚那些重复访问已满足的 NTEP 目标的冗余调用。\n\n实验在七个图像基准上验证了 NTEP-R 的有效性。在统一的三工具框架下，**NTEP-8B** 在搜索导向准确率和工具使用效率上均显著优于强基线，包括 SenseNova-MARS-8B。具体来说，NTEP-8B 在搜索平均准确率上提升 2.43 个百分点，同时将平均工具调用次数从 2.54 次降至 1.89 次。\n\n消融实验揭示了每个奖励组件的互补性：仅有目标对齐奖励会导致模型陷入“饱和式调用”模式，平均调用次数飙升至 5.36 次，而准确率反而下降。完整的 NTEP-R 则将调用次数降至 1.55 次，同时保持高准确率。这证明，仅靠最终答案奖励无法区分有效和无效的工具调用。\n\n一个特别有说服力的发现是 **跨工具 OOD 迁移** 能力。仅用搜索工具训练的 NTEP-8B，在评估时引入从未见过的 zoom 工具后，视觉平均准确率从 75.01% 提升至 82.32%，同时调用次数下降。这表明 NTEP-R 学习的是抽象的“证据获取策略”，而非死记硬背特定工具的使用模式。\n\n### § 9 最脆弱的假设\n\nNTEP-R 最脆弱的假设是：**由教师模型蒸馏出的 NTEP 路径是正确且完整的**。整个奖励机制的有效性完全建立在“每个训练样本的必要证据目标、对应工具和所需信息都被准确识别”这一前提之上。如果这个假设不成立，NTEP-R 的奖励信号就会从根本上出错，导致模型被引导去追求错误的目标或忽略真正关键的信息。\n\n这个假设在实际中可能不成立的原因有两点。第一，**教师模型本身可能犯错**。论文使用 Gemini-3.1-Pro 作为教师来蒸馏 NTEP 路径，但即使是更强的模型，在面对需要复杂推理或罕见知识的查询时，也可能错误地识别“必要”证据。例如，一个问题可能有两种完全不同的解决路径，教师模型可能只识别了其中一条，而忽略了另一条同样有效甚至更优的路径。第二，**“必要”证据的定义具有主观性**。对于某些开放性问题，什么是“必要”的证据可能没有唯一答案。教师模型蒸馏出的路径可能只是众多合理路径中的一种，而 NTEP-R 的奖励机制会惩罚那些偏离这条特定路径但同样有效的工具调用，从而限制了模型的探索空间。\n\n论文为这个假设提供了部分证据：通过人类审计验证了判断器（judge）的可靠性（97% 一致率，Cohen's κ = 0.94），但这主要验证了“判断器能否正确评估模型行为是否与 NTEP 对齐”，而非“NTEP 本身是否正确”。论文没有系统性地评估 NTEP 路径的质量，例如，没有报告教师模型蒸馏路径的成功率，也没有分析当 NTEP 路径存在错误或遗漏时，模型行为会如何退化。这个假设一旦失败，核心贡献会直接失效，因为整个奖励信号都建立在错误的“路线图”之上。\n\n### § 10 最小复现实验\n\n如果只有 1 周时间，我会设计一个实验来验证 NTEP-R 最独特且可分离的贡献：**非重复目标正则化器** 能否有效减少冗余工具调用，而不会损害最终答案的准确率。\n\n**数据**：使用一个简单的合成问答数据集。例如，从 Wikipedia 收集 500 个事实性问题，每个问题对应一个唯一的事实（如“爱因斯坦的出生年份是？”）。为每个问题准备一个包含该事实的文本段落作为“工具返回结果”。这样，模型只需要调用一次 text_search_tool 就能获得答案。\n\n**实现**：基于一个开源的 7B VLM（如 Qwen2-VL-7B-Instruct）构建一个极简的 agentic 框架，只包含一个 text_search_tool。实现两个版本的奖励函数：\n1.  **NTEP-R 完整版**：包含预调用目标对齐、后调用信息获取和非重复目标正则化器。\n2.  **NTEP-R 无正则化器版**：移除非重复目标正则化器，仅保留前两个奖励组件。\n\n使用 GRPO 对这两个版本进行微调，训练数据为 400 个问题，保留 100 个用于测试。训练 50 个 GRPO 步骤。\n\n**测量**：在测试集上测量两个关键指标：\n1.  **准确率**：最终答案的正确率。\n2.  **平均工具调用次数**：每个问题平均调用的 text_search_tool 次数。\n3.  **冗余调用率**：在已获得正确答案所需信息后，仍然继续调用工具的比例。\n\n**结果解读**：\n-   **支持 NTEP-R 的 claim**：如果完整版相比无正则化器版，在准确率持平或略有提升的情况下，平均工具调用次数和冗余调用率显著下降（例如，调用次数从 2.5 次降至 1.2 次，冗余率从 30% 降至 5%），则证明非重复目标正则化器是有效的。\n-   **反驳 NTEP-R 的 claim**：如果两个版本在调用次数和准确率上没有显著差异，或者完整版的准确率显著下降（例如，模型因为害怕被惩罚而不敢进行必要的重试），则说明该正则化器要么无效，要么过于激进，损害了模型性能。\n\n这个实验不需要复现完整的 NTEP 路径蒸馏流程，而是直接验证其奖励设计中一个关键组件的效果，成本低且结论清晰。", "research_value": "### § 11 最强反例设计\n\n如果我反对这篇论文，我会设计一个**多路径依赖的开放性视觉推理任务**来攻击其核心假设：即教师模型蒸馏出的 NTEP 是唯一且必要的推理路径。这个反例实验旨在证明，NTEP-R 的显式路径监督实际上是一种**过拟合教师模型推理捷径**的机制，它在抑制模型探索更优或同等有效替代路径的能力。具体而言，我会构建一个包含 500 个复杂视觉查询的数据集（如医学影像诊断或多实体关系推理），其中每个问题都存在至少两条完全不同的有效证据获取路径（例如：路径 A 先 zoom 局部再 text search 疾病名称；路径 B 先 image search 整体病灶特征再 zoom 确认边界）。在训练阶段，教师模型（Gemini-3.1-Pro）只为每个样本蒸馏出一条 NTEP 路径（如路径 A）。在评估阶段，我会在环境中引入扰动，例如人为禁用路径 A 中的某个关键工具，或增加该工具的调用延迟，迫使模型必须采用路径 B 才能得出正确答案。我的预期结果是，相比于仅使用 outcome-centric reward 的 RL baseline，经过 NTEP-R 训练的模型在面临工具扰动时，准确率会出现断崖式下跌，且工具调用次数激增。这是因为 NTEP-R 的 non-repeated-goal regularizer 和 pre-call intent alignment reward 会强烈惩罚偏离 NTEP 路径的探索行为，导致模型陷入了“路径依赖的脆弱性”。这个反例直接挑战了论文声称的“NTEP-R 学习了抽象的证据获取策略”这一结论，提出替代解释：NTEP-R 的性能提升仅仅是因为模型在标准基准测试（通常具有单一解题路径）上 memorize 了教师模型的特定工具调用模式，而非真正掌握了鲁棒的推理能力。\n\n### § 12 Follow-up Research Idea\n\n基于对方法核心局限的理解，我提出一个非增量的 novel research idea：**基于反事实推理的因果充分性奖励**。这个想法由 NTEP-R 的核心局限驱动：依赖教师模型蒸馏的静态“必要路径”不仅成本高昂，且在开放性任务中假设了“唯一正确路径”，这从根本上限制了 agent 的探索空间并引入了教师模型的偏见。我们需要一种不依赖外部预设路线图的内生监督信号，来动态评估每次工具调用对最终推理的真实因果贡献。这可以借鉴因果推断领域的**干预与反事实评估**方法，将工具调用视为对推理状态的干预，通过比较事实轨迹与反事实轨迹来计算单次调用的因果效应。具体而言，不再显式标注 NTEP，而是在模型生成一条成功的推理轨迹后，随机选择其中的一个工具调用节点，将其返回的 observation 替换为空集或随机噪声（即反事实干预），然后让模型基于这个被篡改的轨迹继续生成最终答案。如果最终答案因此变得错误，说明该工具调用具有高因果充分性，给予正向奖励；如果答案保持不变，则说明该调用是冗余的，给予惩罚。第一个实验大概长这样：在一个多跳视觉问答基准上，使用相同的 7B VLM 基座，对比 NTEP-R 和因果充分性奖励（CSR）。关键评测指标除了准确率和工具调用次数外，重点考察**路径多样性**和**扰动鲁棒性**。我预期 CSR 能够在保持与 NTEP-R 相当的准确率和调用效率的同时，在路径多样性指标上显著优于 NTEP-R，并且在面临工具故障时表现出更强的退化韧性。这个提议与已有工作的根本区别在于，它将过程监督的范式从“对齐预设的专家轨迹”转变为“评估干预的因果效应”，彻底摆脱了对完美教师标注的依赖，为训练真正具备自主探索能力的 agentic VLM 打开了新的方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "{\n  \"authors\": [\n    {\"name\": \"Xingming Long\", \"affiliations\": [3], \"markers\": [\"*\"]},\n    {\"name\": \"Yu Liu\", \"affiliations\": [1, 3], \"markers\": [\"*\", \"†\"]},\n    {\"name\": \"Zhiwei Yang\", \"affiliations\": [1, 3], \"markers\": [\"*\"]},\n    {\"name\": \"Hanqi Feng\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Shaojie Zhang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Barnabas Poczos\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Chao Jiang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Zhenbo Luo\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Lei Jiang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Pei Fu\", \"affiliations\": [3], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"IIE, CAS\"},\n    {\"id\": 2, \"name\": \"CMU\"},\n    {\"id\": 3, \"name\": \"MiLM Plus, Xiaomi Inc.\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"These authors contributed equally.\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author.\"}\n  ]\n}", "summary_translation": "现代 vision-language models (VLMs) 能够直接回答许多基于图像的问题，但它们在处理需要细粒度视觉细节或外部知识的复杂查询时往往显得力不从心。为了获取这些缺失的证据，agentic VLMs 会调用诸如 image cropping、image search 和 text search 等工具。然而，现有的训练范式主要基于最终答案的正确性来评估 tool-use，导致证据的获取和利用缺乏充分的监督。这导致了两个关键缺陷：(i) 模型经常发出冗余或偏离目标的 tool calls，无法收集必要的证据，以及 (ii) 即使调用了合适的工具，模型也常常无法从产生的观察结果中提取必要的信息。为了解决这些局限性，我们引入了 NTEP (Necessary Tool-Evidence Path)，这是一种新颖的标注方案，明确为每个查询指定了必不可少的外部证据及相应的 tool calls。在此基础上，我们提出了 NTEP-R (NTEP Reward)，这是一种监督机制，确保每次 tool invocation 都严格推进推理过程以趋向最终解决方案。具体而言，我们的方法对 agent 进行奖励，要求其将 pre-call intent 与必要的证据寻找目标对齐，并确保从 post-call observation 中总结出的信息与必要证据对齐。此外，我们引入了 non-repeated-goal regularizer，以惩罚那些重复访问已满足的 NTEP goals 的冗余调用。在七个 image-grounded benchmarks 上的广泛评估表明，我们的 8B-parameter instantiation NTEP-8B 在统一的三工具框架内显著提高了 search-oriented accuracy 和 tool-use efficiency。这些结果突显了细粒度的 tool-evidence path supervision 在训练鲁棒的 agentic VLMs 中的关键价值。"}]}, {"name": "Terminal Agent Environments", "count": 2, "papers": [{"title": "Terminal-Universe: Turning Agent Trajectories into Scalable Terminal Environments", "arxiv_id": "2609.04148", "authors": "Jie Wu, Zhenru Zhang, Beichen Zhang, Xuwu Wang, Yuhui Su, Mouxiang Chen, Peng Wang, Zhihai Wang, Que Shen, Hao Zhou, An Yang, Fei Huang, Yujiu Yang, Dayiheng Liu", "summary": "As terminal-based code agents become prevalent, agent trajectories have accumulated at scale, while realistic, executable environments remain scarce. However, environments are what agent post-training actually requires: each can be re-queried into many verifiable tasks and provides execution feedback, whereas a trajectory is a single frozen demonstration. Rather than generating environments from scratch, we observe that the tool-execution history in existing trajectories exposes the structure and contents of the environments in which they ran, making it possible to reconstruct those environments from the trajectories themselves. Thus, we introduce Terminal-Universe, a framework which turns each trajectory into a reusable environment and explores it for synthesizing new tasks and continued interactions. Specifically, Terminal-Universe replays the file operations recorded in a trajectory to restore each file before the agent modified it, yielding a partial workspace; a completion agent then supplies the missing files and dependencies. On this recovered workspace, we both reconstruct the original intent task and synthesize entirely new ones. Besides, we also scale the tasks along two complementary axes: breadth and depth. For breadth, we mine directional dependency relations between related environments and synthesize cross-workspace queries spanning multiple codebases, as developers routinely do in real-world development. For depth, we extend the initial single-turn query into a multi-round session that captures iterative user feedback and requirement refinement via a user agent. Applied to public terminal agent trajectories, Terminal-Universe produces 37.3k task-sufficient environments. Supervised fine-tuning of Qwen3.5-27B on this corpus improves single-round performance on Terminal-Bench 2.1 by 11.9 points and multi-round performance on EvoCode-Bench v2 MT@4 by 13.8 points.", "category": "cs.CL", "cluster": "Terminal Agent Environments", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是提出了 Terminal-Universe 框架，将现有的智能体轨迹转化为可重用的、可执行的终端环境，并利用这些环境合成新任务和持续交互，以支持智能体的后训练和微调。这直接符合筛选标准中第一步的“保留”规则：论文研究了 agent 的 execution environment / continual harness，并且其核心贡献是通过轨迹、反馈和观测结果来改进智能体的训练和演化。此外，论文明确以 terminal-based code agents 为研究对象，涉及 agent training/distillation，属于 Agentic AI 的前沿研究。论文不涉及安全、多模态、图技术或多智能体拓扑编排等排除项。因此，该论文与构建、改进和训练 LLM 智能体的研究目标高度相关。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的研究问题是如何从已有的 agent trajectories 中重建可复用的 executable environments，并利用这些环境合成新的 tasks 和持续的交互，以解决 terminal-based code agents 训练中真实可执行环境稀缺的瓶颈。随着 terminal-based code agents 的普及，积累了海量的 agent trajectories，但与之形成鲜明对比的是，真实、可执行的环境却极为稀缺。对于 agent post-training 而言，环境远比 trajectory 更有价值：同一个环境可以被反复查询以生成大量可验证的 tasks，并提供真实的 execution feedback，而一条 trajectory 仅仅是某个 policy model 在特定时刻产生的一次性、固定的 demonstration，其质量受限于该模型的能力，且无法验证其对 codebase 的修改是否正确。现有的 expert-authored benchmarks（如 Terminal-Bench）虽然通过为每个 task 配备 custom container、instruction 和 executable verifier 实现了高可靠性，但这种可靠性完全依赖人工构建，无法满足 post-training 对大规模环境的迫切需求。因此，如何在训练规模上提供真实且可验证的环境，成为了一个关键挑战。Terminal-Universe 通过将历史 trajectory 转化为可复用的环境，不仅盘活了已有的海量数据资源，还通过 breadth 和 depth 两个维度的 task 扩展，显著提升了 agent 在单轮和多轮场景下的性能，为 grounded agent training data 的合成提供了一种可扩展的新范式。\n\n### § 2 前人工作与不足\n\n在 Terminal-Universe 之前，扩展 executable environments 主要有三条路径，但各自存在根本性局限。**Repository-based methods**（如 SWE-Gym 和 R2E-Gym）从真实 repository 的 git history 中构建 tasks，通过 git 回滚到 bug 修复前的状态作为环境，复用原始 bug report 作为 task，并利用随修复提交的 tests 进行验证。然而，这种方法受限于真实 repository 的历史记录和可注入的 bug 类型，且生成的所有 tasks 都是 repair tasks，范围狭窄。**Perturbation methods**（如 SWE-smith 和 CLI-Gym）在通过测试的 repository 中注入 bug 使部分 tests 失败，再要求 agent 修复。虽然少数 repository 能产出大量 tasks，但同样局限于 repair tasks，且 task 的多样性受限于源 repository 和可注入 bug 的种类。**Task-conditioned synthesis**（如 Endless Term.、TMax、CLI-Universe 和 SkillSynth）则根据 categories、skill taxonomies 或 skill graphs 从头联合生成 task 和 environment。这类方法虽然能控制覆盖率和 task-environment alignment，但由于环境不与任何真实项目绑定，其真实性完全依赖于 generator 的能力，往往只能生成小而整洁的 workspace，而非真实的代码库。此外，虽然已有研究关注 interactive 和 multi-round agents（如 InterCode、SWE-INTERACT、SWETogether 和 EvoCode-Bench v2），但它们主要聚焦于多轮交互的评测或模拟，并未从 trajectory 重建环境的角度解决训练数据规模化的问题。这些前人工作的共同盲点在于：它们要么依赖现有的环境作为起点，要么将环境构建与从头生成的 task 耦合，却忽略了 trajectories 本身作为环境观测资源的潜力。实际上，trajectory 中记录的 tool calls 已经暴露了其运行环境的结构和内容——例如 `Read` 展示文件内容，`Write` 和 `Edit` 展示 workspace 的变化——这足以重建原始 workspace 的可执行副本。Terminal-Universe 正是抓住了这一被忽视的观察，通过 deterministic replay 和 agentic completion 两阶段重建，将 trajectory 从固定的 demonstration 转化为可复用的环境，从而绕过了从头构建环境或依赖特定 repository 历史的限制。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Terminal-Universe 提出之前，code agent 的 post-training 面临一个核心矛盾：真实且可验证的执行环境极其稀缺，而 agent trajectories 却在大量积累。研究者们深知，环境比 trajectory 更有价值，因为环境可以被反复查询以生成新的可验证任务，而 trajectory 只是一次固定的、且可能包含错误的演示。为了扩大环境规模，前人尝试了三种路径：从真实仓库的 git 历史中提取环境、向正常工作的代码库注入 bug、或者根据抽象规则从头合成任务与环境。然而，这些方法要么受限于真实仓库的 bug 类型，要么生成的环境过于“干净”而缺乏真实工程的复杂性。与此同时，直接使用海量 trajectories 进行 Supervised Fine-Tuning (SFT) 的效果也遭遇瓶颈，因为 policy model 的能力上限直接锁死了 trajectory 的质量，且无法验证其代码修改的正确性。面对这一困境，一个自然的观察浮现出来：trajectory 并非仅仅是文本记录，它内部的 tool-execution history（如 Read、Write、Edit 操作）实际上隐式地暴露了其运行环境的文件结构与内容。如果能够逆向利用这些操作记录，在 agent 修改文件之前恢复其状态，就有可能从现成的 trajectory 中“逆向工程”出可执行的工作区。尽管这种回放只能得到部分工作区，但可以借助 LLM agent 自动补全缺失的依赖文件。一旦环境被成功重建，研究者就可以摆脱原始 trajectory 的质量束缚，利用更强的 teacher model 在重建的环境中重新求解任务，并通过自动生成的 verifier 进行严格验证，从而将不可靠的固定演示转化为高质量、可扩展的训练数据源。\n\n### § 4 核心 Intuition\n\nTrajectory 和 environment 本质上是同一个执行过程的两个视角。现有工作是从 environment 推演出 trajectory，而这篇论文的核心 Intuition 在于逆转这一映射：利用 trajectory 中记录的文件操作历史来重建其原始的执行环境。因为 agent 的 tool calls 已经暴露了工作区的结构与内容，通过回放这些操作并补全缺失的上下文，就能将一次性的固定演示转化为可重用、可验证的执行环境，从而支持更强模型的重新求解与多样化新任务的合成。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Terminal-Universe: Turning Agent Trajectories into Scalable Terminal Environments》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\
