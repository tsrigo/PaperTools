etriever 脱离 agent 的理解能力。核心 Intuition 在于：frozen LLM 在处理任务时的 forward pass 中，其中间层 hidden states 已经隐含了对所需 skill 的判断信号，只是与预测下一个 token 的信息纠缠而无法直接读取。通过在模型语义压缩最彻底的中间层嫁接一个轻量级的、对比学习的线性映射头，就能将这个 native routing signal 提取出来，从而在不污染 context、不依赖外部模型的情况下，让 agent 用自身的能力为自己导航。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Skill Library]                                      [Task Context]\n      |                                                     |\n[Install: 1 fwd pass]                          [Frozen LLM decode]\n      |                                                     |\n[Mid-layer ℓ* states]                         [Mid-layer ℓ* states]\n      | (Ws)                                     (Wq) |\n[Key Bank] --(ε-cover)--\u003E [Compressed Bank]           [Query]\n                                    |                    |\n                                    +--------------------+\n                                    | (late-interaction) |\n                                 [Glance: Vote top-k] ---+--\u003E [Shortlist]\n                                    | (g)                |\n                  +-----------------+                    |\n                  |          [Verdict: resume fwd pass]   |\n                  |               [Skill + Task]          |\n                  |                 /      \\              |\n                  |          (L) Likelihood  Judgment (V) |\n                  |                \\      /               |\n                  +-------------------+-------------------+\n                                      |\n                         [Ruling: Product of Experts]\n                                      |\n                              [Selected Skill]\n```\n\nGavel 的完整 pipeline 分为安装、训练和推理三个阶段，核心在于从 frozen LLM 的 forward pass 中提取 routing signal，无需将 skill text 放入 context。\n\n1. **Skill Installation (推理准备阶段，对应 § 3.2, § 3.3)**：输入为 skill document。操作上，通过 frozen LLM 对每个 skill 进行一次 forward pass，提取中间层 $\\ell^*$ 的 hidden states，并通过 key map $W_s$ 映射为 key。随后使用 farthest-first traversal 将这些 key 压缩为 $\\varepsilon$-cover，构建 compressed key bank。输出为每个 skill 的 compressed key bank，这一过程无需训练。\n\n2. **Training (训练阶段，对应 § 3.2, § 3.3, Appendix C)**：输入为 task-skill pairs (SkillRet)。操作上，训练 query map $W_q$ 和 key map $W_s$，使用 multi-positive contrastive loss (InfoNCE)。梯度在 hidden states 处截断，LLM 保持 frozen。压缩后微调 $W_q$。输出为训练好的 $W_q$ 和 $W_s$，参数量仅 7.9M。\n\n3. **Glance (推理阶段，对应 § 3.2)**：输入为 task context 和 compressed key banks。操作上，提取 task token 在中间层 $\\ell^*$ 的 hidden states，通过 $W_q$ 映射为 query。每个 task token 与所有 skill 的 key bank 进行 max-similarity 匹配，投票给 top-k skills，加权求和得到 glance score $g$。输出为 glance score $g$ 和 shortlist。\n\n4. **Verdict (推理阶段，对应 § 3.4)**：输入为 shortlist 中的 skills 和 task context。操作上，恢复 skill 的 installation forward pass，将 task 追加其后。读取两个信号：task 的 mean log-likelihood $L$ (generative) 和 yes/no judgment 的 log-odds $V$ (discriminative)。输出为 likelihood $L$ 和 judgment $V$。\n\n5. **Ruling (推理阶段，对应 § 3.5)**：输入为 $g, L, V$。操作上，将三者视为对同一 log posterior $\\log p(s|x)$ 的不同估计，通过 product of experts 融合 $S = g + \\alpha L + \\gamma V$。输出为最终得分 $S$，选择得分最高的 skill。\n\n### § 6 核心数学推导\n\n论文的核心数学推导主要集中在三个信号的统一以及 key bank 压缩的理论保证上。\n\n**1. 三个信号的统一：Product of Experts (对应 § 3.5)**\n\nGavel 的三个信号 $g$ (glance), $L$ (likelihood), $V$ (judgment) 本质上都是对同一个 log posterior $\\log p(s|x)$ 的估计，但估计方式不同。\n- **Glance score $g$**：通过 contrastive learning 训练得到。最小化 InfoNCE loss 的 score 实际上是在估计 log posterior $\\log p(s|x)$ 与负采样分布 $\\log p_{neg}(s)$ 的比值。因此 $g$ 是一种 contrastive 估计。\n- **Likelihood $L$**：计算在给定 skill 的条件下生成 task 的对数似然 $\\log p(x|s)$。根据 Bayes' rule，$\\log p(s|x) = \\log p(x|s) + \\log p(s) - \\log p(x)$。在 uniform prior 下，$\\log p(s)$ 是常数，因此 $L$ 是一种 generative 估计。\n- **Judgment $V$**：直接询问模型该 skill 是否适用于该 task，得到的是 discriminative 估计。\n\n既然三者都是对同一目标的估计，Product of Experts 提供了自然的融合方式：在概率空间相乘等价于在 log 空间相加。公式 $S = g + \\alpha L + \\gamma V$ 中的 $\\alpha, \\gamma$ 是 exchange rates，用于将 $L$ 和 $V$ 的尺度对齐到 $g$，同时起到 tempering 作用，防止某个过于自信的 expert 主导结果。\n\n**2. Key Bank 压缩的 Distortion Bound (Proposition 1, 对应 § 3.3, Appendix D)**\n\n为了压缩 key bank，Gavel 保留一个子集 $C_s$，使得被丢弃的 key 都在保留 key 的 $\\varepsilon$ 距离内。Proposition 1 证明了压缩后的 max similarity score 最多比压缩前小 $\\varepsilon$，且不会膨胀。\n\n**Intuition**：假设原始 bank 中与 query $q$ 内积最大的 key 是 $d^*$，压缩后覆盖 $d^*$ 的保留 key 是 $c$，即 $\\|d^* - c\\| \\le \\varepsilon$。根据 Cauchy-Schwarz 不等式，$\\langle q, c \\rangle \\ge \\langle q, d^* \\rangle - \\|q\\| \\|c - d^*\\| \\ge \\langle q, d^* \\rangle - \\varepsilon$（因为 $q$ 是单位向量）。这意味着压缩后的 score 有下界保证，且误差可控。\n\n### § 7 实验设计与结论\n\n**问题 1：Gavel 在 written tasks 上的 routing 准确率是否优于现有方法？**\n**实验**：在 SkillRet, SRA-Bench, Eval-Core 三个公开 benchmark 上评测 Hit@1，与 progressive disclosure 和 retrieve-and-rerank (如 Qwen3-Emb-8B + Qwen3-Reranker-8B) 对比。使用 adjudicated Hit@1 (GPT-5.6 作为 judge) 解决 under-annotation 问题。\n**答案**：Gavel 在所有三个 benchmark 上均领先，超过添加了 1.2B-16B 外部参数的 pipeline，且 glance 阶段单独表现也很强。\n\n**问题 2：Gavel 在 mid-rollout (多轮对话中需求突然出现) 场景下表现如何？**\n**实验**：构建 SkillTraj benchmark，包含 372 个模拟 agent trajectories，分为四种场景。评测 Gavel 与其他 pipeline 在 routing point 的表现。\n**答案**：Gavel 在所有四种场景下均领先 8.6 到 21.9 个点。外部 retriever 难以处理 noisy context，而 Gavel 直接读取 agent 内部 forward pass 的状态。\n\n**问题 3：Gavel 在 end-to-end deployment 中是否有效？**\n**实验**：集成到 mini-swe-agent 中，在 Skill-Use benchmark 上测试 trigger rate。训练一个简单的 gate 来决定何时触发 routing。\n**答案**：Qwen3-32B + Gavel 达到 90.9% 的 trigger rate，超过所有在 Codex 中的 open frontier models，也超过 retrieve-and-rerank pipelines。\n\n**问题 4：Gavel 的性能是否随 backbone 能力提升而提升？**\n**实验**：在 SRA-Bench 上使用不同大小和代际的 Qwen backbone 测试 Gavel 和 progressive disclosure。\n**答案**：Gavel 的性能随 backbone 增长而提升，且 0.6B 的 Gavel 已经超过 32B 的 progressive disclosure。", "additional_insights": "### § 8 Take-aways\n本文提出了 Gavel，一种从 frozen LLM 自身 forward passes 中提取 skill routing 信号的方法，避免了现有 progressive disclosure 将 metadata 塞入 context 导致的注意力分散，也避免了 retrieve-and-rerank 引入外部模型而切断 agent 自身判断能力的弊端。Gavel 的核心在于仅训练两个 linear projections（query map 和 key map，共 7.9M 参数）：在 \"glance\" 阶段，利用 mid-layer hidden states 进行 token-level late-interaction 匹配，对整个 skill library 进行粗筛；在 \"verdict\" 阶段，对 shortlist 恢复 forward pass，读取 model 自身的 task likelihood 和 yes/no judgment，最后通过 product of experts 融合三者的打分。为降低存储开销，skill bank 在安装时通过 farthest-first traversal 压缩为 $\\varepsilon$-cover，且在数学上证明了其 score distortion 的上界。实验表明，在 Qwen3-32B 上仅训练一次的 Gavel，在三个公开 benchmark 和本文新建的 SkillTraj（模拟 mid-rollout 路由）上，超越了带有 1.2B 至 16B 外部参数的 pipeline，且 routing accuracy 随 backbone 能力提升而自然提升。在端到端部署的 bash-agent 中，32B 模型配合 Gavel 的 skill 触发率甚至高于运行在 Codex 中的远大 frontier models。\n\n### § 9 最脆弱的假设\nGavel 最核心且失败代价最大的假设是：**frozen LLM 的 mid-layer hidden states 中已经包含了足够丰富且可被线性映射（linear projections）提取的 skill routing 信号**。如果这个假设不成立，即 hidden states 中的 routing 信号与 next-token prediction 的特征深度纠缠以至于线性层无法解耦，那么整个 glance 阶段将退化为随机猜测，后续的 verdict 和 product of experts 也就失去了基础。\n在实际中，这个假设可能不成立的原因在于：LLM 的训练目标是 next-token prediction，并未显式优化其内部表征用于区分“当前任务需要调用哪个外部技能”。特别是当任务需求隐晦（如 mid-rollout 中需要根据 tool evidence 推断），或者 skill 之间的区别在于细微的操作步骤而非宏观主题时，线性可分性可能被破坏。论文为这个假设提供的证据主要是经验性的：Appendix A 展示了 native attention keys 信号太弱，而加上 trained linear maps 后信号变得可用；Appendix B 通过 matrix entropy 验证了在 compression valley 层（约 70% 深度）线性可读性最强。然而，论文缺少在极度跨域或高度专业化的长尾 skill library 上的验证，无法证明这种线性可分性在所有真实复杂场景下都能保持。\n\n### § 10 最小复现实验\n如果有一周时间，最小复现实验应聚焦于验证“**frozen LLM 的 mid-layer states 通过线性映射能提供比现成 dense retriever 更好的 routing 信号**”这一核心 claim。\n**数据**：使用 SkillRet 的公开测试集，截取 500 个 query 和 2000 个 skill 构建一个小型 library。\n**实现**：加载一个中等规模 frozen LLM（如 Qwen3-8B）。提取 query 和 skill 在 mid-layer（如 70% 深度处）的 hidden states。在 SkillRet 训练集中随机抽取 5000 对 query-skill，使用 InfoNCE loss 训练两个简单的线性层（$W_q, W_s$）。在测试时，仅运行 glance 阶段：计算 query token 和 skill token 的 max-similarity 并聚合打分，对 2000 个 skill 排序。\n**测量**：测量该 glance 模块的 Hit@1 和 Recall@10，并与直接使用 Qwen3-Embedding-8B 计算 query 与 skill body 的 cosine similarity 基线进行对比。\n**结果判定**：如果线性映射的 glance 模块在 Hit@1 和 Recall@10 上达到或超过 Qwen3-Embedding-8B 基线，则支持论文的 claim，证明 frozen LLM 内部确实存在可线性提取的强 routing 信号；如果显著低于 embedding 基线，则反驳了该假设，说明脱离了 verdict 阶段的生成式打分，单靠 mid-layer 线性映射不足以支撑有效路由。", "research_value": "### § 11 最强反例设计\n\n要对 Gavel 构成最致命的打击，我会设计一个**“语义解耦的操作性路由”**实验，旨在证明 Gavel 的成功仅仅是因为它充当了一个高度高效的内部 dense retriever，而非真正利用了 agent 对任务与 skill 之间深层逻辑的理解。Gavel 的核心假设是 frozen LLM 的 mid-layer hidden states 已经编码了 skill routing 信号，但这依赖于 LLM 在 pre-training 阶段积累的语义关联。如果正确的 skill 与当前任务在文本语义上完全无关，且其必要性仅存在于多步工具调用后的操作逻辑中，Gavel 将可预测地失败。具体而言，我会构建一个 adversarial skill library，其中每个 skill 的 `SKILL.md` 文档被重写为高度抽象且与目标任务零语义重叠的纯过程性脚本。例如，任务目标是“修复内存泄漏”，但正确的 skill 是一个名为“重启服务 X”的脚本，其文档仅包含重启特定微服务的 bash 命令，完全不提及“内存”或“泄漏”。在这个库中，我会设置大量语义干扰项，例如包含“内存管理”或“垃圾回收”等关键词的错误 skills。在 SkillTraj benchmark 的 mid-rollout 场景下运行此实验，任务上下文中仅包含 OOM (Out of Memory) 的报错日志。由于 frozen LLM 的 mid-layer states 主要捕获 token 级别的语义聚类，其 hidden states 在面对“OOM 报错”时，会不可避免地向包含“内存”语义的干扰项 skill 偏移。即使经过 InfoNCE 训练的 linear projections $W_q$ 和 $W_s$ 能够优化路由，它们也无法跨越 frozen weights 中根本不存在的操作因果链。这将导致 Glance 阶段的 max-similarity 打分将语义干扰项排入 shortlist，而在 Verdict 阶段，由于 frozen LLM 缺乏“重启服务能释放内存”的内在因果推理，其计算出的 task likelihood $L$ 和 yes/no judgment $V$ 也会对正确 skill 给出低分。这个反例不仅会导致 Gavel 的 Hit@1 显著低于能够捕捉长文本因果关系的 retrieve-and-rerank pipeline（假设 reranker 具备足够的推理能力），更从根本上反驳了论文的 core claim：它证明了 Gavel 读取的并非“agent 对任务与 skill 关系的深层理解”，而仅仅是 frozen LLM 表层的 semantic proximity，一旦 skill 的实用性脱离了 pre-training 数据的语义分布，linear projection 便无法提取有效的 routing signal。\n\n### § 12 Follow-up Research Idea\n\n基于 Gavel 依赖 frozen LLM 内在表征的局限，我提出一个全新的研究方向：**Latent Skill Emulation via Representation Engineering**。这个想法的驱动力在于：无论是 progressive disclosure（将 skill 文本塞入 context）还是 Gavel（从 hidden states 中提取路由信号后仍需将 `SKILL.md` 载入 context），都默认 skill 是一种“外部文档”，agent 必须通过阅读它来执行。然而，如果 frozen LLM 的 hidden states 中确实存在某种与 skill 相关的子空间，我们完全可以跳过“阅读文档”这一步，直接在模型内部模拟 skill 的执行。这里可以借鉴 Mechanistic Interpretability 和 Representation Engineering (RepE) 领域的方法。我们不训练用于路由的 linear projection，而是训练一个 lightweight hypernetwork，它以 `SKILL.md` 文档作为输入，输出一个作用于 mid-layer residual stream 的 steering vector。在推理时，当检测到任务需求（可以通过一个简单的 gate），我们直接将对应 skill 的 steering vector 注入 frozen LLM 的 forward pass 中，从而在参数层面“激活”该 skill 的能力，使 LLM 的后续生成行为表现得如同它已经阅读了该 skill，而 context window 中始终保持绝对干净。第一个实验将聚焦于程序性 skill 的内化：选取一组用于操作特定 API 的 skills，使用对比学习训练 hypernetwork 生成 steering vectors，使得注入该 vector 后，frozen LLM 在 zero-shot 下生成正确 API 调用格式的准确率，等同于或高于将完整 `SKILL.md` 放入 context 的 baseline。这个提议与 Gavel 及现有工作的根本区别在于：Gavel 是在 frozen LLM 之外构建一个 router 来“选择”外部知识，而本提议是利用 LLM 的内部表征空间直接“内化”外部知识，将 skill library 从一个文档库转化为一个 latent vector bank，从而彻底消除 agent 执行 skill 时的 context window 读取开销和注意力分散问题。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Ruishuo Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xun Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yu Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhuoran Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Longbo Huang\", \"affiliations\": [1], \"markers\": [\"✉\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"IIIS, Tsinghua University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"✉\", \"text\": \"Correspondence: longbohuang@tsinghua.edu.cn\"}\n  ]\n}\n```", "summary_translation": "技能将 LLM agent 的能力扩展到其参数化知识之外，而它们所承诺的增益取决于能否选择正确的技能。已部署的 harnesses 通过将每个技能的 metadata 预加载到 context 中来进行路由，这会分散 agent 的注意力并限制技能库的大小。Retrieval pipelines 将选择过程移出了 context，但也移出了 agent 的能力范围。我们表明，frozen agent LLM 在其自身的 forward passes 中已经包含了路由信号，并且仅需两个 linear maps 就足以在 context 中没有任何技能文本的情况下将其读出。Gavel (Glance And Verdict from a frozen LLM) 分两步读取该信号。Glance 通过这两个 maps（唯一被训练的参数）投影任务和每个技能的 mid-layer states，并根据安装时由一次 forward pass 构建的紧凑的逐技能库对整个技能库进行评分。随后，Verdict 恢复入围技能的 forward passes，并读取模型自身的 likelihood 和 yes/no 判断，将其与 glance 作为 product of experts 进行融合。经过一次训练后，Gavel 能够 zero-shot 迁移到三个公开 benchmarks 以及 SkillTraj，这是我们包含 372 条模拟 agent 轨迹的新 benchmark。在 Qwen3-32B 上，它优于添加了 1.2B 到 16B 外部参数的 progressive disclosure 和 retrieve-and-rerank pipelines，在书面任务上最高提升 13.4 points，当在 mid-rollout 期间产生技能需求时最高提升 21.9 points。路由准确率随着 backbone 的改进而提升，并且在 bash-agent harness 中，相同的 32B 模型在 Skill-Use 上触发正确技能的频率高于在 Codex 中运行的远大得多的 frontier models。"}, {"title": "Salesforce Koa: An Enterprise Language Model for Agentic Tool Use", "arxiv_id": "2609.15066", "authors": "Zixiang Chen, Sufeng Niu, Yingchi Liu, Wenting Zhao, Akshara Prabhakar, Shubham Mehrotra, Bin Bi, Zhujun Lan, Katherine Tan, Mohammad Ramezanali, Tulika Manoj Awalgaonkar, Monojit Banerjee, Jielin Qiu, Shiva Kumar Pentyala, Zhepeng Cen, Anupam Tripathi, Ali Ziaei, Regunathan Radhakrishnan, Darvish Lee Shadravan, Shelby Heinecke, Sitaram Asur, Silvio Savarese, James Zhu, Phil Mui, Huan Wang", "summary": "We present Salesforce Koa, an enterprise language model built by post-training the open-weight Nemotron-3-Super-120B foundation model with reinforcement learning using Group Relative Policy Optimization (GRPO). Salesforce Koa is trained on public and synthetically generated data, with no customer data, to improve tool use and agentic capabilities while preserving strong general-purpose performance. Its distinctive component is a simulation-to-reward pipeline that expands workflow specifications into persona-conditioned multi-turn tasks with task-resolution rewards grounded in successful tool use for data-dependent requests. For enterprise domains, these specifications are written in Agent Script, Salesforce's declarative language for building Agentforce agents; for public tool-use domains, we synthesize the workflow structure directly. The same simulation and grounded-reward machinery drives GRPO across both. Across public tool-use, agentic-reasoning, and enterprise Customer Relationship Management (CRM) benchmarks, Salesforce Koa improves over its open-weight base, with the clearest gains on multi-turn tool use, and surpasses a strong proprietary baseline while remaining below the strongest frontier models. These results show that specification-driven reinforcement learning is a practical path to specializing open-weight foundation models for enterprise agentic tasks.", "category": "cs.LG", "cluster": "Skill Routing \u0026 Tool Use", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心问题是：能否将开源的 open-weight foundation models 有效地专门化用于企业 agentic tasks——即在组织特定的 schemas、APIs 和 policies 上完成多步骤工作流、调用外部工具、检索结构化信息——同时保持 general-purpose capability 不退化。这一问题之所以重要，是因为企业 AI 系统与通用助手有本质区别：它们必须在与业务应用深度耦合的环境中执行 multi-turn tool use 和 agentic reasoning，而当前许多此类系统依赖专有 frontier models，企业却需要对 deployment、customization、governance 和 cost 的更精细控制权，这是单一外部提供商难以满足的。尽管 Llama、Gemma、Qwen、Mistral 和 Nemotron 等 open-weight 模型已在公开 benchmark 上大幅缩小与专有模型的差距，且权重访问使组织能够进行 domain-specific post-training，但一个关键的空白始终存在：这些模型能否在不牺牲通用能力的前提下，被有效适配到企业特有的工具生态和工作流规范中。解决这一问题带来的价值是双重的——既为企业提供可控、可定制、可治理的 agentic LLM 部署路径，又通过 specification-driven RL 建立起 agent authoring 与 model post-training 之间的直接桥梁，使同一套声明式规范既配置 agent 行为又结构化其训练任务和奖励标准。\n\n### § 2 前人工作与不足\n\n该问题之前未被完整解决。在模型层面，open-weight foundation models 如 Llama、Gemma、Qwen、Mistral 和 Nemotron 虽然在公开 benchmark 上表现接近专有模型，但它们缺乏对企业特定 schemas、APIs 和 policies 的专门适配——这一空白并非因为模型能力不足，而是因为公开训练数据和 benchmark（如 BFCL、Tau2Bench）覆盖的是通用工具调用场景，企业领域的 workflow specification 缺乏对应的训练信号来源。在 post-training 方法层面，supervised fine-tuning 是适配下游任务的标准路径，RLHF、Constitutional AI 和 GRPO 等强化学习方法进一步改进 reasoning 和 decision-making，但绝大多数工作 targeting 的是 general-purpose reasoning over public tools，而非企业应用中需要操作组织特定 schemas 和 policies 的场景——这一缺失的根本原因是：企业 agentic 任务的训练数据难以获取且涉及隐私，而将 agent 的 workflow 结构转化为可执行训练环境并生成 grounded reward 的系统化方法此前并不存在。论文自身的 preliminary SFT study 进一步揭示了 SFT 的方法层面局限：从已经过大量 post-training 的 Nemotron-120B 基座出发，SFT 在 single-turn 和 static agentic 类别上有提升（如 BFCL live parallel 从 75.0% 升至 87.5%），但对 multi-turn tool use 这一企业 agent 最核心的能力几乎没有改善（54.1%→53.2%），表明 imitation-based SFT 在已充分 post-trained 的基座上对长程交互决策的 headroom 极其有限。此外，SFT 与 RL 在 post-training 中并非可干净解耦——正如 Niu et al. [9] 所指出的，二者的交互使得简单的 SFT-then-RL pipeline 难以直接奏效。更关键的是，此前缺乏一种将 declarative agent specification 直接转化为 RL 训练环境和 grounded reward 的机制：Salesforce 的 Agent Script 虽然能声明式地定义 agent 的 routing structure、subagents、typed actions 和 tool scopes，但这些规范此前仅用于 agent 配置，未被用于结构化 model post-training 的 rollout 任务和 resolution criteria。Salesforce Koa 通过 simulation-to-reward pipeline 填补了这一缺口，将同一套 specification 同时驱动 agent authoring 和 RL 训练，使 spec-driven RL 成为专门化 open-weight foundation models 的可行路径。", "core_insight": "### § 3 重建作者的思考路径\n\n企业 AI 系统对 LLM 的要求与通用助手根本不同：它必须调用外部工具、检索结构化信息、完成跨业务应用的多步骤工作流，而这些工具的 schema、API 和策略是组织特定的。开源基础模型（Llama、Gemma、Qwen、Mistral、Nemotron）在公共 benchmark 上已大幅缩小与专有模型的差距，但企业需要的部署控制、定制化、治理和成本管理是单一外部 provider 无法满足的。核心问题因此浮现：能否在保留通用能力的同时，将开源基础模型有效特化为企业 agentic 任务专用？\n\n标准的 post-training 路线是 SFT 适配下游任务，再用 RLHF 或 GRPO 进一步提升推理和决策。但作者在 preliminary SFT study 中观察到一个关键失败模式：在已经经过大量后训练的 Nemotron-120B base 上，SFT 对多轮工具使用几乎没有提升（BFCL multi-turn 54.1%→53.2%），增益集中在单轮和静态 agentic 类别。这暗示行为克隆无法教会 agent 在长 horizon 交互中做出正确决策——它只能模仿表面动作序列，无法学习何时该调用工具、何时该与用户沟通、何时该 defer。与此同时，SFT 与 RL 在 post-training 中并非干净解耦，简单叠加 SFT-then-RL 的收益并非理所当然。\n\n另一方面，现有 RL 工作大多针对通用推理和公共工具，而非企业特定的 schema 和 API。企业领域的 RL 面临一个结构性困难：训练任务和 reward 必须反映真实的工作流结构，但人工标注昂贵且涉及客户数据隐私，而通用合成数据又无法覆盖组织特定的路由逻辑、工具范围和策略约束。APIGen 和 APIGen-MT 提供了合成多轮交互的自动化 pipeline，Tau2Bench 和 BFCL 确立了工具使用评估标准，PivotRL 展示了低计算成本下的 agentic post-training 方法——但这些工作都没有利用企业 agent 本身已有的声明式规范。\n\n关键的洞察在于：Salesforce 的 Agentforce agent 本身就是用 Agent Script 这种声明式语言编写的，一个 specification 已经完整定义了 agent 的路由结构、子 agent、typed actions、工具范围和工作流指令。如果将这个 specification 不仅用于配置 agent，还用于结构化 RL 的 rollout 任务和 resolution criteria，就能直接桥接 agent authoring 与 model post-training。specification 可以被编译为 typed workflow graph，实例化为可执行环境；simulation pipeline 可以将其扩展为 scenario- 和 persona-conditioned 的多轮任务；coverage judge 可以基于 sub-question 的 resolved/not-resolved 判决生成 grounded reward，并强制要求需要客户或系统数据的子问题必须由成功的工具调用支撑。对于没有 Agent Script 的公共工具领域，可以直接合成 workflow structure，复用相同的 simulation 和 reward 机制。这样，RL 就能在真实的工作流结构中学习，而非在抽象的通用任务中。\n\n### § 4 核心 Intuition\n\n企业 agent 的声明式 specification 本身就包含了训练所需的全部结构：工作流路由、工具范围、状态效应和终止条件。将 specification 编译为可执行环境，用 simulation pipeline 扩展为多轮任务，用 coverage judge 生成 grounded reward，就能让 GRPO 在真实工作流中学习 agent 该做什么，而不是在抽象任务中学习通用推理。先前方法失效是因为 SFT 只能模仿表面动作而无法教会长 horizon 决策，通用 RL 又缺乏企业特定的工作流结构和 grounded reward；这个方法奏效是因为 specification 同时定义了 agent 的行为空间和模型的训练信号，使 agent authoring 与 post-training 不再是割裂的两个阶段。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Agent Script / Synth Workflow]\n      |\n      v\n[Typed Workflow Graph] -\u003E [Simulation Pipeline] -\u003E [Persona-conditioned Tasks]\n                                                        |\n                                                        v\n[GRPO Optimization] \u003C- [Grounded Reward] \u003C- [NeMo Gym Online Rollout]\n      |                    ^                 |          |\n      v                    |                 v          |\n[Policy Update]            |          [Coverage Judge]  |\n                           |          (Frozen Helper)   |\n                           |               ^            |\n                           |               |            |\n                           +---------------+------------+\n```\n\nSalesforce Koa 的完整训练 pipeline 包含以下核心步骤：\n\n1. **Spec-driven 环境与任务构建 (Section 2.1)**：\n   - **输入**：企业领域的 Agent Script 规范（定义路由、子代理、工具作用域等）或公开工具领域的合成工作流结构。\n   - **操作**：静态提取将规范编译为 typed workflow graph（包含工具参数 schema、路由条件等）。随后，simulation pipeline 将其扩展为基于场景和 persona 的多轮对话任务。\n   - **输出**：带有 `agent_ref` 和初始上下文的 persona-conditioned RL 训练任务。\n\n2. **在线 Rollout 与 Grounded Reward (Section 2.2)**：\n   - **输入**：RL 训练任务、可训练的 Policy (Nemotron-120B) 以及 Frozen Helper 模型。\n   - **操作**：NeMo Gym 执行 online rollout。Policy 与环境交互，Frozen Helper 扮演 customer simulator、tool emulator 和 coverage judge 三个角色。Coverage judge 根据子问题解决情况与成功工具调用的 grounding 计算覆盖率，并施加 duplicate-call gate。\n   - **输出**：标量 Grounded Reward。\n\n3. **策略优化 (Section 2.3)**：\n   - **输入**：Rollout 生成的完整轨迹与标量奖励。\n   - **操作**：使用 Group Relative Policy Optimization (GRPO) 算法，通过 leave-one-out 基线估计优势，进行单步 on-policy 更新。对格式错误的工具调用施加负向优势作为硬性约束。\n   - **输出**：更新后的 Policy 权重。\n\n4. **单步训练模式 (Appendix F)**：\n   - **输入**：受约束的决策回合（如工具被故意扣留时的对话前缀）。\n   - **操作**：环境动态创建工具缺失的约束状态，要求 Policy 选择与用户沟通而非盲目调用工具。通过 procedural gate 阻止不可逆的副作用，并在恢复回合评估正确性。\n   - **输出**：增强 Policy 在面对限制时的用户沟通与延迟决策能力。\n\n### § 6 核心数学推导\n\n本文的核心数学推导基于 Group Relative Policy Optimization (GRPO) 算法，旨在最大化期望轨迹奖励。由于原文部分公式抽取缺失，以下仅解释可确认的定义与关系，并补充标准理论背景。\n\n**1. 期望轨迹奖励**：\n模型优化的目标是最大化期望奖励 $J(\\theta) = \\mathbb{E}_{x \\sim D} \\mathbb{E}_{\\tau \\sim \\pi_\\theta(\\cdot|x, env)} [R(\\tau)]$。\n- **Intuition**：给定从数据集 $D$ 采样的 prompt $x$，策略 $\\pi_\\theta$ 在环境中生成轨迹 $\\tau$，目标是让所有可能轨迹的奖励 $R(\\tau)$ 的期望最大化。这里不使用单步奖励，而是基于完整多轮交互的最终结果给予奖励。\n\n**2. Leave-one-out 优势估计**：\n对于同一 prompt 采样的一组 $G$ 条轨迹，轨迹 $i$ 的优势 $A_i$ 通过 leave-one-out 基线计算。\n- **Intuition**：GRPO 不使用额外的 value network 来估计基线，而是用同一组其他轨迹的平均奖励作为基线。计算轨迹 $i$ 的优势时，排除 $i$ 自身，用剩余 $G-1$ 条轨迹的奖励均值和标准差进行归一化。这减少了方差，并使得相对表现更好的轨迹获得正优势。\n\n**3. Token-level 截断重要性采样权重**：\n在单步 on-policy 更新中，引入一个 token 级别的权重来纠正训练时与生成时 log-probability 的不匹配。\n- **Intuition**：由于策略在生成一个 batch 后会立即更新，生成时的概率与训练时的概率会有微小偏差。重要性采样权重用于修正这种偏差，保证梯度估计的无偏性，而截断操作则防止极端值导致训练不稳定。\n\n**4. Grounded Reward 计算**：\n奖励由 coverage rate 和 duplicate-call gate 组成。Coverage rate 是被 judge 判定为已解决的子问题比例；若发生连续重复的相同工具调用，奖励直接置零。\n- **Intuition**：通过 gate 机制惩罚无效的重复调用，强制模型在获取数据时依赖成功的、相关的工具调用，而非通过重复尝试或通用事实猜测来“作弊”通过判定。\n\n### § 7 实验设计与结论\n\n**提出了什么问题**：开源基础模型能否在不损失通用能力的前提下，通过强化学习有效特化为企业级 agentic 任务模型？spec-driven RL 是否是一条实用的技术路径？\n\n**设计了什么实验验证这个问题**：研究团队在公开工具调用、agentic reasoning 和企业 CRM 基准上，将 Salesforce Koa 与其开源基座、专有前沿模型进行对比。同时，设计了 scoped SFT-vs-RL 消融实验，从相同的已 RL-post-trained 基座出发，分别评估 SFT-only 和 RL-only 在单轮与多轮任务上的表现差异。\n\n**问题的答案是什么**：Spec-driven RL 能有效提升开源基座在企业 agentic 任务上的表现，尤其在多轮工具调用上提升最明显，并超越了强专有基线 GPT-4.1，但未达到最强前沿模型水平。消融实验表明，RL 在多轮工具使用上显著优于 SFT，而 SFT 在单轮 CRM 任务上更具竞争力。这证实了 spec-driven RL 是特化开源基础模型的有效路径，但从已 RL-post-trained 基座出发的结论可能不适用于 pre-RL checkpoint。", "additional_insights": "### § 8 Take-aways\n\nSalesforce Koa 是基于开源的 Nemotron-3-Super-120B foundation model，通过 GRPO (Group Relative Policy Optimization) 进行 post-training 的企业级语言模型，其核心创新是 specification-driven task construction。该 pipeline 使用 Salesforce 的声明式语言 Agent Script 编写企业工作流规范，将其扩展为基于场景和 persona 的多轮任务，并通过 simulation-to-reward pipeline 生成基于成功工具调用的 task-resolution rewards。对于公共工具使用领域，由于没有 Agent Script 规范，论文直接合成工作流结构生成 typed workflow graph，与企业领域共享相同的模拟和奖励机制。在公共工具使用、agentic-reasoning 和企业 CRM benchmarks 上，Salesforce Koa 相比其开源基线有所提升，特别是在多轮工具使用方面提升最明显，并超越了 GPT-4.1，但仍低于最强的前沿模型如 Claude Opus 4.8 和 GPT-5.5。论文发现，从已经经过 RL post-training 的基线模型出发，RL 在多轮工具使用上显著提升，而 SFT 贡献甚微，但在单轮 CRM 任务上 SFT 表现出竞争力。训练仅使用公开和合成生成的数据，不使用任何客户数据，确保了数据隐私和合规性。奖励设计采用了 gated coverage reward，通过 coverage judge 对子问题进行 resolved/not-resolved 判决，并强制要求需要特定数据的子问题必须由成功的工具调用支持。研究还发现 RL 的稳定性是 scale-dependent 的：在 Super-120B 模型上训练稳定，但在较小的 Nano-30B proxy 模型上训练会在早期达到峰值后崩溃。\n\n### § 9 最脆弱的假设\n\n该论文最关键的假设是：使用 frozen helper model（Nano-30B）同时充当 customer simulator、tool/function emulator 和 coverage judge，能够准确模拟真实环境并生成可靠的 reward 信号。如果这个假设不成立，核心贡献会直接失效，因为整个 GRPO 训练完全依赖于 helper model 生成的 reward，如果 helper 的模拟不准确或 judge 不可靠，会导致 reward hacking 或错误的训练信号，使得模型学到的策略在真实环境中无效。在实际中，这个假设可能不成立的原因是 helper model 需要同时扮演三个角色，其能力可能不足以准确模拟复杂的企业工作流或正确判断任务是否解决，特别是 coverage judge 需要理解复杂的业务逻辑和工具调用结果，如果 judge 本身有系统性偏差，会导致模型学到错误的行为。论文提供的证据包括：helper 是一个独立的推理服务，不被 policy optimization 更新，以避免数据并行协调失败；在 offline evaluation 中使用独立的 LLM judge 来避免 training-time helper 的失败影响最终 benchmark。然而，论文缺少对 helper model 本身准确性的直接评估，例如 coverage judge 与人类判断的一致性，或 tool emulator 与真实工具输出的一致性，这使得无法确认生成的 reward 信号是否真正可靠。\n\n### § 10 最小复现实验\n\n在一周时间内，可以验证 specification-driven task construction 和 gated coverage reward 是否能提升多轮工具使用能力这一核心 claim。使用公开的 Tau2Bench (Airline domain) 作为工具集合和可执行环境，合成多轮交互数据。实现上，使用一个较小的开源模型如 Llama-3-8B 作为 policy，使用另一个 frozen model 如 GPT-4o-mini 作为 helper（customer simulator 和 coverage judge）。实现 Agent Script 的简化版本或直接合成工作流结构，生成 typed workflow graph。实现 gated coverage reward：coverage rate 乘以 duplicate-call gate，并要求需要数据的子问题必须由工具调用支持。使用 GRPO 进行训练。测量指标是在 BFCL multi-turn 子集或 Tau2Bench 上评估模型的准确率，对比基线模型和经过 RL 训练的模型。如果 RL 训练后的模型在多轮工具使用准确率上显著高于基线（例如提升 5 个百分点以上），则支持 specification-driven RL 能提升多轮工具使用的 claim；如果没有提升或下降，则反驳该 claim。同时观察训练过程中 reward 的稳定性，验证 scale-dependent stability 的发现。", "research_value": "### § 11 最强反例设计\n\n如果我要对 Salesforce Koa 提出最有力的攻击，我会设计一个 **“Helper Distribution Shift”** 实验，以挑战其核心假设：即 frozen helper model 能够准确模拟真实环境并生成可靠的 reward 信号。具体而言，我会质疑论文所观察到的 multi-turn tool use 提升是否真正源于模型掌握了企业工作流的 agentic reasoning，还是仅仅因为 policy 过拟合了 frozen Nano-30B helper 的特定行为分布和 judge 偏好。在这个反例实验中，我会保持训练后的 Salesforce Koa policy 不变，但在评估阶段引入 distribution shift：将训练时使用的 frozen Nano-30B helper 替换为具有不同风格、对话习惯或系统性偏差的另一个 LLM（例如 GPT-4o 或经过不同 post-training 的 Llama 变体）来扮演 customer simulator 和 tool emulator，同时使用独立的人类标注或更强的 frontier model 来充当 ground-truth coverage judge。如果 Salesforce Koa 的核心 claim 成立，即它学到了通用的、spec-driven 的多步工具调用与延迟决策能力，那么在替换 simulator 后其任务完成率应该保持相对稳定。然而，我预测其 performance 会出现断崖式下跌。这一结果将提供一种具体的替代解释：policy 在 GRPO 训练中并未学到真正的环境交互逻辑，而是学到了如何“作弊”或迎合 Nano-30B simulator 的特定交互模式（例如利用其特定的 prompt 弱点套取信息，或生成能被 Nano-30B coverage judge 宽松判定的特定格式响应）。这种 reward hacking 现象在真实的企业部署中是可预测且致命的，因为真实用户的表达方式和企业 API 的异常返回模式远比单一 frozen helper 的分布复杂，一旦脱离这个“温室”环境，模型学到的策略将直接失效。\n\n### § 12 Follow-up Research Idea\n\n基于 Salesforce Koa 依赖静态 frozen helper 导致 simulation-to-reality gap 的核心局限，我提出一个非增量的 novel research idea：**Adversarial Co-evolutionary Spec-Driven RL (ACES-RL)**，将 agent post-training 从“静态环境模拟”重构为“动态对抗博弈”。驱动这一想法的未满足需求是：声明式规范本质上是对真实世界的抽象，而用单一 frozen model 将其具象化为训练环境，必然产生可被 policy 利用的 blind spots，导致 reward hacking。为了打破这一局限，我们可以借鉴 Multi-Agent Reinforcement Learning (MARL) 和 Adversarial Inverse Reinforcement Learning (AIRL) 的思想，将原本静态的 helper 升级为一个具有自身 reward function 的 learnable adversary。在这个新 framing 下，Agent Script 不再仅用于生成固定任务，而是定义了 adversary 的 action space 和约束边界：adversary 的目标是在不违反 spec 逻辑的前提下，主动探索和构造最难、最边缘的 customer persona 或 tool emulator 响应，以最小化 policy 的 grounded reward；而 policy 则试图在对抗性环境中最大化任务完成率。两者的 reward 形成零和或非零和博弈，通过轮流更新实现 co-evolution。第一个实验将设计一个 controlled adversarial training setup：在 Tau2Bench (Airline domain) 上，使用两个同架构的较小模型（如 Llama-3-8B）分别初始化 policy 和 adversarial helper。在每轮 GRPO 中，adversary 先通过 gradient descent 生成使当前 policy 失败率最高的对话前缀和工具异常返回，随后 policy 在此对抗分布上进行 RL 更新。我们将评估这种 co-evolved policy 在面对完全 OOD 的真实人类对话测试集时的 robustness 和 recovery 能率，并与 Salesforce Koa 的 frozen-helper baseline 进行对比。这一提议与已有工作的根本区别在于：它摒弃了 LLM-as-a-judge 或 LLM-as-simulator 中模型固定不变的假设，首次将 declarative agent specification 转化为动态对抗博弈的规则约束，从而将模型训练的焦点从“拟合固定环境”转移到“学习对环境扰动的鲁棒性”，为 enterprise agent 的 post-training 打开了一个全新的自适应方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Zixiang Chen\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Sufeng Niu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Yingchi Liu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Wenting Zhao\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Akshara Prabhakar\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Shubham Mehrotra\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Bin Bi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhujun Lan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Katherine Tan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Mohammad Ramezanali\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Tulika Manoj Awalgaonkar\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Monojit Banerjee\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jielin Qiu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shiva Kumar Pentyala\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhepeng Cen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Anupam Tripathi\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ali Ziaei\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Regunathan Radhakrishnan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Darvish Lee Shadravan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shelby Heinecke\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Sitaram Asur\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Silvio Savarese\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"James Zhu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Phil Mui\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Huan Wang\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Salesforce Agentforce \u0026 AI Research\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution (co-first authors).\"},\n    {\"marker\": \"†\", \"text\": \"Co-corresponding authors.\"}\n  ]\n}\n```", "summary_translation": "我们提出了 Salesforce Koa，这是一个企业级语言模型，通过使用 Group Relative Policy Optimization (GRPO) 的 reinforcement learning 对 open-weight 的 Nemotron-3-Super-120B foundation model 进行 post-training 构建而成。Salesforce Koa 在公开和合成生成的数据上进行训练，不包含任何客户数据，旨在提高 tool use 和 agentic 能力，同时保持强大的通用性能。其独特的组件是一个 simulation-to-reward pipeline，该 pipeline 将 workflow specifications 扩展为 persona-conditioned 的多轮任务，这些任务的 task-resolution rewards 基于针对数据依赖请求的成功 tool use。对于企业领域，这些 specifications 使用 Agent Script 编写，Agent Script 是 Salesforce 用于构建 Agentforce agents 的 declarative language；对于公开的 tool-use 领域，我们直接合成 workflow structure。相同的 simulation 和 grounded-reward machinery 在两者中驱动 GRPO。在公开的 tool-use、agentic-reasoning 和企业 Customer Relationship Management (CRM) benchmarks 上，Salesforce Koa 相比其 open-weight 基础模型有所提升，在多轮 tool use 上的提升最为明显，并超越了一个强大的专有 baseline，但仍低于最强的 frontier models。这些结果表明，specification-driven reinforcement learning 是将 open-weight foundation models 专门化于企业 agentic 任务的一条实用路径。"}]}], "2026-09-14": [{"name": "Embodied \u0026 Domain-Specific Agents", "count": 4, "papers": [{"title": "Agent as Policy for Robotic Manipulation", "arxiv_id": "2609.12541", "authors": "Mengzhao Jia, Yang Lin, Xixin Zhang, Zhihan Zhang, Xiaobai Liu, Meng Jiang", "summary": "We demonstrate that a general-purpose agent can directly drive a physical robot throughout task execution without any task-specific or environment-specific training. We introduce Agent as Policy (AGP), which places task planning and execution under the agent's control. Given a task and a robot interface, the agent interprets visual evidence, writes executable programs, issues motion commands, and revises its actions in response to physical outcomes. This brings the agent's reasoning and programming capabilities into continuous interaction with the physical world. We study AGP across multiple real-world manipulation tasks spanning precision manipulation, dynamic motions, and deformable objects. These include assembly from human videos, block construction from goal images, die reorientation, targeted throwing, and bimanual towel folding. AGP achieves success rates of 100%, 100%, and 80% on three block construction configurations. These findings establish a path for general-purpose agents to act as robotic policies, extending their autonomy to physical manipulation through runtime reasoning, programming, and interaction.", "category": "cs.CL", "cluster": "Embodied \u0026 Domain-Specific Agents", "tags": ["cs.CL"], "filter_reason": "该论文的核心贡献是提出“Agent as Policy (AGP)”框架，将通用LLM智能体直接作为物理机器人操作的控制策略，涉及智能体的规划（任务分解）、工具使用（机器人接口、编程）、自我修正（根据物理结果修订动作）等核心智能体能力。虽然应用场景是机器人操作，但论文的核心机制是智能体在物理世界中的持续推理、编程和交互，属于单智能体（Agentic）方向，且包含自我演化/自我修正元素（根据物理反馈调整行为）。这符合筛选标准中“保留”的条件：核心是关于构建LLM智能体的方法论，且涉及智能体的规划、工具使用、自我反思等能力。同时，该论文不属于被排除的类别（如非演化型应用、非Agentic推理、基础设施、安全、多模态核心、图相关、多智能体拓扑等）。因此，应保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：一个 general-purpose 的 multimodal large language model (MLLM) agent 能否在没有任何 task-specific 或 environment-specific training 的条件下，直接作为 robot policy 驱动物理机器人完成 diverse manipulation tasks？具体而言，作者引入 **Agent as Policy (AGP)** 框架，将 task planning 与 execution 的完整控制权交给 agent——由 agent 自主决定观察什么、如何解释视觉证据、编写何种 executable program、发出何种 motion command，并根据物理执行反馈修正后续动作。这一问题的重要性在于：物理 manipulation 任务本质上要求 agent 能够在 runtime 联合推理当前场景状态、已尝试的运动及其结果，从而灵活调整感知解释方式和动作生成策略。例如，一次失败的 insertion 可能需要 agent 主动获取更近的视角、修正对齐估计或改变接近方向——这种将 perception、motion generation 与 recovery 融为一体的闭环决策能力，是现有方法难以实现的。解决这一问题能够证明 foundation MLLMs 的视觉感知与推理能力足以支撑 zero-shot manipulation，为通用机器人控制开辟一条无需 task-specific training data 的新路径，同时通过 runtime programming 和 persistent experience reuse 降低机器人行为开发的工程成本。\n\n### § 2 前人工作与不足\n\n将 agent 引入机器人控制的研究此前主要沿两条路径展开，但均存在结构性局限。第一条路径是 **program synthesis and refinement**，以 Code as Policies (Liang et al., 2022)、ProgPrompt (Singh et al., 2022)、RoboScript (Chen et al., 2024) 和 RoboCodeX (Mu et al., 2024) 为代表，由 agent 预先生成可执行代码或 computation graph 供机器人运行。这类方法的根本限制在于：生成的 program 必须通过显式规则表达 runtime decisions，而物理环境中的不确定观测和意外结果难以被预先枚举为规则——例如 insertion 失败后需要根据实际偏移量动态调整 approach direction，这要求感知与动作生成在 runtime 紧密耦合，而非依赖预先编写的 if-then 逻辑。第二条路径是 **runtime policy orchestration**，以 SayCan (Ahn et al., 2022)、Inner Monologue (Huang et al., 2022)、RoboClaw (Li et al., 2026a) 和 Harness VLA (Zhang et al., 2026) 为代表，agent 根据任务目标和执行反馈选择和排序已有的 learned skills 或 vision-language-action (VLA) policies。这类方法将 skill selection 与 motion generation 解耦：agent 仅控制\"下一步执行哪个 policy\"，而实际运动能力受限于被调用的 policy 本身能完成的动作范围，agent 无法在 motion 层面根据新物理证据进行细粒度修正。此外，直接学习 visuomotor policies 的方法如 Diffusion Policy (Chi et al., 2023)、RT-2 (Brohan et al., 2023)、OpenVLA (Kim et al., 2024) 和 π₀ (Black et al., 2024) 虽能从 trajectory data 中学习 action generation，但需要大量 task-specific 训练数据，且难以在 unseen 环境中 zero-shot 执行。AGP 的关键区别在于：它不将 agent 的角色限定为 program generator 或 policy orchestrator，而是让 agent 本身在整个 execution loop 中充当 policy，赋予其对 perception、geometry computation、motion planning 和 recovery 的完全自主权，使 reasoning 和 programming 能力与物理世界持续交互——这正是 prior methods 因架构分离而无法实现的核心能力。", "core_insight": "### § 3 重建作者的思考路径\n\n研究的起点是一个清晰的观察：MLLM 驱动的 agent 在数字任务上已经相当成熟，但当它们被引入机器人 manipulation 时，出现了两条路径，且各有结构性缺陷。第一条路径是让 agent 预先生成可执行程序——这类程序本质上是静态的，必须用显式规则编码所有 runtime 决策，但物理世界充满不确定性：插入失败后该换角度还是换视角？抓取滑落后该重新对齐还是重新定位？这些决策依赖于执行时才出现的证据，无法事先穷举。第二条路径是让 agent 编排已有的 learned policies——agent 只能选择\"下一步运行哪个 skill\"，而 motion generation 仍被底层 policy 的能力上界锁死，无法根据当前场景的细微差异调整动作本身。\n\n这两条路径的共同问题是：它们都在 agent 与物理执行之间插入了某种固定中介——要么是预编译的程序，要么是预训练的 policy——而这个中介恰恰切断了\"观察→推理→动作\"的闭环。物理任务的核心难点不在于规划本身，而在于执行过程中需要根据物理反馈联合调整感知解释和动作生成。比如一次失败的插入，可能需要更近的视角、修正的对齐估计、或完全不同的接近方向，这要求决策者能同时看到当前场景、刚才尝试的动作、以及它的物理结果。\n\n由此自然产生一个推论：既然 MLLM 本身已经具备视觉感知、推理和编程能力，而 coding agent 的工具使用、持久工作空间、反馈循环等机制也已成熟，为什么不直接让 agent 在 runtime 持续地做这些事——自己决定观察什么、如何解释证据、编写什么程序、请求什么动作——而不是把它的输出固化成某种中间产物？关键在于把 agent 保持在决策回路中，让它每次收到物理反馈后都能重新评估并调整下一步，而不是把控制权交给一个事先定义好的程序或 policy。\n\n实现上需要解决一个工程问题：如何让 coding agent 与物理机器人对接。答案是构建一个 bridge，暴露校准过的观察（相机图像、深度、机器人状态）、几何查询和运动命令，使 agent 的计算能 ground 在真实的机器人坐标系中。Agent 在 runtime 编写 Python 脚本来处理图像和深度数据、估计物体几何、计算目标 gripper pose，然后通过接口提交运动请求；执行后，新的观察和运动反馈又成为下一步推理的输入。这样，agent 的推理和编程能力就被拉入与物理世界的持续交互中，而无需任何 task-specific 训练。\n\n### § 4 核心 Intuition\n\n先前方法之所以失效，是因为它们都在 agent 与物理执行之间插入了固定中介——预生成的程序无法应对 runtime 不确定性，预训练的 policy 将 motion generation 与推理解耦——从而切断了根据物理反馈闭环调整的能力。AGP 的核心 intuition 是：不要中介，让 agent 自己就是 policy，在 runtime 持续地决定观察什么、如何解释、编写什么程序、请求什么动作，每次物理反馈都直接 inform 下一个决策。这使得感知解释、运动生成和错误恢复的控制权统一留在 agent 手中，而非分散到静态规则或固定 skill 里，从而实现 zero-shot 的灵活适应。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n                AGP Pipeline (§3)\n Task Input ──▶ Prep Agent ──▶ Task Definition\n (Vid/Img/Lan)  (once/type)   (goal, constraints, I)\n                                  ▼\n ┌─────────── Runtime Execution Loop ──────────┐\n │ Execution Agent (MLLM, θ fixed) ◀──────┐    │\n │ u_k ~ π_θ(·|g,I,H_k,W_k), W_k          │    │\n │      ▼                                  │    │\n │ Agent-Robot Bridge (§3.2)               │    │\n │  Robot→Agent: Images, Depth, State      │    │\n │  Agent→Robot: Move, Gripper, Observe    │    │\n │      ▼                                  │    │\n │ Robot Controller (IK, Trajectory)       │    │\n │      ▼                                  │    │\n │ Motion Exec → Feedback + New Obs ───────┘    │\n └──────────────────────────────────────────────┘\n Output: Physical Task Completion (verified)\n```\n\nAGP 的完整 pipeline 分为两个阶段。**Task Preparation** 阶段（§3.1）仅在任务类型首次引入时运行一次：Preparation Agent 读取用户的 task input（video、image 或 language 指令），生成可复用的 Task Definition，其中包含 goal、constraints、completion criteria 以及 robot interface 的访问规则。后续同一类型的任务实例直接加载该定义，跳过准备阶段。\n\n**Runtime Execution Loop** 是 AGP 的核心（§3.1–§3.3）。Execution Agent 是一个参数固定的 MLLM（如 GPT-6 Astra），它接收 Task Definition 和 robot interface 文档，在本地 Workspace $W_k$ 中维护脚本、笔记和观测数据。每一步，agent 根据当前对话历史 $H_k$ 和 workspace 状态 $W_k$，通过策略 $\\pi_\\theta$ 采样一个 tool call $u_k$（公式 1）。该 tool call 可能是获取观测、编写 Python 程序计算几何量、或提交 motion command。\n\n**Agent-Robot Bridge**（§3.2）是 agent 与物理机器人之间的双向接口。Robot→Agent 方向提供 wrist camera 的 RGB-D 图像（640×360）、overhead camera 的 RGB 图像（1920×1080）以及通过 forward kinematics 计算的 end effector pose 和 joint positions。Agent→Robot 方向接受 observation requests 和 action requests，后者包括 `move_ee`（指定 end effector 位姿）、`move_joints`（指定关节角）和 `gripper`（控制夹爪开合）。Robot Controller 使用 Mink 库进行 inverse kinematics 计算，生成满足 workspace 和 motion limits 的 joint trajectory，并通过 motor feedback 跟踪执行。\n\n**Feedback 与 Adaptation**（§3.3）构成回路：motion 执行完成后，bridge 返回 updated state、target errors 和新的观测图像。Agent 利用这些反馈修正估计并调整后续动作——例如插入失败后重新估计对齐偏移并修改接近方向。Motion execution 与 agent inference 独立运行，允许机器人在执行已提交动作的同时 agent 进行推理。整个过程中模型参数 $\\theta$ 保持固定，所有适应通过 session 内的测量更新、程序修改和决策调整实现。\n\n### § 6 核心数学推导\n\n本文没有复杂的数学推导，仅有一个形式化定义（公式 1，§3.1）：\n\n$$u_k \\sim \\pi_\\theta(\\cdot \\mid g, I, H_k, W_k)$$\n\n这个公式的 intuition 是：将 agent 的 tool selection 过程建模为一个条件分布的采样。在每一步 $k$，agent 面对的是一个条件概率问题——给定 task specification $g$（包含 prompt 和参考材料）、robot interface 文档 $I$、截至该步的对话历史与 tool 执行结果 $H_k$、以及当前 workspace 中的脚本和观测文件 $W_k$，从策略 $\\pi_\\theta$ 中采样出下一个 tool call $u_k$。$\\theta$ 是 MLLM 的固定参数，整个执行过程中不更新。这个公式本质上是对 \"agent 即 policy\" 这一核心思想的数学表达：agent 的推理和编程能力直接充当了 robot policy，无需额外训练 action policy。公式中不涉及梯度更新或损失函数，因为 AGP 是一个纯 inference 框架，所有适应发生在 workspace 层面而非模型参数层面。\n\n### § 7 实验设计与结论\n\n**问题 1：通用 agent 能否在 zero-shot 条件下直接驱动物理机器人完成多样化 manipulation 任务？** 论文设计了 5 类任务、8 种 configuration 的 real-world 评测（§4.1.2–§4.2.1）：video guided assembly 测试 long horizon reasoning，image guided block construction 测试视觉关系推断与中间稳定性，die flipping 测试 grasp-dependent reorientation，targeted throwing 测试 timed release 的动态动作，bimanual towel folding 测试 deformable object 的协调操作。每次 trial 从 fresh session 开始，模型权重固定，无 prior task experience 或 simulation rehearsal。**答案：** 8 种 configuration 中 7 种达到 ≥80% 成功率，其中 5 种达到 100%（含三种 block construction 和 die flipping）。Deformable object 的 simultaneous folding 最低（3/5），表明协调动态操作可变形物体仍是难点。\n\n**问题 2：不同 agent 平台、模型和 thinking effort 如何影响性能？** 论文在 two pair assembly 任务上系统比较了 Codex 平台下的 GPT-6 Astra（low/medium/high effort）和 GPT-5.6 Sol/Terra/Luna，以及 Claude Code 平台下的 Claude Opus 5 和 Fable 5.1（§4.2.2，Table 2）。所有 configuration 共享相同的 task references、robot functions 和 trial budgets。**答案：** AGP 框架在 Codex 和 Claude Code 上均能完成 assembly，但模型选择显著影响性能。Astra 在三种 effort level 下均保持 5/5 成功，说明该任务上额外 thinking effort 收益有限。Sol 推理成本更低但执行时间更长。Claude Code 内部 Fable 的成功率（3/5）低于 Opus（5/5），且尽管 token 用量更少，时间和成本反而更高。\n\n**问题 3：积累的 task experience 能否提升重复执行的效率？** 论文对 ring assembly 和 two pair assembly 各执行 5 个 cycle，每个 cycle 从 fresh agent context 开始但可读取和更新前序 cycle 保存的 measurements、procedures、corrections 和 scripts（§4.3.1，Figure 2）。**答案：** 效果因任务而异。Ring assembly 在第一个 cycle 后显著加速并保持稳定，而 two pair assembly 的执行时间波动并回到接近初始值，仅 experience writing 本身变快。这表明积累经验对部分任务有效，但对复杂任务的执行时间改善有限。\n\n**问题 4：大模型积累的经验能否迁移到更小的模型？** 论文将 GPT-6 Astra 在 5 次 two pair assembly 中保存的 geometry、procedures、corrections 和 scripts 以只读方式提供给 GPT-5.6 Terra，与 Terra 无经验基线对比（§4.3.2，Figure 3）。**答案：** 成功率从 1/5 提升至 2/5，成功 trial 的完成时间和 token 用量均下降。这提供了经验跨模型迁移的初步证据，但成功样本量较小，结论强度有限。", "additional_insights": "### § 8 Take-aways\n本文提出了 Agent as Policy (AGP) 框架，直接将通用多模态大语言模型 agent 作为机器人的控制策略，无需进行 task-specific 或 environment-specific 的策略训练。AGP 通过 runtime programming 赋予 agent 完全的自主权，使其能够在执行过程中解释视觉证据、编写可执行 Python 程序、下发运动指令，并基于物理反馈修正后续动作。在真实机器人平台的广泛测试中，AGP 在八个任务配置中的七个达到了至少 80% 的成功率，特别是在 block construction 和 die flipping 任务中实现了 100% 的成功率，证明了 foundation MLLMs 在 zero-shot physical manipulation 中的有效性。然而，该方法在执行效率和成本上存在显著瓶颈，单次成功任务的完成时间在 20.6 到 54.3 分钟之间，且平均推理成本高达 7.46 至 27.41 美元。经验复用实验表明，将先前积累的执行经验（如脚本、测量值）保存并传递给后续的 agent，能够在部分任务中缩短执行时间，甚至能帮助较弱的模型（如 GPT-5.6 Terra）提升成功率并降低 token 消耗。\n\n### § 9 最脆弱的假设\nAGP 方法最核心且最脆弱的假设是：通用大模型具备足够精确的 3D 空间几何感知与数学计算能力，能够仅通过 camera observations 和 depth 数据，在 runtime 编写出可靠的位姿估计算法并生成精确的 motion commands。如果这个假设不成立，agent 编写的程序将会产生错误的坐标变换或逆运动学求解，导致机器人动作失效甚至发生危险碰撞，整个 zero-shot manipulation 的闭环将直接崩溃。在实际场景中，这个假设极易不成立，因为大模型在处理像素到物理坐标系转换、点云配准、以及复杂的奇异值分解（SVD）等几何运算时，极易产生数值幻觉或逻辑错误，且微小的标定误差会被放大到不可接受的程度。论文虽然展示了部分成功案例（如附录 E 中 `fit_head.py` 和 `triangulate.py` 的代码片段），但缺乏对模型生成几何代码准确率的定量统计，且从 simultaneous towel folding 任务仅有 60% 成功率和整体极高的执行时间来看，模型在复杂空间推理和代码调试上消耗了大量资源，这侧面印证了该假设在面临高精度需求时极其脆弱。\n\n### § 10 最小复现实验\n如果有一周时间，可以通过在仿真环境中复现 \"Block construction from goal images\" 任务来验证 AGP 的核心 claim。使用 PyBullet 或 MuJoCo 搭建一个包含若干彩色方块和虚拟机械臂的桌面环境，并配置一个固定视角的 overhead camera 获取 RGB-D 图像。接入 GPT-4o 或 Claude 3.5 Sonnet 等 MLLM，为其提供获取图像、获取机器人状态以及控制末端执行器位姿的 Python API 接口。在实验中，向 agent 提供一张目标金字塔结构的图像，要求其在一个 fresh session 中自主编写代码识别方块位置、规划搭建顺序并调用 API 控制机械臂完成搭建。测量指标包括任务成功率、完成时间以及 token 消耗。如果 agent 能够在无需人工干预的情况下，成功编写出空间坐标转换代码并完成 3 个方块的堆叠，则支持了 AGP 的核心 claim；如果 agent 在坐标计算上频繁出错，或无法根据物理反馈调整抓取策略导致反复失败，则反驳了通用大模型可直接作为可靠 robot policy 的论点。", "research_value": "### § 11 最强反例设计\n\n要构造对 AGP 最有力的攻击，我会在真实物理环境中设计一个**高精度、强遮挡且依赖 tactile feedback 的 peg-in-hole 插入任务**，并刻意将 hole 的位置设置在 wrist camera 的视野边缘或严重反光与遮挡区域。这个反例直接刺穿论文最脆弱的假设：即通用 MLLM 能够仅凭 noisy 的 RGB-D observations 和 runtime 编写的 Python 代码完成精确的 3D 几何推理。在深度传感器存在系统性噪声、且目标孔径仅比 peg 大 1-2 毫米的工况下，MLLM 在 runtime 生成的点云配准或 SVD 代码将不可避免地累积数值误差与幻觉。由于 AGP 框架的 Agent-Robot Bridge 仅提供视觉和 kinematic state 反馈，缺乏高频的 force-torque 闭环，当 agent 发现插入失败时，它只能基于错误的视觉估计进行离散的粗粒度位移补偿，而无法像传统 compliant control 那样根据接触力梯度进行亚毫米级的动态调整。这将导致 agent 陷入“视觉误判-错误位移-再次失败”的无限循环，最终耗尽 trial budget 或引发物理碰撞。这一反例不仅证明了 AGP 在高精度 manipulation 中的可预测性失败，更揭示了其高成功率实质上是依赖于挑选了容错率高、视觉特征明显的 block construction 等任务，一旦面对需要紧密物理接触与多模态传感融合的精细操作，纯 inference 驱动的 zero-shot policy 便在根本架构上失效。\n\n### § 12 Follow-up Research Idea\n\n基于 AGP 在底层几何计算与连续控制上的结构性缺陷，我提出一个全新的研究框架：**Differentiable Skill Primitives as Semantic Tools (DSPST)**。这个想法的核心驱动力在于：AGP 试图让 MLLM 越俎代庖，在 runtime 从零编写复杂的几何与运动学代码，这不仅极其耗时且极易产生数值幻觉；而真正需要 MLLM 发挥作用的，是基于语义的异常恢复与高层策略调整。借鉴 differentiable programming 与 neuro-symbolic robotics 领域的工具，我们可以将底层的几何感知（如位姿估计、点云配准）与运动控制（如 impedance control、轨迹优化）封装为带有可微参数的 black-box tools，这些 tools 暴露给 agent 的不是代码 API，而是语义化的 hyper-parameters（如 `grip_force`, `contact_compliance`, `alignment_tolerance`）。\n\n在 DSPST 框架下，MLLM agent 不再生成具体的坐标变换矩阵，而是根据物理执行反馈的语义摘要（如“右侧受力过大导致卡阻”），通过自然语言推理去调整不同iable skill primitives 的连续参数。第一个实验将设计一个需要精细力觉适应的复杂装配任务：对比原版 AGP（agent 纯靠写代码硬解 IK 和几何）与 DSPST（agent 调用预置的 differentiable assembly skill 并仅调整语义参数）。预期结果将是，DSPST 不仅将单次任务完成时间从数十分钟压缩至几分钟，还将彻底消除由于 LLM 数值计算幻觉导致的物理崩溃，从而开辟一条将 foundation models 的高层语义推理与传统机器人学的数值稳定性深度融合的新路径，而非简单地在两者之间做非此即彼的取舍。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "{\n  \"authors\": [\n    {\"name\": \"Mengzhao Jia\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Yang Lin\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Xixin Zhang\", \"affiliations\": [3], \"markers\": [\"*\"]},\n    {\"name\": \"Zhihan Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiaobai Liu\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Meng Jiang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"University of Notre Dame\"},\n    {\"id\": 2, \"name\": \"University of California San Diego\"},\n    {\"id\": 3, \"name\": \"San Diego State University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Core contributors\"}\n  ]\n}", "summary_translation": "我们证明了 general-purpose agent 可以在没有任何 task-specific 或 environment-specific 训练的情况下，在整个任务执行过程中直接驱动物理机器人。我们引入了 Agent as Policy (AGP)，它将任务规划与执行置于 agent 的控制之下。给定任务和 robot interface，agent 解析视觉证据，编写可执行程序，发出 motion commands，并根据物理结果修正其动作。这使得 agent 的 reasoning 和 programming 能力与物理世界进行持续交互。我们在跨越 precision manipulation、dynamic motions 和 deformable objects 的多个 real-world manipulation tasks 上研究了 AGP。这些任务包括 assembly from human videos、block construction from goal images、die reorientation、targeted throwing 和 bimanual towel folding。AGP 在三种 block construction configurations 上的 success rates 达到了 100%、100% 和 80%。这些发现为 general-purpose agents 作为 robotic policies 建立了一条路径，通过 runtime reasoning、programming 和 interaction 将其自主性扩展到 physical manipulation。"}, {"title": "Affective Agent: On-Device Personalized Intervention Reasoning for Wearable Systems", "arxiv_id": "2609.12322", "authors": "Reina Mun, Zishen Wan, Vijay Janapa Reddi", "summary": "Affective computing has advanced wearable state inference, but on-device reasoning about whether, when, and how to intervene remains challenging. We present Affective Agent, a three-layer reference architecture for personalized intervention reasoning under uncertainty on wearable-class hardware. It combines a compact sub-billion-parameter language model with physiological evidence, context, and user history to decide whether, when, and how to intervene, without cloud dependency or per-user retraining. The architecture is organized into three interacting layers (perception, personalization, and reasoning), adapting to individual users through host-managed structured memory evolution rather than per-user weight updates. We instantiate Affective Agent in indoor environmental quality control and evaluate it on held-out, simulator-generated longitudinal scenarios spanning physiological variation, context, signal quality, and intervention history. Results show that memory-driven personalization and two-pass structured reasoning improve intervention decisions within this synthetic evaluation. By moving the decision layer on-device, this work demonstrates a path from wearable state inference toward closed-loop, personalized intervention on wearable-class hardware.", "category": "cs.LG", "cluster": "Embodied \u0026 Domain-Specific Agents", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文提出了一个名为 \"Affective Agent\" 的三层参考架构，用于在可穿戴设备上进行个性化干预推理。虽然其应用场景是可穿戴设备的环境质量控制，但论文的核心贡献在于智能体机制的设计：它结合了小型语言模型，通过“主机管理的结构化记忆演化”来适应用户，并采用两步结构化推理来决定是否、何时及如何干预。这直接涉及了单智能体的规划、记忆机制以及通过经验进行自我演化和自适应优化的能力。根据筛选标准第一步中的“保留”规则，如果论文在特定领域中提出了新的 agent 机制（如记忆演化、结构化推理），则不应排除——领域是场景，机制才是贡献。因此，该论文符合“LLM智能体及其演化”的研究范围，特别是单智能体的记忆与自我演化方向。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决的核心问题是：在可穿戴级硬件上，如何在不确定性条件下进行个性化的干预推理——即决定**是否**（whether）、**何时**（when）以及**如何**（how）干预，且不依赖云端推理或 per-user retraining。当前可穿戴系统已能通过 EDA、BVP、HRV 等腕部信号可靠推断压力等生理状态，但从状态推断到及时、有意义的个性化干预之间存在一个未被填补的决策层缺口。一个简单的例子说明了这一缺口的本质：腕部传感器检测到心率升高，但该信号本身无法区分用户是在运动、因截止日期焦虑、还是仅仅喝了咖啡，因此无法确定何种响应在当前 context 和 prior history 下是恰当的。这一问题的复杂性来自两个实际约束：其一，现有干预策略多依赖预设决策规则，无法跨用户或随时间自适应；其二，同一生理信号在不同个体和情境下需要不同响应，而隐私、latency 和功耗约束使得持续的 off-device reasoning 或 per-user retraining 不可行。解决这一问题能将可穿戴计算从被动的状态推断推进到闭环的个性化干预，同时保持数据不出设备的隐私保证，对 affective computing、digital health 和 smart home 等领域具有直接的架构参考价值。\n\n### § 2 前人工作与不足\n\n该问题此前未被完整解决，论文从三个相关工作体系揭示了各自的不足。在 wearable intelligence 方面，已有稳健的 pipeline 支持从腕部信号进行 stress 和 thermal comfort 推断，hybrid edge-cloud 架构也使 on-device intelligence 日趋可行，但许多现有系统仍依赖 cloud-side inference 或 rule-based decision logic。Just-in-time adaptive interventions（JITAIs）旨在用户最易接受的时刻提供支持，但综述研究指出 limited adaptivity 和 receptivity 是持续存在的局限。关键不足在于：JITAIs 的决策逻辑通常基于预设规则，未能将生理证据、用户历史和 context 整合为一个统一的 on-device reasoning 问题——这并非简单的遗漏，而是因为缺乏在可穿戴级计算约束下执行结构化多步推理的架构原语。\n\n在 personalization 方面，subject-specific models 在 wearable emotion recognition 中显著优于 generalized baselines，将 sensor streams 与 contextual information 结合也能改善 longitudinal affect prediction。然而 deployed systems 中的个性化通常仍是粗粒度的。更深层的障碍在于：实现有意义的个性化传统上依赖 per-user weight updates，但在可穿戴场景下，隐私、latency 和功耗约束使 continual off-device reasoning 或 per-user retraining 不可行。此前的工作未解决这一矛盾，因为其方法框架将个性化与模型参数绑定，未探索将个性化从权重更新中解耦、转而通过 host-managed structured memory evolution 实现的路径。\n\n在 agentic reasoning on edge hardware 方面，TinyML 和 on-device inference 的进展已使小模型在边缘执行 function calling（如 TinyAgent）和 multi-agent coordination（如 CAMPHOR）成为可能。但这些系统聚焦于 tool routing 和 API execution，而非 memory-conditioned intervention reasoning。其不足的本质在于：这些系统假设输入是结构化的 API 请求，输出是确定性的工具调用，而干预推理需要处理 noisy physiological observations、conflicting evidence 以及随时间累积的用户偏好——这要求 bounded decision-making under resource constraints 与 structured memory 的耦合，而此前工作并未触及这一组合需求。此外，sub-billion-parameter 语言模型因 parametric capacity 有限，无法在隐式条件下可靠执行多步干预推理，此前也没有工作通过 explicit two-pass structured reasoning 和 reasoning-complexity curriculum 来补偿这一容量限制。", "core_insight": "### § 3 重建作者的思考路径\n\n从 affective computing 的已有进展出发，可穿戴设备已经能可靠推断生理状态（如通过 EDA、HRV 检测压力），但这只解决了感知层的问题。真正的缺口在于决策层：系统检测到压力后，应该干预、等待还是放弃？何时干预？用什么方式干预？现有的 JITAIs 试图填补这个缺口，但它们依赖预设的决策规则，无法跨用户、跨时间适应。更关键的是，同一生理信号在不同上下文中含义截然不同——心率升高可能是运动、压力或咖啡所致——这意味着干预决策必须联合考虑生理证据、上下文和用户历史，而简单的阈值逻辑无法胜任。\n\n个性化是显而易见的需求，但在可穿戴设备上实现个性化面临结构性矛盾。传统方法要么需要 per-user retraining，要么依赖持续的云端推理，但隐私、延迟和功耗约束使得这两种方案都不可行。研究者面临的问题是：如何在不能重训练模型、不能依赖云端的条件下，让系统记住用户偏好并据此调整干预？突破这个矛盾的线索来自几个方向的交汇。首先，TinyML 和 sub-1B language model 的进展表明，在边缘设备上运行小型语言模型进行结构化推理已经可行，但这类模型容量有限，无法内化大量领域知识或可靠执行复杂的多步推理。其次，认知科学中 episodic memory 与 semantic memory 的区分提示了一种解法：如果将用户状态从模型权重中剥离，转而存储在设备端的结构化外部记忆中，个性化就不需要动模型本身。最后，小模型在隐式推理上的不可靠性可以通过显式的推理流程来补偿——如果将推理拆分为明确的\"先评估、后验证\"两步，就能在有限参数下迫使模型检查上下文一致性和历史匹配度，从而提高决策可靠性。将这些线索整合起来，便得到了 Affective Agent 的雏形：一个固定的小型语言模型作为推理引擎，配合设备端结构化记忆承载用户偏好，通过显式两步推理流程联合处理生理证据、上下文与历史，全部计算在本地闭环完成。\n\n### § 4 核心 Intuition\n\n在资源受限的可穿戴设备上，实现个性化干预的障碍不在于模型不够大，而在于我们试图让模型同时承担推理和记忆用户偏好的双重任务。如果将个性化与模型权重解耦——用一个固定的 sub-1B 语言模型负责推理，而把用户的历史和偏好交给设备端的结构化记忆来维护——就能在不重训练的前提下实现个性化。同时，为了弥补小模型隐式多步推理的不可靠性，将决策过程显式拆分为\"评估证据\"和\"验证上下文与历史\"两步，迫使模型在行动前进行自我审查。这样，有限的参数容量被结构化的外部记忆和显式推理流程所补偿，使得在边缘硬件上完成闭环的个性化干预成为可能。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n原始传感器信号 (EDA/BVP/HRV)\n    │\n    ▼\n┌───────────────┐   ┌─────────────────┐\n│ 感知层         │   │ 冻结分类器        │\n│ 5min特征提取   │──▶│ XGBoost/RF/KNN  │\n│ 统计+信号质量  │   └────────┬────────┘\n└───────┬───────┘            │\n        └─────────┬──────────┘\n                  ▼\n         结构化证据\n                  │\n    ┌─────────────┼─────────────┐\n    │ 个性化层     │             │\n    │ Episodic(FIFO) Semantic   │\n    │ Preference Model          │\n    │ (default→provisional     │\n    │  →learned)               │\n    └─────────────┬─────────────┘\n                  │\n                  ▼\n    ┌─────────────────────┐\n    │ 推理层 Sub-1B LLM   │\n    │ Pass1: 证据评估     │\n    │ Pass2: 验证修正     │\n    └──────────┬──────────┘\n               │\n               ▼\n    Bounded Decision\n    (intervene/wait/abstain)\n               │\n               ▼\n    Host验证 → 执行器更新(IEQ)\n               │\n               └────▶ 反馈更新记忆(闭环)\n```\n\n论文的 pipeline 分为训练与推理两条路径。\n\n**训练路径**包含三个构建模块（§4）：\n\n1. **合成数据生成**（§4.1）：构建14名合成用户（20–30岁），生理先验分别来自 WESAD（压力）、SWELL-KW（认知负荷）、EnGage（热舒适）三个数据集。数据按时间层次组织：一个 batch 代表一次持续占用会话，其中记忆与环境状态跨窗口延续；每个 batch 内含多个 scenario，每个 scenario 为25分钟局部片段，由5个连续5分钟决策窗口组成。生成信号时注入传感器掉线、信号丢失、削波、接触不良和运动伪影等真实噪声。Ground truth 是从模拟器潜在状态导出的有界监督干预目标，而非生理标签或自我报告，表示为可接受范围而非精确标量。\n\n2. **推理复杂度课程**（§4.2，Table 1）：训练样本按 T0–T5 六个层级组织，每个层级由信号清晰度、偏好生命周期成熟度、上下文约束和先前结果历史的交互定义。T0（Population Default）对应清晰信号且无确认偏好的场景，期望置信度0.80–0.95；T5（Deep Reasoning）对应多因素不确定性的新颖或真正模糊场景，期望置信度0.30–0.55。配额管理预算维持各层级比例覆盖，防止模型被最频繁场景主导。\n\n3. **程序化两遍推理监督**（§4.2）：两遍推理链从 ground-truth 场景条件、偏好历史和干预结果确定性地程序化生成，而非从大模型蒸馏或通过无约束 chain-of-thought 产生。每个推理步骤从已知模拟器状态确定性导出，保证监督的内部一致性。\n\n**推理路径**在设备上运行，形成闭环（§3）：\n\n4. **感知层**（§3.1）：Host 运行时对原始传感器流按5分钟窗口进行本地特征提取，计算统计聚合与信号质量指标。同时运行三个冻结的任务特定分类器——3-class XGBoost（压力：baseline/stress/amusement）、Random Forest（认知负荷 vs 无负荷）、binary KNN（热舒适 vs 不舒适）。分类器输出作为辅助证据而非 ground truth，感知层报告观察但不决定是否行动。\n\n5. **个性化层**（§3.2）：维护两类结构化记忆——short-term episodic memory（FIFO buffer，容量5，存储近期干预事件：干预模态与值、上下文、时间戳、测量有效性）和 long-term semantic memory（从累积观察中学习的泛化知识，如用户早晨基线较低或认知负荷下热调节有效）。Preference model 按三阶段生命周期演化：population default（前2个日历日，冷启动）、provisional（ emerging 个体模式开始影响决策）、learned（确认偏好优先，需至少20次反馈和5天活动方可进入）。记忆以紧凑的 per-user JSON 本地持久化，语言模型跨调用保持无状态。\n\n6. **推理层**（§3.3）：fine-tuned sub-1B 语言模型接收当前5分钟生理聚合、冻结分类器输出、可见上下文、当前环境条件、以及 short-term 和 long-term memory 的有界摘要。推理分两遍进行：Pass 1 将证据组织为显式评估字段（生理解释、信号质量、分类器支持、历史模式、上下文适配、环境失配、预期效果）；Pass 2 验证并修正该判断，检查历史一致性、上下文适当性、偏好对齐和置信度校准。模型必须返回 schema-constrained 的 decision contract，输出 bounded action（intervene/wait/abstain）和推理字段。\n\n7. **Host 验证与执行**（§3.3）：Host 在推理时验证 proposed action 是否在安全边界内，通过结构化更新规则管理记忆持久化，仅在运行时约束满足时执行执行器更新。决策结果反馈到个性化层更新记忆，关闭完全 on-device 的闭环。无数据离开设备。\n\n### § 6 核心数学推导\n\n本文无形式化数学推导。论文核心贡献是架构设计与方法实现，未提出新的数学公式或理论证明。跳过此节。\n\n### § 7 实验设计与结论\n\n论文围绕五个设计属性提出问题并通过实验验证。\n\n**Sub-1B 模型能否在设备上执行结构化干预推理？** 论文在1600个 held-out 模拟器生成的纵向决策点上，比较 Qwen2.5-0.5B 和 Qwen3-0.6B（均以相同 LoRA 配置 fine-tune，导出为 Q8_0 GGUF）与确定性规则基线的决策质量。结果显示两个模型分别达到 0.811 和 0.782 的 action accuracy，较规则基线（0.482）提升 30.0 和 32.9 个百分点；schema compliance 均达到 0.993。这表明 sub-1B 模型在结构化输出约束下能可靠执行干预推理，而非仅完成分类任务。\n\n**Host 管理的记忆能否在不进行 per-user 重训练的情况下改善个性化干预？** 论文设计 no-memory 消融实验，屏蔽所有 prompt 可见记忆输入但保留两遍推理。移除记忆后 macro-F1 从 0.616 降至 0.501，modality accuracy 从 0.864 降至 0.605——后者降幅尤为显著，说明记忆条件化主要支持正确的干预路由（选择何种模态），而非粗粒度的动作选择（是否干预）。这验证了个性化依赖于 host 管理的演化状态而非用户特定的权重更新。\n\n**显式两遍推理是否提升 compact 模型的可靠性与置信度校准？** 论文设计 one-pass 消融实验，保留记忆但移除验证 pass。移除后 macro-F1 降至 0.463，ECE 从 0.301 恶化至 0.377。定性分析表明，Pass 2 会细化模态特定推理、在证据薄弱时抑制个性化、并在初始评估与上下文或历史冲突时修正置信度。这表明验证 pass 不仅提升决策质量，还提供了使输出可解释、可审计的结构化推理。\n\n**架构在边缘硬件上的部署可行性如何？** 论文在 Raspberry Pi Compute Module 5 上测量 edge efficiency。Qwen3 和 Qwen2.5 的总延迟分别为 83.4s 和 53.7s，占5分钟感知间隔的 27.8% 和 17.9%；解码阶段分别占 75.9% 和 84.7% 的延迟。RAM 利用率为 23.1% 和 28.3%，峰值 SoC 温度 63.9°C 和 59.5°C。结论是部署可行，但因推理占用感知间隔的显著比例，未来部署应在执行前重新验证用户上下文并丢弃过期决策。\n\n**模型置信度校准是否充分？** 两个 agent 的 ECE（0.255–0.301）均高于规则基线（0.097），表明报告置信度与实际准确率对齐较差，这是当前 QoS 的主要局限。Host 通过强制动作边界和低于置信阈值时要求弃权来缓解此问题。论文指出未来应评估 post-hoc calibration 和 calibration-aware training。", "additional_insights": "### § 8 Take-aways\n本文提出了 Affective Agent，一个用于 wearable systems 的三层 reference architecture（perception, personalization, reasoning），实现了在设备端进行个性化干预推理，无需云端依赖或 per-user retraining。其核心机制是结合 sub-billion-parameter language model 与结构化记忆（episodic 和 semantic memory），通过 host-managed memory evolution 实现个性化，而非更新模型权重。推理层采用 two-pass structured reasoning，第一遍组织证据进行初步评估，第二遍验证历史一致性、上下文和偏好，从而提高 compact model 决策的可靠性。训练采用 synthetic scenario generation 和 reasoning-complexity curriculum（T0-T5），使 sub-1B 模型在资源受限的边缘设备上学习处理噪声、冲突证据和不确定性。在室内环境质量（IEQ）控制的合成数据集上评估，Affective Agent 的 action accuracy 达到 0.78-0.81，显著优于 rule-based baseline（0.48）。Ablation 结果表明，memory-driven personalization 主要提升了 modality accuracy（干预路由的准确性），而 two-pass reasoning 显著改善了 macro-F1 和 confidence calibration (ECE)。在 Raspberry Pi CM5 上的边缘效率测试显示，该系统可以在 5 分钟的 sensing interval 内完成约 900 token 的推理，证明了在 wearable-class hardware 上的部署可行性。\n\n### § 9 最脆弱的假设\n本文最脆弱且失败代价最大的假设是：通过 synthetic scenario generation 和 reasoning-complexity curriculum 训练的 sub-1B 模型，能够将其学到的推理能力泛化到真实世界的 wearable 干预场景中。这个假设在实际中可能不成立，因为合成数据虽然基于 WESAD、SWELL-KW 等真实数据集的生理先验生成，但无法完全捕捉真实世界中复杂的用户行为、情绪驱动的拒绝、情境偏好的突变以及竞争性的任务和社交需求。真实环境中的生理信号噪声分布、传感器佩戴问题、用户对干预的延迟反馈等，可能与合成数据的假设存在显著差异，导致模型在真实场景中决策崩溃。论文提供的证据仅限于在合成环境中的内部一致性验证和注入 realistic artifacts，明确承认合成数据并非旨在重现特定的真实人群，且向真实用户行为变异的迁移仍需未来的实地研究验证。缺少在真实人类用户身上的纵向评估数据，无法证明在合成数据上训练的模型在面对真实世界不可预测的生理反应和行为反馈时，依然能保持有效的个性化干预。\n\n### § 10 最小复现实验\n如果有一周时间，可以验证 two-pass structured reasoning 是否真的比 single-pass reasoning 在 sub-1B 模型上带来更好的决策质量和 confidence calibration。使用论文中提到的合成数据生成方法，或者直接构建一个小规模的包含冲突证据和不确定性的合成测试集（例如 100-200 个决策点，包含生理信号、上下文和历史记忆的 JSON 输入）。微调一个 sub-1B 模型（如 Qwen2.5-0.5B 或 Qwen3-0.6B），实现两个推理路径：一个是包含第一遍评估和第二遍验证的 two-pass 结构，另一个是只有单次推理的 one-pass 结构。在相同的测试集上，测量两者的 action accuracy、macro-F1 和 ECE (Expected Calibration Error)。如果 two-pass 的 macro-F1 显著高于 one-pass（例如提升 0.1 以上），且 ECE 更低，则支持论文的 claim；如果两者表现相近或 one-pass 更好，则反驳了 two-pass 结构对 compact model 必要性的 claim。", "research_value": "### § 11 最强反例设计\n\n要对该论文进行最有力的攻击，我会在真实世界中设计一个“补偿性生理反馈引发的干预振荡”场景，并据此提出一个替代解释：论文所展示的高 action accuracy 并非源于 sub-1B LLM 的真正结构化推理能力，而是模型对合成模拟器确定性状态转移规则的隐式记忆。论文的合成数据虽然注入了传感器噪声，但其 ground truth 是从模拟器潜在状态导出的有界监督目标，这意味着生理状态、干预动作与结果之间存在固定的马尔可夫链式映射。然而在真实世界中，用户的生理状态对干预具有非线性的补偿反应。例如，当系统检测到用户因认知负荷导致心率升高并触发热舒适干预（如降低环境温度），用户可能因突然变冷而产生应激性的 EDA 飙升与血管收缩，这一“伪信号”会再次触发系统的压力或热舒适干预，形成“干预-误判-再干预”的闭环振荡。我设计的反例实验将构建一个具有对抗性延迟反馈的测试集：在 5 分钟的 sensing interval 后施加干预，但令用户的生理基线在干预后发生与模型预期相反的偏移，同时引入与干预动作强耦合的伪影噪声。如果将 Affective Agent 部署于此动态环境中，其依赖的 short-term episodic memory 将被相互冲突的历史记录污染，而其 two-pass reasoning 由于本质上是在拟合静态模拟器的逻辑，将无法识别这种由自身干预引发的因果错位。如果模型在此场景下陷入持续的无效干预循环，且 confidence calibration 严重失效，便能证明其在合成数据上的表现只是对特定模拟器规则的过拟合，而非具备应对真实生理不确定性的泛化推理能力。\n\n### § 12 Follow-up Research Idea\n\n本研究的核心局限在于将干预推理视为一个被动的分类与路由任务，即系统仅在检测到异常生理状态后才决定动作，而忽略了干预本身作为一种“干预性探测”能够主动揭示用户状态的本质。这一局限驱动了一个全新的研究 framing：从“被动响应式推理”转向“主动认识论干预”。在真实场景中，许多生理信号（如心率升高）具有高度模糊性，被动观察往往无法低成本地消除这种不确定性；但通过施加一个微小的、安全的“试探性干预”（如轻微改变环境温度或发出极低强度的触觉提示），系统可以观察用户生理反馈的轨迹，从而主动区分用户是在运动、焦虑还是处于静息代谢变化中。为实现这一目标，我们可以借鉴 Active Inference 和 Causal Bandits 领域的方法，将 on-device reasoning 重新构建为在部分可观测马尔可夫决策过程（POMDP）下的信息收益与干预成本的权衡优化。在这个新框架中，sub-1B LLM 的任务不再是直接输出最终干预模态，而是输出一个“认识论动作空间”，通过评估不同试探动作对消除当前状态不确定性的预期信息增益来指导下一步交互。第一个实验将设计一个包含隐混淆变量的生理反馈仿真环境，对比传统被动响应架构与 Active Inference Agent 在信号模糊场景下的表现：被动系统仅在 5 分钟窗口末尾做出一次盲目干预，而主动系统被允许在前 2 分钟施加一个低成本的探测刺激，并利用后 3 分钟的生理响应更新信念，再决定是否需要实质性干预。这一提议与已有工作的根本区别在于，它将 wearable device 从一个单纯的“状态读取器+执行器”转变为一个主动构建用户因果模型的“实验者”，把推理的复杂性从静态的 chain-of-thought 转移到动态的 hypothesis testing 上，从而在根本上解决 sub-1B 模型因 parametric capacity 有限而无法在单次观察中处理深层不确定性的问题。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Reina Mun\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zishen Wan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Vijay Janapa Reddi\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Harvard University\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "Affective computing 推动了 wearable state inference，但关于是否、何时以及如何干预的 on-device reasoning 仍然具有挑战性。我们提出了 Affective Agent，这是一种在 wearable-class hardware 上进行不确定性下个性化干预推理的三层参考架构。它将紧凑的 sub-billion-parameter language model 与 physiological evidence、context 和 user history 相结合，以决定是否、何时以及如何干预，且无需 cloud dependency 或 per-user retraining。该架构组织为三个交互层（perception、personalization 和 reasoning），通过 host-managed structured memory evolution 而非 per-user weight updates 来适应个体用户。我们在室内环境质量控制中实例化 Affective Agent，并在涵盖 physiological variation、context、signal quality 和 intervention history 的 held-out、simulator-generated longitudinal scenarios 上对其进行评估。结果表明，memory-driven personalization 和 two-pass structured reasoning 在此 synthetic evaluation 中改善了干预决策。通过将 decision layer 移至 on-device，这项工作展示了一条从 wearable state inference 走向 wearable-class hardware 上 closed-loop, personalized intervention 的路径。"}, {"title": "Online Video Agent Harness for Long Video Understanding", "arxiv_id": "2609.12818", "authors": "Sen Yang, Boqiang Duan, Jing Yang, Weihao Bo, Jie Liu, Boyuan Tong, Ze Feng, Wenkang Zhang, Jingdong Wang, Hua Wu", "summary": "Long video understanding often behaves like a visual needle-in-a-haystack problem: query-relevant evidence is sparsely distributed across long temporal spans, while packing dense frames into a single VLM context incurs \\textit{context rot} and high cost. Existing video agents often rely on query-agnostic offline preprocessing or ad hoc tool sets, which can miss query-specific details and waste computation. In this work, we present VideoXAgent, a purely online video-agent harness for long video understanding that starts from the given video file and user query, plans and decomposes the task, invokes specialized expert tools on demand, and aggregates multimodal evidence to produce a final answer while resolving conflicts among observations. To support this on-demand invocation, we design a suite of heterogeneous expert tools guided by a data-driven taxonomy of atomic capabilities, spanning scripts, VLMs, and domain models (e.g., detection, OCR, ASR, face recognition). The harness further enforces objective evidence prompting and budget-aware control to curb hallucination and non-termination. Across Video-MME-Long, LongVideoBench-Long, LVBench, and MINERVA, VideoXAgent is competitive with frontier LMMs and video agents under a smaller context footprint---about 50k tokens of agent context per sample, even on hour-long videos. In particular, on complex video-reasoning benchmarks such as MINERVA, it matches this level while using only about 15\\% of the context of a 1,024-frame dense-packing baseline. Notably, the harness remains effective with a visually weak or even text-only orchestrator, suggesting that strong long-video understanding can emerge from progressive agentic evidence seeking rather than from packing the full video into a single context. Project page: https://go-agent-x.github.io/video_agent_harness/", "category": "cs.AI", "cluster": "Embodied \u0026 Domain-Specific Agents", "tags": ["cs.AI"], "filter_reason": "这篇论文提出了 VideoXAgent，一个用于长视频理解的在线视频智能体框架。其核心贡献在于智能体机制的设计，包括任务的规划与分解、按需调用异构专家工具、多模态证据聚合与冲突解决，以及预算感知控制。这属于“构建LLM智能体的方法论或新框架”，符合单智能体方向中的规划和工具使用研究焦点。\n\n虽然论文的应用场景是长视频理解（涉及多模态与视觉），但根据筛选标准的第三步，多模态技术在此处是作为智能体感知环境和调用的专家工具，而论文的研究核心是 Agentic 机制（如何规划、何时调用工具、如何聚合证据）。此外，论文明确探讨了 agent harness 的设计，展示了强大的长视频理解能力可以从渐进的智能体证据寻求中产生，这直接有助于理解和改进智能体能力。因此，该论文符合您的核心研究范围。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的核心研究问题是：如何在不依赖离线预处理或预构建全视频索引的前提下，纯粹在线地理解长视频并准确回答用户查询。长视频理解通常表现为“大海捞针”问题，与查询相关的证据稀疏分布在漫长的时间跨度中。如果将密集采样的帧直接塞入单个 VLM context，不仅会引发 context rot，还会带来极高的计算成本。解决这一问题具有重要价值，因为现有的视频代理往往依赖与查询无关的离线预处理或临时拼凑的工具集，这不仅会遗漏查询特定的细节，还浪费了大量计算资源。本文提出的 VideoXAgent 框架通过按需调用专家工具获取多模态证据，在仅使用约 50k tokens 的 agent context 下，即可在小时级长视频上实现与前沿 LMMs 相当的性能，甚至在使用视觉能力较弱或纯文本的 orchestrator 时依然有效，证明了强大的长视频理解能力可以源于渐进式的代理证据寻求，而非将整段视频打包进单一 context。\n\n### § 2 前人工作与不足\n该问题此前未被充分解决。基于直接模型理解的方法（如 Qwen2.5/3-VL、Kimi-K2.5、VideoThinker、LongVT 等）通常将动态采样或低分辨率的帧打包进 context window 以提供广泛的时间覆盖。然而，当视频中相关信息的分布无法预先假设时，均匀下采样存在两大缺陷：一是可能错过包含关键证据的帧，二是引入大量无关帧干扰视觉推理。此外，这些方法大多将帧打包进单一模型 context，未充分利用语音、屏幕文本等非视觉信号，也未将长视频理解视为跨模态的多步证据寻求过程。\n\n现有的视频代理系统（如 DVD 和 HAVEN）虽然在 agentic reasoning 上取得进展，但仍依赖一个与查询无关的预处理阶段：将视频切分为固定长度片段、均匀采样帧并离线解析为中间数据库或分层记忆。这种两阶段流水线继承了固定采样的局限性，容易丢失预处理时未保留的查询特定证据，且在查询开始前就产生全视频处理的高昂开销。另一方面，现有的 tool-augmented video agents（如 VideoAgent、VideoSeek）在工具选择上往往是 ad hoc 的，主要基于人类直觉，缺乏对复杂和长尾场景所需能力的系统性刻画，导致工具冗余、遗漏关键原子能力或接口过于模糊而无法可靠编排。这些不足的根本原因在于，长视频中信息的分布无法预先假设，且复杂视频理解所需的原子能力难以从宏观任务标签或主观假设中可靠推断，而现有 benchmark 主要标注问题格式或粗粒度任务类型，无法为查询分解提供有效指导。", "core_insight": "### § 3 重建作者的思考路径\n\n长视频理解的核心困难从一开始就很清楚：一段几十分钟到几小时的视频，即使以 1 FPS 稀疏采样也会产生数千帧，若全部塞入 LMM 的 context window，轻则超出有效 context length 引发 context degradation，重则引入大量无关帧干扰视觉推理。现有的 LMM 方案（如 Qwen2.5-VL、Kimi-K2.5）依赖 uniform downsampling 或低分辨率帧来提供时间覆盖，但这种策略有一个根本矛盾：query-relevant evidence 的分布无法预先假设，均匀采样既可能错过关键帧，又会引入无关帧。即使 VideoThinker、LongVT 等方法尝试先推理相关时间区间再 dense sampling，它们仍将帧打包进单一 context，且未充分利用 speech、on-screen text 等非视觉信号，也未将长视频理解视为多步证据寻求过程。\n\nAgentic paradigm 是自然的下一步：agent 可以自适应地解释视频内容和 query，分解问题，选择性调用工具获取证据。但现有 video agents（如 DVD、HAVEN）仍依赖 query-agnostic 的 offline preprocessing——先将视频分割、均匀采样、解析成数据库或层次化记忆，然后才开始 query-specific 的推理。这种两阶段 pipeline 继承了固定采样的局限：preprocessing 阶段未保留的 query-specific evidence 会永久丢失，且对每段视频都产生全量计算开销，无论最终 query 是否需要。与此同时，这些系统的 tool 设计往往是 ad hoc 的，基于人类直觉而非系统能力分析，导致工具冗余、遗漏重要 atomic capability，或接口过于模糊无法可靠编排。\n\n从这些失败模式中可以提炼出几个关键线索。第一，长视频理解所需的信息稀疏分布在时间和模态上，全量感知既不必要也不可行；真正需要的是 query-conditioned 的按需获取。第二，工具设计需要 principled guidance，而这种 guidance 不应来自主观假设或粗粒度任务标签，应来自实际推理过程中暴露的能力需求。第三，ReAct-style agent 存在 non-termination 风险——poor planning 导致无用的工具调用循环，消耗 context 却不产生答案；compositional agent 还面临 evidence contamination，即 ungrounded 的中间 VLM observation 被后续步骤当作事实传播。这些线索共同指向一个方向：构建一个纯 online 的 agent harness，从 raw video 和 query 出发，以 data-driven 的 capability taxonomy 指导工具设计，通过渐进式探索按需获取多模态证据，并用 budget control 和 objective evidence prompting 约束 agent 行为。\n\n### § 4 核心 Intuition\n\n长视频理解的瓶颈不在于模型能\"看\"多少帧，而在于能否在稀疏分布的多模态证据中精准定位并验证 query-relevant 信息。先前方法要么将全视频压缩进单一 context 导致 context rot 和关键帧丢失，要么进行 query-agnostic 的离线预处理而无法针对性保留证据——两者的共同问题是感知与 query 脱钩。VideoXAgent 的核心 intuition 是：将视频视为 black box，让 agent 根据 query 动态分解任务、按需调用异构 expert tools 获取多模态证据，只处理当前 query 所需的视频片段，通过渐进式探索和冲突解决实现精准的证据定位与聚合——从而以极小的 context footprint 达到与 frontier LMM 相当的准确率，甚至在 visually weak 或 text-only 的 orchestrator 上同样奏效，证明长视频理解的能力可以来自 agentic tool use 而非单一模型的全量感知。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n输入: V(原始视频文件) + Q(用户查询)\n      │\n      ▼\n┌─────────────────────────────────────────────┐\n│ 能力分类法挖掘 (离线, 一次性)                  │\n│ MINERVA推理轨迹 → LLM提取 → 归一化/聚类       │\n│ → 22原子能力(5大类) → 指导设计 60+ 专家工具 T  │\n└──────────────────┬──────────────────────────┘\n                   │ T (工具空间)\n      ┌────────────▼─────────────────┐\n      │   ReAct Agent 循环 (推理时)   │\n      │                              │\n      │  Think\u0026Plan → Decompose      │\n      │      ▲           │           │\n      │  Reflect ◄─── Act(调用工具)   │\n      │      │           │           │\n      │  Continue     Observe        │\n      └────────┬─────────────────────┘\n               │\n               ▼\n          最终答案 A\n```\n\n**能力分类法挖掘（离线，一次性）。** 输入为 MINERVA benchmark 中的人类专家推理轨迹 $(Q, R, A, O)$ 四元组。具体操作分四步（§3.2, Appendix C）：(1) 用 LLM 从推理轨迹 $R$ 中反向提取原子能力，强制输出 JSON schema 并引用 `reasoning_evidence` 防止 hallucination；(2) 对提取结果做语法归一化，再用 `all-MiniLM-L6-v2` embedding 的 cosine similarity 将低频长尾项合并到高频项；(3) 对合并后的能力名称做 K-means 聚类，以 silhouette score 选 $K$，人工审核后得到 86 簇；(4) 最终精炼为 22 个原子能力，分属 Visual Perception、Temporal Relation、Spatial Relation、Audio-Visual、High-Level Reasoning 五大类（Table 6）。输出为该分类法，作为工具设计的 blueprint。需强调：仅提取高层能力分类，不暴露任何 ground-truth 实例数据。\n\n**专家工具设计（离线，一次性）。** 输入为上述 22 项原子能力分类法。将每项能力映射到一个或多个具体工具，覆盖 scripts、VLMs、domain models 三类后端（§3.2, Table 7, Table 9）。例如 Visual Content Understanding 映射到 `inspect_image`/`query_segment_detail`，OCR 映射到 PaddleOCR 系列，Speech Transcription 映射到 WhisperX，Object Perception 映射到 Grounding-DINO/DINO-X。High-Level Reasoning 类能力（如计数、序数推理）不对应单一工具，而是实现为多步 ReAct workflow（如 `generate_thumbnail_grid` → `inspect_image` → `extract_frame` → LLM aggregation）。输出为 60+ 原子工具的完整工具集 $T$，每个工具指定 media scope、输入参数和预期输出格式。\n\n**ReAct Agent 编排循环（推理时）。** 输入为原始视频路径 $V$、查询 $Q$、工具集 $T$ 和执行预算 $B$。Agent 维护状态 $s_k = (Q, H_k, b_k)$，其中 $H_k$ 为累积的工具调用、观察和证据，$b_k$ 为剩余预算（§3.1.1, §3.3.1）。循环包含四步：\n\n- **Think \u0026 Plan**：Agent 仅从查询出发推理，先用基础工具获取视频时长，可能调用 audio/subtitle 工具获取初步线索，形成粗略计划并将查询分解为多个 subproblem，记录在执行轨迹中。\n- **Decompose \u0026 Act**：对每个 subproblem，将所需能力映射到原子工具或组合 workflow，实例化任务特定参数（如子查询、采样帧、空间区域、时间戳），调用后端分析 bounded media scope 并返回 observation。\n- **Observe \u0026 Reflect**：将 observation 与工具调用和 media scope 关联，判断是否解决当前 subproblem，或揭示缺失、模糊、冲突的证据。\n- **Continue or Finish**：若所需证据未解决则更新计划继续循环；若证据充分或预算不足以支撑下一轮，则停止工具调用并合成最终预测。\n\n**客观证据提示（推理时，嵌入工具调用中）。** 每个 VLM 工具被包裹在 objective-evidence contract 下（§3.3.2）：将传入子查询视为待验证的 hypothesis 而非既定事实；模型只能基于当前调用提供的 media（采样帧、图像裁剪、缩略图网格等）做出响应；辅助信号（字幕、OCR、检测器输出）须与直接可见证据显式分离；模型不得在证据不足时断言身份、意图、因果、精确计数等。每个 VLM 工具返回结构化响应，包含 `visual_evidence`、`answer` 和 `uncertainty` 字段，使编排器能区分 grounded observation 与 inference，并在多工具证据聚合中传播不确定性。\n\n**证据聚合与冲突解决（推理时）。** 每个 observation 关联其来源工具和时间/空间引用后加入证据状态（§3.3.2）。Agent 按与查询的相关性和特异性聚合互补的视觉、文本、音频和结构化观察，而非假设所有输出等可靠。当观察冲突时，先检查是否指向不同时间、区域、实体或解释；未解决的冲突触发 targeted verification（用 refined input 或替代工具重新验证）。最终答案合成仅使用冲突解决后保留的证据，区分直接观察与 agent 推理。\n\n**自适应视频长度路由（推理时）。** Agent 先获取视频元数据，根据查询相关证据能否 compactly 纳入可用 context 来选择路径（§3.3.3）。Short-video path：相关内容可在紧凑 context 内检查时，优先直接 VLM 分析以保持全局事件连续性，仅在需要细粒度信息时选择性调用专家工具。Long-video path：证据无法紧凑覆盖时，先从 overview、scene、subtitle、audio 观察构建稀疏时间地图，再定位候选区间并在其中密集采样或调用专用工具；证据不完整则扩展相邻区间、增加采样密度或切换模态，但不重复采样全视频。\n\n**预算控制（推理时，middleware）。** 两种机制防止 non-termination（§3.3.3）：(1) Hard step limit with forced answering——每条轨迹上限 $L=125$ node executions（约 42 次工具调用），剩余预算不足以支撑下一轮时禁用所有工具（`tool_choice=none`），强制最终模型调用输出文本预测；(2) Progressive budget warnings——当消耗达到 $L$ 的 65%/80%/90% 时分别注入一次升级消息（Notice/Warning/Critical），指示 agent 停止冗余验证、用多数投票解决冲突并提交最终答案。\n\n### § 6 核心数学推导\n\n本文无形式化数学推导。论文将问题形式化为 $A = \\text{Agent}(V, Q, T, B)$，并定义 agent 状态 $s_k = (Q, H_k, b_k)$，但这些是符号定义而非推导。能力挖掘中使用 K-means 聚类并以 silhouette score 选择簇数 $K$（扫描 10–100，最优收敛于 86 簇，silhouette score 0.138），属于标准无监督方法的直接应用，未涉及自定义数学推导。因此本节跳过。\n\n### § 7 实验设计与结论\n\n**问题一：纯在线 agent 能否在远小于 dense-packing 的 context 预算下达到前沿 LMM 的准确率？** 作者在 Video-MME-Long、LongVideoBench-Long、LVBench 和 MINERVA 四个 benchmark 上将 VideoXAgent 与前沿 LMM（Doubao-Seed-2.0-pro、Gemini-3.1-Pro）及已有 video agent（DVD、VideoSeek、HAVEN）对比，同时报告准确率和 per-example context token 用量。结果显示 VideoXAgent 在约 50k agent context 下达到 85.1%（Video-MME-Long）、76.5%（LVBench）、65.7%（MINERVA），与前沿 LMM 竞争力相当，而视觉输入帧数和 context 远小于 dense-packing baseline。在 MINERVA 上，它仅用约 15% 的 1024-frame baseline context 即达到同等水平。\n\n**问题二：各工具组是否各自贡献互补的证据，而非冗余？** 作者在 LongVideoBench-Long 的 150 题分层子集上做消融（Table 3），依次移除 sequence-level VLM tool、single-image VLM tool、visual expert tools（检测/分割/跟踪/OCR）、audio/subtitle tools。移除任一组均导致准确率下降且失败模式互补：移除 sequence-level VLM 和 audio/subtitle 各降 6.66 个百分点，移除 single-image VLM 降 5.33，移除 visual expert 降 3.33。结论是分层工具设计覆盖了长视频推理的不同方面，各组件贡献不可替代。\n\n**问题三：objective-evidence prompting 能否减少 evidence contamination 并提升可靠性？** 在相同 orchestrator、VLM tool 和工具组配置下，关闭 objective rules 后准确率从 75.33% 降至 72.60%（Table 3 末行）。无 hypothesis-style framing 和显式 uncertainty 报告时，VLM 工具输出更易将直接可见证据与辅助信号混淆，使未经证实的假设进入证据状态。该可靠性提升仅带来约 0.6k token 的 modest context 增加。\n\n**问题四：预算控制能否消除 non-termination 并降低成本？** 作者从五个 benchmark 中用 Gemini-3.1-Pro 编排器收集所有预算耗尽未返回答案的 case，构成 217 题的 loop-prone stress set（Appendix B.5），再用 Kimi-K2.6 编排器做配对消融。在 $L=125$ 下，无 warning 时 14.7% 的 run 无答案；启用 warning 后非终止降为 0%，端到端准确率从 35.0% 升至 43.8%，且平均 token 用量从 47.5k 降至 42.0k（Table 5）。扫描 $L \\in \\{75, 100, 125, 150\\}$ 显示准确率在 $L=125$ 达峰，$L=150$ 无进一步提升而成本持续增长（Table 4）。\n\n**问题五：视觉能力弱的编排器能否仅靠 agentic tool use 达到前沿水平？** 作者在 MINERVA 上用 Claude-Opus-4.6（编码强但视觉弱）和 GLM-5.2（纯文本 LLM，无视觉能力）作为编排器，均搭配 Qwen3.6-35B-A3B 作为 VLM tool backend。两者分别达到 65.7% 和 65.4%，与前沿 LMM（62.4%–66.5%）持平（Table 2）。这表明长视频理解性能可从渐进式 agentic evidence seeking 中涌现，而非依赖将完整视频塞入单一 context。", "additional_insights": "### § 8 Take-aways\n\nVideoXAgent 提出了一种 purely online 的 video agent paradigm，不依赖任何 offline preprocessing 或 pre-built index，直接从 raw video file 和 user query 出发，通过 ReAct-style loop 按需调用 expert tools 获取 evidence。其核心创新在于通过 data-driven 方式从 MINERVA 人类专家 reasoning traces 中挖掘出 22 个 atomic capabilities（跨 5 个 macro categories），以此为指导设计了 60+ 个 heterogeneous expert tools（涵盖 VLM、detection、OCR、ASR、face recognition 等 backend），而非 ad hoc 地拼凑工具集。系统通过 objective evidence prompting 约束 VLM tool 输出（将 sub-query 视为待验证 hypothesis 而非既定事实），并配合 budget-aware control（hard step limit L=125 + progressive warnings at 65%/80%/90%）消除 non-termination 问题。在 Video-MME-Long、LongVideoBench-Long、LVBench 和 MINERVA 上，VideoXAgent 以约 50k agent context 达到与 frontier LMMs（如 Gemini-3.1-Pro、Seed-2.0-pro）competitive 的 accuracy，在 MINERVA 上仅用 1,024-frame dense-packing baseline 约 15% 的 context 即达到 65.7%。关键发现是：即使 orchestrator 为 visually weak 甚至 text-only LLM（如 GLM-5.2），该 harness 仍能达到 frontier LMM 水平，表明 long video understanding 的核心可以来自 progressive agentic evidence seeking 而非将整段视频塞入单一 context。Ablation 显示 sequence-level VLM tool 和 audio/subtitle tool 移除后 accuracy 下降最大（各降约 6.66pp），visual expert tools 移除后 accuracy 降 3.33pp 但同时减少 context 消耗，objective rules 移除后 accuracy 降 2.73pp 且引发 evidence contamination。Budget control 的 progressive warnings 将 non-termination 从 14.7% 降至 0%，同时 mean token usage 降低约 12%。\n\n### § 9 最脆弱的假设\n\n最脆弱的核心假设是：**从 MINERVA 人类专家 reasoning traces 中挖掘的 22 个 atomic capabilities 构成了一个足够完备的 capability taxonomy，能够覆盖 long video understanding 中绝大多数 query 所需的 atomic sub-problems**。这个假设是整个 tool design 的基石——60+ 个 expert tools 的设计直接受此 taxonomy 指导，agent 的 task decomposition 也依赖这些 capabilities 能覆盖 query 的需求。如果该 taxonomy 不完备，agent 在遇到 taxonomy 之外的 capability 需求时将无法将其 decompose 为已有 tools 可处理的 sub-problems，导致 evidence acquisition 失败或 hallucination。\n\n该假设在实际中可能不成立的原因有三：第一，MINERVA 本身是一个特定 benchmark，其 video domain（short films、sports、instructional content）和 question style 未必代表所有 long video understanding 场景，例如 surveillance video 中的异常行为检测、medical video 中的精细操作识别、或 lecture video 中的数学推导追踪，这些场景所需的 atomic capabilities 可能完全不在当前 taxonomy 中。第二，论文自己也承认 taxonomy \"may reflect dataset-specific distributions or omit capabilities that are salient in other domains\"（§5），但未提供任何 cross-domain validation。第三，从 Figure 8 的 tool usage distribution 来看，Visual Content Understanding 和 Speech Transcription 两个 capability 占了 74.8% 的 (trajectory, capability) pairs，而 8 个 capabilities \"carry no mass\"，这种极度 head-heavy 的分布可能恰恰反映了 taxonomy 中许多 capabilities 在 MINERVA 衍生的 query 分布下几乎不被触发，但在其他 domain 下可能是 critical 的。\n\n论文为这个假设提供的证据仅限于：在 MINERVA、Video-MME-Long、LongVideoBench-Long、LVBench 等 benchmark 上取得了 competitive accuracy。但这些 benchmark 的 question type 分布与 MINERVA 的 reasoning trace 分布存在高度重叠（尤其是 Video-MME-v2 的 fine-grained breakdown 显示 agent 在不同 capability category 上表现差异巨大，如 State Changes 仅 41.5%），因此 benchmark performance 本身不能独立验证 taxonomy 的完备性。论文缺少的关键证据是：在显著不同于 MINERVA domain 的 video understanding 任务上的 zero-shot evaluation，或对 taxonomy coverage 的系统性 gap analysis。\n\n### § 10 最小复现实验\n\n在一周时间内，最值得复现且可行的实验是验证 **\"visually weak/text-only orchestrator + VLM tool backend 能达到 frontier LMM 水平\"** 这一 claim，因为它是论文最反直觉的发现，且复现成本最低——不需要构建完整的 60+ tool suite，只需一个 text-only LLM 作为 orchestrator 加少量核心 tools。\n\n具体方案：从 MINERVA public release（Neptune repository 的 1,357 questions）中抽取一个 stratified subset（约 100-150 questions，覆盖 5 个 domain），使用 GLM-5.2 或任意 text-only LLM 作为 orchestrator，仅实现 3 个最核心的 tools：(1) `get_video_subtitle`（基于 SRT 文件的 script tool），(2) `locate_event_by_text`（基于 text embedding matching 的 temporal localization），(3) `inspect_image`（调用一个 VLM API 如 Qwen3.6-35B-A3B 对指定 timestamp 的 frame 做 visual QA）。实现一个简化的 ReAct loop（含 budget limit 和 forced answering），使用论文 Appendix D 中的 system prompt。测量 end-to-end accuracy 和 mean agent context tokens。\n\n支持 claim 的结果：accuracy 达到 60% 以上（论文报告 GLM-5.2 + Qwen3.6 为 65.4%），且 context tokens 在 30k-40k 范围内，显著低于 frontier LMM 的 256k+ context。反驳 claim 的结果：accuracy 显著低于 60%，或需要远超 50k 的 context 才能达到可用 accuracy，或 text-only orchestrator 无法有效完成 task decomposition 和 tool selection——这将表明论文的 harness 效果可能高度依赖 orchestrator 的隐含 visual capability 或更完整的 tool suite，而非纯粹的 agentic evidence seeking。此实验的关键优势在于：它直接测试了论文的核心论点（long video understanding 可从 agentic tool use 而非 dense frame packing 中 emerge），同时避免了复现全部 60+ tools 和完整 capability taxonomy 的工程成本。", "research_value": "### § 11 最强反例设计\n\n如果我反对这篇论文，我会设计一个针对“无文本锚点的连续时空因果推理”的反例实验，以证明 VideoXAgent 的成功实际上是将长视频理解降维成了“文本检索+局部视觉确认”，而非真正的时空连贯推理。论文最反直觉的发现是 text-only orchestrator 也能达到前沿水平，但这恰恰暴露了其高度依赖 audio/subtitle 提供初步线索的脆弱性。我会从 SoccerNet 或 surveillance datasets 中构建一个无字幕、无语音解说的 subset，并设计需要理解连续动作序列和跨时间段因果关系的 query（例如：“红队进球前，蓝队后卫是在哪个时间点失误的，失误动作是什么？”）。在这个场景下，text-only orchestrator 无法利用 audio/subtitle tool 获取初步线索，`locate_event_by_text` 也因缺乏文本锚点而完全失效。Agent 只能依赖 `generate_thumbnail_grid` 进行盲目全局搜索，导致 budget 迅速耗尽。即使定位到候选区间，由于 `inspect_image` 只能处理离散帧，无法捕捉连续动作的动态特征（如速度、姿态变化），导致 evidence aggregation 阶段产生大量高 uncertainty 的 observation。最终在 budget control 的强制下，系统只能输出基于猜测的答案。这一反例不仅提供了对原结果的替代解释（即性能源于文本可锚定的离散事件检索），还识别出该方法在“弱文本信号-强视觉连贯性”条件下会可预测地失败，从而挑战了其作为通用长视频理解 harness 的有效性。\n\n### § 12 Follow-up Research Idea\n\n基于对方法核心局限的理解，我提出一个非增量的 novel research idea：**Spatiotemporal Program Synthesis via Self-Evolving Visual Primitives**。该想法的驱动局限在于，VideoXAgent 的静态 taxonomy 和离散工具调用割裂了长视频的时空连续性，且无法适应长尾视觉能力需求。我们可以借鉴 Neurosymbolic AI 和 ViperGPT 中的视觉程序合成思想，但将其重构为针对长视频时空动态性的程序合成范式。具体而言，不再预定义 60+ 静态 tools，而是提供一个底层的“视觉原语库”（如 SAM 2 for tracking, DINOv2 for feature extraction, Whisper for ASR）。Agent 的任务不再是“选择并调用工具”，而是“编写一段时空连贯的 Python 程序”来处理视频。例如，针对“追踪特定物体”的 query，agent 合成包含跨帧循环追踪和时序条件分支的代码，直接在像素级维持时空连贯性。第一个实验将是在无字幕的长视频监控数据上，测试 agent 动态合成视觉程序以处理连续时空关联任务的能力，并与 VideoXAgent 的离散 ReAct loop 对比，重点观察 context rot 是否被缓解以及时空连贯性是否得到保留。这一提议与已有工作的根本区别在于：它将 agent 的角色从“静态工具的调用者”转变为“动态视觉算法的设计师”，通过生成可执行代码来原生处理长视频的时间跨度，而非依赖离散的 ReAct 步骤拼凑证据，从而打开了一个从 agentic tool use 向 agentic program synthesis 进化的全新研究方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Sen Yang\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Boqiang Duan\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Jing Yang\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Weihao Bo\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Jie Liu\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Boyuan Tong\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Ze Feng\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Wenkang Zhang\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Jingdong Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hua Wu\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Baidu Inc.\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contributions. Contact Email: yangsenius@gmail.com, firestonelib@gmail\"},\n    {\"marker\": \"†\", \"text\": \"The work was done when Jing Yang, Weihao Bo, Jie Liu, Boyuan Tong, Ze Feng, and Wenkang Zhang were interns at Baidu.\"}\n  ]\n}\n```", "summary_translation": "长视频理解通常表现得像一个视觉大海捞针问题：与 query 相关的证据稀疏地分布在长的时间跨度中，而将密集的帧打包进单个 VLM context 会导致 context rot 和高昂的成本。现有的 video agents 通常依赖于 query-agnostic 的离线预处理或 ad hoc 工具集，这可能会遗漏 query 特定的细节并浪费计算资源。在这项工作中，我们提出了 VideoXAgent，这是一个用于长视频理解的纯在线 video-agent harness，它从给定的视频文件和 user query 出发，规划并分解任务，按需调用专门的 expert tools，并聚合多模态证据以生成最终答案，同时解决观察结果之间的冲突。为了支持这种按需调用，我们设计了一套由 data-driven taxonomy of atomic capabilities 指导的异构 expert tools，涵盖 scripts、VLMs 和 domain models（例如 detection、OCR、ASR、face recognition）。该 harness 进一步强制执行 objective evidence prompting 和 budget-aware control，以遏制 hallucination 和 non-termination。在 Video-MME-Long、LongVideoBench-Long、LVBench 和 MINERVA 上，VideoXAgent 在更小的 context footprint 下与 frontier LMMs 和 video agents 具有竞争力——即使在长达一小时的视频上，每个样本也只需约 50k tokens 的 agent context。特别是在诸如 MINERVA 这样的复杂 video-reasoning benchmarks 上，它在使用仅约 15% 的 1,024-frame dense-packing baseline 的 context 的情况下，就达到了同等水平。值得注意的是，该 harness 即使在视觉较弱甚至纯文本的 orchestrator 下仍然有效，这表明强大的长视频理解可以源于渐进的 agentic evidence seeking，而不是源于将完整视频打包进单个 context。Project page: https://go-agent-x.github.io/video_agent_harness/"}, {"title": "Reality Is the Final Verifier: On Two Key Gaps in Agentic Software Engineering", "arxiv_id": "2609.12039", "authors": "Alexander Krentsel, Shubham Agarwal, Mert Cemri, Shu Liu, Sidharth Sankhe, Ziming Mao, Matei Zaharia, Ion Stoica", "summary": "Software development follows an implementation-verification loop in which developers or agents iteratively revise an implementation until an evaluator, such as a test suite, accepts it. The evaluator checks the implementation against a set of requirements under a model of the deployment environment. Yet even a formal proof that the implementation satisfies the requirements under the model cannot guarantee acceptable behavior after deployment. Requirements only approximate stakeholder intent, and the model only approximates the real deployment environment. We call these together - requirement gap and model gap - the two-gap framework, which unifies the main failure modes of agentic software engineer-ing: reward hacking exploits omissions in the requirements or model, while hallucination widens the gaps by fabricating requirements or environment assum
