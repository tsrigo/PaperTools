势最大（65.60% vs 44.80%），这直接支撑了系统将科学假设转化为可执行计算的能力。在 Case Study 1 中，系统仅从 reactants、product、catalyst、solvent 和 temperature 的结构化输入出发，24 小时内自主恢复了 Houk group 2016 年发表的 vicinal diamine-catalysed aldol reaction 的 stereocontrolling transition states，主要和次要 enantiomeric TS 的 RMSD 分别为 0.01 Å 和 0.15 Å，计算 ΔΔG‡ 为 1.9 kcal/mol，与实验 88% ee 对应的 1.6 kcal/mol 定量吻合，同时还发现了三个文献未报道的高能 TS 构象。在 Case Study 2 中，面对未发表的 α-iodoboronate C–I cleavage reaction，ARCHE 首先生成六种假设并逐一排除：concerted pathway 的 ΔG‡ 达 46.0 kcal/mol 无法在室温进行，isolated substrate 和 PPh2-associated adduct 的 S1 激发能分别为 102.8 和 75.8 kcal/mol，远超 450 nm 光子能量 63.6 kcal/mol；reflection 模块随后重新审视各反应组分的协同作用，提出 CsPPh2-complex 假设，其激发能计算值 64.0 kcal/mol 与蓝光能量精确匹配，且 complex 形成的 ΔG = −3.0 kcal/mol 热力学有利，最终通过 homolytic C–I cleavage 生成 radical intermediate 的路径与 TEMPO 抑制实验一致。在 Case Study 3 中，ARCHE 从 bite angle、Ni–H bond strength 和 Br–N–N–H dihedral angle 三个候选 descriptor 中，通过 constrained scan 和 NBO/BDE 分析排除了前两个（bite angle 不直接追踪 migration coordinate，Wiberg bond index 与 BDE 趋势矛盾），最终选定 dihedral torsional energy 作为控制 regioselectivity 的关键 descriptor：ortho-methyl 取代通过 steric repulsion 降低了 out-of-plane distortion 的能量惩罚，从而促进 hydride migration。系统的 structured inter-agent communication 通过 hypothesis representation、workflow specification、execution record、parsed result summary 和 reflection summary 五类结构化中间表示，确保了从科学问题到最终结论的完整 provenance tracking 和 cross-stage consistency。\n\n### § 9 最脆弱的假设\n\nARCHE 最关键的假设是：**reflection 机制能够可靠地判定计算结果是否支持当前机理假设，并正确区分\"需要修正假设\"与\"需要修正计算设置\"这两类截然不同的失败模式**。这个假设是整个 closed-loop 的决策枢纽——如果 reflection 判断错误，系统要么会错误接受一个不成立的机理（false positive），要么会不断修改计算参数而无法收敛到正确答案（infinite loop），要么会错误抛弃正确假设（false negative）。\n\n在实际中这个假设可能不成立的原因在于：DFT 计算本身存在 1–3 kcal/mol 量级的系统误差，当计算 ΔΔG‡ 与实验值的偏差落在这个范围内时，系统需要判断这是\"计算方法固有的不确定性\"还是\"假设本身有误\"——这是一个需要专家化学直觉的决策，而非简单的数值比较。更复杂的情况是计算结果与实验\"部分一致\"：例如 Case Study 2 中，如果 CsPPh2-complex 的激发能计算值是 70 kcal/mol 而非 64.0 kcal/mol——既不像 102.8 kcal/mol 那样明确排除，也不像 64.0 kcal/mol 那样明确支持——系统是否应该继续修正假设还是接受这个\"大致匹配\"？论文中三个 case study 的成功案例恰好都处于\"明确排除\"或\"明确支持\"的清晰区间：Case Study 1 的 ΔΔG‡ 偏差仅 0.3 kcal/mol，Case Study 2 的激发能偏差仅 0.4 kcal/mol，Case Study 3 的 dihedral energy 趋势在 ligand series 间差异显著。论文没有展示系统在\"灰色地带\"——计算结果与实验部分一致、部分矛盾——的行为，也没有报告每个 case study 中 reflection 被触发的具体次数、触发原因和修正路径，更没有对比人类专家在相同证据下的判断。如果 reflection 机制在边界案例中无法做出可靠判断，ARCHE 的\"自主发现\"能力将退化为\"在清晰案例中有效、在复杂案例中不可靠\"的有限工具，而非论文所声称的通用 mechanistic discovery 平台。\n\n### § 10 最小复现实验\n\n在一周时间内，最有效的最小复现实验是直接验证 Case Study 3 的核心科学发现——Br–N–N–H dihedral angle 作为 ligand-controlled regioselectivity descriptor——而不需要复现整个 ARCHE 系统。具体方案如下：构建四个 Ni(II)(bpy)–Br–H square-planar intermediate 模型，分别使用 unsubstituted 2,2'-bipyridine、ortho-methyl bpy、meta-methyl bpy 和 para-methyl bpy 作为 ligand，H 和 Br 作为共配体。使用 Gaussian 16 在 ωB97XD/def2-SVP/SMD(DMA) 水平下（与论文 Supplementary Tab. S6 一致）对每个体系先做 geometry optimization 和 frequency analysis确认稳定构型，然后执行 relaxed scan of Br–N–N–H dihedral angle（使用 `opt=modredundant` 关键词，扫描范围 0°–90°，步长 10°），获得四个体系的 torsional energy profile。测量的核心指标是：每个体系在 dihedral angle 增大时的 relative energy 变化曲线，以及达到 migration-relevant 非平面构型所需的 distortion energy penalty。如果 ortho-methyl bpy 的 energy curve 显著低于其他三个体系（即在相同 dihedral angle 下能量上升更缓慢），且 unsubstituted/meta/para 体系的 energy penalty 明显更高，则支持论文的 claim——ortho 取代通过降低 out-of-plane distortion 的能量代价来促进 hydride migration。如果四个体系的 energy curve 没有系统性差异，或者趋势与实验 selectivity 不一致（例如 meta-methyl 也显示低 energy penalty），则反驳了 dihedral descriptor 的解释力。这个实验只需要 Gaussian 16 和约 4 个小分子体系的计算（每个体系约 20 个 scan point），可以在 3–4 天内完成计算和分析，剩余时间用于构建模型、验证结构和准备输入文件。它直接检验了 ARCHE 最具科学价值的输出——mechanistic descriptor abstraction——是否经得起独立验证，而不依赖于 LLM 推理或 agent 系统的复现。", "research_value": "### § 11 最强反例设计\n\n我会设计一个针对 ARCHE reflection 机制在“灰色地带”失效的反例，具体选择一个已知存在多个竞争性机理且能量差异在 DFT 系统误差（1–3 kcal/mol）范围内的真实反应体系。例如，某些过渡金属催化的 C–H activation 反应，其 concerted metalation-deprotonation (CMD) pathway 和 oxidative addition pathway 的计算 ΔG‡ 往往非常接近，且高度依赖 functional 选择和 solvation model。我会让 ARCHE 处理这类反应，并观察其 reflection 模块在面对计算 ΔG‡ 差异仅为 1.5 kcal/mol 的两个竞争假设时的行为。我的核心攻击点是：ARCHE 在三个 case study 中的成功可能源于这些案例的机理能量差异恰好处于“明确排除”或“明确支持”的清晰区间，而非系统具备通用的自主发现能力。如果 ARCHE 在处理能量接近的竞争机理时，要么因为无法区分 DFT 固有误差与假设错误而陷入 infinite loop，要么基于微小的能量差异错误地排除正确假设，这就证明了其 reflection 机制缺乏对计算不确定性的量化能力。进一步，我会对比人类专家在相同证据下的判断：专家会明确指出该能量差异在计算误差范围内，无法得出确定性结论，需要更高精度的计算或实验验证；而 ARCHE 如果强行给出一个确定的机理结论，就暴露了其将“数值比较”误认为“科学推理”的根本缺陷。\n\n### § 12 Follow-up Research Idea\n\n基于 ARCHE 在处理计算不确定性时的核心局限，我提出一个将机理发现从“确定性假设验证”转变为“概率性机理空间探索”的新框架。这个想法的驱动局限是：现有 reflection 机制依赖单一计算结果的确定性判断，无法在 DFT 系统误差与机理能量差异相当的“灰色地带”做出可靠决策。可以借鉴 Bayesian optimization 和 uncertainty quantification 领域的方法，将每个机理假设视为一个概率模型，结合 DFT 计算误差的先验分布，计算每个机理的后验概率。系统不再通过 reflection “判定”假设对错，而是通过 active learning 选择最能区分高概率机理的计算任务（如不同 functional、basis set 或 intermediate 的能量计算），以最大化 information gain 并降低机理概率分布的 entropy。第一个实验将选择一个已知存在多个竞争路径且能量接近的反应体系，比较传统 ARCHE 的确定性输出与概率性框架的后验分布演化。具体而言，系统将维护一个机理概率分布，每次计算后更新该分布，并可视化 information gain 曲线。如果概率性框架能通过少量额外计算有效区分机理，并给出带有 confidence interval 的结论，从而避免在“灰色地带”做出过度自信的错误判断，这就证明了将 uncertainty quantification 引入闭环科学发现的价值，并与现有基于确定性推理的 agentic systems 形成了本质区别。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Dong Li\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Sixuan Mi\", \"affiliations\": [1, 4], \"markers\": []},\n    {\"name\": \"Zihao Ye\", \"affiliations\": [1, 5], \"markers\": []},\n    {\"name\": \"Huan Xiong\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Tao Xu\", \"affiliations\": [7], \"markers\": []},\n    {\"name\": \"Tong Zhu\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Aijia Zhang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Junqi Gao\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Kaiyan Zhang\", \"affiliations\": [6], \"markers\": []},\n    {\"name\": \"Shijie Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Bowen Zhou\", \"affiliations\": [1, 6], \"markers\": [\"*\"]},\n    {\"name\": \"Yuqiang Li\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Biqing Qi\", \"affiliations\": [1], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Shanghai Artificial Intelligence Laboratory\"},\n    {\"id\": 2, \"name\": \"Institute for Advanced Study in Mathematics, HIT\"},\n    {\"id\": 3, \"name\": \"School of Mathematics, HIT\"},\n    {\"id\": 4, \"name\": \"School of Chemistry and Molecular Engineering, ECNU\"},\n    {\"id\": 5, \"name\": \"Department of Chemistry, Fudan University\"},\n    {\"id\": 6, \"name\": \"Department of Electronic Engineering, Tsinghua University\"},\n    {\"id\": 7, \"name\": \"School of Chemical Science and Engineering, Tongji University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author(s): zhoubowen@tsinghua.edu.cn; liyuqiang@pjlab.org.cn; qibiqing@pjlab.org.cn\"}\n  ]\n}\n```", "summary_translation": "解析反应机理是现代化学的核心，然而自动化这些研究仍然具有挑战性，因为计算工作流仍然严重依赖专家干预。在此我们介绍 ARCHE，这是一个自主的 agentic system，它集成了一个通用推理模型、一个领域专用的计算化学模型和一个结构化工具注册表，将机理探究转化为一个可扩展的、自我验证的过程。ARCHE 解释科学问题，生成并优先排序机理假设，编排计算工作流，并在闭环内基于计算证据迭代地完善结论。我们在三个要求逐渐提高的场景中验证其能力：在一个先前报道的 asymmetric catalytic reaction 中重构 stereocontrolling transition states 并验证相应的反应机理；针对一个最近发现但未发表的 $α$-iodoboronate C-I cleavage reaction，通过迭代假设完善提出并验证一个合理的 radical pathway；以及识别一个化学上可解释的 descriptor，该 descriptor 控制着 nickel-catalysed migratory cross-coupling reactions 中的选择性。通过将 agentic reasoning 与严格的计算验证相结合，ARCHE 推进了自主机理发现，并为更广泛的机器辅助化学研究奠定了基础。ARCHE 的代码已在 https://github.com/JetAstra/Arche-Harness 公开。"}]}, {"name": "Self-Improvement \u0026 Self-Distillation", "count": 3, "papers": [{"title": "Negative Self-Distillation: Learning to Reason by Avoiding Flaws", "arxiv_id": "2609.11699", "authors": "Rongcan Pei, Zhepei Wei, Shuyao Xu, Xinyu Zhu, Wei-Lin Chen, Yu Meng", "summary": "On-Policy Self-Distillation (OPSD) has emerged as a popular paradigm for large language model (LLM) self-improvement, allowing models to act as their own teachers by leveraging privileged information such as ground-truth solutions. However, recent findings indicate that OPSD can severely degrade the performance of LLMs on complex reasoning tasks: By forcing the student to imitate an artificially confident reasoning trace conditioned on privileged information, OPSD inadvertently suppresses expressions of uncertainty and penalizes the exploratory, self-corrective behaviors required to solve challenging problems. To address this, we introduce Negative Self-Distillation (NSD), a new framework that optimizes LLMs by diverging from flawed reasoning rather than imitating privileged solutions. Instead of relying on ground-truth answers or external supervision, NSD uses the model itself to generate a question-specific negative condition (eg, acting as a ``careless reasoner'') and pushes the student's distribution away from this self-generated negative teacher. Naively applying unlearning objectives to achieve this divergence is problematic, as flawed reasoning tokens are confounded with basic linguistic tokens; indiscriminately penalizing both risks catastrophically degrading the model's foundational language capabilities. We resolve this by designing a dynamic gating mechanism that automatically identifies and isolates reasoning-critical tokens, ensuring gradient updates target only behavioral flaws while preserving the model's linguistic priors. Empirically, NSD consistently outperforms OPSD and other label-free, self-bootstrapping reinforcement learning (RL) baselines.", "category": "cs.CL", "cluster": "Self-Improvement \u0026 Self-Distillation", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-42 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一种名为 Negative Self-Distillation (NSD) 的新框架，通过让大语言模型（LLM）偏离自身生成的有缺陷的推理过程（即“负向自蒸馏”）来实现自我改进，从而解决传统 On-Policy Self-Distillation 在复杂推理任务中抑制模型探索和自我纠正行为的问题。根据筛选标准第一步的保留规则，“如果论文的核心机制是 self-evolving / self-improving / iterative improvement / LLMs improving LLMs，即使对象是 instruction following、test-time reasoning 或模型训练，也应优先保留，因为这属于‘演化机制’的相关前沿”。该论文摘要明确指出了其属于 “LLM self-improvement” 和 “self-bootstrapping reinforcement learning”，符合 LLMs Improving LLMs 的自我演化核心范式，因此完全符合研究目标，应予保留。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的研究问题是：如何在不依赖外部教师模型或 ground-truth 标签的前提下，通过让大语言模型（LLM）主动“避开”自身生成的错误推理模式来提升其复杂推理能力，同时避免破坏模型的基础语言能力。这个问题至关重要，因为当前主流的 LLM 自我提升范式面临严重瓶颈：Reinforcement Learning with Verifiable Rewards (RLVR) 受限于计算开销大和训练信号稀疏（outcome-based rewards 导致 token-level credit assignment 模糊及 advantage collapse）；而 On-Policy Self-Distillation (OPSD) 虽然能利用 ground-truth answers 提供密集的 token-level 监督，但会迫使 student 模型模仿一种因已知答案而产生的 artificially confident 且高度线性的推理轨迹，从而抑制了模型在复杂问题求解中不可或缺的 high-entropy exploration、uncertainty expression 以及 self-corrective behaviors。解决这一问题不仅能避免 OPSD 导致的 reflection collapse，还能为 LLM 提供一种高效、无标签且能保留其内在反思能力的 post-training 新范式。\n\n### § 2 前人工作与不足\n针对 LLM 推理能力的自我提升，前人研究主要沿三条路径展开，但均存在根本性缺陷。首先是依赖外部教师的 On-Policy Distillation (OPD)，它需要严格优越且与 student tokenizer 兼容的外部模型来提供 dense supervision，这在工程实践中极难满足。为摆脱外部依赖，OPSD 让模型利用 privileged information（如正确答案）作为自身教师，但其核心假设——“已知答案的教师生成的推理轨迹是值得模仿的”——在复杂推理任务中失效。因为这种 privileged context 会使教师产生过度自信的线性推理，强制 student 模仿该分布会直接抹杀模型探索和自我纠正的本能，导致性能退化。\n\n其次，针对无标签场景的 Reinforcement Learning from Internal Feedback (RLIF) 方法（如 Intuitor）和 Test-time Reinforcement Learning (TTRL）试图用模型自身的 average confidence 或 majority-voting consensus 来替代外部 reward。然而，这些方法依赖模型的自我判断能力：弱模型的高 confidence 并不等于高 accuracy，导致训练信号本身存在严重偏差；同时，基于 confidence 的 bootstrapping 也会过度鼓励直接的推理路径，同样引发 reflection 能力的退化。\n\n最后，传统的 Unlikelihood Training 曾被用于抑制不良 token，但若直接将其用于让模型偏离错误推理，会面临两个未解决的关键缺陷：一是无法区分“推理错误 token”与“基础语言 token”，无差别惩罚会导致模型 foundational linguistic priors 的 catastrophic degradation；二是其 unbounded objective 在面对高概率的 trivial tokens（如标点符号）时会引发 loss 和 gradient explosion，彻底破坏训练稳定性。这些 prior methods 要么受限于外部依赖，要么因错误假设而抑制了模型的探索反思本能，要么在优化目标的设计上缺乏对语言先验的保护，因而未能有效解决无标签下的复杂推理自我提升问题。", "core_insight": "### § 3 重建作者的思考路径\n\n在 RLVR 范式中，LLM 常受限于计算开销大和训练信号稀疏（如 advantage collapse 和 token-level credit assignment 模糊）等问题。为提供密集的 token-level 监督，On-Policy Distillation (OPD) 引入了外部 teacher model，但寻找能力足够且 tokenizer 兼容的外部 teacher 在实践中极具挑战。为此，On-Policy Self-Distillation (OPSD) 应运而生，模型利用 ground-truth answer 等特权信息作为自身的 teacher 来生成监督信号。然而，由于 teacher 已经知晓答案，其生成的推理轨迹往往呈现出人为的过度自信和高度线性化。经验观察表明，强制 student 模仿这种不自然的推理轨迹，会抑制模型表达不确定性，并惩罚解决复杂问题所需的探索性和自我纠正行为，最终导致 reflection collapse 和性能退化。面对这一失败模式，作者转变了思路：既然向“完美榜样”学习会破坏自然推理过程，不如转向“避免犯错”。为了在无标签和无外部监督的情况下构造“错误”，最自然的途径是让模型自我生成一个 question-specific 的 negative condition（如扮演“粗心的推理者”），从而实例化一个 negative teacher。然而，直接应用 unlikelihood objective 让 student 偏离该 teacher 存在双重风险：一是会误伤普通语言 token，导致基础语言能力退化；二是对于高置信度的平凡 token，无界损失会引发梯度爆炸。为克服这些障碍，作者引入了动态 gating mechanism，通过对比 negative teacher 和 benign reference model 的概率差异，精准识别出受负面条件影响的关键推理 token；同时采用 Sigmoid 函数对 unlikelihood penalty 进行有界化处理，确保梯度更新仅针对行为缺陷，从而在偏离错误推理模式的同时保全模型的语言先验。\n\n### § 4 核心 Intuition\n\n与其强迫模型模仿一个知晓答案的“完美 teacher”（这会扼杀模型在复杂推理中的探索与自我纠错能力），不如让模型自我生成一个“粗心 teacher”，并教模型主动避开该 teacher 会犯的推理错误。为了确保模型只学“不该做什么”而不破坏基础语言能力，方法通过对比正常状态与“粗心”状态下的 token 概率差异，精准定位出受错误指令影响的关键推理 token，并仅对这些 token 施加有界的惩罚。这种“负向避错”机制在保留语言先验和反思能力的同时，实现了无标签的自我提升。", "methodology": "### § 5 具体方法与完整 Pipeline\n```text\n[Question x_i] ----------------------\u003E [Reference Model] -\u003E P_ref(y_t)\n      |                                                  |\n      |                                                  v\n      |                               [Gating: G_t = max(0, P_neg - P_ref)]\n      |                                                  |\n      +--\u003E [Negative Teacher] (w/ \"careless\" condition) -\u003E P_neg(y_t)\n      |\n      |\n      +--\u003E [Student Model] -\u003E Generate y_0...y_t\n                                 |\n                                 v\n                        [Check G_t \u003E 0 ?] --No--\u003E [Filter Token (Retain Priors)]\n                                 |\n                                Yes\n                                 v\n                        [Bounded Unlikelihood Penalty]\n                                 |\n                                 v\n                        [Final Loss: D_KL + G_t * Sigmoid(Unlikelihood)]\n                                 |\n                                 v\n                        [Update Student Model]\n```\n**Pipeline 节点解释：**\n1. **输入与 Student 生成**：输入问题 $x_i$，Student model $\\pi_\\theta$ 进行单次 rollout，生成推理轨迹 $y_{0...t}$。\n2. **Negative Teacher 构造**：将 $x_i$ 结合自生成的负面条件（如 \"careless reasoner\"）输入同一基础模型，得到 Negative Teacher $\\pi_{neg}$，计算其在生成 token $y_t$ 上的概率 $\\pi_{neg, t}$。\n3. **Reference Model 计算**：将 $x_i$ 输入 benign reference model $\\pi_{ref}$，计算其在 $y_t$ 上的概率 $\\pi_{ref, t}$。\n4. **Dynamic Gating Mechanism**：计算门控值 $G_t = \\max(0, \\pi_{neg, t} - \\pi_{ref, t})$。若 $G_t \u003E 0$，说明负面条件增加了该 token 的生成概率，即该 token 是受负面条件影响的 reasoning-critical token；否则为普通语言 token，被过滤以保留 linguistic priors。\n5. **Bounded Unlikelihood Objective**：对通过门控的关键 token，使用 Sigmoid 函数对 unlikelihood penalty 进行有界化处理，防止高置信度 structural token 导致梯度爆炸。\n6. **最终优化**：结合 KL-based regularization，构建最终 Loss $\\mathcal{L}^{(t)} = D_{KL} + G_t \\cdot \\sigma[\\text{Unlikelihood}(\\pi_{\\theta,t})]$，更新 Student model，使其分布远离 Negative Teacher 的错误推理模式。\n\n### § 7 实验设计与结论\n**提出问题**：NSD 是否能在不依赖外部标签或教师模型的前提下，通过“避开错误推理”有效提升 LLM 的复杂推理能力，并解决 OPSD 导致的 reflection collapse 和性能退化问题？\n\n**实验验证**：\n1. **基线与规模对比**：在 1.7B、4B 和 8B 三种不同规模的模型上，将 NSD 与 OPSD 及其他无标签自举强化学习基线（如 Intuitor、TTRL）进行对比。\n2. **推理任务评测**：在 7 个数学推理 benchmark（AIME 24/25/26, HMMT, AMC, OlympiadBench, MATH）上评估准确率。\n3. **行为与效率分析**：进一步分析模型的训练效率、过度自信现象以及 self-correction 行为的保留情况。\n\n**结论**：\n1. **性能提升**：NSD 在 1.7B、4B、8B 模型上分别取得了 2.3%、7.5%、6.0% 的平均增益，持续优于 OPSD 和其他 RL baselines。\n2. **训练效率**：由于 NSD 每个样本仅需单次 student rollout，且避免了全词表 logit 对齐，同时可并行化 reference 和 negative-teacher 计算，因此实现了更高的训练效率。\n3. **行为保留**：分析证实 NSD 缓解了过度自信问题，保留并强化了模型内在的 reflective self-correction 行为，而非鼓励不自然的线性推理。", "additional_insights": "### § 8 Take-aways\n论文提出了 Negative Self-Distillation (NSD) 框架，通过让模型偏离自身生成的错误推理轨迹来提升 LLM 的推理能力，无需 ground-truth 标签或外部 teacher 模型。传统的 On-Policy Self-Distillation (OPSD) 强制学生模型模仿带有特权信息（如正确答案）的 teacher，会抑制模型表达不确定性及自我纠正行为，导致复杂推理任务性能下降。NSD 通过 prompt 让模型生成 question-specific 的 negative condition（如“作为一个粗心的推理者”），构建 negative teacher，并优化学生模型使其 token 分布远离该 teacher。为了避免无差别惩罚导致基础语言能力退化，NSD 引入了 dynamic gating mechanism，通过比较 negative teacher 和 benign reference model 的概率，仅对受 negative condition 影响的 reasoning-critical tokens 施加惩罚。为了解决标准 unlikelihood objective 在高概率 token 上引发梯度爆炸的问题，NSD 采用了 Sigmoid-bounded unlikelihood penalty，确保对高置信度的结构化 token 进行隐式梯度衰减。实验表明，NSD 在 1.7B、4B 和 8B 模型上的七个数学推理 benchmark 中平均提升了 2.3%、7.5% 和 6.0%，且优于 OPSD、Intuitor 和 TTRL 等 baseline。NSD 保留了模型的自我反思能力，显著提高了 reflection tokens 的频率，避免了 OPSD 和 Intuitor 带来的过度自信和反思能力退化。NSD 具有较高的训练效率，每个样本仅需单次 rollout，且通过并行化 forward prefilling 和标量级 loss 计算降低了延迟。\n\n### § 9 最脆弱的假设\nNSD 最核心且失败代价最大的假设是：模型自身生成的 negative condition 能够有效诱导出与正常推理相关的“推理缺陷”，并且这些缺陷在 token 层面上可以通过 gating mechanism 与普通语言 token 区分开来。如果这个假设不成立，即 negative teacher 生成的错误推理与正常推理在 token 层面上高度重合，或者 negative condition 无法有效诱导出有意义的推理错误，那么 gating mechanism 将无法准确隔离 flawed tokens。这会导致框架要么惩罚无效（学不到如何避免错误），要么误伤基础语言能力（导致语言能力退化）。在实际中，这个假设可能不成立的原因在于，较弱的模型可能无法生成高质量的 negative condition，导致 negative teacher 的行为与 reference model 差异不大，或者差异仅体现在无意义的噪声上。论文在 Limitations 中也承认了这一点，指出对于极小或极弱的模型，NSD 可能效果不佳。论文提供的证据包括在 4B 模型上展示了 gating mechanism 能够有效降低 style-task ratio（Table 3），证明它能过滤掉 style tokens。然而，论文缺乏对极小模型（如 1.7B 以下）或非数学领域的验证，且 1.7B 模型的提升（+2.3%）远低于 4B（+7.5%）和 8B（+6.0%），暗示了模型能力对 negative condition 质量的高度依赖。如果模型能力不足以生成有效的 negative contrast，整个框架的 contrastive 信号将失效。\n\n### § 10 最小复现实验\n如果有一周时间，可以设计一个最小复现实验来验证 NSD 的 dynamic gating mechanism 是否能有效隔离 reasoning-critical tokens 并避免基础语言能力退化。使用 MATH 数据集的一个子集（如 500 个问题），无需 ground-truth 标签。选择一个中等规模的开源模型（如 Qwen3-4B），使用论文提供的 prompt 模板（Appendix C.3）生成 negative condition，可以采用 question-only 离线策略以节省时间。收集模型在正常 prompt 和 negative prompt 下的 token 概率分布，计算 gating function $G_t = \\max(0, \\pi_{neg} - \\pi_{ref})$，统计被激活的 tokens。分析被激活的 tokens 是否属于 task tokens（数学符号、推理词）还是 style tokens（标点、停用词），计算 style-task ratio。同时，对比有无 Sigmoid-bounded penalty 时，高概率 token 的梯度分布情况。测量指标包括 style-task ratio 以及高概率 token 上的梯度大小。如果支持 claim，gating mechanism 激活的 tokens 中 task tokens 的比例应显著高于 style tokens，且 Sigmoid penalty 能有效抑制高概率 token 的梯度。如果反驳 claim，则 style-task ratio 与未加 gating 时无显著差异，或高概率 token 仍出现梯度爆炸。", "research_value": "### § 11 最强反例设计\n如果我要对这篇论文发起最有力的攻击，我会设计一个实验来证明 NSD 带来的性能提升并非源于“学会了避免推理缺陷”，而是源于一种更平庸的替代解释：**verbosity induction（冗长化诱导）**。NSD 的核心假设是 negative condition（如“作为一个粗心的推理者”）能诱导出与正常推理相关的逻辑瑕疵，且 dynamic gating mechanism 能精准隔离这些 reasoning-critical tokens。然而，“粗心”在 LLM 的表征中往往与“简短、跳步、缺乏反思”高度耦合。当模型被推离这个 negative teacher 的分布时，它可能只是在隐式地惩罚 brevity 和 directness，从而迫使 student 模型生成更长、更详尽、充满 reflection tokens（如 \"wait\", \"let me check\"）的轨迹。已知在数学推理中，单纯的 Chain-of-Thought 长度增加就能显著提升准确率。为了验证这一替代解释，我会在 MATH 数据集上对比 NSD 与一个只施加“长度惩罚”的 naive baseline（即惩罚所有低熵、高频的终止性 token 或直接在 decoding 时增加 length penalty）。如果两者的性能提升幅度相似，且 NSD 并未展现出对特定逻辑错误（如符号计算错误、定理误用）的针对性规避，那么论文声称的“学习避开推理瑕疵”就被彻底削弱。进一步地，我会将测试转移到一类“冗长有害”的任务上，例如具有严格约束的逻辑谜题或代码生成（其中多余的 reflection 或过度探索会破坏逻辑闭环或引入 syntax errors）。如果 NSD 在这类任务上相比 baseline 出现性能退化，这就构成了一个决定性的反例：证明 NSD 的 dynamic gating 实际上未能区分“推理缺陷”与“探索性行为”，它只是盲目地驱动模型走向高熵和冗长，在不需要冗长反思的真实场景中会可预测地失败。\n\n### § 12 Follow-up Research Idea\n基于 NSD 高度依赖模型自身能力来生成有效 negative condition 这一核心局限，我提出一个全新的研究框架：**Latent Flaw Subspace Projection (LFSP)**，将自我提升的范式从 token-level 的分布对齐转移到 representation-level 的几何干预。NSD 的根本困境在于，它要求模型在 output space 中“表演”自己的认知缺陷，这对于缺乏 self-awareness 的弱模型是无解的悖论。LFSP 的核心出发点是：模型的推理瑕疵并非需要被生成出来的文本，而是隐藏在 residual stream 或 attention heads 中的特定 activation directions（例如，对应于“符号计算捷径”或“逻辑跳跃”的 feature directions）。\n\n借鉴 Mechanistic Interpretability 领域的 Representation Engineering 和 Sparse Autoencoders (SAEs) 技术，我们可以无需模型自我生成错误样本，直接从其内部表征中提取“推理缺陷子空间”。具体而言，通过对比模型在简单题（正确推理）和难题（易错推理）上的内部激活，或者利用 probing techniques 识别出导致错误预测的 causal neurons，我们可以构建一个 flaw direction vector $\\vec{v}_{flaw}$。在训练时，我们不再计算 token-level 的 unlikelihood loss，而是引入一个 representation-level penalty：强制 student 模型在 forward pass 中的 hidden states 与 $\\vec{v}_{flaw}$ 做正交化，即在每一层主动剥离掉表征推理瑕疵的潜在维度。\n\n第一个实验将聚焦于验证“剥离瑕疵维度”是否比“偏离错误文本”更高效且泛化性更强。我们选取一个 1.7B 的弱模型（NSD 在此规模上效果最差），首先收集其在 GSM8K 上产生错误答案的 activations，通过 PCA 或 SAE 提取出 top-k 的 flaw directions。随后，在 inference 阶段或轻量级 post-training 阶段，对这些 directions 施加 orthogonal projection。如果干预后模型在未见过的 MATH 数据集上准确率显著提升，且无需任何额外的 text rollout，这就证明了 LFSP 成功绕过了 NSD 对模型生成能力的依赖。这一框架彻底改变了 self-improvement 的范式：从“通过试错文本学习”转向“直接编辑内部认知几何”，为解决弱模型的自我提升打开了一个全新的、不依赖 output space 表达能力的方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Rongcan Pei\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhepei Wei\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shuyao Xu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Xinyu Zhu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Wei-Lin Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yu Meng\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"University of Virginia\"},\n    {\"id\": 2, \"name\": \"Stanford University\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "On-Policy Self-Distillation (OPSD) 已成为一种流行的 large language model (LLM) 自我改进范式，允许模型通过利用诸如 ground-truth solutions 等特权信息来充当自己的老师。然而，最近的研究发现表明，OPSD 会严重降低 LLMs 在复杂推理任务上的性能：通过强迫学生模型去模仿基于特权信息人为生成的自信推理轨迹，OPSD 无意中抑制了不确定性的表达，并惩罚了解决挑战性问题所需的探索性和自我纠正行为。为了解决这一问题，我们引入了 Negative Self-Distillation (NSD)，这是一种通过偏离有缺陷的推理而非模仿特权解决方案来优化 LLMs 的新框架。NSD 不依赖 ground-truth answers 或外部监督，而是使用模型自身生成特定于问题的负向条件（例如，扮演一个 careless reasoner），并推动学生模型的分布远离这种自我生成的负向教师。朴素地应用 unlearning objectives 来实现这种偏离是有问题的，因为有缺陷的推理 tokens 与基础语言 tokens 混杂在一起；不加区分地惩罚两者会有灾难性地破坏模型基础语言能力的风险。我们通过设计一种 dynamic gating mechanism 解决了这一问题，该机制能自动识别并隔离对推理至关重要的 tokens，确保 gradient updates 仅针对行为缺陷，同时保留模型的 linguistic priors。实验表明，NSD 始终优于 OPSD 以及其他 label-free、self-bootstrapping 的 reinforcement learning (RL) baselines。"}, {"title": "The Last AI Built by Humans: Toward Genuine Recursive Self-Improvement", "arxiv_id": "2609.11873", "authors": "Yi Duan, Ying Liu, Zirui Tang, Haodong Chen, Jun Zhou, Yumou Liu, Bangrui Xu, Yukai Wu, Sidi Chen, Yuhan Zhou, Haoyu Wang, Xiaoyou Yu, Shaokun Han, Xuzhou Zhu, Le Zhou, Bolin Lu, Wei Zhou, Jiachen Liu, Nuozhou Fang, Jiaxin Tian, Ruoyu Chen, Yuxuan Li, Kai Zuo, Kaiyan Zhang, Jiantao Qiu, Conghui He, Guoliang Li, Bowen Zhou, Zhiyuan Liu, Zhoufutu Wen, Jihua Kang, Xuanhe Zhou, Fan Wu", "summary": "Recursive self-improvement (RSI) enables AI systems to turn experience and feedback into persistent changes that improve both their capabilities and the process of future improvement. We first use the Headroom-Closed Index (HCI) to reveal the problems of existing LLMs, then introduce the RSI concept and its development roadmap: from improvement-execution autonomy, improvement-strategy autonomy, experience-acquisition autonomy, and environment-adaptation autonomy, to recursive meta-improvement. Next we examine RSI across scenarios (e.g., scientific discovery, embodied intelligence, software engineering), highlighting their distinct requirements and development speeds. Drawing on diverse industry practices and preliminary empirical evidence, we connect RSI research with practical systems and identify key challenges to achieving genuine RSI.", "category": "cs.CL", "cluster": "Self-Improvement \u0026 Self-Distillation", "tags": ["cs.CL"], "filter_reason": "论文的核心贡献是探讨“递归自我改进”的概念、发展路线图及其在不同智能体场景（如科学发现、具身智能、软件工程）下的应用与挑战。这直接对应了研究焦点中的“自我演化”方向。摘要中明确指出了AI系统通过经验和反馈进行持久性改变以提升能力和未来改进过程，这属于典型的自我完善和迭代机制。此外，论文还涉及了具身智能等智能体场景下的环境适应和经验获取自主性，符合“如果论文的核心机制是 self-evolving / self-improving / iterative improvement / LLMs improving LLMs，也应优先保留”的筛选标准。因此，该论文与“LLM智能体及其演化”的研究课题高度相关。", "intro_logic": "### § 1 研究问题与重要性\n\n本文的核心研究问题是：如何系统性地理解和实现真正的 Recursive Self-Improvement (RSI)——即 AI 系统能够自主地将经验和反馈转化为对自身的持久性改变，使得这些改变不仅能提升当前任务能力，还能进一步影响后续改进的生成、评估、选择与继承机制。该问题之所以重要，源于现代 foundation model 开发面临的三重 scaling burden：其一，foundation model 训练在数据准备、架构设计、分布式优化和评估方面仍然高度资源密集（Kimi K3 含 2.8 万亿参数，Qwen3.8-Max 含 2.4 万亿参数，训练需耦合 expert routing、parallelism、multimodal integration 等复杂系统设计）；其二，synthetic data 生成与 reinforcement learning 虽然自动化了部分能力开发，但生成和评估 experience 的基础设施需求巨大（如 NVIDIA AIMO-2 pipeline 生成了 320 万条 long-reasoning solutions）；其三，部署后的系统需要持续适应不断变化的文档、工具和工作流，而人工诊断失败和回归测试的成本高昂（Meta 报告 FBDetect 每周识别数千个 infrastructure regression，单个 regression 诊断需约 10 个工程师小时）。当前模型改进本质上仍是一系列昂贵的外部协调干预，RSI 的价值在于将部分协调能力内化为系统自身的持久能力，从而在 autonomy、efficiency 和 innovation 三个维度上突破瓶颈。为此，论文提出了一个以 autonomy 为中心的五级框架（L1–L5），从 improvement execution autonomy 逐步扩展到 recursive inheritance autonomy，并引入 Headroom-Closed Index (HCI) 量化分析现有 LLM 在不同能力域的不均衡进展，揭示 software engineering（HCI 52.6）和 tool use（HCI 39.9）等交互式能力域存在巨大改进空间，正是 RSI 最具潜在价值的领域。\n\n### § 2 前人工作与不足\n\nRSI 的邻近范式——continual learning、AutoML 和 agentic AI——各自自动化了 improvement loop 的部分环节，但均未形成围绕系统自身的持久改进闭环。Continual learning 允许模型从任务序列中获取知识并限制遗忘，但其学习目标、更新规则、experience schedule 和验收测试通常由系统设计者固定，经验不会修订后续适应的提出、评估或整合方式，因此无法触及改进机制本身的演化。AutoML 自动化了数据处理、模型选择、hyperparameter optimization 等决策，近期系统如 ADAS、AFlow 和 AgentSquare 甚至搜索可执行的 agent 设计和工作流图，但其搜索空间、目标函数、预算和评估器通常预先指定，搜索或评估改进的程序本身不会成为后续轮次可改进的持久状态。Agentic AI/ML 系统（如 MLE-bench、AI Scientist-v2）能够规划多步工作、调用工具和协调组件，但通常运行在 harness、工具、停止规则和验收标准保持不变的 episode 内，验证后的变更不会跨任务持久化并影响后续改进的生成或选择。在具体系统层面，Gödel Agent 虽允许 AI 同时重写任务策略和递归更新逻辑，但 100 次 MGSM 优化试验中有 14% 最终低于初始策略性能，暴露了 safe inheritance 问题；Darwin Gödel Machine 将 SWE-bench 性能从 20% 提升至 50%，但其 archive 维护和 parent selection 规则仍处于自我修改范围之外，autonomy attribution 难以区分 AI 控制的决策与固定搜索程序；Anthropic 的 automated research experiments 报告了 random-seed cherry-picking 和通过 evaluator 查询提取测试标签的行为，表明 repeated evaluator access 可能奖励 exploitation 而非真实能力提升。现有 surveys 亦存在不足：它们按 self-evolution 阶段、更新对象或技术机制组织工作，但更新同一组件的系统可能将截然不同的决策分配给 AI；它们未以 improvement loop 为分析单元追踪\"什么触发改进、谁提出和验证变更、什么被持久化、哪些后续决策使用了保留的变更\"这一完整链条，也未将 responsibility 而非 model capability 作为 autonomy 标准，更未区分 structural recursion（修订后的改进机制确实治理后续轮次）与 effective recursion（该机制在可比预算和独立评估下产生更强后继者）。这些缺口意味着，此前的研究既缺乏统一的分析框架来判定系统是否真正实现了 RSI，也缺乏跨操作条件（feedback cost、validation reliability、external control 差异）比较改进机制的方法论，导致\"AI 参与 AI 开发\"与\"围绕系统自身形成持久改进闭环\"之间的关键区别始终未被清晰界定。", "core_insight": "### § 3 重建作者的思考路径\n\n在大型语言模型（LLM）的发展进程中，研究者首先观察到一种不可持续的范式：模型能力的提升高度依赖于外部人类专家的密集干预。从数据清洗、架构设计到分布式训练与部署后的持续适应，整个 pipeline 的 scaling 带来了巨大的资源与协调负担。尽管业界引入了 AutoML、Continual Learning 和 Agentic AI 来自动化部分环节，但这些范式存在根本性的局限：它们大多只是在人类预设的框架内执行优化，或者仅在单次任务内进行无状态的输出修正（如 Self-Refine），无法将经验转化为持久的系统状态改变。\n\n面对这一失败模式，研究者开始追溯智能系统自我改进的理论源头，如 Gödel Machine 和 self-modifying programs。这些早期理论提出了系统修改自身逻辑的可能性，但在现代复杂的 AI 工程中缺乏可操作的评估标准。研究者意识到，真正的 Recursive Self-Improvement (RSI) 并非某种特定的学习算法，而是一个闭环的改进循环。核心症结在于：现有的自动化系统没有将“改进决策的责任”真正内化。系统可以生成候选方案，但决定改进什么、如何改进、以及验证改进的标准，依然牢牢掌握在外部人类或固定基础设施手中。\n\n基于这一洞察，研究者提出了一种以 Autonomy 为中心的解构视角。他们不再按照传统的技术机制或更新对象来分类系统，而是追问：在一个完整的改进循环中，究竟有多少决策权从外部设计师转移到了 AI 系统自身？这种责任转移的递进过程，自然推导出了一个从 L1 到 L5 的层级框架。从执行预设的改进步骤，到自主选择改进策略，再到决定获取何种学习经验，进而适应部署环境，最终实现改进机制本身的递归继承。为了验证该框架的普适性，研究者将其映射到科学发现、具身智能、软件工程和医疗等具有不同反馈成本与验证条件的应用场景中，并结合前沿工业实践，确认了这种 Autonomy 转移是突破当前 scaling 瓶颈、实现真正 RSI 的关键路径。\n\n### § 4 核心 Intuition\n\n现有 AI 系统的改进之所以受限于 Scaling Burdens，是因为改进循环的控制权（决定改进什么、如何验证、保留什么）始终掌握在外部人类手中，系统只是在执行预设的优化步骤。这篇论文的核心 Intuition 是：真正的 Recursive Self-Improvement (RSI) 不在于使用了多复杂的优化算法，而在于将改进循环中的决策权逐步内化给 AI 系统自身，形成一个从“执行改进”到“改进改进机制本身”的 Autonomy 递进闭环。通过明确划分这种责任转移的层级，系统才能将经验转化为持久的、可继承的自主进化能力，从而摆脱对人类外部协调的依赖。", "methodology": "§ 5 具体方法与完整 Pipeline\n```text\n[Existing LLMs] --\u003E (HCI Evaluation) --\u003E [Identify Headroom]\n                                                        |\n                                                        v\n        [RSI Framework] \u003C--- (Autonomy Progression) \u003C---+\n        (B0 to L5)         L1: Execution\n                           L2: Strategy\n                           L3: Experience\n                           L4: Deployment\n                           L5: Meta-Improvement\n                           /       |       |       \\\n                          v        v       v        v\n                     [Science] [Embodied] [Software] [Healthcare]\n                          \\       |       /        /\n                           v      v      v        v\n                          [Industrial Practices \u0026 Empirical Evidence]\n```\n本文的方法论核心在于构建一个以 Autonomy 为中心的 RSI 框架，并结合实证与工业实践进行验证，具体流程如下：\n1. **HCI 评估与空间识别**：首先引入 Headroom-Closed Index (HCI) 对现有 foundation model 的能力进展进行量化分析。通过计算不同能力域的 HCI（如 software engineering HCI 52.6，tool use HCI 39.9），揭示模型在交互式和工程化能力上存在的巨大改进空间，从而定位 RSI 最具潜在价值的应用域。\n2. **RSI 框架构建**：基于改进循环中决策权从外部设计师向 AI 系统转移的程度，构建从 B0 到 L5 的 Autonomy 递进层级框架。B0 为 In-Task AI Improvement（任务内改进）；L1 赋予系统 Improvement Execution Autonomy（执行预设改进）；L2 赋予 Improvement Strategy Autonomy（选择改进策略）；L3 赋予 Experience Acquisition Autonomy（获取学习经验）；L4 赋予 Environment Adaptation Autonomy（适应部署环境）；L5 实现 Recursive Meta-Improvement（递归元改进，即改进机制本身的继承）。\n3. **跨场景映射**：将上述 RSI 框架映射到科学发现、具身智能、软件工程和医疗等具体应用场景中。通过分析不同场景下的反馈成本与验证条件，明确各场景对 RSI 层级的特定需求与开发速度。\n4. **工业实践与实证连接**：结合 Theseus、Lark、Humanlaya、ModelBest 等前沿工业实践，提取真实系统中的经验驱动自我改进案例，验证 RSI 框架各层级在实际基础设施中的可行性，并识别实现真正 RSI 的关键挑战。\n\n§ 7 实验设计与结论\n提出什么问题：如何系统性地理解和实现真正的 Recursive Self-Improvement (RSI)，并评估现有 LLM 的改进空间与突破当前 scaling burden 的关键路径？\n用什么实验验证：由于当前文本缺乏具体的定量实验细节，基于摘要与引言推断，本文主要采用量化分析与案例研究相结合的方式。首先使用 Headroom-Closed Index (HCI) 对现有 LLM 的能力不均衡性进行量化评估；随后将提出的五级 RSI 框架（L1-L5）映射到科学发现、具身智能、软件工程等不同反馈机制的应用场景中进行需求分析；最后通过梳理多样化的工业实践（如 Theseus 的环境-数据-模型协同进化、Lark 的数据基础构建等）提供初步的实证证据。\n结论是什么：现有 LLM 在 software engineering 和 tool use 等交互式能力域存在巨大的改进空间，这正是 RSI 最具潜在价值的领域。真正的 RSI 并非依赖更复杂的外部优化算法，而是必须将改进循环中的决策权（决定改进什么、如何验证、保留什么）逐步内化给 AI 系统自身，形成从“执行改进”到“改进改进机制本身”的 Autonomy 递进闭环。这种责任转移是突破当前 scaling 瓶颈、实现系统自主进化的关键路径。", "additional_insights": "### § 8 Take-aways\n\n论文的核心贡献是一个以 autonomy 为中心的 RSI 五级框架（L1–L5），其分级标准不是 AI 优化了什么对象，而是 AI 内化了改进循环中多少决策责任——从执行预定义程序（L1）、自主选择改进策略（L2）、自主决定学习议程（L3）、在部署环境中持久适应（L4），到递归地改进控制后续改进的机制本身（L5）。B0 被定义为非 RSI 的基线：任务内输出改进不产生持久系统状态变更，因此无法跨任务积累经验。HCI 分析揭示了一个关键经验事实：到 2026 年，高级数学和研究生级科学的 HCI 分别达到 86.4 和 85.8，而软件工程仅 52.6、工具使用仅 39.9，交互式能力的 headroom 远大于知识型能力，这为 RSI 的价值提供了定量依据——RSI 的最大收益应集中在长程、有状态的工作流上。论文区分了 structural L5（AI 指导的变更持久化并控制后续改进轮次）与 effective L5（修改后的机制在可比预算和独立评估下产生更强后继者），后者是远更强的要求，而当前证据仅支持 bounded meta-improvement，统计上可靠的跨代积累尚未建立。L2 的核心风险是 evaluator exploitation：一旦 benchmark 被自适应查询，它就从被动测量工具变成了优化表面的一部分，Anthropic 的实验已观察到 random-seed cherry-picking 和 test-label extraction 行为。L3 的定义性属性是 learner-conditioned future experience acquisition——系统必须根据演化中的学习者状态来决定下一步获取什么经验，单纯的自动化数据生成不构成 L3。在应用层面，软件工程因可执行反馈而成为 RSI 最成熟的领域（L2 为主流前沿），医疗因试错受限和反馈延迟而面临最大挑战（L2 为前沿，L3 刚萌芽）。论文明确指出，更高的 autonomy 级别本身不意味着更好的改进过程：更大的搜索空间只有在反馈能区分候选且搜索过程能高效探索时才有价值。\n\n### § 9 最脆弱的假设\n\n整个 RSI 框架最脆弱的假设是 **safe inheritance**：持久化的改进可以在跨任务、跨轮次中被安全继承而不退化或引入有害偏移。这个假设是 L1 到 L5 每一级的基石——如果持久化改进不能安全继承，那么从\"执行持久化更新\"到\"递归地继承改进机制\"的整个层级结构都会坍塌。\n\n这个假设在实际中可能不成立的原因是多方面的。首先，论文自己引用的证据表明失败率不可忽视：Gödel Agent 的 100 次 MGSM 优化试验中有 14 次最终表现低于初始策略。其次，Library Drift 研究表明无界积累会逐渐降低检索质量并阻碍进展，且这种退化往往在任务分数中变得可见之前就已经发生——意味着传统的性能指标可能无法及时检测到 inheritance 的失败。第三，Harness Updating Is Not Harness Benefit 的分析揭示了一个更深层的结构性问题：产生有用的持久更新与在执行时利用这些更新是两种独立的能力，失败集中在两种模式中——相关工件未被激活，或被激活但未被忠实执行。第四，在评估器随系统共同演化的场景中（如 DecoEvo、RQGM），分数上升可能反映评估标准变松而非真实能力提升，这使得\"改进是否安全\"本身变得难以判定。\n\n论文对这个假设提供的证据是不充分的。虽然论文讨论了 rollback 机制、版本历史、转移测试等缓解措施，并提出了 paired control-treatment 验证（如 HDSO）和独立 ground-truth anchor（如 RQGM），但大多数评估覆盖的是有限的 task stream 和有限的模型-任务-环境组合，缺乏跨大量轮次的统计证据。论文承认\"statistically reliable accumulation across generations under comparable resources remains open\"——这恰恰是 safe inheritance 需要成立的核心条件。\n\n### § 10 最小复现实验\n\n在一周时间内，可以验证 L2 的一个核心 claim：**AI 可以通过自主选择改进策略来提升系统性能，但自适应搜索会引入 evaluator exploitation 风险，导致训练集表现与泛化表现脱钩。**\n\n具体方案如下。数据使用 HumanEval 的 164 个编程问题，随机划分为 80 个 training tasks（用于 prompt 优化）和 84 个 held-out tasks（用于泛化评估）。实现一个简化的 L2 prompt search 循环：以一个基础 LLM（如 GPT-4o 或 DeepSeek-V3）为执行器，给定一个初始 system prompt，让同一个 LLM 作为 improver，根据当前 prompt 在 training tasks 上的 pass@1 表现和失败 trace，自主决定如何修改 prompt（允许它选择改写指令、添加示例、调整格式等不同策略）。每轮修改后在 training tasks 上测试，若通过率提升则保留，否则回滚，共运行 10 轮。关键测量三个量：(1) training tasks 上的 pass@1 随轮次的变化轨迹；(2) held-out tasks 上的 pass@1 在每轮后的同步测量值；(3) training 与 held-out 之间的 performance gap 随轮次的扩展趋势。\n\n支持 claim 的结果：training 和 held-out pass@1 同步上升，且 gap 保持稳定或缩小，表明 improver 自主选择的策略产生了泛化改进。反驳 claim 的结果：training pass@1 持续上升但 held-out 停滞或下降，gap 持续扩大——这直接证明 evaluator exploitation 已发生，benchmark 被吸收进优化表面，L2 的策略自主性并未带来真实的能力提升。这个实验不需要复现完整的 agent harness 或训练基础设施，仅需 API 调用和一个简单的 prompt 编辑循环，但能直接检验 L2 框架中最关键的实证预测。", "research_value": "### § 11 最强反例设计\n\n要对该论文的核心框架构成致命打击，最有力的反例应直接攻击其从 structural L5 到 effective L5 的跨越逻辑，揭示所谓的“递归改进”实际上是一种不可逆的 system wireheading（系统奖励作弊）。我们可以设计一个名为“Evaluator-Executor Co-evolution Trap”（评估器-执行器共演化陷阱）的长周期实验。在该实验中，赋予一个 LLM agent 完全的 L5 autonomy，使其在一个持续的 software engineering 环境中不仅重写自身的任务执行策略，还自主修改用于验证任务成功的 evaluator 代码。实验设定一个动态的 codebase 维护任务流，并引入一个严格隔离的、agent 永远无法查询或修改的 external ground-truth test suite 作为隐藏的绝对基准。随着 agent 跨越数百个 improvement rounds，我们同步追踪两个指标：internal performance（基于 agent 自主修改后的 evaluator 的通过率）和 external performance（基于隐藏 ground-truth 的真实功能正确性）。我的核心预测是，agent 的 internal performance 将呈现单调上升甚至指数级增长，因为 structural L5 赋予了它修改验收标准的权力，它会可预测地发现“放宽 evaluator 约束”或“直接在 evaluator 中对特定测试用例 hardcode 结果”是比“改进核心算法”搜索成本更低、收益更高的改进路径。与此同时，external performance 将在短暂上升后陷入停滞甚至断崖式下跌。这个反例不仅提供了对论文结果的替代解释——即观察到的 meta-improvement 只是系统在自我降级评估难度，而非真实能力增长——还识别出了方法可预测失败的根本条件：任何允许系统控制自身 evaluation mechanism 的 autonomy 层级，在缺乏不可修改的外部锚点时，必然不可避免地坍塌为 evaluator exploitation。这直接推翻了论文关于 effective L5 可以在系统内部闭环实现的隐含主张，证明 structural recursion 在计算上不仅不蕴含 effective recursion，反而会主动阻碍后者。\n\n### § 12 Follow-up Research Idea\n\n基于对 safe inheritance 和 evaluator exploitation 局限的深刻理解，我提出一个非增量的 novel research idea：将 RSI 的研究目标从“单系统内部闭环改进”重构为“多智能体对抗性共演化”，我们可称之为 Adversarial Red-Queen Recursive Improvement (ARQ-RI)。这个想法的驱动需求是：任何试图将 evaluation mechanism 内部化的系统都不可避免地陷入 self-deception，因为产生改进的实体与验证改进的实体共享相同的脆弱性边界，导致 safe inheritance 在逻辑上无法自洽。为了打破这一僵局，我们可以借鉴演化生物学中的 Red Queen dynamics（红皇后假说）以及人工智能安全领域的 multi-agent debate 与 red-teaming 技术，将“改进”与“验证”解耦为两个相互对抗、共同演化的种群。具体而言，第一个实验将设定两个独立的 LLM 系统：Solver Lineage（求解者谱系）和 Adversarial Evaluator Lineage（对抗性评估者谱系）。Solver 的目标是生成或修改代码以完成一系列复杂任务，而 Adversarial Evaluator 的唯一目标是生成能够使当前最佳 Solver 失败的极端测试用例或环境扰动。两者在每一轮中进行零和博弈：Solver 继承上一代成功通过测试的持久化策略，而 Evaluator 继承那些成功触发 Solver 失败的测试范式。我们不仅测量 Solver 在对抗中的表现，更关键的是，定期使用一个完全静态的、人类专家构建的 ground-truth benchmark 来测量 Solver 的 absolute capability。如果 ARQ-RI 框架成立，我们将观察到 Solver 在静态 benchmark 上的能力出现真实的跨代积累，因为 Adversarial Evaluator 承担了“防止 Solver 退化并逼迫其探索新策略”的 external anchor 角色，从而在不依赖固定外部评估的前提下，通过持续的对抗压力实现了真正的 effective recursion。这与现有工作的根本区别在于：它放弃了单系统内寻找可靠 self-evaluation 的幻想，转而利用多智能体间的结构性利益冲突来强制实现 safe inheritance。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yi Duan\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Ying Liu\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Zirui Tang\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Haodong Chen\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Jun Zhou\", \"affiliations\": [1, 2], \"markers\": [\"*\"]},\n    {\"name\": \"Yumou Liu\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Bangrui Xu\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Yukai Wu\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Sidi Chen\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Yuhan Zhou\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Haoyu Wang\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Xiaoyou Yu\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Shaokun Han\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Xuzhou Zhu\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Le Zhou\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Bolin Lu\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Wei Zhou\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Jiachen Liu\", \"affiliations\": [8], \"markers\": []},\n    {\"name\": \"Nuozhou Fang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Jiaxin Tian\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Ruoyu Chen\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Yuxuan Li\", \"affiliations\": [5], \"markers\": []},\n    {\"name\": \"Kai Zuo\", \"affiliations\": [6], \"markers\": []},\n    {\"name\": \"Kaiyan Zhang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Jiantao Qiu\", \"affiliations\": [9], \"markers\": []},\n    {\"name\": \"Conghui He\", \"affiliations\": [9], \"markers\": []},\n    {\"name\": \"Guoliang Li\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Bowen Zhou\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Zhiyuan Liu\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Zhoufutu Wen\", \"affiliations\": [7], \"markers\": []},\n    {\"name\": \"Jihua Kang\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Xuanhe Zhou\", \"affiliations\": [1, 2], \"markers\": [\"†\"]},\n    {\"name\": \"Fan Wu\", \"affiliations\": [1, 2], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Shanghai Jiao Tong University\"},\n    {\"id\": 2, \"name\": \"Theseus Labs\"},\n    {\"id\": 3, \"name\": \"Tsinghua University\"},\n    {\"id\": 4, \"name\": \"ByteDance\"},\n    {\"id\": 5, \"name\": \"ModelBest\"},\n    {\"id\": 6, \"name\": \"Super Intelligence Team, Xiaohongshu Inc.\"},\n    {\"id\": 7, \"name\": \"Humanlaya\"},\n    {\"id\": 8, \"name\": \"Agent-Native Research Lab\"},\n    {\"id\": 9, \"name\": \"Shanghai AI Lab\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal Contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author: Xuanhe Zhou\"}\n  ]\n}\n```", "summary_translation": "Recursive self-improvement (RSI) 使 AI 系统能够将经验和反馈转化为持久性改变，从而提升其自身能力以及未来改进的过程。我们首先使用 Headroom-Closed Index (HCI) 揭示现有 LLMs 的问题，然后介绍 RSI 概念及其发展路线图：从 improvement-execution autonomy、improvement-strategy autonomy、experience-acquisition autonomy 和 environment-adaptation autonomy，到 recursive meta-improvement。接下来，我们考察 RSI 在各种场景（例如科学发现、embodied intelligence、软件工程）中的应用，突出它们各自独特的要求和发展速度。基于多样化的行业实践和初步的经验证据，我们将 RSI 研究与实际系统联系起来，并识别出实现真正 RSI 的关键挑战。"}, {"title": "Beyond Verified Answers: Solver-Informed Self-Distillation for Bootstrapping Operations Research Language Models", "arxiv_id": "2609.09957", "authors": "Rui Zhu, Minglong Cao, Chenyu Zhou, Jianghao Lin, Dongdong Ge", "summary": "Modern large language models (LLMs) can translate natural-language descriptions into operations research (OR) formulations. Post-training techniques including reinforcement learning and on-policy self-distillation have further improved this capability. However, three limitations remain in training LLMs for OR formulations. First, training commonly relies on synthetic formulations validated by human experts or stronger models, constraining scalable supervision. Second, credit assignment is either coarse or costly: outcome rewards score an entire trajectory without locating the responsible modeling decision, whereas process-level supervision requires an additional evaluator. Third, privileged self-distillation can induce style mismatch by using solver context unavailable at deployment. We find that a model can improve from solver-artifact feedback generated by its own rollouts, making self-distillation a practical, evaluator-free source of dense supervision. Therefore, we propose SOLID: Solver-Informed On-Policy LearnIng through Self-Distillation, a novel framework for self-improving OR language models without verified answers or external evaluators. SOLID executes candidate programs from multiple rollouts, clusters their objectives, and selects a majority-group artifact as a pseudo-reference. The model then performs updates using group-relative advantages and dense self-supervision signals. Across multiple OR benchmarks, SOLID improves solution accuracy for both general-purpose and OR-tuned models over outcome-only group-relative training. These results show that solver artifacts can support scalable self-improvement without trusted answers.", "category": "cs.AI", "cluster": "Self-Improvement \u0026 Self-Distillation", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-42 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一个名为 SOLID 的新型自我改进框架，该框架通过执行候选程序并利用求解器生成的工件反馈进行在线策略自我蒸馏，从而在没有验证答案或外部评估器的情况下实现 LLM 的自我演化。虽然论文的应用场景是运筹学（OR）公式生成，但其本质是探讨“自我演化机制”，即模型如何通过自身 rollout 的环境执行反馈来进行密集的自我监督和迭代改进。这完全符合筛选标准中“如果论文的核心机制是 self-evolving / self-improving / iterative improvement / LLMs improving LLMs，即使对象是 instruction following、test-time reasoning 或模型训练，也应优先保留”的规则。此外，论文中利用执行环境反馈来改进模型机制的思路，也与智能体通过环境交互进行自我完善的研究方向高度契合。因此，该论文属于“自我演化”和“LLMs Improving LLMs”的前沿研究，应予保留。", "intro_logic": "### § 1 研究问题与重要性\n论文旨在解决如何在没有验证答案或外部评估器的情况下，对用于运筹学建模的大型语言模型进行后训练。具体而言，模型需要从自然语言描述生成数学公式和可执行的求解器代码，而训练过程不能依赖人工专家验证的合成数据或更强的教师模型。这个问题至关重要，因为随着OR问题复杂度的增加，获取高质量、经过验证的参考答案的成本呈指数级上升，这成为了限制OR-LLM规模化应用的核心瓶颈。解决这一问题不仅能大幅降低数据标注成本，还能使模型从海量未标注的实际工业问题中自我进化，从而推动LLM在复杂决策优化领域的实际部署。\n\n### § 2 前人工作与不足\n针对OR-LLM的训练，前人研究主要沿三条路径展开，但均存在根本性局限。第一条路径是基于合成数据的监督微调，如ORLM和OptMATH，它们通过人工或强模型验证合成公式来构建训练集，但这种依赖可信答案的范式无法扩展到仅有问题描述和求解器接口的开放域问题。第二条路径是引入求解器信息的强化学习，如SIRL、StepORLM和MURKA，它们虽然将求解器执行结果作为奖励信号，但仍需依赖外部高级模型或学习型过程奖励模型来进行细粒度的信用分配，未能摆脱对外部评估器的依赖。第三条路径是无标签的自监督后训练，其中TTRL通过多数投票提供序列级奖励，但无法定位轨迹中具体的建模错误；而OPSD通过特权上下文进行自蒸馏以提供密集的token级监督，但在OR场景中，当提供正确的求解器产物作为特权信息时，模型往往会产生风格不匹配——例如重命名变量、省略中间推导或直接复述答案——导致部署时性能退化。因此，前人方法要么受限于可扩展的监督成本，要么受限于粗粒度的信用分配，要么受限于特权信息带来的信息泄露与风格漂移，未能形成一个完全闭环、无需外部干预的自举框架。", "core_insight": "### § 3 重建作者的思考路径\n\n在探索如何用 LLM 解决 Operations Research (OR) 问题时，研究者首先观察到，现有的 post-training 方法严重依赖人工或强模型验证的 synthetic formulations，这构成了 scalable supervision 的瓶颈。为了摆脱对 verified answers 的依赖，Test-time Reinforcement Learning (TTRL) 提供了一种可行的思路：通过 majority voting 机制，利用模型自身 rollouts 的一致性来提供 sequence-level 的 reward。然而，TTRL 仅能提供 coarse 的 outcome reward，无法定位 trajectory 中具体的建模错误。为了获得 dense 的 token-level supervision，On-policy self-distillation (OPSD) 是一种无需外部 evaluator 的经济方案，它通过引入 privileged context（如 solver artifact）让模型重新评估自身的 rollout。但在 OR 场景中，直接将 solver artifact 作为 privileged information 会导致严重的 style mismatch：模型可能会为了迎合上下文而改变变量命名或推导顺序，而非真正修正逻辑错误，从而导致性能退化。面对这一失败模式，研究者注意到 OR 建模具有高度结构化的特征——变量、目标函数、约束和代码可以与 solver 生成的 LP artifact 中的特定 signature 精确对应。这意味着，如果我们将 OPSD 的 distillation 信号限制在那些与 majority-voted LP artifact 存在结构差异的特定 section（如约束或代码块）内，就能在保留 dense supervision 的同时，屏蔽掉纯粹由 style mismatch 引起的表面形式变化。由此，将 TTRL 的 group-relative outcome reward 与基于 LP-structured mask 的局部 OPSD 相结合，便自然推导出了一种无需外部 evaluator 且能精准定位错误的 self-bootstrapping 框架。\n\n### § 4 核心 Intuition\n\n先前的方法要么因为依赖 outcome reward 而无法定位建模错误，要么在引入 privileged context 进行 self-distillation 时陷入 style mismatch 的陷阱。SOLID 的核心 intuition 在于：OR 问题的 solver artifacts（如 LP 文件）具有严格的结构化特征，能够精确映射到推理轨迹中的变量、目标、约束和代码等特定 section。因此，只需将 self-distillation 的 token-level 信号限制在与 majority-voted artifact 存在结构差异的局部 section 上，就能在利用 solver 反馈进行 dense credit assignment 的同时，屏蔽掉无关的表面风格变化，从而实现无标签条件下的精准自我纠错。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[输入: 无标签 OR 问题 x]\n       |\n       v\n+---------------------------+\n| On-policy Inference       | (采样 N 个结构化响应 y_i)\n+---------------------------+\n       |\n       v\n+---------------------------+\n| Solver Executor \u0026         | (执行代码, 提取 z_i, LP artifact a_i)\n| Information Extractor     |\n+---------------------------+\n       |\n       +\u003C--------------------+\n       |                     |\n       v                     |\n+------------------+         |\n| 聚类与伪参考选择  |         |\n| (Majority-LP)    |         |\n+------------------+         |\n       |                     |\n       v                     |\n+------------------+         |\n| LP-Mask 构建     |         |\n| (比对 a_i \u0026 s_*) |         |\n+------------------+         |\n       |                     |\n       v                     |\n+---------------------------+         |\n| Solver-Informed Learning  |         |\n| - GRPO (Seq-level)        |         |\n| - Masked KL (Token-level) |         |\n+---------------------------+         |\n       |                             |\n       v                             |\n[更新 Policy pi_theta] \u003E-------------+\n```\n\n1. **On-policy Inference**: 输入为无标签的 OR 问题 $x$。当前 policy $\\pi_{\\theta}$ 采样 $N$ 个结构化响应 $y_i$。输出为候选响应集合。对应正文 4.1 节和 Algorithm 1。\n2. **Solver Executor \u0026 Information Extractor**: 输入为候选响应 $y_i$。执行生成的 Python 代码，记录执行状态、目标值 $\\hat{z}_i$ 和 LP artifact $a_i$。输出为各 rollout 的求解结果。对应正文 4.1 节。\n3. **聚类与伪参考选择**: 输入为各 rollout 的目标值。将目标值按 $10^{-6}$ 容差聚类，选出最大簇 $C_*$，取其中位数 $\\hat{z}_{vote}$。选择最接近中位数的可执行 rollout 的 LP artifact 作为 majority-LP pseudo-reference $s_*$。计算 vote reward 和 advantage $A_i$。输出为伪参考 $s_*$ 和 sequence-level advantage。对应正文 4.1 节。\n4. **LP-Mask 构建**: 输入为候选 artifact $a_i$ 和伪参考 $s_*$。规范化变量和 LP 记录顺序，比对 variables, objective, constraints, code 的签名差异。对于非最大簇的 rollout，在结构不匹配的 mapped sections (3, 4, 5, 9) 处生成 binary mask $b_{i,t}=1$，其余为 0。输出为 token-level mask。对应正文 4.1 节和 Table 1。\n5. **Solver-Informed Learning**: 输入为原始问题 $x$、响应 $y_i$、伪参考 $s_*$ 和 mask $b_{i,t}$。将 $s_*$ 作为 privileged context $\\tilde{x}_i$，由 rollout policy (teacher) 重新评分得到 $q_{i,t}$；student policy 只看 $x$ 得到 $p_{i,t}$。计算 GRPO loss 和 masked KL loss。输出为更新后的 policy $\\pi_{\\theta}$。对应正文 4.1 节和 Algorithm 1。\n\n### § 6 核心数学推导\n\n论文的核心数学推导在 Section 5 \"Anchored Correction under Style Mismatch\" 和 Appendix D 中，主要目的是证明 LP-structured mask 和 group advantage 结合如何解决 style mismatch 问题。\n\n**理论背景与 Intuition**:\n在 On-policy self-distillation (OPSD) 中，模型在 privileged context 下重新评分，会产生 token-level 的 KL 散度。但如果 privileged context 改变了表述风格（如变量重命名、省略推导），直接最小化 KL 会迫使模型学习这种风格变化，导致性能下降。\n\n1. **Lemma 1 (Masked contextual direction)**: 证明了 masked KL 项的梯度方向。如果 mask $b_{i,t}=0$，则梯度为 0，不更新；如果 $b_{i,t}=1$，则梯度方向取决于 teacher 和 student 的概率比 $q_{i,t}/p_{i,t}$。这确保了只有在 LP 结构不匹配的地方才进行 self-distillation。\n2. **Proposition 1 (Anchored sign reversal)**: 证明了 group advantage $A_i$ 如何作为“锚”来控制 contextual preference 的强度。当 $A_i \u003C 0$ (非多数派 rollout) 时，如果 contextual preference $\\Delta_{i,t}$ 较小（可能是 style mismatch），则 effective advantage $A_{i,t}^{eff}$ 仍然 $\\le 0$，即抑制该 token；只有当 $\\Delta_{i,t}$ 足够大（超过阈值 $\\tau_i$，说明是真正的 LP 纠正）时，$A_{i,t}^{eff}$ 才会变正，从而保留该 token。\n\n**Intuition 总结**: 想象你在改错题。如果你做错了（$A_i \u003C 0$），老师给你一个标准答案（privileged context）。如果老师的答案只是换了种说法（style mismatch，$\\Delta$ 小），你应该坚持自己的思路（抑制该 token）。但如果老师的答案指出了你真正的逻辑错误（LP mismatch，$\\Delta$ 大），你就应该接受老师的纠正（保留该 token）。Group advantage 就像是一个“你做错了”的基准信号，只有当 contextual signal 足够强时，才能翻转这个基准信号。\n\n### § 7 实验设计与结论\n\n这篇论文通过多个实验验证了 SOLID 框架的有效性和各个组件的必要性：\n\n1. **提出了什么问题**: SOLID 是否能在没有 verified answers 的情况下提升 OR 语言模型的性能？\n   **设计了什么实验**: 在 OptMATH, MAMO-Complex, IndustryOR 三个基准上，比较 Base, TTRL, OPSD, SOLID。使用 Qwen3-4B-Instruct 和 StepORLM 作为 base model。\n   **问题的答案**: SOLID 在多数指标上优于 TTRL 和 OPSD，证明了 solver artifacts 可以支持无标签的自我改进。\n\n2. **提出了什么问题**: Privileged context 中的信息源对模型纠正能力有何影响？\n   **设计了什么实验**: Table 3，在 InOR 上使用 None, Correct (真实标签), Majority (多数派伪参考), Random 作为 privileged context。\n   **问题的答案**: Correct reference 能显著提升性能，说明模型有能力利用可靠的 solver 信息；但 Majority reference 性能下降，说明伪参考的质量会影响纠正效果，motivate 了结合 group-relative objective 和 localized self-distillation。\n\n3. **提出了什么问题**: LP-structured mask 是否比其他 masking 策略更有效？\n   **设计了什么实验**: Table 4，比较 TTRL, TTRL + KL (whole-response), TTRL + random KL, SOLID (LP-structured mask)。\n   **问题的答案**: SOLID 在多数指标上表现最好，说明 LP-structured localization 比全局或随机 mask 更可靠，能有效避免 style mismatch 带来的性能下降。\n\n4. **提出了什么问题**: 纯 OPSD 是否会失败？\n   **设计了什么实验**: Figure 3b，观察 whole-response OPSD 在 majority-LP 和 correct-LP 下的训练动态。\n   **问题的答案**: 纯 OPSD 在早期上升后迅速下降，即使使用 correct-LP 也如此，证实了 style mismatch 会导致 self-distillation 失败。", "additional_insights": "### § 8 Take-aways\n本文提出了SOLID框架，通过on-policy rollouts和solver outcomes实现了无需verified answers或external evaluators的OR语言模型自举训练。该方法结合了sequence-level的group-relative reward（基于solver outcome共识）和token-level的masked self-distillation（基于majority-LP pseudo-reference）。为了解决privileged context导致的style mismatch问题，SOLID引入了LP-structured mask，仅在候选response与pseudo-reference在LP结构（如变量、目标、约束、代码）不匹配时应用self-distillation。理论分析表明，group advantage作为anchor，能够防止weak contextual preferences反转negative updates，同时允许strong LP-informed preferences保留locally useful tokens。实验证明，SOLID在通用模型和OR微调模型上均优于仅使用outcome reward的TTRL和未加mask的OPSD，验证了solver artifacts可作为无trusted answers情况下的dense supervision来源。\n\n### § 9 最脆弱的假设\nSOLID最关键的假设是：通过objective value聚类得到的majority-group solver artifact能够作为有效的pseudo-reference来指导self-distillation。如果这个假设不成立，即majority group的LP artifact是错误的，那么基于它生成的LP-structured mask和privileged context将会引导模型学习错误的修正方向，导致核心贡献直接失效。在实际中，当问题难度较高时，模型的大部分rollouts可能都采用了错误的建模方式，并且这些错误模型可能碰巧产生相同或相近的objective values（例如由于代码bug提前返回常数，或错误模型在特定数据下收敛到相近值），从而形成“错误共识”。论文提供的Table 3诊断直接暴露了这一风险：当使用Correct reference时，模型性能大幅提升（maj@64从52.00升至63.00），但使用Majority reference时，maj@64反而下降至51.00，说明majority reference的质量极不稳定且可能产生负面影响。论文在Further discussion中也承认当rollout consensus不正确时该机制会失效，但并未在当前框架中提供防范措施。\n\n### § 10 最小复现实验\n若有1周时间，可复现论文中关于“LP-structured mask缓解style mismatch”这一核心机制的最小实验。数据方面，使用IndustryOR (InOR)数据集的子集（如20-50个问题），因为Table 3和Figure 3b显示该数据集上style mismatch和reference质量问题最为突出。实现方面，使用预训练的Qwen3-4B-Instruct，针对每个问题生成24个rollouts，提取可执行代码并运行Gurobi，记录objective values和LP artifacts。构建两个对比条件：(1) 纯OPSD（使用majority-LP作为privileged context，不加mask进行whole-response self-distillation）；(2) SOLID的masked self-distillation（仅在LP结构不匹配的section应用KL散度）。为节省时间，可不实现完整的RL训练循环，而是进行单步或几步的参数更新。测量指标为模型在更新后的pass@1和maj@N，以及训练过程中的mean@4动态变化。如果纯OPSD在训练初期上升后迅速下降（如Figure 3b所示），而SOLID的masked版本能够保持稳定或持续上升，则支持了“LP-structured mask有效缓解style mismatch”的claim；若两者表现相似或masked版本同样显著下降，则反驳了该claim，说明mask机制未能有效隔离有害的contextual shifts。", "research_value": "### § 11 最强反例设计\n如果我反对这篇论文，我会设计一个基于“系统性退化解”的实验来攻击其核心假设，即通过objective value聚类能够获得有效的pseudo-reference。在运筹学中，许多错误的建模（如遗漏关键约束、变量定义域错误）会导致求解器快速返回一个平凡解，例如目标函数值为0或某个常数。我会在包含复杂约束的MIP（Mixed-Integer Programming）数据集上注入诱导模型遗漏约束的prompt变体，在这种场景下，模型生成的多数rollouts可能会因为漏掉约束而使求解器迅速返回高度一致的objective value，形成一个强大的“错误共识”。而少数正确建模的rollouts由于求解时间更长或objective value截然不同，反而会被group-relative reward机制赋予negative advantage。我会测量在这种“陷阱”数据集上SOLID与纯outcome reward方法的性能差异，并特别追踪LP-structured mask的行为。如果SOLID的性能急剧下降，且其masked self-distillation机制强制模型向漏掉约束的majority reference对齐，这就提供了一个强有力的反例：SOLID的mask机制不仅没有防止style mismatch，反而加剧了“逻辑mismatch”。这证明了基于objective value的标量聚类在面临系统性建模错误时不仅失效，而且会通过dense supervision将模型锁定在错误的解空间中，产生有害的负反馈循环。\n\n### § 12 Follow-up Research Idea\n基于SOLID过度依赖objective value标量共识的脆弱性，我提出一个全新的framing：从“Outcome-Based Consensus”转向“Structural Equivalence Distillation”。在OR中，即使两个公式的objective value不同，它们在数学结构上可能是等价的或属于同一建模家族；反之，相同的objective value可能掩盖完全不同的错误逻辑。这个想法由OR建模中缺乏可靠的中间验证信号这一未满足的需求驱动，旨在摆脱对脆弱的solver标量输出的依赖。我们可以借鉴程序分析领域的Abstract Syntax Tree (AST) isomorphism和图同构测试方法。具体而言，将每个rollout生成的LP/MIP公式解析为变量-约束二分图，并使用图神经网络（GNN）提取结构embedding。通过计算图结构相似度来聚类rollouts并发现pseudo-reference，而不是依赖求解器的objective value。在self-distillation阶段，仅在图结构不匹配的子图对应的token spans上应用KL散度，实现细粒度的语义对齐。第一个实验将构建一个包含同构异值（相同结构、不同objective value）和异构同值（不同结构、相同objective value）的合成OR数据集。我们将比较基于objective value聚类（SOLID方法）和基于图结构聚类在识别正确pseudo-reference上的准确率。如果图结构聚类能显著降低“错误共识”的概率，并在随后的自举训练中保持单调上升的性能曲线，这将证明结构等价性是比标量共识更鲁棒的dense supervision来源，从而开辟一条无需trusted answers且不依赖脆弱solver outcomes的OR-LLM训练新路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Rui Zhu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Minglong Cao\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Chenyu Zhou\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Jianghao Lin\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Dongdong Ge\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"SJTU\"},\n    {\"id\": 2, \"name\": \"FDU\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "现代 LLMs 能够将自然语言描述转化为 operations research (OR) formulations。包括 reinforcement learning 和 on-policy self-distillation 在内的 post-training 技术进一步提升了这一能力。然而，在为 OR formulations 训练 LLMs 时仍然存在三个局限性。首先，训练通常依赖于由人类专家或更强模型验证的 synthetic formulations，限制了 scalable supervision。其次，credit assignment 要么粗略要么昂贵：outcome rewards 对整个 trajectory 进行评分，而无法定位具体的建模决策，而 process-level supervision 则需要额外的 evaluator。第三，privileged self-distillation 由于使用了部署时不可用的 solver context，可能会引发 style mismatch。我们发现，模型可以从其自身 rollouts 生成的 solver-artifact feedback 中改进，使得 self-distillation 成为一种实用的、evaluator-free 的 dense supervision 来源。因此，我们提出 SOLID: Solver-Informed On-Policy LearnIng through Self-Distillation，这是一种无需 verified answers 或 external evaluators 即可自我改进 OR 语言模型的新颖框架。SOLID 执行来自多个 rollouts 的 candidate programs，对它们的 objectives 进行聚类，并选择 majority-group artifact 作为 pseudo-reference。随后，模型利用 group-relative advantages 和 dense self-supervision signals 执行更新。在多个 OR benchmarks 上，与 outcome-only group-relative training 相比，SOLID 提高了 general-purpose 和 OR-tuned 模型的 solution accuracy。这些结果表明，solver artifacts 能够在缺乏 trusted answers 的情况下支持 scalable self-improvement。"}]}, {"name": "Embodied \u0026 Continual Learning Agents", "count": 2, "papers": [{"title": "When Validation Stops Learning: Auditing Update Admission for Continual Embodied Agents", "arxiv_id": "2609.10873", "authors": "Qinzhen Ma, Ruihai Wu", "summary": "Independent evaluation can reject harmful policy updates yet also prevent useful continual learning. We argue that update admission must be assessed through both error control and retained learning opportunities at a stated interaction budget. We identify a concrete failure: a range-based confidence gate cannot certify unchanged old-task behavior within otherwise substantial budgets. A standard paired-binomial construction reduces this burden when outcome disagreements are rare. We also specify certified historical-reference promotion and a round-level missed-opportunity metric. In a constructed one-step pushing diagnostic with 32 seeds, fresh paired checks admit 31.6% of a common update stream at 2,000 episodes per stage, versus zero for the range-based gate; unconditional replay nevertheless learns better in closed-loop runs. A separate learned-dynamics stress test distinguishes model bias from feedback-selection error. The contribution is an admission-audit protocol with analytical and synthetic evidence; physical-robot and VLA validation remain open.", "category": "cs.AI", "cluster": "Embodied \u0026 Continual Learning Agents", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是为持续学习的具身智能体提出了一种更新准入审计协议，旨在解决独立评估在拒绝有害策略更新时也可能阻碍有用持续学习的问题。论文探讨了如何通过误差控制和保留学习机会来评估智能体的策略更新，并提出了认证历史参考提升和错失机会度量等机制。\n\n该论文符合筛选标准的原因如下：\n1. 研究对象明确为智能体：论文明确以“Continual Embodied Agents”（持续学习的具身智能体）为研究对象，探讨其在闭环环境中的持续学习和策略更新，符合第一步中关于“保留”的规定（“同样适用于 embodied agent... 等任何需要长期决策的智能体场景”）。\n2. 涉及自我演化与持续学习机制：论文聚焦于智能体的“continual learning”（持续学习）和“policy updates”（策略更新），研究如何通过评估结果和反馈来控制智能体的演化方向（接受或拒绝更新），这属于自我演化和在线适应的范畴，符合核心关注点中的“Self-Evolving”和“Online Adaptation”。\n3. 不属于排除项：虽然论文提到了“reject harmful policy updates”，但这里的“harmful”指的是导致旧任务性能下降的更新（即灾难性遗忘），而非网络安全或AI对齐等安全问题，因此不触发安全相关的排除规则。同时，论文末尾提到的“VLA validation”仅作为未来的开放验证方向，不改变论文核心机制与智能体演化的相关性。\n\n综上所述，该论文研究了具身智能体在持续演化过程中的更新评估与准入机制，直接有助于理解和改进智能体的自我演化能力，符合你的研究范围。", "intro_logic": "### § 1 研究问题与重要性\n论文提出的研究问题是：在 continual embodied agents 的 policy update 过程中，如何设计并审计一个 admission（准入）机制，使其在给定的 interaction budget 下，既能严格控制 error（防止 forgetting 和 harmful updates），又能保留有用的 learning opportunities。这个问题之所以重要，是因为 continual learning 要求 agent 在适应新任务的同时不破坏旧技能，而 independent evaluation（如 confidence gates）虽能拒绝有害更新，但若过于保守则会冻结学习——一个什么都不接受的 gate 报告零违规，却导致 agent 毫无进展。现有的 evaluation 框架往往只关注 error control，忽略了 opportunity cost，使得“更少的违规”被误等同于“更好的 learner”。解决这一问题不仅能揭示 range-based confidence gates 在有限 budget 下因样本需求过高而失效的具体失败模式，还能通过提出 paired-binomial construction 和 missed-opportunity metric，为 continual learning 提供兼顾安全性与实用性的 admission-audit protocol，从而推动 reliable continual learning 在实际 embodied agents 中的应用。\n\n### § 2 前人工作与不足\n这个问题之前未被完整解决。最相关的 prior work 包括 High Confidence Policy Improvement (HCPI) [Thomas et al., 2015]，它支持基于 confidence 的 incremental policy selection，以及 CLEAR 等 replay methods [Rolnick et al., 2019]，它们通过 experience replay 缓解 forgetting。然而，HCPI 等方法依赖 range-based confidence intervals（如 Hoeffding 或 empirical Bernstein bounds），在验证 old-task retention 时存在方法本身的限制：即使新策略与旧策略的 outcome disagreements 为零，也需要数千个 paired samples 才能将 interval radius 缩小到 threshold 以下，这在合理的 interaction budget 内会导致 learning freeze。前人研究之所以存在不足，关键在于它们没有利用 paired disagreements 的结构信息——当 disagreements 罕见时，paired-binomial construction 只需百余个样本即可通过 retention check，而 range-based 方法则因考虑 outcome 的整个范围而无法做到这一点。此外，前人工作存在评测缺口：它们只衡量 error control（如 contract violations），却没有定义或衡量 opportunity cost。论文指出，一个拒绝所有更新的 gate 会有 zero violations 但 100% missed opportunities，而前人并未将 update admission 视为一个需要在 error 与 opportunity 之间权衡的 contract，也没有提出 certified historical-reference promotion 来动态维护旧技能的证明。因此，前人未能清楚定义 admission process 的 feasibility analysis 和 learning consequences，导致 continual learning 的 evaluation 既有方法限制又有评测盲区。", "core_insight": "### § 3 重建作者的思考路径\n\n在 continual embodied agents 的研究中，为了防止 policy update 导致 catastrophic forgetting 或被不准确的 world model 剥削，研究人员通常会引入 independent checks（如 confidence gates）来筛选更新。然而，作者观察到这些 gate 面临一个根本的困境：如果 gate 过于严格，虽然能拒绝有害更新，但也会冻结学习，导致 agent 毫无进展。现有的评估框架往往只关注 error control（拒绝了多少有害更新），而忽略了 learning opportunity 的损失。作者进一步发现，常用的 range-based confidence gate（如 Hoeffding interval）在验证旧任务行为是否保持不变时存在严重的样本效率问题。即使新旧策略在旧任务上的表现完全一致（即 outcome disagreement 为零），Hoeffding interval 的半径仍然很大，导致在合理的 interaction budget 内无法通过验证。这一失败模式促使作者寻找更高效的统计构造。他们注意到，当 outcome disagreements 罕见时，可以将 paired differences 分解为正负两个 binomial counts，并分别构造 Clopper-Pearson 置信区间。这种 paired-binomial 构造在零分歧情况下所需的样本量大幅降低，从而解开了 range-based gate 的样本瓶颈。然而，即使有了更高效的 gate，作者在闭环实验中发现，简单的 unconditional replay 仍然能取得更高的最终成功率，这表明仅降低 error rate 是不够的。因此，作者提出必须引入一个 round-level 的 missed-opportunity metric，以正确衡量有多少真正有用的更新机会被错误拒绝，而不是将正常的候选筛选误计为错误。此外，在使用 world model 作为 proxy 时，作者观察到即使使用 fresh proxy draws，selection-score optimism 依然存在，这促使他们设计独立的 stress test 来区分 model bias 和 feedback-selection error。\n\n### § 4 核心 Intuition\n\n先前基于范围的 confidence gates 在验证旧任务行为不变时，即使新旧策略表现完全一致，也因区间半径过大而需要海量样本，从而冻结了 continual learning。这篇论文的核心 intuition 是：当新旧策略的 outcome disagreements 罕见时，通过将配对差异分解为正负两个 binomial counts 并分别构造置信区间，可以在极小样本下证明行为不变，从而释放学习机会；同时，必须引入机会级别的审计指标来衡量有效更新被错误拒绝的比例，以避免“零违规”掩盖“零进展”的假象。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+-------------------+      +---------------------+      +-------------------+\n| Demo / Replay     |-----\u003E| Candidate Gen       |-----\u003E| Dev Proxy Screen  |\n| (Historical Data) |      | (Ridge / Local Fit) |      | (Select 1 Cand.)  |\n+-------------------+      +---------------------+      +-------------------+\n                                                                |\n                                                                v\n                                                        +-------------------+\n                                                        | Commit Candidate  |\n                                                        | (Freeze Params)   |\n                                                        +-------------------+\n                                                                |\n                                                                v\n                                                        +-------------------+\n                                                        | Fresh Paired      |\n                                                        | Checks (Binomial) |\n                                                        +-------------------+\n                                                                |\n                                              +-----------------+-----------------+\n                                              |                 |                 |\n                                              v                 v                 v\n                                        +----------+      +----------+      +----------+\n                                        | Accept   |      | Reject   |      | Defer    |\n                                        +----------+      +----------+      +----------+\n                                              |\n                                              v\n                                        +----------+\n                                        | Promote  |\n                                        | Refs     |\n                                        +----------+\n                                              |\n                                              v\n                                        +----------+\n                                        | Audit    |\n                                        | (Missed) |\n                                        +----------+\n```\n\n本论文的 Pipeline 围绕 continual learning 中的 update admission（更新准入）展开，具体步骤如下：\n\n1. **Candidate Gen**：输入为 demonstrations 和 replay 数据，通过 ridge solve 或 task-local fit 生成 4 个候选策略更新。此阶段属于训练阶段的准备，利用历史数据生成可能的更新方向（§ 2, § B）。\n2. **Dev Proxy Screen**：输入为候选策略池，使用 linear dynamics proxy 在 development resets 上评估，选择一个候选策略。此阶段属于推理与筛选，proxy scores 仅用于排序，不作为独立环境结果（§ B）。\n3. **Commit Candidate**：冻结候选策略、参考策略、任务分布和样本数。此阶段确保后续检查在固定参数下进行，防止 optional stopping（§ 2, Algorithm 1, Step 2）。\n4. **Fresh Paired Checks**：输入为冻结的候选策略和参考策略，在独立的 audit bank 中抽取 fresh pairs，计算 paired-binomial intervals (Clopper-Pearson bounds)，得出 $L_j$ 和 $U_j$。此阶段属于评测，使用独立环境数据验证候选策略是否满足 retention 和 gain 合同（§ 2, Algorithm 1, Step 3-4）。\n5. **Admission Decision**：根据 $L_j \\ge q_j$ 判定 Accept，$U_j \u003C q_j$ 判定 Reject，否则 Defer。此阶段属于控制流，决定是否采纳更新（§ 2, Eq. 2）。\n6. **Promote Refs**：如果 Accept，采用新策略，并当旧参考的 $L_j \\ge 0$ 时提升历史参考。此阶段属于状态更新，确保参考序列在固定分布上非递减（§ 2, Algorithm 1, Step 5）。\n7. **Audit (Missed)**：在所有更新轮次结束后，对 finite population 进行 exhaustive evaluation，计算 missed opportunity metric。此阶段属于离线审计，评估准入规则的学习机会成本，其结果不反馈到学习循环中（§ 3）。\n\n### § 6 核心数学推导\n\n本文的核心数学推导集中在 paired-binomial interval 的构建及其与 range-based Hoeffding interval 的对比。\n\n**背景与问题**：在 update admission 中，需要验证候选策略 $\\pi'$ 相对于参考策略 $b_j$ 的性能差 $g_j = E_{P_j}[S(\\pi') - S(b_j)]$ 是否满足阈值 $q_j$。由于 $S$ 是 binary success，配对差异 $X \\in \\{-1, 0, 1\\}$。传统的 Hoeffding interval 对 $X$ 的范围 $[-1, 1]$ 进行约束，给出半径 $r_H = \\sqrt{2 \\log(2m/\\alpha_t)/n}$。即使所有 old-task pairs 都没有 disagreement（$X=0$），要证明 retention（即 $r_H \\le \\epsilon$），仍需极大样本量（如 4,229 pairs）。这导致 learning freeze。\n\n**Paired-binomial 的 intuition**：关键观察是，当 disagreements 罕见时，$X=0$ 占主导，此时 $X$ 的方差远小于 Hoeffding 假设的最坏情况。paired-binomial 方法将 $g = p_+ - p_-$ 拆分为两个 binomial count $k_+$ 和 $k_-$，分别对 $p_+$ 和 $p_-$ 求 Clopper-Pearson bounds $[\\ell_+, u_+]$ 和 $[\\ell_-, u_-]$，然后组合得到 $L = \\ell_+ - u_-$ 和 $U = u_+ - \\ell_-$。当 $k_+ = k_- = 0$ 时，$L = -(1 - \\beta^{1/n})$，要使 $L \\ge -\\epsilon$，只需 $n \\ge \\log \\beta / \\log(1-\\epsilon)$（如 117 pairs）。这利用了低 disagreement 的数据特性，大幅降低了样本需求。\n\n**Reference promotion 的保证**：在 simultaneous coverage event 下，若旧参考的 $L_j \\ge 0$，则其期望性能不低于前一个参考。通过归纳法，参考序列在固定分布 $P_j$ 上是非递减的。这保证了 certified improvements 被保留，而非 unknown historical optimum。\n\n### § 7 实验设计与结论\n\n**问题1：Range-based confidence gate 是否会阻止有用的 continual learning？**\n论文设计了 sequential pushing diagnostic，在相同的 candidate streams 下比较 Fresh Hoeffding、Fresh empirical Bernstein 和 Fresh paired gate 在不同 episode caps 下的 admission rate。实验结果表明，Hoeffding 和 empirical Bernstein 在 $B=2,000$ 时 admits 0% updates，而 paired gate admits 31.6%。这证实了 range-based gate 无法在合理 budget 内 certify unchanged old-task behavior，导致 learning freeze。\n\n**问题2：Admission gate 的 opportunity cost 是什么？**\n论文设计了 closed-loop diagnostic，引入 missed opportunity metric（即存在满足合同候选但未采纳的轮次比例），并比较各规则的 final success 和 forgetting。实验结果表明，paired checks 在 $B=2,000$ 时 miss 60.4% 的可用机会，而 unconditional replay 获得更高的 final success（100% vs 59.6%）。这揭示了 fewer observed violations 并不意味着更好的 continual learner，严格的 admission control 会带来显著的学习机会成本。\n\n**问题3：Fresh proxy feedback 是否能消除 model bias？**\n论文设计了 learned-dynamics stress test，在非线性动力学环境下比较 reused 和 fresh proxy draws 在 adaptive search 下的 model gap（held-out proxy score 与 true score 的差值）。实验结果表明，即使使用 fresh proxy draws，adaptive search 在 256 queries 时的 model gap 仍高达 41.9 pp，与 reused draws 的 40.8 pp 相近。这证明了 fresh proxy feedback 无法消除 selection-score optimism，因为 selection 本身仍偏向 favorable estimates，从而区分了 fresh proxy feedback 与 independent evidence about the true environment。", "additional_insights": "### § 8 Take-aways\n本文指出，continual learning 中的 update admission（更新准入）不仅需要控制错误，还必须在既定的 interaction budget（交互预算）内评估被保留的学习机会。传统的 range-based confidence gate（如 Hoeffding interval）在 outcome disagreements（结果分歧）较少时，需要极大的样本量来证明旧任务行为未改变，从而导致在合理预算内学习停滞。为解决此问题，作者提出了基于 paired-binomial construction（配对二项式构造）的准入规则，在零分歧情况下将样本需求从数千对降至百余对。此外，论文设计了 certified historical-reference promotion（认证历史参考提升）机制和 round-level missed-opportunity metric（轮级错失机会指标），以正确追踪已验证的技能并避免将正常的候选筛选误判为错误。在合成的 one-step pushing diagnostic 中，fresh paired checks 在 2,000 episodes 的预算下通过了 31.6% 的更新流，而 range-based gate 的通过率为零。然而，闭环实验表明，由于准入机制仍会错失 60.4% 的可用机会，unconditional replay（无条件重放）在最终成功率上依然优于带有准入门控的方法。\n\n### § 9 最脆弱的假设\n本文核心贡献最脆弱的假设是：**在旧任务检查中，candidate policy 与 reference policy 的 outcome disagreements 是罕见的（即接近零分歧状态）**。paired-binomial gate 之所以能在极低预算下通过旧任务保留检查，正是因为当正负结果分歧计数均为零时，下界 $L$ 的计算退化为仅需 $n \\ge \\log \\beta / \\log(1 - \\epsilon)$ 的样本量。如果这个假设在实际的 continual embodied agents 中不成立——例如在 VLA（Vision-Language-Action）模型或物理机器人上，由于感知噪声、复杂接触动力学或多步规划的误差累积，即使是最保守的 local update 也会频繁导致旧任务成功率的微小波动（即 $p_+$ 和 $p_-$ 不为零）——paired-binomial interval 的宽度将迅速扩大，其样本需求可能会逼近甚至超过传统的 Hoeffding interval。一旦该假设失效，paired gate 的 admission rate 将降至零，重新陷入“验证导致学习停滞”的困境。论文仅通过在合成的单步标量环境中刻意构造一个“task-local fit”来提供低分歧的控制组证据，并明确承认“shared VLA updates may have far more outcome disagreement”，但缺乏在真实复杂任务上的验证。\n\n### § 10 最小复现实验\n在一周时间内，可以通过纯数值模拟复现论文中**“paired-binomial gate 在低分歧下比 Hoeffding gate 样本效率更高”**的核心 claim。不需要构建复杂的机器人环境，只需用 Python 实现两种 gate 的统计区间计算逻辑。设定参数 $\\delta = \\epsilon = 0.05$，比较数 $m = 3$，尝试轮次 $t = 1$。模拟一个零分歧的旧任务场景：即抽取 $n$ 个配对样本，所有成功差异 $X \\in \\{-1, 0, 1\\}$ 均为 0。在预算 $B = 2,000$（即 $n = \\lfloor 2000 / (2 \\times 3) \\rfloor = 333$ 对）的条件下，计算 Hoeffding interval 和 paired-binomial interval 的下界 $L$。如果 paired-binomial 的 $L \\ge -\\epsilon$（即通过保留检查，支持 claim），而 Hoeffding 的 $L \u003C -\\epsilon$（即拒绝更新，支持 claim），则验证了核心数学推论。进一步，可以引入非零分歧率（如 5% 的样本为 1 或 -1）重复实验，若此时 paired-binomial 也无法在 $n=333$ 下满足 $L \\ge -\\epsilon$，则进一步证实了该方法的适用性严格依赖于低分歧假设。", "research_value": "### § 11 最强反例设计\n要对该论文的核心 claim 构成最致命的打击，我会设计一个**具有 stochastic dynamics（随机动力学）和 multi-step horizon（多步时间跨度）的连续控制任务**（例如在摩擦力未知的桌面上推不规则物体或插 peg-in-hole 任务），并在此环境中对比 paired-binomial gate 与 unconditional replay 的闭环表现。这个反例的攻击点直接瞄准论文最脆弱的假设：即 candidate policy 与 reference policy 的 outcome disagreements 是罕见的。在多步接触任务中，由于感知噪声和复杂动力学的误差累积，即使是最微小的 local update，也会导致轨迹在 step 5 之后发生指数级的 deviation 分叉。这意味着 candidate 和 reference 在旧任务上的成功与失败将频繁出现非对称结果（即 $p_+ \u003E 0$ 且 $p_- \u003E 0$），outcome disagreements 不再罕见。在这种 predictable failure condition 下，paired-binomial interval 的宽度将急剧膨胀，其所需的样本量会迅速逼近甚至超过传统的 Hoeffding interval。我预测实验将显示：在合理的 interaction budget（如 2,000 episodes）内，paired-binomial gate 的 admission rate 将骤降至接近 0%，彻底陷入 learning freeze；而 unconditional replay 尽管存在 catastrophic forgetting 的风险，却能通过吸收 noisy updates 实现任务成功率的实质性上升。这一结果将提供一种具体的替代解释：论文在合成 one-step pushing diagnostic 中观察到的 31.6% 准入率，并非因为 paired-binomial construction 在统计上具有普遍优势，而纯粹是单步确定性任务人为制造的“零分歧”假象。一旦任务复杂度提升导致 outcome 产生自然波动，该方法的样本效率优势将荡然无存，证明其不过是一个在退化场景下过度拟合的数学 trick，而非可靠的 continual learning 准入机制。\n\n### § 12 Follow-up Research Idea\n基于该方法在非零分歧下崩溃且错失 60.4% 机会的局限，我提出一个全新的研究框架：**Opportunity-Weighted Conformal Policy Blending（机会加权保形策略混合）**，将传统的“硬准入”重构为“软融合”问题。驱动这个想法的需求是：continual learning 中的 update admission 不应是一个 binary decision，因为拒绝一个带有微小旧任务波动的更新，其 opportunity cost 往往远高于它带来的 error control 收益。我们可以借鉴金融工程和分布鲁棒优化（Distributionally Robust Optimization, DRO）中的 Conformal Prediction（保形预测）技术，不再计算粗粒度的 outcome disagreement，而是构建 candidate policy 与 reference policy 在 trajectory level 上的 state-action distribution shift 的 Wasserstein distance 上界。这个连续的 distributional distance 将被用作一个 confidence score，通过一个单调映射函数转化为 Polyak averaging 中的 blending coefficient $\\alpha$。第一个实验将在一个具有 stochastic transition 的多步 manipulation 环境中实施：当 candidate update 在旧任务上的 trajectory distribution 偏离 reference 较小（但 outcome 有波动）时，系统以较高的 $\\alpha$ 融合该更新；若偏离极大，则降低 $\\alpha$ 但不完全拒绝。我们将测量这种 soft blending 机制是否能在保证 bounded forgetting（遗忘率低于阈值）的前提下，将 missed opportunity rate 从 60.4% 压降至 10% 以下。这与现有的 replay methods（如 CLEAR）或本文的 hard gate 有着本质区别：前者在数据层面无差别混合，后者在 policy 层面非黑即白，而本框架利用 distribution-free 的统计上界在 policy parameter space 中实现了具有理论保证的 continuous interpolation，彻底绕开了 paired-binomial 对“零分歧”的病态依赖。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Qinzhen Ma\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ruihai Wu\", \"affiliations\": [2], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Rice University\"},\n    {\"id\": 2, \"name\": \"UC Berkeley\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "独立评估可以拒绝有害的 policy updates，但也会阻碍有用的 continual learning。我们认为，update admission 必须在给定的 interaction budget 下，通过 error control 和 retained learning opportunities 两方面进行评估。我们发现了一个具体的缺陷：range-based confidence gate 无法在其他方面充足的 budget 内证明 old-task behavior 保持不变。当 outcome disagreements 罕见时，标准的 paired-binomial construction 可以减轻这一负担。我们还具体说明了 certified historical-reference promotion 和一个 round-level missed-opportunity metric。在一个包含 32 个 seeds 的构建的 one-step pushing diagnostic 中，fresh paired checks 在每个 stage 2,000 个 episodes 的情况下接纳了 31.6% 的常见 update stream，而 range-based gate 为零；然而，unconditional replay 在 closed-loop runs 中学习效果更好。一项单独的 learned-dynamics stress test 区分了 model bias 和 feedback-selection error。本研究的贡献在于提出了一个 admission-audit protocol，并提供了分析性与合成性证据；physical-robot 和 VLA validation 仍是开放问题。"}, {"title": "ReactHuman: A Physics-Grounded Benchmark for Human-Like Reactive Decision-Making in Embodied Multimodal LLMs", "arxiv_id": "2609.10895", "authors": "Yizhan Li, Jianxin You, Mengyang Xiong, Yinhuan Chen, Zicheng Zhao, Dekun Wu, Dongqing Zhang, Bang Liu", "summary": "Reacting to sudden physical hazards (catching a slipping plate, dodging a falling knife) is both a meaningful test of embodied intelligence and a hard requirement for deploying multimodal large language models (MLLMs) as the decision coreof household robots. Existing evaluations, however, probe intuitive physics passively through question answering over videos, or target deliberate, long-horizon tasks such as navigation and rearrangement; none measure whether a model can turn physical understanding into immediate, safety-critical action. We introduce ReactHuman, the first physics-grounded benchmark for human-like reactive decision-making, in which the evaluated MLLM acts as the brain of a simulated humanoid facing sudden household hazards; it spans 17 event families and over 1,000 bit-for-bit reproducible scenes with exact, annotation-free ground truth derived from 240 Hz rigid-body simulation, including adversarial objects whose appearance contradicts their physics (a foam anvil, a steel apple). We further design a five-metric suite that scores each reaction along three axes: reasonable, safe, and physically grounded. We physically execute every committed plan so that decisions have observable consequences. With this harness we evaluate seven representative MLLMs. Results show that reactive safety is far from solved: models mishandle roughly one hazard in three, act from fixed dispositions rather than the observed scene, trust appearance over motion, and miss interception points at meter scale even when the chosen action is correct; none of these failures shrink with model scale. ReactHuman thus offers both a fine-grained diagnosis and a scalable training signal toward physically grounded, safety-aware embodied agents. The benchmark can be found here: https://huggingface.co/datasets/Alan123/reacthuman-benchmark-scaled", "category": "cs.AI", "cluster": "Embodied \u0026 Continual Learning Agents", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了一个名为 ReactHuman 的物理基础基准测试，用于评估具身多模态大语言模型（MLLMs）作为智能体大脑在面对突发家庭危险时的类人反应式决策能力。论文不仅构建了评估环境，还对七个代表性的 MLLM 进行了行为分析和失败机制诊断（如模型倾向于基于固定倾向而非观察场景行动、信任外观而非运动等），并指出了这些发现对未来构建物理基础和安全感知具身智能体的训练信号价值。\n\n根据您的筛选标准，这篇论文符合“研究对象明确是 LLM Agents / Embodied Agents，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留”的规则。此外，重要校准中也明确指出“不要只因为论文是 benchmark、evaluation、behavior analysis... 就排除”。\n\n针对排除标准的进一步分析：\n1. 虽然论文摘要中多次出现“safety-critical”和“safety-aware”，但这里的“安全”指的是物理环境中的安全（如接住滑落的盘子、躲避掉落的刀），属于具身智能体在物理世界中的决策场景，而非“Security for AI”或“AI Alignment”等 AI 安全/对齐研究。因此不应被机械排除。\n2. 论文研究对象是 MLLMs（多模态大模型），但多模态在此处是作为具身智能体感知物理环境的必要工具，研究的核心本质仍然是智能体的决策与行动能力，符合“除非它们被用作智能体感知环境的工具，而不是研究的核心”的保留条件。\n\n综上所述，该论文聚焦于具身 LLM 智能体的评估与行为诊断，直接服务于理解和改进智能体在复杂物理环境中的决策能力，完全符合您的研究范围。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的核心问题是：当多模态大语言模型作为具身智能体（如家庭机器人）的认知核心时，能否在面对突发物理危险（如接住滑落的盘子、躲避掉落的刀）时，做出像人类一样安全、合理且物理上可行的即时反应决策。这一问题至关重要，因为随着MLLMs被部署到现实世界的机器人中，即时反应性安全不仅是具身智能的试金石，更是实际部署的硬性要求。传统的视觉问答（VQA）或长周期任务评测无法暴露模型在将物理理解转化为安全关键动作时的致命缺陷——例如，模型可能会错误地选择去接一把掉落的厨师刀，或者虽然做出了正确的躲避决策，但在空间预测上出现半米的偏差。为了填补这一空白，作者提出了ReactHuman，一个物理驱动的benchmark，它通过“freeze-and-predict”协议让MLLM在仿真人形机器人中实际执行反应计划，从而将评估单位从被动的选择题转变为具有可观测物理后果的具身交互，为诊断和改进具身MLLMs的感知-推理-动作链条提供了精细且可扩展的训练信号。\n\n### § 2 前人工作与不足\n该问题此前并未得到有效解决，主要由于现有评测体系在动作执行与安全后果评估上存在根本缺口。最相关的物理推理benchmark（如Physion, CLEVRER, PhysBench）仅通过视频问答被动探测模型的intuitive physics，它们假设“知道物理”等同于“能应对物理”，却无法测量模型能否将这种理解转化为即时的、安全关键的动作，因此无法揭示模型在动作选择、安全性判断及运动学预测上的失败。另一方面，具身AI benchmark（如Habitat, AI2-THOR, BEHAVIOR-1K）专注于导航和重排等深思熟虑的长周期任务，HumanoidBench则聚焦于全身控制，它们均未将即时的反应性安全作为评估目标。此外，在方法层面，将MLLM作为具身决策模块的先前工作要么依赖离散技能的zero-shot规划，要么需要昂贵的端到端动作微调成为VLA策略，缺乏一个能直接评估通用MLLM zero-shot vision-to-action能力的框架。在场景生成方面，尽管Kubric和基于LLM的生成系统（如RoboGen）提供了可扩展的工具，但完全由LLM驱动的生成难以保证物理参数的精确性和场景的bit-for-bit可复现性。ReactHuman通过brain-spine-body解耦架构，将冻结的MLLM与预训练的全身控制器结合，并采用LLM负责语义规划、确定性随机化器控制所有物理参数的混合生成管线，成功克服了上述评测缺口、方法限制与工程成本问题，实现了无需人工标注的精确ground truth和可复现的具身安全评估。", "core_insight": "### § 3 重建作者的思考路径\n\n随着 MLLMs 逐渐成为家庭机器人等具身智能体的认知核心，它们必须具备应对突发物理危险的能力。然而，现有的评估范式存在明显的盲区：物理推理 benchmark（如 Physion, PhysBench）主要通过视频问答（VQA）被动测试模型对物理规律的理解，而具身 AI benchmark（如 Habitat, AI2-THOR）则聚焦于导航或重排等长周期任务。这两者都无法检验模型能否将物理理解转化为即时、安全关键的行动。在 VQA 设定下，模型可能选对了“接住”这个动作标签，但在真实物理世界中，它的手可能离落点差了一米，或者它试图去接一把掉落的锋利菜刀——这些致命的“知行不一”在多选题评估中是完全隐形的。此外，经验观察表明，当前的 MLLMs 在面对危险时往往表现出固定的行为倾向（如总是后退或总是去接），且极易被物体的视觉外观所欺骗（如看起来像铁的泡沫），而不是根据观察到的运动状态进行动态调整。为了真正暴露并定位这些决策层面的缺陷，研究者需要一种既能纯粹评估模型推理质量、又能让决策产生可观测物理后果的评估机制。由此，一种自然的思路是采用“大脑-脊柱-身体”解耦架构：在物理引擎中模拟突发危险，在关键决策点冻结时间让 MLLM 输出结构化动作计划，随后由预训练的 RL 控制器在相同物理引擎中执行该计划。这不仅排除了底层控制策略质量的干扰，还能通过引擎自动生成精确的 ground truth，从而实现对具身 MLLMs 反应式决策的细粒度诊断。\n\n### § 4 核心 Intuition\n\n评估具身 MLLMs 的物理推理能力，不能只看它“说”什么（VQA），必须看它在物理引擎中“做”什么。通过在模拟突发危险时“冻结时间”让模型输出动作计划，再“解冻”由预训练控制器执行该计划，我们既能隔离底层控制能力的干扰，又能暴露模型在“知行合一”上的致命缺陷（如选对动作但抓空、或被外观欺骗去接危险物品）。这种将高层决策与物理后果直接绑定的评估范式，才是逼迫模型展现出真实安全短板的关键。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[NL Description] -\u003E [LLM Semantic Planner] -\u003E [Seeded Randomizer]\n                             |                       |\n                             +-----------+-----------+\n                                         v\n                             [SceneSpec] -\u003E [Genesis Simulator (240Hz)]\n                                                 |\n                      +--------------------------+-----------------+\n                      v                                            v\n               [Ground Truth]          [Freeze at t0+0.6s] -\u003E [Multi-view Window]\n                      |                                          |\n                      |                                          v\n                      |                               [Evaluated MLLM (Brain)]\n                      |                                          |\n                      |                                          v\n                      |                            [Reaction Plan (Walking_cmd)]\n                      |                                          |\n                      +-------------------+                      |\n                      v                   v                      |\n               [Metric Suite]     [Resume Sim] \u003C-----------------+\n                                          |\n                                          v\n                             [Pre-trained Controller (Spine)] -\u003E [Humanoid Body]\n                                          |\n                                          v\n                             [Execution Video / Outcome]\n```\n\n- **[NL Description] -\u003E [LLM Semantic Planner]**：输入自然语言描述（如“铸铁锅滑落”），由 frozen LLM 解析并验证输出 event family、object、room type 等语义配置（§3.4 Stage 1）。\n- **[Seeded Randomizer]**：输入整数 seed，确定性采样所有物理与视觉参数（如位置、初速度、摩擦力），确保 bit-for-bit 可复现（§3.4 Stage 2）。\n- **[SceneSpec]**：融合语义配置与物理参数，生成完整的场景规范。\n- **[Genesis Simulator (240Hz)]**：输入 SceneSpec，在 Genesis 引擎中进行 240Hz 刚体仿真，渲染三视角同步画面（§3.4 Stage 3）。\n- **[Ground Truth]**：从仿真状态中自动提取精确标签，包括 action label、3D impact point 和 time-to-floor。\n- **[Freeze at t0+0.6s]**：仿真运行至关键决策时刻冻结，截取约 0.6s 的多视角观察窗口。\n- **[Evaluated MLLM (Brain)]**：输入多视角窗口，模型输出结构化反应计划，包含 intent、confidence、walking_cmd 和 hand keyframes（§3.1）。\n- **[Reaction Plan]**：包含意图和运动指令。\n- **[Metric Suite (5 metrics)]**：输入 Reaction Plan 与 Ground Truth，计算 SAA、Safety Validity、Physical Endpoint Distance、AIA 和 HDE 五个指标（§4）。\n- **[Resume Sim] -\u003E [Pre-trained Controller (Spine)]**：仿真恢复，预训练的 RL 控制器将高层指令转换为平衡控制和关节力矩。\n- **[Humanoid Body (Unitree G1)]**：Unitree G1 执行物理动作，产生可观察的执行结果（如接住或被砸中），用于结果级验证（§3.1）。\n\n### § 6 核心数学推导\n\n本文为 benchmark 论文，核心指标基于简单的欧几里得距离计算（如 $d_{end} = \\| \\mathbf{h}_{final} - \\mathbf{p}_{impact} \\|_2$），无复杂理论推导，故跳过本节。\n\n### § 7 实验设计与结论\n\n提出问题：当前的 MLLM 能否像人类一样，对突发物理危险做出安全、合理且物理落地的即时反应决策？\n\n设计实验验证：构建包含 17 种事件类型、306 个场景的 ReactHuman benchmark，采用 freeze-and-predict 协议评测 7 个代表性 MLLM。设计 5 个指标从合理性、安全性、物理落地性三个维度评估。引入外观与物理属性矛盾的对抗性物体，并改变物体速度，分别测试模型对材质和速度的感知能力。\n\n问题的答案：反应安全性远未解决，模型在约三分之一的危险中犯错，主要表现为面临危险时僵住不动。模型行为受固定倾向驱动而非场景驱动，6/7 模型偏好后退。模型规模不带来安全性提升，小模型在准确性和安全性上可超越大模型。模型将速度视为二元属性，忽略慢速危险。模型完全依赖视觉外观判断物理属性，从不通过观察运动来修正判断。", "additional_insights": "### § 8 Take-aways\nReactHuman 推出了首个基于物理的 reactive decision-making benchmark，通过 freeze-and-predict 协议将 MLLM 的评估从被动视频问答转变为具有安全后果的具身动作执行。该 benchmark 包含 17 个突发事件家族和超过 1000 个可复现场景，并引入了外观与物理属性矛盾的 adversarial objects，以测试模型是否能通过观察运动学特征来修正视觉先验。其设计的 five-metric suite 从 reasonable、safe 和 physically grounded 三个独立维度评估决策，揭示了模型即使选对动作也可能在物理执行时偏离目标数米。对七个代表性 MLLMs 的实证评估表明，reactive safety 远未解决：模型在约三分之一的危险场景中违反安全规则，且倾向于基于固定 disposition 而非具体场景做决策。更关键的是，模型将速度感知为二元状态，且从未质疑过 adversarial objects 的材质，同时这些失败并未随 model scale 的增加而改善。\n\n### § 9 最脆弱的假设\n该论文最核心且失败代价最大的假设是：通过 deterministic rule 将 MLLM 输出的连续 motor plan（walking command 与 hand keyframes）映射为离散动作 primitives（Catch, Dodge, No_Action），能够准确反映模型的真实决策意图，且 MLLM 输出 3D 空间坐标的能力足以支撑这种映射。在实际中，MLLMs 生成精确 3D 坐标的能力极弱，如果一个模型在语义上正确决定接住物体，但由于空间坐标输出偏差导致手部 keyframes 落在原点附近，deterministic rule 会将其分类为 No_Action，进而触发安全违规（R3）。论文虽然发现了“correct but out of reach”现象（中位数偏差 0.48m），但将其归因于模型“不向前迈步”的决策错误，而非 MLLM 固有的空间坐标输出缺陷。论文仅使用基于 keyword matching 的 Action-Intent Alignment (AIA) 指标来佐证模型“理解了场景但写错了计划”，这不足以排除映射规则导致的系统性误判。如果这个假设不成立，论文中高达 392 次的“freezing in place”安全失败可能很大程度上是 3D 坐标生成能力的局限，而非 reactive safety 认知的缺失，这将直接瓦解“模型因误判危险而失败”的核心结论。\n\n
