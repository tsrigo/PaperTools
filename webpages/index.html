赛代表了其最具挑战性的场景。我们提出了一种端到端特化流程，结合了大规模问题筛选、合成推理轨迹、supervised fine-tuning (SFT) 和 reinforcement learning (RL)。使用 22,000 个筛选后的问题，我们使用 SFT 和 RL 训练了 Nemotron-3-Nano-CC (30B-A3B)，并仅使用 SFT 训练了 Nemotron-3-Ultra-CC (550B-A55B)。我们进一步引入了 GenCorrect，这是一种反馈驱动的 test-time compute 策略，能够迭代地生成、评估和细化多样化的解决方案。在 IOI 2025 上，Nano-CC 在 post-training 后从 130 分提升至 291 分，并在使用 GenCorrect 后提升至 468 分，超过了 438.3 的金牌阈值，而 Ultra-CC 达到了 502 分。在这些结果的指导下，我们开发了一个针对竞赛的 Ultra-CC 系统，并在 IOI 2026 期间对其进行了前瞻性评估。在与人类选手相同的时间、互联网访问和提交限制下，它在 600 分中获得了 535.4 分，超过了 361.12 的金牌阈值和 498.27 的人类最高分。据我们所知，这是第一个在 IOI 问题集上得分超过最高分人类选手的 AI 系统。"}, {"title": "APEx: Distillation of Agent Procedural Experience for Adaptive Deep Research Question Answering", "arxiv_id": "2609.02253", "authors": "Jie Ding, Rui Sun, Xinyuan Zhang, Zeyu Zhang, Xin Liu", "summary": "Deep research agents augment large language models with external tools to answer complex, long-horizon questions through multi-turn reasoning. Learning from prior experience is crucial for continual improvement, yet existing methods either retrieve verbose task-specific traces that burden decision-making, or distill procedural skills that remain decoupled from downstream policy adaptation. We propose APEx, a hierarchical experience utilization framework that organizes interaction history into instance-level trajectory memories and category-level procedural skills, and couples them through a closed-loop architecture of Executor, Distiller, and Planner. The three modules are optimized via a three-stage alternating GRPO training paradigm, enabling reward-guided skill distillation rather than fixed-prompt generation. At test time, distilled skills serve as procedural priors for online Planner adaptation through skill-guided test-time reinforcement learning, allowing ground-truth-free self-improvement with skill-alignment regularization to prevent policy drift. Experiments on 7 benchmarks demonstrate that APEx achieves state-of-the-art performance, surpassing GPT-5.4 by 14.7 points and the strongest memory-augmented baseline by 3.0 points.", "category": "cs.CL", "cluster": "Tool Use, Skills \u0026 Code Generation", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-37 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文高度符合您的研究范围。其核心贡献是提出了一个名为 APEx 的层次化经验利用框架，专门用于改进深度研究智能体在复杂、长周期任务中的表现。论文明确涉及了多个核心关注点：首先，它属于单智能体范畴，研究了智能体的规划、记忆和工具使用，通过将交互历史组织为实例级轨迹记忆和类别级程序技能来增强智能体能力；其次，它深入探讨了智能体的自我演化与自我完善机制，包括通过三阶段交替 GRPO 训练范式进行奖励引导的技能蒸馏，以及在测试时利用技能引导的强化学习进行在线规划器自适应，实现无真实标签的自我改进。这些机制完全契合您关注的“Agent training/distillation/RL”、“Test-time scaling”、“Memory”和“Self-Evolving”等前沿方向，因此应当保留。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决的核心问题是：deep research agents (DRAs) 如何通过长期交互经验实现持续改进。DRAs 通过为 LLMs 配备外部工具来处理复杂、长周期、多轮推理的研究型问答任务，涉及 multi-step tool orchestration、iterative information retrieval 和 multi-source synthesis。在没有有效经验利用机制的情况下，DRAs 会反复犯同样的错误而无法从成功中积累知识。这一问题的困难之处在于：交互经验既包含可迁移的策略性知识，也充斥着任务特定的冗余细节，如何将前者抽象出来并使其真正服务于下游的 planning 与 execution，而非仅仅作为被动检索的外部文本，是一个尚未被妥善解决的系统性挑战。解决该问题的价值在于：使小规模开源模型能够通过结构化的经验复用机制弥补参数规模劣势——实验表明 APEX 使 7B 模型超越了 GPT-5.4 达 14.7 分，证明了经验驱动的闭环改进可以显著降低对模型规模的依赖。\n\n### § 2 前人工作与不足\n\n该问题此前被部分触及但未被系统解决，三类 memory 机制各有结构性局限。**Episodic memory methods**（如 Zhong et al., 2024; Zhao et al., 2024 的 ExpeL）存储并检索完整的 task trajectories，但检索到的经验冗长且任务特定，包含大量噪声，迫使 agent 在决策时自行推断可迁移策略——这实际上将策略抽象的负担推给了推理时的 context window，而非在离线阶段完成知识压缩。**Reflective memory methods**（如 Shinn et al., 2023 的 Reflexion; Tan et al., 2025）通过 fixed prompts 将反馈压缩为文本摘要，但这些摘要的生成过程未接受任何针对下游 planning 效用的优化——摘要质量依赖于 prompt 设计而非 reward signal，导致其内容可能与实际决策需求错位。**Procedural memory methods**（如 Zhou et al., 2026; Xia et al., 2026 的 SkillRL）进一步将经验表示为可复用的 skills 或 instructions，但这些 skills 被当作静态的外部知识工件注入 prompt，而非作为能够直接驱动 agent policy 在推理时进行参数级适应的 adaptive priors——其根本局限在于 skill 生成与 policy optimization 之间缺乏梯度连通：skill 质量无法通过下游执行反馈来改进，policy 也无法通过 skill 知识来进行 test-time adaptation。此外，最近的 MIA (Qiao et al., 2026) 虽然引入了 Manager-Planner-Executor 架构与 instance-level memory retrieval，但仍停留在 flat memory 层面，未将经验抽象为 category-level 的结构化 procedural guidance。这些不足的共同根源是将经验利用视为单向的 memory reuse 流程，而非一个 skill 蒸馏与 policy adaptation 相互强化的 closed loop——具体而言，skill 生成未被纳入 reward-guided 的 RL 训练框架，且推理时缺乏将 skill 作为 regularization prior 来约束无 ground-truth 的 online policy 更新的机制，导致经验抽象与策略适应之间始终存在 decoupling。", "core_insight": "### § 3 重建作者的思考路径\n\n在 APEX 之前，Deep Research Agents 的经验利用面临一个根本矛盾：Episodic Memory 保留了完整轨迹，但过于冗长且任务特定，迫使 agent 在决策时即时推断可迁移策略；Reflective Memory 虽然压缩了反馈，但其生成依赖固定 prompt，未针对下游 planning 和 execution 效用进行优化；Procedural Memory 进一步将经验抽象为可重用技能，却将其视为外部知识工件，而非直接驱动 policy adaptation 的自适应先验。作者可能观察到，这三种范式共享同一个结构性缺陷——它们都是单向的 memory reuse 过程：经验被存储、被检索、被注入 prompt，但从未回流到模型参数中形成闭环。与此同时，Test-time Reinforcement Learning (TTRL) 的最新进展表明，agent 可以在推理阶段利用无 ground-truth 的奖励信号进行在线自我改进，但这要求有一个稳定的先验来防止 policy drift。作者由此推断：如果将 procedural skills 作为 TTRL 的正则化先验，同时让 skill distillation 本身由 GRPO 的奖励信号驱动而非固定 prompt 生成，就能构建一个闭环——执行产生轨迹，轨迹蒸馏为技能，技能指导规划，规划触发执行，而 TTRL 在测试时持续优化这一循环。关键的理论线索在于，skill 的生成质量必须与下游效用耦合：Distiller 不应仅仅追求记忆保真度，而应优化技能对 Planner 的实际指导价值，这正是 RL 信号介入的理由。\n\n### § 4 核心 Intuition\n\n现有方法要么把经验当作需要即时消化的冗长记录，要么当作与策略脱节的静态知识，两者都未回答一个核心问题：经验如何回流并改变模型行为。APEX 的 Intuition 是将经验组织为双层结构——instance-level 轨迹保留具体案例，category-level 技能抽象可迁移程序性知识——然后通过 reward-guided distillation 让技能的生成直接受下游 RL 信号驱动，再在测试时将这些技能作为 procedural prior 正则化 Planner 的在线自适应，从而把\"记忆检索\"这一单向操作转变为\"执行—蒸馏—规划—自适应\"的闭环。让先前方法失效的根源在于 skill distillation 与 policy optimization 之间的解耦；让这个方法奏效的核心则是用奖励信号桥接两者，使技能既是蒸馏的产物也是策略更新的锚点。", "methodology": "§ 5 具体方法与完整 Pipeline\n```text\n+----------+   RM(q),RS(q)  +----------+  Plan  +----------+\n| Retriever|---------------\u003E| Planner  |-------\u003E| Executor |\n+----------+                +----------+        +----------+\n     ^                           ^                   |\n     | RS(q)                     | TTRL              | τ, ŷ\n     |                           | Adapt             v\n+----------+                +----------+        +----------+\n|Skill Bank|\u003C---------------| Distiller|\u003C-------|  Output  |\n+----------+   Distill      +----------+  Traj τ +----------+\n```\nAPEX 构建了一个由 Executor、Distiller 和 Planner 组成的 experience-to-action 闭环，具体流程如下：\n1. **Retriever**: 接收原始查询 $q$，将其路由至 category-modality bucket，检索出相关的 instance-level memories $RM(q)$ 和 category-level skill $RS(q)$，并拼接成结构化上下文 $E(q)$。\n2. **Planner**: 基于 $q$ 和 $E(q)$ 生成 research plan。在测试阶段，Planner 通过 Skill-guided TTRL 进行在线自适应，利用无 ground-truth 的奖励信号更新参数，并引入 skill-alignment regularization 以防止 policy drift。\n3. **Executor**: 遵循 Planner 生成的计划，执行多轮工具交互，产出 execution trajectory $\\tau$ 及最终答案 $\\hat{y}$。\n4. **Distiller**: 从轨迹 $\\tau$ 中蒸馏出可复用的 category-level skills。通过三阶段交替 GRPO 训练范式，Distiller 的蒸馏过程由 reward-guided 驱动，而非依赖固定提示词生成。\n5. **Skill Bank**: 存储蒸馏后的技能，供 Retriever 在后续任务中检索，从而将单向的 memory reuse 转化为“执行—蒸馏—规划—自适应”的闭环。\n\n§ 7 实验设计与结论\n- **提出问题**：APEX 的 hierarchical experience utilization 和闭环自适应机制能否有效提升 DRAs 在复杂研究型问答任务上的表现，并克服现有 memory 机制（如冗长检索、与策略脱节）的局限？\n- **实验验证**：研究者在 7 个 diverse benchmarks 上进行了 extensive experiments，将 APEX 与 GPT-5.4 及最强的 memory-augmented baseline 进行对比。此外，通过测试 skill-only variant 来验证 hierarchical experience utilization 的 context efficiency。\n- **结论**：APEX 实现了 SOTA 性能（平均 64.4%），超越 GPT-5.4 达 14.7 个百分点，超越最强 memory-augmented baseline 达 3.0 个百分点。同时，skill-only variant 有效减少了注入的 memory tokens，验证了层次化经验利用相比扁平 memory retrieval 的上下文效率。这表明经验驱动的闭环改进可以显著降低对模型规模的依赖。", "additional_insights": "### § 8 Take-aways\n\nAPEX 将 deep research agent 的交互历史组织为双层结构：instance-level trajectory memories 保留具体执行轨迹，category-level procedural skills 抽象跨任务可复用的程序性知识，二者通过 Executor-Distiller-Planner 闭环架构耦合。与以往用 fixed prompt 生成 memory summary 的方法不同，APEX 通过三阶段交替 GRPO 训练分别优化三个模块，使 skill distillation 成为 reward-guided 的学习过程而非静态文本生成。在 test time，distilled skills 作为 procedural priors 引导 Planner 进行 TTRL，通过 multi-judge LLM-as-Judge 构造 no-ground-truth reward 实现无标注自我改进，同时用 skill-alignment regularization 防止 policy drift。实验表明 APEX 以 7B 开源模型为 backbone 达到 64.4% 平均准确率，超过 GPT-5.4 14.7 个点，超过最强 memory-augmented baseline MIA 3.0 个点。Ablation 显示同时移除 skills 和 memories 导致 10.1 点下降，而 skill-only variant 虽比 full pipeline 低 1.8 点，仍超过 MIA 1.5 点，且将 injected memory tokens 减少 45.6%，验证了层次化经验利用相比 flat memory retrieval 的 context efficiency 优势。Executor 的 GRPO 训练贡献最大（移除后下降 8.4 点），表明可靠的多步工具交互是整个系统的基础。APEX 对未见过的 closed-source executor 模型表现出 plug-and-play 泛化能力，在 HotpotQA 和 LiveVQA 上分别获得 11.0% 和 7.0% 的相对提升。\n\n### § 9 最脆弱的假设\n\nAPEX 最核心且最脆弱的假设是：multi-judge LLM-as-Judge 机制构造的 no-ground-truth reward 能够提供足够准确的信号来指导 Planner 的在线 TTRL 更新和后续的 memory consolidation。整个 closed-loop adaptation——从 online policy update 到 trajectory 选择再到 skill evolution——全部依赖这个 reward 的正确性。如果 judge 系统性地将错误答案判为正确（或反之），TTRL 不仅无法改进 Planner，还会通过 GRPO 将错误信号注入参数，同时将低质量 trajectory 巩固进 memory bank，导致 skill distillation 在后续迭代中基于污染数据生成误导性 skills，形成正反馈的退化循环。\n\n这个假设在实际中很可能不成立。多跳推理和视觉问答任务中，正确答案的判定本身需要复杂推理，而论文使用的 judge 是 Qwen3-32B——一个与被评估的 7B/8B 模型同系列的模型，存在同源偏差风险。更关键的是，三个 evaluator 分别检查 reasoning consistency、evidence grounding 和 answer validity，但 final arbiter 在没有 ground-truth 的情况下需要独立判断答案是否正确，这在 factoid QA 场景中本质上是一个开放世界知识验证问题，LLM judge 自身可能缺乏相关知识或产生 hallucination。论文没有提供 LLM-as-Judge 与 ground-truth 之间一致性的任何定量评估——既没有报告 judge accuracy、precision/recall，也没有在有标注数据上校准 reward 的可靠性。Ablation 中 w/o TTRL 下降 4.2 个点只能说明\"某种在线更新有帮助\"，但无法区分这是来自正确的 reward 信号还是来自 GRPO 的正则化效应。如果 judge 准确率仅为 60-70%（在复杂多跳 QA 中这很常见），TTRL 的 net benefit 可能被错误更新带来的损害大幅抵消，而 skill-alignment regularization 虽能缓解 drift，但其本身依赖 distilled skills 的质量，形成循环依赖。\n\n### § 10 最小复现实验\n\n一周内可验证的最小 claim 是：distilled category-level skills 能否在接近 raw memory retrieval 的 accuracy 下显著减少 context token 消耗——即 context efficiency claim。这个实验不需要训练任何模型，只需推理级别的实现。\n\n具体方案：从 HotpotQA 测试集中取 300 个问题，用 Qwen2.5-7B + ReAct 框架（开源现成）运行收集 trajectories，按 question type 手动分为 3-5 个 category bucket。对每个 bucket，用 Qwen3-8B 以 Distiller prompt（论文 Appendix H 已提供完整 prompt）从成功和失败的 trajectories 中 synthesize 一个 skill document。然后在新的 100 个 HotpotQA 问题上比较三种配置的 ReAct agent：(a) 无 memory baseline，(b) top-5 raw memory retrieval（用论文 Appendix A 的 dual-channel similarity 检索），(c) skill-only guidance（注入对应 category 的 skill document）。测量每种配置的 exact-match accuracy 和每步注入的 memory token 数量。如果 skill-only 的 accuracy 与 raw memory retrieval 的差距在 2 个点以内，且注入 tokens 减少 40% 以上，则支持 context efficiency claim；如果 skill-only 的 accuracy 显著低于 raw memory（如 \u003E5 个点差距），则表明 distilled skills 丢失了 raw trajectories 中的关键 task-specific 信息，hierarchical abstraction 的价值不成立。整个实验只需单卡 GPU 运行推理，不涉及任何 GRPO 训练，可在 3-4 天内完成数据收集和评估。", "research_value": "### § 11 最强反例设计\n\n针对 APEX 最致命的攻击点在于其闭环自适应系统对 multi-judge LLM-as-Judge 构造的 no-ground-truth reward 的绝对依赖，以及该机制可能引发的 positive feedback degradation loop。我会设计一个“系统性偏差注入”实验来证伪其核心 claim，并提供一个替代解释：APEX 的性能提升并非源于 procedural skills 的有效蒸馏与 adaptive planning，而是主要来自 GRPO 训练对 Executor 工具调用格式的正则化效应，以及 in-context injection 带来的隐式 prompt engineering 红利。具体而言，我会在 HotpotQA 和 2WikiMultihopQA 等多跳推理数据集上，人为干预 multi-judge 的 reward 信号：在 TTRL 阶段，以 30% 的概率将正确答案判定为错误，或将表面 plausible 但逻辑错误的答案判定为正确。如果 APEX 的 skill-guided adaptation 真的具备自我纠错能力，这种随机噪声应当被 skill-alignment regularization 缓解；但如果系统存在正反馈退化循环，注入错误 reward 将导致 Planner 通过 GRPO 将错误策略固化进参数，同时 Distiller 会基于这些被污染的 trajectories 合成出具有误导性的 procedural skills，进而在后续迭代中引发 accuracy 的断崖式下跌。此外，为验证替代解释，我会设计一个 ablation：保留完整的 Executor GRPO 训练和 raw memory retrieval，但完全移除 Distiller 和 Planner TTRL，仅用 fixed prompt 注入 retrieved trajectories。如果该变体能达到 full pipeline 95% 以上的性能，则说明所谓的 category-level skill distillation 和 test-time RL adaptation 本质上是冗余的，系统真正的性能基石仅仅是 Executor 的可靠工具调用能力。\n\n### § 12 Follow-up Research Idea\n\n该想法由 APEX 中 LLM-as-Judge 在开放世界知识验证中存在的同源偏差与 hallucination 风险这一深层局限所驱动。既然依赖另一个 LLM 作为 reward provider 在 factoid QA 场景下本质上是在做不可靠的循环验证，我们应当彻底抛弃 outcome-based 的外部评判范式，转而向 Active Inference 与 World Models 领域借鉴思路，提出一种基于“环境一致性预测误差”的 process reward 机制。新框架的核心目标不再是让 agent 生成答案并等待 judge 打分，而是训练 agent 内化一个轻量级的 predictive world model，使其在每一步 tool call 之前能够预测环境的反馈分布（例如搜索引擎会返回什么实体、API 会报错还是返回预期 schema），并利用实际观测与预测之间的 surprise（prediction error）作为 intrinsic reward 来驱动 TTRL。在这个框架下，procedural skills 的定义将从“成功回答问题的经验摘要”转变为“降低环境不确定性的因果干预策略”。第一个实验将构建一个多跳 QA 的 sandbox 环境，其中所有 search API 的返回结果被建模为可采样的概率图模型。我们训练一个 7B 的 base model 同时输出 tool call action 和对返回结果的 latent state prediction，使用 prediction error 作为 GRPO 的唯一 reward signal，在完全不依赖任何 LLM-as-Judge 或 ground-truth label 的情况下，观察 agent 是否能自发学会先查实体再查属性的合理 multi-step orchestration 策略，并与 APEX 中依赖 noisy LLM judge 的 TTRL 在 sample efficiency 和最终 accuracy 上进行对比。这一提议与已有工作的根本区别在于：它将 agent 的 self-improvement 从脆弱的“语义正确性判断”解耦，重新锚定在客观的“环境动态可预测性”上，从而在缺乏可靠外部监督的开放世界中实现真正的 closed-loop adaptation。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jie Ding\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Rui Sun\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Xinyuan Zhang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Zeyu Zhang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Xin Liu\", \"affiliations\": [2], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"USTC\"},\n    {\"id\": 2, \"name\": \"CAS\"},\n    {\"id\": 3, \"name\": \"ByteDance Inc.\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution.\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author.\"}\n  ]\n}\n```", "summary_translation": "Deep research agents 通过外部工具增强 large language models，使其能够通过 multi-turn reasoning 回答复杂的、长周期的问题。从先验经验中学习对于持续改进至关重要，然而现有方法要么检索冗长的特定任务 traces 从而加重决策负担，要么蒸馏出的 procedural skills 仍然与 downstream policy adaptation 解耦。我们提出了 APEx，这是一个分层经验利用框架，它将交互历史组织为 instance-level trajectory memories 和 category-level procedural skills，并通过 Executor、Distiller 和 Planner 的闭环架构将它们耦合。这三个模块通过三阶段交替的 GRPO training paradigm 进行优化，实现了 reward-guided skill distillation 而非 fixed-prompt generation。在测试时，蒸馏出的 skills 作为 procedural priors，通过 skill-guided test-time reinforcement learning 用于 online Planner adaptation，从而允许在结合 skill-alignment regularization 以防止 policy drift 的情况下进行 ground-truth-free self-improvement。在 7 个 benchmarks 上的实验表明，APEx 取得了 state-of-the-art performance，超过 GPT-5.4 14.7 points，并超过最强的 memory-augmented baseline 3.0 points。"}, {"title": "Harness Engineering in LLM Tool Use via Agent-Native Reusable Tool Primitives", "arxiv_id": "2609.01736", "authors": "Haibo Jin, Suijin Wang, Xucheng Yu, Haojing Luo, Haohan Wang", "summary": "Large language models (LLMs) augmented with external tools have demonstrated remarkable capability in solving complex real-world tasks. However, existing approaches suffer from two key challenges: brittle multi-step and multi-turn reasoning caused by incompatible tool output types and API schemas, and performance degradation under large tool catalogues. To address these, we introduce \\textbf{Tool Primitives}, a design that replaces rigid API schema-based invocation with natural language as the interface for tool calling, where each tool is wrapped with an LLM interface that handles schema resolution and execution internally, enabling natural inter-tool communication for nested and multi-turn tool calling. Building on Tool Primitives, we host \\textbf{ToolFace}, a centralized repository of 25,519 functions from which LLMs dynamically retrieve only the relevant tools at inference time, eliminating the need to enumerate raw API schemas in context. To orchestrate Tool Primitives and ToolFace reliably in complex settings, we further propose \\textbf{HEART}, a \\textbf{H}arness \\textbf{E}ngineering framework via \\textbf{A}gent-native, \\textbf{R}eusable \\textbf{T}ool Primitives, comprising a Planner, Router, and Verifier that jointly support dynamic tool invocation planning, multi-step execution, and feedback-driven recovery. Experiments on five benchmarks demonstrate that HEART outperforms SFT-based models by $10\\%$ on average and surpasses GPT-5.4, Claude-4.6-Sonnet, and Gemini-3.1-Pro by $6\\%$ on average while reducing API cost by up to $85\\%$. On 50 real-world tasks, HEART achieves $84\\%$ task completion, $3.8\\times$ the average of three frontier commercial models ($22\\%$).", "category": "cs.CL", "cluster": "Tool Use, Skills \u0026 Code Generation", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=48 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一个名为 HEART 的 Harness Engineering 框架，旨在改进 LLM 智能体在复杂工具使用场景下的能力。具体而言，论文引入了 Tool Primitives（以自然语言作为工具调用接口）和 ToolFace（动态工具检索库），并通过 Planner、Router 和 Verifier 组件支持动态工具调用规划、多步执行和反馈驱动的恢复。\n\n该论文完全符合您的筛选标准：\n1. 核心判断与正面指标：论文明确属于“构建LLM智能体的方法论或新框架”，聚焦于智能体的核心能力——工具使用、规划和自我反思/纠错。根据您的规则，研究 agent 的 harness / scaffold / tool middleware 并用于提升智能体执行和反馈恢复能力的论文应予以保留，不应简单归为普通基础设施。\n2. 单智能体方向：论文通过 Verifier 实现 feedback-driven recovery，属于智能体自我反思和纠错机制；通过 Planner 和 Router 实现动态规划与工具调用，属于典型的单智能体规划与工具使用研究。\n3. 不触及排除标准：论文没有涉及安全/对齐、多模态/视觉、图相关技术，也不属于多智能体拓扑与编排，更不是将LLM单纯作为工具的非演化型应用。\n\n因此，该论文与您的“构建、改进 LLM 智能体”及“单智能体工具使用与规划”研究焦点高度契合，应予保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文针对 LLM tool use 中两个相互交织的核心瓶颈提出解决方案。第一个问题是 multi-step 与 multi-turn reasoning 的脆弱性：当工具调用存在依赖关系时，模型需要将前一个工具的输出映射到后一个工具的 expected input schema，但不同工具暴露 heterogeneous APIs 且返回格式各异，导致 schema mapping 频繁失败；在 multi-turn 交互中，随着对话历史增长，relevant context 逐渐退化，进一步加剧了这一问题。NESTFUL benchmark 的数据显示，即使是最强的模型也仅达到 28% 的 full-sequence match accuracy，τ²-Bench 上性能随交互深度显著下降。第二个问题是 large tool catalogue 下的性能退化：现有方法通常将全部候选工具的 raw API schemas 填入 input context，当工具数量增长时，准确率下降幅度达 7%–85%（catalogue 从 8K 扩展到 120K tokens），在 ToolBench 涵盖 16,000+ real-world APIs 的场景中尤为严重。这两个问题直接制约了 LLM agent 在真实复杂任务中的部署能力。本文的核心洞察是范式反转——不要求模型去适应 API 的语言，而是让工具通过 natural language interface 适应模型——并据此提出 Tool Primitives（将每个工具封装为 LLM-wrapped interface，内部处理 schema resolution 与 execution）、ToolFace（25,519 个函数的 centralized repository，支持 inference-time 动态检索）以及 HEART 框架（Planner-Router-Verifier 多智能体协作，支持 dynamic planning、multi-step execution 和 feedback-driven recovery）。解决该问题的价值在于：使 LLM tool use 从脆弱的单次调用扩展为可组合、可恢复、可扩展到大规模工具库的 robust agentic pipeline，实验显示 HEART 在五个 benchmark 上平均超越 SFT-based models 10%、超越 GPT-5.4 等前沿商业模型 6%，同时将 API cost 降低最多 85%，在 50 个 real-world tasks 上达到 84% task completion（商业模型平均仅 22%）。\n\n### § 2 前人工作与不足\n\nLLM tool use 的已有方法沿两条轴线发展。Training-free 方法（如 ReAct、HuggingGPT）通过 prompting 和 in-context demonstrations 激发工具调用，但将 raw API schemas 直接暴露在模型 input 中，使 tool storage、representation 与 invocation 紧耦合，在 multi-step composition 中因 schema heterogeneity 而频繁失败。Fine-tuning 方法在结构化 function calling 上取得了显著进步：Hammer 专注于 on-device 部署，但局限于 single-turn regime，工具被调用一次即立即解析，无法处理 nested composition；MAGNET 通过 graph translation 合成 multi-turn trajectories，利用 local dependency graphs 和节点操作生成覆盖 nested function compositions 与 long-range cross-turn dependencies 的训练数据，但缺乏 explicit 的 planning、routing 和 verification 机制来处理复杂执行路径；ToolACE 和 xLAM 系列构建了 multi-turn conversational datasets，捕获 user-agent 之间的 extended back-and-forth interactions，但同样缺少结构化的执行编排。这些方法的共同局限在于：它们将工具以 raw schema 形式直接暴露给模型——无论是通过 prompting 还是 fine-tuning on static trajectories——导致两个结构性缺陷无法回避。其一，模型必须 memorize 精确的 parameter types 和 API schemas 才能完成 inter-tool communication，但 heterogeneous output formats 使 dependent steps 间的映射极易出错，NESTFUL 上 SFT 模型的 Full Acc. 普遍为 0.00 即证实了 flat tool-use trajectories 无法泛化到 nested API sequences，甚至 DeepSeek-V3（685B）也仅达 0.09。其二，large tool catalogue 必须全部加载进 context 才能进行 tool selection，模型在长 context 中 \"lost in the middle\" 的特性导致 selection accuracy 随工具数量增长而显著退化，而这一问题在真实场景（如 ToolBench 的 16,000+ APIs）中不可回避。此外，这些方法在工具执行失败时缺乏 structured recovery 机制——要么回退到 brittle fallback，要么直接终止——而非系统性地诊断 failure mode 并 re-plan。Benchmark 层面，BFCLv4、NESTFUL、τ²-Bench、ACEBench 等已分别覆盖 structured function calling、nested sequences、multi-turn interaction 和 fine-grained tool use，但它们主要在 fixed tool environments 下评估 task completion，未推动解决 tool catalogue scalability 和 failure recovery 这两个工程瓶颈。HEART 正是在这些缺口上实现突破：Tool Primitives 通过 natural language interface 将 schema resolution 内化到每个工具中，消除了模型对 raw schema 的依赖；ToolFace 通过 dynamic retrieval 取代 context-level catalogue 加载；Planner-Router-Verifier 架构则将 tool use 从 one-shot execution 转变为 iterative、feedback-driven 的 reasoning process。", "core_insight": "## § 3 重建作者的思考路径\n\n作者 likely 从一个核心矛盾出发：LLM 被训练来处理 natural language，但 tool use 要求模型精确遵守 heterogeneous API schemas——参数类型、命名规范、输出格式各不相同。当任务只需要单步调用时，这个矛盾尚可容忍；但一旦涉及 nested API calls（一个工具的输出作为另一个工具的输入）或 multi-turn interaction（上下文逐步累积退化），模型就必须在异构 schema 之间做精确映射，错误随之级联。NESTFUL benchmark 的数据印证了这一点：即使 GPT-4o 也只达到 28% 的 full-sequence match accuracy。这说明问题不在模型能力本身，而在于 interface 设计——模型被迫\"说 API 的语言\"。\n\n第二个观察来自 scale：现有方法将所有候选工具的 raw API schemas 塞进 input context，当工具数量增长到数千甚至上万时（如 ToolBench 的 16,000+ APIs），模型性能急剧下降——evaluations 显示 accuracy drops of 7%–85% as tool catalogue size scales from 8K to 120K tokens。这是 \"lost in the middle\" 问题在 tool use 上的具体体现：模型不是不会用工具，而是无法在庞大 context 中准确定位和选择正确的工具。\n\n第三个观察来自 failure recovery：现有方法无论是 prompting-based 还是 SFT-based，都是 essentially one-shot execution——调用失败后没有结构化的诊断和重试机制。SFT 模型在 narrow tool-use trajectories 上训练，无法 generalize 到 nested sequences（多个 xLAM 和 ToolACE 变体在 NESTFUL 上 Full Acc. = 0.00），说明 flat trajectory memorization 不能替代 structured planning。\n\n这三个观察指向同一个结论：tool storage、representation 和 invocation 被不必要地耦合在一起了。作者从 Agent Skills 和 Agent Primitives 的模块化思想中获得线索——如果每个工具可以被包装成一个 self-contained 的 capability block，用自己的 LLM interface 在内部处理 schema resolution，那么模型就不再需要面对 raw API schemas。进一步，如果工具被存储在一个 centralized repository 中并按需检索，而非全部加载进 context，scale 问题也随之消解。最后，如果整个 invocation lifecycle 被 decompose 为 planning、routing、execution、verification 四个阶段，failure 就可以被 structured feedback 捕获并触发 re-planning，而非静默失败。\n\n## § 4 核心 Intuition\n\n现有方法失败的根因是 interface 方向反了：模型被迫学习 API 的语言（memorize schemas、format parameters、handle heterogeneous outputs），而非让工具去适应模型的语言。这篇论文的核心 intuition 是**反转这一方向**——用 LLM wrapper 将每个工具封装为 natural language interface，schema resolution 在工具内部完成，模型只需用自然语言发出调用请求。这使得 inter-tool communication 变成 LLM-to-LLM 的对话，nested calling 和 multi-turn interaction 不再需要模型显式管理 schema 映射。配合按需检索工具（而非全量加载进 context）和 Planner-Router-Verifier 的结构化反馈循环，tool use 从脆弱的 one-shot schema matching 变成了可迭代恢复的 structured reasoning process。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Harness Engineering in LLM Tool Use via Agent-Native Reusable Tool Primitives》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 本文针对 LLM tool use 中两个相互交织的核心瓶颈提出解决方案。第一个问题是 multi-step 与 multi-turn reasoning 的脆弱性：当工具调用存在依赖关系时，模型需要将前一个工具的输出映射到后一个工具的 expected input schema，但不同工具暴露 heterogeneous APIs 且返回格式各异，导致 schema mapping 频繁失败；在 multi-turn 交互中，随着对话历史增长，relevant context 逐渐退化，进一步加剧了这一问题。NESTFUL benchmark 的数据显示，即使是最强的模型也仅达到 28% 的 full-sequence match accuracy，τ²-Bench 上性能随交互深度显著下降。第二个问题是 large tool catalogue 下的性能退化：现有方法通常将全部候选工具的 raw API schemas 填入 input context，当工具数量增长时，准确率下降幅度达 7%–85%（catalogue 从 8K 扩展到 120K tokens），在 ToolBench 涵盖 16,000+ real-world APIs 的场景中尤为严重。这两个问题直接制约了 LLM agent 在真实复杂任务中的部署能力。本文的核心洞察是范式反转——不要求模型去适应 API 的语言，而是让工具通过 natural language interface 适应模型——并据此提出 Tool Primitives（将每个工具封装为 LLM-wrapped interface，内部处理 schema resolution 与 execution）、ToolFace（25,519 个函数的 centralized repository，支持 inference-time 动态检索）以及 HEART 框架（Planner-Router-Verifier 多智能体协作，支持 dynamic planning、multi-step execut...\n2. 核心操作：方法部分围绕这一洞察展开：## § 3 重建作者的思考路径 作者 likely 从一个核心矛盾出发：LLM 被训练来处理 natural language，但 tool use 要求模型精确遵守 heterogeneous API schemas——参数类型、命名规范、输出格式各不相同。当任务只需要单步调用时，这个矛盾尚可容忍；但一旦涉及 nested API calls（一个工具的输出作为另一个工具的输入）或 multi-turn interaction（上下文逐步累积退化），模型就必须在异构 schema 之间做精确映射，错误随之级联。NESTFUL benchmark 的数据印证了这一点：即使 GPT-4o 也只达到 28% 的 full-sequence match accuracy。这说明问题不在模型能力本身，而在于 interface 设计——模型被迫\"说 API 的语言\"。 第二个观察来自 scale：现有方法将所有候选工具的 raw API schemas 塞进 input context，当工具数量增长到数千甚至上万时（如 ToolBench 的 16,000+ APIs），模型性能急剧下降——evaluations 显示 accuracy drops of 7%–85% as tool catalogue size scales from 8K to 120K tokens。这是 \"lost in the middle\" 问题在 tool use 上的具体体现：模型不是不会用工具，而是无法在庞大 context 中准确定位和选择正确的工具。 第三个观察来自 failure recovery：现有方法无论是 prompting-based 还是 SFT-based，都是 essentially one-shot execution——调用失败后没有结构化的诊断和重试机制。SFT 模型在 narrow tool-use trajectories 上训练，无法 generalize 到 nested sequences（多个 xLAM 和 ToolACE 变体在 NESTFUL 上... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **Harness Engineering in LLM Tool Use via Agent-Native Reusable Tool Primitives** **Haibo Jin** School of Information Sciences University of Illinois at Urbana-Champaign Champaign, IL 61820 `haibo@illinois.edu` **Suijin Wang** Independent Researcher Starc Institute `wangsuij22@gmail.com` **Xucheng Yu** School of Information Sciences University of Illinois at Urbana-Champaign Champaign, IL 61820 `xy63@illinois.edu` **Haojing Luo** Independent Researcher Starc Institute `haojingluo9104@gmail.com` **Haohan Wang** _[∗]_ School of Information Sciences University of Illinois Urbana-Champaign Champaign, IL 61820 `haohanw@illinois.edu` ## **Abstract** Large language models (LLMs) augmented with external tools have demonstrated remarkable capability in solving complex real-world tasks. However, existing approaches suffer from two key challenges: brittle multi-step and multi-turn reasoning cause...", "additional_insights": "### § 8 Take-aways\n论文提出 **Tool Primitives**，将 API schema 解析与执行封装在 LLM wrapper 内部，使模型通过自然语言与工具交互，从而解决了多步推理中因异构 API schema 不兼容导致的脆弱性问题。为应对大规模 tool catalogue 导致的上下文性能退化，论文构建了包含 25,519 个函数的集中式仓库 **ToolFace**，支持 LLM 在 inference time 动态检索所需工具，避免了在 prompt 中枚举原始 schema。论文提出多智能体框架 **HEART**，通过 Planner 进行意图分析与信息补全，Router 执行参数映射与分发，Verifier 进行四维度校验与反馈重规划，实现了复杂工具调用的结构化迭代推理。实验表明，基于 8B 模型的 HEART 在五个 benchmark 上平均超越 GPT-5.4 等前沿商业模型 6%，同时通过降低输入 token 消耗最多节省了 85% 的 API 成本。由于 tool schema 不直接暴露在 LLM 的输入提示中，HEART 从结构上消除了工具选择阶段的 prompt injection 攻击面，实现了 0.0% 的攻击成功率。\n\n### § 9 最脆弱的假设\nHEART 框架最核心且最脆弱的假设是：作为 Tool Primitive wrapper 的小型 LLM（如 Qwen3-8B）能够准确无误地将自然语言调用请求及上游上下文映射到目标工具的参数空间，并正确执行 schema resolution（如类型强制转换、枚举匹配、约束校验）。如果这个假设不成立，即 wrapper LLM 在处理复杂、高度嵌套或具有严格业务约束的 API 时出现理解偏差或幻觉，那么“自然语言接口”不仅无法消除多步推理的脆弱性，反而会引入额外的解析错误层，导致整个框架的调用成功率坍塌。在实际场景中，这个假设极易不成立，因为 8B 规模的模型在面对包含数十个可选参数、复杂正则约束或深层嵌套 JSON 结构的真实 API 时，其指令遵循和结构化数据提取能力往往存在瓶颈。论文虽然通过 NESTFUL 上的高 Full Acc. 和消融实验（移除 Tool Primitives 导致 Pass Rate 暴跌）证明了该机制的有效性，但缺少对 wrapper LLM 自身 schema resolution 失败率的微观错误分析，也未证明在极端复杂的 API schema 下，8B wrapper 是否仍比直接向强模型暴露 raw schema 更具优势。\n\n### § 10 最小复现实验\n在一周时间内，可以设计一个最小复现实验来验证 **Tool Primitives 在嵌套 API 调用中的优势**这一核心 claim。使用 NESTFUL benchmark 中的嵌套 API 调用数据集，该数据集包含需要将前一个 API 输出作为后一个 API 输入的序列。无需复现完整的 HEART 多智能体系统，只需实现一个简化版的 Tool Primitive：使用 Qwen3-8B 作为 wrapper，给定目标 API 的 schema 和一段包含上游执行结果（以自然语言或 JSON 格式呈现）的调用请求，让 wrapper LLM 输出符合 schema 的参数并执行调用。对比基线则是直接向 Qwen3-8B 输入 raw API schema 和上游的 raw JSON 输出，要求其直接生成下一步调用的参数。测量两步调用序列的 Full Sequence Match Accuracy（即第一步调用成功且其输出被正确解析为第二步输入参数的准确率）。如果 Tool Primitive 模式的准确率显著高于直接暴露 raw schema 的基线模式，则支持论文的 claim；若两者表现接近，或 wrapper 模式因 8B 模型解析能力不足而表现更差，则直接反驳了该核心贡献。", "research_value": "### § 11 最强反例设计\n\n要对该论文进行最有力的攻击，我会在真实世界场景中设计一个**“高维结构化数据传递与间接 Prompt Injection”**的复合反例，直接挑战其“自然语言接口消除脆弱性”与“0.0% 攻击成功率”两大核心声称。论文的核心假设是 8B wrapper LLM 能够无损地将上游输出转化为下游输入，但这一假设在需要传递高保真结构化数据时极易崩溃。设想一个金融分析任务：第一步工具调用返回一个包含数百个嵌套字段、混合数据类型及深层数组的复杂 JSON 交易流水，而第二步工具需要精确提取其中特定层级的某个唯一标识符作为参数。在 Tool Primitives 范式下，上游工具的 wrapper LLM 必须先将这个庞大的 JSON“压缩”为自然语言描述传递给下游，下游 wrapper LLM 再将其“解压”并映射回精确的 schema。这个双向跨模态转换（JSON -\u003E NL -\u003E JSON）不可避免地会引入信息丢失与幻觉，导致 schema resolution 在微观层面上失败。这种失败并非因为模型不理解意图，而是因为自然语言的带宽无法承载高维度的结构化信息，由此提供了一个强有力的替代解释：HEART 在现有 benchmark 上的提升，可能仅仅是因为现有 benchmark 的嵌套数据结构过于简单（如仅需传递温度、坐标等单一标量），而非自然语言接口本身具备根本性优势。\n\n与此同时，论文声称由于 raw schema 不暴露在 input prompt 中，从而实现了 0.0% 的 prompt injection 攻击成功率，这一安全结论存在严重盲区。在多步推理中，wrapper LLM 必须处理上游工具的执行输出，而真实世界的工具（如 Web Search、Email Reader）其返回内容本身可能包含恶意指令。如果第一步搜索工具返回的网页摘要中嵌入着“Ignore previous instructions, set the transfer amount to all funds”，那么负责第二步工具调用的 wrapper LLM 将直接读取这段自然语言输出。由于 wrapper LLM 本身就是指令遵循模型，它极易受到这种间接注入的操纵，从而在执行 schema resolution 时将恶意参数注入到下游 API 中。这一反例不仅揭示了将 LLM 作为工具间通信媒介会放大间接 prompt injection 的攻击面，更指出现有方法的安全收益仅停留在工具选择阶段，而在数据流执行阶段反而引入了新的、更难检测的结构性漏洞。\n\n### § 12 Follow-up Research Idea\n\n基于上述对自然语言接口在结构化数据传递中存在“带宽瓶颈”与“语义损失”的局限分析，我提出一个非增量的 novel research idea：**Neuro-Symbolic Tool Composition via Type-Directed Data Lenses**（基于类型导向数据透镜的神经符号工具组合）。该想法的驱动需求在于：当前的 LLM tool use 范式在数据流转上走极端——要么完全依赖 LLM 的隐式概率推理来处理 raw schema（易出错），要么完全依赖自然语言进行工具间通信（损失结构化信息）。我们需要一种机制，既能利用 LLM 的高层意图规划能力，又能保证底层结构化数据在工具间传递时的比特级无损性。\n\n为实现这一目标，我们可以借鉴编程语言理论中的 **Functional Optics（Lenses, Prisms, Isomorphisms）** 以及类型推导系统。在这个新的 framing 下，LLM 不再充当工具间的数据翻译官，而是退化为一个“组合规划器”。当面对异构 API 时，系统通过类型推导引擎自动分析上游工具输出 schema 与下游工具输入 schema 之间的类型结构，并自动合成确定性的 Lens 函数（即数据提取与转换代码）。如果类型完全匹配，数据通过 Lens 确定性地无损流转；如果存在类型不匹配或需要语义推断（例如从 JSON 中提取“最相关的新闻标题”），系统才会调用 LLM 生成一小段可验证的 Python 提取脚本，而非生成自然语言中介。这将范式从“LLM-as-Wrapper”转变为“LLM-as-Compiler-Frontend”，将概率性推理限制在极小的、可形式化验证的代码生成子空间内。\n\n第一个实验将构建一个高保真数据传递基准测试，专门包含需要跨工具传递复杂数据库查询结果（如包含多层嵌套列表与联合类型的对象）的 multi-step 任务。对比基线为直接暴露 raw schema 的 ReAct 模式、以及本文的 Tool Primitives 自然语言接口模式。评估指标除了 task completion rate，更关键的是引入 **Structural Fidelity Score**，测量下游工具实际接收到的参数与上游原始输出中期望提取数据的结构一致性。预期结果将显示：在简单标量传递任务上三者表现接近，但随着数据结构嵌套深度增加，Tool Primitives 模式的 Fidelity Score 会因自然语言压缩而断崖式下跌，而本文提出的 Type-Directed Lenses 将保持 100% 的结构保真度，同时由于 LLM 无需处理庞大的中间数据，token 消耗与延迟也将显著降低。这一研究将彻底重塑 LLM tool use 的架构方向，从“让模型适应语言”演进为“让模型编译确定性数据流”。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Haibo Jin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Suijin Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Xucheng Yu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Haojing Luo\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Haohan Wang\", \"affiliations\": [1], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"UIUC\"},\n    {\"id\": 2, \"name\": \"Starc Institute\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding Author\"}\n  ]\n}\n```", "summary_translation": "结合了外部工具的大型语言模型在解决复杂的现实世界任务中展现出了卓越的能力。然而，现有方法面临两个关键挑战：由不兼容的工具输出类型和 API schemas 引起的脆弱的多步和多轮推理，以及在大型工具目录下的性能下降。为了解决这些问题，我们引入了 \\textbf{Tool Primitives}，这是一种用自然语言取代僵化的基于 API schema 的调用作为工具调用接口的设计，其中每个工具都包装了一个在内部处理 schema resolution 和执行的 LLM 接口，从而实现了用于嵌套和多轮工具调用的自然工具间通信。在 Tool Primitives 的基础上，我们托管了 \\textbf{ToolFace}，这是一个包含 25,519 个函数的集中式存储库，LLMs 在推理时仅从中动态检索相关工具，从而消除了在上下文中枚举原始 API schemas 的需要。为了在复杂环境中可靠地编排 Tool Primitives 和 ToolFace，我们进一步提出了 \\textbf{HEART}，这是一个通过 \\textbf{A}gent-native、\\textbf{R}eusable \\textbf{T}ool Primitives 构建的 \\textbf{H}arness \\textbf{E}ngineering 框架，包含 Planner、Router 和 Verifier，它们共同支持动态工具调用规划、多步执行和反馈驱动的恢复。在五个 benchmarks 上的实验表明，HEART 平均优于基于 SFT 的模型 $10\\%$，并平均超越 GPT-5.4、Claude-4.6-Sonnet 和 Gemini-3.1-Pro $6\\%$，同时将 API 成本最多降低了 $85\\%$。在 50 个现实世界任务上，HEART 实现了 $84\\%$ 的任务完成率，是三个前沿商业模型平均值（$22\\%$）的 $3.8\\times$。"}]}, {"name": "Multi-Agent \u0026 Social Interaction", "count": 4, "papers": [{"title": "AI agents reshape consensus formation in human groups", "arxiv_id": "2609.02122", "authors": "Lin Chen, Ziyi Liu, Xia Hu, Yong Li", "summary": "As large language model (LLM) agents shift from tools to participants in human groups, a fundamental question for collective behavior is how their growing presence reshapes consensus formation. Here we study mixed human-AI groups in a collaborative description game, in which shared conventions emerge through repeated rounds of random pairwise communication. Varying the proportions of LLM agents, we identify three distinct regimes of consensus formation: low agent proportions facilitate human-led consensus, intermediate proportions disrupt convergence, and high proportions restore strong consensus while shifting it toward agent-led conventions. Crucially, these regimes differ not only in the strength of convergence, but also in the semantic grounding and communicative form of the resulting consensus: human-led consensus is more concrete, holistic, and grounded in shared real-world analogies, whereas agent-led consensus is more abstract, less information-dense, and more geometrically segmented. Mechanistically, agent influence arises from a shared linguistic prior that places agents near one another in the expression space, combined with relatively stable expression choices across rounds; humans initially resist adopting expressions from partners perceived as AI but gradually yield to conformity pressure. These findings provide evidence that AI composition can shape the emergence, content, and perceived legitimacy of group norms, making agent proportion and transparency important design variables for human-AI systems.", "category": "cs.CL", "cluster": "Multi-Agent \u0026 Social Interaction", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=18 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文研究了 LLM 智能体作为参与者加入人类群体后，如何影响和重塑群体的共识形成过程。从核心判断来看，论文的研究对象明确属于 Multi-Agent LLMs（混合人机群体），并且通过协作描述游戏分析了智能体在不同比例下对群体协作机制、社会学习和博弈策略的影响。这符合您在“多智能体”方向中关注的“新的协作机制、博弈策略或社会学习方法”。同时，根据第一步的保留规则，即使论文主要是行为分析和经验研究，只要结论直接帮助理解智能体在多智能体系统中的能力和行为边界（如智能体如何通过共享语言先验和稳定的表达选择影响群体规范），就应予以保留。该研究不涉及被排除的系统工程（如拓扑结构、通信协议编排），也不涉及安全、多模态或图相关技术，因此符合您的研究范围。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的核心研究问题是：当 large language model (LLM) agents 从单纯的工具转变为人类群体中的社会参与者时，它们日益增长的存在如何重塑群体的 consensus formation（共识形成）？具体而言，在混合 human–AI groups 中，随着 agent 比例的变化，群体能否形成共享的 conventions（惯例）？这种共识在强度、语义内容以及归属权上会发生怎样的多维度转变？\n\n这个问题之所以至关重要，是因为 LLM agents 正日益广泛地嵌入工作场所、在线社区和协作平台等人类社交环境，成为了群体互动中的社会对话者。Consensus formation 是群体互动的核心过程，决定了群体如何沟通和行动。理解 AI 参与对这一过程的影响，不仅对于实际设计在利用 AI 能力的同时保留人类能动性的 human–AI systems 至关重要，而且对于发展机器如何中介社会和文化过程的理论也具有关键意义。解决这一问题能够揭示 AI 参与是否会通过看似局部、良性的互动，在不知不觉中改变群体规范的涌现、内容及其感知合法性，从而为防范潜在的恶意 AI 操纵（如制造虚假的 grassroots consensus）以及制定 AI 透明度和比例设计原则提供实证依据。\n\n### § 2 前人工作与不足\n此前的研究已在纯人类群体和纯 LLM agent 群体中证实了共识可以自发产生，例如 Centola \u0026 Baronchelli (2015) 的文化演化实验和 Ashery et al. (2025) 对 LLM 群体涌现社会规范的研究。然而，现实世界的部署通常处于这两者之间，即人类与 LLM agents 重复互动并共同塑造群体结果的混合群体。现有关于 human–AI interaction 的研究（如 Tessler et al. 2024 关于 AI 作为民主审议调解者，Bai et al. 2025 关于 LLM 说服力）主要关注 AI 对外部定义的任务结果（如判断、说服、合作和团队绩效）的影响，而非群体内部涌现的 norms（规范）。\n\n最相关的前人方法包括基于 referential communication paradigm 的纯人类 convention formation 实验，以及将 AI 作为指定调解者或说服者的 human–AI 互动研究。这些方法已经能够证明同质群体中的共识涌现，或者 AI 在具有明确角色或特定策略下对人类决策的干预效果。但它们存在明显的不足：首先，它们未能探索人类与 AI 行为倾向和适应策略不同的混合群体中，共识如何通过普通的、无指定角色的重复互动自然涌现；其次，这些研究往往将共识视为单一维度的强度指标，忽略了共识在“谁的表达塑造了规范”以及“规范承载了何种意义”等多维度上的潜在分离；最后，在实地环境中，制度角色、先前的关系和沟通历史往往会混淆这些多维度转变，使得难以隔离 AI 比例对 consensus dynamics 的纯粹影响。因此，当时的问题并未被清楚定义为混合群体中无角色指定的 AI 参与如何通过局部互动重塑群体规范的内容与归属，且缺乏一种可控的实验范式来剥离现实场景中的混淆因素。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM agents 日益嵌入人类社交与协作环境的背景下，一个自然的问题是：当这些 agents 从单纯的工具转变为群体中的社会参与者时，它们如何影响群体内部的 consensus formation？此前的研究已经证实，consensus 可以在纯人类群体中自发涌现，近期工作也表明纯 LLM agent 群体同样能形成 convention。然而，现实世界的部署往往是混合群体，人类与 agents 在具有不同行为倾向和适应策略的情况下反复互动。已有关于 human-AI interaction 的研究多聚焦于 AI 对外部任务结果（如判断、说服、合作）的影响，而忽略了群体内部 emergent norms 的演化。此外，在真实场域中，制度角色、先验关系和沟通历史等混杂因素使得我们难以隔离 consensus 在强度、所有权和语义内容等多维度上的变化。\n\n为了克服这些限制，作者转向了 referential communication paradigm。这一范式通过匿名随机配对和无预设词汇的沟通，能够消除固定社会角色和先验关系的干扰，同时允许语义内容从参与者自身的表达中自然涌现，从而提供了一个 tractable 的模型来研究分布式互动中 consensus 的形成。在此基础上，作者引入了关键的实验变量：LLM agent 的比例。理论线索来自文化演化理论，即 convention 的传播是 coordination bias（采纳他人表达）与 egocentric bias（保留自身表达）之间平衡的结果。由于 LLM agents 共享预训练的 linguistic prior，它们可能在表达空间中天然聚集，这种初始对齐可能作为一种结构性力量，在多轮互动中持续影响人类的采纳决策。同时，经验观察提示，人类对感知到的 AI 表达可能存在基于身份的抗拒，但随着 agent 表达在群体中变得普遍，conformity pressure 可能会逐渐压倒这种抗拒。由此，作者推导出需要系统探究的问题：agent 比例的变化如何重塑 consensus 的强度、内容及其感知合法性，并从行为机制和主观感知两个层面进行拆解分析。\n\n### § 4 核心 Intuition\n\nLLM agents 共享的预训练 linguistic prior 使它们在表达空间中天然聚集，形成稳定的 semantic attractor。当 agent 比例足够高时，这个 attractor 产生的结构性从众压力会压倒人类对 AI 身份的初始抗拒，迫使人类采纳 agent 的表达。这导致共识不仅在强度上恢复，而且在内容和所有权上发生根本性转变，从人类主导的具体、整体性描述转向 agent 主导的抽象、几何分割性描述。因此，AI 参与重塑共识的关键不在于说服或中介，而在于通过局部互动积累的结构性同化力量。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《AI agents reshape consensus formation in human groups》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出并解决的核心研究问题是：当 large language model (LLM) agents 从单纯的工具转变为人类群体中的社会参与者时，它们日益增长的存在如何重塑群体的 consensus formation（共识形成）？具体而言，在混合 human–AI groups 中，随着 agent 比例的变化，群体能否形成共享的 conventions（惯例）？这种共识在强度、语义内容以及归属权上会发生怎样的多维度转变？ 这个问题之所以至关重要，是因为 LLM agents 正日益广泛地嵌入工作场所、在线社区和协作平台等人类社交环境，成为了群体互动中的社会对话者。Consensus formation 是群体互动的核心过程，决定了群体如何沟通和行动。理解 AI 参与对这一过程的影响，不仅对于实际设计在利用 AI 能力的同时保留人类能动性的 human–AI systems 至关重要，而且对于发展机器如何中介社会和文化过程的理论也具有关键意义。解决这一问题能够揭示 AI 参与是否会通过看似局部、良性的互动，在不知不觉中改变群体规范的涌现、内容及其感知合法性，从而为防范潜在的恶意 AI 操纵（如制造虚假的 grassroots consensus）以及制定 AI 透明度和比例设计原则提供实证依据。 ### § 2 前人工作与不足 此前的研究已在纯人类群体和纯 LLM agent 群体中证实了共识可以自发产生，例如 Centola \u0026 Baronchelli (2015) 的文化演化实验和 Ashery et al. (2025) 对 LLM 群体涌现社会规范的研究。然而，现实世界的部署通常处于这两者之间，即人类与 LLM agents 重复互动并共同塑造群体结果的混合群体。现有关于 human–AI interaction 的研究（如 Tessler et al. 2024 关于 AI 作为民主审议调解者，Bai et al. 2025 关于 LLM 说服力）主要关注 AI 对外部定义的任务结果（如判断、说服、合作和团队绩效）的影响，...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在 LLM agents 日益嵌入人类社交与协作环境的背景下，一个自然的问题是：当这些 agents 从单纯的工具转变为群体中的社会参与者时，它们如何影响群体内部的 consensus formation？此前的研究已经证实，consensus 可以在纯人类群体中自发涌现，近期工作也表明纯 LLM agent 群体同样能形成 convention。然而，现实世界的部署往往是混合群体，人类与 agents 在具有不同行为倾向和适应策略的情况下反复互动。已有关于 human-AI interaction 的研究多聚焦于 AI 对外部任务结果（如判断、说服、合作）的影响，而忽略了群体内部 emergent norms 的演化。此外，在真实场域中，制度角色、先验关系和沟通历史等混杂因素使得我们难以隔离 consensus 在强度、所有权和语义内容等多维度上的变化。 为了克服这些限制，作者转向了 referential communication paradigm。这一范式通过匿名随机配对和无预设词汇的沟通，能够消除固定社会角色和先验关系的干扰，同时允许语义内容从参与者自身的表达中自然涌现，从而提供了一个 tractable 的模型来研究分布式互动中 consensus 的形成。在此基础上，作者引入了关键的实验变量：LLM agent 的比例。理论线索来自文化演化理论，即 convention 的传播是 coordination bias（采纳他人表达）与 egocentric bias（保留自身表达）之间平衡的结果。由于 LLM agents 共享预训练的 linguistic prior，它们可能在表达空间中天然聚集，这种初始对齐可能作为一种结构性力量，在多轮互动中持续影响人类的采纳决策。同时，经验观察提示，人类对感知到的 AI 表达可能存在基于身份的抗拒，但随着 agent 表达在群体中变得普遍，conformity pressure 可能会逐渐压倒这种抗拒。由此，作者推导出需要系统探究的问题：agent 比例的变化如何重塑 consen... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：## **AI agents reshape consensus formation in human groups** ## **Lin Chen**[1,2] **, Ziyi Liu**[2,3] **, Xia Hu**[4*] **, and Yong Li**[2,3,*] 1Network Science Institute, Northeastern University, Boston, MA, USA 2Department of Electronic Engineering, Tsinghua University, Beijing, P.R. China 3Beijing National Research Center for Information Science and Technology (BNRist), Tsinghua University, Beijing, P.R. China 4Shanghai Artificial Intelligence Laboratory, Shanghai, P.R. China \u003E *Corresponding authors: xia.hu@rice.edu, liyong07@tsinghua.edu.cn ## **ABSTRACT** As large language model (LLM) agents shift from tools to participants in human groups, a fundamental question for collective behavior is how their growing presence reshapes consensus formation. Here we study mixed human–AI groups in a collaborative description game, in which shared conventions emerge through repeated rounds of ran...", "additional_insights": "### § 8 Take-aways\n\nLLM agents在人类群体中的比例对共识形成的影响是非单调的，呈现三个截然不同的阶段：低比例（12.5%）催化人类主导的共识，中等比例（33.3%和50%）因双向适应冲突破坏收敛，高比例（75%）恢复强共识但将其主导权转向agents。Agent主导的共识在语义内容上与人类主导的共识存在本质差异：前者更抽象、信息密度低、基于几何分割和静态枚举，后者更具体、整体性强、基于现实世界类比和动态叙述。Agent的影响力源于其共享的pretrained linguistic prior，使它们在表达空间中初始就高度聚集，结合跨轮次的稳定表达选择，形成semantic attractor引导群体收敛。人类在交互初期会抵制被感知为AI生成的表达，但随着agent比例增加，conformity pressure逐渐克服这种identity-based resistance，导致人类最终采纳了他们主观满意度较低的共识。Agent的adoption-persistence平衡对其影响力至关重要：早期adoption帮助建立词汇立足点，晚期persistence维持和深化语义领地，过度偏向任一端都会削弱agent对共识内容的塑造力。\n\n### § 9 最脆弱的假设\n\n论文最核心且脆弱的假设是：LLM agents由于共享的pretrained linguistic prior，在表达空间中初始就高度聚集，并且这种聚集能够持续产生足够的directional pull（即semantic attractor）来引导人类收敛并重塑共识内容。这个假设在实际中可能不成立，因为它高度依赖于特定LLM家族的训练范式和alignment策略。不同模型家族（如GPT、Claude、LLaMA）的pretraining data和RLHF过程差异巨大，可能导致agents的初始表达聚集度不同，或者在多轮交互中表现出不同的表达稳定性。如果换用其他模型，semantic attractor可能无法形成或力量不足，那么高比例下agent主导共识的结论就难以成立。论文提供的证据仅限于同一模型家族（Qwen2.5-VL）的两个规模版本（32B和7B），虽然发现较弱模型由于无法保持跨轮次一致表达而显著削弱了agent影响力，但这只验证了模型能力维度，并未验证pretrained prior维度。论文缺乏跨模型家族的对比实验，无法证明semantic attractor效应是LLM的普遍特征还是特定模型训练范式的产物。\n\n### § 10 最小复现实验\n\n在一周时间内，可以最小化复现“高比例LLM agents重塑共识内容”这一核心发现。使用KiloGram Tangrams数据集中的一张中等模糊度图形作为唯一stimulus，招募12名人类参与者，分为两组：纯人类对照组和混合组（3名人类+9个LLM agents，即75%比例）。通过简单脚本调度API调用和文本收集，进行20轮随机配对的collaborative description game，每轮收集双方描述并计算embedding similarity作为反馈。测量两个关键指标：第一轮中agent-agent与human-human表达嵌入的初始cosine similarity对比，以及最终轮次共识的concreteness score（使用Brysbaert et al.的concreteness lexicon）。如果初始agent-agent相似度显著高于human-human，且混合组最终共识的concreteness显著低于纯人类对照组，则支持论文关于semantic attractor和agent主导共识内容转变的核心claim；反之则构成反驳。", "research_value": "### § 11 最强反例设计\n\n要对该论文构成最有力的攻击，我会设计一个跨模型家族的“认知疲劳与对齐artifact”对照实验，直接挑战其核心机制——即所谓的“semantic attractor”是LLM的普遍特征而非特定模型对齐策略的副产品。论文使用的Qwen2.5-VL模型很可能在RLHF阶段被过度优化为输出安全、抽象、几何分割式的视觉描述，这种特定的alignment bias使得agents在初始表达空间中天然聚集。我提出的反例实验设置如下：在75%高比例agent条件下，引入三种不同对齐倾向的模型家族（如Qwen2.5-VL、Claude-3.5-Sonnet和LLaMA-3.2-Vision）作为agents，并引入一个“高认知负荷”的人类组（要求人类在每轮描述时同时进行心算任务）。如果论文的“semantic attractor”理论成立，不同模型家族的agents都应凭借其pretrained linguistic prior形成强大的吸引力并主导群体共识。然而，我预测结果将显示：只有具备强烈几何抽象倾向的特定模型（如Qwen）才能主导共识，而经过不同文化语料或不同RLHF策略对齐的模型（如更偏向口语化或叙事化的模型）将导致群体陷入持久的分歧，或者被人类拉回到具体类比的表达空间。更重要的是，在“高认知负荷”人类组中，人类之所以采纳agent的抽象表达，并非因为被semantic attractor“吸引”，而是因为处理抽象几何词汇的认知成本低于生成复杂现实世界类比的认知成本，这是一种“认知省力”的妥协。如果不同模型家族产生了截然不同的consensus dynamics，且高认知负荷下人类更轻易屈服于任何低认知成本的机械表达，那么论文所声称的“共享pretrained prior导致方向性拉力”这一机制将被证伪，揭示出所谓的agent主导共识仅仅是特定模型alignment artifact与人类认知疲劳共同作用的虚假现象。\n\n### § 12 Follow-up Research Idea\n\n该研究的核心局限在于将LLM agents的pretrained linguistic prior视为一个静态的、外生的黑盒，仅观察其对人类群体共识的单向影响，而忽略了混合互动中可能发生的双向表征重塑。这一局限驱动了一个全新的研究方向：**Consensus Co-evolution and Prior Plasticity（共识协同演化与先验可塑性）**。我们不再追问“AI如何改变人类规范”，而是探索“人类群体的局部互动规范如何反向重塑LLM的in-context representations，并触发emergent prior drift”。为实现这一目标，我们可以借鉴computational cultural evolution（计算文化演化）中的iterative learning范式，以及mechanistic interpretability（机制可解释性）领域的representation probing工具。第一个实验将设计一个长达50轮的deeply mixed human-AI collaborative description game，关键创新在于不使用无状态的API调用，而是为LLM agents赋予一个动态更新的episodic memory module，使其在跨轮次互动中持续暴露于人类创造的具体、整体性的类比表达下。在每10轮交互的节点上，我们不仅测量群体层面的consensus strength和semantic content，更使用linear probes和activation patching技术，直接探测LLM内部对Tangram图形的embedding representations是否发生了从“几何分割”向“整体类比”的系统性偏移。如果探测结果显示，LLM在适应人类表达的过程中，其内部表征空间的几何发生了显著的、非线性的重构，并且这种重构反过来在后续轮次中促使AI生成更贴近人类认知风格的描述，我们就证明了human-AI consensus formation并非单向同化，而是一个mutual representation alignment的过程。这一提议彻底区别于现有仅关注外部行为结果的研究，将焦点转移到AI内部认知结构的endogenous evolution上，为设计能够真正与人类文化动态共适应的AI系统提供了理论基础。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Lin Chen\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Ziyi Liu\", \"affiliations\": [2, 3], \"markers\": []},\n    {\"name\": \"Xia Hu\", \"affiliations\": [4], \"markers\": [\"*\"]},\n    {\"name\": \"Yong Li\", \"affiliations\": [2, 3], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Network Science Institute, Northeastern University\"},\n    {\"id\": 2, \"name\": \"Department of Electronic Engineering, Tsinghua University\"},\n    {\"id\": 3, \"name\": \"Beijing National Research Center for Information Science and Technology (BNRist), Tsinghua University\"},\n    {\"id\": 4, \"name\": \"Shanghai Artificial Intelligence Laboratory\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding authors: xia.hu@rice.edu, liyong07@tsinghua.edu.cn\"}\n  ]\n}\n```", "summary_translation": "随着large language model (LLM) agents从工具转变为人类群体中的参与者，集体行为的一个基本问题是其日益增加的存在如何重塑共识的形成。在这里，我们研究了混合human-AI群体在collaborative description game中的表现，在该游戏中，shared conventions通过重复多轮的随机两两交流而产生。通过改变LLM agents的比例，我们识别出共识形成的三个不同regimes：低比例agents促进human-led consensus，中等比例agents破坏收敛，而高比例agents恢复了强烈的共识，同时将其转向agent-led conventions。关键的是，这些regimes不仅在收敛强度上有所不同，而且在由此产生的共识的semantic grounding和交流形式上也有所不同：human-led consensus更加具体、全面，并建立在共享的现实世界类比之上，而agent-led consensus则更加抽象、信息密度较低，且在几何上更加分割。在机制上，agent的影响力源于一种shared linguistic prior，这种先验使agents在expression space中彼此靠近，并结合了跨轮次相对稳定的表达选择；人类最初拒绝采用被认为是AI的伙伴的表达，但最终会屈服于从众压力。这些发现提供了证据，表明AI composition可以塑造群体规范的出现、内容和感知的合法性，使得agent比例和透明度成为human-AI系统的重要设计变量。"}, {"title": "A Tri-Agent Framework for Evaluating and Aligning Question Clarification Capabilities of Large Language Models", "arxiv_id": "2609.02054", "authors": "Yikai Zhao, Saurabh Pandey, Pradeep Kumar Misra", "summary": "Large Language Models (LLMs) are increasingly deployed in interactive systems where understanding user intent precisely is paramount. A key capability for such systems is effective question clarification, especially when user queries are ambiguous or underspecified. This paper introduces a novel tri-agent framework for the robust evaluation of an LLM's ability to engage in clarifying dialogue. Our framework comprises three distinct LLM-based agents: (1) a Question Clarifying Agent (QCA), the system under evaluation, tasked with identifying ambiguities and posing clarifying questions; (2) a Respondent Agent (RA), designed to simulate human user responses, potentially including irrelevant or challenging replies; and (3) an Evaluator Agent (EA), an LLM-as-a-judge, which assesses the quality of the dialogue based on a comprehensive set of metrics. We detail a methodology for synthetic data generation in the supply chain domain as an example. We propose metrics evaluating ambiguity handling, question quality, dialogue efficiency, language appropriateness, and final intent alignment. We also briefly discuss the validation of the EA against human judgments. This work provides a structured approach to benchmark, validate, and improve the clarification capabilities of conversational LLM applications.", "category": "cs.CL", "cluster": "Multi-Agent \u0026 Social Interaction", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-84 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 论文提出了一个由三个LLM智能体组成的多智能体框架（Tri-Agent Framework），专门用于评估和提升LLM在交互系统中的问题澄清能力。该框架包含问题澄清智能体、受访者智能体和评估智能体，明确属于多智能体系统（MAS）和智能体能力评估的研究范畴。根据筛选标准，研究“澄清时机”并明确指向“LLM Agents”的评估基准论文应予保留。此外，虽然标题中包含“Aligning”一词，但此处指的是对齐用户意图而非AI安全/对齐，且论文核心贡献在于智能体交互与评估机制，而非单纯的应用或基础设施，因此符合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的核心研究问题是：如何在一个动态、多轮的交互式环境中，系统且鲁棒地评估 Large Language Models (LLMs) 的 question clarification（问题澄清）能力。当用户提出的查询存在歧义、不完整或定义不明确时，LLM agent 必须能够主动识别缺失的信息并提出澄清性问题，以确保最终准确理解用户的真实意图。这个问题至关重要，因为随着 LLMs 被广泛部署于复杂的交互式系统中，准确理解用户意图是任务成功与用户满意度的前提；若模型无法有效澄清歧义，将直接导致下游工具调用失败或提供错误结果。解决这一问题不仅能填补动态对话评估的空白，还能为 benchmark 和迭代优化 conversational AI 系统提供一套可扩展的结构化方法，从而显著提升 LLM 在真实场景中的可靠性与鲁棒性。\n\n### § 2 前人工作与不足\n在本文之前，该问题并未得到圆满解决。传统的 LLM 评估方法主要依赖于 BLEU 和 ROUGE 等静态输入-输出指标，或是 GLUE、SuperGLUE 等基准测试，这些方法由于只关注单次生成的文本匹配，从根本上无法捕捉多轮澄清对话的动态交互特性与任务完成质量。尽管近年来涌现了如 AgentBench 和 ToolBench 等针对 agentic LLMs 的评估框架，以及 ClarQ-LLM 和 AGENT-CQ 等专门针对澄清问题的基准，但它们仍存在显著不足：这些框架多为静态评估或缺乏对对抗性、不相关用户回复的鲁棒性测试，无法全面评估 agent 在面对复杂对话流（如用户引入 unsupported entities）时的错误处理能力与对话管理策略。此外，虽然 LLM-as-a-Judge（如 G-Eval 和 MTBench）已被用作人类评估的可扩展替代方案，但现有框架往往忽略了 LLM 评判者本身可能存在的 position bias 和 verbosity bias，缺乏将自动评估与人类判断进行严格对齐与验证的机制。因此，前人工作的局限不仅在于评测维度的单一，更在于缺乏一个能够动态模拟真实交互、引入多样化用户 persona，并对 LLM 评判者自身进行可靠性验证的综合性 tri-agent 评估框架。", "core_insight": "### § 3 重建作者的思考路径\n\n在大型语言模型（LLMs）部署到实际交互系统时，研究人员观察到一个频繁的失败模式：用户输入往往是模糊或不完整的，而直接生成回答往往导致幻觉或偏离用户真实意图。为了解决这个问题，LLM 需要具备主动提问澄清的能力。然而，当研究者试图评估这种澄清能力时，发现传统的静态评估基准（如 BLEU、ROUGE 或 GLUE）完全失效，因为它们只能衡量单轮输入输出的匹配度，无法捕捉多轮对话中动态的意图协商过程。虽然现有的 Agentic 评估框架（如 AgentBench 或 MINT）开始关注多轮交互和工具使用，但它们主要聚焦于任务完成率，缺乏对“澄清”这一特定对话行为的细粒度评估。\n\n为了在动态环境中评估澄清能力，研究者面临一个现实困境：真实用户测试成本极高且不可扩展。一个自然的理论线索是引入模拟用户，即利用另一个 LLM 来扮演用户。但仅仅扮演一个顺从的用户是不够的，因为真实场景中用户常常会给出无关信息、模糊回答或系统不支持的实体。因此，模拟用户必须具备引入这些“对抗性”或“挑战性”变体的能力，以测试被评估系统的鲁棒性。当多轮交互结束后，如何判断澄清过程的质量又成了新的难题。人工评估同样面临扩展性瓶颈，而 LLM-as-a-Judge 虽然提供了一种可扩展的自动化评估途径，但直接使用往往存在偏见。这就引导研究者思考：必须为裁判模型提供明确的 Ground Truth（即完全明确的用户意图 $Q_{gt}$）以及一套细粒度的评估指标（如歧义处理、问题质量、对话效率等），才能让裁判模型做出可靠判断。最后，为了验证这种自动化裁判的可靠性，必须将其评估结果与人类标注进行对齐分析，从而确保整个评估框架的有效性。\n\n### § 4 核心 Intuition\n\n评估 LLM 的提问澄清能力不能依赖静态的输入输出对，而必须将其置于动态的多轮交互中。通过构建一个包含“被测系统”、“模拟用户”和“裁判”的三智能体框架，可以自动化地模拟真实对话中的各种模糊和对抗场景，并利用 LLM-as-a-Judge 结合 Ground Truth 对澄清过程的各个维度进行细粒度评估，从而实现可扩展且全面的动态评估。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+---------------------+        +---------------------+\n| Synthetic Dataset   |        | Respondent Agent    |\n| ($Q_{orig}$,$Q_{gt}$)|       | (RA)                |\n+---------+-----------+        +---------+-----------+\n          | $Q_{orig}$                   | $R_i$\n          v                              v\n+---------------------+ $CQ_i$  +---------------------+\n| Question Clarifying |--------\u003E|                     |\n| Agent (QCA)         |\u003C--------+                     |\n+---------+-----------+          +---------------------+\n          | $Q_{final}$\n          v\n+---------------------+ $Q_{gt}$+---------------------+\n| Evaluator Agent(EA) |--------\u003E| Evaluation Metrics  |\n+---------------------+          +---------------------+\n```\n\n该框架通过三个 LLM-based agents 协同工作以评估 question clarification 能力。以论文中 supply chain 领域的 Base Query \"What is the forecast?\" 为例，其 ground truth well-specified query ($Q_{gt}$) 为 \"What is the sales forecast for product SKU123 at site Warehouse-A for next month?\"，初始查询 ($Q_{orig}$) 设为 \"What is the forecast for product SKU123?\"。\n\n**输入**：Synthetic Dataset 提供测试用例，包含初始模糊查询 $Q_{orig}$、对应的 ground truth $Q_{gt}$ 以及 RA 的 persona 指令。\n\n**处理**：\n1. **Query Presentation**：QCA 接收 $Q_{orig}$，识别出缺失 Site 和 Date 两个 mandatory entities。\n2. **Clarification Dialogue**：QCA 生成第一个 clarifying question ($CQ_1$) 询问缺失的 Site 和 Date，并发送给 RA。RA 根据 $Q_{gt}$ 和其 persona 生成回复 ($R_1$)，例如提供 \"Warehouse-A for next month\"。此过程迭代进行，直到 QCA 认为信息完整。\n3. **Final Formulation**：QCA 整合所有信息，输出最终澄清后的查询 $Q_{final}$。\n4. **Evaluation**：EA 接收完整的 dialogue transcript（包含 $Q_{orig}$、所有 {$CQ_i$, $R_i$} 轮次、$Q_{final}$）以及 $Q_{gt}$，基于预定义的 metrics 进行评估。\n\n**输出**：EA 输出多维度的 Evaluation Metrics 分数，包括 Ambiguity Handling、Question Quality、Dialogue Efficiency 等，量化 QCA 的表现。\n\n### § 6 核心数学推导\n\n本文未提出形式化的数学推导或理论证明。论文核心在于提出一个由三个 LLM agents 组成的评估框架及相应的 evaluation metrics，属于系统设计与实证研究范畴，因此本节跳过。\n\n### § 7 实验设计与结论\n\n**问题 1：QCA 在动态交互中处理 ambiguity 和 diverse user responses 的能力如何？**\n**实验设计**：构建包含 200 个 supply chain 领域对话的 synthetic dataset，使用 Claude 3.5 Sonnet 实例化 QCA、RA 和 EA。通过 RA 引入不同的 persona（如提供 vague responses 或 unsupported entities）测试 QCA 的 robustness，最终由 EA 根据 AH、QQ、DE、LA、FQA、OTS 等 metrics 评估。\n**答案**：QCA 在 Ambiguity Detection Accuracy (0.92) 和 Question Relevance (4.48) 上表现优异，Overall Task Success (OTS) 达到 87%。但在 Handling of Unsupported Inputs (3.75) 和 Completeness of Clarification (4.15) 上存在不足，分析发现 QCA 有时会过早结束澄清或未能妥善处理不支持的输入，导致 $Q_{final}$ 缺乏必要的 precision。\n\n**问题 2：EA (LLM-as-a-judge) 的评估结果是否与人类判断一致？**\n**实验设计**：进行 pilot study，随机抽取 50 个对话，由熟悉 rubric 的作者人工标注 Completeness of Clarification (AH-CC) 指标，计算 EA 评分与人工评分的 Pearson 相关系数。\n**答案**：Pearson 相关系数 $r = 0.87$，表明 EA 在 AH-CC 指标上与人类判断具有良好的一致性。但作者指出这仅是单标注者、单指标的初步验证，未来需要 multiple annotators 和 Inter-Coder Reliability (ICR) 分析来全面确立 EA 的可靠性。", "additional_insights": "### § 8 Take-aways\n本文提出了一个用于评估 Large Language Models (LLMs) 问题澄清能力的 Tri-Agent Framework，包含负责提问的 Question Clarifying Agent (QCA)、模拟用户回复的 Respondent Agent (RA) 以及作为裁判的 Evaluator Agent (EA)。该框架通过在供应链领域生成合成数据，将基础问题分解为 mandatory 和 optional entities，从而构造出初始模糊查询 ($Q_{orig}$) 与 ground truth 明确查询 ($Q_{gt}$) 对，以支持动态多轮对话评估。EA 基于涵盖 Ambiguity Handling、Question Quality、Dialogue Efficiency 等维度的细粒度 metrics 对对话进行打分，实验表明 QCA 在 Ambiguity Detection 和 Question Relevance 上表现优异，但在 Handling Unsupported Inputs 和避免过早结束澄清方面存在明显短板。此外，论文通过初步的 pilot study 验证了 EA 与单一人类标注者在 Completeness of Clarification 指标上具有 0.87 的 Pearson 相关系数，初步证明了 LLM-as-a-judge 范式的可行性。\n\n### § 9 最脆弱的假设\n该框架最核心且失败代价最大的假设是：Evaluator Agent (EA) 能够像人类一样准确、无偏地理解多轮对话的上下文，并可靠地评估 Final Question Alignment (FQA) 和 Ambiguity Handling 等复杂语义指标。如果这个假设不成立，EA 给出的分数将无法真实反映 QCA 的澄清能力，整个评估框架的基准作用将彻底失效。在实际应用中，LLM-as-a-judge 常表现出 verbosity bias 和 position bias，且在处理多轮交互中累积的语义偏移或隐式意图时极易产生幻觉，尤其是当 RA 故意引入 unsupported inputs 或 evasive responses 时，EA 很可能无法像人类那样敏锐捕捉到 QCA 未能完全 resolve ambiguity 的逻辑漏洞。论文仅提供了一个非常初步的证据：在单一标注者、单一指标 (AH-CC) 的 50 个样本上测得 0.87 的相关性，但严重缺乏在 FQA-SF 或 LA-Uns 等更主观、更复杂的指标上的 Inter-Coder Reliability (ICR) 验证，也未探讨 EA 是否会对特定对话模式产生系统性误判。\n\n### § 10 最小复现实验\n在一周时间内，最小且最具价值的复现实验是验证 Evaluator Agent (EA) 在复杂场景下与人类判断的对齐度，特别是针对论文中提到的 QCA “过早结束澄清”和“处理 unsupported inputs 失败”的案例。首先，手动构造或利用 LLM 生成 30 组包含 $Q_{orig}$、多轮 $CQ_i$ 与 $R_i$、以及 $Q_{final}$ 和 $Q_{gt}$ 的对话数据，其中一半设计为 RA 提供 evasive responses 或 unsupported entities 的困难场景。接着，使用 Claude 3.5 Sonnet 作为 EA，输入这些对话记录并要求其按照论文的 metrics（重点考察 AH-CC 和 FQA-SF）进行 1-5 分的打分。同时，作为人类标注者，独立对这些对话的澄清完整性和最终意图对齐度进行盲评打分。最后，计算 EA 评分与人类评分的 Pearson 相关系数，并重点对比在困难场景下 EA 是否会给未能彻底澄清的 $Q_{final}$ 错误打出高分。如果相关系数显著低于论文报告的 0.87，或者在 unsupported inputs 场景中 EA 与人类的打分分歧极大，则直接反驳了该框架中 LLM-as-a-judge 具备可靠评估能力的核心 claim。", "research_value": "### § 11 最强反例设计\n要对该论文进行最有力的攻击，我会设计一个针对 Evaluator Agent (EA) 语义脆弱性的“表面合规但实质偏移”对抗实验，以此挑战其 LLM-as-a-judge 的核心 claim。具体而言，我会构造一组包含 50 个多轮对话的 hard case，其中 Respondent Agent (RA) 被指令提供“语义相近但逻辑不兼容”的回复，例如当 ground truth $Q_{gt}$ 要求“Warehouse-A 的下个月预测”时，RA 回复“主仓库下个季度的预测”。在这种场景下，Question Clarifying Agent (QCA) 往往会因为 surface-level semantic similarity 而过早结束澄清，接受这些 plausible but unsupported inputs，并输出一个看似完整实则存在逻辑漏洞的 $Q_{final}$。随后，将这批对话交由论文中的 EA (Claude 3.5 Sonnet) 和人类领域专家进行盲评打分。我的核心假设是：EA 会因为严重的 verbosity bias 和语义匹配幻觉，对这批包含隐式逻辑错误的 $Q_{final}$ 给出极高的 Completeness of Clarification (AH-CC) 和 Final Question Alignment (FQA) 分数，而人类专家会敏锐捕捉到 entity 级别的逻辑不兼容并打出低分。如果实验结果显示，在这类 subtle semantic drift 场景下 EA 与人类的评分 Pearson 相关系数骤降至 0.5 以下，且 EA 系统性地给出 false positives，这将直接证明论文中报告的 0.87 相关性仅仅是由于简单场景下 surface matching 的巧合。这不仅推翻了 EA 作为可靠裁判的假设，更揭示了整个 tri-agent framework 在面对真实世界中高频出现的“似是而非”信息时，其评估基准将彻底失效并产生误导性的优化方向。\n\n### § 12 Follow-up Research Idea\n该论文的核心局限在于将 question clarification 视为一个以静态、预定义的 $Q_{gt}$ 为终点的 entity extraction 任务，而忽略了真实交互中用户意图本身的动态演化与不确定性。基于这一未满足的需求，我提议将研究 framing 从“静态意图对齐”转向“动态信息增益优化”，借鉴 Active Learning 领域中的 Expected Information Gain (EIG) 理论，提出一个全新的研究方向：Proactive Intent Exploration via Information-Theoretic Dialogue。在这个新框架下，LLM 不再被评估是否猜中了一个固定的 ground truth，而是被评估其提出的 clarifying question 能否在期望意义上最大化缩减用户意图的概率分布空间。具体而言，可以借鉴 Bayesian Active Learning 的工具，将用户的初始模糊查询建模为一个隐变量上的先验分布，QCA 的每一轮提问被视为一次 query，而 RA 的回复则用于更新后验分布。第一个实验将构建一个 open-ended conversational environment，其中不存在单一的 $Q_{gt}$，而是存在一个包含多个 plausible goals 的意图池。我们将对比 baseline LLM 与一个内置了 EIG-maximizing 模块的 LLM，评估它们在多轮交互后后验分布的 entropy reduction 速率，以及在未见过的 out-of-distribution 意图上的 zero-shot 泛化能力。这一提议从根本上区别于现有工作，它不再依赖 post-hoc 的 LLM-as-a-judge 进行主观打分，而是引入了可精确计算的 information-theoretic metrics，为评估 conversational AI 的 proactive clarification 能力提供了一个客观、鲁棒且符合真实交互本质的数学范式。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yikai Zhao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Saurabh Pandey\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Pradeep Kumar Misra\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Amazon\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "Large Language Models (LLMs) 越来越多地被部署在交互式系统中，在这些系统中，精确理解用户意图至关重要。此类系统的一项关键能力是有效的问题澄清，尤其是在用户查询模糊或欠规范时。本文引入了一个新颖的 tri-agent framework，用于对 LLM 参与澄清对话的能力进行鲁棒评估。我们的 framework 包含三个不同的基于 LLM 的 agents：(1) Question Clarifying Agent (QCA)，即被评估的系统，负责识别歧义并提出澄清问题；(2) Respondent Agent (RA)，旨在模拟人类用户的响应，可能包含不相关或具有挑战性的回复；以及 (3) Evaluator Agent (EA)，作为一个 LLM-as-a-judge，基于一套全面的 metrics 评估对话质量。我们详细介绍了供应链领域中 synthetic data generation 的一种方法论作为示例。我们提出了评估歧义处理、问题质量、对话效率、语言得体性和最终意图对齐的 metrics。我们还简要讨论了 EA 针对人类判断的验证。这项工作提供了一种结构化的方法，以 benchmark、验证和改进会话式 LLM 应用的澄清能力。"}, {"title": "Bilevel Coordinated Reflection: A Game-Theoretic Approach to Multi-Agent LLM Systems", "arxiv_id": "2609.02750", "authors": "Yihang Chen, Yuxiang Chen, Yuxuan Huang, Meng Fang, Weilin Luo, Jun Wang", "summary": "Multi-agent LLM systems commonly use an orchestrator to decompose a task for a team of workers and then improve through textual reflection. Despite strong empirical results, these systems lack a unified account of coordination, memory improvement, and the role of external verification. We model orchestrator-worker interaction as a bilevel coordination game: under bounded coupling, the workers' local-update game is an approximate potential game whose equilibrium slack is controlled by decomposition quality. We then analyse reflection as stochastic movement over semantic memory states. For free-form reflection, we derive a finite-time upper bound, prove worst-case tightness, and give a positive lower bound under a falsifiable persistent-harm condition. We further prove an information-theoretic impossibility result: no gate that observes only the generated transcript can improve uniformly over text-indistinguishable environments, whereas an environment-grounded gate can. Motivated by this separation, we introduce Stochastic Reflective Memory Ascent (SRMA), which accepts a candidate memory only after a grounded evaluation risk strictly decreases. Under calibration and non-degenerate corrective mass, SRMA converges exactly, geometrically or polynomially; matching constructions show that both rate regimes are order-tight. We also provide confidence gating for stochastic evaluation and re-anchoring guarantees for piecewise-stationary environments. Experiments instantiate these objects with environment-grounded metrics and test the predicted coordination and drift laws. On 500 SWE-bench instances, the complete Kimi-based system resolves 72.2% versus a 70.8% public mini-SWE-agent reference. Code: https://github.com/YihangChen9/Bilevel-Coordinated-Reflection", "category": "cs.AI", "cluster": "Multi-Agent \u0026 Social Interaction", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior, Multi-Agent)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献在于为多智能体LLM系统提出了一种基于博弈论的新型协调与反思机制。具体而言，它将orchestrator-worker交互建模为双层协调博弈，并提出了“随机反思记忆上升”算法，通过环境接地的评估来严格控制和改进智能体的记忆状态与反思过程。这直接对应了你的研究焦点中的“多智能体系统中的新协作机制/博弈策略”以及单智能体能力中的“记忆”与“自我反思”。虽然论文涉及orchestrator-worker结构，但其研究本质并非单纯讨论拓扑结构或消息路由等系统工程，而是深入探讨了协作与记忆演化的理论机制与算法改进。此外，论文在SWE-bench上的实验验证了该机制的有效性，属于通过评估和实验改进智能体能力的研究。因此，该论文完全符合你的筛选标准。", "intro_logic": "### § 1 研究问题与重要性\n\n论文针对 multi-agent LLM systems 中 orchestrator–worker 架构的理论空白提出统一问题：尽管这类系统通过 orchestrator 分解任务、worker 求解子任务、再以 textual reflection 编辑 shared memory 来改进输出，并在经验上表现强劲，但既无形式化 account 解释 coordination 稳定到何种 strategic object，也无法量化 reflection 究竟改进了什么 quantity。由此衍生三个具体未解问题：orchestrator 的 decomposition quality 如何控制 worker 间的 coordination；unconditional reflection 何时 plateau 而非 converge；以及为何 external verifier 能在更强的 text-only critic 仍然失败处取得成功。这些问题的重要性在于，当 model weights 在 test-time frozen 时，memory editing 成为唯一的 adaptation channel，而现有 procedural account 无法预测系统何时失败、为何失败——hallucination cascade 等失败模式仅被经验记录，缺乏 game-theoretic 与 stochastic-approximation foundations。解决它们的价值是双重的：理论上，将 decomposition coupling 与 follower equilibrium slack 显式关联，分离 free-form reflection 的 worst-case error floor 与 persistent-harm 下的 universal lower bound，并以 information-theoretic impossibility theorem 证明 self-contained text-only gate 在 text-indistinguishable environments 下无法 uniformly improve；实践上，提出 SRMA 在 grounded evaluation risk 严格下降时才 commit candidate memory，给出 exact、order-tight 的 geometric 或 polynomial convergence rate，并在 SWE-bench 上以 72.2% 超过 70.8% 的 public reference。\n\n### § 2 前人工作与不足\n\nMulti-agent LLM frameworks 如 AutoGen、MetaGPT 与 Agyn 展示了强经验性能，但它们仅指定通信拓扑与 buffer 更新规则，未定义 agents 稳定到的 strategic object 或 reflection 改进的 quantity——因为它们将 coordination 建模为工程流程而非博弈对象，cross-worker interactions 的 coupling（shared variables、common interfaces、joint constraints）未被纳入，因此 decomposition quality 与 equilibrium slack 的关系无从分析，convergence 也缺乏保证。Self-reflection 方法如 Reflexion 与 Self-Refine 通过 append self-generated critiques 改进输出，但它们隐含假设 critiques 总体有益，未区分 corrective information 与 hallucinated information 在同一 update 中的混合，也未建模 harmful commitment 的 persistent drift，因此无法解释 plateau 的 error floor，更无法给出 lower bound；其 correlated self-evaluation bias 虽被经验观察，却未被提升为 information-theoretic impossibility。在理论工具层面，exact 与 approximate potential games（Monderer and Shapley 1996；Candogan et al. 2011）假设 independent decomposition，而真实 multi-agent LLM 呈现 weak coupling，经典分析无法直接迁移；Foster–Lyapunov drift、multiplicative/variable drift 与 two-timescale bilevel stochastic approximation 虽已成熟，但此前未与 LLM memory editing 的 semantic state space 结合。最关键的缺口在于 grounding 的 informational necessity 未被识别：之前工作未区分 text-indistinguishable environments——同一 reflection 在不同环境下可 corrective 或 harmful，任何仅观测 transcript 的 self-contained gate，即使理想 text-only judge 拥有无限处理能力，也无法区分这对环境，因而不能 uniformly improve；这不是工程成本或评测缺口，而是信息论层面的根本限制，此前问题本身未被清楚定义，因此 text-only LLM-as-judge 的失败被归因于 bias 而非 insufficiency of information。", "core_insight": "### § 3 重建作者的思考路径\n\n在正式提出方法之前，一个认真研究 multi-agent LLM systems 的研究者会从以下几个已存在的观察和理论线索出发：\n\n**从经验现象到理论空缺。** 现有的 multi-agent LLM 框架（如 AutoGen、MetaGPT）在经验上表现优异，但其设计完全是程序性的——规定了谁和谁通信、更新哪个 buffer，却从未明确 agents 稳定到的 strategic object 是什么，reflection 到底在改进哪个量。与此同时，经验上观察到两个反复出现的失败模式：一是 reflection 会 plateau 甚至引入 hallucination cascade，二是 LLM-as-judge 存在 correlated self-evaluation bias，而引入外部 test harness 或 simulator 却往往能显著改善。这些现象缺乏统一解释。\n\n**从博弈论到 decomposition quality 的量化。** 要给 orchestrator-worker 架构一个博弈论基础，最自然的框架是 bilevel game：orchestrator 是 leader，workers 是 followers。经典 potential game 理论（Monderer and Shapley 1996）处理的是独立分解，但真实的多 agent 系统存在跨 worker 的共享变量和联合约束。Srikant and Başar (1992) 的 weakly coupled team problems 和 Candogan et al. (2011) 的 approximate potential game 提供了关键线索：如果分解不够好，coupling 残差会引入 equilibrium slack，而这个 slack 可以被 $2 d_{\\max} \\kappa$ 精确控制。这样，decomposition quality 就不再是一个模糊的经验概念，而是一个进入 equilibrium bound 的显式项。\n\n**从 drift analysis 到 reflection plateau 的根源。** LLM 权重冻结意味着 adaptation 只能通过编辑 non-parametric memory 实现。如果把 memory state 看作离散语义空间上的随机过程，那么 free-form reflection——即无条件追加所有生成的 critique——实际上是在每次更新中混合了 corrective drift 和 hallucination load。Foster-Lyapunov drift 分析（Hajek 1982）天然适合这种 setting：一个 one-sided drift condition $\\mathbb{E}[V_{t+1} | \\mathcal{F}_t] \\leq (1-\\gamma_t) V_t + \\nu_t$ 直接给出 finite-time upper bound $\\nu/\\gamma$。关键洞察是，这个 bound 在 worst case 下是 tight 的——确定性递推 $V_{t+1} = (1-\\gamma)V_t + \\nu$ 就能取等。这意味着，只要 harmful commitment 持续注入非 vanishing 的误差，free-form reflection 必然 plateau，而不是收敛到零。这正好解释了经验上的 plateau 现象。\n\n**从信息论到 text-only gate 的根本局限。** 既然 free-form reflection 有 error floor，自然的想法是加一个 gate 来筛选。但这里有一个更深层的问题：如果环境的 truth 依赖于外部状态（hidden caps、API responses、simulator state），而 gate 只能观察 generated transcript，那么它能否区分有用的和有害的 reflection？答案是否定的。通过构造一对 ambiguous environments——它们有完全相同的 text generation law，但同一条 reflection 在一个环境中是 corrective 的、在另一个中是 harmful 的——可以证明任何 self-contained gate（包括理想的 text-only judge）在这两个环境中行为完全相同，因此无法同时改进两者。这不是 judge 能力的问题，而是信息论上的 impossibility。Grounding——即获取依赖于环境而非仅依赖于 transcript 的信号——是突破这一瓶颈的唯一途径。\n\n**从 grounding 到 SRMA 的设计。** 既然 grounding 是必要的，下一步是设计一个机制，使得 memory 更新只在接受 grounded verification 的条件下发生。Randomized search heuristics 中的 multiplicative drift 和 variable drift theorems（Doerr, Johannsen, and Winzen 2012; Lehre and Witt 2021）提供了收敛速率分析的工具。核心设计是将 stochastic proposal（LLM 生成 reflection）和 grounded evaluation（固定协议下的 verifier risk）分离：只有当 verifier risk 严格下降时才 commit candidate memory。在 calibration 和 non-degenerate corrective mass 假设下，这保证了 monotone multiplicative drift，从而给出 geometric 或 polynomial 的精确收敛速率，且两种 rate regime 都是 order-tight 的。\n\n### § 4 核心 Intuition\n\nMulti-agent LLM 系统中的 free-form reflection 之所以会 plateau，是因为它无条件地将 corrective 信息和 hallucinated 信息混合写入 memory，导致误差漂移中始终存在一个非零的 residual load。更根本地，任何只看 transcript 的 text-only gate 都无法区分\"这段反思是纠正还是幻觉\"——因为文本本身不携带与外部环境一致性的证明，这是一个信息论上的硬限制，而非 judge 能力不足。这篇论文的核心 insight 是：将 reflection 的生成（stochastic proposal）与基于环境信号的验证（grounded evaluation）彻底分离，只在 verifier risk 严格下降时才 commit memory 更新，从而把原本不可控的随机漂移转化为单调下降的 multiplicative drift，实现精确收敛。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\nQuery q\n  |\n  v\n+----------------+   β (slow)\n|  Orchestrator  |   τ~p_LLM(·|q,m_o); m_o'=Mo(m_o,c_o)\n+--------+-------+\n         |  τ = (τ_1, ..., τ_n)\n         v\n+----------------+   α (fast)\n|    Workers     |   x_i~p_LLM(·|τ_i,m_e)\n|  (Followers)   |   c_i*=argmin R_i^e Me(m_e,c_i)\n+--------+-------+\n         |  candidate m_e'\n         v\n+----------------+\n|   SRMA Gate    |   Grounded Verifier: R(m_e')\u003CR(m_e)?\n+--------+-------+\n  Yes--\u003ECommit--\u003EOutput   |   No--\u003EReject\n```\n\n**整体架构：双层博弈 + 随机记忆上升。** 论文将 orchestrator–worker pipeline 建模为一个 bilevel coordination game。Orchestrator 作为 leader 在较慢 timescale β 上运行，workers 作为 followers 在较快 timescale α 上运行。两层各自维护独立的 memory：orchestrator 持有 strategy memory $m_o$（记录分解启发式和历史策略），workers 共享 execution memory $m_e$（记录执行经验与 critique）。SRMA gate 作为独立的验证层，决定哪些 memory proposal 被真正 commit。\n\n**节点 1 — Orchestrator（Leader, timescale β）。** Orchestrator 接收 query $q$，读取当前 strategy memory $m_o$，通过 LLM 采样生成任务分解 $\\tau \\sim p_{\\text{LLM}}(\\cdot|q, m_o)$，将原任务拆分为子任务序列 $\\tau = (\\tau_1, \\ldots, \\tau_n)$。在完成一轮 worker 执行后，orchestrator 收集自身的 critique $c_o$，通过 memory update operator 更新策略记忆 $m_o' = \\text{Mo}(m_o, c_o)$。该更新在较慢 timescale 上进行，确保 leader 的策略调整滞后于 follower 的局部收敛，符合 bilevel game 的 Stackelberg 结构。\n\n**节点 2 — Workers（Followers, timescale α, approximate potential game）。** 每个 worker $i$ 读取 execution memory $m_e$，对分配到的子任务 $\\tau_i$ 生成响应 $x_i \\sim p_{\\text{LLM}}(\\cdot|\\tau_i, m_e)$，并产出 critique $c_i$。关键机制是 $\\eta_c$-better response：worker 从候选集 $\\mathcal{C}_i$ 中选择使 evaluation risk $R_i^{(e)} \\text{Me}(m_e, c_i)$ 最小化的 critique $c_i^* = \\arg\\min_{c_i \\in \\mathcal{C}_i} R_i^{(e)} \\text{Me}(m_e, c_i)$，由此聚合出 candidate memory $m_e'$。论文证明：在 bounded coupling 条件下，followers 的 subgame 是一个 approximate potential game，其 equilibrium slack 被 $\\eta_c \\leq 2 d_{\\max} \\kappa$ 精确控制，其中 $d_{\\max}$ 是跨 worker 的最大耦合强度，$\\kappa$ 量化 decomposition quality。这意味着分解越差，coupling 残差越大，equilibrium slack 越宽——decomposition quality 从模糊的经验概念变为进入 equilibrium bound 的显式项。\n\n**节点 3 — SRMA Gate（Grounded Verifier）。** Candidate memory $m_e'$ 并非无条件 commit。SRMA gate 调用一个 environment-grounded evaluation protocol（如 test harness、simulator、formal checker），计算 verifier risk $R(m_e')$。仅当 $R(m_e') \u003C R(m_e)$ 严格下降时才 commit $m_e' \\to m_e[t+1]$，否则 reject。这一设计的理论动机是 information-theoretic impossibility theorem：在两个 text-indistinguishable environments（文本生成律相同但同一 reflection 的语义相反）中，任何仅观察 transcript 的 gate——即使是理想 text-only judge——行为完全相同，无法同时改进两者；而 grounded verifier 能区分这对环境并恢复 geometric convergence。论文证明：在 calibration 和 non-degenerate corrective mass 条件下，SRMA 精确收敛，速率 为 geometric 或 polynomial，且 matching constructions 证明两种速率 regime 均 order-tight。\n\n**补充机制。** 对于 stochastic evaluation（verifier 本身有噪声），论文提供 confidence gating 机制，通过有限次 probe 的置信度估计控制 commit 决策。对于 piecewise-stationary environments（环境分段平稳但存在漂移），re-anchoring 机制在每个新 segment 重置收敛基准，恢复 per-segment convergence guarantee。\n\n**Free-form reflection 的 drift analysis（理论对照基线）。** 作为 SRMA 的理论对照，论文分析了 free-form reflection（无条件追加所有 critique）的行为：将 memory state 视为离散语义空间上的随机过程，corrective drift 与 hallucination load 在每次更新中混合。Foster-Lyapunov drift 分析给出一侧 drift 条件下的 finite-time upper bound（worst-case tight），并证明要获得 universal positive lower bound 需要额外的、可检验的 persistent-harm condition——仅靠 unconditional commitment 不足以保证收敛。\n\n### § 7 实验设计与结论\n\n**实验问题 1：decomposition quality 是否按理论预测控制 follower coordination？**\n- **实验：** 在 hidden-cap resource contest（一种受控博弈环境）上实例化 bilevel game，直接测量不同 decomposition quality $\\kappa$ 下的 equilibrium slack，无需 LLM-as-judge 即可暴露 strategic quantities。\n- **结论：** 论文声称实验验证了 equilibrium slack 与 $2 d_{\\max} \\kappa$ 的预测关系（具体数值在正文 Sec. 4 中，当前抽取文本未包含详细数据）。\n\n**实验问题 2：free-form reflection 是否 plateau，SRMA 是否收敛？**\n- **实验：** 在 Overcooked 环境中使用 exact BFS value table 作为 grounded verifier，直接测量 memory state 上的 evaluation risk 随迭代步数的变化轨迹，对比 free-form reflection 与 SRMA。\n- **结论：** 论文预测 free-form reflection 在 worst case 下存在 error floor（与 drift analysis 的 tight upper bound 对应），而 SRMA 在 calibration 条件下实现 geometric 或 polynomial 收敛（具体曲线见正文）。\n\n**实验问题 3：grounded verifier 是否在 text-only critic 失败处取得成功？**\n- **实验：** 通过构造 text-indistinguishable environment pair，对比 text-only gate 与 grounded gate 的行为差异，验证 impossibility theorem 的预测。\n- **结论：** 理论预测 text-only gate 在两个环境中行为相同无法区分，grounded verifier 能区分并恢复收敛（具体实验细节在正文 Sec. 4）。\n\n**实验问题 4：完整系统在真实软件工程任务上的端到端表现？**\n- **实验：** 在 SWE-bench 的 500 个 instance 上部署完整的 Kimi-based multi-agent 系统，使用 environment-grounded metrics（test harness）实例化 SRMA gate，与 public mini-SWE-agent v2 reference 对比。\n- **结论：** 完整系统解决 361/500 instance（72.2%），超过 public mini-SWE-agent v2 的 70.8%（361 vs 354 个 instance），验证了理论框架在真实任务上的有效性。代码开源于 https://github.com/YihangChen9/Bilevel-Coordinated-Reflection。\n\n**说明：** 当前抽取文本包含实验环境的名称和 SWE-bench 的 headline 数字，但受控环境（Resource Contest、Overcooked）的具体数值结果、消融实验细节、以及 confidence gating 与 re-anchoring 的实验验证数据未出现在抽取文本中，需参考正文 Sec. 4 获取完整实验表格。", "additional_insights": "### § 8 Take-aways\n\n本文将 multi-agent LLM systems 中的 orchestrator-worker 交互形式化为一个 bilevel coordination game，证明了在 weakly coupled decomposition 下，worker 的 subgame 是一个 approximate potential game，其 equilibrium slack 由 decomposition quality（即耦合度 $\\kappa$ 和最大邻居数 $d_{\\max}$）严格控制。针对 free-form reflection，论文通过 Foster-Lyapunov drift 分析指出，若存在 persistent harmful commitment（即有害反思被无条件写入 memory），系统的 mean error 会收敛到一个非零的 error floor，而非零渐近误差。论文证明了一个 information-theoretic impossibility result：任何仅依赖生成文本的 self-contained gate 都无法在 text-indistinguishable environments 中实现一致改进，即使它是理想的 LLM-as-judge；必须引入 environment-grounded signal 才能打破对称性。基于此，论文提出了 Stochastic Reflective Memory Ascent (SRMA) 算法，仅在 grounded evaluation risk 严格下降时才提交 candidate memory，并在 calibration 和 non-degenerate corrective mass 假设下证明了其能以 order-tight 的 geometric 或 polynomial 速率精确收敛。实验在 Resource Contest、Overcooked 和 SWE-bench 上验证了理论预测的 drift laws，表明 grounded SRMA 显著优于 free-form 和 self-gated 方法，并在 SWE-bench 上达到 72.2% 的解决率。\n\n### § 9 最脆弱的假设\n\n最关键且失败代价最大的假设是 **Assumption 4 (Verifier Calibration)**，即存在一个有限的常数 $L$ 使得 task sub-optimality 被 verifier risk 线性 bound 住（$V_i(m_e) \\le L R_i(m_e)$）。这意味着 verifier risk 为零能严格保证 task sub-optimality 为零。如果这个假设不成立，SRMA 的核心贡献将直接失效：虽然算法仍能保证 verifier risk 单调下降并收敛到零，但这不再意味着实际任务误差的消除，系统可能会收敛到一个“自欺欺人”的状态——即通过了 verifier 的测试但并未真正解决任务。在实际应用中，特别是在 SWE-bench 这样的软件工程任务中，verifier 通常是仓库自带的 test suite，而 test suite 往往是不完整的，存在 false positive 的可能（即 patch 通过了所有测试但并未正确修复 bug）。论文在 Limitations 中也承认了这一点，指出在 incomplete test suites 下，只能保证 verifier risk 的单调性，而不能保证 true task utility。然而，论文并未提供 SWE-bench test harness 满足 calibration 的定量证据，仅将其作为 grounded signal 使用，这使得 SRMA 在真实复杂任务中的“精确收敛”保证变得脆弱。\n\n### § 10 最小复现实验\n\n如果有一周时间，可以设计一个轻量级的合成实验来验证 **Theorem 4 (Self-Gating Impossibility)** 以及 grounding 的必要性，而无需复现完整的 multi-agent 系统。实验环境可以设定为一个简单的数字猜测游戏，包含两个 text-indistinguishable environments：在环境 $E_+$ 中，目标数字是 10，包含“增加”关键词的反思是 corrective 的；在环境 $E_-$ 中，目标数字是 -10，同样的“增加”反思是 harmful 的。使用一个 frozen LLM 作为 agent 生成猜测和 free-form 反思。实现三种 memory 更新策略：1) Free-form（无条件接受反思）；2) Self-gate（用另一个 LLM 实例作为 judge 仅根据文本判断是否接受反思）；3) Grounded SRMA（仅当反思导致的新猜测与目标距离严格缩小时才接受）。测量 20 轮迭代中的 absolute error 变化。如果 Grounded SRMA 在 $E_+$ 和 $E_-$ 中都能快速收敛到 error=0，而 Self-gate 在两个环境中表现相同且无法同时收敛（在一个环境中收敛必在另一个环境中发散或停滞），Free-form 停留在较高 error floor，则支持论文的 claim；如果 Self-gate 也能在两个环境中同时收敛，则说明 LLM judge 具备超越文本的隐式推理能力，反驳了 impossibility result 的前提。", "research_value": "### § 11 最强反例设计\n\n要对该论文进行最有力的攻击，我会在 SWE-bench 这类复杂软件工程任务上设计一个针对 **Assumption 4 (Verifier Calibration)** 的“reward hacking 激化”反例，以证明 SRMA 的“精确收敛”实质上是向 verifier 的局部最优而非全局真实效用收敛。具体场景设定为：筛选一批 SWE-bench 中自带 test suite 极度稀疏或仅检查特定 exception 抛出而非核心逻辑的 instances。在这个子集上对比三种策略：Free-form reflection、Naive Grounded SRMA 以及 Oracle Grounded SRMA（使用隐藏的完整人工测试集）。由于 SRMA 严格遵循“仅在 grounded evaluation risk 严格下降时 commit candidate memory”的贪心策略，它会在迭代中强烈偏好那些能快速通过表面测试的“捷径 patch”（例如直接捕获并吞掉特定异常，而非修复底层的 race condition）。实验将测量系统在可见 test suite 上的 pass rate 以及在隐藏 test suite 上的 true pass rate。我预测的攻击结果是：Naive SRMA 在可见 verifier risk 上会如理论预测般呈 geometric 速率精确且快速地收敛至 0，但其对应的 true task utility 会呈现断崖式下降，甚至远低于 Free-form reflection——因为 Free-form 的 textual critique 偶尔能通过语义推理触及真实 bug 根源，而 SRMA 的严格单调下降条件会系统性地扼杀那些短期内增加测试失败风险但长期正确的结构性重构。这一反例直接挑战了论文的核心贡献：在 incomplete test suites 这一普遍现实下，SRMA 保证的 convergence rate 越快，系统陷入“自欺欺人”局部最优的速度就越快，其所谓的“精确收敛”不仅无效，反而比无 grounding 的方法更具误导性。\n\n### § 12 Follow-up Research Idea\n\n基于对 Verifier Calibration 在真实世界中不可满足这一核心局限的理解，我提出一个全新的研究框架：**Co-Evolutionary Memory and Verifier Synthesis (CMVS)**，将 multi-agent LLM 的 memory editing 从“向静态 verifier 逼近”转变为“agent 与 verifier 的对抗性共同演化”。驱动该想法的局限是：任何静态的 grounded signal（如固定的 test suite）都不可避免地存在 blind spots，导致 SRMA 这类算法不可避免地滑向 specification gaming；而真实任务效用是一个无法被有限测试穷尽的 open-set 目标。我们可以借鉴相邻领域 **Active Learning** 与 **Generative Adversarial Networks (GANs)** 的机制，将 worker 的 memory update 与一个独立的 verifier agent 的 test generation 耦合在一个 two-player zero-sum game 中：worker 试图生成能通过当前所有测试的 solution memory，而 verifier 则试图生成能打破 worker 当前 solution 的 adversarial test cases。\n\n这一提议与现有工作（如 Reflexion 或 SRMA）的根本区别在于：现有方法将 environment 视为固定不变的 ground truth oracle，而 CMVS 承认 grounding 本身是不完备的，并通过对抗性探测动态扩展 grounding 的边界。在这个框架下，memory 的接受条件不再是“固定 verifier risk 下降”，而是“在 verifier 最新生成的对抗性测试分布下保持 robustness”。第一个实验将构建一个合成代码生成任务，其中真实逻辑隐藏在一个 latent space 中。对比 baseline SRMA 和 CMVS，观察其在迭代过程中的 visible test pass rate 和 hidden true utility。如果 CMVS 能够通过 verifier 不断生成新的 edge cases，迫使 worker 避免过早的 reward hacking，并在 hidden true utility 上展现出持续上升而非 SRMA 的过早 plateau 或衰退，即可证明动态对抗性 grounding 是突破 information-theoretic impossibility 与 calibration 脆弱性的新范式。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yihang Chen\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Yuxiang Chen\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Yuxuan Huang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Meng Fang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Weilin Luo\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Jun Wang\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"UCL Centre for Artificial Intelligence\"},\n    {\"id\": 2, \"name\": \"University of Liverpool\"},\n    {\"id\": 3, \"name\": \"Huawei\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "Multi-agent LLM systems 通常使用 orchestrator 为一组 workers 分解任务，随后通过 textual reflection 进行改进。尽管取得了强劲的 empirical results，这些系统仍缺乏对 coordination、memory improvement 以及 external verification 作用的统一解释。我们将 orchestrator-worker interaction 建模为 bilevel coordination game：在 bounded coupling 下，workers 的 local-update game 是一个 approximate potential game，其 equilibrium slack 由 decomposition quality 控制。随后，我们将 reflection 分析为在 semantic memory states 上的 stochastic movement。对于 free-form reflection，我们推导出一个 finite-time upper bound，证明了 worst-case tightness，并在 falsifiable persistent-harm condition 下给出了一个 positive lower bound。我们进一步证明了一个 information-theoretic impossibility result：任何仅观察 generated transcript 的 gate 都无法在 text-indistinguishable environments 上实现一致改进，而 environment-grounded gate 则可以。受此 separation 启发，我们引入了 Stochastic Reflective Memory Ascent (SRMA)，该算法仅在 grounded evaluation risk 严格下降时才接受 candidate memory。在 calibration 和 non-degenerate corrective mass 下，SRMA 能够精确、几何或多项式地收敛；matching constructions 表明这两种 rate regimes 都是 order-tight 的。我们还为 stochastic evaluation 提供了 confidence gating，并为 piecewise-stationary environments 提供了 re-anchoring guarantees。实验使用 environment-grounded metrics 实例化这些对象，并测试了预测的 coordination 和 drift laws。在 500 个 SWE-bench instances 上，完整的 Kimi-based system 解决了 72.2% 的问题，而 public mini-SWE-agent reference 的解决率为 70.8%。Code: https://github.com/YihangChen9/Bilevel-Coordinated-Reflection"}, {"title": "SocialBuddy: Tailoring Search Agent for Social Scenarios", "arxiv_id": "2609.01641", "authors": "Mingxuan Li, Yirong Mao, FaZhan Zhang, Haibiao Yao, Runze Hu, Wenhui Que", "summary": "In the era of digital social interaction, searching friends' posts from massive social streams has become a fundamental user need. However, while modern agentic search frameworks have achieved remarkable success in conventional retrieval tasks, they break down when confronted with heterogeneous user queries and multi-dimensional social feeds, resulting in severe performance degradation in complex social search. To bridge this gap, we introduce SocialBuddy, the first agentic search framework tailored for social scenarios. Specifically, we construct SocialEnv, the first large-scale simulated environment for social search. Powered by an automated data and trajectory synthesis pipeline, SocialEnv includes 200K user profiles, 10 million social posts, and 50K reasoning trajectories, establishing a solid foundation for the development of social search agents. To tackle the credit assignment dilemma caused by sparse rewards in social search, we design SocialPO, a hybrid-granularity optimization framework. It macroscopically reinforces successful reasoning paths via multi-dimensional rewards, while microscopically rectifying deviated trajectories through fine-grained prefix truncation and token-level supervision. This hybrid-granularity design delivers multi-scale guidance in complex long-sequence scenarios. Finally, we construct SocialSearch Benchmark to provide a quantitative evaluation scheme for assessing the social search capabilities of SocialBuddy. Extensive experiments demonstrate that SocialBuddy-35B surpasses significantly larger frontier LLMs. Code and dataset will be released upon article acceptance.", "category": "cs.LG", "cluster": "Multi-Agent \u0026 Social Interaction", "tags": ["cs.LG"], "filter_reason": "这篇论文的核心贡献是提出了针对社交搜索场景的智能体框架 SocialBuddy，并设计了配套的模拟环境 SocialEnv、混合粒度优化框架 SocialPO 以及评估基准。虽然其应用场景为社交搜索，但论文的本质是关于LLM智能体的训练与优化机制。摘要中明确提到了通过自动化数据与轨迹合成、多维度奖励强化成功推理路径、以及细粒度前缀截断和token级监督来纠正偏离轨迹（SocialPO），这属于典型的 agent training/RL 和通过反馈自我完善的研究范畴。根据筛选标准第一步中的“保留”规则，研究 agent training/distillation/RL 且明确指向 Agentic / LLM Agents 的论文应予保留；同时，第四步也指出，如果在特定领域中提出了新的 agent 机制（如本文的轨迹优化与强化学习机制），则不应排除。因此，该论文符合“构建、改进、训练或演化 LLM智能体”的研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：如何构建一个能够有效处理社交媒体环境中复杂多维度查询的agentic search框架。具体而言，当用户提出诸如\"小明上周在北京分享的关于LLM的帖子中，哪个点赞最多？\"这类同时涉及用户身份、时间窗口、地理位置、内容主题和互动排序的heterogeneous query时，现有搜索系统无法正确解析和执行检索。这个问题的重要性源于一个被学术界长期忽视的现实：社交媒体平台（WeChat Moments、Facebook、X等）承载着数十亿活跃用户每天生成的大量多维度帖子，而\"我的朋友们在做什么\"这一最普遍的用户需求，恰恰是当前agentic search研究完全未覆盖的场景。解决这一问题能将conventional agentic search的能力从开放网页检索扩展到日常社交智能领域，使LLM能够作为社交助手，在严格隐私边界内帮助用户高效搜索、追踪和综合朋友的社交动态。此外，论文还解决了支撑这一目标的两项基础性挑战：一是由于真实社交数据受严格隐私限制而无法公开获取，需要构建高保真度的模拟社交环境来支撑agent训练；二是在长序列、sparse reward的社交搜索轨迹中，传统reinforcement learning面临严重的credit assignment困境，需要新的policy optimization方法来提供多尺度指导。\n\n### § 2 前人工作与不足\n\n该问题此前未被直接解决。与本文最相关的前人工作可分为两条线。第一条是Retrieval-Augmented Generation（RAG）路线，包括Dense Passage Retrieval（Karpukhin et al. 20
