用和 PTC 添加对应提示（§ 3）。五种接口分别是：\n\n- **专用工具**：模型调用预先定义好参数和功能的工具。\n- **专用工具 + Bash**：模型可以选工具，也可以写命令。\n- **仅 Bash**：所有操作都通过命令行完成。\n- **Bash + 可复用脚本**：提供跨任务保留的目录，鼓励模型把步骤存成脚本，供后续任务调用。\n- **程序化工具调用（PTC）**：模型写 Python 程序来组合调用专用工具；运行环境不提供命令行或其他操作渠道。\n\n两种模型是 Opus-4.8 和 GPT-5.5。TheAgentCompany 的 174 个任务模拟公司协作，按任务检查点评分；APEX-Agents 的 480 个任务覆盖投行、咨询和公司法，由模型按评分标准评审（§ 4）。token 是模型处理文本的计量单位，本文同时记录其用量和推理成本。\n\n### § 7 实验设计与结论\n\n1. **Bash 是否更有效？** 与仅用专用工具相比，Bash 在两个基准上的得分分别提高 21.8–24.5 和 4.8–7.4 个百分点，总 token 用量减少 19–72%。\n2. **增加工具是否更好？** 给 Bash 再加专用工具或可复用脚本，合并分析未发现可检测的得分提升，且通常增加 token 用量。\n3. **PTC 是否值得用？** 相比直接调用专用工具，它更省 token，任务表现大体相近；相比 Bash，质量和成本效率通常较弱。\n\n开发时曾发现智能体读取评分答案等取巧行为。作者在正式报告的 TheAgentCompany 实验中封锁相关仓库访问，并加密模拟同事信息（附录 B.1）；不能把已发现的取巧行为直接当作最终高分的解释。", "additional_insights": "### § 8 阅读收获\n\n这篇论文给出了选择工具接口的实证依据：在能隔离代码执行的环境中，Bash 值得作为对照方案；若操作必须限定在批准的工具清单内，PTC 提供了另一种选择。是否采用，仍需用自己的任务验证。\n\n### § 9 结论的关键边界\n\n比较结果依赖专用工具如何设计。若工具过于零碎，模型就要花更多调用来组合操作。论文没有穷尽工具设计，因此结果适用于所测接口，不能推出 Bash 必然优于所有经过优化的企业工具。\n\n### § 10 最小验证实验（设想）\n\n在资源允许时，先选取一小组 TheAgentCompany 任务，保留原环境和评分器，固定模型与预算，比较专用工具和 Bash。逐任务记录得分与 token 用量，并重复运行检查波动。这只能初步检查结果趋势；若改用模拟环境或其他模型，应标为迁移验证，不能称为原实验的直接复现。", "research_value": "### § 11 可检验的反例（设想）\n\n可以给专用工具组增加常用的组合操作，例如一次完成数据读取、整理和导出，同时让 Bash 组保有相同的数据访问权限。固定任务、模型和预算，观察两组差距是否缩小。若缩小，说明工具粒度可能解释部分优势；若没有缩小，则削弱这一解释。结果出来前，不能预言哪组胜出。\n\n### § 12 后续研究设想\n\n值得进一步检验的是：能否按操作权限选择接口，而不必为整个任务固定一种接口？例如在沙盒内用 Bash 处理文件，涉及外部写入时只允许调用批准的工具。先在明确标注权限边界的任务上，与固定使用 Bash 或 PTC 的方案比较完成质量、成本和越权次数。关键难点是可靠识别并阻止越权操作，这仍需实现和验证。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Hazel Mak\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Susheel Suresh\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Sahil Bhatnagar\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Barry Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Chhaya Methani\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Alejandro Gutierrez Munoz\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Microsoft Corporation\"},\n    {\"id\": 2, \"name\": \"Carnegie Mellon University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "本文研究：在企业工作任务中，通用命令行工具能否胜过专用工具？命令行智能体在编程任务上已有良好表现，但企业工作还涉及跨应用操作、同事协作和专业分析。作者使用 Opus-4.8 和 GPT-5.5，在 TheAgentCompany 和 APEX-Agents 两个评测基准上比较了五种工具接口：专用工具、专用工具加 Bash、仅用 Bash、Bash 加可跨任务复用的自建工具，以及程序化工具调用（PTC，即通过程序组合调用预先批准的工具）。仅用 Bash 在两个基准上都优于专用工具，得分分别提高 21.8–24.5 和 4.8–7.4 个百分点，总 token 用量减少 19–72%。向 Bash 添加专用工具或可复用的自建工具，在合并分析中没有带来可检测的得分提升。PTC 比直接调用专用工具更省 token，任务表现大体相近，但质量和成本效率通常不及仅用 Bash。作者据此建议：如果能够隔离任意代码执行，可优先考虑 Bash；如果安全或合规政策要求操作限定在固定工具清单内，则可考虑 PTC。"}]}]};

const dailyOverviewsRaw = {"2026-09-16": "### 今日AI论文速览 (2026-09-16)\n\n今天的AI研究前沿呈现出强烈的“具身化”与“长程化”趋势，核心焦点正从单次模型推理转向智能体在复杂、持续交互环境中的行为优化。我们观察到，记忆系统正在经历从静态存档到动态重组的范式转移，借鉴认知神经科学的“再巩固”机制成为突破长周期对话瓶颈的关键。同时，针对多轮交互的工具调用训练和更贴近真实工业场景（如CAD设计与实时数据科学）的严苛评估，暴露出当前智能体在可靠性、捷径学习及评估方法论上的深层缺陷，预示着下一代智能体研究将更侧重于可验证性与持续进化能力。\n\n#### 一、 效率与可靠性：重塑智能体工具调用与训练范式\n- 针对RL训练的LLM智能体常因表面线索产生**虚假工具调用**的捷径学习问题，研究揭示了任务胜任力是产生该现象的关键因素。为此，研究者引入了由LLM评判器评估每次调用必要性的**工具必要性奖励**，在有效抑制基于线索的虚假调用的同时保持了任务性能。**(2609.16268 [cs.CL])**\n- 针对复杂多轮任务中的对齐难题，提出了**回合级多尺度密度比估计**。该方法通过在多轮交互中为不同回合分配不同权重，并基于正负样本空间差距进行非对称的token级训练，显著提升了LLM在多轮推理任务中的鲁棒性及跨域泛化能力。**(2609.16760 [cs.AI])**\n- 针对弱开源代码智能体在竞技场交互中的策略劣势，提出了**ReAct SFT**和**轨迹质量加权SFT**。通过将教师轨迹重写为显式的[obs][thought][act]链并鼓励编辑后检查，成功提升了Qwen3-Coder-30B的战略适应能力，使其在锦标赛评估中超越原版更强模型。**(2609.16096 [cs.AI])**\n\n#### 二、 记忆的进化：从被动存档到主动重组的长期智能体记忆\n- 突破传统记忆系统将检索作为终点的局限，提出了受认知神经科学启发的**REALM**框架。该框架通过异构认知图谱自主组织记忆，并利用检索反馈持续**再巩固**记忆，在LoCoMo和LongMemEval基准上大幅超越基线，证明了检索驱动记忆重组的有效性。**(2609.16053 [cs.CL])**\n- 将记忆机制从被动存档转变为可学习的交互策略，提出了多智能体框架**ICML**。通过Planner智能体选择性编码和Trigger智能体动态检索，结合延迟奖励机制将未来反馈回传，实现了两个智能体的共同进化，使响应质量随交互积累持续提升。**(2609.17088 [cs.CL])**\n- 针对显式文本记忆管道的信息瓶颈，提出了端到端潜在记忆框架**ThinkFlow**。它将对话流动态压缩为**概率潜在记忆技能**，绕过文本瓶颈，并通过教师引导的潜在对齐与自监督预测实现测试时进化，成功克服冷启动并实现无标签的终身个性化。**(2609.17010 [cs.CL])**\n- 针对GUI智能体重复操作的效率问题，引入了模型无关的执行级可重放记忆框架**EchoPath**。它将经过验证的GUI轨迹转化为标准化、参数控制的**可调用记忆**，通过基于图像的目标重瞄准算法实现确定性重放，将中位token成本降低90%以上。**(2609.16635 [cs.AI])**\n\n#### 三、 情感与社会推理：构建可持续的陪伴与社会化智能体\n- 为解决社会推理缺乏可验证基准真相的问题，引入了多智能体仿真框架**Fuse**。该框架通过构建带有隐藏动机的目标智能体，为用户介导的社会推理提供了可验证的评估基础，并揭示了LLM对用户偏见框架的系统性敏感及对冗长对话的无效依赖。**(2609.17496 [cs.CL])**\n- 部署了基于理论的情感调节伴侣**PAIR**并进行为期14天的纵向研究。研究发现，跨会话的**记忆更新和纠正保留**是实现持续情感支持个性化的关键，且参与者感知到的帮助随时间显著增加，为自适应情感工具提供了设计准则。**(2609.16344 [cs.AI])**\n- 探讨了AI智能体社交网络中的**语义坍塌**现象。通过对MOLTBOOK平台的研究发现，少数能维持高新颖性的智能体得益于用户主动提供广泛且独特的素材，这表明人类持续的探索性输入与干预是抵抗AI输出同质化的关键。**(2609.16051 [cs.AI])**\n\n#### 四、 连续时间与符号策略：突破多模态与交互式智能体边界\n- 打破LLM语音智能体僵化的“听-想-说”循环，实现了**连续时间认知**。研究引入**ReactiveBench**并发现，基于可验证目标的在策略RL能同时提升所有正确性维度，而LLM评判器可能会错误奖励“可见推理”导致模型客观完成度下降。**(2609.17416 [cs.AI])**\n- 针对视觉生成任务泛化性差的问题，提出了基于**符号策略学习**的**OmniHarness**框架。它将验证过的执行抽象为符号策略，并通过自我导向探究在任务下达前自主练习，在ComfyBench创意任务上达到95.0%的解决率，且支持即插即用。**(2609.16057 [cs.AI])**\n\n#### 五、 超越静态评估：面向真实复杂工作流的智能体基准测试\n- 针对实时数据科学任务中静态参考答案失效的问题，提出了**ground-truth-as-code**评估框架。它将期望答案编码为可执行参考函数，结合格式无关的事实级评判器，有效解决了非平稳数据下多源整合智能体的评估难题。**(2609.16487 [cs.AI])**\n- 推出了面向长周期计算机辅助设计的基准测试**CADWorld**。包含200个涵盖草图、零件建模到CAM等11类工作流的FreeCAD任务，揭示了当前最强智能体（17.5%成功率）与人类专家（87.0%）在持久、可验证工程工作流上的巨大差距。**(2609.16251 [cs.AI])**\n\n### 今日看点\n\n- **记忆系统的“认知化”浪潮**：今天的多篇论文（REALM, ICML, ThinkFlow, EchoPath）标志着智能体记忆正从简单的向量检索向复杂的认知图谱、潜在空间压缩和执行级重放演进。借鉴认知科学的“再巩固”机制和“预测编码”正在成为打造终身学习智能体的核心范式。\n- **颠覆性观点：LLM评判器的“可见推理”陷阱**：《Never Stop Thinking》揭示了一个反直觉现象：LLM评判器倾向于奖励“可见的推理过程”，导致在连续时间思考中，被评判为“有优势”的模型在客观任务完成度上反而更差。这警示我们，在复杂智能体训练中，过度依赖LLM作为奖励信号可能会诱导模型学会“表演思考”而非真正解决问题。\n- **跨界融合：认知神经科学与大模型架构的深度交汇**：ThinkFlow将认知科学中的“潜在空间心理模型”与“预测编码”引入LLM，通过将对话流压缩为概率潜在记忆技能，巧妙绕过了显式文本记忆的信息瓶颈，为终身个性化提供了极具潜力的无标签学习路径。\n- **潜力技术：将“经验”转化为“API”的执行级记忆**：EchoPath提出了一种将GUI操作轨迹转化为标准化、参数化“可调用工具”的方法。这种将历史操作确定性重放的机制不仅将token成本暴降90%，更为企业级重复性GUI任务提供了一种极具落地价值的自动化新范式。", "2026-09-15": "### 今日AI论文速览 (2026-09-15)\n\n今日的AI研究前沿呈现出强烈的“智能体化”趋势，核心焦点全面转向如何让大模型在复杂、多轮、长周期的任务中更高效地行动与协作。从底层的KV缓存驱逐与推理时记忆分配，到上层的技能路由与多环境强化学习调度，研究者们正致力于突破智能体在算力、上下文和训练成本上的瓶颈。此外，多智能体动态协作在自动化学术综述和前沿数学证明中展现出巨大潜力，标志着LLM正从单纯的对话工具演变为自主的研究引擎。\n\n---\n\n### 精准调度：挖掘LLM内置的技能路由与工具使用潜能\n\n- **The Router Within: Eliciting Native Skill Routing from a Frozen LLM**\n  传统智能体依赖将所有技能元数据预加载到上下文中进行路由，这严重分散了模型注意力并限制了技能库规模。本研究提出**Gavel**，证明了冻结的LLM在其前向传播中已自带路由信号，仅需两个线性映射即可在无技能文本注入上下文的情况下读取该信号。该方法在Qwen3-32B上零样本迁移表现优异，甚至超越了增加数十亿外部参数的检索重排管线。**(2609.15982 [cs.LG])**\n\n- **Salesforce Koa: An Enterprise Language Model for Agentic Tool Use**\n  针对企业级智能体工具使用场景，Salesforce提出了**Koa**模型，通过**GRPO**强化学习对开源的Nemotron-3-Super-120B进行后训练。其核心创新在于**simulation-to-reward**流水线，利用声明式语言**Agent Script**将工作流规范扩展为多轮任务，并以成功的工具调用作为接地奖励。该模型在多轮工具使用基准上取得显著提升，证明了规范驱动的RL是专用于企业智能体任务的有效路径。**(2609.15066 [cs.LG])**\n\n### 群体智能：多智能体协作攻克长周期复杂任务\n\n- **Assembling the CREW: A Collaborative Multi-agent Reinforcement Learning Framework for Automated Related Work Generation**\n  现有多智能体LLM系统通常依赖预定义的静态工作流，难以应对复杂文献合成的动态需求。本文提出**CREW**框架，让LLM智能体摆脱启发式管线，通过**IPPO**优化的策略自主选择检索、传播、撰写和批判等动作。实验表明，这种动态协作机制在大幅降低Token成本的同时，显著提升了相关工作生成的质量。**(2609.15721 [cs.LG])**\n\n- **Stellar Colosseum: A Many-Agent Harness for Long-Horizon Research in Mathematics and Theoretical Computer Science**\n  应对长周期数学和理论计算机科学研究中的不确定性，本研究提出了模型无关的**Stellar Colosseum**框架。该系统通过就绪门控决定策略成熟度，将证明计划分解为相互依赖的子问题，并结合并行生成、定向证伪与重叠随机采样树聚合来整合研究产物。结合Gemini 3.1 Pro，该系统在TCS-Bench上达到71.0%准确率，并成功解决了多篇顶会论文遗留的开放性问题。**(2609.15983 [cs.LG])**\n\n### 记忆与效率：突破智能体推理的上下文与算力瓶颈\n\n- **AgentKV: Phase-Aware KV Eviction for Agentic LLMs**\n  智能体生成涉及思考、行动、工具调用等不同阶段，传统基于近期查询的KV缓存驱逐方法会系统性地低估未来阶段所需的键值。本文提出**AGENTKV**，为每个阶段维护独立的查询缓冲区并联合评分缓存键，同时支持跨轮次的持久化压缩。该方法在多种任务和KV预算下显著优于R-KV等基线，相对全量KV的SGLang实现了最高1.80倍的吞吐量提升。**(2609.14872 [cs.LG])**\n\n- **LIMBO: Lifelong Inference-Time Memory and Budget Optimization for LLM Agents**\n  终身学习智能体在注入历史经验时，面临有限的Prompt和算力预算分配难题。本文首次将此定义为“推理时记忆分配”问题，并提出在线框架**LIMBO**。该框架将记忆视为可控资源，在单次前向传播中在线学习并联合优化记忆策略与推理预算，无需修改模型权重。在大幅降低推理成本（平均约53%）的情况下，实现了与最强基线相当的精度。**(2609.14138 [cs.LG])**\n\n### 淬炼与提纯：加速多轮智能体的训练与蒸馏过程\n\n- **Know When to Stop, Where to Restart: Accelerating Multi-Turn Agentic On-Policy Distillation**\n  多轮智能体策略蒸馏（OPD）的成本受限于自回归Rollout的长度，现有截断方法依赖固定预算且忽略了教师信号可靠性的时序变化。本研究提出**STRIDE**，结合自适应早停机制和前缀缓冲区，在学生模型出现首个错误动作时精准重启生成。这种数据驱动的课程学习机制在保持甚至超越教师模型性能的同时，实现了最高5.10倍的加速。**(2609.14636 [cs.LG])**\n\n- **HarnessBandit: Joint Learnability-Transferability Scheduling for Multi-Harness Agentic Reinforcement Learning**\n  同一模型在不同智能体框架（Harness，如系统提示、工具格式不同）下表现差异巨大，多框架联合训练面临调度难题。本文提出在线调度器**HarnessBandit**，在GRPO更新后综合评估当前框架的**可学习性**与向其他框架的**可迁移性**。通过融合这两种动态信号进行采样，该方法有效提升了策略在未见任务和未见框架上的鲁棒性。**(2609.13739 [cs.LG])**\n\n---\n\n### 今日看点\n\n- **向内挖掘而非向外堆料**：Gavel的发现令人瞩目，它证明了冻结的LLM内部已经隐含了强大的技能路由能力。这挑战了当前主流“外挂检索器或扩充上下文”的范式，提示我们在增加外部复杂组件前，应先尝试激活模型自身的原生潜能。\n- **智能体基础设施的精细化运营**：从AGENTKV的阶段感知缓存到LIMBO的在线记忆预算分配，再到STRIDE的自适应早停，今天的多篇论文显示出“智能体优化”正从高层的算法策略向底层的显存管理、算力调度和时序控制深入。系统级工程优化正成为提升智能体能效比的关键驱动力。\n- **强化学习重塑多智能体协作**：无论是CREW在文献综述中的动态动作选择，还是HarnessBandit在多框架间的梯度迁移调度，RL正在取代预先设定的静态启发式规则。这标志着多智能体系统正从“机械式流水线”向具备自适应协作策略的“有机体”演进。\n- **LLM作为科研长周期推演的引擎**：Stellar Colosseum在FOCS/STOC级别的理论计算机问题上取得突破，并解决了真实的开放性学术问题。这不仅是Benchmark分数的提升，更是LLM从“代码助手”向“能够进行长链条不确定推理的科研合作者”跨越的重要里程碑。", "2026-09-14": "### 今日AI论文速览 (2026-09-14)\n\n今天的AI研究前沿呈现出强烈的“落地化”与“系统化”趋势。研究焦点正从单次推理转向Agent的终身学习、跨环境记忆共享以及长视界任务的信用分配。同时，具身智能在物理操作和长视频理解上取得突破，而评估领域则开始深刻反思LLM-as-a-Judge的局限性，呼吁回归真实世界验证。\n\n---\n\n### 记忆的进化：从个体回溯到跨用户共享\n*本主题关注如何为Agent构建更高效、持久且安全的记忆系统，解决长期交互中的灾难性遗忘与上下文爆炸问题。*\n\n- **LifeMem** 提出了一种终身学习框架，通过聚类交互轨迹提取可复用技能，解决了LLM Agent跨环境知识迁移和灾难性遗忘问题。在1万多个任务上的实验表明，该方法能有效整合结构相似的轨迹，实现跨任务的高效经验复用。**(2609.12655 [cs.CL])**\n- **CueMem** 受自传体记忆重构启发，将提取的记忆记录视为检索线索而非独立证据，通过图结构重构查询相关的对话上下文。该方法在大幅减少输入Token和延迟的同时，显著提升了长期对话问答的准确性。**(2609.12354 [cs.CL])**\n- **AIM** 针对多用户多Agent系统提出隐私感知的互操作记忆框架，动态区分私有与公共知识并在索引级实施访问控制。配合首个多用户记忆基准**MUMBench**，实现了96%的可见性分类准确率，兼顾了隐私保护与知识共享。**(2609.12320 [cs.LG])**\n\n### 跨越数字鸿沟：具身智能与领域专精代理\n*本主题探讨Agent如何走出纯文本沙盒，在物理世界、可穿戴设备及海量多模态数据中发挥实质作用。*\n\n- **Agent as Policy (AGP)** 证明了通用Agent无需特定训练即可直接驱动物理机器人。**AGP**将任务规划与执行交由Agent控制，通过视觉解释、编写程序和运动指令的闭环交互，在积木搭建等真实操作中达到100%成功率。**(2609.12541 [cs.CL])**\n- **Affective Agent** 提出面向可穿戴设备的三层个性化干预推理架构，结合亚十亿参数语言模型与生理信号，在设备端实现闭环干预。该架构通过**结构化记忆演化**适应用户，无需云端依赖或按用户重训。**(2609.12322 [cs.LG])**\n- **VideoXAgent** 针对长视频理解中的“大海捞针”问题，提出纯在线Agent框架。通过按需调用异构专家工具并执行预算感知控制，在仅使用约15%上下文的情况下，匹配甚至超越了密集帧基线的表现。**(2609.12818 [cs.AI])**\n- **Reality Is the Final Verifier** 提出**双缺口框架**，指出需求与模型近似误差是Agent软件工程失败的根源。文章主张将目标从“闭合缺口”转向“持续缩小”，强调现实部署是最终的验证者。**(2609.12039 [cs.AI])**\n\n### 祛魅与重构：重新定义Agent评估基准\n*本主题聚焦当前Agent评估方法的盲区，揭示LLM评委的失效边界及复杂交互场景的测试挑战。*\n\n- **GAUGE** 揭示了在任务导向Agent评估中，LLM-as-a-Judge存在严重的**满意度-成功鸿沟**：57.5%被评分为“满意”的对话实际上未能完成任务。研究指出该评估门控在强模型间失去分辨率，并提出了“先校准后信任”的补救策略。**(2609.12191 [cs.CL])**\n- **MP-Bench** 是首个专门评估语音Agent在多方对话中表现的标准。评估发现，当前实时语音Agent在多方理解上准确率不足22%，在多方轮次把握上接近随机，暴露了复杂群聊场景下的巨大挑战。**(2609.13076 [cs.CL])**\n- **VRL-Bench** 在有限尝试预算下评估Agent的试错学习能力。研究发现基于语言记忆的反思方法可能反而降低成功率，揭示了利用经验与持续探索之间的权衡，并提出**VEX²**调度器实现稳定增益。**(2609.12404 [cs.AI])**\n\n### 工具与工作流：从Bash极简主义到自适应编排\n*本主题关注Agent如何更好地使用工具和合成工作流，从接口选择到动态修复机制。*\n\n- **RIPPLE** 针对提示词策略编辑中的“局部编辑引发全局涟漪”问题，提出将编辑位置与组合安全性分离的框架。通过重放机制诊断失败轨迹并验证编辑在组合后的安全性，将工作流合成的验证成功率提升了23.1%。**(2609.12127 [cs.CL])**\n- **Earth-Agent-Pro** 面向真实世界地球观测的全链路Agent框架，采用执行自适应的**Plan-and-Execute**架构。通过工作流中心化结构记忆和联合适配器调优，在开放世界执行任务上大幅超越ReAct基线。**(2609.12533 [cs.CL])**\n- **Is Bash All You Need?** 通过实证研究挑战了专用工具的必要性，发现纯**Bash**接口在企业任务中优于类型化工具，不仅得分高出21.8-24.5个百分点，还能节省19-72%的Token。**(2609.11999 [cs.CL])**\n\n### 训练范式革新：内化专家与长视界信用分配\n*本主题探讨如何更高效地训练Agent，包括参数高效微调的优化与长序列决策的信用分配。*\n\n- **BQ-LoRA** 提出基于**行为商空间**的低秩适配框架，解决单一LoRA从多样化轨迹学习时的冗余更新和秩预算溢出问题。通过行为商平衡和决策保持压缩，在不增加路由开销的情况下有效整合异构交互能力。**(2609.12896 [cs.LG])**\n- **GACA** 针对长视界RL中GRPO无法进行细粒度信用分配的问题，提出无critic的粒度自适应估计器。该方法基于不确定性关键性代理，根据每步的负对数似然动态调整步级与回合级优势的混合权重，显著提升了任务成功率。**(2609.12424 [cs.LG])**\n- **Rivet** 研究如何将路由的LLM专家能力内化到紧凑推理器中。通过**专家增强强化学习**和验证轨迹内化，在移除专家后，4B模型的准确率仍提升了6.49个百分点，证明了协作结构内化的有效性。**(2609.12578 [cs.AI])**\n\n---\n\n### 今日看点\n\n- **评估体系的集体反思**：今天多篇论文直击Agent评估痛点。GAUGE戳破了LLM-as-Judge的“满意度幻觉”，VRL-Bench揭示了“反思可能有害”，而“Reality Is the Final Verifier”则从哲学高度指出预部署评估的局限性。这表明社区正从盲目刷分转向追求真实、严谨的落地验证。\n- **记忆架构的升维**：从LifeMem的跨环境技能复用，到CueMem的线索重构，再到AIM的多用户隐私隔离，Agent的记忆系统正从简单的KV存储向具备语义抽象、图结构重构和权限管理的复杂知识库演进。\n- **“极简主义”工具接口的胜利**：Is Bash All You Need? 的结论令人侧目——纯Bash竟然击败了精心设计的类型化工具。这暗示着在强模型时代，赋予Agent更底层、更灵活的执行权限，可能比将其限制在预定义工具箱中更高效。\n- **长视界RL的精细化破局**：GACA和BQ-LoRA分别从时间维度（信用分配）和参数维度（LoRA更新）解决了长轨迹训练的痛点，标志着Agent训练正从粗放的回合级反馈向精细化的状态级对齐迈进。"};

        // 全局状态管理
        let starredPapers = new Set();
        let readPapers = new Set();
        let deletedPapers = new Set();
        let pendingDeletes = new Map();
        let showChineseSummary = true; // 默认显示中文摘要
        let showOnlyStarred = false; // 筛选状态：是否只显示收藏的论文
        let isLoadingMore = false; // 是否正在加载更多
        let activeTagFilters = {}; // {date: Set of active tag names}
        let bulkExpandedDate = null; // 同一时间只允许一个日期批量展开
        let bulkExpansionRun = 0; // 取消仍在逐帧执行的旧批量任务
        let currentTocDate = null; // 左侧目录当前展开的唯一日期

        // 获取未加载的日期（只在两周展示窗口内分页；窗口外日期不进入"加载更多"，
        // 仅在被收藏时由 loadArchivedStarredDates 按需加载）
        function getUnloadedDates() {
            return availableDates.filter(date => !loadedDates.has(date) && windowDateSet.has(date));
        }

        // Tag filter toggle
        function toggleTagFilter(date, tagName) {
            if (!activeTagFilters[date]) activeTagFilters[date] = new Set();
            const filters = activeTagFilters[date];
            if (tagName === 'All') {
                filters.clear();
            } else if (filters.has(tagName)) {
                filters.delete(tagName);
            } else {
                filters.add(tagName);
            }
            renderPapers();
        }

        // Check if paper matches active tag filters for its date
        function paperMatchesFilters(paper, date) {
            const filters = activeTagFilters[date];
            if (!filters || filters.size === 0) return true;
            if (filters.has(paper.cluster)) return true;
            return (paper.tags || []).some(tag => filters.has(tag));
        }

        // 加载更多日期的数据
        async function loadMoreDates() {
            if (isLoadingMore) return;

            const unloadedDates = getUnloadedDates();
            if (unloadedDates.length === 0) {
                showSimpleToast('已加载全部数据');
                return;
            }

            isLoadingMore = true;
            const loadBtn = document.getElementById('load-more-btn');
            if (loadBtn) {
                loadBtn.disabled = true;
                loadBtn.innerHTML = '<span class="animate-spin inline-block mr-2">⏳</span>加载中...';
            }

            const datesToLoad = unloadedDates.slice(0, LOAD_MORE_DAYS);
            let loadedCount = 0;

            for (const date of datesToLoad) {
                try {
                    const response = await fetch(`data/${date}.json?v=${DATA_VERSION}`);
                    if (!response.ok) continue;

                    const dateData = await response.json();

                    // 将数据添加到 allPapers
                    allPapers[date] = dateData.clusters;
                    allPaperTags[date] = dateData.tags;

                    // 添加每日速览
                    if (dateData.overview) {
                        dailyOverviews[date] = dateData.overview;
                    }

                    loadedDates.add(date);
                    loadedCount++;
                } catch (e) {
                    console.error(`加载 ${date} 数据失败:`, e);
                }
            }

            isLoadingMore = false;

            if (loadedCount > 0) {
                renderPapers();
                showSimpleToast(`已加载 ${loadedCount} 天的数据`);
            }

            updateLoadMoreButton();
        }

        // 更新"加载更多"按钮状态
        function updateLoadMoreButton() {
            const loadBtn = document.getElementById('load-more-btn');
            const unloadedCount = getUnloadedDates().length;

            if (loadBtn) {
                if (unloadedCount === 0) {
                    loadBtn.style.display = 'none';
                } else {
                    loadBtn.style.display = 'inline-flex';
                    loadBtn.disabled = false;
                    loadBtn.innerHTML = `📥 加载更多 (还有 ${unloadedCount} 天)`;
                }
            }
        }

        // 加载窗口外（两周前）被收藏论文所在日期的数据，使其能在信息流中内联显示。
        // 这些日期的数据文件一直保留在 data/ 下，这里按需 fetch 进来；渲染时
        // createPaperHTML 会把窗口外日期里未收藏的论文隐藏，只留下收藏的那几篇。
        async function loadArchivedStarredDates() {
            if (!starredPapers || starredPapers.size === 0) return;
            const datesToLoad = new Set();
            starredPapers.forEach(aid => {
                const date = paperDateIndex[aid];
                if (date && !windowDateSet.has(date) && !loadedDates.has(date)) {
                    datesToLoad.add(date);
                }
            });
            if (datesToLoad.size === 0) return;

            let loadedCount = 0;
            for (const date of datesToLoad) {
                try {
                    const response = await fetch(`data/${date}.json?v=${DATA_VERSION}`);
                    if (!response.ok) continue;
                    const dateData = await response.json();
                    allPapers[date] = dateData.clusters;
                    allPaperTags[date] = dateData.tags;
                    if (dateData.overview) {
                        dailyOverviews[date] = dateData.overview;
                    }
                    loadedDates.add(date);
                    loadedCount++;
                } catch (e) {
                    console.error(`加载收藏日期 ${date} 数据失败:`, e);
                }
            }
            if (loadedCount > 0) {
                renderPapers();
            }
        }

        // 从localStorage加载状态
        function loadState() {
            const starred = localStorage.getItem('starred_papers');
            const read = localStorage.getItem('read_papers');
            const deleted = localStorage.getItem('deleted_papers');
            const summaryLang = localStorage.getItem('summary_language');

            if (starred) starredPapers = new Set(JSON.parse(starred));
            if (read) readPapers = new Set(JSON.parse(read));
            if (deleted) deletedPapers = new Set(JSON.parse(deleted));
            if (summaryLang !== null) showChineseSummary = summaryLang === 'chinese';
        }

        // 保存状态到localStorage
        function saveState() {
            localStorage.setItem('starred_papers', JSON.stringify([...starredPapers]));
            localStorage.setItem('read_papers', JSON.stringify([...readPapers]));
            localStorage.setItem('deleted_papers', JSON.stringify([...deletedPapers]));
            localStorage.setItem('summary_language', showChineseSummary ? 'chinese' : 'english');
        }

        // 显示撤销删除的Toast
        function showUndoToast(message, seconds, onUndo, onExpire) {
            const toast = document.getElementById('undo-toast');
            const msgEl = document.getElementById('toast-message');
            const cdEl = document.getElementById('countdown');
            const undoBtn = document.getElementById('undo-btn');

            msgEl.textContent = message;
            let remaining = seconds;
            cdEl.textContent = `(${remaining}s)`;
            toast.classList.remove('hidden');

            let intervalId = setInterval(() => {
                remaining -= 1;
                cdEl.textContent = `(${remaining}s)`;
                if (remaining <= 0) {
                    clearInterval(intervalId);
                    toast.classList.add('hidden');
                    try { onExpire && onExpire(); } catch (e) {}
                }
            }, 1000);

            let expireTimer = setTimeout(() => {
                clearInterval(intervalId);
                toast.classList.add('hidden');
                try { onExpire && onExpire(); } catch (e) {}
            }, seconds * 1000);

            const cleanup = () => {
                clearInterval(intervalId);
                clearTimeout(expireTimer);
                toast.classList.add('hidden');
            };

            const onUndoClick = () => {
                cleanup();
                try { onUndo && onUndo(); } catch (e) {}
            };

            undoBtn.removeEventListener('click', onUndoClick);
            undoBtn.addEventListener('click', onUndoClick);
        }

        // 显示简单的提示信息
        function showSimpleToast(message) {
            // 创建一个简单的toast元素
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg z-50 transition-all duration-300';
            toast.textContent = message;

            document.body.appendChild(toast);

            // 3秒后自动消失
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // 通过按钮删除论文（避免JavaScript字符串转义问题）
        function deletePaperByButton(button) {
            const arxivId = button.getAttribute('data-arxiv-id');
            const title = button.getAttribute('data-title');
            deletePaper(arxivId, title);
        }

        // 删除论文
        function deletePaper(arxivId, title) {
            const paperEl = document.querySelector(`[data-arxiv-id="${cssEscape(arxivId)}"]`);
            if (!paperEl) return;
            const listItem = paperEl.closest('li');
            const sectionEl = paperEl.closest('section[data-date-section]');

            // 添加删除动画效果
            paperEl.style.transition = 'all 0.3s ease-out';
            paperEl.style.transform = 'scale(0.95)';
            paperEl.style.opacity = '0.5';

            setTimeout(() => {
                // 立即删除并保存状态
                deletedPapers.add(arxivId);
                saveState();

                // 移除DOM元素
                if (listItem) {
                    listItem.remove();
                } else {
                    paperEl.remove();
                }

                updateDateSection(sectionEl);
                updateStats();
                buildToc();

                // 显示简单的删除提示
                showSimpleToast(`已删除: ${title}`);
            }, 300);
        }

        // 切换星标状态
        function toggleStar(arxivId) {
            if (starredPapers.has(arxivId)) {
                starredPapers.delete(arxivId);
            } else {
                starredPapers.add(arxivId);
            }
            saveState();

            // 如果当前是只看收藏模式，或这篇属于窗口外（两周前）日期，则重新渲染：
            // 窗口外的论文取消收藏后应立即隐藏，新收藏的则应立即出现。
            const paperDate = (paperDataMap[arxivId] && paperDataMap[arxivId].date)
                || paperDateIndex[arxivId];
            if (showOnlyStarred || (paperDate && !windowDateSet.has(paperDate))) {
                renderPapers();
            } else {
                // 否则只更新星标按钮状态
                const starBtn = document.querySelector(`[data-arxiv-id="${cssEscape(arxivId)}"] .star-button`);
                if (starBtn) {
                    if (starredPapers.has(arxivId)) {
                        starBtn.classList.add('starred');
                    } else {
                        starBtn.classList.remove('starred');
                    }
                }
            }
        }

        // 切换已读状态
        function toggleRead(arxivId) {
            const checkbox = document.querySelector(`[data-arxiv-id="${cssEscape(arxivId)}"] input[type="checkbox"]`);
            if (!checkbox) return;

            if (checkbox.checked) {
                readPapers.add(arxivId);
            } else {
                readPapers.delete(arxivId);
            }
            saveState();
        }

        // 切换摘要语言
        function toggleSummaryLanguage() {
            showChineseSummary = !showChineseSummary;
            const toggleBtn = document.getElementById('summary-toggle');
            toggleBtn.textContent = showChineseSummary ? '中文摘要' : 'English Summary';

            // 更新所有摘要显示
            document.querySelectorAll('.summary-section').forEach(section => {
                const chineseContent = section.querySelector('.chinese-summary');
                const englishContent = section.querySelector('.english-summary');

                if (showChineseSummary) {
                    if (chineseContent) chineseContent.style.display = 'block';
                    if (englishContent) englishContent.style.display = 'none';
                } else {
                    if (chineseContent) chineseContent.style.display = 'none';
                    if (englishContent) englishContent.style.display = 'block';
                }

                // Only the selected language is parsed. The hidden translation is
                // left as raw data until the reader actually switches to it.
                renderMarkdownAfterPaint(section);
            });

            saveState();
        }

        // 更新统计信息
        function updateStats() {
            const visiblePapers = document.querySelectorAll('.paper-item:not(.hidden-paper)').length;
            document.getElementById('total-papers').textContent = visiblePapers;
        }

        function updateDateSection(sectionEl) {
            if (!sectionEl) return;
            const totalPapers = sectionEl.querySelectorAll('.paper-item').length;
            const header = sectionEl.querySelector('[data-date-heading]');

            if (header) {
                const dateLabel = header.dataset.dateHeading || header.textContent.split(' ')[0];
                header.textContent = `${dateLabel} (${totalPapers} 篇论文)`;
            }

            if (totalPapers === 0) {
                sectionEl.remove();
            }
        }

        // 可折叠功能
        function toggleCollapsible(header) {
            const content = header.nextElementSibling;
            const isOpen = header.classList.contains('open');

            if (isOpen) {
                header.classList.remove('open');
                content.classList.remove('open');
            } else {
                header.classList.add('open');
                content.classList.add('open');
                // Commit the disclosure state before doing any text layout.
                renderMarkdownAfterPaint(content);
            }
        }

        // Map of element ID -> raw markdown content for lazy rendering
        const mdRawContent = {};

        // Register raw markdown content for lazy rendering
        function registerMarkdown(id, content) {
            if (id && content) mdRawContent[id] = content;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function escapeJsSingleQuotedAttr(value) {
            return escapeHtml(String(value ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n')
                .replace(/\u2028/g, '\\u2028')
                .replace(/\u2029/g, '\\u2029'));
        }

        function safePathSegment(value) {
            return encodeURIComponent(String(value ?? ''));
        }

        function cssEscape(value) {
            const text = String(value ?? '');
            if (window.CSS && typeof CSS.escape === 'function') return CSS.escape(text);
            return text.replace(/["\\]/g, '\\$&');
        }

        function escapeMarkdownHtml(value) {
            return String(value ?? '').replace(/[&<>]/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;'
            }[ch]));
        }

        function sanitizeRenderedMarkdown(root) {
            root.querySelectorAll('script, style, iframe, object, embed, svg, math').forEach(el => el.remove());
            root.querySelectorAll('*').forEach(el => {
                [...el.attributes].forEach(attr => {
                    if (/^on/i.test(attr.name) || /^(style|srcdoc|srcset)$/i.test(attr.name)) {
                        el.removeAttribute(attr.name);
                    }
                });
            });
            root.querySelectorAll('img[src]').forEach(img => {
                if (!/^(https?:|[/])/i.test(img.getAttribute('src') || '')) img.removeAttribute('src');
            });
            root.querySelectorAll('a[href]').forEach(link => {
                const href = link.getAttribute('href') || '';
                if (!/^(https?:|mailto:|#|[/])/i.test(href)) {
                    link.removeAttribute('href');
                }
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            });
        }

        function renderMathEl(el) {
            if (!el || el.getAttribute('data-math-rendered')) return;
            if (typeof renderMathInElement !== 'function') return;
            try {
                renderMathInElement(el, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '\\[', right: '\\]', display: true },
                        { left: '\\(', right: '\\)', display: false },
                        { left: '$', right: '$', display: false }
                    ],
                    throwOnError: false,
                    strict: 'ignore',
                    ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
                });
                el.setAttribute('data-math-rendered', '1');
            } catch (e) {
                console.warn('公式渲染失败:', e);
            }
        }

        // Parse markdown for a single element by id
        function renderMarkdownEl(el) {
            if (!el || el.getAttribute('data-rendered')) return;
            const raw = mdRawContent[el.id];
            if (raw) {
                try {
                    // Escape only raw HTML tokens. Pre-escaping Markdown double-escapes
                    // code fences and destroys blockquotes and comparison operators.
                    const renderer = new marked.Renderer();
                    renderer.html = token => {
                        const text = typeof token === 'string' ? token : token.text;
                        return /^<br\s*\/?>$/i.test(text.trim()) ? '<br>' : escapeMarkdownHtml(text);
                    };
                    const template = document.createElement('template');
                    template.innerHTML = marked.parse(raw, { renderer });
                    sanitizeRenderedMarkdown(template.content);
                    el.replaceChildren(template.content);
                    // This element belongs to the section the reader just opened;
                    // closed sections remain untouched until their first expansion.
                    renderMathEl(el);
                } catch (e) { el.textContent = raw; }
                el.setAttribute('data-rendered', '1');
            }
        }

        // Parse markdown for all unrendered .markdown-content elements inside a container
        function lazyRenderMarkdown(container) {
            if (typeof marked === 'undefined') return;
            container.querySelectorAll('.markdown-content:not([data-rendered])').forEach(el => {
                if (el.style.display !== 'none') renderMarkdownEl(el);
            });
        }

        // Run work after a browser paint. Two animation frames are intentional: the
        // first commits the interaction feedback, and the second starts follow-up work.
        function afterNextPaint(callback) {
            requestAnimationFrame(() => requestAnimationFrame(callback));
        }

        // Serialize markdown work across animation frames. This is especially
        // important when "expand today's papers" reveals many cards at once.
        const markdownRenderQueue = [];
        let markdownRenderScheduled = false;

        function drainMarkdownRenderQueue() {
            if (markdownRenderScheduled || markdownRenderQueue.length === 0) return;
            markdownRenderScheduled = true;
            afterNextPaint(() => {
                markdownRenderScheduled = false;
                const container = markdownRenderQueue.shift();
                if (container) {
                    container.removeAttribute('data-render-queued');
                    if (container.isConnected &&
                        (!container.classList.contains('collapsible-content') ||
                         container.classList.contains('open'))) {
                        lazyRenderMarkdown(container);
                    }
                }
                drainMarkdownRenderQueue();
            });
        }

        // Keep markdown parsing and the resulting text layout out of the click frame.
        function renderMarkdownAfterPaint(container) {
            if (!container || typeof marked === 'undefined') return;
            const pending = container.querySelectorAll('.markdown-content:not([data-rendered])');
            if (!pending.length) return;
            if (container.getAttribute('data-render-queued') === '1') return;
            container.setAttribute('data-render-queued', '1');
            markdownRenderQueue.push(container);
            drainMarkdownRenderQueue();
        }

        function hasMeaningfulText(value) {
            return typeof value === 'string' && value.trim().length > 0;
        }

        function splitMethodologySections(value) {
            const result = { pipeline: '', math: '', experiments: '' };
            if (!hasMeaningfulText(value)) return result;

            const text = String(value).replace(/\r\n?/g, '\n');
            const headingPattern = /^[ \t]*(?:#{1,6}[ \t]*)?§[ \t]*(5|6|7)\b[^\n]*\n?/gm;
            const matches = [...text.matchAll(headingPattern)];
            if (matches.length === 0) {
                result.pipeline = text.trim();
                return result;
            }

            const keyBySection = { '5': 'pipeline', '6': 'math', '7': 'experiments' };
            matches.forEach((match, index) => {
                const key = keyBySection[match[1]];
                if (!key) return;
                const start = match.index + match[0].length;
                const end = index + 1 < matches.length ? matches[index + 1].index : text.length;
                const body = text.slice(start, end).trim();
                if (body) result[key] = body;
            });

            const prefix = text.slice(0, matches[0].index).trim();
            if (prefix) result.pipeline = `${prefix}

${result.pipeline}`.trim();
            return result;
        }

        // Render markdown only for currently visible (open) sections
        function renderVisibleMarkdown() {
            if (typeof marked === 'undefined') return;
            marked.setOptions({ breaks: true, gfm: true, headerIds: false, mangle: false });
            // Render open collapsible sections
            document.querySelectorAll('.collapsible-content.open').forEach(c => lazyRenderMarkdown(c));
            // Render overview sections (top-level, not inside collapsible)
            document.querySelectorAll('.markdown-content:not([data-rendered])').forEach(el => {
                if (!el.closest('.collapsible-content')) renderMarkdownEl(el);
            });
        }

        // 创建论文HTML
        function formatAuthorsWithAffiliations(authorsStr, affiliationsStr) {
            if (!affiliationsStr) return escapeHtml(authorsStr);
            try {
                // 解析 JSON（可能被包在 ```json ... ``` 中）
                let jsonStr = affiliationsStr;
                const match = jsonStr.match(/```json\s*([\s\S]*?)\s*```/);
                if (match) jsonStr = match[1];
                const objMatch = jsonStr.match(/\{[\s\S]*\}/);
                if (objMatch) jsonStr = objMatch[0];
                const data = JSON.parse(jsonStr);

                // 兼容旧格式（数组）
                if (Array.isArray(data)) {
                    const authors = authorsStr.split(/,\s*/);
                    const affMap = {};
                    data.forEach(a => { if (a.name && a.affiliation) affMap[a.name.trim().toLowerCase()] = a.affiliation; });
                    return authors.map(a => {
                        const aff = affMap[a.trim().toLowerCase()];
                        return aff
                            ? `${escapeHtml(a.trim())}<sup class="aff-sup" title="${escapeHtml(aff)}">${escapeHtml(aff)}</sup>`
                            : escapeHtml(a.trim());
                    }).join(', ');
                }

                if (!data.authors || !data.institutions) return escapeHtml(authorsStr);

                // 新格式：论文式数字角标
                const instMap = {};
                data.institutions.forEach(inst => { instMap[inst.id] = inst.name; });

                // 渲染作者行
                const authorParts = data.authors.map(a => {
                    let sups = [];
                    if (a.affiliations && a.affiliations.length > 0) {
                        sups = sups.concat(a.affiliations.map(String));
                    }
                    if (a.markers && a.markers.length > 0) {
                        sups = sups.concat(a.markers);
                    }
                    const supValues = sups.map(escapeHtml).join(',');
                    const supStr = sups.length > 0
                        ? `<sup class="aff-sup">${supValues}</sup>`
                        : '';
                    return `${escapeHtml(a.name)}${supStr}`;
                });

                // 渲染机构列表
                const instLine = data.institutions.map(inst =>
                    `<sup class="aff-sup">${escapeHtml(inst.id)}</sup>${escapeHtml(inst.name)}`
                ).join('&ensp;');

                // 渲染脚注
                let footLine = '';
                if (data.footnotes && data.footnotes.length > 0) {
                    footLine = data.footnotes.map(fn =>
                        `<sup class="aff-sup">${escapeHtml(fn.marker)}</sup>${escapeHtml(fn.text)}`
                    ).join('&ensp;');
                }

                let html = authorParts.join(', ');
                html += `<div class="text-xs text-slate-500 dark:text-slate-400 mt-1">${instLine}</div>`;
                if (footLine) {
                    html += `<div class="text-xs text-slate-400 dark:text-slate-500 mt-0.5 italic">${footLine}</div>`;
                }
                return html;
            } catch (e) {
                return escapeHtml(authorsStr);
            }
        }

        // Store paper data by arxiv_id for lazy detail building
        const paperDataMap = {};

        function createPaperHTML(paper, date) {
            const aid = String(paper.arxiv_id ?? '');
            const aidHtml = escapeHtml(aid);
            const aidArg = escapeJsSingleQuotedAttr(aid);
            const titleHtml = escapeHtml(paper.title);
            const titleAttr = escapeHtml(paper.title);
            const dateHtml = escapeHtml(date);
            const isStarred = starredPapers.has(aid);
            const isRead = readPapers.has(aid);
            const isDeleted = deletedPapers.has(aid);

            if (isDeleted) return '';
            // 展示窗口：窗口外（两周前）的日期只展示被收藏的论文，其余隐藏。
            if (!windowDateSet.has(date) && !isStarred) return '';
            if (showOnlyStarred && !isStarred) return '';
            if (!paperMatchesFilters(paper, date)) return '';

            // Store paper data for lazy rendering
            paperDataMap[aid] = { paper, date };

            const clusterBadge = paper.cluster ? `<span class="tag-badge">${escapeHtml(paper.cluster)}</span>` : '';
            const tagBadges = (paper.tags || []).map(tag => `<span class="tag-badge tag-arxiv">${escapeHtml(tag)}</span>`).join('');

            return `
                <div class="paper-item bg-white dark:bg-slate-800/50 rounded-lg shadow-sm p-4 sm:p-6" data-arxiv-id="${aidHtml}">
                    <!-- 论文标题和操作按钮 -->
                    <div class="flex items-start justify-between mb-1">
                        <div class="flex items-start space-x-2 sm:space-x-3 flex-1 min-w-0">
                            <button class="star-button ${isStarred ? 'starred' : ''} mt-1 flex-shrink-0" onclick="toggleStar('${aidArg}')" title="点击收藏">
                                <svg class="h-5 w-5 sm:h-6 sm:w-6" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                                </svg>
                            </button>
                            <h3 class="text-base sm:text-lg font-semibold text-black dark:text-white leading-tight break-words cursor-pointer hover:text-blue-600 dark:hover:text-blue-400 transition-colors" onclick="togglePaperDetail('${aidArg}')">${titleHtml}</h3>
                        </div>
                        <button class="delete-button text-slate-400 hover:text-red-500 ml-2 sm:ml-4 flex-shrink-0" onclick="deletePaperByButton(this)" data-arxiv-id="${aidHtml}" data-title="${titleAttr}" title="删除">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>

                    <!-- 论文元信息（始终可见） -->
                    <div class="space-y-1 mb-2">
                        <div class="flex flex-wrap items-center gap-2 sm:gap-4 text-xs sm:text-sm text-slate-600 dark:text-slate-400">
                            <span class="break-all"><strong>ArXiv ID:</strong> ${aidHtml}</span>
                            ${clusterBadge}
                            ${tagBadges}
                            <span class="whitespace-nowrap">${dateHtml}</span>
                        </div>
                        <div class="text-xs sm:text-sm text-black dark:text-white break-words">
                            <strong>作者:</strong> ${formatAuthorsWithAffiliations(paper.authors, paper.affiliations)}
                        </div>
                    </div>

                    <!-- 展开/收起指示器 -->
                    <div class="paper-expand-hint text-xs text-slate-400 dark:text-slate-500 cursor-pointer select-none" onclick="togglePaperDetail('${aidArg}')" id="expand-hint-${aidHtml}">
                        <span class="expand-arrow">▶</span> 点击标题展开详情
                    </div>

                    <!-- 懒加载的详情容器 -->
                    <div class="paper-detail hidden" id="detail-${aidHtml}"></div>
                </div>
            `;
        }

        // Build and inject paper detail DOM on first expand
        function buildPaperDetail(arxivId) {
            const container = document.getElementById(`detail-${arxivId}`);
            if (!container || container.getAttribute('data-built')) return;
            container.setAttribute('data-built', '1');

            const { paper, date } = paperDataMap[arxivId];
            if (!paper) return;

            const aid = String(paper.arxiv_id ?? '');
            const aidHtml = escapeHtml(aid);
            const aidArg = escapeJsSingleQuotedAttr(aid);
            const aidPath = safePathSegment(aid);
            const isRead = readPapers.has(aid);
            const methodologySections = splitMethodologySections(paper.methodology);

            // Register all markdown content
            registerMarkdown(`filter-reason-${aid}`, paper.filter_reason);
            registerMarkdown(`intro-logic-${aid}`, paper.intro_logic);
            registerMarkdown(`core-insight-${aid}`, paper.core_insight);
            registerMarkdown(`method-pipeline-${aid}`, methodologySections.pipeline);
            registerMarkdown(`method-math-${aid}`, methodologySections.math);
            registerMarkdown(`method-experiments-${aid}`, methodologySections.experiments);
            registerMarkdown(`additional-insights-${aid}`, paper.additional_insights);
            registerMarkdown(`research-value-${aid}`, paper.research_value);
            if (hasMeaningfulText(paper.summary)) registerMarkdown(`summary-en-${aid}`, paper.summary);
            if (hasMeaningfulText(paper.summary_translation)) registerMarkdown(`summary-zh-${aid}`, paper.summary_translation);

            let html = '';
            const hasSummaryEn = hasMeaningfulText(paper.summary);
            const hasSummaryZh = hasMeaningfulText(paper.summary_translation);

            // 已读复选框
            html += `
                <div class="mb-3 sm:mb-4 mt-3">
                    <label class="inline-flex items-center">
                        <input type="checkbox" ${isRead ? 'checked' : ''} onchange="toggleRead('${aidArg}')" class="rounded border-gray-300 text-blue-600 shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:ring-opacity-50 w-4 h-4">
                        <span class="ml-2 text-xs sm:text-sm text-slate-600 dark:text-slate-400">已阅读</span>
                    </label>
                </div>
            `;

            // 原始摘要
            html += `
                <div class="mb-3 sm:mb-4">
                    <div class="collapsible-header open text-sm sm:text-base" onclick="toggleCollapsible(this)">原始摘要</div>
                    <div class="collapsible-content open">
                        <div class="inner">
                            <div class="summary-section bg-green-50/70 dark:bg-green-950/20 border-l-3 border-green-300 p-3 sm:p-4 rounded-r-lg">
                                ${hasSummaryEn ? `
                                <div class="english-summary text-xs sm:text-sm text-black dark:text-white leading-relaxed markdown-content break-words" id="summary-en-${aidHtml}" style="display: block;">
                                </div>` : ''}
                                ${hasSummaryZh ? `
                                <div class="chinese-summary text-xs sm:text-sm text-black dark:text-white leading-relaxed markdown-content break-words" id="summary-zh-${aidHtml}" style="display: ${hasSummaryEn ? 'none' : 'block'};">
                                </div>` : ''}
                                ${!hasSummaryEn && !hasSummaryZh ? `
                                <div class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 leading-relaxed">
                                    暂无原始摘要。上游抓取或解析可能失败。
                                </div>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // 各分析section的配置
            const sections = [
                { content: paper.intro_logic, id: `intro-logic-${aid}`, title: '研究问题与前人不足', color: 'yellow', open: true },
                { content: paper.core_insight, id: `core-insight-${aid}`, title: '思考路径与核心直觉', color: 'orange' },
                { content: methodologySections.pipeline, id: `method-pipeline-${aid}`, title: '具体方法与完整 Pipeline', color: 'purple', open: true },
                { content: methodologySections.math, id: `method-math-${aid}`, title: '核心数学推导', color: 'indigo' },
                { content: methodologySections.experiments, id: `method-experiments-${aid}`, title: '实验设计与结论', color: 'violet' },
                { content: paper.additional_insights, id: `additional-insights-${aid}`, title: '关键结论、脆弱假设与复现实验', color: 'red' },
                { content: paper.research_value, id: `research-value-${aid}`, title: paper.research_value_source === 'reviewgrounder' ? 'ReviewGrounder 审稿评价' : '最强反例与后续研究方向', color: 'teal' },
                { content: paper.filter_reason, id: `filter-reason-${aid}`, title: '入选依据', color: 'blue' },
            ];

            let renderedSections = 0;
            sections.forEach(s => {
                if (hasMeaningfulText(s.content)) {
                    renderedSections += 1;
                    const openClass = s.open ? ' open' : '';
                    html += `
                        <div class="mb-3 sm:mb-4">
                            <div class="collapsible-header${openClass} text-sm sm:text-base" onclick="toggleCollapsible(this)">${s.title}</div>
                            <div class="collapsible-content${openClass}">
                                <div class="inner">
                                    <div class="bg-${s.color}-50/70 dark:bg-${s.color}-950/20 border-l-3 border-${s.color}-300 p-3 sm:p-4 rounded-r-lg">
                                        <div class="text-xs sm:text-sm text-black dark:text-white leading-relaxed markdown-content break-words" id="${escapeHtml(s.id)}">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            if (renderedSections === 0) {
                html += `
                    <div class="mb-3 sm:mb-4">
                        <div class="bg-amber-50/80 dark:bg-amber-950/20 border-l-3 border-amber-300 p-3 sm:p-4 rounded-r-lg text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
                            暂无扩展解析内容。通常是因为论文正文抓取失败、上游解析结果为空，或当天加载到了不完整的数据文件。
                        </div>
                    </div>
                `;
            }

            // 论文链接
            html += `
                <div class="flex flex-wrap gap-2">
                    <a href="https://arxiv.org/abs/${aidPath}" target="_blank" rel="noopener noreferrer"
                       class="inline-flex items-center px-2.5 py-1.5 sm:px-3 sm:py-2 text-xs sm:text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-md transition-colors whitespace-nowrap">
                        arXiv 原文
                    </a>
                    <a href="https://arxiv.org/pdf/${aidPath}.pdf" target="_blank" rel="noopener noreferrer"
                       class="inline-flex items-center px-2.5 py-1.5 sm:px-3 sm:py-2 text-xs sm:text-sm font-medium text-white bg-green-600 hover:bg-green-700 rounded-md transition-colors whitespace-nowrap">
                        PDF 下载
                    </a>
                    <a href="https://papers.cool/arxiv/${aidPath}" target="_blank" rel="noopener noreferrer"
                       class="inline-flex items-center px-2.5 py-1.5 sm:px-3 sm:py-2 text-xs sm:text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-md transition-colors whitespace-nowrap">
                        Cool Paper
                    </a>
                </div>
            `;

            container.innerHTML = html;

            // Apply summary language setting
            if (showChineseSummary) {
                const ch = container.querySelector('.chinese-summary');
                const en = container.querySelector('.english-summary');
                if (ch) ch.style.display = 'block';
                if (en) en.style.display = 'none';
            } else {
                const ch = container.querySelector('.chinese-summary');
                const en = container.querySelector('.english-summary');
                if (ch) ch.style.display = 'none';
                if (en) en.style.display = 'block';
            }
        }

        function updatePaperExpandHint(arxivId, expanded) {
            const hint = document.getElementById(`expand-hint-${arxivId}`);
            if (!hint) return;
            hint.querySelector('.expand-arrow').textContent = expanded ? '▼' : '▶';
            hint.childNodes[hint.childNodes.length - 1].textContent = expanded
                ? ' 点击标题收起'
                : ' 点击标题展开详情';
        }

        function setPaperDetailExpansion(arxivId, expanded) {
            const container = document.getElementById(`detail-${arxivId}`);
            if (!container) return;

            const isExpanded = container.getAttribute('data-expanded') === '1';
            if (expanded === isExpanded) return;

            if (expanded) {
                container.setAttribute('data-expanded', '1');
                updatePaperExpandHint(arxivId, true);

                // The arrow is the immediate commitment pose. Reveal the heavier
                // detail layout only after that feedback has reached the screen.
                afterNextPaint(() => {
                    if (!container.isConnected ||
                        container.getAttribute('data-expanded') !== '1') return;
                    buildPaperDetail(arxivId);
                    container.classList.remove('hidden');
                    container.querySelectorAll('.collapsible-content.open')
                        .forEach(renderMarkdownAfterPaint);
                });
            } else {
                container.setAttribute('data-expanded', '0');
                container.classList.add('hidden');
                updatePaperExpandHint(arxivId, false);
            }
        }

        // Toggle one paper. Its default open sections are abstract, research
        // question/prior limitations, and §5's concrete method pipeline.
        function togglePaperDetail(arxivId) {
            const container = document.getElementById(`detail-${arxivId}`);
            if (!container) return;
            const isExpanded = container.getAttribute('data-expanded') === '1';
            setPaperDetailExpansion(arxivId, !isExpanded);
        }

        function paperIdsForDate(date) {
            const section = document.querySelector(`[data-date-section="${cssEscape(date)}"]`);
            if (!section) return [];
            return [...section.querySelectorAll('.paper-item[data-arxiv-id]')]
                .map(card => card.getAttribute('data-arxiv-id'))
                .filter(Boolean);
        }

        function updateExpandAllButtons(date, progress = '') {
            document.querySelectorAll('[data-expand-all-date]').forEach(button => {
                const buttonDate = button.getAttribute('data-expand-all-date');
                const active = bulkExpandedDate === buttonDate;
                button.textContent = active
                    ? (progress && buttonDate === date ? progress : '收起当天全部')
                    : '展开当天全部';
                button.setAttribute('aria-pressed', active ? 'true' : 'false');
            });
        }

        function collapseBulkExpandedDate() {
            bulkExpansionRun += 1;
            if (!bulkExpandedDate) return;
            const previousDate = bulkExpandedDate;
            bulkExpandedDate = null;
            paperIdsForDate(previousDate).forEach(aid => setPaperDetailExpansion(aid, false));
            updateExpandAllButtons(previousDate);
        }

        function waitForNextPaint() {
            return new Promise(resolve => afterNextPaint(resolve));
        }

        async function toggleExpandAllForDate(date) {
            if (bulkExpandedDate === date) {
                collapseBulkExpandedDate();
                return;
            }

            collapseBulkExpandedDate();
            const ids = paperIdsForDate(date);
            if (ids.length === 0) return;

            bulkExpandedDate = date;
            const run = ++bulkExpansionRun;
            updateExpandAllButtons(date, `正在展开 0/${ids.length}`);

            // Build one paper per paint. Markdown itself goes through the global
            // render queue, so even a large day never monopolizes the main thread.
            for (let index = 0; index < ids.length; index += 1) {
                if (run !== bulkExpansionRun || bulkExpandedDate !== date) return;
                setPaperDetailExpansion(ids[index], true);
                updateExpandAllButtons(date, `正在展开 ${index + 1}/${ids.length}`);
                await waitForNextPaint();
            }
            if (run === bulkExpansionRun && bulkExpandedDate === date) {
                updateExpandAllButtons(date);
            }
        }

        // 创建聚类HTML
        // Collect all papers from all clusters for a date into a flat list
        function collectPapersForDate(clusters, date) {
            let html = '';
            let count = 0;
            clusters.forEach(cluster => {
                if (cluster.papers) {
                    cluster.papers.forEach(paper => {
                        const paperHTML = createPaperHTML(paper, date);
                        if (paperHTML) {
                            html += `<li>${paperHTML}</li>`;
                            count++;
                        }
                    });
                }
            });
            return { html, count };
        }

        // Build tag filter bar HTML for a given date
        function buildTagFilterBar(date) {
            const tags = allPaperTags[date];
            if (!tags || tags.length === 0) return '';
            const dateArg = escapeJsSingleQuotedAttr(date);
            const filters = activeTagFilters[date] || new Set();
            const allActive = filters.size === 0;
            let html = '<div class="flex flex-wrap gap-1.5 mb-3">';
            html += `<button class="tag-btn ${allActive ? 'active' : ''}" onclick="toggleTagFilter('${dateArg}','All')">All</button>`;
            tags.forEach(tag => {
                const isActive = filters.has(tag.name);
                const tagArg = escapeJsSingleQuotedAttr(tag.name);
                html += `<button class="tag-btn ${isActive ? 'active' : ''}" onclick="toggleTagFilter('${dateArg}','${tagArg}')">${escapeHtml(tag.name)} &times;${escapeHtml(tag.count)}</button>`;
            });
            html += '</div>';
            return html;
        }

        // 渲染论文列表
        function renderPapers() {
            const mainContent = document.getElementById('main-content');
            const loading = document.getElementById('loading');

            bulkExpansionRun += 1;
            bulkExpandedDate = null;
            markdownRenderQueue.length = 0;

            if (loading) {
                loading.classList.add('hidden');
            }

            // Clear paper data map (rebuilt by createPaperHTML)
            Object.keys(paperDataMap).forEach(k => delete paperDataMap[k]);

            let html = '';
            let totalPapers = 0;

            for (const date in allPapers) {
                const clusters = allPapers[date] || [];
                const { html: papersHTML, count: dateVisibleTotal } = collectPapersForDate(clusters, date);
                const dateHtml = escapeHtml(date);
                const dateArg = escapeJsSingleQuotedAttr(date);

                totalPapers += dateVisibleTotal;

                html += `
                    <section class="mb-6 sm:mb-8" data-date-section="${dateHtml}">
                        <div class="flex items-center justify-between gap-3 mb-3 sm:mb-4">
                            <h2 class="text-base sm:text-lg font-medium text-slate-500 dark:text-slate-400" data-date-heading="${dateHtml}">${dateHtml} (${escapeHtml(dateVisibleTotal)} 篇论文)</h2>
                            ${dateVisibleTotal > 0 ? `
                            <button type="button" data-expand-all-date="${dateHtml}" onclick="toggleExpandAllForDate('${dateArg}')"
                                class="lg:hidden px-2.5 py-1.5 text-xs sm:text-sm font-medium text-blue-700 dark:text-blue-300 bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-800 rounded-md hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-colors whitespace-nowrap"
                                aria-pressed="false">展开当天全部</button>` : ''}
                        </div>
                `;

                // 添加该日期的AI论文速览（如果存在）
                if (dailyOverviews[date]) {
                    html += `
                        <div class="mb-3 sm:mb-4 bg-gradient-to-r from-blue-50 to-indigo-50 dark:from-slate-800 dark:to-slate-700 rounded-lg shadow-md p-3 sm:p-5">
                            <div class="collapsible-header" onclick="toggleCollapsible(this)">
                                <svg class="w-4 h-4 sm:w-5 sm:h-5 mr-2 text-blue-600 dark:text-blue-400 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path>
                                </svg>
                                <span class="font-semibold text-slate-900 dark:text-white text-sm sm:text-base">今日AI论文速览</span>
                            </div>
                            <div class="collapsible-content">
                                <div class="inner">
                                    <div class="markdown-content text-slate-700 dark:text-slate-200 text-xs sm:text-sm" id="overview-${date}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Add tag filter bar
                html += buildTagFilterBar(date);

                if (dateVisibleTotal === 0) {
                    html += `
                        <div class="bg-white dark:bg-slate-800/50 rounded-lg shadow-sm p-4 sm:p-5 lg:p-6">
                            <div class="text-sm sm:text-base text-slate-600 dark:text-slate-300 leading-relaxed">
                                今日数据已处理，但没有符合当前筛选条件的论文。
                            </div>
                        </div>
                    </section>
                    `;
                } else {
                    html += `
                        <div class="bg-white dark:bg-slate-800/50 rounded-lg shadow-sm p-3 sm:p-4 lg:p-6">
                            <ul class="space-y-3 sm:space-y-4">
                                ${papersHTML}
                            </ul>
                        </div>
                    </section>
                    `;
                }
            }

            // 添加"加载更多"按钮
            const unloadedCount = getUnloadedDates().length;
            if (unloadedCount > 0) {
                html += `
                    <div class="text-center py-6">
                        <button id="load-more-btn" onclick="loadMoreDates()"
                            class="inline-flex items-center px-6 py-3 text-base font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-md transition-all duration-200 hover:shadow-lg">
                            📥 加载更多 (还有 ${unloadedCount} 天)
                        </button>
                    </div>
                `;
            }

            mainContent.innerHTML = html;
            updateStats();

            // Register overview markdown and render visible content
            for (const date in dailyOverviews) {
                registerMarkdown(`overview-${date}`, dailyOverviews[date]);
            }
            renderVisibleMarkdown();

            // 更新 TOC
            buildToc();

        }

        // 主题切换功能
        function setupThemeToggle() {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const lightIcon = document.getElementById('theme-icon-light');
            const darkIcon = document.getElementById('theme-icon-dark');

            function updateThemeIcon() {
                if (document.documentElement.classList.contains('dark')) {
                    lightIcon.classList.add('hidden');
                    darkIcon.classList.remove('hidden');
                } else {
                    lightIcon.classList.remove('hidden');
                    darkIcon.classList.add('hidden');
                }
            }

            updateThemeIcon();

            themeToggleBtn.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
                updateThemeIcon();
            });
        }

        // 设置摘要语言切换功能
        function setupSummaryToggle() {
            const summaryToggleBtn = document.getElementById('summary-toggle');

            // 初始化按钮文本
            summaryToggleBtn.textContent = showChineseSummary ? '中文摘要' : 'English Summary';

            summaryToggleBtn.addEventListener('click', toggleSummaryLanguage);
        }

        // 设置筛选功能
        function setupFilter() {
            const filterStarredBtn = document.getElementById('filter-starred');
            const filterAllBtn = document.getElementById('filter-all');

            filterStarredBtn.addEventListener('click', () => {
                showOnlyStarred = true;
                updateFilterButtons();
                renderPapers();
            });

            filterAllBtn.addEventListener('click', () => {
                showOnlyStarred = false;
                updateFilterButtons();
                renderPapers();
            });

            updateFilterButtons();
        }

        // 更新筛选按钮状态
        function updateFilterButtons() {
            const filterStarredBtn = document.getElementById('filter-starred');
            const filterAllBtn = document.getElementById('filter-all');

            if (showOnlyStarred) {
                filterStarredBtn.className = 'px-3 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors';
                filterAllBtn.className = 'px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 rounded-md hover:bg-slate-200 dark:hover:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 transition-colors';
            } else {
                filterStarredBtn.className = 'px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 rounded-md hover:bg-slate-200 dark:hover:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 transition-colors';
                filterAllBtn.className = 'px-3 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors';
            }
        }

        // ========== TOC 侧边栏功能 ==========
        let tocSidebarOpen = true;

        function jumpToPaper(arxivId) {
            const card = document.querySelector(`[data-arxiv-id="${cssEscape(arxivId)}"]`);
            if (!card) return;
            setPaperDetailExpansion(arxivId, true);
            card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setActiveTocPaper(arxivId);
        }

        function setActiveTocPaper(arxivId = null) {
            document.querySelectorAll('.toc-paper[data-toc-paper]').forEach(item => {
                item.classList.toggle(
                    'active',
                    Boolean(arxivId) && item.getAttribute('data-toc-paper') === arxivId
                );
            });
        }

        function setActiveTocDate(date, ensureVisible = true) {
            if (!date) return;
            currentTocDate = date;
            document.querySelectorAll('[data-toc-date]').forEach(group => {
                const groupDate = group.getAttribute('data-toc-date');
                const active = groupDate === date;
                const button = group.querySelector('.toc-date');
                const papers = group.querySelector('.toc-papers');
                const arrow = group.querySelector('.toc-date-arrow');
                if (button) button.classList.toggle('active', active);
                if (papers) papers.classList.toggle('open', active);
                if (arrow) arrow.classList.toggle('open', active);
            });

            updateExpandAllButtons(date);
            if (!ensureVisible) return;
            const activeButton = document.querySelector(
                `[data-toc-date-btn="${cssEscape(date)}"]`
            );
            const tocInner = document.getElementById('toc-inner');
            if (activeButton && tocInner) {
                const buttonRect = activeButton.getBoundingClientRect();
                const tocRect = tocInner.getBoundingClientRect();
                if (buttonRect.top < tocRect.top || buttonRect.bottom > tocRect.bottom) {
                    activeButton.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        function toggleTocSidebar() {
            const sidebar = document.getElementById('toc-sidebar');
            const toggle = document.getElementById('toc-toggle');
            tocSidebarOpen = !tocSidebarOpen;
            if (tocSidebarOpen) {
                sidebar.classList.remove('collapsed');
                toggle.classList.add('sidebar-open');
                toggle.querySelector('svg').style.transform = 'rotate(180deg)';
            } else {
                sidebar.classList.add('collapsed');
                toggle.classList.remove('sidebar-open');
                toggle.querySelector('svg').style.transform = 'rotate(0deg)';
            }
            localStorage.setItem('tocSidebarOpen', tocSidebarOpen);
        }

        function buildToc() {
            const tocList = document.getElementById('toc-list');
            if (!tocList) return;

            let html = '';
            // 遍历目录项：两周窗口内的全部日期，加上窗口外但已因收藏而加载进来的日期。
            const tocDates = availableDates.filter(
                date => windowDateSet.has(date) || loadedDates.has(date)
            );
            for (const date of tocDates) {
                const isLoaded = loadedDates.has(date);
                let papers = [];

                if (isLoaded && allPapers[date]) {
                    const clusters = allPapers[date];
                    clusters.forEach(cluster => {
                        if (cluster.papers) {
                            cluster.papers.forEach(paper => {
                                if (!deletedPapers.has(paper.arxiv_id) && (!showOnlyStarred || starredPapers.has(paper.arxiv_id))) {
                                    if (paperMatchesFilters(paper, date)) {
                                        papers.push(paper);
                                    }
                                }
                            });
                        }
                    });
                }

                const countLabel = isLoaded ? papers.length : '...';
                const dimClass = isLoaded ? '' : ' opacity-50';
                const dateHtml = escapeHtml(date);
                const dateArg = escapeJsSingleQuotedAttr(date);

                html += `<div class="mb-1" data-toc-date="${dateHtml}">`;
                html += `<div class="toc-date${dimClass}" onclick="tocToggleDate(this, '${dateArg}')" data-toc-date-btn="${dateHtml}">`;
                html += `<span class="toc-date-arrow">▶</span>`;
                html += `<span>${dateHtml}</span>`;
                html += `<span class="text-xs text-slate-400 ml-auto">${escapeHtml(countLabel)}</span>`;
                html += `</div>`;
                html += `<div class="toc-papers" data-toc-papers="${dateHtml}">`;
                if (isLoaded) {
                    if (papers.length > 0) {
                        html += `<button type="button" class="toc-expand-all" data-expand-all-date="${dateHtml}" onclick="toggleExpandAllForDate('${dateArg}')" aria-pressed="false">展开当天全部</button>`;
                    }
                    papers.forEach(paper => {
                        const aidHtml = escapeHtml(paper.arxiv_id);
                        const aidArg = escapeJsSingleQuotedAttr(paper.arxiv_id);
                        html += `<div class="toc-paper" onclick="tocScrollToPaper('${aidArg}')" data-toc-paper="${aidHtml}" title="${escapeHtml(paper.title)}">${escapeHtml(paper.title)}</div>`;
                    });
                } else {
                    html += `<div class="toc-paper opacity-50" onclick="tocLoadAndScrollToDate('${dateArg}')">点击加载...</div>`;
                }
                html += `</div></div>`;
            }
            tocList.innerHTML = html;

            const currentGroup = currentTocDate
                ? document.querySelector(`[data-toc-date="${cssEscape(currentTocDate)}"]`)
                : null;
            const firstSection = document.querySelector('[data-date-section]');
            const fallbackDate = firstSection
                ? firstSection.getAttribute('data-date-section')
                : null;
            const activeDate = currentGroup ? currentTocDate : fallbackDate;
            if (activeDate) setActiveTocDate(activeDate, false);
        }

        async function tocLoadAndScrollToDate(date) {
            // 加载该日期之前的所有未加载日期
            const unloaded = getUnloadedDates();
            const idx = unloaded.indexOf(date);
            if (idx < 0) return;
            const datesToLoad = unloaded.slice(0, idx + 1);
            for (const d of datesToLoad) {
                try {
                    const response = await fetch(`data/${d}.json?v=${DATA_VERSION}`);
                    if (response.ok) {
                        const dateData = await response.json();
                        allPapers[d] = dateData.clusters || [];
                        allPaperTags[d] = dateData.tags || [];
                        if (dateData.overview) dailyOverviews[d] = dateData.overview;
                        loadedDates.add(d);
                    }
                } catch (e) {
                    console.error(`加载 ${d} 失败:`, e);
                }
            }
            renderPapers();
            // 等待 DOM 更新后滚动
            setTimeout(() => tocScrollToDate(date), 100);
        }

        function tocToggleDate(el, date) {
            const isLoaded = loadedDates.has(date);
            if (!isLoaded) {
                tocLoadAndScrollToDate(date);
                return;
            }
            // 左侧同一时间只展开当前日期，并同步滚动正文。
            tocScrollToDate(date);
        }

        function tocScrollToPaper(arxivId) {
            const el = document.querySelector(`[data-arxiv-id="${cssEscape(arxivId)}"]`);
            if (el) {
                jumpToPaper(arxivId);
                // 短暂高亮
                el.style.outline = '2px solid #3b82f6';
                el.style.outlineOffset = '2px';
                setTimeout(() => {
                    el.style.outline = '';
                    el.style.outlineOffset = '';
                }, 2000);
            }
        }

        function tocScrollToDate(date) {
            const section = document.querySelector(`[data-date-section="${cssEscape(date)}"]`);
            if (section) {
                if (bulkExpandedDate && bulkExpandedDate !== date) {
                    collapseBulkExpandedDate();
                }
                setActiveTocDate(date);
                setActiveTocPaper();
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // 滚动时高亮当前可见的日期
        let tocScrollTimer = null;
        function setupTocScrollSpy() {
            window.addEventListener('scroll', () => {
                if (tocScrollTimer) clearTimeout(tocScrollTimer);
                tocScrollTimer = setTimeout(() => {
                    const sections = document.querySelectorAll('[data-date-section]');
                    let currentDate = null;
                    const scrollTop = window.scrollY + 100;

                    sections.forEach(section => {
                        if (section.offsetTop <= scrollTop) {
                            currentDate = section.getAttribute('data-date-section');
                        }
                    });

                    if (currentDate) {
                        if (currentDate !== currentTocDate) {
                            setActiveTocDate(currentDate);
                        }

                        const section = document.querySelector(
                            `[data-date-section="${cssEscape(currentDate)}"]`
                        );
                        let currentPaper = null;
                        if (section) {
                            section.querySelectorAll('.paper-item[data-arxiv-id]').forEach(card => {
                                if (card.offsetTop <= scrollTop + 80) {
                                    currentPaper = card.getAttribute('data-arxiv-id');
                                }
                            });
                        }
                        setActiveTocPaper(currentPaper);
                    }
                }, 100);
            });
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', function() {
            loadState();
            setupThemeToggle();
            setupSummaryToggle();
            setupFilter();
            renderPapers();
            buildToc();
            setupTocScrollSpy();

            // 异步加载窗口外被收藏论文所在日期，加载完成后会重新渲染并内联显示
            loadArchivedStarredDates();

            // 恢复 TOC 侧边栏状态
            const savedTocState = localStorage.getItem('tocSidebarOpen');
            if (savedTocState === 'false') {
                tocSidebarOpen = true; // will be toggled to false
                toggleTocSidebar();
            }
        });
    </script>
</body>
</html>
