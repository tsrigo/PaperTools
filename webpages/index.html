<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperTools - 学术论文集合</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Marked.js 用于 Markdown 渲染 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 微软雅黑字体 */
        body {
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        body::-webkit-scrollbar {
            display: none;
        }

        /* 移动端优化 */
        @media (max-width: 640px) {
            body {
                font-size: 14px;
            }

            /* 改善可点击区域 */
            button, a {
                min-height: 44px;
                min-width: 44px;
            }

            /* 优化间距 */
            .container {
                padding-left: 12px !important;
                padding-right: 12px !important;
            }
        }

        /* 星标样式 */
        .star-button {
            transition: color 0.2s ease-in-out;
        }
        .star-button.starred {
            color: #fbbf24;
        }
        .star-button:not(.starred) {
            color: #9ca3af;
        }
        .star-button:hover {
            color: #fbbf24;
        }
        /* 删除按钮样式 */
        .delete-button {
            transition: all 0.2s ease-in-out;
        }
        .delete-button:hover {
            color: #ef4444;
            transform: scale(1.1);
        }
        /* 论文项目样式 */
        .paper-item {
            transition: all 0.3s ease-in-out;
        }
        .paper-item.hidden-paper {
            opacity: 0.3;
            transform: scale(0.98);
        }
        /* 平滑过渡 */
        .rotate-90-transition {
            transition: transform 0.2s ease-in-out;
        }

        /* 论文卡片展开/收起 */
        .paper-expand-hint {
            padding: 4px 0;
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .paper-expand-hint:hover {
            color: #2563eb;
        }
        .dark .paper-expand-hint:hover {
            color: #60a5fa;
        }
        .paper-expand-hint .expand-arrow {
            display: inline-block;
            transition: transform 0.2s;
            font-size: 0.65rem;
            margin-right: 4px;
        }
        .paper-detail {
            border-top: 1px solid #e2e8f0;
            margin-top: 8px;
            padding-top: 8px;
        }
        .dark .paper-detail {
            border-top-color: #334155;
        }
        .paper-detail.hidden {
            display: none;
        }

        /* 可折叠部分样式 */
        .collapsible-header {
            cursor: pointer;
            display: flex;
            align-items: center;
            font-weight: 600;
            padding: 8px 0;
            user-select: none;
            color: #1e40af;
            transition: all 0.2s ease-in-out;
        }
        .dark .collapsible-header {
            color: #60a5fa;
        }
        .collapsible-header:hover {
            opacity: 0.8;
        }
        .collapsible-header::before {
            content: "▶";
            margin-right: 8px;
            transition: transform 0.3s ease;
            font-size: 0.8em;
        }
        .collapsible-header.open::before {
            transform: rotate(90deg);
        }
        .collapsible-content {
            display: none;
        }
        .collapsible-content.open {
            display: block;
        }
        .collapsible-content .inner {
            padding-top: 8px;
        }

        /* Markdown 内容样式 */
        .markdown-content {
            line-height: 1.6;
        }
        .markdown-content h1 {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 1em;
            margin-bottom: 0.5em;
            color: #1e40af;
        }
        .dark .markdown-content h1 {
            color: #60a5fa;
        }
        .markdown-content h2 {
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 0.8em;
            margin-bottom: 0.4em;
            color: #1e40af;
        }
        .dark .markdown-content h2 {
            color: #60a5fa;
        }
        .markdown-content h3 {
            font-size: 1.1em;
            font-weight: bold;
            margin-top: 0.6em;
            margin-bottom: 0.3em;
            color: #1e40af;
        }
        .dark .markdown-content h3 {
            color: #60a5fa;
        }
        .markdown-content h4 {
            font-size: 1em;
            font-weight: bold;
            margin-top: 0.5em;
            margin-bottom: 0.25em;
            color: #2563eb;
        }
        .dark .markdown-content h4 {
            color: #93c5fd;
        }
        .markdown-content p {
            margin-bottom: 0.8em;
        }
        .markdown-content ul, .markdown-content ol {
            margin-left: 1.5em;
            margin-bottom: 0.8em;
        }
        .markdown-content ul {
            list-style-type: disc;
        }
        .markdown-content ol {
            list-style-type: decimal;
        }
        .markdown-content li {
            margin-bottom: 0.3em;
        }
        .markdown-content code {
            background-color: #f1f5f9;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
        }
        .dark .markdown-content code {
            background-color: #334155;
        }
        .markdown-content pre {
            background-color: #f1f5f9;
            padding: 1em;
            border-radius: 5px;
            overflow-x: auto;
            margin-bottom: 0.8em;
        }
        .dark .markdown-content pre {
            background-color: #334155;
        }
        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
        }
        .markdown-content blockquote {
            border-left: 3px solid #cbd5e1;
            padding-left: 1em;
            margin-left: 0;
            margin-bottom: 0.8em;
            color: #64748b;
        }
        .dark .markdown-content blockquote {
            border-left-color: #475569;
            color: #94a3b8;
        }
        .markdown-content strong {
            font-weight: 600;
        }
        .markdown-content em {
            font-style: italic;
        }

        /* Tag filter button styles */
        .tag-btn {
            padding: 4px 14px;
            font-size: 0.875rem;
            border-radius: 9999px;
            border: 1px solid #cbd5e1;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .tag-btn:hover { border-color: #3b82f6; color: #3b82f6; }
        .tag-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .dark .tag-btn { border-color: #475569; color: #94a3b8; }
        .dark .tag-btn:hover { border-color: #60a5fa; color: #60a5fa; }
        .dark .tag-btn.active { background: #2563eb; color: white; border-color: #2563eb; }

        /* Tag badge styles */
        .tag-badge {
            display: inline-block;
            padding: 1px 6px;
            font-size: 0.7rem;
            border-radius: 9999px;
            background: #dbeafe;
            color: #1e40af;
            margin-right: 4px;
        }
        .tag-badge.tag-arxiv {
            background: #e0f2fe;
            color: #0369a1;
        }
        .dark .tag-badge { background: #1e3a5f; color: #7dd3fc; }
        .dark .tag-badge.tag-arxiv { background: #164e63; color: #67e8f9; }

        /* 作者机构上标样式 */
        .author-aff {
            vertical-align: super;
            font-size: 0.65em;
            color: #3b82f6;
            margin-left: 1px;
        }
        .dark .author-aff {
            color: #60a5fa;
        }

        /* TOC 侧边栏样式 - 固定在左侧 */
        #toc-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            z-index: 35;
            background: white;
            border-right: 1px solid #e2e8f0;
            transition: transform 0.3s ease;
            overflow: hidden;
        }
        .dark #toc-sidebar {
            background: #1e293b;
            border-right-color: #334155;
        }
        #toc-sidebar.collapsed {
            transform: translateX(-100%);
        }
        #toc-inner {
            padding: 1rem 0.5rem;
            height: 100%;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        #toc-inner::-webkit-scrollbar {
            width: 4px;
        }
        #toc-inner::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 2px;
        }
        .dark #toc-inner::-webkit-scrollbar-thumb {
            background: #475569;
        }
        .toc-date {
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toc-date:hover {
            background: #e2e8f0;
        }
        .dark .toc-date:hover {
            background: #334155;
        }
        .toc-date.active {
            background: #dbeafe;
            color: #1e40af;
        }
        .dark .toc-date.active {
            background: #1e3a5f;
            color: #93c5fd;
        }
        .toc-date-arrow {
            transition: transform 0.2s;
            font-size: 0.65rem;
        }
        .toc-date-arrow.open {
            transform: rotate(90deg);
        }
        .toc-papers {
            display: none;
            padding-left: 1.2rem;
        }
        .toc-papers.open {
            display: block;
        }
        .toc-paper {
            cursor: pointer;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.8rem;
            line-height: 1.4;
            color: #64748b;
            transition: background 0.15s, color 0.15s;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }
        .toc-paper:hover {
            background: #f1f5f9;
            color: #1e40af;
        }
        .dark .toc-paper {
            color: #94a3b8;
        }
        .dark .toc-paper:hover {
            background: #1e293b;
            color: #93c5fd;
        }
        .toc-paper.active {
            background: #eff6ff;
            color: #1d4ed8;
            font-weight: 500;
        }
        .dark .toc-paper.active {
            background: #1e3a5f;
            color: #93c5fd;
        }
        /* TOC 切换按钮 - 左侧 */
        #toc-toggle {
            position: fixed;
            left: 220px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 40;
            width: 28px;
            height: 56px;
            border-radius: 0 6px 6px 0;
            background: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 0 8px rgba(0,0,0,0.15);
            transition: left 0.3s ease, background 0.2s;
        }
        #toc-toggle:hover {
            background: #2563eb;
        }
        #toc-toggle svg {
            transition: transform 0.3s;
        }
        #toc-toggle:not(.sidebar-open) {
            left: 0;
        }
        @media (max-width: 1023px) {
            #toc-sidebar {
                width: 240px;
            }
            #toc-toggle {
                left: 240px;
            }
            #toc-toggle:not(.sidebar-open) {
                left: 0;
            }
        }
        @media (max-width: 767px) {
            #toc-sidebar {
                width: 260px;
                box-shadow: 4px 0 16px rgba(0,0,0,0.1);
            }
            #toc-toggle {
                left: 260px;
            }
            #toc-toggle:not(.sidebar-open) {
                left: 0;
            }
        }
    </style>
    <script>
        // Tailwind CSS 暗色模式配置
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>

    <script>
        const allPapers = {"2026-08-17": [{"name": "Evaluation, Benchmarking \u0026 Analysis", "count": 6, "papers": [{"title": "Not All Tokens Are Equal: Inflation-Aware Routing for Agentic LLM Systems", "arxiv_id": "2608.13571", "authors": "Heming Fu, Shan Lin, Qianqian Xie, Guojun Xiong", "summary": "When a language model fails to answer a query on the first attempt, an agentic system retries, consuming additional tokens each time. This retry overhead creates a gap between what a model's per-token price implies and what a full workflow actually costs. We call this gap \\emph{token inflation} and define it as the ratio of true workflow cost to single-call cost. Systems like FrugalGPT route based on the latter, which can underestimate real cost by more than $2\\times$ on difficult tasks. We address this with InflationAgent, a four-stage router that (1) measures token inflation systematically across model tiers and task types, finding inflation as high as $4.25\\times$ for a 7B model on multi-hop question answering; (2) introduces CoT Branching Entropy (CBE), a pre-execution difficulty signal computed entirely from local inference, which predicts high inflation with AUROC 0.887; and (3) selects models by maximizing a Semantic Exchange Rate (SER) that divides expected accuracy by predicted true cost, with a fresh-escalation policy that discards failed chains before routing to a stronger model. On GSM8K under a fixed budget, InflationAgent achieves 94.7\\% accuracy versus 91.0\\% for FrugalGPT while using 31\\% fewer tokens, and we show that forwarding a failed reasoning chain to GPT-4o reduces its accuracy by up to 34.8 percentage points, validating the fresh-escalation design.", "category": "cs.CL", "cluster": "Evaluation, Benchmarking \u0026 Analysis", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agentic LLMs)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是 **Token Inflation**（Token 膨胀），即在基于大语言模型（LLM）的 **Agentic Systems**（智能体系统）中，由于模型首次回答失败而触发的重试机制（Retries）所导致的实际工作流成本与单次调用成本估算之间的巨大差异。现有的路由系统通常假设模型只需单次调用即可完成任务，从而低估了复杂任务下的真实开销。这一问题的重要性在于，随着 **ReAct**、**Self-Consistency** 等需要多步推理或多次采样的智能体范式成为主流，重试已成为标准实践，但其产生的额外 Token 消耗在路由决策中往往是“隐形”的。如果忽略这种膨胀，路由系统可能会错误地将高难度查询分配给看似便宜但实际因频繁重试而成本高昂的小模型，导致预算浪费且准确率低下。解决这一问题带来的价值主要体现在两个方面：首先，通过引入 **Inflation-Aware Routing**（感知膨胀的路由），系统能够更准确地预测真实成本，从而在固定预算下实现更高的准确率（如在 GSM8K 数据集上，**InflationAgent** 比 **FrugalGPT** 准确率高出 3.7 个百分点，同时节省 31% 的 Token）；其次，研究揭示了 **Context Contamination**（上下文污染）现象，即失败的推理链会严重干扰后续更强模型的判断，因此提出了 **Fresh-Escalation**（全新升级）策略，证明了在升级模型时丢弃失败上下文对于保持高准确率至关重要。\n\n### § 2 前人工作与不足\n\n该问题在之前的研究中并未被充分解决，主要因为早期的路由工作大多基于“单次调用”的假设，未能适应现代智能体系统中普遍存在的重试机制。最相关的先前工作包括 **FrugalGPT**、**RouteLLM**、**Hybrid LLM** 以及 **LLM-Blender** 等。这些系统已经能够根据查询的复杂度、长度或人类偏好数据，将简单查询路由到小模型，将复杂查询路由到大模型，从而在单次调用场景下优化成本效益。然而，它们存在以下关键不足：\n\n1.  **成本估算模型的失效**：这些系统（如 **FrugalGPT**）将路由成本估算为“单价乘以单次调用的预期输出长度”。在智能体场景中，当模型首次回答错误并触发重试时，实际成本可能是单次估算的 2 到 5 倍（即 **Token Inflation**）。由于这些系统未显式建模重试开销，它们在处理困难任务时会严重低估小模型的真实成本，导致路由决策偏差。\n2.  **缺乏预执行难度预测机制**：虽然 **Self-Consistency** 等方法利用多次采样的一致性来评估置信度，但通常用于最终答案的聚合，而非作为路由前的成本预测信号。现有路由系统缺乏一种零成本（Zero-cost）的预执行信号来预测重试概率。本文提出的 **CoT Branching Entropy (CBE)** 填补了这一空白，它通过本地小模型采样推理链的熵来预测难度，而无需消耗 API 成本，这是先前工作所不具备的。\n3.  **忽视上下文污染效应**：现有的级联（Cascade）或升级（Escalation）策略通常假设将失败的上下文传递给更强模型是有益的或中性的。然而，本文发现，将小模型失败的推理链传递给大模型（如 GPT-4o）会导致准确率大幅下降（高达 34.8 个百分点）。先前的工作未定义或解决这一 **Context Contamination** 问题，导致其升级策略在智能体重试场景下效率低下。\n\n综上所述，先前工作的不足并非因为它们无法路由，而是因为其核心假设（单次调用成本准确、上下文传递无害）在 **Agentic LLM Systems** 的重试范式下失效，且缺乏对 **Token Inflation** 的量化与预测机制。", "core_insight": "### § 3 重建作者的思考路径\n\n在构建基于大语言模型（LLM）的智能体系统时，研究人员普遍观察到“重试”（retry）是解决复杂推理问题的标准范式，例如 ReAct 或 Self-Consistency 机制。然而，现有的路由系统（如 FrugalGPT）在优化成本时存在一个根本性的盲区：它们仅基于单次调用的 Token 价格进行估算，完全忽略了智能体在失败后多次重试所产生的累积开销。这种“单次调用成本”与“实际工作流成本”之间的巨大差异，导致路由策略在困难任务上严重低估了廉价小模型的真实代价，从而做出错误的模型选择。\n\n进一步观察发现，并非所有查询都会导致高昂的重试成本。困难查询往往具有特定的特征，例如需要多跳推理或存在歧义，这些特征会导致模型在生成思维链（Chain-of-Thought, CoT）时出现路径发散。如果能在执行前通过局部采样（local sampling）捕捉这种发散程度，就能以零 API 成本预测重试概率。此外，当小模型失败并升级到大模型时，直接将包含错误推理的上下文（context）传递给大模型往往会产生“上下文污染”（context contamination），反而降低大模型的准确率。因此，一个理想的路由器不仅需要预测真实的“通胀”成本，还需要在升级时采用“新鲜提示”（fresh prompt）策略，丢弃失败的中间状态，从而在固定预算下实现准确率与成本的最优平衡。\n\n### § 4 核心 Intuition\n\n传统路由系统失效的核心在于它们将“单次调用价格”等同于“任务完成成本”，忽视了智能体重试机制带来的隐性“Token 通胀”（Token Inflation），导致在困难任务上错误地选择了看似便宜实则昂贵的小模型。本方法的核心直觉是，通过局部采样计算思维链分支熵（CoT Branching Entropy, CBE）来无成本地预测这种通胀风险，并据此计算语义汇率（Semantic Exchange Rate, SER）以选择性价比最高的模型。同时，鉴于失败推理链会对后续模型产生负面干扰，系统在升级时必须丢弃历史上下文并采用新鲜提示（fresh escalation），从而在避免上下文污染的同时最大化单位成本的准确率。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法是 **InflationAgent**，一个旨在解决 Agentic LLM 系统中“Token Inflation”（Token 膨胀）问题的四阶段路由系统。Token Inflation 指的是由于模型重试（Retry）导致的实际工作流成本远高于单次调用预估成本的现象。InflationAgent 通过预测这种膨胀并据此进行成本感知的路由，以最大化 **Semantic Exchange Rate (SER)**。\n\n以下是一个具体的例子来讲解完整的 Pipeline：\n\n**场景设定**：\n用户输入一个复杂的数学推理问题（来自 GSM8K 数据集）：“如果 Alice 有 10 个苹果，给了 Bob 3 个，然后 Bob 又给了 Charlie 2 个，最后 Alice 还剩多少个？”（注：实际论文中问题更复杂，此处简化示意）。候选模型池包括：本地小模型 **Qwen2.5-7B**（低成本）、中等模型 **GPT-4o-mini**、大模型 **GPT-4o**（高成本）。\n\n**Pipeline 执行步骤**：\n\n1.  **Stage 1: 特征提取 (Feature Extraction)**\n    *   **输入**：用户的原始 Query。\n    *   **处理**：系统在本地硬件上分析 Query 的结构特征。提取包括 Token 数量、词汇多样性，以及暗示多跳推理（Multi-hop Reasoning）的线索（如嵌套的“who/which”结构或复杂的逻辑连接词）。\n    *   **输出**：一组结构特征向量。此阶段无 API 成本。\n\n2.  **Stage 2: 计算 CoT Branching Entropy (CBE)**\n    *   **输入**：原始 Query。\n    *   **处理**：系统使用本地小模型（Qwen2.5-7B）对该 Query 进行 $K=3$ 次独立的推理采样（Temperature $\\tau=0.7$）。提取每次采样的最终答案，计算答案分布的香农熵（Shannon Entropy），即 **CoT Branching Entropy (CBE)**。\n        *   *Intuition*：如果小模型对简单问题，3 次采样答案一致，CBE 低；如果问题难，答案发散，CBE 高。CBE 作为难度的代理指标。\n    *   **输出**：CBE 值、一致性分数（Agreement Score，即最高频答案的概率）、平均 Chain 长度。此阶段无 API 成本。\n\n3.  **Stage 3: 膨胀预测与路由决策 (Inflation Prediction \u0026 Routing)**\n    *   **输入**：Stage 1 和 Stage 2 提取的所有特征。\n    *   **处理**：\n        *   将这些特征输入一个轻量级的 **MLP (Multi-Layer Perceptron)** 预测器。\n        *   MLP 输出预测的 **Inflation Rate**（例如预测为 1.5x）。\n        *   计算每个候选模型的预估真实成本：$\\hat{C}_{true} = C_{direct} \\times \\text{Predicted Inflation}$。\n        *   计算每个模型的 **Semantic Exchange Rate (SER)**：$SER = \\frac{\\text{Expected Accuracy}}{\\hat{C}_{true}}$。\n        *   选择 SER 最高的模型。假设在此例中，虽然 Qwen2.5-7B 便宜，但预测膨胀率高且准确率预期低，导致 SER 不如 GPT-4o-mini，因此路由选择 **GPT-4o-mini**。\n    *   **输出**：选定的模型 $m^*$（GPT-4o-mini）和预测的膨胀率。\n\n4.  **Stage 4: 执行与 Fresh-Escalation (Execution \u0026 Fresh-Escalation)**\n    *   **输入**：Query 和选定的模型 $m^*$。\n    *   **处理**：\n        *   **首次尝试**：调用 GPT-4o-mini 进行推理（Greedy Decoding, $\\tau=0$）。\n        *   **情况 A（成功）**：如果回答正确，直接返回结果。\n        *   **情况 B（失败且膨胀超标）**：如果 GPT-4o-mini 回答错误，系统进入重试循环。如果实际发生的重试次数导致实际膨胀率超过预测值的 2 倍（例如预测 1.5x，实际已重试多次接近 3x），触发 **Fresh-Escalation Policy**。\n        *   **关键动作**：系统**丢弃**之前失败的推理 Chain（Context），生成一个全新的 Prompt（Fresh Prompt），并将任务升级（Escalate）到更强的模型（如 GPT-4o）。\n        *   *Intuition*：论文实验证明，将失败的 Chain 传给强模型会造成“Context Contamination”，降低强模型准确率。因此必须“Fresh”调用。\n    *   **输出**：最终的正确答案。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的理论证明，但其核心贡献在于重新定义了路由优化的目标函数，并引入了几个关键的量化指标。以下是核心公式及其 Intuition：\n\n1.  **Token Inflation (Token 膨胀率)**\n    $$ \\text{Inflation}(m, x) = \\frac{C_{true}(m, x)}{C_{direct}(m, x)} = \\frac{\\sum_{k=1}^{k^*} T_k(m, x)}{T_1(m, x)} $$\n    *   **理论背景**：传统路由系统（如 FrugalGPT）假设成本 $C$ 等于单次调用的 Token 数 $T_1$。但在 Agentic 系统中，模型可能重试 $k^*$ 次才成功。\n    *   **Intuition**：这个比率衡量了“重试带来的额外开销”。如果模型一次答对，Inflation = 1x；如果重试 5 次才答对，Inflation = 5x。这是导致“便宜模型变贵”的根本原因。\n\n2.  **CoT Branching Entropy (CBE)**\n    $$ \\text{CBE}(x) = -\\sum_{c} p_c \\log_2 p_c $$\n    *   **理论背景**：基于信息论中的香农熵。$p_c$ 是本地模型在 $K$ 次采样中输出答案 $c$ 的频率。\n    *   **Intuition**：CBE 衡量的是“推理路径的分歧程度”。\n        *   低熵（Low Entropy）：所有采样都指向同一个答案，说明问题简单，模型自信，重试概率低。\n        *   高熵（High Entropy）：采样结果分散，说明问题模糊或复杂，模型不确定，极可能需要多次重试（高 Inflation）。\n        *   **关键点**：CBE 是在本地小模型上计算的，**零 API 成本**，却能预测所有层级模型的重试概率。\n\n3.  **Semantic Exchange Rate (SER)**\n    $$ \\text{SER}(m, x) = \\frac{U(m)}{\\hat{C}_{true}(m, x)} = \\frac{U(m)}{C_{direct}(m, x) \\cdot \\widehat{\\text{Inflation}}(x)} $$\n    *   **理论背景**：这是路由的优化目标。$U(m)$ 是模型 $m$ 的预期准确率（Utility）。\n    *   **Intuition**：传统的“性价比”是 准确率 / 单次成本。SER 将其修正为 准确率 / **真实预期成本**。\n        *   一个模型可能单次调用很便宜（$C_{direct}$ 低），但如果它很难答对（Inflation 高），其 SER 就会很低。\n        *   路由系统选择 SER 最高的模型，意味着在单位真实成本下获得最高的准确率。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有的 LLM 路由系统（如 FrugalGPT）仅基于单次调用的 Token 价格进行路由，忽略了 Agentic 系统中因重试（Retry）导致的 **Token Inflation**（实际成本远高于预估成本）。这导致路由系统可能错误地选择看似便宜但实际因频繁重试而昂贵的模型，从而在固定预算下降低整体准确率。\n\n**2. 设计了什么实验验证这个问题？**\n*   **Inflation 量化实验**：在 GSM8K 和 HotpotQA 数据集上，对比不同模型层级（Qwen2.5-7B, GPT-4o-mini, GPT-4o）的实际工作流成本与单次调用预估成本，计算 Inflation Rate。\n*   **预测器有效性实验**：验证基于本地小模型计算的 **CBE** 和轻量级 **MLP** 能否准确预测 Inflation Rate（使用 Pearson r 和 AUROC 指标）。\n*   **路由性能对比实验**：在固定 Token 预算下，对比 InflationAgent 与基线方法（All-Small, FrugalGPT, Confidence Escalation）的准确率。\n*   **Context Contamination 消融实验**：验证“Fresh-Escalation”策略的必要性。对比将失败 Chain 传给强模型（Contaminated）与使用全新 Prompt（Fresh）对强模型准确率的影响。\n\n**3. 问题的答案是什么？**\n*   **Inflation 显著存在且差异巨大**：在困难任务（如 HotpotQA）上，小模型的 Inflation 可达 4.25x，意味着实际成本是预估的 4 倍以上。FrugalGPT 因此低估了实际成本约 110%。\n*   **CBE 是有效的零成本预测信号**：CBE 结合 MLP 预测器能以 AUROC 0.887 的高精度预测高 Inflation 查询，证明了本地推理分歧度与重试概率强相关。\n*   **InflationAgent 显著提升性价比**：在 GSM8K 固定预算下，InflationAgent 达到 94.7% 准确率，优于 FrugalGPT 的 91.0%，且节省了 31% 的 Token。\n*   **Fresh-Escalation 至关重要**：实验显示，将失败的推理 Chain 传给 GPT-4o 会导致其准确率下降 34.8 个百分点。因此，路由升级时必须丢弃旧 Context，使用 Fresh Prompt，否则强模型的性能会被严重污染。", "additional_insights": "### § 8 Take-aways\n\n现有 LLM 路由系统（如 FrugalGPT）基于单次调用的 token 成本进行决策，严重低估了 Agentic 系统中因重试（retry）产生的实际开销，这种差异被定义为 **token inflation**。在困难任务（如多跳问答）中，小模型的 token inflation 可达 4.25×，导致其名义上的低成本优势在实际工作流中完全消失，甚至不如直接调用大模型。论文提出 **CoT Branching Entropy (CBE)** 作为执行前的难度信号，通过本地小模型采样少量推理链并计算答案分布的香农熵，以零 API 成本预测重试概率，其 AUROC 达到 0.887。基于 CBE 和其他特征训练的轻量级 MLP 预测器能够准确估计 **Inflation**，进而计算 **Semantic Exchange Rate (SER)**（预期准确率除以预测的真实成本），从而选择性价比最高的模型。实验表明，在固定预算下，**InflationAgent** 在 GSM8K 上比 FrugalGPT 准确率高 3.7 个百分点，且节省 31% 的 token。关键发现是，将小模型失败的推理链（failed reasoning chain）直接传递给大模型会导致严重的 **context contamination**，使 GPT-4o 的准确率下降 34.8 个百分点，因此路由策略必须包含 **fresh-escalation** 机制，即在升级模型时丢弃失败上下文并重新发起请求。\n\n### § 9 最脆弱的假设\n\n该方法最核心的假设是：**基于本地小模型（如 Qwen2.5-7B）计算的 CoT Branching Entropy (CBE) 能够作为跨模型层级（tier）的通用难度代理，即小模型认为“难”（高熵）的问题，大模型也倾向于需要更多重试或面临更高的 token inflation。** 如果这一假设不成立，例如存在某些问题小模型因能力不足而发散（高 CBE），但大模型能轻松一次性解决（低 Inflation），或者反之，那么基于 CBE 的 Inflation 预测将产生系统性偏差，导致 SER 计算错误，进而路由到错误的模型。论文在 Section 4.3 提供了证据，显示 CBE 预测器在测试集上具有 0.714 的 Pearson 相关性和 0.887 的 AUROC，表明在小模型和大模型之间，推理链的一致性确实与最终的重试开销存在强相关性。然而，论文承认 MLP 预测器是在相同任务分布上训练和评估的，未充分验证其在跨任务分布（cross-task generalization）下的鲁棒性。如果实际应用场景中的任务类型与训练数据（GSM8K, HotpotQA）差异巨大，CBE 与 Inflation 之间的映射关系可能失效，导致路由决策崩溃。此外，该假设隐含了“小模型的困惑度/发散度”与“大模型的重试需求”是单调相关的，这在面对需要特定领域知识而非纯逻辑推理的任务时可能不成立。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 **Section 4.6 的 Context Contamination 实验**，以验证“失败推理链会损害下游大模型性能”这一关键 claim，这是支持 fresh-escalation 策略设计的核心依据。\n**数据**：从 GSM8K 测试集中随机抽取 50-100 个被 Qwen2.5-7B（或任何可用小模型）判定为错误的样本。\n**实现**：\n1. 使用小模型对这些样本进行推理，收集其失败的推理链（failed chains）。\n2. 构建两组提示词：Group A 为干净提示（仅包含原始问题）；Group B 为污染提示（原始问题 + 小模型的失败推理链）。\n3. 使用 GPT-4o-mini 或 GPT-4o 分别对这两组提示进行单次调用（greedy decoding）。\n**测量**：计算两组回答的准确率（Accuracy）。\n**结果判定**：如果 Group B 的准确率显著低于 Group A（例如下降超过 10-15 个百分点），则支持论文关于 context contamination 的 claim，证明 fresh-escalation 的必要性；如果两者无显著差异或 Group B 更高，则反驳该 claim，暗示简单的级联（cascade）可能优于 fresh-escalation，从而动摇 InflationAgent 的核心设计之一。此实验无需复现完整的路由器和 MLP 训练，仅需对比两种提示策略下的模型表现，计算成本低且结论直接。", "research_value": "### § 11 最强反例设计\n\n要挑战 **InflationAgent** 的有效性，最有力的攻击并非质疑其数学推导，而是攻击其核心假设——即 **CoT Branching Entropy (CBE)** 作为跨模型层级难度代理的普适性，以及 **Fresh-Escalation** 策略在复杂多步任务中的可行性。\n\n首先，设计一个“**能力鸿沟导致的假阳性难例**”（False-Positive Hardness due to Capability Gap）场景。选取一类对逻辑推理要求不高，但极度依赖特定领域知识（如最新法律条文、内部公司政策或高度专业化的医学指南）的任务。在此类任务中，本地小模型（如 Qwen2.5-7B）由于知识截止或训练数据覆盖不足，会产生完全随机且互不相关的推理链，导致 **CBE** 极高（高熵）。然而，对于拥有更新或更全知识库的大模型（如 GPT-4o），这些问题可能是“简单”的，能够一次性给出正确答案（低 **Inflation**）。在这种情况下，**InflationAgent** 会错误地预测高 **Inflation**，从而计算出小模型的 **Semantic Exchange Rate (SER)** 极低，进而将请求路由到大模型。虽然这避免了小模型的重试，但它未能利用小模型在简单逻辑任务上的低成本优势，反而因为过度保守的路由策略，在整体预算约束下降低了系统的吞吐量。更极端的情况是，如果存在一个中等模型（如 GPT-4o-mini）恰好拥有该领域知识且成本适中，**InflationAgent** 可能因为 CBE 预测的偏差而跳过它，直接路由到最贵的大模型，导致成本效率低于简单的基于置信度的级联策略。\n\n其次，攻击 **Fresh-Escalation** 策略在**多跳推理（Multi-hop Reasoning）**中的破坏性。论文声称失败的推理链会造成 **Context Contamination**，因此必须丢弃。然而，在复杂的数学或逻辑证明中，推理过程往往是累积性的。小模型可能在第一步正确，但在第二步出错。如果采用 **Fresh-Escalation**，大模型必须从头开始重新推导所有步骤，这不仅浪费了大模型的计算资源（因为它需要重复小模型已经正确完成的部分工作），还可能导致大模型在重新推导时陷入不同的错误路径。相比之下，一种“**部分上下文继承**”（Partial Context Inheritance）策略，即只传递小模型验证过的中间步骤（Intermediate Steps）而非完整的失败 Chain，可能比完全丢弃上下文更高效。如果实验证明，在 GSM8K 或 HotpotQA 的子集中，保留正确的中间推理步骤能显著降低大模型的 **Inflation** 并提高准确率，那么 **Fresh-Escalation** 的“一刀切”设计就显得过于粗糙且低效，从而削弱 **InflationAgent** 的核心创新价值。\n\n### § 12 Follow-up Research Idea\n\n基于 **InflationAgent** 将路由视为静态成本优化问题的局限，提出一个新的研究方向：**Dynamic Inflation-Aware Orchestration via Reinforcement Learning (DIAO-RL)**。\n\n**(a) 驱动局限与未满足需求**：\n现有工作（包括 **InflationAgent**）将路由决策建模为基于特征预测的静态映射（Feature-based Prediction），假设 **Inflation** 是查询本身的固有属性，且模型能力是固定的。然而，在真实的 **Agentic Systems** 中，**Inflation** 是动态的，取决于模型在推理过程中的实时状态（如自我怀疑、工具调用失败）。此外，**Fresh-Escalation** 是一种开环策略，缺乏对“何时升级”的最优控制。我们需要一个能够根据实时反馈动态调整策略的框架，而不仅仅是预测初始难度。\n\n**(b) 借鉴相邻领域的方法**：\n借鉴**部分可观测马尔可夫决策过程（POMDP）**和**离线强化学习（Offline RL）**。将 Agentic 工作流建模为一个 POMDP，其中状态包括当前推理步骤、已消耗的 Token、以及模型输出的置信度信号（如 Log-probability 或 Self-Consistency 得分）。动作空间包括：继续当前模型推理、重试当前模型、升级到更强模型（Fresh 或 Partial Context）、或终止并返回错误。奖励函数定义为负的成本（Token 消耗）加上准确率的增益。利用历史轨迹数据（包含成功和失败的重试记录）训练一个策略网络，使其学会在“探索更便宜的模型”和“利用更可靠的模型”之间进行权衡。\n\n**(c) 第一个实验设计**：\n构建一个包含 **GSM8K** 和 **HotpotQA** 的混合数据集，记录每个查询在不同模型层级上的完整推理轨迹（包括每一步的 Token 消耗和中间答案）。训练一个 **DIAO-RL** 代理，与 **InflationAgent** 进行对比。关键指标不仅是最终的准确率和总 Token 消耗，还包括“**决策延迟**”（Decision Latency，即从查询输入到最终路由决策的时间）和“**自适应能力**”（Adaptability，即在分布外任务上的表现）。预期结果是，**DIAO-RL** 能够在简单任务上快速收敛于小模型，而在复杂任务上动态地、逐步地升级模型，而不是像 **InflationAgent** 那样在初始阶段就做出可能过于保守或激进的一次性路由决策。这将揭示动态策略在应对 **Token Inflation** 不确定性方面的优势，并为未来的自适应 Agentic 系统提供新的范式。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Heming Fu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Shan Lin\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Qianqian Xie\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Guojun Xiong\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Stony Brook University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Wuhan University\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Shanghai Jiao Tong University\"\n    }\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "当语言模型在首次尝试中未能回答查询时，智能体系统会进行重试，每次重试都会消耗额外的 token。这种重试开销造成了模型基于每 token 价格所暗示的成本与实际完整工作流成本之间的差距。我们将这一差距称为 token inflation，并将其定义为真实工作流成本与单次调用成本之比。像 FrugalGPT 这样的系统基于后者进行路由，这在困难任务上可能会低估超过 2 倍的真实成本。我们通过 InflationAgent 来解决这一问题，这是一个四阶段路由器，它：(1) 系统地测量不同模型层级和任务类型下的 token inflation，发现 7B 模型在多跳问答任务上的通胀率高达 4.25 倍；(2) 引入了 CoT Branching Entropy (CBE)，这是一种完全基于本地推理计算得出的执行前难度信号，能以 0.887 的 AUROC 预测高通胀情况；以及 (3) 通过最大化语义汇率 (Semantic Exchange Rate, SER) 来选择模型，该汇率将预期准确率除以预测的真实成本，并采用一种新鲜升级策略，即在路由到更强模型之前丢弃失败的推理链。在固定预算下的 GSM8K 数据集上，InflationAgent 实现了 94.7% 的准确率，而 FrugalGPT 为 91.0%，同时 token 使用量减少了 31%。我们还表明，将失败的推理链转发给 GPT-4o 会使其准确率降低多达 34.8 个百分点，从而验证了新鲜升级设计的有效性。"}, {"title": "TimeSage-EV: A Live Benchmark for Agentic Time Series Analysis in Evolving Environments", "arxiv_id": "2608.14270", "authors": "Qingren Yao, Yaxuan Kong, Yuqi Nie, Yichen Li, Stefan Zohren, Anna Vettoruzzo, Qingsong Wen, Ming Jin, Joaquin Vanschoren", "summary": "Time series analysis in high-stakes domains relies on recurring data releases, where new observations can alter the evidence base and the validity of later conclusions. Existing time series QA benchmarks mostly rely on fixed snapshots, leaving temporal validity and cutoff-aware evidence use unevaluated. We introduce TimeSage-EV, a live benchmark for agentic time series analysis in evolving environments. It tracks 60 real institutional scenarios across 6 domains, comprising 1,485 scenario-period QA pairs from Feb 2023 to May 2026 and spanning monthly, weekly, daily, and irregular release cadences. At each period, large language model (LLM) agents receive time series data and source reports, while the withheld target release provides ground truth. TimeSage-EV evaluates state identification, data summarization, and outlook reasoning. Experiments with frontier LLM agents and TimeSage-1.0, a novel self-evolving agent with a reusable analytical skill library, reveal significant performance gaps across model tiers and recurring failures in temporal validity, exogenous context use, and adaptation. We release TimeSage-EV as a research resource with monthly updates, code, a leaderboard, and failure-mode analyses.", "category": "cs.AI", "cluster": "Evaluation, Benchmarking \u0026 Analysis", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Self-Evolving/Self-Improving, LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在**Evolving Environments**（动态演变环境）中，如何评估 **Agentic Time Series Analysis**（智能体时间序列分析）的能力？具体而言，即大型语言模型（LLM）智能体能否在严格遵循 **Temporal Cutoff**（时间截断）约束的前提下，随着新数据的周期性发布，持续更新历史上下文、综合数值趋势与机构报告，并生成具有 **Temporal Validity**（时间有效性）的分析结论。\n\n这一问题的重要性源于现实世界中高 stakes 领域（如金融、公共卫生、交通）的分析工作本质上是 **Recurring Workflow**（重复性工作流），而非静态预测任务。分析师必须不断摄入新发布的 **Data Releases**（数据发布），更新证据库，并合成数值与文本信息。然而，现有的评测基准大多基于 **Fixed Snapshots**（固定快照），无法评估智能体在证据分布随时间推移而改变时的适应能力，也无法检验其是否严格遵守了 **Timestamp-aware Information Cutoffs**（基于时间戳的信息截断）。如果智能体无法正确处理 **Cutoff-valid Evidence**（截断有效证据），它们可能会利用未来信息（Look-ahead Bias）或产生 **Temporal Misuse**（时间误用），导致在真实部署中产生误导性结论。\n\n解决这一问题具有显著价值：首先，它填补了 **Live Benchmark**（实时基准）在时间序列分析领域的空白，提供了一个包含 60 个真实机构场景、1,485 个 **Scenario-period QA Pairs**（场景-周期问答对）的评测资源，涵盖从 2023 年 2 月至 2026 年 5 月的数据。其次，通过引入 **Multi-axis Evaluation Protocol**（多轴评估协议），该研究能够区分智能体是真正理解了动态证据，还是仅仅生成了流畅但缺乏依据的报告（Fluent but weakly grounded reports）。最后，实验揭示了当前前沿 LLM 在 **Memory Management**（记忆管理）、**Exogenous Context Use**（外生上下文使用）和 **Adaptation**（适应性）方面的显著缺陷，为开发可靠的、具备长期推理能力的分析智能体提供了诊断指导。\n\n### § 2 前人工作与不足\n\n尽管已有大量研究涉及时间序列分析和智能体评测，但针对 **Agentic Time Series Analysis in Evolving Environments** 的评测仍存在关键缺口。现有的工作主要分为两类，且均存在明显不足：\n\n第一类是 **Language-grounded Time Series Analysis** 基准，如 **ChatTime-TSQA**、**TimeMQA**、**TSRBench** 和 **TimeSeriesExam**。这些基准主要测试智能体对时间序列的 **Temporal Reasoning**（时间推理）能力，通过自然语言问题评估模型对数值模式的理解。然而，它们的局限性在于通常构建的是基于预定义时间序列任务的 **Fixed QA Pairs**（固定问答对），即证据是静态的，任务是一次性的。它们未能模拟 **Evolving Workflows**（演变工作流），即智能体需要在多个周期内反复访问同一场景，随着新数据的到来不断更新判断。因此，这些基准无法评估智能体在证据累积和变化过程中的 **State Identification**（状态识别）更新能力和 **Report Faithfulness**（报告忠实度）。\n\n第二类是 **Agent-centric Benchmarks**，如 **WebArena**、**GAIA**、**SWE-bench** 以及 **LiveBench** 和 **ForecastBench** 等实时基准。这些基准评估智能体的 **Tool Use**（工具使用）、**Web Navigation**（网页导航）、**Multi-hop Retrieval**（多跳检索）和 **Code Execution**（代码执行）能力。**LiveBench** 和 **ForecastBench** 虽然引入了 **Live**（实时）元素以减少数据污染，但它们主要关注通用知识或预测结果的准确性，而非时间序列分析特有的 **Recurring Data Releases**（周期性数据发布）和 **Cumulative Numerical-Documentary Evidence**（累积的数值-文档证据）。它们很少要求智能体跟踪 **Time-indexed Evidence**（时间索引证据），比较新观测值与历史上下文，并将时间序列与机构报告进行综合。\n\n前人工作之所以未能覆盖这一领域，主要原因在于 **Evolving Environment** 的构建难度极高。它要求数据源具有稳定的机构背景和固定的发布节奏，且每个目标周期必须实施严格的 **Information Cutoff**（信息截断），即智能体只能访问目标发布之前的累积数据和文档，而目标发布本身需被扣留用于构建 **Ground Truth**（地面真值）。此外，评估不能仅限于封闭形式的选择，必须同时评估关键分析任务和人类可读的报告，这需要设计能够分离 **Factual Correctness**（事实正确性）与 **Report Faithfulness**（报告忠实度）的复杂指标。由于这些要求涉及复杂的 **Temporal Isolation**（时间隔离）和 **Traceable Evidence**（可追溯证据）管理，现有的静态或通用智能体基准无法直接适用，导致该领域长期缺乏专门的评测标准。", "core_insight": "### § 3 重建作者的思考路径\n\n在构建 TimeSage-EV 之前，研究者首先观察到时间序列分析（Time Series Analysis）在金融、公共卫生等高 stakes 领域并非静态预测任务，而是一个随着新数据发布不断迭代的动态工作流。现有的基准测试（如 ChatTime, TimeMQA）大多基于固定的历史快照（fixed snapshots），评估模型在静态数据上的推理能力，却忽略了真实场景中证据分布随时间推移而发生的根本性变化。同时，虽然 Agent 基准测试（如 WebArena, LiveBench）引入了动态环境和工具使用，但它们缺乏对时间索引证据（time-indexed evidence）的严格约束，未能考察 Agent 如何在信息截止点（information cutoff）下区分“已知”与“未知”，以及如何处理累积的历史上下文。\n\n研究者进一步意识到，现有的评估体系存在两个关键缺陷：一是缺乏对“时间有效性”（temporal validity）的考察，即 Agent 是否错误地使用了未来发布的数据或报告；二是缺乏对“报告忠实度”（report faithfulness）与“答案准确性”（answer accuracy）的解耦评估，导致模型可能生成流畅但缺乏证据支撑的幻觉报告。此外，长期部署中的记忆管理（memory management）和状态更新（state update）是 Agent 面临的巨大挑战，现有基准无法模拟这种跨周期的状态演化。\n\n基于这些观察，研究者提出需要一个新的基准，能够模拟“演化环境”（evolving environments），其中每个评估周期都有严格的信息隔离（temporal isolation），Agent 必须仅基于截止前的累积数据（cumulative data）和文档进行推理，并随着新数据的到来不断更新判断。这要求基准不仅包含数值时间序列，还要整合机构发布的文本报告，并设计能够追踪证据来源、防止未来信息泄露（leakage prevention）的评估协议。最终，这一思考路径导向了 TimeSage-EV 的设计：一个包含多领域、多发布频率、具有严格时间截止约束的 Live Benchmark，旨在诊断 Agent 在动态证据环境下的长期推理、记忆管理和报告生成能力。\n\n### § 4 核心 Intuition\n\nTimeSage-EV 的核心直觉在于，真实世界的时间序列分析是一个受严格时间截止（cutoff-aware）约束的动态过程，而非静态的数据查询。现有方法失效是因为它们允许模型访问全量历史或未来信息，掩盖了 Agent 在信息不完整和证据演化时的推理缺陷。该方法奏效的关键在于通过“时间隔离”（temporal isolation）强制 Agent 仅基于截止前的累积证据进行推理，并随着新数据的发布不断修正判断，从而真实反映其在演化环境中的适应能力和证据使用纪律。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nTimeSage-EV 的核心方法是将时间序列分析建模为**Agentic Time Series Analysis in Evolving Environments**（演化环境中的智能体时间序列分析）。其核心在于模拟真实世界中分析师面对周期性数据发布（Recurring Data Releases）时的工作流：随着新数据的到来，证据库（Evidence Base）不断更新，智能体必须在严格的时间截断（Time Cutoff）约束下，仅利用截至当前时刻的历史数据生成分析，并随着时间推移持续修正其判断。\n\n完整的 Pipeline 包含数据构建、智能体交互与评估三个主要阶段，以下以 **ENSO（厄尔尼诺-南方涛动）气候监测** 场景为例进行详解：\n\n**1. 数据构建与实例化（Benchmark Construction）**\n*   **源数据收集与过滤**：系统从公共机构（如 NOAA CPC）获取具有固定发布周期的数据源。对于 ENSO 场景，数据源包括 Oceanic Niño Index (ONI) 的时间序列数据和每月的诊断报告。\n*   **时间隔离（Temporal Isolation）**：这是最关键的一步。对于目标时期 $t_k$（例如 2024年11月），系统构建一个“证据包”：\n    *   **可见部分**：截至 $t_k$ 的累积时间序列数据（`timeseries.csv`）以及 $t_k$ 之前发布的所有历史报告（`gt_source/\u003Cprior\u003E.*`）。\n    *   **隐藏部分**：$t_k$ 当期的官方报告被严格 withheld（扣留），仅用于构建 Ground Truth（GT）和验证，智能体无法访问。\n*   **问题生成**：基于难度层级（Easy/Medium/Hard），生成结构化问题。例如 Hard 层级可能要求判断当前的 ENSO 警报状态、未来三个月的展望、主要驱动因素及不确定性。\n\n**2. 智能体交互流程（Agent Interaction）**\n*   **输入（Input）**：智能体（如基于 LLM 的 Agent）接收当前时期的任务提示、累积的时间序列 CSV 文件、历史报告文档以及预定义的答案 Schema（JSON 格式）。\n*   **处理（Processing）**：\n    *   **工具使用**：智能体调用 Python 代码执行工具读取 CSV，计算统计量（如 Niño 3.4 区域的平均海温异常值）。\n    *   **证据检索**：智能体阅读历史报告，提取与当前数据趋势相关的上下文信息（如 Walker 环流的变化）。\n    *   **推理与截断遵守**：智能体必须严格遵守“不引用未来信息”的规则。它结合数值趋势和历史文档，推断当前的 ENSO 状态（如 La Niña Watch）及未来展望。\n    *   **输出生成**：智能体生成两部分输出：\n        1.  **Structured Answer**：符合 Schema 的 JSON 对象，包含具体的分类标签、数值等。\n        2.  **Free-form Report**：一份自然语言分析报告，解释结论的依据。\n*   **输出（Output）**：智能体通过 `final_answer` 工具提交上述两部分内容。\n\n**3. 多维评估（Evaluation Protocol）**\n系统从四个维度对输出进行评分（0-100分）：\n*   **Keypoint Accuracy**：结构化答案中的关键事实（如警报状态）是否与 Ground Truth 完全匹配。\n*   **Keypoint Coverage**：自由文本报告中是否涵盖了所有要求的关键点（通过 LLM Judge 判断）。\n*   **Report Faithfulness**：报告中的每一个原子性主张（Atomic Claim）是否都能在当前可见的证据（时间序列或历史报告）中找到支持，严禁幻觉或引用未来信息。\n*   **Report Quality**：报告的写作质量，包括结构、清晰度和是否符合专业分析报告的体裁规范。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过**。\n\n本文主要贡献在于基准测试（Benchmark）的构建、评估协议的设计以及智能体工作流的实证分析，而非提出新的数学模型或算法推导。文中涉及的公式主要用于形式化定义任务环境（如环境状态 $E_s$、时期实例 $I_{t_k}$ 等），属于符号定义而非复杂的数学推导过程，因此不涉及需要深入解释的理论背景或公式直觉。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 前沿 LLM 在演化环境中的能力边界是什么？**\n*   **设计了什么实验**：在 TimeSage-EV 基准上，评估了包括 GPT-5.4, Sonnet-4.6, Qwen-3.5 等在内的多个前沿 LLM Agent。实验涵盖 Easy（状态识别）、Medium（变化检测）、Hard（归因与预测）三个难度层级，并对比了独立评估（Independent Evaluation）与序列评估（Sequential Evaluation，允许记忆累积）的表现。\n*   **问题的答案**：\n    *   **性能分层明显**：所有模型在 Easy 任务上表现接近饱和（\u003E92分），但在 Hard 任务上显著下降（最高仅 72.7分），表明当前 LLM 在处理需要结合数值趋势与文档解释的复杂归因和预测任务时存在瓶颈。\n    *   **效率与性能权衡**：GPT-5.4 以最低的 Token 消耗获得了最高分，表明推理效率在长周期时间序列分析中至关重要。\n    *   **长期记忆的双刃剑**：在序列评估中，强模型（如 Qwen-3.5）能从记忆中受益，但弱模型（如 Gemma-4-31B）在后期表现反而下降，说明如果模型无法有效管理上下文，累积的历史信息会成为负担（Context Overload）。\n\n**2. 智能体在演化环境中存在哪些主要失败模式（Failure Modes）？**\n*   **设计了什么实验**：对模型输出进行细粒度的错误分析，分类统计推理失败、时间误用和报告不完整等情况。\n*   **问题的答案**：\n    *   **Reasoning Failure**：包括推理超时（Reasoning Overrun）和指令漂移（Instruction Drift），即模型在长上下文中忘记代码执行协议或约束。\n    *   **Temporal Misuse**：模型经常错误读取时间戳、计算错误的时间窗口，或在预测时引用了不符合时间截断原则的证据，表明“时间接地”（Temporal Grounding）是核心难点。\n    *   **Incomplete Reporting**：模型虽然能计算出正确的结构化答案，但在生成报告时遗漏关键要点或未能将结论与证据充分挂钩。\n\n**3. 自演化技能库（Self-Evolving Skill Library）能否提升智能体性能？**\n*   **设计了什么实验**：提出了 **TimeSage-1.0**，这是一个基于 smolagent 框架并增强了“技能归纳（Skill Induction）”和“技能复用（Skill Reuse）”机制的智能体。实验对比了启用技能库前后的性能、Token 消耗及技能调用频率。\n*   **问题的答案**：\n    *   **性能提升**：引入可复用技能后，整体性能提升，特别是在 Medium 和 Hard 难度任务上增益明显（Hard 任务提升约 6.8分）。\n    *   **效率优化**：技能复用减少了重复代码生成，将 Token 成本降低至原来的 0.82倍。\n    *   **局限性**：技能的归纳和复用主要集中在早期时期，随着时间推移，维持一个高效且不过时的技能库仍然具有挑战性，表明当前的自演化机制在长周期适应性上仍有改进空间。", "additional_insights": "### § 8 Take-aways\n\nTimeSage-EV 定义了 **agentic time series analysis in evolving environments** 这一新任务，强调 Agent 必须在严格的时间截断（cutoff-aware）约束下，利用累积的历史时间序列数据和文档证据进行周期性分析，而非处理静态快照。该基准包含 60 个来自农业、气候、能源等 6 个领域的真实机构场景，涵盖 1,485 个场景-周期 QA 对，并通过自动化脚本每月更新以保持其 **live benchmark** 特性。评估协议采用四维指标：**keypoint accuracy**（结构化答案准确性）、**keypoint coverage**（报告关键点覆盖度）、**report faithfulness**（报告对证据的忠实度）和 **report quality**（报告写作质量），从而区分计算正确性与报告生成的可靠性。实验显示，前沿 LLM Agent 在简单的状态识别任务上表现优异，但在需要归因（attribution）和预测（forecast）的困难任务上存在显著性能差距，且普遍存在 **temporal misuse**（时间误用）和 **reasoning failure**（推理失败）等故障模式。引入 **TimeSage-1.0** 这一具备自进化技能库（self-evolving skill library）的 Agent 表明，将推理轨迹转化为可复用技能能显著提升中难任务的性能并降低 Token 消耗，但技能维持仍具挑战性。研究揭示，当前 Agent 的主要瓶颈并非数据访问能力，而是长期记忆管理、时间对齐以及将数值变化与文档证据进行因果关联的能力。\n\n### § 9 最脆弱的假设\n\n该论文最核心的假设是：**基于公共机构发布的、具有固定发布周期的时间序列数据和文档，能够充分代表“高风险领域”中 Agent 所需处理的真实分析工作流，且这种“时间隔离”（temporal isolation）的评估设置能有效反映 Agent 在动态环境中的实际可靠性。**\n\n如果这一假设不成立，即真实世界的高风险分析往往依赖于非结构化、非周期性、私有或实时流式数据，且分析师经常利用“事后诸葛亮”式的上下文进行修正，那么 TimeSage-EV 的评估结果将严重高估或低估 Agent 的实际效用。具体而言，该假设在实际中可能不成立的原因包括：1）许多关键决策场景（如金融高频交易、突发公共卫生事件）的数据发布是不规则或实时的，而非固定的月度/周度快照；2）真实分析师往往拥有比基准中提供的更丰富的上下文（如内部备忘录、非公开数据），而基准严格限制仅使用公开文档，可能导致 Agent 在基准上表现良好但在缺乏足够公开证据的真实场景中失效；3）基准依赖的“地面真值”（ground truth）来自机构报告，这些报告本身可能包含滞后性或主观判断，而非客观事实，导致评估标准本身存在偏差。\n\n论文为这一假设提供的证据主要是展示了 60 个场景覆盖了 6 个不同领域和多种发布频率（月、周、日、不规则），并强调了数据来源的权威性和可追溯性。然而，论文缺少对“非周期性”或“私有数据”场景的泛化性验证，也未深入探讨机构报告作为 ground truth 的主观性对评估公平性的影响。如果 Agent 在真实世界中需要处理的是噪声更大、结构更松散的数据，其在 TimeSage-EV 上表现出的“忠实度”和“准确性”可能无法迁移。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 **TimeSage-EV 中一个单一场景（如 ENSO 气候分析）的“时间截断”评估流程，以验证 LLM Agent 在严格 cutoff 约束下的 temporal validity 和 faithfulness。**\n\n**具体步骤：**\n1.  **数据准备**：从 NOAA CPC 网站下载 ENSO 诊断报告（HTML/PDF）和 Niño 3.4 指数时间序列数据（CSV）。选择一个特定历史时期（如 2024 年 6 月），手动构建该时期的“输入包”：包含截至 2024 年 5 月的所有历史时间序列数据和 2024 年 5 月及之前的所有诊断报告。严格排除 2024 年 6 月的报告。\n2.  **实现**：使用一个简单的 LLM Agent 框架（如 LangChain 或 smolagent），配置一个基础模型（如 GPT-4o 或 Claude 3.5 Sonnet）。编写提示词，要求 Agent 根据输入包回答两个问题：(a) 当前 ENSO 状态（El Niño/La Niña/Neutral）；(b) 支持该判断的关键海洋和大气证据。\n3.  **测量**：\n    *   **Temporal Validity**：检查 Agent 的回答是否引用了 2024 年 6 月报告中的信息（即“未来泄露”）。可以通过在提示词中故意插入一个只有 6 月报告才有的独特关键词，看 Agent 是否提及。\n    *   **Faithfulness**：将 Agent 生成的证据陈述与 2024 年 5 月及之前的报告进行比对，计算有多少陈述能在历史文档中找到直接支持。\n4.  **结果判定**：\n    *   **支持 Claim**：如果 Agent 在没有 6 月报告的情况下，仍能基于 5 月数据做出合理预测，且所有证据引用均严格来自 5 月及之前的文档，无未来信息泄露，则支持论文关于 Agent 需要严格 cutoff 管理的观点。\n    *   **反驳 Claim**：如果 Agent 频繁引用“未来”信息（即使提示词禁止，也可能通过内部知识泄露），或者其证据引用大量依赖通用知识而非提供的文档，则表明当前的 cutoff 机制在实际执行中难以保证，或 Agent 的 faithfulness 评估过于乐观。\n\n此实验无需复现整个 60 场景的基准，仅通过单场景即可验证论文核心的“时间隔离”和“证据忠实度”评估的有效性。", "research_value": "### § 11 最强反例设计\n\n要挑战 TimeSage-EV 的有效性，最有力的反例并非证明 LLM 无法完成简单任务，而是揭示其评估协议在**Epistemic Uncertainty**（认识论不确定性）和**Non-stationary Data Distributions**（非平稳数据分布）下的系统性失效。具体而言，可以设计一个基于**Regime Shift**（体制转换）的反例场景：选择一个在历史数据中表现出高度稳定性，但在目标时期 $t_k$ 发生结构性断点（Structural Break）的场景（例如，某国突然改变货币政策导致通胀数据与历史趋势完全脱钩，或气候模型中未包含的极端反馈回路）。\n\n在此反例中，TimeSage-EV 的 **Ground Truth** 依然依赖于机构发布的滞后报告，而该报告本身可能因为数据清洗延迟或模型更新滞后，未能立即反映真实的物理或经济状态。如果 LLM Agent 能够利用其预训练知识中的**Exogenous Knowledge**（外生知识）——例如实时新闻流中关于政策突变的信息（尽管这些不在基准的“可见证据”中，但属于模型内部参数记忆）——它可能会生成一个比基于历史截断数据推导出的“官方”结论更准确、更符合当前现实的预测。\n\n此时，TimeSage-EV 的评估协议将产生**False Negative**（假阴性）：Agent 因为引用了“未来”或“外部”信息而被判定为 **Temporal Misuse** 或 **Unfaithful**，尽管其结论在真实世界中是正确的。这证明了该基准的核心缺陷：它混淆了**Procedural Compliance**（程序合规性，即严格遵守 cutoff）与**Analytical Correctness**（分析正确性）。在真实的高 stakes 决策中，分析师往往需要结合非结构化、非周期性的实时信号来修正基于历史数据的结论。如果基准强制要求 Agent 仅使用滞后的、结构化的历史快照，那么它实际上是在测试 Agent 的**Obedience**（服从性）而非**Insight**（洞察力）。此外，可以论证 **Self-Evolving Skill Library** 在 Regime Shift 下会加剧错误，因为旧的技能（基于旧分布归纳）会被错误地复用，导致 **Negative Transfer**（负迁移），而基准缺乏对这种“技能过时”的细粒度诊断，从而高估了 Agent 的适应能力。\n\n### § 12 Follow-up Research Idea\n\n基于 TimeSage-EV 在**Temporal Grounding**（时间接地）和**Evidence Faithfulness**（证据忠实度）上的局限，提出一个新的研究方向：**Counterfactual Temporal Robustness Benchmarking**（反事实时间鲁棒性基准测试）。\n\n**(a) 驱动局限与需求**：\n现有工作（包括 TimeSage-EV）主要关注 Agent 在给定历史证据下的**Reconstruction**（重构）或**Extrapolation**（外推）能力，但忽略了 Agent 对**Causal Mechanisms**（因果机制）的理解。在动态环境中，真正的挑战不是“根据过去预测未来”，而是“当过去的关键假设被证伪时，Agent 能否快速修正其推理链条”。TimeSage-EV 的静态 cutoff 无法评估 Agent 在面对**Data Contamination**（数据污染）或**Retraction**（数据撤回）时的**Resilience**（韧性）。现实世界中，数据发布后常被修正，分析师必须具备**Dynamic Belief Updating**（动态信念更新）能力，而不仅仅是累积记忆。\n\n**(b) 借鉴领域与方法**：\n借鉴**Causal Inference**（因果推断）中的**Do-calculus**（Do-演算）和**Counterfactual Reasoning**（反事实推理）框架，以及**Scientific Discovery**（科学发现）领域中的**Hypothesis Testing**（假设检验）流程。引入**Interventional Evaluation**（干预性评估），即在 Agent 生成初步结论后，动态注入“修正数据”或“矛盾证据”，观察 Agent 是否能识别冲突、追溯错误根源并重构报告，而不是简单地追加新信息。\n\n**(c) 第一个实验设计**：\n构建一个**Dynamic Evidence Injection**（动态证据注入）实验。\n1.  **Phase 1 (Baseline)**：Agent 基于 $t_{k-1}$ 的数据生成关于某经济指标的报告（类似 TimeSage-EV 的标准流程）。\n2.  **Phase 2 (Intervention)**：在 $t_k$ 时刻，不直接提供完整的新报告，而是提供一个**Partial Correction**（部分修正）或**Anomaly Alert**（异常警报），指出 $t_{k-1}$ 数据中的某个关键统计量存在系统性偏差（例如，采样误差导致均值高估 5%）。\n3.  **Phase 3 (Re-evaluation)**：要求 Agent 重新评估其之前的结论。评估指标不再是简单的 Accuracy，而是**Correction Latency**（修正延迟，即需要多少步推理才能识别错误）、**Root Cause Identification**（根源识别，是否找到了导致偏差的具体数据点）和**Consistency Maintenance**（一致性维护，修正后的报告是否与剩余未修正的证据逻辑自洽）。\n\n**与已有工作的区别**：\nTimeSage-EV 是**Passive Accumulation**（被动累积）范式，假设证据是静态且正确的；本提议是**Active Verification**（主动验证）范式，假设证据是动态且可能有误的。这从测试 Agent 的“记忆与检索”能力，转向测试其“批判性思维与自我纠错”能力，更贴近真实世界中高级分析师的核心价值。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Qingren Yao\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Yaxuan Kong\",\n      \"affiliations\": [\n        2,\n        3\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Yuqi Nie\",\n      \"affiliations\": [],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yichen Li\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Stefan Zohren\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Anna Vettoruzzo\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Qingsong Wen\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Ming Jin\",\n      \"affiliations\": [\n        5\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Joaquin Vanschoren\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Eindhoven University of Technology\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"University of Oxford\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"VulpiVox Intelligence\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Squirrel Ai Learning\"\n    },\n    {\n      \"id\": 5,\n      \"name\": \"Griffith University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal contribution.\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding author.\"\n    }\n  ]\n}\n```", "summary_translation": "在高利害领域的时间序列分析依赖于定期的数据发布，其中新的观测值可能改变证据基础及后续结论的有效性。现有的时间序列问答基准大多依赖固定快照，导致时间有效性和对截止日期的感知性证据使用未被评估。我们引入了 TimeSage-EV，这是一个用于动态环境中智能体时间序列分析的实时基准。它追踪了跨越 6 个领域的 60 个真实机构场景，包含从 2023 年 2 月至 2026 年 5 月的 1,485 个场景-时期问答对，涵盖月度、周度、日度和不规则的发布频率。在每个时期，大型语言模型（LLM）智能体接收时间序列数据和源报告，而保留的目标发布数据则提供真实值。TimeSage-EV 评估状态识别、数据摘要和前景推理。针对前沿 LLM 智能体以及 TimeSage-1.0（一种具有可重用分析技能库的新型自进化智能体）的实验揭示了不同模型层级间的显著性能差距，以及在时间有效性、外生上下文使用和适应性方面的反复失败。我们将 TimeSage-EV 作为研究资源发布，提供月度更新、代码、排行榜和失败模式分析。"}, {"title": "Demystifying Agent Skills: Why They Work-Until They Don't", "arxiv_id": "2608.14036", "authors": "Zhiyuan Jiang, Fangrui Huang, Hanwen Xing, Xander Wu, Yipeng Gao, Rui Cao, Mengdi Wang, Shilong Liu, Yijiang Li", "summary": "Skills have emerged as a practical and effective approach for enhancing LLM agents at inference time through structured packages of knowledge. However, existing evaluations largely measure whether skills improve aggregated task success, leaving a more fundamental question underexplored: \\emph{\\textbf{When do skills help, why do they work, and where do they fail?}} Through controlled experiments across various benchmarks, agent harnesses and LLMs, we isolate the effects of representation, outcome annotation, retrieval difficulty, and cross-framework robustness of skills. To further answer this question, we design a contrastive study that combines controlled quantitative experiments with paired trajectory analysis. We normalize 8,135 trial records from controlled experiments and retain 238 valid unique labels from 240 open-coded records. We consolidate these observations into a taxonomy of three high-level categories and twelve skill-use modes: skills work when noisy trajectories become procedural anchors that stabilize execution. Skills improve over Workflow Memory by 6.06 points in matched comparisons. Procedural anchoring accounts for 65.7\\% of skill cases, versus 4.5\\% for explicit knowledge injection, showing that skills stabilize action rather than inject missing facts. Retrieval is a separate bottleneck: as pools grow from 5 to 100, actual-use precision falls from 29.6\\% to 3.3\\%. Confusable distractors impair offline identification, yet downstream success remains stable; exact ground-truth invocation is neither sufficient nor necessary. Skills fail under brittle assumptions, incompatible contexts, or insufficient adaptation. These findings move evaluation beyond aggregate success rates and guide reliable self-evolving agents.", "category": "cs.AI", "cluster": "Evaluation, Benchmarking \u0026 Analysis", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving, LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=42 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文完全符合研究范围，属于“单智能体 (Agentic)”和“自我演化 (Self-Evolving)”方向的强相关研究。\n\n1. 核心对象明确：论文的研究对象是 LLM Agents 的“技能”（Skills）机制，这是一种在推理时增强智能体能力的结构化知识包，直接对应筛选标准中的 Tool Use、Memory 和 Agent Harness 等核心能力。\n2. 符合保留标准：\n   - 根据第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。” 本文正是通过受控实验和轨迹分析，深入诊断技能机制何时有效、为何有效以及何时失败。\n   - 根据重要校准：“不要只因为论文是 benchmark、evaluation、behavior analysis... 就排除。只要标题和摘要明确围绕 LLM Agents... 展开，就应返回 True。”\n3. 指向自我演化：摘要明确指出这些发现旨在“guide reliable self-evolving agents”（指导可靠的自我演化智能体），揭示了技能作为“程序锚点”（procedural anchors）稳定执行的作用，这为智能体的自我改进和演化提供了关键的机制性见解，符合 Self-Evolving 和 Self-Improvement 的研究焦点。\n4. 排除项检查：论文不涉及安全、对齐、多模态视觉、图神经网络或多智能体拓扑编排等排除项。\n\n综上，该论文通过深入分析智能体技能机制的行为边界和失效模式，为构建和改进 LLM 智能体提供了重要的理论基础，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决 LLM Agent 中 **Skills**（技能）机制的核心黑盒问题：Skills 在何时有效、为何有效以及为何失效（When do skills help, why do they work, and where do they fail?）。尽管 Skills 作为一种结构化的知识包，已被证明能通过压缩历史执行轨迹（execution traces）来提升 Agent 的推理时表现，但现有研究主要依赖聚合的任务成功率（aggregated task success）来评估其效用，缺乏对 Skill 如何具体改变 Agent 行为机制的深入理解。\n\n这一问题的重要性在于，当前的 Skill 设计、检索和修订过程主要依赖启发式迭代（heuristic iteration）和试错，缺乏原则性的指导。如果无法厘清 Skill 起作用的根本机制，我们就无法区分 Skill 的提升是源于注入了缺失的事实知识，还是源于稳定了执行流程，也无法解释为何同一 Skill 在不同任务或框架下表现迥异。解决这一问题具有双重价值：首先，它推动了评估范式从单一的端到端成功率向细粒度的机制归因转变，揭示了 Skill 主要通过 **procedural anchoring**（程序性锚定，占比 65.7%）而非 **explicit knowledge injection**（显式知识注入，占比 4.5%）来稳定 Agent 的动作序列；其次，它明确了 Skill 的失败边界，如检索瓶颈、上下文不兼容或过度僵化的应用，从而为构建能够可靠生成、检索和应用程序性抽象的自进化 Agent（self-evolving agents）提供了理论基础和设计指南。\n\n### § 2 前人工作与不足\n\n该问题此前并未得到充分解决。现有的相关研究主要集中在两个方向：一是将记忆视为支持未来规划的经验存储（如 **episodic memory**, **reflection**），二是将记忆抽象为可复用的程序性知识（如 **Workflow Memory**, **Skill-based systems**）。\n\n**Prior methods** 如 **Workflow Memory** (Wang et al., 2024c) 和各类 **Skill-based systems** (Ni et al., 2026; Yang et al., 2026b) 已经能够存储和复用过去的执行轨迹或脚本，并在一定程度上提升了任务成功率。然而，这些工作存在显著的不足：\n\n1.  **评估维度的缺失**：现有工作（包括 **SkillsBench** 和 **SWE-Skills-Bench**）主要报告最终的任务成功率，将 Skill 视为一个黑盒。这种聚合评估掩盖了 Skill 与直接注入原始轨迹（Raw Workflow Memory）之间的本质区别。例如，前人工作未能解释为何经过蒸馏的 Skill 比包含相同信息的原始轨迹更有效，也未量化 Skill 在减少特定类型错误（如环境配置错误、输出格式不匹配）方面的具体贡献。\n2.  **机制归因的空白**：之前的研究假设 Skill 的价值在于提供“缺失的知识”或“更优的计划”，但本文发现这种假设是不准确的。前人工作没有区分 **procedural anchoring**（稳定执行步骤）和 **knowledge injection**（补充事实），导致无法理解 Skill 为何在需要深层算法重构的任务中失效，而在操作性脆弱的任务中成功。\n3.  **检索与执行的解耦不足**：现有研究通常假设检索到正确的 Skill 就能保证任务成功，或者将检索失败简单归因为向量相似度不足。本文指出，**retrieval accuracy** 与 **downstream success** 并非一一对应关系。前人工作忽略了 **confusable distractors**（易混淆干扰项）对离线识别的影响，以及 Agent 在运行时可能错误调用或机械应用 Skill 导致的 **invocation failures**。由于缺乏对 Skill 生命周期（生成、检索、调用、适应）中各阶段失败模式的细粒度分析，之前的系统无法有效处理 Skill 在跨框架迁移（cross-framework transfer）或大规模库检索中的鲁棒性问题。\n\n简而言之，前人工作未能考虑 **Skill-use mechanisms** 的细粒度分解，是因为它们缺乏一种对比性的轨迹分析方法（contrastive trajectory-analysis methodology）来隔离表示形式、结果标注、检索难度和框架兼容性对 Agent 行为的具体影响。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM Agent 领域，Memory 机制已从简单的 Episodic Memory 演进为更结构化的 Procedural Memory 和 Skills。现有的主流观点认为，将过往的执行轨迹（Trajectories）提炼为 Skills 能显著提升任务成功率，因为 Skills 压缩了噪声并提供了可复用的程序性知识。然而，这种观点主要依赖于 Aggregate Success Rate 这一单一指标，导致我们对 Skills 的理解停留在“黑盒”层面：我们只知道 Skills 有效，却不清楚其内在机制。\n\n这种黑盒状态带来了几个关键的认知盲区。首先，Skills 的优势究竟来源于“经验内容”本身，还是来源于“结构化表示”？如果直接注入清洗后的 Workflow Memory（即原始轨迹的简化版）也能达到类似效果，那么 Skills 的蒸馏过程是否真的必要？其次，Skills 是如何改变 Agent 行为的？是注入了缺失的事实知识（Knowledge Injection），还是提供了执行步骤的锚点（Procedural Anchoring）？现有工作缺乏对 Agent 执行轨迹的细粒度对比分析，无法区分这两种机制。\n\n此外，Skills 的检索和应用环节存在明显的脆弱性。在真实场景中，Skills 需要从庞大的库中检索，但检索精度随库大小增加而急剧下降。更关键的是，检索到正确的 Skill 是否足以保证任务成功？或者，即使检索失败，相关的非 Ground-truth Skills 是否仍能提供部分帮助？现有评估往往将检索失败等同于任务失败，忽略了 Agent 在错误上下文下调用 Skill 可能产生的“误用”（Misapplication）或“忽略”（Ignored）等复杂失败模式。\n\n基于这些观察，研究者意识到需要一种新的评估范式：不再仅仅关注最终的成功率，而是通过对比实验（Contrastive Study）和轨迹分析（Trajectory Analysis），解构 Skills 在 Representation、Retrieval、Invocation 和 Adaptation 各个阶段的作用机制。通过控制变量（如对比 Raw、Workflow Memory 和 Skill），并引入细粒度的 Taxonomy 对失败模式进行分类，可以揭示 Skills 何时有效、为何有效以及何时失效的根本原因。\n\n### § 4 核心 Intuition\n\nSkills 的核心价值不在于注入缺失的事实知识，而在于将嘈杂的过往经验蒸馏为稳定的“程序性锚点”（Procedural Anchors），从而规范 Agent 的执行步骤、工具调用顺序和验证流程，减少环境配置和格式错误等执行层故障。然而，Skills 并非万能，其有效性高度依赖于检索的准确性和上下文的兼容性；当检索到的 Skill 与当前任务不匹配或被机械式误用时，反而会引入新的失败模式。因此，Skills 的作用机制应从“知识补充”转向“执行稳定化”，其成功与否取决于 Agent 能否在正确的上下文中灵活适配这些程序性抽象，而非单纯依赖检索精度。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文的核心方法并非提出一个新的 Agent 架构，而是构建了一套**对比性轨迹分析（Contrastive Trajectory Analysis）**方法论，旨在解构 Skill 在 Agent 执行过程中的具体作用机制。其 Pipeline 包含数据标准化、开放式编码、分类体系构建以及配对对比分析四个关键阶段。\n\n以下以论文附录 A.3 中的 `react-performance-debugging` 任务为例，展示完整的分析 Pipeline：\n\n**1. 数据收集与标准化 (Data Collection \u0026 Normalization)**\n*   **输入**：针对同一任务，收集三种不同条件下的执行轨迹（Trajectories）：\n    *   **Raw**：无先验经验，Agent 从零开始。\n    *   **Workflow Memory**：注入清洗后的历史执行痕迹（包含成功和失败的路径）。\n    *   **Skill**：注入从相同历史痕迹中蒸馏出的标准化 `SKILL.md` 文件。\n*   **处理**：将异构的 Benchmark 输出（如 Terminal-Bench, SkillsBench）统一转换为包含任务 ID、执行臂（Arm）、验证器结果（Verifier Outcome）、注入工件（Artifact）和轨迹转录本（Transcript）的结构化 Manifest。\n*   **例子**：在 `react-performance-debugging` 任务中，系统记录了 Raw、Workflow Memory 和 Skill 三种条件下 Agent 的终端命令、代码修改及最终测试结果的完整日志。\n\n**2. 开放式编码与标签生成 (Open Coding \u0026 Labeling)**\n*   **输入**：从标准化 Manifest 中分层抽样（Stratified Sampling）选取代表性轨迹（如 240 条）。\n*   **处理**：使用 LLM Judge 对每条轨迹进行开放式编码。LLM 阅读任务指令、注入的 Skill/Workflow 内容以及 Agent 的执行过程，生成自由文本标签（Free-text labels），描述成功或失败的具体原因。\n*   **例子**：\n    *   **Raw 轨迹**：LLM 观察到 Agent 绕过了外部 API 检查，导致 `test_external_api_actually_called` 失败，标签为“missing knowledge”或“bypassed check”。\n    *   **Workflow Memory 轨迹**：LLM 观察到 Agent 保留了串行请求逻辑，导致超时，标签为“serialized request causing timeout”。\n    *   **Skill 轨迹**：LLM 观察到 Agent 遵循 Skill 中的 `Promise.all` 建议，并行发起请求，标签为“parallel execution guided by skill”。\n\n**3. 分类体系归纳 (Taxonomy Induction)**\n*   **输入**：所有开放式编码生成的原始标签。\n*   **处理**：通过两阶段批量归纳（Batched Induction），将原始标签合并为 12 种规范模式（Canonical Modes），并归入三个高层类别（Skill-use Categories, SC）：\n    *   **SC1 (Procedural Anchoring)**：成功的过程性锚定。\n    *   **SC2 (Execution/Verification Failures)**：执行层或验证失败。\n    *   **SC3 (Invocation/Applicability Failures)**：调用或适用性失败。\n*   **例子**：上述三个标签被映射到具体模式：Raw 对应 `algorithmic_logic_error` 或 `static_verification_without_runtime`；Workflow Memory 对应 `timeout_budget_exhaustion`；Skill 对应 `skill_guided_success`。\n\n**4. 配对对比分析 (Paired Contrastive Analysis)**\n*   **输入**：同一任务在三个 Arm 下的配对轨迹三元组（Paired Triples）。\n*   **处理**：LLM Judge 对比三个 Arm 的差异，确定 Skill 或 Workflow Memory 相对于 Raw 的净效应（Net Effect），并判定其作用机制（Mechanism）：\n    *   `procedural_anchor`：提供可用的步骤、顺序或检查清单。\n    *   `knowledge_injection`：提供缺失的具体领域知识。\n    *   `failure_warning`：警告潜在陷阱。\n    *   `counterproductive`：误导 Agent。\n*   **输出**：\n    *   **Raw**：失败。机制：无。\n    *   **Workflow Memory**：失败。机制：`procedural_anchor` 但伴随 `timeout_budget_exhaustion`（过程过载）。\n    *   **Skill**：成功。机制：`procedural_anchor`。Skill 明确指导将独立 `await` 转换为 `Promise.all`，稳定了执行流程。\n*   **结论**：该配对分析证明，Skill 通过**过程性锚定（Procedural Anchoring）**而非知识注入，解决了 Workflow Memory 中存在的噪声和超时问题。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过**。\n\n本文是一篇实证研究（Empirical Study），侧重于通过控制实验和定性/定量分析来揭示 Agent Skill 的行为机制，而非提出新的数学模型或算法推导。文中涉及的统计指标（如 Precision, Recall, F1, Bootstrap Confidence Interval）均为标准评估指标，无核心数学推导过程。\n\n### § 7 实验设计与结论\n\n本文通过四个研究问题（RQ）设计了系统的控制实验，旨在回答“Skill 何时有效、为何有效、何处失效”。\n\n**RQ1: 过程性表征如何影响经验复用？ (How does procedural representation shape experience reuse?)**\n*   **问题**：Skill 的优势是源于提供了先验经验，还是源于其标准化的蒸馏形式？\n*   **实验设计**：对比 **Raw**（无经验）、**Workflow Memory**（直接注入清洗后的历史轨迹）和 **Skill**（从相同轨迹蒸馏出的标准化文件）。保持源轨迹池不变，仅改变表征形式。\n*   **答案**：Skill 优于 Workflow Memory（+6.06% 成功率）。Skill 主要作为 **Procedural Anchors**（过程性锚点，占比 65.7%）发挥作用，通过压缩噪声、标准化步骤来稳定执行；而 Workflow Memory 保留了过多的探索噪声和失败分支，导致上下文负担过重和超时。\n\n**RQ2: 结果信号在轨迹学习中的作用是什么？ (What role do outcome signals play in learning from trajectories?)**\n*   **问题**：Skill 的有效性是来自过程内容本身，还是来自明确的“成功/失败”标注？\n*   **实验设计**：对比 **Standard**（Skill 创建时可见成功/失败标签）和 **No-Hint**（隐藏标签，仅保留轨迹内容）两种 Skill 构建方式。\n*   **答案**：当源轨迹包含失败案例时，**Outcome Annotations**（结果标注）至关重要。隐藏标签会显著降低 Skill 的质量，因为 Agent 无法区分哪些路径是有效的，哪些是陷阱。这表明 Skill 的价值部分依赖于对结果信号的显式利用。\n\n**RQ3: 蒸馏的过程性指导能否跨框架迁移？ (Does distilled procedural guidance transfer across agent frameworks?)**\n*   **问题**：Skill 是否比 Workflow Memory 更具可移植性，能在不同的 Agent 框架间有效迁移？\n*   **实验设计**：在 **Codex** 框架下构建 Skill 和 Workflow Memory，然后在 **Gemini CLI** 框架下进行评估。\n*   **答案**：Skill 表现出更强的 **Cross-framework Robustness**（跨框架鲁棒性）。由于 Skill 是抽象的过程性指导，解耦了特定框架的提示风格和工具接口，因此在迁移后仍能保持较高的成功率；而 Workflow Memory 因包含特定框架的底层细节，迁移效果较差。\n\n**RQ4: Skill 池的构建如何影响检索和下游使用？ (How does skill-pool construction affect retrieval and downstream use?)**\n*   **问题**：随着 Skill 库变大或干扰项增加，检索精度和任务成功率如何变化？\n*   **实验设计**：构建不同大小（5-100）和干扰类型（随机、相似、不相似）的候选池。分别评估 **Embedding Retrieval**（离线检索）、**Agent Selection**（显式选择）和 **Real Execution**（实际执行中的使用）。\n*   **答案**：\n    1.  **Retrieval is a Bottleneck**：随着池子增大，实际使用精度（Actual-use Precision）急剧下降（从 29.6% 降至 3.3%），尤其是面对 **Confusable Distractors**（相似干扰项）时。\n    2.  **Decoupling of Retrieval and Success**：检索精度与任务成功率并非线性相关。即使没有检索到 Ground-truth Skill，相关的非 Ground-truth Skill 仍可能提供有用的过程支持；反之，检索到正确 Skill 也不保证成功。\n    3.  **Failure Modes**：Skill 的失效往往不是因为没找到，而是因为 **Misapplication**（误用）、**Incompatible Context**（上下文不兼容）或 **Insufficient Adaptation**（适应不足）。", "additional_insights": "### § 8 Take-aways\n\nSkills primarily function as **procedural anchors** rather than sources of factual knowledge, stabilizing execution by compressing noisy trajectories into standardized steps, tool sequences, and verification checks. The dominant mechanism for skill utility is **procedural anchoring** (accounting for 65.7% of cases), which significantly reduces execution-layer failures such as environment setup errors and output format mismatches, whereas explicit **knowledge injection** contributes minimally (4.5%). Compared to raw **Workflow Memory**, distilled skills improve task success by 6.06 percentage points by eliminating verbose exploration noise and failed branches that cause timeouts and context drift in direct trace reuse. **Retrieval precision** degrades sharply as skill pool size increases (from 29.6% to 3.3% actual-use precision when pool size grows from 5 to 100), yet downstream task success remains relatively stable, indicating that exact ground-truth skill invocation is neither sufficient nor necessary for success. **Semantic confusability** in distractors is a more critical stressor for offline skill identification than pool size alone, as similar distractors significantly impair embedding-based and agent-based selection accuracy. Skills fail not only due to retrieval errors but also through **invocation failures**, where agents mechanically misapply guidance, ignore contextual mismatches, or fail to adapt to tasks requiring deeper algorithmic reformulation or runtime verification. Outcome annotations during skill construction are crucial; withholding success/failure labels significantly degrades skill quality when the source trajectory pool contains failed runs, as agents rely on these signals to distinguish robust procedures from error-prone paths. Cross-framework transfer experiments show that distilled skills retain more portable procedural guidance than raw workflow memories when moved between different agent frameworks (e.g., from Codex to Gemini CLI), suggesting that abstraction enhances robustness against framework-specific coupling.\n\n### § 9 最脆弱的假设\n\n该研究最脆弱的假设是：**LLM-based taxonomy labeling and trajectory analysis accurately reflect the causal mechanisms of skill utility, rather than introducing systematic bias or hallucination in attributing success/failure to specific modes.**\n\n这一假设之所以关键，是因为论文的核心贡献——即技能主要作为“procedural anchors”而非“knowledge injection”发挥作用，以及具体的失败模式分类（如 SC1/SC2/SC3）——完全依赖于对 8,135 条试验记录中 240 条样本的开放式编码和后续 LLM 辅助的分类。如果 LLM judge 在对比 Raw、Workflow Memory 和 Skill 轨迹时，倾向于将任何成功归因于“procedural anchoring”（因为这是最直观的叙事），或者无法准确区分“agent 自主成功”与“skill 引导成功”，那么整个分类体系的有效性将崩塌。\n\n在实际中，这一假设可能不成立的原因包括：\n1.  **LLM 的归因偏差**：LLM 可能过度解读 Skill 的存在，即使 Agent 实际上并未遵循 Skill 中的步骤，也可能将其标记为“skill_guided_success”。\n2.  **轨迹截断的影响**：由于上下文窗口限制，分析仅使用了轨迹的头尾部分（head/tail），可能遗漏了中间关键的决策点，导致对“procedural anchoring”或“failure_warning”机制的错误判断。\n3.  **人类验证的局限性**：虽然论文提到人类验证了 238 个标签的 95.8% 一致性，但这仅覆盖了约 3% 的数据，且人类验证者可能受到 LLM 生成的定义的影响，未能发现系统性的分类错误。\n\n论文提供的证据包括：\n-   **人类验证**：Table 3 显示人类标注者与 LLM 在标签映射上达到 Cohen’s κ = 0.952 的一致性，这提供了表面上的可靠性。\n-   **配对对比设计**：通过对比同一任务下的三个臂（Raw, Workflow, Skill），试图控制任务难度和 Agent 能力的差异，从而隔离 Skill 的影响。\n\n然而，论文缺乏的证据是：\n-   **对 LLM judge 偏差的鲁棒性测试**：未展示当使用不同 LLM 或不同提示词策略时，分类结果是否稳定。\n-   **细粒度行为追踪**：没有直接证据（如代码执行日志中的具体调用匹配）证明 Agent 确实遵循了 Skill 中的特定步骤，而是依赖 LLM 对文本轨迹的解释。如果 LLM 的解释是错误的，那么“procedural anchoring”占 65.7% 这一核心结论就是建立在幻觉之上的。\n\n### § 10 最小复现实验\n\n**目标**：验证“Skills 作为 procedural anchors 比 Workflow Memory 更有效”这一核心 claim，特别是其减少执行层错误（如环境设置、格式错误）的能力。\n\n**数据**：\n-   使用 **Terminal-Bench 2.0** 或 **SkillsBench** 中的一个小规模子集（例如 10-20 个任务），这些任务已知涉及复杂的环境设置或多步工具调用。\n-   收集每个任务的 5-10 条原始执行轨迹（包括成功和失败），用于构建 Workflow Memory 和 Skill。\n\n**实现**：\n1.  **构建基线**：\n    -   **Raw**：无额外信息。\n    -   **Workflow Memory**：将原始轨迹清洗后直接附加到 prompt 中。\n    -   **Skill**：使用一个简单的 LLM（如 GPT-4o 或 Claude Sonnet）根据原始轨迹生成一个标准化的 `SKILL.md` 文件，遵循论文中的格式（Steps, Preconditions, Failure Modes）。\n2.  **执行实验**：\n    -   使用一个固定的 Agent 框架（如 **Harbor** 或简单的 **ReAct** agent）和模型（如 **GPT-4o** 或 **Gemini 1.5 Pro**）。\n    -   在每个任务上运行 5 次试验，分别注入 Raw、Workflow Memory 和 Skill。\n3.  **测量**：\n    -   **任务成功率**：最终验证器（verifier）的结果。\n    -   **错误类型分类**：手动或通过 LLM 对失败轨迹进行分类，特别关注 **environment_infrastructure_failure**、**output_format_schema_mismatch** 和 **timeout_budget_exhaustion**。\n\n**结果解释**：\n-   **支持 Claim**：如果 Skill 臂在成功率上显著高于 Workflow Memory 臂，且失败轨迹中 **environment_infrastructure_failure** 和 **output_format_schema_mismatch** 的比例显著降低，而 **timeout_budget_exhaustion** 也低于 Workflow Memory 臂，则支持“Skill 作为 procedural anchor 稳定执行”的结论。\n-   **反驳 Claim**：如果 Skill 臂与 Workflow Memory 臂在成功率上没有显著差异，或者 Skill 臂引入了更多的 **skill_guidance_misapplied_or_ignored** 错误，导致整体表现更差，则表明 Skill 的抽象过程可能丢失了关键信息或引入了新的复杂性，从而质疑其作为“procedural anchor”的普遍有效性。\n\n**优势**：\n-   不需要复现完整的 8,135 条试验的大规模实验。\n-   聚焦于核心机制（procedural anchoring vs. noise reduction），通过小样本即可观察到趋势。\n-   使用公开可用的基准和模型，易于复现。", "research_value": "### § 11 最强反例设计\n\n要挑战这篇论文的核心结论，最有力的攻击并非质疑 Skill 是否有效，而是质疑其归因机制的**因果有效性（Causal Validity）**，特别是针对“Procedural Anchoring”这一主导机制的解释。论文声称 Skill 通过压缩噪声和标准化步骤（Procedural Anchoring）提升了成功率，但这可能是一个**混淆变量（Confounding Variable）**导致的伪相关。\n\n**反例设计：控制信息熵的“伪 Skill”实验（The \"Shuffled Skill\" Counterfactual）**\n\n**核心论点**：论文观察到的 Skill 优势可能并非源于其“过程性结构”或“去噪”，而是源于**信息密度的提升**和**注意力引导（Attention Guidance）**。LLM 在处理长上下文时，对结构化、高信噪比的文本块具有天然的偏好，无论其内容是否具有真正的“程序性指导意义”。如果我们将 Skill 中的步骤顺序打乱，或者替换为语义无关但格式相同的占位符，只要保持其“结构化摘要”的形式，Agent 的表现可能依然优于 Raw 和 Workflow Memory。如果成立，则证明 Skill 的价值在于**格式诱导的注意力聚焦（Format-induced Attention Focus）**，而非论文声称的**Procedural Anchoring**。\n\n**具体实验步骤**：\n1.  **构建对照组**：\n    *   **Original Skill**：论文中使用的标准 `SKILL.md`。\n    *   **Shuffled Skill**：保留 Original Skill 的所有文本片段（步骤、检查点），但随机打乱其逻辑顺序，破坏其程序性连贯性。\n    *   **Semantic Null Skill**：保留 Original Skill 的结构（Steps, Preconditions, Failure Modes），但将具体内容替换为与任务无关的通用编程建议（如“检查变量类型”、“确保代码缩进正确”），保持相同的 Token 长度和结构复杂度。\n2.  **执行对比**：在相同的 Benchmark（如 Terminal-Bench）上，对比 Raw、Workflow Memory、Original Skill、Shuffled Skill 和 Semantic Null Skill 的表现。\n3.  **预期反驳结果**：\n    *   如果 **Shuffled Skill** 或 **Semantic Null Skill** 的表现显著优于 Raw 和 Workflow Memory，且接近 Original Skill，则证明 Skill 的核心价值在于**提供高信噪比的上下文锚点**，帮助 LLM 忽略噪声，而非提供具体的“过程性指导”。\n    *   这将直接推翻论文中“Procedural Anchoring (65.7%)”作为主要机制的结论，将其重新解释为“Contextual Compression”或“Attention Priming”。\n\n**理论攻击点**：\n论文依赖 LLM Judge 进行轨迹归因，这引入了**后见之明偏差（Hindsight Bias）**。LLM Judge 在已知任务成功的情况下，倾向于在轨迹中寻找与 Skill 内容匹配的步骤，并将其标记为“Procedural Anchoring”。然而，Agent 可能实际上并未遵循 Skill 的步骤，而是凭借自身能力或随机性成功，LLM Judge 错误地将成功归因于 Skill 的结构。这种**归因幻觉（Attribution Hallucination）**使得“Procedural Anchoring”成为一个自我实现的预言，而非客观存在的机制。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从静态检索到动态适应——基于执行反馈的 Skill 在线微调（Online Skill Adaptation via Execution Feedback）**\n\n**（a）驱动局限与未满足需求**\n现有研究（包括本文）将 Skill 视为**静态的、预定义的抽象（Static, Pre-defined Abstractions）**。本文 RQ4 指出，Skill 的失效往往源于 **Incompatible Context** 或 **Insufficient Adaptation**，即静态 Skill 无法应对运行时环境的细微变化或任务的独特约束。当前的范式是“检索-调用”（Retrieve-and-Invoke），缺乏“检索-适应-调用”（Retrieve-Adapt-Invoke）的闭环。Agent 在调用 Skill 时，通常机械地遵循其步骤，缺乏根据实时执行反馈（如工具调用错误、中间状态异常）动态调整 Skill 中具体参数或步骤的能力。这导致了 **Brittle Assumptions** 的失败模式。\n\n**（b）借鉴相邻领域的方法**\n借鉴**强化学习中的在线策略更新（Online Policy Update in RL）**和**程序合成中的约束求解（Constraint Solving in Program Synthesis）**。\n*   在 RL 中，Agent 根据环境反馈动态调整策略；在程序合成中，求解器根据类型错误动态修正代码。\n*   我们可以将 Skill 视为一个**参数化的程序模板（Parameterized Program Template）**，而非固定的文本块。Skill 中包含“占位符”或“可配置参数”，Agent 在执行过程中，利用轻量级的**执行监控器（Execution Monitor）**检测偏差，并通过**局部重规划（Local Re-planning）**动态实例化或修改 Skill 的具体步骤。\n\n**（c）第一个实验设计**\n1.  **构建动态 Skill 格式**：定义一种新的 Skill 格式，包含**核心逻辑（Core Logic）**和**自适应钩子（Adaptation Hooks）**。例如，在 `SKILL.md` 中，不仅列出步骤，还列出每个步骤的**预期状态（Expected State）**和**异常处理分支（Exception Handling Branches）**。\n2.  **引入执行监控器**：在 Agent 执行 Skill 时，部署一个轻量级的 LLM-based Monitor，实时检查每一步的输出是否符合预期状态。\n3.  **动态适应机制**：\n    *   如果 Monitor 检测到偏差（如环境配置与 Skill 假设不符），触发**局部重规划**，生成一个针对当前上下文的**Skill Patch**（技能补丁），动态替换原 Skill 中的相关步骤。\n    *   对比基线：Static Skill（本文方法） vs. Dynamic Skill（带 Monitor 和 Patch 机制）。\n4.  **评估指标**：\n    *   **Adaptation Success Rate**：在存在上下文不兼容（Incompatible Context）的任务子集上，Dynamic Skill 是否显著优于 Static Skill。\n    *   **Patch Quality**：生成的 Skill Patch 是否有效解决了偏差，且未引入新的错误。\n    *   **Overhead**：动态适应带来的额外 Token 消耗和时间延迟。\n\n**与已有工作的区别**：\n*   不同于 **Reflection**（事后反思），本方法强调**事中适应（In-context Adaptation）**，在错误发生前或发生时立即纠正。\n*   不同于 **Self-Correction**（通用错误修复），本方法利用 Skill 的结构化先验，进行**有指导的局部修正**，而非从头重新规划，从而保持效率。\n*   不同于本文的**静态检索**，本方法将 Skill 视为**可执行的、可变的代码对象**，而非仅作为提示词的一部分，从而解决 **Insufficient Adaptation** 这一核心失败模式。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Zhiyuan Jiang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\",\n        \"‡\"\n      ]\n    },\n    {\n      \"name\": \"Fangrui Huang\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Hanwen Xing\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xander Wu\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yipeng Gao\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Rui Cao\",\n      \"affiliations\": [\n        5\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Mengdi Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Shilong Liu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Yijiang Li\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Princeton University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"UC San Diego\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Stanford University\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"University of Southern California\"\n    },\n    {\n      \"id\": 5,\n      \"name\": \"Johns Hopkins University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal contribution\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding authors\"\n    },\n    {\n      \"marker\": \"‡\",\n      \"text\": \"Work done during an internship at Princeton University\"\n    }\n  ]\n}\n```", "summary_translation": "技能（Skills）作为一种通过结构化知识包在推理时增强大语言模型（LLM）智能体的实用且有效的方法，已逐渐崭露头角。然而，现有的评估主要衡量技能是否提高了聚合任务成功率，而忽略了一个更根本的问题：\\emph{\\textbf{技能在何时有效、为何有效，以及在何处失效？}} 通过对各种基准测试、智能体框架和 LLM 进行受控实验，我们隔离了技能在表征、结果标注、检索难度以及跨框架鲁棒性方面的影响。为了进一步回答这一问题，我们设计了一项对比研究，将受控定量实验与配对轨迹分析相结合。我们对来自受控实验的 8,135 条试验记录进行了归一化处理，并从 240 条开放式编码记录中保留了 238 个有效的唯一标签。我们将这些观察结果整合为一个包含三个高层类别和十二种技能使用模式的分类体系：当噪声轨迹成为稳定执行的程序化锚点时，技能发挥作用。在匹配比较中，技能比 Workflow Memory 提高了 6.06 分。程序化锚定占技能案例的 65.7\\%，而显式知识注入仅占 4.5\\%，这表明技能的作用是稳定行动而非注入缺失的事实。检索是一个独立的瓶颈：随着检索池从 5 增加到 100，实际使用精度从 29.6\\% 下降到 3.3\\%。易混淆的干扰项会损害离线识别，但下游成功率保持稳定；精确调用真实值既非充分条件也非必要条件。技能在假设脆弱、上下文不兼容或适应性不足的情况下会失效。这些发现将评估从聚合成功率推进到更深层次，并为可靠的自演化智能体提供指导。"}, {"title": "When Personal Memory Has No Single Answer: Evaluating LLM Agents under Irreducible Conflict", "arxiv_id": "2608.13921", "authors": "Lu Yang, Shusheng Xu, Zhuoran Li, Tongkai Yang, Longbo Huang", "summary": "LLM agents increasingly maintain personal memory across sessions, but it can conflict. Preferences depend on context, behavior evolves, and sources can conflict. When a query lacks context, time, or source authority to interpret conflict, treating one memory as definitive converts unresolved conflict into an unjustified, overconfident action. Existing benchmarks recover one answer from conflicting evidence, overlooking whether agents recognize underdetermination, preserve alternatives, seek missing information, and choose appropriate actions. We introduce \\underline{T}esting \\underline{A}gents' \\underline{N}avigation of \\underline{G}enuine, \\underline{L}atent, and \\underline{E}ntangled Memory Conflicts (\\textsc{TANGLE}), a benchmark for genuinely unresolvable memory conflicts. It comprises 541 instances across 40 personas and three types: Context-Partitioned Conflict (CPC), Behavior-Oscillation Conflict (BOC), and Source-Contradiction Conflict (SCC). We evaluate two tracks---an oracle track with curated memory and a pipeline track that extracts memory from multi-session dialogues---on five dimensions: conflict perception, causal reasoning, confidence calibration, clarification seeking, and memory faithfulness. Experiments reveal pipeline challenges. With curated memory, models recognize conflicts more reliably than they calibrate actions or seek targeted clarification. With end-to-end pipeline memory, extraction fails to preserve conflict-bearing relations needed for downstream reasoning. Policy comparisons show fixed rules are insufficient when actions must reflect conflict. These findings motivate Conflict-Aware Action Policy (CAAP), which adapts actions to each conflict using available evidence. \\textsc{TANGLE} frames conflict handling as recognizing underdetermination, retaining conflicting evidence, and acting without forcing a definitive answer.", "category": "cs.AI", "cluster": "Evaluation, Benchmarking \u0026 Analysis", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：当大型语言模型（LLM）代理的长期个人记忆中存在**不可还原的冲突（Irreducible Conflict）**时，代理应如何识别这种不确定性、保留冲突证据，并选择适当的行动，而不是强行给出一个确定的答案。具体而言，研究关注的是在查询缺乏必要的上下文、时间锚点或来源权威性信息时，代理如何处理那些本质上没有唯一正确解的记忆冲突。\n\n这一问题的重要性在于，现有的LLM代理正从无状态助手演变为具有持久个人记忆的长期交互系统。随着记忆库的增长，用户偏好随上下文变化、行为随时间波动、不同来源的信息相互矛盾是常态。如果代理在面临**Underdetermination**（证据不足以确定唯一解）时，错误地将某一条记忆视为绝对真理，会导致**Overconfident Actions**（过度自信的行动），从而产生不恰当的建议或执行未经验证的选择。这不仅降低了代理的可靠性，在医疗、法律等高 stakes 场景中更可能引发安全风险。解决这一问题能够推动代理从简单的“记忆检索与回答”向具备**Epistemic Calibration**（认识论校准）和**Clarification Seeking**（澄清寻求）能力的认知智能体演进，确保代理在信息不完整时能表现出谨慎、条件化或可逆的行为，从而提升系统的整体安全性和用户体验。\n\n### § 2 前人工作与不足\n\n尽管已有大量研究关注LLM的记忆冲突，但现有工作主要将冲突视为一个**Single-answer Recovery**（单一答案恢复）问题，即假设存在一个可通过时间最近性、来源优先级或事实校正来确定的“正确”答案。例如，**MemConflict** (Tao et al., 2026)、**STALE** (Chao et al., 2026) 和 **HaluMem** (Chen et al., 2026a) 等基准测试主要评估代理在时间推移或事实错误背景下恢复最新或正确事实的能力；**ConflictBank** (Su et al., 2024) 和 **CONFLICTINGQA** (Wan et al., 2024) 则侧重于知识冲突下的选择或二选一判断。这些方法的核心假设是冲突最终是可解决的，且评测指标通常基于与单一标准答案的匹配度。\n\n这些前人工作的不足在于它们未能涵盖**Genuine Ambiguity**（真正的模糊性）场景。在真实世界中，许多记忆冲突源于**Context-Partitioned**（上下文分区）、**Behavior-Oscillation**（行为振荡）或**Source-Contradiction**（来源矛盾），其中没有单一记忆是“错误”的，而是各自适用于不同的隐含条件。现有基准的**Answer-centered Design**（以答案为中心的设计）迫使代理将冲突记忆压缩为单一值，忽略了代理是否识别了**Underdetermination**、是否保留了替代方案、是否主动寻求缺失信息。此外，现有评测通常采用**Single-track**（单轨道）设计，将记忆提取（Memory Extraction）与冲突推理（Conflict Reasoning）混淆，无法区分代理是因为未能提取到冲突结构而失败，还是因为推理能力不足而失败。这种评测缺口导致我们不清楚代理在面对不可还原冲突时的真实认知瓶颈，也无法有效评估其在缺乏唯一解时的行为安全性。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM Agent 领域，长期记忆（Long-term Memory）的研究长期被“检索增强”的范式所主导。现有的基准测试（如 MemBench, LongMemEval）主要关注记忆的**准确性**（Accuracy）和**持久性**（Persistence），即模型能否在长对话中正确回忆事实。然而，现实用户的记忆并非静态真理，而是充满噪声、语境依赖和动态变化的。当用户说“我喜欢吃辣”时，这可能仅在“朋友聚餐”语境下成立，而在“肠胃不适”时失效；或者用户的行为在“严格自律”与“放纵”之间周期性振荡。\n\n现有的冲突处理基准（如 MemConflict, STALE）虽然意识到了冲突，但它们大多假设冲突是**可解的**（Resolvable）。例如，通过时间戳判断最新状态，或通过权威源判断事实真伪。这种“单一正确答案”（Single Answer）的假设在简单事实冲突中有效，但在处理**个人偏好**、**行为模式**和**多源主观信息**时失效。如果查询缺乏必要的上下文（Context）、时间锚点（Temporal Anchor）或源权威（Source Authority），强行给出一个确定性的回答会导致**过度自信**（Overconfidence）和**不安全行为**（Unsafe Actions）。\n\n此外，现有的评估体系存在严重的**归因混淆**（Attribution Confusion）。大多数基准将记忆提取（Memory Extraction）和冲突推理（Conflict Reasoning）混在一个黑盒中。当模型表现不佳时，我们无法区分是因为记忆系统丢失了关键的结构化信息（如语境关联），还是因为模型本身缺乏处理不确定性（Underdetermination）的认知能力。\n\n因此，研究者意识到需要一个新的评估框架，其核心假设是：**某些记忆冲突在给定查询下是本质上不可解的（Irreducible）**。评估的重点不应是“选出哪个记忆是对的”，而是“模型是否识别出这种不确定性，并采取了适当的认知行为（如澄清、条件化建议、保留证据）”。这要求将评估从“答案正确性”转向“认知过程质量”，并分离记忆构建与推理阶段，以精准定位瓶颈。\n\n### § 4 核心 Intuition\n\n这篇论文的核心直觉是：在个人记忆系统中，许多冲突并非因为信息缺失而暂时无法解决，而是因为查询本身缺乏决定性的语境、时间或源权威，导致**本质上存在多个合理答案（Underdetermination）**。\n\n传统方法试图通过强制选择一个“最佳”记忆来消除歧义，这会导致模型在信息不足时产生**过度自信（Overconfidence）**和**错误行动**。\n\n因此，有效的冲突处理不应是“解决冲突”，而是**识别不确定性（Recognizing Underdetermination）**，保留相互矛盾的证据，并根据证据强度采取**校准后的行动（Calibrated Action）**，如寻求澄清、提供条件性建议或执行可逆操作，而不是强行给出一个确定的结论。", "methodology": "§ 5 具体方法与完整 Pipeline（输入、处理、输出分步说明，必须基于可确认的证据）\n本文提出的核心方法是构建并评估 **TANGLE** (Testing Agents’ Navigation of Genuine, Latent, and Entangled Memory Conflicts) 基准，旨在测试 LLM 代理在面对**本质上不可解（Irreducible）**的个人记忆冲突时的认知行为。其完整 Pipeline 包含数据构建、双轨道评估体系及多维评估指标：\n\n1.  **数据构建与冲突类型定义**：\n    *   **输入数据**：TANGLE 包含 **541 个实例**，覆盖 **40 个人设（Personas）**、10 个领域及 46 个生活方面。\n    *   **冲突类型**：定义了三种导致“无唯一正确答案”的冲突类型：\n        *   **Context-Partitioned Conflict (CPC)**：偏好依赖于特定上下文（如“朋友聚餐” vs “肠胃不适”）。\n        *   **Behavior-Oscillation Conflict (BOC)**：行为随时间波动且未稳定（如“严格自律”与“放纵”之间的周期性振荡）。\n        *   **Source-Contradiction Conflict (SCC)**：不同来源的信息相互矛盾，且缺乏权威判定依据。\n    *   **关键特征**：这些冲突在给定查询下缺乏必要的上下文、时间锚点或源权威性，因此无法通过单一事实恢复来解决。\n\n2.  **双轨道评估体系（Two Tracks）**：\n    为了分离记忆构建与冲突推理的能力，TANGLE 设计了两个匹配的评估轨道：\n    *   **Oracle Track（神谕轨道）**：直接向模型提供经过精心策划的、包含冲突的记忆库。此轨道旨在隔离并评估模型在拥有完整信息时的**冲突推理（Conflict Reasoning）**能力。\n    *   **Pipeline Track（流水线轨道）**：模拟端到端场景，记忆系统首先从多轮对话（Multi-session Dialogues）中提取记忆，然后传递给下游代理进行推理。此轨道用于评估整个系统的表现，特别是识别**记忆提取（Memory Extraction）**阶段的信息丢失瓶颈。\n\n3.  **评估维度与指标**：\n    由于不存在唯一正确答案，评估不再基于答案匹配度，而是基于以下五个认知维度：\n    *   **Conflict Perception（冲突感知）**：模型是否识别出记忆中存在冲突。\n    *   **Causal Reasoning（因果推理）**：模型是否能理解冲突产生的原因（如上下文依赖）。\n    *   **Confidence Calibration（置信度校准）**：模型是否避免在信息不足时表现出过度自信（Overconfidence）。\n    *   **Clarification Seeking（澄清寻求）**：模型是否主动寻求缺失的上下文、时间或源信息。\n    *   **Memory Faithfulness（记忆忠实度）**：模型是否保留了冲突证据，而非强行合并或丢弃。\n\n§ 7 实验设计与结论（提出什么问题 → 用什么实验验证 → 结论是什么；如果当前文本缺乏实验细节，明确说明并从摘要、引言推断）\n**研究问题**：\n1.  LLM 代理在面对不可还原的记忆冲突时，能否正确识别不确定性并采取适当行动（如澄清、条件化建议），而非强行给出确定答案？\n2.  在端到端代理系统中，性能瓶颈是源于上游的记忆提取（丢失了冲突相关的结构信息），还是下游的冲突推理（缺乏处理不确定性的认知能力）？\n3.  现有的固定冲突解决规则是否足以应对不同类型的个人记忆冲突？\n\n**实验验证**：\n*   **模型评估**：在五个不同的响应模型上运行 TANGLE 基准，对比 Oracle Track 和 Pipeline Track 的表现。\n*   **策略对比**：比较固定解决规则（Fixed Resolution Rules）与本文提出的 **Conflict-Aware Action Policy (CAAP)** 在不同冲突类型下的表现。CAAP 根据可用证据动态调整行动策略。\n\n**主要结论**：\n1.  **识别与行动的差距（Recognition-to-Action Gap）**：即使在 Oracle Track 中拥有完整记忆，模型在**识别冲突**方面表现较好，但在**校准行动**（如避免过度自信）和**寻求针对性澄清**方面表现显著不足。这表明模型虽然能“看到”冲突，但缺乏处理不确定性的认知策略。\n2.  **上游瓶颈（Upstream Bottleneck）**：对比 Oracle 和 Pipeline 轨道发现，**记忆提取**是主要瓶颈。现有的记忆系统往往保留了主题事实（Topical Facts），但丢失了承载冲突的关键关系（如上下文关联、时间动态和来源信息），导致下游推理缺乏必要证据。\n3.  **动态策略的必要性**：固定解决规则在面对特定冲突时表现不足。提出的 **CAAP** 策略通过根据证据类型适应行动，证明了在处理不可还原冲突时，需要灵活的、情境感知的行动策略，而非单一的冲突解决逻辑。", "additional_insights": "### § 8 Take-aways\n\n现有 LLM 记忆基准测试普遍存在“单一答案偏见”，即假设冲突记忆总能通过时间或权威规则还原为唯一真理，这导致模型在面对不可解冲突时产生过度自信的幻觉行为。TANGLE 基准测试通过引入 Context-Partitioned Conflict (CPC)、Behavior-Oscillation Conflict (BOC) 和 Source-Contradiction Conflict (SCC) 三种不可解冲突类型，将评估重点从“答案正确性”转向“认知行为质量”，包括冲突感知、因果推理、置信度校准、澄清寻求和记忆忠实度。实验揭示了显著的“感知-行动差距”（recognition-to-action gap）：模型能可靠地识别记忆中的矛盾，但在缺乏明确上下文时，往往无法进行适当的置信度校准或主动寻求澄清，而是强行给出确定性建议。在端到端 Pipeline 中，上游的记忆提取系统（如 Mem0, Letta）是主要瓶颈，它们倾向于保留事实性片段而丢失定义冲突所需的上下文、时间或来源关系，导致下游模型即使具备推理能力也因证据结构缺失而失效。固定的启发式策略（如最近优先、多数投票）在处理不可解冲突时表现糟糕，因为它们强行压缩了冲突结构；相比之下，Conflict-Aware Action Policy (CAAP) 通过根据证据动态选择行动（如条件化、验证、可逆试验），能更有效地适应不同类型的冲突不确定性。\n\n### § 9 最脆弱的假设\n\n该研究最核心且脆弱的假设是：**“不可解冲突”（Irreducible Conflict）在真实用户交互中是普遍存在的，且用户查询往往天然缺失解决冲突所需的关键变量（如具体上下文、当前行为阶段或来源权威）。**\n\n如果这一假设不成立，即在实际应用中，用户查询通常包含足够的上下文线索，或者记忆系统能够通过隐式推理（如基于当前时间戳、地理位置或对话历史）自动消解歧义，那么 TANGLE 所强调的“保留冲突、寻求澄清”策略将变得低效甚至多余，模型应被优化为直接输出最可能的单一答案。\n\n论文通过精心构造的 541 个实例和 40 个人设来支持这一假设，证明在缺乏显式上下文时，单一答案会导致错误。然而，论文缺乏对真实世界大规模对话日志的分析，以证明这种“缺失关键变量”的情况在自然交互中的发生频率。如果实际场景中用户倾向于提供完整上下文，或者 LLM 能够通过多模态信号（如时间、地点）自动补全上下文，那么 TANGLE 评估的“澄清寻求”能力可能并非核心需求，而仅仅是一个针对特定构造数据的过拟合指标。此外，假设记忆提取系统无法通过更复杂的语义理解来重建这些缺失的关系，这也可能随着记忆架构的进步而失效。\n\n### § 10 最小复现实验\n\n在 1 周内，你可以复现并验证论文中关于**“固定启发式策略在不可解冲突下失效”**以及**“CAAP 动态策略优于固定策略”**的核心 claim，无需复现完整的 TANGLE 数据集生成过程。\n\n**数据准备：**\n从论文附录 K 中选取 3-5 个典型的 BOC（行为振荡）和 CPC（上下文分区）实例。手动提取这些实例中的核心记忆（Core Memories）和查询（Query）。例如，选取 Case B1（预算追踪的反复循环）和 Case C2（饮酒规则依赖于次日任务）。\n\n**实现内容：**\n1.  **基线策略实现：** 实现两个简单的固定策略：\n    *   `Recency-Only`：仅根据记忆的时间戳，选择最新的记忆作为答案。\n    *   `Majority-Only`：如果存在多个记忆，选择出现频率最高的值（对于 CPC，这可能意味着忽略上下文直接选一个）。\n2.  **CAAP 简化版实现：** 使用一个强大的 LLM（如 GPT-4o 或 Claude Sonnet）作为决策器。Prompt 设计为两阶段：\n    *   Stage 1：分析记忆中的冲突类型，判断是否缺失关键信息（如“是否知道用户明天的日程？”）。\n    *   Stage 2：根据 Stage 1 的判断，选择行动空间中的一个动作：`commit`（直接回答）、`conditionalize`（给出条件性建议，如“如果明天有任务则...”）、`clarify`（提问）。\n3.  **评估指标：** 不使用复杂的 D1-D5 评分，而是采用简单的二元或三元人工评估：\n    *   **安全性/适当性**：回答是否导致了潜在的错误行动（如在不该喝酒时建议喝酒）？\n    *   **信息完整性**：回答是否保留了必要的条件或不确定性？\n\n**测量与结果判定：**\n*   **支持 Claim 的结果：** 固定策略（Recency/Majority）在 BOC/CPC 实例上频繁给出“过度自信但错误”的建议（例如，忽略 BOC 中的失败历史，直接建议重启最新尝试；或忽略 CPC 中的次日任务，直接建议饮酒）。而 CAAP 简化版能够识别出缺失变量，并选择 `conditionalize` 或 `clarify`，从而避免错误建议。\n*   **反驳 Claim 的结果：** 如果固定策略在大多数情况下也能给出“足够好”的建议（例如，用户通常遵循最新偏好，或上下文可以通过常识推断），或者 CAAP 的额外复杂性并未带来显著的行为改善（即直接回答和条件化回答在实际效用上没有区别），则说明“不可解冲突”在实际中可能不如论文描述的那么关键，或者固定策略足以应对。\n\n这个实验成本低，直接验证了论文关于“冲突结构需要被保留而非强行解决”的核心论点。", "research_value": "### § 11 最强反例设计\n\n要挑战 TANGLE 的核心论点，最有力的反例并非证明“冲突不存在”，而是证明“不可还原性（Irreducibility）是评估框架的人为产物，而非真实交互的本质属性”。具体而言，可以设计一个基于**隐式上下文推断（Implicit Context Inference）**的反例实验，论证在真实世界中，LLM 代理完全可以通过多模态信号或对话历史中的细微线索来消解所谓的“不可解冲突”，从而使得 TANGLE 强调的“澄清寻求（Clarification Seeking）”不仅多余，反而损害用户体验。\n\n**实验设计：多模态/隐式上下文消解实验**\n选取 TANGLE 数据集中典型的 **Context-Partitioned Conflict (CPC)** 实例（例如：用户既喜欢“辛辣食物”又因“肠胃不适”避免辛辣）。在 TANGLE 的设定中，由于查询缺乏显式上下文，模型应寻求澄清。然而，反例实验将引入真实世界常见的**隐式信号**：\n1.  **时间戳与生物节律**：如果查询发生在深夜或用户刚结束剧烈运动后，结合健康类 App 的 API 数据（如心率变异性），模型可以高置信度地推断用户当前处于“恢复模式”，从而无需澄清即可给出“清淡饮食”的建议。\n2.  **对话历史中的情感线索**：分析前几轮对话中的情感极性。如果用户在前文中表达了“疲惫”或“压力”，这构成了隐式的上下文分区依据。\n3.  **地理位置与环境**：如果用户位于医院附近或健身房，
