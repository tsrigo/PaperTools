roduce predicted-state matching,...", "additional_insights": "### § 8 Take-aways\n本文指出传统 web agent 的 world model 采用 supervised next-state prediction 训练目标（如生成 HTML 或 AXTree），与下游 ranker 或 Process Reward Model (PRM) 需要 discriminative 特征的需求存在 misalignment。为解决此问题，作者提出了 predicted-state matching，一种 representation-agnostic 的训练目标，强制模型生成的 next-state representation 能够在多个候选动作导致的状态中被 judge model 区分出来。为了支持该方法的训练与评估，作者构建了一个 branching web-agent dataset，通过合并 WebArena Go-Browse trajectories 中的重复状态，生成了包含同一状态下不同动作及其对应结果状态的局部决策点。实验表明，基于该目标训练的 world model 在 held-out matching accuracy 上优于 supervised next-state prediction baselines，且其生成的表征能显著提升 WebPRMBench 上的 action ranking 表现，并最终在 WebArena-Lite 上提高了 end-to-end task success rate。\n\n### § 9 最脆弱的假设\n本文最核心且最脆弱的假设是：**语言模型作为 matching judge 能够准确评估生成的 predicted state 是否在语义上区分了真实的 next state，并且这种基于 LLM 判断的 reward 能够引导模型学习到对下游 PRM 真正有用的 discriminative features，而非仅仅迎合 judge 的偏好。** \n如果这个假设不成立，例如 LLM judge 存在系统性偏差（如偏好特定长度的文本或某些常见网页结构描述），GRPO 训练可能会导致 reward hacking，使 world model 生成对人类或下游模型无意义的表征。在实际应用中，由于网页状态的复杂性和高维性，LLM judge 很容易在极其相似的 AXTree 之间产生误判，或者忽略细微但关键的 DOM 变化。虽然论文在 Table 2 中通过跨模型评估（Qwen3-32B, GPT-4o, Llama-3.1-70B）证明了结果的鲁棒性，但这仅能说明不同 LLM judge 之间的一致性，并未提供证据证明这些 judge 的判断与“真正有用的状态区分”完全对齐。如果 judge 本身的语义匹配能力存在盲区，核心贡献将直接失效。\n\n### § 10 最小复现实验\n如果我有 1 周时间，我将最小化复现 Table 1 中的核心对比：验证 predicted-state matching 训练目标是否比 supervised next-state prediction 更能生成 discriminative 的表征。首先，从论文项目页获取或自行从 WebArena 环境中采样构建 1,000 个 branching decision points，并构造 2,000 个 pairwise examples。使用 Qwen2.5-3B 作为 base model，实现两条训练路径：一是 SFT baseline，监督模型生成固定的 AXTree target；二是使用 TRL 库实现 GRPO，以 Qwen2.5-7B 作为 frozen judge 计算 matching reward 进行强化学习。训练完成后，在 200 个 held-out examples 上，使用同一个未参与训练的 judge（如 GPT-4o-mini）评估两种模型生成的表征的 two-way matching accuracy。如果 GRPO 训练的模型 matching accuracy 显著高于 SFT baseline（例如超过 5%），则支持论文关于“discriminative training objective 优于 supervised next-state prediction”的 claim；若两者表现接近或 GRPO 表现更差，则反驳其核心论点。", "research_value": "### § 11 最强反例设计\n如果我反对这篇论文，我会设计一个针对“LLM judge 盲区与 reward hacking”的实验，提出对结果的替代解释：论文观察到的性能提升并非源于 world model 学到了真正 discriminative 的状态表征，而是源于它学会了生成迎合 LLM judge 偏好的“伪判别性”文本。具体而言，我会构造一个“Subtle DOM Mutation”测试集，其中真实动作与替代动作导致的 AXTree 差异极其微小，例如仅有一个深层节点的 `aria-hidden` 属性发生变化，或某个不可见元素的文本更新。在真实 WebArena 任务中，这类细微变化往往是任务成功的关键。我将使用论文方法训练的 world model 和 supervised next-state prediction baseline 在该测试集上生成预测状态，并引入一个基于严格 DOM diff 的 ground-truth evaluator 评估其准确性。如果实验发现，论文方法在 LLM judge 上的 matching accuracy 依然很高，但在严格 DOM diff 评估下，其生成的状态完全遗漏了关键的细微变化，甚至性能低于 baseline，这就构成了最强反例。这表明 GRPO 训练并未提升模型对真实网页状态演化的理解，而是优化出了一套能够欺骗 frozen LLM judge 的文本生成策略（例如生成包含特定动作动词的泛化描述），从而导致下游 PRM 在面对需要精确状态感知的任务时出现可预测的失败。\n\n### § 12 Follow-up Research Idea\n基于对方法核心局限的理解，即依赖 LLM judge 作为 reward 提供者会引入主观偏差并导致表征空间与下游 PRM 脱节，我提出一种全新的 framing：**Contrastive World-PRM Co-training in Latent Space**。这一想法的驱动需求是彻底消除对脆弱的 LLM textual judge 的依赖，并解决文本生成过程中的信息瓶颈。我们可以借鉴多模态对比学习（如 CLIP）和 Energy-Based Models (EBMs) 的工具，将 world model 和 PRM 从解耦的“生成-打分”流水线转变为在连续表征空间中联合优化的双塔系统。具体而言，world model 不再输出 AXTree 或文本摘要，而是直接预测 next-state 的 dense embedding；PRM 则作为 energy function，直接在该 embedding 空间内计算 action 的适配度。训练时，利用 branching dataset，采用 InfoNCE loss 将真实动作的 next-state embedding 与当前状态拉近，同时将替代动作的 embedding 推远，PRM 的 reward 预测与该对比损失进行端到端的联合反向传播。这与已有工作（包括本论文将 world model 和 PRM 解耦、依赖文本中介和 LLM judge）截然不同，它首次在 web agent 领域实现了 world model 与 reward model 的表征级对齐。第一个实验将使用 WebArena 的 branching data 训练一个轻量级双塔模型，评估其在“Subtle DOM Mutation”场景下的 action ranking 准确率，预期其在捕捉细微状态变化和抵抗 reward hacking 方面将显著优于基于文本生成和 LLM judge 的 pipeline 架构。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Kelvin Li\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Dhruv Pendharkar\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Anish Pahilajani\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Chuyi Shang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Leon Oks\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Leonid Karlinsky\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Rogerio Feris\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Trevor Darrell\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Roei Herzig\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"UC Berkeley\"},\n    {\"id\": 2, \"name\": \"MIT-IBM Watson AI Lab\"},\n    {\"id\": 3, \"name\": \"Cal Poly San Luis Obispo\"},\n    {\"id\": 4, \"name\": \"Xero\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"}\n  ]\n}\n```", "summary_translation": "最近的 web agents 通过采样候选动作、预测产生的 web states，并使用 ranker model 或 Process Reward Model (PRM) 对它们进行排序，从而利用 world models 进行 test-time action selection。这些 world models 通常通过 supervised next-state prediction 进行训练，以生成诸如 HTML 或 AXTree snapshots 之类的固定表示。然而，这一目标与下游 ranker 不一致，后者依赖于预测状态在候选动作之间具有区分性以准确对它们进行评分。为了解决这个问题，我们引入了 predicted-state matching，这是一种训练目标，要求预测表示必须将真实的产生状态与由替代动作达到的状态区分开来。我们使用源自 WebArena Go-Browse trajectories 的分支 web-agent 数据集来训练这些模型，其中每个决策点包含多个替代动作及其产生的状态。在我们留出的 predicted-state matching benchmark 上的实验表明，我们的方法优于使用 supervised next-state prediction 训练的 world models。我们进一步表明，与 action-only PRMs 以及由 supervised-next-state world models 增强的 PRMs 相比，我们的方法在 WebPRMBench 上改进了 PRM-style action ranking。最后，在 WebArena-Lite 上，使用我们的 world model 进行 test-time action selection 提高了 end-to-end task success。我们的项目页面位于：https://dhruvpendharkar.github.io/dwm/。"}, {"title": "OmegaUse-SOP: SOP Engineering for Professional Computer Use from Human Demonstrations", "arxiv_id": "2609.02149", "authors": "Yixiong Xiao, Lang An, Hucheng Yang, Pinxue Ma, Yongquan Chen, Jingjia Cao, Yusai Zhao, Ting Wang, Ting Liu, Siqi Bao, Jingbo Zhou, Hua Wu", "summary": "Large language models (LLMs) are increasingly evolving from conversational assistants into agents capable of operating external digital environments. Graphical user interface (GUI) agents play an important role in this transition, as many real-world workflows remain accessible only through user-facing software interfaces. However, despite recent progress on general computer-use benchmarks, domain-specific professional standard operating procedures (SOPs) remain challenging for GUI agents because they often involve implicit domain knowledge, software-specific conventions, and task-level verification requirements. We introduce OmegaUse-SOP, a human-in-the-loop SOP Engineering system for transforming human demonstrations of professional computer use into reusable SOP skills for GUI agents. Analogous to prompt engineering, SOP Engineering iteratively refines demonstrations, execution rules, and domain knowledge to convert professional SOPs into reusable GUI-agent skills. OmegaUse-SOP consists of four modules: Observe, Reason, Configure, and Execute. Together, these modules record expert operations as multimodal GUI traces, abstract low-level events into semantic step-level instructions, incorporate domain rules and task-specific parameters, and execute the resulting skills in live GUI environments through step-wise grounding, action generation, and verification. To demonstrate its effectiveness, we collaborate with a power-sector client and test OmegaUse-SOP on photovoltaic simulation workflows in PVsyst 7.2. The results suggest that OmegaUse-SOP can improve GUI-agent reliability on professional SOP tasks, highlighting a practical path toward deploying GUI agents in domain-specific professional software environments.", "category": "cs.AI", "cluster": "GUI \u0026 Web Agents", "tags": ["cs.AI"], "filter_reason": "论文提出了 OmegaUse-SOP，一个用于将人类专业计算机操作演示转化为 GUI 智能体可复用技能的 SOP Engineering 系统。其核心贡献在于构建 LLM 智能体的新机制，特别是通过 Observe, Reason, Configure, Execute 四个模块实现智能体的技能获取、规划和工具使用。摘要中明确提到“iteratively refines demonstrations, execution rules, and domain knowledge”，体现了智能体技能的迭代改进机制。尽管论文在光伏仿真领域进行了测试，但其本质是提出了新的智能体机制设计（SOP Engineering），而非仅仅将 LLM 作为工具解决领域问题，符合“构建LLM智能体”和“技能获取”的研究焦点，因此应予保留。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的研究问题是：如何让 GUI agents 在执行特定领域的专业软件操作时，能够有效捕获、理解并复用隐含的领域知识、软件特定惯例以及任务级验证要求。随着 Large Language Models (LLMs) 从对话助手演变为能够操作外部数字环境的 agents，GUI agents 成为接管真实世界 workflow 的关键，因为许多专业软件仅能通过用户界面而非程序化 APIs 访问。然而，尽管现有 agents 在通用计算机使用 benchmark 上取得进展，但在面对专业 Standard Operating Procedures (SOPs) 时仍频频失败。专业软件操作不仅是一长串 GUI 动作的叠加，更是受领域规则、验证习惯和软件特定约束深度塑造的实践过程。解决这一问题能够将 GUI agents 真正部署到行业特定的专业软件环境中，极大降低跨专业自动化门槛，并提升复杂任务执行的可靠性。\n\n### § 2 前人工作与不足\n该问题之前并未得到充分解决。现有的 GUI agents 研究主要沿两条路线发展：一是 GUI-specialized models 训练，如 UI-TARS、GUI-Owl 和 OmegaUse，通过专门的数据构建和端到端强化学习提升 VLMs 的 GUI grounding 和 action generation 能力；二是 agent frameworks 探索，如 Agent S2 和 UFO2，通过任务分解、规划和多智能体协作提升执行上限。商业系统如 OpenAI 的 Codex 和 Anthropic 的 Claude Code 也展示了基础的 computer-use 能力。然而，这些前人工作存在根本性不足：它们的核心假设是“凭借强大的屏幕感知与通用推理能力，agent 即可应对各类计算机任务”，但这一假设在专业 SOPs 场景下失效。近期 benchmark 如 SOP-Bench 和 Workflow-GYM 表明，LLM agents 在处理专业 workflow 时，会因歧义、分支逻辑、错误传播及缺乏软件特定知识而崩溃。前人系统缺乏捕获和重用专业程序性知识的机制——简单的坐标重放无法适应新任务实例，通用的任务分解也无法内化隐性的领域验证规则。换言之，前人方法在感知和动作维度上不断优化，却忽略了专业软件操作高度依赖不可从屏幕直接推断的 procedural knowledge，导致在专业领域部署时可靠性不足。", "core_insight": "### § 3 重建作者的思考路径\n\nGUI agents 的研究正沿着两条路径推进：一是通过专门数据构造和 reinforcement learning 训练 GUI-specialized models（如 UI-TARS、OmegaUse），二是通过 task decomposition、reflection 和 memory 等机制增强 agent frameworks（如 Agent S2、UFO2）。在 OSWorld 等 general computer-use benchmark 上，这些方法已展现出可观的能力。然而，当视线转向专业软件环境时，一个结构性问题浮现：专业工作流的成功执行不仅依赖感知和操作能力，更依赖 domain-specific standard operating procedures（SOPs）、软件特定约定、隐含专家知识以及 task-level verification 要求。SOP-Bench 和 Workflow-GYM 等 benchmark 已经证实，LLM agents 在工业和专业工作流中普遍遭遇 ambiguity、branching logic、error propagation、objective drift 和 software-specific knowledge 不足等失败模式。这些失败模式指向一个共同根源：专业程序性知识无法仅靠模型训练或通用 agent 框架自动获取。\n\n面对这一知识缺口，一个自然的经验观察是：人类专家本身是通过 demonstration 和 procedural documentation 来传递专业操作知识的。但简单的 coordinate replay 或 fixed workflow automation 无法应对界面状态变化和参数差异，而纯 LLM planning 又缺乏专业软件的 domain grounding。这就引出一个类比：在 prompt engineering 中，用户通过迭代地添加 rules、constraints 和 examples 来引导 LLM 产生可靠输出；类似地，是否可以迭代地精炼人类演示、执行规则和领域知识，将专业 SOP 转化为 GUI agent 可复用的 skill？这一类比要求系统具备四个能力：忠实记录人类操作的多模态 evidence，将低级事件抽象为语义化指令以支持跨界面泛化，允许人类注入 domain rules 和 task parameters 以适配新实例，以及在执行时逐步 grounding、生成动作并验证结果。PVsyst 光伏仿真工作流恰好提供了一个典型场景——涉及多子面板参数配置、软件特定控件操作和严格的验证需求——可以检验这一思路是否真正弥合了专业程序性知识与 agent 执行之间的鸿沟。\n\n### § 4 核心 Intuition\n\n先前方法失效的根源在于：专业软件操作的本质不是一串 GUI 动作，而是一套由领域规则、软件约定和验证习惯塑造的 trained practice，通用模型能力或坐标重放都无法捕获这层程序性知识。OmegaUse-SOP 的核心 Intuition 是把 prompt engineering 的迭代精炼逻辑迁移到 GUI 操作领域——通过 human-in-the-loop 将专家演示逐步转化为语义化、可参数化、可验证的 SOP skill，使 agent 执行时理解每一步的操作目标而非盲目重放坐标，通过 task-specific parameters 适配新实例，并通过屏幕比对验证中间结果。让这个方法奏效的关键机制是 Reason 模块：它用 VLM 将原始点击坐标 grounding 为对界面元素及其功能的自然语言描述，从而在低级事件记录与 robust agent execution 之间架起语义桥梁，使演示从一次性的操作录像变为可理解、可复用、可跨界面适配的程序性知识。", "methodology": "§ 5 具体方法与完整 Pipeline\n```text\n[Professional Demonstration]\n          |\n          v\n+-------------------+\n|     Observe       |----\u003E Multimodal GUI Traces\n+-------------------+      (screenshots, events)\n          |\n          v\n+-------------------+\n|      Reason       |----\u003E Semantic Step-level Instructions\n+-------------------+\n          |\n          v\n+-------------------+\n|    Configure      |----\u003E Configurable SOP Skill\n+-------------------+      (domain rules, parameters)\n          |\n          v\n+-------------------+\n|     Execute       |----\u003E Live GUI Execution\n+-------------------+      (grounding, action, verify)\n          |\n          v\n   [Task Completion]\n```\nOmegaUse-SOP 系统通过四个核心模块将人类专家的专业软件操作演示转化为 GUI agent 可复用的 SOP skill：\n1. **Observe 模块**：记录专家在目标软件中的操作过程，将其作为交互证据转化为多模态 GUI traces，包含截图、鼠标与键盘事件、时间戳以及视觉交互目标。\n2. **Reason 模块**：将记录的低级事件抽象为语义化的 step-level instructions。这些指令描述了被操作的对象、其视觉上下文以及在整个程序中的角色，消融实验证明该模块是将原始演示转化为可复用 SOP 表示的关键。\n3. **Configure 模块**：允许人类用户将 domain rules 和 task-specific parameters 注入到 skill 规范中，使得演示的 SOP 能够适应新的任务实例，而非仅仅重放原始演示。\n4. **Execute 模块**：在实时 GUI 环境中应用配置好的 SOP skill。通过 progressive step retrieval、screen grounding、action generation 和 result verification，逐步解释并执行当前界面上下文中的 SOP。\n\n§ 7 实验设计与结论\n- **提出问题**：OmegaUse-SOP 系统能否有效提升 GUI agents 在特定领域专业软件操作任务上的可靠性和完成率？\n- **实验验证**：研究者与电力行业客户合作，在光伏系统设计专业软件 PVsyst 7.2 上进行案例研究。实验涵盖五个代表性 SOP 任务：meteorological data import、plane-orientation setting、grid-connected system setting、detailed-losses setting 和 simulation execution。评估了 open-weight 和 proprietary vision-language models 在两种设置下的表现：直接根据高层用户指令执行任务，以及使用 OmegaUse-SOP 进行 SOP-guided 执行。此外，还进行了消融研究以验证各模块的有效性。\n- **结论**：实验结果表明，OmegaUse-SOP 显著提升了所评估的 GUI agents 在专业 SOP 任务上的完成率。消融研究进一步证实，Reason 模块在将原始演示转化为可复用 SOP 表示的过程中发挥了重要作用。这表明通过 SOP Engineering 迭代精炼人类演示和领域知识，是实现 GUI agents 在专业软件环境中可靠部署的有效路径。", "additional_insights": "### § 8 Take-aways\nOmegaUse-SOP 提出了一种 human-in-the-loop 的 SOP Engineering 方法，将人类专家的专业软件操作演示转化为 GUI agents 可复用的 SOP skills，类似于 prompt engineering 的迭代优化过程。系统由四个模块构成：Observe 记录多模态 GUI traces（截图、鼠标键盘事件、时间戳），Reason 利用 vision-language model (VLM) 将底层事件抽象为语义级步骤指令，Configure 允许用户注入领域规则和任务特定参数，Execute 在真实环境中通过逐步 grounding、动作生成和结果验证执行 SOP。在 PVsyst 7.2 光伏仿真软件上的实验表明，引入 SOP Engineering 后，Qwen3-VL、GPT-5.5 和 Opus-4.7 的任务完成率均从部分成功（1/5、3/5、2/5）提升至 100%（5/5）。消融实验证明 Reason 模块对于将原始交互轨迹转化为可复用的 SOP 表示至关重要，缺少它会导致成功率从 5/5 降至 2/5。与简单的坐标重放不同，该方法通过语义化目标描述、可配置参数和逐步验证，保留了专业流程的结构并增强了跨任务的适应性。\n\n### § 9 最脆弱的假设\n最脆弱的假设是：**Reason 模块生成的语义指令能够准确描述交互目标，并且 GUI agent 在未来的不同界面状态下能够根据这些语义指令成功定位并操作相同目标。** 这一假设是核心贡献的基础，因为整个系统的可复用性依赖于语义抽象的泛化能力。在实际中，该假设可能不成立的原因包括：专业软件的 UI 布局可能在不同版本、不同屏幕分辨率或不同项目状态下发生变化；VLM 生成的语义描述可能过于依赖当前截图的特定视觉特征（如相对位置或局部外观），当界面元素位置、颜色或上下文改变时，GUI agent 可能无法正确 grounding；专业软件中常有复杂的嵌套菜单或动态加载的组件，仅凭单步的语义指令可能不足以应对状态依赖的交互路径。论文提供的证据仅限于在 PVsyst 7.2 的 5 个固定任务上进行的实验，且每个任务只报告了三次尝试的最佳结果，没有测试在不同 PVsyst 版本、不同屏幕布局或不同项目配置下的泛化能力，也没有展示当界面发生显著变化时系统的鲁棒性。\n\n### § 10 最小复现实验\n如果有一周时间，可以做一个最小复现实验验证 Reason 模块的核心价值。选择一个具有多步骤、包含坐标点击和键盘输入的专业软件（如 PVsyst 试用版或其他具有复杂面板的开源软件），录制 2-3 个任务的专家演示轨迹。使用 Observe 模块记录原始轨迹（截图、点击坐标、键盘事件），然后使用一个现成的 VLM（如 GPT-4o 或 Qwen-VL）作为 Reason 模块，输入截图和坐标，生成语义指令。配置一个简单的 GUI agent（基于同一个 VLM），在两种条件下执行任务：Baseline（w/o Reason）直接提供原始轨迹（截图+坐标+动作类型），Treatment（w/ Reason）提供截图+语义指令+动作类型。测量任务完成率（是否达到最终预期状态）和单步成功率。如果论文的 claim 成立，w/ Reason 的任务完成率应显著高于 w/o Reason；如果两者表现相近，或者 w/ Reason 表现更差（例如语义描述误导了 agent），则反驳了 Reason 模块核心价值的 claim。这个实验不需要完整的 Configure 和 Execute 模块的高级功能（如参数替换、human-in-the-loop 验证），只需验证语义抽象这一关键环节的价值。", "research_value": "### § 11 最强反例设计\n如果我要对这篇论文发起最有力的攻击，我会设计一个“状态污染与动态 UI 漂移”实验来挑战其核心声称的泛化能力与可靠性。论文报告了 100% 的任务完成率，但其实验设定存在两个致命漏洞：一是初始状态高度固化，二是采用了“三次尝试取最佳”的宽松评估标准。在真实的专业软件 workflow 中，操作往往是路径依赖的，且 UI 状态会因前序操作或外部环境发生不可预测的变化。我的反例实验将在 PVsyst 7.2 中引入初始状态扰动（例如：预先打开一个无关的杂散面板、使用非标准的项目模板、或调整窗口分辨率），并强制要求单次执行成功。在这个设定下，Reason 模块生成的静态语义指令（如“点击左侧工具栏的第三个按钮”）将因为视觉上下文的改变而导致 GUI agent 的 grounding 失败。更致命的是，一旦 agent 在某一步发生误判并执行了错误动作，专业软件往往会进入异常状态或弹出非预期的模态对话框，导致后续所有基于标准状态假设的语义指令发生级联失效。这提供了一个具体的替代解释：论文声称的 100% 成功率并非源于 SOP Engineering 赋予的深层领域知识复用，而是由于 agent 在高度确定的初始状态和多次试错容错率下，偶然拟合了特定 UI 布局的视觉特征。如果在该反例实验中，OmegaUse-SOP 的成功率急剧下降甚至低于简单的坐标重放（因为坐标重放在固定布局下至少不会因语义歧义而误操作），则直接证伪了“语义抽象能够增强跨任务适应性”的核心 claim。\n\n### § 12 Follow-up Research Idea\n基于 OmegaUse-SOP 依赖 human-in-the-loop 配置且缺乏对动态状态处理能力的核心局限，我提出一个全新的研究方向：**从人类演示中自动推断 GUI 状态机以实现动态 SOP 规划**。该想法的驱动力在于，专业软件的操作本质上是状态依赖的，前序动作的成功与否决定了后续可用动作的集合，而当前将 SOP 线性化为静态语义指令的方法无法捕获这种隐式的状态转移逻辑。我们可以借鉴程序分析与机器人学习中的“Learning from Demonstration (LfD)”以及自动机推断技术，将多模态 GUI traces 视为系统状态的观测序列。具体而言，不再让 VLM 简单生成线性指令，而是利用 VLM 提取每一步操作的前置条件和后置效果，从而自动构建一个由 UI 状态节点和语义动作边组成的 GUI 状态机。在执行阶段，GUI agent 不再重放序列，而是作为一个 model-based planner，在每次执行动作前先验证当前真实 UI 状态是否满足状态机中的前置条件，若不满足则动态规划替代路径或触发错误恢复。第一个实验将聚焦于在具有复杂分支逻辑的专业软件（如 AutoCAD 或 PVsyst）中，收集少量包含错误恢复的人类演示轨迹，训练该状态机推断模型。随后，在刻意引入 UI 弹窗干扰和操作失败的扰动测试集上，对比基于状态机的动态规划 agent 与 OmegaUse-SOP 的静态重放 agent 在单次尝试下的任务完成率。这一提议与已有工作的根本区别在于：它将 procedural knowledge 的表示从“静态线性指令序列”升级为“形式化的状态转移图”，将 GUI agent 的角色从“轨迹执行者”转变为“具备状态感知能力的动态规划者”，从而在不增加人类标注负担的前提下真正解决专业软件自动化中的状态依赖与错误传播问题。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yixiong Xiao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Lang An\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hucheng Yang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Pinxue Ma\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yongquan Chen\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jingjia Cao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yusai Zhao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ting Wang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Ting Liu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Siqi Bao\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jingbo Zhou\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Hua Wu\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Baidu, Inc.\"},\n    {\"id\": 2, \"name\": \"Ningxia Electric Power Engineering Co., Ltd.\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Project lead and corresponding author.\"}\n  ]\n}\n```", "summary_translation": "大型语言模型 (LLMs) 正日益从对话助手演变为能够操作外部数字环境的 agents。图形用户界面 (GUI) agents 在这一转变中发挥着重要作用，因为许多现实世界的工作流仍然只能通过面向用户的软件界面访问。然而，尽管在 general computer-use benchmarks 上取得了近期进展，领域特定的专业 standard operating procedures (SOPs) 对 GUI agents 来说仍然具有挑战性，因为它们通常涉及隐性的领域知识、软件特定的约定以及 task-level verification requirements。我们引入了 OmegaUse-SOP，这是一个 human-in-the-loop 的 SOP Engineering 系统，用于将专业计算机使用的人类 demonstrations 转化为 GUI agents 可复用的 SOP skills。类似于 prompt engineering，SOP Engineering 迭代地精炼 demonstrations、执行规则和领域知识，以将专业 SOPs 转化为可复用的 GUI-agent skills。OmegaUse-SOP 由四个模块组成：Observe、Reason、Configure 和 Execute。这些模块共同将专家操作记录为 multimodal GUI traces，将 low-level events 抽象为 semantic step-level instructions，结合领域规则和 task-specific parameters，并通过 step-wise grounding、action generation 和 verification 在 live GUI environments 中执行生成的 skills。为了展示其有效性，我们与一家电力行业的客户合作，并在 PVsyst 7.2 的光伏仿真工作流上测试了 OmegaUse-SOP。结果表明，OmegaUse-SOP 能够提升 GUI agents 在专业 SOP tasks 上的可靠性，突显了在领域特定的专业软件环境中部署 GUI agents 的一条实用路径。"}]}, {"name": "Reinforcement Learning for Agentic Tasks", "count": 3, "papers": [{"title": "PGPO: Potential-Guided Policy Optimization for Multi-Turn Agentic Tasks", "arxiv_id": "2609.02236", "authors": "Yuyao Zheng, Haipeng Sun, Junwei Bao, Lemao Liu, Hongfei Jiang, Yang Song, Dejing Dou", "summary": "Group-based reinforcement learning (RL) has become an effective paradigm for LLM post-training, but in multi-turn agentic tasks with sparse terminal rewards, it often provides coarse credit for intermediate actions. To obtain more fine-grained credit assignment, recent work such as GiGPO introduces step-level advantages for intermediate actions. However, these step-level signals still rely on the final outcome of each individual trajectory. As a result, actions within failed trajectories can remain poorly differentiated, so effective actions can receive the same unfavorable credit as erroneous ones. In this work, we propose Potential-Guided Policy Optimization (PGPO) for multi-turn agentic tasks. PGPO estimates empirical state potentials from anchor-state-group return statistics within each rollout group. It then derives action advantages from potential differences between adjacent states, enabling cross-trajectory credit propagation. This provides finer-grained step-level credit assignment, especially within failed trajectories. Experiments on ALFWorld and WebShop show strong overall performance relative to recent group-based RL methods. Further analysis provides evidence that PGPO yields more informative failure-side credit signals with negligible training overhead.", "category": "cs.AI", "cluster": "Reinforcement Learning for Agentic Tasks", "tags": ["cs.AI"], "filter_reason": "这篇论文符合您的研究范围。论文的核心贡献是提出了一种名为 PGPO (Potential-Guided Policy Optimization) 的新型强化学习方法，专门用于解决多轮 LLM 智能体任务中稀疏奖励和信用分配粗糙的问题。该方法通过跨轨迹的信用传播，为失败轨迹中的有效动作提供更细粒度的步级信用分配。这直接对应了您筛选标准中“训练LLM智能体”和“agent training/RL”的保留规则。论文明确以“multi-turn agentic tasks”为研究对象，并在经典的智能体评估环境（ALFWorld, WebShop）上进行了实验，属于提升智能体长期决策和执行能力的基础训练方法研究，而非单纯的推理优化或非演化型应用。因此，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n本文旨在解决长周期、多轮交互的 agentic tasks 中，基于 group-based reinforcement learning (RL) 的 LLM post-training 所面临的 sparse terminal rewards 下的 credit assignment 难题。在 ALFWorld 和 WebShop 等交互式环境中，agent 通常只能在任务结束（成功或失败）时获得反馈，而中间动作缺乏直接监督。传统的 group-based RL 方法（如 GRPO）仅提供 trajectory-level 的粗糙监督，无法区分单条轨迹中不同动作的贡献。虽然近期的 GiGPO 引入了 step-level advantages，但其信号仍依赖于单条轨迹的最终结果，导致 failed trajectories 中的有效动作与错误动作获得同样不利的 credit（即 failure-side credit degeneracy）。解决这个问题对于提升 LLM agents 在复杂长程任务中的决策能力至关重要，它能提供更细粒度的局部 credit，纠正失败轨迹中的错误信号，且无需引入额外的 critic network、model inference 或 environment rollouts，从而以极低的计算成本显著提高策略优化的效率与最终任务成功率。\n\n### § 2 前人工作与不足\n针对多轮 agentic tasks 的稀疏奖励问题，前人研究已从多个角度进行了探索。早期的 group-based policy optimization 方法（如 RLOO 和 GRPO）通过比较同批次采样轨迹的 return 来估计 relative advantage，避免了训练独立的 critic network，但仅能提供 trajectory-level 的粗粒度监督。为了获得更精细的 step-level credit，GiGPO 提出了 anchor-state grouping 机制，通过跨轨迹匹配相同的 environment observation 来构建 step-level groups，并在组内标准化 step return。然而，GiGPO 及其后续扩展 HGPO 仍然存在根本性缺陷：它们的 step-level signals 本质上仍由各条轨迹自身的 final outcome 计算得出。在稀疏终端奖励设置下，一旦轨迹失败，其所有中间动作的 step return 均归零，导致在相同 anchor-state group 内的失败动作无法区分。这种方法的限制在于其 credit assignment 逻辑被死板地绑定在单条轨迹的最终结果上，未能评估动作所导致的状态转移本身的质量，也没有利用跨轨迹的共享状态信息来传播成功经验。因此，即使某个动作是朝向目标的有效步骤，只要该轨迹最终失败，它就会与导致失败的无效绕道动作获得相同的负面评价。", "core_insight": "### § 3 重建作者的思考路径\n\n在探索长序列多轮交互任务时，研究人员首先观察到基于 group 的强化学习方法（如 GRPO）虽然通过组内统计避免了训练 critic 网络，但在稀疏 terminal reward 环境下，trajectory-level 的信号对中间动作的监督过于粗糙。为了细化 credit assignment，GiGPO 引入了 anchor-state grouping 机制，将不同轨迹中访问相同状态的动作进行组内比较。然而，作者在分析训练动态时发现了一个关键的失败模式：这种 step-level 的 advantage 依然是从单条轨迹的最终 return 推导出来的。在稀疏奖励设定下，一旦整条轨迹失败，其所有中间动作的 return 均为零或负，导致同一 anchor-state 下的失败动作之间无法产生区分度。这意味着，在一条失败轨迹中，一个朝目标推进的有效动作与一个导致绕路的错误动作会继承相同的不利 credit，即所谓的 failure-side credit degeneracy。\n\n面对这一瓶颈，作者需要寻找一种不依赖单条轨迹最终结果来评估动作质量的信号。此时，Potential-Based Reward Shaping (PBRS) 理论提供了关键线索：PBRS 通过当前状态与后继状态的 potential 差来评估状态转移的质量，且不改变最优策略。如果能够将这一思想从 reward shaping 迁移到 credit assignment 中，利用跨轨迹的统计信息来估计状态的 potential，而非依赖单条轨迹的最终成败，就有可能打破失败轨迹内的 credit 退化。具体而言，作者注意到 anchor-state grouping 已经将不同轨迹的局部状态聚合在一起，这天然提供了一个跨轨迹的统计基础。通过计算该 anchor-state 下所有访问的平均 return，可以得到一个经验性的 state potential。这样，即使当前轨迹失败了，只要该动作将 agent 带到了一个在其他成功轨迹中具有高 potential 的后继状态，这个动作就能获得正向的局部 credit。这一思考路径自然导向了利用跨轨迹的 potential 差来构建 transition-aware 的 advantage 信号，从而在失败轨迹内部恢复有效的 credit 区分。\n\n### § 4 核心 Intuition\n\n先前方法失效的根源在于：它们用单条轨迹的最终成败来评判该轨迹上的每一步动作，导致失败轨迹里的有效动作和错误动作背同样的锅，无法区分。PGPO 的核心 Intuition 是：不要只看这条轨迹最终成没成，而要看这一步把 agent 带到了哪个状态，以及那个状态在其他轨迹里通常能不能成功。通过跨轨迹统计每个状态的“潜力”，并用前后状态的潜力差来评估动作，PGPO 就能在失败轨迹里也认出那些走向高潜力状态的好动作，从而实现跨轨迹的 credit 传播。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《PGPO: Potential-Guided Policy Optimization for Multi-Turn Agentic Tasks》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 本文旨在解决长周期、多轮交互的 agentic tasks 中，基于 group-based reinforcement learning (RL) 的 LLM post-training 所面临的 sparse terminal rewards 下的 credit assignment 难题。在 ALFWorld 和 WebShop 等交互式环境中，agent 通常只能在任务结束（成功或失败）时获得反馈，而中间动作缺乏直接监督。传统的 group-based RL 方法（如 GRPO）仅提供 trajectory-level 的粗糙监督，无法区分单条轨迹中不同动作的贡献。虽然近期的 GiGPO 引入了 step-level advantages，但其信号仍依赖于单条轨迹的最终结果，导致 failed trajectories 中的有效动作与错误动作获得同样不利的 credit（即 failure-side credit degeneracy）。解决这个问题对于提升 LLM agents 在复杂长程任务中的决策能力至关重要，它能提供更细粒度的局部 credit，纠正失败轨迹中的错误信号，且无需引入额外的 critic network、model inference 或 environment rollouts，从而以极低的计算成本显著提高策略优化的效率与最终任务成功率。 ### § 2 前人工作与不足 针对多轮 agentic tasks 的稀疏奖励问题，前人研究已从多个角度进行了探索。早期的 group-based policy optimization 方法（如 RLOO 和 GRPO）通过比较同批次采样轨迹的 return 来估计 relative advantage，避免了训练独立的 critic network，但仅能提供 trajectory-level 的粗粒度监督。为了获得更精细的 step-level credit，GiGPO 提出了 anchor-state grouping 机制，通过跨轨迹匹配相同的 enviro...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在探索长序列多轮交互任务时，研究人员首先观察到基于 group 的强化学习方法（如 GRPO）虽然通过组内统计避免了训练 critic 网络，但在稀疏 terminal reward 环境下，trajectory-level 的信号对中间动作的监督过于粗糙。为了细化 credit assignment，GiGPO 引入了 anchor-state grouping 机制，将不同轨迹中访问相同状态的动作进行组内比较。然而，作者在分析训练动态时发现了一个关键的失败模式：这种 step-level 的 advantage 依然是从单条轨迹的最终 return 推导出来的。在稀疏奖励设定下，一旦整条轨迹失败，其所有中间动作的 return 均为零或负，导致同一 anchor-state 下的失败动作之间无法产生区分度。这意味着，在一条失败轨迹中，一个朝目标推进的有效动作与一个导致绕路的错误动作会继承相同的不利 credit，即所谓的 failure-side credit degeneracy。 面对这一瓶颈，作者需要寻找一种不依赖单条轨迹最终结果来评估动作质量的信号。此时，Potential-Based Reward Shaping (PBRS) 理论提供了关键线索：PBRS 通过当前状态与后继状态的 potential 差来评估状态转移的质量，且不改变最优策略。如果能够将这一思想从 reward shaping 迁移到 credit assignment 中，利用跨轨迹的统计信息来估计状态的 potential，而非依赖单条轨迹的最终成败，就有可能打破失败轨迹内的 credit 退化。具体而言，作者注意到 anchor-state grouping 已经将不同轨迹的局部状态聚合在一起，这天然提供了一个跨轨迹的统计基础。通过计算该 anchor-state 下所有访问的平均 return，可以得到一个经验性的 state potential。这样，即使当前轨迹失败了，只要该动作将 agent 带到了一个在其他成功轨迹中具有高 potenti... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **PGPO: Potential-Guided Policy Optimization for Multi-Turn Agentic Tasks** **Yuyao Zheng**[1] _[,]_[2] **, Haipeng Sun**[2] **, Junwei Bao**[2] **, Lemao Liu**[1] **Hongfei Jiang**[2] , **Yang Song**[2] , **Dejing Dou**[1] _[,]_[3] _[,][∗]_ 1Fudan University 2Zuoyebang Education Technology 3BEDI Cloud 25213050516@m.fudan.edu.cn, dejingdou@gmail.com _∗_ Corresponding author ## **Abstract** Group-based reinforcement learning (RL) has become an effective paradigm for LLM posttraining, but in multi-turn agentic tasks with sparse terminal rewards, it often provides coarse credit for intermediate actions. To obtain more fine-grained credit assignment, recent work such as GiGPO introduces step-level advantages for intermediate actions. However, these step-level signals still rely on the final outcome of each individual trajectory. As a result, actions within failed trajectories can remain po...", "additional_insights": "### § 8 Take-aways\nPGPO针对多轮交互任务中稀疏终端奖励导致的credit assignment问题，特别是失败轨迹中有效动作与错误动作无法区分的failure-side credit degeneracy现象。该方法基于GiGPO的anchor-state grouping机制，通过计算当前状态与后继状态的empirical state potential差异，构建potential-guided advantage，实现了跨轨迹的credit propagation。为避免在简单任务上引入噪声，PGPO引入task-level success-adaptive weighting，根据任务经验成功率动态调整potential-guided advantage的权重。实验表明，PGPO在ALFWorld和WebShop上优于现有的group-based RL方法（如GRPO, GiGPO, HGPO），且几乎不增加训练开销。机制分析证实，PGPO能够在失败轨迹中提供更具区分度的credit信号，倾向于奖励那些在成功轨迹中也出现过的动作。\n\n### § 9 最脆弱的假设\nPGPO最关键的假设是：在同一个anchor-state group中，不同轨迹的访问能够提供有意义的empirical state potential，从而使得跨轨迹的credit propagation有效。这隐含了一个前提，即anchor-state grouping能够准确地将语义或状态上等价的观察匹配在一起。在实际的复杂交互环境中，这个假设极易不成立：论文中采用的是基于当前observation的exact textual matching，而在部分可观测、随机观察、释义或存在无关变化字段的环境中，这种精确匹配会变得非常脆弱。一旦匹配失效，anchor-state group会过小或语义不一致，导致empirical state potential的估计高度noisy，甚至无法聚合足够的成功轨迹证据来指导失败轨迹，核心的跨轨迹传播机制将直接失效。论文在Limitations中承认了这一风险，并在Appendix D.1中提供了一个初步的text-similarity relaxation实验（阈值为0.9）作为证据，表明PGPO在放宽匹配规则下仍优于GiGPO。然而，这并非完整的语义或表征匹配评估，缺乏在更开放、非模板化环境中的验证，证据明显不足。\n\n### § 10 最小复现实验\n如果有一周时间，可以通过最小复现实验验证PGPO的核心claim：potential-guided advantage能够在失败轨迹中区分有效动作和错误动作。使用ALFWorld环境，选择Qwen2.5-1.5B-Instruct作为policy backbone。不需要完整训练，只需使用预训练模型在ALFWorld上收集一批rollout轨迹数据。实现anchor-state grouping，并分别计算step-level advantage ($A_S$) 和 potential-guided advantage ($A_\\phi$)。测量两个关键指标：failure-group dispersion (FGD) 和 support-conditioned preference rate（比较supported和unsupported失败动作的advantage大小）。如果支持claim，$A_\\phi$ 应该具有非零的FGD，并且在support-conditioned preference rate上显著高于 $A_S$（后者预期接近0）。如果反驳claim，则 $A_\\phi$ 的FGD也为0，或者无法区分supported和unsupported的动作，说明potential差异在失败轨迹中并未提供额外的区分度。", "research_value": "### § 11 最强反例设计\n要构建对PGPO最有力的反例，我会选择具有高度动态性、部分可观测性以及状态表征非结构化的真实世界环境，例如WebArena或包含动态广告与时间戳的真实网页交互环境。PGPO的核心机制依赖于anchor-state grouping，而该机制在原论文中通过exact textual matching构建。在真实网页中，相同的逻辑状态（如“已登录的购物车页面”）往往因为动态DOM元素、推荐栏变化或URL中的session token而导致observation文本产生巨大差异。这种精确匹配的失效会直接导致anchor-state group极度稀疏，甚至退化为单条轨迹的孤立状态。一旦group size退化为1，empirical state potential的估计将完全等同于单条轨迹的final outcome，PGPO声称的cross-trajectory credit propagation机制将彻底失效，其性能将不可避免地退化至基线GiGPO甚至GRPO的水平。更致命的是，在极高维的文本空间中，偶尔发生的虚假精确匹配（如两个语义完全不同但碰巧局部文本相似的状态）会引入高度noisy的potential信号，这种错误的credit propagation不仅无法纠正失败轨迹，反而会向有效动作施加错误的惩罚，导致PGPO的性能显著低于完全不使用potential的baseline。这一反例直接挑战了论文结果的替代解释：PGPO在ALFWorld和WebShop上的成功并非因为potential-based credit assignment具有普适性，而是因为这两个环境的observation高度模板化，为anchor-state grouping提供了隐式的结构化先验，一旦脱离这种受控环境，其核心机制将可预测地崩溃。\n\n### § 12 Follow-up Research Idea\n本提议旨在彻底摆脱PGPO对显式状态匹配的依赖，将credit assignment从“状态级文本匹配”重构为“隐式表征空间的拓扑邻近”问题。驱动此想法的局限是：在开放世界中，精确的observation匹配极度脆弱，导致基于显式anchor-state的empirical state potential估计失效。为解决这一未满足的需求，可以借鉴Offline RL与Contrastive Learning领域的技术，引入Latent-Space Trajectory Stitching for Credit Assignment。具体而言，不再进行文本级的exact matching，而是训练一个轻量级的contrastive predictive coding (CPC) 模型，将多轮交互的observation映射至低维latent space，并在该空间内学习状态的动力学可达性。通过在latent space中计算状态间的距离或可达性概率，我们能够隐式地构建“软性anchor-state group”——即语义或功能上等价的状态簇。Potential信号不再依赖于硬性的组内统计，而是通过latent state在成功轨迹流形上的概率密度来估计。第一个实验将设计在具有高度观察随机性的环境中：首先注入随机噪声或无关文本段落破坏exact matching，对比PGPO与提出的Latent-Space方法在group size分布和最终任务成功率上的表现。如果Latent-Space方法能够在exact matching完全失效的条件下维持稳定的group有效大小并保持策略性能提升，而PGPO出现断崖式下跌，则证明将credit propagation转移至隐式表征空间是解决开放世界多轮agent credit assignment的正确路径。这一提议与已有工作的根本区别在于，它放弃了脆弱的符号化状态匹配，转而学习连续空间中的状态等价性，从而在不可观测或非模板化环境中实现了鲁棒的跨轨迹经验传播。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yuyao Zheng\", \"affiliations\": [1, 2], \"markers\": []},\n    {\"name\": \"Haipeng Sun\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Junwei Bao\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Lemao Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Hongfei Jiang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yang Song\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Dejing Dou\", \"affiliations\": [1, 3], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Fudan University\"},\n    {\"id\": 2, \"name\": \"Zuoyebang Education Technology\"},\n    {\"id\": 3, \"name\": \"BEDI Cloud\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "基于组的 reinforcement learning (RL) 已成为 LLM post-training 的有效范式，但在具有稀疏 terminal rewards 的多轮 agentic tasks 中，它通常为中间 actions 提供粗粒度的 credit。为了获得更细粒度的 credit assignment，诸如 GiGPO 的近期工作为中间 actions 引入了 step-level advantages。然而，这些 step-level signals 仍然依赖于每个单独 trajectory 的最终结果。因此，失败的 trajectories 内的 actions 可能仍然难以区分，使得有效的 actions 会收到与错误 actions 相同的不利 credit。在这项工作中，我们针对多轮 agentic tasks 提出了 Potential-Guided Policy Optimization (PGPO)。PGPO 从每个 rollout group 内的 anchor-state-group return statistics 中估计经验 state potentials。然后，它从相邻 states 之间的 potential differences 中推导出 action advantages，从而实现 cross-trajectory credit propagation。这提供了更细粒度的 step-level credit assignment，尤其是在失败的 trajectories 内。在 ALFWorld 和 WebShop 上的实验表明，与近期的基于组的 RL 方法相比，其整体性能强劲。进一步的分析提供了证据，表明 PGPO 能够产生信息量更大的 failure-side credit signals，且 training overhead 可忽略不计。"}, {"title": "Coverage, Not Targeting: A Structural Regime in Multi-Turn Agent Credit Assignment", "arxiv_id": "2609.02417", "authors": "Chenyu Zhou, Qiliang Jiang, Shuning Wu, Xu Zhou", "summary": "Multi-turn agentic RL increasingly treats credit assignment as a targeting problem: given a terminal verifiable reward, per-turn methods localize credit onto the turns that mattered. We identify the structural quantity that predicts when this is the right move, the verifier information density V_d = k/C (the fraction of an agent's C-step causal chain whose per-turn correctness the verifier exposes), and show that terminal-state verifiers sit deep in a low-V_d regime where targeting is the wrong axis. In controlled shared-rollout comparisons on tau^2-bench that separate reward density from credit geometry, a continuous dense reward spread uniformly beats the sparse binary outcome reward (net-harmful on 4/5 seeds), while concentrating the same advantage on progress turns or on random turns is equally harmful: targeting is second-order. The mechanism is coverage: terminal-state verification collapses the observable signal to a single final-write turn (k=1 in 98% of rollouts) while success requires a 5-8 step chain of prerequisite tool calls. A synthetic phase boundary places the crossover at V_d* ~ 0.8, whereas measured V_d is ~0.15 on tau^2-bench and ~0.4 on BFCL V3; uniform also wins on BFCL, where a matched-concentration shuffled control is negative on 8/8 seeds. The effect reproduces across model families on ToolACE-2-8B (Delta = -0.048 over 32 pre-registered seeds; an independent 20-seed replication is itself significant), and a pre-registered matched-budget breadth sweep traces a monotone dose-response whose deficit vanishes only at full chain coverage, with a reward-to-go arm reaching full-coverage parity. Uniform redistribution is the zero-information coverage default that per-turn schemes must beat; we contribute the matched-concentration shuffled control that any targeting claim should clear.", "category": "cs.AI", "cluster": "Reinforcement Learning for Agentic Tasks", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是研究多轮 LLM 智能体在强化学习中的信用分配问题。论文指出了在具有长程依赖和工具使用的智能体任务中，传统的终端稀疏奖励和目标定位式信用分配往往失效，而基于覆盖率的密集奖励机制能带来更好的训练效果。这完全符合你筛选标准中第一步关于“保留”的规定：论文研究了 agent training/RL，并且标题和摘要明确指向 Agentic / Multi-Turn Agent。此外，论文的研究对象涉及智能体的工具使用和长程决策，属于单智能体方向的核心能力范畴。该研究为如何有效训练和改进 LLM 智能体提供了重要的机制分析和实证依据，不涉及任何被排除的安全、多模态、图相关或纯系统工程领域的内容。", "intro_logic": "### § 1 研究问题与重要性\n论文解决的核心问题是：在 multi-turn agentic RL 中，面对单一的 terminal verifiable reward，如何将 endpoint signal 正确分配到产生该结果的各个 turns 上。当前主流方法将此视为一个 targeting 问题，试图通过 turn-level reward models 或 process supervision 将 credit 局部化到“真正”重要的 turns 上。然而，论文指出在 terminal-state verifiers 主导的评估范式中，这种做法是错误的。这个问题至关重要，因为 multi-turn tool-using agents 的成功轨迹通常是一个包含 5-8 步 hard-prerequisite tool calls 的因果链，而 verifier 仅在 rollout 结束时检查最终环境状态并返回标量奖励。如果 credit assignment 的方向错误，不仅会浪费大量计算资源去学习 per-step calibration，还可能因为过度集中 credit 而导致策略退化。解决这一问题能够揭示 credit assignment 的真正机制——即 coverage（覆盖广度）而非 targeting（定位精度）才是决定性因素，从而为未来的 agentic-RL 训练提供强有力的零信息默认策略，并指出只有在 verifier 暴露大部分因果链时，concentration 才值得承担其 coverage 风险。\n\n### § 2 前人工作与不足\n在本文之前，该问题主要通过添加额外信息来解决，如 turn-level reward models、learned per-step calibration [13]、process reward models [10] 以及 hindsight relabeling [1]。这些 prior methods 的隐含前提是：更好的 credit localization 能够改善训练效果。然而，这些方法存在根本性不足，原因在于其关键假设在 terminal-state verification 结构下失效。具体而言，state-transition verifier 只能对改变状态的步骤打分，导致 observable credit signal 坍缩到单个 final-write turn（$k=1$），而 read/exploration 步骤的正确性由于是 goal-relative 的，成为结构性盲区。前人未能考虑到 coverage 机制，是因为他们在实验设计中混淆了 credit geometry（credit 分布形状）与 density（信号密度）这两个轴，且缺乏 matched-concentration shuffled control 来隔离 targeting 的真实效果。他们观察到 dense rewards 优于 sparse rewards，便错误地将增益归因于更好的 localization，而没有意识到这实际上是 coverage breadth 带来的好处。此外，state-transition verifier 的 write-fraction ceiling 是一个结构性属性，前人未将其与 multi-turn tool use 的因果链长度联系起来分析，导致他们误以为可以通过 learned judge 轻易获得 per-step signal，而忽略了 read/exploration 步骤在结构上是不可观测的。因此，前人引入的 learned 或 oracle process rewards 实际上是在“付费”填补这个 observability gap，而非提供免费的 streaming verification；若这些 learned signal 依然将 credit 局部化，则会继承同样的 coverage risk。", "core_insight": "### § 3 重建作者的思考路径\n\n在 multi-turn agentic RL 中，agent 的成功轨迹本质上是一连串具有依赖关系的 tool calls，而主流的 terminal verifiable rewards 仅在 rollout 结束时检查环境的最终状态（如数据库字段）。这种设置直接引发了 credit assignment 问题：如何将单一的终端 scalar reward 合理分配到产生它的各个 turn 上？领域内对此的主流回应是“增加信息”——通过 turn-level reward models、learned per-step calibration 或 process supervision 来更好地将 credit 局部化到“真正”产生进展的 turn 上。这种思路的隐含前提是：credit 的局部化是提升性能的关键。\n\n然而，已有的经验观察呈现出一种矛盾：虽然 dense rewards 通常能打败 sparse binary rewards，但 naive per-turn rewards 往往会损害 base policy 的性能。如果局部化真的是关键杠杆，为什么把 reward 集中在 progress turns 上反而有害？要解释这个失败模式，需要审视 multi-turn tool use 的因果结构与 verifier 的观测能力之间的错配。在典型的 tool-agent 任务中，成功依赖于一条 5-8 步的因果链条，其中前序步骤多为 read/exploration 操作（如查询用户、检索订单），它们不改变环境状态，却是后续 write 操作的硬性前提。由于 state-transition verifier 只能观测到改变状态的步骤，这些 read 步骤的正确性对其完全不可见。因此，任何基于 verifier 的 progress signal 都会不可避免地坍缩到最终的 write turn 上，导致 credit signal 极度集中。\n\n基于这一结构性洞察，可以推导出：在固定 reward budget 下，无论将 credit 精准定位到 progress turn 还是随机分配给某个 turn，它都只能覆盖 5-8 步因果链条中的 1 步，使得其余必要步骤处于 credit 饥饿状态。相反，如果将相同的 terminal advantage 均匀分配到所有 turn 上，则能覆盖整条因果链条。这表明，决定性能的第一性原理是 credit 的覆盖广度而非定位精度。由此，作者自然提出了 verifier information density（$Vd = k/C$）这一结构化指标，用以量化 verifier 暴露的因果链条比例，并预测在 $Vd$ 极低的 terminal-verifier 机制下，uniform spreading 必然击败任何形式的 concentration，而 targeting 只是二阶效应。\n\n### § 4 核心 Intuition\n\n在 terminal-state verification 下，verifier 只能观察到改变状态的最终 write 步骤，导致 credit signal 坍缩到单个 turn 上；但任务成功却依赖于一条包含多个 read/exploration 前提步骤的完整因果链条。因此，将固定的 terminal reward 集中在少数 turn 上（无论定位多准）都会使大部分因果链条缺乏 credit，而将 reward 均匀分配到所有 turn 上能覆盖整条链条。真正决定性能的不是 credit 的“定位”，而是 credit 的“覆盖广度”。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Coverage, Not Targeting: A Structural Regime in Multi-Turn Agent Credit Assignment》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文解决的核心问题是：在 multi-turn agentic RL 中，面对单一的 terminal verifiable reward，如何将 endpoint signal 正确分配到产生该结果的各个 turns 上。当前主流方法将此视为一个 targeting 问题，试图通过 turn-level reward models 或 process supervision 将 credit 局部化到“真正”重要的 turns 上。然而，论文指出在 terminal-state verifiers 主导的评估范式中，这种做法是错误的。这个问题至关重要，因为 multi-turn tool-using agents 的成功轨迹通常是一个包含 5-8 步 hard-prerequisite tool calls 的因果链，而 verifier 仅在 rollout 结束时检查最终环境状态并返回标量奖励。如果 credit assignment 的方向错误，不仅会浪费大量计算资源去学习 per-step calibration，还可能因为过度集中 credit 而导致策略退化。解决这一问题能够揭示 credit assignment 的真正机制——即 coverage（覆盖广度）而非 targeting（定位精度）才是决定性因素，从而为未来的 agentic-RL 训练提供强有力的零信息默认策略，并指出只有在 verifier 暴露大部分因果链时，concentration 才值得承担其 coverage 风险。 ### § 2 前人工作与不足 在本文之前，该问题主要通过添加额外信息来解决，如 turn-level reward models、learned per-step calibration [13]、process reward models [10] 以及 hindsight relabeling [1]。这些 prior methods 的隐含前提是：更好的 credit localization 能够改善训练效果。然而，这些...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在 multi-turn agentic RL 中，agent 的成功轨迹本质上是一连串具有依赖关系的 tool calls，而主流的 terminal verifiable rewards 仅在 rollout 结束时检查环境的最终状态（如数据库字段）。这种设置直接引发了 credit assignment 问题：如何将单一的终端 scalar reward 合理分配到产生它的各个 turn 上？领域内对此的主流回应是“增加信息”——通过 turn-level reward models、learned per-step calibration 或 process supervision 来更好地将 credit 局部化到“真正”产生进展的 turn 上。这种思路的隐含前提是：credit 的局部化是提升性能的关键。 然而，已有的经验观察呈现出一种矛盾：虽然 dense rewards 通常能打败 sparse binary rewards，但 naive per-turn rewards 往往会损害 base policy 的性能。如果局部化真的是关键杠杆，为什么把 reward 集中在 progress turns 上反而有害？要解释这个失败模式，需要审视 multi-turn tool use 的因果结构与 verifier 的观测能力之间的错配。在典型的 tool-agent 任务中，成功依赖于一条 5-8 步的因果链条，其中前序步骤多为 read/exploration 操作（如查询用户、检索订单），它们不改变环境状态，却是后续 write 操作的硬性前提。由于 state-transition verifier 只能观测到改变状态的步骤，这些 read 步骤的正确性对其完全不可见。因此，任何基于 verifier 的 progress signal 都会不可避免地坍缩到最终的 write turn 上，导致 credit signal 极度集中。 基于这一结构性洞察，可以推导出：在固定 reward budget 下，无... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **Coverage, Not Targeting: A Structural Regime in Multi-Turn Agent Credit Assignment** Chenyu Zhou[1,] _[†]_ , Qiliang Jiang[2] , Shuning Wu[3] , and Xu Zhou[3,] _[†]_ \u003E 1School of Engineering, Institute of Science Tokyo, Japan \u003E 2College of Control Science and Engineering, Zhejiang University, China \u003E 3Department of Electrical and Computer Engineering, National University of Singapore, Singapore \u003E _†_ Corresponding authors: `zhou.c.76d6@m.isct.ac.jp` , `zhouxu_nus@u.nus.edu` . ## **Abstract** Multi-turn agentic RL increasingly treats credit assignment as a _targeting_ problem: given a single terminal verifiable reward, a fast-growing line of methods—turn-level reward models, learned per-step calibration, process supervision—aims to localize credit onto the turns that “really” mattered. We identify the structural quantity that predicts when this is the right move— the **verifier inform...", "additional_insights": "### § 8 Take-aways\n在 multi-turn agentic RL 中，credit assignment 长期被视为 targeting 问题，但本文指出在 terminal-state verification 主导的低 verifier information density ($V_d = k/C \\approx 0.15$) 区间，coverage 而非 targeting 才是决定策略性能的一阶因素。由于 state-transition verifier 只能观察到改变状态的 final-write turn ($k=1$)，而任务成功依赖于 5-8 步的 hard-prerequisite tool calls ($C=5-8$)，任何固定预算的 credit concentration 都会因 under-coverage 而损害策略。实验表明，将相同的 terminal advantage uniform 分配给所有 turn，不仅优于 progress-targeted 的 per-turn 分配，也优于 random-targeted 的 shuffled 分配，且 binary outcome reward 甚至会对 base policy 造成 net-harmful 影响。通过 controlled synthetic environment，论文证明了只有在 $V_d \u003E 0.8$ 的高密度区间，targeting 才能带来收益，而现实中受限于 write-fraction ceiling，多数 multi-turn tool-agent benchmarks 天然处于低 $V_d$ 的 coverage regime。因此，uniform redistribution 是该 regime 下零信息的 structurally forced default，任何声称通过 targeting 获益的方法都必须通过 matched-concentration shuffled control 来排除 concentration 因素的混淆。\n\n### § 9 最脆弱的假设\n论文核心贡献依赖于一个关键假设：任务的成功严格取决于一条不可绕过的长 causal chain（$C=5-8$ 步 hard-prerequisite tool calls），且这些 prerequisite reads 不改变 state，导致 verifier 无法提供 per-turn 信号。如果这个假设不成立，例如模型能够通过单步推理直接生成正确的 terminal write 参数，或者 causal chain 实际上很短（$C \\approx 1$），那么集中分配 credit 就不会导致严重的 under-coverage，uniform 分配的优势将随之消失。在实际中，这个假设可能不成立的原因在于，随着模型能力的提升或任务结构的简化，模型可能不需要显式的 read 步骤就能“猜”出答案，从而缩短有效 causal chain。论文为这个假设提供的证据仅限于 $\\tau^2$-bench retail 数据库任务上的静态 data-flow check，确认 100% 成功 rollout 的 terminal write 参数来自 precursor reads，但缺少对更广泛任务或更强模型下该假设是否依然成立的验证。论文也承认在 4B 模型上因 capability floor 导致 chain 完成率低而出现 null effect，侧面暗示了该假设对模型能力和任务结构的敏感度。\n\n### § 10 最小复现实验\n在一周时间内，可以利用 $\\tau^2$-bench 的 retail 子集和 Qwen3-8B 模型，复现 shared-rollout isolation 下的单次 policy update 实验来验证 \"concentration, not targeting\" 这一核心 claim。具体而言，收集一批 base policy 的 rollouts，并使用 GRPO 计算相同的 group-normalized terminal advantage $A_i$，然后将其分配为三种 credit geometry：Uniform（$a_t = A_i$）、Per-turn（按 DB-field progress 分配）和 Shuffled（随机打乱 per-turn 权重）。使用 LoRA 对模型进行单次更新，并在 held-out gradable tasks 上测量 assert-support。如果实验结果显示 Uniform 显著优于 Per-turn 和 Shuffled，且 Per-turn 与 Shuffled 之间无显著差异，则支持论文的 claim；反之，如果 Shuffled 显著差于 Per-turn，则表明 targeting 信息确实重要，直接反驳了论文的核心结论。这种方案无需复现完整的 RL 训练循环，仅通过单次更新隔离 credit geometry 的影响，验证成本最低且最具针对性。", "research_value": "### § 11 最强反例设计\n要对该论文的核心结论进行最有力的攻击，我会在包含 **trial-and-error 与 backtracking（回溯）** 的真实 agentic 任务（如 WebArena 或 SWE-bench）上设计一个反例实验，并提出一种基于 gradient variance 的替代解释。论文的核心假设是任务成功依赖于一条不可绕过的线性 causal chain，且 uniform 分配能最大化 coverage。然而，在真实的 web 交互或代码调试中，成功的 trajectory 往往包含大量探索性失败与状态回退。在这种非线性和高度冗余的因果结构下，uniform redistribution 会将等量的 positive credit 强加给那些导致错误状态、随后又被 agent 自我纠正的“无效” turns。这种做法不仅没有提供有效的 coverage，反而会系统性地强化错误行为的 log-probability，导致策略退化。具体实验设计为：在 WebArena 中筛选出成功 rollout 中包含至少一次无效点击或后退操作的子集，对比 Uniform、Per-turn（基于 URL progress）与 Shuffled 的单次 GRPO 更新。我预测在这个富含噪声的子集上，Uniform 分配的性能将显著崩溃，甚至劣于 sparse binary outcome reward，而能够区分有效 state-transition 与无效回退的 targeting 方法将重新占据优势。此外，对于论文中“binary outcome reward 对 base policy 造成 net-harmful”的现象，我提出替代解释：这并非因为 uniform 带来了 coverage 优势，而是因为 terminal-state 的 sparse reward 在长序列上产生了极高的 gradient variance，导致 policy collapse；Uniform 分配实质上扮演了 variance reduction 的正则化角色，其性能增益源于优化力学的稳定性，而非 credit 分配的几何正确性。如果通过引入 baseline subtraction 或降低 learning rate 使得 binary reward 的训练稳定，Uniform 的优势将会大幅缩水甚至消失。\n\n### § 12 Follow-up Research Idea\n基于论文在 credit geometry 上的静态视角局限，我提出一个全新的研究方向：**Epistemic Credit Assignment via Counterfactual Trajectory Bridging**。该想法的驱动局限在于：论文将 causal chain 的长度 $C$ 和 verifier 的可观测性 $V_d$ 视为环境固有的静态属性，忽略了 agent 内部的 epistemic state（认知状态）在多步交互中的动态演变。在现实中，某些 \"read\" 步骤对特定 agent 是冗余的（因其已具备先验知识），而对另一个 agent 则是不可或缺的，静态的 uniform 或 targeting 分配均无法捕捉这种 agent-relative 的信息价值。为解决这一未满足的需求，我们可以借鉴 Causal Inference 领域中的 Structural Causal Models (SCM) 与 Counterfactual Data Augmentation 技术，将 credit assignment 从“环境状态转移”重新 framing 为“agent 内部 belief 更新的信息增益”。具体而言，不再依赖外部 verifier 判断哪一步重要，而是训练一个轻量级的 latent world model 来预测 agent 的 internal hidden state。对于成功 trajectory 中的某一个 turn，我们通过 latent ablation（在 latent space 中抹去该 turn 对后续 hidden state 的影响）生成 counterfactual trajectory，并测量这种干预对 terminal success probability 的边际影响。这个边际影响即该 turn 相对于当前 agent 认知状态的 \"counterfactual credit\"。第一个实验将聚焦于 $\\tau^2$-bench 中那些模型已经部分掌握先验知识的任务，对比传统 Uniform 分配与 Counterfactual Credit 分配在 sample efficiency 上的差异。我们预期，当 agent 具备先验知识时，counterfactual 方法会自动将冗余 read 步骤的 credit 降权，集中强化真正填补 agent 认知空白的步骤，从而在保持 coverage 的同时避免 uniform 分配带来的 credit dilution，彻底超越本文提出的 zero-information default。这与现有的 process reward models 本质不同，因为它不依赖外部启发式规则打分，而是完全内生地从 agent-environment 交互的动态信息流中推导 credit。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Chenyu Zhou\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Qiliang Jiang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Shuning Wu\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Xu Zhou\", \"affiliations\": [3], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Institute of Science Tokyo\"},\n    {\"id\": 2, \"name\": \"Zhejiang University\"},\n    {\"id\": 3, \"name\": \"National University of Singapore\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"†\", \"text\": \"Corresponding authors: zhou.c.76d6@m.isct.ac.jp , zhouxu_nus@u.nus.edu .\"}\n  ]\n}\n```", "summary_translation": "Multi-turn agentic RL 越来越多地将 credit assignment 视为一个 targeting problem：给定一个 terminal verifiable reward，per-turn methods 会将 credit 定位到起关键作用的轮次上。我们识别出了预测何时采取这一策略是正确的结构量，即 verifier information density V_d = k/C（指智能体 C 步因果链中，验证器暴露其逐轮正确性的比例），并表明 terminal-state verifiers 深处 low-V_d regime 之中，在此 regime 下 targeting 是错误的 axis。在 tau^2-bench 上进行的受控 shared-rollout 比较中（该比较将 reward density 与 credit geometry 分离开来），均匀分布的 continuous dense reward 胜过 sparse binary outcome reward（在 4/5 个 seed 上产生净负面影响），而将相同的 advantage 集中在 progress turns 或 random turns 上同样有害：targeting 是 second-order 的。其机制在于 coverage：terminal-state verification 将 observable signal 坍缩至单个 final-write turn（在 98% 的 rollouts 中 k=1），而成功需要一条 5-8 步的 prerequisite tool calls 链。合成 phase boundary 将 crossover 点定在 V_d* ~ 0.8，而在 tau^2-bench 上测得的 V_d 约为 0.15，在 BFCL V3 上约为 0.4；uniform 分布在 BFCL 上同样获胜，其中 matched-concentration shuffled control 在 8/8 个 seed 上均呈负面影响。该效应在 ToolACE-2-8B 上的不同 model families 中均可重现（在 32 个 pre-registered seeds 上 Delta = -0.048；一项独立的 20-seed replication 本身也具有显著性），并且一项 pre-registered matched-budget breadth sweep 描绘出一条 monotone dose-response 曲线，其 deficit 仅在 full chain coverage 时才会消失，其中一个 reward-to-go arm 达到了 full-coverage parity。Uniform redistribution 是 per-turn schemes 必须超越的 zero-information coverage default；我们贡献了任何 targeting claim 都应通过的 matched-concentration shuffled control。"}, {"title": "DMRL: Document-Mediated Reinforcement Learning for Skill Optimization in Advertising Recommendation", "arxiv_id": "2609.02170", "authors": "Wei Zhang, Hongji Li, Song Sun, Peng Yu, Xue Yang, Lei Zhao, Peng Jiang", "summary": "Advertising recommendation requires continuously tuning complex system parameters while balancing commercial returns and user experience. Recent work has introduced large language models (LLMs) with skill documents to assist this labor-intensive process, but skill optimization remains largely prompt-driven, lacking a principled mechanism to attribute rewards to specific document edits. To address this limitation, we propose Document-Mediated Reinforcement Learning (DMRL), a skill self-evolution framework that models skill document optimization as a sequence of structured editing actions. In DMRL, an upper-level agent performs controlled document edits, while a frozen lower-level task agent evaluates their effects through A/B testing. To address credit assignment and long-term outcomes, we introduce two key components: (1) Dual-Relative Policy Optimization (DRPO), a post-training policy optimization method for robust and risk-aware advantage estimation; and (2) Long-term Reward Predictor (LRP), which estimates long-term outcomes by modeling population heterogeneity with disentangled representation learning and cross-attention transfer. DMRL was deployed on a large-scale short-video ads platform and extensive empirical evaluation shows that DMRL outperforms state-of-the-art baselines across key advertising metrics", "category": "cs.LG", "cluster": "Reinforcement Learning for Agentic Tasks", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-191 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 论文的核心贡献是提出了一个名为 DMRL (Document-Mediated Reinforcement Learning) 的“技能自我演化框架”。该框架通过上层智能体对技能文档进行结构化编辑，并利用下层任务智能体进行评估，结合强化学习算法实现技能的持续优化。这直接对应了研究焦点中的“自我演化”和“技能获取”方向。尽管论文的应用场景是广告推荐领域，但其本质是提出了一种新的智能体自我改进和演化机制，符合“如果论文在特定领域中提出了新的 agent 机制（如 continual adaptation），则不应排除——领域是场景，机制才是贡献”以及“如果论文的核心机制是 self-evolving / self-improving / iterative improvement，也应优先保留”的筛选标准。因此，该论文应予保留。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的研究问题是广告推荐系统中基于LLM agent的skill document自动优化问题，具体聚焦于如何将观察到的长期奖励精确归因到具体的文档编辑操作，并在此过程中克服反馈延迟与人群异质性带来的挑战。在线广告推荐需要持续调优复杂的系统参数以平衡商业回报与用户体验，传统的人工调优方法不仅人力成本随参数数量线性增长，且高度依赖难以形式化和迁移的专家经验，试错过程也容易陷入局部最优。尽管引入带有skill documents的LLM agents能够将调优知识外部化为可执行、可复用的接口，但现有的skill-guided方法仍缺乏原则性的机制将A/B测试的奖励归因到特定的文档编辑上。此外，广告参数调优的最终目标往往在干预数天后才会显现，且不同用户群体在短期信号到长期结果的映射上存在显著的人群异质性，这使得直接优化上层策略变得不切实际。解决这一问题能够实现高效、自动化的技能演化，在保证风险可控的前提下，显著提升广告平台的长期经济价值和综合用户体验。\n\n### § 2 前人工作与不足\n在技能获取与优化方面，前人研究已经探索了通过终身交互、执行轨迹蒸馏或异构资源合成来构建可复用的agent skills，例如Voyager、Trace2Skill和SkillFoundry。在技能迭代改进上，EvoSkill、SkillForge、CoEvoSkills以及SKILLRL等方法通过失败分析、生成-评估-修订循环或利用下游任务性能作为奖励信号来调整技能生成的概率。然而，这些方法主要停留在单个prompt或整体技能重新生成的层面进行文本细化，缺乏对结构化skill documents进行精确、可追踪局部修改的系统机制，因此无法实现编辑级别的因果归因。这是因为它们将技能视为整体文本输出，而非由结构化编辑动作组成的序列，导致无法确定具体哪项修改贡献了奖励。\n\n在长期结果建模方面，前人研究如DelayAdapter和TFT主要关注延迟二值转化标签的校正或利用短期代理预测未来结果。这些方法未能解决广告推荐系统中显著的人群异质性问题，因为它们通常在聚合数据上训练单一预测器。这种做法隐含了不同用户群体具有相似短期到长期映射的假设，而在实际广告系统中，该假设失效：聚合数据训练的预测器会被多数人群主导，导致对代表性不足群体的估计产生偏差且泛化性差。\n\n在post-training RL算法方面，GRPO及其变体（如DAPO、GSPO）虽然在通用LLM训练中表现出色，但直接应用于在线广告系统存在固有限制。标准GRPO使用组内均值和标准差进行归一化，这在面对在线实验中波动剧烈的奖励时极其敏感，容易破坏优势估计的稳定性。其次，GRPO没有利用广告A/B测试中天然的treatment-control结构作为基线，错失了更可靠的优势估计机会。最后，GRPO在计算优化信号时忽略了修改skill document本身的结构和语义成本，可能导致过于激进的修改，这在需要风险控制的工业应用中是不可接受的。这些不足源于通用RL算法缺乏对广告领域特定结构和约束的适配。", "core_insight": "### § 3 重建作者的思考路径\n\n在探索广告推荐系统的参数调优时，研究者首先面对的是传统人工调参和 Hyperparameter Optimization (HPO) 的瓶颈：人力成本高、经验难以转移且容易陷入局部最优。随着 Large Language Models (LLMs) 的发展，将领域知识外化为可执行的 skill document 成为一种有前景的范式。然而，现有的 skill-guided 方法主要依赖文本细化或 prompt 驱动的更新，缺乏一种原则性的机制来将观察到的奖励归因到具体的文档编辑动作上，即面临 edit-level credit assignment 的困境。\n\n更深层的挑战来自广告系统的 delayed outcome 特性。参数干预的最终目标（如 7 天后的商业回报）通常存在显著的延迟，使得直接在线优化上层策略变得不切实际。虽然已有研究尝试用短期信号预测长期结果，但它们普遍忽略了广告推荐系统中显著的 population heterogeneity。经验观察表明，不同用户群体在短期信号到长期结果的映射上存在巨大差异，且干预后的时间动态轨迹也各不相同。基于聚合数据训练的单一预测器必然被多数群体主导，导致对代表性不足群体的估计产生偏差。\n\n为了克服这些障碍，研究者自然会将目光投向强化学习，将 skill document 的优化建模为一系列结构化编辑动作的序列。为了在延迟和异质反馈下实现可靠的优化，系统需要解决两个核心问题：一是如何获得准确的长期奖励信号，二是如何进行稳健的策略更新。这促使研究者将 skill 优化显式解耦为长期结果预测和编辑级奖励归因两部分，并引入双层闭环架构：上层 agent 负责受控的文档编辑，下层冻结的 task agent 通过 A/B testing 评估效果。为了处理人群异质性，长期奖励预测器需要显式解耦人群不变动态与人群特定偏差，并通过历史模式迁移来增强估计；而为了处理奖励波动和实验结构，策略优化算法需要利用 treatment-control 基线并引入编辑成本正则化，从而实现风险感知的 skill 进化。\n\n### § 4 核心 Intuition\n\n现有方法失效的核心在于：它们既无法将宏观奖励精确归因到微观的文档编辑动作，也忽略了广告系统中长期奖励的显著延迟与人群异质性，导致优化信号既不可靠又短视。DMRL 的 Intuition 是将 skill 优化显式解耦为长期奖励预测与编辑级策略优化两个协同模块：通过解耦人群不变特征与人群特定偏差并迁移历史实验模式，Long-term Reward Predictor (LRP) 为不同用户群体提供准确的长期奖励代理信号；随后，Dual-Relative Policy Optimization (DRPO) 利用 A/B 测试的 treatment-control 结构作为相对基线，并结合编辑成本正则化，在稳健的优势估计下实现风险感知的 skill 进化。这种设计使得系统能够在延迟、异质且充满噪声的反馈中，精确且安全地驱动 skill document 的自我进化。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《DMRL: Document-Mediated Reinforcement Learning for Skill Optimization in Advertising Recommendation》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出并解决的研究问题是广告推荐系统中基于LLM agent的skill document自动优化问题，具体聚焦于如何将观察到的长期奖励精确归因到具体的文档编辑操作，并在此过程中克服反馈延迟与人群异质性带来的挑战。在线广告推荐需要持续调优复杂的系统参数以平衡商业回报与用户体验，传统的人工调优方法不仅人力成本随参数数量线性增长，且高度依赖难以形式化和迁移的专家经验，试错过程也容易陷入局部最优。尽管引入带有skill documents的LLM agents能够将调优知识外部化为可执行、可复用的接口，但现有的skill-guided方法仍缺乏原则性的机制将A/B测试的奖励归因到特定的文档编辑上。此外，广告参数调优的最终目标往往在干预数天后才会显现，且不同用户群体在短期信号到长期结果的映射上存在显著的人群异质性，这使得直接优化上层策略变得不切实际。解决这一问题能够实现高效、自动化的技能演化，在保证风险可控的前提下，显著提升广告平台的长期经济价值和综合用户体验。 ### § 2 前人工作与不足 在技能获取与优化方面，前人研究已经探索了通过终身交互、执行轨迹蒸馏或异构资源合成来构建可复用的agent skills，例如Voyager、Trace2Skill和SkillFoundry。在技能迭代改进上，EvoSkill、SkillForge、CoEvoSkills以及SKILLRL等方法通过失败分析、生成-评估-修订循环或利用下游任务性能作为奖励信号来调整技能生成的概率。然而，这些方法主要停留在单个prompt或整体技能重新生成的层面进行文本细化，缺乏对结构化skill documents进行精确、可追踪局部修改的系统机制，因此无法实现编辑级别的因果归因。这是因为它们将技能视为整体文本输出，而非由结构化编辑动作组成的序列，导致无法确定具体哪项修改贡献了奖励。 在长期结果建模方面，前人研究如DelayAdapter和TFT主要关注延迟二值转化标签的校正或利用短期代理预测未来结果。这些方法未能解决广告推荐系统中显著的人群异质性问题，因为它们通常在聚合...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在探索广告推荐系统的参数调优时，研究者首先面对的是传统人工调参和 Hyperparameter Optimization (HPO) 的瓶颈：人力成本高、经验难以转移且容易陷入局部最优。随着 Large Language Models (LLMs) 的发展，将领域知识外化为可执行的 skill document 成为一种有前景的范式。然而，现有的 skill-guided 方法主要依赖文本细化或 prompt 驱动的更新，缺乏一种原则性的机制来将观察到的奖励归因到具体的文档编辑动作上，即面临 edit-level credit assignment 的困境。 更深层的挑战来自广告系统的 delayed outcome 特性。参数干预的最终目标（如 7 天后的商业回报）通常存在显著的延迟，使得直接在线优化上层策略变得不切实际。虽然已有研究尝试用短期信号预测长期结果，但它们普遍忽略了广告推荐系统中显著的 population heterogeneity。经验观察表明，不同用户群体在短期信号到长期结果的映射上存在巨大差异，且干预后的时间动态轨迹也各不相同。基于聚合数据训练的单一预测器必然被多数群体主导，导致对代表性不足群体的估计产生偏差。 为了克服这些障碍，研究者自然会将目光投向强化学习，将 skill document 的优化建模为一系列结构化编辑动作的序列。为了在延迟和异质反馈下实现可靠的优化，系统需要解决两个核心问题：一是如何获得准确的长期奖励信号，二是如何进行稳健的策略更新。这促使研究者将 skill 优化显式解耦为长期结果预测和编辑级奖励归因两部分，并引入双层闭环架构：上层 agent 负责受控的文档编辑，下层冻结的 task agent 通过 A/B testing 评估效果。为了处理人群异质性，长期奖励预测器需要显式解耦人群不变动态与人群特定偏差，并通过历史模式迁移来增强估计；而为了处理奖励波动和实验结构，策略优化算法需要利用 treatment-control 基线并引入编辑成本正则化，从而实现风险感知的 skill 进化。... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：**==\u003E picture [42 x 40] intentionally omitted \u003C==** **==\u003E picture [82 x 40] intentionally omitted \u003C==** **==\u003E picture [153 x 40] intentionally omitted \u003C==** # **DMRL: Document-Mediated Reinforcement Learning for Skill Optimization in Advertising Recommendation** Wei Zhang[1] _[,][∗]_ , Hongji Li[2] _[,][∗]_ , Song Sun[2] , Peng Yu[2] _[,][†]_ , Xue Yang[1] _[,][†]_ , Lei Zhao[2] , Peng Jiang[2] \u003E 1Shanghai Jiao Tong University, 2Kuaishou Technology \u003E _∗_ Equal contribution, _†_ Corresponding Author ## **Abstract** Advertising recommendation requires continuously tuning complex system parameters while balancing commercial returns and user experience. Recent work has introduced large language models (LLMs) with skill documents to assist this labor-intensive process, but skill optimization remains largely prompt-driven, lacking a principled mechanism to attribute rewards to specific documen...", "additional_insights": "### § 8 Take-aways\n\nDMRL 将广告推荐系统中的 skill document 优化建模为结构化编辑动作序列，通过 upper-level optimizer agent 对 skill document 进行局部编辑（location, action, content 三元组），再由 frozen lower-level task agent 解析编辑后的文档执行参数干预，形成 bilevel closed-loop。核心贡献之一是 DRPO，它在 GRPO 基础上引入三项改进：用 median 和 MAD 替代 mean 和 std 进行 within-group normalization 以抵抗 heavy-tailed reward outliers；引入 treatment-control relative advantage 利用 A/B 实验的对照组作为 baseline；引入 edit cost（包含 token-level edit distance 和 semantic embedding distance）作为正则项，惩罚过度修改。核心贡献之二是 LRP，通过 disentangled representation learning 将 short-to-long reward mapping 分解为 population-agnostic 和 population-specific 两个分支，并用 cross-attention 从 memory bank 中检索历史实验的早期动态响应模式进行 transfer。两阶段训练策略先训练 LRP 再冻结 LRP 训练 DRPO，避免了 single-stage 中 reward predictor 过度拟合 short-term signals 的问题。在线实验表明 DMRL 在 LTV 上达到 +0.052% 提升，显著优于 skill optimization baselines（SAGE -0.049%, SkillOpt +0.024%, SKILLRL +0.004%）和 long-term reward modeling baselines（TFT +0.015%, DelayAdapter +0.005%）。消融实验显示 Qwen3-8B 和 8 rollouts 是最优配置，更大模型或更多 rollouts 并不单调提升性能。\n\n### § 9 最脆弱的假设\n\n最脆弱的假设是：**短期信号（1天内观测到的 metrics）包含足够的信息，使得 LRP 能够跨异质人群可靠地预测 7天长期 reward，且该预测精度足以指导 DRPO 的 policy optimization。** 整个框架的可行性依赖于 LRP 输出的 $\\hat{r}_l$ 作为 long-term reward 的 proxy 足够准确——如果 LRP 预测偏差大或方差大，DRPO 的 advantage estimation 就建立在噪声之上，edit-level credit assignment 失去意义，两阶段训练也无法补救。\n\n这个假设在实际中可能不成立的原因有三：第一，广告系统中用户的长期行为受大量外部 confounders 影响（节假日、竞品活动、宏观经济波动），这些因素在 1天窗口内不可观测但显著影响 7天 outcome。第二，论文将用户分为 4个 population group 并固定标签，但用户的行为模式会随时间漂移，固定的 population partition 可能导致 population-specific encoder 学到的偏差过期。第三，memory bank 中的历史实验与当前实验可能存在 distribution shift（广告主结构变化、平台策略更新），cross-attention retrieval 可能检索到不相关的历史模式。\n\n论文提供的证据主要是 Figure 4 的定性可视化，显示 LRP 预测值与 ground-truth 在 quantile 层面保持 ordering 一致，四个 population 的 MAE 在 0.0019%–0.0044% 之间。但论文**缺少**关键的定量评估指标：没有报告 LRP 在 test set 上的 R²、MAPE、或 calibration error；没有与 baseline predictor（如直接用 short-term reward 作为 long-term proxy）的正式对比；Figure 4 仅展示了按 short-term value 分 quantile 后的聚合均值，掩盖了 instance-level 预测方差。此外，Table 2 中 LRP 相比 TFT 和 DelayAdapter 的 LTV 提升幅度很小（+0.037% 和 +0.047%），且 LRP 的 AUD@1d 为 -0.020%，说明 LRP 的预测并非在所有维度上都优于 baseline，其可靠性边界未被充分刻画。\n\n### § 10 最小复现实验\n\n在一周时间内，最值得复现且可行的实验是验证 LRP 的核心 claim：**disentangled representation learning（population-agnostic + population-specific 双分支）比 unified encoder 更好地捕捉异质 short-to-long reward mapping。** 这个实验不需要完整的 RL pipeline、在线 A/B 环境或 LLM agent，只需要历史 trajectory 数据。\n\n**数据**：从任意广告平台的日志中构造约 10万条 trajectory，每条包含：parameter modification $\\Delta a$、user population features $u$、1天内的 short-term signals $r_s$（如 AUD@1d, PES@1d）、7天的 long-term outcome $r_l$（如 LTV）。按 short-term 和 long-term 指标的中位数将用户分为 4个 population group（Low-ST Low-LT, High-ST Low-LT, Low-ST High-LT, High-ST High-LT），按时间顺序划分 train/validation/test。\n\n**实现**：实现三个模型变体：(1) UE——单一 encoder 接收 $(r_s, \\Delta a, u)$ 直接预测 $r_l$；(2) LRP w/o MB——双分支 disentangled encoder（population-agnostic 分支输入 $(r_s, \\Delta a)$，population-specific 分支输入 $(r_s, \\Delta a, u)$）加 adversarial regularization 但不加 memory bank；(3) Full LRP——在 (2) 基础上加 cross-attention memory bank。三个模型用相同的 MLP decoder 和相同的训练超参数。\n\n**测量**：在 test set 上报告每个 population group 内的 MAE 和 R²，以及 overall R²。关键对比是 UE vs LRP w/o MB 在 High-ST Low-LT 和 Low-ST High-LT 这两个 short-to-long mapping 最不一致的 group 上的表现差异。\n\n**判定标准**：如果 LRP w/o MB 在 High-ST Low-LT 和 Low-ST High-LT 两个 group 上的 MAE 比 UE 降低超过 15% 且 R² 提升超过 0.03，则支持 disentangled representation 的核心 claim。如果三个变体在各 group 上表现无显著差异，或 UE 反而更好，则反驳该 claim，说明 population heterogeneity 可能不是 short-to-long prediction 的主要瓶颈，论文的核心设计动机存疑。", "research_value": "### § 11 最强反例设计\n\n对 DMRL 最致命的攻击点在于其核心假设——短期信号到长期奖励的映射是平稳且可预测的。我会设计一个**“Regime Shift Stress Test”（环境突变压力测试）**来证明该方法在真实广告系统的非平稳动态下会可预测地失败，并提出对现有实验结果的替代解释。具体场景为：在大型电商促销节（如双11或黑五）前夕，广告主的出价策略和用户的购买延迟行为发生根本性改变，用户倾向于“收藏加购”但延迟数天付款，导致 1天内的 short-term signals（如 CTR, CVR）急剧下降，而 7天的 long-term LTV 却大幅上升。在这种 regime shift 下，LRP 依赖的 memory bank 会通过 cross-attention 检索到促销前的历史正常模式，从而将当前“低短期信号”错误映射为“低长期 reward”。更糟糕的是，LRP 中固定的 4个 population partition 无法捕捉这种全局行为突变，导致 population-specific encoder 输出严重偏差。此时，DRPO 会基于 LRP 提供的错误 $\\hat{r}_l$ 计算 advantage，系统会判定当前维持或增加广告曝光的 skill edits 是负面的，从而引导 upper-level agent 修改 skill document 以降低曝光，导致平台在流量最高峰时期错失巨额长期收益。这个反例直接证明：当 short-to-long mapping 的底层生成机制发生漂移时，DMRL 的两阶段闭环不仅无法自我纠正，反而会基于过度自信的虚假预测进行“理性的破坏”。此外，我还提出一个**替代解释**来挑战论文声称的 +0.052% LTV 提升：这一微弱增益可能根本不来源于 LRP 的精准预测和 DRPO 的 credit assignment，而仅仅是 DRPO 中 edit cost regularization 起到的副作用——即惩罚激进修改本质上是一个强大的 conservative regularization，它迫使 agent 在复杂高维参数空间中倾向于维持现状或仅做微调，这种“保守化”本身就能在波动剧烈的在线广告系统中避免灾难性配置，从而被动获得微弱的长期 LTV 提升。如果去除 LRP 仅保留 edit cost penalty 也能达到类似效果，论文的核心因果链条便被彻底切断。\n\n### § 12 Follow-up Research Idea\n\n基于 DMRL 在绝对长期奖励预测上的脆弱性，我提出一个非增量的 novel research idea：**Causal Preference-based Skill Evolution without Absolute Long-term Reward Modeling**（无需绝对长期奖励建模的因果偏好技能演化）。这个想法的驱动局限是：在高度非平稳的广告系统中，预测绝对的 7天 LTV 值既不可能也无必要，DMRL 依赖的 LRP 本质上是在拟合一个不断变动的目标，极易被未观测 confounders 干扰。我们真正需要的不是“这次编辑能带来多少 LTV”，而是“在当前上下文中，编辑 A 是否比编辑 B 在长期来看更优”。\n\n为了实现这一目标，可以借鉴因果推断中的 **Surrogate Index Theory** 与 LLM alignment 中的 **Direct Preference Optimization (DPO)** 的交叉结合。具体而言，不再训练 LRP 回归绝对 reward，而是利用历史 A/B 实验数据构建基于短期代理指标的 **Counterfactual Preference Pairs**。通过 doubly robust estimation 估计不同 skill edits 在短期代理指标上的长期偏好方向，将 RL 问题转化为基于偏好的 offline alignment 问题。第一个实验大概长这样：从历史日志中提取同一上下文下的两种不同 skill edits 及其短期多维度代理反馈，使用 doubly robust estimator 估计其长期偏好概率，构造偏好数据集。随后，直接使用 DPO loss 训练 upper-level agent 进行 skill document 编辑，完全抛弃 LRP 和 GRPO pipeline。在模拟的 regime shift 测试集上，对比 DMRL 与该 Causal-DPO 方法的 LTV 变化。如果 Causal-DPO 在平稳期表现与 DMRL 相当，但在 regime shift 期表现出显著更小的性能崩塌（即更低的 negative transfer），则证明放弃绝对 reward 建模、转向因果偏好排序是解决长期反馈延迟的更优范式。这一提议彻底改变了问题的 framing，将不可解的非平稳回归问题降维为对噪声更鲁棒的偏好排序问题，与现有依赖 reward predictor 的 RL 方法形成根本区分。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Wei Zhang\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Hongji Li\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Song Sun\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Peng Yu\", \"affiliations\": [2], \"markers\": [\"†\"]},\n    {\"name\": \"Xue Yang\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Lei Zhao\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Peng Jiang\", \"affiliations\": [2], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Shanghai Jiao Tong University\"},\n    {\"id\": 2, \"name\": \"Kuaishou Technology\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding Author\"}\n  ]\n}\n```", "summary_translation": "广告推荐需要持续调整复杂的系统参数，同时平衡商业回报与用户体验。近期的研究引入了结合 skill documents 的大语言模型 (LLMs) 来辅助这一劳动密集型过程，但 skill optimization 在很大程度上仍然是 prompt 驱动的，缺乏一种原则性机制将奖励归因于特定的文档编辑。为了解决这一局限性，我们提出了 Document-Mediated Reinforcement Learning (DMRL)，这是一种 skill self-evolution 框架，将 skill document optimization 建模为一系列结构化编辑动作。在 DMRL 中，上层 agent 执行受控的文档编辑，而冻结的下层 task agent 通过 A/B testing 评估其效果。为了解决 credit assignment 和长期结果问题，我们引入了两个关键组件：(1) Dual-Relative Policy Optimization (DRPO)，一种用于鲁棒且具有风险意识的 advantage estimation 的 post-training policy optimization 方法；以及 (2) Long-term Reward Predictor (LRP)，它通过利用 disentangled representation learning 和 cross-attention transfer 对群体异质性进行建模来估计长期结果。DMRL 被部署在一个大规模短视频广告平台上，广泛的实证评估表明，DMRL 在关键广告 metrics 上优于 state-of-the-art baselines。"}]}, {"name": "Recommender Systems \u0026 Production Agents", "count": 2, "papers": [{"title": "CORAL: An LLM-Native Harness for Production Recommender Systems", "arxiv_id": "2609.02730", "authors": "Muhammad Rafay Azhar, Yuhang Zhou, Gilbert Jiang, Yuchen Wang, Rahul Sharma, Matthew DeSousa, Jiayi Liu, Xin Guo, Lizhu Zhang, Xiangjun Fan", "summary": "Production recommender systems shape what billions of people see, and sustaining their performance requires continual optimization: as content, user behavior, and upstream models shift, the choices governing retrieval, ranking, and serving must be revisited. Traditionally, human engineers test such changes through online experiments--a slow, reactive process limited by engineering effort, leaving parts of the system unrevised as conditions change. Although large language models have been applied to ranking, user modeling, and offline model development, few systems place an agent in a continual closed loop that acts on a live recommender and learns from the measured effects of its decisions. We present CORAL (Constraint-Optimized Recommender via an Agentic Loop), an LLM-native harness that closes this loop: each cycle, the agent observes operating signals, reasons over a memory of past decisions and outcomes, and invokes tools--including a numerical optimizer that keeps changes within a fixed operating budget--to reconfigure the recommender, with measured outcomes informing the next cycle. We formulate this as a partially observed, non-stationary, constrained optimization problem in which the policy improves in context, without parameter updates, from its prior actions. Across two large-scale social platforms, evaluated with A/B experiments, the same harness improves engagement at no additional serving cost on one and reduces serving cost without degrading engagement on the other, spanning the engagement-efficiency frontier. Performance improves as the loop iterates, suggesting that a single agentic loop can automate continual optimization work traditionally performed by human algorithm engineers under explicit guardrails.", "category": "cs.CL", "cluster": "Recommender Systems \u0026 Production Agents", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-48 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了 CORAL，一个 LLM-native harness（智能体运行框架），它将 LLM 智能体置于一个持续的闭环中，用于生产推荐系统的自动优化。论文明确涉及了智能体的多个核心能力：记忆（reasons over a memory of past decisions）、工具使用（invokes tools）、环境交互与反馈（acts on a live recommender and learns from the measured effects）以及自我演化（policy improves in context, without parameter updates, from its prior actions; performance improves as the loop iterates）。\n\n根据筛选标准第一步的“保留”规则，论文研究的正是 agent 的 harness / continual harness，并且核心贡献是让这些智能体运行组件通过轨迹、反馈、观测结果自动改进和自适应优化。虽然该智能体被应用于推荐系统这一特定领域，但论文的本质是提出了一种新的“自我演化”和“闭环自适应”的智能体机制，符合“领域是场景，机制才是贡献”的例外保留原则。此外，论文也命中了第二步的多个正面指标（Agent Harness, Memory, Tool Use, Self-Improvement, Online Adaptation）。因此，该论文与你的“LLM智能体及其演化”研究高度相关。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是：如何让一个 LLM agent 在生产级 recommender system 的 live control surface 上，以持续的 closed loop 方式自主完成系统参数的调优与资源分配，同时严格遵守 operating budget 等硬性约束，并从每次决策的实测效果中学习以改进后续决策。具体而言，系统将此形式化为一个 partially observed、non-stationary、constrained optimization 问题——agent 每个周期观察聚合运行信号，结合对过去决策及其效果的 memory 进行推理，调用包括 constrained optimizer 在内的 tools 生成新的 configuration，部署后通过 A/B experiment 测量效果并反馈至下一周期，整个过程无需 parameter update，完全在 context 中完成 policy 的改进。\n\n这个问题的重要性源于生产级 recommender system 的运维现实。现代工业推荐系统并非单一模型，而是涵盖 candidate retrieval、ranking、serving 的多阶段系统，其每个阶段都由大量 parameters 和 policies 治理——retrieval budgets、ranking weights、serving and caching policies、per-segment treatments 等。这些参数通常由工程师手动设定而非 end-to-end 学习得到，且随着 content、user behavior 和 upstream models 的持续漂移，原本最优的配置会逐渐偏离 best operating point。传统改进流程依赖工程师提出假设、实施变更、运行 online experiment 并根据结果迭代，这一过程受限于人力而非机会大小，导致系统的大部分参数被长期搁置、仅在出现 regression 时才被动修复。这种 reactive 且 conservative 的迭代方式对 low-signal 和 new users 尤为不利，因为他们的行为在指导决策的 aggregate metrics 中被严重 underrepresented。CORAL 通过将 LLM agent 嵌入 closed loop，将原本需要数个 engineer-weeks 的调优周期压缩至数个 autonomous days，在两个大规模社交平台的 A/B 实验中分别实现了 engagement 提升（含低信号用户）和 serving efficiency 节省，且 LLM inference cost 仅为数十美元量级——与流量完全解耦，因为 agent 作用于 control surface 而非 individual requests。\n\n### § 2 前人工作与不足\n\n该问题此前未被完整解决。现有研究可分为几条相关但均存在关键缺口的技术路线。第一条是 LLM-based recommender agents，如 RecMind（Wang et al., 2024）和 MacRec（Lei et al., 2024）等系统将 LLM agent 用于推理、规划并调用传统推荐模型作为 tools，但它们通常将每次交互独立处理，不维护 persistent user memory，更不涉及对已部署系统的持续干预。第二条通过 iterative profile refinement 或 structured memory organization 为 recommender agent 配备持久记忆，如 MemRec（Chen et al., 2026）和 RecNet（Li et al., 2026），但这些方法依赖 flat memory representation，缺乏涵盖 preference extraction、consolidation、updating 和 forgetting 的完整生命周期，且其目标仍是改进单次推荐质量而非优化系统本身的运行配置。第三条也是最近的一条——用 agent 自动化 recommender system 的开发与优化过程，如 AgentX（Lao et al., 2026）和 NOVA（Liu et al., 2026）使用 agents 搜索 models、code 和 system configurations，但这些系统的 agent 作用于 recommendation model、user representation 或 offline development pipeline，而非在 deployed production system 上运行 continual closed loop。\n\n这些不足的根本原因在于：此前的研究将 LLM agent 定位为推荐生成器或离线开发助手，而非 live system 的 continual controller。在 deployed recommender 上运行 closed loop 需要解决几个此前未被同时处理的问题——agent 必须能在每个周期将异构的、部分定性的 per-unit 信号与 domain knowledge 结合进行推理，必须通过 attribution 将观测到的变化归因于自身最近的决策，必须通过 constrained optimizer 保证每次变更严格满足 operating budget，且必须在 non-stationary 环境中通过 in-context learning 而非 retraining 来适应漂移。此前的方法要么缺乏作用于 live control surface 的机制，要么缺乏将 measured outcome 反馈为下一决策输入的 closed loop，要么缺乏对 hard budget constraint 的确定性保证——CORAL 通过将 LLM reasoning 与 deterministic tools（特别是 constrained optimizer 和 guardrails）结合，同时解决了这些需求。", "core_insight": "### § 3 重建作者的思考路径\n\n生产级 recommender systems 的性能维护本质上是一个持续优化问题。随着内容、用户行为和 upstream models 的不断变化，系统参数（如 retrieval budgets、ranking weights、serving policies）的最优点也在不断漂移。然而，传统的优化过程高度依赖人类工程师进行假设检验、实施变更和 A/B experiments。这种模式受限于人类精力，进度与工程师数量而非机会大小成正比。结果是，系统的大部分参数很少被重新审视，导致系统逐渐偏离其最佳工作点，尤其是对于在 aggregate metrics 中代表性不足的 low-signal 和 new users 而言，这种 drift 尤为严重。\n\n面对这一瓶颈，研究者自然会想到引入 LLMs 来缓解人类精力的限制。已有的 LLM 工作多集中于 offline model development、直接 ranking 或 user modeling，但这些应用要么脱离线上真实环境，要么将每次交互独立处理，缺乏一个能够直接作用于线上生产系统并从其决策后果中学习的持续闭环。要让 LLM 真正接管系统调优，必须解决两个核心痛点：一是系统调优需要权衡大量异构的、定性的 per-unit 信号（如 funnel behavior、趋势变化），这难以用固定规则表达，却恰好契合 LLM 基于 prior knowledge 进行综合推理的优势；二是 LLM 本身无法保证数值的绝对可靠性与硬性 budget 约束。\n\n因此，合理的推演路径是：不能仅仅让 LLM 输出参数，而是要为其构建一个“harness”。这个 harness 需要包含 persistent memory 来记录历史决策与真实 A/B 实验结果，使 agent 能像人类一样从失败中学习；同时，必须引入 deterministic constrained optimizer 作为工具，将 LLM 的提议投影到 budget-feasible set 上，确保任何线上变更都严格满足 serving capacity 等硬性约束。通过将 LLM 的推理判断与确定性工具的硬性保证结合，并在一个固定 cadence 的闭环中持续迭代，就能将原本耗时数周的工程师调优周期压缩为几天的自动化循环。\n\n### § 4 核心 Intuition\n\n生产级推荐系统的参数调优之所以停滞，是因为它需要人类工程师不断权衡异构的定性信号并做出妥协，这无法被简单的自动化规则取代。CORAL 的核心 intuition 在于：LLM 天然具备这种综合异构证据进行推理的能力，但为了保证其在真实系统中的可靠性，必须将其包裹在一个包含 persistent memory 和 deterministic constrained optimizer 的 harness 中。在这个闭环里，LLM 负责判断“往哪里调”，而工具负责保证“调了不超预算”，从而让 agent 从 A/B 测试的反馈中自我修正，自动完成过去只能由人类完成的迭代优化。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《CORAL: An LLM-Native Harness for Production Recommender Systems》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出的核心研究问题是：如何让一个 LLM agent 在生产级 recommender system 的 live control surface 上，以持续的 closed loop 方式自主完成系统参数的调优与资源分配，同时严格遵守 operating budget 等硬性约束，并从每次决策的实测效果中学习以改进后续决策。具体而言，系统将此形式化为一个 partially observed、non-stationary、constrained optimization 问题——agent 每个周期观察聚合运行信号，结合对过去决策及其效果的 memory 进行推理，调用包括 constrained optimizer 在内的 tools 生成新的 configuration，部署后通过 A/B experiment 测量效果并反馈至下一周期，整个过程无需 parameter update，完全在 context 中完成 policy 的改进。 这个问题的重要性源于生产级 recommender system 的运维现实。现代工业推荐系统并非单一模型，而是涵盖 candidate retrieval、ranking、serving 的多阶段系统，其每个阶段都由大量 parameters 和 policies 治理——retrieval budgets、ranking weights、serving and caching policies、per-segment treatments 等。这些参数通常由工程师手动设定而非 end-to-end 学习得到，且随着 content、user behavior 和 upstream models 的持续漂移，原本最优的配置会逐渐偏离 best operating point。传统改进流程依赖工程师提出假设、实施变更、运行 online experiment 并根据结果迭代，这一过程受限于人力而非机会大小，导致系统的大部分参数被长期搁置、仅在出现 regression 时才被动修复。这种 r...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 生产级 recommender systems 的性能维护本质上是一个持续优化问题。随着内容、用户行为和 upstream models 的不断变化，系统参数（如 retrieval budgets、ranking weights、serving policies）的最优点也在不断漂移。然而，传统的优化过程高度依赖人类工程师进行假设检验、实施变更和 A/B experiments。这种模式受限于人类精力，进度与工程师数量而非机会大小成正比。结果是，系统的大部分参数很少被重新审视，导致系统逐渐偏离其最佳工作点，尤其是对于在 aggregate metrics 中代表性不足的 low-signal 和 new users 而言，这种 drift 尤为严重。 面对这一瓶颈，研究者自然会想到引入 LLMs 来缓解人类精力的限制。已有的 LLM 工作多集中于 offline model development、直接 ranking 或 user modeling，但这些应用要么脱离线上真实环境，要么将每次交互独立处理，缺乏一个能够直接作用于线上生产系统并从其决策后果中学习的持续闭环。要让 LLM 真正接管系统调优，必须解决两个核心痛点：一是系统调优需要权衡大量异构的、定性的 per-unit 信号（如 funnel behavior、趋势变化），这难以用固定规则表达，却恰好契合 LLM 基于 prior knowledge 进行综合推理的优势；二是 LLM 本身无法保证数值的绝对可靠性与硬性 budget 约束。 因此，合理的推演路径是：不能仅仅让 LLM 输出参数，而是要为其构建一个“harness”。这个 harness 需要包含 persistent memory 来记录历史决策与真实 A/B 实验结果，使 agent 能像人类一样从失败中学习；同时，必须引入 deterministic constrained optimizer 作为工具，将 LLM 的提议投影到 budget-feasible set 上，确保任何线上变更都严格满足... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：## **CORAL: An LLM-Native Harness for Production Recommender Systems** **Muhammad Rafay Azhar**[1] , **Yuhang Zhou**[1] , **Gilbert Jiang**[1] , **Yuchen Wang**[1] , **Rahul Sharma**[1] , **Matthew DeSousa**[1] , **Jiayi Liu**[1] , **Xin Guo**[1] , **Lizhu Zhang**[1] , **Xiangjun Fan**[1] \u003E 1Meta AI Production recommender systems shape what billions of people see, and sustaining their performance is a continual optimization problem: as content, user behavior, and upstream models shift, the choices that govern how these systems retrieve, rank, and serve content must be revisited to keep them near their best operating point. This work has traditionally fallen to human engineers testing changes through online experiments—a slow, reactive process bounded by engineering effort rather than the size of the opportunity, so parts of the system go unrevised and drift as conditions change. Although...", "additional_insights": "### § 8 Take-aways\nCORAL 将生产级 recommender systems 的持续优化构建为一个 partially observed, non-stationary, constrained optimization 问题，通过 LLM agent 在闭环中直接调整 live control surface，且完全依赖 in-context learning 而无需 parameter updates。该 harness 由三个核心组件支撑：跨越周期的 persistent memory（包含 observation、assessment 和 decision stores）、确保 budget-feasible 的 deterministic tools（尤其是 constrained optimizer），以及按固定节奏迭代的 closed loop。在 Meta 的两次大规模 A/B 实验中，同一套 harness 成功横跨了 engagement-efficiency frontier：在零额外 serving cost 下提升了 video watch time 和 sessions（包括低信号和新用户），并在不降低 engagement 的前提下节省了数百万美元的 serving capacity。与传统的 per-user LLM inference 不同，CORAL 的成本与流量无关，因为 LLM 按决策周期而非按请求调用，使得总 inference cost 保持在几十美元的极低水平。\n\n### § 9 最脆弱的假设\nCORAL 最核心且失败代价最大的假设是：LLM 能够准确地将观测到的 metric 变化归因于其自身的配置调整，并利用这种 attribution 在后续周期中做出更优决策。如果这个假设不成立，整个“从自身行动后果中学习”的闭环就会退化为随机搜索，核心贡献直接失效。在实际的动态生产环境中，这个假设极易被打破：用户行为、内容趋势和 upstream models 的持续漂移构成了大量混杂因素。如果一个周期的 engagement 下降，可能并非由于 LLM 的 budget reallocation，而是因为外部环境变化或上游模型更新。如果 attribution tool 错误地将下降归咎于 LLM 的决策，agent 就会逆转一个本该正确的决策或强化一个错误决策。论文为这一假设提供的证据仅限于经验性的 A/B 实验结果（例如 Table 1 中 R2 表现中性而 R3 显著提升），暗示 loop 在实践中确实收敛，但并未提供任何机制层面的证据来证明 attribution tool 能够剥离外部混杂因素或抵抗 non-stationarity 的干扰。\n\n### § 10 最小复现实验\n在一周时间内，可以通过一个 offline simulation 最小化复现并验证“LLM 能否基于 attributed past outcomes 在闭环中迭代改进配置”这一核心 claim，而无需搭建真实的 live recommender。使用 MovieLens-1M 等公开数据集，模拟 5 个 retrieval sources，每个 source 被分配一个未知的 engagement 生成函数和 cost 曲线，并设定一个全局 budget 约束。实现一个简化的 CORAL loop：周期 1 让 LLM（如 GPT-4o）进行 zero-shot budget 分配，通过模拟器计算各 source 的 engagement 和 cost；周期 2 将上一周期的配置、观测到的 metric 变化以及 attribution 信息注入 prompt，要求 LLM 提出新的分配方案。为了引入 non-stationarity，可以在第 3 周期暗中改变某个 source 的 engagement 函数。同时实现一个无 memory 的 zero-shot LLM baseline 作为对照。测量指标为每个周期的 cumulative shortfall（相对于 oracle optimum 的差距）。如果带 memory 的 CORAL loop 的 shortfall 随周期迭代呈现收敛下降趋势，且在 non-stationarity 发生后能迅速调整恢复，同时显著优于无 memory 的 baseline，则支持论文的 claim；如果 shortfall 随机震荡甚至恶化，说明 attribution 机制在模拟环境中失效，从而反驳了其核心闭环学习能力的有效性。", "research_value": "### § 11 最强反例设计\n\n要构造对 CORAL 最致命的攻击，我会在真实生产环境中设计一个“adversarial non-stationarity with synchronized confounders”场景，直接挑战其最脆弱的 attribution 假设。具体而言，在 CORAL 运行 closed loop 的同时，人为引入一个与 CORAL 决策周期高度同步的 upstream model 漂移或 content distribution shift。例如，在 CORAL 决定削减某个低信号 user segment 的 retrieval budget 的同一周期，暗中对该 segment 的 upstream ranking model 进行一次常规的 model retraining，导致该 segment 的 baseline engagement 发生断崖式下跌。在这个实验设定下，观测到的 metric 下降实际上是由 upstream model 漂移引起的 confounding effect，但 CORAL 的 attribution tool 极大概率会将此次 regression 错误地归因于自身的 budget reallocation 决策。如果 attribution 机制失效，agent 的 persistent memory 将被污染，它不仅会逆转那个本可能在中长期被证明正确的决策，还会在 memory store 中固化错误 的 causal link，导致后续周期产生 compensatory 的错误配置。为了提供替代解释，我会对比 CORAL 与一个无 memory 的 random search baseline（仅在 constrained optimizer 定义的 feasible space 内随机采样）在上述 adversarial 环境中的表现。如果两者的 cumulative shortfall 没有显著差异，甚至 CORAL 因错误归因而陷入 performance degradation 的死循环，这就证明了 CORAL 在 A/B 实验中的成功并非源于其宣称的“in-context learning 与 attribution”，而仅仅是因为生产环境在实验期间恰好处于低 confounder 的稳定期，使得 CORAL 表现得像一个成本极低的 constrained random searcher，一旦面对真实的复杂动态环境，其核心闭环便会崩溃。\n\n### § 12 Follow-up Research Idea\n\n该想法由 CORAL 将 LLM reasoning 与 deterministic attribution 简单拼接、却缺乏真正因果推断能力的局限所驱动。在充满 confounders 的 non-stationary 环境中，LLM 试图从 memory 中的 temporal correlations 提取因果关系是根本性错误 的，这导致闭环学习极易被环境噪声破坏。我们可以借鉴 econometrics 与 causal inference 领域的 Synthetic Control Methods 与 structural causal models (SCMs)，提出一种全新的“Causal-Grounded Agentic Loop”框架。该框架不再要求 LLM 直接从观测数据中猜测 attribution，而是将 LLM 重新定位为 causal hypothesis generator 与 experiment designer。在每个周期，LLM 基于历史 memory 生成关于系统配置与 metric 之间关系的 causal graph 假设，并主动设计微小的、正交的 perturbation probes（类似于 randomized controlled trials 的微扰）注入 live control surface。随后，系统利用 synthetic control 方法，通过加权历史未受干预的 control units 构造反事实基线，将实测 metric 与反事实结果进行严格匹配，从而在数学上剥离 upstream drift 与 confounders 的干扰，得出确定性的 causal effect estimate。这些经过因果验证的 (action, effect) pairs 才会被写入 persistent memory 供 LLM 推理。第一个实验将构建一个包含多个隐藏 confounder 的模拟 multi-stage recommender，其中 upstream model 的漂移与 agent 的 action 高度相关。我们将对比原版 CORAL、无 memory baseline 以及提出的 Causal-Grounded Loop，重点观测在遭遇 severe upstream drift 时，三者维持 oracle optimum 的 cumulative regret。这一提议与现有工作的根本区别在于：它不将 LLM 视为全能的 reasoner，而是将其降级为假设生成器，将因果验证的沉重工作交还给经过严格数学证明的 econometric tools，从而从根本上解决 non-stationarity 下的 attribution 难题。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Muhammad Rafay Azhar\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuhang Zhou\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Gilbert Jiang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Yuchen Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Rahul Sharma\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Matthew DeSousa\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jiayi Liu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xin Guo\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Lizhu Zhang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiangjun Fan\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Meta AI\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"Correspondence\", \"text\": \"Muhammad Rafay Azhar, Yuhang Zhou at {rafayazhar, zyhang}@meta.com\"}\n  ]\n}\n```", "summary_translation": "生产级 recommender systems 塑造了数十亿人看到的内容，而维持其性能需要持续的优化：随着内容、用户行为和上游模型发生变化，控制 retrieval、ranking 和 serving 的选择必须被重新审视。传统上，人类工程师通过在线实验来测试此类更改——这是一个缓慢的、被动的过程，受限于工程投入，导致系统的某些部分在条件变化时未能得到修正。尽管 large language models 已被应用于 ranking、user modeling 和 offline model development，但很少有系统将 agent 置于一个持续的闭环中，使其作用于 live recommender 并从其决策的测量效果中学习。我们提出了 CORAL，即 Constraint-Optimized Recommender via an Agentic Loop，这是一个闭合该循环的 LLM-native harness：在每个周期中，agent 观察运行信号，对过去决策和结果的记忆进行推理，并调用工具——包括一个将更改保持在固定运行预算内的 numerical optimizer——来重新配置 recommender，测量的结果将为下一个周期提供信息。我们将其表述为一个 partially observed、non-stationary、constrained optimization 问题，其中 policy 在上下文中从其先前的动作中改进，而无需 parameter updates。在两个大规模社交平台上，通过 A/B experiments 进行评估，相同的 harness 在一个平台上以无额外 serving cost 提高了 engagement，在另一个平台上降低了 serving cost 而未降低 engagement，跨越了 engagement-efficiency frontier。随着循环的迭代，性能得到提升，这表明单个 agentic loop 可以在明确的 guardra
