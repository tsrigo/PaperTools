rget 回归于 return）以及 critic 的 value bias gap $\\hat{g}_\\pi$。如果 BRACE 的 claim 成立，Vanilla GAE 的 $\\hat{g}_\\pi$ 会持续偏高，Uncapped V-trace 的 $\\beta$ 会随 horizon 衰减且训练方差爆炸，而 BRACE 能够维持较高的 $\\beta$ 且 $\\hat{g}_\\pi$ 显著降低，同时训练保持稳定；如果 BRACE 的 $\\beta$ 也快速衰减或训练因 tail 方差而崩溃，则直接反驳了其核心贡献。", "research_value": "### § 11 最强反例设计\n如果我反对这篇论文，我会设计一个针对 high branching factor 任务的实验，直接挑战 BRACE 的 anchored Monte-Carlo tail 假设。BRACE 的核心在于将 terminal reward 以常数权重从 $k$ 步之外传递回来，这隐含假设了 stale behavior policy $\\mu$ 采样的 future states 与 target policy $\\pi$ 预期访问的 future states 之间存在足够的分布重叠。在长链条逻辑推理或多步代码生成等具有 high branching factor 的真实世界场景中，$\\pi$ 与 $\\mu$ 在前 $k$ 个 tokens 内的微小 divergence 会导致 $k$ 步之后的状态空间完全分叉。此时，从 $s_{t+k}$ 出发由 $\\mu$ 采样的 realized return 对 $V^\\pi(s_t)$ 而言不仅是高方差的，更是严重 biased 的，因为该 return 是基于 $\\pi$ 几乎不可能访问的 trajectory 计算的。我会设计一个实验，在多步代码合成任务（如 SWE-bench 的多轮交互变体）上人为引入高 staleness（如 $S=20$），并测量 $k$ 步后 $\\pi$ 与 $\\mu$ 状态分布的 Wasserstein distance。如果该距离随 horizon 指数增长，且 BRACE 的性能显著劣于一个在 $k$ 步后直接截断且不使用 tail 的 baseline，这就证明了 anchored tail 在 trajectory divergence 严重时引入了致命的 off-policy bias。这个反例直接揭示了 BRACE 的解耦策略并非普遍适用：当 future trajectory 的因果路径对早期 policy 变化高度敏感时，盲目使用未加权的 realized return 会破坏 value estimation 的根基。\n\n### § 12 Follow-up Research Idea\n基于 BRACE 依赖固定 $k$ 窗口和常数权重 tail 的静态 bias-variance trade-off 局限，我提出将 off-policy value correction 建模为 trajectory 级别的 counterfactual return synthesis，利用 learned adaptive correction weights 替代硬截断。驱动这个想法的未满足需求是：不同任务甚至不同 trajectory 中 critic bias 的分布是高度动态的，固定 $k$ 无法在 dense reward 的长尾依赖与 high branching 的早期分叉之间自适应切换。我们可以借鉴 Causal Inference 中的 doubly robust estimation 和 sequence modeling 中的 self-attention 机制，训练一个轻量级的 weight predictor，基于 LLM 的 hidden states 和 local importance ratios 为每个 token 生成连续的 correction weight。当 future states 由于 policy 更新而变得不可信时，该网络会自动衰减权重，实现 soft truncation 而非盲目的常数传递。这与已有工作（如 V-trace 的 truncated importance ratios 或 BRACE 的硬窗口）根本不同，因为它将 correction horizon 视为一个数据驱动的因果依赖函数，而非预设的超参数。第一个实验会在一个混合了不同 reward sparsity 和 branching factor 的任务集上训练该模型，验证 learned weights 是否能在 dense reward 场景中自动延长 correction horizon 以捕捉延迟的 credit assignment，同时在 high branching 场景中平滑衰减 tail 权重以避免 off-policy bias，从而在单一框架下动态统一并超越 BRACE 的表现。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Guanqun Zhao\", \"affiliations\": [1, 4], \"markers\": [\"*\"]},\n    {\"name\": \"Zijun Xie\", \"affiliations\": [2, 4], \"markers\": [\"*\"]},\n    {\"name\": \"Binbin Zheng\", \"affiliations\": [3, 4], \"markers\": [\"*\"]},\n    {\"name\": \"Jiafeng Lu\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Enlei Gong\", \"affiliations\": [4], \"markers\": [\"†\"]},\n    {\"name\": \"Zeyu Chen\", \"affiliations\": [4], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Beijing University of Posts and Telecommunications\"},\n    {\"id\": 2, \"name\": \"Peking University\"},\n    {\"id\": 3, \"name\": \"University of Science and Technology of China\"},\n    {\"id\": 4, \"name\": \"Baidu Inc.\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Work done during an internship at Baidu Inc.\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding authors\"}\n  ]\n}\n```", "summary_translation": "异步 reinforcement learning 已成为扩展 language models 训练的标准方式，但由此产生的 policy lag 会使 critic 偏向 stale behavior policy。现有的关于异步 LLM 训练的工作修正了 actor 但未解决这种偏差，而 classical RL 的 off-policy value correction 并不适用于 long-horizon agentic tasks，因为短的 correction horizon 会使 regression target 不受 reward 影响，而长的 correction horizon 会使 importance ratios 的乘积随 trajectory length 呈指数级漂移。我们提出 BRACE，一种用于 stale value models 的 anchored Bellman-residual correction。BRACE 将 correction horizon 限制在 policy tokens 的前缀，并在其后锚定一个 constant-weight Monte-Carlo tail，从而将 policy correction 与 reward propagation 分离。相比最强 baseline，BRACE 在 BrowseComp-Plus 上的 mean@1 提高了 $2.4\\%$，每步运行速度比 synchronous training 快 $2.46\\times$，并且在 off-policy $50$ 次更新后仍保持稳定。"}, {"title": "Building the Harness Automatically: Self-Play in Code Distills a Text Harness for Black-Box Optimization", "arxiv_id": "2609.09468", "authors": "Yi Wu, Zheng Ren, Zhiyu Hu, Haochen Wang, Daryl Chang, Li Wei, Ting Wang, Zhen Li, Pooja Gupta, Nitin Jindal, Lukasz Heldt", "summary": "Can an agent learn a numerical search strategy through executable practice and then transfer that strategy as text? We study low-budget black-box optimization, where unaided language models remain well below strong classical optimizers. During development, an agent repeatedly writes and evaluates optimizer programs. It then distills the resulting program and practice record once into a 197-word primary Harness A, which is frozen before evaluation. Harness A reduces Gemini Flash regret by 48\\% in an independent $N=30$ study ($p\u003C.001$), enters the GP-BO performance range on the practice family, and lowers mean regret on all three held-out BBOB landscapes. The same text improves every tested Gemini executor and transfers to Claude Sonnet, reducing regret by 43\\% and 49\\% ($p\\leq.005$). An independent end-to-end replication produces Harness B, a different program and text at the same performance tier. The same framework also attains the lowest regret on a sealed YouTube reward-tuning production benchmark. Executable practice is thus a viable way to discover a search policy, and language a portable medium for deploying it.", "category": "cs.LG", "cluster": "RL \u0026 Optimization for Agents", "tags": ["cs.LG"], "filter_reason": "这篇论文的核心贡献在于提出了一种让智能体通过可执行实践和自我对弈自动发现搜索策略，并将其蒸馏为文本形式 Harness（即系统提示/执行框架）的机制。这完全符合筛选标准中“保留”规则：论文研究了 agent 的 harness / scaffold / system prompt，并且核心贡献是让这些智能体运行组件通过轨迹、反馈或评估结果自动改进和演化。论文中的智能体通过反复编写和评估优化器程序（自我演化机制），最终提炼出能够显著提升 LLM 执行器性能的文本 Harness。尽管其应用场景是黑盒优化，但其本质是探讨智能体能力的自我提升和 Harness 的自动构建，属于“自我演化”和“Agent Harness 改进”的前沿研究，因此完全符合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的研究问题是：在低预算的 black-box optimization 场景下，如何让 LLM agent 通过可执行的实践学习到可靠的数值搜索策略，并将其一次性蒸馏为可移植的文本 harness，从而在评估阶段冻结并稳定地提升不同 LLM executor 的优化性能。许多科学和工程任务需要在查询预算极小的情况下优化昂贵且无梯度的目标函数，这正是 Bayesian optimization (BO) 和 evolutionary strategies 的核心应用场景。尽管 LLMs 能够解释优化历史并表达搜索启发式规则，但在缺乏特定结构时，它们作为数值优化器表现极不稳定，往往远不及传统的经典优化器。现有的改进方法通常将 LLMs 嵌入到既定的搜索程序中，或者依赖在线反馈不断修改 prompt，但这不仅容易泄露评估信息，还导致测试时的行为不可审计且难以复现。因此，探索一种能够在开发阶段学习、在评估阶段冻结，且能跨模型和任务泛化的可移植策略，对于提升 LLMs 在 black-box optimization 中的可靠性、可审计性以及实际部署价值至关重要。\n\n### § 2 前人工作与不足\n这个问题之前并未得到完全解决。在 LLMs for black-box optimization 方面，OPRO 使用文本轨迹来提出解决方案，LLAMBO 和 BOPRO 将语言模型与 BO 组件及 exploration–exploitation 控制相结合，但这些方法依赖于将 LLMs 嵌入特定搜索框架，未能学习并提取出可跨任务复用的独立策略。在 LLMs that write optimizers 方面，FunSearch、AlphaEvolve 和 LLaMEA 通过进化优化器代码来发现算法，LLaMEA-BO 将此扩展到 BBOB 基准，然而这些方法最终部署的是特定的代码实现，缺乏跨执行环境的可移植性，且未将经验蒸馏为通用的语言策略。在 Feedback-based policy improvement 方面，PromptAgent、GEPA 和 Meta-harness 等系统利用反馈进行反思、树搜索或 end-to-end harness 搜索以改进 prompt，但它们在测试结果上在线修改指令，这种做法会泄露评估信息，破坏了测试时的稳定性和可审计性。此外，AutoPDL 将自动 prompt 优化构建为结构化 AutoML 问题并生成可执行的 PDL 程序，但它缺乏从开发阶段的可执行实践中蒸馏定制策略的机制，且未在评估前进行一次性密封，无法保证 zero-shot 部署时的可审计性。这些前人工作的根本局限在于：要么将策略绑定于特定代码实现或在线反馈循环，导致泛化性和可审计性受限；要么未能建立严格的开发与评估分离机制，使得学习到的搜索行为在独立评估时无法保持 dependable。", "core_insight": "### § 3 重建作者的思考路径\n\n在低预算的 black-box optimization (BBO) 场景中，大型语言模型虽然具备解读优化历史和表达启发式策略的能力，但在缺乏外部结构时，其数值优化表现远不及 Bayesian optimization (BO) 等经典算法。早期的改进方案尝试将 LLMs 嵌入既定的搜索流程中（如 LLAMBO），但这并未让模型自身真正习得可复用的搜索策略。另一方面，基于反馈的 prompt optimization（如 OPRO）或 harness evolution 方法会根据测试结果在线调整指令，这种做法不可避免地导致了 evaluation information leakage，使得模型在独立评估时的表现难以审计且缺乏稳定性。同时，虽然 FunSearch 或 AlphaEvolve 等工作能通过代码进化发现优秀的优化器，但生成的程序代码高度依赖特定的执行环境，缺乏跨模型、跨平台的 portability。作者由此意识到，需要一种机制将“策略的发现”与“策略的部署”解耦：能否让 agent 在开发阶段通过可执行的编程实践（executable practice）自主探索并验证搜索策略，随后将这种隐含在代码和轨迹中的经验，一次性蒸馏为纯粹的自然语言文本？这种文本策略一旦在评估前冻结，不仅能避免测试时的信息泄露，还能利用语言作为通用介质，摆脱对特定代码运行时的依赖，实现跨 executor 的无缝迁移。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 是：让 agent 在开发阶段通过编写和执行优化器代码进行自我对弈，将隐性的搜索经验转化为可验证的实践记录，随后将这段实践记录一次性“蒸馏”成一段自然语言策略文本。这段被冻结的文本 prompt 在部署时指导 LLM 执行搜索，既规避了在线根据测试结果调整 prompt 带来的 evaluation leakage，又利用语言作为介质摆脱了对特定代码执行环境的依赖，从而实现了搜索策略的可靠发现与跨模型的可移植部署。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Dev Batch P_r] -----\u003E (Executable Practice) -----\u003E [Challenger a_r]\n[Incumbent a_{r-1}] --+                               |\n[Record L_{r-1}] -----+                               v\n                      |                        (Paired Eval)\n                      |                               |\n                      +\u003C-------(Selection Rule)\u003C-----+\n                      |\n                   (Loop R rounds)\n                      v\n              [Champion a_R, Log L_R]\n                      |\n        (Gate G on Validation V) -----\u003E [G=0: Audit Record]\n                      | (G=1)\n                      v\n           (One-shot Distill) -------\u003E [Distilled Text s_dist]\n                      |\n            (Freeze \u0026 Seal) ---------\u003E [Frozen Harness A_F]\n                      |\n          (Frozen Evaluation) -------\u003E [Public/Internal Results]\n```\n\n本论文的完整 Pipeline 包含训练、验证、固化与评测四个阶段，具体步骤如下：\n\n- **Executable Practice (训练阶段, Sec 3.2)**: 输入为上一轮的 incumbent program $a_{r-1}$、累积记录 $L_{r-1}$ 以及新的 development batch $P_r$。Practice agent 读取 $L_{r-1}$ 并编写 challenger program $\\tilde{a}_r$。若 $\\tilde{a}_r$ 执行正确，incumbent 和 challenger 会在相同的 $P_r$ 上使用相同的 budget 进行 Paired evaluation。根据 Selection rule，保留表现更好且有效的程序作为新的 incumbent $a_r$，并更新记录 $L_r$。此过程循环 $R$ 轮，将语言假设转化为可执行、可证伪的搜索行为。\n- **Gate (验证阶段, Sec 3.3)**: 经过 $R$ 轮后，输入为 champion program $a_R$ 和 fresh validation seeds $V$。固定的 validation rule 评估 $a_R$。若 Gate $G=0$，该 run 被拒绝并保留为 audit record；若 $G=1$，则被接受进入下一步。此步骤确保只有合格的策略进入评测，防止 evaluation information 泄露。\n- **One-shot Distill and Freeze (固化阶段, Sec 3.3)**: 输入为接受的 $(a_R, L_R)$ 和固定的执行配置 $\\theta$。Agent 将程序和实践记录一次性合成为 distilled text $s_{dist}$，随后将其冻结并封装为 frozen harness $A_F$。此阶段不搜索替代的 distilled texts，确保了 artifact 的可审计性和测试时的稳定性。\n- **Frozen Evaluation (推理与评测阶段, Sec 4, 5)**: 输入为 frozen harness $A_F$ 和未知的测试目标 $f$。在 public 或 internal evaluation 时，只有历史数据 $D_t$ 随评估改变，harness 文本和配置 $\\theta$ 保持不变，不响应任何 test outcomes。模型在推理时根据 $A_F$ 的策略指导和历史 $D_t$ 提出下一个评估点。\n\n### § 6 核心数学推导\n\n本文侧重于算法框架与实证验证，未涉及复杂的形式化数学推导或定理证明。文中仅定义了 black-box optimization 的标准设定（如 final simple regret）以及 practice 阶段的评估与选择规则，因此跳过本节。\n\n### § 7 实验设计与结论\n\n这篇论文通过三个核心实验验证了其提出的 practice–gate–distill–freeze 框架的有效性、可移植性与可复现性：\n\n- **提出问题**：Agent 能否通过 executable practice 学习数值搜索策略，并将其作为可移植的 text harness 转移到其他模型和任务中，且性能优于未辅助的 LLM 甚至接近经典优化器？\n  **实验设计**：在低预算 black-box optimization (B=20, D=8) 设置下，使用随机偏移的二次函数进行 practice。然后在 held-out BBOB landscapes (Bent Cigar, Gallagher-101, Rastrigin) 和不同 executor (Gemini Flash, Flash-Lite, Claude Sonnet) 上评估 frozen harness (Harness A)。与 random search, CMA-ES, GP-BO 等基线对比。\n  **问题答案**：Harness A 将 Gemini Flash 的 regret 降低了 48%，进入了 GP-BO 的性能范围，并在所有三个 held-out BBOB landscapes 上降低了平均 regret。相同的 text 改善了所有测试的 Gemini executor，并成功转移到 Claude Sonnet，证明了策略的可移植性。\n\n- **提出问题**：该框架的 reproducibility 目标是行为上的性能层级，而非完全相同的代码或文本。独立运行能否恢复相同的性能层级？\n  **实验设计**：独立进行端到端的 replication，产生 Harness B (不同的 champion program 和 205-word text)。在四个 fresh landscapes 上与 Harness A 和 Base LLM 对比。\n  **问题答案**：Harness A 和 Harness B 在所有四个 landscapes 上都改善了 Base LLM，并且都实现了低于 plain GP-BO 的平均 regret。这证明了独立接受的 runs 能够恢复相同的性能层级，而非依赖特定的代码实现。\n\n- **提出问题**：该框架在实际生产任务中是否有效？\n  **实验设计**：在一个密封的 7 维 YouTube reward-tuning 生产 benchmark 上评估 Replication harness (Harness B)，与 Google Vizier 和 standard GP-BO 对比。\n  **问题答案**：Harness B 在每个 budget checkpoint (5, 10, 15, 20 evals) 都实现了最低的 point estimate regret，展示了在真实生产环境中的潜力，尽管由于数据保密性无法提供统计显著性证明。", "additional_insights": "### § 8 Take-aways\n本文提出了一种 practice–gate–distill–freeze 框架，通过让 LLM agent 在开发阶段反复编写和执行 optimizer 代码进行 self-play，将其习得的数值搜索策略一次性 distill 为一段不到 200 词的纯文本 harness，并在评估前彻底 freeze。这段 frozen text harness 在 low-budget black-box optimization 中显著降低了 Gemini Flash 的 simple regret（降幅达 48%），使其性能逼近经典的 GP-BO，且在未参与训练的 BBOB landscapes 上同样表现出色。该文本策略展现出强大的 portability，无需修改即可跨不同 LLM executor（如 Gemini Flash-Lite、Claude Sonnet）转移并持续降低 regret。独立的端到端 replication 产生了完全不同的代码和文本（Harness B），但达到了相同的性能层级，证明 executable practice 提取的是一种可泛化的 search policy 而非特定代码实现。在 YouTube reward-tuning 的 sealed production benchmark 上，该方法同样取得了最低的 regret point estimate，验证了其在真实工程场景中的实用价值。\n\n### § 9 最脆弱的假设\n本文最核心且失败代价最大的假设是：**distillation 过程能够将 executable practice 中学到的复杂 search policy 完整且无损地压缩进一段简短的纯文本中，且该文本能被不同的 LLM executor 等效解析与执行。** 如果这个假设不成立，那么所谓的“portable medium”就只是一层脆弱的语义包装，而非真正的策略载体。在实际中，LLM 在 practice 阶段依赖代码执行环境进行了精确的数值计算、状态追踪与边界检查，而 distill 出的文本（如 Harness A）仅包含抽象的经济学与探测原则（如“probe independent directions”）。不同架构或能力的 LLM 在将这些自然语言指令转化为实际数值操作时，极有可能产生语义偏移或执行偏差，导致策略失效。论文提供的证据存在明显缺口：虽然展示了跨模型 transfer 的结果，但 Table 1 和 Table 10 均显示，原始的 retained program（代码实现）的 mean regret 始终低于 distilled text harness（例如在 quadratic 上 17.1 vs 32.9）。这直接暗示 distillation 过程存在显著的信息损失。如果面对更复杂的高维任务或非凸 landscape，纯文本指令可能无法提供足够的执行精度，导致核心贡献的 performance tier 直接崩塌。\n\n### § 10 最小复现实验\n在 1 周时间内，可设计一个最小复现实验来验证“frozen text harness 能跨 executor 转移并提升 low-budget BBO 性能”这一核心 claim。数据方面，选取 BBOB 基准中的 Bent Cigar 或 Rastrigin 函数，设定维度 $D=8$，query budget $B=20$。实现方面，直接使用论文 Appendix B 中公开的 197-word Harness A 文本，构建一个 stateless 的 LLM-based optimization loop：将历史评估点和剩余 budget 格式化为 prompt，让 LLM 输出下一个查询点。选取两个能力差异明显的 LLM executor（例如 Gemini Flash 和 Claude Haiku），分别运行 Base LLM（无 harness）和 LLM + Harness A 两个 arm。测量指标为 20 次评估后的 final simple regret，每个配置运行 $N=30$ 个 paired instances。如果 Harness A 在两个 executor 上的 mean regret 均显著低于对应的 Base arm（例如通过 paired Wilcoxon test 检验 $p \u003C 0.05$），则支持该 claim；如果 Harness A 仅在特定模型上有效，或在弱模型上导致 regret 不降反升（类似论文中 manual hint 损害 Flash-Lite 的现象），则反驳了文本策略的 portability 与通用有效性假设。", "research_value": "### § 11 最强反例设计\n要对该论文的核心 claim 进行最有力的攻击，我会设计一个实验来证明：**所谓的 distilled text harness 并非真正承载了可泛化的 search policy，而仅仅是一种针对特定 landscape 结构的 prompt priming，且这种 priming 在遇到与 practice 阶段几何特性相悖的 landscape 时会引发灾难性的负迁移。** 具体的替代解释是：LLM 在 practice 阶段并未学到通用的数值搜索逻辑，而是过拟合了 BBOB 基准中常见的局部凸性或坐标独立性，distill 出的文本（如“probe independent directions”）本质上是一个强 bias 的先验。当这个先验与真实任务的 landscape 几何不匹配时，frozen text harness 会锁死 LLM 的探索方向，使其表现甚至不如无任何 instruction 的 Base LLM。实验设计如下：选取两类极端的 held-out 测试函数，一类是高度旋转且坐标强耦合的 Ellipsoid 或 Rotated Rastrigin 函数（破坏“probe independent directions”的前提），另一类是具有极深欺骗性局部最优的 Ackley 函数。在这两类函数上（设定 $D=8$, $B=20$），分别对比 Base LLM、LLM + Harness A，以及一个由人类专家针对该特定函数手写的 manual hint。如果 Harness A 在这些非标准 landscape 上的 simple regret 显著劣于 Base LLM，且其失败模式表现为机械地重复正交探测而忽略全局梯度方向，则直接证伪了文本策略的泛化性与 portability 假设。这表明 distillation 不仅造成了信息损失，还固化了错误的归纳偏置，所谓的 portable medium 实际上是阻碍 LLM 动态适应的语义枷锁。\n\n### § 12 Follow-up Research Idea\n基于 distillation 过程存在信息损失与语义偏移这一核心局限，我提出一个非增量的 novel research idea：**将 black-box optimization 中的策略蒸馏从“自然语言文本”转变为“可验证的形式化约束”，建立一种 Neurosymbolic Self-Play 框架。** 驱动这个想法的未满足需求是：纯文本 harness 依赖 LLM 的语义解析来执行连续的数值操作，这种 medium 在跨模型转移时极其脆弱，且无法保证执行精度；而直接部署代码又缺乏跨环境的可移植性与可审计性。我们可以借鉴形式化验证与程序合成领域的 SMT (Satisfiability Modulo Theories) solver 技术，将 LLM agent 在 practice 阶段习得的搜索策略提取为一组与执行环境无关的 logical invariants 和 operational constraints（例如：“若连续两次查询的 reward 下降超过阈值 $\\delta$，则下一次查询方向必须与当前最优解的梯度估计正交”）。在评估阶段，LLM executor 提出下一个查询点时，必须通过一个轻量级、环境无关的 symbolic checker 验证其是否符合这些 frozen constraints；若不符合，则触发 LLM 重新生成。第一个实验将构建一个对比评估：在高度非凸且高维的 BBOB 函数上，比较 Base LLM、LLM + Text Harness A（本文方法）以及 LLM + Formal Constraint Harness。重点测量跨不同 LLM executor（如 Gemini Flash 与 Claude Haiku）转移时的 performance variance。如果新方法能将跨模型的 regret variance 显著降低至接近零，且在复杂 landscape 上的绝对性能超越 retained program，则证明形式化符号而非自然语言才是承载和部署 search policy 的可靠且 portable medium。这一提议彻底区别于现有的 FunSearch（生成特定代码）或本文（生成文本），它将策略的“语义表达”与“执行验证”解耦，开辟了将 LLM 启发式策略转化为可证明逻辑约束的新方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yi Wu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Zheng Ren\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Zhiyu Hu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Haochen Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Daryl Chang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Li Wei\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ting Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhen Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Pooja Gupta\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Nitin Jindal\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Lukasz Heldt\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Google\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution to the work.\"}\n  ]\n}\n```", "summary_translation": "agent 能否通过 executable practice 学习数值搜索策略，然后以文本形式迁移该策略？我们研究了低预算 black-box optimization，其中无辅助的 language models 仍然远低于强大的经典 optimizers。在开发阶段，agent 反复编写和评估 optimizer programs。然后，它将生成的程序和实践记录一次性提炼成一个 197 词的主要 Harness A，该 Harness A 在评估前被冻结。在一项独立的 $N=30$ 研究中 ($p\u003C.001$)，Harness A 将 Gemini Flash 的 regret 降低了 48%，在 practice family 上进入了 GP-BO 的性能范围，并在所有三个留出的 BBOB landscapes 上降低了平均 regret。相同的文本改善了所有受测的 Gemini executor，并迁移到 Claude Sonnet，将 regret 降低了 43% 和 49% ($p\\leq.005$)。一项独立的端到端复现产生了 Harness B，这是一个处于相同性能层级的不同程序和文本。相同的框架在一个封存的 YouTube reward-tuning production benchmark 上也获得了最低的 regret。因此，executable practice 是发现 search policy 的一种可行方法，而语言是部署它的可移植媒介。"}]}, {"name": "Research Agents \u0026 Evaluation", "count": 3, "papers": [{"title": "Benchmarking Hybrid Deep Research Across Database Querying and Web Search", "arxiv_id": "2609.09410", "authors": "Ruofan Wu, Peiran Xu, Xiaolong Li, Fan Shu, Soyoung Yoon, Yite Wang, Xiaodong Yu, Boyi Liu, Feng Yan, Debiao Li, Yuxiong He, Zhewei Yao", "summary": "While autonomous agents have made significant strides in \"deep research\" by iteratively navigating the open web to synthesize information, real-world problem-solving is rarely confined to a single environment. Complex analytical tasks inherently require agents to weave together evidence from both ambiguous unstructured text (e.g., the open web) and highly precise structured data (e.g., relational databases). However, existing benchmarks evaluate these modalities in isolation, failing to capture the critical \"handoff\" - the ability to preserve constraints when moving evidence between systems. We introduce HybridDeepResearch, to our knowledge the first deep-research benchmark that requires both web search and SQL to form a complete, verifiable answer. The benchmark contains 380 tool-dependent tasks grounded in LiveSQLBench-Base-Lite databases and public web corpora, validated through automated checks and human review, and covering three reasoning patterns: SQL2S, S2SQL, and Parallel. Evaluations across proprietary and open-weight models under various agentic scaffolds reveal that even state-of-the-art models like GLM-5.2, Claude-Sonnet-4.6 and GPT-5 achieve only about 50-54% Pass@8 on the hard subset. Notably, results show that directional reasoning is substantially more difficult than parallel intersection, highlighting that bridging structured and unstructured information spaces without losing constraints remains a major open challenge for agentic systems. Code and datasets are publicly available at GitHub (https://github.com/Snowflake-AI-Research/HybridDeepResearch) and Hugging Face (https://huggingface.co/datasets/Snowflake/HybridDeepResearch).", "category": "cs.CL", "cluster": "Research Agents \u0026 Evaluation", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是提出了一个名为 HybridDeepResearch 的新基准，用于评估 LLM 智能体在混合环境（开放网络搜索和关系型数据库 SQL 查询）中进行深度研究的能力。论文的研究对象明确是自主智能体和工具使用智能体，评估它们在不同信息源之间传递证据并保持约束不丢失的能力。\n\n根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents / Multi-Agent LLMs，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。” 该论文通过评估不同智能体框架下的最先进模型，揭示了智能体在桥接结构化与非结构化信息空间时面临的重大挑战，这属于典型的失败机制诊断和行为分析，直接有助于理解和改进智能体的工具使用与规划能力。同时，重要校准中也明确指出不应仅因为论文是 benchmark 或 evaluation 就排除。因此，该论文符合您的核心研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心问题是：当 autonomous agents 需要同时跨越结构化数据环境（如 relational databases）和非结构化信息环境（如 open web）进行证据整合时，它们在系统间传递证据的过程中会频繁丢失约束，导致跨模态协调失败。作者将这一关键失败模式命名为 \"handoff\"——即当证据必须在不同系统间转移、交叉验证和校验时，agent 往往无法保持先前步骤中确立的语义约束。这一问题之所以重要，是因为现实世界中的高风险分析任务——如金融审计、供应链风险评估和科学研究——本质上依赖于整合异构数据源，而非在单一环境中运作。然而，现有的评测体系将 web search 和 SQL querying 两种模态隔离评估，使得这一跨模态协调瓶颈从未被系统暴露和量化。为填补这一缺口，作者引入了 HybridDeepResearch，这是首个同时要求 web search 和 SQL 才能形成完整可验证答案的 deep-research benchmark，包含 380 个 tool-dependent tasks，覆盖三种 reasoning patterns：SQL2S（数据库结果约束后续 web 搜索）、S2SQL（web 搜索发现的实体或条件约束后续 SQL 查询）和 Parallel（两种工具独立产生候选集后取交集）。解决这一问题的价值在于：它为 agentic systems 提供了一个精确的诊断工具，揭示了即使是最先进的模型（如 GPT-5、Claude-Sonnet-4.6）在 directional handoff 任务上的 Pass@8 也仅约 50–54%，从而将 cross-tool consistency 确立为 deep-research agents 的关键未解挑战。\n\n### § 2 前人工作与不足\n\n该问题之前未被系统解决，根本原因在于评测领域本身的高度分割。Deep-research benchmarks 如 BrowseComp（Wei et al., 2025）、DeepResearcher（Zheng et al., 2025）和 WebWalker（Wu et al., 2025）专注于需要迭代 web search 和多步推理的复杂问题，但仅评估单一模态——open web 上的非结构化信息检索与综合，未将 database querying 纳入研究流程。Database-agent benchmarks 从早期的 Spider（Yu et al., 2018）、BIRD-SQL（Li et al., 2023）发展到 Spider 2.0（Lei et al., 2025）、BIRD-Interact（Huo et al., 2026）和 LiveSQLBench（Team, 2025），逐步扩展到 contextual queries、enterprise workflows 和 dynamic interactions，但始终假设所需证据已包含在预定义的数据库及固定辅助材料中，不考虑需要从 open web 发现额外证据的场景。Hybrid QA benchmarks 如 HybridQA（Chen et al., 2020b）、TAT-QA（Zhu et al., 2021）和 CompMix（Christmann et al., 2024）虽然结合了表格与文本证据，但假设相关 tables 和 passages 已预先收集完毕，不要求 agent 主动通过 open web search 发现证据，也不评估 executable SQL querying 与 web search 之间不同依赖结构下的协调能力。近期工作如 DataSTORM（Liu et al., 2026）虽结合了 internet research 与 large-scale database exploration，但聚焦于 thesis-driven 的分析报告生成，而非 answer-oriented 的精确评测。这些不足并非简单的疏忽，而是因为 text-to-SQL 和 web browsing 两个研究社区各自独立发展，导致跨模态 handoff 的失败模式——如 SQL2S 中的 \"salience trap\"（agent 通过 SQL 正确找到实体后发出泛化 web 搜索而误返回无关结果）、S2SQL 中的 \"dropping the anchor\"（agent 从文本中正确识别实体但未将其转化为 SQL predicate）以及 Parallel 中的 \"premature fusion\"（agent 仅基于单一来源返回候选而未做交集校验）——从未被清楚定义为可评测的能力维度。HybridDeepResearch 通过三种 reasoning patterns 和 \"hybrid lock\" 机制（对每个问题执行 single-tool ablation 以确保两种工具均为必需）精确填补了这一评测缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n在大型语言模型（LLM）展现出强大的单模态推理能力之后，研究者们很快注意到现实世界中的复杂分析任务往往需要跨越结构化数据（如 relational databases）和非结构化文本（如 open web）。现有的评估体系，无论是针对 text-to-SQL 的 Spider 和 BIRD，还是针对 web navigation 的 BrowseComp，都在各自的领域内孤立地衡量 agent 的能力。然而，当真正尝试让 agent 结合这两种模态时，一个明显的经验观察浮现出来：agent 在跨系统传递证据时极易丢失约束条件。例如，agent 可能通过 SQL 正确找到了某个实体，但在随后的 web search 中却偏离了该实体，或者从网络中提取了正确的条件却未能将其转化为 SQL 的 predicate。这种跨模态的“handoff”失败模式在先前的 benchmark 中完全不可见，因为它们没有强制要求工具间的依赖关系。\n\n早期的 hybrid QA 任务（如 HybridQA 和 Tat-QA）虽然尝试结合表格与文本，但它们通常假设所有相关证据已被预先收集并静态地提供给模型，这无法评估 agent 在动态环境中自主发现和协调证据的能力。为了填补这一空白，作者需要设计一种能够强制 agent 在 web search 和 SQL execution 之间传递和验证约束的评估框架。通过分析信息流的方向性，作者自然推导出了三种基本的跨模态依赖结构：SQL2S（数据库结果约束网络搜索）、S2SQL（网络搜索结果约束数据库查询）以及 Parallel（两者独立产出后取交集）。为了确保这些任务真正依赖于两种模态的协同，而非单模态的捷径，作者引入了“hybrid lock”机制，通过单工具消融实验剔除所有可被单一模态解决的问题。这一思考路径从对现实复杂需求的观察到对现有评估缺陷的反思，再到对跨模态信息流模式的抽象，最终导向了 HybridDeepResearch 的构建。\n\n### § 4 核心 Intuition\n\n先前方法在单模态任务上表现优异却在跨模态组合时崩溃，根本原因在于它们没有机制来强制 agent 在不同工具间保持和转换语义约束。这篇论文的核心 Intuition 是：通过设计具有严格信息流依赖（SQL2S, S2SQL, Parallel）的混合任务，并施加“hybrid lock”确保单工具绝对无法解题，可以精确诊断并暴露 agent 在跨模态“handoff”过程中丢失或扭曲约束的脆弱性。这种设计将隐藏在单模态高分背后的协调失败转化为可量化、可复现的评估指标，从而揭示了当前 agent 在跨结构化与非结构化信息空间整合时的根本瓶颈。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\nDB Values → [Dual-Grounded Anchoring: KG验证+SQL Agent] → Seed Entity\n                     │\n         ┌───────────┴───────────┐\n         ▼                       ▼\n [Search Track]           [SQL Track]\n Web Corpora→            Pattern Catalog(35)\n Evidence Graph          →Role-Aware Gen\n →Refine→Blurring        →SQL Q+Query\n →Question Gen                  │\n         │                       │\n         └──────────┬────────────┘\n                    ▼\n [Cross-Modal Composition] → [Hybrid Lock] → [Human Review]\n  方向组合 / 集合交集          单工具消融\n                    │\n                    ▼\n         Benchmark (380) + Hard (120)\n```\n\n**Dual-Grounded Entity Anchoring（§4.1）。** 输入为数据库 cell values。首先通过 Google Knowledge Graph 验证候选实体的全局显著性，排除无名实体；但全局显著不等于局部一致（如 \"Monaco\" 可指国家、城市或赛事），因此再部署一个 SQL-capable exploration agent 在具体 schema 上下文中检查该实体的使用方式，生成 database-grounded description 以锁定其精确现实含义。输出为 Seed Entity，作为两条 track 的共享锚点。\n\n**Search Track（§4.2, Figure 4）。** 输入为 Seed Entity 与公开 Web Corpora（Wikidata triples、Wikipedia、FineWeb-10BT）。分四阶段执行：（1）Evidence Graph Construction——将多源证据组织为多跳收敛图（如 $c_1 \\to a \\leftarrow c_2$）；（2）Evidence Refinement——剪枝弱连接、歧义关系和过时边，确保每条边表达具体可验证的关系；（3）Controlled Clue Blurring——将线索中的实体名抽象为非识别性描述属性（如将 \"2012\" 泛化为 \"the 2010s\"），并对关系进行 paraphrase，防止单线索捷径；（4）Question Generation——LLM 使用 inverted-question template 将模糊化后的图改写为自然语言问题，并根据目标 hybrid pattern 调整措辞（如 SQL2S 中 seed 作为已知前提，S2SQL 中 seed 作为未知目标）。输出为 Search Question。\n\n**SQL Track（§4.2, Figure 5）。** 输入为 Seed Entity 与 SQL Pattern Catalog。该 catalog 从 BIRD-SQL 和 LiveSQLBench 的人工查询中提炼出 35 种高级 SQL pattern（如 CTE aggregation + join），分 6 类 3 个难度级别，经人工验证。Role-Aware Generation 根据 seed 在 schema 中的角色应用兼容 pattern：S2SQL 中 seed 生成为 WHERE 谓词，SQL2S 中查询返回包含 seed 的单行结果，Parallel 中返回包含 seed 的多行候选集。输出为 SQL Question + 可执行 Query 对。\n\n**Cross-Modal Composition（§4.3, Figure 6）。** 输入为独立过滤后的 Search Q 与 SQL Q+Query。对 S2SQL 和 SQL2S 采用 directional composition——一个模态的精确输出成为另一模态的 rigid constraint；对 Parallel 采用 set intersection——将多答案 search 组件与多行 SQL 组件配对，仅保留交集唯一标识共享实体的配对。输出为完整 hybrid task。\n\n**Hybrid Lock（§4.3）。** 输入为组合后的 hybrid task。执行 single-tool ablation：evaluator agent 分别尝试仅用 web search 和仅用 SQL 解决该题。若任一单模态可解（通过 parametric guessing、query leakage 或过宽搜索命中），则立即丢弃该题。这一步是防止 accidental single-source leakage 的核心质量控制。输出为严格 tool-dependent 的 hybrid task。\n\n**Human Review（§4.3, Appendix C）。** 输入为通过 Hybrid Lock 的任务。四位博士研究员（论文作者）检查问题清晰度、gold answer 的正确性与唯一性、search 与 SQL 组件的互一致性、共享实体是否在目标 pattern 中扮演预期角色，以及是否存在未预期的答案泄漏。同时完成 balanced hard subset 的选取（每种 pattern 40 题）。输出为最终 benchmark：380 题完整集 + 120 题 balanced hard subset。\n\n### § 6 核心数学推导\n\n本文为 benchmark 论文，不含形式化数学推导。其核心设计逻辑基于约束传递与集合运算（directional composition 对应约束传递，set intersection 对应集合交），但未给出数学定理或证明，此处跳过。\n\n### § 7 实验设计与结论\n\n论文围绕三个递进的研究问题设计实验，全部在 **HybridDeepResearch** benchmark 上评测，每题独立运行 8 次，报告 Pass@8（至少一次成功）和 Avg@8（平均成功率）。\n\n**RQ1：Agent scaffold 和 retrieval backend 如何影响性能？** 以 Qwen3.5-397B-A17B-FP8 为共享 backbone，在完整 380 题上交叉比较 smolagents（单 agent）与 MiroFlow（多 agent）两种 scaffold，以及 Real Web 与 Corpus Search 两种检索后端。结果显示 MiroFlow 将 Pass@8 从 58.95 提升至 66.32（Real Web），但 Avg@8 几乎不变，表明多 agent scaffold 提高了\"至少解出一次\"的概率，却未提升跨重复试验的可靠性——其代价是更多的 LLM/tool 调用和高达 41.3% 的 timeout 率。Corpus Search 与 Real Web 表现接近，证明固定语料后端在受控评测中可行。\n\n**RQ2：Open-weight 模型在三种 hybrid reasoning pattern 上表现如何？** 在完整集上评测 Qwen3.5 系列（4B 至 397B）和 GLM-5.2-FP4，分别置于两种 scaffold 下使用 Corpus Search。核心发现有三：（1）GLM-5.2-FP4 是最强 open-weight 模型，在 MiroFlow 下达到 75.79 Pass@8 和 49.24 Avg@8；（2）directional pattern（S2SQL 和 SQL2S）远难于 Parallel——例如 GLM-5.2 在 MiroFlow 下 S2SQL Pass@8 仅 62.07，而 Parallel 达 93.28；（3）Pass@8 与 Avg@8 之间的巨大差距表明许多问题仅偶尔被解出，解决方案不可靠。\n\n**RQ3：Proprietary 模型与强 open-weight baseline 在 hard subset 上如何对比？** 在 120 题 balanced hard subset 上，使用 smolagents + Corpus Search 比较 GPT-5、Claude-Sonnet-4.6、GLM-5.2-FP4 和 Qwen3.5-397B。GPT-5 取得最高整体 Pass@8（54.17），Claude-Sonnet-4.6 取得最高 Avg@8（28.12），但无模型在所有 pattern 上占优——GLM-5.2 在 Parallel 上并列最高 Pass@8 并取得最高 Parallel Avg@8。即便最强系统也仅解出约一半 hard subset 题目。Directional pattern 仍是主要瓶颈：GPT-5 在 S2SQL 上最优（45.00），Claude 在 SQL2S 上最优（47.50），但两者均远低于各自的 Parallel 分数。\n\n综合三个 RQ，论文的核心结论是：**跨工具约束一致性是 deep research agent 的关键未解挑战**——agent 在结构化与非结构化模态间传递证据时频繁丢失约束，directional handoff 比 parallel intersection 困难得多，多 agent scaffold 能提高覆盖面但以可靠性和效率为代价。", "additional_insights": "### § 8 Take-aways\n\nHybridDeepResearch 是首个同时要求 web search 与 SQL query 才能完成可验证答案的 deep-research benchmark，填补了此前 text-to-SQL 与 web browsing 评估各自孤立、无法测量跨模态 \"handoff\" 能力的空白。benchmark 包含 380 个 tool-dependent 任务，覆盖三种推理模式：SQL2S（数据库结果约束后续 web 搜索）、S2SQL（web 搜索发现的实体转化为 SQL predicate）、Parallel（两模态独立产出候选集后取交集），并从中精选 120 题的 balanced hard subset。实验揭示即使 GPT-5、Claude-Sonnet-4.6 等前沿模型在 hard subset 上也仅达 50–54% Pass@8，整体 Avg@8 低于 30%，且方向性推理（SQL2S 与 S2SQL）的难度显著高于 Parallel 交集，表明跨模态约束保持是当前 agentic system 的核心瓶颈。多智能体框架 MiroFlow 相比单智能体 smolagents 能提升 Pass@8（因额外 worker 可恢复早期遗漏的约束），但 Avg@8 基本不变，且 timeout 率从 16.7% 飙升至 41.3%，说明更广的探索并未带来可靠性的实质改善。GLM-5.2 在 open-weight 模型中表现最强，在 MiroFlow 下达到 75.79 Pass@8，但 S2SQL 仍仅 62.07，与 Parallel 的 93.28 形成鲜明对比。论文识别出三类典型失败模式：Parallel 中的 incomplete intersection（仅返回单一来源支持的候选）、SQL2S 中的 search drift（正确 SQL 结果在后续搜索中约束丢失）、S2SQL 中的 entity-level handoff 成功但 SQL 操作或公式错误。\n\n### § 9 最脆弱的假设\n\n整个 benchmark 的核心价值建立在 \"Hybrid Lock\" 假设上：每个问题确实需要同时使用 web search 和 SQL 才能解决，无法通过单一模态绕过。论文通过 single-tool ablation 来验证这一点——让一个 evaluator agent 分别尝试仅用 web search 或仅用 SQL 解决每个问题，能被单模态解决的即被丢弃。然而这个假设的脆弱性在于：ablation 的有效性完全依赖于执行 ablation 的 agent 的能力上限。论文使用的 evaluator agent 的推理能力、参数记忆和搜索策略是有限的，更强的模型可能通过 parametric memory 直接回答 search 子问题（尤其是当答案实体如 \"Monaco\" 或 \"Bhutan\" 在预训练语料中高度 salient 时），或通过更精细的 SQL 探索在数据库中偶然发现答案。论文在 Section 4.3 中也承认 hybrid lock 是 \"under the evaluated settings\" 成立的，暗示其并非绝对保证。论文缺少的关键证据是：对 hybrid lock 的鲁棒性测试——例如用多个不同能力层级的模型执行 ablation，或测量 gold answer 在预训练语料中的 salience 分布，以量化 parametric leakage 的风险。如果未来更强的模型能通过单一模态解决相当比例的 \"hybrid\" 问题，那么这个 benchmark 测量的就不再是跨模态协调能力，而退化为普通的 text-to-SQL 或 web QA 任务，三种推理模式的性能差异也将失去诊断意义。\n\n### § 10 最小复现实验\n\n在一周时间内，最可行的最小复现是验证论文最核心的 empirical claim：方向性推理（SQL2S 和 S2SQL）显著难于 Parallel 交集。使用论文公开的 balanced hard subset（120 题，每类型 40 题），选取一个中等规模开源模型如 Qwen3.5-27B，在 smolagents 框架下搭配 Corpus Search 后端运行，每题执行 8 次独立 trial。测量三种类型各自的 Pass@8 和 Avg@8。如果 SQL2S 和 S2SQL 的 Pass@8 明显低于 Parallel（论文中 Qwen3.5-397B 在 hard subset 上的差距为 SQL2S 15% vs Parallel 57.5%），则支持方向性 handoff 更难的 claim；如果三者性能接近或 Parallel 反而更难，则反驳该 claim。这个方案无需复现整个 construction pipeline，只需使用已发布的 benchmark 数据和开源框架，计算资源需求可控（27B 模型单卡可运行），且能直接检验论文最关键的发现——跨模态约束传递是 agentic system 的主要瓶颈。", "research_value": "### § 11 最强反例设计\n\n对这篇论文最有力的攻击应针对其核心 empirical claim——即方向性推理（SQL2S 和 S2SQL）的失败主要源于 agent 的跨模态约束保持能力不足。我设计了一个基于 Tool Affordance Bias 的替代解释实验：论证方向性 handoff 的性能崩塌并非源于 agent 的认知或协调缺陷，而是由 SQL（精确符号系统）与 Web Search（模糊检索系统）之间固有的信息粒度不对称所导致的必然信息损失。具体实验设计为：招募人类领域专家与 SOTA agent 在相同的 HybridDeepResearch hard subset 上进行对照测试，并引入一个 \"Granularity-Matched Oracle\" 条件——在该条件下，web search 的返回结果被预处理为结构化的事实卡片（消除文本歧义），SQL 的返回结果被转化为自然语言摘要（消除符号刚性）。如果人类专家在原始任务上的 S2SQL 失败率也显著高于 Parallel，且在 Granularity-Matched Oracle 条件下人类与机器的性能差距急剧缩小，那么论文所声称的 \"cross-tool consistency 是未解挑战\" 这一结论将被大幅削弱。这将证明方向性推理的困难主要在于异构工具接口的表征摩擦，而非 agent 内部的约束传递机制存在根本性缺陷，从而将研究焦点从 agentic reasoning 转向 tool interface standardization。\n\n### § 12 Follow-up Research Idea\n\n当前方法的核心局限在于将跨模态 handoff 视为一个黑盒式的端到端过程，仅在最终答案层面衡量约束是否丢失，而未深入探究 agent 内部表征在工具切换瞬间究竟发生了何种语义形变。这一局限驱动了一个全新的研究方向：Cross-Modal Representation Probing，即通过 mechanistic interpretability 技术对 agent 在 handoff 节点的 latent space 动态进行因果干预与诊断。该提议借鉴了 mechanistic interpretability 领域的 activation patching 与 sparse autoencoders (SAEs) 技术，将目标从 \"提升端到端任务准确率\" 转移到 \"定位并修复导致约束丢失的内部电路\"。\n\n具体而言，不再依赖 multi-agent 框架或 prompt engineering 来外挂补救措施，而是直接探测 LLM 在执行 S2SQL 任务时的内部状态：当 agent 从 web snippet 中识别出关键实体后，使用 SAEs 提取该实体在 residual stream 中的 feature representation；随后在 agent 生成 SQL predicate 的步骤中，监测该 feature 的 activation 强度。如果观察到 activation 在 SQL generation 阶段发生 decay（即 \"dropping the anchor\" 失败模式的内部表征），则可以通过 activation patching 强行将上一阶段的 feature representation 注入当前生成步骤，测试是否能因果性地挽救约束。第一个实验将选取一个开源 SOTA 模型（如 Llama-4-70B），在 HybridDeepResearch 的 S2SQL 子集上训练针对 \"entity constraint\" 的 SAE probe，对比成功与失败 handoff 的 probe activation 轨迹，并验证人工干预 activation 是否能将失败案例的 Pass@1 提升 20% 以上。这与现有的 agentic benchmark 工作完全不同：它不评估 agent 的外在行为，而是打开黑盒，将跨模态协调问题转化为一个可定位、可干预的神经计算问题，为解决 handoff 失败提供了一条绕过脆弱 prompt 策略的底层路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "{\n  \"authors\": [\n    {\"name\": \"Ruofan Wu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Peiran Xu\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Xiaolong Li\", \"affiliations\": [3], \"markers\": [\"*\"]},\n    {\"name\": \"Fan Shu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Soyoung Yoon\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Yite Wang\", \"affiliations\": [5], \"markers\": [\"†\"]},\n    {\"name\": \"Xiaodong Yu\", \"affiliations\": [5], \"markers\": [\"†\"]},\n    {\"name\": \"Boyi Liu\", \"affiliations\": [5], \"markers\": []},\n    {\"name\": \"Feng Yan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Debiao Li\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yuxiong He\", \"affiliations\": [5], \"markers\": []},\n    {\"name\": \"Zhewei Yao\", \"affiliations\": [5], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"University of Houston\"},\n    {\"id\": 2, \"name\": \"UCLA\"},\n    {\"id\": 3, \"name\": \"HKU\"},\n    {\"id\": 4, \"name\": \"SNU\"},\n    {\"id\": 5, \"name\": \"Snowflake AI Research\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution.\"},\n    {\"marker\": \"†\", \"text\": \"Project lead.\"}\n  ]\n}", "summary_translation": "尽管 autonomous agents 通过迭代浏览开放网络来综合信息，在“deep research”方面取得了重大进展，但现实世界中的问题解决很少局限于单一环境。复杂的分析任务本质上要求 agents 将来自模糊的非结构化文本（例如，开放网络）和高度精确的结构化数据（例如，relational databases）的证据整合在一起。然而，现有的 benchmarks 孤立地评估这些模态，未能捕捉到关键的“handoff”——即在系统之间转移证据时保留约束的能力。我们引入了 HybridDeepResearch，据我们所知，这是第一个需要同时使用 web search 和 SQL 才能形成完整、可验证答案的 deep-research benchmark。该 benchmark 包含 380 个 tool-dependent tasks，这些任务基于 LiveSQLBench-Base-Lite databases 和 public web corpora，通过 automated checks 和 human review 进行验证，并涵盖三种 reasoning patterns：SQL2S、S2SQL 和 Parallel。在各种 agentic scaffolds 下对 proprietary 和 open-weight models 的评估表明，即使是 GLM-5.2、Claude-Sonnet-4.6 和 GPT-5 等 state-of-the-art models，在 hard subset 上也仅达到约 50-54% 的 Pass@8。值得注意的是，结果表明 directional reasoning 比 parallel intersection 困难得多，这突显了在不丢失约束的情况下桥接结构化和非结构化信息空间仍然是 agentic systems 面临的一项重大开放挑战。Code 和 datasets 已在 GitHub (https://github.com/Snowflake-AI-Research/HybridDeepResearch) 和 Hugging Face (https://huggingface.co/datasets/Snowflake/HybridDeepResearch) 上公开。"}, {"title": "RAP: Research Attention Prediction Reveals Target-Conditioned Evidence Acquisition Biases", "arxiv_id": "2609.10092", "authors": "Yingqian Wu, Jingcong Liang, Siyuan Wang, Zhenfei Yin, Philip Torr, Junchi Yu, Zhongyu Wei", "summary": "Large language models (LLMs) increasingly act as research agents, yet their ability to track shifts in research attention is difficult to evaluate because reviews and research ideas lack uniquely verifiable outcomes. We introduce Research Attention Prediction (RAP), a rolling benchmark covering 278 AI/ML fields and 1,390 episodes. At each cut-off, an LLM agent searches a temporally restricted arXiv corpus and predicts the next six months' paper shares across eight frozen research directions. Search generally helps, but all four diagnostic models perform worse than an exact-count exponentially weighted moving average (EWMA) baseline in compositional accuracy. We identify two linked bottlenecks. Under cumulative-history access, State carry-forward outperforms direct Forecast for all four diagnostic models; frozen-evidence replay links a shared component of this reversal to Forecast-oriented policies retrieving a smaller share of recent evidence. Even with exact historical activity, future-specific updating remains limited, with only GPT-5.5 plus reopened Search slightly surpassing EWMA. Fine-tuning on realised outcomes improves Qwen3-4B's forecast Spearman correlation by 0.105 on held-out fields at later origins, with gains also on change-rich episodes.", "category": "cs.CL", "cluster": "Research Agents \u0026 Evaluation", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-36 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一个名为 RAP (Research Attention Prediction) 的评估基准，用于评估 LLM 作为研究智能体在搜索受限语料库并预测未来研究趋势方面的能力。论文不仅构建了评估环境，还深入诊断了智能体在获取证据和更新状态时的行为瓶颈（如 State carry-forward 与 direct Forecast 的差异），并验证了通过在已实现结果上进行微调可以提升智能体的预测能力。这完全符合筛选标准第一步中“如果论文的研究对象明确是 LLM Agents / Tool-Use Agents，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留”的规定。同时，根据重要校准，不应仅因为论文是 benchmark 或 behavior analysis 就排除。因此，该论文与理解、评估和改进 LLM 智能体能力的研究目标强相关。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心问题是：**LLM agents 能否基于过去的科学记录，预测未来一段时间内研究注意力在各研究方向上的分布？** 具体而言，给定一个研究领域和截止时间 $T$，agent 需要在仅能检索 $T$ 之前文献的条件下，预测未来六个月内该领域各方向上 arXiv 论文的份额分布（一个八维 simplex 向量）。这一问题的重要性源于 LLMs 正从 chatbots 向 research assistants 演进，而有效的科研助手不仅需要回顾性总结已有文献，还需前瞻性地追踪研究注意力的演变——识别新兴主题、优先支持科学探索、辅助研究规划均依赖于对当前研究格局的理解和对未来研究投入方向的预判。然而，现有评测体系在这一能力维度上存在结构性缺口：retrospective tasks 只验证已发表工作的综合质量，无法证明模型推断的领域状态在特定时间点是定量准确的；prospective benchmarks 则聚焦于单篇论文的影响力、特定科学事件或概念链接预测，而非在固定方向体系上反复进行的、联合归一化的活动分布预测。RAP 通过将\"预测未来研究注意力分布\"转化为一个 rolling、outcome-grounded 的分布预测问题，填补了这一评测空白，同时为诊断 agents 在 evidence acquisition、state recovery 和 future-specific updating 三个环节的能力边界提供了可分解的实验框架。\n\n### § 2 前人工作与不足\n\n该问题此前未被直接解决。最相关的 prior work 可分为三类。第一类是 **retrospective literature synthesis** 系统，包括 retrieval-grounded 综述生成（Asai et al. 2026; Skarlinski et al. 2024）和自动化 survey 写作（Wang et al. 2024b; Yan et al. 2025; Bao et al. 2025）。这些系统能从数百篇论文中生成流畅的综合报告，但评测聚焦于最终文本产物的质量，而非模型对领域状态推断的定量准确性——一个流畅的 survey 并不证明其内部推断的各方向活跃度在特定 cut-off 是准确的。第二类是 **outcome-grounded scientific forecasting** benchmarks。Science4Cast (Krenn et al. 2023) 预测科学知识图谱中概念间的未来链接，输出的是单个 link score/rank 而非领域级的联合分布；PreScience (Ajith et al. 2026) 预测未来论文的组件和影响力，输出为 mixed structured outputs；CUSP (Wu et al. 2026) 预测科学事件的可行性与时间，输出为 mixed event outputs；What's Next? (Ofer et al. 2024) 虽预测 topic-level 的未来发表份额，但采用 annual step-forward 且每个 topic 独立输出标量，缺乏方向间的联合归一化约束。这些 benchmarks 共同的不足在于：它们要么关注个体层面的预测（单篇论文、单个事件、单条链接），要么缺乏在固定 within-field direction slate 上进行 rolling forecast 的设计，因此无法评测 agent 在\"同一领域、同一方向体系、多个时间点\"上反复进行联合分布预测的能力。第三类是 **research agent** 系统（Lu et al. 2024; Baek et al. 2025; Li et al. 2025），它们支持从文献检索到 idea 生成的完整 workflow，但评测仍以最终产物为中心，未将 evidence acquisition 过程与 terminal readout 分离进行受控诊断。RAP 的关键创新正在于此：通过 matched State intervention、frozen-evidence replay 和 exact-history ablation，它将端到端预测分解为 acquisition、state recovery 和 future updating 三个可独立诊断的环节，从而揭示了此前评测无法发现的一个核心 failure mode——Forecast 目标本身会改变 agent 的 evidence acquisition 行为，使其偏离对预测更有用的近期文献。", "core_insight": "### § 3 重建作者的思考路径\n\nLLM 正在从 chatbot 演变为 research agent，能够检索数百篇论文并生成领域综述。但一个流畅的 survey 并不证明模型在特定时间点对领域状态的推断是定量准确的——回顾性任务只验证了综合能力，不验证时间锚定的状态估计。与此同时，前瞻性科学预测基准（如 Science4Cast、PreScience）大多聚焦于个体论文、概念链接或实验结果的预测，缺乏对同一领域内固定方向集合上联合归一化活动分布的反复预测评估。作者由此识别出一个空白：没有人系统测试过 LLM agent 能否在给定过去科学记录的条件下，滚动预测未来研究注意力的分布。\n\n从科学学的角度，研究活动的分配并非随机——Fortunato 等人的工作表明科学注意力具有可预测的结构性规律。如果将 arXiv 提交按领域特定的稳定方向 codebook 归类，每个时间窗口的论文份额构成一个 compositional share vector，那么预测下一窗口的分布就是一个有明确 ground truth 的 distribution forecasting 问题。关键设计约束随之浮现：方向 codebook 必须在所有 rolling origin 上冻结，使分布跨时间可比；证据访问必须按 cut-off 严格限制，避免未来泄漏；评估必须区分\"恢复当前活动水平\"和\"超越 persistence 的未来特定更新\"——因为一个简单的 EWMA baseline 就能利用近期计数获得很强的 persistence 基线，任何声称的预测能力必须在这个基线之上才有意义。\n\n作者进一步思考：如果 agent 在这个任务上表现不佳，瓶颈究竟在哪里？在 agentic 文献工作流中，证据不是固定输入——请求的目标本身会改变 agent 发出什么查询、检索什么论文、何时停止搜索。这意味着一个前瞻性 Forecast 目标可能在证据获取阶段就引入偏差，而非仅在最终 readout 阶段。为了分离这一效应，需要一个匹配的 State intervention：让同一个 agent 用同样的搜索界面估计过去六个月的分布，然后将其 carry-forward 作为 agent-specific persistence baseline。如果 State carry-forward 优于直接 Forecast，且 frozen-evidence replay 显示 State-oriented 轨迹在共同 Forecast readout 下也更好，那么问题就不在 readout 而在 acquisition——目标条件化改变了搜索行为本身。这条推理链从\"评估能力\"自然延伸到\"诊断失败机制\"，构成了 RAP 的 capability decomposition 设计。\n\n### § 4 核心 Intuition\n\n当 LLM agent 被要求预测未来研究注意力的分布时，这个前瞻性目标本身会扭曲它在搜索阶段获取证据的方式：Forecast-oriented policy 会将检索注意力从最近六个月的文献上移开，即使这些近期证据对未来预测最为关键。结果是，让 agent \"向前看\" 反而损害了它对当前状态的恢复能力——用同一个 agent 做匹配的 State 估计并 carry-forward，反而比直接 Forecast 更准确。这个 target-conditioned evidence acquisition bias 是结构性的：即使向 agent 提供精确的历史活动计数，超越 persistence 的校准未来更新仍然有限，说明瓶颈不仅在于证据获取，还在于 agent 无法将检索到的证据转化为对持久性基线的可靠偏离。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n┌──────────── RAP: Construction → Evaluation → Diagnosis ───────────┐\n│ arXiv 356K papers                                                │\n│   │ Extract→Normalize→Expand→Merge: 278 field corpora           │\n│   │ Codebook (GPT-5.5+Opus, pre-2024): 8 frozen directions      │\n│   ▼ Date-blind Assignment → Rolling Targets (5 origins)         │\n│                                                                  │\n│ Agent Input: (field f, cutoff T, codebook Df)                   │\n│   ├─► A0 Closed ──────────────────────┐                         │\n│   ├─► A1 Fixed [T-6mo,T) ► Search ────┤ Forecast pf,T           │\n│   ├─► A3 Expanding [\u003CT) ──► Search ───┤ (8-way simplex)         │\n│   ├─► A2 Fixed State ───► Search ─────┤                         │\n│   └─► A4 Expanding State ► Search ────┘ → State-as-Forecast     │\n│         │                                                        │\n│         ▼ Scoring: Spearman ρ(pf,T, yf,T) vs EWMA              │\n│                                                                  │\n│ Diagnostics: ① State−Forecast gap  ② Frozen-evidence Replay    │\n│  ③ Search Counterfactual (86K calls) ④ Exact-history oracle    │\n│  ⑤ Outcome-aligned SFT (Qwen3-4B)                              │\n└──────────────────────────────────────────────────────────────────┘\n```\n\n**Benchmark Construction（§3.1）** 以 356,357 篇 arXiv 论文（cs.CL/cs.LG/cs.AI/cs.CV，2022-06 至 2026-06）为输入，经 distilled Qwen3.5-4B extractor 提取 open-ended field label，通过 embedding 双视角匹配扩展 membership，保留 pre-2026-01-01 达 300 篇以上的 281 个 field，其中 278 个成功生成 codebook。Codebook 由 GPT-5.5 与 Claude Opus 4.6 独立起草候选方向后合并为恰好 8 个 operational direction，仅使用 pre-2024 evidence 构建并跨所有 origin 冻结。Date-blind classifier 基于论文 title+abstract 与 codebook 为每篇 paper-field membership 分配 primary label 或 other，同一规则在所有 origin 上不变。对每个 forecast origin T 和方向 d，统计 [T, T+6mo) 窗口内 primary label 为 d 的论文数 $n_{f,T,d}$，归一化为 8 维 simplex 上的 realised target share $y_{f,T}$。5 个 semi-annual origin（2024-01 至 2026-01）× 278 fields 产生 1,390 episodes，按 dependency block 划分为 Dev（67 fields）和 Test（211 fields）。\n\n**Evaluation Protocol（§3.2）** 在推理阶段，agent 接收 field $f$、cutoff $T$ 和 8 个 direction 的书面定义，但不接收任何已检索论文。Agent 可自适应查询时间受限的 field-specific BM25 corpus（每次返回至多 8 篇论文的 hit count、title 和 abstract），最终输出 8 个非负百分比权重（和为 100）。三种 evidence-access regime 仅改变可检索的时间范围：**A0 Closed** 禁用 Search；**A1 Fixed-window** 暴露 [T−6mo, T) 内论文；**A3 Expanding-history** 暴露 T 之前全部论文。两个 State twin 条件 **A2** 和 **A4** 使用与 A1/A3 相同的检索范围，但目标改为估计 [T−6mo, T) 的已实现分布，其输出直接 carry-forward 作为 agent-specific persistence baseline（State-as-Forecast）。Primary score 为 episode-level Spearman rank agreement $\\rho(p_{f,T}, y_{f,T})$，先在 field 内对 5 个 origin 取均值再跨 field 聚合。统计参考包括 Recent persistence、EWMA（固定权重 0.50/0.25/0.25）、Dev-tuned ARIMA(1,1,0)、Holt 和 ridge VAR，均使用 exact pre-T direction counts 计算。\n\n**Diagnostic Interventions（§5）** 在评测之外执行五项诊断。**① State-Forecast gap**：在 Expanding-history 下比较 A4 carry-forward 与 A3 direct Forecast 的 Spearman 差值，定位 reversal 是否仅出现在 cumulative-history 场景。**② Frozen-evidence replay**：将每个 Expanding-history trajectory 的有序 query 和 observation 序列化，在 byte-identical evidence 上独立生成 Forecast 和 State readout，截断至 episode-specific shared call count 后分解 acquisition 贡献（S→F − F→F）与 readout 贡献（S→S − S→F）。**③ Search counterfactual**：确定性重执行 86,284 个 recorded Search call，在 common recent-window relevance option 下比较 State query 与 Forecast query 的 evidence-future alignment，并将该 option 应用于 Forecast 自身 query 以估计 temporal-scope allocation 的因果效应。**④ Exact-history oracle**：向模型提供精确的 pre-T direction distribution（Exact recent 或 Exact three-window history），可选地 reopen Search，评测模型能否在 bypass acquisition 后实现 beyond-persistence updating。**⑤ Outcome-aligned SFT**：以 GPT-OSS-120B 在 45 个 training field（T=2024-07）上的 90 条 trajectory 为源，替换 terminal prediction 为 realised RAP distribution，对 Qwen3-4B 进行 full-parameter SFT，在 211 个 dependency-disjoint Test field 的 later origin（2025-07, 2026-01）上评测 fresh native rollout。\n\n### § 6 核心数学推导\n\n论文的数学内容主要是评测指标的定义，而非定理证明，但其中三个构造具有非平凡的统计直觉。\n\n**Realised target share** 定义为 $y_{f,T,d} = n_{f,T,d} / \\sum_{d'} n_{f,T,d'}$，将每个方向在目标窗口内的论文计数归一化为 8 维 simplex 上的 compositional vector。这一归一化的关键在于排除 label 为 other 的论文，使 8 个方向共享一个固定的分母——这意味着预测的不仅是各方向的绝对活跃度，而是方向之间的相对分配。Snyder et al. (2017) 的 compositional time series 框架为这一选择提供了理论依据：当目标是 share 而非 level 时，分析应限制在 simplex 上。\n\n**Permutation-corrected residual alignment** 是论文最精巧的统计构造。直觉上，想衡量预测 $p$ 是否捕捉了未来 $y$ 偏离 persistence $e$（EWMA）的方向，自然会计算 $\\Delta_p = p - e$ 与 $\\Delta_y = y - e$ 的相关性。但直接这样做会产生 mechanical alignment：从 $p$ 和 $y$ 中减去同一个 $e$ 会引入虚假的正相关。论文的校正方法是枚举所有 8! 个 label permutation $\\pi$，计算每个 permutation 下的 alignment 统计量，然后从原始统计量中减去 permutation median。这等价于在 null hypothesis \"$\\Delta_p$ 的方向标签与 $\\Delta_y$ 无关联\" 下进行 exact test。此外，论文还定义了 partial-residual endpoint，使用 residual maker matrix $R_X = I - XX^+$（其中 $X = [\\mathbf{1}, q(e_{f,T})]$，$q(\\cdot)$ 返回 average rank），先将 $p$ 和 $y$ 对 EWMA 的 rank 做 partial out，再计算 residual cosine。这一步的 intuition 是：如果预测仅仅复制了 EWMA 的排序，partial residual 应为零；只有当预测包含 EWMA 之外的信息时，residual 才会非零。\n\n**Reliability ceiling** 使用 Spearman-Brown correction：将目标窗口内的论文随机分半，计算两半 induced direction rank 的相关性，再校正回全样本大小。直觉是：如果有限样本的 split-half reliability 为 $r$，则全样本可靠性约为 $2r/(1+r)$。论文得到的 full-window reliability 为 0.820，其平方根 0.910 近似 observable-score ceiling——即任何预测方法在有限样本下的 Spearman 上限。与此对比，6/12/18-month revision target 的 reliability 仅为 0.149/0.298/0.405，说明变化量本身噪声远大于水平量，这为将 level composition 设为 primary estimand、revision alignment 设为 secondary 提供了统计依据。\n\n### § 7 实验设计与结论\n\n**问题 1：LLM agents 能否基于历史文献预测未来研究注意力的分布？** 论文构建 RAP benchmark（278 fields × 5 origins = 1,390 episodes），在 Closed/Fixed-window/Expanding-history 三种 evidence access regime 下评测 7 个 LLM agents（从 Qwen3-4B 到 GPT-5.5），并与 Recent persistence、EWMA、ARIMA 等 exact-count statistical baseline 对比。**答案**：所有 agent 在所有自然 evidence 条件下均不如 EWMA（Test 上 0.803）。Fixed-window 检索对 7 个模型中的 6 个优于 Closed，但 Expanding-history 对全部 7 个模型均低于 Fixed-window——更多历史文献不仅没有帮助，反而有害。这一结论在 Forecast-Strict（仅使用完全在 model knowledge cutoff 之后的 target window）条件下依然成立。\n\n**问题 2：Cumulative-history 失败是 evidence acquisition 阶段的问题还是 terminal readout 阶段的问题？** 论文设计了 State-Forecast matched comparison：在相同 field、cutoff、codebook、检索后端和 call limit 下，仅改变请求目标（Forecast 未来 vs State 估计近期），然后通过 frozen-evidence replay 在 byte-identical evidence 上 swap readout objective，将 end-to-end gap 分解为 acquisition 贡献和 readout 贡献。**答案**：在 Expanding-history 下，State-as-Forecast 对全部 4 个 diagnostic model 均优于 direct Forecast（Spearman 差 +0.035 到 +0.082）。Frozen-evidence replay 表明 acquisition 是 shared component：State-oriented trajectory 检索的 evidence 在 common Forecast readout 下产生更好预测，而仅改变 readout 的效应在 GPT-5.5 和 GPT-OSS-120B 上很小。Search trace 分析揭示 Forecast-oriented policy 仅将 47–80% 的检索 slot 分配给 recent six-month 窗口，而 State query 为 100%；counterfactual 实验表明，将 recent-window relevance option 应用于 Forecast 自身 query 可将 evidence-future alignment 提升 +0.086 至 +0.124。因此，\"looking ahead\" 改变了 agent \"looks at\" 的内容——Forecast 目标将 Search 从 recent evidence 上移开，即使 recent evidence 对未来预测更有用。\n\n**问题 3：提供 exact historical state 能否使 agent 实现 beyond-persistence updating？** 论文设计 oracle-history ablation：向模型提供精确的 pre-T direction distribution（Exact recent 或 Exact three-window history），可选地 reopen Expanding Search，评测模型能否在 bypass acquisition 和 aggregation 后超越 EWMA 并追踪 6-month revision。**答案**：Exact history 关闭了大部分 level gap，但仅 GPT-5.5 + reopened Search 略微超过 EWMA（+0.012 Spearman），其余模型无统计显著的 complete Forecast 优势。所有模型的 corrected residual Spearman 为正（+0.117 到 +0.163），表明存在 partial alignment with departure direction，但 rolling revision alignment 均为负值（约 −0.30），说明 no model 可靠地将 residual signal 转化为 positive six-month revision tracking。这暴露了两个非同一的 capability boundary：recovering time-local state 是主要瓶颈，而 calibrated future-specific updating 即使在 oracle input 下仍未解决。\n\n**问题 4：RAP outcomes 是否提供可学习的 within-task signal？** 论文在 Qwen3-4B 上进行 full-parameter, full-trajectory SFT：使用 GPT-OSS-120B 在 45 个 training field（T=2024-07）上的 90 条 trajectory，将 terminal prediction 替换为 realised RAP distribution，在 22-field validation gate 通过后于 211 个 dependency-disjoint Test field 的 later origin 评测 844 条 fresh native rollout。**答案**：Pooled Forecast Spearman 提升 +0.105（Fixed +0.072，Expanding +0.138），change-rich subset 提升 +0.159，所有 844 条输出均 valid。但 Pred-Recent 和 Search use 显著增加，而 partial-residual gain 和 six-month revision-alignment gain 均未解决。这表明 outcome supervision 改善了 end-to-end policy（更多 recent-state anchoring 和 Search 使用），但未在 mechanism level 修复 temporal updating 或 evidence acquisition failure——SFT 学到的是\"更像 persistence\"而非\"更好地预测变化\"。", "additional_insights": "### § 8 Take-aways\n\n论文提出了 RAP benchmark，将 LLM 的科研前瞻能力转化为一个可验证的 rolling distribution forecasting 问题：在给定 cut-off 时间点，agent 需要预测未来六个月内 arXiv 论文在八个 frozen research directions 上的分布。核心发现是，所有四个 diagnostic models 的预测表现均不如基于精确历史计数的 EWMA baseline，说明当前 LLM agent 在 compositional accuracy 上尚未超越简单的指数加权移动平均。论文诊断出两个相互关联的 bottleneck：在 cumulative-history access 条件下，State carry-forward 优于直接 Forecast，且 frozen-evidence replay 表明 Forecast-oriented policy 会检索较少的 recent evidence，即“向前看”的目标会改变 agent“看什么”的行为。即使提供精确的历史数据，future-specific updating 仍然有限，只有 GPT-5.5 结合 reopened Search 能略微超过 EWMA。Outcome-aligned fine-tuning 能提升 Qwen3-4B 的 Spearman correlation 0.105，证明该任务具有可学习性，但并未在 mechanism level 修复 evidence acquisition failure。\n\n### § 9 最脆弱的假设\n\n最关键的假设是：arXiv 论文在八个 frozen directions 上的 submission share distribution 是一个可靠且可重复测量的 proxy for research attention。如果这个测量工具本身噪声过大或方向划分不合理，那么所有基于此的 forecasting 评估和 diagnostic 结论都将失去意义。在实际中，这个假设可能不成立，因为 paper-to-direction assignment 存在大量 boundary cases（42.60% 的 membership 被标记为 boundary ties），且八个方向是由 LLM 辅助构建的 operational coordinates 而非专家验证的 taxonomy。论文提供的证据包括 split-half Spearman–Brown reliability 为 0.820，posterior-predictive estimate 为 0.828，以及 human audit 显示 field membership 复现率为 0.958。然而，human audit 中 exact primary match 仅为 0.533，corpus-reweighted 后降至 0.470，且这是 single-annotator 的 label-blind audit，缺乏 inter-annotator agreement 和 domain-expert validation。这意味着虽然 benchmark 在 persistence level 上可能足够稳定，但 paper-level 的方向分配噪声可能足以影响对 beyond-persistence updating 的精细诊断，尤其是当 agent 的 residual alignment 本就很弱（如 GPT-OSS-120B 和 DeepSeek-V3 接近零）时，测量噪声可能淹没真实信号。\n\n### § 10 最小复现实验\n\n在一周时间内，可以复现论文中最核心且最易实现的 claim：**所有 LLM agent 的 Forecast 表现不如 EWMA baseline**。具体方案如下：从 arXiv API 抓取 2022-06 至 2026-06 期间标记为 cs.CL/cs.LG/cs.AI/cs.CV 的论文，选取 3-5 个具有明确子方向的领域（如 machine translation 或 reinforcement learning），用 GPT-4o 或 Claude 构建每个领域的 8 个 direction codebook，然后用一个简单的 keyword-based classifier 或 LLM classifier 对论文进行 direction assignment。对于每个领域和每个 semi-annual origin（如 2024-01, 2024-07, 2025-01），计算前三个窗口的 EWMA 预测和实际未来六个月的 distribution，用 Spearman correlation 评估。同时，用 GPT-4o 或 Qwen3-4B 在 Closed 和 Fixed-window 条件下进行 Forecast，比较其 Spearman correlation 与 EWMA。如果 LLM agent 的得分系统性低于 EWMA，则支持论文的核心 claim；如果 LLM agent 在部分领域显著超过 EWMA，则反驳该 claim。这个实验不需要完整的 278 个领域和 1,390 个 episodes，但能验证“persistence remains dominant”这一最基础的发现。", "research_value": "### § 11 最强反例设计\n\n对这篇论文最有力的攻击应针对其 ground truth 的有效性，提出一个具体的替代解释：**LLM agents 并非缺乏 future-specific updating 能力，而是 RAP benchmark 使用的 arXiv submission share 是一个高度滞后的指标，导致 LLM 的“超前预测”被错误地判定为预测失败。** 研究注意力的真实转移往往先于 arXiv 论文发表数月甚至数年，当一个新的 paradigm shift（如某项突破性技术的发布）发生时，研究者的注意力、代码实现和实验资源会立刻转移，但受限于科研同行评审和论文撰写周期，这些注意力转化为 arXiv submission 份额存在巨大的系统性时滞。EWMA baseline 本质上是在拟合这种滞后的历史趋势，因此它与滞后的 ground truth 高度吻合；相反，如果 LLM agent 真正具备前瞻能力，它可能会基于近期的 breakthrough 预测出注意力的提前转移，但在六个月后的 arXiv submission 数据中，这种转移可能尚未完全显现，或者被历史存量的惯性所稀释，从而被 RAP 判定为表现不如 EWMA。为了验证这一替代解释，可以设计一个“Early-Signal Ground Truth”实验：选取几个发生明确 paradigm shift 的领域（如某关键架构发布后的六个月），对比 LLM agent 的预测分布、EWMA 预测分布，以及基于实时早期信号（如 GitHub 新建 repo 的主题分布、Twitter/X 上的学术讨论话题分布、顶级 conference 的 workshop 提案分布）构建的“真实注意力分布”。如果 LLM agent 的预测与早期信号的相关性显著高于其与 arXiv submission share 的相关性，且 EWMA 与早期信号严重脱节，则证明 RAP benchmark 不仅未能测出 LLM 的前瞻能力，反而用滞后的人类科研产出机制系统性地惩罚了真正具有前瞻性的预测。\n\n### § 12 Follow-up Research Idea\n\n基于 RAP 强制使用 frozen 8-direction simplex 从而无法捕捉 paradigm shift 的核心局限，一个非增量的 novel research idea 是构建 **Generative Research Horizon Expansion (GRHE) 任务：预测分类体系本身的演化**。该想法驱动的局限是：真正有价值的科研助手不应仅仅在固定坐标轴上预测份额变化，而应能预测未来会有哪些全新的坐标轴涌现；RAP 的 fixed-slate 设计从根本上排除了 LLM 发现 novel direction 的可能性。我们可以借鉴 Open-ended learning 中的 Quality Diversity (QD) 算法以及 NLP 中的 Dynamic Topic Models (DTM)，将研究方向视为可变异和重组的 \"concept genomes\"，而非固定的 taxonomy 槽位。GRHE 的目标不再是预测固定向量，而是让 agent 生成 $T+6$ 时刻的候选 taxonomy（包含新方向的语义描述），并预测新旧方向的联合分布。第一个实验将采用 \"Novel Concept Hit Rate\" 作为核心评估指标：给定 cut-off $T$ 时的文献，让 LLM agent 生成未来六个月可能涌现的 $k$ 个新方向描述；随后在 $T+6$ 的真实 arXiv 语料上运行无监督 embedding clustering，如果 agent 预测的某个新方向描述与真实涌现的高密度论文簇形成精准的 semantic alignment 且该簇在 $T$ 时刻不存在，则记为一次 hit。这与现有的 idea generation 或 fixed-slate forecasting 截然不同，它首次将评测从“已知空间内的分布预测”推向了“未知空间的拓扑演化预测”，真正测试了 LLM 在科学演进中的 generative foresight 而非 retrospective interpolation。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yingqian Wu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jingcong Liang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Siyuan Wang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Zhenfei Yin\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Philip Torr\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Junchi Yu\", \"affiliations\": [4], \"markers\": [\"*\"]},\n    {\"name\": \"Zhongyu Wei\", \"affiliations\": [1, 2], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Fudan University\"},\n    {\"id\": 2, \"name\": \"Shanghai Innovation Institute\"},\n    {\"id\": 3, \"name\": \"The Chinese University of Hong Kong\"},\n    {\"id\": 4, \"name\": \"University of Oxford\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding authors.\"}\n  ]\n}\n```", "summary_translation": "大型语言模型（LLMs）越来越多地作为研究 agent，但它们跟踪研究注意力转移的能力很难评估，因为综述和研究想法缺乏唯一可验证的结果。我们引入了 Research Attention Prediction (RAP)，这是一个涵盖 278 个 AI/ML 领域和 1,390 个 episodes 的滚动 benchmark。在每个 cut-off，一个 LLM agent 搜索时间受限的 arXiv 语料库，并预测八个 frozen research directions 在未来六个月的论文份额。Search 通常有所帮助，但在 compositional accuracy 方面，所有四个 diagnostic models 的表现都不如 exact-count exponentially weighted moving average (EWMA) baseline。我们发现了两个相关的瓶颈。在 cumulative-history access 下，对于所有四个 diagnostic models，State carry-forward 的表现优于 direct Forecast；frozen-evidence replay 将这种逆转的共同组成部分与检索较少近期证据份额的 Forecast-oriented policies 联系起来。即使有 exact historical activity，future-specific updating 仍然有限，只有 GPT-5.5 加上 reopened Search 略微超过了 EWMA。在 realised outcomes 上进行 Fine-tuning，将 Qwen3-4B 在后期 origins 的 held-out fields 上的 forecast Spearman correlation 提高了 0.105，在 change-rich episodes 上也有所提升。"}, {"title": "Scores Alone Do Not Prove Discovery: The Discovery Certification Protocol for Auditing AI Research Agents", "arxiv_id": "2609.09219", "authors": "Jingjie Ning, Shanshan Zhong, Xiaochuan Li, Ji Zeng", "summary": "AI research agents combine prior knowledge, public sources, and experimental feedback to produce useful results. The Discovery Certification Protocol (DCP) turns claims about these results into executable recovery and feedback tests. Gate 1 validates useful improvement on sealed evaluation. Gate 2 gives matched agents the registered starting information and observed Web content while withholding the target research history. Every valid method reaching the numerical target supplies a recovery witness and triggers the Core veto. DCP Core requires adequate controls, zero observed recoveries, and a finite-sample bound on recovery in one fresh registered episode. Optional Gate 3 measures the average effect of truthful feedback relative to a specified neutral policy from a shared checkpoint. DCP Evidence adds this effect after independent null calibration and a registered effect margin. Two controlled audits exercise the complete protocol in SQLite optimization and virtual catalyst control under different models. Each produced zero recoveries in 96 episodes, with an upper bound of 0.0468. Each paired study yielded 30 truthful recoveries and zero neutral recoveries, with passing 60-pair null studies. Additional cases exercise Core, recovered, and audit-incomplete decisions. A deterministic, LLM-free verifier reproduces the decisions from frozen evidence. DCP provides a common evidence language for useful outcomes, alternative routes, and feedback effects across AI research.", "category": "cs.AI", "cluster": "Research Agents \u0026 Evaluation", "tags": ["cs.AI"], "filter_reason": "这篇论文提出了 Discovery Certification Protocol (DCP)，用于审计和评估 AI research agents 的发现能力。论文的研究对象明确是结合先验知识、网络资源和实验反馈来产生结果的 AI research agents（属于 Tool-Use Agents / Long-Horizon Agents 范畴）。虽然论文的核心贡献是一个评估协议，但该协议旨在验证智能体是否真正通过环境反馈和探索发现了有效方法，还是仅仅通过其他途径（如运气）获得结果。这属于对智能体行为分析、评估基准和失败机制诊断的研究，直接帮助理解智能体的真实能力和反馈利用机制。根据筛选标准第一步，“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留”。因此，该论文符合研究范围。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的核心研究问题是：如何为 AI research agents 产出的研究结果提供可执行、可验证的审计证据，以证明其发现的真实性和价值。随着 AI research agents 越来越多地参与算法发现和自动化研究流程，它们往往只报告一个高分结果，但仅凭分数无法证明该结果是否依赖于特定的研究历史，或者是否可以通过其他路径轻易复现。解决这个问题至关重要，因为它直接关系到 AI 参与科学研究的可信度与问责性。DCP（Discovery Certification Protocol）通过将关于结果的声明转化为可执行的恢复和反馈测试来解决这一问题：Gate 1 在 sealed evaluation 上验证结果的有效改进；Gate 2 向匹配的 agents 提供注册的初始信息和观察到的 Web 内容，但保留目标研究历史，测试其是否能恢复目标结果；Gate 3 则测量 truthful feedback 相对于 neutral policy 的平均效应。这为 AI 研究中的有用结果、替代路径和反馈效应提供了一种通用的证据语言，使得发现报告成为作者可以提交、审计员可以挑战、读者可以独立验证的通用实验记录，从而显著提升了 AI 科研产出的透明度和可重复性。\n\n### § 2 前人工作与不足\n在 DCP 之前，AI research agents 的评估主要集中于任务成功率和工程能力，但缺乏对发现过程和信息边界的严格审计。例如，AlphaTensor、AlphaDev、FunSearch 和 AlphaEvolve 等系统虽然通过搜索与目标评估发现了有用的算法和数学构造，但它们的评估框架并未测试在给定起始信息下其他路径是否能恢复相同结果，也没有对 feedback policy 的因果效应进行随机化比较。MLE-bench、MLGym、MLR-Bench 和 PaperBench 等基准主要评估机器学习工程和复现能力，DiscoveryWorld 测量任务成功和科学行动，FIRE-Bench 评估已发表见解的重新发现，但它们都没有提供一个 outcome-level 的 recovery test 来接受通过共享数值规则验证的替代方法。在迭代反馈方面，ReAct、Tree of Thoughts、Reflexion 和 Self-Refine 等方法开发了工具使用和反思机制，但缺乏将 feedback effect 与独立 null calibration 分离的随机化对照设计。在评估完整性方面，contamination studies 和 memorization research 检查了先前暴露的影响，Proof-of-Learning 记录训练状态以证明训练过程，但它们没有将可执行结果与注册的 counterfactual experiments 耦合。这些不足的根本原因在于之前的研究没有将发现审计定义为一个结合信息边界、资源匹配和统计因果推断的综合性问题，导致评估缺口：无法区分一个高分结果是源于不可替代的创新发现，还是仅仅通过已知组件的重组或信息泄露即可轻易达成。DCP 通过引入 qualified recovery witnesses、finite-sample recovery bounds 和 randomized feedback effects，将证书资格与统计和因果结论分离，填补了这一关键空白。", "core_insight": "### § 3 重建作者的思考路径\n\n随着 AlphaTensor、FunSearch 等 AI research agents 在算法发现和自动化科研中取得突破，如何评估这些系统的“发现”成为了一个核心难题。传统的评估方式往往只关注 agent 最终产出的程序或模型在 sealed test 上的 score，但作者敏锐地观察到这种评估的脆弱性。在机器学习评估中，实现细节和 baseline 选择的微小差异就能改变结果的排名（Melis et al., 2018; Musgrave et al., 2020），而在自动化研究中，同一 idea 的不同独立实现同样会引发“implementation lottery”（Ning et al., 2026e）。这意味着，一个 agent 报告的高分可能只是特定实现路径的产物，甚至仅仅是因为它掌握了足够的初始数据（E0）和公开网络资料（Web）。如果换一个 agent，在相同的起点下也能轻易达到这个分数，那么这个高分就不能证明任何真正的“发现”。\n\n另一方面，现有的 agent 评估框架（如 MLE-bench, DiscoveryWorld）多聚焦于任务成功率或工程能力，缺乏对研究过程本身的严格因果审计。当 agent 通过 ReAct 或 Reflexion 等机制利用实验反馈进行迭代优化时，我们很难确定性能的提升究竟是因为真实的实验反馈起到了作用，还是仅仅因为多轮的 prompt 结构或额外的计算预算带来的增益（Ning et al., 2026d）。为了剥离这些混淆因素，作者借鉴了因果推断中的反事实框架（Rubin, 1974）和预注册机制（Nosek et al., 2018）。如果要在同一个 checkpoint 上分叉，一边给予真实的实验反馈，另一边给予保持格式但无信息的中性反馈，就能通过等价性检验（Schuirmann, 1987）来校准并量化反馈的真实因果效应。\n\n沿着这些线索，作者意识到需要一个统一的、可执行的审计协议来重新定义“发现”的证据。这个协议不能仅仅依赖最终的 score，而必须回答三个递进的问题：这个结果真的比 baseline 有用吗？如果给其他 agent 相同的初始信息和网络访问权限但不给实验历史，它们能恢复出这个结果吗？如果不能恢复，那么目标运行中的实验反馈是否真的比中性反馈带来了显著的性能提升？通过将这三个问题转化为可执行的 recovery test 和 randomized paired study，并用一个确定性的 verifier 进行离线重放，作者最终构建了 Discovery Certification Protocol (DCP) 的核心框架。\n\n### § 4 核心 Intuition\n\nAI research agent 报告的高分可能仅仅依赖于初始信息和公开资料，而非真正的实验探索。为了证明真正的“发现”，必须引入一个“可恢复性”测试：给一个全新的 agent 相同的起点但隐藏实验历史，如果它无法达到目标分数，说明该结果并非显而易见。进一步地，通过严格的随机对照实验，证明真实的实验反馈相比于无信息的中性反馈确实带来了因果上的性能提升。这种将高分验证、反事实恢复测试与因果反馈评估分离的方法，构成了证明 AI 发现的坚实证据基础。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Registration: K, E0, Rules]\n      |\n      v\n[Target Run: A*, score x, L*]\n      |\n      +--\u003E [Gate 1: Sealed Eval] --\u003E (Pass if x \u003E baseline + δ_min)\n      |\n      +--\u003E [Gate 2: Recovery Test]\n      |      |\n      |      v\n      |    [Fresh Agents: K, E0, Wobs, -L*] --\u003E [Candidate Gen \u0026 Eval]\n      |      |\n      |      +--\u003E (Witness found?) -- Yes --\u003E [Core Refuted (Recovered)]\n      |      |\n      |      +--\u003E (No witness, 0 hits) --\u003E [Calc p_upper bound] --\u003E [Core Certified]\n      |\n      +--\u003E [Gate 3: Feedback Effect (Optional)]\n             |\n             v\n           [Checkpoint c] --\u003E [Truthful Branch] \\\n                                             \u003E--\u003E [Calc Δ_feedback] --\u003E [Null Calibration] --\u003E [Evidence Certified]\n           [Checkpoint c] --\u003E [Neutral Branch]  /\n```\n\nDCP 的完整 Pipeline 围绕三个核心 Gate 展开，具体步骤如下：\n\n1. **Registration \u0026 Target Run (§3.1, §3.2)**：\n   - **输入**：背景知识 $K$、独立于研究动作的初始观测 $E_0$、预先注册的规则（包括预算、评估标准等）。\n   - **具体操作**：在推理与评测阶段，AI research agent 执行目标研究任务，产生研究历史 $L^*$ 并提交最终输出 $A^*$。系统在独立的 sealed evaluator 上对 $A^*$ 进行评估，获得分数 $x$。\n   - **输出**：目标结果 $(A^*, x)$ 及其对应的研究历史 $L^*$。\n\n2. **Gate 1: Sealed Evaluation (§3.3)**：\n   - **输入**：目标输出 $A^*$、baseline artifact $b$、注册的最小有用增益 $\\delta_{min}$。\n   - **具体操作**：在评测阶段，验证 $A^*$ 的有效性，并检查其平均效用是否显著优于 baseline。\n   - **输出**：确认目标结果是否构成有用改进，若不通过则审计失败。\n\n3. **Gate 2: Recovery Test (§3.4)**：\n   - **输入**：$K$、$E_0$、目标运行观测到的 Web 内容 $W_{obs}$，但**保留** $L^*$。\n   - **具体操作**：在推理阶段，Fresh matched agents 在上述信息边界内尝试生成候选方案。系统检查是否存在任何有效方法达到恢复阈值 $x - \\epsilon$。\n   - **输出**：若找到 qualified recovery witness，则触发 Core veto（状态为 recovered）；若零恢复，则基于 $n$ 次独立实验计算 finite-sample upper bound $p_{upper}$，若 $p_{upper} \\le \\rho$ 且控制组通过，则 Core 认证通过。\n\n4. **Gate 3: Feedback Effect (§3.5)**：\n   - **输入**：共享的 checkpoint $c$、truthful feedback 策略与 neutral feedback 策略。\n   - **具体操作**：在推理阶段，从 checkpoint $c$ 分出两条分支进行配对实验。Truthful branch 接收真实的实验测量反馈，Neutral branch 接收保留格式但无方向性信息的反馈。在评测阶段计算两者的平均效用差异 $\\Delta_{feedback}$，并通过独立的 null tasks 进行校准。\n   - **输出**：若反馈效应显著大于注册的边际阈值，且 null calibration 通过，则 Evidence 认证通过。\n\n### § 6 核心数学推导\n\n本论文的核心数学推导集中在统计推断与因果效应估计上，用于为“发现”提供严格的量化边界。\n\n1. **Gate 1 的有用改进条件 (Eq 1)**：\n   $$ \\mu(A^*) - \\mu(b) \\ge \\delta_{min} $$\n   - **Intuition**：目标输出 $A^*$ 的平均效用必须比 baseline $b$ 高出至少一个预先注册的最小阈值 $\\delta_{min}$。这确保了观察到的分数提升不仅是统计噪声，而且具有实质性的研究意义。\n\n2. **Gate 2 的恢复规则 (Eq 2)**：\n   $$ score(a) \\ge x - \\epsilon $$\n   - **Intuition**：挑战者生成的候选方案 $a$，如果在容差 $\\epsilon$ 内达到了目标分数 $x$，则被视为成功恢复了目标结果。$\\epsilon$ 是一个小的实质性等价分数差异，确保恢复标准既严格又具可操作性。\n\n3. **Gate 2 的恢复概率上界 (Eq 3)**：\n   - **推导**：假设单次实验恢复目标的概率为 $p_B$，则 $n$ 次独立实验中零恢复的概率为 $(1 - p_B)^n$。我们希望以高置信度（$1 - \\alpha_{recovery}$）断言恢复概率很小，即令 $(1 - p_B)^n \\le \\alpha_{recovery}$。解此不等式得 $p_B \\le 1 - \\alpha_{recovery}^{1/n}$。\n   - **Intuition**：如果在 $n$ 次独立尝试中都没有恢复目标，我们可以以高置信度推断单次实验恢复目标的概率 $p_B$ 低于这个上界。实验次数越多，这个上界越小，对“不可恢复性”的证明就越强。\n\n4. **Gate 3 的反馈效应估计 (Eq 4)**：\n   $$ \\Delta_{feedback} = E[u(\\text{truthful}) - u(\\text{neutral}) | c] $$\n   - **Intuition**：在给定 checkpoint $c$ 的条件下，真实反馈相比中性反馈带来的平均效用提升。这衡量了反馈机制本身是否在做有用的工作，排除了单纯依赖初始信息继续搜索的可能。\n\n5. **Evidence 的支持条件**：\n   $$ LCB(\\Delta_{feedback}) \\ge \\delta_{evidence} + \\delta_{sham} $$\n   - **Intuition**：反馈效应的置信下界不仅要大于零，还要足够大，以超过注册的最小效应阈值 $\\delta_{evidence}$ 和 null calibration 的误差范围 $\\delta_{sham}$。这确保了反馈的因果效应是真实且稳健的。\n\n### § 7 实验设计与结论\n\n**提出了什么问题**：AI research agents 报告的高分数是否真正证明了“发现”？如何区分目标结果本身的可恢复性（基于初始信息）与实验反馈带来的增量贡献？\n\n**设计了什么实验验证这个问题**：设计了两个完整的 DCP 审计案例（SQLite-Web 优化和虚拟催化剂控制）以及三个诊断案例。在两个主要案例中，执行完整的三个 Gate。Gate 1 验证分数提升；Gate 2 让 96 个 fresh agents 尝试恢复结果；Gate 3 从 checkpoint 分出 30 对分支测试 feedback effect，并进行 60 对 null calibration。诊断案例包括：Device calibration (测试 Core)，Multidimensional knapsack (测试 recovery refuted)，Affine (测试 audit incomplete)。\n\n**问题的答案是什么**：在两个主要案例中，Gate 2 记录了 96 次实验零恢复，上界为 0.0468，通过了 Core 认证。Gate 3 显示 30 次真实反馈全部恢复，而中性反馈零恢复，效应显著，通过了 Evidence 认证。这证明高分数不仅仅是初始信息可推导的，且反馈机制确实起到了关键作用。诊断案例成功触发了 recovered 和 incomplete 决策，验证了 DCP 协议在不同情况下的判别能力。", "additional_insights": "### § 8 Take-aways\nDCP将AI research agents的“discovery”从单一分数转化为可审计的多阶段证据过程，将结果效用、替代路径和反馈效应解耦。Gate 2引入了recovery test，向matched agents提供初始信息（$K$, $E_0$, $W_{obs}$）但保留目标研究历史（$L^\\star$），任何有效恢复都会触发Core veto，证明该结果并非特定研究历史的独有产物。Gate 3通过从shared checkpoint进行randomized pairs，比较truthful feedback与neutral policy，并利用null calibration证明反馈本身在因果上导致了结果的改善。该协议使用deterministic, LLM-free verifier从frozen evidence bundles中重现决策，确保了无需重新运行昂贵LLM agents的独立审计与可重复性。\n\n### § 9 最脆弱的假设\nDCP最脆弱的假设在于Gate 2的“information boundary”与matched agent的等效性，即认为如果在给定初始信息（$K$, $E_0$, $W_{obs}$）且保留研究历史（$L^\\star$）的情况下，matched agent未能恢复目标结果，就证明该结果确实依赖于特定的研究历史。在实际中，这个假设可能不成立，因为LLM agents的推理高度依赖于prompt结构、采样随机性以及“implementation lottery”（论文自身也引用了这一点）。零恢复可能仅仅意味着matched agent在96次独立尝试中运气不佳，或者其特定的prompt harness不利于触发该推理路径，而非该信息在$L^\\star$中根本不存在。论文通过positive controls（如45/45通过）和finite-sample bound（如0.0468）来提供证据，证明harness本身是有效的且尝试是独立的，但这无法完全排除LLM推理的随机性导致false negative recovery的可能性，即可能存在一条未被该特定matched agent发现但理论上可行的替代路径。\n\n### § 10 最小复现实验\n在一周时间内，可以通过构建一个简化的SQLite index优化任务来验证Gate 2的recovery test与Core veto机制。使用一个包含10个查询的微型SQLite数据库，目标是选择1个最优的partial index以最小化查询时间。首先，运行一个Target Run：让LLM（如GPT-4o-mini）进行5轮交互，每轮提供执行时间作为feedback，直到它发现最优的复合index，并记录其研究历史（$L^\\star$）。接着，进行Gate 2测试：运行10个fresh matched agents，向它们提供相同的数据库schema和初始信息（$E_0$），但完全保留Target Run的试验历史（$L^\\star$），让它们直接提交最优index方案。测量这10个matched agents中有多少个成功猜中（recover）了最优index。如果大多数agent成功recover，则证明该“discovery”是trivial的，触发Core veto，反驳了该结果需要特定研究历史的claim；如果零recover或极少recover，则支持了DCP的核心假设，即feedback和历史信息对于该结果是必要的。这个实验无需复杂的harness，只需简单的API调用和本地SQLite执行即可完成。", "research_value": "### § 11 最强反例设计\n如果我反对这篇论文，我会设计一个基于“语法脆弱性”与“实现彩票”的真实世界场景来攻击 Gate 2 的 information boundary 假设。具体而言，我会构造一个目标发现（target discovery），其在概念上是极其 trivial 的，但在语法实现上却高度脆弱。例如，在一个特定的代码优化任务中，最优解仅仅是调用一个冷门但公开的 API 参数组合，但该参数组合只有在特定的代码缩进、变量命名或极其生僻的 prompt 措辞下才能通过 sealed evaluation。在 Target Run 中，原 agent 偶然发现了这个特定的语法结构并记录在 $L^\\star$ 中。当进入 Gate 2 测试时，matched agents 虽然拥有相同的初始信息（$K$, $E_0$, $W_{obs}$），但由于 prompt harness 的微小差异和采样随机性，它们在 96 次独立尝试中均未能命中这个极其狭窄的语法窗口，导致零恢复。此时，DCP 的 finite-sample bound 会给出一个极小的上界（如 0.0468），从而错误地颁发 Core 证书，声称该发现依赖于特定的研究历史且具有不可替代的创新性。这个反例直接挑战了 DCP 的核心有效性：它揭示了 DCP 实际上可能只是在测量“语法实现的难度”而非“概念发现的深度”。替代解释是，零恢复并非因为 $L^\\star$ 中包含了不可替代的创新路径，而是因为 evaluation metric 对特定语法的极端敏感性制造了 false negative recovery，使得 DCP 将一个平凡的语法拼图错误地认证为科学发现。\n\n### § 12 Follow-up Research Idea\n基于 Gate 2 无法区分“概念创新”与“语法脆弱性”这一核心局限，我提出一个全新的研究框架：Mechanistic Discovery Certification (MDC)，将审计目标从 black-box 的 outcome recovery 转向 white-box 的 reasoning trajectory recovery。该想法的驱动需求在于，当前的 DCP 依赖 frozen evidence 和 deterministic verifier 来判断结果是否可复现，但这在 LLM agents 中会因 implementation lottery 产生不可避免的 false negative，我们需要一种不依赖于特定 prompt harness 就能证明“概念不可替代性”的方法。这里可以借鉴 Mechanistic Interpretability 领域中的 Sparse Autoencoders (SAEs) 和 causal scrubbing 技术，这些工具能够从 LLM 的 activation space 中提取并验证特定的 reasoning circuits。第一个实验将设计一个对照任务：首先在 Target Run 中提取 agent 发现最优解时的 activation trajectory，并利用 SAEs 识别出对应核心概念的 feature directions；随后在 Gate 2 阶段，不要求 matched agents 输出完全相同的代码或数值，而是运行它们并监测其 residual stream 中是否激活了相同的 concept features。如果 matched agents 在没有 $L^\\star$ 的情况下，其 activation space 中完全没有涌现该 concept circuit，则真正证明了该发现需要特定的研究历史来构建推理路径；如果它们输出了不同语法但激活了相同 circuit，则证明概念是 trivial 的，仅是实现不同。这一提议彻底区别于现有工作，它将发现审计从“输出空间的统计随机对照”升维到了“表征空间的因果机制验证”，从根本上绕过了 implementation lottery 的干扰。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jingjie Ning\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shanshan Zhong\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiaochuan Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ji Zeng\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Carnegie Mellon University\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "AI research agents 结合先验知识、公共来源和实验 feedback，以产生有用的结果。Discovery Certification Protocol (DCP) 将关于这些结果的声明转化为可执行的 recovery 和 feedback 测试。Gate 1 验证在 sealed evaluation 上的有用改进。Gate 2 向匹配的 agents 提供注册的起始信息和观察到的 Web 内容，同时隐瞒目标研究历史。每个达到数值目标的有效方法都提供一个 recovery witness 并触发 Core veto。DCP Core 要求充足的 controls、零观察到的 recoveries，以及在一个全新注册 episode 中 recovery 的 finite-sample bound。可选的 Gate 3 测量 truthful feedback 相对于来自共享 checkpoint 的指定 neutral policy 的平均效应。DCP Evidence 在独立的 null calibration 和注册的 effect margin 之后添加此效应。两次受控的 audits 在不同模型下的 SQLite 优化和虚拟催化剂控制中执行了完整的 protocol。每次在 96 个 episodes 中产生了零次 recoveries，上界为 0.0468。每项配对研究产生了 30 次 truthful recoveries 和零次 neutral recoveries，并通过了 60 对 null studies。额外的案例执行了 Core、recovered 和 audit-incomplete 决策。一个确定性的、无 LLM 的 verifier 从冻结的 evidence 中复现了这些决策。DCP 为整个 AI 研究中的有用结果、替代路线和 feedback 效应提供了一种通用的 evidence language。"}]}, {"name": "Agent Memory \u0026 Knowledge Reuse", "count": 2, "papers": [{"title": "ROAM: Robust Organization of Atomic Memories for Agents through Semantic Relations", "arxiv_id": "2609.09778", "authors": "Jianjie Zheng, Peng Lai, Sijie Cheng, Jiehui Zhao, Lei Yang, Guanhua Chen", "summary": "Long-term language-model agents rely on external memory across interactions. Atomic memories are particularly useful: their fine-grained semantic boundaries enable precise retrieval and direct comparison between observations. Yet accumulating atoms inevitably become redundant, overlapping, or conflicting. Existing methods often ask an LLM manager to add, update, delete, or rewrite memories directly, coupling semantic interpretation, storage decisions, and content generation in one error-prone operation. We introduce ROAM, a relation-guided framework that uses atomicity for management while allowing richer answer-time representations. ROAM classifies incoming--stored atom pairs as independent, equivalent, directionally subsuming, or conflicting, then organizes observations into active Primary and supporting Evidence roles. Fusion subsequently combines complementary details and temporal changes into compact, potentially non-atomic views. Only Primary views are retrieved for answering, preventing redundant or outdated atoms from competing independently. Across models and evaluation settings, ROAM improves answer accuracy by up to 29.8 percentage points. Ablations show complementary benefits from different relations and consistent gains from fusion beyond role organization. Mechanism analysis further finds 15.6-point higher answer-critical source recall and an 11.5-point lower confounder-token share. ROAM remains robust across manager scales.", "category": "cs.CL", "cluster": "Agent Memory \u0026 Knowledge Reuse", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一个名为 ROAM 的框架，专门用于管理和组织大语言模型智能体的长期外部记忆。论文针对智能体在长期交互中积累的原子记忆出现的冗余、重叠和冲突问题，设计了一种基于语义关系的分类和组织机制，将记忆分为主要的和辅助的角色，并进行融合以提供更准确的检索。这直接对应了筛选标准中“单智能体：记忆”这一核心方向。论文的研究对象明确是“长期语言模型智能体”，且其提出的机制旨在改进智能体的记忆能力，从而提升回答的准确性和鲁棒性。因此，该论文完全符合研究范围，应予保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文解决的核心问题是：长期语言模型代理在跨会话交互中依赖外部记忆积累用户偏好、情境与经验，而以原子事实为存储单元时，持续涌入的观察不可避免地产生语义重述、属性细化与时间状态转移，导致冗余、重叠与冲突。现有方法将语义解释、存储决策与内容生成耦合在单一黑盒操作中，使记忆管理不可控且易错。ROAM 提出将这一复合决策解耦为显式 semantic relation inference 与确定性策略执行：首先将 incoming–stored atom pair 分类为 independent (IND)、equivalent (EQV)、directionally subsuming (OSN/NSO) 或 conflicting (CON) 五种关系，再据此将观察组织为 active Primary 与 supporting Evidence 两种角色，最后通过 fusion 模块将互补细节与时间变化合成为紧凑的 read view 供检索使用。这个问题的重要性在于：原始对话历史迅速超出 agent 的 working context limit，而未整理、重叠和过时的原子记录会直接与 answer-critical evidence 竞争有限的 retrieval capacity，严重降低下游响应质量。ROAM 的价值体现在：在 controlled interference 设置下答案准确率最高提升 29.8 个百分点，answer-critical source recall 提高 15.6 个百分点，confounder-token share 降低 11.5 个百分点，且在不同 manager model 规模下保持稳健，证明了 relation-guided organization 能在有限 context budget 下有效抑制语义干扰并保留关键证据。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决。最直接相关的 prior method 是 Mem0 (Chhikara et al., 2025)，它让 LLM manager 对每个 incoming–stored memory pair 直接预测 ADD、UPDATE、DELETE 或 NONE 操作。这种方法的核心缺陷在于：模型必须在单次黑盒决策中同时完成三件事——推断底层 semantic relation、将其映射为物理存储突变、并协调内容重写。这种 conflation 使操作后果不稳定：当模型误判关系时，不仅存储状态出错，内容生成也随之偏移，且由于直接覆写源记录，历史可追溯性被永久破坏。Append-all 策略则走向另一极端，保留所有候选为独立可检索单元，在无竞争时表现尚可（N=0 时达 87.0%），但干扰增至 N=8 时骤降至 24.4%，因为它无法抑制冗余与过时记录对 retrieval capacity 的挤占。EverMemOS-style (Hu et al., 2026a) 虽引入 semantic grouping 与 consolidation，但仅限于短事实记忆的合并，未从显式 semantic relation 推导每条观察的 retrieval eligibility，无法区分等价、方向包含与冲突等不同交互形式。更广泛地看，结构化组织方法如 A-MEM (Xu et al., 2025)、RMM (Tan et al., 2025)、LightMem (Fang et al., 2026) 等虽在记忆链接、摘要或分层存储上有所推进，但均未将 semantic relation 作为 model judgment 与 storage control 之间的显式接口。根本原因在于：atomization 仅规定了记忆的粒度，却未规定积累的原子事实随信息演化应如何共存——这一问题在之前的工作中未被清晰定义，direct-operation paradigm 将其隐藏在端到端决策中，而 structural organizers 则绕过了关系级别的精确控制。ROAM 正是针对这一缺口，用五类关系的显式推理替代黑盒突变，用 Primary–Evidence 角色分配解耦源保留与检索资格，从而在保持历史 provenance 的同时消除冗余竞争。", "core_insight": "### § 3 重建作者的思考路径\n\n在长期 agent 交互中，为了在有限的 context budget 下实现高精度检索，系统通常将对话历史提取为细粒度的 atomic memories。然而，随着交互的持续，这些原子记忆不可避免地会产生语义重复、属性更新或状态冲突。现有的 memory management 方法（如 Mem0）通常采用 imperative operations，即让 LLM 直接对记忆库执行 ADD、UPDATE、DELETE 等操作。这种端到端的黑盒决策将语义解释、存储决策和内容生成耦合在一个容易出错的步骤中，不仅导致操作不可控，还常常因为直接覆盖而破坏了历史可追溯性。如果只是简单追加所有记忆，冗余和过时的信息又会挤占有限的检索空间，导致 answer-critical evidence 被淹没。面对这一困境，研究者自然会思考：如何在不丢失历史上下文的前提下，高效地整合不断涌入的原子观察？一个直观的理论线索是，人类在处理记忆更新时，并非直接“删除”旧记忆，而是先识别新旧信息之间的语义关系，再据此组织记忆。因此，与其让模型直接执行物理存储突变，不如将这个复合决策解耦：先让模型显式推断新旧记忆之间的五种语义关系（独立、等价、新旧包含、冲突），然后由确定性的策略根据关系分配角色，将最相关的设为 Primary，将支持性或被取代的设为 Evidence，最后通过 fusion 生成紧凑的 read view 供检索使用。这种解耦不仅使操作变得可控，还能在检索时只暴露高密度的当前视图，同时保留完整的底层历史溯源。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 在于：将 memory management 从“直接执行存储操作”转变为“先判断语义关系，再按规则组织角色”。先前方法失效是因为让 LLM 一次性完成语义理解和存储修改，这种黑盒操作极易出错且破坏历史；而 ROAM 奏效的关键在于解耦——让 LLM 只负责判断新旧记忆间的五种语义关系，随后由固定策略将记忆划分为活跃的 Primary 和归档的 Evidence，并仅检索 Primary 的融合视图。这样既避免了冗余和过时信息在检索时竞争空间，又完整保留了历史溯源，从而在有限的 context budget 下最大化 answer-critical evidence 的覆盖率。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[Dialogue] -\u003E [Extractor] -\u003E [Atomic Obs. O_t] --+\n                                                 |\n[Old Primary] -\u003E [Retriever rho_k] -\u003E [Cand. C] --+\n                                                 v\n                               [Relation Model Phi] -\u003E [Relations L]\n                                                 |\n                                                 v\n                             [HighestPriority] -\u003E [r_[*]]\n                                                 |\n           +-------------------------------------+-------------+\n           |                                                   |\n           v                                                   v\n    [Role Update]                                       [IND: New Pri.]\n    |  Pri. / Evid.                                             |\n    v                                                           |\n[FuseOrdered] \u003C-------------------------------------------------+\n    |\n    v\n[Read View v] -\u003E [Answer-time Retriever] -\u003E [Top-K Views] -\u003E [Answer]\n```\n\nROAM 的完整 Pipeline 包含以下推理与评测步骤：\n\n1. **Extraction**：输入原始对话 $D_t$，通过 Extractor 提取为自包含的 atomic observation $O_t$（包含文本 $a_t$、时间戳 $\\tau_t$ 和上下文 $c_t$）。这为后续的精细化管理提供了基础单元（对应正文 2.1 节）。\n2. **Candidate Retrieval**：输入新观察的文本 $a_t$ 与上一轮的 Primary memories $P_{t-1}$，通过 Retriever $\\rho_k$ 检索出 $k$ 个最相关的候选集 $C$（对应正文 2.2.1 节，Algorithm 1 第1行）。\n3. **Semantic Relation Inference**：输入 $O_t$ 与候选集 $C$ 中的每条记忆，通过 Relation Model $\\Phi$ 预测五类语义关系：IND（独立）、EQV（等价）、OSN（新包含旧）、NSO（旧包含新）、CON（冲突）（对应正文 2.2.1 节，Algorithm 1 第5行）。\n4. **Relation Selection**：输入预测出的关系集合 $L$，通过 HighestPriority 函数选出最高优先级的关系 $r_{[*]}$。优先级排序首先保护状态区分（CON），其次偏好新引入的特异性（OSN），最后合并冗余（EQV/NSO）（对应正文 2.2.2 节，Algorithm 1 第6行）。\n5. **Role Update**：输入选定的关系 $r_{[*]}$ 与匹配的候选集，执行确定性策略分配角色：IND 插入新 Primary；EQV/NSO 保留最早匹配的 Primary，其余及 $O_t$ 降级为 Evidence；OSN/CON 将 $O_t$ 提升为 Primary，旧匹配降级为 Evidence。此步不修改原始文本，仅分配检索资格（对应正文 2.2.2 节，Table 1，Algorithm 1 第8-13行）。\n6. **View Update (Fusion)**：输入存活的 Primary 及其关联的 Evidence 集合，按时间排序后通过 FuseOrdered 模块融合为紧凑的 read view $v$。EQV 去除冗余，OSN/NSO 保留兼容的特异性细节，CON 记录时间状态变化（对应正文 2.2.2 节，Table 1，Algorithm 1 第14-15行）。\n7. **Answer-time Retrieval**：输入下游 query $q$ 与所有 Primary 的 read views，Retriever 仅在 Primary views 中检索，在预算 $B$ 内选出最相关子集供回答模型使用。Evidence 记录被保留但不参与独立竞争（对应正文 2.1 节与 2.2 节）。\n\n### § 6 核心数学推导\n\n本文属于系统与框架设计论文，核心贡献在于提出关系引导的记忆管理机制与确定性策略，未涉及形式化的数学推导或定理证明，因此跳过本节。\n\n### § 7 实验设计与结论\n\n这篇论文通过三个互补的评测设置和一系列消融实验，系统验证了 ROAM 在有限检索预算下管理长期记忆的有效性。\n\n**问题 1：ROAM 在检索预算受限且存在语义与时间干扰时是否依然鲁棒？**\n实验设计：构建 LongMemEval Controlled 数据集，固定每个问题的 answer-critical memories，仅改变注入的 confounders 数量（$N \\in \\{0, 2, 4, 6, 8\\}$），在 256-token 预算下测试不同管理策略的抗干扰能力。\n答案：ROAM 在所有非零干扰设置下均排名第一。当 $N=8$ 时，ROAM 比最强 baseline 高出最多 29.8 个百分点，且随干扰增加性能下降幅度显著更小，证明了关系引导的组织策略本身具备强鲁棒性。\n\n**问题 2：ROAM 的优势能否迁移到自然长程历史和多实体状态更新场景？**\n实验设计：在未修改的 LongMemEval（500个自然长程问题）和 MEME-Post（694个多实体状态更新问题）上，使用三种不同的 manager model 进行端到端评测。\n答案：在完整 LongMemEval 上，ROAM 在三种模型下均取得最高准确率（63.0%, 59.8%, 58.6%）；在 MEME-Post 上，ROAM 同样在所有模型中优于基于模型的管理 baseline，证明其能有效泛化到真实复杂场景。\n\n**问题 3：哪些关系类型和系统组件贡献了这些增益？**\n实验设计：进行关系消融（CON-only、CON+EQV、Full ROAM）与 Fusion 消融（移除 Fusion 模块，仅检索原始 Primary 文本），并分析不同 manager model 规模与 memory-context budget 的敏感性。\n答案：消融实验表明，矛盾（CON）、等价（EQV）和方向包含（OSN/NSO）关系均提供互补增益，覆盖关系越多性能越稳定。Fusion 模块在所有干扰水平下一致提升准确率，说明“管理选择保留什么”与“融合决定如何呈现”是互补机制。此外，检索诊断发现 ROAM 将 answer-critical source recall 提高了 15.6 点，并将 confounder-token share 降低了 11.5 点，证实其通过选择性组织上下文、抑制干扰来提升最终回答质量。", "additional_insights": "### § 8 Take-aways\n\nROAM 将 memory management 从端到端的黑盒操作（如 ADD/UPDATE/DELETE）解耦为显式的 semantic relation inference 和 deterministic policy execution，避免了 LLM 同时处理语义解释和存储突变带来的不稳定性。框架定义五种语义关系（IND, EQV, OSN, NSO, CON）对 incoming-stored atom pairs 进行分类，并据此分配 Primary 和 Evidence 角色，使历史 provenance 得以保留而冗余记忆不会独立竞争检索。Fusion 模块将兼容细节和时间变化合成为 compact read view，仅 Primary views 参与检索，从而在有限 context budget 下提升 answer-critical evidence 的信息密度。在 LongMemEval Controlled 的高干扰设置（N=8）下，ROAM 比最强 baseline 提升最高 29.8 个百分点，且优势在 Gemma-4-12B、Qwen3.5-9B、Qwen3-8B 三种 manager model 上一致。消融实验表明 contradiction、equivalence、directional containment 关系以及 fusion 各自提供互补收益，缺少任一组件都会导致高干扰下 accuracy 下降。检索诊断揭示 ROAM 的核心机制：在相同 256-token budget 下，通过 selective context organization 将 gold-source recall 提升至 84.6% 并将 confounder-token share 降至 47.1%，而非依赖更大的 context 量。\n\n### § 9 最脆弱的假设\n\n最脆弱的假设是 LLM 能够可靠区分 OSN 和 NSO 这两种方向性 entailment 关系。这个假设是 ROAM role assignment 的基础：OSN 要求 incoming observation 成为 Primary 而 old matches 降为 Evidence，NSO 则相反，方向判断错误会导致最 informative 的 fact 被错误归档为 Evidence 或冗余 fact 被错误保留为 Primary。在实际场景中，entailment 方向的判断需要对 entity、attribute 和 specificity 层次有精确理解，例如 \"lives in Manhattan\" 与 \"lives in New York City\" 的地理包含关系，或 \"has a golden retriever\" 与 \"has a dog\" 的 taxonomic 关系，这些判断对中小规模 LLM 并非易事。论文 Table 4 提供的证据显示，即使是 26B 参数的 Gemma-4-26B-A4B-it，OSN 和 NSO 的 F1 也仅为 76.0% 和 69.3%，远低于 EQV（93.1%）和 CON（91.0%）。然而，主实验使用的 manager model 为 8B–12B 规模，论文并未直接报告这些较小模型在实验数据上的 relation inference 准确率，也未分析 OSN/NSO 误判对下游 accuracy 的具体影响。如果较小模型的 OSN/NSO 分类性能进一步下降，role assignment 的错误会直接导致 answer-critical memories 被错误降级或冗余 memories 被错误保留，从而削弱 ROAM 相对于 Append-all 的核心优势。\n\n### § 10 最小复现实验\n\n1 周内可复现 ROAM w/o Fusion 的核心逻辑，以验证 relation-conditioned role assignment 是否能在高干扰下提升 retrieval accuracy。数据方面，从 LongMemEval 中选取 50 个带有 gold-memory annotation 的 questions，用 Gemma-4-26B-A4B 生成固定数量的 confounders（Type I 语义相似但不回答问题，Type II 时间上过时但与当前值冲突），构造 N=0 和 N=8 两个干扰水平。实现方面，用 Qwen3-8B 作为 manager model，对 incoming atomic memory 与每个 retrieved old memory 执行五分类 relation inference，根据 Table 1 的 deterministic policy 分配 Primary 和 Evidence 角色，跳过 fusion 模块直接使用 Primary atomic text 进行检索。Baseline 实现 Append-all（保留所有 candidates 独立检索）。测量方面，用 Qwen3-Embedding-0.6B 检索 top-k memories 并在 256-token budget 下 hard-truncate，用 DeepSeek-V4-Flash 作为 judge 评估 answer accuracy，同时计算 gold-source recall。如果 ROAM w/o Fusion 在 N=8 时 accuracy 显著高于 Append-all 且 gold-source recall 更高，则支持 relation-guided organization 能有效抑制干扰
