y writes and evaluates optimizer programs. It then distills the resulting program and practice record once into a 197-word primary Harness A, which is frozen before evaluation. Harness A reduces Gemini Flash regret by 48\\% in an independent $N=30$ study ($p\u003C.001$), enters the GP-BO performance range on the practice family, and lowers mean regret on all three held-out BBOB landscapes. The same text improves every tested Gemini executor and transfers to Claude Sonnet, reducing regret by 43\\% and 49\\% ($p\\leq.005$). An independent end-to-end replication produces Harness B, a different program and text at the same performance tier. The same framework also attains the lowest regret on a sealed YouTube reward-tuning production benchmark. Executable practice is thus a viable way to discover a search policy, and language a portable medium for deploying it.", "category": "cs.LG", "cluster": "RL \u0026 Optimization for Agents", "tags": ["cs.LG"], "filter_reason": "这篇论文的核心贡献在于提出了一种让智能体通过可执行实践和自我对弈自动发现搜索策略，并将其蒸馏为文本形式 Harness（即系统提示/执行框架）的机制。这完全符合筛选标准中“保留”规则：论文研究了 agent 的 harness / scaffold / system prompt，并且核心贡献是让这些智能体运行组件通过轨迹、反馈或评估结果自动改进和演化。论文中的智能体通过反复编写和评估优化器程序（自我演化机制），最终提炼出能够显著提升 LLM 执行器性能的文本 Harness。尽管其应用场景是黑盒优化，但其本质是探讨智能体能力的自我提升和 Harness 的自动构建，属于“自我演化”和“Agent Harness 改进”的前沿研究，因此完全符合研究目标。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的研究问题是：在低预算的 black-box optimization 场景下，如何让 LLM agent 通过可执行的实践学习到可靠的数值搜索策略，并将其一次性蒸馏为可移植的文本 harness，从而在评估阶段冻结并稳定地提升不同 LLM executor 的优化性能。许多科学和工程任务需要在查询预算极小的情况下优化昂贵且无梯度的目标函数，这正是 Bayesian optimization (BO) 和 evolutionary strategies 的核心应用场景。尽管 LLMs 能够解释优化历史并表达搜索启发式规则，但在缺乏特定结构时，它们作为数值优化器表现极不稳定，往往远不及传统的经典优化器。现有的改进方法通常将 LLMs 嵌入到既定的搜索程序中，或者依赖在线反馈不断修改 prompt，但这不仅容易泄露评估信息，还导致测试时的行为不可审计且难以复现。因此，探索一种能够在开发阶段学习、在评估阶段冻结，且能跨模型和任务泛化的可移植策略，对于提升 LLMs 在 black-box optimization 中的可靠性、可审计性以及实际部署价值至关重要。\n\n### § 2 前人工作与不足\n这个问题之前并未得到完全解决。在 LLMs for black-box optimization 方面，OPRO 使用文本轨迹来提出解决方案，LLAMBO 和 BOPRO 将语言模型与 BO 组件及 exploration–exploitation 控制相结合，但这些方法依赖于将 LLMs 嵌入特定搜索框架，未能学习并提取出可跨任务复用的独立策略。在 LLMs that write optimizers 方面，FunSearch、AlphaEvolve 和 LLaMEA 通过进化优化器代码来发现算法，LLaMEA-BO 将此扩展到 BBOB 基准，然而这些方法最终部署的是特定的代码实现，缺乏跨执行环境的可移植性，且未将经验蒸馏为通用的语言策略。在 Feedback-based policy improvement 方面，PromptAgent、GEPA 和 Meta-harness 等系统利用反馈进行反思、树搜索或 end-to-end harness 搜索以改进 prompt，但它们在测试结果上在线修改指令，这种做法会泄露评估信息，破坏了测试时的稳定性和可审计性。此外，AutoPDL 将自动 prompt 优化构建为结构化 AutoML 问题并生成可执行的 PDL 程序，但它缺乏从开发阶段的可执行实践中蒸馏定制策略的机制，且未在评估前进行一次性密封，无法保证 zero-shot 部署时的可审计性。这些前人工作的根本局限在于：要么将策略绑定于特定代码实现或在线反馈循环，导致泛化性和可审计性受限；要么未能建立严格的开发与评估分离机制，使得学习到的搜索行为在独立评估时无法保持 dependable。", "core_insight": "### § 3 重建作者的思考路径\n\n在低预算的 black-box optimization (BBO) 场景中，大型语言模型虽然具备解读优化历史和表达启发式策略的能力，但在缺乏外部结构时，其数值优化表现远不及 Bayesian optimization (BO) 等经典算法。早期的改进方案尝试将 LLMs 嵌入既定的搜索流程中（如 LLAMBO），但这并未让模型自身真正习得可复用的搜索策略。另一方面，基于反馈的 prompt optimization（如 OPRO）或 harness evolution 方法会根据测试结果在线调整指令，这种做法不可避免地导致了 evaluation information leakage，使得模型在独立评估时的表现难以审计且缺乏稳定性。同时，虽然 FunSearch 或 AlphaEvolve 等工作能通过代码进化发现优秀的优化器，但生成的程序代码高度依赖特定的执行环境，缺乏跨模型、跨平台的 portability。作者由此意识到，需要一种机制将“策略的发现”与“策略的部署”解耦：能否让 agent 在开发阶段通过可执行的编程实践（executable practice）自主探索并验证搜索策略，随后将这种隐含在代码和轨迹中的经验，一次性蒸馏为纯粹的自然语言文本？这种文本策略一旦在评估前冻结，不仅能避免测试时的信息泄露，还能利用语言作为通用介质，摆脱对特定代码运行时的依赖，实现跨 executor 的无缝迁移。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 是：让 agent 在开发阶段通过编写和执行优化器代码进行自我对弈，将隐性的搜索经验转化为可验证的实践记录，随后将这段实践记录一次性“蒸馏”成一段自然语言策略文本。这段被冻结的文本 prompt 在部署时指导 LLM 执行搜索，既规避了在线根据测试结果调整 prompt 带来的 evaluation leakage，又利用语言作为介质摆脱了对特定代码执行环境的依赖，从而实现了搜索策略的可靠发现与跨模型的可移植部署。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Building the Harness Automatically: Self-Play in Code Distills a Text Harness for Black-Box Optimization》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出并解决的研究问题是：在低预算的 black-box optimization 场景下，如何让 LLM agent 通过可执行的实践学习到可靠的数值搜索策略，并将其一次性蒸馏为可移植的文本 harness，从而在评估阶段冻结并稳定地提升不同 LLM executor 的优化性能。许多科学和工程任务需要在查询预算极小的情况下优化昂贵且无梯度的目标函数，这正是 Bayesian optimization (BO) 和 evolutionary strategies 的核心应用场景。尽管 LLMs 能够解释优化历史并表达搜索启发式规则，但在缺乏特定结构时，它们作为数值优化器表现极不稳定，往往远不及传统的经典优化器。现有的改进方法通常将 LLMs 嵌入到既定的搜索程序中，或者依赖在线反馈不断修改 prompt，但这不仅容易泄露评估信息，还导致测试时的行为不可审计且难以复现。因此，探索一种能够在开发阶段学习、在评估阶段冻结，且能跨模型和任务泛化的可移植策略，对于提升 LLMs 在 black-box optimization 中的可靠性、可审计性以及实际部署价值至关重要。 ### § 2 前人工作与不足 这个问题之前并未得到完全解决。在 LLMs for black-box optimization 方面，OPRO 使用文本轨迹来提出解决方案，LLAMBO 和 BOPRO 将语言模型与 BO 组件及 exploration–exploitation 控制相结合，但这些方法依赖于将 LLMs 嵌入特定搜索框架，未能学习并提取出可跨任务复用的独立策略。在 LLMs that write optimizers 方面，FunSearch、AlphaEvolve 和 LLaMEA 通过进化优化器代码来发现算法，LLaMEA-BO 将此扩展到 BBOB 基准，然而这些方法最终部署的是特定的代码实现，缺乏跨执行环境的可移植性，且未将经验蒸馏为通用的语言策略。在 Feedback-based policy improvement 方面，PromptAgen...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在低预算的 black-box optimization (BBO) 场景中，大型语言模型虽然具备解读优化历史和表达启发式策略的能力，但在缺乏外部结构时，其数值优化表现远不及 Bayesian optimization (BO) 等经典算法。早期的改进方案尝试将 LLMs 嵌入既定的搜索流程中（如 LLAMBO），但这并未让模型自身真正习得可复用的搜索策略。另一方面，基于反馈的 prompt optimization（如 OPRO）或 harness evolution 方法会根据测试结果在线调整指令，这种做法不可避免地导致了 evaluation information leakage，使得模型在独立评估时的表现难以审计且缺乏稳定性。同时，虽然 FunSearch 或 AlphaEvolve 等工作能通过代码进化发现优秀的优化器，但生成的程序代码高度依赖特定的执行环境，缺乏跨模型、跨平台的 portability。作者由此意识到，需要一种机制将“策略的发现”与“策略的部署”解耦：能否让 agent 在开发阶段通过可执行的编程实践（executable practice）自主探索并验证搜索策略，随后将这种隐含在代码和轨迹中的经验，一次性蒸馏为纯粹的自然语言文本？这种文本策略一旦在评估前冻结，不仅能避免测试时的信息泄露，还能利用语言作为通用介质，摆脱对特定代码运行时的依赖，实现跨 executor 的无缝迁移。 ### § 4 核心 Intuition 这篇论文的核心 Intuition 是：让 agent 在开发阶段通过编写和执行优化器代码进行自我对弈，将隐性的搜索经验转化为可验证的实践记录，随后将这段实践记录一次性“蒸馏”成一段自然语言策略文本。这段被冻结的文本 prompt 在部署时指导 LLM 执行搜索，既规避了在线根据测试结果调整 prompt 带来的 evaluation leakage，又利用语言作为介质摆脱了对特定代码执行环境的依赖，从而实现了搜索策略的可靠发现与跨模型的可移植部署。 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：1–19 ## **Building the Harness Automatically: Self-Play in Code Distills a Text Harness for Black-Box Optimization** **Yi Wu** _[∗]_ **Zheng Ren** _[∗]_ **Zhiyu Hu Haochen Wang Daryl Chang Li Wei Ting Wang Zhen Li Pooja Gupta Nitin Jindal Lukasz Heldt** _Google Mountain View, USA_ wuyish@google.com murphyren@google.com harryhu@google.com haochenww@google.com dlchang@google.com liwei@google.com tingwa@google.com zhenlizh@google.com poojagupta@google.com nitinjindal@google.com heldt@google.com ## **Abstract** Can an agent learn a numerical search strategy through executable practice and then transfer that strategy as text? We study low-budget black-box optimization, where unaided language models remain well below strong classical optimizers. During development, an agent repeatedly writes and evaluates optimizer programs. It then distills the resulting program and practice record once into...", "additional_insights": "### § 8 Take-aways\n本文提出了一种 practice–gate–distill–freeze 框架，通过让 LLM agent 在开发阶段反复编写和执行 optimizer 代码进行 self-play，将其习得的数值搜索策略一次性 distill 为一段不到 200 词的纯文本 harness，并在评估前彻底 freeze。这段 frozen text harness 在 low-budget black-box optimization 中显著降低了 Gemini Flash 的 simple regret（降幅达 48%），使其性能逼近经典的 GP-BO，且在未参与训练的 BBOB landscapes 上同样表现出色。该文本策略展现出强大的 portability，无需修改即可跨不同 LLM executor（如 Gemini Flash-Lite、Claude Sonnet）转移并持续降低 regret。独立的端到端 replication 产生了完全不同的代码和文本（Harness B），但达到了相同的性能层级，证明 executable practice 提取的是一种可泛化的 search policy 而非特定代码实现。在 YouTube reward-tuning 的 sealed production benchmark 上，该方法同样取得了最低的 regret point estimate，验证了其在真实工程场景中的实用价值。\n\n### § 9 最脆弱的假设\n本文最核心且失败代价最大的假设是：**distillation 过程能够将 executable practice 中学到的复杂 search policy 完整且无损地压缩进一段简短的纯文本中，且该文本能被不同的 LLM executor 等效解析与执行。** 如果这个假设不成立，那么所谓的“portable medium”就只是一层脆弱的语义包装，而非真正的策略载体。在实际中，LLM 在 practice 阶段依赖代码执行环境进行了精确的数值计算、状态追踪与边界检查，而 distill 出的文本（如 Harness A）仅包含抽象的经济学与探测原则（如“probe independent directions”）。不同架构或能力的 LLM 在将这些自然语言指令转化为实际数值操作时，极有可能产生语义偏移或执行偏差，导致策略失效。论文提供的证据存在明显缺口：虽然展示了跨模型 transfer 的结果，但 Table 1 和 Table 10 均显示，原始的 retained program（代码实现）的 mean regret 始终低于 distilled text harness（例如在 quadratic 上 17.1 vs 32.9）。这直接暗示 distillation 过程存在显著的信息损失。如果面对更复杂的高维任务或非凸 landscape，纯文本指令可能无法提供足够的执行精度，导致核心贡献的 performance tier 直接崩塌。\n\n### § 10 最小复现实验\n在 1 周时间内，可设计一个最小复现实验来验证“frozen text harness 能跨 executor 转移并提升 low-budget BBO 性能”这一核心 claim。数据方面，选取 BBOB 基准中的 Bent Cigar 或 Rastrigin 函数，设定维度 $D=8$，query budget $B=20$。实现方面，直接使用论文 Appendix B 中公开的 197-word Harness A 文本，构建一个 stateless 的 LLM-based optimization loop：将历史评估点和剩余 budget 格式化为 prompt，让 LLM 输出下一个查询点。选取两个能力差异明显的 LLM executor（例如 Gemini Flash 和 Claude Haiku），分别运行 Base LLM（无 harness）和 LLM + Harness A 两个 arm。测量指标为 20 次评估后的 final simple regret，每个配置运行 $N=30$ 个 paired instances。如果 Harness A 在两个 executor 上的 mean regret 均显著低于对应的 Base arm（例如通过 paired Wilcoxon test 检验 $p \u003C 0.05$），则支持该 claim；如果 Harness A 仅在特定模型上有效，或在弱模型上导致 regret 不降反升（类似论文中 manual hint 损害 Flash-Lite 的现象），则反驳了文本策略的 portability 与通用有效性假设。", "research_value": "### § 11 最强反例设计\n要对该论文的核心 claim 进行最有力的攻击，我会设计一个实验来证明：**所谓的 distilled text harness 并非真正承载了可泛化的 search policy，而仅仅是一种针对特定 landscape 结构的 prompt priming，且这种 priming 在遇到与 practice 阶段几何特性相悖的 landscape 时会引发灾难性的负迁移。** 具体的替代解释是：LLM 在 practice 阶段并未学到通用的数值搜索逻辑，而是过拟合了 BBOB 基准中常见的局部凸性或坐标独立性，distill 出的文本（如“probe independent directions”）本质上是一个强 bias 的先验。当这个先验与真实任务的 landscape 几何不匹配时，frozen text harness 会锁死 LLM 的探索方向，使其表现甚至不如无任何 instruction 的 Base LLM。实验设计如下：选取两类极端的 held-out 测试函数，一类是高度旋转且坐标强耦合的 Ellipsoid 或 Rotated Rastrigin 函数（破坏“probe independent directions”的前提），另一类是具有极深欺骗性局部最优的 Ackley 函数。在这两类函数上（设定 $D=8$, $B=20$），分别对比 Base LLM、LLM + Harness A，以及一个由人类专家针对该特定函数手写的 manual hint。如果 Harness A 在这些非标准 landscape 上的 simple regret 显著劣于 Base LLM，且其失败模式表现为机械地重复正交探测而忽略全局梯度方向，则直接证伪了文本策略的泛化性与 portability 假设。这表明 distillation 不仅造成了信息损失，还固化了错误的归纳偏置，所谓的 portable medium 实际上是阻碍 LLM 动态适应的语义枷锁。\n\n### § 12 Follow-up Research Idea\n基于 distillation 过程存在信息损失与语义偏移这一核心局限，我提出一个非增量的 novel research idea：**将 black-box optimization 中的策略蒸馏从“自然语言文本”转变为“可验证的形式化约束”，建立一种 Neurosymbolic Self-Play 框架。** 驱动这个想法的未满足需求是：纯文本 harness 依赖 LLM 的语义解析来执行连续的数值操作，这种 medium 在跨模型转移时极其脆弱，且无法保证执行精度；而直接部署代码又缺乏跨环境的可移植性与可审计性。我们可以借鉴形式化验证与程序合成领域的 SMT (Satisfiability Modulo Theories) solver 技术，将 LLM agent 在 practice 阶段习得的搜索策略提取为一组与执行环境无关的 logical invariants 和 operational constraints（例如：“若连续两次查询的 reward 下降超过阈值 $\\delta$，则下一次查询方向必须与当前最优解的梯度估计正交”）。在评估阶段，LLM executor 提出下一个查询点时，必须通过一个轻量级、环境无关的 symbolic checker 验证其是否符合这些 frozen constraints；若不符合，则触发 LLM 重新生成。第一个实验将构建一个对比评估：在高度非凸且高维的 BBOB 函数上，比较 Base LLM、LLM + Text Harness A（本文方法）以及 LLM + Formal Constraint Harness。重点测量跨不同 LLM executor（如 Gemini Flash 与 Claude Haiku）转移时的 performance variance。如果新方法能将跨模型的 regret variance 显著降低至接近零，且在复杂 landscape 上的绝对性能超越 retained program，则证明形式化符号而非自然语言才是承载和部署 search policy 的可靠且 portable medium。这一提议彻底区别于现有的 FunSearch（生成特定代码）或本文（生成文本），它将策略的“语义表达”与“执行验证”解耦，开辟了将 LLM 启发式策略转化为可证明逻辑约束的新方向。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yi Wu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Zheng Ren\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Zhiyu Hu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Haochen Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Daryl Chang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Li Wei\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ting Wang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Zhen Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Pooja Gupta\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Nitin Jindal\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Lukasz Heldt\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Google\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution to the work.\"}\n  ]\n}\n```", "summary_translation": "agent 能否通过 executable practice 学习数值搜索策略，然后以文本形式迁移该策略？我们研究了低预算 black-box optimization，其中无辅助的 language models 仍然远低于强大的经典 optimizers。在开发阶段，agent 反复编写和评估 optimizer programs。然后，它将生成的程序和实践记录一次性提炼成一个 197 词的主要 Harness A，该 Harness A 在评估前被冻结。在一项独立的 $N=30$ 研究中 ($p\u003C.001$)，Harness A 将 Gemini Flash 的 regret 降低了 48%，在 practice family 上进入了 GP-BO 的性能范围，并在所有三个留出的 BBOB landscapes 上降低了平均 regret。相同的文本改善了所有受测的 Gemini executor，并迁移到 Claude Sonnet，将 regret 降低了 43% 和 49% ($p\\leq.005$)。一项独立的端到端复现产生了 Harness B，这是一个处于相同性能层级的不同程序和文本。相同的框架在一个封存的 YouTube reward-tuning production benchmark 上也获得了最低的 regret。因此，executable practice 是发现 search policy 的一种可行方法，而语言是部署它的可移植媒介。"}]}, {"name": "Research Agents \u0026 Evaluation", "count": 3, "papers": [{"title": "Benchmarking Hybrid Deep Research Across Database Querying and Web Search", "arxiv_id": "2609.09410", "authors": "Ruofan Wu, Peiran Xu, Xiaolong Li, Fan Shu, Soyoung Yoon, Yite Wang, Xiaodong Yu, Boyi Liu, Feng Yan, Debiao Li, Yuxiong He, Zhewei Yao", "summary": "While autonomous agents have made significant strides in \"deep research\" by iteratively navigating the open web to synthesize information, real-world problem-solving is rarely confined to a single environment. Complex analytical tasks inherently require agents to weave together evidence from both ambiguous unstructured text (e.g., the open web) and highly precise structured data (e.g., relational databases). However, existing benchmarks evaluate these modalities in isolation, failing to capture the critical \"handoff\" - the ability to preserve constraints when moving evidence between systems. We introduce HybridDeepResearch, to our knowledge the first deep-research benchmark that requires both web search and SQL to form a complete, verifiable answer. The benchmark contains 380 tool-dependent tasks grounded in LiveSQLBench-Base-Lite databases and public web corpora, validated through automated checks and human review, and covering three reasoning patterns: SQL2S, S2SQL, and Parallel. Evaluations across proprietary and open-weight models under various agentic scaffolds reveal that even state-of-the-art models like GLM-5.2, Claude-Sonnet-4.6 and GPT-5 achieve only about 50-54% Pass@8 on the hard subset. Notably, results show that directional reasoning is substantially more difficult than parallel intersection, highlighting that bridging structured and unstructured information spaces without losing constraints remains a major open challenge for agentic systems. Code and datasets are publicly available at GitHub (https://github.com/Snowflake-AI-Research/HybridDeepResearch) and Hugging Face (https://huggingface.co/datasets/Snowflake/HybridDeepResearch).", "category": "cs.CL", "cluster": "Research Agents \u0026 Evaluation", "tags": ["cs.CL"], "filter_reason": "这篇论文的核心贡献是提出了一个名为 HybridDeepResearch 的新基准，用于评估 LLM 智能体在混合环境（开放网络搜索和关系型数据库 SQL 查询）中进行深度研究的能力。论文的研究对象明确是自主智能体和工具使用智能体，评估它们在不同信息源之间传递证据并保持约束不丢失的能力。\n\n根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents / Multi-Agent LLMs，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。” 该论文通过评估不同智能体框架下的最先进模型，揭示了智能体在桥接结构化与非结构化信息空间时面临的重大挑战，这属于典型的失败机制诊断和行为分析，直接有助于理解和改进智能体的工具使用与规划能力。同时，重要校准中也明确指出不应仅因为论文是 benchmark 或 evaluation 就排除。因此，该论文符合您的核心研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心问题是：当 autonomous agents 需要同时跨越结构化数据环境（如 relational databases）和非结构化信息环境（如 open web）进行证据整合时，它们在系统间传递证据的过程中会频繁丢失约束，导致跨模态协调失败。作者将这一关键失败模式命名为 \"handoff\"——即当证据必须在不同系统间转移、交叉验证和校验时，agent 往往无法保持先前步骤中确立的语义约束。这一问题之所以重要，是因为现实世界中的高风险分析任务——如金融审计、供应链风险评估和科学研究——本质上依赖于整合异构数据源，而非在单一环境中运作。然而，现有的评测体系将 web search 和 SQL querying 两种模态隔离评估，使得这一跨模态协调瓶颈从未被系统暴露和量化。为填补这一缺口，作者引入了 HybridDeepResearch，这是首个同时要求 web search 和 SQL 才能形成完整可验证答案的 deep-research benchmark，包含 380 个 tool-dependent tasks，覆盖三种 reasoning patterns：SQL2S（数据库结果约束后续 web 搜索）、S2SQL（web 搜索发现的实体或条件约束后续 SQL 查询）和 Parallel（两种工具独立产生候选集后取交集）。解决这一问题的价值在于：它为 agentic systems 提供了一个精确的诊断工具，揭示了即使是最先进的模型（如 GPT-5、Claude-Sonnet-4.6）在 directional handoff 任务上的 Pass@8 也仅约 50–54%，从而将 cross-tool consistency 确立为 deep-research agents 的关键未解挑战。\n\n### § 2 前人工作与不足\n\n该问题之前未被系统解决，根本原因在于评测领域本身的高度分割。Deep-research benchmarks 如 BrowseComp（Wei et al., 2025）、DeepResearcher（Zheng et al., 2025）和 WebWalker（Wu et al., 2025）专注于需要迭代 web search 和多步推理的复杂问题，但仅评估单一模态——open web 上的非结构化信息检索与综合，未将 database querying 纳入研究流程。Database-agent benchmarks 从早期的 Spider（Yu et al., 2018）、BIRD-SQL（Li et al., 2023）发展到 Spider 2.0（Lei et al., 2025）、BIRD-Interact（Huo et al., 2026）和 LiveSQLBench（Team, 2025），逐步扩展到 contextual queries、enterprise workflows 和 dynamic interactions，但始终假设所需证据已包含在预定义的数据库及固定辅助材料中，不考虑需要从 open web 发现额外证据的场景。Hybrid QA benchmarks 如 HybridQA（Chen et al., 2020b）、TAT-QA（Zhu et al., 2021）和 CompMix（Christmann et al., 2024）虽然结合了表格与文本证据，但假设相关 tables 和 passages 已预先收集完毕，不要求 agent 主动通过 open web search 发现证据，也不评估 executable SQL querying 与 web search 之间不同依赖结构下的协调能力。近期工作如 DataSTORM（Liu et al., 2026）虽结合了 internet research 与 large-scale database exploration，但聚焦于 thesis-driven 的分析报告生成，而非 answer-oriented 的精确评测。这些不足并非简单的疏忽，而是因为 text-to-SQL 和 web browsing 两个研究社区各自独立发展，导致跨模态 handoff 的失败模式——如 SQL2S 中的 \"salience trap\"（agent 通过 SQL 正确找到实体后发出泛化 web 搜索而误返回无关结果）、S2SQL 中的 \"dropping the anchor\"（agent 从文本中正确识别实体但未将其转化为 SQL predicate）以及 Parallel 中的 \"premature fusion\"（agent 仅基于单一来源返回候选而未做交集校验）——从未被清楚定义为可评测的能力维度。HybridDeepResearch 通过三种 reasoning patterns 和 \"hybrid lock\" 机制（对每个问题执行 single-tool ablation 以确保两种工具均为必需）精确填补了这一评测缺口。", "core_insight": "### § 3 重建作者的思考路径\n\n在大型语言模型（LLM）展现出强大的单模态推理能力之后，研究者们很快注意到现实世界中的复杂分析任务往往需要跨越结构化数据（如 relational databases）和非结构化文本（如 open web）。现有的评估体系，无论是针对 text-to-SQL 的 Spider 和 BIRD，还是针对 web navigation 的 BrowseComp，都在各自的领域内孤立地衡量 agent 的能力。然而，当真正尝试让 agent 结合这两种模态时，一个明显的经验观察浮现出来：agent 在跨系统传递证据时极易丢失约束条件。例如，agent 可能通过 SQL 正确找到了某个实体，但在随后的 web search 中却偏离了该实体，或者从网络中提取了正确的条件却未能将其转化为 SQL 的 predicate。这种跨模态的“handoff”失败模式在先前的 benchmark 中完全不可见，因为它们没有强制要求工具间的依赖关系。\n\n早期的 hybrid QA 任务（如 HybridQA 和 Tat-QA）虽然尝试结合表格与文本，但它们通常假设所有相关证据已被预先收集并静态地提供给模型，这无法评估 agent 在动态环境中自主发现和协调证据的能力。为了填补这一空白，作者需要设计一种能够强制 agent 在 web search 和 SQL execution 之间传递和验证约束的评估框架。通过分析信息流的方向性，作者自然推导出了三种基本的跨模态依赖结构：SQL2S（数据库结果约束网络搜索）、S2SQL（网络搜索结果约束数据库查询）以及 Parallel（两者独立产出后取交集）。为了确保这些任务真正依赖于两种模态的协同，而非单模态的捷径，作者引入了“hybrid lock”机制，通过单工具消融实验剔除所有可被单一模态解决的问题。这一思考路径从对现实复杂需求的观察到对现有评估缺陷的反思，再到对跨模态信息流模式的抽象，最终导向了 HybridDeepResearch 的构建。\n\n### § 4 核心 Intuition\n\n先前方法在单模态任务上表现优异却在跨模态组合时崩溃，根本原因在于它们没有机制来强制 agent 在不同工具间保持和转换语义约束。这篇论文的核心 Intuition 是：通过设计具有严格信息流依赖（SQL2S, S2SQL, Parallel）的混合任务，并施加“hybrid lock”确保单工具绝对无法解题，可以精确诊断并暴露 agent 在跨模态“handoff”过程中丢失或扭曲约束的脆弱性。这种设计将隐藏在单模态高分背后的协调失败转化为可量化、可复现的评估指标，从而揭示了当前 agent 在跨结构化与非结构化信息空间整合时的根本瓶颈。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Benchmarking Hybrid Deep Research Across Database Querying and Web Search》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出的核心问题是：当 autonomous agents 需要同时跨越结构化数据环境（如 relational databases）和非结构化信息环境（如 open web）进行证据整合时，它们在系统间传递证据的过程中会频繁丢失约束，导致跨模态协调失败。作者将这一关键失败模式命名为 \"handoff\"——即当证据必须在不同系统间转移、交叉验证和校验时，agent 往往无法保持先前步骤中确立的语义约束。这一问题之所以重要，是因为现实世界中的高风险分析任务——如金融审计、供应链风险评估和科学研究——本质上依赖于整合异构数据源，而非在单一环境中运作。然而，现有的评测体系将 web search 和 SQL querying 两种模态隔离评估，使得这一跨模态协调瓶颈从未被系统暴露和量化。为填补这一缺口，作者引入了 HybridDeepResearch，这是首个同时要求 web search 和 SQL 才能形成完整可验证答案的 deep-research benchmark，包含 380 个 tool-dependent tasks，覆盖三种 reasoning patterns：SQL2S（数据库结果约束后续 web 搜索）、S2SQL（web 搜索发现的实体或条件约束后续 SQL 查询）和 Parallel（两种工具独立产生候选集后取交集）。解决这一问题的价值在于：它为 agentic systems 提供了一个精确的诊断工具，揭示了即使是最先进的模型（如 GPT-5、Claude-Sonnet-4.6）在 directional handoff 任务上的 Pass@8 也仅约 50–54%，从而将 cross-tool consistency 确立为 deep-research agents 的关键未解挑战。 ### § 2 前人工作与不足 该问题之前未被系统解决，根本原因在于评测领域本身的高度分割。Deep-research benchmarks 如 BrowseComp（Wei et al., 2025）、DeepResearch...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在大型语言模型（LLM）展现出强大的单模态推理能力之后，研究者们很快注意到现实世界中的复杂分析任务往往需要跨越结构化数据（如 relational databases）和非结构化文本（如 open web）。现有的评估体系，无论是针对 text-to-SQL 的 Spider 和 BIRD，还是针对 web navigation 的 BrowseComp，都在各自的领域内孤立地衡量 agent 的能力。然而，当真正尝试让 agent 结合这两种模态时，一个明显的经验观察浮现出来：agent 在跨系统传递证据时极易丢失约束条件。例如，agent 可能通过 SQL 正确找到了某个实体，但在随后的 web search 中却偏离了该实体，或者从网络中提取了正确的条件却未能将其转化为 SQL 的 predicate。这种跨模态的“handoff”失败模式在先前的 benchmark 中完全不可见，因为它们没有强制要求工具间的依赖关系。 早期的 hybrid QA 任务（如 HybridQA 和 Tat-QA）虽然尝试结合表格与文本，但它们通常假设所有相关证据已被预先收集并静态地提供给模型，这无法评估 agent 在动态环境中自主发现和协调证据的能力。为了填补这一空白，作者需要设计一种能够强制 agent 在 web search 和 SQL execution 之间传递和验证约束的评估框架。通过分析信息流的方向性，作者自然推导出了三种基本的跨模态依赖结构：SQL2S（数据库结果约束网络搜索）、S2SQL（网络搜索结果约束数据库查询）以及 Parallel（两者独立产出后取交集）。为了确保这些任务真正依赖于两种模态的协同，而非单模态的捷径，作者引入了“hybrid lock”机制，通过单工具消融实验剔除所有可被单一模态解决的问题。这一思考路径从对现实复杂需求的观察到对现有评估缺陷的反思，再到对跨模态信息流模式的抽象，最终导向了 HybridDeepResearch 的构建。 ### § 4 核心 Intuition 先前方法在单模态任务上表现优... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **Benchmarking Hybrid Deep Research Across Database Querying and Web Search** **Ruofan Wu**[1][*] **Peiran Xu**[2*] **Xiaolong Li**[3*] **Fan Shu**[1*] **Soyoung Yoon**[4] **Yite Wang**[5][†] **Xiaodong Yu**[5†] **Boyi Liu**[5] **Feng Yan**[1] **Debiao Li**[2] **Yuxiong He**[5] **Zhewei Yao**[5] 1University of Houston 2University of California, Los Angeles 3The University of Hong Kong 4Seoul National University 5Snowflake AI Research ## **Abstract** While autonomous agents have made significant strides in “deep research” by iteratively navigating the open web to synthesize information, real-world problem-solving is rarely confined to a single environment. Complex analytical tasks inherently require agents to weave together evidence from both ambiguous unstructured text (e.g., the open web) and highly precise structured data (e.g., relational databases). However, existing benchmarks eva...", "additional_insights": "### § 8 Take-aways\n\nHybridDeepResearch 是首个同时要求 web search 与 SQL query 才能完成可验证答案的 deep-research benchmark，填补了此前 text-to-SQL 与 web browsing 评估各自孤立、无法测量跨模态 \"handoff\" 能力的空白。benchmark 包含 380 个 tool-dependent 任务，覆盖三种推理模式：SQL2S（数据库结果约束后续 web 搜索）、S2SQL（web 搜索发现的实体转化为 SQL predicate）、Parallel（两模态独立产出候选集后取交集），并从中精选 120 题的 balanced hard subset。实验揭示即使 GPT-5、Claude-Sonnet-4.6 等前沿模型在 hard subset 上也仅达 50–54% Pass@8，整体 Avg@8 低于 30%，且方向性推理（SQL2S 与 S2SQL）的难度显著高于 Parallel 交集，表明跨模态约束保持是当前 agentic system 的核心瓶颈。多智能体框架 MiroFlow 相比单智能体 smolagents 能提升 Pass@8（因额外 worker 可恢复早期遗漏的约束），但 Avg@8 基本不变，且 timeout 率从 16.7% 飙升至 41.3%，说明更广的探索并未带来可靠性的实质改善。GLM-5.2 在 open-weight 模型中表现最强，在 MiroFlow 下达到 75.79 Pass@8，但 S2SQL 仍仅 62.07，与 Parallel 的 93.28 形成鲜明对比。论文识别出三类典型失败模式：Parallel 中的 incomplete intersection（仅返回单一来源支持的候选）、SQL2S 中的 search drift（正确 SQL 结果在后续搜索中约束丢失）、S2SQL 中的 entity-level handoff 成功但 SQL 操作或公式错误。\n\n### § 9 最脆弱的假设\n\n整个 benchmark 的核心价值建立在 \"Hybrid Lock\" 假设上：每个问题确实需要同时使用 web search 和 SQL 才能解决，无法通过单一模态绕过。论文通过 single-tool ablation 来验证这一点——让一个 evaluator agent 分别尝试仅用 web search 或仅用 SQL 解决每个问题，能被单模态解决的即被丢弃。然而这个假设的脆弱性在于：ablation 的有效性完全依赖于执行 ablation 的 agent 的能力上限。论文使用的 evaluator agent 的推理能力、参数记忆和搜索策略是有限的，更强的模型可能通过 parametric memory 直接回答 search 子问题（尤其是当答案实体如 \"Monaco\" 或 \"Bhutan\" 在预训练语料中高度 salient 时），或通过更精细的 SQL 探索在数据库中偶然发现答案。论文在 Section 4.3 中也承认 hybrid lock 是 \"under the evaluated settings\" 成立的，暗示其并非绝对保证。论文缺少的关键证据是：对 hybrid lock 的鲁棒性测试——例如用多个不同能力层级的模型执行 ablation，或测量 gold answer 在预训练语料中的 salience 分布，以量化 parametric leakage 的风险。如果未来更强的模型能通过单一模态解决相当比例的 \"hybrid\" 问题，那么这个 benchmark 测量的就不再是跨模态协调能力，而退化为普通的 text-to-SQL 或 web QA 任务，三种推理模式的性能差异也将失去诊断意义。\n\n### § 10 最小复现实验\n\n在一周时间内，最可行的最小复现是验证论文最核心的 empirical claim：方向性推理（SQL2S 和 S2SQL）显著难于 Parallel 交集。使用论文公开的 balanced hard subset（120 题，每类型 40 题），选取一个中等规模开源模型如 Qwen3.5-27B，在 smolagents 框架下搭配 Corpus Search 后端运行，每题执行 8 次独立 trial。测量三种类型各自的 Pass@8 和 Avg@8。如果 SQL2S 和 S2SQL 的 Pass@8 明显低于 Parallel（论文中 Qwen3.5-397B 在 hard subset 上的差距为 SQL2S 15% vs Parallel 57.5%），则支持方向性 handoff 更难的 claim；如果三者性能接近或 Parallel 反而更难，则反驳该 claim。这个方案无需复现整个 construction pipeline，只需使用已发布的 benchmark 数据和开源框架，计算资源需求可控（27B 模型单卡可运行），且能直接检验论文最关键的发现——跨模态约束传递是 agentic system 的主要瓶颈。", "research_value": "### § 11 最强反例设计\n\n对这篇论文最有力的攻击应针对其核心 empirical claim——即方向性推理（SQL2S 和 S2SQL）的失败主要源于 agent 的跨模态约束保持能力不足。我设计了一个基于 Tool Affordance Bias 的替代解释实验：论证方向性 handoff 的性能崩塌并非源于 agent 的认知或协调缺陷，而是由 SQL（精确符号系统）与 Web Search（模糊检索系统）之间固有的信息粒度不对称所导致的必然信息损失。具体实验设计为：招募人类领域专家与 SOTA agent 在相同的 HybridDeepResearch hard subset 上进行对照测试，并引入一个 \"Granularity-Matched Oracle\" 条件——在该条件下，web search 的返回结果被预处理为结构化的事实卡片（消除文本歧义），SQL 的返回结果被转化为自然语言摘要（消除符号刚性）。如果人类专家在原始任务上的 S2SQL 失败率也显著高于 Parallel，且在 Granularity-Matched Oracle 条件下人类与机器的性能差距急剧缩小，那么论文所声称的 \"cross-tool consistency 是未解挑战\" 这一结论将被大幅削弱。这将证明方向性推理的困难主要在于异构工具接口的表征摩擦，而非 agent 内部的约束传递机制存在根本性缺陷，从而将研究焦点从 agentic reasoning 转向 tool interface standardization。\n\n### § 12 Follow-up Research Idea\n\n当前方法的核心局限在于将跨模态 handoff 视为一个黑盒式的端到端过程，仅在最终答案层面衡量约束是否丢失，而未深入探究 agent 内部表征在工具切换瞬间究竟发生了何种语义形变。这一局限驱动了一个全新的研究方向：Cross-Modal Representation Probing，即通过 mechanistic interpretability 技术对 agent 在 handoff 节点的 latent space 动态进行因果干预与诊断。该提议借鉴了 mechanistic interpretability 领域的 activation patching 与 sparse autoencoders (SAEs) 技术，将目标从 \"提升端到端任务准确率\" 转移到 \"定位并修复导致约束丢失的内部电路\"。\n\n具体而言，不再依赖 multi-agent 框架或 prompt engineering 来外挂补救措施，而是直接探测 LLM 在执行 S2SQL 任务时的内部状态：当 agent 从 web snippet 中识别出关键实体后，使用 SAEs 提取该实体在 residual stream 中的 feature representation；随后在 agent 生成 SQL predicate 的步骤中，监测该 feature 的 activation 强度。如果观察到 activation 在 SQL generation 阶段发生 decay（即 \"dropping the anchor\" 失败模式的内部表征），则可以通过 activation patching 强行将上一阶段的 feature representation 注入当前生成步骤，测试是否能因果性地挽救约束。第一个实验将选取一个开源 SOTA 模型（如 Llama-4-70B），在 HybridDeepResearch 的 S2SQL 子集上训练针对 \"entity constraint\" 的 SAE probe，对比成功与失败 handoff 的 probe activation 轨迹，并验证人工干预 activation 是否能将失败案例的 Pass@1 提升 20% 以上。这与现有的 agentic benchmark 工作完全不同：它不评估 agent 的外在行为，而是打开黑盒，将跨模态协调问题转化为一个可定位、可干预的神经计算问题，为解决 handoff 失败提供了一条绕过脆弱 prompt 策略的底层路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "{\n  \"authors\": [\n    {\"name\": \"Ruofan Wu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Peiran Xu\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Xiaolong Li\", \"affiliations\": [3], \"markers\": [\"*\"]},\n    {\"name\": \"Fan Shu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Soyoung Yoon\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Yite Wang\", \"affiliations\": [5], \"markers\": [\"†\"]},\n    {\"name\": \"Xiaodong Yu\", \"affiliations\": [5], \"markers\": [\"†\"]},\n    {\"name\": \"Boyi Liu\", \"affiliations\": [5], \"markers\": []},\n    {\"name\": \"Feng Yan\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Debiao Li\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yuxiong He\", \"affiliations\": [5], \"markers\": []},\n    {\"name\": \"Zhewei Yao\", \"affiliations\": [5], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"University of Houston\"},\n    {\"id\": 2, \"name\": \"UCLA\"},\n    {\"id\": 3, \"name\": \"HKU\"},\n    {\"id\": 4, \"name\": \"SNU\"},\n    {\"id\": 5, \"name\": \"Snowflake AI Research\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution.\"},\n    {\"marker\": \"†\", \"text\": \"Project lead.\"}\n  ]\n}", "summary_translation": "尽管 autonomous agents 通过迭代浏览开放网络来综合信息，在“deep research”方面取得了重大进展，但现实世界中的问题解决很少局限于单一环境。复杂的分析任务本质上要求 agents 将来自模糊的非结构化文本（例如，开放网络）和高度精确的结构化数据（例如，relational databases）的证据整合在一起。然而，现有的 benchmarks 孤立地评估这些模态，未能捕捉到关键的“handoff”——即在系统之间转移证据时保留约束的能力。我们引入了 HybridDeepResearch，据我们所知，这是第一个需要同时使用 web search 和 SQL 才能形成完整、可验证答案的 deep-research benchmark。该 benchmark 包含 380 个 tool-dependent tasks，这些任务基于 LiveSQLBench-Base-Lite databases 和 public web corpora，通过 automated checks 和 human review 进行验证，并涵盖三种 reasoning patterns：SQL2S、S2SQL 和 Parallel。在各种 agentic scaffolds 下对 proprietary 和 open-weight models 的评估表明，即使是 GLM-5.2、Claude-Sonnet-4.6 和 GPT-5 等 state-of-the-art models，在 hard subset 上也仅达到约 50-54% 的 Pass@8。值得注意的是，结果表明 directional reasoning 比 parallel intersection 困难得多，这突显了在不丢失约束的情况下桥接结构化和非结构化信息空间仍然是 agentic systems 面临的一项重大开放挑战。Code 和 datasets 已在 GitHub (https://github.com/Snowflake-AI-Research/HybridDeepResearch) 和 Hugging Face (https://huggingface.co/datasets/Snowflake/HybridDeepResearch) 上公开。"}, {"title": "RAP: Research Attention Prediction Reveals Target-Conditioned Evidence Acquisition Biases", "arxiv_id": "2609.10092", "authors": "Yingqian Wu, Jingcong Liang, Siyuan Wang, Zhenfei Yin, Philip Torr, Junchi Yu, Zhongyu Wei", "summary": "Large language models (LLMs) increasingly act as research agents, yet their ability to track shifts in research attention is difficult to evaluate because reviews and research ideas lack uniquely verifiable outcomes. We introduce Research Attention Prediction (RAP), a rolling benchmark covering 278 AI/ML fields and 1,390 episodes. At each cut-off, an LLM agent searches a temporally restricted arXiv corpus and predicts the next six months' paper shares across eight frozen research directions. Search generally helps, but all four diagnostic models perform worse than an exact-count exponentially weighted moving average (EWMA) baseline in compositional accuracy. We identify two linked bottlenecks. Under cumulative-history access, State carry-forward outperforms direct Forecast for all four diagnostic models; frozen-evidence replay links a shared component of this reversal to Forecast-oriented policies retrieving a smaller share of recent evidence. Even with exact historical activity, future-specific updating remains limited, with only GPT-5.5 plus reopened Search slightly surpassing EWMA. Fine-tuning on realised outcomes improves Qwen3-4B's forecast Spearman correlation by 0.105 on held-out fields at later origins, with gains also on change-rich episodes.", "category": "cs.CL", "cluster": "Research Agents \u0026 Evaluation", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-36 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一个名为 RAP (Research Attention Prediction) 的评估基准，用于评估 LLM 作为研究智能体在搜索受限语料库并预测未来研究趋势方面的能力。论文不仅构建了评估环境，还深入诊断了智能体在获取证据和更新状态时的行为瓶颈（如 State carry-forward 与 direct Forecast 的差异），并验证了通过在已实现结果上进行微调可以提升智能体的预测能力。这完全符合筛选标准第一步中“如果论文的研究对象明确是 LLM Agents / Tool-Use Agents，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留”的规定。同时，根据重要校准，不应仅因为论文是 benchmark 或 behavior analysis 就排除。因此，该论文与理解、评估和改进 LLM 智能体能力的研究目标强相关。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心问题是：**LLM agents 能否基于过去的科学记录，预测未来一段时间内研究注意力在各研究方向上的分布？** 具体而言，给定一个研究领域和截止时间 $T$，agent 需要在仅能检索 $T$ 之前文献的条件下，预测未来六个月内该领域各方向上 arXiv 论文的份额分布（一个八维 simplex 向量）。这一问题的重要性源于 LLMs 正从 chatbots 向 research assistants 演进，而有效的科研助手不仅需要回顾性总结已有文献，还需前瞻性地追踪研究注意力的演变——识别新兴主题、优先支持科学探索、辅助研究规划均依赖于对当前研究格局的理解和对未来研究投入方向的预判。然而，现有评测体系在这一能力维度上存在结构性缺口：retrospective tasks 只验证已发表工作的综合质量，无法证明模型推断的领域状态在特定时间点是定量准确的；prospective benchmarks 则聚焦于单篇论文的影响力、特定科学事件或概念链接预测，而非在固定方向体系上反复进行的、联合归一化的活动分布预测。RAP 通过将\"预测未来研究注意力分布\"转化为一个 rolling、outcome-grounded 的分布预测问题，填补了这一评测空白，同时为诊断 agents 在 evidence acquisition、state recovery 和 future-specific updating 三个环节的能力边界提供了可分解的实验框架。\n\n### § 2 前人工作与不足\n\n该问题此前未被直接解决。最相关的 prior work 可分为三类。第一类是 **retrospective literature synthesis** 系统，包括 retrieval-grounded 综述生成（Asai et al. 2026; Skarlinski et al. 2024）和自动化 survey 写作（Wang et al. 2024b; Yan et al. 2025; Bao et al. 2025）。这些系统能从数百篇论文中生成流畅的综合报告，但评测聚焦于最终文本产物的质量，而非模型对领域状态推断的定量准确性——一个流畅的 survey 并不证明其内部推断的各方向活跃度在特定 cut-off 是准确的。第二类是 **outcome-grounded scientific forecasting** benchmarks。Science4Cast (Krenn et al. 2023) 预测科学知识图谱中概念间的未来链接，输出的是单个 link score/rank 而非领域级的联合分布；PreScience (Ajith et al. 2026) 预测未来论文的组件和影响力，输出为 mixed structured outputs；CUSP (Wu et al. 2026) 预测科学事件的可行性与时间，输出为 mixed event outputs；What's Next? (Ofer et al. 2024) 虽预测 topic-level 的未来发表份额，但采用 annual step-forward 且每个 topic 独立输出标量，缺乏方向间的联合归一化约束。这些 benchmarks 共同的不足在于：它们要么关注个体层面的预测（单篇论文、单个事件、单条链接），要么缺乏在固定 within-field direction slate 上进行 rolling forecast 的设计，因此无法评测 agent 在\"同一领域、同一方向体系、多个时间点\"上反复进行联合分布预测的能力。第三类是 **research agent** 系统（Lu et al. 2024; Baek et al. 2025; Li et al. 2025），它们支持从文献检索到 idea 生成的完整 workflow，但评测仍以最终产物为中心，未将 evidence acquisition 过程与 terminal readout 分离进行受控诊断。RAP 的关键创新正在于此：通过 matched State intervention、frozen-evidence replay 和 exact-history ablation，它将端到端预测分解为 acquisition、state recovery 和 future updating 三个可独立诊断的环节，从而揭示了此前评测无法发现的一个核心 failure mode——Forecast 目标本身会改变 agent 的 evidence acquisition 行为，使其偏离对预测更有用的近期文献。", "core_insight": "### § 3 重建作者的思考路径\n\nLLM 正在从 chatbot 演变为 research agent，能够检索数百篇论文并生成领域综述。但一个流畅的 survey 并不证明模型在特定时间点对领域状态的推断是定量准确的——回顾性任务只验证了综合能力，不验证时间锚定的状态估计。与此同时，前瞻性科学预测基准（如 Science4Cast、PreScience）大多聚焦于个体论文、概念链接或实验结果的预测，缺乏对同一领域内固定方向集合上联合归一化活动分布的反复预测评估。作者由此识别出一个空白：没有人系统测试过 LLM agent 能否在给定过去科学记录的条件下，滚动预测未来研究注意力的分布。\n\n从科学学的角度，研究活动的分配并非随机——Fortunato 等人的工作表明科学注意力具有可预测的结构性规律。如果将 arXiv 提交按领域特定的稳定方向 codebook 归类，每个时间窗口的论文份额构成一个 compositional share vector，那么预测下一窗口的分布就是一个有明确 ground truth 的 distribution forecasting 问题。关键设计约束随之浮现：方向 codebook 必须在所有 rolling origin 上冻结，使分布跨时间可比；证据访问必须按 cut-off 严格限制，避免未来泄漏；评估必须区分\"恢复当前活动水平\"和\"超越 persistence 的未来特定更新\"——因为一个简单的 EWMA baseline 就能利用近期计数获得很强的 persistence 基线，任何声称的预测能力必须在这个基线之上才有意义。\n\n作者进一步思考：如果 agent 在这个任务上表现不佳，瓶颈究竟在哪里？在 agentic 文献工作流中，证据不是固定输入——请求的目标本身会改变 agent 发出什么查询、检索什么论文、何时停止搜索。这意味着一个前瞻性 Forecast 目标可能在证据获取阶段就引入偏差，而非仅在最终 readout 阶段。为了分离这一效应，需要一个匹配的 State intervention：让同一个 agent 用同样的搜索界面估计过去六个月的分布，然后将其 carry-forward 作为 agent-specific persistence baseline。如果 State carry-forward 优于直接 Forecast，且 frozen-evidence replay 显示 State-oriented 轨迹在共同 Forecast readout 下也更好，那么问题就不在 readout 而在 acquisition——目标条件化改变了搜索行为本身。这条推理链从\"评估能力\"自然延伸到\"诊断失败机制\"，构成了 RAP 的 capability decomposition 设计。\n\n### § 4 核心 Intuition\n\n当 LLM agent 被要求预测未来研究注意力的分布时，这个前瞻性目标本身会扭曲它在搜索阶段获取证据的方式：Forecast-oriented policy 会将检索注意力从最近六个月的文献上移开，即使这些近期证据对未来预测最为关键。结果是，让 agent \"向前看\" 反而损害了它对当前状态的恢复能力——用同一个 agent 做匹配的 State 估计并 carry-forward，反而比直接 Forecast 更准确。这个 target-conditioned evidence acquisition bias 是结构性的：即使向 agent 提供精确的历史活动计数，超越 persistence 的校准未来更新仍然有限，说明瓶颈不仅在于证据获取，还在于 agent 无法将检索到的证据转化为对持久性基线的可靠偏离。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《RAP: Research Attention Prediction Reveals Target-Conditioned Evidence Acquisition Biases》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出的核心问题是：**LLM agents 能否基于过去的科学记录，预测未来一段时间内研究注意力在各研究方向上的分布？** 具体而言，给定一个研究领域和截止时间 $T$，agent 需要在仅能检索 $T$ 之前文献的条件下，预测未来六个月内该领域各方向上 arXiv 论文的份额分布（一个八维 simplex 向量）。这一问题的重要性源于 LLMs 正从 chatbots 向 research assistants 演进，而有效的科研助手不仅需要回顾性总结已有文献，还需前瞻性地追踪研究注意力的演变——识别新兴主题、优先支持科学探索、辅助研究规划均依赖于对当前研究格局的理解和对未来研究投入方向的预判。然而，现有评测体系在这一能力维度上存在结构性缺口：retrospective tasks 只验证已发表工作的综合质量，无法证明模型推断的领域状态在特定时间点是定量准确的；prospective benchmarks 则聚焦于单篇论文的影响力、特定科学事件或概念链接预测，而非在固定方向体系上反复进行的、联合归一化的活动分布预测。RAP 通过将\"预测未来研究注意力分布\"转化为一个 rolling、outcome-grounded 的分布预测问题，填补了这一评测空白，同时为诊断 agents 在 evidence acquisition、state recovery 和 future-specific updating 三个环节的能力边界提供了可分解的实验框架。 ### § 2 前人工作与不足 该问题此前未被直接解决。最相关的 prior work 可分为三类。第一类是 **retrospective literature synthesis** 系统，包括 retrieval-grounded 综述生成（Asai et al. 2026; Skarlinski et al. 2024）和自动化 survey 写作（Wang et al. 2024b; Yan et al. 2025; Bao et al. 2025）。这些系统能从数百篇论文中生...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 LLM 正在从 chatbot 演变为 research agent，能够检索数百篇论文并生成领域综述。但一个流畅的 survey 并不证明模型在特定时间点对领域状态的推断是定量准确的——回顾性任务只验证了综合能力，不验证时间锚定的状态估计。与此同时，前瞻性科学预测基准（如 Science4Cast、PreScience）大多聚焦于个体论文、概念链接或实验结果的预测，缺乏对同一领域内固定方向集合上联合归一化活动分布的反复预测评估。作者由此识别出一个空白：没有人系统测试过 LLM agent 能否在给定过去科学记录的条件下，滚动预测未来研究注意力的分布。 从科学学的角度，研究活动的分配并非随机——Fortunato 等人的工作表明科学注意力具有可预测的结构性规律。如果将 arXiv 提交按领域特定的稳定方向 codebook 归类，每个时间窗口的论文份额构成一个 compositional share vector，那么预测下一窗口的分布就是一个有明确 ground truth 的 distribution forecasting 问题。关键设计约束随之浮现：方向 codebook 必须在所有 rolling origin 上冻结，使分布跨时间可比；证据访问必须按 cut-off 严格限制，避免未来泄漏；评估必须区分\"恢复当前活动水平\"和\"超越 persistence 的未来特定更新\"——因为一个简单的 EWMA baseline 就能利用近期计数获得很强的 persistence 基线，任何声称的预测能力必须在这个基线之上才有意义。 作者进一步思考：如果 agent 在这个任务上表现不佳，瓶颈究竟在哪里？在 agentic 文献工作流中，证据不是固定输入——请求的目标本身会改变 agent 发出什么查询、检索什么论文、何时停止搜索。这意味着一个前瞻性 Forecast 目标可能在证据获取阶段就引入偏差，而非仅在最终 readout 阶段。为了分离这一效应，需要一个匹配的 State intervention：让同一个 agent 用同... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **RAP: Research Attention Prediction Reveals Target-Conditioned Evidence Acquisition Biases** **Yingqian Wu**[1] **, Jingcong Liang**[1] **, Siyuan Wang**[3] **, Zhenfei Yin**[4] **, Philip Torr**[4] **, Junchi Yu**[4][∗] **, Zhongyu Wei**[1,2][∗] 1Fudan University 2Shanghai Innovation Institute 3The Chinese University of Hong Kong 4University of Oxford wuyq25@m.fudan.edu.cn, junchi.yu@eng.ox.ac.uk, zywei@fudan.edu.cn ## **Abstract** Large language models (LLMs) increasingly act as research agents, yet their ability to track shifts in research attention is difficult to evaluate because reviews and research ideas lack uniquely verifiable outcomes. We introduce **Research Attention Prediction (RAP)** , a rolling benchmark covering 278 AI/ML fields and 1,390 episodes. At each cut-off, an LLM agent searches a temporally restricted arXiv corpus and predicts the next six months’ paper shares...", "additional_insights": "### § 8 Take-aways\n\n论文提出了 RAP benchmark，将 LLM 的科研前瞻能力转化为一个可验证的 rolling distribution forecasting 问题：在给定 cut-off 时间点，agent 需要预测未来六个月内 arXiv 论文在八个 frozen research directions 上的分布。核心发现是，所有四个 diagnostic models 的预测表现均不如基于精确历史计数的 EWMA baseline，说明当前 LLM agent 在 compositional accuracy 上尚未超越简单的指数加权移动平均。论文诊断出两个相互关联的 bottleneck：在 cumulative-history access 条件下，State carry-forward 优于直接 Forecast，且 frozen-evidence replay 表明 Forecast-oriented policy 会检索较少的 recent evidence，即“向前看”的目标会改变 agent“看什么”的行为。即使提供精确的历史数据，future-specific updating 仍然有限，只有 GPT-5.5 结合 reopened Search 能略微超过 EWMA。Outcome-aligned fine-tuning 能提升 Qwen3-4B 的 Spearman correlation 0.105，证明该任务具有可学习性，但并未在 mechanism level 修复 evidence acquisition failure。\n\n### § 9 最脆弱的假设\n\n最关键的假设是：arXiv 论文在八个 frozen directions 上的 submission share distribution 是一个可靠且可重复测量的 proxy for research attention。如果这个测量工具本身噪声过大或方向划分不合理，那么所有基于此的 forecasting 评估和 diagnostic 结论都将失去意义。在实际中，这个假设可能不成立，因为 paper-to-direction assignment 存在大量 boundary cases（42.60% 的 membership 被标记为 boundary ties），且八个方向是由 LLM 辅助构建的 operational coordinates 而非专家验证的 taxonomy。论文提供的证据包括 split-half Spearman–Brown reliability 为 0.820，posterior-predictive estimate 为 0.828，以及 human audit 显示 field membership 复现率为 0.958。然而，human audit 中 exact primary match 仅为 0.533，corpus-reweighted 后降至 0.470，且这是 single-annotator 的 label-blind audit，缺乏 inter-annotator agreement 和 domain-expert validation。这意味着虽然 benchmark 在 persistence level 上可能足够稳定，但 paper-level 的方向分配噪声可能足以影响对 beyond-persistence updating 的精细诊断，尤其是当 agent 的 residual alignment 本就很弱（如 GPT-OSS-120B 和 DeepSeek-V3 接近零）时，测量噪声可能淹没真实信号。\n\n### § 10 最小复现实验\n\n在一周时间内，可以复现论文中最核心且最易实现的 claim：**所有 LLM agent 的 Forecast 表现不如 EWMA baseline**。具体方案如下：从 arXiv API 抓取 2022-06 至 2026-06 期间标记为 cs.CL/cs.LG/cs.AI/cs.CV 的论文，选取 3-5 个具有明确子方向的领域（如 machine translation 或 reinforcement learning），用 GPT-4o 或 Claude 构建每个领域的 8 个 direction codebook，然后用一个简单的 keyword-based classifier 或 LLM classifier 对论文进行 direction assignment。对于每个领域和每个 semi-annual origin（如 2024-01, 2024-07, 2025-01），计算前三个窗口的 EWMA 预测和实际未来六个月的 distribution，用 Spearman correlation 评估。同时，用 GPT-4o 或 Qwen3-4B 在 Closed 和 Fixed-window 条件下进行 Forecast，比较其 Spearman correlation 与 EWMA。如果 LLM agent 的得分系统性低于 EWMA，则支持论文的核心 claim；如果 LLM agent 在部分领域显著超过 EWMA，则反驳该 claim。这个实验不需要完整的 278 个领域和 1,390 个 episodes，但能验证“persistence remains dominant”这一最基础的发现。", "research_value": "### § 11 最强反例设计\n\n对这篇论文最有力的攻击应针对其 ground truth 的有效性，提出一个具体的替代解释：**LLM agents 并非缺乏 future-specific updating 能力，而是 RAP benchmark 使用的 arXiv submission share 是一个高度滞后的指标，导致 LLM 的“超前预测”被错误地判定为预测失败。** 研究注意力的真实转移往往先于 arXiv 论文发表数月甚至数年，当一个新的 paradigm shift（如某项突破性技术的发布）发生时，研究者的注意力、代码实现和实验资源会立刻转移，但受限于科研同行评审和论文撰写周期，这些注意力转化为 arXiv submission 份额存在巨大的系统性时滞。EWMA baseline 本质上是在拟合这种滞后的历史趋势，因此它与滞后的 ground truth 高度吻合；相反，如果 LLM agent 真正具备前瞻能力，它可能会基于近期的 breakthrough 预测出注意力的提前转移，但在六个月后的 arXiv submission 数据中，这种转移可能尚未完全显现，或者被历史存量的惯性所稀释，从而被 RAP 判定为表现不如 EWMA。为了验证这一替代解释，可以设计一个“Early-Signal Ground Truth”实验：选取几个发生明确 paradigm shift 的领域（如某关键架构发布后的六个月），对比 LLM agent 的预测分布、EWMA 预测分布，以及基于实时早期信号（如 GitHub 新建 repo 的主题分布、Twitter/X 上的学术讨论话题分布、顶级 conference 的 workshop 提案分布）构建的“真实注意力分布”。如果 LLM agent 的预测与早期信号的相关性显著高于其与 arXiv submission share 的相关性，且 EWMA 与早期信号严重脱节，则证明 RAP benchmark 不仅未能测出 LLM 的前瞻能力，反而用滞后的人类科研产出机制系统性地惩罚了真正具有前瞻性的预测。\n\n### § 12 Follow-up Research Idea\n\n基于 RAP 强制使用 frozen 8-direction simplex 从而无法捕捉 paradigm shift 的核心局限，一个非增量的 novel research idea 是构建 **Generative Research Horizon Expansion (GRHE) 任务：预测分类体系本身的演化**。该想法驱动的局限是：真正有价值的科研助手不应仅仅在固定坐标轴上预测份额变化，而应能预测未来会有哪些全新的坐标轴涌现；RAP 的 fixed-slate 设计从根本上排除了 LLM 发现 novel direction 的可能性。我们可以借鉴 Open-ended learning 中的 Quality Diversity (QD) 算法以及 NLP 中的 Dynamic Topic Models (DTM)，将研究方向视为可变异和重组的 \"concept genomes\"，而非固定的 taxonomy 槽位。GRHE 的目标不再是预测固定向量，而是让 agent 生成 $T+6$ 时刻的候选 taxonomy（包含新方向的语义描述），并预测新旧方向的联合分布。第一个实验将采用 \"Novel Concept Hit Rate\" 作为核心评估指标：给定 cut-off $T$ 时的文献，让 LLM agent 生成未来六个月可能涌现的 $k$ 个新方向描述；随后在 $T+6$ 的真实 arXiv 语料上运行无监督 embedding clustering，如果 agent 预测的某个新方向描述与真实涌现的高密度论文簇形成精准的 semantic alignment 且该簇在 $T$ 时刻不存在，则记为一次 hit。这与现有的 idea generation 或 fixed-slate forecasting 截然不同，它首次将评测从“已知空间内的分布预测”推向了“未知空间的拓扑演化预测”，真正测试了 LLM 在科学演进中的 generative foresight 而非 retrospective interpolation。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yingqian Wu\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Jingcong Liang\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Siyuan Wang\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Zhenfei Yin\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Philip Torr\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Junchi Yu\", \"affiliations\": [4], \"markers\": [\"*\"]},\n    {\"name\": \"Zhongyu Wei\", \"affiliations\": [1, 2], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Fudan University\"},\n    {\"id\": 2, \"name\": \"Shanghai Innovation Institute\"},\n    {\"id\": 3, \"name\": \"The Chinese University of Hong Kong\"},\n    {\"id\": 4, \"name\": \"University of Oxford\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Corresponding authors.\"}\n  ]\n}\n```", "summary_translation": "大型语言模型（LLMs）越来越多地作为研究 agent，但它们跟踪研究注意力转移的能力很难评估，因为综述和研究想法缺乏唯一可验证的结果。我们引入了 Research Attention Prediction (RAP)，这是一个涵盖 278 个 AI/ML 领域和 1,390 个 episodes 的滚动 benchmark。在每个 cut-off，一个 LLM agent 搜索时间受限的 arXiv 语料库，并预测八个 frozen research directions 在未来六个月的论文份额。Search 通常有所帮助，但在 compositional accuracy 方面，所有四个 diagnostic models 的表现都不如 exact-count exponentially weighted moving average (EWMA) baseline。我们发现了两个相关的瓶颈。在 cumulative-history access 下，对于所有四个 diagnostic models，State carry-forward 的表现优于 direct Forecast；frozen-evidence replay 将这种逆转的共同组成部分与检索较少近期证据份额的 Forecast-oriented policies 联系起来。即使有 exact historical activity，future-specific updating 仍然有限，只有 GPT-5.5 加上 reopened Search 略微超过了 EWMA。在 realised outcomes 上进行 Fine-tuning，将 Qwen3-4B 在后期 origins 的 held-out fields 上的 forecast Spearman correlation 提高了 0.105，在 change-rich episodes 上也有所提升。"}, {"title": "Scores Alone Do Not Prove Discovery: The Discovery Certification Protocol for Auditing AI Research Agents", "arxiv_id": "2609.09219", "authors": "Jingjie Ning, Shanshan Zhong, Xiaochuan Li, Ji Zeng", "summary": "AI research agents combine prior knowledge, public sources, and experimental feedback to produce useful results. The Discovery Certification Protocol (DCP) turns claims about these results into executable recovery and feedback tests. Gate 1 validates useful improvement on sealed evaluation. Gate 2 gives matched agents the registered starting information and observed Web content while withholding the target research history. Every valid method reaching the numerical target supplies a recovery witness and triggers the Core veto. DCP Core requires adequate controls, zero observed recoveries, and a finite-sample bound on recovery in one fresh registered episode. Optional Gate 3 measures the average effect of truthful feedback relative to a specified neutral policy from a shared checkpoint. DCP Evidence adds this effect after independent null calibration and a registered effect margin. Two controlled audits exercise the complete protocol in SQLite optimization and virtual catalyst control under different models. Each produced zero recoveries in 96 episodes, with an upper bound of 0.0468. Each paired study yielded 30 truthful recoveries and zero neutral recoveries, with passing 60-pair null studies. Additional cases exercise Core, recovered, and audit-incomplete decisions. A deterministic, LLM-free verifier reproduces the decisions from frozen evidence. DCP provides a common evidence language for useful outcomes, alternative routes, and feedback effects across AI research.", "category": "cs.AI", "cluster": "Research Agents \u0026 Evaluation", "tags": ["cs.AI"], "filter_reason": "这篇论文提出了 Discovery Certification Protocol (DCP)，用于审计和评估 AI research agents 的发现能力。论文的研究对象明确是结合先验知识、网络资源和实验反馈来产生结果的 AI research agents（属于 Tool-Use Agents / Long-Horizon Agents 范畴）。虽然论文的核心贡献是一个评估协议，但该协议旨在验证智能体是否真正通过环境反馈和探索发现了有效方法，还是仅仅通过其他途径（如运气）获得结果。这属于对智能体行为分析、评估基准和失败机制诊断的研究，直接帮助理解智能体的真实能力和反馈利用机制。根据筛选标准第一步，“如果论文的研究对象明确是 LLM Agents / Long-Horizon Agents / Tool-Use Agents，即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留”。因此，该论文符合研究范围。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的核心研究问题是：如何为 AI research agents 产出的研究结果提供可执行、可验证的审计证据，以证明其发现的真实性和价值。随着 AI research agents 越来越多地参与算法发现和自动化研究流程，它们往往只报告一个高分结果，但仅凭分数无法证明该结果是否依赖于特定的研究历史，或者是否可以通过其他路径轻易复现。解决这个问题至关重要，因为它直接关系到 AI 参与科学研究的可信度与问责性。DCP（Discovery Certification Protocol）通过将关于结果的声明转化为可执行的恢复和反馈测试来解决这一问题：Gate 1 在 sealed evaluation 上验证结果的有效改进；Gate 2 向匹配的 agents 提供注册的初始信息和观察到的 Web 内容，但保留目标研究历史，测试其是否能恢复目标结果；Gate 3 则测量 truthful feedback 相对于 neutral policy 的平均效应。这为 AI 研究中的有用结果、替代路径和反馈效应提供了一种通用的证据语言，使得发现报告成为作者可以提交、审计员可以挑战、读者可以独立验证的通用实验记录，从而显著提升了 AI 科研产出的透明度和可重复性。\n\n### § 2 前人工作与不足\n在 DCP 之前，AI research agents 的评估主要集中于任务成功率和工程能力，但缺乏对发现过程和信息边界的严格审计。例如，AlphaTensor、AlphaDev、FunSearch 和 AlphaEvolve 等系统虽然通过搜索与目标评估发现了有用的算法和数学构造，但它们的评估框架并未测试在给定起始信息下其他路径是否能恢复相同结果，也没有对 feedback policy 的因果效应进行随机化比较。MLE-bench、MLGym、MLR-Bench 和 PaperBench 等基准主要评估机器学习工程和复现能力，DiscoveryWorld 测量任务成功和科学行动，FIRE-Bench 评估已发表见解的重新发现，但它们都没有提供一个 outcome-level 的 recovery test 来接受通过共享数值规则验证的替代方法。在迭代反馈方面，ReAct、Tree of Thoughts、Reflexion 和 Self-Refine 等方法开发了工具使用和反思机制，但缺乏将 feedback effect 与独立 null calibration 分离的随机化对照设计。在评估完整性方面，contamination studies 和 memorization research 检查了先前暴露的影响，Proof-of-Learning 记录训练状态以证明训练过程，但它们没有将可执行结果与注册的 counterfactual experiments 耦合。这些不足的根本原因在于之前的研究没有将发现审计定义为一个结合信息边界、资源匹配和统计因果推断的综合性问题，导致评估缺口：无法区分一个高分结果是源于不可替代的创新发现，还是仅仅通过已知组件的重组或信息泄露即可轻易达成。DCP 通过引入 qualified recovery witnesses、finite-sample recovery bounds 和 randomized feedback effects，将证书资格与统计和因果结论分离，填补了这一关键空白。", "core_insight": "### § 3 重建作者的思考路径\n\n随着 AlphaTensor、FunSearch 等 AI research agents 在算法发现和自动化科研中取得突破，如何评估这些系统的“发现”成为了一个核心难题。传统的评估方式往往只关注 agent 最终产出的程序或模型在 sealed test 上的 score，但作者敏锐地观察到这种评估的脆弱性。在机器学习评估中，实现细节和 baseline 选择的微小差异就能改变结果的排名（Melis et al., 2018; Musgrave et al., 2020），而在自动化研究中，同一 idea 的不同独立实现同样会引发“implementation lottery”（Ning et al., 2026e）。这意味着，一个 agent 报告的高分可能只是特定实现路径的产物，甚至仅仅是因为它掌握了足够的初始数据（E0）和公开网络资料（Web）。如果换一个 agent，在相同的起点下也能轻易达到这个分数，那么这个高分就不能证明任何真正的“发现”。\n\n另一方面，现有的 agent 评估框架（如 MLE-bench, DiscoveryWorld）多聚焦于任务成功率或工程能力，缺乏对研究过程本身的严格因果审计。当 agent 通过 ReAct 或 Reflexion 等机制利用实验反馈进行迭代优化时，我们很难确定性能的提升究竟是因为真实的实验反馈起到了作用，还是仅仅因为多轮的 prompt 结构或额外的计算预算带来的增益（Ning et al., 2026d）。为了剥离这些混淆因素，作者借鉴了因果推断中的反事实框架（Rubin, 1974）和预注册机制（Nosek et al., 2018）。如果要在同一个 checkpoint 上分叉，一边给予真实的实验反馈，另一边给予保持格式但无信息的中性反馈，就能通过等价性检验（Schuirmann, 1987）来校准并量化反馈的真实因果效应。\n\n沿着这些线索，作者意识到需要一个统一的、可执行的审计协议来重新定义“发现”的证据。这个协议不能仅仅依赖最终的 score，而必须回答三个递进的问题：这个结果真的比 baseline 有用吗？如果给其他 agent 相同的初始信息和网络访问权限但不给实验历史，它们能恢复出这个结果吗？如果不能恢复，那么目标运行中的实验反馈是否真的比中性反馈带来了显著的性能提升？通过将这三个问题转化为可执行的 recovery test 和 randomized paired study，并用一个确定性的 verifier 进行离线重放，作者最终构建了 Discovery Certification Protocol (DCP) 的核心框架。\n\n### § 4 核心 Intuition\n\nAI research agent 报告的高分可能仅仅依赖于初始信息和公开资料，而非真正的实验探索。为了证明真正的“发现”，必须引入一个“可恢复性”测试：给一个全新的 agent 相同的起点但隐藏实验历史，如果它无法达到目标分数，说明该结果并非显而易见。进一步地，通过严格的随机对照实验，证明真实的实验反馈相比于无信息的中性反馈确实带来了因果上的性能提升。这种将高分验证、反事实恢复测试与因果反馈评估分离的方法，构成了证明 AI 发现的坚实证据基础。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Scores Alone Do Not Prove Discovery: The Discovery Certification Protocol for Auditing AI Research Agents》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文提出并解决的核心研究问题是：如何为 AI research agents 产出的研究结果提供可执行、可验证的审计证据，以证明其发现的真实性和价值。随着 AI research agents 越来越多地参与算法发现和自动化研究流程，它们往往只报告一个高分结果，但仅凭分数无法证明该结果是否依赖于特定的研究历史，或者是否可以通过其他路径轻易复现。解决这个问题至关重要，因为它直接关系到 AI 参与科学研究的可信度与问责性。DCP（Discovery Certification Protocol）通过将关于结果的声明转化为可执行的恢复和反馈测试来解决这一问题：Gate 1 在 sealed evaluation 上验证结果的有效改进；Gate 2 向匹配的 agents 提供注册的初始信息和观察到的 Web 内容，但保留目标研究历史，测试其是否能恢复目标结果；Gate 3 则测量 truthful feedback 相对于 neutral policy 的平均效应。这为 AI 研究中的有用结果、替代路径和反馈效应提供了一种通用的证据语言，使得发现报告成为作者可以提交、审计员可以挑战、读者可以独立验证的通用实验记录，从而显著提升了 AI 科研产出的透明度和可重复性。 ### § 2 前人工作与不足 在 DCP 之前，AI research agents 的评估主要集中于任务成功率和工程能力，但缺乏对发现过程和信息边界的严格审计。例如，AlphaTensor、AlphaDev、FunSearch 和 AlphaEvolve 等系统虽然通过搜索与目标评估发现了有用的算法和数学构造，但它们的评估框架并未测试在给定起始信息下其他路径是否能恢复相同结果，也没有对 feedback policy 的因果效应进行随机化比较。MLE-bench、MLGym、MLR-Bench 和 PaperBench 等基准主要评估机器学习工程和复现能力，DiscoveryWorld 测量任务成功和科学行动，FIRE-Bench 评估已发表见解的重新发现，但它们都没有提供一个...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 随着 AlphaTensor、FunSearch 等 AI research agents 在算法发现和自动化科研中取得突破，如何评估这些系统的“发现”成为了一个核心难题。传统的评估方式往往只关注 agent 最终产出的程序或模型在 sealed test 上的 score，但作者敏锐地观察到这种评估的脆弱性。在机器学习评估中，实现细节和 baseline 选择的微小差异就能改变结果的排名（Melis et al., 2018; Musgrave et al., 2020），而在自动化研究中，同一 idea 的不同独立实现同样会引发“implementation lottery”（Ning et al., 2026e）。这意味着，一个 agent 报告的高分可能只是特定实现路径的产物，甚至仅仅是因为它掌握了足够的初始数据（E0）和公开网络资料（Web）。如果换一个 agent，在相同的起点下也能轻易达到这个分数，那么这个高分就不能证明任何真正的“发现”。 另一方面，现有的 agent 评估框架（如 MLE-bench, DiscoveryWorld）多聚焦于任务成功率或工程能力，缺乏对研究过程本身的严格因果审计。当 agent 通过 ReAct 或 Reflexion 等机制利用实验反馈进行迭代优化时，我们很难确定性能的提升究竟是因为真实的实验反馈起到了作用，还是仅仅因为多轮的 prompt 结构或额外的计算预算带来的增益（Ning et al., 2026d）。为了剥离这些混淆因素，作者借鉴了因果推断中的反事实框架（Rubin, 1974）和预注册机制（Nosek et al., 2018）。如果要在同一个 checkpoint 上分叉，一边给予真实的实验反馈，另一边给予保持格式但无信息的中性反馈，就能通过等价性检验（Schuirmann, 1987）来校准并量化反馈的真实因果效应。 沿着这些线索，作者意识到需要一个统一的、可执行的审计协议来重新定义“发现”的证据。这个协议不能仅仅依赖最终的 score，而必须回答三个递进的问题：这... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **Scores Alone Do Not Prove Discovery The Discovery Certification Protocol for Auditing AI Research Agents** **Jingjie Ning Shanshan Zhong Xiaochuan Li Ji Zeng** School of Computer Science, Carnegie Mellon University _{_ jening, szhong2, xiaochu4, jizeng _}_ @cs.cmu.edu Homepage PyPI / dcp-audit PyPI / dcp-harness GitHub ## **Abstract** AI research agents combine prior knowledge, public sources, and experimental feedback to produce useful results. The Discovery Certification Protocol (DCP) turns claims about these results into executable recovery and feedback tests. Gate 1 validates useful improvement on sealed evaluation. Gate 2 gives matched agents the registered starting information and observed Web content while withholding the target research history. Every valid method reaching the numerical target supplies a recovery witness and triggers the Core veto. DCP Core requires adequate...", "additional_insights": "### § 8 Take-aways\nDCP将AI research agents的“discovery”从单一分数转化为可审计的多阶段证据过程，将结果效用、替代路径和反馈效应解耦。Gate 2引入了recovery test，向matched agents提供初始信息（$K$, $E_0$, $W_{obs}$）但保留目标研究历史（$L^\\star$），任何有效恢复都会触发Core veto，证明该结果并非特定研究历史的独有产物。Gate 3通过从shared checkpoint进行randomized pairs，比较truthful feedback与neutral policy，并利用null calibration证明反馈本身在因果上导致了结果的改善。该协议使用deterministic, LLM-free verifier从frozen evidence bundles中重现决策，确保了无需重新运行昂贵LLM agents的独立审计与可重复性。\n\n### § 9 最脆弱的假设\nDCP最脆弱的假设在于Gate 2的“information boundary”与matched agent的等效性，即认为如果在给定初始信息（$K$, $E_0$, $W_{obs}$）且保留研究历史（$L^\\star$）的情况下，matched agent未能恢复目标结果，就证明该结果确实依赖于特定的研究历史。在实际中，这个假设可能不成立，因为LLM agents的推理高度依赖于prompt结构、采样随机性以及“implementation lottery”（论文自身也引用了这一点）。零恢复可能仅仅意味着matched agent在96次独立尝试中运气不佳，或者其特定的prompt harness不利于触发该推理路径，而非该信息在$L^\\star$中根本不存在。论文通过positive controls（如45/45通过）和finite-sample bound（如0.0468）来提供证据，证明harness本身是有效的且尝试是独立的，但这无法完全排除LLM推理的随机性导致false negative recovery的可能性，即可能存在一条未被该特定matched agent发现但理论上可行的替代路径。\n\n### § 10 最小复现实验\n在一周时间内，可以通过构建一个简化的SQLite index优化任务来验证Gate 2的recovery test与Core veto机制。使用一个包含10个查询的微型SQLite数据库，目标是选择1个最优的partial index以最小化查询时间。首先，运行一个Target Run：让LLM（如GPT-4o-mini）进行5轮交互，每轮提供执行时间作为feedback，直到它发现最优的复合index，并记录其研究历史（$L^\\star$）。接着，进行Gate 2测试：运行10个fresh matched agents，向它们提供相同的数据库schema和初始信息（$E_0$），但完全保留Target Run的试验历史（$L^\\star$），让它们直接提交最优index方案。测量这10个matched agents中有多少个成功猜中（recover）了最优index。如果大多数agent成功recover，则证明该“discovery”是trivial的，触发Core veto，反驳了该结果需要特定研究历史的claim；如果零recover或极少recover，则支持了DCP的核心假设，即feedback和历史信息对于该结果是必要的。这个实验无需复杂的harness，只需简单的API调用和本地SQLite执行即可完成。", "research_value": "### § 11 最强反例设计\n如果我反对这篇论文，我会设计一个基于“语法脆弱性”与“实现彩票”的真实世界场景来攻击 Gate 2 的 information boundary 假设。具体而言，我会构造一个目标发现（target discovery），其在概念上是极其 trivial 的，但在语法实现上却高度脆弱。例如，在一个特定的代码优化任务中，最优解仅仅是调用一个冷门但公开的 API 参数组合，但该参数组合只有在特定的代码缩进、变量命名或极其生僻的 prompt 措辞下才能通过 sealed evaluation。在 Target Run 中，原 agent 偶然发现了这个特定的语法结构并记录在 $L^\\star$ 中。当进入 Gate 2 测试时，matched agents 虽然拥有相同的初始信息（$K$, $E_0$, $W_{obs}$），但由于 prompt harness 的微小差异和采样随机性，它们在 96 次独立尝试中均未能命中这个极其狭窄的语法窗口，导致零恢复。此时，DCP 的 finite-sample bound 会给出一个极小的上界（如 0.0468），从而错误地颁发 Core 证书，声称该发现依赖于特定的研究历史且具有不可替代的创新性。这个反例直接挑战了 DCP 的核心有效性：它揭示了 DCP 实际上可能只是在测量“语法实现的难度”而非“概念发现的深度”。替代解释是，零恢复并非因为 $L^\\star$ 中包含了不可替代的创新路径，而是因为 evaluation metric 对特定语法的极端敏感性制造了 false negative recovery，使得 DCP 将一个平凡的语法拼图错误地认证为科学发现。\n\n### § 12 Follow-up Research Idea\n基于 Gate 2 无法区分“概念创新”与“语法脆弱性”这一核心局限，我提出一个全新的研究框架：Mechanistic Discovery Certification (MDC)，将审计目标从 black-box 的 outcome recovery 转向 white-box 的 reasoning trajectory recovery。该想法的驱动需求在于，当前的 DCP 依赖 frozen evidence 和 deterministic verifier 来判断结果是否可复现，但这在 LLM agents 中会因 implementation lottery 产生不可避免的 false negative，我们需要一种不依赖于特定 prompt harness 就能证明“概念不可替代性”的方法。这里可以借鉴 Mechanistic Interpretability 领域中的 Sparse Autoencoders (SAEs) 和 causal scrubbing 技术，这些工具能够从 LLM 的 activation space 中提取并验证特定的 reasoning circuits。第一个实验将设计一个对照任务：首先在 Target Run 中提取 agent 发现最优解时的 activation trajectory，并利用 SAEs 识别出对应核心概念的 feature directions；随后在 Gate 2 阶段，不要求 matched agents 输出完全相同的代码或数值，而是运行它们并监测其 residual stream 中是否激活了相同的 concept features。如果 matched agents 在没有 $L^\\star$ 的情况下，其 activation space 中完全没有涌现该 concept circuit，则真正证明了该发现需要特定的研究历史来构建推理路径；如果它们输出了不同语法但激活了相同 circuit，则证明概念是 trivial 的，仅是实现不同。这一提议彻底区别于现有工作，它将发现审计从“输出空间的统计随机对照”升维到了“表征空间的因果机制验证”，从根本上绕过了 implementation lottery 的干扰。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jingjie Ning\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shanshan Zhong\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Xiaochuan Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Ji Zeng\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Carnegie Mellon University\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "AI research agents 结合先验知识、公共来源和实验 feedback，以产生有用的结果。Discovery Certification Protocol (DCP) 将关于这些结果的声明转化为可执行的 recovery 和 feedback 测试。Gate 1 验证在 sealed evaluation 上的有用改进。Gate 2 向匹配的 agents 提供注册的起始信息和观察到的 Web 内容，同时隐瞒目标研究历史。每个达到数值目标的有效方法都提供一个 recovery witness 并触发 Core veto。DCP Core 要求充足的 controls、零观察到的 recoveries，以及在一个全新注册 episode 中 recovery 的 finite-sample bound。可选的 Gate 3 测量 truthful feedback 相对于来自共享 checkpoint 的指定 neutral policy 的平均效应。DCP Evidence 在独立的 null calibration 和注册的 effect margin 之后添加此效应。两次受控的 audits 在不同模型下的 SQLite 优化和虚拟催化剂控制中执行了完整的 protocol。每次在 96 个 episodes 中产生了零次 recoveries，上界为 0.0468。每项配对研究产生了 30 次 truthful recoveries 和零次 neutral recoveries，并通过了 60 对 null studies。额外的案例执行了 Core、recovered 和 audit-incomplete 决策。一个确定性的、无 LLM 的 verifier 从冻结的 evidence 中复现了这些决策。DCP 为整个 AI 研究中的有用结果、替代路线和 feedback 效应提供了一种通用的 evidence language。"}]}, {"name": "Agent Memory \u0026 Knowledge Reuse", "count": 2, "papers": [{"title": "ROAM: Robust Organization of Atomic Memories for Agents through Semantic Relations", "arxiv_id": "2609.09778", "authors": "Jianjie Zheng, Peng Lai, Sijie Cheng, Jiehui Zhao, Lei Yang, Guanhua Chen", "summary": "Long-term language-model agents rely on external memory across interactions. Atomic memories are particularly useful: their fine-grained semantic boundaries enable precise retrieval and direct comparison between observations. Yet accumulating atoms inevitably become redundant, overlapping, or conflicting. Existing methods often ask an LLM manager to add, update, delete, or rewrite memories directly, coupling semantic interpretation, storage decisions, and content generation in one error-prone operation. We introduce ROAM, a relation-guided framework that uses atomicity for management while allowing richer answer-time representations. ROAM classifies incoming--stored atom pairs as independent, equivalent, directionally subsuming, or conflicting, then organizes observations into active Primary and supporting Evidence roles. Fusion subsequently combines complementary details and temporal changes into compact, potentially non-atomic views. Only Primary views are retrieved for answering, preventing redundant or outdated atoms from competing independently. Across models and evaluation settings, ROAM improves answer accuracy by up to 29.8 percentage points. Ablations show complementary benefits from different relations and consistent gains from fusion beyond role organization. Mechanism analysis further finds 15.6-point higher answer-critical source recall and an 11.5-point lower confounder-token share. ROAM remains robust across manager scales.", "category": "cs.CL", "cluster": "Agent Memory \u0026 Knowledge Reuse", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 这篇论文的核心贡献是提出了一个名为 ROAM 的框架，专门用于管理和组织大语言模型智能体的长期外部记忆。论文针对智能体在长期交互中积累的原子记忆出现的冗余、重叠和冲突问题，设计了一种基于语义关系的分类和组织机制，将记忆分为主要的和辅助的角色，并进行融合以提供更准确的检索。这直接对应了筛选标准中“单智能体：记忆”这一核心方向。论文的研究对象明确是“长期语言模型智能体”，且其提出的机制旨在改进智能体的记忆能力，从而提升回答的准确性和鲁棒性。因此，该论文完全符合研究范围，应予保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文解决的核心问题是：长期语言模型代理在跨会话交互中依赖外部记忆积累用户偏好、情境与经验，而以原子事实为存储单元时，持续涌入的观察不可避免地产生语义重述、属性细化与时间状态转移，导致冗余、重叠与冲突。现有方法将语义解释、存储决策与内容生成耦合在单一黑盒操作中，使记忆管理不可控且易错。ROAM 提出将这一复合决策解耦为显式 semantic relation inference 与确定性策略执行：首先将 incoming–stored atom pair 分类为 independent (IND)、equivalent (EQV)、directionally subsuming (OSN/NSO) 或 conflicting (CON) 五种关系，再据此将观察组织为 active Primary 与 supporting Evidence 两种角色，最后通过 fusion 模块将互补细节与时间变化合成为紧凑的 read view 供检索使用。这个问题的重要性在于：原始对话历史迅速超出 agent 的 working context limit，而未整理、重叠和过时的原子记录会直接与 answer-critical evidence 竞争有限的 retrieval capacity，严重降低下游响应质量。ROAM 的价值体现在：在 controlled interference 设置下答案准确率最高提升 29.8 个百分点，answer-critical source recall 提高 15.6 个百分点，confounder-token share 降低 11.5 个百分点，且在不同 manager model 规模下保持稳健，证明了 relation-guided organization 能在有限 context budget 下有效抑制语义干扰并保留关键证据。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决。最直接相关的 prior method 是 Mem0 (Chhikara et al., 2025)，它让 LLM manager 对每个 incoming–stored memory pair 直接预测 ADD、UPDATE、DELETE 或 NONE 操作。这种方法的核心缺陷在于：模型必须在单次黑盒决策中同时完成三件事——推断底层 semantic relation、将其映射为物理存储突变、并协调内容重写。这种 conflation 使操作后果不稳定：当模型误判关系时，不仅存储状态出错，内容生成也随之偏移，且由于直接覆写源记录，历史可追溯性被永久破坏。Append-all 策略则走向另一极端，保留所有候选为独立可检索单元，在无竞争时表现尚可（N=0 时达 87.0%），但干扰增至 N=8 时骤降至 24.4%，因为它无法抑制冗余与过时记录对 retrieval capacity 的挤占。EverMemOS-style (Hu et al., 2026a) 虽引入 semantic grouping 与 consolidation，但仅限于短事实记忆的合并，未从显式 semantic relation 推导每条观察的 retrieval eligibility，无法区分等价、方向包含与冲突等不同交互形式。更广泛地看，结构化组织方法如 A-MEM (Xu et al., 2025)、RMM (Tan et al., 2025)、LightMem (Fang et al., 2026) 等虽在记忆链接、摘要或分层存储上有所推进，但均未将 semantic relation 作为 model judgment 与 storage control 之间的显式接口。根本原因在于：atomization 仅规定了记忆的粒度，却未规定积累的原子事实随信息演化应如何共存——这一问题在之前的工作中未被清晰定义，direct-operation paradigm 将其隐藏在端到端决策中，而 structural organizers 则绕过了关系级别的精确控制。ROAM 正是针对这一缺口，用五类关系的显式推理替代黑盒突变，用 Primary–Evidence 角色分配解耦源保留与检索资格，从而在保持历史 provenance 的同时消除冗余竞争。", "core_insight": "### § 3 重建作者的思考路径\n\n在长期 agent 交互中，为了在有限的 context budget 下实现高精度检索，系统通常将对话历史提取为细粒度的 atomic memories。然而，随着交互的持续，这些原子记忆不可避免地会产生语义重复、属性更新或状态冲突。现有的 memory management 方法（如 Mem0）通常采用 imperative operations，即让 LLM 直接对记忆库执行 ADD、UPDATE、DELETE 等操作。这种端到端的黑盒决策将语义解释、存储决策和内容生成耦合在一个容易出错的步骤中，不仅导致操作不可控，还常常因为直接覆盖而破坏了历史可追溯性。如果只是简单追加所有记忆，冗余和过时的信息又会挤占有限的检索空间，导致 answer-critical evidence 被淹没。面对这一困境，研究者自然会思考：如何在不丢失历史上下文的前提下，高效地整合不断涌入的原子观察？一个直观的理论线索是，人类在处理记忆更新时，并非直接“删除”旧记忆，而是先识别新旧信息之间的语义关系，再据此组织记忆。因此，与其让模型直接执行物理存储突变，不如将这个复合决策解耦：先让模型显式推断新旧记忆之间的五种语义关系（独立、等价、新旧包含、冲突），然后由确定性的策略根据关系分配角色，将最相关的设为 Primary，将支持性或被取代的设为 Evidence，最后通过 fusion 生成紧凑的 read view 供检索使用。这种解耦不仅使操作变得可控，还能在检索时只暴露高密度的当前视图，同时保留完整的底层历史溯源。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 在于：将 memory management 从“直接执行存储操作”转变为“先判断语义关系，再按规则组织角色”。先前方法失效是因为让 LLM 一次性完成语义理解和存储修改，这种黑盒操作极易出错且破坏历史；而 ROAM 奏效的关键在于解耦——让 LLM 只负责判断新旧记忆间的五种语义关系，随后由固定策略将记忆划分为活跃的 Primary 和归档的 Evidence，并仅检索 Primary 的融合视图。这样既避免了冗余和过时信息在检索时竞争空间，又完整保留了历史溯源，从而在有限的 context budget 下最大化 answer-critical evidence 的覆盖率。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《ROAM: Robust Organization of Atomic Memories for Agents through Semantic Relations》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 本文解决的核心问题是：长期语言模型代理在跨会话交互中依赖外部记忆积累用户偏好、情境与经验，而以原子事实为存储单元时，持续涌入的观察不可避免地产生语义重述、属性细化与时间状态转移，导致冗余、重叠与冲突。现有方法将语义解释、存储决策与内容生成耦合在单一黑盒操作中，使记忆管理不可控且易错。ROAM 提出将这一复合决策解耦为显式 semantic relation inference 与确定性策略执行：首先将 incoming–stored atom pair 分类为 independent (IND)、equivalent (EQV)、directionally subsuming (OSN/NSO) 或 conflicting (CON) 五种关系，再据此将观察组织为 active Primary 与 supporting Evidence 两种角色，最后通过 fusion 模块将互补细节与时间变化合成为紧凑的 read view 供检索使用。这个问题的重要性在于：原始对话历史迅速超出 agent 的 working context limit，而未整理、重叠和过时的原子记录会直接与 answer-critical evidence 竞争有限的 retrieval capacity，严重降低下游响应质量。ROAM 的价值体现在：在 controlled interference 设置下答案准确率最高提升 29.8 个百分点，answer-critical source recall 提高 15.6 个百分点，confounder-token share 降低 11.5 个百分点，且在不同 manager model 规模下保持稳健，证明了 relation-guided organization 能在有限 context budget 下有效抑制语义干扰并保留关键证据。 ### § 2 前人工作与不足 该问题此前未被充分解决。最直接相关的 prior method 是 Mem0 (Chhikara et al., 2025)，它让 LLM...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在长期 agent 交互中，为了在有限的 context budget 下实现高精度检索，系统通常将对话历史提取为细粒度的 atomic memories。然而，随着交互的持续，这些原子记忆不可避免地会产生语义重复、属性更新或状态冲突。现有的 memory management 方法（如 Mem0）通常采用 imperative operations，即让 LLM 直接对记忆库执行 ADD、UPDATE、DELETE 等操作。这种端到端的黑盒决策将语义解释、存储决策和内容生成耦合在一个容易出错的步骤中，不仅导致操作不可控，还常常因为直接覆盖而破坏了历史可追溯性。如果只是简单追加所有记忆，冗余和过时的信息又会挤占有限的检索空间，导致 answer-critical evidence 被淹没。面对这一困境，研究者自然会思考：如何在不丢失历史上下文的前提下，高效地整合不断涌入的原子观察？一个直观的理论线索是，人类在处理记忆更新时，并非直接“删除”旧记忆，而是先识别新旧信息之间的语义关系，再据此组织记忆。因此，与其让模型直接执行物理存储突变，不如将这个复合决策解耦：先让模型显式推断新旧记忆之间的五种语义关系（独立、等价、新旧包含、冲突），然后由确定性的策略根据关系分配角色，将最相关的设为 Primary，将支持性或被取代的设为 Evidence，最后通过 fusion 生成紧凑的 read view 供检索使用。这种解耦不仅使操作变得可控，还能在检索时只暴露高密度的当前视图，同时保留完整的底层历史溯源。 ### § 4 核心 Intuition 这篇论文的核心 Intuition 在于：将 memory management 从“直接执行存储操作”转变为“先判断语义关系，再按规则组织角色”。先前方法失效是因为让 LLM 一次性完成语义理解和存储修改，这种黑盒操作极易出错且破坏历史；而 ROAM 奏效的关键在于解耦——让 LLM 只负责判断新旧记忆间的五种语义关系，随后由固定策略将记忆划分为活跃的 Primary 和归档的 Evidence，并... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **ROAM: Robust Organization of Atomic Memories for Agents through Semantic Relations** **Jianjie Zheng**[1] _[∗]_ **, Peng Lai**[1][*] **, Sijie Cheng**[2] _[,]_[3] **, Jiehui Zhao**[4] **, Lei Yang**[4] **, Guanhua Chen**[1][†] 1Southern University of Science and Technology, 2Tsinghua University 3RayNeo.AI, 4Deepexi Technology Co. Ltd. ## **Abstract** Long-term language-model agents rely on external memory across interactions. Atomic memories are particularly useful: their finegrained semantic boundaries enable precise retrieval and direct comparison between observations. Yet accumulating atoms inevitably become redundant, overlapping, or conflicting. Existing methods often ask an LLM manager to add, update, delete, or rewrite memories directly, coupling semantic interpretation, storage decisions, and content generation in one error-prone operation. We introduce _ROAM_ , a relation-gu...", "additional_insights": "### § 8 Take-aways\n\nROAM 将 memory management 从端到端的黑盒操作（如 ADD/UPDATE/DELETE）解耦为显式的 semantic relation inference 和 deterministic policy execution，避免了 LLM 同时处理语义解释和存储突变带来的不稳定性。框架定义五种语义关系（IND, EQV, OSN, NSO, CON）对 incoming-stored atom pairs 进行分类，并据此分配 Primary 和 Evidence 角色，使历史 provenance 得以保留而冗余记忆不会独立竞争检索。Fusion 模块将兼容细节和时间变化合成为 compact read view，仅 Primary views 参与检索，从而在有限 context budget 下提升 answer-critical evidence 的信息密度。在 LongMemEval Controlled 的高干扰设置（N=8）下，ROAM 比最强 baseline 提升最高 29.8 个百分点，且优势在 Gemma-4-12B、Qwen3.5-9B、Qwen3-8B 三种 manager model 上一致。消融实验表明 contradiction、equivalence、directional containment 关系以及 fusion 各自提供互补收益，缺少任一组件都会导致高干扰下 accuracy 下降。检索诊断揭示 ROAM 的核心机制：在相同 256-token budget 下，通过 selective context organization 将 gold-source recall 提升至 84.6% 并将 confounder-token share 降至 47.1%，而非依赖更大的 context 量。\n\n### § 9 最脆弱的假设\n\n最脆弱的假设是 LLM 能够可靠区分 OSN 和 NSO 这两种方向性 entailment 关系。这个假设是 ROAM role assignment 的基础：OSN 要求 incoming observation 成为 Primary 而 old matches 降为 Evidence，NSO 则相反，方向判断错误会导致最 informative 的 fact 被错误归档为 Evidence 或冗余 fact 被错误保留为 Primary。在实际场景中，entailment 方向的判断需要对 entity、attribute 和 specificity 层次有精确理解，例如 \"lives in Manhattan\" 与 \"lives in New York City\" 的地理包含关系，或 \"has a golden retriever\" 与 \"has a dog\" 的 taxonomic 关系，这些判断对中小规模 LLM 并非易事。论文 Table 4 提供的证据显示，即使是 26B 参数的 Gemma-4-26B-A4B-it，OSN 和 NSO 的 F1 也仅为 76.0% 和 69.3%，远低于 EQV（93.1%）和 CON（91.0%）。然而，主实验使用的 manager model 为 8B–12B 规模，论文并未直接报告这些较小模型在实验数据上的 relation inference 准确率，也未分析 OSN/NSO 误判对下游 accuracy 的具体影响。如果较小模型的 OSN/NSO 分类性能进一步下降，role assignment 的错误会直接导致 answer-critical memories 被错误降级或冗余 memories 被错误保留，从而削弱 ROAM 相对于 Append-all 的核心优势。\n\n### § 10 最小复现实验\n\n1 周内可复现 ROAM w/o Fusion 的核心逻辑，以验证 relation-conditioned role assignment 是否能在高干扰下提升 retrieval accuracy。数据方面，从 LongMemEval 中选取 50 个带有 gold-memory annotation 的 questions，用 Gemma-4-26B-A4B 生成固定数量的 confounders（Type I 语义相似但不回答问题，Type II 时间上过时但与当前值冲突），构造 N=0 和 N=8 两个干扰水平。实现方面，用 Qwen3-8B 作为 manager model，对 incoming atomic memory 与每个 retrieved old memory 执行五分类 relation inference，根据 Table 1 的 deterministic policy 分配 Primary 和 Evidence 角色，跳过 fusion 模块直接使用 Primary atomic text 进行检索。Baseline 实现 Append-all（保留所有 candidates 独立检索）。测量方面，用 Qwen3-Embedding-0.6B 检索 top-k memories 并在 256-token budget 下 hard-truncate，用 DeepSeek-V4-Flash 作为 judge 评估 answer accuracy，同时计算 gold-source recall。如果 ROAM w/o Fusion 在 N=8 时 accuracy 显著高于 Append-all 且 gold-source recall 更高，则支持 relation-guided organization 能有效抑制干扰的 claim；如果两者表现相当或 ROAM 因 relation 误判而更差，则反驳该 claim。这个方案避免了 fusion 模块的实现复杂度，同时直接测试了 ROAM 最核心的机制。", "research_value": "### § 11 最强反例设计\n\n对 ROAM 最有力的攻击应针对其五类 semantic relation 的互斥性假设，提出一个基于“混合关系原子对”的真实场景反例。ROAM 的核心逻辑建立在 incoming-stored atom pair 可以被干净地映射为 IND、EQV、OSN、NSO 或 CON 中的某一类，并据此执行 deterministic policy。然而，在复杂的真实交互中，语义关系往往是多维度的。考虑这样一个医疗代理场景：stored memory 为“患者对青霉素过敏”，而 incoming observation 为“患者正在服用阿莫西林治疗呼吸道感染”。从 taxonomic 层面看，阿莫西林属于青霉素类，两者构成 OSN/NSO 的 directional subsuming 关系；但从临床状态层面看，当前的用药行为与既往过敏史构成严重的 CON 关系。如果 LLM manager 将其分类为 OSN 并将 incoming observation 设为 Primary，过敏史被降级为 Evidence，那么在检索时“正在服用阿莫西林”会挤占 context，而致命的过敏警告可能因未被 fusion 进 Primary view 而丢失；如果分类为 CON，系统又可能错误地覆写或抑制当前正在发生的治疗事实。这种分类失败提供了一种强有力的替代解释：ROAM 在 LongMemEval 上的性能提升，可能仅仅是因为该数据集的原子事实多为单维度属性（如位置、偏好），从而回避了多维度语义纠缠。一旦面对属性正交、关系混合的开放场景，ROAM 的 deterministic policy 将被迫做出错误的互斥选择，导致 role assignment 系统性崩溃，其表现甚至可能不如不进行任何干预的 Append-all 策略，因为后者至少保留了原始的 provenance 供下游 LLM 自行裁决。\n\n### § 12 Follow-up Research Idea\n\n基于 ROAM 在离散关系分类上的脆弱性，一个非增量的 novel research idea 是放弃互斥的 symbolic relation classification，转而引入 **Differentiable Memory State-Space Models (DM-SSM)**，将记忆管理从“离散分类与突变”重构为“连续状态空间内的概率演化”。驱动这个想法的局限是：LLM 难以可靠执行 OSN/NSO 等细粒度方向性判断，且强制将复杂语义交互映射为五类互斥关系会丢失多维度的上下文信息。我们可以借鉴控制论与序列建模领域（如 Mamba 或 Linear RNNs）的状态更新机制，将每条 atomic memory 视为状态空间中的一个连续向量。当 incoming observation 到来时，不要求 LLM 输出离散标签，而是通过一个轻量级投影网络计算 incoming embedding 与 stored memory vectors 之间的 continuous transition matrix，该矩阵能够同时表达 partial entailment、temporal decay 和 dimensional conflict。在此框架下，Primary 和 Evidence 的界限被打破，取而代之的是每条记忆在状态空间中的“激活势能”，检索时直接根据当前 query 在该连续状态空间中进行投影匹配。第一个实验将构造一个高密度多维度冲突的合成数据集（如前述医疗场景的规模化版本），比较传统离散分类框架（ROAM）与 DM-SSM 在处理 mixed-relation pairs 时的下游 answer accuracy 和 latent state trajectory 的稳定性。这一提议与已有工作的根本区别在于：它彻底移除了 LLM 作为 symbolic memory manager 的角色，将 semantic relation inference 隐式地吸收进一个可微分的连续状态更新过程中，从而绕过了中小模型在细粒度方向性推理上的认知瓶颈。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Jianjie Zheng\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Peng Lai\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Sijie Cheng\", \"affiliations\": [2, 3], \"markers\": []},\n    {\"name\": \"Jiehui Zhao\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Lei Yang\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Guanhua Chen\", \"affiliations\": [1], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Southern University of Science and Technology\"},\n    {\"id\": 2, \"name\": \"Tsinghua University\"},\n    {\"id\": 3, \"name\": \"RayNeo.AI\"},\n    {\"id\": 4, \"name\": \"Deepexi Technology Co. Ltd.\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal Contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding Author\"}\n  ]\n}\n```", "summary_translation": "长期 language-model agents 在跨交互过程中依赖于外部记忆。Atomic memories 尤为有用：其细粒度的语义边界能够实现精确检索以及观察结果之间的直接比较。然而，不断累积的 atoms 不可避免地会变得冗余、重叠或冲突。现有方法通常要求 LLM manager 直接添加、更新、删除或重写记忆，将语义解释、存储决策和内容生成耦合在一个容易出错的操作中。我们引入了 ROAM，这是一个 relation-guided 框架，它利用 atomicity 进行管理，同时允许更丰富的 answer-time 表示。ROAM 将输入的与存储的 atom 对分类为 independent、equivalent、directionally subsuming 或 conflicting，然后将观察结果组织为活跃的 Primary 和辅助的 Evidence 角色。随后，Fusion 将互补的细节和时间变化结合成紧凑的、潜在 non-atomic 的 views。仅检索 Primary views 用于回答，从而防止冗余或过时的 atoms 独立竞争。在不同的 models 和 evaluation settings 下，ROAM 将 answer accuracy 提高了最多 29.8 个百分点。Ablations 表明，不同的 relations 带来了互补的益处，并且在 role organization 之外，fusion 也带来了持续的增益。机制分析进一步发现，answer-critical source recall 提高了 15.6 个百分点，且 confounder-token share 降低了 11.5 个百分点。ROAM 在不同的 manager scales 下保持稳健。"}, {"title": "Subagents vs Agent Skills: Executing Reusable Knowledge for Long-Horizon Agentic Tasks", "arxiv_id": "2609.09233", "authors": "Wasu Top Piriyakulkij, Rachel Lawrence, Alicia Curth, Sushrut Karmalkar, Niranjani Prasad", "summary": "How can language model agents effectively leverage libraries of reusable knowledge to solve long-horizon tasks? Recent work has increasingly focused on agent skills: reusable capabilities represented as skill packages, i.e., multi-file bundles containing instructions, scripts, and other resources that help agents perform specific tasks. Agent skills are typically executed by loading their skill instructions into an agent's context and relying on the agent to follow them. As task horizons grow, however, this approach becomes increasingly brittle, because reasoning quality degrades as more information accumulates in the context window. We investigate an alternative approach in which skill packages are instead invoked as subagents. Rather than loading skill instructions into the main context, subagent execution spawns fresh context windows dedicated to solving individual subtasks. We show that subagent execution outperforms agent-skill execution when skill packages expose clear input-output contracts and their instructions encode the procedural knowledge needed to fulfill those contracts. The tradeoff is additional communication overhead, as extra tokens are required to coordinate between the main agent and its subagents. Our results show that the benefit of reusable knowledge depends not only on its content, but also on how it is organized and invoked.", "category": "cs.CL", "cluster": "Agent Memory \u0026 Knowledge Reuse", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文的核心研究问题是：在 long-horizon agentic tasks 中，language model agents 应该如何有效地执行 reusable knowledge libraries（特别是 agent skills）以避免 context overload 导致的性能退化？传统方法将 skill packages 中的 instructions 加载到 main agent 的 context window 中，由 LLM 自行遵循这些指令来执行任务。然而，随着任务跨度增加，context 中积累的 verbose tool inputs/outputs 和 intermediate reasoning 会导致 LLM reasoning quality 显著下降——这一现象已被证明与 bandwidth-limited attention 有关。论文提出将 skill packages 作为 subagents 调用：在独立的 context window 中初始化 skill instructions 并执行子任务，仅将最终 output 返回给 main agent，从而降低任意单个 context 所需处理的 peak context length。这个问题的重要性在于，long-horizon tasks 是现实场景中 agent 应用的关键需求，而 context overload 是制约 agents 可扩展性的核心瓶颈。解决这一问题不仅能提升 agents 在复杂任务上的准确性和鲁棒性，还能为构建模块化、可扩展的 agent 系统提供理论基础——subagent execution 本质上是一种通过明确接口实现 information encapsulation 的机制。\n\n### § 2 前人工作与不足\n\n在论文之前，agent skills 已成为向 LLM agents 注入 reusable, domain-specific knowledge 的主流方法（如 Anthropic 的 Agent Skills 框架）。这些方法将知识表示为 skill packages（包含 SKILL.md instructions、scripts 和 supporting resources），执行时将 instructions 加载到 main context 中，由同一 policy 在同一 context 中逐步完成。然而，这种方法在 long-horizon tasks 中存在根本性缺陷：加载 skill instructions 会进一步加剧 context overload，而 LLM 性能随 context 增长而退化，导致任务越长、性能越差——skill instructions 本应帮助 agent，却反而成为 context 的负担。另一方面，现有的 agent harnesses（如 Claude Code 和 OpenAI Codex）虽然支持 spawning subagents，但主要将其用于 task parallelization 以降低延迟，而非作为执行 reusable knowledge 的机制。因此，将 skill packages 作为 subagents 执行以控制 context 增长的潜力尚未被系统探索。此外，LLM skill learning 领域的工作（如 Voyager, LATM, CREATOR, CRAFT, SkillCraft 等）虽然致力于学习程序化技能或从 execution trajectories 中合成 skill packages，但无一例外采用 agent-skill execution 方式，未质疑这一执行范式在 long-horizon 场景下的局限性。更关键的是，现有的 curated skill packages（如 SkillsBench 中 human-authored 的包）大多缺乏明确的 input-output contracts，仅描述相关知识而未定义预期的输入和输出接口。这使得 subagent execution 难以有效实施——因为 main agent 无法准确判断何时应调用 subagent 以及应提供何种信息，subagent 也无法明确知道应返回什么。论文识别了这一关键缺口，指出只有当 skill packages 被设计为具有明确 input-output contracts 的 procedural knowledge（类比 reinforcement learning 中的 options framework）时，subagent execution 才能发挥优势，而此前的研究既未提出这一设计原则，也未实证验证 subagent execution 在控制 context 增长方面的价值。", "core_insight": "### § 3 重建作者的思考路径\n\n从已有背景出发，LLM agents 依赖 in-context learning 注入领域知识，而当前主流的 agent skills 机制通过将 skill packages 的指令加载到主 context 中来执行任务。然而，已有研究表明 LLM 的 reasoning 质量会随 context length 增加而显著退化，这在需要多步工具调用和大量中间推理的 long-horizon tasks 中尤为致命；context 本身就已经膨胀，再注入冗长的 skill instructions 无异于雪上加霜。与此同时，在强化学习的 options framework 中，skill 被视为由高层控制器调用的 temporally extended policy，具有明确的 initiation set 和 termination condition，这与当前简单将指令塞入 context 的做法形成鲜明对比。研究者可能进一步注意到，现有的 agent harnesses 虽然支持 subagents，但通常仅用于并行化以降低延迟，并未将其用于信息封装。如果借鉴 RL 中的思想，将 skill 作为一个独立子策略在隔离的 context 中执行，就能将子任务的内部轨迹隐藏起来，只向主 agent 返回最终输出，从而有效控制主 context 的增长。但要让这种委派生效，主 agent 必须知道何时调用以及传递什么信息，这就要求 skill 本身必须具备类似 option 的明确接口，即清晰的 input-output contracts 和 procedural knowledge。\n\n### § 4 核心 Intuition\n\n先前方法失效的根源在于将所有技能指令和子任务推理都堆积在同一个 context window 中，导致 long-horizon 任务中 context 膨胀并引发 LLM reasoning 质量崩塌。这篇论文的核心 intuition 是：如果将具备明确 input-output contracts 的 procedural skill 委派给独立的 subagent 执行，就能通过信息封装将冗长的子任务推理隔离在主 context 之外，仅返回最终结果。这种做法虽然牺牲了部分 token 用于主 agent 与 subagent 间的通信，但显著降低了主 agent 必须处理的 peak context length，从而避免了 context overload 带来的性能退化。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《Subagents vs Agent Skills: Executing Reusable Knowledge for Long-Horizon Agentic Tasks》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 论文的核心研究问题是：在 long-horizon agentic tasks 中，language model agents 应该如何有效地执行 reusable knowledge libraries（特别是 agent skills）以避免 context overload 导致的性能退化？传统方法将 skill packages 中的 instructions 加载到 main agent 的 context window 中，由 LLM 自行遵循这些指令来执行任务。然而，随着任务跨度增加，context 中积累的 verbose tool inputs/outputs 和 intermediate reasoning 会导致 LLM reasoning quality 显著下降——这一现象已被证明与 bandwidth-limited attention 有关。论文提出将 skill packages 作为 subagents 调用：在独立的 context window 中初始化 skill instructions 并执行子任务，仅将最终 output 返回给 main agent，从而降低任意单个 context 所需处理的 peak context length。这个问题的重要性在于，long-horizon tasks 是现实场景中 agent 应用的关键需求，而 context overload 是制约 agents 可扩展性的核心瓶颈。解决这一问题不仅能提升 agents 在复杂任务上的准确性和鲁棒性，还能为构建模块化、可扩展的 agent 系统提供理论基础——subagent execution 本质上是一种通过明确接口实现 information encapsulation 的机制。 ### § 2 前人工作与不足 在论文之前，agent skills 已成为向 LLM agents 注入 reusable, domain-specific knowledge 的主流方法（如 Anthropic 的 Agen...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 从已有背景出发，LLM agents 依赖 in-context learning 注入领域知识，而当前主流的 agent skills 机制通过将 skill packages 的指令加载到主 context 中来执行任务。然而，已有研究表明 LLM 的 reasoning 质量会随 context length 增加而显著退化，这在需要多步工具调用和大量中间推理的 long-horizon tasks 中尤为致命；context 本身就已经膨胀，再注入冗长的 skill instructions 无异于雪上加霜。与此同时，在强化学习的 options framework 中，skill 被视为由高层控制器调用的 temporally extended policy，具有明确的 initiation set 和 termination condition，这与当前简单将指令塞入 context 的做法形成鲜明对比。研究者可能进一步注意到，现有的 agent harnesses 虽然支持 subagents，但通常仅用于并行化以降低延迟，并未将其用于信息封装。如果借鉴 RL 中的思想，将 skill 作为一个独立子策略在隔离的 context 中执行，就能将子任务的内部轨迹隐藏起来，只向主 agent 返回最终输出，从而有效控制主 context 的增长。但要让这种委派生效，主 agent 必须知道何时调用以及传递什么信息，这就要求 skill 本身必须具备类似 option 的明确接口，即清晰的 input-output contracts 和 procedural knowledge。 ### § 4 核心 Intuition 先前方法失效的根源在于将所有技能指令和子任务推理都堆积在同一个 context window 中，导致 long-horizon 任务中 context 膨胀并引发 LLM reasoning 质量崩塌。这篇论文的核心 intuition 是：如果将具备明确 input-output contracts 的... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **Subagents vs Agent Skills: Executing Reusable Knowledge for Long-Horizon Agentic Tasks** **Wasu Top Piriyakulkij[*]**[1] **Rachel Lawrence**[2] **Alicia Curth**[2] **Sushrut Karmalkar**[2] **Niranjani Prasad**[2] Cornell University[1] Microsoft Research Cambridge[2] ## **Abstract** How can language model agents effectively leverage libraries of reusable knowledge to solve long-horizon tasks? Recent work has increasingly
