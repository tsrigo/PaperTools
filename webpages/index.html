entBench 是一篇基准测试（Benchmark）论文，其核心贡献在于数据集构建、环境搭建和评估协议的设计，而非提出新的数学模型或算法推导。文中涉及的公式仅为形式化定义任务元组 $T = \\{(C_i, I_i, V_i)\\}_{i=1}^N$ 和马尔可夫决策过程（MDP）的状态转移 $s_{t+1} = T(s_t, a_t)$，这些是强化学习和 Agent 领域的标准定义，不涉及复杂的理论推导或新颖的数学证明。\n\n### § 7 实验设计与结论\n\n**提出了什么问题？**\n现有的数据科学基准（如 DS-1000, MLAgentBench）仅评估代码生成的静态正确性，缺乏对 Agent 在真实计算机环境中进行多工具协调、长程推理和端到端工作流执行能力的评估。核心问题是：**AI Agent 能否在真实的操作系统环境中，自主完成从数据获取到模型验证的完整数据科学工作流？**\n\n**设计了什么实验验证这个问题？**\n1.  **构建 DSAgentBench**：创建了包含 275 个多样化任务的基准，覆盖数据科学全生命周期（数据获取、EDA、特征工程、建模、评估、可视化）。任务要求 Agent 在真实 OS 中操作 VS Code、Jupyter、终端和浏览器。\n2.  **多模型对比评估**：测试了 15 种主流 Agent，包括闭源模型（GPT-4o, Claude-4.6-Sonnet, Gemini-2.5-Pro 等）和开源模型（UI-TARS, GUI-OWL 等）。\n3.  **多模态观察消融**：对比了仅使用截图（Screenshot）与截图+无障碍树（Screenshot + A11y Tree）两种观察模态对性能的影响。\n4.  **细粒度错误分析**：手动检查失败案例，分析失败根源（如 Grounding 错误、代码逻辑错误、工具协调失败）和失败阶段（早期、中期、晚期）。\n\n**问题的答案是什么？**\n1.  **当前 Agent 能力严重不足**：即使是最强的闭源 Agent **Claude-4.6-Sonnet**，在最佳设置下（Screenshot + A11y Tree）的整体任务成功率仅为 **56.70%**，远低于人类专家（85.09%）。所有开源 Agent 的成功率均低于 **1%**。\n2.  **主要瓶颈在于 Grounding 和工具协调**：开源模型几乎全部失败于 **Grounding 错误**（无法正确识别 UI 元素），而强闭源模型则更多失败于代码逻辑、终端操作和长程推理。\n3.  **A11y Tree 有帮助但非万能**：引入结构化 UI 元数据（A11y Tree）能显著提升性能（如 Claude-4.6 从 50.55% 提升至 56.70%），表明结构化信息有助于解决视觉定位难题，但无法弥补推理和规划能力的缺陷。\n4.  **多阶段工作流极具挑战**：多阶段任务（Multi-Stage）的成功率显著低于单阶段任务，表明 Agent 在维持状态、错误恢复和跨工具协调方面存在巨大差距。\n\n结论指出，当前 Agent 距离真正的“自主数据科学家”仍有巨大鸿沟，DSAgentBench 为未来研究提供了关键的评估基础。", "additional_insights": "### § 8 Take-aways\n\nDSAGENTBENCH 填补了现有基准的空白，首次评估 Agent 在真实操作系统环境中执行端到端数据科学工作流的能力，而非仅测试静态代码生成或孤立技能。该基准包含 275 个涵盖数据获取、探索性数据分析、特征工程、建模及可视化的长程任务，要求 Agent 协调使用 VS Code、Jupyter Notebook、终端和浏览器等多种工具。实验结果显示，即使是最强的闭源模型 Claude-4.6-Sonnet，在结合截图与无障碍树（A11y Tree）观察下的任务成功率也仅为 56.70%，而所有开源 Agent 的成功率均低于 1%。错误分析表明，开源模型主要失败于 UI 接地（Grounding）错误，而高性能闭源模型则更多受限于代码逻辑、终端操作及长程推理中的状态管理问题。增加 A11y Tree 结构化元数据能显著提升 Agent 的交互鲁棒性，但并未根本解决复杂工作流中的规划与执行缺陷。该研究揭示了当前 Agent 系统在真实数据科学实践中的巨大能力差距，强调了从“代码生成”向“环境感知与工具编排”转变的必要性。\n\n### § 9 最脆弱的假设\n\n该研究最核心的假设是：**基于确定性脚本（Deterministic Python Evaluator）和固定阈值（如 0.95 成功率）的评估方式，能够准确且公平地衡量 Agent 在复杂、多步骤数据科学任务中的“分析正确性”与“工作流完成度”。**\n\n如果这一假设不成立，即评估器无法捕捉数据科学中常见的非确定性结果、合理的替代分析路径或细微的语义差异，那么 DSAgentBench 报告的极低成功率（如 56.70%）可能高估了 Agent 的失败程度，或者错误地将“有效但不同”的解决方案判定为失败，从而扭曲了对 Agent 实际能力的判断。\n\n**为何该假设可能不成立：**\n1.  **数据科学的非唯一性：** 许多数据分析任务（如特征工程、模型选择）没有唯一的“正确”代码路径。Agent 可能使用了不同的库、不同的预处理步骤或不同的模型架构，但达到了相同的分析目标。如果评估器仅检查特定文件是否存在或特定数值是否在极小容差内，可能会误判。\n2.  **数值稳定性与随机性：** 机器学习任务涉及随机种子、浮点运算差异等。即使逻辑正确，不同运行环境或库版本可能导致数值微小偏差，若评估器容差设置过严（如 $\\epsilon=0.01$），可能将正确结果判为错误。\n3.  **可视化评估的主观性：** 论文提到仅约 10% 的任务使用 LLM 作为视觉裁判，且仅在确定性验证通过后。然而，可视化任务的核心价值在于信息传达，而非像素级匹配。如果评估器过于关注标签格式而非图表语义，可能无法真实反映 Agent 的可视化能力。\n\n**论文提供的证据与缺失：**\n论文声称评估器是“确定性的”并验证“分析正确性”，且通过人类标注者（Human Performance 85.09%）作为基准来证明评估器的合理性。然而，论文未详细展示评估器如何处理“等效但不同”的解决方案（例如，Agent 使用 `pandas` 而基准使用 `sqlalchemy`，或 Agent 选择了不同的特征子集但模型性能相当）。此外，对于可视化任务，依赖 LLM 裁判引入了新的偏差风险，尽管论文提到使用交叉裁判（Gemini 裁判 GPT 输出），但未提供该裁判与人类专家评估的一致性分析。如果评估器过于僵化，DSAGENTBench 可能成为一个“通过特定测试”的基准，而非真实数据科学能力的反映。\n\n### § 10 最小复现实验\n\n**目标：** 验证 DSAgentBench 中“确定性评估器”对“等效但不同”解决方案的鲁棒性，即评估器是否过于僵化，导致将有效但路径不同的 Agent 输出误判为失败。\n\n**数据：** 从 DSAgentBench 中选取 10-20 个中等难度（Medium）的“Exploratory Data Analysis (EDA)”或“Feature Engineering”任务，这些任务通常有明确的数值输出但可能有多种实现路径。\n\n**实现：**\n1.  **获取基准答案：** 运行论文提供的官方基准解决方案，记录其生成的输出文件（如 CSV、TXT）及关键数值。\n2.  **构造“等效”变体：** 手动编写 2-3 个替代解决方案，这些解决方案在逻辑上正确且达到相同分析目标，但使用不同的方法（例如，使用 `numpy` 代替 `pandas` 进行计算，或使用不同的排序算法，或输出格式略有不同但语义一致）。\n3.  **运行评估器：** 将官方基准输出和手动构造的“等效”变体输出分别输入 DSAgentBench 的确定性评估器。\n\n**测量：**\n*   **通过率：** 记录官方基准输出和“等效”变体输出的评估得分。\n*   **误判率：** 计算“等效”变体被评估器判定为失败（得分 \u003C 0.95）的比例。\n\n**结果解释：**\n*   **支持 Claim：** 如果所有“等效”变体均获得高分（≥0.95），说明评估器具有良好的语义鲁棒性，能够识别不同的实现路径，DSAGENTBench 的低成功率确实反映了 Agent 的能力不足，而非评估器僵化。\n*   **反驳 Claim：** 如果显著比例（如 \u003E20%）的“等效”变体被判定为失败，说明评估器过于依赖特定实现细节或格式，DSAGENTBench 的评估结果可能高估了 Agent 的失败率，其作为“真实数据科学能力”基准的有效性受到质疑。\n\n此实验无需复现整个 Agent 系统或操作系统环境，仅需在本地运行评估脚本，成本低且能直接检验基准的核心评估机制。", "research_value": "### § 11 最强反例设计\n\n若要挑战 DSAgentBench 的有效性，最有力的攻击并非针对 Agent 的能力，而是针对其**评估协议（Evaluation Protocol）的“环境幻觉”与“路径依赖”缺陷**。核心论点在于：DSAgentBench 所声称的“真实环境”实际上是一个高度受控的、静态的“沙盒化桌面”，其评估器对**实现路径（Implementation Path）**的过度敏感，导致基准测量的不是“数据科学能力”，而是“对特定 GUI 交互序列和代码风格的记忆与复现能力”。\n\n具体反例设计如下：\n\n1.  **构建“语义等效但路径不同”的攻击样本（Semantic Equivalence Attack）**：\n    *   **场景**：选取一个典型的 EDA 任务，例如“计算某列数据的均值并保存”。\n    *   **标准路径**：Agent 使用 VS Code 编写 `pandas` 代码，通过 `Shift+Enter` 运行，结果打印在 Terminal，Agent 手动复制粘贴到 CSV。\n    *   **攻击路径**：Agent 直接打开 Terminal，使用 `awk` 或 `python -c` 一行命令完成计算并直接重定向输出到 CSV 文件，全程未打开 VS Code 或 Jupyter。\n    *   **预期结果**：如果 DSAgentBench 的评估器 $V_i$ 仅检查最终 CSV 文件内容，则两者应均得分。但如果评估器隐含地检查了“是否使用了指定工具”或“中间状态是否符合预期轨迹”（例如通过检查 VS Code 的进程是否存在或文件修改时间戳），攻击路径将被误判为失败。\n    *   **理论攻击**：证明 DSAgentBench 的“确定性评估器”实际上是一个**隐式轨迹验证器（Implicit Trajectory Verifier）**。在真实数据科学中，专家可能使用 SQL、R、Excel 或 Python，只要结果正确即可。如果基准强制要求特定的 GUI 交互序列（如必须点击某个按钮），则它测试的是 **GUI Navigation** 而非 **Data Science Reasoning**。这将揭示基准的 **Construct Validity（构念效度）** 缺陷：它混淆了“工具使用”与“领域知识”。\n\n2.  **利用“非确定性环境状态”制造评估崩溃**：\n    *   **场景**：涉及模型训练的任务，如“训练一个随机森林模型并报告 Accuracy”。\n    *   **攻击点**：机器学习具有内在随机性（Random Seed）。即使 Agent 的代码逻辑完全正确，由于浮点运算差异、库版本微小更新或硬件并行计算的非确定性，生成的 Accuracy 可能与 Ground Truth 存在微小偏差（如 0.8501 vs 0.8500）。\n    *   **预期结果**：如果评估器的容忍度 $\\epsilon$ 设置过严（如 $10^{-4}$），Agent 将因“数值漂移”被判定为失败。\n    *   **理论攻击**：指出 DSAgentBench 的 **Deterministic Evaluator** 假设数据科学任务是**函数式（Functional）**的，即输入决定唯一输出。然而，真实数据科学是**过程性（Procedural）**且**概率性（Probabilistic）**的。这种评估方式会导致 **False Negative Rate（假阴性率）** 极高，使得基准分数无法反映 Agent 的真实推理能力，而仅反映其对环境随机性的鲁棒性（这通常不是数据科学家的核心技能）。\n\n3.  **真实世界场景：动态依赖与网络波动**：\n    *   **场景**：任务要求从 Kaggle API 下载数据集。\n    *   **攻击点**：在真实环境中，网络可能超时、API 可能限流、依赖库可能版本冲突。\n    *   **预期结果**：Agent 可能需要执行“重试”、“切换镜像源”或“手动安装特定版本”等**元认知（Meta-cognitive）**操作。如果 DSAgentBench 的环境是预配置好的（Pre-configured），Agent 从未经历这些失败，那么它在真实部署中的成功率将远低于基准分数。\n    *   **理论攻击**：DSAgentBench 测试的是 **Happy Path（理想路径）** 下的执行能力，而非 **Robustness（鲁棒性）**。真实数据科学工作流中，50% 的时间花在调试环境依赖上。如果基准不包含这些“噪音”，则其 **Ecological Validity（生态效度）** 存疑，无法预测 Agent 在真实企业环境中的表现。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“静态评估”到“交互式验证”——构建基于反馈循环的自适应数据科学 Agent 基准（Adaptive Feedback-Driven Data Science Benchmark）**\n\n**（a）驱动局限与未满足需求：**\nDSAgentBench 的核心局限在于其**单向、静态的评估范式**：Agent 执行任务，评估器一次性打分。这忽略了真实数据科学中至关重要的**迭代反馈（Iterative Feedback）**机制。在现实中，数据科学家不会一次性生成完美代码，而是通过观察错误信息、中间结果、同行评审或业务反馈来修正工作流。当前基准无法评估 Agent 的**自我修正能力（Self-Correction Capability）**、**错误恢复（Error Recovery）**以及**基于反馈的推理（Feedback-Driven Reasoning）**。此外，DSAgentBench 的“确定性评估器”无法处理开放性问题，限制了基准对创造性分析路径的包容性。\n\n**（b）借鉴相邻领域的方法：**\n借鉴 **Reinforcement Learning from Human Feedback (RLHF)** 和 **Interactive Code Review** 领域的思想，以及 **Human-in-the-Loop (HITL)** 系统的设计。具体而言，引入一个**动态评估代理（Dynamic Evaluator Agent）**，该代理不是简单的脚本，而是一个具备领域知识的 LLM 或专家系统，能够：\n1.  **实时反馈**：在 Agent 执行过程中，提供中间结果的语义反馈（如“这个特征工程步骤引入了数据泄露”）。\n2.  **多轮对话**：允许 Agent 与评估器进行多轮交互，澄清需求或解释设计选择。\n3.  **模糊容忍**：接受多种等效解决方案，并基于“分析深度”、“代码可读性”、“模型性能”等多维度进行综合评分，而非单一的 Pass/Fail。\n\n**（c）第一个实验设计：**\n\n1.  **构建 Interactive DSAgentBench (i-DSBench)**：\n    *   在 DSAgentBench 的基础上，修改评估协议。不再使用静态的 $V_i$，而是引入一个 **Critique Agent**（基于强 LLM，如 Claude-4.6，经过数据科学专家提示词微调）。\n    *   任务设计为**开放式**：例如，“分析这份销售数据，找出影响销售额的关键因素，并提出改进建议”。没有唯一的 Ground Truth 代码或数值。\n\n2.  **实验设置**：\n    *   **基线**：DSAgentBench 的静态评估模式。\n    *   **新方法**：i-DSBench 的交互式评估模式。Agent 在执行过程中，每完成一个阶段（如数据清洗、EDA），Critique Agent 会生成反馈（如“你忽略了缺失值处理”）。Agent 需根据反馈调整后续步骤。\n    *   **对比组**：\n        *   **No-Feedback Agent**：Agent 仅根据初始指令执行，无中间反馈。\n        *   **Feedback-Driven Agent**：Agent 接收并整合 Critique Agent 的反馈。\n        *   **Human-in-the-Loop**：人类专家提供反馈。\n\n3.  **测量指标**：\n    *   **Convergence Rate（收敛速度）**：Agent 需要多少轮交互才能达到可接受的分析质量。\n    *   **Error Recovery Score（错误恢复得分）**：Agent 在收到负面反馈后，能否有效修正错误并继续推进。\n    *   **Solution Diversity（解决方案多样性）**：评估不同 Agent 在相同任务下生成的分析路径的多样性，验证基准是否鼓励创造性而非死记硬背。\n\n4.  **预期发现**：\n    *   静态评估下表现差的 Agent（如开源模型），在交互式反馈下可能表现出显著的**可塑性（Plasticity）**，即通过反馈逐步修正错误，最终达到较高质量。\n    *   这将揭示当前 Agent 的瓶颈不在于“一次性生成正确代码”，而在于“缺乏基于反馈的自我迭代能力”。\n    *   该研究将推动 Agent 研究从 **Code Generation（代码生成）** 转向 **Interactive Problem Solving（交互式问题解决）**，更贴近真实数据科学工作流。\n\n**与已有工作的区别：**\n*   **DSAgentBench**：静态、确定性、单轮、关注“最终结果正确性”。\n*   **i-DSBench**：动态、概率性、多轮、关注“过程质量与迭代能力”。\n*   **现有 GUI Benchmarks**：关注“操作正确性”，不涉及领域知识反馈。\n*   **现有 Code Benchmarks**：关注“代码语法与执行”，不涉及环境交互与迭代反馈。\n\n此研究不仅解决了 DSAgentBench 的评估僵化问题，还开辟了 **Interactive AI Agents** 在专业领域（如数据科学、软件工程）的新研究方向，强调 **Feedback Loop** 在提升 Agent 能力中的核心作用。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Mizanur Rahman\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"‡\",\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Mohammed Saidul Islam\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"‡\"\n      ]\n    },\n    {\n      \"name\": \"Ridwan Mahbub\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"‡\"\n      ]\n    },\n    {\n      \"name\": \"Md Tahmid Rahman Laskar\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"‡\"\n      ]\n    },\n    {\n      \"name\": \"Shafiq Joty\",\n      \"affiliations\": [\n        2,\n        3\n      ],\n      \"markers\": [\n        \"$\",\n        \"¶\"\n      ]\n    },\n    {\n      \"name\": \"Enamul Hoque Prince\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"‡\",\n        \"*\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"York University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Nanyang Technological University\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Salesforce AI Research\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"‡\",\n      \"text\": \"Equal contribution\"\n    },\n    {\n      \"marker\": \"*\",\n      \"text\": \"Corresponding authors: {mizanurr,enamulh}@yorku.ca\"\n    },\n    {\n      \"marker\": \"$\",\n      \"text\": \"Nanyang Technological University\"\n    },\n    {\n      \"marker\": \"¶\",\n      \"text\": \"Salesforce AI Research\"\n    }\n  ]\n}\n```", "summary_translation": "现实世界的数据科学涉及跨越数据整理、探索、建模、可视化和验证的长周期工作流，需要在真实操作环境中协调使用笔记本、IDE、终端、浏览器和数据库等工具。然而，现有的基准测试缺乏真实的计算机交互，无法评估智能体是否能在真实的计算环境中执行完整的端到端数据科学工作流，未能捕捉数据科学实践中多阶段、多工具的特性。我们提出了 DSAgentBench，这是第一个评估智能体是否能在真实计算机环境中自动化完整数据科学工作流的基准测试。DSAgentBench 包含 275 个多样化的任务，覆盖整个数据科学生命周期，反映了实践中所需的复杂性和工具协调性。每个任务都需要基于中间输出做出决策并协调使用工具，并包含一个确定性评估器，用于验证分析正确性、视觉输出和模型性能，而不仅仅是代码执行。我们对 15 个闭源和开源模型进行了广泛实验，结果显示，即使是最强的智能体 Claude-4.6-Sonnet，任务成功率也仅为 56.70%，而所有开源智能体的成功率均低于 1%，经常在工具编排、操作系统接地和多步推理方面失败。这些结果揭示了当前智能体系统与真实数据科学工作流之间存在巨大的能力差距，使 DSAgentBench 成为开发接地、可验证、自主数据科学智能体的基础。我们在 https://github.com/vis-nlp/DSAgentBench 发布了 DSAgentBench。"}, {"title": "UserToolBench: A User-Profile-Hidden Benchmark for Personalized Decision Making in Tool-Use LLMs", "arxiv_id": "2608.10042", "authors": "Xuexiong Yin, Zechuan Chen, Yongsen Zheng, Yuxiang Zhang, Jingyuan Yang, Bin Wang, Yubin Wang, Keze Wang", "summary": "Tool-use LLMs are increasingly asked to act on users' behalf, but existing benchmarks usually focus on profile recall, style imitation, generic tool use, or response-level personalization. We introduce UserToolBench , a benchmark for personalized decision making in tool-use LLMs. UserToolBench tests whether a model can infer latent user preferences from interaction history, recognize when clarification is needed, and produce user-aligned tool-call trajectories under incomplete information. The benchmark is built from privacy-sanitized real interaction traces and combines structured persona profiles, public API-style tool ecosystems, and long-horizon multi-turn trajectories. It includes 10 user profiles, 36 tool sets, 1,065 turns, 170 unique tools, and evaluation-focused task types covering lack-of-information, single-tool, and multi-tool settings. Experiments with strong tool-use LLMs show that current models still have difficulty with personalized delegation. Multi-tool coordination, missing-constraint inference, and long-horizon behavioral consistency remain major bottlenecks. These results suggest that personalization evaluation should move beyond asking whether outputs sound user-specific and instead ask whether LLMs make correct decisions for the users they represent.", "category": "cs.LG", "cluster": "Benchmarks \u0026 Evaluation of Agentic Capabilities", "tags": ["cs.LG"], "filter_reason": "该论文符合筛选标准，主要依据如下：\n\n1.  核心研究对象明确为 Tool-Use LLM Agents：论文标题和摘要明确指出研究对象是“Tool-Use LLMs”（工具使用大语言模型），并关注其在“Personalized Decision Making”（个性化决策）中的表现。这直接对应了筛选标准中“单智能体 (Agentic)”方向下的“工具使用 (Tool Use)”和“规划/决策”能力。\n\n2.  符合“评估基准”的保留规则：根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents ... 即使它主要是行为分析、评估基准 ... 只要结论直接帮助理解或改进智能体能力，也应保留”。UserToolBench 是一个专门针对工具使用智能体在长程、多轮交互中决策能力的基准测试，旨在诊断当前模型在“个性化委托”、“多工具协调”和“长程行为一致性”方面的瓶颈。这些结论直接服务于理解和改进智能体的核心能力。\n\n3.  涉及关键智能体机制：摘要中提到的“infer latent user preferences”（推断潜在用户偏好）、“recognize when clarification is needed”（识别何时需要澄清）以及“long-horizon multi-turn trajectories”（长程多轮轨迹），均属于智能体在复杂环境中进行感知、记忆利用和交互策略制定的核心机制。特别是“Clarification timing”（澄清时机）在筛选标准的“重要校准”中被明确列为倾向保留的方向。\n\n4.  排除项不适用：虽然论文涉及“User Profile”（用户画像），但这并非知识图谱（Graph）技术，而是作为智能体决策的上下文信息；虽然涉及隐私（privacy-sanitized），但核心贡献是评估智能体的决策能力，而非专门研究AI安全或防御（Security/Safety），因此不属于排除的安全类论文。\n\n综上，该论文通过构建新的基准来评估和改进工具使用智能体的决策与交互能力，完全契合“构建、改进、评估 LLM智能体”的研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在**Tool-use LLMs**（工具使用大语言模型）作为个人代理执行任务时，如何评估其在**Profile-Hidden**（用户画像隐藏）且信息不完整条件下的**Personalized Decision Making**（个性化决策制定）能力。具体而言，模型不能直接访问显式的用户画像（Explicit Profile），而必须从长期的交互历史（Interaction History）中推断出潜在的用户偏好（Latent User Preferences），并据此生成与用户行为一致的**Tool-Call Trajectories**（工具调用轨迹）。\n\n这一问题的重要性在于，现有的个性化评估大多局限于**Response-Level Personalization**（响应级个性化），即检查生成的文本是否在风格或内容上听起来像特定用户，或者仅关注**Profile Recall**（画像回忆）和**Style Imitation**（风格模仿）。然而，在实际的代理场景中，个性化不仅仅是文本生成的适配，更是**Executable Decision Making**（可执行决策制定）。用户请求往往省略了关键的决策约束（如预算、地点偏好、服务风格等），一个可靠的助手必须能够从历史中恢复这些约束，决定是否需要澄清（Clarification），并调用正确的工具参数。如果模型无法在隐藏画像的情况下做出正确的工具调用决策，即使其生成的回复看似个性化，也无法真正代表用户利益。解决这一问题能够推动评估标准从表面的“文本适配”转向深层的“行为对齐”，揭示当前模型在**Multi-Tool Coordination**（多工具协调）、**Missing-Constraint Inference**（缺失约束推断）和**Long-Horizon Behavioral Consistency**（长程行为一致性）方面的真实瓶颈，为构建真正可信的个人代理提供关键的评测基准。\n\n### § 2 前人工作与不足\n\n尽管已有大量研究涉及个性化语言建模和工具使用，但尚未有工作同时满足**Executable Tool Calling**（可执行工具调用）、**Persistent User Profiles**（持久化用户画像）、**Long-Horizon Reasoning**（长程推理）和**Realistic User-Agent Interaction**（真实用户-代理交互）这四个核心要求。\n\n在**Personalization Benchmarks**方面，如**LaMP** [Salemi et al., 2024] 和 **Personalens** [Zhao et al., 2025]，主要评估基于画像的文本生成、推荐或响应适应。这些工作虽然证明了用户特定上下文的价值，但其评估停留在**Response-Level**，并未测试模型是否能为用户做出可执行的决策（如调用API）。在**Tool-Use Benchmarks**方面，如**API-Bank** [Li et al., 2023]、**ToolLLM** [Qin et al., 2024] 和 **WildToolBench** [Yu et al., 2026]，重点评估工具选择、参数构建和任务完成能力，但它们通常假设指令是完整指定的，且缺乏**Persistent User Profiles**，因此无法测试模型对潜在用户偏好的敏感性。\n\n最近的**Personalized Tool-Use Benchmarks**，如**PEToolBench** [Xu et al., 2025]、**PTBench** [Huang et al., 2025]、**ToolSpectrum** [Cheng et al., 2025] 和 **ETAPP** [Hao et al., 2025]，尝试将用户画像与工具调用结合。然而，这些基准通常存在以下不足：\n1.  **缺乏长程交互与真实对话风格**：如**PTBench**和**ToolSpectrum**虽然引入了固定画像，但缺乏**Long-Horizon**的多轮跨话题推理，且交互轨迹往往是孤立的、完全指定的指令，而非反映真实沟通风格的**Realistic Interaction**。\n2.  **画像可见性假设**：大多数现有基准在评估时向模型提供显式的用户画像或历史摘要，这使得模型可以通过直接复制画像信息（Direct Profile Copying）来完成任务，而非真正从历史中推断（Infer）偏好。\n3.  **评测维度单一**：现有工作未能联合评估**Preference Inference**（偏好推断）、**Clarification Behavior**（澄清行为）和**Tool-Call Trajectory Alignment**（工具调用轨迹对齐）。例如，**τ-bench** [Yao et al., 2024] 虽然涉及长程交互和真实环境，但缺乏对持久化用户画像的显式建模和个性化决策的针对性评估。\n\n因此，现有研究未能清楚定义并评估**Profile-Hidden**设置下的个性化决策能力，即模型在无法直接访问画像时，如何仅凭交互历史做出符合用户长期偏好的可执行决策。**UserToolBench** 通过引入**Profile-Hidden Evaluation Protocol**，填补了这一评测缺口，强制模型进行基于历史的偏好恢复，从而更真实地反映个人代理在实际部署中的能力瓶颈。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Tool-use LLM 和 Personalization 两个领域快速发展的背景下，研究者观察到现有的评估体系存在明显的割裂。一方面，传统的 Tool-use Benchmarks（如 API-Bank, ToolBench）主要关注模型能否正确解析指令并调用 API，其假设是用户指令是完整且明确的（fully specified），忽略了真实场景中用户往往省略关键约束（如预算、偏好）的情况。另一方面，Personalization Benchmarks（如 LaMP, PTBench）虽然关注用户画像，但大多停留在文本生成的风格模仿或简单的推荐排序上，缺乏对“可执行决策”（executable decisions）的评估，即模型是否真的根据用户偏好改变了工具调用的逻辑。\n\n更深层的问题在于，现有的个性化工具使用基准（如 PEToolBench, ToolSpectrum）通常采用“Profile-Visible”的设定，即直接将用户画像作为 Prompt 的一部分输入给模型。这种设定导致模型可能只是简单地“复制”或“检索”画像中的信息，而不是通过多轮交互历史（Interaction History）去“推断”（infer）用户的潜在偏好。在真实的助手场景中，用户不会每次都重复自己的偏好，助手需要从长期的、隐式的交互中恢复这些偏好，并在信息不完整时决定是澄清（clarification）还是基于历史推断行动。\n\n此外，现有的基准大多缺乏 Long-horizon 的评估，即无法测试模型在长对话中是否保持行为的一致性（behavioral consistency）。如果模型在对话初期记住了偏好，但在后期因为上下文窗口限制或注意力分散而遗忘，现有的单轮或短轮次基准无法捕捉这一失败模式。因此，研究者意识到需要一个能够同时结合“隐藏画像”（Profile-Hidden）、“长程交互”（Long-Horizon）、“真实工具调用”（Executable Tool Use）和“不完整信息推理”（Incomplete Information Reasoning）的基准，以真正评估模型作为“个性化代理人”（Personalized Delegate）的能力，而不仅仅是作为一个“个性化文本生成器”。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 在于：真正的个性化决策能力不应体现为模型对显式用户画像（Explicit Profile）的记忆或复述，而应体现为模型在画像隐藏（Profile-Hidden）的情况下，仅凭交互历史（Interaction History）推断出用户潜在偏好，并据此做出正确的工具调用（Tool-Call）和澄清行为（Clarification）的能力。\n\n先前方法失效是因为它们要么将个性化简化为文本风格的适配，要么允许模型直接访问画像从而掩盖了推理能力的缺失；而 UserToolBench 奏效的关键在于它强制模型在信息不完整（Incomplete Information）的长程交互中，通过“历史 grounding”来恢复决策关键约束，从而区分了“表面上的个性化响应”与“实质上的个性化代理决策”。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nUserToolBench 的核心方法在于构建一个 **Profile-Hidden Evaluation Protocol**（隐藏用户画像的评估协议），旨在测试大语言模型（LLM）在无法直接访问用户结构化画像（User Profile）的情况下，仅凭历史交互记录（Interaction History）推断潜在偏好并执行工具调用（Tool-Use）的能力。其数据合成与评估的完整 Pipeline 如下：\n\n1.  **数据合成阶段（Data Synthesis）：基于画像的参考轨迹生成**\n    *   **输入**：经过隐私脱敏的真实交互痕迹抽象而成的结构化 **Persona Profile**（包含人口统计、沟通风格、偏好类别、任务习惯等），以及场景化的 **Tool Ecosystem**（工具集）。\n    *   **处理**：\n        *   **User Simulator**：根据 Persona Profile 生成符合用户特征的多轮对话请求（User Request）。这些请求通常是信息不完整的（Incomplete Information），例如省略预算或地点偏好，模拟真实场景中用户不会重复所有约束的情况。\n        *   **Reference Trajectory Generator**：作为“理想助手”，它拥有完整的 Persona Profile 访问权限。它根据当前请求、历史上下文和可用工具，生成标准的 **Tool-Call Trajectory**（工具调用轨迹）。这包括决定是否需要澄清（Clarification）、选择哪些工具、传递什么参数，以及如何处理工具返回的观察结果（Observations）。\n        *   **Checker \u0026 Human Verification**：通过 LLM 检查和人工验证，确保生成的轨迹在逻辑上有效、与用户偏好一致，且工具调用参数正确。\n    *   **输出**：包含多轮交互上下文、可用工具集和参考决策轨迹（Reference Decision Trajectory）的数据集实例。\n\n2.  **评估阶段（Evaluation）：隐藏画像的模型推理**\n    *   **输入**：被测试的 LLM **不接收** 显式的 Persona Profile。它仅接收：\n        *   累积的 **Interaction History**（历史对话记录）。\n        *   当前的 **User Request**（当前请求）。\n        *   可用的 **Tool Schemas**（工具定义）。\n    *   **处理**：\n        *   **Preference Inference**：模型必须从历史交互中推断出缺失的用户特定约束（如预算上限、服务风格偏好）。\n        *   **Decision Making**：模型决定是发起澄清请求（Clarification Query），还是基于推断的偏好直接执行工具调用。\n        *   **Tool Execution Planning**：生成具体的工具调用序列（Tool-Call Sequence），包括工具名称、参数值以及多步工具间的依赖关系。\n    *   **输出**：预测的工具调用轨迹 $\\hat{y}$。\n\n3.  **评估指标计算（Metric Calculation）**\n    *   **Exact Trajectory Accuracy**：严格比对预测轨迹与参考轨迹。对于单工具任务，要求工具名和关键参数完全匹配；对于多工具任务，要求调用顺序和参数完全匹配；对于信息缺失任务，要求正确判断是否需要澄清或能否从历史中推断。\n    *   **Relaxed Task Completion Accuracy**：宽松评估。只要模型调用了有效的工具、生成了可执行的调用，并完成了表面任务请求（即使参数或顺序与参考轨迹不同但合理），即视为正确。这用于区分“通用任务完成能力”与“个性化决策对齐能力”。\n\n**真实例子讲解：**\n假设用户是一位注重性价比的旅行者（Persona Profile 中隐含“偏好经济型酒店”和“避免周末入住”）。\n*   **历史交互**：用户之前提到过“下周要去上海出差，尽量避开周五晚上”。\n*   **当前请求**：“帮我订上海附近的酒店。”（未提及日期和预算，信息不完整）。\n*   **参考轨迹（合成时可见 Profile）**：助手知道用户偏好经济型且避开周五，因此调用 `search_hotels(location=\"Shanghai\", check_in=\"Saturday\", style=\"budget\")`。\n*   **模型评估（隐藏 Profile）**：\n    *   **优秀模型**：从历史中推断出“避开周五”和“出差（可能隐含预算敏感）”，调用 `search_hotels(location=\"Shanghai\", check_in=\"Saturday\", style=\"budget\")`。结果：Exact Match。\n    *   **普通模型**：仅看到“上海”，调用 `search_hotels(location=\"Shanghai\")` 或随机选择 `check_in=\"Friday\"`。结果：Exact Mismatch，但可能 Relaxed Acc 通过（如果完成了搜索动作）。\n    *   **失败模型**：无法推断日期，直接询问用户“请问您想住哪一天？”（如果历史中已隐含周六，则属于过度澄清，导致 Exact Mismatch）。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的理论数学推导，其核心贡献在于**任务形式化（Task Formulation）**和**评估协议的设计**。\n\n*   **形式化定义**：\n    论文将个性化决策制定（Personalized Decision Making）形式化为一个在信息不完整条件下的序列工具使用问题。\n    *   设 $p \\in \\mathcal{P}$ 为持久用户画像（Persistent User Profile）。\n    *   $h \\in \\mathcal{H}$ 为历史交互轨迹。\n    *   $q$ 为当前请求。\n    *   $T \\in \\mathcal{T}$ 为可用工具生态系统。\n    *   **参考轨迹生成**：$y^\\star = f_{ref}(p, h, q, T)$，其中 $p$ 对参考生成器可见。\n    *   **模型预测轨迹**：$\\hat{y} = f_{model}(h, q, T)$，其中 $p$ 对模型隐藏。\n    *   **核心不对称性**：模型必须从 $h$ 中恢复 $p$ 中的相关信息，以生成与 $y^\\star$ 对齐的 $\\hat{y}$。\n\n*   **Intuition**：\n    这个形式化的直觉在于区分“显式条件生成”与“隐式偏好推断”。传统个性化基准通常直接提供 $p$ 给模型，测试模型是否能“记住”或“模仿”画像。而 UserToolBench 通过隐藏 $p$，强制模型执行**推理（Inference）**过程：即从非结构化的历史对话 $h$ 中提取结构化的约束条件，并将其应用于当前的工具调用决策中。这模拟了真实世界中助手无法随时查阅用户档案，只能依靠记忆（上下文窗口）来服务用户的场景。\n\n### § 7 实验设计与结论\n\n**提出了什么问题：**\n现有的工具使用基准（Tool-Use Benchmarks）和个性化基准（Personalization Benchmarks）通常是分离的，或者仅评估表面化的响应个性化（如语气模仿），缺乏对**个性化决策制定（Personalized Decision Making）**的联合评估。具体而言，现有工作未能同时评估：可执行的工具调用、持久用户画像、长程推理以及真实用户-代理交互。核心问题是：LLM 能否在隐藏用户画像的情况下，仅凭历史交互推断潜在偏好，并做出正确的个性化工具调用决策？\n\n**设计了什么实验验证这个问题：**\n1.  **构建 UserToolBench 基准**：包含 10 个用户画像、36 个工具集、1,065 轮对话。任务类型涵盖信息缺失（Lack-of-Information）、单工具（Single-Tool）和多工具（Multi-Tool）场景。\n2.  **Profile-Hidden 评估协议**：测试 9 个主流 LLM（如 GPT-5.4, GLM-5, DeepSeek V4 Pro 等），在评估时隐藏显式用户画像，仅提供历史交互和工具定义。\n3.  **多维度指标分析**：\n    *   **Exact Trajectory Accuracy**：严格评估个性化决策的对齐程度。\n    *   **Relaxed Task Completion Accuracy**：评估通用任务完成能力，以区分“能做对事”和“能按用户喜好做事”。\n    *   **错误诊断**：通过多标签分析（Multi-Label Failure Analysis）和严重性审计（Severity-Aware Diagnostics），分析错误类型（如选错工具、违反约束、序列依赖错误等）。\n    *   **长程一致性测试**：分析轨迹位置（First/Mid/Last Third）对性能的影响，评估模型在长历史中的偏好保持能力。\n\n**问题的答案是什么：**\n1.  **当前模型在个性化委托方面表现不佳**：即使是最强的模型（如 GLM-5），平均 Exact Accuracy 也仅为 49.36%，表明模型难以可靠地从历史中恢复画像条件化的参考轨迹。\n2.  **任务完成不等于个性化对齐**：Relaxed Accuracy 显著高于 Exact Accuracy（例如 DeepSeek V4 Pro 分别为 72.55% 和 42.49%）。这说明模型能完成通用任务，但经常忽略用户特定的偏好约束（如预算、风格），导致决策与用户期望不符。\n3.  **多工具协调是主要瓶颈**：多工具任务（Multi-Tool）的准确率远低于单工具任务，表明模型在处理长程依赖、中间结果传递和偏好保持方面存在严重困难。\n4.  **信息缺失下的偏好推断能力不足**：在 Lack-of-Information 任务中，模型难以判断何时应澄清、何时应从历史推断，表现出过度推断或过度澄清的问题。\n5.  **长历史并不自动带来更好的个性化**：部分模型在对话后期性能下降，表明模型难以从长历史中筛选出相关的稳定偏好信号，反而受到无关细节的干扰。\n\n结论指出，个性化评估应从“响应是否听起来像用户”转向“LLM 是否能为其代表的用户做出正确的可执行决策”。", "additional_insights": "### § 8 Take-aways\n\nUserToolBench 提出了 **profile-hidden** 评估协议，强制 LLM 仅从交互历史（interaction history）中推断隐式用户偏好，而非直接读取结构化用户画像（structured persona profiles），从而更真实地模拟个性化代理（personalized agent）的决策场景。该基准通过 **tool-call trajectories** 而非表面文本生成来衡量个性化，强调模型必须在信息不完整（incomplete information）的情况下，正确选择工具、参数及澄清行为（clarification behavior）。实验表明，当前最强模型在 **multi-tool coordination** 和 **missing-constraint inference** 上表现极差，且 **Relaxed Task Completion Accuracy** 与 **Exact Trajectory Accuracy** 之间存在巨大鸿沟，证明模型能完成通用任务但无法对齐特定用户的深层偏好。长程交互（long-horizon interaction）并未自动提升性能，部分模型在后期阶段因注意力分散于无关历史细节而导致 **behavioral consistency** 下降，揭示了 **user-state tracking** 仍是核心瓶颈。\n\n### § 9 最脆弱的假设\n\n该研究最关键的假设是：**基于单一参考轨迹（single reference trajectory）的精确匹配（Exact Matching）能够有效代理个性化决策的正确性，且偏离该轨迹通常意味着实质性的偏好违背而非等效的替代方案。** 这一假设在实际中可能不成立，因为对于同一个用户请求和偏好，可能存在多条语义等效且均符合用户利益的工具调用路径（equivalent tool-call paths），而基准仅保留了一条经过验证的参考路径。如果模型选择了另一条同样合理但未在参考集中出现的路径，会被判定为错误，从而低估模型的真实能力。论文通过 **Severity-Aware Decision Diagnostics** 提供了一定证据，显示大部分错误属于 **Major Decision Deviation**（如选错工具、违反约束）而非 **Slight Preference Deviation**，试图证明精确匹配的错误具有实质性意义。然而，论文也承认 **multi-reference or equivalence-class evaluation** 是一个未解决的开放问题，且缺乏对“等效但不同”轨迹的系统性量化分析，因此该假设在复杂多工具场景下的有效性仍存疑，可能导致对模型个性化能力的系统性低估。\n\n### § 10 最小复现实验\n\n在 1 周内，可复现 **Appendix A** 中的定性案例研究，以验证 **history-grounded preference inference** 的必要性。使用提供的 **GPT-5.4** 或 **DeepSeek V4 Pro** API，构建一个包含特定用户画像（如 Midwest Home Decor 创始人）和长程交互历史的上下文，其中历史明确提及了竞争对手 GreenLeaf 在 36Kr 的报道，但当前请求故意省略文章 URL。实现一个包含 `searchArticles` 和 `getArticleMetadata` 的工具环境，测量模型是否先调用搜索工具获取 URL 再获取元数据（正确轨迹），还是直接猜测 URL 调用元数据工具（错误轨迹）。若模型跳过搜索步骤直接调用 `getArticleMetadata` 并填入幻觉或错误 URL，则支持论文关于“模型缺乏基于历史的 grounding 能力”的 claim；若模型能正确执行搜索-获取序列，则反驳该特定案例下的结论。此实验无需构建完整基准，仅需复现单轮多步工具调用逻辑，即可验证 **profile-hidden** 设置下模型对隐式约束的恢复能力。", "research_value": "### § 11 最强反例设计\n\n针对 UserToolBench 的核心假设——即“单一参考轨迹（Single Reference Trajectory）的精确匹配（Exact Matching）能有效代理个性化决策的正确性”，最有力的反例设计应聚焦于**等效工具调用路径（Equivalent Tool-Call Paths）的多样性**与**动态偏好演化（Dynamic Preference Evolution）**。\n\n首先，在真实世界的 **Tool Ecosystem** 中，完成同一用户意图往往存在多条语义等效但结构不同的 **Tool-Call Trajectories**。例如，用户要求“预订下周去上海的便宜酒店”，参考轨迹可能是先调用 `search_flights` 再调用 `search_hotels`，而模型可能选择先调用 `search_hotels` 再根据酒店位置调用 `search_flights`，或者使用一个聚合型工具 `search_travel_package`。UserToolBench 的 **Exact Trajectory Accuracy** 会将后两种合理且符合用户偏好的行为判定为错误，从而系统性低估模型的 **Personalized Decision Making** 能力。这种“路径依赖”偏差意味着高准确率并不一定代表更好的个性化，而低准确率可能仅反映模型选择了不同的等效策略。\n\n其次，UserToolBench 假设用户偏好是静态且可从历史中完全恢复的，但这忽略了**偏好漂移（Preference Drift）**和**情境依赖性（Context-Dependency）**。在长程交互中，用户的偏好可能随时间或具体情境发生微妙变化。例如，用户过去偏好“经济型酒店”，但在当前“商务出差”情境下可能临时偏好“高端酒店”。如果参考轨迹基于静态 **Persona Profile** 生成，而模型基于最新交互历史推断出情境化的偏好变化，模型的行为可能更符合用户当前利益，却被基准判定为偏离。这种**静态画像与动态行为之间的错位**，使得基准无法区分“错误的个性化”与“更敏锐的情境感知”。\n\n最后，**Clarification Behavior** 的评估存在二元化缺陷。基准将“是否需要澄清”视为一个确定性问题，但在真实场景中，澄清的价值取决于**信息熵（Information Entropy）**和**用户容忍度**。模型可能选择直接调用工具并附带“如果不符合请告诉我”的试探性回复，而非显式澄清。这种**Implicit Clarification** 或 **Proactive Execution with Fallback** 策略在用户体验上可能更优，但会被 **Exact Trajectory Accuracy** 惩罚。因此，UserToolBench 可能奖励那些机械遵循参考轨迹的模型，而惩罚那些更具适应性、能处理模糊性的智能代理，从而误导对模型真实能力的评估。\n\n### § 12 Follow-up Research Idea\n\n基于 UserToolBench 在**单一参考轨迹评估**和**静态偏好假设**上的局限，提出一个全新的研究方向：**Dynamic Preference Alignment via Multi-Reference Equivalence Classes (DPA-MREC)**。\n\n**(a) 驱动局限与未满足需求：**\n现有工作将个性化视为对固定 **Persona Profile** 的回忆或模仿，忽略了偏好的**动态性（Dynamism）**和**多解性（Multi-solution Nature）**。真实用户代理需要在不确定的偏好空间中导航，而非匹配单一正确答案。我们需要一种评估框架，能够量化模型在**偏好演化（Preference Evolution）**过程中的对齐能力，并识别**语义等效的工具调用路径（Semantically Equivalent Tool-Call Paths）**，从而区分“策略差异”与“偏好违背”。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴**强化学习（Reinforcement Learning, RL）**中的**偏好学习（Preference Learning）**和**多目标优化（Multi-Objective Optimization）**方法。具体而言，引入**Pairwise Preference Optimization (PPO)** 的思想，不评估模型是否匹配单一参考轨迹，而是评估模型生成的轨迹是否在**用户效用函数（User Utility Function）**下优于其他候选轨迹。同时，借鉴**程序合成（Program Synthesis）**中的**语义等价性检测（Semantic Equivalence Checking）**，构建一个**Tool-Call Graph**，将不同的工具调用序列映射到相同的**意图状态（Intent State）**，从而定义**等效类（Equivalence Classes）**。\n\n**(c) 第一个实验设计：**\n构建一个**Dynamic Preference Benchmark (DPBench)**，其中用户偏好随交互轮次动态变化（例如，从“预算敏感”逐渐转向“时间敏感”）。实验步骤如下：\n1.  **生成多参考轨迹**：对于每个用户请求，使用多个不同的 **Reference Trajectory Generators**（具有不同策略偏好，如“激进执行”、“保守澄清”、“多步规划”）生成一组参考轨迹，形成**等效类**。\n2.  **效用建模**：定义一个基于用户历史反馈的**隐式效用函数（Implicit Utility Function）**，通过 **LLM-as-a-Judge** 对模型生成的轨迹与参考轨迹进行**Pairwise Comparison**，评估其在**偏好一致性（Preference Consistency）**和**任务效率（Task Efficiency）**上的相对优劣。\n3.  **动态对齐评估**：测量模型在长程交互中，其 **Tool-Call Trajectories** 如何随**偏好漂移**而调整。计算**Preference Alignment Score**，不仅看最终结果，还看中间决策是否与当前推断的偏好状态一致。\n4.  **对比实验**：将 DPA-MREC 与 UserToolBench 的 **Exact Trajectory Accuracy** 进行对比，验证 DPA-MREC 是否能识别出那些在 UserToolBench 中被误判为错误、但在语义上等效或更优的模型行为。\n\n这一方向将个性化评估从“静态匹配”转向“动态对齐”，从“单一正确答案”转向“多解空间优化”，更真实地反映个人代理在复杂、动态环境中的决策能力。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Xuexiong Yin\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zechuan Chen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yongsen Zheng\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yuxiang Zhang\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jingyuan Yang\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Bin Wang\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yubin Wang\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Keze Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Sun Yat-Sen University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Nanyang Technological University\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Huawei Noah’s Ark Lab\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding authors\"\n    }\n  ]\n}\n```", "summary_translation": "Tool-use LLMs 越来越多地被要求代表用户采取行动，但现有的基准测试通常侧重于档案回忆、风格模仿、通用工具使用或响应级别的个性化。我们引入了 UserToolBench，这是一个用于评估 tool-use LLMs 中个性化决策能力的基准测试。UserToolBench 测试模型是否能够从交互历史中推断出潜在的用户偏好，识别何时需要澄清，以及在信息不完整的情况下生成与用户对齐的 tool-call 轨迹。该基准测试基于经过隐私处理的真实交互轨迹构建，结合了结构化的人物档案、公共 API 风格的工具生态系统以及长周期的多轮对话轨迹。它包含 10 个用户档案、36 个工具集、1,065 轮对话、170 个独特工具，以及涵盖信息缺失、单工具和多工具场景的以评估为重点的任务类型。对强大的 tool-use LLMs 进行的实验表明，当前模型在个性化委托方面仍存在困难。多工具协调、缺失约束推断以及长周期行为一致性仍然是主要瓶颈。这些结果表明，个性化评估不应仅仅停留在询问输出是否听起来具有用户特异性，而应转而询问 LLMs 是否为其所代表的用户做出了正确的决策。"}, {"title": "Recovering Wasted Compute in Autoresearch Agents", "arxiv_id": "2608.10424", "authors": "Au Kwok Chun, Abhigyan Acherjee, Amrutha Rao, Zaiqian Chen, Kazem Meidani, C. Bayan Bruss, Micah Goldblum", "summary": "A slew of recent works develop agents for solving research problems end-to-end, a paradigm increasingly referred to as autoresearch. Such agents have inspired large industry investment, motivated by their potential to automate time-consuming human labor and customize machine learning solutions for specialized applications. In this paper, we study the modeling pipeline at the core of these autoresearch systems and identify common failure modes when they are applied to tabular datasets: (1) they waste compute resolving the same bugs over and over again; (2) they often fail to tune hyperparameters even when they have a large remaining compute budget; (3) the tree-search algorithms that power them do not explore; and (4) they perform data analysis, mimicking the humans whose data they are trained on, but do not use that analysis to make downstream decisions. We explore targeted interventions and find that a global debug consultant that shares discovered runtime constraints across all branches of the search tree, prompt- and control-level enhancements, and refined tree-search algorithms successfully recover wasted compute. Our results show that large gains in autoresearch agent performance are achievable through agentic design alone, holding the underlying language model fixed.", "category": "cs.LG", "cluster": "Benchmarks \u0026 Evaluation of Agentic Capabilities", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=12 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文完全符合“构建、改进、评估 LLM智能体”的研究范围，具体依据如下：\n\n1.  核心对象明确：论文的研究对象是“Autoresearch Agents”（自动研究智能体），属于典型的 LLM-based Agents 和 Long-Horizon Agents（长视界决策智能体）。\n2.  核心贡献在于智能体机制改进：论文并非简单应用现有框架，而是深入分析了智能体在建模流水线中的失败模式（如重复调试、缺乏探索、未利用数据分析结果），并提出了具体的智能体设计改进方案（Agentic Design）。这些方案包括：\n       全局调试顾问（Global debug consultant）：这是一种跨搜索树分支共享运行时约束的机制，涉及记忆（Memory）和知识共享。\n       提示与控制层面的增强（Prompt- and control-level enhancements）：涉及系统提示（System Prompt）和执行环境（Execution Environment）的优化。\n       改进的树搜索算法（Refined tree-search algorithms）：涉及智能体的规划（Planning）和推理策略。\n3.  符合筛选标准中的保留项：\n       符合“保留：如果论文研究 agent 的 harness / scaffold / runtime ... 并且核心贡献是让这些智能体运行组件通过轨迹、反馈、观测或评估结果自动改进、演化或自适应优化”。论文通过干预措施“恢复浪费的计算”，本质上是优化智能体的执行效率和决策质量。\n       符合“保留：如果论文的研究对象明确是 LLM Agents ... 即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留”。论文通过诊断失败模式并提出针对性干预，直接提升了智能体性能。\n4.  排除项检查：\n       不涉及安全、对齐、可解释性等排除领域。\n       不涉及多智能体拓扑或通信协议等系统工程排除项（虽然提到“consultant”，但这是单智能体内部或辅助模块的机制，而非多智能体系统的拓扑编排）。\n       虽然涉及表格数据（Tabular datasets），但这只是应用场景，核心贡献在于智能体本身的机制设计，而非领域特定的非演化应用。\n\n综上，该论文通过改进智能体的规划、记忆共享和执行控制机制来提升性能，属于典型的 Agentic AI 机制研究，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文针对的核心研究问题是：在基于大语言模型（LLM）的 **Autoresearch** 代理系统（特别是应用于表格数据的机器学习工程任务）中，如何识别并消除导致计算资源（Compute）被无效浪费的常见失败模式，从而在不更换底层模型的前提下显著提升代理的性能与可靠性。具体而言，作者指出了当前主流基于树搜索（Tree-search）的代理框架存在的四大痛点：(1) 由于搜索树分支间缺乏记忆共享，代理在不同分支中重复修复相同的运行时错误（Bug），造成严重的计算冗余；(2) 代理往往在预算耗尽前过早终止搜索，未能充分利用剩余预算进行系统的超参数优化（Hyperparameter Tuning, HPO）；(3) 现有的树搜索算法缺乏有效的探索机制，容易陷入死胡同；(4) 代理虽然执行探索性数据分析（EDA），但未能将分析结果有效转化为下游建模决策。\n\n这一问题的重要性在于，随着工业界对 **Autoresearch** 代理的大规模投资，这些系统被期望能够自动化耗时的人工劳动并定制机器学习解决方案。然而，当前的代理系统在执行端到端研究循环时表现出极高的不稳定性：频繁超时、浪费计算预算以及产出次优的通用解决方案。由于 LLM 的 API 调用成本高昂，计算效率直接决定了这些系统的经济可行性和实际部署潜力。如果代理无法高效利用其计算预算，其实际性能将远低于底层 LLM 的理论上限。解决这一问题不仅能通过结构化的代理设计（Agentic Design）回收被浪费的计算资源，还能证明无需升级更昂贵的底层模型即可实现性能的大幅跃升，这对于降低自动化数据科学的门槛和成本具有显著价值。\n\n### § 2 前人工作与不足\n\n在本文之前，已有研究致力于构建能够自动化机器学习工程（MLE）任务的代理系统，其中最相关的代表性工作包括 **AIDE** (Jiang et al., 2025) 和 **ML-Master** (Liu et al., 2025)。这些系统通常采用基于树搜索的架构，通过迭代生成代码、执行反馈和节点扩展来优化解决方案。例如，AIDE 使用确定性贪婪搜索策略，而 ML-Master 引入了基于蒙特卡洛树搜索（MCTS）和 UCT 准则的探索机制，并配备了推理模块以利用并行路径的信息。此外，传统的 AutoML 工具如 **Auto-sklearn**、**TPOT** 和 **FLAML** 虽然能自动化算法选择和超参数调优，但它们缺乏 LLM 代理的动态推理能力和实时调试灵活性。\n\n尽管这些前人工作取得了显著进展，但仍存在明显的不足，主要体现在对计算预算的低效利用和上下文隔离问题上。首先，在 **AIDE** 和 **ML-Master** 中，失败的知识（如特定的 API 错误或版本不兼容）通常局限于产生错误的特定分支或节点。由于缺乏全局共享的错误注册表，其他并行分支会独立地重新发现并尝试修复相同的错误，导致大量的计算资源被浪费在重复的调试循环中。这种“上下文隔离”（Context Isolation）使得代理无法从全局环境中自适应学习，导致搜索效率低下。其次，现有的代理框架缺乏对超参数优化（HPO）的系统性强制执行机制。由于缺乏明确的预算感知控制回路，代理往往在找到几个有效解后就因表面收敛而停止搜索，忽略了利用剩余预算进行精细化的超参数调优，从而限制了最终模型的性能上限。最后，现有的树搜索算法在处理重复失败路径时缺乏智能的回溯机制，往往随机选择兄弟节点或继续深入死胡同，导致搜索过程不稳定且容易陷入局部最优。这些不足表明，尽管底层 LLM 具备强大的代码生成能力，但现有的代理脚手架（Scaffold）设计未能充分挖掘其潜力，特别是在记忆共享、预算分配和搜索策略优化方面存在结构性缺陷。", "core_insight": "### § 3 重建作者的思考路径\n\n在 autoresearch 领域，基于 Large Language Models (LLMs) 的 Agent 系统（如 AIDE, ML-Master）通常采用 Tree Search 范式来迭代优化代码。然而，观察现有的实现可以发现一个显著的“计算浪费”现象：尽管 Agent 拥有巨大的 Compute Budget，但它们往往在解决相同的环境依赖问题（如 API 版本不兼容、库函数弃用）上反复失败。这是因为 Tree Search 中的不同分支通常是隔离的（Context Isolation），一个分支发现的 Bug 无法被其他分支知晓，导致全局计算资源被低效地消耗在重复的错误修复上，而非模型性能的实质性提升。\n\n此外，现有的搜索策略存在两个结构性缺陷。第一，搜索算法（如随机回溯或简单的 UCT）缺乏对“死胡同”路径的智能规避能力，Agent 容易陷入局部最优或无限循环的 Debug 状态，无法有效利用剩余预算进行 Hyperparameter Tuning (HPO)。第二，虽然 Agent 被设计为模仿人类数据科学家进行 Exploratory Data Analysis (EDA)，但实验观察表明，它们往往只是机械地执行 EDA 步骤，却未能将这些分析结果转化为下游建模决策（如特征选择或模型结构调整），导致 EDA 成为无效的计算开销。\n\n基于这些观察，研究者意识到，要提升 Agent 性能，关键不在于更换更强的基础 LLM，而在于优化 Agentic Design 以消除这些结构性低效。首先，需要打破分支间的记忆隔离，建立一个全局的“Debug Consultant”来共享运行时约束，从而将计算资源从重复试错中解放出来。其次，需要引入更智能的搜索策略（如 Thompson Sampling）来平衡探索与利用，避免在无效路径上浪费预算。最后，需要通过显式的控制回路（Control Loop）强制 Agent 将节省下来的计算资源投入到结构化的超参数调优中，并验证其是否真正具备基于数据洞察进行决策的能力。这一系列思考导向了本文提出的针对 Context-aware Debugging、Budget-aware HPO 和 Enhanced Tree Search 的干预措施。\n\n### § 4 核心 Intuition\n\n当前 Autoresearch Agents 的主要瓶颈并非基础模型的能力不足，而是其搜索架构导致的“计算冗余”与“记忆隔离”。通过引入全局共享的 Debug 记忆和更智能的搜索策略（如 Thompson Sampling），可以将原本浪费在重复修复相同 Bug 上的计算资源回收，并重新分配给高价值的超参数调优和模型迭代。这种设计层面的优化使得 Agent 能够像单一智能体一样学习全局环境约束，从而在固定基础模型的前提下，显著提升最终解决方案的质量与稳定性。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法并非单一的算法，而是一套针对 **Autoresearch Agents**（如 AIDE 和 ML-Master）的结构性干预措施（Structural Interventions），旨在解决树搜索（Tree Search）过程中的计算浪费问题。其核心 Pipeline 包含三个主要模块：**Context-aware Debug Consultant**（上下文感知调试顾问）、**Budget-aware Hyperparameter Tuning Enforcement**（预算感知超参调优强制机制）以及 **Thompson Sampling-enhanced Backtracking**（基于 Thompson Sampling 的回溯机制）。\n\n以下以 **AIDE** 框架在解决一个表格数据分类任务（如 Kaggle 的 \"Spaceship Titanic\"）为例，展示完整的改进后 Pipeline：\n\n1.  **初始化与全局约束注入（Initialization \u0026 Constraint Injection）**：\n    *   **输入**：数据集描述、任务目标、初始代码草稿。\n    *   **处理**：在生成第一个代码节点之前，**Debug Consultant** 会检查共享的 **Bug Registry**。如果之前在其他分支或任务中遇到过特定的环境错误（例如 `LightGBM` 的 `early_stopping_rounds` 参数在特定版本中已弃用），这些“Banned Patterns”（禁止模式）和“Proven Fixes”（已验证修复方案）会被直接注入到当前节点的 Prompt 中。\n    *   **输出**：一个已经规避了已知环境陷阱的初始代码草案。\n\n2.  **树搜索与节点扩展（Tree Search \u0026 Node Expansion）**：\n    *   **输入**：当前搜索树的状态、剩余计算预算。\n    *   **处理**：\n        *   **选择策略**：系统不再随机选择兄弟节点进行扩展，而是使用 **Thompson Sampling**。每个候选节点维护一个 Beta 分布 $Beta(\\alpha_i, \\beta_i)$，代表其质量的不确定性。系统从分布中采样，选择采样值最高的节点进行扩展。这平衡了探索（Exploration）和利用（Exploitation）。\n        *   **回溯机制**：如果当前路径连续出现相同的错误（由 `similar_error_backtracking_threshold` 控制），系统会强制回溯到错误首次出现的分支点，重新采样其他兄弟节点，避免在死胡同中浪费预算。\n    *   **输出**：选定的下一个代码变体（Code Variant）。\n\n3.  **代码执行与反馈（Execution \u0026 Feedback）**：\n    *   **输入**：生成的代码。\n    *   **处理**：\n        *   **执行**：在沙箱环境中运行代码。\n        *   **错误压缩**：如果代码崩溃，**Debug Consultant** 将原始 Traceback 压缩为简短的错误签名（如 `TypeError: early_stopping_rounds`），并更新全局 **Bug Registry**。如果修复成功，记录该修复方案为“Proven Fix”。\n        *   **超参调优评估**：如果代码运行成功，一个独立的 LLM Judge 会根据预设 Rubric（0-3分）评估代码中的 **Hyperparameter Tuning (HPO)** 质量。分数低（如 0 或 1）的节点会受到奖励惩罚，分数高（2 或 3）且在搜索后期的节点会获得奖励加成。\n    *   **输出**：验证分数（Validation Score）、HPO 质量分数、更新后的 Bug Registry。\n\n4.  **迭代与收敛（Iteration \u0026 Convergence）**：\n    *   **输入**：所有有效节点的分数和 HPO 评分。\n    *   **处理**：根据调整后的奖励信号（包含 HPO 惩罚/奖励），更新树中节点的 Q 值或 Beta 分布参数。系统继续选择最有潜力的节点进行下一轮 Draft/Debug/Improve，直到计算预算耗尽。\n    *   **输出**：最终的最佳模型提交文件（Submission File）。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有提出新的基础数学理论或复杂的推导过程，其核心贡献在于工程架构设计和启发式策略的应用。因此，本节跳过形式化数学推导，但简要说明其中涉及的 **Thompson Sampling** 的直觉：\n\n*   **直觉背景**：在树搜索中，Agent 需要决定下一步探索哪个代码分支。传统的随机选择或简单的 UCB（Upper Confidence Bound）可能不够灵活。\n*   **Thompson Sampling 直觉**：\n    *   假设每个代码分支 $i$ 有一个未知的真实质量概率 $\\theta_i$。\n    *   我们用一个 **Beta 分布** $Beta(\\alpha_i, \\beta_i)$ 来建模对这个概率的不确定性。$\\alpha_i$ 代表“成功”的次数（或加权奖励），$\\beta_i$ 代表“失败”的次数。\n    *   **探索与利用的平衡**：\n        *   如果一个分支从未被尝试过，$\\alpha=1, \\beta=1$（均匀先验），其分布很宽，采样值可能很高，因此容易被选中（探索）。\n        *   如果一个分支多次失败，$\\beta$ 变大，分布向左移动，采样值变低，被选中的概率降低。\n        *   如果一个分支表现良好，$\\alpha$ 变大，分布向右移动，采样值高，被选中的概率增加（利用）。\n    *   **公式更新**：每次执行后，根据归一化奖励 $r \\in [0, 1]$ 更新参数：$\\alpha_i \\leftarrow \\alpha_i + r$，$\\beta_i \\leftarrow \\beta_i + (1-r)$。这使得 Agent 能够基于历史表现动态调整探索策略，而不是盲目随机。\n\n### § 7 实验设计与结论\n\n**1. 问题：Autoresearch Agents 在树搜索中是否存在严重的计算浪费？**\n*   **实验设计**：作者分析了 AIDE 和 ML-Master 在 9 个表格数据竞赛任务上的运行日志。他们统计了“重复遇到相同 Bug”的比例、无效节点的比例以及最终提交的有效性。\n*   **结论**：是的，存在严重浪费。基线模型中，46% 的节点浪费在重新发现已知 Bug 上；许多分支因缺乏全局记忆而独立重复犯错；且 Agent 往往在找到第一个可行解后就停止，未充分利用剩余预算进行超参调优。\n\n**2. 问题：引入全局 Debug Consultant 能否减少重复错误并提高性能？**\n*   **实验设计**：对比基线模型与加入 **Debug Consultant** 的模型。Consultant 维护一个共享的 Bug Registry，将错误压缩并注入到所有新节点的 Prompt 中。评估指标包括金牌数量（Gold Medals）、有效提交率（Valid Submission Rate）和首次有效提交的步数。\n*   **结论**：显著改善。AIDE 的金牌数从 22 增加到 38，有效提交率从 81% 提升至 100%。首次有效提交的平均步数从 6 步降至 0 步（因为约束在第一步前已注入）。这证明消除“上下文隔离”（Context Isolation）能大幅回收计算资源。\n\n**3. 问题：强制超参调优（HPO）能否提升最终模型性能？**\n*   **实验设计**：在 AIDE 中引入两种干预：(a) Prompt 级别的 HPO 指令；(b) 控制回路级别的 HPO 奖励塑造（对 HPO 质量低的节点进行惩罚）。对比不同干预组合在 9 个任务上的得分变化。\n*   **结论**：在 AIDE 上效果显著，7/9 的任务得分提升，特别是在基线表现较差的任务上提升巨大（如 S5E8 提升 +0.388）。但在 ML-Master 上效果不佳甚至负面，因为 ML-Master 的内存机制导致其陷入特定的 API 崩溃循环。这表明干预措施的效果依赖于底层 Agent 的架构特性。\n\n**4. 问题：Thompson Sampling 能否提高搜索的稳定性和可靠性？**\n*   **实验设计**：将 AIDE 和 MLEvolve 的随机节点选择策略替换为 **Thompson Sampling**，并引入基于错误相似度的回溯机制。控制其他超参数不变，对比“Null Runs”（无有效结果的运行）的比例和得分方差。\n*   **结论**：显著提高了稳定性。在 AIDE 上，Null Runs 从 33/90 减少到 15/90（减少 54.5%），且在不牺牲峰值性能的前提下降低了方差。在 MLEvolve 上，TS 在 5/9 的任务中获胜，证明其作为一种更智能的探索策略，能有效避免陷入低效的调试循环。\n\n**5. 问题：当前 Agent 是否能有效利用探索性数据分析（EDA）？**\n*   **实验设计**：向 Agent 的上下文窗口注入故意错误的“对抗性 EDA”结果，观察 Agent 是否会采纳这些错误信息并导致性能下降。\n*   **结论**：Agent 几乎完全忽略了 EDA 信息。在 AIDE 中，仅 21% 的情况承认了 EDA 的存在，仅 5% 的情况受其影响。这表明当前 Agent 缺乏将数据分析洞察转化为下游建模决策的能力，是一个潜在的改进方向。", "additional_insights": "### § 8 Take-aways\n\nAutoresearch agents suffer from severe \"context isolation,\" where parallel branches in tree search independently rediscover and waste compute on identical runtime bugs, a problem solved by a global debug consultant that maintains a shared registry of banned patterns and proven fixes. Current agents exhibit premature convergence by terminating search early due to superficial criteria, leaving significant compute budget unused for hyperparameter tuning, which can be recovered through prompt-level directives and control-loop reward shaping that penalizes weak tuning. Replacing random backtracking with Thompson Sampling in Monte Carlo Tree Search (MCTS) significantly improves search stability by reallocating budget away from repeatedly failing branches and toward promising candidates, reducing null runs by over 50% without sacrificing peak performance. Diagnostic experiments reveal that autoresearch agents largely ignore injected exploratory data analysis (EDA) insights, indicating a failure to integrate analytical signals into downstream modeling decisions despite mimicking human-like data analysis behaviors. These structural interventions demonstrate that substantial performance gains in autoresearch can be achieved through agentic design improvements alone, without modifying the underlying large language model (LLM).\n\n### § 9 最脆弱的假设\n\n该研究最脆弱的假设是：**全局共享的调试知识（Global Debug Knowledge）在不同任务分支间具有高度的可迁移性，且不会因环境细微差异或代码上下文变化而导致“负迁移”或误导。**\n\n如果这一假设不成立，即某些错误是特定于某个代码分支的局部状态（local state）而非全局环境约束（global constraint），那么将错误标记为全局“BANNED”模式会错误地阻止其他分支尝试原本可能有效的解决方案，从而降低搜索效率甚至导致性能下降。在实际中，这一假设可能不成立的原因包括：1) 某些 API 错误可能仅在特定数据分布或预处理步骤后触发，而非普遍存在；2) 不同模型架构（如 XGBoost vs LightGBM）对同一参数的敏感度不同，全局禁令可能误杀有效配置；3) 环境依赖（如库版本）可能在长运行过程中发生动态变化，导致早期记录的“Proven Fix”后期失效。\n\n论文提供的证据主要基于统计相关性（如有效节点数与最终得分的正相关）和案例研究（Case Studies），显示全局共享减少了冗余错误。然而，论文缺乏对“错误迁移”（Negative Transfer）的定量分析，即未明确测量有多少次全局禁令错误地阻止了潜在的有效探索。此外，论文在 ML-Master 上观察到 HPO 干预导致性能下降，部分原因是记忆模块未能传播错误原因，这暗示了全局记忆机制的脆弱性，但并未深入探讨调试顾问本身是否会产生类似的误导效应。\n\n### § 10 最小复现实验\n\n**目标：** 验证“全局调试顾问”是否真的通过消除冗余错误来提升性能，还是仅仅通过增加有效迭代次数（Valid Iterations）来间接提升。\n\n**数据：** 使用 MLE-bench 中的一个简单表格任务（如 Spaceship Titanic），该任务具有明确的 API 错误模式（如 LightGBM 的 `early_stopping_rounds` 弃用问题）。\n\n**实现：**\n1.  **Baseline Agent：** 实现一个简化的树搜索代理，每个分支独立运行，无全局记忆。\n2.  **Intervention Agent：** 在 Baseline 基础上添加一个全局字典 `bug_registry`，记录每次运行时错误（Runtime Error）及其对应的代码片段哈希。当新分支生成代码时，检查是否包含已记录的错误模式，若包含则直接标记为失败或强制修改。\n3.  **控制变量：** 保持 LLM 调用次数（Compute Budget）相同，仅改变错误处理机制。\n\n**测量：**\n1.  **Redundant Error Rate：** 计算每个分支中重复出现的相同错误类型的比例。\n2.  **Valid Node Ratio：** 计算成功执行并返回有效分数的节点占总生成节点的比例。\n3.  **Final Score：** 最终测试集上的性能指标（如 AUC 或 RMSE）。\n\n**支持/反驳标准：**\n*   **支持：** 如果 Intervention Agent 的 `Redundant Error Rate` 显著低于 Baseline，且 `Valid Node Ratio` 显著提高，同时 `Final Score` 提升，则证明全局调试顾问有效回收了浪费的 Compute。\n*   **反驳：** 如果 `Redundant Error Rate` 降低但 `Final Score` 无显著变化，甚至下降，则说明消除冗余错误并未转化为性能增益，或者全局禁令导致了过度约束（Over-constraint），阻碍了有效探索。此外，如果 `Valid Node Ratio` 提升但 `Final Score` 不变，则说明性能瓶颈不在调试效率，而在模型选择或超参调优能力。", "research_value": "### § 11 最强反例设计\n\n若要挑战这篇论文的核心主张，最有力的攻击点在于**“全局调试知识（Global Debug Knowledge）的负迁移（Negative Transfer）与过度约束（Over-constraint）”**。论文假设不同搜索分支间遇到的运行时错误（Runtime Errors）具有高度的通用性，且修复方案（Proven Fixes）是普适的。然而，在复杂的机器学习工程（MLE）场景中，许多错误并非源于全局环境配置，而是源于特定代码路径下的**局部状态依赖（Local State Dependency）**或**数据分布特异性（Data Distribution Specificity）**。\n\n**具体反例场景设计：**\n考虑一个涉及复杂特征工程（Feature Engineering）的任务，其中某个分支尝试使用 `sklearn` 的 `ColumnTransformer` 处理混合类型数据，而另一个分支尝试使用 `pandas` 原生操作。假设分支 A 因 `ColumnTransformer` 的某个版本兼容性 bug 失败，Debug Consultant 将该错误签名（如 `ValueError: invalid type`）标记为全局“Banned Pattern”，并注入到所有后续分支的 Prompt 中。然而，分支 B 的 `pandas` 操作失败可能源于完全不同的原因（如内存溢出或索引对齐错误），但 LLM 在生成代码时，由于 Prompt 中包含了“避免使用导致 `ValueError` 的复杂转换逻辑”这一全局禁令，可能会错误地简化分支 B 的特征工程逻辑，甚至放弃使用必要的复杂变换，转而采用更简单但性能较差的基线模型。\n\n**理论论证与替代解释：**\n这种“过度约束”会导致搜索空间的**人为剪枝（Artificial Pruning）**。论文声称性能提升源于“回收了浪费的 Compute”，但一个强有力的替代解释是：性能提升可能部分源于**搜索空间的缩小**，而非效率的提升。通过注入全局禁令，Agent 实际上被限制在一个更窄、更安全的子空间中，这虽然减少了错误率，但也可能排除了那些高风险但高回报（High-Risk, High-Reward）的创新性解决方案。如果实验显示，在引入 Debug Consultant 后，Agent 生成的代码多样性（Code Diversity）显著下降，且最终模型的性能分布方差（Variance）减小但峰值性能（Peak Performance）并未显著超越基线的最佳情况，那么就可以论证该方法是以牺牲探索潜力为代价换取了稳定性，而非真正“回收”了计算资源。此外，如果在全局禁令下，Agent 频繁出现“误杀”（False Positives），即阻止了原本有效的代码变体，那么其净收益将被严重高估。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“错误避免”到“因果调试”——基于程序切片（Program Slicing）与因果推断的自适应调试代理**\n\n**（a）驱动局限与未满足需求：**\n当前论文提出的 **Context-aware Debug Consultant** 本质上是一种**相关性驱动（Correlation-driven）**的启发式方法：它记录“错误签名”与“修复代码”之间的统计关联，并假设这种关联在所有上下文中成立。然而，如反例所示，这种方法缺乏对错误**根本原因（Root Cause）**的因果理解。它无法区分错误是源于全局环境、局部数据状态，还是代码逻辑本身的缺陷。因此，它容易陷入“一刀切”的禁令，导致负迁移。未满足的需求是：Agent 需要具备**因果调试（Causal Debugging）**能力，能够识别错误的真正触发条件，并仅在相关上下文中应用修复，从而在保持探索多样性的同时消除冗余错误。\n\n**（b）借鉴相邻领域的方法：**\n可以借鉴**程序分析（Program Analysis）**中的**动态程序切片（Dynamic Program Slicing）**技术和**因果推断（Causal Inference）**中的**反事实推理（Counterfactual Reasoning）**。\n*   **动态程序切片**：用于识别导致特定运行时错误的代码子集（即“错误切片”），从而将错误定位到具体的变量或函数调用，而非整个代码块。\n*   **因果推断**：构建一个因果图（Causal Graph），其中节点代表代码片段、数据状态和环境配置，边代表因果关系。通过反事实推理（“如果改变这个参数，错误还会发生吗？”），Agent 可以验证修复方案的因果有效性，而非仅仅依赖历史共现。\n\n**（c）第一个实验设计：**\n1.  **构建因果调试代理（Causal Debug Agent）**：\n    *   在代码执行失败时，不直接记录错误签名，而是运行一个轻量级的**静态/动态分析器**，生成导致错误的**最小错误切片（Minimal Error Slice）**。\n    *   使用 LLM 作为**因果推理引擎**，基于错误切片和上下文，生成一个**因果假设**（例如：“错误是由 `LightGBM` 版本与 `early_stopping_rounds` 参数的不兼容引起的”）。\n    *   通过**反事实验证**：在沙箱中修改假设中的关键变量（如更改库版本或参数），观察错误是否消失。如果消失，则确认因果链，并将该因果规则（而非简单的错误签名）存入**Causal Bug Registry**。\n2.  **对比实验**：\n    *   **Baseline**：论文中的 **Context-aware Debug Consultant**（基于错误签名的全局禁令）。\n    *   **Proposed**：**Causal Debug Agent**（基于因果规则的上下文感知修复）。\n    *   **任务**：选择一组具有高度**上下文依赖性错误**的任务（例如，错误仅在特定数据分布或预处理步骤后触发）。\n3.  **评估指标**：\n    *   **Negative Transfer Rate**：测量全局禁令错误地阻止有效代码变体的比例。\n    *   **Repair Precision**：测量修复方案在跨分支应用时的成功率。\n    *   **Exploration Diversity**：测量 Agent 在搜索过程中生成的代码变体的多样性，以验证是否避免了过度约束。\n\n**与已有工作的区别：**\n现有工作（包括本文）主要关注**记忆共享（Memory Sharing）**和**启发式规则（Heuristic Rules）**，缺乏对错误机制的**因果建模**。本提议将调试从“模式匹配”提升到“因果推理”层面，旨在解决全局记忆机制的脆弱性，实现更精细、更鲁棒的计算资源回收。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Au Kwok Chun\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Abhigyan Acherjee\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Amrutha Rao\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Zaiqian Chen\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Kazem Meidani\",\n      \"affiliations\": [\n        5\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"C. Bayan Bruss\",\n      \"affiliations\": [\n        5\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Micah Goldblum\",\n      \"affiliations\": [\n        1,\n        6\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Department of Computer Science, Columbia University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"AI, Analytics and Future of Work Initiative, Georgetown University\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Department of Applied Mathematics, Columbia University\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Department of Statistics, Columbia University\"\n    },\n    {\n      \"id\": 5,\n      \"name\": \"Capital One\"\n    },\n    {\n      \"id\": 6,\n      \"name\": \"Department of Electrical Engineering, Columbia University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal contribution.\"\n    }\n  ]\n}\n```", "summary_translation": "近期大量研究致力于开发端到端解决研究问题的智能体，这一范式日益被称为 autoresearch。此类智能体激发了工业界的大规模投资，其动力在于它们有望自动化耗时的人工劳动，并为特定应用定制机器学习解决方案。在本文中，我们研究了这些 autoresearch 系统核心的建模流程，并识别出它们在应用于表格数据集时的常见故障模式：（1）它们反复浪费计算资源以解决相同的错误；（2）即使拥有大量剩余计算预算，它们也常常无法调整超参数；（3）驱动它们的树搜索算法缺乏探索性；（4）它们执行数据分析，模仿其训练数据中的人类行为，但并未利用该分析来做出下游决策。我们探索了针对性的干预措施，发现通过一个在所有搜索树分支间共享已发现运行时约束的全局调试顾问、提示和控制层面的增强，以及改进的树搜索算法，可以成功回收被浪费的计算资源。我们的结果表明，在保持底层语言模型不变的情况下，仅通过智能体设计即可实现 autoresearch 智能体性能的显著提升。"}]}, {"name": "Tool Use, Workflows \u0026 Documentation", "count": 3, "papers": [{"title": "Actions Speak Louder than Words: Measuring Cross-Lingual Policy Retention in Tool-Using Agents", "arxiv_id": "2608.11110", "authors": "Sourabrata Mukherjee, Kalika Bali, Sunayana Sitaram", "summary": "When a tool-using agent is given the same task in a different language, does it still take the same steps? Multilingual evaluation rarely asks: it compares final answers and discards the actions. Yet those actions are the product: they fix cost and latency, decide how the system fails, and are the only auditable part of its behaviour. We make the action policy the measured object across 8 models, 6 parallel benchmarks and 41 languages (2.38M rollouts). The naive measurement fails: five confounds sit between raw trace similarity and any defensible claim, each able to flip a conclusion. Short traces score higher, empty traces score perfectly, unrelated traces agree by chance over half the time, the gap is capped by each model's reproducibility, and a model asked the same question twice in one language answers differently, leaving no baseline. We remove all five, and every correction makes the effect larger. Divergence proves structural, not sampling noise: it survives greedy decoding in every cell and stays flat as temperature rises, even as models grow less self-consistent. Normalised by their own reproducibility, four very different frontier models converge under greedy decoding, each keeping 71-73% of its action policy across languages, with model identity explaining only 5.7% of the variance. Below roughly 10B parameters it breaks down, and the ordering among smaller models is largely an artifact of a chance floor we measure by permutation rather than assume. Agents route non-English tasks through English; this pivot is causally load-bearing, confirmed by a pre-registered prediction across four models, and models will not abandon it when told to. Finally, a single trace-extraction regex, not the model, manufactured a multilingual failure: two worked examples raise one model's measured accuracy twenty-sixfold while its accuracy on readable outputs barely moves.", "category": "cs.CL", "cluster": "Tool Use, Workflows \u0026 Documentation", "tags": ["cs.CL"], "filter_reason": "该论文符合筛选标准，主要依据如下：\n\n1.  研究对象明确为 LLM 智能体 (LLM Agents)：论文标题和摘要明确指出研究对象是 \"Tool-Using Agents\"（工具使用智能体），这直接对应研究焦点中的“单智能体”方向下的“工具使用 (Tool Use)”能力。\n2.  核心贡献在于评估与行为分析 (Evaluation \u0026 Behavior Analysis)：根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准、失败机制诊断或经验研究，只要结论直接帮助理解或改进智能体能力，也应保留。” 本文通过大规模实验（8个模型，41种语言，238万次 rollout）深入分析了智能体在跨语言场景下的“动作策略 (Action Policy)”保留情况，揭示了智能体在工具调用步骤上的结构性偏差（如通过英语作为枢纽路由非英语任务）。\n3.  对改进智能体具有直接指导意义：论文不仅指出了现有评估方法的缺陷（如混淆因素），还提出了修正后的测量方法，并发现了智能体行为的关键机制（如语言路由策略）。这些发现对于构建更鲁棒、更一致的多语言工具使用智能体（Agentic AI）具有重要的理论价值和实践指导意义，属于“帮助理解或改进智能体能力”的范畴。\n4.  排除项不适用：虽然涉及评估，但它不是单纯的基础推理能力测试，而是针对 Agentic 行为（工具调用轨迹）的评估；也不属于被排除的安全、对齐、图技术或多智能体拓扑编排等范畴。\n\n综上，该论文是对 LLM 智能体工具使用行为的重要实证研究，符合“构建、改进、评估... LLM智能体”的核心目标。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：当多语言工具使用代理（Tool-Using Agents）面对语义相同但语言不同的任务时，其执行的中间动作策略（Action Policy）是否保持一致？具体而言，研究旨在量化“跨语言策略保留率”（Cross-Lingual Policy Retention），即模型在语言切换后，仍能维持其自身动作序列一致性的比例。\n\n这一问题的重要性在于，对于代理系统而言，执行路径（Route）本身就是产品，而不仅仅是最终答案的副产品。路径决定了系统的计算成本（Token消耗与延迟）、失败模式（Failure Mode）以及可审计性（Auditability）。例如，一个在非英语任务中先执行翻译再计算的模型，其成本高于直接计算的英语路径，且引入了英语路径中不存在的翻译错误风险。此外，工具权限、速率限制和安全护栏（Safeguards）通常是针对特定动作序列设计的，如果不同语言版本执行不同的策略，针对英语验证的安全策略可能在其他语言中失效。因此，仅比较最终答案的准确性（Answer-level Parity）无法揭示这些关键的行为差异，导致“行为一致性”在当前的多语言评估中是一个盲区。解决这一问题能够揭示多语言代理在实际部署中的真实可靠性边界，为构建语言无关的鲁棒代理系统提供可测量的基准。\n\n### § 2 前人工作与不足\n\n该问题此前并未被有效解决，主要因为现有的评估体系存在根本性的测量缺口和方法论缺陷。\n\n现有的代理基准测试（如 AgentBench, GAIA, ReAct-style scaffolds）主要关注任务完成度（Outcome），即最终答案的正确性，且绝大多数基准仅针对英语。这些系统虽然记录了中间动作，但仅将其视为达成结果的手段，而非评估对象。因此，它们无法区分“通过正确路径得到正确答案”和“通过错误但巧合的路径得到正确答案”，导致行为变异在构造上不可见。\n\n另一方面，现有的多语言评估套件（如 XTREME, MEGA, XNLI）虽然覆盖了多种语言，但仅比较最终预测结果。即使涉及思维链（Chain-of-Thought）的多语言研究，比较的也是自由形式的文本推理过程。由于不同语言的文本难以直接对齐，这类研究通常依赖翻译或蕴含模型来评估一致性，这引入了额外的多语言误差，且无法精确量化结构化动作序列的差异。\n\n最接近的相关工作如 Qi et al. (2023) 研究了模型跨语言检索事实的一致性，但这关注的是“知识”（Facts）而非“程序”（Procedures）。程序是模型选择的，而非回忆的，因此程序发散不仅仅是知识发散，还涉及解码噪声和策略选择。\n\n前人工作不足的核心原因在于缺乏一个可识别的基线（Baseline）和有效的测量协议。直接比较跨语言动作序列的相似度（Raw Trace Similarity）受到五个严重混淆因素（Confound）的影响：\n1.  **缺乏基线（No Baseline）**：模型在同一语言下重复执行同一任务时，其动作序列也不完全一致（Self-consistency \u003C 1）。如果没有同语言基线，无法区分差异是源于语言变化还是模型自身的随机性。\n2.  **轨迹长度偏差（Trace Length）**：短轨迹在相似度评分中天然得分更高，导致“难任务”（长轨迹）被低估。\n3.  **空轨迹问题（Empty Traces）**：未生成任何动作的空轨迹会被错误地评为完美相似，掩盖了代理的失效。\n4.  **天花板效应（Ceiling Effect）**：跨语言差异的上限受限于模型自身的可重复性，未归一化的差距实际上是在排名模型的确定性而非多语言能力。\n5.  **偶然地板（Chance Floor）**：由于工具词汇表有限，无关轨迹也会产生较高的偶然相似度，导致指标没有有意义的零点。\n\n由于这些混淆因素未被纠正，之前的研究要么忽略了中间策略，要么使用了无法解释的原始相似度指标，导致无法得出关于跨语言策略一致性的可靠结论。本文通过引入匹配复现（Matched Replicates）、长度匹配（Length Matching）、严格空轨迹排除、天花板归一化以及基于置换的偶然地板测量，构建了首个可防御的跨语言策略保留率估计量。", "core_insight": "### § 3 重建作者的思考路径\n\n在评估多语言大语言模型（LLM）时，现有的标准做法主要关注最终输出的准确性（Answer-level parity），即模型在不同语言下是否给出了相同的答案。然而，随着LLM被部署为使用工具的Agent，这种评估方式暴露出了严重的盲区：对于Agent而言，执行路径（Action Policy/Trace）才是核心产品，因为它直接决定了系统的成本（Token消耗）、延迟、失败模式以及可审计性。如果模型在英语和印地语中通过完全不同的步骤序列到达相同答案，其系统行为实际上是不同的，现有的评估体系无法捕捉这种差异。\n\n早期的直觉可能认为，只需提取不同语言下的工具调用序列（Trace），并计算其相似度即可衡量跨语言的一致性。但深入分析会发现，这种“朴素测量”（Naive Measurement）存在五个致命的混淆因素（Confounders），导致结果不可信：首先，缺乏基线，因为模型在同一种语言下重复执行同一任务时，由于采样噪声（Sampling Noise），其自身的一致性（Self-consistency）并非100%，没有这个基线，跨语言的差异无法与模型自身的随机性区分开来；其次，Trace长度具有因果影响，短序列天然具有更高的相似度分数，而不同语言或任务难度可能导致长度差异；第三，空Trace（Empty Traces）会被错误地计为完美匹配，掩盖了模型未能执行任何动作的失败情况；第四，存在一个由工具词汇表大小决定的偶然地板（Chance Floor），即完全无关的Trace也可能因随机匹配而获得较高的相似度分数；最后，模型的自身可复现性（Reproducibility Ceiling）限制了跨语言一致性的上限，不同模型的可复现性差异会扭曲排名。\n\n因此，研究者意识到必须重新构建测量协议。核心思路是引入“同语言基线”（Same-language baseline），通过生成两次独立运行（Replicates）来分别测量同语言内的一致性（$I_{within}$）和跨语言的一致性（$I_{cross}$）。通过计算归一化的策略保留率（Normalized Policy Retention, $\\tilde{I} = I_{cross} / I_{within}$），可以消除模型自身随机性的影响。同时，必须对Trace长度进行匹配（Length-matching），排除空Trace，并通过置换测试（Permutation test）测量并校正偶然地板。这一系列修正旨在将“语言引起的策略发散”从“采样噪声”和“度量伪影”中剥离出来，从而得到一个可解释的、结构性的跨语言策略保留指标。\n\n### § 4 核心 Intuition\n\n这篇论文的核心直觉在于，跨语言策略差异并非单纯的采样噪声，而是一种结构性的行为偏差，但这种偏差被模型自身的随机性和度量伪影所掩盖。通过引入同语言基线并计算归一化的策略保留率（Normalized Policy Retention），我们将测量焦点从“绝对相似度”转移到“模型自身一致性在语言切换后的保留比例”，从而消除了不同模型可复现性差异带来的混淆。这一方法揭示了一个反直觉的规律：在贪婪解码（Greedy Decoding）下，前沿模型表现出高度一致的跨语言策略保留率（约71-73%），且这种保留率主要受限于模型对英语作为推理枢纽（English Pivot）的结构性依赖，而非模型规模或架构的差异。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文的核心方法不是训练新模型，而是构建了一套**跨语言策略保留（Cross-Lingual Policy Retention）**的测量协议。其核心思想是将 Agent 的中间执行轨迹（Action Trace）作为测量对象，而非最终答案，并通过严格的对照实验消除五种混淆因素（Confounds）。\n\n**完整 Pipeline 示例：**\n\n假设我们要测试模型 **Gemma-3-27B** 在处理一个“计算印度卢比汇率”任务时，在**英语（English）**和**印地语（Hindi）**下的行为一致性。\n\n1.  **任务对齐与输入准备（Input Preparation）：**\n    *   从平行语料库（如 XQuAD 或 FLORES-200）中选取一个语义完全相同的任务 $z$。\n    *   生成两个输入：$x_{en}(z)$（英文提示）和 $x_{hi}(z)$（印地语提示）。确保它们通过验证的对齐键（Alignment Key）对应，而非简单的行索引匹配。\n\n2.  **双副本生成（Dual Replicate Generation）：**\n    *   为了消除采样噪声（Sampling Noise）并建立基线，每个输入都运行两次（Replicate 1 和 Replicate 2），仅改变服务种子（Serving Seed），保持解码参数（如 Temperature $T=0$ 或 $T=0.5$）和 Token 预算一致。\n    *   共生成 4 个 Rollouts：\n        *   $R_{en,1}, R_{en,2}$：英文任务的两轮执行。\n        *   $R_{hi,1}, R_{hi,2}$：印地语任务的两轮执行。\n\n3.  **轨迹提取与清洗（Trace Extraction \u0026 Cleaning）：**\n    *   使用正则表达式从模型输出中提取符号化的工具调用序列（Action Trace），例如：`[Translate, Search, Calc, Finish]`。\n    *   **严格排除空轨迹（Strict Empty Exclusion）：** 如果任何一轮输出为空或无法解析，该配对直接丢弃，不计入统计。这避免了“空轨迹得满分”的伪影。\n\n4.  **相似度计算与长度匹配（Similarity \u0026 Length Matching）：**\n    *   计算轨迹相似度 $S(A, B)$，使用归一化匹配块相似度（Normalized Matching-Block Similarity）。\n    *   **长度匹配（Length Matching）：** 由于短轨迹天然得分更高，系统会根据轨迹长度分布对配对进行重加权（Reweighting），确保比较的是相同复杂度的任务路径。\n\n5.  **基线与跨语言指标计算（Metric Calculation）：**\n    *   **同语言一致性（$I_{within}$）：** 计算 $S(R_{en,1}, R_{en,2})$ 和 $S(R_{hi,1}, R_{hi,2})$ 的平均值。这代表了模型自身的可复现性上限（Ceiling）。\n    *   **跨语言一致性（$I_{cross}$）：** 计算 $S(R_{en,1}, R_{hi,1})$ 和 $S(R_{en,2}, R_{hi,2})$ 的平均值。\n    *   **归一化策略保留率（$\\tilde{I}$）：** 核心指标 $\\tilde{I} = I_{cross} / I_{within}$。这表示在语言改变后，模型保留了多少其自身原本的一致性。\n\n6.  **机会基线校正（Chance Floor Correction）：**\n    *   通过置换测试（Permutation Test）测量随机轨迹的相似度基线 $c$（约 0.56）。\n    *   最终报告校正后的保留率，以排除因工具词汇表小导致的偶然高分。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有提出新的深度学习架构或损失函数，因此没有传统意义上的“核心数学推导”。其核心贡献在于**统计估计量（Estimand）的构建与偏差校正**。\n\n**理论背景与直觉：**\n\n1.  **识别问题（Identification Problem）：**\n    *   直觉：如果你只比较英文轨迹和印地语轨迹的相似度（$I_{cross}$），你无法知道差异是因为“语言不同”还是因为“模型本身就不稳定”。\n    *   公式直觉：$I_{cross}$ 受到两个因素影响：语言差异（Language Effect）和模型随机性（Stochasticity）。如果没有同语言基线 $I_{within}$，这两个因素混淆在一起，无法分离。\n\n2.  **归一化估计量（Normalized Estimator）：**\n    *   定义：$\\tilde{I} = \\frac{I_{cross}}{I_{within}}$\n    *   直觉：$I_{within}$ 是模型在相同语言下能达到的最大一致性（天花板）。$\\tilde{I}$ 衡量的是跨语言一致性占这个天花板的比例。如果 $\\tilde{I} = 0.72$，意味着模型保留了 72% 的自身一致性，丢失的 28% 归因于语言切换。\n\n3.  **五种混淆因素的校正逻辑：**\n    *   **C1 (No Baseline):** 通过生成双副本解决，否则 $I_{within}$ 假设为 1，导致低估差异。\n    *   **C2 (Trace Length):** 短轨迹相似度天然高。通过长度匹配（Length Matching）重加权，消除长度偏差。\n    *   **C3 (Empty Traces):** 空轨迹相似度为 1.0。通过严格排除空轨迹，避免非行为（Non-adherence）被误判为高一致性。\n    *   **C4 (Ceiling):** 模型自身不可复现会压缩差距。通过除以 $I_{within}$ 归一化，消除模型确定性差异带来的排名偏差。\n    *   **C5 (Chance Floor):** 随机轨迹也有约 0.56 的相似度。通过置换测试测量 $c$，校正公式为 $\\kappa = \\frac{S - c}{1 - c}$，确保相似度分数有真正的“零点”。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n当工具使用型 Agent（Tool-Using Agents）面对不同语言的相同任务时，它们是否执行相同的**行动策略（Action Policy）**？现有的多语言评估只关注最终答案，忽略了中间步骤，而中间步骤决定了成本、延迟、失败模式和可审计性。\n\n**2. 设计了什么实验验证这个问题？**\n*   **大规模基准测试：** 在 8 个模型、6 个平行基准、41 种语言上进行了 238 万次 Rollout。\n*   **对照设计：** 每个任务-语言组合生成两次（双副本），分别计算同语言一致性（$I_{within}$）和跨语言一致性（$I_{cross}$）。\n*   **消融实验（Ablation Studies）：**\n    *   **温度梯度（Temperature Ladder）：** 测试 $T=0$ 到 $T=1.0$，验证差异是结构性还是采样噪声。\n    *   **工具干预（Tool Intervention）：** 移除 `Translate` 工具或强制使用 `Translate`，验证“英语枢纽（English Pivot）”机制。\n    *   **长度操纵（Length Manipulation）：** 强制限制或增加步骤数，验证轨迹长度对一致性的因果影响。\n    *   **提示干预（Prompt Intervention）：** 指示模型用任务语言推理，测试是否能打破英语枢纽。\n\n**3. 问题的答案是什么？**\n*   **结构性差异存在：** 跨语言策略差异是结构性的，而非采样噪声。在贪婪解码（Greedy Decoding, $T=0$）下，四个前沿模型（Frontier Models）表现出惊人的一致性，均保留了 **71–73%** 的行动策略。\n*   **模型无关性：** 在前沿模型中，模型身份仅解释了 5.7% 的方差，表明策略保留率是一个接近模型无关的量。\n*   **规模边界：** 这种规律在约 10B 参数以下失效，小模型的排名差异主要是测量伪影（如机会基线）。\n*   **英语枢纽机制：** 模型倾向于将非英语任务通过 `Translate` 工具转换为英语进行推理（English Pivot）。移除该工具会降低跨语言一致性，且模型拒绝通过提示词放弃这一习惯。\n*   **测量陷阱：** 许多看似的多语言失败实际上是测量失败（如正则表达式解析错误导致 GPT-OSS 准确率被低估 26 倍）。", "additional_insights": "### § 8 Take-aways\n\n1. **行为一致性优于答案正确性**：在多语言 Agent 评估中，仅比较最终答案（Answer-level parity）会掩盖中间执行路径（Action Policy）的差异，而路径差异直接决定了系统的成本、延迟、故障模式及可审计性。\n2. **原始相似度指标存在严重偏差**：直接计算跨语言 Trace 相似度会受五个混淆因素干扰，包括缺乏同语言基线（No baseline）、Trace 长度偏差、空 Trace 完美得分、模型自身可复现性上限（Ceiling）以及高随机碰撞概率（Chance floor），导致原始指标严重低估或扭曲真实差异。\n3. **归一化策略揭示结构性差异**：通过引入同语言基线并计算归一化策略保留率（Normalized Policy Retention, $\\tilde{I} = I_{cross} / I_{within}$），研究发现前沿模型在贪婪解码（Greedy decoding）下表现出高度一致的跨语言策略保留率（71–73%），且该差异主要由 Benchmark 特性而非模型身份决定。\n4. **英语枢纽效应具有因果性**：非英语任务普遍通过“翻译为英语”这一枢纽（English Pivot）进行处理，移除该工具会导致跨语言一致性显著下降，且模型无法通过指令放弃这一行为，证明其是承载因果逻辑的关键机制而非风格偏好。\n5. **小模型排名多为测量伪影**：在 10B 参数以下的模型中，表观的策略保留率排序主要受高随机碰撞概率（Chance floor）和 Trace 长度影响，而非真实的跨语言能力，未经校正的原始指标在此区间完全不可信。\n6. **解析失败伪装为多语言缺陷**：单一的正则表达式提取器（Regex）可能导致严重的测量偏差，例如 GPT-OSS-120B 因输出格式不符被判定为低准确率，但提供 Few-shot 示例后准确率提升 26 倍，表明部分“多语言失败”实为解析器（Parser）的格式不兼容问题。\n\n### § 9 最脆弱的假设\n\n**核心假设：符号化工具调用序列（Symbolic Action Trace）是衡量 Agent 跨语言行为一致性的充分且无偏代理变量。**\n\n如果这一假设不成立，即模型在内部推理（Reasoning/Thought）阶段存在显著的语言依赖差异，而最终输出的符号化动作序列却因收敛到相同的最优解而保持一致，那么论文所测量的“策略保留率”将失效，因为它忽略了导致成本或错误的关键中间认知过程。\n\n**实际中可能不成立的原因：**\n1. **内部表征与外部动作解耦**：模型可能在非英语输入下使用完全不同的内部思维链（Chain-of-Thought）或注意力模式，但由于工具接口（Tool Interface）的离散性和任务的确定性，最终调用的工具序列（如 Search -\u003E Calc -\u003E Finish）被迫收敛到相同路径。此时，Trace 相似度为 1，但内部计算成本和潜在的错误传播路径完全不同。\n2. **工具粒度粗糙**：论文使用的工具集（Search, Calc, Translate, Summarize, Finish）粒度较粗。如果两个模型在“Search”步骤中使用了不同的查询策略（Query formulation），但都归类为“Search”，Trace 无法捕捉这种细微但重要的策略差异。\n\n**论文提供的证据与缺失：**\n*   **证据**：论文通过消融实验（Ablation）证明移除“Translate”工具会显著降低一致性，且模型拒绝在任务语言中进行推理（Think-in-task-language compliance \u003C 1%），这间接支持了内部处理确实依赖于英语枢纽，且这种依赖反映在外部动作上。\n*   **缺失**：论文明确承认其测量的是“诱导的工具使用策略”（Induced tool-use policy）而非“接地执行”（Grounded execution），且未测量内部隐藏状态（Hidden States）或思维链文本的语义相似度。如果内部推理路径不同但外部动作相同，当前的测量框架无法检测这种“黑盒内”的多语言不一致性，从而可能高估了行为的一致性。\n\n### § 10 最小复现实验\n\n**目标**：验证“英语枢纽（English Pivot）”是否是导致跨语言策略差异的主要因果因素，以及移除该枢纽是否真的会降低策略保留率。\n\n**数据与设置**：\n1.  **数据**：选取论文中提到的一个小型 Benchmark 子集（如 XCOPA 或 Belebele 的 100 个任务），包含英语和一种非英语（如 Hindi 或 Spanish）。\n2.  **模型**：选择一个开源前沿模型（如 Llama-3-8B 或 Qwen2.5-7B），确保其支持工具调用。\n3.  **环境**：使用 vLLM 或 Hugging Face Transformers 进行推理，设置 Temperature=0（Greedy decoding）以消除采样噪声。\n\n**实现步骤**：\n1.  **基线测量**：在标准工具集（含 Translate）下，运行同一任务在英语和非英语版本，提取 Action Trace，计算 $I_{within}$（同语言两次运行）和 $I_{cross}$（跨语言），得到基线 $\\tilde{I}_{baseline}$。\n2.  **干预测量**：修改 Prompt，从工具列表中移除 `Translate` 工具，或在 Prompt 中强制禁止使用 `Translate`。再次运行相同任务，提取 Trace，计算新的 $\\tilde{I}_{no\\_translate}$。\n3.  **对比分析**：比较 $\\tilde{I}_{baseline}$ 和 $\\tilde{I}_{no\\_translate}$。\n\n**结果判定**：\n*   **支持 Claim**：如果 $\\tilde{I}_{no\\_translate}$ 显著低于 $\\tilde{I}_{baseline}$（例如下降超过 5-10 个百分点），且 Trace 长度匹配后差异依然显著，则支持“英语枢纽是承载跨语言一致性的关键因果机制”这一结论。\n*   **反驳 Claim**：如果移除 Translate 后，$\\tilde{I}$ 没有显著变化，甚至上升（表明模型找到了更直接的跨语言路径），则说明英语枢纽并非必要，或者模型具备不依赖翻译的跨语言推理能力，论文的因果解释将受到挑战。\n\n**优势**：此实验无需复现 2.38M 次 Rollout 或复杂的归一化管道，仅需对比两种 Prompt 设置下的 Trace 相似度，即可验证核心机制假设。", "research_value": "### § 11 最强反例设计\n\n要攻击这篇论文的核心结论，最有力的反例并非质疑其统计方法的严谨性，而是挑战其**代理变量（Proxy Variable）的有效性**，即证明“符号化动作轨迹（Symbolic Action Trace）”与“实际执行成本/风险”之间存在严重的**解耦（Decoupling）**。\n\n**反例场景：语义等价的“黑盒”工具调用差异**\n\n假设我们有一个任务：“计算纽约到伦敦的飞行时间”。\n*   **英语路径**：模型调用 `Search(query=\"NYC to LHR flight time\")` -\u003E `Calc(duration)`。\n*   **法语路径**：模型调用 `Search(query=\"durée vol NYC LHR\")` -\u003E `Calc(duration)`。\n\n根据论文的测量协议，这两个轨迹在符号层面是完全一致的（`[Search, Calc]` vs `[Search, Calc]`），因此 $S(A, B) = 1$，策略保留率极高。然而，在真实世界的 API 网关中，这两个请求可能触发完全不同的后端路由：\n1.  **查询重写差异**：英语查询可能被搜索引擎优化为结构化数据提取，而法语查询可能因为索引覆盖率低，退化为全文检索，导致延迟增加 10 倍，且返回噪声更大。\n2.  **工具内部逻辑分支**：如果 `Search` 工具内部包含一个基于语言检测的路由器，英语请求走“高置信度管道”，法语请求走“翻译后检索管道”。虽然外部 Trace 相同，但内部计算图（Computation Graph）完全不同。\n\n**理论攻击点：测量的是“接口一致性”而非“策略一致性”**\n\n论文声称测量的是 **Action Policy**，但实际上只测量了 **Interface Invocation Pattern**。在复杂的 Tool-Using Agent 系统中，真正的“策略”不仅包含调用哪个工具，还包含**如何构造参数（Argument Construction）**以及**工具内部的执行路径**。\n\n如果模型在非英语任务中，为了弥补语言能力的不足，在 `Search` 的 `query` 参数中注入了大量的冗余关键词或使用了不同的实体链接策略，这些细微但关键的差异被论文的“符号化提取”步骤完全抹去了。论文通过正则表达式提取 `[Translate, Search, Calc]`，本质上是将连续的策略空间离散化为一个极粗糙的有限状态机。\n\n**具体攻击实验设计：**\n\n1.  **构造“同迹异效”任务集**：设计一组任务，其中工具调用的顺序和类型在英语和非英语下完全相同，但**参数内容（Arguments）**的语言复杂度或语义密度显著不同。例如，要求模型在 `Search` 中生成一个复杂的布尔逻辑查询。\n2.  **引入“参数感知”相似度指标**：不比较工具名称序列，而是比较工具调用参数的**语义嵌入距离（Semantic Embedding Distance）**或**执行耗时（Execution Latency）**。\n3.  **预期结果**：如果论文的方法有效，那么 Trace 相似度高的配对，其参数语义距离和执行耗时也应该高度相关。如果数据显示 Trace 相似度为 1，但参数语义距离极大（例如英语查询精准，非英语查询模糊且冗长），则证明论文的指标**高估了策略的一致性**，因为它忽略了“如何调用”这一关键维度，仅关注了“调用什么”。这将揭示论文所测量的“保留率”是一个**虚假的稳定性指标**，无法反映真实的系统行为差异。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“轨迹对齐”到“因果干预”——基于结构因果模型（SCM）的跨语言策略鲁棒性评估**\n\n**（a）驱动局限与未满足需求：**\n现有工作（包括本文）将跨语言一致性视为一个**相关性（Correlation）**问题：语言 $L_1$ 和 $L_2$ 是否导致相似的动作序列 $A$？然而，这种视角无法区分**真正的策略不变性**与**对英语枢纽（English Pivot）的依赖**。如本文发现，模型通过 `Translate` 工具将非英语任务“归一化”为英语，从而获得高一致性。这并非模型具备跨语言能力，而是模型**逃避**了跨语言推理，退化为单语言推理。因此，我们需要一个能区分“原生跨语言策略”与“翻译中介策略”的新框架，并量化模型在**移除翻译捷径**后的真实策略鲁棒性。\n\n**（b）借鉴相邻领域的方法：**\n借鉴**因果推断（Causal Inference）**中的**干预（Intervention）**和**反事实推理（Counterfactual Reasoning）**概念，特别是 **Do-calculus** 和 **Structural Causal Models (SCM)**。在因果推断中，我们不仅观察 $P(Y|X)$，还评估 $P(Y|do(X))$。在这里，我们将“语言”视为一个混杂变量（Confounder），将“翻译工具的使用”视为一个中介变量（Mediator）。我们可以构建一个因果图：$Language \\rightarrow Translation\\_Tool \\rightarrow Action\\_Trace$。通过**阻断（Blocking）** $Translation\\_Tool$ 这一路径，我们可以评估语言对动作轨迹的**直接效应（Direct Effect）**，从而剥离出模型真正的跨语言推理能力。\n\n**（c）第一个实验设计：**\n\n1.  **构建因果图**：定义变量 $L$（输入语言）、$T$（是否使用 Translate 工具）、$A$（动作轨迹）、$Y$（最终答案）。\n2.  **反事实干预实验**：\n    *   **自然观察（Observational）**：计算标准的 $\\tilde{I}$（如本文所做）。\n    *   **干预实验（Interventional）**：在推理过程中，**强制禁用** `Translate` 工具（$do(T=0)$），同时保持其他工具可用。\n    *   **反事实对比（Counterfactual）**：对于同一个任务，比较 $P(A|L_{en}, do(T=0))$ 和 $P(A|L_{hi}, do(T=0))$ 的相似度。\n3.  **定义新指标：原生跨语言策略保留率（Native Cross-Lingual Policy Retention, NCLPR）**：\n    *   $NCLPR = \\frac{Similarity(A_{en}^{no\\_trans}, A_{hi}^{no\\_trans})}{Similarity(A_{en}^{no\\_trans}, A_{en}^{no\\_trans})}$\n    *   这个指标衡量的是在**没有翻译捷径**的情况下，模型在不同语言下执行相同策略的能力。\n4.  **预期发现**：\n    *   如果 $NCLPR$ 显著低于本文报告的 $\\tilde{I}$，则证明当前的高一致性主要依赖于**英语枢纽**，而非真正的多语言对齐。\n    *   进一步，可以分析哪些类型的任务（如事实检索 vs. 逻辑推理）在移除翻译后一致性下降最快，从而识别出模型跨语言能力的**脆弱边界（Fragile Boundaries）**。\n\n**与已有工作的区别：**\n本文通过**统计校正**（如长度匹配、基线归一化）来更准确地测量“表面”的一致性。而本提议通过**因果干预**来揭示“深层”的策略依赖关系。它不再问“模型是否做了相同的事”，而是问“模型是否**因为**语言不同而**不得不**做不同的事，还是仅仅**选择**了翻译来规避差异”。这将评估从“行为描述”提升到“机制诊断”，为构建真正语言无关的 Agent 提供更具指导意义的反馈。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Sourabrata Mukherjee\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Kalika Bali\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Sunayana Sitaram\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Microsoft Research India\"\n    }\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "当使用工具的智能体被赋予不同语言的相同任务时，它是否仍采取相同的步骤？多语言评估很少提出这个问题：它比较最终答案并丢弃动作。然而，这些动作才是产物：它们决定了成本和延迟，决定了系统如何失败，并且是其行为中唯一可审计的部分。我们在8个模型、6个平行基准测试和41种语言（238万次 rollout）中，将动作策略作为测量对象。朴素测量方法失败了：原始轨迹相似性与任何可辩护的结论之间存在五个混淆因素，每个因素都能翻转结论。短轨迹得分更高，空轨迹得分为完美，不相关的轨迹有超过一半的时间因偶然而一致，差距受限于每个模型的可重复性，且同一模型在同一语言中被问两次相同问题时回答不同，导致没有基线。我们消除了所有五个混淆因素，且每次修正都使效应更大。差异被证明是结构性的，而非采样噪声：它在每个单元格中都能经受住贪婪解码，并且随着温度升高保持平稳，即使模型变得不那么自我一致。通过其自身的可重复性进行归一化后，四个截然不同的前沿模型在贪婪解码下收敛，每个模型在不同语言中保持71-73%的动作策略，模型身份仅解释了5.7%的方差。在大约10B参数以下，这种一致性崩溃，较小模型之间的排序很大程度上是我们通过置换而非假设测量的偶然下限的伪影。智能体通过英语路由非英语任务；这一枢纽在因果上起支撑作用，这一点在四个模型中通过预先注册的预测得到证实，并且即使被告知放弃，模型也不会放弃它。最后，一个单一的轨迹提取正则表达式，而非模型，制造了一个多语言失败：两个工作示例使一个模型的测量准确率提高了26倍，而其可读输出的准确率几乎没有变化。"}, {"title": "FlowScout: From Execution Feedback to Reliable Tool-Using Agent Workflows", "arxiv_id": "2608.10039", "authors": "Shuo Hao, You Lu, Bihuan Chen, Xin Peng", "summary": "Agentic workflows have become an important abstraction for building reliable LLM-based automation systems by organizing large language models (LLMs), tools, and control logic into explicit execution structures. However, constructing high-quality agentic workflows remains largely manual and requires substantial domain expertise. Recent studies have explored automatic agentic workflow generation from historical task-solving records, but they mainly produce LLM-centric workflows, where real tool executions are abstracted and simulated by LLM nodes, limiting the usability and stability of generated workflows. To address these limitations, we propose FlowScout, an execution-guided framework for generating tool-integrated agentic workflows from historical task-solving records. Specifically, FlowScout represents an agentic workflow as a directed graph composed of LLM nodes, tool-calling nodes, and dependency edges. It first mines a common tool coordination skeleton from historical records to construct an initial workflow, and then refines the workflow topology through Monte Carlo tree search guided by execution feedback. We evaluate FlowScout on four representative task domains and compare it with three baselines, i.e., PM4Py, ReAct and AFlow. Experimental results show that agentic workflows generated by FlowScout improve tool invocation correctness by at least 92.69% and execution quality by at least 17.66% over the baselines, while achieving lower performance variation across repeated runs.", "category": "cs.LG", "cluster": "Tool Use, Workflows \u0026 Documentation", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决如何从历史任务解决记录（historical task-solving records）中自动生成高质量、包含真实工具调用（tool-integrated）的 Agentic Workflow 的问题。随着 Large Language Models (LLMs) 在自动化任务中的应用日益广泛，Agentic Workflow 作为一种将 LLM、外部工具和控制逻辑组织成显式执行结构的抽象，已成为构建可靠 LLM 自动化系统的关键范式。然而，目前构建此类工作流主要依赖人工设计，需要深厚的领域知识和大量的迭代调试，效率低下且难以扩展。虽然近期研究开始探索基于历史记录的自动工作流生成，但现有方法主要生成以 LLM 为中心（LLM-centric）的工作流，即节点均为 LLM 操作（如规划、编程、格式化），而将真实的工具执行抽象化或由 LLM 模拟。这种抽象导致生成的工作流在运行时仍高度依赖 LLM 进行工具调用的模拟，从而引发行为不稳定、输出幻觉以及领域特定工具协调逻辑的可解释性差等问题。解决这一问题具有重要的工程与学术价值：首先，通过显式保留真实工具调用节点，FLOWSCOUT 生成的工作流能够显著降低运行时对 LLM 随机决策的依赖，从而提高工具调用的正确性（Tool Invocation Correctness）和执行结果的稳定性（Execution Stability）；其次，自动化的生成框架降低了构建复杂 Agentic Workflow 的门槛，使得非专家用户也能利用历史数据快速构建可复用、可观测的自动化系统，提升了 LLM 代理在金融、体育、旅游等复杂任务领域中的实用性和可靠性。\n\n### § 2 前人工作与不足\n\n该问题在前期研究中已有部分探索，但现有方法在生成工作流的“工具集成度”和“执行稳定性”上存在显著不足。最相关的先前工作包括 AFlow [44] 和 A[2]Flow [47]，它们利用历史任务解决记录（如用户查询、执行结果和验证过的工具编排日志）来搜索生成 Agentic Workflow。然而，这些方法生成的工作流本质上是 LLM-centric 的，其节点仅包含 LLM 操作（如 planning, programming, formatting），未能显式保留历史记录中嵌入的真实工具调用（real tool invocations）。这种设计缺陷导致生成的工作流在运行时仍需 LLM 模拟工具执行，无法固化具体的工具协调逻辑，从而限制了工作流的可用性和稳定性，容易因 LLM 的幻觉产生不一致的执行结果。另一类相关工作是传统的流程挖掘技术，如 PM4Py [35]，它可以从事件日志中发现过程模型。尽管 PM4Py 能提取工具编排模式，但它主要适用于具有明确语义、稳定执行模式和定义良好接口的传统任务，难以直接应用于需要语义理解、动态决策和灵活工具协调的开放式 LLM 任务场景，且直接将其发现的模式转化为可执行工作流时，缺乏对查询理解、工具选择和参数构建的支持，导致性能远低于基于 LLM 的方法。此外，ReAct [42] 等通用 LLM Agent 范式虽然能动态推理和行动，但其黑盒性质导致执行过程不可控、不稳定，且无法形成可复用的显式结构。综上所述，现有方法要么缺乏对真实工具调用的显式建模（如 AFlow），要么缺乏对 LLM 语义推理能力的整合（如 PM4Py），要么缺乏结构化的稳定性（如 ReAct），因此亟需一种能够结合历史执行反馈、显式集成工具节点并优化工作流拓扑的生成框架。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM Agent 领域，ReAct 等范式虽然灵活，但其“黑盒”推理导致执行结果不稳定、不可复现，且难以调试。为了解决这一问题，Agentic Workflow（智能体工作流）应运而生，它通过将 LLM、工具和逻辑显式地组织成结构化图，提供了可观察性和稳定性。然而，构建高质量的工作流目前主要依赖人工，这需要深厚的领域知识，且随着任务复杂度增加，手动设计变得不可扩展。\n\n现有的自动化工作流生成方法（如 AFlow）尝试从历史任务记录中自动学习工作流，但它们存在一个根本缺陷：生成的工作流是 **LLM-centric** 的。也就是说，这些方法将工具调用抽象为 LLM 节点内部的模拟行为，而不是显式的 **Tool-Calling Nodes**。这导致生成的工作流在运行时仍然高度依赖 LLM 的即时推理来模拟工具执行，从而继承了 LLM 的幻觉和不稳定性，未能真正解决“可靠性”问题。\n\n作者意识到，要生成真正可靠的工作流，必须将 **Real Tool Executions**（真实工具执行）显式地嵌入到工作流拓扑中，而不仅仅是让 LLM 模拟。但直接在一个巨大的搜索空间中随机搜索包含具体工具调用的图结构是低效且容易陷入局部最优的。因此，作者借鉴了传统流程挖掘（Process Mining）的思想，认为历史成功的任务记录中蕴含着通用的 **Tool Coordination Skeleton**（工具协调骨架）。通过先挖掘这个骨架作为初始结构，再结合 **Execution Feedback**（执行反馈）利用 **Monte Carlo Tree Search (MCTS)** 进行精细化搜索，可以高效地找到既包含真实工具调用又具备高执行正确性的工作流。这一思路将“结构挖掘”与“执行引导的优化”相结合，旨在填补从“LLM 模拟”到“真实工具集成”之间的空白。\n\n### § 4 核心 Intuition\n\n现有自动生成的工作流之所以不稳定，是因为它们用 LLM 节点模拟工具调用，导致运行时仍需 LLM 进行不确定的即时决策。FLOWSCOUT 的核心直觉是：应将历史任务中验证过的 **Tool Coordination Skeleton**（工具协调骨架）显式地固化为工作流中的 **Tool-Calling Nodes**，从而将不稳定的“推理-行动”循环转化为确定的“结构-执行”流程。通过 **Execution Feedback** 引导 **MCTS** 搜索，系统能够自动优化这一骨架与 LLM 节点的连接，确保工作流在保留 LLM 语义理解能力的同时，通过显式的工具依赖关系消除运行时幻觉，实现高可靠性的自动化。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nFLOWSCOUT 的核心方法是将 Agentic Workflow 的生成建模为一个基于执行反馈的图搜索问题。它不直接让 LLM 自由发挥，而是从历史任务记录中挖掘工具调用的“骨架”，并通过 Monte Carlo Tree Search (MCTS) 结合真实执行反馈来优化工作流拓扑。\n\n**完整 Pipeline 示例：旅行规划任务**\n\n假设我们要构建一个处理“查询两地距离并推荐酒店”任务的 Agentic Workflow。\n\n1.  **输入 (Input)**：\n    *   **可用工具集 (Available Tools)**：如 `GreatCircleDistance-KM`, `HotelSearch` 等 API。\n    *   **历史任务解决记录 (Historical Task-Solving Records)**：包含用户查询（如“从伯明翰到萨克拉门托的距离及酒店推荐”）、参考执行结果、以及经过验证的工具编排日志（Validated Tool Orchestration Logs，即人类或成功 Agent 实际调用的工具序列）。\n\n2.  **处理 (Processing)**：\n    *   **步骤 1：工作流挖掘 (Workflow Miner)**：\n        *   FLOWSCOUT 首先将历史记录分为优化集 ($D_{opt}$) 和验证集 ($D_{val}$)。\n        *   使用过程挖掘算法（如 PM4Py）分析 $D_{opt}$ 中的工具调用序列，提取出通用的**工具协调骨架 (Tool Coordination Skeleton)**。例如，发现大多数任务都遵循“先计算距离，再搜索酒店”的模式。\n        *   初始化初始工作流 $G_0$：在骨架中插入必要的 LLM 节点（如用于解析查询的 Planning Node 和用于生成最终回答的 Synthesizing Node），形成初始的有向图。\n    *   **步骤 2：工作流执行与反馈 (Workflow Executor)**：\n        *   将候选工作流编译为可执行的 Python 脚本。\n        *   在 $D_{opt}$ 上运行该工作流，收集**执行反馈 (Execution Feedback)**。这包括：实际调用的工具序列、最终输出结果、以及每个节点（LLM 或 Tool）的输入输出日志。\n        *   计算两个关键指标：**工具调用正确性 (Tool Invocation Correctness, TC)** 和 **执行分数 (Execution Score, ES)**。TC 衡量工具选择是否与参考日志一致，ES 通过 LLM-as-a-judge 评估最终结果的质量。\n    *   **步骤 3：工作流优化 (Workflow Optimizer via MCTS)**：\n        *   **选择 (Selection)**：在 MCTS 搜索树中，根据历史奖励和探索系数选择一个节点进行扩展。\n        *   **扩展 (Expansion)**：LLM 优化器分析执行反馈。如果发现“酒店信息缺失”，它可能提出修改计划：在距离计算后插入一个条件分支（Conditional Branch），如果检测到缺少酒店信息，则调用 `HotelSearch`。\n        *   **模拟 (Simulation)**：执行新的候选工作流，计算其在 $D_{opt}$ 上的标量奖励（TC 和 ES 的加权组合）。\n        *   **反向传播 (Backpropagation)**：将奖励沿路径回传，更新搜索树中各节点的访问次数和平均奖励。\n        *   迭代此过程，直到验证集 ($D_{val}$) 上的性能不再提升或达到最大迭代次数。\n\n3.  **输出 (Output)**：\n    *   **工具集成的 Agentic Workflow (Tool-Integrated Agentic Workflow)**：一个结构化的有向图，明确包含 LLM 节点（负责推理、规划、合成）和 Tool-Calling 节点（负责真实 API 调用），以及它们之间的数据和控制依赖边。\n    *   该工作流可直接部署，用于处理新的、未见过的用户查询，具有更高的稳定性和工具调用准确性。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的理论证明，但其核心在于将工作流生成形式化为一个**图搜索优化问题**，并定义了具体的评估指标。以下是关键公式的直觉解释：\n\n1.  **工作流定义**：\n    *   工作流被定义为一个有向图 $G = (V, E)$。\n    *   $V$ 包含两类节点：LLM 节点 $v_l = \\langle \\delta_{v_l}, \\rho_{v_l} \\rangle$（模型和提示词）和工具调用节点 $v_t = \\langle t, \\vartheta_t \\rangle$（工具和参数）。\n    *   $E$ 是依赖边，编码数据流或控制流。\n    *   **直觉**：将 Agent 的行为从黑盒序列转化为可视化的、可编辑的结构化图。\n\n2.  **工具调用正确性 (Tool Invocation Correctness, TC)**：\n    *   公式核心：$TC(G, q_i) = \\frac{|LCS(\\pi_i, \\hat{\\pi}_i)|}{\\max(K_i, \\hat{K}_i)}$\n    *   其中 $\\pi_i$ 是参考工具调用序列，$\\hat{\\pi}_i$ 是工作流生成的序列，$LCS$ 是最长公共子序列（要求工具名和参数完全匹配）。\n    *   **直觉**：分子计算正确匹配的工具调用数量。分母取参考序列长度和生成序列长度的最大值，这意味着如果工作流漏调用了工具（$\\hat{K}_i \u003C K_i$）或多调用了冗余工具（$\\hat{K}_i \u003E K_i$），都会受到惩罚。这比单纯除以 $K_i$ 更严格，能同时检测缺失和冗余。\n\n3.  **执行分数 (Execution Score, ES)**：\n    *   公式核心：$ES(G, q_i) = \\frac{1}{|X|} \\sum_{x \\in X} s_i^x$\n    *   其中 $X$ 是评估维度（正确性、完整性、相关性、清晰度），$s_i^x$ 是 LLM-as-a-judge 给出的分数。\n    *   **直觉**：由于最终结果可能是自然语言，难以用规则自动评估，因此使用另一个 LLM 从多个维度打分，取平均值作为最终质量指标。\n\n4.  **优化目标**：\n    *   目标是在候选工作流空间 $\\Omega(T)$ 中找到 $G^*$，使得在历史数据集 $D$ 上的平均 TC 和 ES 最大化。\n    *   **直觉**：这是一个多目标优化问题，通过 MCTS 搜索，平衡探索（尝试新结构）和利用（保留高奖励结构），最终找到在历史数据上表现最好且泛化能力强的工作流拓扑。\n\n### § 7 实验设计与结论\n\n**RQ1: 有效性 (Effectiveness)**\n*   **问题**：FLOWSCOUT 生成的工作流在工具调用准确性和任务完成质量上是否优于基线？\n*   **实验**：在 ToolBench 的四个领域（金融、体育、旅行、天气）上，对比 FLOWSCOUT 与 PM4Py（传统过程挖掘）、ReAct（标准 Agent）、AFlow（LLM-centric 工作流生成）。评估指标为 TC 和 ES。\n*   **答案**：FLOWSCOUT 在所有领域均表现最佳。相比 ReAct，TC 提升至少 92.69%，ES 提升至少 17.66%。相比 AFlow，ES 提升 19.59%。这表明显式集成真实工具调用的工作流比纯 LLM 模拟或无结构 Agent 更准确、更有效。\n\n**RQ2: 稳定性 (Stability)**\n*   **问题**：FLOWSCOUT 生成的工作流执行结果是否更稳定（方差更小）？\n*   **实验**：对同一组测试查询重复运行 10 次，计算 ES 的变异系数 (Coefficient of Variation, CV)。\n*   **答案**：FLOWSCOUT 的 CV 最低，相比 ReAct 降低 62.09%，相比 AFlow 降低 27.90%。结构化工作流减少了运行时 LLM 的随机决策，从而提高了可重复性。\n\n**RQ3: 消融研究 (Ablation Study)**\n*   **问题**：工作流挖掘器 (Miner) 和 MCTS 优化器各自贡献了多少？\n*   **实验**：构建变体：FLOWSCOUT-NOMCTS（仅挖掘，不优化）、FLOWSCOUT-NOMINER（从空图开始 MCTS）、FLOWSCOUT-BEAM（用束搜索代替 MCTS）。\n*   **答案**：移除 MCTS 导致性能大幅下降（TC -30.15%, ES -71.18%），说明初始骨架需要优化。移除 Miner 导致搜索效率降低且性能略降，说明 Miner 提供了良好的“热启动”。MCTS 比束搜索在相同时间内找到更优解，因为束搜索容易过早收敛。\n\n**RQ4: 泛化能力 (Generalization)**\n*   **问题**：生成的工作流能否泛化到未见过的工具或不同的 LLM 后端？\n*   **实验**：\n    1.  **工具泛化**：用生成时未见的功能相似工具替换原有工具，评估性能。\n    2.  **LLM 泛化**：保持工作流拓扑不变，更换执行 LLM（如从 GPT-4o-mini 换为 DeepSeek-V3.2 或 Qwen3-32B）。\n*   **答案**：\n    1.  工具替换后，FLOWSCOUT 保留了 85.98% 的 TC 和 91.86% 的 ES，仍优于基线。这是因为工作流分离了“编排逻辑”和“具体工具绑定”，工具节点在运行时动态选择工具。\n    2.  LLM 替换后，FLOWSCOUT 保留了 98% 以上的 ES，表明工作流拓扑编码了任务解决能力，对具体 LLM 模型的依赖性较低，具有良好的可移植性。", "additional_insights": "### § 8 Take-aways\n\nFLOWSCOUT 的核心突破在于将 Agentic Workflow 从纯 LLM 推理节点（LLM-centric）重构为显式包含 Tool-Calling Nodes 的有向图，从而解决了现有自动工作流生成方法因模拟工具执行而导致的幻觉和不稳定性问题。该方法通过两阶段策略实现工作流生成：首先利用 Process Mining（如 PM4Py）从历史任务记录中提取通用的 Tool Coordination Skeleton 作为初始拓扑，随后通过 Execution-Guided Monte Carlo Tree Search (MCTS) 结合真实执行反馈对图结构进行迭代优化。实验表明，这种显式建模工具调用的方式显著提升了 Tool Invocation Correctness (TC) 和 Execution Score (ES)，在四个基准领域中将 TC 提高了至少 92.69%，并将执行结果的变异系数降低了 62.09%，证明了结构化工作流在复杂工具编排中的稳定性优势。尽管 FLOWSCOUT 在运行时引入了约 24.12% 的额外延迟，但其生成的工作流表现出极强的泛化能力，在替换未见过的工具集或更换底层 LLM Backbone（如从 GPT-4o-mini 换为 Qwen3-32B）时，仍能保留超过 90% 的原始性能，验证了工作流拓扑与具体工具/模型解耦的有效性。\n\n### § 9 最脆弱的假设\n\nFLOWSCOUT 最关键的假设是：**历史任务解决记录（Historical Task-Solving Records）中的工具编排日志（Tool Orchestration Logs）具有足够的代表性和一致性，能够挖掘出通用的、可泛化的工具协调骨架（Coordination Skeleton）。** 如果这一假设不成立，即真实场景中的任务解决路径高度发散、缺乏共同模式，或者历史数据存在大量噪声和非最优路径，那么基于 Process Mining 提取的初始骨架将是碎片化或错误的，导致 MCTS 搜索空间起始点偏差极大，甚至无法收敛到有效工作流。论文通过筛选 ToolBench 中经过人工验证（validated）的记录来缓解此问题，并展示了在 Finance、Sports 等结构化较强的领域效果显著；然而，论文未充分探讨在开放域或长尾任务中，当工具调用顺序高度依赖动态上下文而非固定模式时，该骨架挖掘机制的鲁棒性。若实际部署中缺乏高质量、标准化的历史日志，FLOWSCOUT 的“冷启动”优势将不复存在，其性能可能退化为随机搜索甚至低于基线。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现并验证 FLOWSCOUT 中 **Workflow Miner 模块对初始工作流质量的贡献**，无需实现完整的 MCTS 优化器。具体方案如下：使用 ToolBench 中 Finance 领域的 Seen-Tools 数据，提取其 validated tool orchestration logs。实现一个简化的 Workflow Miner，利用 PM4Py 库从这些日志中挖掘过程模型，并将其转换为包含通用 Tool-Calling Positions 的初始有向图（即 FLOWSCOUT 的 $G_0$）。随后，构建一个极简的 Workflow Executor，仅执行该初始图（不进行 MCTS 优化），在 Finance 领域的 Test Set 上运行，计算其 Tool Invocation Correctness (TC) 和 Execution Score (ES)。作为对比，实现一个 Baseline Miner，随机生成相同节点数的图结构，或使用简单的频率统计而非过程挖掘。如果 FLOWSCOUT 的 Miner 生成的初始图在 TC 上显著高于随机或简单频率基线（例如 TC 提升超过 20%），则支持了“过程挖掘能提供有效结构化先验”这一核心 claim；反之，若两者无显著差异，则说明骨架挖掘的价值有限，FLOWSCOUT 的性能提升主要归功于后续的 MCTS 而非初始结构。", "research_value": "### § 11 最强反例设计\n\n若要挑战 FLOWSCOUT 的有效性，最有力的攻击点在于其核心假设的脆弱性：**历史任务解决记录（Historical Task-Solving Records）中的工具编排日志（Tool Orchestration Logs）具有足够的代表性和一致性，能够挖掘出通用的、可泛化的工具协调骨架（Coordination Skeleton）。** 这一假设在结构化强、路径固定的领域（如金融查询）可能成立，但在开放域或长尾任务中极易失效。\n\n**具体反例场景：动态上下文依赖的复杂决策任务**\n考虑一个“智能客服投诉处理”场景，用户查询高度非结构化，且解决路径严重依赖实时上下文（如用户情绪、账户状态、历史交互记录）。在此场景中，不存在单一的“最优工具调用序列”，而是存在多条等效但结构迥异的路径（例如：先查账单再安抚情绪，或先安抚情绪再查账单）。\n1.  **骨架挖掘失败**：由于历史日志中路径发散（Path Divergence），Process Mining（如 PM4Py）提取的“工具协调骨架”将变得极其稀疏或碎片化，无法形成有意义的通用拓扑。初始工作流 $G_0$ 可能退化为一个包含大量互斥分支的复杂图，甚至因噪声数据产生错误的依赖边。\n2.  **MCTS 搜索空间爆炸与局部最优**：由于初始骨架缺乏有效先验，MCTS 需要在巨大的搜索空间中进行探索。在动态上下文中，执行反馈（Execution Feedback）具有高度随机性（同一工作流在不同输入下表现差异巨大），导致奖励信号（TC 和 ES）噪声极大。MCTS 难以区分是“工作流结构缺陷”还是“输入上下文特殊性”导致的低分，从而陷入局部最优或无法收敛。\n3.  **替代解释**：FLOWSCOUT 在基准测试中的优异表现可能并非源于其“显式工具集成”架构，而是得益于 ToolBench 等基准数据集本身具有高度结构化的任务分布和清晰的工具调用模式。在真实世界中，当任务缺乏固定模式时，FLOWSCOUT 的性能可能退化为随机搜索，甚至低于 ReAct 等端到端方法，因为后者能动态适应上下文，而 FLOWSCOUT 被僵化的图结构束缚。\n\n**理论论证：结构刚性与泛化能力的权衡**\nFLOWSCOUT 通过固化工具调用节点来提高稳定性，但这本质上是以牺牲泛化能力为代价的。在开放域任务中，工具调用的正确性不仅取决于序列顺序，还取决于参数构建的细微差别和上下文理解。显式图结构难以编码这种细粒度的语义依赖，导致工作流在面对未见过的查询变体时，无法像 LLM-centric 方法那样灵活调整推理路径。因此，FLOWSCOUT 的“稳定性”优势仅在任务分布与训练数据高度一致时成立，一旦分布偏移（Distribution Shift），其性能将急剧下降。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从静态图搜索到动态策略学习：基于强化学习的自适应 Agentic Workflow 生成（Adaptive Workflow Generation via Reinforcement Learning）**\n\n**（a）驱动局限与未满足需求**\nFLOWSCOUT 的核心局限在于其生成的工作流是**静态的（Static）**。一旦通过 MCTS 优化完成，工作流拓扑即固定不变，无法在运行时根据输入查询的动态特性（如复杂度、不确定性、工具可用性）进行自适应调整。这导致其在面对分布外（Out-of-Distribution, OOD）查询或动态环境变化时缺乏灵活性。此外，MCTS 的搜索过程计算成本高昂，且依赖于高质量的历史日志，难以在数据稀缺或噪声大的场景中快速迭代。因此，亟需一种能够**在线学习（Online Learning）**并**动态调整（Dynamic Adjustment）**工作流结构的方法，以平衡稳定性与灵活性。\n\n**（b）借鉴相邻领域的方法或工具**\n借鉴**强化学习（Reinforcement Learning, RL）**中的**策略梯度（Policy Gradient）**方法和**图神经网络（Graph Neural Networks, GNNs）**。具体而言，将工作流生成建模为一个序列决策问题，其中智能体（Agent）学习一个策略网络，该网络根据输入查询的嵌入表示，动态生成或选择工作流子图。GNNs 可用于编码工作流的结构信息，而 RL 则用于优化策略，以最大化长期奖励（即任务完成质量和效率）。这种方法可以借鉴 AlphaGo 等工作中将搜索与学习结合的思想，但更侧重于端到端的策略学习，而非离线的图搜索。\n\n**（c）第一个实验设计**\n1.  **任务设定**：选择一个具有高度动态性和上下文依赖性的任务领域，如“多轮对话式旅行规划”，其中用户可能在对话过程中随时改变需求（如从“经济型酒店”改为“豪华型”，或增加“景点推荐”）。\n2.  **基线对比**：对比 FLOWSCOUT（静态工作流）、ReAct（端到端动态推理）和提出的 **RL-Workflow**（动态策略学习）。\n3.  **实验流程**：\n    *   **训练阶段**：使用历史对话数据训练 RL-Workflow 策略网络。状态空间包括当前查询、已执行的工具调用序列和中间结果；动作空间包括选择下一个工具、插入 LLM 推理节点或终止工作流。奖励函数结合 TC、ES 和步骤效率（Step Efficiency）。\n    *   **测试阶段**：在未见过的对话轨迹上测试三种方法。特别关注在用户需求发生突变（Context Switch）时的适应能力和最终任务完成质量。\n    *   **评估指标**：除了 TC 和 ES，增加**自适应延迟（Adaptation Latency）**和**结构多样性（Structural Diversity）**指标，衡量方法在不同输入下生成不同工作流结构的能力。\n4.  **预期结果**：RL-Workflow 应在动态场景下表现出更高的灵活性和鲁棒性，能够根据输入动态调整工作流长度和结构，而 FLOWSCOUT 可能因静态结构导致冗余步骤或错误分支，ReAct 则可能因缺乏结构约束而出现幻觉或不稳定。\n\n**与已有工作的区分**\n与 FLOWSCOUT 的离线图搜索不同，RL-Workflow 强调**在线策略学习**和**动态结构生成**。它不依赖于预定义的“工具协调骨架”，而是通过策略网络直接从数据中学习工作流生成的概率分布。这使得方法能够处理更复杂的、非确定性的任务场景，并具备更强的泛化能力和适应性。此外，RL-Workflow 可以无缝集成新的工具或领域知识，只需微调策略网络，而无需重新进行耗时的 MCTS 搜索。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Shuo Hao\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"You Lu\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Bihuan Chen\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Xin Peng\", \"affiliations\": [1], \"markers\": [\"*\"]}\n  ],\n  \"i
