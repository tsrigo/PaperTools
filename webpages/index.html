）和逻辑错误，且不同领域（如代码、网页、具身智能）需要完全不同的生成流水线，工程负担极重。\n\n研究者意识到，与其从零开始“编写”新环境，不如对现有高质量、带可信验证器的静态环境进行“改造”。类比于 Agent 侧的 **Agent Harness**（通过插件扩展 LLM 能力而不修改模型权重），环境侧是否也能通过一个可编程层（Programmable Layer）来动态调整环境行为？关键在于，这种改造必须是非侵入式的（Non-invasive），即不修改底层环境的代码逻辑，仅通过拦截和修改标准接口（`reset`/`step`）的信息流来实现。这样既能保留原始环境的可信验证器，又能实现跨领域的通用性。\n\n接下来需要解决的是“如何自动化定制”的问题。手动编写改造逻辑同样昂贵。研究者观察到，Agent 的失败轨迹（Trajectories）包含了丰富的诊断信息。如果将目标策略（Policy）视为黑盒，通过分析其成功与失败的轨迹，可以诊断出具体的行为缺陷（如循环动作、观察解析失败等）。基于此，可以设计一个自动化循环（EnvRigger），它观察轨迹、诊断缺陷、生成对应的环境改造组件（如改变初始状态、限制动作空间、串联任务），并通过新的 rollout 验证这些组件是否有效提升了学习信号。这种“诊断-生成-验证”的闭环，使得环境能够随着 Agent 能力的提升而动态进化，实现真正的协同进化（Co-evolution）。\n\n### § 4 核心 Intuition\n\nEnvHarness 的核心直觉是将环境构建从“从零编写（Authoring）”转变为“接口包装（Wrapping）”，利用非侵入式的插件层（Stage, Contract, Chain）在标准 `reset`/`step` 接口上动态重塑静态环境，从而在不破坏原始可信验证器（Verifier）的前提下，针对 Agent 的具体弱点生成定制化的学习信号。\n\n通过 EnvRigger 自动化诊断 Agent 的执行轨迹并合成对应的环境改造组件，该方法实现了环境与策略的闭环协同进化，解决了传统静态环境缺乏针对性以及自动生成环境缺乏可靠性与通用性的根本矛盾。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**EnvHarness** 的核心思想是将静态环境（Static Environment）视为一个黑盒，通过在其标准接口（`reset`/`step`）外层包裹可编程的插件组件（Plug-in Components），在不修改底层环境代码和验证器（Verifier）的前提下，动态重塑环境的行为。为了自动化这一过程，论文提出了 **EnvRigger**，这是一个基于策略（Policy）表现进行诊断并生成 EnvHarness 组件的闭环系统。\n\n以下以 **SWE-bench Verified**（软件工程基准）中的一个具体任务为例，展示完整的 Pipeline：\n\n**1. 输入 (Input)**\n*   **基础环境 (Base Environment)**: 一个冻结的 GitHub Issue 修复任务，包含代码库、测试脚本和原始验证器。\n*   **目标策略 (Target Policy)**: 一个待训练的 LLM Agent（例如 Gemini 3.5 Flash），当前在该任务上表现不佳（例如：经常提交未运行测试的代码，导致修复无效）。\n*   **初始轨迹 (Initial Trajectories)**: EnvRigger 首先让策略在原始环境中运行 $K=5$ 次，收集执行轨迹。\n\n**2. 处理 (Processing) - EnvRigger 循环**\nEnvRigger 通过四个阶段自动生成 EnvHarness 组件：\n\n*   **Observe (观察)**:\n    *   EnvRigger 分析这 5 条轨迹。发现策略虽然修改了代码，但在提交前没有运行 `pytest`，导致许多修复实际上并未通过测试。\n*   **Diagnose (诊断)**:\n    *   诊断结果为：“策略缺乏‘验证驱动开发’的习惯，盲目提交补丁。”\n    *   定制方向：需要强制策略在提交前运行测试，或者惩罚未运行测试的提交行为。\n*   **Write (编写)**:\n    *   EnvRigger 调用 LLM 生成一个 **Contract** 组件（具体为 `Rules` 类）。\n    *   生成的代码逻辑：拦截 `git commit` 或提交动作。如果检测到之前的步骤中没有执行 `pytest` 或 `run_tests.py`，则返回错误信息 `\"githook: pre-commit hook 'verify-tests' failed. Run the test suite before submitting.\"` 并阻止提交。\n*   **Validate (验证)**:\n    *   将生成的 Contract 包裹在基础环境上，形成新的 **EnvHarness Environment**。\n    *   让策略在新环境中重新运行 $K=5$ 次。\n    *   **评估**: 如果策略学会了先运行测试再提交，且成功率在合理范围内（既不是 0% 也不是 100% 的 trivial 成功），则接受该组件。如果策略完全无法解决（SR=0），则拒绝并重新生成更宽松的组件；如果策略依然不运行测试就提交（被拦截），则视为有效信号，接受该组件以迫使策略学习新技能。\n\n**3. 输出 (Output)**\n*   **定制化环境 (Customized Environment)**: 一个包裹了 `Contract` 组件的环境。在这个环境中，任何未经验证的提交都会被拒绝。\n*   **技能提取 (Skill Extraction)**: 从策略在 EnvHarness 环境中成功解决问题的轨迹中，提取出“Verification-Driven Development Loop”这一技能（Skill）。\n*   **最终应用**: 将该技能注入到策略中，用于在原始环境或其他任务中进行推理或强化学习。\n\n**核心组件类型说明：**\n*   **Stage**: 修改初始状态（$s_0$）。例如，在 ALFWorld 中，通过预执行动作将杯子藏在抽屉里，迫使 Agent 学习搜索技能。\n*   **Contract**: 修改交互规则（Action/Observation/Transition）。例如，屏蔽某些快捷指令，或截断观察信息以测试部分可观测性。\n*   **Chain**: 串联多个环境。例如，先修复 Bug A，再修复 Bug B，测试 Agent 的长程目标保持能力。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过。**\n\n本文主要提出的是一个工程框架和自动化流程，而非基于复杂数学定理推导的新算法。文中虽然给出了 EnvHarness 的形式化定义（将环境定义为元组 $E = (S, A, O, T, R, s_0)$，并将 EnvHarness 组件定义为变换函数 $w$），但这更多是为了明确接口规范（Interface Protocol），而非进行理论收敛性或边界分析。核心贡献在于通过 **EnvRigger** 的启发式搜索和验证循环来自动化组件生成，其理论基础依赖于 LLM 的代码生成能力和强化学习中的课程学习（Curriculum Learning）思想，而非新的数学公式推导。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有的 Agent 学习环境是静态且手工构建的，无法针对 Agent 的弱点进行自适应调整；而现有的自动生成环境方法（如 GenEnv, SWE-smith）具有领域特异性（Domain-specific），且生成的环境验证器不可靠或成本高昂。如何在不修改底层环境逻辑的前提下，通用、自动地生成针对特定策略弱点的高质量训练环境？\n\n**2. 设计了什么实验验证这个问题？**\n*   **基准测试 (Benchmarks)**: 在四个不同领域的五个基准上测试：ALFWorld (具身智能), WebArena (网页交互), SWE-bench Verified (软件工程), OfficeQA 和 SpreadsheetBench (办公自动化)。\n*   **对比基线 (Baselines)**:\n    *   **No Skills**: 无技能增强的原始策略。\n    *   **Original Envs**: 从原始静态环境中提取技能。\n    *   **GenEnv / VeriEnv / SWE-smith**: 领域特定的环境生成基线。\n*   **评估范式**:\n    *   **Skill-based Learning (SL)**: 从 EnvHarness 环境中提取技能，评估在 held-out 任务上的性能提升。\n    *   **Reinforcement Learning (RL)**: 直接在 EnvHarness 环境中进行在线 RL 训练（使用 GRPO），对比在原始环境中训练的效果。\n    *   **Scaling Analysis**: 随着环境数量增加，对比 EnvHarness 与原始/生成环境的性能增长曲线。\n    *   **Cross-Model Generalization**: 在不同能力的 LLM  backbone 上测试 EnvHarness 技能的泛化性。\n\n**3. 问题的答案是什么？**\n*   **性能显著提升**: EnvHarness 在所有基准上均优于原始环境和领域特定的生成基线。在 ALFWorld 上实现了高达 9.0 点的提升，在 SWE-bench Verified 上实现了 2.7-5.4 点的提升。\n*   **效率提高**: 在 SWE-bench Verified 上，使用 EnvHarness 技能不仅提高了成功率，还减少了 9.8% 的执行步骤（Average Steps），证明其能纠正低效行为（如重复循环）。\n*   **通用性与可扩展性**: EnvHarness 通过统一的接口跨领域工作，无需为每个领域重新设计生成管道。随着环境数量增加，EnvHarness 的性能持续上升，而原始环境和生成环境的性能趋于饱和。\n*   **RL 信号优化**: 在 RL 设置下，EnvHarness 提供的定制化环境比静态环境提供了更有效的优化信号，显著提升了最终策略的性能。\n*   **结论**: 通过“包裹”而非“重写”环境，EnvHarness 成功实现了针对策略弱点的自动化环境定制，解决了静态环境缺乏针对性、生成环境缺乏通用性和可靠性的问题。", "additional_insights": "### § 8 Take-aways\n\nEnvHarness 提出了一种“环境包装器”范式，通过 `Stage`（修改初始状态）、`Contract`（重写交互规则）和 `Chain`（串联任务）三个插件组件，在不修改底层环境代码和验证器（Verifier）的前提下，动态重塑静态环境的行为。该方法解决了现有环境生成方法依赖特定领域流水线、验证不可靠且环境静态僵化的问题，实现了跨领域的通用性。EnvRigger 是一个自动化代理，它将目标策略视为黑盒，通过观察执行轨迹诊断弱点，并迭代生成和验证 EnvHarness 组件，从而生成针对策略缺陷的定制化训练环境。实验表明，在 ALFWorld、WebArena、SWE-bench 等五个基准测试中，使用 EnvHarness 环境提取的技能（Skills）或进行强化学习（RL），均显著优于原始环境和领域特定的环境生成基线（如 SWE-smith）。EnvHarness 不仅提升了最终性能（最高提升 9.0 分），还提高了执行效率（减少 9.8% 的步骤），因为它能针对性地消除策略中的冗余或错误行为模式。该方法支持策略与环境的持续协同进化（Co-evolution），随着环境数量的增加，性能持续上升，而原始环境和生成环境则趋于饱和。EnvHarness 保留了原始环境的人工验证器，确保了评估的确定性和可信度，避免了 LLM 模拟环境可能带来的幻觉和评估漂移。\n\n### § 9 最脆弱的假设\n\nEnvHarness 最核心的脆弱假设是：**底层环境必须支持确定性的、可重置的 `reset`/`step` 接口，且其内部状态可以通过标准接口完全观测或控制。** 如果环境是一个不可逆的真实世界系统（如真实的银行账户操作、物理机器人的一次性动作）或一个黑盒 API 服务（无法获取中间状态或重置），EnvHarness 的 `Stage`（依赖重置后重放动作来设定初始状态）和 `Contract`（依赖读取 `env_state` 来过滤动作或修改观察）将无法工作。论文在 Limitations 部分明确承认了这一点，指出该方法排除了基于实时服务或不可重置后端的场景。虽然论文在附录 C 中展示了通过 `Bridge` 适配不同运行时（如 Docker 容器、浏览器、文本引擎）的能力，但这仍然依赖于这些运行时能够被序列化、快照或重置。如果未来的 Agent 应用场景大量转向不可逆的、一次性的真实世界交互，或者底层环境不提供足够的状态可见性（例如某些专有 SaaS 平台不暴露内部状态），EnvHarness 的通用性将大打折扣。论文提供的证据主要局限于可重置的模拟环境（ALFWorld, WebArena, SWE-bench 等），缺乏在部分可观测或不可重置环境中的有效性证明，这使得该假设成为限制其广泛部署的关键瓶颈。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 EnvHarness 在 **ALFWorld** 或 **Toy24** 等轻量级文本环境中的核心机制，验证“针对性环境重塑能提升策略效率”这一 claim。具体步骤如下：首先，选择一个简单的文本环境（如 ALFWorld 的子集或自定义的 Toy24 游戏），并训练一个基础 LLM 策略（如 Qwen-7B 或 Llama-3-8B）。其次，手动实现一个简化的 `Contract` 组件，例如强制策略在执行“打开抽屉”前必须先“观察”抽屉，或者在 SWE-bench 的简化版中，强制策略在提交代码前必须运行测试。然后，收集基础策略在原始环境中的失败轨迹，诊断其弱点（如跳过观察步骤）。接着，应用手动编写的 `Contract` 重塑环境，并让策略在新环境中进行少量步数的交互或微调（Skill Extraction）。最后，测量策略在测试集上的成功率（Success Rate）和平均步骤数（Average Steps）。如果应用 `Contract` 后的策略在保持或提高成功率的同时，显著减少了无效步骤（如盲目尝试），则支持了 EnvHarness 能提供更优优化信号的 claim。反之，如果步骤数增加或成功率下降，则可能表明手动设计的约束未能准确捕捉策略弱点，或约束本身引入了过高的难度。此实验无需复现完整的 EnvRigger 自动化循环，仅验证核心组件的有效性。", "research_value": "### § 11 最强反例设计\n\n要挑战 EnvHarness 的有效性，最有力的攻击并非质疑其代码生成的正确性，而是攻击其**“诊断-生成”闭环中的信号噪声与过拟合风险**，即证明 EnvRigger 生成的组件往往是在拟合特定策略的“表面症状”而非“根本缺陷”，导致在分布外（Out-of-Distribution, OOD）场景下性能崩溃。\n\n具体反例设计如下：构建一个**“多路径等效解”（Multiple Equivalent Solutions）**的基准测试集。在该设定中，Agent 可以通过多种截然不同的行为序列（Behavioral Sequences）成功完成任务，但 EnvRigger 基于有限的初始轨迹（$K=5$）进行诊断时，极易将“非最优但有效”的路径误判为“错误路径”，并生成强制性的 `Contract` 来屏蔽这些路径。例如，在 SWE-bench 任务中，Agent 可能通过直接修改配置文件而非运行测试来快速验证修复（一种启发式捷径），EnvRigger 可能将其诊断为“缺乏验证习惯”并强制要求运行 `pytest`。然而，在某些边缘案例中，运行 `pytest` 本身可能因环境依赖问题而失败，导致 Agent 陷入死锁，而原始的启发式捷径反而是鲁棒的。\n\n**实验验证方案**：\n1.  **构造对抗性基准**：选择一组任务，其中存在至少两种成功率相当但行为模式迥异的解决方案（例如：显式搜索 vs. 隐式记忆检索；运行测试 vs. 静态分析）。\n2.  **引入诊断偏差**：故意让 EnvRigger 在 `Observe` 阶段只看到采用“捷径”策略的失败轨迹（例如因环境噪声导致的偶然失败），从而诱导其生成禁止该捷径的 `Contract`。\n3.  **评估泛化性**：将生成的 EnvHarness 环境应用于持有集（Held-out Set），其中“捷径”策略实际上是更优或唯一可行的解。\n4.  **预期结果**：如果 EnvHarness 的性能显著低于原始环境，甚至低于随机基线，则证明其生成的组件具有**“策略特异性过拟合”（Policy-Specific Overfitting）**。这表明 EnvRigger 缺乏对任务本质（Task Semantics）的理解，仅在进行浅层的轨迹模式匹配，从而破坏了 Agent 探索多样化解决方案的能力，违背了“自适应优化”的初衷。\n\n此外，还可以从**计算效率与边际收益**角度攻击：证明 EnvRigger 的 `Validate` 循环所需的额外交互成本（Rollouts）远超其带来的性能提升。如果生成一个有效的 `Contract` 需要平均 50 次额外的环境交互，而该 `Contract` 仅将成功率从 80% 提升到 82%，那么在实际的大规模 Agent 训练中，EnvHarness 的 ROI（Return on Investment）为负，不具备工程可行性。\n\n### § 12 Follow-up Research Idea\n\n基于 EnvHarness 依赖“可重置、全观测”环境这一核心局限，以及其仅能处理“离散动作空间”中显式规则约束的不足，提出一个新的研究方向：**Probabilistic Environment Shaping via Latent State Inference（基于潜在状态推断的概率性环境塑造）**。\n\n**(a) 驱动局限与未满足需求**：\nEnvHarness 假设环境状态是显式且可完全观测的（如代码库文件、网页 DOM），但在真实世界或复杂模拟中，Agent 往往面对**部分可观测马尔可夫决策过程（POMDP）**，且环境不可重置或重置成本极高（如在线推荐系统、实时金融交易）。现有的 `Contract` 机制无法处理连续状态空间中的模糊约束，也无法在不可逆操作中提供“试错”空间。我们需要一种方法，能够在不修改底层环境、不要求完全状态观测的前提下，通过**隐式反馈**来引导 Agent 学习。\n\n**(b) 借鉴相邻领域的方法**：\n借鉴**逆强化学习（Inverse Reinforcement Learning, IRL）**和**潜在变量模型（Latent Variable Models）**中的思想，特别是**Diffusion Policy**在连续动作空间中的生成能力，以及**Causal Inference**中的反事实推理（Counterfactual Reasoning）。具体而言，引入一个**“环境影子模型”（Environment Shadow Model）**，该模型不直接修改环境动作，而是通过观察 Agent 的轨迹，推断出环境的潜在状态分布，并生成**概率性的奖励信号（Probabilistic Reward Signals）**或**软约束（Soft Constraints）**，而非硬性的 `Contract` 拦截。\n\n**(c) 第一个实验设计**：\n1.  **场景选择**：选择一个**部分可观测且不可重置**的基准，如**MuJoCo**中的复杂物理控制任务（Agent 只能看到局部传感器数据，且每次重置需要重新加载物理引擎，成本高），或**在线广告点击率优化**模拟环境。\n2.  **方法实现**：\n    *   构建一个**Latent EnvShaper**，它不包裹 `reset/step` 接口，而是包裹**Reward Function**。\n    *   利用一个预训练的**World Model**（如 JEPA 或 DreamerV3 架构）来推断 Agent 未观测到的环境状态。\n    *   当 Agent 执行动作时，World Model 预测该动作在潜在状态空间中的后果，并生成一个**“反事实奖励”（Counterfactual Reward）**：如果 Agent 采取了更优的潜在路径，给予正向奖励；如果导致潜在状态发散，给予负向奖励。\n    *   这种奖励是**概率性**的，允许 Agent 探索，而非硬性禁止。\n3.  **对比基线**：\n    *   **EnvHarness**：尝试将其适配到该场景（需人工构造近似的全观测接口，作为上限基线）。\n    *   **Standard RL**：仅使用原始稀疏奖励。\n    *   **Proposed Method**：使用 Latent EnvShaper 生成的密集概率奖励。\n4.  **评估指标**：\n    *   **样本效率（Sample Efficiency）**：在相同交互步数下，Proposed Method 是否比 Standard RL 更快收敛？\n    *   **泛化性**：在未见过的物理参数或市场波动下，Proposed Method 是否比 EnvHarness（若强行适配）更鲁棒？\n    *   **可解释性**：分析 Latent EnvShaper 生成的奖励信号是否与人类专家的策略一致。\n\n**与已有工作的区别**：\nEnvHarness 是**显式、确定性、基于规则**的环境修改，适用于离散、全观测、可重置场景；而本提议是**隐式、概率性、基于模型**的环境塑造，适用于连续、部分可观测、不可重置场景。它不改变环境的物理逻辑，而是改变 Agent 对环境的**感知与反馈机制**，从而在更广泛的真实世界场景中实现 Agent 的自适应学习。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Chengsong Huang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\",\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Zifeng Wang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Rujun Han\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Jun Yan\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Yanfei Chen\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Zoey CuiZhu\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Ke Jiang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Peng Xia\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Han Yu\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Yufan Zhuang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Yifei Ming\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Jiaqi Pan\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Bhavana Dalvi Mishra\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Jiaxin Huang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Burak Gokturk\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Tomas Pfister\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Chen-Yu Lee\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Washington University in St. Louis\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Google Cloud AI Research\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Google Cloud\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"University of North Carolina at Chapel Hill\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"This work was done while Chengsong interned at Google Cloud AI Research.\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Equal contribution\"\n    }\n  ]\n}\n```", "summary_translation": "LLM agents 通过与环境交互进行学习，然而这些环境是手工构建且静态的：无法感知 agent 的弱点，并随着 agent 的提升而迅速落后。尽管最近的环境生成方法试图解决这一问题，但它们需要特定领域的流水线，依赖昂贵或不可靠的 verifier，并且仍然产生静态环境。为了减轻从头重建环境的工程负担，我们提出了 Environment Harness (EnvHarness)，这是一个由可插拔组件组成的可编程层，它包裹静态环境以重塑其行为，而无需修改底层逻辑。通过标准接口运行，EnvHarness 适用于不同领域，同时确保每个重塑后的环境保留其原始 verifier。为了自动化这一过程，我们引入了 EnvRigger，它将目标 policy 视为黑盒，观察其执行轨迹以合成针对诊断出的缺陷的 EnvHarness 组件，并通过新的 rollout 对其进行验证。在四个领域的五个 benchmark 上，EnvHarness 的表现优于原始环境和特定领域的环境生成流水线，在 held-out 实例上实现了高达 9.0 分的提升，同时执行步骤减少了 9.8%。此外，EnvHarness 为强化学习提供了更优的优化信号，实现了 policy 与其环境的持续、有针对性的协同进化。"}]}, {"name": "Training \u0026 Optimization Methods", "count": 2, "papers": [{"title": "MidTool: Mid-training Data Synthesis for Agentic Tool Use", "arxiv_id": "2608.20314", "authors": "Fengqing Jiang, Yite Wang, Boyi Liu, Zhaoyang Wang, Canwen Xu, Zhewei Yao, Radha Poovendran, Yuxiong He", "summary": "Mid-training is increasingly recognized as a critical stage for shaping the capabilities of large language models. Recent work has shown that targeted mid-training can strengthen reasoning-intensive abilities such as math and science, and can also improve agentic capabilities in software-engineering settings. In this work, we study the parallel but less explored agentic capability: general tool use. We present MidTool, an open corpus construction pipeline for agentic tool-use mid-training that combines large-scale web, PDF, and code data with synthesized supervision from real-world tool APIs, MCP skills, and document-grounded workflows. MidTool is designed to teach models how to recognize tool affordances, ground arguments from context, compose tool call workflow, and recover from incomplete information. We mid-train Qwen3-4B-Base and Qwen3-8B-Base on MidTool-Mix, and then apply follow-up post-training with both supervised fine-tuning and reinforcement learning. Compared with baselines, MidTool-Mix consistently improves downstream performance under both SFT and RL on BFCL, tau2-Bench, and MCP Universe. These results suggest that general tool use, like other important LLM capabilities, benefits from dedicated mid-training rather than being left entirely to post-training.", "category": "cs.AI", "cluster": "Training \u0026 Optimization Methods", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：**通用工具使用（general tool use）能力是否可以通过专门的中间训练（mid-training）阶段来塑造，而不是完全依赖后期的监督微调（SFT）和强化学习（RL）？** 具体而言，作者旨在构建一个开放的数据合成管道 `MidTool` 及对应的数据集 `MidTool-Mix`，以验证在预训练（pre-training）和后训练（post-training）之间引入针对工具使用的中间训练，能否为大型语言模型（LLM）提供更强的代理（agentic）能力基础。\n\n这一问题的重要性在于，当前的工具使用能力主要通过后训练获得，这给后训练阶段带来了巨大的负担。模型需要在相对狭窄的监督信号下，同时习得工具识别、基于 schema 的参数构建、缺失信息下的澄清以及多步执行等原子级代理能力。然而，支撑成功工具使用的知识广泛分布于开发者文档、PDF 手册、代码库和 API 规范中，这些内容通常不以干净的代理演示轨迹形式存在。如果仅依赖后训练，模型难以从这些异构且非结构化的数据中有效提取深层的工具使用先验。\n\n解决这一问题的价值体现在三个方面：首先，它证明了中间训练可以为后续的后训练提供更稳定、更强的基底，显著提升模型在 BFCL、$\\tau^2$-Bench 和 MCP-Universe 等基准上的表现，特别是在多轮交互和复杂工作流场景中。其次，它揭示了通用工具使用与特定探索性行为（如深度搜索）之间的能力边界，为未来针对特定领域的中间训练提供了指导。最后，通过开源 `MidTool` 管道和数据集，本研究降低了构建高质量代理训练数据的门槛，推动了从“仅靠后训练”向“多阶段协同训练”范式的转变。\n\n### § 2 前人工作与不足\n\n在本文之前，工具使用能力的提升主要依赖于**后训练（post-training）**策略，包括基于精心策划轨迹的监督微调（SFT）和强化学习（RL）。代表性工作如 **Toolformer** (Schick et al., 2023) 展示了模型可以通过自监督插入 API 调用；**ToolLLM** (Qin et al., 2023) 和 **APIGen** (Liu et al., 2024) 扩展了这一思路，构建了大规模的真实 API 和可验证的函数调用实例；**AgentBank** (Song et al., 2024) 和 **TOUCAN** (Xu et al., 2025) 则进一步收集了多轮交互轨迹，用于通用代理微调。此外，**Mid-training** 概念已在其他领域得到应用，例如 **MegaMath-Web-Pro** (Wang et al., 2025) 用于数学推理，**daVinci-Dev** (Zeng et al., 2026) 用于软件工程（SWE），以及 **AgentFounder** (Su et al., 2025) 用于深度研究。\n\n然而，现有研究存在以下不足：\n\n1.  **后训练的局限性**：现有的后训练方法主要依赖显式的交互轨迹（explicit trajectories），而忽略了分布在文档、代码和 PDF 中的隐性知识。这导致模型必须从狭窄的监督中同时学习所有原子能力，效率低下且难以泛化到未见过的工具或复杂工作流。\n2.  **中间训练在通用工具使用领域的缺失**：虽然中间训练在数学、代码和 SWE 领域已被证明有效，但**通用工具使用**作为一个中间训练目标尚未被充分探索。与数学或 SWE 不同，工具使用数据需要覆盖更广泛且异构的能力表面，包括自然语言文档、可执行代码模式、结构化 schema、多工具工作流以及因信息缺失导致的失败案例。现有的中间训练数据集（如 **Dolmino**）主要关注通用领域或特定推理任务，缺乏针对工具使用的专门设计。\n3.  **数据合成的针对性不足**：之前的工具使用数据集（如 **APIGen-MT**）主要关注后训练阶段的多轮轨迹生成，缺乏从原始异构数据（Web、PDF、Code）中合成中间训练监督信号的管道。现有工作未能有效解决工具使用中的两个核心缺陷：**grounding**（从杂乱文档中推断工具边界和参数）和 **execution**（多轮规划、澄清和恢复）。\n\n因此，本文指出，之前的研究要么局限于后训练阶段，未能利用中间训练阶段来塑造基础能力；要么在中间训练中缺乏对通用工具使用所需异构数据源和合成策略的专门处理。`MidTool` 通过结合上下文感知的轨迹增强（context-grounded trajectory augmentation）和原生代理轨迹合成（native agentic trajectory synthesis），填补了这一空白，证明了专门的中间训练对于提升通用工具使用能力至关重要。", "core_insight": "### § 3 重建作者的思考路径\n\n在大型语言模型（LLM）的发展中，**Tool Use** 已成为衡量 **Agentic Capability** 的关键指标。然而，现有的主流范式高度依赖 **Post-training**（包括 **Supervised Fine-Tuning (SFT)** 和 **Reinforcement Learning (RL)**）来赋予模型工具使用能力。这种范式存在明显的瓶颈：模型需要在相对狭窄的监督信号中，同时习得工具识别、参数 grounding、多步规划以及错误恢复等复杂的原子能力。更根本的问题在于，支撑工具使用的知识并非仅存在于显式的交互轨迹（Trajectories）中，而是广泛分布于开发者文档、PDF 手册、代码仓库和 API 规范等非结构化或半结构化数据中。这些丰富的上下文信息在传统的 **Post-training** 阶段往往被忽略，导致模型缺乏对工具边界和 schema 的深层理解。\n\n与此同时，**Mid-training** 作为一种介于通用预训练和特定任务后训练之间的阶段，已被证明能有效增强数学推理和软件工程等复杂能力。既然 **Mid-training** 能够通过注入领域特定的大规模数据来塑造模型的底层表征，那么对于同样需要广泛领域知识和复杂逻辑的通用工具使用能力，是否也能通过专门的 **Mid-training** 来提前塑造？现有的 **Mid-training** 工作多集中于数学、代码或深度研究，缺乏针对通用工具使用的专门数据构建 pipeline。因此，作者推测，如果在 **Mid-training** 阶段引入包含丰富上下文 grounding 和原生执行轨迹的合成数据，可以为模型建立更稳健的工具使用先验（Prior），从而减轻 **Post-training** 的负担，并提升模型在复杂、多轮交互场景下的泛化能力和鲁棒性。这一思路旨在将工具使用从单纯的“指令跟随”问题，转化为一个需要深层语义理解和执行规划的综合能力问题，通过早期的大规模数据注入来夯实基础。\n\n### § 4 核心 Intuition\n\n通用工具使用能力不仅仅依赖于显式的交互轨迹，更深深植根于分散在文档、代码和 API 规范中的上下文知识。传统的 **Post-training** 试图在狭窄的监督信号中同时学习 grounding 和执行，效率低下且容易遗忘底层知识。**MidTool** 的核心直觉是，通过在 **Mid-training** 阶段注入经过合成的、富含上下文 grounding 和原生执行轨迹的大规模数据，可以提前为模型建立对工具 schema、参数边界和多步工作流的深层理解。这种早期的能力塑造为后续的 **SFT** 和 **RL** 提供了更优的初始化状态和更强的归纳偏置，使得模型在面对复杂、未见过的工具环境时，能够更稳定地进行推理和恢复，从而显著提升整体性能。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n`MidTool` 的核心方法是一个用于构建通用工具使用（General Tool Use）中训练（Mid-training）数据的可扩展合成管道。该管道旨在解决大语言模型在工具使用中面临的两个核心缺陷：**Grounding**（从非结构化文档中推断工具边界和参数）和 **Execution**（在多轮交互中进行规划、澄清和恢复）。\n\n完整的 Pipeline 分为三个阶段，以下结合一个具体的真实例子进行讲解：\n\n**假设场景**：我们需要让模型学会如何使用 `OpenVPN` 配置服务器。原始数据源是一份关于 \"Secure Communications with OpenVPN on Ubuntu 10.04\" 的 Web 文档。\n\n**1. Stage 1: Data Source Collection（数据源收集）**\n*   **动作**：从四个互补的数据家族中收集原始数据：Web 页面、PDF 文档、代码仓库（GitHub）和结构化工具工件（API/MCP Skills）。\n*   **例子**：系统从 FineWeb 爬取数据，筛选出包含 \"OpenVPN\"、\"Ubuntu\"、\"Configuration\" 等关键词的 Web 页面。这些页面包含了安装步骤、配置文件说明和故障排除指南，但并没有直接的 Agent 交互轨迹。\n\n**2. Stage 2: Data Preprocessing（数据预处理）**\n*   **动作**：对原始数据进行清洗、去重和质量过滤。\n    *   **Web/PDF**：使用关键词/URL 预筛选，接着用轻量级 `fastText` 分类器（基于 LLM 标注的种子数据训练）过滤掉非技术性噪声，最后通过 `MinHash LSH` 去重。\n    *   **Code**：基于文件扩展名和内容启发式规则（如行长度、Alpha 比率）过滤，并排除二进制文件和日志。\n*   **例子**：上述 OpenVPN Web 页面经过 `fastText` 分类器判定为高质量技术文档（Positive），保留下来。如果页面包含大量广告或无关内容，则会被过滤掉。\n\n**3. Stage 3: Agentic Trajectory Synthesizing（智能体轨迹合成）**\n这是核心步骤，分为两个分支，将非结构化文档转化为训练监督信号：\n\n*   **分支 A: Context-grounded Trajectory Augmentation（基于上下文的轨迹增强）**\n    *   **目标**：解决 **Grounding** 问题，教模型如何从文档中提取工具边界和参数。\n    *   **处理**：\n        1.  **Annotation**：使用强大的 Teacher Model（如 `Qwen3-235B-A22B-Instruct-2507`）对文档进行标注，生成质量分数和结构化 **Affordance Profile**（描述工具响应是否可推断、Schema 结构、CLI 用法等）。\n        2.  **Planning**：基于 Affordance Profile，规则规划器生成合成计划。\n        3.  **Synthesis**：Teacher Model 根据计划生成 QA 对和轨迹。\n    *   **例子输出**：\n        *   **QA Pair**：\n            *   *Q*: What parameter should be added to `/etc/openvpn/server.conf` to enable full tunneling?\n            *   *A*: Add `push \"redirect-gateway def1\"`.\n        *   **Trajectory**：\n            *   *User*: I need to set up a secure OpenVPN server on Ubuntu 10.04.\n            *   *Assistant*: I’ll install OpenVPN and prepare the environment.\n            *   *Tool Call*: `execute_command(\"apt-get update \u0026\u0026 apt-get upgrade –show-upgraded -y\")`\n            *   *Tool Call*: `execute_command(\"apt-get install openvpn udev -y\")`\n            *   *(后续步骤包括配置 CA 和生成密钥)*\n\n*   **分支 B: Native Agentic Trajectory Synthesis（原生智能体轨迹合成）**\n    *   **目标**：解决 **Execution** 问题，教模型如何执行多轮规划、处理缺失信息和恢复。\n    *   **处理**：\n        1.  **Inventory**：从真实 API 和 MCP Skills 构建工具清单。\n        2.  **Feasibility Profiling**：使用 `GPT-5` 等模型评估每个工具源的可行性（简单调用、复杂并行、信息缺失场景）。\n        3.  **Synthesis**：生成多样化的用户 Persona 和候选轨迹计划，由确定性预算控制器分配生成任务，优先生成长多轮轨迹。\n        4.  **Validation**：严格验证轨迹的轮次顺序、Schema 接地、必需参数和工具响应一致性。\n    *   **例子输出**（假设有一个浏览器自动化工具 `tappi`）：\n        *   *User*: Reproduce a checkout bug on `https://shop.mountaintrailsupply.com/` where the “Place order” button spins forever.\n        *   *Assistant*: I will open the storefront...\n        *   *Tool Call*: `tappi.open(storefront)`\n        *   *Tool Call*: `tappi.click(index=2)` (Add to cart)\n        *   *Tool Call*: `tappi.click(index=8)` (Place order)\n        *   *Tool Response*: “Checkout ...Processing your order...”\n        *   *Assistant*: The page remained on checkout with the visible message... This matches the customer’s report.\n\n**最终混合（MidTool-Mix）**：\n将上述处理后的原始数据（Web/PDF/Code）与合成的轨迹（Context-grounded 和 Native Agentic）混合，形成 20.3B token 的 `MidTool-Mix` 数据集，用于 Base Model 的 Mid-training。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文主要关注数据工程、Pipeline 设计和经验性评估，**没有提出新的核心数学推导或理论模型**。其贡献在于通过大规模数据合成和训练策略（Mid-training）来增强模型的 Agentic 能力，而非通过数学公式证明收敛性或泛化界。因此，跳过此节。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有的工具使用（Tool Use）能力主要依赖后训练（Post-training，如 SFT 和 RL），这给后训练带来了巨大负担，且模型需要从狭窄的监督中同时学习原子能力（如工具识别、参数构建、多步执行）。论文提出：**通用工具使用能力是否可以通过专门的 Mid-training 在更早阶段塑造，从而比完全依赖 Post-training 更有效？**\n\n**2. 设计了什么实验验证这个问题？**\n*   **基线对比**：在 `Qwen3-4B-Base` 和 `Qwen3-8B-Base` 上，对比四种训练配方：\n    1.  Base Model + SFT\n    2.  Base Model + SFT + RL\n    3.  Base Model + **MidTool-Mix (Mid-training)** + SFT\n    4.  Base Model + **MidTool-Mix (Mid-training)** + SFT + RL\n*   **评估基准**：使用三个互补的基准测试：\n    *   `BFCLv3`：评估函数调用质量（单轮/多轮、幻觉）。\n    *   `τ²-Bench`：评估现实垂直领域（航空、零售、电信）的交互式任务完成。\n    *   `MCP-Universe`：评估在真实 MCP 服务器上的执行能力（浏览器自动化、金融、位置等）。\n*   **消融实验**：分解 `MidTool-Mix`，分别测试仅使用原始数据、仅使用 Context-grounded 轨迹、仅使用 Native Agentic 轨迹的效果，并与通用 Mid-training 基线 `Dolmino-20BT` 对比。\n*   **训练动态分析**：分析 SFT 收敛速度和 RL 奖励曲线，验证 Mid-training 是否提供了更好的初始化。\n\n**3. 问题的答案是什么？**\n*   **Mid-training 显著提升性能**：`MidTool-Mix` 在 SFT 和 RL 设置下均一致地提高了下游工具使用性能。特别是在多轮交互和复杂设置（如 `BFCL` 的多轮子集、`τ²-Bench` 的整体 Pass@1/Pass@4）中，提升尤为明显。\n*   **互补而非替代**：Mid-training 为后续 Post-training 提供了更强、更稳定的基底。SFT 收敛更快，RL 适应更迅速。\n*   **数据组成的互补性**：消融实验显示，Context-grounded 轨迹有助于 Grounding 和迁移，而 Native Agentic 轨迹有助于精确的函数调用。两者结合效果最佳，单一分支无法在所有指标上超越完整混合。\n*   **能力边界**：`MidTool-Mix` 在通用工具使用（如浏览器自动化、金融分析）上表现良好，但在需要深度搜索和长 horizon 证据收集的 `Web Search` 任务上提升有限（甚至为 0）。这表明通用工具使用中训练提供了可复用的先验（Schema grounding, workflow composition），但高度探索性的行为（如深度搜索）需要专门的数据和训练目标。", "additional_insights": "### § 8 Take-aways\n\n`MidTool` 证明了针对通用工具使用（General Tool Use）的专用 Mid-training 能显著增强模型在 SFT 和 RL 后的下游表现，表明工具能力不应仅依赖 Post-training 阶段。该工作构建了一个 20.3B token 的 `MidTool-Mix` 数据集，通过结合 Web、PDF、代码和结构化工具 API，利用两条合成分支分别解决“上下文 grounding”和“执行规划”两个核心缺陷。实验显示，在 BFCL、$\\tau^2$-Bench 和 MCP-Universe 等基准上，经过 `MidTool-Mix` Mid-training 的 Qwen3-4B/8B 模型在单轮、多轮及交互式任务中均优于仅进行 SFT 或 SFT+RL 的基线。消融实验揭示，Context-grounded 数据主要提升迁移能力和复杂环境适应性，而 Native agentic trajectories 对精确的函数调用和参数提取至关重要，两者互补且缺一不可。值得注意的是，`MidTool-Mix` 虽提升了通用工具能力，但在需要长程证据收集和迭代优化的 Deep Search 类任务上收益有限，这划定了通用工具使用与专用探索性代理行为之间的能力边界。此外，Mid-training 还改善了下游 SFT 的收敛速度和 RL 的早期适应效率，为后续训练提供了更优的初始化状态。\n\n### § 9 最脆弱的假设\n\n该方法最脆弱的假设是：**从非结构化文档（Web/PDF/Code）中通过 LLM 合成的“Context-grounded”轨迹和从 API 定义中合成的“Native”轨迹，能够准确反映真实世界中工具使用的复杂分布和错误模式，且这种合成数据的质量足以替代或补充真实的人类/系统交互日志。**\n\n如果这一假设不成立，即合成数据存在系统性偏差（例如过度简化了错误恢复流程、忽略了真实的 API 限制或产生了幻觉式的工具调用），那么 Mid-training 实际上是在让模型学习错误的先验，导致在真实部署中出现严重的工具调用失败或幻觉。论文通过严格的验证步骤（如 schema grounding 检查、turn order 验证、工具响应一致性检查）和去重/过滤流程来支持这一假设，并声称在基准测试中未发现数据泄露。然而，论文缺乏与大规模真实世界生产环境日志（Production Logs）的直接对比实验，无法证明合成数据在覆盖长尾错误、非标准 API 行为或复杂多步依赖方面的充分性。如果真实世界的工具交互比合成数据复杂得多，Mid-training 带来的增益可能在真实场景中大幅衰减甚至产生负面影响。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现并验证 **“Context-grounded 数据合成对工具参数提取能力的提升”** 这一核心 claim，无需复现完整的 Mid-training 流程。\n\n**具体方案：**\n1.  **数据准备**：从 `MidTool` 公开的数据集中抽取一小部分（例如 1000 条）Web 或 PDF 来源的原始文档及其对应的合成 QA/轨迹数据。同时，从同一来源手动或通过简单规则提取 1000 条未合成的原始文档作为对照。\n2.  **实现**：使用一个小型开源 LLM（如 Qwen2.5-7B-Instruct）作为 Teacher，复现论文中的“Context-grounded Trajectory Augmentation”流程，即从文档中提取工具 affordance 并生成参数提取 QA 对。\n3.  **测量**：构建一个小型的“工具参数提取”测试集，包含 500 个来自不同 API 文档的查询。分别使用原始文档和合成 QA 数据对一个小模型（如 Qwen2.5-1.5B）进行短暂的 SFT（例如 1-2 epochs）。\n4.  **评估**：在测试集上评估模型提取正确工具参数（Arguments）的准确率。\n5.  **结果判定**：如果经过合成数据 SFT 的模型在参数提取准确率上显著高于仅使用原始文档 SFT 的模型，则支持了“合成 grounding 数据能有效提升工具使用能力”的 claim；反之，如果提升不明显或出现负迁移，则质疑合成数据的有效性或必要性。此实验避开了昂贵的 Mid-training 和 RL，直接验证数据合成策略的核心价值。", "research_value": "### § 11 最强反例设计\n\n若要挑战 `MidTool` 的核心主张，最有力的攻击并非质疑其合成数据的质量，而是攻击其**“通用工具使用（General Tool Use）”与“特定领域工具使用（Domain-Specific Tool Use）”之间的可迁移性假设**，即证明 `MidTool` 带来的增益主要源于**数据覆盖（Data Coverage）**而非**能力塑造（Capability Shaping）**。\n\n具体反例设计如下：构建一个**“零样本工具泛化（Zero-Shot Tool Generalization）”**实验。首先，从 `MidTool-Mix` 的训练数据分布中严格排除某一类特定工具（例如，所有涉及金融交易 API 的工具，如 Stripe、Plaid 等），确保模型在 Mid-training 阶段从未见过任何金融相关的 Schema、文档或轨迹。然后，在测试阶段，引入一组全新的、未在训练集中出现的金融工具 API，并设计需要复杂多步推理和错误恢复的任务（例如：处理支付失败后的重试逻辑、解析非标准的错误代码）。\n\n如果 `MidTool` 的方法论成立，即 Mid-training 塑造了通用的“工具使用先验”（如 Schema grounding 和 workflow composition），那么经过 `MidTool-Mix` 训练的模型应当显著优于仅经过 SFT 的基线模型，因为它学会了“如何学习新工具”。然而，如果实验结果显示，在未见过的金融工具上，`MidTool` 模型的表现与基线模型无显著差异，甚至因为过度拟合了训练集中其他领域（如 Web 搜索、代码执行）的工具调用模式而出现负迁移（Negative Transfer），这就证明了 `MidTool` 的有效性主要依赖于训练数据对测试分布的**隐性覆盖**或**领域相似性**，而非真正习得了通用的工具使用能力。\n\n此外，可以引入**“噪声鲁棒性（Noise Robustness）”**作为第二个攻击点。真实世界的工具使用往往伴随着高度非结构化的错误信息和动态变化的 API 行为。设计一个实验，在测试时故意注入与训练分布不同的噪声（例如，修改 API 返回的 JSON 结构、引入非标准的 HTTP 错误码、或在文档中插入误导性信息）。如果 `MidTool` 合成的“Context-grounded”轨迹过于理想化（Clean），模型可能在面对真实世界的“脏数据”时表现脆弱，而基线模型由于在 SFT 阶段接触了更多样化的真实交互日志（如果有的话）或具有更强的语言鲁棒性，反而表现更好。这将挑战论文中关于合成数据能准确反映真实世界复杂分布的假设。\n\n### § 12 Follow-up Research Idea\n\n基于 `MidTool` 在“深度搜索（Deep Search）”和长程探索性任务上收益有限的局限，以及其合成数据缺乏真实世界动态反馈的问题，提出一个新的研究方向：**“基于环境反馈的在线工具适应（Online Tool Adaptation via Environmental Feedback）”**，即从“静态数据合成”转向“动态交互学习”。\n\n**（a）驱动局限与未满足需求：**\n`MidTool` 的核心局限在于其数据是**静态合成**的，缺乏真实工具执行时的**动态反馈（Dynamic Feedback）**和**长程因果链（Long-horizon Causal Chains）**。合成数据难以模拟 API 的实时状态变化、竞态条件（Race Conditions）或复杂的错误恢复路径。此外，通用工具使用与特定探索性行为（如深度搜索）之间的能力边界表明，模型需要一种机制来在运行时根据环境反馈调整其工具使用策略，而不仅仅依赖预训练的先验。\n\n**（b）借鉴相邻领域的方法：**\n借鉴**强化学习中的离线到在线过渡（Offline-to-Online RL）**和**程序合成中的执行反馈（Execution Feedback in Program Synthesis）**。具体而言，可以引入**“工具执行模拟器（Tool Execution Simulator）”**或**“轻量级沙箱（Lightweight Sandbox）”**，在训练过程中允许模型与模拟或真实的工具环境进行交互，并根据执行结果（成功、失败、部分成功）生成细粒度的奖励信号或修正信号。这类似于 **CodeRL** 或 **SWE-agent** 中的执行反馈机制，但应用于更广泛的工具使用场景。\n\n**（c）第一个实验设计：**\n构建一个**“交互式工具微调（Interactive Tool Fine-tuning, ITFT）”**框架。\n1.  **环境构建**：创建一个包含多种真实 API（如 GitHub API、Weather API、简单的 Web 搜索 API）的沙箱环境，能够捕获工具调用的完整轨迹，包括请求、响应、错误码和状态变化。\n2.  **数据生成**：不再完全依赖 LLM 合成轨迹，而是使用一个初始模型（可以是 `MidTool` 训练后的模型）在沙箱中进行**自我玩（Self-Play）**或**探索性交互（Exploratory Interaction）**。记录所有交互轨迹，特别是那些导致失败或需要多步恢复的轨迹。\n3.  **反馈信号**：为每条轨迹生成细粒度的反馈信号。例如，如果工具调用成功但结果不符合用户意图，生成“部分奖励”；如果调用失败，生成“错误类型标签”和“修正建议”。\n4.  **训练**：使用这些带有动态反馈的轨迹对模型进行 SFT 或 RL 训练。\n5.  **评估**：在需要长程规划和错误恢复的复杂任务（如深度搜索、多步 API 编排）上评估模型性能，并与 `MidTool` 的静态合成数据进行对比。\n\n**与已有工作的区别：**\n`MidTool` 侧重于**预训练阶段的数据合成**，旨在提供静态的监督信号。而本提议侧重于**后训练阶段的动态交互学习**，旨在利用真实环境的反馈来修正模型的错误先验并增强其鲁棒性。这不仅仅是数据的扩展，而是训练范式的转变：从“学习正确的工具调用”转向“学习如何从工具调用的反馈中学习和适应”。这将打开一个关于**“工具使用中的在线学习（Online Learning for Tool Use）”**的新研究方向，探索模型如何在运行时动态调整其工具使用策略，以应对真实世界的不确定性和复杂性。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Fengqing Jiang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Yite Wang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Boyi Liu\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zhaoyang Wang\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Canwen Xu\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zhewei Yao\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Radha Poovendran\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"‡\"\n      ]\n    },\n    {\n      \"name\": \"Yuxiong He\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"‡\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"University of Washington\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Snowflake\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"University of North Carolina at Chapel Hill\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"†\",\n      \"text\": \"Work done at Snowflake\"\n    },\n    {\n      \"marker\": \"‡\",\n      \"text\": \"Co-advising\"\n    }\n  ]\n}\n```", "summary_translation": "Mid-training 日益被视为塑造大型语言模型能力的关键阶段。近期研究表明，有针对性的 Mid-training 能够增强数学和科学等推理密集型能力，并能在软件工程场景中提升 agentic 能力。在本工作中，我们研究了并行但较少被探索的 agentic 能力：通用工具使用。我们提出了 MidTool，这是一个用于 agentic 工具使用 Mid-training 的开放语料构建流程，它将大规模的网络、PDF 和代码数据与来自真实世界工具 API、MCP 技能以及基于文档的工作流的合成监督相结合。MidTool 旨在教会模型如何识别工具可用性、从上下文中定位参数、组合工具调用工作流，以及从不完整信息中恢复。我们在 MidTool-Mix 上对 Qwen3-4B-Base 和 Qwen3-8B-Base 进行 Mid-training，随后应用包含监督微调（SFT）和强化学习（RL）的后续 Post-training。与基线相比，MidTool-Mix 在 BFCL、tau2-Bench 和 MCP Universe 上，无论是在 SFT 还是 RL 设置下，均一致提升了下游性能。这些结果表明，与其他重要的 LLM 能力一样，通用工具使用得益于专门的 Mid-training，而非完全留给 Post-training。"}, {"title": "SAPO: Single-Rollout Autoregressive Policy Optimization for Agentic Reinforcement Learning", "arxiv_id": "2608.19842", "authors": "Dayang Liang, Lang Feng, Bo An, Yunlong Liu", "summary": "Agentic reinforcement learning (RL) has become a critical stage in the post-training of large language models. Existing critic-free, group-relative methods estimate policy advantages from multiple rollouts, avoiding the substantial memory overhead of conventional proximal policy optimization (PPO) and achieving strong performance on long-horizon interactive tasks. Despite their success, recent studies revealed three limitations: (1) Lack explicit value generalization and effective temporal credit assignment; (2) Suffer from potential advantage collapse in long-horizon complex tasks; (3) Require a costly trade-off between sampling budget and policy performance. In this work, we propose Single-rollout Autoregressive Policy Optimization (SAPO), a low-memory and compute-efficient framework in which the policy and value functions share a single autoregressive backbone. SAPO exploits the autoregressive structure of LLMs to produce policy and value predictions at distinct causal boundaries with shared parameters, while independently optimizing the PPO objectives and auxiliary on-policy SARSA objectives. To robustly estimate the contribution of each turn, we further introduce a trajectory-level generalized advantage estimator that combines lambda-returns with batch normalization. Experiments across ALFWorld and WebShop with Qwen2.5-1.5B/7B show that SAPO trains stably and outperforms PPO and GRPO by mean +15.1 and +12.1 percentage points, respectively, while eliminating the memory cost of a separate critic model and reducing per-iteration runtime by 33.2% over PPO.", "category": "cs.AI", "cluster": "Training \u0026 Optimization Methods", "tags": ["cs.AI"], "filter_reason": "该论文完全符合“构建、改进、训练 LLM智能体”的研究范围，具体依据如下：\n\n1.  核心对象明确为 Agentic RL：论文标题和摘要明确指出研究对象是 \"Agentic Reinforcement Learning\"（智能体强化学习），旨在解决长horizon交互任务（long-horizon interactive tasks）中的策略优化问题。这直接对应研究焦点中的“单智能体”方向，特别是涉及长期决策和工具使用场景（如 ALFWorld, WebShop）。\n2.  属于智能体训练/改进方法论：论文提出了一种新的训练框架 SAPO（Single-rollout Autoregressive Policy Optimization），用于优化 LLM 作为智能体的策略。这属于“Agent training/distillation/RL”范畴。根据筛选标准，只要标题或摘要明确指向 Agentic / LLM Agents，且涉及训练或推理策略搜索，应予以保留。\n3.  解决智能体核心痛点：论文针对的是智能体在长序列交互中的价值泛化、信用分配（credit assignment）和优势估计崩溃问题，这些都是构建高效 LLM 智能体的核心算法挑战，而非单纯的基础模型推理优化。\n4.  非排除项：虽然涉及 RL 算法改进，但其应用场景明确限定在 Agentic 任务（WebShop, ALFWorld），且未涉及安全、对齐、图神经网络或多智能体拓扑编排等排除项。\n\n综上，该论文是关于如何更高效地训练和优化 LLM 智能体策略的前沿研究，符合保留标准。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决大型语言模型（LLM）在**Agentic Reinforcement Learning**（智能体强化学习）后训练阶段中，如何在不依赖独立**Critic**网络且仅使用**Single-Rollout**（单次轨迹采样）的情况下，实现高效的**Temporal Credit Assignment**（时间信用分配）和显式的**Value Generalization**（价值泛化）。随着LLM从被动文本生成器转变为能够进行长程交互（如推理、工具使用、网页搜索）的智能体，直接从环境反馈中学习变得至关重要。然而，现有的主流方法面临两难困境：传统的**Proximal Policy Optimization**（PPO）虽然通过独立的**Critic**网络提供了精确的**Token-level**或**Turn-level**信用分配，但需要巨大的内存和计算开销来维护策略规模的价值网络；而新兴的无Critic、基于组相对优势（Group-relative）的方法（如**GRPO**）虽然节省了内存，但在长程复杂任务中容易遭遇**Advantage Collapse**（优势坍缩），且缺乏跨状态的价值泛化能力，同时需要在采样预算和策略性能之间进行昂贵的权衡。\n\n解决这一问题具有极高的理论与工程价值。首先，它打破了显式价值学习与计算效率之间的对立，证明了**Autoregressive**（自回归）模型的结构特性天然契合**Actor-Critic**的学习需求，无需额外的模型副本即可实现**State Value**和**Action Value**的估计。其次，通过消除对多轨迹采样（Multiple Rollouts）的依赖，该方法显著降低了长程任务中的同步屏障和采样成本，使得在稀疏奖励环境下进行稳定的长程决策学习成为可能。最终，这为构建低成本、高性能、具备自主通用能力的语言智能体提供了一条可行的技术路径，特别是在资源受限或需要快速迭代的实际部署场景中，能够以更低的基础设施成本获得优于现有SOTA方法的性能。\n\n### § 2 前人工作与不足\n\n该问题此前已有多种尝试，但均存在显著局限。最相关的**Prior Methods**包括基于组相对优势的**GRPO**及其变体（如**DAPO**, **GSPO**, **GVPO**），以及试图共享参数或消除Critic的其他方法（如**ReMax**, **RLOO**, **Hydra-PPO**, **POISE**, **SAO**）。\n\n**GRPO**及其衍生工作通过在同一任务实例上采样多个轨迹（Group Sampling），利用组内奖励的均值和方差来归一化优势估计，从而避免了训练独立的Critic。然而，这种方法存在根本性缺陷：当所有轨迹获得相同或相近的稀疏奖励时（在长程失败或稀疏反馈中常见），归一化后的优势趋于零，导致**Advantage Collapse**和零梯度区域；此外，它将轨迹级别的优势均匀分配给所有Token，缺乏精细的**Temporal Credit Assignment**，无法识别低价值的重复或错误前缀，且无法在不同状态或策略迭代间泛化价值估计。为了缓解噪声，增大Group Size会线性增加采样成本和同步开销，造成不利的Compute-Quality Trade-off。\n\n**ReMax**和**RLOO**通过贪婪基线或留一法基线消除Critic，**VinePPO**通过蒙特卡洛延续估计中间价值，这些方法虽然减少了训练状态内存，但要么保留了粗糙的信用分配，要么引入了额外的生成计算成本，且同样缺乏跨状态的价值泛化能力。\n\n在参数共享方面，**Hydra-PPO**在冻结的主干网络上放置策略和价值适配器，但仍需角色特定的Head，且完全共享变体显示出潜在的**Policy-Value Interference**（策略-价值干扰）；**POISE**通过轻量级探针复用Actor隐藏状态，但依赖跨轨迹估计来解耦价值估计；**SAO**实现了异步单次轨迹训练，但依赖于单独预训练的Critic并进行更频繁的价值更新，未能实现真正的单模型统一。\n\n这些方法之所以未能彻底解决问题，是因为它们要么未能充分利用LLM自回归生成的因果结构来自然分离状态评估与动作评估，要么在消除Critic的同时牺牲了显式的价值学习机制，导致在长程任务中无法有效处理延迟奖励和稀疏反馈。现有工作往往将“消除Critic”与“放弃显式价值泛化”绑定，或者将“单次轨迹”与“缺乏统计稳定性”绑定，而未能认识到**Autoregressive**模型在因果边界（Causal Boundaries）上天然具备同时输出策略和价值的能力，这一关键洞察此前未被充分挖掘和利用。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Agentic Reinforcement Learning 领域，研究者面临着“显式价值估计”与“计算效率”之间的根本性矛盾。传统的 Proximal Policy Optimization (PPO) 虽然通过独立的 Critic 网络提供了精确的 Temporal Credit Assignment，但其巨大的显存开销（需要维护 Policy 和 Critic 两套参数及优化器状态）使其难以在长序列任务中扩展。为了解决这一问题，Group-Relative Policy Optimization (如 GRPO) 应运而生，它通过在同一 Prompt 下采样多个 Rollout 并计算组内相对优势来消除 Critic。然而，随着研究的深入，这种“无 Critic”范式暴露出三个致命缺陷：首先，在稀疏奖励或长 horizon 任务中，组内 Rollout 往往获得相同或相近的奖励，导致 Advantage Collapse（优势坍缩），梯度消失；其次，组内归一化无法实现跨状态、跨 Prompt 的 Value Generalization，导致模型无法识别低价值的重复前缀；最后，为了获得稳定的基线，必须增加 Group Size，这带来了高昂的采样成本和同步开销。\n\n与此同时，另一条技术路线试图通过参数共享来降低 PPO 的成本。例如 Hydra-PPO 和 POISE 尝试让 Policy 和 Value 共享 Backbone 或 Hidden States。但现有工作要么保留了独立的 Value Head 和 Adapter，未能彻底消除显存冗余；要么依赖于 Cross-Rollout 估计或异步更新，增加了系统复杂性；更关键的是，它们往往忽视了 LLM 自回归生成的因果结构（Causal Structure）与 Actor-Critic 学习需求之间的天然对应关系。\n\n作者敏锐地观察到，Actor-Critic 的核心逻辑是：State Value $V(s)$ 应基于动作前的上下文，而 Action Value $Q(s, a)$ 应基于动作后的完整序列。在 LLM 的自回归生成过程中，这两个时间点恰好对应于生成序列的两个因果边界（Causal Boundaries）：即第一个 Token 生成之前（仅见 State）和最后一个 Token 生成之后（见 State + Action）。既然信息流天然符合这一顺序，为何不能直接利用同一个 Autoregressive Backbone，在这两个边界处通过特定的 Logits 读取 Value，从而在单次 Rollout 中同时完成 Policy 生成和 Value 估计？这种思路不仅消除了对独立 Critic 模型的需求，也摆脱了对多 Rollout 组内统计的依赖，从而在理论上同时解决了显存瓶颈、优势坍缩和采样成本问题。\n\n### § 4 核心 Intuition\n\nSAPO 的核心直觉在于利用 LLM 自回归生成的**因果边界（Causal Boundaries）**来天然解耦 State Value 和 Action Value 的估计，从而在**单次 Rollout（Single-Rollout）**中实现高效的 Actor-Critic 学习。\n\n传统方法要么依赖昂贵的独立 Critic 模型，要么依赖不稳定的多 Rollout 组内统计；而 SAPO 发现，Policy 生成过程本身已经包含了从“动作前状态”到“动作后结果”的完整信息流，只需在序列的两个特定位置（生成前和生成后）通过保留的 Token Logits 读取 Value，即可在不增加额外模型参数和采样成本的前提下，获得显式的、具备泛化能力的 Temporal Credit Assignment。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nSAPO (Single-Rollout Autoregressive Policy Optimization) 的核心创新在于利用大语言模型 (LLM) 的自回归 (Autoregressive) 特性，在一个单一的因果模型中同时实现策略 (Policy) 和价值 (Value) 的估计，从而消除了对独立 Critic 模型或多轮采样 (Group-relative sampling) 的依赖。\n\n**核心机制：**\n1.  **共享骨干与因果边界 (Causal Boundaries)：** SAPO 使用同一个 Transformer 骨干网络。它利用自回归生成的时间顺序，在两个特定的“因果边界”读取价值信号：\n    *   **State Value ($V$)：** 在生成动作之前，基于当前状态上下文读取。\n    *   **Action Value ($Q$)：** 在生成完整个动作后，基于状态+动作上下文读取。\n2.  **双 Token 价值基 (Two-token Value Basis)：** 模型词汇表中预留两个特殊 Token ($w_+$ 和 $w_-$)，它们不参与动作生成，仅用于通过 Logit 差异映射出标量价值。这避免了价值学习与动作生成的语义冲突。\n3.  **单轮轨迹优势估计 (Single-Rollout Advantage Estimation)：** 每个任务只采样一条轨迹 (Single Rollout)。利用冻结的旧策略 (Old Policy) 计算 GAE (Generalized Advantage Estimation)，并通过 Batch Normalization 对 Turn-level 的优势进行归一化，解决长序列中的优势坍缩问题。\n\n**完整 Pipeline 示例 (以 ALFWorld 任务 \"Pick up the apple and put it in the bowl\" 为例)：**\n\n1.  **输入 (Input)：**\n    *   环境状态 $s_t$：例如 \"You are in the kitchen. You see an apple on the counter and a bowl on the table.\"\n    *   历史交互：之前的对话或动作历史。\n\n2.  **处理 (Processing) - 单轮自回归生成与评估：**\n    *   **Step 1: 状态价值读取 ($V(s_t)$)。** 模型接收 $s_t$ 的 Token 序列。在生成第一个动作 Token 之前，模型读取预留 Token $w_+$ 和 $w_-$ 的 Logits，计算 $V(s_t)$。这代表了“在当前状态下，未来预期回报是多少”。\n    *   **Step 2: 动作生成 (Action Generation)。** 模型自回归生成动作 $a_t$，例如 `\u003Caction\u003E take apple \u003C/action\u003E`。在此过程中，模型只从排除 $w_+, w_-$ 后的动作词汇表中采样，确保价值 Token 不被当作动作输出。\n    *   **Step 3: 动作价值读取 ($Q(s_t, a_t)$)。** 动作生成完毕后，模型在序列末尾再次读取 $w_+$ 和 $w_-$ 的 Logits，计算 $Q(s_t, a_t)$。这代表了“执行该动作后的预期回报”。\n    *   **Step 4: 环境反馈。** 环境执行动作，返回奖励 $r_t$ (例如 +1 如果成功拿起苹果，0 如果失败) 和新状态 $s_{t+1}$。\n    *   **Step 5: 优势计算 (Advantage Calculation)。** 轨迹结束后，从最后一步反向遍历。利用旧策略的 $V_{old}$ 和 $Q_{old}$ 计算 TD Error 和 GAE。对每个 Turn 的优势进行 Batch Normalization，得到 $\\hat{A}_t$。\n    *   **Step 6: 联合优化 (Joint Optimization)。**\n        *   **Policy Loss：** 使用 PPO 的 Clipped Surrogate Objective，最大化 $\\hat{A}_t$ 高的动作概率。\n        *   **Value Loss：** 使用 Clipped Regression Loss，让当前的 $V$ 和 $Q$ 预测值逼近基于 $\\lambda$-return 和 SARSA 目标计算出的真实价值。\n        *   所有梯度通过共享骨干反向传播，更新同一组参数 $\\theta$。\n\n3.  **输出 (Output)：**\n    *   更新后的策略模型 $\\pi_\\theta$，能够更准确地估计状态价值并生成高回报动作。\n    *   无需额外的 Critic 模型内存开销，且每轮迭代只需一次前向传播 (Forward Pass) 即可获取所有所需信号。\n\n### § 6 核心数学推导\n\nSAPO 的数学核心在于如何将 Actor-Critic 架构映射到自回归模型的 Logit 空间，并构建单轮轨迹下的优势估计。\n\n**1. 价值函数的参数化 (Value Parameterization)**\n传统 RL 中，$V(s)$ 和 $Q(s,a)$ 由独立的网络输出。SAPO 利用 LLM 的 Next-token Prediction 能力。\n*   **公式：** $V_\\theta(s_t) = R_{max} \\cdot \\text{clip}(\\frac{\\log p(w_+|s_t) - \\log p(w_-|s_t)}{\\tau_v}, -1, 1)$\n*   **Intuition：** 模型词汇表中预留两个 Token $w_+$ (代表高价值) 和 $w_-$ (代表低价值)。它们的 Logit 差异反映了模型对当前状态价值的“置信度”或“倾向”。通过温度系数 $\\tau_v$ 和裁剪 (Clip)，将这个差异映射到归一化的价值区间 $[-R_{max}, R_{max}]$。这种设计使得价值估计与语言建模共享底层特征表示，无需额外参数。\n\n**2. 单轮轨迹的优势估计 (Single-Rollout GAE)**\n由于没有 Group 采样，SAPO 必须依赖时间差分 (Temporal Difference) 来分配信用。\n*   **TD Residual:** $\\delta_t = r_t + \\gamma V_{old}(s_{t+1}) - V_{old}(s_t)$\n*   **GAE:** $A^{GAE}_t = \\sum_{l=0}^{T-t-1} (\\gamma \\lambda)^l \\delta_{t+l}$\n*   **Intuition：** 即使环境只在最后给出稀疏奖励，通过 $V_{old}$ 的引导，我们可以将最终的奖励“回溯”分配到中间的每一步。$\\lambda$ 控制偏差-方差权衡。关键在于，这里的 $V_{old}$ 来自同一模型在采样时的状态，而非独立 Critic。\n\n**3. 归一化优势 (Batch-Normalized Advantage)**\n*   **公式：** $\\hat{A}_t = \\frac{A^{GAE}_t - \\mu_B}{\\sigma_B}$\n*   **Intuition：** 在长序列任务中，不同 Turn 的优势量级可能差异巨大，导致梯度不稳定。SAPO 在当前 Batch 的所有有效 Turn 上对优势进行标准化。这不同于 GRPO 的 Group 内归一化，它是在独立任务间进行比较，避免了多轮采样的同步开销，同时稳定了训练信号。\n\n**4. 联合损失函数 (Unified Objective)**\n*   **Policy Loss:** $\\mathcal{L}_{PPO} = -\\mathbb{E}[\\min(r_t(\\theta)\\hat{A}_t, \\text{clip}(r_t(\\theta), 1-\\epsilon, 1+\\epsilon)\\hat{A}_t)]$\n*   **Value Loss:** $\\mathcal{L}_{V} = \\mathbb{E}[\\text{ClippedLoss}(V_\\theta(s_t), V_{target})] + \\mathbb{E}[\\text{ClippedLoss}(Q_\\theta(s_t, a_t), Q_{target})]$\n*   **Intuition：** 策略损失遵循标准 PPO，确保更新步长可控。价值损失采用 Clipped Regression，防止价值估计剧烈波动。两者共享参数，通过系数 $c_V, c_Q$ 平衡生成能力和价值估计能力的学习速度。\n\n### § 7 实验设计与结论\n\n**1. 性能对比 (Performance vs. Baselines)**\n*   **问题：** SAPO 在单轮采样且无独立 Critic 的情况下，能否达到或超越需要多轮采样 (GRPO) 或独立 Critic (PPO) 的方法？\n*   **实验设计：** 在 ALFWorld (长程推理) 和 WebShop (网页交互) 两个基准上，使用 Qwen2.5-1.5B/7B 模型，对比 PPO, GRPO, RLOO, GiGPO 等 SOTA 方法。\n*   **结论：** SAPO 显著优于 PPO (+15.1%) 和 GRPO (+12.1%)。特别是在长程任务中，SAPO 避免了 GRPO 的优势坍缩 (Advantage Collapse) 问题，证明了显式价值估计 (Explicit Value Estimation) 对于长程信用分配的重要性。\n\n**2. 效率分析 (Efficiency Analysis)**\n*   **问题：** 移除独立 Critic 和 Group 采样是否真的带来了计算和内存效率的提升？\n*   **实验设计：** 分解 PPO 和 SAPO 的单次迭代 (Per-iteration) 运行时间，包括生成、旧 Logit 计算、奖励处理、价值更新等模块。\n*   **结论：** SAPO 将单次迭代时间从 451.2s 降低到 301.4s (减少 33.2%)。主要节省来自消除了独立的 Critic 前向/反向传播路径。同时，内存占用大幅降低，因为不再需要维护一个与 Policy 同等规模的 Critic 模型及其优化器状态。\n\n**3. 组件消融 (Ablation Study)**\n*   **问题：** SAPO 的各个组件 (如 Batch Normalization, 双 Token 价值基, 单轮 GAE) 各自贡献了多少？\n*   **实验设计：** 移除 Batch Normalization，或使用 Group 归一化替代，或移除 $Q$ 值估计，观察性能变化。\n*   **结论：** Batch Normalization 对稳定训练至关重要，防止长序列中的梯度爆炸或消失。双 Token 价值基有效分离了价值信号和动作语义，避免了干扰。单轮 GAE 结合 $Q$ 值估计提供了比纯 Group-relative 方法更精细的 Turn-level 信用分配。\n\n**总结：** SAPO 证明了通过巧妙利用 LLM 的自回归结构，可以在不牺牲性能的前提下，实现高效、低内存的单轮 Actor-Critic 学习，为 Agentic RL 提供了一种新的范式。", "additional_insights": "### § 8 Take-aways\n\nSAPO 的核心创新在于利用 LLM 的自回归因果结构，在单次 rollout 中通过两个特定的因果边界（action 生成前和生成后）分别读取 State Value ($V$) 和 Action Value ($Q$)，从而在无需独立 Critic 模型的情况下实现了显式的 Value 泛化和时序信用分配。该方法通过保留词汇表中的两个特殊 token 作为 Value Basis，利用其 Logit 差异经温度缩放和截断后映射为标量 Value，既避免了 Value 学习干扰 Policy 的 Action 分布，又消除了传统 PPO 中维护独立 Critic 网络带来的巨大显存开销。为了解决单轨迹优势估计中的方差问题，SAPO 引入了结合 $\\lambda$-returns 的轨迹级 Generalized Advantage Estimation (GAE)，并采用 Batch Normalization 对 Turn-level 优势进行归一化，从而在不依赖 Group-relative 采样（如 GRPO）的情况下实现了稳定的策略更新。实验表明，在 ALFWorld 和 WebShop 等长视界任务上，SAPO 相比 PPO 和 GRPO 分别提升了 15.1% 和 12.1% 的成功率，同时将每轮迭代时间减少了 33.2%，证明了统一 Actor-Critic 架构在效率与性能上的双重优势。\n\n### § 9 最脆弱的假设\n\nSAPO 最关键的假设是：**LLM 的自回归 Logits 空间中存在两个特定的、固定的词汇表条目（$w_+$ 和 $w_-$），其相对 Logit 差异能够线性且稳定地编码当前状态或状态-动作对的期望回报（Value），且这种编码能力可以通过标准的交叉熵或回归损失有效学习。**\n\n如果这一假设不成立，即 LLM 的内部表示无法通过简单的双 Token Logit 差异来准确拟合复杂的 Value 函数，或者这种拟合与 Policy 生成任务发生严重的负迁移（Negative Transfer），那么 SAPO 的核心贡献——“无独立 Critic 的显式 Value 学习”——将直接失效，退化为一个性能劣于传统 PPO 的噪声估计器。\n\n**实际中可能不成立的原因：**\n1. **表示能力瓶颈**：LLM 的 Logits 主要优化于下一个 Token 的概率分布，其几何结构可能并不天然适合编码标量 Value。仅靠两个 Token 的 Logit 差异可能缺乏足够的容量来捕捉长视界任务中复杂的 Value 曲面，导致 Value 估计偏差过大。\n2. **优化冲突**：虽然 SAPO 通过从 Action 分布中排除 $w_+$ 和 $w_-$ 来隔离 Policy 和 Value，但共享的 Transformer 骨干网络在反向传播时仍会同时接收 Policy Loss 和 Value Loss 的梯度。如果 Value 梯度的方向与 Policy 梯度的方向在参数空间中冲突，可能导致 Policy 性能下降或训练不稳定。\n\n**论文提供的证据与缺失：**\n论文在 Section 4.1 中通过实验展示了 SAPO 在 ALFWorld 和 WebShop 上的性能优于 PPO 和 GRPO，间接证明了该假设在特定基准上是成立的。然而，论文**缺少**对 Value 估计准确性（Value Accuracy）的直接定量分析（例如，将 SAPO 的 $V(s)$ 与独立训练的高精度 Critic 的 $V(s)$ 进行相关性对比或 MSE 比较）。此外，论文未深入探讨当任务奖励分布极度稀疏或具有高度非平稳性时，这种固定的双 Token Basis 是否仍能保持稳定的 Value 泛化能力，也未提供关于梯度冲突的消融实验（如单独训练 Value Head 与联合训练的对比）。\n\n### § 10 最小复现实验\n\n**目标**：验证 SAPO 的核心机制——即“通过共享 Backbone 的两个特定 Token Logit 差异来估计 Value”是否比“无 Value 估计（如 REINFORCE/GRPO 的基线）”或“随机初始化 Value Head”更有效，且不会严重损害 Policy 性能。\n\n**数据**：使用 ALFWorld 的一个子集（例如仅包含 \"Pick \u0026 Place\" 类别的 100 个任务），因为该任务逻辑简单，易于快速迭代。\n\n**实现**：\n1. 基线模型：使用 Qwen2.5-1.5B-Instruct。\n2. 实现 SAPO 的核心组件：\n   - 定义两个特殊 Token ID（例如 `\u003Cvalue_pos\u003E` 和 `\u003Cvalue_neg\u003E`）。\n   - 在 Forward 过程中，在 Action 生成前读取 $V(s)$，在 Action 生成后读取 $Q(s, a)$。\n   - 实现 SAPO 的 Loss 函数：Policy Loss (PPO Clipped) + Value Loss (Clipped Regression on $V$ and $Q$)。\n   - **关键简化**：不使用复杂的 Batch Normalization 优势估计，直接使用简单的 Monte Carlo Return 作为 Target，以隔离 Value 估计机制本身的有效性。\n3. 对比基线：\n   - **Baseline A (GRPO-like)**：无 Value 估计，仅使用 Group-relative 优势（每组采样 4 个轨迹）。\n   - **Baseline B (Random Value)**：使用 SAPO 架构，但 Value Loss 的系数设为 0，即不训练 Value，仅训练 Policy。\n\n**测量**：\n1. **Task Success Rate**：在验证集上的任务成功率。\n2. **Value Correlation**：计算 SAPO 估计的 $V(s)$ 与最终 Episode Return 之间的皮尔逊相关系数（Pearson Correlation）。\n\n**结果判定**：\n- **支持 Claim**：如果 SAPO 的 Success Rate 显著高于 Baseline B，且 $V(s)$ 与 Return 的相关系数显著高于随机噪声（例如 \u003E 0.3），则证明共享 Backbone 的 Logit 差异确实能学习到有用的 Value 信号。\n- **反驳 Claim**：如果 SAPO 的 Success Rate 低于或等于 Baseline A，或者 $V(s)$ 与 Return 的相关系数接近 0，则说明该假设不成立，即 LLM 的 Logits 无法有效编码 Value，或者联合训练导致了严重的性能退化。\n\n**时间估算**：1 周。由于使用小模型（1.5B）和小数据集（100 tasks），单轮训练时间极短，足以完成多组超参数搜索和对比实验。", "research_value": "### § 11 最强反例设计\n\n若要挑战 SAPO 的有效性，最有力的攻击并非质疑其效率，而是攻击其**Value Representation Capacity**（价值表示容量）与**Gradient Interference**（梯度干扰）之间的根本矛盾。SAPO 的核心假设是 LLM 的 Logits 空间可以通过两个固定 Token 的差异线性编码复杂的标量 Value，但这在理论上忽略了 LLM 预训练目标（Next-token Prediction）与 RL 价值估计目标（State/Action Value Estimation）在几何结构上的正交性。\n\n**理论攻击：Logit 空间的非等距性与 Value 压缩瓶颈**\nLLM 的 Logits 分布通常遵循 Zipf 定律，且经过 Softmax 归一化，其内部表示主要优化于语义区分度而非数值回归精度。仅使用两个 Token ($w_+, w_-$) 的 Logit 差异来拟合 Value，本质上是将高维、非线性的 Value 曲面强行投影到一个一维线性子空间中。在长程任务（如 ALFWorld 的多步推理）中，Value 函数往往具有高度的非平稳性和稀疏性。如果 Value 的变化幅度超过了 Logit 差异的动态范围，或者不同状态下的 Value 梯度方向与 Policy 梯度方向在共享 Backbone 中发生冲突（Negative Transfer），SAPO 的 Value 估计将迅速退化为噪声。\n\n**实验反例设计：高维连续控制或复杂工具调用场景**\n设计一个**High-Dimensional Continuous Control**或**Complex Tool-Use**场景，例如让 LLM 智能体在一个需要精细数值反馈的环境中操作（如控制机械臂抓取不同重量的物体，或进行多步数学推导其中中间步骤的“价值”取决于后续复杂的代数变换）。\n1.  **对比基线**：使用带有独立、高容量 Critic Head（如多层 MLP）的 PPO 变体，该 Critic Head 专门用于回归 Value，不参与 Action 生成。\n2.  **攻击点**：观察 SAPO 在训练后期的 **Value MSE**（均方误差）和 **Policy Gradient Norm**（策略梯度范数）。如果 SAPO 的 Value MSE 显著高于独立 Critic 基线，且 Policy 性能在训练初期提升后出现停滞或震荡（表明 Value 噪声干扰了 Policy 更新），则证明“双 Token Logit 差异”缺乏足够的表示能力来支撑长程信用分配。\n3.  **替代解释**：SAPO 在 ALFWorld/WebShop 上的成功可能并非源于其优越的 Value 估计，而是因为这些任务的奖励结构相对简单（稀疏但二元），且任务长度有限，使得简单的 Group-relative 方法（如 GRPO）或甚至 REINFORCE 也能通过大量采样获得足够信号。SAPO 的优势可能仅来自于其更高效的采样策略（Single-Rollout 减少了同步开销），而非其 Value 估计机制本身的优越性。一旦任务复杂度增加，Value 估计的偏差将成为主导因素，SAPO 将失效。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：Disentangled Autoregressive Actor-Critic via Latent Space Projection (DACP)**\n\n**驱动局限**：SAPO 试图在 Logits 空间直接复用 LLM 参数进行 Value 估计，这导致了严重的 **Representation Mismatch**（表示不匹配）和 **Gradient Interference**（梯度干扰）。LLM 的隐藏状态（Hidden States）富含语义信息，但直接将其映射到标量 Value 需要额外的投影层，而 SAPO 试图避免这一点，却牺牲了 Value 估计的精度和独立性。现有的共享参数方法（如 Hydra-PPO）虽然引入了适配器，但仍存在策略与价值目标在共享 Backbone 中的竞争。\n\n**新视角**：不应在 Logits 空间强行编码 Value，而应在 **Latent Space**（潜在空间）中解耦 Policy 和 Value 的表示。借鉴 **Variational Autoencoders (VAEs)** 或 **Contrastive Learning** 的思想，我们可以将 LLM 的隐藏状态投影到一个解耦的潜在空间，其中一部分维度专门用于编码 Policy 相关的语义特征，另一部分维度专门用于编码 Value 相关的数值特征。\n\n**具体方法**：\n1.  **Latent Disentanglement**：在 LLM 的最后一层 Transformer Block 之后，引入一个轻量级的 **Disentanglement Module**。该模块将隐藏状态 $h_t$ 映射为两个独立的潜在向量：$z_{policy}$ 和 $z_{value}$。\n2.  **Orthogonal Regularization**：在训练过程中，施加正交约束或互信息最小化损失，确保 $z_{policy}$ 和 $z_{value}$ 在统计上尽可能独立。$z_{policy}$ 用于生成 Action（通过标准的 LM Head），而 $z_{value}$ 通过一个独立的、小型的 Value Head 回归标量 Value。\n3.  **Shared Backbone with Decoupled Heads**：Backbone 仍然共享，但通过解耦的潜在空间，Policy 和 Value 的梯度在反向传播时通过不同的路径影响 Backbone 的不同部分，从而减少干扰。\n\n**第一个实验**：\n在 **ALFWorld** 和 **WebShop** 上，对比 SAPO、PPO（独立 Critic）和 DACP。\n*   **测量指标**：除了 Success Rate，重点测量 **Value Accuracy**（与独立训练的高精度 Critic 的相关性）和 **Gradient Cosine Similarity**（Policy 和 Value 梯度在 Backbone 参数空间中的余弦相似度）。\n*   **预期结果**：DACP 应该在保持接近 SAPO 的内存效率（因为 Value Head 很小）的同时，获得比 SAPO 更高的 Value Accuracy 和更稳定的训练曲线，证明解耦潜在空间比在 Logits 空间强行复用更有效。\n\n**与已有工作的区别**：\n*   不同于 SAPO 的 **Logit-based Value**，DACP 使用 **Latent-based Value**，保留了 Value 估计的灵活性。\n*   不同于 Hydra-PPO 的 **Adapter-based** 方法，DACP 强调 **Latent Disentanglement**，从表示层面解决干扰问题，而非仅在输出层分离。\n*   不同于传统的 PPO，DACP 仍然共享 Backbone，但通过解耦机制实现了更高效的参数利用，避免了独立 Critic 的巨大开销。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Dayang Liang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Lang Feng\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Bo An\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yunlong Liu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Xiamen University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Nanyang Technological University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"∗\",\n      \"text\": \"Equal Contribution\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding author\"\n    }\n  ]\n}\n```", "summary_translation": "Agentic reinforcement learning (RL) 已成为大型语言模型后训练的关键阶段。现有的无 critic、组相对方法从多个 rollout 中估计策略优势，避免了传统 proximal policy optimization (PPO) 的巨大内存开销，并在长 horizon 交互任务中取得了强劲的性能。尽管取得了成功，但最近的研究揭示了三个局限性：(1) 缺乏显式的 value generalization 和有效的 temporal credit assignment；(2) 在长 horizon 复杂任务中容易出现 advantage collapse；(3) 需要在 sampling budget 和策略性能之间进行昂贵的权衡。在本工作中，我们提出了 Single-rollout Autoregressive Policy Optimization (SAPO)，这是一个低内存且计算高效的框架，其中策略函数和 value 函数共享单个 autoregressive backbone。SAPO 利用 LLMs 的 autoregressive 结构，在具有共享参数的不同 causal boundaries 处生成策略和 value 预测，同时独立优化 PPO 目标和辅助的 on-policy SARSA 目标。为了稳健地估计每个 turn 的贡献，我们进一步引入了一个轨迹级别的 generalized advantage estimator，该 estimator 结合了 lambda-returns 与 batch normalization。在 ALFWorld 和 WebShop 上使用 Qwen2.5-1.5B/7B 进行的实验表明，SAPO 训练稳定，并分别以平均 +15.1 和 +12.1 个百分点的优势优于 PPO 和 GRPO，同时消除了单独 critic 模型的内存成本，并将每次迭代的运行时间比 PPO 减少了 33.2%。"}]}, {"name": "Code Generation \u0026 Software Engineering", "count": 1, "papers": [{"title": "Repo0: Design-Driven Zero-to-All Code Generation", "arxiv_id": "2608.19854", "authors": "Silin Chen, Haoyi Teng, Xiaodong Gu, Yuling Shi, Jiale Huang, Yongpan Wang, Hongyu Zhang, Haibing Guan", "summary": "Large language model agents have made substantial progress in code generation, yet most existing systems assume a predefined repository architecture. This assumption does not hold in zero-to-all code generation, where an agent must construct an entire software project directly from natural-language requirements while maintaining a modular repository architecture throughout development. We present Repo0, a continuous structural evolution framework for zero-to-all code generation. Repo0 maintains an explicit architectural state instantiated as a Dual-Directed-Acyclic-Graph (Dual-DAG), consisting of a requirement-level DAG, a component-level DAG, and their alignment relation. Starting from natural-language requirements, it iteratively evolves component boundaries through structural actions guided by modularity metrics until structural convergence, after which the converged architecture guides test-driven development code generation. We evaluate Repo0 on six real-world repositories from RepoCraft using GPT-5 mini and DeepSeek V3.2. Repo0 achieves the highest Functionality Coverage and Pass Rate across all settings. Compared with RPG, the strongest repository-planning baseline, Repo0 improves Functionality Coverage by up to 20.08 percentage points and Pass Rate by up to 29.74 percentage points. Ablation and structural-evolution analyses further demonstrate the importance of the Dual-DAG architectural state, modularity-guided structural evolution, and explicit structural convergence.", "category": "cs.AI", "cluster": "Code Generation \u0026 Software Engineering", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-126 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文完全符合“构建、改进 LLM智能体”的研究范围，具体理由如下：\n\n1.  核心对象明确为 LLM Agent：摘要开篇即指出研究对象是 \"Large language model agents\"，且任务场景是 \"zero-to-all code generation\"（从零到全的代码生成），这属于典型的 Agentic Coding 场景。\n2.  符合“单智能体规划与演化”方向：论文提出的 Repo0 框架核心在于解决智能体在长程任务中的架构规划问题。它引入了 \"continuous structural evolution framework\"（连续结构演化框架），通过 \"iteratively evolves component boundaries\"（迭代演化组件边界）来优化代码结构。这直接对应了筛选标准中关于智能体 Planning（规划）、Self-Evolving（自我演化/迭代改进）以及 Long-Horizon Decision-Making（长程决策）的关注点。\n3.  符合“Harness/Scaffold 改进”的保留规则：论文贡献了一个新的 Agent Harness/Scaffold（即基于 Dual-DAG 的状态管理和结构演化机制），旨在让智能体在生成代码的过程中能够动态调整和优化其内部结构状态，从而提升最终代码的质量（Functionality Coverage 和 Pass Rate）。这属于通过改进智能体的执行环境和规划机制来提升其能力的研究，而非单纯的基础设施或应用层调用。\n4.  排除项不适用：虽然涉及代码生成，但其核心贡献不是简单的应用，而是提出了新的智能体行为机制（结构演化）；虽然涉及图结构（DAG），但这是作为智能体内部的状态表示和规划工具，而非研究图神经网络或知识图谱本身，因此不属于排除的“图相关技术”范畴。\n\n综上，该论文研究的是如何通过结构化的演化机制来增强 LLM 智能体在复杂代码生成任务中的规划与执行能力，属于 Agentic AI 中单智能体规划与自我演化的前沿研究，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\n论文提出的核心研究问题是 **Zero-to-All Code Generation**，即在没有预定义仓库架构（predefined repository architecture）的情况下，仅凭自然语言需求从头构建完整的软件项目。这一问题的关键在于，智能体（Agent）必须同时推断软件的功能逻辑与架构设计，并在整个开发过程中维持模块化的仓库结构。\n\n该问题的重要性源于现有代码生成范式的根本性局限。当前的主流方法（如 **SWE-agent** 或基于 **Commit0** 的方法）通常假设代码库的架构设计已经完成，智能体仅在既定的组件边界、包组织和依赖图之上进行代码补全或修复。这种假设在真实的从零开发场景中失效，因为架构设计并非静态蓝图，而是随着开发深入、功能细化及验证反馈而动态演化的过程。若缺乏显式的架构引导，智能体容易生成高耦合、低内聚的代码，导致组件边界模糊、依赖结构脆弱以及跨文件协调困难。\n\n解决这一问题的价值在于实现了从“代码合成”到“软件工程全生命周期自动化”的范式转变。通过引入 **Repo0** 框架，研究证明了将仓库生成建模为 **Continuous Structural Evolution**（连续结构演化）问题，而非一次性规划问题，能显著提升生成代码的功能覆盖率（Functionality Coverage）和通过率（Pass Rate）。这不仅提高了大型复杂项目的生成质量，还通过显式的 **Dual-DAG**（双有向无环图）状态维护，确保了从需求到代码的可追溯性，为构建具备架构推理能力的自主软件工程师智能体奠定了基础。\n\n### § 2 前人工作与不足\n\n尽管 **Repository Generation** 领域已有诸多探索，但现有方法在处理从零开始的架构设计时存在显著不足，主要体现为将软件架构视为静态产物（Static Artifact）。\n\n最相关的先前工作包括 **RPG** (Repository Planning Graph)、**Paper2Code** 以及 **NL2Repo-Bench**。\n*   **RPG** 引入了显式的仓库规划图来指导代码生成，代表了基于图规划的先进方法。然而，RPG 的核心缺陷在于其“一次性规划”假设：它在初始阶段生成一个固定的规划图，随后 rigidly 执行代码生成。这种方法无法应对开发过程中涌现的复杂性，例如当生成的代码揭示某些组件内聚性不足或依赖过度纠缠时，RPG 缺乏机制去动态调整组件边界。\n*   **Paper2Code** 等基于多智能体的系统通过角色分工协调规划与实现，但其规划表示仍主要依赖自然语言或预定义工作流，缺乏对架构模块性（Modularity）的显式量化和迭代优化机制。\n*   **NL2Repo-Bench** 等基准测试甚至通过提供“黄金”仓库架构作为输入来规避设计阶段，这虽然简化了任务，但掩盖了从零构建架构的核心挑战。\n\n这些方法之所以存在不足，是因为它们未能认识到仓库模块性（如高内聚、低耦合）在初始需求阶段是部分可观测的，且往往在编码和验证过程中才完全显现。现有的 **Graph-based approaches** 缺乏基于模块性指标（如 Cohesion 和 Coupling）的结构演化循环，导致生成的架构要么过于碎片化，要么存在冗余。此外，缺乏显式的收敛标准使得智能体容易陷入过度分解或无效重构的循环。因此，前人工作未能解决如何在生成过程中持续优化架构状态这一关键瓶颈，而 **Repo0** 正是通过引入 **Modularity-Guided Structural Evolution** 和 **Dual-DAG** 状态表示，填补了这一空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在大型语言模型（LLM）应用于代码生成的早期阶段，研究主要集中在函数级补全或基于现有仓库结构的增量修改（如 SWE-agent, Commit0）。随着任务复杂度提升，研究者开始探索从零开始生成整个软件仓库（Zero-to-All Code Generation）。然而，现有的“一次性规划”范式（如 RPG, Paper2Code）存在一个根本性的认知偏差：它们假设软件架构可以在编码开始前被完美地静态规划出来。\n\n这种假设在现实中是脆弱的。软件工程的核心原则——高内聚（High Cohesion）和低耦合（Low Coupling）——往往不是在设计初期就能完全确定的，而是在实现过程中通过反馈逐渐显现的。当 LLM 试图一次性生成复杂的依赖图时，它缺乏对组件边界是否合理的即时验证机制。这导致生成的架构要么过于分散（低内聚，导致组件职责不清），要么过度纠缠（高耦合，导致修改困难）。\n\n作者观察到，人类开发者在构建新项目时，并非先画出完美的蓝图再编码，而是通过“设计-实现-重构”的循环迭代来优化架构。现有的 LLM Agent 缺乏这种“结构演化”的能力，它们将架构视为静态产物（Static Artifact），而非动态状态（Dynamic State）。因此，核心痛点在于：如何让 Agent 在生成代码的同时，能够根据模块化指标（Modularity Metrics）动态调整组件边界，而不是盲目执行初始计划。\n\n基于此，作者提出将仓库生成重构为一个“连续结构演化”（Continuous Structural Evolution）过程。关键在于引入一个显式的、可分离的状态表示，即双有向无环图（Dual-DAG），将需求层面的功能协调与实现层面的组件依赖解耦。通过定义明确的模块化指标（如内聚度、耦合度）来触发结构动作（Split, Merge, Revise），Agent 可以在编码前或编码中不断修正架构，直到达到结构收敛（Structural Convergence）。这种从“静态规划”到“动态演化”的范式转变，旨在解决 LLM 在长程依赖和复杂架构设计中的不可靠性问题。\n\n### § 4 核心 Intuition\n\n现有方法将软件架构视为编码前的一次性静态蓝图，忽略了架构合理性（如高内聚、低耦合）是在实现过程中通过反馈逐渐显现的。Repo0 的核心直觉是：仓库生成不应是“先规划后执行”的线性过程，而应是“设计与实现交织”的连续结构演化过程。通过维护一个分离需求与实现的双有向无环图（Dual-DAG），并利用模块化指标动态触发组件的拆分、合并与修订，系统能够在代码生成前自动优化架构边界，从而确保最终生成的代码既功能完整又结构稳健。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nRepo0 的核心方法是将“从零到全”的代码生成（Zero-to-All Code Generation）重构为一个**持续的结构演化（Continuous Structural Evolution）**过程，而非传统的单次静态规划。其核心在于维护一个显式的架构状态，即 **Dual-Directed-Acyclic-Graph (Dual-DAG)**，该图包含需求层 DAG（Requirement-level DAG）和组件层 DAG（Component-level DAG），以及两者之间的对齐关系（Alignment Relation）。\n\n以下以生成一个简化的 HTTP 请求库（类似 `requests` 库，文中称为 `HttpEasy`）为例，展示完整的 Pipeline：\n\n**1. 输入与初始状态构建 (Phase I: Requirement Decomposition and Initial Architecture)**\n*   **输入**：自然语言需求文档 $D$（例如：“构建一个 Pythonic 的 HTTP 请求库，支持 GET/POST 方法、会话保持、JSON 解析及超时处理”）。\n*   **处理**：\n    *   **需求提取与合并**：LLM 从文档中提取候选需求，合并重叠项，形成高层需求（High-Level Requirements, HLRs）。例如，将“GET/POST 支持”和“URL 规范化”合并为 HLR1: “Pythonic Request Construction API”。\n    *   **需求分解**：对每个 HLR 进行“推理-标注”过程。LLM 细化行为、输入输出及约束，分解为子需求（Sub-requirements, SRs）。例如，HLR1 分解为 SR1: “方法辅助入口”、SR2: “URL 规范化”、SR3: “请求对象构建”。\n    *   **构建需求层 DAG ($G^R_0$)**：根据子需求间的逻辑依赖（如 SR3 依赖 SR2 的输出）建立有向边。\n    *   **初始组件生成**：LLM 将子需求映射为初始组件（Components），如 `RequestBuilder`（负责 SR2, SR3）。建立组件层 DAG ($G^C_0$) 和对齐关系 $A_0$（记录哪个组件实现了哪些子需求）。\n*   **输出**：初始架构状态 $S_0 = (G^R_0, G^C_0, A_0)$。\n\n**2. 模块化引导的结构演化 (Phase II: Modularity-Guided Structural Evolution Loop)**\n*   **输入**：初始架构状态 $S_0$。\n*   **处理**：系统进入迭代循环，固定 $G^R$，仅演化 $G^C$ 和 $A$，直到结构收敛。\n    *   **计算模块化指标**：\n        *   **Cohesion (内聚性)**：计算组件内部子需求之间的功能协调密度。若 `RequestBuilder` 同时负责“URL 解析”和“SSL 证书验证”，且这两者在需求图中无直接关联，则内聚性低。\n        *   **Coupling (耦合度)**：计算两个组件负责的子需求集合的 Jaccard 相似度。若 `SessionManager` 和 `AuthHandler` 都高度依赖相同的底层网络组件，耦合度高。\n    *   **执行结构动作 (Structural Actions)**：\n        *   **Split (拆分)**：若某组件内聚性低于阈值 $\\gamma_{split}$ 且规模过大，LLM 将其拆分为更细粒度的组件。例如，将臃肿的 `NetworkCore` 拆分为 `TransportAdapter` 和 `ConnectionPool`。\n        *   **Merge (合并)**：若两个组件耦合度高于阈值 $\\theta_{merge}$ 且连接紧密，LLM 将其合并。例如，将 `HeaderParser` 和 `StatusChecker` 合并为 `ResponseHandler`。\n        *   **Revise (修订)**：在不改变边界的情况下，重写组件的责任描述或接口假设，以解决不一致性。\n        *   **Save (保存)**：标记结构稳定的组件，不再参与当前轮次的演化。\n    *   **收敛判断**：当一轮迭代中没有触发任何 Split 或 Merge 动作时，认为达到**结构收敛 (Structural Convergence)**。\n*   **输出**：收敛后的最终架构状态 $S_{final}$，具有更高的内聚性和更低的耦合度。\n\n**3. 代码生成与验证 (Phase III: Code Generation)**\n*   **输入**：收敛后的架构状态 $S_{final}$。\n*   **处理**：\n    *   **生成计划**：将 $G^C$ 转化为具体的文件路径、包结构和生成顺序。\n    *   **TDD 工作流**：对每个组件，LLM 先生成骨架代码（Skeleton），再根据对齐的子需求生成测试用例（Tests），最后填充实现代码（Implementation）。\n    *   **验证与修复**：运行测试（pytest）。若失败（如接口不匹配、逻辑错误），LLM 根据错误信息进行局部修复（Localized Repair）。若发现组件描述本身有误，可触发 `Revise` 动作更新架构描述后重试。\n*   **输出**：完整的、可运行的软件仓库代码（Repository Code）。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的理论数学推导，其核心贡献在于**工程方法论**和**启发式指标（Heuristic Metrics）**的设计。然而，为了量化“模块化”并指导结构演化，论文定义了三个关键的数学指标。面向数学基础较弱的读者，这些公式的直觉如下：\n\n1.  **Responsibility (责任规模)**\n    *   **公式**：$|RS(c)|$\n    *   **直觉**：这是一个计数。它表示组件 $c$ 负责了多少个子需求。如果这个数字太大，说明这个组件“太胖”了，可能违反了单一职责原则，需要拆分。\n\n2.  **Cohesion (内聚性)**\n    *   **公式**：$Cohesion(c) = \\frac{|E_{in}(c)|}{\\binom{|RS(c)|}{2}}$ （注：原文虽未显式写出分母组合数，但定义为“密度”，即内部边数除以可能的最大边数）\n    *   **直觉**：衡量组件内部的“团结程度”。\n        *   分子 $|E_{in}(c)|$ 是组件内部子需求之间存在的依赖边数。\n        *   分母是这些子需求两两组合的总数。\n        *   **含义**：如果组件里的功能彼此之间联系紧密（边多），内聚性就高（接近 1）；如果组件里的功能各干各的（边少），内聚性就低（接近 0）。低内聚性触发 **Split** 动作。\n\n3.  **Coupling (耦合度)**\n    *   **公式**：$Coupling(A, B) = \\frac{|RS_A \\cap RS_B|}{|RS_A \\cup RS_B|}$ (Jaccard Similarity)\n    *   **直觉**：衡量两个组件之间的“重叠程度”。\n        *   分子是两个组件共同负责的子需求数量。\n        *   分母是两个组件负责的所有子需求的并集数量。\n        *   **含义**：如果两个组件负责的功能高度重叠（例如都处理“用户认证”），耦合度就高。高耦合度通常意味着这两个组件应该合并，或者存在设计冗余，触发 **Merge** 动作。\n\n**理论背景补充**：\n这些指标源自经典软件工程中的**高内聚低耦合（High Cohesion, Low Coupling）**原则。Repo0 的创新点在于将这些定性原则转化为可计算的定量指标，并作为 LLM 进行结构决策（Split/Merge）的触发条件，从而避免了 LLM 盲目地、无约束地修改架构。\n\n---\n\n### § 7 实验设计与结论\n\n**RQ1: Repo0 在从零到全代码生成中的整体有效性如何？**\n*   **问题**：现有的静态规划方法（如 RPG）是否优于动态演化方法？Repo0 能否在功能覆盖率和代码正确性上超越基线？\n*   **实验设计**：\n    *   **数据集**：使用 RepoCraft 基准测试，包含 6 个真实 Python 仓库（如 `scikit-learn`, `django` 等），去除结构提示，仅保留高层需求。\n    *   **基线对比**：对比 mini-SWE-agent（直接编码）、Paper2Code（分阶段多智能体）、RPG（静态图规划）。\n    *   **指标**：Functionality Coverage（功能覆盖率）、Pass Rate（测试通过率）、Voting Rate（语义投票率）。\n    *   **模型**：使用 GPT-5 mini 和 DeepSeek V3.2 作为骨干模型。\n*   **答案**：Repo0 在所有设置下均取得了最高的 Functionality Coverage 和 Pass Rate。相比最强的基线 RPG，Repo0 的功能覆盖率提升了 4.55-20.08 个百分点，通过率提升了 7.61-29.74 个百分点。这表明**持续的结构演化比一次性静态规划能生成更完整、更正确的代码**。\n\n**RQ2: Repo0 的核心设计组件各自贡献如何？（消融实验）**\n*   **问题**：Dual-DAG 表示、结构演化循环、需求上下文等组件是否都是必要的？\n*   **实验设计**：\n    *   进行消融实验（Ablation Study），分别移除：\n        1.  Structural Evolution（结构演化，即固定初始架构）。\n        2.  Requirement Context（需求上下文，即生成代码时不考虑相邻需求）。\n        3.  Component-Graph Ordering（组件图排序，即不按依赖顺序生成）。\n        4.  Dual-DAG（双图表示，即合并为单图）。\n*   **答案**：移除任何组件都会导致性能下降。其中，**移除 Structural Evolution 导致的性能下降最大**，证明动态调整架构边界是提升质量的关键。移除 Requirement Context 主要影响代码正确性（Pass Rate），证明跨组件的需求协调很重要。\n\n**RQ3: 基于指标的收敛是否优于 LLM 自主决定的结构动作？**\n*   **问题**：使用 Cohesion/Coupling 指标引导演化，是否比让 LLM 自由决定何时停止演化更好？\n*   **实验设计**：\n    *   对比三种策略：\n        1.  Repo0（指标引导，自动收敛）。\n        2.  w/o evolution（无演化，使用初始架构）。\n        3.  LLM-decided evolution（LLM 自主决定，固定预算 1/3/5 轮）。\n*   **答案**：Repo0 优于所有其他变体。LLM 自主决定的演化往往会导致**过度分解（Over-decomposition）**，即在结构已经合理后继续拆分，导致架构碎片化，从而降低下游代码生成的正确性。指标引导的收敛机制能有效防止这种过度优化，确保架构在最佳模块化状态停止演化。", "additional_insights": "### § 8 Take-aways\n\nRepo0 将零到全代码生成（zero-to-all code generation）重新定义为连续的结构演化问题，而非传统的单次静态规划（one-shot planning），通过引入 Dual-DAG 架构状态显式分离需求级功能协调与实现级组件依赖。该方法利用内聚度（cohesion）和耦合度（coupling）等模块化指标驱动组件边界的动态调整（split/merge/revise），直到架构达到结构收敛（structural convergence），从而解决 LLM 在缺乏先验架构时容易产生的低内聚和高耦合问题。实验表明，相较于最强的基线 RPG，Repo0 在 RepoCraft 基准上显著提升了功能覆盖率（Functionality Coverage）和通过率（Pass Rate），证明持续的结构优化比固定蓝图更能适应开发过程中涌现的复杂性。消融实验证实，结构演化模块是性能提升的核心驱动力，而移除需求上下文或组件图排序会显著降低实现正确性，表明需求与实现的紧密对齐及依赖感知的生成顺序至关重要。此外，基于指标的收敛机制优于无约束的 LLM 决策演化，后者容易导致过度分解（over-decomposition）和架构碎片化，说明显式的模块化约束对于维持架构稳定性具有不可替代的作用。\n\n### § 9 最脆弱的假设\n\nRepo0 最脆弱的假设是：**模块化指标（如基于子需求重叠度的 Jaccard Similarity 耦合度和基于功能协调边密度的内聚度）能够准确反映软件架构的质量，且 LLM 能够正确执行由这些指标触发的结构动作（如 split/merge）而不引入语义错误。** 如果这一假设不成立，即指标无法捕捉真实的架构缺陷（例如忽略了运行时依赖或数据流复杂性），或者 LLM 在执行 split/merge 时破坏了组件间的接口契约，那么整个结构演化循环将导致架构退化而非优化，核心贡献将失效。在实际中，该假设可能不成立的原因在于：静态的需求-组件对齐关系（alignment relation）可能无法完全覆盖动态的运行时交互，且 LLM 在重写组件边界和接口假设时具有高度的不确定性，容易引入新的不一致性。论文提供的证据主要依赖于 RepoCraft 基准上的最终 Pass Rate 和功能覆盖率提升，以及消融实验中移除结构演化导致的性能下降，但这仅证明了“演化”优于“不演化”，并未直接验证指标本身的准确性或 LLM 执行动作的语义正确性（例如，未提供细粒度的架构质量评估或错误案例分析来证明 split/merge 决策的合理性）。论文在 Threats to Validity 中承认了结构更新质量依赖于骨干 LLM 的架构推理能力，这进一步凸显了该假设的风险。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 Repo0 的核心创新点：**基于模块化指标的结构收敛机制对架构稳定性的影响**。具体方案如下：使用 RepoCraft 中的一个小型仓库（如 `requests` 对应的 `HttpEasy`）作为数据源，提取其初始需求文档。实现一个简化的 Dual-DAG 构建器，仅包含需求级 DAG 和初始组件级 DAG，不实现完整的代码生成。核心实现部分为结构演化循环：定义简化的内聚度（cohesion）和耦合度（coupling）计算函数，并实现基于阈值的 split 和 merge 触发逻辑。测量指标为：在不同演化轮次下，组件级 DAG 的结构变化次数（即 split/merge 动作数量）以及最终架构与真实仓库架构的相似度（如组件边界对齐度）。支持该 claim 的结果是：基于指标的演化在有限轮次内迅速收敛，且最终组件边界与真实仓库高度一致；而对比基线（如随机演化或 LLM 无约束演化）则表现出持续的结构震荡或过度碎片化。反驳该 claim 的结果是：基于指标的演化未能收敛，或收敛后的架构与真实仓库差异巨大，表明指标未能有效指导架构优化。此实验无需复现完整的代码生成和 TDD 流程，仅聚焦于架构演化本身，可在短时间内验证核心机制的有效性。", "research_value": "### § 11 最强反例设计\n\n若要挑战 **Repo0** 的有效性，最有力的攻击并非针对其代码生成的语法正确性，而是针对其核心假设：**静态的、基于需求对齐的模块化指标（Static Modularity Metrics）足以捕捉动态软件系统的架构复杂性**。\n\n**理论论证：静态对齐与动态依赖的错位（Static Alignment vs. Dynamic Dependency Mismatch）**\n**Repo0** 的 **Coupling** 指标基于子需求集合的 **Jaccard Similarity**，**Cohesion** 基于需求图内部的边密度。这一设计隐含了一个强假设：架构的优劣完全由“需求-组件”的映射关系决定。然而，在真实软件工程中，高内聚低耦合往往体现在**运行时数据流（Runtime Data Flow）**和**控制流（Control Flow）**上，而非静态的功能归属上。\n*   **反例场景**：考虑一个事件驱动架构（Event-Driven Architecture）或微服务系统。组件 A 和组件 B 在功能需求上可能完全正交（Jaccard Similarity = 0，低耦合），但它们共享一个高频调用的底层消息队列或状态存储。在 **Repo0** 的视角下，这两个组件是解耦的，应独立演化。但在实际工程中，这种共享基础设施导致了严重的**隐式耦合（Implicit Coupling）**，使得独立部署或修改变得极其困难。\n*   **攻击点**：**Repo0** 缺乏对**运行时交互模式（Runtime Interaction Patterns）**的感知。它生成的架构可能在静态需求层面是“模块化”的，但在运行时却因共享状态或高频通信而变得脆弱。这种“静态正确、动态脆弱”的架构会导致下游测试通过率高（因为测试通常是隔离的），但在集成测试或真实部署中失败率极高。\n\n**实验设计：引入“运行时耦合”噪声的基准测试**\n设计一个名为 **DynamicRepo-Bench** 的新基准，其中包含大量具有**隐式依赖**的项目（如基于 Redis 缓存的系统、基于 Kafka 的事件流处理系统）。\n1.  **构造陷阱**：在需求文档中，明确描述功能模块，但隐藏或弱化对共享基础设施（如全局缓存、事件总线）的依赖描述，或者将这些依赖描述为“通用工具”而非特定组件的责任。\n2.  **对比实验**：运行 **Repo0** 和基线方法。\n3.  **评估指标**：除了传统的 **Pass Rate**，引入 **Integration Stability Score**（集成稳定性得分），即在不修改其他组件的情况下，修改一个组件后导致其他组件测试失败的概率。\n4.  **预期结果**：**Repo0** 可能会生成看似完美的 **Dual-DAG**，因为静态需求对齐良好。然而，由于它未能识别出基于共享基础设施的隐式耦合，生成的组件边界将导致极高的 **Integration Stability Score**（即修改一个组件容易破坏其他组件）。这将证明 **Repo0** 的模块化指标是**不充分（Insufficient）**的，它优化了一个错误的代理目标（Proxy Objective）。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“静态结构演化”到“运行时反馈驱动的架构自适应”（Runtime-Feedback-Driven Architectural Adaptation）**\n\n**(a) 驱动局限与未满足需求**\n**Repo0** 的核心局限在于其架构演化是**开环（Open-Loop）**的：它仅基于静态需求分解和启发式指标进行 **Split/Merge**，缺乏来自代码执行或集成测试的**动态反馈（Dynamic Feedback）**。如前所述，静态指标无法捕捉运行时耦合。此外，**Repo0** 假设架构在代码生成前即可收敛，但真实软件开发中，架构往往是在编码和调试过程中通过**重构（Refactoring）**逐步清晰的。因此，需要一个能感知运行时行为并据此调整架构的闭环系统。\n\n**(b) 借鉴相邻领域的方法**\n借鉴**软件重构（Software Refactoring）**和**动态程序分析（Dynamic Program Analysis）**领域的技术。\n*   **动态切片（Dynamic Slicing）**：用于识别代码中实际的数据依赖和控制依赖，而非静态假设的依赖。\n*   **架构漂移检测（Architecture Drift Detection）**：用于检测实现代码与预期架构之间的偏差。\n*   **强化学习（Reinforcement Learning, RL）**：将架构调整视为一个序列决策问题，奖励函数不仅包含静态模块化指标，还包含运行时性能、测试稳定性和重构成本。\n\n**(c) 第一个实验设计**\n提出 **Repo0-RF (Runtime-Feedback)** 框架，其核心创新是引入**运行时验证循环（Runtime Verification Loop）**。\n1.  **初始阶段**：使用 **Repo0** 生成初始架构和代码。\n2.  **动态分析阶段**：运行集成测试，收集**调用图（Call Graph）**和**数据流图（Data Flow Graph）**。\n3.  **架构偏差计算**：比较静态 **Dual-DAG** 与动态调用图。如果两个在静态图中无直接连接的组件在运行时频繁交互（高频调用或共享数据），则标记为**架构违规（Architecture Violation）**。\n4.  **自适应重构**：LLM 根据违规信息执行**运行时感知的结构动作**，如引入**中介者模式（Mediator Pattern）**组件来解耦高频交互，或合并频繁交互的组件。\n5.  **实验对比**：在 **DynamicRepo-Bench** 上，对比 **Repo0**（静态演化）与 **Repo0-RF**（动态反馈演化）。\n6.  **预期结果**：**Repo0-RF** 在 **Integration Stability Score** 和**长期可维护性指标**（如重构频率）上显著优于 **Repo0**，证明引入运行时反馈能解决静态指标无法捕捉的隐式耦合问题，从而实现真正的“架构自适应”。\n\n这一方向将代码生成从“一次性规划”推向“持续演化的软件工程”，与 **Repo0** 的“连续结构演化”理念一脉相承，但将其从静态领域扩展到了动态领域，具有更高的理论价值和实际应用潜力。", "research_value_source": "summary_field_repair_fallback", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Silin Chen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Haoyi Teng\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Xiaodong Gu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Yuling Shi\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jiale Huang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yongpan Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Hongyu Zhang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Haibing Guan\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Shanghai Jiao Tong University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Chongqing University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Silin Chen and Haoyi Teng contributed equally.\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Xiaodong Gu is the corresponding author.\"\n    }\n  ]\n}\n```", "summary_translation": "大型语言模型智能体在代码生成方面取得了显著进展，然而大多数现有系统都假设存在预定义的仓库架构。这一假设在从零到全（zero-to-all）代码生成场景中并不成立，在该场景中，智能体必须直接从自然语言需求构建整个软件项目，并在整个开发过程中保持模块化的仓库架构。我们提出了 Repo0，这是一个用于从零到全代码生成的连续结构演化框架。Repo0 维护一个显式的架构状态，其实例化为双有向无环图（Dual-DAG），由需求层 DAG、组件层 DAG 以及它们之间的对齐关系组成。从自然语言需求出发，它在模块化指标的引导下，通过结构动作迭代演化组件边界，直至结构收敛；随后，收敛后的架构指导测试驱动开发代码生成。我们使用 GPT-5 mini 和 DeepSeek V3.2 在来自 RepoCraft 的六个真实仓库上对 Repo0 进行了评估。Repo0 在所有设置下均实现了最高的 Functionality Coverage 和 Pass Rate。与最强的仓库规划基线 RPG 相比，Repo0 将 Functionality Coverage 提高了多达 20.08 个百分点，将 Pass Rate 提高了多达 29.74 个百分点。消融实验和结构演化分析进一步证明了 Dual-DAG 架构状态、模块化引导的结构演化以及显式结构收敛的重要性。"}]}, {"name": "Recursive Self-Improvement", "count": 1, "papers": [{"title": "AI4AI-Bench: Benchmarking LLM Agents in Algorithmic Design for Recursive Self-Improvement", "arxiv_id": "2608.20318", "authors": "Yizhe Chi, Wenyi Li, Deyao Hong, Xiaoqiu Wang, Mingju Gao, Kaisen Yang, Bingxiang He, Youjie Zheng, Calvin Xiao, Qinhuai Na", "summary": "Recursive self-improvement (RSI) asks whether an AI system can improve the process that produces AI systems, so that the next system inherits the improvement. That process is the training algorithm: a better objective or update rule improves the compute\\mbox{-}capability exchange rate for every subsequent run, including the one that produces the next agent. Whether RSI is feasible therefore turns on whether an agent can design training algorithms. No benchmark isolates that ability: existing suites are won by collecting data or by tuning hyperparameters, and none tells a change to how a run is executed apart from a change to how the model learns. We present AI4AI\\mbox{-}Bench, 10 frozen research repositories spanning 10 training algorithm families. In each task, an agent has 4 hours on one B300 to rewrite the training algorithm; its code is then rerun from scratch for up to 12 hours and scored by a fixed evaluator hidden from the agent, against the repository's original algorithm under the same procedure. Because the 10 metrics are incommensurable, every task is mapped onto one scale on which $0$ is an uninformative model, $0.1$ is the algorithm the repository ships, and $1.0$ is the task optimum. Across 29 configurations of 6 systems on all 10 tasks the mean score is $0.166$, and the best system reaches $0.250$: even the strongest closes under a fifth of the distance between the algorithm that was already there and the optimum. The submissions show where that distance went: most never change how the model learns at all, and the minority that do average $0.226$ against $0.126$ for the rest. More reasoning effort mostly buys the willingness to go there, taking that minority from $8\\%$ of submissions to $64\\%$ and the mean score from $0.094$ to $0.196$. We release the task suite, the evaluators and every scored submission, so that the measurement can be repeated as these systems change.", "category": "cs.CL", "cluster": "Recursive Self-Improvement", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Self-Evolving/Self-Improving, LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：大型语言模型（LLM）智能体是否具备**Algorithmic Design**（算法设计）能力，即能否通过修改训练算法（如优化目标、更新规则、正则化策略等）来实现**Recursive Self-Improvement**（递归自我改进，RSI），从而提升后续AI系统的计算-能力交换率。这一问题的重要性在于，RSI的可行性取决于智能体能否改进产生AI系统的过程，而不仅仅是优化数据或工程效率。现有的改进路径存在明确的瓶颈：**Systems Engineering**（系统工程）受限于硬件屋顶线（roofline），一旦内核达到硬件极限便无法进一步增益；**Data Engineering**（数据工程）受限于人类文本的有限存量以及合成数据带来的递归退化（curse of recursion），且遵循损失减半成本指数增长的幂律。相比之下，**Algorithmic Design**层面的改进（如Adam、Layer Normalization、DPO等）是一次性投入、长期复利的，能够从根本上改变计算与能力的交换率。因此，隔离并评估智能体在算法设计层面的能力，是验证RSI是否可行的关键前提。解决这一问题不仅能揭示当前LLM智能体在科学发现中的真实上限，还能为构建能够自主改进训练算法的下一代AI系统提供基准和方向。\n\n### § 2 前人工作与不足\n\n尽管已有多个基准测试涉及AI系统的自动化改进，但没有任何一个基准能够精确隔离并评估**Algorithmic Design**能力。现有的相关工作存在以下具体不足：\n\n1.  **Kaggle-derived suites (e.g., MLE-Bench, MLE-Dojo)**：这些基准主要评估智能体在固定数据集上的预测性能，获胜策略通常依赖于特征工程（feature engineering）和集成学习（ensembling），而学习算法本身往往保持为库调用（library call），智能体从未编辑过训练代码。因此，这些基准无法区分智能体是改进了“如何执行运行”还是“模型如何学习”，且其成果无法被后续训练继承。\n2.  **PostTrainBench**：该基准关注端到端的后训练过程，但其最大的杠杆在于数据组装（data assembly）和初始化选择，而非优化目标（objective）本身。它未能将算法改进与数据选择解耦。\n3.  **RSIBench-Data**：该基准刻意冻结后训练堆栈，仅允许数据中心的决策变化。虽然它隔离了数据层面，但完全排除了算法设计层面的评估，因此无法回答智能体能否改进学习规则的问题。\n4.  **MLS-Bench**：虽然包含140个任务让智能体改进ML系统的某个组件，但其组件边界由外部给定，且评分混淆了执行层面的改进（如并行化、通信）与学习算法的改变。它无法区分智能体是优化了代码效率还是设计了更好的算法。\n5.  **autoresearch**：这是最接近的工作，允许智能体编辑单个训练文件中的所有代码（包括架构和优化器）。然而，其运行时间极短（5分钟），且针对经典优化器的编辑行为类似于超参数搜索（hyperparameter search），在受控比较中甚至不如CMA-ES和TPE等传统优化算法。这表明，编辑源代码并不等同于设计算法，且短时间的脚本运行无法反映真实研究仓库中的复杂训练动态。\n\n综上所述，现有基准要么侧重于数据和工程，要么将算法改进与执行效率混淆，要么因任务过于简化而退化为超参数搜索。它们都无法回答RSI循环中的核心问题：智能体是否真正改变了模型的学习机制（how the model learns），而不仅仅是调整了运行参数或数据分布。AI4AI-Bench通过冻结10个涵盖不同训练算法家族的研究仓库，并严格分离4小时的智能体探索窗口与12小时的独立重新训练评估，首次实现了对算法设计能力的精确隔离与评估。", "core_insight": "### § 3 重建作者的思考路径\n\n在探索递归自我改进（Recursive Self-Improvement, RSI）的可行性时，研究者首先面临一个核心瓶颈：现有的自动化机器学习（AutoML）基准测试无法区分“工程优化”与“算法创新”。现有的基准如 MLE-Bench 或 PostTrainBench 往往奖励数据清洗、特征工程或超参数调优（Hyperparameter Tuning），这些操作虽然能提升单次任务的性能，但并未改变模型学习的基本机制（Learning Rule）。如果 RSI 要产生复利效应，关键在于改进训练算法本身——即改变目标函数（Objective）、更新规则（Update Rule）或正则化策略，从而提升计算能力与模型能力之间的交换率（Compute-Capability Exchange Rate）。\n\n然而，直接让 Agent 修改代码存在巨大的混淆变量：Agent 可能通过优化系统底层（如 Kernel 优化、并行策略）或调整数据分布来获得性能提升，而非真正改进算法。现有的基准如 autoresearch 虽然允许修改代码，但其运行时间极短，且缺乏对“算法层”与“执行层”的严格隔离，导致 Agent 的行为退化为传统的超参数搜索（如 CMA-ES 或 TPE），无法体现真正的算法设计能力。\n\n因此，研究者意识到需要构建一个能够严格隔离“算法设计”能力的基准。这个基准必须满足三个条件：第一，冻结研究仓库（Research Repository），提供真实的、非玩具的训练代码；第二，严格分离探索阶段（Exploration）与评估阶段（Evaluation），Agent 只能在有限的时间内通过代理指标（Proxy Metric）进行调试，而最终评分由一个 Agent 无法访问的独立评估器在干净的环境中从头运行代码得出；第三，评分机制必须能够量化 Agent 是否真正触及了“模型如何学习”这一核心层，而不仅仅是调整了运行参数。基于此，AI4AI-Bench 应运而生，它通过冻结 10 个涵盖不同算法家族（如 SFT, RL, Diffusion 等）的仓库，并引入统一的进度坐标（Progress Coordinate）来标准化不可通约的指标，从而精确测量 Agent 在算法设计层面的真实能力。\n\n### § 4 核心 Intuition\n\n这篇论文的核心直觉在于，递归自我改进（RSI）的复利效应不源于数据积累或工程加速，而源于对训练算法本身（如目标函数和更新规则）的根本性改进。现有的基准测试混淆了“如何运行代码”与“模型如何学习”，导致 Agent 仅进行浅层的超参数调优或工程优化，无法触及算法设计的核心。AI4AI-Bench 通过严格隔离探索与评估阶段，并强制 Agent 在无法访问最终评估器的情况下修改源码，从而精准测量 Agent 是否真正改变了模型的学习机制，而非仅仅优化了执行过程。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**AI4AI-Bench** 的核心方法是一个隔离 **Algorithmic Design**（算法设计）能力的基准测试框架。它通过严格的协议将 Agent 的“探索/编码阶段”与“训练/评估阶段”解耦，确保 Agent 必须修改训练算法本身，而非仅仅调整超参数或利用数据优势。\n\n以下以 **OpenR1** 任务（基于 Qwen2.5-Coder-1.5B-Instruct 的 Supervised Fine-Tuning）为例，展示完整的 Pipeline：\n\n1.  **输入 (Input)**：\n    *   **Frozen Repository**：一个冻结的研究代码库，包含原始的 SFT 训练脚本、数据加载器和评估器。\n    *   **Base Model**：固定的起始模型权重（Qwen2.5-Coder-1.5B-Instruct）。\n    *   **Proxy Metric**：一个快速可计算的代理指标（如 `livecodebench_public_pass_at_1`），Agent 在探索期间可无限次查询。\n    *   **资源限制**：1 张 B300 GPU，4 小时探索时间。\n\n2.  **处理 (Processing) - 探索阶段 (Exploration Phase)**：\n    *   **代码阅读与分析**：Agent 读取仓库源码，分析当前的训练循环、损失函数（Loss Function）、优化器（Optimizer）和数据管道。\n    *   **假设生成与修改**：Agent 提出改进算法的假设（例如：修改 Loss 权重、引入新的正则化项、改变数据采样策略）。\n    *   **快速验证**：Agent 修改代码并运行短时间的训练，通过 **Proxy Metric** 验证想法的有效性。此阶段 Agent **无法**访问最终评估数据。\n    *   **提交补丁**：4 小时结束后，Agent 提交修改后的源代码补丁（Source Code Patch）。注意：Agent 不能提交训练好的权重或缓存状态，只能提交代码。\n\n3.  **处理 (Processing) - 验证阶段 (Verification Phase)**：\n    *   **干净启动**：系统在新鲜容器中应用 Agent 提交的补丁。\n    *   **从头训练**：使用相同的 Base Model 和硬件，从头开始运行训练脚本，时长最多 12 小时。\n    *   **检查点保存**：系统保留最近的 3 个有效检查点（Checkpoints）。\n\n4.  **输出 (Output) - 评估阶段 (Evaluation Phase)**：\n    *   **独立评估**：使用预先冻结的、Agent 无法访问的 **Final Evaluator** 对检查点进行评分。\n    *   **最终指标**：计算 **LiveCodeBench v6** 的 `pass@1` 分数。\n    *   **标准化打分**：将原始分数映射到 [0, 1] 区间。0.1 代表原始仓库算法的性能，1.0 代表任务理论最优值。Agent 的得分即为该映射值。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有提出新的机器学习算法或复杂的理论推导，其核心贡献在于**评估协议的设计**和**分数标准化方法**。因此，本节重点解释其**评分函数（Scoring Function）**的数学直觉，这是理解实验结果的关键。\n\n**背景**：\n不同任务的指标单位不同（如准确率是 0-1，困惑度 Perplexity 是指数级，负对数似然 NLL 是线性负值）。为了跨任务比较，论文定义了一个统一的 **Progress Coordinate $\\phi$** 和标准化分数 $\\sigma$。\n\n**核心公式直觉**：\n$$ \\sigma = \\frac{\\phi(x) - \\phi(x_\\perp)}{\\phi(x^*) - \\phi(x_\\perp)} $$\n*(注：实际实现中分为低于基线和高于基线两段，此处为简化直觉)*\n\n1.  **$\\phi(x)$ (Progress Coordinate)**：\n    *   **Intuition**：将原始指标转换为“效用”尺度。\n    *   对于准确率（Accuracy），$\\phi(x) = x$（越高越好）。\n    *   对于困惑度（Perplexity, PPL），$\\phi(x) = -\\log(x)$。因为 PPL 是交叉熵的指数，取对数后变成线性尺度，且负号表示越低越好（效用越高）。\n    *   **为什么重要**：如果不取对数，PPL 从 53.4 降到 16.2 看起来进步巨大，但在信息论意义上，它只消除了部分不确定性。$\\phi$ 确保了不同任务间的“进步幅度”在数学上是可比的。\n\n2.  **$x_\\perp$ (Uninformative Model)**：\n    *   **Intuition**：随机猜测或无信息模型的得分。例如，二分类任务的随机猜测准确率是 0.5，而不是 0。这定义了分数的“地板”。\n\n3.  **$x^*$ (Optimum)**：\n    *   **Intuition**：理论上的完美得分。例如，准确率为 1.0，NLL 为 0。这定义了分数的“天花板”。\n\n4.  **$\\sigma$ (Mapped Score)**：\n    *   **Intuition**：Agent 在“无信息模型”和“完美模型”之间走了多远。\n    *   论文设定 **0.1** 为基线（Baseline，即原始仓库算法的得分）。\n    *   如果 $\\sigma \u003E 0.1$，说明 Agent 改进了算法。\n    *   如果 $\\sigma = 1.0$，说明 Agent 达到了理论最优。\n    *   **关键洞察**：实验结果显示，最强系统的平均 $\\sigma$ 仅为 0.250。这意味着即使最强的 Agent，也只覆盖了从“原始算法”到“理论最优”之间距离的 **1/5**（因为 0.1 到 1.0 的距离是 0.9，0.250 仅比 0.1 多了 0.15，即 $0.15/0.9 \\approx 16.7\\%$）。\n\n### § 7 实验设计与结论\n\n**提出了什么问题**：\n现有的基准测试（如 Kaggle 风格或 PostTrainBench）无法区分 Agent 是通过**改进训练算法**（Algorithmic Design）还是通过**工程优化/数据调整**（Systems Engineering/Data Engineering）来提升性能。递归自我改进（RSI）的核心在于算法层面的改进，因此需要一个新的基准来隔离并测量 Agent 设计训练算法的能力。\n\n**设计了什么实验验证这个问题**：\n1.  **构建 AI4AI-Bench**：选取 10 个涵盖不同算法家族（SFT, RL, Distillation, Pruning 等）的冻结研究仓库。\n2.  **严格协议**：\n    *   **时间隔离**：4 小时探索（只能看 Proxy Metric） vs 12 小时正式训练（看 Final Metric）。\n    *   **代码隔离**：Agent 只能提交代码补丁，不能提交权重。\n    *   **评估隔离**：Final Evaluator 对 Agent 不可见，防止过拟合。\n3.  **多维度分析**：\n    *   **性能评估**：计算标准化分数 $\\sigma$，对比不同系统（GPT-5.6, Claude 5, Kimi K3）的表现。\n    *   **行为分类**：人工/LLM 分析提交的代码补丁，分类为“改变运行方式”（如超参数、Checkpoint 策略）或“改变学习方式”（如 Loss 函数、更新规则、数据分布）。\n    *   **推理努力分析**：测试不同 Reasoning Effort（输出 Token 量/成本）对 Agent 行为的影响。\n\n**问题的答案是什么**：\n1.  **Agent 普遍缺乏算法设计能力**：在所有 290 个测试单元中，平均得分仅为 0.166（基线为 0.1）。最强系统（Claude Opus 5）平均得分 0.250，仅覆盖了从基线到最优距离的不到 1/5。\n2.  **大多数 Agent 只进行表面优化**：在 263 个有修改的提交中，**53.6%** 的提交完全没有改变模型的学习方式（How the model learns），仅调整了超参数、训练时长或 Checkpoint 策略。只有 **46.4%** 的提交触及了算法核心（Loss, Update Rule, Data）。\n3.  **算法改进是性能提升的关键**：触及算法层的提交平均得分（0.226）显著高于仅调整运行方式的提交（0.126）。\n4.  **推理努力主要购买“勇气”而非“智慧”**：增加推理努力（Reasoning Effort）使触及算法层的提交比例从 8% 提升到 64%，平均分从 0.094 提升到 0.196。这表明更多的计算资源主要让 Agent **愿意**去修改复杂的算法代码，而不是让它更擅长设计算法。\n5.  **结论**：当前的 LLM Agent 在算法设计层面仍处于“恢复默认值”或“微调”阶段，远未达到能够独立设计优于人类专家算法的水平。RSI 的算法瓶颈依然巨大。", "additional_insights": "### § 8 Take-aways\n\nAI4AI-Bench 通过隔离 **Algorithmic design** 层级，首次量化了 LLM Agent 在 **Recursive self-improvement (RSI)** 核心环节——即改进训练算法本身——的能力，而非仅仅评估数据工程或超参数调优。基准测试采用严格的 **Frozen repository** 协议，Agent 仅有 4 小时探索时间修改代码，随后在隔离环境中重新运行 12 小时，由 Agent 无法访问的固定 **Evaluator** 评分，从而确保性能提升归因于算法逻辑变更而非执行环境优化。实验结果显示，当前最强系统（Claude Opus 5）的平均得分仅为 0.250（基准为 0.1，最优为 1.0），表明 Agent 仅能关闭从现有算法到理论最优之间不到五分之一的差距，且超过一半的提交（53.6%）仅修改了运行配置（如学习率、Checkpoint 策略）而未触及 **Learning rule** 或 **Objective**。增加 **Reasoning effort** 主要提升了 Agent 尝试修改算法层的意愿（从 8% 升至 64%），而非直接提升修改质量，这揭示了当前 Agent 缺乏像人类科学家那样通过诊断 **Training dynamics**（如梯度范数、熵崩溃）来定位并修复机制缺陷的能力。少数成功大幅改进的案例（如将 One-shot pruning 转化为多阶段蒸馏流程）均依赖于 Agent 构建自定义的 **Proxy metric** 或加速评估工具，暗示未来 RSI 的关键瓶颈在于 Agent 自主构建可微分或高效反馈回路的能力，而非单纯的代码生成能力。\n\n### § 9 最脆弱的假设\n\n该论文最脆弱的假设是：**在 4 小时探索窗口内，Agent 能够通过有限的 **Proxy metric** 反馈，准确诊断出复杂训练算法中的机制性缺陷，并生成可工作的代码补丁。** 这一假设在实际中可能不成立，因为真实的 **Algorithmic design** 往往需要长周期的 **Training dynamics** 观察（如损失曲线的长期趋势、梯度分布的细微变化）以及多轮迭代验证，而 4 小时的预算迫使 Agent 依赖短视的代理指标，导致其难以区分“运气好的超参数调整”与“真正的算法改进”。论文中 141 个提交仅修改运行配置而未触及学习规则，且许多高分提交依赖于极端的 **Reasoning effort** 来“碰运气”尝试算法修改，这间接证明了该假设的脆弱性：Agent 并非真正理解了算法机制，而是通过暴力搜索代码空间来寻找能提升 Proxy 的变更。论文缺乏的证据是：如果给予 Agent 更长的探索时间或更丰富的 **Diagnostic tools**（如自动化的梯度分析器），其算法设计能力是否会显著提升？目前的结果可能低估了 Agent 的潜力，因为瓶颈可能在于评估带宽而非推理能力。若此假设不成立，即 Agent 无法在短窗口内有效诊断算法问题，那么 AI4AI-Bench 测得的低分将不能反映 RSI 的不可行性，而仅反映了当前评估协议对 **Long-horizon debugging** 能力的不兼容。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 **OWL (One-shot pruning)** 任务的一个简化版本，以验证“Agent 能否通过构建自定义评估工具来突破算法限制”这一核心发现。具体方案如下：使用 **OPT-6.7B** 模型和 **WikiText-2** 数据集，冻结原始仓库代码。不直接让 Agent 修改剪枝算法，而是要求 Agent 在 1 小时内编写一个 **Fast Proxy Evaluator**，该工具能在 10 秒内估算剪枝后的 **Perplexity**（例如通过仅计算前 10 层的激活值或采样少量数据）。然后，让 Agent 利用这个自定义 Proxy 进行 2 小时的 **Hyperparameter search** 或 **Algorithmic tweak**（如修改剪枝准则）。测量指标为：Agent 生成的最终模型在完整 WikiText-2 测试集上的 **Perplexity** 与原始仓库基线的对比。如果 Agent 在使用自定义 Proxy 后能显著降低 Perplexity（例如从 53.4 降至 40 以下），则支持论文中“构建可测量工具是算法改进关键”的 claim；如果 Agent 仍无法有效利用 Proxy 或生成的代码无法运行，则反驳了 Agent 具备自主构建反馈回路能力的观点。此实验无需复现完整的 10 任务基准，仅需聚焦于一个任务和一个核心机制（Proxy 构建），即可验证论文中最具洞察力的结论。", "research_value"
