grained rubric-based evaluation）解决了上述不足。它直接从市场验证的 AI 初创产品中提取工作流，确保任务具有真实的商业需求和用户价值；同时，通过专家构建的多维度、多重要性级别的评估量规，结合 Agent-as-a-Judge 技术，对交付物进行细粒度的自动化评估，从而更准确地衡量模型在真实专业工作流中的端到端执行能力。这种方法不仅弥补了现有基准在任务真实性和评估精细度上的缺口，还揭示了通用代理在复杂指令遵循和领域专业知识方面的具体失败模式，为理解当前 AI 代理的能力边界提供了更深入的洞察。", "core_insight": "### § 3 重建作者的思考路径\n\n在构建 StartupBench 之前，研究者首先观察到 LLM 评估领域存在一个显著的“现实脱节”现象。现有的 Agent 基准测试（如 GAIA, OSWorld, WebArena）虽然致力于模拟真实环境，但其任务来源主要依赖研究人员的直觉设计、公开的职业分类法或模拟工作空间。这种“研究者定义任务”的模式存在根本缺陷：它假设研究者能准确预判用户在真实商业场景中真正需要 AI 完成的工作流，但实际上，许多被学术界认为重要的任务可能在市场上并无实际需求，而真正具有高商业价值的垂直工作流（Vertical Workflows）往往未被纳入评估视野。\n\n其次，研究者注意到当前评估协议与真实交付物（Deliverables）之间的粒度不匹配。传统基准多关注中间步骤的正确性或最终答案的匹配，而真实世界中的专业工作（如金融报告、法律备忘录、医疗方案）要求生成结构复杂、格式严格且符合领域规范的多模态文件（DOCX, XLSX, PPTX 等）。现有的 Holistic Evaluation（整体评估）或简单的 LLM-as-a-Judge 难以捕捉这些细粒度的功能性、结构性和领域合规性要求，导致评估结果无法反映 Agent 是否真正产出了“可直接使用”的专业成果。\n\n此外，市场验证（Market Validation）提供了一个被忽视的信号源。AI-native 初创公司的产品之所以能获得融资和用户付费，是因为它们解决了真实存在的痛点。然而，学术界极少将这些经过市场验证的工作流转化为基准测试任务。研究者意识到，如果要从“回答问题”进化到“完成工作”，评估必须从“能力测试”转向“交付物验收”。因此，逻辑推导指向了一个新的构建范式：不再凭空设计任务，而是逆向工程那些已经被市场证明有价值的 AI 产品工作流，通过深度用户访谈还原真实场景，并由领域专家将其转化为可复现、可细粒度评估的基准任务。这一路径旨在填补“模型能力”与“商业可用性”之间的评估空白。\n\n### § 4 核心 Intuition\n\n当前通用 Agent 的主要瓶颈并非无法执行长程工作流，而是无法在复杂约束下可靠地生成符合专业标准的最终交付物（Deliverables）。现有基准因缺乏真实市场需求锚点和细粒度验收标准，高估了 Agent 的实际可用性。StartupBench 的核心直觉是：只有基于市场验证的真实工作流，并采用针对功能、结构、格式及领域合规性的细粒度 Rubric 进行独立评估，才能准确衡量 Agent 从“部分完成”到“专业可用”的真实差距。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nStartupBench 的核心方法并非构建一个新的模型，而是构建一个**基于市场验证（Market-Validated）的端到端（E2E）Agent 基准测试框架**。其核心逻辑是：从已经获得商业成功和真实用户采用的 AI 原生初创公司（AI-native startups）产品中提取工作流，将其转化为可评估的基准任务，并通过细粒度的评分标准（Rubrics）和 Agent-as-a-Judge 机制进行自动化评估。\n\n以下是构建该 Benchmark 的完整 Pipeline，结合一个具体的**“生物制药 CMO 董事会备忘录”**任务为例进行说明：\n\n#### 1. 任务来源与场景发现 (Task Sourcing \u0026 Scenario Discovery)\n*   **方法**：研究团队筛选融资超过 100 万美元且有真实付费用户的 AI 初创公司。通过深度访谈（Deep User Interviews）这些公司的核心用户，还原真实的使用场景、输入数据、预期产出和成功标准。\n*   **例子**：团队访谈了一家专注于生物医药合规的 AI 初创公司的用户。用户提到，他们经常需要向董事会解释为何仅凭中国单臂二期临床数据（China-only single-arm Phase II data）不足以获得 FDA 批准，并需要制定符合监管要求的全球多中心临床试验（MRCT）策略。\n\n#### 2. 专家任务构建 (Expert Construction)\n*   **方法**：招募领域专家（Domain Experts），将上述真实场景转化为标准化的基准任务实例。每个任务被定义为一个三元组 $T = (q, E, R)$：\n    *   $q$ (Query)：自然语言指令。\n    *   $E$ (Environment/Workspace)：包含所有必要输入文件（如临床数据、指南文档）的工作空间。\n    *   $R$ (Rubrics)：一组加权评分标准，涵盖功能、结构、格式和领域专业性。\n*   **例子**：\n    *   **输入 ($q$)**：“扮演生物制药 CMO，起草一份机密董事会备忘录。解释为何仅凭中国单臂二期数据和类器官/MPS 种族桥接数据不足以获得 FDA 批准，并提出符合监管要求的 MRCT 策略。”\n    *   **工作空间 ($E$)**：提供相关的 FDA 指导原则 PDF、现有的中国临床数据摘要 Excel、以及关于 MPS 技术局限性的科学文献。\n    *   **评分标准 ($R$)**：包含 20+ 个细粒度指标，例如“是否正确引用了 FDA 关于种族桥接的最新指南”、“MRCT 设计是否包含足够的非亚洲人群样本量”、“备忘录格式是否符合董事会汇报标准”等。\n\n#### 3. 质量控制与难度校准 (Quality Control \u0026 Calibration)\n*   **方法**：通过专家交叉验证（Expert Cross Validation）确保任务真实性和评分标准有效性。使用前沿模型进行试点运行（Pilot Executions），剔除那些模型能轻易完美完成（缺乏区分度）或指令模糊的任务。\n*   **例子**：如果试点发现模型总是能完美写出 MRCT 策略，但无法正确引用具体的 FDA 条款，专家会调整任务，增加对特定法规条款引用的强制性要求，以提高任务的区分度（Discriminability）。\n\n#### 4. 模型执行与评估 (Execution \u0026 Evaluation)\n*   **方法**：\n    *   **执行**：在统一的 Agent 框架（如 Nanobot）下，让 LLM 作为 Agent 访问工作空间 $E$，执行多步操作（搜索、推理、生成），最终产出交付物 $D$（如 .docx 文件）。\n    *   **评估 (Agent-as-a-Judge)**：不依赖单一的整体评分，而是将每个评分标准（Rubric Item）独立交给一个轻量级的 Judge Agent。Judge Agent 会检查原始文件 $D$ 和证据视图 $V(D)$，针对每个具体指标（如“是否提到了 MPS 的局限性”）给出二元判断（0/1）和理由。\n*   **例子**：\n    *   **执行**：Agent 读取 FDA 指南，分析中国数据，生成一份 .docx 备忘录。\n    *   **评估**：\n        *   Rubric 1：“是否解释了单臂试验的局限性？” -\u003E Judge Agent 检查文档，发现解释了，得分 1。\n        *   Rubric 2：“MRCT 策略是否包含至少 30% 的非亚洲受试者？” -\u003E Judge Agent 检查文档中的具体数字，发现未提及或比例不足，得分 0。\n    *   **最终得分**：根据各 Rubric 的权重（Core/Important/Auxiliary）加权聚合，得出最终任务分数。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过**。\n\nStartupBench 是一篇关于基准测试构建和实证评估的论文，其核心贡献在于数据构建方法论、评估框架设计以及实验分析，而非提出新的数学模型或算法推导。文中涉及的公式仅为评分聚合公式（加权平均），属于标准的统计计算，不涉及复杂的理论推导。\n\n---\n\n### § 7 实验设计与结论\n\n#### 1. 验证 Benchmark 的有效性与可靠性\n*   **提出了什么问题**：自动化的 Agent-as-a-Judge 评估框架是否可靠？它是否与人类专家的评价一致？\n*   **设计了什么实验验证这个问题**：\n    *   **人工对比实验**：随机抽取两个代表性模型的输出，邀请领域专家使用相同的 Rubrics 进行独立评分。\n    *   **消融实验**：对比“独立 Rubric 评估”（每个指标由独立 Judge 评估）与“整体评估”（单个 Judge 一次性评估所有指标）的效果。\n*   **问题的答案是什么**：\n    *   自动化评估与专家判断在 Rubric 级别的一致性高达 **92.78%**，在任务成功/失败判定上的一致性为 **92.84%**，证明了评估框架的高可靠性。\n    *   独立 Rubric 评估比整体评估更稳定，且与专家一致性更高（整体评估仅 83%），因为独立评估避免了长上下文推理中的幻觉和格式错误。\n\n#### 2. 评估当前通用 Agent 的能力边界\n*   **提出了什么问题**：当前的最强通用 LLM/Agent 能否可靠地完成这些市场验证的真实工作流？\n*   **设计了什么实验验证这个问题**：\n    *   在统一的 Agent 框架下，测试 9 个代表性模型（包括 GPT-5.6-sol, Kimi-K3 等）在 StartupBench 上的表现。\n    *   计算平均得分（Average Score）和成功率（Success Rate, 分数≥90）。\n*   **问题的答案是什么**：\n    *   即使是最强的模型，成功率也仅为 **~30%**。\n    *   存在显著的“分数-成功率差距”：模型平均得分可能在 70% 左右，但很少能完全满足所有专业标准。这表明模型能完成大部分工作，但在关键细节上经常失败，导致交付物不可直接用。\n\n#### 3. 分析失败模式与领域差异\n*   **提出了什么问题**：模型在哪里失败？不同专业领域（如金融、医疗、法律）的难度是否有差异？\n*   **设计了什么实验验证这个问题**：\n    *   **维度分析**：将失败原因归类到 6 个 Rubric 维度（如结构、计算精度、领域合规性等）。\n    *   **重要性层级分析**：分析模型在 Core（核心）、Important（重要）、Auxiliary（辅助）指标上的满足率。\n    *   **领域对比**：比较 6 个主要领域（Medical, Finance, Legal, Business, STEM, Education）的表现。\n*   **问题的答案是什么**：\n    *   **主要瓶颈**：**Domain-Specific Compliance**（领域特定合规性）和 **Calculation Precision**（计算精度）是得分最低的维度。模型擅长结构和格式，但缺乏专业深度。\n    *   **核心 vs 辅助**：模型在辅助指标上的满足率（68.67%）高于核心指标（63.45%），说明模型倾向于完成表面工作，而忽略决定任务成败的核心约束。\n    *   **领域差异**：**Business** 领域最容易，**Finance** 和 **STEM** 最难。没有单一模型在所有领域都表现最好，表明通用 Agent 仍存在领域依赖性。\n\n#### 4. 通用 Agent vs 专用 Agent\n*   **提出了什么问题**：通用 Agent 的失败是因为框架限制，还是因为缺乏领域专用优化？\n*   **设计了什么实验验证这个问题**：\n    *   **框架鲁棒性测试**：更换不同的通用 Agent 框架（Hermes, Claude Code, Nanobot），观察性能变化。\n    *   **专用 Agent 对比**：将通用 Agent 的表现与源自 StartupBench 任务的原始专用初创公司 Agent 进行对比。\n*   **问题的答案是什么**：\n    *   更换通用框架对性能影响极小（平均差异 \u003C 2 分），说明瓶颈在于模型本身而非框架。\n    *   **专用 Agent 显著优于通用 Agent**：专用 Agent 的平均得分（83.50）和成功率（39.18%）远高于通用 Agent（即使取最佳尝试的 Oracle 设置，通用 Agent 仍落后约 11-12 分）。这证明当前通用模型在复杂指令遵循、领域知识和长程工作流执行上，仍无法替代经过领域优化的专用系统。", "additional_insights": "### § 8 Take-aways\n\nStartupBench 揭示了当前通用 Agent 在“完成工作”与“产出可用交付物”之间存在巨大鸿沟，最强模型的成功率（Success Rate）仅为 30% 左右，远低于其平均分所暗示的能力水平。这种差距主要源于模型在复杂指令遵循（Complex Instruction Following）和领域特定合规性（Domain-Specific Compliance）上的系统性失败，而非基础推理能力的缺失。评估范式从单一的整体评分转向基于细粒度 Rubric 的 Agent-as-a-Judge 机制，显著提高了对多格式、长周期工作流交付物的评估信度与专家一致性。通用 Agent 框架（如 Nanobot, Hermes, Claude Code）对最终性能影响微弱，表明性能瓶颈主要在于底层 Foundation Model 的能力而非 Agent 编排架构。尽管通用模型在结构完整性和信息整合上表现良好，但在核心业务逻辑、数值精确性及专业领域约束（如医疗、金融法规）上仍频繁出错，导致交付物无法直接用于生产环境。专用垂直 Agent（Specialized Agents）在成功率上显著优于通用 Agent，证明针对特定工作流的领域优化和工具编排目前仍是实现可靠 E2E 任务完成的关键。\n\n### § 9 最脆弱的假设\n\n该研究最核心的假设是：**基于市场验证的 AI 初创产品工作流（Market-Validated Workflows）能够准确代表真实世界中用户对 AI Agent 的“高价值、高难度”需求，且这些工作流可以被标准化为可复现的 Benchmark 任务而不丢失其核心复杂性。**\n\n如果这一假设不成立，即这些被选中的工作流实际上是“伪需求”、过于简化、或者其复杂性主要依赖于人类专家的隐性知识（Tacit Knowledge）而非显式指令，那么 StartupBench 就无法有效衡量 Agent 处理真实复杂任务的能力，其低成功率可能仅反映任务设计的偏差而非模型能力的上限。\n\n**潜在失效原因：**\n1.  **幸存者偏差与过度工程化：** 初创公司为了商业化，往往将复杂流程拆解为多个简单步骤或依赖大量人工审核（Human-in-the-loop），Benchmark 可能捕捉到了这些被“降维”后的流程，而非端到端的真实挑战。\n2.  **隐性知识缺失：** 许多专业工作（如法律、医疗）的成功依赖于上下文背景、行业惯例或未书面化的规则，这些难以通过有限的 Workspace 和 Prompt 完全传递，导致任务在 Benchmark 中变得“不可解”或“定义模糊”，而非模型能力不足。\n3.  **评估标准的主观性：** 尽管使用了细粒度 Rubric，但“专业可用性”本身具有高度主观性，若 Rubric 未能覆盖所有关键领域约束，评估结果可能无法反映真实业务中的接受度。\n\n**论文提供的证据与缺失：**\n论文通过“用户访谈”和“专家交叉验证”来增强任务真实性，并展示了自动评估与专家评估的高一致性（92.78%），这在一定程度上支持了假设。然而，论文缺乏对“未被选中的工作流”或“人类专家完成同一任务所需时间与错误率”的对比基线，无法证明这些任务在真实场景中确实具有同等难度或价值。此外，论文未深入探讨为何某些工作流在初创产品中成功，却在 Benchmark 中失败，这可能是因为初创产品使用了特定的领域微调模型或专有工具，而这些在通用 Agent 设置中不可用，从而混淆了“模型能力”与“系统架构”的贡献。\n\n### § 10 最小复现实验\n\n**目标：** 验证“细粒度 Rubric 评估”是否比“整体式 LLM-as-a-Judge”更能准确捕捉 Agent 在复杂工作流中的细微失败模式，特别是“部分合规”（Partial Compliance）现象。\n\n**数据：** 从 StartupBench 公开数据中选取 10 个具有代表性的任务（涵盖 Finance, Legal, STEM 等领域），每个任务选取 3 个不同模型（如 GPT-5.5, Kimi-K3, DeepSeek-V4-Pro）的失败案例输出。\n\n**实现：**\n1.  **构建两种评估器：**\n    *   **Evaluator A (Holistic):** 使用一个强大的 LLM（如 GPT-5.5），一次性输入任务描述、Workspace 和 Agent 输出，要求给出一个 0-100 的综合分数和通过/失败判断。\n    *   **Evaluator B (Rubric-wise):** 按照论文方法，将任务拆解为 20+ 个细粒度 Rubric，每个 Rubric 由独立的 Agent Judge 会话进行评估，最后加权聚合得分。\n2.  **人工标注：** 邀请 2 名相关领域专家对同一组输出进行独立评分，作为 Ground Truth。\n\n**测量：**\n1.  **一致性指标：** 计算 Evaluator A 和 Evaluator B 与专家评分的 Spearman 相关系数和准确率（Accuracy）。\n2.  **失败模式识别率：** 统计两种评估器在识别“核心 Rubric 失败但辅助 Rubric 通过”的案例上的能力。\n\n**结果解释：**\n*   **支持 Claim：** 如果 Evaluator B 与专家评分的一致性显著高于 Evaluator A（如论文所述的 92% vs 83%），且 Evaluator B 能更频繁地识别出那些“看起来完整但关键细节错误”的失败案例，则证明细粒度评估对于复杂工作流是必要的。\n*   **反驳 Claim：** 如果两者一致性无显著差异，或 Evaluator A 在计算效率远高于 Evaluator B 的情况下能达到同等精度，则说明 StartupBench 复杂的评估框架可能过度工程化，通用 LLM 的整体判断能力已被低估。", "research_value": "### § 11 最强反例设计\n\n若要挑战 StartupBench 的核心主张，最有力的攻击并非质疑其评估的准确性，而是攻击其**任务来源的生态效度（Ecological Validity）**与**“市场验证”定义的误导性**。我会设计一个名为“**Human-in-the-Loop Illusion**”的反例实验，旨在证明 StartupBench 所提取的“端到端工作流”在真实商业场景中根本不存在，或者其成功高度依赖于被 Benchmark 剥离的隐性人工干预。\n\n具体而言，我会选取 StartupBench 中得分最低的“高难度”任务（如生物制药合规或复杂金融建模），并追踪这些任务在原始初创公司中的实际执行链路。反例假设是：这些初创公司之所以能“市场验证”，并非因为 AI 能独立完成 E2E 工作流，而是因为它们采用了**“AI 辅助 + 专家审核”**的混合模式，且审核环节占据了 80% 以上的工作量。StartupBench 通过专家访谈提取任务时，可能无意中忽略了那些“必须人工修正”的中间步骤，或者将“专家最终定稿”错误地归因为“AI 生成的交付物”。\n\n为了验证这一点，我将构建一个对比实验：\n1.  **真实世界基线（Real-World Baseline）**：与参与访谈的初创公司合作，获取其生产环境中 AI 生成的原始输出（Raw AI Output）与最终交付给客户的产品（Final Deliverable）之间的差异日志。计算“人工修正率”（Human Revision Rate），即专家需要修改多少比例的内容才能使 AI 输出可用。\n2.  **Benchmark 模拟**：在 StartupBench 中，如果模型生成的交付物需要超过 20% 的人工修正才能通过 Rubric 评估，则该任务在真实世界中应被视为“失败”或“半自动”，而非 Benchmark 所暗示的“端到端失败”。\n3.  **替代解释**：如果数据显示，初创公司的成功依赖于高频的人工干预（High Human-in-the-Loop Frequency），那么 StartupBench 的低成功率（30%）并不能证明通用 Agent 无法完成工作，而是证明**当前 Benchmark 错误地将“半自动工作流”定义为“全自动 E2E 任务”**。这揭示了 Benchmark 的一个根本性缺陷：它评估的是“AI 能否替代人类”，而市场验证的产品往往只是“AI 如何辅助人类”。因此，StartupBench 的低分可能反映的是任务定义的偏差（即要求 AI 做它本就不该独立做的事），而非模型能力的绝对上限。此外，我会指出，初创公司可能使用了**专有微调模型（Proprietary Fine-tuned Models）**或**领域特定工具链（Domain-Specific Toolchains）**，这些在通用 Agent 框架中不可用，导致 Benchmark 不公平地惩罚了通用模型，而高估了“领域专用性”的必要性，从而误导了研究方向。\n\n### § 12 Follow-up Research Idea\n\n基于 StartupBench 揭示的“通用 Agent 在复杂指令遵循和领域合规性上的系统性失败”，以及其未能区分“全自动”与“人机协作”界限的局限，我提出一个全新的研究方向：**“Adaptive Human-AI Orchestration for E2E Workflows”（面向端到端工作流的自适应人机编排）**。\n\n**(a) 驱动局限与未满足需求：**\nStartupBench 的核心局限在于其二元化的成功/失败判定（Success Rate），这隐含了一个过时的假设：AI 要么完美完成 E2E 任务，要么完全失败。然而，真实商业价值往往存在于**“部分自动化”**中。当前研究缺乏对“何时介入人类”、“介入多少”以及“如何动态分配任务子图”的量化评估。我们需要从“评估 AI 能否独立完成任务”转向“评估 AI 能否在最小化人类干预的前提下，可靠地推进工作流”。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴**控制理论（Control Theory）**中的“监督控制（Supervisory Control）”和**人机交互（HCI）**中的“信任校准（Trust Calibration）”概念。引入**动态任务分解图（Dynamic Task Decomposition Graph）**，将 E2E 工作流建模为有向无环图（DAG），其中每个节点代表一个子任务，边代表依赖关系。借鉴**强化学习（Reinforcement Learning）**中的“选项框架（Options Framework）”，将人类干预视为一种高阶动作（High-level Action），用于在不确定性高或风险大的节点上接管控制权。\n\n**(c) 第一个实验设计：**\n构建一个名为 **“OrchestratorBench”** 的新基准，其核心指标不再是单一的 Success Rate，而是 **“Human Effort-Adjusted Success Rate (HEASR)”**。\n1.  **任务重构**：选取 StartupBench 中的任务，但允许 Agent 在任意节点请求人类专家介入（Human Request）。\n2.  **评估协议**：\n    *   **自动化率（Automation Rate）**：Agent 独立完成的节点比例。\n    *   **干预成本（Intervention Cost）**：人类专家修正每个请求所需的时间或认知负荷。\n    *   **最终质量（Final Quality）**：经过人机协作后的交付物质量。\n3.  **实验对比**：比较“纯通用 Agent”、“纯人类专家”和“自适应编排 Agent（Adaptive Orchestrator Agent）”的表现。自适应编排 Agent 被训练为在置信度低或合规性风险高的节点主动请求人类帮助，而在低风险节点自主执行。\n4.  **预期发现**：证明通过智能的人机编排，即使通用 Agent 的独立成功率仅为 30%，其**HEASR** 可以接近 90%，且总耗时远低于纯人工。这将揭示，下一代 Agent 系统的核心竞争力不在于“全能”，而在于**“知道何时求助”**（Knowing When to Ask for Help），从而打开“人机协同效率优化”这一全新的研究范式，区别于当前单纯追求“全自动”的竞赛。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "{\n  \"authors\": [\n    {\"name\": \"Liya Zhu\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Xin Ma\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Tao Liu\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Haodong Wang\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Ge Zhang\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Jingzhe Ding\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Qingshui Gu\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Yongjie Zhong\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Jinxiang Meng\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Yuan Gao\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Yunqiu Zhou\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Hao Zhu\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Jifeng He\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Yongzhi Liao\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Xinyi Zhang\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Chaoxin Li\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Yi Zhu\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Xi Lin\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Duju Zeng\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Xiang Gao\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Wen Zhang\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Yunyang Wang\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Duo Wang\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Huan Zhou\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Zuo Wang\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Jin Chen\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Kaiyuan Zhang\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Chuqian Yu\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Tianhao Yu\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Longxiang Liu\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Jianbo Xue\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Huimin Che\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Jiahao Wang\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Yujia Qin\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Jiaheng Liu\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Shen Yan\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Xiaolong Chang\", \"affiliations\": [], \"markers\": []},\n    {\"name\": \"Wenhao Huang\", \"affiliations\": [], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"ByteDance Seed\"},\n    {\"id\": 2, \"name\": \"Nanjing University\"},\n    {\"id\": 3, \"name\": \"M-A-P\"},\n    {\"id\": 4, \"name\": \"TokenWave.AI\"}\n  ],\n  \"footnotes\": []\n}", "summary_translation": "大型语言模型（LLMs）和智能体（agents）的最新进展显著提升了人工智能系统执行复杂任务的能力。然而，现有的基准测试主要依赖研究人员选定的任务，因此尚不确定这种进步是否延伸至真实世界用户实际要求人工智能系统完成的工作。我们引入了 **StartupBench**，这是一个基于经过市场验证的人工智能初创公司产品的端到端（E2E）智能体基准测试。我们没有基于对有用智能体能力的预设假设来定义任务，而是系统地研究了具有明确采用率的人工智能产品及其产品工作流和用户，以识别在多个专业领域中已确立实际需求的世界真实任务。我们将这些工作流转化为完整的以交付为导向的任务，并使用捕捉其复杂要求的细粒度评分标准进行评估。在统一智能体框架下评估的代表性模型中，即使是最强的模型也仅成功完成了约 30% 的 StartupBench 任务，尽管在许多任务上取得了实质性的部分进展。进一步的分析确定，复杂指令遵循和特定领域专业知识是主要失败来源。我们的结果表明，许多经过市场验证的工作流仍然超出了当前通用智能体的可靠能力范围，从而将 StartupBench 确立为衡量向真实世界用户任务端到端完成进展的经验性指标。"}, {"title": "ASI-Bench: At the Dawn of Artificial Superintelligence", "arxiv_id": "2608.17271", "authors": "Junwei Zhou, Zhen Sun, Binyu Li, Jiangyu Zhou, Yuexi Pan, Hengyu Wang, Honghe Ren, Xiaohan Jia, Xueyang Zhou, Xiaoyu Cao, Yongchao Chen, Yuanning Feng, Junhao Wu, Cheng Zhang, Sijia Chen, Haoyu Xue, Chengsong You, Huan Wang, Koutian Wu, Peigan Gao, Jiakun Wu, Wenzhe Li, Ergan Shang, Qingyuan Zheng, Jingjing Zhou, Ruixuan Jia, Yan Xu, Hongrui Zhang, Xiao-Han Ma, Zhengxiang Cheng, Yuexing Hao, Liting Mai, Xianglin Ji, Wenjun Zhang, Zhuofan Chen, Yixiao Huang, Chi Wang, Wenyue Hua, Yilun Hao, Yuantao Zhai, Ziyan Zhao, Jingyan Xie", "summary": "Artificial superintelligence (ASI) requires AI to move beyond mastering existing knowledge toward exploring the unknown, creating new knowledge, and turning new ideas into verifiable results. However, the capabilities of today's AI systems are still largely built on learning, compressing, and applying existing human knowledge. Accordingly, existing benchmarks primarily test whether AI can produce correct answers based on learned knowledge, or whether it can complete tasks under extensive human guidance. We therefore introduce ASI-Bench, the first benchmark to jointly evaluate AI systems' capabilities of innovative exploration and autonomous scientific execution across general research domains, and the first to progressively withdraw human methodological guidance within the same research project to test how far AI can proceed on its own. Built by over 40 experts with the cost of 31,000+ human hours, ASI-Bench contains 60 project-level research tasks across 11 scientific domains and progressively reduces methodological guidance to test whether AI can independently select methods, conduct research, and produce verifiable results. All tasks undergo expert review, AI-assisted auditing, sandbox execution, and scorer validation. Across 18 state-of-the-art agent--model configurations, the average score drops from 50.91 with full methodological guidance to 29.10 with only the method specified and 26.62 when agents must determine the method themselves. This sharp decline shows that current systems remain heavily dependent on human guidance and are still far from autonomously conducting end-to-end, project-level scientific research. ASI-Bench is open to the world. We invite researchers and builders everywhere to contribute new tasks, challenge the limits of today's AI, and help accelerate humanity's collective path toward artificial superintelligence at https://asibench.apexin.ai/submit.", "category": "cs.AI", "cluster": "Benchmarks \u0026 Evaluation Frameworks", "tags": ["cs.AI"], "filter_reason": "该论文符合筛选标准，主要依据如下：\n\n1.  核心研究对象明确为 LLM Agents：论文标题和摘要明确指出评估对象是 \"agent-model configurations\"（智能体-模型配置），且任务涉及 \"autonomous scientific execution\"（自主科学执行）和 \"independently select methods\"（独立选择方法）。这属于典型的 Agentic AI 场景，特别是长周期决策（Long-Horizon Decision-Making）和工具使用/规划能力。\n2.  符合“评估基准”保留规则：根据筛选标准第一步中的保留规则：“如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准... 只要结论直接帮助理解或改进智能体能力，也应保留”。ASI-Bench 旨在评估 AI 在缺乏人类指导下的自主探索和执行能力，其核心贡献在于揭示当前智能体在“自主性”和“创新探索”方面的局限性（如分数随指导减少而大幅下降），这直接服务于对智能体能力的理解和改进。\n3.  涉及智能体核心能力：论文关注的“自主科学研究”、“方法选择”和“可验证结果生成”直接对应智能体的规划（Planning）、工具使用（Tool Use）和自我反思/执行（Self-Correction/Execution）等核心能力，而非简单的知识检索或基础推理。\n4.  排除项不适用：虽然涉及科学领域，但其核心不是应用 LLM 解决特定科学问题（如预测蛋白质结构），而是评估智能体在科学发现过程中的自主代理能力（Agentic capability）。它不涉及被排除的安全、对齐、图神经网络或多智能体拓扑编排等无关主题。\n\n综上，该论文是关于 LLM 智能体自主能力和演化潜力的重要评估基准研究，符合研究范围。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：在人类方法论指导（methodological guidance）逐步撤出的情况下，当前 AI 系统能否独立探索未知问题、制定解决方案并执行端到端的项目级科学研究？具体而言，论文旨在量化 AI 从“执行既定程序”到“自主决定研究路径”的能力差距，特别是评估其在缺乏详细步骤指引时，能否独立完成方法选择、实验设计及结果验证。\n\n这一问题的重要性在于，它触及了通往人工超级智能（Artificial Super Intelligence, ASI）的关键瓶颈。现有的 AI 系统主要依赖于学习、压缩和应用人类已有的知识，其能力边界往往受限于训练数据中的已知模式。然而，真正的科学创新要求 AI 能够超越现有知识，探索未知领域并创造新知识。如果 AI 仅能在人类提供完整方法论（如具体方程、求解器步骤）的情况下表现良好，而在仅给定研究目标或完全自主的情况下性能急剧下降，则表明其尚未具备真正的科学自主性（scientific autonomy）。解决这一问题不仅能揭示当前大语言模型（LLM）和智能体（Agent）在复杂推理与执行上的真实局限，还能为构建具备通用智能（general intelligence）和创新能力的下一代 AI 系统提供明确的评估标准和改进方向。通过 ASI-Bench，研究者可以精确测量 AI 在“知识应用”与“自主发现”之间的鸿沟，从而加速从辅助工具向自主科学伙伴的转变。\n\n### § 2 前人工作与不足\n\n尽管已有大量基准测试（benchmarks）用于评估 AI 的科学能力，但它们均未能全面解决上述问题，主要存在以下不足：\n\n1.  **侧重知识检索而非自主执行**：如 Humanity’s Last Exam (HLE) [5] 和 GPQA [21] 等基准主要测试前沿学科知识，评估的是 AI 对已知事实的回忆能力，而非其在开放性问题中独立构建解决方案的能力。SciCode [13] 虽然涉及科学编程，但通常针对特定代码生成任务，缺乏对完整研究流程的考察。\n2.  **侧重特定环节而非端到端研究**：ScienceAgentBench [8] 关注数据驱动的科学分析，DiscoveryBench [12] 聚焦假设生成，MLE-Bench [10] 评估机器学习工程，RE-Bench [11] 测试 AI 研发能力，PaperBench [9] 则侧重于研究复现。这些基准虽然覆盖了科学研究的不同组件，但往往将任务分解为孤立环节，或在任务中隐含了固定的解决路径，未能评估 AI 在跨领域、长周期项目中整合各环节并自主决策的能力。\n3.  **缺乏方法论指导的梯度评估**：现有基准通常提供固定的任务规范（fixed specification），即 AI 只需完成指定工作流即可。这种设计无法区分 AI 是真正理解了科学逻辑并自主构建了工作流，还是仅仅在执行人类预设的方法。例如，ScienceAgentBench 虽然比较了有无专家知识的情况，但其二元设计无法细致区分“方法选择”与“程序执行”的难度差异。ProjectionBench [33] 虽然逐步揭示信息，但侧重于假设生成而非可执行的项目级工作流。\n\n因此，现有工作的核心不足在于缺乏一个能够联合评估跨领域通用性（cross-domain generality）、方法自主性（method autonomy）和端到端执行（end-to-end execution）的基准，且无法通过逐步撤出人类指导来量化 AI 对方法论依赖的程度。ASI-Bench 通过引入 B1-B4 的指导梯度（guidance gradient），填补了这一评测缺口，能够精确识别 AI 在“方法操作化”（method operationalization）而非仅仅是“方法选择”上的瓶颈。", "core_insight": "### § 3 重建作者的思考路径\n\n在 ASI-Bench 出现之前，AI 在科学领域的应用评估主要存在两个维度的割裂：一是“知识检索”与“自主执行”的割裂，二是“单点任务”与“端到端研究”的割裂。早期的 Benchmark 如 GPQA 或 Humanity’s Last Exam 主要测试模型对既定科学知识的掌握程度，属于静态的 QA 范式；而 SWE-bench 或 Terminal-Bench 虽然引入了 Agent 执行能力，但任务目标和方法路径通常由人类预先定义，Agent 仅负责“按图索骥”地执行代码或调试错误。与此同时，针对 AI for Science 的专项 Benchmark（如 ScienceAgentBench, DiscoveryBench）虽然涉及数据分析或假设生成，但往往局限于特定领域（如化学、生物），且缺乏对“方法论自主性”的精细度量。\n\n研究者观察到，现有的 Agent 系统在拥有完整方法论指导（Methodological Guidance）时表现尚可，但一旦需要独立决定“用什么方法”或“如何构建工作流”，性能便断崖式下跌。然而，当时的评估体系无法量化这种“依赖程度”，因为大多数 Benchmark 要么给全方法，要么只给问题，缺乏中间的梯度。此外，现有评估难以区分模型是真正理解了科学逻辑，还是仅仅通过检索或暴力试错（Brute-force）找到了捷径。因此，亟需一个能够剥离人类方法论干预、覆盖多领域、且具备严格防作弊机制（如 Sandbox 执行和人工审计）的基准，以真实反映 AI 从“知识应用者”向“知识创造者”过渡的能力缺口。基于此，作者设计了 ASI-Bench，通过 B1-B4 的梯度引导机制，专门测试 AI 在缺乏人类方法论指引下的自主科研能力。\n\n### § 4 核心 Intuition\n\nASI-Bench 的核心直觉在于：真正的科学智能（Scientific Intelligence）不应仅体现为对已知答案的检索或对既定流程的执行，而应体现为在开放性问题中独立构建方法论并验证结果的能力。通过在同一科研任务中逐步撤除人类的方法论指导（从完整步骤到仅给目标），该基准能够精准量化 AI 对“人类思维拐杖”的依赖程度，从而揭示当前模型在“方法操作化”（Method Operationalization）而非单纯“方法选择”上的根本瓶颈。这种设计将评估焦点从“能否做对”转移到了“能否独立决定怎么做”，为衡量迈向人工超级智能（ASI）所需的自主探索能力提供了可量化的标尺。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nASI-Bench 并非提出一个新的 AI 模型或算法，而是构建了一个用于评估 AI 系统**自主科学研究能力（Autonomous Scientific Research）**的基准测试框架。其核心方法论在于通过**渐进式撤回人类方法论指导（Progressive Withdrawal of Human Methodological Guidance）**，来量化 AI 从“执行者”向“探索者”转变的能力边界。\n\n以下是 ASI-Bench 的完整评估 Pipeline，以附录 D 中的 **\"2D Anisotropic Stiff Dynamics\"（二维各向异性刚性动力学）** 任务为例进行说明：\n\n#### 1. 任务构建与标准化 (Task Construction \u0026 Standardization)\n*   **输入**：领域专家定义一个真实的科学问题。在本例中，问题是基于观测数据预测非线性动力学系统的未来状态。\n*   **处理**：\n    *   确定固定的**科学目标（Scientific Objective）**：预测目标时刻的场分布、提取物理诊断量。\n    *   确定固定的**输入数据（Input Data）**：`system_info.json`（系统参数）、`field_evolution.npy`（观测到的时空场快照）、`initial_condition.npy`（初始条件）。\n    *   确定固定的**输出工件（Required Artifacts）**：预测场、空间谱、物理诊断、可视化图表、可执行代码。\n    *   确定固定的**评分标准（Scoring Criteria）**：基于参考解（Reference Solution）计算误差和有效性。\n*   **输出**：一个标准化的任务包，包含数据、参考生成脚本（`generate_gt.py`）和评估配置。\n\n#### 2. 构建信息梯度 (Constructing the B1-B4 Information Gradient)\n这是 ASI-Bench 的核心创新。针对同一个科学目标，构建四个不同信息密度的 Prompt 变体，以测试不同级别的自主性：\n\n*   **B1 (Full Guidance - 完全指导)**：\n    *   **输入 Prompt**：提供完整的控制方程（Kuramoto–Sivashinsky 型方程）、数值离散化方法（2D Fourier pseudospectral method）、时间积分算法（ETDRK4）及具体系数。\n    *   **AI 角色**：代码实现者。AI 只需将给定的数学公式转化为可执行代码并运行。\n*   **B2 (Method Specified - 指定方法)**：\n    *   **输入 Prompt**：仅提供方法类别（如“基于谱离散化的刚性系统求解器”）和物理背景（如“四阶非线性 PDE”、“刚性”），不提供具体方程和求解步骤。\n    *   **AI 角色**：方法翻译者。AI 需根据方法名称自行推导或查找具体的数值实现细节。\n*   **B3 (Autonomous Selection - 自主探索)**：\n    *   **输入 Prompt**：仅提供科学目标、输入数据和约束条件。**不透露**任何关于方程形式、数值方法或求解策略的信息。\n    *   **AI 角色**：独立研究员。AI 需通过数据分析识别潜在模型，选择合适的方法，实现求解器，并验证结果。\n*   **B4 (Robustness with Distractors - 抗干扰测试)**：\n    *   **输入 Prompt**：在 B3 的基础上，加入大量与任务无关但看似合理的干扰信息（如其他 PDE 模型的介绍、无关的市场新闻、错误的初步假设）。\n    *   **AI 角色**：抗干扰研究员。AI 需在噪音中保持研究方向的稳定性。\n\n#### 3. 沙箱执行与评估 (Sandbox Execution \u0026 Evaluation)\n*   **输入**：AI Agent（如 Codex, Claude Code 等）接收上述 B1-B4 的 Prompt 及数据。\n*   **处理**：\n    *   AI 在隔离的 **Sandbox Environment** 中进行多轮交互（Reasoning, Coding, Executing, Debugging）。\n    *   记录 Token 消耗、执行时间、代码轨迹。\n    *   生成最终的科学工件（代码、结果文件）。\n*   **输出**：\n    *   **科学分数（Scientific Score）**：通过预定义的评分代码（Scorer）对比 AI 输出与参考解（Ground Truth）的误差。\n    *   **诊断指标（Diagnostic Metrics）**：计算 B2-B1, B3-B1 等分数差值，量化对指导的依赖程度。\n\n#### 4. 结果分析 (Result Analysis)\n*   **输入**：所有配置下的分数和成本数据。\n*   **处理**：统计分析不同模型、不同 Harness（Agent 框架）在 B1-B4 上的表现差异。\n*   **输出**：揭示当前 AI 系统在“方法选择”与“方法实现”上的能力瓶颈，以及计算成本与性能之间的权衡关系。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过。**\n\nASI-Bench 是一篇关于**基准测试设计（Benchmark Design）**和**评估方法论（Evaluation Methodology）**的论文，而非提出新的数学理论或算法模型。因此，文中没有核心的数学推导过程。\n\n文中涉及的数学内容（如附录 D 中的 Kuramoto–Sivashinsky 方程、ETDRK4 求解器公式）是作为**测试任务的具体实例**出现的，用于展示 B1-B4 信息梯度的构建方式，而非论文本身的理论贡献。这些公式代表了 AI 需要处理或推导的科学知识，而非 ASI-Bench 框架本身的数学基础。\n\n---\n\n### § 7 实验设计与结论\n\n**提出了什么问题：**\n当前 AI 系统是否具备超越“知识应用”和“流程执行”的**自主科学研究能力（Autonomous Scientific Research Capability）**？具体来说，当人类逐步撤回方法论指导（从提供完整步骤到仅提供目标）时，AI 的性能会如何变化？其瓶颈在于“方法选择”还是“方法实现”？\n\n**设计了什么实验验证这个问题：**\n1.  **构建多维度基准**：设计了包含 60 个跨学科（11 个领域）项目级研究任务的 ASI-Bench，每个任务都经过严格的专家审查和沙箱验证。\n2.  **设置信息梯度实验**：对每个任务设置 B1（全指导）、B2（仅方法名）、B3（仅目标）、B4（目标+干扰）四种条件，保持科学目标和评估标准不变，仅改变 Prompt 中的方法论信息量。\n3.  **大规模模型评估**：在 18 种最先进的 Agent × Model 配置（如 GPT-5.6, Claude Opus 5, Kimi K3 等）上运行所有任务，记录科学分数、Token 消耗和执行时间。\n4.  **对比分析**：比较不同模型在 B1-B4 上的分数落差，以及不同 Harness（Agent 框架）对同一 Backbone Model 性能的影响。\n\n**问题的答案是什么：**\n1.  **自主性严重受限**：当前 AI 系统远未达到可靠的自主科学发现水平。在 B3（需自主确定方法）条件下，平均得分仅为 26.62，远低于 B1（50.91）。即使是最强的配置（Codex + GPT-5.6 Sol ultra），B3 得分也仅为 51.60。\n2.  **瓶颈在于“方法操作化”而非“方法选择”**：从 B1 到 B2（移除详细步骤，保留方法名），分数大幅下降 21.82 分；而从 B2 到 B3（移除方法名，需自主选方法），分数仅下降 2.48 分。这表明，当前 AI 的主要困难不在于“知道用什么方法”，而在于“如何将一个方法名称转化为可执行的完整研究流程”。\n3.  **干扰影响有限**：B4（含干扰信息）与 B3 的分数几乎无差异，说明在缺乏核心方法论指导的情况下，额外的无关信息对 AI 的负面影响远小于缺失步骤指导的影响。\n4.  **Harness 至关重要**：相同的 Backbone Model 搭配不同的 Agent Harness（如 Claude Code vs. Kimi Code）会产生显著的性能差异，说明自主科研能力是模型与系统架构共同作用的结果，不能仅归因于模型本身。\n5.  **成本与性能非线性**：更高的计算成本（Token/时间）并不直接保证更好的科学性能。B2 由于需要 AI 自行补全缺失的步骤，反而成为计算成本最高的设置，但性能却低于 B1。", "additional_insights": "### § 8 Take-aways\n\nASI-Bench 是首个通过渐进式撤回人类方法论指导（B1 至 B4 梯度）来评估 AI 系统自主科学研究能力的基准，其核心创新在于区分了“执行既定程序”与“独立构建研究流程”的能力差异。实验结果显示，当前最先进的 Agent-Model 配置在完全指导（B1）下的平均得分为 50.91，而在仅指定方法（B2）时骤降至 29.10，在需自主确定方法（B3）时进一步降至 26.62，表明当前 AI 系统严重依赖详细的步骤指导而非单纯的方法选择。数据揭示了一个关键瓶颈：从 B1 到 B2 的巨大性能落差（-21.82 分）远大于从 B2 到 B3 的落差（-2.48 分），说明主要障碍在于将抽象方法转化为可执行工作流的“方法操作化”（method operationalization），而非方法识别本身。计算成本分析显示，B2 设置因缺乏具体步骤但受限于方法名称，导致 Agent 需进行大量无效探索，其 Token 消耗和运行时间反而高于完全指导的 B1 和完全自主的 B3，证实了不完整指导可能引入额外的计算开销。此外，Harness（如 Codex, Claude Code）对模型表现的影响显著，同一 Backbone Model 在不同 Harness 下得分差异巨大，表明自主科研能力是模型与执行环境交互的涌现属性，而非模型本身的孤立特征。\n\n### § 9 最脆弱的假设\n\n该论文最脆弱的假设是：**ASI-Bench 中定义的“自主性”梯度（B1-B4）能够线性且无歧义地映射到 AI 系统真实的“科学创新能力”上，且 B3/B4 的低分主要归因于推理能力的不足，而非任务设计本身存在隐含的“人类直觉捷径”或评估标准的偏差。**\n\n如果这一假设不成立，即 B3/B4 任务实际上依赖于某些未被明确写出但人类专家默认具备的领域特定启发式规则（heuristics），或者评估代码（scoring code）对非标准但正确的解决方案缺乏鲁棒性，那么 ASI-Bench 测量的就不是“自主创新能力”，而是“对特定人类思维路径的拟合程度”。在实际中，科学发现往往是非线性的，且存在多种等效的数学表述或数值解法。如果基准测试的参考解（reference solution）过于僵化，仅接受特定算法路径产生的结果，那么 AI 即使发现了正确的物理规律但采用了不同的数值实现，也可能被判定为失败。论文虽然提到了经过多轮人工审查和沙箱验证以排除“意外捷径”（unintended shortcuts），但并未充分证明其评估标准（scoring criteria）能够涵盖所有科学上等价但形式不同的解决方案。如果评估器无法识别非标准但正确的科学产出，那么 B3 的低分可能反映的是评估器的狭隘性，而非 AI 的无能，这将直接动摇“当前 AI 缺乏自主科研能力”这一核心结论的有效性。\n\n### § 10 最小复现实验\n\n在 1 周内，可以选取 ASI-Bench 中一个具体的 B3 任务（如附录 D 中的 \"2D Anisotropic Stiff Dynamics\"），复现其评估流程以验证“方法操作化”是否为真正瓶颈。\n\n**数据与实现：** 下载该任务的输入数据（`system_info.json`, `field_evolution.npy` 等）和官方提供的评估脚本（`generate_gt.py` 及 scoring code）。不使用完整的 Agent 框架，而是手动编写两个简单的 Python 脚本：脚本 A 严格遵循 B1 提示中的 ETDRK4 求解器代码；脚本 B 尝试使用一种不同的、但在科学上等效的数值方法（如 IMEX Runge-Kutta 或简单的谱方法结合隐式时间步进）来解决相同的 B3 问题（即仅给定目标和数据，不给定具体求解器）。\n\n**测量与验证：** 运行这两个脚本生成预测场和诊断数据，并使用官方的 scoring code 进行评分。\n*   **支持 Claim 的结果：** 如果脚本 A（遵循 B1 路径）得分高，而脚本 B（科学正确但路径不同）得分极低或为零，则表明评估标准存在偏差，B3 的低分可能源于评估器的僵化而非 AI 的推理缺陷，从而反驳了论文关于“自主性瓶颈”的归因。\n*   **反驳 Claim 的结果：** 如果脚本 B 也能获得与脚本 A 相近的高分，则证明评估器是鲁棒的。此时，若让一个通用 LLM Agent 在 B3 设置下运行，其得分依然远低于脚本 B，则有力支持了论文的核心观点：AI 的瓶颈确实在于无法自主发现并正确实现有效的数值方法（method operationalization），而非评估体系的问题。", "research_value": "### § 11 最强反例设计\n\n要最有力地攻击 ASI-Bench 的核心结论，即“当前 AI 的瓶颈在于方法操作化（method operationalization）而非方法选择”，我们需要设计一个反例，证明 B3（自主探索）的低分并非源于 AI 缺乏将抽象目标转化为具体代码的能力，而是源于**评估体系对“非标准但科学有效”路径的排斥**，以及**B2 设置中隐含的“误导性先验”**。\n\n具体反例设计如下：\n\n1.  **替代解释：评估器的“路径依赖”偏差（Path-Dependency Bias in Scoring）**\n    *   **攻击点**：论文声称 B1 到 B2 的巨大落差（-21.82 分）证明了 AI 难以将方法名转化为代码。然而，如果 B1 提供的参考解（Reference Solution）是唯一的“黄金标准”，而 B2/B3 中 AI 可能发现并实现了另一种在科学上等效但数值实现不同的方法（例如，在刚性动力学问题中，AI 选择了 IMEX Runge-Kutta 而非 B1 指定的 ETDRK4），但 Scorer 仅基于与 B1 输出结果的数值误差（如 L2 norm）进行评分，那么 AI 的“正确”科学发现会被判定为“错误”。\n    *   **实验设计**：选取 ASI-Bench 中得分最低的 B3 任务，人工审查 AI 生成的代码。如果 AI 的代码逻辑自洽、物理守恒律满足，且结果在科学误差范围内合理，但与 B1 的参考解存在数值差异，则证明低分源于 Scorer 的僵化，而非 AI 的无能。这将直接推翻“方法操作化是瓶颈”的结论，转而指出“评估标准的单一性”才是阻碍 AI 得分的关键。\n\n2.  **可预测失败条件：B2 的“负迁移”效应（Negative Transfer in B2）**\n    *   **攻击点**：论文认为 B2（指定方法名）比 B3（完全自主）更难，因为 B2 限制了 AI 的搜索空间。然而，反例可以论证：B2 提供的方法名可能是一个“局部最优陷阱”。例如，如果 B2 指定的方法在当前数据分布下并非最优，或者需要极其复杂的调参才能收敛，而 B3 允许 AI 通过数据分析发现更简单的启发式方法（Heuristic）或数据驱动模型（如 Neural Operator），那么 B2 的低分实际上反映了 AI 对“错误先验”的过度拟合，而非其自主探索能力的不足。\n    *   **实验设计**：构造一个任务，其中 B1 指定的传统数值方法计算成本极高且易发散，而存在一种简单的数据驱动替代方案。观察 AI 在 B2 下是否因执着于实现指定的复杂方法而失败，而在 B3 下是否因能自由选择简单方法而获得高分。如果 B3 得分显著高于 B2，则证明 B2 的“指导”反而成为了阻碍，挑战了“指导越多越好”的线性假设。\n\n3.  **真实世界场景：科学发现的“非连续性”与“试错”本质**\n    *   **攻击点**：ASI-Bench 假设科学研究是一个从目标到方法的确定性映射过程。然而，真实科学发现往往涉及大量的“失败实验”和“意外发现”。B3 要求 AI 在单次或少量交互中直接给出正确方法，这忽略了人类科学家通过大量试错（Trial-and-Error）积累直觉的过程。AI 在 B3 的低分可能仅仅因为它缺乏“试错预算”，而非缺乏“推理能力”。\n    *   **实验设计**：修改 B3 设置，允许 AI 进行多轮“假设-验证-修正”循环，并记录其迭代过程中的知识积累。如果 AI 在多次迭代后能逐步逼近正确方法，而单次 B3 测试失败，则说明 ASI-Bench 的“一次性评估”范式无法捕捉 AI 的潜在学习能力，从而低估了其自主性。\n\n### § 12 Follow-up Research Idea\n\n基于 ASI-Bench 揭示的“方法操作化”瓶颈及其评估体系的局限性，我提出一个全新的研究方向：**从“静态基准测试”转向“动态科学协同进化”（Dynamic Scientific Co-Evolution）**，即构建一个能够与 AI 共同迭代、修正评估标准并生成新科学假设的框架，而非仅仅评估 AI 对固定任务的执行能力。\n\n**（a）驱动局限与未满足需求：**\nASI-Bench 的核心局限在于其**静态性**和**人类中心主义**。它假设存在一个固定的“正确答案”和“最佳方法”，并由人类专家预先定义。然而，真正的 ASI 应具备**重塑问题定义**和**创造新评估标准**的能力。当前基准无法评估 AI 在发现新现象后，如何定义新的物理量或验证标准。此外，B3 的低分可能部分源于 AI 缺乏与“环境”的深层交互反馈，而不仅仅是代码生成能力的不足。\n\n**（b）借鉴相邻领域的方法：**\n借鉴**强化学习（Reinforcement Learning, RL）**中的**离线策略评估（Off-Policy Evaluation）**和**元学习（Meta-Learning）**思想，以及**科学哲学**中的**范式转换（Paradigm Shift）**理论。具体而言，引入**程序性生成评估器（Procedurally Generated Evaluators）**，即评估标准本身也是由 AI 在探索过程中动态生成的，而非预先固定的。同时，借鉴**主动学习（Active Learning）**，让 AI 在不确定时主动请求人类或模拟环境的反馈，而非盲目执行。\n\n**（c）第一个实验设计：**\n构建一个名为 **\"ASI-CoLab\"** 的动态实验框架，其核心组件包括：\n1.  **动态任务生成器（Dynamic Task Generator）**：不再使用固定的 60 个任务，而是由一个“导师 AI”根据当前“学生 AI”的能力水平，动态生成具有不同难度和复杂度的科学问题。\n2.  **自适应评估器（Adaptive Scorer）**：评估标准不再是固定的 L2 误差，而是由“导师 AI”根据“学生 AI”提出的假设和结果，动态判断其科学新颖性和有效性。如果“学生 AI”提出了一个全新的、但尚未被验证的物理规律，评估器应给予“探索奖励”而非“错误惩罚”。\n3.  **协同迭代循环（Co-Evolutionary Loop）**：\n    *   **阶段 1**：学生 AI 在 B3 模式下尝试解决问题，并生成初步假设和代码。\n    *   **阶段 2**：导师 AI 评估结果，不仅给出分数，还生成“反例”或“边界条件”测试，挑战学生 AI 的假设。\n    *   **阶段 3**：学生 AI 根据反馈修正方法，甚至重新定义问题。\n    *   **阶段 4**：如果学生 AI 发现了一个导师 AI 无法解释的新现象，系统记录该“科学突破”，并更新任务库。\n\n**与已有工作的区别：**\n与 ASI-Bench 的“静态、单向评估”不同，ASI-CoLab 是“动态、双向交互”的。它不预设“正确答案”，而是关注 AI 在科学探索过程中的**适应性（Adaptability）**、**创新性（Innovation）**和**鲁棒性（Robustness）**。这将更真实地模拟人类科学家的研究过程，并可能揭示 AI 在“创造新知识”而非“应用旧知识”方面的真正潜力。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "{\n  \"authors\": [\n    {\n      \"name\": \"Junwei Zhou\",\n      \"affiliations\": [\n        5\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Zhen Sun\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Binyu Li\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jiangyu Zhou\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yuexi Pan\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Hengyu Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Honghe Ren\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xiaohan Jia\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xueyang Zhou\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xiaoyu Cao\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yongchao Chen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Yuanning Feng\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Junhao Wu\",\n      \"affiliations\": [\n        1\n
