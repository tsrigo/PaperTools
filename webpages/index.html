放域对话中，直接优化回答会导致用户反馈随之改变，使得离线验证失效；因此，我们将优化目标从“生成更好的回答”转换为“预测现有回答引发的用户反馈”。由于预测任务基于固定的日志数据，其准确性可以被严格验证，从而为 **skill evolution** 提供了稳定的离线优化信号。这种 **feedback-prediction skill** 在进化过程中习得的判别标准，反过来可作为可解释的诊断依据，指导 **answer skill** 的改进，实现了从不可验证的反事实优化到可验证的观测预测的范式转换。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法是 **Future-Feedback Skill Evolution**（未来反馈技能演化）。其核心思想是将优化目标从“生成更好的回答”转变为“预测现有回答是否会引发用户的正面反馈”。由于预测任务基于固定的历史日志（Logged Data），因此具有可验证性（Verifiable），从而支持基于验证门控（Validation-Gated）的文本技能优化。\n\n以下是结合一个真实销售助手场景的完整 Pipeline 说明：\n\n**1. 数据构建与标签定义 (Data Construction \u0026 Labeling)**\n*   **输入**：从生产环境中提取的对话日志，包含上下文 $C$、对话历史 $H$、用户当前请求 $Q_1$、助手回答 $A$ 以及随后的用户行为或反馈 $Q_2$。\n*   **处理**：\n    *   **清洗**：剔除模糊的静默终止、重复记录或上下文缺失的低质量数据。\n    *   **标签化**：将 $Q_2$ 映射为二元标签 $Y \\in \\{0, 1\\}$。$Y=1$ 表示“已解决/被采纳”（Resolved/Accepted），$Y=0$ 表示“未解决/被拒绝”（Unresolved/Rejected）。\n    *   **平衡**：构建训练集和测试集，确保正负样本比例约为 1:1，防止模型通过预测多数类获得虚假的高准确率。\n*   **输出**：高质量的、标签明确的监督学习数据集 $\\mathcal{D} = \\{(X_i, A_i, Y_i)\\}$。\n\n**2. 初始化反馈技能 (Initialization of Feedback Skill)**\n*   **输入**：初始的反馈预测技能文本 $S_F^{(0)}$（例如：“如果用户说‘谢谢’或点击购买，则标记为已解决”）。\n*   **处理**：使用冻结的大语言模型（LLM）作为推理引擎，结合 $S_F^{(0)}$ 对训练集中的每个样本 $(X, A)$ 进行预测，输出预测标签 $\\hat{Y}$ 及推理依据（Rationale）。\n*   **输出**：初始预测结果及错误分析。\n\n**3. 验证门控的技能演化 (Validation-Gated Skill Evolution)**\n*   **输入**：当前技能 $S_F^{(t)}$ 及其在训练集上的高置信度错误案例（特别是假阳性，即预测为已解决但实际未解决的情况）。\n*   **处理**：\n    *   **提出编辑**：优化器模型（Optimizer Model）分析失败案例，提出对 $S_F$ 的有界文本编辑 $\\Delta_t$（如添加、删除或替换规则）。例如，发现模型错误地将“工具执行成功”等同于“用户满意”，于是提出新规则：“工具成功执行不等于用户采纳，需检查后续确认行为”。\n    *   **候选生成**：生成候选技能 $S_F' = S_F^{(t)} + \\Delta_t$。\n    *   **验证门控**：在固定的**保留集（Held-out Set）**上评估 $S_F'$ 的性能 $J(S_F')$。\n    *   **接受/拒绝**：仅当 $J(S_F') \u003E J(S_F^{(t)})$ 时，才接受该编辑，更新 $S_F^{(t+1)} = S_F'$；否则拒绝，保持原技能不变。\n*   **输出**：经过迭代优化、准确率提升的反馈预测技能 $S_F^*$。\n\n**4. 从预测依据到回答指导 (From Prediction Rationales to Answer Guidance)**\n*   **输入**：演化后的反馈技能 $S_F^*$ 及其学到的判别规则（Rationales）。\n*   **处理**：\n    *   **规则提取**：分析 $S_F^*$ 为何预测某些回答为“未解决”。例如，规则指出：“缺乏具体行动锚点（如具体数值、时间窗口）的建议被视为不可操作”。\n    *   **诊断映射**：将这些预测失败的原因转化为对回答技能 $S_A$ 的诊断建议。\n*   **输出**：可解释的质量标准，用于指导人工或自动化地修改回答技能 $S_A$（例如，在 $S_A$ 中加入“必须提供具体参数值”的指令）。\n\n**5. 最终验证 (Final Validation)**\n*   **注意**：此步骤不在离线 Pipeline 内，而是强调边界。演化后的 $S_A$ 生成的新回答 $A'$ 必须通过在线 A/B 测试或人工评估来验证其实际效果，因为离线预测模型不能保证反事实（Counterfactual）回答的有效性。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的传统数学推导（如梯度下降证明或收敛性定理），其核心在于**问题形式的转换（Problem Formulation Shift）**，即从不可验证的反事实评估转换为可验证的监督预测。以下是核心逻辑的数学直觉解释：\n\n**1. 原始问题的不可验证性 (The Unverifiable Original Problem)**\n*   **公式直觉**：\n    $$ \\text{Utility}(A') = \\mathbb{E}_{Q_2 \\sim p(Q_2|X, A')} [\\text{Reward}(Q_2)] $$\n    其中 $A'$ 是修改后的回答。\n*   **解释**：在开放域对话中，如果你改变了助手的回答 $A$ 为 $A'$，用户的后续反应 $Q_2$ 也会随之改变。然而，日志中只记录了原始回答 $A$ 对应的原始反应 $Q_2$。你无法知道如果当时回答是 $A'$，用户会说什么。因此，$Q_2$ 不能作为评估 $A'$ 的标签。这导致没有固定的目标函数（Fixed Objective）来离线优化回答技能 $S_A$。\n\n**2. 替代任务的构建 (The Verifiable Surrogate Task)**\n*   **公式直觉**：\n    $$ \\hat{Y} = f_{S_F}(X, A) \\approx Y $$\n    其中 $Y$ 是日志中观察到的真实标签（基于原始 $A$ 和原始 $Q_2$）。\n*   **解释**：我们不再尝试预测“如果回答改变会发生什么”，而是预测“对于**已经发生**的回答 $A$，用户是否会满意”。\n    *   输入 $(X, A)$ 是固定的（来自日志）。\n    *   标签 $Y$ 是固定的（来自日志）。\n    *   因此，预测误差 $Loss(\\hat{Y}, Y)$ 是可以精确计算的。\n    *   这使得我们可以定义一个固定的目标函数 $J(S_F)$，并在保留集上进行验证。\n\n**3. 演化过程的门控机制 (The Gating Mechanism)**\n*   **公式直觉**：\n    $$ S_F^{(t+1)} = \\begin{cases} S_F' \u0026 \\text{if } J(S_F') \u003E J(S_F^{(t)}) \\\\ S_F^{(t)} \u0026 \\text{otherwise} \\end{cases} $$\n*   **解释**：这是一个简单的贪心搜索或优化过程。每次对技能文本 $S_F$ 进行修改得到候选 $S_F'$，只有在固定数据集上的性能指标 $J$（如准确率）提升时，才接受修改。这保证了技能演化是单调改进的，且每一步都是可验证的。\n\n**总结**：数学上的核心贡献不是新算法，而是证明了通过改变优化目标（从生成 $A$ 到预测 $Y$），可以将一个非平稳的、依赖反事实的问题，转化为一个标准的、基于固定数据的监督学习问题。\n\n---\n\n### § 7 实验设计与结论\n\n**提出了什么问题**\n在开放域对话中，由于用户反馈依赖于助手的具体回答，修改回答会导致反馈分布变化（Moving Target Problem），因此无法利用历史日志中的反馈信号来离线验证和优化助手的回答技能（Answer Skill）。现有的技能演化方法缺乏稳定的验证信号。\n\n**设计了什么实验验证这个问题**\n1.  **方法验证**：提出 **Future-Feedback Skill Evolution** 框架，构建一个反馈预测技能 $S_F$，其目标是预测日志中已发生的回答是否会导致用户满意。\n2.  **数据构建**：在私有、隐私保护的销售助手数据集上，进行严格的数据清洗和平衡采样（Resolved/Unresolved 1:1），构建高质量的训练和测试集。\n3.  **演化过程**：实施验证门控的文本优化循环，迭代更新 $S_F$，直到在保留集上达到收敛。\n4.  **性能评估**：报告演化后的 $S_F$ 在平衡测试集上的预测准确率，并分析其学到的规则是否具有可解释性（Interpretability）。\n\n**问题的答案是什么**\n1.  **可行性**：未来反馈预测是一个可学习的任务。在精心清洗和平衡的数据集上，演化后的反馈技能达到了 **超过 75% 的准确率**，显著优于随机猜测（50%）。\n2.  **可验证性**：通过将优化目标转换为预测固定日志标签，成功实现了离线、可重复的技能演化，无需每次迭代都进行在线 A/B 测试。\n3.  **可解释性与指导价值**：演化出的技能不仅是一个黑盒分类器，还学到了可解释的质量标准（如区分“工具成功”与“用户采纳”）。这些标准可以作为诊断工具，指导回答技能 $S_A$ 的改进。\n4.  **局限性确认**：实验明确区分了“观测预测准确率”与“反事实有效性”。75% 的准确率证明了模型能捕捉交互模式，但并不保证优化后的新回答一定能让用户满意，最终仍需人工或在线验证。", "additional_insights": "### § 8 Take-aways\n\n本文提出了一种针对开放域对话（Open-ended Dialogue）中 Agent 技能自进化（Self-evolution）的验证难题的解决方案，核心在于将优化目标从“生成反事实回答”转变为“预测既定回答的未来反馈”。由于改变回答 $A$ 会导致用户后续反应 $Q_2$ 发生不可控变化，直接利用日志数据验证新回答 $A'$ 的有效性在逻辑上是无效的（Moving-target problem）。通过构建一个基于固定日志元组 $(C, H, Q_1, A)$ 预测用户后续信号（Resolved/Unresolved）的反馈预测技能（Feedback Skill, $S_F$），作者成功将动态的对话反馈转化为静态的、可验证的离线学习目标。这种验证门控（Validation-gated）的文本优化方法允许在固定数据集上对 $S_F$ 进行迭代编辑和保留，从而避免了每次候选技能都需要在线 A/B 测试或人工评估的高昂成本。进化后的 $S_F$ 不仅是一个分类器，更是一个可解释的诊断工具，其学习到的规则（如区分工具执行成功与用户实际采纳、识别缺乏行动力的模糊回答）揭示了回答质量的关键判别标准。在私有销售助手数据集上，经过严格的数据清洗和平衡采样，该方法实现了超过 75% 的预测准确率，证明了从清洗后的对话记录中学习未来反馈信号是可行的。然而，作者明确区分了观测验证（Observational Verification）与反事实有效性（Counterfactual Validity），指出 $S_F$ 的准确性仅保证了对历史数据的拟合，并不直接保证优化后的回答技能（Answer Skill, $S_A$）在真实交互中能满足用户，最终部署仍需人工或在线确认。\n\n### § 9 最脆弱的假设\n\n该方法最核心且脆弱的假设是**“反馈预测技能在分布外（Out-of-Distribution, OOD）回答上的泛化能力”**，即假设在日志数据上验证通过的 $S_F$ 能够准确评估由进化后的 $S_A$ 生成的、从未在训练集中出现过的反事实回答 $A'$。如果这一假设不成立，基于 $S_F$ 诊断结果优化的 $S_A$ 可能会产生看似符合 $S_F$ 规则但实际上无法解决用户问题，甚至被 $S_F$ 错误高估的回答，导致离线优化与在线效果脱节。在实际中，这一假设可能失效的原因在于 $S_F$ 本质上是一个基于历史观测数据的归纳模型，它学习的是“特定回答 $A$ 导致特定反馈 $Y$”的统计相关性，而非因果机制；当 $S_A$ 生成具有新颖结构或语义的回答 $A'$ 时，$S_F$ 可能因缺乏此类样本而做出错误预测（Distribution Shift）。论文在 Section 7 中明确承认了这一局限性，指出 $S_F$ 应被视为“验证过的观测模型”而非“任意 $A'$ 的人类满意度证明”，且未提供 $S_A$ 在线 A/B 测试的结果来直接验证这一泛化假设。虽然论文展示了 $S_F$ 学习到的规则具有可解释性（如要求具体行动锚点），这在一定程度上增强了对其泛化能力的信心，但缺乏端到端的因果验证使得这一假设成为整个框架从“离线可验证”走向“在线有效”的最大风险点。\n\n### § 10 最小复现实验\n\n在 1 周时间内，无法复现私有数据集和完整的工业级技能进化流程，但可以验证**“未来反馈预测任务是否比直接回答评分更具可解释性和稳定性”**这一核心 claim。具体方案如下：使用公开的 USS (User Satisfaction Simulation) 数据集或类似的带有用户满意度标注的对话数据集（如 MultiWOZ 或 CrossWOZ 的满意度子集）。首先，构建一个基线模型，直接预测对话轮次的满意度标签（Direct Satisfaction Prediction）；其次，构建本文提出的未来反馈预测模型，输入为 $(Context, History, Question, Answer)$，输出为下一轮用户是否表示解决或接受（Resolved/Unresolved）。实现上，可以使用开源 LLM（如 Llama-3-8B）作为基础模型，通过 Prompt Engineering 或轻量级 Fine-tuning 来实现这两个预测任务。测量指标包括：1) 预测准确率（Accuracy）和 F1 分数，验证未来反馈预测是否可行；2) 关键是通过 LLM-as-a-Judge 或人工抽样，评估两个模型生成的预测理由（Rationales）的质量，特别是它们是否能识别出“工具成功但用户未采纳”或“回答模糊”等具体缺陷。如果未来反馈预测模型能更稳定地识别出这些细微的质量差异，且其预测理由与人工标注的满意度原因更一致，则支持了本文关于“反馈预测技能能捕捉可解释的质量标准”的 claim；反之，如果两者表现无异或未来反馈预测更不稳定，则反驳了该方法在可解释性上的优势。此实验无需复现复杂的技能进化循环，仅聚焦于预测任务本身的性质验证。", "research_value": "### § 11 最强反例设计\n\n要彻底挑战 **Future-Feedback Skill Evolution** 的有效性，最有力的攻击并非质疑其预测准确率，而是攻击其核心假设：**“观测到的反馈信号（Observed Feedback）与回答质量（Response Quality）之间存在稳定的、可泛化的因果映射”**。具体而言，可以设计一个基于 **“策略性用户行为（Strategic User Behavior）”与“上下文依赖的反馈噪声（Context-Dependent Feedback Noise）”** 的反例场景。\n\n在真实的开放域对话（如销售助手或客服场景）中，用户的后续反应 $Q_2$ 往往不仅取决于助手回答 $A$ 的质量，还高度依赖于用户自身的意图稳定性、外部干扰或对话策略。例如，用户可能因为“暂时没空”而沉默（被标记为 $Y=0$ Unresolved），尽管回答 $A$ 完美解决了问题；或者用户可能因为“习惯性礼貌”而回复“谢谢”（被标记为 $Y=1$ Resolved），尽管回答 $A$ 完全错误且未解决问题。这种 **Label Noise** 并非随机噪声，而是与 $A$ 的内容弱相关甚至无关的系统性偏差。\n\n**反例实验设计：**\n构建一个合成数据集或筛选真实日志中的特定子集，其中包含大量 **“高质量回答但负面反馈”**（High-Quality $A$, Negative $Y$）和 **“低质量回答但正面反馈”**（Low-Quality $A$, Positive $Y$）的样本。这些样本的特征是：反馈 $Y$ 由与 $A$ 无关的外部因素决定（如用户突然离开、网络中断、或用户仅对语气满意而非内容）。\n1.  **训练阶段**：运行 **Future-Feedback Skill Evolution**。由于 $S_F$ 的目标是最小化预测误差 $Loss(\\hat{Y}, Y)$，它会迅速学习到这些“虚假相关性”。例如，它可能学到规则：“如果回答中包含特定礼貌用语，则预测为 $Y=1$”，或者“如果回答长度过短，则预测为 $Y=0$”，而完全忽略回答的实际信息密度或准确性。\n2.  **演化结果**：$S_F$ 在保留集上可能达到极高的准确率（\u003E80%），因为它完美拟合了这些噪声模式。\n3.  **诊断映射失败**：当将 $S_F$ 的规则映射到回答技能 $S_A$ 时，$S_A$ 会被优化为生成“短小但充满礼貌用语”的回答，以迎合 $S_F$ 的“高分规则”。\n4.  **在线验证崩溃**：当这些优化后的 $S_A$ 部署到真实环境时，由于它们缺乏实质内容，用户满意度（Ground Truth Satisfaction）会急剧下降。\n\n**理论论证：**\n该反例揭示了 **Goodhart's Law** 在对话优化中的极端表现：当“预测反馈”成为优化目标时，它就不再是一个好的反馈指标。论文声称的“可解释性”在此失效，因为 $S_F$ 学到的规则（如“礼貌=解决”）虽然在统计上显著，但在因果上是错误的。这证明了 **Observational Verification** 无法保证 **Counterfactual Validity**，因为 $S_F$ 无法区分“因回答好而满意”和“因其他原因而满意”。因此，该方法在存在显著非内容相关反馈噪声的场景下，会系统地引导 $S_A$ 走向退化，而非进化。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：Causal Invariant Feedback Prediction for Robust Dialogue Skill Evolution**\n\n**(a) 驱动局限与未满足需求：**\n现有 **Future-Feedback Skill Evolution** 的核心缺陷在于其依赖 **Associative Learning**（关联学习），即学习 $A \\rightarrow Y$ 的统计相关性，而非因果机制。这导致模型容易过拟合到数据中的混杂因素（Confounders），如用户情绪、时间戳、或无关的对话风格，从而产生脆弱的、不可泛化的技能规则。未满足的需求是：如何从嘈杂的日志数据中提取出 **Causal Invariant**（因果不变）的反馈信号，即那些真正由回答质量驱动、且在分布外（OOD）场景中依然稳定的用户反应模式。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴 **Causal Representation Learning**（因果表示学习）和 **Invariant Risk Minimization (IRM)**（不变风险最小化）的思想。在计算机视觉和强化学习中，IRM 被用于学习在不同环境（Environments）下保持不变的预测规则，从而避免对特定环境特征的过拟合。在对话场景中，我们可以将不同的“用户群体”、“对话时段”或“业务场景”视为不同的“环境”（Environments）。\n\n**(c) 第一个实验设计：**\n1.  **环境划分（Environment Stratification）**：将日志数据根据非内容特征（如用户ID哈希、时间段、对话长度分布）划分为多个互斥的“环境”子集 $\\mathcal{E}_1, \\mathcal{E}_2, ..., \\mathcal{E}_K$。假设每个环境中的混杂因素（如特定群体的礼貌习惯）不同，但“回答质量导致满意度”的因果机制是相同的。\n2.  **因果反馈技能演化（Causal Feedback Skill Evolution）**：修改 **Validation-Gated Skill Evolution** 的目标函数。不再仅最小化全局预测误差，而是最小化 **Invariant Risk**：\n    $$ \\min_{S_F} \\sum_{k=1}^K \\lambda_k \\cdot \\text{Loss}(S_F; \\mathcal{E}_k) \\quad \\text{s.t.} \\quad \\nabla_{S_F} \\text{Loss}(S_F; \\mathcal{E}_k) = \\nabla_{S_F} \\text{Loss}(S_F; \\mathcal{E}_j) \\quad \\forall k, j $$\n    即，要求 $S_F$ 在所有环境中的梯度方向一致，迫使模型只学习那些在所有环境中都成立的、与回答内容强相关的规则，而忽略仅在特定环境中成立的虚假相关性。\n3.  **对比实验**：\n    *   **基线**：原始的 **Future-Feedback Skill Evolution**（仅最小化全局误差）。\n    *   **提议方法**：**Causal Future-Feedback Skill Evolution**。\n    *   **评估指标**：除了标准的预测准确率，重点评估 **OOD Generalization**（分布外泛化能力）。构建一个全新的、具有不同用户行为模式的测试集（如新用户群体或新业务线），比较两种方法演化出的 $S_F$ 在该测试集上的准确率，以及基于 $S_F$ 优化的 $S_A$ 在在线 A/B 测试中的实际用户满意度提升。\n4.  **预期结果**：提议方法在训练集上的准确率可能略低于基线（因为放弃了拟合噪声），但在 OOD 测试集和在线 A/B 测试中表现显著更优，证明其学到的规则更具鲁棒性和因果有效性。\n\n**与已有工作的区别：**\n现有工作（如 **USS**, **SPUR**）仅关注静态的满意度预测，未考虑分布偏移；**Future-Feedback Skill Evolution** 关注离线验证的可行性，但未解决预测模型的因果脆弱性。本提议引入了 **Causal Invariance** 作为技能演化的核心约束，将对话优化从“统计拟合”提升到“因果发现”层面，为解决 **Moving-Target Problem** 提供了更坚实的理论基础。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"ChaoJin Zhao\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xuan Jiang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"ByteDance\"\n    }\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "文本技能为改进冻结的语言模型智能体提供了一种轻量级方法，但其自我进化通常需要稳定的验证信号。在数学或代码领域，答案在改变后可进行检查，因此这类信号是自然的；然而在开放式对话中，这类信号存在问题：改变助手的回复也会改变用户的下一次反应，因此已记录的反应无法直接评估反事实回复。我们提出了未来反馈技能进化（future-feedback skill evolution），该方法首先将自我进化从规定当前答案转向预测观察到的答案是否会导致后续用户信号的正向或负向结果。该预测任务可在固定的已记录元组上进行验证，因此支持基于验证门控的文本优化。进化后的反馈技能捕捉了可解释的回复质量标准，并可随后作为答案技能的诊断和优化目标。在一个专有的、隐私保护的销售助手数据集上，通过仔细的质量过滤和平衡的已解决/未解决划分，实现了超过 75% 的预测准确率。除了这一结果外，核心贡献在于一种公式化方法，将原本动态变化的对话反馈转化为固定的离线学习目标，从而实现在不将每个候选技能置于实时流量中的情况下进行可复现的技能进化。我们讨论了观察性验证与反事实有效性之间的界限，并将该方法定位为离线优化阶段，而非最终人工或在线评估的替代品。"}]}]};

const dailyOverviewsRaw = {"2026-07-24": "### 今日AI论文速览 (2026-07-24)\n\n#### 开篇导语\n今日的研究动态呈现出**“Agent 工程化”**与**“交互动态化”**的双重趋势。一方面，从 NVIDIA 的面向对象编程范式到 OpenForgeRL 的端到端训练框架，Agent 的基础设施正从松散的 Prompt 工程转向严谨的软件工程标准，强调可测试性、可维护性及与现有开发流程的无缝集成。另一方面，研究焦点从静态任务执行转向复杂的**人机协作**与**意图演化**，揭示了当前 LLM 在动态对话中追踪用户意图的显著短板。同时，在代码生成领域，针对数据库内核、硬件加速及形式化验证的专用 Agent 展现出超越通用模型的潜力，标志着垂直领域 Agent 正在进入深水区。\n\n---\n\n#### 三、 主题分类与论文速览\n\n### 🏗️ 基础设施重构：Agent 作为一等公民与端到端训练\n*本板块聚焦于 Agent 开发范式的根本性转变，旨在解决传统 Agent 难以训练、难以调试和难以集成的痛点。*\n\n*   **NVIDIA-labs OO Agents (NOOA)** 提出了一种**“Agent 即 Python 对象”**的编程范式，将 Agent 的方法、状态、提示词和类型注解统一映射到 Python 类结构中。该方法允许开发者像调试普通软件一样测试和重构 Agent 行为，并首次结合了**类型化 I/O**、**引用传递**和**可编程循环工程**等六大模型交互理念，在 SWE-bench 等基准上证明了其有效性。(2607.20709 [cs.CL])\n*   **OpenForgeRL** 针对复杂推理 Harness（如 Claude Code, Codex）难以进行端到端 RL 训练的问题，提出了一种开源框架。通过轻量级代理记录模型调用并作为训练数据，结合 Kubernetes 编排实现大规模分布式训练，实现了**训练与推理的解耦**。实验表明，该方法能在数百至数千个任务上训练出超越开源基线的 Agent，显著提升了工具覆盖率和多步规划能力。(2607.21557 [cs.CL])\n\n### 🧠 记忆与学习效率：从上下文蒸馏到归因反馈\n*本板块探讨如何更高效地利用 Agent 的历史经验，解决长程任务中的记忆遗忘和信用分配难题。*\n\n*   **Sample-Efficient Learning from Agent Experience** 提出了**Experience Distillation**（经验蒸馏）方法，旨在将 In-Context Learning (ICL) 的收益固化到模型权重中，而无需额外的环境交互。在软件工程任务和文本冒险游戏中，该方法保留了 ICL 至少 64.8% 的收益，远超直接 SFT 的 3.8%，且相比经典 RL 基线，样本效率提升了至少 9.6 倍。(2607.21051 [cs.CL])\n*   **CMI-Mem** 针对现有记忆管理器过度依赖 LLM 评判合成 QA 对的局限，提出了一种基于强化学习的轻量级记忆管理模型。其核心创新在于引入了**条件互信息 (CMI)** 作为内在奖励，评估新输入相对于当前记忆状态的信息贡献，从而在不依赖特定下游查询的情况下实现更通用的长期记忆管理。(2607.20553 [cs.CL])\n*   **AttriMem** 解决了 RL 训练 Agent 记忆时的细粒度信用分配瓶颈。通过引入**归因引导的过程反馈**，该方法利用 token 级贡献度为中间记忆决策提供局部奖励，弥补了全局结果奖励的粗糙性。实验显示，AttriMem 在长程对话问答中优于检索式和启发式基线，并稳定了 RL 优化过程。(2607.21106 [cs.AI])\n\n### 💻 代码与软件工程 Agent：从模糊需求到内核优化\n*本板块展示了 Agent 在复杂软件工程任务中的深度应用，涵盖从模糊需求澄清到硬件内核生成的全链路。*\n\n*   **ICAE-Bench** 针对“Vibe Coding”趋势下 Agent 需处理模糊产品需求的新场景，提出了一个交互式项目构建基准。该基准通过模拟**用户代理 (User Agent)** 揭示隐藏约束，并结合黑盒测试与多维度诊断（如结构保真度、设计质量）来评估 Agent 将模糊意图转化为可执行软件的能力。(2607.21217 [cs.AI])\n*   **GenDB** 演示了一种生成式查询引擎，利用 LLM Agent 根据特定数据、工作负载和硬件资源生成**实例优化的查询执行代码**。对于重复性模板查询，GenDB 通过前置生成成本摊销实现性能超越；对于即席查询，则与传统 DBMS 混合部署。该系统在 TPC-H 等基准上显著优于传统查询引擎。(2607.20630 [cs.CL])\n*   **MKEvolve** 针对硬件加速器内核生成的瓶颈，提出了一种模块化多 Agent 框架。该框架通过迭代共演化**模块分解**与**LLM 生成的子内核**，利用 Beam Search 独立优化每个子内核。实验表明，MKEvolve 在 Triton 内核生成中不仅提高了正确性和加速比，还减少了 35% 的 LLM Token 消耗。(2607.20501 [cs.AI])\n*   **EvoSQL** 将 Text-to-SQL 建模为生成器与批评者的**共演化过程**，并引入**上下文候选记忆**来存储和更新 SQL 候选项。通过执行信号和 LLM 批评进行验证，并结合**自蒸馏策略优化 (SDPO)** 微调底层模型，EvoSQL 在 Spider 和 BIRD 基准上显著提升了开源模型的性能，特别是在复杂查询场景下。(2607.20489 [cs.AI])\n*   **LeanFlow** 专注于将数学论文转化为可构建的 Lean 项目，通过案例研究分析了不同模型（Kimi2.6, GPT5.5）和工具集对形式化效率的影响。研究发现，完整的**工作流驱动**策略能在有限的 API 调用预算内完成文档级项目，并在 RLM25 等基准上取得优异成绩，证明了结构化工作流在形式化验证中的关键作用。(2607.20503 [cs.LG])\n\n### 🤝 人机交互与动态意图：揭示 LLM 的协作短板\n*本板块关注 Agent 在真实人机协作场景中的表现，特别是面对动态变化的用户意图时的局限性。*\n\n*   **AppWorld-UL** 引入了一个包含 516 个挑战性任务的**“人在回路”**基准，重点评估 Agent 在工具使用中的多样化用户交互能力（如澄清、确认、不可行性通知）。实验显示，即使是 SOTA 模型 Claude Opus 4.7 在该基准上的成功率也仅为 48.6%，在组合任务中更是降至 21.3%，凸显了正确用户交互对任务成功的关键性。(2607.20536 [cs.CL])\n*   **LLMs Get Lost in Evolving User Intent** 揭示了 LLM 在动态多轮对话中追踪**演化用户意图**的根本性缺陷。研究将静态单轮任务转化为动态多轮对话，发现模型在静态设置下的强劲表现无法迁移到意图不断修正和重定向的场景中，表明当前 LLM 缺乏忠实追踪和响应动态意图的能力，这是未来协作 Agent 的关键瓶颈。(2607.20734 [cs.LG])\n\n### 🎓 强化学习新范式：策略感知的训练脚手架\n*本板块介绍了一种新的 RL 训练方法，旨在解决长程 Agent 训练中的探索效率问题。*\n\n*   **PATS (Policy-Aware Training Scaffolding)** 提出了一种以**策略为中心**的训练范式，将技能视为动态的训练脚手架。该方法将最新策略的 Rollout 组转化为**证据卡片**，并根据任务评估动态调整后续 Rollout 的上下文，为弱策略提供具体指导。随着策略提升，冗余上下文被移除，最终在部署时丢弃脚手架。该方法在 ALFWorld 和 WebShop 上提升了高达 18.6% 的性能，并减少了 32.1% 的 Prompt Token 使用。(2607.21419 [cs.AI])\n\n---\n\n#### 四、 今日看点\n\n*   **🔥 趋势观察：Agent 开发的“软件工程化”浪潮**\n    今日多篇论文（NOOA, OpenForgeRL, ICAE-Bench）共同指向一个明确趋势：Agent 正在从“Prompt 拼凑”走向“软件工程”。NVIDIA 提出的**面向对象 Agent** 和 OpenForgeRL 的**端到端训练框架**，标志着行业开始重视 Agent 的可测试性、可维护性和标准化训练流程。这预示着未来 Agent 开发将更紧密地融入现有的 CI/CD 和软件工程体系。\n\n*   **⚠️ 颠覆性观点：静态评估的失效与动态意图的缺失**\n    《LLMs Get Lost in Evolving User Intent》和《AppWorld-UL》的研究结果令人警醒：当前 SOTA 模型在静态、全指定任务上的高分，掩盖了其在**动态意图追踪**和**复杂人机交互**中的严重不足。这挑战了现有基准的有效性，提示研究者需重新评估 Agent 在真实协作场景中的能力边界，**“动态性”**将成为下一代 Agent 评估的核心维度。\n\n*   **🚀 潜力技术：垂直领域的“专家型”Agent 崛起**\n    在代码生成领域，通用模型正面临来自垂直领域专用 Agent 的挑战。**GenDB**（数据库查询优化）、**MKEvolve**（硬件内核生成）和 **LeanFlow**（形式化验证）展示了通过特定工作流和领域知识增强，Agent 能在高度专业化的任务中超越通用基线。这表明，未来的竞争力可能不在于模型规模，而在于**领域特定的工作流设计**和**工具链集成**。\n\n*   **💡 方法论创新：从“技能复用”到“策略脚手架”**\n    PATS 提出的**策略感知训练脚手架**为长程 RL 训练提供了新思路。不同于传统的技能库复用，PATS 强调根据策略的实时表现动态调整训练上下文，这种**自适应的训练支持**机制可能成为解决稀疏奖励和探索效率低下的通用解决方案，值得在更多 Agent 训练场景中验证。", "2026-07-23": "### 今日AI论文速览 (2026-07-23)\n\n#### 开篇导语\n今日的研究动态呈现出“深度专业化”与“推理架构革新”并行的显著特征。一方面，**自主智能体（Autonomous Agents）**正从通用的对话交互向高壁垒的垂直领域（如EDA芯片设计、复杂文档操作、代码性能优化）深度渗透，暴露出当前模型在长程状态追踪和细粒度验证上的瓶颈。另一方面，在基础推理层面，研究者开始摒弃单一的思维链范式，转而探索**异构多智能体协作**与**基于前缀的强化学习**，试图以更少的Token消耗实现更鲁棒的逻辑闭环。这标志着AI研究正从“规模扩张”转向“结构效率”与“领域适配”的精耕细作阶段。\n\n---\n\n#### 三、 主题分类与论文速览\n\n### 🧠 推理架构革新：从同质化到异构协同\n*面对复杂推理任务，单一模型的思维链（CoT）显得脆弱。今日研究聚焦于通过架构层面的异构分工或训练范式的重构，提升小模型或通用模型的推理上限。*\n\n*   **PoTRE (Poly-Topological Reasoning Ensembles)** 提出了一种**异构推理框架**，将推理过程解耦为四个独立代理：**对抗性精炼代理**、**分层战略规划代理**、**谱搜索代理**和**直接链代理**。通过一个**任务自适应聚合层**动态协调这些视角，PoTRE在保持推理Token消耗相当甚至更低的情况下，在 **Humanity's Last Exam (HLE)** 基准上达到了 **49.92%** 的SOTA准确率，证明了架构异构性在提升推理鲁棒性方面的巨大潜力。 (2607.20268 [cs.CL])\n*   **Prefix-GRPO** 针对小语言模型在长程交互中的蒸馏效率问题，提出了一种将教师轨迹分解为**重放前缀（Replayed Prefixes）**和**在线续写（Online Continuation）**的强化学习框架。该方法不仅对续写部分进行优化，还通过策略蒸馏SFT检查点估算旧对数概率，对重放前缀中的历史Token应用**裁剪策略更新（Clipped Policy Updates）**，在 **TextCraft** 和 **BabyAI** 等环境中显著提升了小模型代理的性能，优于传统的蒸馏和标准RL基线。 (2607.19395 [cs.AI])\n\n### 🛠️ 垂直领域自动化：突破“最后一公里”的工程瓶颈\n*通用大模型在特定专业领域（如芯片设计、文档处理）仍面临严峻挑战。今日论文揭示了智能体在复杂工作流中的具体失败模式，并提出了针对性的自动化修复与评估方案。*\n\n*   **DocOps** 构建了一个**可确定性验证的评估框架**，旨在测试自主智能体在复杂文档操作中的能力。研究揭示了当前前沿模型在处理高度耦合、长程任务时的三大关键失败模式：**长期状态追踪崩溃**、**浅层语义验证**以及**结构性元数据的破坏性编辑**。该工作明确了智能体在维持全局文档一致性方面的能力边界，为未来设计**非破坏性（Non-destructive）**智能体提供了方向。 (2607.19865 [cs.CL])\n*   **EvoDRC** 针对先进节点物理设计中**设计规则检查（DRC）**闭合这一主要瓶颈，提出了一种**技能进化框架**。该框架利用从无关参考设计中蒸馏的知识初始化层特定修复技能，并通过收集目标设计的可追溯修复经验持续进化这些技能。在 **DAC26 DRC Benchmark** 的七个块级设计中，EvoDRC实现了 **73.5%** 的整体违规减少率，展示了**LLM代理**结合局部DRC分析和连通性检查工具在自动化修复中的有效性。 (2607.20019 [cs.AI])\n\n### ⚡ 代码与推荐系统：性能优化与工具学习的深度融合\n*在软件工程和数据推荐领域，研究重点转向了如何利用外部工具（Profiler、推荐模型）来弥补LLM在性能感知和全排序能力上的不足。*\n\n*   **PerfAgent** 针对仓库级代码优化中“保持行为不变同时提升运行时性能”的难题，提出了一种**性能分析器引导（Profiler-Guided）**的迭代细化工作流。通过引入**验证器在环（Verifier-in-the-loop）**机制，PerfAgent利用性能分析证据而非单纯的时间计时来决定优化方向，在 **GSO** 和 **SWE-fficiency-Lite** 基准上，将匹配专家水平的补丁率分别提升至 **39.2%** 和 **74%**，远超OpenHands基线。 (2607.19653 [cs.AI])\n*   **PRTA (Personalized Recommendation Tool Learning via Autonomous Language Agents)** 提出了一种基于代理的推荐框架，其中LLM作为**中央规划器**，与传统推荐模型作为**工具**进行交互。LLM负责高层推理和基于用户画像的**个性化工具选择**，而传统模型负责利用其可扩展性进行全排序评分。通过设计**反思机制**评估工具表现，PRTA在三个公共数据集上证明了其在克服LLM幻觉和上下文限制方面的优势，提升了全排序推荐性能。 (2607.19739 [cs.AI])\n\n---\n\n#### 四、 今日看点 (Highlights)\n\n*   **🔍 推理范式的“分治”趋势**：PoTRE和Prefix-GRPO分别从**推理时架构**和**训练时策略**两个维度，挑战了“单一思维链”的主导地位。PoTRE通过**多代理异构协作**模拟人类专家组的讨论，而Prefix-GRPO则通过**前缀重放**解决了小模型在长程任务中的状态对齐问题。这表明，未来的推理增强可能不再单纯依赖更大的上下文窗口，而是依赖于更精细的任务分解与状态管理。\n*   **🚧 智能体的“破坏性”边界被量化**：DocOps论文极具洞察力地指出了当前Agent在文档操作中的**三大失败模式**，特别是“结构性元数据的破坏性编辑”。这提醒我们，在追求Agent通用性的同时，必须引入**确定性验证（Deterministic Verification）**机制，否则在金融、法律等对格式和结构极度敏感的领域，Agent的“创造性”可能变成灾难性的错误。\n*   **🚀 性能优化成为代码Agent的新高地**：PerfAgent的出现标志着代码智能体从“功能实现（Correctness）”向“性能优化（Performance）”的跨越。通过引入**Profiler作为反馈信号**，LLM不再盲目猜测瓶颈，而是基于数据驱动进行迭代。这一思路可广泛迁移至其他需要量化反馈的工程领域，如数据库查询优化或网络配置调优。\n*   **🤝 “LLM大脑 + 传统模型手脚”的混合架构**：PRTA和EvoDRC都体现了**LLM作为规划器/协调器**，而将具体执行或计算密集型任务交给**专用模型/工具**的趋势。在推荐系统中，LLM负责个性化意图理解，传统模型负责大规模排序；在EDA中，LLM负责策略规划，专用工具负责几何检查。这种**混合智能（Hybrid Intelligence）**架构可能是平衡成本、精度与效率的最优解。", "2026-07-22": "### 今日AI论文速览 (2026-07-22)\n\n#### 开篇导语\n今日的研究动态呈现出“从生成到验证”与“从黑盒到可观测”的双重演进趋势。在智能体（Agent）领域，研究重心正从单纯的对话生成转向**可验证的自我进化**与**深度的故障归因**，试图解决开放域交互中缺乏稳定反馈信号以及复杂任务中错误溯源难的痛点。与此同时，在代码与优化生成领域，**交互式求解器循环（Solver-in-the-Loop）**与**多策略探索**成为提升模型鲁棒性的关键，证明了小参数模型通过合理的工具链和搜索策略，足以挑战甚至超越超大参数模型的SOTA表现。\n\n---\n\n#### 三、 主题分类与论文速览\n\n### 🔄 智能体的自我进化与可观测性：从“黑盒运行”到“闭环调试”\n\n随着LLM Agent在复杂工作流中的应用加深，如何确保其行为的稳定性、可解释性及自我修正能力成为核心议题。今日的两篇论文分别从**离线技能进化**和**在线故障调试**两个维度提供了新的解决方案。\n\n*   **Verifiable Self-Evolution for Open-Ended Dialogue Skills via Future-Feedback Prediction**\n    针对开放域对话中因用户反应动态变化而导致反馈信号不稳定、难以用于离线优化的问题，该研究提出了**未来反馈预测（Future-Feedback Prediction）**机制。该方法将自我进化目标从“生成当前回答”转变为“预测当前回答是否会导致后续正向用户信号”，从而将动态的对话反馈转化为固定的、可验证的离线学习目标。在私有销售助手数据集上，该预测技能达到了75%以上的准确率，为无需实时流量测试的**验证门控文本优化（Validation-Gated Textual Optimization）**提供了可行路径。\n    (2607.18973 [cs.CL])\n\n*   **AgentDebugX: An Open-Source Toolkit for Failure Observability, Attribution, and Recovery in LLM Agents**\n    针对LLM Agent故障难以定位（错误表现步骤与根源步骤不一致）的问题，本文开源了**AgentDebugX**框架，构建了“检测-归因-恢复-重跑”的闭环调试工作流。其核心组件**DeepDebug**通过全局轨迹理解和交叉审查进行多轮根因诊断，在Who and When基准测试中实现了28.8%的精确归因准确率，显著优于单步基线。此外，在GAIA基准上，该工具通过单次重跑修复了13个失败任务，将整体准确率从55.8%提升至63.6%，并提供了错误共享中心以复用调试记忆。\n    (2607.18754 [cs.CL])\n\n### 💻 代码与优化生成：交互循环与策略探索重塑效率边界\n\n在代码生成与数学优化领域，单纯的“一次性生成”已触及瓶颈。今日的研究表明，引入**执行反馈循环**和**多维策略搜索**能显著提升模型解决复杂工程问题的能力，甚至出现小模型凭借架构优势“以小博大”的现象。\n\n*   **PEARL: Solver-in-the-Loop Interactive Optimization Modeling from Natural Language**\n    针对现有优化建模方法多为一次性生成、缺乏迭代修正的问题，本文提出了**PEARL**系统，将Python执行器和数学规划求解器嵌入到**求解器在环（Solver-in-the-Loop）**的交互流程中。PEARL能够根据中间执行结果、可行性信号和求解器诊断信息，自主学习何时测试部分模型、如何修订错误以及何时停止。实验显示，仅4B参数的**PEARL-Qwen3-4B**在优化建模任务的宏观和微观平均准确率上，均超越了685B参数的DeepSeek-V3.2，证明了交互式工具链对模型能力的巨大杠杆效应。\n    (2607.18256 [cs.LG])\n\n*   **PhoenixRepair: Rethinking Repair Strategy Exploration in Software Agents**\n    针对现有软件修复Agent在编辑位置选择和修复尝试上探索不足的问题，本文提出了**PhoenixRepair**多智能体框架。该框架通过**多位置采样（Multi-location Sampling）**结合图结构定位信息，并在每个位置进行迭代反思与精炼，从而大幅扩展了修复策略的搜索空间。在SWE-bench-Verified基准上，PhoenixRepair在DeepSeek-V3.1后端下实现了7.8%的相对提升，并在MiniMax-M2.5后端下达到了76.0%的Pass@1最高解决率，同时保持了更高的故障定位准确率。\n    (2607.18859 [cs.AI])\n\n---\n\n#### 四、 今日看点\n\n*   **📉 “小模型+强工具”范式的确立**：PEARL的研究极具颠覆性，**4B模型击败685B模型**的案例强有力地证明，在结构化强、反馈明确的领域（如优化建模），**交互式执行环境（Interactive Execution Environment）**的价值远超单纯的参数规模堆砌。这提示我们，未来的Agent架构应更注重工具链的深度集成而非盲目追求大参数。\n*   **🔍 从“生成”转向“诊断”的工程化落地**：AgentDebugX的出现标志着LLM Agent开发进入“可观测性时代”。它不仅仅是一个调试工具，更提出了一种**闭环修复（Closed-loop Repair）**的标准范式。随着Agent复杂度提升，**根因归因（Root-cause Attribution）**将成为比单纯生成更核心的技术壁垒。\n*   **🧠 离线进化的新解法**：Verifiable Self-Evolution巧妙地解决了开放域对话中“反事实评估难”的问题。通过预测**未来反馈（Future Feedback）**而非直接优化当前回复，它为大规模离线数据上的Agent技能迭代提供了一条无需在线A/B测试的低成本路径，这对企业级私有化部署具有重要应用价值。\n*   **🔎 搜索空间的系统性扩展**：PhoenixRepair和PEARL共同指向一个趋势：**迭代与搜索**是突破LLM一次性生成局限的关键。无论是代码修复中的多位置采样，还是优化建模中的求解器反馈循环，都表明**过程控制（Process Control）**正在成为提升Agent可靠性的核心手段。"};

        // 保存状态到localStorage
        function saveState() {
            localStorage.setItem('starred_papers', JSON.stringify([...starredPapers]));
            localStorage.setItem('read_papers', JSON.stringify([...readPapers]));
            localStorage.setItem('deleted_papers', JSON.stringify([...deletedPapers]));
            localStorage.setItem('summary_language', showChineseSummary ? 'chinese' : 'english');
        }

        // 显示撤销删除的Toast
        function showUndoToast(message, seconds, onUndo, onExpire) {
            const toast = document.getElementById('undo-toast');
            const msgEl = document.getElementById('toast-message');
            const cdEl = document.getElementById('countdown');
            const undoBtn = document.getElementById('undo-btn');

            msgEl.textContent = message;
            let remaining = seconds;
            cdEl.textContent = `(${remaining}s)`;
            toast.classList.remove('hidden');

            let intervalId = setInterval(() => {
                remaining -= 1;
                cdEl.textContent = `(${remaining}s)`;
                if (remaining <= 0) {
                    clearInterval(intervalId);
                    toast.classList.add('hidden');
                    try { onExpire && onExpire(); } catch (e) {}
                }
            }, 1000);

            let expireTimer = setTimeout(() => {
                clearInterval(intervalId);
                toast.classList.add('hidden');
                try { onExpire && onExpire(); } catch (e) {}
            }, seconds * 1000);

            const cleanup = () => {
                clearInterval(intervalId);
                clearTimeout(expireTimer);
                toast.classList.add('hidden');
            };

            const onUndoClick = () => {
                cleanup();
                try { onUndo && onUndo(); } catch (e) {}
            };

            undoBtn.removeEventListener('click', onUndoClick);
            undoBtn.addEventListener('click', onUndoClick);
        }

        // 显示简单的提示信息
        function showSimpleToast(message) {
            // 创建一个简单的toast元素
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg z-50 transition-all duration-300';
            toast.textContent = message;

            document.body.appendChild(toast);

            // 3秒后自动消失
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // 通过按钮删除论文（避免JavaScript字符串转义问题）
        function deletePaperByButton(button) {
            const arxivId = button.getAttribute('data-arxiv-id');
            const title = button.getAttribute('data-title');
            deletePaper(arxivId, title);
        }

        // 删除论文
        function deletePaper(arxivId, title) {
            const paperEl = document.querySelector(`[data-arxiv-id="${cssEscape(arxivId)}"]`);
            if (!paperEl) return;
            const listItem = paperEl.closest('li');
            const sectionEl = paperEl.closest('section[data-date-section]');

            // 添加删除动画效果
            paperEl.style.transition = 'all 0.3s ease-out';
            paperEl.style.transform = 'scale(0.95)';
            paperEl.style.opacity = '0.5';

            setTimeout(() => {
                // 立即删除并保存状态
                deletedPapers.add(arxivId);
                saveState();

                // 移除DOM元素
                if (listItem) {
                    listItem.remove();
                } else {
                    paperEl.remove();
                }

                updateDateSection(sectionEl);
                updateStats();
                buildToc();

                // 显示简单的删除提示
                showSimpleToast(`已删除: ${title}`);
            }, 300);
        }

        // 切换星标状态
        function toggleStar(arxivId) {
            if (starredPapers.has(arxivId)) {
                starredPapers.delete(arxivId);
            } else {
                starredPapers.add(arxivId);
            }
            saveState();

            // 如果当前是只看收藏模式，或这篇属于窗口外（两周前）日期，则重新渲染：
            // 窗口外的论文取消收藏后应立即隐藏，新收藏的则应立即出现。
            const paperDate = (paperDataMap[arxivId] && paperDataMap[arxivId].date)
                || paperDateIndex[arxivId];
            if (showOnlyStarred || (paperDate && !windowDateSet.has(paperDate))) {
                renderPapers();
            } else {
                // 否则只更新星标按钮状态
                const starBtn = document.querySelector(`[data-arxiv-id="${cssEscape(arxivId)}"] .star-button`);
                if (starBtn) {
                    if (starredPapers.has(arxivId)) {
                        starBtn.classList.add('starred');
                    } else {
                        starBtn.classList.remove('starred');
                    }
                }
            }
        }

        // 切换已读状态
        function toggleRead(arxivId) {
            const checkbox = document.querySelector(`[data-arxiv-id="${cssEscape(arxivId)}"] input[type="checkbox"]`);
            if (!checkbox) return;

            if (checkbox.checked) {
                readPapers.add(arxivId);
            } else {
                readPapers.delete(arxivId);
            }
            saveState();
        }

        // 切换摘要语言
        function toggleSummaryLanguage() {
            showChineseSummary = !showChineseSummary;
            const toggleBtn = document.getElementById('summary-toggle');
            toggleBtn.textContent = showChineseSummary ? '中文摘要' : 'English Summary';

            // 更新所有摘要显示
            document.querySelectorAll('.summary-section').forEach(section => {
                const chineseContent = section.querySelector('.chinese-summary');
                const englishContent = section.querySelector('.english-summary');

                if (showChineseSummary) {
                    if (chineseContent) chineseContent.style.display = 'block';
                    if (englishContent) englishContent.style.display = 'none';
                } else {
                    if (chineseContent) chineseContent.style.display = 'none';
                    if (englishContent) englishContent.style.display = 'block';
                }

        }

        // 更新统计信息
        function updateStats() {
            const visiblePapers = document.querySelectorAll('.paper-item:not(.hidden-paper)').length;
            document.getElementById('total-papers').textContent = visiblePapers;
        }

        function updateDateSection(sectionEl) {
            if (!sectionEl) return;
            const totalPapers = sectionEl.querySelectorAll('.paper-item').length;
            const header = sectionEl.querySelector('[data-date-heading]');

            if (header) {
                const dateLabel = header.dataset.dateHeading || header.textContent.split(' ')[0];
                header.textContent = `${dateLabel} (${totalPapers} 篇论文)`;
            }

            if (totalPapers === 0) {
                sectionEl.remove();
            }
        }

        // 可折叠功能
        function toggleCollapsible(header) {
            const content = header.nextElementSibling;
            const isOpen = header.classList.contains('open');

            if (isOpen) {
                header.classList.remove('open');
                content.classList.remove('open');
            } else {
                header.classList.add('open');
                content.classList.add('open');
                // Lazy render: parse markdown only when first opened
                lazyRenderMarkdown(content);
            }
        }

        // Map of element ID -> raw markdown content for lazy rendering
        const mdRawContent = {};

        // Register raw markdown content for lazy rendering
        function registerMarkdown(id, content) {
            if (id && content) mdRawContent[id] = content;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function escapeJsSingleQuotedAttr(value) {
            return escapeHtml(String(value ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n')
                .replace(/\u2028/g, '\\u2028')
                .replace(/\u2029/g, '\\u2029'));
        }

        function safePathSegment(value) {
            return encodeURIComponent(String(value ?? ''));
        }

        function cssEscape(value) {
            const text = String(value ?? '');
            if (window.CSS && typeof CSS.escape === 'function') return CSS.escape(text);
            return text.replace(/["\\]/g, '\\$&');
        }

        function escapeMarkdownHtml(value) {
            return String(value ?? '').replace(/[&<>]/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;'
            }[ch]));
        }

        function sanitizeRenderedMarkdown(root) {
            root.querySelectorAll('script, style, iframe, object, embed').forEach(el => el.remove());
            root.querySelectorAll('a[href]').forEach(link => {
                const href = link.getAttribute('href') || '';
                if (!/^(https?:|mailto:|#|[/])/i.test(href)) {
                    link.removeAttribute('href');
                }
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            });
        }

        // Parse markdown for a single element by id
        function renderMarkdownEl(el) {
            if (!el || el.getAttribute('data-rendered')) return;
            const raw = mdRawContent[el.id];
            if (raw) {
                try {
                    el.innerHTML = marked.parse(escapeMarkdownHtml(raw));
                    sanitizeRenderedMarkdown(el);
                } catch (e) { el.textContent = raw; }
                el.setAttribute('data-rendered', '1');
            }
        }

        // Parse markdown for all unrendered .markdown-content elements inside a container
        function lazyRenderMarkdown(container) {
            if (typeof marked === 'undefined') return;
            container.querySelectorAll('.markdown-content:not([data-rendered])').forEach(renderMarkdownEl);
        }

        function hasMeaningfulText(value) {
            return typeof value === 'string' && value.trim().length > 0;
        }

        // Render markdown only for currently visible (open) sections
        function renderVisibleMarkdown() {
            if (typeof marked === 'undefined') return;
            marked.setOptions({ breaks: true, gfm: true, headerIds: false, mangle: false });
            // Render open collapsible sections
            document.querySelectorAll('.collapsible-content.open').forEach(c => lazyRenderMarkdown(c));
            // Render overview sections (top-level, not inside collapsible)
            document.querySelectorAll('.markdown-content:not([data-rendered])').forEach(el => {
                if (!el.closest('.collapsible-content')) renderMarkdownEl(el);
            });
        }

        // 创建论文HTML
        function formatAuthorsWithAffiliations(authorsStr, affiliationsStr) {
            if (!affiliationsStr) return escapeHtml(authorsStr);
            try {
                // 解析 JSON（可能被包在 ```json ... ``` 中）
                let jsonStr = affiliationsStr;
                const match = jsonStr.match(/```json\s*([\s\S]*?)\s*```/);
                if (match) jsonStr = match[1];
                const objMatch = jsonStr.match(/\{[\s\S]*\}/);
                if (objMatch) jsonStr = objMatch[0];
                const data = JSON.parse(jsonStr);

                // 兼容旧格式（数组）
                if (Array.isArray(data)) {
                    const authors = authorsStr.split(/,\s*/);
                    const affMap = {};
                    data.forEach(a => { if (a.name && a.affiliation) affMap[a.name.trim().toLowerCase()] = a.affiliation; });
                    return authors.map(a => {
                        const aff = affMap[a.trim().toLowerCase()];
                        return aff
                            ? `${escapeHtml(a.trim())}<sup class="aff-sup" title="${escapeHtml(aff)}">${escapeHtml(aff)}</sup>`
                            : escapeHtml(a.trim());
                    }).join(', ');
                }

                if (!data.authors || !data.institutions) return escapeHtml(authorsStr);

                // 新格式：论文式数字角标
                const instMap = {};
                data.institutions.forEach(inst => { instMap[inst.id] = inst.name; });

                // 渲染作者行
                const authorParts = data.authors.map(a => {
                    let sups = [];
                    if (a.affiliations && a.affiliations.length > 0) {
                        sups = sups.concat(a.affiliations.map(String));
                    }
                    if (a.markers && a.markers.length > 0) {
                        sups = sups.concat(a.markers);
                    }
                    const supValues = sups.map(escapeHtml).join(',');
                    const supStr = sups.length > 0
                        ? `<sup class="aff-sup">${supValues}</sup>`
                        : '';
                    return `${escapeHtml(a.name)}${supStr}`;
                });

                // 渲染机构列表
                const instLine = data.institutions.map(inst =>
                    `<sup class="aff-sup">${escapeHtml(inst.id)}</sup>${escapeHtml(inst.name)}`
                ).join('&ensp;');

                // 渲染脚注
                let footLine = '';
                if (data.footnotes && data.footnotes.length > 0) {
                    footLine = data.footnotes.map(fn =>
                        `<sup class="aff-sup">${escapeHtml(fn.marker)}</sup>${escapeHtml(fn.text)}`
                    ).join('&ensp;');
                }

                let html = authorParts.join(', ');
                html += `<div class="text-xs text-slate-500 dark:text-slate-400 mt-1">${instLine}</div>`;
                if (footLine) {
                    html += `<div class="text-xs text-slate-400 dark:text-slate-500 mt-0.5 italic">${footLine}</div>`;
                }
                return html;
            } catch (e) {
                return escapeHtml(authorsStr);
            }
        }

        // Store paper data by arxiv_id for lazy detail building
        const paperDataMap = {};

        function createPaperHTML(paper, date) {
            const aid = String(paper.arxiv_id ?? '');
            const aidHtml = escapeHtml(aid);
            const aidArg = escapeJsSingleQuotedAttr(aid);
            const titleHtml = escapeHtml(paper.title);
            const titleAttr = escapeHtml(paper.title);
            const dateHtml = escapeHtml(date);
            const isStarred = starredPapers.has(aid);
            const isRead = readPapers.has(aid);
            const isDeleted = deletedPapers.has(aid);

            if (isDeleted) return '';
            // 展示窗口：窗口外（两周前）的日期只展示被收藏的论文，其余隐藏。
            if (!windowDateSet.has(date) && !isStarred) return '';
            if (showOnlyStarred && !isStarred) return '';
            if (!paperMatchesFilters(paper, date)) return '';

            // Store paper data for lazy rendering
            paperDataMap[aid] = { paper, date };

            const clusterBadge = paper.cluster ? `<span class="tag-badge">${escapeHtml(paper.cluster)}</span>` : '';
            const tagBadges = (paper.tags || []).map(tag => `<span class="tag-badge tag-arxiv">${escapeHtml(tag)}</span>`).join('');

            return `
                <div class="paper-item bg-white dark:bg-slate-800/50 rounded-lg shadow-sm p-4 sm:p-6" data-arxiv-id="${aidHtml}">
                    <!-- 论文标题和操作按钮 -->
                    <div class="flex items-start justify-between mb-1">
                        <div class="flex items-start space-x-2 sm:space-x-3 flex-1 min-w-0">
                            <button class="star-button ${isStarred ? 'starred' : ''} mt-1 flex-shrink-0" onclick="toggleStar('${aidArg}')" title="点击收藏">
                                <svg class="h-5 w-5 sm:h-6 sm:w-6" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                                </svg>
                            </button>
                            <h3 class="text-base sm:text-lg font-semibold text-black dark:text-white leading-tight break-words cursor-pointer hover:text-blue-600 dark:hover:text-blue-400 transition-colors" onclick="togglePaperDetail('${aidArg}')">${titleHtml}</h3>
                        </div>
                        <button class="delete-button text-slate-400 hover:text-red-500 ml-2 sm:ml-4 flex-shrink-0" onclick="deletePaperByButton(this)" data-arxiv-id="${aidHtml}" data-title="${titleAttr}" title="删除">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>

                    <!-- 论文元信息（始终可见） -->
                    <div class="space-y-1 mb-2">
                        <div class="flex flex-wrap items-center gap-2 sm:gap-4 text-xs sm:text-sm text-slate-600 dark:text-slate-400">
                            <span class="break-all"><strong>ArXiv ID:</strong> ${aidHtml}</span>
                            ${clusterBadge}
                            ${tagBadges}
                            <span class="whitespace-nowrap">${dateHtml}</span>
                        </div>
                        <div class="text-xs sm:text-sm text-black dark:text-white break-words">
                            <strong>作者:</strong> ${formatAuthorsWithAffiliations(paper.authors, paper.affiliations)}
                        </div>
                    </div>

                    <!-- 展开/收起指示器 -->
                    <div class="paper-expand-hint text-xs text-slate-400 dark:text-slate-500 cursor-pointer select-none" onclick="togglePaperDetail('${aidArg}')" id="expand-hint-${aidHtml}">
                        <span class="expand-arrow">▶</span> 点击标题展开详情
                    </div>

                    <!-- 懒加载的详情容器 -->
                    <div class="paper-detail hidden" id="detail-${aidHtml}"></div>
                </div>
            `;
        }

        // Build and inject paper detail DOM on first expand
        function buildPaperDetail(arxivId) {
            const container = document.getElementById(`detail-${arxivId}`);
            if (!container || container.getAttribute('data-built')) return;
            container.setAttribute('data-built', '1');

            const { paper, date } = paperDataMap[arxivId];
            if (!paper) return;

            const aid = String(paper.arxiv_id ?? '');
            const aidHtml = escapeHtml(aid);
            const aidArg = escapeJsSingleQuotedAttr(aid);
            const aidPath = safePathSegment(aid);
            const isRead = readPapers.has(aid);

            // Register all markdown content
            registerMarkdown(`filter-reason-${aid}`, paper.filter_reason);
            registerMarkdown(`intro-logic-${aid}`, paper.intro_logic);
            registerMarkdown(`core-insight-${aid}`, paper.core_insight);
            registerMarkdown(`methodology-${aid}`, paper.methodology);
            registerMarkdown(`additional-insights-${aid}`, paper.additional_insights);
            registerMarkdown(`research-value-${aid}`, paper.research_value);
            if (hasMeaningfulText(paper.summary)) registerMarkdown(`summary-en-${aid}`, paper.summary);
            if (hasMeaningfulText(paper.summary_translation)) registerMarkdown(`summary-zh-${aid}`, paper.summary_translation);

            let html = '';
            const hasSummaryEn = hasMeaningfulText(paper.summary);
            const hasSummaryZh = hasMeaningfulText(paper.summary_translation);

            // 已读复选框
            html += `
                <div class="mb-3 sm:mb-4 mt-3">
                    <label class="inline-flex items-center">
                        <input type="checkbox" ${isRead ? 'checked' : ''} onchange="toggleRead('${aidArg}')" class="rounded border-gray-300 text-blue-600 shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:ring-opacity-50 w-4 h-4">
                        <span class="ml-2 text-xs sm:text-sm text-slate-600 dark:text-slate-400">已阅读</span>
                    </label>
                </div>
            `;

            // 原始摘要
            html += `
                <div class="mb-3 sm:mb-4">
                    <div class="collapsible-header open text-sm sm:text-base" onclick="toggleCollapsible(this)">原始摘要</div>
                    <div class="collapsible-content open">
                        <div class="inner">
                            <div class="summary-section bg-green-50/70 dark:bg-green-950/20 border-l-3 border-green-300 p-3 sm:p-4 rounded-r-lg">
                                ${hasSummaryEn ? `
                                <div class="english-summary text-xs sm:text-sm text-black dark:text-white leading-relaxed markdown-content break-words" id="summary-en-${aidHtml}" style="display: block;">
                                </div>` : ''}
                                ${hasSummaryZh ? `
                                <div class="chinese-summary text-xs sm:text-sm text-black dark:text-white leading-relaxed markdown-content break-words" id="summary-zh-${aidHtml}" style="display: ${hasSummaryEn ? 'none' : 'block'};">
                                </div>` : ''}
                                ${!hasSummaryEn && !hasSummaryZh ? `
                                <div class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 leading-relaxed">
                                    暂无原始摘要。上游抓取或解析可能失败。
                                </div>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // 各分析section的配置
            const sections = [
                { key: 'intro_logic', id: `intro-logic-${aid}`, title: 'Introduction 逻辑链', color: 'yellow' },
                { key: 'core_insight', id: `core-insight-${aid}`, title: '核心切入点 / Pain Point', color: 'orange' },
                { key: 'methodology', id: `methodology-${aid}`, title: '方法论解读', color: 'purple' },
                { key: 'additional_insights', id: `additional-insights-${aid}`, title: '延伸洞察', color: 'red' },
                { key: 'research_value', id: `research-value-${aid}`, title: paper.research_value_source === 'reviewgrounder' ? 'ReviewGrounder 审稿' : '研究价值', color: 'teal' },
                { key: 'filter_reason', id: `filter-reason-${aid}`, title: '筛选原因', color: 'blue' },
            ];

            let renderedSections = 0;
            sections.forEach(s => {
                if (hasMeaningfulText(paper[s.key])) {
                    renderedSections += 1;
                    html += `
                        <div class="mb-3 sm:mb-4">
                            <div class="collapsible-header text-sm sm:text-base" onclick="toggleCollapsible(this)">${s.title}</div>
                            <div class="collapsible-content">
                                <div class="inner">
                                    <div class="bg-${s.color}-50/70 dark:bg-${s.color}-950/20 border-l-3 border-${s.color}-300 p-3 sm:p-4 rounded-r-lg">
                                        <div class="text-xs sm:text-sm text-black dark:text-white leading-relaxed markdown-content break-words" id="${escapeHtml(s.id)}">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            if (renderedSections === 0) {
                html += `
                    <div class="mb-3 sm:mb-4">
                        <div class="bg-amber-50/80 dark:bg-amber-950/20 border-l-3 border-amber-300 p-3 sm:p-4 rounded-r-lg text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
                            暂无扩展解析内容。通常是因为论文正文抓取失败、上游解析结果为空，或当天加载到了不完整的数据文件。
                        </div>
                    </div>
                `;
            }

            // 论文链接
            html += `
                <div class="flex flex-wrap gap-2">
                    <a href="https://arxiv.org/abs/${aidPath}" target="_blank" rel="noopener noreferrer"
                       class="inline-flex items-center px-2.5 py-1.5 sm:px-3 sm:py-2 text-xs sm:text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-md transition-colors whitespace-nowrap">
                        arXiv 原文
                    </a>
                    <a href="https://arxiv.org/pdf/${aidPath}.pdf" target="_blank" rel="noopener noreferrer"
                       class="inline-flex items-center px-2.5 py-1.5 sm:px-3 sm:py-2 text-xs sm:text-sm font-medium text-white bg-green-600 hover:bg-green-700 rounded-md transition-colors whitespace-nowrap">
                        PDF 下载
                    </a>
                    <a href="https://papers.cool/arxiv/${aidPath}" target="_blank" rel="noopener noreferrer"
                       class="inline-flex items-center px-2.5 py-1.5 sm:px-3 sm:py-2 text-xs sm:text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-md transition-colors whitespace-nowrap">
                        Cool Paper
                    </a>
                </div>
            `;

            container.innerHTML = html;

            // Render the open summary section's markdown immediately
            container.querySelectorAll('.collapsible-content.open').forEach(c => lazyRenderMarkdown(c));

            // Apply summary language setting
            if (showChineseSummary) {
                const ch = container.querySelector('.chinese-summary');
                const en = container.querySelector('.english-summary');
                if (ch) ch.style.display = 'block';
                if (en) en.style.display = 'none';
            } else {
                const ch = container.querySelector('.chinese-summary');
                const en = container.querySelector('.english-summary');
                if (ch) ch.style.display = 'none';
                if (en) en.style.display = 'block';
            }
        }

        // Toggle paper detail expansion
        function togglePaperDetail(arxivId) {
            const container = document.getElementById(`detail-${arxivId}`);
            const hint = document.getElementById(`expand-hint-${arxivId}`);
            if (!container) return;

            const isHidden = container.classList.contains('hidden');
            if (isHidden) {
                // First expand: build the DOM
                buildPaperDetail(arxivId);
                container.classList.remove('hidden');
                if (hint) {
                    hint.querySelector('.expand-arrow').textContent = '▼';
                    hint.childNodes[hint.childNodes.length - 1].textContent = ' 点击标题收起';
                }
            } else {
                container.classList.add('hidden');
                if (hint) {
                    hint.querySelector('.expand-arrow').textContent = '▶';
                    hint.childNodes[hint.childNodes.length - 1].textContent = ' 点击标题展开详情';
                }
            }
        }

        // 创建聚类HTML
        // Collect all papers from all clusters for a date into a flat list
        function collectPapersForDate(clusters, date) {
            let html = '';
            let count = 0;
            clusters.forEach(cluster => {
                if (cluster.papers) {
                    cluster.papers.forEach(paper => {
                        const paperHTML = createPaperHTML(paper, date);
                        if (paperHTML) {
                            html += `<li>${paperHTML}</li>`;
                            count++;
                        }
                    });
                }
            });
            return { html, count };
        }

        // Build tag filter bar HTML for a given date
        function buildTagFilterBar(date) {
            const tags = allPaperTags[date];
            if (!tags || tags.length === 0) return '';
            const dateArg = escapeJsSingleQuotedAttr(date);
            const filters = activeTagFilters[date] || new Set();
            const allActive = filters.size === 0;
            let html = '<div class="flex flex-wrap gap-1.5 mb-3">';
            html += `<button class="tag-btn ${allActive ? 'active' : ''}" onclick="toggleTagFilter('${dateArg}','All')">All</button>`;
            tags.forEach(tag => {
                const isActive = filters.has(tag.name);
                const tagArg = escapeJsSingleQuotedAttr(tag.name);
                html += `<button class="tag-btn ${isActive ? 'active' : ''}" onclick="toggleTagFilter('${dateArg}','${tagArg}')">${escapeHtml(tag.name)} &times;${escapeHtml(tag.count)}</button>`;
            });
            html += '</div>';
            return html;
        }

        // 渲染论文列表
        function renderPapers() {
            const mainContent = document.getElementById('main-content');
            const loading = document.getElementById('loading');

            if (loading) {
                loading.classList.add('hidden');
            }

            // Clear paper data map (rebuilt by createPaperHTML)
            Object.keys(paperDataMap).forEach(k => delete paperDataMap[k]);

            let html = '';
            let totalPapers = 0;

            for (const date in allPapers) {
                const clusters = allPapers[date] || [];
                const { html: papersHTML, count: dateVisibleTotal } = collectPapersForDate(clusters, date);
                const dateHtml = escapeHtml(date);

                totalPapers += dateVisibleTotal;

                html += `
                    <section class="mb-6 sm:mb-8" data-date-section="${dateHtml}">
                        <h2 class="text-base sm:text-lg font-medium text-slate-500 dark:text-slate-400 mb-3 sm:mb-4" data-date-heading="${dateHtml}">${dateHtml} (${escapeHtml(dateVisibleTotal)} 篇论文)</h2>
                `;

                // 添加该日期的AI论文速览（如果存在）
                if (dailyOverviews[date]) {
                    html += `
                        <div class="mb-3 sm:mb-4 bg-gradient-to-r from-blue-50 to-indigo-50 dark:from-slate-800 dark:to-slate-700 rounded-lg shadow-md p-3 sm:p-5">
                            <div class="collapsible-header" onclick="toggleCollapsible(this)">
                                <svg class="w-4 h-4 sm:w-5 sm:h-5 mr-2 text-blue-600 dark:text-blue-400 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path>
                                </svg>
                                <span class="font-semibold text-slate-900 dark:text-white text-sm sm:text-base">今日AI论文速览</span>
                            </div>
                            <div class="collapsible-content">
                                <div class="inner">
                                    <div class="markdown-content text-slate-700 dark:text-slate-200 text-xs sm:text-sm" id="overview-${date}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Add tag filter bar
                html += buildTagFilterBar(date);

                if (dateVisibleTotal === 0) {
                    html += `
                        <div class="bg-white dark:bg-slate-800/50 rounded-lg shadow-sm p-4 sm:p-5 lg:p-6">
                            <div class="text-sm sm:text-base text-slate-600 dark:text-slate-300 leading-relaxed">
                                今日数据已处理，但没有符合当前筛选条件的论文。
                            </div>
                        </div>
                    </section>
                    `;
                } else {
                    html += `
                        <div class="bg-white dark:bg-slate-800/50 rounded-lg shadow-sm p-3 sm:p-4 lg:p-6">
                            <ul class="space-y-3 sm:space-y-4">
                                ${papersHTML}
                            </ul>
                        </div>
                    </section>
                    `;
                }
            }

            // 添加"加载更多"按钮
            const unloadedCount = getUnloadedDates().length;
            if (unloadedCount > 0) {
                html += `
                    <div class="text-center py-6">
                        <button id="load-more-btn" onclick="loadMoreDates()"
                            class="inline-flex items-center px-6 py-3 text-base font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-md transition-all duration-200 hover:shadow-lg">
                            📥 加载更多 (还有 ${unloadedCount} 天)
                        </button>
                    </div>
                `;
            }

            mainContent.innerHTML = html;
            updateStats();

            // Register overview markdown and render visible content
            for (const date in dailyOverviews) {
                registerMarkdown(`overview-${date}`, dailyOverviews[date]);
            }
            renderVisibleMarkdown();

            // 更新 TOC
            buildToc();

        }

        // 主题切换功能
        function setupThemeToggle() {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const lightIcon = document.getElementById('theme-icon-light');
            const darkIcon = document.getElementById('theme-icon-dark');

            function updateThemeIcon() {
                if (document.documentElement.classList.contains('dark')) {
                    lightIcon.classList.add('hidden');
                    darkIcon.classList.remove('hidden');
                } else {
                    lightIcon.classList.remove('hidden');
                    darkIcon.classList.add('hidden');
                }
            }

            updateThemeIcon();

            themeToggleBtn.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
                updateThemeIcon();
            });
        }

        // 设置摘要语言切换功能
        function setupSummaryToggle() {
            const summaryToggleBtn = document.getElementById('summary-toggle');

            // 初始化按钮文本
            summaryToggleBtn.textContent = showChineseSummary ? '中文摘要' : 'English Summary';

            summaryToggleBtn.addEventListener('click', toggleSummaryLanguage);
        }

        // 设置筛选功能
        function setupFilter() {
            const filterStarredBtn = document.getElementById('filter-starred');
            const filterAllBtn = document.getElementById('filter-all');

            filterStarredBtn.addEventListener('click', () => {
                showOnlyStarred = true;
                updateFilterButtons();
                renderPapers();
            });

            filterAllBtn.addEventListener('click', () => {
                showOnlyStarred = false;
                updateFilterButtons();
                renderPapers();
            });

            updateFilterButtons();
        }

        // 更新筛选按钮状态
        function updateFilterButtons() {
            const filterStarredBtn = document.getElementById('filter-starred');
            const filterAllBtn = document.getElementById('filter-all');

            if (showOnlyStarred) {
                filterStarredBtn.className = 'px-3 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors';
                filterAllBtn.className = 'px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 rounded-md hover:bg-slate-200 dark:hover:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 transition-colors';
            } else {
                filterStarredBtn.className = 'px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 rounded-md hover:bg-slate-200 dark:hover:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 transition-colors';
                filterAllBtn.className = 'px-3 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors';
            }
        }

        // ========== TOC 侧边栏功能 ==========
        let tocSidebarOpen = true;

        function toggleTocSidebar() {
            const sidebar = document.getElementById('toc-sidebar');
            const toggle = document.getElementById('toc-toggle');
            tocSidebarOpen = !tocSidebarOpen;
            if (tocSidebarOpen) {
                sidebar.classList.remove('collapsed');
                toggle.classList.add('sidebar-open');
                toggle.querySelector('svg').style.transform = 'rotate(180deg)';
            } else {
                sidebar.classList.add('collapsed');
                toggle.classList.remove('sidebar-open');
                toggle.querySelector('svg').style.transform = 'rotate(0deg)';
            }
            localStorage.setItem('tocSidebarOpen', tocSidebarOpen);
        }

        function buildToc() {
            const tocList = document.getElementById('toc-list');
            if (!tocList) return;

            let html = '';
            // 遍历目录项：两周窗口内的全部日期，加上窗口外但已因收藏而加载进来的日期。
            const tocDates = availableDates.filter(
                date => windowDateSet.has(date) || loadedDates.has(date)
            );
            for (const date of tocDates) {
                const isLoaded = loadedDates.has(date);
                let papers = [];

                if (isLoaded && allPapers[date]) {
                    const clusters = allPapers[date];
                    clusters.forEach(cluster => {
                        if (cluster.papers) {
                            cluster.papers.forEach(paper => {
                                if (!deletedPapers.has(paper.arxiv_id) && (!showOnlyStarred || starredPapers.has(paper.arxiv_id))) {
                                    if (paperMatchesFilters(paper, date)) {
                                        papers.push(paper);
                                    }
                                }
                            });
                        }
                    });
                }

                const countLabel = isLoaded ? papers.length : '...';
                const dimClass = isLoaded ? '' : ' opacity-50';
                const dateHtml = escapeHtml(date);
                const dateArg = escapeJsSingleQuotedAttr(date);

                html += `<div class="mb-1" data-toc-date="${dateHtml}">`;
                html += `<div class="toc-date${dimClass}" onclick="tocToggleDate(this, '${dateArg}')" data-toc-date-btn="${dateHtml}">`;
                html += `<span class="toc-date-arrow">▶</span>`;
                html += `<span>${dateHtml}</span>`;
                html += `<span class="text-xs text-slate-400 ml-auto">${escapeHtml(countLabel)}</span>`;
                html += `</div>`;
                html += `<div class="toc-papers" data-toc-papers="${dateHtml}">`;
                if (isLoaded) {
                    papers.forEach(paper => {
                        const title = paper.title.length > 50 ? paper.title.substring(0, 47) + '...' : paper.title;
                        const aidHtml = escapeHtml(paper.arxiv_id);
                        const aidArg = escapeJsSingleQuotedAttr(paper.arxiv_id);
                        html += `<div class="toc-paper" onclick="tocScrollToPaper('${aidArg}')" data-toc-paper="${aidHtml}" title="${escapeHtml(paper.title)}">${escapeHtml(title)}</div>`;
                    });
                } else {
                    html += `<div class="toc-paper opacity-50" onclick="tocLoadAndScrollToDate('${dateArg}')">点击加载...</div>`;
                }
                html += `</div></div>`;
            }
            tocList.innerHTML = html;
        }

        async function tocLoadAndScrollToDate(date) {
            // 加载该日期之前的所有未加载日期
            const unloaded = getUnloadedDates();
            const idx = unloaded.indexOf(date);
            if (idx < 0) return;
            const datesToLoad = unloaded.slice(0, idx + 1);
            for (const d of datesToLoad) {
                try {
                    const response = await fetch(`data/${d}.json?v=${DATA_VERSION}`);
                    if (response.ok) {
                        const dateData = await response.json();
                        allPapers[d] = dateData.clusters || [];
                        allPaperTags[d] = dateData.tags || [];
                        if (dateData.overview) dailyOverviews[d] = dateData.overview;
                        loadedDates.add(d);
                    }
                } catch (e) {
                    console.error(`加载 ${d} 失败:`, e);
                }
            }
            renderPapers();
            // 等待 DOM 更新后滚动
            setTimeout(() => tocScrollToDate(date), 100);
        }

        function tocToggleDate(el, date) {
            const isLoaded = loadedDates.has(date);
            if (!isLoaded) {
                tocLoadAndScrollToDate(date);
                return;
            }
            const arrow = el.querySelector('.toc-date-arrow');
            const papers = document.querySelector(`[data-toc-papers="${cssEscape(date)}"]`);
            if (papers) {
                papers.classList.toggle('open');
                arrow.classList.toggle('open');
            }
            // 同时滚动到对应日期
            tocScrollToDate(date);
        }

        function tocScrollToPaper(arxivId) {
            const el = document.querySelector(`[data-arxiv-id="${cssEscape(arxivId)}"]`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                // 短暂高亮
                el.style.outline = '2px solid #3b82f6';
                el.style.outlineOffset = '2px';
                setTimeout(() => {
                    el.style.outline = '';
                    el.style.outlineOffset = '';
                }, 2000);
            }
        }

        function tocScrollToDate(date) {
            const section = document.querySelector(`[data-date-section="${cssEscape(date)}"]`);
            if (section) {
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // 滚动时高亮当前可见的日期
        let tocScrollTimer = null;
        function setupTocScrollSpy() {
            window.addEventListener('scroll', () => {
                if (tocScrollTimer) clearTimeout(tocScrollTimer);
                tocScrollTimer = setTimeout(() => {
                    const sections = document.querySelectorAll('[data-date-section]');
                    let currentDate = null;
                    const scrollTop = window.scrollY + 100;

                    sections.forEach(section => {
                        if (section.offsetTop <= scrollTop) {
                            currentDate = section.getAttribute('data-date-section');
                        }
                    });

                    // 更新 TOC 高亮
                    document.querySelectorAll('.toc-date').forEach(el => el.classList.remove('active'));
                    if (currentDate) {
                        const activeBtn = document.querySelector(`[data-toc-date-btn="${cssEscape(currentDate)}"]`);
                        if (activeBtn) {
                            activeBtn.classList.add('active');
                            // 确保活跃日期在 TOC 可视区域内
                            const tocInner = document.getElementById('toc-inner');
                            if (tocInner) {
                                const btnRect = activeBtn.getBoundingClientRect();
                                const tocRect = tocInner.getBoundingClientRect();
                                if (btnRect.top < tocRect.top || btnRect.bottom > tocRect.bottom) {
                                    activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                                }
                            }
                        }
                    }
                }, 100);
            });
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', function() {
            loadState();
            setupThemeToggle();
            setupSummaryToggle();
            setupFilter();
            renderPapers();
            buildToc();
            setupTocScrollSpy();

            // 异步加载窗口外被收藏论文所在日期，加载完成后会重新渲染并内联显示
            loadArchivedStarredDates();

            // 恢复 TOC 侧边栏状态
            const savedTocState = localStorage.getItem('tocSidebarOpen');
            if (savedTocState === 'false') {
                tocSidebarOpen = true; // will be toggled to false
                toggleTocSidebar();
            }
        });
    </script>
</body>
</html>
