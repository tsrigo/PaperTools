 计算中引入高斯噪声，以模拟 renewable generation 的预测误差和 load fluctuation。在这个 stochastic environment 中，一个在确定性 shadow simulator 中被验证为严格满足 product order（即 overloaded-branch support 不扩张且 per-branch severity 非递增）的 proposal，在真实系统中极有可能因为微小的随机扰动导致某个 branch 的 severity 出现瞬时微增（即 $\\text{sev}_{t+1}(i) = \\text{sev}_t(i) + \\epsilon$）。由于 SiLR 的 admission criterion 是严格的结构化偏序关系，任何微小的 severity 增加都会导致该 proposal 被拒绝。这种严格性在非确定性环境中会引发一种新型的 **stochastic deadlock（随机死锁）**：agent 提出的所有本质上能推动恢复的 proposal，都会因为噪声引起的局部 severity 微增而被 gate 反复拦截，导致轨迹永远无法收敛至 fully recovered state。相反，传统的 scalar aggregate gate 由于将多维 penalty 投影为一维标量，反而对这种微小的局部扰动具有天然的平滑和容忍度。因此，我的反例不仅挑战了 SiLR 在真实物理系统中的适用性，还提出了一个强有力的替代解释：SiLR 在确定性环境中的高成功率恰恰源于其绝对的严格性，而这种严格性在 stochastic 环境下会退化为致命的脆弱性，使得被其批评的 scalar gate 在真实噪声场景下反而表现出更高的 recovery throughput 和鲁棒性。\n\n### § 12 Follow-up Research Idea\n驱动这一研究想法的局限是 SiLR 完全依赖确定性的 shadow execution，无法处理真实物理系统中的 epistemic uncertainty（认知不确定性）和 aleatoric uncertainty（偶然不确定性）。为了突破这一局限，我们可以借鉴 Robust Model Predictive Control (RMPC) 和 Chance-Constrained Optimization 的理论工具，将 LLM agent 的 runtime enforcement 从确定性逻辑重构为 **Probabilistic Runtime Enforcement（概率运行时强制）**。具体而言，不再要求 proposal 严格满足确定性的 product order，而是定义一个 **Chance-Constrained Product Order**：即 proposal 被准入的条件是，其执行后 overloaded-branch support 扩张的概率，以及任意 branch severity 增加的概率，均低于预设的风险阈值 $\\delta$。这种 framing 将 LLM tool agent 的安全门控从非黑即白的逻辑判断，转化为在风险预算内的概率安全边界管理，从而允许 agent 在存在模拟误差的情况下依然取得恢复进展。第一个实验将在注入了随机 load fluctuation 和 renewable forecasting error 的 Gym-ANM 环境中进行，对比确定性 SiLR、传统 scalar gate 以及提出的 Chance-Constrained SiLR。我们将测量在递增的噪声方差下，三种 gate 的 recovery success rate、stochastic deadlock 频率以及 risk exposure（实际发生的 severity 增加总量）。如果实验证明 Chance-Constrained SiLR 能够在保持可接受安全水平的同时，显著打破 deadlock 并提高多步恢复效率，则验证了该新框架的有效性。这与现有的 SARC、AgentSpec 或 SiLR 等基于确定性验证的工作截然不同，后者均假设 simulator 与 live system 之间存在完美对齐，而本提议首次将 LLM agent 的 runtime governance 置于不确定性量化与鲁棒控制的框架内，打开了通往真实物理世界部署的理论通道。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Chenyu Zhou\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Qiliang Jiang\", \"affiliations\": [2], \"markers\": [\"*\"]},\n    {\"name\": \"Shuning Wu\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Xu Zhou\", \"affiliations\": [3], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Institute of Science Tokyo\"},\n    {\"id\": 2, \"name\": \"Zhejiang University\"},\n    {\"id\": 3, \"name\": \"National University of Singapore\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"These authors contributed equally.\"}\n  ]\n}\n```", "summary_translation": "LLM tool agent 的 runtime gate 通常被设定为一个 filter。在 ReAct loop 中，被拒绝的 proposal 之后会在同一 state 下生成另一个 proposal，因此该 gate 是作用于 proposal stream 上的 search operator，其 admission criterion 决定了哪些 trajectories 是可达的。我们研究了 post-violation recovery admission，即在系统仍处于 violation 状态时必须 admit progress，并识别出了 scalar projection trap：aggregate-score gate 会接受局部改善的 proposal，从而将 trajectory 锁定在 plateau。SiLR 则对每个 proposal 进行 shadow-executes，并在基于 branch-level violation state（overloaded-branch support 和 per-branch severity）的 product order 下对其进行 admit。我们证明了没有任何 scalar surrogate 对该 order 是 sound 的，因此这种失败是 representational 的，而非 threshold tuning 的问题。在 mined Gym-ANM scenarios 上，SiLR 恢复了 21/21 的 multi-action episodes，而 terminal 为 0/21，最佳 scalar gate 为 9/21，这在完整的 24-scenario benchmark 上具有显著性。terminal-versus-structured dichotomy 在三个 model families 以及 CityLearn 中均成立。由于 admission 依赖于 deterministic simulation，LLM 被置于 trust boundary 之外：一种能击败 scalar 和 support-only baselines 的 magnitude-redistribution attack，只能被完整的 per-branch predicate 所遏制。在激活两个 constraint families 的情况下，所有测试的 scalar projection 都 admit 了 physically unsafe actions；support-only admit 的比例最高（占 42,410 次中的 63.2%；product order 为 0）。在最难的 dual-family traces 中，scalar gates 仅能通过该 unsafe class 进行恢复。作为 GRPO process reward 被重用时，它在每个 mined scenario 中的表现均优于其 count projection，并且是唯一一个 ungated policy 超过 untrained base 的测试 reward（0.844 vs. 0.778）。Scalar projection 在两个 design points 处都丢失了 violation geometry；只有完整的 product order 才是 structurally sufficient 的。"}, {"title": "RISE: Recursive Improvement via Self-Extrapolating Policy Distillation", "arxiv_id": "2609.05295", "authors": "Yang Li, Semih Yavuz, Shafiq Joty", "summary": "On-policy distillation (OPD) provides dense, per-token supervision for language model post-training, but its effectiveness is bottlenecked by teacher quality: external teachers suffer from distribution mismatch, while self-distillation with privileged conditioning is limited by in-context learning capacity. We propose \\textbf{RISE} (\\textbf{R}ecursive \\textbf{I}mprovement via \\textbf{S}elf-\\textbf{E}xtrapolating Policy Distillation), which constructs a synthetic teacher directly from the model's own RLVR training trajectory. By extrapolating the displacement between the current checkpoint and a trailing anchor---in parameter space or output logit space---RISE converts a sparse outcome-induced parameter update into a dense token-level target, without any external model or privileged conditioning. RISE combines RLVR and OPD in a complementary loop: outcome rewards ground the extrapolation toward correct reasoning, while the extrapolated teacher refines token-level decisions. Moreover, since the teacher is refreshed every iteration as the student improves, distillation becomes a recursive improvement mechanism rather than a one-shot compression step. Experiments spanning mathematical reasoning, multi-domain STEM, code generation, and multi-turn agentic tasks show that RISE outperforms RLVR-only training and on-policy self-distillation across all settings.", "category": "cs.AI", "cluster": "Agent Training \u0026 RL", "tags": ["cs.AI"], "filter_reason": "论文提出了 RISE（Recursive Improvement via Self-Extrapolating Policy Distillation），其核心贡献是构建了一种基于模型自身训练轨迹的递归自我改进机制。该机制通过外推当前检查点与先前锚点之间的差异来生成密集的 token 级监督信号，将蒸馏过程转化为一个持续的递归改进循环，而非一次性的压缩。这完全符合筛选标准中关于“自我演化”和“LLMs Improving LLMs”的核心定义。此外，论文摘要明确指出其实验验证包含了“multi-turn agentic tasks”（多轮智能体任务），表明该方法不仅限于基础推理，也直接应用于提升 LLM 智能体的能力。因此，该论文属于智能体训练与自我演化的前沿研究，符合保留标准。", "intro_logic": "### § 1 研究问题与重要性\n\n本文解决的核心问题是：在on-policy distillation (OPD) 中，如何在不依赖外部模型或privileged conditioning的前提下，构建一个可靠的per-token teacher，从而将RLVR产生的稀疏sequence-level reward信号转化为dense token-level supervision，实现语言模型的递归自我改进。这一问题的重要性源于LLM post-training中一个根本性的信号瓶颈：RLVR/RLHF等方法仅提供sequence-level的标量反馈——一个outcome reward、一个binary accept/reject标签或一个scalar preference——无法告知模型哪些token导致了成功或失败，造成credit assignment瓶颈。OPD本可以提供更丰富的per-token分布监督，但其有效性完全取决于teacher quality：外部teacher在student探索新推理路径时产生prefix distribution mismatch，而on-policy self-distillation (OPSD) 依赖privileged conditioning又受限于模型自身的in-context learning (ICL) 能力。RISE通过外推模型自身RLVR训练轨迹中的displacement向量来合成一个\"未来自我\"作为teacher，将稀疏的outcome-induced参数更新转化为dense token-level目标，无需任何外部知识或特权信息。该方法在数学推理、多领域STEM、代码生成和多轮agentic任务上全面超越RLVR-only和OPSD baselines，同时保持OOD性能并提升sample efficiency，仅带来1.3–1.6×的wall-time开销且无额外采样成本。\n\n### § 2 前人工作与不足\n\n该问题此前未被充分解决，现有方法在teacher来源上存在根本性缺陷。RLVR方法如GRPO和DAPO通过group-normalized outcome rewards估计per-token advantages，但同一response内所有token获得相同的advantage估计，梯度信号无法区分有益与有害的推理步骤。External teacher OPD直接使用更强的外部模型作为teacher，但当student在训练中探索越来越多样的推理路径时，teacher在这些out-of-distribution prefixes上产生的分布反映的是teacher自身如何从陌生上下文继续生成，而非student推理是否正确——这种prefix distribution mismatch恰在student最需要指导的novel或challenging推理步骤处最为严重。OPSD尝试用同一模型作为teacher和student，通过向teacher提供正确答案等privileged context来获得更知情的分布，但存在两个结构性限制：其一，模型的ICL能力可能不足以有效整合privileged context以产生真正更优的分布；其二，teacher和student看到不同输入造成另一种distribution mismatch——teacher的分布可能以不可迁移甚至有害的方式反映privileged context。针对这些缺陷，近期工作提出了多种heuristic remedies：token-level gating根据teacher-student概率差距选择性加权per-token loss，divergence mixing在前向和反向KL之间插值，DAgger-style rollout mixing交错teacher和student token以保持prefix on-distribution，trajectory refinement在distillation前先优化rollout质量。这些方法共同的问题在于：它们都接受一个有缺陷的teacher作为既定事实，工程化地容忍其噪声，而非追问是否存在更好的teacher。在joint RLVR+OPD方向上，ExOPD将OPD形式化为dense KL-constrained RL，但其teacher是训练前固定的静态外部策略，无论student如何进步，teacher gap $J(\\pi^*) - J(\\pi_T)$ 始终不变，构成一个hard ceiling；RLSD用OPD重加权GRPO的advantage估计以实现更细粒度的credit assignment，但同样依赖privileged-conditioned teacher。RISE与这些方法的根本区别在于：它不接受任何给定的teacher，而是从模型自身训练轨迹中构造teacher——通过外推当前checkpoint与trailing anchor之间的displacement，利用post-training轨迹的低维近线性特性（前三个主成分捕获约87%方差）合成一个沿改进方向前移的未来策略，且每轮迭代刷新teacher使其随student进步而同步前进，从而将OPD从一次性压缩转变为递归改进循环。", "core_insight": "### § 3 重建作者的思考路径\n\n作者从 On-policy distillation (OPD) 的核心瓶颈出发：OPD 能提供 dense per-token supervision，但其有效性完全取决于 teacher quality。现有路径要么依赖 external teacher 导致 prefix distribution mismatch——当 student 探索到 teacher 未见过的推理路径时，teacher 的分布变得不可靠；要么依赖 privileged conditioning 的 self-distillation，但受限于模型自身的 in-context learning (ICL) capability，且 teacher 和 student 看到不同输入会造成另一种 distribution mismatch。各种 heuristic remedies（token-level gating、divergence mixing、DAgger-style sampling、trajectory refinement）都在接受有缺陷的 teacher 的前提下试图容忍其噪声，而非追问一个更根本的问题：teacher 应该是什么？\n\n一个自然的候选者是策略自身的 converged future self $\\pi^*$——训练正在收敛到的那个策略。虽然 $\\pi^*$ 未知，但 training trajectory 本身揭示了收敛方向。关键的理论线索来自 model merging 和 post-training 动力学的经验发现：task vectors 在 parameter space 中表现出近似线性的可组合性，fine-tuning trajectories 具有 linear mode connectivity，RLVR 的 parameter updates 被 rank-1 subspace 主导且投影系数近线性演化。这些证据共同表明，post-training 轨迹被限制在低维子空间中，沿着训练方向进行 extrapolation 是一种 principled approximation——model soups 已经利用这种线性结构通过 interpolation（$\\beta \\in [0,1]$）提升 robustness，那么 extrapolation（$\\beta \u003E 1$）理应能用于 capability improvement。\n\n但 extrapolation 本身是 direction-agnostic 的：它会放大模型所做的任何 update，无论质量如何。如果 displacement 方向错误，反复 extrapolation 只会放大错误。作者通过将 RLVR 引入循环来解决这个问题：outcome rewards 产生 update $\\theta \\to \\theta'$，确保 displacement grounded in verified improvement。RLVR 提供有意义的方向，OPD 则将这个方向转化为 fine-grained 的 token-level supervision——两种信号互补。\n\n这种构造天然是 iterative 的：每次 distillation refine 当前策略，refined 策略又为下一次 extrapolation 提供新的 displacement。这使得 distillation 从 one-shot compression step 变为 recursive improvement loop。作者进一步在两个空间中 instantiate 这个想法：weight-space extrapolation 直接对参数做 task arithmetic，产生一个 coherent 的 teacher model；logit-space extrapolation 对 output log-probabilities 做 geometric mixture，是 weight-space 的 first-order Taylor approximation，计算更轻量但牺牲了 cross-position 的一致性。\n\n实践层面，作者需要处理两个关键问题。第一，safe extrapolation range 随训练收敛而缩小——在 linear trajectory 假设下，当 $\\alpha_n \\to \\alpha^*$ 时，$\\beta$ 的上界 $2\\alpha^*/\\alpha_n - 1$ 趋向 1，因此需要 monotonically decreasing 的 $\\beta$ schedule。第二，直接采用 extrapolated point 作为下一策略会超出 trust region，导致 degenerate behavior；OPD 的真正角色是 trust-region projection——将策略移向 extrapolated teacher 的 token-level distribution，同时通过 divergence term 保持更新锚定在 post-RLVR checkpoint 附近。\n\n### § 4 核心 Intuition\n\nRLVR 提供正确的改进方向但信号稀疏（sequence-level reward 无法区分哪些 token 有贡献），OPD 提供密集的 token-level 监督但受限于 teacher quality。RISE 的核心洞察是：模型自身的 training trajectory 已经编码了改进方向，通过沿着这个方向 extrapolation 当前 checkpoint 与之前 anchor 之间的 displacement，可以合成一个\"未来的自己\"作为 teacher——既无需 external model 也无需 privileged conditioning，且因为 teacher 沿着 student 自身的优化路径外推，distribution mismatch 被最小化。RLVR 确保外推方向指向真实改进，OPD 将这个方向转化为细粒度的 token-level 监督，两者互补形成递归自我改进循环，而非一次性的知识压缩。", "methodology": "§ 5 具体方法与完整 Pipeline\n```text\n+-----------+      RLVR Update      +-----------+\n|  Anchor   |  -------------------\u003E |  Current  |\n|  theta_n  |      (Outcome R)      |  theta'_n |\n+-----------+                       +-----------+\n      |                                   |\n      |          Displacement             |\n      +-----------------------------------+\n                      |\n                      v\n             +------------------+  Extrapolate (beta \u003E 1)\n             |  Synthetic Teacher  |\n             |  theta_future     |\n             +------------------+\n                      |\n                      v\n             +------------------+  OPD (per-token)\n             |  Refined Student   |\n             |  theta_{n+1}      |\n             +------------------+\n                      |\n                      +-----------------\u003E (Next Iteration)\n```\n**节点解释**：\n1. **Anchor \u0026 Current Checkpoint**：从模型自身的 RLVR 训练轨迹中提取早期的 trailing anchor $\\theta_n$ 和经过 RLVR 更新后的当前 checkpoint $\\theta'_n$。RLVR 使用 outcome rewards 进行更新，确保 displacement 方向指向真实的改进。\n2. **Displacement Calculation**：在 representation map $\\phi$ 下计算 displacement $\\phi(\\pi_{\\theta'_n}) - \\phi(\\pi_{\\theta_n})$。$\\phi$ 可以实例化为 weight-space（参数空间，即 task arithmetic）或 logit-space（输出分布的几何混合）。\n3. **Extrapolation**：通过外推因子 $\\beta \u003E 1$ 合成未来 teacher：$\\phi(\\pi_{\\theta_n}) + \\beta \\times (\\phi(\\pi_{\\theta'_n}) - \\phi(\\pi_{\\theta_n}))$。这放大了模型最近的更新，沿训练轨迹投影到当前状态之外，无需外部模型或 privileged conditioning。\n4. **On-Policy Distillation (OPD)**：使用合成的 teacher $\\theta_{\\text{future}}$ 对当前 checkpoint $\\theta'_n$ 进行 on-policy distillation，提供 dense per-token supervision，得到 refined student $\\theta_{n+1}$。\n5. **Recursive Loop**：$\\theta_{n+1}$ 成为下一轮的输入，teacher 每次迭代刷新，使 distillation 成为递归自我改进机制，而非一次性的压缩步骤。\n\n§ 7 实验设计与结论\n- **提出问题**：RISE 能否通过外推模型自身的 RLVR 轨迹来构建可靠的 teacher，从而在多种任务上实现递归自我改进，并克服外部 teacher 的 distribution mismatch 和 self-distillation 的 ICL 限制？\n- **实验验证**：在 mathematical reasoning、multi-domain STEM、code generation 和 multi-turn agentic tasks 四类任务上进行实验，对比 RLVR-only 和 on-policy self-distillation (OPSD) baselines。同时评估 sample efficiency 和 wall-time overhead，并对 logit-space 和 weight-space 两种外推方式进行 ablation。\n- **结论**：RISE 在所有任务设置上均全面超越 RLVR-only 和 OPSD baselines。该方法提升了 sample efficiency，且无额外采样成本，仅带来 1.3–1.6× 的 wall-time 开销。Ablation 证实了两种 representation space 的有效性及其计算与统计上的 trade-offs。", "additional_insights": "### § 8 Take-aways\nRISE 提出了一种新的 on-policy distillation (OPD) 方法，通过在 parameter space 或 output logit space 中外推模型自身的 RLVR 训练轨迹来构建合成 teacher，从而避免了外部 teacher 的 distribution mismatch 和 privileged conditioning 的局限性。该方法将 RLVR 和 OPD 结合在一个互补的循环中：RLVR 提供基于 outcome reward 的稀疏但方向正确的参数更新，OPD 则将外推 teacher 的 dense token-level 分布蒸馏回 student，实现细粒度的 credit assignment。由于 teacher 在每次迭代中都会根据 student 的最新更新刷新，distillation 变成了一个 recursive improvement 机制，而非一次性的模型压缩。实验表明，RISE 在数学推理、多领域 STEM、代码生成和多轮 agentic tasks 上均优于仅使用 RLVR 的训练和现有的 OPSD baselines，且具有更好的 sample efficiency，仅增加 1.3-1.6 倍的 wall-time overhead。\n\n### § 9 最脆弱的假设\nRISE 最核心且失败代价最大的假设是：post-training 的训练轨迹在低维子空间中近似线性演化，因此沿着当前 displacement 方向进行线性外推（$\\beta \u003E 1$）可以合理地近似一个更优的未来 checkpoint。如果这个假设不成立，外推得到的 teacher 将会严重偏离真实的优化路径，导致 teacher 质量低下甚至产生 degenerate behavior，此时 OPD 阶段不仅无法提供有效的 dense supervision，反而会引入噪声，直接破坏 RISE 的自我改进机制。在实际中，LLM 的损失景观高度非凸，随着训练的进行或任务的复杂化，参数更新的方向可能会发生剧烈变化（高曲率），线性外推极易超出 trust region。论文为该假设提供了一定证据：在 Appendix A.3 中，通过对 GRPO checkpoints 的位移进行主成分分析，发现前三个主成分捕获了约 87% 的方差，证明了轨迹确实被限制在低维子空间中；同时 Figure 6 的实验显示，随着训练的进行，安全的 $\\beta$ 范围会急剧缩小，这直接印证了线性假设的局部性。然而，论文缺少在更复杂、非平稳或高度多模态任务下该线性假设是否依然成立的广泛验证，且其理论分析（Proposition 3）完全依赖于理想的线性轨迹前提。\n\n### § 10 最小复现实验\n如果有一周时间，可以设计一个最小实验来验证 RISE 的核心几何前提：“沿着 RLVR 训练轨迹进行线性外推可以生成一个更优的 teacher”。不需要实现完整的 RISE 训练循环，只需验证外推本身的有效性。使用一个较小的模型（如 Qwen3-1.7B）和一个中等规模的数学推理数据集（如 DAPOMath 的子集）。首先，运行标准的 GRPO (RLVR) 训练若干步，保存多个 checkpoints（如 step 10, 50, 100）。然后，在 parameter space 中，取某个 checkpoint $\\theta_n$ 和一个较早的 anchor $\\theta_0$，计算外推参数 $\\theta_{\\text{future}} = \\theta_0 + \\beta \\cdot (\\theta_n - \\theta_0)$（取 $\\beta=1.2$）。直接在测试集（如 AIME'24）上评估这个外推模型 $\\theta_{\\text{future}}$ 的 accuracy，并与原始 checkpoint $\\theta_n$ 进行比较。测量指标为 avg@16 accuracy。如果 $\\theta_{\\text{future}}$ 的 accuracy 显著高于 $\\theta_n$，则支持“线性外推能产生更优未来 policy”的 claim；如果 accuracy 下降或模型输出崩溃，则反驳了该假设，说明外推超出了线性区域。这能在不实现 OPD 循环的情况下，以极低的计算成本验证 RISE 的几何基础。", "research_value": "### § 11 最强反例设计\n\n如果我要反对这篇论文，最有力的攻击不是质疑实验结果的统计显著性，而是直接挑战RISE的核心几何前提——即RLVR训练轨迹在低维子空间中近似线性演化，因此线性外推能合成一个更优的teacher。我会设计一个**任务级反例**，选择一类**高度多模态且非平稳的推理任务**，例如**多轮工具调用（multi-turn tool-calling）**，其中模型需要根据环境反馈动态调整策略。在这类任务中，RLVR的reward信号不仅取决于推理步骤的正确性，还取决于工具调用的顺序和时机，导致参数更新方向在训练过程中频繁反转或跳跃（高曲率）。具体实验：使用一个中等规模的agentic benchmark（如SWE-bench或ToolBench的子集），运行标准的GRPO训练，保存checkpoints，然后计算相邻checkpoint之间的displacement向量。如果对这些displacement进行主成分分析，前三个主成分的方差占比很可能远低于论文中数学推理任务的87%（例如可能只有40-50%），因为agentic任务的损失景观更崎岖。然后，按照RISE的方式在parameter space中外推teacher（β=1.2），并在测试集上评估外推模型的avg@16 accuracy。我预测：外推模型的accuracy不仅不会高于当前checkpoint，反而会显著下降，甚至出现输出崩溃（如重复循环或语法错误）。这个反例直接攻击了RISE最脆弱的假设，并提供了一个可复现的失败场景。此外，我还可以提出一个**替代解释**：RISE在数学推理上的提升并非来自外推teacher的优越性，而是来自OPD阶段本身提供的dense supervision——即使使用一个随机噪声teacher（例如将当前checkpoint的logits加上高斯噪声），只要保持on-policy rollout，也可能因为增加了训练信号的多样性而带来微小提升。为了验证这一点，可以设计一个消融实验：将RISE中的外推teacher替换为当前checkpoint本身（即β=1，无外推），如果性能仍然接近RISE，则说明外推是多余的。\n\n### § 12 Follow-up Research Idea\n\n基于RISE最核心的局限——线性外推假设的局部性和脆弱性——我提出一个非增量的新研究方向：**“流形感知的递归蒸馏（Manifold-Aware Recursive Distillation, MARD）”**。核心思想是放弃参数空间中的线性外推，转而将RLVR训练轨迹建模为**低维流形上的连续路径**，并利用**神经ODE（Neural ODE）或流形学习**来学习轨迹的动力学，从而合成一个更可靠的未来teacher。这个想法的驱动需求是：RISE的线性假设在复杂任务中必然失效，但训练轨迹确实被限制在低维子空间中（论文已证明），因此我们可以用更精确的非线性模型来外推。相邻领域可以借鉴**连续学习（continual learning）中的参数轨迹建模**和**模型融合（model fusion）中的几何插值方法**。具体而言，在训练过程中，我们不仅保存checkpoints，还记录每个checkpoint在低维流形上的嵌入（例如通过PCA或autoencoder降维）。然后，训练一个轻量级的神经ODE来拟合这些嵌入点随时间的变化，学习轨迹的微分方程。在蒸馏阶段，我们不是线性外推，而是从当前嵌入点出发，沿着神经ODE预测的方向积分一小步（例如未来1-2个训练步），得到合成teacher的嵌入，再解码回参数空间。第一个实验可以这样设计：在RISE的数学推理设置上，比较三种teacher合成方式——线性外推（RISE）、神经ODE外推（MARD）、以及一个上界（使用真实未来checkpoint作为teacher）。如果MARD在AIME'24上的avg@16 accuracy显著高于RISE，且更接近上界，则证明非线性建模的必要性。这个方向与已有工作的区别在于：RISE假设轨迹是直线，而MARD假设轨迹是弯曲但可学习的流形路径；同时，MARD不依赖任何外部模型或privileged conditioning，完全从模型自身训练历史中学习动力学，因此保留了RISE的递归自我改进精神，但大幅提升了teacher合成的鲁棒性。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Yang Li\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Semih Yavuz\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Shafiq Joty\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Salesforce AI Research\"}\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "On-policy distillation (OPD) 为语言模型 post-training 提供了密集的 per-token 监督，但其有效性受限于 teacher 质量：external teacher 存在 distribution mismatch 问题，而带有 privileged conditioning 的 self-distillation 则受限于 in-context learning 能力。我们提出 RISE (Recursive Improvement via Self-Extrapolating Policy Distillation)，该方法直接从模型自身的 RLVR training trajectory 中构建 synthetic teacher。通过在 parameter space 或 output logit space 中外推 current checkpoint 与 trailing anchor 之间的位移，RISE 将稀疏的 outcome-induced parameter update 转换为密集的 token-level target，且无需任何 external model 或 privileged conditioning。RISE 将 RLVR 和 OPD 结合在一个互补循环中：outcome reward 将外推锚定至正确推理，而 extrapolated teacher 则细化 token-level 决策。此外，由于 teacher 在每次迭代中随着 student 的改进而刷新，distillation 成为一种 recursive improvement 机制，而非 one-shot compression 步骤。涵盖数学推理、multi-domain STEM、代码生成和 multi-turn agentic tasks 的实验表明，RISE 在所有设置下均优于 RLVR-only training 和 on-policy self-distillation。"}, {"title": "What Does Multi-Harness RL Learn? Credit Assignment and Portability in Coding Agents", "arxiv_id": "2609.04518", "authors": "Chenqian Le, Jiayi Cheng, Qijia He, Runhao Li, Yinghao Li, Xupeng Chen", "summary": "Agent reinforcement learning (RL) increasingly runs through full execution harnesses, and a multi-harness recipe mixes two choices: exposing the policy to several harnesses, and comparing their rewards inside one relative-advantage group. We isolate the second choice in repository-level coding. From one Qwen3-8B supervised warm start we replay the same frozen task-harness records from Aider, OpenHands, Qwen Code, and SWE-agent, with the same number of updates, under two rules for group-relative policy optimization (GRPO), Within (one group per task-harness pair) and Cross (harnesses pooled within a task), and score every checkpoint with a sealed SWE-bench Verified oracle on four source harnesses and a minimal harness held out of training. The evaluation harness is the dominant variable: across 24,000 sealed evaluations it moves the mean solve rate from 2.14\\% to 9.27\\%, a factor of 4.3, where the training recipe moves it by 1.16. The grouping rule is not. On the held-out harness, Cross minus Within is +0.25 pp, 95\\% confidence interval [-0.48, +1.02], at eight attempts per task, and +0.16 [-0.41, +0.72] pooled over three training seeds whose individual estimates change sign. Each rule's own seed range, 0.42 to 0.45 pp, exceeds the difference between them. Both rules place their largest gains on the same source harness. The pooled advantage carries the harness: an out-of-fold classifier recovers the generating harness from Cross's advantage +4.48 pp above the shuffled-label baseline and from Within's not at all, and the two rules still reach the same held-out score and action distribution inside each harness. Re-collecting half the training data on-policy does not change this. Cross-harness credit yields configuration adaptation and no more portable capability than within-harness credit. Multi-harness RL reports should state the grouping boundary and test under an unseen harness.", "category": "cs.AI", "cluster": "Agent Training \u0026 RL", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n本文研究的核心问题是：在 coding agent 的 multi-harness reinforcement learning (RL) 中，将不同 harness 的 reward 放在同一个 group 内进行相对优势比较（cross-harness credit assignment），相比于仅在单一 harness 内部进行比较（within-harness credit assignment），是否能带来真正可跨环境迁移的能力提升。具体而言，作者试图隔离 GRPO 中的 grouping boundary 变量，探究让不同 harness 的 outcomes 相互竞争究竟改变了什么，以及这种改变是增强了模型的泛化能力，还是仅仅让模型适应了特定的环境配置。这个问题具有极高的重要性，因为当前 agent RL 越来越依赖完整的执行 harness，且业界常采用混合多个 harness 的训练配方。然而，“multi-harness RL”这一概念并未明确界定 reward 的归因方式。如果跨 harness 比较仅仅引入了虚假的配置适应而非底层能力的增长，那么在部署到未见过的 harness 时，模型性能将面临不可预期的崩塌。解决这一问题不仅能澄清 multi-harness RL 的实际学习机制，还能为模型评估、安全测试和部署提供关键的评测标准，避免因 harness 配置差异导致的虚假性能提升误导系统迭代。\n\n### § 2 前人工作与不足\n在本文之前，multi-harness RL 的研究并未被清晰地分解和隔离测试。最相关的 prior systems 包括 HarnessX 和 ClawGym II。HarnessX 采取的是 cross-harness 策略，将同一任务在不同 harness 和模型版本上的 traces 放在同一个 GRPO group 中竞争；而 ClawGym II 则采取 within-harness 策略，将每个 task–harness pair 作为独立的优化单元进行 reward normalization。此外，Polar、Tmax、OpenForgeRL 等系统也探索了 harness-native RL，而 Kimi K3 等前沿配方则将异构 harness exposure 作为大型 post-training stack 的一部分。然而，这些研究存在一个共同的不足：它们在改变 grouping boundary 的同时，也改变了 exposure、rollout generation、training regime 和 evaluation 等诸多变量。这种端到端的系统设计使得它们无法隔离 grouping rule 本身的影响，从而无法判断其报告的 multi-harness 收益究竟来自跨环境比较，还是来自其他训练干预。\n\n在 credit assignment 的基础研究领域，前人工作大多聚焦于提升 reward 信号的分辨率（如 per-step value estimates、hierarchical turn-level objectives、process supervision）或纠正 group-relative baseline 的 length 和 difficulty bias（如 VinePPO、DAPO）。这些研究默认参与 credit 竞争的 trajectory 集合是固定且同质的，没有去质疑集合的边界划分问题。当集合中包含异构 harness 的轨迹时，standardization 引入的 composition-dependent bias 会被忽略。最后，以往的评测体系往往只在训练时使用的 source harness 上进行评估，缺乏在 held-out（未见过的）harness 上的测试。这种评测缺口导致学界无法区分模型性能的提升是来自 portable capability 的增长，还是仅仅是对特定 source configurations 的适应，从而使得 cross-harness credit 的真实价值一直处于未被严格验证的状态。", "core_insight": "### § 3 重建作者的思考路径\n\n在 multi-harness RL 兴起之前，学界已经广泛观察到 coding agent 的表现极度依赖于其运行的 production harness（如 Aider, OpenHands 等），不同 harness 的 prompt、tool 以及控制流会导致同一模型的 solve rate 出现巨大差异。与此同时，为了提升 agent 的泛化能力，许多系统开始采用 multi-harness 训练，即让 policy 暴露在多种 harness 环境中。然而，在 GRPO 等 group-relative policy optimization 框架下，如何在这些异构 harness 之间分配 credit 存在路线分歧：一些系统（如 HarnessX）采用 Cross grouping，将不同 harness 的轨迹放在同一个组内比较 reward；另一些系统（如 ClawGym II）则采用 Within grouping，仅在同一个 task-harness pair 内部进行 reward 归一化。\n\n作者敏锐地捕捉到了一个理论隐患：GRPO 的 advantage 标准化过程对组内样本的组成极其敏感。如果将强弱不一的 harness 放在一起计算 baseline，强 harness 的成功轨迹会获得正的 advantage，弱 harness 的失败轨迹会获得负的 advantage，但这种信号差异并非源于 policy 本身的好坏，而是由 harness 环境的固有难度偏移造成的。这种由环境带来的 reward misspecification，可能只是让模型学到了“如何利用特定 harness 的便利”，而非真正可迁移的 coding capability。为了验证这一猜想，作者意识到必须设计一个极度严格的受控实验：固定 SFT 起始模型、固定训练数据 manifest、固定 update budget，仅仅移动 credit assignment 的 grouping boundary。更重要的是，为了区分“配置适应”与“真正的能力提升”，评估阶段必须引入一个训练时从未见过的 held-out harness，以此作为检验 portability 的试金石。\n\n### § 4 核心 Intuition\n\n这篇论文的核心 Intuition 在于：当我们在不同强度的 harness 之间直接比较 reward 来分配 credit 时，模型实际上学到的是“如何顺应特定 harness 的特性”，而不是“如何解决代码任务本身”。因为强 harness 的成功带有环境赋予的偏置，跨 harness 比较会把这种环境身份信息注入到 advantage 信号中，这是一种 reward misspecification。要验证模型是否学到了真正可迁移的能力，不能只看它在训练 harness 上的得分提升，而必须将其置于一个完全未见的 harness 中测试——如果学到的是通用能力，它应该能跨越环境边界；如果只是配置适应，它在 unseen 环境中就会原形毕露。实验最终证明，跨 harness 比较 credit 只是把 harness identity 写进了梯度信号，却并未带来任何超越 source configuration 的 portable capability。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《What Does Multi-Harness RL Learn? Credit Assignment and Portability in Coding Agents》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 本文研究的核心问题是：在 coding agent 的 multi-harness reinforcement learning (RL) 中，将不同 harness 的 reward 放在同一个 group 内进行相对优势比较（cross-harness credit assignment），相比于仅在单一 harness 内部进行比较（within-harness credit assignment），是否能带来真正可跨环境迁移的能力提升。具体而言，作者试图隔离 GRPO 中的 grouping boundary 变量，探究让不同 harness 的 outcomes 相互竞争究竟改变了什么，以及这种改变是增强了模型的泛化能力，还是仅仅让模型适应了特定的环境配置。这个问题具有极高的重要性，因为当前 agent RL 越来越依赖完整的执行 harness，且业界常采用混合多个 harness 的训练配方。然而，“multi-harness RL”这一概念并未明确界定 reward 的归因方式。如果跨 harness 比较仅仅引入了虚假的配置适应而非底层能力的增长，那么在部署到未见过的 harness 时，模型性能将面临不可预期的崩塌。解决这一问题不仅能澄清 multi-harness RL 的实际学习机制，还能为模型评估、安全测试和部署提供关键的评测标准，避免因 harness 配置差异导致的虚假性能提升误导系统迭代。 ### § 2 前人工作与不足 在本文之前，multi-harness RL 的研究并未被清晰地分解和隔离测试。最相关的 prior systems 包括 HarnessX 和 ClawGym II。HarnessX 采取的是 cross-harness 策略，将同一任务在不同 harness 和模型版本上的 traces 放在同一个 GRPO group 中竞争；而 ClawGym II 则采取 within-harness 策略，将每个 task–harness pair 作为独立的优化单元进行 reward no...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 在 multi-harness RL 兴起之前，学界已经广泛观察到 coding agent 的表现极度依赖于其运行的 production harness（如 Aider, OpenHands 等），不同 harness 的 prompt、tool 以及控制流会导致同一模型的 solve rate 出现巨大差异。与此同时，为了提升 agent 的泛化能力，许多系统开始采用 multi-harness 训练，即让 policy 暴露在多种 harness 环境中。然而，在 GRPO 等 group-relative policy optimization 框架下，如何在这些异构 harness 之间分配 credit 存在路线分歧：一些系统（如 HarnessX）采用 Cross grouping，将不同 harness 的轨迹放在同一个组内比较 reward；另一些系统（如 ClawGym II）则采用 Within grouping，仅在同一个 task-harness pair 内部进行 reward 归一化。 作者敏锐地捕捉到了一个理论隐患：GRPO 的 advantage 标准化过程对组内样本的组成极其敏感。如果将强弱不一的 harness 放在一起计算 baseline，强 harness 的成功轨迹会获得正的 advantage，弱 harness 的失败轨迹会获得负的 advantage，但这种信号差异并非源于 policy 本身的好坏，而是由 harness 环境的固有难度偏移造成的。这种由环境带来的 reward misspecification，可能只是让模型学到了“如何利用特定 harness 的便利”，而非真正可迁移的 coding capability。为了验证这一猜想，作者意识到必须设计一个极度严格的受控实验：固定 SFT 起始模型、固定训练数据 manifest、固定 update budget，仅仅移动 credit assignment 的 grouping boundary。更重要的是，为了区分“... 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：# **What Does Multi-Harness RL Learn? Credit Assignment and Portability in Coding Agents** **Chenqian Le** _[∗]_ New York University `cl6707@nyu.edu` **Jiayi Cheng** _[∗]_ **Qijia He** New York University University of Washington `jc10077@nyu.edu heqj3@uw.edu` **Runhao Li** University of Southern California `runhaoli@usc.edu` **Yinghao Li** Columbia University `yinghao.li@columbia.edu` **Xupeng Chen** _[†]_ Dimension Gate ``` xupengchen@dimensiongate.cn ``` ## **Abstract** Agent reinforcement learning (RL) increasingly runs through full execution harnesses, and a multi-harness recipe mixes two choices: exposing the policy to several harnesses, and comparing their rewards inside one relative-advantage group. We isolate the second choice in repository-level coding. From one Qwen3-8B supervised warm start we replay the same frozen task–harness records from Aider, OpenHands, Qwen Code, and S...", "additional_insights": "### § 8 Take-aways\n在 coding agent 的 multi-harness RL 中，evaluation harness 是决定 solve rate 的主导变量，其影响力（4.3倍跨度）远超 training recipe（1.16倍跨度）。在固定 experience exposure 的条件下，改变 GRPO 的 grouping boundary（Cross 跨 harness 池化对比 Within 单 harness 内部归一化）不会为 policy 带来可检测的 portability 提升；在 held-out harness 上，两者的表现不仅统计上无显著差异，且各自不同 seed 间的方差甚至超过了两种规则间的差异。Cross-harness credit assignment 确实会将 harness identity（即各 harness 的固有 solve rate 偏置）注入到 pooled advantage 中，但这种信号污染并不会改变 policy 在各 harness 内部的 action distribution，也不会转化为跨 harness 的泛化能力。Multi-harness RL 带来的增益本质上是 configuration adaptation（仅对训练时见过的 harness 配置有效），而非模型自身内化的 portable capability。因此，未来的 multi-harness RL 报告必须明确指出 grouping boundary，并强制在 unseen harness 上进行测试，以区分配置适应与真实能力提升。\n\n### § 9 最脆弱的假设\n这篇论文的核心贡献依赖于一个关键假设：使用一个极简的 held-out harness（weak-ReAct interface）能够准确剥离并测量出 policy 的 portable capability，从而验证 Cross 与 Within 在泛化性上无差异。如果这个假设不成立，核心结论将直接失效。在实际中，该假设可能不成立的原因在于，weak-ReAct 与训练用的 4 个 production harness（Aider, OpenHands 等）在结构复杂度和 action space 上差异过大。极简 harness 可能存在极低的 performance ceiling 或完全不同的交互范式，导致任何由 training recipe 带来的微小但真实的 capability 提升都无法在这个粗糙的探针上被检测到，从而产生“无差异”的假阴性。论文为这个假设提供的证据仅限于统计层面的 detection floor 分析（证明其统计功效足以发现 1pp 的差异），但严重缺少结构性证据——即没有证明 weak-ReAct 的 action space 与 production harness 的 action space 具有足够的同构性以承载能力迁移，也没有在另一个未见过的 production-level harness 上进行对照验证。\n\n### § 10 最小复现实验\n如果仅有 1 周时间，最小且最具说服力的复现实验是验证“Cross-harness credit assignment 会将 harness identity 注入 advantage，而 Within 不会”这一核心机理，该实验无需训练任何 LLM。首先，从现有的 multi-harness agent benchmark（如 SWE-bench 的一个小子集）中，使用 2-3 个不同的 harness（例如 Aider 和 SWE-agent）收集约 100 个任务的 frozen trajectories 及其 binary rewards，每个 task-harness 对生成 4 个 rollout。接着，根据论文公式分别计算 Within（task-harness 内部标准化）和 Cross（task 内部跨 harness 池化标准化）的 advantage 值。然后，以 advantage 值为唯一特征，harness identity 为标签，训练一个 out-of-fold 的简单分类器（如逻辑回归或随机森林）。测量该分类器在两种 advantage 集合上的准确率，并与 shuffled-label 的 random baseline（如 50% 或 25%）进行对比。如果分类器能从 Cross advantage 中以显著高于 baseline 的准确率恢复出 harness identity，而在 Within advantage 上准确率与 baseline 持平，则强有力地支持了论文的 claim；反之，若 Cross advantage 中无法提取出 harness identity，则直接反驳了论文关于 pooled advantage 携带环境配置偏置的核心机制。", "research_value": "### § 11 最强反例设计\n要对该论文的核心结论构成致命打击，最有效的反例需直接攻击其最脆弱的假设：即 held-out harness（weak-ReAct）能够作为检测 portable capability 的有效探针。论文声称 cross-harness credit assignment 仅带来 configuration adaptation 而无 portability 提升，其依据是在极简的 weak-ReAct 上未观察到统计显著性。然而，如果 portability 的本质是“在异构 action space 中迁移工具使用范式的能力”，那么从结构复杂的 production harness（如 OpenHands 的多文件编辑、复杂 bash 执行）迁移到极简的 weak-ReAct（单步文本交互），其能力跨度可能远超模型当前的 zero-shot 迁移极限，导致 performance ceiling 本身就处于 floor 水平。此时，任何微小但真实的 capability 增益都会被 floor effect 掩盖，产生假阴性。为了验证这一替代解释，我设计的反例实验是引入一个“结构异构但语义同构”的 held-out harness：保留与训练 harness 相同的 action space 复杂度（如支持文件读写和终端执行），但强制使用完全不同的 prompt template、tool naming convention 和 observation format。如果在这种具有足够 performance ceiling 的 unseen harness 上，Cross 规则训练出的 policy 在 in-distribution task 上的 solve rate 统计显著高于 Within 规则（例如超出 2pp 以上），则直接推翻论文“无 portability 提升”的结论，证明论文的“无差异”结论仅仅是由于 weak-ReAct 探针的结构性盲区导致的测量伪影。\n\n### § 12 Follow-up Research Idea\n当前 multi-harness RL 的根本局限在于，standard GRPO 的 group-relative standardization 机制将 harness identity 的固有偏置（如各环境的 baseline solve rate）作为信号污染注入了 pooled advantage，而这种污染既无法被 policy 利用，也无法被消除。这一未满足的需求驱动了一个全新的研究 framing：将 multi-harness credit assignment 从一个“被动标准化”的统计问题，转化为一个“主动去混淆”的因果推断问题。我们可以借鉴因果机器学习中的 Invariant Risk Minimization (IRM) 和 adversarial deconfounding 技术，不再追求单纯的 reward 最大化，而是追求跨环境的 invariant advantage。具体而言，可以设计一个 Adversarial Invariant GRPO 框架：在 policy update 的同时，训练一个 harness discriminator 试图从 advantage 信号或 latent trajectory representation 中预测出 harness identity，而 policy network 的梯度则包含一个对抗项，旨在最大化 reward 的同时最小化 discriminator 的预测能力。第一个实验将构建一个包含 3 个异构 harness 的 SWE-bench 子集，固定 frozen trajectories，对比 standard Cross-harness GRPO 与 Adversarial Invariant GRPO。我们将测量两种方法在 source harness 上的 performance retention 以及在结构同构的 held-out harness 上的 transfer rate。如果该框架成功，它不仅能将环境偏置从 credit assignment 中剥离，还能首次在 coding agent 中实现基于 invariant feature learning 的真实泛化，彻底区别于以往仅通过堆叠环境暴露来赌运气的 multi-harness 配方。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Chenqian Le\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Jiayi Cheng\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Qijia He\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Runhao Li\", \"affiliations\": [3], \"markers\": []},\n    {\"name\": \"Yinghao Li\", \"affiliations\": [4], \"markers\": []},\n    {\"name\": \"Xupeng Chen\", \"affiliations\": [5], \"markers\": [\"†\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"NYU\"},\n    {\"id\": 2, \"name\": \"UW\"},\n    {\"id\": 3, \"name\": \"USC\"},\n    {\"id\": 4, \"name\": \"Columbia University\"},\n    {\"id\": 5, \"name\": \"Dimension Gate\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"Equal contribution\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "Agent reinforcement learning (RL) 越来越多地通过完整的 execution harnesses 运行，而 multi-harness recipe 混合了两种选择：将 policy 暴露于多个 harnesses，以及在同一个 relative-advantage group 内比较它们的 rewards。我们在 repository-level coding 中单独研究了第二种选择。从一个 Qwen3-8B supervised warm start 开始，我们在 group-relative policy optimization (GRPO) 的两种规则下，以相同的更新次数重放来自 Aider、OpenHands、Qwen Code 和 SWE-agent 的相同冻结 task-harness records，这两种规则为 Within（每个 task-harness pair 构成一个 group）和 Cross（harnesses 在同一个 task 内池化），并使用一个密封的 SWE-bench Verified oracle 在四个 source harnesses 和一个未参与训练的 minimal harness 上对每个 checkpoint 进行评分。evaluation harness 是主导变量：在 24,000 次密封评估中，它使 mean solve rate 从 2.14% 变动至 9.27%，变动幅度为 4.3 倍，而 training recipe 仅使其变动 1.16。grouping rule 则不是。在 held-out harness 上，Cross 减去 Within 的结果为 +0.25 pp，95% confidence interval 为 [-0.48, +1.02]（在每项任务八次尝试下），而在三个 training seeds 上汇总的结果为 +0.16 [-0.41, +0.72]，且这些 seeds 的单独估计值符号发生了变化。每种规则自身的 seed range（0.42 至 0.45 pp）超过了它们之间的差异。两种规则都在同一个 source harness 上取得了最大的增益。pooled advantage 携带了 harness 的特征：一个 out-of-fold classifier 从 Cross 高于 shuffled-label baseline +4.48 pp 的 advantage 中恢复了 generating harness，而从 Within 中则完全无法恢复，并且这两种规则在每个 harness 内部仍然达到相同的 held-out score 和 action distribution。以 on-policy 方式重新收集一半的 training data 并未改变这一点。Cross-harness credit 带来了 configuration adaptation，但并未比 within-harness credit 产生更强的 portable capability。Multi-harness RL 报告应说明 grouping boundary，并在 unseen harness 下进行测试。"}]}, {"name": "Domain-Specific Agent Applications", "count": 3, "papers": [{"title": "CUA-Universe: A Scalable and Dynamic Environment for Hybrid GUI+CLI Agents", "arxiv_id": "2609.05374", "authors": "Haoting Shi, Wenhao Wang, Weicheng Fang, Yaozhong Liang, Tian Jin, Pengxiang Zhao, Guangyi Liu, Siheng Chen, Yanfeng Wang", "summary": "Computer-use agents have advanced on benchmarks like OSWorld and AndroidWorld, but still act mostly through the GUI, often producing inefficient trajectories. Real-world computer work is hybrid, combining visual-state inspection with precise, high-throughput command-line operations, so capable agents must coordinate both modalities over shared application state. Yet scalable hybrid environments remain scarce because supporting both GUI and CLI over real applications typically requires substantial manual engineering for each application. Existing agents also struggle to use the two interfaces complementarily: CLI-native agents lack visual perception for tasks involving interface state or layout, while GUI-native agents are inefficient for operations better executed through commands. We introduce CUA-Universe, a scalable environment-to-data pipeline that turns real desktop software into hybrid GUI+CLI environments. App-Forge adapts applications into reproducible VMs and command-line surfaces it discovers, wraps, or generates, scaling to 16 applications; Task-Weave synthesizes diverse hybrid tasks of controllable difficulty from reusable operations over seed files; and Path-Steer steers rollouts along efficient hybrid paths and harvests verified trajectories for post-training. Training on this data shifts behavior from inefficient GUI interaction and brittle CLI scripting toward effective GUI+CLI orchestration. Our 9B model improves both success and efficiency on CUA-Verse (Score +39.3 pts; -37% steps, -60% tokens), OSWorld (SR +16.8 pts; -57% steps, -44% tokens), and OSWorld-MCP (Score +7.84 pts; -27% steps, -30% tokens). CUA-Universe provides a scalable path toward more capable and efficient computer-use agents.", "category": "cs.AI", "cluster": "Domain-Specific Agent Applications", "tags": ["cs.AI"], "filter_reason": "这篇论文的核心贡献是提出了 CUA-Universe，一个用于混合 GUI+CLI 计算机使用智能体的可扩展环境与数据生成流水线。论文的研究对象明确属于 LLM Agents / Tool-Use Agents 范畴。论文不仅构建了环境，还通过 Path-Steer 收集验证过的轨迹用于智能体的后训练，成功将 9B 模型的行为从低效的 GUI 交互和脆弱的 CLI 脚本转变为高效的 GUI+CLI 编排，显著提升了成功率和效率。这直接涉及智能体的训练、轨迹学习以及工具使用能力的改进，符合筛选标准中“研究对象明确是 LLM Agents / Tool-Use Agents”且“结论直接帮助理解或改进智能体能力”的保留条件。因此，该论文与构建和改进 LLM 智能体的研究目标高度相关。", "intro_logic": "### § 1 研究问题与重要性\n论文提出并解决的核心研究问题是：如何为 hybrid GUI+CLI computer-use agents (CUAs) 构建一个可扩展的、基于真实桌面软件的环境与数据生成 pipeline。现有的 CUA 大多仅通过 GUI 进行交互，导致 trajectory 冗长且在长程任务中容易崩溃；而真实的计算机操作本质上是多模态的，需要结合 GUI 的视觉感知与 CLI 的精确、高吞吐量操作。然而，构建同时支持这两种模态且共享同一 application state 的环境成本极高，且现有 agent 往往只针对单一模态优化，缺乏跨模态编排能力。解决这个问题至关重要，因为它直接关系到 CUA 能否在真实世界中高效、可靠地执行复杂任务。通过将真实桌面软件转化为 hybrid 环境并自动生成高质量训练数据，该研究不仅提升了 agent 的成功率和执行效率，还使其具备了可迁移的跨模态编排能力，为构建更强大、更通用的 CUA 提供了一条可扩展的路径。\n\n### § 2 前人工作与不足\n在环境合成方面，InfiniteWeb、GUI-Genesis 和 AutoWebWorld 等工作虽然能自动生成功能性 web 环境用于 post-training，但它们局限于人工 web 页面和纯 GUI 模态，无法在真实软件上产生 hybrid 交互。CUA-Gym 和 GymAnything 进一步扩展到桌面应用，但依然仅驱动 GUI，导致生成的 trajectory 本质上是单模态的，无法教会 agent 何时应该离开 GUI 转向 CLI。在 agent 训练方面，GUI-native agents（如基于 OSWorld 和 AndroidWorld 评估的模型）在长程工作流中效率低下，而 CLI-native agents（如 Terminal-Bench 和 TerminalWorld 训练的模型）则缺乏视觉感知，无法处理依赖界面状态或视觉布局的任务。近期虽有 CoAct-1 和 UltraCUA 等工作尝试结合 GUI 与 CLI，但它们依赖于固定的工具集和任务集，缺乏可扩展的环境与数据合成机制。CUA-Universe 正是针对这些不足，通过 agent-driven 的环境构建、任务合成和 trajectory 生成，将真实软件转化为持续产生 hybrid 监督信号的 scalable environment-to-data pipeline。", "core_insight": "### § 3 重建作者的思考路径\n\n作者最初的观察起点很朴素：当前 CUA 在 OSWorld 等 benchmark 上虽然能完成任务，但 trajectory 普遍过长且脆弱——一个本可以用一行命令解决的批量操作，GUI agent 却要逐元素点击几十步。这并非模型能力不足，而是交互模态选错了。真实人类使用计算机时天然是 hybrid 的：用 GUI 看状态、定位目标，用 CLI 做精确批量操作。那么，为什么不能让 agent 也学会这种 orchestration？\n\n第一个障碍来自环境侧。构建一个同时支持 GUI 和 CLI 且共享同一应用状态的 hybrid 环境，传统做法需要为每个应用手工编写适配层——安装配置、接口封装、状态同步——这在应用数量稍多时就不可持续。作者注意到，近期 coding agent 的能力已经足以自动完成软件安装和脚本编写，而 CLI-Anything 等工作表明可以为缺乏命令行接口的应用生成 agent-native CLI。这提供了一个关键线索：环境构建本身可以 agentic 化——用一个 installer agent 驱动 VM 搭建，用三种策略（discover 原生 CLI、wrap scripting API、generate agent-native CLI）构建工具层，从而绕过 per-application 手工工程。\n\n第二个障碍来自 agent 侧。即使给了 CLI 工具，GUI-native agent 不会用，CLI-native agent 又看不见屏幕。已有的 hybrid 尝试（CoAct-1、UltraCUA）在固定工具集和任务上训练，无法扩展到新应用。作者意识到，真正稀缺的不是工具本身，而是高质量的 hybrid trajectory——那些展示\"何时该离开 GUI 转向 CLI\"的示范数据。但这类数据无法从 GUI-only 环境中结构性地产生，因为单模态 rollout 永远不会展现模态切换的信号。\n\n由此，作者推导出一条完整路径：先用 agentic pipeline 规模化地把真实软件变成 hybrid 环境（App-Forge），再从真实 seed 文件出发合成需要协调两种模态的任务（Task-Weave），最后在 rollout 时注入模态级别的效率先验——告诉 agent\"这一步更适合 CLI\"——引导它走上更短的 hybrid 路径，收割验证过的 trajectory 用于 post-training（Path-Steer）。整个 pipeline 的设计逻辑是：环境可扩展 → 任务可合成 → trajectory 可引导，三者闭环才能持续产出教会 orchestration 的训练数据。\n\n### § 4 核心 Intuition\n\n先前方法失效的根本原因是：GUI-only agent 对批量精确操作效率极低，CLI-only agent 对依赖视觉状态的任务无能为力，而已有的 hybrid 方案受限于固定工具集和手工环境，无法规模化。CUA-Universe 的核心 intuition 是：**与其继续在单模态环境里收集更多 trajectory，不如把真实软件本身改造成 GUI 与 CLI 共享状态的 hybrid 环境，并在 rollout 时用模态级别的效率先验引导 agent 走上更短的混合路径**——这样收集到的 trajectory 天然携带\"何时切换模态\"的 orchestration 信号，而这是任何单模态 pipeline 结构上无法产出的。关键不在于给 agent 更多工具，而在于让环境持续生成教会 agent 何时用哪种工具的监督信号。", "methodology": "## § 5 具体方法与完整 Pipeline\n\n```text\nReal Desktop Apps (16)\n       |\n+------v-------+        Reproducible VM\n|  App-Forge   |-------\u003E + CLI Surface\n| installer    |        | (discover/wrap/\n| tool build   |--------+  generate)\n+--------------+\n       |\n+------v-------+        Seed + Op Pool\n|  Task-Weave  |-------\u003E + Task Packages\n| op abstract  |        | (instr, s0,\n| instantiate  |--------+  verifier)\n| refine       |\n+--------------+\n       |\n+------v-------+        Verified Trajs\n|  Path-Steer  |-------\u003E (score\u003E=0.75)\n| hybrid exec  |--------+\n| path steer   |\n| harvest      |\n+--------------+\n       |\n       v\nLoRA Fine-tune --\u003E 9B Hybrid CUA\n```\n\n**输入**：16 个真实桌面应用（含 OSWorld 继承的 8 个 + CUA-Universe 新增的 8 个，覆盖 Blender、VLC、VS Code 等）。\n\n**App-Forge 阶段**：以 VLC 为例，installer agent（由 Codex 驱动）在 persistent VM harness 中安装并配置 VLC 及其命令行工具（如 `cvlc`），交互式诊断失败直到成功启动，将配置蒸馏为 reproducible VM。随后 tool construction 从三个来源构建 CLI surface：发现原生命令行工具（如 `cvlc`）、封装 scripting API、或在不足时生成 agent-native CLI。VLC 最终暴露 13 个 agent-visible commands（如 `vlc_convert_video_mp4`、`vlc_open_media_file`）。GUI 与 CLI 操作同一 project state，轻量 adapter 在 CLI 编辑后重新同步 stale GUI 视图。\n\n**Task-Weave 阶段**：首先，多个 exploration agent 以不同目标（如结构可见性、外观、导出组织）与 VLC GUI 交互，LLM 将滑动窗口内的交互抽象为高层 reusable operation（如 `export_video_mp4` 而非 `click`），经去重聚类形成全局 operation pool。随后，以一个真实 seed video file 为初始状态 $s_0$，采样并评分候选 operation chain（如\"旋转视频→导出→打开 Audio Effects 面板\"），按 chain 长度控制难度，编译为包含 instruction、$s_0$、verifier 和 guidance 的 task package。最后，ReAct-style review agent 启动 VLC 执行短交互，验证任务可行、无歧义且未被 seed 满足，必要时修订 instruction。\n\n**Path-Steer 阶段**：agent 在统一接口中灵活交替 GUI 与 CLI action。每个 task 的 operation chain 推导出 hybrid execution prior，指示何时用 CLI（批量、精确、高吞吐操作）何时用 GUI（依赖视觉布局或界面状态的操作）。以 VLC 旋转视频任务为例，Path-Steer 引导 agent 先用 CLI（`cvlc` 配合 `--video-filter=transpose`）完成视频旋转和导出，再用 GUI 打开 Audio Effects 面板。每个完成的 rollout 由 VLM judge（GPT-5.4）评分，score ≥ 0.75 的 trajectory 被序列化为 step-level 和 trajectory-level 记录，保留为直接可用的监督数据。\n\n**输出**：4,923 个 verified episodes（约 235K step-level records），用于对 Qwen3.5-9B 进行 LoRA fine-tuning（3 epochs，8×A100，约两天），产出最终的 9B hybrid CUA。\n\n## § 6 核心数学推导\n\n本文没有形式化的数学推导，而是采用一个 POMDP 形式化定义来建模 hybrid task。其 intuition 如下：\n\n在 step $t$，agent 观察到 $o_t$（一张 screenshot 加上可选的 CLI 文本返回），并发出动作 $a_t \\in \\mathcal{A}_{\\text{gui}} \\cup \\mathcal{A}_{\\text{cli}}$。关键设计在于：GUI action space $\\mathcal{A}_{\\text{gui}}$ 和 CLI action space $\\mathcal{A}_{\\text{cli}}$ 都读写同一个 persistent application state $s_t$——这意味着无论 agent 通过鼠标点击修改了文件，还是通过命令行编辑了同一文件，状态是共享的，而非两个独立的执行轨道。\n\n一个 task 被定义为元组 $\\tau = (\\text{instr}, s_0, V)$，其中 $V(\\zeta) \\in [0, 1]$ 是一个 VLM judge 对完整 trajectory $\\zeta$ 的评分函数。这个 formulation 的核心目的不是求解最优策略的闭式解，而是为 pipeline 的三个组件提供统一接口：Task-Weave 合成大量这样的 $\\tau$，Path-Steer 在每个 $\\tau$ 上收集高分管线 $\\zeta$，post-training 用这些 $\\zeta$ 作为监督信号。论文未涉及进一步的数学推导，故本节跳过。\n\n## § 7 实验设计与结论\n\n论文围绕三个递进的 claim 设计实验：\n\n**Claim 1：训练后的 9B 模型能直接在 hybrid 环境中高效协调 GUI 与 CLI。**\n论文构建了 CUA-Verse——一个 160 个 held-out hybrid task 的 benchmark（8 个应用 × 20 个任务，与训练数据不重叠），要求 agent 在共享 application state 上协调两种 modality。实验结果表明，训练后的 9B 模型达到 0.582 Score，约为 base model（0.189）的 3 倍，同时 steps 减少 37%、tokens 减少 60%，超越 teacher Kimi K2.5（0.522），在开源模型中最优。进一步分析 action-modality behavior 发现，base model 完全不使用 CLI（0%），而训练后模型 CLI 使用率达 25.3%——但 GPT-5.5 虽 100% 使用 CLI 仍未完全解决 benchmark，说明关键能力是 cross-modality orchestration 而非单纯最大化 CLI 使用。\n\n**Claim 2：学到的 hybrid 交互能力可 transfer 到未见过的 benchmark 和 tool interface。**\n论文在 OSWorld（244-task controlled scope）上比较 GUI-only 和 GUI+CLI 两种 interface。核心发现是：添加 CLI 使训练后模型的 SR 从 23.4% 跃升至 40.2%（+41 个先前失败的任务被解决），而其他所有模型的净增不超过 8 个任务——这证明 gain 集中在 CLI orchestration 能力上，而非简单的 interface 可用性。在 OSWorld-MCP 上（158 个 MCP tools，agent 从未在训练中见过该 action space），模型 SR 从 20.90% 提升至 28.69%，TIR 翻倍，证明 hybrid 交互技能可跨 tool interface generalize。消融实验进一步训练了一个仅在不重叠应用上的 8-app OOD-only LoRA，仍带来 +3.2 points 的 zero-shot 提升，排除了 memorization 解释。\n\n**Claim 3：Path-Steer 的显式 modality guidance 本身——而非仅仅提供 CLI access——驱动了 rollout 质量和效率的提升。**\n论文在 320 个固定 task 上对比 w/ 和 w/o Path-Steer，两种设置享有完全相同的 CLI 工具集。结果显示 Path-Steer 将 Accept Rate 从 0.44 提升至 0.51，Mean Score 从 0.63 提升至 0.71，同时减少 steps 和 tokens，且该效果在 Kimi K2.5 和 Seed2.1 Pro 两个 backbone 上均成立。一个 VLC 案例显示，w/ Path-Steer 的 trajectory 虽在早期有 CLI 参数试错，但能及时切换到 ffmpeg 替代方案并成功完成任务；w/o Path-Steer 的 trajectory 则陷入 GUI filter 配置的反复搜索而最终失败。", "additional_insights": "### § 8 Take-aways\n\nCUA-Universe 的核心贡献是一个将真实桌面软件转化为 hybrid GUI+CLI 环境的 scalable pipeline，由三个组件构成：App-Forge 通过 coding agent 自动化应用安装与 CLI tool 构造，Task-Weave 从 seed 文件中合成可控难度的混合任务，Path-Steer 通过 modality-level guidance 引导 rollout 走向高效混合路径并采集 verified trajectories。该 pipeline 覆盖 16 个跨领域桌面应用，生成 4,923 条 episode（约 235K step-level records），全部数据生成仅需一台 128-core CPU 服务器约 1.5 天，无需 GPU cluster。在 CUA-Verse benchmark 上，经 LoRA fine-tune 的 9B 模型达到 0.582 Score，约为其 base model 的 3 倍，同时减少 37% steps 和 60% tokens，超越 teacher model Kimi K2.5（0.522），在 open-source 模型中最优。在 OSWorld 的 244-task controlled scope 上，GUI+CLI 模式下该模型达到 40.2% SR，比 GUI-only 模式净增 +41 个任务（23.4%→40.2%），而所有其他模型的净增不超过 8 个任务，表明 CLI 接口的增益集中在经过 hybrid 训练的模型上。在 OSWorld-MCP 上，尽管模型从未见过 MCP action space，SR 仍从 20.90% 提升至 28.69%，TIR 翻倍，证明 hybrid orchestration 能力可跨 tool interface 迁移。Path-Steer 的 ablation 显示，在相同 CLI 访问权限下，explicit modality guidance 将 Kimi K2.5 的 Accept Rate 从 0.44 提升至 0.51，Mean Score 从 0.63 提升至 0.71，同时降低 steps 和 tokens，且该效果在 Seed2.1 Pro 上同样成立。VLM judge 与人类标注的一致性达 97.0%，Cohen's κ = 0.94，accepted trajectories 中零 hard failure，precision 99.0%。Out-of-domain 实验表明，仅在 8 个 disjoint 应用上训练的 LoRA 仍能在 OSWorld 上实现 +3.2 SR points 的 zero-shot 提升，说明学到的是部分 application-agnostic 的 modality coordination 能力而非单纯 memorization。\n\n### § 9 最脆弱的假设\n\n最脆弱的假设是：**Path-Steer 提供的 hybrid execution prior（即\"CLI 适合 batch/precise 操作，GUI 适合 visual/layout 操作\"这一 modality-level guidance）能够有效引导 agent 生成更高质量的混合轨迹，且这种引导带来的行为模式可以被 student model 通过 supervised fine-tuning 内化为可泛化的 orchestration 能力。** 这个假设在实际中可能不成立的原因在于：Path-Steer 的 prior 本质上是一种 task-specific 的 heuristic plan（如论文中 VLC 示例给出的\"First, use CLI command vlc_convert_video_mp4 with transpose filter...\"），它隐含地编码了人类对\"哪个子任务该用哪个 modality\"的先验判断。如果这种 prior 过于具体，student model 学到的可能只是模仿 teacher 在特定任务类型上的 modality switching pattern，而非真正理解何时该切换的通用决策逻辑。论文提供的证据存在一个关键缺口：Table 3 的 ablation 仅比较了 w/ Path-Steer 和 w/o Path-Steer 在 data generation 阶段的 rollout 质量差异，但**没有展示 student model 在 w/ Path-Steer 数据和 w/o Path-Steer 数据上分别训练后的下游性能差异**。也就是说，我们不知道 Path-Steer 产生的更高质量轨迹是否真正转化为 student model 更强的 hybrid orchestration 能力，还是仅仅让 data filtering 通过率更高。此外，OSWorld-MCP 的泛化结果虽然支持迁移性，但 +7.79 SR points 的增益也可能部分来自 student model 对 CLI tool calling 格式的一般性适应，而非 Path-Steer 特有的 orchestration 学习。如果 Path-Steer 的 prior 实际上只是起到了 data augmentation 的作用（通过提供更短的成功轨迹来增加训练信号密度），而非教会模型一种可迁移的 modality selection 策略，那么整个\"efficiency-aware steering\"的核心贡献就退化为一种 trajectory filtering 策略，而非一种新的训练范式。\n\n### § 10 最小复现实验\n\n在一周时间内，可以验证 Path-Steer 的核心 claim：**explicit modality guidance 能产生更高质量的混合轨迹，且这种质量差异在下游训练中转化为 student model 的性能提升。** 具体方案如下：选择 2 个已有 CLI tool 支持的应用（如 VS Code 和 GIMP，它们的 CLI tool 较简单且 OSWorld 已有现成 task），从 OSWorld 中选取各 15 个 task（共 30 个 task）。使用一个较强的 open-source model（如 Qwen2.5-VL-72B 或直接调用 Kimi API）作为 rollout backbone，在两种条件下各生成 3 次 rollout：(1) w/ Path-Steer——为每个 task 手写一句 modality guidance（如\"先用 CLI 修改 settings.json，再用 GUI 验证\"），(2) w/o Path-Steer——仅给 generic instruction \"use CLI for precise operations and GUI for visual tasks\"。用 GPT-4o 作为 VLM judge 对所有轨迹打分，保留 score ≥ 0.75 的轨迹。然后用两组数据分别 LoRA fine-tune 同一个 base model（如 Qwen2.5-VL-7B），在 OSWorld 的这 30 个 task 上以 GUI+CLI 模式评估。测量三个指标：(a) data generation 阶段的 Accept Rate 和 Mean Score（验证 Path-Steer 是否提升轨迹质量），(b) 两个 student model 的 SR（验证质量差异是否转化为下游性能），(c) 两个 student model 的平均 steps 和 tokens（验证效率是否提升）。如果 w/ Path-Steer 的 student model 在 SR 上比 w/o Path-Steer 高 ≥3 个百分点，且平均 steps 更少，则支持论文的核心 claim；如果两者 SR 差距 \u003C1 个百分点或 w/ Path-Steer 反而更差，则表明 Path-Steer 的增益可能仅停留在 data filtering 层面，未转化为可学习的 orchestration 能力。这个实验不需要复现 App-Forge 的环境构建或 Task-Weave 的任务合成，只需手动构造 30 个 task 的 guidance，因此可在一周内完成。", "research_value": "### § 11 最强反例设计\n\n要对该论文构成最有力的攻击，我会设计一个**“CLI-Trap Benchmark”**来挑战其核心 Claim 2（hybrid 交互能力可泛化）和最脆弱的假设（Path-Steer 教会了可迁移的 orchestration 能力）。论文的隐性前提是：CLI 操作通常更高效，且 Path-Steer 注入的“CLI 适合 batch/precise，GUI 适合 visual/layout”的 prior 是一种通用的最优策略。然而，真实桌面软件中存在大量“CLI 陷阱”场景：即应用虽然暴露了 CLI 接口，但某些任务的 CLI 执行路径在计算成本、状态同步延迟或参数复杂度上远高于直接在 GUI 上进行视觉拖拽。例如，在 GIMP 中通过 CLI 脚本应用一个依赖动态画布视觉边界的复杂多图层 mask，需要繁琐的坐标计算与状态轮询，而 GUI 只需两次点击。我会从 OSWorld 中筛选 30 个此类“GUI 最优但 CLI 可行且低效”的任务，并刻意在环境中保留可用的 CLI 工具。在这个 benchmark 上评估论文训练出的 9B hybrid CUA，如果模型如我所预测的那样，由于在训练中被 Path-Steer 的 heuristic prior 过度偏置，盲目倾向于使用 CLI 来展示其“学到的 hybrid 能力”，导致在简单 GUI 操作上耗费大量 tokens 进行 CLI 参数试错并最终崩溃，而 base model 反而因为不受偏置影响通过纯 GUI 慢慢解决任务，这就提供了对结果的直接替代解释：Path-Steer 并未教会模型真正的 cross-modality orchestration，而是通过 supervised fine-tuning 灌输了一种僵化的“modality bias”。真正的 orchestration 能力应当是基于当前 application state 动态评估两种模态的 execution cost 并择优，而非遵循“CLI 优先 for precise ops”的静态规则。\n\n### § 12 Follow-up Research Idea\n\n该研究最核心的局限在于 Path-Steer 依赖一种静态的、人类启发式的 modality prior 来指导轨迹生成，这使得 student model 学到的只是对特定任务结构的模式匹配，而非对 modality selection 的底层决策逻辑。为突破这一局限，我提议研究 **Cost-Aware Modality Routing via Reinforcement Learning (CA-MR-RL)**，将 hybrid agent 的训练目标从“模仿人类启发式轨迹”转变为“在异构 action space 中学习最小化执行成本的最优控制策略”。这一想法的驱动需求是：真实的 computer use 环境中，GUI 与 CLI 的开销（latency、token consumption、failure rate）是高度动态且依赖上下文的，没有任何静态 prior 能穷尽所有情况。我们可以借鉴 robotics 领域中的 Constrained Markov Decision Process (CMDP) 和 heterogeneous action space 的 hierarchical RL 方法，将 modality selection 建模为一个高层 router policy，其 reward 不仅包含 task success rate，还显式引入一个由 token 数、step 数和 API latency 加权构成的 execution cost penalty。第一个实验将摒弃 Path-Steer 的 data harvesting，直接在 CUA-Universe 的 App-Forge 环境中部署一个 base agent，使用 PPO 算法训练其 router policy：当 agent 面临一个子任务时，router 必须在输出具体 action 前先输出一个 modality choice，并在后续 step 中接收 cost feedback。我们将这个 RL-trained agent 与论文中的 SFT 9B model 在前述的“CLI-Trap Benchmark”及 CUA-Verse 上进行对比，重点观察 RL agent 是否能根据具体的 state observation 动态切换偏好（在 CLI 高效时用 CLI，在 GUI 高效时用 GUI），从而证明通过环境反馈习得的 dynamic routing 能显著优于基于静态 heuristic 蒸馏出的 orchestration 能力。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Haoting Shi\", \"affiliations\": [1], \"markers\": [\"*\"]},\n    {\"name\": \"Wenhao Wang\", \"affiliations\": [2], \"markers\": [\"*\", \"†\"]},\n    {\"name\": \"Weicheng Fang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Yaozhong Liang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Tian Jin\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Pengxiang Zhao\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Guangyi Liu\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Siheng Chen\", \"affiliations\": [1], \"markers\": [\"†\"]},\n    {\"name\": \"Yanfeng Wang\", \"affiliations\": [1], \"markers\": []}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Shanghai Jiao Tong University\"},\n    {\"id\": 2, \"name\": \"Zhejiang University\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"*\", \"text\": \"These authors contributed equally.\"},\n    {\"marker\": \"†\", \"text\": \"Corresponding authors.\"}\n  ]\n}\n```", "summary_translation": "Computer-use agents 在 OSWorld 和 AndroidWorld 等 benchmark 上取得了进展，但仍然主要通过 GUI 进行操作，经常产生低效的 trajectories。真实的计算机工作是混合的，结合了视觉状态检查与精确、高吞吐量的 command-line 操作，因此有能力的 agents 必须在共享的应用程序状态上协调这两种模态。然而，可扩展的混合环境仍然稀缺，因为在真实应用程序上同时支持 GUI 和 CLI 通常需要为每个应用程序进行大量的人工工程。现有的 agents 也难以互补地使用这两种接口：CLI-native agents 在涉及界面状态或布局的任务中缺乏视觉感知，而 GUI-native agents 在执行更适合通过命令完成的操作时效率低下。我们引入了 CUA-Universe，这是一个可扩展的 environment-to-data pipeline，可将真实的桌面软件转化为混合的 GUI+CLI 环境。App-Forge 将应用程序适配为可复现的 VMs 以及它发现、封装或生成的 command-line surfaces，可扩展至 16 个应用程序；Task-Weave 从基于 seed files 的可重用操作中合成具有可控难度的多样化混合任务；Path-Steer 则沿着高效的混合路径引导 rollouts，并收集经验证的 trajectories 用于 post-training。在此数据上进行训练，将行为从低效的 GUI 交互和脆弱的 CLI scripting 转变为有效的 GUI+CLI orchestration。我们的 9B 模型在 CUA-Verse (Score +39.3 pts; -37% steps, -60% tokens)、OSWorld (SR +16.8 pts; -57% steps, -44% tokens) 和 OSWorld-MCP (Score +7.84 pts; -27% steps, -30% tokens) 上的成功率和效率均得到提升。CUA-Universe 为实现更强大、更高效的 computer-use agents 提供了一条可扩展的路径。"}, {"title": "La Agente Óptima: Towards Agentic Self-Driving Laboratories", "arxiv_id": "2609.04564", "authors": "Marcel Müller, Jiaru Bai, Willi Gottstein, Abhijoy Mandal, Mohammad Nazeri, Elia Savino, Yanlin Fang, Sujoy Das, Sergio Pablo García Carrillo, Yeonghun Kang, Juan B. Pérez-Sánchez, Simone Pilon, Martin Fitzner, Timothy Noël, Frank Gu, Varinia Bernales, Alán Aspuru-Guzik", "summary": "Self-driving laboratories (SDLs) combine automated experimentation with adaptive decision-making to accelerate scientific discovery. Their operation nevertheless often depends on human specialists who translate scientific objectives into executable closed-loop campaigns. Specialists adjust them as data and operating conditions change. Here, we present La Agente Óptima, an agentic framework that constructs and supervises Bayesian optimization campaigns across computational and experimental systems while maintaining a persistent optimization state. By separating large language model (LLM) reasoning from executed campaigns, Óptima runs repetitive optimization loops consistently, returns control to the agent only when progress requires interpretation or campaign revision, and keeps every decision auditable. We evaluate Óptima across ablation studies, five digital discovery tasks, and two physical platforms. Throughout, Óptima maintained executable campaigns as both the scientific problem and execution environment evolved. In a closed-loop contact angle optimization campaign, Óptima identified and corrected a mid-run measurement failure, bringing the contact angle from 71.4 to 67.8 degrees, just above the 64-66 degree range. From this result, Óptima correctly inferred that the target was likely unattainable with the available reagents and recommended changing the formulation. In a five-day multi-objective flow-chemistry campaign, Óptima increased the yield from 30% to 59% over 23 experiments. Despite substantial inference costs, it cost less and used substantially less starting material than a human-directed campaign, while selecting a more mass-efficient operating point. These results show that LLM-based agents can make rigorous, long-running optimization campaigns accessible to domain scientists without specialist setup, expanding the scope of SDLs.", "category": "cs.AI", "cluster": "Domain-Specific Agent Applications", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n论文解决的核心问题是：Self-driving laboratories (SDLs) 虽然将自动化实验与自适应决策相结合以加速科学发现，但其实际运行仍然高度依赖人类专家将科学目标翻译为可执行的 closed-loop campaigns，并在数据和操作条件变化时持续调整。这一依赖造成了两个瓶颈：一方面，部署 Bayesian optimization (BO)——当前化学参数与反应优化任务的首选算法——需要编程和 BO 专业知识，而大多数 domain scientists 并不具备；另一方面，随着自主科学工作流规模的扩大，人类推理本身成为限速步骤，例如在一项 closed-loop catalysis campaign 中，人类推理消耗了 34.7 人时，而 agent 推理仅约 1 小时。论文提出的 La Agente Óptima 是一个 agentic framework，能够自主构建和监督跨计算与实验系统的 BO campaigns，同时维护持久的优化状态。其关键设计是将 LLM reasoning 与程序化执行分离：重复的优化循环由生成的 Python 脚本一致地执行，仅在需要解释进展或修订 campaign 时才将控制权交回 agent，且每个决策都可审计。这一方案的价值在于使 domain scientists 无需专家支持即可运行严谨的长时间优化 campaign，从而扩展 SDLs 的适用范围。\n\n### § 2 前人工作与不足\n\n该问题此前未被完整解决，相关工作可分为三条脉络，各自存在结构性不足。第一，通用优化库如 BoTorch、Ax 和 Atlas 虽然支持混合参数空间、约束和并行优化，降低了实现负担，但将 optimizer 连接到评估系统、配置和维护 campaign、以及解释决策轨迹仍需 domain scientists 所缺乏的编程与 BO 专业知识——这些工具面向的是已具备专业能力的用户，而非消除专业门槛。第二，LLM-based agents 在科学发现中展示了潜力：Coscientist 将 GPT-4 与网络搜索、文档检索、代码执行和实验室自动化相结合以设计和执行化学实验，Smith et al. 将 GPT-5 连接到 cloud laboratory 进行了六轮 cell-free protein synthesis 优化。然而，这些演示仍绑定于为特定任务和平台定制的执行环境，缺乏跨异构计算与实验平台的通用性。第三，关于 agent reasoning 与专用优化方法如何交互，现有文献探索了不同路径但各有局限。直接依赖 LLM 生成候选的方法（如 Cooper et al. 的 closed-loop catalysis）受益于预训练中编码的化学知识，但当目标化学体系研究不足、搜索空间在文献中弱表征、或优化主要依赖新获取的实验反馈时，其优势消失——在同一 160 次实验预算中，LLM 集中在狭窄的配方子集并产生仅被人工检查才发现的静默推理错误，而 domain-expert 团队探索了更多样的配方并找到了活性更高的催化剂。Gupta et al. 进一步证实，将测量结果随机排列后 agent 性能基本不变，说明候选选择由预训练先验而非更新的后验驱动。混合方法方面，Cissé et al. 显示 LLM/BO 混合在早期探索由 LLM 生成的假设 warm-start 时优于单独 BO，但纯 LLM 驱动的优化在某些设置中匹配甚至超越了混合方案；CICERO (Ritchhart et al.) 中的 BO 仍嵌入在特定领域的分离工作流中，与实验接口、目标定义和目标函数紧密耦合；Brunzema et al. 将 LLM agent 置于优化循环中心并委托 surrogate modeling 和 acquisition optimization 给 Bayesian backend，但评估完全在合成和分析基准函数上进行。这些工作的共同不足在于：optimizer 始终是单个 agent 或工作流的私有组件，仅在基准目标或单一实验领域内运行，缺乏一种通用架构使 optimizer 成为跨异构平台的共享、持久组件，同时支持 BO 驱动的搜索和 agent 直接提出的实验建议。这正是 Óptima 所填补的空白。", "core_insight": "### § 3 重建作者的思考路径\n\n作者面对的核心矛盾来自两个方向的实践经验。一方面，SDLs 虽然在硬件自动化上日趋成熟，但 closed-loop campaign 的设计、配置、维护和诊断仍然依赖 BO 专家——一个最近的闭环催化实验中，人类推理消耗了 34.7 人时，而 agent 推理仅约 1 小时。另一方面，LLM-based agents 虽然能通过软件接口操作科学工具，但直接让 LLM 驱动优化存在已被证实的失败模式：在 25 维催化 campaign 中，LLM 收缩到狭窄配方子集并产生静默推理错误，而同一预算下人类团队探索了更多样配方并找到更好的催化剂；Gupta 等人的实验进一步表明，将测量结果随机置换后 agent 性能基本不变，说明候选选择由预训练先验驱动而非后验更新。这些观察排除了\"用 LLM 替代 BO\"的路线。\n\n与此同时，已有工作探索了 LLM/BO 混合，但暴露了架构层面的局限。CICERO 将 BO 嵌入特定领域的分离工作流中，优化器与实验接口、目标定义紧耦合；Brunzema 等人将 LLM agent 置于优化循环中心、委托 surrogate modeling 给 Bayesian backend，但评估仅在合成和解析 benchmark 函数上进行。这些方案中的优化器始终是单一 agent 或工作流的私有组件，无法跨异构计算和实验平台复用。更根本的问题是：如果 LLM 在每一轮优化中都介入候选选择，它既消耗大量 inference 成本，又可能在重复执行中引入不一致性——而这恰恰是 BO 算法被设计来保证的。\n\n由此产生一个架构层面的张力：LLM 的价值在于化学知识、目标制定和灵活交互，BO 的价值在于原则性的数据驱动探索；但将两者简单串联——让 LLM 在每轮循环中介入——既不经济也不可靠。作者需要找到一种方式，让 LLM 只在需要科学判断时介入，而将重复的优化循环交给程序化执行。这进一步引出一个需求：优化状态必须持久化于 agent 之外，使得 campaign 可以在科学问题演变（如修改目标、更换搜索空间表示）时保持连续性，而非从头重启。作者此前开发的 El Agente Gráfico 已经展示了结构化执行图在量子化学任务中的有效性，将其扩展为能够构建和监督 BO campaign 的框架是自然的下一步。BO-MCP 的设计——将 BO 作为通过 Model Context Protocol 暴露的服务——则回应了\"优化器作为共享、持久组件\"这一需求，使其能被 agent 通过工具调用访问，也能被生成的 campaign 脚本直接调用，从而在重复循环中完全绕过 LLM。\n\n### § 4 核心 Intuition\n\nLLM 擅长理解科学目标、诊断异常和做出科学判断，但不擅长在数十轮重复循环中一致地执行优化逻辑；BO 恰好相反。Óptima 的核心直觉是：将这两类能力在执行层面彻底分离——LLM 负责编写 campaign 程序、配置搜索空间、在出现问题时诊断和修复，而程序化执行的 BO 循环在 LLM 不介入的情况下一致运行——同时将优化状态持久化于 agent 之外的服务中，使得科学问题可以在 campaign 运行中演变而不丢失已有证据。这样，agent 的推理成本从\"每轮循环一次\"降低到\"仅在需要科学判断时介入\"，而 BO 的可靠性不受 LLM 不一致性影响。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n+-----------------+    科学目标/修订指令\n| Domain Scientist| \u003C-------------------+\n+-----------------+                     |\n      | 目标                             |\n      v                                 |\n+-----------------+  构建/修订 Campaign  |\n|  LLM Agent      | ------------------\u003E |\n|  (Óptima)       |                     |\n+-----------------+                     |\n      | 生成脚本                         | 需要解释\n      v                                 | 或修订\n+-----------------+  请求候选/更新结果   |\n| Python Campaign | \u003C-----------------\u003E +-----------------+\n| Script (循环)   |                     |    BO-MCP       |\n+-----------------+                     | (持久化状态)     |\n      | 候选实验                         +-----------------+\n      v                                 ^\n+-----------------+                     |\n| Evaluation Sys. | --- 测量结果 -------\u003E+\n| (计算/实验)      |\n+-----------------+\n```\n\n**节点解释：**\n\n1. **Domain Scientist**：提出科学目标（如优化接触角或化学反应产率），无需具备 Bayesian optimization (BO) 或编程专业知识。在 campaign 运行过程中，也可根据 Agent 的反馈提供新的修订指令。\n\n2. **LLM Agent (Óptima)**：接收科学目标后，构建初始 BO campaign 并生成可执行的 Python 脚本。Agent 的核心职责是科学判断：理解目标、配置搜索空间、诊断异常数据，以及在进展停滞或环境变化时修订 campaign。当重复优化循环遇到需要解释的情况时，控制权交回 Agent。\n\n3. **BO-MCP (Model Context Protocol)**：将 BO 作为通过 MCP 暴露的服务，充当共享且持久的优化状态存储。Agent 通过工具调用访问它以初始化或修订 campaign，而生成的 Python 脚本则直接调用它以请求下一个候选实验并更新观测结果。这一设计使得优化状态独立于 LLM 推理而持久存在。\n\n4. **Python Campaign Script**：由 Agent 生成，负责一致地执行重复的优化循环。脚本向 BO-MCP 请求候选、将其发送至评估系统、获取结果并更新状态。由于循环逻辑由程序化脚本执行而非 LLM 逐轮推理，因此保证了 BO 算法的一致性，同时避免了重复调用 LLM 带来的 inference 成本和潜在的不一致性。\n\n5. **Evaluation System**：涵盖计算平台和实验平台。脚本将候选实验发送至该系统执行，系统返回测量结果，结果再被写回 BO-MCP 以更新后验模型。当结果异常或触发预设条件时，脚本暂停并将控制权交回 Agent 进行诊断和决策。\n\n### § 7 实验设计与结论\n\n论文提出三个核心问题并分别通过实验验证：\n\n**问题 1：将 LLM reasoning 与程序化执行分离的架构，能否在科学问题和执行环境演变时维持可执行的 campaign？**\n- **实验**：在 ablation studies 和 five digital discovery tasks 上评估 Óptima 的表现，测试其在不同计算系统中的通用性和对问题演变的适应能力。\n- **结论**：Óptima 在所有任务中均能维持可执行的 campaign，即使科学问题（如修改目标、更换搜索空间表示）和执行环境发生变化，持久化的优化状态保证了 campaign 的连续性而非从头重启。\n\n**问题 2：Agent 能否在运行中诊断异常并做出合理的科学推断？**\n- **实验**：在 closed-loop contact angle optimization campaign 中，运行中途发生测量失败。观察 Agent 是否能识别异常、纠正错误，并对最终结果做出科学推断。\n- **结论**：Óptima 成功识别并纠正了运行中的测量失败，将接触角从 71.4° 降至 67.8°，接近但未达到 65° ± 1° 的目标。基于此，Agent 正确推断该目标在现有试剂条件下可能无法实现，并建议改变配方。这验证了 Agent 在运行中进行科学诊断和推断的能力。\n\n**问题 3：Agent 驱动的长时间优化 campaign 在实际化学实验中是否具有实用价值？**\n- **实验**：在为期五天的 multi-objective flow-chemistry campaign 中，评估 Óptima 能否在多目标优化中提高产率，并与人类指导的 campaign 在成本、材料消耗和运行点选择上进行比较。\n- **结论**：Óptima 在 23 个实验中将产率从 30% 提高至 59%。尽管存在 substantial inference costs，其总成本低于人类指导的 campaign，使用的起始材料显著更少，且选择了更 mass-efficient 的运行点。这表明 LLM-based agents 能使严谨的长时间优化 campaign 对 domain scientists 变得可及，从而扩展 SDLs 的适用范围。", "additional_insights": "### § 8 Take-aways\n\n论文提出了 La Agente Óptima，一个将 LLM reasoning 与 programmatic BO execution 分离的 agentic framework，核心设计是让 BO specialist subagent 编写可复用的 Python campaign program，由 BO-MCP 服务维护 persistent optimizer state，coordinating agent 仅在需要解释结果或修订 campaign 时介入。这种分离使得 repetitive optimization loop 以一致设置程序化执行，避免了 LLM 在每轮迭代中重复推理带来的 context 膨胀和推理错误累积。在 architecture comparison 中，Specialist-script 在 Ackley 6D benchmark 上显著优于 Tool-loop（LLM 逐轮调用 BO 工具）和 Local-BO（LLM 本地实现 BO），证明仅提供 optimizer 服务访问不足以替代程序化执行与 specialist delegation 的组合。在五个 digital discovery campaign 中，Óptima 展示了从 fragment 组装、量子化学评估到 MOF 构建的多领域适用性，其中 MOF campaign 展示了 agent 自主诊断 search-space representation 错误（15% 可构建率）并重建问题的能力。在 RAISE 物理平台上，agent 识别出将 measurement failure 编码为 180° penalty 的错误，区分了 formulation infeasibility 与 missing data，并据此重建 campaign。在 RoboChem-Flex 上，agent 独立定义了与人类专家设计高度一致的 green score，在 23 个实验中将 yield 从 30% 提升至 58.8%，消耗的起始材料不到人类指导 campaign 的一半，总成本低 13%，且识别出的操作点具有更高的 reaction mass efficiency (RME)。agent 还自主分析了零产率实验的 raw NMR spectrum，区分了 failed chemistry 与 failed measurement——这是 autonomous experimentation 中的关键操作瓶颈。论文进一步指出，inference cost 在当前仍是显著开销（RoboChem-Flex campaign 花费 $109.55 on LLM calls），但已被实验数量减少带来的材料节省所抵消。\n\n### § 9 最脆弱的假设\n\n核心假设是：**agent 能够仅凭 numerical observations 和有限的 platform state 访问，可靠地诊断实验失败并做出正确决策，从而真正减少对 specialist 的依赖。** 这一假设是整个框架价值主张的基石——如果 agent 无法正确区分 failed chemistry、failed measurement 和 formulation infeasibility，它要么将错误数据注入 surrogate model 导致 optimization trajectory 偏离，要么在需要人类介入时未能识别而浪费昂贵试剂。\n\n论文自身提供了这一假设脆弱性的直接证据。在 RAISE campaign 中，agent 初始将所有失败评估统一编码为 180°，这一决策将一个 permanently infeasible formulation 与两个 feasible 但 measurement 失败的 formulation 混为一谈，导致 surrogate model 被系统性 bias——后续 8 个建议全部停留在 20 v/v% ethanol 以下，远离实际最优区域。agent 最终诊断出问题，但代价是 13 个 valid observation 的 optimization trajectory 已被扭曲。在 RoboChem-Flex 中，零产率结果的解释需要 agent 主动访问 raw FID 和 processed spectrum，重建 chemical-shift axis，估计 noise floor——这一诊断链路的每一步都依赖平台暴露 raw data 且 agent 具备相应的 spectral analysis 能力。论文在 Discussion 中明确承认：\"the numerical result alone provided an incomplete account of what had occurred\"，并将 access to sensor data 列为未来需求。\n\n更关键的是，论文缺少对 ambiguous failure mode 的系统测试。所有展示的失败案例都有相对清晰的诊断信号（CUDA device 缺失、search space 15% 可构建率、spectrum 中无 peak）。论文未测试 agent 面对 subtle failure 时的表现——例如 partial measurement error（contact angle 偏移 2-3° 而非完全缺失）、intermittent instrument drift、或 multiple confounded failure modes 同时发生的情况。在这些场景下，agent 可能将 instrument artifact 误读为 chemistry 趋势，或将 real chemical effect 误归为 measurement error，且由于 campaign 在 background 运行，错误可能在多轮迭代后才被发现。论文的 ablation study 仅在 synthetic benchmark 上测试了 architecture 的 optimization performance，未测试 failure diagnosis 的可靠性，而这恰恰是 physical campaign 中代价最高的失败模式。\n\n### § 10 最小复现实验\n\n在一周时间内，可以验证论文最核心的 architecture claim：**programmatic BO execution（Specialist-script）优于 LLM-mediated tool-loop。** 该 claim 可完全在 computational environment 中测试，无需物理硬件。\n\n具体方案：使用论文开源的 BO-MCP（GitHub: AccelerationConsortium/bo-mcp），以 BayBE 作为 backend。Benchmark 选择 Ackley 6D function（论文已给出精确的 normalization 公式：$q_{\\text{Ackley}} = 1 - \\frac{f(z) - f_{\\min}}{f_{\\max} - f_{\\min}}$，其中 $z_i = -40 + 80x_i$）。实现两种 architecture：(1) Specialist-script——用一个 LLM call 让模型编写调用 BO-MCP REST API 的 Python script，该 script 程序化执行 60 次 objective evaluation；(2) Tool-loop——让 LLM 在每轮迭代中通过 tool call 请求 BO suggestion、执行 function evaluation、提交 result，共 60 轮。两种 architecture 使用同一 LLM（如 GPT-4o 或 Claude Sonnet），各运行 3 次，每次 budget 固定为 60 次 attempted evaluation。\n\n测量指标：final best objective value（60 次尝试内的最佳 $q_{\\text{Ackley}}$）、mean best-so-far at 60 attempts (MBSF@60)、total LLM token consumption、total cost。如果 Specialist-script 的 mean final quality 显著高于 Tool-loop（论文报告 0.770 vs. 0.265），且 token consumption 更低或相当，则支持论文的 architecture claim。如果两者性能无显著差异或 Tool-loop 更优，则表明在 continuous optimization benchmark 上，programmatic execution 的优势可能被特定 benchmark 特征（如 multimodality）放大，而非普遍成立。此实验的关键 confound 是 LLM choice——论文使用 GPT-5.4 且承认 framework 在开发过程中针对该模型的 failure mode 进行了优化，因此使用不同 LLM 可能改变结论方向，这本身也是有价值的测试。", "research_value": "### § 11 最强反例设计\n\n如果我要对这篇论文进行最有力的攻击，我将针对其核心设计——**将 LLM reasoning 与 programmatic BO execution 分离**——并证明这种分离在**非平稳环境**中会导致系统性的 surrogate model 中毒。论文展示的成功案例均隐含了一个关键假设：实验系统的底层响应曲面在 campaign 期间是静态的，或者失败模式是离散且可观测的（如 CUDA 缺失或 NMR 无 peak）。然而，在真实的长时间物理实验中，最常见且代价最高的干扰是**缓慢连续漂移**，例如反应器壁的缓慢钝化、泵的老化导致流速微小偏移、或环境湿度对光化学的持续影响。\n\n我设计的反例实验是一个为期五天的 flow chemistry campaign，其中反应器的有效催化剂停留时间以每 12 小时 1-2% 的速率持续衰减。在这种场景下，Specialist-script 编写的静态 BO 循环会持续将新数据注入 persistent optimizer state，但由于 LLM 被隔离在 repetitive loop 之外，它不会意识到目标函数本身正在移动。BO 的 Gaussian Process 假设的是一个静态的响应曲面，当底层系统漂移时，早期收集的高产率数据与晚期收集的低产率数据会在 surrogate model 中产生剧烈冲突，导致 acquisition function 指向系统状态早已改变的“幽灵”最优点。由于没有硬性失败触发 agent 介入，coordinating agent 只会在 campaign 结束后面对一个完全偏离的 optimization trajectory。这个反例直接挑战了论文的 value proposition：它证明 Óptima 的架构在 stationary benchmark 和突发失败场景中的成功，实际上依赖于一个不切实际的假设，即物理系统的动态性可以被抽象为静态的 Python 脚本。如果这个反例成立，论文中声称的“减少对 specialist 依赖”将被推翻，因为人类专家仍然必须持续监控系统的缓慢漂移，并在 BO 模型被污染前手动触发 campaign revision。\n\n### § 12 Follow-up Research Idea\n\n基于上述局限，我提出一个非增量的 novel research idea：**将 autonomous experimentation 的目标从静态参数优化重新定义为联合系统辨识与动态优化**。驱动这个想法的局限是，当前的 agentic SDLs（包括 Óptima）将物理平台视为一个静态的 oracle，忽略了实验系统本身在长时间运行中具有动态特性。未满足的需求是，agent 必须能够区分“化学体系本身的产率极限”与“系统硬件衰减导致的性能下降”，这要求 agent 主动建模并追踪环境的非平稳性，而不是被动等待失败触发介入。\n\n为了实现这一目标，可以借鉴 **adaptive control theory** 中的 system identification 技术和 **time-varying Gaussian Processes**。具体而言，不再让 specialist subagent 生成一个静态的 BO 脚本，而是让它生成一个能够执行**主动探针注入**的动态脚本：在常规的 acquisition function 采样之间，定期插入对已知 reference state 的评估。这些 reference measurements 将作为时间序列输入到一个由 LLM 监督的 drift detector 中。当检测到 reference state 的响应发生统计显著的偏移时，agent 将不会直接将新数据输入标准 GP，而是会触发一个特殊的 routine，利用时变核函数对历史数据进行 discounting，或者将“系统状态”作为一个显式的 contextual variable 注入 surrogate model。\n\n第一个实验将在一个模拟的非平稳环境中进行：构建一个“Drifting Ackley” benchmark，其中全局最优点的坐标随时间周期性平移，或者函数的局部梯度逐渐平滑。我们将比较三种架构：(1) Óptima 的原始静态 Specialist-script；(2) 具有预编程时变核的 Local-BO；(3) 提出的新框架，其中 LLM agent 根据主动探针的反馈动态决定是否以及如何调整 GP 的时变参数。关键测量指标是 tracking error（agent 推荐的实验点与当前真实移动最优点的距离）随时间的变化。如果新框架能够通过主动探针识别漂移并动态调整 surrogate model，其 tracking error 将保持有界，而 Óptima 的 static script 将表现出滞后或发散的 trajectory。这一提议与已有工作的根本区别在于：它不再试图让 agent 更好地“修复”失败的 campaign，而是赋予 agent 维护一个对物理世界动态演化保持认知的、活的数学模型的能力。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:glm", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\"name\": \"Marcel Müller\", \"affiliations\": [1, 7], \"markers\": [\"†\"]},\n    {\"name\": \"Jiaru Bai\", \"affiliations\": [1, 7], \"markers\": [\"†\"]},\n    {\"name\": \"Willi Gottstein\", \"affiliations\": [6], \"markers\": [\"†\"]},\n    {\"name\": \"Abhijoy Mandal\", \"affiliations\": [2], \"markers\": [\"‡\"]},\n    {\"name\": \"Mohammad Nazeri\", \"affiliations\": [10], \"markers\": [\"‡\"]},\n    {\"name\": \"Elia Savino\", \"affiliations\": [11], \"markers\": [\"‡\"]},\n    {\"name\": \"Yanlin Fang\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Sujoy Das\", \"affiliations\": [2], \"markers\": []},\n    {\"name\": \"Sergio Pablo García Carrillo\", \"affiliations\": [6, 12], \"markers\": []},\n    {\"name\": \"Yeonghun Kang\", \"affiliations\": [1, 7, 13], \"markers\": []},\n    {\"name\": \"Juan B. Pérez-Sánchez\", \"affiliations\": [1], \"markers\": []},\n    {\"name\": \"Simone Pilon\", \"affiliations\": [11], \"markers\": []},\n    {\"name\": \"Martin Fitzner\", \"affiliations\": [14], \"markers\": []},\n    {\"name\": \"Timothy Noël\", \"affiliations\": [11], \"markers\": []},\n    {\"name\": \"Frank Gu\", \"affiliations\": [4, 6, 10], \"markers\": []},\n    {\"name\": \"Varinia Bernales\", \"affiliations\": [1, 2, 6], \"markers\": [\"*\"]},\n    {\"name\": \"Alán Aspuru-Guzik\", \"affiliations\": [1, 2, 3, 4, 5, 6, 7, 8, 9], \"markers\": [\"*\"]}\n  ],\n  \"institutions\": [\n    {\"id\": 1, \"name\": \"Dept. of Chemistry, Univ. of Toronto\"},\n    {\"id\": 2, \"name\": \"Dept. of Computer Science, Univ. of Toronto\"},\n    {\"id\": 3, \"name\": \"Dept. of Materials Science \u0026 Engineering, Univ. of Toronto\"},\n    {\"id\": 4, \"name\": \"Dept. of Chemical Engineering \u0026 Applied Chemistry, Univ. of Toronto\"},\n    {\"id\": 5, \"name\": \"Institute of Medical Science, Univ. of Toronto\"},\n    {\"id\": 6, \"name\": \"Acceleration Consortium\"},\n    {\"id\": 7, \"name\": \"Vector Institute for Artificial Intelligence\"},\n    {\"id\": 8, \"name\": \"CIFAR\"},\n    {\"id\": 9, \"name\": \"NVIDIA\"},\n    {\"id\": 10, \"name\": \"Institute of Biomedical Engineering, Univ. of Toronto\"},\n    {\"id\": 11, \"name\": \"Flow Chemistry Group, HIMS, Univ. of Amsterdam\"},\n    {\"id\": 12, \"name\": \"IMN-CNM, CSIC\"},\n    {\"id\": 13, \"name\": \"Dept. of Chemistry, Sungkyunkwan University\"},\n    {\"id\": 14, \"name\": \"Merck KGaA\"}\n  ],\n  \"footnotes\": [\n    {\"marker\": \"†\", \"text\": \"These authors contributed equally\"},\n    {\"marker\": \"‡\", \"text\": \"These authors also contributed equally\"},\n    {\"marker\": \"*\", \"text\": \"Corresponding author\"}\n  ]\n}\n```", "summary_translation": "Self-driving laboratories (SDLs) 结合了自动化实验与自适应决策，以加速科学发现。然而，它们的运行往往依赖于人类专家，这些专家将科学目标转化为可执行的闭环 campaign。随着数据和操作条件的变化，专家会对其进行调整。在此，我们提出 La Agente Óptima，这是一个 agentic framework，能够在计算和实验系统中构建并监督 Bayesian optimization campaign，同时维持持久的优化状态。通过将 large language model (LLM) reasoning 与执行的 campaign 分离，Óptima 能够一致地运行重复的优化循环，仅在进展需要解释或修改 campaign 时才将控制权交还给 agent，并保持每个决策均可审计。我们通过 ablation studies、五个数字发现任务和两个物理平台对 Óptima 进行了评估。在整个过程中，随着科学问题和执行环境的演变，Óptima 始终维持可执行的 campaign。在一个闭环 contact angle 优化 campaign 中，Óptima 识别并纠正了运行中期的测量故障，将 contact angle 从 71.4 度降至 67.8 度，略高于 64-66 度的范围。根据这一结果，Óptima 正确推断出使用现有试剂可能无法达到目标，并建议更改 formulation。在为期五天的多目标 flow-chemistry campaign 中，Óptima 通过 23 次实验将产率从 30% 提高到 59%。尽管推理成本高昂，但与人类指导的 campaign 相比，它的成本更低，使用的起始原料也大幅减少，同时选择了更具质量效率的操作点。这些结果表明，基于 LLM 的 agent 能够让领域科学家在无需专家设置的情况下进行严谨且长期的优化 campaign，从而扩大了 SDLs 的适用范围。"}, {"title": "MaxKernel: Agentic Kernel Generation for TPUs", "arxiv_id": "2609.04523", "authors": "Shangkun Wang, Nina Cai, Charles Hoong, Julian Walker, Gerson Kroiz, George Vanica, Deepak Patil, Andi Gavrilescu, Hassan Sipra, Sethu Sankaran", "summary": "Designing and authoring high-performance custom kernels for accelerators is a complex task that requires deep hardware-level expertise. Large Language Models (LLM) can be leveraged together with real-time compiler feedback to build agentic systems for kernel generation. In this work, we present MaxKernel, a multi-agent system that implements three distinct paradigms for TPU kernel development: (1) a Human-in-the-Loop (HITL) agent for collaborative, step-by-step design; (2) an Autonomous (Auto) agent that executes a fully automated, metric/trace-driven optimization loop; and (3) a Graph-Based Autonomous Search that scales the Auto agent for global exploration of the design space. All three paradigms leverage a shared pool of specialized sub-agents to handle planning, implementation, self-debugging, testing, and hardware profiling. We evaluate MaxKernel on JaxBench, a comprehensive suite of 50 diverse kernel tasks for TPUs, alongside complex, real-world workloads from state-of-the-art open-source models. We demonstrate that MaxKernel consistently generates highly optimized implementations, matching expert hand-tuned baselines and delivering significant performance across the benchmark. Our agent is open-sourced and available https://github.com/AI-Hypercomputer/accelerator-agents/tree/main/MaxKernel.", "category": "cs.AI", "cluster": "Domain-Specific Agent Applications", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agent capability/behavior, Multi-Agent)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n本文提出并解决的研究问题是如何利用多智能体系统自动化生成和优化Tensor Processing Units (TPUs)的高性能custom kernels。这个问题至关重要，因为随着深度学习架构规模的不断扩大，对专用硬件加速器的需求日益增长。为了充分利用这些设备的计算和内存带宽，工程师通常需要绕过标准compiler pipelines来开发定制化的优化kernels。然而，编写这些kernels（如针对TPU的JAX/Pallas）是一个极其复杂的过程，要求开发者具备深厚的硬件级专业知识，包括手动管理memory hierarchies（如HBM与VMEM）、编排Direct Memory Access (DMA) pipelining以及推导多维tiling strategies。解决这一问题能够大幅降低硬件加速器编程的技术门槛，减少领域专家的手工调优工作量，并确保硬件性能得到最大化释放。\n\n### § 2 前人工作与不足\n在MaxKernel之前，该问题已通过传统compiler优化技术和基于Large Language Models (LLMs)的方法进行了部分探索。传统compiler优化技术如Halide、TVM和Ansor通过将算法定义与调度解耦来应对复杂性，但它们仍然依赖大量的domain knowledge或极其昂贵的evolutionary search阶段。近期的研究（如AutoComp）开始利用LLMs来导航tensor programs的搜索空间，而标准的zero-shot或few-shot LLM方法也尝试直接生成代码。然而，这些先前的工作存在显著不足：首先，由于accelerator APIs的rigidity、严格的memory constraints以及opaque low-level compiler errors，标准LLM方法无法仅凭静态生成产出高质量代码，必须依赖real-time compiler feedback进行迭代，而前人缺乏一个能够无缝集成compiler pipelines和empirical profiling tools（如XProf）的闭环多智能体框架。其次，即使生成了功能正确的代码，实现最优硬件性能仍需经历漫长的经验性profiling、configuration tuning和APIs调整，前人系统未能提供灵活的orchestration paradigms来在人工控制、快速自动迭代和全局设计空间探索之间进行权衡。最后，针对TPU特有的JAX/Pallas编程环境，此前缺乏一个能够涵盖规划、实现、自我调试、测试到硬件profiling全流程的模块化系统，也未能像MaxKernel这样在严格的JaxBench基准上证明其能够稳定匹配甚至超越人类专家手写kernel的性能。", "core_insight": "### § 3 重建作者的思考路径\n\n编写高性能的TPU kernel需要专家手动管理内存层次（如HBM与VMEM）、编排DMA pipelining以及设计多维tiling策略，这极大地限制了开发效率。早期尝试使用传统编译器（如TVM、Halide）通过解耦算法和调度来自动化这一过程，但它们仍需大量领域知识或昂贵的evolutionary search。随着LLM的兴起，研究者尝试用zero-shot或few-shot prompting直接生成代码，但加速器API的僵化和低级编译器错误的晦涩导致编译成功率极低。为了解决这个问题，必须引入real-time compiler feedback，让LLM在错误中自我修正。然而，即使代码能编译运行，单线性的iterative refinement（如简单的hill-climbing）在面对复杂的内存布局和tiling策略时，极易陷入局部最优。此外，缺乏精确的硬件性能反馈，LLM无法判断优化方向是否正确。因此，研究者自然会想到将整个优化过程拆解为模块化的sub-agents，并引入XProf等profiling工具提供量化的硬件指标作为闭环反馈。为了克服单次迭代的局限性，可以将这个闭环agent作为基础单元，嵌入到更宏观的图搜索框架中，通过Parallel Search或Beam Search在全局设计空间中并行探索不同的优化路径。同时，考虑到复杂kernel的开发仍需人类直觉的引导，保留Human-in-the-Loop的交互模式也是顺理成章的演进。\n\n### § 4 核心 Intuition\n\n纯LLM生成缺乏对底层硬件约束的感知，而单次线性迭代优化又容易被困在次优的编译状态中。MaxKernel的核心在于将TPU kernel优化拆解为模块化的agent闭环，利用XProf提取的真实硬件指标作为反馈信号驱动迭代。同时，它将这个闭环agent封装为图搜索的节点，通过Parallel或Beam search在全局设计空间中并行探索不同的优化路径，从而跳出单次迭代的局部最优。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n```text\n[问题与输入] ---\u003E [核心机制] ---\u003E [执行过程] ---\u003E [任务输出]\n                         |                 |\n                         +----\u003E [效果与证据]\n```\n\n《MaxKernel: Agentic Kernel Generation for TPUs》的方法可以从当前可提取文本中归纳为一条清晰链路：它先把论文要处理的任务和失败模式具体化，再围绕核心洞察设计可执行的 agent / memory / workflow 机制，最后用任务表现或案例分析验证这个机制是否缓解原问题。\n\n1. 输入与问题定位：系统首先面对的是论文摘要和引言中描述的目标场景。可确认的依据是：### § 1 研究问题与重要性 本文提出并解决的研究问题是如何利用多智能体系统自动化生成和优化Tensor Processing Units (TPUs)的高性能custom kernels。这个问题至关重要，因为随着深度学习架构规模的不断扩大，对专用硬件加速器的需求日益增长。为了充分利用这些设备的计算和内存带宽，工程师通常需要绕过标准compiler pipelines来开发定制化的优化kernels。然而，编写这些kernels（如针对TPU的JAX/Pallas）是一个极其复杂的过程，要求开发者具备深厚的硬件级专业知识，包括手动管理memory hierarchies（如HBM与VMEM）、编排Direct Memory Access (DMA) pipelining以及推导多维tiling strategies。解决这一问题能够大幅降低硬件加速器编程的技术门槛，减少领域专家的手工调优工作量，并确保硬件性能得到最大化释放。 ### § 2 前人工作与不足 在MaxKernel之前，该问题已通过传统compiler优化技术和基于Large Language Models (LLMs)的方法进行了部分探索。传统compiler优化技术如Halide、TVM和Ansor通过将算法定义与调度解耦来应对复杂性，但它们仍然依赖大量的domain knowledge或极其昂贵的evolutionary search阶段。近期的研究（如AutoComp）开始利用LLMs来导航tensor programs的搜索空间，而标准的zero-shot或few-shot LLM方法也尝试直接生成代码。然而，这些先前的工作存在显著不足：首先，由于accelerator APIs的rigidity、严格的memory constraints以及opaque low-level compiler errors，标准LLM方法无法仅凭静态生成产出高质量代码，必须依赖real-time compiler feedback进行迭代，而前人缺乏一个能够无缝集成compiler pipelines和em...\n2. 核心操作：方法部分围绕这一洞察展开：### § 3 重建作者的思考路径 编写高性能的TPU kernel需要专家手动管理内存层次（如HBM与VMEM）、编排DMA pipelining以及设计多维tiling策略，这极大地限制了开发效率。早期尝试使用传统编译器（如TVM、Halide）通过解耦算法和调度来自动化这一过程，但它们仍需大量领域知识或昂贵的evolutionary search。随着LLM的兴起，研究者尝试用zero-shot或few-shot prompting直接生成代码，但加速器API的僵化和低级编译器错误的晦涩导致编译成功率极低。为了解决这个问题，必须引入real-time compiler feedback，让LLM在错误中自我修正。然而，即使代码能编译运行，单线性的iterative refinement（如简单的hill-climbing）在面对复杂的内存布局和tiling策略时，极易陷入局部最优。此外，缺乏精确的硬件性能反馈，LLM无法判断优化方向是否正确。因此，研究者自然会想到将整个优化过程拆解为模块化的sub-agents，并引入XProf等profiling工具提供量化的硬件指标作为闭环反馈。为了克服单次迭代的局限性，可以将这个闭环agent作为基础单元，嵌入到更宏观的图搜索框架中，通过Parallel Search或Beam Search在全局设计空间中并行探索不同的优化路径。同时，考虑到复杂kernel的开发仍需人类直觉的引导，保留Human-in-the-Loop的交互模式也是顺理成章的演进。 ### § 4 核心 Intuition 纯LLM生成缺乏对底层硬件约束的感知，而单次线性迭代优化又容易被困在次优的编译状态中。MaxKernel的核心在于将TPU kernel优化拆解为模块化的agent闭环，利用XProf提取的真实硬件指标作为反馈信号驱动迭代。同时，它将这个闭环agent封装为图搜索的节点，通过Parallel或Beam search在全局设计空间中并行探索不同的优化路径，从而跳出单次迭代的局部最优。 也就是说，它不是只给模型更多上下文，而是把经验、状态、证据或反馈整理成后续决策可复用的结构。\n3. 输出与目的：最终输出应当是更稳定的 agent 行为、记忆更新、任务执行结果或工作流改进；这样做的直接目的，是减少长程任务中的遗忘、错误累积或不可复用经验。\n4. 当前证据边界：当前可提取文本未提供足够消融细节，因此这里不编造组件级实验结论；已确认的方法线索来自摘要、引言/核心洞察和正文片段：**==\u003E picture [56 x 19] intentionally omitted \u003C==** ## **MaxKernel: Agentic Kernel Generation for TPUs** **Shangkun Wang**[1,*] **, Nina Cai**[1,*] **, Charles Hong**[1] **, Julian Walker**[2] **, Gerson Kroiz**[1] **, George Vanica**[1] **, Deepak Patil**[1] **, Andi Gavrilescu**[1] **, Hassan Sipra**[1] **and Sethu Sankaran**[1] *Equal contributions, 2Google DeepMind, 1Google Code: `https://github.com/AI-Hypercomputer/accelerator-agents/tree/main/MaxKernel` **Designing and authoring high-performance custom kernels for accelerators is a complex task that requires deep hardware-level expertise. Large Language Models (LLM) can be leveraged together with real-time compiler feedback to build agentic systems for kernel generation. In this work, we present MaxKernel, a multi-agent system that implements three distinct paradigms for TPU kernel development: (1) a Humanin-the-Loop (HITL) agent f...", "additional_insights": "## § 8 Take-aways\n\nMaxKernel 是一个面向 TPU kernel 优化的 multi-agent 系统，核心思路是将 kernel 生成分解为 Planning、Implementation、Testing、Autotuning、Profiling 等子任务，由专门的 sub-agent 分别处理，再通过 orchestrator 串联成闭环。系统提供三种执行范式：HITL 适合复杂 kernel 中人类专家介入关键决策点；Autonomous Loop 以 Plan→Implement→Compile→Test→Autotune→Profile 的固定序列做局部 hill-climbing；Graph-Based Search 将 Auto agent 嵌入 beam search 或 parallel search 框架中以逃离 local optima。RAG knowledge base 明确排除了 hand-tuned kernel 代码，目的是测试 agent 能否在不依赖人类基线的情况下自主发现 TPU 优化策略。在 JaxBench 的 50 个任务上，Best-of-N zero-shot 仅获得 10/50 的编译成功率和 1.08× speedup，说明无反馈的 LLM 生成几乎不可用；引入迭代反馈后，Auto agent 将编译率提升至 49/50、speedup 提升至 1.39×（中位数），但单次运行方差很大（1.19×–1.42×）。Parallel search（5 条独立轨迹各 5 次迭代取最优）将 speedup 推至 1.58×，编译率和正确率均达 50/50，是三种范式中表现最好的。Beam search（beam width=3, depth=3, 每节点仅 2 次迭代）在 depth 3 处出现性能 plateau，原因是 Pallas 的低级 kernel 优化常需要多步迭代调试才能解决内存约束和 lowering 失败，浅层预算导致过早剪枝。在 8 个有 human-tuned Pallas 参考的生产 kernel 上，MaxKernel Parallel 取得 2.32× geometric mean speedup，超过人类专家的 2.02×，其中 Paged Attention 达到 6.74×（人类 2.41×），但 Ragged Paged Attention 上人类 4.65× 远超 agent 的 1.42×。在 SOTA OSS 模型上，MaxKernel 对 MLA v1 实现 9.5% throughput 提升，对 Qwen3-Next Gated DeltaNet 训练步加速 4.70×，对 DeepSeek-V4 Sparse Attention prefill 加速 7.85×，还自动修复了 RPAv3 的 crash 问题（通过添加 ALU clamp 指令处理 left-padded inputs）。所有实验仅使用 Gemini 3.1 Pro，未做其他 LLM 的 ablation。\n\n## § 9 最脆弱的假设\n\n整个系统最核心也最脆弱的假设是：**LLM 能够有效解读 XProf profiling trace 并将其转化为有意义的代码优化决策**。这是 Autonomous Loop 闭环优化的信息瓶颈——Profiling Agent 提取的 empirical metrics（execution latency、memory bandwidth utilization、compute density）被直接注入下一轮 Planning Agent 的 prompt，驱动 data-driven improvement。如果 LLM 无法从这些低级 trace 数据中推断出正确的优化方向（例如判断瓶颈在 HBM bandwidth 还是 compute density，并据此调整 tiling strategy 或 DMA pipelining），那么闭环就退化为无信息引导的随机尝试加 autotuning，与 Parallel Search 取最优的本质区别消失。\n\n这个假设在实际中可能不成立的原因有三层。第一，XProf trace 包含大量低级硬件事件，LLM 对 TPU microarchitecture 的理解可能不足以建立\"profiling metric → code change\"的因果映射，尤其当瓶颈涉及复杂的 memory hierarchy 交互（VMEM bank conflict、DMA pipeline stall）时。第二，即使 LLM 能正确识别瓶颈，Pallas API 的 rigidity 可能使得对应的代码修改无法表达——论文多次提到\"rigid memory constraints\"和\"lowering failures\"，暗示 API 表达能力本身是瓶颈。第三，autotuning（调 block size、tile dimension）可能贡献了大部分 speedup，而 profiling-driven 的算法级优化贡献被淹没。\n\n论文提供的证据存在明显缺口。Table 1 显示 Auto agent（含 profiling）的 1.39× 优于 Best-of-N 的 1.08×，但这一差距可能来自三个混杂因素中的任意一个或组合：(a) 迭代编译修复提高了编译成功率，(b) autotuning 探索了更好的超参数，(c)
