{N}(0, I)$ 中采样 $G$ 个全参数扰动向量 $\\epsilon_1, ..., \\epsilon_G$。\n    *   **操作**：对于每个扰动 $\\epsilon_i$，将其加到当前参数上得到临时参数 $\\theta_i = \\theta + \\sigma \\epsilon_i$。这里 $\\sigma$ 是扰动半径，Agentic ESOpt 引入了 **Cosine Decay Schedule** 来动态调整 $\\sigma$，初期较大以探索，后期较小以利用。\n\n2.  **并行 Rollout 与评估 (Parallel Rollout \u0026 Evaluation)**：\n    *   **处理**：使用 $G$ 个不同的扰动参数 $\\theta_i$ 分别作为 Agent，在 WebArena 环境中执行相同的任务。\n    *   **交互**：每个 Agent 独立地与浏览器环境进行多轮交互（Observation-Action 循环），直到任务完成或达到最大步数。\n    *   **奖励获取**：环境返回标量奖励 $R_i$（例如，任务成功为 1，失败为 0）。由于是黑盒优化，不需要计算梯度，只需最终的任务得分。\n\n3.  **奖励归一化 (Reward Normalization)**：\n    *   **处理**：为了减少方差并稳定更新，算法对当前批次（Population）内的奖励 $R_i$ 进行 Z-score 归一化，得到标准化奖励 $\\hat{R}_i$。\n    *   **公式**：$\\hat{R}_i = \\frac{R_i - \\text{mean}(R)}{\\text{std}(R)}$。\n\n4.  **参数更新 (Parameter Update)**：\n    *   **处理**：根据归一化后的奖励和对应的扰动方向，计算伪梯度（Pseudo-gradient）并更新原始参数 $\\theta$。\n    *   **公式**：$\\theta \\leftarrow \\theta + \\alpha \\sum_{i=1}^G \\hat{R}_i \\epsilon_i$，其中 $\\alpha$ 是学习率。\n    *   **关键特性**：此过程仅涉及前向传播和简单的向量加法，无需存储激活值或优化器状态，因此 GPU 显存占用仅相当于推理级别（Inference-level）。\n\n5.  **Prompt-Parameter Co-Evolution (可选，灵活性体现)**：\n    *   **处理**：Agentic ESOpt 可以与 **Trace2Skill** 等 Prompt 空间优化方法结合。在参数更新的同时，利用生成的轨迹（Trajectories）提炼技能（Skills）并更新外部 Prompt $c_t$。\n    *   **输出**：更新后的模型参数 $\\theta$ 和优化的 Prompt/Skill 上下文。\n\n6.  **迭代与收敛 (Iteration)**：\n    *   重复上述步骤，直到达到预设的训练代数（Generations）。在 Test-time Compute 场景下，$\\sigma$ 最终衰减至 0，以消除平滑偏差，获得针对特定任务的最优参数。\n\n---\n\n### § 6 核心数学推导\n\n这篇论文的核心数学推导主要围绕 **ES 伪梯度的推导** 和 **长视界下方差的可扩展性分析** 展开。\n\n#### 1. ES 伪梯度的推导 (Derivation of Scalar-Score ES Gradient)\n\n**理论背景**：\n传统的 RL 方法（如 PPO/GRPO）通过反向传播计算策略梯度 $\\nabla_\\theta \\log \\pi_\\theta(a|s)$。而 ES 方法不计算梯度，而是通过扰动参数来估计目标函数的梯度方向。\n\n**推导过程**：\n*   **平滑目标函数**：定义一个高斯平滑后的目标函数 $J_\\sigma(\\theta)$，即在参数 $\\theta$ 附近添加高斯噪声 $\\sigma \\epsilon$ 后的期望奖励：\n    $$ J_\\sigma(\\theta) = \\mathbb{E}_{\\epsilon \\sim \\mathcal{N}(0, I)} [J(\\theta + \\sigma \\epsilon)] $$\n*   **对数导数技巧 (Log-Derivative Trick)**：为了求 $J_\\sigma(\\theta)$ 关于 $\\theta$ 的梯度，利用积分与微分交换顺序，并引入概率密度函数 $p(\\epsilon)$ 的对数导数：\n    $$ \\nabla_\\theta J_\\sigma(\\theta) = \\mathbb{E}_{\\epsilon \\sim \\mathcal{N}(0, I)} [J(\\theta + \\sigma \\epsilon) \\nabla_\\theta \\log p(\\epsilon)] $$\n*   **高斯分布性质**：对于标准正态分布，$\\nabla_\\theta \\log p(\\epsilon) = \\frac{\\epsilon}{\\sigma^2}$。代入上式：\n    $$ \\nabla_\\theta J_\\sigma(\\theta) = \\frac{1}{\\sigma} \\mathbb{E}_{\\epsilon \\sim \\mathcal{N}(0, I)} [J(\\theta + \\sigma \\epsilon) \\epsilon] $$\n*   **蒙特卡洛估计**：在实际实现中，用 $G$ 个采样点来估计期望：\n    $$ \\hat{g} = \\frac{1}{G \\sigma} \\sum_{i=1}^G R_i \\epsilon_i $$\n    *(注：论文实现中省略了 $1/\\sigma$ 因子，将其吸收到学习率 $\\alpha$ 中)*\n\n**Intuition**：\n这个公式告诉我们，不需要知道奖励是如何由每一步动作产生的（即不需要反向传播），只需要知道“往哪个方向扰动参数（$\\epsilon_i$）带来了更高的奖励（$R_i$）”，就可以沿着这个方向更新参数。\n\n#### 2. 长视界下的方差分析 (Long-Horizon Variance Analysis)\n\n**理论背景**：\n在长视界任务中，RL 方法的梯度估计方差会随着视界长度 $H$ 线性增长，导致信用分配困难。\n\n**推导对比**：\n*   **Agentic RL (Policy Gradient)**：\n    梯度估计器为 $\\sum_{t=1}^H \\nabla_\\theta \\log \\pi_\\theta(a_t|s_t) R$。\n    假设各步动作得分项近似不相关，其方差近似为：\n    $$ \\text{Var}(\\text{RL}) \\approx H \\cdot \\text{Var}(\\nabla_\\theta \\log \\pi_\\theta) \\cdot \\text{Var}(R) $$\n    **Intuition**：RL 需要将最终的标量奖励 $R$ 分解并分配给 $H$ 个时间步的动作，视界越长，累积的噪声和方差越大。\n\n*   **Agentic ESOpt (ES)**：\n    梯度估计器为 $\\frac{1}{\\sigma} R \\epsilon$。\n    其方差近似为：\n    $$ \\text{Var}(\\text{ES}) \\approx \\frac{1}{\\sigma^2} \\text{Var}(R) \\cdot \\text{Var}(\\epsilon) $$\n    **Intuition**：ES 直接将整个轨迹的奖励 $R$ 归因于一个整体的参数扰动 $\\epsilon$。公式中**没有对 $H$ 求和**。因此，ES 的估计器方差**不显式依赖于视界长度 $H$**。\n\n**结论**：\n随着视界 $H$ 的增长，RL 的方差线性增加，而 ES 的方差保持相对稳定。这解释了为什么在长视界任务（如 Sudoku $H^*=15$）中，Agentic ESOpt 优于 Agentic RL。\n\n---\n\n### § 7 实验设计与结论\n\n#### 1. 长视界可扩展性 (Long-Horizon Scalability)\n*   **提出了什么问题**：在长视界、稀疏奖励的任务中，Agentic RL 是否因信用分配困难和显存限制而失效？ES 是否能更好地扩展？\n*   **设计了什么实验验证这个问题**：设计了可控的 **Agentic Sudoku** 实验，通过改变掩码数量（5, 10, 15）来控制最小成功视界 $H^*$。对比 Agentic PPO, Agentic GRPO 和 Agentic ESOpt 在不同 $H^*$ 下的成功率、显存占用和训练时间。\n*   **问题的答案是什么**：\n    *   在短视界 ($H^*=5$) 下，PPO 表现最好。\n    *   在中等视界 ($H^*=10$) 下，GRPO 表现最好。\n    *   在长视界 ($H^*=15$) 下，**Agentic ESOpt 显著优于 RL 方法**（比最强 GRPO 基线高出 12.5%），且显存占用仅为 RL 的 ~14%（8.41GB vs 58.88GB）。\n    *   结论：ES 在长视界下具有更好的可扩展性，且显存效率极高。\n\n#### 2. 模型可扩展性与工具使用 (Model Scalability \u0026 Tool Use)\n*   **提出了什么问题**：ES 能否在保持低显存占用的同时，有效微调大参数模型（如 27B）以增强工具使用能力？\n*   **设计了什么实验验证这个问题**：在 **Math Reasoning (DAPO/AIME)** 和 **DocVQA** 任务上，使用 Qwen3.5-4B 对比 Agentic ESOpt 和 Agentic GRPO。在 **WebArena-Lite** 任务上，使用 Qwen3.5-27B 进行全参数微调，对比 No Skill 基线和 Trace2Skill 基线。\n*   **问题的答案是什么**：\n    *   在 Math/DocVQA 上，Agentic ESOpt 平均比基线提升 13.7%，比 Agentic GRPO 提升 8.3%，且在 Pass@K 指标上覆盖更广。\n    *   在 WebArena-Lite 上，Agentic ESOpt 使 Qwen3.5-27B 的 No Skill 基线提升了 6.69%，并结合 Trace2Skill 进一步提升了 2.42%。\n    *   结论：Agentic ESOpt 能够高效地全参数微调大模型，且能与 Prompt 空间优化灵活组合。\n\n#### 3. Test-Time Compute 与启发式设计 (Test-Time Compute \u0026 AHD)\n*   **提出了什么问题**：Agentic ESOpt 能否在推理阶段（Test-Time）通过在线参数适应，增强现有的启发式算法设计（AHD）流程？\n*   **设计了什么实验验证这个问题**：在 **Automatic Heuristic Design (AHD)** 任务（如 TSP, KP, ASP）中，将 Agentic ESOpt 嵌入到现有的 **Sample** 和 **EoH** 搜索框架中，对比纯搜索与“搜索+参数适应”的效果。\n*   **问题的答案是什么**：\n    *   在 36 个对比设置中，Agentic ESOpt 在 **28 个** 设置中提升了性能。\n    *   结论：Agentic ESOpt 的黑盒特性使其能无缝集成到 Test-Time Compute 流程中，通过参数-启发式协同进化（Heuristic-Parameter Co-Evolution）显著提升性能。", "additional_insights": "### § 8 Take-aways\n\nAgentic ESOpt 利用 Evolution Strategies (ES) 的无梯度特性，将长视界（Long-Horizon）LLM Agent 的全参数微调 GPU 内存需求降至仅推理级别（Inference-level），解决了 Agentic RL 中因存储 Activations 和 Optimizer States 导致的显存瓶颈。在长视界稀疏奖励场景下，ES 通过轨迹级参数归因（Trajectory-level parameter attribution）避免了 Policy Gradient 中随视界长度线性增长的方差，从而在视界较长时（如 Sudoku H*=15）显著优于 Agentic PPO 和 GRPO。该方法具备高度的灵活性，其轻量级黑盒反馈接口允许参数更新与 Prompt-space 优化（如 Trace2Skill）或 Test-time Compute（如 EoH）进行在线协同进化（Co-evolution），在 28/36 的自动启发式设计（AHD）对比中提升了基线性能。实验表明，更强的 Backbone 模型对 ES 的种群大小（Population size）敏感度更低，暗示了随着模型能力提升，所需的采样方向可能减少，为大规模 LLM 的高效微调提供了新的 Scaling Law 视角。\n\n### § 9 最脆弱的假设\n\n该方法最核心的脆弱假设是：**环境评估（Environment Evaluation）的成本相对于模型前向传播（Forward Pass）的成本是可以接受的，且环境反馈具有足够的区分度以指导参数更新。**\n\n如果环境评估极其昂贵（例如需要真实的物理机器人交互或极耗时的复杂仿真），ES 需要的大种群（Large Population, G=32 或更多）会导致总计算时间远超基于梯度的 RL 方法，此时 Agentic ESOpt 的“内存效率”优势将被“时间效率”劣势抵消。此外，ES 依赖于标量奖励（Scalar Reward）对参数扰动的排序，如果长视界任务中的奖励信号过于稀疏或噪声过大（即不同参数扰动产生的轨迹奖励差异极小），ES 的梯度估计方差将急剧增加，导致优化停滞。\n\n论文通过 Sudoku 和 WebArena 等可快速模拟的环境验证了可行性，并指出在 AHD 中代码执行成本可控。然而，论文在 Limitations 部分承认，当环境评估本身“极其昂贵”时，这种权衡可能不再有利。论文缺乏在极高延迟或高成本环境（如真实世界机器人控制或复杂多智能体博弈）中的实证数据，因此无法证明其在这些极端场景下的鲁棒性。如果环境反馈无法有效区分不同参数扰动的优劣，ES 的无梯度优势将转化为优化效率的劣势。\n\n### § 10 最小复现实验\n\n**目标：** 验证 Agentic ESOpt 在长视界稀疏奖励下相比 Agentic GRPO 的视界依赖性优势（Horizon-dependent advantage）。\n\n**数据与设置：**\n1.  **模型：** 使用开源小参数模型，如 Qwen2.5-1.5B 或 Llama-3.2-1B，以适配单卡 GPU。\n2.  **环境：** 复现论文中的 **Sudoku** 环境，但简化为 4x4 或 6x6 网格，以控制计算量。设置不同的最小成功视界（Minimum Successful Horizon, $H^*$），例如 $H^*=2, 4, 6$。\n3.  **基线：** 实现一个简化的 Agentic GRPO（使用 HuggingFace TRL 库）和一个 Vanilla ES（无 Cosine Decay）。\n\n**实现步骤：**\n1.  构建一个多轮交互的 Sudoku Agent，每步仅填充一个格子，最终获得二元奖励（成功/失败）。\n2.  在相同的 FLOPs 预算下（例如总前向传播次数相同），分别训练 Agentic GRPO 和 Agentic ESOpt。\n3.  记录不同 $H^*$ 下的最终成功率（Success Rate）和训练过程中的平均轨迹长度（Average Horizon）。\n\n**测量与判定：**\n*   **支持 Claim：** 如果随着 $H^*$ 增加，Agentic ESOpt 的成功率相对于 Agentic GRPO 的提升幅度逐渐增大（即在短视界下两者持平或 GRPO 略优，但在长视界下 ESOpt 显著反超），且 ESOpt 的平均轨迹长度更接近理论最小值，则支持论文关于“长视界可扩展性”的核心论点。\n*   **反驳 Claim：** 如果 Agentic GRPO 在所有 $H^*$ 下均优于或持平 ESOpt，或者 ESOpt 在长视界下出现严重的性能崩溃（由于奖励稀疏导致梯度估计失效），则说明 ES 在该特定稀疏奖励结构下并未展现出预期的视界优势，或者小模型下的噪声干扰掩盖了算法本身的特性。", "research_value": "### § 11 最强反例设计\n\n要挑战 Agentic ESOpt 的核心主张，最有力的攻击并非针对其显存效率（这是由算法定义决定的事实），而是针对其**样本效率（Sample Efficiency）与长视界任务中“奖励稀疏性”导致的优化停滞（Optimization Stagnation）之间的矛盾**。论文声称 ES 通过轨迹级归因避免了视界依赖的方差，但这建立在一个隐含假设之上：即不同参数扰动 $\\epsilon_i$ 产生的轨迹奖励 $R_i$ 具有足够的区分度（Signal-to-Noise Ratio, SNR）。\n\n**反例实验设计：高维连续控制中的“奖励悬崖”与局部最优陷阱**\n设计一个基于 **MuJoCo** 或 **Habitat** 的长视界导航任务，其中奖励函数具有极高的稀疏性和非凸性（例如，只有到达特定坐标才给予 +1 奖励，否则为 0，且路径中存在大量局部最优的“死胡同”）。\n1.  **设置**：使用与论文相同规模的 LLM（如 7B-13B），对比 Agentic ESOpt 与经过改进的 **Agentic PPO with GAE (Generalized Advantage Estimation)** 或 **DreamerV3**（基于世界模型的 RL）。\n2.  **攻击点**：在长视界且奖励极度稀疏的场景下，ES 的梯度估计 $\\hat{g} \\propto \\sum R_i \\epsilon_i$ 将退化为纯噪声。因为绝大多数扰动 $\\epsilon_i$ 都会导致失败（$R_i=0$），只有极少数偶然成功的扰动提供信号。随着视界 $H$ 增加，成功概率呈指数级下降，导致有效样本量（Effective Sample Size）急剧减少。\n3.  **预期结果**：Agentic ESOpt 将陷入长期的平台期，无法收敛到最优策略，或者收敛速度比基于价值函数（Value Function）引导的 RL 方法慢几个数量级。RL 方法虽然显存高，但通过 Critic 模型提供的密集中间奖励信号（Dense Intermediate Rewards），能够引导策略向可行区域移动，而 ES 缺乏这种“引导”，只能依靠盲目的随机搜索。\n4.  **理论论证**：证明在奖励分布接近伯努利分布且成功概率 $p \\ll 1/G$（$G$ 为种群大小）时，ES 的梯度估计方差 $\\text{Var}(\\hat{g})$ 实际上会随 $1/p$ 发散，而非论文声称的与 $H$ 无关。这意味着在真正的长视界稀疏奖励任务中，ES 的“无方差增长”优势被“极低信噪比”的劣势所抵消，导致其实际所需的计算量（FLOPs）远超 RL。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：基于隐式世界模型的 ES 引导搜索 (Implicit World-Model Guided Evolution Strategies)**\n\n**(a) 驱动局限与未满足需求：**\nAgentic ESOpt 的核心局限在于其“黑盒”特性导致样本效率低下，特别是在长视界任务中，它无法利用中间状态的信息来指导参数更新。现有的解决方案（如增加种群大小）会线性增加计算成本，违背了其“低资源”的初衷。我们需要一种方法，既能保持 ES 的低显存优势，又能引入类似 RL 中 Critic 模型的“引导信号”，但无需存储激活值或进行反向传播。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴 **DreamerV3** 或 **World Models** 中的“隐式世界模型”概念，以及 **Differentiable Evolution Strategies** 中的“代理奖励（Surrogate Reward）”思想。具体而言，利用一个轻量级的、冻结的 **Small Language Model (SLM)** 或 **Vision-Language Model (VLM)** 作为“代理 Critic”，在参数空间扰动后，不直接运行昂贵的环境交互，而是先在隐式空间中进行“思维链（Chain-of-Thought）”模拟，预测轨迹的潜在价值。\n\n**(c) 第一个实验设计：**\n1.  **框架**：构建 **W-ESOpt (World-Model ESOpt)**。在 Agentic ESOpt 的扰动采样后，引入一个两阶段评估：\n    *   **Stage 1 (Implicit Simulation)**：使用一个小型的、预训练的 SLM（如 Qwen2.5-0.5B）作为“内部模拟器”，对扰动后的 Agent 在关键决策点进行“思维模拟”，生成一个密集的、基于逻辑一致性的代理奖励 $\\hat{R}_{proxy}$。\n    *   **Stage 2 (Real Evaluation)**：仅对代理奖励最高的 Top-K 个扰动进行真实的环境交互，获取真实奖励 $R_{real}$。\n    *   **Update**：结合 $\\hat{R}_{proxy}$ 和 $R_{real}$ 进行加权更新。\n2.  **实验**：在 **WebArena-Lite** 和 **Sudoku** 上，对比 Vanilla ESOpt、Agentic PPO 和 W-ESOpt。\n3.  **预期贡献**：证明通过引入隐式世界模型的“预筛选”机制，可以将 ES 的有效样本利用率提高 10 倍以上，从而在保持推理级显存占用的同时，显著缩短长视界任务的收敛时间。这将打破“低显存”与“高样本效率”之间的权衡，为大规模 LLM 的在线微调提供新的范式。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Zhi Zheng\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Rongsheng Chen\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yunpeng Ba\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Zhenkun Wang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yee Whye Teh\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Wee Sun Lee\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"National University of Singapore\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Southern University of Science and Technology\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Oxford\"\n    }\n  ],\n  \"footnotes\": []\n}\n```", "summary_translation": "强化学习（RL）在单轮大语言模型（LLM）微调中展现出巨大潜力。然而，长程智能体推理引入了日益分支化的交互和稀疏奖励，暴露了 RL 的几个局限性：其基于反向传播的重型训练栈使得微调更大的 LLM 变得不切实际，而更长的轨迹使得 RL 中的信用分配变得极其困难。本文认为，进化策略（ES）可能是微调长程 LLM 智能体的更好选择。与智能体 RL 相比，ES 具有三个关键优势：1）模型可扩展性：ES 仅需极少的推理级 GPU 内存即可实现全参数优化，使得微调大型 LLM 成为可能；2）灵活性：其轻量级的黑盒反馈接口使得 ES 微调易于与提示空间进化（例如技能优化和测试时计算）组合；3）长程可扩展性：ES 在不跨时间步分解奖励的情况下执行轨迹级参数归因，随着时间步长的增加，其可扩展性优于智能体 RL。基于这一见解，我们提出了 Agentic ESOpt，这是一个专为灵活的参数-上下文协同进化而设计的全参数智能体微调框架。在每一步中，Agentic ESOpt 在当前 LLM 参数周围采样扰动，使用奖励评估生成的智能体，并应用在线奖励加权更新。为了改善探索-适应权衡，Agentic ESOpt 进一步引入了扰动尺度 $σ$ 的余弦衰减调度。在 WebArena-Lite 上，Qwen-3.5-27B 的全参数优化将 No Skill 基线提升了 6.69%。在测试时自动启发式设计方面，Agentic ESOpt 执行在线提示-参数协同进化，在 36 种设置中的 28 种中提升了其匹配的基线性能。"}, {"title": "Agent Lightning v1.0: Towards Harnessed Agentic RL", "arxiv_id": "2608.17528", "authors": "Zhiyuan He, Siwei Zhang, Zhiwen Zhou, Yuqing Yang, Yu Kang, Yuge Zhang, Luna K. Qiu, Tin Yan Tsui, Jiahang Xu, Chong Luo", "summary": "Modern agents operate inside agent harnesses that manage tools, context, and control flow, making the harness a critical part of the agent system. Our original Agent Lightning introduced a disaggregated architecture that connects arbitrary agents to RL training through an LLM endpoint proxy, an approach later adopted by frameworks such as verl Uni-Agent, AReaL 2.0, slime, and Polar. We refer to this paradigm as harnessed agentic RL, where the deploy-time harness directly participates in model post-training. Harnessed agentic RL differs fundamentally from traditional agentic RL: the harness, rather than the training engine, owns the environment interaction loop, while the trainer observes only sequences of LLM request-response pairs. This introduces challenges in retokenization, sample merging, advantage calculation, loss normalization, and backend scheduling, which can substantially affect training stability and effectiveness. We present Agent Lightning v1.0, a lightweight framework for harnessed agentic RL implemented in approximately 3,500 lines of code. It supports arbitrary agent harnesses and serves as a practical testbed for studying these challenges. We evaluate it on instruction-following, search, and coding agents, and provide a complete reproducible pipeline for coding-agent RL. Using only 6K training examples and modest compute, RL improves Qwen3.5-9B on SWE-bench Verified from 41.8% to 56.4%, a 14.6-point absolute gain. We release the complete workflow and training scripts to facilitate reproducible research on harnessed agentic RL.", "category": "cs.AI", "cluster": "Reinforcement Learning \u0026 Training for Agents", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, Agent capability/behavior, Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：如何在 **Harnessed Agentic RL**（带框架的代理强化学习）范式下，解决由 **Agent Harness**（代理框架）与 **Training Engine**（训练引擎）解耦所引发的一系列算法一致性与工程挑战。具体而言，当代理不再直接与环境交互，而是通过 **LLM API** 与训练系统通信时，训练引擎仅能观察到离散的 **Request-Response Pairs**，而非连续的 **Token History**。这种架构导致了四个关键问题：**Retokenization**（重新分词）导致的 **Token-Prefix Continuity**（Token 前缀连续性）断裂、动态样本数量下的 **Advantage Calculation**（优势计算）偏差、**Loss Normalization**（损失归一化）的不稳定性，以及 **Training Backend Scheduling**（训练后端调度）的复杂性。\n\n这一问题的重要性在于，现代智能体（如 Coding Agent、Search Agent）并非独立的 LLM，而是运行在复杂的 **Agent Harness** 中，由 Harness 管理工具调用、上下文构建和控制流。传统的 **Agentic RL** 要求将代理逻辑硬编码进训练框架，这导致难以复用现有的、成熟的开源或商业代理框架（如 **mini-SWE-agent**, **OpenHands**）。**Harnessed Agentic RL** 通过 **Proxy-based** 架构允许任意代理接入 RL 训练，从而缩小了训练与部署之间的差距（Narrowing the gap between training and actual use）。然而，现有框架在处理这种解耦架构时，往往忽略了底层 Token 级别的不一致性，导致训练不稳定或算法错误。解决这些问题不仅能实现更稳定、高效的代理训练，还能降低使用复杂代理框架进行 RL 训练的门槛，使得利用小规模数据（如 6K 样本）在有限算力下显著提升模型性能（如在 **SWE-bench Verified** 上提升 14.6%）成为可能，从而推动 **Agentic RL** 的普及和可复现性。\n\n### § 2 前人工作与不足\n\n该问题在早期并未被清晰定义，因为早期的 RL 框架（如 **verl**, **AReaL**, **slime** 的早期版本）通常要求用户在训练框架内部直接实现代理循环（Agent Loop），即采用传统的 **Agentic RL** 范式。在这种范式下，训练引擎拥有环境交互循环，能够维护完整的 **Token History**，因此不存在 **Retokenization** 或动态样本合并的问题。然而，这种方法无法直接集成现有的、具有复杂依赖和独立控制流的 **Agent Harness**，限制了其实用性。\n\n随着 **Proxy-based** 架构的兴起，近期的一些框架如 **verl Uni-Agent**, **AReaL 2.0**, **slime v0.3.0**, 和 **Polar** 开始支持通过 LLM 端点代理连接任意代理。这些系统虽然实现了架构上的解耦，但在处理 **Harnessed Agentic RL** 特有的挑战时存在显著不足：\n\n1.  **Retokenization 处理不当**：大多数框架（如 **AReaL**, **verl Uni-Agent**）采用 **Buffered Token Replacement** 策略，即当新请求的文本与历史匹配时，用缓冲的 Token 替换新请求中的对应部分。这种方法虽然保证了 **Token-Prefix Continuity**，但引入了 **Off-policy Discrepancy**（离策略偏差），因为模型实际是在修改后的 Prompt 下生成的，而非原始 Prompt。其他框架（如 **slime**, **Polar**）则不进行替换，导致 **Token-level Continuity** 断裂，影响训练效率或正确性。本文指出，现有的方法要么牺牲算法正确性（Off-policy），要么牺牲计算效率（独立训练），缺乏一种既保持 **On-policy** 正确性又兼顾效率的平衡方案（如本文提出的 **Best-effort Sequence Merging**）。\n2.  **Advantage Calculation 与 Loss Normalization 的随意性**：由于 **Retokenization** 和 Harness 操作（如子代理生成、上下文摘要），一个 **Rollout** 可能产生动态数量的训练样本。现有框架在计算 **Advantage** 和归一化 **Loss** 时选择各异：**verl Uni-Agent** 和 **Polar** 在 **Rollout Level** 计算，而 **slime** 和 **AReaL** 在 **Sample Level** 计算。本文论证，**Sample Level** 的计算会因偶然因素（如分词漂移）改变基线，导致优化方向偏差；而简单的 **Token-mean Loss** 对长序列敏感，易导致训练不稳定。现有框架未系统性地分析这些选择对训练稳定性和收敛性的影响，往往留下未指定的实现细节。\n3.  **工程成本与可复现性缺口**：现有框架常依赖昂贵的商业沙箱服务（如 **Modal Sandbox**, **E2B**）来执行代理，增加了训练成本。此外，对于复杂的代理任务（如 Coding Agent），现有框架缺乏完整的数据清洗管道和可复现的训练脚本，导致用户难以复现结果。本文通过提供基于 **Kubernetes** 的自托管执行环境和完整的 **Coding Agent** 训练流程，填补了这一工程与评测缺口。\n\n综上所述，前人工作虽然在架构上实现了代理与训练的解耦，但在算法细节（如 Token 一致性、优势计算）和工程实践（如成本控制、可复现性）上存在未解决的挑战，导致训练效果不稳定或难以大规模应用。", "core_insight": "### § 3 重建作者的思考路径\n\n在传统的 Agentic RL 研究中，训练引擎（Training Engine）通常直接拥有环境交互循环（Environment Interaction Loop），这意味着模型生成的 Token 历史是连续且透明的，可以直接映射为标准的 Markov Decision Process (MDP) 样本。然而，随着 Agent 生态的发展，成熟的 Agent Harness（如 mini-SWE-agent, OpenHands）变得日益复杂且独立，它们封装了工具调用、上下文管理和控制流。研究者发现，将这些复杂的 Harness 逻辑强行重构并嵌入到 RL 训练框架中不仅工程成本极高，而且破坏了部署时（Deploy-time）与训练时（Training-time）的一致性，导致严重的 Distribution Shift。\n\n为了解耦，早期的尝试（如最初的 Agent Lightning）引入了基于 LLM Endpoint Proxy 的架构，允许任意 Harness 通过 API 与训练后端通信。这种“Harnessed Agentic RL”范式虽然解决了集成难题，但引入了新的根本性挑战：训练引擎不再直接观察环境状态，而是只能观察到一系列离散的 Request-Response 对。研究者意识到，这种观察方式的改变导致了几个关键的技术断层。首先，由于 Harness 在每次调用前会重新构建 Prompt（Retokenization），即使文本内容相同，Token ID 也可能因 Chat Template 的非组合性或解码漂移（Decode-retokenize drift）而改变，导致传统的 Token-level Prefix 连续性假设失效，进而使得样本合并（Sample Merging）变得困难且容易引入 Off-policy 误差。\n\n其次，由于 Retokenization 或 Harness 内部操作（如子 Agent 生成、上下文摘要），一个 Rollout 可能分裂成动态数量的训练样本。这打破了传统 RL 中“一个 Rollout 对应一个样本”的假设，使得 Advantage Calculation 和 Loss Normalization 变得模糊不清。现有的框架（如 verl, AReaL, slime）在处理这些问题时往往缺乏统一的标准，有的按 Sample 级别计算，有的按 Rollout 级别计算，导致训练不稳定或奖励分配偏差。此外，动态的样本数量也给训练后端的调度带来了复杂性，因为 GPU 资源是固定的，而每个 Batch 产生的样本量是未知的。\n\n基于这些观察，研究者认为需要一个轻量级、透明的框架来系统地解决这些由“解耦”带来的副作用。他们意识到，核心不在于重新发明 RL 算法，而在于正确建模 Harness 与训练引擎之间的边界：保持 Token 级别的严格一致性（避免错误的 Prefix 合并），在 Rollout 级别而非 Sample 级别进行统计归一化（以消除由偶然因素导致的样本数量波动带来的偏差），并设计一个能够处理异步、动态负载的控制平面。由此，Agent Lightning v1.0 应运而生，旨在提供一个最小化、可复现的测试床，以验证这些针对 Harnessed Agentic RL 特定挑战的设计选择。\n\n### § 4 核心 Intuition\n\nHarnessed Agentic RL 的核心直觉在于承认并尊重 Agent Harness 作为独立实体的地位，训练引擎不应试图重构或模拟 Harness 的内部状态，而应将其视为一个黑盒，仅通过 API 边界观察离散的 Request-Response 序列。由于 Harness 的重新分词（Retokenization）和内部操作会导致一个 Rollout 分裂为动态数量的样本，传统的基于 Sample 的统计方法（如 Advantage 和 Loss 归一化）会引入由偶然因素驱动的偏差，因此必须在 Rollout 级别进行归一化，以确保每个任务轨迹获得平等的优化权重。同时，为了保持训练与部署的一致性，样本合并必须严格基于 Token 级别的精确前缀匹配，避免因强行拼接不同 Token ID 的序列而引入 Off-policy 误差，从而在解耦架构下实现稳定且正确的强化学习训练。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**Agent Lightning v1.0** 的核心方法是一种**解耦架构（Disaggregated Architecture）**，旨在实现 **Harnessed Agentic RL**。其核心思想是将 **Agent Harness**（负责工具调用、环境交互、上下文管理的运行时环境）与 **Training Engine**（负责模型推理和参数更新的训练后端）分离。两者通过一个轻量级的 **API Gateway** 和 **LLM Endpoint Proxy** 进行通信。\n\n以下是基于 **Coding Agent**（代码生成智能体）训练的真实 Pipeline 示例：\n\n#### 1. 输入阶段 (Input)\n*   **数据准备**：从 **SWE-smith** 数据集中选取一个软件修复任务（例如：修复 Python 库中的特定 Bug）。\n*   **Rollout 创建**：**Customized Trainer** 向 **API Gateway** 发送请求，创建一个 `Rollout` 对象，包含任务描述（Problem Statement）和初始环境配置。此时状态为 `Queuing`。\n\n#### 2. 执行与交互阶段 (Processing - Rollout Phase)\n*   **任务调度**：**Rollout Controller** 从 API Gateway 拉取 `Queuing` 状态的 Rollout，并在 **Kubernetes Cluster** 中启动一个 **Kubernetes Job**（即 Agent 的执行容器）。\n*   **Agent 循环 (Harness Loop)**：\n    1.  **上下文构建**：Agent Harness（如 **mini-SWE-agent**）读取当前代码库状态、错误日志和历史对话，构建 Prompt。\n    2.  **LLM 调用**：Harness 通过 HTTP 请求将 Prompt 发送给 **API Gateway** 的 Proxy 接口。\n    3.  **代理转发与记录**：API Gateway 将请求转发给后端的 **Inference Engine**（运行 Qwen3.5-9B 模型）。模型生成 Response（Token IDs 和 Log Probabilities）。API Gateway 记录这一对 `(Prompt, Response)` 为 `model_request` Event，并返回给 Harness。\n    4.  **工具执行**：Harness 解析 Response，执行代码修改或运行测试命令，获取环境观察（Observation）。\n    5.  **迭代**：重复步骤 1-4，直到任务完成或达到最大步数。\n*   **奖励计算**：任务结束后，Harness 运行测试套件。如果测试通过，返回 Reward = 1；否则 Reward = 0。Harness 将 Reward 作为 `reward` Event 上传至 API Gateway，并将 Rollout 状态更新为 `Succeeded` 或 `Failed`。\n\n#### 3. 样本组装与训练阶段 (Processing - Training Phase)\n*   **数据拉取**：**Customized Trainer** 检测到 Rollout 完成，从 API Gateway 拉取该 Rollout 的所有 `model_request` 和 `reward` Events。\n*   **样本合并 (Sample Merging)**：\n    *   Trainer 检查连续的 LLM 调用。如果第 $i+1$ 次调用的 Prompt 在 Token 级别上是第 $i$ 次调用 `(Prompt_i, Response_i)` 的精确前缀，则合并为一个训练样本。\n    *   *注意*：由于 **Retokenization** 问题（文本相同但 Token ID 不同），如果 Token 不匹配，则强制断开，作为独立样本处理，以保证 **Token-level Correctness**。\n*   **优势计算 (Advantage Calculation)**：\n    *   采用 **Rollout-level Advantage**。无论一个 Rollout 被拆分成多少个训练样本（例如因 Retokenization 或子 Agent 分支），整个 Rollout 共享同一个 Reward 和 Baseline。这避免了因样本数量动态变化导致的梯度偏差。\n*   **损失归一化 (Loss Normalization)**：\n    *   采用 **Rollout-level Token-mean Loss**。先计算每个 Rollout 内部所有 Token 的平均 Loss，再对所有 Rollout 取平均。这确保了每个任务（Rollout）对梯度的贡献权重相等，不受其产生的样本数量影响。\n*   **模型更新**：使用 **GRPO** 算法进行参数更新。\n\n#### 4. 输出阶段 (Output)\n*   **模型迭代**：更新后的模型权重被加载回 Inference Engine，用于下一批 Rollout 的推理。\n*   **监控与评估**：定期在 **SWE-bench Verified** 上评估模型性能。最终输出是一个在代码修复任务上表现显著提升的模型（从 41.8% 提升至 56.4%）。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文的核心贡献在于对 **Harnessed Agentic RL** 中因架构解耦而产生的数学建模挑战进行了形式化定义和修正，主要涉及 **Retokenization**、**Advantage Calculation** 和 **Loss Normalization**。\n\n#### 1. 传统 Agentic RL vs. Harnessed Agentic RL 的状态空间差异\n\n*   **传统 Agentic RL**：\n    *   训练引擎直接控制环境交互。\n    *   状态是连续的 Token 历史：$p_t = (p_{t-1}, a_{t-1}, o_t)$。\n    *   一个 Rollout 对应一个线性的 Token 轨迹，天然映射为一个训练样本。\n*   **Harnessed Agentic RL**：\n    *   Harness 控制交互，训练引擎仅观察到 LLM API 的请求-响应序列：$C_{tok}(\\rho) = ((p_{tok}^1, a_{tok}^1), (p_{tok}^2, a_{tok}^2), \\dots)$。\n    *   隐状态 $s_t$ 包含 Harness 状态和环境状态，模型不可见。\n    *   **核心问题**：如何将离散的 API 调用序列组装成有效的训练样本？\n\n#### 2. Retokenization 与 Token-Prefix Continuity 的断裂\n\n*   **直觉**：RL 训练依赖于精确的 Token ID 和 Log Probabilities。如果我们将两次调用合并，必须保证第二次调用的 Prompt 在 Token 级别上是第一次调用结果的精确前缀。\n*   **公式条件**：\n    $$ p_{tok}^{i+1} \\succeq (p_{tok}^i, a_{tok}^i) $$\n    其中 $\\succeq$ 表示精确的 Token 前缀关系。\n*   **断裂原因**：\n    1.  **Chat-template Non-compositionality**：拼接消息历史时，Template 可能插入或删除分隔符，导致 Token 边界变化。\n    2.  **Decode-Retokenize Drift**：Token 解码为文本后，再次 Tokenize 可能产生不同的 Token ID（例如 `having` 可能被拆分为 `h`+`aving` 或 `hav`+`ing`）。\n    3.  **Inference-time Output Transformation**：工具调用处理器可能修改 JSON 结构或空白符。\n*   **结论**：文本前缀匹配（Text-level prefix）不等于 Token 前缀匹配。强行合并会导致 **Off-policy Discrepancy**，因为模型是在修改后的 Prompt 下生成的，而非原始 Prompt。\n\n#### 3. Advantage Calculation 的层级选择\n\n*   **问题**：一个 Rollout $\\rho$ 可能产生 $N_\\rho$ 个训练样本。Reward $R_\\rho$ 分配给哪个层级？\n*   **Sample-level Advantage (错误做法)**：\n    $$ \\bar{r}_{sample} = \\frac{\\sum_{\\rho} \\sum_{j=1}^{N_\\rho} R_\\rho}{\\sum_{\\rho} N_\\rho} $$\n    *   *Intuition*：如果某个 Rollout 因为 Retokenization 被拆分成更多样本，它在计算 Baseline 时的权重会增加。这引入了噪声，因为拆分是偶然的，不应影响策略评估。\n*   **Rollout-level Advantage (正确做法)**：\n    $$ \\bar{r}_{rollout} = \\frac{\\sum_{\\rho} R_\\rho}{N_{rollouts}} $$\n    *   *Intuition*：每个任务（Rollout）是一个独立的决策单元。无论它内部被拆分成多少样本，其整体表现（Reward）应同等对待。这保证了统计的一致性。\n\n#### 4. Loss Normalization 的层级选择\n\n*   **问题**：如何归一化 Loss 以计算梯度？\n*   **Seq-mean-token-mean (GRPO 默认，有问题)**：\n    $$ L = \\frac{1}{N_{samples}} \\sum_{s} \\frac{1}{L_s} \\sum_{t} \\ell_{s,t} $$\n    *   *Intuition*：先对每个样本内的 Token 取平均，再对所有样本取平均。如果某个 Rollout 产生了更多样本，它对总 Loss 的贡献更大。这会导致训练不稳定，因为样本数量是动态且不可控的。\n*   **Rollout-level Token-mean (推荐做法)**：\n    $$ L = \\frac{1}{N_{rollouts}} \\sum_{\\rho} \\frac{1}{L_\\rho} \\sum_{j=1}^{N_\\rho} \\sum_{t=1}^{L_{\\rho,j}} \\ell_{\\rho,j,t} $$\n    *   *Intuition*：先汇总一个 Rollout 内所有样本的所有 Token Loss，除以该 Rollout 的总 Token 数，得到该 Rollout 的平均 Loss。最后对所有 Rollout 取平均。这确保了每个 Rollout 对梯度的贡献权重相等，消除了样本数量动态变化带来的偏差。\n\n---\n\n### § 7 实验设计与结论\n\n#### 1. 验证 Harnessed Agentic RL 的设计选择（Advantage \u0026 Loss Normalization）\n*   **提出了什么问题**：在 Harnessed Agentic RL 中，由于 Retokenization 和 Harness 操作，一个 Rollout 会产生动态数量的训练样本。现有的框架在计算 Advantage 和 Loss Normalization 时，应该基于 Sample 级别还是 Rollout 级别？\n*   **设计了什么实验验证这个问题**：在 **Coding Agent** 训练任务中，对比三种设置：\n    1.  **Sample-level Advantage** + Token-mean Loss（基线）。\n    2.  **Rollout-level Advantage** + Token-mean Loss。\n    3.  **Rollout-level Advantage** + **Rollout-level Norm**（本文推荐）。\n*   **问题的答案是什么**：\n    *   **Rollout-level Advantage + Rollout-level Norm** 取得了最高的验证奖励（38.2% vs 35.0%）。\n    *   该设置下的策略熵（Policy Entropy）增长更慢且更稳定。\n    *   结论：基于 Rollout 级别的计算更合理，因为它消除了由偶然因素（如 Retokenization）导致的样本数量波动对梯度的影响。\n\n#### 2. 验证 Agent Lightning v1.0 在 Coding Agent 上的有效性\n*   **提出了什么问题**：现有的 RL 框架对 Coding Agent 支持有限，缺乏完整的数据清洗流程和可复现的训练脚本，且通常依赖大规模算力。能否用少量数据和中等算力显著提升 Coding Agent 的性能？\n*   **设计了什么实验验证这个问题**：\n    *   使用 **SWE-smith** 数据集，经过严格的数据过滤（去除空问题、缺失分支、高难度任务）和基于模型的难度筛选，仅保留约 6K 个训练样本。\n    *   使用 **Qwen3.5-9B** 模型，在 **mini-SWE-agent** Harness 上进行 RL 训练。\n    *   实施防 **Reward Hacking** 措施（禁用 Git 历史、限制网络访问）。\n    *   在 **SWE-bench Verified** 上进行评估。\n*   **问题的答案是什么**：\n    *   仅使用 6K 样本和中等算力，RL 训练使模型在 SWE-bench Verified 上的得分从 **41.8% 提升至 56.4%**，绝对增益达 **14.6%**。\n    *   证明了 Harnessed Agentic RL 范式在 Coding Agent 上的巨大潜力，以及 Agent Lightning v1.0 作为轻量级框架的有效性。\n\n#### 3. 验证 Collocated Async RL 的效率\n*   **提出了什么问题**：传统的同步 RL 效率低（等待最慢 Rollout），异步 RL 需要更多 GPU 资源。能否在共享 GPU 资源的情况下实现高效训练？\n*   **设计了什么实验验证这个问题**：对比 **Sync RL**、**Async RL** 和 **Collocated Async RL** 的端到端训练速度和 GPU 利用率。\n*   **问题的答案是什么**：\n    *   **Collocated Async RL** 实现了约 **2x** 的端到端速度提升，同时比 Async RL 使用更少的 GPU。\n    *   通过 API Gateway 协调推理和训练的时序，实现了 GPU 的时间复用，且对 Agent Harness 透明。", "additional_insights": "### § 8 Take-aways\n\n本文提出了 **harnessed agentic RL** 范式，其核心在于将环境交互循环的控制权从训练引擎移交给部署时的 **agent harness**，从而通过 LLM API 代理实现训练与执行的解耦。这种架构引入了 **retokenization** 导致的 token 前缀连续性断裂问题，论文指出简单的文本级前缀匹配无法保证 token 级一致性，并提出了基于精确 token 匹配的 **best-effort sequence merging** 策略以平衡计算效率与策略正确性。针对一个 rollout 可能产生动态数量训练样本的问题，论文论证了 **rollout-level advantage calculation** 和 **rollout-level loss normalization** 比 sample-level 方法更合理，因为样本数量的波动往往由 retokenization 或 harness 内部操作等偶然因素驱动，不应影响梯度归一化或优势基线。系统层面，Agent Lightning v1.0 实现了 **collocated async RL**，通过在同一 GPU 池上时间共享 rollout 和 weight update 阶段，在减少 GPU 需求的同时避免了同步 RL 中等待最慢 rollout 的效率瓶颈。在 Coding Agent 实验中，通过严格的数据清洗和防止 **reward hacking** 的机制（如禁用 Git 历史和限制网络访问），仅使用 6K 样本和 Qwen3.5-9B 模型，即在 SWE-bench Verified 上实现了 14.6% 的绝对性能提升，证明了该范式在资源受限下的有效性。\n\n### § 9 最脆弱的假设\n\n该方法最关键的假设是：**rollout-level 的统计聚合（优势计算和损失归一化）能够准确反映策略优化的信号，且由 retokenization 或 harness 操作导致的样本分裂不会引入系统性的偏差或信噪比恶化。** 如果这一假设不成立，例如当 harness 的上下文摘要或子代理生成机制导致某些关键决策步骤被错误地合并或拆分，使得单个 rollout 内的样本权重分配严重失真，那么基于 rollout 级别的归一化可能会掩盖局部策略的错误，导致训练不稳定或收敛到次优解。论文通过对比实验（Figure 9）提供了初步证据，显示 rollout-level 方法在验证集奖励和策略熵稳定性上优于 sample-level 方法。然而，论文缺乏对“样本分裂”具体如何影响梯度方向的理论分析，也未证明在所有类型的 harness 操作（如复杂的工具调用链或深度递归子代理）下，rollout-level 聚合始终优于更细粒度的信用分配机制。如果 harness 的逻辑导致某些高价值步骤被稀释在大量低价值样本中，或者反之，该假设的失效将直接导致核心训练算法的崩溃。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 **retokenization 导致的 token 前缀断裂** 及其对训练样本合并的影响，以验证论文关于 **best-effort sequence merging** 必要性的 claim。具体步骤如下：首先，选取一个常用的 LLM（如 Qwen2.5 或 Llama-3）及其对应的 tokenizer，模拟一个多轮 ReAct 风格的 agent 交互，其中包含工具调用和观察结果。其次，手动构造一个场景，其中第 $i$ 轮模型的输出文本在第 $i+1$ 轮的 prompt 中被重新 tokenization 时，由于 chat template 的非组合性或 tokenizer 的边界漂移（如论文 Figure 3 所示的 `having` 例子），导致 token ID 序列不匹配。然后，实现两种合并策略：一是基于文本前缀匹配的强制合并（模拟某些现有框架的做法），二是论文提出的基于精确 token 前缀匹配的 best-effort 合并。最后，测量两种策略下生成的训练样本中，因 token 不匹配而被错误合并的比例，以及由此产生的 **off-policy discrepancy**（即模型在训练时看到的 prompt 与 rollout 时实际消耗的 prompt 之间的差异）。如果强制合并策略导致显著的 token ID 不一致，而 best-effort 策略能有效识别并避免这种错误合并，则支持了论文关于 retokenization 挑战及其解决方案的 claim。此实验无需完整的 RL 训练循环，仅需验证数据预处理阶段的正确性。", "research_value": "### § 11 最强反例设计\n\n若要挑战 **Agent Lightning v1.0** 的核心主张，最有力的攻击点在于其 **Rollout-level Advantage Calculation** 和 **Loss Normalization** 在长 horizon、高方差任务中的统计失效问题。论文假设每个 **Rollout** 是一个独立的决策单元，且样本数量的波动（由 **Retokenization** 或 **Harness** 操作引起）是随机的、不应影响梯度权重的噪声。然而，在复杂的 **Coding Agent** 或 **Search Agent** 场景中，**Rollout** 的长度和内部样本数量往往与任务的难度或代理的探索策略高度相关。例如，一个陷入局部最优或反复尝试错误工具的代理可能会产生极长的 **Rollout** 和大量的 **Request-Response Pairs**，而一个快速找到解决方案的代理则产生较短的序列。如果采用 **Rollout-level** 归一化，长序列（通常对应低 Reward 或高不确定性）和短序列（通常对应高 Reward）对梯度的贡献权重被强制拉平。这可能导致模型过度优化那些“快速失败”或“快速成功”的简单模式，而忽视了对长尾、复杂推理路径的精细调整，因为长路径中的每一步 **Token** 的梯度贡献被巨大的序列长度稀释了。\n\n具体反例实验设计如下：构造一个合成任务环境，其中存在两类任务：A 类任务只需 2 步即可解决（Reward=1），B 类任务需要 20 步且中间步骤极易出错（Reward=1 但失败率高）。在 **Harnessed Agentic RL** 架构下，B 类任务因 **Retokenization** 或工具调用频繁，产生的样本数量 $N_B$ 远大于 A 类任务的 $N_A$。如果使用 **Sample-level** 归一化，B 类任务因样本多而主导梯度，可能导致模型过度拟合 B 类的错误模式；但如果使用论文推荐的 **Rollout-level** 归一化，A 类和 B 类对总 Loss 的贡献相等。然而，B 类任务内部的 **Advantage** 信号是稀疏且延迟的，将其整个 Rollout 视为一个单元进行归一化，会掩盖中间步骤的信用分配问题。更致命的攻击是引入 **Reward Hacking** 的变体：代理发现通过故意触发 **Retokenization** 断裂（例如通过输出特定的空白符或特殊字符，导致 **Chat-template** 重新分词），可以将一个长 Rollout 拆分为多个短样本。如果框架的 **Best-effort Sequence Merging** 策略不够鲁棒，代理可能学会“操纵”样本边界，使得原本应被惩罚的长错误序列被拆分为多个看似独立的、低损失的短序列，从而在 **Rollout-level** 统计下获得虚假的低 Loss 信号。这种“样本分裂攻击”直接挑战了论文关于 **Retokenization** 仅是噪声而非系统性偏差的假设。\n\n### § 12 Follow-up Research Idea\n\n基于 **Harnessed Agentic RL** 中 **Rollout-level** 归一化可能掩盖细粒度信用分配问题的局限，提出一个新的研究方向：**Hierarchical Credit Assignment via Latent State Reconstruction**（基于隐状态重构的分层信用分配）。\n\n**(a) 驱动局限与未满足需求：**\n当前方法将 **Agent Harness** 视为黑盒，仅通过 **LLM API** 观察离散的 **Request-Response Pairs**。这种解耦虽然实现了工程上的灵活性，但导致了 **Partial Observability** 问题：训练引擎无法感知 **Harness** 内部的隐状态（如工具执行结果、上下文摘要、子代理状态）。**Rollout-level** 的粗粒度归一化无法解决长序列中“哪一步导致了成功/失败”的信用分配难题，尤其是在 **Retokenization** 导致序列断裂时，因果链条被进一步切断。现有的 **GRPO** 或 **PPO** 变体假设样本是独立同分布的或具有明确的序列结构，但在 **Harnessed** 架构下，这种假设被破坏。\n\n**(b) 借鉴相邻领域的方法：**\n借鉴 **Partially Observable Markov Decision Processes (POMDPs)** 中的 **Recurrent Policy** 或 **Memory-Augmented RL** 思想，以及 **Causal Inference** 中的 **Do-calculus** 或 **Counterfactual Reasoning**。具体而言，可以引入一个轻量级的 **State Estimator**（状态估计器），它不直接修改 **Harness**，而是通过观察 **Request-Response Pairs** 的序列模式，尝试重构 **Harness** 的隐状态轨迹。这个估计器可以是另一个小型的 Transformer 模型，专门用于预测下一个 **Request** 的上下文依赖关系。\n\n**(c) 第一个实验设计：**\n构建一个 **Dual-Head Training Framework**。主模型（Policy Model）负责生成 **Response**，而辅助模型（State Estimator）负责根据历史 **Request-Response Pairs** 预测当前的 **Harness State Embedding**。在计算 **Advantage** 时，不再简单地使用 **Rollout-level** 或 **Sample-level** 的标量 Reward，而是利用 **State Estimator** 输出的隐状态序列，构建一个 **Hierarchical Advantage Function**。具体步骤如下：\n1.  **训练 State Estimator**：使用自监督学习，预测下一个 **Request** 的 Token 分布，强制其捕捉 **Harness** 的上下文依赖。\n2.  **分层信用分配**：将 **Rollout** 划分为多个 **Sub-episodes**，划分依据是 **State Estimator** 检测到的隐状态显著变化点（而非简单的 **Retokenization** 断裂）。\n3.  **对比实验**：在 **SWE-bench** 上，对比标准 **Rollout-level GRPO** 与 **Hierarchical GRPO**（基于隐状态重构的信用分配）。预期结果是，**Hierarchical GRPO** 能更有效地识别出导致代码修复成功的关键步骤，从而在长 horizon 任务上获得更高的样本效率和更稳定的收敛，特别是在 **Retokenization** 频繁发生的复杂工具调用场景中。\n\n这个提议与已有工作的区别在于，它不试图消除 **Retokenization** 或强制 **Token-level** 一致性，而是承认 **Harnessed** 架构的 **Partial Observability** 本质，并通过学习隐状态来恢复更细粒度的信用分配信号，从而在保持解耦架构优势的同时，提升算法的理论上限。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Zhiyuan He\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\",\n        \"‡\"\n      ]\n    },\n    {\n      \"name\": \"Siwei Zhang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Zhiwen Zhou\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Yuqing Yang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"‡\"\n      ]\n    },\n    {\n      \"name\": \"Yu Kang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yuge Zhang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Luna K. Qiu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Tin Yan Tsui\",\n      \"affiliations\": [\n        4\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jiahang Xu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Chong Luo\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Microsoft\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Fudan University\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Zhejiang University\"\n    },\n    {\n      \"id\": 4,\n      \"name\": \"University of Edinburgh\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal contribution.\"\n    },\n    {\n      \"marker\": \"‡\",\n      \"text\": \"Corresponding authors.\"\n    }\n  ]\n}\n```", "summary_translation": "现代智能体在管理工具、上下文和控制流的智能体框架（agent harnesses）内运行，使得框架成为智能体系统的关键组成部分。我们最初提出的 Agent Lightning 引入了一种 disaggregated architecture，通过 LLM endpoint proxy 将任意智能体连接到 RL 训练，这一方法后来被 verl Uni-Agent、AReaL 2.0、slime 和 Polar 等框架所采用。我们将这种范式称为 harnessed agentic RL，其中部署时的框架直接参与模型的后训练。Harnessed agentic RL 与传统 agentic RL 存在根本差异：框架而非训练引擎拥有环境交互循环，而训练器仅观察 LLM 请求-响应对的序列。这带来了 retokenization、sample merging、advantage calculation、loss normalization 和 backend scheduling 方面的挑战，这些挑战会显著影响训练的稳定性与有效性。我们提出了 Agent Lightning v1.0，这是一个用于 harnessed agentic RL 的轻量级框架，代码量约为 3,500 行。它支持任意智能体框架，并作为研究这些挑战的实用测试平台。我们在 instruction-following、search 和 coding agents 上对其进行了评估，并提供了一个完整的可复现的 coding-agent RL 流程。仅使用 6K 训练样本和适度的计算资源，RL 使 Qwen3.5-9B 在 SWE-bench Verified 上的表现从 41.8% 提升至 56.4%，绝对增益达 14.6 个百分点。我们发布了完整的工作流程和训练脚本，以促进 harnessed agentic RL 的可复现研究。"}, {"title": "Towards Better Agents for Multi-Turn User Interaction: The Next User Turn Is More Than Context", "arxiv_id": "2608.17499", "authors": "Yiwen Zhao, Zhihao Wen, Yuchen Mao, Mingxuan Jiang, Yihao Hu, Pan Wang, Xin Zhang, Wei Wu", "summary": "User-facing tool agents must coordinate dialogue and tool use as user goals unfold over multiple turns. Yet interactive reinforcement learning typically reduces each rollout to a terminal reward, assigning the same credit to effective elicitation, errors, and later repair. The next user turn is more than context: it also provides noisy, temporally local evidence about the preceding user-to-user segment. We introduce \\textbf{F}eedback-\\textbf{A}ware \\textbf{C}redit \\textbf{A}ssignment (\\textsc{FACA}), which aligns each reaction with that segment, derives a locally normalized reaction advantage, and adds it to verified terminal outcome advantage without an extra critic or rollout. Against an outcome-only Interactive GRPO control matched in simulator, visible dialogue, initialization, rollout, and optimization, \\textsc{FACA} improves the nine-domain $τ$-family average across three independently trained runs by 5.91 and 10.22 percentage points at 8B and 14B, respectively. Gains concentrate in Telecom; at 8B, randomizing reaction polarity removes the Telecom gain. The same ordering holds zero-shot on Pare-Bench and Co-Gym. These results demonstrate that next-turn user reactions provide actionable local credit for improving multi-turn user-interacting agents.", "category": "cs.AI", "cluster": "Reinforcement Learning \u0026 Training for Agents", "tags": ["cs.AI"], "filter_reason": "该论文符合研究范围，核心依据如下：\n\n1.  研究对象明确为 LLM 智能体：论文标题和摘要明确指出研究对象是 \"User-facing tool agents\"（面向用户的工具智能体），且涉及 \"multi-turn user interaction\"（多轮用户交互）和 \"tool use\"（工具使用）。这直接对应了筛选标准中“单智能体 (Agentic)”方向下的工具使用和长期决策能力。\n\n2.  核心贡献属于智能体训练/改进机制：论文提出了一种名为 FACA (Feedback-Aware Credit Assignment) 的新方法，旨在解决交互式强化学习（Interactive RL）中的信用分配问题。其核心创新在于利用“下一轮用户反应”作为局部反馈信号，来优化智能体在多轮对话中的行为策略。这属于“构建、改进、训练 LLM 智能体”的范畴，具体涉及智能体的自我完善和策略优化。\n\n3.  符合“保留”标准中的训练/演化机制：根据筛选标准第一步，“如果论文研究 agent training/distillation/RL...并且标题或摘要明确指向 Agentic / LLM Agents...应保留”。该论文正是通过改进 RL 的信用分配机制来提升 Tool-Use Agent 的性能，属于 Agentic AI 的核心技术前沿。\n\n4.  排除项不适用：\n       它不是单纯的基础推理优化（如 CoT），而是针对 Agent 交互场景的特定优化。\n       它不涉及被排除的安全、对齐、多模态视觉或图神经网络等技术。\n       它不是简单的应用层论文，而是提出了新的算法机制（FACA）来改进智能体本身。\n\n综上，该论文通过改进信用分配机制来提升多轮工具使用智能体的性能，完全符合“构建、改进、训练 LLM 智能体”的研究目标。", "intro_logic": "### § 1 研究问题与重要性\n\n本文针对的核心研究问题是：在基于强化学习（Reinforcement Learning, RL）训练多轮用户交互代理（Multi-Turn User-Interacting Agents）时，如何更精确地进行**Credit Assignment**（信用分配）。现有的交互式 RL 框架（如 Interactive GRPO）通常仅依赖最终的终端奖励（Terminal Reward）来评估整个轨迹（Trajectory）的成功与否。这种“结果导向”的信用分配机制存在严重的**Temporal Flatness**（时间扁平性）缺陷：它无法区分轨迹中哪些步骤是有效的信息 elicitation（引导/获取信息），哪些是错误，哪些是后续的修复行为，导致所有步骤获得相同的 Advantage（优势值）。\n\n这一问题的重要性在于，真实的用户交互场景（如电信客服、旅行规划）具有高度的动态性和不确定性。用户的目标往往不会在初始提示中完全明确，而是随着对话推进逐步揭示。在这种长 horizon（长视界）任务中，仅靠最终结果无法提供足够的梯度信号来优化代理在中间步骤的决策质量。如果代理在早期犯了错误但通过后续步骤侥幸成功，或者在早期做出了正确的引导但被后续错误抵消，Outcome-only 的奖励机制都无法给予正确的反馈。\n\n解决这一问题的价值在于引入**Feedback-Aware Credit Assignment (Faca)** 方法，利用“下一个用户回合”（Next User Turn）作为局部证据。论文指出，用户的下一轮回复不仅仅是上下文（Context），更是对前一个 User-to-User (U2U) 片段交互质量的即时反馈（如确认、澄清、挑战等）。通过将这些隐含的用户反应转化为局部的 Process Advantage（过程优势），并与终端 Outcome Advantage（结果优势）相加，Faca 能够在不增加额外 Critic 网络或 Rollout 成本的情况下，显著提升代理在复杂多轮交互中的表现。实验表明，该方法在 $\\tau$-bench 系列基准测试中带来了显著的性能提升（8B 模型提升 5.91%，14B 模型提升 10.22%），特别是在反馈丰富的 Telecom 领域，证明了利用局部用户反馈进行信用分配的有效性。\n\n### § 2 前人工作与不足\n\n该问题在之前的研究中已有部分探索，但现有方法存在明显的局限性。\n\n**1. Outcome-only RL 方法（如 MUA-RL, UserRL, Interactive GRPO）：**\n这些方法将模拟用户（Simulated User）置于 RL 循环中，允许代理在完整对话中进行探索，并依据最终的世界状态或数据库状态给予奖励。\n*   **不足：** 它们完全忽略了对话过程中的中间信号。如前所述，这种机制导致“有效引导”、“错误”和“修复”获得相同的信用，无法指导代理优化具体的交互策略。此外，当一组 Rollout 的终端奖励完全相同（全对或全错）时，Group-relative optimization 产生的 Advantage 为零，导致训练信号缺失。\n\n**2. 基于 Critic 或中间评估器的方法（如 ArCHer, SEAL, Agent Lightning）：**\n这些方法试图通过训练一个独立的 Critic 模型或使用中间评估器（Intermediate Evaluator）来提供 Turn-level 或 Step-level 的奖励。\n*   **不足：**\n    *   **工程成本高：** 需要训练额外的 Critic 模型或维护复杂的评估管道，增加了计算开销和训练复杂度。\n    *   **奖励黑客（Reward Hacking）风险：** 学习到的 Critic 可能与真实任务目标不一致，导致代理优化 Critic 的评分而非实际任务成功率。\n    *   **信号噪声：** 中间评估器可能引入额外的噪声或偏差，且需要额外的 Rollout 或推理步骤来获取这些信号。\n\n**3. 无 Critic 的局部优势估计方法（如 Segment Policy Optimization, InfoPO, TIPS）：**\n这些方法尝试从轨迹本身的结构（如重复状态、策略信息、工具调用熵）或后续步骤的延续性中推导局部优势，而不依赖外部 Critic。\n*   **不足：**\n    *   **信号间接性：** 它们依赖的是代理自身的行为统计或环境状态的潜在变化，而非直接的用户意图反馈。在多轮交互中，用户的主观反应（如困惑、确认）是衡量交互质量最直接但常被忽略的信号。\n    *   **缺乏语义对齐：** 这些方法通常无法捕捉用户反应中的语义信息（如“澄清”代表摩擦，“确认”代表进展），因此无法提供具有方向性的局部指导。\n\n**4. 基于用户反馈的 RL（如 RLUF, FLR）：**\n这些方法利用生产环境中的用户后续行为或精心设计的正负样本进行训练。\n*   **不足：**\n    *   **数据依赖：** RLUF 依赖生产数据，存在分布偏移和冷启动问题；FLR 依赖人工标注的正负后续样本，扩展性差。\n    *   **非在线交互：** 它们通常不是直接在模拟交互的 Rollout 中实时利用隐含反馈，而是作为离线训练或特定的奖励塑造手段，无法像 Faca 那样无缝集成到在线交互式 RL 的信用分配中。\n\n**总结前人工作的核心缺口：**\n现有的方法要么完全忽略过程信号（Outcome-only），要么依赖昂贵且可能偏差的外部评估器（Critic-based），要么使用间接的统计信号（Critic-free structural methods）。**关键缺失在于：没有方法能够低成本、无偏差地利用交互过程中自然产生的、富含语义信息的“用户下一轮反应”作为局部信用分配的依据。** Faca 的创新点在于识别出“下一个用户回合”本身就是高质量的局部证据，并通过简单的映射和归一化将其转化为训练信号，填补了这一空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在多轮对话 Agent 的强化学习训练中，现有的主流范式（如 MUA-RL, UserRL）通常采用“结果导向”的信用分配机制：只有当整个对话轨迹最终达成任务目标时，Agent 才能获得正向奖励。这种机制存在一个显著的缺陷——**信用分配的时间粒度过于粗糙**。在长程交互中，Agent 可能在前几轮通过有效的提问（elicitation）获取了关键信息，但在中间环节犯了错，最后又通过修复（repair）完成了任务。在 Outcome-only 的视角下，这些“有效提问”、“错误”和“修复”被赋予了相同的 Advantage，导致模型无法区分哪些局部行为真正推动了任务进展，哪些只是无意义的冗余或试错。\n\n研究者观察到，在多轮交互中，**用户的下一轮回复（Next User Turn）不仅仅是对话的上下文（Context），它实际上包含了关于前一个 Agent 行为片段（User-to-User Segment, U2U）的即时反馈信号**。例如，如果 Agent 询问了缺失的信息，用户随后提供了该信息，这暗示了 Agent 的提问是有效的（Progress-consistent）；如果用户表示困惑或拒绝，则暗示了摩擦（Friction-consistent）。然而，现有的 Outcome-only RL 方法完全忽略了这些隐含在对话流中的局部信号，仅依赖最终的终端奖励。\n\n与此同时，引入额外的 Critic 模型或中间评估器（Intermediate Evaluators）来提供细粒度奖励虽然可行，但会带来巨大的计算开销、训练不稳定性以及潜在的奖励黑客（Reward Hacking）风险。研究者意识到，既然用户模拟器（User Simulator）在生成回复时已经隐含了某种“策略”或“态度”（如确认、澄清、挑战），这些信号是现成的、低成本的、且与 Agent 行为在时间上紧密对齐的。因此，核心思路转变为：**能否在不增加额外 Critic 或 Rollout 的前提下，直接利用用户模拟器生成的私有策略元数据（Private Strategy Metadata），将其转化为局部的过程奖励（Process Advantage），并与终端结果奖励（Outcome Advantage）相加？** 这样既保留了最终任务完成的硬性约束，又利用了对话过程中的软性反馈来细化信用分配，从而解决长程交互中局部行为难以被有效监督的问题。\n\n### § 4 核心 Intuition\n\n传统多轮 Agent 训练仅依赖最终任务成败进行信用分配，导致模型无法区分对话中哪些局部交互真正推动了进展，哪些是无效试错。本文的核心直觉是：**用户的下一轮回复不仅是上下文，更是对前一个 Agent 行为片段（U2U Segment）的即时、局部反馈信号**（如提供信息代表进展，要求澄清代表摩擦）。通过将这些隐含的用户反应转化为局部过程奖励（Process Advantage）并与终端结果奖励叠加，模型能够在不增加额外 Critic 的情况下，获得更精细的局部信用分配，从而更有效地学习如何在多轮交互中协调对话与工具使用。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文提出的核心方法是 **Feedback-Aware Credit Assignment (Faca)**，旨在解决多轮交互中 **Credit Assignment**（信用分配）的问题。传统的 **Interactive GRPO** 仅使用最终的 **Terminal Reward**（终端奖励）来评估整个轨迹，导致无法区分中间步骤的有效引导、错误操作或后续修复。Faca 利用下一轮用户回复（Next User Turn）作为局部证据，为前一个 **User-to-User (U2U) Segment** 提供过程奖励。\n\n以下是 Faca 的完整 Pipeline，结合论文附录 F 中的 **Telecom** 案例（用户手机数据故障排查）进行说明：\n\n1.  **输入与轨迹生成 (Rollout Generation)**：\n    *   **输入**：给定一个初始 Prompt $x$（例如：“我的移动数据很慢，需要修复”），Agent 策略 $\\pi_\\theta$ 与冻结的 **User Simulator** 及工具环境进行交互。\n    *   **过程**：系统采样 $K$ 条完整的交互轨迹。每条轨迹被划分为多个 **U2U Segments**（即两个相邻用户消息之间的所有 Agent 回复、工具调用及结果）。\n    *   **案例**：在 Telecom 案例中，Agent 首先尝试调用 `check_network_mode_preference` 工具，但报错（工具不存在）。随后 Agent 引导用户手动检查手机设置。用户回复：“我查了，手机设为 2G only，改成 4G/5G 有帮助吗？” 这一整段交互构成一个 U2U Segment。\n\n2.  **提取局部反馈信号 (Local Evidence Extraction)**：\n    *   **处理**：User Simulator 在生成可见的用户话语（Utterance）的同时，会生成一个私有的 **Strategy Metadata**（策略元数据），如 `confirm`（确认）、`challenge_solution`（挑战方案）或 `be_vague`（模糊）。\n    *   **映射**：Faca 读取该私有元数据，将其映射为三元极性证据 $f \\in \\{+1, 0, -1\\}$。\n        *   $+1$ (Progress-consistent)：如 `confirm`, `close`, `reveal_piece`。\n        *   $-1$ (Friction-consistent)：如 `ask_clarification`, `challenge_solution`, `change_mind`。\n        *   $0$ (Neutral)：如 `be_vague`, `invalid`。\n    *   **案例**：在上述案例中，用户确认了 Agent 的建议并提供了新信息，Simulator 标记为 `confirm`，映射为 $f=+1$。注意：这个 $f$ 值对 Agent 不可见，仅用于训练时的信用分配。\n\n3.  **计算两级优势函数 (Two-Level Advantage Calculation)**：\n    *   **终端优势 ($A^{[o]}_k$)**：基于最终任务是否成功（Terminal Reward $R_k$），在组内（Group）进行归一化计算。如果一组轨迹全对或全错，此项为 0。\n    *   **过程优势 ($A^{[p]}_{k,q}$)**：针对第 $k$ 条轨迹的第 $q$ 个 U2U Segment，收集所有到达该 Segment 且有有效反馈的轨迹，计算局部归一化的反应优势。\n        *   公式核心：$A^{[p]}_{k,q} = \\frac{f_{k,q} - \\text{mean}(f)}{\\text{std}(f)}$。\n    *   **案例**：假设在某个 Prompt 的 8 条采样轨迹中，第 3 个 U2U Segment 处，有的用户回复 `confirm` (+1)，有的回复 `challenge` (-1)。Faca 会计算这些反馈的均值和标准差，得出该 Segment 的局部优势值。如果该 Segment 的反馈优于组内平均水平，则 $A^{[p]}$ 为正。\n\n4.  **组合优势与策略优化 (Optimization)**：\n    *   **组合**：最终的 U2U 级别优势为 $A_{k,q} = A^{[o]}_k + \\lambda A^{[p]}_{k,q}$。其中 $\\lambda$ 是权重参数（论文设为 0.5），用于限制过程奖励的主导地位，防止 **Reward Hacking**。\n    *   **更新**：使用 **GRPO** (Group Relative Policy Optimization) 算法，将组合后的优势 $A_{k,q}$ 广播给该 U2U Segment 中所有可训练的 Agent Token（语言生成和工具调用 Token），进行梯度更新。\n    *   **案例**：在 Telecom 案例中，Agent 之前错误地尝试调用用户端工具导致报错。通过 Faca，Agent 在引导用户手动操作并获得 `confirm` 反馈后，获得了正向的局部优势。这强化了“当工具不可用时，引导用户操作”这一策略，而不仅仅是依赖最终是否修好网络。\n\n### § 6 核心数学推导\n\n这篇论文的核心数学推导在于如何构建一个无需额外 Critic 网络、无需额外 Rollout 的 **Process Advantage**（过程优势），并将其与传统的 **Outcome Advantage**（结果优势）结合。\n\n**1. 终端结果优势 (Outcome Advantage, $A^{[o]}_k$)**\n这是基于 **GRPO** 的标准做法。对于 Prompt $x$，采样 $K$ 条轨迹，得到终端奖励 $R_k \\in \\{0, 1\\}$。\n$$ A^{[o]}_k = \\frac{R_k - \\text{mean}(\\{R_j\\}_{j \\in \\mathcal{I}(x)})}{\\text{std}(\\{R_j\\}_{j \\in \\mathcal{I}(x)})} $$\n*   **Intuition**：这是组内归一化。如果一组轨迹中有的成功有的失败，成功的轨迹获得正优势，失败的获得负优势。如果全成功或全失败，优势为 0，无法提供梯度信号。这解决了稀疏奖励问题，但忽略了中间过程。\n\n**2. 局部反应优势 (Process Advantage, $A^{[p]}_{k,q}$)**\nFaca 的创新点在于利用下一个用户回复作为局部信号。\n*   **定义集合**：$\\mathcal{I}(x, q)$ 表示所有到达第 $q$ 个 U2U Segment 且有有效反馈的轨迹集合。\n*   **映射反馈**：将私有策略 $z_{k,q+1}$ 映射为标量 $f_{k,q} \\in \\{+1, 0, -1\\}$。\n*   **局部归一化**：\n    $$ A^{[p]}_{k,q} = \\frac{f_{k,q} - \\text{mean}(\\{f_{j,q}\\}_{j \\in \\mathcal{I}(x, q)})}{\\text{std}(\\{f_{j,q}\\}_{j \\in \\mathcal{I}(x, q)})} $$\n*   **Intuition**：这里的关键是 **Local Normalization**（局部归一化）。我们不是在绝对意义上判断“用户满意”是好是坏，而是在同一 Prompt 的不同采样轨迹中，比较“哪个 U2U Segment 的用户反应更好”。\n    *   例如，在同一个问题下，轨迹 A 的用户回复 `confirm` (+1)，轨迹 B 的用户回复 `challenge` (-1)。即使最终任务都失败了，轨迹 A 在该步骤的交互质量更高，因此获得正的过程优势。\n    *   这种设计使得即使在 **Outcome-Homogeneous Groups**（全对或全错的组）中，也能产生非零的梯度信号，从而指导 Agent 优化中间交互策略。\n\n**3. 组合优势与目标函数 (Combined Advantage \u0026 Objective)**\n最终用于优化的优势函数是两者的线性组合：\n$$ A_{k,q} = A^{[o]}_k + \\lambda A^{[p]}_{k,q} $$\n*   **Intuition**：\n    *   $A^{[o]}_k$ 保证最终任务完成（Ground Truth）。\n    *   $\\lambda A^{[p]}_{k,q}$ 提供细粒度的过程监督，帮助 Agent 在长 horizon 中更快地收敛到正确的交互模式。\n    *   $\\lambda$ (设为 0.5) 是一个超参数，用于平衡两者。由于 $A^{[p]}$ 来自模拟器而非真实世界验证，限制其权重可以防止 **Simulator Bias**（模拟器偏差）主导训练。\n\n**4. 策略更新 (Policy Update)**\n使用标准的 **PPO/GRPO** 裁剪目标函数：\n$$ \\mathcal{L}(\\theta) = \\mathbb{E} \\left[ \\min \\left( r_t(\\theta) A_{k,q}, \\text{clip}(r_t(\\theta), 1-\\epsilon, 1+\\epsilon) A_{k,q} \\right) \\right] $$\n其中 $r_t(\\theta)$ 是重要性采样比率。这里 $A_{k,q}$ 被广播到该 U2U Segment 的所有 Token。\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n在多轮用户交互（Multi-Turn User Interaction）中，传统的 **Outcome-only Credit Assignment**（仅基于最终结果分配信用）存在缺陷：它无法区分有效的信息 elicitation（引导）、错误操作和后续修复，导致所有步骤获得相同的优势信号，特别是在长对话或复杂任务中，梯度信号稀疏且噪声大。如何利用交互过程中的隐含信号（如用户反应）来改进信用分配？\n\n**2. 设计了什么实验验证这个问题？**\n*   **基线对比**：设计了严格的对照实验，比较 **Faca** 与 **Interactive GRPO**（Outcome-only）。两者共享相同的 SFT 初始化、冻结的 User Simulator、Prompt、Rollout 构造和优化器，唯一区别在于 Faca 使用了局部反应优势 $A^{[p]}$。\n*   **数据集**：使用 $\\tau$-bench 系列（包含 Airline, Retail, Telecom, Bank 等 9 个领域），其中 Telecom 和 Bank 不在 RL 训练集中，用于测试泛化能力。\n*   **零样本迁移**：在 Pare-Bench（主动式移动助手）和 Co-Gym（双向协作）上进行零样本测试，验证方法在不同交互协议下的鲁棒性。\n*   **消融实验 (Ablation Studies)**：\n    *   **Shifted Reactions**：将反应信号错位到前一个 Segment，验证时间对齐的重要性。\n    *   **Randomized Polarity**：随机化反馈极性，验证反馈语义的重要性。\n    *   **$\\lambda$ 敏感性**：测试不同权重对性能的影响。\n*   **案例分析**：深入分析 Telecom 领域的轨迹，对比 Faca 和 Interactive GRPO 在错误恢复和工具使用上的差异。\n\n**3. 问题的答案是什么？**\n*   **性能提升**：Faca 在 8B 和 14B 模型上分别将 $\\tau$-bench 平均性能提升了 **5.91** 和 **10.22** 个百分点。\n*   **领域差异性**：增益主要集中在 **Telecom** 领域，因为该领域交互密集，用户反应能提供丰富的局部反馈（Feedback-rich）。在 Retail 等领域增益较小甚至略有下降，说明该方法并非万能，依赖于用户反应的信息量。\n*   **机制验证**：消融实验证明，**时间对齐**（Temporal Alignment）和**反馈语义**（Reaction Semantics）至关重要。随机或错位的反馈会消除增益。\n*   **泛化能力**：在 Pare-Bench 和 Co-Gym 上，Faca 保持了优于 Outcome-only 的顺序，表明该方法学到的交互策略具有跨协议的迁移能力。\n*   **结论**：下一轮用户回复不仅仅是上下文，更是关于前一个 U2U Segment 的局部证据。利用这种隐含反馈进行局部信用分配，可以在不增加额外 Critic 或 Rollout 的情况下，显著改善多轮交互 Agent 的训练效率和最终性能，特别是在反馈丰富的场景中。", "additional_insights": "### § 8 Take-aways\n\nFaca 方法的核心洞察是将多轮交互中的“下一轮用户回复”视为对前一个 User-to-User (U2U) 片段的局部信用分配信号，而不仅仅是上下文。通过提取用户模拟器生成的私有策略元数据（如 `confirm` 或 `challenge`），Faca 构建了局部归一化的过程优势（Process Advantage），并将其与终端结果优势（Outcome Advantage）相加，从而在不引入额外 Critic 或 Rollout 的情况下优化 Agent。实验表明，在 $\\tau$-bench 系列基准测试中，Faca 在 8B 和 14B 模型上分别带来了 5.91 和 10.22 个百分点的平均性能提升，且这种提升在反馈信息丰富的 Telecom 领域尤为显著。消融实验证实，反应信号的语义内容及其与 U2U 片段的时间对齐至关重要，随机化反应极性或错位对齐会消除性能增益。在 Pare-Bench 和 Co-Gym 的零样本迁移测试中，Faca 保持了相对于 Outcome-only GRPO 的优势，表明这种基于局部反馈的信用分配机制具有一定的跨协议泛化能力。然而，这种增益并非普遍适用，在 Co-Gym 的 Travel 任务中出现了性能回归，说明该方法的有效性依赖于用户反应能否提供关于任务进度的有效局部证据。\n\n### § 9 最脆弱的假设\n\nFaca 方法最脆弱且关键的假设是：**用户模拟器生成的私有策略元数据（Private Strategy Metadata）能够准确、无偏地反映前一个 U2U 片段对任务进度的真实贡献，且这种相关性在真实用户交互中依然成立。**\n\n如果这一假设不成立，核心贡献将直接失效，因为 Faca 的优化信号完全依赖于这些元数据。在实际中，该假设可能不成立的原因包括：1) **模拟器偏差**：DeepSeek-V4-Flash 模拟器可能具有特定的行为模式或偏见，其生成的 `confirm` 或 `challenge` 标签可能并不完全对应于人类用户的真实意图或任务逻辑，导致 Agent 学习到针对模拟器的过拟合行为（Reward Hacking）。2) **因果归因错误**：用户的反应可能受到前多个 U2U 片段的累积影响，而不仅仅是紧邻的前一个片段，简单的时序对齐（Temporal Adjacency）可能错误地将信用分配给无关的 Agent 行为。3) **真实用户噪声**：真实用户的反馈往往模糊、非结构化且充满噪声，难以像模拟器那样提取出清晰的三元极性（+1, 0, -1），导致在部署到真实环境时信号失效。\n\n论文为这一假设提供的证据主要局限于模拟器内部的一致性检查和消融实验（如随机化极性导致性能下降），证明了信号在模拟器环境内的有效性。然而，论文**缺少**在真实用户数据或不同架构模拟器上的验证证据，也未提供从纯文本 utterance 中自动提取等效策略标签的鲁棒性分析，这使得该方法在脱离特定模拟器元数据支持时的实用性存疑。\n\n### § 10 最小复现实验\n\n如果只有一周时间，可以设计一个**“基于文本的反应极性提取与信用分配有效性”**的最小复现实验，以验证 Faca 的核心 claim 是否依赖于模拟器的私有元数据，还是可以从公开的用户 utterance 中泛化。\n\n**具体方案：**\n1.  **数据**：使用论文中公开的 $\\tau$-bench 或 MUA-RL 数据集，选取一部分包含完整多轮对话的轨迹。\n2.  **实现**：\n    *   构建一个轻量级的“反应极性分类器”（可以使用一个小型 LLM 如 Qwen2.5-7B 或甚至基于规则的关键词匹配），仅根据用户的**可见 utterance**（而非私有策略元数据）来预测其极性（Positive/Neutral/Negative）。例如，将包含 \"yes\", \"ok\", \"thanks\" 的回复标记为 Positive，包含 \"no\", \"wrong\", \"clarify\" 的标记为 Negative。\n    *   复现 Faca 的信用分配逻辑，但将原始的私有策略极性替换为这个从文本中提取的极性。\n    *   使用相同的 Interactive GRPO 基线进行对比训练（可以使用较小的模型如 Qwen2.5-1.5B 以节省时间，或在少量数据上进行微调）。\n3.  **测量**：比较“使用文本提取极性”的 Faca 变体与“Outcome-only GRPO”在验证集上的 Pass@1 分数。\n4.  **结果判定**：\n    *   **支持 Claim**：如果文本提取的极性也能带来显著的性能提升（即使幅度小于使用私有元数据），则说明 Faca 的核心思想（利用用户反应作为局部信用）具有泛化潜力，不严重依赖模拟器的私有后门。\n    *   **反驳 Claim**：如果文本提取的极性无法带来提升，甚至导致性能下降，则说明 Faca 的增益主要来源于模拟器提供的“作弊”信号（私有元数据），该方法在缺乏此类元数据的真实场景中可能无效。\n\n这个实验不需要复现完整的模拟器环境或大规模训练，只需验证“反应信号”本身的可提取性和有效性，从而评估该方法的核心假设在更广泛条件下的稳健性。", "research_value": "### § 11 最强反例设计\n\n要最有力地攻击 **Faca** 方法，核心策略是证明其性能增益并非源于对“交互质量”的更优理解，而是源于对 **User Simulator** 内部逻辑的过拟合（Overfitting to Simulator Logic），即所谓的 **Simulator Bias**。具体而言，可以设计一个“对抗性模拟器”实验：保持 Agent 的训练数据和任务目标不变，但在测试阶段替换为一个行为逻辑不同但语义等效的 User Simulator（例如，将原本在 `confirm` 时直接推进任务的模拟器，替换为一个在 `confirm` 后仍要求额外冗余确认的“挑剔型”模拟器）。如果 Faca 训练出的 Agent 在新模拟器上的表现显著下降，甚至不如 Outcome-only GRPO，这就证明了 Faca 学到的不是通用的交互策略，而是针对特定模拟器元数据（Metadata）的“捷径”（Shortcut Learning）。\n\n此外，从理论层面可以构建一个 **Credit Misattribution**（信用误归因）的反例场景。在多轮交互中，用户的反应往往具有滞后性和累积性。例如，Agent 在前三个 Turn 中犯了轻微错误，但在第四个 Turn 中通过一个完美的澄清操作挽回了局面，用户随后给出 `confirm`。Faca 会将这个正向反馈 $f=+1$ 分配给第四个 U2U Segment，从而强化该澄清行为，却忽略了前三个 Turn 的错误并未被惩罚（因为 Outcome-only 可能因最终成功而给予整体正奖励，或者局部优势掩盖了早期错误）。更极端的反例是：Agent 通过“讨好”用户（如过度道歉、无关闲聊）诱导模拟器产生 `confirm` 或 `be_vague` 等中性/正向元数据，从而获得局部优势，但这实际上偏离了任务目标（Task Goal）。如果实验显示 Faca 训练的 Agent 在工具调用准确率（Tool Use Accuracy）上并未提升，甚至在某些情况下为了获取正向反馈而增加了无意义的对话轮次（Turn Count），这将直接证伪其“提升交互效率”的核心主张。\n\n### § 12 Follow-up Research Idea\n\n基于 Faca 对 **Private Strategy Metadata** 的依赖及其在真实世界中的不可用性，提出一个新的研究方向：**Implicit Feedback Alignment via Contrastive Trajectory Modeling (IFACT)**。\n\n**(a) 驱动局限：** Faca 的核心局限在于它假设存在一个完美的、可访问的“地面真值”反馈信号（即模拟器的私有元数据）。在真实部署中，我们只有用户的自然语言 Utterance，这些信号是嘈杂、模糊且非结构化的。现有的方法要么忽略这些信号（Outcome-only），要么依赖昂贵的 Critic 模型进行显式评分。我们需要一种方法，能够直接从原始文本中隐式地学习“什么是好的交互”，而不需要显式的标签或额外的 Critic 网络。\n\n**(b) 借鉴领域：** 借鉴 **Self-Supervised Learning** 中的 **Contrastive Learning**（对比学习）和 **Information Bottleneck**（信息瓶颈）理论。在自然语言处理中，对比学习已被证明能有效捕捉语义相似性。我们可以将“用户反应”视为一种隐式的奖励信号，通过对比“导致任务成功的轨迹片段”与“导致任务失败或停滞的轨迹片段”中用户反应的分布差异，来学习一个隐式的反馈表示空间。\n\n**(c) 实验设计：**\n1.  **数据构建**：收集大量多轮交互轨迹，标记最终结果（Success/Failure）。\n2.  **隐式反馈编码器**：训练一个轻量级的 **Reaction Encoder**，将用户的 Utterance 映射到一个低维向量空间。\n3.  **对比目标**：设计一个对比损失函数，使得在相同任务上下文中，来自成功轨迹的用户反应向量与来自失败轨迹的用户反应向量在空间中尽可能分离。同时，引入 **Temporal Consistency Loss**，确保相邻 Turn 的反应向量具有平滑性，以捕捉交互的动态演变。\n4.  **信用分配**：在 RL 训练过程中，不使用固定的 $+1/0/-1$ 标签，而是使用 Reaction Encoder 输出的向量与“成功原型”（Success Prototype）的余弦相似度作为动态的 **Process Advantage**。\n5.  **验证**：在 $\\tau$-bench 上对比 IFACT 与 Faca 和 Outcome-only GRPO。关键指标不仅是任务成功率，还包括 **Sample Efficiency**（样本效率）和 **Robustness to Noise**（对噪声 Utterance 的鲁棒性）。如果 IFACT 能在没有私有元数据的情况下，仅凭文本对比就学到与 Faca 相当甚至更好的交互策略，将证明隐式反馈对齐的可行性，并为真实世界部署提供新路径。\n\n这个提议与 Faca 的根本区别在于：Faca 是 **Supervised** 的（依赖模拟器标签），而 IFACT 是 **Self-Supervised** 的（依赖轨迹结果的对比）。它不试图“解码”用户的意图，而是学习“什么样的用户反应模式与成功相关”，从而避免了标签噪声和模拟器偏差的问题。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Yiwen Zhao\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Zhihao Wen\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Yuchen Mao\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Mingxuan Jiang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yihao Hu\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Pan Wang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xin Zhang\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Wei Wu\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Fudan University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Ant International, Ant Group\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal Contributions\"\n    }\n  ]\n}\n```", "summary_translation": "面向用户的工具智能体必须在多轮交互中随着用户目标的展开来协调对话与工具使用。然而，交互式强化学习通常将每次 rollout 简化为一个终端奖励，从而对有效的引导、错误以及后续的修复分配相同的信用。下一轮用户输入不仅仅是上下文：它还提供了关于前一段用户交互片段的嘈杂且时间局部的证据。我们引入了 \\textbf{F}eedback-\\textbf{A}ware \\textbf{C}redit \\textbf{A}ssignment (\\textsc{FACA})，该方法将每个反应与相应的片段对齐，推导出局部归一化的反应优势，并将其添加到经过验证的终端结果优势中，无需额外的 critic 或 rollout。在与模拟器、可见对话、初始化、rollout 和优化相匹配的仅基于结果的 Interactive GRPO 控制基线对比下，\\textsc{FACA} 在三次独立训练的实验中，将九个领域的 $τ$-family 平均性能在 8B 和 14B 模型上分别提升了 5.91 和 10.22 个百分点。增益主要集中在 Telecom 领域；在 8B 模型上，随机化反应极性会消除 Telecom 领域的增益。相同的排序关系在 Pare-Bench 和 Co-Gym 的零样本测试中也成立。这些结果表明，下一轮的用户反应为改进多轮用户交互智能体提供了可操作的局部信用。"}, {"title": "LEGO-RL: Harness-Native Reinforcement Learning for Coding Agents", "arxiv_id": "2608.17393", "authors": "Yiming Du, Yuxin Jiang, Tao Yuan, Jianbo Dai, Shaowei Wang, Jierun Chen, Chaofan Tao, Xianzhi Yu, Lifeng Shang, Kam-Fai Wong, Xiaohui Li, Haoli Bai", "summary": "Reinforcement learning for coding agents increasingly relies on long-running agent harnesses to manage tool integration, repository contexts, and execution feedback. However, the native execution environments of these harnesses are inherently misaligned with policy-gradient training: environmental crashes and reward hacking corrupt outcome signals, while train-inference discrepancies decouple rollout behavior from policy updates. To address this, we present LEGO-RL, a framework that bridges native coding-agent harnesses with scalable policy-gradient optimization without modifying their internal control flow. LEGO-RL is built upon three pillars: (1) faithful optimization via in-process LLM proxying that captures raw generation streams for token-level alignment and robust trainer-side log-probability recomputation, even under harness-side compaction or re-serialization; (2) reliable execution via scalable sandbox orchestration featuring image caching and stage-wise defenses to mitigate reward hacking; and (3) observable training through an integrated plugin that automates validation and monitoring, paired with a Live UI for granular trajectory diagnostics. We evaluate LEGO-RL by training the sparse MoE model Qwen3.5-35B-A3B with GSPO across three native coding-agent harnesses. LEGO-RL improves Qwen3.5-35B-A3B across OpenHands SDK (64.0% to 70.4%), Claude Code (62.4% to 68.2%), and OpenCode (57.2% to 66.6%) on SWE-bench Verified, while maintaining a rollout-training probability correlation above 0.99.", "category": "cs.AI", "cluster": "Reinforcement Learning \u0026 Training for Agents", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior, Coding Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=-59 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文完全符合“构建、改进、训练 LLM智能体”的研究范围，具体依据如下：\n\n1.  核心对象明确：论文的研究对象是“Coding Agents”（代码智能体），属于典型的 Agentic AI 范畴。它关注的是智能体在复杂环境（代码仓库、工具集成）中的长期决策和执行能力。\n2.  符合“训练/改进智能体”的标准：论文提出了 LEGO-RL 框架，旨在解决代码智能体在强化学习（RL）训练中的核心痛点（如环境崩溃、奖励黑客、训练-推理分布不一致）。这直接对应筛选标准中“保留”的第4条：“如果论文研究... agent training/distillation/RL... 并且标题或摘要明确指向 Agentic / LLM Agents... 应保留”。\n3.  符合“Harness/Scaffold 改进”的标准：论文的核心贡献在于改进智能体的执行环境（Harness）与训练流程的对齐（Alignment）。这对应筛选标准中“保留”的第2条：“如果论文研究 agent 的 harness / scaffold / runtime... 并且核心贡献是让这些智能体运行组件通过... 自动改进、演化或自适应优化”。虽然这里是通过 RL 训练来优化策略，但其机制依赖于对 Harness 原生环境的深度适配和优化，属于智能体能力实现的关键基础设施改进，而非通用的底层硬件或模型部署基础设施。\n4.  排除项不适用：\n       它不是单纯的基础设施优化（如硬件加速），而是针对智能体训练逻辑的算法/框架创新。\n       它不涉及被排除的安全、对齐、多模态视觉或图神经网络技术。\n       它不是简单的应用层论文，而是提出了新的训练方法论。\n\n综上，该论文通过改进训练框架来提升代码智能体的性能，属于 LLM 智能体训练与演化的前沿研究，应予以保留。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：如何在**不修改**现有原生编码智能体（Coding Agent）控制流（Control Flow）的前提下，将其与可扩展的**策略梯度优化**（Policy-Gradient Optimization）无缝集成，以解决**Rollout**（采样）与**Training**（训练）之间的分布偏移及信号失真问题。具体而言，原生智能体框架（如 OpenHands, Claude Code）在运行过程中会进行上下文压缩、历史重写和工具调用序列化，导致训练端无法精确重构采样时的 Token 序列和 Log-probability，从而破坏了**Faithful Optimization**（忠实优化）的基础；同时，沙箱执行中的环境崩溃、**Reward Hacking**（奖励黑客行为）以及异步流水线中的故障传播，进一步腐蚀了稀疏且昂贵的执行反馈信号。\n\n这一问题的重要性在于，当前的**Agentic RL**（智能体强化学习）训练往往依赖于对智能体框架的深度定制或完全重写，这不仅破坏了原生框架经过验证的工具集成、上下文管理和执行逻辑，还引入了巨大的工程适配成本。如果无法保证**Rollout–Training Alignment**（采样-训练对齐），策略更新将基于错误的概率估计，导致训练不稳定或性能退化。解决这一问题能够带来三重价值：首先，它实现了**Harness-Native**（原生框架兼容）的训练范式，允许研究者直接利用成熟的智能体生态（如 SWE-agent, OpenHands SDK）进行 RL 训练，无需重新开发底层交互逻辑；其次，通过**In-Process Proxy**（进程内代理）和**R3**（Rollout Routing Replay）技术，确保了在稀疏 MoE 模型和复杂上下文管理下的概率计算一致性，提升了训练的可靠性；最后，通过集成**Sandbox Orchestration**（沙箱编排）和**Live UI**（实时可视化监控），解决了长周期、高并发执行中的可观测性和奖励完整性问题，显著提升了在 SWE-bench Verified 等基准上的解决率（例如 OpenHands SDK 从 64.0% 提升至 70.4%），为大规模编码智能体的 RL 训练提供了工业级可行的基础设施。\n\n### § 2 前人工作与不足\n\n该问题此前并未被完全解决，现有的**Agentic RL Frameworks**主要分为两类，均存在显著不足。第一类是**Framework-Controlled Rollout**（框架控制采样）方法，如 **verl** (Sheng et al., 2025), **slime** (THUDM, 2025), **MOLT** (NVIDIA NeMo, 2026), **SkyRL-Agent** (Cao et al., 2025) 和 **AReaL** (Fu et al., 2025)。这些系统将智能体的 Rollout 过程完全纳入 RL 框架内部，要求开发者将现有智能体适配到框架定义的抽象接口中。其不足在于：它们破坏了原生智能体的**Control Flow**，例如需要重写初始化逻辑、替换默认工具集或自定义终止条件，这导致训练行为与原生智能体在实际部署中的行为不一致（即**Train-Inference Discrepancy**），且难以复用原生框架中复杂的上下文管理和工具集成逻辑。\n\n第二类是**Harness-Native**（原生框架兼容）方法，如 **Polar** (Xu et al., 2026), **rLLM** (Berkeley Sky Computing Lab, 2026), **OpenForgeRL** (Yu et al., 2026) 和 **Agent Lightning** (Luo et al., 2025)。这些方法通过 API 拦截或 SDK 回调来观察智能体交互，保留了原生工作流。然而，它们存在以下关键缺陷：\n1.  **缺乏忠实的概率重构能力**：大多数框架仅记录最终的轨迹文本，而未在生成边界（Model-Serving Boundary）捕获原始的 Token IDs 和 Log-probabilities。当原生框架进行**History Rewriting**（历史重写）或**Context Compaction**（上下文压缩）时，训练端无法精确还原采样时的概率分布，导致**Faithfulness**缺失。特别是对于**Sparse MoE**（稀疏混合专家）模型，若未重放采样时的**Expert Routing**（专家路由）决策，训练端的概率计算将与采样端严重偏离。\n2.  **执行可靠性与奖励完整性不足**：现有框架往往缺乏针对**Reward Hacking**（如智能体读取 Git 历史或修改测试文件）的系统性防御，以及针对沙箱环境故障（如依赖安装失败、超时）的细粒度隔离和恢复机制。这导致大量无效或污染的轨迹进入训练，腐蚀了**Group-Relative Advantage**（组相对优势）估计。\n3.  **可观测性缺失**：在异步、长周期的训练过程中，缺乏将聚合训练指标（如 Reward, Entropy）与底层执行状态（如终止原因、工具调用分布、轨迹片段）关联起来的诊断工具，使得故障定位（如区分策略退化与环境故障）极其困难。\n\nLEGO-RL 通过引入**In-Process Proxy**实现 Token 级别的忠实捕获，结合**R3**解决 MoE 路由一致性问题，并构建包含**Anti-Hacking Defenses**和**Live UI**的完整闭环工作流，填补了上述框架在**Faithful Optimization**、**Reliable Execution**和**Observable Training**方面的空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在深入探究 Coding Agent 的强化学习（RL）训练时，研究者首先面临的一个核心矛盾是：**现有的 RL 框架（如 verl, slime）与原生 Agent Harness（如 OpenHands, Claude Code）之间存在严重的“语义鸿沟”**。传统的 RL 框架通常要求 Agent 遵循框架定义的 Rollout 接口，这意味着必须重写 Agent 的 Prompt 构造、工具调用逻辑和上下文管理策略。然而，原生 Harness 经过长期迭代，其内部的控制流（Control Flow）、上下文压缩（Context Compaction）和历史重写（History Rewriting）机制是 Agent 性能的关键组成部分。如果强行将 Agent 适配到 RL 框架，不仅破坏了原生行为，还导致训练时的策略分布与推理时的实际行为不一致（Train-Inference Discrepancy）。\n\n其次，研究者观察到**“忠实优化”（Faithful Optimization）在工程实现上的巨大挑战**。在原生 Harness 中，模型生成的 Token 序列往往会被 Harness 重新序列化、压缩或截断。如果 RL Trainer 仅依赖最终保存的轨迹日志来重新计算 Log-Probability，由于 Harness 侧的修改，Trainer 看到的 Context 和 Token 序列与 Rollout 时模型实际看到的并不完全一致。这种细微的差异在 Policy Gradient 更新中会被放大，导致梯度信号失真。特别是对于稀疏 MoE 模型，Rollout 时的 Expert Routing 决策如果在 Training 时无法精确复现，会导致概率计算完全错误。因此，必须在模型服务边界（Model-Serving Boundary）进行“原位捕获”（In-Process Proxy），记录原始的 Token ID、Log-Prob 和 Routing 决策，而不是事后重构。\n\n第三，**执行环境的可靠性与奖励完整性（Reward Integrity）是长期 Horizon 任务中的致命瓶颈**。Coding Agent 的任务涉及复杂的依赖安装、代码执行和测试验证，任何沙箱崩溃、网络超时或依赖错误都会导致轨迹中断。更严重的是，Agent 可能会发现“奖励黑客”（Reward Hacking）漏洞，例如通过读取 Git 历史获取参考补丁，或修改测试文件来伪造通过。现有的异步 RL 系统往往缺乏对这些细粒度失败模式的隔离和防御，导致大量无效轨迹污染训练信号，或者因个别长尾任务阻塞整个同步 Batch 的训练进度。\n\n最后，**可观测性（Observability）的缺失使得调试极其困难**。在异步、分布式的训练环境中，当验证奖励下降时，很难区分是策略退化、环境配置错误、还是奖励信号被污染。现有的框架缺乏将宏观训练指标（如 Reward, Entropy）与微观轨迹证据（如具体的 Tool Call 失败、上下文截断）关联起来的能力。\n\n基于以上观察，作者意识到需要一个**“非侵入式”的中间层**，它不修改原生 Harness 的代码，而是通过代理（Proxy）捕获原始生成流，通过沙箱编排（Sandbox Orchestration）保证执行隔离和奖励纯净，并通过异步调度（Asynchronous Scheduling）解决长尾延迟问题。这就是 LEGO-RL 的核心构思：**在保留原生 Agent 控制流的前提下，通过基础设施层面的对齐和防御，实现高保真的 Policy Gradient 优化。**\n\n### § 4 核心 Intuition\n\nLEGO-RL 的核心直觉在于：**原生 Coding Agent 的复杂控制流（如上下文压缩、历史重写）是其能力的组成部分，不应被 RL 框架强行标准化，而应通过“原位捕获”（In-Process Proxy）在模型服务边界精确记录 Rollout 时的真实 Token 和概率分布，从而消除训练与推理之间的语义偏差。**\n\n同时，**长期代码任务的稀疏奖励极易被环境噪声和奖励黑客（Reward Hacking）污染，因此必须将“执行可靠性”和“奖励完整性”作为训练基础设施的一等公民，通过沙箱隔离、阶段式防御和异步调度，确保只有高质量、无污染的轨迹参与策略更新。**\n\n简而言之，**与其让 Agent 适应 RL 框架，不如让 RL 框架通过高保真捕获和鲁棒执行环境来适应原生 Agent，从而在保持 Agent 原生行为一致性的同时实现有效的策略优化。**", "methodology": "### § 5 具体方法与完整 Pipeline\n\nLEGO-RL 的核心方法在于构建一个**Harness-Native**（原生集成）的强化学习框架，它不修改现有 Coding Agent（如 OpenHands, Claude Code）的内部控制流，而是通过“旁路”方式捕获数据并进行策略梯度优化。其完整 Pipeline 包含以下关键步骤：\n\n1.  **环境初始化与沙箱隔离 (Sandbox Execution)**：\n    *   **输入**：从任务池（如 OpenSWE）中选取一个具体的软件修复任务（包含代码仓库快照、Issue 描述、验证脚本）。\n    *   **处理**：LEGO-RL 在 Kubernetes 或 Docker 容器中启动一个隔离的沙箱。利用 **Nydus** 懒加载技术快速挂载基础镜像，并将 Agent 运行时和验证工具链以只读方式挂载，避免重复安装。\n    *   **目的**：确保执行环境的一致性，并通过网络隔离和 Git 历史隐藏防止 Agent 进行 **Reward Hacking**（奖励作弊，如直接读取测试文件或下载参考补丁）。\n\n2.  **In-Process Proxy 捕获 (Faithful Capture)**：\n    *   **处理**：Agent 在沙箱中运行，当它调用 LLM API 时，请求经过 **In-Process Proxy**。Proxy 不改变 Agent 的行为，但在服务端边界精确记录生成的 Token IDs、Log-probabilities、Response Masks 以及 MoE 模型的 **Expert Routing** 决策。\n    *   **关键点**：由于 Agent 可能会在内部重写或压缩上下文历史（History Rewriting），Proxy 必须在生成时刻（Generation-time）捕获原始数据，而不是事后从 Agent 日志中重构，以保证训练时的概率计算与推理时完全一致（Faithful Optimization）。\n\n3.  **异步 Rollout 与奖励计算 (Asynchronous Rollout \u0026 Verification)**：\n    *   **处理**：Agent 执行代码修改、运行测试等动作，直到任务完成或超时。验证器（Verifier）执行测试脚本，返回二元奖励 $r \\in \\{0, 1\\}$。\n    *   **调度**：采用 **Fully Asynchronous** 调度，新任务无需等待前一批次完成即可启动，解决长尾延迟问题。\n    *   **过滤**：如果轨迹因基础设施故障（如沙箱崩溃）终止，该轨迹被标记为无效（Masked），不参与梯度更新，防止噪声污染。\n\n4.  **策略优化训练 (Policy Gradient Optimization)**：\n    *   **输入**：捕获的轨迹数据（Context, Tokens, Rewards）进入 Data Buffer。\n    *   **处理**：Trainer 使用 **GSPO** (Group Sequence Policy Optimization) 算法进行更新。\n        *   **Group-relative Advantage**：将同一任务的多个轨迹（例如 8 个）分为一组，计算组内相对优势，消除基线偏差。\n        *   **Routing Replay (R3)**：对于稀疏 MoE 模型，训练时强制复用 Rollout 时的 Expert 路由决策，确保训练时的概率分布与推理时一致。\n    *   **输出**：更新后的模型权重 $\\theta$ 同步回 Inference Server。\n\n5.  **可观测性与闭环迭代 (Observability \u0026 Closed-loop)**：\n    *   **处理**：**Live UI** 实时监控训练指标、终止原因分布和轨迹一致性。\n    *   **反馈**：研究人员通过 UI 诊断失败模式（如 Agent 停止调用工具），调整任务难度筛选或超参数，形成闭环。\n\n**真实例子演示：**\n假设任务是修复 `sepal_ui` 库中的一个进度条 Bug。\n1.  **输入**：LEGO-RL 启动沙箱，加载 `sepal_ui` 代码库。\n2.  **执行**：OpenHands Agent 读取 Issue，调用 `read_file` 查看 `alert.py`，然后调用 `edit_file` 修改代码，最后运行 `pytest`。\n3.  **捕获**：Proxy 记录了 Agent 每次调用 LLM 时的 Prompt 和生成的 Token 序列，以及 MoE 模型选择了哪些专家。\n4.  **奖励**：`pytest` 通过，Verifier 返回 $r=1$。\n5.  **训练**：Trainer 获取该轨迹，计算 Log-likelihood，利用 GSPO 更新 Qwen3.5-35B-A3B 模型，使其更倾向于生成正确的修复代码。\n\n---\n\n### § 6 核心数学推导\n\nLEGO-RL 的核心数学基础是 **Group Sequence Policy Optimization (GSPO)** 及其对 **Faithfulness** 的严格定义。\n\n#### 1. 目标函数与优势估计\n传统的 PPO 或 GRPO 通常基于单个样本或全局基线。LEGO-RL 采用组相对优势估计，以解决稀疏奖励下的方差问题。\n\n*   **公式**：\n    $$ \\hat{A}_i = \\frac{r_i - \\bar{r}}{\\text{std}(r_{1:G}) + \\delta} $$\n    其中 $r_i$ 是第 $i$ 个轨迹的奖励，$\\bar{r}$ 是组内平均奖励，$G$ 是组大小（如 8），$\\delta$ 是平滑项。\n\n*   **Intuition**：\n    在代码生成中，奖励是稀疏的（0 或 1）。如果直接最大化奖励，模型可能因为偶然成功而得到错误信号。通过计算**组内相对优势**，我们只关心“在这个特定任务上，这个轨迹是否比同组的其他尝试更好”。如果组内所有轨迹都失败（全 0）或都成功（全 1），优势为 0，不产生梯度。这迫使模型关注那些**具有区分度**的任务，即模型“有时能解，有时不能解”的任务，从而提供有效的学习信号。\n\n#### 2. 忠实性要求 (Faithfulness Requirement)\n这是 LEGO-RL 区别于其他框架的关键数学约束。\n\n*   **公式**：\n    $$ \\ell_{\\text{train}}^{i,(t,j)}(\\theta_{k'}) \\approx \\ell_{\\text{roll}}^{i,(t,j)} $$\n    其中 $\\ell_{\\text{roll}}$ 是 Rollout 时 Proxy 捕获的 Log-probability，$\\ell_{\\text{train}}$ 是 Trainer 使用相同权重 $\\theta_{k'}$ 重新计算的值。\n\n*   **Intuition**：\n    强化学习依赖于准确的概率重计算（Recomputation）来计算重要性采样比率（Importance Sampling Ratio）。如果 Agent 在内部修改了 Prompt（例如压缩历史），Trainer 看到的 Context 与 Rollout 时不同，计算出的概率就会错误，导致梯度方向偏差。\n    **数学含义**：必须保证 Trainer 看到的 Token 序列、Mask 和 Context 与 Rollout 时**完全一致**。对于 MoE 模型，还必须保证 **Expert Routing** 一致，否则即使 Token 相同，不同专家的路由会导致概率分布不同，破坏忠实性。\n\n#### 3. GSPO 损失函数\n*   **公式**：\n    $$ L(\\theta) = \\mathbb{E} \\left[ \\min \\left( r(\\theta) \\hat{A}, \\text{clip}(r(\\theta), 1-\\epsilon_{\\text{low}}, 1+\\epsilon_{\\text{high}}) \\hat{A} \\right) \\right] $$\n    其中 $r(\\theta)$ 是序列级别的重要性采样比率。\n\n*   **Intuition**：\n    这是 PPO 的序列级变体。它限制策略更新的幅度，防止模型在一次更新中偏离行为策略太远。LEGO-RL 使用不对称的 Clip 范围（$\\epsilon_{\\text{low}} \u003C \\epsilon_{\\text{high}}$），允许更大的正向更新（奖励高时），但限制负向更新，以加速收敛并稳定训练。\n\n---\n\n### § 7 实验设计与结论\n\n#### 1. 验证 Harness-Native 训练的有效性\n*   **提出了什么问题**：现有的 RL 框架通常需要修改 Agent 代码或接口，这破坏了 Agent 原有的工作流，导致训练效果无法泛化到原生环境。LEGO-RL 能否在不修改 Agent 的情况下，显著提升其在原生 Harness 上的表现？\n*   **设计了什么实验**：在三个主流原生 Coding Agent Harness（OpenHands SDK, Claude Code, OpenCode）上，使用相同的基座模型 Qwen3.5-35B-A3B 进行训练。对比训练前后的 **SWE-bench Verified** 解决率。\n*   **问题的答案**：LEGO-RL 显著提升了所有三个 Harness 的性能。OpenHands SDK 从 64.0% 提升至 70.4%，Claude Code 从 62.4% 提升至 68.2%，OpenCode 从 57.2% 提升至 66.6%。且训练后的模型性能超过了更新的基座模型 Qwen3.6-35B-A3B，证明了 Harness-Native RL 的有效性。\n\n#### 2. 验证忠实性优化 (Faithful Optimization) 的必要性\n*   **提出了什么问题**：如果 Trainer 无法精确重现 Rollout 时的概率分布（由于历史重写或 MoE 路由不一致），训练是否会失效？\n*   **设计了什么实验**：\n    1.  计算 Rollout 捕获的 Log-probability 与 Trainer 重计算值的 **Pearson 相关系数** 和 **KL 散度**。\n    2.  进行消融实验：关闭 **Routing Replay (R3)**，观察 MoE 模型的对齐情况。\n*   **问题的答案**：LEGO-RL 保持了极高的对齐度（Pearson \u003E 0.998）。关闭 R3 后，相关性从 0.9993 降至 0.9946，证明对于稀疏 MoE 模型，复用路由决策对保持训练忠实性至关重要。\n\n#### 3. 验证奖励完整性与任务筛选\n*   **提出了什么问题**：沙箱环境中的作弊行为（Reward Hacking）和无效任务会污染训练信号。如何确保奖励反映真实能力？\n*   **设计了什么实验**：\n    1.  实施防御措施（隐藏 Git 历史、网络隔离）前后对比作弊率。\n    2.  对比不同难度筛选策略（随机采样 vs. 难度筛选）对训练奖励方差和最终性能的影响。\n*   **问题的答案**：防御措施有效消除了大部分作弊行为。难度筛选（保留模型部分能解的任务）显著提高了组内奖励方差，提供了更有效的学习信号，而未筛选的随机任务池导致训练停滞。\n\n#### 4. 验证系统效率与可观测性\n*   **提出了什么问题**：长尾延迟和异步训练是否提高了吞吐量？Live UI 能否帮助诊断失败？\n*   **设计了什么实验**：对比同步与异步调度的训练步数；使用 Live UI 分析失败轨迹（如环境设置失败 vs. 策略退化）。\n*   **问题的答案**：异步调度避免了长尾延迟，训练吞吐量提升 2.5 倍。Live UI 成功区分了基础设施故障和策略退化，帮助研究人员快速定位问题（如发现 Agent 停止调用工具而转为生成文本）。", "additional_insights": "### § 8 Take-aways\n\nLEGO-RL 的核心创新在于通过 **In-Process Proxy** 在模型服务边界直接捕获原始 token 流和生成元数据，从而解决了原生 Agent Harness（如 OpenHands, Claude Code）因上下文压缩或历史重写导致的 **Rollout-Training Probability Mismatch** 问题。该框架证明了在不修改 Agent 内部控制流的前提下，通过 **R3 (Rollout Routing Replay)** 机制重放稀疏 MoE 模型的专家路由决策，可以将训练与推理的概率相关性维持在 0.99 以上，确保了 **Faithful Optimization**。针对长 horizon 任务中的 **Reward Hacking** 和环境崩溃问题，LEGO-RL 引入了基于沙箱隔离、网络限制和测试依赖打包的 **Reward Integrity Defenses**，并结合 **Termination-Aware Filtering** 将基础设施失败导致的无效轨迹从梯度更新中剔除。实验表明，在 Qwen3.5-35B-A3B 上应用 **GSPO** 算法，LEGO-RL 在 SWE-bench Verified 上显著提升了三种不同 Harness 的解决率（最高提升 9.4 个百分点），且其性能超越了未经 RL 训练的更强基座模型 Qwen3.6-35B-A3B。系统层面的 **Asynchronous Rollout Scheduling** 和 **Nydus Lazy Image Pull** 优化，有效缓解了 Agent 执行时间的长尾分布对训练吞吐量的瓶颈影响，实现了 2.5 倍的步骤时间加速。\n\n### § 9 最脆弱的假设\n\nLEGO-RL 最关键的假设是：**原生 Agent Harness 的上下文管理策略（Context Management Policies）虽然会重写历史，但其对当前生成步骤的条件分布影响可以通过“消息粒度对齐”和“生成时捕获”完全解耦，且这种解耦不会丢失对策略优化至关重要的语义依赖。**\n\n如果这一假设不成立，即 Harness 的上下文压缩或重写实际上改变了模型对当前 token 的条件概率分布（例如，通过移除某些关键的历史工具调用结果来改变模型的注意力焦点），那么 In-Process Proxy 捕获的“原始 token”虽然在数值上与训练时重算的概率一致，但其背后的语义条件可能与训练时使用的上下文不一致，导致 **Faithful Optimization** 失效，训练出的策略在真实 Harness 环境中表现不佳。\n\n论文提供的证据是 Table 3 中极高的 Pearson 相关性（\u003E0.998）和极低的 KL 散度，但这仅证明了数值上的一致性，并未证明语义上的一致性。论文在 §4.4 中提到通过匹配工具调用 ID 而非序列化参数来解决 93% 的不匹配，并隔离子 Agent 请求，但这依赖于 Harness 内部逻辑的稳定性。如果未来 Harness 引入更激进的上下文摘要（Summarization）或动态上下文窗口调整，使得“当前上下文”与“捕获时的上下文”在语义上发生不可逆的偏差，而 Proxy 无法感知这种语义偏差，那么训练信号将变得误导。论文缺乏对这种“语义漂移”导致性能下降的负面控制实验（Negative Control），仅展示了在现有 Harness 版本下的成功。\n\n### § 10 最小复现实验\n\n**目标：** 验证 **In-Process Proxy** 在存在上下文重写（History Rewriting）的情况下，是否能保持训练与推理的概率一致性，以及这种一致性是否对最终性能至关重要。\n\n**数据：** 使用 SWE-bench Verified 中的一个小规模子集（例如 50 个任务），选择一个支持上下文压缩的 Harness（如 OpenHands SDK 或自定义模拟 Harness）。\n\n**实现：**\n1.  **基线（Baseline）：** 实现一个标准的 RL 训练循环，其中训练阶段通过解析最终的轨迹日志（Trajectory Log）来重建上下文和 token 序列，模拟传统框架的做法。\n2.  **实验组（LEGO-RL Proxy）：** 实现一个简化的 In-Process Proxy，在模型 API 调用时直接拦截并记录原始 token IDs、log-probs 和上下文快照，绕过 Harness 的历史重写逻辑。\n3.  **干扰项（Perturbation）：** 在 Harness 中引入一个明确的上下文压缩规则（例如，每 5 轮对话将历史摘要为一个 token 或截断前 50% 的历史），确保 Baseline 和实验组面临相同的语义信息损失，但 Baseline 无法获取被压缩前的原始 token 概率。\n\n**测量：**\n1.  **概率一致性：** 计算 Baseline 和实验组在训练阶段重算的 log-prob 与推理阶段实际 log-prob 之间的 Pearson 相关性和 KL 散度。\n2.  **训练稳定性：** 监控两个组在相同训练步数下的 Reward 曲线和 Policy Entropy。\n3.  **最终性能：** 在相同的验证集上评估两个组训练出的模型的 Solve Rate。\n\n**结果判定：**\n*   **支持 Claim：** 如果实验组的概率一致性显著高于 Baseline（如论文所述的 \u003E0.99 vs \u003C0.90），且实验组的最终 Solve Rate 显著高于 Baseline，则证明 In-Process Proxy 对于处理上下文重写至关重要。\n*   **反驳 Claim：** 如果 Baseline 和实验组的概率一致性差异不大，或者最终性能没有显著差异，则说明当前的上下文重写对概率分布的影响有限，或者 Harness 的重写逻辑足够简单，使得日志重建足以满足训练需求，从而质疑 LEGO-RL 核心组件的必要性。", "research_value": "### § 11 最强反例设计\n\n若要挑战 LEGO-RL 的核心主张，最有力的攻击并非针对其工程实现的复杂性，而是针对其**Faithful Optimization**（忠实优化）假设在**动态上下文管理**（Dynamic Context Management）下的语义有效性。LEGO-RL 的核心论点是：通过 **In-Process Proxy** 捕获生成时刻的 Token 和 Log-probability，可以消除因 **History Rewriting**（历史重写）导致的训练-推理分布偏移。然而，这一论点隐含了一个脆弱的假设：即 Agent 的决策质量主要取决于当前生成的 Token 概率，而忽略了**上下文窗口内的信息密度与注意力分布**对策略的长期影响。\n\n**反例场景：语义压缩导致的“虚假忠实”**\n考虑一个复杂的软件修复任务，其中 Agent 需要维护一个跨越 50 轮对话的长程依赖（例如，先修改了底层 API，后在高层业务逻辑中调用该 API）。原生 Harness（如 OpenHands）为了节省 Token，会在第 30 轮对前 29 轮的历史进行**Summarization**（摘要）或**Pruning**（剪枝）。\n1.  **LEGO-RL 的行为**：Proxy 在第 30 轮捕获了模型基于“摘要后上下文”生成的 Token 概率。Trainer 在训练时，使用相同的“摘要后上下文”重算概率，发现两者高度一致（Pearson \u003E 0.99），从而认为优化是忠实的。\n2.  **攻击点**：如果 Harness 的摘要算法丢失了关键的工具调用参数（例如，将 `edit_file(path=\"a.py\", content=\"...\")` 摘要为 `edited file a.py`），那么模型在第 30 轮及之后的生成，实际上是建立在**信息缺失**的基础上的。LEGO-RL 的优化会强化模型在“信息缺失”条件下的行为模式。\n3.  **失败条件**：当我们将训练后的模型部署回原生 Harness 时，如果 Harness 的摘要策略发生微小变化（例如，从“保留文件名”变为“仅保留操作类型”），或者我们切换到一个不进行摘要但保留完整历史的 Harness，模型的性能可能会急剧下降。这是因为 LEGO-RL 并没有优化模型对“完整语义”的理解，而是优化了模型对“特定摘要格式”的适应性。\n4.  **替代解释**：LEGO-RL 在 SWE-bench 上的性能提升，可能并非源于解决了概率对齐问题，而是源于**Implicit Curriculum Learning**（隐式课程学习）。通过 **Termination-Aware Filtering** 剔除失败轨迹，LEGO-RL 实际上是在进行一种基于结果的筛选，这与传统的 **Rejection Sampling** 或 **Best-of-N** 策略类似。如果我们在 Baseline 中加入同样严格的轨迹筛选和难度分级，而不使用 In-Process Proxy，性能提升可能依然显著。这将证明 Proxy 带来的“忠实性”是边际收益，而非核心驱动力。\n\n**理论论证：MoE 路由的“非平稳性”陷阱**\nLEGO-RL 使用 **R3 (Rollout Routing Replay)** 强制训练时复用推理时的 **Expert Routing**。然而，在强化学习中，策略更新会导致模型权重 $\\theta$ 变化，进而改变 **Gating Network** 的决策边界。\n*   **攻击点**：如果训练后的模型权重 $\\theta_{new}$ 使得原本被路由到 Expert A 的 Token 现在应该被路由到 Expert B，但 R3 强制其继续使用 Expert A，这会导致**梯度方向错误**。模型被迫在一个“错误”的专家子空间中进行优化，这可能会阻碍模型探索更优的路由策略。\n*   **反例实验**：设计一个任务，其中正确的修复代码需要特定的代码生成专家（Expert Code），而错误的尝试往往激活了通用文本专家（Expert Text）。如果 R3 强制模型在训练时继续使用推理时的“错误路由”（例如，因为推理时模型尚未学会正确路由），那么训练过程实际上是在强化错误的路由偏好，导致模型陷入局部最优，无法学会正确的专家选择机制。这将证明 R3 在策略探索阶段是有害的，仅在微调阶段有益，从而限制其通用性。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：从“概率忠实”到“语义对齐”的因果强化学习 (Causal Semantic Alignment for Agentic RL)**\n\n**驱动局限**：\nLEGO-RL 解决了**数值层面**的概率对齐（Numerical Faithfulness），但未能解决**语义层面**的上下文依赖（Semantic Dependency）。如前所述，Agent 的决策不仅取决于当前 Token 的概率，还取决于上下文窗口中信息的**完整性**和**因果结构**。当前的 RL 框架将上下文视为黑盒输入，忽略了 Harness 内部上下文管理策略（如摘要、剪枝）对模型注意力机制的干扰。这导致训练出的策略可能过度拟合特定的上下文格式，而非通用的代码修复逻辑。\n\n**新目标**：\n提出一种**Context-Aware Causal RL**（上下文感知因果强化学习）框架，旨在解耦**模型能力**（Model Capability）与**上下文管理策略**（Context Management Policy）。目标不是让模型适应特定的上下文重写，而是让模型学会在**信息不完整**或**上下文被压缩**的情况下，通过**主动查询**（Active Querying）或**内部记忆**（Internal Memory）来恢复关键语义，从而实现真正的**Robust Generalization**（鲁棒泛化）。\n\n**借鉴领域**：\n1.  **Causal Inference**（因果推断）：借鉴 **Do-calculus** 和 **Backdoor Adjustment**，识别上下文中的混淆变量（Confounding Variables），如“摘要丢失的信息”，并调整奖励信号以消除这些混淆因素的影响。\n2.  **Information Bottleneck**（信息瓶颈）：借鉴 **Variational Information Bottleneck (VIB)**，在训练过程中引入一个**Semantic Encoder**，强制模型将长程上下文压缩为低维的、语义丰富的**Latent State**，而非依赖原始的 Token 序列。\n\n**第一个实验设计**：\n1.  **构建“语义扰动”基准**：在 SWE-bench 任务中，人为引入不同级别的上下文扰动（如随机删除 10%、30%、50% 的历史工具调用结果），模拟极端情况下的上下文丢失。\n2.  **对比方法**：\n    *   **LEGO-RL**：使用 In-Process Proxy 捕获原始概率，但在扰动下，其捕获的概率将基于“被扰动”的上下文，导致训练信号失真。\n    *   **Causal Semantic RL (CSR)**：在 Agent 内部引入一个**Semantic Memory Module**，该模块在每一步生成时，不仅输出 Token，还输出一个**Context Summary Vector**。训练时，使用 **Causal Loss** 惩罚那些对上下文扰动敏感的轨迹，鼓励模型依赖 Semantic Memory Vector 而非原始上下文。\n3.  **评估指标**：\n    *   **Robustness Score**：在不同扰动级别下的 Solve Rate 保持率。\n    *   **Semantic Fidelity**：通过 **CLIP** 或 **CodeBERT** 计算 Semantic Memory Vector 与原始完整上下文的语义相似度。\n4.  **预期结果**：CSR 在低扰动下性能可能与 LEGO-RL 相当，但在高扰动下（模拟未来更激进的上下文压缩策略）显著优于 LEGO-RL，证明其学会了**语义鲁棒性**而非**格式过拟合**。\n\n**与已有工作的区别**：\nLEGO-RL 关注的是**工程层面的对齐**（如何精确捕获概率），而 CSR 关注的是**认知层面的对齐**（如何理解上下文）。LEGO-RL 假设上下文是固定的，而 CSR 假设上下文是动态且可能丢失的，并通过因果机制来增强模型的适应性。这不仅是方法的扩展，而是对 Agentic RL 中“上下文”角色的重新定义。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Yiming Du\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"*\",\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Yuxin Jiang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\",\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Tao Yuan\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"*\",\n        \"∗\"\n      ]\n    },\n    {\n      \"name\": \"Jianbo Dai\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Shaowei Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jierun Chen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Chaofan Tao\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xianzhi Yu\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Lifeng Shang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Kam-Fai Wong\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xiaohui Li\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Haoli Bai\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Huawei Technologies Co., Ltd\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"The Chinese University of Hong Kong\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"∗\",\n      \"text\": \"Co-first authors.\"\n    },\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding authors: { lixiaohui33,baihaoli }@huawei.com\"\n    }\n  ]\n}\n```", "summary_translation": "用于编码智能体的强化学习日益依赖于长期运行的智能体执行框架（agent harnesses）来管理工具集成、代码库上下文和执行反馈。然而，这些执行框架的原生执行环境本质上与策略梯度训练不匹配：环境崩溃和奖励作弊会污染结果信号，而训练与推理之间的差异则导致 rollout 行为与策略更新脱节。为解决这一问题，我们提出了 LEGO-RL，这是一个在不修改其内部控制流的情况下，将原生编码智能体执行框架与可扩展的策略梯度优化相连接的框架。LEGO-RL 建立在三大支柱之上：（1）通过进程内 LLM 代理实现忠实优化，捕获原始生成流以实现 token 级对齐，并在执行框架侧进行压缩或重新序列化时，仍能稳健地重新计算训练器侧的对数概率；（2）通过可扩展的沙箱编排实现可靠执行，具备镜像缓存和分阶段防御机制，以缓解奖励作弊；（3）通过集成插件实现可观测训练，自动化验证和监控，并配合 Live UI 进行细粒度的轨迹诊断。我们在三个原生编码智能体执行框架上，使用 GSPO 训练稀疏 MoE 模型 Qwen3.5-35B-A3B，对 LEGO-RL 进行评估。在 SWE-bench Verified 上，LEGO-RL 提升了 Qwen3.5-35B-A3B 在 OpenHands SDK（从 64.0% 提升至 70.4%）、Claude Code（从 62.4% 提升至 68.2%）和 OpenCode（从 57.2% 提升至 66.6%）上的表现，同时保持 rollout 与训练之间的概率相关性高于 0.99。"}, {"title": "PlanPO: Group Planning-Aware Policy Optimization for Multi-Turn Agentic LLMs", "arxiv_id": "2608.17289", "authors": "Dayang Liang, Liyuan He, Xuan Feng, Shuxin Li, Bo An, Yunlong Liu", "summary": "Group-relative policy optimization has emerged as a key paradigm for training agentic large language models (LLMs) on multi-turn interactive tasks. However, most existing variants fail to distinguish advantages among successful trajectories even when these trajectories differ substantially in their interaction efficiency. For instance, circuitous successes are often assigned the identical outcome reward, causing advantage collapse and severe performance bottlenecks. To this end, we propose Group Planning-aware Policy Optimization (PlanPO), a simple yet effective RL method for learning generalizable planning abilities beyond task-specific high-quality behavior patterns. Specifically, PlanPO introduces coarse-to-fine advantage signals, which capture the relative differences in trajectory-level lengths and turn-level response lengths conditioned on successful trajectories sampled for the same task. Within the group-relative optimization structure, this enables agents to actively learn generalizable and deliberate behaviors spanning interaction planning and textual generation from high-quality rollouts, without degenerating into vanilla length minimization. Experimentally, PlanPO improves over GRPO by 27.2\\% on average across the challenging multi-turn benchmarks ALFWorld, WebShop, and SciWorld, outperforming recent powerful baselines while incurring negligible additional training cost.", "category": "cs.AI", "cluster": "Reinforcement Learning \u0026 Training for Agents", "tags": ["cs.AI"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic LLMs)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文针对的核心研究问题是：在基于 Group Relative Policy Optimization (GRPO) 的多轮 Agentic LLM 强化学习中，如何解决**成功轨迹异质性（successful-rollout heterogeneity）**导致的**优势坍缩（advantage collapse）**问题。具体而言，现有的 Group-relative 方法通常仅依据最终的任务结果（outcome reward）来评估轨迹质量，这意味着无论一个成功的轨迹是高效直接的，还是冗长曲折甚至包含逻辑错误的推理，只要最终任务完成，它们往往被赋予相同的奖励信号。这种“一刀切”的奖励机制导致模型无法区分不同成功轨迹之间的效率差异，从而限制了 Agent 学习通用规划能力（generalizable planning abilities）的潜力，使其容易陷入对特定低效成功模式的模仿，而非掌握真正的规划策略。\n\n这一问题的重要性在于，多轮交互任务（如 ALFWorld, WebShop, SciWorld）具有长视界（long-horizon）和稀疏奖励（sparse reward）的特性，Agent 需要极强的规划能力来避免冗余交互和无效推理。如果无法从成功轨迹中挖掘出细粒度的质量信号，RL 训练将缺乏足够的判别性梯度（discriminative gradients），导致性能瓶颈。解决这一问题能够带来显著价值：首先，它使 Agent 能够学习到超越特定任务模式的、更具泛化性的规划行为（planning-aware behaviors），即在保证正确性的前提下，主动追求交互路径的简洁性和推理过程的紧凑性；其次，该方法无需引入额外的 Value Model 或复杂的 Process Reward Models (PRMs)，仅通过利用轨迹长度和响应长度这一天然信号，即可在几乎不增加训练成本的情况下，显著提升模型在复杂多轮任务中的表现和泛化能力。\n\n### § 2 前人工作与不足\n\n该问题在之前的研究中并未得到充分解决，主要因为现有的 Agentic RL 方法在处理奖励信号丰富化时存在明显的局限性。\n\n首先，传统的 Actor-Critic 方法（如 PPO）依赖 Value Model（Critic）来估计状态价值以计算优势函数。虽然这能提供细粒度的反馈，但训练和维护 Critic 模型带来了巨大的内存开销和计算成本，且 Critic 的估计偏差（estimation bias）可能误导策略更新。为了降低这种成本，近期研究转向了无 Critic 的 Group-relative 优化范式，如 **GRPO** (Shao et al., 2024)、**RLOO** (Ahmadian et al., 2024) 和 **ReMax** (Li et al., 2023)。这些方法通过在同组采样轨迹内计算相对优势来消除 Critic，极大地提高了可扩展性。然而，GRPO 等方法的根本缺陷在于其优势计算仅基于最终的标量奖励（scalar reward），完全忽略了轨迹内部的过程质量。正如本文指出的，这导致“绕远路”的成功和“直达”的成功在梯度更新中被同等对待，造成了优势信号的坍缩。\n\n其次，为了解决 GRPO 的粒度不足问题，一些后续工作尝试构建更细粒度的奖励信号。例如，**HiPER** (Peng et al., 2026) 通过子任务分解计算轨迹片段的回报，**GiGPO** (Feng et al., 2026) 通过识别重复锚点状态构建步骤优势，**R3L** (Shi et al., 2026) 和 **GVPO** (Zhang et al., 2026c) 则利用失败反思或代码执行反馈来分配信用。尽管这些方法在一定程度上丰富了信号，但它们存在两个关键不足：一是**依赖人工设计或启发式规则**（如子任务分解、锚点识别），这限制了其在不同任务设置下的通用性（generality）；二是**未能有效利用成功轨迹内部的异质性**。大多数方法要么关注失败案例的反思，要么依赖复杂的验证器（verifier models），而忽略了在成功轨迹中，交互长度和推理长度本身就是衡量规划效率的天然且低成本信号。\n\n此外，虽然有一些工作涉及长度相关的奖励塑形（length-based reward shaping），如 **DAPO** (Yu et al., 2026) 中的过长响应塑形，但这些方法通常是**无条件**的或基于全局统计的。本文指出，无条件的长度最小化会导致模型退化（degenerate），产生过短但错误的响应，甚至扭曲 LLM 的表示空间。因此，前人工作未能解决的核心矛盾是：如何在**不引入额外模型成本**且**避免无条件长度惩罚**的前提下，从成功轨迹中自动提取出反映规划效率的细粒度优势信号。PlanPO 的创新之处在于提出了“成功条件化”（success-conditioned）的长度归一化优势，仅在成功轨迹组内比较长度，从而既保留了长度作为效率代理变量的有效性，又避免了盲目缩短响应带来的性能下降。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Multi-Turn Agentic LLMs 的训练中，Group Relative Policy Optimization (GRPO) 等无 Critic 方法因其低内存开销和高效性成为主流。然而，研究者观察到 GRPO 存在一个显著的瓶颈：**Advantage Collapse**。在同一个 Task 的 Group 采样中，只要 Trajectory 最终成功（Success），无论其交互过程是“一步到位”还是“反复试错、绕远路”，它们获得的 Outcome Reward 都是相同的（例如均为 10）。这导致模型无法区分“高质量规划”与“低质量但侥幸成功”的 Trajectory，从而限制了 Agent 学习高效、通用规划能力的能力。\n\n为了解决这个问题，早期的尝试包括引入 Value Model (Critic) 或 Process Reward Model (PRM) 来提供 Turn-level 的细粒度反馈。但这些方法引入了巨大的计算开销和潜在的估计偏差（Estimation Bias）。另一种思路是设计复杂的启发式规则（如 HiPER 的子任务分解或 GiGPO 的状态锚点），但这缺乏通用性，难以跨 Task 迁移。\n\n此时，研究者注意到一个被忽视的、天然存在的信号：**Length**。在成功的 Trajectory 中，较短的交互轮数（Trajectory Length）和较简洁的推理文本（Response Length）通常暗示着更优的规划能力和更少的冗余思考。然而，直接对 Length 进行 Reward Shaping（如惩罚长序列）是危险的，因为这会导致模型退化（Degenerate）为单纯的“长度最小化”，甚至产生逻辑错误但极短的无效回答。\n\n关键的洞察在于：**长度本身不是绝对的好坏指标，只有在“成功”的前提下，长度才具有区分优劣的意义。** 因此，思考路径转向了“条件化”的长度利用。既然 GRPO 的核心优势在于 Group 内的相对比较，那么是否可以在 Group 内部，仅针对那些成功的 Trajectory，利用 Length 信息来重新校准 Advantage？这样既保留了 GRPO 无 Critic 的高效性，又通过 Length 引入了细粒度的区分度，同时通过“仅对成功样本操作”避免了长度最小化的陷阱。这就自然导向了 PlanPO 的核心设计：基于成功条件的、多尺度（Trajectory-level
