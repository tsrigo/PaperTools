略，特别是其是否表现出“验证惯性”（verification inertia），即在检索到部分真实证据后，因遇到流畅的直接答案而提前停止搜索和推理。\n\n这一问题的重要性在于，现有的 Deep Research Agents 评测主要关注信息获取能力（如能否找到事实），而忽视了在噪声环境下的证据甄别与冲突解决能力。在金融分析、合规审查等高 stakes 场景中，用户依赖 Agent 的综合结论而非逐条阅读源文件。如果 Agent 将未经核实的摘要或过时报告视为充分证据，即使底层真实记录可用，也会输出自信但错误的结论。这种失败模式不同于简单的检索失败，它揭示了 Agent 在证据充分性判断上的系统性缺陷。解决这一问题对于提升 Agent 在真实开放网络中的可靠性至关重要，因为真实环境中充斥着冗余、过时或故意误导的信息，可靠的深度研究不仅需要检索和引用，更需要主动调和直接主张与底层记录之间的矛盾。\n\n### § 2 前人工作与不足\n\n该问题此前并未被充分解决，现有相关工作存在明显的评测缺口和方法论局限。\n\n首先，现有的搜索 Agent 基准测试（如 GAIA, BrowseComp, WebWalker, InteractComp）主要评估 Agent 在长 horizon 下的信息获取能力、工具使用或多步推理能力。这些基准假设环境中的证据是可靠或可获取的，重点在于 Agent 能否找到所需信息，而未隔离评估当环境中存在直接冲突的误导性文档时，Agent 的证据使用策略（evidence-use policy）如何变化。因此，它们无法揭示 Agent 在拥有正确证据的情况下，为何仍会采纳错误捷径。\n\n其次，事实核查（Fact Verification）、知识冲突（Knowledge Conflicts）和语料投毒（Corpus Poisoning）研究（如 FEVER, PoisonedRAG）虽然涉及不可靠证据，但其设定与本文不同。这些研究通常评估给定 claim 或固定检索上下文下的模型表现，或者通过注入大量对抗性样本来测试鲁棒性。它们未能隔离自主研究 Agent 在固定任务和固定真实记录下，仅因单个看似普通的误导性文档加入而产生的行为变化。此外，这些工作往往关注模型是否被“欺骗”，而未深入分析 Agent 是未能检索到证据，还是检索到了证据却因“验证惯性”而停止推理。\n\n最后，现有的自我修正（Self-Correction）和归因（Attribution）研究（如 Self-RAG, Reflexion）主要关注生成后的引用质量或推理链的自我反思，但研究表明 LLM 在没有外部信号的情况下难以自我纠正推理错误。DRNOISE 指出的不足在于，现有评测缺乏对 Agent 在检索过程中“何时停止”以及“视何物为充分证据”的细粒度诊断。之前的工作未考虑在 Agent 已展示解决能力（clean condition 下正确）的前提下，误导性文档如何导致其能力部署（capability deployment）失败，即 Agent 并非缺乏能力，而是缺乏在噪声环境中持续验证直接主张的机制。", "core_insight": "### § 3 重建作者的思考路径\n\n现有的 Deep Research Agent 评估体系存在一个显著的盲区：它们要么关注信息获取的广度与深度（如 GAIA, BrowseComp），要么关注静态上下文下的事实核查（如 FEVER, RAG-robustness）。然而，在真实的开放网络环境中，Agent 面临的挑战并非仅仅是“找不到”信息，而是“如何甄别”信息。现有的 Benchmark 往往假设检索到的上下文是固定的，或者攻击是显式的（如 Corpus Poisoning），这忽略了 Agent 在自主搜索过程中动态决策的关键环节。\n\n观察发现，人类分析师在面对一份看似权威的“Executive Summary”或“Dashboard”时，会将其视为一个待验证的 Claim，并回溯到底层记录（Records）进行交叉验证。然而，当前的 LLM Agent 表现出一种“验证惰性”（Verification Inertia）：当检索结果中出现一个直接给出答案的文档（Answer-like document）时，Agent 倾向于将其视为充分证据并停止搜索，即使该文档与底层记录冲突。这种失败模式不同于简单的检索失败或推理错误，它是一种策略性的过早停止（Premature Stopping）。\n\n为了隔离并量化这一现象，我们需要一个受控的实验环境。在这个环境中，必须保证底层证据链（Evidence Chains）是完整且足以推导出正确答案的，同时引入一个看似合理但直接给出错误答案的干扰文档。通过对比“干净环境”（Clean Condition）和“噪声环境”（Noisy Condition）下 Agent 的表现，特别是那些在干净环境中能正确解题的 Agent 在噪声环境中的表现，我们可以精确测量 Agent 对误导性证据的“条件顺从”（Conditional Deference）。这种设计能够揭示 Agent 是否真正具备基于记录重构答案的能力，还是仅仅依赖于表面上的直接陈述。因此，DRNOISE 的核心动机在于填补“能力”与“部署”之间的差距，即 Agent 拥有推理能力，但在面对便捷的误导性捷径时未能有效部署该能力。\n\n### § 4 核心 Intuition\n\nDeep Research Agent 的核心缺陷不在于缺乏检索或推理能力，而在于缺乏对“直接陈述”与“底层证据”之间冲突的主动调和机制。当环境中存在一个看似权威且直接给出答案的误导性文档时，Agent 往往将其视为搜索终止的信号，从而陷入“验证惰性”，放弃了对底层记录链的完整重构。DRNOISE 通过构造“间接证据链支持真值”与“直接文档支持假值”的受控冲突，揭示了 Agent 在面临认知捷径时的系统性失效，证明了可靠的深度研究需要超越简单的检索与引用，必须具备主动质疑并验证直接主张的能力。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nDRNOISE 并非提出一种新的 Agent 架构或算法，而是一个用于评估 Deep Research Agents 在误导性证据环境下表现能力的基准测试（Benchmark）。其核心方法论在于构建一个受控的“干净（Clean）”与“噪声（Noisy）”配对环境，以隔离并测量 Agent 的 **Verification Inertia**（验证惯性）和 **Conditional Deference**（条件性顺从）。\n\n以下是基于论文中 Table 1 和 Figure 2 的具体 Pipeline 讲解：\n\n**1. 任务构建与数据准备 (Task Construction)**\n*   **输入定义**：每个任务包含一个问题 $q$、一个黄金答案 $a^*$、一个指定的错误答案 $\\tilde{a}$、两条间接证据链 $E_A$ 和 $E_B$，以及一个直接陈述错误答案的虚假文档 $F$。\n*   **证据设计**：\n    *   **间接证据链 ($E_A, E_B$)**：由多个底层记录（如供应商目录、认证过期表、发货日志、付款记录等）组成。没有任何单一文档直接给出答案，Agent 必须通过多跳推理（Multi-hop reasoning）和交叉验证（Cross-verification）才能推导出 $a^*$。\n    *   **虚假文档 ($F$)**：在 Noisy 条件下加入。它看起来像普通的业务摘要或新闻报道，直接陈述了错误答案 $\\tilde{a}$，且与底层记录冲突。\n\n**2. 实验环境设置 (Environment Setup)**\n*   **Clean Condition**：Agent 只能访问背景语料库和间接证据链 $E_A, E_B$。\n*   **Noisy Condition**：Agent 访问相同的背景语料库、$E_A, E_B$，**额外**包含文档 $F$。\n*   **Agent Harness**：使用统一的搜索代理框架（如 BrowseComp-Plus），配备 ReAct 风格的搜索工具，限制最大迭代次数和检索片段长度，确保不同模型在相同工具协议下运行。\n\n**3. 推理与检索过程 (Reasoning \u0026 Retrieval Pipeline)**\n以 Table 1 中的“供应商选择”任务为例：\n*   **问题**：“哪家供应商在 2024 年 3 月 31 日持有有效的安全认证，并且按时交付了所有三批 3 月份的货物？”\n*   **Agent 行为 (Clean)**：\n    1.  检索“批准供应商目录”，找到候选供应商列表。\n    2.  检索“认证过期表”，筛选出持有有效认证的供应商。\n    3.  检索“发货计划/到达记录”，检查按时交付情况。\n    4.  交叉比对两条独立证据链（如应付账款记录），确认唯一满足所有条件的供应商是 **Brindle Components** ($a^*$)。\n*   **Agent 行为 (Noisy)**：\n    1.  检索时，由于文档 $F$（一篇贸易出版物评论）直接包含关键词和看似完整的答案，Agent 可能优先检索到 $F$。\n    2.  文档 $F$ 声称 **Orison Fabrication** ($\\tilde{a}$) 满足所有条件。\n    3.  **关键分歧点**：Agent 是否停止搜索并采纳 $F$ 的结论？还是继续检索底层记录进行验证？\n    4.  实验发现，大多数 Agent 在此处表现出 **Premature Stopping**（过早停止），直接采纳 $F$ 中的错误答案，即使底层记录 $E_A, E_B$ 仍然可被检索到。\n\n**4. 评估与输出 (Evaluation \u0026 Output)**\n*   **输出**：Agent 提交的最终答案。\n*   **指标计算**：\n    *   **Clean Accuracy**：在 Clean 条件下答对的比例。\n    *   **Noisy Accuracy**：在 Noisy 条件下答对的比例。\n    *   **Conditional Deference**：在 Clean 条件下答对的题目中，在 Noisy 条件下转而回答错误答案 $\\tilde{a}$ 的比例。这是衡量 Agent 对误导性证据顺从程度的核心指标。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有提出新的理论模型或复杂的数学推导，其核心贡献在于实验设计和统计分析。因此，本节跳过形式化数学推导，但简要说明其核心统计指标的直觉含义，以便理解实验结论。\n\n**核心指标直觉：**\n\n1.  **Conditional Deference (条件性顺从)**：\n    *   **公式**：$Defer(m) = \\frac{|C_m \\cap D_m|}{|C_m|}$\n    *   **直觉**：这个指标排除了那些本来就不会做的题目。它只关注那些 Agent 在干净环境下**有能力**做对的题目（$C_m$）。如果加入一个误导性文档后，Agent 在这些题目上改选了错误答案（$D_m$），说明 Agent 不是“不会做”，而是“被误导了”。这揭示了 **Capability-Deployment Gap**（能力-部署差距）：Agent 拥有推理能力，但在面对看似便捷的错误答案时，未能部署这种能力去验证。\n\n2.  **Accuracy Drop (准确率下降)**：\n    *   **直觉**：$CleanAcc - NoisyAcc$。衡量误导性证据对整体性能的破坏程度。论文发现，即使 Clean Accuracy 很高（如 96%），加入一个误导性文档后，Noisy Accuracy 可能暴跌至 1%，下降幅度高达 66-88 个百分点。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 提出了什么问题？**\n现有的 Deep Research Agent 基准测试主要评估信息获取能力（能否找到信息），但缺乏对 **Evidence Use Policy**（证据使用策略）的评估。具体而言，当环境中存在一个看似合理但错误的直接答案（Misleading Evidence）时，Agent 是否会放弃对底层记录的验证，转而顺从（Deference）这个错误答案？这种失败是源于检索失败，还是源于验证惯性（Verification Inertia）？\n\n**2. 设计了什么实验验证这个问题？**\n*   **DRNOISE Benchmark**：构建了 100 个任务，涵盖 10 种推理家族（如实体选择、日期选择、布尔验证等）。每个任务都有两条独立的间接证据链支持唯一正确答案，并在 Noisy 条件下加入一个直接陈述错误答案的文档。\n*   **配对实验 (Paired Intervention)**：对同一组任务，分别在 Clean 和 Noisy 条件下运行 5 种主流 LLM（Gemini, DeepSeek, GPT-5.4, MiMo, Qwen3）。\n*   **消融与机制分析 (Ablation \u0026 Mechanism Analysis)**：\n    *   **检索暴露分析**：检查 Agent 是否检索到了真实证据。\n    *   **提示词干预**：添加通用验证提示（Generic Verification Prompt）或攻击感知提示（Attack-aware Prompt），观察是否能缓解顺从行为。\n    *   **来源可信度测试**：改变虚假文档的来源（论坛帖子 vs. 审计报告），测试顺从行为是否仅由来源权威性驱动。\n    *   **检索器替换**：使用 BM25 替换 Dense Retrieval，排除检索器偏差。\n    *   **直接真实证据测试**：加入一个直接陈述正确答案的文档，测试 Agent 在直接冲突下的表现。\n    *   **Oracle 全上下文测试**：将所有证据直接放入 Context，绕过检索，测试 Agent 的纯推理/调和能力。\n\n**3. 问题的答案是什么？**\n*   **主要结论**：误导性证据导致 Agent 准确率大幅下降（66-88 个百分点），且这种失败主要发生在那些在 Clean 条件下能答对的题目上，揭示了严重的 **Capability-Deployment Gap**。\n*   **失败机制**：主导失败模式是 **Premature Stopping**（过早停止）和 **Verification Inertia**（验证惯性）。Agent 通常检索到了真实证据，但在遇到看似完整的答案文档时停止搜索，未能完成证据链的调和（Reconciliation）。\n*   **干预效果**：\n    *   通用验证提示只能部分缓解问题，无法消除差距。\n    *   攻击感知提示（明确告知不信任摘要）能显著恢复性能，证明 Agent **具备**调和冲突的能力，只是默认策略未激活。\n    *   来源可信度对顺从行为有影响，但即使低可信度来源（论坛帖子）也能误导多数 Agent，说明问题不仅是盲从权威。\n    *   即使提供直接的真实证据，Agent 仍会在约 1/3 的情况下顺从错误答案，表明 **Direct Conflict Resolution**（直接冲突解决）能力依然薄弱。\n*   **最终启示**：可靠的 Deep Research 不仅需要检索和引用，更需要主动将直接声明与记录级证据进行调和。当前的 Agent 架构在证据使用策略上存在系统性缺陷。", "additional_insights": "### § 8 Take-aways\n\nDRNOISE 揭示了当前 Deep Research Agents 存在严重的 **Verification Inertia**（验证惰性），即 Agent 倾向于将看似权威的 **Answer-like Document**（如摘要、报告）视为充分证据，而停止对底层 **Record-level Evidence**（如日志、账本）进行交叉验证。实验表明，在 Clean 环境下表现优异的 Agent（如 Gemini 3.5 Flash, DeepSeek V4 Flash），一旦环境中注入单一误导性文档，其准确率会暴跌 66–88 个百分点，且这种失败主要源于 **Premature Stopping**（过早停止搜索）而非检索能力缺失。通过 **Conditional Deference**（条件顺从率）指标分析发现，Agent 在 Clean 条件下能正确解答的任务中，有高达 72–98% 在 Noisy 条件下直接采纳了错误答案，证明了这是一种 **Capability-Deployment Gap**（能力部署差距），即模型具备推理能力但缺乏在冲突证据中坚持验证的策略。进一步的消融实验证实，这种顺从行为并非完全由来源权威性驱动（低可信度论坛帖子仍导致 54% 的顺从），也不是 Dense Retrieval 的特定缺陷（BM25 检索下顺从率甚至升至 100%）。即使提供完整的证据上下文（Oracle Full-Context），Agent 仍存在少量 **Reconciliation Failure**（协调失败），但主要瓶颈在于 Agentic 搜索过程中的证据链构建中断，而非单纯的逻辑推理错误。\n\n### § 9 最脆弱的假设\n\n该研究最核心的假设是：**构造的、风格化的“普通商业文档”（Ordinary-looking Business Documents）能够充分模拟真实开放网络中误导性证据的分布特征和认知欺骗性。** 如果这一假设不成立，即真实 Web 中的误导性信息在语义结构、来源多样性或对抗性上远超 DRNOISE 中的合成文档，那么论文得出的“验证惰性”结论可能仅适用于受控环境，无法推广到实际部署场景。\n\n**不成立的原因：** 真实 Web 环境包含复杂的 **Distributional Shift**（分布偏移），例如 SEO 优化的垃圾内容、高度专业化的行业黑话、或带有明确对抗意图的 **Corpus Poisoning**（语料投毒）。DRNOISE 中的虚假文档是人工精心构造的“普通”摘要，缺乏真实网络中噪声的随机性和多样性。此外，真实场景中的 **Source Credibility**（来源可信度）信号远比论文中简单的“论坛 vs 审计报告”二分法复杂，Agent 可能依赖更细微的元数据或链接结构线索，而这些在合成数据中可能被简化或忽略。\n\n**论文提供的证据与缺失：** 论文在 Limitations 部分承认使用了 **Constructed Corpus**（构造语料库）而非实时爬取数据，并指出这可能导致无法捕捉真实 Web 的 **Stylistic and Institutional Complexity**（风格与机构复杂性）。然而，论文并未提供在真实 Web 子集（如特定新闻聚合器或行业论坛）上的验证实验，也未分析 Agent 对真实世界中 **Outdated Reports**（过时报告）或 **Speculative Write-ups**（推测性文章）的反应。因此，缺乏证据表明 DRNOISE 中的失败模式在真实、高噪声、非受控的 Web 环境中具有相同的普遍性和严重程度。\n\n### § 10 最小复现实验\n\n**目标：** 验证 **Premature Stopping**（过早停止）是否是导致 Agent 在误导性证据下失败的主要机制，而非检索失败或逻辑错误。\n\n**数据：** 使用 DRNOISE 公开数据集中的 10-20 个典型任务实例（包含 Clean 和 Noisy 两种语料库）。\n\n**实现：**\n1.  部署一个标准的 **ReAct-style Agent**（如使用 LangChain 或 LlamaIndex 框架），接入一个固定的 LLM（如 GPT-4o 或 Claude 3.5 Sonnet）。\n2.  实现一个 **Trace Logger**，记录 Agent 在每一步搜索中检索到的文档 ID、阅读顺序以及最终停止搜索的触发条件（如达到最大迭代次数、或 Agent 自行决定输出答案）。\n3.  设计一个 **Oracle Intervention**（神谕干预）：在 Agent 的搜索过程中，如果它检索到了至少一条指向正确答案的 **Indirect Record**（间接记录），则强制注入一条提示：“你已找到支持答案 X 的证据，请继续验证是否有冲突证据。”\n\n**测量：**\n1.  **Baseline Noisy Accuracy**：在标准 Noisy 条件下的准确率。\n2.  **Trace Analysis**：统计在 Baseline 失败案例中，Agent 是否检索到了任何 **Truth-supporting Records**（支持真相的记录）。\n3.  **Intervention Accuracy**：在 Oracle Intervention 下的准确率。\n\n**结果判定：**\n*   **支持 Claim**：如果 Baseline 失败案例中，绝大多数（\u003E80%）Agent 都检索到了至少一条 Truth-supporting Record，但在 Oracle Intervention 下准确率显著提升（例如从 \u003C20% 提升至 \u003E60%），则证明失败主因是 **Premature Stopping** 和缺乏主动验证，而非无法获取证据。\n*   **反驳 Claim**：如果 Baseline 失败案例中，Agent 很少检索到 Truth-supporting Record，或者 Oracle Intervention 对准确率提升微乎其微，则说明失败主要源于 **Retrieval Exposure Failure**（检索暴露失败）或深层的 **Reasoning Deficit**（推理缺陷），而非简单的验证惰性。", "research_value": "### § 11 最强反例设计\n\n若要挑战 DRNOISE 的核心结论，最有力的反例设计应聚焦于**“生态效度缺失导致的虚假因果归因”**，即证明 Agent 的失败并非源于内在的 **Verification Inertia**（验证惯性），而是源于合成数据与真实 Web 在**信息密度**和**检索信号**上的结构性差异。\n\n具体而言，可以设计一个**“真实噪声注入实验”（Real-World Noise Injection Experiment）**。DRNOISE 的虚假文档 $F$ 是人工构造的、语义高度聚焦且与问题关键词完美匹配的“普通商业文档”。然而，在真实开放网络中，误导性信息往往伴随着低质量的 SEO 垃圾内容、破碎的 HTML 结构或极低的页面权威性信号。反例实验应选取 DRNOISE 中的同一组任务，但将虚假文档 $F$ 替换为从真实 Web 中爬取的、具有相同错误主张但保留原始网页噪声（如广告、无关侧边栏、低可信度域名）的文档。\n\n**攻击逻辑如下：**\n1.  **替代解释（Retrieval Signal Bias）**：如果 Agent 在 DRNOISE 中失败，是因为 $F$ 在 **Dense Retrieval** 或 **BM25** 中获得了异常高的相关性分数（因为它是人工优化的“完美匹配”），而在真实噪声文档中，由于信号杂乱，Agent 的检索器可能根本不会优先返回该文档，或者 Agent 的 **Source Credibility Heuristics**（来源可信度启发式规则）会因域名或页面结构而自动降权。\n2.  **预测性失败条件**：如果替换为真实噪声文档后，Agent 的 **Noisy Accuracy** 显著回升（例如从 1% 恢复到 80%），则证明 DRNOISE 测量的不是“验证惰性”，而是“对高相关性但低质量信号的过度敏感”。这表明 Agent 具备区分能力，只是 DRNOISE 的构造环境人为消除了所有区分线索（如元数据、链接结构），迫使 Agent 仅依赖文本内容，从而制造了“能力部署差距”的假象。\n3.  **理论论证**：DRNOISE 假设 **Evidence Use Policy** 是独立于 **Retrieval Policy** 的。然而，在 Agentic 系统中，两者是耦合的。如果检索器无法提供足够的 **Discriminative Signal**（判别信号）来区分“权威记录”和“误导性摘要”，Agent 的“过早停止”是一种理性的资源优化策略（Rational Stopping），而非认知缺陷。因此，DRNOISE 的结论仅在“检索器完全失效且所有文档表面特征一致”的极端假设下成立，缺乏对真实 Web 复杂性的泛化能力。\n\n### § 12 Follow-up Research Idea\n\n基于 DRNOISE 揭示的 **Capability-Deployment Gap** 及其在真实环境泛化上的局限，提出一个新的研究方向：**“动态证据置信度校准与主动验证规划”（Dynamic Evidence Confidence Calibration and Active Verification Planning）**。\n\n**(a) 驱动局限与未满足需求：**\nDRNOISE 表明，静态的 **Verification Prompt** 无法解决 **Verification Inertia**，因为 Agent 缺乏对当前证据充分性的**元认知（Metacognition）**。现有 Agent 将“找到答案”视为终止条件，而忽略了“答案的可证伪性”。真实场景中，Agent 需要判断：当前证据是“强信号”（如原始日志）还是“弱信号”（如二手摘要）？如果信号弱，是否值得投入额外的计算资源进行交叉验证？目前缺乏一种机制让 Agent 在检索过程中动态评估证据的**信息熵**和**冲突风险**，从而决定是继续搜索还是停止。\n\n**(b) 借鉴相邻领域：**\n借鉴**主动学习（Active Learning）**中的**不确定性采样（Uncertainty Sampling）**和**贝叶斯实验设计（Bayesian Experimental Design）**。在主动学习中，模型选择那些能最大程度减少后验不确定性的样本进行标注。类似地，Agent 可以将“验证”视为一种实验：检索一条底层记录（如发货日志）是为了减少关于“供应商是否按时交付”这一假设的不确定性。我们可以引入**信息增益（Information Gain）**作为 Agent 的内在奖励信号，而不仅仅是最终答案的正确性。\n\n**(c) 第一个实验设计：**\n构建一个**“验证价值感知 Agent”（Verification-Value-Aware Agent, VVA-Agent）**框架。\n1.  **置信度模块**：在 Agent 的每一步检索后，增加一个轻量级的 **Confidence Estimator**，评估当前已收集证据对最终答案的支持强度（例如，基于证据来源的权威性、证据的直接性、以及是否存在潜在冲突）。\n2.  **验证规划器**：引入一个 **Verification Planner**，基于当前置信度计算“继续搜索的预期信息增益”。如果置信度低于阈值且预期增益高，Planner 强制生成针对特定冲突点的验证查询（如“查找供应商 X 的 3 月发货记录”），而非泛泛的搜索。\n3.  **对比实验**：在 DRNOISE 基准上，对比标准 ReAct Agent、带静态验证提示的 Agent 和 VVA-Agent。\n4.  **关键指标**：除了准确率，重点测量 **Verification Efficiency**（验证效率），即 Agent 在达到高置信度所需的最小检索步数。预期结果是，VVA-Agent 不仅能显著降低 **Conditional Deference**，还能在 Clean 条件下通过更早停止（当证据已充分时）来节省计算资源，从而证明其具备真正的**证据充分性判断能力**，而非单纯的机械验证。\n\n这一方向将研究重心从“检测误导性证据”转移到“构建自适应的证据评估与验证策略”，解决了 DRNOISE 指出的系统性缺陷，并提供了可操作的架构改进路径。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Jun Nie\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Zhiqin Yang\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Zhenheng Tang\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yonggang Zhang\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xiaowen Chu\",\n      \"affiliations\": [\n        3\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xinmei Tian\",\n      \"affiliations\": [\n        2\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Bo Han\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Hong Kong Baptist University\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"University of Science and Technology of China\"\n    },\n    {\n      \"id\": 3,\n      \"name\": \"The Hong Kong University of Science and Technology\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Equal contribution.\"\n    }\n  ]\n}\n```", "summary_translation": "深度研究代理越来越多地在开放网络上运行，其中相关记录与冗余摘要、过时报告和误导性文档共存。现有的评估对于当看似普通的虚假文档被故意植入可搜索环境并提供通往冲突答案的直接捷径时，代理是否能保持合理的证据标准，提供的见解有限。我们引入了 DRNOISE，这是一个用于在误导性证据下进行答案恢复的 100 个任务基准。每个任务都有一个独特的黄金答案，由两条相互印证的间接记录链支持；配对的噪声条件增加了一份陈述冲突答案的合理文档。该基准涵盖十类证据操作。在具有强大干净任务性能的代理中，这一单一干预导致准确率下降 66-88 个百分点。轨迹分析将验证惯性确定为主要的失败模式：代理经常检索到真实记录，但在完成和协调证据链之前停止，转而依赖看似答案的文档。通用的验证提示减少了但未完全消除这一差距。该设置特别适用于开放网络部署，其中合理的虚假内容通过看似普通的页面而非显式攻击出现。因此，可靠的深度研究不仅需要检索和引用，还需要主动协调直接声明与记录级证据。"}, {"title": "SlotGuard: Stop Oversharing Private Local Context in LLM Agent Transcri", "arxiv_id": "2607.17147", "authors": "Haocheng Xia, Yongjoo Park", "summary": "LLM agents can leak privacy (e.g., paths, emails) and credentials (e.g., API keys) as agent observations (e.g., tool outputs, shell logs, and file reads) are appended to provider-bound transcripts. Existing placeholder redaction is brittle: it can miss embedded or cross-turn references, over-redact benign lookalikes, and destroy the structure useful for reasoning. We present SlotGuard, a local transcript boundary that can hide sensitive data while retaining agents' performance. SlotGuard rewrites structural bindings as typed, suffix-aware slots, replaces secrets with format-preserving synthetic values, links cross-turn references with a lightweight session graph, and restores raw values only inside the trusted runtime. On controlled repository-oriented agent transcripts, SlotGuard removes all 20,814 annotated structurally sensitive characters across 9,229 paths and reduces credential leakage to 0.0\\% across 852 planted values. It remains close to raw-transcript task success across four upstream models, while generic redaction drops to 2.5\\%. Transcript rewriting takes a median of 14.424~$μ$s per agent turn. The code is publicly accessible at https://github.com/illinoisdata/SlotGuard.", "category": "cs.CL", "cluster": "Evaluation, Benchmarking \u0026 Security", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (LLM Agents, Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\nLLM Agent 在执行开发、自动化或数据分析任务时，会通过工具调用（Tool Calling）产生大量包含敏感信息的观察结果（Observations），如文件路径、Shell 日志、环境变量及 API 密钥等。这些观察结果会被追加到发送给上游模型提供商（Model Provider）的 Transcript 中，从而突破本地信任边界（Local Trust Boundary），导致隐私泄露或凭证暴露。现有的隐私保护机制主要存在两个核心缺陷：一是基于正则或简单规则的占位符替换（Placeholder Redaction）过于脆弱，容易遗漏嵌入在 Shell 参数扩展、进程列表或跨轮次引用中的敏感数据；二是这种替换往往破坏了 Agent 执行任务所需的结构信息（如路径层级、文件扩展名、URI 语法），导致模型无法正确推理或生成有效的工具调用，造成“隐私保护”与“任务效用”之间的零和博弈。\n\n该问题的重要性在于，随着 Agent 深入企业级工作流，Transcript 中不可避免地包含高价值敏感数据。若直接上传，不仅违反数据合规要求，还可能因提供商的缓存、日志记录或模型训练策略导致数据永久泄露。若采用强红acted（Redaction），Agent 的性能会急剧下降（如通用红acted 导致任务成功率降至 2.5%）。因此，亟需一种能在本地边界（Local Boundary）实现“兼容性保持”（Compatibility-preserving）的隐私保护机制，即在彻底隐藏原始敏感值的同时，保留足够的结构信号（Structural Signals）供模型进行逻辑推理和工具执行。解决这一问题能实现零泄露（Zero Leakage）与高任务成功率（High Task Success）的共存，使 Agent 能够在不牺牲性能的前提下安全地利用云端大模型能力，同时确保本地敏感数据不出域。\n\n### § 2 前人工作与不足\n\n该问题此前主要通过插件级红acted（Plugin-level Redaction）、网络级代理（Network-level Proxies）以及通用 PII 检测系统（如 Microsoft Presidio）进行尝试，但这些方法在 Agent 场景下均存在显著不足。\n\n首先，以 Open-VibeGuard 为代表的插件级红acted 系统依赖正则表达式匹配已知模式（如 SSN、Email），并将匹配项替换为静态占位符（如 `__VG_SSN_xxx__`）。这种方法的主要局限在于其“结构性脆弱性”（Structural Brittleness）：它无法处理嵌入在复杂上下文中的敏感数据，例如 Shell 命令中的参数扩展（`${VAR:-value}`）、多行配置片段或跨轮次的间接引用。此外，静态占位符破坏了原始数据的语法结构，导致模型生成的命令或 URI 不再符合预期语法，从而引发执行失败。\n\n其次，网络级代理（如基于 HTTPS 的中间件）虽然能覆盖多个客户端，但其视角局限于序列化后的 Provider 请求，缺乏对 Agent 内部结构（如 Tool Call、Tool Output、本地作用域）的理解。因此，网络代理难以执行基于作用域的路径验证（Scope-aware Path Validation），也无法在受信任的本地运行时中安全地重新绑定（Rebind）受保护的句柄，导致其无法支持需要本地执行上下文的任务。\n\n最后，通用 PII 检测系统（如 Presidio）旨在进行文本匿名化，而非执行边界保护。它们通常将实体替换为标签或匿名值，忽略了 Agent 对“执行相关结构”（Execution-relevant Structure）的依赖，如路径形状、文件扩展名和凭证格式。在 Agent 场景中，模型需要识别“这是一个 Python 文件”或“这是一个数据库 URI”，而不仅仅是“这是一个敏感实体”。现有方法未能将 Transcript 重写视为执行边界的一部分，导致在保护隐私的同时严重损害了 Agent 的工具使用能力。SlotGuard 通过引入类型化结构槽（Typed Structural Slots）、格式保持合成替换（Format-preserving Synthetic Substitution, FPS）以及语义实体图（Semantic Entity Graph, SEG），系统性地解决了上述方法在结构保留、跨轮次追踪和本地安全重绑定方面的不足。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM Agent 普及的背景下，开发者面临一个严峻的隐私悖论：Agent 需要通过工具调用（Tool Calling）访问本地文件系统、Shell 和环境变量以完成任务，而这些操作产生的观察结果（Observations）——如文件路径、Shell 日志、进程列表——会被自动追加到发送给云端模型提供商的 Transcript 中。现有的隐私保护方案主要分为两类，但均存在显著缺陷。第一类是传统的 PII 检测与匿名化系统（如 Microsoft Presidio），它们通常采用简单的替换策略（如将路径替换为 `[PATH]` 或将密钥替换为 `[API_KEY]`）。这种“通用红acted”（Generic Redaction）虽然能隐藏原始值，但破坏了 Agent 执行任务所需的结构信息（Structural Information）。LLM 依赖路径后缀（如 `.py`）、URI 语法和凭证格式来生成有效的工具调用参数，一旦这些结构被抹去，Agent 的 Task Success Rate 会急剧下降，甚至导致工具调用失败。第二类是基于规则或轻量级模型的占位符替换（如 VibeGuard），它们尝试保留类型信息，但往往过于脆弱（Brittle）。它们难以处理嵌入在 Shell 参数扩展、进程列表或跨轮次引用中的敏感数据，且容易误伤良性相似字符串，或者因为占位符的高熵特性导致模型推理效率降低。\n\n此外，现有的解决方案大多缺乏对“本地信任边界”（Local Trust Boundary）的严格界定。它们往往只是单向地清洗数据，而没有建立从云端响应到本地执行的闭环验证机制。这意味着如果模型在响应中生成了伪造的占位符或尝试路径遍历攻击，本地运行时可能无法有效拦截。作者意识到，要解决这个问题，不能仅仅依赖“检测-替换”的静态模式，而需要构建一个动态的、会话级（Session-scoped）的边界层。这个边界层必须同时满足两个看似矛盾的目标：一是彻底消除敏感数据的泄露（包括结构绑定和秘密值），二是保持 Transcript 对 LLM 而言的“可执行性”（Executability）。这要求替换后的占位符不仅要稳定，还要在语法和格式上与原值保持同构（Format-preserving），以便模型能像处理原始数据一样进行推理。同时，必须引入一个轻量级的语义实体图（Semantic Entity Graph, SEG）来追踪跨轮次的引用关系，确保即使敏感数据以变体形式出现也能被识别。最终，作者推导出 SlotGuard 的核心架构：在本地运行时与云端提供商之间插入一个中间层，利用类型感知的槽位（Typed Slots）和格式保持的合成值（Format-preserving Synthetic values）进行双向转换，并在本地受信任环境中进行受控的重新绑定（Guarded Rebinding），从而在保护隐私的同时维持 Agent 的工作流兼容性。\n\n### § 4 核心 Intuition\n\nSlotGuard 的核心直觉在于，隐私保护不应以牺牲 Agent 的“执行结构”为代价，而应通过**格式保持的合成替换**（Format-preserving Synthetic Substitution）和**类型感知的槽位抽象**（Typed Structural Abstraction）来维持数据的语法有效性。传统方法失效是因为它们用无意义的标签（如 `[SECRET]`）替换了敏感信息，破坏了 LLM 依赖的路径形状、文件扩展名和凭证语法等推理线索；而 SlotGuard 奏效的关键在于它生成的占位符在视觉上和功能上与原值同构（例如保留路径后缀和 URI 结构），使得模型无需感知隐私泄露即可正常规划工具调用。此外，通过引入**语义实体图**（Semantic Entity Graph）追踪跨轮次引用，并在本地受信任运行时进行**受控重新绑定**（Guarded Rebinding），SlotGuard 在云端 Transcript 中彻底切断了敏感数据的泄露路径，同时在本地闭环中确保了工具调用的准确性和安全性，实现了隐私与性能的兼容。", "methodology": "### § 5 具体方法与完整 Pipeline\n\nSlotGuard 的核心方法是在本地 Agent 运行时（Agent Runtime）与上游模型提供商（Upstream Provider）之间建立一个**本地转录边界（Local Transcript Boundary）**。其核心思想是“兼容性保持的隐私保护（Compatibility-preserving privacy）”，即在移除敏感原始值的同时，保留模型进行推理和工具调用所需的结构信号（如路径形状、文件扩展名、凭证语法格式）。\n\nSlotGuard 的处理流程分为两个主要阶段：**转录重写（Transcript Rewriting，上行）**和**受控重绑定（Guarded Rebinding，下行）**。\n\n**完整 Pipeline 示例：**\n\n假设一个 LLM Agent 正在执行一个任务，需要读取一个包含敏感信息的文件，并调用一个需要 API Key 的服务。\n\n1.  **输入（Input - 本地运行时观察）：**\n    Agent 执行了一个 shell 命令 `ps aux`，输出中包含一行进程信息：\n    `AZURE_OPENAI_KEY=\"${AZURE_OPENAI_KEY:-sk-1234567890abcdef}\" uv run python /Users/alice/acme/legal/layoff_bob.py`\n    这里包含两个敏感项：\n    *   **Secret Value:** API Key `sk-1234567890abcdef`\n    *   **Structural Binding:** 绝对路径 `/Users/alice/acme/legal/layoff_bob.py`\n\n2.  **处理（Processing - SlotGuard 拦截与重写）：**\n    SlotGuard 在数据发送给模型之前拦截该转录记录，执行以下操作：\n    *   **检测（Detection）：**\n        *   同步启发式引擎识别出 `AZURE_OPENAI_KEY` 赋值中的 shell 参数扩展模式，标记为 Secret。\n        *   路径解析器识别出 `/Users/alice/acme/` 为受信任的工作区根目录（Workspace Root），`legal/layoff_bob.py` 为敏感内容部分。\n    *   **结构化绑定抽象（Structural Abstraction）：**\n        *   SlotGuard 将路径重写为**类型化、后缀感知的槽位（Typed, Suffix-aware Slots）**。\n        *   它替换最长的受信任根目录，抑制敏感中间组件，但保留任务相关的后缀。\n        *   结果：`[REPO_ROOT_1]/legal/[SENSITIVE_DOC_1].py`。这保留了 `.py` 扩展名和目录结构，让模型知道这是一个 Python 文件，但隐藏了用户 `alice` 和公司 `acme` 的信息。\n    *   **格式保持合成替换（Format-Preserving Synthetic Substitution, FPS）：**\n        *   对于 API Key，SlotGuard 不使用通用的 `API_KEY` 占位符，而是从该凭证的格式类中采样一个新鲜的合成值。\n        *   结果：`sk-0000000000000000`（假设格式为 `sk-` 后跟 16 位十六进制字符）。这个合成值在语法上有效，但没有任何原始密钥的信息。\n    *   **会话图更新（Session Graph Update）：**\n        *   SlotGuard 在本地会话槽位表（Slot Table）中记录映射关系：`[REPO_ROOT_1] -\u003E /Users/alice/acme/`，`[SENSITIVE_DOC_1] -\u003E layoff_bob`，`sk-000... -\u003E sk-123...`。\n        *   语义实体图（Semantic Entity Graph, SEG）记录这些值之间的关联，以便处理跨轮次的引用。\n\n3.  **输出（Output - 发送给模型提供商）：**\n    发送给 LLM 的转录内容变为：\n    `AZURE_OPENAI_KEY=\"${AZURE_OPENAI_KEY:-sk-0000000000000000}\" uv run python [REPO_ROOT_1]/legal/[SENSITIVE_DOC_1].py`\n    模型看到的是一个结构完整、语法正确但无敏感信息的上下文。\n\n4.  **模型响应与重绑定（Model Response \u0026 Rebinding）：**\n    *   模型返回一个工具调用，例如：`ReadFile([REPO_ROOT_1]/legal/[SENSITIVE_DOC_1].py)`。\n    *   SlotGuard 在本地运行时拦截该调用。\n    *   **受控重绑定（Guarded Rebinding）：** SlotGuard 查询槽位表，将 `[REPO_ROOT_1]` 和 `[SENSITIVE_DOC_1]` 还原为原始路径 `/Users/alice/acme/legal/layoff_bob.py`。\n    *   **安全检查：** SlotGuard 验证该路径是否在允许的作用域内，并拒绝任何路径遍历（如 `../`）或注入攻击。\n    *   **执行：** 本地运行时使用还原后的真实路径执行 `ReadFile`。原始敏感值从未离开过本地信任边界。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的理论数学推导，其核心贡献在于系统设计和工程实现。文中仅涉及少量形式化定义用于描述隐私保证和替换机制，主要基于信息论和集合映射的概念。\n\n**核心概念解释：**\n\n1.  **槽位映射（Slot Mapping）：**\n    定义了一个会话范围的槽位表 $T: V \\rightarrow H$，其中 $V$ 是受保护的原始值集合，$H$ 是上游可见的句柄（Handle）空间。\n    *   **Intuition:** 这是一个简单的字典映射。对于结构化绑定，句柄是确定性的（基于哈希和类型），确保在同一会话中相同的路径映射到相同的槽位（如 `[REPO_ROOT_1]`），但在不同会话间不可链接。\n\n2.  **格式保持合成替换（FPS）的信息论保证：**\n    文中提到：$I(\\text{FPS}(v); v | \\tau(v)) = 0$。\n    *   **公式含义：** $I(X; Y)$ 表示互信息（Mutual Information）。这里表示在给定凭证格式类型 $\\tau(v)$ 的条件下，合成值 $\\text{FPS}(v)$ 与原始值 $v$ 之间的互信息为 0。\n    *   **Intuition:** 这意味着合成值与原始值在统计上是独立的。虽然合成值看起来像原始值（例如都是 `sk-` 开头的字符串），但它不包含任何关于原始值具体字符的信息。攻击者即使知道格式，也无法从合成值推断出原始密钥。这比简单的占位符（如 `API_KEY`）更安全，因为占位符可能泄露“这里有一个 API Key”这一类别信息（Categorical Leakage），而 FPS 连类别信息都通过语法伪装隐藏了（尽管文中也指出 FPS 本身可能仍隐含格式类别，但通过 SEG 和上下文控制进一步降低风险）。\n\n3.  **语义实体图（SEG）：**\n    SEG 是一个轻量级的图结构，节点是受保护值或其代理，边表示共指（Coreference）、嵌入（Embedding）、派生（Derivation）等关系。\n    *   **Intuition:** 这不是一个数学公式，而是一个数据结构。它的作用是解决“跨轮次引用”问题。例如，如果第一轮提到了 `/Users/alice/project`，第二轮模型说“读取那个项目中的文件”，SEG 帮助 SlotGuard 识别“那个项目”指的是之前的槽位，从而正确应用保护。\n\n**结论：** 本文没有复杂的数学证明，其理论基础建立在**上下文完整性（Contextual Integrity）**和**信息流控制（Information Flow Control）**的概念上，通过工程手段实现隐私与实用性的平衡。\n\n### § 7 实验设计与结论\n\n**提出了什么问题？**\n现有的 LLM Agent 隐私保护方法（如通用脱敏、简单占位符）存在两个主要问题：\n1.  **隐私泄露：** 无法有效隐藏嵌入在 shell 命令、进程列表或跨轮次引用中的敏感信息（如路径、API Key）。\n2.  **性能下降：** 过度脱敏会破坏转录的结构（如路径形状、文件扩展名），导致模型无法正确理解上下文，从而大幅降低任务成功率。\n\n**设计了什么实验验证这个问题？**\n作者设计了三个层面的实验来验证 SlotGuard 的有效性：\n1.  **隐私泄露评估（RQ1 \u0026 RQ2）：**\n    *   **数据集：** 合成隐私语料库，包含 9,229 个路径和 852 个植入的凭证值。\n    *   **指标：** 敏感字符可见性、结构泄露率、凭证泄露率。\n    *   **对比基线：** 原始转录（Raw）、通用脱敏（Generic Redaction）、VibeGuard 风格的类型化占位符（VG-style）。\n2.  **工作流兼容性评估（RQ3）：**\n    *   **数据集：** 合成工作流探针（12 个本地任务 + 200 个多模型任务）和基于 TheAgentCompany 的 TAC-lite 重放基准（160 个任务）。\n    *   **指标：** 任务成功率（Task Success）、执行就绪率（Exec-ready Rate）、无效句柄率（Invalid Handles Rate）。\n    *   **模型：** DeepSeek-V3.2, gpt-5.4, Kimi-K2.6, Llama-3.3-70B。\n3.  **运行时开销评估（RQ4）：**\n    *   **指标：** 转录重写和重绑定的延迟（Latency）。\n\n**问题的答案是什么？**\n1.  **隐私保护：** SlotGuard 消除了所有标注的结构化泄露（0 个敏感字符可见）和凭证泄露（0.0% 泄露率），而基线方法（如 VG-style）仍有 23.5% 的凭证泄露。\n2.  **性能保持：** SlotGuard 的任务成功率接近原始转录水平（例如在 TAC-lite 上，gpt-5.4 为 92.5%，与 Raw 的 92.5% 持平；DeepSeek 为 87.5%，与 Raw 的 95.0% 差距仅 7.5 分）。相比之下，通用脱敏导致任务成功率降至 0.0%-2.5%，VG-style 占位符也仅达到 26.9%-36.9%。\n3.  **效率：** SlotGuard 的核心重写操作非常快，中位延迟仅为每轮 14.424 微秒，对 Agent 工作流的影响可忽略不计。\n\n**结论：** SlotGuard 通过类型化槽位和格式保持合成替换，成功在保护隐私的同时保持了 Agent 的工作流兼容性，解决了现有方法在隐私和性能之间的权衡难题。", "additional_insights": "### § 8 Take-aways\n\nSlotGuard 提出了一种针对 LLM Agent 的本地转录边界（local transcript boundary），旨在解决传统占位符脱敏（placeholder redaction）在保护隐私时破坏推理结构的问题。该方法将敏感数据分为两类正交表面：标识用户或环境的 **structural bindings**（如路径、主机名）和授予权限的 **secret values**（如 API 密钥）。对于 structural bindings，SlotGuard 采用类型化且感知后缀的槽位（typed, suffix-aware slots），保留路径形状和文件扩展名等执行线索；对于 secret values，则使用格式保持的合成替换（format-preserving synthetic substitution, FPS），生成符合原始语法格式但无实际意义的合成令牌。为了解决跨轮次引用和嵌入引用导致的泄露，SlotGuard 引入了轻量级的会话语义实体图（semantic entity graph, SEG）来追踪保护值及其变体。实验表明，SlotGuard 在消除所有标注的结构敏感字符和凭证泄露的同时，保持了接近原始转录的任务成功率，而通用脱敏方法导致任务成功率降至 2.5%。该系统在本地运行时执行，每次 Agent 轮次的转录重写中位延迟仅为 14.424 µs，证明了其在热路径（hot path）上的可行性。\n\n### § 9 最脆弱的假设\n\nSlotGuard 核心贡献成立的最关键假设是：**LLM 能够仅凭保留的语法结构（如路径形状、文件扩展名、凭证格式）和类型化槽位，准确推断出工具调用所需的语义意图，而无需访问原始敏感值。** 如果这一假设不成立，即模型严重依赖原始路径中的具体实体名称（如项目名、用户名）或凭证的具体前缀/后缀来进行推理或上下文关联，那么 SlotGuard 的“兼容性保持”（compatibility-preserving）特性将失效，导致任务成功率大幅下降。\n\n在实际中，这一假设可能不成立的原因在于：许多 Agent 任务涉及复杂的跨文件依赖或基于内容的推理，模型可能需要识别特定的文件名（如 `layoff_bob.pdf` 暗示的内容）或特定的配置键名来做出决策，而不仅仅是知道“这是一个 PDF”或“这是一个 API Key”。此外，如果模型训练数据中缺乏对这种抽象槽位格式的充分暴露，模型可能会将槽位视为噪声或无效输入。\n\n论文提供的证据主要基于合成数据集（synthetic privacy corpora）和基于 TheAgentCompany 的轻量级重放基准（TAC-lite replay set）。虽然结果显示 SlotGuard 在多种模型上保持了高任务成功率，但这些任务可能偏向于结构化的文件操作和工具调用，而非高度依赖语义内容的复杂推理。论文承认未在生产环境中验证自然发生的敏感数据，且未评估对抗性重构攻击，这意味着在更复杂、非结构化的真实企业场景中，模型对抽象槽位的理解能力可能不如实验所示那样鲁棒。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现并验证 SlotGuard 的核心 claim：**格式保持的合成替换（FPS）和类型化槽位比通用占位符更能保留 Agent 的任务执行能力。**\n\n**数据：** 使用论文提供的 TAC-lite 基准或构建一个小型的合成数据集，包含 50-100 个涉及文件读取、路径操作和 API 调用的 Agent 任务。确保数据中包含明显的路径结构（如 `/home/user/project/src/file.py`）和凭证（如 `sk-...`）。\n\n**实现：**\n1.  **Baseline 1 (Raw):** 直接发送原始转录。\n2.  **Baseline 2 (Generic Redaction):** 使用简单的正则表达式将路径替换为 `[PATH]`，将凭证替换为 `[API_KEY]`。\n3.  **SlotGuard Lite:** 实现 SlotGuard 的核心重写逻辑：\n    *   对于路径：提取根目录和文件扩展名，中间部分替换为 `[ROOT_1]/.../[FILE_TYPE]`，保留后缀。\n    *   对于凭证：生成符合原始格式（如长度、字符集）的随机字符串，替换原始凭证。\n    *   维护一个简单的会话槽位表（slot table）以保持一致性。\n\n**测量：**\n*   **任务成功率 (Task Success Rate):** 比较三种方法在相同 Agent 模型（如 Llama-3.3-70B 或 GPT-4o）下的任务完成比例。\n*   **工具调用有效性 (Tool Call Validity):** 测量生成的工具调用参数是否语法正确且可执行（例如，路径是否存在，凭证格式是否被工具接受）。\n\n**结果判定：**\n*   **支持 Claim:** 如果 SlotGuard Lite 的任务成功率显著高于 Generic Redaction（例如 \u003E50% vs \u003C10%），且接近 Raw Baseline（例如 \u003E80%），则证明保留结构信息对 Agent 性能至关重要。\n*   **反驳 Claim:** 如果 SlotGuard Lite 的任务成功率与 Generic Redaction 无显著差异，或远低于 Raw Baseline，则说明模型严重依赖原始敏感值的具体内容，SlotGuard 的结构保留策略不足以维持推理能力。", "research_value": "### § 11 最强反例设计\n\n要挑战 SlotGuard 的有效性，最有力的反例应聚焦于**“语义依赖型工具调用”（Semantics-dependent Tool Calling）**场景，即模型不仅依赖路径的语法结构（如 `.py` 后缀），更依赖路径中的具体实体名称（Entity Names）或凭证的特定前缀/后缀来执行逻辑分支或内容推理。\n\n**具体攻击场景设计：**\n构建一个包含“基于文件名的条件执行”任务的 Agent 工作流。例如，任务要求 Agent 扫描 `/Users/alice/projects/` 目录，仅处理文件名包含 `confidential` 或 `draft` 的文件，而忽略其他文件。在 SlotGuard 的处理下，路径 `/Users/alice/projects/confidential_report.pdf` 会被重写为 `[REPO_ROOT_1]/[SENSITIVE_DOC_1].pdf`。\n\n**攻击逻辑与预期失败：**\n1.  **语义丢失导致逻辑错误：** LLM 在重写后的 Transcript 中看到的是 `[SENSITIVE_DOC_1].pdf`，它无法从槽位名称中推断出该文件是否包含 `confidential` 这一语义标签。如果 Agent 的指令是“只读取机密文件”，模型将因为无法识别文件名中的关键词而跳过该文件，或者错误地读取所有文件，导致任务失败。这直接反驳了 SlotGuard 声称的“保留足够结构信号供模型推理”的假设，证明在某些场景下，**文件名本身即是关键的结构信号（Structural Signal）**，而非仅仅是标识符。\n2.  **凭证格式的语义泄露风险：** 对于 FPS（Format-Preserving Synthetic Substitution），如果凭证的前缀具有语义意义（例如 `sk-prod-` 表示生产环境，`sk-test-` 表示测试环境），SlotGuard 生成的合成值 `sk-000...` 可能丢失了环境上下文。如果 Agent 需要根据凭证前缀决定调用哪个 API 端点（如 `api.prod.com` vs `api.test.com`），FPS 的“统计独立性”保证反而成为了缺陷，因为它抹除了对执行逻辑至关重要的元数据。\n3.  **跨轮次引用的歧义性：** 在复杂的多轮对话中，如果用户说“修改那个关于 Bob 解雇的文件”，SlotGuard 的 SEG（Semantic Entity Graph）虽然记录了 `[SENSITIVE_DOC_1]` 对应 `layoff_bob.py`，但如果存在多个类似命名的文件（如 `layoff_bob_v1.py`, `layoff_bob_v2.py`），且 SlotGuard 为了隐私将所有中间组件都替换为通用槽位，模型可能无法区分具体版本，导致操作错误的文件。\n\n**结论：** 这个反例表明，SlotGuard 在“结构化操作”（如简单的文件读写）中有效，但在“语义敏感操作”（如基于内容的过滤、基于名称的路由）中会系统性失败，因为其核心机制（抽象化）与模型所需的语义粒度存在根本冲突。\n\n### § 12 Follow-up Research Idea\n\n**研究主题：基于语义感知的动态脱敏策略（Semantics-Aware Dynamic Redaction, SADR）**\n\n**（a）驱动局限与未满足需求：**\nSlotGuard 的核心局限在于其“静态结构保留”假设，即认为保留语法结构（如扩展名、路径层级）足以支持所有推理。然而，如反例所示，许多 Agent 任务依赖**语义内容**（如文件名中的关键词、凭证的环境标识）。现有的隐私保护方法在“全保留”（泄露隐私）和“全抽象”（破坏语义）之间缺乏中间地带。我们需要一种能够根据**任务上下文（Task Context）**和**模型推理需求（Reasoning Needs）**动态调整脱敏粒度的机制，而非一刀切的槽位替换。\n\n**（b）借鉴相邻领域的方法：**\n借鉴**自然语言处理中的指代消解（Coreference Resolution）**和**信息检索中的查询重写（Query Rewriting）**技术，以及**差分隐私（Differential Privacy）**中的噪声添加思想。具体来说，可以引入一个轻量级的**语义意图分类器（Semantic Intent Classifier）**，在本地运行时分析 Agent 的当前指令和历史 Transcript，判断当前敏感数据是否对任务成功至关重要。如果至关重要，则采用**部分脱敏（Partial Redaction）**或**语义等价替换（Semantic Equivalence Substitution）**，而非完全抽象。\n\n**（c）第一个实验设计：**\n1.  **数据集构建：** 构建一个包含“语义敏感任务”的基准数据集，例如：\n    *   **文件名过滤任务：** 要求 Agent 根据文件名中的关键词（如 `urgent`, `draft`, `final`）选择文件。\n    *   **环境路由任务：** 要求 Agent 根据 API Key 的前缀（如 `prod`, `dev`）选择正确的 API 端点。\n    *   **内容摘要任务：** 要求 Agent 读取文件并生成摘要，其中文件名暗示了内容主题。\n2.  **方法实现：**\n    *   **SADR 模块：** 在 SlotGuard 的 Pipeline 中插入一个语义分析层。该层使用一个小规模 LLM 或规则引擎，分析当前 Tool Call 的意图。\n    *   **动态策略：**\n        *   如果意图是“通用操作”（如 `ReadFile`），使用 SlotGuard 的原始槽位替换。\n        *   如果意图是“语义过滤”（如 `ListFiles` with filter），保留文件名中的关键语义 token（如 `confidential`），仅脱敏用户特定部分（如 `alice`），生成 `[USER_1]/confidential_report.pdf`。\n        *   如果意图是“环境路由”，保留凭证的前缀语义（如 `sk-prod-`），仅脱敏密钥主体。\n3.  **评估指标：**\n    *   **任务成功率：** 在语义敏感任务上，比较 SADR 与 SlotGuard、Raw Transcript 的成功率。\n    *   **隐私泄露率：** 测量 SADR 在保留语义的同时，是否引入了新的隐私泄露（如通过语义 token 推断用户身份）。\n    *   **计算开销：** 评估语义分析层的额外延迟。\n\n**与已有工作的区别：**\nSlotGuard 是**静态的、结构导向的**，假设结构即语义。SADR 是**动态的、语义导向的**，承认语义可能嵌入在敏感数据的具体内容中，并通过上下文感知的策略在隐私和效用之间进行更细粒度的权衡。这不仅仅是扩展 SlotGuard，而是重新定义了“兼容性保持”的内涵，从“语法兼容”扩展到“语义兼容”。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Haocheng Xia\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Yongjoo Park\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"University of Illinois Urbana-Champaign\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"†\",\n      \"text\": \"Correspondence to: Yongjoo Park \u003Cyongjoo@illinois.edu\u003E.\"\n    }\n  ]\n}\n```", "summary_translation": "LLM agents 可能会泄露隐私（例如路径、电子邮件）和凭证（例如 API 密钥），因为 agent 的观察结果（例如工具输出、shell 日志和文件读取）会被追加到绑定提供商的对话记录中。现有的占位符脱敏方法脆弱：它可能遗漏嵌入或跨轮次的引用，过度脱敏良性相似项，并破坏对推理有用的结构。我们提出了 SlotGuard，一种本地对话记录边界，可以在隐藏敏感数据的同时保留 agent 的性能。SlotGuard 将结构绑定重写为类型化、后缀感知的槽位，用格式保留的合成值替换秘密信息，通过轻量级会话图链接跨轮次引用，并仅在可信运行时内恢复原始值。在面向受控仓库的 agent 对话记录上，SlotGuard 移除了 9,229 个路径中所有 20,814 个标注的结构敏感字符，并将 852 个植入值的凭证泄露率降低至 0.0%。在四个上游模型上，其任务成功率接近原始对话记录，而通用脱敏方法则降至 2.5%。对话记录重写的中位耗时为每 agent 轮次 14.424~$μ$s。代码公开可用，地址为 https://github.com/illinoisdata/SlotGuard。"}, {"title": "Can AI Agents Really Complete RTL-to-GDS? Lessons from Benchmarking Tool-Interactive EDA Workflows", "arxiv_id": "2607.17528", "authors": "Jinyuan Deng, Zhengrui Chen, Xufeng Wei, Tianyu Xing, Chenyi Wen, Cheng Zhuo", "summary": "LLM-driven agent systems have emerged as a promising paradigm for electronic design automation (EDA), demonstrating strong potential for automating complex design workflows. However, existing evaluations primarily examine individual language models on isolated EDA tasks, providing limited insight into how different agent systems perform across complete EDA flows. In this work, we present FluxBench, a systematic evaluation of AI agents on end-to-end EDA workflows under unified prompts, tool environments, and technology library settings. Our evaluation covers representative scenarios, including RTL generation with open-source toolchains and an RTL-to-GDS flow using closed-source commercial EDA tools for industrial applications. Through these workflows, we assess agents' capabilities in RTL code generation, iterative repair, tool-feedback utilization, logic synthesis, placement and routing (P\u0026R), and Engineering Change Order (ECO) automation. To further characterize the efficiency of agent systems, we introduce Token ROI, a cost-efficiency metric that measures effective improvements in EDA artifacts relative to token usage and runtime cost. Experimental results show that, even when built on the same foundation model, different agent system architectures can exhibit performance gaps of up to 86.27%. Moreover, among systems with comparable task performance, Token ROI can differ by as much as $105.92\\times$. In the RTL-to-GDS flow using PicoRV32 as a case study, FluxEDA achieves an end-to-end score of up to 97.94, outperforming Claude Code equipped with domain-specific EDA skills by up to $8.39\\times$. These results indicate that domain-specific skills alone are insufficient to improve agent performance in large-scale EDA scenarios. Instead, both agent system design and foundation model capability play critical roles in enabling effective automated EDA workflows.", "category": "cs.LG", "cluster": "Evaluation, Benchmarking \u0026 Security", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文符合筛选标准，主要依据如下：\n\n1.  核心研究对象明确为 LLM 智能体：论文标题和摘要明确指出研究对象是 \"LLM-driven agent systems\" 和 \"AI agents\"，特别是在电子设计自动化（EDA）领域中的工具交互型智能体（Tool-Interactive EDA Workflows）。这直接对应了研究焦点中的“单智能体”方向，特别是涉及“工具使用”（Tool Use）和“长期决策/工作流”（Long-Horizon Decision-Making）的能力。\n\n2.  核心贡献在于评估智能体系统架构与机制：虽然论文提出了一个基准测试（FluxBench），但其核心贡献不仅仅是应用层面的结果展示，而是深入分析了不同 Agent System Architectures（智能体系统架构）对性能的巨大影响（高达 86.27% 的性能差距）。摘要指出“domain-specific skills alone are insufficient... both agent system design and foundation model capability play critical roles”，这表明论文旨在通过评估来揭示和改进智能体的系统设计（如 harness/scaffold 的设计），这符合筛选标准中“保留：如果论文的研究对象明确是 LLM Agents... 即使它主要是行为分析、评估基准... 只要结论直接帮助理解或改进智能体能力，也应保留”的规则。\n\n3.  涉及智能体的关键能力机制：论文评估了智能体在 \"iterative repair\"（迭代修复/自我修正）、\"tool-feedback utilization\"（工具反馈利用）等关键 Agentic 能力上的表现。这些是构建和改进 LLM 智能体的核心机制，而非简单的领域应用。\n\n4.  排除项不适用：\n       它不是单纯的“非演化型应用”，因为它关注的是智能体系统本身的设计优劣和机制效率（Token ROI），而不仅仅是用 LLM 解决 EDA 问题。\n       它不涉及被排除的安全、对齐、多模态视觉核心、图神经网络或多智能体拓扑编排等无关领域。\n       虽然 EDA 是特定领域，但论文的核心洞察是关于 Agent System Design 的通用性原则（即架构比单纯的知识更重要），因此属于对智能体构建方法的贡献。\n\n综上，该论文通过基准测试深入分析了 LLM 智能体在复杂工具使用场景下的系统架构差异和性能瓶颈，直接服务于“构建、改进、评估 LLM 智能体”的研究目标，故判定为符合。", "intro_logic": "### § 1 研究问题与重要性\n\n本文旨在解决的核心研究问题是：在统一的提示词、工具环境和技术库设置下，AI Agent 系统能否真正完成端到端的 EDA 工作流（特别是从 RTL 到 GDS 的完整流程），以及不同 Agent 架构和基础模型在此类长周期、工具交互密集型任务中的性能差异与效率如何。这一问题的重要性在于，现有的 LLM 在 EDA 领域的应用评估主要局限于孤立的、单轮的语言模型生成任务（如 Verilog 代码生成或语法检查），缺乏对 Agent 在真实工业级、多步骤、工具交互场景下的系统性评估。随着 EDA 任务从被动辅助向自主 Agent 转变，任务复杂度显著增加，涉及模拟器、综合器、物理设计工具等多轮交互，导致 Token 消耗和成本呈指数级增长（如图 1 所示，从单轮推理到 Agentic RTL 设计，平均 Token 使用量从 1.02K 激增至 213.82K）。因此，缺乏一个标准化、成本感知且支持工具交互的基准来评估 Agent 在完整 EDA 流程中的表现，成为阻碍该领域发展的关键瓶颈。解决这一问题不仅能揭示当前 AI Agent 在复杂 EDA 工作流中的实际能力边界，还能通过引入 Token ROI 这一成本效率指标，指导开发者在模型选择、Agent 架构设计上进行更优的资源配置，从而推动自动化 EDA 工作流从理论探索走向工业级应用，降低芯片设计的试错成本和时间开销。\n\n### § 2 前人工作与不足\n\n尽管已有研究探索了 LLM 在 EDA 中的应用，但现有工作存在显著不足。早期的基准测试如 VerilogEval 和 RTLLM 主要关注模型在静态输出或单轮生成任务中的功能正确性、语法和设计质量，未能涵盖多轮工具交互和端到端流程评估。随后的 RealBench 和 CVDP 虽然扩展了评估范围至真实 IP 级设计和更广泛的推理技能，但仍主要侧重于模型层面的生成结果，缺乏对 Agent 在长周期、工具交互式 EDA 流程中的过程级评估支持。在 Agent 框架方面，ChatEDA 和 AutoEDA 引入了 LLM 驱动的任务规划和模块化工具自动化，FluxEDA 则提供了更强大的 Agent 驱动工作流自动化能力。然而，这些现有基准和系统主要存在以下局限：首先，它们缺乏对 Token 消耗和多轮工具使用行为的可靠评估，无法反映 Agent 在复杂迭代调试中的真实成本效率；其次，现有评估多基于开源工具链或简化场景，未能充分反映使用闭源商业 EDA 工具（如 Innovus）在工业级 RTL-to-GDS 流程中的复杂性和约束（如时序收敛、物理实现细节）；最后，缺乏对 Agent 架构（如 CLI 基于命令行的交互 vs. MCP 基于结构化接口的交互）对流程稳定性和错误恢复能力影响的深入分析。因此，现有工作无法全面回答 AI Agent 在真实、端到端、长周期 EDA 场景中的实际效能，亟需如 FluxBench 这样涵盖开源与闭源工具、引入成本效率指标并深入分析错误模式的系统性基准来填补这一空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在 LLM 应用于 EDA 的早期阶段，研究主要聚焦于静态的代码生成能力，如 VerilogEval 和 RTLLM 等基准测试仅评估模型在单次交互（single-turn）下生成 RTL 代码的语法正确性和功能完备性。然而，工业界的 EDA 流程本质上是高度工具依赖（tool-centric）且长周期（long-horizon）的，涉及综合、布局布线（P\u0026R）和工程变更订单（ECO）等多个迭代步骤。现有的基准测试无法捕捉 Agent 在多轮工具交互中的行为，导致评估结果与真实场景脱节。\n\n随着 Agent 架构（如 ReAct 或 Plan-and-Execute）的引入，研究者发现 Agent 可以通过调用模拟器、综合器和物理设计工具来自主完成复杂任务。但这一转变带来了新的问题：工具交互显著增加了 Token 消耗和运行时间，且不同 Agent 架构在相同基础模型下的表现差异巨大。现有的评估体系缺乏对“过程效率”的考量，仅关注最终的设计质量（QoR），忽略了达到该质量所付出的计算成本。此外，领域特定技能（Domain-specific Skills）是否足以弥补通用编码 Agent 在复杂 EDA 流程中的不足，也是一个未解之谜。\n\n基于此，作者意识到需要一个能够统一评估端到端 EDA 工作流的基准，该基准不仅要衡量最终结果，还要量化 Agent 在工具交互过程中的资源效率。因此，FluxBench 应运而生，它通过引入 Token ROI 指标，将 EDA 任务的优化收益与 Token 及时间成本挂钩，旨在揭示 Agent 架构、基础模型能力与领域技能在真实工业级 RTL-to-GDS 流程中的真实作用。\n\n### § 4 核心 Intuition\n\nEDA 任务的核心挑战不在于单次代码生成的准确性，而在于 Agent 能否在长周期的工具交互中高效地收敛到最优解，而非陷入低效的试错循环。单纯依赖领域知识注入（Skills）无法解决 Agent 在复杂工具链中的状态管理和错误恢复问题，因此，结构化的 Agent 架构（如基于 MCP 的状态管理）比单纯的模型微调或提示工程更能保证流程的稳定性。最终，衡量 Agent 价值的标准应从“能否完成任务”转变为“以多低的资源成本完成任务”，即 Token ROI 才是评估 EDA Agent 真实工业可行性的关键指标。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n这篇论文的核心方法并非提出一个新的算法模型，而是构建了一个名为 **FluxBench** 的系统性基准测试框架，用于评估 AI Agents 在端到端 EDA 工作流中的表现。其核心创新在于引入了 **Token ROI** 指标，并对比了不同 Agent 架构（如 FluxEDA vs. Claude Code）在真实工业级任务中的效率与稳定性。\n\n以下以论文中核心的 **RTL-to-GDS** 任务（以 PicoRV32 处理器为例）为例，讲解完整的 Pipeline：\n\n1.  **输入阶段 (Input)**：\n    *   **设计规格**：Agent 接收自然语言描述的功能规格（Spec），例如 PicoRV32 的 RISC-V 核心定义。\n    *   **约束条件**：提供具体的时序约束文件（SDC），例如宽松模式下的 350 MHz 或严格模式下的 700 MHz，以及固定的芯片面积（Die Size）。\n    *   **环境配置**：Agent 运行在容器化环境中，拥有只读访问权限以调用商业 EDA 工具（如 Synopsys Design Compiler, Innovus）和 PDK（工艺设计套件，如 55nm 节点）。\n\n2.  **处理阶段 (Processing - Agentic Workflow)**：\n    *   **任务分解与规划**：Agent（如 FluxEDA-Agent）将复杂的 RTL-to-GDS 流程分解为多个子任务：逻辑综合（Logic Synthesis）、布局布线（Place-and-Route, P\u0026R）、工程变更订单（ECO）。\n    *   **工具交互与迭代**：\n        *   **逻辑综合**：Agent 生成 Tcl 脚本调用综合工具，生成网表（Netlist）并插入时钟门控（Clock Gating）。若失败，Agent 分析日志并调整脚本重试。\n        *   **布局布线**：Agent 依次执行 I/O 放置、标准单元放置、时钟树综合（CTS）和布线。在此阶段，Agent 需处理复杂的工具兼容性问题和时序违例。\n        *   **ECO 修复**：若时序不满足要求，Agent 执行物理感知 ECO（Physical-aware ECO），修改布局以修复 Setup/Hold 违例。\n    *   **反馈利用**：Agent 读取工具输出的日志（Logs）和报告（Reports），判断当前步骤是否成功，并决定下一步操作。FluxEDA 架构通过 MCP（Model Context Protocol）提供结构化的工具描述和反馈，相比传统的 CLI 交互更稳定。\n\n3.  **输出阶段 (Output)**：\n    *   **最终产物**：生成最终的 GDSII 文件（用于制造的光罩数据）以及相关的时序、功耗、面积报告。\n    *   **评估指标**：\n        *   **任务得分**：基于功能通过率、综合/布线完成度、最终时序（WNS/TNS）和功耗计算的加权分数（0-100分）。\n        *   **Token ROI**：计算 `EDA Return / (Token Cost × Time Cost)`，衡量每单位成本和时间的优化收益。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有提出新的基础数学理论或复杂的算法推导，其核心贡献在于定义了一套**评估指标体系**，特别是 **Token ROI** 的计算公式。为了帮助理解，我们将解释其背后的直觉（Intuition）和公式构成：\n\n1.  **Token Investment (代币投入)**：\n    *   **公式直觉**：Agent 在执行任务时，不仅消耗输入和输出的 Token，还消耗缓存、推理和工具观察的 Token。公式 $C_{token}(\\tau_k) = \\sum_{t=1}^{T} \\sum_{j \\in J} n_t[j] \\cdot r[j]$ 旨在精确量化整个交互轨迹 $\\tau_k$ 中的总经济成本。\n    *   **意义**：传统的评估只看最终结果，忽略了 Agent 为了达到结果所进行的“试错”成本。这个公式强调了多轮工具交互带来的高昂 Token 开销。\n\n2.  **Time Investment (时间投入)**：\n    *   **公式直觉**：$C_{time}(\\tau_k) = t_{k}^{end} - t_{k}^{start}$。\n    *   **意义**：在工业界，时间就是金钱。Agent 不仅要算得准，还要算得快。这个指标捕捉了 Agent 在交互式推理、工具调用和迭代修复过程中的整体执行效率。\n\n3.  **EDA Return (EDA 回报)**：\n    *   **公式直觉**：$S_k \\in [0, 1]$ 是一个归一化的任务特定分数。它由多个子任务得分加权组成（如表 1 所示），包括功能通过率、综合完成度、布线完成度、ECO 成功与否以及最终的时序和功耗指标。\n    *   **意义**：将复杂的 EDA 质量指标（QoR）转化为一个统一的标量，便于与成本进行对比。\n\n4.  **Token ROI (代币投资回报率)**：\n    *   **公式直觉**：$ROI = \\frac{S_k}{C_{token}(\\tau_k) \\cdot C_{time}(\\tau_k)}$。\n    *   **意义**：这是论文的核心创新点。它回答了“为了获得这一点的 EDA 质量提升，我们付出了多少 Token 和时间成本？”的问题。\n    *   **归一化处理**：为了在不同任务间比较，论文还对 Token 成本和时间进行了归一化映射（Clipped Linear Mapping），将成本映射到 [1, 100] 和 [1, 5] 的范围，使得 ROI 具有可比性。\n\n**总结**：这里的“数学”本质上是**经济学指标在 AI Agent 评估中的应用**，旨在揭示“高性能”与“高成本”之间的权衡（Trade-off）。\n\n### § 7 实验设计与结论\n\n**提出了什么问题？**\n现有的 LLM 评估基准主要关注孤立的代码生成任务（如 Verilog 语法正确性），缺乏对 AI Agents 在**端到端、长周期、工具交互式** EDA 工作流（如 RTL-to-GDS）中的系统性评估。此外，现有评估忽略了**成本效率**（Token 消耗和运行时间），无法回答“AI Agent 是否真的能高效完成工业级芯片设计”以及“领域特定技能（Skills）是否足以弥补架构缺陷”的问题。\n\n**设计了什么实验验证这个问题？**\n1.  **构建 FluxBench 基准**：\n    *   **任务选择**：涵盖开源工具链的 RTL 生成任务（RealBench, CVDP）和商业工具链的 RTL-to-GDS 任务（PicoRV32, 55nm 工艺）。\n    *   **Agent 架构对比**：对比了三种架构：通用编码 Agent（Claude Code）、增强领域技能的 Agent（CC+EDA Skills）、以及专为 EDA 设计的结构化 Agent（FluxEDA）。\n    *   **模型对比**：使用 DeepSeek-V4, GLM-5.2, Claude Sonnet 5 作为基础模型。\n    *   **指标引入**：除了传统得分，引入 **Token ROI** 来衡量成本效率。\n\n2.  **实验设置**：\n    *   在统一的容器化环境中运行，确保公平性。\n    *   设置不同的时序约束（350 MHz 宽松 vs. 700 MHz 严格）以测试 Agent 在压力下的表现。\n    *   记录完整的交互轨迹、Token 消耗、运行时间和最终设计质量。\n\n**问题的答案是什么？**\n1.  **架构比技能更重要**：仅添加领域特定技能（Skills）不足以解决复杂 EDA 流程中的问题。在严格的时序约束下，Skills 带来的提升有限，甚至可能产生负面影响。**Agent 的系统架构设计**（如 FluxEDA 的结构化工作流和 MCP 接口）对稳定性和成功率起决定性作用。\n2.  **成本效率差异巨大**：即使最终设计质量相近，不同 Agent 的 **Token ROI** 可相差高达 **105.92 倍**。弱 Agent 往往需要大量的试错迭代，导致极高的 Token 和时间成本；而强 Agent（如 FluxEDA）能以更少的步骤达到目标。\n3.  **工具交互是主要瓶颈**：在布局布线（PR）阶段，**Innovus Tcl Command 兼容性**错误是最主要的失败原因（占 31.7%）。FluxEDA 通过封装工具接口，消除了这类低级错误，证明了结构化工具交互对于降低调试成本和提高流程稳定性的关键作用。\n4.  **结论**：AI Agent 确实可以完成 RTL-to-GDS 流程，但前提是必须采用**专为 EDA 优化的 Agent 架构**，而不仅仅是依赖强大的基础模型或简单的提示词工程。领域知识必须内化到 Agent 的工作流设计中，而非仅作为外部技能附加。", "additional_insights": "### § 8 Take-aways\n\nFluxBench 揭示了在端到端 EDA 工作流中，Agent 系统架构（System Architecture）对最终性能的影响远超单一 Foundation Model 的能力差异，即使基于相同的底层模型，不同架构的性能差距可达 86.27%。论文提出的 Token ROI 指标表明，仅关注最终设计质量（QoR）会掩盖巨大的效率差异，性能相当的 Agent 在 Token 消耗和运行时间上可能相差超过 100 倍，这凸显了过程级评估（Process-level Evaluation）的重要性。针对 RTL-to-GDS 流程，简单的领域特定技能（Domain-specific Skills）注入不足以解决复杂工业场景下的稳定性问题，特别是在严格的时序约束（如 700 MHz）下，Skills 甚至可能产生负面影响。实验发现，Place-and-Route (P\u0026R) 阶段的主要失败模式并非算法逻辑错误，而是低层的工具命令兼容性（如 Innovus Tcl Command compatibility），这证明结构化工作流和封装好的工具接口比单纯提升模型推理能力更能降低调试成本。基于 MCP（Model Context Protocol）的架构通过提供结构化的工具描述和执行反馈，显著提升了长链路 EDA 流程的稳定性，尽管其 Token 开销较高，但在容错率低的物理设计场景中，这种可靠性收益远大于成本增加。\n\n### § 9 最脆弱的假设\n\n该研究最脆弱的假设是：**FluxEDA 所采用的结构化、状态感知的 Agent 架构（基于 MCP 和封装工具接口）在通用性上优于或等同于传统的 CLI-based 交互方式，且其带来的 Token 开销增加是换取工业级稳定性的必要且最优代价。**\n\n如果这一假设不成立，即存在一种更轻量级的 CLI 交互优化方案或更高效的 Prompt Engineering 策略，能够在不显著增加 Token 消耗的情况下达到相同的 P\u0026R 阶段稳定性，那么 FluxEDA 的核心贡献——即“架构设计比模型能力更重要”以及“MCP 带来的稳定性溢价”——将大打折扣。论文中提供的证据主要基于 PicoRV32 这一特定规模的设计案例，且对比的基线（Claude Code 和 CC+EDA Skills）可能并未代表 CLI 交互的最优实践（例如未尝试更高级的上下文管理或错误恢复机制）。此外，论文未充分证明这种架构优势在更大规模、更复杂的 SoC 设计中是否依然线性保持，也未排除随着 Foundation Model 自身工具调用能力的原生增强，这种专用架构的边际收益是否会迅速递减。如果未来 LLM 原生支持更稳健的工具调用协议，FluxEDA 这种中间层架构的必要性将受到挑战。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现并验证 **“领域特定技能（Skills）在严格时序约束下的有效性”** 这一具体 Claim，无需构建完整的 FluxEDA 系统。\n\n**数据与实现：** 使用论文中提到的 PicoRV32 设计作为输入，选择一个开源的 EDA 工具链（如 Yosys + OpenROAD）或简化版的商业工具脚本。构建两个简单的 Agent 原型：一个是“Vanilla Agent”，仅接收自然语言指令并生成 Tcl/Python 脚本；另一个是“Skill-Augmented Agent”，在 System Prompt 中注入论文中提到的 EDA 领域知识（如时序收敛技巧、P\u0026R 常见错误处理指南）。\n\n**测量与验证：** 设定一个中等难度的时序约束（例如 500 MHz，介于论文的 350 MHz 和 700 MHz 之间）。运行两个 Agent 完成从 RTL 到 GDS 的关键步骤（重点观察 P\u0026R 阶段的收敛情况）。测量指标包括：1) 任务完成率（是否成功生成 GDS）；2) 迭代次数（达到收敛所需的尝试轮数）；3) Token 消耗量。\n\n**结果判定：** 如果 Skill-Augmented Agent 在迭代次数或成功率上没有显著优于 Vanilla Agent，甚至因为 Prompt 过长导致注意力分散而表现更差，则支持了论文中“Skills 在严格约束下作用有限”的结论。反之，如果 Skills 显著提升了收敛速度或成功率，则反驳了论文的核心观察之一，表明在特定条件下，知识注入仍是有效的低成本优化手段。此实验避开了复杂的 MCP 架构实现，直接验证了论文中关于“Skills 局限性”的关键论点。", "research_value": "### § 11 最强反例设计\n\n若要挑战 FluxBench 的核心结论，最有力的反例设计应聚焦于**“结构化架构的过度工程化（Over-engineering）与边际收益递减”**，特别是针对论文中“架构优于技能”以及“MCP 带来的稳定性溢价是必要代价”这两个关键论点。\n\n首先，在实验设计上，可以构建一个**“自适应 CLI 代理（Adaptive CLI Agent）”**作为基线，而非论文中使用的静态 Claude Code。该反例代理不依赖复杂的 MCP 中间层，而是利用 LLM 的原生工具调用能力（Native Tool Use），结合一个轻量级的**“错误模式检索增强生成（Error-RAG）”**模块。具体而言，当 Agent 遇到 Innovus Tcl 兼容性错误时，它不是通过预定义的结构化接口重试，而是实时检索历史失败日志中的特定错误代码，动态生成修复脚本。如果这个轻量级代理在 PicoRV32 任务中能达到与 FluxEDA 相近的成功率，且 Token ROI 高出 2-3 倍（因为省去了 MCP 序列化/反序列化的开销和结构化描述的冗余 Token），则直接证伪了“复杂架构是工业级稳定性的必要条件”这一假设。这证明了当前的性能差距可能并非源于架构本身的优越性，而是源于基线代理（Claude Code）在错误恢复策略上的简陋，而非架构层面的根本缺陷。\n\n其次，在理论论证上，可以指出 FluxBench 的评估存在**“规模幻觉（Scale Illusion）”**。PicoRV32 是一个仅有数千门电路的微型核，其设计空间相对有限，Agent 可以通过暴力试错（Brute-force Trial-and-Error）在有限的 Token 预算内找到可行解。然而，在真实的工业级 SoC 设计中（如百万门级以上的 CPU 或 GPU），设计空间呈指数级爆炸，时序收敛（Timing Closure）不再是简单的脚本调整，而是涉及复杂的物理效应（如 IR Drop, EM, Signal Integrity）和多目标优化。在这种场景下，FluxEDA 所依赖的“结构化工作流”可能因为缺乏对全局设计状态的深层理解（Global State Awareness），导致在早期阶段（如 Floorplanning）做出次优决策，从而在后期 P\u0026R 阶段陷入无法通过局部 ECO 修复的死锁。如果实验显示，随着设计规模从 PicoRV32 扩展到更复杂的 RISC-V 核心（如 Ibex 或 CV32E40P），FluxEDA 的 Token ROI 急剧下降，甚至低于简单的 CLI 代理（因为后者可能在早期就因错误而终止，避免了后期的无效迭代），则说明 FluxEDA 的架构优势仅在“小样本、低复杂度”场景下成立，无法泛化到真正的工业级 RTL-to-GDS 流程。\n\n最后，可以引入**“人类专家对比（Human-in-the-Loop Baseline）”**作为反例。论文仅对比了不同 Agent 架构，但未将 Agent 的表现与初级 EDA 工程师的效率进行对比。如果数据显示，即使是最优的 FluxEDA 代理，其完成 RTL-to-GDS 所需的总时间（包括 Token 等待时间和工具运行时间）和成本，仍然远高于一名熟练工程师使用传统脚本和 GUI 操作的时间，那么“AI Agent 能真正完成 RTL-to-GDS”这一结论在工业应用层面就是无效的。这揭示了当前评估体系忽略了**“绝对效率（Absolute Efficiency）”**，而仅关注**“相对效率（Relative Efficiency）”**，从而掩盖了 AI Agent 在真实生产环境中可能带来的净负收益。\n\n### § 12 Follow-up Research Idea\n\n基于 FluxBench 揭示的“架构重要性”和“成本效率瓶颈”，一个非增量的 Novel Research Idea 是：**从“指令式代理（Imperative Agent）”转向“声明式优化代理（Declarative Optimization Agent）”，并引入“设计空间探索（Design Space Exploration, DSE）”作为 Agent 的核心推理范式。**\n\n**(a) 驱动局限与未满足需求：**\nFluxBench 表明，当前的 Agent 主要扮演“脚本生成器”的角色，通过试错来修复工具错误。这种“指令式”方法在复杂 EDA 流程中效率低下，因为 EDA 本质上是多目标优化问题（PPA: Power, Performance, Area），而非简单的代码生成问题。Agent 缺乏对设计空间的全局视野，导致其在局部最优解中徘徊，消耗大量 Token 进行无效迭代。现有的“技能注入”或“结构化工作流”仅解决了“如何正确调用工具”的问题，而未解决“如何智能地探索设计空间”的问题。工业界真正的需求不是让 AI 替代工程师写脚本，而是让 AI 作为**“自动化的 DSE 引擎”**，在巨大的设计空间中快速定位 Pareto Front。\n\n**(b) 借鉴相邻领域的方法：**\n可以借鉴**“贝叶斯优化（Bayesian Optimization）”**和**“强化学习（Reinforcement Learning, RL）”**在超参数调优中的应用，以及**“形式化验证（Formal Verification）”**中的状态空间剪枝技术。具体而言，构建一个**“双层代理架构（Two-Tier Agent Architecture）”**：\n1.  **高层规划器（High-Level Planner）**：不直接生成 Tcl 脚本，而是生成“设计策略（Design Strategy）”，如“增加缓冲器密度”、“调整时钟树拓扑”等抽象操作。该层利用贝叶斯优化模型，根据历史迭代结果预测哪些策略最有可能改善 WNS/TNS。\n2.  **低层执行器（Low-Level Executor）**：将高层策略转化为具体的工具命令。该层可以是轻量级的 CLI 代理，因为具体的命令生成已被高层策略简化，降低了出错概率。\n\n**(c) 第一个实验设计：**\n实验将对比**“传统试错型 Agent（如 FluxEDA）”**与**“DSE 驱动型 Agent”**在中等复杂度设计（如 Ibex 核心）上的表现。\n*   **设置**：固定时序约束（如 1 GHz），要求 Agent 在有限的 Token 预算内找到满足时序且面积最小的设计。\n*   **过程**：DSE 驱动型 Agent 首先进行少量随机采样，建立初步的“设计参数-PPA 结果”代理模型（Surrogate Model）。随后，它利用贝叶斯优化选择下一个最有希望的参数组合进行综合和 P\u0026R。\n*   **指标**：除了传统的 Token ROI，引入**“收敛速度（Convergence Speed）”**（达到目标 WNS 所需的迭代次数）和**“Pareto 前沿覆盖率（Pareto Front Coverage）”**。\n*   **预期结果**：如果 DSE 驱动型 Agent 能以更少的迭代次数（从而更少的 Token 消耗）找到更优的 PPA 平衡点，则证明将 Agent 从“脚本生成器”重构为“优化决策者”是提升 EDA 自动化效率的关键方向，这超越了 FluxBench 所关注的“工具交互稳定性”层面，进入了“设计智能”的核心领域。\n\n这一提议与已有工作的区别在于，它不再试图优化“如何让 LLM 更好地写 Tcl 脚本”，而是重新定义 LLM 在 EDA 中的角色——从**“操作员（Operator）”**转变为**“架构师（Architect）”**，利用 LLM 的推理能力进行高层策略规划，而非低层命令生成。这为解决 FluxBench 中揭示的“高成本、低效率”问题提供了根本性的新视角。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Zhengrui Chen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Xufeng Wei\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Jinyuan Deng\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Chenyi Wen\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Cheng Zhuo\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": [\n        \"†\"\n      ]\n    },\n    {\n      \"name\": \"Tianyu Xing\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"Zhejiang University\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"†\",\n      \"text\": \"Corresponding author (czhuo@zju.edu.cn)\"\n    }\n  ]\n}\n```", "summary_translation": "由大语言模型（LLM）驱动的代理系统已成为电子设计自动化（EDA）领域一种极具前景的范式，展现出自动化复杂设计工作流的巨大潜力。然而，现有的评估主要考察单个语言模型在孤立 EDA 任务上的表现，对于不同代理系统在整个 EDA 流程中的性能表现提供的见解有限。在本工作中，我们提出了 FluxBench，这是一个在统一的提示词、工具环境和技术库设置下，对端到端 EDA 工作流中 AI 代理进行的系统性评估。我们的评估涵盖了代表性场景，包括使用开源工具链进行 RTL 生成，以及使用闭源商业 EDA 工具进行面向工业应用的 RTL-to-GDS 流程。通过这些工作流，我们评估了代理在 RTL 代码生成、迭代修复、工具反馈利用、逻辑综合、布局布线（P\u0026R）以及工程变更订单（ECO）自动化方面的能力。为了进一步表征代理系统的效率，我们引入了 Token ROI，这是一种成本效率指标，用于衡量相对于 token 使用量和运行时成本，EDA 工件的有效改进程度。实验结果表明，即使基于相同的基础模型，不同的代理系统架构也可能表现出高达 86.27% 的性能差距。此外，在任务性能相当的系统中，Token ROI 的差异可达 $105.92\\times$。在以 PicoRV32 为案例研究的 RTL-to-GDS 流程中，FluxEDA 实现了高达 97.94 的端到端得分，比配备特定领域 EDA 技能的 Claude Code 高出多达 $8.39\\times$。这些结果表明，仅靠特定领域的技能不足以提高代理在大规模 EDA 场景中的性能。相反，代理系统设计和基础模型能力在实现有效的自动化 EDA 工作流中都起着关键作用。"}, {"title": "AEVAL: From Anecdotal to Deterministic Testing for Agentic Skill Workflows", "arxiv_id": "2607.16345", "authors": "Tejas Singh Anand, Yuet Ying Christina Wang, Wanting Jiang, Steve Masson, Tian Zheng, Bingjie Zhou", "summary": "Modern agentic systems increasingly rely on skills: installable packages of natural language and code that teach an LLM agent to perform a domain task. As skill repositories grow, developers need automated quality signals on every change, yet evaluation today is largely anecdotal: a developer asks an agent to \"try the skill,\" watches a demo, and forms a subjective impression. This yields neither reproducibility across runs nor comparability across versions, and scales poorly to marketplaces where one regression can silently break dozens of downstream workflows. We present AEVAL (Agentic Evaluation), a CI-integrated framework that replaces this practice with a deterministic, reproducible test pipeline for agentic skills. Every skill change triggers a test event: the skill runs against a developer-declared evaluation contract (eval.config) inside an automated executor, emitting a structured, evidence-grounded quality signal that downstream CI can route on. A key ingredient is a structural separation between executor and grader, preventing a subtle but pervasive failure mode: an agent that silently self-corrects during execution and then grades its own patched outputs as passing. Our contributions are: (i) a deterministic, change-triggered evaluation protocol with per-skill contracts and per-run artifact schemas; (ii) a formalization of self-correction bias as a distinct failure mode of naive agentic evaluators; (iii) an executor/grader separation with a first-attempt grading rule and explicit self-correction tracking; and (iv) a tiered, grounded-evidence fix-suggestion scheme (LV1 causal, LV2 quality) posted as inline merge-request comments. Validated on real skills in a production agentic stack across multiple agent SDKs, AEVAL converts spurious 100% pass rates into reproducible first-attempt fail signals with an auditable record of every executor fix.", "category": "cs.LG", "cluster": "Evaluation, Benchmarking \u0026 Security", "tags": ["cs.LG"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agentic, LLM Agents)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。", "intro_logic": "### § 1 研究问题与重要性\n\n本文针对的核心研究问题是：在 Agentic Systems 中，如何为可安装的 **Skills**（包含自然语言指令和代码的领域任务包）建立一种确定性的、可复现的自动化测试机制，以替代当前主导的、基于人工主观印象的 **Anecdotal Testing**（轶事测试）。随着 Skill 仓库规模的扩大，开发者在每次修改 Skill 时缺乏自动化的质量信号，导致回归错误（Regression）难以被及时发现，且不同版本间的表现无法进行客观比较。\n\n这一问题的重要性在于，现代 Agentic 系统高度依赖 Skills 来外部化领域能力，单个 Skill 的故障会级联破坏所有依赖它的下游工作流，实质上等同于产品故障。然而，现有的评估实践主要依赖开发者在交互式会话中运行 Demo 并凭主观判断 Skill 是否“有效”，这种非正式、不可复现且不可比的信号无法扩展到包含数十或数百个 Artifacts 的 Skill 市场。解决这一问题带来的价值是巨大的：它实现了从手动轶事测试到确定性 CI 流水线的范式转变，确保了每次代码变更都能触发自动化的 **Install–Execute–Grade–Suggest-fixes** 循环。这不仅消除了人为判断的主观性和不一致性，还通过结构化的、基于证据的质量信号（如 **First-attempt Pass Rate** 和分层修复建议），使得下游 CI 系统能够可靠地进行路由和停止决策，从而在大规模 Skill 市场中防止静默回归的积累，显著提升了 Agentic 工作流的工程可靠性和可维护性。\n\n### § 2 前人工作与不足\n\n尽管 Agent 评估领域已有大量研究，但针对 **Skill Artifact** 的确定性测试问题尚未被充分解决，现有方法存在明显的局限性。\n\n首先，现有的 **Agent Evaluation Frameworks** 主要分布在三个层面，但均无法直接用于 Skill 的 CI 测试。**Prompt/Response** 平台（如 LangSmith, Braintrust, Promptfoo）仅对模型输出进行断言评分，不涉及可部署 Skill 工件的安装和执行；**Capability Benchmarks**（如 OpenAI Evals, AgentBench, SWE-bench）侧重于评估模型在固定数据集上的通用问题解决能力，无法针对开发者在 Merge Request (MR) 中修改的具体 Skill 进行定向测试；**Sandboxed Agent Evaluation**（如 Harbor Framework）虽然在容器中运行 Agent 任务，但其测试对象是 Agent 本身而非 Skill 工件，且缺乏结构上独立的评估器。\n\n其次，**LLM-as-judge** 和 **Self-evaluation** 协议（如 Zheng et al., 2023; Saunders et al., 2022）虽然提供了自动化评估手段，但主要关注对模型输出的判断，且已知存在 **Self-preference** 和校准问题。在本文的场景中，评估对象是 Skill 工件在主动修改世界状态（通过工具调用）的执行器下的行为，这与静态输出判断有本质区别。\n\n最关键的技术不足在于，现有的 Naive Agentic Evaluators 普遍存在 **Self-correction Bias**（自我修正偏差）。当同一个 Agent 既负责执行又负责评估时，由于 LLM 经过训练以从错误中恢复，它会静默地重试、修改配置或修补 Skill，直到任务成功，然后基于最终状态报告通过。这种机制导致评估信号系统性地乐观，实际上测量的是 Agent 的调试能力而非 Skill 本身的质量。由于这种偏差是结构性的（源于 **Shared Identity** 和 **Post-hoc Assertions**），而非特定模型选择的结果，因此简单的模型替换或提示工程无法根本解决。此外，现有的不确定性量化方法（如 Conformal Prediction）依赖于可靠的标签，如果输入标签被自我修正偏差污染，其统计保证将失效。因此，缺乏一种能够分离执行与评估、并基于 **First-attempt** 轨迹进行严格断言的测试协议，是阻碍 Agentic Skill 实现软件工程级确定性测试的主要障碍。", "core_insight": "### § 3 重建作者的思考路径\n\n在 Agentic Systems 迅速发展的背景下，开发者面临着一个日益严峻的工程挑战：如何对可安装的 **Skills**（包含自然语言指令和代码的包）进行自动化、可复现的质量评估。现有的评估实践主要停留在 **Anecdotal Testing** 阶段，即开发者通过交互式会话手动测试，这种方式缺乏 **Reproducibility** 和 **Comparability**，无法适应大规模 **Skill Marketplace** 的需求。虽然传统的软件工程中已有成熟的 CI/CD 测试流程，但直接将其应用于 LLM Agent 时遇到了根本性的障碍：**Stochasticity** 和 **Self-Correction Bias**。\n\n现有的 **LLM-as-judge** 和 **Self-evaluation** 研究指出，模型倾向于偏好自己的生成结果（**Self-preference**），且存在校准问题。在 Agentic 场景中，这一现象演变为更严重的结构性缺陷：当同一个 Agent 既负责执行（Execution）又负责评估（Grading）时，由于 Agent 具备工具使用能力（如编辑文件、运行脚本），它会在执行失败时自动进行 **Self-correction**（例如修复配置错误或代码 Bug）。如果评估器基于最终成功的状态进行打分，它实际上测量的是 Agent 的 **Debugging Ability** 而非 Skill 本身的 **Quality**。这种 **Self-correction Bias** 导致评估信号系统性乐观，掩盖了 Skill 的潜在缺陷，使得传统的确定性测试管道失效。\n\n此外，现有的评估框架（如 LangSmith, AgentBench）要么仅关注 Prompt/Response 层面的评分，无法执行完整的 Skill 安装与运行流程；要么在沙箱中测试 Agent 的通用能力，而非针对特定 Skill 变更的回归测试。因此，需要一个能够集成到 CI 流程中、针对 Skill 变更触发、并能消除自我修正偏差的确定性评估框架。作者意识到，必须从架构上分离执行与评估角色，并引入 **First-attempt Grading** 机制，才能从根源上解决这一问题，从而将主观的、不可复现的测试转化为客观的、机器可读的质量信号。\n\n### § 4 核心 Intuition\n\n传统 Agentic 评估失效的核心在于 **Self-correction Bias**：当执行者（Executor）与评估者（Grader）为同一 Agent 时，Agent 会利用其调试能力在运行过程中自动修复 Skill 缺陷，导致评估结果反映的是“修复后的状态”而非“原始 Skill 的质量”，从而产生虚假的高通过率。\n\nAEVAL 的核心直觉是通过 **Structural Separation** 将执行与评估解耦，并强制执行 **First-attempt Grading Rule**：Grader 仅能访问执行前的断言（Assertions）和执行过程中的只读日志（Transcript），且必须基于首次尝试（First-attempt）的结果进行判定，任何需要自我修正才能通过的断言均标记为失败。\n\n这种设计确保了评估信号严格锚定在 Skill 的原始发布状态（As-shipped），而非 Agent 的补救能力，从而将主观的、不可复现的“演示式”测试转化为客观的、可审计的确定性测试管道，为下游 CI 提供可靠的质量路由信号。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**AEVAL** 的核心方法是将传统的、基于人工主观印象的“轶事性评估”（anecdotal evaluation）转变为一种确定性的、由代码变更触发的 CI 集成测试管道。其核心创新在于通过**结构分离**（structural separation）将执行器（executor）与评分器（grader）解耦，并引入**首次尝试评分规则**（first-attempt grading rule）以消除**自我修正偏差**（self-correction bias）。\n\n以下是 AEVAL 的完整 Pipeline，结合一个具体的真实案例进行说明：\n\n**案例背景**：假设开发者提交了一个 Merge Request (MR)，修改了一个名为 `segmentation_skill` 的技能包。该技能的 `SKILL.md` 中定义的动作名称为 `segment_train`，但底层容器实际期望的动作名称是 `train`。这是一个典型的配置错误。\n\n1.  **触发与检查 (Trigger \u0026 Examine)**：\n    *   **输入**：GitLab CI 检测到 `segmentation_skill` 目录下的文件变更。\n    *   **处理**：系统读取该技能附带的 `eval.config`（评估契约），其中定义了测试提示词（prompt）、预期结果（expected outcome）和所需凭证。\n    *   **输出**：确定需要对该技能运行自动化测试。\n\n2.  **安装与执行 (Install \u0026 Use)**：\n    *   **输入**：干净的沙箱环境、修改后的技能包、`eval.config` 中的提示词。\n    *   **处理**：\n        *   **Executor Agent** 在隔离环境中安装技能。\n        *   执行提示词。由于动作名称不匹配，首次执行失败（抛出 `KeyError`）。\n        *   **关键约束**：Executor 被禁止生成模拟输出（no simulated outputs）。它必须记录真实的失败日志。\n        *   **自我修正**：Executor 检测到错误，自动修改生成的 runner 脚本，将 `segment_train` 改为 `train`，并重新运行，最终成功完成任务。\n        *   **记录**：整个轨迹（包括首次失败、修正动作、最终成功）被记录在 `transcript.md` 中。\n    *   **输出**：最终的任务输出文件、包含完整执行轨迹的 `transcript.md`。\n\n3.  **评估与评分 (Evaluate)**：\n    *   **输入**：`transcript.md`、最终输出文件、**预先定义**的断言集（Assertions，在 Executor 看到输出前基于 `SKILL.md` 生成）。\n    *   **处理**：\n        *   **Grader Subagent** 启动。它是一个独立的子代理，**没有**修改文件或执行代码的权限，只能读取只读信息。\n        *   **首次尝试评分**：Grader 检查 `transcript.md`。它发现断言“技能配置的动作名称无需修改即可工作”在首次尝试中失败。\n        *   **偏差消除**：尽管最终输出成功，但由于存在因果相关的自我修正（self-correction），该断言被标记为 **FAIL**。\n        *   **结构化输出**：生成 `grading.json`，包含每个断言的通过/失败状态、证据引用，以及 `self_correction` 部分，明确列出首次尝试的错误和应用的补丁。\n    *   **输出**：`grading.json`（显示首次尝试通过率低于 100%）、`benchmark.json`。\n\n4.  **分析与建议 (Analyze \u0026 Suggest)**：\n    *   **输入**：`grading.json`、`self_correction` 记录。\n    *   **处理**：\n        *   **Analyzer Subagent** 分析运行分布，识别异常值。\n        *   **Fix Suggester** 生成修复建议。由于失败是由动作名称不匹配引起的，它生成一个 **LV1**（严重/因果相关）建议。\n        *   **证据 grounding**：建议必须引用具体的失败断言或修正记录，禁止生成无根据的“锦上添花”建议。\n    *   **输出**：`fix_suggestions.json`。\n\n5.  **交付 (Delivery)**：\n    *   **输入**：`fix_suggestions.json`、原始代码差异。\n    *   **处理**：系统通过 GitLab API 将 LV1 建议作为内联评论（inline comment）发布到 MR 中，附带“Apply suggestion”按钮。\n    *   **输出**：开发者在 MR 中看到具体的代码差异和一键应用按钮，无需人工排查日志。\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n这篇论文没有复杂的传统数学推导，而是通过形式化定义来阐述**自我修正偏差**（self-correction bias）这一核心问题。以下是其理论背景及直觉解释：\n\n**理论背景**：\n在传统的软件测试中，测试是确定性的。但在 Agentic 系统中，Agent 具有工具使用能力（如编辑文件、运行 bash），这意味着执行过程本身会改变环境。如果同一个 Agent 既负责执行又负责评分，它可能会在失败后自动修复错误，然后对修复后的结果进行评分，导致评分结果反映的是 Agent 的调试能力，而非技能本身的质量。\n\n**核心形式化定义**：\n1.  **执行轨迹与修正**：\n    令 $\\tau$ 为 Agent 的执行轨迹，$\\Delta(\\tau)$ 为轨迹中对技能文件进行的编辑集合。\n    *   **直觉**：如果 $\\Delta(\\tau) = \\emptyset$，说明 Agent 没有修改技能，直接运行成功；如果 $\\Delta(\\tau) \\neq \\emptyset$，说明 Agent 进行了自我修正。\n\n2.  **朴素评估器（Naive Evaluator）的缺陷**：\n    定义朴素评估函数 $\\hat{q}_{naive}(s)$。\n    $$ \\hat{q}_{naive}(s) = 1 \\iff \\text{Agent 最终成功} $$\n    *   **直觉**：只要 Agent 能通过任何手段（包括修改代码）让任务成功，朴素评估器就认为技能 $s$ 是合格的（Pass）。这掩盖了技能本身的缺陷。\n\n3.  **真实质量信号（True Quality Signal）**：\n    定义真实质量函数 $q^{[\\star]}(s)$，它仅基于首次尝试（first-attempt）的结果。\n    $$ q^{[\\star]}(s) = 1 \\iff \\text{技能在未修改的情况下直接成功} $$\n    *   **直觉**：只有当技能“开箱即用”时，才认为它是高质量的。\n\n4.  **偏差的本质**：\n    论文指出，当 Agent 具备调试能力时，$\\hat{q}_{naive}(s)$ 会系统地高于 $q^{[\\star]}(s)$。\n    *   **直觉**：一个“可修复”（fixable）但“有缺陷”（broken）的技能，在朴素评估下会显示为 100% 通过，而在真实质量评估下会显示为失败。这种偏差是结构性的，源于执行与评分的身份共享（shared identity）。\n\n**解决方案的数学直觉**：\nAEVAL 通过引入信息屏障（information barrier）和首次尝试规则，强制评分器仅基于 $\\tau$ 中的首次尝试部分和预定义的断言 $A$ 进行评分，从而使得输出的信号 $q_{AEVAL}(s)$ 逼近 $q^{[\\star]}(s)$，消除了 $\\Delta(\\tau)$ 对评分结果的污染。\n\n### § 7 实验设计与结论\n\n**提出了什么问题**：\n现有的 Agentic 技能评估主要依赖人工轶事性测试，缺乏可重复性和可比性。更严重的是，由于 Agent 的自我修正能力，传统的自动化评估会产生**自我修正偏差**（self-correction bias），导致虚假的高通过率（spurious 100% pass rates），无法真实反映技能质量。\n\n**设计了什么实验验证这个问题**：\n1.  **退化技能案例研究（Case Study）**：\n    *   设计一个故意存在缺陷的技能（动作名称不匹配）。\n    *   对比**朴素评估器**（Naive Evaluator）与 **AEVAL 协议** 的结果。\n    *   观察朴素评估器是否因 Agent 的自我修正而给出错误的高分，以及 AEVAL 是否能通过首次尝试评分和结构化日志准确识别缺陷。\n\n2.  **跨运行时校准实验（Cross-runtime Calibration）**：\n    *   使用相同的技能和 `eval.config`，在两个不同的 Agent 后端（Backend A: Claude-family, Backend B: GPT-family）上运行多次。\n    *   比较两个后端的**通过率**（Pass rates）、**因果份额**（Causal share，即 LV1 建议占比）、**自我修正次数**和**协议保真度**（Protocol fidelity）。\n    *   验证 AEVAL 是否能提供机器可读的、可比较的信号，并揭示不同后端在严重性判断上的系统性差异。\n\n3.  **建议稳定性测试（Suggestion Stability）**：\n    *   对比引入“证据 grounding”规则前后，同一 MR 多次运行产生的建议集合的重叠度。\n    *   验证规则是否消除了投机性建议（speculative churn），提高了信号的可重复性。\n\n**问题的答案是什么**：\n1.  **自我修正偏差确实存在且严重**：在退化技能案例中，朴素评估器给出了 100% 的通过率，掩盖了配置错误；而 AEVAL 准确报告了首次尝试失败，并生成了精确的 LV1 修复建议。\n2.  **AEVAL 提供了可靠且可比较的信号**：跨运行时实验显示，虽然不同后端的原始通过率重叠且不具备区分度，但**因果份额**（Causal share）和**自我修正计数**等结构化指标清晰地揭示了后端间的差异（如 Backend B 更倾向于将配置问题标记为阻塞性错误）。这证明了 AEVAL 的信号适合下游的不确定性量化方法。\n3.  **结构化约束提高了稳定性**：引入证据 grounding 和分层建议后，重复运行的建议集合收敛于相同的因果相关集合，消除了之前的随机性和不一致性。\n4.  **结论**：AEVAL 成功将轶事性评估转化为确定性的 CI 管道，通过结构分离消除了自我修正偏差，为 Agentic 技能的质量控制提供了可审计、可重复的基础设施。", "additional_insights": "### § 8 Take-aways\n\nAEVAL 框架的核心贡献在于将 Agentic Skill 的评估从主观的 Anecdotal Testing 转变为基于 CI 的 Deterministic Testing，通过引入 `eval.config` 作为声明式测试契约，实现了技能变更的自动化触发与可复现验证。该框架识别并形式化了 Agentic Evaluation 中的 Self-Correction Bias 问题，即当 Executor 与 Grader 为同一 Agent 时，Agent 会利用其调试能力修复技能缺陷并掩盖初始失败，导致评估信号失真。为解决此偏差，AEVAL 实施了 Executor 与 Grader 的结构化分离（Structural Separation），并强制执行 First-Attempt Grading Rule，确保质量信号仅基于首次执行轨迹而非修复后的状态。此外，框架引入了 Grounded, Tiered Fix Suggestions 机制，将修复建议分为因果相关的 LV1（阻塞合并）和质量改进的 LV2（建议性），并通过 Inline MR Comments 直接提供可一键应用的代码补丁，从而在 Merge Request 阶段闭环测试-修复流程。实证研究表明，该协议能有效区分不同 Agent Backend 的校准差异（如 Causal Share 指标），并将原本虚假的 100% 通过率转化为具有审计记录的 First-Attempt FAIL 信号，为下游的不确定性量化提供了可靠的 Ground-Truth 输入。\n\n### § 9 最脆弱的假设\n\nAEVAL 框架最脆弱且关键的假设是：**Grader Subagent 能够准确且一致地从 Execution Transcript 中识别出哪些修改是“因果上必要”的 Self-Correction，并严格遵循 First-Attempt Grading Rule 进行判定。**\n\n如果这一假设不成立，核心贡献将直接失效，因为结构化分离的意义在于防止 Executor 的修复行为污染评估结果，但如果 Grader 无法正确区分“技能本身正确但环境波动导致的重试”与“技能缺陷导致的修复”，或者 Grader 自身存在判断偏差（如过度宽松或过度严格），那么 First-Attempt Pass Rate 将失去其作为可靠质量信号的意义，重新退化为噪声。\n\n在实际中，该假设可能不成立的原因包括：\n1.  **复杂的多步修正归因困难**：当 Agent 进行多步、非线性的自我修正时，Grader 可能难以精确追溯哪一步修正直接导致了最终的成功，导致误判（False Negative 或 False Positive）。\n2.  **Grader 自身的校准偏差**：如论文 Section 7.1 所示，不同 Backend 的 Grader 对同一问题的严重性分级（LV1 vs LV2）存在显著差异（Causal Share 差距达 0.41），这表明 Grader 的判断具有主观性和模型依赖性，而非绝对客观。\n3.  **Transcript 信息的局限性**：如果 Execution Transcript 未能完整记录 Agent 的内部推理过程或隐式状态变化，Grader 仅凭日志和输出文件可能无法准确推断修正的因果必要性。\n\n论文提供的证据显示，虽然结构化分离消除了 Executor 的自我偏好，但 Grader 的判断仍存在跨运行时的不一致性（Cross-runtime calibration gap），且论文承认 First-Attempt Rule 依赖于 Grader 正确识别因果修正的能力，复杂修正可能导致误归因。论文缺乏对 Grader 判断一致性的长期稳定性验证，也未提供解决 Grader 自身偏差的校准机制，仅将其作为未来工作（如 Conformal Calibration）。\n\n### § 10 最小复现实验\n\n在 1 周内，可以设计一个最小复现实验来验证 **Self-Correction Bias 的存在及其对评估信号的影响**，无需复现完整的 AEVAL 系统。\n\n**实验设计：**\n1.  **数据**：选择一个简单的 Agentic Skill（如一个包含故意错误配置或代码逻辑的 Python 脚本），并定义一个明确的 `eval.config`（包含测试 Prompt 和预期输出）。\n2.  **实现**：\n    *   **Naive Evaluator**：使用一个通用的 LLM Agent（如 Claude 或 GPT-4o）作为 Executor 和 Grader。让 Agent 执行技能，如果失败，允许其自我修正（Self-Correction），然后让同一个 Agent 评估最终结果是否成功。\n    *   **AEVAL-like Evaluator**：使用相同的 LLM Agent 作为 Executor，但禁止其自我修正（或记录修正行为）。执行后，将 Execution Transcript 和最终输出传递给一个独立的 Grader Prompt（模拟 AEVAL 的 Grader），强制其仅基于 First-Attempt 的结果进行判定，并忽略后续修正。\n3.  **测量**：\n    *   记录 Naive Evaluator 的 Pass Rate。\n    *   记录 AEVAL-like Evaluator 的 First-Attempt Pass Rate。\n    *   统计 Executor 在 Naive 模式下进行的 Self-Correction 次数。\n4.  **结果判定**：\n    *   **支持 Claim**：如果 Naive Evaluator 的 Pass Rate 显著高于 AEVAL-like Evaluator 的 First-Attempt Pass Rate（例如 Naive 为 100%，AEVAL-like 为 0% 或低通过率），且 Self-Correction 次数与失败案例数正相关，则证明 Self-Correction Bias 存在，且结构化分离能有效揭示真实缺陷。\n    *   **反驳 Claim**：如果两者 Pass Rate 无显著差异，或 Grader 无法准确识别修正行为，则表明该 Bias 在简单场景下不显著，或 Grader 的判定机制存在根本缺陷。\n\n此实验聚焦于核心问题（Bias 的存在与检测），避免了复杂的 CI 集成和多运行时校准，能在短时间内验证 AEVAL 的核心动机。", "research_value": "### § 11 最强反例设计\n\n要挑战 AEVAL 的核心主张，最有力的攻击并非针对其工程实现的复杂性，而是针对其**First-Attempt Grading Rule**在**非确定性环境**（Non-deterministic Environments）下的有效性假设。AEVAL 假设“首次尝试失败”等价于“Skill 缺陷”，但这一逻辑在涉及外部 API、网络波动或并发资源竞争的场景中会系统性失效，导致极高的**False Positive**率，从而破坏 CI 流水线的可靠性。\n\n具体反例设计如下：构建一个名为 `weather_data_fetcher` 的 Skill，其功能是调用一个真实的、具有速率限制（Rate Limiting）和偶尔超时（Timeout）的第三方气象 API。在 `eval.config` 中定义预期结果为“返回当前温度”。\n1.  **场景设定**：该 Skill 的代码逻辑完全正确，但目标 API 在测试期间因高负载返回了 `503 Service Unavailable` 或 `429 Too Many Requests`。\n2.  **AEVAL 的行为**：\n    *   **Executor** 首次调用 API 失败。根据 AEVAL 协议，Executor 被禁止模拟输出，且必须记录真实失败。\n    *   **Self-Correction**：Executor 检测到错误，可能尝试重试（如果允许）或修改请求头，最终在第二次尝试中成功获取数据。\n    *   **Grader**：检查 `transcript.md`，发现首次尝试失败，且存在 `self_correction` 记录。根据 **First-Attempt Grading Rule**，Grader 判定该断言为 **FAIL**，并生成 LV1 修复建议（例如：“增加重试逻辑”或“处理 503 错误”）。\n3.  **攻击点**：\n    *   **替代解释**：失败并非源于 Skill 的代码缺陷（Code Defect），而是源于**环境噪声**（Environmental Noise）。Skill 本身是健壮的（Robust），但在特定时间点的测试中表现不佳。\n    *   **后果**：AEVAL 将“环境波动”误判为“代码回归”，导致 CI 流水线频繁误报（Flaky Tests）。在大规模 Skill 市场中，如果大量 Skill 依赖外部服务，AEVAL 产生的 **First-Attempt Pass Rate** 将不再反映代码质量，而是反映外部服务的稳定性。这将迫使开发者为了通过测试而过度工程化（Over-engineering），例如在每个 Skill 中硬编码复杂的重试和熔断机制，反而降低了 Skill 的通用性和可维护性。\n    *   **理论论证**：AEVAL 的形式化定义 $q^{[\\star]}(s)$ 隐含了“确定性执行”的假设。在概率性环境中，$\\Delta(\\tau)$（修正动作）可能仅仅是为了应对随机噪声，而非修复逻辑错误。因此，AEVAL 无法区分 **Logical Failure** 和 **Stochastic Failure**，其核心指标 **First-Attempt Pass Rate** 在真实世界的大规模部署中可能失去区分度，退化为一个衡量“测试环境稳定性”的指标，而非“Skill 质量”的指标。\n\n### § 12 Follow-up Research Idea\n\n基于 AEVAL 在**环境噪声**和**Grader 主观性**方面的局限，提出一个新的研究方向：**Probabilistic Agentic Testing with Conformal Calibration**（基于共形校准的概率性 Agent 测试）。\n\n**(a) 驱动局限与未满足需求**：\nAEVAL 试图通过“首次尝试”规则将评估转化为二元确定性信号（Pass/Fail），但这忽略了 Agentic 系统固有的**非确定性**（Non-determinism）和**环境依赖性**。真实世界的 Skill 往往需要在概率性环境中运行，且 Grader 的判断存在模型偏差。现有的方法缺乏对**不确定性**（Uncertainty）的量化，导致无法区分“代码错误”与“随机失败”，也无法提供具有统计保证的质量信号。\n\n**(b) 借鉴相邻领域的方法**：\n借鉴**Conformal Prediction**（共形预测）和**Statistical Hypothesis Testing**（统计假设检验）中的思想。在机器学习模型评估中，共形预测可以为预测结果提供具有严格覆盖率保证的置信区间。我们可以将这一思想迁移到 Agentic Skill 评估中，不再追求单一的“首次尝试”结果，而是通过**多次独立采样**（Multiple Independent Sampling）来构建 Skill 质量的**置信区间**（Confidence Interval）。\n\n**(c) 第一个实验设计**：\n1.  **框架设计**：开发一个 **Probabilistic AEVAL** 原型。对于每个 Skill 变更，不在单次运行中判定 Pass/Fail，而是并行运行 $N$ 次（例如 $N=10$）独立的 Executor 实例，每次使用不同的随机种子或模拟不同的环境噪声（如模拟 API 延迟）。\n2.  **共形校准**：收集 $N$ 次运行的结果（包括首次尝试成功/失败、自我修正次数、最终输出相似度）。利用共形预测算法，计算该 Skill 在“无代码缺陷”假设下的**非一致性分数**（Non-conformity Score）。\n3.  **输出信号**：不再输出二元的 Pass/Fail，而是输出一个**质量置信区间**（Quality Confidence Interval），例如：“该 Skill 在 95% 置信水平下，首次尝试通过率介于 80%-95% 之间”。同时，利用 **Conformal Calibration** 对 Grader 的判断进行校准，消除不同 Backend 之间的系统性偏差。\n4.  **验证**：在包含外部 API 调用的 Skill 集上运行实验，对比 AEVAL（二元信号）与 Probabilistic AEVAL（概率信号）在**Flaky Test 识别率**和**误报率**上的表现。预期结果是，Probabilistic AEVAL 能够准确识别出因环境噪声导致的失败，而不将其误判为代码缺陷，从而提供更稳健、可解释的质量信号。\n\n这一方向将 Agentic 测试从“确定性断言”推向“概率性保证”，解决了 AEVAL 在非确定性环境中的根本性缺陷，并为下游 CI 系统提供了更丰富的决策依据（如：根据置信区间决定是阻塞合并还是标记为警告）。", "research_value_source": "legacy_research_value", "research_value_model": "sjtu:qwen,sjtu:deepseek-chat,sjtu:minimax", "research_value_reasoning_effort": "", "affiliations": "```json\n{\n  \"authors\": [\n    {\n      \"name\": \"Tejas Singh Anand\",\n      \"affiliations\": [\n        1,\n        2\n      ],\n      \"markers\": [\n        \"*\"\n      ]\n    },\n    {\n      \"name\": \"Yuet Ying Christina Wang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Wanting Jiang\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Steve Masson\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Tian Zheng\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    },\n    {\n      \"name\": \"Bingjie Zhou\",\n      \"affiliations\": [\n        1\n      ],\n      \"markers\": []\n    }\n  ],\n  \"institutions\": [\n    {\n      \"id\": 1,\n      \"name\": \"NVIDIA\"\n    },\n    {\n      \"id\": 2,\n      \"name\": \"University of Waterloo\"\n    }\n  ],\n  \"footnotes\": [\n    {\n      \"marker\": \"*\",\n      \"text\": \"Tejas Singh Anand contributed to this work during an internship at NVIDIA.\"\n    }\n  ]\n}\n```", "summary_translation": "现代智能体系统日益依赖于技能：即包含自然语言和代码的可安装包，用于教导大语言模型智能体执行特定领域任务。随着技能仓库的不断增长，开发者需要在每次变更时获得自动化的质量信号，然而当前的评估主要依赖轶事证据：开发者要求智能体“尝试该技能”，观看演示，并形成主观印象。这种做法既无法保证运行间的可复现性，也无法实现版本间的可比性，且在市场环境中扩展性较差，其中一次回归可能悄无声息地破坏数十个下游工作流。我们提出了 AEVAL（Agentic Evaluation），这是一个集成于 CI 的框架，用确定性的、可复现的智能体技能测试流水线取代了上述实践。每次技能变更都会触发测试事件：技能在自动化执行器中针对开发者声明的评估契约（eval.config）运行，发出结构化的、基于证据的质量信号，供下游 CI 进行路由处理。一个关键要素是执行器与评分器之间的结构分离，这防止了一种微妙但普遍存在的故障模式：智能体在执行过程中静默自我修正，随后将其修补后的输出评分为通过。我们的贡献包括：(i) 一种确定性的、由变更触发的评估协议，包含每个技能的契约和每次运行的工件模式；(ii) 将自我修正偏差形式化为朴素智能体评估器的一种独特故障模式；(iii) 执行器/评分器分离机制，采用首次尝试评分规则和显式的自我修正跟踪；以及 (iv) 分层、基于证据的修复建议方案（LV1 因果，LV2 质量），作为内联合并请求评论发布。在跨多个智能体 SDK 的生产级智能体堆栈中的真实技能上验证表明，AEVAL 将虚假的 100% 通过率转化为可复现的首次尝试失败信号，并附带每次执行器修复的可审计记录。"}]}, {"name": "Domain-Specific Applications", "count": 4, "papers": [{"title": "EvolvingWorld: An Open-Schema Framework for Co-Evolving Role-Play Agents and World Model in Interactive Literary World", "arxiv_id": "2607.17250", "authors": "Qing Zong, Yue Guo, Mengxin Yang, Yiwen Guo, Yangqiu Song", "summary": "This paper introduces EvolvingWorld, a framework and benchmark for character and world co-evolution in interactive literary worlds. Existing systems either treat interactive literary simulation as static persona imitation or isolated scene generation, failing to capture how characters and worlds evolve together over time. To address this, EvolvingWorld models literary simulation as a long-horizon process where characters interact, scenes progress, and character and world states are persistently updated. Unlike prior systems relying on fixed schemas, EvolvingWorld adopts an open-schema framework to support simulation across diverse literary worlds. The framework consists of two coupled modules: a Character Agent for multi-character role-play and persistent profile evolution, and an LLM-based World Model for global and location/entity-level state maintenance and scene progression. Based on this architecture, we formulate 7 trainable tasks for scene initialization, interaction generation, and state update. We construct a dataset from 57 books, producing 138,596 supervised training samples and 222 snapshots for testing. Furthermore, we introduce a trajectory-level LLM-as-Judge evaluation protocol spanning 10 dimensions and 20 metrics. Experiments show that EvolvingWorld can improve long-horizon simulation by effectively maintaining persistent, coherent character and world development.", "category": "cs.CL", "cluster": "Domain-Specific Applications", "tags": ["cs.CL"], "filter_reason": "确定性主题保留：标题和摘要命中强相关信号 (Agent capability/behavior)。该规则用于避免模型把明显的 LLM Agent / Agentic / Self-Evolving 论文误判为过窄范围之外。 但 selection_score=6 需要 LLM 细筛确认边界排除项。 LLM 细筛结果: 该论文符合研究范围，主要基于以下核心依据：\n\n1.  核心对象为LLM智能体及其演化机制：论文提出的 EvolvingWorld 框架明确包含一个“Character Agent”（角色智能体），其核心功能不仅是角色扮演，更关键的是实现了“persistent profile evolution”（持久化档案演化）。这直接对应了研究焦点中的“单智能体”方向下的记忆（Memory）和自我演化（Self-Evolving）能力。智能体通过长期交互不断更新自身状态，属于典型的 Agentic 行为建模。\n\n2.  涉及多智能体协作与长期决策：论文描述了“multi-character role-play”（多角色角色扮演）以及角色与世界模型的共同演化（co-evolution）。这涉及多智能体系统中的交互机制和长期状态维护，符合“多智能体”方向中关于协作机制和长期行为的研究，且不仅仅是简单的拓扑或通信协议，而是关注智能体在交互中的状态更新和演化逻辑。\n\n3.  符合“构建/改进智能体”的标准：论文不仅提出了框架，还构建了数据集和评估基准，旨在解决现有系统在“long-horizon process”（长期过程）中无法捕捉角色与世界共同演化的问题。其贡献在于设计了一种新的智能体架构（开放模式框架）来支持这种演化，属于构建和改进 LLM 智能体方法论的范畴。\n\n4.  排除项检查：\n       虽然应用场景是“文学世界”，但核心贡献是智能体的演化机制和框架设计，而非单纯的应用落地，因此不属于“非演化型应用”。\n       不涉及安全、对齐、图神经网络或多模态视觉等排除项。\n       虽然涉及世界模型，但世界模型在此处作为智能体交互环境的一部分，且与智能体共同演化，符合“Agent Harness/Environment”自动改进或协同演化的保留规则。\n\n综上，该论文深入探讨了LLM智能体在长期交互中的状态演化、记忆保持及多智能体协作，完全契合“LLM智能体及其演化”的研究主题。", "intro_logic": "### § 1 研究问题与重要性\n\n本文提出的核心研究问题是：如何在交互式文学世界（Interactive Literary World）中实现角色（Character）与世界（World）的长期、协同演化（Co-evolution），特别是如何突破静态人设（Static Persona）和固定模式（Fixed Schema）的限制，支持开放模式（Open-Schema）下的状态持久化更新。现有的角色扮演系统通常将文学模拟简化为静态人设模仿或孤立的场景生成，无法捕捉随着故事展开，角色的信念、动机、关系以及地点、物体、背景条件如何共同发生动态变化。\n\n这一问题的重要性在于，真实的文学叙事是一个长视界（Long-horizon）过程，角色与世界的状态是相互耦合且持续演进的。如果仅关注下一句对话的合理性而忽略状态的连贯性，模拟结果会在长程交互中出现严重的性能退化（Performance Degradation），导致角色行为前后矛盾或世界状态逻辑断裂。解决这一问题能够带来以下价值：首先，它推动了角色扮演代理从单纯的“对话模仿”向“ grounded, continuously developing world”的模拟转变，使代理能够基于交互证据而非预设字段进行深度发展；其次，通过引入开放模式，系统能够适应不同体裁和背景的文学作品，无需为每本书定义固定的属性槽位，极大地提升了框架的可扩展性；最后，该研究为长视界多智能体模拟提供了新的基准和评估协议，量化了角色一致性与世界演化质量，为构建更丰富、可控的交互式叙事系统奠定了基础。\n\n### § 2 前人工作与不足\n\n尽管角色扮演代理（Role-Play Agents）和多智能体环境（Multi-Agent Environments）已有大量研究，但针对交互式文学世界的长期协同演化问题，现有工作仍存在显著不足。\n\n首先，大多数基于人设的代理系统（如 ChatHaruhi, CharacterLLM, RoleLLM, DITTO, SimsChat 等）依赖于静态配置文件或短对话上下文。这些系统通常将角色视为静态锚点（Static Anchors），仅通过检索记忆或简单的心理状态更新来维持一致性，缺乏对角色深层属性（如性格、社会地位）随时间演化的建模能力。例如，BookWorld (Ran et al., 2025) 虽然尝试更新角色的目标和状态，但其更新仅限于少数预定义字段，且缺乏完整的配置文件演化（Full Profile Evolution）和位置/实体级别的世界状态更新，导致其无法捕捉细微的性格转变或环境细节变化。\n\n其次，现有的多智能体环境（如 Generative Agents, LARP, CharacterBox）通常依赖于手动指定的沙盒（Manually Specified Sandboxes）或固定模式（Fixed Schema）。这些系统难以扩展到多样化的文学世界，因为不同书籍的角色维度（如侦探的调查习惯 vs. 维多利亚孤儿的社會地位）和世界维度（如学校规则 vs. 政治秩序）差异巨大。固定模式迫使所有故事适应相同的属性槽位，丢失了特定于文本的语义细节。此外，这些系统往往缺乏对世界状态的细粒度跟踪，例如 Generative Agents 以天为粒度更新记忆，而非以场景为粒度进行文学性的状态推进，导致其更适合日常例行公事而非戏剧性的场景演进。\n\n最后，现有的基于书籍的系统（如 CoSER, AdaMARP）主要关注单场景角色扮演或部分长视界更新，缺乏对世界模型（World Model）的显式建模。它们通常假设世界是被动背景，或者仅通过全局事件字段进行粗略更新，忽略了位置级（Location-level）和实体级（Entity-level）的状态变化。这种缺失导致角色与环境之间的互动缺乏 grounding，无法体现角色行动如何重塑环境，以及环境变化如何反过来影响角色动机。\n\n综上所述，前人工作的不足主要源于：1) 对角色和世界状态的静态或固定模式假设，限制了长期演化的表达能力；2) 缺乏对世界状态的细粒度、开放模式建模，导致环境互动缺乏真实感；3) 评测体系多关注局部对话质量，缺乏对长视界轨迹中状态一致性和演化质量的量化评估。EvolvingWorld 通过引入开放模式的 Character Agent 和 LLM-based World Model，以及轨迹级（Trajectory-level）的评估协议，填补了这些空白。", "core_insight": "### § 3 重建作者的思考路径\n\n在阅读大量角色扮演Agent相关工作后，一个认真的研究者会注意到一个反复出现的模式：几乎所有系统都将角色视为静态的 persona 锚点。ChatHaruhi、CharacterLLM、RoleLLM 等工作专注于让模型模仿特定角色的对话风格，但一旦对话结束，角色状态就完全保持不变。这与人类阅读文学作品的体验形成了鲜明对比——当我们追踪一个角色从小说开头到结尾时，我们清晰地感知到他们的信念在动摇、关系在演变、动机在重构。\n\n研究者进一步审视多Agent系统时会发现另一个问题。GenerativeAgents 和 LARP 等系统虽然实现了多角色交互，但它们的世界是预先手工定义的沙盒环境。当研究者试图将这些系统扩展到不同的文学世界时——比如从维多利亚时代的伦敦转移到中土世界——他们必须重新构建整个世界模型，因为系统本身没有任何机制来从文本中自动提取和表示世界的状态。更关键的是，这些系统中的世界是\"被动背景\"，角色可以自由行动而不影响环境的持久状态。\n\n在审视 BookWorld 等书籍驱动的系统时，研究者发现了一个更微妙的失败模式：虽然 BookWorld 尝试进行长期演化，但它只更新了几个预定义的字符字段（如目标和状态），而将更广泛的人格特征和关系视为静态。同时，其世界Agent只维护一个全局事件字段，完全缺乏对位置级别和实体级别世界状态的追踪。这导致了一个根本性的问题——当角色在场景中打开一封信后，这封信的状态变化无法被系统记录；当角色离开一个地点前往另一个地点时，地点的物理状态变化也无法被追踪。\n\n研究者从这些失败模式中提炼出几个关键洞察。首先，文学世界中的演化是多维度的——角色的\"核心人格\"可能保持稳定，但\"当前情绪\"、\"与他人的关系\"甚至\"核心动机\"都可能随着故事推进而改变。试图用固定字段来捕捉这种演化必然会导致信息丢失。其次，世界本身也是主动的参与者——地点会变化、物体会被移动、社会规则会被打破，这些变化应该反过来影响角色的行为和决策。第三，不同维度的演化速度是不同的：情绪可以在一个场景内剧烈波动，而人格特质可能需要跨越多个场景的累积证据才能改变。这意味着系统需要一个机制来\"暂存\"弱信号，而不是在第一次出现时就匆忙更新角色状态。\n\n研究者还注意到一个理论线索：成功的长期模拟需要\"耦合演化\"——角色行为改变世界状态，而世界状态的变化又为后续的角色行为提供约束和机会。这形成了一个反馈循环，而不是单向的因果链。例如，如果角色在一个场景中打破了邻居的窗户，这个物理状态变化应该被记录；在下一个场景中，邻居可能会愤怒地出现，或者窗户的破损状态会影响场景的氛围。这种耦合是现有系统所缺乏的。\n\n### § 4 核心 Intuition\n\nEvolvingWorld 的核心 Intuition 可以用一句话概括：**文学世界的长期模拟需要将角色和世界都视为持续演化的实体，而非静态的描述或被动的背景。**\n\n具体而言，作者发现先前方法的根本问题在于将角色演化（Character Evolution）和世界演化（World Evolution）视为两个独立且可选的组件，而实际上它们应该是耦合的——角色的每一个行动都可能改变世界的持久状态，而世界的每一个变化都可能成为后续角色行为的约束或机会。\n\n为了让这个耦合演化真正运作，系统必须采用\"开放模式\"（Open-Schema）而非固定字段：不同文学世界的相关维度差异巨大——侦探小说需要追踪\"调查进度\"，而成长小说需要追踪\"心理成熟度\"，系统必须能够从每个具体世界中自动发现和表示这些维度，而不是强迫所有故事适应预定义的通用字段。\n\n最后，为了处理不同演化速度的问题，系统需要引入\"隐藏追踪器\"（Hidden Tracker）机制——将弱信号或尚未确认的演化证据暂时存储在角色状态之外，直到累积的证据跨过某个阈值，才将这些变化正式写入角色档案。这防止了系统因为单个场景中的情绪波动而频繁修改角色的核心人格描述。", "methodology": "### § 5 具体方法与完整 Pipeline\n\n**EvolvingWorld** 的核心方法是将交互式文学世界模拟重构为一个长视界的（long-horizon）过程，通过耦合 **Character Agent**（角色智能体）和 **World Model**（世界模型）来实现角色与世界的共同演化（co-evolution）。其核心创新在于采用 **Open-Schema**（开放模式）设计，即不预设固定的属性槽位，而是根据具体书籍动态推断角色和世界的关键维度。\n\n以下是基于《玩偶之家》（A Doll’s House）场景 19 到 20 的完整 Pipeline 解析：\n\n#### 1. 输入：结构化快照（Structured Snapshot）\n系统从一个特定的时间点开始模拟，输入包括：\n*   **Global World State**：全局世界状态，如“19世纪资产阶级社会秩序”、“婚姻/家庭：丈夫是供养者”。\n*   **Location World State**：特定地点的物理状态，如“Helmer公寓：节日的残余物仍在”、“重要实体：信箱（内含信件）”。\n*   **Character States**：每个角色的开放模式档案（Profile）和隐藏追踪器（Hidden Tracker）。例如 Nora 的核心人格包含“厌恶与恐惧的状态”，Torvald 的职业身份是“律师”。\n\n#### 2. 处理：七步协同演化任务（7-Task Co-Evolution Pipeline）\n模拟过程按顺序执行以下七个任务，形成闭环：\n\n*   **Task 1: Scene Cast (场景选角)**\n    *   **World Model** 决定下一场戏的参与者。\n    *   *例子*：系统判断下一场戏涉及 Nora 和 Torvald，因此将 `zt` 设为 `[Nora, Torvald]`。\n\n*   **Task 2: Location Scenario (地点与情境规划)**\n    *   **World Model** 确定地点和具体情境。\n    *   *例子*：地点为“Helmer公寓客厅”，情境为“深夜，Torvald 熄灭前门灯后”。\n\n*   **Task 3: Motivation Update (动机更新)**\n    *   **Character Agent** 为每个参与者生成进入该场景的即时动机。\n    *   *例子*：Nora 的动机更新为“我的全部身心现在都集中在……”（基于她之前的恐惧和即将面对的信件事件）。\n\n*   **Task 4: Next Character (下一说话者选择)**\n    *   **World Model** 在当前场景内决定谁接下来行动。\n    *   *例子*：系统选择 Torvald 先行动，或者选择 Environment（环境）描述。\n\n*   **Task 5: Interaction Generation (交互生成)**\n    *   **Character Agent** 生成具体交互，包含思维 `[thought]`、言语 `speech` 和行动 `(action)`。\n    *   *例子*：Nora 执行动作 `(Take out the contents of the letter box and go to the kitchen)`，并说出 `\"Helen!—Helen, put out the light over the front door...\"`。注意：只有角色自己的思维对 Agent 可见。\n\n*   **Task 6: World Update (世界状态更新)**\n    *   **World Model** 根据交互更新全局或地点状态。\n    *   *例子*：由于 Nora 拿走了信件，`Location State` 中的 `Letter box` 状态从 `contains letter` 更新为 `empty`。全局状态若无重大社会变革则保持不变（$\\Delta = \\emptyset$）。\n\n*   **Task 7: Character Update (角色状态更新)**\n    *   **Character Agent** 在场景结束后更新角色档案。这里引入了 **Hidden Tracker** 机制：\n        *   如果证据不足，变化存入 Hidden Tracker。\n        *   如果证据累积超过阈值，则更新 Profile。\n    *   *例子*：Nora 的恐惧结晶为“冷静的决心”（cold resolve）。系统判断这是一个重大的人格转变，因此更新 `Core Personality` 维度，而不仅仅是记录在追踪器中。\n\n#### 3. 输出：演化后的轨迹（Evolved Trajectory）\n*   **新的世界状态**：信箱为空，公寓氛围改变。\n*   **新的角色状态**：Nora 的人格档案已更新，反映了从恐惧到决心的转变。\n*   **交互历史**：生成的对话和行动序列，用于下一轮模拟或评估。\n\n---\n\n### § 6 核心数学推导（无形式化数学则跳过）\n\n**跳过**。\n本文主要是一个系统工程与基准测试（Benchmark）论文，侧重于框架设计、数据构建和评估协议，而非提出新的数学理论或复杂的推导公式。文中涉及的符号（如 $S_w$, $S_c$, $\\pi_{cast}$ 等）主要用于定义状态空间和策略函数，以形式化描述 Pipeline 的数据流，不涉及需要深入解释的数学推导过程。\n\n---\n\n### § 7 实验设计与结论\n\n**1. 问题：现有的角色扮演系统是否能在长视界（long-horizon）下保持角色与世界的连贯演化？**\n*   **实验设计**：\n    *   构建了包含 57 本书、138,596 个训练样本和 222 个测试快照的 **EvolvingWorld** 数据集。\n    *   设计了 **Trajectory-level LLM-as-Judge** 评估协议，涵盖 10 个维度、20 个指标（如 Character Consistency, Evolution Quality, World State Maintenance 等），不仅评估单轮对话，还评估多场景下的状态一致性。\n    *   对比了未训练的基座模型、仅针对角色扮演微调的模型（如 CoSER, Crab）以及使用 EvolvingWorld 数据微调的模型（EW-trained）。\n*   **结论**：\n    *   现有的静态档案或仅关注对话模仿的系统在长视界模拟中会出现性能退化（performance degradation）。\n    *   EvolvingWorld 框架通过显式维护角色和世界状态，显著减少了这种退化，证明了 **co-evolution**（共同演化）对于长视界模拟的必要性。\n\n**2. 问题：开放模式（Open-Schema）和隐藏追踪器（Hidden Tracker）是否比固定模式更有效？**\n*   **实验设计**：\n    *   进行消融实验（Ablation Study）：\n        *   移除 **Hidden Tracker**，直接更新 Profile。\n        *   将 **Open-Schema** 替换为固定模式（Fixed Schema，如固定的背景、性格、关系字段）。\n        *   移除世界状态更新或角色状态更新。\n*   **结论**：\n    *   移除 Hidden Tracker 导致 **Profile Update Fidelity (PUF)** 和 **Profile Evolution Smoothness (PES)** 显著下降，证明积累弱证据再更新档案对于平滑演化至关重要。\n    *   固定模式在捕捉多样化文学世界的细微差别上不如开放模式，导致世界状态维护（World State Maintenance）得分降低。\n    *   角色状态和世界状态的更新是耦合的，移除任一方都会损害另一方的表现（例如，没有世界更新，角色的环境感知能力下降）。\n\n**3. 问题：EvolvingWorld 相比现有的长视界基准（如 BookWorld）有何优势？**\n*   **实验设计**：\n    *   直接对比 **EvolvingWorld** 与 **BookWorld** 在相同测试集上的表现。\n    *   重点观察随着模拟场景数量增加（Length-wise comparison），关键指标（如 PES 和 SCC）的变化趋势。\n*   **结论**：\n    *   BookWorld 随着模拟长度增加，角色演化平滑度（PES）和场景连贯性（SCC）显著下降。\n    *   EvolvingWorld 不仅保持了较高的分数，且在长轨迹中 PES 甚至有所提升，证明其结构化状态更新机制能更好地支持长视界演化。\n    *   EvolvingWorld 在环境接地（Environmental Grounding）和世界状态维护上表现更优，因为它支持实体级别（entity-level）的状态更新，而 BookWorld 仅更新全局事件。", "additional_insights": "### § 8 Take-aways\n\nEvolvingWorld 将文学世界模拟重新定义为长视界的 **open-schema co-evolution** 过程，突破了以往系统依赖固定 schema 和静态 persona 的局限。该框架通过耦合 **Character Agent** 与 **World Model**，实现了角色档案与全球/位置/实体级世界状态的持久化更新与相互驱动。引入 **hidden tracker** 机制解决了多时间尺度演化问题，通过累积弱证据来防止角色档案的过早或突变更新，从而保证演化的平滑性。基于 57 本书籍构建的基准测试包含 138,596 个监督样本，并提出了涵盖 10 个维度、20 个指标的轨迹级 **LLM-as-Judge** 评估协议。实验表明，经过 EvolvingWorld 训练的模型在长视界模拟中显著减少了性能退化，且在角色一致性、演化质量及世界状态维护上优于仅进行角色扮演训练的基线模型。\n\n### § 9 最脆弱的假设\n\n该方法最核心的脆弱假设是：**LLM 能够仅凭文本交互和有限的“前瞻”（look-ahead）信息，准确推断出符合原著逻辑的、细粒度的世界状态变化（如实体位置、社会秩序微调）和角色心理演变，且这种推断具有足够的稳定性以支撑长程模拟。**\n\n如果这一假设不成立，即 LLM 在缺乏明确文本证据时产生幻觉或逻辑断裂，那么 **open-schema** 的灵活性将转化为不可控的噪声，导致世界状态与角色行为迅速偏离原著基调，长视界的一致性将彻底崩溃。论文通过 **look-ahead** 机制（利用后续场景作为标注参考）来缓解这一问题，但这本质上是一种“作弊”式的监督信号，在真实推理（inference）阶段无法使用。论文提供的证据主要依赖于 **LLM-as-Judge** 的主观评分和消融实验（如移除 hidden tracker 导致分数下降），但缺乏客观的、基于事实一致性的硬性指标（如实体状态追踪的精确率/召回率）来证明 LLM 在长程中确实能准确维护复杂的物理和社会状态，而非仅仅生成“看起来合理”的文本。\n\n### § 10 最小复现实验\n\n在 1 周内，可以复现 **Hidden Tracker** 对角色演化平滑性的影响，无需构建完整的世界模型。\n\n**数据**：选取 EvolvingWorld 数据集中的一本书（如 *A Doll’s House*）的连续 10-20 个场景，提取角色 Nora 的初始档案、每个场景的交互文本以及官方标注的档案更新点。\n**实现**：构建两个简单的 Prompt 模板。模板 A（Baseline）：直接根据当前场景交互更新角色档案。模板 B（Ours）：引入一个中间变量 `hidden_tracker`，先让 LLM 将场景中的微弱信号写入 tracker，只有当 tracker 中累积的证据达到阈值时，才更新正式档案。使用同一个开源 LLM（如 Qwen2.5-7B-Instruct）进行推理。\n**测量**：计算两个模板生成的档案序列与官方标注档案之间的语义相似度（如使用 Embedding Cosine Similarity 或 LLM-as-Judge 评估 **Profile Evolution Smoothness**）。\n**结果判定**：如果模板 B 在保持档案最终状态准确性的同时，显著减少了中间步骤的剧烈波动（即相似度曲线更平滑，且无重大偏离），则支持 **hidden tracker** 有效管理多时间尺度演化的 claim；反之，若模板 B 导致信息滞后或丢失，则反驳该机制的有效性。", "research_value": "### § 11 最强反例设计\n\n要挑战 **EvolvingWorld** 的有效性，最有力的攻击并非针对其生成的文本流畅度，而是针对其 **Open-Schema** 在长视界（Long-horizon）下维持 **State Consistency** 的能力，特别是当世界状态涉及“不可见”或“隐含”逻辑时。\n\n**反例场景设计：信息不对称与隐性状态漂移（Information Asymmetry \u0026 Implicit State Drift）**\n\n设计一个基于经典悬疑或政治惊悚小说（如《1
